scaffold_corner_design:
  - section: entities
    instances:
      - name: site_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Site
        distinguishing_aspect: "POST /api/sites with the four required inputs returns 201 with status ACTIVE, actual_productivity_units_per_hour null, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["Empty database; clock default"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-E1", name: "Entity Site", address: "1 Main St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id, st: $.data.status, ver: $.data.version, prod: $.data.actual_productivity_units_per_hour }
          trigger: []
          assert:
            - "response status == ACTIVE and version == 1 and actual_productivity_units_per_hour == null"
            - "id is a UUID-shaped string minted by the server"
      - name: site_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - entities.Site
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /api/sites/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"
      - name: site_duplicate_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Second site with the same code is rejected with ERR_DUPLICATE_CODE 409 even though all other fields differ."
        test_recipe:
          setup: ["Site with code S-DUP exists"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-DUP", name: "First", address: "1 A St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
          trigger:
            - call: "POST /api/sites"
              payload: { code: "S-DUP", name: "Second", address: "2 B St", baseline_labor_rate_per_hour: 31.0 }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CODE with HTTP 409"
      - name: assessment_daily_kg_computed_at_creation
        claim_type: computed_field
        grounds:
          - entities.Assessment.fields.daily_kg_estimate
          - calculations.daily_kg_estimate
        distinguishing_aspect: "forklift_count 10 x duty 7.5 x 0.9 with peak_shift_hours 9 (>8 so factor 1.15) yields 77.63 kg — computed, not client-supplied; a client-sent daily_kg_estimate field is not accepted as input."
        test_recipe:
          setup: ["Site ACTIVE"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-E2", name: "KG Site", address: "2 Main St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 10, duty_cycle_hours_per_day: 7.5, peak_shift_hours: 9, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { est: $.data.daily_kg_estimate }
          assert:
            - "daily_kg_estimate == 77.63 (ROUND_HALF_UP(10 x 7.5 x 0.9 x 1.15, 2) = ROUND_HALF_UP(77.625, 2) = 77.63)"
      - name: technician_active_defaults_true
        claim_type: defaults
        grounds:
          - entities.Technician.fields.active
        distinguishing_aspect: "Omitting active on technician creation yields active == true."
        test_recipe:
          setup: ["Clock at 2026-10-01"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/technicians"
              payload: { name: "Default Tech", certification_level: "BASIC", certified_until: "2027-06-01" }
              as: PlatformAdmin
              captures: { act: $.data.active }
          assert:
            - "active == true (default applied)"
      - name: invalid_enum_supply_mode_rejected
        claim_type: type_constraint
        grounds:
          - entities.SupplyContract.fields.supply_mode
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "supply_mode 'MAGIC_PIPE' is outside the declared enum and is rejected with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Site ACTIVE"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-E3", name: "Enum Site", address: "3 Main St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "MAGIC_PIPE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.0, reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.SupplyContract.fields.base_price_per_kg
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting base_price_per_kg on contract creation is rejected with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Site ACTIVE"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-E4", name: "Req Site", address: "4 Main St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
      - name: invalid_date_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "SupplyContract with end_date before start_date is rejected with ERR_INVALID_DATE_RANGE 422 — a distinct error from ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Site ACTIVE"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-E5", name: "Date Site", address: "5 Main St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-12-31", end_date: "2026-10-01", base_price_per_kg: 2.0, reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE with HTTP 422"
      - name: list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /api/sites?limit=1&offset=0 over two sites returns exactly 1 row, total_count 2, has_more true; offset=1 returns the second row, has_more false."
        test_recipe:
          setup: ["Two sites created"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { code: "S-PG1", name: "Page One", address: "1 Pg St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
            - call: "POST /api/sites"
              payload: { code: "S-PG2", name: "Page Two", address: "2 Pg St", baseline_labor_rate_per_hour: 31.0 }
              as: SiteManager
          trigger:
            - call: "GET /api/sites"
              payload: { limit: 1, offset: 0 }
              as: SiteManager
          assert:
            - "response data array length == 1 and pagination shows total_count == 2 and has_more == true"
      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Site
        distinguishing_aspect: "Client-sent id/created_at/version on site creation are not in the endpoint input contract; the server mints them."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sites"
              payload: { code: "S-SYS", name: "Sys Site", address: "9 Sys St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { ver: $.data.version }
          assert:
            - "version == 1 and created_at present in ISO8601 with fractional seconds"
  - section: state_machines
    instances:
      - name: assessment_terminal_approved_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Assessment
        distinguishing_aspect: "An APPROVED assessment rejects submit/reject/revise with ERR_INVALID_STATE — APPROVED is terminal."
        test_recipe:
          setup: ["Site with APPROVED assessment"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM1", name: "SM Site 1", address: "1 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 2, duty_cycle_hours_per_day: 4.0, peak_shift_hours: 6, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /api/sites/${site_id}/assessments/${ass}/revise"
              payload: {}
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (APPROVED is terminal)"
      - name: assessment_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.Assessment
        excluded_because:
          difficulty_instance: dual_variant_calc / productivity_telematics_vs_self_reported_gate
          rationale: "That instance's chain creates assessments that begin DRAFT and advance via submit; the DRAFT initial state is exercised there."
      - name: event_start_from_in_progress_rejected_idempotency
        claim_type: idempotency
        grounds:
          - state_machines.ConversionEvent
        distinguishing_aspect: "Starting an already IN_PROGRESS event a second time is rejected with ERR_INVALID_STATE — the start trigger is not idempotent."
        test_recipe:
          setup: ["Plan IN_PROGRESS with one IN_PROGRESS event"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM2", name: "SM Site 2", address: "2 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech SM", certification_level: "BASIC", certified_until: "2027-01-01" }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 2, duty_cycle_hours_per_day: 4.0, peak_shift_hours: 6, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/conversion-plans"
              payload: { name: "Wave SM", target_forklift_count: 1, transition_mode: "CUTOVER", start_date: "2026-10-01", end_date: "2026-10-10", baseline_productivity_units_per_hour: 40.0, expected_productivity_gain_pct: 5 }
              as: SiteManager
              captures: { plan: $.data.id, plan_v: $.data.version }
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/schedule"
              payload: { expected_plan_version: "${plan_v}" }
              as: SiteManager
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-SM", scheduled_start: "2026-10-02T08:00:00Z", scheduled_end: "2026-10-02T10:00:00Z", technician_id: "${tech}" }
              as: SiteManager
              captures: { ev: $.data.id }
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${ev}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${ev}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech}"
              captures: { err: $.data.error_id }
          assert:
            - "second start rejected with ERR_INVALID_STATE (409); event remains IN_PROGRESS exactly once"
      - name: plan_cancel_cascades_only_non_terminal_events
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConversionPlan.IN_PROGRESS_to_CANCELLED
        distinguishing_aspect: "Cancelling an IN_PROGRESS plan with one COMPLETED and one IN_PROGRESS event leaves the COMPLETED event untouched and moves only the IN_PROGRESS one to CANCELLED (conditional cascade)."
        test_recipe:
          setup: ["Plan IN_PROGRESS with event A COMPLETED and event B IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM3", name: "SM Site 3", address: "3 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech CC", certification_level: "MASTER", certified_until: "2027-01-01" }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 3, duty_cycle_hours_per_day: 4.0, peak_shift_hours: 6, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/conversion-plans"
              payload: { name: "Wave CC", target_forklift_count: 2, transition_mode: "PARALLEL", start_date: "2026-10-01", end_date: "2026-10-20", baseline_productivity_units_per_hour: 40.0, expected_productivity_gain_pct: 5 }
              as: SiteManager
              captures: { plan: $.data.id, plan_v: $.data.version }
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/schedule"
              payload: { expected_plan_version: "${plan_v}" }
              as: SiteManager
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-CA", scheduled_start: "2026-10-02T08:00:00Z", scheduled_end: "2026-10-02T10:00:00Z", technician_id: "${tech}" }
              as: SiteManager
              captures: { eva: $.data.id }
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-CB", scheduled_start: "2026-10-03T08:00:00Z", scheduled_end: "2026-10-03T10:00:00Z", technician_id: "${tech}" }
              as: SiteManager
              captures: { evb: $.data.id }
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${eva}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech}"
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${eva}/complete"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech}"
            - call: "POST /api/conversion-plans/${plan}/conversion-events/${evb}/start"
              payload: {}
              as: ConversionTechnician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/cancel"
              payload: {}
              as: SiteManager
          assert:
            - "ConversionPlan.${plan}.status == CANCELLED"
            - "ConversionEvent.${eva}.status == COMPLETED (untouched by cascade)"
            - "ConversionEvent.${evb}.status == CANCELLED (cascaded)"
      - name: plan_revert_blocked_after_completed_event
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConversionPlan.SCHEDULED_to_DRAFT
        distinguishing_aspect: "SCHEDULED -> DRAFT revert is legal with zero COMPLETED events but must not be reachable once an event completed — the plan will already be COMPLETED; instead assert revert from DRAFT itself fails (invalid from-state)."
        test_recipe:
          setup: ["Site with APPROVED assessment and a DRAFT plan"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM4", name: "SM Site 4", address: "4 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/conversion-plans"
              payload: { name: "Wave RV", target_forklift_count: 1, transition_mode: "CUTOVER", start_date: "2026-10-01", end_date: "2026-10-10", baseline_productivity_units_per_hour: 40.0, expected_productivity_gain_pct: 5 }
              as: SiteManager
              captures: { plan: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/revert"
              payload: {}
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "revert from DRAFT rejected with ERR_INVALID_STATE (409) — revert only legal from SCHEDULED"
      - name: invoice_pay_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.FuelInvoice
        distinguishing_aspect: "Paying a DRAFT invoice (skipping issue) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT invoice exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM5", name: "SM Site 5", address: "5 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.5, reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { c: $.data.id }
            - call: "POST /api/invoices"
              payload: { site_id: "${site_id}", supply_contract_id: "${c}", period_start: "2026-10-01", period_end: "2026-11-01" }
              as: BillingOperator
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /api/invoices/${inv}/pay"
              payload: {}
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
      - name: training_record_clock_driven_expiry
        claim_type: valid_transition
        grounds:
          - state_machines.TrainingRecord.VALID_to_EXPIRED
        distinguishing_aspect: "A VALID training record with expires_at 2026-10-10 flips to EXPIRED when the clock advances to 2026-10-11 — automatic system transition with no explicit action."
        test_recipe:
          setup: ["Site with a VALID training record expiring 2026-10-10"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM6", name: "SM Site 6", address: "6 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/training-records"
              payload: { trainee_employee_id: "EMP-1", course_code: "H2_BASIC", completed_at: "2026-09-01", expires_at: "2026-10-10" }
              as: SiteManager
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/training-records/${tr}"
              payload: {}
              as: SafetyOfficer
              captures: { st: $.data.status }
          assert:
            - "TrainingRecord.${tr}.status == EXPIRED after clock passes expires_at"
      - name: station_permitted_cascade_requires_both_permits
        claim_type: side_effect_execution
        grounds:
          - state_machines.FuelingStation.PLANNED_to_PERMITTED
        distinguishing_aspect: "Issuing only the CONSTRUCTION permit leaves the station PLANNED; issuing FIRE as the second permit flips it to PERMITTED (compound gating on the pair)."
        test_recipe:
          setup: ["Site with PLANNED station and two PENDING permits"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SM7", name: "SM Site 7", address: "7 State St", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-S7", location_type: "OUTDOOR", capacity_kg_per_day: 100, storage_capacity_kg: 300, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf: $.data.id }
          trigger:
            - call: "POST /api/stations/${st}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /api/stations/${st}"
              payload: {}
              as: ComplianceOfficer
              captures: { mid: $.data.construction_status }
            - call: "POST /api/stations/${st}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "after first permit: construction_status == PLANNED"
            - "after second permit: FuelingStation.${st}.construction_status == PERMITTED"
  - section: calculations
    instances:
      - name: tier_discount_applies_to_full_line_past_boundary
        claim_type: correct_result
        grounds:
          - calculations.supply_pricing_tier
        distinguishing_aspect: "With prior_billed_kg already at 120 (>= boundary 100), a new 10 kg line is priced entirely at the tier-2 rate 2.50 x 0.92 = 2.30 — line_amount 2300 cents; no blending once past the boundary."
        test_recipe:
          setup:
            - "Site with ACTIVE PIPELINE contract base 2.50 committed 100; commissioned OUTDOOR station; DRAFT invoice with a 120 kg line already added"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-CL1", name: "Calc Site 1", address: "1 Calc Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.5, reliability_sla_pct: 99.0, committed_monthly_kg: 100 }
              as: SiteManager
              captures: { c: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${c}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-C1", location_type: "OUTDOOR", capacity_kg_per_day: 500, storage_capacity_kg: 1000, construction_start: "2026-10-01", construction_end: "2026-10-05" }
              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${st}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/stations/${st}/commission"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-C1", occurred_at: "2026-10-05T08:00:00Z", kg_dispensed: 120, supply_contract_id: "${c}" }
              as: SiteManager
              captures: { fe120: $.data.id }
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-C2", occurred_at: "2026-10-06T08:00:00Z", kg_dispensed: 10, supply_contract_id: "${c}" }
              as: SiteManager
              captures: { fe10: $.data.id }
            - call: "POST /api/invoices"
              payload: { site_id: "${site_id}", supply_contract_id: "${c}", period_start: "2026-10-01", period_end: "2026-11-01" }
              as: BillingOperator
              captures: { inv: $.data.id, v0: $.data.version }
            - call: "POST /api/invoices/${inv}/line-items"
              payload: { fueling_event_id: "${fe120}", expected_invoice_version: "${v0}" }
              as: BillingOperator
              captures: { v1: $.data.version, amt1: $.data.line_amount_cents }
          trigger:
            - call: "POST /api/invoices/${inv}/line-items"
              payload: { fueling_event_id: "${fe10}", expected_invoice_version: "${v1}" }
              as: BillingOperator
              captures: { price2: $.data.unit_price_per_kg, amt2: $.data.line_amount_cents }
          assert:
            - "first line: 120 kg straddles boundary — 100 x 2.50 + 20 x 2.30 blended = 2.4667 per kg, line_amount_cents == 29600 (ROUND_HALF_UP(120 x 2.4667 x 100) = 29600.4 -> 29600)"
            - "second line: unit_price_per_kg == 2.3 and line_amount_cents == 2300 (fully past boundary)"
            - "invoice subtotal_cents == 31900"
      - name: take_or_pay_no_shortfall_zero_credit
        claim_type: correct_result
        grounds:
          - calculations.take_or_pay_credit
        distinguishing_aspect: "Billed 150 kg against a 100 kg commitment yields shortfall 0 and credit_cents == 0 — the max(0, ...) floor; total_cents == subtotal_cents."
        test_recipe:
          setup:
            - "Site with ACTIVE PIPELINE contract base 2.50 committed 100; commissioned station; invoice with a single 150 kg line"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
