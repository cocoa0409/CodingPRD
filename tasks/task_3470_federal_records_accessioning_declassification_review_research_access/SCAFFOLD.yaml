# =============================================================================
# SCAFFOLD.yaml — Federal Records Accessioning, Declassification Review &
# Research Access (NARA). §1.0–§1.7 seed tables.
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Federal Records Accessioning, Declassification Review & Research Access (National Archives and Records Administration): records schedule approval determining what agency records are permanent and when they transfer, accessioning of permanent records with physical and electronic transfer requirements and metadata standards, declassification review including systematic review at age thresholds and mandatory review requests with equity referrals to originating agencies, processing and description of collections to make them searchable with archivist backlogs, research room access with registration, handling rules and reproduction requests, freedom of information requests for records still subject to restrictions with exemption application, presidential records with statutory access restrictions and representative designations, digitization prioritization and public access publication

domain_name: federal-records-accessioning
api_prefix: /records

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency      # OCC on Collection.version when opening a declassification review
    - cascading_side_effects      # release/complete -> posture flip -> pending FOIA auto-close; late return -> suspension -> cancellations
    - dual_variant_calculation    # reproduction fee rounding order; digitization priority weighting
    - scheduled_actions           # logical clock drives age gates, cooling periods, card expiry, referral overdue

  entity_topology: flat           # peer entities joined by FK references in request bodies; no nested URL ownership
  state_machine_shape: cyclic     # schedule RETURNED->SUBMITTED resubmission loop; FOIA DENIED->APPEALED->IN_REVIEW remand loop; transfer DEFICIENT retry self-loop; Collection carries parallel status dimensions

  relationship_patterns:
    - one_to_many                 # Agency -> schedules/transfers/referrals; Collection -> reviews/pulls/repros/foias/restrictions
    - cross_aggregate             # Transfer -> RecordsSchedule+Agency; DeclassReview -> Collection+ResearcherRegistration

  role_model: segregation_of_duties
  # schedule appraiser cannot decide; FOIA adjudicator cannot decide the appeal;
  # entity-backed ownership: RecordsOfficer/AgencyLiaison act only for their own agency,
  # Researcher acts only as themselves.

  consistency_model: immediate    # every mutation (incl. cascades + derived recomputes) is visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: agency_code, type: string, source: input, description: "Short unique agency code, e.g. DOJ, CIA; unique across all agencies" }
      - { name: name, type: string, source: input, description: "Full agency name" }

  - name: RecordsSchedule
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency; must equal X-User-ID of the RecordsOfficer caller" }
      - { name: schedule_number, type: string, source: input, description: "Agency-local schedule identifier; unique per agency_id" }
      - { name: title, type: string, source: input, description: "Human-readable schedule title" }
      - { name: records_domain, type: enum, source: input, description: "FEDERAL | PRESIDENTIAL — presidential-domain schedules produce presidential collections" }
      - { name: disposition, type: enum, source: input, description: "PERMANENT | TEMPORARY — only PERMANENT schedules may underlie transfers" }
      - { name: transfer_lag_years, type: integer, source: input, default: null, description: "Years after records_cutoff_date when permanent records may be accessioned; required iff disposition == PERMANENT; 0..50" }
      - { name: classification_default, type: enum, source: input, description: "NONE | CONFIDENTIAL | SECRET | TOP_SECRET — copied onto the collection at accession" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPRAISED | APPROVED | RETURNED" }
      - { name: appraiser_id, type: string, source: system, default: null, description: "X-User-ID of the AppraisalArchivist who appraised (stamped on appraise)" }
      - { name: appraisal_recommendation, type: enum, source: system, default: null, description: "APPROVE | RETURN — set by appraise" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of the ChiefArchivist who decided (stamped on decide)" }
      - { name: decision_note, type: string, source: system, default: null, description: "Free-text rationale recorded at decide" }

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: schedule_id, type: string, source: input, description: "FK -> RecordsSchedule.id; schedule must be APPROVED and PERMANENT" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; must equal schedule.agency_id and the RecordsOfficer caller's X-User-ID" }
      - { name: transfer_method, type: enum, source: input, description: "PHYSICAL | ELECTRONIC" }
      - { name: metadata_standard, type: enum, source: input, description: "EAD_2002 | MODS_3_7 | PREMIS_3_0; ELECTRONIC requires PREMIS_3_0, PHYSICAL requires EAD_2002 or MODS_3_7" }
      - { name: unit_count, type: integer, source: input, description: "Containers (PHYSICAL) or files (ELECTRONIC); >= 1; becomes Collection.units_total" }
      - { name: linear_feet, type: number, source: input, default: null, description: "Required iff transfer_method == PHYSICAL; must be > 0" }
      - { name: checksum_manifest, type: string, source: input, default: null, description: "Required iff transfer_method == ELECTRONIC; non-empty manifest reference" }
      - { name: records_cutoff_date, type: datetime, source: input, description: "End date of the records in this transfer; drives the transfer-lag gate and collection age" }
      - { name: status, type: enum, source: system, description: "INITIATED | VALIDATED | DEFICIENT | ACCESSIONED | WITHDRAWN" }
      - { name: submitted_metadata_elements, type: array, source: system, default: [], description: "Element names from the latest submit-metadata call" }
      - { name: last_missing_elements, type: array, source: system, default: [], description: "Sorted required-element names missing from the latest submit-metadata call; [] when VALIDATED" }
      - { name: accessioned_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of accession" }
      - { name: collection_id, type: string, source: system, default: null, description: "FK -> Collection.id; set when accession creates the collection" }

  - name: Collection
    parent: null
    common_fields: true
    fields:
      - { name: transfer_id, type: string, source: system, description: "FK -> Transfer.id; unique — exactly one collection per accessioned transfer" }
      - { name: schedule_id, type: string, source: system, description: "FK -> RecordsSchedule.id; denormalized from the transfer" }
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; denormalized from the transfer" }
      - { name: records_domain, type: enum, source: system, description: "FEDERAL | PRESIDENTIAL — copied from the schedule" }
      - { name: classification_level, type: enum, source: system, description: "NONE | CONFIDENTIAL | SECRET | TOP_SECRET — copied from schedule; cleared to NONE by a DECLASSIFIED review" }
      - { name: records_cutoff_date, type: datetime, source: system, description: "Copied from transfer; drives systematic-review age and priority age points" }
      - { name: units_total, type: integer, source: system, description: "Copied from transfer.unit_count; pull unit ranges live in [1, units_total]" }
      - { name: processing_status, type: enum, source: system, description: "UNPROCESSED | PROCESSING | DESCRIBED | PUBLISHED" }
      - { name: assigned_archivist_id, type: string, source: system, default: null, description: "X-User-ID stamped at begin-processing" }
      - { name: scope_note, type: string, source: system, default: null, description: "Description element stored by complete-description" }
      - { name: arrangement_note, type: string, source: system, default: null, description: "Description element stored by complete-description" }
      - { name: container_list_summary, type: string, source: system, default: null, description: "Description element stored by complete-description" }
      - { name: restriction_posture, type: enum, source: computed, description: "PUBLIC | CLASSIFIED_REVIEW_REQUIRED | PRESIDENTIAL_HOLD — derived by calculations.restriction_posture" }
      - { name: backlog_score, type: integer, source: computed, description: "Processing backlog priority snapshot computed once at accession (calculations.processing_backlog_score)" }
      - { name: pull_count_total, type: integer, source: computed, default: 0, description: "Fulfilled (PULLED) pull requests against this collection; feeds digitization priority" }
      - { name: repro_pages_fulfilled, type: integer, source: computed, default: 0, description: "Summed page_count of FULFILLED reproduction requests; feeds digitization priority" }
      - { name: foia_release_count, type: integer, source: computed, default: 0, description: "Number of times a FOIA request on this collection entered GRANTED or APPEAL_GRANTED; feeds digitization priority" }
      - { name: digitization_status, type: enum, source: system, description: "NOT_REQUESTED | QUEUED | DIGITIZED" }
      - { name: digitization_priority, type: integer, source: computed, default: null, description: "Snapshot of calculations.digitization_priority at enqueue; recomputed on demand-field mutation while QUEUED; null until queued" }
      - { name: declass_outcome, type: enum, source: system, description: "NONE | DECLASSIFIED | PARTIAL | EXEMPT_RETAINED — stamped by review completion" }

  - name: DeclassReview
    parent: null
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id" }
      - { name: review_type, type: enum, source: input, description: "SYSTEMATIC (age-triggered, archivist-initiated) | MANDATORY (researcher MDR request)" }
      - { name: requester_researcher_id, type: string, source: input, default: null, description: "FK -> ResearcherRegistration.id; required iff review_type == MANDATORY; must equal the Researcher caller's X-User-ID; null for SYSTEMATIC" }
      - { name: justification, type: string, source: input, default: null, description: "Required iff MANDATORY; non-empty reasonable description of the records sought" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | COMPLETED" }
      - { name: lead_reviewer_id, type: string, source: system, default: null, description: "X-User-ID of the DeclassReviewer who began the review" }
      - { name: reviewer_assessment, type: enum, source: system, default: null, description: "DECLASSIFY | EXEMPT — the completing reviewer's own assessment" }
      - { name: exemption_codes, type: array, source: system, default: [], description: "Exemption codes carried at completion (from reviewer assessment and/or referral decisions)" }
      - { name: outcome, type: enum, source: system, default: null, description: "NONE | DECLASSIFIED | PARTIAL | EXEMPT_RETAINED — computed by calculations.declass_review_outcome at completion" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of completion" }

  - name: EquityReferral
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: system, description: "FK -> DeclassReview.id" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency whose equities are referred" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of referral creation" }
      - { name: response_due_at, type: datetime, source: computed, description: "sent_at + REFERRAL_RESPONSE_DAYS (21) days" }
      - { name: status, type: enum, source: system, description: "SENT | RESPONDED" }
      - { name: decision, type: enum, source: system, default: null, description: "NONE | DECLASSIFY | EXEMPT — null while SENT" }
      - { name: exemption_code, type: string, source: system, default: null, description: "Required at respond iff decision == EXEMPT" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of response" }

  - name: ResearcherRegistration
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Researcher full name" }
      - { name: email, type: string, source: input, description: "Unique email across all registrations" }
      - { name: affiliation, type: enum, source: input, description: "ACADEMIC | JOURNALIST | GENEALOGIST | COMMERCIAL | GOVERNMENT — ACADEMIC receives the reproduction-fee discount" }
      - { name: id_document, type: string, source: input, description: "Identity document reference; required non-empty" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | EXPIRED" }
      - { name: card_expires_at, type: datetime, source: computed, default: null, description: "Activation clock + CARD_VALIDITY_YEARS (2 years); null until first activation" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "LATE_RETURN when suspended by the late-return cascade" }

  - name: PullRequest
    parent: null
    common_fields: true
    fields:
      - { name: researcher_id, type: string, source: input, description: "FK -> ResearcherRegistration.id; must equal the Researcher caller's X-User-ID" }
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id" }
      - { name: unit_start, type: integer, source: input, description: "First unit (box/file) reserved; 1 <= unit_start <= unit_end <= collection.units_total" }
      - { name: unit_end, type: integer, source: input, description: "Last unit reserved; span (unit_end - unit_start + 1) <= MAX_PULL_UNITS_PER_REQUEST (24)" }
      - { name: visit_date, type: datetime, source: input, description: "Planned research-room visit; must fall in [clock, clock + VISIT_WINDOW_DAYS (30 days)]" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PULLED | RETURNED | CANCELLED" }
      - { name: due_back_at, type: datetime, source: computed, description: "visit_date + 24 hours; the pull occupies reading-room seat capacity on the visit day and the following UTC day" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of return" }
      - { name: late_return, type: boolean, source: computed, default: false, description: "returned_at > due_back_at (strict); drives the suspension cascade" }

  - name: ReproductionRequest
    parent: null
    common_fields: true
    fields:
      - { name: researcher_id, type: string, source: input, description: "FK -> ResearcherRegistration.id; must equal the Researcher caller's X-User-ID" }
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id; must be DESCRIBED or PUBLISHED and posture PUBLIC" }
      - { name: page_count, type: integer, source: input, description: ">= 1; counts against the researcher's REPRO_DAILY_PAGE_LIMIT (200) per UTC day" }
      - { name: format, type: enum, source: input, description: "DIGITAL_SCAN | CERTIFIED_COPY | PHOTOPRINT" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush handling multiplies the discounted fee by RUSH_MULTIPLIER (1.5)" }
      - { name: fee_cents, type: integer, source: computed, description: "Computed at creation by calculations.reproduction_fee (canonical order: per-tier academic discount, then rush multiplier)" }
      - { name: status, type: enum, source: system, description: "QUOTED | PAID | FULFILLED | CANCELLED" }
      - { name: payment_reference, type: string, source: system, default: null, description: "Recorded at pay" }

  - name: FoiaRequest
    parent: null
    common_fields: true
    fields:
      - { name: researcher_id, type: string, source: input, description: "FK -> ResearcherRegistration.id; must equal the Researcher caller's X-User-ID" }
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id; posture must be restricted (CLASSIFIED_REVIEW_REQUIRED or PRESIDENTIAL_HOLD)" }
      - { name: description_of_records, type: string, source: input, description: "Non-empty reasonable description of the records requested" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_REVIEW | GRANTED | PARTIAL_GRANT | DENIED | APPEALED | APPEAL_GRANTED | APPEAL_UPHELD | CLOSED" }
      - { name: claimed_exemptions, type: array, source: system, default: [], description: "Subset of {B1, B3, B5}; required non-empty at adjudicate for PARTIAL or DENY" }
      - { name: adjudicator_id, type: string, source: system, default: null, description: "X-User-ID of the FoiaOfficer at the latest adjudication" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the latest adjudication; appeal window is decided_at + APPEAL_WINDOW_DAYS (30)" }
      - { name: appeal_reason, type: string, source: system, default: null, description: "Recorded at appeal" }
      - { name: appeal_decider_id, type: string, source: system, default: null, description: "X-User-ID of the FoiaAppealsOfficer; must differ from adjudicator_id (segregation of duties)" }
      - { name: appeal_decision, type: enum, source: system, default: null, description: "GRANT | UPHOLD | REMAND" }
      - { name: remand_count, type: integer, source: system, default: 0, description: "Number of REMAND decisions (each returns the request to IN_REVIEW)" }
      - { name: close_reason, type: enum, source: system, default: null, description: "RECORDS_MADE_PUBLIC — set when the posture-flip cascade auto-closes a pending request" }

  - name: PresidentialRestriction
    parent: null
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id; collection.records_domain must be PRESIDENTIAL" }
      - { name: category, type: enum, source: input, description: "P1_NATIONAL_SECURITY | P2_APPOINTMENTS | P3_STATUTORY | P4_TRADE_SECRETS | P5_CONFIDENTIAL_ADVICE | P6_PERSONAL_PRIVACY; at most one non-RELEASED restriction per (collection_id, category)" }
      - { name: status, type: enum, source: system, description: "IMPOSED | NOTIFIED | RELEASED" }
      - { name: representative_id, type: string, source: system, default: null, description: "Former-president representative designated to receive notification; required before notify" }
      - { name: notified_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of notification; release allowed at notified_at + NOTICE_COOLING_DAYS (30) or later" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of release" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RecordsSchedule
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /records/schedules/{id}/submit"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == schedule.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["version += 1"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /records/schedules/{id}/submit (resubmission)"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == schedule.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["version += 1", "appraiser_id / appraisal_recommendation / decided_by / decision_note reset to null"]
        note: "revision cycle: a RETURNED schedule may be resubmitted any number of times"
      - from: SUBMITTED
        to: APPRAISED
        trigger: "POST /records/schedules/{id}/appraise"
        actor: AppraisalArchivist
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE otherwise)"
        side_effects: ["appraiser_id = X-User-ID", "appraisal_recommendation recorded", "version += 1"]
      - from: APPRAISED
        to: APPROVED
        trigger: "POST /records/schedules/{id}/decide with decision=APPROVE"
        actor: ChiefArchivist
        preconditions:
          - "status == APPRAISED (ERR_SCHEDULE_NOT_APPRAISED)"
          - "X-User-ID != appraiser_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by = X-User-ID", "decision_note recorded", "version += 1"]
      - from: APPRAISED
        to: RETURNED
        trigger: "POST /records/schedules/{id}/decide with decision=RETURN"
        actor: ChiefArchivist
        preconditions:
          - "status == APPRAISED (ERR_SCHEDULE_NOT_APPRAISED)"
          - "X-User-ID != appraiser_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by = X-User-ID", "decision_note recorded", "version += 1"]

  - entity: Transfer
    initial_state: INITIATED
    terminal_states: [ACCESSIONED, WITHDRAWN]
    transitions:
      - from: INITIATED
        to: VALIDATED
        trigger: "POST /records/transfers/{id}/submit-metadata — all required elements of the declared metadata_standard present"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == transfer.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["submitted_metadata_elements stored", "last_missing_elements = []", "version += 1"]
      - from: INITIATED
        to: DEFICIENT
        trigger: "POST /records/transfers/{id}/submit-metadata — required elements missing"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == transfer.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["last_missing_elements = sorted missing element names", "version += 1"]
      - from: DEFICIENT
        to: VALIDATED
        trigger: "POST /records/transfers/{id}/submit-metadata — resubmission now complete"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == transfer.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["submitted_metadata_elements stored", "last_missing_elements = []", "version += 1"]
      - from: DEFICIENT
        to: DEFICIENT
        trigger: "POST /records/transfers/{id}/submit-metadata — resubmission still incomplete (self-loop)"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == transfer.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["last_missing_elements refreshed", "version += 1"]
      - from: VALIDATED
        to: ACCESSIONED
        trigger: "POST /records/transfers/{id}/accession"
        actor: ProcessingArchivist
        preconditions:
          - "status == VALIDATED (ERR_TRANSFER_NOT_VALIDATED)"
          - "clock >= records_cutoff_date + schedule.transfer_lag_years anniversary (ERR_TRANSFER_LAG_NOT_ELAPSED)"
        side_effects:
          - "create Collection: UNPROCESSED, units_total = unit_count, classification_level/domain/agency_id/schedule_id/records_cutoff_date copied, restriction_posture computed, backlog_score computed, demand counters 0"
          - "collection_id set; accessioned_at = clock; version += 1"
      - from: [INITIATED, DEFICIENT, VALIDATED]
        to: WITHDRAWN
        trigger: "POST /records/transfers/{id}/withdraw"
        actor: RecordsOfficer
        preconditions:
          - "caller X-User-ID == transfer.agency_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["version += 1"]

  - entity: Collection
    initial_state: UNPROCESSED
    terminal_states: [PUBLISHED]
    note: "processing_status is one parallel dimension; digitization_status (NOT_REQUESTED|QUEUED|DIGITIZED) and the derived restriction_posture evolve independently on the same row"
    transitions:
      - from: UNPROCESSED
        to: PROCESSING
        trigger: "POST /records/collections/{id}/begin-processing"
        actor: ProcessingArchivist
        preconditions:
          - "processing_status == UNPROCESSED (ERR_INVALID_STATE otherwise)"
        side_effects: ["assigned_archivist_id = X-User-ID", "version += 1"]
      - from: PROCESSING
        to: DESCRIBED
        trigger: "POST /records/collections/{id}/complete-description"
        actor: ProcessingArchivist
        preconditions:
          - "processing_status == PROCESSING (ERR_INVALID_STATE otherwise)"
          - "scope_note, arrangement_note, container_list_summary all non-empty (ERR_DESCRIPTION_INCOMPLETE)"
        side_effects: ["description fields stored", "version += 1"]
      - from: DESCRIBED
        to: PUBLISHED
        trigger: "POST /records/collections/{id}/publish-digital"
        actor: ChiefArchivist
        preconditions:
          - "digitization_status == DIGITIZED (ERR_DIGITIZATION_NOT_READY)"
          - "restriction_posture == PUBLIC (ERR_COLLECTION_RESTRICTED)"
        side_effects: ["version += 1"]

  - entity: CollectionDigitization
    note: "second parallel state dimension of Collection (field digitization_status)"
    initial_state: NOT_REQUESTED
    terminal_states: []
    transitions:
      - from: NOT_REQUESTED
        to: QUEUED
        trigger: "POST /records/collections/{id}/enqueue-digitization"
        actor: ProcessingArchivist
        preconditions:
          - "processing_status == DESCRIBED (ERR_COLLECTION_NOT_DESCRIBED)"
          - "restriction_posture == PUBLIC (ERR_COLLECTION_RESTRICTED)"
          - "digitization_status == NOT_REQUESTED (ERR_INVALID_STATE otherwise)"
        side_effects: ["digitization_priority = calculations.digitization_priority (DEMAND_WEIGHTED snapshot)", "version += 1"]
      - from: QUEUED
        to: DIGITIZED
        trigger: "POST /records/collections/{id}/complete-digitization"
        actor: ProcessingArchivist
        preconditions:
          - "digitization_status == QUEUED (ERR_DIGITIZATION_NOT_QUEUED)"
        side_effects: ["version += 1"]

  - entity: DeclassReview
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /records/declass-reviews/{id}/begin"
        actor: DeclassReviewer
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE otherwise)"
        side_effects: ["lead_reviewer_id = X-User-ID", "version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /records/declass-reviews/{id}/complete"
        actor: DeclassReviewer
        preconditions:
          - "status == IN_PROGRESS (ERR_REVIEW_NOT_IN_PROGRESS)"
          - "every EquityReferral of this review is RESPONDED or overdue (clock > response_due_at); otherwise ERR_REFERRALS_OUTSTANDING"
        side_effects:
          - "outcome = calculations.declass_review_outcome; completed_at = clock; exemption_codes merged; version += 1"
          - "if outcome == DECLASSIFIED: collection.classification_level = NONE; collection.declass_outcome = DECLASSIFIED"
          - "if outcome in {PARTIAL, EXEMPT_RETAINED}: collection.declass_outcome = outcome (classification_level unchanged)"
          - "collection.restriction_posture recomputed; collection.version += 1"
          - "posture-flip cascade: any FoiaRequest of this collection in {RECEIVED, IN_REVIEW} whose collection posture became PUBLIC transitions to CLOSED with close_reason = RECORDS_MADE_PUBLIC"

  - entity: EquityReferral
    initial_state: SENT
    terminal_states: [RESPONDED]
    transitions:
      - from: SENT
        to: RESPONDED
        trigger: "POST /records/equity-referrals/{id}/respond"
        actor: AgencyLiaison
        preconditions:
          - "caller X-User-ID == referral.agency_id (ERR_OWNERSHIP_MISMATCH)"
          - "parent review status == IN_PROGRESS (ERR_REVIEW_NOT_IN_PROGRESS)"
          - "decision == EXEMPT requires non-empty exemption_code (ERR_EXEMPTION_REQUIRED)"
        side_effects: ["decision, exemption_code, responded_at recorded", "version += 1"]

  - entity: ResearcherRegistration
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /records/researchers/{id}/activate"
        actor: ResearchRoomStaff
        preconditions: []
        side_effects: ["card_expires_at = clock + CARD_VALIDITY_YEARS (2 years)", "version += 1"]
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /records/researchers/{id}/activate (renewal)"
        actor: ResearchRoomStaff
        preconditions: []
        side_effects: ["card_expires_at = clock + CARD_VALIDITY_YEARS (2 years)", "version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy evaluation: on any load of the registration, if clock >= card_expires_at the status is persisted as EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["version += 1 when the lazy transition fires"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from a late pull return)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_reason = LATE_RETURN; version += 1"
          - "all sibling PullRequests of this researcher in REQUESTED -> CANCELLED"
          - "all ReproductionRequests of this researcher in QUOTED -> CANCELLED (frees their committed daily pages)"

  - entity: PullRequest
    initial_state: REQUESTED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: PULLED
        trigger: "POST /records/pull-requests/{id}/fulfill"
        actor: ResearchRoomStaff
        preconditions:
          - "status == REQUESTED (ERR_PULL_NOT_FULFILLABLE)"
        side_effects: ["collection.pull_count_total += 1", "collection.digitization_priority recomputed if QUEUED", "collection.version += 1", "version += 1"]
      - from: PULLED
        to: RETURNED
        trigger: "POST /records/pull-requests/{id}/return"
        actor: ResearchRoomStaff
        preconditions:
          - "status == PULLED (ERR_PULL_NOT_RETURNABLE)"
        side_effects:
          - "returned_at = clock; late_return = (returned_at > due_back_at); version += 1"
          - "if late_return: researcher -> SUSPENDED (suspension_reason = LATE_RETURN), which cascades: sibling REQUESTED pulls -> CANCELLED, QUOTED reproductions -> CANCELLED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (cascade from researcher suspension)"
        actor: system
        preconditions: []
        side_effects: ["version += 1"]

  - entity: ReproductionRequest
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUOTED
        to: PAID
        trigger: "POST /records/reproduction-requests/{id}/pay"
        actor: Researcher
        preconditions:
          - "caller X-User-ID == request.researcher_id (ERR_OWNERSHIP_MISMATCH)"
          - "status == QUOTED (ERR_REPRO_NOT_PAYABLE)"
        side_effects: ["payment_reference recorded", "version += 1"]
      - from: PAID
        to: FULFILLED
        trigger: "POST /records/reproduction-requests/{id}/fulfill"
        actor: ResearchRoomStaff
        preconditions:
          - "status == PAID (ERR_REPRO_NOT_PAID from QUOTED; ERR_INVALID_STATE from terminal states)"
        side_effects: ["collection.repro_pages_fulfilled += page_count", "collection.digitization_priority recomputed if QUEUED", "collection.version += 1", "version += 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /records/reproduction-requests/{id}/cancel OR system (researcher suspension cascade)"
        actor: Researcher
        preconditions:
          - "status == QUOTED (ERR_REPRO_NOT_CANCELLABLE)"
          - "caller X-User-ID == request.researcher_id for the manual trigger (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["committed daily pages freed (the row no longer counts toward REPRO_DAILY_PAGE_LIMIT)", "version += 1"]

  - entity: FoiaRequest
    initial_state: RECEIVED
    terminal_states: [GRANTED, APPEAL_GRANTED, APPEAL_UPHELD, CLOSED]
    transitions:
      - from: RECEIVED
        to: GRANTED
        trigger: "POST /records/foia-requests/{id}/adjudicate with decision=GRANT"
        actor: FoiaOfficer
        preconditions: []
        side_effects: ["adjudicator_id = X-User-ID; decided_at = clock", "collection.foia_release_count += 1", "collection.digitization_priority recomputed if QUEUED", "collection.version += 1", "version += 1"]
      - from: RECEIVED
        to: PARTIAL_GRANT
        trigger: "POST /records/foia-requests/{id}/adjudicate with decision=PARTIAL"
        actor: FoiaOfficer
        preconditions: ["claimed_exemptions non-empty subset of {B1, B3, B5} (ERR_EXEMPTION_REQUIRED)"]
        side_effects: ["adjudicator_id, decided_at, claimed_exemptions recorded", "version += 1"]
      - from: RECEIVED
        to: DENIED
        trigger: "POST /records/foia-requests/{id}/adjudicate with decision=DENY"
        actor: FoiaOfficer
        preconditions: ["claimed_exemptions non-empty subset of {B1, B3, B5} (ERR_EXEMPTION_REQUIRED)"]
        side_effects: ["adjudicator_id, decided_at, claimed_exemptions recorded", "version += 1"]
      - from: IN_REVIEW
        to: GRANTED
        trigger: "POST /records/foia-requests/{id}/adjudicate with decision=GRANT (re-adjudication after remand)"
        actor: FoiaOfficer
        preconditions: []
        side_effects: ["adjudicator_id and decided_at restamped", "collection.foia_release_count += 1", "collection.digitization_priority recomputed if QUEUED", "collection.version += 1", "version += 1"]
      - from: IN_REVIEW
        to: PARTIAL_GRANT
        trigger: "POST /records/foia-requests/{id}/adjudicate with decision=PARTIAL (re-adjudication after remand)"
        actor: FoiaOfficer
        preconditions: ["claimed_exemptions non-empty subset of {B1, B3, B5} (ERR_EXEMPTION_REQUIRED)"]
        side_effects: ["adjudicator_id, decided_at, claimed_exemptions restamped", "version += 1"]
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /records/foia-requests/{id}/adjudicate with decision=DENY (re-adjudication after remand)"
        actor: FoiaOfficer
        preconditions: ["claimed_exemptions non-empty subset of {B1, B3, B5} (ERR_EXEMPTION_REQUIRED)"]
        side_effects: ["adjudicator_id, decided_at, claimed_exemptions restamped", "version += 1"]
      - from: [PARTIAL_GRANT, DENIED]
        to: APPEALED
        trigger: "POST /records/foia-requests/{id}/appeal"
        actor: Researcher
        preconditions:
          - "caller X-User-ID == request.researcher_id (ERR_OWNERSHIP_MISMATCH)"
          - "status in {PARTIAL_GRANT, DENIED} (ERR_APPEAL_NOT_ALLOWED_STATE)"
          - "clock <= decided_at + APPEAL_WINDOW_DAYS (30 days) (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["appeal_reason recorded", "version += 1"]
      - from: APPEALED
        to: APPEAL_GRANTED
        trigger: "POST /records/foia-requests/{id}/decide-appeal with appeal_decision=GRANT"
        actor: FoiaAppealsOfficer
        preconditions:
          - "status == APPEALED (ERR_FOIA_NOT_APPEALED)"
          - "X-User-ID != adjudicator_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["appeal_decider_id, appeal_decision recorded", "collection.foia_release_count += 1", "collection.digitization_priority recomputed if QUEUED", "collection.version += 1", "version += 1"]
      - from: APPEALED
        to: APPEAL_UPHELD
        trigger: "POST /records/foia-requests/{id}/decide-appeal with appeal_decision=UPHOLD"
        actor: FoiaAppealsOfficer
        preconditions:
          - "status == APPEALED (ERR_FOIA_NOT_APPEALED)"
          - "X-User-ID != adjudicator_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["appeal_decider_id, appeal_decision recorded", "version += 1"]
      - from: APPEALED
        to: IN_REVIEW
        trigger: "POST /records/foia-requests/{id}/decide-appeal with appeal_decision=REMAND"
        actor: FoiaAppealsOfficer
        preconditions:
          - "status == APPEALED (ERR_FOIA_NOT_APPEALED)"
          - "X-User-ID != adjudicator_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["appeal_decider_id, appeal_decision recorded", "remand_count += 1", "version += 1"]
        note: "remand loop: DENIED/PARTIAL_GRANT -> APPEALED -> IN_REVIEW -> adjudicate again; each cycle restamps adjudicator_id and decided_at"
      - from: [RECEIVED, IN_REVIEW]
        to: CLOSED
        trigger: "system (posture-flip cascade: the collection's restriction_posture became PUBLIC)"
        actor: system
        preconditions: []
        side_effects: ["close_reason = RECORDS_MADE_PUBLIC", "version += 1"]

  - entity: PresidentialRestriction
    initial_state: IMPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: IMPOSED
        to: IMPOSED
        trigger: "POST /records/presidential-restrictions/{id}/designate"
        actor: ChiefArchivist
        preconditions:
          - "status == IMPOSED (ERR_INVALID_STATE otherwise)"
        side_effects: ["representative_id recorded", "version += 1"]
        note: "representative designation is an in-state update; it does not advance the lifecycle"
      - from: IMPOSED
        to: NOTIFIED
        trigger: "POST /records/presidential-restrictions/{id}/notify"
        actor: ChiefArchivist
        preconditions:
          - "status == IMPOSED (ERR_INVALID_STATE otherwise)"
          - "representative_id present (ERR_REPRESENTATIVE_REQUIRED)"
        side_effects: ["notified_at = clock", "version += 1"]
      - from: NOTIFIED
        to: RELEASED
        trigger: "POST /records/presidential-restrictions/{id}/release"
        actor: ChiefArchivist
        preconditions:
          - "status == NOTIFIED (ERR_RESTRICTION_NOT_NOTIFIED)"
          - "clock >= notified_at + NOTICE_COOLING_DAYS (30 days) (ERR_COOLING_PERIOD_ACTIVE)"
        side_effects:
          - "released_at = clock; version += 1"
          - "collection.restriction_posture recomputed; collection.version += 1"
          - "posture-flip cascade: any FoiaRequest of this collection in {RECEIVED, IN_REVIEW} whose collection posture became PUBLIC transitions to CLOSED with close_reason = RECORDS_MADE_PUBLIC"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: mdr-create-stale-collection
    parent_entity: Collection
    write_endpoint: "POST /records/declass-reviews"
    occ_field: "expected_collection_version"
    description: |
      Opening a declassification review against a Collection whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just opened a review on the same collection
      (which bumps Collection.version as review demand is recorded) or a
      posture-relevant cascade has recomputed the collection, so the current
      writer's view of the collection is stale.
    error_id: ERR_STALE_COLLECTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reproduction_fee
    trigger: "POST /records/reproduction-requests (creation); result stored on fee_cents"
    algorithm: tiered_pricing
    formula: |
      tier1_pages = min(page_count, TIER1_PAGES)                       # 20
      tier2_pages = min(max(page_count - TIER1_PAGES, 0), TIER2_PAGES) # 80
      tier3_pages = max(page_count - TIER1_PAGES - TIER2_PAGES, 0)
      tier_cents  = [tier1_pages * TIER1_RATE_CENTS,                   # 80
                     tier2_pages * TIER2_RATE_CENTS,                   # 50
                     tier3_pages * TIER3_RATE_CENTS]                   # 25
      # Canonical order (pinned): apply the affiliation discount PER TIER with
      # round_half_up to whole cents, sum the discounted tiers, then apply the
      # rush multiplier to the discounted sum with round_half_up.
      if affiliation == "ACADEMIC":
        discounted_total = sum(round_half_up(t * ACADEMIC_DISCOUNT_RATE) for t in tier_cents)
      else:
        discounted_total = sum(tier_cents)
      if rush:
        fee_cents = round_half_up(discounted_total * RUSH_MULTIPLIER)
      else:
        fee_cents = discounted_total
      # affiliation is the owning researcher.registration's affiliation field;
      # page_count/format/rush come from the request body. format selects no
      # rate in v1 (rate card is format-independent); rush defaults false.
    input_set: "the new ReproductionRequest (page_count, rush) and its ResearcherRegistration.affiliation"
    constants:
      TIER1_PAGES: 20
      TIER1_RATE_CENTS: 80
      TIER2_PAGES: 80
      TIER2_RATE_CENTS: 50
      TIER3_RATE_CENTS: 25
      ACADEMIC_DISCOUNT_RATE: 0.85
      RUSH_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up at exactly two points: per discounted tier, then after the rush multiplier"
    variants:
      - name: rush_after_discount
        when: "canonical — all fee_cents computations"
        difference: "discount per tier first (round_half_up per tier), sum, then rush multiplier (round_half_up). 25 pages, ACADEMIC, rush=true -> 2360 cents."
      - name: rush_before_discount
        when: "alternative reading of 'rush and academic discount both apply' — NOT used; documented because it yields a different total"
        difference: "rush multiplier per tier first, then discount per tier: 25 pages, ACADEMIC, rush=true -> 2359 cents (tier1 2400*0.85=2040, tier2 375*0.85=318.75->319). Diverges from canonical whenever a discounted-and-rushed tier lands on a fractional cent."

  - name: digitization_priority
    trigger: "POST /records/collections/{id}/enqueue-digitization (snapshot stored on digitization_priority); recomputed on any mutation of pull_count_total, repro_pages_fulfilled or foia_release_count while digitization_status == QUEUED"
    algorithm: weighted_scoring
    formula: |
      age_years = calculations.records_age_years(clock, records_cutoff_date)
      score = AGE_POINTS_PER_YEAR * min(age_years, AGE_CAP_YEARS)          # 2 * min(age, 50)
            + PULL_POINTS * min(pull_count_total, PULL_CAP)              # 3 * min(pulls, 20)
            + FOIA_POINTS * min(foia_release_count, FOIA_CAP)            # 5 * min(foia, 10)
            + floor(min(repro_pages_fulfilled, REPRO_PAGES_CAP) / REPRO_PAGES_DIVISOR)  # min(pages,500)//50
            + (DECLASSIFIED_BONUS if declass_outcome == DECLASSIFIED else 0)            # +25
      digitization_priority = score
    input_set: "the Collection being enqueued (records_cutoff_date, demand counters, declass_outcome) and the logical clock"
    constants:
      AGE_POINTS_PER_YEAR: 2
      AGE_CAP_YEARS: 50
      PULL_POINTS: 3
      PULL_CAP: 20
      FOIA_POINTS: 5
      FOIA_CAP: 10
      REPRO_PAGES_CAP: 500
      REPRO_PAGES_DIVISOR: 50
      DECLASSIFIED_BONUS: 25
    precision: "integer points; no rounding"
    variants:
      - name: demand_weighted
        when: "canonical — the queue orders by this score"
        difference: "age 30y + 4 pulls + 2 foia releases + 0 pages + DECLASSIFIED -> 2*30 + 3*4 + 5*2 + 0 + 25 = 107."
      - name: age_weighted
        when: "alternative reading of 'oldest records first' — NOT used; documented because it reorders the queue"
        difference: "5*min(age,50) + 1*min(pulls,20) + 2*min(foia,10) + min(pages,500)//100 + bonus -> same inputs yield 183, diverging whenever demand counters are nonzero."

  - name: digitization_queue_ordering
    trigger: "GET /records/digitization-queue"
    algorithm: aggregation
    formula: |
      candidates = all Collections with digitization_status == QUEUED
      sort by digitization_priority DESC,
             records_cutoff_date ASC  (older records first),
             created_at ASC           (final tie-break; id is never used)
      apply limit/offset pagination over the sorted list
    input_set: "Collections with digitization_status == QUEUED"
    precision: "n/a"

  - name: processing_backlog_score
    trigger: "POST /records/transfers/{id}/accession (snapshot stored on collection.backlog_score at creation)"
    algorithm: weighted_scoring
    formula: |
      age_years = records_age_years(clock, records_cutoff_date)
      backlog_score = BACKLOG_AGE_POINTS_PER_YEAR * min(age_years, BACKLOG_AGE_CAP)   # 10 * min(age, 60)
                    + CLASSIFICATION_WEIGHT[classification_level]   # NONE 0, CONFIDENTIAL 5, SECRET 15, TOP_SECRET 30
                    + (PRESIDENTIAL_BONUS if records_domain == PRESIDENTIAL else 0)   # +20
    input_set: "the Collection being created"
    constants:
      BACKLOG_AGE_POINTS_PER_YEAR: 10
      BACKLOG_AGE_CAP: 60
      CLASSIFICATION_WEIGHT: { NONE: 0, CONFIDENTIAL: 5, SECRET: 15, TOP_SECRET: 30 }
      PRESIDENTIAL_BONUS: 20
    precision: "integer points"

  - name: records_age_years
    trigger: "referenced by systematic_review_age_gate, digitization_priority, processing_backlog_score"
    algorithm: threshold
    formula: |
      age_years = clock.year - cutoff.year
                - (1 if (clock.month, clock.day) < (cutoff.month, cutoff.day) else 0)
      # anniversary rule: the birthday must have been reached in the clock's year.
      # If cutoff is Feb 29 and the clock year is not a leap year, the anniversary is Feb 28.
    input_set: "logical clock and a records_cutoff_date"
    precision: "whole years"

  - name: systematic_review_age_gate
    trigger: "POST /records/declass-reviews with review_type == SYSTEMATIC"
    algorithm: threshold
    formula: |
      eligible iff records_age_years(clock, collection.records_cutoff_date) >= SYSTEMATIC_REVIEW_AGE_YEARS   # 25
      # boundary is INCLUSIVE: a collection whose 25th anniversary is exactly today is eligible.
    constants:
      SYSTEMATIC_REVIEW_AGE_YEARS: 25

  - name: transfer_lag_gate
    trigger: "POST /records/transfers/{id}/accession"
    algorithm: threshold
    formula: |
      eligible_at = records_cutoff_date + schedule.transfer_lag_years years (anniversary arithmetic)
      accession allowed iff clock >= eligible_at   # boundary INCLUSIVE
    input_set: "transfer.records_cutoff_date, schedule.transfer_lag_years, logical clock"

  - name: referral_overdue
    trigger: "POST /records/declass-reviews/{id}/complete (evaluated per referral)"
    algorithm: threshold
    formula: |
      response_due_at = sent_at + REFERRAL_RESPONSE_DAYS days      # 21
      a SENT referral is overdue iff clock > response_due_at       # STRICTLY greater:
      # at exactly response_due_at the referral is NOT overdue and still blocks completion.
      # An overdue SENT referral counts as concurrence (no objection) in declass_review_outcome.
    constants:
      REFERRAL_RESPONSE_DAYS: 21

  - name: notification_cooling_gate
    trigger: "POST /records/presidential-restrictions/{id}/release"
    algorithm: threshold
    formula: |
      release allowed iff clock >= notified_at + NOTICE_COOLING_DAYS days   # 30; boundary INCLUSIVE
    constants:
      NOTICE_COOLING_DAYS: 30

  - name: card_expiry
    trigger: "any load of a ResearcherRegistration (lazy evaluation) and POST /records/researchers/{id}/activate"
    algorithm: threshold
    formula: |
      card_expires_at = activation clock + CARD_VALIDITY_YEARS years (anniversary arithmetic)   # 2
      an ACTIVE registration with clock >= card_expires_at is persisted as EXPIRED (boundary INCLUSIVE:
      # at exactly card_expires_at the card is expired; one second earlier it is ACTIVE).
    constants:
      CARD_VALIDITY_YEARS: 2

  - name: pull_due_back
    trigger: "POST /records/pull-requests/{id}/return"
    algorithm: threshold
    formula: |
      due_back_at = visit_date + 24 hours
      late_return = (returned_at > due_back_at)   # STRICTLY greater; return at exactly due_back_at is on time.
    input_set: "the PullRequest being returned and the logical clock"

  - name: daily_committed_pages
    trigger: "POST /records/reproduction-requests (creation gate); ReproductionRequest cancellation frees its pages"
    algorithm: aggregation
    formula: |
      committed = sum(page_count of the researcher's ReproductionRequests
                      whose created_at falls on the same UTC calendar day as the logical clock
                      and whose status is in {QUOTED, PAID, FULFILLED})
      creation allowed iff committed + new page_count <= REPRO_DAILY_PAGE_LIMIT   # 200; boundary INCLUSIVE
      # CANCELLED requests are excluded from the sum (cancellation restores quota).
    constants:
      REPRO_DAILY_PAGE_LIMIT: 200

  - name: active_pull_count
    trigger: "POST /records/pull-requests (creation gate)"
    algorithm: aggregation
    formula: |
      active = count of the researcher's PullRequests with status in {REQUESTED, PULLED}
      creation allowed iff active < MAX_ACTIVE_PULLS_PER_RESEARCHER   # 3: a 3rd succeeds, a 4th is rejected
      # RETURNED and CANCELLED pulls release their slot.
    constants:
      MAX_ACTIVE_PULLS_PER_RESEARCHER: 3

  - name: unit_reservation_overlap
    trigger: "POST /records/pull-requests (creation gate)"
    algorithm: interval_merge
    formula: |
      The new pull reserves the INCLUSIVE integer range [unit_start, unit_end] of its collection
      over the half-open occupation window [visit_date, visit_date + PULL_OCCUPATION_DAYS days).  # 2 days
      Conflict iff EXISTS another PullRequest on the SAME collection with status in {REQUESTED, PULLED}
        such that the unit ranges share at least one integer unit
        AND the occupation windows share at least one instant.
      # Adjacent ranges ([10,20] vs [21,30]) do NOT conflict; disjoint windows do NOT conflict
      # even for identical ranges. Resources on different collections never conflict.
    constants:
      PULL_OCCUPATION_DAYS: 2

  - name: reading_room_seat_capacity
    trigger: "POST /records/pull-requests (creation gate)"
    algorithm: interval_merge
    formula: |
      A pull occupies one reading-room seat on each UTC day in its occupation window
      [visit_date, visit_date + PULL_OCCUPATION_DAYS days) — i.e. the visit day and the next day.
      For each UTC day D in the new pull's window:
        occupants(D) = count of PullRequests (any researcher, any collection) with status in
                       {REQUESTED, PULLED} whose occupation window covers D
        require occupants(D) + 1 <= READING_ROOM_DAILY_SEATS   # 8; the 8th pull on a day succeeds, the 9th is rejected
      # Aggregate-capacity semantics: no pairwise exclusion, only the per-day count matters.
    constants:
      READING_ROOM_DAILY_SEATS: 8

  - name: restriction_posture
    trigger: "computed at accession; recomputed on PresidentialRestriction create/release and on DeclassReview completion"
    algorithm: constraint_propagation
    formula: |
      if any PresidentialRestriction of the collection has status in {IMPOSED, NOTIFIED}:
        restriction_posture = PRESIDENTIAL_HOLD
      elif classification_level != NONE:
        restriction_posture = CLASSIFIED_REVIEW_REQUIRED
      else:
        restriction_posture = PUBLIC
      # On every recompute that CHANGES the posture INTO PUBLIC, the posture-flip cascade fires:
      # FoiaRequests of this collection in {RECEIVED, IN_REVIEW} -> CLOSED (close_reason = RECORDS_MADE_PUBLIC).
    input_set: "the Collection, its non-RELEASED PresidentialRestrictions, classification_level"

  - name: declass_review_outcome
    trigger: "POST /records/declass-reviews/{id}/complete"
    algorithm: aggregation
    formula: |
      exempt_referrals = referrals of this review with status == RESPONDED and decision == EXEMPT
      # overdue SENT referrals count as concurrence and are ignored here.
      if reviewer_assessment == EXEMPT:
        outcome = EXEMPT_RETAINED
      elif exempt_referrals is non-empty:
        outcome = PARTIAL
      else:
        outcome = DECLASSIFIED
      exemption_codes = sorted set of (assessment exemption_code if EXEMPT) + (exemption_code of each EXEMPT referral)
    input_set: "the review's reviewer_assessment + its EquityReferrals"

  - name: appeal_window
    trigger: "POST /records/foia-requests/{id}/appeal"
    algorithm: threshold
    formula: |
      appeal allowed iff clock <= decided_at + APPEAL_WINDOW_DAYS days   # 30; boundary INCLUSIVE:
      # an appeal at exactly decided_at + 30 days is timely; one day later it is closed.
    constants:
      APPEAL_WINDOW_DAYS: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the caller's role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path segment ids must exist, validated left-to-right; each segment maps to its entity-specific 404"
    error_id: "ERR_AGENCY_NOT_FOUND / ERR_SCHEDULE_NOT_FOUND / ERR_TRANSFER_NOT_FOUND / ERR_COLLECTION_NOT_FOUND / ERR_REVIEW_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_RESEARCHER_NOT_FOUND / ERR_PULL_REQUEST_NOT_FOUND / ERR_REPRODUCTION_NOT_FOUND / ERR_FOIA_NOT_FOUND / ERR_RESTRICTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "body foreign-key ids must exist, validated in the endpoint's declared input order (e.g. schedule_id before agency_id on POST /records/transfers; researcher_id before collection_id on POST /records/pull-requests)"
    error_id: "entity-specific ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with body FKs"
  - priority: 5
    category: business_referential
    check: "entity-backed ownership: RecordsOfficer X-User-ID must equal the agency_id being acted on; Researcher X-User-ID must equal researcher_id of the request; AgencyLiaison X-User-ID must equal referral.agency_id"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /records/schedules, POST /records/schedules/{id}/submit, POST /records/transfers, POST /records/transfers/{id}/submit-metadata, POST /records/transfers/{id}/withdraw, POST /records/pull-requests, POST /records/reproduction-requests, POST /records/reproduction-requests/{id}/pay, POST /records/reproduction-requests/{id}/cancel, POST /records/foia-requests, POST /records/foia-requests/{id}/appeal, POST /records/equity-referrals/{id}/respond, POST /records/declass-reviews (MANDATORY)"
  - priority: 6
    category: business_referential
    check: "cross-FK consistency: transfer.agency_id must equal schedule.agency_id"
    error_id: ERR_AGENCY_MISMATCH
    http_status: 409
    applies_to: "POST /records/transfers"
  - priority: 6b
    category: concurrency
    check: "OCC: expected_collection_version must equal the collection's current version (stale reads rejected before any business gate; see concurrency_rules[mdr-create-stale-collection])"
    error_id: ERR_STALE_COLLECTION_VERSION
    http_status: 412
    applies_to: "POST /records/declass-reviews"
  - priority: 7
    category: state
    check: "target resource must be in a valid from-state for the requested transition (generic wrong-from rejection)"
    error_id: "ERR_INVALID_STATE; endpoint-specific: ERR_SCHEDULE_NOT_APPRAISED, ERR_TRANSFER_NOT_VALIDATED, ERR_REVIEW_NOT_IN_PROGRESS, ERR_REFERRAL_ALREADY_RESPONDED, ERR_PULL_NOT_FULFILLABLE, ERR_PULL_NOT_RETURNABLE, ERR_REPRO_NOT_PAYABLE, ERR_REPRO_NOT_CANCELLABLE, ERR_APPEAL_NOT_ALLOWED_STATE, ERR_FOIA_NOT_APPEALED, ERR_FOIA_ALREADY_ADJUDICATED, ERR_RESTRICTION_NOT_NOTIFIED, ERR_DIGITIZATION_NOT_QUEUED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7b
    category: state
    check: "referenced researcher must be ACTIVE (lazy EXPIRED evaluation applies on load: an ACTIVE registration with clock >= card_expires_at is first persisted as EXPIRED, then this check fires)"
    error_id: ERR_RESEARCHER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /records/pull-requests, POST /records/reproduction-requests, POST /records/foia-requests, POST /records/declass-reviews (MANDATORY)"
  - priority: 8
    category: business_safety
    check: "restriction posture gates: pull/reproduction creation requires restriction_posture == PUBLIC; enqueue-digitization and publish-digital require PUBLIC"
    error_id: ERR_COLLECTION_RESTRICTED
    http_status: 403
    applies_to: "POST /records/pull-requests, POST /records/reproduction-requests, POST /records/collections/{id}/enqueue-digitization, POST /records/collections/{id}/publish-digital"
  - priority: 9
    category: business_safety
    check: "segregation of duties: schedule decide requires X-User-ID != appraiser_id; FOIA decide-appeal requires X-User-ID != adjudicator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /records/schedules/{id}/decide, POST /records/foia-requests/{id}/decide-appeal"
  - priority: 10
    category: business_constraint
    check: "uniqueness: agency_code globally unique; email globally unique; (agency_id, schedule_number) unique; at most one OPEN/IN_PROGRESS review per collection; at most one referral per (review_id, agency_id); at most one non-RELEASED restriction per (collection_id, category)"
    error_id: "ERR_AGENCY_CODE_EXISTS / ERR_EMAIL_EXISTS / ERR_SCHEDULE_NUMBER_EXISTS / ERR_REVIEW_ALREADY_OPEN / ERR_DUPLICATE_REFERRAL / ERR_DUPLICATE_RESTRICTION_CATEGORY"
    http_status: 409
    applies_to: "creation endpoints and POST /records/declass-reviews/{id}/referrals"
  - priority: 11
    category: business_temporal
    check: "time gates against the logical clock: transfer lag elapsed; systematic-review age >= 25; cooling period elapsed; appeal window open; visit_date within [clock, clock+30d]"
    error_id: "ERR_TRANSFER_LAG_NOT_ELAPSED / ERR_SYSTEMATIC_REVIEW_PREMATURE / ERR_COOLING_PERIOD_ACTIVE / ERR_APPEAL_WINDOW_CLOSED / ERR_VISIT_DATE_OUT_OF_WINDOW"
    http_status: 409
    applies_to: "POST /records/transfers/{id}/accession, POST /records/declass-reviews, POST /records/presidential-restrictions/{id}/release, POST /records/foia-requests/{id}/appeal, POST /records/pull-requests"
  - priority: 12
    category: business_constraint
    check: "transfer method/metadata compatibility: ELECTRONIC requires metadata_standard == PREMIS_3_0 and non-empty checksum_manifest; PHYSICAL requires metadata_standard in {EAD_2002, MODS_3_7} and linear_feet > 0"
    error_id: "ERR_METADATA_STANDARD_MISMATCH / ERR_METHOD_REQUIREMENT_MISSING"
    http_status: 422
    applies_to: "POST /records/transfers"
  - priority: 13
    category: business_constraint
    check: "shape rules: disposition TEMPORARY cannot underlie a transfer; schedule must be APPROVED; collection must be DESCRIBED/PUBLISHED for pull/reproduction; presidential restrictions only on PRESIDENTIAL-domain collections; FOIA only on restricted collections; description notes non-empty; exemption codes required where mandated; MDR justification/requester required iff MANDATORY"
    error_id: "ERR_NOT_PERMANENT_DISPOSITION / ERR_SCHEDULE_NOT_APPROVED / ERR_COLLECTION_NOT_DESCRIBED / ERR_NOT_PRESIDENTIAL_RECORDS / ERR_FOIA_NOT_REQUIRED / ERR_COLLECTION_NOT_RESTRICTED / ERR_DESCRIPTION_INCOMPLETE / ERR_EXEMPTION_REQUIRED / ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "create + action endpoints as listed per error"
  - priority: 14
    category: business_constraint
    check: "reservation shape then conflict then capacity, in this order: unit range inside [1, units_total] (ERR_UNIT_RANGE_INVALID); span <= 24 (ERR_UNIT_SPAN_LIMIT_EXCEEDED); unit-range overlap conflict (ERR_UNIT_RESERVATION_CONFLICT); reading-room per-day seat capacity (ERR_READING_ROOM_CAPACITY); active-pull limit (ERR_ACTIVE_PULL_LIMIT_EXCEEDED)"
    error_id: "ERR_UNIT_RANGE_INVALID / ERR_UNIT_SPAN_LIMIT_EXCEEDED / ERR_UNIT_RESERVATION_CONFLICT / ERR_READING_ROOM_CAPACITY / ERR_ACTIVE_PULL_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /records/pull-requests"
  - priority: 15
    category: business_fiscal
    check: "quota and payment: daily committed pages + new page_count <= 200 (ERR_DAILY_PAGE_LIMIT_EXCEEDED); reproduction fulfill requires PAID (ERR_REPRO_NOT_PAID)"
    error_id: "ERR_DAILY_PAGE_LIMIT_EXCEEDED / ERR_REPRO_NOT_PAID"
    http_status: 409
    applies_to: "POST /records/reproduction-requests, POST /records/reproduction-requests/{id}/fulfill"

# =============================================================================
# §1.5 API Endpoint Table
# ALL_READ = every role except Anonymous.
# =============================================================================
endpoints:
  # --- Agency ---
  - method: POST
    path: "/records/agencies"
    description: "Register a federal agency"
    roles: [PlatformAdmin]
    code: 201
    input: [agency_code, name]
    output: Agency
    side_effects: []
  - method: GET
    path: "/records/agencies/{id}"
    description: "Get one agency"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- RecordsSchedule ---
  - method: POST
    path: "/records/schedules"
    description: "Create a records schedule (DRAFT). agency_id must equal the RecordsOfficer caller's X-User-ID. transfer_lag_years required iff disposition == PERMANENT."
    roles: [RecordsOfficer]
    code: 201
    input: [agency_id, schedule_number, title, records_domain, disposition, "transfer_lag_years?", classification_default]
    output: RecordsSchedule
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/records/schedules"
    description: "List schedules with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "RecordsSchedule[]"
    side_effects: []
  - method: GET
    path: "/records/schedules/{id}"
    description: "Get one schedule"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: RecordsSchedule
    side_effects: []
  - method: POST
    path: "/records/schedules/{id}/submit"
    description: "Submit a DRAFT schedule; also resubmits a RETURNED schedule (revision cycle)"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: RecordsSchedule
    side_effects: ["DRAFT|RETURNED -> SUBMITTED; on resubmission clears appraiser_id/appraisal_recommendation/decided_by/decision_note; version += 1"]
  - method: POST
    path: "/records/schedules/{id}/appraise"
    description: "Appraise a SUBMITTED schedule; stamps appraiser_id"
    roles: [AppraisalArchivist]
    code: 200
    input: [appraisal_recommendation]
    output: RecordsSchedule
    side_effects: ["SUBMITTED -> APPRAISED; appraiser_id = X-User-ID; version += 1"]
  - method: POST
    path: "/records/schedules/{id}/decide"
    description: "Decide an APPRAISED schedule (APPROVE|RETURN); decider must differ from appraiser (segregation of duties)"
    roles: [ChiefArchivist]
    code: 200
    input: [decision, "decision_note?"]
    output: RecordsSchedule
    side_effects: ["APPRAISED -> APPROVED|RETURNED; decided_by = X-User-ID; version += 1"]

  # --- Transfer ---
  - method: POST
    path: "/records/transfers"
    description: "Initiate a transfer under an APPROVED PERMANENT schedule; method/standard compatibility and method-specific requirements enforced at creation"
    roles: [RecordsOfficer]
    code: 201
    input: [schedule_id, agency_id, transfer_method, metadata_standard, unit_count, records_cutoff_date, "linear_feet?", "checksum_manifest?"]
    output: Transfer
    side_effects: ["status = INITIATED"]
  - method: GET
    path: "/records/transfers"
    description: "List transfers with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["schedule_id?", "agency_id?", "collection_id?", "status?", "limit?", "offset?"]
    output: "Transfer[]"
    side_effects: []
  - method: GET
    path: "/records/transfers/{id}"
    description: "Get one transfer"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: Transfer
    side_effects: []
  - method: POST
    path: "/records/transfers/{id}/submit-metadata"
    description: "Submit metadata element names for validation against the declared standard; lands VALIDATED (complete) or DEFICIENT (missing elements, retryable)"
    roles: [RecordsOfficer]
    code: 200
    input: [metadata_elements]
    output: Transfer
    side_effects: ["INITIATED|DEFICIENT -> VALIDATED or DEFICIENT; last_missing_elements refreshed (sorted); version += 1"]
  - method: POST
    path: "/records/transfers/{id}/accession"
    description: "Accession a VALIDATED transfer whose transfer lag has elapsed; creates the Collection"
    roles: [ProcessingArchivist]
    code: 200
    input: [receipt_note]
    output: Transfer
    side_effects: ["VALIDATED -> ACCESSIONED; accessioned_at = clock; Collection created (UNPROCESSED, fields copied, restriction_posture + backlog_score computed, demand counters 0); collection_id set; version += 1"]
  - method: POST
    path: "/records/transfers/{id}/withdraw"
    description: "Withdraw a non-accessioned transfer"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: Transfer
    side_effects: ["INITIATED|DEFICIENT|VALIDATED -> WITHDRAWN; version += 1"]

  # --- Collection (created only by accession cascade) ---
  - method: GET
    path: "/records/collections"
    description: "List collections with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["transfer_id?", "schedule_id?", "agency_id?", "processing_status?", "restriction_posture?", "limit?", "offset?"]
    output: "Collection[]"
    side_effects: []
  - method: GET
    path: "/records/collections/{id}"
    description: "Get one collection"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: Collection
    side_effects: []
  - method: POST
    path: "/records/collections/{id}/begin-processing"
    description: "Claim an UNPROCESSED collection for processing"
    roles: [ProcessingArchivist]
    code: 200
    input: []
    output: Collection
    side_effects: ["UNPROCESSED -> PROCESSING; assigned_archivist_id = X-User-ID; version += 1"]
  - method: POST
    path: "/records/collections/{id}/complete-description"
    description: "Store the three required description elements and mark the collection searchable"
    roles: [ProcessingArchivist]
    code: 200
    input: [scope_note, arrangement_note, container_list_summary]
    output: Collection
    side_effects: ["PROCESSING -> DESCRIBED; description fields stored; version += 1"]
  - method: POST
    path: "/records/collections/{id}/enqueue-digitization"
    description: "Enqueue a DESCRIBED, PUBLIC collection for digitization; computes the demand-weighted priority snapshot"
    roles: [ProcessingArchivist]
    code: 200
    input: []
    output: Collection
    side_effects: ["digitization_status NOT_REQUESTED -> QUEUED; digitization_priority computed (calculations.digitization_priority); version += 1"]
  - method: POST
    path: "/records/collections/{id}/complete-digitization"
    description: "Mark a QUEUED collection's digitization work complete"
    roles: [ProcessingArchivist]
    code: 200
    input: []
    output: Collection
    side_effects: ["digitization_status QUEUED -> DIGITIZED; version += 1"]
  - method: POST
    path: "/records/collections/{id}/publish-digital"
    description: "Publish digital surrogates to public access; requires DIGITIZED and PUBLIC posture"
    roles: [ChiefArchivist]
    code: 200
    input: []
    output: Collection
    side_effects: ["processing_status DESCRIBED -> PUBLISHED; version += 1"]
  - method: GET
    path: "/records/digitization-queue"
    description: "Computed read: QUEUED collections sorted by digitization_priority DESC, records_cutoff_date ASC, created_at ASC"
    roles: [PlatformAdmin, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "Collection[]"
    side_effects: []

  # --- DeclassReview / EquityReferral ---
  - method: POST
    path: "/records/declass-reviews"
    description: "Open a declassification review. SYSTEMATIC: ProcessingArchivist, age gate >= 25y applies. MANDATORY: Researcher (requester_researcher_id == X-User-ID, justification required). Both: OCC on expected_collection_version; collection posture must be CLASSIFIED_REVIEW_REQUIRED; at most one OPEN/IN_PROGRESS review per collection."
    roles: [ProcessingArchivist, Researcher]
    code: 201
    input: [collection_id, review_type, expected_collection_version, "requester_researcher_id?", "justification?"]
    output: DeclassReview
    side_effects: ["status = OPEN", "increments Collection.version by 1 (review demand recorded against the collection)"]
  - method: GET
    path: "/records/declass-reviews"
    description: "List declassification reviews with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["collection_id?", "requester_researcher_id?", "status?", "limit?", "offset?"]
    output: "DeclassReview[]"
    side_effects: []
  - method: GET
    path: "/records/declass-reviews/{id}"
    description: "Get one declassification review"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: DeclassReview
    side_effects: []
  - method: POST
    path: "/records/declass-reviews/{id}/begin"
    description: "Begin an OPEN review; stamps lead_reviewer_id"
    roles: [DeclassReviewer]
    code: 200
    input: []
    output: DeclassReview
    side_effects: ["OPEN -> IN_PROGRESS; lead_reviewer_id = X-User-ID; version += 1"]
  - method: POST
    path: "/records/declass-reviews/{id}/referrals"
    description: "Create equity referrals to other agencies (bulk, atomic: any duplicate or unknown agency aborts the whole request and no referral is created)"
    roles: [DeclassReviewer]
    code: 201
    input: [agency_ids]
    output: "EquityReferral[]"
    side_effects: ["one EquityReferral (SENT) per agency_id; sent_at = clock; response_due_at = clock + 21 days"]
  - method: POST
    path: "/records/declass-reviews/{id}/complete"
    description: "Complete an IN_PROGRESS review once all referrals are RESPONDED or overdue; computes outcome and cascades into the collection"
    roles: [DeclassReviewer]
    code: 200
    input: [reviewer_assessment, "exemption_code?"]
    output: DeclassReview
    side_effects: ["IN_PROGRESS -> COMPLETED; outcome computed (calculations.declass_review_outcome); completed_at = clock; collection classification/declass_outcome updated per outcome; restriction_posture recomputed; posture-flip cascade closes pending FOIA requests; version += 1; collection.version += 1"]
  - method: GET
    path: "/records/equity-referrals"
    description: "List equity referrals with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["review_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: "EquityReferral[]"
    side_effects: []
  - method: GET
    path: "/records/equity-referrals/{id}"
    description: "Get one equity referral"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: EquityReferral
    side_effects: []
  - method: POST
    path: "/records/equity-referrals/{id}/respond"
    description: "Referred agency responds DECLASSIFY or EXEMPT (exemption_code required iff EXEMPT)"
    roles: [AgencyLiaison]
    code: 200
    input: [decision, "exemption_code?"]
    output: EquityReferral
    side_effects: ["SENT -> RESPONDED; decision/exemption_code/responded_at recorded; version += 1"]

  # --- ResearcherRegistration ---
  - method: POST
    path: "/records/researchers"
    description: "Self-register a researcher (PENDING). Email must be unique."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, affiliation, id_document]
    output: ResearcherRegistration
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/records/researchers/{id}"
    description: "Get one researcher registration (lazy EXPIRED evaluation applies)"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: ResearcherRegistration
    side_effects: ["may persist ACTIVE -> EXPIRED when clock >= card_expires_at"]
  - method: POST
    path: "/records/researchers/{id}/activate"
    description: "Activate a PENDING registration or renew an EXPIRED one; sets card_expires_at = clock + 2 years"
    roles: [ResearchRoomStaff]
    code: 200
    input: []
    output: ResearcherRegistration
    side_effects: ["PENDING|EXPIRED -> ACTIVE; card_expires_at stamped; version += 1"]

  # --- PullRequest ---
  - method: POST
    path: "/records/pull-requests"
    description: "Request a research-room pull of a unit range for a visit date; full gate cascade (researcher ACTIVE, collection DESCRIBED|PUBLISHED + PUBLIC, unit range/span, visit window, overlap, seat capacity, active-pull limit)"
    roles: [Researcher]
    code: 201
    input: [researcher_id, collection_id, unit_start, unit_end, visit_date]
    output: PullRequest
    side_effects: ["status = REQUESTED; due_back_at = visit_date + 24h"]
  - method: GET
    path: "/records/pull-requests"
    description: "List pull requests with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["researcher_id?", "collection_id?", "status?", "limit?", "offset?"]
    output: "PullRequest[]"
    side_effects: []
  - method: GET
    path: "/records/pull-requests/{id}"
    description: "Get one pull request"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: PullRequest
    side_effects: []
  - method: POST
    path: "/records/pull-requests/{id}/fulfill"
    description: "Pull the requested units to the research room"
    roles: [ResearchRoomStaff]
    code: 200
    input: []
    output: PullRequest
    side_effects: ["REQUESTED -> PULLED; collection.pull_count_total += 1; priority recompute if QUEUED; version += 1"]
  - method: POST
    path: "/records/pull-requests/{id}/return"
    description: "Return pulled units; a late return (returned_at > due_back_at) suspends the researcher and cancels their pending work"
    roles: [ResearchRoomStaff]
    code: 200
    input: []
    output: PullRequest
    side_effects: ["PULLED -> RETURNED; returned_at = clock; late_return computed; on late: researcher SUSPENDED + sibling REQUESTED pulls CANCELLED + QUOTED reproductions CANCELLED; version += 1"]

  # --- ReproductionRequest ---
  - method: POST
    path: "/records/reproduction-requests"
    description: "Request reproduction of pages from a described, public collection; fee computed at creation; daily 200-page quota enforced"
    roles: [Researcher]
    code: 201
    input: [researcher_id, collection_id, page_count, format, "rush?"]
    output: ReproductionRequest
    side_effects: ["status = QUOTED; fee_cents computed (calculations.reproduction_fee, canonical rounding order)"]
  - method: GET
    path: "/records/reproduction-requests"
    description: "List reproduction requests with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["researcher_id?", "collection_id?", "status?", "limit?", "offset?"]
    output: "ReproductionRequest[]"
    side_effects: []
  - method: GET
    path: "/records/reproduction-requests/{id}"
    description: "Get one reproduction request"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: ReproductionRequest
    side_effects: []
  - method: POST
    path: "/records/reproduction-requests/{id}/pay"
    description: "Pay a QUOTED reproduction request (owning researcher only)"
    roles: [Researcher]
    code: 200
    input: [payment_reference]
    output: ReproductionRequest
    side_effects: ["QUOTED -> PAID; payment_reference recorded; version += 1"]
  - method: POST
    path: "/records/reproduction-requests/{id}/fulfill"
    description: "Fulfill a PAID reproduction request; feeds the collection's digitization demand counters"
    roles: [ResearchRoomStaff]
    code: 200
    input: []
    output: ReproductionRequest
    side_effects: ["PAID -> FULFILLED; collection.repro_pages_fulfilled += page_count; priority recompute if QUEUED; version += 1"]
  - method: POST
    path: "/records/reproduction-requests/{id}/cancel"
    description: "Cancel a QUOTED reproduction request; its pages stop counting toward the daily quota"
    roles: [Researcher]
    code: 200
    input: []
    output: ReproductionRequest
    side_effects: ["QUOTED -> CANCELLED; committed daily pages freed; version += 1"]

  # --- FoiaRequest ---
  - method: POST
    path: "/records/foia-requests"
    description: "File a FOIA request against a restricted collection (owning researcher only)"
    roles: [Researcher]
    code: 201
    input: [researcher_id, collection_id, description_of_records]
    output: FoiaRequest
    side_effects: ["status = RECEIVED"]
  - method: GET
    path: "/records/foia-requests"
    description: "List FOIA requests with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["researcher_id?", "collection_id?", "status?", "limit?", "offset?"]
    output: "FoiaRequest[]"
    side_effects: []
  - method: GET
    path: "/records/foia-requests/{id}"
    description: "Get one FOIA request"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: FoiaRequest
    side_effects: []
  - method: POST
    path: "/records/foia-requests/{id}/adjudicate"
    description: "Adjudicate a RECEIVED or IN_REVIEW request (GRANT|PARTIAL|DENY); PARTIAL/DENY require claimed_exemptions"
    roles: [FoiaOfficer]
    code: 200
    input: [decision, "claimed_exemptions?"]
    output: FoiaRequest
    side_effects: ["-> GRANTED|PARTIAL_GRANT|DENIED; adjudicator_id/decided_at stamped; on GRANT: collection.foia_release_count += 1 and priority recompute if QUEUED; version += 1"]
  - method: POST
    path: "/records/foia-requests/{id}/appeal"
    description: "Appeal a PARTIAL_GRANT or DENIED request within the 30-day window (owning researcher only)"
    roles: [Researcher]
    code: 200
    input: [appeal_reason]
    output: FoiaRequest
    side_effects: ["-> APPEALED; appeal_reason recorded; version += 1"]
  - method: POST
    path: "/records/foia-requests/{id}/decide-appeal"
    description: "Decide an appeal (GRANT|UPHOLD|REMAND); decider must differ from the adjudicator (segregation of duties)"
    roles: [FoiaAppealsOfficer]
    code: 200
    input: [appeal_decision]
    output: FoiaRequest
    side_effects: ["-> APPEAL_GRANTED|APPEAL_UPHELD|IN_REVIEW; on GRANT: collection.foia_release_count += 1 and priority recompute if QUEUED; on REMAND: remand_count += 1; version += 1"]

  # --- PresidentialRestriction ---
  - method: POST
    path: "/records/presidential-restrictions"
    description: "Impose a P1..P6 restriction on a PRESIDENTIAL-domain collection; one non-RELEASED restriction per (collection, category)"
    roles: [ChiefArchivist]
    code: 201
    input: [collection_id, category]
    output: PresidentialRestriction
    side_effects: ["status = IMPOSED; collection.restriction_posture recomputed (becomes PRESIDENTIAL_HOLD); collection.version += 1"]
  - method: GET
    path: "/records/presidential-restrictions"
    description: "List presidential restrictions with filters and pagination"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: ["collection_id?", "status?", "limit?", "offset?"]
    output: "PresidentialRestriction[]"
    side_effects: []
  - method: GET
    path: "/records/presidential-restrictions/{id}"
    description: "Get one presidential restriction"
    roles: [PlatformAdmin, RecordsOfficer, AgencyLiaison, AppraisalArchivist, ProcessingArchivist, DeclassReviewer, ChiefArchivist, ResearchRoomStaff, FoiaOfficer, FoiaAppealsOfficer, Researcher]
    code: 200
    input: []
    output: PresidentialRestriction
    side_effects: []
  - method: POST
    path: "/records/presidential-restrictions/{id}/designate"
    description: "Designate the former president's representative for an IMPOSED restriction"
    roles: [ChiefArchivist]
    code: 200
    input: [representative_id]
    output: PresidentialRestriction
    side_effects: ["representative_id recorded; version += 1"]
  - method: POST
    path: "/records/presidential-restrictions/{id}/notify"
    description: "Notify the designated representative; starts the 30-day cooling period"
    roles: [ChiefArchivist]
    code: 200
    input: []
    output: PresidentialRestriction
    side_effects: ["IMPOSED -> NOTIFIED; notified_at = clock; version += 1"]
  - method: POST
    path: "/records/presidential-restrictions/{id}/release"
    description: "Release a NOTIFIED restriction once the cooling period has elapsed; posture recomputes and the posture-flip cascade may close pending FOIA requests"
    roles: [ChiefArchivist]
    code: 200
    input: []
    output: PresidentialRestriction
    side_effects: ["NOTIFIED -> RELEASED; released_at = clock; collection.restriction_posture recomputed; posture-flip cascade closes pending FOIA requests; version += 1; collection.version += 1"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Startup default before any call is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All age/lag/cooling/window/expiry rules evaluate against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced/set; lazy card-expiry evaluation applies on subsequent loads"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller's role is not in the endpoint's roles list" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, out-of-enum value, or empty-string where non-empty is required" }
  # --- Not found (entity-specific, 404) ---
  - { id: ERR_AGENCY_NOT_FOUND, http: 404, condition: "agency id does not exist" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "schedule id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "transfer id does not exist" }
  - { id: ERR_COLLECTION_NOT_FOUND, http: 404, condition: "collection id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "declassification review id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "equity referral id does not exist" }
  - { id: ERR_RESEARCHER_NOT_FOUND, http: 404, condition: "researcher registration id does not exist" }
  - { id: ERR_PULL_REQUEST_NOT_FOUND, http: 404, condition: "pull request id does not exist" }
  - { id: ERR_REPRODUCTION_NOT_FOUND, http: 404, condition: "reproduction request id does not exist" }
  - { id: ERR_FOIA_NOT_FOUND, http: 404, condition: "FOIA request id does not exist" }
  - { id: ERR_RESTRICTION_NOT_FOUND, http: 404, condition: "presidential restriction id does not exist" }
  # --- Referential / ownership ---
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller's X-User-ID does not match the owning FK (agency_id for RecordsOfficer/AgencyLiaison, researcher_id for Researcher)" }
  - { id: ERR_AGENCY_MISMATCH, http: 409, condition: "transfer.agency_id does not equal schedule.agency_id" }
  # --- State (409) ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-from-state rejection for a state transition" }
  - { id: ERR_SCHEDULE_NOT_APPRAISED, http: 409, condition: "decide requires status == APPRAISED" }
  - { id: ERR_SCHEDULE_NOT_APPROVED, http: 409, condition: "transfer creation requires the schedule to be APPROVED" }
  - { id: ERR_NOT_PERMANENT_DISPOSITION, http: 409, condition: "transfer creation requires schedule disposition == PERMANENT" }
  - { id: ERR_TRANSFER_NOT_VALIDATED, http: 409, condition: "accession requires status == VALIDATED" }
  - { id: ERR_TRANSFER_LAG_NOT_ELAPSED, http: 409, condition: "clock is before records_cutoff_date + transfer_lag_years anniversary" }
  - { id: ERR_SYSTEMATIC_REVIEW_PREMATURE, http: 409, condition: "SYSTEMATIC review creation requires records_age_years >= 25 against the logical clock" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "collection already has a review in OPEN or IN_PROGRESS" }
  - { id: ERR_REVIEW_NOT_IN_PROGRESS, http: 409, condition: "referral creation / response / completion requires the review to be IN_PROGRESS" }
  - { id: ERR_REFERRAL_ALREADY_RESPONDED, http: 409, condition: "respond requires referral status == SENT" }
  - { id: ERR_REFERRALS_OUTSTANDING, http: 409, condition: "complete called while some referral is SENT and not yet overdue (clock <= response_due_at)" }
  - { id: ERR_DUPLICATE_REFERRAL, http: 409, condition: "a referral already exists for (review_id, agency_id), or agency_ids contains a duplicate" }
  - { id: ERR_RESEARCHER_NOT_ACTIVE, http: 409, condition: "researcher registration is not ACTIVE (PENDING, EXPIRED after lazy evaluation, or SUSPENDED)" }
  - { id: ERR_PULL_NOT_FULFILLABLE, http: 409, condition: "fulfill requires pull status == REQUESTED" }
  - { id: ERR_PULL_NOT_RETURNABLE, http: 409, condition: "return requires pull status == PULLED" }
  - { id: ERR_REPRO_NOT_PAYABLE, http: 409, condition: "pay requires reproduction status == QUOTED" }
  - { id: ERR_REPRO_NOT_PAID, http: 402, condition: "fulfill requires reproduction status == PAID" }
  - { id: ERR_REPRO_NOT_CANCELLABLE, http: 409, condition: "cancel requires reproduction status == QUOTED" }
  - { id: ERR_APPEAL_NOT_ALLOWED_STATE, http: 409, condition: "appeal requires status in {PARTIAL_GRANT, DENIED}" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "clock is after decided_at + 30 days" }
  - { id: ERR_FOIA_NOT_APPEALED, http: 409, condition: "decide-appeal requires status == APPEALED" }
  - { id: ERR_FOIA_ALREADY_ADJUDICATED, http: 409, condition: "adjudicate called on a request already decided and not remanded (GRANTED/PARTIAL_GRANT/DENIED)" }
  - { id: ERR_RESTRICTION_NOT_NOTIFIED, http: 409, condition: "release requires restriction status == NOTIFIED" }
  - { id: ERR_COOLING_PERIOD_ACTIVE, http: 409, condition: "clock is before notified_at + 30 days (cooling period still running)" }
  - { id: ERR_DIGITIZATION_NOT_QUEUED, http: 409, condition: "complete-digitization requires digitization_status == QUEUED" }
  - { id: ERR_DIGITIZATION_NOT_READY, http: 409, condition: "publish-digital requires digitization_status == DIGITIZED" }
  # --- Safety / compliance ---
  - { id: ERR_COLLECTION_RESTRICTED, http: 403, condition: "operation requires restriction_posture == PUBLIC" }
  - { id: ERR_COLLECTION_NOT_RESTRICTED, http: 409, condition: "declassification review requires posture == CLASSIFIED_REVIEW_REQUIRED (MDR) or classification != NONE (SYSTEMATIC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same X-User-ID performed the earlier step (appraise vs decide; adjudicate vs decide-appeal)" }
  # --- Uniqueness / constraint ---
  - { id: ERR_AGENCY_CODE_EXISTS, http: 409, condition: "agency_code already registered" }
  - { id: ERR_EMAIL_EXISTS, http: 409, condition: "email already registered" }
  - { id: ERR_SCHEDULE_NUMBER_EXISTS, http: 409, condition: "schedule_number already exists for this agency" }
  - { id: ERR_NOT_PRESIDENTIAL_RECORDS, http: 409, condition: "restriction target collection's records_domain is not PRESIDENTIAL" }
  - { id: ERR_DUPLICATE_RESTRICTION_CATEGORY, http: 409, condition: "a non-RELEASED restriction of this category already exists on the collection" }
  - { id: ERR_REPRESENTATIVE_REQUIRED, http: 409, condition: "notify requires a designated representative_id" }
  - { id: ERR_METADATA_STANDARD_MISMATCH, http: 422, condition: "ELECTRONIC requires PREMIS_3_0; PHYSICAL requires EAD_2002 or MODS_3_7" }
  - { id: ERR_METHOD_REQUIREMENT_MISSING, http: 422, condition: "PHYSICAL requires linear_feet > 0; ELECTRONIC requires non-empty checksum_manifest" }
  - { id: ERR_DESCRIPTION_INCOMPLETE, http: 422, condition: "scope_note, arrangement_note and container_list_summary must all be non-empty" }
  - { id: ERR_EXEMPTION_REQUIRED, http: 422, condition: "exemption code(s) required: PARTIAL/DENY adjudication needs claimed_exemptions; EXEMPT referral response needs exemption_code; EXEMPT reviewer assessment needs exemption_code" }
  - { id: ERR_FOIA_NOT_REQUIRED, http: 409, condition: "FOIA request against a PUBLIC collection (records already open)" }
  - { id: ERR_COLLECTION_NOT_DESCRIBED, http: 409, condition: "operation requires processing_status in {DESCRIBED, PUBLISHED}" }
  - { id: ERR_UNIT_RANGE_INVALID, http: 400, condition: "unit_start/unit_end outside 1..units_total or unit_start > unit_end" }
  - { id: ERR_UNIT_SPAN_LIMIT_EXCEEDED, http: 409, condition: "unit_end - unit_start + 1 > 24" }
  - { id: ERR_UNIT_RESERVATION_CONFLICT, http: 409, condition: "unit range overlaps another REQUESTED/PULLED pull on the same collection with an overlapping occupation window" }
  - { id: ERR_READING_ROOM_CAPACITY, http: 409, condition: "some day in the occupation window already has 8 seated pulls" }
  - { id: ERR_VISIT_DATE_OUT_OF_WINDOW, http: 409, condition: "visit_date outside [clock, clock + 30 days]" }
  - { id: ERR_ACTIVE_PULL_LIMIT_EXCEEDED, http: 409, condition: "researcher already has 3 pulls in REQUESTED/PULLED" }
  # --- Fiscal / quota ---
  - { id: ERR_DAILY_PAGE_LIMIT_EXCEEDED, http: 409, condition: "committed daily pages + new page_count > 200" }
  # --- OCC ---
  - { id: ERR_STALE_COLLECTION_VERSION, http: 412, condition: "expected_collection_version does not match the collection's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; registers agencies and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /records/agencies"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Anonymous
    description: "Unauthenticated public caller; may only self-register as a researcher"
    identity: opaque
    exclusive_operations:
      - "POST /records/researchers"
    shared_operations: []
  - name: RecordsOfficer
    description: "Agency records officer; owns schedule submission and transfer initiation/metadata for their own agency"
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /records/schedules"
      - "POST /records/schedules/{id}/submit"
      - "POST /records/transfers"
      - "POST /records/transfers/{id}/submit-metadata"
      - "POST /records/transfers/{id}/withdraw"
    shared_operations: ["all GET endpoints"]
  - name: AgencyLiaison
    description: "Responds to equity referrals on behalf of their own agency"
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /records/equity-referrals/{id}/respond"
    shared_operations: ["all GET endpoints"]
  - name: AppraisalArchivist
    description: "NARA appraisal archivist; appraises submitted schedules"
    identity: opaque
    exclusive_operations:
      - "POST /records/schedules/{id}/appraise"
    shared_operations: ["all GET endpoints"]
  - name: ProcessingArchivist
    description: "NARA processing archivist; accessions transfers, processes/describes collections, manages the digitization queue, opens systematic reviews"
    identity: opaque
    exclusive_operations:
      - "POST /records/transfers/{id}/accession"
      - "POST /records/collections/{id}/begin-processing"
      - "POST /records/collections/{id}/complete-description"
      - "POST /records/collections/{id}/enqueue-digitization"
      - "POST /records/collections/{id}/complete-digitization"
      - "POST /records/declass-reviews (review_type == SYSTEMATIC)"
    shared_operations: ["all GET endpoints", "GET /records/digitization-queue"]
  - name: DeclassReviewer
    description: "NARA declassification reviewer; begins reviews, issues equity referrals, completes reviews"
    identity: opaque
    exclusive_operations:
      - "POST /records/declass-reviews/{id}/begin"
      - "POST /records/declass-reviews/{id}/referrals"
      - "POST /records/declass-reviews/{id}/complete"
    shared_operations: ["all GET endpoints", "GET /records/digitization-queue"]
  - name: ChiefArchivist
    description: "Archivist of the United States delegate; decides schedules, manages presidential restrictions, publishes digital surrogates"
    identity: opaque
    exclusive_operations:
      - "POST /records/schedules/{id}/decide"
      - "POST /records/collections/{id}/publish-digital"
      - "POST /records/presidential-restrictions"
      - "POST /records/presidential-restrictions/{id}/designate"
      - "POST /records/presidential-restrictions/{id}/notify"
      - "POST /records/presidential-restrictions/{id}/release"
    shared_operations: ["all GET endpoints", "GET /records/digitization-queue"]
  - name: ResearchRoomStaff
    description: "Research-room operator; activates researcher cards, fulfills/returns pulls, fulfills reproductions"
    identity: opaque
    exclusive_operations:
      - "POST /records/researchers/{id}/activate"
      - "POST /records/pull-requests/{id}/fulfill"
      - "POST /records/pull-requests/{id}/return"
      - "POST /records/reproduction-requests/{id}/fulfill"
    shared_operations: ["all GET endpoints", "GET /records/digitization-queue"]
  - name: FoiaOfficer
    description: "FOIA initial-review officer; adjudicates requests"
    identity: opaque
    exclusive_operations:
      - "POST /records/foia-requests/{id}/adjudicate"
    shared_operations: ["all GET endpoints"]
  - name: FoiaAppealsOfficer
    description: "FOIA appellate authority; decides appeals; must differ from the adjudicator"
    identity: opaque
    exclusive_operations:
      - "POST /records/foia-requests/{id}/decide-appeal"
    shared_operations: ["all GET endpoints"]
  - name: Researcher
    description: "Registered researcher; files pull/reproduction/FOIA/MDR requests as themselves"
    identity: "entity_backed:ResearcherRegistration"
    exclusive_operations:
      - "POST /records/pull-requests"
      - "POST /records/reproduction-requests"
      - "POST /records/reproduction-requests/{id}/pay"
      - "POST /records/reproduction-requests/{id}/cancel"
      - "POST /records/foia-requests"
      - "POST /records/foia-requests/{id}/appeal"
      - "POST /records/declass-reviews (review_type == MANDATORY)"
    shared_operations: ["all GET endpoints"]
