              as: FundAdministrator
            - call: "POST /capital-call-allocations/${rcal2_id}/fund"
              payload: { paid_amount_cents: "${rcal2_amt}" }
              as: FundAdministrator
            - call: "POST /portfolio-companies"
              payload: { name: "Gamma", sector: "Health" }
              as: FundManager
              captures: { rcpc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${rcf_id}", portfolio_company_id: "${rcpc_id}", cost_basis_cents: 10000000, ownership_pct_bps: 1000 }
              as: FundManager
              captures: { rcinv_id: "$.data.id" }
            - call: "POST /investments/${rcinv_id}/realize"
              payload: { realized_proceeds_cents: 5000000 }
              as: FundManager
            - call: "GET /funds/${rcf_id}"
              payload: {}
              as: FundManager
              captures: { rcf_v2: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${rcf_id}", source_investment_id: "${rcinv_id}", gross_amount_cents: 3000000, distribution_type: "RETURN_OF_CAPITAL", recyclable: true, expected_fund_version: "${rcf_v2}" }
              as: FundManager
              captures: { rc_evt_id: "$.data.id" }
            - call: "POST /distribution-events/${rc_evt_id}/pay"
              payload: {}
              as: FundAdministrator
          trigger:
            - call: "POST /distribution-events/${rc_evt_id}/recall"
              payload: {}
              as: FundManager
              captures: { rc_recycled: "$.data.recycled_amount_cents" }
