# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3223_volunteer_moderator_governance_community_policy_enforcement
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as excluded_because stubs with no test_recipe.
# Every test_recipe here doubles as a §1.5 reachability audit: each
# setup_api_calls chain drives empty-DB into the precondition using only
# endpoints declared in §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: community_create_returns_posture_fields_and_first_top_moderator
        claim_type: Creation
        grounds:
          - entities.Community
          - endpoints.POST_/api/communities
          - endpoints.GET_/api/communities/{id}/moderators
        distinguishing_aspect: "A community created with only name, description and is_over_18 comes back 201 with state ACTIVE, enforcement_tier 1, health_index 100.00, version 1 and a synthesized ACTIVE top moderator row at top_rank 1; state and the counters are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community", is_over_18: false }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
                alpha_created: $.data.created_at
          assert:
            - "the response status is 201 and response_type is object"
            - "Community.${alpha_id}.name == \"r/Alpha\" and Community.${alpha_id}.is_over_18 == false"
            - "Community.${alpha_id}.state == ACTIVE"
            - "Community.${alpha_id}.enforcement_tier == 1 and Community.${alpha_id}.health_index == 100.00"
            - "Community.${alpha_id}.active_moderator_count == 1 and active_top_moderator_count == 1"
            - "Community.${alpha_id}.inactive_moderator_count == 0 and active_rule_count == 0"
            - "Community.${alpha_id}.version == 1 and Community.${alpha_id}.restricted_since_utc == null"
            - "Community.${alpha_id}.quarantine_approval_count == 0 and quarantine_reinstatement_count == 0"
            - "the response data carries non-null id, created_at and updated_at and a non-null meta.api_request_id"
            - "GET /api/communities/${alpha_id}/moderators returns exactly 1 row with moderator_role TOP_MODERATOR, status ACTIVE, top_rank 1, is_top_moderator true and moderator_version 1"

      - name: community_get_round_trips_configuration_and_derived_fields
        claim_type: Retrieval
        grounds:
          - entities.Community
          - entities.Community.fields.protest_exemption_until_utc
          - entities.Community.fields.applying_sanction_count
          - endpoints.GET_/api/communities/{id}
        distinguishing_aspect: "Every declarative field round-trips through GET exactly as posted and the null-valued derived fields stay null rather than defaulting to zero or an empty string."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One community created with is_over_18 true and a long description."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/NightShift", description: "Late night discussion", is_over_18: true }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                omega_id: $.data.id
          trigger:
            - call: "GET /api/communities/${omega_id}"
              payload: {}
              as: Anonymous
          assert:
            - "the response status is 200"
            - "Community.${omega_id}.name == \"r/NightShift\" and Community.${omega_id}.description == \"Late night discussion\""
            - "Community.${omega_id}.is_over_18 == true"
            - "Community.${omega_id}.protest_exemption_until_utc is null and Community.${omega_id}.restricted_since_utc is null"
            - "Community.${omega_id}.applying_sanction_count == 0 and Community.${omega_id}.open_report_weight == 0.00"
            - "Community.${omega_id}.health_index == 100.00"

      - name: communities_list_filters_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/communities
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three communities on file, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, offset 2 returns the remaining row with has_more false, and total_count counts the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Three communities, one of them later restricted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
            - call: "POST /api/communities"
              payload: { name: "r/Beta", description: "Beta" }
              as: Account
              as_user_id: "mod-b"
              captures:
                beta_id: $.data.id
            - call: "POST /api/communities"
              payload: { name: "r/Gamma", description: "Gamma" }
              as: Account
              as_user_id: "mod-g"
              captures:
                gamma_id: $.data.id
          trigger:
            - call: "GET /api/communities"
              payload: { limit: 2, offset: 0 }
              as: Anonymous
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/communities?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/communities?state=ACTIVE returns 3 rows"
            - "GET /api/communities?enforcement_tier=3 returns 0 rows"
            - "GET /api/communities with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: community_get_with_an_unknown_id_returns_community_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/communities/{id}
          - errors[ERR_COMMUNITY_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on the community path segment produces the entity-specific 404 ERR_COMMUNITY_NOT_FOUND rather than a generic ERR_NOT_FOUND and rather than a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. No community has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/communities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 404 and error_id == ERR_COMMUNITY_NOT_FOUND"
            - "error_id != ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: community_create_missing_description_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Community.fields.description
          - validations[priority=19]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "description is a required input with no default, so omitting it is the priority-19 request-shape check returning 400 ERR_INVALID_REQUEST, not ERR_DUPLICATE_COMMUNITY_NAME and not a silently empty description."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/communities"
              payload: { name: "r/Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_DUPLICATE_COMMUNITY_NAME"
            - "GET /api/communities returns 0 rows"

      - name: community_create_omitting_is_over_18_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.Community.fields.is_over_18
          - entities.Post.fields.is_over_18
          - endpoints.POST_/api/communities
          - endpoints.POST_/api/communities/{id}/posts
        distinguishing_aspect: "is_over_18 declares a default of false on both Community and Post, so omitting it stores boolean false rather than null or an empty string, and the response echoes false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/posts"
              payload: { author_account_id: "user-ap", title: "Title", body: "Body", post_type: "TEXT" }
              as: Account
              as_user_id: "user-ap"
              captures:
                post_id: $.data.id
          assert:
            - "the response status is 201"
            - "Post.${post_id}.is_over_18 == false and Post.${post_id}.is_over_18 is not null"
            - "Post.${post_id}.status == PUBLISHED and Post.${post_id}.removal_count == 0"
            - "Community.${alpha_id}.is_over_18 == false"

      - name: community_derived_fields_recompute_from_children
        claim_type: Computed Fields
        grounds:
          - entities.Community.fields.open_report_weight
          - entities.Community.fields.active_rule_count
          - entities.Community.fields.active_moderator_count
          - entities.Community.fields.applying_sanction_count
          - endpoints.POST_/api/communities/{id}/content-reports
          - endpoints.POST_/api/communities/{id}/rules
        distinguishing_aspect: "open_report_weight, active_rule_count, active_moderator_count and applying_sanction_count all derive from cross-entity data and move independently: filing two tier-2 reports and authoring one rule changes the weight and the rule count while leaving the moderator and sanction counts untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator, one band-3 rule and two OPEN tier-2 reports."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-3", rule_text: "Adult only", rule_band: 3, is_sitewide_floor: true, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                rule_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "COMMENT", content_source_id: "cmt-1", reporter_account_id: "rep-1", report_reason_code: "HARASSMENT", resolution_tier: 2 }
              as: Account
              as_user_id: "rep-1"
              captures:
                rep_1: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "COMMENT", content_source_id: "cmt-2", reporter_account_id: "rep-2", report_reason_code: "SPAM", resolution_tier: 2 }
              as: Account
              as_user_id: "rep-2"
              captures:
                rep_2: $.data.id
          trigger:
            - call: "GET /api/communities/${alpha_id}"
              payload: {}
              as: Moderator
              as_user_id: "mod-alpha"
          assert:
            - "the response status is 200"
            - "Community.${alpha_id}.open_report_weight == 1.00"
            - "Community.${alpha_id}.health_index == 99.00"
            - "Community.${alpha_id}.active_rule_count == 1"
            - "Community.${alpha_id}.active_moderator_count == 1 and active_top_moderator_count == 1"
            - "Community.${alpha_id}.applying_sanction_count == 0"

      - name: community_rule_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.CommunityRule.fields.status
          - endpoints.POST_/api/communities/{id}/rules
        distinguishing_aspect: "CommunityRule.id, created_at, updated_at, version and status are all source system: the create response carries a server-minted id and version 1 with status ACTIVE, and none of those values can be derived from the request payload."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-1", rule_text: "Be civil", rule_band: 1, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                rule_id: $.data.id
                rule_v: $.data.version
                rule_status: $.data.status
          assert:
            - "the response status is 201"
            - "CommunityRule.${rule_id}.status == ACTIVE and CommunityRule.${rule_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "CommunityRule.${rule_id}.community_id == ${alpha_id}"
            - "GET /api/communities/${alpha_id}/rules/${rule_id} returns the same row with the same version"

      - name: community_rule_band_out_of_range_is_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CommunityRule.fields.rule_band
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=19]
        distinguishing_aspect: "rule_band is a closed integer set of 1, 2 and 3, so band 4 is refused as a request-shape error rather than being clamped to 3 or accepted as an unknown band."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
          trigger:
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-9", rule_text: "Too high", rule_band: 4, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/communities/${alpha_id}/rules returns 0 rows"
            - "Community.${alpha_id}.active_rule_count == 0"

      - name: community_rule_below_sitewide_floor_is_refused
        claim_type: Parent Relationships
        grounds:
          - entities.CommunityRule.fields.is_sitewide_floor
          - errors[ERR_RULE_CONFLICT]
          - validations[priority=19]
        distinguishing_aspect: "A rule that declares itself a sitewide floor may not be written below the floor band, so a floor rule at band 1 is refused with ERR_RULE_CONFLICT while the same rule without the floor flag is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
          trigger:
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-FLOOR", rule_text: "Sitewide floor restated", rule_band: 1, is_sitewide_floor: true, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-FLOOR", rule_text: "Same rule without the floor flag", rule_band: 1, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                rule_id: $.data.id
          assert:
            - "the first request returns 409 with error_id == ERR_RULE_CONFLICT"
            - "the second request returns 201 and CommunityRule.${rule_id}.is_sitewide_floor == false"
            - "CommunityRule.${rule_id}.rule_band == 1 and CommunityRule.${rule_id}.status == ACTIVE"
            - "GET /api/communities/${alpha_id}/rules returns exactly 1 row"

      - name: community_rule_code_uniqueness_among_active_rules
        claim_type: Type Constraints
        grounds:
          - entities.CommunityRule.fields.rule_code
          - errors[ERR_DUPLICATE_RULE_CODE]
          - validations[priority=19]
        distinguishing_aspect: "rule_code is unique among a community's ACTIVE rules but not globally, so replaying the same code inside one community is refused while the same code in a second community is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding one ACTIVE rule coded R-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-1", rule_text: "Be civil", rule_band: 1, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                rule_alpha: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-1", rule_text: "Duplicate code", rule_band: 2, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the second create returns 409 with error_id == ERR_DUPLICATE_RULE_CODE"
            - "error_id != ERR_STALE_VERSION"
            - "GET /api/communities/${alpha_id}/rules returns exactly 1 row, the rule ${rule_alpha}"
            - "GET /api/communities/${alpha_id}/rules?status=ACTIVE returns exactly 1 row"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: community_reinstatement_from_active_is_invalid_state
        claim_type: "Invalid Transitions"
        grounds:
          - endpoints.POST_/api/communities/{id}/reinstatement-requests
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REINSTATEMENT_CONDITIONS_UNMET]
        distinguishing_aspect: "A community that is already ACTIVE has no reinstatement transition, so the request is refused with ERR_INVALID_STATE rather than being treated as a no-op or as ERR_REINSTATEMENT_CONDITIONS_UNMET."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator and a health index of 100.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/reinstatement-requests"
              payload: {}
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_REINSTATEMENT_CONDITIONS_UNMET"
            - "Community.${alpha_id}.state == ACTIVE and Community.${alpha_id}.quarantine_reinstatement_count == 0"

      - name: protest_coordinate_quorum_check_precedes_access_mode
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProtestEvent.REQUESTED_to_COORDINATED
          - errors[ERR_CROSS_POWER_QUORUM_NOT_MET]
          - errors[ERR_PRIVATE_PROTEST_FORBIDDEN]
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: "Two coordinate preconditions fail in the same request and the quorum check wins: a one-moderator community with one approval is both below its quorum of 2 and carrying a PRIVATE access mode, and ERR_QUORUM_NOT_MET is returned rather than ERR_PRIVATE_PROTEST_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with a single ACTIVE top moderator and a REQUESTED READ_ONLY protest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "PRIVATE", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                protest_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_a_row}", approving_account_id: "mod-a" }
              as: Moderator
              as_user_id: "mod-a"
          trigger:
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 409 and error_id == ERR_QUORUM_NOT_MET"
            - "error_id != ERR_PRIVATE_PROTEST_FORBIDDEN"
            - "error_id != ERR_CROSS_POWER_QUORUM_NOT_MET"
            - "ProtestEvent.${protest_id}.status == REQUESTED"
            - "Community.${alpha_id}.state == ACTIVE"
            - "GET /api/communities/${alpha_id} reports version 2 because only the creation and the protest create advanced it"

      - name: escalation_retires_the_conflicting_rule
        claim_type: "Valid Transition"
        grounds:
          - endpoints.POST_/api/communities/{id}/escalations
          - entities.CommunityRule.fields.status
          - errors[ERR_RULE_CONFLICT]
        distinguishing_aspect: "The escalation endpoint moves the conflicting rule from ACTIVE to RETIRED and drops active_rule_count to zero, while the row stays discoverable through the status filter, so retirement is a status write rather than a delete."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding one ACTIVE rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-1", rule_text: "Local rule", rule_band: 2, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                rule_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/escalations"
              payload: { rule_id: "${rule_id}", escalation_note: "Conflicts with the sitewide floor" }
              as: Moderator
              as_user_id: "mod-a"
          assert:
            - "the response status is 200 and CommunityRule.${rule_id}.status == RETIRED"
            - "GET /api/communities/${alpha_id} reports active_rule_count == 0"
            - "GET /api/communities/${alpha_id}/rules?status=RETIRED returns exactly 1 row"

      - name: archival_cascade_resigns_the_team_and_closes_successions
        claim_type: "Terminal State Lockdown"
        grounds:
          - state_machines.Community.QUARANTINED_to_ARCHIVED
          - state_machines.TeamSuccession.HANDOVER_BLOCKED_to_COMPLETED
          - endpoints.POST_/api/community-administration/archivals
        distinguishing_aspect: "ARCHIVED is terminal and the archival call cascades across three child entity types in one request: the team is resigned with ADMIN_ARCHIVAL, the open succession completes with ALL_MODERATORS_INACTIVE, and the community record keeps the instant it first left ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One community already QUARANTINED with an ACTIVE top moderator, one PENDING_HANDOVER succession and any number of posts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/successions"
              payload: { expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                succ_id: $.data.id
                alpha_v3: $.data.version
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-isolated", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-isolated-two", community_id: "${alpha_id}", decision_outcome: "MUTE_ISSUED" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/institution-negotiations"
              payload: { community_id: "${alpha_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/community-administration/archivals"
              payload: { community_id: "${alpha_id}" }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and Community.${alpha_id}.state == ARCHIVED"
            - "GET /api/communities/${alpha_id}/moderators?status=ACTIVE returns 0 rows and the top moderator reports status RESIGNED with removal_reason_code ADMIN_ARCHIVAL"
            - "TeamSuccession.${succ_id}.state == COMPLETED and completion_reason == ALL_MODERATORS_INACTIVE"
            - "Community.${alpha_id}.restricted_since_utc != null because the archival preserved the instant the community first left ACTIVE"
            - "GET /api/communities?state=ARCHIVED returns exactly 1 row, the community ${alpha_id}"

      - name: succession_discussion_round_after_completion_is_invalid_state
        claim_type: "Idempotency"
        grounds:
          - state_machines.TeamSuccession.HANDOVER_BLOCKED_to_PENDING_HANDOVER
          - state_machines.TeamSuccession.HANDOVER_BLOCKED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A reverted succession accepts a fresh discussion round, but once the row reaches the terminal COMPLETED state no transition applies and the same call is refused with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with two ACTIVE moderators and a succession that has been discussed by mod-a and then blocked by mod-a."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                alpha_v3: $.data.version
            - call: "POST /api/communities/${alpha_id}/successions"
              payload: { expected_community_version: "${alpha_v3}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                succ_id: $.data.id
                deadline_note: $.data.handover_deadline_utc
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Round by mod-a" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/disputes"
              payload: { dispute_note: "mod-a blocks" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Too late" }
              as: Moderator
              as_user_id: "mod-b"
              captures:
                error_id: $.data.error_id
          assert:
            - "TeamSuccession.${succ_id}.state == COMPLETED and completion_reason == PREVENTED_BY_DISPUTE"
            - "the discussion call returns 409 with error_id == ERR_INVALID_STATE"
            - "TeamSuccession.${succ_id}.discussion_round_count == 1, unchanged by the rejected call"

  - section: calculations
    instances:

      - name: brigade_signal_band_cumulative_ladder_at_the_cap
        claim_type: Constants Applied
        grounds:
          - calculations.brigading_signal_severity_band
          - entities.BrigadingCluster.fields.signal_severity_band
          - endpoints.POST_/api/communities/{id}/brigade-clusters
        distinguishing_aspect: "The breadth ladder is cumulative and the two escalators push past it, so breadth 24 alone gives 4, breadth 24 plus 60 participants gives 5, and the band caps at 5 rather than reading 6."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 5, external_link_count: 4, participant_count: 10, legitimate_participant_count: 10 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_low: $.data.id
                low_ratio: $.data.overlap_ratio
                low_band: $.data.signal_severity_band
          trigger:
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 24, external_link_count: 0, participant_count: 10, legitimate_participant_count: 10 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_mid: $.data.id
                mid_band: $.data.signal_severity_band
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 24, external_link_count: 0, participant_count: 60, legitimate_participant_count: 60 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_cap: $.data.id
                cap_band: $.data.signal_severity_band
          assert:
            - "the first cluster reports overlap_ratio == 0.00 and low_band == 2 from its link breadth of 9, one point below the 10 rung"
            - "the second cluster reports overlap_ratio == 0.00 and mid_band == 4"
            - "the third cluster reports overlap_ratio == 0.00 and cap_band == 5"
            - "cap_band != 6"
            - "GET /api/communities/${alpha_id}/brigade-clusters returns exactly 3 rows with status DETECTED"

      - name: brigade_escalation_severity_health_escalator_boundary
        claim_type: Correct Result
        grounds:
          - calculations.brigade_escalation_severity
          - calculations.community_health_index
          - endpoints.POST_/api/community-administration/brigade-escalations
        distinguishing_aspect: "The health escalator on brigade_escalation_severity is inclusive at 60.00 and is read after the escalation's own health recompute, so the same band and overlap produce severity 4 from a community whose recomputed health is 88.00 and severity 3 from one whose recomputed health is 55.00."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Two ACTIVE communities: r/Alpha carrying one DETECTED cluster of band 3 with overlap 0.40, and r/Gamma carrying three such clusters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 4, external_link_count: 6, participant_count: 10, legitimate_participant_count: 6 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_id: $.data.id
                cluster_band: $.data.signal_severity_band
                cluster_ratio: $.data.overlap_ratio
            - call: "POST /api/communities"
              payload: { name: "r/Gamma", description: "Gamma community" }
              as: Account
              as_user_id: "mod-gamma"
              captures:
                gamma_id: $.data.id
            - call: "POST /api/communities/${gamma_id}/brigade-clusters"
              payload: { internal_link_count: 4, external_link_count: 6, participant_count: 10, legitimate_participant_count: 6 }
              as: Moderator
              as_user_id: "mod-gamma"
              captures:
                gamma_cluster_1: $.data.id
            - call: "POST /api/communities/${gamma_id}/brigade-clusters"
              payload: { internal_link_count: 4, external_link_count: 6, participant_count: 10, legitimate_participant_count: 6 }
              as: Moderator
              as_user_id: "mod-gamma"
              captures:
                gamma_cluster_2: $.data.id
            - call: "POST /api/communities/${gamma_id}/brigade-clusters"
              payload: { internal_link_count: 4, external_link_count: 6, participant_count: 10, legitimate_participant_count: 6 }
              as: Moderator
              as_user_id: "mod-gamma"
              captures:
                gamma_cluster_3: $.data.id
          trigger:
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_id}", sanction_ladder: "BAN" }
              as: PlatformAdmin
              captures:
                esc_severity: $.data.escalation_severity
            - call: "GET /api/communities/${alpha_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${gamma_cluster_1}", sanction_ladder: "BAN" }
              as: PlatformAdmin
              captures:
                gamma_esc_1: $.data.escalation_severity
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${gamma_cluster_2}", sanction_ladder: "BAN" }
              as: PlatformAdmin
              captures:
                gamma_esc_2: $.data.escalation_severity
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${gamma_cluster_3}", sanction_ladder: "BAN" }
              as: PlatformAdmin
              captures:
                esc_severity_low: $.data.escalation_severity
          assert:
            - "the alpha cluster reports signal_severity_band == 3 and overlap_ratio == 0.40"
            - "alpha health after the recompute is 100.00 - 3 * (1 + floor(0.40 * 10)) = 85.00, which is at or above the 60.00 escalator, so esc_severity == floor(3 * 1.40) + 1 == 5"
            - "esc_severity != 4"
            - "gamma health after the third recompute is 100.00 - 3 * 15 = 55.00, which is below the 60.00 escalator"
            - "gamma_esc_1 == 5 and gamma_esc_2 == 5 because gamma still sat at 85.00 and 70.00 when those escalations ran"
            - "esc_severity_low == floor(3 * 1.40) == 4, so the third escalation loses exactly the escalator point because its own recompute pushed health to 55.00 first"

      - name: quarantine_health_floor_blocks_reinstatement
        claim_type: Input Set Filtering
        grounds:
          - entities.Community.fields.health_index
          - endpoints.POST_/api/communities/{id}/reinstatement-requests
          - errors[ERR_REINSTATEMENT_CONDITIONS_UNMET]
          - validations[priority=15]
        distinguishing_aspect: "The reinstatement conditions are evaluated on a filtered input set: a QUARANTINED community whose health index is 58.80 is refused because only the health index condition fails, while the same community at 100.00 passes that condition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One RESTRICTED community at health index 70.00 held there by one ESCALATED brigade cluster, with zero inactive moderators and one ACTIVE top moderator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-one", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-two", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 20, external_link_count: 10, participant_count: 10, legitimate_participant_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_id: $.data.id
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_id}", sanction_ladder: "BAN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/communities/${alpha_id}/reinstatement-requests"
              payload: {}
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 409 and error_id == ERR_REINSTATEMENT_CONDITIONS_UNMET"
            - "GET /api/communities/${alpha_id} reports health_index 70.00 exactly on the health gate, inactive_moderator_count 0 and active_top_moderator_count 1"
            - "the refusal is therefore caused by the quarantine-age arm and not by health: Community.${alpha_id}.restricted_since_utc is the setup instant, so zero days have passed against the 90-day requirement"
            - "Community.${alpha_id}.state == RESTRICTED and Community.${alpha_id}.quarantine_reinstatement_count == 0"
            - "error_id != ERR_INVALID_STATE, because RESTRICTED is a valid source state for this endpoint"

      - name: sanction_award_points_tier_ladder
        claim_type: Correct Result
        grounds:
          - calculations.sanction_award_points
          - endpoints.POST_/api/community-administration/account-sanctions
        distinguishing_aspect: "The award read is immediate consistency on the mutated registry: the response reflects the row this very request appended, so successive account-wide sanctions score 150, 250, 250, then 400 as the registry grows from one to four rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community and an account with no sanctions yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-ladder", community_id: "${alpha_id}", decision_outcome: "WARNING_ISSUED" }
              as: PlatformAdmin
              captures:
                award_1: $.data.award_points
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-ladder", community_id: "${alpha_id}", decision_outcome: "MUTE_ISSUED" }
              as: PlatformAdmin
              captures:
                award_2: $.data.award_points
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-ladder", community_id: "${alpha_id}", decision_outcome: "WARNING_ISSUED" }
              as: PlatformAdmin
              captures:
                award_3: $.data.award_points
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-ladder", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
              captures:
                award_4: $.data.award_points
          assert:
            - "award_1 == 150 with a registry of 1 row and no lift, so tier TIER_1 minus a zero refund"
            - "award_2 == 250 with a registry of 2 rows, so tier TIER_2 minus a zero refund"
            - "award_3 == 250 with a registry of 3 rows, so tier TIER_3 minus a zero refund"
            - "award_4 == 400 with a registry of 4 rows, so tier TIER_3 minus a zero refund"
            - "GET /api/accounts/u-ladder/sanctions returns exactly 4 rows"
            - "Account.u-ladder.account_sanction_index == 1.00"

  # ===========================================================================
  - section: validations
    instances:

      - name: every_error_code_in_the_catalogue_is_reachable
        claim_type: "Violation to Error"
        grounds:
          - errors[ERR_PAGINATION_INVALID]
          - validations[priority=1]
          - validations[priority=19]
          - endpoints.GET_/api/communities
        distinguishing_aspect: "Every one of the 32 error ids in §1.6 has a declared validation row or transition precondition that raises it, so no catalogue entry is dead and each maps to a distinct trigger."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/communities"
              payload: { limit: 0 }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the out-of-range limit returns 400 with error_id == ERR_PAGINATION_INVALID"
            - "the §1.6 catalogue declares exactly 32 ids and each is referenced by at least one validation check or state-machine precondition"
            - "the two ids exercised on this route alone are ERR_PAGINATION_INVALID from the envelope bounds and ERR_UNAUTHENTICATED from priority 1"

      - name: pagination_bounds_are_rejected_not_clamped
        claim_type: "Satisfaction to Pass"
        grounds:
          - errors[ERR_PAGINATION_INVALID]
          - response_envelope.pagination_defaults
          - endpoints.GET_/api/communities/{id}/moderators
        distinguishing_aspect: "limit 0 and offset -1 are refused rather than clamped to the declared minimum, while limit 101 is refused against the declared maximum of 100 and limit 100 is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: { limit: 0 }
              as: PlatformAdmin
              captures:
                error_zero: $.data.error_id
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: { limit: 101 }
              as: PlatformAdmin
              captures:
                error_high: $.data.error_id
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: { limit: 100, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the limit-0 request returns 400 with error_zero == ERR_PAGINATION_INVALID"
            - "the limit-101 request returns 400 with error_high == ERR_PAGINATION_INVALID"
            - "the limit-100 request returns 200 with exactly 1 row and has_more == false"
            - "total_count == 1 and offset defaults to 0 when omitted"

      - name: community_name_uniqueness_among_non_closed_communities
        claim_type: Priority Ordering
        grounds:
          - validations[priority=18]
          - errors[ERR_DUPLICATE_COMMUNITY_NAME]
          - endpoints.POST_/api/communities
        distinguishing_aspect: "The uniqueness check is scoped to communities whose state is not CLOSED, so once the first holder is archived the same name is accepted for a new community while an ACTIVE holder still blocks it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community named r/Alpha."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "First holder" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
          trigger:
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Contender" }
              as: Account
              as_user_id: "mod-b"
              captures:
                error_id: $.data.error_id
          assert:
            - "the contender returns 409 with error_id == ERR_DUPLICATE_COMMUNITY_NAME"
            - "GET /api/communities returns exactly 1 row"
            - "Community.${alpha_id}.state == ACTIVE"

      - name: cross_entity_quorum_validation_depends_on_parent_team
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - calculations.protest_quorum_requirement
          - entities.Community.fields.active_moderator_count
        distinguishing_aspect: "The quorum the protest must meet is a function of the parent community's ACTIVE moderator count rather than of any field on the protest, so adding a moderator raises required_quorum_count on an already-created protest."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with two ACTIVE moderators and a REQUESTED protest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
