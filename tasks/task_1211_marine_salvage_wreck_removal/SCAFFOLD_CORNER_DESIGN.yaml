      - name: env_posture_contain_does_not_relax_hold
        claim_type: computed_fields
        grounds: [calculations.pollution_posture_derivation, state_machines.PollutionEvent]
        distinguishing_aspect: "CONTAINED is still an open state: after contain the posture stays ENV_HOLD; only verify-clean relaxes it to ENV_CLEAR. Guards against the misreading that containment alone unblocks operations."
        test_recipe:
          setup: ["casualty with TIER_2 event ESCALATED (posture ENV_HOLD)"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MT Lir", casualty_type: GROUNDING, declared_salved_value_cents: 800000000, position: "51N 2E" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id } }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: OIL_PERSISTENT, tier: TIER_2, est_volume_m3: 15 }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /pollution-events/${ev_id}/contain", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { st1: $.data.status } }
            - { call: "GET /casualties/${cas_id}", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ep1: $.data.env_posture } }
            - { call: "POST /pollution-events/${ev_id}/verify-clean", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "GET /casualties/${cas_id}", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ep2: $.data.env_posture } }
          assert:
            - "after contain: event CONTAINED but env_posture == ENV_HOLD (containment does not relax)"
            - "after verify-clean: env_posture == ENV_CLEAR"
