            - call: "POST /molding-cycles/${cyc2}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T14:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /molds/${mold}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/service-hold"
              payload: { hold_note: "second scheduled tool clean" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/complete-service"
              payload: { service_note: "second service complete" }
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the GET before the loop shows Mold.${mold}: status 'AVAILABLE', cycles_since_service == 1, version == 3  # 1 create + 1 start-oven + 1 demould; scheduling a cycle does not touch the mould"
            - "first service-hold: 200 with status 'MAINTENANCE', cycles_since_service STILL 1 (a hold does not reset the counter), version == 4"
            - "POST /molding-cycles while the only mould is in MAINTENANCE: 409 ERR_NO_ELIGIBLE_MOLD — the maintenance state removes the tool from calculations.mold_selection, and the fresh expected_production_order_version rules out a 412"
            - "first complete-service: 200 with status back to 'AVAILABLE', cycles_since_service == 0 (a full reset from 1, not a decrement to 0 by coincidence — see the second lap), version == 5"
            - "the SAME cycle-create payload that was refused a moment ago is accepted after the service completes, returning mold_id == '${mold}' — the tool is back in the selection pool"
            - "after the second demould, Mold.${mold}: status 'AVAILABLE', cycles_since_service == 1 (the counter restarted from 0 and counted exactly one new part), version == 7  # +1 start-oven +1 demould"
            - "second service-hold: 200 with status 'MAINTENANCE' and version == 8; second complete-service: 200 with status 'AVAILABLE', cycles_since_service == 0 and version == 9 — the loop is traversable an arbitrary number of times"
            - "ProductionOrder.${po}.status == 'IN_PRODUCTION' — both cycles were accepted against ordered_qty 2, landing exactly on the §1.4 priority 79 ceiling floor(2 * 1.20) == 2, so no create was refused with ERR_ORDER_OVERBUILD"
            - "ResinLot.${lot}: available_kg == 452.000, reserved_kg == 0.000, consumed_kg == 48.000, sum 500.000 — two shots consumed irreversibly across the two laps"

      # ----------------------------------------------------------- Shape: parallel
      - name: sm_parallel_axes_unit_build_advances_while_logistics_holds_then_reverses
        claim_type: "Shape: parallel"
        grounds:
          - state_machines.FinishedUnit.build_status
          - state_machines.FinishedUnit.logistics_status
          - state_machines.ShipmentLine.LOADED_to_REMOVED
          - state_machines.Shipment.LOADING_to_PLANNED
          - validations[priority=39]
          - errors.ERR_UNIT_NOT_REINSPECTABLE
          - errors.ERR_SHIPMENT_LINE_ALREADY_REMOVED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "One hull carries two independent state dimensions: the build axis walks DEMOLDED -> TRIMMED -> OUTFITTED -> SELLABLE while the logistics axis sits still at UNALLOCATED, then the logistics axis walks UNALLOCATED -> STORED -> LOADED -> STORED -> UNALLOCATED while the build axis sits still at SELLABLE — and the coupling between them is exactly one guard, so the SAME re-inspection call is refused with ERR_UNIT_NOT_REINSPECTABLE while the hull is STORED and accepted once the logistics axis returns to UNALLOCATED."
        test_recipe:
          setup:
            - "One hull is produced from ProductionOrder POR-SM-PAR (ordered_qty 1) on the PM-SM-PAR fixture and appears at build_status DEMOLDED / logistics_status UNALLOCATED."
