  # ===========================================================================
  - section: calculations
    instances:
      - name: issuer_fee_floor_applies_at_boundary_below_and_above
        claim_type: Constants Applied
        grounds:
          - calculations.issuer_fee_accrual
          - entities.IssuerAgreement.fields.fee_floor_cents
        distinguishing_aspect: "With fee_bps 100, fee_cap 900, floor 50: amount 4999 -> raw 49 < floor -> 50; amount 5000 -> raw 50 == floor -> 50; amount 5100 -> raw 51 -> 51. The floor boundary is inclusive-equality (== floor takes the raw value)."
        test_recipe:
          setup: ["Issuer ACTIVE with agreement fee_bps 100, fee_cap_cents 900, fee_floor_cents 50; standard token."]
          setup_api_calls:
            - *c0
            - *ch
            - call: "POST /issuers"
              payload: { issuer_name: "Boundary Bank", country_code: "US" }
              as: PlatformAdmin
              captures: { b_iss: $.data.id }
            - call: "POST /issuer-agreements"
              payload: { issuer_id: "${b_iss}", branding_color: "#0a0a0a", branding_logo_ref: "logo://b", terms_version: "v1", fee_bps: 100, fee_cap_cents: 900, fee_floor_cents: 50, express_transit_supported: false, effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { b_agr: $.data.id }
            - call: "POST /issuer-agreements/${b_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /issuers/${b_iss}/activate"
              payload: {}
              as: PlatformAdmin
            - *devs
            - *devs_sec
            - call: "POST /card-accounts"
              payload: { cardholder_id: "${ch_id}", issuer_id: "${b_iss}", fpan_last4: "4242", card_product: "CREDIT" }
              as: IssuerOperator
              captures: { b_acct: $.data.id }
            - call: "POST /card-artifacts"
              payload: { card_account_id: "${b_acct}", pan_last4: "4242", expiry: "0930", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { b_art: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${b_art}", idempotency_key: "prov-bnd" }
