              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id" }
          trigger:
            - call: "GET /ltl/shipments"
              payload: {}
              as: NONE
              captures: { e_no_header: "$.data.error_id" }
            - call: "POST /ltl/customers"
              payload: { account_code: "GHOST", name: "Ghost Freight" }
              as: TariffClerk
              captures: { e_unknown_role: "$.data.error_id" }
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PROR020", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 400 }
              as: Shipper
              captures: { e_no_user: "$.data.error_id" }
