            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req_high}", sample_id: "${smp_high}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
          trigger:
