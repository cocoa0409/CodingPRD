            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 80000, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id } }
