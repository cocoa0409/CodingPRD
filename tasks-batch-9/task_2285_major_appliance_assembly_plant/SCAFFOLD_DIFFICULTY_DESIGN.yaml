            - "LINK 1: BomLine.${bom_m_mod_id}.status == SUPERSEDED with superseded_by_bom_line_id set to the new line; GET /bom-lines?created_by_change_id=${ecm_id} returns total_count == 1 with part_id == ${p_mod2_id}, station_id == ${st10_id}, qty_per_unit == 1, effective_from_sequence == 5 and status == ACTIVE"
            - "LINK 2: Part.${p_mod_id}.lifecycle_status == SERVICE_ONLY with service_obligation_until == 2036-08-03T08:00:00Z"
            - "LINK 3: DeliveryCall.${cm_id}.status == CANCELLED with cancel_reason == PART_SERVICE_ONLY (window_start 09:00 is at or after cut_in_at)"
            - "LINK 4: BuildSlot.${slotcut_id}.status == PLANNED with sync_delivery_call_id null and allocated_slot_units == 0; Station.${st20_id}.presentation_slots_used == 0 and Station.${st10_id}.presentation_slots_used == 0"
            - "ShiftPlan.${shift_m_id}.committed_labor_minutes == 0"
            - "The second trigger call returns 409 ERR_SERVICE_OBLIGATION_ACTIVE and Part.${p_mod_id}.lifecycle_status is still SERVICE_ONLY"

      - name: warranty_design_defect_mints_change_and_blocks_sequencing_depth_three
        grounds:
          - state_machines.WarrantyReturn.TEARDOWN_to_ANALYZED_DESIGN
          - calculations.warranty_failure_rate
          - state_machines.Part.ACTIVE_to_CHANGE_PENDING
          - validations[priority=16]
        distinguishing_aspect: |
          Trigger POST /warranty-returns/{id}/analyze drives a three-link chain
          rooted in a rate threshold rather than a clock sweep or an approval:
          failure counters recomputed to 1000.00 per 1000 -> a WARRANTY-origin
          EngineeringChange is minted in SUBMITTED -> the part becomes
          CHANGE_PENDING, which then rejects the next sequencing attempt.
        test_recipe:
          setup:
            - "Base fixture with unit1 certified, assembled and SHIPPED from BuildSlot index 1, so P-DOOR-A has a shipped cohort of exactly 1"
            - "A second BuildSlot at index 2 (WM-X, planned_start 08:00) exists and is PLANNED"
            - "Clock at 2026-08-03T12:00:00Z; WarrantyReturn WR1 on unit1 (field_hours 500) is in TEARDOWN"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
            - *k_slot2
            - *k_clock12
            - *k_wr1
            - *k_wr1_teardown
          trigger:
            - call: "POST /warranty-returns/${wr1_id}/analyze"
              payload: { disposition: "DESIGN_DEFECT", root_cause_part_id: "${p_door_id}" }
              as: WarrantyAnalyst
            - call: "POST /build-slots/${slot2_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "LINK 1: Part.${p_door_id}.field_failure_count == 1 and cohort_failure_rate_per_1000 == 1000.00 (1000 * 1 / 1 shipped cohort unit), above the 8.00 trigger"
            - "LINK 2: GET /engineering-changes?source_warranty_return_id=${wr1_id} returns total_count == 1 with origin == WARRANTY, status == SUBMITTED, model_variant_id == ${wmx_id}, bom_position_code == POS-DOOR, target_line_id == ${line_id}, cut_in_sequence_index == 2 (max_released_sequence_index 1 + 1) and replacement_part_id null"
            - "WarrantyReturn.${wr1_id}.status == ANALYZED_DESIGN and engineering_change_id equals the minted change's id"
            - "LINK 3: Part.${p_door_id}.lifecycle_status == CHANGE_PENDING"
            - "The second trigger call returns 409 ERR_PART_CHANGE_PENDING and BuildSlot.${slot2_id}.status is still PLANNED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: option_load_window_outranks_labor_capacity
        grounds:
          - validations[priority=29]
          - validations[priority=31]
          - calculations.option_load_window_cap
          - calculations.shift_committed_labor_minutes
        distinguishing_aspect: |
          Both rules are category business but sit at priorities 29 and 31 on the
          same endpoint: a candidate breaching both returns
          ERR_OPTION_LOAD_WINDOW_EXCEEDED (422), and only a candidate that
          satisfies the window cap surfaces ERR_LABOR_CAPACITY_EXCEEDED (422).
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1 (option_load_limit_pct 63.00, baseline_headcount 20), stations ST10/ST20, SUP1, P-DOOR-A"
            - "ModelVariant WM-H RELEASED: 8 option points, 700 labour minutes, BOM position on P-DOOR-A at ST10 qty 1"
            - "ModelVariant WM-G RELEASED: 3 option points, 700 labour minutes, BOM position on P-DOOR-A at ST10 qty 1"
            - "ShiftPlan A 06:00-14:00 with planned_headcount 2, so the window cap is floor(5 * 0.63 * 10 * 0.1000) = 3 and available_labor_minutes is 480"
            - "Empty line: no slot is sequenced yet, so both candidates face an otherwise empty window"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - call: "POST /model-variants"
              payload: { model_code: "WM-H", family_code: "FAM_A", option_codes: ["OPT-A", "OPT-B", "OPT-C"], option_content_points: 8, labor_minutes: 700, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmh_id: $.data.id, wmh_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmh_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmh_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmh_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /model-variants"
              payload: { model_code: "WM-G", family_code: "FAM_A", option_codes: ["OPT-A"], option_content_points: 3, labor_minutes: 700, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmg_id: $.data.id, wmg_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmg_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmg_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmg_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v_h: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 2, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v_h}" }
              as: ProductionPlanner
              captures: { shift_h_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmh_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { sloth_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmg_id}", sequence_index: 2, planned_start: "2026-08-03T07:30:00Z" }
              as: ProductionPlanner
              captures: { slotg_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${sloth_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slotg_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "The first trigger call returns 422 ERR_OPTION_LOAD_WINDOW_EXCEEDED even though committed_labor_minutes would have been ceil(700 * 1.12) = 784 > 480"
            - "BuildSlot.${sloth_id}.status == PLANNED and ShiftPlan.${shift_h_id}.committed_labor_minutes == 0"
            - "The second trigger call returns 422 ERR_LABOR_CAPACITY_EXCEEDED because 3 option points are within the cap of 3 but 784 minutes exceed 480"
            - "BuildSlot.${slotg_id}.status == PLANNED and Station.${st10_id}.presentation_slots_used == 0 after both rejections"

      - name: stale_variant_version_outranks_obsolete_variant_state
        grounds:
          - concurrency_rules[bom-line-create-stale-model-variant]
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.ModelVariant.RELEASED_to_OBSOLETE
        distinguishing_aspect: |
          A different error-category pair from the business/business instance:
          category concurrency (priority 7, 412) against category state
          (priority 14, 409) on POST /bom-lines — the stale
          expected_model_variant_version wins, and only a caller sending the
          current version sees ERR_MODEL_NOT_RELEASED.
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1 with stations ST10/ST20, SUP1, P-DOOR-A"
            - "ModelVariant WM-X was created at version 1, then one BOM line was authored against it (version 2), then it was RELEASED (version 3) and OBSOLETE (version 4)"
            - "The client still holds version 1 from the create response"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - call: "POST /model-variants/${wmx_id}/obsolete"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st20_id}", bom_position_code: "POS-TRIM", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v}" }
              as: EngineeringLead
            - call: "GET /model-variants/${wmx_id}"
              payload: {}
              as: EngineeringLead
              captures: { wmx_v_now: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st20_id}", bom_position_code: "POS-TRIM", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v_now}" }
              as: EngineeringLead
          assert:
            - "The first trigger call returns 412 ERR_STALE_MODEL_VARIANT_VERSION, NOT 409 ERR_MODEL_NOT_RELEASED"
            - "The GET shows ModelVariant.${wmx_id}.version == 4 and status == OBSOLETE"
            - "The third trigger call returns 409 ERR_MODEL_NOT_RELEASED — the state rule is only reached once the version check passes"
            - "GET /bom-lines?model_variant_id=${wmx_id} still returns total_count == 1 (only the original POS-DOOR line); neither rejected call created a row"

      - name: supplier_scope_outranks_invalid_call_state
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.DeliveryCall.SCHEDULED_to_CANCELLED
          - roles.SupplierPortal
        distinguishing_aspect: |
          A third distinct pair: category authorization (priority 6, 403) against
          category state (priority 9, 409) on POST
          /delivery-calls/{id}/record-arrival — a foreign supplier is rejected
          for scope even though the call is already CANCELLED, and the owning
          supplier then gets the state error.
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1 with station ST10, suppliers SUP1 and SUP2, part P-DOOR-A supplied by SUP1"
            - "DeliveryCall C1 for SUP1 at ST10 (09:00-10:00) was cancelled by the planner, so its status is CANCELLED with cancel_reason PLANNER"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP2", name: "Rival Modules Ltd", sync_window_minutes: 45 }
              as: PlantAdmin
              captures: { sup2_id: $.data.id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { cs_id: $.data.id }
            - call: "POST /delivery-calls/${cs_id}/cancel"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /delivery-calls/${cs_id}/record-arrival"
              payload: { arrived_at: "2026-08-03T09:15:00Z" }
              as: SupplierPortal
              as_user_id: "${sup2_id}"
            - call: "POST /delivery-calls/${cs_id}/record-arrival"
              payload: { arrived_at: "2026-08-03T09:15:00Z" }
              as: SupplierPortal
              as_user_id: "${sup1_id}"
          assert:
            - "The first trigger call returns 403 ERR_SUPPLIER_SCOPE_VIOLATION, NOT 409 ERR_INVALID_STATE"
            - "The second trigger call returns 409 ERR_INVALID_STATE"
            - "DeliveryCall.${cs_id}.status == CANCELLED with cancel_reason == PLANNER, arrived_at null and lateness_minutes null"
            - "Supplier.${sup1_id}.on_time_score == 100.00 and Supplier.${sup2_id}.on_time_score == 100.00 — neither rejection scored anyone"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: efficiency_index_exactly_at_tier_b_maximum_certifies
        grounds:
          - calculations.efficiency_index
          - validations[priority=13]
          - entities.ProductionUnit.fields.certification_tier
        distinguishing_aspect: |
          At exactly 1.00 the unit certifies as tier B and at 1.01 it is rejected
          with ERR_EFFICIENCY_LIMIT_EXCEEDED: the comparison is <= TIER_B_MAX on
          the 2-dp index, so the 0.998 weighted sum rounds INTO the limit while
          1.006 rounds out of it.
        test_recipe:
          setup:
            - "Base fixture: clock 2026-08-03T06:00:00Z, Line L1, stations ST10/ST20, SUP1, P-DOOR-A, WM-X RELEASED (energy 400.00, water 200.00), ShiftPlan A headcount 20"
            - "unit1 (slot index 1) GATED with ENERGY 420.00 and WATER 184.00 recorded — weighted sum 0.6*1.05 + 0.4*0.92 = 0.998"
            - "unit2 (slot index 2) GATED with ENERGY 420.00 and WATER 188.00 recorded — weighted sum 0.6*1.05 + 0.4*0.94 = 1.006"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 420.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - *k_slot2
            - *k_seq2
            - *k_rel2
            - *k_gates2a
            - *k_gates2b
            - *k_gates2c
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 420.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 188.00 }
              as: QualityInspector
          trigger:
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/certify"
              payload: {}
              as: QualityInspector
          assert:
            - "The first trigger call succeeds: ProductionUnit.${unit1_id}.efficiency_index == 1.00 and certification_tier == B and quality_status == CERTIFIED"
            - "The second trigger call returns 422 ERR_EFFICIENCY_LIMIT_EXCEEDED"
            - "ProductionUnit.${unit2_id}.quality_status == GATED with efficiency_index null and certification_tier null — the failed certification mutated nothing"
            - "ProductionUnit.${unit2_id}.provisional_efficiency_index == 1.01 (the AS_TESTED read of the same two tests)"

      - name: bom_effective_from_sequence_inclusive_at_cut_in_index
        grounds:
          - calculations.effective_bom_at_sequence
          - calculations.presentation_slot_allocation
          - entities.BomLine.fields.effective_from_sequence
          - entities.BuildSlot.fields.presentation_allocations
        distinguishing_aspect: |
          A BomLine with effective_from_sequence 5 does not govern index 4 and
          does govern index 5: the slot at index 4 charges 2 units at ST10 from
          the old line while the slot at index 5 charges 3 units at ST20 from the
          new one, so the inclusive <= boundary is visible in two different
          stations' counters.
        test_recipe:
          setup:
            - "Base fixture through WM-X with POS-DOOR on P-DOOR-A at ST10 qty 2 (effective_from_sequence 1)"
            - "Part P-DOOR-B (line_side_max_units 20) and a second POS-DOOR BomLine on it at ST20 qty 3 with effective_from_sequence 5 — the old line is NOT superseded because 1 < 5"
            - "WM-X RELEASED, ShiftPlan A headcount 20, BuildSlots at indexes 4 and 5 PLANNED"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - call: "POST /parts"
              payload: { part_number: "P-DOOR-B", supplier_id: "${sup1_id}", is_sequenced_module: false, line_side_max_units: 20 }
              as: PlantAdmin
              captures: { p_door_b_id: $.data.id }
            - call: "GET /model-variants/${wmx_id}"
              payload: {}
              as: PlantAdmin
              captures: { wmx_v_b: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_b_id}", station_id: "${st20_id}", bom_position_code: "POS-DOOR", qty_per_unit: 3, effective_from_sequence: 5, expected_model_variant_version: "${wmx_v_b}" }
              as: EngineeringLead
              captures: { bom_x_doorb_id: $.data.id }
            - *k_relx
            - *k_lineread
            - *k_shifta
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 4, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slot4_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 5, planned_start: "2026-08-03T07:30:00Z" }
              as: ProductionPlanner
              captures: { slot5_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${slot4_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slot5_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "BuildSlot.${slot4_id}.allocated_slot_units == 2 and its presentation_allocations charge station ${st10_id} 2 units and nothing at ${st20_id} (ceil(2 * 20 / 24) = 2 from the effective_from_sequence 1 line)"
            - "BuildSlot.${slot5_id}.allocated_slot_units == 3 and its presentation_allocations charge station ${st20_id} 3 units and nothing at ${st10_id} (ceil(3 * 20 / 20) = 3 from the effective_from_sequence 5 line)"
            - "Station.${st10_id}.presentation_slots_used == 2 and Station.${st20_id}.presentation_slots_used == 3"
            - "GET /bom-lines?model_variant_id=${wmx_id} returns total_count == 2 with both rows status == ACTIVE and superseded_by_bom_line_id null"
            - "Line.${line_id}.presentation_slots_committed == 5 and free_slot_pct == 93.75 (100 * (80 - 5) / 80)"

      - name: supplier_score_exactly_at_approved_minimum_stays_approved
        grounds:
          - calculations.supplier_on_time_score
          - state_machines.DeliveryCall.SCHEDULED_to_MISSED
          - validations[priority=27]
          - entities.Supplier.fields.status
        distinguishing_aspect: |
          Two misses land the score on exactly 60.00 == APPROVED_MIN, so the
          supplier stays APPROVED, its future call is not cancelled and a slot
          can still be sequenced against it; the third miss drops the score to
          40.00 and only then does the band change to PROBATION.
        test_recipe:
          setup:
            - "Clock 2026-08-03T06:00:00Z, Line L1, stations ST10/ST20, SUP1, sequenced module P-MOD-1, WM-M RELEASED (POS-MOD at ST10 qty 1), ShiftPlan A headcount 20"
            - "Calls C1 (06:00-06:30) and C2 (06:40-07:10) are overdue; call C3 (09:00-10:00) is in the future"
            - "BuildSlot index 1 (planned_start 09:30) is PLANNED"
            - "Clock advanced to 2026-08-03T07:26:00Z, past C2's window_end plus the 15-minute grace"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
