    side_effects: ["status -> RETURNED"]

  - method: POST
    path: "/dsmes/device-enrollments/{id}/readings"
    description: "Ingest a CGM reading; rejected (and device -> EXPIRED) if past expires_on"
    roles: [Dietitian]
    code: 201
    input: [glucose_mgdl, measured_at]
    output: DeviceReading
    side_effects: ["readings_count, avg_glucose_mgdl, latest_glucose_mgdl recomputed on the device"]

  - method: GET
    path: "/dsmes/device-enrollments/{id}/readings"
    description: "List a device's readings (reverse-reachability for DeviceReading)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceReading[]"
    side_effects: []

  # ---- CarePlan ----
  - method: POST
    path: "/dsmes/care-plans"
    description: "Create a care plan / goal (OPEN)"
    roles: [Dietitian]
    code: 201
    input: [enrollment_id, goal_description, target_a1c]
    output: CarePlan
    side_effects: ["status = OPEN; baseline_a1c copied from patient; projected_a1c_delta computed"]

  - method: GET
    path: "/dsmes/care-plans/{id}"
    description: "Get a care plan"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  - method: GET
    path: "/dsmes/care-plans"
    description: "List care plans (filterable)"
    roles: [ProgramCoordinator, Dietitian, BillingSpecialist]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: "CarePlan[]"
    side_effects: []

  - method: POST
    path: "/dsmes/care-plans/{id}/revise"
    description: "Revise the target (OPEN -> REVISED)"
    roles: [Dietitian]
    code: 200
    input: [target_a1c]
    output: CarePlan
    side_effects: ["status -> REVISED; revision_count += 1; target_a1c updated"]

  - method: POST
    path: "/dsmes/care-plans/{id}/reopen"
    description: "Reopen a revised plan (REVISED -> OPEN)"
    roles: [Dietitian]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status -> OPEN; projected_a1c_delta recomputed"]

  - method: POST
    path: "/dsmes/care-plans/{id}/close"
    description: "Close the plan with an outcome (OPEN -> MET|NOT_MET)"
    roles: [Dietitian]
    code: 200
    input: [outcome, measured_a1c]
    output: CarePlan
    side_effects: ["status -> MET or NOT_MET; measured_a1c set; final_a1c_delta computed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum member, or out-of-range value" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "scheduled_end is not strictly after scheduled_start" }

  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program id does not exist" }
  - { id: ERR_CURRICULUM_NOT_FOUND, http: 404, condition: "Curriculum id does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_DIETITIAN_NOT_FOUND, http: 404, condition: "Dietitian id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "Session id does not exist" }
  - { id: ERR_GROUP_CLASS_NOT_FOUND, http: 404, condition: "GroupClass id does not exist" }
  - { id: ERR_DEVICE_ENROLLMENT_NOT_FOUND, http: 404, condition: "DeviceEnrollment id does not exist" }
  - { id: ERR_CARE_PLAN_NOT_FOUND, http: 404, condition: "CarePlan id does not exist" }

  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

  - { id: ERR_REFERRAL_INVALID_STATE, http: 409, condition: "Referral not in a valid state for assess/reject" }
  - { id: ERR_REFERRAL_NOT_ASSESSED, http: 409, condition: "Enrollment creation attempted against a referral not in ASSESSED" }
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "Enrollment not in a valid state for the requested lifecycle action" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Enrollment must be ACTIVE for scheduling / device activation" }
  - { id: ERR_SESSION_INVALID_STATE, http: 409, condition: "Session encounter_status invalid for the requested encounter transition" }
  - { id: ERR_BILLING_INVALID_STATE, http: 409, condition: "Session billing_status must be SUBMITTED to adjudicate" }
  - { id: ERR_DEVICE_INVALID_STATE, http: 409, condition: "DeviceEnrollment not in a valid state for the requested action" }
  - { id: ERR_CARE_PLAN_INVALID_STATE, http: 409, condition: "CarePlan not in a valid state for the requested transition" }

  - { id: ERR_PROGRAM_NOT_ACCREDITED, http: 403, condition: "Program.accreditation_status is not ACCREDITED at enrollment activation" }
  - { id: ERR_CURRICULUM_TYPE_MISMATCH, http: 409, condition: "Curriculum focus does not match the patient's diabetes_type and is not ANY" }
  - { id: ERR_DIETITIAN_DOUBLE_BOOKED, http: 409, condition: "Dietitian already has a non-terminal individual session overlapping the requested window" }
  - { id: ERR_PATIENT_TIME_CONFLICT, http: 409, condition: "Patient already has a non-terminal session overlapping the group class window" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Group class room is occupied within the buffer of another class" }
  - { id: ERR_GROUP_CLASS_FULL, http: 409, condition: "GroupClass seats_taken has reached capacity" }
  - { id: ERR_BENEFIT_HOURS_EXCEEDED, http: 402, condition: "Scheduling would push provisional_hours_used above benefit_hours_cap" }
  - { id: ERR_DEVICE_EXPIRED, http: 409, condition: "Reading ingest attempted after the device loan window (expires_on) has passed" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Operations role: manages programs, curricula, patients, dietitians, referrals, enrollments, group classes and device enrollments; drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /dsmes/programs"
      - "POST /dsmes/curricula"
      - "POST /dsmes/patients"
      - "POST /dsmes/dietitians"
      - "POST /dsmes/referrals"
      - "POST /dsmes/referrals/{id}/reject"
      - "POST /dsmes/enrollments"
      - "POST /dsmes/enrollments/{id}/activate"
      - "POST /dsmes/enrollments/{id}/reinstate"
      - "POST /dsmes/enrollments/{id}/withdraw"
      - "POST /dsmes/group-classes"
      - "POST /dsmes/device-enrollments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Dietitian
    description: "Clinical educator: performs the accreditation-required assessment, schedules and runs sessions (individual and group), manages device activation/returns and reading ingest, and authors/closes care plans."
    identity: "entity_backed:Dietitian"
    exclusive_operations:
      - "POST /dsmes/referrals/{id}/assess"
      - "POST /dsmes/sessions"
      - "POST /dsmes/sessions/{id}/check-in"
      - "POST /dsmes/sessions/{id}/complete"
      - "POST /dsmes/sessions/{id}/no-show"
      - "POST /dsmes/sessions/{id}/cancel"
      - "POST /dsmes/group-classes/{id}/sessions"
      - "POST /dsmes/device-enrollments/{id}/activate"
      - "POST /dsmes/device-enrollments/{id}/return"
      - "POST /dsmes/device-enrollments/{id}/readings"
      - "POST /dsmes/care-plans"
      - "POST /dsmes/care-plans/{id}/revise"
      - "POST /dsmes/care-plans/{id}/reopen"
      - "POST /dsmes/care-plans/{id}/close"
    shared_operations:
      - "All GET endpoints"

  - name: BillingSpecialist
    description: "Revenue role: adjudicates submitted DSMT claims. Read access to all resources for reconciliation."
    identity: opaque
    exclusive_operations:
      - "POST /dsmes/sessions/{id}/adjudicate"
    shared_operations:
      - "All GET endpoints"
