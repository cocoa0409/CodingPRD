        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request whose X-User-Role names an undeclared role is rejected at priority 1 with HTTP 401 ERR_UNAUTHENTICATED, ahead of any existence or state check."
        test_recipe:
          setup:
            - "One university exists."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
          trigger:
            - call: "GET /universities/${uni_su}"
              payload: {}
              as: Wizard
              as_user_id: "who-1"
              captures: { auth_err: $.data.error_id }
          assert:
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED"

