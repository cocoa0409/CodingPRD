            - { call: "POST /pool-build/pool-projects/${pp_id}/transition", payload: { action: "CLOSE" }, as: Owner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_OPEN_PUNCH_ITEMS"
            - "PoolProject.${pp_id}.construction_status == ORIENTED"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: crew_create_requires_active_subcontractor
        grounds:
          - state_machines.Subcontractor.ACTIVE_to_SUSPENDED
          - entities.Subcontractor.fields.status
          - errors[ERR_SUBCONTRACTOR_INACTIVE]
          - validations[priority=14]
        distinguishing_aspect: |
          CrewAssignment create validity depends on Subcontractor.status (entity pair
          CrewAssignment→Subcontractor): booking a SUSPENDED sub returns ERR_SUBCONTRACTOR_INACTIVE —
          a different pair than the draw→gate dependency.
        test_recipe:
          setup:
            - "Permitted project; EXCAVATION gate; sub S created then SUSPENDED."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "S", trade: "EXCAVATOR" }, as: BuilderPM, captures: { sub_id: $.data.id } }
            - { call: "POST /pool-build/subcontractors/${sub_id}/transition", payload: { action: "SUSPEND" }, as: BuilderPM }
          trigger:
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${sub_id}", phase_gate_id: "${pg_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T16:00:00Z" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_SUBCONTRACTOR_INACTIVE"

      - name: draw_fund_requires_phase_passed
        grounds:
          - state_machines.DrawRequest.APPROVED_to_FUNDED
          - entities.PhaseGate.fields.status
          - errors[ERR_PHASE_NOT_PASSED]
          - validations[priority=13]
        distinguishing_aspect: |
          DrawRequest FUND validity depends on PhaseGate.status==PASSED (entity pair
          DrawRequest→PhaseGate): funding an APPROVED draw whose gate is still IN_PROGRESS returns
          ERR_PHASE_NOT_PASSED — a different pair than crew→subcontractor.
        test_recipe:
          setup:
            - "Permitted project (contract 500000); EXCAVATION gate started (IN_PROGRESS, not passed); draw requested 100000, APPROVED."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/phase-gates/${pg_id}/start", payload: {}, as: BuilderPM }
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { pv1: $.data.version } }
            - { call: "POST /pool-build/draw-requests", payload: { pool_project_id: "${pp_id}", phase_gate_id: "${pg_id}", requested_cents: 100000, expected_pool_project_version: "${pv1}" }, as: BuilderPM, captures: { dr_id: $.data.id } }
            - { call: "POST /pool-build/draw-requests/${dr_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /pool-build/draw-requests/${dr_id}/transition", payload: { action: "FUND" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_PHASE_NOT_PASSED"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: subcontractor_double_booked_half_open
        grounds:
          - validations[priority=9]
          - errors[ERR_SUBCONTRACTOR_DOUBLE_BOOKED]
          - entities.CrewAssignment.fields.start_at
          - entities.CrewAssignment.fields.end_at
        distinguishing_aspect: |
          Resource = Subcontractor. Two bookings of the SAME sub on DIFFERENT sites collide purely on
          the sub's timeline: half-open [08:00,16:00) overlaps [12:00,20:00) → ERR_SUBCONTRACTOR_DOUBLE_BOOKED.
          Site-occupancy cannot fire (different projects), isolating the per-sub half-open semantics.
        test_recipe:
          setup:
            - "Two permitted projects A and B, each with an EXCAVATION gate; one sub S; crew A1 (S→A) booked [06-01 08:00,16:00)."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner A", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { ppA: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${ppA}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dpA: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dpA}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dpA}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dpA}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dpA}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "PA" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${ppA}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pgA: $.data.id } }
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner B", owner_user_id: "owner-2", site_address: "2 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { ppB: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${ppB}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dpB: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dpB}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dpB}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-2" }
            - { call: "POST /pool-build/design-plans/${dpB}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dpB}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "PB" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${ppB}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pgB: $.data.id } }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "S", trade: "EXCAVATOR" }, as: BuilderPM, captures: { sub_id: $.data.id } }
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${ppA}", subcontractor_id: "${sub_id}", phase_gate_id: "${pgA}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T16:00:00Z" }, as: BuilderPM, captures: { a1_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${ppB}", subcontractor_id: "${sub_id}", phase_gate_id: "${pgB}", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T20:00:00Z" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_SUBCONTRACTOR_DOUBLE_BOOKED"

      - name: plaster_cure_buffer_gap
        grounds:
          - validations[priority=11]
          - errors[ERR_CURE_BUFFER]
          - entities.PhaseGate.fields.phase
          - entities.CrewAssignment.fields.start_at
        distinguishing_aspect: |
          Resource = PoolProject site, different interval semantics: a PLASTER crew starting only 4h
          after the GUNITE crew's end (16:00 → 20:00) violates the mandatory 24h cure gap →
          ERR_CURE_BUFFER. Non-overlapping intervals (so site-occupancy passes) and different subs
          (so double-book passes) — the gap/buffer semantics are what reject it.
        test_recipe:
          setup:
            - "Permitted project; GUNITE gate and PLASTER gate created; sub G (GUNITE) and sub P (PLASTER)."
            - "Gunite crew booked [06-10 08:00,16:00)."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "GUNITE", budget_cents: 100000 }, as: BuilderPM, captures: { pgG: $.data.id } }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "PLASTER", budget_cents: 100000 }, as: BuilderPM, captures: { pgL: $.data.id } }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "GuniteCo", trade: "GUNITE" }, as: BuilderPM, captures: { subG: $.data.id } }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "PlasterCo", trade: "PLASTER" }, as: BuilderPM, captures: { subP: $.data.id } }
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${subG}", phase_gate_id: "${pgG}", start_at: "2026-06-10T08:00:00Z", end_at: "2026-06-10T16:00:00Z" }, as: BuilderPM, captures: { ag_id: $.data.id } }
          trigger:
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${subP}", phase_gate_id: "${pgL}", start_at: "2026-06-10T20:00:00Z", end_at: "2026-06-11T04:00:00Z" }, as: BuilderPM, captures: { err: $.data.error_id } }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response data.error_id == ERR_CURE_BUFFER"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: change_order_apply_reverse_conserves_contract_dollars
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - state_machines.ChangeOrder.APPLIED_to_REVERSED
          - calculations.draw_ledger
          - entities.PoolProject.fields.contract_amount_cents
        distinguishing_aspect: |
          Conserved quantity = contract dollars. APPLY(+600000) then REVERSE restores
          contract_amount_cents to 1000000 AND amount_remaining_cents to 1000000; the ledger invariant
          contract_amount == disbursed + retainage_held + remaining holds with zero drift (1000000 == 0+0+1000000).
        test_recipe:
          setup:
            - "Project contract 1000000; ChangeOrder (+600000) APPROVED then APPLIED (contract 1600000, remaining 1600000)."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 1000000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/change-orders", payload: { pool_project_id: "${pp_id}", category: "WATER_FEATURE", description: "waterfall", price_delta_cents: 600000 }, as: BuilderPM, captures: { co_id: $.data.id } }
            - { call: "POST /pool-build/change-orders/${co_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/change-orders/${co_id}/transition", payload: { action: "APPLY" }, as: BuilderPM }
          trigger:
            - { call: "POST /pool-build/change-orders/${co_id}/transition", payload: { action: "REVERSE" }, as: BuilderPM }
            - { call: "GET /pool-build/pool-projects/${pp_id}", as: BuilderPM, captures: { camt: $.data.contract_amount_cents, rem: $.data.amount_remaining_cents } }
          assert:
            - "PoolProject.${pp_id}.contract_amount_cents == 1000000"
            - "PoolProject.${pp_id}.amount_remaining_cents == 1000000"
            - "ChangeOrder.${co_id}.status == REVERSED"

      - name: crew_cancel_conserves_committed_crew_hours
        grounds:
          - state_machines.CrewAssignment.SCHEDULED_to_CANCELLED
          - calculations.committed_crew_hours
          - entities.Subcontractor.fields.committed_crew_hours
          - entities.CrewAssignment.fields.duration_hours
        distinguishing_aspect: |
          Conserved quantity = subcontractor crew-hours (a different quantity than contract dollars).
          Creating an 8h assignment raises committed_crew_hours to 8.0; cancelling subtracts exactly
          8.0, returning committed_crew_hours to 0.0 with no drift.
        test_recipe:
          setup:
            - "Permitted project; EXCAVATION gate; sub S; crew A1 (S) booked [06-01 08:00,16:00) = 8h; committed_crew_hours read as 8.0."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 500000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "RENDER" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "APPROVE" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "SUBMIT_PERMIT", jurisdiction: "City" }, as: Designer }
            - { call: "POST /pool-build/design-plans/${dp_id}/transition", payload: { action: "ISSUE_PERMIT", permit_number: "P-1" }, as: Inspector }
            - { call: "POST /pool-build/phase-gates", payload: { pool_project_id: "${pp_id}", phase: "EXCAVATION", budget_cents: 100000 }, as: BuilderPM, captures: { pg_id: $.data.id } }
            - { call: "POST /pool-build/subcontractors", payload: { company_name: "S", trade: "EXCAVATOR" }, as: BuilderPM, captures: { sub_id: $.data.id } }
            - { call: "POST /pool-build/crew-assignments", payload: { pool_project_id: "${pp_id}", subcontractor_id: "${sub_id}", phase_gate_id: "${pg_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T16:00:00Z" }, as: BuilderPM, captures: { a1_id: $.data.id } }
            - { call: "GET /pool-build/subcontractors/${sub_id}", as: BuilderPM, captures: { pre_hours: $.data.committed_crew_hours } }
          trigger:
            - { call: "POST /pool-build/crew-assignments/${a1_id}/transition", payload: { action: "CANCEL" }, as: Subcontractor, as_user_id: "${sub_id}" }
            - { call: "GET /pool-build/subcontractors/${sub_id}", as: BuilderPM, captures: { post_hours: $.data.committed_crew_hours } }
          assert:
            - "pre_hours == 8.0"
            - "Subcontractor.${sub_id}.committed_crew_hours == 0.0"
