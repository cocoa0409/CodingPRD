            - "Aurora Health policy with retention 250000.00 and a confirmed RANSOMWARE claim reserved at 300000.00."
            - "A 72-hour outage at margin 1.00 with no extra expense and no mitigation savings, so the assessed indemnity is 300000.00 on the trailing basis."
