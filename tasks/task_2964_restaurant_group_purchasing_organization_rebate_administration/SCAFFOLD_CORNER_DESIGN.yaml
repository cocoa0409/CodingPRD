            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Sysco Northeast", dba_code: "SYSCO-02", contracted_markup_bps: 600 }
              as: GpoAdmin
              captures: { dist2_id: $.data.id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { dealA_id: $.data.id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Rival Beef LLC", deal_code: "RVL-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 90 }
              as: GpoAdmin
              captures: { dealB_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${dealA_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { itemA_id: $.data.id }
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
