          trigger:
            - call: "POST /expiry-sweeps"
              payload: {}
              as: PlatformAdmin
              captures: { swept_at: $.data.swept_at, swept_grants: $.data.expired_delegation_grant_ids, swept_quotes: $.data.expired_quote_ids, swept_forms: $.data.voided_order_form_ids, swept_exceptions: $.data.released_exception_ids }
            - call: "GET /delegation-grants"
