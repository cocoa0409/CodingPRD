          trigger:
            - call: "POST /games/${g_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
              captures: { err_not_staffed: $.data.error_id }
            - *k_assign_dan
            - call: "POST /games/${g_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
              captures: { err_not_staffed_proposed: $.data.error_id }
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_grade
            - *k_post_grade
            - *k_finalize
            - call: "POST /pool-reports"
              payload: { game_id: "${g_id}", play_grade_id: "${pg_id}", report_type: "POOL_REPORT", body: "Postgame explanation of the holding no-call." }
              as: CommunicationsOfficer
              captures: { rp_id: $.data.id }
            - call: "POST /pool-reports/${rp_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { rp_status_pub: $.data.status }
            - call: "POST /pool-reports/${rp_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { err_report_state: $.data.error_id }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_v3: $.data.version }
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "ATTENDANCE", severity: "WARNING", expected_official_version: "${dan_v3}" }
              as: OfficiatingDirector
              captures: { da_r_id: $.data.id }
            - call: "POST /discipline-actions/${da_r_id}/resolve"
              payload: { outcome: "CLEARED", note: "resolved on review" }
              as: OfficiatingDirector
              captures: { da_r_status: $.data.status }
            - call: "POST /discipline-actions/${da_r_id}/assign-remediation"
              payload: { remediation_plan: "too late, the action is closed" }
              as: OfficiatingDirector
              captures: { err_discipline_state: $.data.error_id }
          assert:
            - "${err_not_staffed} == ERR_CREW_NOT_STAFFED with HTTP 409 while the game has no assignments at all"
            - "${err_not_staffed_proposed} == ERR_CREW_NOT_STAFFED again after a PROPOSED assignment exists — posture counts CONFIRMED rows only"
            - "${rp_status_pub} == PUBLISHED and the second publish returns HTTP 409 with ${err_report_state} == ERR_REPORT_STATE_INVALID"
            - "${da_r_status} == CLEARED and assign-remediation on it returns HTTP 409 with ${err_discipline_state} == ERR_DISCIPLINE_STATE_INVALID"
            - "CLEARED is terminal for DisciplineAction, so remediation_cycle_count stays 0"

  # ===========================================================================
  - section: rbac
    instances:

      - name: cross_role_writes_are_rejected_with_unauthorized
        claim_type: unauthorized_access
        grounds:
          - roles[CrewScheduler].exclusive_operations
          - roles[GradingSupervisor].exclusive_operations
          - roles[ReplayOfficial].exclusive_operations
          - roles[OfficiatingDirector].exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Each role is blocked from every other role's exclusive write with ERR_UNAUTHORIZED at 403, checked at priority 2 — before existence, state or business rules, so a well-formed payload aimed at the wrong endpoint still fails on the header alone."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, game G1 is PLAYED with Dan COMPLETED on it, and BOOTH-1 exists."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_station
            - *k_clock_grade
            - *k_played
          trigger:
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q1-P05", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: CrewScheduler
              captures: { ua_scheduler_grades: $.data.error_id }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", position: "REFEREE", expected_game_version: "${g_v0}" }
              as: GradingSupervisor
              captures: { ua_supervisor_assigns: $.data.error_id }
            - call: "POST /replay-reviews"
              payload: { game_id: "${g_id}", station_id: "${st_id}", play_ref: "Q1-P05", category: "TURNOVER" }
              as: TrainingCoordinator
              captures: { ua_coordinator_reviews: $.data.error_id }
            - call: "POST /pool-reports"
              payload: { game_id: "${g_id}", play_grade_id: "${g_id}", report_type: "POOL_REPORT", body: "Wrong role attempting a public statement." }
              as: OfficiatingDirector
              captures: { ua_director_publishes: $.data.error_id }
            - call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Sneaky Hire", position: "UMPIRE", seasons_experience: 3, home_market_code: "PHI" }
              as: CommunicationsOfficer
              captures: { ua_comms_hires: $.data.error_id }
          assert:
            - "all five calls return HTTP 403 with ERR_UNAUTHORIZED: ${ua_scheduler_grades}, ${ua_supervisor_assigns}, ${ua_coordinator_reviews}, ${ua_director_publishes}, ${ua_comms_hires}"
            - "the pool-report attempt carries a play_grade_id that does not resolve, yet still returns 403 rather than 404 — role checks precede existence checks"
            - "no side effect occurred: G1 still has exactly one assignment and no play grade, review or report exists"

      - name: missing_or_undeclared_identity_headers_are_rejected
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - roles[Official].role_binding
        distinguishing_aspect: "An empty X-User-ID is ERR_UNAUTHENTICATED at 401 while a syntactically fine but undeclared role name is ERR_UNAUTHORIZED at 403; both are enforced on plain reads, and priority 1 outranks priority 2 when both headers are wrong."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and Dan exists, so the read would otherwise return data."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
          trigger:
            - call: "GET /officials"
              payload: {}
              as: OfficiatingDirector
              as_user_id: ""
              captures: { auth_empty_user: $.data.error_id }
            - call: "GET /officials"
              payload: {}
              as: "LeagueIntern"
              as_user_id: "intern-1"
              captures: { auth_bad_role: $.data.error_id }
            - call: "GET /officials"
              payload: {}
              as: "LeagueIntern"
              as_user_id: ""
              captures: { auth_both_bad: $.data.error_id }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_CLINIC", session_code: "CL-NOAUTH" }
              as: TrainingCoordinator
              as_user_id: ""
              captures: { auth_empty_on_write: $.data.error_id }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: Official
              as_user_id: "${dan_id}"
              captures: { auth_ok_status: $.data.status }
          assert:
            - "${auth_empty_user} == ERR_UNAUTHENTICATED with HTTP 401 — an empty header value is treated as missing, not as an anonymous user"
            - "${auth_bad_role} == ERR_UNAUTHORIZED with HTTP 403 — LeagueIntern is not one of the eight declared roles"
            - "${auth_both_bad} == ERR_UNAUTHENTICATED — priority 1 wins over priority 2"
            - "${auth_empty_on_write} == ERR_UNAUTHENTICATED and no TrainingRecord was created"
            - "${auth_ok_status} == CANDIDATE — with both headers present the same read succeeds for the entity-backed Official role"

      - name: training_records_are_the_training_coordinators_alone
        claim_type: exclusive_operations
        grounds:
          - roles[TrainingCoordinator].exclusive_operations
          - roles[OfficiatingDirector].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "There is no role hierarchy: the OfficiatingDirector, who owns the program lifecycle, still cannot file a training record, and the TrainingCoordinator cannot register an official — yet both may read either resource."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and Dan exists as a CANDIDATE."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
          trigger:
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-DIR", score: 91.00 }
              as: OfficiatingDirector
              captures: { excl_director_files: $.data.error_id }
            - call: "POST /officials"
              payload: { season_program_id: "${sp_id}", full_name: "Coordinator Hire", position: "REFEREE", seasons_experience: 5, home_market_code: "PHI" }
              as: TrainingCoordinator
              captures: { excl_coordinator_hires: $.data.error_id }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-TC", score: 91.00 }
              as: TrainingCoordinator
              captures: { excl_ok_id: $.data.id, excl_ok_passed: $.data.passed }
            - call: "GET /officials/${dan_id}/training-records"
              payload: {}
              as: OfficiatingDirector
              captures: { excl_read_first_id: "$.data[0].id" }
          assert:
            - "${excl_director_files} == ERR_UNAUTHORIZED with HTTP 403 and ${excl_coordinator_hires} == ERR_UNAUTHORIZED with HTTP 403"
            - "the TrainingCoordinator's identical payload succeeds with ${excl_ok_passed} == true"
            - "${excl_read_first_id} == ${excl_ok_id} — reads are shared even where writes are exclusive, and only one record exists (the director's attempt wrote nothing)"

      - name: every_declared_role_may_read_the_officials_list
        claim_type: shared_operations
        grounds:
          - roles[OfficiatingDirector].shared_operations
          - roles[Official].shared_operations
