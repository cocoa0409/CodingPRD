          - entities.Subscriber.fields.credit_limit_cents
          - entities.Subscriber.fields.contact_email
          - entities.Subscriber.fields.callback_phone
        distinguishing_aspect: "Every PATCH input is optional, so a body carrying only contact_email leaves credit_limit_cents and callback_phone at their stored values while still bumping version, and a second PATCH carrying only credit_limit_cents leaves the new email in place."
        test_recipe:
          setup:
            - "One ACTIVE subscriber created with credit_limit_cents 500000 at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Corner Patch Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2032", contact_email: "old@patch.example", callback_phone: "+1-202-555-0132", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id, sub_version: $.data.version }
          trigger:
