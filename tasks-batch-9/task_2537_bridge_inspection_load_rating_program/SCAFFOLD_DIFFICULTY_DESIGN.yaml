  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_state_beats_budget_exceeded
        grounds:
          - validations.priority_10_state
          - validations.priority_33_ERR_BUDGET_EXCEEDED
          - state_machines.ProgramCycle.PLANNING_to_LOCKED
        distinguishing_aspect: |
          The same program call violates a state rule at priority 10 and a fiscal rule at priority 33:
          the cycle is LOCKED (no program transition declared from LOCKED) and the candidate's
          26588000 cost is 26x the cycle's whole 1000000 remaining budget. The fiscal violation is the
          louder, more obvious one, so an implementation that checks affordability before cycle state
          returns ERR_BUDGET_EXCEEDED (422) instead of the required ERR_PROGRAM_STATE_INVALID (409).
        test_recipe:
          setup:
            - "Exactly one ProgramCycle in PLANNING with authorized_budget_cents 1000000 and reserve_pct 0.00, so available_cents and remaining_cents are both 1000000."
            - "Baseline staff plus Dana District; Cedar Creek Bridge with an ACCEPTED ROUTINE inspection, so the accept cascade auto-creates one IDENTIFIED candidate in that cycle with estimated_cost_cents 26588000."
            - "The cycle is then locked, so the candidate is stranded in a LOCKED cycle and is also unaffordable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
