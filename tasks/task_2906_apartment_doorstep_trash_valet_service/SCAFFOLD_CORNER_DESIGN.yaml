        distinguishing_aspect: "The path night exists and the OCC version matches, but the body's contractor_id does not resolve, so the body-foreign-key rule at priority 6 returns HTTP 404 ERR_CONTRACTOR_NOT_FOUND — ahead of the eligibility rule at priority 11 that a real unclassified contractor would trip."
