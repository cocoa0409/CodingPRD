          trigger:
            - call: "POST /ins/policies/${p_gc}/endorsements"
              payload: { endorsement_type: "COVERAGE_ADJUST", effective_at: "2026-09-01T00:00:00Z", expected_policy_version: "${p_gc_v}", new_exposure_units: 12 }
              as: Policyholder
              as_user_id: "${ba_gc}"
            - call: "GET /ins/policies/${p_gc}"
