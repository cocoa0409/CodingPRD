              payload: {}
              as: Inspector
              as_user_id: "${insp2_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T10:30:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${reinsp_id}/complete"
              payload: { result: "NON_COMPLIANT" }
              as: Inspector
              as_user_id: "${insp2_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/abatement-orders/${order_id}/city-abate"
              payload: { actual_labor_hours: 5.5, actual_materials_cents: 18750, crew_notes: "Two-person crew, half day" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /vector-control/abatement-orders/${order_id}"
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { order_v: $.data.version }
          trigger:
