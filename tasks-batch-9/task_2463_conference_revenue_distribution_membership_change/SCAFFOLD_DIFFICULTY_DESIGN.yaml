          A single approve call reaches an aggregate root three hops out: appearance
          APPROVED -> three PostseasonUnit rows minted in VALIDATED -> Conference
          counters advanced to validated_postseason_unit_count 3 and escrow_balance_cents
          4800000, a shorter chain than the other two instances and one that terminates
