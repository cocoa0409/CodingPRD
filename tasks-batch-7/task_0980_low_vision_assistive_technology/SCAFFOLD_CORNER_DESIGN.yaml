# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Enumerative breadth walk over §1.1–§1.7 using the claim-extraction-guide
# taxonomy. §1.8-covered corners appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ==============================================================
  # Section: entities
  # ==============================================================
  - section: entities
    instances:
      - name: ent_client_create_missing_required_returns_validation
        claim_type: required_fields
        grounds: [entities.Client.fields.full_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/clients without full_name is rejected with ERR_VALIDATION (400); nothing is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { date_of_birth: "1958-03-04" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: ent_client_copay_tier_default_applied
        claim_type: defaults
        grounds: [entities.Client.fields.copay_tier]
        distinguishing_aspect: "Omitting copay_tier on create yields STANDARD (the declared default), not null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { full_name: "Ada Lo", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { tier: $.data.copay_tier, st: $.data.status } }
          assert:
            - "${tier} == STANDARD"
            - "${st} == INTAKE"

      - name: ent_client_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Client]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored; the server mints its own id and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { full_name: "Sys Field", date_of_birth: "1960-01-01", id: "00000000-0000-0000-0000-0000000000ff", version: 99 }, as: IntakeCoordinator, captures: { cid: $.data.id, ver: $.data.version } }
          assert:
            - "${cid} != 00000000-0000-0000-0000-0000000000ff"
            - "${ver} == 1"

      - name: ent_client_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", entities.Client]
        distinguishing_aspect: "GET /api/clients/{id} with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/clients/123e4567-e89b-42d3-a456-426614174000", as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: ent_device_model_computed_counts_input_ignored
        claim_type: computed_fields
        grounds: [entities.DeviceModel.fields.in_stock_count, entities.DeviceModel.fields.total_count]
        distinguishing_aspect: "in_stock_count/total_count are computed; a client-supplied in_stock_count of 99 is ignored and the model starts at 0/0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000, in_stock_count: 99 }, as: ClinicAdmin, captures: { stock: $.data.in_stock_count, tot: $.data.total_count } }
          assert:
            - "${stock} == 0 and ${tot} == 0"

      - name: ent_referral_create_with_unknown_client_not_found
        claim_type: parent_relationships
        grounds: [entities.Referral.fields.client_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat topology FK integrity: referral referencing a non-existent client_id is rejected ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/referrals", payload: { client_id: "123e4567-e89b-42d3-a456-426614174000", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: ent_unit_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: [entities.DeviceUnit.fields.serial_no, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "serial_no is unique across all units; a second unit with the same serial is rejected ERR_VALIDATION."
        test_recipe:
          setup: ["model exists; unit SN-DUP already received"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-DUP", condition: "NEW" }, as: ClinicAdmin }
          trigger:
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-DUP", condition: "REFURB" }, as: ClinicAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: ent_referral_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Referral.fields.source_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "source_type outside {PHYSICIAN, VR_AGENCY, INSURANCE, SELF} is rejected ERR_VALIDATION."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Enum Test", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "CARRIER_PIGEON", referring_party: "x" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

  # ==============================================================
  # Section: state_machines
  # ==============================================================
  - section: state_machines
    instances:
      - name: sm_referral_decide_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Referral, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal for Referral; a second decide is rejected ERR_INVALID_STATE and decided_at does not change."
        test_recipe:
          setup: ["client with an ACCEPTED referral"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Twice Dec", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "DECLINE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/clients/${c_id}/referrals", as: IntakeCoordinator, captures: { st: "$.data[0].status" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "${st} == ACCEPTED  # unchanged"

      - name: sm_evaluation_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Evaluation]
        distinguishing_aspect: "A newly created evaluation starts in DRAFT with version 1."
        test_recipe:
          setup: ["client with ACCEPTED referral"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Init State", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
          trigger:
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}" }, as: VisionSpecialist, captures: { st: $.data.status, ver: $.data.version } }
          assert:
            - "${st} == DRAFT and ${ver} == 1"

      - name: sm_claim_terminal_voided_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VOIDED claim rejects every further transition; submit on VOIDED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["APPROVED INSURANCE authorization 50000; allocated PURCHASE order; claim submitted then voided"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Lock Down", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-L1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-L1", authorized_amount_cents: 50000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 1000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_id: $.data.id } }
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
            - { call: "POST /api/claims/${cl_id}/void", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
          trigger:
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  # VOIDED is terminal"

      - name: sm_repair_terminal_resolved_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RepairTicket, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RESOLVED repair ticket rejects further advance calls with ERR_INVALID_STATE."
        test_recipe:
          setup: ["repair ticket fully RESOLVED on an IN_STOCK unit"]
          setup_api_calls:
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-RL", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/repair-tickets", payload: { device_unit_id: "${u_id}", issue_description: "scratched lens" }, as: RepairTechnician, captures: { t_id: $.data.id } }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "START_REPAIR", needs_loaner: false }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "SUBMIT_QA" }, as: RepairTechnician }
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "QA_PASS" }, as: RepairTechnician }
          trigger:
            - { call: "POST /api/repair-tickets/${t_id}/advance", payload: { action: "DIAGNOSE" }, as: RepairTechnician, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  # RESOLVED is terminal"

      - name: sm_client_auto_activation_on_referral_accept
        claim_type: side_effect_execution
        grounds: [state_machines.Client.INTAKE_to_ACTIVE, state_machines.Referral.RECEIVED_to_ACCEPTED]
        distinguishing_aspect: "Cross-entity bubble-up: accepting the referral flips the client INTAKE -> ACTIVE and bumps Client.version."
        test_recipe:
          setup: ["client in INTAKE with a RECEIVED referral"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Auto Act", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: IntakeCoordinator, captures: { st: $.data.status, ver: $.data.version } }
          assert:
            - "${st} == ACTIVE"
            - "${ver} == 2  # one mutation from the cascade"

      - name: sm_evaluation_finalize_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Evaluation.DRAFT_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the same trigger on a FINALIZED evaluation is rejected ERR_INVALID_STATE (no silent no-op)."
        test_recipe:
          setup: ["FINALIZED evaluation exists"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Fin Twice", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
          trigger:
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: sm_order_convert_on_purchase_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DeviceOrder.ACTIVE_to_CONVERTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Conditional action: convert exists only for TRIAL orders; a PURCHASE order in ACTIVE is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["allocated PURCHASE order"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Conv Pur", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-CP", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
          trigger:
            - { call: "POST /api/device-orders/${o_id}/convert", payload: {}, as: VisionSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /api/device-orders/${o_id}/return", payload: {}, as: VisionSpecialist, captures: { err2: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  # convert is TRIAL-only"
            - "${err2} == ERR_INVALID_STATE  # return is TRIAL/LOANER-only"

      - name: sm_trial_expiry_via_run_daily
        claim_type: valid_transition
        grounds: [state_machines.DeviceOrder.ACTIVE_to_EXPIRED, state_machines.DeviceOrder.EXPIRED_to_RETURNED, calculations.daily_sweep]
        distinguishing_aspect: "Scheduled action: once the clock passes trial_ends_at, run_daily flips the TRIAL order to EXPIRED; an EXPIRED order can still be returned, restoring the unit to IN_STOCK."
        test_recipe:
          setup:
            - "TRIAL order (trial_days 14) allocated at the default clock 2026-05-01T00:00:00Z, so trial_ends_at = 2026-05-15T00:00:00Z"
            - "Clock advanced to 2026-05-16T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Trial Exp", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-TE", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: ClinicAdmin }
          trigger:
            - { call: "POST /api/ops/run_daily", payload: {}, as: ClinicAdmin }
            - { call: "GET /api/device-orders/${o_id}", as: VisionSpecialist, captures: { st: $.data.status } }
            - { call: "POST /api/device-orders/${o_id}/return", payload: {}, as: VisionSpecialist, captures: { st2: $.data.status } }
            - { call: "GET /api/device-units/${u_id}", as: VisionSpecialist, captures: { u_st: $.data.status } }
          assert:
            - "${st} == EXPIRED  # 2026-05-16 > trial_ends_at 2026-05-15"
            - "${st2} == RETURNED"
            - "${u_st} == IN_STOCK"

      - name: sm_loan_overdue_via_run_daily
        claim_type: valid_transition
        grounds: [state_machines.LoanAgreement.ACTIVE_to_OVERDUE, calculations.daily_sweep, entities.LoanAgreement.fields.overdue_days]
        distinguishing_aspect: "run_daily marks a loan OVERDUE strictly after due_at and computes whole overdue_days (3 days for due 2026-05-31, clock 2026-06-03)."
        test_recipe:
          setup:
            - "LOANER order allocated at default clock 2026-05-01T00:00:00Z (loan due_at 2026-05-31T00:00:00Z)"
            - "Clock advanced to 2026-06-03T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Loan Due", date_of_birth: "1960-01-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "CCTV" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
