    http: 404
    condition: "facilityId path parameter or facility_id body field does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "applicationId path parameter, permit_application_id or prior_application_id body field does not resolve"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessmentId path parameter does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "planId path parameter or participation_plan_id body field does not resolve"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venueId path parameter or venue_id body field does not resolve"
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "meetingId path parameter does not resolve"
  - id: ERR_CONDITION_NOT_FOUND
    http: 404
    condition: "conditionId path parameter does not resolve"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "decisionId path parameter does not resolve"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaintId path parameter does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspectionId path parameter does not resolve"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "The application is not in a state from which the requested application transition or condition mutation is declared"
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "The assessment is not in a state from which submit-qa, qa-decision or revise is declared"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "The participation plan is not in a state from which patch, open, extend or close is declared"
  - id: ERR_INVALID_MEETING_STATE
    http: 409
    condition: "The meeting is already CANCELLED when cancellation is requested"
  - id: ERR_INVALID_CONDITION_STATE
    http: 409
    condition: "The condition is already VOIDED when deletion is requested"
  - id: ERR_INVALID_DECISION_STATE
    http: 409
    condition: "The decision is not ISSUED when rescission is requested"
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "The complaint is not in a state from which triage, reopen or resolve is declared"
  - id: ERR_INVALID_INSPECTION_STATE
    http: 409
    condition: "The inspection is not SCHEDULED when completion is requested"
  - id: ERR_AREA_NOT_STALE
    http: 409
    condition: "Recertification requested for an area whose data_status is already CURRENT"
  - id: ERR_STALE_AREA_VERSION
    http: 412
    condition: "expected_screening_area_version does not equal the area's current version"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the application's current version"
  - id: ERR_INDICATOR_CATEGORY_MISMATCH
    http: 422
    condition: "category is not the canonical category of indicator_code"
  - id: ERR_PERCENTILE_OUT_OF_RANGE
    http: 422
    condition: "statewide_percentile or county_percentile outside [0.00, 100.00]"
  - id: ERR_INDICATOR_VINTAGE_INVALID
    http: 422
    condition: "vintage_year outside [clock_year - 5, clock_year]"
  - id: ERR_AREA_CODE_DUPLICATE
    http: 409
    condition: "area_code already exists"
  - id: ERR_TRANSLATION_LANGUAGES_REQUIRED
    http: 422
    condition: "required_translation_languages empty while limited_english_pct >= 10.0"
  - id: ERR_REFINED_INPUTS_REQUIRED
    http: 422
    condition: "method REFINED without dispersion_factor or without receptor_distance_m"
  - id: ERR_CONDITION_INPUTS_REQUIRED
    http: 422
    condition: "MONITORING condition without monitoring_frequency, or COMMUNITY_BENEFIT condition without benefit_value_usd"
  - id: ERR_ASSESSMENT_NOT_ACCEPTED
    http: 409
    condition: "ENHANCED-track application advanced or decided without an ACCEPTED governing assessment"
  - id: ERR_PARTICIPATION_NOT_CLOSED
    http: 409
    condition: "ENHANCED-track application advanced while its participation plan is not CLOSED"
  - id: ERR_COMMENT_START_IN_PAST
    http: 422
    condition: "comment_start_date earlier than the current logical clock date"
  - id: ERR_COMMENT_DAYS_CAP_EXCEEDED
    http: 422
    condition: "required + granted + additional comment days would exceed 120"
  - id: ERR_AREA_ENGAGEMENT_CAPACITY
    http: 409
    condition: "Opening or extending the plan would exceed the area's concurrent open-comment-period cap on intersecting closed windows"
  - id: ERR_COMMENT_PERIOD_NOT_ELAPSED
    http: 409
    condition: "Close requested while the clock date is on or before comment_end_date"
  - id: ERR_COMMENT_PERIOD_CLOSED
    http: 409
    condition: "Comment filed while the plan is not OPEN/EXTENDED or the clock date is outside the comment window"
  - id: ERR_MEETING_OUTSIDE_COMMENT_WINDOW
    http: 422
    condition: "Meeting starts_at or ends_at falls outside the plan's closed comment window"
  - id: ERR_VENUE_DECOMMISSIONED
    http: 409
    condition: "Meeting booked at a venue whose status is DECOMMISSIONED"
  - id: ERR_VENUE_NOT_ACCESSIBLE
    http: 422
    condition: "Meeting booked at a venue lacking ada_accessible or transit_accessible"
  - id: ERR_VENUE_SLOT_CONFLICT
    http: 409
    condition: "Buffer-expanded candidate interval intersects a SCHEDULED meeting at the same venue"
  - id: ERR_PARTICIPATION_INADEQUATE
    http: 409
    condition: "Issuance attempted while the ENHANCED-track plan's adequacy_status is DEFICIENT or PENDING"
  - id: ERR_DISPROPORTIONATE_IMPACT_UNMITIGATED
    http: 409
    condition: "Issuance attempted while residual_impact_index >= 60.00"
  - id: ERR_DENIAL_BASIS_UNSUPPORTED
    http: 422
    condition: "denial_basis not supported by the record (residual below threshold, plan not deficient, or assessment confidence not LOW)"
  - id: ERR_BENEFIT_BASE_REQUIRED
    http: 422
    condition: "ISSUE without community_benefit_base_usd in a designated area"
  - id: ERR_BENEFIT_COMMITMENT_INSUFFICIENT
    http: 422
    condition: "community_benefit_total_usd below 1500.00 per approved net ton in a designated area"
  - id: ERR_AREA_LOAD_CAP_EXCEEDED
    http: 409
    condition: "Issuance would push the area's permitted_load_tpy above 1.15 x baseline_load_tpy"
  - id: ERR_COMPLAINT_NOT_INSPECTABLE
    http: 422
    condition: "The area-narrowed complaint has no facility_id or already has a SCHEDULED inspection"
  - id: ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
    http: 409
    condition: "The inspector already has 3 SCHEDULED inspections on scheduled_date"
  - id: ERR_NO_ELIGIBLE_COMPLAINT
    http: 409
    condition: "The inspection selector's candidate set is empty"
  - id: ERR_REFERRAL_UNSUPPORTED
    http: 422
    condition: "REFERRED_ENFORCEMENT resolution without a COMPLETED inspection whose finding is VIOLATION_CONFIRMED"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program office staff who maintain screening reference data, venues and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /ej/screening-areas"
      - "POST /ej/facilities"
      - "POST /ej/venues"
      - "POST /ej/screening-areas/{id}/recertify"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /ej/burden-indicators (with EJAnalyst)"
      - "GET /ej/program-evaluation (with EJAnalyst)"
      - "all GET reads"

  - name: EJAnalyst
    description: "Screening analyst who determines applicability, authors cumulative impact assessments, drafts permit conditions and triages complaints"
    identity: opaque
    exclusive_operations:
      - "POST /ej/permit-applications/{id}/screen"
      - "POST /ej/permit-applications/{id}/advance-to-decision"
      - "POST /ej/permit-applications/{id}/return-for-revision"
      - "POST /ej/cumulative-impact-assessments"
      - "POST /ej/cumulative-impact-assessments/{id}/submit-qa"
      - "POST /ej/cumulative-impact-assessments/{id}/revise"
      - "POST /ej/permit-conditions"
      - "DELETE /ej/permit-conditions/{id}"
      - "POST /ej/community-complaints/{id}/triage"
      - "POST /ej/community-complaints/{id}/resolve"
      - "POST /ej/inspections/assign-next"
    shared_operations:
      - "POST /ej/burden-indicators (with ProgramAdmin)"
      - "GET /ej/program-evaluation (with ProgramAdmin)"
      - "all GET reads"

  - name: QAReviewer
    description: "Independent reviewer who accepts or returns cumulative impact assessments; may never review an assessment they authored"
    identity: opaque
    exclusive_operations:
      - "POST /ej/cumulative-impact-assessments/{id}/qa-decision"
    shared_operations:
      - "all GET reads except GET /ej/program-evaluation"

  - name: PermitManager
    description: "Decision authority who issues, denies and rescinds permits; must be neither author nor QA reviewer of the governing assessment"
    identity: opaque
    exclusive_operations:
      - "POST /ej/permit-decisions"
      - "POST /ej/permit-decisions/{id}/rescind"
    shared_operations:
      - "all GET reads except GET /ej/program-evaluation"

  - name: CommunityLiaison
    description: "Community engagement officer who runs comment periods, translated materials, accessible meetings and complaint intake"
    identity: opaque
    exclusive_operations:
      - "PATCH /ej/participation-plans/{id}"
      - "POST /ej/participation-plans/{id}/open"
      - "POST /ej/participation-plans/{id}/extend"
      - "POST /ej/participation-plans/{id}/close"
      - "POST /ej/public-meetings"
      - "POST /ej/public-meetings/{id}/cancel"
      - "POST /ej/community-complaints/{id}/reopen"
    shared_operations:
      - "POST /ej/public-comments (with PublicCommenter)"
      - "POST /ej/community-complaints (with PublicCommenter)"
      - "all GET reads except GET /ej/program-evaluation"

  - name: Inspector
    description: "Field inspector who completes assigned inspections; may only complete inspections assigned to their own X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /ej/inspections/{id}/complete"
    shared_operations:
      - "GET reads of areas, facilities, complaints, inspections and applications"

  - name: ApplicantRepresentative
    description: "Facility representative who files, submits, resubmits and withdraws that facility's permit applications"
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /ej/permit-applications"
      - "POST /ej/permit-applications/{id}/submit"
      - "POST /ej/permit-applications/{id}/resubmit"
      - "POST /ej/permit-applications/{id}/withdraw"
    shared_operations:
      - "GET reads of areas, facilities, their own applications, plans, meetings, comments, conditions and decisions"

  - name: PublicCommenter
    description: "Member of the public filing comments and complaints; identified by an opaque submitter id"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /ej/public-comments (with CommunityLiaison)"
      - "POST /ej/community-complaints (with CommunityLiaison)"
      - "GET reads of areas, plans, meetings, comments, decisions and complaints"
