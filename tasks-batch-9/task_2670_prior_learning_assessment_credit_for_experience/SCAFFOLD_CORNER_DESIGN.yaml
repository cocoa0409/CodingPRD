            - "LearningOutcome.${oc1_id}.weight_bp == 8000"
            - "LearningOutcome.${oc1_id}.mastery_threshold_bp == 7000"
            - "the response body contains NO version key and NO updated_at key"
            - "§1.5 declares no PATCH, PUT or DELETE route whose path template starts with /learning-outcomes"

      - name: portfolio_parent_claim_not_found_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.Portfolio.fields.claim_id
          - validations[priority 7]
          - errors[ERR_CLAIM_NOT_FOUND]
          - endpoints[POST /portfolios]
        distinguishing_aspect: |
          POST /portfolios whose body claim_id points at a non-existent claim
          returns HTTP 404 ERR_CLAIM_NOT_FOUND from the priority 7 body-reference
          check — not ERR_PORTFOLIO_NOT_FOUND and not a 201 orphan row.
        test_recipe:
          setup:
