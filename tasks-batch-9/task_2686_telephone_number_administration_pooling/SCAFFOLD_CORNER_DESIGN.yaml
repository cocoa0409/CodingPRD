          trigger:
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: { amendment_note: "Reserved numbers reclassified; totals corrected" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
          assert:
            - "HTTP 200, UtilizationFiling.status == \"SUBMITTED\", amendment_count == 1, submitted_at == \"2026-09-01T00:00:00Z\", audited_utilization_pct is null"
            - "UtilizationFiling.claimed_utilization_pct == 95.00 (recomputed from the unchanged counts)"
            - "GET /numbering/audit-findings/${finding_id} reads status == \"ACCEPTED\", penalty_action == \"RECLAMATION_REFERRAL\", adjusted_utilization_pct == 60.00"
            - "GET /numbering/carriers/${a_id} reads reclamation_strike_count == 1, eligibility_status == \"ELIGIBLE\", probation_until is null"

