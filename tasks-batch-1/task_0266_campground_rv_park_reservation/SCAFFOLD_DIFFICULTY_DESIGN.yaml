              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /sites/${site_id}/maintenance-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-12", reason: "deck repair", expected_site_version: "${site_v0}" }
              as: Operator
              captures: { hold_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-08", check_out_date: "2026-08-10", expected_site_version: "${site_v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_MAINTENANCE_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_site_booked_nights
        grounds:
          - state_machines.Reservation.reservation_status.REQUESTED_to_CANCELLED
          - calculations.site_booked_nights
          - entities.Site.fields.booked_night_count
        distinguishing_aspect: |
          Conserved quantity = Site.booked_night_count (nights). Forward: create
          reservation adds nights (0 -> 10). Compensating: cancel releases them
          (10 -> 0). Invariant pinned: after cancel, Site.booked_night_count equals
          its pre-create value (0).
        test_recipe:
          setup:
            - "RV Site S with booked_night_count=0; one REQUESTED reservation R adding 10 nights."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { bnc: $.data.booked_night_count }
          assert:
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Site.${site_id}.booked_night_count == 0"

      - name: cancel_refund_conserves_net_money_ledger
        grounds:
          - state_machines.Reservation.reservation_status.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund
          - entities.Reservation.fields.amount_paid_cents
          - entities.Payment.fields.type
        distinguishing_aspect: |
          Conserved quantity = net money on the reservation ledger (cents) — a
          DIFFERENT quantity than booked nights. Forward: DEPOSIT of 14580 makes
          amount_paid_cents=14580. Compensating (full-refund window): a REFUND of
          14580. Invariant pinned: amount_paid_cents == sum(DEPOSIT,BALANCE) -
          sum(REFUND) == 0 after a 100% refund.
        test_recipe:
          setup:
            - "Reservation R CONFIRMED with deposit 14580 paid; clock set so cancel is >=14 days before check-in (100% refund)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { paid: $.data.amount_paid_cents }
          assert:
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Reservation.${res_id}.payment_status == REFUNDED"
            - "Reservation.${res_id}.amount_paid_cents == 0"
            - "A REFUND Payment of 14580 exists (100% of the 14580 deposit)"
