            - "CancellationSession.${sess_id}.reason_detail == null"
            - "CancellationSession.${sess_id}.step_count == 3"

      - name: second_decline_of_the_same_grant_returns_offer_already_resolved
        claim_type: idempotency
        grounds:
          - validations[priority=15]
          - errors[ERR_OFFER_ALREADY_RESOLVED]
          - state_machines.SaveOfferGrant.transitions.PRESENTED_to_DECLINED
        distinguishing_aspect: |
          Decline is not idempotent by design: the second call on a DECLINED grant is 409
          ERR_OFFER_ALREADY_RESOLVED rather than a repeated 200, and the session stays in
          OFFERS_PRESENTED so the subscriber can still complete inside the step budget.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; template T_PRICE (DISCOUNT 0.1000 for 1 cycle, reason PRICE, rank 10)."
            - "A session captured reason PRICE and a specialist presented the offer, producing a PRESENTED grant that was then declined once."
