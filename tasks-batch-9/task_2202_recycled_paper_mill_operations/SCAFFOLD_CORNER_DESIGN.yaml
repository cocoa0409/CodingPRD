  # ===========================================================================
  # ENDPOINTS — CRUD round trips, action endpoints, cross-reference links,
  # computed reads and the declared side effects of each mutating call.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: machine_create_read_and_status_patch_round_trip_with_version_bump
        claim_type: standard_crud
        grounds:
          - endpoints.POST_paper_machines
          - endpoints.GET_paper_machines_id
          - endpoints.PATCH_paper_machines_id_status
          - entities.PaperMachine.fields.status
          - validations.priority_38
        distinguishing_aspect: "The POST echoes every input field and mints status RUNNABLE with current_product_code null; the GET returns exactly those stored values; the PATCH to DOWN succeeds only with the version just read and leaves version incremented by one. This is the create/read/update triangle for the one entity in the domain that carries an OCC-guarded update endpoint."
        test_recipe:
          setup: ["An empty mill with the logical clock pinned to 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 5600, max_tons_per_hour: 20.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 2.500 }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_id: "$.data.id" }
