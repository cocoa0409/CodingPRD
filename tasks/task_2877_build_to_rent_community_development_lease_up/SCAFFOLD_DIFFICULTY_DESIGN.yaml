              as: AssetManager
              as_user_id: "u_am_1"
              captures: { trail_value: $.data.value_cents, trail_ltv: $.data.loan_to_value_bps }
            - call: "GET /communities/${c2}/valuation"
              payload: { basis: "FORWARD_STABILIZED" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { fwd_value: $.data.value_cents, fwd_ltv: $.data.loan_to_value_bps }
          assert:
            - "TRAILING_ACTUAL response: in_place_monthly_cents == 298050, pro_forma_monthly_cents == 0, annual_gross_cents == 3576600, vacancy_deduction_cents == 0, egi_cents == 3576600, opex_cents == 1216044, noi_cents == 2360556, value_cents == 44962971, loan_to_value_bps == 17792, covenant_satisfied == false"
            - "FORWARD_STABILIZED response: in_place_monthly_cents == 298050, pro_forma_monthly_cents == 855000, annual_gross_cents == 13836600, vacancy_deduction_cents == 691830, egi_cents == 13144770, opex_cents == 4469222, noi_cents == 8675548, value_cents == 165248533, loan_to_value_bps == 4841, covenant_satisfied == true"
            - "${fwd_value} > ${trail_value} and ${fwd_ltv} < ${trail_ltv}"
            - "Community.${c2}.lifecycle_status == LEASE_UP and Community.${c2}.occupancy_ratio == 0.2500 — neither read mutated the community"

  - rule_id: combinatorial_formula
    instances:
      - name: services_fee_tier_keyed_on_base_rent_not_on_the_gross_it_produces
        grounds:
          - calculations.community_services_fee
          - entities.Lease.fields.community_services_fee_cents
          - entities.Lease.fields.gross_monthly_charge_cents
          - entities.MarketRentSchedule.fields.asking_rent_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the fee is a component of gross_monthly_charge_cents,
          yet the fee TIER must be selected from base_rent_cents alone. With base_rent_cents 199999 on
          a COTTAGE the pinned order gives rate_bps 350 -> fee 10000 -> gross 209999; keying the tier
          on the gross it produces (209999 >= 200000 -> 300 bps) would give fee 9000 and gross 208999,
          and iterating to a fixed point never terminates on a single answer.
        test_recipe:
          setup:
            - "Community 'Cedar Walk' with total_planned_units 1, product_mix {DETACHED: 0, COTTAGE: 1, TOWNHOME: 0}, plat APPROVED, posture OPEN."
            - "One PUBLISHED COTTAGE schedule at asking_rent_cents 199999 effective 2026-08-01T00:00:00Z."
            - "One released AVAILABLE COTTAGE homesite; one household with monthly_income_cents 800000 (>= 3 * 209999 = 629997)."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Cedar Walk", market_code: "TX-AUS", total_planned_units: 1, product_mix: { DETACHED: 0, COTTAGE: 1, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 1 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c3: $.data.id }
            - call: "POST /communities/${c3}/plat-submissions"
              payload: { plat_package_reference: "PLAT-CW-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c3}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c3}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { c3_v1: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c3}", product_type: "COTTAGE", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 199999, expected_community_version: "${c3_v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /phases"
              payload: { community_id: "${c3}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 1, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph3: $.data.id }
            - call: "POST /phases/${ph3}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph3}", lot_number: "C1", product_type: "COTTAGE", bedrooms: 2, square_feet: 1100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs6: $.data.id }
            - call: "POST /homesites/${hs6}/occupancy-certificates"
              payload: { occupancy_certificate_number: "CO-CW-C1", issued_at: "2026-08-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /phases/${ph3}/section-releases"
              payload: { homesite_ids: ["${hs6}"] }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /households"
              payload: { primary_applicant_name: "Dana Kim", email: "dana@example.com", household_size: 2, monthly_income_cents: 800000, credit_tier: "B" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { hh4: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { homesite_id: "${hs6}", household_id: "${hh4}", term_months: 12, start_date: "2026-08-01T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { l4: $.data.id }
          assert:
            - "Lease.${l4}.base_rent_cents == 199999"
            - "Lease.${l4}.community_services_fee_cents == 10000"
            - "Lease.${l4}.gross_monthly_charge_cents == 209999"
            - "Lease.${l4}.community_services_fee_cents != 9000 — the 300 bps tier was NOT applied even though the gross exceeds 200000"

      - name: concession_rounding_order_places_residual_in_the_final_period
        grounds:
          - calculations.concession_amortization
          - entities.Lease.fields.concession_schedule
          - entities.Lease.fields.term_months
          - entities.ConcessionProgram.fields.free_weeks
        distinguishing_aspect: |
          Mode (b) pinned rounding order at term_months 18 / free_weeks 11: the concession is rounded
          once at the total (756588), then the per-period credit is rounded (42033), and period 18
          absorbs the residual 42027 — a residual SMALLER than the regular period, the opposite
          direction from the 12-month case. Rounding each period independently and summing gives
          42033 * 18 = 756594, over-crediting the resident by 6 cents.
        test_recipe:
          setup:
            - "Community 'Dunmore Field' with total_planned_units 1, product_mix {DETACHED: 1, COTTAGE: 0, TOWNHOME: 0}, concession_budget_cents 5000000, plat APPROVED, posture OPEN."
