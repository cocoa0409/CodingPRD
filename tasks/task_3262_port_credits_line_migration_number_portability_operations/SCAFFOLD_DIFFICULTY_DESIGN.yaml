              payload: { subscriber_line_id: "${line_neg}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 1, retention_requirement_cycles: 1, window_start: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${neg_v1}" }
              as: CustomerService
              captures: { pcs_neg: $.data.id }
            - call: "POST /portability/promo-credit-schedules/${pcs_neg}/activate"
              payload: {}
              as: CustomerService
            - call: "GET /portability/subscriber-lines/${line_neg}"
              as: PlatformAdmin
              captures: { neg_v2: $.data.version }
            - call: "GET /portability/subscriber-lines/${line_pos}"
              as: PlatformAdmin
              captures: { pos_v1: $.data.version }
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line_pos}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 1, retention_requirement_cycles: 1, window_start: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${pos_v1}" }
              as: CustomerService
              captures: { pcs_pos: $.data.id }
            - call: "POST /portability/promo-credit-schedules/${pcs_pos}/activate"
              payload: {}
              as: CustomerService
            - call: "GET /portability/subscriber-lines/${line_pos}"
              as: PlatformAdmin
              captures: { pos_v2: $.data.version }
          trigger:
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line_neg}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 12, retention_requirement_cycles: 12, window_start: "2026-10-31T00:00:00Z", expected_subscriber_line_version: "${neg_v2}" }
              as: CustomerService
              captures: { err: $.data.error_id }
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line_pos}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 12, retention_requirement_cycles: 12, window_start: "2026-11-01T00:00:00Z", expected_subscriber_line_version: "${pos_v2}" }
              as: CustomerService
              captures: { pcs_ok: $.data.id }
          assert:
            - "response.data.error_id == ERR_PROMO_WINDOW_OVERLAP"
            - "PromoCreditSchedule.${pcs_ok}.schedule_state == PROVISIONAL"
            - "PromoCreditSchedule.${pcs_ok}.provisional_total_cents == 32000"
      - name: line_limit_exact_ceiling_boundary
        grounds:
          - validations[priority=20]
          - state_machines.LineAdditionRequest.SUBMITTED_to_APPROVED
          - entities.Account.fields.active_line_count
        distinguishing_aspect: |
          The line ceiling is inclusive at exactly 10: an addition of 10 lines onto an account holding
          0 active lines reaches 10 and is approved, while the same addition of 10 onto an account
          holding 1 active line reaches 11 and is rejected with ERR_LINE_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Account A holds 0 active lines; Account B holds exactly 1 active line; both on score 900 with existing_deposit_cents 50000"
            - "One line addition request for 10 lines on each account"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1313", payment_history_score: 900, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1414", payment_history_score: 900, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct_b}", mdn: "4155551201", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line_b: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct_a}", line_count: 10 }
              as: CustomerService
              captures: { lar_a: $.data.id }
            - call: "POST /portability/line-addition-requests"
              payload: { account_id: "${acct_b}", line_count: 10 }
              as: CustomerService
              captures: { lar_b: $.data.id }
          trigger:
            - call: "POST /portability/line-addition-requests/${lar_a}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
            - call: "POST /portability/line-addition-requests/${lar_b}/review"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "LineAdditionRequest.${lar_a}.request_state == APPROVED"
            - "LineAdditionRequest.${lar_a}.determined_credit_class == CLASS_C"
            - "response.data.error_id == ERR_LINE_LIMIT_EXCEEDED"
            - "LineAdditionRequest.${lar_b}.request_state == SUBMITTED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: migration_eligibility_depends_on_protection_case_state
        grounds:
          - state_machines.MigrationRequest.ELIGIBILITY_CHECK_to_BLOCKED
          - state_machines.PortProtectionCase.REQUESTED_to_ACTIVE
          - validations[priority=24]
        distinguishing_aspect: |
          The MigrationRequest can only leave ELIGIBILITY_CHECK once the sibling PortProtectionCase row
          on the same subscriber line is not ACTIVE, so with the case ACTIVE the evaluation must land on
          BLOCKED and release the number rather than scheduling a cutover.
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line with an ACTIVE PORT_FREEZE protection case"
            - "A migration request on that line in migration_state DRAFT"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1515", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551501", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/migration-requests"
              payload: { subscriber_line_id: "${line}", source_billing_mode: "PREPAID", target_billing_mode: "POSTPAID", prepaid_balance_cents: 0, requested_cutover_at: "2026-10-01T00:00:00Z" }
              as: CustomerService
              captures: { mr: $.data.id }
            - call: "POST /portability/port-protection-cases"
              payload: { subscriber_line_id: "${line}", protection_type: "PORT_FREEZE", verified_identity: true, reason_code: "CUSTOMER_REQUEST" }
              as: CustomerService
              captures: { ppc: $.data.id }
            - call: "POST /portability/port-protection-cases/${ppc}/resolve"
              payload: { resolution: "ACTIVATE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/migration-requests/${mr}/check-eligibility"
              payload: {}
              as: CustomerService
          assert:
            - "MigrationRequest.${mr}.migration_state == BLOCKED"
            - "SubscriberLine.${line}.number_status == UNASSIGNED"
            - "SubscriberLine.${line}.port_protection_status == PROTECTED"
      - name: migration_eligibility_depends_on_open_port_request_state
        grounds:
          - state_machines.MigrationRequest.ELIGIBILITY_CHECK_to_BLOCKED
          - state_machines.PortRequest.REJECTED_to_RESUBMITTED
          - entities.SubscriberLine.fields.port_protection_status
        distinguishing_aspect: |
          A second cross-entity pair: with no protection case on the line at all, the MigrationRequest
          still depends on the state of a PortRequest row and must be held at BLOCKED while that request
          sits in RESUBMITTED, releasing the number instead of reserving it.
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line, unprotected"
            - "A port request on that line in request_state RESUBMITTED"
            - "A migration request on the same line in migration_state DRAFT"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1616", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551601", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
