          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 200000, occurred_at: "2026-07-28T10:00:00Z" }, as: Teller }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 200000, occurred_at: "2026-07-29T10:00:00Z" }, as: Teller }
