# =============================================================================
# task_0686_golf_entertainment_range — SCAFFOLD.yaml (§1.0–§1.7)
# Golf Entertainment & Driving Range (Topgolf style)
# Difficulty: Expert
# =============================================================================

scenario: |
  Golf Entertainment & Driving Range (Topgolf style): bay reservation & dynamic/peak pricing, party/event package & food-beverage, membership & game-card, walk-in queue & bay turn, target tech & scoring, lessons/clinic & simulator, gift card, group/corporate

domain_name: golf-entertainment-range
api_prefix: /golf

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat
  # Peer entities linked by foreign keys; no nested-tree URL paths. Every FK is
  # discovered through a filtered-list GET (`<fk>?` query param).

  state_machine_shape: branching
  # Reservation branches HOLD→{CONFIRMED, EXPIRED, CANCELLED}; EventPackage cycles
  # QUOTED↔NEGOTIATING (revision loop); GameSession carries parallel dimensions
  # (play_status × billing_status) that evolve independently on the same row.

  relationship_patterns:
    - one_to_many        # Venue→Bay, Member→Reservation, Member→GameCard
    - cross_aggregate    # Reservation→Bay, FBTab→Reservation/EventPackage, Charge→Member

  role_model: peer_roles
  # Guest (entity_backed:Member) owns their own reservations/cards; FrontDesk and
  # RangeManager are opaque operators with non-overlapping operational surfaces.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

