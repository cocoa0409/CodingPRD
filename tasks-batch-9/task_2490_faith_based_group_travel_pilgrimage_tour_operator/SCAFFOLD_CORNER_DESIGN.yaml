      - name: unknown_protection_path_id_returns_protection_not_found
        claim_type: triggerable
        grounds:
          - errors.ERR_PROTECTION_NOT_FOUND
          - validations[priority=20]
        distinguishing_aspect: "The protection read returns 404 ERR_PROTECTION_NOT_FOUND for an unknown id, distinct from the traveler's not-found code."
        test_recipe:
