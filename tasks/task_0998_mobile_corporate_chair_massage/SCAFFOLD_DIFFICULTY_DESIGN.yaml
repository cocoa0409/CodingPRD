  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ==================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_requires_therapist_license_active
        grounds:
          - state_machines.Booking.SCHEDULING_to_CONFIRMED
          - entities.TherapistLicense.fields.status
        distinguishing_aspect: |
          Entity pair = (Booking, TherapistLicense). Booking.confirm is
          blocked when an assigned therapist's license in the booking's
          region is SUSPENDED (not ACTIVE) — even though every ChairSlot is
          ASSIGNED. Distinct pair from (SlotClaim, Waiver).
        test_recipe:
          setup:
            - "Region R0; ACME; Therapist T1 with license L1 ACTIVE in R0"
            - "Booking EVENT 2026-06-10 in SCHEDULING, chair cs0 ASSIGNED to T1"
            - "License L1 is then SUSPENDED by PlatformAdmin"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
