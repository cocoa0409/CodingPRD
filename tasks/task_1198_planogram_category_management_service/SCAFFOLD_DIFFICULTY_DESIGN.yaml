# =============================================================================
# §1.8 — Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances each = 18 instances, cross-referenced to §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dos_provisional_vs_finalized_on_planogram_approval
        grounds:
          - calculations.days_of_supply
          - state_machines.Planogram.IN_REVIEW_to_APPROVED
          - entities.PlanogramLine.fields.days_of_supply
        distinguishing_aspect: |
          Days-of-supply operates on the PlanogramLine entity domain; the same
          capacity_units and weekly_demand_units produce a different numeric
          dos after Planogram approval (finalized variant snaps to 0.5-day grid,
          rounded down) than they did in DRAFT (provisional variant returns raw
          float). The finalized value is always <= the provisional value.
        test_recipe:
          setup:
            - "Retailer R with threshold default; Category C role=ROUTINE, total_linear_feet=10"
            - "Supplier S; Product P with weekly_demand_units=14, width_in=12"
            - "Planogram PG in DRAFT with one PlanogramLine L: facings=4, capacity_units=29"
            - "raw dos = 29 / (14/7) = 14.5  → after 0.5-grid snap-down remains 14.5 (no change at this input)"
            - "use capacity_units=30 instead → raw dos = 30/2 = 15.0, snapped stays 15.0"
            - "use capacity_units=29 with weekly_demand_units=20 → raw dos = 29/(20/7) = 10.15, snapped to 10.0"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "CAT1", role: "ROUTINE", annual_sales_cents: 1000000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "SKU1", width_in: 12, unit_cost_cents: 100, weekly_demand_units: 20 }
              as: CategoryManager
              captures: { pid: $.data.id }
            - call: "POST /retailers/${rid}/products/${pid}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG1", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${pid}", position_index: 1, facings: 4, capacity_units: 29 }
              as: CategoryManager
              captures: { lid: $.data.id, provisional_dos: $.data.days_of_supply }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
          assert:
            - "provisional dos captured == 10.15"
            - "PlanogramLine.${lid}.days_of_supply == 10.0 after approval (finalized snap-down to 0.5 grid)"
            - "finalized dos (10.0) != provisional dos (10.15) — variant divergence is observable"

      - name: space_to_sales_absolute_vs_indexed_mode
        grounds:
          - calculations.space_to_sales_share_gap
          - 'endpoints.GET /retailers/{rid}/categories/{cid}/space-to-sales'
        distinguishing_aspect: |
          Space-to-sales operates on the Category entity domain (not PlanogramLine);
          the same ACTIVE planogram's lines produce two different output shapes
          depending on mode: absolute_gap returns signed percentage-point
          differences (gap_pct), indexed_ratio returns the ratio space/sales
          (gap_ratio). Zero-demand products yield gap_ratio = 999.0 sentinel
          while gap_pct is a normal number.
        test_recipe:
          setup:
            - "Category C, two LISTED products P1 (weekly_demand_units=70, width_in=12) and P2 (weekly_demand_units=30, width_in=12)"
            - "ACTIVE planogram PG with L1(P1, facings=3) and L2(P2, facings=1)"
            - "P1 space_share = 36/(36+12)*100 = 75.0; sales_share = 70/100*100 = 70.0; gap_pct = 5.0; gap_ratio = 75/70 ≈ 1.07"
            - "P2 space_share = 12/48*100 = 25.0; sales_share = 30/100*100 = 30.0; gap_pct = -5.0; gap_ratio = 25/30 ≈ 0.83"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "CAT1", role: "ROUTINE", annual_sales_cents: 1000000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 12, unit_cost_cents: 100, weekly_demand_units: 70 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P2", width_in: 12, unit_cost_cents: 100, weekly_demand_units: 30 }
              as: CategoryManager
              captures: { p2: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${p2}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 3, capacity_units: 60 }
              as: CategoryManager
              captures: { l1: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p2}", position_index: 2, facings: 1, capacity_units: 20 }
              as: CategoryManager
              captures: { l2: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cat_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/activate"
              payload: { expected_category_version: "${cat_v}" }
              as: CategoryManager
          trigger:
            - call: "GET /retailers/${rid}/categories/${cid}/space-to-sales"
              payload: {}
              as: CategoryManager
              captures: { lines_default: $.data }
            - call: "GET /retailers/${rid}/categories/${cid}/space-to-sales"
              payload: { mode: "indexed" }
              as: CategoryManager
              captures: { lines_indexed: $.data }
          assert:
            - "default mode: line for P1 has gap_pct == 5.0"
            - "default mode: line for P2 has gap_pct == -5.0"
            - "indexed mode: line for P1 has gap_ratio == 1.07"
            - "indexed mode: line for P2 has gap_ratio == 0.83"
            - "same planogram, two variant outputs differ in shape and magnitude"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a), (b), or (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: labor_hours_estimate_non_linear_inputs
        grounds:
          - calculations.labor_hours_estimate
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction:
          labor_hours_estimated = round_half_up(planogram.total_facings * 0.05
          + product_changes * 0.25, 1). The product_changes count depends on
          the set-difference between target planogram's product_ids and the
          store's currently-installed planogram's product_ids, so adding the
          same line can contribute 0.05 OR 0.05+0.25 depending on install
          state — a conditional branch on entity state.
        test_recipe:
          setup:
            - "Category C; store ST; products P1,P2 (LISTED) and P3 (LISTED)"
            - "Planogram PG_A ACTIVE for store ST with one line on P1 (facings=10)"
            - "Planogram PG_B APPROVED (target) with lines: P1 (facings=10), P2 (facings=5), P3 (facings=5)"
            - "total_facings on PG_B = 20; product_changes vs installed = 2 (P2,P3 new)"
            - "raw = 20 * 0.05 + 2 * 0.25 = 1.0 + 0.5 = 1.5 → round_half_up(1.5,1) = 1.5"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 20 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 70 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P2", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 35 }
              as: CategoryManager
              captures: { p2: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P3", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 35 }
              as: CategoryManager
              captures: { p3: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${p2}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${p3}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG_A", variant: "BASE" }
              as: CategoryManager
              captures: { pga: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 10, capacity_units: 100 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/approve"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cat_v1: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/activate"
              payload: { expected_category_version: "${cat_v1}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG_B", variant: "BASE" }
              as: CategoryManager
              captures: { pgb: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 10, capacity_units: 100 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/lines"
              payload: { product_id: "${p2}", position_index: 2, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/lines"
              payload: { product_id: "${p3}", position_index: 3, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/approve"
              payload: {}
              as: CategoryManager
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pgb}", store_id: "${stid}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: ResetCoordinator
              captures: { rp: $.data.id }
          assert:
            - "ResetProject.${rp}.labor_hours_estimated == 1.5"

      - name: compliance_score_nested_rounding
        grounds:
          - calculations.compliance_score
          - calculations.compliance_outcome_classification
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: compliance_score_pct
          uses floor() to integer percent FIRST, then the threshold comparison
          happens on the floored value. If we rounded-half-up first, 84.7 → 85
          → PASS; with floor, 84.7 → 84 → WARN. Scaffold pins floor-then-compare
          as the canonical order.
        test_recipe:
          setup:
            - "Retailer with compliance_threshold_pct = 85"
            - "Store ST, planogram PG ACTIVE with total_facings = 23"
            - "Audit A submitted; reviewer scores matched_facings = 19"
            - "raw ratio = 100 * 19/23 = 82.608... → floor → 82; WARN threshold is 75 (=85-10); 82 >= 75 → WARN"
            - "matched=20 → 100*20/23 = 86.95 → floor → 86; 86 >= 85 → PASS"
            - "use matched=19 to land in WARN band"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", compliance_threshold_pct: 85 }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 20 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 23, capacity_units: 230 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cat_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/activate"
              payload: { expected_category_version: "${cat_v}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores/${stid}/audits"
              payload: { planogram_id: "${pgid}", photo_url: "https://x/y.jpg" }
              as: FieldAuditor
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/stores/${stid}/audits/${aid}/score"
              payload: { matched_facings: 19 }
              as: AuditReviewer
          assert:
            - "AuditEvent.${aid}.compliance_score_pct == 82 (floor applied before classification)"
            - "AuditEvent.${aid}.compliance_outcome == WARN (not PASS — round-half-up would have given 85)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: planogram_cyclic_draft_review_loop
        grounds:
          - state_machines.Planogram
        distinguishing_aspect: |
          Planogram has a cyclic shape: DRAFT → IN_REVIEW → DRAFT (via
          return-to-draft) and DRAFT → IN_REVIEW → APPROVED → DRAFT (via
          return-to-draft when never ACTIVE). The loop count is unbounded;
          each cycle preserves version increments.
        test_recipe:
          setup:
            - "Category C; planogram PG in IN_REVIEW"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/return-to-draft"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/return-to-draft"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
          assert:
            - "Planogram.${pgid}.status == DRAFT after final return-to-draft"
            - "Planogram.${pgid}.version has incremented on each cycle (DRAFT→IN_REVIEW→DRAFT→IN_REVIEW→DRAFT = at least 4 bumps from initial creation)"

      - name: product_branching_cut_in_discontinue_relist
        grounds:
          - state_machines.Product
        distinguishing_aspect: |
          Product exhibits branching with fork-join: CANDIDATE → LISTED →
          DISCONTINUING → DELISTED is the forward path; but DISCONTINUING also
          branches back to LISTED via cancel-discontinuation, and DELISTED
          branches back to CANDIDATE via relist. Divergent side-effect sets
          per branch (cascade-delete of DRAFT lines on DELISTED vs no-op on
          cancel-discontinuation).
        test_recipe:
          setup:
            - "Product P is LISTED; discontinuation_effective_date in the future"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /retailers/${rid}/products/${pid}/list"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/products/${pid}"
              payload: {}
              as: CategoryManager
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/products/${pid}/discontinue"
              payload: { discontinuation_effective_date: "2027-01-01T00:00:00Z", expected_product_version: "${pv2}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${pid}/cancel-discontinuation"
              payload: {}
              as: CategoryManager
          assert:
            - "Product.${pid}.status == LISTED after cancel-discontinuation (branched back)"
            - "Product.${pid}.discontinuation_effective_date is null after cancel"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggering transitions)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: planogram_activate_cascade_to_reset_assignment_release
        grounds:
          - state_machines.Planogram.APPROVED_to_ACTIVE
          - state_machines.ResetProject
          - state_machines.ResetAssignment
        distinguishing_aspect: |
          Depth-3 cascade originating from Planogram APPROVED→ACTIVE: activating
          PG_B supersedes PG_A; that supersedure cancels any ResetProject
          referencing PG_A; each cancelled ResetProject releases its ASSIGNED
          ResetAssignments. Three entity types mutated in a chain where each
          hop is caused by the previous, not by the original activate call.
        test_recipe:
          setup:
            - "Category C; PG_A ACTIVE; PG_B APPROVED (variant BASE)"
            - "ResetProject RP referencing PG_A in SCHEDULED"
            - "ResetAssignment RA under RP in ASSIGNED"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 20 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
