  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: disbursements_list_filter_by_status
        claim_type: computed_read
        grounds: [endpoints.GET_/disbursements]

        distinguishing_aspect: "The status filter narrows the list server-side: with one REQUESTED and one REJECTED disbursement on the same client, status=REJECTED returns exactly the rejected row."
        test_recipe:
          setup: ["ACTIVE client with account and DRAFT budget; d1 5000 REQUESTED; d2 6000 created then rejected"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Filter Fay", date_of_birth: "1989-01-31", ssn_last4: "1617", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-FL-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Keep", category: "HOUSING", amount_cents: 5000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { d1_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Drop", category: "HOUSING", amount_cents: 6000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { d2_id: $.data.id } }
            - { call: "POST /disbursements/${d2_id}/reject", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
          trigger:
            - { call: "GET /disbursements?client_id=${c_id}&status=REJECTED", payload: {}, as: CaseManager, captures: { row0_id: "$.data[0].id", row0_st: "$.data[0].status" } }
            - { call: "GET /disbursements?client_id=${c_id}&status=REQUESTED", payload: {}, as: CaseManager, captures: { row1_id: "$.data[0].id", row1_st: "$.data[0].status" } }
          assert:
            - "REJECTED filter: total_count == 1, row0_id == ${d2_id}, row0_st == REJECTED"
            - "REQUESTED filter: total_count == 1, row1_id == ${d1_id}, row1_st == REQUESTED"

      - name: response_envelope_success_and_pagination_fields
        claim_type: response_envelope
        grounds: [response_envelope]

        distinguishing_aspect: "Success envelope shape is fixed: meta.api_request_id/api_request_timestamp present, response_type 'object' for single-resource POST and 'array' for list GET, lists carry limit/offset/total_count/has_more."
        test_recipe:
