          - entities.PmeMeasure.fields.escalated_capital_usd
        distinguishing_aspect: "escalation_years is max(0, construction_start_year - pad_year), so a construction year equal to and a construction year before the PAD year give the identical escalated capital, while a three-year gap compounds 1.03 three times."
        test_recipe:
          setup:
            - "Project with pad_year 2026 and base_annual_generation_mwh 250000."
            - "Three AGENCY_PRESCRIPTION FISH_PASSAGE measures differing only in construction_start_year: 2026, 2024 and 2029; each capital 1200000.00, om 45000.00, flow 120, head 85, days 180."
