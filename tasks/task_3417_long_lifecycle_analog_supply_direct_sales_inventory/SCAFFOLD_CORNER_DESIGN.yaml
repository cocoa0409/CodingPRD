              payload: { reference_design_id: "${v15_rd}", customer_id: "${v15_cust}", part_id: "${v15_part}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { v15_dw: $.data.id }
          trigger:
            - call: "POST /design-wins/${v15_dw}/activate"
              payload: {}
              as: FieldEngineer
              captures: { v15_err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_DESIGN_NOT_PUBLISHED, HTTP 422"
            - "GET /design-wins/${v15_dw}: status still REGISTERED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: ltb_create_and_cancel_release_reservation_and_exposure
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/lifetime-buys
          - endpoints.POST_/lifetime-buys/{id}/cancel
          - state_machines.LifetimeBuy
        distinguishing_aspect: "The lifetime-buy happy path: creation at APPROVED reserves 2080 units and books 312000 cents of exposure; cancel releases both exactly (reserve and exposure back to baseline) — LTB-side compensation distinct from the order-side invariant."
        test_recipe:
          setup: ["Part demand 40/wk, on_hand 3000, schedule 150 cents effective 2026-08-01; ANNOUNCED notice 2026-09-01 / 2027-02-28 / 2027-05-29; customer STRATEGIC / DIRECT_FIELD credit 10000000."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LF412CN", description: "Dual JFET", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 40 }
              as: SupplyPlanner
              captures: { n1_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 5000 }
              as: SupplyPlanner
              captures: { n1_pool: $.data.id }
            - call: "POST /parts/${n1_part}/receipts"
              payload: { capacity_pool_id: "${n1_pool}", units: 3000 }
              as: SupplyPlanner
              captures: { n1_v1: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${n1_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 150 }], expected_part_version: "${n1_v1}" }
              as: ChannelManager
            - call: "POST /parts/${n1_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "EOL" }
              as: SupplyPlanner
              captures: { n1_notice: $.data.id }
            - call: "POST /customers"
              payload: { name: "Lifetime Buyer", tier: "STRATEGIC", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { n1_cust: $.data.id }
            - call: "POST /lifetime-buys"
              payload: { eol_notice_id: "${n1_notice}", part_id: "${n1_part}", customer_id: "${n1_cust}", quantity: 2080 }
              as: Customer
              as_user_id: "${n1_cust}"
              captures: { n1_ltb: $.data.id, n1_price: $.data.unit_price_cents, n1_status: $.data.status }
          trigger:
            - call: "POST /lifetime-buys/${n1_ltb}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${n1_cust}"
              captures: { n1_final: $.data.status }
          assert:
            - "creation: status == APPROVED, unit_price_cents == 150, ltb_value_cents == 312000"
            - "between create and cancel: GET /parts/${n1_part} shows reserved_units == 2080; GET /customers/${n1_cust} shows open_exposure_cents == 312000"
            - "cancel response: status == CANCELLED"
            - "after cancel: reserved_units == 0 and open_exposure_cents == 0 (exact release)"

      - name: default_clock_is_fixed_at_scaffold_epoch
        claim_type: Computed read
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.CapacityPool.fields.status
        distinguishing_aspect: "Before any clock-set, the logical clock is exactly 2026-09-01T00:00:00Z — a pool whose window starts one second later (2026-09-01T00:00:01Z) reads PLANNED on a fresh server, proving the clock does not follow wall time."
        test_recipe:
          setup: ["Fresh server state; no clock-set call has been made."]
          setup_api_calls: []
          trigger:
            - call: "POST /capacity-pools"
              payload: { site_name: "MFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:01Z", period_end: "2026-12-01T00:00:00Z", total_units: 100 }
              as: SupplyPlanner
              captures: { n2_status: $.data.status }
          assert:
            - "create response status == PLANNED (window start one second after the fixed default clock)"
            - "a pool starting exactly at 2026-09-01T00:00:00Z would read OPEN (inclusive start) — together they pin the default instant"

      - name: customer_tier_change_affects_future_allocation_scores
        claim_type: Side Effect Execution
        grounds:
          - endpoints.PATCH_/customers/{id}
          - calculations.calc_priority_score
        distinguishing_aspect: "Tier is read at run-creation time, not order time: the same BACKORDERED line scores 40 in run 1 (STANDARD) and 100 in run 2 after the customer is patched to STRATEGIC — and only run 2's award lands."
        test_recipe:
          setup: ["Shortage part (demand 40, buffer 1.5, target 1560) with on_hand 0; STANDARD customer, order of 10 submitted -> BACKORDERED; allocation run 1 published with zero available (award 0)."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TLV272IDR", description: "Dual RRIO", package_family: "SOIC", process_technology: "CMOS_180NM", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { n3_part: $.data.id, n3_v1: $.data.version }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { n3_pool: $.data.id }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${n3_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${n3_v1}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Rising Star", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { n3_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${n3_cust}", lines: [{ part_id: "${n3_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${n3_cust}"
              captures: { n3_ord: $.data.id }
            - call: "POST /orders/${n3_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${n3_cust}"
            - call: "POST /allocation-runs"
              payload: { period_label: "2026-W44" }
              as: SupplyPlanner
              captures: { n3_run1: $.data.id }
            - call: "POST /allocation-runs/${n3_run1}/publish"
              payload: {}
              as: SupplyPlanner
            - call: "PATCH /customers/${n3_cust}"
              payload: { tier: "STRATEGIC" }
              as: ChannelManager
            - call: "POST /parts/${n3_part}/receipts"
              payload: { capacity_pool_id: "${n3_pool}", units: 10 }
              as: SupplyPlanner
            - call: "POST /allocation-runs"
              payload: { period_label: "2026-W45" }
              as: SupplyPlanner
              captures: { n3_run2: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${n3_run2}/publish"
              payload: {}
              as: SupplyPlanner
          assert:
            - "run 1 (pre-patch): the line's award was 0 with allocation_priority_score == 40 (STANDARD) — zero available units"
            - "run 2 (post-patch): GET /order-lines?order_id=${n3_ord} shows awarded_units == 10, allocation_priority_score == 100, allocation_run_id == ${n3_run2}"
            - "GET /orders/${n3_ord}: status == ALLOCATED"
            - "part created with demand 40 / no receipts is SHORTAGE (coverage 0/1560 = 0) so the order backordered at submit; the 10-unit receipt between runs supplied run 2"

      - name: nrnd_part_remains_orderable
        claim_type: Conditional action
        grounds:
          - endpoints.PATCH_/parts/{id}
          - state_machines.Part.ACTIVE_to_NRND
          - validations[priority=9]
        distinguishing_aspect: "NRND (not recommended for new designs) is a soft lifecycle flag, not an order gate: orders on NRND parts still submit and allocate, unlike LAST_TIME_BUY or DISCONTINUED."
        test_recipe:
          setup: ["Part with schedule and 100 on hand; planner toggles it ACTIVE -> NRND; customer STANDARD credit 1000000 with a DRAFT order of 5."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM741H", description: "Metal can op amp", package_family: "TO99", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { n4_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { n4_pool: $.data.id }
            - call: "POST /parts/${n4_part}/receipts"
              payload: { capacity_pool_id: "${n4_pool}", units: 100 }
              as: SupplyPlanner
              captures: { n4_v1: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${n4_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${n4_v1}" }
              as: ChannelManager
            - call: "PATCH /parts/${n4_part}"
              payload: { lifecycle_status: "NRND" }
              as: SupplyPlanner
              captures: { n4_status: $.data.lifecycle_status }
            - call: "POST /customers"
              payload: { name: "Legacy Buyer", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { n4_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${n4_cust}", lines: [{ part_id: "${n4_part}", quantity: 5 }] }
              as: Customer
              as_user_id: "${n4_cust}"
              captures: { n4_ord: $.data.id }
          trigger:
            - call: "POST /orders/${n4_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${n4_cust}"
              captures: { n4_ord_status: $.data.status }
          assert:
            - "PATCH response: lifecycle_status == NRND"
            - "submit on the NRND part succeeds: order status == ALLOCATED, total_cents == 500"
            - "GET /parts/${n4_part}: reserved_units == 5"

      - name: patch_part_immediately_visible_in_inventory_position
        claim_type: Side Effect Execution
        grounds:
          - endpoints.PATCH_/parts/{id}
          - endpoints.GET_/parts/{id}/inventory-position
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: PATCHing demand_rate from 40 to 80 is visible in the very next inventory-position GET — target_trailing_units recomputes from 1560 to 3120 with no lag or rebuild step."
        test_recipe:
          setup: ["Part demand 40, buffer 1.5 (target 1560)."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "OPA37GP", description: "Low noise amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { n5_part: $.data.id }
          trigger:
            - call: "PATCH /parts/${n5_part}"
              payload: { demand_rate_units_per_week: 80 }
              as: SupplyPlanner
            - call: "GET /parts/${n5_part}/inventory-position"
              payload: {}
              as: SupplyPlanner
              captures: { n5_target: $.data.target_trailing_units }
          assert:
            - "target_trailing_units == 3120 (ceil(80 * 1.5 * 26)) in the read immediately following the PATCH"
            - "PATCH response itself carries the updated demand_rate_units_per_week == 80 and an incremented version == 2"

  # ===========================================================================
  - section: rbac
    instances:
      - name: role_exclusive_operations_denied_to_other_roles
        claim_type: Violation to Error
        grounds:
          - roles.PlatformAdmin
          - roles.QualityEngineer
          - roles.ChannelManager
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Peer-role exclusivity: PlatformAdmin (read-only plus clock) cannot POST /parts; QualityEngineer cannot POST /capacity-pools; ChannelManager cannot POST /allocation-runs — each rejected 403 with a well-formed payload."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { part_number: "RBAC2", description: "Admin attempt", package_family: "SOIC", process_technology: "CMOS_180NM" }
              as: PlatformAdmin
              captures: { r1_err1: $.data.error_id }
            - call: "POST /capacity-pools"
              payload: { site_name: "RBAC-FAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 100 }
              as: QualityEngineer
              captures: { r1_err2: $.data.error_id }
            - call: "POST /allocation-runs"
              payload: { period_label: "2026-W46" }
              as: ChannelManager
              captures: { r1_err3: $.data.error_id }
          assert:
            - "all three responses: error_id == ERR_UNAUTHORIZED, HTTP 403"
            - "no part, pool, or run is persisted (subsequent GETs confirm empty state)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: pricing_publish_stale_part_version_rejected
        claim_type: Violation to Error
        grounds:
          - concurrency_rules[pricing-schedule-publish-stale-part]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Part.version: after the first publish advances the part to version 2, a second publish carrying the stale captured version 1 is rejected 412 and supersedes nothing."
        test_recipe:
          setup: ["Part created (version 1); schedule S1 published with the correct version (part now version 2)."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TLC272CP", description: "LinCMOS amp", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { x1_part: $.data.id, x1_v1: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${x1_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${x1_v1}" }
              as: ChannelManager
              captures: { x1_s1: $.data.id }
          trigger:
            - call: "POST /pricing-schedules"
              payload: { part_id: "${x1_part}", effective_from: "2026-08-15T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 120 }], expected_part_version: "${x1_v1}" }
              as: ChannelManager
              captures: { x1_err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION, HTTP 412 (part version is 2, the stale payload carried 1)"
            - "GET /parts/${x1_part}/pricing-schedules: exactly 1 schedule, the 100-cent S1, still PUBLISHED"
            - "GET /parts/${x1_part}: version == 2 (failed publish did not bump)"

      - name: pool_invest_occ_and_capacity_floor
        claim_type: Violation to Error
        grounds:
          - concurrency_rules[capacity-pool-invest-stale-version]
          - errors.ERR_STALE_VERSION
          - errors.ERR_POOL_CAPACITY_EXCEEDED
        distinguishing_aspect: "Two independent PATCH guards on one endpoint: investment below allocated_units (300) is a 422 business-floor rejection; investment with a stale version (after a successful invest bumped it) is a 412 OCC rejection."
        test_recipe:
          setup: ["Part + pool (total 500); receipt of 300 makes allocated_units 300 and bumps the pool to version 2; pool version captured after the receipt."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM317HV", description: "High-volt regulator", package_family: "TO3", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { x2_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { x2_pool: $.data.id }
            - call: "POST /parts/${x2_part}/receipts"
              payload: { capacity_pool_id: "${x2_pool}", units: 300 }
              as: SupplyPlanner
            - call: "GET /capacity-pools/${x2_pool}"
              payload: {}
              as: SupplyPlanner
              captures: { x2_pv: $.data.version }
          trigger:
            - call: "PATCH /capacity-pools/${x2_pool}"
              payload: { total_units: 200, expected_capacity_pool_version: "${x2_pv}" }
              as: SupplyPlanner
              captures: { x2_err1: $.data.error_id }
            - call: "PATCH /capacity-pools/${x2_pool}"
              payload: { total_units: 800, expected_capacity_pool_version: "${x2_pv}" }
              as: SupplyPlanner
              captures: { x2_ok: $.data.total_units }
            - call: "PATCH /capacity-pools/${x2_pool}"
              payload: { total_units: 900, expected_capacity_pool_version: "${x2_pv}" }
              as: SupplyPlanner
              captures: { x2_err2: $.data.error_id }
          assert:
            - "total_units 200 (< allocated 300) with the correct version: error_id == ERR_POOL_CAPACITY_EXCEEDED, HTTP 422"
            - "total_units 800 with the correct version succeeds: response total_units == 800 and version advanced"
            - "repeating the same captured version for total_units 900: error_id == ERR_STALE_VERSION, HTTP 412"
            - "GET /capacity-pools/${x2_pool}: total_units == 800, allocated_units == 300"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_pool_period_overlap_covered
        claim_type: Violation to Error
        grounds: [errors.ERR_POOL_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: capacity_pool_periods_half_open_adjacency
          rationale: "The overlap rejection (409) is the trigger of the named difficulty instance."
      - name: error_eol_notice_active_exists_covered
        claim_type: Violation to Error
        grounds: [errors.ERR_EOL_NOTICE_ACTIVE_EXISTS]
        excluded_because:
          difficulty_instance: eol_notice_window_closed_overlap_rejected
          rationale: "Closed-window touch rejection is the trigger of the named difficulty instance."
      - name: error_site_not_qualified_covered
        claim_type: Violation to Error
        grounds: [errors.ERR_SITE_NOT_QUALIFIED]
        excluded_because:
          difficulty_instance: automotive_receipt_blocked_when_site_qualification_suspended
          rationale: "The suspended-qualification receipt rejection is the trigger of the named difficulty instance."
      - name: error_part_not_orderable_covered
        claim_type: Violation to Error
        grounds: [errors.ERR_PART_NOT_ORDERABLE]
        excluded_because:
          difficulty_instance: order_submit_blocked_when_part_discontinued
          rationale: "DISCONTINUED-part submit rejection is the trigger of the named difficulty instance; reference-design publish reuse of the same error is covered by reference_design_publish_discontinued_part_rejected in validations."
      - name: error_credit_limit_priority_covered
        claim_type: Priority Ordering
        grounds: [errors.ERR_CREDIT_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: submit_cancelled_order_state_beats_credit
          rationale: "Credit failure as the losing check is asserted there; as the winning check it is asserted in credit_limit_equality_passes_then_overflow_rejected in validations."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_patch_visible
        claim_type: Immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: allocation_publish_cascades_order_part_posture
          rationale: "The publish cascade's posture flip is asserted in the same request sequence as the mutation; patch visibility is additionally exercised by patch_part_immediately_visible_in_inventory_position in endpoints."
