        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
          - errors[ERR_SHOW_NOT_ACTIVE]
          - state_machines.Show.production_posture
        distinguishing_aspect: "Session booking requires owning Show.production_posture==ACTIVE; on a SUSPENDED show (no ACTIVE contract) it returns ERR_SHOW_NOT_ACTIVE (409)."
        test_recipe:
          setup:
            - "Show S has one ACTIVE contract (posture ACTIVE) and one INTAKE episode E; the contract is then terminated, leaving no ACTIVE contract so posture becomes SUSPENDED, and a new session booking on E is attempted."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Active Host", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
