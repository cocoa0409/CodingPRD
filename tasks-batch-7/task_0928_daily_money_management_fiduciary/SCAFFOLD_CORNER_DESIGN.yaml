        excluded_because:
          difficulty_instance: schedule_then_cancel_conserves_account_available_balance
          rationale: "That instance places a hold through the same adjustments endpoint and pins all four balance fields; the corner_ledger_entry_is_immutable_with_no_version_field instance already pins the DEPOSIT arm at 5250000."

