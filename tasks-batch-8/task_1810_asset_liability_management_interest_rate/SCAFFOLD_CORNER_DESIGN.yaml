# =============================================================================
# Task 1810: ALM & Interest Rate Risk — §1.9 Scaffold Corner Design
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Names are unique across BOTH design files.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: create_book_missing_name_rejected
        claim_type: required_fields
        grounds: [entities.AlmBook.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /books without required `name` is rejected 400 ERR_INVALID_REQUEST; no book persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /books"
              payload: { base_curve_rate_bps: 400 }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: position_deposit_without_segment_rejected
        claim_type: required_fields
        grounds: [entities.Position.fields.deposit_segment, "errors[ERR_DEPOSIT_SEGMENT_REQUIRED]"]
        distinguishing_aspect: "Conditional required field: category=DEPOSIT without deposit_segment -> 422 ERR_DEPOSIT_SEGMENT_REQUIRED; the same payload with category=LOAN succeeds without the field."
        test_recipe:
          setup: ["book exists in DRAFT"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
          trigger:
            - call: "POST /books/${b}/positions"
              payload: { category: DEPOSIT, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEPOSIT_SEGMENT_REQUIRED"
            - "GET /books/${b}/positions returns 0 rows"

      - name: position_and_scenario_defaults_applied
        claim_type: defaults
        grounds: [entities.Position.fields.is_prepayment_eligible, entities.RateScenario.fields.horizon_months, entities.AlmBook.fields.min_hedged_notional_cents]
        distinguishing_aspect: "Omitting optional inputs applies documented defaults: is_prepayment_eligible=false, horizon_months=12, min_hedged_notional_cents=0."
        test_recipe:
          setup: ["book created without min_hedged_notional_cents"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { p: $.data.id } }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
          assert:
            - "AlmBook.${b}.min_hedged_notional_cents == 0"
            - "Position.${p}.is_prepayment_eligible == false"
            - "Position.${p}.status == ACTIVE"
            - "RateScenario.${sc}.horizon_months == 12"
            - "RateScenario.${sc}.status == ACTIVE"

      - name: position_create_system_field_input_ignored
        claim_type: computed_system_fields
        grounds: [entities.Position.fields.status]
        distinguishing_aspect: "Client-supplied status=RETIRED and id are ignored on create: server mints its own id and initial status is ACTIVE."
        test_recipe:
          setup: ["book exists"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0, status: RETIRED }, as: TreasuryAnalyst, captures: { p: $.data.id } }
          assert:
            - "Position.${p}.status == ACTIVE"
            - "Position.${p}.id is a server-minted UUID != any client-supplied value"

      - name: get_book_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID -> 404 ERR_NOT_FOUND with the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /books/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: list_positions_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope, "endpoints[GET /books/{id}/positions]"]
        distinguishing_aspect: "limit=2 over 3 positions returns exactly 2 rows with total_count=3 and has_more=true; offset=2 returns the remaining 1 row with has_more=false."
        test_recipe:
          setup: ["book with 3 positions"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: SECURITY, balance_cents: 2000000, rate_bps: 400, scheduled_runoff_pct: 0.0, duration_years: 4.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: TIME, balance_cents: 3000000, rate_bps: 150, scheduled_runoff_pct: 100.0, duration_years: 1.0 }, as: TreasuryAnalyst }
          trigger:
            - { call: "GET /books/${b}/positions?limit=2&offset=0", payload: {}, as: Regulator }
            - { call: "GET /books/${b}/positions?limit=2&offset=2", payload: {}, as: Regulator }
          assert:
            - "page 1: response_type == array, total_count == 3, has_more == true, 2 rows"
            - "page 2: has_more == false, 1 row"

      - name: retired_position_excluded_from_book_totals
        claim_type: derived_field_reconciliation
        grounds: [entities.AlmBook.fields.total_liabilities_cents, state_machines.Position.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Retiring the 40,000,000 borrowing recomputes total_liabilities_cents from 120,000,000 to 80,000,000 and bumps book version; the retired row stays queryable via status filter."
        test_recipe:
          setup: ["Book1 ACTIVE with D1 80,000,000 and B1 40,000,000 liabilities and L1 asset"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: BORROWING, balance_cents: 40000000, rate_bps: 450, scheduled_runoff_pct: 25.0, duration_years: 2.0 }, as: TreasuryAnalyst, captures: { bor: $.data.id } }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
          trigger:
            - { call: "POST /positions/${bor}/retire", payload: {}, as: TreasuryAnalyst }
          assert:
            - "Position.${bor}.status == RETIRED"
            - "AlmBook.${b}.total_liabilities_cents == 80000000"
            - "GET /books/${b}/positions?status=RETIRED returns exactly 1 row"

  # ----------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: submit_already_submitted_set_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssumptionSet.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A second submit on a SUBMITTED set fails 409 and the set remains SUBMITTED at the same version."
        test_recipe:
          setup: ["book; PREPAYMENT set SUBMITTED"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { s: $.data.id } }
            - { call: "POST /assumption-sets/${s}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
          trigger:
            - call: "POST /assumption-sets/${s}/submit"
              payload: {}
              as: TreasuryAnalyst
              as_user_id: an-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "AssumptionSet.${s}.status == SUBMITTED"
            - "AssumptionSet.${s}.version == 2"

      - name: dedesignate_terminal_hedge_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.HedgeRelationship]
        distinguishing_aspect: "DEDESIGNATED is terminal: a further dedesignate attempt fails ERR_INVALID_STATE_TRANSITION; no breach or balance side effects fire twice."
        test_recipe:
          setup: ["Book1 ACTIVE (floor 0); H1 DESIGNATED [2026-08,2027-08) on L1 then dedesignated"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h: $.data.id } }
            - { call: "POST /hedges/${h}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${h}/dedesignate", payload: { reason: "no longer needed" }, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - call: "POST /hedges/${h}/dedesignate"
              payload: { reason: "again" }
              as: ALCOChair
              as_user_id: ch-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "AlmBook.${b}.hedged_notional_cents == 0"

      - name: publish_run_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.SimulationRun.COMPLETED_to_PUBLISHED]
        distinguishing_aspect: "Publishing a PUBLISHED run fails ERR_INVALID_STATE_TRANSITION; run_count on the period report is not double-counted."
        test_recipe:
          setup: ["Book1 ACTIVE with sets approved; scenario UP200; one run created and published"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
            - { call: "POST /simulation-runs/${run}/publish", payload: {}, as: TreasuryAnalyst }
          trigger:
            - call: "POST /simulation-runs/${run}/publish"
              payload: {}
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "GET /books/${b}/alco-reports: single DRAFT report for 2026-08 with run_count == 1"

      - name: scenario_archive_blocks_new_runs
        claim_type: side_effect_execution
        grounds: [state_machines.RateScenario.ACTIVE_to_ARCHIVED, "errors[ERR_SCENARIO_NOT_ACTIVE]"]
        distinguishing_aspect: "Archiving a scenario flips it to ARCHIVED and a subsequent run referencing it fails ERR_SCENARIO_NOT_ACTIVE while existing runs are untouched."
        test_recipe:
          setup: ["Book1 ACTIVE; sets approved; scenario UP200; one COMPLETED run exists"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
            - { call: "POST /scenarios/${sc}/archive", payload: {}, as: TreasuryAnalyst }
          trigger:
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv2: $.data.version } }
            - call: "POST /books/${b}/simulation-runs"
              payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv2}" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SCENARIO_NOT_ACTIVE"
            - "SimulationRun.${run}.status == COMPLETED"

      - name: assumption_approve_supersede_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.AssumptionSet.APPROVED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: approve_approve_keeps_single_approved_per_domain
          rationale: "Supersede of the prior APPROVED set and the stale flag on pinning runs are asserted there."

      - name: breach_auto_escalation_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.LimitBreach.OPEN_to_ESCALATED]
        excluded_because:
          difficulty_instance: limit_breach_fork_escalation_and_remediation
          rationale: "The clock-sweep escalation branch is asserted there alongside the remediation branch."

  # -------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: ramp_eve_uses_terminal_shock
        claim_type: correct_result
        grounds: [calculations.eve_duration_approximation, calculations.scenario_year1_rate_delta]
        excluded_because:
          difficulty_instance: deposit_beta_asymmetric_and_ramp_lagged
          rationale: "Asserts SimulationRun.eve_scenario_cents == 18600000 for RAMP +300/12, pinning terminal-shock EVE while NII uses the year-1 average 150."

      - name: backtest_deviation_equality_is_within_tolerance
        claim_type: correct_result
        grounds: [calculations.backtest_deviation]
        distinguishing_aspect: "Strict > tolerance: observed 13.0 vs predicted 10.0 gives deviation exactly 3.0 == PREPAYMENT tolerance, so outcome is WITHIN_TOLERANCE and no governance flag is set."
        test_recipe:
          setup: ["Book1 ACTIVE; PREPAYMENT set APPROVED (base_cpr 10.0); clock 2026-11-01 so [2026-08,3mo) is fully elapsed"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ModelRiskValidator }
          trigger:
            - { call: "POST /books/${b}/backtests", payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 13.0 }, as: ModelRiskValidator, captures: { r: $.data.id } }
          assert:
            - "BacktestReview.${r}.predicted_value_pct == 10.0"
            - "BacktestReview.${r}.deviation_pct == 3.0"
            - "BacktestReview.${r}.outcome == WITHIN_TOLERANCE"
            - "AssumptionSet.${ps}.governance_flag == NONE"

      - name: suspended_limit_excluded_from_breach_evaluation
        claim_type: input_set_filtering
        grounds: [calculations.policy_limit_evaluation, state_machines.PolicyLimit.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Only ACTIVE limits are evaluated: with the NII 1.0 limit SUSPENDED, the -4.57 run shows breach_summary NONE and creates zero breaches; resuming restores evaluation."
        test_recipe:
          setup: ["Book1 ACTIVE; sets approved; NII limit 1.0 created then SUSPENDED; scenario UP200"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/policy-limits", payload: { metric: NII_DELTA_PCT, applies_to_kinds: ["ALL"], threshold_pct: 1.0 }, as: ALCOChair, as_user_id: ch-1, captures: { lim: $.data.id } }
            - { call: "PATCH /policy-limits/${lim}", payload: { status: SUSPENDED }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
          assert:
            - "SimulationRun.${run}.breach_summary == NONE"
            - "GET /breaches?book_id=${b} returns 0 rows"

  # --------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: request_missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call without X-User-ID/X-User-Role fails 400 before any role, existence, or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /books"
              payload: { name: "Book A", base_curve_rate_bps: 400 }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (request sent without auth headers)"

      - name: observed_value_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_OBSERVED_VALUE_INVALID]"]
        distinguishing_aspect: "observed_value_pct 150.0 (> 100) is a 422 shape error and takes precedence over window/temporal checks."
        test_recipe:
          setup: ["Book1 ACTIVE; PREPAYMENT set APPROVED"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - call: "POST /books/${b}/backtests"
              payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 150.0 }
              as: ModelRiskValidator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OBSERVED_VALUE_INVALID"

      - name: dynamic_run_missing_growth_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", entities.SimulationRun.fields.annual_growth_pct]
        distinguishing_aspect: "balance_sheet_convention=DYNAMIC without annual_growth_pct is a 400 ERR_INVALID_REQUEST (conditional required field); STATIC without it succeeds."
        test_recipe:
          setup: ["Book1 ACTIVE; sets approved; scenario UP200"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - call: "POST /books/${b}/simulation-runs"
              payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: DYNAMIC, expected_book_version: "${bv}" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: params_mismatch_domain_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_ASSUMPTION_PARAMS_MISMATCH]"]
        distinguishing_aspect: "PREPAYMENT params on a DEPOSIT_BETA domain set are rejected 422 at creation; each domain has a closed params schema."
        test_recipe:
          setup: ["book exists"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
          trigger:
            - call: "POST /books/${b}/assumption-sets"
              payload: { domain: DEPOSIT_BETA, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }
              as: TreasuryAnalyst
              as_user_id: an-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ASSUMPTION_PARAMS_MISMATCH"

      - name: limit_scope_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_LIMIT_SCOPE_CONFLICT]"]
        distinguishing_aspect: "A second ACTIVE limit with the same (book, metric, applies_to_kinds) is rejected; a different metric or a SUSPENDED first limit allows creation."
        test_recipe:
          setup: ["book with one ACTIVE NII/ALL limit"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/policy-limits", payload: { metric: NII_DELTA_PCT, applies_to_kinds: ["ALL"], threshold_pct: 5.0 }, as: ALCOChair, as_user_id: ch-1, captures: { l1: $.data.id } }
          trigger:
            - call: "POST /books/${b}/policy-limits"
              payload: { metric: NII_DELTA_PCT, applies_to_kinds: ["ALL"], threshold_pct: 6.0 }
              as: ALCOChair
              as_user_id: ch-1
              captures: { err: $.data.error_id }
            - { call: "POST /books/${b}/policy-limits", payload: { metric: EVE_DELTA_PCT, applies_to_kinds: ["ALL"], threshold_pct: 12.0 }, as: ALCOChair, as_user_id: ch-1, captures: { l2: $.data.id } }
          assert:
            - "err == ERR_LIMIT_SCOPE_CONFLICT"
            - "PolicyLimit.${l2}.status == ACTIVE"

      - name: report_period_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REPORT_PERIOD_CONFLICT]"]
        distinguishing_aspect: "One non-terminal report per (book, period_month): creating a second 2026-08 report while the first is DRAFT fails 409."
        test_recipe:
          setup: ["book with a DRAFT report for 2026-08"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/alco-reports", payload: { period_month: "2026-08" }, as: TreasuryAnalyst, captures: { rp: $.data.id } }
          trigger:
            - call: "POST /books/${b}/alco-reports"
              payload: { period_month: "2026-08" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPORT_PERIOD_CONFLICT"

      - name: backtest_window_not_elapsed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_BACKTEST_WINDOW_NOT_ELAPSED]"]
        distinguishing_aspect: "At the default clock 2026-08-01, window [2026-08,3mo) ends 2026-11 > current month -> 409 ERR_BACKTEST_WINDOW_NOT_ELAPSED; the same payload succeeds after advancing to 2026-11-01."
        test_recipe:
          setup: ["Book1 ACTIVE; PREPAYMENT set APPROVED"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - call: "POST /books/${b}/backtests"
              payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 11.0 }
              as: ModelRiskValidator
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ModelRiskValidator }
            - { call: "POST /books/${b}/backtests", payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 11.0 }, as: ModelRiskValidator, captures: { r: $.data.id } }
          assert:
            - "err == ERR_BACKTEST_WINDOW_NOT_ELAPSED"
            - "BacktestReview.${r}.outcome == WITHIN_TOLERANCE"

      - name: hedge_activate_before_start_month_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_HEDGE_NOT_ACTIVATABLE]"]
        distinguishing_aspect: "DESIGNATED hedge with start_month 2026-10 cannot activate at default clock 2026-08 (ERR_HEDGE_NOT_ACTIVATABLE); after advancing to 2026-10-01 activation succeeds."
        test_recipe:
          setup: ["Book1 ACTIVE; hedge DESIGNATED [2026-10,2027-10) on L1"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h: $.data.id } }
            - { call: "POST /hedges/${h}/designate", payload: { start_month: "2026-10", end_month: "2027-10", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - call: "POST /hedges/${h}/activate"
              payload: {}
              as: ALCOChair
              as_user_id: ch-1
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${h}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          assert:
            - "err == ERR_HEDGE_NOT_ACTIVATABLE"
            - "HedgeRelationship.${h}.status == ACTIVE after clock advance"

      - name: backtest_close_revised_without_newer_approved_rejected
        claim_type: violation_to_error
        grounds: [state_machines.BacktestReview.OPEN_to_CLOSED_REVISED, "errors[ERR_BACKTEST_CLOSURE_REQUIRES_REVISION]"]
        distinguishing_aspect: "CLOSED_REVISED requires a newer APPROVED set in the domain; without one the close fails 409 and the review stays OPEN with the governance flag still set."
        test_recipe:
          setup: ["Book1 ACTIVE; PREPAYMENT set APPROVED (base 10.0); clock 2026-11-01; BREACH review (observed 14.0) OPEN and flag REVIEW_REQUIRED"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 1000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ModelRiskValidator }
            - { call: "POST /books/${b}/backtests", payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 14.0 }, as: ModelRiskValidator, captures: { r: $.data.id } }
          trigger:
            - call: "POST /backtests/${r}/close"
              payload: { outcome: CLOSED_REVISED }
              as: ALCOChair
              as_user_id: ch-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BACKTEST_CLOSURE_REQUIRES_REVISION"
            - "BacktestReview.${r}.status == OPEN"
            - "AssumptionSet.${ps}.governance_flag == REVIEW_REQUIRED"

      - name: assumption_under_review_blocks_run
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_ASSUMPTION_UNDER_REVIEW]", calculations.backtest_deviation]
        distinguishing_aspect: "An OPEN BREACH review sets governance_flag=REVIEW_REQUIRED and blocks new runs pinning that set; closing the review CLOSED_ACCEPTED clears the flag and the same run succeeds."
        test_recipe:
          setup: ["Book1 ACTIVE; all sets APPROVED; scenario UP200; BREACH review OPEN on prepay set (observed 14.0 at clock 2026-11-01)"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ModelRiskValidator }
            - { call: "POST /books/${b}/backtests", payload: { assumption_set_id: "${ps}", start_month: "2026-08", observation_months: 3, observed_value_pct: 14.0 }, as: ModelRiskValidator, captures: { rev: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - call: "POST /books/${b}/simulation-runs"
              payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
            - { call: "POST /backtests/${rev}/close", payload: { outcome: CLOSED_ACCEPTED }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
          assert:
            - "err == ERR_ASSUMPTION_UNDER_REVIEW"
            - "BacktestReview.${rev}.outcome == BREACH"
            - "AssumptionSet.${ps}.governance_flag == NONE after CLOSED_ACCEPTED"
            - "SimulationRun.${run}.status == COMPLETED"

      - name: priority_conflict_state_vs_safety
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: state_beats_segregation_on_reapprove
          rationale: "Dual-failure ordering asserted there."

      - name: priority_conflict_temporal_vs_fiscal
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: temporal_beats_fiscal_on_designate
          rationale: "Dual-failure ordering asserted there."

  # ----------------------------------------------------------------- Endpoints
  - section: endpoints
    instances:
      - name: run_create_on_draft_book_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=6]", "errors[ERR_BOOK_NOT_ACTIVE]"]
        distinguishing_aspect: "Run creation is gated on book status ACTIVE; a DRAFT book fails ERR_BOOK_NOT_ACTIVE even with all other inputs valid."
        test_recipe:
          setup: ["book DRAFT with positions and approved sets; scenario UP200"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
