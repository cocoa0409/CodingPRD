            - call: "POST /cte/advisory-committees/${cmte_id}/members"
              payload: { full_name: "Iris Lund", sector: "POSTSECONDARY", seat_code: "PSE-1", term_start_on: "2026-01-01", term_end_on: "2027-12-31" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { m3_id: $.data.id }
            - call: "POST /cte/advisory-committees/${cmte_id}/meetings"
              payload: { agenda_kind: "CLNA_STAKEHOLDER", scheduled_for: "2026-08-04T14:00:00.000Z" }
