        grounds:
          - state_machines.TakedownSubmission.REJECTED_to_SUBMITTED
          - entities.TakedownSubmission.fields.round_number
          - calculations.marketplace_decision_deadline
          - validations[priority=60]
        distinguishing_aspect: |
          SUBMITTED is re-entered from REJECTED, so the machine is genuinely cyclic:
          round_number climbs 0 -> 1, decision_due_at is re-derived from the NEW
          submission instant (2026-08-19T09:00:00Z rather than the original
          2026-08-17T09:00:00Z), decided_at and marketplace_case_ref are wiped, and
