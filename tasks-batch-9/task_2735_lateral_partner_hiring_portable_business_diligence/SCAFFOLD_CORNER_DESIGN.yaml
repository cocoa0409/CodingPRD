            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30, approach_confidential: true }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/approach"
              payload: {}
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/questionnaires"
              payload: { declared_prior_year_billings_usd: 1600000.00, declared_prior_year_collections_usd: 1410000.00, declared_realization_rate: 0.9500, primary_matter_types: ["M_AND_A"] }
              as: RecruitingCoordinator
              captures: { lpq_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Northwind Holdings", relationship_role: "BILLING_ATTORNEY", client_consent_status: "CONSENT_CONFIRMED", claimed_annual_billings_usd: 1600000.00, claimed_portability_pct: 0.8000, claimed_realization_rate: 1.0000, matter_types: ["M_AND_A", "SECURITIES"] }
