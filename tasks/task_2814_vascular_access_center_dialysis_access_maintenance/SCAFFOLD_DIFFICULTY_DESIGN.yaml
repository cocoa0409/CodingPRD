              as: AccessCoordinator
            - call: "POST /procedures"
              payload: { referral_id: "${ref3_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", sedation_rn_id: "${rn_id}", procedure_type: "ANGIOPLASTY", sedation_level: "MODERATE", scheduled_start: "2026-08-01T16:02:00Z", scheduled_end: "2026-08-01T17:02:00Z", expected_referral_version: "${ref3_v}" }
              as: AccessCoordinator
          assert:
            - "the 14:30-15:30 candidate returns 409 ERR_RECOVERY_BAY_UNAVAILABLE: its closed recovery window [15:30, 17:00] touches case 1's [14:00, 15:30] at exactly 15:30, so recovery_cases == 1 and bay_headroom == floor(1 / 1) - 1 == 0"
            - "that same candidate passed every earlier gate: room [14:30, 15:30) is disjoint from [13:00, 14:00) with turnover_buffer_min 0, room_headroom was 6 - 1 == 5, and rn_headroom was 2 - 0 == 2 because the clinical intervals do not overlap"
