scaffold_difficulty_design:
  # ========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contribution_provisional_vs_reconciled
        grounds:
          - calculations.suggested_contribution
          - entities.Client.income_tier
          - entities.Client.suggested_contribution_cents
        distinguishing_aspect: |
          Same client, same ACTIVE plan (weekly_meal_count 6): the provisional
          monthly suggested contribution computed at intake income (TIER_A) is
          2616 cents, but after PATCH raises income into TIER_B the reconciled
          value is 6096 cents — a difference on the Client contribution domain.
        test_recipe:
          setup:
            - "ACTIVE client (TIER_A, income 120000, household 1) with one ACTIVE HOT MealPlan (meals_per_day 2, delivery_days [MON,WED,FRI], weekly_meal_count 6) on an ACTIVE route in zone Z1."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "GET /clients/${cli_id}/summary"
              payload: {}
              as: RouteManager
              captures: { prov_suggested: $.data.suggested_contribution_cents }
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v2: $.data.version }
            - call: "PATCH /clients/${cli_id}"
              payload: { monthly_income_cents: 200000, expected_client_version: "${cli_v2}" }
              as: IntakeCoordinator
            - call: "GET /clients/${cli_id}/summary"
              payload: {}
              as: RouteManager
              captures: { recon_suggested: $.data.suggested_contribution_cents }
          assert:
            - "first GET summary suggested_contribution_cents == 2616"
            - "Client.income_tier == TIER_A before PATCH, TIER_B after PATCH"
            - "second GET summary suggested_contribution_cents == 6096"
            - "2616 != 6096 (provisional vs reconciled diverge)"

      - name: oaa_units_provisioned_vs_delivered
        grounds:
          - calculations.oaa_units_reporting
          - entities.Delivery.meal_count
          - entities.Client.lifetime_oaa_units
        distinguishing_aspect: |
          Same ACTIVE plan provisions 24 monthly OAA units, but only DELIVERED
          deliveries count toward delivered_units: after 2 DELIVERED (meal_count
          2 each) and 1 SKIPPED, delivered_units is 4 while provisioned is 24 —
          divergence on the Delivery/OAA domain, distinct from the Client
          contribution domain of the sibling instance.
        test_recipe:
          setup:
            - "ACTIVE client with ACTIVE HOT plan (meals_per_day 2, delivery_days [MON,WED,FRI], weekly_meal_count 6); 3 deliveries scheduled; 2 DELIVERED, 1 SKIPPED."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-04" }
              as: RouteManager
              captures: { del2: $.data.id }
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-06" }
              as: RouteManager
              captures: { del3: $.data.id }
            - call: "POST /deliveries/${del1}/complete"
              payload: { outcome: "DELIVERED" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
            - call: "POST /deliveries/${del2}/complete"
              payload: { outcome: "DELIVERED" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
            - call: "POST /deliveries/${del3}/complete"
              payload: { outcome: "SKIPPED" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
          trigger:
            - call: "GET /clients/${cli_id}/summary"
              payload: {}
              as: ProgramAdmin
              captures: { prov: $.data.provisioned_monthly_units, deliv: $.data.delivered_units }
          assert:
            - "GET summary provisioned_monthly_units == 24"
            - "GET summary delivered_units == 4"
            - "Client.lifetime_oaa_units == 4"
            - "24 != 4 (provisioned vs delivered diverge)"

  # ========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weekly_meal_count_meal_type_branch_min_cap
        grounds:
          - calculations.weekly_meal_count
          - calculations.delivery_meal_count
          - entities.MealPlan.meal_type
        distinguishing_aspect: |
          Mode (a): with identical meals_per_day (2), a FROZEN plan yields
          weekly_meal_count 14 (2*7, one bulk delivery of 14 meals) while a HOT
          plan on 3 delivery_days yields 6 (2*3, each delivery 2 meals) — a
          non-linear branch on meal_type with a min-cap over 3 inputs.
        test_recipe:
          setup:
            - "Two ASSESSED clients each with an ACTIVE route in zone Z1; client F has a FROZEN plan (meals_per_day 2, delivery_days [MON]); client H has a HOT plan (meals_per_day 2, delivery_days [MON,WED,FRI]). Each has one scheduled delivery on a Monday."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Frank Frozen", birth_date: "1949-01-01", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0102" }
              as: IntakeCoordinator
              captures: { cf_id: $.data.id }
            - call: "POST /clients/${cf_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { af_id: $.data.id }
            - call: "POST /assessments/${af_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cf_id}"
              payload: {}
              as: RouteManager
              captures: { cf_v: $.data.version }
            - call: "POST /clients/${cf_id}/meal-plans"
              payload: { assessment_id: "${af_id}", route_id: "${rt_id}", meal_type: "FROZEN", meals_per_day: 2, delivery_days: [MON], expected_client_version: "${cf_v}" }
              as: RouteManager
              captures: { mpf_id: $.data.id, mpf_weekly: $.data.weekly_meal_count }
            - call: "POST /clients/${cf_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mpf_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { delf: $.data.id, delf_count: $.data.meal_count }
            - call: "POST /clients"
              payload: { full_name: "Hank Hot", birth_date: "1948-01-01", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0103" }
              as: IntakeCoordinator
              captures: { ch_id: $.data.id }
            - call: "POST /clients/${ch_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { ah_id: $.data.id }
            - call: "POST /assessments/${ah_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${ch_id}"
              payload: {}
              as: RouteManager
              captures: { ch_v: $.data.version }
            - call: "POST /clients/${ch_id}/meal-plans"
              payload: { assessment_id: "${ah_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${ch_v}" }
              as: RouteManager
              captures: { mph_id: $.data.id, mph_weekly: $.data.weekly_meal_count }
            - call: "POST /clients/${ch_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mph_id}", scheduled_date: "2026-03-09" }
              as: RouteManager
              captures: { delh: $.data.id, delh_count: $.data.meal_count }
          trigger:
            - call: "GET /meal-plans/${mpf_id}"
              payload: {}
              as: RouteManager
            - call: "GET /meal-plans/${mph_id}"
              payload: {}
              as: RouteManager
          assert:
            - "FROZEN MealPlan.weekly_meal_count == 14"
            - "HOT MealPlan.weekly_meal_count == 6"
            - "FROZEN Delivery.meal_count == 14"
            - "HOT Delivery.meal_count == 2"

      - name: suggested_contribution_round_per_meal_then_multiply
        grounds:
          - calculations.suggested_contribution
          - entities.MealPlan.suggested_contribution_per_meal_cents
          - entities.Client.suggested_contribution_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned round-per-meal-then-multiply. For
          TIER_B (factor 0.35, base 725) the per-meal figure rounds to 254 and
          monthly (24 meals) is 6096; multiply-then-round would give 6090. The
          scaffold's pinned order yields exactly 6096.
        test_recipe:
          setup:
            - "ACTIVE client in TIER_B (income 200000, household 1) with an ACTIVE HOT plan (meals_per_day 2, delivery_days [MON,WED,FRI], weekly_meal_count 6, projected 24 monthly meals)."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Bea Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 200000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id, per_meal: $.data.suggested_contribution_per_meal_cents }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "GET /clients/${cli_id}/summary"
              payload: {}
              as: RouteManager
              captures: { monthly: $.data.suggested_contribution_cents }
          assert:
            - "MealPlan.suggested_contribution_per_meal_cents == 254"
            - "GET summary suggested_contribution_cents == 6096"
            - "6096 != 6090 (round-per-meal-then-multiply, not multiply-then-round)"

  # ========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_fork_delivered_vs_no_answer
        grounds:
          - state_machines.Delivery.SCHEDULED_to_DELIVERED
          - state_machines.Delivery.SCHEDULED_to_NO_ANSWER
          - entities.Client.consecutive_no_answer
        distinguishing_aspect: |
          Delivery forks from SCHEDULED into DELIVERED and NO_ANSWER with
          divergent side effects: DELIVERED resets consecutive_no_answer to 0
          and accrues OAA units, whereas NO_ANSWER increments consecutive_no_answer
          and opens a WelfareAlert — a branching machine on the Delivery entity.
        test_recipe:
          setup:
            - "ACTIVE client with ACTIVE HOT plan (meals_per_day 2) and two SCHEDULED deliveries on distinct Mondays."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-09" }
              as: RouteManager
              captures: { del2: $.data.id }
            - call: "POST /deliveries/${del1}/complete"
              payload: { outcome: "NO_ANSWER" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /deliveries/${del2}/complete"
              payload: { outcome: "DELIVERED" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
          assert:
            - "after NO_ANSWER: Delivery.${del1}.status == NO_ANSWER and a WelfareAlert with status OPEN exists for the client (GET /welfare-alerts?client_id returns >= 1)"
            - "after DELIVERED: Delivery.${del2}.status == DELIVERED and Client.consecutive_no_answer == 0 (reset)"
            - "Client.lifetime_oaa_units == 2"

      - name: welfare_alert_branch_ack_escalate_resolve
        grounds:
          - state_machines.WelfareAlert.OPEN_to_ACKNOWLEDGED
          - state_machines.WelfareAlert.ACKNOWLEDGED_to_ESCALATED
          - state_machines.WelfareAlert.ESCALATED_to_RESOLVED
        distinguishing_aspect: |
          WelfareAlert is non-linear on a different entity than Delivery: from
          OPEN it can branch to ACKNOWLEDGED or ESCALATED, and ACKNOWLEDGED can
          itself fork to ESCALATED or RESOLVED — a fork-join lifecycle, not a
          straight pipeline.
        test_recipe:
          setup:
            - "A client with one OPEN WelfareAlert produced by a NO_ANSWER delivery."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
            - call: "POST /deliveries/${del1}/complete"
              payload: { outcome: "NO_ANSWER" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
            - call: "GET /welfare-alerts"
              payload: { client_id: "${cli_id}" }
              as: RouteManager
              captures: { alert_id: "$.data[0].id" }
          trigger:
            - call: "POST /welfare-alerts/${alert_id}/acknowledge"
              payload: {}
              as: RouteManager
            - call: "POST /welfare-alerts/${alert_id}/escalate"
              payload: {}
              as: RouteManager
            - call: "POST /welfare-alerts/${alert_id}/resolve"
              payload: {}
              as: RouteManager
          assert:
            - "WelfareAlert.${alert_id}.status == ACKNOWLEDGED after acknowledge"
            - "WelfareAlert.${alert_id}.status == ESCALATED after escalate"
            - "WelfareAlert.${alert_id}.status == RESOLVED after resolve"

  # ========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: no_answer_delivery_transitive_cascade
        grounds:
          - state_machines.Delivery.SCHEDULED_to_NO_ANSWER
          - entities.WellnessCheck.outcome
          - entities.WelfareAlert.status
          - entities.Client.consecutive_no_answer
        distinguishing_aspect: |
          Depth-3 chain: completing a delivery NO_ANSWER (A) creates a
          WellnessCheck with outcome NO_ANSWER (B); that WellnessCheck increments
          Client.consecutive_no_answer and opens a WelfareAlert (C). Each hop is
          caused by the previous hop, not directly by the complete call.
        test_recipe:
          setup:
            - "ACTIVE client with ACTIVE HOT plan and one SCHEDULED delivery on a Monday; client.consecutive_no_answer == 0."
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
