scenario: |
  1864. Rural Electric Cooperative Member Services (Touchstone Energy co-op): membership & capital credits allocation, retirement of capital credits & unclaimed handling, rate class & seasonal/irrigation load, outage reporting & member communication, right-of-way & member consent, load management/water heater program credits, new service & aid-to-construction, board election & annual meeting

domain_name: rural-electric-cooperative-member-services
api_prefix: /coop

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Cooperative
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the cooperative" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Month (1-12) on which the co-op fiscal year ends; drives allocation/retirement windows" }
      - { name: capital_credits_pool_cents, type: integer, source: computed, description: "Unallocated patronage margin pool available for allocation runs; debited by allocations, credited by year-end margin posting" }
      - { name: retirement_methods_allowed, type: array, source: input, description: "Enum set of retirement methods the board may authorize: FIFO_OLDEST | PRO_RATA_PERCENTAGE" }
      - { name: unclaimed_dormancy_years, type: integer, source: input, description: "Years after which an unclaimed retired capital credit check escheats to the state fund" }
      - { name: annual_meeting_quorum_pct, type: number, source: input, description: "Fraction of ACTIVE members required for annual meeting quorum (e.g. 0.05)" }
      - { name: irrigation_season_start_month, type: integer, source: input, description: "First month of irrigation season (inclusive)" }
      - { name: irrigation_season_end_month, type: integer, source: input, description: "Last month of irrigation season (inclusive)" }
      - { name: active_election_id, type: string, source: computed, description: "FK -> BoardElection.id of the election currently in NOMINATION_OPEN or VOTING_OPEN; null when none" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Member legal name" }
      - { name: member_type, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | IRRIGATION" }
      - { name: status, type: enum, source: system, description: "APPLICANT -> ACTIVE -> SUSPENDED -> TERMINATED; TERMINATED members retain capital credit claims" }
      - { name: joined_at, type: datetime, source: system, description: "Timestamp membership became ACTIVE" }
      - { name: terminated_at, type: datetime, source: system, description: "Timestamp membership terminated; null while non-terminal" }
      - { name: capital_credit_balance_cents, type: integer, source: computed, description: "Outstanding unretired allocated patronage; incremented by allocations, decremented by retirement payouts" }
      - { name: unclaimed_credit_cents, type: integer, source: computed, description: "Retired-but-unclaimed amount still held pending escheatment" }
      - { name: patronage_base_kwh, type: integer, source: computed, description: "Lifetime kWh consumed on non-irrigation rate classes, used as allocation weight base" }
      - { name: patronage_base_irrigation_kwh, type: integer, source: computed, description: "Lifetime kWh consumed on IRRIGATION rate class, allocated at reduced weight" }
      - { name: deposit_cents, type: integer, source: computed, description: "Member deposit held; refunded net of final bill at termination" }
      - { name: district_id, type: integer, source: input, description: "Board district (1-7) the member's primary service location sits in; determines ballot eligibility per seat" }

  - name: ServiceLocation
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: address, type: string, source: input, description: "Service address" }
      - { name: rate_class, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL_GENERAL | COMMERCIAL_DEMAND | IRRIGATION | SEASONAL" }
      - { name: status, type: enum, source: system, description: "PENDING_CONSTRUCTION -> ENERGIZED -> DISCONNECTED -> REMOVED" }
      - { name: energized_at, type: datetime, source: system, description: "Timestamp meter first energized" }
      - { name: seasonal_active, type: boolean, source: computed, description: "True when SEASONAL location is inside its declared active window; gates billing" }
      - { name: irrigation_connected_load_kw, type: number, source: input, description: "Nameplate connected load in kW for IRRIGATION locations; drives demand charge" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique schedule code (e.g. RS-1, GS-D, IR-2)" }
      - { name: rate_class, type: enum, source: input, description: "Rate class this schedule prices" }
      - { name: effective_from, type: datetime, source: input, description: "Start of effectiveness window" }
      - { name: effective_to, type: datetime, source: input, description: "End of effectiveness window; null = open-ended" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> SUPERSEDED" }
      - { name: customer_charge_cents, type: integer, source: input, description: "Fixed monthly customer charge" }
      - { name: tiers, type: array, source: input, description: "Ordered list of {up_to_kwh, cents_per_kwh}; last tier up_to_kwh = null meaning unbounded" }
      - { name: demand_charge_cents_per_kw, type: integer, source: input, description: "Demand charge per billed kW (0 for classes without demand billing)" }
      - { name: irrigation_offseason_discount_pct, type: number, source: input, description: "Percent discount on energy charges for IRRIGATION usage outside irrigation season" }
      - { name: load_management_credit_cents, type: integer, source: input, description: "Monthly bill credit per enrolled load-management device" }

  - name: MeterReading
    parent: ServiceLocation
    common_fields: false
    fields:
      - { name: service_location_id, type: string, source: system, description: "FK -> ServiceLocation.id" }
      - { name: reading_at, type: datetime, source: input, description: "Timestamp the reading was taken" }
      - { name: kwh_register, type: integer, source: input, description: "Cumulative register kWh" }
      - { name: demand_kw, type: number, source: input, description: "Peak demand kW registered since prior reading" }
      - { name: source, type: enum, source: input, description: "AMR | MANUAL | ESTIMATED" }

  - name: Invoice
    parent: ServiceLocation
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: system, description: "FK -> ServiceLocation.id" }
      - { name: billing_period_start, type: datetime, source: input, description: "Inclusive start of billing period" }
      - { name: billing_period_end, type: datetime, source: input, description: "Exclusive end of billing period" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINALIZED -> PAID | WRITTEN_OFF; also VOID" }
      - { name: kwh_billed, type: integer, source: computed, description: "kWh consumed in period, from register delta" }
      - { name: demand_kw_billed, type: number, source: computed, description: "Billing demand kW after rate-class rules (e.g. irrigation minimum)" }
      - { name: energy_charge_cents, type: integer, source: computed, description: "Tiered energy charge per rate schedule" }
      - { name: demand_charge_cents, type: integer, source: computed, description: "Demand charge component" }
      - { name: load_management_credit_cents, type: integer, source: computed, description: "Sum of load-management device credits applied" }
      - { name: total_due_cents, type: integer, source: computed, description: "customer_charge + energy + demand - credits; floor at 0" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL (prorated estimate) or FINAL (register-true) flavor of the same bill" }

  - name: CapitalCreditAllocation
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id, type: string, source: system, description: "FK -> Cooperative.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year being allocated" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> POSTED | VOIDED" }
      - { name: total_allocated_cents, type: integer, source: computed, description: "Sum across member lines; must equal allocation pool at approval" }
      - { name: method, type: enum, source: input, description: "PATRONAGE_WEIGHTED (kWh-weighted) | FLAT_PER_MEMBER" }

  - name: CapitalCreditAllocationLine
    parent: CapitalCreditAllocation
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: system, description: "FK -> CapitalCreditAllocation.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: allocated_cents, type: integer, source: computed, description: "This member's share for the year" }
      - { name: weight_kwh_effective, type: number, source: computed, description: "patronage_base_kwh + IRRIGATION_WEIGHT_FACTOR * patronage_base_irrigation_kwh for the year" }

  - name: CapitalCreditRetirement
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id, type: string, source: system, description: "FK -> Cooperative.id" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> BOARD_APPROVED -> EXECUTING -> SETTLED | ABORTED" }
      - { name: method, type: enum, source: input, description: "FIFO_OLDEST | PRO_RATA_PERCENTAGE; must be in Cooperative.retirement_methods_allowed" }
      - { name: total_retire_cents, type: integer, source: input, description: "Target total retirement amount" }
      - { name: pro_rata_pct, type: number, source: input, description: "Required when method=PRO_RATA_PERCENTAGE; fraction of each member's balance to retire" }
      - { name: executed_at, type: datetime, source: system, description: "When the run executed" }
      - { name: total_disbursed_cents, type: integer, source: computed, description: "Sum actually disbursed across payout lines" }

  - name: CapitalCreditPayout
    parent: CapitalCreditRetirement
    common_fields: true
    fields:
      - { name: retirement_id, type: string, source: system, description: "FK -> CapitalCreditRetirement.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: payout_cents, type: integer, source: computed, description: "Amount this member is paid in this run" }
      - { name: status, type: enum, source: system, description: "PENDING -> ISSUED -> CASHED | UNCLAIMED -> ESCHEATED" }
      - { name: issued_at, type: datetime, source: system, description: "Check issuance timestamp" }
      - { name: claim_deadline, type: datetime, source: computed, description: "issued_at + Cooperative.unclaimed_dormancy_years; after this, UNCLAIMED -> ESCHEATED" }

  - name: OutageReport
    parent: ServiceLocation
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: system, description: "FK -> ServiceLocation.id reporting the outage" }
      - { name: reported_by_member_id, type: string, source: system, description: "FK -> Member.id who reported" }
      - { name: status, type: enum, source: system, description: "REPORTED -> ACKNOWLEDGED -> CREW_DISPATCHED -> RESTORED | DUPLICATE | CANCELLED" }
      - { name: cause, type: enum, source: input, description: "WEATHER | EQUIPMENT | VEGETATION | ANIMAL | UNKNOWN" }
      - { name: parent_outage_id, type: string, source: input, description: "FK -> OutageReport.id; set when this report is folded into an upstream event (self-referential)" }
      - { name: restored_at, type: datetime, source: system, description: "When power restored" }
      - { name: notified_member_count, type: integer, source: computed, description: "Count of members notified about this outage event" }

  - name: RightOfWayAgreement
    parent: ServiceLocation
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: system, description: "FK -> ServiceLocation.id" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> MEMBER_CONSENTED -> RECORDED | CONTESTED -> CONDEMNATION | RELEASED" }
      - { name: easement_width_ft, type: number, source: input, description: "Requested easement width" }
      - { name: consented_at, type: datetime, source: system, description: "When member consented" }
      - { name: recorded_at, type: datetime, source: system, description: "When recorded with county" }

  - name: LoadManagementDevice
    parent: ServiceLocation
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: system, description: "FK -> ServiceLocation.id" }
      - { name: device_type, type: enum, source: input, description: "WATER_HEATER | IRRIGATION_INTERRUPTIBLE | AC_CYCLER" }
      - { name: status, type: enum, source: system, description: "ENROLLED -> ACTIVE -> SUSPENDED -> UNENROLLED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Enrollment timestamp" }
      - { name: monthly_credit_cents, type: integer, source: computed, description: "Credit per month while ACTIVE, from the location's current RateSchedule.load_management_credit_cents" }

  - name: ServiceOrder
    parent: ServiceLocation
    common_fields: true
    fields:
      - { name: service_location_id, type: string, source: system, description: "FK -> ServiceLocation.id the new service is for" }
      - { name: order_type, type: enum, source: input, description: "NEW_SERVICE | UPGRADE | RELOCATION | TEMPORARY" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ESTIMATED -> ATC_INVOICED -> PAID -> SCHEDULED -> CONSTRUCTED -> ENERGIZED | CANCELLED" }
      - { name: distance_ft, type: number, source: input, description: "Line extension distance in feet" }
      - { name: requires_road_bore, type: boolean, source: input, description: "Whether a road bore is needed" }
      - { name: aid_to_construction_cents, type: integer, source: computed, description: "Member contribution toward construction per multi-factor formula" }
      - { name: row_agreement_id, type: string, source: computed, description: "FK -> RightOfWayAgreement.id created for this order; gates scheduling" }

  - name: BoardElection
    parent: Cooperative
    common_fields: true
    fields:
      - { name: cooperative_id, type: string, source: system, description: "FK -> Cooperative.id" }
      - { name: year, type: integer, source: input, description: "Election year" }
      - { name: status, type: enum, source: system, description: "DRAFT -> NOMINATION_OPEN -> NOMINATION_CLOSED -> VOTING_OPEN -> VOTING_CLOSED -> CERTIFIED | VOIDED" }
      - { name: seats, type: array, source: input, description: "List of district integers contested this year" }
      - { name: voting_opens_at, type: datetime, source: input, description: "When voting opens" }
      - { name: voting_closes_at, type: datetime, source: input, description: "When voting closes" }
      - { name: quorum_met, type: boolean, source: computed, description: "Whether cast-ballot count >= quorum_pct * ACTIVE member count at VOTING_OPEN" }

  - name: Ballot
    parent: BoardElection
    common_fields: false
    fields:
      - { name: election_id, type: string, source: system, description: "FK -> BoardElection.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id casting the ballot" }
      - { name: district, type: integer, source: input, description: "District seat voted on" }
      - { name: candidate_name, type: string, source: input, description: "Candidate selected" }
      - { name: cast_at, type: datetime, source: system, description: "When cast; must be within voting window" }
      - { name: is_proxy, type: boolean, source: input, description: "True when cast by proxy at annual meeting" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /coop/members/{id}/activate"
        actor: MemberServicesRep
        preconditions:
          - "Member has at least one ServiceLocation in PENDING_CONSTRUCTION or ENERGIZED"
        side_effects:
          - "joined_at stamped"
          - "Member.version increments"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /coop/members/{id}/suspend"
        actor: MemberServicesRep
        preconditions:
          - "No Invoice in PROVISIONAL status for any of the member's ServiceLocations (ERR_MEMBER_PROVISIONAL_INVOICE)"
        side_effects:
          - "All member's LoadManagementDevice in ENROLLED or ACTIVE -> SUSPENDED (cascade)"
          - "OutageReport in REPORTED/ACKNOWLEDGED/CREW_DISPATCHED for member's locations remain but new reports blocked"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /coop/members/{id}/reinstate"
        actor: MemberServicesRep
        preconditions:
          - "All FINALIZED invoices for member's locations are PAID (ERR_MEMBER_PAST_DUE)"
        side_effects:
          - "LoadManagementDevice in SUSPENDED -> ACTIVE (cascade, restores credit eligibility)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /coop/members/{id}/terminate"
        actor: MemberServicesRep
        preconditions:
          - "No Invoice in PROVISIONAL or FINALIZED-unpaid status (ERR_MEMBER_UNPAID_FINAL)"
        side_effects:
          - "terminated_at stamped"
          - "All ServiceLocation ENERGIZED -> DISCONNECTED"
          - "All LoadManagementDevice in ENROLLED/ACTIVE/SUSPENDED -> UNENROLLED"
          - "capital_credit_balance_cents stays on the books (claims survive termination)"
          - "Any CapitalCreditPayout for this member in ISSUED -> UNCLAIMED (member unreachable; escheat clock runs from the payout's existing claim_deadline)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /coop/members/{id}/terminate"
        actor: MemberServicesRep
        preconditions:
          - "All FINALIZED invoices PAID or WRITTEN_OFF"
        side_effects:
          - "Same cascade as ACTIVE->TERMINATED"

  - entity: ServiceLocation
    initial_state: PENDING_CONSTRUCTION
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING_CONSTRUCTION
        to: ENERGIZED
        trigger: "POST /coop/service-locations/{id}/energize"
        actor: FieldOpsCoordinator
        preconditions:
          - "A ServiceOrder for this location is in CONSTRUCTED status (ERR_SERVICE_NOT_CONSTRUCTED)"
          - "RightOfWayAgreement for this location is RECORDED (ERR_ROW_NOT_RECORDED)"
        side_effects:
          - "energized_at stamped"
          - "ServiceOrder CONSTRUCTED -> ENERGIZED (cascade up)"

      - from: ENERGIZED
        to: DISCONNECTED
        trigger: "POST /coop/service-locations/{id}/disconnect"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "LoadManagementDevice ENROLLED/ACTIVE -> SUSPENDED"

      - from: DISCONNECTED
        to: ENERGIZED
        trigger: "POST /coop/service-locations/{id}/energize"
        actor: FieldOpsCoordinator
        preconditions:
          - "Member status == ACTIVE"
        side_effects: []

      - from: DISCONNECTED
        to: REMOVED
        trigger: "POST /coop/service-locations/{id}/remove"
        actor: FieldOpsCoordinator
        preconditions:
          - "Member status == TERMINATED"
        side_effects: []

  - entity: RateSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /coop/rate-schedules/{id}/publish"
        actor: RateAnalyst
        preconditions:
          - "No other PUBLISHED RateSchedule for same rate_class whose [effective_from, effective_to) overlaps this one's (ERR_RATE_OVERLAP)"
        side_effects: []

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /coop/rate-schedules/{id}/supersede"
        actor: RateAnalyst
        preconditions:
          - "Request body replacement_id names a DRAFT RateSchedule for the same rate_class (ERR_INVALID_STATE otherwise)"
          - "replacement.effective_from <= this.effective_from (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "Replacement schedule transitions DRAFT -> PUBLISHED atomically (its overlap check against other PUBLISHED schedules excludes the one being superseded)"
          - "Invoices in PROVISIONAL for affected locations are recomputed against the new schedule (derived-field reconciliation)"

  - entity: Invoice
    initial_state: PROVISIONAL
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /coop/invoices/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "ServiceLocation has a MeterReading with reading_at >= billing_period_end (ERR_READING_MISSING)"
        side_effects:
          - "variant flips PROVISIONAL -> FINAL; charges recomputed with final register delta"
          - "Member.patronage_base_kwh or patronage_base_irrigation_kwh incremented by kwh_billed depending on rate_class"

      - from: FINALIZED
        to: PAID
        trigger: "POST /coop/invoices/{id}/pay"
        actor: BillingClerk
        preconditions: []
        side_effects: []

      - from: FINALIZED
        to: WRITTEN_OFF
        trigger: "POST /coop/invoices/{id}/write-off"
        actor: BillingClerk
        preconditions:
          - "billing_period_end is more than 180 days in the past (ERR_WRITE_OFF_TOO_EARLY)"
        side_effects:
          - "kwh_billed backed out of Member.patronage_base_* (compensating entry)"

      - from: PROVISIONAL
        to: VOID
        trigger: "POST /coop/invoices/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects: []

  - entity: CapitalCreditAllocation
    initial_state: DRAFT
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /coop/capital-credit-allocations/{id}/approve"
        actor: BoardDirector
        preconditions:
          - "total_allocated_cents == Cooperative.capital_credits_pool_cents (ERR_ALLOCATION_POOL_MISMATCH)"
          - "BoardDirector approving is not the same X-User-ID as the MemberServicesRep who created the DRAFT (segregation of duties, ERR_SOD_VIOLATION)"
        side_effects: []

      - from: APPROVED
        to: POSTED
        trigger: "POST /coop/capital-credit-allocations/{id}/post"
        actor: MemberServicesRep
        preconditions: []
        side_effects:
          - "Each CapitalCreditAllocationLine.allocated_cents credited to Member.capital_credit_balance_cents"
          - "Cooperative.capital_credits_pool_cents debited to zero for that fiscal year"
          - "Member.version increments for each affected member"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /coop/capital-credit-allocations/{id}/void"
        actor: MemberServicesRep
        preconditions: []
        side_effects: []

  - entity: CapitalCreditRetirement
    initial_state: PROPOSED
    terminal_states: [SETTLED, ABORTED]
    transitions:
      - from: PROPOSED
        to: BOARD_APPROVED
        trigger: "POST /coop/capital-credit-retirements/{id}/board-approve"
        actor: BoardDirector
        preconditions:
          - "method is in Cooperative.retirement_methods_allowed (ERR_RETIREMENT_METHOD_NOT_ALLOWED)"
          - "method == PRO_RATA_PERCENTAGE requires 0 < pro_rata_pct <= 1"
          - "BoardDirector approving is not the same X-User-ID as the MemberServicesRep who proposed (ERR_SOD_VIOLATION)"
        side_effects: []

      - from: BOARD_APPROVED
        to: EXECUTING
        trigger: "POST /coop/capital-credit-retirements/{id}/execute"
        actor: MemberServicesRep
        preconditions:
          - "OCC: expected_cooperative_version matches Cooperative.version (ERR_STALE_VERSION)"
          - "total_retire_cents <= sum of capital_credit_balance_cents over all Members (ERR_RETIREMENT_BUDGET_EXCEEDED)"
        side_effects:
          - "CapitalCreditPayout rows created per method (FIFO_OLDEST walks members by oldest allocation vintage; PRO_RATA_PERCENTAGE pays pro_rata_pct of each member's balance)"
          - "executed_at stamped"
          - "Cooperative.version increments"

      - from: EXECUTING
        to: SETTLED
        trigger: "system: when every CapitalCreditPayout of the run reaches CASHED, UNCLAIMED, or ESCHEATED"
        actor: system
        preconditions: []
        side_effects:
          - "total_disbursed_cents finalized"

      - from: PROPOSED
        to: ABORTED
        trigger: "POST /coop/capital-credit-retirements/{id}/abort"
        actor: MemberServicesRep
        preconditions: []
        side_effects: []

      - from: BOARD_APPROVED
        to: ABORTED
        trigger: "POST /coop/capital-credit-retirements/{id}/abort"
        actor: MemberServicesRep
        preconditions: []
        side_effects: []

  - entity: CapitalCreditPayout
    initial_state: PENDING
    terminal_states: [CASHED, ESCHEATED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "system: on retirement execute"
        actor: system
        preconditions: []
        side_effects:
          - "issued_at stamped"
          - "claim_deadline = issued_at + Cooperative.unclaimed_dormancy_years"

      - from: ISSUED
        to: CASHED
        trigger: "POST /coop/capital-credit-payouts/{id}/cash"
        actor: MemberServicesRep
        preconditions:
          - "logical clock < claim_deadline (ERR_PAYOUT_STALE)"
        side_effects:
          - "Member.capital_credit_balance_cents decremented by payout_cents"

      - from: ISSUED
        to: UNCLAIMED
        trigger: "POST /coop/capital-credit-payouts/{id}/mark-unclaimed"
        actor: MemberServicesRep
        preconditions: []
        side_effects:
          - "Member.unclaimed_credit_cents incremented by payout_cents"
          - "Member.capital_credit_balance_cents decremented by payout_cents"

      - from: UNCLAIMED
        to: ESCHEATED
        trigger: "system: logical clock >= claim_deadline"
        actor: system
        preconditions: []
        side_effects:
          - "Member.unclaimed_credit_cents decremented"
          - "Escheat ledger entry (audit)"

  - entity: OutageReport
    initial_state: REPORTED
    terminal_states: [RESTORED, DUPLICATE, CANCELLED]
    transitions:
      - from: REPORTED
        to: ACKNOWLEDGED
        trigger: "POST /coop/outage-reports/{id}/acknowledge"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Member communication entry logged (notified_member_count +1 for reporting member)"

      - from: ACKNOWLEDGED
        to: CREW_DISPATCHED
        trigger: "POST /coop/outage-reports/{id}/dispatch"
        actor: Dispatcher
        preconditions: []
        side_effects: []

      - from: CREW_DISPATCHED
        to: RESTORED
        trigger: "POST /coop/outage-reports/{id}/restore"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "restored_at stamped"
          - "All DUPLICATE OutageReports with parent_outage_id == this id also -> RESTORED (cascade)"
          - "notified_member_count recomputed across parent+duplicates"

      - from: REPORTED
        to: DUPLICATE
        trigger: "POST /coop/outage-reports/{id}/mark-duplicate"
        actor: Dispatcher
        preconditions:
          - "parent_outage_id references an OutageReport in REPORTED, ACKNOWLEDGED, or CREW_DISPATCHED (ERR_PARENT_OUTAGE_TERMINAL)"
        side_effects:
          - "parent's notified_member_count +1"

      - from: REPORTED
        to: CANCELLED
        trigger: "POST /coop/outage-reports/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: []

  - entity: RightOfWayAgreement
    initial_state: REQUESTED
    terminal_states: [RECORDED, CONDEMNATION, RELEASED]
    transitions:
      - from: REQUESTED
        to: MEMBER_CONSENTED
        trigger: "POST /coop/right-of-way-agreements/{id}/consent"
        actor: Member
        preconditions:
          - "Acting Member owns the ServiceLocation (ERR_FORBIDDEN)"
          - "Member status == ACTIVE"
        side_effects:
          - "consented_at stamped"

      - from: MEMBER_CONSENTED
        to: RECORDED
        trigger: "POST /coop/right-of-way-agreements/{id}/record"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "recorded_at stamped"

      - from: REQUESTED
        to: CONTESTED
        trigger: "POST /coop/right-of-way-agreements/{id}/contest"
        actor: Member
        preconditions:
          - "Acting Member owns the ServiceLocation"
        side_effects: []

      - from: CONTESTED
        to: MEMBER_CONSENTED
        trigger: "POST /coop/right-of-way-agreements/{id}/consent"
        actor: Member
        preconditions:
          - "Acting Member owns the ServiceLocation"
        side_effects:
          - "consented_at stamped"

      - from: CONTESTED
        to: CONDEMNATION
        trigger: "POST /coop/right-of-way-agreements/{id}/condemn"
        actor: LegalCounsel
        preconditions: []
        side_effects: []

      - from: MEMBER_CONSENTED
        to: RELEASED
        trigger: "POST /coop/right-of-way-agreements/{id}/release"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects: []

  - entity: LoadManagementDevice
    initial_state: ENROLLED
    terminal_states: [UNENROLLED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /coop/load-management-devices/{id}/activate"
        actor: FieldOpsCoordinator
        preconditions:
          - "ServiceLocation status == ENERGIZED"
          - "device_type == IRRIGATION_INTERRUPTIBLE requires ServiceLocation.rate_class == IRRIGATION (ERR_LMD_RATE_CLASS_MISMATCH)"
        side_effects:
          - "monthly_credit_cents snapshotted from current PUBLISHED RateSchedule for the location's rate_class"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /coop/load-management-devices/{id}/suspend OR cascade from Member suspend / location disconnect"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "Credits stop accruing from suspension date"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /coop/load-management-devices/{id}/reactivate"
        actor: FieldOpsCoordinator
        preconditions:
          - "Member status == ACTIVE AND ServiceLocation status == ENERGIZED"
        side_effects: []

      - from: ENROLLED
        to: UNENROLLED
        trigger: "POST /coop/load-management-devices/{id}/unenroll"
        actor: Member
        preconditions:
          - "Acting Member owns the ServiceLocation"
        side_effects: []

      - from: ACTIVE
        to: UNENROLLED
        trigger: "POST /coop/load-management-devices/{id}/unenroll"
        actor: Member
        preconditions:
          - "Acting Member owns the ServiceLocation"
        side_effects:
          - "Final prorated credit applied to next invoice"

  - entity: ServiceOrder
    initial_state: DRAFT
    terminal_states: [ENERGIZED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ESTIMATED
        trigger: "POST /coop/service-orders/{id}/estimate"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "aid_to_construction_cents computed via aid_to_construction_estimate calculation"
          - "RightOfWayAgreement row auto-created in REQUESTED if none exists for the location"

      - from: ESTIMATED
        to: ATC_INVOICED
        trigger: "POST /coop/service-orders/{id}/invoice-atc"
        actor: MemberServicesRep
        preconditions:
          - "aid_to_construction_cents > 0 (ERR_ATC_ZERO_NOT_INVOICABLE; zero-ATC orders skip to PAID)"
        side_effects: []

      - from: ESTIMATED
        to: PAID
        trigger: "POST /coop/service-orders/{id}/mark-paid"
        actor: MemberServicesRep
        preconditions:
          - "aid_to_construction_cents == 0"
        side_effects: []

      - from: ATC_INVOICED
        to: PAID
        trigger: "POST /coop/service-orders/{id}/mark-paid"
        actor: MemberServicesRep
        preconditions: []
        side_effects: []

      - from: PAID
        to: SCHEDULED
        trigger: "POST /coop/service-orders/{id}/schedule"
        actor: FieldOpsCoordinator
        preconditions:
          - "RightOfWayAgreement for the location is RECORDED or CONDEMNATION (ERR_ROW_NOT_RECORDED)"
        side_effects: []

      - from: SCHEDULED
        to: CONSTRUCTED
        trigger: "POST /coop/service-orders/{id}/construct"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects: []

      - from: CONSTRUCTED
        to: ENERGIZED
        trigger: "system: cascade from ServiceLocation energize"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /coop/service-orders/{id}/cancel"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "Auto-created RightOfWayAgreement still in REQUESTED -> RELEASED"

      - from: ESTIMATED
        to: CANCELLED
        trigger: "POST /coop/service-orders/{id}/cancel"
        actor: FieldOpsCoordinator
        preconditions: []
        side_effects:
          - "Auto-created RightOfWayAgreement still in REQUESTED -> RELEASED"

  - entity: BoardElection
    initial_state: DRAFT
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: NOMINATION_OPEN
        trigger: "POST /coop/board-elections/{id}/open-nominations"
        actor: BoardSecretary
        preconditions: []
        side_effects:
          - "Cooperative.active_election_id set"

      - from: NOMINATION_OPEN
        to: NOMINATION_CLOSED
        trigger: "POST /coop/board-elections/{id}/close-nominations"
        actor: BoardSecretary
        preconditions:
          - "Each seat in seats has >= 1 declared candidate (ERR_ELECTION_NO_CANDIDATE)"
        side_effects: []

      - from: NOMINATION_CLOSED
        to: VOTING_OPEN
        trigger: "POST /coop/board-elections/{id}/open-voting"
        actor: BoardSecretary
        preconditions:
          - "logical clock >= voting_opens_at (ERR_ELECTION_WINDOW)"
        side_effects:
          - "quorum_met initialized false"

      - from: VOTING_OPEN
        to: VOTING_CLOSED
        trigger: "POST /coop/board-elections/{id}/close-voting"
        actor: BoardSecretary
        preconditions:
          - "logical clock >= voting_closes_at (ERR_ELECTION_WINDOW)"
        side_effects:
          - "quorum_met recomputed: count(distinct Ballot.member_id) >= ceil(annual_meeting_quorum_pct * count(Member in ACTIVE))"

      - from: VOTING_CLOSED
        to: CERTIFIED
        trigger: "POST /coop/board-elections/{id}/certify"
        actor: BoardSecretary
        preconditions:
          - "quorum_met == true (ERR_ELECTION_NO_QUORUM)"
        side_effects:
          - "Cooperative.active_election_id cleared"

      - from: VOTING_CLOSED
        to: VOIDED
        trigger: "POST /coop/board-elections/{id}/void"
        actor: BoardSecretary
        preconditions: []
        side_effects:
          - "Cooperative.active_election_id cleared"

  - entity: Ballot
    initial_state: CAST
    terminal_states: [CAST]
    transitions: []
    note: "Ballot is an append-only event (common_fields: false). One ballot per (election_id, member_id, district) — duplicate casts rejected with ERR_BALLOT_ALREADY_CAST. Casting is only valid while election is VOTING_OPEN and logical clock is within [voting_opens_at, voting_closes_at) (ERR_ELECTION_WINDOW otherwise). Member must be ACTIVE (ERR_BALLOT_MEMBER_INACTIVE otherwise) and member.district_id must equal ballot.district for non-proxy ballots (ERR_BALLOT_DISTRICT_MISMATCH otherwise); proxy ballots may be cast for any district but flag is_proxy=true."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: retirement-execute-stale-coop
    parent_entity: Cooperative
    write_endpoint: "POST /coop/capital-credit-retirements/{id}/execute"
    occ_field: expected_cooperative_version
    description: |
      Executing a retirement run against a Cooperative whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just executed or configured something that legitimately
      changes the co-op fiscal posture (e.g. an allocation POSTED, which zeroes
      the pool), and the current writer's view of the co-op is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: election-transition-stale-coop
    parent_entity: Cooperative
    write_endpoint: "POST /coop/board-elections/{id}/open-voting"
    occ_field: expected_cooperative_version
    description: |
      Opening voting against a Cooperative whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just flipped Cooperative.active_election_id to a different
      election (a legitimate supersede under the one-active-election rule), so
      the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-post-stale-coop
    parent_entity: Cooperative
    write_endpoint: "POST /coop/capital-credit-allocations/{id}/post"
    occ_field: expected_cooperative_version
    description: |
      Posting an allocation against a Cooperative whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just posted a different allocation that zeroed
      the same fiscal-year pool, so the current writer's pool view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_energy_charge
    trigger: "invoice finalize; also provisional invoice generation"
    algorithm: tiered_pricing
    formula: |
      Walk tiers in order; remaining = kwh_billed.
      For each tier: take_kwh = min(remaining, tier.up_to_kwh - prev_bound) (unbounded last tier).
      line_cents = take_kwh * tier.cents_per_kwh.
      Accumulate sum_line_cents.
      If rate_class == IRRIGATION and billing_period month outside
      [irrigation_season_start_month, irrigation_season_end_month]:
        sum_line_cents *= (1 - irrigation_offseason_discount_pct).
      Round each line to cents HALF_UP first, then sum (pinned rounding order).
    input_set: "kwh_billed on this invoice; RateSchedule PUBLISHED and effective at billing_period_start for the location's rate_class; Cooperative irrigation season months"
    constants:
      ROUNDING: "per-line HALF_UP then sum"
    precision: "integer cents, round_half_up per tier line"

  - name: billing_demand
    trigger: "invoice finalize"
    algorithm: threshold
    formula: |
      demand_kw_billed = max(demand_kw from readings in period,
                             IRRIGATION_MIN_BILLING_KW if rate_class == IRRIGATION)
      COMMERCIAL_DEMAND ratchet: demand_kw_billed = max(period peak,
        RATCHET_PCT * max demand_kw_billed over prior 11 months).
    input_set: "MeterReading rows for location with reading_at in [billing_period_start, billing_period_end); prior 11 FINALIZED invoices for ratchet"
    constants:
      IRRIGATION_MIN_BILLING_KW: 5.0
      RATCHET_PCT: 0.85
    precision: "0.01 kW"

  - name: capital_credit_allocation_shares
    trigger: "allocation approve (validates pool match); allocation post (credits members)"
    algorithm: waterfall_allocation
    formula: |
      For method == PATRONAGE_WEIGHTED:
        weight_m = member.patronage_base_kwh + IRRIGATION_WEIGHT_FACTOR * member.patronage_base_irrigation_kwh
        total_weight = sum(weight_m over members ACTIVE at any point during fiscal_year)
        raw_share_m = pool_cents * weight_m / total_weight
        Floor each raw_share_m to integer cents; distribute remainder cents
        one cent at a time to members sorted by (raw_share_m - floor(raw_share_m)) DESC,
        tie-break Member.created_at ASC, until remainder exhausted.
      For method == FLAT_PER_MEMBER:
        share_m = floor(pool_cents / eligible_member_count); remainder distributed
        one cent at a time by Member.created_at ASC.
    input_set: "Members with status ACTIVE or TERMINATED who had >=1 kwh billed during fiscal_year; a FINALIZED invoice's kwh is attributed to the fiscal year containing its billing_period_end (fiscal year N ends on the last day of month fiscal_year_end_month of calendar year N); Cooperative.capital_credits_pool_cents"
    constants:
      IRRIGATION_WEIGHT_FACTOR: 0.5
    precision: "integer cents, floor with deterministic remainder distribution"
    variants:
      - name: patronage_weighted
        when: "method == PATRONAGE_WEIGHTED"
        difference: "share proportional to effective kWh weight"
      - name: flat_per_member
        when: "method == FLAT_PER_MEMBER"
        difference: "equal share per eligible member regardless of usage"

  - name: retirement_payout_amounts
    trigger: "retirement execute"
    algorithm: waterfall_allocation
    formula: |
      FIFO_OLDEST: walk members in order of their oldest unretired allocation
      vintage (earliest CapitalCreditAllocation.fiscal_year with remaining balance,
      tie-break Member.created_at ASC); pay up to each member's full balance until
      total_retire_cents exhausted. Partial payment of the last member allowed;
      remainder below 1 cent is dropped.
      PRO_RATA_PERCENTAGE: each member with balance > 0 is paid
      floor(pro_rata_pct * member.capital_credit_balance_cents); if the resulting
      total exceeds total_retire_cents, scale each payout by
      total_retire_cents / computed_total and floor again; dropped cents remain
      in member balances.
    input_set: "Members with capital_credit_balance_cents > 0 at execute time"
    precision: "integer cents, floor"
    variants:
      - name: fifo_oldest
        when: "method == FIFO_OLDEST"
        difference: "pays oldest-vintage members in full before touching newer ones"
      - name: pro_rata_percentage
        when: "method == PRO_RATA_PERCENTAGE"
        difference: "pays every member the same fraction of balance"

  - name: aid_to_construction_estimate
    trigger: "service order estimate"
    algorithm: constraint_propagation
    formula: |
      base_cents = LINE_EXTENSION_CENTS_PER_FT * distance_ft
      if requires_road_bore: base_cents += ROAD_BORE_FLAT_CENTS
      if order_type == TEMPORARY: base_cents = max(base_cents, TEMPORARY_MIN_CENTS)
      allowance_cents = FREE_ALLOWANCE_FT * LINE_EXTENSION_CENTS_PER_FT
      atc = max(0, base_cents - allowance_cents)
      Apply NONLINEAR overhead: if base_cents - allowance_cents > OVERHEAD_THRESHOLD_CENTS,
        atc += OVERHEAD_PCT * (base_cents - allowance_cents - OVERHEAD_THRESHOLD_CENTS)
      Round final atc to cents HALF_UP.
    input_set: "distance_ft, requires_road_bore, order_type from the ServiceOrder"
    constants:
      LINE_EXTENSION_CENTS_PER_FT: 1200
      ROAD_BORE_FLAT_CENTS: 150000
      TEMPORARY_MIN_CENTS: 50000
      FREE_ALLOWANCE_FT: 250
      OVERHEAD_THRESHOLD_CENTS: 200000
      OVERHEAD_PCT: 0.10
    precision: "integer cents, round_half_up"

  - name: load_management_credit_accrual
    trigger: "invoice generation for location with ACTIVE LoadManagementDevice"
    algorithm: aggregation
    formula: |
      monthly_credit_cents per ACTIVE device = RateSchedule.load_management_credit_cents
      for the location's rate_class effective at billing_period_start.
      Invoice.load_management_credit_cents = sum over devices ACTIVE for the
      full billing period. Devices transitioning mid-period earn prorated credit:
      floor(monthly_credit_cents * active_days_in_period / days_in_period).
    input_set: "LoadManagementDevice rows for the location with status transitions intersecting the billing period"
    precision: "integer cents, floor proration"

  - name: quorum_check
    trigger: "election close-voting"
    algorithm: aggregation
    formula: |
      quorum_met = count(distinct Ballot.member_id where election_id == this)
        >= ceil(Cooperative.annual_meeting_quorum_pct * count(Member status == ACTIVE at close))
    input_set: "Ballot rows for the election; Member rows ACTIVE at logical clock of close-voting"
    precision: "integer member count"

  - name: provisional_vs_final_invoice_delta
    trigger: "invoice finalize (recompute from PROVISIONAL estimate to FINAL register-true)"
    algorithm: forward_looking
    formula: |
      PROVISIONAL invoice (variant=PROVISIONAL): kwh_billed is estimated from
      the average daily kwh of the prior 3 FINALIZED invoices prorated to the
      period length; demand estimated as max of prior 3.
      FINAL invoice (variant=FINAL): kwh_billed = current register kwh - prior
      register kwh; demand = actual period max.
      On finalize, the invoice is recomputed with FINAL inputs; the delta vs the
      provisional estimate is what the member actually owes.
    input_set: "MeterReading register values; prior 3 FINALIZED invoices"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "invoice created before period-end reading exists"
        difference: "estimate-based; forward-looking projection"
      - name: final
        when: "invoice finalized with real register data"
        difference: "register-true; chronological delta"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_referential, check: "Entity-backed role ownership: Member may only act on own resources (member_id / service location owner)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "member-scoped endpoints" }
  - { priority: 5, category: state, check: "Target resource is in a valid from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 6, category: business_safety, check: "Segregation of duties: actor X-User-ID differs from the prior step's actor on allocation approve / retirement board-approve", error_id: ERR_SOD_VIOLATION, http_status: 409, applies_to: "approve/board-approve endpoints" }
  - { priority: 7, category: business_temporal, check: "Logical clock is inside required windows (election voting window, write-off age, claim deadline)", error_id: ERR_ELECTION_WINDOW, http_status: 409, applies_to: "election/invoice/payout temporal endpoints" }
  - { priority: 8, category: business_constraint, check: "Structural rules (rate overlap, ballot uniqueness/district/eligibility, rate-class gating, ROW recorded, service constructed)", error_id: "ERR_RATE_OVERLAP | ERR_BALLOT_ALREADY_CAST | ERR_BALLOT_DISTRICT_MISMATCH | ERR_BALLOT_MEMBER_INACTIVE | ERR_LMD_RATE_CLASS_MISMATCH | ERR_ROW_NOT_RECORDED | ERR_SERVICE_NOT_CONSTRUCTED", http_status: 409, applies_to: "various" }
  - { priority: 9, category: business_fiscal, check: "Pool and balance arithmetic (allocation pool match, retirement budget sufficiency, OCC version)", error_id: "ERR_ALLOCATION_POOL_MISMATCH | ERR_RETIREMENT_BUDGET_EXCEEDED | ERR_STALE_VERSION", http_status: 409, applies_to: "fiscal endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - { method: POST, path: "/coop/_clock/set_current_utc", description: "Set the server's logical clock. Before any call, the clock defaults to exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["system transition UNCLAIMED -> ESCHEATED fires for every CapitalCreditPayout whose claim_deadline is at or before the new clock value; ISSUED payouts are NOT auto-transitioned"] }

  # --- Cooperative ---
  - { method: POST, path: "/coop/cooperatives", description: "Create the cooperative config", roles: [PlatformAdmin], code: 201, input: [name, fiscal_year_end_month, retirement_methods_allowed, unclaimed_dormancy_years, annual_meeting_quorum_pct, irrigation_season_start_month, irrigation_season_end_month], output: Cooperative, side_effects: [] }
  - { method: GET, path: "/coop/cooperatives/{id}", description: "Get cooperative", roles: [PlatformAdmin, MemberServicesRep, BoardDirector, BoardSecretary, RateAnalyst, BillingClerk, FieldOpsCoordinator, Dispatcher, LegalCounsel], code: 200, input: [], output: Cooperative, side_effects: [] }
  - { method: GET, path: "/coop/cooperatives", description: "List cooperatives, optionally filtered by active election", roles: [PlatformAdmin, MemberServicesRep, BoardDirector, BoardSecretary], code: 200, input: ["active_election_id?", "limit?", "offset?"], output: "Cooperative[]", side_effects: [] }
  - { method: POST, path: "/coop/cooperatives/{id}/post-margin", description: "Post year-end patronage margin into the allocation pool", roles: [MemberServicesRep], code: 200, input: [fiscal_year, margin_cents], output: Cooperative, side_effects: ["capital_credits_pool_cents += margin_cents", "Cooperative.version increments"] }

  # --- Member ---
  - { method: POST, path: "/coop/members", description: "Create a member (APPLICANT)", roles: [MemberServicesRep], code: 201, input: [legal_name, member_type, district_id], output: Member, side_effects: [] }
  - { method: GET, path: "/coop/members/{id}", description: "Get member", roles: [MemberServicesRep, BoardDirector, BoardSecretary, BillingClerk, Member], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/coop/members", description: "List members", roles: [MemberServicesRep, BoardDirector, BoardSecretary, BillingClerk], code: 200, input: ["status?", "district_id?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/coop/members/{id}/activate", description: "Activate APPLICANT member", roles: [MemberServicesRep], code: 200, input: [], output: Member, side_effects: ["status -> ACTIVE", "joined_at stamped"] }
  - { method: POST, path: "/coop/members/{id}/suspend", description: "Suspend ACTIVE member", roles: [MemberServicesRep], code: 200, input: [], output: Member, side_effects: ["status -> SUSPENDED", "load management devices cascade to SUSPENDED"] }
  - { method: POST, path: "/coop/members/{id}/reinstate", description: "Reinstate SUSPENDED member", roles: [MemberServicesRep], code: 200, input: [], output: Member, side_effects: ["status -> ACTIVE", "devices SUSPENDED -> ACTIVE"] }
  - { method: POST, path: "/coop/members/{id}/terminate", description: "Terminate member", roles: [MemberServicesRep], code: 200, input: [], output: Member, side_effects: ["status -> TERMINATED", "locations DISCONNECTED", "devices UNENROLLED"] }
  - { method: GET, path: "/coop/members/{id}/service-locations", description: "List member's service locations", roles: [MemberServicesRep, BillingClerk, FieldOpsCoordinator, Member], code: 200, input: [], output: "ServiceLocation[]", side_effects: [] }
