            - "claimant_type=PRO_ACCOUNT and evidence_grade=STRONG each return total_count 0 rather than falling back to the unfiltered population"
            - "scoped_rep_hit == '${rep1}' while the same scoped read on ${sku2} returns total_count 0 — the nested report read is scoped by the addressed SKU"
            - "Every one of these responses carries meta.total_count, meta.limit, meta.offset and meta.has_more, with limit defaulting to 20 and offset to 0 when omitted"

  - section: errors
    instances:

      - name: hardness_margin_gate_then_release_idempotency_refusal
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HARDNESS_MARGIN_NOT_MET]
          - errors[ERR_LOT_ALREADY_DISPOSITIONED]
          - validations[priority=513]
          - validations[priority=403]
        distinguishing_aspect: "A lot can pass every individual test and still fail certification on the CHANNEL margin: all four mandatory runs PASS against their own requirements yet pooled hardness 50.20 is below the BRANDED certify floor of 51.0. A second 8-specimen run lifts the specimen-weighted pooled index to 52.44 and certification succeeds; the released lot then refuses a second release with ERR_LOT_ALREADY_DISPOSITIONED even when the version token is stale, proving 403 outranks 450."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO: HARDNESS requirement 50.0, certify floor 50.0 + 1.0 = 51.0, proof_torque_required_nm 115.8, SALT_SPRAY_MIN_HOURS 96."
            - "One CR_MO furnace, one chamber of capacity 24, one lot of 500 units with specimen_pool_total 40, heat-treated by a campaign ending 2026-08-02T10:00:00Z and advanced to PLATED."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
