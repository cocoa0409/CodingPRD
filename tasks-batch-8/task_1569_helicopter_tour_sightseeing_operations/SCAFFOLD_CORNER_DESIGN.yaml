              as: CommunityReporter
              captures: { c_out: $.data.id }
            - { call: "POST /complaints/${c_in}/events", payload: { event_type: "LINK_FLIGHT", flight_id: "${f_id}" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c_out}/events", payload: { event_type: "LINK_FLIGHT", flight_id: "${f_id}" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c_in}/events", payload: { event_type: "REVIEW" }, as: ComplianceOfficer }
            - { call: "POST /complaints/${c_out}/events", payload: { event_type: "REVIEW" }, as: ComplianceOfficer }
