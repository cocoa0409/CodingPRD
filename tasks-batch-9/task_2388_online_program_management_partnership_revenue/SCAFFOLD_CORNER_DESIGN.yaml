              captures: { e8: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e8} == ERR_NON_DELEGABLE_SERVICE_DOMAIN"

      - name: prerequisite_edge_repointed_into_a_cycle_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 33 ERR_PREREQUISITE_CYCLE]
          - endpoints[PATCH /courses/{id}]
        distinguishing_aspect: "The cycle check is transitive over the whole Program graph and only becomes reachable through amendment: MBA-502 legally requires MBA-501, and re-pointing MBA-501 at MBA-502 would close the two-node loop, so the PATCH is refused."
        test_recipe:
          setup:
            - "DRAFT Program with MBA-501 (no prerequisite) and MBA-502 whose prerequisite_course_id is MBA-501; both still NOT_STARTED or IN_DESIGN."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - &k_course2_create_pre
              call: "POST /programs/${pg_id}/courses"
              payload:
                course_code: "MBA-502"
                title: "Managerial Accounting"
                credits: 3
