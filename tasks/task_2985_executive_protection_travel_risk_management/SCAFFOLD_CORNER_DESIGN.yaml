      - name: close_rejects_an_unended_trip_then_an_open_incident_then_an_unsettled_detail
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TRIP_NOT_ENDED
          - errors.ERR_OPEN_INCIDENTS_BLOCK_CLOSE
          - errors.ERR_ASSIGNMENTS_NOT_SETTLED
          - errors.ERR_INCIDENT_TRACK_INCOMPATIBLE
          - validations.priority_35
          - validations.priority_41
          - validations.priority_46
          - validations.priority_47
          - state_machines.Trip.readiness_state.DEGRADED_to_CLOSED.preconditions
        distinguishing_aspect: |
          The close edge carries three independent preconditions at three different priorities, and
          the only way to see all three is to satisfy them one at a time in ladder order: the
          temporal one first (35), then the incident one (46), then the settlement one (47). The
          middle call is the discriminator — the trip has BOTH an open incident and a CONFIRMED
          assignment, so an implementation that evaluates the settlement check first returns the
          wrong id while still returning a 409. Clearing the incident also has to pass through the
          triage branch gate, which refuses SHELTER_IN_PLACE for a MEDICAL incident.
        test_recipe:
          setup:
            - "an APPROVED, READY trip for a TIER_3 executive with one PT leg, one CONFIRMED LEAD_AGENT assignment, a VERIFIED MEDICAL_EVAC policy, and one AVAILABLE MEDICAL_EVAC vendor in PT"
