# §1.9 Scaffold Corner Design (Breadth Probe)
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every corner already asserted by a §1.8 instance is emitted as an `excluded_because:` stub
# citing that instance by name. All other corners carry a full, executable test_recipe.
scaffold_corner_design:

  # =========================================================================
  # Guide section 1 - Entities
  # =========================================================================
  - section: entities
    instances:
      - name: chapter_creation_returns_declared_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Chapter
          - endpoints[POST /accreditation/chapters]
          - entities.Chapter.fields.standard_count
        distinguishing_aspect: "POST /accreditation/chapters with the three required fields returns 201 with code, name, weight_pct and every computed counter initialised to 0 / ON_TRACK."
        test_recipe:
          setup:
            - "Empty database; logical clock at the mandatory default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { e1_ch: $.data.id, e1_created: $.data.created_at, e1_version: $.data.version }
          assert:
            - "HTTP 201 and Chapter.${e1_ch}.code == EC, name == Environment of Care, weight_pct == 100, evidence_min_count == 1"
            - "Chapter.${e1_ch}.standard_count == 0, mapped_standard_count == 0, evidence_complete_standard_count == 0, deficient_standard_count == 0, ppr_escalation_count == 0"
            - "Chapter.${e1_ch}.readiness_flag == ON_TRACK"
            - "${e1_version} == 1 and ${e1_created} == 2026-08-01T00:00:00.000Z"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: standard_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /accreditation/standards/{id}]
          - entities.Standard.fields.risk_tier
          - entities.Standard.fields.compliance_state
        distinguishing_aspect: "GET /accreditation/standards/{id} echoes the stored standard_code, title and risk_tier and reports compliance_state UNMAPPED for a standard with no owner."
        test_recipe:
          setup:
            - "One chapter EC with one standard EC.02.06.01 of risk_tier DIRECT_IMPACT and no OwnerAssignment."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { e2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${e2_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { e2_s1: $.data.id }
          trigger:
            - call: "GET /accreditation/standards/${e2_s1}"
              as: StandardOwner
              captures: { e2_code: $.data.standard_code, e2_tier: $.data.risk_tier, e2_state: $.data.compliance_state, e2_chapter: $.data.chapter_id }
          assert:
            - "${e2_code} == EC.02.06.01 and ${e2_tier} == DIRECT_IMPACT"
            - "${e2_state} == UNMAPPED and active_owner_count == 0 and validated_evidence_count == 0"
            - "${e2_chapter} == ${e2_ch} (the FK is taken from the creating path, not the body)"
            - "Chapter.${e2_ch}.standard_count == 1"

      - name: deficiency_ticket_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /accreditation/deficiency-tickets]
          - response_envelope.pagination_fields
          - entities.DeficiencyTicket.fields.severity
        distinguishing_aspect: "GET /accreditation/deficiency-tickets with limit 2 and offset 0 returns 2 of the 3 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Unit ED-2 with one OPEN LIFE_SAFETY session holding three tickets of severity LOW, LOW and MODERATE (5 points total, posture stays OPEN)."
            - "Clock at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 25, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { e3_ch: $.data.id }
            - call: "POST /accreditation/chapters/${e3_ch}/standards"
              payload: { standard_code: "LS.02.01.01", title: "Sprinkler coverage", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { e3_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "ED-2", unit_type: "ED", bed_count: 20 }
              as: AccreditationDirector
              captures: { e3_u: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/rounding-sessions"
              payload: { unit_id: "${e3_u}", round_type: "LIFE_SAFETY", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: SafetyOfficer
              captures: { e3_rs: $.data.id }
            - call: "POST /accreditation/rounding-sessions/${e3_rs}/deficiencies"
              payload: { standard_id: "${e3_s1}", description: "Storage within 18 inches of sprinkler", severity: "LOW" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${e3_rs}/deficiencies"
              payload: { standard_id: "${e3_s1}", description: "Corridor cart unattended", severity: "LOW" }
              as: SafetyOfficer
            - call: "POST /accreditation/rounding-sessions/${e3_rs}/deficiencies"
              payload: { standard_id: "${e3_s1}", description: "Fire drill record incomplete", severity: "MODERATE" }
              as: SafetyOfficer
          trigger:
            - call: "GET /accreditation/deficiency-tickets"
              payload: { rounding_session_id: "${e3_rs}", limit: 2, offset: 0 }
              as: SafetyOfficer
              captures: { e3_page1: $.data }
            - call: "GET /accreditation/deficiency-tickets"
              payload: { rounding_session_id: "${e3_rs}", limit: 2, offset: 2 }
              as: SafetyOfficer
              captures: { e3_page2: $.data }
          assert:
            - "${e3_page1} contains 2 ticket rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "${e3_page2} contains 1 ticket row with total_count == 3, offset == 2 and has_more == false"
            - "the two pages together cover the three ticket ids exactly once"
            - "RoundingSession.${e3_rs}.deficiency_count == 3 and HospitalUnit.${e3_u}.open_deficiency_penalty_points == 5"

      - name: readiness_read_for_unknown_unit_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /accreditation/units/{id}/readiness]
          - errors[ERR_UNIT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "GET /accreditation/units/{id}/readiness for an id that was never created returns ERR_UNIT_NOT_FOUND with HTTP 404 rather than a 0.00 / NOT_ASSESSED body."
        test_recipe:
          setup:
            - "Empty database; no HospitalUnit rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /accreditation/units/11111111-1111-4111-8111-111111111111/readiness"
              as: AccreditationDirector
              captures: { e4_err: $.data.error_id }
          assert:
            - "${e4_err} == ERR_UNIT_NOT_FOUND with HTTP 404"
            - "the error envelope carries response_type == error and data.message is non-empty"

      - name: chapter_missing_required_weight_pct_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /accreditation/chapters]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting weight_pct, a field with source input and no default, returns ERR_INVALID_REQUEST with HTTP 400 and creates no Chapter row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control" }
              as: AccreditationDirector
              captures: { e5_err: $.data.error_id }
          assert:
            - "${e5_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /accreditation/chapters/{any id} is impossible because no row was created"

      - name: chapter_evidence_min_count_default_two_applied
        claim_type: defaults
        grounds:
          - entities.Chapter.fields.evidence_min_count
          - state_machines.Standard.MAPPED_to_EVIDENCE_COMPLETE
        distinguishing_aspect: "Omitting evidence_min_count stores the declared default 2, so one VALIDATED evidence item leaves the standard in MAPPED instead of EVIDENCE_COMPLETE."
        test_recipe:
          setup:
            - "Chapter MM created WITHOUT evidence_min_count; one standard owned by owner-1; one evidence item validated by val-1."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "MM", name: "Medication Management", weight_pct: 30 }
              as: AccreditationDirector
              captures: { e6_ch: $.data.id, e6_min: $.data.evidence_min_count }
            - call: "POST /accreditation/chapters/${e6_ch}/standards"
              payload: { standard_code: "MM.05.01.01", title: "Medication order review", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { e6_s1: $.data.id }
            - call: "POST /accreditation/standards/${e6_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${e6_s1}/evidence-items"
              payload: { title: "Order review policy", doc_type: "POLICY", effective_date: "2026-07-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { e6_e1: $.data.id }
            - call: "POST /accreditation/evidence-items/${e6_e1}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
          trigger:
            - call: "POST /accreditation/evidence-items/${e6_e1}/transition"
              payload: { action: "VALIDATE", review_note: "Policy accepted" }
              as: EvidenceValidator
              as_user_id: "val-1"
              captures: { e6_e1_state: $.data.validation_state }
            - call: "GET /accreditation/standards/${e6_s1}"
              as: AccreditationDirector
              captures: { e6_s1_state: $.data.compliance_state, e6_s1_count: $.data.validated_evidence_count }
          assert:
            - "${e6_min} == 2 (declared default applied when the field is omitted)"
            - "${e6_e1_state} == VALIDATED and ${e6_s1_count} == 1"
            - "${e6_s1_state} == MAPPED, not EVIDENCE_COMPLETE, because 1 is below evidence_min_count 2"
            - "Chapter.${e6_ch}.evidence_complete_standard_count == 0 and mapped_standard_count == 1"

      - name: chapter_computed_counter_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Chapter.fields.mapped_standard_count
          - entities.Chapter.fields.readiness_flag
        distinguishing_aspect: "Client-supplied values for the computed fields mapped_standard_count and readiness_flag are ignored: the created Chapter still reports 0 and ON_TRACK."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/chapters"
              payload: { code: "PC", name: "Provision of Care", weight_pct: 40, evidence_min_count: 1, mapped_standard_count: 99, readiness_flag: "AT_RISK" }
              as: AccreditationDirector
              captures: { e7_ch: $.data.id, e7_mapped: $.data.mapped_standard_count, e7_flag: $.data.readiness_flag }
          assert:
            - "${e7_mapped} == 0 and ${e7_flag} == ON_TRACK (computed fields are server-derived)"
            - "Chapter.${e7_ch}.weight_pct == 40 (the legitimate input fields are still honoured)"

      - name: unit_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.HospitalUnit
          - endpoints[POST /accreditation/units]
        distinguishing_aspect: "Client-supplied id, created_at and version on POST /accreditation/units are ignored: the server mints its own id, stamps created_at from the logical clock and sets version 1."
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/units"
              payload: { name: "ICU-1", unit_type: "ICU", bed_count: 12, id: "22222222-2222-4222-8222-222222222222", created_at: "2020-01-01T00:00:00Z", version: 77 }
              as: AccreditationDirector
              captures: { e8_u: $.data.id, e8_created: $.data.created_at, e8_version: $.data.version }
          assert:
            - "${e8_u} != 22222222-2222-4222-8222-222222222222"
            - "${e8_created} == 2026-08-01T00:00:00.000Z and ${e8_version} == 1"
            - "HospitalUnit.${e8_u}.posture == OPEN, readiness_score == 0.00, readiness_band == NOT_ASSESSED, scheduled_tracer_count == 0"

      - name: unit_invalid_enum_unit_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.HospitalUnit.fields.unit_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A unit_type outside {MED_SURG, ICU, ED, OR, BEHAVIORAL_HEALTH, AMBULATORY} returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/units"
              payload: { name: "HELIPAD-1", unit_type: "HELIPAD", bed_count: 0 }
              as: AccreditationDirector
              captures: { e9_err: $.data.error_id }
          assert:
            - "${e9_err} == ERR_INVALID_REQUEST with HTTP 400"
            - "no HospitalUnit named HELIPAD-1 exists afterwards"

      - name: tracer_observation_is_immutable_without_version_field
        claim_type: immutability
        grounds:
          - entities.TracerObservation
          - endpoints[GET /accreditation/mock-tracers/{id}/observations]
        distinguishing_aspect: "TracerObservation is declared common_fields false: its rows expose no version and no updated_at, and §1.5 offers no update or delete endpoint for them."
        test_recipe:
          setup:
            - "Unit MED-1 with an IN_PROGRESS tracer on chapter EC and one recorded COMPLIANT observation."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { e10_ch: $.data.id }
            - call: "POST /accreditation/chapters/${e10_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { e10_s1: $.data.id }
            - call: "POST /accreditation/standards/${e10_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "MED-1", unit_type: "MED_SURG", bed_count: 24 }
              as: AccreditationDirector
              captures: { e10_u: $.data.id, e10_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${e10_u}", chapter_id: "${e10_ch}", tracer_type: "PATIENT", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_unit_version: "${e10_u_v1}" }
              as: TracerSurveyor
              captures: { e10_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${e10_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
          trigger:
            - call: "POST /accreditation/mock-tracers/${e10_t}/observations"
              payload: { standard_id: "${e10_s1}", result: "COMPLIANT", weight: 3, note: "Two rooms sampled" }
              as: TracerSurveyor
              as_user_id: "surv-1"
              captures: { e10_obs: $.data }
            - call: "GET /accreditation/mock-tracers/${e10_t}/observations"
              as: TracerSurveyor
              captures: { e10_list: $.data }
          assert:
            - "${e10_obs} carries id, created_at, mock_tracer_id, standard_id, result, weight, note and recorded_by_user_id == surv-1"
            - "${e10_obs} exposes NO version field and NO updated_at field (common_fields false)"
            - "${e10_list} contains exactly 1 row and §1.5 declares no PATCH, PUT or DELETE route for observations"
            - "MockTracer.${e10_t}.state == IN_PROGRESS and tracer_score == 0.00 until COMPLETE freezes it"

      - name: standard_creation_under_unknown_chapter_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /accreditation/chapters/{id}/standards]
          - errors[ERR_CHAPTER_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "Creating a Standard under a chapter id that does not exist returns ERR_CHAPTER_NOT_FOUND with HTTP 404, proving the parent is resolved from the path before the body is applied."
        test_recipe:
          setup:
            - "Empty database; no Chapter rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/chapters/33333333-3333-4333-8333-333333333333/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { e11_err: $.data.error_id }
          assert:
            - "${e11_err} == ERR_CHAPTER_NOT_FOUND with HTTP 404"

      - name: finding_body_foreign_keys_unknown_unit_not_found
        claim_type: graph_topology
        grounds:
          - entities.SurveyFinding.fields.unit_id
          - validations[priority=6]
          - errors[ERR_UNIT_NOT_FOUND]
        distinguishing_aspect: "SurveyFinding is a three-way junction (window x standard x unit); a body unit_id that does not exist returns ERR_UNIT_NOT_FOUND even though the path window and body standard both resolve."
        test_recipe:
          setup:
            - "Survey CYCLE-2026 in ACTIVE_SURVEY at clock 2026-09-20T00:00:00Z with one existing standard and no HospitalUnit rows."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EM", name: "Emergency Management", weight_pct: 20, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { e12_ch: $.data.id }
            - call: "POST /accreditation/chapters/${e12_ch}/standards"
              payload: { standard_code: "EM.02.01.01", title: "Emergency operations plan", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { e12_s1: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { e12_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${e12_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${e12_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/survey-windows/${e12_sw}/findings"
              payload: { standard_id: "${e12_s1}", unit_id: "44444444-4444-4444-8444-444444444444", observed_noncompliance_count: 2, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { e12_err: $.data.error_id }
          assert:
            - "${e12_err} == ERR_UNIT_NOT_FOUND with HTTP 404"
            - "GET /accreditation/survey-findings filtered by survey_window_id ${e12_sw} returns total_count 0"

  # =========================================================================
  # Guide section 2 - State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: tracer_initial_state_is_scheduled
        claim_type: initial_state
        grounds:
          - state_machines.MockTracer
          - entities.MockTracer.fields.state
          - entities.HospitalUnit.fields.scheduled_tracer_count
        distinguishing_aspect: "A freshly scheduled MockTracer starts in the declared initial_state SCHEDULED with started_at null, contributes_to_readiness false and the unit's scheduled_tracer_count at 1."
        test_recipe:
          setup:
            - "Chapter EC with one mapped standard and unit ICU-2, clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { s1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${s1_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s1_s1: $.data.id }
            - call: "POST /accreditation/standards/${s1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-2", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
              captures: { s1_u: $.data.id, s1_u_v1: $.data.version }
          trigger:
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${s1_u}", chapter_id: "${s1_ch}", tracer_type: "SYSTEM", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-20T10:00:00Z", expected_unit_version: "${s1_u_v1}" }
              as: TracerSurveyor
              captures: { s1_t: $.data.id, s1_t_state: $.data.state, s1_t_started: $.data.started_at, s1_t_contrib: $.data.contributes_to_readiness }
            - call: "GET /accreditation/units/${s1_u}"
              as: TracerSurveyor
              captures: { s1_u_count: $.data.scheduled_tracer_count, s1_u_v2: $.data.version }
          assert:
            - "${s1_t_state} == SCHEDULED, ${s1_t_started} == null, ${s1_t_contrib} == false"
            - "MockTracer.${s1_t}.tracer_score == 0.00, scored_weight == 0, earned_weight == 0"
            - "${s1_u_count} == 1 and ${s1_u_v2} == 2 (the scheduling write bumped the unit version from 1)"

      - name: tracer_start_before_window_start_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=30]
          - errors[ERR_TRACER_WINDOW_NOT_STARTED]
          - state_machines.MockTracer.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: "action=START at clock 2026-08-01 on a tracer whose window_start is 2026-08-20T08:00Z returns ERR_TRACER_WINDOW_NOT_STARTED and leaves the tracer SCHEDULED."
        test_recipe:
          setup:
            - "Same fixture as tracer_initial_state_is_scheduled: one SCHEDULED tracer for 2026-08-20T08:00Z-10:00Z."
            - "Clock left at the default 2026-08-01T00:00:00Z, well before window_start."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { s2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${s2_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s2_s1: $.data.id }
            - call: "POST /accreditation/standards/${s2_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-2", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
