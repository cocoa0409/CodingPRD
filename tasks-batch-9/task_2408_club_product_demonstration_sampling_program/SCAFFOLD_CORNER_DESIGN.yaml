  # SECTION 5 — Endpoints (§1.5)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: patch_demonstrator_updates_the_row_and_gates_later_assignments
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /demonstrators/{id}]
          - entities.Demonstrator.fields.employment_status
          - validations[priority=16]
          - errors[ERR_DEMONSTRATOR_NOT_ACTIVE]
        distinguishing_aspect: "PATCH /demonstrators/{id} applies only the supplied keys — hourly_rate_cents moves to 2600 while full_name and home_club_id are untouched — bumps version by exactly 1, and once employment_status is INACTIVE a new assignment is refused with ERR_DEMONSTRATOR_NOT_ACTIVE 422."
        test_recipe:
          setup:
            - "A CONFIRMED NON_FOOD event dated 2026-09-14 and one ACTIVE demonstrator homed at the club."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Marchwood Home", billing_email: "ap@marchwood.example", program_tier: "STANDARD", credit_limit_cents: 900000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6033", name: "Marchwood Club 6033", region_code: "W", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "MH-STL-033", name: "Step Stool", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 2800, samples_per_case: 2, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Nora Blackwell", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id", v_before: "$.data.version" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
          trigger:
            - call: "PATCH /demonstrators/${dem_id}"
              payload: { hourly_rate_cents: 2600 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { rate_after: "$.data.hourly_rate_cents", name_after: "$.data.full_name", v_after: "$.data.version", status_after: "$.data.employment_status" }
            - call: "PATCH /demonstrators/${dem_id}"
              payload: { employment_status: "INACTIVE" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { v_final: "$.data.version", status_final: "$.data.employment_status" }
            - call: "POST /demo-events/${event_id}/assignments"
              payload: { demonstrator_id: "${dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { err_inactive: "$.data.error_id" }
          assert:
            - "${rate_after} == 2600"
            - "${name_after} == Nora Blackwell"
            - "${status_after} == ACTIVE"
            - "${v_after} == ${v_before} + 1"
            - "${status_final} == INACTIVE"
            - "${v_final} == ${v_after} + 1"
            - "Demonstrator.${dem_id}.home_club_id == ${club_id}"
            - "Demonstrator.${dem_id}.max_weekly_events == 5"
            - "${err_inactive} == ERR_DEMONSTRATOR_NOT_ACTIVE"
            - "the assignment responds with HTTP 422"
            - "DemoEvent.${event_id}.staffing_status == UNSTAFFED"

      - name: rejecting_a_cancellation_credit_closes_it_without_touching_any_balance
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cancellation-credits/{id}/decisions]
          - state_machines.CancellationCredit.transitions.PENDING_APPROVAL_to_REJECTED
          - entities.CancellationCredit.fields.credit_status
          - entities.Manufacturer.fields.credit_note_balance_cents
        distinguishing_aspect: "A REJECT decision drives the credit from PENDING_APPROVAL straight to the terminal REJECTED state, leaves applied_to_invoice_id null and credit_note_balance_cents 0, and a second decision on the same credit returns ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "A CONFIRMED NON_FOOD event at a STANDARD club dated 2026-09-14 MORNING, cancelled by the club side, which mints one PENDING_APPROVAL CancellationCredit."
            - "Clock left at 2026-08-01T00:00:00Z, so notice_hours is far above 72 and the credit's own arithmetic is not the subject here."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Netherby Brands", billing_email: "ap@netherby.example", program_tier: "STANDARD", credit_limit_cents: 900000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6034", name: "Netherby Club 6034", region_code: "SE", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "NB-BLK-034", name: "Fleece Blanket", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 3400, samples_per_case: 2, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "CANCEL", reason: "club remodel" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { cancelled_state: "$.data.booking_status" }
            - call: "GET /cancellation-credits?demo_event_id=${event_id}"
              payload: { demo_event_id: "${event_id}" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { credit_id: "$.data[0].id", credit_state_before: "$.data[0].credit_status" }
          trigger:
            - call: "POST /cancellation-credits/${credit_id}/decisions"
              payload: { decision: "REJECT", note: "cancellation was inside the manufacturer's control" }
              as: ProgramAdmin
              as_user_id: "admin_controller"
              captures: { credit_state_after: "$.data.credit_status", applied_to: "$.data.applied_to_invoice_id", approver: "$.data.approved_by_user_id" }
            - call: "POST /cancellation-credits/${credit_id}/decisions"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
              as_user_id: "admin_controller"
              captures: { err_second: "$.data.error_id" }
          assert:
            - "${cancelled_state} == CANCELLED"
            - "${credit_state_before} == PENDING_APPROVAL"
            - "${credit_state_after} == REJECTED"
            - "${applied_to} == null"
            - "${approver} == admin_controller"
            - "${err_second} == ERR_INVALID_STATE"
            - "the second decision responds with HTTP 409"
            - "Manufacturer.${mfr_id}.credit_note_balance_cents == 0"
            - "Manufacturer.${mfr_id}.outstanding_balance_cents == 0"

      - name: injecting_two_history_entries_creates_both_rows_in_one_call
        claim_type: bulk_action
        grounds:
          - endpoints[POST /_inject/assignment-history]
          - calculations.demonstrator_reliability_score
          - entities.Demonstrator.fields.completed_event_count
        distinguishing_aspect: "One POST /_inject/assignment-history with a two-entry array returns an EventAssignment[] of exactly 2 COMPLETED rows and recomputes the demonstrator once: completed_event_count becomes 2 while both reliability variants stay clamped at 100.00 because the COMPLETION_BONUS cannot push a score above the ceiling."
        test_recipe:
          setup:
            - "One club, one demonstrator and one DRAFT host event dated 2026-10-12 that only anchors the injected rows."
            - "Clock left at 2026-08-01T00:00:00Z, so both injected shifts on 2026-07-06 and 2026-07-13 are inside the 90-day rolling window as well as program-to-date."
