scenario: |
  2770. Fitness Franchise Membership & Territory Administration (fitness club franchise system):
  franchise territory definition with radius protection and relocation approval, membership
  agreement standardization with contract terms, cancellation rights and state health club
  statutes, membership transfer between locations with home club billing and usage fee
  settlement, national account and corporate membership programs with franchise revenue
  allocation, dues billing, delinquency and collection practices with third-party billing
  partners, promotional pricing governance limiting deep discounting that affects the brand,
  equipment standards, refresh cycles and facility inspection scoring, franchisee reporting of
  membership counts and royalty calculation

domain_name: fitness-franchise-membership-territory-administration
api_prefix: "/franchise"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Franchisee/Territory/Club form an ownership spine, but MembershipAgreement,
  # GuestUsageEvent, UsageSettlement and CorporateAccount create many-to-many edges
  # across that spine (one agreement points at a member, a home club, a plan, a
  # promotion and a corporate account; one usage event points at two clubs and one
  # settlement), so the reachable object graph is not a tree.

  state_machine_shape: cyclic
  # RelocationRequest cycles SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED with a hard
  # revision cap; MembershipAgreement additionally carries two independent state
  # dimensions (agreement_status x dues_status) plus an ACTIVE <-> FROZEN cycle, and
  # Club.equipment_compliance_state is compound-derived from its FacilityInspection
  # children.

  relationship_patterns:
    - one_to_many        # Franchisee -> Territory -> Club -> FacilityInspection
    - many_to_many       # MembershipAgreement x Club via GuestUsageEvent / UsageSettlement
    - cross_aggregate    # CorporateAccount allocation reaches into Franchisee ledgers
    - self_referential   # Club <-> Club pairs on UsageSettlement (home_club_id, host_club_id)

  role_model: segregation_of_duties
  # The ComplianceAuditor who scores a FacilityInspection may not be the auditor who
  # waives its remediation; the FranchiseOwner who submits a RelocationRequest may not
  # decide it; the receiving ClubManager (not the releasing one) decides a transfer.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the franchise operator.
        constraints: 1..120 chars
      - name: contact_email
        type: string
        source: input
        description: Primary franchisor contact address.
      - name: royalty_rate_bps
        type: integer
        source: input
        description: Royalty rate in basis points applied to the verified dues basis.
        default: 650
        constraints: 0..1200
      - name: status
        type: enum
        source: system
        description: Franchise standing. Auto-demoted to PROBATION when compliance_score < 70; only POST /franchisees/{id}/reinstate returns it to ACTIVE.
        default: ACTIVE
        constraints: "ACTIVE | PROBATION"
      - name: inspection_fail_streak
        type: integer
        source: computed
        description: Consecutive SCORED FacilityInspections with score < 70 across all clubs of this franchisee, ordered by (inspection_date ASC, created_at ASC); reset to 0 by a SCORED inspection with score >= 70. REMEDIATION_WAIVED does NOT reset it.
        default: 0
      - name: collections_watch_club_count
        type: integer
        source: computed
        description: Count of Clubs with franchisee_id == this Franchisee.id and collections_watch == true.
        default: 0
      - name: disputed_royalty_count
        type: integer
        source: computed
        description: Count of RoyaltyReports with franchisee_id == this Franchisee.id and status == DISPUTED.
        default: 0
      - name: compliance_score
        type: integer
        source: computed
        description: See calculations.franchisee_compliance_score. Recomputed on every inspection scoring, remediation waiver, dues-status change, and royalty adjudication.
        default: 100
        constraints: 0..100
      - name: corporate_allocation_cents
        type: integer
        source: computed
        description: Running total of corporate-account revenue allocated to this franchisee across all CorporateAccounts; decremented by recall-allocation.
        default: 0
      - name: national_account_eligible
        type: boolean
        source: input
        description: When false, this franchisee is excluded from every CorporateAccount allocation candidate set.
        default: true

  - name: Territory
    parent: Franchisee
    common_fields: true
    fields:
      - name: franchisee_id
        type: string
        source: input
        description: FK -> Franchisee.id; the franchisee holding this protected territory.
      - name: center_lat
        type: number
        source: input
        description: Protected-circle center latitude, 4 decimal places.
        constraints: -90.0 .. 90.0
      - name: center_lng
        type: number
        source: input
        description: Protected-circle center longitude, 4 decimal places.
        constraints: -180.0 .. 180.0
      - name: protected_radius_km
        type: number
        source: input
        description: Radius of exclusive protection in kilometres, 1 decimal place.
        constraints: 0.5 .. 50.0
      - name: state_code
        type: enum
        source: input
        description: Health-club statute jurisdiction of this territory.
        constraints: "CA | TX | NY"
      - name: status
        type: enum
        source: system
        description: RESERVED at creation; flips to ACTIVE when the first child Club is opened.
        default: RESERVED
        constraints: "RESERVED | ACTIVE"
      - name: relocation_count
        type: integer
        source: computed
        description: Number of APPROVED RelocationRequests that have rewritten this territory's center/radius.
        default: 0

  - name: Club
    parent: Territory
    common_fields: true
    fields:
      - name: territory_id
        type: string
        source: input
        description: FK -> Territory.id; the territory this club sits inside.
      - name: franchisee_id
        type: string
        source: computed
        description: FK -> Franchisee.id; copied from Territory.franchisee_id at creation and never rewritten.
      - name: name
        type: string
        source: input
        description: Trading name of the club location.
      - name: state_code
        type: enum
        source: computed
        description: Copied from Territory.state_code at creation; drives which health-club statute applies to agreements signed here.
        constraints: "CA | TX | NY"
      - name: lat
        type: number
        source: computed
        description: Copied from Territory.center_lat at creation; rewritten to RelocationRequest.requested_lat when a relocation is APPROVED.
      - name: lng
        type: number
        source: computed
        description: Copied from Territory.center_lng at creation; rewritten to RelocationRequest.requested_lng when a relocation is APPROVED.
      - name: opened_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the location opened. Clubs opened before ACCELERATED_MANDATE_DATE fall under the accelerated equipment refresh cycle.
      - name: guest_fee_cents
        type: integer
        source: input
        description: Per-visit fee this club charges a visiting member's home club.
        default: 1250
        constraints: 0..5000
      - name: status
        type: enum
        source: system
        description: PRE_OPENING at creation; OPEN after POST /clubs/{id}/open; SUSPENDED when equipment_compliance_state becomes NON_COMPLIANT.
        default: PRE_OPENING
        constraints: "PRE_OPENING | OPEN | SUSPENDED"
      - name: equipment_compliance_state
        type: enum
        source: system
        description: Derived from the latest SCORED FacilityInspection - COMPLIANT when score >= 85, WATCH when 70..84, NON_COMPLIANT when < 70.
        default: COMPLIANT
        constraints: "COMPLIANT | WATCH | NON_COMPLIANT"
      - name: last_inspection_score
        type: integer
        source: computed
        description: score of the latest SCORED FacilityInspection for this club by (inspection_date DESC, created_at DESC); null before the first scoring.
        default: null
      - name: active_agreement_count
        type: integer
        source: computed
        description: Count of MembershipAgreements with home_club_id == this Club.id and agreement_status IN {ACTIVE, FROZEN, CANCELLATION_PENDING}.
        default: 0
      - name: delinquent_member_count
        type: integer
        source: computed
        description: Count of MembershipAgreements with home_club_id == this Club.id, agreement_status IN {ACTIVE, FROZEN, CANCELLATION_PENDING} and dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}.
        default: 0
      - name: collections_watch
        type: boolean
        source: computed
        description: True when active_agreement_count > 0 AND delinquent_member_count / active_agreement_count > COLLECTIONS_WATCH_SHARE.
        default: false
      - name: settlement_ledger_cents
        type: integer
        source: computed
        description: Signed inter-club settlement ledger. POSTED settlements debit the home club and credit the host club; REVERSED settlements undo both legs exactly.
        default: 0

  - name: RelocationRequest
    parent: Club
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club asking to move.
      - name: requested_lat
        type: number
        source: input
        description: Proposed new protected-circle center latitude.
      - name: requested_lng
        type: number
        source: input
        description: Proposed new protected-circle center longitude.
      - name: requested_radius_km
        type: number
        source: input
        description: Proposed new protected radius in kilometres.
        constraints: 0.5 .. 50.0
      - name: justification
        type: string
        source: input
        description: Free-text business case supplied by the franchise owner.
      - name: status
        type: enum
        source: system
        description: DRAFT at creation; cycles SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED until the brand decides.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | REJECTED | WITHDRAWN"
      - name: revision_count
        type: integer
        source: computed
        description: Incremented by 1 on every CHANGES_REQUESTED -> SUBMITTED re-submission. A re-submission that would push it above RELOCATION_REVISION_LIMIT is rejected.
        default: 0
      - name: encroachment_km
        type: number
        source: computed
        description: See calculations.territory_encroachment_slack - clearance in km between the proposed circle and the nearest foreign territory circle at submission time; negative means encroaching.
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FranchiseOwner on the most recent submit.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandAdministrator who approved or rejected.
        default: null
      - name: reviewer_note
        type: string
        source: system
        description: Note captured on request-changes or decide.
        default: null

  - name: MembershipPlanTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Brand-standard plan code; unique across all templates.
        constraints: unique, uppercase A-Z0-9_ 2..24 chars
      - name: monthly_dues_cents
        type: integer
        source: input
        description: Brand-standard list dues per month before any discount component.
        constraints: ">= 100"
      - name: initiation_fee_cents
        type: integer
        source: input
        description: One-time initiation fee charged at signing.
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: Contract term length in months; term_end_on = signed_on + 30 * term_months days.
        constraints: 1..36
      - name: cancellation_notice_days
        type: integer
        source: input
        description: Contractual notice period; the agreement stores min(this, statute max_notice_days).
        constraints: 0..60
      - name: floor_price_cents
        type: integer
        source: input
        description: Brand pricing floor - no agreement may be signed at an effective monthly dues below this value.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: DRAFT at creation; PUBLISHED after POST /plan-templates/{id}/publish. Only PUBLISHED templates may back a promotion or an agreement.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"

  - name: Promotion
    parent: Franchisee
    common_fields: true
    fields:
      - name: franchisee_id
        type: string
        source: input
        description: FK -> Franchisee.id; the franchisee running this local promotion.
      - name: plan_template_id
        type: string
        source: input
        description: FK -> MembershipPlanTemplate.id; the plan the discount applies to.
      - name: code
        type: string
        source: input
        description: Promotion code quoted on the membership agreement.
      - name: discount_pct
        type: number
        source: input
        description: Fractional discount off monthly_dues_cents, 3 decimal places.
        constraints: 0.0 .. 0.500
      - name: starts_on
        type: string
        source: input
        description: ISO 8601 date, first day the promotion may be quoted (inclusive).
      - name: ends_on
        type: string
        source: input
        description: ISO 8601 date, last day the promotion may be quoted (inclusive).
      - name: status
        type: enum
        source: system
        description: PENDING_REVIEW at creation; APPROVED or REJECTED by brand review; WITHDRAWN_BY_BRAND when its franchisee is demoted to PROBATION.
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | APPROVED | REJECTED | WITHDRAWN_BY_BRAND"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandAdministrator who reviewed it.
        default: null
      - name: withdrawn_reason
        type: string
        source: system
        description: Set to "FRANCHISEE_PROBATION" when the probation cascade withdraws it.
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Member legal name.
      - name: email
        type: string
        source: input
        description: Member contact address; unique across members.
        constraints: unique
      - name: home_state_code
        type: enum
        source: input
        description: Member's state of residence; recorded for statute audit but the agreement's statute follows Club.state_code.
        constraints: "CA | TX | NY"
      - name: status
        type: enum
        source: system
        description: ACTIVE at creation; auto-flips to INACTIVE when the member holds zero MembershipAgreements with agreement_status IN {PENDING, ACTIVE, FROZEN, CANCELLATION_PENDING}, and back to ACTIVE when a new agreement is signed.
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: agreement_count
        type: integer
        source: computed
        description: Count of MembershipAgreements with member_id == this Member.id and agreement_status IN {PENDING, ACTIVE, FROZEN, CANCELLATION_PENDING}.
        default: 0

  - name: CorporateAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: National account / corporate employer name.
      - name: corporate_credit_pct
        type: number
        source: input
        description: Fractional credit off monthly_dues_cents granted to agreements enrolled in this account, 3 decimal places.
        constraints: 0.0 .. 0.100
      - name: allocation_method
        type: enum
        source: input
        description: How the funded pool is split across eligible franchisees.
        default: USAGE_SHARE
        constraints: "USAGE_SHARE | EQUAL_SPLIT"
      - name: status
        type: enum
        source: system
        description: ACTIVE at creation; SUSPENDED after POST /corporate-accounts/{id}/suspend, which blocks new enrolments but not allocation of an already funded pool.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: pool_balance_cents
        type: integer
        source: computed
        description: Unallocated corporate dues held at brand level. Increased by fund, drained to 0 by allocate, restored by recall-allocation.
        default: 0
      - name: allocated_cents
        type: integer
        source: computed
        description: Total currently allocated out of this account to franchisees; returns to 0 on recall-allocation.
        default: 0
      - name: lifetime_funded_cents
        type: integer
        source: computed
        description: Monotonic total ever funded into this account. Conservation invariant - pool_balance_cents + allocated_cents == lifetime_funded_cents at all times.
        default: 0
      - name: enrolled_agreement_count
        type: integer
        source: computed
        description: Count of MembershipAgreements with corporate_account_id == this CorporateAccount.id and agreement_status IN {ACTIVE, CANCELLATION_PENDING}.
        default: 0

  - name: MembershipAgreement
    parent: Club
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the natural person who signed.
      - name: home_club_id
        type: string
        source: input
        description: FK -> Club.id; the billing home club. Rewritten to TransferRequest.to_club_id when a transfer is COMPLETED.
      - name: plan_template_id
        type: string
        source: input
        description: FK -> MembershipPlanTemplate.id; the brand-standard plan signed.
      - name: promotion_id
        type: string
        source: input
        description: FK -> Promotion.id; the promotion quoted at signing, or null for list price.
        default: null
      - name: corporate_account_id
        type: string
        source: input
        description: FK -> CorporateAccount.id; the national account this membership is enrolled under, or null for retail.
        default: null
      - name: multi_club_access
        type: boolean
        source: input
        description: When true the member may be recorded as a guest at other clubs and the multi-club credit component applies.
        default: false
      - name: state_code
        type: enum
        source: computed
        description: Copied from the home Club.state_code at signing and NEVER re-derived - a later transfer to another state does not move the agreement's governing statute.
        constraints: "CA | TX | NY"
      - name: signed_on
        type: string
        source: computed
        description: ISO 8601 date taken from the logical clock at creation.
      - name: term_end_on
        type: string
        source: computed
        description: signed_on + 30 * MembershipPlanTemplate.term_months days, using the 30-day month convention.
      - name: monthly_dues_base_cents
        type: integer
        source: computed
        description: Pinned copy of MembershipPlanTemplate.monthly_dues_cents at signing; later template edits never move a signed agreement.
      - name: initiation_fee_cents
        type: integer
        source: computed
        description: Pinned copy of MembershipPlanTemplate.initiation_fee_cents at signing.
      - name: cancellation_notice_days
        type: integer
        source: computed
        description: min(MembershipPlanTemplate.cancellation_notice_days, STATE_STATUTES[state_code].max_notice_days), pinned at signing.
      - name: promo_discount_cents
        type: integer
        source: computed
        description: Rounded promotion component of the dues discount; see calculations.effective_monthly_dues.
        default: 0
      - name: corporate_credit_cents
        type: integer
        source: computed
        description: Rounded corporate-account component of the dues discount.
        default: 0
      - name: multi_club_credit_cents
        type: integer
        source: computed
        description: Rounded multi-club-access component of the dues discount.
        default: 0
      - name: effective_monthly_dues_cents
        type: integer
        source: computed
        description: See calculations.effective_monthly_dues; pinned at signing and unchanged by later promotion withdrawal or transfer.
      - name: agreement_status
        type: enum
        source: system
        description: Contract dimension. PENDING until the first PAYMENT_RECEIVED billing event, then ACTIVE; evolves independently of dues_status.
        default: PENDING
        constraints: "PENDING | ACTIVE | FROZEN | CANCELLATION_PENDING | CANCELLED"
      - name: dues_status
        type: enum
        source: system
        description: Collections dimension, re-derived from the BillingEvent stream on every billing event; IN_COLLECTIONS and WRITTEN_OFF are sticky until outstanding_balance_cents <= 0.
        default: CURRENT
        constraints: "CURRENT | PAST_DUE | DELINQUENT | IN_COLLECTIONS | WRITTEN_OFF"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: See calculations.dues_ledger_projection.
        default: 0
      - name: dues_paid_cents
        type: integer
        source: computed
        description: Sum of BillingEvent.amount_cents over event_type == PAYMENT_RECEIVED for this agreement.
        default: 0
      - name: delinquency_days
        type: integer
        source: computed
        description: See calculations.dues_ledger_projection - whole days from the earliest unsatisfied due_on to the logical clock date.
        default: 0
      - name: transfer_count
        type: integer
        source: computed
        description: Number of COMPLETED TransferRequests that have moved this agreement's home club.
        default: 0
      - name: cancellation_requested_on
        type: string
        source: computed
        description: Logical clock date of the request-cancellation call.
        default: null
      - name: cancellation_effective_on
        type: string
        source: computed
        description: cancellation_requested_on on the statutory cooling-off branch, otherwise cancellation_requested_on + cancellation_notice_days days.
        default: null
      - name: refund_cents
        type: integer
        source: computed
        description: See calculations.cancellation_settlement.
        default: null
      - name: early_termination_fee_cents
        type: integer
        source: computed
        description: See calculations.cancellation_settlement.
        default: null
      - name: net_settlement_cents
        type: integer
        source: computed
        description: refund_cents - early_termination_fee_cents; negative means the member owes the club.
        default: null

  - name: TransferRequest
    parent: MembershipAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> MembershipAgreement.id; the membership being moved.
      - name: from_club_id
        type: string
        source: input
        description: FK -> Club.id; the releasing club, which must equal the agreement's current home_club_id.
      - name: to_club_id
        type: string
        source: input
        description: FK -> Club.id; the receiving club.
      - name: reason
        type: string
        source: input
        description: Free-text member-supplied reason.
      - name: status
        type: enum
        source: system
        description: REQUESTED at creation; APPROVED or DENIED by the receiving club manager; COMPLETED once the home club is actually moved.
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | DENIED | COMPLETED"
      - name: transfer_fee_cents
        type: integer
        source: computed
        description: See calculations.transfer_fee; pinned when the transfer is APPROVED.
        default: null
      - name: effective_on
        type: string
        source: computed
        description: Logical clock date on which the transfer was COMPLETED.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID (a Club id) of the receiving ClubManager who approved or denied.
        default: null

  - name: GuestUsageEvent
    parent: MembershipAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> MembershipAgreement.id; the visiting member's membership.
      - name: host_club_id
        type: string
        source: input
        description: FK -> Club.id; the club that hosted the visits and is owed the usage fee.
      - name: home_club_id_at_visit
        type: string
        source: computed
        description: FK -> Club.id; snapshot of MembershipAgreement.home_club_id at the moment the entry was recorded, so a later transfer never re-points historical usage.
      - name: period_month
        type: string
        source: input
        description: Settlement period the visits belong to, format YYYY-MM.
      - name: visit_count
        type: integer
        source: input
        description: Number of guest visits recorded in this batch entry.
        constraints: ">= 1"
      - name: guest_fee_cents_at_visit
        type: integer
        source: computed
        description: Snapshot of the host Club.guest_fee_cents at recording time.
      - name: usage_fee_cents
        type: integer
        source: computed
        description: visit_count * guest_fee_cents_at_visit.
      - name: settlement_id
        type: string
        source: system
        description: FK -> UsageSettlement.id; set when a settlement sweeps this entry, cleared back to null when that settlement is REVERSED.
        default: null

  - name: UsageSettlement
    parent: null
    common_fields: true
    fields:
      - name: period_month
        type: string
        source: input
        description: Settlement period, format YYYY-MM.
      - name: home_club_id
        type: string
        source: input
        description: FK -> Club.id; the paying club (the visiting members' home club).
      - name: host_club_id
        type: string
        source: input
        description: FK -> Club.id; the receiving club that hosted the visits.
      - name: event_count
        type: integer
        source: computed
        description: Number of GuestUsageEvent rows swept into this settlement.
      - name: visit_count
        type: integer
        source: computed
        description: Sum of GuestUsageEvent.visit_count over the swept rows.
      - name: gross_fee_cents
        type: integer
        source: computed
        description: Sum of GuestUsageEvent.usage_fee_cents over the swept rows.
      - name: admin_hold_cents
        type: integer
        source: computed
        description: Brand administration hold; see calculations.usage_settlement_net.
      - name: net_before_rebate_cents
        type: integer
        source: computed
        description: gross_fee_cents - admin_hold_cents; this is the ONLY value the rebate tier is keyed on.
      - name: rebate_pct
        type: number
        source: computed
        description: Volume rebate rate selected from net_before_rebate_cents.
      - name: volume_rebate_cents
        type: integer
        source: computed
        description: round_half_up(net_before_rebate_cents * rebate_pct).
      - name: net_payable_cents
        type: integer
        source: computed
        description: net_before_rebate_cents - volume_rebate_cents; the amount moved between club ledgers on post.
      - name: status
        type: enum
        source: system
        description: OPEN at creation; POSTED moves the ledgers; REVERSED undoes them and releases the swept usage entries.
        default: OPEN
        constraints: "OPEN | POSTED | REVERSED"
      - name: posted_on
        type: string
        source: system
        description: Logical clock date of the post call.
        default: null
      - name: reversed_on
        type: string
        source: system
        description: Logical clock date of the reverse call.
        default: null

  - name: BillingEvent
    parent: MembershipAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> MembershipAgreement.id; the membership whose ledger this event moves.
      - name: event_type
        type: enum
        source: input
        description: DUES_POSTED / PAYMENT_RECEIVED / PAYMENT_FAILED / WRITE_OFF may be posted by the BillingPartner; TRANSFER_FEE_POSTED and COLLECTION_PLACED are system-generated only.
        constraints: "DUES_POSTED | PAYMENT_RECEIVED | PAYMENT_FAILED | WRITE_OFF | TRANSFER_FEE_POSTED | COLLECTION_PLACED"
      - name: amount_cents
        type: integer
        source: input
        description: Signed-positive amount in cents; must be 0 for PAYMENT_FAILED and COLLECTION_PLACED.
        constraints: ">= 0"
      - name: occurred_on
        type: string
        source: input
        description: ISO 8601 date the billing partner processed the event.
      - name: due_on
        type: string
        source: input
        description: ISO 8601 due date; required for DUES_POSTED, must be null for every other event_type.
        default: null
      - name: source
        type: enum
        source: system
        description: BILLING_PARTNER for events posted through POST /billing-events, SYSTEM for TRANSFER_FEE_POSTED and COLLECTION_PLACED.
        constraints: "BILLING_PARTNER | SYSTEM"
      - name: resulting_outstanding_balance_cents
        type: integer
        source: computed
        description: Snapshot of MembershipAgreement.outstanding_balance_cents immediately after this event was folded into the projection.

  - name: RoyaltyReport
    parent: Franchisee
    common_fields: true
    fields:
      - name: franchisee_id
        type: string
        source: input
        description: FK -> Franchisee.id; the reporting franchisee.
      - name: period_month
        type: string
        source: input
        description: Reported period, format YYYY-MM; must be strictly earlier than the logical clock month.
      - name: reported_member_count
        type: integer
        source: input
        description: Membership count self-reported by the franchisee.
        constraints: ">= 0"
      - name: verified_member_count
        type: integer
        source: computed
        description: System count of qualifying agreements; see calculations.royalty_due.
      - name: reported_dues_basis_cents
        type: integer
        source: computed
        description: reported_member_count * BRAND_STANDARD_DUES_CENTS_FOR_PERIOD; see calculations.royalty_due variant reported_basis.
      - name: verified_dues_basis_cents
        type: integer
        source: computed
        description: Sum of effective_monthly_dues_cents over qualifying agreements; see calculations.royalty_due variant verified_basis.
      - name: reported_royalty_cents
        type: integer
        source: computed
        description: Royalty the reported basis would have produced; stored for audit but never billed.
      - name: royalty_due_cents
        type: integer
        source: computed
        description: Royalty actually owed, always from the verified basis.
      - name: variance_pct
        type: number
        source: computed
        description: Percentage overstatement of the reported count against the verified count, 2 decimal places.
      - name: status
        type: enum
        source: system
        description: SUBMITTED then immediately auto-resolved to ACCEPTED or DISPUTED by the variance threshold; DISPUTED reports may be ADJUSTED by the brand.
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | DISPUTED | ADJUSTED"
      - name: adjusted_royalty_cents
        type: integer
        source: computed
        description: Royalty the BrandAdministrator settled on when adjudicating a DISPUTED report.
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandAdministrator who adjudicated.
        default: null

  - name: FacilityInspection
    parent: Club
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the inspected location.
      - name: inspection_date
        type: string
        source: input
        description: ISO 8601 date of the walk-through; also the ordering key for the fail streak.
      - name: equipment_condition_pts
        type: integer
        source: input
        description: Equipment condition sub-score supplied at scoring time.
        default: null
        constraints: 0..100
      - name: cleanliness_pts
        type: integer
        source: input
        description: Cleanliness sub-score supplied at scoring time.
        default: null
        constraints: 0..100
      - name: safety_pts
        type: integer
        source: input
        description: Safety sub-score supplied at scoring time.
        default: null
        constraints: 0..100
      - name: equipment_age_months_max
        type: integer
        source: input
        description: Age in months of the oldest cardio/strength asset on the floor, supplied at scoring time.
        default: null
        constraints: 0..240
      - name: refresh_cycle_months_applied
        type: integer
        source: computed
        description: BRAND_REFRESH_CYCLE_MONTHS or ACCELERATED_REFRESH_CYCLE_MONTHS, whichever variant applied.
        default: null
      - name: refresh_pts
        type: integer
        source: computed
        description: Equipment-refresh sub-score derived from equipment_age_months_max and refresh_cycle_months_applied.
        default: null
      - name: score
        type: integer
        source: computed
        description: See calculations.inspection_score; integer 0..100.
        default: null
      - name: variant_applied
        type: enum
        source: computed
        description: Which refresh-cycle variant the score used.
        default: null
        constraints: "STANDARD_CYCLE | ACCELERATED_CYCLE"
      - name: status
        type: enum
        source: system
        description: SCHEDULED at creation; SCORED then auto-resolved to CLOSED (score >= 70) or REMEDIATION_REQUIRED (score < 70); REMEDIATION_WAIVED by a second auditor; CLOSED by the brand.
        default: SCHEDULED
        constraints: "SCHEDULED | SCORED | REMEDIATION_REQUIRED | REMEDIATION_WAIVED | CLOSED"
      - name: scored_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceAuditor who scored it; the waiver must come from a different auditor id.
        default: null
      - name: waived_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceAuditor who waived remediation.
        default: null
      - name: waiver_reason
        type: string
        source: system
        description: Reason text captured on the waiver.
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Territory
    initial_state: RESERVED
    terminal_states: []
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "system event: first child Club of this Territory reaches status OPEN via POST /franchise/clubs/{id}/open"
        actor: system
        preconditions:
          - "territory.status == RESERVED"
        side_effects:
          - "sets Territory.status = ACTIVE"
          - "increments Territory.version by 1"
        note: "Bubble-up. A territory with only PRE_OPENING clubs stays RESERVED."

  - entity: Club
    initial_state: PRE_OPENING
    terminal_states: []
    transitions:
      - from: PRE_OPENING
        to: OPEN
        trigger: "POST /franchise/clubs/{id}/open"
        actor: FranchiseOwner
        preconditions:
          - "club.status == PRE_OPENING"
          - "club.franchisee_id == X-User-ID"
          - "no RelocationRequest for this club with status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED}"
        side_effects:
          - "sets Club.status = OPEN"
          - "if the parent Territory.status == RESERVED, sets Territory.status = ACTIVE and increments Territory.version by 1"
          - "increments Club.version by 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "system event: POST /franchise/inspections/{id}/score produced score < 70, driving Club.equipment_compliance_state to NON_COMPLIANT"
        actor: system
        preconditions:
          - "club.status == OPEN"
          - "the scored inspection's club_id == club.id"
        side_effects:
          - "sets Club.status = SUSPENDED"
          - "increments Club.version by 1"
        note: "Cascade link 1 of the inspection probation chain. A SUSPENDED club may not sign new agreements, host guest visits, or receive transfers."
      - from: SUSPENDED
        to: OPEN
        trigger: "system event: POST /franchise/inspections/{id}/score produced score >= 70, OR POST /franchise/inspections/{id}/waive-remediation"
        actor: system
        preconditions:
          - "club.status == SUSPENDED"
        side_effects:
          - "sets Club.status = OPEN"
          - "on the waiver path sets Club.equipment_compliance_state = WATCH without touching Club.last_inspection_score"
          - "increments Club.version by 1"

  - entity: MembershipPlanTemplate
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /franchise/plan-templates/{id}/publish"
        actor: BrandAdministrator
        preconditions:
          - "template.status == DRAFT"
          - "template.floor_price_cents <= template.monthly_dues_cents"
        side_effects:
          - "sets MembershipPlanTemplate.status = PUBLISHED"
          - "increments MembershipPlanTemplate.version by 1"

  - entity: RelocationRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /franchise/relocation-requests/{id}/submit"
        actor: FranchiseOwner
        preconditions:
          - "request.status == DRAFT"
          - "the club's franchisee_id == X-User-ID"
        side_effects:
          - "sets RelocationRequest.submitted_by_user_id = X-User-ID"
          - "recomputes RelocationRequest.encroachment_km via calculations.territory_encroachment_slack against the proposed circle"
          - "increments RelocationRequest.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /franchise/relocation-requests/{id}/request-changes"
        actor: BrandAdministrator
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets RelocationRequest.reviewer_note = body note"
          - "increments RelocationRequest.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /franchise/relocation-requests/{id}/submit"
        actor: FranchiseOwner
        preconditions:
          - "request.status == CHANGES_REQUESTED"
          - "the club's franchisee_id == X-User-ID"
          - "request.revision_count + 1 <= RELOCATION_REVISION_LIMIT"
        side_effects:
          - "increments RelocationRequest.revision_count by 1"
          - "overwrites requested_lat / requested_lng / requested_radius_km from the body when supplied"
          - "recomputes RelocationRequest.encroachment_km"
          - "increments RelocationRequest.version by 1"
        note: "The cycle. A third re-submission (revision_count would become 3) is rejected with ERR_RELOCATION_REVISION_LIMIT."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /franchise/relocation-requests/{id}/decide with decision=APPROVE"
        actor: BrandAdministrator
        preconditions:
          - "request.status == SUBMITTED"
          - "X-User-ID != request.submitted_by_user_id (segregation of duties)"
          - "calculations.territory_encroachment_slack on the proposed circle is >= 0 against every Territory of a different franchisee with status IN {RESERVED, ACTIVE}"
        side_effects:
          - "sets RelocationRequest.status = APPROVED and decided_by_user_id = X-User-ID"
          - "rewrites the parent Territory.center_lat/center_lng/protected_radius_km to the requested values and increments Territory.relocation_count by 1 (cascade link 1)"
          - "because the Territory moved, rewrites Club.lat/Club.lng to the requested values (cascade link 2)"
          - "increments Territory.version and Club.version by 1 each"
        note: "MembershipAgreement.state_code is deliberately NOT touched - a relocation never moves the governing statute of an already-signed agreement."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /franchise/relocation-requests/{id}/decide with decision=REJECT"
        actor: BrandAdministrator
        preconditions:
          - "request.status == SUBMITTED"
          - "X-User-ID != request.submitted_by_user_id"
        side_effects:
          - "sets RelocationRequest.status = REJECTED, decided_by_user_id = X-User-ID, reviewer_note = body note"
          - "leaves Territory and Club geometry untouched"
          - "increments RelocationRequest.version by 1"
        note: "Branch divergence - APPROVE mutates two other entities, REJECT mutates none."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /franchise/relocation-requests/{id}/withdraw"
        actor: FranchiseOwner
        preconditions:
          - "request.status IN {DRAFT, CHANGES_REQUESTED}"
          - "the club's franchisee_id == X-User-ID"
        side_effects:
          - "sets RelocationRequest.status = WITHDRAWN"
          - "increments RelocationRequest.version by 1"
      - from: CHANGES_REQUESTED
        to: WITHDRAWN
        trigger: "POST /franchise/relocation-requests/{id}/withdraw"
        actor: FranchiseOwner
        preconditions:
          - "request.status IN {DRAFT, CHANGES_REQUESTED}"
          - "the club's franchisee_id == X-User-ID"
        side_effects:
          - "sets RelocationRequest.status = WITHDRAWN"
          - "increments RelocationRequest.version by 1"

  - entity: Promotion
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, WITHDRAWN_BY_BRAND]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /franchise/promotions/{id}/review with decision=APPROVE"
        actor: BrandAdministrator
        preconditions:
          - "promotion.status == PENDING_REVIEW"
          - "promotion.discount_pct <= MAX_FRANCHISE_DISCOUNT_PCT"
          - "the owning Franchisee.status == ACTIVE"
          - "no other Promotion with the same (franchisee_id, plan_template_id) and status IN {PENDING_REVIEW, APPROVED} violates the cooling-gap window rule"
        side_effects:
          - "sets Promotion.status = APPROVED and reviewed_by_user_id = X-User-ID"
          - "increments Promotion.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /franchise/promotions/{id}/review with decision=REJECT"
        actor: BrandAdministrator
        preconditions:
          - "promotion.status == PENDING_REVIEW"
        side_effects:
          - "sets Promotion.status = REJECTED and reviewed_by_user_id = X-User-ID"
          - "increments Promotion.version by 1"
      - from: APPROVED
        to: WITHDRAWN_BY_BRAND
        trigger: "system event: the owning Franchisee.status flipped ACTIVE -> PROBATION"
        actor: system
        preconditions:
          - "promotion.status == APPROVED"
        side_effects:
          - "sets Promotion.status = WITHDRAWN_BY_BRAND and withdrawn_reason = 'FRANCHISEE_PROBATION'"
          - "increments Promotion.version by 1"
          - "does NOT touch effective_monthly_dues_cents on any MembershipAgreement that quoted this promotion - already-signed pricing is pinned"
        note: "Cascade link 3 of the inspection probation chain."

  - entity: Franchisee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system event: any recomputation of Franchisee.compliance_score produced a value < PROBATION_SCORE_THRESHOLD"
        actor: system
        preconditions:
          - "franchisee.status == ACTIVE"
          - "the freshly recomputed compliance_score < PROBATION_SCORE_THRESHOLD"
        side_effects:
          - "sets Franchisee.status = PROBATION"
          - "transitions every Promotion of this franchisee with status == APPROVED to WITHDRAWN_BY_BRAND"
          - "increments Franchisee.version by 1"
        note: "Cascade link 2/3 of the inspection probation chain; the demotion is what triggers the promotion withdrawal, not the inspection itself."
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /franchise/franchisees/{id}/reinstate"
        actor: BrandAdministrator
        preconditions:
          - "franchisee.status == PROBATION"
          - "franchisee.compliance_score >= PROBATION_SCORE_THRESHOLD"
        side_effects:
          - "sets Franchisee.status = ACTIVE"
          - "increments Franchisee.version by 1"
          - "does NOT restore WITHDRAWN_BY_BRAND promotions - a new promotion must be filed"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "system event: the member's agreement_count reached 0 after an agreement moved to CANCELLED"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "member.agreement_count == 0"
        side_effects:
          - "sets Member.status = INACTIVE"
          - "increments Member.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "system event: a new MembershipAgreement was created for this member"
        actor: system
        preconditions:
          - "member.status == INACTIVE"
        side_effects:
          - "sets Member.status = ACTIVE"
          - "increments Member.version by 1"

  - entity: CorporateAccount
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /franchise/corporate-accounts/{id}/suspend"
        actor: BrandAdministrator
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "sets CorporateAccount.status = SUSPENDED"
          - "increments CorporateAccount.version by 1"
          - "leaves pool_balance_cents, allocated_cents and lifetime_funded_cents untouched, so an already funded pool may still be allocated"

  - entity: MembershipAgreement
    dimension: agreement_status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system event: the first BillingEvent with event_type == PAYMENT_RECEIVED is posted for this agreement via POST /franchise/billing-events"
        actor: system
        preconditions:
          - "agreement.agreement_status == PENDING"
          - "the posted event_type == PAYMENT_RECEIVED and amount_cents > 0"
        side_effects:
          - "sets MembershipAgreement.agreement_status = ACTIVE"
          - "increments Club.active_agreement_count by 1 on the home club and recomputes Club.collections_watch"
          - "recomputes Franchisee.compliance_score for the home club's franchisee"
          - "increments MembershipAgreement.version and Club.version by 1 each"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /franchise/agreements/{id}/freeze"
        actor: ClubManager
        preconditions:
          - "agreement.agreement_status == ACTIVE"
          - "agreement.home_club_id == X-User-ID"
          - "agreement.dues_status IN {CURRENT, PAST_DUE}"
        side_effects:
          - "sets MembershipAgreement.agreement_status = FROZEN"
          - "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null (FROZEN agreements leave the enrolment count)"
          - "increments MembershipAgreement.version by 1"
        note: "Club.active_agreement_count is unchanged - FROZEN still counts as active for the collections-watch denominator."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /franchise/agreements/{id}/unfreeze"
        actor: ClubManager
        preconditions:
          - "agreement.agreement_status == FROZEN"
          - "agreement.home_club_id == X-User-ID"
        side_effects:
          - "sets MembershipAgreement.agreement_status = ACTIVE"
          - "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null"
          - "increments MembershipAgreement.version by 1"
        note: "The ACTIVE <-> FROZEN cycle runs independently of dues_status, which keeps advancing from billing events while the agreement is FROZEN."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /franchise/agreements/{id}/request-cancellation, statutory cooling-off branch"
        actor: Member
        preconditions:
          - "agreement.agreement_status == ACTIVE"
          - "agreement.dues_status NOT IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}"
          - "clock_date - agreement.signed_on <= STATE_STATUTES[agreement.state_code].cooling_off_days"
        side_effects:
          - "sets cancellation_requested_on = clock_date, cancellation_effective_on = clock_date"
          - "sets refund_cents = initiation_fee_cents + dues_paid_cents, early_termination_fee_cents = 0, net_settlement_cents = refund_cents"
          - "sets agreement_status = CANCELLED"
          - "decrements Club.active_agreement_count by 1, recomputes Club.delinquent_member_count and Club.collections_watch (cascade link 1)"
          - "because the club counters moved, recomputes Franchisee.compliance_score (cascade link 2)"
          - "decrements Member.agreement_count by 1 and, if it reaches 0, sets Member.status = INACTIVE (cascade link 1b)"
          - "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null"
          - "increments MembershipAgreement.version, Club.version and Member.version by 1 each"
        note: "Cooling-off cancellation is immediate and unwinds every cent collected; no notice period applies."
      - from: ACTIVE
        to: CANCELLATION_PENDING
        trigger: "POST /franchise/agreements/{id}/request-cancellation, statutory notice branch"
        actor: Member
        preconditions:
          - "agreement.agreement_status == ACTIVE"
          - "agreement.dues_status NOT IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}"
          - "clock_date - agreement.signed_on > STATE_STATUTES[agreement.state_code].cooling_off_days"
        side_effects:
          - "sets cancellation_requested_on = clock_date and cancellation_effective_on = clock_date + agreement.cancellation_notice_days days"
          - "sets refund_cents, early_termination_fee_cents and net_settlement_cents from calculations.cancellation_settlement"
          - "sets agreement_status = CANCELLATION_PENDING"
          - "leaves Club.active_agreement_count and Member.agreement_count unchanged - the membership is still live through the notice period"
          - "increments MembershipAgreement.version by 1"
        note: "Branch divergence against the cooling-off arm - same endpoint, same actor, disjoint side-effect sets."
      - from: CANCELLATION_PENDING
        to: CANCELLED
        trigger: "POST /franchise/agreements/{id}/finalize-cancellation"
        actor: ClubManager
        preconditions:
          - "agreement.agreement_status == CANCELLATION_PENDING"
          - "agreement.home_club_id == X-User-ID"
          - "clock_date >= agreement.cancellation_effective_on"
        side_effects:
          - "sets agreement_status = CANCELLED"
          - "decrements Club.active_agreement_count by 1, recomputes Club.delinquent_member_count and Club.collections_watch"
          - "recomputes Franchisee.compliance_score"
          - "decrements Member.agreement_count by 1 and, if it reaches 0, sets Member.status = INACTIVE"
          - "recomputes CorporateAccount.enrolled_agreement_count when corporate_account_id is not null"
          - "increments MembershipAgreement.version, Club.version and Member.version by 1 each"

  - entity: MembershipAgreement
    dimension: dues_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /franchise/billing-events - the projection left outstanding_balance_cents > 0 with delinquency_days between 1 and DELINQUENCY_DAYS_THRESHOLD - 1"
        actor: system
        preconditions:
          - "agreement.dues_status IN {CURRENT, PAST_DUE, DELINQUENT}"
          - "the freshly projected delinquency_days is 1..29"
        side_effects:
          - "sets dues_status = PAST_DUE"
          - "recomputes Club.delinquent_member_count and Club.collections_watch (PAST_DUE is NOT delinquent, so both may stay unchanged)"
          - "increments MembershipAgreement.version by 1"
      - from: PAST_DUE
        to: DELINQUENT
        trigger: "POST /franchise/billing-events - the projection left delinquency_days >= DELINQUENCY_DAYS_THRESHOLD"
        actor: system
        preconditions:
          - "agreement.dues_status IN {CURRENT, PAST_DUE, DELINQUENT}"
          - "the freshly projected delinquency_days >= DELINQUENCY_DAYS_THRESHOLD"
        side_effects:
          - "sets dues_status = DELINQUENT (cascade link 1)"
          - "because the agreement became delinquent, increments Club.delinquent_member_count and recomputes Club.collections_watch (cascade link 2)"
          - "because Club.collections_watch flipped to true, recomputes Franchisee.compliance_score and, if it fell below PROBATION_SCORE_THRESHOLD, demotes the franchisee (cascade link 3)"
          - "increments MembershipAgreement.version, Club.version and Franchisee.version by 1 each"
      - from: DELINQUENT
        to: PAST_DUE
        trigger: "POST /franchise/billing-events with event_type == PAYMENT_RECEIVED that satisfies the oldest unpaid dues rows but leaves a balance under DELINQUENCY_DAYS_THRESHOLD days old"
        actor: system
        preconditions:
          - "agreement.dues_status == DELINQUENT"
          - "the freshly projected delinquency_days is 1..29"
        side_effects:
          - "sets dues_status = PAST_DUE"
          - "decrements Club.delinquent_member_count and recomputes Club.collections_watch"
          - "recomputes Franchisee.compliance_score"
          - "increments MembershipAgreement.version and Club.version by 1 each"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /franchise/billing-events with event_type == PAYMENT_RECEIVED that drives outstanding_balance_cents <= 0"
        actor: system
        preconditions:
          - "agreement.dues_status IN {PAST_DUE, DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}"
          - "the freshly projected outstanding_balance_cents <= 0"
        side_effects:
          - "sets dues_status = CURRENT and delinquency_days = 0"
          - "decrements Club.delinquent_member_count when the prior status was IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF} and recomputes Club.collections_watch"
          - "recomputes Franchisee.compliance_score"
          - "increments MembershipAgreement.version and Club.version by 1 each"
        note: "This is the only escape from the sticky IN_COLLECTIONS / WRITTEN_OFF states."
      - from: DELINQUENT
        to: IN_COLLECTIONS
        trigger: "POST /franchise/agreements/{id}/place-in-collections"
        actor: BillingPartner
        preconditions:
          - "agreement.dues_status == DELINQUENT"
          - "agreement.delinquency_days >= COLLECTIONS_DAYS_THRESHOLD"
        side_effects:
          - "sets dues_status = IN_COLLECTIONS"
          - "appends a system BillingEvent with event_type = COLLECTION_PLACED, amount_cents = 0, source = SYSTEM"
          - "keeps Club.delinquent_member_count unchanged (both DELINQUENT and IN_COLLECTIONS count as delinquent)"
          - "increments MembershipAgreement.version by 1"
      - from: IN_COLLECTIONS
        to: WRITTEN_OFF
        trigger: "POST /franchise/billing-events with event_type == WRITE_OFF"
        actor: system
        preconditions:
          - "agreement.dues_status == IN_COLLECTIONS"
          - "the WRITE_OFF amount_cents <= agreement.outstanding_balance_cents"
        side_effects:
          - "sets dues_status = WRITTEN_OFF when the projected outstanding_balance_cents is still > 0, otherwise CURRENT"
          - "recomputes outstanding_balance_cents from the projection"
          - "increments MembershipAgreement.version by 1"

  - entity: TransferRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /franchise/transfer-requests/{id}/decide with decision=APPROVE"
        actor: ClubManager
        preconditions:
          - "request.status == REQUESTED"
          - "request.to_club_id == X-User-ID (only the receiving club decides)"
          - "the receiving Club.status == OPEN"
          - "the receiving Club.equipment_compliance_state != NON_COMPLIANT"
          - "the agreement's dues_status IN {CURRENT, PAST_DUE}"
        side_effects:
          - "sets TransferRequest.status = APPROVED and decided_by_user_id = X-User-ID"
          - "pins TransferRequest.transfer_fee_cents from calculations.transfer_fee"
          - "increments TransferRequest.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /franchise/transfer-requests/{id}/decide with decision=DENY"
        actor: ClubManager
        preconditions:
          - "request.status == REQUESTED"
          - "request.to_club_id == X-User-ID"
        side_effects:
          - "sets TransferRequest.status = DENIED and decided_by_user_id = X-User-ID"
          - "leaves transfer_fee_cents null and the agreement untouched"
          - "increments TransferRequest.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /franchise/transfer-requests/{id}/complete"
        actor: ClubManager
        preconditions:
          - "request.status == APPROVED"
          - "request.to_club_id == X-User-ID"
          - "the agreement's home_club_id still equals request.from_club_id"
        side_effects:
          - "sets TransferRequest.status = COMPLETED and effective_on = clock_date"
          - "rewrites MembershipAgreement.home_club_id to request.to_club_id and increments transfer_count by 1 (cascade link 1)"
          - "because the agreement's home club moved, decrements the releasing Club.active_agreement_count / delinquent_member_count and increments the receiving Club's, recomputing collections_watch on both (cascade link 2)"
          - "because the releasing club's collections_watch may have flipped, recomputes Franchisee.compliance_score for both clubs' franchisees (cascade link 3)"
          - "when transfer_fee_cents > 0, appends a system BillingEvent with event_type = TRANSFER_FEE_POSTED, amount_cents = transfer_fee_cents, due_on = clock_date + TRANSFER_FEE_DUE_DAYS days, source = SYSTEM, and re-runs the dues projection"
          - "leaves MembershipAgreement.state_code and effective_monthly_dues_cents pinned at their signing values"
          - "increments TransferRequest.version, MembershipAgreement.version, and both Club.version values by 1 each"

  - entity: UsageSettlement
    initial_state: OPEN
    terminal_states: [REVERSED]
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "POST /franchise/usage-settlements/{id}/post"
        actor: BrandAdministrator
        preconditions:
          - "settlement.status == OPEN"
          - "settlement.net_payable_cents >= 0"
        side_effects:
          - "decrements the home Club.settlement_ledger_cents by settlement.net_payable_cents"
          - "increments the host Club.settlement_ledger_cents by settlement.net_payable_cents"
          - "sets UsageSettlement.status = POSTED and posted_on = clock_date"
          - "increments UsageSettlement.version and both Club.version values by 1 each"
        note: "Conserved quantity - the sum of Club.settlement_ledger_cents over every Club stays exactly 0."
      - from: POSTED
        to: REVERSED
        trigger: "POST /franchise/usage-settlements/{id}/reverse"
        actor: BrandAdministrator
        preconditions:
          - "settlement.status == POSTED"
        side_effects:
          - "increments the home Club.settlement_ledger_cents by settlement.net_payable_cents and decrements the host Club's by the same amount"
          - "clears GuestUsageEvent.settlement_id back to null on every swept entry, making them eligible for a later settlement again"
          - "sets UsageSettlement.status = REVERSED and reversed_on = clock_date"
          - "increments UsageSettlement.version and both Club.version values by 1 each"
        note: "Compensating action - both club ledgers and the sweep flags return to their pre-post values with zero drift."

  - entity: RoyaltyReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, ADJUSTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system event: POST /franchise/royalty-reports produced abs(variance_pct) <= ROYALTY_VARIANCE_TOLERANCE_PCT"
        actor: system
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "sets RoyaltyReport.status = ACCEPTED"
          - "increments RoyaltyReport.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "system event: POST /franchise/royalty-reports produced abs(variance_pct) > ROYALTY_VARIANCE_TOLERANCE_PCT"
        actor: system
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "sets RoyaltyReport.status = DISPUTED"
          - "increments Franchisee.disputed_royalty_count by 1 and recomputes Franchisee.compliance_score, demoting the franchisee when it falls below PROBATION_SCORE_THRESHOLD"
          - "increments RoyaltyReport.version and Franchisee.version by 1 each"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /franchise/royalty-reports/{id}/adjudicate"
        actor: BrandAdministrator
        preconditions:
          - "report.status == DISPUTED"
          - "body adjusted_royalty_cents is between report.royalty_due_cents and report.reported_royalty_cents inclusive"
        side_effects:
          - "sets RoyaltyReport.status = ADJUSTED, adjusted_royalty_cents = body value, adjudicated_by_user_id = X-User-ID"
          - "decrements Franchisee.disputed_royalty_count by 1 and recomputes Franchisee.compliance_score"
          - "increments RoyaltyReport.version and Franchisee.version by 1 each"

  - entity: FacilityInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: SCORED
        trigger: "POST /franchise/inspections/{id}/score"
        actor: ComplianceAuditor
        preconditions:
          - "inspection.status == SCHEDULED"
          - "the inspected Club.status IN {PRE_OPENING, OPEN, SUSPENDED}"
        side_effects:
          - "selects the refresh-cycle variant, then sets refresh_cycle_months_applied, refresh_pts, score and variant_applied from calculations.inspection_score"
          - "sets scored_by_user_id = X-User-ID"
          - "sets Club.last_inspection_score and re-derives Club.equipment_compliance_state (cascade link 1)"
          - "because Club.equipment_compliance_state became NON_COMPLIANT, sets Club.status = SUSPENDED; because it became COMPLIANT or WATCH from a SUSPENDED club, sets Club.status = OPEN (cascade link 1b)"
          - "recomputes Franchisee.inspection_fail_streak and Franchisee.compliance_score (cascade link 2)"
          - "because compliance_score fell below PROBATION_SCORE_THRESHOLD, sets Franchisee.status = PROBATION, which withdraws every APPROVED Promotion of that franchisee (cascade link 3)"
          - "auto-resolves this inspection to CLOSED when score >= REMEDIATION_SCORE_THRESHOLD, otherwise to REMEDIATION_REQUIRED"
          - "increments FacilityInspection.version, Club.version and Franchisee.version by 1 each"
      - from: SCORED
        to: CLOSED
        trigger: "system event: the freshly computed score >= REMEDIATION_SCORE_THRESHOLD"
        actor: system
        preconditions:
          - "inspection.status == SCORED"
          - "inspection.score >= REMEDIATION_SCORE_THRESHOLD"
        side_effects:
          - "sets FacilityInspection.status = CLOSED"
      - from: SCORED
        to: REMEDIATION_REQUIRED
        trigger: "system event: the freshly computed score < REMEDIATION_SCORE_THRESHOLD"
        actor: system
        preconditions:
          - "inspection.status == SCORED"
          - "inspection.score < REMEDIATION_SCORE_THRESHOLD"
        side_effects:
          - "sets FacilityInspection.status = REMEDIATION_REQUIRED"
      - from: REMEDIATION_REQUIRED
        to: REMEDIATION_WAIVED
        trigger: "POST /franchise/inspections/{id}/waive-remediation"
        actor: ComplianceAuditor
        preconditions:
          - "inspection.status == REMEDIATION_REQUIRED"
          - "X-User-ID != inspection.scored_by_user_id (segregation of duties)"
        side_effects:
          - "sets FacilityInspection.status = REMEDIATION_WAIVED, waived_by_user_id = X-User-ID, waiver_reason = body reason"
          - "sets Club.equipment_compliance_state = WATCH and, if the club was SUSPENDED, Club.status = OPEN"
          - "does NOT reset Franchisee.inspection_fail_streak, but recomputes Franchisee.compliance_score with the unchanged streak"
          - "increments FacilityInspection.version and Club.version by 1 each"
      - from: REMEDIATION_WAIVED
        to: CLOSED
        trigger: "POST /franchise/inspections/{id}/close"
        actor: BrandAdministrator
        preconditions:
          - "inspection.status IN {REMEDIATION_REQUIRED, REMEDIATION_WAIVED}"
        side_effects:
          - "sets FacilityInspection.status = CLOSED"
          - "increments FacilityInspection.version by 1"
      - from: REMEDIATION_REQUIRED
        to: CLOSED
        trigger: "POST /franchise/inspections/{id}/close"
        actor: BrandAdministrator
        preconditions:
          - "inspection.status IN {REMEDIATION_REQUIRED, REMEDIATION_WAIVED}"
        side_effects:
          - "sets FacilityInspection.status = CLOSED"
          - "increments FacilityInspection.version by 1"
        note: "Closing a REMEDIATION_REQUIRED inspection does not lift the club suspension - only a waiver or a passing re-inspection does."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: agreement-create-stale-club
    parent_entity: Club
    write_endpoint: "POST /franchise/agreements"
    occ_field: "expected_club_version"
    description: |
      Signing a MembershipAgreement against a Club whose version has advanced since
      the client last read it is rejected. A club legitimately accepts any number of
      agreements, so the second submission is not blocked by any state precondition -
      but the club's pricing posture (guest_fee_cents), compliance posture
      (equipment_compliance_state, status) and counters may all have moved between the
      read and the write, so an agreement quoted off a stale club snapshot must be
      refused rather than silently signed at the old posture.
    error_id: ERR_STALE_CLUB_VERSION
    http_status: 412

  - rule_id: transfer-create-stale-agreement
    parent_entity: MembershipAgreement
    write_endpoint: "POST /franchise/transfer-requests"
    occ_field: "expected_agreement_version"
    description: |
      Opening a TransferRequest against a MembershipAgreement whose version has
      advanced since the client last read it is rejected. An agreement may carry many
      transfer requests over its life, so a second request is not blocked by any state
      precondition - but a billing event, a freeze, or a completed earlier transfer may
      have moved the agreement's home club or dues_status in between, which would make
      the from_club_id and the arrears eligibility of the new request stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: effective_monthly_dues
    trigger: "POST /franchise/agreements (agreement creation); writes promo_discount_cents, corporate_credit_cents, multi_club_credit_cents and effective_monthly_dues_cents onto the new MembershipAgreement"
    algorithm: tiered_pricing
    formula: |
      base = MembershipPlanTemplate.monthly_dues_cents            # pinned into monthly_dues_base_cents
      # --- STEP 1: each discount component is rounded to whole cents INDEPENDENTLY ---
      promo_discount_cents      = promotion_id is null ? 0 : round_half_up(base * Promotion.discount_pct)
      corporate_credit_cents    = corporate_account_id is null ? 0 : round_half_up(base * CorporateAccount.corporate_credit_pct)
      multi_club_credit_cents   = multi_club_access == false ? 0 : round_half_up(base * MULTI_CLUB_CREDIT_PCT)
      # --- STEP 2: sum the ALREADY-ROUNDED components ---
      total_discount_cents = promo_discount_cents + corporate_credit_cents + multi_club_credit_cents
      # --- STEP 3: subtract, then apply the brand floor LAST ---
      gross_cents     = base - total_discount_cents
      effective_monthly_dues_cents = max(gross_cents, MembershipPlanTemplate.floor_price_cents)
      # The floor is a hard gate, not a clamp: if gross_cents < floor_price_cents the
      # request is REJECTED with ERR_PRICE_BELOW_FLOOR before this max() is ever stored.
    input_set: "Exactly one MembershipPlanTemplate with status == PUBLISHED, at most one Promotion with status == APPROVED whose [starts_on, ends_on] closed window contains the logical clock date, and at most one CorporateAccount with status == ACTIVE."
    constants:
      MULTI_CLUB_CREDIT_PCT: 0.015
      MAX_FRANCHISE_DISCOUNT_PCT: 0.30
      PROMO_COOLING_GAP_DAYS: 7
    precision: "Integer cents throughout. ROUND_HALF_UP is applied ONCE PER COMPONENT in step 1 and never again; the pinned order is round-each-then-sum-then-subtract-then-floor. Summing the three unrounded fractional components and rounding once at the end is the forbidden alternative and yields a different cent value."
    variants: []

  - name: royalty_due
    trigger: "POST /franchise/royalty-reports; writes verified_member_count, reported_dues_basis_cents, verified_dues_basis_cents, reported_royalty_cents, royalty_due_cents and variance_pct onto the new RoyaltyReport, and drives the SUBMITTED -> ACCEPTED / DISPUTED auto-transition"
    algorithm: aggregation
    formula: |
      period_end = last calendar day of RoyaltyReport.period_month
      qualifying = every MembershipAgreement A where
                     Club[A.home_club_id].franchisee_id == RoyaltyReport.franchisee_id
                     AND A.agreement_status IN {ACTIVE, CANCELLATION_PENDING}
                     AND A.signed_on <= period_end
                   # FROZEN, PENDING and CANCELLED agreements are excluded from BOTH bases
      verified_member_count     = count(qualifying)
      verified_dues_basis_cents = sum(A.effective_monthly_dues_cents for A in qualifying)
      reported_dues_basis_cents = RoyaltyReport.reported_member_count * BRAND_STANDARD_DUES_CENTS
      reported_royalty_cents    = round_half_up(reported_dues_basis_cents * Franchisee.royalty_rate_bps / 10000)
      royalty_due_cents         = round_half_up(verified_dues_basis_cents * Franchisee.royalty_rate_bps / 10000)
      variance_pct = verified_member_count == 0
                       ? (reported_member_count == 0 ? 0.00 : 100.00)
                       : round_half_up((reported_member_count - verified_member_count) * 100 / verified_member_count, 2)
      status = abs(variance_pct) > ROYALTY_VARIANCE_TOLERANCE_PCT ? DISPUTED : ACCEPTED
    input_set: "Agreements are selected by home club ownership at submission time and filtered by signed_on <= period_end; the agreement's current agreement_status is used (no historical replay)."
    constants:
      BRAND_STANDARD_DUES_CENTS: 4500
      ROYALTY_VARIANCE_TOLERANCE_PCT: 5.00
    precision: "Integer cents, ROUND_HALF_UP after the basis is summed (sum-then-round, never round-per-agreement). variance_pct carries 2 decimal places."
    variants:
      - name: reported_basis
        when: "Always computed and stored in reported_royalty_cents; it is the franchisee's self-declared count multiplied by the brand list price, ignoring every promotion, corporate credit and multi-club credit."
        difference: "Uses reported_member_count * BRAND_STANDARD_DUES_CENTS as the basis, so a franchisee that over-reports heads or sells at list price produces a larger royalty than the ledger supports."
      - name: verified_basis
        when: "Always computed and stored in royalty_due_cents; this is the only variant ever billed."
        difference: "Uses the summed effective_monthly_dues_cents of qualifying agreements, which is net of every discount component, so identical inputs produce a strictly different number than reported_basis whenever any agreement carries a discount or the reported count is wrong."

  - name: inspection_score
    trigger: "POST /franchise/inspections/{id}/score (FacilityInspection SCHEDULED -> SCORED); writes refresh_cycle_months_applied, refresh_pts, score and variant_applied"
    algorithm: weighted_scoring
    formula: |
      # variant selection FIRST - it decides refresh_cycle_months_applied
      accelerated = (Club.opened_on < ACCELERATED_MANDATE_DATE)
                    OR (Club.equipment_compliance_state == WATCH)
      refresh_cycle_months_applied = accelerated ? ACCELERATED_REFRESH_CYCLE_MONTHS
                                                 : BRAND_REFRESH_CYCLE_MONTHS
      variant_applied = accelerated ? ACCELERATED_CYCLE : STANDARD_CYCLE
      # equipment refresh sub-score, floored at 0 (an over-age floor can never earn negative points)
      refresh_pts = max(0, 100 - round_half_up(100 * equipment_age_months_max / refresh_cycle_months_applied, 0))
      # single weighted sum, rounded ONCE at the end
      score = round_half_up( 0.40 * equipment_condition_pts
                           + 0.25 * cleanliness_pts
                           + 0.20 * safety_pts
                           + 0.15 * refresh_pts , 0)
      # derived club posture
      Club.equipment_compliance_state = score >= 85 ? COMPLIANT : (score >= 70 ? WATCH : NON_COMPLIANT)
    input_set: "The four sub-scores supplied in the score request body plus the inspected Club's opened_on and current equipment_compliance_state. No other inspection contributes."
    constants:
      BRAND_REFRESH_CYCLE_MONTHS: 60
      ACCELERATED_REFRESH_CYCLE_MONTHS: 42
      ACCELERATED_MANDATE_DATE: "2020-01-01"
      REMEDIATION_SCORE_THRESHOLD: 70
    precision: "refresh_pts is rounded to an integer BEFORE it is weighted; the weighted sum is then rounded ONCE with ROUND_HALF_UP to an integer score. Rounding the weighted sum first or skipping the refresh_pts rounding changes the result."
    variants:
      - name: standard_cycle
        when: "Club.opened_on >= 2020-01-01 AND Club.equipment_compliance_state != WATCH"
        difference: "Divides equipment_age_months_max by 60, so a 54-month-old floor still earns 10 refresh points."
      - name: accelerated_cycle
        when: "Club.opened_on < 2020-01-01 OR Club.equipment_compliance_state == WATCH"
        difference: "Divides equipment_age_months_max by 42, so the same 54-month-old floor earns 0 refresh points and the identical four sub-scores land on the other side of REMEDIATION_SCORE_THRESHOLD."

  - name: usage_settlement_net
    trigger: "POST /franchise/usage-settlements (settlement creation); writes event_count, visit_count, gross_fee_cents, admin_hold_cents, net_before_rebate_cents, rebate_pct, volume_rebate_cents and net_payable_cents"
    algorithm: waterfall_allocation
    formula: |
      swept = every GuestUsageEvent E where
                E.settlement_id IS NULL
                AND E.period_month == UsageSettlement.period_month
                AND E.host_club_id == UsageSettlement.host_club_id
                AND E.home_club_id_at_visit == UsageSettlement.home_club_id
              ordered by (E.created_at ASC)
      if swept is empty -> reject with ERR_NO_SETTLEABLE_USAGE
      event_count             = count(swept)
      visit_count             = sum(E.visit_count for E in swept)
      gross_fee_cents         = sum(E.usage_fee_cents for E in swept)
      # --- pinned evaluation order for the circular-looking rebate dependency ---
      # (1) hold is keyed on gross
      admin_hold_cents        = round_half_up(gross_fee_cents * ADMIN_HOLD_PCT)
      # (2) net_before_rebate is gross minus hold
      net_before_rebate_cents = gross_fee_cents - admin_hold_cents
      # (3) the rebate TIER IS KEYED ON net_before_rebate_cents ONLY - never on
      #     gross_fee_cents and never on the final net_payable_cents
      rebate_pct              = net_before_rebate_cents <  REBATE_TIER_1_FLOOR ? 0.00
                              : net_before_rebate_cents <  REBATE_TIER_2_FLOOR ? 0.03
                              :                                                  0.06
      # (4) only now is the rebate money computed
      volume_rebate_cents     = round_half_up(net_before_rebate_cents * rebate_pct)
      net_payable_cents       = net_before_rebate_cents - volume_rebate_cents
    input_set: "Only unsettled GuestUsageEvent rows (settlement_id IS NULL) matching the settlement's period_month, host club and home_club_id_at_visit snapshot. Rows released by a REVERSED settlement become eligible again."
    constants:
      ADMIN_HOLD_PCT: 0.08
      REBATE_TIER_1_FLOOR: 50000
      REBATE_TIER_2_FLOOR: 100000
    precision: "Integer cents; ROUND_HALF_UP applied once at step (1) and once at step (4). Re-keying the tier on the final net_payable_cents produces a fixed-point disagreement and is forbidden."
    variants: []

  - name: dues_ledger_projection
    trigger: "POST /franchise/billing-events, POST /franchise/agreements/{id}/place-in-collections, and the system TRANSFER_FEE_POSTED event appended by POST /franchise/transfer-requests/{id}/complete; writes outstanding_balance_cents, dues_paid_cents, delinquency_days, dues_status and the event's resulting_outstanding_balance_cents"
    algorithm: projection
    formula: |
      events = every BillingEvent for this agreement, ordered by (occurred_on ASC, created_at ASC)
      charges = events with event_type IN {DUES_POSTED, TRANSFER_FEE_POSTED}, ordered by (due_on ASC, created_at ASC)
      payments_total = sum(amount_cents for events with event_type == PAYMENT_RECEIVED)
      writeoff_total = sum(amount_cents for events with event_type == WRITE_OFF)
      dues_paid_cents = payments_total
      outstanding_balance_cents = sum(amount_cents for charges) - payments_total - writeoff_total
      # FIFO application decides WHICH charge is the oldest unsatisfied one
      credit = payments_total + writeoff_total
      earliest_unsatisfied_due_on = null
      for c in charges:                      # strict (due_on ASC, created_at ASC) order
          if credit >= c.amount_cents: credit -= c.amount_cents
          else: earliest_unsatisfied_due_on = c.due_on; break
      if outstanding_balance_cents <= 0 or earliest_unsatisfied_due_on is null:
          delinquency_days = 0
      else:
          delinquency_days = max(0, clock_date - earliest_unsatisfied_due_on in whole days)
      # dues_status resolution
      if outstanding_balance_cents <= 0:                       dues_status = CURRENT
      elif prior dues_status IN {IN_COLLECTIONS, WRITTEN_OFF}:  dues_status = prior dues_status   # sticky
      elif delinquency_days >= DELINQUENCY_DAYS_THRESHOLD:      dues_status = DELINQUENT
      elif delinquency_days >= 1:                               dues_status = PAST_DUE
      else:                                                     dues_status = CURRENT
    input_set: "Every BillingEvent of the agreement, including SYSTEM-sourced TRANSFER_FEE_POSTED and COLLECTION_PLACED rows. PAYMENT_FAILED and COLLECTION_PLACED carry amount_cents == 0 and move no money."
    constants:
      DELINQUENCY_DAYS_THRESHOLD: 30
      COLLECTIONS_DAYS_THRESHOLD: 60
    precision: "Integer cents; whole-day date arithmetic against the logical clock date. delinquency_days == 29 is PAST_DUE and delinquency_days == 30 is DELINQUENT (>= comparison at the boundary)."
    variants: []

  - name: cancellation_settlement
    trigger: "POST /franchise/agreements/{id}/request-cancellation (both the ACTIVE -> CANCELLED cooling-off branch and the ACTIVE -> CANCELLATION_PENDING notice branch); writes refund_cents, early_termination_fee_cents, net_settlement_cents and cancellation_effective_on"
    algorithm: threshold
    formula: |
      statute        = STATE_STATUTES[MembershipAgreement.state_code]
      days_since     = clock_date - signed_on in whole days
      # ---- BRANCH A: statutory cooling-off window ----
      if days_since <= statute.cooling_off_days:
          cancellation_effective_on   = clock_date
          refund_cents                = initiation_fee_cents + dues_paid_cents
          early_termination_fee_cents = 0
      # ---- BRANCH B: contractual notice period ----
      else:
          cancellation_effective_on = clock_date + cancellation_notice_days days
          paid_through_periods = floor(dues_paid_cents / effective_monthly_dues_cents)
          paid_through_on      = signed_on + 30 * paid_through_periods days
          unused_days          = paid_through_on - cancellation_effective_on in whole days
          refund_cents = (statute.prorate_on_cancel AND unused_days > 0)
                           ? round_half_up(effective_monthly_dues_cents * unused_days / 30)
                           : 0
          months_remaining = max(0, ceil((term_end_on - cancellation_effective_on in whole days) / 30))
          early_termination_fee_cents = min(round_half_up(effective_monthly_dues_cents * EARLY_TERM_MONTHLY_PCT) * months_remaining,
                                            EARLY_TERM_FEE_CAP_CENTS)
      net_settlement_cents = refund_cents - early_termination_fee_cents
    input_set: "The single agreement being cancelled plus its own BillingEvent-derived dues_paid_cents. Agreements with dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF} never reach this calculation - they are rejected with ERR_CANCELLATION_BLOCKED_BY_ARREARS."
    constants:
      EARLY_TERM_MONTHLY_PCT: 0.5
      EARLY_TERM_FEE_CAP_CENTS: 15000
      STATE_STATUTES:
        CA: { cooling_off_days: 5, max_notice_days: 30, prorate_on_cancel: true,  cross_state_transfer_allowed: false }
        TX: { cooling_off_days: 3, max_notice_days: 30, prorate_on_cancel: true,  cross_state_transfer_allowed: true }
        NY: { cooling_off_days: 3, max_notice_days: 15, prorate_on_cancel: false, cross_state_transfer_allowed: true }
    precision: "Integer cents. The monthly early-termination charge is rounded to whole cents BEFORE it is multiplied by months_remaining, and the cap is applied AFTER the multiplication. A 30-day month convention is used for every period arithmetic step."
    variants: []

  - name: transfer_fee
    trigger: "POST /franchise/transfer-requests/{id}/decide with decision=APPROVE (TransferRequest REQUESTED -> APPROVED); pins TransferRequest.transfer_fee_cents"
    algorithm: threshold
    formula: |
      if Club[from_club_id].franchisee_id == Club[to_club_id].franchisee_id:
          transfer_fee_cents = 0                       # intra-franchise moves are free
      else:
          transfer_fee_cents = TRANSFER_FEE_BASE_CENTS
                             + round_half_up(MembershipAgreement.effective_monthly_dues_cents * CROSS_FRANCHISE_TRANSFER_PCT)
    input_set: "The two clubs named on the request plus the agreement's pinned effective_monthly_dues_cents."
    constants:
      TRANSFER_FEE_BASE_CENTS: 2500
      CROSS_FRANCHISE_TRANSFER_PCT: 0.5
      TRANSFER_FEE_DUE_DAYS: 15
    precision: "Integer cents, ROUND_HALF_UP on the percentage component before adding the base."
    variants: []

  - name: territory_encroachment_slack
    trigger: "POST /franchise/territories (creation), POST /franchise/relocation-requests/{id}/submit (writes RelocationRequest.encroachment_km) and POST /franchise/relocation-requests/{id}/decide with decision=APPROVE (re-checked before the territory geometry is rewritten)"
    algorithm: constraint_propagation
    formula: |
      # planar brand-standard approximation - NO trigonometry, fixed degrees-to-km factors
      candidates = every Territory T where T.franchisee_id != subject_franchisee_id
                                       AND T.status IN {RESERVED, ACTIVE}
                                       AND T.id != subject_territory_id
      for each T in candidates:
          dy_km        = (subject_lat - T.center_lat) * KM_PER_DEG_LAT
          dx_km        = (subject_lng - T.center_lng) * KM_PER_DEG_LNG
          distance_km  = round_half_up(sqrt(dx_km*dx_km + dy_km*dy_km), 3)
          required_km  = subject_radius_km + T.protected_radius_km + PROTECTION_BUFFER_KM
          slack_km(T)  = round_half_up(distance_km - required_km, 3)
      encroachment_km = min(slack_km(T) over candidates)      # null when candidates is empty
      # rejection is STRICT: only a negative slack encroaches
      encroaches = (encroachment_km is not null AND encroachment_km < 0)
    input_set: "Only Territories belonging to a DIFFERENT franchisee with status IN {RESERVED, ACTIVE}. Two territories of the SAME franchisee may overlap freely; the subject territory itself is excluded when re-checking a relocation."
    constants:
      KM_PER_DEG_LAT: 111.0
      KM_PER_DEG_LNG: 85.0
      PROTECTION_BUFFER_KM: 0.5
      RELOCATION_REVISION_LIMIT: 2
    precision: "distance_km and slack_km are rounded to 3 decimal places with ROUND_HALF_UP. A slack of exactly 0.000 - circles separated by precisely radius_a + radius_b + buffer - is ACCEPTED; only slack < 0 is an encroachment."
    variants: []

  - name: club_delinquency_share
    trigger: "every transition that changes MembershipAgreement.dues_status or agreement_status, and POST /franchise/transfer-requests/{id}/complete; writes Club.delinquent_member_count and Club.collections_watch"
    algorithm: threshold
    formula: |
      denominator = count(MembershipAgreement A where A.home_club_id == Club.id
                          AND A.agreement_status IN {ACTIVE, FROZEN, CANCELLATION_PENDING})
      numerator   = count(those A where A.dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF})
      Club.active_agreement_count   = denominator
      Club.delinquent_member_count  = numerator
      Club.collections_watch = (denominator > 0) AND (numerator / denominator > COLLECTIONS_WATCH_SHARE)
    input_set: "Only agreements whose CURRENT home_club_id is this club - a completed transfer moves the agreement out of the releasing club's numerator and denominator in the same request."
    constants:
      COLLECTIONS_WATCH_SHARE: 0.15
    precision: "Exact rational comparison on the share; strict > at the boundary, so a share of exactly 0.15 does NOT raise the watch flag."
    variants: []

  - name: franchisee_compliance_score
    trigger: "POST /franchise/inspections/{id}/score, POST /franchise/inspections/{id}/waive-remediation, POST /franchise/billing-events, POST /franchise/agreements/{id}/place-in-collections, POST /franchise/agreements/{id}/request-cancellation, POST /franchise/agreements/{id}/finalize-cancellation, POST /franchise/transfer-requests/{id}/complete, POST /franchise/royalty-reports and POST /franchise/royalty-reports/{id}/adjudicate; writes Franchisee.inspection_fail_streak, Franchisee.collections_watch_club_count, Franchisee.disputed_royalty_count and Franchisee.compliance_score, and drives the ACTIVE -> PROBATION auto-transition"
    algorithm: weighted_scoring
    formula: |
      # fail streak: walk every SCORED-or-later inspection of every club of this franchisee
      insp = inspections I where Club[I.club_id].franchisee_id == franchisee.id
                            AND I.status IN {SCORED, REMEDIATION_REQUIRED, REMEDIATION_WAIVED, CLOSED}
                            AND I.score IS NOT NULL
             ordered by (I.inspection_date ASC, I.created_at ASC)
      inspection_fail_streak = 0
      for I in insp:
          inspection_fail_streak = (I.score < REMEDIATION_SCORE_THRESHOLD)
                                     ? inspection_fail_streak + 1
                                     : 0            # a passing inspection resets the streak
      collections_watch_club_count = count(Club C where C.franchisee_id == franchisee.id AND C.collections_watch == true)
      disputed_royalty_count       = count(RoyaltyReport R where R.franchisee_id == franchisee.id AND R.status == DISPUTED)
      compliance_score = clamp(100
                               - INSPECTION_FAIL_PENALTY * inspection_fail_streak
                               - COLLECTIONS_WATCH_PENALTY * (collections_watch_club_count > 0 ? 1 : 0)
                               - DISPUTED_ROYALTY_PENALTY * disputed_royalty_count,
                               0, 100)
      if franchisee.status == ACTIVE AND compliance_score < PROBATION_SCORE_THRESHOLD -> demote to PROBATION
    input_set: "All inspections of all clubs of the franchisee with a non-null score, in (inspection_date ASC, created_at ASC) order; the collections penalty is a flat one-off regardless of how many clubs are on watch."
    constants:
      INSPECTION_FAIL_PENALTY: 20
      COLLECTIONS_WATCH_PENALTY: 20
      DISPUTED_ROYALTY_PENALTY: 10
      PROBATION_SCORE_THRESHOLD: 70
      REMEDIATION_SCORE_THRESHOLD: 70
    precision: "Integer score clamped to 0..100. The probation gate is strict <: a score of exactly 70 keeps the franchisee ACTIVE."
    variants: []

  - name: corporate_allocation
    trigger: "POST /franchise/corporate-accounts/{id}/allocate; writes CorporateAccount.pool_balance_cents, CorporateAccount.allocated_cents and Franchisee.corporate_allocation_cents. POST /franchise/corporate-accounts/{id}/recall-allocation applies the exact inverse."
    algorithm: waterfall_allocation
    formula: |
      pool = CorporateAccount.pool_balance_cents
      eligible = every Franchisee F where F.status == ACTIVE
                                     AND F.national_account_eligible == true
                                     AND weight(F) >= 1
      weight(F) = count(MembershipAgreement A where A.corporate_account_id == account.id
                        AND A.agreement_status IN {ACTIVE, CANCELLATION_PENDING}
                        AND Club[A.home_club_id].franchisee_id == F.id)
      if eligible is empty -> reject with ERR_NO_ELIGIBLE_FRANCHISEE
      if account.allocation_method == EQUAL_SPLIT: weight(F) := 1 for every eligible F
      total_weight = sum(weight(F))
      base(F)      = floor(pool * weight(F) / total_weight)
      remainder    = pool - sum(base(F))                       # 0 <= remainder < count(eligible)
      # remainder is distributed one cent at a time, in a fully deterministic order
      order        = eligible sorted by (weight(F) DESC, F.created_at ASC)
      allocation(F)= base(F) + (1 if F is among the first `remainder` entries of `order` else 0)
      # ledger moves
      Franchisee.corporate_allocation_cents += allocation(F)   for every eligible F
      account.allocated_cents               += pool
      account.pool_balance_cents             = 0
    input_set: "Franchisees with status == ACTIVE and national_account_eligible == true that hold at least one agreement enrolled in this account with agreement_status IN {ACTIVE, CANCELLATION_PENDING}."
    constants: {}
    precision: "Integer cents with floor division and an explicit one-cent remainder waterfall, so sum(allocation(F)) == pool exactly. Ties in weight are broken by Franchisee.created_at ASC; the resource id is NEVER a tie-break input."
    variants: []

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "resource ownership for entity_backed roles on WRITE operations: a FranchiseOwner may only act on Territories, Clubs, RelocationRequests, Promotions and RoyaltyReports whose owning franchisee_id equals X-User-ID; a ClubManager may only act on a MembershipAgreement whose home_club_id equals X-User-ID, on a TransferRequest whose from_club_id (creation) or to_club_id (decide/complete) equals X-User-ID, and on a GuestUsageEvent whose host_club_id equals X-User-ID; a Member may only act on a MembershipAgreement whose member_id equals X-User-ID. BrandAdministrator, ComplianceAuditor and BillingPartner are opaque and are never ownership-scoped. GET endpoints are not ownership-scoped."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every non-GET endpoint whose path or body names a Territory, Club, RelocationRequest, Promotion, MembershipAgreement, TransferRequest, GuestUsageEvent or RoyaltyReport"

  - priority: 4
    category: schema
    check: "request body conforms to the endpoint's input schema: all required fields present, types correct, enum values within the declared set, dates ISO-8601 (YYYY-MM-DD) and period_month matching YYYY-MM, integer money fields >= 0, discount_pct and corporate_credit_pct within [0, 1], latitudes within [-90, 90], longitudes within [-180, 180], protected_radius_km > 0, visit_count >= 1, limit within [1, 100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "every referenced resource exists, validated left-to-right: path ids before body ids, and body ids in the order the endpoint's input list declares them"
    error_id: "ERR_FRANCHISEE_NOT_FOUND | ERR_TERRITORY_NOT_FOUND | ERR_CLUB_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PLAN_ASSET_NOT_FOUND | ERR_MEMBERSHIP_RECORD_NOT_FOUND | ERR_OPS_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints taking a path id or an FK in the body"

  - priority: 6
    category: state
    check: "optimistic concurrency: when the endpoint declares an expected_<parent>_version input, it must equal the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_CLUB_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /franchise/agreements, POST /franchise/transfer-requests"

  - priority: 7
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2 (e.g. only a SCHEDULED FacilityInspection can be scored, only a DRAFT or CHANGES_REQUESTED RelocationRequest can be submitted, only an OPEN UsageSettlement can be posted, only a PUBLISHED MembershipPlanTemplate can back a new agreement, only an OPEN Club can host an agreement or receive a transfer, and only a RESERVED Territory can take a new Club shell - an ACTIVE Territory is one whose club has already opened and is refused with ERR_INVALID_TERRITORY_STATE)"
    error_id: "ERR_INVALID_TERRITORY_STATE | ERR_CLUB_NOT_OPERATIONAL | ERR_INVALID_RELOCATION_STATE | ERR_PLAN_NOT_PUBLISHED | ERR_INVALID_PLAN_STATE | ERR_INVALID_PROMOTION_STATE | ERR_INVALID_AGREEMENT_STATE | ERR_INVALID_DUES_STATE | ERR_INVALID_TRANSFER_STATE | ERR_INVALID_SETTLEMENT_STATE | ERR_INVALID_INSPECTION_STATE | ERR_INVALID_ROYALTY_STATE | ERR_INVALID_ALLOCATION_STATE | ERR_CORPORATE_ACCOUNT_SUSPENDED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "segregation of duties: the X-User-ID that produced a record may not adjudicate it. The X-User-ID stored as RelocationRequest.submitted_by_user_id may not decide that request (even when presenting the BrandAdministrator role); the ComplianceAuditor X-User-ID stored as FacilityInspection.scored_by_user_id may not waive that inspection's remediation."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /franchise/relocation-requests/{id}/decide, POST /franchise/inspections/{id}/waive-remediation"

  - priority: 9
    category: business_safety
    check: "state health-club statute gates: a notice-period cancellation may not be finalized before cancellation_effective_on has been reached on the logical clock; the plan template's cancellation_notice_days may not exceed STATE_STATUTES[home club's state_code].max_notice_days, so a 30-day-notice template cannot be sold at an NY club whose statute caps notice at 15 days; a transfer whose destination club sits in a different state_code is prohibited when the agreement's own state statute sets cross_state_transfer_allowed == false"
    error_id: "ERR_NOTICE_PERIOD_NOT_ELAPSED | ERR_STATUTE_NOTICE_LIMIT | ERR_CROSS_STATE_TRANSFER_PROHIBITED"
    http_status: 409
    applies_to: "POST /franchise/agreements, POST /franchise/agreements/{id}/finalize-cancellation, POST /franchise/transfer-requests"

  - priority: 10
    category: business_safety
    check: "equipment and facility safety gates: a Club whose equipment_compliance_state == NON_COMPLIANT may not be the destination of a transfer and may not host a new agreement; a FacilityInspection whose score is >= REMEDIATION_SCORE_THRESHOLD may not have remediation waived; a Club may not be brought into service while an unresolved RelocationRequest (status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED}) exists for it, because its protected geometry is still in flux"
    error_id: "ERR_CLUB_NOT_OPERATIONAL | ERR_REMEDIATION_NOT_REQUIRED | ERR_RELOCATION_PENDING"
    http_status: 409
    applies_to: "POST /franchise/clubs/{id}/open, POST /franchise/agreements, POST /franchise/transfer-requests, POST /franchise/inspections/{id}/waive-remediation"

  - priority: 11
    category: business_referential
    check: "cross-entity coherence of the references supplied: a Promotion may only be applied to the same plan_template_id the agreement uses and only by the franchisee that owns the home club; a TransferRequest's from_club_id must equal the agreement's current home_club_id; from_club_id and to_club_id must differ; a GuestUsageEvent's host_club_id must differ from the agreement's home club and the agreement must carry multi_club_access == true; a UsageSettlement's home_club_id and host_club_id must differ"
    error_id: "ERR_HOME_CLUB_MISMATCH | ERR_SAME_CLUB_TRANSFER | ERR_GUEST_VISIT_NOT_ALLOWED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /franchise/agreements, POST /franchise/transfer-requests, POST /franchise/guest-usage-events, POST /franchise/usage-settlements"

  - priority: 12
    category: business_constraint
    check: "territory protection and uniqueness constraints: a new or relocated territory may not encroach on another franchisee's protected circle (territory_encroachment_slack < 0); a Club may not be created in a RESERVED territory that already holds a PRE_OPENING club (ERR_TERRITORY_OCCUPIED); only one RelocationRequest per club may be open at a time; a RelocationRequest may not exceed RELOCATION_REVISION_LIMIT revisions; promotion discount_pct may not exceed MAX_FRANCHISE_DISCOUNT_PCT; one UsageSettlement per (period_month, home_club_id, host_club_id); one RoyaltyReport per (franchisee_id, period_month)"
    error_id: "ERR_TERRITORY_ENCROACHMENT | ERR_TERRITORY_OCCUPIED | ERR_RELOCATION_PENDING | ERR_RELOCATION_REVISION_LIMIT | ERR_DISCOUNT_CAP_EXCEEDED | ERR_DUPLICATE_SETTLEMENT_PERIOD | ERR_DUPLICATE_ROYALTY_PERIOD"
    http_status: 409
    applies_to: "POST /franchise/territories, POST /franchise/clubs, POST /franchise/relocation-requests, POST /franchise/relocation-requests/{id}/submit, POST /franchise/relocation-requests/{id}/decide, POST /franchise/promotions, POST /franchise/usage-settlements, POST /franchise/royalty-reports"

  - priority: 13
    category: business_constraint
    check: "brand-governance gates that depend on another entity's current state: a Promotion may not be APPROVED while its owning Franchisee.status == PROBATION; a Promotion that is not in status APPROVED, or whose approved [starts_on, ends_on] window does not contain the logical clock date, may not back a new agreement"
    error_id: "ERR_FRANCHISEE_ON_PROBATION | ERR_PROMOTION_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /franchise/promotions/{id}/review, POST /franchise/agreements"

  - priority: 14
    category: business_temporal
    check: "date-window coherence: Promotion.starts_on <= ends_on, and for every other Promotion P with the same (franchisee_id, plan_template_id) and status IN {PENDING_REVIEW, APPROVED} the new closed window must be separated from P's closed window by at least PROMO_COOLING_GAP_DAYS whole days on the relevant side - formally (new.starts_on - P.ends_on) >= PROMO_COOLING_GAP_DAYS when the new window is later, and (P.starts_on - new.ends_on) >= PROMO_COOLING_GAP_DAYS when it is earlier, so overlapping and merely adjacent windows are both rejected; a GuestUsageEvent's period_month may not precede the agreement's signed_on month; a RoyaltyReport's period_month must be strictly earlier than the logical clock's own month (the period must be closed); an inspection_date may not be in the future relative to the logical clock"
    error_id: "ERR_PROMO_WINDOW_CONFLICT | ERR_REPORT_PERIOD_NOT_CLOSED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /franchise/promotions, POST /franchise/guest-usage-events, POST /franchise/royalty-reports, POST /franchise/inspections"

  - priority: 15
    category: business_fiscal
    check: "money gates evaluated last: the computed gross monthly dues may not fall below MembershipPlanTemplate.floor_price_cents; a cancellation or transfer may not proceed while the agreement's dues_status IN {DELINQUENT, IN_COLLECTIONS, WRITTEN_OFF}; a collections placement requires delinquency_days >= COLLECTIONS_DAYS_THRESHOLD; a PAYMENT_RECEIVED event may not exceed the agreement's current outstanding_balance_cents and no dues event may be posted against a CANCELLED agreement; a settlement may not be created when no unsettled usage exists; a corporate allocation requires at least one eligible franchisee and a non-zero pool_balance_cents"
    error_id: "ERR_PRICE_BELOW_FLOOR | ERR_CANCELLATION_BLOCKED_BY_ARREARS | ERR_TRANSFER_BLOCKED_BY_ARREARS | ERR_COLLECTIONS_THRESHOLD_NOT_MET | ERR_INVALID_DUES_EVENT | ERR_NO_SETTLEABLE_USAGE | ERR_NO_ELIGIBLE_FRANCHISEE"
    http_status: 409
    applies_to: "POST /franchise/agreements, POST /franchise/agreements/{id}/request-cancellation, POST /franchise/agreements/{id}/place-in-collections, POST /franchise/billing-events, POST /franchise/transfer-requests, POST /franchise/usage-settlements, POST /franchise/corporate-accounts/{id}/allocate"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- logical clock (test-driving; outside the /franchise business prefix) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every date comparison in this domain reads (delinquency ageing, cooling-off windows, promotion windows, royalty period closure, inspection dates). The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [BrandAdministrator]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock advances or rewinds to current_utc", "no stored entity is re-derived"]

  # ---- Franchisee ----
  - method: POST
    path: "/franchise/franchisees"
    description: "Registers a franchisee. compliance_score starts at 100 and status at ACTIVE."
    roles: [BrandAdministrator]
    code: 201
    input: [legal_name, contact_email, "royalty_rate_bps?", "national_account_eligible?"]
    output: Franchisee
    side_effects: ["Franchisee created with status ACTIVE, compliance_score 100, inspection_fail_streak 0, collections_watch_club_count 0, disputed_royalty_count 0, corporate_allocation_cents 0"]

  - method: POST
    path: "/franchise/franchisees/{id}/reinstate"
    description: "Lifts probation once the underlying compliance defects are cured (Franchisee PROBATION -> ACTIVE). Recomputes franchisee_compliance_score first and refuses while the recomputed score is still below PROBATION_SCORE_THRESHOLD."
    roles: [BrandAdministrator]
    code: 200
    input: ["note?"]
    output: Franchisee
    side_effects: ["recomputes franchisee_compliance_score", "Franchisee.status -> ACTIVE", "increments Franchisee.version by 1"]

  - method: GET
    path: "/franchise/franchisees/{id}"
    description: "Reads one franchisee, including its live compliance_score, inspection_fail_streak, collections_watch_club_count, disputed_royalty_count and corporate_allocation_cents."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: Franchisee
    side_effects: []

  - method: GET
    path: "/franchise/franchisees"
    description: "Lists franchisees, newest first, with envelope pagination."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["status?", "national_account_eligible?", "limit?", "offset?"]
    output: Franchisee[]
    side_effects: []

  # ---- Territory ----
  - method: POST
    path: "/franchise/territories"
    description: "Reserves a protected trade area for a franchisee. Runs territory_encroachment_slack against every other franchisee's RESERVED or ACTIVE territory and rejects a negative slack with ERR_TERRITORY_ENCROACHMENT; a slack of exactly 0.000 is accepted. Created territories start RESERVED and become ACTIVE only when their club opens."
    roles: [BrandAdministrator]
    code: 201
    input: [franchisee_id, center_lat, center_lng, protected_radius_km, state_code]
    output: Territory
    side_effects: ["runs territory_encroachment_slack over other franchisees' territories", "Territory created with status RESERVED and relocation_count 0"]

  - method: GET
    path: "/franchise/territories/{id}"
    description: "Reads one territory including its current centre, protected_radius_km and relocation_count."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: Territory
    side_effects: []

  - method: GET
    path: "/franchise/territories"
    description: "Lists territories, optionally filtered by owning franchisee or state."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["franchisee_id?", "state_code?", "status?", "limit?", "offset?"]
    output: Territory[]
    side_effects: []

  # ---- Club ----
  - method: POST
    path: "/franchise/clubs"
    description: "Opens a club shell inside a RESERVED territory. franchisee_id, state_code, lat and lng are copied from the territory and any client-supplied value for them is ignored. The club starts PRE_OPENING and COMPLIANT. One club per territory: a territory that already holds a PRE_OPENING club is refused with ERR_TERRITORY_OCCUPIED (priority 12), and a territory that has already reached ACTIVE because its club opened is refused earlier with ERR_INVALID_TERRITORY_STATE (priority 7)."
    roles: [BrandAdministrator, FranchiseOwner]
    code: 201
    input: [territory_id, name, opened_on, "guest_fee_cents?"]
    output: Club
    side_effects: ["Club created with status PRE_OPENING, equipment_compliance_state COMPLIANT, active_agreement_count 0, delinquent_member_count 0, collections_watch false, settlement_ledger_cents 0", "franchisee_id, state_code, lat and lng inherited from the Territory"]

  - method: POST
    path: "/franchise/clubs/{id}/open"
    description: "The franchisee brings its own club into service (Club PRE_OPENING -> OPEN). Refused while an unresolved RelocationRequest exists for the club. The first club of a territory to open bubbles the Territory from RESERVED to ACTIVE. Club SUSPENDED is reached only by the inspection cascade, never by a manual endpoint."
    roles: [FranchiseOwner]
    code: 200
    input: ["note?"]
    output: Club
    side_effects: ["Club.status -> OPEN", "if the parent Territory.status == RESERVED, Territory.status -> ACTIVE and Territory.version increments by 1", "increments Club.version by 1"]

  - method: GET
    path: "/franchise/clubs/{id}"
    description: "Reads one club including version (for optimistic concurrency on agreement creation), equipment_compliance_state, last_inspection_score, active_agreement_count, delinquent_member_count, collections_watch and settlement_ledger_cents."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: Club
    side_effects: []

  - method: GET
    path: "/franchise/clubs"
    description: "Lists clubs, optionally filtered by territory, owning franchisee, state or compliance posture."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["territory_id?", "franchisee_id?", "state_code?", "status?", "equipment_compliance_state?", "limit?", "offset?"]
    output: Club[]
    side_effects: []

  # ---- RelocationRequest ----
  - method: POST
    path: "/franchise/relocation-requests"
    description: "Drafts a relocation request for a club. Created in DRAFT with revision_count 0. Refused when the club already has a request in DRAFT, SUBMITTED or CHANGES_REQUESTED."
    roles: [FranchiseOwner]
    code: 201
    input: [club_id, requested_lat, requested_lng, requested_radius_km, justification]
    output: RelocationRequest
    side_effects: ["RelocationRequest created with status DRAFT, revision_count 0"]

  - method: POST
    path: "/franchise/relocation-requests/{id}/submit"
    description: "Submits a relocation request for brand review (DRAFT -> SUBMITTED, or CHANGES_REQUESTED -> SUBMITTED which increments revision_count). Computes and stores encroachment_km via territory_encroachment_slack against other franchisees' territories, and records submitted_by_user_id. Refused once revision_count would exceed RELOCATION_REVISION_LIMIT."
    roles: [FranchiseOwner]
    code: 200
    input: ["requested_lat?", "requested_lng?", "requested_radius_km?"]
    output: RelocationRequest
    side_effects: ["computes territory_encroachment_slack and stores it in encroachment_km", "status -> SUBMITTED", "submitted_by_user_id set to X-User-ID", "on the CHANGES_REQUESTED path increments revision_count by 1", "increments RelocationRequest.version by 1"]

  - method: POST
    path: "/franchise/relocation-requests/{id}/request-changes"
    description: "Brand review bounces a submitted relocation back to the franchisee for rework (SUBMITTED -> CHANGES_REQUESTED). The reviewer may not be the submitter."
    roles: [BrandAdministrator]
    code: 200
    input: [reviewer_note]
    output: RelocationRequest
    side_effects: ["status -> CHANGES_REQUESTED", "reviewer_note stored", "increments RelocationRequest.version by 1"]

  - method: POST
    path: "/franchise/relocation-requests/{id}/decide"
    description: "Approves or rejects a submitted relocation (SUBMITTED -> APPROVED or REJECTED). On APPROVE the encroachment check is re-run against live territory geometry and the Territory's centre and protected_radius_km are rewritten, incrementing Territory.relocation_count; the Club's lat and lng follow. The decider may not be the submitter."
    roles: [BrandAdministrator]
    code: 200
    input: [decision, "reviewer_note?"]
    output: RelocationRequest
    side_effects: ["re-runs territory_encroachment_slack", "on APPROVE rewrites Territory.center_lat, Territory.center_lng and Territory.protected_radius_km and increments Territory.relocation_count by 1", "on APPROVE rewrites Club.lat and Club.lng", "decided_by_user_id set to X-User-ID", "increments RelocationRequest.version by 1"]

  - method: POST
    path: "/franchise/relocation-requests/{id}/withdraw"
    description: "Franchisee abandons a relocation request from DRAFT or CHANGES_REQUESTED (-> WITHDRAWN), freeing the club to draft a new one. A SUBMITTED request is under brand review and cannot be withdrawn."
    roles: [FranchiseOwner]
    code: 200
    input: ["reason?"]
    output: RelocationRequest
    side_effects: ["status -> WITHDRAWN", "increments RelocationRequest.version by 1"]

  - method: GET
    path: "/franchise/relocation-requests/{id}"
    description: "Reads one relocation request including encroachment_km, revision_count, submitted_by_user_id and decided_by_user_id."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    output: RelocationRequest
    side_effects: []

  - method: GET
    path: "/franchise/relocation-requests"
    description: "Lists relocation requests, optionally filtered by club or status."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
    code: 200
    input: ["club_id?", "status?", "limit?", "offset?"]
    output: RelocationRequest[]
    side_effects: []

