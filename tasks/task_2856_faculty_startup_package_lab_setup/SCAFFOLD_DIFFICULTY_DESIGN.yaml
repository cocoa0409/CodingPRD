            - "StartupPackage.${pkg10_id}.total_encumbered_cents == 40000000 and StartupPackage.${pkg10_id}.total_available_cents == 32000000 (12000000 + 9600000 + 2400000 + 8000000 scheduled)"

      - name: personnel_tranche_window_closes_exactly_at_expires_on_instant
        grounds:
