            - call: "POST /therapy-sessions"
              payload: { authorization_id: "${auth_id}", provider_id: "${rbt_id}", service_line: "DIRECT_THERAPY", scheduled_start: "2026-03-10T09:00:00Z", scheduled_end: "2026-03-10T11:00:00Z", scheduled_units: 8 }
              as: RBT
