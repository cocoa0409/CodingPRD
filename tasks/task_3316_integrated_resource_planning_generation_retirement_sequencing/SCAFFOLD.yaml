    roles: [UtilityPlanner]
    code: 200
    input: []
    output: ResourcePlan
    side_effects:
      - "reopen_count += 1; portfolios FROZEN -> DRAFT; forecasts locked := false"
      - "Increments ResourcePlan.version by 1"

