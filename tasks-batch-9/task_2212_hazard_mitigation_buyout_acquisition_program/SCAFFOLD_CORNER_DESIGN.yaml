        distinguishing_aspect: |
          The IN_PROGRESS -> FAILED_INSPECTION -> IN_PROGRESS cycle is legal until
          failed_inspection_count exceeds MAX_DEMOLITION_REWORKS: the third restart (count 2)
          succeeds and the fourth (count 3) returns 409 ERR_DEMOLITION_REWORK_LIMIT, and unlike the
          appraisal limit the counter is incremented by the ComplianceMonitor's fail-inspection call,
          not by the actor being refused.
