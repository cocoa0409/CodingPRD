      - name: commit_is_refused_while_a_non_dark_stop_carries_no_contract
        claim_type: conditional_action
        grounds:
          - endpoints[POST /routes/{id}/commit]
          - validations[priority=82]
          - errors[ERR_STOP_NOT_CONTRACTED]
        distinguishing_aspect: |
          The same commit call is refused and then admitted with no other change: with stop B uncontracted the
          priority-82 rule answers ERR_STOP_NOT_CONTRACTED (409) and the route stays SEQUENCED; adding a DRAFT
          contract on B — DRAFT is enough, the rule accepts DRAFT, SENT, COUNTERED and EXECUTED — makes the very
          same call answer 200. The sequence aggregates (495 mi at 45 mph plus one mandated rest block = 21.00 h)
          survive both attempts.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venues V1 and V2."
            - "Route R1 with chained stops A (head, contract SENT) and B (previous_stop_id A, haul_miles_from_previous 495, load-in 2026-09-10T06:00Z, no contract), already SEQUENCED."
