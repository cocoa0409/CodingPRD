            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc43}", variety_id: "${vc43}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc43: $.data.id }
          trigger:
            - call: "GET /crop-cycles/${cc43}"
              as: GrowerManager
              captures: { cc43_weekly: $.data.expected_weekly_yield_lbs, cc43_total: $.data.expected_total_yield_lbs, cc43_baseline: $.data.baseline_total_yield_lbs, cc43_df: $.data.density_factor }
          assert:
            - "${cc43_df} == 0.9511"
            - "${cc43_weekly} == [3595.16, 7190.32, 9886.68, 11684.26, 11684.26, 10785.47, 8987.90, 8089.11, 6291.53, 4493.95]"
            - "each element is quantize(curve_lbs_per_sqft * area_sqft * density_factor, 2) with ROUND_HALF_UP"
            - "${cc43_baseline} == 82688.64"
            - "${cc43_total} == 82688.64"
            - "the total is the sum of the already-rounded weekly elements, not a re-rounded sum of raw products"
            - "the array has exactly ten elements, matching cycle_length_weeks 13 minus first_harvest_week 4 plus 1"

