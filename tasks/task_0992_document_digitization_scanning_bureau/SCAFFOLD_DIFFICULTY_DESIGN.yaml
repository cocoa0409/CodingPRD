            - { call: "POST /batches/${bid}/qa-reviews", payload: { document_id: "${d1}" }, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
          trigger:
            - { call: "POST /batches/${bid}/fail-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "POST /batches/${bid}/scan-sessions", payload: { scanner_id: "${sc}" }, as: ScanOperator, as_user_id: "scan-1", captures: { ss2: $.data.id } }
            - { call: "POST /scan-sessions/${ss2}/page-logs", payload: { document_id: "${d1}", pages: 100 }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: ScanOperator, as_user_id: "scan-1", captures: { bv2: $.data.version } }
            - { call: "POST /scan-sessions/${ss2}/commit", payload: { expected_batch_version: "${bv2}" }, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/submit-qa", payload: {}, as: ScanOperator, as_user_id: "scan-1" }
            - { call: "POST /batches/${bid}/pass-qa", payload: {}, as: QAReviewer, as_user_id: "qa-1" }
            - { call: "GET /batches/${bid}", payload: {}, as: QAReviewer, as_user_id: "qa-1", captures: { cycles: $.data.rework_cycle_count, scanned: $.data.scanned_pages, billable: $.data.billable_scanned_pages, st: $.data.status } }
          assert:
            - "${st} == INDEXING  (cycle QA->SCANNING->QA->INDEXING traversed)"
            - "${cycles} == 1"
            - "${scanned} == 200  (produced material: 100 first scan + 100 rework rescan)"
            - "${billable} == 100  (count-once ledger: rework never double-counts)"
            - "Document.${d1}.status == SCANNED after the rework commit"

      - name: box_disposition_branch_fork_return_vs_destroy
        grounds:
          - state_machines.Box.AWAITING_DISPOSITION_to_IN_DESTRUCTION
          - state_machines.Box.AWAITING_DISPOSITION_to_RETURNED
          - state_machines.Box.IN_DESTRUCTION_to_DESTROYED
        distinguishing_aspect: |
          Box machine is a branching fork (different entity from the cyclic
          Batch machine): from the same pre-fork state AWAITING_DISPOSITION,
          return_requested pins divergent branches — box A takes the RETURN
          branch (custody RETURN event, no certificate), box B takes the
          DESTROY branch (certificate minted, witness segregation enforced);
          the two branches carry disjoint side-effect sets.
        test_recipe:
          setup:
            - "Client + STANDARD agreement with retention_days 5; batch with two boxes (A 600g, B 500g), each shelved on GENERAL slot cap 2000"
            - "One 100-page document in box A; full pipeline to DELIVERED at clock 2026-05-10T00:00:00Z (disposition_at = 2026-05-15)"
