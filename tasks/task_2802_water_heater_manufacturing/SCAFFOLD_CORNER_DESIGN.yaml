      - name: certification_reject_then_resubmit_moves_the_sod_target
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mfg/rating-certifications/{id}/reject]
          - endpoints[POST /mfg/rating-certifications/{id}/submit]
          - state_machines.RatingCertification.SUBMITTED_to_REJECTED
          - state_machines.RatingCertification.REJECTED_to_SUBMITTED
          - validations[priority 8]
          - validations[priority 9]
          - errors[ERR_INVALID_CERTIFICATION_STATE]
          - errors[ERR_SOD_APPROVER_IS_SUBMITTER]
          - calculations.certified_rating_rounding
        distinguishing_aspect: >
          The revision loop makes the segregation-of-duties target MOVE: eng-1 submitted the first round, so
          appr-1 may reject it; after eng-2 resubmits, appr-1 is free to approve but eng-2 is not. An
          implementation that pins the SoD comparison to the first submitter, or that never overwrites
          submitted_by_user_id on resubmission, gets both the 403 and the final 200 wrong. The reject also has to
          clear the computed ratings and walk the model's certification dimension back to TEST_PENDING, and the
          resubmission must recompute them from the same PASSED tests.
        test_recipe:
          setup:
            - "Model GX50-T has three PASSED UEF tests (0.5850, 0.5850, 0.5840), one PASSED FIRST_HOUR_RATING (62.5) and one PASSED RECOVERY (41.25)."
            - "Its certification_status is TEST_PENDING and release_status is DRAFT."
            - "Certification cert1 is SUBMITTED with submitted_by_user_id 'eng-1' and certified_uef 0.59."
            - "The clock is 2026-08-05T06:00:00Z."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/test-cells"
