      - name: self_assessment_return_cycle_resets_peer_review_dimension
        grounds:
          - state_machines.SelfAssessment.DRAFT_to_SUBMITTED
          - state_machines.SelfAssessment.SUBMITTED_to_DRAFT
          - state_machines.PeerReview.ASSIGNED_to_SCORED
          - entities.SelfAssessment.fields.revision_count
          - entities.SelfAssessment.fields.mean_peer_score
          - entities.PeerReview.fields.composite_score
        distinguishing_aspect: |
          The SelfAssessment machine cycles SUBMITTED -> DRAFT -> SUBMITTED, and unlike the
          CreditClaim remand loop this loop's re-entry has a divergent side effect on a
          second entity: RETURN drives every SCORED PeerReview of the assessment back to
          ASSIGNED with its scores nulled, zeroing mean_peer_score from 4.1250 to 0.0000,
          while the forward DRAFT -> SUBMITTED edge touches no PeerReview at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 advanced to SELF_ASSESSMENT."
            - "Partner SUBJ (evaluation_required true) has a SUBMITTED SelfAssessment; CM1 and CM2 are committee members with evaluation_required false."
            - "Two PeerReviews on that assessment are SCORED: CM1 scored 4/4/4 (composite 4.0000) and CM2 scored 5/4/3 (composite 4.2500), so scored_review_count is 2 and mean_peer_score is 4.1250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
