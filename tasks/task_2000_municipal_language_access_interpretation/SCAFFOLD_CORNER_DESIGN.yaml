        claim_type: violation_to_error
        grounds: ["errors[ERR_DOCUMENT_RETIRED]"]
        excluded_because:
          difficulty_instance: job_create_retired_document_state_beats_ceiling_fiscal
          rationale: "ERR_DOCUMENT_RETIRED is the asserted winning error of that §1.8 instance."

      - name: setting_requires_in_person_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_SETTING_REQUIRES_IN_PERSON]"]
        excluded_because:
          difficulty_instance: request_create_setting_safety_beats_schedule_temporal
          rationale: "ERR_SETTING_REQUIRES_IN_PERSON is the asserted winning error of that §1.8 instance."

      - name: contract_ceiling_exceeded_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_CEILING_EXCEEDED]"]
        excluded_because:
          difficulty_instance: contract_ceiling_exact_cent_allowed_one_cent_over_rejected
          rationale: "ERR_CONTRACT_CEILING_EXCEEDED is asserted on the one-cent-over create in that §1.8 instance."

      - name: contract_not_active_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: job_create_requires_active_contract
          rationale: "ERR_CONTRACT_NOT_ACTIVE is asserted on the DRAFT-contract create in that §1.8 instance."

      - name: department_noncompliant_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEPARTMENT_NONCOMPLIANT]"]
        excluded_because:
          difficulty_instance: request_create_blocked_when_department_noncompliant
          rationale: "ERR_DEPARTMENT_NONCOMPLIANT is asserted on the NONCOMPLIANT-department create in that §1.8 instance."

      - name: assessment_period_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSESSMENT_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: assessment_period_half_open_adjacency
          rationale: "ERR_ASSESSMENT_PERIOD_OVERLAP is asserted on the overlapping window in that §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_departments_pagination_limit_offset
        claim_type: pagination
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "limit=2 over 3 departments returns 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false — envelope pagination fields honored."
        test_recipe:
          setup: ["Three departments created"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept P1", service_area_code: "SA-C23", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /departments"
              payload: { name: "Dept P2", service_area_code: "SA-C24", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /departments"
              payload: { name: "Dept P3", service_area_code: "SA-C25", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /departments"
              payload: { limit: 2, offset: 0 }
              as: LanguageAccessCoordinator
            - call: "GET /departments"
              payload: { limit: 2, offset: 2 }
              as: LanguageAccessCoordinator
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, total_count == 3, has_more == false"

      - name: response_envelope_success_and_error_shape
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Success body carries meta.api_request_id, meta.api_request_timestamp, response_type 'object' and data; error body carries response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { name: "Dept Env", service_area_code: "SA-C26", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "GET /departments/99999999-8888-7777-6666-555555555555"
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Success: meta.api_request_id present, response_type == \"object\", data.id == ${dept_id}"
            - "Error: response_type == \"error\", data.error_id == ERR_DEPARTMENT_NOT_FOUND, data.message present"

      - name: translation_jobs_filtered_by_document
        claim_type: computed_read
        grounds: [entities.TranslationJob.fields.document_id, endpoints]
        distinguishing_aspect: "GET /translation-jobs?document_id= isolates one document's queue: doc1's job listed, doc2's job not (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["Department D; contract ACTIVE; Doc1 and Doc2 ACTIVE; one job on each (word_count 100)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Filt", service_area_code: "SA-C27", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorFilt", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Doc One", document_type: "FORM" }
              as: LanguageAccessCoordinator
              captures: { doc1_id: $.data.id }
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Doc Two", document_type: "FORM" }
              as: LanguageAccessCoordinator
