            - "After locking the child difference: lock-provision succeeds, TaxYear.status == PROVISION_LOCKED"

      - name: utp_disclose_requires_ready_filing
        grounds:
          - state_machines.UncertainTaxPosition.MEASURED_to_DISCLOSED
          - errors[ERR_RETURN_NOT_READY]
        distinguishing_aspect: |
          Entity pair Filing -> UncertainTaxPosition (different pair from
          provision_lock_blocked_by_unlocked_differences): the UTP's disclose
          transition is gated on a cross-aggregate query — a filing for the
          same (tax_year_id, jurisdiction_id) must be READY/FILED/ACCEPTED.
        test_recipe:
          setup:
            - "FY2026 PROVISION_LOCKED (zero differences, approved zero allowance); FED filing PENDING (not yet ready); UTP 1,000,000 @4000 bp MEASURED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "transfer pricing", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
            - { call: "POST /tax/uncertain-tax-positions/${utp1}/measure", payload: { cumulative_probability_bp: 4000 }, as: TaxManager }
          trigger:
            - call: "POST /tax/uncertain-tax-positions/${utp1}/disclose"
              payload: {}
              as: TaxManager
              captures: { err: $.data.error_id }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - call: "POST /tax/uncertain-tax-positions/${utp1}/disclose"
              payload: {}
              as: TaxManager
              captures: { final_status: $.data.status }
          assert:
            - "While Filing.${fil1} is PENDING: err == ERR_RETURN_NOT_READY"
            - "After mark-ready (filing READY): disclose succeeds, UTP.status == DISCLOSED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_exam_period_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
          - entities.AuditCase.fields.exam_period_end
        distinguishing_aspect: |
          Half-open interval semantics on the AuditCase resource: an existing
          exam [2024-01-01, 2025-01-01) permits a successor starting exactly
          2025-01-01 (end == start is legal), while a start of 2024-06-01
          collides with ERR_AUDIT_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "FY2026 TaxYear; jurisdiction US-FED; audit A examining [2024-01-01, 2025-01-01) is open"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/audits"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", exam_period_start: "2024-01-01", exam_period_end: "2025-01-01" }
              as: TaxManager
              captures: { aud_a: $.data.id }
          trigger:
            - call: "POST /tax/audits"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", exam_period_start: "2025-01-01", exam_period_end: "2026-01-01" }
              as: TaxManager
              captures: { aud_b: $.data.id }
            - call: "POST /tax/audits"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", exam_period_start: "2024-06-01", exam_period_end: "2025-06-01" }
              as: TaxManager
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent audit B (start == A's exclusive end 2025-01-01) is created successfully — half-open semantics permit touching intervals"
            - "Overlapping audit C (2024-06-01 lies inside A's [2024-01-01, 2025-01-01)) rejected with err == ERR_AUDIT_PERIOD_OVERLAP"

      - name: payment_quarter_closed_interval_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_QUARTER_OVERLAP]
          - entities.EstimatedPayment.fields.period_end_date
        distinguishing_aspect: |
          Closed-interval semantics on the EstimatedPayment resource (different
          resource and different geometry from the audit half-open rule):
          quarter intervals include both endpoints, so a new quarter starting
          2026-03-31 — exactly the existing quarter's period_end — COLLIDES,
          whereas 2026-04-01 (end + 1 day) is the required contiguity.
        test_recipe:
          setup:
            - "FY2026 TaxYear (period 2026-01-01..2026-12-31); jurisdiction US-IL; manual quarter 1 [2026-01-01, 2026-03-31] exists"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", quarter_index: 1, period_start_date: "2026-01-01", period_end_date: "2026-03-31", due_date: "2026-04-15", method: CURRENT_YEAR_ANNUALIZED, scheduled_amount_cents: 552537 }
              as: TaxManager
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", quarter_index: 2, period_start_date: "2026-03-31", period_end_date: "2026-06-30", due_date: "2026-07-15", method: CURRENT_YEAR_ANNUALIZED, scheduled_amount_cents: 552538 }
              as: TaxManager
              captures: { err: $.data.error_id }
            - call: "POST /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", quarter_index: 2, period_start_date: "2026-04-01", period_end_date: "2026-06-30", due_date: "2026-07-15", method: CURRENT_YEAR_ANNUALIZED, scheduled_amount_cents: 552538 }
              as: TaxManager
              captures: { q2: $.data.id }
          assert:
            - "Quarter starting 2026-03-31 (== existing closed end) rejected with err == ERR_QUARTER_OVERLAP — under closed semantics that single shared day collides"
            - "Quarter starting 2026-04-01 (end + 1 day) created successfully — exact contiguity, no gap"

  - rule_id: compensating_invariant
    instances:
      - name: filing_refill_cycle_conserves_rtp
        grounds:
          - calculations.rtp_trueup
          - state_machines.Filing.FILED_to_REJECTED
          - state_machines.Filing.AMENDED_to_READY
        distinguishing_aspect: |
          Conserved quantity: TaxYear.return_to_provision_adjustment_cents.
          The forward file (+100,000) paired with its compensating
          reject/amend/refile cycle at the same liability returns the global
          RTP to exactly +100,000 — full-recompute idempotency leaves no drift.
        test_recipe:
          setup:
            - "FY2026 PROVISION_LOCKED (zero differences, approved zero allowance); FED filing READY at liability 21,100,000 vs estimate 21,000,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v1: $.data.version }
          trigger:
            - { call: "POST /tax/filings/${fil1}/file", payload: { expected_tax_year_version: "${ty_v1}" }, as: TaxDirector }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { rtp_after_file: $.data.return_to_provision_adjustment_cents, ty_v2: $.data.version }
            - { call: "POST /tax/filings/${fil1}/reject", payload: { rejection_reason: "schedule M-1 mismatch" }, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { rtp_after_reject: $.data.return_to_provision_adjustment_cents }
            - { call: "POST /tax/filings/${fil1}/amend", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v3: $.data.version }
            - { call: "POST /tax/filings/${fil1}/file", payload: { expected_tax_year_version: "${ty_v3}" }, as: TaxDirector }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { rtp_after_refile: $.data.return_to_provision_adjustment_cents }
          assert:
            - "rtp_after_file == 100000  # 21,100,000 - 21,000,000"
            - "rtp_after_reject == 0  # REJECTED drops the filing out of the filed set"
            - "rtp_after_refile == 100000  # identical liability re-filed -> conserved quantity restored exactly, no double-count"

      - name: payment_record_reverse_conserves_paid
        grounds:
          - state_machines.EstimatedPayment.SCHEDULED_to_PARTIALLY_PAID
          - state_machines.EstimatedPayment.PARTIALLY_PAID_to_SCHEDULED
        distinguishing_aspect: |
          Conserved quantity: EstimatedPayment.paid_amount_cents (cash, a
          different conserved quantity from the RTP accrual above). Recording
          200,000 then reversing 200,000 returns paid to exactly 0 and status
          to SCHEDULED, while scheduled_amount_cents is untouched throughout.
        test_recipe:
          setup:
            - "FY2026 TaxYear; US-IL annualized schedule; quarter 1 scheduled 552,537, all SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { q1: "$.data[0].id" }
          trigger:
            - { call: "POST /tax/estimated-payments/${q1}/record-payment", payload: { amount_cents: 200000 }, as: TaxAccountant, captures: { paid_mid: $.data.paid_amount_cents, st_mid: $.data.status } }
            - { call: "POST /tax/estimated-payments/${q1}/reverse-payment", payload: { amount_cents: 200000 }, as: TaxManager, captures: { paid_end: $.data.paid_amount_cents, st_end: $.data.status, sched_end: $.data.scheduled_amount_cents } }
          assert:
            - "After record: paid_amount_cents == 200000 and status == PARTIALLY_PAID"
            - "After compensating reversal: paid_amount_cents == 0 and status == SCHEDULED — record+reverse conserves the cash quantity"
            - "scheduled_amount_cents == 552537 unchanged across the pair (reversal never touches the schedule)"
