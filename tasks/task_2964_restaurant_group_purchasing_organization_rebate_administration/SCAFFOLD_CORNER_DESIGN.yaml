          trigger:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 6000, gpo_retention_bps: 4000, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 30 }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co of Texas", deal_code: "PBC-2026", effective_from: "2027-01-01", effective_to: "2027-12-31", required_purchase_window_days: 30 }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${dealA_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-8OZ-CS20", pack_size: 20, baseline_unit_cost_cents: 15200, contract_unit_cost_cents: 14100 }
              as: GpoAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${dealB_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9700, contract_unit_cost_cents: 8850 }
              as: GpoAdmin
              captures: { itemB_id: $.data.id }
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-07-01", period_end: "2026-07-31", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { e4: $.data.error_id }
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist2_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist2_id}"
              captures: { b2_id: $.data.id }
          assert:
            - "call 1: 409 with error_id == ERR_DUPLICATE_TIER_CODE — tier_code is globally unique even with completely different economics"
            - "call 2: 409 with error_id == ERR_DUPLICATE_DEAL_CODE — deal_code is globally unique even for a different year and manufacturer name"
            - "call 3: 409 with error_id == ERR_DUPLICATE_ITEM_SKU — same sku, same deal"
            - "call 4: 201 — the SAME sku under ${dealB_id} is legal, so the uniqueness scope is (deal_id, manufacturer_sku)"
            - "call 5: 409 with error_id == ERR_DUPLICATE_BATCH_REFERENCE — same source_reference, same distributor, even though the period differs"
            - "call 6: 201 — the SAME source_reference under ${dist2_id} is legal, so the scope is (distributor_id, source_reference)"
            - "final counts: GET /program-tiers total_count == 1, GET /manufacturer-deals total_count == 2, GET /contracted-items total_count == 2, GET /purchase-batches total_count == 2"

      - name: period_bounds_and_future_review_windows_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - validations[priority=25]
          - entities.ComplianceReview.window_end
        distinguishing_aspect: |
          One error id covers six endpoints with two different inequalities:
          batches, claims, deals, rate cards and reviews accept a zero-length
          period (end >= start) while an authorization letter does not
          (effective_to strictly after effective_from). The review window adds a
          second rule that is relative to the logical clock, and when a window is
          both backwards AND in the future the lower-priority bounds error wins.
        test_recipe:
          setup:
            - "The logical clock reads 2026-08-01T09:00:00Z."
            - "ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill (still PENDING) and DRAFT deal PBC-2026 exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: GpoAdmin
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-30", period_end: "2026-06-01", source_reference: "METRO-BACKWARDS" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-15", period_end: "2026-06-15", source_reference: "METRO-ONE-DAY" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b_oneday_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", signatory_name: "Dana Reyes", scope: "PURCHASE_DATA_ONLY" }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "One Day Foods", deal_code: "ONEDAY-2026", effective_from: "2026-06-01", effective_to: "2026-06-01", required_purchase_window_days: 30 }
              as: GpoAdmin
              captures: { deal_oneday_id: $.data.id }
            - call: "POST /compliance-reviews"
              payload: { member_id: "${m1_id}", deal_id: "${deal_id}", window_start: "2026-07-01", window_end: "2026-08-02" }
              as: GpoAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /compliance-reviews"
              payload: { member_id: "${m1_id}", deal_id: "${deal_id}", window_start: "2026-12-01", window_end: "2026-09-01" }
              as: GpoAdmin
              captures: { e4: $.data.error_id }
            - call: "POST /compliance-reviews"
              payload: { member_id: "${m1_id}", deal_id: "${deal_id}", window_start: "2026-08-01", window_end: "2026-08-01" }
              as: GpoAdmin
              captures: { review_id: $.data.id }
          assert:
            - "call 1: 422 with error_id == ERR_PERIOD_BOUNDS_INVALID — period_end 2026-06-01 precedes period_start 2026-06-30"
            - "call 2: 201 — a single-day batch period is legal because the batch rule is period_end >= period_start, with total_cases_ingested == 0"
            - "call 3: 422 with error_id == ERR_PERIOD_BOUNDS_INVALID — a letter needs effective_to STRICTLY after effective_from, so equal instants are rejected"
            - "call 4: 201 — the SAME equality is legal on a deal, whose rule is effective_to >= effective_from; the one error id therefore hides two different inequalities"
            - "call 5: 422 with error_id == ERR_REVIEW_WINDOW_IN_FUTURE — window_end 2026-08-02 is one day after the clock's calendar date 2026-08-01"
            - "call 6: 422 with error_id == ERR_PERIOD_BOUNDS_INVALID and NOT ERR_REVIEW_WINDOW_IN_FUTURE — the window is backwards (2026-09-01 < 2026-12-01) and its end is also in the future, and priority 22 outranks priority 25"
            - "call 7: 201 — window_end exactly equal to the clock's calendar date is NOT 'after' it, so a same-day window is accepted"
            - "call 7 computes window_days == 1, committed_spend_prorated_cents == round_half_up(20000000 * 1 / 365) == 54795, contracted_spend_cents == 0, deal_wide_contracted_spend_cents == 0, purchase_ratio_bps == 0"
            - "call 7 result == BREACH: window_days 1 < the deal's required_purchase_window_days 60 and PBC-2026 is still DRAFT, so the DEAL_LOST branch cannot fire even though deal-wide spend is 0"
