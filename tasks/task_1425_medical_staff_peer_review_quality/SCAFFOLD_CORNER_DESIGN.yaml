# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per the claim-extraction-guide
# taxonomy. Default logical clock at server start: 2026-08-01T00:00:00Z.
scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: provider_create_defaults_and_system_fields
        claim_type: creation
        grounds: ["entities.Provider"]
        distinguishing_aspect: "POST /providers returns 201 with server-minted id, version == 1, created_at stamped from the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /peer-review/providers", payload: { full_name: "Sys Fields", specialty: "SURGERY" }, as: QualityDirector, captures: { p1: $.data.id, v1: $.data.version, c1: $.data.created_at } }
          assert:
            - "response version == 1"
            - "created_at == '2026-08-01T00:00:00Z' (default logical clock)"
            - "GET /peer-review/providers/${p1} returns the same id, full_name, specialty"

      - name: committee_member_specialty_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.CommitteeMember.fields.specialty"]
        distinguishing_aspect: "CommitteeMember.specialty is denormalized from the linked Provider; a conflicting client-supplied specialty is ignored."
        test_recipe:
          setup: ["provider with specialty SURGERY"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Spec Src", specialty: "SURGERY" }, as: QualityDirector, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p1}", member_role: "MEMBER", specialty: "PSYCHIATRY" }, as: QualityDirector, captures: { m1: $.data.id, spec: $.data.specialty } }
          assert:
            - "created member specialty == 'SURGERY' (denormalized from Provider), not the client-supplied 'PSYCHIATRY'"
            - "member status == 'ACTIVE' and reliability_completed_count == 0"

      - name: provider_create_missing_required_returns_400
        claim_type: required_fields
        grounds: ["entities.Provider.fields.specialty", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field specialty -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /peer-review/providers", payload: { full_name: "No Spec" }, as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_VALIDATION' with HTTP 400"

      - name: provider_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROVIDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent provider id -> ERR_PROVIDER_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /peer-review/providers/00000000-0000-0000-0000-000000000000", as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_PROVIDER_NOT_FOUND' with HTTP 404"

      - name: case_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET with an absent case id -> ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /peer-review/cases/00000000-0000-0000-0000-000000000000", as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_CASE_NOT_FOUND' with HTTP 404"

      - name: assignment_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ASSIGNMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with an absent assignment id -> ERR_ASSIGNMENT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /peer-review/assignments/00000000-0000-0000-0000-000000000000", as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_ASSIGNMENT_NOT_FOUND' with HTTP 404"

      - name: body_fk_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Assignment create with a body reviewer_id that does not resolve -> ERR_MEMBER_NOT_FOUND (body FK existence is checked after path ids)."
        test_recipe:
          setup: ["subject provider; screened-in case"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj NF", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "nf case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "00000000-0000-0000-0000-000000000000", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_MEMBER_NOT_FOUND' with HTTP 404"

      - name: focused_review_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FOCUSED_REVIEW_NOT_FOUND]"]
        distinguishing_aspect: "GET with an absent focused-review id -> ERR_FOCUSED_REVIEW_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /peer-review/focused-reviews/00000000-0000-0000-0000-000000000000", as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_FOCUSED_REVIEW_NOT_FOUND' with HTTP 404"

      - name: focus_group_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FOCUS_GROUP_NOT_FOUND]"]
        distinguishing_aspect: "GET with an absent focus-group id -> ERR_FOCUS_GROUP_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /peer-review/focus-groups/00000000-0000-0000-0000-000000000000", as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_FOCUS_GROUP_NOT_FOUND' with HTTP 404"

      - name: conflict_rescind_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CONFLICT_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "DELETE with an absent conflict id -> ERR_CONFLICT_NOT_FOUND; existence (priority 3) precedes the ownership scope check (priority 4)."
        test_recipe:
          setup: ["one seated member whose id authenticates the CommitteeMember role"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "M Provider", specialty: "SURGERY" }, as: QualityDirector, captures: { p1: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p1}", member_role: "MEMBER" }, as: QualityDirector, captures: { m1: $.data.id } }
          trigger:
            - { call: "DELETE /peer-review/conflict-declarations/00000000-0000-0000-0000-000000000000", as: CommitteeMember, as_user_id: "${m1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_CONFLICT_NOT_FOUND' with HTTP 404"

      - name: case_note_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.CaseNote"]
        distinguishing_aspect: "CaseNote carries common_fields: false — response exposes id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["subject provider; member B; case screened in with B assigned (notes allowed from ASSIGNED)"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Notes", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "notes case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/notes", payload: { body: "reviewer context note" }, as: CommitteeMember, as_user_id: "${m_b}", captures: { n1: $.data.id, n_author: $.data.author_member_id, n_type: $.data.note_type } }
          assert:
            - "response contains id and created_at but no 'version' and no 'updated_at' key"
            - "author_member_id == ${m_b} (stamped from X-User-ID); note_type defaulted to 'GENERAL'"
            - "GET /peer-review/cases/${case1}/notes lists exactly this one note"

  # =====================================================================
  - section: state_machines
    instances:
      - name: case_initial_state_referred
        claim_type: initial_state
        grounds: ["state_machines.ReviewCase"]
        distinguishing_aspect: "A newly created ReviewCase starts in REFERRED."
        test_recipe:
          setup: ["one provider"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Init", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
          trigger:
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INCIDENT_REPORT", referred_at: "2026-07-20T00:00:00Z", description: "init case" }, as: PeerReviewCoordinator, captures: { st: $.data.status, v: $.data.version } }
          assert:
            - "response status == 'REFERRED' and version == 1"

      - name: member_initial_state_active
        claim_type: initial_state
        grounds: ["state_machines.CommitteeMember"]
        distinguishing_aspect: "A newly seated CommitteeMember starts ACTIVE."
        test_recipe:
          setup: ["one provider"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Init Member", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p1}", member_role: "MEMBER" }, as: QualityDirector, captures: { st: $.data.status } }
          assert:
            - "response status == 'ACTIVE'"

      - name: screen_on_screened_in_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ReviewCase", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Screen is defined only from REFERRED; a second screen on a SCREENED_IN (non-terminal) case -> ERR_INVALID_STATE (not the terminal variant)."
        test_recipe:
          setup: ["provider; case already screened in"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj DS", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "double screen" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_OUT", screened_out_reason: "OTHER" }, as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with HTTP 409 (SCREENED_IN is non-terminal, so not ERR_ALREADY_TERMINAL)"
            - "GET /peer-review/cases/${case1} still shows status == 'SCREENED_IN' and no screened_out_reason"

      - name: action_on_terminal_case_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ReviewCase", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Assignment create on a SCREENED_OUT (terminal) case -> ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["provider; member B; case screened out"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Term", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "terminal case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_OUT", screened_out_reason: "OUT_OF_SCOPE" }, as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_ALREADY_TERMINAL' with HTTP 409"

      - name: double_submit_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ReviewAssignment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submit is defined only from PENDING; resubmitting a SUBMITTED assignment -> ERR_INVALID_STATE (state priority 5 precedes the OCC version check at priority 6)."
        test_recipe:
          setup: ["provider; member B; case with B assigned; B already submitted"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj DS2", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "resubmit case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with HTTP 409"
            - "GET /peer-review/assignments/${asg_b} still shows care_appropriateness_score == 4 (no overwrite)"

      - name: note_on_referred_case_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ReviewCase", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Notes are writable only from ASSIGNED onward; a note on a REFERRED case -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["provider; member B; case still REFERRED"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Note2", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "early note case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/notes", payload: { body: "too early" }, as: CommitteeMember, as_user_id: "${m_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with HTTP 409"

      - name: focused_review_close_on_closed_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FocusedReview", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing an already-CLOSED FocusedReview -> ERR_INVALID_STATE (the terminal variant ERR_ALREADY_TERMINAL is case-only)."
        test_recipe:
          setup: ["provider with a MANUAL focused review already closed"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj FR", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/focused-reviews", payload: { provider_id: "${p_sub}", basis: "manual" }, as: QualityDirector, captures: { fr1: $.data.id } }
            - { call: "POST /peer-review/focused-reviews/${fr1}/close", payload: { resolution_note: "done once" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/focused-reviews/${fr1}/close", payload: { resolution_note: "done twice" }, as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with HTTP 409"
            - "GET /peer-review/focused-reviews/${fr1} still shows closed_at == '2026-08-01T00:00:00Z' and resolution_note == 'done once'"

      - name: deliberation_auto_open_on_third_submit
        claim_type: side_effect_execution
        grounds: ["state_machines.ReviewCase.IN_REVIEW_to_DELIBERATION"]
        excluded_because:
          difficulty_instance: third_submit_depth2_deliberation_cascade
          rationale: "The auto-open side effect (Deliberation row created OPEN with null rating) is asserted as link 2 of that §1.8 cascade instance."

  # =====================================================================
  - section: calculations
    instances:
      - name: rating_all_appropriate_no_ofi
        claim_type: correct_result
        grounds: ["calculations.committee_rating_aggregation"]
        distinguishing_aspect: "C=[5,4,5], O=[] -> APPROPRIATE (no rule 1-3 branch fires) — the fall-through arm of the mapping."
        test_recipe:
          setup: ["subject provider; CHAIR A; members B/C/D; case with B/C/D assigned and submitted scores 5, 4, 5 (no OFI)"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj AA", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "clean case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: {}, as: CommitteeMember, as_user_id: "${m_a}", captures: { rating: $.data.rating } }
          assert:
            - "rating == 'APPROPRIATE'"

      - name: rating_minor_via_single_mild_ofi
        claim_type: correct_result
        grounds: ["calculations.committee_rating_aggregation"]
        distinguishing_aspect: "C=[4,4,4], O=[3] -> MINOR_OFI via the '|O| >= 1' arm of rule 3 even though no OFI reaches the >= 4 severity floor."
