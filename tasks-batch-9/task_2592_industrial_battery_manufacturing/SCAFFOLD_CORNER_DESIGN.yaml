            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-600", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 600.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 950.0, lead_content_kg: 380.000, formation_charge_factor: 1.50, list_price_cents: 700000 }
              captures: { design_big_id: "$.data.id" }
