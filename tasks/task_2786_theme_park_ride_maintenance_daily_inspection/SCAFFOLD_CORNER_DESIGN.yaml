  - section: complexity_layers
    instances:

      - name: stale_expected_attraction_version_on_activate_returns_412_then_the_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[template-activate-stale-attraction]"
          - "errors[ERR_STALE_ATTRACTION_VERSION]"
          - "validations[priority 6]"
        distinguishing_aspect: "Activating template T1 bumps Attraction.version, so the version captured before that activation is stale: activating T2 with it is 412 ERR_STALE_ATTRACTION_VERSION and leaves active_template_id pointing at T1, while re-reading the attraction and retrying with the current version succeeds and switches the active template."
        test_recipe:
          setup:
            - "One attraction (version 1 captured as the stale value) and two DRAFT templates, each with one ADVISORY item. T1 is activated, which advances the attraction to version 2."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "OCC Attraction Ride", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "OC-1", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id", a_v_stale: "$.data.version" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t1: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t1}/items"
              payload: { sequence_no: 1, description: "Revision A line", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-02" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t2: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t2}/items"
              payload: { sequence_no: 1, description: "Revision B line", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t1}/activate"
              payload: { expected_attraction_version: "${a_v_stale}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /park-ops/inspection-templates/${t2}/activate"
              payload: { expected_attraction_version: "${a_v_stale}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_v_fresh: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${t2}/activate"
              payload: { expected_attraction_version: "${a_v_fresh}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "After the setup activation: Attraction.${a_id}.active_template_id == \"${t1}\" and version == ${a_v_stale} + 1"
            - "Trigger 1: 412 with error_id \"ERR_STALE_ATTRACTION_VERSION\"; template ${t2} stays DRAFT, ${t1} stays ACTIVE and the attraction version does not move"
            - "Trigger 2: ${a_v_fresh} == ${a_v_stale} + 1"
            - "Trigger 3: 200; template ${t2}.status == \"ACTIVE\", template ${t1}.status == \"RETIRED\", Attraction.active_template_id == \"${t2}\" and version == ${a_v_fresh} + 1"
            - "Every failed attempt left version untouched, so exactly two successful activations produced exactly two version increments"

      - name: stale_expected_shop_bay_version_on_overhaul_create_returns_412_then_the_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[overhaul-create-stale-shop-bay]"
          - "errors[ERR_STALE_SHOP_BAY_VERSION]"
          - "entities.ShopBay.fields.booked_order_count"
        distinguishing_aspect: "The first booking increments ShopBay.version, so a second booking submitted with the pre-booking version is 412 ERR_STALE_SHOP_BAY_VERSION even though its window (2027-01-10..2027-01-15) could never collide with the first (2026-11-01..2026-11-05); the OCC check at priority 6 therefore precedes the capacity check at priority 24, and booked_order_count stays 1 until the retry with the fresh version."
        test_recipe:
          setup:
            - "One attraction with one component and one bay of concurrent_slot_capacity 1 whose creation version is captured as the stale value. One work order is booked for 2026-11-01..2026-11-05."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "OCC Bay Ride", park_area: "SKYLINE", manufacturer: "B&M", model_code: "OB-1", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "OCC Gearbox", component_type: "GEARBOX", criticality: "ESSENTIAL", ndt_interval_cycles: 500000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay OCC", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { bay_id: "$.data.id", bay_v_stale: "$.data.version" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v_stale}", window_start_date: "2026-11-01", window_end_date: "2026-11-05", parts_subtotal_cents: 100000, labor_hours: 10 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { w1: "$.data.id" }
          trigger:
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v_stale}", window_start_date: "2027-01-10", window_end_date: "2027-01-15", parts_subtotal_cents: 100000, labor_hours: 10 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/shop-bays/${bay_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { bay_v_fresh: "$.data.version" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v_fresh}", window_start_date: "2027-01-10", window_end_date: "2027-01-15", parts_subtotal_cents: 100000, labor_hours: 10 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { w2: "$.data.id" }
          assert:
            - "After the setup booking: ShopBay.${bay_id}.booked_order_count == 1 and version == ${bay_v_stale} + 1"
            - "Trigger 1: 412 with error_id \"ERR_STALE_SHOP_BAY_VERSION\", not 409 ERR_BAY_CAPACITY_CONFLICT; booked_order_count stays 1 and no OverhaulWorkOrder row is created"
            - "Trigger 2: ${bay_v_fresh} == ${bay_v_stale} + 1"
            - "Trigger 3: 201; OverhaulWorkOrder.${w2}.status == \"SCHEDULED\", off_season == false (the 2027-01 window is inside the season), ShopBay.booked_order_count == 2 and version == ${bay_v_fresh} + 1"
            - "GET /park-ops/overhaul-work-orders?shop_bay_id=${bay_id} reports total_count == 2 with ${w1} and ${w2}"

      - name: ndt_day_interval_threshold_flips_current_due_and_overdue_on_its_exact_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.component_ndt_due_status.formula"
          - "calculations.component_ndt_due_status.constants"
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: "The day-based half of the NDT threshold is walked across both edges with the cycle counter frozen at 0: 29 days is CURRENT, 30 days (== ndt_interval_days) is DUE, 35 days is still DUE, and 36 days (== ceil(30 * 1.2)) is OVERDUE, which drags a SAFETY_CRITICAL component's attraction to posture DOWN with no other write."
        test_recipe:
          setup:
            - "One attraction with a SAFETY_CRITICAL component whose ndt_interval_days is 30 and ndt_interval_cycles is 500000 (so cycles never trigger). An NDT PASS is recorded at the 2026-08-01T00:00:00Z start, pinning last_ndt_at to that instant."
