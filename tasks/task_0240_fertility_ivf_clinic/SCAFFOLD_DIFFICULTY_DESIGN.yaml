      - name: appointment_cyclic_confirmed_rescheduled_confirmed
        grounds:
          - state_machines.MonitoringAppointment.CONFIRMED_to_RESCHEDULED
          - state_machines.MonitoringAppointment.RESCHEDULED_to_CONFIRMED
          - entities.MonitoringAppointment.fields.status
        distinguishing_aspect: |
          On MonitoringAppointment (a different entity from TreatmentCycle), the status cycles
          CONFIRMED -> RESCHEDULED -> CONFIRMED, a true loop edge that no linear pipeline permits.
        test_recipe:
          setup:
            - "Clinic clock at 2026-06-01T00:00:00.000Z; a cycle exists; one CONFIRMED appointment in the future."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Loop Clinic", room_concurrency_limit: 5 }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
