    description: "Publish a DRAFT scorecard; OCC-checked against the account version."
    roles: [GovernanceManager]
    code: 200
    input: [expected_account_version]
    output: Scorecard
    side_effects: ["scorecard_state := PUBLISHED", "computes composite_bps by weighted_scorecard_composite", "recomputes the account's SLA KPI actual_value", "computes KPI penalty", "recomputes PortfolioAccount.annual_net_fee_cents", "increments PortfolioAccount.version by 1"]
  - method: POST
    path: "/api/discipline-audits"
    description: "Create a DisciplineAudit in SCHEDULED."
    roles: [GovernanceManager]
    code: 201
    input: [account_id, discipline, finding]
    output: DisciplineAudit
    side_effects: ["sets audit_state := SCHEDULED"]
  - method: GET
    path: "/api/discipline-audits"
    description: "List audits with optional account filter."
    roles: [AccountExecutive, GovernanceManager]
    code: 200
    input: ["account_id?", "discipline?", "limit?", "offset?"]
    output: DisciplineAudit[]
    side_effects: []
  - method: GET
    path: "/api/discipline-audits/{id}"
    description: "Read an audit."
    roles: [AccountExecutive, GovernanceManager]
    code: 200
    input: []
    output: DisciplineAudit
    side_effects: []
  - method: POST
    path: "/api/discipline-audits/{id}/start"
    description: "Start a SCHEDULED audit."
    roles: [GovernanceManager]
    code: 200
    input: []
    output: DisciplineAudit
    side_effects: ["audit_state := IN_REVIEW"]
  - method: POST
    path: "/api/discipline-audits/{id}/decide"
    description: "Decide an IN_REVIEW audit."
    roles: [GovernanceManager]
    code: 200
    input: [outcome]
    output: DisciplineAudit
    side_effects: ["audit_state := PASSED or FAILED", "recomputes PortfolioAccount.governance_posture", "increments PortfolioAccount.version by 1"]
  - method: POST
    path: "/api/data-licenses"
    description: "Request a DataLicense."
    roles: [DataSteward]
    code: 201
    input: [account_id, licensee_name, platform_tier_at_issue, data_scope]
    output: DataLicense
    side_effects: ["sets license_state := REQUESTED", "computes requires_written_client_consent"]
  - method: GET
    path: "/api/data-licenses"
    description: "List data licences with optional account filter."
    roles: [AccountExecutive, DataSteward, GovernanceManager]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: DataLicense[]
    side_effects: []
  - method: GET
    path: "/api/data-licenses/{id}"
    description: "Read a data licence."
    roles: [AccountExecutive, DataSteward, GovernanceManager]
    code: 200
    input: []
    output: DataLicense
    side_effects: []
  - method: POST
    path: "/api/data-licenses/{id}/grant"
    description: "Grant a REQUESTED licence."
    roles: [DataSteward]
    code: 200
    input: ["client_consent_confirmed?"]
    output: DataLicense
    side_effects: ["license_state := GRANTED", "recomputes requires_written_client_consent against the current tier"]
  - method: POST
    path: "/api/data-licenses/{id}/reject"
    description: "Reject a REQUESTED licence."
    roles: [DataSteward]
    code: 200
    input: []
    output: DataLicense
    side_effects: ["license_state := REJECTED"]
  - method: POST
    path: "/api/transition-tasks"
    description: "Create a TransitionTask in PENDING."
    roles: [TransitionManager]
    code: 201
    input: [account_id, task_name, task_type, sequence_no, blocking, due_at]
    output: TransitionTask
    side_effects: ["sets task_state := PENDING", "recomputes PortfolioAccount.completion_pct_bps"]
  - method: GET
    path: "/api/transition-tasks"
    description: "List transition tasks with optional account filter."
    roles: [AccountExecutive, TransitionManager, GovernanceManager]
    code: 200
    input: ["account_id?", "task_type?", "limit?", "offset?"]
    output: TransitionTask[]
    side_effects: []
  - method: GET
    path: "/api/transition-tasks/{id}"
    description: "Read a transition task."
    roles: [AccountExecutive, TransitionManager, GovernanceManager]
    code: 200
    input: []
    output: TransitionTask
    side_effects: []
  - method: POST
    path: "/api/transition-tasks/{id}/start"
    description: "Start a PENDING task."
    roles: [TransitionManager]
    code: 200
    input: []
    output: TransitionTask
    side_effects: ["task_state := IN_PROGRESS"]
  - method: POST
    path: "/api/transition-tasks/{id}/complete"
    description: "Complete an IN_PROGRESS task."
    roles: [TransitionManager]
    code: 200
    input: []
    output: TransitionTask
    side_effects: ["task_state := DONE", "recomputes PortfolioAccount.completion_pct_bps", "increments PortfolioAccount.version by 1"]
  - method: POST
    path: "/api/transition-tasks/{id}/fail"
    description: "Fail an IN_PROGRESS task."
    roles: [TransitionManager]
    code: 200
    input: []
    output: TransitionTask
    side_effects: ["task_state := FAILED", "recomputes PortfolioAccount.completion_pct_bps", "increments PortfolioAccount.version by 1"]
  - method: POST
    path: "/api/fee-accruals"
    description: "Create an AccountFeeAccrual for a period."
    roles: [AccountExecutive]
    code: 201
    input: [account_id, period, base_fee_cents]
    output: AccountFeeAccrual
    side_effects: ["sets credit_application_state := OPEN", "sets applied_credit_cents := 0"]
  - method: GET
    path: "/api/fee-accruals"
    description: "List fee accruals with optional account filter."
    roles: [AccountExecutive, GovernanceManager, TransactionManager]
    code: 200
    input: ["account_id?", "period?", "limit?", "offset?"]
    output: AccountFeeAccrual[]
    side_effects: []
  - method: GET
    path: "/api/fee-accruals/{id}"
    description: "Read a fee accrual."
    roles: [AccountExecutive, GovernanceManager, TransactionManager]
    code: 200
    input: []
    output: AccountFeeAccrual
    side_effects: []
  - method: POST
    path: "/api/fee-accruals/{id}/settle"
    description: "Settle a CREDITED accrual."
    roles: [AccountExecutive]
    code: 200
    input: []
    output: AccountFeeAccrual
    side_effects: ["credit_application_state := SETTLED", "settled_at := now"]
  - method: GET
    path: "/api/discipline-audits/{id}/reviews"
    description: "List the review rounds recorded against an audit."
    roles: [AccountExecutive, GovernanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditReview[]
    side_effects: []
  - method: POST
    path: "/api/discipline-audits/{id}/reviews"
    description: "Record a review round against an audit."
    roles: [GovernanceManager]
    code: 201
    input: [reviewer_name, round_notes]
    output: AuditReview
    side_effects: ["computes the next review_round_no", "increments PortfolioAccount.version by 1"]
  - method: GET
    path: "/api/accounts/{id}/audit-reviews"
    description: "List every audit review round recorded on the account's audits."
    roles: [AccountExecutive, GovernanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditReview[]
    side_effects: []
  - method: POST
    path: "/api/broker-engagements/{id}/execute"
    description: "Execute an ASSIGNED broker engagement, splitting the deal commission converted from its transaction request."
    roles: [TransactionManager]
    code: 200
    input: []
    output: BrokerEngagement
    side_effects: ["engagement_state := EXECUTED", "converts the transaction request's third_party_commission_cents into the deal commission", "computes broker_share_cents and account_share_cents by broker_commission_split", "consumes the engagement's transaction request"]
  - method: POST
    path: "/api/leases/{id}/expire"
    description: "Terminate a lease's pipeline by marking it expired at the account clock; available to admin/operator roles."
    roles: [TransactionManager, AccountExecutive]
    code: 200
    input: []
    output: Lease
    side_effects: ["pipeline_state := REJECTED"]
  - method: POST
    path: "/api/transition-tasks/{id}/expire"
    description: "Expire an overdue transition task once the account clock has passed its due_at."
    roles: [TransitionManager]
    code: 200
    input: []
    output: TransitionTask
    side_effects: ["task_state := FAILED", "recomputes PortfolioAccount.completion_pct_bps", "increments PortfolioAccount.version by 1"]
  - method: GET
    path: "/api/audit-reviews/{id}"
    description: "Read one audit review round."
    roles: [AccountExecutive, GovernanceManager]
    code: 200
    input: []
    output: AuditReview
    side_effects: []
  - method: POST
    path: "/api/account-assignments"
    description: "Assign an operator to an account using the account_id in the body."
    roles: [AccountExecutive]
    code: 201
    input: [account_id, assignee_name, assignment_role, "approval_level?"]
    output: AccountAssignment
    side_effects: ["links the assignment to the account"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads the fixed default 2026-09-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [GovernanceManager, AccountExecutive]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, advanced_by_hours: integer }
    side_effects: ["sets every TransitionTask whose due_at <= the new clock instant and task_state IN {PENDING, IN_PROGRESS} to task_state := FAILED", "recomputes affected accounts' completion_pct_bps", "recomputes every Lease.expiration_bucket", "recomputes every ServiceLevelKpi.actual_value and escalation_status", "recomputes affected accounts' governance_posture"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent or not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not authorised for the endpoint being called"
  - id: ERR_NOT_ASSIGNED
    http: 403
    condition: "acting entity is not operationally assigned to the account that owns the target resource"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path id or body FK resolves to no persisted resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "a transition is requested from a state that does not declare it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "request body is missing a required field or carries a field of the wrong type"
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "child creation or mutation is requested while the parent PortfolioAccount.lifecycle_state is not ACTIVE"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "a mutation is requested on an account whose lifecycle_state is terminal"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a lease revision is requested after revision_count has already reached 3"
  - id: ERR_OFFBOARDING_PENDING
    http: 409
    condition: "a lease or transaction request is created while the account is OFFBOARDING"
  - id: ERR_NOT_TRANSITIONING
    http: 409
    condition: "abort-transition is requested while the account is not OFFBOARDING"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_account_version does not equal the parent PortfolioAccount.version at write time"
  - id: ERR_BROKER_NOT_LICENSED
    http: 422
    condition: "a broker engagement is created with licensed_in_market false for the target market"
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "a DataLicense grant or an account transition requires written client consent that is absent, or a failed audit is unresolved"
  - id: ERR_LEASE_EXPIRED
    http: 422
    condition: "a lease whose lease_end_date is not strictly after the account clock is submitted for approval"
  - id: ERR_MARKET_MISMATCH
    http: 422
    condition: "a broker engagement's market_code differs from the market_code of the lease on its transaction request"
  - id: ERR_LEASE_OVERLAP
    http: 422
    condition: "a lease premises interval collides with a prior lease on the same address, or starts inside the 30-day premises cooldown after it ends"
  - id: ERR_SITE_OVERLAP
    http: 422
    condition: "a consolidation interval on a site overlaps an already-committed consolidation interval on the same site"
  - id: ERR_COMMISSION_EXCEEDS_FEE
    http: 422
    condition: "a commission record's base_rent_cents exceeds the account's gross fee base"
  - id: ERR_SITE_EXCEEDS_PORTFOLIO
    http: 422
    condition: "a facility site's sqft exceeds the account's remaining leasable area"
  - id: ERR_SQFT_MISMATCH
    http: 422
    condition: "a consolidation project's planned_sqft_reduction does not equal the sum of its assigned sites' reductions"
  - id: ERR_APPROVAL_LEVEL_INSUFFICIENT
    http: 422
    condition: "an approval decision's actor level is below the transaction request's required_approval_level"
  - id: ERR_FEE_ACCRUAL_LOCKED
    http: 409
    condition: "a fee accrual that is not OPEN is asked to accept a new credit application"
  - id: ERR_CLOCK_ALREADY_ADVANCED
    http: 409
    condition: "the logical clock is set to an instant that is not strictly after its current value"
  - id: ERR_TRANSITION_INCOMPLETE
    http: 422
    condition: "account closure is requested before completion_pct_bps has reached 10000"
  - id: ERR_BLOCKING_TASK_OPEN
    http: 422
    condition: "offboarding is requested while a blocking TransitionTask is not DONE"
  - id: ERR_COOLING_OFF_ACTIVE
    http: 422
    condition: "a transition is requested while a FAILED audit's cooling-off window is still open"
  - id: ERR_LEASE_OVERDUE
    http: 422
    condition: "a lease or transaction request is submitted while the lease is overdue and expired leases already exist on the market"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountExecutive
    description: "Owns the outsourcing account contract, fee accruals and closure."
    identity: "entity_backed:PortfolioAccount"
    exclusive_operations: ["POST /api/accounts", "PUT /api/accounts/{id}", "POST /api/accounts/{id}/activate", "POST /api/accounts/{id}/transitions", "POST /api/accounts/{id}/abort-transition", "POST /api/accounts/{id}/close", "POST /api/accounts/{id}/close-converted", "POST /api/fee-accruals", "POST /api/fee-accruals/{id}/settle"]
    shared_operations: ["POST /api/commission-records", "POST /api/_clock/set_current_utc", "GET /api/accounts/{id}", "GET /api/accounts"]
  - name: TransactionManager
    description: "Runs transaction management: lease pipeline, broker deployment and execution."
    identity: "opaque"
    exclusive_operations: ["POST /api/leases", "POST /api/leases/{id}/submit-for-approval", "POST /api/leases/{id}/approve", "POST /api/leases/{id}/reject", "POST /api/leases/{id}/revise", "POST /api/leases/{id}/launch-marketing", "POST /api/leases/{id}/open-negotiation", "POST /api/leases/{id}/execute", "POST /api/lease-executions/{id}/apply", "POST /api/transaction-requests", "POST /api/transaction-requests/{id}/submit", "POST /api/transaction-requests/{id}/withdraw", "POST /api/transaction-requests/{id}/cancel", "POST /api/broker-engagements", "POST /api/broker-engagements/{id}/assign", "POST /api/broker-engagements/{id}/terminate"]
    shared_operations: ["POST /api/commission-records", "GET /api/transaction-requests", "GET /api/broker-engagements", "GET /api/leases"]
  - name: ApprovalAuthority
    description: "Approval-chain authority for transaction requests and consolidation projects; assigned per account through AccountAssignment."
    identity: "entity_backed:AccountAssignment"
    exclusive_operations: ["POST /api/transaction-requests/{id}/decide", "POST /api/consolidation-projects/{id}/approve"]
    shared_operations: ["GET /api/transaction-requests", "GET /api/leases", "GET /api/accounts/{id}"]
  - name: FacilitiesManager
    description: "Runs facilities service delivery, vendors and sites."
    identity: "opaque"
    exclusive_operations: ["POST /api/facilities-vendors", "POST /api/facilities-vendors/{id}/activate", "POST /api/facilities-vendors/{id}/suspend", "POST /api/facilities-vendors/{id}/reinstate", "POST /api/facilities-vendors/{id}/terminate", "POST /api/facility-sites", "POST /api/facility-sites/{id}/vacate", "POST /api/facility-sites/{id}/consolidate", "POST /api/facility-sites/{id}/dispose"]
    shared_operations: ["GET /api/facility-sites", "GET /api/facilities-vendors", "GET /api/accounts/{id}"]
  - name: OccupancyPlanner
    description: "Runs occupancy planning and portfolio consolidation projects."
    identity: "opaque"
    exclusive_operations: ["POST /api/consolidation-projects", "POST /api/consolidation-projects/{id}/submit", "POST /api/consolidation-projects/{id}/start-execution", "POST /api/consolidation-projects/{id}/cancel"]
    shared_operations: ["GET /api/consolidation-projects", "GET /api/facility-sites"]
  - name: GovernanceManager
    description: "Runs governance: discipline audits, scorecards, KPI evaluation and the logical clock."
    identity: "opaque"
    exclusive_operations: ["POST /api/service-level-kpis", "POST /api/service-level-kpis/{id}/evaluate", "POST /api/scorecards", "POST /api/scorecards/{id}/publish", "POST /api/discipline-audits", "POST /api/discipline-audits/{id}/start", "POST /api/discipline-audits/{id}/decide", "POST /api/discipline-audits/{id}/reviews"]
    shared_operations: ["POST /api/_clock/set_current_utc", "GET /api/service-level-kpis", "GET /api/scorecards", "GET /api/discipline-audits"]
  - name: DataSteward
    description: "Administers client-owned data rights and data licences."
    identity: "opaque"
    exclusive_operations: ["POST /api/data-licenses", "POST /api/data-licenses/{id}/grant", "POST /api/data-licenses/{id}/reject"]
    shared_operations: ["GET /api/data-licenses", "GET /api/accounts/{id}"]
  - name: TransitionManager
    description: "Runs transition and offboarding task execution."
    identity: "opaque"
    exclusive_operations: ["POST /api/transition-tasks", "POST /api/transition-tasks/{id}/start", "POST /api/transition-tasks/{id}/complete", "POST /api/transition-tasks/{id}/fail"]
    shared_operations: ["GET /api/transition-tasks", "GET /api/accounts/{id}"]