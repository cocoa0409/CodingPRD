            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T10:00:00Z", scheduled_end: "2026-08-01T11:00:00Z" }, as: MasterServicer, captures: { in2_id: $.data.id } }
            - { call: "POST /inspections/${in1_id}/close", payload: { outcome: "COMPLETED", condition_rating: "POOR" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "POST /inspections/${in2_id}/close", payload: { outcome: "COMPLETED", condition_rating: "POOR" }, as: Inspector, as_user_id: "${i_id}" }
