  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — two dependencies across DIFFERENT
  # entity pairs: DeploymentAssignment -> Clearance (briefing gate at check-in)
  # and Volunteer -> BackgroundCheck (auto-promotion gate).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_rejected_when_briefing_clearance_expired
        grounds:
          - state_machines.DeploymentAssignment.CONFIRMED_to_CHECKED_IN
          - state_machines.Clearance.ACTIVE_to_EXPIRED
          - errors[ERR_BRIEFING_NOT_CURRENT]
        distinguishing_aspect: |
          Entity pair DeploymentAssignment -> Clearance: the assignment is
          CONFIRMED, the shift window is open, waiver and PPE are in order — but
          the volunteer's SAFETY_BRIEFING clearance crossed valid_until, so the
          transition is rejected with ERR_BRIEFING_NOT_CURRENT. The assignment's
          valid moves depend on a different entity's state.
        test_recipe:
          setup:
            - "Incident ACTIVE; volunteer READY with briefing signed 2026-08-01 (valid_until 2026-08-04T00:00:00Z), waiver ACTIVE, PPE issued"
