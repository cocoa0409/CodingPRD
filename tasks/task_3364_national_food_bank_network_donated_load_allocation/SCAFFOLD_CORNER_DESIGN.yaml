          - entities.MemberAudit.fields.weighted_score
        distinguishing_aspect: "The COMPREHENSIVE weighted score is emitted with exactly one decimal place using round_half_up: 87/80/90 gives 85.8 and passes, while 81/83/85 gives 82.2 and fails."
