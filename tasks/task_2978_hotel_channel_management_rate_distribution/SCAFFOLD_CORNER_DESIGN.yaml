      - name: geo_market_gate_applies_only_to_channels_with_a_non_empty_market_list
        claim_type: conditional_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_GEO_MARKET_NOT_SERVED]
          - entities.Channel.fields.geo_market_codes
        distinguishing_aspect: |
          An empty geo_market_codes list means "serves everywhere", not "serves nowhere": the same
          US-NY request is refused on the channel that lists only US-CA and quoted normally on the
          channel that lists nothing, so the rule is conditional on the channel's configuration rather
          than universal.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING with master hash 'kingv1' and 5 images."
            - "Channel GEOCH (DIRECT_BRAND, commission_bp 0, geo_market_codes ['US-CA']) and channel ANYCH (DIRECT_BRAND, commission_bp 0, geo_market_codes omitted so []), each with a connection."
