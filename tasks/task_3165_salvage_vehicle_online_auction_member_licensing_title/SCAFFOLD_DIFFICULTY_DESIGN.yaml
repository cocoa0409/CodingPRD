          Depth-5 chain where each hop is caused by the previous hop's
          mutation, not the original close: close-lot creates the Sale (1);
          the Sale's creation creates the Settlement DRAFT (2); payment on
          the Sale flips Settlement DRAFT -> FINALIZED (3); gate-pass
          completion flips Settlement FINALIZED -> PAID (4) and the same
