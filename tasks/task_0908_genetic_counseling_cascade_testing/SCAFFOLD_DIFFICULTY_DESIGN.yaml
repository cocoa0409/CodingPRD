# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Genetic Counseling & Cascade Testing — 9 rules x 2 instances = 18
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: carrier_risk_prior_vs_residual_on_case
        grounds:
          - calculations.prior_carrier_risk
          - calculations.residual_carrier_risk
          - entities.CounselingCase.fields.prior_risk_pct
          - entities.CounselingCase.fields.residual_risk_pct
          - state_machines.TestResult.RELEASED_to_DISCLOSED
        distinguishing_aspect: "Same CounselingCase: pre-test prior_risk_pct (pedigree only) and post-test residual_risk_pct (Bayesian update) diverge — a true-negative collapses prior 0.2 to residual 0.05; this dual-variant lives on the CounselingCase risk domain."
        test_recipe:
          setup:
            - "Family, Counselor, Lab; proband case with familial_variant_known=true, ancestry EUROPEAN"
            - "One affected first-degree pedigree member, onset 35 -> prior_risk_pct 0.2 (HIGH)"
            - "TESTING consent signed; order submitted; BENIGN result released then disclosed"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam1", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC A", npi: "1000000001" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab1", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob A", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx cancer", familial_variant_known: true, covered_sessions: 3 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 35 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { mem_id: $.data.id } }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA panel", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.100A>G", classification: "BENIGN" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
          trigger:
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          assert:
            - "CounselingCase.${case_id}.prior_risk_pct == 0.2"
            - "CounselingCase.${case_id}.residual_risk_pct == 0.05"
            - "CounselingCase.${case_id}.carrier_result == NEGATIVE"
            - "CounselingCase.${case_id}.risk_tier == LOW"

      - name: claim_allowed_estimated_vs_final_on_claim
        grounds:
          - calculations.claim_allowed_amount
          - entities.InsuranceClaim.fields.estimated_allowed_cents
          - entities.InsuranceClaim.fields.final_allowed_cents
          - state_machines.CounselingCase.BILLED_to_PAID
        distinguishing_aspect: "Same InsuranceClaim: estimated_allowed_cents (flat estimated_allowed_rate on billed) is 210000 while final_allowed_cents (payer fee schedule) is 250000 — dual-variant on the InsuranceClaim domain, distinct from the CounselingCase risk domain."
        test_recipe:
          setup:
            - "Family, Counselor, Lab, case; drafted test order"
            - "Claim with one line item billed 300000, coverage_pct 0.8, estimated_allowed_rate 0.7"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam2", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC B", npi: "1000000002" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab2", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob B", patient_dob: "1979-02-02", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "Panel", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-10T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /insurance-claims", payload: { counseling_case_id: "${case_id}", test_order_id: "${order_id}", payer_name: "Acme Health", member_number: "M123", coverage_pct: 0.8, estimated_allowed_rate: 0.7, line_items: [ { cpt: "81162", billed_cents: 300000 } ] }, as: BillingSpecialist, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /insurance-claims/${claim_id}/authorize", payload: {}, as: BillingSpecialist }
            - { call: "POST /insurance-claims/${claim_id}/submit", payload: {}, as: BillingSpecialist }
            - { call: "POST /insurance-claims/${claim_id}/adjudicate", payload: { outcome: "PAID", line_allowed_cents: [ 250000 ] }, as: BillingSpecialist }
          assert:
            - "InsuranceClaim.${claim_id}.estimated_allowed_cents == 210000"
            - "InsuranceClaim.${claim_id}.final_allowed_cents == 250000"
            - "InsuranceClaim.${claim_id}.patient_responsibility_cents == 50000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: prior_risk_multifactor_nonlinear
        grounds:
          - calculations.prior_carrier_risk
          - entities.PedigreeMember.fields.degree
          - entities.PedigreeMember.fields.age_of_onset
          - entities.CounselingCase.fields.ancestry
        distinguishing_aspect: "Mode (a): >=3 inputs interact nonlinearly — degree_weight x onset_multiplier summed over affected members, plus ancestry bonus, then min-capped: 0.05 + (1.0*2 + 0.5*3)*0.05 + 0.10 = 0.325."
        test_recipe:
          setup:
            - "Case ancestry ASHKENAZI_JEWISH; two affected members: first-degree onset 45, second-degree onset 38"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam3", outreach_budget_cents: 50000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC C", npi: "1000000003" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob C", patient_dob: "1985-03-03", sex: "FEMALE", ancestry: "ASHKENAZI_JEWISH", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "PARENT", degree: 1, affected: true, age_of_onset: 45 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "AUNT_UNCLE", degree: 2, affected: true, age_of_onset: 38 }, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          assert:
            - "CounselingCase.${case_id}.prior_risk_pct == 0.325"
            - "CounselingCase.${case_id}.risk_tier == HIGH"

      - name: patient_responsibility_perline_round_then_sum
        grounds:
          - calculations.patient_responsibility
          - entities.InsuranceClaim.fields.patient_responsibility_cents
          - state_machines.CounselingCase.BILLED_to_PAID
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — per-line round_half_up(allowed*(1-0.85)) then sum yields 1515+3045=4560, whereas sum-then-round of 30404*0.15=4560.6 would give 4561."
        test_recipe:
          setup:
            - "Case + drafted order; claim coverage_pct 0.85; adjudicated line allowed amounts [10101, 20303]"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam4", outreach_budget_cents: 50000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC D", npi: "1000000004" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab4", max_concurrent_capacity: 5, turnaround_days: 10 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob D", patient_dob: "1975-04-04", sex: "MALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 1 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "Panel", list_price_cents: 30404, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-08T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /insurance-claims", payload: { counseling_case_id: "${case_id}", test_order_id: "${order_id}", payer_name: "Beta Ins", member_number: "M999", coverage_pct: 0.85, estimated_allowed_rate: 0.5, line_items: [ { cpt: "81162", billed_cents: 30404 } ] }, as: BillingSpecialist, captures: { claim_id: $.data.id } }
            - { call: "POST /insurance-claims/${claim_id}/authorize", payload: {}, as: BillingSpecialist }
            - { call: "POST /insurance-claims/${claim_id}/submit", payload: {}, as: BillingSpecialist }
          trigger:
            - { call: "POST /insurance-claims/${claim_id}/adjudicate", payload: { outcome: "PAID", line_allowed_cents: [ 10101, 20303 ] }, as: BillingSpecialist }
          assert:
            - "InsuranceClaim.${claim_id}.patient_responsibility_cents == 4560"
            - "InsuranceClaim.${claim_id}.final_allowed_cents == 30404"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cascade_invitation_declined_then_resent_cycle
        grounds:
          - state_machines.CascadeInvitation.SENT_to_DECLINED
          - state_machines.CascadeInvitation.DECLINED_to_SENT
          - entities.CascadeInvitation.fields.status
        distinguishing_aspect: "Cycle DECLINED -> SENT on CascadeInvitation: after a decline, the same invitation is re-sent, returning to SENT and re-reserving its cost — a genuine loop, not a linear pipeline."
        test_recipe:
          setup:
            - "Proband disclosed PATHOGENIC (actionable); an at-risk relative invitation created and sent, then declined"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam5", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC E", npi: "1000000005" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab5", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob E", patient_dob: "1980-05-05", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 3 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: false }, as: GeneticCounselor, as_user_id: "${cid}", captures: { mem_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "PARENT", degree: 1, affected: true, age_of_onset: 42 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.68del", classification: "PATHOGENIC" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /cascade-invitations", payload: { family_id: "${fid}", proband_case_id: "${case_id}", pedigree_member_id: "${mem_id}", relative_name: "Rel E", relationship: "SIBLING", degree: 1, contact_method: "EMAIL", expires_at: "2026-07-01T00:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { inv_id: $.data.id } }
            - { call: "POST /cascade-invitations/${inv_id}/send", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /cascade-invitations/${inv_id}/decline", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /cascade-invitations/${inv_id}/send", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          assert:
            - "CascadeInvitation.${inv_id}.status == SENT"
            - "CascadeInvitation.${inv_id}.estimated_cost_cents == 100"
            - "Family.${fid}.outreach_reserved_cents == 100"

      - name: case_clinical_and_billing_axes_advance_independently
        grounds:
          - entities.CounselingCase.fields.clinical_status
          - entities.CounselingCase.fields.billing_status
          - state_machines.CounselingCase.INTAKE_to_RISK_ASSESSED
          - state_machines.CounselingCase.PENDING_AUTH_to_AUTHORIZED
        distinguishing_aspect: "Parallel dimensions on one CounselingCase: clinical_status reaches RISK_ASSESSED while billing_status independently reaches AUTHORIZED — neither axis gates the other."
        test_recipe:
          setup:
            - "Case with pedigree assessed (clinical RISK_ASSESSED); drafted order; claim created and authorized (billing AUTHORIZED)"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam6", outreach_budget_cents: 50000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC F", npi: "1000000006" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab6", max_concurrent_capacity: 5, turnaround_days: 10 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob F", patient_dob: "1982-06-06", sex: "MALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 60 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "Panel", list_price_cents: 200000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-09T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /insurance-claims", payload: { counseling_case_id: "${case_id}", test_order_id: "${order_id}", payer_name: "Gamma", member_number: "M77", coverage_pct: 0.8, estimated_allowed_rate: 0.7, line_items: [ { cpt: "81162", billed_cents: 200000 } ] }, as: BillingSpecialist, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /insurance-claims/${claim_id}/authorize", payload: {}, as: BillingSpecialist }
          assert:
            - "CounselingCase.${case_id}.clinical_status == RISK_ASSESSED"
            - "CounselingCase.${case_id}.billing_status == AUTHORIZED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disclose_positive_cascades_to_plan_and_referral_depth3
        grounds:
          - state_machines.TestResult.RELEASED_to_DISCLOSED
          - state_machines.CounselingCase.TESTING_to_DISCLOSED
          - entities.SurveillancePlan.fields.status
          - entities.Referral.fields.specialty
        distinguishing_aspect: "Depth-3 chain from disclose: TestResult->DISCLOSED (A) mutates CounselingCase (B: carrier_result/residual/DISCLOSED->SURVEILLANCE), which triggers SurveillancePlan auto-create (C), which because risk_tier HIGH triggers Referral auto-create (D)."
        test_recipe:
          setup:
            - "Proband case, affected first-degree onset 35 (prior 0.2); consent signed; order submitted; PATHOGENIC result released"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam7", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC G", npi: "1000000007" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab7", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob G", patient_dob: "1980-07-07", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", familial_variant_known: false, covered_sessions: 3 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "PARENT", degree: 1, affected: true, age_of_onset: 35 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.68del", classification: "PATHOGENIC" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
          trigger:
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
          assert:
            - "CounselingCase.${case_id}.carrier_result == POSITIVE_PATHOGENIC"
            - "CounselingCase.${case_id}.residual_risk_pct == 0.99"
            - "CounselingCase.${case_id}.clinical_status == SURVEILLANCE"
            - "GET /surveillance-plans?counseling_case_id=${case_id} returns exactly 1 plan with status ACTIVE and risk_tier HIGH and screening_interval_months 6"
            - "GET /referrals?counseling_case_id=${case_id} returns exactly 1 referral with status PENDING and specialty HIGH_RISK_CLINIC"

      - name: accept_invitation_cascades_to_relative_case_and_family_counters_depth2
        grounds:
          - state_machines.CascadeInvitation.SENT_to_ACCEPTED
          - entities.CounselingCase.fields.originating_invitation_id
          - entities.Family.fields.cascade_cases_count
          - calculations.cascade_uptake
        distinguishing_aspect: "Depth-2 chain from accept (a different trigger than disclose): CascadeInvitation->ACCEPTED (A) auto-creates the relative CounselingCase (B), whose creation recomputes Family.cascade_cases_count and cascade_uptake_pct (C)."
        test_recipe:
          setup:
            - "Proband disclosed PATHOGENIC; an at-risk relative invitation sent"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam8", outreach_budget_cents: 100000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC H", npi: "1000000008" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "Lab8", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob H", patient_dob: "1980-08-08", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 3 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: false }, as: GeneticCounselor, as_user_id: "${cid}", captures: { mem_id: $.data.id } }
