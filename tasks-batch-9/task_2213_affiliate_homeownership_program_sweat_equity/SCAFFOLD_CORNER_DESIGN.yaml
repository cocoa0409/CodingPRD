      - name: willingness_mean_rounds_to_two_decimals_before_the_composite
        claim_type: precision
        grounds: [calculations.committee_quorum_and_willingness, calculations.household_selection_scoring, entities.ApplicantHousehold.fields.willingness_score, entities.ApplicantHousehold.fields.composite_selection_score, "state_machines.ApplicantHousehold.selection_status.COMMITTEE_REVIEW_to_SELECTED"]
        distinguishing_aspect: "Two roundings compose without drifting: the willingness mean of 70 and 85 is 77.5, and the composite then multiplies THAT stored 2-dp value by 0.25 to reach 90.375, which rounds half-up to 90.38. Re-deriving the composite from the unrounded mean would give the same figure here only if the intermediate is not truncated, so the assertion pins both the mean and the half-cent rounding of the weighted sum."
        test_recipe:
          setup:
            - "Canonical program (quorum 2). One household verified at 3000000 cents annual income and 100000 cents housing cost, size 4 in 1 bedroom with 3 deficiencies, 30000 cents monthly debt, credit 640 and 24 on-time months, referred to committee. Both committee members submit all three dimensions; the WILLINGNESS scores deliberately differ (70 and 85)."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "File verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 70, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 85, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
          trigger:
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Committee minutes 2026-08-01: willingness split 70 and 85" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "HTTP 200 and score_basis == FINAL"
            - "willingness_score == 77.5 — round((70 + 85) / 2, 2), the mean over the two distinct reviewers' WILLINGNESS rows only; the NEED and ABILITY scores of 80 do not enter it"
            - "need_score == 90: cost burden 100000/250000 == 0.4 gives 30, 4 persons in 1 bedroom gives 30, 3 deficiencies gives 30"
            - "ability_to_pay_score == 100: DTI 30000/250000 == 0.12 gives 50, credit 640 gives 25, 24 on-time months gives 25"
            - "composite_selection_score == 90.38: 0.40 * 90 + 0.35 * 100 + 0.25 * 77.5 == 90.375, rounded half-up to two places — not 90.37"
            - "selection_status == SELECTED because 90.38 is at or above the 70.00 SELECT_THRESHOLD"

