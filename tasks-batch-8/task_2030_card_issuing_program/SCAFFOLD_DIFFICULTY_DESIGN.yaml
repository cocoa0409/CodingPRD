scaffold_difficulty_design:
  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: interchange_provisional_vs_final_on_settlement_domain
        grounds:
          - calculations.interchange_qualification
          - calculations.qualification_tier_rules
        distinguishing_aspect: |
          Settlement-domain calculation: the provisional variant (computed at AuthorizationEvent
          time, optimistic QUALIFIED assumption, no uplift applied at auth time) yields different
          cents than the final variant (computed at Settlement time against actual
          qualification_tier and product_class uplift). For the pinned fixture below, provisional
          yields floor(10000 * 145 / 10000) + 10 = 145 + 10 = 155 cents; final settles as
          MID_QUALIFIED (auth_to_settle_seconds = 100000 > 86400 AND <= 172800, chip=true),
          network=VISA, product_class=DEBIT_CONSUMER (no uplift): floor(10000 * 185 / 10000) + 10
          = 185 + 10 = 195 cents. Different cents for identical economic event.
        test_recipe:
          setup:
            - "CardProgram prog (VISA, DEBIT_CONSUMER, currency=USD, daily_spend_cap=10000000) is LIVE"
            - "BinRange bin (prefix=411111, range_size=1000) ACTIVE with window covering clock"
            - "CardAccount acct (program=prog, INDIVIDUAL, daily_spend_cap=100000) is OPEN with available_balance_cents = 100000"
            - "Card card (PHYSICAL, expiry 12/2030) is ACTIVE with pin_status=SET"
            - "AuthorizationEvent auth of 10000 cents at clock=2026-08-10T00:00:00Z, mcc=5411, country=US, decision=APPROVED"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-1", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 10000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /issuing/programs/${prog_id}/bin-ranges"
              payload: { bin_prefix: "411111", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
              captures: { bin_id: $.data.id }
            - call: "POST /issuing/programs/${prog_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog_id}", external_account_ref: "A-1", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct_id: $.data.id }
            - call: "POST /issuing/accounts/${acct_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct_id}/fund"
              payload: { amount_cents: 100000 }
              as: FinanceController
            - call: "POST /issuing/accounts/${acct_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL", bin_range_id: "${bin_id}" }
              as: ProgramManager
              captures: { card_id: $.data.id }
            - call: "POST /issuing/cards/${card_id}/pin"
              payload: { new_pin: "1234" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok_val: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card_id}/activate"
              payload: { activation_token: "${tok_val}" }
              as: CardholderOps
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/cards/${card_id}/authorizations"
              payload: { amount_cents: 10000, mcc: "5411", country_code: "US" }
              as: CardholderOps
              captures: { auth_id: $.data.id, auth_decision: $.data.decision }
          trigger:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T03:46:40Z" }   # auth + 100000 seconds (>86400, <=172800) → MID_QUALIFIED
              as: PlatformAdmin
            - call: "POST /issuing/authorization-events/${auth_id}/settle"
              payload: { settled_amount_cents: 10000 }
              as: FinanceController
              captures: { settle_interchange: $.data.interchange_cents, settle_tier: $.data.qualification_tier }
          assert:
            - "AuthorizationEvent.${auth_id}.decision == APPROVED"
            - "Settlement.qualification_tier == MID_QUALIFIED   # 100000s elapsed, chip-capable card"
            - "Settlement.interchange_cents == 195              # final: floor(10000*185/10000)+10"
            - "provisional-at-auth would have been floor(10000*145/10000)+10 == 155; final differs from provisional by 40 cents"

      - name: program_economics_provisional_vs_final_on_program_domain
        grounds:
          - calculations.program_monthly_economics
        distinguishing_aspect: |
          Program-domain calculation (different entity domain from Settlement): the
          provisional_month_to_date variant includes a forward-looking accrual of
          requested_card_count * unit_cost_cents for batches in SUBMITTED/IN_PRODUCTION,
          while final_month_close excludes in-flight batches and uses fulfilled_card_count
          only. For the pinned fixture: a batch of requested=1000, unit_cost=200, currently
          IN_PRODUCTION (fulfilled=0). PROVISIONAL yields production_cost_cents = 1000*200 =
          200000; FINAL yields production_cost_cents = 0. Different cents for identical program
          state.
        test_recipe:
          setup:
            - "CardProgram prog2 (MASTERCARD, CONSUMER_PREPAID, USD) is LIVE"
            - "ProductionVendor vend (MASTERCARD-capable, capacity=5000) is_active=true"
            - "ProductionBatch batch (requested=1000, unit_cost=200, scheduled_for=2026-08-15) is IN_PRODUCTION"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-MC-2", product_class: "CONSUMER_PREPAID", network: "MASTERCARD", currency_code: "USD", daily_spend_cap_cents: 5000000 }
              as: ProgramManager
              captures: { prog2_id: $.data.id }
            - call: "POST /issuing/programs/${prog2_id}/bin-ranges"
              payload: { bin_prefix: "511111", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog2_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/vendors"
              payload: { vendor_code: "VEND-A", capability_flags: ["EMV_CHIP"], daily_capacity_cards: 5000, supported_networks: ["MASTERCARD"], is_active: true }
              as: PlatformAdmin
              captures: { vend_id: $.data.id }
            - call: "POST /issuing/programs/${prog2_id}/production-batches"
              payload: { vendor_id: "${vend_id}", scheduled_for_utc_date: "2026-08-15", requested_card_count: 1000, unit_cost_cents: 200 }
              as: OperationsAnalyst
              captures: { batch_id: $.data.id }
            - call: "POST /issuing/production-batches/${batch_id}/submit"
              payload: {}
              as: OperationsAnalyst
            - call: "POST /issuing/production-batches/${batch_id}/start"
              payload: {}
              as: OperationsAnalyst
          trigger:
            - call: "GET /issuing/programs/${prog2_id}/economics"
              payload: { month: "2026-08", variant: "PROVISIONAL" }
              as: FinanceController
              captures: { prov_cost: $.data.production_cost_cents }
            - call: "GET /issuing/programs/${prog2_id}/economics"
              payload: { month: "2026-08", variant: "FINAL" }
              as: FinanceController
              captures: { final_cost: $.data.production_cost_cents }
          assert:
            - "PROVISIONAL economics.production_cost_cents == 200000   # 1000 * 200 forward-looking accrual"
            - "FINAL economics.production_cost_cents == 0               # batch not yet SHIPPED"
            - "PROVISIONAL != FINAL for identical input month 2026-08"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: qualification_tier_three_input_nonlinear
        grounds:
          - calculations.qualification_tier_rules
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction. Inputs: mcc,
          auth_to_settle_seconds, has_emv_chip_enabled, network. The tier output depends on
          nested conditional branches (BLOCKED_MCC > 48h > no-chip > <=24h+chip > fallback),
          not on any single threshold.
          Fixture pin: VISA network, mcc="7995" (blocked list), elapsed=100s, chip=true →
          NON_QUALIFIED (mcc clause fires first, regardless of timing or chip).
          Independent fixture: VISA, mcc="5411", elapsed=200000s (>172800), chip=true →
          NON_QUALIFIED (elapsed clause).
          Independent fixture: VISA, mcc="5411", elapsed=100000s, chip=true → MID_QUALIFIED.
        test_recipe:
          setup:
            - "CardProgram prog3 (VISA, DEBIT_CONSUMER, USD) LIVE"
            - "BinRange ACTIVE"
            - "CardAccount OPEN with available_balance_cents = 1000000"
            - "Card ACTIVE with pin_status=SET, PHYSICAL (EMV-capable)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-3", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 10000000 }
              as: ProgramManager
              captures: { prog3_id: $.data.id }
            - call: "POST /issuing/programs/${prog3_id}/bin-ranges"
              payload: { bin_prefix: "422222", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog3_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog3_id}", external_account_ref: "A-3", account_class: "INDIVIDUAL", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { acct3_id: $.data.id }
            - call: "POST /issuing/accounts/${acct3_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct3_id}/fund"
              payload: { amount_cents: 1000000 }
              as: FinanceController
            - call: "POST /issuing/accounts/${acct3_id}/cards"
              payload: { expiry_month: 12, expiry_year: 2030, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card3_id: $.data.id }
            - call: "POST /issuing/cards/${card3_id}/pin"
              payload: { new_pin: "9999" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card3_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok3: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card3_id}/activate"
              payload: { activation_token: "${tok3}" }
              as: CardholderOps
            - call: "POST /issuing/cards/${card3_id}/authorizations"
              payload: { amount_cents: 10000, mcc: "7995", country_code: "US" }
              as: CardholderOps
              captures: { auth3a_id: $.data.id }
          trigger:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:40Z" }   # +100 seconds
              as: PlatformAdmin
            - call: "POST /issuing/authorization-events/${auth3a_id}/settle"
              payload: { settled_amount_cents: 10000 }
              as: FinanceController
              captures: { settle3a_tier: $.data.qualification_tier }
          assert:
            - "Settlement.qualification_tier == NON_QUALIFIED   # blocked mcc overrides everything"

      - name: reissue_fee_nested_rounding_total_level
        grounds:
          - calculations.reissue_campaign_fee
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. blanket EXPIRY_SWEEP with
          blanket_unit_fee_cents=333 and 3 successor cards produces gross=999; 4% discount is
          applied to the TOTAL (floor(999*4/100) = 39), yielding net=960. The wrong order —
          rounding per card, then summing — would yield floor(333*0.96)=319; 319*3=957.
          Scaffold pins total-level rounding (960), and the test asserts the literal 960.
        test_recipe:
          setup:
            - "CardProgram prog4 (VISA, DEBIT_CONSUMER, USD) LIVE"
            - "BinRange with >= 6 available PANs ACTIVE"
            - "Three CardAccounts OPEN, each with one ACTIVE Card expiring 10/2026"
            - "ReissueCampaign campaign (kind=EXPIRY_SWEEP, blanket_unit_fee_cents=333, selection_filter={expiry_before: 2026-11-01}, scheduled_for=2026-08-05T00:00:00Z)"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-4", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 10000000 }
              as: ProgramManager
              captures: { prog4_id: $.data.id }
            - call: "POST /issuing/programs/${prog4_id}/bin-ranges"
              payload: { bin_prefix: "433333", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog4_id}/publish"
              payload: {}
              as: ProgramManager
            # Account 1
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog4_id}", external_account_ref: "A-4-1", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct41_id: $.data.id }
            - call: "POST /issuing/accounts/${acct41_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct41_id}/cards"
              payload: { expiry_month: 10, expiry_year: 2026, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card41_id: $.data.id }
            - call: "POST /issuing/cards/${card41_id}/pin"
              payload: { new_pin: "1111" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card41_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok41: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card41_id}/activate"
              payload: { activation_token: "${tok41}" }
              as: CardholderOps
            # Account 2
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog4_id}", external_account_ref: "A-4-2", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct42_id: $.data.id }
            - call: "POST /issuing/accounts/${acct42_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct42_id}/cards"
              payload: { expiry_month: 10, expiry_year: 2026, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card42_id: $.data.id }
            - call: "POST /issuing/cards/${card42_id}/pin"
              payload: { new_pin: "2222" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card42_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok42: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card42_id}/activate"
              payload: { activation_token: "${tok42}" }
              as: CardholderOps
            # Account 3
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog4_id}", external_account_ref: "A-4-3", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct43_id: $.data.id }
            - call: "POST /issuing/accounts/${acct43_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts/${acct43_id}/cards"
              payload: { expiry_month: 10, expiry_year: 2026, form_factor: "PHYSICAL" }
              as: ProgramManager
              captures: { card43_id: $.data.id }
            - call: "POST /issuing/cards/${card43_id}/pin"
              payload: { new_pin: "3333" }
              as: CardholderOps
            - call: "GET /issuing/cards/${card43_id}/activation-tokens"
              payload: {}
              as: CardholderOps
              captures: { tok43: "$.data[0].token_value" }
            - call: "POST /issuing/cards/${card43_id}/activate"
              payload: { activation_token: "${tok43}" }
              as: CardholderOps
            # Campaign
            - call: "POST /issuing/programs/${prog4_id}/reissue-campaigns"
              payload:
                campaign_kind: "EXPIRY_SWEEP"
                scheduled_for: "2026-08-05T00:00:00Z"
                selection_filter: { expiry_before: "2026-11-01" }
                blanket_unit_fee_cents: 333
              as: OperationsAnalyst
              captures: { camp4_id: $.data.id }
            - call: "POST /issuing/reissue-campaigns/${camp4_id}/schedule"
              payload: {}
              as: OperationsAnalyst
          trigger:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /issuing/reissue-campaigns/${camp4_id}"
              payload: {}
              as: OperationsAnalyst
              captures: { camp4_status: $.data.status }
            - call: "GET /issuing/programs/${prog4_id}/economics"
              payload: { month: "2026-08", variant: "FINAL" }
              as: FinanceController
              captures: { prog4_reissue_fee: $.data.reissue_fee_cents }
          assert:
            - "ReissueCampaign.${camp4_id}.status == COMPLETED"
            - "Number of successor cards minted == 3 (observed via GET /issuing/reissue-campaigns/{id}/cards list length)"
            - "economics.reissue_fee_cents == 960   # floor(999*4/100)=39; 999-39=960 (NOT 957)"

  # ============================================================
  # Rule 3 — Non-linear state machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: mandate_ack_cyclic_return_loop
        grounds:
          - state_machines.MandateAck.RETURNED_to_SUBMITTED
          - state_machines.MandateAck.SUBMITTED_to_RETURNED
          - state_machines.MandateAck.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          MandateAck exhibits a cycle: DRAFT→SUBMITTED→RETURNED→SUBMITTED→VERIFIED. The
          RETURNED→SUBMITTED transition increments revision_count by exactly 1, and each
          RETURN clears program.authorization_rules_locked while each SUBMIT re-locks it.
          The cycle allows iterative negotiation; linear pipelines do not.
        test_recipe:
          setup:
            - "CardProgram prog5 (VISA, DEBIT_CONSUMER) is LIVE"
            - "Mandate mand (VISA, severity=REQUIRED, effective_at=2026-09-01, compliance_deadline=2026-12-01)"
            - "MandateAck ack for prog5 + mand in DRAFT"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-5", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog5_id: $.data.id }
            - call: "POST /issuing/programs/${prog5_id}/bin-ranges"
              payload: { bin_prefix: "444444", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog5_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/mandates"
              payload: { network: "VISA", mandate_code: "VI-2026-Q3-001", title: "Tokenization mandate", effective_at: "2026-09-01T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", severity: "REQUIRED" }
              as: ComplianceOfficer
              captures: { mand_id: $.data.id }
            - call: "POST /issuing/mandates/${mand_id}/acks"
              payload: { program_id: "${prog5_id}", implementation_notes: "v1 notes" }
              as: ComplianceOfficer
              captures: { ack_id: $.data.id }
          trigger:
            - call: "POST /issuing/mandates/${mand_id}/acks/${ack_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-1"
            - call: "POST /issuing/mandates/${mand_id}/acks/${ack_id}/return"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-2"
            - call: "POST /issuing/mandates/${mand_id}/acks/${ack_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-3"
            - call: "POST /issuing/mandates/${mand_id}/acks/${ack_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-cto-4"
            - call: "GET /issuing/mandates/${mand_id}/acks/${ack_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { final_status: $.data.status, final_rev: $.data.revision_count }
          assert:
            - "MandateAck.${ack_id}.status == VERIFIED"
            - "MandateAck.${ack_id}.revision_count == 1   # exactly one RETURN→SUBMIT cycle"
            - "MandateAck.${ack_id}.verified_by_user_id == 'user-cto-4'"
            - "CardProgram.${prog5_id}.authorization_rules_locked == false"

      - name: card_parallel_dimensions_lifecycle_x_pin
        grounds:
          - state_machines.Card.parallel_dimensions
          - state_machines.Card.ISSUED_to_ACTIVE
          - state_machines.Card.UNSET_to_SET
        distinguishing_aspect: |
          Card has two parallel state dimensions evolving independently: lifecycle_status
          (ISSUED|ACTIVE|SUSPENDED|...) and pin_status (UNSET|SET|BLOCKED|RESET_PENDING).
          A card can be ISSUED with pin_status=SET (cannot activate yet because PIN ok but
          account must be OPEN); then account activate lets card activate (ISSUED→ACTIVE)
          WITHOUT changing pin_status; then pin can be BLOCKED (lifecycle stays ACTIVE);
          then pin RESET_PENDING→SET (lifecycle stays ACTIVE). Two dimensions evolve
          orthogonally on the same entity.
        test_recipe:
          setup:
            - "CardProgram prog6 (VISA, DEBIT_CONSUMER) LIVE"
            - "CardAccount acct6 OPEN"
            - "Card card6 PHYSICAL ISSUED, pin UNSET"
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-VISA-6", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { prog6_id: $.data.id }
            - call: "POST /issuing/programs/${prog6_id}/bin-ranges"
              payload: { bin_prefix: "455555", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-12-31T23:59:59Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${prog6_id}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/accounts"
              payload: { program_id: "${prog6_id}", external_account_ref: "A-6", account_class: "INDIVIDUAL", daily_spend_cap_cents: 100000 }
              as: ProgramManager
              captures: { acct6_id: $.data.id }
            - call: "POST /issuing/accounts/${acct6_id}/activate"
              payload: {}
