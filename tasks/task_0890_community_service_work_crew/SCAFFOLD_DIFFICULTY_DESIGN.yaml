          trigger:
            - { call: "POST /work-sessions", payload: { placement_id: "${plc2_id}", scheduled_start: "2026-06-05T10:00:00Z", scheduled_end: "2026-06-05T12:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
