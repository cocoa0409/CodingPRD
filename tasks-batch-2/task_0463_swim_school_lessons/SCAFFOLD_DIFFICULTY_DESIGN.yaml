# =============================================================================
# Swim School & Lesson Program — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 rule_ids x >=2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: billing domain (Invoice) ---
      - name: tuition_forward_vs_chronological_diverge_on_invoice
        grounds:
          - calculations.monthly_tuition_charge
          - entities.Invoice.fields.variant
          - entities.Invoice.fields.total_cents
          - entities.Enrollment.fields.tuition_basis_cents
        distinguishing_aspect: "On the Invoice billing domain, the same single ACTIVE Level-1 enrollment (basis 12000, 4 Tue occurrences in Jan) yields total_cents=12000 under FORWARD_LOOKING but 3000 under CHRONOLOGICAL with the clock at 2026-01-10 (1 of 4 delivered)."
        test_recipe:
          setup:
            - "Clock at 2026-01-10. Level 1 (basis 12000, ratio 4, age 36-72mo). One ACTIVE enrollment of a Level-1 student in a Tuesday session opened before billing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { parent_id: "${parent_id}", cycle_start: "2026-01-01T00:00:00Z", cycle_end: "2026-02-01T00:00:00Z", due_at: "2026-02-15T00:00:00Z", variant: "FORWARD_LOOKING" }
              as: BillingAdmin
              captures: { inv_fwd_id: $.data.id }
            - call: "POST /invoices"
              payload: { parent_id: "${parent_id}", cycle_start: "2026-01-01T00:00:00Z", cycle_end: "2026-02-01T00:00:00Z", due_at: "2026-02-15T00:00:00Z", variant: "CHRONOLOGICAL" }
              as: BillingAdmin
              captures: { inv_chr_id: $.data.id }
          assert:
            - "Invoice.${inv_fwd_id}.total_cents == 12000"
            - "Invoice.${inv_chr_id}.total_cents == 3000"
            - "Invoice.${inv_fwd_id}.total_cents != Invoice.${inv_chr_id}.total_cents"

      # --- Instance 2: progress domain (Assessment/Student) ---
      - name: readiness_strict_vs_holistic_diverge_on_assessment
        grounds:
          - calculations.level_up_readiness
          - entities.Assessment.fields.strict_ready
          - entities.Assessment.fields.holistic_ready
          - entities.Assessment.fields.weighted_score
        distinguishing_aspect: "On the Assessment progress domain, identical skill_scores (0.90, 0.70 with equal weights) make weighted_score=0.8 -> holistic_ready=true (>=0.80) while strict_ready=false (only 1 of 2 skills >= MASTERY 0.80); same inputs, two algorithms diverge."
        test_recipe:
          setup:
            - "Level 1 with two skills (weight 1.0 each), one ACTIVE enrollment of Coach A's student; assessment submitted with scores 0.90 and 0.70."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4, monthly_tuition_cents: 12000, readiness_threshold: 0.80 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /levels/${lvl1_id}/skills"
              payload: { name: "Back Float 10s", weight: 1.0 }
              as: SchoolAdmin
              captures: { sk1_id: $.data.id }
            - call: "POST /levels/${lvl1_id}/skills"
              payload: { name: "Front Glide", weight: 1.0 }
              as: SchoolAdmin
              captures: { sk2_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /assessments"
              payload: { enrollment_id: "${enr_id}", skill_scores: [ { skill_id: "${sk1_id}", score: 0.90 }, { skill_id: "${sk2_id}", score: 0.70 } ] }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /assessments/${asmt_id}/submit"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          assert:
            - "Assessment.${asmt_id}.weighted_score == 0.8"
            - "Assessment.${asmt_id}.holistic_ready == true"
            - "Assessment.${asmt_id}.strict_ready == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1: mode (a) tiered + argmax exclusion + per-line branch ---
      - name: sibling_discount_tiered_argmax_exclusion
        grounds:
          - calculations.sibling_discount
          - entities.Invoice.fields.line_items
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.discount_cents
        distinguishing_aspect: "Mode (a): with 2 distinct students both at basis 12000, n=2 selects DISCOUNT_2_PCT=0.10; the highest-line student (tie broken by earliest Student.created_at) is full-priced 12000, the other discounted to 10800 -> total 22800, discount 1200; a >=3-input non-linear (count, per-line amount, argmax) formula."
        test_recipe:
          setup:
            - "One parent, two Level-1 students (basis 12000 each), each ACTIVE in its own full-month Tuesday session. Full-cycle FORWARD invoice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sessA_id: $.data.id }
            - call: "POST /class-sessions/${sessA_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sessA_v: $.data.version }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 2, day_of_week: 1, start_minute: 700, end_minute: 745 }
              as: SchoolAdmin
              captures: { sessB_id: $.data.id }
            - call: "POST /class-sessions/${sessB_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sessB_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu1_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid Two", birthdate: "2021-02-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu1_id}", class_session_id: "${sessA_id}", expected_class_session_version: "${sessA_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu2_id}", class_session_id: "${sessB_id}", expected_class_session_version: "${sessB_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { parent_id: "${parent_id}", cycle_start: "2026-01-01T00:00:00Z", cycle_end: "2026-02-01T00:00:00Z", due_at: "2026-02-15T00:00:00Z", variant: "FORWARD_LOOKING" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 24000"
            - "Invoice.${inv_id}.discount_cents == 1200"
            - "Invoice.${inv_id}.total_cents == 22800"

      # --- Instance 2: mode (b) rounding order pinned ---
      - name: proration_round_per_line_then_sum
        grounds:
          - calculations.proration_rounding_order
          - calculations.monthly_tuition_charge
          - calculations.sibling_discount
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: "Mode (b): two Tots students (basis 10000) each joined mid-cycle with remaining 1 of 3 occurrences -> each prorated_cents=ROUND_HALF_UP(10000/3)=3333; round-per-line-then-sum gives subtotal 6666, NOT sum-then-round 6667 (raw 6666.67). Rounding ORDER is the pin."
        test_recipe:
          setup:
            - "Clock at 2026-01-14. Tots level (basis 10000, ratio 3). Two students, each ACTIVE-joined 2026-01-14 in its own Tuesday session; cycle Jan1-Jan22 has 3 occurrences (6,13,20), remaining from Jan14 = 1 (Jan20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-14T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Tots", sequence_order: 1, min_age_months: 6, max_age_months: 36, max_students_per_instructor: 3, monthly_tuition_cents: 10000 }
              as: SchoolAdmin
              captures: { tots_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach T", certified_level_ids: ["${tots_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${tots_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 540, end_minute: 570 }
              as: SchoolAdmin
              captures: { sessA_id: $.data.id }
            - call: "POST /class-sessions/${sessA_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sessA_v: $.data.version }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${tots_id}", instructor_id: "${inst_id}", lane_number: 2, day_of_week: 1, start_minute: 600, end_minute: 630 }
              as: SchoolAdmin
              captures: { sessB_id: $.data.id }
            - call: "POST /class-sessions/${sessB_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sessB_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Tot One", birthdate: "2024-06-01T00:00:00Z", current_level_id: "${tots_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu1_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Tot Two", birthdate: "2024-06-15T00:00:00Z", current_level_id: "${tots_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu1_id}", class_session_id: "${sessA_id}", expected_class_session_version: "${sessA_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu2_id}", class_session_id: "${sessB_id}", expected_class_session_version: "${sessB_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { parent_id: "${parent_id}", cycle_start: "2026-01-01T00:00:00Z", cycle_end: "2026-01-22T00:00:00Z", due_at: "2026-02-15T00:00:00Z", variant: "FORWARD_LOOKING" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 6666"
            - "Invoice.${inv_id}.total_cents == 6333"
            - "Invoice.${inv_id}.discount_cents == 333"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Instance 1: Enrollment cyclic ACTIVE<->PAUSED ---
      - name: enrollment_active_pause_resume_cycle
        grounds:
          - state_machines.Enrollment.ACTIVE_to_PAUSED
          - state_machines.Enrollment.PAUSED_to_ACTIVE
          - entities.Enrollment.fields.status
        distinguishing_aspect: "Enrollment is cyclic: ACTIVE->PAUSED (pause) then PAUSED->ACTIVE (resume) returns to ACTIVE on the same row, a non-linear loop distinct from a forward-only pipeline."
        test_recipe:
          setup:
            - "Clock at 2026-01-05. One ACTIVE Level-1 enrollment with a free seat."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/pause"
              payload: {}
              as: Parent
              as_user_id: "${parent_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/resume"
              payload: {}
              as: Parent
              as_user_id: "${parent_id}"
          assert:
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "ClassSession.${sess_id}.enrolled_count == 1"

      # --- Instance 2: Assessment branching SUBMITTED -> {APPROVED, REJECTED} ---
      - name: assessment_branch_reject_diverges_from_approve
        grounds:
          - state_machines.Assessment.SUBMITTED_to_REJECTED
          - state_machines.Assessment.SUBMITTED_to_APPROVED
          - entities.Assessment.fields.status
          - entities.Student.fields.current_level_id
        distinguishing_aspect: "Assessment forks from SUBMITTED: REJECT leaves Student.current_level_id unchanged (no enrollment mutation), whereas APPROVE advances it — divergent side-effect sets on the same fork, a branching (non-linear) machine."
        test_recipe:
          setup:
            - "A SUBMITTED assessment with strict_ready=true (all skills mastered) on a Level-1 enrollment; Level 1 has next_level_id=Level 2. We REJECT it here."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /locations"
              payload: { name: "Main Pool" }
              as: SchoolAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 2", sequence_order: 2, min_age_months: 36, max_age_months: 120, max_students_per_instructor: 6, monthly_tuition_cents: 13000 }
              as: SchoolAdmin
              captures: { lvl2_id: $.data.id }
            - call: "POST /levels"
              payload: { name: "Level 1", sequence_order: 1, next_level_id: "${lvl2_id}", min_age_months: 36, max_age_months: 72, max_students_per_instructor: 4, monthly_tuition_cents: 12000 }
              as: SchoolAdmin
              captures: { lvl1_id: $.data.id }
            - call: "POST /levels/${lvl1_id}/skills"
              payload: { name: "Back Float 10s", weight: 1.0 }
              as: SchoolAdmin
              captures: { sk1_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Coach A", certified_level_ids: ["${lvl1_id}"] }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { location_id: "${loc_id}", level_id: "${lvl1_id}", instructor_id: "${inst_id}", lane_number: 1, day_of_week: 1, start_minute: 600, end_minute: 645 }
              as: SchoolAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /class-sessions/${sess_id}/open"
              payload: {}
              as: SchoolAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /parents"
              payload: { full_name: "Pat Parent", email: "pat@x.com" }
              as: SchoolAdmin
              captures: { parent_id: $.data.id }
            - call: "POST /parents/${parent_id}/students"
              payload: { full_name: "Kid One", birthdate: "2021-01-01T00:00:00Z", current_level_id: "${lvl1_id}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${sess_id}", expected_class_session_version: "${sess_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /assessments"
              payload: { enrollment_id: "${enr_id}", skill_scores: [ { skill_id: "${sk1_id}", score: 1.0 } ] }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /assessments/${asmt_id}/reject"
              payload: {}
              as: SchoolAdmin
          assert:
            - "Assessment.${asmt_id}.status == REJECTED"
            - "Student.${stu_id}.current_level_id == ${lvl1_id}"
            - "Enrollment.${enr_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Instance 1: depth-3 cascade from student withdrawal ---
      - name: student_withdraw_promotes_waitlist_debits_promoted_parent
        grounds:
          - state_machines.Student.ACTIVE_to_WITHDRAWN
          - state_machines.Enrollment.WAITLISTED_to_ACTIVE
          - entities.ClassSession.fields.enrolled_count
          - entities.Enrollment.fields.status
        distinguishing_aspect: "Trigger=student withdraw. L1: that student's ACTIVE enrollment -> WITHDRAWN; L2 (caused by L1): the session's enrolled_count frees a seat; L3 (caused by the freed seat): the earliest WAITLISTED enrollment (a DIFFERENT parent's) is promoted ACTIVE. Three caused-by-previous hops."
