    instances:
      - name: mechanic_cannot_create_slot
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Mechanic is outside the Scheduler domain: POST /railroad/slots as Mechanic fails with ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["ACTIVE agreement"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Mechanic, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_FORBIDDEN with HTTP 403"
      - name: station_agent_cannot_publish_excursion
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "PUBLISH is a Scheduler operation: StationAgent is denied with ERR_FORBIDDEN even with a correct OCC version."
        test_recipe:
          setup: ["DRAFT excursion"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "RBAC Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
