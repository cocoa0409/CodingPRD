scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: release_statutory_vs_earned_release_date
        grounds:
          - calculations.good_time_credit
          - entities.Booking.fields.statutory_release_date
          - entities.Booking.fields.projected_release_date
        distinguishing_aspect: |
          For one MIN booking with sentence_days=100, the STATUTORY variant
          (rate 0.10 -> 10 credit) yields statutory_release_date 2026-07-30
          while the EARNED variant (MIN accrual 0.25 capped at 0.20 -> 20
          credit) yields projected_release_date 2026-07-20 — different dates
          from identical inputs, on the Booking domain.
        test_recipe:
          setup:
            - "Inmate (MALE); Booking charge MISDEMEANOR, prior_bookings_count 0, sentence_days 100, sentence_start_date 2026-05-01; INITIAL classification -> classification_level MIN."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ann Doe", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
          trigger:
            - call: "GET /bookings/${bk}/release-projection"
              as: Supervisor
          assert:
            - "Booking.${bk}.classification_level == \"MIN\""
            - "release-projection.statutory_good_time_days == 10"
            - "release-projection.earned_good_time_days == 20"
            - "release-projection.statutory_release_date == \"2026-07-30\""
            - "release-projection.projected_release_date == \"2026-07-20\""
            - "statutory_release_date != projected_release_date"

      - name: classification_initial_vs_reassessment_level
        grounds:
          - calculations.classification_score
          - entities.ClassificationAssessment.fields.total_score
          - entities.ClassificationAssessment.fields.resulting_level
        distinguishing_aspect: |
          Same booking (MISDEMEANOR sev 10, prior 2 -> history 12): INITIAL
          scores 22 -> MIN; after 1 UPHELD infraction, REASSESSMENT adds
          behavior 15 -> score 37 -> MED. Divergent result on the
          ClassificationAssessment domain (distinct from the release-date calc).
        test_recipe:
          setup:
            - "Inmate; Booking MISDEMEANOR, prior_bookings_count 2, sentence 100; INITIAL classification -> MIN (22); one infraction reported by intake user then UPHELD by supervisor user (booking version now 3)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ben Roe", date_of_birth: "1988-02-02", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 2, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
              captures: { init_score: "$.data.total_score", init_level: "$.data.resulting_level" }
            - call: "POST /bookings/${bk}/infractions"
              payload: { infraction_type: "CONTRABAND", good_time_forfeit_days: 3 }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { inf: "$.data.id" }
            - call: "POST /infractions/${inf}/uphold"
              as: Supervisor
              as_user_id: "supervisor-1"
            - call: "GET /bookings/${bk}"
              as: Supervisor
              captures: { bkv3: "$.data.version" }
          trigger:
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "REASSESSMENT", expected_booking_version: "${bkv3}" }
              as: ClassificationOfficer
              captures: { re_score: "$.data.total_score", re_level: "$.data.resulting_level" }
          assert:
            - "init_score == 22"
            - "init_level == \"MIN\""
            - "re_score == 37"
            - "re_level == \"MED\""
            - "init_level != re_level"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: earned_good_time_min_max_rate_mode_a
        grounds:
          - calculations.good_time_credit
          - entities.Booking.fields.earned_good_time_days
          - entities.Booking.fields.total_forfeited_days
        distinguishing_aspect: |
          Mode (a): earned = max(0, min(cap, floor(sentence*accrual_rate) -
          forfeit)) has 3+ inputs and nonlinear min/max. MIN booking sentence
          100 (accrued 25, cap 20) with a single UPHELD forfeit of 30 gives
          max(0, min(20, 25-30)) = 0 — the max(0,...) floor engages.
        test_recipe:
          setup:
            - "Inmate; Booking MISDEMEANOR prior 0 sentence 100 -> MIN via INITIAL classification; infraction with good_time_forfeit_days 30 reported by intake user then UPHELD by supervisor."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Cy Lo", date_of_birth: "1991-03-03", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /bookings/${bk}/infractions"
              payload: { infraction_type: "ASSAULT", good_time_forfeit_days: 30 }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { inf: "$.data.id" }
          trigger:
            - call: "POST /infractions/${inf}/uphold"
              as: Supervisor
              as_user_id: "supervisor-1"
          assert:
            - "Booking.${bk}.total_forfeited_days == 30"
            - "Booking.${bk}.earned_good_time_days == 0"
            - "Booking.${bk}.projected_release_date == \"2026-08-09\""

      - name: commissary_order_round_per_line_then_sum_mode_b
        grounds:
          - calculations.commissary_order_total
          - entities.CommissaryOrder.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b): three taxable lines qty1 @105c with TAX 0.0725. Round
          per line: round(112.6125)=113 x3 = 339, +25 fee = 364. Sum-then-round
          would give round(315*1.0725)=338, +25 = 363. The scaffold pins
          per-line-then-sum, so 364 is correct and differs by 1 cent.
        test_recipe:
          setup:
            - "Inmate; Booking; auto CommissaryAccount; deposit 1000c (account version -> 2)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Di Fa", date_of_birth: "1992-04-04", sex: "FEMALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "INFRACTION", prior_bookings_count: 0, sentence_days: 30, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 1000 }
              as: IntakeOfficer
              captures: { acctv: "$.data.version" }
          trigger:
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "soap", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "pen", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "gum", quantity: 1, unit_price_cents: 105, taxable: true } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { ord: "$.data.id", ord_total: "$.data.order_total_cents" }
          assert:
            - "CommissaryOrder.${ord}.order_total_cents == 364"
            - "ord_total == 364 (per-line-then-sum), NOT 363 (sum-then-round)"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: court_event_continuance_cycle
        grounds:
          - state_machines.CourtEvent.SCHEDULED_to_CONTINUED
          - state_machines.CourtEvent.CONTINUED_to_SCHEDULED
          - entities.CourtEvent.fields.continuance_count
        distinguishing_aspect: |
          CourtEvent cycles SCHEDULED -> CONTINUED -> SCHEDULED on each
          continue; two continues leave status SCHEDULED with continuance_count
          2 and the latest event_datetime — a back-edge, not a linear pipeline.
        test_recipe:
          setup:
            - "Inmate; Booking; a SCHEDULED CourtEvent."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ed Ka", date_of_birth: "1985-05-05", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 0, sentence_days: 200, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /bookings/${bk}/court-events"
              payload: { event_datetime: "2026-06-01T09:00:00Z", event_type: "ARRAIGNMENT", transport_required: true }
              as: Scheduler
              captures: { ce: "$.data.id" }
          trigger:
            - call: "POST /court-events/${ce}/continue"
              payload: { new_event_datetime: "2026-06-15T09:00:00Z" }
              as: Scheduler
            - call: "POST /court-events/${ce}/continue"
              payload: { new_event_datetime: "2026-07-01T09:00:00Z" }
              as: Scheduler
          assert:
            - "CourtEvent.${ce}.court_event_status == \"SCHEDULED\""
            - "CourtEvent.${ce}.continuance_count == 2"
            - "CourtEvent.${ce}.event_datetime == \"2026-07-01T09:00:00Z\""

      - name: request_deny_appeal_cycle
        grounds:
          - state_machines.Request.UNDER_REVIEW_to_DENIED
          - state_machines.Request.DENIED_to_UNDER_REVIEW
          - entities.Request.fields.appeal_count
        distinguishing_aspect: |
          Request loops UNDER_REVIEW -> DENIED -> UNDER_REVIEW via appeal;
          after review+deny+appeal the status is UNDER_REVIEW with appeal_count
          1 — a cyclic back-edge on a different entity than CourtEvent.
        test_recipe:
          setup:
            - "Inmate; Booking; a Request reviewed then denied."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Fi La", date_of_birth: "1993-06-06", sex: "FEMALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /bookings/${bk}/requests"
              payload: { request_type: "GRIEVANCE", description: "cell temperature complaint" }
              as: HealthGrievanceOfficer
              captures: { rq: "$.data.id" }
            - call: "POST /requests/${rq}/review"
              as: HealthGrievanceOfficer
            - call: "POST /requests/${rq}/deny"
              as: HealthGrievanceOfficer
          trigger:
            - call: "POST /requests/${rq}/appeal"
              as: HealthGrievanceOfficer
          assert:
            - "Request.${rq}.request_status == \"UNDER_REVIEW\""
            - "Request.${rq}.appeal_count == 1"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: release_cascade_assignment_bed_unit
        grounds:
          - state_machines.Booking.HOUSED_to_RELEASED
          - state_machines.HousingAssignment.ACTIVE_to_ENDED
          - state_machines.Bed.OCCUPIED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-3 chain: release -> HousingAssignment ACTIVE->ENDED -> its Bed
          OCCUPIED->AVAILABLE -> the freed bed decrements unit occupancy. Each
          hop is caused by the previous, not directly by the release call.
        test_recipe:
          setup:
            - "Inmate MALE; Booking MIN (INITIAL); HousingUnit MIN/MALE cap 4; one Bed; an ACTIVE HousingAssignment placing the booking on the bed (booking HOUSED, bed OCCUPIED)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Gu Ma", date_of_birth: "1987-07-07", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /housing-units"
              payload: { name: "Pod-A", security_level: "MIN", gender: "MALE", capacity: 4 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "A1" }
              as: ClassificationOfficer
              captures: { bed: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk}", bed_id: "${bed}", start_datetime: "2026-05-02T10:00:00Z" }
              as: ClassificationOfficer
              captures: { ha: "$.data.id" }
          trigger:
            - call: "POST /bookings/${bk}/release"
              payload: { release_reason: "COURT_ORDER" }
              as: Supervisor
          assert:
            - "HousingAssignment.${ha}.assignment_status == \"ENDED\""
            - "Bed.${bed}.status == \"AVAILABLE\""
            - "Booking.${bk}.booking_status == \"RELEASED\""
            - "Inmate.${inm}.status == \"RELEASED\""

      - name: uphold_forfeit_recompute_release
        grounds:
          - state_machines.DisciplinaryInfraction.REPORTED_to_UPHELD
          - entities.Booking.fields.total_forfeited_days
          - entities.Booking.fields.projected_release_date
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: uphold -> Booking
          total_forfeited_days += 6 -> that mutation recomputes
          earned_good_time_days (20 -> 19) and projected_release_date
          (2026-07-20 -> 2026-07-21).
        test_recipe:
          setup:
            - "Inmate; Booking MIN sentence 100 (INITIAL) with projected_release_date 2026-07-20; infraction forfeit 6 reported by intake user."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ha No", date_of_birth: "1990-08-08", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /bookings/${bk}/infractions"
              payload: { infraction_type: "DISOBEDIENCE", good_time_forfeit_days: 6 }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { inf: "$.data.id" }
          trigger:
            - call: "POST /infractions/${inf}/uphold"
              as: Supervisor
              as_user_id: "supervisor-1"
          assert:
            - "Booking.${bk}.total_forfeited_days == 6"
            - "Booking.${bk}.earned_good_time_days == 19"
            - "Booking.${bk}.projected_release_date == \"2026-07-21\""

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_released_booking_beats_insufficient_funds
        grounds:
          - validations[priority=30]
          - validations[priority=70]
          - errors[ERR_BOOKING_RELEASED]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          state (ERR_BOOKING_RELEASED, prio 30) outranks business_fiscal
          (ERR_INSUFFICIENT_FUNDS, prio 70): an order on a RELEASED booking's
          account with balance 0 < total returns ERR_BOOKING_RELEASED, not the
          funds error.
        test_recipe:
          setup:
            - "Inmate; Booking with auto CommissaryAccount (balance 0, version 1); booking RELEASED via COURT_ORDER."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ib Pa", date_of_birth: "1994-09-09", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id", acctv: "$.data[0].version" }
            - call: "POST /bookings/${bk}/release"
              payload: { release_reason: "COURT_ORDER" }
              as: Supervisor
          trigger:
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "chips", quantity: 1, unit_price_cents: 500, taxable: false } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_BOOKING_RELEASED\""
            - "err != \"ERR_INSUFFICIENT_FUNDS\" (state outranks fiscal)"

      - name: housing_security_beats_double_booked
        grounds:
          - validations[priority=50]
          - validations[priority=60]
          - errors[ERR_SECURITY_LEVEL_MISMATCH]
          - errors[ERR_BED_DOUBLE_BOOKED]
        distinguishing_aspect: |
          business_safety (ERR_SECURITY_LEVEL_MISMATCH, prio 50) outranks
          business_constraint (ERR_BED_DOUBLE_BOOKED, prio 60): a MIN booking
          assigned to a MED-unit bed already occupied by an overlapping
          interval returns the security error, not the overlap error.
          Different category pair than instance 1.
        test_recipe:
          setup:
            - "MED HousingUnit (COED) cap 4 with one Bed. Booking1 MED (FELONY) housed on the bed for [10:00,12:00). Booking2 MIN (MISDEMEANOR) CLASSIFIED, not yet housed."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Jo Qi", date_of_birth: "1980-10-10", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm1: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm1}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 0, sentence_days: 300, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk1: "$.data.id", bkv1: "$.data.version" }
            - call: "POST /bookings/${bk1}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv1}" }
              as: ClassificationOfficer
            - call: "POST /inmates"
              payload: { full_name: "Ki Ru", date_of_birth: "1995-11-11", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm2: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm2}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 50, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk2: "$.data.id", bkv2: "$.data.version" }
            - call: "POST /bookings/${bk2}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv2}" }
              as: ClassificationOfficer
            - call: "POST /housing-units"
              payload: { name: "Pod-M", security_level: "MED", gender: "COED", capacity: 4 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "M1" }
              as: ClassificationOfficer
              captures: { bed: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk1}", bed_id: "${bed}", start_datetime: "2026-05-02T10:00:00Z", end_datetime: "2026-05-02T12:00:00Z" }
              as: ClassificationOfficer
              captures: { ha1: "$.data.id" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk2}", bed_id: "${bed}", start_datetime: "2026-05-02T11:00:00Z", end_datetime: "2026-05-02T13:00:00Z" }
              as: ClassificationOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_SECURITY_LEVEL_MISMATCH\""
            - "err != \"ERR_BED_DOUBLE_BOOKED\" (safety outranks constraint)"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: earned_good_time_cap_boundary
        grounds:
          - calculations.good_time_credit
          - entities.Booking.fields.earned_good_time_days
        distinguishing_aspect: |
          Numeric >= boundary of the earned cap: MIN sentence 100 accrues 25,
          cap 20. With forfeit 5, accrued-net = 20 which EQUALS the cap, so
          min() returns 20 (capped, inclusive). Metric = good-time days;
          reached via the uphold/release-projection path.
        test_recipe:
          setup:
            - "Inmate; Booking MIN sentence 100 (INITIAL, earned pre-forfeit 20); infraction forfeit 5 reported by intake user."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Lo Sa", date_of_birth: "1989-12-12", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /bookings/${bk}/infractions"
              payload: { infraction_type: "PROPERTY_DAMAGE", good_time_forfeit_days: 5 }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { inf: "$.data.id" }
          trigger:
            - call: "POST /infractions/${inf}/uphold"
              as: Supervisor
              as_user_id: "supervisor-1"
          assert:
            - "Booking.${bk}.earned_good_time_days == 20"
            - "Booking.${bk}.projected_release_date == \"2026-07-20\""
            - "accrued-net (25-5=20) == cap (20) -> min() returns the cap (>= inclusive)"

      - name: order_empty_lines_zero_edge
        grounds:
          - validations[priority=10]
          - errors[ERR_VALIDATION]
          - entities.CommissaryOrder.fields.lines
        distinguishing_aspect: |
          Empty-collection edge on a different metric/endpoint: an order with
          lines == [] (zero-cardinality) is rejected ERR_VALIDATION at
          POST /commissary-accounts/{id}/orders — distinct from the numeric
          good-time cap boundary.
        test_recipe:
          setup:
            - "Inmate; Booking; auto CommissaryAccount (version 1)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Mo Ta", date_of_birth: "1991-01-15", sex: "FEMALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "INFRACTION", prior_bookings_count: 0, sentence_days: 20, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id", acctv: "$.data[0].version" }
          trigger:
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_VALIDATION\""

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_requires_visitor_approved
        grounds:
          - validations[priority=35]
          - errors[ERR_VISITOR_NOT_APPROVED]
          - state_machines.Visitor.PENDING_to_APPROVED
        distinguishing_aspect: |
          Visit creation depends on Visitor state: a visit referencing a
          PENDING (not APPROVED) visitor is rejected ERR_VISITOR_NOT_APPROVED.
          Entity pair Visit -> Visitor.
        test_recipe:
          setup:
            - "Inmate; Booking; a PENDING Visitor (never approved)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "No Ub", date_of_birth: "1990-02-20", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /inmates/${inm}/visitors"
              payload: { visitor_name: "Val Visitor", relationship: "FAMILY" }
              as: Scheduler
              captures: { vis: "$.data.id" }
          trigger:
            - call: "POST /visits"
              payload: { booking_id: "${bk}", visitor_id: "${vis}", start_datetime: "2026-05-03T10:00:00Z", end_datetime: "2026-05-03T11:00:00Z" }
              as: Scheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_VISITOR_NOT_APPROVED\""

      - name: housing_requires_booking_classified
        grounds:
          - validations[priority=31]
          - errors[ERR_BOOKING_NOT_CLASSIFIED]
          - state_machines.Booking.CLASSIFIED_to_HOUSED
        distinguishing_aspect: |
          HousingAssignment creation depends on Booking state: assigning a bed
          to a BOOKED (unclassified) booking is rejected
          ERR_BOOKING_NOT_CLASSIFIED. Entity pair HousingAssignment -> Booking,
          different from Visit -> Visitor.
        test_recipe:
          setup:
            - "Inmate MALE; Booking left BOOKED (no classification); HousingUnit MIN/MALE with one Bed."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Op Wa", date_of_birth: "1988-03-25", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /housing-units"
              payload: { name: "Pod-B", security_level: "MIN", gender: "MALE", capacity: 4 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "B1" }
              as: ClassificationOfficer
              captures: { bed: "$.data.id" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk}", bed_id: "${bed}", start_datetime: "2026-05-02T10:00:00Z" }
              as: ClassificationOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_BOOKING_NOT_CLASSIFIED\""

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bed_half_open_adjacency
        grounds:
          - validations[priority=60]
          - errors[ERR_BED_DOUBLE_BOOKED]
          - entities.HousingAssignment.fields.start_datetime
          - entities.HousingAssignment.fields.end_datetime
        distinguishing_aspect: |
          Bed occupancy is half-open [start,end): an assignment starting
          exactly at a prior assignment's end (12:00) is ALLOWED (adjacency),
          while an interior-overlapping interval [11:00,13:00) is rejected
          ERR_BED_DOUBLE_BOOKED. Resource = Bed.
        test_recipe:
          setup:
            - "MIN/MALE unit cap 4, one Bed. Booking1 (MIN) housed [10:00,12:00). Booking2 and Booking3 both MIN CLASSIFIED and un-housed."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Pa Xe", date_of_birth: "1990-04-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm1: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm1}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk1: "$.data.id", bkv1: "$.data.version" }
            - call: "POST /bookings/${bk1}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv1}" }
              as: ClassificationOfficer
            - call: "POST /housing-units"
              payload: { name: "Pod-C", security_level: "MIN", gender: "MALE", capacity: 4 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "C1" }
              as: ClassificationOfficer
              captures: { bed: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk1}", bed_id: "${bed}", start_datetime: "2026-05-02T10:00:00Z", end_datetime: "2026-05-02T12:00:00Z" }
              as: ClassificationOfficer
              captures: { ha1: "$.data.id" }
            - call: "POST /inmates"
              payload: { full_name: "Qi Yo", date_of_birth: "1991-05-02", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm2: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm2}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk2: "$.data.id", bkv2: "$.data.version" }
            - call: "POST /bookings/${bk2}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv2}" }
              as: ClassificationOfficer
            - call: "POST /inmates"
              payload: { full_name: "Ru Za", date_of_birth: "1992-06-03", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm3: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm3}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk3: "$.data.id", bkv3: "$.data.version" }
            - call: "POST /bookings/${bk3}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv3}" }
              as: ClassificationOfficer
          trigger:
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk2}", bed_id: "${bed}", start_datetime: "2026-05-02T12:00:00Z", end_datetime: "2026-05-02T14:00:00Z" }
              as: ClassificationOfficer
              captures: { ha2: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk3}", bed_id: "${bed}", start_datetime: "2026-05-02T11:00:00Z", end_datetime: "2026-05-02T13:00:00Z" }
              as: ClassificationOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "adjacent assignment ha2 created with assignment_status == \"ACTIVE\" (start 12:00 == prior end 12:00 allowed under half-open)"
            - "err == \"ERR_BED_DOUBLE_BOOKED\" (interval [11:00,13:00) overlaps [10:00,12:00))"

      - name: visit_thirty_minute_buffer
        grounds:
          - validations[priority=61]
          - errors[ERR_VISIT_OVERLAP]
          - entities.Visit.fields.start_datetime
        distinguishing_aspect: |
          Visit spacing is a closed interval plus a 30-minute buffer on the
          same Booking: a visit starting 20 min after a prior visit's end is
          rejected ERR_VISIT_OVERLAP, while a visit starting exactly 30 min
          after (>= buffer) is accepted. Resource = Booking; buffer arithmetic
          differs from the bed's zero-buffer half-open rule.
        test_recipe:
          setup:
            - "Inmate; Booking; APPROVED Visitor; a first non-cancelled Visit [10:00,11:00]."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Sa Bo", date_of_birth: "1990-07-07", sex: "FEMALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /inmates/${inm}/visitors"
              payload: { visitor_name: "Vi Sitor", relationship: "ATTORNEY" }
              as: Scheduler
              captures: { vis: "$.data.id" }
            - call: "POST /visitors/${vis}/approve"
              as: Scheduler
            - call: "POST /visits"
              payload: { booking_id: "${bk}", visitor_id: "${vis}", start_datetime: "2026-05-03T10:00:00Z", end_datetime: "2026-05-03T11:00:00Z" }
              as: Scheduler
              captures: { v1: "$.data.id" }
          trigger:
            - call: "POST /visits"
              payload: { booking_id: "${bk}", visitor_id: "${vis}", start_datetime: "2026-05-03T11:20:00Z", end_datetime: "2026-05-03T11:50:00Z" }
              as: Scheduler
              captures: { err: "$.data.error_id" }
            - call: "POST /visits"
              payload: { booking_id: "${bk}", visitor_id: "${vis}", start_datetime: "2026-05-03T11:30:00Z", end_datetime: "2026-05-03T12:00:00Z" }
              as: Scheduler
              captures: { v3: "$.data.id" }
          assert:
            - "err == \"ERR_VISIT_OVERLAP\" (11:20 start is 20 min after prior end 11:00 < 30-min buffer)"
            - "visit v3 created (start 11:30 is exactly 30 min after prior end 11:00, >= buffer -> allowed)"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commissary_money_conservation
        grounds:
          - state_machines.CommissaryOrder.PENDING_to_FULFILLED
          - state_machines.CommissaryOrder.FULFILLED_to_REFUNDED
          - entities.CommissaryAccount.fields.balance_cents
          - entities.CommissaryAccount.fields.total_deposited_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents). Invariant:
          total_deposited_cents - balance_cents == sum(order_total_cents for
          FULFILLED orders). Deposit 1000, fulfill a 364 order (balance 636,
          diff 364), then refund restores balance 1000 and the sum to 0.
        test_recipe:
          setup:
            - "Inmate; Booking; account deposited 1000c; a PENDING order total 364c placed (account version 3)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ty Ce", date_of_birth: "1990-09-09", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 1000 }
              as: IntakeOfficer
              captures: { acctv: "$.data.version" }
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "soap", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "pen", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "gum", quantity: 1, unit_price_cents: 105, taxable: true } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { ord: "$.data.id" }
            - call: "POST /commissary-orders/${ord}/fulfill"
              as: IntakeOfficer
          trigger:
            - call: "POST /commissary-orders/${ord}/refund"
              as: Supervisor
          assert:
            - "after fulfill (before refund): CommissaryAccount.${acct}.balance_cents == 636 and total_deposited_cents - balance_cents == 364"
            - "after refund: CommissaryAccount.${acct}.balance_cents == 1000"
            - "after refund: total_deposited_cents - balance_cents == 0 (no FULFILLED orders remain)"

      - name: bed_capacity_conservation
        grounds:
          - state_machines.HousingAssignment.ACTIVE_to_ENDED
          - state_machines.Bed.AVAILABLE_to_OCCUPIED
          - state_machines.Bed.OCCUPIED_to_AVAILABLE
          - entities.Bed.fields.status
        distinguishing_aspect: |
          Conserved quantity = bed slots (count). For a unit with 2 beds:
          occupied + available == 2 invariant. Assigning bed1 makes it
          OCCUPIED (occupied 1, available 1); ending the assignment restores
          bed1 to AVAILABLE (occupied 0, available 2) — the total is unchanged.
          Different conserved-quantity type from money.
        test_recipe:
          setup:
            - "Inmate MALE; Booking MIN (INITIAL); MIN/MALE unit cap 4 with two beds A1,A2; booking assigned to A1 (A1 OCCUPIED)."
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ug De", date_of_birth: "1990-10-10", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /housing-units"
              payload: { name: "Pod-D", security_level: "MIN", gender: "MALE", capacity: 4 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "A1" }
              as: ClassificationOfficer
              captures: { bed1: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "A2" }
              as: ClassificationOfficer
              captures: { bed2: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk}", bed_id: "${bed1}", start_datetime: "2026-05-02T10:00:00Z" }
              as: ClassificationOfficer
              captures: { ha: "$.data.id" }
          trigger:
            - call: "POST /housing-assignments/${ha}/end"
              as: ClassificationOfficer
          assert:
            - "before end: Bed.${bed1}.status == \"OCCUPIED\" (unit occupied 1, available 1, total 2)"
            - "after end: Bed.${bed1}.status == \"AVAILABLE\" (unit occupied 0, available 2, total 2 unchanged)"
            - "HousingAssignment.${ha}.assignment_status == \"ENDED\""
