  - name: corner_reservations_from_untransmitted_lines_already_reduce_availability
    claim_type: forward_looking
    grounds:
    - calculations.available_to_promise_units
    - entities.DropshipItem.fields.reserved_units
    - entities.DropshipOrderLine.fields.status
    distinguishing_aspect: 'The availability calculation is forward-looking: PENDING_TRANSMIT lines - which no vendor
      has even seen - are already counted in reserved_units, so available_units falls from 55 to 51 before any transmission
      occurs. Only SHIPPED and CANCELLED_BY_VENDOR lines leave the reserved set.'
