        distinguishing_aspect: "The second void of a VOIDED line must 409, and the plan ledger must show the budget credited exactly once. This is the failure mode that a status-blind void handler produces: the credit is idempotent-looking on the line (committed_cost_cents is already 0) but the plan's committed_cost_cents would go negative on a double credit only if the handler re-reads a stale value, so the assert pins the plan ledger as well as the error."
