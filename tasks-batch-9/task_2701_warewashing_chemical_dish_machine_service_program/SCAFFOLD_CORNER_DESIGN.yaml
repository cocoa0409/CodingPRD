          difficulty_instance: placement_lifecycle_and_health_axes_advance_independently
          rationale: |
            The parallel-shape claim (independent dimensions change independently, combined state
            correct) is exactly what the §1.8 instance drives: it walks the health axis
            UP -> DEGRADED -> DOWN -> UP while the lifecycle axis sits at INSTALLED, then moves the
            lifecycle axis to RETRIEVAL_SCHEDULED and RETRIEVED and shows the health axis being forced
            to OFFLINE only at the terminal step. A separate corner test would restate the same
            transitions with weaker assertions.

      - name: investigation_case_can_loop_back_to_evidence_gathering
        claim_type: cyclic
        grounds:
          - state_machines.InvestigationCase.status
          - endpoints[POST /warewashing/investigation-cases/{case_id}/review]
        excluded_because:
          difficulty_instance: investigation_case_returns_to_evidence_gathering_twice
          rationale: |
            The loop-back claim and its termination condition are the whole subject of the §1.8
            instance, which drives RETURN twice, asserts return_count 0 -> 1 -> 2 and shows that the
            loop is bounded only by the reviewer's decisions and that evidence added between loops
            accumulates rather than resetting.

      - name: retrieval_completion_is_guarded_by_the_open_ticket_of_another_entity
        claim_type: guarded transitions
        grounds:
          - state_machines.MachinePlacement.placement_status.RETRIEVAL_SCHEDULED_to_RETRIEVED
          - validations.retrieval_blocked_by_open_ticket
        excluded_because:
          difficulty_instance: retrieval_completion_gated_by_open_service_ticket_state
          rationale: |
            This is the scaffold's canonical "A -> B only if entity C is in state X" guard, and the
            §1.8 instance already tests it in both directions: blocked while the ticket is ON_SITE,
            still blocked when the ticket is PENDING_VERIFICATION, and permitted the moment the ticket
            reaches CLOSED.

      - name: clock_expiry_cascade_runs_four_links_deep
        claim_type: Cascade down
        grounds:
          - state_machines.ServiceAgreement.status.ACTIVE_to_EXPIRED
          - endpoints[POST /warewashing/_clock/set_current_utc]
        excluded_because:
          difficulty_instance: cascade_alpha_clock_expiry_reaches_alert_suppression_four_links_deep
          rationale: |
            The parent-to-children cascade of expiry (agreement -> placements -> dispensers -> alert
            suppression) is enumerated link by link in the §1.8 instance, including the "only
            non-terminal children are affected" half - a CANCELLED placement in the same agreement is
            asserted to be left alone.

      - name: a_critical_reading_propagates_across_four_entities
        claim_type: Cross-entity
        grounds:
          - state_machines.MachinePlacement.operational_status.UP_to_DOWN
          - state_machines.ServiceTicket.initial_state
          - entities.Site.fields.service_posture
        excluded_because:
          difficulty_instance: cascade_beta_critical_reading_reaches_site_posture_four_links_deep
          rationale: |
            The §1.8 instance follows one telemetry reading through alert creation, placement health
            demotion, auto-ticket creation with its priority score, and the site's posture
            re-derivation, asserting every intermediate entity's fields - a corner test would be a
            strict subset.

      - name: customer_equipment_ledger_tracks_placement_state_changes
        claim_type: Ledger sync
        grounds:
          - entities.Customer.fields.equipment_on_placement_value_cents
          - state_machines.MachinePlacement.placement_status
        excluded_because:
          difficulty_instance: equipment_value_ledger_returns_to_zero_after_cancel_and_retrieval
          rationale: |
            The ancestor derived field is reconciled before and after every state change in the §1.8
            instance, which is the Ledger sync claim plus the harder round-trip-to-zero property.

      - name: rejecting_a_visit_reverses_its_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.ServiceVisit.visit_status.SUBMITTED_to_REJECTED
          - entities.Technician.fields.open_ticket_count
        excluded_because:
          difficulty_instance: technician_workload_slots_restored_by_visit_rejection
          rationale: |
            The §1.8 instance is built around the undo path: it asserts that rejection restores the
            technician's workload slot, returns the ticket to DISPATCHED, leaves the calibration
            record unapplied and leaves the dispenser's dose ledger with no drift.

      - name: agreement_expiry_cascade_skips_pending_install_placements
        claim_type: Conditional cascade
        grounds:
          - state_machines.ServiceAgreement.status.ACTIVE_to_EXPIRED
          - state_machines.MachinePlacement.placement_status.INSTALLED_to_RETRIEVAL_SCHEDULED
          - endpoints[POST /warewashing/_clock/set_current_utc]
        distinguishing_aspect: |
          Two placements sit under one expiring agreement and only the INSTALLED one is swept into
          RETRIEVAL_SCHEDULED; the PENDING_INSTALL sibling keeps its state, keeps its null
          retrieval_due_date and keeps contributing to the customer's equipment ledger. The clock jump
          also lands past term_end without ever passing through the renewal window, so
          agreements_moved_to_renewal_pending must be 0 while agreements_expired is 1 - a cascade that
          is applied per child state rather than per parent event.
