              as: Underwriter
              captures: { calc02_la_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "W_CLOSED", discount_kind: "PROMOTIONAL", stacking_class: "ADDITIVE", discount_bps: 90, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { calc02_rc_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${calc02_rc_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "W_OPEN", discount_kind: "PROMOTIONAL", stacking_class: "ADDITIVE", discount_bps: 20, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { calc02_ro_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${calc02_ro_id}/activate"
              payload: {}
