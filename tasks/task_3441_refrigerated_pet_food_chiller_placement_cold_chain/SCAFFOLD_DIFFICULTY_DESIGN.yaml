  - rule_id: compensating_invariant
    instances:
      - name: chiller_fleet_conserved_across_retire_reinstall
        grounds:
          - calculations.fleet_capacity_conservation
          - state_machines.Chiller.INSTALLED_to_IN_STOCK
          - state_machines.Chiller.IN_STOCK_to_INSTALLED
        distinguishing_aspect: |
          Conserved quantity: FLEET_INSTALLED_CAPACITY_UNITS (sum of
          capacity_units over chillers in INSTALLED/ACTIVE/NEEDS_REPAIR) and
          fleet size. The forward action (REMOVE underperformance retire) drops
          installed capacity 240 -> 0; the compensating re-install of the same
          chiller at a new store restores exactly 240, and fleet size never
          changes. A different conserved quantity than the product-units
          sibling.
        test_recipe:
          setup:
            - "Store Alpha placement with STANDARD chiller C (capacity 240), retired after streak 2; Store Gamma with ELIGIBLE evaluation and a SIGNED agreement ready to receive C."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 30 }
              as: PlacementManager
            - call: "POST /cold-chain/placements/${pl_id}/evaluate-performance"
              payload: { trailing_weekly_units: 32 }
              as: PlacementManager
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Gamma", region: "US-MW", demographic_index: 75, weekly_category_velocity_index: 85, competitor_density_index: 15, available_sqft: 100, distance_miles_from_plant: 20 }
              as: PlatformAdmin
              captures: { stg_id: $.data.id }
            - call: "POST /cold-chain/stores/${stg_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${stg_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { agg_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${agg_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { agg_v_signed: $.data.version }
          trigger:
            - call: "POST /cold-chain/placements/${pl_id}/retire"
              payload: { mode: "REMOVE", removal_reason: "UNDERPERFORMANCE_REMOVAL" }
              as: PlacementManager
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_mid: $.data.status }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${stg_id}", agreement_id: "${agg_id}", chiller_id: "${ch_id}", expected_agreement_version: "${agg_v_signed}" }
              as: PlacementManager
              captures: { pl2_id: $.data.id }
            - call: "GET /cold-chain/chillers/${ch_id}"
              as: PlatformAdmin
              captures: { ch_status_end: $.data.status }
          assert:
            - "before retire: GET /chillers total_count == 1 and FLEET_INSTALLED_CAPACITY_UNITS == 240 (one INSTALLED STANDARD)"
            - "after REMOVE retire: Chiller.${ch_id}.status == IN_STOCK; total_count still == 1; installed capacity 0"
            - "after compensating re-install at Store Gamma: Chiller.${ch_id}.status == INSTALLED; total_count still == 1; installed capacity restored to exactly 240"
            - "new Placement.${pl2_id} references the same chiller_id and Store Gamma; original placement RETIRED with reason UNDERPERFORMANCE_REMOVAL"
      - name: lot_units_conserved_across_delivery_sweep
        grounds:
          - calculations.lot_unit_conservation
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - state_machines.InventoryPosition.SELLABLE_to_REMOVED
        distinguishing_aspect: |
          Conserved quantity: PRODUCT UNITS per lot (quantity_units ==
          unshipped + in_transit + in_store + removed + spoiled). A 120-unit
          shipment delivered 115/5 followed by a near-expiry sweep of 115 must
          leave the five-bucket sum exactly 500 — a different conserved
          quantity (product units vs chiller capacity units) than the sibling.
        test_recipe:
          setup:
            - "Full ACTIVE+activated placement on Store Alpha; RELEASED lot of 500 produced 2026-09-01T00:00:00Z (expires 2026-10-16T00:00:00Z)."
            - "Shipment of 120 departed 2026-09-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /cold-chain/stores/${st_id}/site-evaluations"
              payload: { model_variant: "DEMOGRAPHIC_LED", chiller_model: "STANDARD", forecast_weekly_units: 200, allocated_sqft: 16 }
              as: PlacementManager
            - call: "POST /cold-chain/stores/${st_id}/placement-agreements"
              payload: { allocated_sqft: 16, max_capex_cents: 500000, term_months: 60 }
              as: PlacementManager
              captures: { ag_id: $.data.id }
            - call: "POST /cold-chain/placement-agreements/${ag_id}/sign"
              payload: {}
              as: PlacementManager
              captures: { ag_v_signed: $.data.version }
            - call: "POST /cold-chain/chillers"
              payload: { model: "STANDARD", serial_prefix: "FP", quantity: 1 }
              as: ProductionPlanner
              captures: { ch_id: "$.data[0].id" }
            - call: "POST /cold-chain/placements"
              payload: { store_id: "${st_id}", agreement_id: "${ag_id}", chiller_id: "${ch_id}", expected_agreement_version: "${ag_v_signed}" }
              as: PlacementManager
              captures: { pl_id: $.data.id }
            - call: "POST /cold-chain/product-lots"
              payload: { sku: "BEEF-5LB", produced_at: "2026-09-01T00:00:00Z", quantity_units: 500 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /cold-chain/product-lots/${lot_id}/release"
              payload: { qc_passed: true }
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/shipments"
              payload: { store_id: "${st_id}", lot_id: "${lot_id}", quantity_units: 120 }
              as: LogisticsCoordinator
              captures: { sh_id: $.data.id }
            - call: "POST /cold-chain/shipments/${sh_id}/deliver"
              payload: { accepted_units: 115, rejected_units: 5 }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cold-chain/stores/${st_id}/inventory/date-check-sweep"
              payload: {}
              as: StoreOperator
              as_user_id: "${st_id}"
              captures: { sw_removed: $.data.positions_removed, sw_units: $.data.units_removed, sw_near: $.data.near_expiry_units, sw_exp: $.data.expired_units, sw_breach: $.data.cold_chain_breach_units }
            - call: "GET /cold-chain/product-lots/${lot_id}"
              as: ProductionPlanner
              captures: { lot_unshipped: $.data.unshipped_qty, lot_transit: $.data.in_transit_qty, lot_store: $.data.in_store_qty, lot_removed: $.data.removed_qty, lot_spoiled: $.data.spoiled_qty }
            - call: "GET /cold-chain/inventory-positions"
              payload: { store_id: "${st_id}" }
              as: StoreOperator
              as_user_id: "${st_id}"
              captures: { pos_status: "$.data[0].status", pos_reason: "$.data[0].removal_reason" }
          assert:
            - "sweep response: positions_removed == 1, units_removed == 115, near_expiry_units == 115, expired_units == 0, cold_chain_breach_units == 0 (days_to_expiry = floor(1.5) = 1 <= 7)"
            - "lot buckets: unshipped_qty == 380, in_transit_qty == 0, in_store_qty == 0, removed_qty == 115, spoiled_qty == 5"
            - "conservation: 380 + 0 + 0 + 115 + 5 == 500 == quantity_units (invariant held across deliver + sweep)"
            - "position status == REMOVED with removal_reason == NEAR_EXPIRY"
