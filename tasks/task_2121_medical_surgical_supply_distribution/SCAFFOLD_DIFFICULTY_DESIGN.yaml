          - validations[priority=15]
          - state_machines.FormularyItem.RESTRICTED_to_APPROVED
          - errors[ERR_ITEM_NOT_ON_FORMULARY]
          - entities.FormularyItem.fields.formulary_status
        distinguishing_aspect: |
          Entity pair ORDER_LINE -> FORMULARY_ITEM: whether a line may be written onto
          a DRAFT order depends entirely on the formulary_status of a different row,
          the FormularyItem for the same (supply room, item). RESTRICTED refuses,
          APPROVED admits, with no change to the order itself in between.
        test_recipe:
          setup:
            - "One ACUTE supply room and one AMBIENT case item with an ACTIVE contract line at tier_price 1000 / floor 800."
            - "The item's formulary mapping decided as RESTRICTED."
            - "An empty DRAFT order for the room."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-014", room_code: "ICU-14", gpo_member_class: "ACUTE", room_type: "ICU" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-X-CS", description: "Restricted commodity, case", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-X14", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 1000, floor_price_cents: 800 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-X", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "RESTRICTED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 2, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { err: $.data.error_id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 2, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_id: $.data.id }
          assert:
            - "${err} == ERR_ITEM_NOT_ON_FORMULARY with HTTP 422"
            - "the refused line write left ReplenishmentOrder.${order_id}.version == ${order_v1} and order_total_cents == 0"
            - "FormularyItem.${fi_id}.formulary_status == APPROVED after the clinician decision"
            - "OrderLine.${line_id}.pinned_unit_price_cents == 1000 and extended_price_cents == 2000 and line_fee_cents == 55"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 2055"

      - name: order_delivery_gated_on_owning_delivery_route_state
        grounds:
          - state_machines.ReplenishmentOrder.ALLOCATED_to_IN_TRANSIT
          - state_machines.ReplenishmentOrder.IN_TRANSIT_to_DELIVERED
          - state_machines.DeliveryRoute.PLANNED_to_DISPATCHED
          - errors[ERR_ORDER_STATE_INVALID]
        distinguishing_aspect: |
          A DIFFERENT entity pair, REPLENISHMENT_ORDER -> DELIVERY_ROUTE: an ALLOCATED
          order cannot be delivered no matter what its own lines look like, because
          IN_TRANSIT is only reachable through its route's PLANNED -> DISPATCHED
          transition. The same deliver call fails, then succeeds, with nothing changed
          on the order itself.
        test_recipe:
