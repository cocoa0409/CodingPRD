  # ===========================================================================
  - section: rbac
    instances:
      - name: applicant_cannot_amend_other_applicants_application
        claim_type: Denied Operation
        grounds:
          - validations[priority=3]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.ApplicantSponsor
        distinguishing_aspect: "Ownership is by X-User-ID equality with the application's applicant_id: applicant B, holding the current version from a perfectly legal GET, still cannot amend applicant A's application."
        test_recipe:
          setup:
            - "Logical clock at default. Applicant A's application submitted (RECEIVED). Applicant B exists and reads A's application."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Owner A", contact_email: "a@oa.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_a: $.data.id }
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Owner B", contact_email: "b@ob.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_b: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Ownex", active_ingredient: "ownexol", strength: "51 mg", dosage_form: "TABLET", rld_approval_date: "2000-01-01", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-83" }
