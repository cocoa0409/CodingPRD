          difficulty_instance: compensating_invariant / feed_reserve_then_delete_conserves_hall_power_ledger
          rationale: "That §1.8 instance reconciles Busway.committed_kw, Hall.committed_kw and Hall.spare_kw before and after the feed release and asserts the ledger returns to its exact starting values."

      - name: package_blocked_cascade_applies_only_to_l4_and_l5
