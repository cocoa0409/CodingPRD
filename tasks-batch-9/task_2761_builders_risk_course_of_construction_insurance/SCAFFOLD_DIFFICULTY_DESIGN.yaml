              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { grade: $.data.engineering_grade }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "SPRINKLER_HYDROSTATIC", window_start: "2027-03-01T08:00:00Z", window_end: "2027-03-01T17:00:00Z", hot_work: false, water_charged: true }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "HVAC", window_start: "2027-03-01T17:00:00Z", window_end: "2027-03-02T02:00:00Z", hot_work: false, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { t2: $.data.id }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "ELECTRICAL_ENERGIZATION", window_start: "2027-03-02T10:00:00Z", window_end: "2027-03-02T18:00:00Z", hot_work: true, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { err_hot: $.data.error_id }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "ELECTRICAL_ENERGIZATION", window_start: "2027-03-02T10:00:00Z", window_end: "2027-03-02T18:00:00Z", hot_work: false, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { t3: $.data.id }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "BOILER_STARTUP", window_start: "2027-03-03T17:59:59Z", window_end: "2027-03-04T01:59:59Z", hot_work: true, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { err_one_second: $.data.error_id }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "BOILER_STARTUP", window_start: "2027-03-03T18:00:00Z", window_end: "2027-03-04T02:00:00Z", hot_work: true, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { t4: $.data.id }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "ELEVATOR", window_start: "2027-03-04T02:00:00Z", window_end: "2027-03-04T10:00:00Z", hot_work: false, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { err_symmetric: $.data.error_id }
            - call: "POST /builders-risk/testing-notices"
              payload: { project_id: "${p1}", system_type: "ELEVATOR", window_start: "2027-03-05T02:00:00Z", window_end: "2027-03-05T10:00:00Z", hot_work: false, water_charged: false }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { t5: $.data.id }
          assert:
            - "grade == B, so no mitigation_plan_ref is required for any hot_work notice here"
            - "t2 is SCHEDULED: with hot_work false on both sides, window_start 2027-03-01T17:00:00Z exactly equal to T1's window_end is admissible"
            - "err_hot == ERR_TESTING_WINDOW_CONFLICT with HTTP 409 - T2 ends 2027-03-02T02:00:00Z and the 24-hour hot-work buffer reaches 2027-03-03T02:00:00Z, past the requested 2027-03-02T10:00:00Z start"
            - "t3 is SCHEDULED for the byte-identical window with hot_work false, proving the refusal was the buffer and not a plain overlap"
            - "err_one_second == ERR_TESTING_WINDOW_CONFLICT - a hot-work start of 2027-03-03T17:59:59Z is one second short of 24 hours after T3's end 2027-03-02T18:00:00Z"
            - "t4 is SCHEDULED at exactly 2027-03-03T18:00:00Z - separation of exactly the buffer passes"
            - "err_symmetric == ERR_TESTING_WINDOW_CONFLICT for a notice with hot_work false starting exactly at T4's window_end, because T4 carries hot_work - the buffer is symmetric, not a property of the new row"
            - "t5 is SCHEDULED at 2027-03-05T02:00:00Z, exactly 24 hours after T4's end"
            - "GET /builders-risk/projects/${p1}/testing-notices returns exactly 5 rows, all SCHEDULED; none of the three rejected calls created a row"
  - rule_id: compensating_invariant
    instances:
      - name: extension_rescission_conserves_the_premium_ledger_balance
        grounds:
          - calculations.premium_ledger_balance
          - state_machines.ExtensionEndorsement.APPROVED_to_RESCINDED
          - entities.PremiumTransaction
          - entities.BuildersRiskPolicy.fields.written_premium_cents
        distinguishing_aspect: |
          Conserved quantity: the premium ledger identity
          policy.written_premium_cents == sum(PremiumTransaction.amount_cents), together with the
          policy's schedule fields. Rescission is a pure compensation: it must not edit or delete
          the EXTENSION_AP row (the ledger is append-only and PremiumTransaction has no version)
          but append an EXTENSION_AP_REVERSAL of the exact negative, pointing at a strictly
          smaller sequence_no. After the round trip, written_premium_cents, cumulative_extension_days,
