  # ───────────────────────────────────────────────────────────────────────────
  # Rule 7 — cross_entity_state_dependency
  # Two cross-entity dependencies across DIFFERENT entity pairs.
  #   (A) Visit.SCHEDULED -> COMPLETED requires PlanOfCare.status IN
  #       {ACTIVE, RECERT_DUE} via AuthorizationGrant.plan_of_care_id (Visit→POC pair).
  #   (B) MIPSQualityMeasure submit requires Patient.insurance_type=MEDICARE AND
  #       Therapist.medicare_provider_enrolled=true (MIPS→Patient+Therapist pair).
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_complete_blocked_when_parent_poc_discharged
        grounds:
          - state_machines.Visit.SCHEDULED_to_COMPLETED
          - state_machines.PlanOfCare.ACTIVE_to_DISCHARGED
          - validations[priority=300]
        distinguishing_aspect: |
          Entity-pair (Visit, PlanOfCare): Visit's transition
          SCHEDULED -> COMPLETED is blocked when its parent POC (resolved via
          AuthorizationGrant.plan_of_care_id) is in DISCHARGED — the discharge
          cascade itself sets visit CANCELLED, but if the operator races a
          discharge mid-day, a subsequent /complete on the just-cancelled visit
          fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "ACTIVE COMMERCIAL POC + grant + SCHEDULED Visit. DischargeAssessment recorded. POC discharged — visit cascades to CANCELLED. Trigger: attempt /complete."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T CE A", npi_number: "1000000070", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat CE A", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 10, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-15T10:00:00Z", scheduled_end_utc: "2026-06-15T11:00:00Z", planned_minutes: 60, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /rehab/discharge-assessments"
              payload: { plan_of_care_id: "${poc_id}", assessing_therapist_id: "${th_id}", final_functional_score: 60, goals_met_count: 5, total_goals_count: 10, assessed_on: "2026-06-10" }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/discharge"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rehab/visits/${visit_id}/complete"
              payload: { actual_minutes: 60 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response.status == 409"
            - "trigger response.data.error_id == ERR_INVALID_STATE"
            - "PlanOfCare.${poc_id}.status == DISCHARGED"
            - "Visit.${visit_id}.status == CANCELLED"

      - name: mips_submit_blocked_when_therapist_not_medicare_enrolled
        grounds:
          - state_machines.MIPSQualityMeasure.DRAFT_to_SUBMITTED
          - entities.Therapist.fields.medicare_provider_enrolled
          - entities.Patient.fields.insurance_type
          - validations[priority=405]
        distinguishing_aspect: |
          Entity-pair (MIPSQualityMeasure, Therapist): MIPSQualityMeasure
          DRAFT -> SUBMITTED depends on Therapist.medicare_provider_enrolled.
          A MEDICARE Patient + non-enrolled Therapist has a DRAFT measure that
          fails on submit with ERR_MIPS_ELIGIBILITY (priority 405). Different
          entity pair from (Visit, PlanOfCare).
        test_recipe:
          setup:
            - "MEDICARE Patient, Therapist A medicare_provider_enrolled=true (used as reporting_therapist for the measure create — passes create), Therapist B medicare_provider_enrolled=false. ACTIVE POC + INITIAL Eval. DRAFT MIPS128 measure with reporting_therapist_id=Therapist A's id — but we update the measure to point at Therapist B via revise? No — measure_code is the only revise field other than numerator_met. We instead create the measure with reporting_therapist_id=Therapist B at create — which is REJECTED by 405 at create. So this test asserts ERR_MIPS_ELIGIBILITY on POST /rehab/mips-measures with reporting_therapist_id pointing to a non-enrolled therapist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T CE B1", npi_number: "1000000071", license_state: "CA", medicare_provider_enrolled: true }
