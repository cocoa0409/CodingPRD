  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_windows_are_closed_intervals_plus_a_forty_five_minute_turnaround
        resource_entity: Truck
        interval_semantics: "closed intervals [window_start, window_end] widened by a 45-minute turnaround buffer at each end; a single truck can hold at most one non-terminal job at a time"
        grounds:
          - validations[priority 21]
          - errors.ERR_TRUCK_WINDOW_CONFLICT
          - entities.PickupJob.fields.window_start
          - entities.PickupJob.fields.window_end
          - entities.Truck
        distinguishing_aspect: |
          The resource is a truck and the semantics are closed-plus-buffer with a capacity of
          one, so the decision boundary is not the window edge but the edge plus 45 minutes,
          and it has to be tested on BOTH sides: a job starting 44 minutes after another ends
          is refused, one starting exactly 45 minutes after is accepted, and symmetrically a
          job ending exactly 45 minutes before another starts is accepted while 44 minutes
          before is refused.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator on an ACTIVE STD-2026 agreement, and one truck with capacity_volume_cuft 600"
            - "three screened pieces on that agreement: X1 SOFA declared 189950 volume 55 cuft, X2 CASEGOOD declared 60000 volume 20 cuft, X3 CASEGOOD declared 20000 volume 13 cuft"
            - "job A already reserves the truck for the closed window 2026-08-05T09:00:00Z - 2026-08-05T11:00:00Z carrying X1, and is left SCHEDULED so it keeps holding the resource"
            - "no job is ever completed in this fixture, so no PICKUP_SURCHARGE_DEBIT is minted and the balance stays 0"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
