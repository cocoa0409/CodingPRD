            - "GET /bereavement/participants/${p_id}/anniversary-outreaches returns 4 rows, all with status CANCELLED"

      - name: event_not_fundable_and_space_time_conflict_errors
        claim_type: Violation to Error
        grounds: ["errors[ERR_EVENT_NOT_FUNDABLE]", "errors[ERR_SPACE_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_error_wins_over_fiscal_error_on_funding_allocation_create
