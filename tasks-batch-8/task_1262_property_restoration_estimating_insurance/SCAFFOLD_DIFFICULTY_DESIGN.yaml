  - rule_id: non_linear_state_machine
    instances:
      - name: estimate_negotiation_revision_cycle
        grounds:
          - state_machines.Estimate.SUBMITTED_to_COUNTERED
          - state_machines.Estimate.COUNTERED_to_REVISED
          - state_machines.EstimateLine.DISPUTED_to_PENDING
          - state_machines.NegotiationRound.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Cyclic machine on Estimate: SUBMITTED -> COUNTERED -> REVISED ->
          SUBMITTED -> APPROVED; the REJECT branch leaves the estimate COUNTERED
          while auto-resolving the round, forcing an explicit revise edge before
          resubmission. (Second machine of this rule lives on Payment.)
        test_recipe:
          setup:
            - "Carrier tax 0; entry LABOR 200c dep 0; policy FLAT 50,000; claim FIRE with completed inspection; estimate with one line qty 1000 (200,000c) SUBMITTED; claim NEGOTIATING"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "GEN-1", trade: "GENERAL", kind: "LABOR", unit: "EA", unit_price_cents: 200, default_depreciation_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
