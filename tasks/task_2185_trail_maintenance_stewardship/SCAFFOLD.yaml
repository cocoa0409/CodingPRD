scenario: "desgin task harder than expert level.!!!!2185. Trail Maintenance & Volunteer Stewardship (trail stewardship organization): trail segment adoption & work plan, work party scheduling & tool/safety briefing, condition report & hazard prioritization, land manager permission & permit for work, volunteer hour tracking for grant match, project material procurement (bridges/signage), seasonal closure & wet-weather policy, incident reporting & first aid coverage"
domain_name: "trail-maintenance-stewardship"
api_prefix: "/stewardship"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Hybrid: a strict LandManager -> TrailSegment -> AdoptionAgreement -> WorkPlan spine,
  # crossed by WorkPermit / WorkParty / VolunteerShift / MaterialOrder / IncidentReport
  # associations that reach sideways to VolunteerProfile and back up to TrailSegment.

  state_machine_shape: parallel
  # WorkParty carries two independent axes (schedule_status x readiness_status);
  # AdoptionAgreement and WorkPlan are cyclic (revision loops);
  # ConditionReport is a branching fork-join with divergent per-branch resolve effects;
  # TrailSegment.posture is a derived posture_driven axis that gates child operations.

  relationship_patterns:
    - one_to_many
    - many_to_many        # VolunteerShift is the WorkParty x VolunteerProfile junction
    - cross_aggregate     # IncidentReport reaches WorkParty -> TrailSegment -> AdoptionAgreement

  role_model: segregation_of_duties
  # Hour verification (StewardshipCoordinator) and hour certification (GrantsAdministrator)
  # must be performed by different X-User-IDs; incident close must not be the reporter.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: LandManager
    parent: null
    common_fields: true
    fields:
      - name: agency_name
        type: string
        source: input
        description: "Name of the agency or landowner that controls the trail segments."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Opaque jurisdiction code, e.g. USFS-R6. Unique across LandManager."
        constraints: "unique; 1..40 chars"
      - name: permit_required
        type: boolean
        source: input
        default: true
        description: "When true, a WorkParty may only be confirmed if it references an ISSUED WorkPermit."
      - name: permit_lead_days
        type: integer
        source: input
        default: 14
        description: "Whole days that must separate the logical clock date from WorkPermit.window_start_date at request time."
        constraints: ">= 0"
      - name: max_party_size
        type: integer
        source: input
        default: 20
        description: "Agency ceiling on people on the ground; a WorkPermit may only be issued with max_party_size <= this value."
        constraints: ">= 1"
      - name: wet_threshold_index
        type: number
        source: input
        default: 0.65
        description: "Soil moisture index at or above which segments under this manager become WET_RESTRICTED."
        constraints: "0.0 .. 1.0, 2 decimal places"
      - name: requires_engineering_review
        type: boolean
        source: input
        default: false
        description: "When true, a MaterialOrder with category BRIDGE may only be submitted with a non-null engineering_review_ref."
      - name: requires_certified_sawyer
        type: boolean
        source: input
        default: true
        description: "When true, a WorkParty with work_type CHAINSAW requires at least one non-withdrawn VolunteerShift whose volunteer holds CERT_SAWYER_B or CERT_SAWYER_C."
      - name: policy_version
        type: integer
        source: system
        default: 1
        description: "Snapshotted onto AdoptionAgreement.pinned_policy_version at activation."
      - name: adopted_segment_count
        type: integer
        source: computed
        default: 0
        description: "Count of TrailSegment rows under this manager whose adoption_status == ADOPTED."

  - name: VolunteerProfile
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Volunteer display name."
      - name: email
        type: string
        source: input
        description: "Contact email. Unique across VolunteerProfile."
        constraints: "unique"
      - name: waiver_signed_on
        type: string
        source: input
        default: null
        description: "Date (YYYY-MM-DD) the liability waiver was signed; null when never signed."
      - name: waiver_expires_on
        type: string
        source: computed
        default: null
        description: "waiver_signed_on + 365 days, as YYYY-MM-DD; null when waiver_signed_on is null."
      - name: certifications
        type: array
        source: input
        default: []
        description: "Held certifications."
        constraints: "subset of {CERT_FIRST_AID, CERT_WFA, CERT_SAWYER_B, CERT_SAWYER_C, CERT_TRAIL_SKILLS, CERT_ENGINEER, CERT_CREW_LEADER}"
      - name: first_aid_expires_on
        type: string
        source: input
        default: null
        description: "Date (YYYY-MM-DD) that CERT_FIRST_AID / CERT_WFA lapses; null when no first-aid certification is held."
      - name: skill_class
        type: enum
        source: computed
        description: "Grant-match rate band derived from certifications with precedence PROFESSIONAL > CERTIFIED_SAWYER > SKILLED_TRAIL > GENERAL."
        constraints: "GENERAL | SKILLED_TRAIL | CERTIFIED_SAWYER | PROFESSIONAL"
      - name: lifetime_credited_hours
        type: number
        source: computed
        default: 0
        description: "Running total of every hour ever credited to this volunteer by a check-out or a dispute adjustment. Conserved quantity of INV_HOURS."
        constraints: "2 decimal places"
      - name: pending_hours
        type: number
        source: computed
        default: 0
        description: "Credited hours sitting on shifts whose status is CHECKED_OUT or HOURS_DISPUTED."
      - name: verified_hours
        type: number
        source: computed
        default: 0
        description: "Credited hours sitting on shifts whose status is HOURS_VERIFIED."
      - name: certified_hours
        type: number
        source: computed
        default: 0
        description: "Credited hours sitting on shifts whose status is HOURS_CERTIFIED."
      - name: active_registration_count
        type: integer
        source: computed
        default: 0
        description: "Count of this volunteer's shifts whose status is in {REGISTERED, CHECKED_IN}."

  - name: TrailSegment
    parent: LandManager
    common_fields: true
    fields:
      - name: land_manager_id
        type: string
        source: input
        description: "FK -> LandManager.id; the agency whose permit and wet-weather policy govern this segment."
      - name: name
        type: string
        source: input
        description: "Segment display name."
      - name: length_miles
        type: number
        source: input
        description: "Segment length in miles."
        constraints: "> 0, 2 decimal places"
      - name: surface_class
        type: enum
        source: input
        description: "Tread surface, used by the wet-weather policy narrative."
        constraints: "NATIVE_SOIL | GRAVEL | BOARDWALK | ROCK"
      - name: traffic_class
        type: enum
        source: input
        default: MODERATE
        description: "Visitor traffic band; feeds the TRAFFIC_MULT factor of condition_report_priority_score."
        constraints: "LIGHT | MODERATE | HEAVY"
      - name: seasonal_closure_start_mmdd
        type: string
        source: input
        default: null
        description: "Inclusive MM-DD start of the annual seasonal closure; null when the segment has no seasonal closure."
        constraints: "MM-DD"
      - name: seasonal_closure_end_mmdd
        type: string
        source: input
        default: null
        description: "Inclusive MM-DD end of the annual seasonal closure; may wrap across the year boundary (e.g. 12-01 .. 03-31)."
        constraints: "MM-DD"
      - name: latest_soil_moisture_index
        type: number
        source: system
        default: null
        description: "Most recently observed soil moisture index for this segment; null until the first observation."
      - name: latest_moisture_observed_at
        type: datetime
        source: system
        default: null
        description: "observed_at of the most recent moisture observation, ISO 8601 UTC with three fractional digits."
      - name: hazard_index
        type: integer
        source: computed
        default: 0
        description: "Output of segment_hazard_index over this segment's non-terminal ConditionReport rows."
        constraints: "0 .. 100"
      - name: escalated_hazard_count
        type: integer
        source: computed
        default: 0
        description: "Count of this segment's ConditionReport rows whose status == ESCALATED."
      - name: open_severe_incident_count
        type: integer
        source: computed
        default: 0
        description: "Count of IncidentReport rows on this segment with severity_class == SEVERE and status in {OPEN, UNDER_REVIEW}."
      - name: posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived gate over every child work operation; recomputed by the trail_segment_posture machine."
        constraints: "OPEN | HAZARD_RESTRICTED | WET_RESTRICTED | SEASONAL_CLOSED | INCIDENT_CLOSED"
      - name: adoption_status
        type: enum
        source: computed
        default: UNADOPTED
        description: "ADOPTED while exactly one AdoptionAgreement on this segment has status in {ACTIVE, SUSPENDED}; UNADOPTED otherwise."
        constraints: "UNADOPTED | ADOPTED"

  - name: AdoptionAgreement
    parent: TrailSegment
    common_fields: true
    fields:
      - name: trail_segment_id
        type: string
        source: input
        description: "FK -> TrailSegment.id; the segment this crew proposes to adopt."
      - name: crew_leader_volunteer_id
        type: string
        source: input
        description: "FK -> VolunteerProfile.id; the volunteer who signs as crew leader."
      - name: term_start_date
        type: string
        source: input
        description: "Inclusive YYYY-MM-DD start of the adoption term."
      - name: term_end_date
        type: string
        source: input
        description: "Inclusive YYYY-MM-DD end of the adoption term; must be strictly after term_start_date."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Adoption lifecycle state."
        constraints: "DRAFT | SUBMITTED | RETURNED | APPROVED | ACTIVE | SUSPENDED | TERMINATED"
      - name: suspension_reason
        type: enum
        source: system
        default: null
        description: "Why the agreement is SUSPENDED; null in every other status."
        constraints: "BUDGET_OVER_COMMIT | SEGMENT_INCIDENT | null"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "Incremented each time a coordinator RETURNs the agreement; the fourth submit is refused."
      - name: pinned_policy_version
        type: integer
        source: system
        default: null
        description: "LandManager.policy_version snapshotted at activation; null before ACTIVE."
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the StewardshipCoordinator who last reviewed this agreement."
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the DRAFT->...->ACTIVE transition, ISO 8601 UTC with three fractional digits."

  - name: WorkPlan
    parent: AdoptionAgreement
    common_fields: true
    fields:
      - name: adoption_agreement_id
        type: string
        source: input
        description: "FK -> AdoptionAgreement.id; the adoption this seasonal plan belongs to."
      - name: season_year
        type: integer
        source: input
        description: "Calendar year the plan covers. Unique per (adoption_agreement_id, season_year)."
        constraints: "unique with adoption_agreement_id"
      - name: requested_budget_cents
        type: integer
        source: input
        description: "Materials budget the crew asks for, in cents."
        constraints: ">= 0"
      - name: approved_budget_cents
        type: integer
        source: system
        default: 0
        description: "Budget granted by the reviewing coordinator; 0 until the plan is APPROVED."
      - name: committed_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of MaterialOrder.total_cents for this plan with status in {DRAFT, SUBMITTED, APPROVED}."
      - name: spent_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of MaterialOrder.total_cents for this plan with status == DELIVERED."
      - name: available_cents
        type: integer
        source: computed
        default: 0
        description: "approved_budget_cents - committed_cents - spent_cents; may go negative. Conserved quantity of INV_BUDGET."
      - name: budget_posture
        type: enum
        source: computed
        default: HEALTHY
        description: "Threshold band over available_cents produced by work_plan_budget_ledger."
        constraints: "HEALTHY | TIGHT | EXHAUSTED | OVER_COMMITTED"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Work-plan lifecycle state."
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | CLOSED"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "Incremented each time the coordinator answers REQUEST_REVISION; the fourth submit is refused."
      - name: verified_volunteer_hours
        type: number
        source: computed
        default: 0
        description: "Sum of VolunteerShift.credited_hours for this plan's parties with status == HOURS_VERIFIED, each already quantized per shift."
      - name: certified_volunteer_hours
        type: number
        source: computed
        default: 0
        description: "Sum of VolunteerShift.credited_hours for this plan's parties with status == HOURS_CERTIFIED, each already quantized per shift."

  - name: ConditionReport
    parent: TrailSegment
    common_fields: true
    fields:
      - name: trail_segment_id
        type: string
        source: input
        description: "FK -> TrailSegment.id; the segment carrying the hazard."
      - name: reported_by_volunteer_id
        type: string
        source: input
        description: "FK -> VolunteerProfile.id; the volunteer who filed the report."
      - name: hazard_type
        type: enum
        source: input
        description: "Nature of the defect."
        constraints: "BLOWDOWN | TREAD_EROSION | DRAINAGE_FAILURE | BRIDGE_DAMAGE | SIGNAGE_MISSING | BRUSH_ENCROACHMENT"
      - name: severity_class
        type: enum
        source: input
        description: "Reporter-assessed severity; the triage step may override it."
        constraints: "LOW | MODERATE | HIGH | CRITICAL"
      - name: description
        type: string
        source: input
        description: "Free-text field notes."
      - name: exposure_class
        type: enum
        source: system
        default: null
        description: "Fall/exposure band assigned at triage; null before TRIAGED."
        constraints: "LOW | MEDIUM | HIGH | null"
      - name: traffic_class_snapshot
        type: enum
        source: system
        default: null
        description: "TrailSegment.traffic_class copied at triage so later segment edits cannot silently re-score the report."
        constraints: "LIGHT | MODERATE | HEAVY | null"
      - name: priority_score
        type: integer
        source: computed
        default: 0
        description: "Latest output of condition_report_priority_score; 0 before TRIAGED."
        constraints: "0 .. 100"
      - name: priority_variant
        type: enum
        source: computed
        default: null
        description: "Which variant of condition_report_priority_score produced the stored priority_score."
        constraints: "INITIAL_TRIAGE | REASSESSED | null"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Hazard workflow state."
        constraints: "SUBMITTED | TRIAGED | SCHEDULED | DEFERRED | ESCALATED | RESOLVED | VOIDED"
      - name: linked_work_party_id
        type: string
        source: system
        default: null
        description: "FK -> WorkParty.id; set when disposition == SCHEDULE, null otherwise."
      - name: defer_until_date
        type: string
        source: system
        default: null
        description: "YYYY-MM-DD before which a DEFERRED report may not be resolved; null unless DEFERRED."
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the RESOLVED transition, ISO 8601 UTC with three fractional digits."

  - name: WorkPermit
    parent: WorkPlan
    common_fields: true
    fields:
      - name: work_plan_id
        type: string
        source: input
        description: "FK -> WorkPlan.id; the approved plan the permit is requested under."
      - name: trail_segment_id
        type: string
        source: input
        description: "FK -> TrailSegment.id; the segment the permit covers."
      - name: land_manager_id
        type: string
        source: system
        description: "FK -> LandManager.id; copied from TrailSegment.land_manager_id at creation."
      - name: window_start_date
        type: string
        source: input
        description: "Inclusive YYYY-MM-DD first day of authorized work."
      - name: window_end_date
        type: string
        source: input
        description: "Inclusive YYYY-MM-DD last day of authorized work; must be >= window_start_date."
      - name: requested_work_types
        type: array
        source: input
        description: "Work types the crew asks to be authorized for."
        constraints: "non-empty subset of {TREAD_WORK, CHAINSAW, BRIDGE_CONSTRUCTION, SIGNAGE, BRUSHING, DRY_WORK}"
      - name: allowed_work_types
        type: array
        source: system
        default: null
        description: "Work types actually authorized at issue; null until ISSUED. Must be a subset of requested_work_types."
      - name: max_party_size
        type: integer
        source: system
        default: null
        description: "Head-count ceiling stamped at issue; null until ISSUED."
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Permit lifecycle state."
        constraints: "REQUESTED | ISSUED | DENIED | CONSUMED | EXPIRED | REVOKED"
      - name: issued_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the LandManagerOfficer who issued or denied the permit."
      - name: issued_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the ISSUED transition, ISO 8601 UTC with three fractional digits."
      - name: denial_reason
        type: string
        source: system
        default: null
        description: "Officer's stated reason when status == DENIED."
      - name: revocation_reason
        type: string
        source: system
        default: null
        description: "Officer's stated reason when status == REVOKED."
      - name: consumed_party_count
        type: integer
        source: computed
        default: 0
        description: "Count of WorkParty rows referencing this permit whose schedule_status == COMPLETED."

  - name: WorkParty
    parent: WorkPlan
    common_fields: true
    fields:
      - name: work_plan_id
        type: string
        source: input
        description: "FK -> WorkPlan.id; the plan funding this work party."
      - name: trail_segment_id
        type: string
        source: input
        description: "FK -> TrailSegment.id; the segment worked. Must equal the plan's agreement's trail_segment_id."
      - name: work_permit_id
        type: string
        source: input
        default: null
        description: "FK -> WorkPermit.id; the permit relied on, null when the land manager has permit_required == false."
      - name: start_at
        type: datetime
        source: input
        description: "Half-open interval start, ISO 8601 UTC with three fractional digits."
      - name: end_at
        type: datetime
        source: input
        description: "Half-open interval end; must be strictly after start_at and on the same UTC calendar day."
      - name: work_type
        type: enum
        source: input
        description: "The single work type performed by this party."
        constraints: "TREAD_WORK | CHAINSAW | BRIDGE_CONSTRUCTION | SIGNAGE | BRUSHING | DRY_WORK"
      - name: max_participants
        type: integer
        source: input
        description: "Crew-declared head-count ceiling."
        constraints: ">= 1"
      - name: travel_allowance_minutes
        type: integer
        source: input
        default: 0
        description: "Per-volunteer travel minutes creditable on this party, before the TRAVEL_CAP_MIN cap."
        constraints: ">= 0"
      - name: required_certifications
        type: array
        source: input
        default: []
        description: "Certifications every registrant must hold."
        constraints: "subset of {CERT_FIRST_AID, CERT_WFA, CERT_SAWYER_B, CERT_SAWYER_C, CERT_TRAIL_SKILLS, CERT_ENGINEER, CERT_CREW_LEADER}"
      - name: schedule_status
        type: enum
        source: system
        default: PLANNED
        description: "Scheduling axis of the parallel WorkParty machine."
        constraints: "PLANNED | CONFIRMED | IN_PROGRESS | COMPLETED | SUSPENDED | CANCELLED"
      - name: readiness_status
        type: enum
        source: system
        default: PENDING
        description: "Safety/permission axis of the parallel WorkParty machine; advances independently of schedule_status."
        constraints: "PENDING | BRIEFED | CLEARED | BLOCKED"
      - name: briefing_delivered_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the tool/safety briefing was recorded, ISO 8601 UTC with three fractional digits."
      - name: briefing_leader_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CrewLeader who delivered the briefing."
      - name: tool_checklist_complete
        type: boolean
        source: system
        default: false
        description: "Recorded by the briefing endpoint; a false value blocks the readiness axis at BRIEFED."
      - name: first_aid_kit_count
        type: integer
        source: system
        default: 0
        description: "Number of stocked first-aid kits recorded at the briefing."
      - name: registered_count
        type: integer
        source: computed
        default: 0
        description: "Count of this party's VolunteerShift rows with status in {REGISTERED, CHECKED_IN, CHECKED_OUT, HOURS_DISPUTED, HOURS_VERIFIED, HOURS_CERTIFIED}."
      - name: checked_in_count
        type: integer
        source: computed
        default: 0
        description: "Count of this party's VolunteerShift rows with status == CHECKED_IN."
      - name: first_aid_capable_count
        type: integer
        source: computed
        default: 0
        description: "Count of this party's VolunteerShift rows with status in {REGISTERED, CHECKED_IN} whose volunteer holds CERT_FIRST_AID or CERT_WFA and whose first_aid_expires_on >= the logical clock date."
      - name: linked_report_count
        type: integer
        source: computed
        default: 0
        description: "Count of ConditionReport rows whose linked_work_party_id == this party and whose status == SCHEDULED."
      - name: roster_capacity
        type: integer
        source: computed
        default: 0
        description: "min(max_participants, WorkPermit.max_party_size) when work_permit_id is set and the permit is ISSUED; otherwise max_participants."
      - name: block_reason
        type: enum
        source: system
        default: null
        description: "Why readiness_status == BLOCKED; null in every other readiness state."
        constraints: "PERMIT_REVOKED | PERMIT_EXPIRED | SEGMENT_CLOSED | AGREEMENT_SUSPENDED | null"

  - name: VolunteerShift
    parent: WorkParty
    common_fields: true
    fields:
      - name: work_party_id
        type: string
        source: input
        description: "FK -> WorkParty.id; the party this shift belongs to."
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> VolunteerProfile.id; the registered volunteer. Unique per (work_party_id, volunteer_id) across non-WITHDRAWN shifts."
      - name: role_on_crew
        type: enum
        source: input
        default: CREW_MEMBER
        description: "Crew role claimed at registration."
        constraints: "CREW_MEMBER | SAWYER | FIRST_AIDER | CREW_LEADER"
      - name: status
        type: enum
        source: system
        default: REGISTERED
        description: "Registration + hour-tracking lifecycle state."
        constraints: "REGISTERED | CHECKED_IN | CHECKED_OUT | HOURS_DISPUTED | HOURS_VERIFIED | HOURS_CERTIFIED | WITHDRAWN | NO_SHOW"
      - name: checked_in_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of check-in, ISO 8601 UTC with three fractional digits."
      - name: checked_out_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of check-out, ISO 8601 UTC with three fractional digits."
      - name: worked_minutes
        type: integer
        source: computed
        default: 0
        description: "Whole minutes between checked_in_at and checked_out_at, truncated toward zero."
      - name: billable_minutes
        type: integer
        source: computed
        default: 0
        description: "max(0, worked_minutes - break_minutes) + capped travel minutes, per shift_credited_hours."
      - name: credited_hours
        type: number
        source: computed
        default: 0
        description: "Per-shift quantized hours from shift_credited_hours; overwritten by adjusted_hours when a dispute is verified."
        constraints: "multiple of 0.25, 2 decimal places"
      - name: adjusted_hours
        type: number
        source: system
        default: null
        description: "Coordinator-supplied correction recorded on DISPUTE; null unless a dispute has been raised."
        constraints: "multiple of 0.25, >= 0"
      - name: skill_class_snapshot
        type: enum
        source: system
        default: null
        description: "VolunteerProfile.skill_class copied at check-out so later certification edits cannot re-rate historical hours."
        constraints: "GENERAL | SKILLED_TRAIL | CERTIFIED_SAWYER | PROFESSIONAL | null"
      - name: hours_verified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the StewardshipCoordinator who verified the hours."
      - name: hours_certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the GrantsAdministrator who certified the hours; must differ from hours_verified_by_user_id."
      - name: dispute_reason
        type: string
        source: system
        default: null
        description: "Coordinator's stated reason recorded on DISPUTE."

  - name: MaterialOrder
    parent: WorkPlan
    common_fields: true
    fields:
      - name: work_plan_id
        type: string
        source: input
        description: "FK -> WorkPlan.id; the plan whose budget this requisition commits against."
      - name: condition_report_id
        type: string
        source: input
        default: null
        description: "FK -> ConditionReport.id; the hazard this procurement answers, null for routine stock."
      - name: category
        type: enum
        source: input
        description: "Procurement category; BRIDGE carries the engineering-review gate and the bridge surcharge."
        constraints: "BRIDGE | SIGNAGE | TOOLS | DRAINAGE | SURFACING"
      - name: lines
        type: array
        source: input
        description: "Order lines, each an object {sku: string, unit_price_cents: integer >= 0, quantity: integer >= 1}."
        constraints: "non-empty"
      - name: line_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Step 1 of material_order_total_cents: sum over lines of unit_price_cents * quantity."
      - name: discount_pct
        type: number
        source: computed
        default: 0
        description: "Volume discount rate selected from line_subtotal_cents."
      - name: discount_cents
        type: integer
        source: computed
        default: 0
        description: "Step 2 of material_order_total_cents."
      - name: discounted_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Step 3: line_subtotal_cents - discount_cents; the basis for both freight and surcharge tiers."
      - name: freight_cents
        type: integer
        source: computed
        default: 0
        description: "Step 4: freight keyed on discounted_subtotal_cents, not on line_subtotal_cents."
      - name: bridge_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "Step 5: engineered-structure surcharge, non-zero only for category BRIDGE."
      - name: total_cents
        type: integer
        source: computed
        default: 0
        description: "Step 6: discounted_subtotal_cents + freight_cents + bridge_surcharge_cents. The amount committed against the plan."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Procurement lifecycle state."
        constraints: "DRAFT | SUBMITTED | APPROVED | DELIVERED | CANCELLED"
      - name: engineering_review_ref
        type: string
        source: input
        default: null
        description: "Structural engineer sign-off reference, required to submit a BRIDGE order under a manager with requires_engineering_review == true."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the StewardshipCoordinator who approved the order."
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the DELIVERED transition, ISO 8601 UTC with three fractional digits."
      - name: cancellation_reason
        type: string
        source: system
        default: null
        description: "Stated reason recorded on CANCELLED."

  - name: IncidentReport
    parent: WorkParty
    common_fields: true
    fields:
      - name: work_party_id
        type: string
        source: input
        description: "FK -> WorkParty.id; the party during which the incident occurred."
      - name: trail_segment_id
        type: string
        source: system
        description: "FK -> TrailSegment.id; copied from the work party at creation."
      - name: injured_volunteer_id
        type: string
        source: input
        default: null
        description: "FK -> VolunteerProfile.id; the injured volunteer, null for near-miss and property incidents."
      - name: severity_class
        type: enum
        source: input
        description: "Incident severity; SEVERE drives the segment-closure cascade."
        constraints: "MINOR | MODERATE | SEVERE"
      - name: first_aid_rendered
        type: boolean
        source: input
        description: "Whether on-site first aid was given."
      - name: narrative
        type: string
        source: input
        description: "Free-text incident narrative."
      - name: occurred_at
        type: datetime
        source: input
        description: "When the incident happened, ISO 8601 UTC with three fractional digits; must be <= the logical clock."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Incident review state."
        constraints: "OPEN | UNDER_REVIEW | CLOSED"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter."
      - name: closed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the SafetyOfficer who closed the incident; must differ from reported_by_user_id."
      - name: corrective_action
        type: string
        source: system
        default: null
        description: "Corrective action recorded at close."
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the CLOSED transition, ISO 8601 UTC with three fractional digits."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: TrailSegment
    dimension: posture
    initial_state: OPEN
    terminal_states: []
    recompute_rule: |
      posture is a pure function of the segment's own fields plus the logical clock,
      evaluated top-down; the FIRST matching clause wins (strict precedence
      INCIDENT_CLOSED > SEASONAL_CLOSED > WET_RESTRICTED > HAZARD_RESTRICTED > OPEN):
        1. open_severe_incident_count >= 1                                  -> INCIDENT_CLOSED
        2. seasonal_closure_start_mmdd is not null AND the logical clock's
           MM-DD falls inside the inclusive [start, end] window (wrapping
           across the year boundary when start > end)                       -> SEASONAL_CLOSED
        3. latest_soil_moisture_index is not null
           AND latest_soil_moisture_index >= LandManager.wet_threshold_index
           AND (clock - latest_moisture_observed_at) < 72 hours             -> WET_RESTRICTED
        4. hazard_index >= HAZARD_RESTRICT_THRESHOLD (60)                   -> HAZARD_RESTRICTED
        5. otherwise                                                        -> OPEN
      Recompute is triggered by: TrailSegment creation; POST /_weather/observations;
      POST /_clock/set_current_utc; ConditionReport triage / disposition / resolve /
      void; IncidentReport creation and close.
    transitions:
      - from: ANY
        to: INCIDENT_CLOSED
        trigger: "system: posture recompute after IncidentReport creation raises open_severe_incident_count to >= 1"
        actor: system
        preconditions: ["open_severe_incident_count >= 1"]
        side_effects:
          - "Cascade link 2: every AdoptionAgreement on this segment with status == ACTIVE moves to SUSPENDED with suspension_reason = SEGMENT_INCIDENT"
          - "updated_at refreshed; version incremented by 1"
      - from: INCIDENT_CLOSED
        to: OPEN
        trigger: "system: posture recompute after IncidentReport close drops open_severe_incident_count to 0"
        actor: system
        preconditions: ["open_severe_incident_count == 0", "no higher-precedence clause matches"]
        side_effects:
          - "Every AdoptionAgreement on this segment with status == SUSPENDED and suspension_reason == SEGMENT_INCIDENT returns to ACTIVE"
          - "updated_at refreshed; version incremented by 1"
        note: "The recompute may instead land on SEASONAL_CLOSED, WET_RESTRICTED or HAZARD_RESTRICTED when a lower-precedence clause still matches."
      - from: ANY
        to: SEASONAL_CLOSED
        trigger: "system: posture recompute after POST /_clock/set_current_utc moves the clock into the closure window"
        actor: system
        preconditions: ["open_severe_incident_count == 0", "clock MM-DD inside [seasonal_closure_start_mmdd, seasonal_closure_end_mmdd]"]
        side_effects:
          - "Every WorkParty on this segment with schedule_status in {PLANNED, CONFIRMED} gets readiness_status = BLOCKED, block_reason = SEGMENT_CLOSED"
          - "updated_at refreshed; version incremented by 1"
      - from: SEASONAL_CLOSED
        to: OPEN
        trigger: "system: posture recompute after POST /_clock/set_current_utc moves the clock out of the closure window"
        actor: system
        preconditions: ["clock MM-DD outside the closure window", "no higher-precedence clause matches", "hazard_index < 60"]
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: ANY
        to: WET_RESTRICTED
        trigger: "POST /stewardship/_weather/observations with soil_moisture_index >= LandManager.wet_threshold_index"
        actor: system
        preconditions: ["open_severe_incident_count == 0", "clock outside the seasonal closure window", "latest_soil_moisture_index >= LandManager.wet_threshold_index", "clock - latest_moisture_observed_at < 72 hours"]
        side_effects:
          - "Every ConditionReport on this segment with status == TRIAGED keeps its stored priority_score, but any subsequent disposition re-scores it with the REASSESSED variant, which adds WET_SURCHARGE"
          - "Every WorkParty on this segment with schedule_status in {PLANNED, CONFIRMED} and work_type not in {SIGNAGE, DRY_WORK} gets readiness_status = BLOCKED, block_reason = SEGMENT_CLOSED"
          - "updated_at refreshed; version incremented by 1"
      - from: WET_RESTRICTED
        to: OPEN
        trigger: "POST /stewardship/_weather/observations with soil_moisture_index < LandManager.wet_threshold_index, or a clock advance past the 72-hour observation freshness horizon"
        actor: system
        preconditions: ["no higher-precedence clause matches", "hazard_index < 60"]
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: ANY
        to: HAZARD_RESTRICTED
        trigger: "system: posture recompute after segment_hazard_index yields hazard_index >= 60"
        actor: system
        preconditions: ["open_severe_incident_count == 0", "clock outside the seasonal closure window", "no fresh wet observation at or above threshold", "hazard_index >= 60"]
        side_effects:
          - "Every WorkParty on this segment with schedule_status == PLANNED and work_type == CHAINSAW gets readiness_status = BLOCKED, block_reason = SEGMENT_CLOSED"
          - "updated_at refreshed; version incremented by 1"
      - from: HAZARD_RESTRICTED
        to: OPEN
        trigger: "system: posture recompute after condition-report resolution drops hazard_index below 60"
        actor: system
        preconditions: ["hazard_index < 60", "no higher-precedence clause matches"]
        side_effects: ["updated_at refreshed; version incremented by 1"]

  - entity: AdoptionAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stewardship/adoption-agreements/{id}/submit"
        actor: CrewLeader
        preconditions:
          - "acting X-User-ID == crew_leader_volunteer_id"
          - "crew leader's VolunteerProfile.waiver_signed_on is not null and waiver_expires_on >= clock date"
          - "TrailSegment.posture != INCIDENT_CLOSED"
          - "TrailSegment.adoption_status == UNADOPTED"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /stewardship/adoption-agreements/{id}/review with decision RETURN"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects:
          - "revision_round incremented by 1"
          - "reviewed_by_user_id set to the acting X-User-ID"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /stewardship/adoption-agreements/{id}/submit (revision loop)"
        actor: CrewLeader
        preconditions:
          - "revision_round <= MAX_REVISION_ROUNDS (3), else ERR_REVISION_LIMIT_EXCEEDED"
          - "TrailSegment.adoption_status == UNADOPTED"
        side_effects: ["updated_at refreshed; version incremented by 1"]
        note: "Cycle: SUBMITTED -> RETURNED -> SUBMITTED. The fourth submit (revision_round == 4) is refused."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stewardship/adoption-agreements/{id}/review with decision APPROVE"
        actor: StewardshipCoordinator
        preconditions: ["TrailSegment.adoption_status == UNADOPTED"]
        side_effects: ["reviewed_by_user_id set to the acting X-User-ID"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /stewardship/adoption-agreements/{id}/activate"
        actor: LandManagerOfficer
        preconditions:
          - "acting X-User-ID == TrailSegment.land_manager_id"
          - "TrailSegment.posture not in {INCIDENT_CLOSED, SEASONAL_CLOSED}"
          - "clock date is within [term_start_date, term_end_date]"
        side_effects:
          - "pinned_policy_version set to LandManager.policy_version"
          - "activated_at set to the logical clock"
          - "TrailSegment.adoption_status set to ADOPTED and LandManager.adopted_segment_count incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: WorkPlan.budget_posture becomes OVER_COMMITTED, or TrailSegment.posture becomes INCIDENT_CLOSED"
        actor: system
        preconditions: ["at least one suspension cause holds"]
        side_effects:
          - "suspension_reason set to BUDGET_OVER_COMMIT or SEGMENT_INCIDENT"
          - "Cascade link 3: every WorkParty under this agreement's plans with schedule_status == CONFIRMED moves to SUSPENDED with readiness_status = BLOCKED, block_reason = AGREEMENT_SUSPENDED; every WorkParty with schedule_status == PLANNED keeps its schedule_status and only gets readiness_status = BLOCKED with the same block_reason; both sets are processed in created_at ASC order"
          - "Cascade link 4: on every party that link 3 moved to SUSPENDED (the CONFIRMED ones), each VolunteerShift with status == REGISTERED moves to WITHDRAWN and that volunteer's active_registration_count is decremented by 1, processed in created_at ASC order. Parties that stayed PLANNED keep their roster intact."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: the suspension cause clears (MaterialOrder cancellation restores budget_posture, or the last SEVERE incident is closed)"
        actor: system
        preconditions: ["no suspension cause holds any more"]
        side_effects:
          - "suspension_reason set to null"
          - "Every WorkParty under this agreement's plans with block_reason == AGREEMENT_SUSPENDED has readiness_status set to BRIEFED and block_reason set to null; those whose schedule_status == SUSPENDED additionally return to CONFIRMED. Shifts withdrawn by the suspension cascade are NOT restored. Processed in created_at ASC order."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /stewardship/adoption-agreements/{id}/terminate"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects:
          - "TrailSegment.adoption_status set to UNADOPTED; LandManager.adopted_segment_count decremented by 1"
          - "Every WorkPlan under this agreement with status == APPROVED moves to CLOSED"
          - "Every WorkParty under this agreement's plans with schedule_status in {PLANNED, CONFIRMED, SUSPENDED} moves to CANCELLED, processed in created_at ASC order"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /stewardship/adoption-agreements/{id}/terminate"
        actor: LandManagerOfficer
        preconditions: ["reason is a non-empty string", "acting X-User-ID == TrailSegment.land_manager_id"]
        side_effects:
          - "Identical to the ACTIVE -> TERMINATED side-effect set"

  - entity: WorkPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stewardship/work-plans/{id}/submit"
        actor: CrewLeader
        preconditions:
          - "AdoptionAgreement.status == ACTIVE"
          - "requested_budget_cents >= 0"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /stewardship/work-plans/{id}/review with decision REQUEST_REVISION"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects: ["revision_round incremented by 1"]
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "system: immediate on REQUEST_REVISION acknowledgement inside the same review call"
        actor: system
        preconditions: []
        side_effects: ["status set to DRAFT so the crew can resubmit"]
        note: "Cycle: DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT. The review response returns status DRAFT with revision_round advanced; the fourth submit (revision_round == 4) is refused with ERR_REVISION_LIMIT_EXCEEDED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stewardship/work-plans/{id}/review with decision APPROVE"
        actor: StewardshipCoordinator
        preconditions:
          - "AdoptionAgreement.status == ACTIVE"
          - "approved_budget_cents present and >= 0"
        side_effects:
          - "approved_budget_cents set from the request"
          - "work_plan_budget_ledger recomputes committed_cents, spent_cents, available_cents and budget_posture"
      - from: APPROVED
        to: CLOSED
        trigger: "system: AdoptionAgreement terminates"
        actor: system
        preconditions: ["parent AdoptionAgreement.status == TERMINATED"]
        side_effects: ["No further MaterialOrder or WorkPermit may reference this plan"]

  - entity: ConditionReport
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [RESOLVED, VOIDED]
    shape: branching_fork_join
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /stewardship/condition-reports/{id}/triage"
        actor: StewardshipCoordinator
        preconditions: ["exposure_class present"]
        side_effects:
          - "severity_class overwritten when severity_override is supplied"
          - "exposure_class stored; traffic_class_snapshot copied from TrailSegment.traffic_class"
          - "priority_score set from condition_report_priority_score variant INITIAL_TRIAGE; priority_variant set to INITIAL_TRIAGE"
          - "TrailSegment.hazard_index recomputed by segment_hazard_index; segment posture recomputed"
      - from: TRIAGED
        to: SCHEDULED
        trigger: "POST /stewardship/condition-reports/{id}/disposition with disposition SCHEDULE"
        actor: StewardshipCoordinator
        preconditions:
          - "linked_work_party_id present and that WorkParty.trail_segment_id == this report's trail_segment_id"
          - "that WorkParty.schedule_status in {PLANNED, CONFIRMED}"
        side_effects:
          - "priority_score recomputed with variant REASSESSED; priority_variant set to REASSESSED"
          - "linked_work_party_id stored; WorkParty.linked_report_count incremented by 1"
          - "TrailSegment.hazard_index recomputed (weight 1.0 for SCHEDULED); segment posture recomputed"
      - from: TRIAGED
        to: DEFERRED
        trigger: "POST /stewardship/condition-reports/{id}/disposition with disposition DEFER"
        actor: StewardshipCoordinator
        preconditions:
          - "defer_until_date present and strictly after the logical clock date"
          - "the REASSESSED priority_score is < ESCALATION_THRESHOLD (70), else ERR_PRIORITY_TOO_HIGH_TO_DEFER"
        side_effects:
          - "priority_score recomputed with variant REASSESSED; priority_variant set to REASSESSED"
          - "defer_until_date stored"
          - "TrailSegment.hazard_index recomputed (weight 0.5 for DEFERRED); segment posture recomputed"
        note: "The DEFER gate reads the REASSESSED score, not the score stored at triage. A report triaged at 63 can become undeferrable purely by ageing and a wet observation."
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /stewardship/condition-reports/{id}/disposition with disposition ESCALATE"
        actor: StewardshipCoordinator
        preconditions:
          - "the REASSESSED priority_score is >= ESCALATION_THRESHOLD (70), else ERR_PRIORITY_TOO_LOW_TO_ESCALATE"
        side_effects:
          - "priority_score recomputed with variant REASSESSED; priority_variant set to REASSESSED"
          - "TrailSegment.escalated_hazard_count incremented by 1"
          - "TrailSegment.hazard_index recomputed (weight 1.5 for ESCALATED; forced to 100 once escalated_hazard_count >= 2); segment posture recomputed"
      - from: SCHEDULED
        to: RESOLVED
        trigger: "POST /stewardship/condition-reports/{id}/resolve"
        actor: StewardshipCoordinator
        preconditions: ["the linked WorkParty.schedule_status == COMPLETED, else ERR_LINKED_PARTY_NOT_COMPLETE"]
        side_effects:
          - "resolved_at set to the logical clock"
          - "WorkParty.linked_report_count decremented by 1"
          - "TrailSegment.hazard_index recomputed with this report excluded; segment posture recomputed"
      - from: DEFERRED
        to: RESOLVED
        trigger: "POST /stewardship/condition-reports/{id}/resolve"
        actor: StewardshipCoordinator
        preconditions: ["clock date >= defer_until_date, else ERR_DEFER_DATE_NOT_REACHED"]
        side_effects:
          - "resolved_at set to the logical clock"
          - "defer_until_date left as recorded for audit"
          - "TrailSegment.hazard_index recomputed with this report excluded; segment posture recomputed"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /stewardship/condition-reports/{id}/resolve"
        actor: SafetyOfficer
        preconditions:
          - "either the acting role is SafetyOfficer, or a MaterialOrder with condition_report_id == this report has status in {APPROVED, DELIVERED}, else ERR_ESCALATION_NOT_CLEARED"
        side_effects:
          - "resolved_at set to the logical clock"
          - "TrailSegment.escalated_hazard_count decremented by 1"
          - "TrailSegment.hazard_index recomputed with this report excluded; segment posture recomputed"
        note: "The three inbound branches converge on RESOLVED with disjoint precondition and side-effect sets - this is the fork-join divergence."
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /stewardship/condition-reports/{id}/void"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects: ["TrailSegment.hazard_index recomputed; segment posture recomputed"]
      - from: TRIAGED
        to: VOIDED
        trigger: "POST /stewardship/condition-reports/{id}/void"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects: ["TrailSegment.hazard_index recomputed with this report excluded; segment posture recomputed"]

  - entity: WorkPermit
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DENIED, CONSUMED, EXPIRED, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /stewardship/work-permits/{id}/decision with decision ISSUE"
        actor: LandManagerOfficer
        preconditions:
          - "acting X-User-ID == land_manager_id"
          - "TrailSegment.posture != INCIDENT_CLOSED"
          - "allowed_work_types is a non-empty subset of requested_work_types"
          - "max_party_size present and <= LandManager.max_party_size"
        side_effects:
          - "allowed_work_types, max_party_size, issued_by_user_id and issued_at stored"
          - "every WorkParty referencing this permit with readiness_status == BRIEFED advances to CLEARED when the clearance predicate now holds"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /stewardship/work-permits/{id}/decision with decision DENY"
        actor: LandManagerOfficer
        preconditions: ["acting X-User-ID == land_manager_id", "denial_reason is a non-empty string"]
        side_effects:
          - "denial_reason and issued_by_user_id stored"
          - "every WorkParty referencing this permit with schedule_status in {PLANNED, CONFIRMED} gets readiness_status = BLOCKED, block_reason = PERMIT_REVOKED"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /stewardship/work-permits/{id}/revoke"
        actor: LandManagerOfficer
        preconditions: ["acting X-User-ID == land_manager_id", "revocation_reason is a non-empty string"]
        side_effects:
          - "revocation_reason stored"
          - "every WorkParty referencing this permit with schedule_status in {PLANNED, CONFIRMED} gets readiness_status = BLOCKED, block_reason = PERMIT_REVOKED, processed in created_at ASC order"
          - "every such WorkParty with schedule_status == CONFIRMED additionally moves to SUSPENDED"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /stewardship/_clock/set_current_utc advancing the clock date strictly past window_end_date"
        actor: system
        preconditions: ["clock date > window_end_date", "consumed_party_count == 0 or at least one referencing party is still non-terminal"]
        side_effects:
          - "every WorkParty referencing this permit with schedule_status in {PLANNED, CONFIRMED} gets readiness_status = BLOCKED, block_reason = PERMIT_EXPIRED"
      - from: ISSUED
        to: CONSUMED
        trigger: "system: a referencing WorkParty completes and no other referencing party remains in {PLANNED, CONFIRMED, IN_PROGRESS}"
        actor: system
        preconditions: ["consumed_party_count >= 1", "no referencing WorkParty in {PLANNED, CONFIRMED, IN_PROGRESS}"]
        side_effects: ["updated_at refreshed; version incremented by 1"]

  - entity: WorkParty
    dimension: schedule_status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    shape: parallel
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /stewardship/work-parties/{id}/confirm"
        actor: CrewLeader
        preconditions:
          - "readiness_status == CLEARED. This gate is never reported as an opaque 'not cleared' failure: the §1.4 ladder enforces its four underlying causes individually - briefing on record (ERR_BRIEFING_INCOMPLETE), segment posture (ERR_SEGMENT_CLOSED / ERR_WET_WEATHER_RESTRICTED), permit issued and covering (ERR_PERMIT_NOT_ISSUED), agreement ACTIVE (ERR_ADOPTION_NOT_ACTIVE)"
          - "AdoptionAgreement.status == ACTIVE"
          - "TrailSegment.posture is OPEN, or HAZARD_RESTRICTED with work_type != CHAINSAW, or WET_RESTRICTED with work_type in {SIGNAGE, DRY_WORK}"
          - "when LandManager.permit_required: work_permit_id is set, that permit's status == ISSUED, work_type is in allowed_work_types, and both start_at and end_at dates fall inside [window_start_date, window_end_date]"
          - "max_participants <= WorkPermit.max_party_size"
          - "no segment_party_buffer_overlap conflict on trail_segment_id"
          - "first_aid_capable_count >= ceil(registered_count / FIRST_AID_RATIO) and >= 1"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /stewardship/work-parties/{id}/start"
        actor: CrewLeader
        preconditions:
          - "readiness_status == CLEARED, enforced through the same four underlying causes as confirm"
          - "logical clock >= start_at"
          - "TrailSegment.posture is not SEASONAL_CLOSED and not INCIDENT_CLOSED"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /stewardship/work-parties/{id}/complete"
        actor: CrewLeader
        preconditions: ["logical clock >= start_at"]
        side_effects:
          - "every VolunteerShift on this party with status == CHECKED_IN is checked out at min(logical clock, end_at); shift_credited_hours runs per shift, processed in created_at ASC order"
          - "every VolunteerShift on this party still in status == REGISTERED moves to NO_SHOW"
          - "WorkPermit.consumed_party_count incremented by 1; the permit moves to CONSUMED when no other referencing party remains in {PLANNED, CONFIRMED, IN_PROGRESS}"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /stewardship/work-parties/{id}/cancel"
        actor: CrewLeader
        preconditions: ["reason is a non-empty string"]
        side_effects:
          - "every VolunteerShift on this party with status == REGISTERED moves to WITHDRAWN; each such volunteer's active_registration_count decremented by 1, processed in created_at ASC order"
          - "every ConditionReport with linked_work_party_id == this party returns from SCHEDULED to TRIAGED and linked_work_party_id is cleared"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /stewardship/work-parties/{id}/cancel"
        actor: CrewLeader
        preconditions: ["reason is a non-empty string"]
        side_effects: ["Identical to the PLANNED -> CANCELLED side-effect set"]
      - from: CONFIRMED
        to: SUSPENDED
        trigger: "system: parent AdoptionAgreement suspends, or the referenced WorkPermit is revoked"
        actor: system
        preconditions: ["at least one blocking cause holds"]
        side_effects:
          - "readiness_status set to BLOCKED with the matching block_reason"
          - "Cascade link 4: every VolunteerShift on this party with status == REGISTERED moves to WITHDRAWN and the volunteer's active_registration_count is decremented by 1, processed in created_at ASC order"
      - from: SUSPENDED
        to: CONFIRMED
        trigger: "system: the suspension cause clears"
        actor: system
        preconditions: ["no blocking cause holds", "the referenced WorkPermit.status == ISSUED or LandManager.permit_required == false"]
        side_effects: ["readiness_status set to BRIEFED, block_reason set to null"]
        note: "Shifts withdrawn by the suspension cascade are NOT restored; registration is a forward-only act."
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /stewardship/work-parties/{id}/cancel"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects: ["Identical to the PLANNED -> CANCELLED side-effect set"]

  - entity: WorkParty
    dimension: readiness_status
    initial_state: PENDING
    terminal_states: []
    shape: parallel_cyclic
    transitions:
      - from: PENDING
        to: BRIEFED
        trigger: "POST /stewardship/work-parties/{id}/briefing"
        actor: CrewLeader
        preconditions:
          - "schedule_status in {PLANNED, CONFIRMED, SUSPENDED}"
          - "tool_checklist_complete == true and first_aid_kit_count >= 1, else ERR_BRIEFING_INCOMPLETE"
        side_effects:
          - "briefing_delivered_at set to the logical clock; briefing_leader_user_id set to the acting X-User-ID"
          - "when the clearance predicate already holds, readiness_status advances straight through to CLEARED in the same call"
      - from: BRIEFED
        to: CLEARED
        trigger: "system: clearance predicate evaluated at briefing time and again at WorkPermit issue time"
        actor: system
        preconditions:
          - "LandManager.permit_required == false, or the referenced WorkPermit.status == ISSUED with work_type in allowed_work_types and both party dates inside the permit window"
          - "TrailSegment.posture is OPEN, or HAZARD_RESTRICTED with work_type != CHAINSAW, or WET_RESTRICTED with work_type in {SIGNAGE, DRY_WORK}"
          - "AdoptionAgreement.status == ACTIVE"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: CLEARED
        to: BLOCKED
        trigger: "system: permit revoked/denied/expired, segment posture becomes blocking, or parent agreement suspends"
        actor: system
        preconditions: ["at least one blocking cause holds"]
        side_effects: ["block_reason set to PERMIT_REVOKED, PERMIT_EXPIRED, SEGMENT_CLOSED or AGREEMENT_SUSPENDED"]
      - from: BRIEFED
        to: BLOCKED
        trigger: "system: same blocking causes as CLEARED -> BLOCKED"
        actor: system
        preconditions: ["at least one blocking cause holds"]
        side_effects: ["block_reason stored"]
      - from: BLOCKED
        to: BRIEFED
        trigger: "POST /stewardship/work-parties/{id}/briefing (re-brief after the block clears)"
        actor: CrewLeader
        preconditions:
          - "no blocking cause still holds, else ERR_INVALID_STATE"
          - "tool_checklist_complete == true and first_aid_kit_count >= 1"
        side_effects:
          - "block_reason set to null; briefing_delivered_at refreshed"
          - "when the clearance predicate holds, readiness_status advances straight through to CLEARED in the same call"
        note: "Cycle: BRIEFED -> CLEARED -> BLOCKED -> BRIEFED. The readiness axis moves on its own triggers; schedule_status is untouched by any transition in this machine."

  - entity: VolunteerShift
    dimension: status
    initial_state: REGISTERED
    terminal_states: [HOURS_CERTIFIED, WITHDRAWN, NO_SHOW]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /stewardship/shifts/{id}/check-in"
        actor: Volunteer
        preconditions:
          - "WorkParty.schedule_status == IN_PROGRESS"
          - "acting role is CrewLeader, or acting X-User-ID == volunteer_id"
        side_effects:
          - "checked_in_at set to the logical clock"
          - "WorkParty.checked_in_count incremented by 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /stewardship/shifts/{id}/check-out"
        actor: CrewLeader
        preconditions:
          - "WorkParty.schedule_status in {IN_PROGRESS, COMPLETED}"
          - "logical clock > checked_in_at"
        side_effects:
          - "checked_out_at set to the logical clock; worked_minutes, billable_minutes and credited_hours set by shift_credited_hours"
          - "skill_class_snapshot copied from VolunteerProfile.skill_class"
          - "VolunteerProfile.lifetime_credited_hours and pending_hours each increased by credited_hours (INV_HOURS preserved)"
          - "WorkParty.checked_in_count decremented by 1"
      - from: CHECKED_OUT
        to: HOURS_VERIFIED
        trigger: "POST /stewardship/shifts/{id}/hours-review with decision VERIFY"
        actor: StewardshipCoordinator
        preconditions: ["WorkParty.schedule_status == COMPLETED"]
        side_effects:
          - "hours_verified_by_user_id set to the acting X-User-ID"
          - "VolunteerProfile.pending_hours decreased and verified_hours increased by credited_hours (INV_HOURS preserved)"
          - "WorkPlan.verified_volunteer_hours increased by credited_hours"
      - from: CHECKED_OUT
        to: HOURS_DISPUTED
        trigger: "POST /stewardship/shifts/{id}/hours-review with decision DISPUTE"
        actor: StewardshipCoordinator
        preconditions: ["adjusted_hours present, a multiple of 0.25 and >= 0", "dispute_reason is a non-empty string"]
        side_effects:
          - "adjusted_hours and dispute_reason stored"
          - "delta = adjusted_hours - credited_hours; credited_hours set to adjusted_hours"
          - "VolunteerProfile.lifetime_credited_hours and pending_hours each moved by delta (INV_HOURS preserved)"
      - from: HOURS_DISPUTED
        to: HOURS_VERIFIED
        trigger: "POST /stewardship/shifts/{id}/hours-review with decision VERIFY"
        actor: StewardshipCoordinator
        preconditions: ["WorkParty.schedule_status == COMPLETED"]
        side_effects:
          - "hours_verified_by_user_id set to the acting X-User-ID"
          - "VolunteerProfile.pending_hours decreased and verified_hours increased by credited_hours (INV_HOURS preserved)"
          - "WorkPlan.verified_volunteer_hours increased by credited_hours"
      - from: HOURS_DISPUTED
        to: CHECKED_OUT
        trigger: "POST /stewardship/shifts/{id}/hours-review with decision RESET"
        actor: StewardshipCoordinator
        preconditions: []
        side_effects:
          - "credited_hours recomputed from scratch by shift_credited_hours; adjusted_hours and dispute_reason cleared to null"
          - "delta = recomputed credited_hours - stored credited_hours; VolunteerProfile.lifetime_credited_hours and pending_hours each moved by delta"
        note: "Cycle: CHECKED_OUT -> HOURS_DISPUTED -> CHECKED_OUT. RESET is the compensating action for DISPUTE; INV_HOURS must hold with zero drift after the round trip."
      - from: HOURS_VERIFIED
        to: HOURS_CERTIFIED
        trigger: "POST /stewardship/shifts/{id}/certify"
        actor: GrantsAdministrator
        preconditions:
          - "acting X-User-ID != hours_verified_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "VolunteerProfile.waiver_expires_on >= the WorkParty.start_at date"
        side_effects:
          - "hours_certified_by_user_id set to the acting X-User-ID"
          - "VolunteerProfile.verified_hours decreased and certified_hours increased by credited_hours (INV_HOURS preserved)"
          - "WorkPlan.verified_volunteer_hours decreased and certified_volunteer_hours increased by credited_hours"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /stewardship/shifts/{id}/withdraw"
        actor: Volunteer
        preconditions: ["acting role is CrewLeader, or acting X-User-ID == volunteer_id", "WorkParty.schedule_status != COMPLETED"]
        side_effects:
          - "WorkParty.registered_count and VolunteerProfile.active_registration_count each decremented by 1"
          - "WorkParty.first_aid_capable_count recomputed"
      - from: REGISTERED
        to: NO_SHOW
        trigger: "system: the WorkParty completes with this shift never checked in"
        actor: system
        preconditions: ["WorkParty.schedule_status transitions to COMPLETED", "checked_in_at is null"]
        side_effects: ["VolunteerProfile.active_registration_count decremented by 1"]

  - entity: MaterialOrder
    dimension: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stewardship/material-orders/{id}/submit"
        actor: CrewLeader
        preconditions:
          - "WorkPlan.status == APPROVED, else ERR_WORK_PLAN_NOT_APPROVED"
          - "when category == BRIDGE and LandManager.requires_engineering_review: engineering_review_ref is non-null, else ERR_ENGINEERING_REVIEW_REQUIRED"
          - "WorkPlan.budget_posture != OVER_COMMITTED, else ERR_PLAN_OVER_COMMITTED"
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stewardship/material-orders/{id}/approve"
        actor: StewardshipCoordinator
        preconditions: ["WorkPlan.status == APPROVED"]
        side_effects:
          - "approved_by_user_id set to the acting X-User-ID"
          - "any ConditionReport with condition_report_id == this order and status == ESCALATED becomes resolvable by a StewardshipCoordinator"
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /stewardship/material-orders/{id}/receive"
        actor: CrewLeader
        preconditions: ["WorkPlan.status == APPROVED"]
        side_effects:
          - "delivered_at set to the logical clock"
          - "WorkPlan.committed_cents decreased by total_cents and spent_cents increased by total_cents; available_cents and budget_posture recomputed (INV_BUDGET preserved)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /stewardship/material-orders/{id}/cancel"
        actor: CrewLeader
        preconditions: ["reason is a non-empty string"]
        side_effects:
          - "cancellation_reason stored"
          - "Cascade link 2: WorkPlan.committed_cents decreased by total_cents; available_cents and budget_posture recomputed (INV_BUDGET preserved)"
          - "Cascade link 3: when budget_posture leaves OVER_COMMITTED, the parent AdoptionAgreement with suspension_reason == BUDGET_OVER_COMMIT returns from SUSPENDED to ACTIVE"
          - "Cascade link 4: every WorkParty under that agreement's plans with schedule_status == SUSPENDED and block_reason == AGREEMENT_SUSPENDED returns to CONFIRMED with readiness_status = BRIEFED"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /stewardship/material-orders/{id}/cancel"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects: ["Identical to the DRAFT -> CANCELLED side-effect set"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /stewardship/material-orders/{id}/cancel"
        actor: StewardshipCoordinator
        preconditions: ["reason is a non-empty string"]
        side_effects: ["Identical to the DRAFT -> CANCELLED side-effect set"]

  - entity: IncidentReport
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /stewardship/incidents/{id}/review"
        actor: SafetyOfficer
        preconditions: ["severity_class in {MODERATE, SEVERE}"]
        side_effects: ["updated_at refreshed; version incremented by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /stewardship/incidents/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "severity_class == MINOR (MODERATE and SEVERE incidents must pass through UNDER_REVIEW)"
          - "acting X-User-ID != reported_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "corrective_action is a non-empty string"
        side_effects: ["closed_by_user_id, corrective_action and closed_at stored"]
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /stewardship/incidents/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "acting X-User-ID != reported_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "corrective_action is a non-empty string"
        side_effects:
          - "closed_by_user_id, corrective_action and closed_at stored"
          - "TrailSegment.open_severe_incident_count recomputed; when it reaches 0 the segment posture is recomputed and may leave INCIDENT_CLOSED"
          - "each AdoptionAgreement on that segment with suspension_reason == SEGMENT_INCIDENT returns from SUSPENDED to ACTIVE, which returns its SUSPENDED work parties to CONFIRMED"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: shift-register-stale-party
    parent_entity: WorkParty
    write_endpoint: "POST /stewardship/work-parties/{id}/shifts"
    occ_field: "expected_work_party_version"
    description: |
      Registering a volunteer against a WorkParty whose version has advanced since
      the client last read it is rejected. A second registration is a legitimate
      product operation in its own right - a roster holds many volunteers - so the
      loser cannot be caught by any state precondition; only the stale version
      distinguishes it. Every roster mutation (registration, withdrawal, cascade
      withdrawal, briefing, readiness recompute) bumps WorkParty.version, so a
      client that registered once and reuses its original version is stale.
    error_id: ERR_STALE_WORK_PARTY_VERSION
    http_status: 412

  - rule_id: material-order-create-stale-plan
    parent_entity: WorkPlan
    write_endpoint: "POST /stewardship/material-orders"
    occ_field: "expected_work_plan_version"
    description: |
      Creating a MaterialOrder against a WorkPlan whose version has advanced since
      the client last read it is rejected. Adding a second requisition to a plan is
      legitimate on its own, so no state precondition catches the stale writer;
      only the version does. Every ledger movement (order creation, cancellation,
      receipt, budget-posture recompute) bumps WorkPlan.version, so a client that
      created one order and reuses its original version is working from a stale
      view of available_cents.
    error_id: ERR_STALE_WORK_PLAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: condition_report_priority_score
    trigger: "On POST /condition-reports/{id}/triage (variant INITIAL_TRIAGE) and on POST /condition-reports/{id}/disposition (variant REASSESSED). Writes ConditionReport.priority_score and ConditionReport.priority_variant."
    algorithm: weighted_scoring
    formula: |
      base            = SEVERITY_BASE[report.severity_class]
      exposure_mult   = EXPOSURE_MULT[report.exposure_class]
      traffic_mult    = TRAFFIC_MULT[report.traffic_class_snapshot]
      weighted        = base * exposure_mult * traffic_mult          # exact rational, NOT rounded here
      age_days        = floor((clock - report.created_at) / 86400 seconds)
      age_bonus       = min(AGE_BONUS_CAP, floor(age_days / 7) * AGE_BONUS_PER_WEEK)
      wet_surcharge   = WET_SURCHARGE if TrailSegment.posture == WET_RESTRICTED else 0
      raw             = weighted + age_bonus + wet_surcharge
      priority_score  = min(100, round_half_up(raw, 0))              # single rounding, at the very end
    input_set: "A single ConditionReport row. severity_class is the post-override value stored at triage; traffic_class_snapshot is the value frozen at triage, never re-read from TrailSegment.traffic_class."
    constants:
      SEVERITY_BASE: { LOW: 20, MODERATE: 50, HIGH: 80, CRITICAL: 100 }
      EXPOSURE_MULT: { LOW: 0.8, MEDIUM: 1.0, HIGH: 1.25 }
      TRAFFIC_MULT: { LIGHT: 0.9, MODERATE: 1.0, HEAVY: 1.15 }
      AGE_BONUS_PER_WEEK: 3
      AGE_BONUS_CAP: 15
      WET_SURCHARGE: 8
      ESCALATION_THRESHOLD: 70
    precision: "Integer 0..100; a single round_half_up applied to `raw`, never to the intermediate `weighted` product."
    variants:
      - name: INITIAL_TRIAGE
        when: "POST /condition-reports/{id}/triage"
        difference: "age_bonus is forced to 0 and wet_surcharge is forced to 0, regardless of the report's age or the segment's posture. The score is a pure severity x exposure x traffic product."
      - name: REASSESSED
        when: "POST /condition-reports/{id}/disposition, for all three dispositions"
        difference: "age_bonus and wet_surcharge are both live. The DEFER / ESCALATE gates read this value, NOT the value stored at triage, so a report that was deferrable at triage can become undeferrable purely by ageing past a week boundary or by the segment turning WET_RESTRICTED."

  - name: segment_hazard_index
    trigger: "On every ConditionReport triage / disposition / resolve / void, and on TrailSegment creation. Writes TrailSegment.hazard_index and TrailSegment.escalated_hazard_count, then drives the trail_segment_posture recompute."
    algorithm: aggregation
    formula: |
      included = ConditionReport rows where trail_segment_id == segment.id
                 AND status IN {TRIAGED, SCHEDULED, DEFERRED, ESCALATED}
      weight(r) = 1.0  if r.status IN {TRIAGED, SCHEDULED}
                = 0.5  if r.status == DEFERRED
                = 1.5  if r.status == ESCALATED
      raw = sum over included of (r.priority_score * weight(r)) / HAZARD_DIVISOR
      hazard_index = min(100, round_half_up(raw, 0))
      escalated_hazard_count = count of included rows with status == ESCALATED
      if escalated_hazard_count >= ESCALATION_OVERRIDE_COUNT:
          hazard_index = 100        # override applied AFTER the rounded value is computed
    input_set: "Explicit status filter {TRIAGED, SCHEDULED, DEFERRED, ESCALATED}; RESOLVED, VOIDED and SUBMITTED reports are excluded. No time window - every non-terminal, already-triaged report on the segment participates. The sum is order-independent, so no tie-break is required."
    constants:
      HAZARD_DIVISOR: 3
      ESCALATION_OVERRIDE_COUNT: 2
      HAZARD_RESTRICT_THRESHOLD: 60
    precision: "Integer 0..100, round_half_up on the divided sum before the escalation override is applied."

  - name: shift_credited_hours
    trigger: "On POST /shifts/{id}/check-out, on the auto-check-out inside POST /work-parties/{id}/complete, and on POST /shifts/{id}/hours-review with decision RESET. Writes VolunteerShift.worked_minutes, billable_minutes and credited_hours."
    algorithm: threshold
    formula: |
      worked_minutes    = floor((checked_out_at - checked_in_at) / 60 seconds)
      break_minutes     = BREAK_MINUTES if worked_minutes >= BREAK_THRESHOLD_MIN else 0
      travel_minutes    = min(TRAVEL_CAP_MIN, WorkParty.travel_allowance_minutes)
      billable_minutes  = max(0, worked_minutes - break_minutes) + travel_minutes
      quarter_units     = round_half_up(billable_minutes / 15, 0)
      credited_hours    = quarter_units * 0.25                       # 2 decimal places
    input_set: "A single VolunteerShift row plus its WorkParty.travel_allowance_minutes. Only shifts that reach CHECKED_OUT ever receive credited_hours; REGISTERED, WITHDRAWN and NO_SHOW shifts hold credited_hours == 0."
    constants:
      BREAK_THRESHOLD_MIN: 240
      BREAK_MINUTES: 30
      TRAVEL_CAP_MIN: 60
      QUARTER_HOUR_MINUTES: 15
    precision: |
      ROUNDING ORDER IS PINNED AND LOAD-BEARING: quantize to the nearest quarter hour PER SHIFT first,
      then sum the already-quantized per-shift values for every aggregate
      (VolunteerProfile.lifetime_credited_hours / pending_hours / verified_hours / certified_hours,
      WorkPlan.verified_volunteer_hours / certified_volunteer_hours, and every grant_match_value_usd
      hour total). Summing raw billable_minutes across shifts and quantizing the total is FORBIDDEN and
      yields a different answer: two shifts of 395 and 397 billable minutes give 6.50 + 6.50 = 13.00 under
      the pinned order, but 13.25 under the forbidden order.

  - name: material_order_total_cents
    trigger: "On POST /material-orders (creation). Writes MaterialOrder.line_subtotal_cents, discount_pct, discount_cents, discounted_subtotal_cents, freight_cents, bridge_surcharge_cents and total_cents; then commits total_cents against the plan via work_plan_budget_ledger."
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. Each step consumes only values produced by earlier steps.
      # step 1
      line_subtotal_cents = sum over lines of (line.unit_price_cents * line.quantity)
      # step 2 - volume discount tier keyed on line_subtotal_cents (the PRE-discount figure)
      discount_pct = 0.00  if line_subtotal_cents < DISCOUNT_TIER_1_CENTS
                   = 0.04  if DISCOUNT_TIER_1_CENTS <= line_subtotal_cents < DISCOUNT_TIER_2_CENTS
                   = 0.07  if line_subtotal_cents >= DISCOUNT_TIER_2_CENTS
      discount_cents = round_half_up(line_subtotal_cents * discount_pct, 0)
      # step 3
      discounted_subtotal_cents = line_subtotal_cents - discount_cents
      # step 4 - freight tier keyed on discounted_subtotal_cents (the POST-discount figure)
      freight_cents = 0
                      if discounted_subtotal_cents >= FREIGHT_FREE_THRESHOLD_CENTS
                    else FREIGHT_BASE_CENTS + round_half_up(discounted_subtotal_cents * FREIGHT_RATE, 0)
      # step 5 - engineered-structure surcharge, also keyed on discounted_subtotal_cents
      bridge_surcharge_cents = round_half_up(discounted_subtotal_cents * BRIDGE_SURCHARGE_RATE, 0)
                                 if category == BRIDGE else 0
      # step 6
      total_cents = discounted_subtotal_cents + freight_cents + bridge_surcharge_cents
    input_set: "The order's own `lines` array and `category`. No other order on the plan participates."
    constants:
      DISCOUNT_TIER_1_CENTS: 50000
      DISCOUNT_TIER_2_CENTS: 250000
      FREIGHT_FREE_THRESHOLD_CENTS: 200000
      FREIGHT_BASE_CENTS: 4500
      FREIGHT_RATE: 0.02
      BRIDGE_SURCHARGE_RATE: 0.06
    precision: |
      All money in integer cents; every rate multiplication is closed with round_half_up to 0 decimals
      immediately. The circular-looking dependency is deliberate: freight depends on the discounted
      subtotal while the discount depends on the pre-discount subtotal, so the evaluation order above is
      the only thing that makes total_cents well defined. Keying freight on line_subtotal_cents instead
      is the classic wrong reading - a 205000-cent signage order pays 8436 cents of freight under the
      pinned order and 0 under the wrong one.

  - name: work_plan_budget_ledger
    trigger: "On WorkPlan approval and on every MaterialOrder creation, cancellation and receipt. Writes WorkPlan.committed_cents, spent_cents, available_cents and budget_posture, then drives the AdoptionAgreement suspend/resume cascade."
    algorithm: constraint_propagation
    formula: |
      committed_cents = sum of MaterialOrder.total_cents for this plan with status IN {DRAFT, SUBMITTED, APPROVED}
      spent_cents     = sum of MaterialOrder.total_cents for this plan with status == DELIVERED
      available_cents = approved_budget_cents - committed_cents - spent_cents
      tight_floor_cents = round_half_up(approved_budget_cents * TIGHT_RATIO, 0)
      budget_posture = OVER_COMMITTED if available_cents < 0
                     = EXHAUSTED      if available_cents == 0
                     = TIGHT          if 0 < available_cents < tight_floor_cents
                     = HEALTHY        otherwise
      # Hard admission gate applied at MaterialOrder creation, BEFORE the commitment lands:
      #   reject with ERR_PLAN_BUDGET_EXCEEDED when
      #     committed_cents + spent_cents + new_order.total_cents
      #       > round_half_up(approved_budget_cents * OVERCOMMIT_CAP_RATIO, 0)
      #   The cap is inclusive: a total landing exactly on the cap is admitted.
    input_set: "MaterialOrder rows on this plan only; CANCELLED orders are excluded from both sums. The three sums are order-independent."
    constants:
      TIGHT_RATIO: 0.20
      OVERCOMMIT_CAP_RATIO: 1.20
    precision: "Integer cents throughout. INV_BUDGET: approved_budget_cents == committed_cents + spent_cents + available_cents holds after every create, cancel and receive, with zero drift."

  - name: grant_match_value_usd
    trigger: "On GET /stewardship/work-plans/{id}/grant-match. Read-only; persists nothing."
    algorithm: weighted_scoring
    formula: |
      rate(shift) = SKILL_RATE_USD[shift.skill_class_snapshot]
      # variant PROVISIONAL
      included_P            = VolunteerShift rows under this plan's work parties with
                              status IN {CHECKED_OUT, HOURS_DISPUTED, HOURS_VERIFIED, HOURS_CERTIFIED}
      total_credited_hours  = sum of shift.credited_hours over included_P     # already per-shift quantized
      labor_match_usd       = round_half_up(total_credited_hours * SKILL_RATE_USD[GENERAL], 2)
      material_match_usd    = 0.00
      # variant CERTIFIED
      included_C            = VolunteerShift rows under this plan's work parties with status == HOURS_CERTIFIED
      total_credited_hours  = sum of shift.credited_hours over included_C
      labor_match_usd       = sum over included_C of round_half_up(shift.credited_hours * rate(shift), 2)
      material_match_usd    = round_half_up(sum of MaterialOrder.total_cents for this plan
                                            with status == DELIVERED / 100, 2)
      # both variants
      grant_match_total_usd = round_half_up(labor_match_usd + material_match_usd, 2)
      average_rate_usd      = 0.00 if total_credited_hours == 0
                              else round_half_up(labor_match_usd / total_credited_hours, 2)
      included_shift_count  = count of the variant's included set
    input_set: "Shifts are gathered through WorkParty.work_plan_id == the requested plan. Both variants iterate shifts in created_at ASC order; the sums are order-independent, but the per-shift rounding of the CERTIFIED variant makes the SET membership decisive."
    constants:
      SKILL_RATE_USD: { GENERAL: 28.54, SKILLED_TRAIL: 41.20, CERTIFIED_SAWYER: 63.75, PROFESSIONAL: 89.00 }
    precision: "USD with 2 decimal places, round_half_up. Empty included set yields total_credited_hours 0, labor_match_usd 0.00, average_rate_usd 0.00 and grant_match_total_usd equal to material_match_usd (0.00 for PROVISIONAL)."
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL - the figure the crew quotes to a funder before the audit closes"
        difference: "Includes every shift that has reached CHECKED_OUT or beyond, but values EVERY hour at the flat GENERAL rate of 28.54 USD, and excludes delivered materials entirely. The rounding order is sum-hours-then-multiply-then-round-once."
      - name: CERTIFIED
        when: "variant=CERTIFIED - the figure submitted on the grant match report"
        difference: "Includes ONLY shifts in HOURS_CERTIFIED, but values each shift at its own skill_class_snapshot rate, and adds delivered material spend as match. The rounding order is round-per-shift-then-sum. Same underlying shifts therefore yield a different labor_match_usd, a different hour total, and a different average_rate_usd from PROVISIONAL."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; LOWEST number wins)
#
# This table is the SINGLE AUTHORITY for error precedence. The order of the
# `preconditions:` lists in §1.2 is descriptive, not an error ladder.
#
# Domain-specific ordering decision: land-manager permission and human-safety
# checks (10-16) are evaluated BEFORE parent-link checks (17-19), before
# temporal conflicts (20-24), before capacity/uniqueness (25-31) and before
# money (32-33). A crew that is both unpermitted and over budget is told about
# the permission first, because that is the failure the land manager cares about.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's `roles:` list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles acting on their own resource: a Volunteer's X-User-ID must equal the shift's volunteer_id (check-in / withdraw); a CrewLeader's X-User-ID must equal AdoptionAgreement.crew_leader_volunteer_id (submit); a LandManagerOfficer's X-User-ID must equal the governing LandManager.id (permit decision, permit revoke, agreement activate, terminate)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /shifts/{id}/check-in, POST /shifts/{id}/withdraw, POST /adoption-agreements/{id}/submit, POST /adoption-agreements/{id}/activate, POST /adoption-agreements/{id}/terminate, POST /work-permits/{id}/decision, POST /work-permits/{id}/revoke"
  - priority: 4
    category: auth
    check: "Segregation of duties: the acting X-User-ID must differ from the recorded counterpart user id - hours_verified_by_user_id on certify, reported_by_user_id on incident close."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /shifts/{id}/certify, POST /incidents/{id}/close"
  - priority: 5
    category: existence
    check: "Every id in the URL path exists, validated left to right. The concrete code is chosen by the segment that failed: ERR_LAND_MANAGER_NOT_FOUND, ERR_VOLUNTEER_NOT_FOUND, ERR_TRAIL_SEGMENT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_WORK_PLAN_NOT_FOUND, ERR_CONDITION_REPORT_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_WORK_PARTY_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_MATERIAL_ORDER_NOT_FOUND or ERR_INCIDENT_NOT_FOUND."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"
  - priority: 6
    category: business_constraint
    check: "Request body parses, every required field is present, every enum value is a declared member, every number satisfies its declared range, `lines` is a non-empty array of {sku, unit_price_cents >= 0, quantity >= 1}, dates are YYYY-MM-DD and datetimes are ISO 8601 UTC, pagination limit is within 1..100 and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: existence
    check: "Every foreign key supplied in the request body exists, validated in the field order declared on the entity in §1.1 (e.g. on POST /material-orders: work_plan_id then condition_report_id). Concrete codes: land_manager_id -> ERR_LAND_MANAGER_NOT_FOUND; trail_segment_id -> ERR_TRAIL_SEGMENT_NOT_FOUND; crew_leader_volunteer_id / reported_by_volunteer_id / volunteer_id / injured_volunteer_id -> ERR_VOLUNTEER_NOT_FOUND; adoption_agreement_id -> ERR_AGREEMENT_NOT_FOUND; work_plan_id -> ERR_WORK_PLAN_NOT_FOUND; condition_report_id -> ERR_CONDITION_REPORT_NOT_FOUND; work_permit_id -> ERR_PERMIT_NOT_FOUND; work_party_id / linked_work_party_id -> ERR_WORK_PARTY_NOT_FOUND; a shift id -> ERR_SHIFT_NOT_FOUND; a material order id -> ERR_MATERIAL_ORDER_NOT_FOUND; an incident id -> ERR_INCIDENT_NOT_FOUND."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK body fields"
  - priority: 8
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2 (including terminal-state lockdown)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "expected_work_party_version equals the current WorkParty.version."
    error_id: ERR_STALE_WORK_PARTY_VERSION
    http_status: 412
    applies_to: "POST /work-parties/{id}/shifts"
  - priority: 10
    category: state
    check: "expected_work_plan_version equals the current WorkPlan.version."
    error_id: ERR_STALE_WORK_PLAN_VERSION
    http_status: 412
    applies_to: "POST /material-orders"
  - priority: 11
    category: business_safety
    check: "TrailSegment.posture is not SEASONAL_CLOSED and not INCIDENT_CLOSED for any operation that puts people on the ground."
    error_id: ERR_SEGMENT_CLOSED
    http_status: 409
    applies_to: "POST /work-parties/{id}/confirm, POST /work-parties/{id}/start, POST /work-permits/{id}/decision, POST /adoption-agreements/{id}/submit, POST /adoption-agreements/{id}/activate"
  - priority: 12
    category: business_safety
    check: "When TrailSegment.posture == WET_RESTRICTED, the party's work_type must be SIGNAGE or DRY_WORK; when posture == HAZARD_RESTRICTED, work_type must not be CHAINSAW."
    error_id: ERR_WET_WEATHER_RESTRICTED
    http_status: 409
    applies_to: "POST /work-parties/{id}/confirm, POST /work-parties/{id}/start"
  - priority: 13
    category: business_safety
    check: "The volunteer's waiver_signed_on is non-null and waiver_expires_on >= the logical clock date at registration, and >= the WorkParty.start_at date at certification."
    error_id: ERR_WAIVER_NOT_SIGNED
    http_status: 422
    applies_to: "POST /work-parties/{id}/shifts, POST /adoption-agreements/{id}/submit, POST /shifts/{id}/certify"
  - priority: 14
    category: business_safety
    check: "The volunteer holds every certification listed in WorkParty.required_certifications, and when work_type == CHAINSAW and LandManager.requires_certified_sawyer is true the party retains at least one non-withdrawn shift whose volunteer holds CERT_SAWYER_B or CERT_SAWYER_C."
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /work-parties/{id}/shifts, POST /work-parties/{id}/confirm"
  - priority: 15
    category: business_safety
    check: "first_aid_capable_count >= ceil(registered_count / FIRST_AID_RATIO) and >= 1, counting only shifts in {REGISTERED, CHECKED_IN} whose volunteer holds CERT_FIRST_AID or CERT_WFA with first_aid_expires_on >= the logical clock date. FIRST_AID_RATIO = 8."
    error_id: ERR_FIRST_AID_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /work-parties/{id}/confirm, POST /work-parties/{id}/start"
  - priority: 16
    category: business_safety
    check: "On POST /work-parties/{id}/briefing: tool_checklist_complete is true and first_aid_kit_count >= 1 in the payload. On POST /work-parties/{id}/confirm and POST /work-parties/{id}/start: the party has a briefing on record, i.e. readiness_status is not PENDING."
    error_id: ERR_BRIEFING_INCOMPLETE
    http_status: 422
    applies_to: "POST /work-parties/{id}/briefing, POST /work-parties/{id}/confirm, POST /work-parties/{id}/start"
  - priority: 17
    category: business_safety
    check: "A MaterialOrder with category BRIDGE under a LandManager with requires_engineering_review == true carries a non-null engineering_review_ref."
    error_id: ERR_ENGINEERING_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /material-orders/{id}/submit"
  - priority: 18
    category: business_referential
    check: "The governing AdoptionAgreement.status == ACTIVE."
    error_id: ERR_ADOPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /work-plans/{id}/submit, POST /work-plans/{id}/review, POST /work-parties, POST /work-parties/{id}/confirm, POST /work-permits"
  - priority: 19
    category: business_referential
    check: "The governing WorkPlan.status == APPROVED."
    error_id: ERR_WORK_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /work-permits, POST /material-orders/{id}/submit, POST /material-orders/{id}/approve, POST /material-orders/{id}/receive"
  - priority: 20
    category: business_referential
    check: "When LandManager.permit_required is true, the party references a WorkPermit whose status == ISSUED and whose allowed_work_types contains the party's work_type."
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /work-parties/{id}/confirm"
  - priority: 21
    category: business_temporal
    check: "date(window_start_date) - date(logical clock) >= LandManager.permit_lead_days, counted in whole days. The comparison is inclusive: a gap of exactly permit_lead_days is accepted."
    error_id: ERR_PERMIT_LEAD_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /work-permits"
  - priority: 22
    category: business_temporal
    check: "Both the UTC date of WorkParty.start_at and the UTC date of WorkParty.end_at fall inside the inclusive [window_start_date, window_end_date] of the referenced permit."
    error_id: ERR_PERMIT_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /work-parties/{id}/confirm"
  - priority: 23
    category: business_temporal
    check: "SEGMENT INTERVAL SEMANTICS - half-open intervals with a 60-minute mandatory recovery buffer on the resource. The party under confirmation conflicts with any other WorkParty on the same trail_segment_id whose schedule_status is in {CONFIRMED, IN_PROGRESS} when BOTH `new.start_at < other.end_at + SEGMENT_BUFFER_MINUTES` AND `other.start_at < new.end_at + SEGMENT_BUFFER_MINUTES`. A gap of exactly 60 minutes is therefore permitted. SEGMENT_BUFFER_MINUTES = 60."
    error_id: ERR_SEGMENT_PARTY_OVERLAP
    http_status: 409
    applies_to: "POST /work-parties/{id}/confirm"
  - priority: 24
    category: business_temporal
    check: "VOLUNTEER INTERVAL SEMANTICS - closed intervals with ZERO buffer, so touching endpoints are allowed. The registration conflicts when the new party's [start_at, end_at] and an existing party's [start_at, end_at] satisfy BOTH `new.start_at < other.end_at` AND `other.start_at < new.end_at`, over that volunteer's shifts with status in {REGISTERED, CHECKED_IN, CHECKED_OUT} that belong to a DIFFERENT work_party_id (shifts on the party being registered for are excluded so that a repeat registration surfaces as ERR_DUPLICATE_REGISTRATION, not as a self-overlap). A new party starting at the exact instant an existing one ends is accepted."
    error_id: ERR_VOLUNTEER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /work-parties/{id}/shifts"
  - priority: 25
    category: business_temporal
    check: "A DEFERRED ConditionReport may only be resolved once the logical clock date >= defer_until_date."
    error_id: ERR_DEFER_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /condition-reports/{id}/resolve"
  - priority: 26
    category: business_constraint
    check: "AGGREGATE CAPACITY on the volunteer resource - the sum of scheduled durations (end_at - start_at) of that volunteer's shifts in {REGISTERED, CHECKED_IN, CHECKED_OUT} on OTHER work parties whose party start_at falls on the same UTC calendar day as the new party's start_at, plus the new party's own duration, must not exceed MAX_DAILY_SHIFT_HOURS = 10. The comparison is inclusive: exactly 10.0 hours is accepted."
    error_id: ERR_VOLUNTEER_DAILY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /work-parties/{id}/shifts"
  - priority: 27
    category: business_constraint
    check: "registered_count < roster_capacity, where roster_capacity = min(max_participants, WorkPermit.max_party_size) when an ISSUED permit is referenced and max_participants otherwise."
    error_id: ERR_ROSTER_FULL
    http_status: 409
    applies_to: "POST /work-parties/{id}/shifts"
  - priority: 28
    category: business_constraint
    check: "No existing VolunteerShift for the same (work_party_id, volunteer_id) with status not in {WITHDRAWN, NO_SHOW}."
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /work-parties/{id}/shifts"
  - priority: 29
    category: business_constraint
    check: "WorkParty.max_participants <= the referenced WorkPermit.max_party_size."
    error_id: ERR_PARTY_SIZE_EXCEEDS_PERMIT
    http_status: 422
    applies_to: "POST /work-parties/{id}/confirm"
  - priority: 30
    category: business_constraint
    check: "TrailSegment.adoption_status == UNADOPTED - no other AdoptionAgreement on the segment already holds status in {ACTIVE, SUSPENDED}."
    error_id: ERR_SEGMENT_ALREADY_ADOPTED
    http_status: 409
    applies_to: "POST /adoption-agreements/{id}/submit, POST /adoption-agreements/{id}/review, POST /adoption-agreements/{id}/activate"
  - priority: 31
    category: business_constraint
    check: "revision_round <= MAX_REVISION_ROUNDS (3) on the resubmit path of AdoptionAgreement and WorkPlan."
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /adoption-agreements/{id}/submit, POST /work-plans/{id}/submit"
  - priority: 32
    category: business_constraint
    check: "A DEFER disposition requires the REASSESSED priority_score < ESCALATION_THRESHOLD (70)."
    error_id: ERR_PRIORITY_TOO_HIGH_TO_DEFER
    http_status: 422
    applies_to: "POST /condition-reports/{id}/disposition"
  - priority: 33
    category: business_constraint
    check: "An ESCALATE disposition requires the REASSESSED priority_score >= ESCALATION_THRESHOLD (70)."
    error_id: ERR_PRIORITY_TOO_LOW_TO_ESCALATE
    http_status: 422
    applies_to: "POST /condition-reports/{id}/disposition"
  - priority: 34
    category: business_constraint
    check: "Resolving a SCHEDULED report requires its linked WorkParty.schedule_status == COMPLETED; resolving an ESCALATED report requires either the SafetyOfficer role or a linked MaterialOrder in {APPROVED, DELIVERED}."
    error_id: ERR_LINKED_PARTY_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /condition-reports/{id}/resolve"
  - priority: 35
    category: business_constraint
    check: "An ESCALATED report has no SafetyOfficer actor and no linked MaterialOrder in {APPROVED, DELIVERED}."
    error_id: ERR_ESCALATION_NOT_CLEARED
    http_status: 409
    applies_to: "POST /condition-reports/{id}/resolve"
  - priority: 36
    category: business_temporal
    check: "to_iso8601 is strictly greater than the current logical clock - the clock never runs backwards."
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 37
    category: business_fiscal
    check: "WorkPlan.budget_posture != OVER_COMMITTED at the moment of submission."
    error_id: ERR_PLAN_OVER_COMMITTED
    http_status: 409
    applies_to: "POST /material-orders/{id}/submit, POST /material-orders/{id}/approve"
  - priority: 38
    category: business_fiscal
    check: "committed_cents + spent_cents + the new order's total_cents <= round_half_up(approved_budget_cents * OVERCOMMIT_CAP_RATIO, 0). Inclusive at the cap."
    error_id: ERR_PLAN_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /material-orders"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table   (all paths are prefixed with /stewardship)
# ---------------------------------------------------------------------------
endpoints:

  # --- LandManager -----------------------------------------------------------
  - method: POST
    path: "/stewardship/land-managers"
    description: "Register an agency or landowner with its permit, party-size, wet-weather and engineering-review policy."
    roles: [StewardshipCoordinator]
    code: 201
    input: ["agency_name", "jurisdiction_code", "permit_required?", "permit_lead_days?", "max_party_size?", "wet_threshold_index?", "requires_engineering_review?", "requires_certified_sawyer?"]
    output: LandManager
    side_effects: ["policy_version initialised to 1", "adopted_segment_count initialised to 0"]
  - method: GET
    path: "/stewardship/land-managers/{id}"
    description: "Read one land manager, including adopted_segment_count."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: LandManager
    side_effects: []

  # --- VolunteerProfile ------------------------------------------------------
  - method: POST
    path: "/stewardship/volunteers"
    description: "Enrol a volunteer, recording waiver and certifications; skill_class is derived, never supplied."
    roles: [StewardshipCoordinator]
    code: 201
    input: ["full_name", "email", "waiver_signed_on?", "certifications?", "first_aid_expires_on?"]
    output: VolunteerProfile
    side_effects: ["waiver_expires_on computed as waiver_signed_on + 365 days", "skill_class derived from certifications", "all four hour buckets initialised to 0"]
  - method: GET
    path: "/stewardship/volunteers/{id}"
    description: "Read one volunteer, including the four hour buckets that INV_HOURS conserves."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: VolunteerProfile
    side_effects: []

  # --- TrailSegment ----------------------------------------------------------
  - method: POST
    path: "/stewardship/trail-segments"
    description: "Register a trail segment under a land manager, with its seasonal closure window."
    roles: [StewardshipCoordinator, LandManagerOfficer]
    code: 201
    input: ["land_manager_id", "name", "length_miles", "surface_class", "traffic_class?", "seasonal_closure_start_mmdd?", "seasonal_closure_end_mmdd?"]
    output: TrailSegment
    side_effects: ["posture computed immediately from the logical clock and the closure window"]
  - method: GET
    path: "/stewardship/trail-segments/{id}"
    description: "Read one trail segment, including posture, hazard_index and adoption_status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: TrailSegment
    side_effects: []
  - method: GET
    path: "/stewardship/trail-segments"
    description: "Paginated list of trail segments, filterable by land manager, posture and adoption status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["land_manager_id?", "posture?", "adoption_status?", "limit?", "offset?"]
    output: "TrailSegment[]"
    side_effects: []

  # --- AdoptionAgreement -----------------------------------------------------
  - method: POST
    path: "/stewardship/adoption-agreements"
    description: "Draft an adoption agreement binding a crew leader to a trail segment for a term."
    roles: [CrewLeader]
    code: 201
    input: ["trail_segment_id", "crew_leader_volunteer_id", "term_start_date", "term_end_date"]
    output: AdoptionAgreement
    side_effects: ["status initialised to DRAFT; revision_round initialised to 0"]
  - method: GET
    path: "/stewardship/adoption-agreements/{id}"
    description: "Read one adoption agreement."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: AdoptionAgreement
    side_effects: []
  - method: GET
    path: "/stewardship/adoption-agreements"
    description: "Paginated list of adoption agreements, filterable by segment, crew leader and status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["trail_segment_id?", "crew_leader_volunteer_id?", "status?", "limit?", "offset?"]
    output: "AdoptionAgreement[]"
    side_effects: []
  - method: POST
    path: "/stewardship/adoption-agreements/{id}/submit"
    description: "Submit a DRAFT or RETURNED agreement for coordinator review; the revision loop enters here."
    roles: [CrewLeader]
    code: 200
    input: []
    output: AdoptionAgreement
    side_effects: ["status -> SUBMITTED", "increments AdoptionAgreement.version by 1"]
  - method: POST
    path: "/stewardship/adoption-agreements/{id}/review"
    description: "Coordinator decision on a SUBMITTED agreement: APPROVE moves it forward, RETURN sends it back and advances revision_round."
    roles: [StewardshipCoordinator]
    code: 200
    input: ["decision", "reason?"]
    output: AdoptionAgreement
    side_effects: ["status -> APPROVED or RETURNED", "reviewed_by_user_id stored", "revision_round incremented on RETURN"]
  - method: POST
    path: "/stewardship/adoption-agreements/{id}/activate"
    description: "Land manager countersignature that makes the adoption ACTIVE and pins the policy version."
    roles: [LandManagerOfficer]
    code: 200
    input: []
    output: AdoptionAgreement
    side_effects: ["pinned_policy_version and activated_at stored", "TrailSegment.adoption_status -> ADOPTED", "LandManager.adopted_segment_count incremented"]
  - method: POST
    path: "/stewardship/adoption-agreements/{id}/terminate"
    description: "End an adoption; closes its approved plans and cancels its non-terminal work parties."
    roles: [StewardshipCoordinator, LandManagerOfficer]
    code: 200
    input: ["reason"]
    output: AdoptionAgreement
    side_effects: ["status -> TERMINATED", "TrailSegment.adoption_status -> UNADOPTED", "APPROVED WorkPlans -> CLOSED", "non-terminal WorkParties -> CANCELLED"]

  # --- WorkPlan --------------------------------------------------------------
  - method: POST
    path: "/stewardship/work-plans"
    description: "Draft a seasonal work plan with a requested materials budget under an active adoption."
    roles: [CrewLeader]
    code: 201
    input: ["adoption_agreement_id", "season_year", "requested_budget_cents"]
    output: WorkPlan
    side_effects: ["status initialised to DRAFT; all ledger fields initialised to 0"]
  - method: GET
    path: "/stewardship/work-plans/{id}"
    description: "Read one work plan, including the full budget ledger and the volunteer-hour totals."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: WorkPlan
    side_effects: []
  - method: GET
    path: "/stewardship/work-plans"
    description: "Paginated list of work plans, filterable by adoption agreement, status and budget posture."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["adoption_agreement_id?", "status?", "budget_posture?", "limit?", "offset?"]
    output: "WorkPlan[]"
    side_effects: []
  - method: POST
    path: "/stewardship/work-plans/{id}/submit"
    description: "Submit a DRAFT work plan for review; the revision loop re-enters here."
    roles: [CrewLeader]
    code: 200
    input: []
    output: WorkPlan
    side_effects: ["status -> SUBMITTED", "increments WorkPlan.version by 1"]
  - method: POST
    path: "/stewardship/work-plans/{id}/review"
    description: "Coordinator decision on a SUBMITTED plan: APPROVE stamps approved_budget_cents and runs the ledger; REQUEST_REVISION advances revision_round and returns the plan to DRAFT."
    roles: [StewardshipCoordinator]
    code: 200
    input: ["decision", "approved_budget_cents?", "reason?"]
    output: WorkPlan
    side_effects: ["status -> APPROVED or DRAFT", "approved_budget_cents stored on APPROVE", "work_plan_budget_ledger recomputed"]
  - method: GET
    path: "/stewardship/work-plans/{id}/grant-match"
    description: "Computed read returning the grant-match figure for the plan under one of the two variants (PROVISIONAL or CERTIFIED)."
    roles: [StewardshipCoordinator, GrantsAdministrator]
    code: 200
    input: ["variant"]
    output: { variant: string, included_shift_count: integer, total_credited_hours: number, labor_match_usd: number, material_match_usd: number, grant_match_total_usd: number, average_rate_usd: number }
    side_effects: []

  # --- ConditionReport -------------------------------------------------------
  - method: POST
    path: "/stewardship/condition-reports"
    description: "File a trail condition report against a segment."
    roles: [Volunteer, CrewLeader]
    code: 201
    input: ["trail_segment_id", "reported_by_volunteer_id", "hazard_type", "severity_class", "description"]
    output: ConditionReport
    side_effects: ["status initialised to SUBMITTED; priority_score initialised to 0"]
  - method: GET
    path: "/stewardship/condition-reports/{id}"
    description: "Read one condition report, including priority_score and the variant that produced it."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: ConditionReport
    side_effects: []
  - method: GET
    path: "/stewardship/condition-reports"
    description: "Paginated list of condition reports, filterable by segment, reporter, linked work party and status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["trail_segment_id?", "reported_by_volunteer_id?", "linked_work_party_id?", "status?", "limit?", "offset?"]
    output: "ConditionReport[]"
    side_effects: []
  - method: POST
    path: "/stewardship/condition-reports/{id}/triage"
    description: "Coordinator triage: assign exposure, optionally override severity, and score the report with the INITIAL_TRIAGE variant."
    roles: [StewardshipCoordinator]
    code: 200
    input: ["exposure_class", "severity_override?"]
    output: ConditionReport
    side_effects: ["priority_score and priority_variant stored", "traffic_class_snapshot copied", "TrailSegment.hazard_index and posture recomputed"]
  - method: POST
    path: "/stewardship/condition-reports/{id}/disposition"
    description: "Coordinator disposition of a TRIAGED report: SCHEDULE onto a work party, DEFER to a date, or ESCALATE. Re-scores the report with the REASSESSED variant before applying the gate."
    roles: [StewardshipCoordinator]
    code: 200
    input: ["disposition", "linked_work_party_id?", "defer_until_date?"]
    output: ConditionReport
    side_effects: ["priority_score recomputed with variant REASSESSED", "status -> SCHEDULED, DEFERRED or ESCALATED", "TrailSegment.hazard_index, escalated_hazard_count and posture recomputed"]
  - method: POST
    path: "/stewardship/condition-reports/{id}/resolve"
    description: "Close out a dispositioned report; each inbound branch enforces its own precondition set."
    roles: [StewardshipCoordinator, SafetyOfficer]
    code: 200
    input: ["resolution_note?"]
    output: ConditionReport
    side_effects: ["status -> RESOLVED; resolved_at stored", "branch-specific counters decremented", "TrailSegment.hazard_index and posture recomputed"]
  - method: POST
    path: "/stewardship/condition-reports/{id}/void"
    description: "Discard a SUBMITTED or TRIAGED report as invalid."
    roles: [StewardshipCoordinator]
    code: 200
    input: ["reason"]
    output: ConditionReport
    side_effects: ["status -> VOIDED", "TrailSegment.hazard_index and posture recomputed"]

  # --- WorkPermit ------------------------------------------------------------
  - method: POST
    path: "/stewardship/work-permits"
    description: "Request land-manager permission for a dated work window on a segment. Enforces the agency lead-time rule."
    roles: [CrewLeader]
    code: 201
    input: ["work_plan_id", "trail_segment_id", "window_start_date", "window_end_date", "requested_work_types"]
    output: WorkPermit
    side_effects: ["land_manager_id copied from the segment", "status initialised to REQUESTED"]
  - method: GET
    path: "/stewardship/work-permits/{id}"
    description: "Read one work permit."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: WorkPermit
    side_effects: []
  - method: GET
    path: "/stewardship/work-permits"
    description: "Paginated list of work permits, filterable by plan, segment, land manager and status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["work_plan_id?", "trail_segment_id?", "land_manager_id?", "status?", "limit?", "offset?"]
    output: "WorkPermit[]"
    side_effects: []
  - method: POST
    path: "/stewardship/work-permits/{id}/decision"
    description: "Land manager decision on a REQUESTED permit: ISSUE stamps allowed_work_types and max_party_size; DENY records a reason and blocks referencing parties."
    roles: [LandManagerOfficer]
    code: 200
    input: ["decision", "allowed_work_types?", "max_party_size?", "denial_reason?"]
    output: WorkPermit
    side_effects: ["status -> ISSUED or DENIED", "referencing WorkParties re-evaluate the readiness axis"]
  - method: POST
    path: "/stewardship/work-permits/{id}/revoke"
    description: "Withdraw an ISSUED permit; blocks and suspends every referencing non-terminal work party."
    roles: [LandManagerOfficer]
    code: 200
    input: ["revocation_reason"]
    output: WorkPermit
    side_effects: ["status -> REVOKED", "referencing WorkParties -> readiness BLOCKED with block_reason PERMIT_REVOKED; CONFIRMED ones also -> SUSPENDED"]

  # --- WorkParty -------------------------------------------------------------
  - method: POST
    path: "/stewardship/work-parties"
    description: "Schedule a work party on a segment under an approved plan. Both state axes start at PLANNED / PENDING."
    roles: [CrewLeader]
    code: 201
    input: ["work_plan_id", "trail_segment_id", "start_at", "end_at", "work_type", "max_participants", "work_permit_id?", "travel_allowance_minutes?", "required_certifications?"]
    output: WorkParty
    side_effects: ["schedule_status initialised to PLANNED; readiness_status initialised to PENDING", "roster_capacity computed"]
  - method: GET
    path: "/stewardship/work-parties/{id}"
    description: "Read one work party, including both state axes and every roster counter."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: WorkParty
    side_effects: []
  - method: GET
    path: "/stewardship/work-parties"
    description: "Paginated list of work parties, filterable by plan, segment, permit and either state axis."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["work_plan_id?", "trail_segment_id?", "work_permit_id?", "schedule_status?", "readiness_status?", "limit?", "offset?"]
    output: "WorkParty[]"
    side_effects: []
  - method: POST
    path: "/stewardship/work-parties/{id}/briefing"
    description: "Record the tool and safety briefing. Advances the readiness axis only; schedule_status is untouched."
    roles: [CrewLeader]
    code: 200
    input: ["tool_checklist_complete", "first_aid_kit_count"]
    output: WorkParty
    side_effects: ["readiness_status -> BRIEFED, then straight to CLEARED when the clearance predicate holds", "block_reason cleared when re-briefing out of BLOCKED"]
  - method: POST
    path: "/stewardship/work-parties/{id}/confirm"
    description: "Confirm the schedule axis. Reads the readiness axis, the segment posture, the permit window and both interval-overlap rules."
    roles: [CrewLeader]
    code: 200
    input: []
    output: WorkParty
    side_effects: ["schedule_status -> CONFIRMED", "increments WorkParty.version by 1"]
  - method: POST
    path: "/stewardship/work-parties/{id}/start"
    description: "Open the party on the ground once the logical clock has reached start_at."
    roles: [CrewLeader]
    code: 200
    input: []
    output: WorkParty
    side_effects: ["schedule_status -> IN_PROGRESS"]
  - method: POST
    path: "/stewardship/work-parties/{id}/complete"
    description: "Close the party: auto-checks-out everyone still on site, marks no-shows, and consumes the permit."
    roles: [CrewLeader]
    code: 200
    input: []
    output: WorkParty
    side_effects: ["schedule_status -> COMPLETED", "CHECKED_IN shifts auto-checked-out and credited", "REGISTERED shifts -> NO_SHOW", "WorkPermit.consumed_party_count incremented and permit possibly -> CONSUMED"]
  - method: POST
    path: "/stewardship/work-parties/{id}/cancel"
    description: "Cancel a non-terminal party; withdraws its registered shifts and unschedules its linked condition reports."
    roles: [CrewLeader, StewardshipCoordinator]
    code: 200
    input: ["reason"]
    output: WorkParty
    side_effects: ["schedule_status -> CANCELLED", "REGISTERED shifts -> WITHDRAWN", "SCHEDULED linked reports -> TRIAGED"]

  # --- VolunteerShift --------------------------------------------------------
  - method: POST
    path: "/stewardship/work-parties/{id}/shifts"
    description: "Register a volunteer onto a work party's roster. Guarded by optimistic concurrency on the party's version."
    roles: [Volunteer, CrewLeader]
    code: 201
    input: ["volunteer_id", "expected_work_party_version", "role_on_crew?"]
    output: VolunteerShift
    side_effects: ["status initialised to REGISTERED", "increments WorkParty.version by 1", "WorkParty.registered_count and first_aid_capable_count recomputed", "VolunteerProfile.active_registration_count incremented"]
  - method: GET
    path: "/stewardship/shifts/{id}"
    description: "Read one volunteer shift, including credited_hours and both audit user ids."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []
  - method: GET
    path: "/stewardship/shifts"
    description: "Paginated list of volunteer shifts, filterable by work party, volunteer and status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["work_party_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: "VolunteerShift[]"
    side_effects: []
  - method: POST
    path: "/stewardship/shifts/{id}/check-in"
    description: "Check a registered volunteer in at the logical clock."
    roles: [Volunteer, CrewLeader]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["status -> CHECKED_IN; checked_in_at stored", "WorkParty.checked_in_count incremented"]
  - method: POST
    path: "/stewardship/shifts/{id}/check-out"
    description: "Check a volunteer out and run shift_credited_hours."
    roles: [CrewLeader]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["status -> CHECKED_OUT; worked_minutes, billable_minutes, credited_hours and skill_class_snapshot stored", "VolunteerProfile.lifetime_credited_hours and pending_hours increased"]
  - method: POST
    path: "/stewardship/shifts/{id}/withdraw"
    description: "Withdraw a registration before the party completes."
    roles: [Volunteer, CrewLeader]
    code: 200
    input: ["reason?"]
    output: VolunteerShift
    side_effects: ["status -> WITHDRAWN", "WorkParty.registered_count and VolunteerProfile.active_registration_count decremented"]
  - method: POST
    path: "/stewardship/shifts/{id}/hours-review"
    description: "Coordinator hour review: VERIFY accepts the credited hours, DISPUTE substitutes adjusted_hours, RESET recomputes from scratch and is the compensating action for DISPUTE."
    roles: [StewardshipCoordinator]
    code: 200
    input: ["decision", "adjusted_hours?", "dispute_reason?"]
    output: VolunteerShift
    side_effects: ["status -> HOURS_VERIFIED, HOURS_DISPUTED or CHECKED_OUT", "volunteer hour buckets moved so that INV_HOURS holds", "WorkPlan.verified_volunteer_hours updated on VERIFY"]
  - method: POST
    path: "/stewardship/shifts/{id}/certify"
    description: "Grants administrator certification of verified hours for grant match. Enforces segregation of duties against the verifier."
    roles: [GrantsAdministrator]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["status -> HOURS_CERTIFIED; hours_certified_by_user_id stored", "volunteer verified_hours -> certified_hours", "WorkPlan.certified_volunteer_hours increased"]

  # --- MaterialOrder ---------------------------------------------------------
  - method: POST
    path: "/stewardship/material-orders"
    description: "Raise a materials requisition against a work plan. Prices the order with material_order_total_cents and commits it against the plan ledger immediately. Guarded by optimistic concurrency on the plan's version."
    roles: [CrewLeader]
    code: 201
    input: ["work_plan_id", "category", "lines", "expected_work_plan_version", "condition_report_id?", "engineering_review_ref?"]
    output: MaterialOrder
    side_effects: ["all six pricing fields and total_cents computed", "WorkPlan.committed_cents increased by total_cents; available_cents and budget_posture recomputed", "increments WorkPlan.version by 1", "when budget_posture becomes OVER_COMMITTED the parent AdoptionAgreement suspends and its work parties suspend"]
  - method: GET
    path: "/stewardship/material-orders/{id}"
    description: "Read one material order, including every intermediate pricing field."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []
  - method: GET
    path: "/stewardship/material-orders"
    description: "Paginated list of material orders, filterable by work plan, source condition report and status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["work_plan_id?", "condition_report_id?", "status?", "limit?", "offset?"]
    output: "MaterialOrder[]"
    side_effects: []
  - method: POST
    path: "/stewardship/material-orders/{id}/submit"
    description: "Send a DRAFT requisition to the coordinator. Engineering review is checked before the plan link, which is checked before the budget posture."
    roles: [CrewLeader]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/stewardship/material-orders/{id}/approve"
    description: "Coordinator approval of a submitted requisition."
    roles: [StewardshipCoordinator]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> APPROVED; approved_by_user_id stored"]
  - method: POST
    path: "/stewardship/material-orders/{id}/receive"
    description: "Record delivery; moves the money from committed to spent."
    roles: [CrewLeader]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> DELIVERED; delivered_at stored", "WorkPlan.committed_cents -> spent_cents; available_cents and budget_posture recomputed", "increments WorkPlan.version by 1"]
  - method: POST
    path: "/stewardship/material-orders/{id}/cancel"
    description: "Cancel a non-delivered requisition. This is the compensating action for creation: it releases exactly total_cents back to the plan and unwinds the whole suspension cascade."
    roles: [CrewLeader, StewardshipCoordinator]
    code: 200
    input: ["reason"]
    output: MaterialOrder
    side_effects: ["status -> CANCELLED", "WorkPlan.committed_cents decreased by total_cents; available_cents and budget_posture recomputed (INV_BUDGET restored)", "AdoptionAgreement leaves SUSPENDED when budget_posture leaves OVER_COMMITTED", "its SUSPENDED work parties return to CONFIRMED", "increments WorkPlan.version by 1"]

  # --- IncidentReport --------------------------------------------------------
  - method: POST
    path: "/stewardship/incidents"
    description: "File an incident against a work party. A SEVERE incident closes the segment and cascades four levels down."
    roles: [Volunteer, CrewLeader]
    code: 201
    input: ["work_party_id", "severity_class", "first_aid_rendered", "narrative", "occurred_at", "injured_volunteer_id?"]
    output: IncidentReport
    side_effects: ["trail_segment_id copied from the party; reported_by_user_id stored", "on SEVERE: TrailSegment.open_severe_incident_count incremented, posture -> INCIDENT_CLOSED, agreement -> SUSPENDED, its work parties -> SUSPENDED/BLOCKED, their REGISTERED shifts -> WITHDRAWN"]
  - method: GET
    path: "/stewardship/incidents/{id}"
    description: "Read one incident report."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/stewardship/incidents"
    description: "Paginated list of incident reports, filterable by work party, segment, injured volunteer and status."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["work_party_id?", "trail_segment_id?", "injured_volunteer_id?", "status?", "limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []
  - method: POST
    path: "/stewardship/incidents/{id}/review"
    description: "Safety officer opens formal review of a MODERATE or SEVERE incident."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/stewardship/incidents/{id}/close"
    description: "Close an incident with a corrective action. Segregation of duties: the closer must not be the reporter. Closing the last SEVERE incident reopens the segment and unwinds the suspension cascade."
    roles: [SafetyOfficer]
    code: 200
    input: ["corrective_action"]
    output: IncidentReport
    side_effects: ["status -> CLOSED; closed_by_user_id, corrective_action and closed_at stored", "TrailSegment.open_severe_incident_count recomputed and posture recomputed", "SUSPENDED agreements with reason SEGMENT_INCIDENT -> ACTIVE and their parties -> CONFIRMED"]

  # --- Test-driving endpoints (outside the public business surface) -----------
  - method: POST
    path: "/stewardship/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-08-01T00:00:00Z on server startup and MUST NOT fall back to real wall-clock time. Advancing the clock expires permits past their window, re-evaluates every seasonal closure and wet-observation freshness horizon, and recomputes every segment posture."
    roles: [Volunteer, CrewLeader, StewardshipCoordinator, LandManagerOfficer, SafetyOfficer, GrantsAdministrator]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, segments_recomputed: integer, permits_expired: integer, parties_blocked: integer }
    side_effects: ["ISSUED permits past window_end_date -> EXPIRED", "segment postures recomputed in created_at ASC order", "affected work parties -> readiness BLOCKED"]
  - method: POST
    path: "/stewardship/_weather/observations"
    description: "Record a soil-moisture observation for a segment, driving the wet-weather policy. Returns the segment with its recomputed posture."
    roles: [StewardshipCoordinator, LandManagerOfficer]
    code: 200
    input: ["trail_segment_id", "soil_moisture_index", "observed_at"]
    output: TrailSegment
    side_effects: ["latest_soil_moisture_index and latest_moisture_observed_at stored", "posture recomputed against LandManager.wet_threshold_index", "affected work parties -> readiness BLOCKED with block_reason SEGMENT_CLOSED"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own - wrong volunteer id on a shift, wrong crew leader on an agreement, wrong land manager on a permit."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The certifier equals the verifier on a shift, or the incident closer equals the incident reporter."
  - id: ERR_LAND_MANAGER_NOT_FOUND
    http: 404
    condition: "land_manager_id in a path or body does not resolve."
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "A volunteer id in a path or body (crew_leader_volunteer_id, reported_by_volunteer_id, volunteer_id, injured_volunteer_id) does not resolve."
  - id: ERR_TRAIL_SEGMENT_NOT_FOUND
    http: 404
    condition: "trail_segment_id in a path or body does not resolve."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "adoption_agreement_id in a path or body does not resolve."
  - id: ERR_WORK_PLAN_NOT_FOUND
    http: 404
    condition: "work_plan_id in a path or body does not resolve."
  - id: ERR_CONDITION_REPORT_NOT_FOUND
    http: 404
    condition: "A condition report id in a path or body does not resolve."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "work_permit_id in a path or body does not resolve."
  - id: ERR_WORK_PARTY_NOT_FOUND
    http: 404
    condition: "A work party id in a path or body (including linked_work_party_id) does not resolve."
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "A shift id in a path does not resolve."
  - id: ERR_MATERIAL_ORDER_NOT_FOUND
    http: 404
    condition: "A material order id in a path does not resolve."
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "An incident id in a path does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, undeclared enum member, out-of-range number, empty lines array, malformed date or datetime, pagination limit outside 1..100 or negative offset."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state, including any attempt to move a resource out of a terminal state."
  - id: ERR_STALE_WORK_PARTY_VERSION
    http: 412
    condition: "expected_work_party_version does not equal the current WorkParty.version on registration."
  - id: ERR_STALE_WORK_PLAN_VERSION
    http: 412
    condition: "expected_work_plan_version does not equal the current WorkPlan.version on material order creation."
  - id: ERR_SEGMENT_CLOSED
    http: 409
    condition: "The trail segment's posture is SEASONAL_CLOSED or INCIDENT_CLOSED and the operation would put people on the ground."
  - id: ERR_WET_WEATHER_RESTRICTED
    http: 409
    condition: "Posture is WET_RESTRICTED and work_type is not SIGNAGE or DRY_WORK, or posture is HAZARD_RESTRICTED and work_type is CHAINSAW."
  - id: ERR_WAIVER_NOT_SIGNED
    http: 422
    condition: "The volunteer's waiver_signed_on is null, or waiver_expires_on is earlier than the date the rule requires."
  - id: ERR_CERTIFICATION_MISSING
    http: 422
    condition: "The volunteer lacks a certification the party requires, or a CHAINSAW party under a sawyer-requiring manager retains no certified sawyer."
  - id: ERR_FIRST_AID_COVERAGE_INSUFFICIENT
    http: 422
    condition: "first_aid_capable_count is below ceil(registered_count / 8) or below 1."
  - id: ERR_BRIEFING_INCOMPLETE
    http: 422
    condition: "tool_checklist_complete is false or first_aid_kit_count is 0 in the briefing payload, or a confirm/start is attempted while readiness_status is still PENDING."
  - id: ERR_ENGINEERING_REVIEW_REQUIRED
    http: 422
    condition: "A BRIDGE material order under a manager with requires_engineering_review is submitted with a null engineering_review_ref."
  - id: ERR_ADOPTION_NOT_ACTIVE
    http: 409
    condition: "The governing adoption agreement is not ACTIVE."
  - id: ERR_WORK_PLAN_NOT_APPROVED
    http: 409
    condition: "The governing work plan is not APPROVED."
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "A permit is required but the party references none, or the referenced permit is not ISSUED, or its allowed_work_types does not cover the party's work_type."
  - id: ERR_PERMIT_LEAD_TIME_INSUFFICIENT
    http: 422
    condition: "Fewer than LandManager.permit_lead_days whole days separate the logical clock date from window_start_date."
  - id: ERR_PERMIT_WINDOW_MISMATCH
    http: 422
    condition: "The party's start_at date or end_at date falls outside the permit's inclusive window."
  - id: ERR_SEGMENT_PARTY_OVERLAP
    http: 409
    condition: "Confirming the party would place it within 60 minutes of another CONFIRMED or IN_PROGRESS party on the same segment."
  - id: ERR_VOLUNTEER_DOUBLE_BOOKED
    http: 409
    condition: "The volunteer already holds a live shift on a different work party whose interval strictly overlaps the new party's interval."
  - id: ERR_VOLUNTEER_DAILY_HOURS_EXCEEDED
    http: 422
    condition: "The volunteer's total scheduled party hours on the new party's UTC calendar day would exceed 10.0."
  - id: ERR_ROSTER_FULL
    http: 409
    condition: "registered_count has already reached roster_capacity."
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "The volunteer already holds a non-WITHDRAWN, non-NO_SHOW shift on this party."
  - id: ERR_PARTY_SIZE_EXCEEDS_PERMIT
    http: 422
    condition: "WorkParty.max_participants is greater than the referenced permit's max_party_size."
  - id: ERR_SEGMENT_ALREADY_ADOPTED
    http: 409
    condition: "Another adoption agreement on the same segment already holds status ACTIVE or SUSPENDED."
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "An agreement or plan is resubmitted while revision_round already exceeds MAX_REVISION_ROUNDS (3) - that is, after a fourth return."
  - id: ERR_PRIORITY_TOO_HIGH_TO_DEFER
    http: 422
    condition: "A DEFER disposition is requested while the REASSESSED priority_score is at or above 70."
  - id: ERR_PRIORITY_TOO_LOW_TO_ESCALATE
    http: 422
    condition: "An ESCALATE disposition is requested while the REASSESSED priority_score is below 70."
  - id: ERR_DEFER_DATE_NOT_REACHED
    http: 409
    condition: "A DEFERRED report is resolved before the logical clock reaches defer_until_date."
  - id: ERR_LINKED_PARTY_NOT_COMPLETE
    http: 409
    condition: "A SCHEDULED report is resolved while its linked work party has not reached COMPLETED."
  - id: ERR_ESCALATION_NOT_CLEARED
    http: 409
    condition: "An ESCALATED report is resolved by a StewardshipCoordinator with no linked material order in APPROVED or DELIVERED."
  - id: ERR_PLAN_OVER_COMMITTED
    http: 409
    condition: "A material order is submitted or approved while the plan's budget_posture is OVER_COMMITTED."
  - id: ERR_PLAN_BUDGET_EXCEEDED
    http: 422
    condition: "A new material order would push committed + spent above 120 percent of approved_budget_cents."
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "A clock set requests a timestamp at or before the current logical clock."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Volunteer
    description: "A trail volunteer: files condition reports and incidents, registers for work parties, checks in, and withdraws."
    identity: "entity_backed:VolunteerProfile"
    exclusive_operations: []
    shared_operations:
      - "POST /condition-reports (with CrewLeader)"
      - "POST /work-parties/{id}/shifts (with CrewLeader)"
      - "POST /shifts/{id}/check-in (with CrewLeader; own shift only)"
      - "POST /shifts/{id}/withdraw (with CrewLeader; own shift only)"
      - "POST /incidents (with CrewLeader)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
  - name: CrewLeader
    description: "The volunteer who signs an adoption agreement and runs work parties on the ground: plans, permits, briefs, confirms, starts, completes, checks people out, and raises material requisitions."
    identity: "entity_backed:VolunteerProfile"
    exclusive_operations:
      - "POST /adoption-agreements"
      - "POST /adoption-agreements/{id}/submit"
      - "POST /work-plans"
      - "POST /work-plans/{id}/submit"
      - "POST /work-permits"
      - "POST /work-parties"
      - "POST /work-parties/{id}/briefing"
      - "POST /work-parties/{id}/confirm"
      - "POST /work-parties/{id}/start"
      - "POST /work-parties/{id}/complete"
      - "POST /shifts/{id}/check-out"
      - "POST /material-orders"
      - "POST /material-orders/{id}/receive"
    shared_operations:
      - "POST /condition-reports (with Volunteer)"
      - "POST /work-parties/{id}/shifts (with Volunteer)"
      - "POST /shifts/{id}/check-in, POST /shifts/{id}/withdraw (with Volunteer)"
      - "POST /work-parties/{id}/cancel (with StewardshipCoordinator)"
      - "POST /material-orders/{id}/cancel (with StewardshipCoordinator)"
      - "POST /incidents (with Volunteer)"
      - "every GET read endpoint except GET /work-plans/{id}/grant-match"
      - "POST /_clock/set_current_utc"
  - name: StewardshipCoordinator
    description: "Stewardship-organisation staff: reviews adoptions and plans, triages and disposes of condition reports, approves requisitions, and verifies volunteer hours."
    identity: "opaque"
    exclusive_operations:
      - "POST /land-managers"
      - "POST /volunteers"
      - "POST /adoption-agreements/{id}/review"
      - "POST /work-plans/{id}/review"
      - "POST /condition-reports/{id}/triage"
      - "POST /condition-reports/{id}/disposition"
      - "POST /condition-reports/{id}/void"
      - "POST /material-orders/{id}/approve"
      - "POST /shifts/{id}/hours-review"
    shared_operations:
      - "POST /trail-segments (with LandManagerOfficer)"
      - "POST /adoption-agreements/{id}/terminate (with LandManagerOfficer)"
      - "POST /condition-reports/{id}/resolve (with SafetyOfficer)"
      - "POST /work-parties/{id}/cancel (with CrewLeader)"
      - "POST /material-orders/{id}/cancel (with CrewLeader)"
      - "GET /work-plans/{id}/grant-match (with GrantsAdministrator)"
      - "POST /_weather/observations (with LandManagerOfficer)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
  - name: LandManagerOfficer
    description: "An officer of the agency that owns the land: issues, denies and revokes work permits, countersigns adoptions, and records weather observations."
    identity: "entity_backed:LandManager"
    exclusive_operations:
      - "POST /adoption-agreements/{id}/activate"
      - "POST /work-permits/{id}/decision"
      - "POST /work-permits/{id}/revoke"
    shared_operations:
      - "POST /trail-segments (with StewardshipCoordinator)"
      - "POST /adoption-agreements/{id}/terminate (with StewardshipCoordinator)"
      - "POST /_weather/observations (with StewardshipCoordinator)"
      - "every GET read endpoint except GET /work-plans/{id}/grant-match"
      - "POST /_clock/set_current_utc"
  - name: SafetyOfficer
    description: "Independent safety reviewer: opens and closes incident reviews and clears escalated hazards."
    identity: "opaque"
    exclusive_operations:
      - "POST /incidents/{id}/review"
      - "POST /incidents/{id}/close"
    shared_operations:
      - "POST /condition-reports/{id}/resolve (with StewardshipCoordinator)"
      - "every GET read endpoint except GET /work-plans/{id}/grant-match"
      - "POST /_clock/set_current_utc"
  - name: GrantsAdministrator
    description: "Grant-reporting staff: certifies verified hours for match and reads the grant-match figures. Cannot verify the hours it certifies."
    identity: "opaque"
    exclusive_operations:
      - "POST /shifts/{id}/certify"
    shared_operations:
      - "GET /work-plans/{id}/grant-match (with StewardshipCoordinator)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
