        claim_type: immediate
        grounds:
          - state_machines.PartOrder.transitions.DRAFT_to_ALLOCATED
          - calculations.order_totals
          - calculations.servicer_credit_exposure
          - entities.InventoryRecord.fields.available_units
        distinguishing_aspect: "The allocate response body itself — not a later re-read — already shows fulfillment_status ALLOCATED with freight_cents 0 and total_cents 31197, and an immediately following inventory read shows reserved_units 3 / available_units 7 with credit_used_cents 31197."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true; Part P1 MECHANICAL 12999 (unit 10399)."
