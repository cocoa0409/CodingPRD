      - name: payment_application_reject_resubmit_cycle
        grounds:
          - state_machines.PaymentApplication.SUBMITTED_to_REJECTED
          - state_machines.PaymentApplication.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on PaymentApplication (different entity than the Submittal
          instance): SUBMITTED -> REJECTED -> SUBMITTED -> CERTIFIED; the cycle
          increments revision_number, and certification after the loop yields
          certified_current_due_cents 1800000 on 2000000 of work at 10% retainage.
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project (SOV A=6000000/B=4000000) with REPORT_ISSUED verification visit V1 (2026-08-20, performer user-arch-2)."
            - "Application created then REJECTED with reason 'arithmetic error'."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj P", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 2000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
            - call: "POST /ca/payment-applications/${app_id}/reject"
              payload: { reason: "arithmetic error" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          trigger:
            - call: "POST /ca/payment-applications/${app_id}/resubmit"
              payload: { period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 2000000, stored_materials_cents: 0 }] }
