              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1 }
              as: BallotCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /elections/00000000-0000-0000-0000-0000000000ff/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /elections/00000000-0000-0000-0000-0000000000ff/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { e3: $.data.error_id }
            - call: "POST /elections/00000000-0000-0000-0000-0000000000ff/tabulator-units"
