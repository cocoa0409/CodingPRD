            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "WebDirect", channel_type: "DIRECT", allocation_priority: 5, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 100 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 20, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/assemblers", payload: { name: "ASM-Q", service_regions: ["NW"] }, as: PlannerAdmin, captures: { asm_id: "$.data.id" } }
            - { call: "POST /grillops/assemblers/${asm_id}/status", payload: { action: "CERTIFY" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-A" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s1: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s1}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j1: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs/${j1}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T10:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j1}/transition", payload: { action: "NO_SHOW" }, as: ServiceAgent }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-B" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s2: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s2}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j2: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-06-21T09:00:00Z", window_end: "2026-06-21T10:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "NO_SHOW" }, as: ServiceAgent }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-C" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s3: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s3}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j3: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs/${j3}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-06-22T09:00:00Z", window_end: "2026-06-22T10:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j3}/transition", payload: { action: "START" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "POST /grillops/assembly-jobs/${j3}/transition", payload: { action: "COMPLETE" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-D" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s4: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s4}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j4: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs/${j4}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-06-23T09:00:00Z", window_end: "2026-06-23T10:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j4}/transition", payload: { action: "START" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "POST /grillops/assembly-jobs/${j4}/transition", payload: { action: "COMPLETE" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-E" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { s5: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${s5}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j5: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs/${j5}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-06-24T09:00:00Z", window_end: "2026-06-24T10:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j5}/transition", payload: { action: "START" }, as: Assembler, as_user_id: "${asm_id}" }
            - { call: "POST /grillops/assembly-jobs/${j5}/transition", payload: { action: "COMPLETE" }, as: Assembler, as_user_id: "${asm_id}" }
          trigger:
            - { call: "GET /grillops/assemblers/${asm_id}", as: PlannerAdmin, captures: { off_q: "$.data.official_quality_bp", prov_q: "$.data.provisional_quality_bp" } }
          assert:
            - "captured off_q == 7600 (10000 - 1200 * 2 lifetime no-shows)"
            - "captured prov_q == 8875 (10000 - 1200 * 1 recent no-show + 25 * 3 recent completions; the 2026-03-01 no-show is 111 days old, outside the 90-day window)"
            - "Assembler.${asm_id}.no_show_count == 2 and jobs_completed == 3"
            - "off_q != prov_q on identical event history"
  - rule_id: combinatorial_formula
    instances:
      - name: clearance_price_tier_coverage_subsidy_composition
        grounds:
          - calculations.calc_clearance_price
          - entities.Sale.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs and non-linear interaction:
          week-index tier selection (week 5 -> 50%), a coverage-ratio branch
          (7000bp >= COVERAGE_HIGH_BP -> +10), a MAX_MARKDOWN_PCT cap, and a
          channel subsidy multiplier compose to exactly 32000 on a 100000-cent
          base; changing any single input changes the answer non-linearly.
        test_recipe:
          setup:
            - "Season 2026 with lot of 10 GX-100 (base 100000); HOME_CENTER BigBox (subsidy 2000bp) holds an ACCEPTED allocation of 3 and has consumed 2 (consumption 6666bp >= 5000bp, so the clearance waterfall keeps it)"
            - "clock advanced to 2026-09-06 — 36 days after clearance_start 2026-08-01, i.e. week 5 of clearance; season advanced to CLEARANCE; lot availability 7 of 10 (coverage 7000bp, overstock)"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 3, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-1" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-2" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "CLEARANCE" }, as: PlannerAdmin }
          trigger:
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-3" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { px: "$.data.unit_price_cents" } }
          assert:
            - "captured px == 32000 (week 5 -> TIER3 50%; coverage 7000bp -> +OVERSTOCK_EXTRA_PCT 10; markdown 60 <= MAX 70; 100000 x 0.40 = 40000; 40000 x 0.80 = 32000)"
            - "the third sale prices at 32000 while the two in-season sales of the same model priced at 100000 (variant selection by season posture)"

      - name: assembly_fee_per_component_rounding_order
        grounds:
          - calculations.calc_assembly_fee
          - entities.AssemblyJob.fields.fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the 10% specialty
          subsidy is applied per component with round_half_up (7199.1->7199,
          4504.5->4505, 670.5->671) and the rounded components summed to 12375;
          summing first and rounding once yields 12374 — the scaffold pins
          per-component rounding and this test would fail under the other order.
        test_recipe:
          setup:
            - "Season 2026 IN_SEASON; SPECIALTY_DEALER PatioShop (subsidy 1000bp) with ACCEPTED allocation of 5 GX-200 units"
            - "One REGISTERED sale exists to hang the job on"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 800 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-200", model_family: "GX", model_year: 2026, base_price_cents: 80000, demand_share_bp: 3000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "PatioShop", channel_type: "SPECIALTY_DEALER", allocation_priority: 8, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 20 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-S1" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${sale_id}", job_type: "IN_HOME", distance_mi: 20 }, as: ServiceAgent, captures: { fee: "$.data.fee_cents" } }
          assert:
            - "captured fee == 12375 (round_half_up(7999x0.9)=7199 + round_half_up(5005x0.9)=4505 + round_half_up((20-15)x149x0.9)=671)"
            - "sum-then-round would produce 12374 ((7999+5005+745)x0.9=12374.1) and MUST NOT be the observed value"

      - name: clearance_waterfall_snapshot_evaluation_order
        grounds:
