      - name: rights_exclusion_cascades_four_levels_to_agreement_lifetime_ledger
        grounds:
          - state_machines.RightsDispute.RAISED_to_RESOLVED_EXCLUDED
          - calculations.reverse_compensation_split
          - entities.RightsDispute.fields.credit_bp_applied
          - entities.CarriageAgreement.fields.rights_credit_bp_total
          - entities.CarriageAgreement.fields.granted_rights_scope
          - entities.CarriageAgreement.fields.lifetime_net_retained_cents
          - entities.FeeSettlement.fields.rights_credit_cents
        distinguishing_aspect: |
          Depth 4 from a single ComplianceOfficer resolve call: RightsDispute.credit_bp_applied (1)
          -> CarriageAgreement.granted_rights_scope and rights_credit_bp_total (2) -> every ISSUED
          FeeSettlement's rights_credit_cents / reverse_comp_cents / net_retained_cents (3) ->
          CarriageAgreement.lifetime_net_retained_cents re-derived from those settlements (4).
