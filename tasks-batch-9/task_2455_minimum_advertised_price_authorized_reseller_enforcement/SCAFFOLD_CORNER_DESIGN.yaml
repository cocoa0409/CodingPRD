            - "Reseller.${res}.authorization_status == PENDING_AGREEMENT"
            - "Reseller.${res}.supply_status == HOLD"

      - name: respond_countersign_requires_the_acknowledgement
        claim_type: conditional_action
        grounds: ["endpoints.POST /reseller-agreements/{agreement_id}/respond"]
        distinguishing_aspect: "The same endpoint serves both branches; COUNTERSIGN is conditional on non_negotiation_acknowledged and on the absence of any counter price, and it records the acknowledgement on the row."
        test_recipe:
