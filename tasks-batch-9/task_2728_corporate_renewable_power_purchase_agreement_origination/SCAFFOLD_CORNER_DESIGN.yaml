      - name: offtaker_guarantor_reparenting_cycle_rejected
        claim_type: graph
        grounds:
          - entities.Offtaker.fields.parent_guarantor_offtaker_id
          - validations.priority_6_ERR_GUARANTOR_CYCLE
          - endpoints.POST_/ppa/offtakers/{id}/rating-change
        distinguishing_aspect: |
          The guarantor edge is the scaffold's self-referential relationship and it
          must stay a forest. A create can only ever attach a leaf, so the only way to
          close a cycle is to re-parent an existing node: with AH guaranteeing AR,
          pointing AH's guarantor at AR closes a two-node cycle and pointing AH at
          itself closes a one-node cycle. Both must be refused with the scores and the
          version left exactly as they were, because a cycle would make the upward
          walk in calculations.offtaker_credit_score non-terminating.
        test_recipe:
          setup:
            - "Parent AH (Aurora Holdings PLC, AA / SP / ndte 1.0 / CDP_AND_TCFD / SBT / RE100 / 2030 / EBITDA 500000000.00) scores 92.60 PRIME with sustainability 100.00 and is QUALIFIED, which is the precondition rating-change requires."
            - "Child AR (Aurora Retail Sub, BB / SP / ndte 6.0 / CDP_ONLY / no SBT / no RE100) is created with parent_guarantor_offtaker_id AH, so the guarantor chain is AR -> AH -> null."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Aurora Holdings PLC", credit_rating: "AA", rating_agency: "SP", reported_ebitda_usd: 500000000.00, net_debt_to_ebitda: 1.0, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { parent_id: $.data.id }
            - call: "POST /ppa/offtakers/${parent_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${parent_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Aurora Retail Sub", credit_rating: "BB", rating_agency: "SP", reported_ebitda_usd: 30000000.00, net_debt_to_ebitda: 6.0, disclosure_framework: "CDP_ONLY", parent_guarantor_offtaker_id: "${parent_id}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { child_id: $.data.id }
            - call: "GET /ppa/offtakers/${parent_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { parent_v: $.data.version }
          trigger:
            - call: "POST /ppa/offtakers/${parent_id}/rating-change"
              payload: { credit_rating: "AA", parent_guarantor_offtaker_id: "${child_id}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers/${parent_id}/rating-change"
              payload: { credit_rating: "AA", parent_guarantor_offtaker_id: "${parent_id}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers/${parent_id}/rating-change"
              payload: { credit_rating: "AA", parent_guarantor_offtaker_id: "00000000-0000-4000-8000-000000000007" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
          assert:
            - "before the trigger Offtaker.${parent_id}.credit_score == 92.60 = 0.55*92 + 0.30*90 + 0.15*100, credit_tier PRIME, credit_score_variant STANDALONE and parent_guarantor_offtaker_id null"
            - "before the trigger Offtaker.${child_id}.credit_score == 83.70 = 0.55*max(55, 92-8) + 0.30*max(40, 90) + 0.15*70, credit_score_variant GUARANTOR_SUPPORTED - the child inherits the notched rating and the better leverage but keeps its own CDP_ONLY disclosure"
            - "the first trigger returns 422 with data.error_id == ERR_GUARANTOR_CYCLE because AH -> AR -> AH closes a two-node cycle"
            - "the second trigger returns 422 with data.error_id == ERR_GUARANTOR_CYCLE because the edge would point at the offtaker itself"
            - "the third trigger returns 404 with data.error_id == ERR_OFFTAKER_NOT_FOUND - a non-existent guarantor is an existence failure at priority 5, not a cycle at priority 6"
            - "after all three triggers Offtaker.${parent_id}.parent_guarantor_offtaker_id is still null, credit_score is still 92.60 and version is still ${parent_v}"
            - "Offtaker.${child_id}.credit_score is still 83.70 and credit_score_variant is still GUARANTOR_SUPPORTED, so no partial re-parenting leaked"

      - name: path_id_not_found_returns_entity_scoped_404_per_family
        claim_type: not_found
        grounds:
          - validations.priority_4_ERR_<ENTITY>_NOT_FOUND
          - errors[ERR_PRICING_NODE_NOT_FOUND]
          - errors[ERR_OFFTAKER_NOT_FOUND]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_DEAL_NOT_FOUND]
          - errors[ERR_SETTLEMENT_PERIOD_NOT_FOUND]
        distinguishing_aspect: |
          The catalog declares eleven separate NOT_FOUND codes rather than one, so a
          wrong id must name the entity family it failed to find. One real offtaker
          exists, so a blanket 404 cannot be excused as an empty database, and the
          well-formed but unknown UUIDs must not be confused with a 400.
        test_recipe:
          setup:
            - "Exactly one Offtaker exists; no node, project, deal or settlement period exists."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
          trigger:
            - call: "GET /ppa/pricing-nodes/00000000-0000-4000-8000-000000000001"
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/offtakers/00000000-0000-4000-8000-000000000002"
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/projects/00000000-0000-4000-8000-000000000003"
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/deals/00000000-0000-4000-8000-000000000004"
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/settlement-periods/00000000-0000-4000-8000-000000000005"
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /ppa/offtakers/${buyer_id}"
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger returns 404 with data.error_id == ERR_PRICING_NODE_NOT_FOUND"
            - "the second trigger returns 404 with data.error_id == ERR_OFFTAKER_NOT_FOUND"
            - "the third trigger returns 404 with data.error_id == ERR_PROJECT_NOT_FOUND"
            - "the fourth trigger returns 404 with data.error_id == ERR_DEAL_NOT_FOUND"
            - "the fifth trigger returns 404 with data.error_id == ERR_SETTLEMENT_PERIOD_NOT_FOUND"
            - "every 404 body carries response_type error with both error_id and message set"
            - "the sixth trigger returns 200 for the one id that does exist, so the five 404s are about the ids and not about the endpoints"

  # ===========================================================================
  # SECTION 2 - state_machines (§1.2) + state_machine_shape cyclic
  #             + side-effect patterns
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_entities_start_in_their_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Offtaker.DRAFT_to_UNDER_REVIEW
          - state_machines.Project.PRE_DEVELOPMENT_to_PERMITTED
          - entities.Project.fields.available_mw
        distinguishing_aspect: |
          Four machines, four initial states, one request each: Offtaker starts DRAFT
          (not UNDER_REVIEW, even though scoring already ran), Project starts
          PRE_DEVELOPMENT with available_mw equal to capacity_mw, and a Deal starts
          DRAFT on the status dimension AND NOT_SUBMITTED on the independent
          credit_status dimension - two dimensions initialised separately in the same
          row.
        test_recipe:
          setup:
            - "A NODE pricing node exists so the project reference resolves."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
          trigger:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
          assert:
            - "the first trigger returns Offtaker.qualification_status == DRAFT even though credit_score 83.70 and credit_tier PRIME are already populated - scoring is not qualification"
            - "the second trigger returns Project.status == PRE_DEVELOPMENT with contracted_mw == 0 and available_mw == 100.000"
            - "Project.${project_id}.last_milestone_at is null, because no milestone has been advanced"
            - "both new rows have version == 1"

      - name: project_advances_through_four_milestones_to_operational
        claim_type: valid_transition
        grounds:
          - state_machines.Project.PRE_DEVELOPMENT_to_PERMITTED
          - state_machines.Project.PERMITTED_to_INTERCONNECTION_APPROVED
          - state_machines.Project.INTERCONNECTION_APPROVED_to_NTP_ISSUED
          - state_machines.Project.NTP_ISSUED_to_OPERATIONAL
          - endpoints.POST_/ppa/projects/{id}/advance-milestone
        distinguishing_aspect: |
          Walks the whole Project machine in order and pins that each hop stamps
          last_milestone_at from the logical clock rather than from wall time, and that
          the milestone name in the request maps to the declared TARGET state (milestone
          NOTICE_TO_PROCEED lands in NTP_ISSUED, not in a state called
          NOTICE_TO_PROCEED). Nothing about the project's capacity fields moves,
          because milestones are not contracts.
        test_recipe:
          setup:
            - "One NODE pricing node and one PRE_DEVELOPMENT project KJ1 (SOLAR, 100.000 MW) exist. The clock is moved once before the walk so last_milestone_at is provably read from the clock."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: Originator
              as_user_id: "u_orig_1"
          trigger:
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2026-0442" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "INTERCONNECTION_APPROVED", evidence_ref: "LGIA-CAISO-2026-088" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "NOTICE_TO_PROCEED", evidence_ref: "NTP-KJ1-2026-11" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "OPERATIONAL", evidence_ref: "COD-KJ1-2027-06-28" }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the four triggers return 200 with Project.status PERMITTED, then INTERCONNECTION_APPROVED, then NTP_ISSUED, then OPERATIONAL"
            - "milestone NOTICE_TO_PROCEED lands the project in NTP_ISSUED - the request word and the state name are deliberately different"
            - "after every hop Project.${project_id}.last_milestone_at == 2026-09-15T00:00:00Z, read from the logical clock and not from wall time"
            - "Project.${project_id}.version == 5 after four advances on top of the create"
            - "Project.${project_id}.contracted_mw is still 0 and available_mw is still 100.000 - milestones do not reserve capacity"

      - name: project_milestone_skip_returns_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Project.PRE_DEVELOPMENT_to_PERMITTED
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
          - endpoints.POST_/ppa/projects/{id}/advance-milestone
        distinguishing_aspect: |
          The Project machine is strictly linear, so from PRE_DEVELOPMENT the only
          declared trigger is milestone PERMITTED. Three of the four enum members are
          therefore invalid from the initial state, and each must be a 409
          ERR_INVALID_STATE_TRANSITION rather than a 400 (the enum member is legal, the
          transition is not) and rather than a silent fast-forward to OPERATIONAL.
        test_recipe:
          setup:
            - "One NODE pricing node and one PRE_DEVELOPMENT project KJ1 exist; no milestone has been advanced."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
              
          trigger:
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "OPERATIONAL", evidence_ref: "COD-JUMPED-THE-QUEUE" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "INTERCONNECTION_APPROVED", evidence_ref: "LGIA-SKIPPED-PERMIT" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2026-0442" }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger returns 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "the second trigger returns 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "after both refusals Project.${project_id}.status is still PRE_DEVELOPMENT, last_milestone_at is still null and version is still 1 - a refused transition writes nothing"
            - "the third trigger returns 200 with status PERMITTED, so the endpoint itself was never broken"

      - name: terminal_states_reject_every_further_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Offtaker.UNDER_REVIEW_to_REJECTED
          - state_machines.Project.NTP_ISSUED_to_OPERATIONAL
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          Two declared terminal states, checked from both machines in one instance: a
          REJECTED buyer cannot be resubmitted (there is no REJECTED -> UNDER_REVIEW
          edge, unlike CONDITIONAL -> UNDER_REVIEW, so a "re-apply" feature would be a
          fabrication) and an OPERATIONAL project cannot advance a fifth time. Both are
          409s, not 200 no-ops.
