        distinguishing_aspect: |
          Cyclic machine on Volunteer: TRAINEE -> GENERAL -> LAPSED (clock sweep at
          accredited_at + 24 months) -> GENERAL via renew — and the renewal gate is
          clock-sensitive because the original 10h credit ages out of the trailing
          730-day window, so renewal fails until a fresh 4h credit lands.
        test_recipe:
          setup:
