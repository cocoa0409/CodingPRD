            - "the commitment-C fund returns HTTP 200 and ac_amount == 1000000 — exactly at MIN_ADVANCE_CENTS, so the check is >= and not >"
            - "Advance.${ac_id}.provisional_advance_amount_cents == 1920000000 = floor(2000000000 * (0.98 - 0.02))"
            - "Advance.${ac_id}.concentration_capped == false — the binding cap was stage 4 (commitment capacity), never the stage-5 concentration solve"
            - "InvestorCommitment.${comm_c_id}.remaining_amount_cents == 0 and status == FULLY_ALLOCATED"
            - "InvestorCommitment.${comm_b_id}.allocated_amount_cents == 0 and status == OPEN"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 1000000 and wet_outstanding_cents == 1000000"

      - name: corner_calc_cap_chain_reconciles_provisional_against_final
        claim_type: reconciliation
        grounds:
          - calculations.advance_amount_determination
          - entities.Advance.fields.provisional_advance_amount_cents
          - entities.Advance.fields.advance_amount_cents
          - entities.Advance.fields.concentration_capped
        distinguishing_aspect: |
          Both variants of the same figure are persisted side by side and only the FINAL one
          reaches the ledger, so the delta is auditable: provisional 1,960,000,000 against a
          final 1,500,000,000. The discriminating flag is concentration_capped == false —
          the reduction came from stage 4, and an implementation that sets the flag whenever
          the amount was reduced at all is wrong.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; investor D APPROVED with commitment D of 1,500,000,000 for CONFORMING, window 2026-08-01..2026-12-31."
            - "One WET CONFORMING advance of loan 2,000,000,000 naming commitment D, wire VERIFIED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Delta Whole Loan Fund", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_d_id: "$.data.id" }
            - call: "POST /investors/${inv_d_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_d_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 1500000000
                price_pct: 1.0150
                effective_on: "2026-08-01"
                expires_on: "2026-12-31"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_d_id: "$.data.id" }
            - *c_get_fac_v1
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_d_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 2000000000
                note_rate: 0.0650
                funding_type: "WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { ad_id: "$.data.id" }
            - call: "GET /advances/${ad_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { wd_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${wd_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-970" }
              as: WireOperator
              as_user_id: "wo_1"
          trigger:
            - call: "POST /advances/${ad_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { ad_prov: "$.data.provisional_advance_amount_cents", ad_final: "$.data.advance_amount_cents", ad_flag: "$.data.concentration_capped" }
            - call: "GET /advances/${ad_id}/ledger-entries"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "ad_prov == 1920000000 = floor(2000000000 * (0.98 - 0.02)) — the provisional variant ignores every cap"
            - "ad_final == 1500000000 — the commitment capacity cap binds at stage 4"
            - "ad_flag == false — the stage-5 concentration solve returned its input unchanged because hypothetical outstanding 1500000000 <= CONCENTRATION_FLOOR_CENTS 5000000000"
            - "the advance ledger holds exactly one entry: ADVANCE_FUNDED DEBIT 1500000000 — the provisional figure is never posted"
            - "Advance.${ad_id}.outstanding_balance_cents == 1500000000"
            - "InvestorCommitment.${comm_d_id}.allocated_amount_cents == 1500000000, remaining_amount_cents == 0, status == FULLY_ALLOCATED"
            - "TakeoutInvestor.${inv_d_id}.exposure_cents == 1500000000"
            - "WarehouseFacility.${fac_id}.availability_cents == 18500000000"

      - name: corner_calc_orphan_rate_constant_applied_on_withdrawal
        claim_type: constants_applied
        grounds:
          - calculations.eligible_collateral_valuation.constants.ORPHAN_RATE
          - state_machines.InvestorCommitment.status.OPEN_to_WITHDRAWN
          - endpoints["POST /commitments/{id}/withdraw"]
        distinguishing_aspect: |
          ORPHAN_RATE is a CAP (min), not a replacement: withdrawing the commitment drops
          the effective rate from 0.98 to exactly 0.8500 and the shortfall is
          260,000,000 — a figure only reachable by applying min(0.98, 0.85) to
          min(loan, market) rather than by scaling the previous eligible value.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to 1,960,000,000 at 2026-08-01, custody RECEIVED_CLEAR, commitment A OPEN."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
          trigger:
            - call: "POST /commitments/${comm_a_id}/withdraw"
              payload: { reason: "Investor exited the CONFORMING program" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { orph_rate: "$.data.effective_advance_rate", orph_paydown: "$.data.required_paydown_cents" }
            - call: "GET /advances/${a1_id}/margin-calls"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { orph_mc_id: "$.data[0].id" }
          assert:
            - "pre-withdrawal the advance carried effective_advance_rate 0.98 and required_paydown_cents 0"
            - "orph_rate == 0.85 = min(0.98, ORPHAN_RATE) — a cap, not a multiplier"
            - "Advance.${a1_id}.eligible_collateral_value_cents == 1700000000 = floor(min(2000000000, 2000000000) * 0.85)"
            - "orph_paydown == 260000000 = 1960000000 - 1700000000"
            - "the advance has exactly 1 margin call: MarginCall.${orph_mc_id}.trigger_reason == COMMITMENT_WITHDRAWN, status == ISSUED, call_amount_cents == 260000000"
            - "MarginCall.${orph_mc_id}.cure_deadline_at == 2026-08-03T00:00:00Z = issued_at + DEFAULT_CURE_DAYS"
            - "InvestorCommitment.${comm_a_id}.status == WITHDRAWN"
            - "WarehouseFacility.${fac_id}.status == RESTRICTED and open_margin_call_count == 1"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents is still 1960000000 — a re-valuation moves no money"

      - name: corner_calc_zero_call_amount_is_refused_not_created
        claim_type: correct_result
        grounds:
          - calculations.margin_call_amount
          - validations[priority=33]
          - errors.ERR_MARGIN_CALL_AMOUNT_ZERO
          - endpoints["POST /margin-calls"]
        distinguishing_aspect: |
          Both arms of margin_call_amount can compute to zero and both must refuse rather
          than persist a zero-amount row: an advance-level call against a fully
          collateralised advance (required_paydown_cents 0) and a facility-level call
          against a facility whose outstanding_principal_cents is 0.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to 1,960,000,000 with market_value_cents still 2,000,000,000, so required_paydown_cents is 0."
            - "A second ACTIVE facility F2 with a CONFORMING rate row and zero advances."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Keystone Home Loans Inc"
                committed_amount_cents: 20000000000
                wet_sublimit_cents: 20000000000
                aged_sublimit_cents: 2000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1500000000
                min_liquidity_cents: 500000000
                min_ttm_net_income_cents: 100000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "8802"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { facz_id: "$.data.id" }
            - call: "POST /facilities/${facz_id}/product-advance-rates"
              payload: { product_code: "CONFORMING", advance_rate: 0.98, dwell_limit_days: 30 }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${facz_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
          trigger:
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "DWELL_EXCEEDED", advance_id: "${a1_id}" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /margin-calls"
              payload: { facility_id: "${facz_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH", cure_days: 5 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mcok_id: "$.data.id" }
          assert:
            - "pre-state: Advance.${a1_id}.required_paydown_cents == 0 and eligible_collateral_value_cents == 1960000000"
            - "the advance-level call returns HTTP 422 with data.error_id == ERR_MARGIN_CALL_AMOUNT_ZERO"
            - "the F2 facility-level call returns HTTP 422 with data.error_id == ERR_MARGIN_CALL_AMOUNT_ZERO — floor(0 * 0.10) == 0"
            - "GET /facilities/${fac_id}/margin-calls returns total_count == 1 after all three triggers — neither refused call was persisted"
            - "WarehouseFacility.${facz_id}.status is still ACTIVE and open_margin_call_count == 0 — a refused call raises no restriction"
            - "the third call succeeds with call_amount_cents == 196000000 = floor(1960000000 * 0.10)"
            - "MarginCall.${mcok_id}.cure_deadline_at == 2026-08-06T00:00:00Z = issued_at + the supplied cure_days of 5, overriding DEFAULT_CURE_DAYS"
            - "MarginCall.${mcok_id}.issued_by_user_id == co_1 and cured_amount_cents == 0"
            - "WarehouseFacility.${fac_id}.status == RESTRICTED after the third call"

      - name: corner_calc_advance_sizing_floors_never_rounds_half_up
        claim_type: precision
        grounds:
          - calculations.advance_amount_determination.precision
          - calculations.eligible_collateral_valuation.precision
        distinguishing_aspect: |
          A loan of 1,000,000,025 cents at 0.98 lands exactly on a half cent
          (980,000,024.50), so floor and round_half_up disagree by one cent. The required
          answer is 980,000,024 in BOTH the sizing calculation and the eligible-value
          calculation — the lender never over-advances.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; one DRY CONFORMING advance of loan_amount_cents 1,000,000,025, CLEAR receipt, VERIFIED wire."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000025
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { ah_id: "$.data.id" }
            - call: "POST /advances/${ah_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${ah_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { wh_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${wh_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-980" }
              as: WireOperator
              as_user_id: "wo_1"
          trigger:
            - call: "POST /advances/${ah_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { ah_amount: "$.data.advance_amount_cents", ah_eligible: "$.data.eligible_collateral_value_cents" }
          assert:
            - "ah_amount == 980000024, NOT 980000025 — 1000000025 * 0.98 == 980000024.50 exactly and the product is floored"
            - "ah_eligible == 980000024 — the same floor applies in eligible_collateral_valuation"
            - "Advance.${ah_id}.effective_advance_rate == 0.98 — round_half_up to 4 decimals leaves an exact 4-decimal rate untouched"
            - "Advance.${ah_id}.required_paydown_cents == 0 = max(0, 980000024 - 980000024)"
            - "Advance.${ah_id}.outstanding_balance_cents == 980000024"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 980000024 and availability_cents == 19019999976"

      - name: corner_calc_dwell_threshold_boundary_already_covered
        claim_type: correct_result
        grounds:
          - calculations.dwell_and_aging_classification
          - calculations.eligible_collateral_valuation
        excluded_because:
          difficulty_instance: boundary_dwell_limit_thirty_versus_thirty_one_days
          rationale: |
            The threshold algorithm's at-threshold / one-past-threshold pair — dwell exactly
            30 is not aged and applies zero curtailment steps, dwell 31 is aged and applies
            one — is precisely that §1.8 instance, which already pins both the is_aged flag
            and the resulting effective_advance_rate on each side of the boundary.

      - name: corner_calc_wet_versus_dry_variant_divergence_already_covered
        claim_type: variant_divergence
        grounds:
          - calculations.advance_amount_determination.variants
        excluded_because:
          difficulty_instance: dual_variant_wet_versus_dry_advance_sizing
          rationale: |
            Same loan, two funding_type variants, different advance_amount_cents plus a
            different cap set at stage 4 — that is the whole content of the §1.8 instance,
            which computes the delta explicitly from a shared fixture.

      - name: corner_calc_profitability_variant_selection_already_covered
        claim_type: variant_selection
        grounds:
          - calculations.covenant_evaluation.variants
        excluded_because:
          difficulty_instance: dual_variant_ttm_rolling_versus_annualized_quarter_profitability
          rationale: |
            Which profitability variant applies is determined by the CARDINALITY of the
            prior-test set, and that §1.8 instance walks the prior set from 0 to 3 rows to
            show the same certified net_income_cents flipping the covenant outcome. It also
            covers the forward_looking algorithm's prior-set filtering (a WAIVED prior still
            counts), so no separate input_set_filtering instance is emitted here.

      - name: corner_calc_concentration_constraint_propagation_already_covered
        claim_type: correct_result
        grounds:
          - calculations.concentration_constrained_advance
        excluded_because:
          difficulty_instance: combinatorial_mode_c_investor_concentration_closed_form_solve
          rationale: |
            The constraint_propagation algorithm's fixed-point behaviour — the ratio is
            measured on the POST-funding outstanding that contains the unknown, so the
            answer is a closed-form solve rather than a comparison — is the entire subject
            of that §1.8 instance, including the X_max literal and the
            concentration_capped flag.

      - name: corner_calc_fee_accrual_rounding_order_already_covered
        claim_type: precision
        grounds:
          - calculations.facility_fee_accrual.precision
        excluded_because:
          difficulty_instance: combinatorial_mode_b_fee_accrual_round_per_advance_then_sum
          rationale: |
            The round-per-advance-then-sum versus sum-then-round divergence needs a fixture
            engineered so the two orders differ by exactly one cent, and that §1.8 instance
            builds it. The corner instances above reuse its arithmetic but only as
            pre-computed inputs to other claims, never as the claim itself.

      - name: corner_calc_effective_rate_chain_already_covered
        claim_type: correct_result
        grounds:
          - calculations.eligible_collateral_valuation
        excluded_because:
          difficulty_instance: combinatorial_mode_a_four_stage_effective_rate_chain
          rationale: |
            Composing all four rate stages at once — wet haircut, aging curtailment,
            exception haircut and the orphan cap — with each stage's contribution isolated
            is that §1.8 instance's design. The corner file exercises the stages singly
            (the orphan cap above, the wet haircut in the ledger-sync instance) rather than
            re-testing the composition.

  # ===========================================================================
  - section: validations
    instances:

      - name: corner_val_wet_funding_gate_is_conditional_on_the_rate_row
        claim_type: conditional_validation
        grounds:
          - validations[priority=28]
          - errors.ERR_WET_FUNDING_NOT_ALLOWED
          - entities.ProductAdvanceRate.fields.wet_funding_allowed
        distinguishing_aspect: |
          Priority 28 is a per-product switch, not a global one: the SAME funding_type WET
          request is rejected under a rate row with wet_funding_allowed false and accepted
          under one with it true. It also pins that a rejection at priority 28 leaves
          WarehouseFacility.version untouched even though the OCC check at priority 8
          already passed — so the next request may reuse the same token.
        test_recipe:
          setup:
            - "Facility created with two rate rows: CONFORMING (wet_funding_allowed true) and SCRATCH_AND_DENT (wet_funding_allowed false). Approved, one custodian."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - call: "POST /facilities/${fac_id}/product-advance-rates"
              payload: { product_code: "SCRATCH_AND_DENT", advance_rate: 0.85, wet_funding_allowed: false, dwell_limit_days: 20 }
              as: CreditOfficer
              as_user_id: "co_1"
            - *c_approve_facility
            - *c_custodian
            - *c_get_fac_v1
          trigger:
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                product_code: "SCRATCH_AND_DENT"
                loan_amount_cents: 500000000
                note_rate: 0.0950
                funding_type: "WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                product_code: "SCRATCH_AND_DENT"
                loan_amount_cents: 500000000
                note_rate: 0.0950
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { vsd_id: "$.data.id" }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 500000000
                note_rate: 0.0650
                funding_type: "WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { vcw_id: "$.data.id" }
            - call: "GET /advances"
              payload: { facility_id: "${fac_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "the first call returns HTTP 422 with data.error_id == ERR_WET_FUNDING_NOT_ALLOWED"
            - "the second call (identical except funding_type DRY) returns HTTP 201 — the product itself is fundable, only wet funding is barred"
            - "the third call returns HTTP 201 — WET is fine under the CONFORMING rate row whose wet_funding_allowed is true"
            - "the second call reused ${fac_v1} successfully, proving the rejected first call did NOT increment WarehouseFacility.version"
            - "fac_v2 == fac_v1 + 1 — exactly one increment from the one accepted booking before it"
            - "GET /advances returns total_count == 2, holding only ${vsd_id} and ${vcw_id}"
            - "Advance.${vsd_id}.funding_type == DRY and Advance.${vcw_id}.funding_type == WET, both funding_status REQUESTED"
            - "exactly 2 WireInstruction rows exist across the facility — the rejected request created no paired wire"

      - name: corner_val_rate_row_existence_outranks_request_schema
        claim_type: cascading_validation
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_ADVANCE_RATE_NOT_CONFIGURED
          - errors.ERR_VALIDATION
        distinguishing_aspect: |
          Deliberately counterintuitive ordering: the rate-row existence check at priority 6
          runs BEFORE schema validation at priority 7, because sizing is impossible without
          a rate row. A request that is simultaneously schema-invalid (funding_type
          "SEMI_WET") and rate-row-less (JUMBO) must return
          ERR_ADVANCE_RATE_NOT_CONFIGURED, not ERR_VALIDATION — the opposite of what a
          framework that validates the body first would produce.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility whose only rate row is CONFORMING. One custodian."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_get_fac_v1
          trigger:
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                product_code: "JUMBO"
                loan_amount_cents: 500000000
                note_rate: 0.0650
                funding_type: "SEMI_WET"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
