              as: CirculationManager
              captures: { ctrl_subscr2: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${ctrl_sub3}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
              as: CirculationManager
              captures: { ctrl_subscr3: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${paid_subscr}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${ctrl_subscr1}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${ctrl_subscr2}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${ctrl_subscr3}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-editorial"
              payload: {}
              as: ProductionManager
            - call: "GET /publications/${pub_id}/issues/${issue_id}"
              payload: {}
              as: ProductionManager
              captures: { issue_v: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${issue_v}" }
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/ship-to-printer"
              payload: {}
              as: ProductionManager
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches"
              payload: { batch_label: "DOM", postal_class: "PERIODICAL", entry_point: "ORIGIN", permit_number: "P-1", is_controlled_copy_included: true }
              as: FulfillmentManager
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_id}/generate-labels"
              payload: { expected_batch_version: "${batch_v}" }
              as: FulfillmentManager
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/mailing-batches/${batch_id}/verify-postal"
              payload: {}
              as: PostalComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_PAID_RATIO_BELOW_MINIMUM  # 1 paid / 4 total = 2500 bps < 5000 bps"
            - "If a fiscal validation (insufficient inventory) had also been triggered, safety (priority 9) still wins over fiscal (priority 12)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: periodical_paid_ratio_exactly_5000_bps
        grounds:
          - calculations.paid_percentage_bps
          - validations[priority=9]
          - state_machines.MailingBatch.LABELS_GENERATED_to_POSTAL_VERIFIED
        distinguishing_aspect: |
          Boundary metric: paid_percentage_bps. Boundary endpoint:
          verify-postal. At exactly 5000 bps (50%), the validation is
          "paid_percentage_bps >= 5000" — INCLUSIVE. A batch with exactly
          5000 bps passes; 4999 bps fails.
        test_recipe:
          setup:
            - "Issue with 2 PAID subs and 2 CONTROLLED subs → paid_percentage = 2*10000/4 = 5000 bps exactly"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
