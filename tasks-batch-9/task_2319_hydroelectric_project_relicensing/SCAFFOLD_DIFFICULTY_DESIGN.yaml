  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settlement_withdrawal_restores_the_burden_ledger_exactly
        grounds:
          - state_machines.Settlement.EXECUTED_to_WITHDRAWN
          - state_machines.PmeMeasure.INCLUDED_to_WITHDRAWN
          - calculations.project_burden_ledger
          - endpoints["POST /relicensing/settlements/{settlement_id}/withdraw"]
        distinguishing_aspect: |
          Withdrawal is the compensating action for execution and must restore all six ledger fields
          bit-for-bit, including the tiered administrative charge, which is not a linear function of
          the removed measure. Because the ledger is recomputed from the surviving measure set rather
          than decremented, the pre-execution values 57500.00 / 1150.00 / 230.4 / 68326.80 / 0.65
          must reappear exactly after the 157136.35 / 3142.73 / 1267.2 / 213501.48 / 2.03 excursion.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with base_annual_generation_mwh 250000, pad_year 2026 and an APPROVED study plan."
            - "One INCLUDED AGENCY_PRESCRIPTION WATER_QUALITY measure (annual_cost 57500.00, gen 230.4) already in the ledger."
            - "Two parties of vote_weight 1 (agency with conditioning authority, tribe)."
            - "A CIRCULATED settlement carrying one PROPOSED FISH_PASSAGE measure (capital 1200000.00, om 45000.00, construction_start_year 2029, flow 120, head 85, days 180) with SUPPORT from both parties."
