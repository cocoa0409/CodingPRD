  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: staff_shift_half_open_interval_admits_back_to_back_shifts
        grounds:
          - validations[priority=19]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.StaffShift.fields.start_utc
          - entities.StaffShift.fields.end_utc
          - calculations.derive_tip_eligibility
        distinguishing_aspect: "The interval semantics are half-open: a second shift for the same employee starting exactly at the first shift's end_utc is admitted while one starting one second earlier is rejected, so adjacency with a zero-length gap is legal — the opposite convention from the clearance-window rule."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Empty database."
            - "Brand BR-1042 and store 1042 exist with tip_minimum_minutes 240."
            - "StaffShift SH-1 for employee E-701 runs 09:00Z to 13:00Z on CASHIER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "FINAL_ONLY", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-701", start_utc: "2026-09-15T09:00:00Z", end_utc: "2026-09-15T13:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_1_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-701", start_utc: "2026-09-15T12:59:59Z", end_utc: "2026-09-15T16:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { overlap_error: $.data.error_id }
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-701", start_utc: "2026-09-15T13:00:00Z", end_utc: "2026-09-15T16:00:00Z", workcode: "SERVER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_2_id: $.data.id }
          assert:
            - "the 12:59:59 shift is rejected with 409 ERR_SHIFT_OVERLAP — one second of overlap is enough"
            - "the 13:00:00 shift is admitted, so the intervals are half-open at the upper edge and a zero-length gap is legal"
            - "StaffShift.${shift_2_id}.status == SCHEDULED and StaffShift.${shift_2_id}.tip_eligible_minutes == 0"
            - "GET /staff-shifts?employee_id=E-701 returns exactly 2 rows, so the rejected attempt created nothing"
            - "the rule is scoped to (location_id, employee_id), not to the employee alone"

      - name: clearance_windows_require_a_strictly_positive_buffer_gap
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_CLEARANCE_WINDOW_OVERLAP]
          - entities.ClearanceSchedule.fields.start_date
          - entities.ClearanceSchedule.fields.end_date
          - entities.Brand.fields.clearance_buffer_hours
        distinguishing_aspect: "The interval semantics are buffered: a new clearance window starting exactly at the prior window's end_date is rejected and the gap must be strictly greater than the brand's 24-hour buffer — the mirror image of the half-open shift rule, on a different resource entity with a mandated quiet period rather than adjacency."
        test_recipe:
          setup:
            - "Logical clock 2026-09-16T00:00:00Z. Empty database."
            - "Brand BR-1042 and store 1042 exist with clearance_buffer_hours 24 and clearance_max_active 3."
            - "Item ITM-DECOR-2400 exists with 5 units on hand."
            - "ClearanceSchedule CS-1 on that item covers 2026-09-01 to 2026-10-01 and is DRAFT, but its window has already begun."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "FINAL_ONLY", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-DECOR-2400", name: "Harvest Wall Plaque", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 2400, unit_cost_cents: 900, import_lead_time_days: 40 }
              as: AssortmentPlanner
              captures: { item_id: $.data.id, item_version: $.data.version }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-16T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id }
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_id}", declared_units: 5, received_units: 5, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 5 }
              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_item_version: "${item_version}" }
              as: BoutiqueManager
              captures: { cs_1_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_id}", start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-20T00:00:00Z", expected_item_version: "${item_version}" }
              as: BoutiqueManager
              captures: { zero_gap_error: $.data.error_id }
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_id}", start_date: "2026-10-01T23:59:59Z", end_date: "2026-10-20T00:00:00Z", expected_item_version: "${item_version}" }
              as: BoutiqueManager
              captures: { short_buffer_error: $.data.error_id }
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_id}", start_date: "2026-10-02T00:00:00Z", end_date: "2026-10-20T00:00:00Z", expected_item_version: "${item_version}" }
              as: BoutiqueManager
              captures: { cs_2_id: $.data.id }
          assert:
            - "a window starting exactly at the first window's end_date is rejected with 409 ERR_CLEARANCE_WINDOW_OVERLAP — a zero-length gap is not a permitted buffer"
            - "a window starting 24 hours minus one second after the end_date is also rejected, so the boundary is strict"
            - "a window starting a full 24 hours after the end_date is admitted with ClearanceSchedule.${cs_2_id}.status == DRAFT"
            - "GET /clearance-schedules?item_id=${item_id} returns exactly 2 rows, so the two rejected attempts created nothing"
            - "the shift rule in the sibling instance admits a zero-length gap while this rule forbids it, so the two overlap rules do not share interval arithmetic"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_receiving_restores_the_conserved_backroom_units
        grounds:
          - state_machines.Transfer.RECEIVED_to_VOID_RECEIVING
          - state_machines.Transfer.VOID_RECEIVING_to_IN_TRANSIT
          - errors[ERR_TRANSFER_VARIANCE_EXCEEDED]
          - entities.Location.fields.backroom_occupancy_units
          - entities.Location.fields.backroom_committed_units
        distinguishing_aspect: "The conserved quantity is a unit count — backroom occupancy plus committed units — which reads 25 before dispatch and must read exactly 25 again after a compensated receiving, so this is a units invariant rather than the monetary aggregate the sibling instance conserves."
        test_recipe:
          setup:
            - "Logical clock 2026-09-17T00:00:00Z. Empty database."
            - "Brand BR-1042 and store 1042 exist with transfer_variance_tolerance_bps 200 and food_storage_corridor_units 50."
            - "Item ITM-BOAT-6400 exists."
            - "StoreDay 2026-09-17 is OPEN."
            - "Location.backroom_occupancy_units is 25 from an initial cycle-count reading and backroom_committed_units is 0."
            - "Transfer TR-B is IN_TRANSIT with declared_units 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "FINAL_ONLY", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 50, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_id: $.data.id }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-17T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id }
            - call: "POST /retail-ops/locations/${loc_id}/capacity-readings"
              payload: { store_day_id: "${day_id}", measured_at: "2026-09-17T08:00:00Z", backroom_units: 25, food_storage_units: 0, dated_units: 0, source: "CYCLE_COUNT" }
              as: BoutiqueManager
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_id}", declared_units: 100, received_units: 0, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_id}/dispatch"
              payload: {}
              as: RetailLead
          trigger:
            - call: "POST /retail-ops/transfers/${tr_id}/receive"
              payload: { received_units: 95 }
              as: RetailLead
              captures: { variance: $.data.variance_units, variance_bps: $.data.variance_bps }
            - call: "POST /retail-ops/transfers/${tr_id}/void-receiving"
              payload: {}
              as: BoutiqueManager
              captures: { tr_status: $.data.status }
            - call: "GET /retail-ops/locations/${loc_id}"
              payload: {}
              as: BoutiqueManager
              captures: { occ_restored: $.data.backroom_occupancy_units, committed_restored: $.data.backroom_committed_units, free_restored: $.data.staging_free_units }
          assert:
            - "before the receive the invariant backroom_occupancy_units + backroom_committed_units reads 25 + 100 == 125"
            - "after receiving 95 of 100 declared the invariant reads 120 + 0 == 120, and variance_bps == 500 which is above the 200 basis-point tolerance that makes the void legal"
            - "after the void, Location.${loc_id}.backroom_occupancy_units == 25 and Location.${loc_id}.backroom_committed_units == 0, so the invariant is back to exactly 25"
            - "Location.${loc_id}.staging_free_units == 325, a full restoration rather than a partial one"
            - "Transfer.${tr_id}.status == VOID_RECEIVING and Item.${item_id}.on_hand_units == 0, so the item ledger was restored as well"
            - "a clean pass does not move the invariant: re-dispatch plus a receive of 100 of 100 leaves variance_bps == 0 and the invariant at 125"

      - name: dispute_and_resolve_conserve_recognized_revenue_and_transaction_count
        grounds:
          - state_machines.Receipt.RECONCILED_to_DISPUTED
          - state_machines.Receipt.DISPUTED_to_RECONCILED
          - state_machines.Receipt.SETTLED_to_DISPUTED
          - entities.Brand.fields.recognized_retail_revenue_cents
          - entities.StoreDay.fields.retail_transaction_count
        distinguishing_aspect: "The conserved quantities are a monetary aggregate and a counting aggregate on two different rows: dispute followed by resolve must leave Brand.recognized_retail_revenue_cents and StoreDay.retail_transaction_count at exactly their pre-dispute values, so a compensation that reverses a different amount or forgets the counter leaves measurable drift."
