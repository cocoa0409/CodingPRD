              payload: { session_id: "${sess_id}", enrollment_id: "${e2}", expected_session_version: "${sv1}" }
              as: ShopAdmin
              captures: { sb2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /session-bookings/${sb1}/attend"
