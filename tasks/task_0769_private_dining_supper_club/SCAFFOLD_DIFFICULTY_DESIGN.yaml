              payload: { series_id: "${series_id}", venue_id: "${venueB}", chef_id: "${chefA}", title: "CE2", event_start: "2026-03-15T19:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /events/${e2}/schedule"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHEF_TIME_CONFLICT"
            - "http status == 409"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_count_conservation_book_then_cancel
        grounds:
          - state_machines.Seat.AVAILABLE_to_HELD
          - state_machines.Seat.BOOKED_to_AVAILABLE
          - calculations.seat_inventory_counts
          - entities.Event.fields.available_seat_count
        distinguishing_aspect: |
          Conserved quantity = seat count: for the Event, (AVAILABLE + HELD + BOOKED + BLOCKED) == seat_capacity always;
          a book+pay+cancel round-trip returns available_seat_count to the full capacity (3) with no drift.
        test_recipe:
          setup:
            - "OPEN event seat_capacity=3; Guest books+pays 1 seat then cancels it"
            - "clock at default 2026-03-01 (>=14 days before event_start -> full refund, no fiscal side issues)"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Sc", cadence: "WEEKLY", theme: "T", default_seat_capacity: 3, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Vsc", address: "18 R St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Csc", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "Gsc", email: "gsc@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "Sc1", event_start: "2026-03-20T18:00:00Z", event_end: "2026-03-20T21:00:00Z", booking_deadline: "2026-03-19T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 3, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id" }
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: { reason: "test" }
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Event.${event_id}.available_seat_count == 3"
            - "Event.${event_id}.confirmed_seat_count == 0"

      - name: deposit_money_conservation_book_then_refund
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.cancellation_refund
          - calculations.seat_inventory_counts
          - entities.Event.fields.gross_deposit_held_cents
          - entities.Booking.fields.deposit_paid_cents
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents): deposit_paid_cents == gross_deposit_held_cents + refund_cents for the
          event; a full-refund cancel leaves deposit_paid 5000, refund 5000, gross_deposit_held 0 (0 + 5000 == 5000).
        test_recipe:
          setup:
            - "OPEN event event_start 2026-03-15T00:00:00Z; clock at default 2026-03-01 (14 days -> full refund)"
            - "Guest books 2 seats, pays 5000 deposit (CONFIRMED)"
          setup_api_calls:
            - call: "POST /series"
