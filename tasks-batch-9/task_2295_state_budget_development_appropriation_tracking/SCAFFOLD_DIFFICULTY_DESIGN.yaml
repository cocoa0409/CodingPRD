          - entities.BudgetCycle.fields.required_reserve_cents
          - entities.BudgetCycle.fields.balance_certified
        distinguishing_aspect: |
          Inclusive threshold boundary of cycle_balance_certification: total_recommended_cents
          == appropriable_cents == 9500000000 certifies (balanced is <=, equality passes),
          and a second approved recommendation of exactly 1 cent pushes the total to
          9500000001 and returns ERR_BUDGET_NOT_BALANCED.
