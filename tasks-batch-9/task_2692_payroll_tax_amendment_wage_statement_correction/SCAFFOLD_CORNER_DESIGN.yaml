            - "CorrectionCase.${case_id}.filing_status == FILING_IN_PROGRESS"

      - name: reconcile_without_a_filed_return_stops_before_detection_runs
        claim_type: Cascading validation
        grounds:
          - validations.priority_74.ERR_NO_FILED_RETURN_FOR_PERIOD
          - calculations.three_way_variance_detection.input_set
        distinguishing_aspect: "The filed-return existence check gates the whole three-way comparison: with register lines and deposits present but no FiledReturn, reconcile fails at priority 74 and detection_status stays NOT_RUN with zero Discrepancy rows written, rather than emitting variances against a null return."
        test_recipe:
          setup:
            - "An employer, a federal agency, one employee, one posted register line and one cleared deposit for 2025 Q1."
