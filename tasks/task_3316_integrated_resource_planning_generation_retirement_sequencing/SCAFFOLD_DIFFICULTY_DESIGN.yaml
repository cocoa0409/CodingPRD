            - "post-award: PlanCondition.${cond_id}.status == DISCHARGED and version == 2 (bubble-up from the award)"
            - "post-award 2032 report: required_procurement_mw == 0 and procurement_deviation_mw == 100.00 — the DISCHARGED condition no longer counts; the discharge (proximate cause), not the award itself, moved the report's requirement"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_comment
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - endpoints.POST_/plans/{planId}/comments
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_temporal (p5): a comment filed
          on a plan that is UNDER_REVIEW AND past the comment window violates both;
          the p4 state error ERR_PLAN_NOT_OPEN_FOR_COMMENT (409) MUST win over the
          p5 ERR_COMMENT_WINDOW_CLOSED (422).
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P OPEN_FOR_COMMENT with window [2026-08-01, 2026-08-31]; clock advanced to 2026-09-05 (past window) and plan submitted for review (now UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Prio1", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-P1", preferred_flag: true }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${plan_id}/comments"
              payload: { commenter_name: "Jane Public", commenter_email: "jane@example.org", body: "Too much gas." }
              as: PublicCommenter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_NOT_OPEN_FOR_COMMENT with HTTP 409 (state p4 beats business_temporal p5 ERR_COMMENT_WINDOW_CLOSED)"

      - name: business_constraint_vs_business_referential_on_commitment
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - endpoints.POST_/plans/{planId}/procurement-commitments
