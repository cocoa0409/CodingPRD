              as_user_id: "agent-keystone-1"
          assert:
            - "after setup: DefaultNotice.${notice_id}.status == LESSEE_CURE_LAPSED with mortgagee_cure_deadline 2026-09-10T00:00:00Z"
            - "trigger[0] returns ERR_MORTGAGE_LEASE_MISMATCH (422); the notice stays LESSEE_CURE_LAPSED and LeaseholdMortgage.${m_b}.status stays RECORDED"
            - "trigger[1] returns 200: DefaultNotice.${notice_id}.status == MORTGAGEE_CURING and LeaseholdMortgage.${m_a}.status == CURING"
            - "Lease.${lease_a}.lease_status is still IN_DEFAULT and arrears_balance_cents still 2000000 - electing is not curing"

      - name: envelope_aggregate_at_priority_13_beats_the_use_recheck_at_priority_17
        claim_type: priority_ordering
        grounds:
          - validations.priority_13_gfa_envelope
          - validations.priority_17_permitted_use
          - errors.ERR_GFA_ENVELOPE_EXCEEDED
        distinguishing_aspect: |
          One decision call violates two re-checks at once - the request needs 100000 sqft against a
          50000 sqft remainder AND its use no longer matches the amended lease - and the lower priority
          number must win: ERR_GFA_ENVELOPE_EXCEEDED (409), not ERR_USE_NOT_PERMITTED (422). Evaluating
          the business clause first flips both the code and the status class.
        test_recipe:
          setup:
            - "One 200000 sqft lease with alteration A approved for 150000 sqft, alteration B submitted for 100000 sqft, and the permitted use amended after B was filed."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-115", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 150000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-03-01T00:00:00Z", estimated_cost_cents: 100000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_a: $.data.id }
            - call: "POST /portfolio/alteration-requests/${alt_a}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 100000, construction_window_start: "2027-04-01T00:00:00Z", construction_window_end: "2027-06-01T00:00:00Z", estimated_cost_cents: 100000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_b: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/terms"
              payload: { permitted_use_code: "OFFICE_CAMPUS" }
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/alteration-requests/${alt_b}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "after setup: Lease.${lease_id}.gfa_allocated_sqft == 150000 and gfa_unallocated_sqft == 50000"
            - "trigger returns ERR_GFA_ENVELOPE_EXCEEDED (409) - priority 13 is reported even though the priority-17 use clause is also violated"
            - "AlterationRequest.${alt_b}.status is still SUBMITTED and the envelope is still 150000 / 50000"

      - name: terminated_lease_write_priority_corner
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: terminated_lease_statement_rejected_by_priority_7_not_priority_11
          rationale: |
            The P7-versus-P11 priority pair - a statement filed on a terminated lease with a future
            period_end, where the operability check must be reported ahead of the chronology one - is the
            named §1.8 priority_pair_validation_conflict instance.

      - name: authorization_beats_aggregate_priority_corner
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: alteration_decision_unauthorized_role_beats_the_gfa_envelope_aggregate
          rationale: |
            The P2-versus-P13 pair - a wrong-role decision on a request that would also blow the envelope,
            where ERR_UNAUTHORIZED must be reported and the envelope must not move - is the named §1.8
            instance; this section's priority instance deliberately pairs two different rules (P13 and
            P17) so the two are not redundant.

      - name: concurrency_beats_chronology_priority_corner
        claim_type: cascading_validation
        excluded_because:
          difficulty_instance: statement_stale_version_beats_chronology_then_chronology_surfaces
          rationale: |
            The cascading-check claim - the P4 optimistic-concurrency guard running before the P11
            chronology guard, and the chronology error only surfacing once the version is corrected - is
            the named §1.8 instance.

      - name: gfa_envelope_aggregate_conservation_corner
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: revoked_alteration_returns_envelope_once_and_a_second_revoke_cannot_mint_capacity
          rationale: |
            The P13 aggregate claim - individually fitting requests whose collective demand exceeds the
            envelope, and the envelope's exact restoration on revocation - is the named §1.8
            compensating_invariant instance.

      - name: sublet_area_aggregate_conservation_corner
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: sublease_overlap_is_keyed_by_unit_while_the_area_cap_is_keyed_by_lease
          rationale: |
            The P14 aggregate claim - the per-lease sublet-area cap counting ACTIVE and CONSENT_GRANTED
            rows together, inclusive at exactly total_permitted_gfa_sqft - is the named §1.8
            resource_temporal_overlap instance.

  - section: endpoints
    instances:
      - name: terms_amendment_overwrites_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/portfolio/leases/{id}/terms
        distinguishing_aspect: |
          The amendment endpoint is a partial update over eleven optional fields: supplying two of them
          must leave the other nine exactly as executed, bump version by one and re-derive
          gfa_unallocated_sqft from the new envelope. A handler that treats absent fields as null wipes
          the percentage-rent breakpoint or the reversion standard, which the second amendment catches.
        test_recipe:
          setup:
            - "One freshly executed lease at version 1."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-116", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases/${lease_id}/terms"
              payload: { percentage_rent_rate_bps: 800, total_permitted_gfa_sqft: 250000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/terms"
              payload: { reversion_standard_code: "FULLY_FITTED" }
              as: LessorAdmin
          assert:
            - "trigger[0] returns 200 with percentage_rent_rate_bps 800, total_permitted_gfa_sqft 250000, gfa_unallocated_sqft 250000 and version 2"
            - "after trigger[0]: percentage_rent_breakpoint_cents is still 100000000, permitted_use_code still RETAIL_MIXED, reversion_standard_code still SHELL_CONDITION, current_annual_base_rent_cents still 10000000 and security_deposit_cents still 5000000"
            - "trigger[1] returns 200 with reversion_standard_code FULLY_FITTED, version 3, and percentage_rent_rate_bps still 800 - the first amendment is not rolled back"
            - "lease_status is still ACTIVE and rent_status still BASE_ONLY throughout - amendments do not touch either axis"

      - name: administration_run_reports_per_phase_counters_and_is_idempotent_at_one_instant
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/portfolio/administration-runs
          - state_machines.Lease.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          One sweep touches three leases for three different reasons and each counter must report only its
          own phase: 1 insurance lapse, 1 revaluation flagged, 1 lease expired, 0 cure windows and 0
          mortgages. Re-running at the same logical instant must move nothing and return all-zero
          counters, which distinguishes a properly guarded sweep from one that re-processes rows.
        test_recipe:
          setup:
            - "Lease X expiring 2026-09-01; lease Y insured only to 2026-08-15; lease Z whose next_revaluation_date lands 2026-09-01. The clock is then pushed to 2026-09-02."
