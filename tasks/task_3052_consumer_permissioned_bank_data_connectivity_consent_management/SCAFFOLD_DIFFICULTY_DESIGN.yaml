              as: Consumer
              as_user_id: cons_m
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_m
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /institutions/${inst_id}/migration/start"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /institutions/${inst_id}/migration/complete"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /connections/${conn_id}/migrate"
              payload: {}
              as: Consumer
              as_user_id: cons_m
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_m
            - call: "POST /institutions/${inst_id}/migration/complete"
              payload: {}
              as: PlatformAdmin
              captures: { mig_state: $.data.migration_state, mode: $.data.connectivity_mode }
          assert:
            - "First completion attempt fails: error_id == ERR_MIGRATION_INCOMPLETE (connection still on CREDENTIALS)"
            - "After connection migrate + re-proof, completion succeeds: migration_state == COMPLETE and connectivity_mode == API_ONLY"
            - "Connection.${conn_id}.method == BANK_API and status == ACTIVE"
            - "A CONNECTION_MIGRATED WebhookEvent exists for connection ${conn_id}"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_consent_duration_half_open_expiry
        grounds:
          - state_machines.ConsentRecord.ACTIVE_to_EXPIRED
          - calculations.refresh_cadence_gate
        distinguishing_aspect: |
          Half-open interval semantics on the ConsentRecord resource: consent
          occupation is [created_at, expires_at) — a connection created at
          clock == expires_at exactly is rejected ERR_CONSENT_NOT_ACTIVE and
          the consent has lazily flipped to EXPIRED, while the same creation
          one second before the boundary succeeds.
        test_recipe:
          setup:
            - "ACTIVE connection under consent C with expires_at == 2026-09-02T00:00:00Z; rate limit 100"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "HalfOpen Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "HalfOpenApp", declared_use_case: "session sync", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalLow9", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_n", data_scopes: ["BALANCE"], expires_at: "2026-09-02T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_n
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_n", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_n
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_n
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_n", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_n
              captures: { conn2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_n", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_n
              captures: { err_exp: $.data.error_id }
            - call: "GET /consents/${consent_id}"
              as: Consumer
              as_user_id: cons_n
              captures: { consent_status: $.data.status }
          assert:
            - "At 2026-09-01T23:59:59Z (1s inside the half-open interval): second connection created successfully (PENDING_AUTH) under the same consent"
            - "At clock == expires_at exactly: error_id == ERR_CONSENT_NOT_ACTIVE (http 422) — the interval endpoint is exclusive"
            - "ConsentRecord.${consent_id}.status == EXPIRED after the clock sweep (expiry materialized by the sweep)"
            - "Connection.${conn_id}.status == DISCONNECTED and Connection.${conn2_id}.status == DISCONNECTED (expiry cascade disconnects both)"

      - name: overlap_migration_window_closed_interval
        grounds:
          - state_machines.InstitutionMigration.NOT_STARTED_to_IN_PROGRESS
          - state_machines.Connection.ACTIVE_to_MIGRATING
          - validations[priority=12]
        distinguishing_aspect: |
          Different interval semantics on a different resource (Institution
          migration window): the window is CLOSED [start, end] — start and end
          instants are both legal for migrate, while one second before start or
          after end fails ERR_MIGRATION_WINDOW_CLOSED; this contrasts with the
          consent's exclusive expiry edge.
        test_recipe:
          setup:
            - "Institution with migration window [2026-09-10T00:00:00Z, 2026-09-20T00:00:00Z], target BANK_API; ACTIVE CREDENTIALS connection; migration IN_PROGRESS (started at window start)"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Window Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "WindowApp", declared_use_case: "window testing", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalLow10", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_o", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_o
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_o", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_o
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_o
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /institutions/${inst_id}/migration/start"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /connections/${conn_id}/migrate"
              payload: {}
              as: Consumer
              as_user_id: cons_o
              captures: { st_start: $.data.status }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_o
            - call: "POST /connections/${conn_id}/migrate"
              payload: {}
              as: Consumer
              as_user_id: cons_o
              captures: { err_second: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "At window start exactly: migrate succeeds, status == MIGRATING (closed lower bound)"
            - "Re-proof returns connection to ACTIVE with method == BANK_API"
            - "Second migrate fails ERR_INVALID_STATE (connection already on target_method — method != target precondition), NOT a window error"
            - "Migration start at 2026-09-09T23:59:59Z would fail ERR_MIGRATION_WINDOW_CLOSED (window not yet open) — verified by the clock-set-then-start ordering in setup: start only succeeded after the clock reached the window start"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_active_agreement_count_conserved_across_supersede
        grounds:
          - calculations.consent_scope_coverage
          - concurrency_rules[agreement-create-stale-institution]
          - validations[priority=17]
        distinguishing_aspect: |
          Conserved quantity: count of ACTIVE InstitutionAgreements per
          institution. The forward action (agreement create with
          active=true) paired with its compensating side effect (prior ACTIVE
          agreement flipped inactive) keeps count(institution.agreements where
          active == true) == 1 after N >= 1 creates.
        test_recipe:
          setup:
            - "Institution I with one ACTIVE agreement (rate limit 50)"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Invariant Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v1: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 50, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v1}" }
              as: PlatformAdmin
              captures: { agr1: $.data.id }
            - call: "GET /institutions/${inst_id}"
              as: PlatformAdmin
              captures: { inst_v2: $.data.version }
          trigger:
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 75, permitted_fields_by_scope: { BALANCE: ["current_cents"], TRANSACTIONS: ["amount_cents"] }, expected_institution_version: "${inst_v2}" }
              as: PlatformAdmin
              captures: { agr2: $.data.id }
            - call: "GET /institutions/${inst_id}/agreements"
              as: PlatformAdmin
          assert:
            - "Exactly 1 agreement with active == true exists for institution ${inst_id} after the second create (the new one, ${agr2})"
            - "Agreement ${agr1}.active == false (compensating flip)"
            - "GET /institutions/${inst_id}/agreements returns total_count == 2 (history retained, only one ACTIVE)"
            - "Institution.version advanced by 1 per agreement create (create bumped to 2, second create to 3)"

      - name: invariant_refresh_failure_counter_reset_on_reauth
        grounds:
          - calculations.institution_health_status
          - state_machines.Connection.REAUTH_REQUIRED_to_ACTIVE
          - calculations.reauth_cooldown_gate
        distinguishing_aspect: |
          Different conserved quantity: connection liveness counters. The
          forward action (failed refresh increments consecutive_failures) paired
          with its compensating action (valid reauth) restores the invariant
          consecutive_failures == 0 AND status == ACTIVE — no drift remains
          after the compensate step, while BreakageEvents (the audit quantity)
          are intentionally NOT erased (append-only log).
        test_recipe:
          setup:
            - "ACTIVE connection with reauth_cooldown_seconds = 0"
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Counter Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "CounterApp", declared_use_case: "resilience", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "BalLow11", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_p", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_p
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_p", consent_id: "${consent_id}", method: "CREDENTIALS", reauth_cooldown_seconds: 0 }
              as: Consumer
              as_user_id: cons_p
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_p
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL", failure_reason: "CREDENTIALS_INVALID" }
              as: Consumer
              as_user_id: cons_p
            - call: "GET /connections/${conn_id}"
              as: Consumer
              as_user_id: cons_p
              captures: { cf_mid: $.data.consecutive_failures, st_mid: $.data.status }
            - call: "POST /connections/${conn_id}/reauth"
              payload: { valid: true }
              as: Consumer
              as_user_id: cons_p
              captures: { cf_end: $.data.consecutive_failures, st_end: $.data.status }
            - call: "GET /institutions/${inst_id}/breakage_events"
              as: PlatformAdmin
          assert:
            - "Mid-state: consecutive_failures == 1 and status == REAUTH_REQUIRED (forward action incremented the counter)"
            - "After compensating reauth: consecutive_failures == 0 and status == ACTIVE (invariant restored, zero drift)"
            - "reauth_not_before == null after successful reauth"
            - "GET /institutions/${inst_id}/breakage_events still returns exactly 1 event (audit log is append-only and NOT compensated)"
