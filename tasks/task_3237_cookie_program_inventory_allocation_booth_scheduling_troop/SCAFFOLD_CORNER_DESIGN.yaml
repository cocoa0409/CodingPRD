  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_role_header_rejected
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_UNAUTHENTICATED]'
        distinguishing_aspect: "Request without X-User-Role -> 401 ERR_UNAUTHENTICATED, evaluated before any existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cookie-program/seasons"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: priority_auth_beats_not_found
        claim_type: priority_ordering
        grounds:
          - 'validations[priority=1]'
          - 'validations[priority=3]'
        distinguishing_aspect: "Unauthenticated request against a non-existent season id returns ERR_UNAUTHENTICATED, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cookie-program/seasons/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (auth priority 1 beats existence priority 3)"

      - name: blackout_date_blocks_slot_creation
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=8]'
          - entities.BoothLocation.fields.blackout_dates
        distinguishing_aspect: "Slot whose date falls on a location blackout date -> ERR_BOOTH_CONFLICT even with permission granted."
        test_recipe:
          setup: ["Season DRAFT; location with permission true and blackout_dates ['2027-02-14']"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2501", name: "S2501", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
