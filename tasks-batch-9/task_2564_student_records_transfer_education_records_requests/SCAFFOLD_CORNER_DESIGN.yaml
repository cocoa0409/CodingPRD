        distinguishing_aspect: "The same release call fails three ways and then succeeds: from ASSEMBLING with ERR_REQUEST_NOT_READY / 409, from READY_FOR_RELEASE while an EX_PARTE_ORDER sits in RECEIVED with ERR_EX_PARTE_HOLD_ACTIVE / 409, still blocked once that order is merely NOTIFIED, and finally accepted after the order is PRODUCED — proving the block keys on the demand's status set {RECEIVED, NOTIFIED} and not on its mere existence."
