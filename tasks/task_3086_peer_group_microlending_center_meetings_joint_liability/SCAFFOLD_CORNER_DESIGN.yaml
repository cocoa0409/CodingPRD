        distinguishing_aspect: "At cycle 1 the 2% rule yields 92c but the MIN_SAVINGS_CENTS 200 floor wins: the loan's savings_required_cents is 200, and a collection of 92+4600 = 4692c is rejected while 4801c succeeds — the max() floor is observable, not just the percentage."
