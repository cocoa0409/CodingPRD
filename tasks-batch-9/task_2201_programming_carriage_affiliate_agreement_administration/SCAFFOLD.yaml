# =============================================================================
# task_2201 — Programming Carriage & Affiliate Agreement Administration
# Difficulty band: Expert+ (14 entities, 6 state machines, 8 calculations)
# =============================================================================

scenario: |
  2201. Programming Carriage & Affiliate Agreement Administration (cable programming network):
  distribution agreement terms with license fees, penetration requirements, tier placement and
  packaging commitments, subscriber reporting from distributors with audit rights and
  underreporting recovery, rate escalators, most favored nations clauses and rate card
  administration across distributors, content rights allocation across linear, video on demand,
  streaming and international with windowing rules, marketing support commitments, launch fees
  and cooperative advertising, program substitution, blackout and territorial restriction
  enforcement, contract renewal with negotiation leverage analysis and distribution loss
  modeling, revenue recognition and receivable management by distributor

domain_name: carriage-affiliate-admin
api_prefix: /carriage

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under
  # /carriage; parentage is expressed by FK fields in request bodies, never by
  # nested URL paths. Distributor is the only "root" in the domain sense, but it
  # owns nothing structurally — CarriageAgreement carries `distributor_id`.

  state_machine_shape: parallel
  # CarriageAgreement carries two independent dimensions (lifecycle_status ×
  # renewal_status). SubscriberReport is cyclic (ACCEPTED → AUDIT_ADJUSTED →
  # ACCEPTED; DISPUTED → RESTATED). RightsWindow is branching with revert
  # (CLEARED ↔ BLOCKED). AuditEngagement is branching fork (FINDINGS_ISSUED vs
  # CLOSED_NO_FINDING). Invoice is branching with a compensating VOID.

  relationship_patterns:
    - one_to_many          # CarriageAgreement → SubscriberReport / RightsWindow / BlackoutRule
    - many_to_many         # RightsWindow associates CarriageAgreement × ContentTitle
    - self_referential     # SubscriberReport.restatement_of_report_id → SubscriberReport.id
    - cross_aggregate      # MfnClause.benchmark_peer_agreement_id points at a peer distributor's agreement
    - polymorphic          # Invoice.invoice_kind switches whether the invoice bills reports or audit recovery

  role_model: segregation_of_duties
  # AffiliateSalesExec negotiates and executes terms but may never accept a
  # SubscriberReport or move an Invoice. AuditManager produces findings but may
  # never invoice the recovery — RevenueAccountant must. DistributorLiaison is
  # entity-backed and may only touch its own Distributor's reports.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:

  # --- 1. Distributor (resource; receivable + credit posture holder) ---------
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the distributing operator", constraints: "1..200 chars; unique across Distributor" }
      - { name: distributor_type, type: enum, source: input, description: "CABLE_MSO | DBS | TELCO | VMVPD", constraints: "required" }
      - { name: rate_card_class, type: enum, source: input, description: "CLASS_A | CLASS_B | CLASS_C — which published rate card column this operator negotiates against" }
      - { name: total_subscribers, type: integer, source: input, description: "Total video subscribers across all tiers; the denominator of penetration", constraints: ">= 1" }
      - { name: credit_limit_cents, type: integer, source: input, default: 100000000, description: "Receivable ceiling before the operator is placed on credit hold", constraints: ">= 0" }
      - { name: receivable_balance_cents, type: integer, source: computed, default: 0, description: "Sum of Invoice.net_due_cents - Invoice.paid_cents over invoices with status IN {ISSUED, PARTIALLY_PAID}" }
      - { name: audit_recovery_balance_cents, type: integer, source: computed, default: 0, description: "Sum of Invoice.net_due_cents - Invoice.paid_cents over invoices with invoice_kind == AUDIT_RECOVERY and status IN {ISSUED, PARTIALLY_PAID}" }
      - { name: executed_agreement_count, type: integer, source: computed, default: 0, description: "Count of CarriageAgreement rows for this distributor with lifecycle_status IN {EXECUTED, SUSPENDED}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CREDIT_HOLD | SUSPENDED | TERMINATED — gates agreement execution and invoice issuance" }
      - { name: credit_hold_reason, type: enum, source: system, default: NONE, description: "NONE | RECEIVABLE_LIMIT_BREACH | AUDIT_RECOVERY_UNPAID | MANUAL_REVIEW" }

  # --- 2. CarriageAgreement (resource; two parallel state dimensions) -------
  - name: CarriageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; the operator this agreement binds" }
      - { name: contract_code, type: string, source: input, description: "Contract reference code", constraints: "unique per (distributor_id, contract_code)" }
      - { name: term_start_date, type: datetime, source: input, description: "First day of contract term (ISO 8601 UTC); escalator anchor" }
      - { name: term_end_date, type: datetime, source: input, description: "Last instant of contract term; must be > term_start_date" }
      - { name: base_license_fee_cents_per_sub, type: number, source: input, description: "Year-one monthly license fee in cents per subscriber, 4 decimal places of a cent", constraints: "> 0" }
      - { name: escalator_pct, type: number, source: input, description: "Annual compounding rate escalator, e.g. 0.04 = 4%/contract-year", constraints: "0 <= escalator_pct <= 0.15" }
      - { name: penetration_floor_pct, type: number, source: input, description: "Minimum share of Distributor.total_subscribers that must receive the network, 4 decimal places", constraints: "0 < penetration_floor_pct <= 1" }
      - { name: committed_tier, type: enum, source: input, description: "BASIC | EXPANDED_BASIC | DIGITAL_TIER | PREMIUM — the packaging tier the operator committed to carry the network on" }
      - { name: launch_fee_cents, type: integer, source: input, default: 0, description: "One-time launch support the network owes on execution", constraints: ">= 0" }
      - { name: marketing_commitment_cents, type: integer, source: input, default: 0, description: "Aggregate marketing/co-op support the network commits over the term", constraints: ">= 0" }
      - { name: lifecycle_status, type: enum, source: system, default: DRAFT, description: "DRAFT | NEGOTIATING | EXECUTED | SUSPENDED | EXPIRED | TERMINATED — dimension 1" }
      - { name: renewal_status, type: enum, source: system, default: NOT_DUE, description: "NOT_DUE | RENEWAL_ANALYSIS | RENEWAL_OFFERED | RENEWED | LAPSED — dimension 2, evolves independently of lifecycle_status" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Increments each time the agreement re-enters NEGOTIATING from DRAFT or from RENEWAL_OFFERED" }
      - { name: escalated_rate_cents_per_sub, type: number, source: computed, description: "base_license_fee_cents_per_sub compounded by escalator_pct for the elapsed contract-year index, 4 dp" }
      - { name: effective_rate_cents_per_sub, type: number, source: computed, description: "escalated_rate_cents_per_sub after any ACTIVE MfnClause cap and rate floor, 4 dp; the rate billed" }
      - { name: mfn_capped, type: boolean, source: computed, default: false, description: "true when effective_rate_cents_per_sub < escalated_rate_cents_per_sub because an MfnClause benchmark bound it" }
      - { name: penetration_compliance_status, type: enum, source: computed, default: UNKNOWN, description: "UNKNOWN | COMPLIANT | BREACH — recomputed from the most recently ACCEPTED SubscriberReport" }
      - { name: penetration_breach_count, type: integer, source: computed, default: 0, description: "Count of accepted reporting periods below penetration_floor_pct since the last reset" }
      - { name: consecutive_compliant_periods, type: integer, source: computed, default: 0, description: "Run length of accepted compliant periods; at 3 it resets penetration_breach_count to 0" }
      - { name: recognized_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of SubscriberReport.license_fee_due_cents over reports with status IN {ACCEPTED, AUDIT_ADJUSTED} for this agreement" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock instant the agreement entered EXECUTED; null before execution" }
      - { name: suspension_reason, type: enum, source: system, default: NONE, description: "NONE | PENETRATION_BREACH | DISTRIBUTOR_CREDIT_HOLD | MANUAL_SUSPENSION" }

  # --- 3. RateCardEntry (configuration; immutable) --------------------------
  - name: RateCardEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "System-assigned identifier; declared explicitly because common_fields is false — a RateCardEntry is addressable but carries NO created_at, updated_at or version, and no endpoint can mutate it" }
      - { name: rate_card_class, type: enum, source: input, description: "CLASS_A | CLASS_B | CLASS_C — the operator class this published rate applies to" }
      - { name: tier, type: enum, source: input, description: "BASIC | EXPANDED_BASIC | DIGITAL_TIER | PREMIUM" }
      - { name: published_rate_cents_per_sub, type: number, source: input, description: "Published card rate in cents per subscriber per month, 4 dp", constraints: "> 0" }
      - { name: min_subscribers, type: integer, source: input, default: 0, description: "Minimum Distributor.total_subscribers for this card row to be quotable" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the card row's validity" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of validity; null means open-ended", constraints: "null or > effective_from" }

  # --- 4. MfnClause (resource; cross-aggregate benchmark) -------------------
  - name: MfnClause
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement whose rate this clause caps" }
      - { name: mfn_scope, type: enum, source: input, description: "DOMESTIC | GLOBAL — DOMESTIC compares only {CABLE_MSO, DBS, TELCO} peers; GLOBAL additionally admits VMVPD peers" }
      - { name: min_peer_subscribers, type: integer, source: input, default: 0, description: "Peers below this Distributor.total_subscribers are excluded from the comparison set" }
      - { name: rate_floor_cents, type: number, source: input, description: "Contractual floor the capped rate may never fall below, 4 dp", constraints: ">= 0" }
      - { name: benchmark_rate_cents, type: number, source: computed, description: "Minimum peer adjusted rate found at last reset; null when benchmark_status == NO_COMPARABLE" }
      - { name: benchmark_peer_agreement_id, type: string, source: computed, description: "FK -> CarriageAgreement.id; the peer agreement whose adjusted rate set benchmark_rate_cents; null when no comparable" }
      - { name: benchmark_status, type: enum, source: computed, default: NOT_EVALUATED, description: "NOT_EVALUATED | BENCHMARKED | NO_COMPARABLE" }
      - { name: last_reset_at, type: datetime, source: system, description: "Logical-clock instant of the most recent benchmark evaluation; null before first reset" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | WAIVED — a WAIVED clause stops capping effective_rate_cents_per_sub" }

  # --- 5. SubscriberReport (event-ish resource; cyclic, self-referential) ---
  - name: SubscriberReport
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement being reported against" }
      - { name: period_month, type: string, source: input, description: "Reporting month in YYYY-MM form", constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: reported_subscribers, type: integer, source: input, description: "Subscribers the distributor reports as receiving the network in this period", constraints: ">= 0" }
      - { name: reported_tier, type: enum, source: input, description: "BASIC | EXPANDED_BASIC | DIGITAL_TIER | PREMIUM — the tier the network was actually packaged on this period" }
      - { name: restatement_of_report_id, type: string, source: input, description: "FK -> SubscriberReport.id; the report this restatement supersedes; null for an original filing" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; the LICENSE_FEE invoice that billed this report; null until billed" }
      - { name: penetration_pct, type: number, source: computed, description: "round(reported_subscribers / Distributor.total_subscribers, 4)" }
      - { name: billable_subscribers, type: integer, source: computed, description: "Subscriber count actually billed; differs from reported_subscribers under the FINAL variant when the penetration floor bites" }
      - { name: rate_applied_cents_per_sub, type: number, source: computed, description: "The effective rate for this report's period_month, 4 dp" }
      - { name: provisional_fee_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant of license_fee_due (reported subscribers only), stamped at submission" }
      - { name: license_fee_due_cents, type: integer, source: computed, default: 0, description: "FINAL variant of the license fee, stamped on acceptance; 0 while status == SUBMITTED" }
      - { name: audit_adjustment_cents, type: integer, source: computed, default: 0, description: "Incremental fee added by an AuditFinding when the report flips to AUDIT_ADJUSTED" }
      - { name: tier_placement_breach, type: boolean, source: computed, default: false, description: "true when tier_rank(reported_tier) < tier_rank(committed_tier) — the network was packaged narrower than committed" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | DISPUTED | RESTATED | ACCEPTED | AUDIT_ADJUSTED | SUPERSEDED" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant of acceptance; null while unaccepted" }

  # --- 6. AuditEngagement (resource; branching fork) ------------------------
  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement under audit" }
      - { name: sample_period_start, type: string, source: input, description: "First audited month, YYYY-MM (inclusive)" }
      - { name: sample_period_end, type: string, source: input, description: "Last audited month, YYYY-MM (inclusive); must be >= sample_period_start" }
      - { name: rate_basis, type: enum, source: input, description: "PERIOD_RATE | CLOSING_RATE — selects the dual variant used to price recovery" }
      - { name: total_variance_subscribers, type: integer, source: computed, default: 0, description: "Sum of AuditFinding.variance_subscribers (negative variances contribute 0)" }
      - { name: total_reported_subscribers, type: integer, source: computed, default: 0, description: "Sum of AuditFinding.reported_subscribers across this engagement's findings" }
      - { name: underreporting_pct, type: number, source: computed, default: 0, description: "round(total_variance_subscribers / total_reported_subscribers, 4); 0 when denominator is 0" }
      - { name: penalty_multiplier, type: number, source: computed, default: 1.0, description: "1.00 | 1.10 | 1.25 selected from underreporting_pct thresholds" }
      - { name: base_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of per-finding rounded recovery before interest and penalty" }
      - { name: interest_cents, type: integer, source: computed, default: 0, description: "Simple interest accrued per finding from period end to findings issuance" }
      - { name: audit_cost_shift_cents, type: integer, source: computed, default: 0, description: "AUDIT_COST_CENTS when underreporting_pct >= AUDIT_COST_SHIFT_THRESHOLD, else 0" }
      - { name: recovery_amount_cents, type: integer, source: computed, default: 0, description: "Final amount recoverable including penalty multiplier and audit cost shift" }
      - { name: recovery_invoice_id, type: string, source: system, description: "FK -> Invoice.id; the AUDIT_RECOVERY invoice raised for this engagement; null until invoiced" }
      - { name: findings_issued_at, type: datetime, source: system, description: "Logical-clock instant findings were issued; null before" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | FIELDWORK | FINDINGS_ISSUED | RECOVERY_INVOICED | COLLECTED | CLOSED_NO_FINDING" }

  # --- 7. AuditFinding (immutable event) -----------------------------------
  - name: AuditFinding
    parent: null
    common_fields: false
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> AuditEngagement.id; the engagement that produced this finding" }
      - { name: subscriber_report_id, type: string, source: input, description: "FK -> SubscriberReport.id; the accepted report this finding contradicts" }
      - { name: period_month, type: string, source: computed, description: "Snapshot of SubscriberReport.period_month at finding creation" }
      - { name: audited_subscribers, type: integer, source: input, description: "Subscriber count the auditor substantiated for the period", constraints: ">= 0" }
      - { name: reported_subscribers, type: integer, source: computed, description: "Snapshot of SubscriberReport.reported_subscribers at finding creation" }
      - { name: variance_subscribers, type: integer, source: computed, description: "max(0, audited_subscribers - reported_subscribers)" }
      - { name: rate_applied_cents_per_sub, type: number, source: computed, description: "Rate used to price this finding under the engagement's rate_basis, 4 dp" }
      - { name: finding_recovery_cents, type: integer, source: computed, description: "Rounded base recovery contributed by this finding, before interest and penalty" }

  # --- 8. ContentTitle (resource; rights inventory) ------------------------
  - name: ContentTitle
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Program or series title", constraints: "1..200 chars" }
      - { name: home_territory_code, type: string, source: input, description: "ISO-3166 alpha-2 territory of first release", constraints: "exactly 2 uppercase letters" }
      - { name: linear_premiere_at, type: datetime, source: input, description: "Logical instant of linear premiere; the anchor for windowing holdback rules" }
      - { name: rights_status, type: enum, source: system, default: PENDING_CLEARANCE, description: "PENDING_CLEARANCE | OWNED_CLEARED | THIRD_PARTY_LICENSED | EXPIRED_RIGHTS" }
      - { name: cleared_window_count, type: integer, source: computed, default: 0, description: "Count of RightsWindow rows for this title with status IN {CLEARED, ACTIVE}" }
      - { name: distribution_coverage_status, type: enum, source: computed, default: UNDISTRIBUTED, description: "UNDISTRIBUTED | LINEAR_ONLY | MULTIPLATFORM | EXCLUSIVE_UNCLEARED — derived by this PINNED ladder over P = the set of distinct RightsWindow.platform values for this title whose window status IN {CLEARED, ACTIVE}, evaluated top-down and stopping at the first match: (1) |P| == 0 -> UNDISTRIBUTED; (2) P == {LINEAR} -> LINEAR_ONLY; (3) |P| >= 2 -> MULTIPLATFORM; (4) |P| == 1 and P != {LINEAR} -> EXCLUSIVE_UNCLEARED, meaning a downstream platform is cleared while the linear window that is supposed to precede it is not. The ladder is total: every title matches exactly one arm" }

  # --- 9. RightsWindow (resource; branching with revert; half-open interval) -
  - name: RightsWindow
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement that grants this window" }
      - { name: content_title_id, type: string, source: input, description: "FK -> ContentTitle.id; the title being licensed" }
      - { name: platform, type: enum, source: input, description: "LINEAR | VOD | STREAMING | INTERNATIONAL" }
      - { name: territory_code, type: string, source: input, description: "ISO-3166 alpha-2 territory the window covers", constraints: "exactly 2 uppercase letters" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the licensed window" }
      - { name: window_end, type: datetime, source: input, description: "EXCLUSIVE end of the licensed window — occupancy is the half-open interval [window_start, window_end)", constraints: "> window_start" }
      - { name: exclusivity, type: enum, source: input, description: "EXCLUSIVE | NON_EXCLUSIVE" }
      - { name: windowing_holdback_days, type: integer, source: computed, description: "floor((window_start - ContentTitle.linear_premiere_at) / 86400s); may be negative for pre-premiere windows" }
      - { name: concurrent_licensee_count, type: integer, source: computed, default: 0, description: "Count of other RightsWindow rows with status IN {CLEARED, ACTIVE} sharing (content_title_id, platform, territory_code) and overlapping this window's half-open interval" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | CLEARED | ACTIVE | BLOCKED | EXPIRED" }
      - { name: block_reason, type: enum, source: system, default: NONE, description: "NONE | AGREEMENT_SUSPENDED | BLACKOUT_CONFLICT | RIGHTS_LAPSED | MANUAL_BLOCK" }

  # --- 10. BlackoutRule (resource; closed interval with separation buffer) ---
  - name: BlackoutRule
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement whose territorial restriction this enforces" }
      - { name: territory_code, type: string, source: input, description: "ISO-3166 alpha-2 territory blacked out", constraints: "exactly 2 uppercase letters" }
      - { name: blackout_start, type: datetime, source: input, description: "INCLUSIVE start of the blackout" }
      - { name: blackout_end, type: datetime, source: input, description: "INCLUSIVE end of the blackout — occupancy is the closed interval [blackout_start, blackout_end]", constraints: "> blackout_start" }
      - { name: substitution_required, type: boolean, source: input, default: true, description: "Whether the distributor must run substitute programming during the blackout" }
      - { name: substitute_content_title_id, type: string, source: input, description: "FK -> ContentTitle.id; the substitution feed; required when substitution_required is true" }
      - { name: blackout_hours, type: number, source: computed, description: "(blackout_end - blackout_start) in hours, 2 dp" }
      - { name: monthly_blackout_hours, type: number, source: computed, description: "Total blackout_hours of SCHEDULED/ENFORCED rules sharing (distributor of agreement, territory_code) whose blackout_start falls in the same calendar month, including this row" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ENFORCED | WAIVED | EXPIRED" }
      - { name: enforced_at, type: datetime, source: system, description: "Logical instant enforcement was recorded; null while SCHEDULED" }

  # --- 11. MarketingCommitment (resource; conserved-quantity ledger) --------
  - name: MarketingCommitment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement funding this commitment" }
      - { name: commitment_type, type: enum, source: input, description: "LAUNCH_FEE | COOP_ADVERTISING | MARKETING_SUPPORT" }
      - { name: committed_cents, type: integer, source: input, description: "Total dollars committed by the network under this line", constraints: "> 0" }
      - { name: performance_deadline, type: datetime, source: input, description: "Instant after which unearned commitment is forfeited" }
      - { name: earned_cents, type: integer, source: computed, default: 0, description: "Cumulative dollars the distributor has earned via accepted proof of performance" }
      - { name: earned_unbilled_cents, type: integer, source: computed, default: 0, description: "earned_cents - billed_cents; the pool an Invoice may offset against" }
      - { name: billed_cents, type: integer, source: computed, default: 0, description: "Portion of earned_cents already consumed as an Invoice offset" }
      - { name: forfeited_cents, type: integer, source: computed, default: 0, description: "Portion permanently lost because the performance_deadline passed unearned" }
      - { name: remaining_cents, type: integer, source: computed, description: "committed_cents - earned_cents - forfeited_cents; the conserved-quantity residual" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PARTIALLY_EARNED | EARNED | FORFEITED | SETTLED" }

  # --- 12. Invoice (resource; branching with compensating VOID) -------------
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; the operator billed" }
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement billed" }
      - { name: period_month, type: string, source: input, description: "Billed month in YYYY-MM form; for AUDIT_RECOVERY invoices the month findings were issued" }
      - { name: invoice_kind, type: enum, source: input, description: "LICENSE_FEE | AUDIT_RECOVERY — selects which source rows populate the gross amount" }
      - { name: audit_engagement_id, type: string, source: input, description: "FK -> AuditEngagement.id; required when invoice_kind == AUDIT_RECOVERY, null otherwise" }
      - { name: gross_license_fee_cents, type: integer, source: computed, default: 0, description: "Step 1 of net-due evaluation; sum of source-row amounts" }
      - { name: coop_cap_pct, type: number, source: computed, default: 0, description: "Step 2; co-op offset ceiling percentage selected from the gross_license_fee_cents band" }
      - { name: coop_offset_cents, type: integer, source: computed, default: 0, description: "Step 3; co-op/marketing offset actually applied" }
      - { name: launch_fee_offset_cents, type: integer, source: computed, default: 0, description: "Step 4; launch-fee offset applied after the co-op offset consumes its share" }
      - { name: recovery_adjustment_cents, type: integer, source: computed, default: 0, description: "Step 5; audit adjustments folded into this invoice" }
      - { name: net_due_cents, type: integer, source: computed, default: 0, description: "Step 6; floored at 0" }
      - { name: carryforward_cents, type: integer, source: computed, default: 0, description: "Offset value that could not be applied because net_due_cents floored at 0" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Cumulative cash applied to this invoice" }
      - { name: issued_at, type: datetime, source: system, description: "Logical instant of issuance; null while DRAFT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | WRITTEN_OFF | VOID" }

  # --- 13. RenewalAnalysis (immutable projection) ---------------------------
  - name: RenewalAnalysis
    parent: null
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> CarriageAgreement.id; the agreement being modelled for renewal" }
      - { name: variant, type: enum, source: input, description: "BASE_CASE | DOWNSIDE — selects the churn-recapture assumption" }
      - { name: latest_accepted_report_id, type: string, source: computed, description: "FK -> SubscriberReport.id; the report whose penetration_pct drove the model; null when the agreement has none" }
      - { name: subscriber_share, type: number, source: computed, description: "round(Distributor.total_subscribers / TOTAL_ADDRESSABLE_SUBS, 6)" }
      - { name: penetration_ratio, type: number, source: computed, description: "round(min(latest penetration_pct / penetration_floor_pct, 2.0), 4)" }
      - { name: payment_score, type: number, source: computed, description: "round(1 - clamp(receivable_balance_cents / credit_limit_cents, 0, 1), 4)" }
      - { name: compliance_score, type: number, source: computed, description: "round(1 - clamp(penetration_breach_count / 3, 0, 1), 4)" }
      - { name: leverage_score, type: number, source: computed, description: "Weighted 0..100 negotiation-leverage index, 2 dp" }
      - { name: distribution_loss_subscribers, type: integer, source: computed, description: "Modelled net subscriber loss if the agreement lapses, under the chosen variant" }
      - { name: annualized_revenue_at_risk_cents, type: integer, source: computed, description: "distribution_loss_subscribers * effective_rate_cents_per_sub * 12, rounded to whole cents" }

  # --- 14. LogicalClock (singleton configuration for deterministic time) ----
  - name: LogicalClock
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: input, description: "The server's logical now; startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time" }
      - { name: set_count, type: integer, source: computed, default: 0, description: "Number of times the clock has been advanced since startup" }

# =============================================================================
# Table 1.2: State Machine Table
#
# Six machines. CarriageAgreement carries TWO independent dimensions
# (lifecycle_status × renewal_status) that evolve on separate endpoints.
# SubscriberReport is cyclic. RightsWindow is branching-with-revert.
# AuditEngagement forks. Invoice branches and supports a compensating VOID.
# =============================================================================
state_machines:

  # --- SM1: CarriageAgreement.lifecycle_status (dimension 1, cyclic) --------
  - entity: CarriageAgreement
    dimension: lifecycle_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: NEGOTIATING
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=SUBMIT_FOR_NEGOTIATION"
        actor: AffiliateSalesExec
        preconditions:
          - "lifecycle_status == DRAFT"
          - "term_end_date > LogicalClock.current_utc"
          - "Distributor.status IN {ACTIVE, CREDIT_HOLD} (a TERMINATED or SUSPENDED operator cannot open negotiations)"
        side_effects:
          - "negotiation_round += 1"
          - "recompute escalated_rate_cents_per_sub and effective_rate_cents_per_sub per calculations.agreement_effective_rate"
          - "updated_at refreshed; version += 1"

      - from: NEGOTIATING
        to: DRAFT
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=RETURN_TO_DRAFT"
        actor: AffiliateSalesExec
        preconditions:
          - "lifecycle_status == NEGOTIATING"
        side_effects:
          - "no change to negotiation_round (it counts entries into NEGOTIATING, not exits)"
          - "updated_at refreshed; version += 1"
        note: "The DRAFT ↔ NEGOTIATING revision loop is the cycle in this machine; each re-entry bumps negotiation_round, so round count is observable."

      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=EXECUTE"
        actor: AffiliateSalesExec
        preconditions:
          - "lifecycle_status == NEGOTIATING"
          - "Distributor.status == ACTIVE (cross-entity: a CREDIT_HOLD operator cannot have a new agreement executed)"
          - "term_start_date <= LogicalClock.current_utc < term_end_date"
          - "penetration_floor_pct * Distributor.total_subscribers >= 1 (the floor must bind at least one subscriber)"
        side_effects:
          - "executed_at = LogicalClock.current_utc"
          - "recompute escalated_rate_cents_per_sub and effective_rate_cents_per_sub"
          - "Distributor.executed_agreement_count += 1"
          - "if launch_fee_cents > 0, create a MarketingCommitment with commitment_type=LAUNCH_FEE, committed_cents=launch_fee_cents, performance_deadline = executed_at + LAUNCH_FEE_PERFORMANCE_DAYS days, status=OPEN"
          - "if marketing_commitment_cents > 0, create a MarketingCommitment with commitment_type=MARKETING_SUPPORT, committed_cents=marketing_commitment_cents, performance_deadline = term_end_date, status=OPEN"
          - "updated_at refreshed; version += 1"

      - from: EXECUTED
        to: SUSPENDED
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=SUSPEND (manual) OR system event: penetration_breach_count reaches PENETRATION_BREACH_SUSPEND_THRESHOLD on report acceptance OR system event: owning Distributor enters CREDIT_HOLD"
        actor: AffiliateSalesExec | system
        preconditions:
          - "lifecycle_status == EXECUTED"
        side_effects:
          - "suspension_reason = MANUAL_SUSPENSION for the operator-triggered form, PENETRATION_BREACH for the breach-threshold form, DISTRIBUTOR_CREDIT_HOLD for the credit form"
          - "CASCADE LINK: because the agreement entered SUSPENDED, every RightsWindow with agreement_id == this.id and status IN {CLEARED, ACTIVE} transitions to BLOCKED with block_reason = AGREEMENT_SUSPENDED, processed in window_start ASC, then created_at ASC order"
          - "CASCADE LINK: because those windows left {CLEARED, ACTIVE}, each affected ContentTitle recomputes cleared_window_count and distribution_coverage_status"
          - "updated_at refreshed; version += 1"

      - from: SUSPENDED
        to: EXECUTED
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=REINSTATE"
        actor: AffiliateSalesExec
        preconditions:
          - "lifecycle_status == SUSPENDED"
          - "Distributor.status == ACTIVE (a still-held operator cannot be reinstated)"
          - "if suspension_reason == PENETRATION_BREACH then penetration_breach_count must have been reset to 0 by three consecutive compliant periods, or the reinstating call must be preceded by a manual credit review that cleared it"
          - "term_end_date > LogicalClock.current_utc"
        side_effects:
          - "suspension_reason = NONE"
          - "COMPENSATION: every RightsWindow of this agreement whose status == BLOCKED and block_reason == AGREEMENT_SUSPENDED returns to CLEARED, provided re-clearing still satisfies calculations.rights_window_occupancy; a window that would now collide stays BLOCKED with block_reason = BLACKOUT_CONFLICT"
          - "CASCADE LINK: each ContentTitle touched by an un-blocked window recomputes cleared_window_count and distribution_coverage_status"
          - "updated_at refreshed; version += 1"

      - from: EXECUTED
        to: EXPIRED
        trigger: "System event on POST /_clock/set_current_utc when term_end_date <= LogicalClock.current_utc"
        actor: system
        preconditions:
          - "lifecycle_status == EXECUTED"
          - "term_end_date <= LogicalClock.current_utc"
          - "renewal_status != RENEWED"
        side_effects:
          - "Distributor.executed_agreement_count -= 1"
          - "renewal_status transitions to LAPSED when it was RENEWAL_ANALYSIS or RENEWAL_OFFERED at expiry"
          - "every RightsWindow of this agreement with status IN {PLANNED, CLEARED, ACTIVE} transitions to EXPIRED"
          - "every MarketingCommitment of this agreement with remaining_cents > 0 has forfeited_cents += remaining_cents and status = FORFEITED"
          - "updated_at refreshed; version += 1"

      - from: SUSPENDED
        to: EXPIRED
        trigger: "System event on POST /_clock/set_current_utc when term_end_date <= LogicalClock.current_utc"
        actor: system
        preconditions:
          - "lifecycle_status == SUSPENDED"
          - "term_end_date <= LogicalClock.current_utc"
        side_effects:
          - "Distributor.executed_agreement_count -= 1"
          - "every RightsWindow of this agreement with status IN {PLANNED, CLEARED, ACTIVE, BLOCKED} transitions to EXPIRED"
          - "updated_at refreshed; version += 1"

      - from: NEGOTIATING
        to: TERMINATED
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=TERMINATE"
        actor: AffiliateSalesExec
        preconditions:
          - "lifecycle_status == NEGOTIATING"
        side_effects:
          - "renewal_status set to LAPSED when it was RENEWAL_ANALYSIS or RENEWAL_OFFERED"
          - "updated_at refreshed; version += 1"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /carriage/agreements/{agreementId}/lifecycle with action=TERMINATE"
        actor: AffiliateSalesExec
        preconditions:
          - "lifecycle_status == SUSPENDED"
          - "no Invoice for this agreement has status IN {ISSUED, PARTIALLY_PAID} (open receivables must be resolved before termination)"
        side_effects:
          - "every RightsWindow of this agreement with status IN {PLANNED, CLEARED, ACTIVE, BLOCKED} transitions to EXPIRED"
          - "every MarketingCommitment with remaining_cents > 0 has forfeited_cents += remaining_cents and status = FORFEITED"
          - "Distributor.executed_agreement_count -= 1"
          - "updated_at refreshed; version += 1"

  # --- SM2: CarriageAgreement.renewal_status (dimension 2, independent) -----
  - entity: CarriageAgreement
    dimension: renewal_status
    initial_state: NOT_DUE
    terminal_states: [RENEWED, LAPSED]
    transitions:
      - from: NOT_DUE
        to: RENEWAL_ANALYSIS
        trigger: "POST /carriage/agreements/{agreementId}/renewal with action=START_ANALYSIS"
        actor: AffiliateSalesExec
        preconditions:
          - "renewal_status == NOT_DUE"
          - "lifecycle_status IN {EXECUTED, SUSPENDED} (renewal work is only meaningful on a live or suspended term, and this dimension does NOT care which of the two)"
          - "term_end_date - LogicalClock.current_utc <= RENEWAL_WINDOW_DAYS days"
        side_effects:
          - "updated_at refreshed; version += 1"
        note: "Independent-dimension proof: lifecycle_status is untouched by every transition in SM2, and SM1's transitions never write renewal_status except the two EXPIRED/TERMINATED forced-LAPSE side effects."

      - from: RENEWAL_ANALYSIS
        to: RENEWAL_OFFERED
        trigger: "POST /carriage/agreements/{agreementId}/renewal with action=OFFER"
        actor: AffiliateSalesExec
        preconditions:
          - "renewal_status == RENEWAL_ANALYSIS"
          - "at least one RenewalAnalysis row exists for this agreement (the offer must be evidence-backed)"
        side_effects:
          - "updated_at refreshed; version += 1"

      - from: RENEWAL_OFFERED
        to: RENEWAL_ANALYSIS
        trigger: "POST /carriage/agreements/{agreementId}/renewal with action=REOPEN_ANALYSIS"
        actor: AffiliateSalesExec
        preconditions:
          - "renewal_status == RENEWAL_OFFERED"
        side_effects:
          - "negotiation_round += 1 (a re-opened renewal counts as another negotiation round even though lifecycle_status does not move)"
          - "updated_at refreshed; version += 1"
        note: "Second cycle in the entity: RENEWAL_ANALYSIS ↔ RENEWAL_OFFERED."

      - from: RENEWAL_OFFERED
        to: RENEWED
        trigger: "POST /carriage/agreements/{agreementId}/renewal with action=RENEW"
        actor: AffiliateSalesExec
        preconditions:
          - "renewal_status == RENEWAL_OFFERED"
          - "lifecycle_status == EXECUTED (a SUSPENDED agreement may be analysed and offered but not renewed)"
          - "Distributor.status == ACTIVE"
        side_effects:
          - "term_end_date extended by RENEWAL_TERM_MONTHS months"
          - "recompute escalated_rate_cents_per_sub and effective_rate_cents_per_sub against the new elapsed-contract-year index"
          - "updated_at refreshed; version += 1"

      - from: RENEWAL_OFFERED
        to: LAPSED
        trigger: "POST /carriage/agreements/{agreementId}/renewal with action=LAPSE"
        actor: AffiliateSalesExec
        preconditions:
          - "renewal_status == RENEWAL_OFFERED"
        side_effects:
          - "updated_at refreshed; version += 1"

      - from: RENEWAL_ANALYSIS
        to: LAPSED
        trigger: "System event on POST /_clock/set_current_utc when term_end_date <= current_utc, or POST /carriage/agreements/{agreementId}/lifecycle with action=TERMINATE"
        actor: system | AffiliateSalesExec
        preconditions:
          - "renewal_status == RENEWAL_ANALYSIS"
          - "term_end_date <= LogicalClock.current_utc OR the lifecycle dimension is moving to TERMINATED"
        side_effects:
          - "updated_at refreshed; version += 1"

  # --- SM3: SubscriberReport.status (cyclic; two loops) ---------------------
  - entity: SubscriberReport
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /carriage/subscriber-reports/{reportId}/review with action=ACCEPT"
        actor: RevenueAccountant
        preconditions:
          - "status == SUBMITTED"
          - "CarriageAgreement.lifecycle_status == EXECUTED (cross-entity pair SubscriberReport→CarriageAgreement; a SUSPENDED agreement's reports cannot be accepted)"
          - "period_month falls inside [term_start_date month, term_end_date month] inclusive"
          - "no other SubscriberReport for the same (agreement_id, period_month) has status IN {ACCEPTED, AUDIT_ADJUSTED}"
        side_effects:
          - "billable_subscribers, rate_applied_cents_per_sub and license_fee_due_cents computed under the FINAL variant of calculations.subscriber_report_license_fee"
          - "accepted_at = LogicalClock.current_utc"
          - "CASCADE LINK 1: because this report became ACCEPTED, CarriageAgreement.recognized_revenue_cents += license_fee_due_cents and penetration_compliance_status is re-derived per calculations.agreement_penetration_compliance; a BREACH result does penetration_breach_count += 1 and consecutive_compliant_periods = 0, a COMPLIANT result does consecutive_compliant_periods += 1 and, at PENETRATION_COMPLIANT_RESET_RUN, penetration_breach_count = 0"
          - "CASCADE LINK 2: because penetration_breach_count reached PENETRATION_BREACH_SUSPEND_THRESHOLD, the agreement auto-transitions lifecycle_status EXECUTED → SUSPENDED with suspension_reason = PENETRATION_BREACH"
          - "CASCADE LINK 3: because the agreement entered SUSPENDED, every RightsWindow of that agreement with status IN {CLEARED, ACTIVE} transitions to BLOCKED with block_reason = AGREEMENT_SUSPENDED, in window_start ASC then created_at ASC order"
          - "CASCADE LINK 4: because those windows left {CLEARED, ACTIVE}, each affected ContentTitle recomputes cleared_window_count and distribution_coverage_status; a title left with zero CLEARED/ACTIVE windows that previously held an EXCLUSIVE window becomes EXCLUSIVE_UNCLEARED"
          - "updated_at refreshed; version += 1 on this report and on every entity mutated by the cascade"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /carriage/subscriber-reports/{reportId}/review with action=DISPUTE"
        actor: RevenueAccountant
        preconditions:
          - "status == SUBMITTED"
          - "CarriageAgreement.lifecycle_status IN {EXECUTED, SUSPENDED}"
        side_effects:
          - "license_fee_due_cents stays 0; provisional_fee_cents is retained for accrual reporting"
          - "updated_at refreshed; version += 1"

      - from: DISPUTED
        to: RESTATED
        trigger: "POST /carriage/subscriber-reports/{reportId}/review with action=REQUEST_RESTATEMENT"
        actor: RevenueAccountant
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "the report becomes eligible to be named by a later filing's restatement_of_report_id"
          - "updated_at refreshed; version += 1"

      - from: RESTATED
        to: SUPERSEDED
        trigger: "System event on POST /carriage/subscriber-reports when the new filing carries restatement_of_report_id == this.id"
        actor: system
        preconditions:
          - "status == RESTATED"
          - "the incoming filing's period_month equals this report's period_month"
        side_effects:
          - "no fee is ever recognized against a SUPERSEDED report; CarriageAgreement.recognized_revenue_cents is unaffected because a RESTATED report never contributed"
          - "updated_at refreshed; version += 1"
        note: "Loop 1 of the cycle: SUBMITTED → DISPUTED → RESTATED → SUPERSEDED, with the replacement filing re-entering the machine at SUBMITTED."

      - from: ACCEPTED
        to: AUDIT_ADJUSTED
        trigger: "System event on POST /carriage/audit-engagements/{engagementId}/lifecycle with action=ISSUE_FINDINGS, for each cited report with variance_subscribers > 0"
        actor: system
        preconditions:
          - "status == ACCEPTED"
          - "an AuditFinding exists whose subscriber_report_id == this.id and whose variance_subscribers > 0"
        side_effects:
          - "audit_adjustment_cents = the finding's finding_recovery_cents; license_fee_due_cents += audit_adjustment_cents"
          - "CASCADE LINK: because this report's fee increased, CarriageAgreement.recognized_revenue_cents += audit_adjustment_cents and consecutive_compliant_periods = 0 (an audited period no longer counts toward the compliant run)"
          - "updated_at refreshed; version += 1"

      - from: AUDIT_ADJUSTED
        to: ACCEPTED
        trigger: "POST /carriage/subscriber-reports/{reportId}/review with action=ACCEPT_ADJUSTMENT"
        actor: RevenueAccountant
        preconditions:
          - "status == AUDIT_ADJUSTED"
          - "the owning AuditEngagement.status IN {RECOVERY_INVOICED, COLLECTED} (the adjustment must have been billed before the period is closed back out)"
        side_effects:
          - "audit_adjustment_cents retained; license_fee_due_cents unchanged"
          - "CarriageAgreement.recognized_revenue_cents unchanged (the adjustment was already folded in at AUDIT_ADJUSTED)"
          - "updated_at refreshed; version += 1"
        note: "Loop 2 of the cycle: ACCEPTED → AUDIT_ADJUSTED → ACCEPTED. This is the non-linear shape on SubscriberReport, distinct from CarriageAgreement's parallel-dimension shape."

  # --- SM4: AuditEngagement.status (branching fork-join) --------------------
  - entity: AuditEngagement
    dimension: status
    initial_state: OPENED
    terminal_states: [COLLECTED, CLOSED_NO_FINDING]
    transitions:
      - from: OPENED
        to: FIELDWORK
        trigger: "POST /carriage/audit-engagements/{engagementId}/lifecycle with action=START_FIELDWORK"
        actor: AuditManager
        preconditions:
          - "status == OPENED"
          - "CarriageAgreement.lifecycle_status IN {EXECUTED, SUSPENDED, EXPIRED} (audit rights survive expiry for AUDIT_RIGHTS_SURVIVAL_MONTHS months)"
          - "at least one SubscriberReport with status IN {ACCEPTED, AUDIT_ADJUSTED} exists for the agreement with period_month inside [sample_period_start, sample_period_end]"
        side_effects:
          - "updated_at refreshed; version += 1"

      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /carriage/audit-engagements/{engagementId}/lifecycle with action=ISSUE_FINDINGS"
        actor: AuditManager
        preconditions:
          - "status == FIELDWORK"
          - "at least one AuditFinding exists for this engagement with variance_subscribers > 0 (the zero-variance case must take the CLOSED_NO_FINDING branch instead)"
        side_effects:
          - "findings_issued_at = LogicalClock.current_utc"
          - "total_variance_subscribers, total_reported_subscribers, underreporting_pct, penalty_multiplier, base_recovery_cents, interest_cents, audit_cost_shift_cents and recovery_amount_cents computed per calculations.audit_recovery_amount under this engagement's rate_basis"
          - "CASCADE LINK 1: because recovery was computed, each cited SubscriberReport with variance_subscribers > 0 transitions ACCEPTED → AUDIT_ADJUSTED, taking audit_adjustment_cents = its finding_recovery_cents"
          - "CASCADE LINK 2: because those report fees increased, CarriageAgreement.recognized_revenue_cents increases by the sum of the applied audit_adjustment_cents and consecutive_compliant_periods = 0"
          - "CASCADE LINK 3: because consecutive_compliant_periods dropped below PENETRATION_COMPLIANT_RESET_RUN while penetration_breach_count is unchanged, penetration_compliance_status is re-derived and stays BREACH when penetration_breach_count > 0"
          - "updated_at refreshed; version += 1 on the engagement and on every entity mutated by the cascade"

      - from: FIELDWORK
        to: CLOSED_NO_FINDING
        trigger: "POST /carriage/audit-engagements/{engagementId}/lifecycle with action=CLOSE_NO_FINDING"
        actor: AuditManager
        preconditions:
          - "status == FIELDWORK"
          - "no AuditFinding for this engagement has variance_subscribers > 0 (the empty-variance set is the entry condition for this branch)"
        side_effects:
          - "total_variance_subscribers = 0, underreporting_pct = 0, penalty_multiplier = 1.0, base_recovery_cents = 0, interest_cents = 0, audit_cost_shift_cents = 0, recovery_amount_cents = 0"
          - "no SubscriberReport is touched; CarriageAgreement.recognized_revenue_cents unchanged"
          - "updated_at refreshed; version += 1"
        note: "The fork: FIELDWORK branches to FINDINGS_ISSUED (recovery path, five downstream side effects) or CLOSED_NO_FINDING (zero-recovery path, no cascade). The two branches have disjoint side-effect sets."

      - from: FINDINGS_ISSUED
        to: RECOVERY_INVOICED
        trigger: "System event on POST /carriage/invoices with invoice_kind=AUDIT_RECOVERY and audit_engagement_id == this.id"
        actor: system
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "recovery_invoice_id is null"
          - "recovery_amount_cents > 0"
        side_effects:
          - "recovery_invoice_id set to the created Invoice.id"
          - "updated_at refreshed; version += 1"

      - from: RECOVERY_INVOICED
        to: COLLECTED
        trigger: "System event on POST /carriage/invoices/{invoiceId}/lifecycle with action=RECORD_PAYMENT when the recovery invoice reaches status PAID"
        actor: system
        preconditions:
          - "status == RECOVERY_INVOICED"
          - "the Invoice named by recovery_invoice_id has status == PAID"
        side_effects:
          - "CASCADE LINK: because the recovery invoice is fully paid, Distributor.audit_recovery_balance_cents decreases by the invoice's net_due_cents and, when audit_recovery_balance_cents returns to 0 and receivable_balance_cents <= credit_limit_cents, the Distributor leaves CREDIT_HOLD for ACTIVE with credit_hold_reason = NONE"
          - "updated_at refreshed; version += 1"

      - from: RECOVERY_INVOICED
        to: FINDINGS_ISSUED
        trigger: "System event on POST /carriage/invoices/{invoiceId}/lifecycle with action=VOID when the voided invoice is this engagement's recovery invoice"
        actor: system
        preconditions:
          - "status == RECOVERY_INVOICED"
          - "the Invoice named by recovery_invoice_id has reached status VOID with paid_cents == 0"
        side_effects:
          - "COMPENSATION: recovery_invoice_id cleared to null, so the engagement becomes re-invoiceable at the same recovery_amount_cents; findings_issued_at is NOT re-stamped"
          - "CASCADE LINK: because the recovery invoice left {ISSUED, PARTIALLY_PAID}, Distributor.audit_recovery_balance_cents and receivable_balance_cents both decrease by the voided net_due_cents"
          - "updated_at refreshed; version += 1"

  # --- SM5: RightsWindow.status (branching with revert) ---------------------
  - entity: RightsWindow
    dimension: status
    initial_state: PLANNED
    terminal_states: [EXPIRED]
    transitions:
      - from: PLANNED
        to: CLEARED
        trigger: "POST /carriage/rights-windows/{windowId}/lifecycle with action=CLEAR"
        actor: RightsAdministrator
        preconditions:
          - "status == PLANNED"
          - "ContentTitle.rights_status == OWNED_CLEARED (cross-entity pair RightsWindow→ContentTitle; PENDING_CLEARANCE, THIRD_PARTY_LICENSED and EXPIRED_RIGHTS all block clearance)"
          - "CarriageAgreement.lifecycle_status == EXECUTED"
          - "[window_start, window_end) lies inside [term_start_date, term_end_date)"
          - "windowing_holdback_days >= PLATFORM_HOLDBACK_DAYS[platform]"
          - "the half-open occupancy check of calculations.rights_window_occupancy passes for (content_title_id, platform, territory_code)"
          - "no SCHEDULED or ENFORCED BlackoutRule of the same agreement and territory_code intersects [window_start, window_end)"
        side_effects:
          - "concurrent_licensee_count stamped from the occupancy check"
          - "CASCADE LINK: ContentTitle.cleared_window_count += 1 and ContentTitle.distribution_coverage_status re-derived (LINEAR_ONLY when the only cleared platforms are {LINEAR}, MULTIPLATFORM when two or more distinct platforms are cleared)"
          - "updated_at refreshed; version += 1"

      - from: CLEARED
        to: ACTIVE
        trigger: "System event on POST /_clock/set_current_utc when window_start <= current_utc < window_end"
        actor: system
        preconditions:
          - "status == CLEARED"
          - "window_start <= LogicalClock.current_utc < window_end"
          - "CarriageAgreement.lifecycle_status == EXECUTED"
        side_effects:
          - "updated_at refreshed; version += 1"

      - from: CLEARED
        to: BLOCKED
        trigger: "POST /carriage/rights-windows/{windowId}/lifecycle with action=BLOCK, or system event when the owning agreement enters SUSPENDED, or system event when a BlackoutRule covering the window is enforced"
        actor: RightsAdministrator | system
        preconditions:
          - "status == CLEARED"
        side_effects:
          - "block_reason = MANUAL_BLOCK, AGREEMENT_SUSPENDED, or BLACKOUT_CONFLICT depending on the trigger"
          - "CASCADE LINK: ContentTitle.cleared_window_count -= 1 and distribution_coverage_status re-derived; a title dropping to zero cleared windows that held an EXCLUSIVE window becomes EXCLUSIVE_UNCLEARED, otherwise UNDISTRIBUTED"
          - "updated_at refreshed; version += 1"

      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /carriage/rights-windows/{windowId}/lifecycle with action=BLOCK, or system event when the owning agreement enters SUSPENDED, or system event when a BlackoutRule covering the window is enforced"
        actor: RightsAdministrator | system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "block_reason set as above"
          - "CASCADE LINK: ContentTitle.cleared_window_count -= 1 and distribution_coverage_status re-derived"
          - "updated_at refreshed; version += 1"

      - from: BLOCKED
        to: CLEARED
        trigger: "POST /carriage/rights-windows/{windowId}/lifecycle with action=UNBLOCK, or system compensation when the owning agreement is REINSTATEd"
        actor: RightsAdministrator | system
        preconditions:
          - "status == BLOCKED"
          - "CarriageAgreement.lifecycle_status == EXECUTED"
          - "ContentTitle.rights_status == OWNED_CLEARED"
          - "re-clearing still satisfies calculations.rights_window_occupancy and no SCHEDULED/ENFORCED BlackoutRule intersects the window"
        side_effects:
          - "block_reason = NONE"
          - "COMPENSATION INVARIANT: ContentTitle.cleared_window_count += 1, restoring the pre-block value exactly; block-then-unblock leaves cleared_window_count and distribution_coverage_status identical to their pre-block values"
          - "updated_at refreshed; version += 1"

      - from: CLEARED
        to: EXPIRED
        trigger: "System event on POST /_clock/set_current_utc when window_end <= current_utc"
        actor: system
        preconditions: ["status == CLEARED", "window_end <= LogicalClock.current_utc"]
        side_effects:
          - "ContentTitle.cleared_window_count -= 1 and distribution_coverage_status re-derived"
          - "updated_at refreshed; version += 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "System event on POST /_clock/set_current_utc when window_end <= current_utc"
        actor: system
        preconditions: ["status == ACTIVE", "window_end <= LogicalClock.current_utc"]
        side_effects:
          - "ContentTitle.cleared_window_count -= 1 and distribution_coverage_status re-derived"
          - "updated_at refreshed; version += 1"

      - from: PLANNED
        to: EXPIRED
        trigger: "System event on POST /_clock/set_current_utc when window_end <= current_utc, or when the owning agreement reaches EXPIRED/TERMINATED"
        actor: system
        preconditions: ["status == PLANNED"]
        side_effects: ["updated_at refreshed; version += 1"]

      - from: BLOCKED
        to: EXPIRED
        trigger: "System event when the owning agreement reaches EXPIRED or TERMINATED"
        actor: system
        preconditions: ["status == BLOCKED"]
        side_effects: ["updated_at refreshed; version += 1"]

  # --- SM6: Invoice.status (branching + compensating VOID) ------------------
  - entity: Invoice
    dimension: status
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=ISSUE"
        actor: RevenueAccountant
        preconditions:
          - "status == DRAFT"
          - "Distributor.status == ACTIVE (cross-entity pair Invoice→Distributor; a CREDIT_HOLD operator cannot receive a new LICENSE_FEE invoice, though an AUDIT_RECOVERY invoice may still be issued)"
          - "net_due_cents > 0"
        side_effects:
          - "issued_at = LogicalClock.current_utc"
          - "each MarketingCommitment consumed as an offset has billed_cents += the consumed amount and earned_unbilled_cents recomputed; status becomes SETTLED when remaining_cents == 0 and earned_unbilled_cents == 0"
          - "each SubscriberReport folded into gross_license_fee_cents has invoice_id set to this Invoice.id"
          - "CASCADE LINK 1: because the invoice is now outstanding, Distributor.receivable_balance_cents += net_due_cents (and audit_recovery_balance_cents += net_due_cents when invoice_kind == AUDIT_RECOVERY)"
          - "CASCADE LINK 2: because receivable_balance_cents now exceeds credit_limit_cents, the Distributor transitions ACTIVE → CREDIT_HOLD with credit_hold_reason = RECEIVABLE_LIMIT_BREACH"
          - "CASCADE LINK 3: because the Distributor entered CREDIT_HOLD, every CarriageAgreement of that distributor with lifecycle_status == EXECUTED transitions to SUSPENDED with suspension_reason = DISTRIBUTOR_CREDIT_HOLD, processed in created_at ASC order"
          - "CASCADE LINK 4: because those agreements entered SUSPENDED, their RightsWindow rows with status IN {CLEARED, ACTIVE} transition to BLOCKED with block_reason = AGREEMENT_SUSPENDED"
          - "CASCADE LINK 5: because those windows left {CLEARED, ACTIVE}, each affected ContentTitle recomputes cleared_window_count and distribution_coverage_status"
          - "updated_at refreshed; version += 1 on the invoice and every entity mutated by the cascade"

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=RECORD_PAYMENT and 0 < amount_cents < net_due_cents - paid_cents"
        actor: RevenueAccountant
        preconditions:
          - "status == ISSUED"
          - "amount_cents > 0 and paid_cents + amount_cents < net_due_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "Distributor.receivable_balance_cents -= amount_cents (and audit_recovery_balance_cents -= amount_cents when invoice_kind == AUDIT_RECOVERY)"
          - "updated_at refreshed; version += 1"

      - from: ISSUED
        to: PAID
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=RECORD_PAYMENT and amount_cents == net_due_cents - paid_cents"
        actor: RevenueAccountant
        preconditions:
          - "status == ISSUED"
          - "paid_cents + amount_cents == net_due_cents"
        side_effects:
          - "paid_cents = net_due_cents"
          - "Distributor.receivable_balance_cents -= amount_cents"
          - "when invoice_kind == AUDIT_RECOVERY, Distributor.audit_recovery_balance_cents -= amount_cents and the owning AuditEngagement transitions RECOVERY_INVOICED → COLLECTED"
          - "when receivable_balance_cents <= credit_limit_cents and audit_recovery_balance_cents == 0, the Distributor leaves CREDIT_HOLD for ACTIVE with credit_hold_reason = NONE"
          - "updated_at refreshed; version += 1"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=RECORD_PAYMENT closing the balance"
        actor: RevenueAccountant
        preconditions:
          - "status == PARTIALLY_PAID"
          - "paid_cents + amount_cents == net_due_cents"
        side_effects:
          - "paid_cents = net_due_cents"
          - "Distributor.receivable_balance_cents -= amount_cents; audit_recovery_balance_cents -= amount_cents when invoice_kind == AUDIT_RECOVERY"
          - "the owning AuditEngagement transitions RECOVERY_INVOICED → COLLECTED when invoice_kind == AUDIT_RECOVERY"
          - "updated_at refreshed; version += 1"

      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=WRITE_OFF"
        actor: RevenueAccountant
        preconditions:
          - "status == PARTIALLY_PAID"
          - "LogicalClock.current_utc >= issued_at + WRITE_OFF_AGE_DAYS days"
        side_effects:
          - "Distributor.receivable_balance_cents -= (net_due_cents - paid_cents); audit_recovery_balance_cents adjusted identically when invoice_kind == AUDIT_RECOVERY"
          - "CarriageAgreement.recognized_revenue_cents is NOT reduced — a write-off is a credit-loss event, not a revenue reversal"
          - "updated_at refreshed; version += 1"

      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=WRITE_OFF"
        actor: RevenueAccountant
        preconditions:
          - "status == ISSUED"
          - "LogicalClock.current_utc >= issued_at + WRITE_OFF_AGE_DAYS days"
        side_effects:
          - "Distributor.receivable_balance_cents -= (net_due_cents - paid_cents)"
          - "updated_at refreshed; version += 1"

      - from: DRAFT
        to: VOID
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=VOID"
        actor: RevenueAccountant
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "COMPENSATION INVARIANT: nothing to restore on the marketing ledger — a DRAFT invoice only PROJECTS its offsets, so billed_cents and earned_unbilled_cents are untouched at creation and therefore untouched at void; committed_cents == earned_cents + remaining_cents + forfeited_cents holds unchanged across both calls"
          - "SubscriberReport.invoice_id is untouched and stays null: a DRAFT never claims its source reports, which is why two DRAFT invoices for one period may coexist and only the first ISSUE claims the reports (validations priority 81 then rejects the second)"
          - "Distributor.receivable_balance_cents unchanged (a DRAFT invoice never entered the receivable)"
          - "updated_at refreshed; version += 1"

      - from: ISSUED
        to: VOID
        trigger: "POST /carriage/invoices/{invoiceId}/lifecycle with action=VOID"
        actor: RevenueAccountant
        preconditions:
          - "status == ISSUED"
          - "paid_cents == 0 (a partially collected invoice must be written off, never voided)"
        side_effects:
          - "COMPENSATION INVARIANT: Distributor.receivable_balance_cents -= net_due_cents, restoring the pre-issue balance exactly; audit_recovery_balance_cents adjusted identically when invoice_kind == AUDIT_RECOVERY"
          - "COMPENSATION INVARIANT: every MarketingCommitment offset consumed by this invoice has billed_cents restored and earned_unbilled_cents restored, so committed_cents == earned_cents + remaining_cents + forfeited_cents is preserved and earned_unbilled_cents returns to its pre-issue value"
          - "SubscriberReport.invoice_id cleared on every report this invoice billed"
          - "when receivable_balance_cents falls back to <= credit_limit_cents and audit_recovery_balance_cents == 0, the Distributor leaves CREDIT_HOLD for ACTIVE with credit_hold_reason = NONE; agreements suspended with suspension_reason = DISTRIBUTOR_CREDIT_HOLD are NOT auto-reinstated and require an explicit REINSTATE call"
          - "the owning AuditEngagement returns RECOVERY_INVOICED → FINDINGS_ISSUED with recovery_invoice_id cleared when invoice_kind == AUDIT_RECOVERY"
          - "updated_at refreshed; version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-agreement
    parent_entity: CarriageAgreement
    write_endpoint: "POST /carriage/subscriber-reports"
    occ_field: "expected_agreement_version"
    description: |
      Filing a SubscriberReport against a CarriageAgreement whose version has
      advanced since the client last observed it is rejected. This captures the
      create-with-supersede case: a restatement filing legitimately supersedes
      the RESTATED report it names, and an accepted filing shifts the
      agreement's recognized_revenue_cents, penetration_compliance_status and
      possibly its lifecycle_status. A filer holding a stale view of the
      agreement would supersede or bill against terms that no longer hold, so
      the stale expected_agreement_version is refused outright.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-distributor
    parent_entity: Distributor
    write_endpoint: "POST /carriage/invoices"
    occ_field: "expected_distributor_version"
    description: |
      Drafting an Invoice against a Distributor whose version has advanced
      since the client last observed it is rejected. A new draft legitimately
      supersedes an earlier unissued draft's claim on the same reports and on
      the same MarketingCommitment offset pool, so the natural product
      semantics would let a second draft succeed; the stale
      expected_distributor_version is what makes the outcome deterministic when
      the operator's receivable_balance_cents, credit posture or
      audit_recovery_balance_cents has moved underneath the drafter.
    error_id: ERR_STALE_DISTRIBUTOR_VERSION
    http_status: 412

  - rule_id: mfn-reset-stale-agreement
    parent_entity: CarriageAgreement
    write_endpoint: "POST /carriage/mfn-clauses/{mfnClauseId}/reset"
    occ_field: "expected_agreement_version"
    description: |
      Resetting an MfnClause benchmark against a CarriageAgreement whose
      version has advanced since the client last observed it is rejected. A
      reset legitimately supersedes the prior benchmark and rewrites the
      agreement's effective_rate_cents_per_sub, unbilled report fees and
      recognized_revenue_cents; running it from a stale view of the agreement
      would re-price periods the client never saw. The stale
      expected_agreement_version is therefore refused.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
#
# Shared domain constants referenced by name across the calculations below.
#   TIER_MULTIPLIER  = { BASIC: 1.00, EXPANDED_BASIC: 1.00, DIGITAL_TIER: 0.85, PREMIUM: 0.60 }
#   TIER_RANK        = { BASIC: 4, EXPANDED_BASIC: 3, DIGITAL_TIER: 2, PREMIUM: 1 }  (higher rank = broader carriage)
#   RATE_PRECISION   = 4 decimal places of a cent, round_half_up
#   MONEY_PRECISION  = whole cents, round_half_up
# =============================================================================
calculations:

  # --- C1: agreement effective rate (escalator + MFN cap + floor) ----------
  - name: agreement_effective_rate
    trigger: "On POST /carriage/agreements/{agreementId}/lifecycle (actions SUBMIT_FOR_NEGOTIATION, EXECUTE), on POST /carriage/agreements/{agreementId}/renewal (action RENEW), on POST /carriage/mfn-clauses/{mfnClauseId}/reset, and as an input to calculations.subscriber_report_license_fee for a specific period_month"
    algorithm: threshold
    formula: |
      # `as_of_month_first_day` = first day of the period being priced, 00:00:00Z.
      # For agreement-level stamping it is the first day of the month containing
      # LogicalClock.current_utc; for report pricing it is the first day of
      # SubscriberReport.period_month.
      elapsed_days        = floor((as_of_month_first_day - agreement.term_start_date) / 86400 seconds)
      contract_year_index = max(0, floor(elapsed_days / CONTRACT_YEAR_DAYS))
      escalated_rate      = round_half_up(
                              agreement.base_license_fee_cents_per_sub
                              * (1 + agreement.escalator_pct) ** contract_year_index,
                              RATE_PRECISION)

      # MFN cap. Only ONE MfnClause per agreement may have status == ACTIVE
      # (enforced by validations priority 64). When none is ACTIVE, or the
      # ACTIVE clause has benchmark_status != BENCHMARKED, the cap does not bite.
      if exists MfnClause c with c.agreement_id == agreement.id
                             and c.status == ACTIVE
                             and c.benchmark_status == BENCHMARKED:
          capped        = max(min(escalated_rate, c.benchmark_rate_cents), c.rate_floor_cents)
          effective     = round_half_up(capped, RATE_PRECISION)
          mfn_capped    = (effective < escalated_rate)
      else:
          effective     = escalated_rate
          mfn_capped    = false
    input_set: "One CarriageAgreement plus at most one MfnClause with status == ACTIVE and benchmark_status == BENCHMARKED. Clauses with status == WAIVED or benchmark_status IN {NOT_EVALUATED, NO_COMPARABLE} are excluded from the cap."
    constants:
      CONTRACT_YEAR_DAYS: 365
      RATE_PRECISION: 4
    precision: "4 decimal places of a cent, round_half_up"
    outputs: ["CarriageAgreement.escalated_rate_cents_per_sub", "CarriageAgreement.effective_rate_cents_per_sub", "CarriageAgreement.mfn_capped"]

  # --- C2: subscriber report license fee (DUAL VARIANT + pinned rounding) --
  - name: subscriber_report_license_fee
    trigger: "PROVISIONAL variant on POST /carriage/subscriber-reports (stamps provisional_fee_cents); FINAL variant on POST /carriage/subscriber-reports/{reportId}/review with action=ACCEPT (stamps billable_subscribers, rate_applied_cents_per_sub and license_fee_due_cents)"
    algorithm: tiered_pricing
    formula: |
      distributor      = Distributor named by agreement.distributor_id
      penetration_pct  = round_half_up(report.reported_subscribers / distributor.total_subscribers, 4)
      floor_subscribers = floor(agreement.penetration_floor_pct * distributor.total_subscribers)
      rate_applied     = calculations.agreement_effective_rate evaluated with
                         as_of_month_first_day = first day of report.period_month
      tier_mult        = TIER_MULTIPLIER[report.reported_tier]
      tier_breach      = TIER_RANK[report.reported_tier] < TIER_RANK[agreement.committed_tier]

      # ---- variant selection: the ONLY difference is billable_subscribers ----
      billable_PROVISIONAL = report.reported_subscribers
      billable_FINAL       = max(report.reported_subscribers, floor_subscribers)

      # ---- ROUNDING ORDER IS PINNED: round PER REPORT, then sum -------------
      # A report's fee is rounded to whole cents BEFORE it ever participates in
      # an invoice sum. Invoices sum already-rounded per-report integers. The
      # alternative order (sum the unrounded products across reports, then round
      # once) is explicitly NOT used and produces different cents.
      fee_cents(billable) = round_half_up(billable * rate_applied * tier_mult, 0)

      provisional_fee_cents = fee_cents(billable_PROVISIONAL)   # stamped at submission
      license_fee_due_cents = fee_cents(billable_FINAL)         # stamped at acceptance
    input_set: "Exactly one SubscriberReport, its CarriageAgreement, that agreement's Distributor, and the single ACTIVE MfnClause if one exists. Reports with status IN {DISPUTED, RESTATED, SUPERSEDED} never receive a license_fee_due_cents value."
    constants:
      TIER_MULTIPLIER: { BASIC: 1.00, EXPANDED_BASIC: 1.00, DIGITAL_TIER: 0.85, PREMIUM: 0.60 }
      TIER_RANK: { BASIC: 4, EXPANDED_BASIC: 3, DIGITAL_TIER: 2, PREMIUM: 1 }
    precision: "whole cents, round_half_up, applied once per report before any summation"
    variants:
      - name: PROVISIONAL
        when: "At submission time (POST /carriage/subscriber-reports), for accrual visibility only"
        difference: "billable_subscribers = reported_subscribers verbatim; the penetration floor is ignored, so an under-penetrated period accrues less than it will finally bill"
      - name: FINAL
        when: "At acceptance time (action=ACCEPT), the figure that becomes billable and recognized revenue"
        difference: "billable_subscribers = max(reported_subscribers, floor(penetration_floor_pct * total_subscribers)); whenever reported < floor the FINAL fee strictly exceeds the PROVISIONAL fee for identical inputs"
    outputs: ["SubscriberReport.penetration_pct", "SubscriberReport.billable_subscribers", "SubscriberReport.rate_applied_cents_per_sub", "SubscriberReport.provisional_fee_cents", "SubscriberReport.license_fee_due_cents", "SubscriberReport.tier_placement_breach"]

  # --- C3: MFN benchmark rate (combinatorial mode (a)) ---------------------
  - name: mfn_benchmark_rate
    trigger: "On POST /carriage/mfn-clauses/{mfnClauseId}/reset with action=RESET"
    algorithm: weighted_scoring
    formula: |
      this_agreement   = CarriageAgreement named by clause.agreement_id
      this_distributor = Distributor named by this_agreement.distributor_id

      # (a) ELIGIBILITY FILTER — explicit predicate over entity fields
      candidates = { peer : CarriageAgreement |
            peer.id != this_agreement.id
        AND peer.lifecycle_status IN {EXECUTED, SUSPENDED}
        AND peer.committed_tier == this_agreement.committed_tier          # like-for-like packaging
        AND peer.term_start_date <= LogicalClock.current_utc
        AND peer.term_end_date   >  LogicalClock.current_utc
        AND peer_distributor.id != this_distributor.id
        AND peer_distributor.total_subscribers >= clause.min_peer_subscribers
        AND peer_distributor.distributor_type IN SCOPE_TYPES[clause.mfn_scope] }

      # (b) RANKING EXPRESSION — nested conditional + banded factor, 3+ inputs
      band(n) = SMALL  if n <  2000000
                MID    if 2000000 <= n < 10000000
                LARGE  if n >= 10000000
      peer_adjusted_rate(peer) = round_half_up(
            peer.effective_rate_cents_per_sub
          * VOLUME_BAND_FACTOR[band(peer_distributor.total_subscribers)]
          * (1 - VMVPD_PLATFORM_DISCOUNT if peer_distributor.distributor_type == VMVPD else 1.0),
          RATE_PRECISION)

      benchmark_rate_cents = min over candidates of peer_adjusted_rate(peer)

      # (c) TIE-BREAK — when two candidates share the minimum adjusted rate the
      #     benchmark peer is the one with the earlier CarriageAgreement.created_at
      #     (ASC). `id` is never consulted.
      benchmark_peer_agreement_id = argmin ordered by (peer_adjusted_rate ASC, peer.created_at ASC)

      # (d) EMPTY-POOL FALLBACK
      if candidates is empty:
          benchmark_rate_cents        = null
          benchmark_peer_agreement_id = null
          benchmark_status            = NO_COMPARABLE
          # the agreement keeps escalated_rate_cents_per_sub; mfn_capped = false
      else:
          benchmark_status            = BENCHMARKED

      last_reset_at = LogicalClock.current_utc
    input_set: "All CarriageAgreement rows other than the clause's own, restricted by the eligibility filter above. DRAFT, NEGOTIATING, EXPIRED and TERMINATED peers are excluded; peers of the same Distributor are excluded so an operator cannot benchmark against itself."
    constants:
      SCOPE_TYPES: { DOMESTIC: [CABLE_MSO, DBS, TELCO], GLOBAL: [CABLE_MSO, DBS, TELCO, VMVPD] }
      VOLUME_BAND_FACTOR: { SMALL: 1.05, MID: 1.00, LARGE: 0.94 }
      VMVPD_PLATFORM_DISCOUNT: 0.08
      RATE_PRECISION: 4
    precision: "4 decimal places of a cent, round_half_up, applied to each peer's adjusted rate before the min is taken"
    outputs: ["MfnClause.benchmark_rate_cents", "MfnClause.benchmark_peer_agreement_id", "MfnClause.benchmark_status", "MfnClause.last_reset_at", "CarriageAgreement.effective_rate_cents_per_sub", "CarriageAgreement.mfn_capped"]

  # --- C4: audit recovery amount (DUAL VARIANT + chronological + threshold) -
  - name: audit_recovery_amount
    trigger: "On POST /carriage/audit-engagements/{engagementId}/lifecycle with action=ISSUE_FINDINGS"
    algorithm: chronological
    formula: |
      # Findings are processed in a PINNED chronological order:
      #   period_month ASC, then AuditFinding.created_at ASC.
      # (`id` is never used for ordering.) The order is observable because the
      # running interest accumulator is stamped per finding.
      base_total     = 0
      interest_total = 0
      var_total      = 0
      rep_total      = 0

      for f in findings(engagement) ordered by (f.period_month ASC, f.created_at ASC):
          variance = max(0, f.audited_subscribers - f.reported_subscribers)

          # ---- variant selection: which rate prices the variance ------------
          rate_PERIOD_RATE  = calculations.agreement_effective_rate evaluated with
                              as_of_month_first_day = first day of f.period_month
          rate_CLOSING_RATE = agreement.effective_rate_cents_per_sub as it stands at
                              LogicalClock.current_utc (the findings-issuance instant)
          rate = rate_PERIOD_RATE  if engagement.rate_basis == PERIOD_RATE
                 rate_CLOSING_RATE if engagement.rate_basis == CLOSING_RATE

          tier_mult = TIER_MULTIPLIER[report(f).reported_tier]

          # per-finding rounding, PINNED: round each finding then accumulate
          f.finding_recovery_cents = round_half_up(variance * rate * tier_mult, 0)

          months_elapsed = whole calendar months from the LAST day of f.period_month
                           to LogicalClock.current_utc, floored at 0
          interest_f     = round_half_up(f.finding_recovery_cents
                                         * MONTHLY_INTEREST_PCT * months_elapsed, 0)

          base_total     += f.finding_recovery_cents
          interest_total += interest_f
          var_total      += variance
          rep_total      += f.reported_subscribers

      underreporting_pct = round_half_up(var_total / rep_total, 4)   if rep_total > 0 else 0

      # ---- THRESHOLD LADDER: inclusive lower bounds (>=) -------------------
      penalty_multiplier = 1.00  if underreporting_pct <  0.0500
                           1.10  if 0.0500 <= underreporting_pct < 0.1000
                           1.25  if underreporting_pct >= 0.1000

      audit_cost_shift_cents = AUDIT_COST_CENTS if underreporting_pct >= AUDIT_COST_SHIFT_THRESHOLD else 0

      recovery_amount_cents = round_half_up((base_total + interest_total) * penalty_multiplier, 0)
                              + audit_cost_shift_cents
    input_set: "Every AuditFinding whose engagement_id is this engagement. Findings whose variance_subscribers == 0 still contribute their reported_subscribers to rep_total (they dilute underreporting_pct) but contribute 0 to base_total and interest_total. When the engagement has zero findings, rep_total == 0 and every output is 0."
    constants:
      MONTHLY_INTEREST_PCT: 0.0075
      AUDIT_COST_CENTS: 2500000
      AUDIT_COST_SHIFT_THRESHOLD: 0.05
      PENALTY_TIER_1_THRESHOLD: 0.05
      PENALTY_TIER_2_THRESHOLD: 0.10
      TIER_MULTIPLIER: { BASIC: 1.00, EXPANDED_BASIC: 1.00, DIGITAL_TIER: 0.85, PREMIUM: 0.60 }
    precision: "whole cents, round_half_up, applied per finding and again once to the penalty-multiplied subtotal"
    variants:
      - name: PERIOD_RATE
        when: "engagement.rate_basis == PERIOD_RATE — the contractual reading: each audited month is re-priced at the rate that was in force for that month"
        difference: "Each finding uses the escalator-and-MFN rate for its own period_month, so an escalating agreement recovers less on early periods than a flat closing-rate reading would"
      - name: CLOSING_RATE
        when: "engagement.rate_basis == CLOSING_RATE — the settlement reading: the whole sample is re-priced at the rate in force when findings are issued"
        difference: "Every finding uses one single rate (the agreement's current effective_rate_cents_per_sub), which on an escalating agreement produces a strictly larger recovery than PERIOD_RATE for the same findings"
    outputs: ["AuditFinding.finding_recovery_cents", "AuditFinding.rate_applied_cents_per_sub", "AuditEngagement.total_variance_subscribers", "AuditEngagement.total_reported_subscribers", "AuditEngagement.underreporting_pct", "AuditEngagement.penalty_multiplier", "AuditEngagement.base_recovery_cents", "AuditEngagement.interest_cents", "AuditEngagement.audit_cost_shift_cents", "AuditEngagement.recovery_amount_cents"]

  # --- C5: invoice net due (combinatorial mode (c) — pinned eval order) ----
  - name: invoice_net_due
    trigger: "On POST /carriage/invoices (stamps the DRAFT amounts) and re-evaluated on POST /carriage/mfn-clauses/{mfnClauseId}/reset for invoices still in status DRAFT"
    algorithm: waterfall_allocation
    formula: |
      # The dependency LOOKS circular: the co-op offset reduces what the
      # distributor owes, and the co-op ceiling is a percentage band — so which
      # amount selects the band, the payable or the gross? The order below is
      # PINNED: the band is always selected from STEP 1's gross, never from the
      # post-offset payable. Evaluating it the other way lands in a lower band
      # and yields a strictly larger net_due for the same inputs.

      # STEP 1 — gross
      if invoice.invoice_kind == LICENSE_FEE:
          gross = sum over SubscriberReport r where r.agreement_id == invoice.agreement_id
                       and r.period_month == invoice.period_month
                       and r.status IN {ACCEPTED, AUDIT_ADJUSTED}
                       and r.invoice_id is null
                  of r.license_fee_due_cents        # each already rounded by C2
      else:  # AUDIT_RECOVERY
          gross = AuditEngagement(invoice.audit_engagement_id).recovery_amount_cents

      # STEP 2 — co-op ceiling band, selected from the STEP 1 gross
      coop_cap_pct = 0.05  if gross <  5000000
                     0.08  if 5000000 <= gross < 25000000
                     0.12  if gross >= 25000000
      coop_ceiling = round_half_up(gross * coop_cap_pct, 0)

      # STEP 3 — co-op / marketing-support offset (LICENSE_FEE invoices only)
      coop_pool = sum of MarketingCommitment.earned_unbilled_cents over commitments
                  where commitment_type IN {COOP_ADVERTISING, MARKETING_SUPPORT}
                    and agreement_id == invoice.agreement_id
                    and status IN {PARTIALLY_EARNED, EARNED}
      coop_offset_cents = min(coop_pool, coop_ceiling)      # 0 for AUDIT_RECOVERY

      # STEP 4 — launch-fee offset, applied to what STEP 3 left behind
      launch_pool = sum of MarketingCommitment.earned_unbilled_cents over commitments
                    where commitment_type == LAUNCH_FEE
                      and agreement_id == invoice.agreement_id
                      and status IN {PARTIALLY_EARNED, EARNED}
      launch_fee_offset_cents = min(launch_pool, max(0, gross - coop_offset_cents))

      # STEP 5 — audit adjustments already folded into report fees are NOT
      # double counted; only AUDIT_RECOVERY invoices carry an adjustment line.
      recovery_adjustment_cents = 0

      # STEP 6 — floor at zero, remainder carried forward
      raw_net           = gross - coop_offset_cents - launch_fee_offset_cents + recovery_adjustment_cents
      net_due_cents     = max(0, raw_net)
      carryforward_cents = max(0, -raw_net)

      # Offset consumption order is PINNED for the ledger write-back:
      # commitments are drawn in (commitment_type order COOP_ADVERTISING,
      # MARKETING_SUPPORT, LAUNCH_FEE), then created_at ASC within a type.
    input_set: "For LICENSE_FEE: SubscriberReport rows of the same agreement and period_month with status IN {ACCEPTED, AUDIT_ADJUSTED} and invoice_id still null — reports already billed by another invoice are excluded. For AUDIT_RECOVERY: exactly one AuditEngagement with status == FINDINGS_ISSUED. MarketingCommitment rows with status IN {OPEN, FORFEITED, SETTLED} contribute nothing."
    constants:
      COOP_BAND_1_MAX: 5000000
      COOP_BAND_2_MAX: 25000000
      COOP_CAP_BAND_1: 0.05
      COOP_CAP_BAND_2: 0.08
      COOP_CAP_BAND_3: 0.12
    precision: "whole cents, round_half_up; the co-op ceiling is the only rounded intermediate"
    outputs: ["Invoice.gross_license_fee_cents", "Invoice.coop_cap_pct", "Invoice.coop_offset_cents", "Invoice.launch_fee_offset_cents", "Invoice.recovery_adjustment_cents", "Invoice.net_due_cents", "Invoice.carryforward_cents"]

  # --- C6: agreement penetration compliance (threshold with reset) ---------
  - name: agreement_penetration_compliance
    trigger: "On POST /carriage/subscriber-reports/{reportId}/review with action=ACCEPT, immediately after calculations.subscriber_report_license_fee stamps the FINAL fee"
    algorithm: threshold
    formula: |
      # INCLUSIVE comparison: exactly meeting the floor is COMPLIANT.
      compliant = (report.penetration_pct >= agreement.penetration_floor_pct)

      if compliant:
          consecutive_compliant_periods += 1
          penetration_compliance_status  = COMPLIANT
          if consecutive_compliant_periods >= PENETRATION_COMPLIANT_RESET_RUN:
              penetration_breach_count           = 0
              consecutive_compliant_periods      = 0     # the run resets after it pays out
      else:
          consecutive_compliant_periods = 0
          penetration_breach_count     += 1
          penetration_compliance_status = BREACH
          if penetration_breach_count >= PENETRATION_BREACH_SUSPEND_THRESHOLD
             and agreement.lifecycle_status == EXECUTED:
              agreement auto-transitions lifecycle_status EXECUTED -> SUSPENDED
              with suspension_reason = PENETRATION_BREACH
    input_set: "Exactly the SubscriberReport being accepted plus the agreement's current counters. Reports accepted out of period order still update the counters in acceptance order, not period order — acceptance order is the pinned sequence."
    constants:
      PENETRATION_BREACH_SUSPEND_THRESHOLD: 2
      PENETRATION_COMPLIANT_RESET_RUN: 3
    precision: "penetration_pct compared at 4 decimal places; both sides are rounded to 4 dp before comparison"
    outputs: ["CarriageAgreement.penetration_compliance_status", "CarriageAgreement.penetration_breach_count", "CarriageAgreement.consecutive_compliant_periods", "CarriageAgreement.lifecycle_status"]

  # --- C7: rights window occupancy (HALF-OPEN intervals, aggregate cap) ----
  - name: rights_window_occupancy
    trigger: "On POST /carriage/rights-windows/{windowId}/lifecycle with action=CLEAR and with action=UNBLOCK"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS A — HALF-OPEN [window_start, window_end).
      # Adjacency is legal: prev.window_end == next.window_start is NOT an
      # overlap. There is NO separation buffer on this resource.
      key(w) = (w.content_title_id, w.platform, w.territory_code)

      neighbours = { w : RightsWindow |
            w.id != this.id
        AND key(w) == key(this)
        AND w.status IN {CLEARED, ACTIVE}
        AND w.window_start < this.window_end
        AND this.window_start < w.window_end }        # strict <, so gap == 0 passes

      if this.exclusivity == EXCLUSIVE:
          # An exclusive grant tolerates NO overlap of any exclusivity.
          if |neighbours| >= 1: reject ERR_WINDOW_EXCLUSIVITY_CONFLICT
      else:  # NON_EXCLUSIVE
          if any n in neighbours has n.exclusivity == EXCLUSIVE:
              reject ERR_WINDOW_EXCLUSIVITY_CONFLICT
          # AGGREGATE CAPACITY on the same key: at most
          # MAX_CONCURRENT_NONEXCLUSIVE simultaneous non-exclusive licensees.
          if |neighbours| + 1 > MAX_CONCURRENT_NONEXCLUSIVE:
              reject ERR_WINDOW_CONCURRENCY_CAP_EXCEEDED

      this.concurrent_licensee_count = |neighbours|

      # DERIVED HOLDBACK — stamped on the same call, before the conflict scan.
      # Measured from the title's LINEAR premiere to this window's start, in
      # whole days (floored), and may be negative when a window opens before
      # the linear premiere. validations priority 62 compares it against
      # PLATFORM_HOLDBACK_DAYS[this.platform] with an inclusive >=, so a
      # STREAMING window starting exactly 7 days after the premiere passes
      # while one starting 6 days 23 hours after it does not (floor -> 6).
      this.windowing_holdback_days =
          floor((this.window_start - ContentTitle(this.content_title_id).linear_premiere_at)
                / 86400 seconds)
    input_set: "RightsWindow rows sharing (content_title_id, platform, territory_code) with status IN {CLEARED, ACTIVE}. PLANNED, BLOCKED and EXPIRED windows never occupy the resource, so a BLOCKED window's slot is immediately reusable."
    constants:
      MAX_CONCURRENT_NONEXCLUSIVE: 3
      PLATFORM_HOLDBACK_DAYS: { LINEAR: 0, VOD: 1, STREAMING: 7, INTERNATIONAL: 30 }
    precision: "instants compared at whole-second resolution; boundaries evaluated with strict < on both sides"
    outputs: ["RightsWindow.concurrent_licensee_count", "RightsWindow.status", "RightsWindow.windowing_holdback_days"]

  # --- C8: blackout separation (CLOSED intervals + buffer + monthly cap) ---
  - name: blackout_separation
    trigger: "On POST /carriage/blackout-rules"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS B — CLOSED [blackout_start, blackout_end] on BOTH
      # ends, PLUS a mandatory separation buffer. Adjacency is ILLEGAL here:
      # two blackouts on the same key must be at least
      # BLACKOUT_MIN_SEPARATION_HOURS apart, so a gap of 0 (or of 23 hours) is
      # rejected where the RightsWindow resource would have accepted it.
      key(b) = (Distributor of b's agreement, b.territory_code)
      buffer = BLACKOUT_MIN_SEPARATION_HOURS hours

      neighbours = { b : BlackoutRule |
            b.id != this.id
        AND key(b) == key(this)
        AND b.status IN {SCHEDULED, ENFORCED}
        AND b.blackout_start - buffer <= this.blackout_end
        AND this.blackout_start - buffer <= b.blackout_end }   # <= makes both ends closed

      if |neighbours| >= 1: reject ERR_BLACKOUT_SEPARATION_VIOLATION

      this.blackout_hours = round_half_up((blackout_end - blackout_start) / 3600, 2)

      # AGGREGATE MONTHLY CAP on the same key, counted by calendar month of
      # blackout_start (UTC), inclusive of this row.
      this.monthly_blackout_hours =
          this.blackout_hours
        + sum of b.blackout_hours over b in { same key, status IN {SCHEDULED, ENFORCED},
              calendar_month(b.blackout_start) == calendar_month(this.blackout_start) }
      if this.monthly_blackout_hours > MAX_BLACKOUT_HOURS_PER_MONTH:
          reject ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED
    input_set: "BlackoutRule rows of the same Distributor (resolved through agreement_id -> CarriageAgreement.distributor_id) and the same territory_code with status IN {SCHEDULED, ENFORCED}. WAIVED and EXPIRED rules neither conflict nor count toward the monthly cap."
    constants:
      BLACKOUT_MIN_SEPARATION_HOURS: 24
      MAX_BLACKOUT_HOURS_PER_MONTH: 72
    precision: "hours to 2 decimal places, round_half_up; interval endpoints compared at whole-second resolution with <= on both sides"
    outputs: ["BlackoutRule.blackout_hours", "BlackoutRule.monthly_blackout_hours"]

  # --- C9: renewal leverage + distribution loss (DUAL VARIANT, weighted) ---
  - name: renewal_leverage_model
    trigger: "On POST /carriage/renewal-analyses"
    algorithm: weighted_scoring
    formula: |
      distributor = Distributor named by agreement.distributor_id

      # The driving report: the SubscriberReport for this agreement with
      # status IN {ACCEPTED, AUDIT_ADJUSTED} having the LATEST period_month;
      # tie-break on created_at DESC (a restatement filed later wins). When no
      # such report exists, latest_accepted_report_id = null and
      # penetration_ratio = 0.
      latest = argmax over reports (period_month ASC, created_at ASC) -> take last

      subscriber_share = round_half_up(distributor.total_subscribers / TOTAL_ADDRESSABLE_SUBS, 6)
      penetration_ratio = round_half_up(min(latest.penetration_pct
                                            / agreement.penetration_floor_pct, 2.0), 4)
      payment_score = round_half_up(1 - clamp(distributor.receivable_balance_cents
                                              / max(1, distributor.credit_limit_cents), 0, 1), 4)
      compliance_score = round_half_up(1 - clamp(agreement.penetration_breach_count
                                                 / BREACH_SCORE_DENOMINATOR, 0, 1), 4)

      leverage_score = round_half_up(100 * (
            W_SHARE      * min(subscriber_share / SHARE_SATURATION, 1.0)
          + W_PENETRATION* min(penetration_ratio / PENETRATION_SATURATION, 1.0)
          + W_PAYMENT    * payment_score
          + W_COMPLIANCE * compliance_score), 2)

      # ---- variant selection: churn recapture assumption -------------------
      recapture = RECAPTURE_RATE_BASE     if variant == BASE_CASE
                  RECAPTURE_RATE_DOWNSIDE if variant == DOWNSIDE
      distribution_loss_subscribers =
          round_half_up(distributor.total_subscribers * latest.penetration_pct
                        * (1 - recapture), 0)
      annualized_revenue_at_risk_cents =
          round_half_up(distribution_loss_subscribers
                        * agreement.effective_rate_cents_per_sub * 12, 0)
    input_set: "One CarriageAgreement with lifecycle_status IN {EXECUTED, SUSPENDED}, its Distributor, and the single latest SubscriberReport with status IN {ACCEPTED, AUDIT_ADJUSTED}. Reports with status IN {SUBMITTED, DISPUTED, RESTATED, SUPERSEDED} are excluded from the selection."
    constants:
      TOTAL_ADDRESSABLE_SUBS: 90000000
      SHARE_SATURATION: 0.15
      PENETRATION_SATURATION: 1.5
      BREACH_SCORE_DENOMINATOR: 3
      W_SHARE: 0.40
      W_PENETRATION: 0.25
      W_PAYMENT: 0.20
      W_COMPLIANCE: 0.15
      RECAPTURE_RATE_BASE: 0.35
      RECAPTURE_RATE_DOWNSIDE: 0.10
    precision: "leverage_score 2 dp round_half_up; subscriber_share 6 dp; ratios and scores 4 dp; subscriber and cent outputs whole numbers"
    variants:
      - name: BASE_CASE
        when: "variant == BASE_CASE — the planning case, assuming 35% of lost carriage is recaptured through other distributors"
        difference: "distribution_loss_subscribers uses RECAPTURE_RATE_BASE = 0.35, producing a materially smaller loss and revenue-at-risk than DOWNSIDE for identical agreement data"
      - name: DOWNSIDE
        when: "variant == DOWNSIDE — the negotiation case, assuming only 10% recapture"
        difference: "distribution_loss_subscribers uses RECAPTURE_RATE_DOWNSIDE = 0.10; leverage_score is IDENTICAL across variants (the score does not depend on recapture), so the two rows diverge only on the loss projection"
    outputs: ["RenewalAnalysis.latest_accepted_report_id", "RenewalAnalysis.subscriber_share", "RenewalAnalysis.penetration_ratio", "RenewalAnalysis.payment_score", "RenewalAnalysis.compliance_score", "RenewalAnalysis.leverage_score", "RenewalAnalysis.distribution_loss_subscribers", "RenewalAnalysis.annualized_revenue_at_risk_cents"]

  # --- C10: marketing commitment ledger (conserved quantity) ---------------
  - name: marketing_commitment_ledger
    trigger: "On POST /carriage/marketing-commitments/{commitmentId}/earn, on Invoice ISSUE (offset consumption), on Invoice VOID (offset restoration), and on POST /_clock/set_current_utc for deadline forfeiture"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY — this identity holds after EVERY mutation:
      #   committed_cents == earned_cents + remaining_cents + forfeited_cents
      # and separately:
      #   earned_unbilled_cents == earned_cents - billed_cents

      on EARN(amount):
          earned_cents          += amount
          earned_unbilled_cents  = earned_cents - billed_cents
          remaining_cents        = committed_cents - earned_cents - forfeited_cents
          status = EARNED           if remaining_cents == 0
                   PARTIALLY_EARNED if 0 < earned_cents < committed_cents

      on INVOICE_ISSUE(consumed):
          billed_cents          += consumed
          earned_unbilled_cents  = earned_cents - billed_cents
          status = SETTLED if remaining_cents == 0 and earned_unbilled_cents == 0

      on INVOICE_VOID(consumed):
          billed_cents          -= consumed
          earned_unbilled_cents  = earned_cents - billed_cents
          status recomputed by the same ladder as EARN

      on DEADLINE_PASSED (current_utc > performance_deadline and remaining_cents > 0):
          forfeited_cents       += remaining_cents
          remaining_cents        = 0
          status                 = FORFEITED
    input_set: "One MarketingCommitment at a time. The forfeiture sweep on clock advance processes commitments in performance_deadline ASC, then created_at ASC order."
    constants:
      LAUNCH_FEE_PERFORMANCE_DAYS: 180
    precision: "whole cents; no rounding occurs because every input is already an integer number of cents"
    outputs: ["MarketingCommitment.earned_cents", "MarketingCommitment.earned_unbilled_cents", "MarketingCommitment.billed_cents", "MarketingCommitment.forfeited_cents", "MarketingCommitment.remaining_cents", "MarketingCommitment.status"]

# =============================================================================
# Table 1.4: Validation Rules Table (evaluated in ascending `priority` order;
# the FIRST failing row's error_id is the response, and no side effect fires)
#
# Domain priority order inside the business band:
#   territorial/blackout compliance (safety)  ->  rights & packaging constraints
#   ->  temporal window rules  ->  referential/billing integrity  ->  fiscal
# Rationale: a territorial restriction is a regulatory obligation to the local
# broadcaster, so it outranks a purely contractual exclusivity conflict; money
# checks come last because they are the most easily remedied.
# =============================================================================
validations:

  # ---- 1..5 auth / authz / shape ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the called endpoint's `roles:` list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Segregation of duties: the X-User-ID that last executed an agreement (recorded on the agreement's execution) may not also be the X-User-ID accepting a SubscriberReport for that agreement, and the X-User-ID that issued AuditEngagement findings may not be the X-User-ID that creates the AUDIT_RECOVERY Invoice for the same engagement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /carriage/subscriber-reports/{reportId}/review, POST /carriage/invoices"

  - priority: 4
    category: auth
    check: "A DistributorLiaison may only act on resources whose resolved Distributor.id equals its X-User-ID (its own agreements, reports, invoices and commitments)"
    error_id: ERR_DISTRIBUTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints callable by DistributorLiaison"

  - priority: 5
    category: business_constraint
    check: "Request body is well-formed: every required field of the endpoint's `input:` is present and non-null, enum fields carry a declared member, integers are integers, monetary and subscriber fields are >= 0, period_month matches ^[0-9]{4}-(0[1-9]|1[0-2])$, territory codes are exactly two uppercase letters, and no unknown field is present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # ---- 10..19 existence, validated left-to-right in the path, then body ----
  - priority: 10
    category: existence
    check: "The path-addressed resource exists (distributorId, agreementId, reportId, engagementId, findingId, titleId, windowId, blackoutRuleId, commitmentId, invoiceId, mfnClauseId, analysisId)"
    error_id: "ERR_DISTRIBUTOR_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_BLACKOUT_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_MFN_CLAUSE_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 11
    category: existence
    check: "Body-supplied foreign keys resolve, checked in declaration order: distributor_id, agreement_id, content_title_id, substitute_content_title_id, subscriber_report_id, engagement_id, audit_engagement_id, restatement_of_report_id"
    error_id: "ERR_DISTRIBUTOR_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  # ---- 20 optimistic concurrency ----
  - priority: 20
    category: state
    check: "expected_agreement_version equals the current CarriageAgreement.version (POST /carriage/subscriber-reports, POST /carriage/mfn-clauses/{mfnClauseId}/reset); expected_distributor_version equals the current Distributor.version (POST /carriage/invoices)"
    error_id: "ERR_STALE_AGREEMENT_VERSION | ERR_STALE_DISTRIBUTOR_VERSION"
    http_status: 412
    applies_to: "POST /carriage/subscriber-reports, POST /carriage/mfn-clauses/{mfnClauseId}/reset, POST /carriage/invoices"

  # ---- 30..39 own-entity state preconditions ----
  - priority: 30
    category: state
    check: "The requested action is a declared transition out of the target CarriageAgreement's current lifecycle_status (SM1)"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /carriage/agreements/{agreementId}/lifecycle, PATCH /carriage/agreements/{agreementId}"

  - priority: 31
    category: state
    check: "The requested action is a declared transition out of the target CarriageAgreement's current renewal_status (SM2)"
    error_id: ERR_INVALID_RENEWAL_STATE
    http_status: 409
    applies_to: "POST /carriage/agreements/{agreementId}/renewal"

  - priority: 32
    category: state
    check: "The requested review action is a declared transition out of the target SubscriberReport's current status (SM3): ACCEPT and DISPUTE require SUBMITTED, REQUEST_RESTATEMENT requires DISPUTED, ACCEPT_ADJUSTMENT requires AUDIT_ADJUSTED"
    error_id: ERR_INVALID_REPORT_STATE
    http_status: 409
    applies_to: "POST /carriage/subscriber-reports/{reportId}/review"

  - priority: 33
    category: state
    check: "The requested action is a declared transition out of the target AuditEngagement's current status (SM4), and POST /carriage/audit-engagements/{engagementId}/findings requires status == FIELDWORK"
    error_id: ERR_INVALID_ENGAGEMENT_STATE
    http_status: 409
    applies_to: "POST /carriage/audit-engagements/{engagementId}/lifecycle, POST /carriage/audit-engagements/{engagementId}/findings"

  - priority: 34
    category: state
    check: "The requested action is a declared transition out of the target RightsWindow's current status (SM5)"
    error_id: ERR_INVALID_WINDOW_STATE
    http_status: 409
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle"

  - priority: 35
    category: state
    check: "The requested action is a declared transition out of the target Invoice's current status (SM6); VOID from ISSUED additionally requires paid_cents == 0"
    error_id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    applies_to: "POST /carriage/invoices/{invoiceId}/lifecycle"

  - priority: 36
    category: state
    check: "The requested action is a declared transition out of the target BlackoutRule's current status: ENFORCE requires SCHEDULED, WAIVE requires SCHEDULED"
    error_id: ERR_INVALID_BLACKOUT_STATE
    http_status: 409
    applies_to: "POST /carriage/blackout-rules/{blackoutRuleId}/lifecycle"

  - priority: 37
    category: state
    check: "The MfnClause being reset or waived has status == ACTIVE"
    error_id: ERR_INVALID_MFN_STATE
    http_status: 409
    applies_to: "POST /carriage/mfn-clauses/{mfnClauseId}/reset"

  # ---- 40..49 cross-entity state preconditions ----
  - priority: 40
    category: state
    check: "The CarriageAgreement referenced by the operated resource is in an operable lifecycle state. For POST /carriage/subscriber-reports/{reportId}/review (action=ACCEPT) the admissible set is lifecycle_status IN {EXECUTED, SUSPENDED} — a suspended agreement keeps settling the periods its operator reports, which is the ONLY path by which a PENETRATION_BREACH suspension can ever be cured (validations priority 85 demands penetration_breach_count == 0 before REINSTATE, and only calculations.agreement_penetration_compliance can clear that counter). For rights-window CLEAR/UNBLOCK, renewal RENEW and marketing earn the admissible set is the strict lifecycle_status == EXECUTED. DRAFT, NEGOTIATING, EXPIRED and TERMINATED are inadmissible everywhere this rule applies."
    error_id: ERR_AGREEMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /carriage/subscriber-reports/{reportId}/review (action=ACCEPT), POST /carriage/rights-windows/{windowId}/lifecycle (actions CLEAR, UNBLOCK), POST /carriage/agreements/{agreementId}/renewal (action=RENEW), POST /carriage/marketing-commitments/{commitmentId}/earn"

  - priority: 41
    category: state
    check: "The Distributor resolved for the operation has status == ACTIVE (agreement EXECUTE, renewal RENEW, LICENSE_FEE invoice ISSUE, agreement REINSTATE)"
    error_id: ERR_DISTRIBUTOR_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /carriage/agreements/{agreementId}/lifecycle (actions EXECUTE, REINSTATE), POST /carriage/agreements/{agreementId}/renewal (action=RENEW), POST /carriage/invoices/{invoiceId}/lifecycle (action=ISSUE when invoice_kind == LICENSE_FEE)"

  - priority: 42
    category: state
    check: "The ContentTitle referenced by the RightsWindow has rights_status == OWNED_CLEARED"
    error_id: ERR_TITLE_RIGHTS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle (actions CLEAR, UNBLOCK)"

  # ---- 50..59 business_safety: territorial / blackout compliance ----
  - priority: 50
    category: business_safety
    check: "The proposed BlackoutRule's closed interval, expanded by BLACKOUT_MIN_SEPARATION_HOURS on both sides, does not touch any SCHEDULED or ENFORCED BlackoutRule of the same (Distributor, territory_code) — calculations.blackout_separation"
    error_id: ERR_BLACKOUT_SEPARATION_VIOLATION
    http_status: 409
    applies_to: "POST /carriage/blackout-rules"

  - priority: 51
    category: business_safety
    check: "monthly_blackout_hours for the (Distributor, territory_code) calendar month, including the proposed rule, does not exceed MAX_BLACKOUT_HOURS_PER_MONTH"
    error_id: ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /carriage/blackout-rules"

  - priority: 52
    category: business_safety
    check: "No SCHEDULED or ENFORCED BlackoutRule of the same agreement and territory_code intersects the RightsWindow's half-open interval being cleared"
    error_id: ERR_BLACKOUT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle (actions CLEAR, UNBLOCK)"

  - priority: 53
    category: business_safety
    check: "substitute_content_title_id is present and names a ContentTitle with rights_status == OWNED_CLEARED whenever substitution_required is true"
    error_id: ERR_SUBSTITUTION_TITLE_REQUIRED
    http_status: 422
    applies_to: "POST /carriage/blackout-rules"

  # ---- 60..69 business_constraint: rights, packaging, uniqueness ----
  - priority: 60
    category: business_constraint
    check: "The RightsWindow being cleared does not violate exclusivity on (content_title_id, platform, territory_code) — an EXCLUSIVE grant tolerates zero overlaps, a NON_EXCLUSIVE grant tolerates zero EXCLUSIVE overlaps — calculations.rights_window_occupancy"
    error_id: ERR_WINDOW_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle (actions CLEAR, UNBLOCK)"

  - priority: 61
    category: business_constraint
    check: "Clearing a NON_EXCLUSIVE window would leave at most MAX_CONCURRENT_NONEXCLUSIVE overlapping CLEARED/ACTIVE windows on the key, counting the window being cleared"
    error_id: ERR_WINDOW_CONCURRENCY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle (actions CLEAR, UNBLOCK)"

  - priority: 62
    category: business_constraint
    check: "windowing_holdback_days >= PLATFORM_HOLDBACK_DAYS[platform] for the window being cleared"
    error_id: ERR_HOLDBACK_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle (action=CLEAR)"

  - priority: 63
    category: business_constraint
    check: "No other SubscriberReport for the same (agreement_id, period_month) already has status IN {ACCEPTED, AUDIT_ADJUSTED}"
    error_id: ERR_DUPLICATE_ACCEPTED_PERIOD
    http_status: 409
    applies_to: "POST /carriage/subscriber-reports/{reportId}/review (action=ACCEPT)"

  - priority: 64
    category: business_constraint
    check: "The agreement has no other MfnClause with status == ACTIVE (at most one ACTIVE clause per agreement); contract_code is unique per (distributor_id, contract_code)"
    error_id: "ERR_MULTIPLE_ACTIVE_MFN_CLAUSES | ERR_DUPLICATE_CONTRACT_CODE"
    http_status: 409
    applies_to: "POST /carriage/mfn-clauses, POST /carriage/agreements"

  - priority: 65
    category: business_constraint
    check: "restatement_of_report_id, when supplied, names a SubscriberReport of the same agreement_id and period_month whose status == RESTATED"
    error_id: ERR_RESTATEMENT_TARGET_INVALID
    http_status: 422
    applies_to: "POST /carriage/subscriber-reports"

  # ---- 70..79 business_temporal ----
  - priority: 70
    category: business_temporal
    check: "The report's period_month lies inside [month of term_start_date, month of term_end_date] inclusive"
    error_id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /carriage/subscriber-reports/{reportId}/review (action=ACCEPT)"

  - priority: 71
    category: business_temporal
    check: "The RightsWindow's [window_start, window_end) lies inside [term_start_date, term_end_date)"
    error_id: ERR_WINDOW_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /carriage/rights-windows/{windowId}/lifecycle (action=CLEAR)"

  - priority: 72
    category: business_temporal
    check: "term_end_date - LogicalClock.current_utc <= RENEWAL_WINDOW_DAYS days when starting renewal analysis"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /carriage/agreements/{agreementId}/renewal (action=START_ANALYSIS)"

  - priority: 73
    category: business_temporal
    check: "LogicalClock.current_utc >= issued_at + WRITE_OFF_AGE_DAYS days before an invoice may be written off"
    error_id: ERR_WRITE_OFF_TOO_EARLY
    http_status: 422
    applies_to: "POST /carriage/invoices/{invoiceId}/lifecycle (action=WRITE_OFF)"

  - priority: 74
    category: business_temporal
    check: "An AuditEngagement on an EXPIRED agreement may only start fieldwork within AUDIT_RIGHTS_SURVIVAL_MONTHS months of term_end_date, and sample_period_end must be <= the month of term_end_date"
    error_id: ERR_AUDIT_RIGHTS_EXPIRED
    http_status: 422
    applies_to: "POST /carriage/audit-engagements, POST /carriage/audit-engagements/{engagementId}/lifecycle (action=START_FIELDWORK)"

  - priority: 75
    category: business_temporal
    check: "The MarketingCommitment's performance_deadline has not passed at LogicalClock.current_utc"
    error_id: ERR_COMMITMENT_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /carriage/marketing-commitments/{commitmentId}/earn"

  # ---- 80..89 business_referential: billing integrity ----
  - priority: 80
    category: business_referential
    check: "An AuditFinding's subscriber_report_id names a SubscriberReport of the engagement's agreement whose status IN {ACCEPTED, AUDIT_ADJUSTED} and whose period_month lies inside [sample_period_start, sample_period_end]"
    error_id: ERR_AUDIT_PERIOD_NOT_REPORTED
    http_status: 422
    applies_to: "POST /carriage/audit-engagements/{engagementId}/findings"

  - priority: 81
    category: business_referential
    check: "No SubscriberReport that a LICENSE_FEE invoice would bill already carries a non-null invoice_id"
    error_id: ERR_REPORT_ALREADY_BILLED
    http_status: 409
    applies_to: "POST /carriage/invoices"

  - priority: 82
    category: business_referential
    check: "A LICENSE_FEE invoice must find at least one unbilled SubscriberReport with status IN {ACCEPTED, AUDIT_ADJUSTED} for (agreement_id, period_month); an AUDIT_RECOVERY invoice must name an AuditEngagement with status == FINDINGS_ISSUED"
    error_id: ERR_NO_BILLABLE_REPORTS
    http_status: 422
    applies_to: "POST /carriage/invoices"

  - priority: 83
    category: business_referential
    check: "The AuditEngagement named by audit_engagement_id has recovery_invoice_id == null"
    error_id: ERR_RECOVERY_ALREADY_INVOICED
    http_status: 409
    applies_to: "POST /carriage/invoices"

  # ---- 90..99 business_fiscal ----
  - priority: 90
    category: business_fiscal
    check: "earned_cents + requested amount <= committed_cents on the MarketingCommitment"
    error_id: ERR_MARKETING_OVEREARN
    http_status: 422
    applies_to: "POST /carriage/marketing-commitments/{commitmentId}/earn"

  - priority: 91
    category: business_fiscal
    check: "A recorded payment satisfies 0 < amount_cents <= net_due_cents - paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /carriage/invoices/{invoiceId}/lifecycle (action=RECORD_PAYMENT)"

  - priority: 92
    category: business_fiscal
    check: "net_due_cents > 0 at the moment of issuance — a fully-offset invoice cannot be issued and must be voided instead"
    error_id: ERR_INVOICE_ZERO_NET_DUE
    http_status: 422
    applies_to: "POST /carriage/invoices/{invoiceId}/lifecycle (action=ISSUE)"

  - priority: 93
    category: business_fiscal
    check: "penetration_floor_pct * Distributor.total_subscribers >= 1 on execution — the floor must bind at least one subscriber to be enforceable"
    error_id: ERR_PENETRATION_FLOOR_UNENFORCEABLE
    http_status: 422
    applies_to: "POST /carriage/agreements/{agreementId}/lifecycle (action=EXECUTE)"

  # ---- rows below are listed out of file order; the `priority` field alone
  # ---- determines evaluation order (ascending) ----
  - priority: 38
    category: business_temporal
    check: "to_iso8601 is strictly greater than the current logical time — the clock only moves forward"
    error_id: ERR_CLOCK_MUST_MOVE_FORWARD
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 66
    category: business_referential
    check: "ISSUE_FINDINGS requires at least one AuditFinding of this engagement with variance_subscribers > 0"
    error_id: ERR_NO_AUDIT_FINDINGS
    http_status: 422
    applies_to: "POST /carriage/audit-engagements/{engagementId}/lifecycle (action=ISSUE_FINDINGS)"

  - priority: 67
    category: business_referential
    check: "CLOSE_NO_FINDING requires that NO AuditFinding of this engagement has variance_subscribers > 0"
    error_id: ERR_FINDINGS_PRESENT_CANNOT_CLOSE
    http_status: 409
    applies_to: "POST /carriage/audit-engagements/{engagementId}/lifecycle (action=CLOSE_NO_FINDING)"

  - priority: 68
    category: business_referential
    check: "OFFER requires at least one RenewalAnalysis row for this agreement"
    error_id: ERR_RENEWAL_REQUIRES_ANALYSIS
    http_status: 422
    applies_to: "POST /carriage/agreements/{agreementId}/renewal (action=OFFER)"

  - priority: 84
    category: business_referential
    check: "TERMINATE from SUSPENDED, and Distributor TERMINATE, both require that no Invoice of the affected scope has status IN {ISSUED, PARTIALLY_PAID}"
    error_id: ERR_OPEN_RECEIVABLE_BLOCKS_TERMINATION
    http_status: 409
    applies_to: "POST /carriage/agreements/{agreementId}/lifecycle (action=TERMINATE), POST /carriage/distributors/{distributorId}/credit-review (action=TERMINATE)"

  - priority: 85
    category: business_referential
    check: "REINSTATE from SUSPENDED with suspension_reason == PENETRATION_BREACH requires penetration_breach_count == 0"
    error_id: ERR_BREACH_COUNT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /carriage/agreements/{agreementId}/lifecycle (action=REINSTATE)"

# =============================================================================
# Table 1.5: API Endpoint Table
# All business paths sit under the /carriage prefix; the single test-driving
# namespace is /_clock.
# =============================================================================
endpoints:

  # ---------------- Distributor ----------------
  - method: POST
    path: "/carriage/distributors"
    description: "Register a distributing operator"
    roles: [NetworkAdmin, AffiliateSalesExec]
    code: 201
    input: [legal_name, distributor_type, rate_card_class, total_subscribers, "credit_limit_cents?"]
    output: Distributor
    side_effects: ["status = ACTIVE, credit_hold_reason = NONE, receivable_balance_cents = 0, audit_recovery_balance_cents = 0, executed_agreement_count = 0, version = 1"]

  - method: GET
    path: "/carriage/distributors"
    description: "List operators with filters and pagination"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: ["status?", "distributor_type?", "rate_card_class?", "limit?", "offset?"]
    output: Distributor[]
    side_effects: []

  - method: GET
    path: "/carriage/distributors/{distributorId}"
    description: "Read one operator including its receivable and credit posture"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: PATCH
    path: "/carriage/distributors/{distributorId}"
    description: "Adjust the operator's subscriber base or credit limit"
    roles: [NetworkAdmin]
    code: 200
    input: ["total_subscribers?", "credit_limit_cents?"]
    output: Distributor
    side_effects:
      - "increments Distributor.version by 1"
      - "does NOT retroactively re-price already-ACCEPTED SubscriberReport rows; the new total_subscribers applies to future penetration and floor computations only"

  - method: POST
    path: "/carriage/distributors/{distributorId}/credit-review"
    description: "Operator credit posture action: PLACE_HOLD | RELEASE_HOLD | SUSPEND | TERMINATE | REACTIVATE"
    roles: [NetworkAdmin, RevenueAccountant]
    code: 200
    input: [action, "reason?"]
    output: Distributor
    side_effects:
      - "PLACE_HOLD: status ACTIVE -> CREDIT_HOLD with credit_hold_reason = MANUAL_REVIEW, then every CarriageAgreement of this operator with lifecycle_status == EXECUTED transitions to SUSPENDED (suspension_reason = DISTRIBUTOR_CREDIT_HOLD) in created_at ASC order, then their CLEARED/ACTIVE RightsWindow rows transition to BLOCKED (block_reason = AGREEMENT_SUSPENDED), then each affected ContentTitle recomputes cleared_window_count and distribution_coverage_status"
      - "RELEASE_HOLD: requires receivable_balance_cents <= credit_limit_cents and audit_recovery_balance_cents == 0; status CREDIT_HOLD -> ACTIVE, credit_hold_reason = NONE; suspended agreements are NOT auto-reinstated"
      - "SUSPEND / TERMINATE / REACTIVATE: sets status accordingly; TERMINATE additionally forbids any Invoice in status IN {ISSUED, PARTIALLY_PAID}"
      - "increments Distributor.version by 1"

  # ---------------- CarriageAgreement ----------------
  - method: POST
    path: "/carriage/agreements"
    description: "Draft a carriage agreement for an operator"
    roles: [AffiliateSalesExec]
    code: 201
    input: [distributor_id, contract_code, term_start_date, term_end_date, base_license_fee_cents_per_sub, escalator_pct, penetration_floor_pct, committed_tier, "launch_fee_cents?", "marketing_commitment_cents?"]
    output: CarriageAgreement
    side_effects:
      - "lifecycle_status = DRAFT, renewal_status = NOT_DUE, negotiation_round = 0, penetration_compliance_status = UNKNOWN, penetration_breach_count = 0, consecutive_compliant_periods = 0, recognized_revenue_cents = 0, version = 1"
      - "escalated_rate_cents_per_sub and effective_rate_cents_per_sub stamped by calculations.agreement_effective_rate with contract_year_index computed from term_start_date"

  - method: GET
    path: "/carriage/agreements"
    description: "List agreements, filterable by operator and by either state dimension"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: ["distributor_id?", "lifecycle_status?", "renewal_status?", "committed_tier?", "limit?", "offset?"]
    output: CarriageAgreement[]
    side_effects: []

  - method: GET
    path: "/carriage/agreements/{agreementId}"
    description: "Read one agreement including both state dimensions, rates and compliance counters"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: CarriageAgreement
    side_effects: []

  - method: PATCH
    path: "/carriage/agreements/{agreementId}"
    description: "Amend commercial terms while the agreement is still DRAFT or NEGOTIATING"
    roles: [AffiliateSalesExec]
    code: 200
    input: ["base_license_fee_cents_per_sub?", "escalator_pct?", "penetration_floor_pct?", "committed_tier?", "term_end_date?", "launch_fee_cents?", "marketing_commitment_cents?"]
    output: CarriageAgreement
    side_effects:
      - "recompute escalated_rate_cents_per_sub and effective_rate_cents_per_sub"
      - "increments CarriageAgreement.version by 1"
      - "rejected with ERR_INVALID_AGREEMENT_STATE once lifecycle_status IN {EXECUTED, SUSPENDED, EXPIRED, TERMINATED}"

  - method: POST
    path: "/carriage/agreements/{agreementId}/lifecycle"
    description: "Dimension-1 action: SUBMIT_FOR_NEGOTIATION | RETURN_TO_DRAFT | EXECUTE | SUSPEND | REINSTATE | TERMINATE"
    roles: [AffiliateSalesExec]
    code: 200
    input: [action, "suspension_reason?"]
    output: CarriageAgreement
    side_effects:
      - "executes the matching SM1 transition with all of its declared side effects"
      - "EXECUTE creates LAUNCH_FEE and MARKETING_SUPPORT MarketingCommitment rows when the corresponding agreement amounts are > 0"
      - "SUSPEND cascades BLOCKED onto CLEARED/ACTIVE RightsWindow rows and re-derives each affected ContentTitle"
      - "increments CarriageAgreement.version by 1"

  - method: POST
    path: "/carriage/agreements/{agreementId}/renewal"
    description: "Dimension-2 action: START_ANALYSIS | OFFER | REOPEN_ANALYSIS | RENEW | LAPSE"
    roles: [AffiliateSalesExec]
    code: 200
    input: [action]
    output: CarriageAgreement
    side_effects:
      - "executes the matching SM2 transition; lifecycle_status is never written by this endpoint"
      - "REOPEN_ANALYSIS increments negotiation_round; RENEW extends term_end_date by RENEWAL_TERM_MONTHS and re-stamps the rate fields"
      - "increments CarriageAgreement.version by 1"

  - method: GET
    path: "/carriage/agreements/{agreementId}/settlement-summary"
    description: "Computed read: revenue recognition and receivable roll-up for one agreement"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: { agreement_id: string, recognized_revenue_cents: integer, accepted_report_fee_total_cents: integer, invoiced_gross_total_cents: integer, open_receivable_cents: integer, marketing_committed_cents: integer, marketing_earned_cents: integer, marketing_remaining_cents: integer, marketing_forfeited_cents: integer, marketing_conserved_identity_holds: boolean, revenue_identity_holds: boolean }
    side_effects: []

  # ---------------- RateCardEntry ----------------
  - method: POST
    path: "/carriage/rate-card-entries"
    description: "Publish an immutable rate-card row"
    roles: [NetworkAdmin]
    code: 201
    input: [rate_card_class, tier, published_rate_cents_per_sub, "min_subscribers?", effective_from, "effective_to?"]
    output: RateCardEntry
    side_effects: ["immutable once created: no update or delete endpoint exists and the entity carries no version field"]

  - method: GET
    path: "/carriage/rate-card-entries"
    description: "List published rate-card rows"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: ["rate_card_class?", "tier?", "limit?", "offset?"]
    output: RateCardEntry[]
    side_effects: []

  - method: GET
    path: "/carriage/rate-card-entries/{rateCardEntryId}"
    description: "Read one rate-card row"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, RightsAdministrator, DistributorLiaison]
    code: 200
    input: []
    output: RateCardEntry
    side_effects: []

  # ---------------- MfnClause ----------------
  - method: POST
    path: "/carriage/mfn-clauses"
    description: "Attach a most-favored-nations clause to an agreement"
    roles: [AffiliateSalesExec]
    code: 201
    input: [agreement_id, mfn_scope, "min_peer_subscribers?", rate_floor_cents]
    output: MfnClause
    side_effects: ["status = ACTIVE, benchmark_status = NOT_EVALUATED, benchmark_rate_cents = null, benchmark_peer_agreement_id = null, last_reset_at = null, version = 1", "the agreement's effective_rate_cents_per_sub is NOT changed until the clause is reset"]

  - method: GET
    path: "/carriage/mfn-clauses"
    description: "List MFN clauses, filterable by owning agreement or by the peer that set the benchmark"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "benchmark_peer_agreement_id?", "status?", "benchmark_status?", "limit?", "offset?"]
    output: MfnClause[]
    side_effects: []

  - method: GET
    path: "/carriage/mfn-clauses/{mfnClauseId}"
    description: "Read one MFN clause with its benchmark evaluation"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: MfnClause
    side_effects: []

  - method: POST
    path: "/carriage/mfn-clauses/{mfnClauseId}/reset"
    description: "Re-run the MFN benchmark (action=RESET) or waive the clause (action=WAIVE); OCC-guarded on the owning agreement"
    roles: [AffiliateSalesExec]
    code: 200
    input: [action, expected_agreement_version]
    output: MfnClause
    side_effects:
      - "RESET: calculations.mfn_benchmark_rate stamps benchmark_rate_cents, benchmark_peer_agreement_id, benchmark_status and last_reset_at"
      - "CASCADE LINK 1: because the benchmark moved, the owning CarriageAgreement re-stamps effective_rate_cents_per_sub and mfn_capped"
      - "CASCADE LINK 2: because the effective rate changed, every SubscriberReport of that agreement with status IN {ACCEPTED, AUDIT_ADJUSTED} and invoice_id == null re-stamps rate_applied_cents_per_sub and license_fee_due_cents under the FINAL variant"
      - "CASCADE LINK 3: because those report fees changed, CarriageAgreement.recognized_revenue_cents is recomputed as the sum over those reports"
      - "CASCADE LINK 4: because the recognized revenue changed, every Invoice of that agreement still in status DRAFT re-runs calculations.invoice_net_due and re-stamps gross_license_fee_cents, coop_cap_pct, coop_offset_cents, launch_fee_offset_cents and net_due_cents"
      - "WAIVE: status ACTIVE -> WAIVED and the owning agreement's effective_rate_cents_per_sub reverts to escalated_rate_cents_per_sub with mfn_capped = false"
      - "increments CarriageAgreement.version by 1 and MfnClause.version by 1"

  # ---------------- SubscriberReport ----------------
  - method: POST
    path: "/carriage/subscriber-reports"
    description: "File a monthly subscriber report (or a restatement of a RESTATED report); OCC-guarded on the agreement"
    roles: [DistributorLiaison, RevenueAccountant]
    code: 201
    input: [agreement_id, period_month, reported_subscribers, reported_tier, "restatement_of_report_id?", expected_agreement_version]
    output: SubscriberReport
    side_effects:
      - "status = SUBMITTED, license_fee_due_cents = 0, audit_adjustment_cents = 0, invoice_id = null, accepted_at = null, version = 1"
      - "penetration_pct, rate_applied_cents_per_sub, tier_placement_breach and provisional_fee_cents stamped under the PROVISIONAL variant of calculations.subscriber_report_license_fee"
      - "when restatement_of_report_id is supplied, that report transitions RESTATED -> SUPERSEDED"
      - "increments CarriageAgreement.version by 1"

  - method: GET
    path: "/carriage/subscriber-reports"
    description: "List subscriber reports, filterable by agreement, status, period, restatement target or billing invoice"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "status?", "period_month?", "restatement_of_report_id?", "invoice_id?", "limit?", "offset?"]
    output: SubscriberReport[]
    side_effects: []

  - method: GET
    path: "/carriage/subscriber-reports/{reportId}"
    description: "Read one subscriber report with both fee variants"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: SubscriberReport
    side_effects: []

  - method: POST
    path: "/carriage/subscriber-reports/{reportId}/review"
    description: "Review action: ACCEPT | DISPUTE | REQUEST_RESTATEMENT | ACCEPT_ADJUSTMENT"
    roles: [RevenueAccountant]
    code: 200
    input: [action, "note?"]
    output: SubscriberReport
    side_effects:
      - "ACCEPT: stamps the FINAL fee variant, then runs the four-link cascade declared on SM3's SUBMITTED -> ACCEPTED transition (agreement revenue and compliance counters, possible auto-SUSPEND, RightsWindow blocking, ContentTitle coverage re-derivation)"
      - "DISPUTE / REQUEST_RESTATEMENT / ACCEPT_ADJUSTMENT: execute the matching SM3 transition"
      - "increments SubscriberReport.version by 1 and CarriageAgreement.version by 1 whenever the agreement is touched"

  # ---------------- AuditEngagement / AuditFinding ----------------
  - method: POST
    path: "/carriage/audit-engagements"
    description: "Open an audit engagement over a range of reported months, choosing the recovery rate basis"
    roles: [AuditManager]
    code: 201
    input: [agreement_id, sample_period_start, sample_period_end, rate_basis]
    output: AuditEngagement
    side_effects: ["status = OPENED, every computed recovery field 0, penalty_multiplier = 1.0, recovery_invoice_id = null, findings_issued_at = null, version = 1"]

  - method: GET
    path: "/carriage/audit-engagements"
    description: "List engagements, filterable by agreement, status or the recovery invoice raised for them"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["agreement_id?", "status?", "recovery_invoice_id?", "rate_basis?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []

  - method: GET
    path: "/carriage/audit-engagements/{engagementId}"
    description: "Read one engagement with the full recovery breakdown"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []

  - method: POST
    path: "/carriage/audit-engagements/{engagementId}/lifecycle"
    description: "Engagement action: START_FIELDWORK | ISSUE_FINDINGS | CLOSE_NO_FINDING"
    roles: [AuditManager]
    code: 200
    input: [action]
    output: AuditEngagement
    side_effects:
      - "ISSUE_FINDINGS: runs calculations.audit_recovery_amount under the engagement's rate_basis, then the three-link cascade declared on SM4's FIELDWORK -> FINDINGS_ISSUED transition (report AUDIT_ADJUSTED flips, agreement revenue increase, compliance re-derivation)"
      - "CLOSE_NO_FINDING: zeroes every recovery field and touches no other entity"
      - "increments AuditEngagement.version by 1"

  - method: POST
    path: "/carriage/audit-engagements/{engagementId}/findings"
    description: "Record one audited-versus-reported variance against an accepted report"
    roles: [AuditManager]
    code: 201
    input: [subscriber_report_id, audited_subscribers]
    output: AuditFinding
    side_effects:
      - "period_month and reported_subscribers snapshotted from the named SubscriberReport; variance_subscribers = max(0, audited_subscribers - reported_subscribers)"
      - "rate_applied_cents_per_sub and finding_recovery_cents remain 0 until the engagement issues findings"
      - "immutable: no update or delete endpoint exists and the entity carries no version field"

  - method: GET
    path: "/carriage/audit-findings"
    description: "List audit findings, filterable by engagement or by the report they contradict"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: ["engagement_id?", "subscriber_report_id?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: GET
    path: "/carriage/audit-findings/{findingId}"
    description: "Read one audit finding"
    roles: [NetworkAdmin, AffiliateSalesExec, RevenueAccountant, AuditManager, DistributorLiaison]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

