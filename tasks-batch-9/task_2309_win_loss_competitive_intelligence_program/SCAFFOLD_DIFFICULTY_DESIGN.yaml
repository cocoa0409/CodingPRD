              captures: { comp_id: $.data.id }
            - call: "POST /loss-reasons"
              payload: { program_id: "${prog_id}", code: "PRICE", label: "Price" }
              as: ProgramAdmin
              captures: { lr_price_id: $.data.id }
            - call: "POST /loss-reasons"
              payload: { program_id: "${prog_id}", code: "FEATURE_GAP", label: "Feature gap" }
              as: ProgramAdmin
              captures: { lr_gap_id: $.data.id }
            - call: "POST /analysts"
              payload: { program_id: "${prog_id}", full_name: "Ana One", linked_user_ref: "u-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00Z", sales_org_member: false }
              as: ProgramAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /analysts"
              payload: { program_id: "${prog_id}", full_name: "Ana Two", linked_user_ref: "u-ana-2", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00Z", sales_org_member: false }
              as: ProgramAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /deals"
              payload: { program_id: "${prog_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", primary_competitor_id: "${comp_id}" }
              as: ProgramAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /deals"
              payload: { program_id: "${prog_id}", crm_deal_ref: "CRM-1002", outcome: "LOST", acr_usd: 260000.00, close_date: "2026-06-20T00:00:00Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-78", primary_competitor_id: "${comp_id}" }
              as: ProgramAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts"
              payload: { email: "buyer1@acme.test", full_name: "Bea Uno", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts/${c1_id}/consent"
              payload: { consent_status: "GRANTED" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /deals/${d2_id}/buyer-contacts"
              payload: { email: "buyer2@brava.test", full_name: "Cal Dos", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /deals/${d2_id}/buyer-contacts/${c2_id}/consent"
              payload: { consent_status: "GRANTED" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames"
              payload: { program_id: "${prog_id}", label: "FY27Q1 Frame", window_start: "2026-04-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", quota_won: 2, quota_lost: 2, quota_no_decision: 1, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { frame_id: $.data.id }
            - call: "POST /sampling-frames/${frame_id}/seal"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames/${frame_id}/draw"
              payload: { stratum: "LOST", requested_count: 2 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews"
              payload: { deal_id: "${d1_id}", buyer_contact_id: "${c1_id}", analyst_id: "${a1_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T15:00:00Z" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /interviews"
              payload: { deal_id: "${d2_id}", buyer_contact_id: "${c2_id}", analyst_id: "${a1_id}", scheduled_start_at: "2026-08-11T14:00:00Z", scheduled_end_at: "2026-08-11T15:00:00Z" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { i2_id: $.data.id }
            - call: "POST /interviews/${i1_id}/responses"
              payload: { question_key: "EVALUATION_CRITERIA", verbatim_text: "Integration depth mattered most.", recorded_at: "2026-08-10T14:10:00Z", rating: 4 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews/${i1_id}/responses"
              payload: { question_key: "COMPETITOR_POSITIONING", verbatim_text: "Northwind bundled the suite.", recorded_at: "2026-08-10T14:15:00Z", rating: 4 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews/${i1_id}/responses"
              payload: { question_key: "PRICING_PERCEPTION", verbatim_text: "We were 20 percent above.", recorded_at: "2026-08-10T14:20:00Z", rating: 2 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews/${i2_id}/responses"
