      - name: tree_person_limit_exceeded_on_free_tier
        claim_type: Aggregate validation
        grounds: ["validations[priority=22]", "errors[ERR_TREE_PERSON_LIMIT]", entities.FamilyTree.fields.person_count]
        distinguishing_aspect: "TIER_TREE_PERSON_LIMIT[FREE] is 3: the 4th ACTIVE TreePerson in a FREE-tier owner's tree is rejected with ERR_TREE_PERSON_LIMIT (422) and person_count stays at 3."
