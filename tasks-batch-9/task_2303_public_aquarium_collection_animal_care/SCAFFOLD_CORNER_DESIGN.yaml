  - name: validation_green_only_plan_line_rejects_a_red_species_at_request_creation
    claim_type: Violation → Error
    grounds:
    - §1.4 priority 43 (ERR_SUSTAINABILITY_REQUIREMENT_VIOLATION)
    - §1.6 ERR_SUSTAINABILITY_REQUIREMENT_VIOLATION (409)
    - §1.1 CollectionPlanEntry.sustainability_requirement
    - §1.1 Species.sustainability_rating
    - §1.5 POST /aquarium/acquisition-requests
    distinguishing_aspect: 'The requirement is enforced at request CREATION, not deferred to clearance: a RED species under a GREEN_ONLY line is refused with 409 before any sustainability_score is stamped, while the same species is admitted under a GREEN_OR_YELLOW... line only when the rating is inside the admitted set — here proved by the YELLOW sibling species succeeding under the same line.'
