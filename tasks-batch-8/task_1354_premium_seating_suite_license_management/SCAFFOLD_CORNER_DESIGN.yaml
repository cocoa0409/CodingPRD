            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "G2", event_type: RIVALRY, starts_at: "2026-10-05T17:00:00Z", duration_hours: 4, rental_base_price_cents: 650000 }, as: StadiumAdmin, captures: { e2: $.data.id } }
