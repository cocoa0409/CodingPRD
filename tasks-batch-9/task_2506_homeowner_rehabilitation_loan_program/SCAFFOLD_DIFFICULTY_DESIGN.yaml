            - call: "POST /rehab/write-ups/${wu_id}/approve"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /rehab/bid-solicitations"
              payload: { application_id: "${app_id}", write_up_id: "${wu_id}", bid_due_at: "2026-09-01T00:00:00Z", min_bids_required: 1 }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { sol_id: $.data.id }
            - call: "POST /rehab/bids"
              payload: { solicitation_id: "${sol_id}", contractor_id: "${c1_id}", amount_cents: 3200000, proposed_start_date: "2026-09-05", proposed_end_date: "2026-11-30" }
              as: Contractor
