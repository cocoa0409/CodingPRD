  # ===========================================================================
  # Section: errors — triggerability sweep for codes not exercised elsewhere
  # ===========================================================================
  - section: errors
    instances:
      - name: err_deposit_insufficient_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DEPOSIT_INSUFFICIENT]"
          - "validations[priority=14]"
        distinguishing_aspect: "Sourcing a reservation whose deposit hold exceeds artist balance (artist already fully leveraged) fails ERR_DEPOSIT_INSUFFICIENT 402."
        test_recipe:
          setup:
            - "STANDARD artist; two models rv 300000 (hold 55000 each); artist balance starts 0, so the FIRST source already overdraws? No — hold debits balance only if headroom allows; with balance 0 and no prepayment endpoint, deposit check compares held sum vs balance: to trigger deterministically, use artist created with deposit_waived false and a policy where balance must cover hold: first source fails immediately since balance 0 < 55000"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Broke Act", tier: "STANDARD" }
              as: OpsManager
              captures: { ba: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "BR-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 300000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { bm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${bm}", serial_number: "BR-U1", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/tours"
              payload: { artist_id: "${ba}", name: "Broke Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-B" }
              as: TourManager
              captures: { bt: $.data.id }
            - call: "POST /backline/tours/${bt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { bs: $.data.id }
            - call: "POST /backline/tour-stops/${bs}/rider-lines"
              payload: { gear_model_id: "${bm}", quantity: 1 }
              as: TourManager
              captures: { brl: $.data.id }
          trigger:
            - call: "POST /backline/rider-lines/${brl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { dep_err: $.data.error_id }
          assert:
            - "error_id == ERR_DEPOSIT_INSUFFICIENT, http 402 (balance 0 cannot cover 55000 hold)"

  # ===========================================================================
  # Section: roles — RBAC claims
  # ===========================================================================
  - section: roles
    instances:
      - name: warehouse_tech_cannot_create_tour
        claim_type: rbac_denial
        grounds: [roles: WarehouseTech, roles: TourManager]
        distinguishing_aspect: "WarehouseTech (no tour-create permission) gets ERR_UNAUTHORIZED 403 on POST /backline/tours."
        test_recipe:
          setup: ["artist exists"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "RBAC Act" }
              as: OpsManager
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /backline/tours"
              payload: { artist_id: "${ra}", name: "Nope", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: WarehouseTech
              captures: { rbac_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED, http 403"

      - name: vendor_rep_scoped_to_own_vendor
        claim_type: rbac_ownership
        grounds:
          - roles: PartnerVendorRep
          - validations[priority=13]
        distinguishing_aspect: "A PartnerVendorRep acting with X-User-ID of vendor A cannot accept a request addressed to vendor B (ERR_VENDOR_NOT_ELIGIBLE 422)."
        test_recipe:
          setup: ["two approved vendors A and B; one cross-rental request addressed to B"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Scope Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { sa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "SC-PA-1", category: "PA", daily_rate_cents: 80000, replacement_value_cents: 600000, weight_class: "HEAVY" }
              as: OpsManager
              captures: { sm: $.data.id }
            - call: "POST /backline/partner-vendors"
              payload: { name: "VendorA", city_codes: ["LAX"], commission_bps: 1000 }
              as: OpsManager
              captures: { vA: $.data.id }
            - call: "POST /backline/partner-vendors/${vA}/approve"
              payload: {}
              as: OpsManager
            - call: "POST /backline/partner-vendors"
              payload: { name: "VendorB", city_codes: ["LAX"], commission_bps: 1000 }
              as: OpsManager
              captures: { vB: $.data.id }
            - call: "POST /backline/partner-vendors/${vB}/approve"
              payload: {}
              as: OpsManager
            - call: "POST /backline/tours"
              payload: { artist_id: "${sa}", name: "Scope Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { st: $.data.id }
            - call: "POST /backline/tours/${st}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
              captures: { ss: $.data.id }
            - call: "POST /backline/tour-stops/${ss}/rider-lines"
              payload: { gear_model_id: "${sm}", quantity: 1 }
              as: TourManager
              captures: { srl: $.data.id }
            - call: "POST /backline/rider-lines/${srl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-11T00:00:00Z", end_date: "2026-08-13T00:00:00Z", use_cross_rental: true, partner_vendor_id: "${vB}", vendor_rate_cents_per_day: 70000 }
              as: LogisticsCoordinator
              captures: { sr: $.data.id }
            - call: "GET /backline/cross-rental-requests"
              payload: { reservation_line_id: "${sr}" }
              as: LogisticsCoordinator
              captures: { scrr: "$.data[0].id" }
          trigger:
            - call: "POST /backline/cross-rental-requests/${scrr}/accept"
              payload: {}
              as: PartnerVendorRep
              as_user_id: "${vA}"
              captures: { scope_err: $.data.error_id }
          assert:
            - "error_id == ERR_VENDOR_NOT_ELIGIBLE, http 422 (rep of vendor A cannot accept B's request)"

  # ===========================================================================
  # Section: cross_cutting_layers — OCC / cascade / derived-field claims
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_version_occ_on_reservation_settle
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[reservation-settle-stale-reservation]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Settling a reservation with a version captured before its inspect transition (which bumped version) fails 412; settle with fresh version succeeds."
        test_recipe:
          setup: ["reservation INSPECTED (no damage); version captured at INSPECTED, then a no-op re-read, settle with stale version"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "OCC2 Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { oa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "O2-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { om: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${om}", serial_number: "O2-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { ou: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${oa}", name: "OCC2 Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { ot: $.data.id }
            - call: "POST /backline/tours/${ot}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-06T00:00:00Z", load_in_ts: "2026-08-06T10:00:00Z" }
              as: TourManager
              captures: { os: $.data.id }
            - call: "POST /backline/tour-stops/${os}/rider-lines"
              payload: { gear_model_id: "${om}", quantity: 1 }
              as: TourManager
              captures: { orl: $.data.id }
            - call: "POST /backline/rider-lines/${orl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-07T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { or2: $.data.id }
            - call: "GET /backline/tours/${ot}"
              as: TourManager
              captures: { ot_v: $.data.version }
            - call: "POST /backline/tours/${ot}/activate"
              payload: { expected_tour_version: "${ot_v}" }
              as: TourManager
            - call: "POST /backline/shipments"
              payload: { tour_id: "${ot}", from_city_code: "LAX", to_city_code: "LAX", ship_date: "2026-08-05T00:00:00Z", capacity_kg: 100 }
              as: LogisticsCoordinator
              captures: { osh: $.data.id }
            - call: "POST /backline/shipments/${osh}/lines"
              payload: { gear_unit_id: "${ou}", weight_kg: 5, labor_minutes: 5 }
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${or2}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /backline/reservation-lines/${or2}"
              as: TourManager
              captures: { or_v_stale: $.data.version }
            - call: "POST /backline/reservation-lines/${or2}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/reservation-lines/${or2}/check-in"
              payload: { checked_in_at: "2026-08-07T09:00:00Z" }
              as: WarehouseTech
            - call: "POST /backline/reservation-lines/${or2}/inspect"
              payload: { damage_present: false }
              as: WarehouseTech
          trigger:
            - call: "POST /backline/reservation-lines/${or2}/settle"
              payload: { expected_reservation_version: "${or_v_stale}" }
              as: TourManager
              captures: { occ2_err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION, http 412 (version advanced through dispatch/deliver/check-in/inspect since the captured read)"

      - name: cascade_tour_cancel_releases_units
        claim_type: cascade_down
        grounds:
          - state_machines.Tour.DRAFT_to_CANCELLED
          - state_machines.GearUnit.RESERVED_to_AVAILABLE
        distinguishing_aspect: "Cancelling a DRAFT tour cascades: stop CANCELLED, rider line CANCELLED, reservation CANCELLED, unit back to AVAILABLE with active_reservation_id null, deposit credited back."
        test_recipe:
          setup: ["DRAFT tour with one sourced rider line (unit RESERVED, deposit held)"]
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "CX Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { ca: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "CX-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { cm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${cm}", serial_number: "CX-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { cu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ca}", name: "CX Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { ct: $.data.id }
            - call: "POST /backline/tours/${ct}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { cs: $.data.id }
            - call: "POST /backline/tour-stops/${cs}/rider-lines"
              payload: { gear_model_id: "${cm}", quantity: 1 }
              as: TourManager
              captures: { crl: $.data.id }
            - call: "POST /backline/rider-lines/${crl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { cr: $.data.id }
          trigger:
            - call: "POST /backline/tours/${ct}/cancel"
              payload: {}
              as: TourManager
          assert:
            - "Tour.${ct}.status == CANCELLED"
            - "TourStop.${cs}.status == CANCELLED"
            - "RiderLine.${crl}.status == CANCELLED"
            - "ReservationLine.${cr}.status == CANCELLED"
            - "GearUnit.${cu}.status == AVAILABLE and active_reservation_id == null"

  # ===========================================================================
  # Section: consistency_model — immediate consistency
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All mutations visible in the same request's response: POST /backline/gear-units returns the created entity with computed flight_case_required already resolved; GET right after shows identical state."
        test_recipe:
          setup: ["one HEAVY model"]
          setup_api_calls:
            - call: "POST /backline/gear-models"
              payload: { sku: "IM-PA-1", category: "PA", daily_rate_cents: 50000, replacement_value_cents: 500000, weight_class: "HEAVY" }
              as: OpsManager
              captures: { im: $.data.id }
          trigger:
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${im}", serial_number: "IM-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { iu: $.data.id, iu_fcr: $.data.flight_case_required, iu_status: $.data.status }
            - call: "GET /backline/gear-units/${iu}"
              as: OpsManager
          assert:
            - "create response already carries flight_case_required == true and status == AVAILABLE (no async lag)"
            - "GET returns identical condition_score 100 and version 1"
