      - name: priority_authz_before_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=11]", "validations[priority=20]"]
        distinguishing_aspect: "A FieldStaff GET on a waiver with a non-existent id returns ERR_FORBIDDEN (priority 11), never ERR_NOT_FOUND (priority 20) — authorization precedes existence."
        test_recipe:
          setup: ["empty DB (no waiver exists at the probed id)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /farm/waivers/12345678-1234-1234-1234-123456789abc", payload: {}, as: FieldStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (not ERR_NOT_FOUND)"

