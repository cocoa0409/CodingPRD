              as_user_id: "${dep_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_DELIVERY_EXCEEDS_RECEIPT"
            - "Bin.${bin_id}.held_bushels == 0"
            - "GET /delivery-orders filtered by receipt_id ${rc_id} returns total_count == 0"

      - name: indemnity_claim_with_zero_claimed_cents_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 88]", "errors[ERR_CLAIM_NOT_ELIGIBLE]"]
        distinguishing_aspect: "claimed_cents must be at least 1: filing 0 against an ISSUED receipt at a CLAIMS_OPEN warehouse returns 422 ERR_CLAIM_NOT_ELIGIBLE and creates no claim."
        test_recipe:
          setup: ["Base chain complete; insolvency DECLARED 2026-09-01 at 400 c/bu then OPEN_CLAIMS."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /_clock/set_current_utc"
