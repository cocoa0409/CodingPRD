            - "The first trigger returns HTTP 409 with data.error_id == ERR_PLAT_REVISION_LIMIT and leaves plat_status == SUBMITTED and plat_revision_round == 2"
            - "The second trigger returns HTTP 200 with plat_status == APPROVED and posture == OPEN"
