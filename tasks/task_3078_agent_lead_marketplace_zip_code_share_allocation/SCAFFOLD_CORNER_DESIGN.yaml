scaffold_corner_design:
- section: entities
  instances:
  - name: market_create_returns_defaults_and_system_fields
    claim_type: Creation
    grounds:
    - entities.Market
    - endpoints.POST_/markets
    distinguishing_aspect: Creating a market with only required fields returns 201 with participation_agreement defaulted to IDX_FULL, market_status
      OPEN, allocated_bps 0, available_bps 10000, version 1, and system id/created_at/updated_at — input cannot inject status or counters.
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /markets
        payload:
          zip_code: '90210'
          state_code: CA
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          m1: $.data.id
      assert:
      - response status 201, response_type object
      - Market.${m1}.participation_agreement == IDX_FULL and market_status == OPEN
      - Market.${m1}.allocated_bps == 0 and available_bps == 10000
      - Market.${m1}.version == 1 and id/created_at/updated_at are non-null
  - name: agent_create_ignores_counter_input_and_defaults
    claim_type: Defaults
    grounds:
    - entities.Agent
    - endpoints.POST_/agents
    distinguishing_aspect: 'Client-supplied counters (offers_received, rolling_score, performance_tier) are ignored: a fresh agent always starts
      with all counters 0, rolling_score 0, official_score 0, performance_tier UNRATED, agent_status ACTIVE.'
    test_recipe:
      setup:
      - Clock pinned. Brokerage exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /brokerages
        payload:
          legal_name: CornerB
          primary_state: CA
        as: PlatformAdmin
        captures:
          cb: $.data.id
      trigger:
      - call: POST /agents
        payload:
          full_name: Fresh
          email: fresh@x.com
          license_number: L-FR
          license_state: CA
          brokerage_id: ${cb}
        as: PlatformAdmin
        captures:
          fa: $.data.id
      assert:
      - Agent.${fa}.offers_received == 0 and offers_accepted == 0 and offers_expired == 0
      - Agent.${fa}.rolling_score == 0 and official_score == 0 and performance_tier == UNRATED
      - Agent.${fa}.agent_status == ACTIVE and rating_sum == 0 and rating_count == 0
  - name: market_get_unknown_id_returns_404
    claim_type: Not Found
    grounds:
    - endpoints.GET_/markets/{id}
    - errors.ERR_MARKET_NOT_FOUND
    distinguishing_aspect: A well-formed but unknown market id returns the entity-specific ERR_MARKET_NOT_FOUND 404, not a generic 400.
    test_recipe:
      setup:
      - Clock pinned. No markets.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /markets/00000000-0000-0000-0000-000000000000
        payload: {}
        as: MarketplaceOps
        captures:
          err404: $.data.error_id
      assert:
      - err404 == ERR_MARKET_NOT_FOUND with http 404
  - name: leads_list_paginates_and_filters
    claim_type: Listing
    grounds:
    - endpoints.GET_/leads
    - response_envelope.pagination_defaults
    distinguishing_aspect: With 3 leads in a market, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row has_more
      false; the lead_status filter narrows the set.
    test_recipe:
      setup:
      - Clock pinned. Market pag/96001 CA; agent PA 6000-bps ACTIVE; three leads created with distinct consumers.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '96001'
          state_code: CA
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mp: $.data.id
          mp_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: PagB
          primary_state: CA
        as: PlatformAdmin
        captures:
          pb: $.data.id
      - call: POST /agents
        payload:
          full_name: PA
          email: pa@x.com
          license_number: L-PA
          license_state: CA
          brokerage_id: ${pb}
        as: PlatformAdmin
        captures:
          apa: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mp}
          buyer_agent_id: ${apa}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${apa}
        captures:
          op: $.data.id
      - call: POST /share-orders/${op}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mp_v}
        as: Agent
        as_user_id: ${apa}
      - call: POST /leads
        payload:
          market_id: ${mp}
          listing_id: null
          consumer_key: pg1@x.com
          listing_agent_id: null
        as: MarketplaceOps
      - call: POST /leads
        payload:
          market_id: ${mp}
          listing_id: null
          consumer_key: pg2@x.com
          listing_agent_id: null
        as: MarketplaceOps
      - call: POST /leads
        payload:
          market_id: ${mp}
          listing_id: null
          consumer_key: pg3@x.com
          listing_agent_id: null
        as: MarketplaceOps
      trigger:
      - call: GET /leads
        payload:
          market_id: ${mp}
          limit: 2
          offset: 0
        as: MarketplaceOps
      assert:
      - response returns 2 rows with total_count == 3 and has_more == true
      - GET /leads?market_id=${mp}&limit=2&offset=2 returns 1 row with has_more == false
      - GET /leads?market_id=${mp}&lead_status=ROUTED returns total_count == 3
      - GET /leads?market_id=${mp}&lead_status=CLOSED_LOST returns total_count == 0
  - name: share_order_missing_required_field_returns_400
    claim_type: Required Fields
    grounds:
    - endpoints.POST_/share-orders
    - errors.ERR_VALIDATION
    distinguishing_aspect: Omitting required share_bps returns ERR_VALIDATION 400 before any state or capacity check runs.
    test_recipe:
      setup:
      - Clock pinned. Market rq/97035 OR; agent RQ.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97035'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mrq: $.data.id
          mrq_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: RqB
          primary_state: OR
        as: PlatformAdmin
        captures:
          brq: $.data.id
      - call: POST /agents
        payload:
          full_name: RQ
          email: rq@x.com
          license_number: L-RQ
          license_state: OR
          brokerage_id: ${brq}
        as: PlatformAdmin
        captures:
          arq: $.data.id
      trigger:
      - call: POST /share-orders
        payload:
          market_id: ${mrq}
          buyer_agent_id: ${arq}
          duration_days: 30
        as: Agent
        as_user_id: ${arq}
        captures:
          err400: $.data.error_id
      assert:
      - err400 == ERR_VALIDATION with http 400
  - name: invalid_enum_on_lead_close_returns_400
    claim_type: Type Constraints
    grounds:
    - endpoints.POST_/leads/{id}/close
    - errors.ERR_VALIDATION
    distinguishing_aspect: outcome 'MAYBE' is not a member of the close enum {CONVERTED, LOST}; rejected with ERR_VALIDATION 400.
    test_recipe:
      setup:
      - Clock pinned. Market en/97209 OR; agent EN 6000-bps ACTIVE; lead c-t1@x.com ASSIGNED to EN.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97209'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          men: $.data.id
          men_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: EnB
          primary_state: OR
        as: PlatformAdmin
        captures:
          ben: $.data.id
      - call: POST /agents
        payload:
          full_name: EN
          email: en@x.com
          license_number: L-EN
          license_state: OR
          brokerage_id: ${ben}
        as: PlatformAdmin
        captures:
          aen: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${men}
          buyer_agent_id: ${aen}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${aen}
        captures:
          oen: $.data.id
      - call: POST /share-orders/${oen}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${men_v}
        as: Agent
        as_user_id: ${aen}
      - call: POST /leads
        payload:
          market_id: ${men}
          listing_id: null
          consumer_key: c-t1@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          len: $.data.id
          len_v: $.data.version
      - call: GET /leads/${len}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asgen: $.data[0].id
      - call: POST /lead-assignments/${asgen}/accept
        payload:
          expected_lead_version: ${len_v}
        as: Agent
        as_user_id: ${aen}
      trigger:
      - call: POST /leads/${len}/close
        payload:
          outcome: MAYBE
        as: Agent
        as_user_id: ${aen}
        captures:
          enum_err: $.data.error_id
      assert:
      - enum_err == ERR_VALIDATION with http 400
      - Lead.${len}.lead_status remains ASSIGNED
  - name: payment_entity_is_immutable_no_update
    claim_type: Immutability
    grounds:
    - entities.Payment
    - endpoints.GET_/share-orders/{id}/payments
    distinguishing_aspect: 'Payment has common_fields false: no update endpoint exists, no version field, and a recorded DECLINED payment cannot
      be flipped to SUCCEEDED — the only way forward is a new Payment row.'
    test_recipe:
      setup:
      - Clock pinned. Market im/98109 WA; agent IM with PENDING_PAYMENT order; one DECLINED payment recorded.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '98109'
          state_code: WA
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mim: $.data.id
          mim_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: ImB
          primary_state: WA
        as: PlatformAdmin
        captures:
          bim: $.data.id
      - call: POST /agents
        payload:
          full_name: IM
          email: im@x.com
          license_number: L-IM
          license_state: WA
          brokerage_id: ${bim}
        as: PlatformAdmin
        captures:
          aim: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mim}
          buyer_agent_id: ${aim}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${aim}
        captures:
          oim: $.data.id
      - call: POST /share-orders/${oim}/payments
        payload:
          amount_cents: 900000
          outcome: DECLINED
          expected_market_version: ${mim_v}
        as: Agent
        as_user_id: ${aim}
      trigger:
      - call: GET /share-orders/${oim}/payments
        payload: {}
        as: MarketplaceOps
      assert:
      - the payment list has exactly 1 row with payment_status == DECLINED and no version field
      - ShareOrder.${oim}.order_status == PAYMENT_FAILED (terminal)
      - a second POST /share-orders/${oim}/payments is rejected with ERR_INVALID_STATE (PAYMENT_FAILED is terminal)
- section: state_machines
  instances:
  - name: lead_starts_new_and_terminal_lockdown
    claim_type: Initial State
    grounds:
    - state_machines.Lead
    - entities.Lead.fields.lead_status
    distinguishing_aspect: Every non-duplicate lead starts in NEW before the router runs; once CLOSED_LOST no further transition is accepted (close
      again -> ERR_ALREADY_TERMINAL).
    test_recipe:
      setup:
      - Clock pinned. Market tl/97205 OR; agent TL2 6000-bps ACTIVE; lead c-t1@x.com accepted then closed LOST.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97205'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mtl: $.data.id
          mtl_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: TlB
          primary_state: OR
        as: PlatformAdmin
        captures:
          btl: $.data.id
      - call: POST /agents
        payload:
          full_name: TL2
          email: tl2@x.com
          license_number: L-TL2
          license_state: OR
          brokerage_id: ${btl}
        as: PlatformAdmin
        captures:
          atl: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mtl}
          buyer_agent_id: ${atl}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${atl}
        captures:
          otl: $.data.id
      - call: POST /share-orders/${otl}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mtl_v}
        as: Agent
        as_user_id: ${atl}
      - call: POST /leads
        payload:
          market_id: ${mtl}
          listing_id: null
          consumer_key: c-t1@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ltl: $.data.id
          ltl_v: $.data.version
      - call: GET /leads/${ltl}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asgtl: $.data[0].id
      - call: POST /lead-assignments/${asgtl}/accept
        payload:
          expected_lead_version: ${ltl_v}
        as: Agent
        as_user_id: ${atl}
      - call: POST /leads/${ltl}/close
        payload:
          outcome: LOST
        as: Agent
        as_user_id: ${atl}
      trigger:
      - call: POST /leads/${ltl}/close
        payload:
          outcome: CONVERTED
        as: Agent
        as_user_id: ${atl}
        captures:
          term_err: $.data.error_id
      assert:
      - Lead.${ltl}.lead_status == CLOSED_LOST after the first close
      - term_err == ERR_ALREADY_TERMINAL (CLOSED_LOST is terminal)
      - Agent.${atl}.leads_closed_lost == 1 and leads_converted == 0 (no double count)
  - name: assignment_accept_precondition_wrong_lead_state
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.LeadAssignment.OFFERED_to_ACCEPTED
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: Accepting an assignment whose lead has already been cancelled (UNASSIGNED) is rejected with ERR_INVALID_STATE even
      though the assignment row is still OFFERED — the cross-entity precondition lead_status == ROUTED governs.
    test_recipe:
      setup:
      - Clock pinned. Market pc/97401 OR; agent PC 6000-bps ACTIVE; lead c-t1@x.com ROUTED; operator cancels the lead, which CANCELS the open
        offer.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97401'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mpc: $.data.id
          mpc_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: PcB
          primary_state: OR
        as: PlatformAdmin
        captures:
          bpc: $.data.id
      - call: POST /agents
        payload:
          full_name: PC
          email: pc@x.com
          license_number: L-PC
          license_state: OR
          brokerage_id: ${bpc}
        as: PlatformAdmin
        captures:
          apc: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mpc}
          buyer_agent_id: ${apc}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${apc}
        captures:
          opc: $.data.id
      - call: POST /share-orders/${opc}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mpc_v}
        as: Agent
        as_user_id: ${apc}
      - call: POST /leads
        payload:
          market_id: ${mpc}
          listing_id: null
          consumer_key: c-t1@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          lpc: $.data.id
          lpc_v: $.data.version
      - call: GET /leads/${lpc}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asgpc: $.data[0].id
      - call: POST /leads/${lpc}/cancel
        payload: {}
        as: MarketplaceOps
      trigger:
      - call: POST /lead-assignments/${asgpc}/accept
        payload:
          expected_lead_version: ${lpc_v}
        as: Agent
        as_user_id: ${apc}
        captures:
          acc_err: $.data.error_id
      assert:
      - acc_err is ERR_INVALID_STATE or ERR_STALE_LEAD_VERSION (cancel bumped Lead.version past ${lpc_v}); in either case the accept is rejected
      - LeadAssignment.${asgpc}.assignment_status == CANCELLED (operator cancel cascaded to the open offer)
      - Agent.${apc}.offers_accepted == 0
  - name: listing_invalid_transition_from_terminal
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Listing
    - errors.ERR_ALREADY_TERMINAL
    distinguishing_aspect: 'A REJECTED listing cannot be reviewed again, withdrawn, or re-approved: every trigger out of a terminal listing state
      returns ERR_ALREADY_TERMINAL.'
    test_recipe:
      setup:
      - Clock pinned. Market lx/97210 OR IDX_FULL; brokerage LB OR; agent LA OR; listing PENDING_REVIEW then rejected.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97210'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mlx: $.data.id
          mlx_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: LxB
          primary_state: OR
        as: PlatformAdmin
        captures:
          blx: $.data.id
      - call: POST /agents
        payload:
          full_name: LA
          email: la@x.com
          license_number: L-LA
          license_state: OR
          brokerage_id: ${blx}
        as: PlatformAdmin
        captures:
          ala: $.data.id
      - call: POST /listings
        payload:
          external_ref: E-1
          market_id: ${mlx}
          source_feed: MLS
          brokerage_id: ${blx}
          listing_agent_id: ${ala}
        as: BrokerageUser
        as_user_id: ${blx}
        captures:
          lstx: $.data.id
      - call: POST /listings/${lstx}/review
        payload:
          outcome: REJECTED
          compliance_note: bad data
        as: MarketplaceOps
      trigger:
      - call: POST /listings/${lstx}/review
        payload:
          outcome: APPROVED
        as: MarketplaceOps
        captures:
          lx_err: $.data.error_id
      - call: POST /listings/${lstx}/withdraw
        payload: {}
        as: MarketplaceOps
        captures:
          lx_err2: $.data.error_id
      assert:
      - lx_err == ERR_ALREADY_TERMINAL and lx_err2 == ERR_ALREADY_TERMINAL
      - Listing.${lstx}.listing_status == REJECTED and compliance_note == 'bad data'
  - name: connection_no_answer_side_effects
    claim_type: Side Effect Execution
    grounds:
    - state_machines.LiveConnection.BRIDGING_to_NO_ANSWER
    - entities.Agent.fields.connections_missed
    distinguishing_aspect: Recording duration_seconds 0 on a BRIDGING connection marks it NO_ANSWER, increments Agent.connections_missed by 1,
      recomputes rolling_score (65 -> 45), and creates no CallRecording.
    test_recipe:
      setup:
      - Clock pinned. Market cn/97211 OR; agent CN 6000-bps ACTIVE; lead c-t1@x.com ASSIGNED to CN; live connection BRIDGING.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97211'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mcn: $.data.id
          mcn_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: CnB
          primary_state: OR
        as: PlatformAdmin
        captures:
          bcn: $.data.id
      - call: POST /agents
        payload:
          full_name: CN
          email: cn@x.com
          license_number: L-CN
          license_state: OR
          brokerage_id: ${bcn}
        as: PlatformAdmin
        captures:
          acn: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mcn}
          buyer_agent_id: ${acn}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${acn}
        captures:
          ocn: $.data.id
      - call: POST /share-orders/${ocn}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mcn_v}
        as: Agent
        as_user_id: ${acn}
      - call: POST /leads
        payload:
          market_id: ${mcn}
          listing_id: null
          consumer_key: c-t1@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          lcn: $.data.id
          lcn_v: $.data.version
      - call: GET /leads/${lcn}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asgcn: $.data[0].id
      - call: POST /lead-assignments/${asgcn}/accept
        payload:
          expected_lead_version: ${lcn_v}
        as: Agent
        as_user_id: ${acn}
      - call: POST /live-connections
        payload:
          lead_id: ${lcn}
          consumer_key: c-t1@x.com
          listing_agent_id: null
        as: Agent
        as_user_id: ${acn}
        captures:
          conn1: $.data.id
      trigger:
      - call: POST /live-connections/${conn1}/record
        payload:
          duration_seconds: 0
          consent_given: true
        as: Agent
        as_user_id: ${acn}
      assert:
      - LiveConnection.${conn1}.connection_status == NO_ANSWER
      - Agent.${acn}.connections_missed == 1 and rolling_score == 45 (65 base minus 20 connection component)
      - GET /live-connections/${conn1}/recordings returns 0 rows (no recording stored)
  - name: claim_reject_leaves_ledger_untouched
    claim_type: Compensation
    grounds:
    - state_machines.CreditClaim.SUBMITTED_to_REJECTED
    - entities.ShareOrder.fields.credits_cents
