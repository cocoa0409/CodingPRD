              as: Provider
              as_user_id: "${v_id}"
              captures: { o44_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p45_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o45_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p75_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o75_id: $.data.id }
            - call: "POST /screening/orders"
