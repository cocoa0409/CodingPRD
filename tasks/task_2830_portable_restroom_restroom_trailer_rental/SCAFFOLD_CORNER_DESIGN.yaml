          rationale: "The TRAILER_HEADCOUNT_FLOOR boundary is probed at 399 and 400 there, with both mixes and both totals as literals, which is the tier-boundary and cross-tier claim for this calculation."

      - name: density_scoring_uses_capacity_as_the_denominator_without_drift
        claim_type: weighted_scoring
        grounds:
