            - call: GET /bundle-activations/${act_id}/checklist-items
              payload: {}
              as: ObstetricianAttending
              as_user_id: "${s_ob}"
              captures: { item_antihtn: "$.data[0].id", item_mag: "$.data[1].id", item_repeat_bp: "$.data[2].id", item_ob_bedside: "$.data[3].id" }
            - call: POST /_clock/set_current_utc
