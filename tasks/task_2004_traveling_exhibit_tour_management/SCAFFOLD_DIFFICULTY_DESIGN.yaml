              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "PACK", surface_score: 90, structural_score: 80, seal_intact: true }
              as: Registrar
              captures: { pack_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_id}/transition"
