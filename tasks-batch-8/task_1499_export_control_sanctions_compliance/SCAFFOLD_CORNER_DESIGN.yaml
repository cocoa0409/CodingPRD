            - "Order.${o_id}.surcharge_cents == 3500"
            - "Order.${o_id}.total_value_cents == 103500"

      - name: posture_recomputed_on_false_positive_resolution
        claim_type: correct_result
        grounds: [calculations.party_screening_posture]
        distinguishing_aspect: "Derived-field reconciliation: after the only POTENTIAL_MATCH is resolved FALSE_POSITIVE, the party posture recomputes to CLEAR (rows exist but none POTENTIAL/CONFIRMED)."
        test_recipe:
          setup: ["entry 'Summit Exports' (CHE, RESTRICTED) created before the party exists (creation sweep no-op); party 'Summit Exports' screened manually -> POTENTIAL_MATCH"]
          setup_api_calls:
            - call: "POST /compliance/screening-list-entries"
              payload: { list_source: "ENTITY_LIST", match_name: "Summit Exports", country_code: "CHE", severity: "RESTRICTED" }
