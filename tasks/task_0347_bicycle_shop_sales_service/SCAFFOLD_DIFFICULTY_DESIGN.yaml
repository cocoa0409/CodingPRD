scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_quote_paid_vs_warranty_billing
        grounds:
          - calculations.ticket_quote
          - entities.ServiceTicket.fields.customer_owes_cents
          - entities.ServiceTicket.fields.warranty_claim_id
          - state_machines.ServiceTicket.INTAKE_to_AWAITING_APPROVAL
        distinguishing_aspect: "On ServiceTicket, the paid_work variant bills customer_owes_cents == labor_subtotal_cents (11000) while the warranty_work variant (warranty_claim_id set) bills customer_owes_cents == 0 for the SAME labor_subtotal_cents (11000)."
        test_recipe:
          setup:
            - "A BASIC tier (base_labor_cents 8000, turnaround_hours 5) exists."
            - "A paid ticket on that tier with one labor line of 3000, quoted: labor_subtotal_cents=11000, customer_owes_cents=11000."
            - "A delivered purchase of a COMPONENT-covered Sku establishes an APPROVED_REPAIR warranty claim; a second ticket links that claim, has one 3000 labor line, and is quoted: labor_subtotal_cents=11000 but customer_owes_cents=0."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            # --- paid ticket ---
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { paid_ticket_id: $.data.id }
            - call: "POST /shop/labor-lines"
              payload: { ticket_id: "${paid_ticket_id}", menu_code: "BRAKE_BLEED", labor_cents: 3000 }
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${paid_ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
            # --- warranty ticket: deliver a covered Sku, build APPROVED_REPAIR claim ---
            - call: "POST /shop/skus"
              payload: { name: "Hydraulic Brake", category: "PART", list_price_cents: 9000, on_hand: 5, warranty_class: "COMPONENT" }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 9000 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
            - call: "POST /shop/warranty-claims"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", source_order_line_id: "${line_id}", defect_part: "COMPONENT" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
            - call: "POST /shop/warranty-claims/${claim_id}/review"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/warranty-claims/${claim_id}/approve"
              payload: { resolution: "REPAIR" }
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}", warranty_claim_id: "${claim_id}" }
              as: ServiceAdvisor
              captures: { warr_ticket_id: $.data.id }
            - call: "POST /shop/labor-lines"
              payload: { ticket_id: "${warr_ticket_id}", menu_code: "BRAKE_BLEED", labor_cents: 3000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/service-tickets/${warr_ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
              captures: { warr_owes: $.data.customer_owes_cents, warr_labor: $.data.labor_subtotal_cents }
          assert:
            - "ServiceTicket.${paid_ticket_id}.labor_subtotal_cents == 11000"
            - "ServiceTicket.${paid_ticket_id}.customer_owes_cents == 11000"
            - "ServiceTicket.${warr_ticket_id}.labor_subtotal_cents == 11000"
            - "ServiceTicket.${warr_ticket_id}.customer_owes_cents == 0"

      - name: layaway_settlement_forfeit_vs_cancel
        grounds:
          - calculations.layaway_settlement
          - entities.LayawayPlan.fields.forfeit_fee_cents
          - entities.LayawayPlan.fields.refund_cents
          - state_machines.LayawayPlan.ACTIVE_to_FORFEITED
          - state_machines.LayawayPlan.ACTIVE_to_CANCELLED
        distinguishing_aspect: "On LayawayPlan, the forfeit variant withholds forfeit_fee_cents=6000 (15% of price 40000) leaving refund_cents=9000, whereas the cancel variant withholds forfeit_fee_cents=0 leaving refund_cents=15000 for an identical deposit_cents=15000."
        test_recipe:
          setup:
            - "A Sku priced 40000 with on_hand 4 exists."
            - "Two identical layaway plans on that Sku, each with deposit_cents=15000 (one 15000 payment each)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Lee Lay", email: "lee@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "City Bike", category: "BIKE", list_price_cents: 40000, on_hand: 4 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v0: $.data.version }
            - call: "POST /shop/layaway-plans"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1, expected_sku_version: "${sku_v0}" }
              as: SalesAssociate
              captures: { forfeit_plan_id: $.data.id }
            - call: "POST /shop/payments"
              payload: { target_type: "LAYAWAY_PLAN", target_id: "${forfeit_plan_id}", amount_cents: 15000 }
              as: SalesAssociate
            - call: "GET /shop/skus/${sku_id}"
              payload: {}
              as: ShopManager
              captures: { sku_v2: $.data.version }
            - call: "POST /shop/layaway-plans"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1, expected_sku_version: "${sku_v2}" }
              as: SalesAssociate
              captures: { cancel_plan_id: $.data.id }
            - call: "POST /shop/payments"
              payload: { target_type: "LAYAWAY_PLAN", target_id: "${cancel_plan_id}", amount_cents: 15000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/layaway-plans/${forfeit_plan_id}/forfeit"
              payload: {}
              as: ShopManager
            - call: "POST /shop/layaway-plans/${cancel_plan_id}/cancel"
              payload: {}
              as: SalesAssociate
          assert:
            - "LayawayPlan.${forfeit_plan_id}.forfeit_fee_cents == 6000"
            - "LayawayPlan.${forfeit_plan_id}.refund_cents == 9000"
            - "LayawayPlan.${cancel_plan_id}.forfeit_fee_cents == 0"
            - "LayawayPlan.${cancel_plan_id}.refund_cents == 15000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  #   instance 1: mode (a) — >=3 inputs, nested min/max/tier  (build_fee marginal tiers)
  #   instance 2: mode (c) — circular-looking eval order pinned (apply_store_credit -> order_total)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: build_fee_marginal_tiered_mode_a
        grounds:
          - calculations.build_fee
          - entities.BuildJob.fields.required_part_count
          - entities.BuildJob.fields.build_fee_cents
          - state_machines.BuildJob.PARTS_RESERVED_to_ASSEMBLING
        distinguishing_aspect: "Mode (a): build_fee for required_part_count=8 selects two marginal bands — 5*1200 + 3*900 + base 5000 = 13700 — NOT an average rate over 8 parts (which would be a single per-part rate)."
        test_recipe:
          setup:
            - "A BuildJob on a BIKE frame Sku with required_part_count=8, with 8 part reservations and a frame reservation, advanced to ASSEMBLING."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Bo Build", email: "bo@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Frame XL", category: "BIKE", list_price_cents: 50000, on_hand: 3 }
              as: ShopManager
              captures: { frame_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Generic Part", category: "PART", list_price_cents: 1000, on_hand: 50 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /shop/build-jobs"
              payload: { customer_id: "${cust_id}", frame_sku_id: "${frame_id}", required_part_count: 8 }
              as: ServiceAdvisor
              captures: { build_id: $.data.id }
            - call: "POST /shop/build-jobs/${build_id}/reserve-frame"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/mark-parts-reserved"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/build-jobs/${build_id}/start"
              payload: {}
              as: ServiceAdvisor
              captures: { fee: $.data.build_fee_cents }
          assert:
            - "BuildJob.${build_id}.status == ASSEMBLING"
            - "BuildJob.${build_id}.build_fee_cents == 13700"

      - name: store_credit_then_total_due_eval_order_mode_c
        grounds:
          - calculations.apply_store_credit
          - calculations.order_total
          - entities.SalesOrder.fields.store_credit_applied_cents
          - entities.SalesOrder.fields.total_due_cents
          - entities.Customer.fields.store_credit_cents
          - state_machines.SalesOrder.fulfillment_RESERVED_to_DELIVERED
        distinguishing_aspect: "Mode (c): total_due_cents is well-defined only because apply_store_credit runs BEFORE order_total at delivery — store_credit_applied_cents=25000 is computed from subtotal_cents=60000 first, then total_due_cents=35000; reversing the order leaves total_due undefined."
        test_recipe:
          setup:
            - "A customer holds store_credit_cents=25000 (seeded via a grade-C trade-in appraised 53000 accepted: round_half_up(53000*0.5)-1500 = 26500-1500 = 25000)."
            - "A reserved, fully-paid order with subtotal_cents=60000 (two units @ 30000)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Cy Credit", email: "cy@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            # Seed exactly 25000 store credit via a grade-C trade-in: round_half_up(53000*0.5)=26500 - 1500 = 25000.
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${cust_id}", description: "Old hybrid", condition_grade: "C", appraised_value_cents: 53000, apply_to: "STORE_CREDIT" }
              as: SalesAssociate
              captures: { tradein_id: $.data.id }
            - call: "POST /shop/trade-ins/${tradein_id}/accept"
              payload: {}
              as: ShopManager
            - call: "POST /shop/skus"
              payload: { name: "Trail Bike", category: "BIKE", list_price_cents: 30000, on_hand: 10 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 2 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 60000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
              captures: { applied: $.data.store_credit_applied_cents, due: $.data.total_due_cents }
          assert:
            - "SalesOrder.${ord_id}.subtotal_cents == 60000"
            - "SalesOrder.${ord_id}.store_credit_applied_cents == 25000"
            - "SalesOrder.${ord_id}.total_due_cents == 35000"
            - "Customer.${cust_id}.store_credit_cents == 0"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  #   instance 1: ServiceTicket CYCLE  (IN_PROGRESS <-> AWAITING_APPROVAL)
  #   instance 2: WarrantyClaim BRANCH  (UNDER_REVIEW -> {REPAIR, REPLACE, DENY})
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_ticket_revision_cycle
        grounds:
          - state_machines.ServiceTicket.IN_PROGRESS_to_AWAITING_APPROVAL
          - state_machines.ServiceTicket.AWAITING_APPROVAL_to_IN_PROGRESS
          - entities.ServiceTicket.fields.revision_count
          - entities.LaborLine.fields.added_after_approval
        distinguishing_aspect: "ServiceTicket cycles IN_PROGRESS -> AWAITING_APPROVAL -> IN_PROGRESS twice: revision_count reaches 2 and the two added labor lines each carry added_after_approval=true; a linear machine could never re-enter AWAITING_APPROVAL."
        test_recipe:
          setup:
            - "A STANDARD-tier ticket, quoted and approved (IN_PROGRESS), customer owns it."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Cy Cycle", email: "cyc@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "STANDARD", base_labor_cents: 6000, turnaround_hours: 4 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
            - call: "POST /shop/service-tickets/${ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /shop/labor-lines"
              payload: { ticket_id: "${ticket_id}", menu_code: "WHEEL_TRUE", labor_cents: 2000 }
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shop/labor-lines"
              payload: { ticket_id: "${ticket_id}", menu_code: "CABLE_REPLACE", labor_cents: 1500 }
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rev: $.data.revision_count, st: $.data.status }
          assert:
            - "ServiceTicket.${ticket_id}.revision_count == 2"
            - "ServiceTicket.${ticket_id}.status == IN_PROGRESS"
            - "ServiceTicket.${ticket_id}.labor_subtotal_cents == 9500"

      - name: warranty_claim_branch_replace
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED_REPLACE
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED_REPAIR
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_DENIED
          - entities.WarrantyClaim.fields.resolution_sku_id
        distinguishing_aspect: "WarrantyClaim forks at UNDER_REVIEW into three divergent branches; the REPLACE branch (chosen here) creates an ACTIVE replacement Reservation, a side effect that neither the REPAIR nor the DENY branch produces."
        test_recipe:
          setup:
            - "A delivered purchase of a FRAME_AND_COMPONENT, serialized Sku; a claim on it under review; a replacement Sku with stock available."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Wendy War", email: "wendy@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Carbon Frame", category: "BIKE", list_price_cents: 120000, on_hand: 2, warranty_class: "FRAME_AND_COMPONENT", is_serialized: true }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/skus"
              payload: { name: "Carbon Frame Replacement", category: "BIKE", list_price_cents: 120000, on_hand: 1, warranty_class: "FRAME_AND_COMPONENT", is_serialized: true }
              as: ShopManager
              captures: { repl_id: $.data.id }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 120000 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
            - call: "POST /shop/warranty-claims"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", source_order_line_id: "${line_id}", defect_part: "FRAME" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
            - call: "POST /shop/warranty-claims/${claim_id}/review"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/warranty-claims/${claim_id}/approve"
              payload: { resolution: "REPLACE", resolution_sku_id: "${repl_id}" }
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "WarrantyClaim.${claim_id}.status == APPROVED_REPLACE"
            - "Sku.${repl_id}.reserved == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  #   instance 1: depth 3, trigger = SalesOrder deliver
  #               order -> Reservation(COMMITTED) -> Sku(on_hand & reserved down)
  #   instance 2: depth 3, trigger = WarrantyClaim resolve
  #               claim -> replacement Reservation(COMMITTED) -> Sku ledger
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_commits_reservation_decrements_sku
        grounds:
          - state_machines.SalesOrder.fulfillment_RESERVED_to_DELIVERED
          - calculations.sku_available_units
          - entities.Reservation.fields.status
          - entities.Sku.fields.on_hand
          - entities.Sku.fields.reserved
        distinguishing_aspect: "Depth-3 chain from the DELIVER trigger: deliver mutates the order, which flips its Reservation ACTIVE->COMMITTED, which in turn drives Sku.on_hand 10->8 AND Sku.reserved 2->0 — each hop caused by the prior one."
        test_recipe:
          setup:
            - "A Sku on_hand 10; a reserved, fully-paid order for qty 2 of it (reserved=2 after reserve)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Della Liver", email: "della@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Commuter Bike", category: "BIKE", list_price_cents: 45000, on_hand: 10 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 2 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 90000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "SalesOrder.${ord_id}.fulfillment_status == DELIVERED"
            - "Sku.${sku_id}.on_hand == 8"
            - "Sku.${sku_id}.reserved == 0"

      - name: warranty_resolve_commits_replacement_decrements_sku
        grounds:
          - state_machines.WarrantyClaim.APPROVED_REPLACE_to_RESOLVED
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED_REPLACE
          - calculations.sku_available_units
          - entities.Reservation.fields.status
          - entities.Sku.fields.on_hand
        distinguishing_aspect: "Depth-3 chain from the RESOLVE trigger (distinct from the deliver trigger): resolve mutates the claim, which commits the replacement Reservation ACTIVE->COMMITTED, which drives replacement Sku.on_hand 1->0 and reserved 1->0."
        test_recipe:
          setup:
            - "A claim in APPROVED_REPLACE on a delivered FRAME_AND_COMPONENT serialized Sku, with an ACTIVE replacement Reservation on a replacement Sku (on_hand 1, reserved 1)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Rex Resolve", email: "rex@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Steel Frame", category: "BIKE", list_price_cents: 80000, on_hand: 2, warranty_class: "FRAME_AND_COMPONENT", is_serialized: true }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/skus"
              payload: { name: "Steel Frame Replacement", category: "BIKE", list_price_cents: 80000, on_hand: 1, warranty_class: "FRAME_AND_COMPONENT", is_serialized: true }
              as: ShopManager
              captures: { repl_id: $.data.id }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 80000 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
            - call: "POST /shop/warranty-claims"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", source_order_line_id: "${line_id}", defect_part: "FRAME" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
            - call: "POST /shop/warranty-claims/${claim_id}/review"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/warranty-claims/${claim_id}/approve"
              payload: { resolution: "REPLACE", resolution_sku_id: "${repl_id}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/warranty-claims/${claim_id}/resolve"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "WarrantyClaim.${claim_id}.status == RESOLVED"
            - "Sku.${repl_id}.on_hand == 0"
            - "Sku.${repl_id}.reserved == 0"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  #   instance 1: state(5) vs business_fiscal(14)         -> state wins
  #   instance 2: business_referential(8) vs business_safety(9) -> referential wins
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deliver_pending_unpaid_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - state_machines.SalesOrder.fulfillment_RESERVED_to_DELIVERED
        distinguishing_aspect: "An order that is BOTH not RESERVED (state, priority 5) and not PAID (business_fiscal, priority 14) returns ERR_INVALID_STATE, not ERR_NOT_FULLY_PAID, because state precedes fiscal."
        test_recipe:
          setup:
            - "A PENDING, UNPAID order with one line (never reserved, never paid)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Stan State", email: "stan@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Pedal Set", category: "PART", list_price_cents: 5000, on_hand: 5 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: warranty_approve_not_purchased_beats_not_covered
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED_REPAIR
        distinguishing_aspect: "Approving a claim whose source line is NOT a delivered purchase (business_referential, priority 8) AND whose defect FRAME is not covered by a NONE-warranty Sku (business_safety, priority 9) returns ERR_NOT_PURCHASED, not ERR_WARRANTY_NOT_COVERED."
        test_recipe:
          setup:
            - "A Sku with warranty_class=NONE, is_serialized=false; an order line for it that was reserved but NOT delivered (so not a delivered purchase); a claim with defect_part=FRAME submitted and reviewed."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Ref Ref", email: "ref@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "No-Warranty Frame", category: "BIKE", list_price_cents: 30000, on_hand: 3, warranty_class: "NONE", is_serialized: false }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/warranty-claims"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", source_order_line_id: "${line_id}", defect_part: "FRAME" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
            - call: "POST /shop/warranty-claims/${claim_id}/review"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/warranty-claims/${claim_id}/approve"
              payload: { resolution: "REPAIR" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOT_PURCHASED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  #   instance 1: stock availability == qty boundary on /reserve
  #   instance 2: special-order deposit cap (deposit == line_value) on POST /special-orders
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reserve_exact_available_succeeds_one_more_fails
        grounds:
          - validations[priority=13]
          - calculations.sku_available_units
          - state_machines.SalesOrder.fulfillment_PENDING_to_RESERVED
          - entities.Sku.fields.on_hand
        distinguishing_aspect: "Reserving qty exactly equal to available (3 of on_hand 3) succeeds and leaves reserved=3; a separate order then reserving 1 more (available now 0) fails with ERR_INSUFFICIENT_STOCK — the boundary is available >= qty, not available > qty."
        test_recipe:
          setup:
            - "A Sku with on_hand 3, reserved 0; two PENDING orders, the first with a line qty 3, the second with a line qty 1."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Bea Boundary", email: "bea@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Tire", category: "PART", list_price_cents: 4000, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v0: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord1_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord1_id}", sku_id: "${sku_id}", qty: 3 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord1_id}/reserve"
              payload: { expected_sku_version: "${sku_v0}" }
              as: SalesAssociate
            - call: "GET /shop/skus/${sku_id}"
              payload: {}
              as: ShopManager
              captures: { sku_v2: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord2_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord2_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord2_id}/reserve"
              payload: { expected_sku_version: "${sku_v2}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "Sku.${sku_id}.reserved == 3"
            - "response.status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

      - name: special_order_deposit_capped_at_line_value
        grounds:
          - calculations.special_order_deposit
          - entities.SpecialOrder.fields.deposit_required_cents
          - validations[priority=15]
        distinguishing_aspect: "For a Sku priced 4000 qty 1, the 30%-or-5000-min deposit (max(5000, 1200)=5000) would exceed line_value 4000, so the cap pins deposit_required_cents=4000 — a different metric (the min(line_value, ...) cap) reached through POST /shop/special-orders, not the stock availability boundary."
        test_recipe:
          setup:
            - "A Sku with list_price_cents=4000."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Cap Cap", email: "cap@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Bell", category: "ACCESSORY", list_price_cents: 4000, on_hand: 0 }
              as: ShopManager
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /shop/special-orders"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { dep: $.data.deposit_required_cents }
          assert:
            - "SpecialOrder.deposit_required_cents == 4000"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  #   instance 1: ServiceTicket close depends on linked WarrantyClaim state
  #   instance 2: WarrantyClaim approve depends on source SalesOrder fulfillment state
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_close_resolves_linked_warranty_claim
        grounds:
          - state_machines.ServiceTicket.READY_FOR_PICKUP_to_CLOSED
          - state_machines.WarrantyClaim.APPROVED_REPAIR_to_RESOLVED
          - entities.ServiceTicket.fields.warranty_claim_id
        distinguishing_aspect: "ServiceTicket (entity A) close READY_FOR_PICKUP->CLOSED is gated on its linked WarrantyClaim (entity B) being APPROVED_REPAIR, and on success cascades B to RESOLVED — a ServiceTicket<->WarrantyClaim dependency."
        test_recipe:
          setup:
            - "A delivered COMPONENT-covered purchase; an APPROVED_REPAIR claim; a ticket linking that claim, quoted, approved, completed (READY_FOR_PICKUP)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Tess Ticket", email: "tess@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "PREMIUM", base_labor_cents: 10000, turnaround_hours: 8 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Derailleur", category: "PART", list_price_cents: 7000, on_hand: 4, warranty_class: "COMPONENT" }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 7000 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
            - call: "POST /shop/warranty-claims"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", source_order_line_id: "${line_id}", defect_part: "COMPONENT" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
            - call: "POST /shop/warranty-claims/${claim_id}/review"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/warranty-claims/${claim_id}/approve"
              payload: { resolution: "REPAIR" }
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}", warranty_claim_id: "${claim_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
            - call: "POST /shop/service-tickets/${ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shop/service-tickets/${ticket_id}/complete"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/service-tickets/${ticket_id}/close"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "ServiceTicket.${ticket_id}.status == CLOSED"
            - "WarrantyClaim.${claim_id}.status == RESOLVED"

      - name: warranty_approve_requires_delivered_order
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED_REPAIR
          - validations[priority=8]
          - state_machines.SalesOrder.fulfillment_RESERVED_to_DELIVERED
        distinguishing_aspect: "WarrantyClaim (entity A) approve is gated on its source OrderLine's SalesOrder (entity B) fulfillment_status==DELIVERED; a reserved-but-not-delivered order makes approve fail with ERR_NOT_PURCHASED — a WarrantyClaim<->SalesOrder dependency, a different pair than instance 1."
        test_recipe:
          setup:
            - "A COMPONENT-covered Sku; an order reserved (NOT delivered); a claim on it submitted and reviewed."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Will Warr", email: "will@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Shifter", category: "PART", list_price_cents: 6000, on_hand: 4, warranty_class: "COMPONENT" }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/warranty-claims"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", source_order_line_id: "${line_id}", defect_part: "COMPONENT" }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
            - call: "POST /shop/warranty-claims/${claim_id}/review"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/warranty-claims/${claim_id}/approve"
              payload: { resolution: "REPAIR" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOT_PURCHASED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  #   instance 1: ServiceBay HALF-OPEN time interval overlap (touching allowed)
  #   instance 2: Sku AGGREGATE-CAPACITY overlap (summed qty must fit available)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_booking_half_open_overlap_vs_touching
        grounds:
          - validations[priority=20]
          - entities.BayBooking.fields.start_at
          - entities.BayBooking.fields.end_at
          - errors[ERR_BAY_DOUBLE_BOOKED]
        distinguishing_aspect: "ServiceBay uses HALF-OPEN [start,end) interval geometry: a booking 10:00-12:00 then 11:00-13:00 overlaps (ERR_BAY_DOUBLE_BOOKED), but a booking 10:00-12:00 then 12:00-14:00 (touching at the boundary) is ACCEPTED — adjacency at end_at is zero overlap."
        test_recipe:
          setup:
            - "One active ServiceBay; one ticket; an existing BOOKED interval 2026-06-15T10:00:00Z..12:00:00Z and an accepted touching interval 12:00:00Z..14:00:00Z."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Baz Bay", email: "baz@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
            - call: "POST /shop/service-bays"
              payload: { name: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /shop/bay-bookings"
              payload: { bay_id: "${bay_id}", ticket_id: "${ticket_id}", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z" }
              as: ServiceAdvisor
            - call: "POST /shop/bay-bookings"
              payload: { bay_id: "${bay_id}", ticket_id: "${ticket_id}", start_at: "2026-06-15T12:00:00Z", end_at: "2026-06-15T14:00:00Z" }
              as: ServiceAdvisor
              captures: { touching_id: $.data.id }
          trigger:
            - call: "POST /shop/bay-bookings"
              payload: { bay_id: "${bay_id}", ticket_id: "${ticket_id}", start_at: "2026-06-15T11:00:00Z", end_at: "2026-06-15T13:00:00Z" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "BayBooking.${touching_id}.status == BOOKED"
            - "response.status == 409"
            - "response.data.error_id == ERR_BAY_DOUBLE_BOOKED"

      - name: sku_aggregate_capacity_summed_lines_overlap
        grounds:
          - validations[priority=13]
          - calculations.sku_available_units
          - state_machines.SalesOrder.fulfillment_PENDING_to_RESERVED
          - entities.Sku.fields.on_hand
        distinguishing_aspect: "Sku uses AGGREGATE-CAPACITY interval geometry (distinct from the bay's time geometry): two OrderLines of the SAME Sku in one order are summed (qty 2 + qty 2 = 4) and rejected against on_hand 3 with ERR_INSUFFICIENT_STOCK — the collision is over summed quantity, not a time interval, and on a different resource entity (Sku)."
        test_recipe:
          setup:
            - "A Sku on_hand 3; one PENDING order with two lines of the same Sku (qty 2 and qty 2, summing to 4)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Aggie Cap", email: "aggie@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Inner Tube", category: "PART", list_price_cents: 1200, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 2 }
              as: SalesAssociate
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 2 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "Sku.${sku_id}.reserved == 0"
            - "response.status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  #   instance 1: conserved = Sku total units (on_hand + reserved)
  #   instance 2: conserved = customer money (store_credit_cents)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_cancel_conserves_sku_units
        grounds:
          - state_machines.SalesOrder.fulfillment_PENDING_to_RESERVED
          - state_machines.SalesOrder.fulfillment_RESERVED_to_CANCELLED
          - calculations.sku_available_units
          - entities.Sku.fields.on_hand
          - entities.Sku.fields.reserved
        distinguishing_aspect: "Conserved quantity = Sku.on_hand + Sku.reserved (total units accounted for). After reserve (on_hand 6, reserved 2) then cancel (releases reservation), the invariant on_hand==6 AND reserved==0 holds — exactly the pre-reserve state; zero drift."
        test_recipe:
          setup:
            - "A Sku on_hand 6, reserved 0; an order with one line qty 2, reserved."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Connie Cancel", email: "connie@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Saddle", category: "PART", list_price_cents: 8000, on_hand: 6 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 2 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/cancel"
              payload: {}
              as: SalesAssociate
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "SalesOrder.${ord_id}.fulfillment_status == CANCELLED"
            - "Sku.${sku_id}.on_hand == 6"
            - "Sku.${sku_id}.reserved == 0"

      - name: paid_order_cancel_restores_store_credit
        grounds:
          - state_machines.SalesOrder.fulfillment_RESERVED_to_CANCELLED
          - calculations.apply_store_credit
          - calculations.tradein_offer
          - entities.Customer.fields.store_credit_cents
          - entities.SalesOrder.fields.payment_status
        distinguishing_aspect: "Conserved quantity = Customer.store_credit_cents (money, distinct from Sku units). A customer with 25000 credit places and PARTIALLY pays an order; cancelling the RESERVED+PARTIALLY_PAID order sets payment_status->REFUNDED and store_credit_cents returns to 25000 (no store credit was consumed pre-delivery, so the named quantity is unchanged end-to-end)."
        test_recipe:
          setup:
            - "A customer with store_credit_cents=25000 (grade-C trade-in appraised 53000 accepted); a reserved, PARTIALLY_PAID order (subtotal 30000, paid 10000)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Moe Money", email: "moe@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${cust_id}", description: "Old MTB", condition_grade: "C", appraised_value_cents: 53000, apply_to: "STORE_CREDIT" }
              as: SalesAssociate
              captures: { tradein_id: $.data.id }
            - call: "POST /shop/trade-ins/${tradein_id}/accept"
              payload: {}
              as: ShopManager
            - call: "POST /shop/skus"
              payload: { name: "Helmet", category: "ACCESSORY", list_price_cents: 30000, on_hand: 5 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 10000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/cancel"
              payload: {}
              as: SalesAssociate
              captures: { ps: $.data.payment_status }
          assert:
            - "SalesOrder.${ord_id}.payment_status == REFUNDED"
            - "Customer.${cust_id}.store_credit_cents == 25000"
