            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "4", owner_name: "Ola Bex" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 5000, received_date: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { pay_id: $.data.id, unapplied: $.data.unapplied_cents, st: $.data.status }
          assert:
            - "trigger response data.status == POSTED"
