  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_permit_inactive_beats_capacity
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PERMIT_NOT_ACTIVE]
          - errors[ERR_ZONE_CAPACITY_CONFLICT]
        distinguishing_aspect: "Confirm where BOTH the referential gate (permit not ACTIVE, priority 6) and the temporal gate (zone at capacity, priority 7) fail: ERR_PERMIT_NOT_ACTIVE wins - business_referential vs business_temporal."
        test_recipe:
          setup:
            - "Zone Z3 cap 1; permit A ACTIVE with reservation RA [08:00Z,08:45Z) CONFIRMED (fills capacity); permit B still SUBMITTED (not ACTIVE) with reservation RB [08:00Z,08:45Z) PENDING on Z3"
