# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Internet / Broadband Service Provisioning — Expert band
# 9 rules x >= 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain drives empty-DB ->
# precondition using only §1.5 endpoints; OCC versions are ${var}s; numeric
# asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overage_estimate_vs_final_diverge_on_billing_cycle
        grounds:
          - calculations.overage_charge
          - state_machines.BillingCycle.OPEN_to_CLOSED
          - endpoints["GET /billing-cycles/{id}/overage-estimate"]
        distinguishing_aspect: |
          The forward-looking ESTIMATE variant (mid-cycle linear projection) yields
          overage 1000 cents while the chronological FINAL variant (actual frozen
          usage at close) yields 2890 cents for the SAME BillingCycle — divergence
          on the BillingCycle metering domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-16T00:00:00Z (day 15 of a 30-day cycle starting 2026-06-01)."
            - "ACTIVE account on a BILL plan (included_gb=1000); open BillingCycle 2026-06-01..2026-07-01."
            - "510 GB posted by 2026-06-16 (estimate projects 1020 GB -> over 20)."
            - "By close, actual usage reaches 1063 GB (over 63)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "1 Fiber Ln", postal_code: "00001", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "BILL500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 24, etf_full_cents: 24000 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-DV-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tia", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /install-slots"
              payload: { technician_id: "${tech_id}", window_start_iso: "2026-06-02T09:00:00Z", window_end_iso: "2026-06-02T17:00:00Z", capacity: 2 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-dv" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order_id}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T09:00:00Z", end_iso: "2026-06-02T10:00:00Z", expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
              captures: { appt_id: $.data.id }
            - call: "POST /install-appointments/${appt_id}/complete"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
              captures: { }
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-10T00:00:00Z", gb: 510 }
              as: NetworkOps
          trigger:
            - call: "GET /billing-cycles/${cycle_id}/overage-estimate"
              payload: { as_of_iso: "2026-06-16T00:00:00Z" }
              as: NetworkOps
              captures: { est_overage: $.data.overage_charge_cents }
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-25T00:00:00Z", gb: 553 }
              as: NetworkOps
            - call: "POST /billing-cycles/${cycle_id}/close"
              payload: {}
              as: NetworkOps
              captures: { final_overage: $.data.overage_charge_cents }
          assert:
            - "estimate response BillingCycle.overage_charge_cents == 1000"
            - "after close BillingCycle.overage_charge_cents == 2890"
            - "1000 != 2890 (estimate and final diverge on the same cycle)"

      - name: etf_charged_vs_waived_on_account_contract
        grounds:
          - calculations.early_termination_fee
          - state_machines.Account.ACTIVE_to_DISCONNECTED
          - state_machines.Account.ACTIVE_to_TRANSFERRED
        distinguishing_aspect: |
          The disconnect_charged variant adds a 15000-cent ETF charge to the final
          cycle while the transfer_waived variant adds zero ETF and instead emits a
          15000-cent TRANSFER_WAIVER credit — dual-variant logic on the Account
          contract domain (distinct from the BillingCycle metering domain above).
        test_recipe:
          setup:
            - "Two ACTIVE accounts on the same 24-month plan (etf_full 24000), contract_start 2026-06-01."
            - "Clock at 2027-03-01 (9 months elapsed -> ETF 15000)."
            - "Account X is plain-disconnected; Account Y is transferred with waive_etf=true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "2 Fiber Ln", postal_code: "00002", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "ETF24", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 24, etf_full_cents: 24000 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-ETF-X", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_x: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-ETF-Y", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_y: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-x" }
              as: ProvisioningAgent
              captures: { acct_x: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_x}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_x: $.data.id }
            - call: "POST /service-orders/${order_x}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_x}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-y" }
              as: ProvisioningAgent
              captures: { acct_y: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_y}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_y: $.data.id }
            - call: "POST /service-orders/${order_y}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_y}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /transfer-requests"
              payload: { account_id: "${acct_y}", to_service_address_id: "${addr_id}", to_plan_id: "${plan_id}", waive_etf: true }
              as: ProvisioningAgent
              captures: { xfer_id: $.data.id }
            - call: "POST /transfer-requests/${xfer_id}/approve"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: NetworkOps
            - call: "GET /accounts/${acct_x}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_x_v: $.data.version }
            - call: "GET /accounts/${acct_y}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_y_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_x}/disconnect"
              payload: { expected_account_version: "${acct_x_v}" }
              as: ProvisioningAgent
            - call: "POST /transfer-requests/${xfer_id}/complete"
              payload: { expected_account_version: "${acct_y_v}" }
              as: ProvisioningAgent
          assert:
            - "Account X final BillingCycle includes an ETF charge of 15000 cents (early_termination_fee disconnect_charged)"
            - "Account Y has an AccountCredit with source_type == TRANSFER_WAIVER and amount_cents == 15000"
            - "Account Y final BillingCycle includes NO ETF charge (etf contribution 0)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_overage_ladder_with_cap_mode_a
        grounds:
          - calculations.overage_charge
          - state_machines.BillingCycle.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (a): non-linear formula with >=3 tier inputs and nested min selection
          plus a cap — over 199 GB yields 5980 cents (tiers unclamped) while over 200
          yields exactly 6000 (cap clamps), proving marginal-tier allocation and the
          min cap interact non-linearly.
        test_recipe:
          setup:
            - "ACTIVE BILL account (included_gb 1000); open cycle 2026-06-01..2026-07-01."
            - "Post usage so cumulative reaches 1199 GB (over 199)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "3 Fiber Ln", postal_code: "00003", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "BILLCAP", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-CAP-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-cap" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-10T00:00:00Z", gb: 1199 }
              as: NetworkOps
          trigger:
            - call: "POST /billing-cycles/${cycle_id}/close"
              payload: {}
              as: NetworkOps
              captures: { overage: $.data.overage_charge_cents }
          assert:
            - "BillingCycle.overage_charge_cents == 5980 (50*50 + 50*30 + 99*20, below the 6000 cap)"
            - "BillingCycle.usage_gb == 1199"

      - name: bill_total_promo_keyed_on_subtotal_tier_mode_c
        grounds:
          - calculations.monthly_bill_total
          - state_machines.BillingCycle.CLOSED_to_FINALIZED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — total depends on promo_discount,
          which is keyed on the (plan_fee+lease) subtotal tier; the scaffold pins
          evaluation order (promo computed on subtotal_pre BEFORE overage/etf/credits),
          so subtotal 10499 selects the 1000-cent high promo and total resolves to 12327.
        test_recipe:
          setup:
            - "ACTIVE BILL account (plan_fee 8999, lease 1500 -> subtotal_pre 10499)."
            - "Final overage 2890 (over 63); one OUTAGE credit of 62; promo high (>=10000) 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "4 Fiber Ln", postal_code: "00004", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "BILLPROMO", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "GATEWAY", serial: "SN-PROMO-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-promo" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-10T00:00:00Z", gb: 1063 }
              as: NetworkOps
            - call: "POST /outage-events"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", started_at_iso: "2026-06-12T00:00:00Z" }
              as: NetworkOps
              captures: { out_id: $.data.id }
            - call: "POST /outage-events/${out_id}/resolve"
              payload: { ended_at_iso: "2026-06-12T05:00:00Z" }
              as: NetworkOps
            - call: "POST /outage-events/${out_id}/issue-credit"
              payload: {}
              as: NetworkOps
            - call: "POST /billing-cycles/${cycle_id}/close"
              payload: {}
              as: NetworkOps
          trigger:
            - call: "POST /billing-cycles/${cycle_id}/finalize"
              payload: {}
              as: NetworkOps
              captures: { total: $.data.total_due_cents }
          assert:
            - "outage credit AccountCredit.amount_cents == 62 (rhu(8999*300/43200))"
            - "BillingCycle.total_due_cents == 12327 (8999 + 1500 + 2890 + 0 - 62 - 1000)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: billing_cycle_parallel_billing_and_throttle_dimensions
        grounds:
          - state_machines.BillingCycle.UNCAPPED_to_THROTTLED
          - state_machines.BillingCycle.OPEN_to_CLOSED
          - entities.BillingCycle.fields.throttle_state
        distinguishing_aspect: |
          BillingCycle carries two orthogonal dimensions: throttle_state flips
          UNCAPPED->THROTTLED on a usage post while billing_state is still OPEN, and
          billing_state then advances OPEN->CLOSED independently — parallel state
          axes on the BillingCycle entity.
        test_recipe:
          setup:
            - "ACTIVE account on a THROTTLE plan (included_gb 100, overage_policy THROTTLE); open cycle."
            - "Post 120 GB (over 100) -> throttle_state THROTTLED while billing_state still OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "5 Fiber Ln", postal_code: "00005", coverage_status: "SERVICEABLE", technology: "CABLE", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "THR100", tier: "BASIC", download_mbps: 300, throttled_mbps: 25, monthly_fee_cents: 6000, included_gb: 100, overage_policy: "THROTTLE", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-THR-1", lease_fee_cents_per_cycle: 1000 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-thr" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
          trigger:
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-10T00:00:00Z", gb: 120 }
              as: NetworkOps
            - call: "GET /billing-cycles/${cycle_id}"
              payload: {}
              as: NetworkOps
              captures: { tstate: $.data.throttle_state, bstate: $.data.billing_state }
          assert:
            - "BillingCycle.throttle_state == THROTTLED"
            - "BillingCycle.billing_state == OPEN (billing dimension unchanged by the usage post)"
            - "Account.service_state == THROTTLED"

      - name: equipment_unit_cyclic_release_release
        grounds:
          - state_machines.EquipmentUnit.RETURNED_to_IN_INVENTORY
          - state_machines.EquipmentUnit.IN_INVENTORY_to_LEASED
          - state_machines.EquipmentUnit.LEASED_to_RETURN_PENDING
        distinguishing_aspect: |
          EquipmentUnit is cyclic: a unit returns IN_INVENTORY -> LEASED ->
          RETURN_PENDING -> RETURNED -> IN_INVENTORY -> LEASED again to a SECOND
          account — a true loop on the EquipmentUnit entity (distinct from the
          parallel BillingCycle machine).
        test_recipe:
          setup:
            - "One EquipmentUnit leased to account A, then disconnected, confirm-return, restock."
            - "A second account B then activates and the SAME unit is re-leased."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "6 Fiber Ln", postal_code: "00006", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "CYC500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-CYC-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-a" }
              as: ProvisioningAgent
              captures: { acct_a: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_a}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_a: $.data.id }
            - call: "POST /service-orders/${order_a}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_a}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_a_v: $.data.version }
            - call: "POST /accounts/${acct_a}/disconnect"
              payload: { expected_account_version: "${acct_a_v}" }
              as: ProvisioningAgent
            - call: "POST /equipment-units/${unit_id}/confirm-return"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /equipment-units/${unit_id}/restock"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-b" }
              as: ProvisioningAgent
              captures: { acct_b: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_b}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_b: $.data.id }
            - call: "POST /service-orders/${order_b}/ship-kit"
              payload: {}
              as: ProvisioningAgent
          trigger:
            - call: "POST /service-orders/${order_b}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /equipment-units/${unit_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { ustatus: $.data.status, uacct: $.data.account_id }
          assert:
            - "EquipmentUnit.status == LEASED (re-leased after completing the cycle)"
            - "EquipmentUnit.account_id == ${acct_b}"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disconnect_three_hop_cascade
        grounds:
          - state_machines.Account.ACTIVE_to_DISCONNECTED
          - state_machines.EquipmentUnit.LEASED_to_RETURN_PENDING
          - calculations.lease_proration_credit
          - state_machines.BillingCycle.CLOSED_to_FINALIZED
        distinguishing_aspect: |
          Depth-3 cascade from the disconnect trigger: Account->DISCONNECTED causes
          EquipmentUnit->RETURN_PENDING; that EquipmentUnit transition itself emits a
          LEASE_PRORATE AccountCredit; which is then consumed when the BillingCycle
          finalizes — each link caused by the previous, not the original action.
        test_recipe:
          setup:
            - "ACTIVE account, unit leased, open cycle 2026-06-01..2026-07-01 (30 days)."
            - "Clock at 2026-06-11 (10 days used -> 20 remaining -> lease refund 1000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "7 Fiber Ln", postal_code: "00007", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "CAS500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-CAS-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-cas" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: NetworkOps
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/disconnect"
              payload: { expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
            - call: "GET /equipment-units/${unit_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { ustatus: $.data.status }
            - call: "GET /account-credits"
              payload: { account_id: "${acct_id}" }
              as: ProvisioningAgent
              captures: { credit0_type: "$.data[0].source_type" }
            - call: "GET /billing-cycles"
              payload: { account_id: "${acct_id}" }
              as: ProvisioningAgent
              captures: { bstate: "$.data[0].billing_state" }
          assert:
            - "EquipmentUnit.status == RETURN_PENDING (hop 1)"
            - "an AccountCredit exists with source_type == LEASE_PRORATE and amount_cents == 1000 (hop 2)"
            - "the account's BillingCycle.billing_state == FINALIZED (hop 3)"

      - name: activate_two_hop_cascade
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_ACTIVATED
          - state_machines.EquipmentUnit.IN_INVENTORY_to_LEASED
          - state_machines.Account.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (order activate): ServiceOrder->
          ACTIVATED causes EquipmentUnit->LEASED; that lease causes Account->ACTIVE
          with a fresh OPEN BillingCycle — a distinct propagation pattern from the
          disconnect cascade.
        test_recipe:
          setup:
            - "A SCHEDULED TECH_INSTALL order with a COMPLETED appointment; a unit IN_INVENTORY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "8 Fiber Ln", postal_code: "00008", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: false }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "ACT500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-ACT-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ravi", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /install-slots"
              payload: { technician_id: "${tech_id}", window_start_iso: "2026-06-02T09:00:00Z", window_end_iso: "2026-06-02T17:00:00Z", capacity: 1 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-act" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order_id}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T09:00:00Z", end_iso: "2026-06-02T10:00:00Z", expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
              captures: { appt_id: $.data.id }
            - call: "POST /install-appointments/${appt_id}/complete"
              payload: {}
              as: ProvisioningAgent
          trigger:
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /equipment-units/${unit_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { ustatus: $.data.status }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { astatus: $.data.status }
          assert:
            - "EquipmentUnit.status == LEASED (hop 1)"
            - "Account.status == ACTIVE (hop 2)"
            - "exactly one OPEN BillingCycle exists for the account (GET /billing-cycles?account_id returns one OPEN cycle)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: speed_vs_slot_capacity_priority
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          A single booking request that violates BOTH business_safety (plan exceeds
          serviceable speed, p8) and business_temporal (slot at capacity, p10) returns
          ERR_PLAN_EXCEEDS_SERVICEABLE_SPEED — the lower-priority-number (p8) error
          wins; error-category pair business_safety vs business_temporal.
        test_recipe:
          setup:
            - "Address max_serviceable 300; plan download 500 (exceeds). Slot capacity 1 already FULL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "9 DSL Ln", postal_code: "00009", coverage_status: "SERVICEABLE", technology: "DSL", max_serviceable_mbps: 300, self_install_eligible: false }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "FAST500", tier: "GIG", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { fast_plan: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "SLOW200", tier: "BASIC", download_mbps: 200, throttled_mbps: 25, monthly_fee_cents: 5000, included_gb: 500, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { slow_plan: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Mei", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /install-slots"
              payload: { technician_id: "${tech_id}", window_start_iso: "2026-06-02T09:00:00Z", window_end_iso: "2026-06-02T17:00:00Z", capacity: 1 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${slow_plan}", customer_user_id: "cust-filler" }
              as: ProvisioningAgent
              captures: { acct_fill: $.data.id, acct_fill_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_fill}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${slow_plan}" }
              as: ProvisioningAgent
              captures: { order_fill: $.data.id }
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order_fill}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T09:00:00Z", end_iso: "2026-06-02T10:00:00Z", expected_account_version: "${acct_fill_v}" }
              as: ProvisioningAgent
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${fast_plan}", customer_user_id: "cust-conf" }
              as: ProvisioningAgent
              captures: { acct_conf: $.data.id, acct_conf_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_conf}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${fast_plan}" }
              as: ProvisioningAgent
              captures: { order_conf: $.data.id }
          trigger:
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order_conf}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T11:00:00Z", end_iso: "2026-06-02T12:00:00Z", expected_account_version: "${acct_conf_v}" }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PLAN_EXCEEDS_SERVICEABLE_SPEED (p8 beats p10)"
            - "HTTP status 409"

      - name: state_vs_occ_priority
        grounds:
          - validations[priority=5]
          - validations[priority=16]
        distinguishing_aspect: |
          A disconnect on an already-DISCONNECTED account carrying a stale
          expected_account_version violates both state (p5 ERR_INVALID_STATE) and
          business_fiscal (p16 ERR_STALE_ACCOUNT_VERSION); state check at lower
          priority number wins -> ERR_INVALID_STATE; category pair state vs
          business_fiscal (different from the pair above).
        test_recipe:
          setup:
            - "Account disconnected once (now DISCONNECTED, version advanced past the captured value)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "10 Fiber Ln", postal_code: "00010", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "ST500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-ST-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-st" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/disconnect"
              payload: { expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
          trigger:
            - call: "POST /accounts/${acct_id}/disconnect"
              payload: { expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (p5 beats p16 even though the version is also stale)"
            - "HTTP status 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: data_cap_crossing_strict_greater_than
        grounds:
          - calculations.overage_charge
          - state_machines.BillingCycle.UNCAPPED_to_THROTTLED
          - validations[priority=4]
        distinguishing_aspect: |
          Data-cap metric on POST /usage-records: cumulative usage exactly equal to
          included_gb (1000 == 1000) is NOT over (no throttle), while 1001 is over
          (throttle fires) — strict > boundary on the usage metric.
        test_recipe:
          setup:
            - "ACTIVE THROTTLE account, included_gb 1000; open cycle."
            - "Post exactly 1000 GB (boundary) then 1 GB more (crosses)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "11 Cable Ln", postal_code: "00011", coverage_status: "SERVICEABLE", technology: "CABLE", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "THR1000", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 7000, included_gb: 1000, overage_policy: "THROTTLE", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-BND-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-bnd" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-05T00:00:00Z", gb: 1000 }
              as: NetworkOps
            - call: "GET /billing-cycles/${cycle_id}"
              payload: {}
              as: NetworkOps
              captures: { tstate_at_cap: $.data.throttle_state }
          trigger:
            - call: "POST /usage-records"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", posted_at_iso: "2026-06-06T00:00:00Z", gb: 1 }
              as: NetworkOps
            - call: "GET /billing-cycles/${cycle_id}"
              payload: {}
              as: NetworkOps
              captures: { tstate_over: $.data.throttle_state }
          assert:
            - "at exactly 1000 GB BillingCycle.throttle_state == UNCAPPED (1000 == 1000 is not over)"
            - "after the +1 GB post (1001 total) BillingCycle.throttle_state == THROTTLED"

      - name: outage_sla_minutes_inclusive_boundary
        grounds:
          - state_machines.OutageEvent.RESOLVED_to_CREDITED
          - calculations.outage_credit
          - validations[priority=13]
        distinguishing_aspect: |
          Outage-duration metric on POST /outage-events/{id}/issue-credit: a 240-minute
          outage qualifies (>= 240, inclusive) while a 239-minute outage is rejected
          ERR_OUTAGE_BELOW_SLA — a different metric (duration) reached through a
          different endpoint than the data-cap boundary above.
        test_recipe:
          setup:
            - "Two RESOLVED outages on the same account/cycle: one 240 min, one 239 min."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "12 Fiber Ln", postal_code: "00012", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "SLA500", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SN-SLA-1", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-sla" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /outage-events"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", started_at_iso: "2026-06-05T00:00:00Z" }
              as: NetworkOps
              captures: { out_ok: $.data.id }
            - call: "POST /outage-events/${out_ok}/resolve"
              payload: { ended_at_iso: "2026-06-05T04:00:00Z" }
              as: NetworkOps
              captures: { ok_dur: $.data.duration_minutes }
            - call: "POST /outage-events"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", started_at_iso: "2026-06-06T00:00:00Z" }
              as: NetworkOps
              captures: { out_bad: $.data.id }
            - call: "POST /outage-events/${out_bad}/resolve"
              payload: { ended_at_iso: "2026-06-06T03:59:00Z" }
              as: NetworkOps
              captures: { bad_dur: $.data.duration_minutes }
          trigger:
            - call: "POST /outage-events/${out_ok}/issue-credit"
              payload: {}
              as: NetworkOps
              captures: { ok_status: $.data.status }
            - call: "POST /outage-events/${out_bad}/issue-credit"
              payload: {}
              as: NetworkOps
              captures: { bad_err: $.data.error_id }
          assert:
            - "out_ok duration_minutes == 240 and issue-credit succeeds -> OutageEvent.status == CREDITED"
            - "out_bad duration_minutes == 239 and issue-credit returns error_id == ERR_OUTAGE_BELOW_SLA (409)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_schedule_depends_on_address_serviceable
        grounds:
          - state_machines.ServiceOrder.DRAFT_to_SCHEDULED
          - entities.ServiceAddress.fields.coverage_status
          - validations[priority=7]
        distinguishing_aspect: |
          ServiceOrder DRAFT->SCHEDULED is gated by ServiceAddress.coverage_status:
          booking against a NOT_SERVICEABLE address is rejected
          ERR_ADDRESS_NOT_SERVICEABLE — entity pair ServiceOrder->ServiceAddress.
        test_recipe:
          setup:
            - "Address with coverage_status NOT_SERVICEABLE; a DRAFT TECH_INSTALL order on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
