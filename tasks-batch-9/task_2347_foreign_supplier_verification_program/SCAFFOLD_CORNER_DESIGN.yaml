              as: QualifiedIndividual
              as_user_id: "${qi_b}"
              captures: { recB: $.data.id }
          trigger:
            - call: "GET /fsvp/importers/${imp}/records-package?as_of_iso8601=2028-10-07T00:00:00Z"
              payload: {}
              as: FdaInspector
            - call: "GET /fsvp/importers/${imp}/records-package"
              payload: {}
              as: FdaInspector
          assert:
            - "the as_of call returns HTTP 200 with retained_record_count == 2, available_for_inspection_count == 1, expired_record_count == 1, rescinded_record_count == 0"
            - "VerificationRecord.${recA}.retained_until == 2028-10-06T00:00:00.000Z (expired at the as_of)"
            - "VerificationRecord.${recB}.retained_until == 2028-11-06T00:00:00.000Z (still available at the as_of)"
            - "the second call (as_of defaulting to the clock 2026-12-01) returns available_for_inspection_count == 2 and expired_record_count == 0"
            - "both responses report qualified_individual_designated == true and program_status == COMPLIANT"
            - "no entity version changes across either read"

      - name: sahcodha_hazard_makes_verification_approval_demand_an_onsite_audit
        claim_type: conditional_action
        grounds:
          - validations[priority=33]
          - errors.ERR_ONSITE_AUDIT_REQUIRED
          - endpoints["POST /fsvp/supplier-food-pairs/{id}/verification-approval"]
        distinguishing_aspect: "The same endpoint that accepts a sampling-only plan on a severity-4 pair must reject it here: the severity-5 supplier-controlled hazard makes an ONSITE_AUDIT mandatory even though adequacy 92.74 and frequency 5 comfortably clear every numeric floor."
        test_recipe:
          setup:
            - "APPROVED supplier, ready-to-eat GENERAL food, pair P5 whose analysis carries one severity 5 / probability 3 BIOLOGICAL hazard controlled by the FOREIGN_SUPPLIER (risk 17.25, required_coverage 25.88), and a single APPROVED SAMPLING_AND_TESTING activity at frequency 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ben Osei", email: "ben@northbrook.example", qualification_summary: "Preventive controls qualified individual with laboratory oversight background", training_completed_at: "2025-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_b: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_b}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair5: $.data.id, pair5_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair5}", expected_pair_version: "${pair5_v}", methodology_note: "SAHCODHA pathogen assessment for a frozen ready-to-eat fruit" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha5: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha5}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Listeria monocytogenes in a ready-to-eat product", severity: 5, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { hz5: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha5}/approval"
              payload: { approval_note: "Severity five pathogen hazard controlled at the foreign supplier" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/verification-activities"
              payload: { pair_id: "${pair5}", activity_type: "SAMPLING_AND_TESTING", frequency_per_year: 5, justification_text: "Five sampling and testing events per year were selected in place of an onsite audit of the facility", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-15T00:00:00Z", assigned_qi_id: "${qi_b}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { act10: $.data.id }
            - call: "POST /fsvp/verification-activities/${act10}/review"
              payload: { decision: "APPROVE", reviewer_note: "Sampling frequency accepted" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
          trigger:
            - call: "POST /fsvp/supplier-food-pairs/${pair5}/verification-approval"
              payload: { approval_note: "Requesting approval on sampling alone for a severity five hazard" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with ERR_ONSITE_AUDIT_REQUIRED"
            - "Hazard.${hz5}.risk_score == 17.25"
            - "SupplierFoodPair.${pair5}.required_coverage == 25.88"
            - "SupplierFoodPair.${pair5}.adequacy_score_planned == 92.74"
            - "SupplierFoodPair.${pair5}.required_annual_frequency == 1"
            - "SupplierFoodPair.${pair5}.verification_status == HAZARD_ANALYZED (unchanged)"

  # ===========================================================================
  # 6. From Table 6 (Errors) — every §1.6 code must be reachable.
  # Codes already made reachable by an earlier §1.9 section, and therefore not
  # repeated here: ERR_ROLE_NOT_PERMITTED and ERR_INVALID_REQUEST (validations /
  # entities), ERR_PAIR_NOT_FOUND and ERR_DUPLICATE_SUPPLIER_FOOD_PAIR
  # (entities), ERR_IMPORTER_SCOPE_MISMATCH (validations), ERR_ACTIVITY_NOT_FOUND
  # and ERR_ACTIVITY_NOT_APPROVED (validations), ERR_ANALYSIS_NOT_DRAFT,
  # ERR_INVALID_STATE_TRANSITION, ERR_QI_DESIGNATION_INVALID and
  # ERR_RECORD_NOT_ATTESTABLE (state_machines), ERR_HAZARD_ANALYSIS_EMPTY,
  # ERR_ADEQUACY_BELOW_FLOOR, ERR_FREQUENCY_BELOW_REQUIRED, ERR_RECORD_IN_FUTURE,
  # ERR_RECORD_OUTSIDE_ACTIVITY_WINDOW and ERR_JUSTIFICATION_INSUFFICIENT
  # (validations), ERR_ONSITE_AUDIT_REQUIRED (endpoints), ERR_UNAUTHENTICATED and
  # ERR_SEGREGATION_OF_DUTIES (rbac), ERR_STALE_PAIR_VERSION and
  # ERR_STALE_SUPPLIER_VERSION (cross-cutting complexity layers).
  # ===========================================================================
  - section: errors
    instances:
      - name: get_importer_with_unknown_id_returns_importer_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_IMPORTER_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that matches no row must yield 404 ERR_IMPORTER_NOT_FOUND rather than 400 or an empty 200 body."
        test_recipe:
          setup:
            - "Clock set; no importer is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fsvp/importers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ERR_IMPORTER_NOT_FOUND"

      - name: designation_on_unknown_qi_returns_qi_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_QI_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "The body is a perfectly valid DESIGNATE action, so the 404 can only come from the {id} path segment failing to resolve — the existence rung precedes the transition rung."
        test_recipe:
          setup:
            - "Clock set; no qualified individual is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/qualified-individuals/00000000-0000-4000-8000-0000000000ff/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ERR_QI_NOT_FOUND (not 409 ERR_INVALID_STATE_TRANSITION)"

      - name: get_foreign_supplier_with_unknown_id_returns_supplier_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SUPPLIER_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "Distinct 404 code per entity: the supplier lookup must not answer with the generic importer or pair not-found code."
        test_recipe:
          setup:
            - "Clock set; no supplier is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fsvp/foreign-suppliers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ERR_SUPPLIER_NOT_FOUND"

      - name: pair_create_with_unknown_food_id_returns_food_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FOOD_NOT_FOUND
          - validations[priority=7]
        distinguishing_aspect: "Importer, QI and supplier all resolve, so rungs 4-6 pass and only the food_id lookup at rung 7 can fail — proving the body FKs are checked in the declared order rather than as one opaque batch."
        test_recipe:
          setup:
            - "Importer with ACTIVE QI Ada and one supplier; no food is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
          trigger:
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "00000000-0000-4000-8000-0000000000ff", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ERR_FOOD_NOT_FOUND"
            - "no SupplierFoodPair row is created"

      - name: get_hazard_analysis_with_unknown_id_returns_hazard_analysis_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HAZARD_ANALYSIS_NOT_FOUND
          - validations[priority=9]
        distinguishing_aspect: "The analysis-scoped 404 is its own code, separate from the pair 404 that the same URL family also emits."
