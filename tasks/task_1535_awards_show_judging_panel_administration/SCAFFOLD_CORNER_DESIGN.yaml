    claim_type: side_effect_execution
    grounds:
    - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
    excluded_because:
      difficulty_instance: transitive_cascade / appeal_upheld_retraction_cascade
      rationale: The appeal->void->retract->disqualify->cancel chain is asserted end-to-end by the named §1.8 instance.
