            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech N", water_reclaim_certified: true }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
