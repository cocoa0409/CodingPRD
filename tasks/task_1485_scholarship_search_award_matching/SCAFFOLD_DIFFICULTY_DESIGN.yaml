  - rule_id: compensating_invariant
    instances:
      - name: fund_offer_revoke_available_conservation
        grounds:
          - calculations.fund_availability
          - state_machines.Award."offer_status=OFFERED_to_offer_status=REVOKED"
          - entities.AwardFund.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY. The forward action (award offer, reserving
          1000000) paired with its compensating action (revoke before acceptance)
          leaves AwardFund.available_cents bit-identical: 5000000 before the pair
          and 5000000 after, per available = committed - reserved - disbursed +
          returned with reserved/disburse/returned all back to their pair-prior
          values.
        test_recipe:
          setup:
            - "Fund committed 5000000 (available 5000000); SELECTED application ready for an offer"
          setup_api_calls:
