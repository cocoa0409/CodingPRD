      - name: permit_fee_variant_selected_by_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.permit_fee_assessment
          - state_machines.TransportPermit.DRAFT_to_FEE_PAID
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_fee_provisional_vs_final_divergence
          rationale: "The same §1.8 instance asserts that filing selects the provisional variant and issuance selects the final variant."

      - name: permit_fee_reconciliation_delta_on_issue
        claim_type: reconciliation
        grounds:
          - calculations.permit_fee_assessment
          - validations[priority 29]
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_fee_provisional_vs_final_divergence
          rationale: "The named §1.8 instance asserts the provisional-to-final delta at issuance and the resulting ERR_PERMIT_FEE_UNPAID shortfall on the already-paid amount, which is exactly this reconciliation claim."

  # ===========================================================================
  - section: validations
    instances:
      - name: escort_shortfall_outranks_unpaid_fee_on_issue
        claim_type: priority_ordering
        grounds:
          - validations[priority 26]
          - validations[priority 29]
          - errors[ERR_PERMIT_ESCORT_SHORTFALL]
          - errors[ERR_PERMIT_FEE_UNPAID]
        distinguishing_aspect: |
          A TX permit filed for one leg prices at 12000 + 4500 + 7500 = 24000 and is
          paid in full, then a second leg is added, which raises the FINAL fee to
          28500. Issuance now violates two rules at once - no RESERVED escort
          (priority 26) and 24000 paid against a 28500 FINAL fee (priority 29) - and
          the response must be the 422 ERR_PERMIT_ESCORT_SHORTFALL, not the 402.
          Only after an escort is reserved does the same call surface
          ERR_PERMIT_FEE_UNPAID, proving the ordering rather than a coincidence.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a TX plant, an ACTIVE hauler endorsed in TX, and an escort crew certified for both roles"
            - "a single-section TX order whose 168 x 150 in section is measured and released"
            - "a TX permit filed with planned_leg_count 1 (provisional 24000, escort_count_required 1, pilot_car_required false), paid to exactly 24000 so it sits in FEE_PAID, then a second SCHEDULED leg added"
          setup_api_calls:
