            - { call: "GET /charters/${c1}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { c1_final: $.data.status } }
          assert:
            - "c1_st == APPROVED"
            - "err == ERR_STALE_PROGRAM_VERSION   # stale expected_program_version rejected (412)"
            - "c2_st == APPROVED and c1_final == SUPERSEDED   # fresh version succeeds and supersedes"

