        excluded_because:
          difficulty_instance: cross_entity_state_dependency / approval_is_gated_by_lab_test_style_and_brand_states_it_does_not_own
          rationale: "Every precondition on the PENDING_APPROVAL -> APPROVED edge is violated one at a time in the named §1.8 instance, each with its own error_id assertion."

      - name: withdraw_cascade_reaches_child_hangtags
        claim_type: side_effect_execution
        grounds:
          - state_machines[entity=LabelSpec].transitions.PUBLISHED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: transitive_cascade / failed_reverification_cascades_test_to_style_to_permanent_labels_to_hangtags
          rationale: "The named §1.8 instance asserts the parent withdrawal and the system-only HANGTAG cascade at every level of the chain."

      - name: style_state_dimensions_are_independent
        claim_type: valid_transition
        grounds:
          - state_machines[entity=Style]
        excluded_because:
          difficulty_instance: non_linear_state_machine / style_substantiation_and_origin_dimensions_advance_independently
          rationale: "The parallel-shape claim - each dimension moves without disturbing the other - is the whole subject of the named §1.8 instance."

  - section: calculations
    instances:
      - name: care_performance_verdict_sits_exactly_on_the_three_declared_minimums
        claim_type: constants_applied
        grounds:
          - calculations.care_performance_evaluation
          - state_machines[entity=LabTest].transitions.BENCH_RESERVED_to_PASSED
          - state_machines[entity=LabTest].transitions.BENCH_RESERVED_to_FAILED
        distinguishing_aspect: "All three care constants are boundary-inclusive: 5 cycles, 3.0 pp shrinkage and grade 3.5 pass, while a shrinkage of 3.1 on an otherwise identical row fails - and legibility_cycles 12 never enters the verdict even though it is far below any market floor, because it is consumed only by durability_adequacy at approval."
        test_recipe:
          setup:
            - "Market US is registered; one brand owns two styles S1 and S2, each with a BENCH_RESERVED CARE_PERFORMANCE test at 30 C on LAB-ATL-1."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-C1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-C2", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${s1_id}", test_type: "CARE_PERFORMANCE", lab_code: "LAB-ATL-1", method: "AATCC_135", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z", wash_temp_c: 30 }
              as: AccreditedLab
              captures: { t1_id: $.data.id, t1_state: $.data.state, t1_attempt: $.data.attempt_no }
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${s2_id}", test_type: "CARE_PERFORMANCE", lab_code: "LAB-ATL-1", method: "AATCC_135", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z", wash_temp_c: 30 }
              as: AccreditedLab
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /labeling/lab-tests/${t1_id}/results"
              payload: { cycles_run: 5, dimensional_change_pct: 3.0, colorfastness_grade: 3.5, legibility_cycles: 12 }
              as: AccreditedLab
              captures: { t1_after: $.data.state, t1_valid_until: $.data.valid_until }
            - call: "POST /labeling/lab-tests/${t2_id}/results"
              payload: { cycles_run: 5, dimensional_change_pct: 3.1, colorfastness_grade: 3.5, legibility_cycles: 12 }
              as: AccreditedLab
              captures: { t2_after: $.data.state }
          assert:
            - "${t1_state} == \"BENCH_RESERVED\" and ${t1_attempt} == 1"
            - "${t1_after} == \"PASSED\" - every one of the three comparisons is satisfied at equality"
            - "${t2_after} == \"FAILED\" - a single 0.1 pp of extra shrinkage flips the verdict"
            - "${t1_valid_until} == \"2028-08-02T09:00:00Z\" - specimen_received_at plus the 730-day care validity, never measured from when the result was posted - and LabTest.${t2_id}.valid_until is null on a FAILED row"
            - "Neither style's substantiation_state changed: both remain \"FIBER_DECLARED\" (the fiber dimension is driven only by FIBER_CONTENT tests)"

      - name: effective_fiber_content_text_renders_one_decimal_and_breaks_percentage_ties_alphabetically
        claim_type: precision
        grounds:
          - calculations.effective_fiber_content_text
          - validations[priority=78]
        distinguishing_aspect: "Two lines tie at 33.3 and must be ordered COTTON before LINEN by name - never by submission order or id - while every percentage prints with exactly one decimal place, so 33.4 leads and no trailing OTHER FIBER bucket appears at all."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-TIE-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 300.0, declared_fibers: [{ fiber_generic_name: "LINEN", declared_pct: 33.3, ornamentation_exempt: false }, { fiber_generic_name: "VISCOSE", declared_pct: 33.4, ornamentation_exempt: false }, { fiber_generic_name: "COTTON", declared_pct: 33.3, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id, text: $.data.effective_fiber_content_text }
          assert:
            - "HTTP 201 (33.3 + 33.4 + 33.3 == 100.0 exactly at one decimal place, so priority 78 does not fire)"
            - "${text} == \"33.4% VISCOSE, 33.3% COTTON, 33.3% LINEN\""
            - "No \"OTHER FIBER\" segment appears, because every line is at or above the 5.0 listing threshold"

      - name: audit_rollup_still_counts_a_remediated_finding_as_open
        claim_type: input_set_filtering
        grounds:
          - calculations.audit_rollup
          - state_machines[entity=ComplianceAudit]
          - entities.ComplianceAudit.fields.open_finding_count
        distinguishing_aspect: "The two counters filter to state IN {OPEN, REMEDIATED}, so recording a disposition on one of two findings must leave open_finding_count at 2 and the audit in IN_REVIEW - an implementation that treats REMEDIATED as resolved would drop the count to 1 and, on the second disposition, would move the audit to PENDING_CLOSURE far too early."
        test_recipe:
          setup:
            - "One brand owns styles S1 and S2; audit A1 carries one OPEN finding on each - 100 units on S1 and 40 units on S2."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-A1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-A2", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id, audit_state_open: $.data.state }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${s1_id}", finding_code: "PLACEMENT_NON_PERMANENT", units_affected: 100 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${s2_id}", finding_code: "IDENTITY_MISSING", units_affected: 40 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f2_id: $.data.id }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { open_before: $.data.open_finding_count, scope_before: $.data.units_in_scope, state_before: $.data.state }
          trigger:
            - call: "POST /labeling/audit-findings/${f1_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 100, units_released: 0 }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { f1_state: $.data.state }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { open_mid: $.data.open_finding_count, crit_mid: $.data.critical_finding_count, scope_mid: $.data.units_in_scope, state_mid: $.data.state }
            - call: "POST /labeling/audit-findings/${f1_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_closed: $.data.state }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { open_after: $.data.open_finding_count, scope_after: $.data.units_in_scope, state_after: $.data.state }
          assert:
            - "${audit_state_open} == \"OPEN\" at creation, and ${state_before} == \"IN_REVIEW\" once the first finding is filed"
            - "${open_before} == 2 and ${scope_before} == 140"
            - "${f1_state} == \"REMEDIATED\" and ${open_mid} == 2 - REMEDIATED is still open for closure purposes"
            - "${crit_mid} == 0 (both findings are MAJOR at these unit counts) and ${scope_mid} == 140"
            - "${state_mid} == \"IN_REVIEW\" - the audit does NOT move to PENDING_CLOSURE"
            - "${f1_closed} == \"CLOSED\", ${open_after} == 1, ${scope_after} == 140 and ${state_after} == \"IN_REVIEW\""

      - name: label_content_hash_normalizes_case_and_whitespace_but_not_care_codes
        claim_type: correct_result
