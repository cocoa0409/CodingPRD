            - "${pre_variant} == FINAL, ${pre_net} == 11114, ${pre_adj} == 0, ${pre_status} == FINAL"
            - "${q1_status} == SAMPLED, ${q1_adj_pre} == 0 (declared default) and ${q1_obs_pre} is null before finalization"
            - "${q1_var} == AUDIT_ONLY and ${q1_guest} is null (no cleanliness_rating had landed)"
            - "${q1_obs} == 69.00 and ${q1_res} == 85.10 (0.7 * 92.00 + 0.3 * 69.00 == 64.40 + 20.70)"
            - "${q1_res} != 69.00 and ${q1_res} != 80.50 - the carryover weight dominates a single audit"
            - "${q1_adj} == -1200 (69 < AUDIT_PENALTY_SCORE 70), ${q1_fs} == FINALIZED, ${q1_fat} == 2026-08-08T20:00:00Z"
            - "${c_q} == 85.10 and ${c_done} == 1"
            - "${post_gross} == 9814 unchanged, ${post_adj} == -1200, ${post_net} == 9914, ${post_status} == ADJUSTED"
            - "${c_pend} == 9914 - the payout ledger tracks the adjusted net, not the pre-audit 11114"

      - name: corner_calc_on_hand_qty_is_a_pure_sum_over_the_append_only_ledger
        claim_type: aggregation
        grounds:
          - calculations.supply_on_hand_projection
          - entities.StockMovement.fields.delta_qty
          - entities.SupplyLine.fields.below_par
          - endpoints["POST /supply-lines/{id}/replenish"]
        distinguishing_aspect: |
          on_hand_qty is never incremented in place - it is SUM(delta_qty) over the line's whole
          ledger, so two replenishments of 5 and 7 on a line seeded at 2 must yield exactly 14
          with three surviving movements (SEED 2, REPLENISH 5, REPLENISH 7) whose deltas sum to
          the projected value. Crossing reorder_point 3 flips below_par from true to false on the
          same response that appends the movement, and the OCC version advances once per append.
        test_recipe:
          setup:
            - "Property P8 'AUS-108' ZONE_B ONE_BR exists."
            - "Supply line CON-SOAP is seeded with initial_on_hand_qty 2 and reorder_point 3, so it starts below par."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-108", name: "Crestview Bungalow", zone_code: "ZONE_B", size_tier: "ONE_BR", owner_contact_email: "owner8@example.com", bedroom_count: 1, bathroom_count: 1, bed_count: 1 }
              as: PlatformAdmin
              captures: { p8: "$.data.id" }
          trigger:
            - call: "POST /properties/${p8}/supply-lines"
              payload: { sku: "CON-SOAP", name: "Bar Soap", category: "CONSUMABLE", unit_cost_cents: 200, par_qty: 4, unit: "EACH", reorder_point: 3, initial_on_hand_qty: 2 }
              as: Coordinator
              captures: { sl: "$.data.id", s0_qty: "$.data.on_hand_qty", s0_par: "$.data.below_par", s0_v: "$.data.version", s0_status: "$.data.status" }
            - call: "POST /supply-lines/${sl}/replenish"
              payload: { qty: 5, expected_supply_line_version: "${s0_v}", note: "weekly drop" }
              as: Coordinator
              captures: { s1_qty: "$.data.on_hand_qty", s1_par: "$.data.below_par", s1_v: "$.data.version" }
            - call: "POST /supply-lines/${sl}/replenish"
              payload: { qty: 7, expected_supply_line_version: "${s1_v}" }
              as: Coordinator
              captures: { s2_qty: "$.data.on_hand_qty", s2_par: "$.data.below_par", s2_v: "$.data.version" }
            - call: "GET /stock-movements"
              payload: { supply_line_id: "${sl}" }
              as: Coordinator
              captures: { m0_reason: "$.data[0].reason", m0_delta: "$.data[0].delta_qty", m1_reason: "$.data[1].reason", m1_delta: "$.data[1].delta_qty", m2_reason: "$.data[2].reason", m2_delta: "$.data[2].delta_qty", m2_charge: "$.data[2].charge_cents" }
            - call: "GET /properties/${p8}/supply-lines"
              payload: { below_par: true }
              as: Coordinator
            - call: "GET /supply-lines/${sl}"
              payload: {}
              as: Coordinator
              captures: { s_final: "$.data.on_hand_qty" }
          assert:
            - "${s0_qty} == 2, ${s0_par} == true (2 <= reorder_point 3), ${s0_v} == 1, ${s0_status} == ACTIVE"
            - "${s1_qty} == 7 (2 + 5), ${s1_par} == false (7 > 3), ${s1_v} == 2"
            - "${s2_qty} == 14 (2 + 5 + 7), ${s2_par} == false, ${s2_v} == 3"
            - "GET /stock-movements?supply_line_id=${sl} returns total_count == 3"
            - "${m0_reason} == SEED with ${m0_delta} == 2; ${m1_reason} == REPLENISH with ${m1_delta} == 5; ${m2_reason} == REPLENISH with ${m2_delta} == 7"
            - "${m0_delta} + ${m1_delta} + ${m2_delta} == 14 == ${s_final} - the projection reconciles with the ledger"
            - "${m2_charge} == 0 (declared default; only restock consumption carries money)"
            - "GET /properties/${p8}/supply-lines?below_par=true returns total_count == 0 once the line is above its reorder point"

      - name: corner_calc_daily_load_counts_only_live_assignments_regardless_of_creation_order
        claim_type: Input Set Filtering
        grounds:
          - calculations.cleaner_daily_load.input_set
          - entities.Cleaner.fields.max_daily_turnovers
          - errors.ERR_CLEANER_DAILY_CAP_REACHED
        distinguishing_aspect: |
          The cap counts assignments in OFFERED, ACCEPTED or ACTIVE only - an OFFERED row already
          consumes capacity before the cleaner ever accepts, and a DECLINED row stops consuming
          it. With max_daily_turnovers 1 the same offer is therefore refused with 409 and then
          accepted verbatim after the first offer is declined, with no other state change in
          between. The two turnovers are created in reverse chronological order to prove the
          local-date grouping is computed from window_start_at rather than from insertion order,
          and the 15-minute gap between the windows keeps ERR_CLEANER_SCHEDULE_CONFLICT out of it.
        test_recipe:
          setup:
            - "Properties PA 'AUS-111' and PB 'AUS-112', both ZONE_A ONE_BR with local_utc_offset_minutes 0, 1 bathroom, 1 bed -> required_minutes 140 each."
            - "Cleaner D: home ZONE_A, skill_level 4, quality 92.00, max_daily_turnovers 1."
            - "T_B (window 20:45Z-23:30Z, 165 minutes) is created BEFORE T_A (window 16:00Z-20:30Z, 270 minutes); both window_start_at values fall on local date 2026-08-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-111", name: "Zilker A", zone_code: "ZONE_A", size_tier: "ONE_BR", owner_contact_email: "owner11@example.com", bedroom_count: 1, bathroom_count: 1, bed_count: 1 }
              as: PlatformAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-112", name: "Zilker B", zone_code: "ZONE_A", size_tier: "ONE_BR", owner_contact_email: "owner12@example.com", bedroom_count: 1, bathroom_count: 1, bed_count: 1 }
              as: PlatformAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner D", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 1, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cd: "$.data.id", cd_cap: "$.data.max_daily_turnovers", cd_dec: "$.data.decline_count" }
            - call: "POST /bookings"
              payload: { property_id: "${pb}", external_ref: "OUT-B", guest_name: "Guest Out B", checkin_at: "2026-08-06T21:00:00Z", checkout_at: "2026-08-08T20:45:00Z" }
              as: Coordinator
              captures: { bb_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${pb}", external_ref: "IN-B", guest_name: "Guest In B", checkin_at: "2026-08-09T00:00:00Z", checkout_at: "2026-08-12T16:00:00Z" }
              as: Coordinator
              captures: { bb_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${bb_out}", incoming_booking_id: "${bb_in}" }
              as: Coordinator
              captures: { tb: "$.data.id", tb_v: "$.data.version", tb_start: "$.data.window_start_at", tb_end: "$.data.window_end_at", tb_min: "$.data.window_minutes" }
            - call: "POST /bookings"
              payload: { property_id: "${pa}", external_ref: "OUT-A", guest_name: "Guest Out A", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { ba_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${pa}", external_ref: "IN-A", guest_name: "Guest In A", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { ba_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${ba_out}", incoming_booking_id: "${ba_in}" }
              as: Coordinator
              captures: { ta: "$.data.id", ta_v: "$.data.version", ta_start: "$.data.window_start_at", ta_end: "$.data.window_end_at" }
          trigger:
            - call: "POST /turnovers/${ta}/assign"
              payload: { expected_turnover_version: "${ta_v}", cleaner_id: "${cd}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { aa: "$.data.id", aa_status: "$.data.status", aa_score: "$.data.match_score" }
            - call: "POST /turnovers/${tb}/assign"
              payload: { expected_turnover_version: "${tb_v}", cleaner_id: "${cd}" }
              as: Coordinator
              as_user_id: "coord-1"
            - call: "POST /assignments/${aa}/decline"
              payload: { decline_reason: "double-booked personally" }
              as: Cleaner
              as_user_id: "${cd}"
              captures: { aa_final: "$.data.status" }
            - call: "POST /turnovers/${tb}/assign"
              payload: { expected_turnover_version: "${tb_v}", cleaner_id: "${cd}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { ab: "$.data.id", ab_status: "$.data.status", ab_score: "$.data.match_score" }
            - call: "GET /assignments"
              payload: { cleaner_id: "${cd}", status: "OFFERED" }
              as: Coordinator
            - call: "GET /turnovers/${ta}"
              payload: {}
              as: Coordinator
              captures: { ta_after: "$.data.status", ta_ver_after: "$.data.version" }
          assert:
            - "${cd_cap} == 1 and ${cd_dec} == 0 initially"
            - "${ta_start} == 2026-08-08T16:00:00Z, ${ta_end} == 2026-08-08T20:30:00Z"
            - "${tb_start} == 2026-08-08T20:45:00Z, ${tb_end} == 2026-08-08T23:30:00Z, ${tb_min} == 165"
            - "1st assign: 201 with ${aa_status} == OFFERED and ${aa_score} == 0.9600"
            - "2nd assign (T_B, same local date): 409 ERR_CLEANER_DAILY_CAP_REACHED - an OFFERED row already fills the single slot"
            - "NOT 409 ERR_CLEANER_SCHEDULE_CONFLICT: the gap 20:30Z -> 20:45Z equals SAME_ZONE_BUFFER_MINUTES exactly, and the overlap test uses strict <"
            - "${aa_final} == DECLINED and Cleaner.${cd}.decline_count == 1"
            - "3rd assign (identical payload): 201 with ${ab_status} == OFFERED and ${ab_score} == 0.9600 - DECLINED no longer counts"
            - "GET /assignments?cleaner_id=${cd}&status=OFFERED returns total_count == 1"
            - "${ta_after} == PENDING_ASSIGNMENT and ${ta_ver_after} == 2 (the decline reverted the workflow, not the version)"

      - name: corner_calc_booking_occupancy_treats_adjacent_intervals_as_disjoint
        claim_type: interval_merge
        grounds:
          - calculations.booking_occupancy_overlap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / booking_occupancy_half_open_adjacency_allowed_on_property
          rationale: "That instance books checkin_at exactly equal to the previous checkout_at on the same property (accepted) and one minute earlier (ERR_BOOKING_OVERLAP), which is precisely the adjacent-versus-overlapping pair for this calculation."

      - name: corner_calc_daily_load_buffer_boundary_is_strict_and_zone_conditional
        claim_type: chronological
        grounds:
          - calculations.cleaner_daily_load.constants
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cleaner_cross_zone_buffer_overlap_rejected_and_exact_boundary_allowed
          rationale: "That instance drives the 45-minute cross-zone buffer at one minute inside the boundary (ERR_CLEANER_SCHEDULE_CONFLICT) and exactly on it (accepted), pinning both the strict comparison and the property-zone-driven buffer choice."

      - name: corner_calc_pay_formula_end_to_end_known_inputs_to_expected_cents
        claim_type: Correct Result
        grounds:
          - calculations.cleaner_pay_line
        excluded_because:
          difficulty_instance: combinatorial_formula / late_penalty_cap_pinned_to_post_linen_gross_before_bonuses
          rationale: "That instance walks the whole pay formula on pinned inputs - base by size tier, rush and tightness and cross-zone percentages, linen handling, bonuses, then the capped late penalty - and asserts every intermediate and the final net in cents, which is the Correct Result claim for the scaffold's central calculation."

      - name: corner_calc_provisional_to_final_switch_moves_the_ledger_by_exactly_the_delta
        claim_type: Reconciliation
        grounds:
          - calculations.cleaner_pay_line.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pay_variant_divergence_provisional_vs_final_linen_units
          rationale: "That instance computes both variants over one dataset and asserts that the PROVISIONAL to FINAL switch moves cleaner.pending_payout_cents by exactly the -1440 difference with no drift, which is the reconciliation claim."

  # ===========================================================================
  - section: validations
    instances:
      - name: corner_val_priority_1_to_5_ladder_auth_outranks_role_shape_and_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: |
          Four rungs of the priority ladder are walked with the SAME request made progressively
          less broken, so each step proves the previous rung outranked the next: unknown property
          id with no auth headers -> 401 (not 404); unknown property id with a bogus role string
          -> 401 (not 403); PlatformAdmin-exclusive POST /cleaners called by a Coordinator with a
          required field missing -> 403 (not 400); the same body sent by PlatformAdmin -> 400; and
          only when auth, role and shape are all clean does the 404 surface.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' exists; 11111111-1111-1111-1111-111111111111 is a syntactically valid UUID that matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "GET /properties/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: "(request sent with neither X-User-Role nor X-User-ID)"
              captures: { e1: "$.data.error_id" }
            - call: "GET /properties/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: "SuperUser (not one of the five declared roles)"
              as_user_id: "u-1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /cleaners"
              payload: { home_zone_code: "ZONE_A", skill_level: 3 }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e3: "$.data.error_id" }
            - call: "POST /cleaners"
              payload: { home_zone_code: "ZONE_A", skill_level: 3 }
              as: PlatformAdmin
              captures: { e4: "$.data.error_id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner E", home_zone_code: "ZONE_A", skill_level: 9 }
              as: PlatformAdmin
              captures: { e5: "$.data.error_id" }
            - call: "GET /properties/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e6: "$.data.error_id" }
            - call: "GET /properties/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { ok_code: "$.data.code" }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 - priority 1 beats the priority 5 existence check"
            - "${e2} == ERR_UNAUTHENTICATED with HTTP 401 - an unrecognised role value is an authentication failure, not a 403"
            - "${e3} == ERR_UNAUTHORIZED with HTTP 403 - priority 2 beats the priority 3 shape check on the identical body"
            - "${e4} == ERR_INVALID_REQUEST with HTTP 400 - the missing required `name` only surfaces once the role is right"
            - "${e5} == ERR_INVALID_REQUEST with HTTP 400 - skill_level 9 is outside the declared 1..5 bound"
            - "${e6} == ERR_PROPERTY_NOT_FOUND with HTTP 404 - the last rung, reached only when 1, 2 and 3 all pass"
            - "${ok_code} == AUS-101 - the same endpoint succeeds for the real id, so none of the above is an endpoint defect"

      - name: corner_val_body_referenced_ids_are_resolved_after_shape_validation
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_BOOKING_NOT_FOUND
          - errors.ERR_CLEANER_NOT_FOUND
          - errors.ERR_SUPPLY_LINE_NOT_FOUND
        distinguishing_aspect: |
          Priority 6 covers ids carried in the BODY rather than in the path, and each one maps to
          its own entity-specific 404: outgoing_booking_id -> ERR_BOOKING_NOT_FOUND,
          incoming_booking_id -> ERR_BOOKING_NOT_FOUND, cleaner_id on assign ->
          ERR_CLEANER_NOT_FOUND, turnover_id on audit sampling -> ERR_TURNOVER_NOT_FOUND. The
          same request with the field entirely absent produces 400 instead, which separates
          priority 3 from priority 6.
        test_recipe:
          setup:
            - "Property P1 with bookings OUT-1 (checkout 2026-08-08T16:00:00Z) and IN-1 (checkin 2026-08-08T21:00:00Z), and turnover T1 at version 1."
            - "MISSING = 22222222-2222-2222-2222-222222222222 resolves to no row of any entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
          trigger:
            - call: "POST /turnovers"
              payload: { incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "POST /bookings"
              payload: { property_id: "22222222-2222-2222-2222-222222222222", external_ref: "OUT-X", guest_name: "Ghost", checkin_at: "2026-08-20T21:00:00Z", checkout_at: "2026-08-22T16:00:00Z" }
              as: Coordinator
              captures: { e2: "$.data.error_id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "22222222-2222-2222-2222-222222222222" }
              as: Coordinator
              captures: { e3: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "22222222-2222-2222-2222-222222222222" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e4: "$.data.error_id" }
            - call: "POST /quality-audits"
              payload: { turnover_id: "22222222-2222-2222-2222-222222222222", score: 88 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { e5: "$.data.error_id" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t1_state: "$.data.status", t1_ver: "$.data.version" }
          assert:
            - "${e1} == ERR_INVALID_REQUEST (400) - outgoing_booking_id absent is a shape failure at priority 3"
            - "${e2} == ERR_PROPERTY_NOT_FOUND (404) - body property_id resolved at priority 6"
            - "${e3} == ERR_BOOKING_NOT_FOUND (404)"
            - "${e4} == ERR_CLEANER_NOT_FOUND (404), not ERR_CLEANER_NOT_ELIGIBLE - existence precedes eligibility"
            - "${e5} == ERR_TURNOVER_NOT_FOUND (404), not ERR_TURNOVER_NOT_COMPLETED"
            - "${t1_state} == PENDING_ASSIGNMENT and ${t1_ver} == 1 - every rejected call left the turnover untouched"

      - name: corner_val_duplicate_keys_rejected_globally_and_per_property
        claim_type: Violation → Error
        grounds:
          - validations[priority=28]
          - errors.ERR_DUPLICATE_RESOURCE_KEY
        distinguishing_aspect: |
          The three unique keys have different scopes and the test proves each scope by also
          showing the case that must SUCCEED: Property.code is global (a second AUS-101 is
          refused outright), while SupplyLine (property_id, sku) and Booking
          (property_id, external_ref) are per-property (the same sku and the same external_ref
          are accepted on a second property, refused on the same one).
        test_recipe:
          setup:
            - "Properties P1 'AUS-101' and P2 'AUS-102' exist; P1 already carries supply line LIN-SHEET-Q and booking OUT-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Second Unit", zone_code: "ZONE_B", size_tier: "STUDIO", owner_contact_email: "owner2@example.com" }
              as: PlatformAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen Sheet Set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: Coordinator
              captures: { sl1: "$.data.id" }
            - call: "POST /bookings"
