            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-J9" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Juliet Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/aircraft/${ac}/transition-slots", payload: { window_start: "2026-08-01", window_end: "2026-08-15" }, as: LessorAdmin, captures: { slot: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-004" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 80000 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 50000 }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}", payload: {}, as: LessorAdmin, captures: { rc_v: "$.data.version"} }
            - { call: "POST /leasing/return-cases/${rc}/agree", payload: { expected_return_case_version: "${rc_v}" }, as: LesseeRep, as_user_id: "${les}" }
          trigger:
