# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the claim-extraction-guide taxonomy. §1.8 is the depth probe.
# Shared seed: MAJOR FeeSchedule (base 20000, daily 500, cap 100000, cure 14).
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_owner_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Owner.fields.full_name, entities.Owner.fields.repeat_tier]
        distinguishing_aspect: "POST /owners with full_name+mailing_email returns 201; repeat_tier defaults FIRST and prior_violation_count 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /owners"
              payload: { full_name: "Anna A", mailing_email: "anna@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id, tier: $.data.repeat_tier, cnt: $.data.prior_violation_count }
          assert:
            - "HTTP 201"
            - "Owner.${owner_id}.repeat_tier == FIRST"
            - "Owner.${owner_id}.prior_violation_count == 0"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Case", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cases/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_property_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Property.fields.parcel_number", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /properties omitting parcel_number returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An Owner exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Owen O", mailing_email: "owen@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", street_address: "1 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST (parcel_number missing)"

      - name: create_property_invalid_occupancy_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Property.fields.occupancy", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /properties with occupancy not in {OCCUPIED,VACANT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An Owner exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Vic V", mailing_email: "vic@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-X", street_address: "2 X St", occupancy: "MAYBE" }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST (occupancy enum invalid)"

      - name: duplicate_parcel_number_returns_conflict
        claim_type: Type Constraints
        grounds: ["entities.Property.fields.parcel_number", "validations[priority=19]", "errors[ERR_DUPLICATE_PARCEL]"]
        distinguishing_aspect: "Creating a second non-ARCHIVED Property with an existing parcel_number returns ERR_DUPLICATE_PARCEL (409)."
        test_recipe:
          setup: ["A Property with parcel_number APN-DUP exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Dora D", mailing_email: "dora@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-DUP", street_address: "3 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
          trigger:
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-DUP", street_address: "4 X St", occupancy: "VACANT" }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_PARCEL"

      - name: case_computed_outstanding_balance_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Case.fields.outstanding_balance_cents]
        distinguishing_aspect: "POST /cases ignores any client-sent outstanding_balance_cents; server computes 0 at creation."
        test_recipe:
          setup: ["An Owner and Property exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Cole C", mailing_email: "cole@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-CMP", street_address: "5 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id, bal: $.data.outstanding_balance_cents, posture: $.data.posture }
          assert:
            - "Case.${case_id}.outstanding_balance_cents == 0"
            - "Case.${case_id}.posture == INTAKE"

  # =========================================================================
  - section: state_machines
    instances:
      - name: triage_already_triaged_complaint_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Complaint.RECEIVED_to_TRIAGED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Triaging a complaint already in TRIAGED returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A complaint TRIAGED once."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Tom T", mailing_email: "tom@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-TR", street_address: "6 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /complaints"
              payload: { case_id: "${case_id}", reporter_kind: "RESIDENT", narrative: "weeds" }
              as: CodeOfficer
              captures: { comp_id: $.data.id }
            - call: "POST /complaints/${comp_id}/triage"
              payload: {}
              as: CodeOfficer
          trigger:
            - call: "POST /complaints/${comp_id}/triage"
              payload: {}
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: complied_notice_is_terminal_contest_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.ViolationNotice.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Contesting a COMPLIED (terminal) notice returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A MAJOR notice cured to COMPLIED via PASSED reinspection within window."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Cleo C", mailing_email: "cleo@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-CO", street_address: "7 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /reinspections"
              payload: { notice_id: "${notice_id}" }
              as: CodeOfficer
              captures: { reinsp_id: $.data.id }
            - call: "POST /reinspections/${reinsp_id}/result"
              payload: { result: "PASSED" }
              as: CodeOfficer
          trigger:
            - call: "POST /notices/${notice_id}/contest"
              payload: { scheduled_for: "2026-01-10T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "ViolationNotice.${notice_id}.status == COMPLIED (terminal) before contest"
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: hearing_decided_before_scheduled_for_returns_not_ripe
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Hearing.SCHEDULED_to_HELD_UPHELD", "validations[priority=11]", "errors[ERR_HEARING_NOT_RIPE]"]
        distinguishing_aspect: "Deciding a hearing before its scheduled_for instant returns ERR_HEARING_NOT_RIPE (422)."
        test_recipe:
          setup: ["A CONTESTED MAJOR notice with hearing scheduled_for 2026-01-10; clock still at 2026-01-05."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Rip R", mailing_email: "rip@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-RIP", street_address: "8 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /notices/${notice_id}/contest"
              payload: { scheduled_for: "2026-01-10T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
              captures: { hearing_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hearings/${hearing_id}/decide"
              payload: { decision: "UPHELD" }
              as: HearingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_HEARING_NOT_RIPE"

      - name: third_continuance_exceeds_limit
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Hearing.SCHEDULED_to_CONTINUED", "validations[priority=12]", "errors[ERR_CONTINUANCE_LIMIT]"]
        distinguishing_aspect: "A third continuance (after MAX_CONTINUANCES=2) returns ERR_CONTINUANCE_LIMIT (422)."
        test_recipe:
          setup: ["A SCHEDULED hearing continued twice (count 2), rescheduled back to SCHEDULED each time."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Connie C", mailing_email: "connie@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-CL", street_address: "9 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /notices/${notice_id}/contest"
              payload: { scheduled_for: "2026-01-10T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
              captures: { hearing_id: $.data.id }
            - call: "POST /hearings/${hearing_id}/continue"
              payload: {}
              as: HearingOfficer
            - call: "POST /hearings/${hearing_id}/reschedule"
              payload: { scheduled_for: "2026-01-12T00:00:00Z" }
              as: HearingOfficer
            - call: "POST /hearings/${hearing_id}/continue"
              payload: {}
              as: HearingOfficer
            - call: "POST /hearings/${hearing_id}/reschedule"
              payload: { scheduled_for: "2026-01-14T00:00:00Z" }
              as: HearingOfficer
          trigger:
            - call: "POST /hearings/${hearing_id}/continue"
              payload: {}
              as: HearingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_CONTINUANCE_LIMIT (continuance_count already 2)"

      - name: foreclose_before_wait_period_returns_not_ripe
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Lien.RECORDED_to_FORECLOSED", "validations[priority=13]", "errors[ERR_FORECLOSURE_NOT_RIPE]"]
        distinguishing_aspect: "Foreclosing a lien before FORECLOSURE_WAIT_DAYS (90) returns ERR_FORECLOSURE_NOT_RIPE (422)."
        test_recipe:
          setup: ["A RECORDED lien at 2026-01-25; clock advanced only to 2026-02-01 (7 days < 90)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Fay F", mailing_email: "fay@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-FC", street_address: "10 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { case_v: $.data.version }
            - call: "POST /liens"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v}" }
              as: FinanceClerk
              captures: { lien_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /liens/${lien_id}/foreclose"
              payload: {}
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_FORECLOSURE_NOT_RIPE"

      - name: complete_abatement_without_actual_cost_returns_error
        claim_type: Precondition Enforcement
        grounds: ["state_machines.AbatementOrder.IN_PROGRESS_to_COMPLETED", "validations[priority=18]", "errors[ERR_MISSING_ACTUAL_COST]"]
        distinguishing_aspect: "Completing an IN_PROGRESS abatement without actual_cost_cents returns ERR_MISSING_ACTUAL_COST (422)."
        test_recipe:
          setup: ["A BOARD_UP abatement IN_PROGRESS on a case with an issued notice."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Mac M", mailing_email: "mac@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-AC", street_address: "11 X St", occupancy: "VACANT" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
            - call: "POST /abatement-orders"
              payload: { case_id: "${case_id}", action_kind: "BOARD_UP", estimated_cost_cents: 30000 }
              as: CodeOfficer
              captures: { ao_id: $.data.id }
            - call: "POST /abatement-orders/${ao_id}/start"
              payload: {}
              as: CodeOfficer
          trigger:
            - call: "POST /abatement-orders/${ao_id}/complete"
              payload: {}
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_MISSING_ACTUAL_COST"

      - name: reinspection_notice_id_invalid_on_inspection
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=20]", "errors[ERR_REINSPECTION_TARGET_INVALID]"]
        distinguishing_aspect: "A REINSPECTION inspection whose notice_id is omitted returns ERR_REINSPECTION_TARGET_INVALID (422)."
        test_recipe:
          setup: ["A case with no issued notice; a REINSPECTION inspection is scheduled without notice_id."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Ren R", mailing_email: "ren@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-RE", street_address: "12 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "REINSPECTION" }
              as: CodeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_REINSPECTION_TARGET_INVALID"

      - name: contest_after_window_closed_returns_error
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ViolationNotice.OVERDUE_to_CONTESTED", "validations[priority=10]", "errors[ERR_CONTEST_WINDOW_CLOSED]"]
        distinguishing_aspect: "Contesting an OVERDUE notice past compliance_deadline + GRACE_CONTEST_DAYS (3) returns ERR_CONTEST_WINDOW_CLOSED (422)."
        test_recipe:
          setup: ["MAJOR notice issued 2026-01-01 (deadline 2026-01-15). Clock at 2026-01-20 (> deadline+3)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Wade W", mailing_email: "wade@x.com" }
