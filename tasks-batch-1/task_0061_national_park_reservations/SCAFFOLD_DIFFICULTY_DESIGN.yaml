            - call: "POST /v1/atb-passes"
              payload: { account_id: "${v_id}", pass_type: "annual", valid_from: "2026-06-01" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { pass1: $.data.id }
          trigger:
            - call: "POST /v1/atb-passes"
              payload: { account_id: "${v_id}", pass_type: "annual", valid_from: "2026-09-01" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PASS_OVERLAP"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_campsite_halfopen_adjacent_allowed
        grounds:
          - validations[priority=28]
          - state_machines.CampReservation.held_to_confirmed
          - entities.CampReservation.fields.check_out
        distinguishing_aspect: |
          Campsite interval semantics are HALF-OPEN [check_in, check_out): a new
          stay starting exactly on an existing stay's check_out is allowed (no
          overlap), distinguishing adjacency from collision.
        test_recipe:
          setup:
            - "One tent site; confirmed reservation 06-10..06-12; new reservation 06-12..06-14 (adjacent, check_out exclusive)."
          setup_api_calls:
            - call: "POST /v1/parks"
