# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe).
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Default logical clock = 2026-05-01T00:00:00Z. Funding at default clock =>
# funded_at = 2026-05-01T00:00:00Z. excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_program_create_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.FactoringProgram, endpoints]
        distinguishing_aspect: "POST /factoring/programs with only name returns 201; currency defaults USD, default_fee_rate_per_day 0.0005, tier2 1.5, tier3 2.0, recourse_grace_days 90, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /factoring/programs"
              payload: { name: "P-DEF" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          assert:
            - "Response 201; data.status == ACTIVE; data.currency == USD; data.default_fee_rate_per_day == 0.0005; data.recourse_grace_days == 90; data.version == 1"

      - name: entity_client_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Client, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /factoring/clients without requested_advance_rate_pct returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-RF" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "NoRate" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response 422 ERR_INVALID_REQUEST (requested_advance_rate_pct missing)"

      - name: entity_invoice_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Invoice, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /factoring/invoices/{id} with a random non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /factoring/invoices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 ERR_NOT_FOUND"

      - name: entity_invoice_computed_advance_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Invoice.fields.advance_amount_cents, calculations.advance_split]
        distinguishing_aspect: "advance_amount_cents is computed at funding = round_half_up(face*advance_rate); client cannot supply it (not in POST input). 100000@0.85 => 85000."
        test_recipe:
          setup: ["Client APPROVED advance 0.85, Debtor APPROVED, relationship NOTICED, invoice verified, batch DRAFT"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-COMP" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "CompCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "CompDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-COMP", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-COMP", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
          assert:
            - "Invoice.${inv_id}.advance_amount_cents == 85000; reserve_held_cents == 15000; status == FUNDED"

      - name: entity_list_clients_pagination_envelope
        claim_type: Listing
        grounds: [entities.Client, endpoints, response_envelope]
        distinguishing_aspect: "GET /factoring/clients?limit=1 returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["program with two clients"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-LIST" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "L1", requested_advance_rate_pct: 0.8 }
              as: PlatformAdmin
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "L2", requested_advance_rate_pct: 0.8 }
              as: PlatformAdmin
          trigger:
            - call: "GET /factoring/clients?program_id=${prog_id}&limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response response_type == array; meta has total_count == 2 and has_more == true; data length 1"

      - name: entity_program_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.FactoringProgram.fields.status]
        distinguishing_aspect: "status is source:system; even if a client tried to set it, the created program is ACTIVE and version starts at 1 (id/created_at server-minted)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /factoring/programs"
              payload: { name: "P-SYS" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, v: $.data.version }
          assert:
            - "data.status == ACTIVE; data.version == 1; data.id is a UUID without type prefix; data.created_at present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_verify_from_already_verified_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Invoice.SUBMITTED_to_VERIFIED, "validations[priority=10]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second verify on an already VERIFIED invoice (not SUBMITTED) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["relationship NOTICED, invoice verified once"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-IV" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "IvCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "IvDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-IV", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
          trigger:
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { err: $.data.error_id }
          assert:
            - "Second verify returns 409 ERR_INVALID_STATE (invoice not SUBMITTED)"

      - name: sm_reject_from_terminal_settled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Invoice.SUBMITTED_to_REJECTED, "validations[priority=10]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rejecting an invoice already in terminal SETTLED returns 409 ERR_INVALID_STATE; no transition out of a terminal state."
        test_recipe:
          setup: ["invoice fully collected => SETTLED"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-TL", default_fee_rate_per_day: 0.0005 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "TlCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "TlDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-TL", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-TL", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "GET /factoring/clients/${client_id}"
              payload: {}
              as: CollectionsOfficer
              as_user_id: "co_1"
              captures: { client_v2: $.data.version }
            - call: "POST /factoring/invoices/${inv_id}/postings"
              payload: { amount_cents: 100000, received_at: "2026-05-21T00:00:00Z", payer: "DEBTOR", expected_client_version: "${client_v2}" }
              as: CollectionsOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /factoring/invoices/${inv_id}/reject"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { err: $.data.error_id }
          assert:
            - "Invoice already SETTLED; reject returns 409 ERR_INVALID_STATE"

      - name: sm_client_initial_state_pending
        claim_type: Initial State
        grounds: [state_machines.Client, entities.Client.fields.status]
        distinguishing_aspect: "A newly onboarded client starts in PENDING (initial_state) before any credit decision."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-INIT" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "InitCo", requested_advance_rate_pct: 0.8 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          assert:
            - "data.status == PENDING; approved_advance_rate_pct == null; credit_limit_cents == null"

      - name: sm_send_notice_from_suspended_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.ClientDebtorRelationship.PENDING_to_NOTICED, "validations[priority=10]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "send-notice is only defined from notice_status PENDING; calling it on a SUSPENDED relationship returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["relationship NOTICED then SUSPENDED"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-SN" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "SnCo", requested_advance_rate_pct: 0.8 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.8, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.9 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "SnDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/relationships/${rel_id}/suspend"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
          trigger:
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { err: $.data.error_id }
          assert:
            - "send-notice on SUSPENDED relationship returns 409 ERR_INVALID_STATE"

      - name: sm_relationship_cycle_revisits_noticed
        claim_type: cyclic
        grounds: [state_machines.ClientDebtorRelationship.SUSPENDED_to_NOTICED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_relationship_notice_suspend_resume_cycle
          rationale: "The NOTICED->SUSPENDED->NOTICED cycle is exercised by the named §1.8 instance."

      - name: sm_invoice_branch_divergence
        claim_type: branching
        grounds: [state_machines.Invoice.OUTSTANDING_to_SETTLED, state_machines.Invoice.OUTSTANDING_to_SHORT_PAID]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_invoice_branch_settled_vs_shortpaid_buyback
          rationale: "The SETTLED vs SHORT_PAID->BOUGHT_BACK fork is exercised by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: calc_provisional_fee_zero_before_funding_day_elapses
        claim_type: Correct Result
        grounds: [calculations.factoring_fee, entities.Invoice.fields.accrued_fee_cents]
        distinguishing_aspect: "On the funding day itself (clock == funded_at, days_p == 0) accrued_fee_cents == 0; PROVISIONAL accrual is floored at 0 days."
        test_recipe:
          setup: ["invoice funded at default clock; clock still 2026-05-01 (0 days elapsed)"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-PF", default_fee_rate_per_day: 0.0005 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "PfCo", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.9 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "PfDebt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-PF", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-PF", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
          trigger:
            - call: "GET /factoring/invoices/${inv_id}"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
          assert:
            - "Invoice.${inv_id}.accrued_fee_cents == 0 (0 days elapsed, floored); status == FUNDED; aging_bucket == CURRENT"

      - name: calc_aging_dpd30_boundary_stays_dpd_1_30
        claim_type: Correct Result
        grounds: [calculations.aging_bucket, entities.Invoice.fields.aging_bucket]
        distinguishing_aspect: "At dpd == 30 (clock 2026-06-30, due 2026-05-31) aging_bucket is DPD_1_30 (upper edge inclusive); the dpd==31 crossing is covered separately by §1.8 boundary instance."
        test_recipe:
          setup: ["invoice funded due 2026-05-31, clock advanced to 2026-06-30 (dpd 30), no collection"]
          setup_api_calls:
            - call: "POST /factoring/programs"
              payload: { name: "P-AG30" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "Ag30Co", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.9 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "Ag30Debt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
