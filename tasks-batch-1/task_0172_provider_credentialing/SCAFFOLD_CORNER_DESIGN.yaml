        claim_type: violation_to_error
        grounds: ["errors[ERR_PROVIDER_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / enrollment_submit_requires_provider_cleared
          rationale: "ERR_PROVIDER_NOT_CLEARED is asserted as the failure path of the named §1.8 instance."

      # NOTE: ERR_STALE_VERSION is exercised by the live §1.9 corner instance
      # `occ_finalize_stale_version_conflict` (section cross_cutting_complexity_layers),
      # so no separate errors-section entry is emitted for it.

      - name: error_credential_interval_overlap_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDENTIAL_INTERVAL_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / credential_item_interval_overlap_closed_closed
          rationale: "ERR_CREDENTIAL_INTERVAL_OVERLAP is the asserted failure of the named §1.8 instance."

