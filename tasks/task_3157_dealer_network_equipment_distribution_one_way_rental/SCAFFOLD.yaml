    path: "/rental-network/reservations/{id}"
    description: "Customer changes pickup/dropoff dates on a QUOTED reservation; recomputes the quoted snapshot and bumps version (the QUOTED-state mutation that makes confirm's OCC check meaningful)"
    roles: [Customer]
    code: 200
    input: ["pickup_date?", "dropoff_date?"]
    output: Reservation
    side_effects: ["season_of and quote_rated_price (quoted_variant) recomputed", "increments Reservation.version by 1"]
