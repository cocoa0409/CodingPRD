# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Survey & Market-Research Panel — EXPERT
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. 2 instances per rule (18 total). Every grounds: ref resolves into
# §1.1–§1.6; every setup_api_calls / trigger chain replays against §1.2/§1.4/§1.6.
#
# Recurring constants used in the literal asserts below (from §1.3):
#   incentive_accrual: LENGTH_BONUS_STEP_MIN=5, LENGTH_BONUS_POINTS_PER_STEP=10
#     base=100, estimated_minutes=10 -> length_bonus = ceil(10/5)*10 = 20
#     provisional_points = 100 + 20 = 120
#     finalize @ quality_score=100 -> multiplier 1.25 -> round_half_up(120*1.25)=150
#     finalize @ quality_score=50  -> multiplier 0.50 -> round_half_up(120*0.50)=60
#   quality_score weights: W_ATTENTION=0.5 W_SPEED=0.3 W_STRAIGHTLINE=0.2
#     est=10 -> speed window lo=10*60*0.34=204s, hi=10*60*3.0=1800s
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: incentive points (Participation/Panelist points domain) ---
      - name: incentive_provisional_vs_finalized_diverge_on_points
        grounds:
          - calculations.incentive_accrual
          - entities.Participation.fields.provisional_points
          - entities.IncentiveAccrual.fields.accrual_kind
          - entities.IncentiveAccrual.fields.status
          - state_machines.Participation.SCREENING_to_SCREENED_IN
          - state_machines.Participation.SCREENED_IN_to_QUALIFIED
        distinguishing_aspect: |
          The incentive_accrual calc operates on the points domain (Participation
          provisional vs finalized points); its PROVISIONAL variant is the raw
          base+length_bonus (120, HELD, excluded from points_balance) while the
          FINALIZED variant multiplies by quality_multiplier and credits (150 at
          quality_score=100). Same inputs, two variants, different point values.
        test_recipe:
          setup:
            - "A FIELDING Study (base_incentive_points=100, estimated_minutes=10, screener_min_age=0, required_consent_version=1) with one QuotaCell target_n=2."
            - "A panelist with an ACCEPTED consent at version 1, screened SCREENED_IN (provisional accrual HELD=120), then submitted with top quality so it QUALIFIES (finalized accrual CREDITED=150)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Brand Lift", irb_protocol_number: "IRB-708-A", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "F_18_34_CA", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "p1@x.com", full_name: "P One", age: 30, segment_key: "F_18_34_CA" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { prov_points: $.data.provisional_points }
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
          trigger:
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pnl_id}"
              captures: { qstatus: $.data.quality_status, sstatus: $.data.screening_status }
          assert:
            - "Participation.${part_id}.provisional_points == 120"
            - "Participation.${part_id}.quality_score == 100"
            - "Participation.${part_id}.quality_status == PASS"
            - "Participation.${part_id}.screening_status == QUALIFIED"
            - "The PROVISIONAL IncentiveAccrual for ${part_id} has accrual_kind==PROVISIONAL, points==120, status==CREDITED, points value finalized to 150 (i.e. the credited accrual reads points==150)"
            - "Panelist.${pnl_id}.points_balance == 150"

      # --- Instance 2: panel health (Panelist health domain) ---
      - name: health_rolling_vs_lifetime_diverge_on_window
        grounds:
          - calculations.panel_health_score
          - entities.Panelist.fields.health_score
          - entities.Panelist.fields.lifetime_invited_n
          - entities.Panelist.fields.lifetime_completed_n
        distinguishing_aspect: |
          The panel_health_score calc operates on the panel-health domain (a
          different entity domain than incentive points); its rolling variant uses
          only the most recent RECENT_WINDOW=5 participations as denominator while
          the lifetime variant uses every participation ever. With 6 invited where
          the oldest 1 completed and the recent 5 all incomplete, rolling base=0
          but lifetime base=round(1/6*100)=17 — same panelist, two different scores.
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell of ample target_n and screener_min_age=0."
            - "A panelist with 6 participations created in chronological order: the OLDEST was completed (lifetime_completed_n>=1), the 5 most recent are NOT_STARTED, so the rolling window of the latest 5 contains zero completions while lifetime contains one."
            - "Clock left at default 2026-03-01T00:00:00Z so inactivity_penalty is 0 (last_activity_at == now)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Health Window", irb_protocol_number: "IRB-708-H", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_H", target_n: 10 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "ph@x.com", full_name: "P Health", age: 40, segment_key: "SEG_H" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part0_id: $.data.id }
            - call: "POST /participations/${part0_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part0_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations/${part0_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
          trigger:
            - call: "GET /panelists/${pnl_id}/health"
              payload: {}
              as: PanelOps
              captures: { rolling: $.data.health_score, lifetime: $.data.lifetime_health_score }
          assert:
            - "data.health_score == 0   (rolling: most recent 5 participations have 0 completions => base 0/5*100=0, no inactivity penalty)"
            - "data.lifetime_health_score == 17   (lifetime: 1 completed / 6 invited * 100 = 16.67, round_half_up = 17)"
            - "data.health_score != data.lifetime_health_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1: mode (a) non-linear weighted_scoring with >=3 inputs ---
      - name: quality_score_three_input_nonlinear_weighting
        grounds:
          - calculations.quality_score
          - entities.Participation.fields.quality_score
          - entities.AttentionCheck.fields.passed
          - entities.Participation.fields.completion_seconds
          - entities.Participation.fields.straightline_run
        distinguishing_aspect: |
          Mode (a): quality_score combines THREE inputs (attention_pass_pct,
          speed_score with its conditional too-fast/too-slow branches, and
          straightline_score) under fixed weights 0.5/0.3/0.2 — a non-linear
          interaction because speed_score is a branch on completion_seconds vs
          the est-derived window. With 1/2 checks passed, completion 100s (< lo
          204 => speed 0), straightline_run=5 (ss=80): 0.5*50+0.3*0+0.2*80=41.
        test_recipe:
          setup:
            - "A FIELDING Study (estimated_minutes=10, base=100, screener_min_age=0). A SCREENED_IN participation with two AttentionChecks, one passed one failed (1/2)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Quality Combo", irb_protocol_number: "IRB-708-Q", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_Q", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pq@x.com", full_name: "P Q", age: 30, segment_key: "SEG_Q" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/attention-checks"
              payload: { check_kind: "TRAP_QUESTION", passed: true }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/attention-checks"
              payload: { check_kind: "INSTRUCTED_RESPONSE", passed: false }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
          trigger:
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 100, straightline_run: 5 }
              as: Panelist
              as_user_id: "${pnl_id}"
              captures: { qscore: $.data.quality_score, qstatus: $.data.quality_status }
          assert:
            - "Participation.${part_id}.quality_score == 41   (0.5*50 + 0.3*0 + 0.2*80 = 25+0+16 = 41)"
            - "Participation.${part_id}.quality_status == FAIL   (41 < 50)"
            - "Participation.${part_id}.screening_status == SCREENED_OUT   (FAIL releases the seat)"

      # --- Instance 2: mode (c) circular-looking pinned evaluation order ---
      - name: points_balance_pinned_order_requested_excluded
        grounds:
          - calculations.points_balance
          - entities.Panelist.fields.points_balance
          - entities.PayoutRequest.fields.status
          - state_machines.PayoutRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c): points_balance has a circular-looking dependency (a payout's
          consumption depends on its own status, which depends on an approval that
          itself reads the balance) resolved by a PINNED order — credited_points
          and consumed_points are each summed over CURRENT row states before the
          subtraction, and consumption counts ONLY at APPROVED/PAID, never at
          REQUESTED. So a REQUESTED payout leaves the balance available to a
          competing request; only after approval does it subtract.
        test_recipe:
          setup:
            - "A panelist with points_balance 150 from one QUALIFIED participation (finalized CREDITED accrual=150)."
            - "Two payout requests created while balance=150: req A for 100 points, req B for 100 points. Both REQUESTED (neither subtracts yet)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Balance Order", irb_protocol_number: "IRB-708-B", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_B", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pb@x.com", full_name: "P B", age: 30, segment_key: "SEG_B" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "GET /panelists/${pnl_id}"
              payload: {}
              as: PanelOps
              captures: { v_after_finalize: $.data.version }
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pnl_id}", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v_after_finalize}" }
              as: PanelOps
              captures: { reqA_id: $.data.id }
            - call: "GET /panelists/${pnl_id}"
              payload: {}
              as: PanelOps
              captures: { v_after_reqA: $.data.version }
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pnl_id}", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v_after_reqA}" }
              as: PanelOps
              captures: { reqB_id: $.data.id }
          trigger:
            - call: "POST /payout-requests/${reqA_id}/approve"
              payload: {}
              as: PanelOps
            - call: "POST /payout-requests/${reqB_id}/approve"
              payload: {}
              as: PanelOps
              captures: { approveB_err: $.data.error_id }
          assert:
            - "Before any approval Panelist.${pnl_id}.points_balance == 150 (both REQUESTED payouts of 100 do NOT reduce the balance; REQUESTED is excluded from consumed_points)"
            - "Approving reqA succeeds: Panelist.${pnl_id}.points_balance == 50 (150 credited - 100 consumed at APPROVED)"
            - "Approving reqB fails with ERR_INSUFFICIENT_POINTS (412->422): balance 50 < 100; the pinned order means consumption is counted only once a payout reaches APPROVED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Instance 1: Participation cyclic re-screen loop ---
      - name: participation_rescreen_cycle_screened_out_to_screening
        grounds:
          - state_machines.Participation.SCREENING_to_SCREENED_OUT
          - state_machines.Participation.SCREENED_OUT_to_SCREENING
          - entities.Participation.fields.rescreen_count
          - entities.Participation.fields.screening_status
        distinguishing_aspect: |
          Participation's screening_status axis is cyclic: SCREENING->SCREENED_OUT
          then SCREENED_OUT->SCREENING (rescreen) forms a revision loop, and
          rescreen_count increments by 1 on each loop — a non-linear shape on the
          Participation entity (distinct from Rule-3 instance 2's Panelist cycle).
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell (target_n=1) and a SCREENING participation that has been screened OUT once."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Cycle", irb_protocol_number: "IRB-708-C", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_C", target_n: 1 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pc@x.com", full_name: "P C", age: 30, segment_key: "SEG_C" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "OUT" }
              as: FieldCoordinator
          trigger:
            - call: "POST /participations/${part_id}/rescreen"
              payload: {}
              as: FieldCoordinator
              captures: { sstatus: $.data.screening_status, rcount: $.data.rescreen_count }
          assert:
            - "Participation.${part_id}.screening_status == SCREENING   (loop back from SCREENED_OUT)"
            - "Participation.${part_id}.rescreen_count == 1   (incremented by the cyclic transition)"
            - "QuotaCell.${cell_id}.reserved_n == 1 and available_n == 0   (seat re-reserved on the loop)"

      # --- Instance 2: Panelist ACTIVE<->AT_RISK health cycle ---
      - name: panelist_active_at_risk_health_cycle
        grounds:
          - state_machines.Panelist.ACTIVE_to_AT_RISK
          - state_machines.Panelist.AT_RISK_to_ACTIVE
          - entities.Panelist.fields.status
          - entities.Panelist.fields.health_score
          - calculations.panel_health_score
        distinguishing_aspect: |
          The Panelist status axis is cyclic on a DIFFERENT entity than Rule-3
          instance 1: ACTIVE->AT_RISK fires when health_score < CHURN_THRESHOLD=50
          and AT_RISK->ACTIVE fires back when health_score >= 50 on recompute — a
          health-driven loop, not a one-way pipeline.
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell (target_n=10), and a panelist driven AT_RISK by completing only 2 of 5 most-recent participations (rolling health=40 < 50)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Risk Cycle", irb_protocol_number: "IRB-708-R", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_R", target_n: 10 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pr@x.com", full_name: "P R", age: 30, segment_key: "SEG_R" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { pA: $.data.id }
            - call: "POST /participations/${pA}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${pA}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations/${pA}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { pB: $.data.id }
            - call: "POST /participations/${pB}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${pB}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations/${pB}/submit"
              payload: { completion_seconds: 600, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pnl_id}"
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
          trigger:
            - call: "GET /panelists/${pnl_id}"
              payload: {}
              as: PanelOps
              captures: { st: $.data.status, hs: $.data.health_score }
          assert:
            - "Panelist.${pnl_id}.health_score == 40   (rolling window of 5 most recent: 2 completed/5 invited *100 = 40, no inactivity penalty at default clock)"
            - "Panelist.${pnl_id}.status == AT_RISK   (system transition ACTIVE->AT_RISK because health_score 40 < CHURN_THRESHOLD 50)"
            - "Completing 2 more of the recent window (health back to >=50) would system-transition AT_RISK->ACTIVE, closing the cycle"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # --- Instance 1: depth>=3, trigger = Study close ---
      - name: study_close_cascade_void_release_voidaccrual
        grounds:
          - state_machines.Study.FIELDING_to_CLOSED
          - state_machines.Participation.SCREENING_to_VOIDED
          - calculations.quota_fill
          - entities.QuotaCell.fields.reserved_n
          - entities.IncentiveAccrual.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by Study close: closing the Study mutates each
          SCREENING/SCREENED_IN Participation to VOIDED (link 1); each VOIDED
          participation's transition releases its QuotaCell seat so reserved_n is
          recomputed downward (link 2); and the same VOIDED transition flips its
          HELD PROVISIONAL IncentiveAccrual to VOID (link 3). Each hop is caused by
          the prior hop, not by the close call directly.
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell (target_n=2) and one SCREENED_IN participation holding a reserved seat and a HELD PROVISIONAL accrual."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Close Cascade", irb_protocol_number: "IRB-708-CC", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_CC", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pcc@x.com", full_name: "P CC", age: 30, segment_key: "SEG_CC" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
          trigger:
            - call: "POST /studies/${study_id}/close"
              payload: {}
              as: ResearchManager
              captures: { sstat: $.data.status }
          assert:
            - "Study.${study_id}.status == CLOSED"
            - "Participation.${part_id}.screening_status == VOIDED   (cascade link 1)"
            - "QuotaCell.${cell_id}.reserved_n == 0 and available_n == 2   (cascade link 2: seat released)"
            - "The PROVISIONAL IncentiveAccrual for ${part_id} has status == VOID   (cascade link 3)"
            - "Panelist.${pnl_id}.points_balance == 0   (no CREDITED accrual; HELD->VOID never counted)"

      # --- Instance 2: depth>=2, different trigger = Panelist suspend ---
      - name: panelist_suspend_cascade_void_release
        grounds:
          - state_machines.Panelist.ACTIVE_to_SUSPENDED
          - state_machines.Participation.SCREENING_to_VOIDED
          - calculations.quota_fill
          - entities.QuotaCell.fields.reserved_n
          - entities.IncentiveAccrual.fields.status
        distinguishing_aspect: |
          Depth-2 cascade triggered by Panelist suspend (a DIFFERENT triggering
          transition than Study close): suspending the panelist mutates their
          SCREENING/SCREENED_IN Participations to VOIDED (link 1); each VOIDED
          transition releases the QuotaCell seat (link 2, reserved_n recomputed).
          Same propagation family, distinct origin transition.
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell (target_n=2) and one SCREENING participation holding a reserved seat, owned by an ACTIVE panelist."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Suspend Cascade", irb_protocol_number: "IRB-708-SC", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_SC", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "psc@x.com", full_name: "P SC", age: 30, segment_key: "SEG_SC" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /panelists/${pnl_id}/suspend"
              payload: {}
              as: PanelOps
              captures: { pst: $.data.status }
          assert:
            - "Panelist.${pnl_id}.status == SUSPENDED"
            - "Participation.${part_id}.screening_status == VOIDED   (cascade link 1)"
            - "QuotaCell.${cell_id}.reserved_n == 0 and available_n == 2   (cascade link 2: seat released)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- Instance 1: business_safety (consent p6) vs business_constraint (age p7) ---
      - name: consent_beats_age_on_screen
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CONSENT_REQUIRED]
          - errors[ERR_SCREENER_AGE_FAIL]
        distinguishing_aspect: |
          Dual-failure on POST /participations/{id}/screen where BOTH the consent
          check (priority 6, category business_safety) and the age check (priority
          7, category business_constraint) fail: the lower priority number wins, so
          ERR_CONSENT_REQUIRED is returned, NOT ERR_SCREENER_AGE_FAIL. Category pair
          = business_safety vs business_constraint.
        test_recipe:
          setup:
            - "A FIELDING Study with screener_min_age=21 and required_consent_version=1, one QuotaCell with a free seat."
            - "A panelist aged 18 (fails age) with NO ACCEPTED consent (fails consent), a SCREENING participation."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Pair1", irb_protocol_number: "IRB-708-P1", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 21, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_P1", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pp1@x.com", full_name: "P P1", age: 18, segment_key: "SEG_P1" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_CONSENT_REQUIRED   (priority 6 beats priority 7; age failure is NOT surfaced)"
            - "Participation.${part_id}.screening_status == SCREENING   (no transition occurred)"

      # --- Instance 2: state (p5) vs business_fiscal (p14) on approve ---
      - name: invalid_state_beats_insufficient_points_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_POINTS]
          - state_machines.PayoutRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Dual-failure on POST /payout-requests/{id}/approve where the request is
          already terminal (REJECTED, so the state check at priority 5 fails) AND
          the panelist has insufficient points (priority 14, business_fiscal):
          ERR_INVALID_STATE wins over ERR_INSUFFICIENT_POINTS. Category pair =
          state vs business_fiscal — distinct from instance 1's pair.
        test_recipe:
          setup:
            - "A panelist with points_balance 0 and a payout request that has been REJECTED (terminal)."
          setup_api_calls:
            - call: "POST /panelists"
              payload: { email: "pp2@x.com", full_name: "P P2", age: 30, segment_key: "SEG_P2" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "GET /panelists/${pnl_id}"
              payload: {}
              as: PanelOps
              captures: { v0: $.data.version }
            - call: "POST /payout-requests"
              payload: { panelist_id: "${pnl_id}", payout_method: "CASH", points_requested: 100, expected_panelist_version: "${v0}" }
              as: PanelOps
              captures: { req_id: $.data.id }
            - call: "POST /payout-requests/${req_id}/reject"
              payload: {}
              as: PanelOps
          trigger:
            - call: "POST /payout-requests/${req_id}/approve"
              payload: {}
              as: PanelOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_INVALID_STATE   (priority 5 state check beats priority 14 fiscal check; the points-insufficiency is never reached)"
            - "PayoutRequest.${req_id}.status == REJECTED   (unchanged)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # --- Instance 1: quality_score tier boundary at exactly 70 (PASS) on /submit ---
      - name: quality_pass_boundary_exact_70_vs_69
        grounds:
          - calculations.quality_score
          - entities.Participation.fields.quality_status
          - entities.Participation.fields.quality_score
        distinguishing_aspect: |
          Boundary on the quality_score metric reached via POST /submit: a score of
          exactly 70 is PASS (>= QUALITY_PASS_THRESHOLD 70) while 69 is FLAGGED. The
          two cases are produced by a one-unit straightline change (run=0 => ss=100
          => score 70; run=1 => ss=96 => score 69), pinning the >= boundary. This
          metric/endpoint differs from instance 2's quota count metric.
        test_recipe:
          setup:
            - "A FIELDING Study (estimated_minutes=10, base=100, screener_min_age=0). Two SCREENED_IN participations, each with two attention checks both passed (2/2), completion 100s (< lo 204 => speed_score 0)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "Boundary70", irb_protocol_number: "IRB-708-B70", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_B70", target_n: 5 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pb70@x.com", full_name: "P B70", age: 30, segment_key: "SEG_B70" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { partP: $.data.id }
            - call: "POST /participations/${partP}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${partP}/attention-checks"
              payload: { check_kind: "TRAP_QUESTION", passed: true }
              as: FieldCoordinator
            - call: "POST /participations/${partP}/attention-checks"
              payload: { check_kind: "INSTRUCTED_RESPONSE", passed: true }
              as: FieldCoordinator
            - call: "POST /participations/${partP}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
          trigger:
            - call: "POST /participations/${partP}/submit"
              payload: { completion_seconds: 100, straightline_run: 0 }
              as: Panelist
              as_user_id: "${pnl_id}"
              captures: { qscore: $.data.quality_score, qstatus: $.data.quality_status }
          assert:
            - "Participation.${partP}.quality_score == 70   (0.5*100 + 0.3*0 + 0.2*100 = 50+0+20 = 70)"
            - "Participation.${partP}.quality_status == PASS   (70 >= QUALITY_PASS_THRESHOLD; a run=1 sibling scoring 69 would be FLAGGED, proving the >= boundary)"
            - "Participation.${partP}.screening_status == QUALIFIED   (PASS commits the seat)"

      # --- Instance 2: quota available_n last-seat boundary on /screen ---
      - name: quota_last_seat_boundary_one_vs_zero
        grounds:
          - calculations.quota_fill
          - entities.QuotaCell.fields.available_n
          - validations[priority=11]
          - errors[ERR_QUOTA_CELL_FULL]
          - state_machines.Participation.SCREENING_to_SCREENED_IN
        distinguishing_aspect: |
          Boundary on the QuotaCell available_n COUNT metric reached via POST
          /participations/{id}/screen: with target_n=1, the first screen-in finds
          available_n == 1 (>= 1) and succeeds, leaving available_n == 0; a second
          participation's screen-in finds available_n == 0 (< 1) and is rejected
          with ERR_QUOTA_CELL_FULL. Different metric (integer seat count, not a
          weighted score) and different endpoint than instance 1.
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell target_n=1, screener_min_age=0. Two participations on that single-seat cell, the first already SCREENED_IN (consuming the only seat)."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "LastSeat", irb_protocol_number: "IRB-708-LS", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_LS", target_n: 1 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "ls1@x.com", full_name: "LS One", age: 30, segment_key: "SEG_LS" }
              as: PanelOps
              captures: { pnlA: $.data.id }
            - call: "POST /panelists"
              payload: { email: "ls2@x.com", full_name: "LS Two", age: 30, segment_key: "SEG_LS" }
              as: PanelOps
              captures: { pnlB: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnlA}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /consents"
              payload: { panelist_id: "${pnlB}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnlA}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { partA: $.data.id }
            - call: "POST /participations/${partA}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnlB}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { partB: $.data.id }
          trigger:
            - call: "POST /participations/${partB}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "After partA screen-in: QuotaCell.${cell_id}.reserved_n == 1, available_n == 0 (the last seat is consumed at exactly available_n==1)"
            - "HTTP 409 on partB screen-in"
            - "data.error_id == ERR_QUOTA_CELL_FULL   (available_n 0 < 1)"
            - "Participation.${partB}.screening_status == SCREENING   (no transition; participation creation reserved a seat but the cell is over target, screen-in rejected)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # --- Instance 1: Participation screen-in depends on Study.status ---
      - name: screen_in_requires_study_fielding
        grounds:
          - state_machines.Participation.SCREENING_to_SCREENED_IN
          - state_machines.Study.FIELDING_to_PAUSED
          - errors[ERR_STUDY_NOT_FIELDING]
          - entities.Study.fields.status
        distinguishing_aspect: |
          Participation's SCREENING->SCREENED_IN transition is guarded by the
          PARENT Study's state: it requires Study.status == FIELDING. With the
          Study PAUSED, screen-in is rejected with ERR_STUDY_NOT_FIELDING. Entity
          pair = Participation -> Study.
        test_recipe:
          setup:
            - "A Study launched then PAUSED, with one QuotaCell (free seat), a panelist with ACCEPTED consent and a SCREENING participation."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "CrossStudy", irb_protocol_number: "IRB-708-X1", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_X1", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "px1@x.com", full_name: "P X1", age: 30, segment_key: "SEG_X1" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /studies/${study_id}/pause"
              payload: {}
              as: ResearchManager
          trigger:
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_STUDY_NOT_FIELDING   (parent Study is PAUSED, not FIELDING)"
            - "Participation.${part_id}.screening_status == SCREENING   (transition blocked by parent state)"

      # --- Instance 2: FocusGroupBooking mark_attended depends on FocusGroup.status ---
      - name: mark_attended_requires_focus_group_completed
        grounds:
          - state_machines.FocusGroupBooking.CONFIRMED_to_ATTENDED
          - state_machines.FocusGroup.SCHEDULED_to_COMPLETED
          - entities.FocusGroup.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A FocusGroupBooking's CONFIRMED->ATTENDED transition is guarded by the
          PARENT FocusGroup's state: it requires FocusGroup.status == COMPLETED.
          While the session is still SCHEDULED, mark_attended is rejected with
          ERR_INVALID_STATE. Entity pair = FocusGroupBooking -> FocusGroup, a
          different pair than instance 1's Participation->Study.
        test_recipe:
          setup:
            - "A SCHEDULED FocusGroup on an AVAILABLE facility, with one CONFIRMED booking; the session has NOT been completed."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "FGStudy", irb_protocol_number: "IRB-708-X2", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Room A", capacity: 10 }
              as: FieldCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /focus-groups"
              payload: { study_id: "${study_id}", facility_id: "${fac_id}", starts_at: "2026-04-01T10:00:00Z", ends_at: "2026-04-01T11:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { fg_id: $.data.id, fg_v0: $.data.version }
            - call: "POST /panelists"
              payload: { email: "px2@x.com", full_name: "P X2", age: 30, segment_key: "SEG_X2" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fg_id}", panelist_id: "${pnl_id}", expected_focus_group_version: "${fg_v0}" }
              as: FieldCoordinator
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /focus-group-bookings/${bk_id}/mark_attended"
              payload: {}
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_INVALID_STATE   (parent FocusGroup is SCHEDULED, not COMPLETED)"
            - "FocusGroupBooking.${bk_id}.status == CONFIRMED   (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- Instance 1: Facility double-booking WITH turnaround buffer ---
      - name: facility_double_booked_with_turnaround_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_FACILITY_DOUBLE_BOOKED]
          - entities.Facility.fields.turnaround_minutes
          - entities.FocusGroup.fields.starts_at
          - entities.FocusGroup.fields.ends_at
        distinguishing_aspect: |
          Overlap on the Facility resource where the interval [starts_at, ends_at)
          is EXTENDED by the facility's turnaround_minutes buffer before the clash
          test. FG1 10:00-11:00 with turnaround=30 blocks the room until 11:30, so
          FG2 11:15-12:00 collides on the buffer and is rejected. Interval
          semantics = buffered. (Instance 2 uses unbuffered half-open semantics.)
        test_recipe:
          setup:
            - "A facility with turnaround_minutes=30 and one SCHEDULED FocusGroup 2026-04-01T10:00:00Z..11:00:00Z."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "TempA", irb_protocol_number: "IRB-708-T1", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Buffer Room", capacity: 10, turnaround_minutes: 30 }
              as: FieldCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /focus-groups"
              payload: { study_id: "${study_id}", facility_id: "${fac_id}", starts_at: "2026-04-01T10:00:00Z", ends_at: "2026-04-01T11:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { fg1_id: $.data.id }
          trigger:
            - call: "POST /focus-groups"
              payload: { study_id: "${study_id}", facility_id: "${fac_id}", starts_at: "2026-04-01T11:15:00Z", ends_at: "2026-04-01T12:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_FACILITY_DOUBLE_BOOKED   (11:15 falls inside FG1's 11:00-11:30 turnaround buffer)"
            - "A second FocusGroup starting at exactly 2026-04-01T11:30:00Z (buffer end) on the same facility would instead succeed (201), confirming the buffered boundary"

      # --- Instance 2: Panelist schedule conflict, NO buffer, half-open ---
      - name: panelist_schedule_conflict_no_buffer_halfopen
        grounds:
          - validations[priority=9]
          - errors[ERR_PANELIST_SCHEDULE_CONFLICT]
          - entities.FocusGroupBooking.fields.status
          - entities.FocusGroup.fields.starts_at
          - entities.FocusGroup.fields.ends_at
        distinguishing_aspect: |
          Overlap on the Panelist resource across two SCHEDULED sessions on
          DIFFERENT facilities, using UNBUFFERED half-open [starts_at, ends_at)
          arithmetic (no turnaround). Session A 14:00-15:00 and Session B
          14:30-15:30 overlap, so the panelist's second booking is rejected; a
          session starting exactly at 15:00 would NOT conflict (half-open). Distinct
          interval semantics (no buffer) and distinct resource (Panelist) from
          instance 1.
        test_recipe:
          setup:
            - "Two SCHEDULED FocusGroups on two different facilities: A 2026-04-02T14:00:00Z..15:00:00Z and B 2026-04-02T14:30:00Z..15:30:00Z. A panelist already CONFIRMED on session A."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "TempB", irb_protocol_number: "IRB-708-T2", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Room P1", capacity: 10 }
              as: FieldCoordinator
              captures: { facA: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Room P2", capacity: 10 }
              as: FieldCoordinator
              captures: { facB: $.data.id }
            - call: "POST /focus-groups"
              payload: { study_id: "${study_id}", facility_id: "${facA}", starts_at: "2026-04-02T14:00:00Z", ends_at: "2026-04-02T15:00:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { fgA: $.data.id, fgA_v0: $.data.version }
            - call: "POST /focus-groups"
              payload: { study_id: "${study_id}", facility_id: "${facB}", starts_at: "2026-04-02T14:30:00Z", ends_at: "2026-04-02T15:30:00Z", seats: 5 }
              as: FieldCoordinator
              captures: { fgB: $.data.id, fgB_v0: $.data.version }
            - call: "POST /panelists"
              payload: { email: "pt2@x.com", full_name: "P T2", age: 30, segment_key: "SEG_T2" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fgA}", panelist_id: "${pnl_id}", expected_focus_group_version: "${fgA_v0}" }
              as: FieldCoordinator
              captures: { bkA: $.data.id }
          trigger:
            - call: "POST /focus-group-bookings"
              payload: { focus_group_id: "${fgB}", panelist_id: "${pnl_id}", expected_focus_group_version: "${fgB_v0}" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_PANELIST_SCHEDULE_CONFLICT   (sessions A 14:00-15:00 and B 14:30-15:30 overlap; no turnaround buffer involved)"
            - "A session B' starting at exactly 2026-04-02T15:00:00Z would NOT conflict (half-open, end-exclusive), confirming the unbuffered semantics"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Instance 1: quota seat conservation (seats conserved quantity) ---
      - name: seat_reserve_then_release_conserves_available_n
        grounds:
          - state_machines.Participation.SCREENING_to_SCREENED_IN
          - state_machines.Participation.SCREENED_IN_to_SCREENED_OUT
          - calculations.quota_fill
          - entities.QuotaCell.fields.available_n
          - entities.QuotaCell.fields.reserved_n
        distinguishing_aspect: |
          Conserved quantity = QuotaCell seats. The forward action (screen-in
          reserves a seat: available_n target_n-1) paired with its compensating
          action (the FAIL submit transition SCREENED_IN->SCREENED_OUT releases the
          seat) MUST leave available_n back at its original value with zero drift:
          invariant reserved_n + committed_n == 0 and available_n == target_n after
          the round trip.
        test_recipe:
          setup:
            - "A FIELDING Study with one QuotaCell target_n=2, a SCREENED_IN participation (seat reserved), with two attention checks both FAILED so the submit scores below 50 (FAIL) and releases the seat."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "SeatInv", irb_protocol_number: "IRB-708-I1", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_I1", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pi1@x.com", full_name: "P I1", age: 30, segment_key: "SEG_I1" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/attention-checks"
              payload: { check_kind: "TRAP_QUESTION", passed: false }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/attention-checks"
              payload: { check_kind: "INSTRUCTED_RESPONSE", passed: false }
              as: FieldCoordinator
            - call: "POST /participations/${part_id}/start"
              payload: {}
              as: Panelist
              as_user_id: "${pnl_id}"
          trigger:
            - call: "POST /participations/${part_id}/submit"
              payload: { completion_seconds: 100, straightline_run: 10 }
              as: Panelist
              as_user_id: "${pnl_id}"
              captures: { sstatus: $.data.screening_status, qstatus: $.data.quality_status }
          assert:
            - "Participation.${part_id}.quality_score == 12   (0.5*0 + 0.3*0 + 0.2*60 = 12; attention 0/2=0, completion 100s<204 speed 0, straightline_run 10 => ss=max(0,100-40)=60)"
            - "Participation.${part_id}.quality_status == FAIL and screening_status == SCREENED_OUT"
            - "QuotaCell.${cell_id}.reserved_n == 0, committed_n == 0, available_n == 2   (seat conserved: returns to target_n after reserve+release round trip, zero drift)"

      # --- Instance 2: points conservation (points_balance conserved quantity) ---
      - name: provisional_then_void_conserves_points_balance
        grounds:
          - state_machines.Participation.SCREENING_to_SCREENED_IN
          - state_machines.Participation.SCREENED_IN_to_VOIDED
          - calculations.incentive_accrual
          - calculations.points_balance
          - entities.IncentiveAccrual.fields.status
          - entities.Panelist.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity = Panelist points_balance (a DIFFERENT conserved
          quantity than seats). The forward action (screen-in creates a HELD
          PROVISIONAL accrual of 120) paired with its compensating action (the
          VOID transition flips that HELD accrual to VOID) MUST leave points_balance
          unchanged at 0 — because HELD never counts toward the balance and VOID
          credits nothing. Invariant: points_balance == 0 with no drift across the
          reserve+void round trip.
        test_recipe:
          setup:
            - "A FIELDING Study (base=100, estimated_minutes=10) with one QuotaCell target_n=2 and a SCREENED_IN participation that has a HELD PROVISIONAL accrual of 120; the parent study is then closed to void it."
          setup_api_calls:
            - call: "POST /studies"
              payload: { title: "PointsInv", irb_protocol_number: "IRB-708-I2", estimated_minutes: 10, base_incentive_points: 100, screener_min_age: 0, required_consent_version: 1 }
              as: ResearchManager
              captures: { study_id: $.data.id }
            - call: "POST /studies/${study_id}/quota-cells"
              payload: { segment_key: "SEG_I2", target_n: 2 }
              as: ResearchManager
              captures: { cell_id: $.data.id }
            - call: "POST /studies/${study_id}/launch"
              payload: {}
              as: ResearchManager
            - call: "POST /panelists"
              payload: { email: "pi2@x.com", full_name: "P I2", age: 30, segment_key: "SEG_I2" }
              as: PanelOps
              captures: { pnl_id: $.data.id }
            - call: "POST /consents"
              payload: { panelist_id: "${pnl_id}", study_id: "${study_id}", consent_version: 1, decision: "ACCEPTED" }
              as: PanelOps
            - call: "POST /participations"
              payload: { study_id: "${study_id}", panelist_id: "${pnl_id}", quota_cell_id: "${cell_id}" }
              as: FieldCoordinator
              captures: { part_id: $.data.id }
            - call: "POST /participations/${part_id}/screen"
              payload: { outcome: "IN" }
              as: FieldCoordinator
              captures: { prov: $.data.provisional_points }
          trigger:
            - call: "POST /studies/${study_id}/close"
              payload: {}
              as: ResearchManager
          assert:
            - "Participation.${part_id}.provisional_points == 120 while SCREENED_IN (a HELD PROVISIONAL accrual of 120 exists but does NOT count toward points_balance)"
            - "Panelist.${pnl_id}.points_balance == 0 BEFORE close (HELD excluded)"
            - "After close: Participation.${part_id}.screening_status == VOIDED and the PROVISIONAL accrual status == VOID"
            - "Panelist.${pnl_id}.points_balance == 0 AFTER close   (points conserved: reserve+void leaves the balance at 0, zero drift)"
