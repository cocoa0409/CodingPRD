# =============================================================================
# PRD Benchmark Scaffold — Digital Curriculum Rostering & Single Sign-On
# District educational-technology operations
# =============================================================================

scenario: |
  2748. Digital Curriculum Rostering & Single Sign-On (district educational technology operations): source-of-truth roster extraction with school, section, teacher and student mappings, rostering standard selection and per-vendor transformation rules, mid-year schedule change propagation with add/drop timing, license entitlement enforcement by seat count and building allocation, single sign-on identity provisioning, password policy and deprovisioning on withdrawal, error queue triage for unmatched teachers and duplicate students, usage analytics for renewal decisions, summer rollover and archived-class access

domain_name: digital-curriculum-rostering-sso
api_prefix: "/rostering"

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - soft_delete_archival

  entity_topology: graph
  # Enrollment is a Student x Section junction; AppAccount is a
  # (BuildingAllocation x {Student|Teacher}) junction with a polymorphic subject;
  # Student.duplicate_of_student_id is self-referential; BuildingAllocation is a
  # VendorApp x School junction. No URL nesting for junctions — flat peer paths
  # with FK filters.

  state_machine_shape: parallel
  # AppAccount carries two independent axes (seat_status x identity_status) that
  # advance on different triggers; SyncRun adds a TRANSFORMED -> HELD ->
  # TRANSFORMED cycle; ErrorQueueItem forks OPEN -> {RESOLVED_MATCHED,
  # RESOLVED_MERGED, DISMISSED} with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The DataGovernanceOfficer who publishes a SyncRun must not be the operator
  # whose X-User-ID initiated (extracted) it.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- School ---
  - name: School
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: building display name
        constraints: "1..120 chars"
      - name: sis_school_id
        type: string
        source: input
        description: source-of-truth identifier for this building in the SIS extract
        constraints: "unique across all School rows; 1..32 chars"
      - name: building_code
        type: string
        source: input
        description: district building code used in vendor transformation output
        constraints: "unique across all School rows; 1..16 chars"
      - name: grade_band
        type: enum
        source: input
        description: grade band of the building; matched against VendorApp.grade_band_scope
        constraints: "one of ELEMENTARY, MIDDLE, HIGH"
      - name: status
        type: enum
        source: system
        description: building lifecycle; CLOSED buildings are excluded from allocation candidate sets
        default: ACTIVE
        constraints: "one of ACTIVE, CLOSED; set to ACTIVE at creation, never mutated by any declared endpoint"
      - name: min_password_length
        type: integer
        source: input
        description: building password policy — minimum characters for AppAccount passwords
        default: 8
        constraints: "6..64"
      - name: password_requires_mixed_case
        type: boolean
        source: input
        description: building password policy — require at least one upper and one lower case letter
        default: true
      - name: password_max_age_days
        type: integer
        source: input
        description: building password policy — lifetime of a USER_SET password in days
        default: 180
        constraints: "30..365"
      - name: password_lockout_threshold
        type: integer
        source: input
        description: building password policy — cumulative failed logins at which password_state becomes LOCKED
        default: 5
        constraints: "3..20"
      - name: temp_password_ttl_hours
        type: integer
        source: input
        description: building password policy — lifetime of the TEMP_SET password minted at provisioning
        default: 72
        constraints: "1..336"
      - name: enrolled_student_count
        type: integer
        source: computed
        description: "count of Student rows with school_id == this.id AND enrollment_state == ENROLLED; recomputed on student create/withdraw/merge"
        default: 0

  # ------------------------------------------------------------------ Term ---
  - name: Term
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: term display name (e.g. "2026-2027 Full Year")
      - name: school_year
        type: integer
        source: input
        description: starting calendar year of the school year
        constraints: "2000..2100"
      - name: start_date
        type: string
        source: input
        description: first instructional day, ISO date (YYYY-MM-DD)
      - name: end_date
        type: string
        source: input
        description: last instructional day, ISO date; must be strictly after start_date
      - name: add_drop_cutoff_date
        type: string
        source: input
        description: last date on which an add or drop is treated as IN_WINDOW; ISO date within [start_date, end_date]
      - name: instructional_days
        type: integer
        source: input
        description: total instructional days in the term, used as the proration denominator reference
        constraints: "1..250"
      - name: archive_retention_days
        type: integer
        source: input
        description: days after end_date during which archived-class reads remain permitted
        default: 90
        constraints: "0..730"
      - name: state
        type: enum
        source: system
        description: term lifecycle
        default: PLANNED
        constraints: "one of PLANNED, ACTIVE, ROLLED_OVER"
      - name: archived_access_expires_at
        type: datetime
        source: computed
        description: "computed at rollover as (end_date + archive_retention_days) at 00:00:00.000Z; null while state != ROLLED_OVER"

  # --------------------------------------------------------------- Teacher ---
  - name: Teacher
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the building that employs this teacher"
      - name: sis_staff_id
        type: string
        source: input
        description: source-of-truth staff identifier from the SIS extract
        constraints: "unique across all Teacher rows"
      - name: full_name
        type: string
        source: input
        description: teacher name as delivered by the SIS
      - name: email
        type: string
        source: input
        description: district email address; local part feeds the EMAIL_LOCALPART identifier strategy
        constraints: "must contain exactly one '@'"
      - name: employment_status
        type: enum
        source: system
        description: employment lifecycle
        default: ACTIVE
        constraints: "one of ACTIVE, SEPARATED"
      - name: separation_effective_date
        type: string
        source: system
        description: ISO date supplied to the separate transition; null while ACTIVE

  # --------------------------------------------------------------- Student ---
  - name: Student
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; the building of record for this student"
      - name: sis_student_id
        type: string
        source: input
        description: source-of-truth student identifier from the SIS extract
        constraints: "unique across all Student rows"
      - name: first_name
        type: string
        source: input
        description: given name
      - name: last_name
        type: string
        source: input
        description: family name; feeds the STATE_ID username transformation
      - name: grade_level
        type: integer
        source: input
        description: grade level (0 == kindergarten)
        constraints: "0..12"
      - name: date_of_birth
        type: string
        source: input
        description: ISO date; part of the duplicate-detection key
      - name: state_student_id
        type: string
        source: input
        description: state-assigned identifier; null when the SIS has not issued one
      - name: enrollment_state
        type: enum
        source: system
        description: district membership state
        default: ENROLLED
        constraints: "one of ENROLLED, WITHDRAWN, MERGED_DUPLICATE"
      - name: withdrawal_effective_date
        type: string
        source: system
        description: ISO date supplied to the withdraw transition; null while ENROLLED
      - name: duplicate_of_student_id
        type: string
        source: system
        description: "FK -> Student.id; surviving record this row was merged into; null unless enrollment_state == MERGED_DUPLICATE"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "count of Enrollment rows with student_id == this.id AND roster_status IN {PENDING_ADD, ACTIVE, PENDING_DROP}"
        default: 0

  # --------------------------------------------------------------- Section ---
  - name: Section
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; building that offers this section"
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; term the section meets in"
      - name: primary_teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; teacher of record; null means the section is unmatched and blocks rostering under HOLD_RUN policy"
      - name: sis_section_id
        type: string
        source: input
        description: source-of-truth section identifier from the SIS extract
        constraints: "unique across all Section rows"
      - name: course_code
        type: string
        source: input
        description: district course catalog code emitted in the vendor feed
      - name: subject
        type: enum
        source: input
        description: subject area
        constraints: "one of MATH, ELA, SCIENCE, SOCIAL_STUDIES, ELECTIVE"
      - name: period_index
        type: integer
        source: input
        description: bell-schedule period the section meets in; basis of the teacher passing-buffer overlap rule
        constraints: "1..8"
      - name: meeting_days
        type: array
        source: input
        description: "days the section meets; array of MON, TUE, WED, THU, FRI; must be non-empty and duplicate-free"
      - name: max_seats
        type: integer
        source: input
        description: physical seat capacity of the section
        constraints: "1..60"
      - name: status
        type: enum
        source: system
        description: section lifecycle; ARCHIVED sections are read-only and only reachable inside the archived-access window
        default: ACTIVE
        constraints: "one of ACTIVE, ARCHIVED, CANCELLED"
      - name: roster_health
        type: enum
        source: system
        description: rostering readiness flag maintained by teacher separation and error-queue resolution
        default: OK
        constraints: "one of OK, UNMATCHED_TEACHER"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "count of Enrollment rows with section_id == this.id AND roster_status IN {PENDING_ADD, ACTIVE}; the capacity check compares this to max_seats"
        default: 0

  # ------------------------------------------------------------ Enrollment ---
  - name: Enrollment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: section_id
        type: string
        source: input
        description: "FK -> Section.id; section being added or dropped"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; subject of this enrollment"
      - name: requested_effective_date
        type: string
        source: input
        description: ISO date the add should take effect; must fall inside [term.start_date, term.end_date]
      - name: effective_date
        type: string
        source: system
        description: "copied verbatim from requested_effective_date at creation; never mutated afterwards"
      - name: drop_effective_date
        type: string
        source: system
        description: ISO date supplied to the drop transition; null until a drop is requested
      - name: roster_status
        type: enum
        source: system
        description: roster lifecycle of this seat in the section
        default: PENDING_ADD
        constraints: "one of PENDING_ADD, ACTIVE, PENDING_DROP, DROPPED"
      - name: add_drop_class
        type: enum
        source: computed
        description: "IN_WINDOW when effective_date <= term.add_drop_cutoff_date, else LATE_ADD; computed once at creation from the owning section's term"
        constraints: "one of IN_WINDOW, LATE_ADD"
      - name: source
        type: enum
        source: input
        description: provenance of the row
        default: MANUAL
        constraints: "one of SIS_EXTRACT, MANUAL"

  # ------------------------------------------------------------- VendorApp ---
  - name: VendorApp
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: vendor product name
      - name: vendor_code
        type: string
        source: input
        description: short code used in feed filenames
        constraints: "unique across all VendorApp rows"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID that created the license record; the activate-license segregation-of-duties check compares against it
      - name: activated_by_user_id
        type: string
        source: system
        description: X-User-ID that ran activate-license; null while status == DRAFT
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term this license and its rosters cover"
      - name: rostering_standard
        type: enum
        source: input
        description: rostering standard selected for this vendor; drives the shape of the roster feed
        constraints: "one of ONEROSTER_CSV_1P1, ONEROSTER_REST_1P2, VENDOR_NATIVE_JSON"
      - name: identifier_strategy
        type: enum
        source: input
        description: per-vendor transformation rule that derives AppAccount.username
        constraints: "one of SIS_ID, EMAIL_LOCALPART, STATE_ID"
      - name: username_domain
        type: string
        source: input
        description: domain appended to every derived username for this vendor
        constraints: "lower-case, 3..64 chars, no '@'"
      - name: name_format
        type: enum
        source: input
        description: per-vendor transformation rule for the display_name emitted in the roster feed
        default: LAST_FIRST
        constraints: "one of LAST_FIRST, FIRST_LAST"
      - name: grade_band_scope
        type: array
        source: input
        description: "grade bands in scope; array over ELEMENTARY, MIDDLE, HIGH; must be non-empty and duplicate-free"
      - name: seat_model
        type: enum
        source: input
        description: whether teacher seats are licensed in addition to student seats
        constraints: "one of PER_STUDENT, PER_STUDENT_AND_TEACHER"
      - name: allocation_policy
        type: enum
        source: input
        description: waterfall policy used to split total_seats across in-scope buildings
        constraints: "one of PROPORTIONAL_HEADCOUNT, FIXED_BUILDING_BLOCKS"
      - name: block_seats
        type: integer
        source: input
        description: block size for FIXED_BUILDING_BLOCKS; required when allocation_policy == FIXED_BUILDING_BLOCKS, otherwise must be omitted
        constraints: "1..10000"
      - name: overage_policy
        type: enum
        source: input
        description: BLOCK makes every BuildingAllocation a hard cap; POOL_FALLBACK lets a full building borrow from unallocated_seats
        default: BLOCK
        constraints: "one of BLOCK, POOL_FALLBACK"
      - name: unmatched_teacher_policy
        type: enum
        source: input
        description: HOLD_RUN raises BLOCKING error-queue items for unmatched sections; SKIP_SECTION raises ADVISORY items and omits the section from the feed
        default: HOLD_RUN
        constraints: "one of HOLD_RUN, SKIP_SECTION"
      - name: total_seats
        type: integer
        source: input
        description: seats purchased on the license
        constraints: "1..100000"
      - name: price_per_seat_cents
        type: integer
        source: input
        description: full-term list price of one seat, in cents
        constraints: "1..10000000"
      - name: status
        type: enum
        source: system
        description: license lifecycle
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, TERMINATED"
      - name: unallocated_seats
        type: integer
        source: computed
        description: "district pool remainder: total_seats - sum(BuildingAllocation.allocated_seats) - sum(BuildingAllocation.borrowed_seats) over allocations of this vendor app; equals total_seats while status == DRAFT"
      - name: consumed_seats
        type: integer
        source: computed
        description: "count of AppAccount rows under this vendor app's allocations with seat_status IN {RESERVED, ACTIVE}"
        default: 0
      - name: committed_charge_cents
        type: integer
        source: computed
        description: "sum over ALL AppAccount rows of this vendor app (any seat_status) of (seat_charge_cents - refunded_charge_cents)"
        default: 0
      - name: renewal_score
        type: number
        source: computed
        description: "FINAL_RENEWAL variant of renewal_recommendation_score, 2 decimals; recomputed on record-usage, release, deprovision and sync publish; null until at least one AppAccount exists"
      - name: renewal_recommendation
        type: enum
        source: computed
        description: "tier of renewal_score: RENEW when renewal_score >= 70, RENEGOTIATE when 40 <= renewal_score < 70, DROP when renewal_score < 40; null while renewal_score is null"
        constraints: "one of RENEW, RENEGOTIATE, DROP"
      - name: sync_health
        type: enum
        source: system
        description: rostering pipeline health for this vendor; BLOCKED while a run of this vendor is HELD or a run of this vendor carries an OPEN BLOCKING ErrorQueueItem, OK otherwise (recomputed on every transform, triage and publish)
        default: OK
        constraints: "one of OK, BLOCKED"

  # ----------------------------------------------------- BuildingAllocation ---
  - name: BuildingAllocation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_app_id
        type: string
        source: system
        description: "FK -> VendorApp.id; license this allocation draws from; set by the activate-license cascade, never supplied by a client"
      - name: school_id
        type: string
        source: system
        description: "FK -> School.id; building this allocation belongs to; set by the activate-license cascade, never supplied by a client"
      - name: allocated_seats
        type: integer
        source: computed
        description: "seats granted to this building; written by building_seat_allocation at license activation and overwritten by PATCH /rostering/building-allocations/{id}"
      - name: consumed_seats
        type: integer
        source: computed
        description: "count of AppAccount rows with building_allocation_id == this.id AND seat_status IN {RESERVED, ACTIVE}"
        default: 0
      - name: borrowed_seats
        type: integer
        source: computed
        description: "seats taken from VendorApp.unallocated_seats beyond allocated_seats under POOL_FALLBACK; always 0 while vendor_app.overage_policy == BLOCK"
        default: 0
      - name: hard_cap
        type: boolean
        source: system
        description: "true when vendor_app.overage_policy == BLOCK at the moment this allocation row was written; re-stamped whenever allocated_seats is rewritten"
      - name: eligible_headcount_snapshot
        type: integer
        source: system
        description: "School.enrolled_student_count observed when building_seat_allocation ran; the headcount guard on manual reallocation compares against this value"

  # ------------------------------------------------------------ AppAccount ---
  - name: AppAccount
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: building_allocation_id
        type: string
        source: input
        description: "FK -> BuildingAllocation.id; the seat pool this account draws a seat from"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; subject when subject_type == STUDENT, else must be omitted"
      - name: teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; subject when subject_type == TEACHER, else must be omitted"
      - name: subject_type
        type: enum
        source: input
        description: which polymorphic subject this account represents
        constraints: "one of STUDENT, TEACHER"
      - name: username
        type: string
        source: computed
        description: "derived by username_derivation from the vendor app's identifier_strategy, username_domain and the subject's fields; unique per vendor app"
      - name: seat_status
        type: enum
        source: system
        description: "license-seat axis; independent of identity_status"
        default: RESERVED
        constraints: "one of RESERVED, ACTIVE, RELEASED"
      - name: identity_status
        type: enum
        source: system
        description: "single sign-on identity axis; independent of seat_status"
        default: PENDING_PROVISION
        constraints: "one of PENDING_PROVISION, PROVISIONED, SUSPENDED, DEPROVISIONED"
      - name: password_state
        type: enum
        source: system
        description: password posture within the identity axis
        default: TEMP_SET
        constraints: "one of TEMP_SET, USER_SET, EXPIRED, LOCKED"
      - name: failed_login_count
        type: integer
        source: system
        description: cumulative failed logins reported by vendor telemetry since the last successful password set
        default: 0
      - name: last_password_set_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent password set; null while password_state == TEMP_SET and no set has occurred
      - name: password_expires_at
        type: datetime
        source: computed
        description: "created_at + school.temp_password_ttl_hours hours while password_state == TEMP_SET; last_password_set_at + school.password_max_age_days days once password_state == USER_SET"
      - name: seat_charge_cents
        type: integer
        source: computed
        description: "rate_for_date(clock date at provisioning) from the sync_seat_charge constants block; frozen at provisioning"
      - name: refunded_charge_cents
        type: integer
        source: computed
        description: "seat_charge_cents when the seat is released on or before term.add_drop_cutoff_date, otherwise 0"
        default: 0
      - name: active_minutes_total
        type: integer
        source: system
        description: cumulative active minutes reported through record-usage
        default: 0
      - name: session_count
        type: integer
        source: system
        description: cumulative sessions reported through record-usage
        default: 0
      - name: last_activity_date
        type: string
        source: system
        description: latest activity_date reported through record-usage, ISO date; null until first report
      - name: deprovision_scheduled_date
        type: string
        source: system
        description: ISO date on which the identity axis is scheduled to reach DEPROVISIONED; set by withdrawal cascade and by the deprovision transition

  # --------------------------------------------------------------- SyncRun ---
  - name: SyncRun
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_app_id
        type: string
        source: input
        description: "FK -> VendorApp.id; vendor this run rosters"
      - name: run_type
        type: enum
        source: input
        description: FULL and DELTA roster the ACTIVE term; ROLLOVER rosters a ROLLED_OVER term for archived-class access
        constraints: "one of FULL, DELTA, ROLLOVER"
      - name: state
        type: enum
        source: system
        description: pipeline state
        default: EXTRACTED
        constraints: "one of EXTRACTED, TRANSFORMED, HELD, PUBLISHED, SUPERSEDED"
      - name: initiated_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator that created (extracted) the run; the segregation-of-duties check compares the publisher against this value
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer that published the run; null until PUBLISHED
      - name: extracted_section_count
        type: integer
        source: computed
        description: "count of in-scope Section rows at extraction (see sync_scope_resolution input_set)"
        default: 0
      - name: extracted_enrollment_count
        type: integer
        source: computed
        description: "count of in-scope Enrollment rows at extraction with roster_status IN {PENDING_ADD, ACTIVE, PENDING_DROP}"
        default: 0
      - name: transformed_record_count
        type: integer
        source: computed
        description: "roster records emitted by the most recent transform: in-scope sections not skipped, plus distinct student subjects, plus teacher subjects when seat_model == PER_STUDENT_AND_TEACHER"
        default: 0
      - name: blocking_error_count
        type: integer
        source: computed
        description: "count of ErrorQueueItem rows of this run with severity == BLOCKING AND status == OPEN"
        default: 0
      - name: advisory_error_count
        type: integer
        source: computed
        description: "count of ErrorQueueItem rows of this run with severity == ADVISORY AND status == OPEN"
        default: 0
      - name: projected_seat_delta
        type: integer
        source: computed
        description: "PROVISIONAL variant of sync_seat_charge, written at every transform; null until the first transform"
      - name: projected_charge_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of sync_seat_charge, written at every transform; null until the first transform"
      - name: published_seat_delta
        type: integer
        source: computed
        description: "FINAL variant of sync_seat_charge, written once at publish; null until PUBLISHED"
      - name: published_charge_cents
        type: integer
        source: computed
        description: "FINAL variant of sync_seat_charge, written once at publish; null until PUBLISHED"
      - name: transform_count
        type: integer
        source: system
        description: number of completed transform attempts on this run; increments on every transform including re-transforms out of HELD
        default: 0
      - name: extracted_at
        type: datetime
        source: system
        description: logical-clock instant of creation/extraction
      - name: transformed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent transform; null until the first transform
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of publish; null until PUBLISHED

  # -------------------------------------------------------- ErrorQueueItem ---
  - name: ErrorQueueItem
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: sync_run_id
        type: string
        source: system
        description: "FK -> SyncRun.id; run whose transform raised this item; set by the transform cascade, never supplied by a client"
      - name: category
        type: enum
        source: system
        description: triage category
        constraints: "one of UNMATCHED_TEACHER, DUPLICATE_STUDENT, MISSING_GRADE_BAND, SEAT_SHORTFALL"
      - name: severity
        type: enum
        source: system
        description: BLOCKING items gate transform-out-of-HELD and publish; ADVISORY items do not
        constraints: "one of BLOCKING, ADVISORY"
      - name: status
        type: enum
        source: system
        description: triage lifecycle
        default: OPEN
        constraints: "one of OPEN, RESOLVED_MATCHED, RESOLVED_MERGED, DISMISSED"
      - name: source_ref
        type: string
        source: system
        description: "the raw feed key that could not be resolved (sis_section_id for UNMATCHED_TEACHER, lower(last_name)|date_of_birth for DUPLICATE_STUDENT, sis_student_id for MISSING_GRADE_BAND, vendor_code for SEAT_SHORTFALL)"
      - name: subject_section_id
        type: string
        source: system
        description: "FK -> Section.id; section carrying the defect; null for DUPLICATE_STUDENT and SEAT_SHORTFALL"
      - name: subject_student_id
        type: string
        source: system
        description: "FK -> Student.id; for DUPLICATE_STUDENT the earlier-created candidate (created_at ASC), for MISSING_GRADE_BAND the offending student; null otherwise"
      - name: duplicate_candidate_student_id
        type: string
        source: system
        description: "FK -> Student.id; for DUPLICATE_STUDENT the later-created candidate (created_at ASC); null for every other category"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that closed the item; null while OPEN
      - name: resolution_note
        type: string
        source: system
        description: free-text note supplied by the resolver; null while OPEN and when no note was supplied
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant at which status left OPEN; null while OPEN

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------------------------ Term ---
  - entity: Term
    initial_state: PLANNED
    terminal_states: [ROLLED_OVER]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /rostering/terms/{term_id}/activate"
        actor: RosterOperator
        preconditions:
          - "term.state == PLANNED"
          - "clock date (date part of the logical clock) <= term.end_date, else ERR_TERM_WINDOW_CLOSED"
        side_effects:
          - "term.state = ACTIVE"
          - "increments Term.version by 1"
        note: "Enrollment creation is gated on term.state == ACTIVE, so this transition is a prerequisite of the roster surface."
      - from: ACTIVE
        to: ROLLED_OVER
        trigger: "POST /rostering/terms/{term_id}/rollover"
        actor: DataGovernanceOfficer
        preconditions:
          - "term.state == ACTIVE"
          - "clock date >= term.end_date, else ERR_TERM_WINDOW_CLOSED"
        side_effects:
          - "term.archived_access_expires_at = (term.end_date + term.archive_retention_days days) at 00:00:00.000Z"
          - "every Section with term_id == term.id AND status == ACTIVE becomes status = ARCHIVED (summer rollover); CANCELLED sections are left untouched (conditional cascade)"
          - "hop 2: every Enrollment of those archived sections with roster_status IN {PENDING_ADD, ACTIVE, PENDING_DROP} becomes roster_status = DROPPED with drop_effective_date = term.end_date"
          - "hop 3: each of those enrollment drops releases the subject's AppAccount rows under vendor apps whose term_id == term.id and whose scope no longer retains the student (seat_status = RELEASED, refunded_charge_cents per the release rule) and sets identity_status = SUSPENDED (summer suspension, NOT DEPROVISIONED)"
          - "hop 4: each release decrements BuildingAllocation.consumed_seats by 1 and recomputes VendorApp.consumed_seats, VendorApp.committed_charge_cents, VendorApp.renewal_score, VendorApp.renewal_recommendation, incrementing VendorApp.version by 1 per affected vendor app"
          - "term.state = ROLLED_OVER; increments Term.version by 1"
        note: "Archived-class reads remain permitted while clock < term.archived_access_expires_at (strict less-than)."

  # --------------------------------------------------------------- Student ---
  - entity: Student
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN, MERGED_DUPLICATE]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /rostering/students/{student_id}/withdraw"
        actor: DataGovernanceOfficer
        preconditions:
          - "student.enrollment_state == ENROLLED, else ERR_STUDENT_NOT_ENROLLED"
          - "withdrawal_effective_date is an ISO date inside [term.start_date, term.end_date] of every term whose sections the student is enrolled in, else ERR_EFFECTIVE_DATE_OUT_OF_TERM"
        side_effects:
          - "student.enrollment_state = WITHDRAWN; student.withdrawal_effective_date = withdrawal_effective_date; School.enrolled_student_count recomputed"
          - "hop 2: every Enrollment of this student with roster_status IN {PENDING_ADD, ACTIVE} becomes roster_status = DROPPED when withdrawal_effective_date <= clock date, else roster_status = PENDING_DROP; drop_effective_date = withdrawal_effective_date in both cases; Section.active_enrollment_count recomputed"
          - "hop 3: each Enrollment that reached DROPPED releases every AppAccount of this student with seat_status IN {RESERVED, ACTIVE} whose vendor app no longer retains the student in scope: seat_status = RELEASED, refunded_charge_cents = seat_charge_cents when clock date <= term.add_drop_cutoff_date else 0, identity_status = DEPROVISIONED and deprovision_scheduled_date = withdrawal_effective_date"
          - "hop 4: each release decrements BuildingAllocation.consumed_seats by 1, then recomputes VendorApp.consumed_seats, VendorApp.unallocated_seats, VendorApp.committed_charge_cents, VendorApp.renewal_score and VendorApp.renewal_recommendation, incrementing VendorApp.version by 1"
          - "increments Student.version by 1"
        note: "Depth-4 transitive cascade: Student -> Enrollment -> AppAccount -> BuildingAllocation/VendorApp. Each hop is caused by the previous hop, not by the withdraw call."
      - from: ENROLLED
        to: MERGED_DUPLICATE
        trigger: "POST /rostering/error-queue-items/{error_queue_item_id}/merge-duplicate (applies to the losing record: the DUPLICATE_STUDENT item's candidate that is NOT surviving_student_id)"
        actor: DataGovernanceOfficer
        preconditions:
          - "losing_student.enrollment_state == ENROLLED"
          - "item.category == DUPLICATE_STUDENT AND item.status == OPEN"
        side_effects:
          - "losing_student.enrollment_state = MERGED_DUPLICATE; losing_student.duplicate_of_student_id = surviving_student_id"
          - "every Enrollment of the losing student with roster_status IN {PENDING_ADD, ACTIVE, PENDING_DROP} is re-pointed to student_id = surviving_student_id when the surviving student has no non-DROPPED enrollment in that same section; otherwise that enrollment becomes roster_status = DROPPED with drop_effective_date = clock date (conditional cascade)"
          - "every AppAccount of the losing student with seat_status IN {RESERVED, ACTIVE} becomes seat_status = RELEASED (refund per the release rule) and identity_status = DEPROVISIONED, then BuildingAllocation.consumed_seats and the VendorApp counters are recomputed"
          - "School.enrolled_student_count recomputed for the losing student's building"
        note: "Branching machine: ENROLLED forks to WITHDRAWN or MERGED_DUPLICATE with disjoint side-effect sets (withdrawal keeps the roster rows on the same student, a merge re-points or drops them)."

  # ------------------------------------------------------------ Enrollment ---
  - entity: Enrollment
    initial_state: PENDING_ADD
    terminal_states: [DROPPED]
    transitions:
      - from: PENDING_ADD
        to: ACTIVE
        trigger: "POST /rostering/enrollments — same-request auto-transition when requested_effective_date <= clock date"
        actor: system
        preconditions:
          - "requested_effective_date <= clock date (a future-dated add stays PENDING_ADD)"
        side_effects:
          - "roster_status = ACTIVE; effective_date = requested_effective_date"
          - "Section.active_enrollment_count and Student.active_enrollment_count recomputed"
        note: "Boundary: requested_effective_date == clock date yields ACTIVE, clock date + 1 day yields PENDING_ADD."
      - from: PENDING_ADD
        to: ACTIVE
        trigger: "POST /rostering/sync-runs/{sync_run_id}/publish (mid-year schedule change propagation)"
        actor: system
        preconditions:
          - "enrollment.section is in the published run's scope"
          - "enrollment.requested_effective_date <= clock date, else the row stays PENDING_ADD and is skipped by this publish"
        side_effects:
          - "roster_status = ACTIVE; effective_date = max(requested_effective_date, clock date) — a request the district made for an earlier date but only published later takes effect on the publish date"
          - "Section.active_enrollment_count and Student.active_enrollment_count recomputed"
          - "the enrollment enters the FINAL variant input set of sync_seat_charge for this publish"
      - from: ACTIVE
        to: PENDING_DROP
        trigger: "POST /rostering/enrollments/{enrollment_id}/drop with drop_effective_date > clock date"
        actor: RosterOperator
        preconditions:
          - "roster_status == ACTIVE"
          - "drop_effective_date >= enrollment.effective_date, else ERR_DROP_BEFORE_ADD"
        side_effects:
          - "roster_status = PENDING_DROP; drop_effective_date recorded"
          - "no seat is released and no refund is issued yet; Section.active_enrollment_count recomputed (PENDING_DROP leaves the ACTIVE/PENDING_ADD count)"
      - from: PENDING_ADD
        to: DROPPED
        trigger: "POST /rostering/enrollments/{enrollment_id}/drop with drop_effective_date <= clock date"
        actor: RosterOperator
        preconditions:
          - "roster_status == PENDING_ADD"
          - "drop_effective_date >= enrollment.effective_date, else ERR_DROP_BEFORE_ADD"
        side_effects:
          - "roster_status = DROPPED; the seat-release cascade below runs"
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /rostering/enrollments/{enrollment_id}/drop with drop_effective_date <= clock date"
        actor: RosterOperator
        preconditions:
          - "roster_status == ACTIVE"
          - "drop_effective_date >= enrollment.effective_date, else ERR_DROP_BEFORE_ADD"
        side_effects:
          - "roster_status = DROPPED; drop_effective_date recorded; Section.active_enrollment_count and Student.active_enrollment_count recomputed"
          - "hop 2 (conditional cascade): for every AppAccount A of this student with seat_status IN {RESERVED, ACTIVE}, let V be the vendor app of A.building_allocation_id; A is released only when the student now has zero Enrollment rows with roster_status IN {PENDING_ADD, ACTIVE, PENDING_DROP} whose section satisfies (section.term_id == V.term_id AND section.status == ACTIVE AND section.school.grade_band IN V.grade_band_scope). Release sets seat_status = RELEASED and refunded_charge_cents = seat_charge_cents when drop_effective_date <= term.add_drop_cutoff_date else 0"
          - "hop 3: each release decrements BuildingAllocation.consumed_seats by 1 and recomputes VendorApp.consumed_seats, VendorApp.committed_charge_cents, VendorApp.renewal_score, VendorApp.renewal_recommendation, incrementing VendorApp.version by 1"
      - from: PENDING_DROP
        to: DROPPED
        trigger: "POST /rostering/sync-runs/{sync_run_id}/publish"
        actor: system
        preconditions:
          - "enrollment.section is in the published run's scope"
          - "enrollment.drop_effective_date <= clock date"
        side_effects:
          - "roster_status = DROPPED; the same hop-2/hop-3 seat-release cascade as the ACTIVE -> DROPPED transition runs"
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /rostering/students/{student_id}/withdraw or POST /rostering/terms/{term_id}/rollover (cascade)"
        actor: system
        preconditions:
          - "the owning student reached WITHDRAWN, or the owning section reached ARCHIVED through rollover"
        side_effects:
          - "roster_status = DROPPED with drop_effective_date = withdrawal_effective_date (withdraw) or term.end_date (rollover)"
          - "seat release cascade as described on the owning transition"

  # ------------------------------------------------------------- VendorApp ---
  - entity: VendorApp
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rostering/vendor-apps/{vendor_app_id}/activate-license"
        actor: DataGovernanceOfficer
        preconditions:
          - "vendor_app.status == DRAFT, else ERR_VENDOR_APP_ALREADY_ACTIVATED"
          - "X-User-ID != vendor_app.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the candidate building set of building_seat_allocation is non-empty, else ERR_NO_ELIGIBLE_BUILDINGS"
        side_effects:
          - "building_seat_allocation runs and creates one BuildingAllocation per candidate building with allocated_seats, hard_cap and eligible_headcount_snapshot stamped"
          - "vendor_app.status = ACTIVE; vendor_app.activated_by_user_id = X-User-ID; vendor_app.unallocated_seats = total_seats - sum(allocated_seats)"
          - "increments VendorApp.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /rostering/vendor-apps/{vendor_app_id} with status = SUSPENDED"
        actor: DataGovernanceOfficer
        preconditions:
          - "vendor_app.status == ACTIVE"
        side_effects:
          - "vendor_app.status = SUSPENDED; new AppAccount provisioning is rejected with ERR_VENDOR_APP_NOT_ACTIVE while SUSPENDED"
          - "existing AppAccount rows keep their seat_status and identity_status untouched"
          - "increments VendorApp.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /rostering/vendor-apps/{vendor_app_id} with status = ACTIVE"
        actor: DataGovernanceOfficer
        preconditions:
          - "vendor_app.status == SUSPENDED"
          - "sum(BuildingAllocation.allocated_seats) <= vendor_app.total_seats, else ERR_ALLOCATION_EXCEEDS_LICENSE"
        side_effects:
          - "vendor_app.status = ACTIVE; increments VendorApp.version by 1"
        note: "Cyclic: ACTIVE -> SUSPENDED -> ACTIVE is a legal loop; the allocation-sum guard is re-evaluated on the way back."
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /rostering/vendor-apps/{vendor_app_id} with status = TERMINATED"
        actor: DataGovernanceOfficer
        preconditions:
          - "vendor_app.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "every AppAccount under this vendor app with seat_status IN {RESERVED, ACTIVE} becomes seat_status = RELEASED (refund per the release rule) and identity_status = DEPROVISIONED"
          - "each release decrements the owning BuildingAllocation.consumed_seats; vendor_app.consumed_seats and vendor_app.committed_charge_cents are recomputed"
          - "every SyncRun of this vendor app in state IN {EXTRACTED, TRANSFORMED, HELD} becomes SUPERSEDED and its OPEN ErrorQueueItem rows become DISMISSED"
          - "vendor_app.status = TERMINATED; increments VendorApp.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /rostering/vendor-apps/{vendor_app_id} with status = TERMINATED"
        actor: DataGovernanceOfficer
        preconditions:
          - "vendor_app.status == SUSPENDED"
        side_effects:
          - "identical to the ACTIVE -> TERMINATED side-effect set"

  # ------------------------------------------------------------ AppAccount ---
  # Parallel dimensions: seat_status and identity_status advance on different
  # triggers and are never coupled by a single transition except where stated.
  - entity: AppAccount
    initial_state: RESERVED+PENDING_PROVISION
    terminal_states: [RELEASED+DEPROVISIONED]
    transitions:
      - from: "(seat axis) none"
        to: "(seat axis) RESERVED"
        trigger: "POST /rostering/app-accounts"
        actor: IdentityAdmin
        preconditions:
          - "vendor_app.status == ACTIVE, else ERR_VENDOR_APP_NOT_ACTIVE"
          - "expected_vendor_app_version == vendor_app.version, else ERR_STALE_VENDOR_APP_VERSION"
          - "seat availability per seat_admission_capacity, else ERR_BUILDING_ALLOCATION_EXHAUSTED or ERR_DISTRICT_SEATS_EXHAUSTED"
        side_effects:
          - "seat_status = RESERVED; identity_status = PENDING_PROVISION; password_state = TEMP_SET"
          - "username = username_derivation output; seat_charge_cents = rate_for_date(clock date)"
          - "BuildingAllocation.consumed_seats += 1 (and borrowed_seats += 1 when the seat came from the district pool under POOL_FALLBACK)"
          - "recomputes VendorApp.consumed_seats and VendorApp.committed_charge_cents; increments VendorApp.version by 1"
      - from: "(seat axis) RESERVED"
        to: "(seat axis) ACTIVE"
        trigger: "POST /rostering/app-accounts/{app_account_id}/record-usage with active_minutes > 0"
        actor: VendorIntegrationManager
        preconditions:
          - "seat_status == RESERVED"
          - "identity_status != DEPROVISIONED, else ERR_ACCOUNT_DEPROVISIONED"
        side_effects:
          - "seat_status = ACTIVE (the seat is proven consumed by usage telemetry)"
          - "active_minutes_total += active_minutes; session_count += session_count; last_activity_date = activity_date"
          - "recomputes VendorApp.renewal_score and VendorApp.renewal_recommendation; increments VendorApp.version by 1"
        note: "record-usage with active_minutes == 0 leaves seat_status unchanged (boundary on the zero-quantity edge)."
      - from: "(seat axis) RESERVED or ACTIVE"
        to: "(seat axis) RELEASED"
        trigger: "POST /rostering/app-accounts/{app_account_id}/release"
        actor: IdentityAdmin
        preconditions:
          - "seat_status IN {RESERVED, ACTIVE}, else ERR_SEAT_ALREADY_RELEASED"
        side_effects:
          - "seat_status = RELEASED; refunded_charge_cents = seat_charge_cents when clock date <= term.add_drop_cutoff_date, else 0"
          - "BuildingAllocation.consumed_seats -= 1 (and borrowed_seats -= 1 first when this account was a borrowed seat)"
          - "recomputes VendorApp.consumed_seats, VendorApp.unallocated_seats, VendorApp.committed_charge_cents, VendorApp.renewal_score, VendorApp.renewal_recommendation; increments VendorApp.version by 1"
          - "identity_status is NOT changed by this transition (the identity axis is independent)"
      - from: "(identity axis) PENDING_PROVISION"
        to: "(identity axis) PROVISIONED"
        trigger: "POST /rostering/app-accounts/{app_account_id}/password-set"
        actor: IdentityAdmin
        preconditions:
          - "identity_status IN {PENDING_PROVISION, SUSPENDED}, else ERR_ACCOUNT_DEPROVISIONED"
          - "password_state != LOCKED, else ERR_ACCOUNT_LOCKED (there is no unlock flag on the request body; a LOCKED account is terminal for password-set)"
          - "new_password satisfies the subject school's password policy per password_lifecycle_evaluation, else ERR_PASSWORD_TOO_SHORT / ERR_PASSWORD_COMPLEXITY"
        side_effects:
          - "identity_status = PROVISIONED; password_state = USER_SET; failed_login_count = 0"
          - "last_password_set_at = clock instant; password_expires_at = last_password_set_at + school.password_max_age_days days"
          - "seat_status is NOT changed by this transition"
      - from: "(identity axis) SUSPENDED"
        to: "(identity axis) PROVISIONED"
        trigger: "POST /rostering/app-accounts/{app_account_id}/password-set (reactivation after summer suspension)"
        actor: IdentityAdmin
        preconditions:
          - "identity_status == SUSPENDED"
          - "same password-policy and lock preconditions as above"
        side_effects:
          - "identity_status = PROVISIONED; password_state = USER_SET; failed_login_count = 0; last_password_set_at = clock instant"
      - from: "(identity axis) PROVISIONED"
        to: "(identity axis) SUSPENDED"
        trigger: "POST /rostering/terms/{term_id}/rollover (cascade)"
        actor: system
        preconditions:
          - "the account's subject lost every in-scope enrollment because the term rolled over"
        side_effects:
          - "identity_status = SUSPENDED; password_state left untouched; the seat axis moves to RELEASED through its own cascade hop"
      - from: "(identity axis) PENDING_PROVISION or PROVISIONED or SUSPENDED"
        to: "(identity axis) DEPROVISIONED"
        trigger: "POST /rostering/app-accounts/{app_account_id}/deprovision, or cascade from student withdraw / teacher separation / duplicate merge / license termination"
        actor: IdentityAdmin
        preconditions:
          - "identity_status != DEPROVISIONED, else ERR_ACCOUNT_DEPROVISIONED"
        side_effects:
          - "identity_status = DEPROVISIONED; deprovision_scheduled_date = effective_date (endpoint) or the cascade's effective date"
          - "password_state = EXPIRED"
          - "seat_status is NOT changed by the endpoint form of this transition — a deprovisioned identity can still hold a RESERVED or ACTIVE seat until it is released"
      - from: "(password sub-state) TEMP_SET or USER_SET"
        to: "(password sub-state) LOCKED"
        trigger: "POST /rostering/app-accounts/{app_account_id}/record-usage with failed_logins > 0"
        actor: VendorIntegrationManager
        preconditions:
          - "failed_login_count + failed_logins >= school.password_lockout_threshold"
        side_effects:
          - "failed_login_count += failed_logins; password_state = LOCKED"
          - "identity_status and seat_status are NOT changed (a LOCKED password still occupies its licensed seat)"
        note: "Boundary: reaching exactly school.password_lockout_threshold locks; threshold - 1 does not."

  # --------------------------------------------------------------- SyncRun ---
  - entity: SyncRun
    initial_state: EXTRACTED
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: "none"
        to: EXTRACTED
        trigger: "POST /rostering/sync-runs"
        actor: RosterOperator
        preconditions:
          - "vendor_app.status == ACTIVE, else ERR_VENDOR_APP_NOT_ACTIVE"
          - "run_type IN {FULL, DELTA} requires term.state == ACTIVE, else ERR_TERM_NOT_ACTIVE; run_type == ROLLOVER requires term.state == ROLLED_OVER with an open retention window, else ERR_ARCHIVE_WINDOW_CLOSED"
        side_effects:
          - "state = EXTRACTED; initiated_by_user_id = X-User-ID; extracted_at = clock instant"
          - "extracted_section_count and extracted_enrollment_count computed from sync_scope_resolution"
          - "every other SyncRun of the same vendor_app_id in state IN {EXTRACTED, TRANSFORMED, HELD} becomes SUPERSEDED, and each of those runs' OPEN ErrorQueueItem rows becomes DISMISSED with resolution_note = 'run superseded'"
      - from: EXTRACTED
        to: TRANSFORMED
        trigger: "POST /rostering/sync-runs/{sync_run_id}/transform"
        actor: RosterOperator
        preconditions:
          - "state == EXTRACTED"
        side_effects:
          - "the error-queue triage pass runs and raises exactly the one-ErrorQueueItem-per-defect set documented on the EXTRACTED -> HELD transition below; the run reaches TRANSFORMED whenever triage produced NO BLOCKING item of category UNMATCHED_TEACHER. BLOCKING DUPLICATE_STUDENT and SEAT_SHORTFALL items do NOT hold the run — it transforms with them open and publish is refused later with ERR_BLOCKING_ERRORS_UNRESOLVED"
          - "transform_count += 1; transformed_at = clock instant; transformed_record_count computed"
          - "projected_seat_delta and projected_charge_cents written from the PROVISIONAL variant of sync_seat_charge"
          - "vendor_app.sync_health = OK when no OPEN BLOCKING ErrorQueueItem remains on this run, else BLOCKED; increments VendorApp.version by 1"
      - from: EXTRACTED
        to: HELD
        trigger: "POST /rostering/sync-runs/{sync_run_id}/transform (triage produced at least one BLOCKING UNMATCHED_TEACHER item)"
        actor: RosterOperator
        preconditions:
          - "state == EXTRACTED"
        side_effects:
          - "one ErrorQueueItem per defect is created: UNMATCHED_TEACHER (severity BLOCKING when vendor_app.unmatched_teacher_policy == HOLD_RUN, else ADVISORY) for every in-scope Section whose primary_teacher_id is null or whose primary teacher has employment_status == SEPARATED; DUPLICATE_STUDENT (BLOCKING) per duplicate key; MISSING_GRADE_BAND (ADVISORY) per in-scope student whose grade_level falls outside the vendor grade-band mapping; SEAT_SHORTFALL (BLOCKING when vendor_app.overage_policy == BLOCK, else ADVISORY) when projected_seat_delta exceeds vendor_app.unallocated_seats plus the free capacity of the in-scope allocations"
          - "state = HELD; transform_count += 1; transformed_at = clock instant"
          - "blocking_error_count and advisory_error_count recomputed; projected_seat_delta and projected_charge_cents are left null"
          - "vendor_app.sync_health = BLOCKED; increments VendorApp.version by 1"
      - from: HELD
        to: TRANSFORMED
        trigger: "POST /rostering/sync-runs/{sync_run_id}/transform (re-transform after triage)"
        actor: RosterOperator
        preconditions:
          - "state == HELD"
          - "zero ErrorQueueItem rows of this run with category == UNMATCHED_TEACHER AND severity == BLOCKING AND status == OPEN, else ERR_BLOCKING_ERRORS_UNRESOLVED"
        side_effects:
          - "the triage pass re-runs against current data; when it again produces a BLOCKING UNMATCHED_TEACHER item the run stays HELD (self-loop)"
          - "transform_count += 1; transformed_at = clock instant; transformed_record_count recomputed"
          - "projected_seat_delta and projected_charge_cents written from the PROVISIONAL variant of sync_seat_charge"
          - "vendor_app.sync_health = OK when no OPEN BLOCKING ErrorQueueItem remains on this run, else BLOCKED; increments VendorApp.version by 1"
        note: "Cycle: TRANSFORMED -> HELD -> TRANSFORMED. transform_count records how many laps the run made."
      - from: TRANSFORMED
        to: HELD
        trigger: "POST /rostering/teachers/{teacher_id}/separate (cascade)"
        actor: system
        preconditions:
          - "state == TRANSFORMED"
          - "a newly created BLOCKING ErrorQueueItem of category UNMATCHED_TEACHER references a Section inside this run's scope"
        side_effects:
          - "state = HELD; projected_seat_delta = null; projected_charge_cents = null (the projection is invalidated)"
          - "blocking_error_count recomputed; vendor_app.sync_health = BLOCKED; increments VendorApp.version by 1"
      - from: TRANSFORMED
        to: PUBLISHED
        trigger: "POST /rostering/sync-runs/{sync_run_id}/publish"
        actor: DataGovernanceOfficer
        preconditions:
          - "state == TRANSFORMED, else ERR_SYNC_RUN_STATE_INVALID"
          - "X-User-ID != initiated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "zero ErrorQueueItem rows of this run with severity == BLOCKING AND status == OPEN, else ERR_BLOCKING_ERRORS_UNRESOLVED"
        side_effects:
          - "every in-scope Enrollment with roster_status == PENDING_ADD and requested_effective_date <= clock date becomes ACTIVE with effective_date = max(requested_effective_date, clock date)"
          - "every in-scope Enrollment with roster_status == PENDING_DROP and drop_effective_date <= clock date becomes DROPPED, which runs the seat-release cascade (AppAccount -> BuildingAllocation -> VendorApp)"
          - "published_seat_delta and published_charge_cents written from the FINAL variant of sync_seat_charge, evaluated AFTER the two enrollment cascades above"
          - "every remaining OPEN ErrorQueueItem of this run (necessarily ADVISORY) becomes DISMISSED with resolved_by_user_id = X-User-ID"
          - "state = PUBLISHED; published_at = clock instant; published_by_user_id = X-User-ID"
          - "recomputes VendorApp.consumed_seats, VendorApp.committed_charge_cents, VendorApp.renewal_score, VendorApp.renewal_recommendation; increments VendorApp.version by 1"
      - from: "EXTRACTED or TRANSFORMED or HELD"
        to: SUPERSEDED
        trigger: "POST /rostering/sync-runs (a newer run for the same vendor app), or PATCH /rostering/vendor-apps/{vendor_app_id} with status = TERMINATED"
        actor: system
        preconditions:
          - "state IN {EXTRACTED, TRANSFORMED, HELD}"
        side_effects:
          - "state = SUPERSEDED; every OPEN ErrorQueueItem of this run becomes DISMISSED with resolution_note = 'run superseded'"
          - "blocking_error_count and advisory_error_count recomputed to 0"

  # -------------------------------------------------------- ErrorQueueItem ---
  - entity: ErrorQueueItem
    initial_state: OPEN
    terminal_states: [RESOLVED_MATCHED, RESOLVED_MERGED, DISMISSED]
    transitions:
      - from: OPEN
        to: RESOLVED_MATCHED
        trigger: "POST /rostering/error-queue-items/{error_queue_item_id}/resolve-match"
        actor: DataGovernanceOfficer
        preconditions:
          - "item.status == OPEN, else ERR_ERROR_QUEUE_ITEM_NOT_OPEN"
          - "item.category == UNMATCHED_TEACHER, else ERR_ERROR_QUEUE_ITEM_NOT_OPEN"
          - "teacher.employment_status == ACTIVE, else ERR_TEACHER_SEPARATED"
          - "teacher.school_id == subject_section.school_id, else ERR_SCHOOL_MISMATCH"
          - "the teacher has no period-buffer conflict with subject_section, else ERR_TEACHER_PERIOD_CONFLICT"
        side_effects:
          - "subject_section.primary_teacher_id = teacher_id; subject_section.roster_health = OK"
          - "item.status = RESOLVED_MATCHED; resolved_by_user_id = X-User-ID; resolved_at = clock instant; resolution_note recorded"
          - "sync_run.blocking_error_count recomputed; the run stays HELD until transform is called again (the cycle back to TRANSFORMED is an explicit operator action)"
      - from: OPEN
        to: RESOLVED_MERGED
        trigger: "POST /rostering/error-queue-items/{error_queue_item_id}/merge-duplicate"
        actor: DataGovernanceOfficer
        preconditions:
          - "item.status == OPEN, else ERR_ERROR_QUEUE_ITEM_NOT_OPEN"
          - "item.category == DUPLICATE_STUDENT, else ERR_ERROR_QUEUE_ITEM_NOT_OPEN"
          - "surviving_student_id IN {item.subject_student_id, item.duplicate_candidate_student_id}, else ERR_MERGE_SUBJECT_MISMATCH"
          - "the surviving student has enrollment_state == ENROLLED"
        side_effects:
          - "the losing candidate (the one that is not surviving_student_id) takes the Student ENROLLED -> MERGED_DUPLICATE transition with its full cascade"
          - "item.status = RESOLVED_MERGED; resolved_by_user_id = X-User-ID; resolved_at = clock instant"
          - "sync_run.blocking_error_count recomputed"
        note: "Branch divergence: RESOLVED_MATCHED mutates a Section and no Student; RESOLVED_MERGED mutates two Students, their Enrollments and their AppAccounts and no Section."
      - from: OPEN
        to: DISMISSED
        trigger: "POST /rostering/sync-runs/{sync_run_id}/publish (remaining ADVISORY items), POST /rostering/sync-runs (prior run superseded), or PATCH /rostering/vendor-apps/{vendor_app_id} with status = TERMINATED"
        actor: system
        preconditions:
          - "item.status == OPEN"
          - "for the publish form: item.severity == ADVISORY (a BLOCKING item cannot be dismissed because publish is gated on it)"
        side_effects:
          - "item.status = DISMISSED; resolved_at = clock instant; resolved_by_user_id = X-User-ID of the publishing officer, or null for the supersede/terminate forms"
          - "sync_run.advisory_error_count recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules — OCC on VendorApp.version only
# =============================================================================
concurrency_rules:
  - rule_id: app-account-create-stale-vendor-app
    parent_entity: VendorApp
    write_endpoint: "POST /rostering/app-accounts"
    occ_field: "expected_vendor_app_version"
    description: |
      Provisioning a seat against a VendorApp whose version has advanced since
      the client last read it is rejected. Seat provisioning for a different
      subject is legitimate at any time, so this cannot be reduced to a state
      precondition: the losing request is rejected purely because its view of
      the license (total_seats, overage_policy, allocation split, consumed_seats)
      is stale.
    error_id: ERR_STALE_VENDOR_APP_VERSION
    http_status: 412
  - rule_id: building-allocation-patch-stale-vendor-app
    parent_entity: VendorApp
    write_endpoint: "PATCH /rostering/building-allocations/{building_allocation_id}"
    occ_field: "expected_vendor_app_version"
    description: |
      Rewriting a building's allocated_seats against a stale VendorApp version is
      rejected. Two reallocations of two different buildings are both legitimate
      operations, so no state precondition rejects the second one; only the
      parent version check does, and it makes the seat-pool arithmetic safe.
    error_id: ERR_STALE_VENDOR_APP_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ------------------------------------------------- sync_scope_resolution ---
  - name: sync_scope_resolution
    trigger: "POST /rostering/sync-runs (extraction counts), POST /rostering/sync-runs/{sync_run_id}/transform, POST /rostering/sync-runs/{sync_run_id}/publish, GET /rostering/sync-runs/{sync_run_id}/roster-feed"
    algorithm: aggregation
    formula: |
      V = the run's vendor app; T = Term(V.term_id)
      sections_in_scope(V, run_type) =
        [ Section s : s.term_id == V.term_id
                      AND s.status == (run_type == ROLLOVER ? ARCHIVED : ACTIVE)
                      AND School(s.school_id).status == ACTIVE
                      AND School(s.school_id).grade_band IN V.grade_band_scope ]
        ordered by (School.building_code ASC, s.period_index ASC, s.created_at ASC)
      feed_sections(V, run_type) =
        sections_in_scope minus
        [ s : V.unmatched_teacher_policy == SKIP_SECTION AND s.roster_health == UNMATCHED_TEACHER ]
      enrollments_in_scope =
        [ Enrollment e : e.section_id IN sections_in_scope
                         AND e.roster_status IN {PENDING_ADD, ACTIVE, PENDING_DROP} ]
        ordered by (e.effective_date ASC, e.created_at ASC)
      students_in_scope = distinct e.student_id over enrollments_in_scope
                          where Student(e.student_id).enrollment_state == ENROLLED
      teachers_in_scope = (V.seat_model == PER_STUDENT_AND_TEACHER)
                          ? distinct non-null s.primary_teacher_id over feed_sections
                            where Teacher.employment_status == ACTIVE
                          : {}
      grade_band_of(grade_level) = ELEMENTARY for 0..5, MIDDLE for 6..8, HIGH for 9..12
      SyncRun.extracted_section_count    = count(sections_in_scope)
      SyncRun.extracted_enrollment_count = count(enrollments_in_scope)
      SyncRun.transformed_record_count   = count(feed_sections)
                                           + count(students_in_scope restricted to feed_sections)
                                           + count(teachers_in_scope)
    input_set: "Sections of the vendor's term only; ACTIVE sections for FULL/DELTA runs and ARCHIVED sections for ROLLOVER runs; CANCELLED sections and CLOSED buildings are never in scope; enrollments in DROPPED are excluded; students in WITHDRAWN or MERGED_DUPLICATE are excluded from students_in_scope even when a stale enrollment row still points at them."
    constants:
      ELEMENTARY_GRADES: "0..5"
      MIDDLE_GRADES: "6..8"
      HIGH_GRADES: "9..12"
    precision: "integer counts; ordering is fully pinned so the feed is byte-stable"

  # ---------------------------------------------- building_seat_allocation ---
  - name: building_seat_allocation
    trigger: "POST /rostering/vendor-apps/{vendor_app_id}/activate-license"
    algorithm: waterfall_allocation
    formula: |
      candidates = [ School s : s.status == ACTIVE AND s.grade_band IN V.grade_band_scope ]
      if candidates is empty -> reject with ERR_NO_ELIGIBLE_BUILDINGS
      order = candidates sorted by (s.enrolled_student_count DESC, s.created_at ASC)
      H = sum(s.enrolled_student_count for s in candidates)

      if V.allocation_policy == PROPORTIONAL_HEADCOUNT:
          if H == 0:
              base = V.total_seats // count(order); rem = V.total_seats - base * count(order)
              allocated[s] = base for every s; then +1 seat to the first `rem` schools of `order`
          else:
              exact[s]  = V.total_seats * s.enrolled_student_count / H        # exact rational, no rounding
              floor[s]  = floor(exact[s])
              rem       = V.total_seats - sum(floor[s])                       # 0 <= rem < count(order)
              recipients = order sorted by (frac(exact[s]) DESC,
                                            s.enrolled_student_count DESC,
                                            s.created_at ASC)
              allocated[s] = floor[s] + (1 if s is among the first `rem` recipients else 0)
      else:   # FIXED_BUILDING_BLOCKS
          remaining = V.total_seats
          for s in order:
              allocated[s] = min(V.block_seats, remaining)
              remaining   -= allocated[s]

      for every s: create BuildingAllocation{ vendor_app_id: V.id, school_id: s.id,
            allocated_seats: allocated[s], consumed_seats: 0, borrowed_seats: 0,
            hard_cap: (V.overage_policy == BLOCK),
            eligible_headcount_snapshot: s.enrolled_student_count }
      V.unallocated_seats = V.total_seats - sum(allocated[s])
    input_set: "Every School with status == ACTIVE whose grade_band is listed in VendorApp.grade_band_scope, regardless of whether the building currently has sections or students. CLOSED buildings are excluded."
    constants:
      REMAINDER_STEP: 1
    precision: |
      PINNED ROUNDING ORDER (mode-b combinatorial rule): floor every raw proportional
      share FIRST, then hand out the leftover `rem` seats one at a time using the
      recipients ranking. Rounding each raw share to the nearest integer and summing
      afterwards is FORBIDDEN because it does not conserve total_seats.
      Worked divergence: total_seats = 10 over headcounts {7, 7, 1} (H = 15) gives
      exact = {4.6667, 4.6667, 0.6667}; floors = {4, 4, 0} summing to 8, rem = 2, all
      three fractional parts tie at 0.6667 so the recipients ranking falls through to
      enrolled_student_count DESC then created_at ASC and the two leftover seats go to
      the two 7-headcount buildings -> {5, 5, 0}, total exactly 10. Round-half-up per
      share would yield {5, 5, 1} = 11 seats and over-allocate the license by one seat.
      Seat counts are integers; no seat is ever fractional.

  # ---------------------------------------------- seat_admission_capacity ----
  - name: seat_admission_capacity
    trigger: "POST /rostering/app-accounts"
    algorithm: threshold
    formula: |
      A = BuildingAllocation(request.building_allocation_id); V = VendorApp(A.vendor_app_id)
      free_seats = A.allocated_seats - A.consumed_seats        # consumed_seats includes borrowed-seat accounts
      if free_seats >= 1:
          admit; borrowed_delta = 0
      else if V.overage_policy == BLOCK:
          reject ERR_BUILDING_ALLOCATION_EXHAUSTED
      else if V.unallocated_seats >= 1:
          admit; borrowed_delta = 1                            # A.borrowed_seats += 1
      else:
          reject ERR_DISTRICT_SEATS_EXHAUSTED
      on admit: A.consumed_seats += 1
                V.unallocated_seats = V.total_seats - sum(allocated_seats) - sum(borrowed_seats)
    input_set: "Only AppAccount rows with seat_status IN {RESERVED, ACTIVE} count toward consumed_seats; RELEASED accounts free their seat immediately."
    constants:
      MIN_FREE_SEATS_TO_ADMIT: 1
    precision: "integer seats; the comparison is `free_seats >= 1`, so consumed_seats == allocated_seats - 1 admits and consumed_seats == allocated_seats rejects"
    variants:
      - name: hard_cap_admission
        when: "VendorApp.overage_policy == BLOCK (BuildingAllocation.hard_cap == true)"
        difference: "A full building is rejected with ERR_BUILDING_ALLOCATION_EXHAUSTED even when VendorApp.unallocated_seats > 0 — district seats cannot cross the building boundary."
      - name: district_pool_fallback
        when: "VendorApp.overage_policy == POOL_FALLBACK"
        difference: "The identical request on the identical data succeeds by borrowing one seat from the district pool: BuildingAllocation.borrowed_seats += 1 and VendorApp.unallocated_seats -= 1; only an empty pool yields ERR_DISTRICT_SEATS_EXHAUSTED."

  # --------------------------------------------------------- sync_seat_charge -
  - name: sync_seat_charge
    trigger: "POST /rostering/sync-runs/{sync_run_id}/transform (PROVISIONAL_TRANSFORM), POST /rostering/sync-runs/{sync_run_id}/publish (FINAL_PUBLISH)"
    algorithm: forward_looking
    formula: |
      V = the run's vendor app; T = Term(V.term_id)
      total_days      = (T.end_date - T.start_date) in days + 1          # inclusive
      remaining(d)    = (T.end_date - d) in days + 1                     # inclusive, >= 1
      rate_for_date(d):
          if d <= T.add_drop_cutoff_date:  return V.price_per_seat_cents
          else:                            return ceil(V.price_per_seat_cents
                                                       * remaining(d) / total_days)

      # one charge per seat-holding subject, NOT one per enrollment
      subjects = students_in_scope (see sync_scope_resolution)
                 + teachers_in_scope
      charge_date(subject):
          student  -> the earliest charge date over that student's in-scope enrollments
                      (variant-dependent field, see `variants`)
          teacher  -> T.start_date
      seat_delta = count(subjects) - count(existing AppAccount rows of V with
                                           seat_status IN {RESERVED, ACTIVE}
                                           whose subject is still in `subjects`)
      charge_cents = sum over subjects of rate_for_date(charge_date(subject))
    input_set: "Only subjects that will hold a seat after this run: students whose enrollment_state == ENROLLED with an in-scope enrollment, plus primary teachers of feed_sections when seat_model == PER_STUDENT_AND_TEACHER. Students already holding a live AppAccount under this vendor app are re-priced but do not add to seat_delta. Enrollments in DROPPED and sections excluded by SKIP_SECTION contribute nothing."
    constants:
      PRORATION_BASIS: "inclusive instructional calendar days between Term.start_date and Term.end_date"
      MIN_REMAINING_DAYS: 1
    precision: |
      PINNED: ceil PER SUBJECT first, then sum the per-subject integers. Summing the
      exact rationals and ceiling once at the end is FORBIDDEN.
      Worked divergence with price_per_seat_cents = 1000, T.start_date = 2026-08-10,
      T.end_date = 2026-12-18 (total_days = 131), charge_date = 2026-10-01
      (remaining = 79): per-subject rate = ceil(1000 * 79 / 131) = ceil(603.0534) = 604,
      so three subjects cost 3 * 604 = 1812 cents. Ceiling the pooled rational instead
      gives ceil(3000 * 79 / 131) = ceil(1809.1603) = 1810 cents, understating the
      commitment by 2 cents. All money is integer cents; no cent is ever fractional.
    variants:
      - name: PROVISIONAL_TRANSFORM
        when: "evaluated by POST /rostering/sync-runs/{sync_run_id}/transform; written to SyncRun.projected_seat_delta and SyncRun.projected_charge_cents"
        difference: "charge_date(student) = min(Enrollment.requested_effective_date) — the date the SIS asked for — and PENDING_DROP enrollments are still counted as seat-holding because the drop has not been published yet."
      - name: FINAL_PUBLISH
        when: "evaluated by POST /rostering/sync-runs/{sync_run_id}/publish AFTER the publish state effects have been applied; written to SyncRun.published_seat_delta and SyncRun.published_charge_cents"
        difference: "charge_date(student) = min(Enrollment.effective_date) — the date the add actually took effect, which is the publish clock date for a LATE_ADD — and PENDING_DROP enrollments have become DROPPED so they are excluded. A late add whose requested_effective_date is on or before T.add_drop_cutoff_date but whose effective_date falls after it is billed at full price provisionally and prorated finally."
      - name: reconciliation
        when: "publish completes"
        difference: "the reconciliation figure is SyncRun.published_charge_cents - SyncRun.projected_charge_cents and NOTHING else moves: VendorApp.committed_charge_cents is defined solely as sum(AppAccount.seat_charge_cents) - sum(AppAccount.refunded_charge_cents) and is never touched by a SyncRun charge figure. With the fixture above (three subjects, requested 2026-09-01, published 2026-10-01) the projection is 3 * 1000 = 3000 cents and the final is 3 * 604 = 1812 cents, a reconciliation delta of -1188 cents."

  # -------------------------------------------------- license_invoice_projection
  - name: license_invoice_projection
    trigger: "GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary"
    algorithm: tiered_pricing
    formula: |
      V = the vendor app
      # ---- PINNED EVALUATION ORDER: steps 1..7 in exactly this sequence ----
      1. gross_seat_cents   = V.committed_charge_cents
      2. discount_rate      = TIER_TABLE lookup on gross_seat_cents:
                                gross >= 5000000 -> 0.15
                                gross >= 2000000 -> 0.10
                                gross >=  500000 -> 0.05
                                otherwise        -> 0.00
      3. discount_cents     = floor(gross_seat_cents * discount_rate)
      4. net_seat_cents     = gross_seat_cents - discount_cents
      5. platform_fee_cents = max(FEE_FLOOR_CENTS,
                                  ceil(net_seat_cents * PLATFORM_FEE_RATE))
      6. shelfware_credit_cents = min(net_seat_cents,
                                      floor(V.unallocated_seats
                                            * V.price_per_seat_cents
                                            * UNALLOCATED_CREDIT_RATE))
      7. invoice_total_cents = net_seat_cents + platform_fee_cents
                               - shelfware_credit_cents
    input_set: "Only VendorApp.committed_charge_cents (already net of AppAccount.refunded_charge_cents) and VendorApp.unallocated_seats feed the projection. DRAFT vendor apps have committed_charge_cents == 0 and therefore land in the 0.00 tier."
    constants:
      TIER_1_FLOOR_CENTS: 500000
      TIER_1_RATE: 0.05
      TIER_2_FLOOR_CENTS: 2000000
      TIER_2_RATE: 0.10
      TIER_3_FLOOR_CENTS: 5000000
      TIER_3_RATE: 0.15
      PLATFORM_FEE_RATE: 0.03
      FEE_FLOOR_CENTS: 25000
      UNALLOCATED_CREDIT_RATE: 0.25
    precision: |
      PINNED ORDER (mode-c combinatorial rule): the volume discount is applied BEFORE
      the platform fee, and the shelfware credit is applied LAST — after the fee floor
      has already been resolved. Discounts floor, the fee ceils, the credit floors.
      Worked example: gross = 2000000, unallocated_seats = 3, price_per_seat_cents =
      1000 -> tier 0.10, discount = 200000, net = 1800000, fee = max(25000,
      ceil(54000.0)) = 54000, credit = min(1800000, floor(750.0)) = 750,
      invoice_total = 1800000 + 54000 - 750 = 1853250.
      Evaluating the fee on the gross figure first (fee = ceil(60000.0) = 60000, then
      discounting) yields 1854000 + or - the reordered credit and is WRONG; subtracting
      the credit before step 5 lowers the fee base and is also WRONG.
      Tier boundaries are inclusive on the floor: gross = 2000000 takes 0.10 while
      gross = 1999999 takes 0.05 (discount = floor(99999.95) = 99999, net = 1900000,
      fee = ceil(57000.0) = 57000) — one cent less gross produces a LARGER net, and
      both cases must be asserted.

  # --------------------------------------------- renewal_recommendation_score --
  - name: renewal_recommendation_score
    trigger: "GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary; recomputed onto VendorApp.renewal_score / VendorApp.renewal_recommendation by POST /rostering/app-accounts, POST /rostering/app-accounts/{app_account_id}/record-usage, POST /rostering/app-accounts/{app_account_id}/release, POST /rostering/app-accounts/{app_account_id}/deprovision and POST /rostering/sync-runs/{sync_run_id}/publish"
    algorithm: weighted_scoring
    formula: |
      V = the vendor app; accounts = AppAccount rows under V's BuildingAllocations
      consumed = count(a in accounts : a.seat_status IN {RESERVED, ACTIVE})
      provisioned = count(a in accounts : a.identity_status == PROVISIONED)
      engaged = count(a in accounts : a.identity_status == PROVISIONED
                                      AND a.active_minutes_total >= ENGAGEMENT_MINUTES_FLOOR
                                      AND recency_ok(a))          # variant-dependent
      utilization     = (V.total_seats == 0) ? 0 : consumed / V.total_seats
      engagement      = (engagement_denominator == 0) ? 0
                        : engaged / engagement_denominator          # variant-dependent
      cost_per_engaged_cents = (engaged == 0) ? null
                               : ceil(V.committed_charge_cents / engaged)
      cost_efficiency = (engaged == 0) ? 0
                        : min(1, ENGAGED_COST_TARGET_CENTS / cost_per_engaged_cents)
      raw = W_UTILIZATION * utilization
            + W_ENGAGEMENT * engagement
            + W_COST       * cost_efficiency
      V.renewal_score = round_half_up(raw * 100, 2)
      V.renewal_recommendation =
            RENEW       if V.renewal_score >= RENEW_FLOOR
            RENEGOTIATE if V.renewal_score >= RENEGOTIATE_FLOOR
            DROP        otherwise
    input_set: "Only AppAccount rows belonging to this vendor app's BuildingAllocations. RELEASED seats never count toward `consumed`; DEPROVISIONED and SUSPENDED accounts never count toward `engaged` regardless of their accumulated minutes. Accounts of WITHDRAWN or MERGED_DUPLICATE students have already been released, so they drop out of both terms."
    constants:
      W_UTILIZATION: 0.50
      W_ENGAGEMENT: 0.30
      W_COST: 0.20
      ENGAGEMENT_MINUTES_FLOOR: 120
      ENGAGED_COST_TARGET_CENTS: 1500
      USAGE_WINDOW_DAYS: 30
      RENEW_FLOOR: 70
      RENEGOTIATE_FLOOR: 40
    precision: |
      The three weights sum to exactly 1.00. The score is rounded HALF UP to 2 decimal
      places exactly once, at the very end; no intermediate ratio is rounded, so
      rounding cannot accumulate across the three weighted terms. cost_per_engaged_cents
      is an integer (ceil) before it enters the ratio.
      Boundary fixture: total_seats = 5, price_per_seat_cents = 1000, consumed = 4,
      committed_charge_cents = 4000, engaged = 2 -> utilization = 0.8 (term 0.40),
      engagement = 2/4 = 0.5 (term 0.15), cost_per_engaged = ceil(4000/2) = 2000,
      cost_efficiency = min(1, 1500/2000) = 0.75 (term 0.15), raw = 0.70,
      renewal_score = 70.00 which is exactly RENEW_FLOOR -> RENEW. Dropping either
      engaged account below 120 minutes gives engagement = 0.25 and
      cost_efficiency = min(1, 1500/4000) = 0.375, raw = 0.55, score 55.00 ->
      RENEGOTIATE. The comparison at both floors is `>=`, never `>`.
    variants:
      - name: FINAL_RENEWAL
        when: "VendorApp.status == ACTIVE and Term(V.term_id).state IN {ACTIVE, ROLLED_OVER} — the renewal decision of record"
        difference: "recency_ok(a) requires a.last_activity_date >= (clock date - USAGE_WINDOW_DAYS days), so stale accounts stop counting as engaged; engagement_denominator = consumed (every seat the district is paying for)."
      - name: PROVISIONAL_MID_YEAR
        when: "requested with ?basis=provisional on GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary, for an in-flight pilot that has not accumulated a full usage window"
        difference: "recency_ok(a) is always true (lifetime minutes count, whenever they were logged) and engagement_denominator = provisioned, excluding seats that are merely RESERVED. Divergence fixture: total_seats = 5, price 1000, consumed = 4 (three PROVISIONED accounts plus one RESERVED/PENDING_PROVISION), committed_charge_cents = 4000, two accounts with active_minutes_total = 120 whose last_activity_date is 40 days before the clock. FINAL_RENEWAL scores 0.50*0.8*100 = 40.00 -> RENEGOTIATE (engaged = 0 kills both other terms), while PROVISIONAL_MID_YEAR scores 0.40 + 0.30*(2/3) + 0.20*0.75 = 0.75 -> 75.00 -> RENEW. Same stored data, different score AND different recommendation."

  # ------------------------------------------------------ username_derivation --
  - name: username_derivation
    trigger: "POST /rostering/app-accounts (writes AppAccount.username), GET /rostering/vendor-apps/{vendor_app_id}/roster-feed (emits username and display_name)"
    algorithm: projection
    formula: |
      A = the app account being created; V = VendorApp of A's BuildingAllocation
      subject = Student(A.student_id) if A.subject_type == STUDENT else Teacher(A.teacher_id)

      # ---- step 1: pick the raw identifier per the vendor's transformation rule ----
      base_raw =
        V.identifier_strategy == SIS_ID:
            subject_type == STUDENT  -> Student.sis_student_id
            subject_type == TEACHER  -> Teacher.sis_staff_id
        V.identifier_strategy == EMAIL_LOCALPART:
            subject_type == TEACHER  -> the substring of Teacher.email before the first '@'
            subject_type == STUDENT  -> Student.last_name + "." + Student.first_name[0]
                                        (students carry no district email)
        V.identifier_strategy == STATE_ID:
            subject_type == STUDENT  -> Student.state_student_id
                                        (null -> reject ERR_IDENTIFIER_UNAVAILABLE)
            subject_type == TEACHER  -> reject ERR_IDENTIFIER_UNAVAILABLE

      # ---- step 2: normalise, in exactly this order ----
      2a. lower-case base_raw
      2b. replace every maximal run of characters outside [a-z0-9] with a single "."
      2c. strip leading "." characters
      2d. truncate to MAX_LOCALPART_LEN characters
      2e. strip trailing "." characters
      localpart = result of 2e   (empty -> reject ERR_IDENTIFIER_UNAVAILABLE)

      # ---- step 3: resolve collisions within the same vendor app ----
      taken = { a.username for AppAccount a of V with a.seat_status != RELEASED }
      candidate = localpart + "@" + V.username_domain
      if candidate in taken:
          N = the smallest integer >= COLLISION_SUFFIX_START such that
              localpart + "+" + str(N) + "@" + V.username_domain not in taken
          candidate = localpart + "+" + str(N) + "@" + V.username_domain
      A.username = candidate

      # ---- roster-feed display name (separate per-vendor transformation rule) ----
      display_name = V.name_format == LAST_FIRST
                     ? last_name + ", " + first_name        # raw, NOT normalised
                     : first_name + " " + last_name
    input_set: "Only AppAccount rows of the SAME vendor app with seat_status != RELEASED occupy a username; a released seat frees its username for reuse, and an identical username under a different vendor app is never a collision. DEPROVISIONED accounts that still hold a seat DO occupy their username."
    constants:
      MAX_LOCALPART_LEN: 20
      COLLISION_SUFFIX_START: 2
      SEPARATOR: "."
    precision: |
      PINNED ORDER: truncation (2d) happens BEFORE the trailing-separator strip (2e)
      and BEFORE the collision suffix (step 3), so a suffixed username may exceed
      MAX_LOCALPART_LEN. Truncating after suffixing, or stripping before truncating,
      produces different usernames and is FORBIDDEN.
      Worked example: identifier_strategy = EMAIL_LOCALPART, subject_type = STUDENT,
      first_name = "Maria-Jo", last_name = "Vandenberghe-Mwangi",
      username_domain = "apps.district.k12".
        base_raw = "Vandenberghe-Mwangi.M"
        2a/2b    = "vandenberghe.mwangi.m"   (21 chars)
        2d       = "vandenberghe.mwangi."    (20 chars)
        2e       = "vandenberghe.mwangi"     (19 chars)
        username = "vandenberghe.mwangi@apps.district.k12"
      A second student "Maria" / "Vandenberghe Mwangi" normalises to the same 19-char
      localpart and therefore gets "vandenberghe.mwangi+2@apps.district.k12" — a
      21-character localpart, which is correct. Stripping the trailing separator before
      truncating would instead yield "vandenberghe.mwangi.m"[:20] = "vandenberghe.mwangi."
      and a different collision family.
    variants:
      - name: sis_id_strategy
        when: "VendorApp.identifier_strategy == SIS_ID"
        difference: "the opaque SIS identifier is normalised verbatim, so two students with identical names never collide and a student who is later re-keyed in the SIS gets a brand-new username."
      - name: name_derived_strategy
        when: "VendorApp.identifier_strategy == EMAIL_LOCALPART with subject_type == STUDENT"
        difference: "the username is derived from mutable name fields, so identically-named siblings in the same district DO collide and consume the +N suffix sequence; the same two students under a SIS_ID vendor app produce no collision at all."

  # ------------------------------------------- password_lifecycle_evaluation ---
  - name: password_lifecycle_evaluation
    trigger: "POST /rostering/app-accounts (mints the temporary password), POST /rostering/app-accounts/{app_account_id}/password-set, POST /rostering/app-accounts/{app_account_id}/record-usage, GET /rostering/app-accounts/{app_account_id}"
    algorithm: chronological
    formula: |
      A = the app account
      # POLICY SOURCE: the SUBJECT's building, not the allocation's building.
      P = School(Student(A.student_id).school_id)  if A.subject_type == STUDENT
          School(Teacher(A.teacher_id).school_id)  if A.subject_type == TEACHER

      password_expires_at(A) =
          A.password_state == TEMP_SET  -> A.created_at + P.temp_password_ttl_hours hours
          A.password_state == USER_SET  -> A.last_password_set_at
                                           + P.password_max_age_days days
          A.password_state IN {EXPIRED, LOCKED} -> unchanged (frozen at the value that
                                                   was current when the state was entered)

      # evaluated on every read and on record-usage, before any other effect
      if A.password_state IN {TEMP_SET, USER_SET}
         AND clock_now >= A.password_expires_at:
             A.password_state = EXPIRED

      # password-set acceptance
      accept(new_password) requires
          len(new_password) >= P.min_password_length            else ERR_PASSWORD_TOO_SHORT
          (not P.password_requires_mixed_case) OR
            (new_password has >= 1 [a-z] AND >= 1 [A-Z])        else ERR_PASSWORD_COMPLEXITY
      on accept: A.password_state = USER_SET
                 A.last_password_set_at = clock_now
                 A.failed_login_count = 0
                 A.password_expires_at recomputed by the USER_SET branch

      # lockout
      on record-usage with failed_logins = f (f >= 0):
          A.failed_login_count += f
          if A.failed_login_count >= P.password_lockout_threshold:
              A.password_state = LOCKED
    input_set: "Only the subject's own School row supplies the policy. Accounts with identity_status == DEPROVISIONED are frozen: neither expiry nor lockout is re-evaluated for them and password-set is rejected. A CLOSED building still supplies its stored policy values to already-provisioned accounts."
    constants:
      POLICY_SOURCE: "School of the subject (Student.school_id / Teacher.school_id)"
      MIN_FAILED_LOGINS_PER_REPORT: 0
    precision: |
      Expiry is INCLUSIVE of the boundary instant: the comparison is
      `clock_now >= password_expires_at`, so the account is still usable one millisecond
      before the instant and EXPIRED exactly on it. Note this is the OPPOSITE boundary
      direction from archived_access_window, which is strict (`<`).
      Worked example with the default policy: an account created at
      2026-08-01T00:00:00.000Z with temp_password_ttl_hours = 72 has
      password_expires_at = 2026-08-04T00:00:00.000Z — at clock 2026-08-03T23:59:59.999Z
      it is still TEMP_SET, at clock 2026-08-04T00:00:00.000Z it is EXPIRED. After a
      successful set at 2026-08-04T09:00:00.000Z with password_max_age_days = 180,
      password_expires_at = 2027-01-31T09:00:00.000Z.
      Lockout is also inclusive: with password_lockout_threshold = 5, a cumulative
      failed_login_count of 4 leaves the account usable and 5 locks it.

  # ------------------------------------------------- archived_access_window ----
  - name: archived_access_window
    trigger: "POST /rostering/terms/{term_id}/rollover (writes Term.archived_access_expires_at), GET /rostering/sections/{section_id}, GET /rostering/vendor-apps/{vendor_app_id}/roster-feed, POST /rostering/sync-runs (run_type == ROLLOVER)"
    algorithm: threshold
    formula: |
      T = the term
      at rollover:
          T.archived_access_expires_at =
              (T.end_date + T.archive_retention_days days) at 00:00:00.000Z
      archived_read_permitted(T) = (T.state == ROLLED_OVER)
                                   AND clock_now < T.archived_access_expires_at
      Reads that touch an ARCHIVED Section — GET /rostering/sections/{section_id} for a
      section with status == ARCHIVED, and the roster feed with include_archived=true —
      are served only while archived_read_permitted(T) holds; otherwise they are
      rejected with ERR_ARCHIVE_WINDOW_CLOSED. A ROLLOVER SyncRun may likewise only be
      opened while the window is open.
      While T.state != ROLLED_OVER, T.archived_access_expires_at is null and
      archived_read_permitted is false — the window has not opened, so
      include_archived=true is rejected with ERR_ARCHIVE_WINDOW_CLOSED as well.
    input_set: "Only Sections with status == ARCHIVED are gated; ACTIVE sections of a ROLLED_OVER term (there are none, rollover archives them all) and CANCELLED sections are never served by the archived path. archive_retention_days is read from the Term at rollover time and later edits to the Term do not move an already-computed expiry."
    constants:
      DEFAULT_ARCHIVE_RETENTION_DAYS: 90
      WINDOW_ANCHOR_TIME: "00:00:00.000Z"
    precision: |
      The window comparison is STRICT (`clock_now < archived_access_expires_at`), so the
      expiry instant itself is already closed. Worked example: end_date = 2026-12-18 with
      archive_retention_days = 90 gives archived_access_expires_at =
      2027-03-18T00:00:00.000Z; at clock 2027-03-17T23:59:59.999Z the archived roster is
      served, and at clock 2027-03-18T00:00:00.000Z the identical request is rejected
      with ERR_ARCHIVE_WINDOW_CLOSED. Day arithmetic is calendar-day addition on the
      date, not 90 * 24 hours from an instant. With archive_retention_days = 0 the window
      is open for no time at all: expiry equals end_date at 00:00:00.000Z, which is in
      the past the moment rollover runs.

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
#     violated rule decides the response and no later rule runs)
# =============================================================================
validations:

  # ---- tier A: authentication and authorization (priorities 1-4) ----
  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are both present and non-blank on every request, including reads and including POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the X-Role value is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "entity-backed roles stay inside their own subtree. A VendorIntegrationManager is bound to every VendorApp whose created_by_user_id equals its X-User-ID; PATCH /rostering/vendor-apps/{vendor_app_id}, GET /rostering/vendor-apps/{vendor_app_id}/roster-feed, GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary and POST /rostering/app-accounts/{app_account_id}/record-usage are refused when the governing license was created by someone else (POST /rostering/vendor-apps always passes — it establishes a new binding). A BuildingLicenseAdmin is bound to the School whose id equals its X-User-ID and may only PATCH BuildingAllocations of that building. Checked before existence so a cross-scope probe cannot enumerate ids."
    error_id: ERR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "PATCH /rostering/vendor-apps/{vendor_app_id}, PATCH /rostering/building-allocations/{building_allocation_id}, POST /rostering/app-accounts/{app_account_id}/record-usage, GET /rostering/vendor-apps/{vendor_app_id}/roster-feed, GET /rostering/vendor-apps/{vendor_app_id}/renewal-summary"
  - priority: 4
    category: auth
    check: "segregation of duties on the two-person controls: POST /rostering/sync-runs/{sync_run_id}/publish rejects an X-User-ID equal to sync_run.initiated_by_user_id, and POST /rostering/vendor-apps/{vendor_app_id}/activate-license rejects an X-User-ID equal to the created_by user recorded when the VendorApp was created"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rostering/sync-runs/{sync_run_id}/publish, POST /rostering/vendor-apps/{vendor_app_id}/activate-license"

  # ---- tier B: existence and request shape (priorities 5-7) ----
  - priority: 5
    category: existence
    check: "every id in the path resolves, validated LEFT TO RIGHT; the first unresolvable segment decides the error"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_TERM_NOT_FOUND | ERR_TEACHER_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_VENDOR_APP_NOT_FOUND | ERR_BUILDING_ALLOCATION_NOT_FOUND | ERR_APP_ACCOUNT_NOT_FOUND | ERR_SYNC_RUN_NOT_FOUND | ERR_ERROR_QUEUE_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 6
    category: business_constraint
    check: "request shape: every non-optional field in the endpoint's input is present, every enum value is one of the declared constraints, every integer is inside its declared range, dates are ISO-8601 calendar dates, datetimes are ISO-8601 UTC instants, meeting_days is a non-empty duplicate-free subset of {MON,TUE,WED,THU,FRI}, grade_band_scope is a non-empty subset of {ELEMENTARY,MIDDLE,HIGH}, and POST /rostering/app-accounts carries exactly one of student_id / teacher_id matching its subject_type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request BODY resolves, validated in the order the fields are declared in the endpoint's input list"
    error_id: "ERR_SCHOOL_NOT_FOUND | ERR_TERM_NOT_FOUND | ERR_TEACHER_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_VENDOR_APP_NOT_FOUND | ERR_BUILDING_ALLOCATION_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a FK in the body"

  # ---- tier C: optimistic concurrency (priority 8) ----
  - priority: 8
    category: state
    check: "expected_vendor_app_version equals the current VendorApp.version of the license the write touches (VendorApp resolved through building_allocation_id for POST /rostering/app-accounts, and through the path id for PATCH /rostering/building-allocations/{building_allocation_id}). Checked after existence and shape so a stale-version reply never leaks whether a malformed body would also have failed."
    error_id: ERR_STALE_VENDOR_APP_VERSION
    http_status: 412
    applies_to: "POST /rostering/app-accounts, PATCH /rostering/building-allocations/{building_allocation_id}"

  # ---- tier D: state preconditions (priorities 9-21) ----
  - priority: 9
    category: state
    check: "the governing School has status == ACTIVE when creating a Teacher, Student or Section under it, and when activating a license that would allocate seats to it"
    error_id: ERR_SCHOOL_CLOSED
    http_status: 409
    applies_to: "POST /rostering/teachers, POST /rostering/students, POST /rostering/sections"
  - priority: 10
    category: state
    check: "the governing Term has state == ACTIVE for section creation, enrollment creation, enrollment drops and FULL/DELTA sync runs; state == ACTIVE is also required to roll the term over, and PLANNED to activate it"
    error_id: ERR_TERM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rostering/sections, POST /rostering/enrollments, POST /rostering/enrollments/{enrollment_id}/drop, POST /rostering/terms/{term_id}/activate, POST /rostering/terms/{term_id}/rollover, POST /rostering/sync-runs"
  - priority: 11
    category: state
    check: "the Student has enrollment_state == ENROLLED when being enrolled, withdrawn, or given an app account; a WITHDRAWN or MERGED_DUPLICATE student is inert"
    error_id: ERR_STUDENT_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /rostering/enrollments, POST /rostering/students/{student_id}/withdraw, POST /rostering/app-accounts"
  - priority: 12
    category: state
    check: "the Teacher has employment_status == ACTIVE when being named primary_teacher_id of a Section, when being separated, and when being given an app account"
    error_id: ERR_TEACHER_SEPARATED
    http_status: 409
    applies_to: "POST /rostering/sections, POST /rostering/teachers/{teacher_id}/separate, POST /rostering/app-accounts"
  - priority: 13
    category: state
    check: "the Enrollment has roster_status IN {PENDING_ADD, ACTIVE} when a drop is requested; a PENDING_DROP or DROPPED row cannot be dropped again"
    error_id: ERR_ENROLLMENT_NOT_DROPPABLE
    http_status: 409
    applies_to: "POST /rostering/enrollments/{enrollment_id}/drop"
  - priority: 14
    category: state
    check: "the VendorApp has status == ACTIVE when opening a sync run or provisioning an app account against one of its allocations; DRAFT, SUSPENDED and TERMINATED licenses accept neither"
    error_id: ERR_VENDOR_APP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rostering/sync-runs, POST /rostering/app-accounts, PATCH /rostering/building-allocations/{building_allocation_id}"
  - priority: 15
    category: state
    check: "activate-license requires VendorApp.status == DRAFT; a license may only be allocated once"
    error_id: ERR_VENDOR_APP_ALREADY_ACTIVATED
    http_status: 409
    applies_to: "POST /rostering/vendor-apps/{vendor_app_id}/activate-license"
  - priority: 16
    category: state
    check: "transform requires SyncRun.state IN {EXTRACTED, HELD}; publish requires SyncRun.state == TRANSFORMED"
    error_id: ERR_SYNC_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /rostering/sync-runs/{sync_run_id}/transform, POST /rostering/sync-runs/{sync_run_id}/publish"
  - priority: 17
    category: state
    check: "the SyncRun is not SUPERSEDED; once a newer run for the same vendor app has been opened the old run is inert and its error queue items are already dismissed"
    error_id: ERR_SYNC_RUN_SUPERSEDED
    http_status: 409
    applies_to: "POST /rostering/sync-runs/{sync_run_id}/transform, POST /rostering/sync-runs/{sync_run_id}/publish, POST /rostering/error-queue-items/{error_queue_item_id}/resolve-match, POST /rostering/error-queue-items/{error_queue_item_id}/merge-duplicate"
  - priority: 18
    category: state
    check: "the AppAccount still holds its seat (seat_status IN {RESERVED, ACTIVE}); a RELEASED seat accepts no release, usage report or deprovision. password-set is deliberately EXEMPT: the identity axis is independent, so a summer-suspended identity whose seat was already released can still be reactivated"
    error_id: ERR_SEAT_ALREADY_RELEASED
    http_status: 409
    applies_to: "POST /rostering/app-accounts/{app_account_id}/release, POST /rostering/app-accounts/{app_account_id}/record-usage, POST /rostering/app-accounts/{app_account_id}/deprovision"
  - priority: 19
    category: state
    check: "the AppAccount has identity_status != DEPROVISIONED for password sets, usage reports and further deprovision calls; a deprovisioned identity is frozen"
    error_id: ERR_ACCOUNT_DEPROVISIONED
    http_status: 409
    applies_to: "POST /rostering/app-accounts/{app_account_id}/password-set, POST /rostering/app-accounts/{app_account_id}/record-usage, POST /rostering/app-accounts/{app_account_id}/deprovision"
  - priority: 20
    category: state
    check: "the ErrorQueueItem has status == OPEN, and its category matches the resolution verb (UNMATCHED_TEACHER for resolve-match, DUPLICATE_STUDENT for merge-duplicate)"
    error_id: ERR_ERROR_QUEUE_ITEM_NOT_OPEN
    http_status: 409
    applies_to: "POST /rostering/error-queue-items/{error_queue_item_id}/resolve-match, POST /rostering/error-queue-items/{error_queue_item_id}/merge-duplicate"
  - priority: 21
    category: state
    check: "archived-class access is inside the retention window per archived_access_window: reading an ARCHIVED Section, requesting the roster feed with include_archived=true, or opening a ROLLOVER sync run requires Term.state == ROLLED_OVER AND clock_now < Term.archived_access_expires_at"
    error_id: ERR_ARCHIVE_WINDOW_CLOSED
    http_status: 409
    applies_to: "GET /rostering/sections/{section_id}, GET /rostering/vendor-apps/{vendor_app_id}/roster-feed, POST /rostering/sync-runs"

  # ---- tier E: business safety / identity compliance (priorities 22-26) ----
  - priority: 22
    category: business_safety
    check: "a LOCKED password may only be reset by an IdentityAdmin; any other role is refused even though it passed the endpoint role check"
    error_id: ERR_ACCOUNT_LOCKED
    http_status: 403
    applies_to: "POST /rostering/app-accounts/{app_account_id}/password-set"
  - priority: 23
    category: business_safety
    check: "len(new_password) >= School.min_password_length of the SUBJECT's building (not the allocation's building)"
    error_id: ERR_PASSWORD_TOO_SHORT
    http_status: 422
    applies_to: "POST /rostering/app-accounts/{app_account_id}/password-set"
  - priority: 24
    category: business_safety
    check: "when the subject's School has password_requires_mixed_case == true the new password contains at least one lower-case and one upper-case letter; length is checked first so a short all-lower-case password reports ERR_PASSWORD_TOO_SHORT"
    error_id: ERR_PASSWORD_COMPLEXITY
    http_status: 422
    applies_to: "POST /rostering/app-accounts/{app_account_id}/password-set"
  - priority: 25
    category: business_safety
    check: "publish is refused while SyncRun.blocking_error_count > 0 — unmatched teachers under HOLD_RUN, duplicate students and (under overage_policy BLOCK) seat shortfalls must be triaged first"
    error_id: ERR_BLOCKING_ERRORS_UNRESOLVED
    http_status: 409
    applies_to: "POST /rostering/sync-runs/{sync_run_id}/publish"
  - priority: 26
    category: business_safety
    check: "an explicit deprovision is never post-dated: the requested effective_date must not be after the clock date, and when AppAccount.deprovision_scheduled_date is non-null the clock date must also be >= it"
    error_id: ERR_DEPROVISION_NOT_DUE
    http_status: 409
    applies_to: "POST /rostering/app-accounts/{app_account_id}/deprovision"

  # ---- tier F: temporal constraints (priorities 27-32) ----
  - priority: 27
    category: business_temporal
    check: "Term dates are ordered: start_date <= add_drop_cutoff_date <= end_date"
    error_id: ERR_TERM_DATE_ORDER
    http_status: 422
    applies_to: "POST /rostering/terms"
  - priority: 28
    category: business_temporal
    check: "term lifecycle windows: activate requires the clock date <= Term.end_date (a term cannot be opened after it has already ended) and rollover requires the clock date >= Term.end_date (a term cannot be rolled over before it ends)"
    error_id: ERR_TERM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /rostering/terms/{term_id}/activate, POST /rostering/terms/{term_id}/rollover"
  - priority: 29
    category: business_temporal
    check: "Enrollment.requested_effective_date falls inside [Term.start_date, Term.end_date] of the section's term"
    error_id: ERR_EFFECTIVE_DATE_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /rostering/enrollments"
  - priority: 30
    category: business_temporal
    check: "drop_effective_date >= Enrollment.effective_date (or >= requested_effective_date while the row is still PENDING_ADD), and <= Term.end_date"
    error_id: ERR_DROP_BEFORE_ADD
    http_status: 422
    applies_to: "POST /rostering/enrollments/{enrollment_id}/drop"
  - priority: 31
    category: business_temporal
    check: "no student double-booking: the new enrollment's HALF-OPEN date interval [requested_effective_date, drop_effective_date_or_term_end) must not overlap the interval of another non-DROPPED enrollment of the same student whose section has the same period_index and at least one shared meeting_day. Two intervals that merely touch (one ends on the day the next begins) do NOT overlap."
    error_id: ERR_STUDENT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /rostering/enrollments"
  - priority: 32
    category: business_temporal
    check: "no teacher double-booking: a teacher may not be primary_teacher_id of two ACTIVE sections in the same Term whose period windows overlap after a one-period travel buffer is applied — the CLOSED interval [period_index - PERIOD_TRAVEL_BUFFER, period_index + PERIOD_TRAVEL_BUFFER] with PERIOD_TRAVEL_BUFFER = 1 — and that share at least one meeting_day. Adjacent periods therefore DO conflict for teachers, while the student rule uses exact period equality on a half-open date interval."
    error_id: ERR_TEACHER_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /rostering/sections, POST /rostering/error-queue-items/{error_queue_item_id}/resolve-match"

  # ---- tier G: referential coherence (priorities 33-35) ----
  - priority: 33
    category: business_referential
    check: "building coherence: Enrollment requires Student.school_id == Section.school_id; POST /rostering/app-accounts requires the subject's school_id == BuildingAllocation.school_id; resolve-match requires the replacement teacher's school_id == Section.school_id"
    error_id: ERR_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /rostering/enrollments, POST /rostering/app-accounts, POST /rostering/error-queue-items/{error_queue_item_id}/resolve-match"
  - priority: 34
    category: business_referential
    check: "merge-duplicate's surviving_student_id is one of {item.subject_student_id, item.duplicate_candidate_student_id} and the two candidates are distinct students of the same School"
    error_id: ERR_MERGE_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /rostering/error-queue-items/{error_queue_item_id}/merge-duplicate"
  - priority: 35
    category: business_referential
    check: "username_derivation can produce an identifier for this subject under this vendor's identifier_strategy: STATE_ID requires a non-null Student.state_student_id and rejects teachers outright; EMAIL_LOCALPART requires a non-blank Teacher.email for teachers; every strategy requires a non-empty normalised localpart"
    error_id: ERR_IDENTIFIER_UNAVAILABLE
    http_status: 422
    applies_to: "POST /rostering/app-accounts"

  # ---- tier H: uniqueness and capacity constraints (priorities 36-43) ----
  - priority: 36
    category: business_constraint
    check: "Student.sis_student_id is unique across the district, and Teacher.sis_staff_id is unique across the district"
    error_id: ERR_DUPLICATE_SIS_ID
    http_status: 409
    applies_to: "POST /rostering/students, POST /rostering/teachers"
  - priority: 37
    category: business_constraint
    check: "at most one non-DROPPED Enrollment exists per (section_id, student_id)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /rostering/enrollments"
  - priority: 38
    category: business_constraint
    check: "at most one AppAccount with seat_status IN {RESERVED, ACTIVE} exists per (VendorApp, subject); a RELEASED account may be re-created"
    error_id: ERR_DUPLICATE_APP_ACCOUNT
    http_status: 409
    applies_to: "POST /rostering/app-accounts"
  - priority: 39
    category: business_constraint
    check: "Section.active_enrollment_count < Section.max_seats before an enrollment is admitted; the count includes PENDING_ADD and ACTIVE rows but not PENDING_DROP or DROPPED"
    error_id: ERR_SECTION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /rostering/enrollments"
  - priority: 40
    category: business_constraint
    check: "the subject's own grade band is listed in VendorApp.grade_band_scope. For a Student that band is grade_band_of(Student.grade_level) as defined by sync_scope_resolution (ELEMENTARY 0..5, MIDDLE 6..8, HIGH 9..12); for a Teacher it is School.grade_band of the teacher's building. A grade-7 student housed in a K-8 building whose School.grade_band is ELEMENTARY therefore cannot take a seat on an ELEMENTARY-only license even though that building holds an allocation and the school-coherence rule at priority 33 is satisfied"
    error_id: ERR_GRADE_BAND_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /rostering/app-accounts"
  - priority: 41
    category: business_constraint
    check: "activate-license finds at least one ACTIVE School whose grade_band is in VendorApp.grade_band_scope"
    error_id: ERR_NO_ELIGIBLE_BUILDINGS
    http_status: 422
    applies_to: "POST /rostering/vendor-apps/{vendor_app_id}/activate-license"
  - priority: 42
    category: business_constraint
    check: "a PATCH that raises allocated_seats keeps sum(allocated_seats) + sum(borrowed_seats) over the vendor app's allocations <= VendorApp.total_seats"
    error_id: ERR_ALLOCATION_EXCEEDS_LICENSE
    http_status: 409
    applies_to: "PATCH /rostering/building-allocations/{building_allocation_id}"
  - priority: 43
    category: business_constraint
    check: "a PATCH that lowers allocated_seats keeps allocated_seats >= consumed_seats for that building; seats already in use cannot be reclaimed by reallocation"
    error_id: ERR_ALLOCATION_BELOW_CONSUMED
    http_status: 409
    applies_to: "PATCH /rostering/building-allocations/{building_allocation_id}"

  # ---- tier I: fiscal / seat capacity (priorities 44-45, always last) ----
  - priority: 44
    category: business_fiscal
    check: "seat_admission_capacity admits the account: free_seats >= 1 in the target BuildingAllocation, or the license is POOL_FALLBACK with a non-empty district pool"
    error_id: ERR_BUILDING_ALLOCATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /rostering/app-accounts"
  - priority: 45
    category: business_fiscal
    check: "under overage_policy POOL_FALLBACK, VendorApp.unallocated_seats >= 1 when the target building is already full"
    error_id: ERR_DISTRICT_SEATS_EXHAUSTED
    http_status: 409
    applies_to: "POST /rostering/app-accounts"

