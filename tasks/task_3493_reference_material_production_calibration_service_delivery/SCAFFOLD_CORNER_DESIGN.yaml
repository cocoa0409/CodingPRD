      - name: duplicate_service_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_SERVICE_CODE]", "validations[priority=9]"]
        distinguishing_aspect: "Second calibration service with the same service_code is rejected 409 ERR_DUPLICATE_SERVICE_CODE."
        test_recipe:
          setup: ["service SVC-C40 exists"]
          setup_api_calls:
            - call: "POST /metrology/calibration-services"
              payload: { service_code: "SVC-C40", measurand: "DC voltage", base_fee_cents: 20000, per_point_fee_cents: 1500, standard_turnaround_days: 5 }
              as: ProgramAdmin
          trigger:
