    status: 200
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: "/schedule-grids/{gridId}/slot-assignments"
    entity: SlotAssignment
    purpose: "Place a show on a recurring weekday window of a mutable grid. Windows are half-open minute ranges and must stay 2 minutes clear of every live neighbour for the station identification. conflict_policy SENIORITY_PREEMPT lets a challenger whose host outranks the incumbent host by at least 5.00 seniority points take the window, preempting the incumbent occupation instead of being rejected. Guarded by expected_grid_version."
    roles: [ProgramDirector]
    input: [expected_grid_version, program_id, day_of_week, start_minute, duration_minutes, "conflict_policy?"]
    output: SlotAssignment
    status: 201
    errors: [ERR_VALIDATION, ERR_STALE_GRID_VERSION, ERR_GRID_NOT_MUTABLE, ERR_SLOT_CONFLICT, ERR_SENIORITY_MARGIN_UNMET, ERR_WEEK_MINUTES_EXCEEDED, ERR_PROGRAM_NOT_FOUND, ERR_GRID_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/schedule-grids/{gridId}/publish"
    entity: ScheduleGrid
    purpose: "Publish an IN_REVIEW grid once every occupation is confirmed and the public-affairs share reaches 8.00 percent. Flips every confirmed show to ON_AIR_ACTIVE, supersedes the previously published grid, releases that grid's confirmed occupations and returns any show left with no live occupation to APPROVED_UNSCHEDULED. Guarded by expected_grid_version."
    roles: [ProgramDirector]
    input: [expected_grid_version]
    output: ScheduleGrid
    status: 200
    errors: [ERR_VALIDATION, ERR_STALE_GRID_VERSION, ERR_GRID_NOT_MUTABLE, ERR_INVALID_STATE, ERR_GRID_EMPTY, ERR_TENTATIVE_SLOTS_PRESENT, ERR_DIVERSITY_QUOTA_UNMET, ERR_GRID_NOT_FOUND, ERR_UNAUTHORIZED]

