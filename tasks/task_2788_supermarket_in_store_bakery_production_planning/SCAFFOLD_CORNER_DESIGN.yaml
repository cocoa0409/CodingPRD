          - calculations.bake_day_rollups
          - calculations.shrink_rate
          - entities.WasteRecord.fields.disposition_reason
          - entities.PickupSlot.fields.slot_status
        distinguishing_aspect: "Every one of the six declared close side effects is observed on one request: a DONATED WasteRecord for the 80 unsold units, the run flipped to CLEARED, the leftover SCHEDULED run CANCELLED with DAY_CLOSED, the CONFIRMED cake EXPIRED with its 8 reserved units released, the slot CLOSED, and the shrink recomputation flipping markdown_authorization to MANAGER_ONLY."
