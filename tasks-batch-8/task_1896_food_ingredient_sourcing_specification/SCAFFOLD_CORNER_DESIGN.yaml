          - entities.FormulaImpactAssessment.fields.total_delta_per_unit
        distinguishing_aspect: |
          formula_impact_delta over two pinned specs: from-spec targets
          moisture 5 / density 1.04; to-spec targets moisture 4 / density 1.06;
          sensitivities moisture 0.10 per unit, density 0.50 per unit.
          delta_moisture = -1.0000 -> cost -0.1000; delta_density = 0.0200 ->
          cost 0.0100; total = -0.0900; no allergen/COO change -> sign-off not
          required.
        test_recipe:
          setup:
            - "Ingredient IMP-1 EFFECTIVE spec v1 (moisture MINOR 0..10 t5; density MINOR 0..2 t1.04)"
            - "Suppliers SA (US) and SB (US) both QUALIFIED"
            - "Source A pinned to v1, declarations US/NONE, activated while v1 EFFECTIVE"
            - "Spec v2 (moisture target 4, density target 1.06) created with supersedes_spec_id=v1, approved, made effective: v1 SUPERSEDED and source A swept to SUSPENDED"
            - "Source B pinned to v2, declarations US/NONE, ACTIVE (assess requires to-source ACTIVE; the request may reference SUSPENDED from-source A since creation checks only FK existence and coherence)"
            - "Clock at default 2026-08-01"
