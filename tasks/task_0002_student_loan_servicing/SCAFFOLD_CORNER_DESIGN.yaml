              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
          trigger:
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "SAVE", agi_cents: 3000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan_id: $.data.id }
          assert:
            - "RepaymentPlan.${plan_id}.monthly_payment_cents == 0"

      - name: dual_variant_calculation_idr_vs_standard
        claim_type: dual_variant_calculation
        grounds:
          - calculations.plan_monthly_payment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / plan_monthly_payment_idr_save_vs_ibr_divergence
          rationale: "Variant divergence between IBR/PAYE/SAVE on identical inputs is the named §1.8 instance."

