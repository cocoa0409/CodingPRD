# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_2015_adjunct_faculty_hiring_contract_management
# §1.8 Test Targeting Index: 9 rules x 2 instances = 18 instances.
#
# Shared fixture literals used across instances (each instance still spells out
# its own chain; these notes document the precomputed numbers):
#   TERM 2026FA: start 2026-08-24, end 2026-12-11 (110 inclusive days,
#   15 whole weeks), early census 2026-09-14, late census 2026-11-02.
#   PCH schedule: PER_CONTACT_HOUR, base_rate_cents=200000, step 5000 cap 5,
#   effective window [2026-08-01, 2027-01-31).
#   Section with weekly_contact_hours=3.0, department contact_hour_value=1.00
#     -> load_units 3.00; gross = 200000 * 3.0 * 15 = 9,000,000 cents.
#   Pre-census cancel payable = round_half_up(9000000 * 0.10) + 5000 = 905,000.
#   Late cancel on 2026-10-19 (elapsed 57/110): earned 4,663,636 > floor
#   2,250,000 -> payable 4,663,636.
#   Late cancel exactly on early census 2026-09-14 (elapsed 22/110): earned
#   1,800,000 < floor 2,250,000 -> payable 2,250,000 (floor wins).
#   Payroll periods (regular 4-way): P1 08-24..09-20 (28d), P2 09-21..10-18
#   (28d), P3 10-19..11-15 (28d), P4 11-16..12-13 (26d); sum 110.
#   DAYS_WEIGHTED on payable 9,000,000: [2290909, 2290909, 2290909, 2127273].
#   EQUAL_SPLIT on payable 450,000 (PER_COURSE): [112500, 112500, 112500, 112500].
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Contract pay vs Faculty load)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contract_pay_provisional_vs_final_after_late_cancellation
        grounds:
          - calculations.contract_gross_pay
          - calculations.cancellation_partial_pay
          - state_machines.Contract.ACTIVE_to_CANCELLED_LATE
        distinguishing_aspect: |
          Entity domain = Contract pay. The provisional variant (gross 9,000,000
          cents computed at issuance) and the final variant (days-elapsed
          cancellation pay 4,663,636 cents) are produced from IDENTICAL contract
          inputs; only the terminal-event context selects the variant, and the
          two values must differ exactly as computed.
        test_recipe:
          setup:
            - "Term 2026FA OPEN, spanning 2026-08-24..2026-12-11 with early census 2026-09-14 and late census 2026-11-02"
            - "Department MATH with contact_hour_value 1.00, active"
            - "PUBLISHED PER_CONTACT_HOUR RateSchedule (MASTERS, base 200000, step 5000 cap 5, window 2026-08-01..2027-01-31)"
            - "Faculty hired via full application chain; compliance COMPLIANT after BACKGROUND_CHECK + TRAINING verified; completed_terms 0"
            - "Section ENG-101-01 in 2026FA, weekly_contact_hours 3.0, min_enrollment 5, enrollment 20, RUNNING (clock advanced past 2026-08-24)"
            - "Contract issued then ACTIVE with gross_pay_cents 9000000 and payable_cents 9000000 (provisional variant)"
            - "Logical clock at 2026-10-19T12:00:00Z (>= early census -> late tier)"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "MATH", name: "Mathematics", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_CONTACT_HOUR", base_rate_cents: 200000, longevity_step_cents: 5000, longevity_step_cap: 5, effective_start_date: "2026-08-01", effective_end_date: "2027-01-31" }
              as: HRAdmin
              captures: { sched_id: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_id}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Math Adjunct Pool", min_education_tier: "MASTERS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Alice Adjunct", applicant_email: "alice@x.edu", claimed_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRANSCRIPT", evidence_ref: "ev-transcript-1", verified_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_t_id: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "BACKGROUND_CHECK", evidence_ref: "ev-bg-1" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_bg_id: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-1" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_tr_id: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_bg_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            # approve by a DIFFERENT reviewer to satisfy segregation of duties
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_2"
              captures: { faculty_id: $.data.hired_faculty_id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "ENG-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 20, min_enrollment: 5 }
              as: DepartmentChair
              captures: { section_id: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fac_v: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${section_id}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fac_v}" }
              as: DepartmentChair
              captures: { contract_id: $.data.id }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-10-19T12:00:00Z" }, as: HRAdmin }
          trigger:
            - call: "POST /adjunct-hr/sections/${section_id}/cancel"
              payload: { cancellation_reason: "PROGRAM_CUT" }
              as: DepartmentChair
            - call: "GET /adjunct-hr/contracts/${contract_id}"
              payload: {}
              as: HRAdmin
              captures: { final_payable: $.data.payable_cents, final_gross: $.data.gross_pay_cents }
          assert:
            - "Contract.${contract_id}.gross_pay_cents == 9000000 (provisional variant unchanged at issuance value)"
            - "Contract.${contract_id}.payable_cents == 4663636 (final variant: elapsed 57 of 110 days -> earned 4663636 > floor 2250000)"
            - "Contract.${contract_id}.contract_status == CANCELLED_LATE"
            - "4663636 != 9000000 — the two variants of the same contract data diverge"

      - name: faculty_load_scheduled_vs_actual_variant_divergence
        grounds:
          - calculations.term_load_units
          - state_machines.Contract.ISSUED_to_ACTIVE
          - entities.AdjunctFaculty.fields.current_term_load_units
        distinguishing_aspect: |
          Entity domain = AdjunctFaculty load (different domain from instance 1's
          Contract pay). With one ISSUED contract of load_units 3.00 and zero
          ACTIVE contracts, the scheduled variant reports 3.00 while the actual
          variant reports 0.00 on the SAME stored data; benefits_eligible is
          gated by the actual variant only.
        test_recipe:
          setup:
            - "Same department/term/schedule fixture; faculty COMPLIANT"
            - "Section SCHEDULED (clock BEFORE term start 2026-08-24) so the issued contract stays ISSUED"
            - "One contract ISSUED with load_units 3.00; no ACTIVE contracts"
            - "Term load_cap_units 4.50"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "ENGL", name: "English", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_CONTACT_HOUR", base_rate_cents: 200000, longevity_step_cents: 5000, longevity_step_cap: 5, effective_start_date: "2026-08-01", effective_end_date: "2027-01-31" }
              as: HRAdmin
              captures: { sched_id: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_id}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "English Adjunct Pool", min_education_tier: "MASTERS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Bob Adjunct", applicant_email: "bob@x.edu", claimed_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRANSCRIPT", evidence_ref: "ev-t-bob", verified_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_t_id: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "BACKGROUND_CHECK", evidence_ref: "ev-b-bob" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_b_id: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-bob" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_tr_id: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_b_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_2"
              captures: { faculty_id: $.data.hired_faculty_id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "ENG-201", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 25, min_enrollment: 5 }
              as: DepartmentChair
              captures: { section_id: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fac_v: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${section_id}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fac_v}" }
              as: DepartmentChair
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /adjunct-hr/faculty/${faculty_id}/load"
              payload: { variant: "scheduled" }
              as: HRAdmin
              captures: { sched_load: $.data.load_units }
            - call: "GET /adjunct-hr/faculty/${faculty_id}/load"
              payload: { variant: "actual" }
              as: HRAdmin
              captures: { actual_load: $.data.load_units, eligible: $.data.benefits_eligible }
          assert:
            - "scheduled variant load_units == 3.00 (ISSUED contract counted)"
            - "actual variant load_units == 0.00 (only ACTIVE contracts counted)"
            - "benefits_eligible == false (actual variant governs; 0.00 < 4.50)"
            - "Contract.${contract_id}.contract_status == ISSUED (section still SCHEDULED pre-term)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) tiered multi-input vs (b) nested rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gross_pay_tiered_longevity_interaction
        grounds:
          - calculations.contract_gross_pay
          - entities.RateSchedule.fields.longevity_step_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — rate_basis branch
          selection x longevity steps min(completed_terms, step_cap) x whole-week
          term span. A faculty with completed_terms 7 against cap 5 gets exactly
          5 steps (rate 225000), and the PER_CONTACT_HOUR branch multiplies by
          contact hours AND whole weeks: 225000 * 3.0 * 15 = 10,125,000, which
          differs from both the uncapped-step value and the PER_COURSE branch.
        test_recipe:
          setup:
            - "Department/term/schedule fixture; faculty hired and given 7 completed terms by completing 7 contracts across 7 prior terms is impractical — instead use two sections in ONE term and drive completed_terms via the rollover cascade across two terms, or pin completed_terms through 2 completed terms (rate 210000) and a third contract gross 9450000"
            - "Chosen pin: faculty with completed_terms == 2 (two completed prior contracts), schedule cap 5 step 5000 -> effective rate 210000; new contract on 3.0-contact-hour section -> gross 210000 * 3.0 * 15 = 9,450,000"
            - "Faculty completed_terms reached 2 by: contract A on section FA-1 completed via rollover of term 2026SP, contract B on section SU-1 completed via rollover of term 2026SU"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2025-11-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "HIST", name: "History", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026SP", start_date: "2026-01-12", end_date: "2026-05-08", early_census_date: "2026-02-02", late_census_date: "2026-03-30", load_cap_units: 9.00 }
              as: HRAdmin
              captures: { term_sp: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026SU", start_date: "2026-06-01", end_date: "2026-07-24", early_census_date: "2026-06-15", late_census_date: "2026-07-06", load_cap_units: 9.00 }
              as: HRAdmin
              captures: { term_su: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 9.00 }
              as: HRAdmin
              captures: { term_fa: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_sp}/open", payload: {}, as: HRAdmin }
            - { call: "POST /adjunct-hr/terms/${term_su}/open", payload: {}, as: HRAdmin }
            - { call: "POST /adjunct-hr/terms/${term_fa}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_CONTACT_HOUR", base_rate_cents: 200000, longevity_step_cents: 5000, longevity_step_cap: 5, effective_start_date: "2025-12-01", effective_end_date: "2027-01-31" }
              as: HRAdmin
              captures: { sched_id: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_id}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026SP", title: "History Pool", min_education_tier: "MASTERS", open_date: "2025-11-01", close_date: "2025-12-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Carol Adjunct", applicant_email: "carol@x.edu", claimed_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "DEGREE", evidence_ref: "ev-deg-carol", verified_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_d_id: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "BACKGROUND_CHECK", evidence_ref: "ev-bg-carol" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_b_id: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-carol" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_tr_id: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_d_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_b_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr_id}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_2"
              captures: { faculty_id: $.data.hired_faculty_id }
            # --- term 1 contract (2026SP), complete it ---
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026SP", course_code: "HIS-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 30, min_enrollment: 5 }
              as: DepartmentChair
              captures: { sec_sp: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fac_v1: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${sec_sp}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fac_v1}" }
              as: DepartmentChair
              captures: { con_sp: $.data.id }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-01-12T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /adjunct-hr/sections/${sec_sp}/complete", payload: {}, as: DepartmentChair }
            # --- term 2 contract (2026SU), complete it ---
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026SU", course_code: "HIS-201", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 28, min_enrollment: 5 }
              as: DepartmentChair
              captures: { sec_su: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fac_v2: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${sec_su}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fac_v2}" }
              as: DepartmentChair
              captures: { con_su: $.data.id }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-07-25T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /adjunct-hr/sections/${sec_su}/complete", payload: {}, as: DepartmentChair }
            # --- term 3 section for the measured contract ---
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "HIS-301", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 22, min_enrollment: 5 }
              as: DepartmentChair
              captures: { sec_fa: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fac_v3: $.data.version, completed_terms: $.data.completed_terms }
          trigger:
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${sec_fa}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fac_v3}" }
              as: DepartmentChair
              captures: { con_fa: $.data.id, gross_fa: $.data.gross_pay_cents }
          assert:
            - "AdjunctFaculty.${faculty_id}.completed_terms == 2 before the measured issuance"
            - "effective rate = 200000 + min(2, 5) * 5000 = 210000 cents"
            - "Contract.${con_fa}.gross_pay_cents == 9450000 (210000 * 3.0 contact-hours * 15 whole weeks)"
            - "Contract.${con_fa}.load_units == 3.00 (weekly_contact_hours * contact_hour_value 1.00)"
            - "Contract.${con_fa}.payable_cents == 9450000 (provisional equals gross pre-terminal-event)"

