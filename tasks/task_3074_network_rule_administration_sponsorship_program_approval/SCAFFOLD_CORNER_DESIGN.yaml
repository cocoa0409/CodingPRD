scaffold_corner_design:

  - section: entities
    instances:
      - name: member_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: [entities.Member]
        distinguishing_aspect: "POST /network/members with only required inputs yields 201, status APPLICATION, settled_balance_cents 0, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "New Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id, m1_status: $.data.status, m1_bal: $.data.settled_balance_cents, m1_v: $.data.version }
          trigger: []
          assert:
            - "Member.${m1}.status == APPLICATION"
            - "Member.${m1}.settled_balance_cents == 0"
            - "Member.${m1}.version == 1"

      - name: member_creation_invalid_enum_rejected
        claim_type: type_constraint
        grounds:
          - entities.Member.fields.member_kind
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "member_kind 'OPERATOR' is outside {ISSUER, ACQUIRER, BOTH} and is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Placeholder", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/members"
              payload: { legal_name: "X", member_kind: "OPERATOR", region: "NA" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: member_creation_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.Member.fields.region
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required region yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Placeholder", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/members"
              payload: { legal_name: "X", member_kind: "ISSUER" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: merchant_xor_boarding_constraint
        claim_type: type_constraint
        grounds:
          - entities.Merchant.fields.participant_id
          - entities.Merchant.fields.acquirer_member_id
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Boarding a merchant with BOTH participant_id and acquirer_member_id set is rejected with ERR_VALIDATION; exactly one parent channel is required."
        test_recipe:
          setup: ["Acquirer member A ACTIVE; participant P ACTIVE under A"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "P Co", sponsor_member_id: "${m_a}", program_name: "PP" }
              as: SponsorshipManager
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/approve"
              payload: {}
              as: SponsorshipManager
          trigger:
            - call: "POST /network/merchants"
              payload: { participant_id: "${p1}", acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 1000000 }
              as: SponsorshipManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (422)"

      - name: bin_prefix_format_constraint
        claim_type: type_constraint
        grounds:
          - entities.BinRange.fields.bin_prefix
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "A 5-digit bin_prefix violates the exactly-6-digits constraint and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Issuer member ACTIVE"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "EU" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /network/bin-ranges"
              payload: { bin_prefix: "41111", issuer_member_id: "${m1}" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (422)"

      - name: participant_computed_fraud_count_increments
        claim_type: computed_fields
        grounds: [entities.Participant.fields.fraud_attributed_count, state_machines.FraudCase.REPORTED_to_CONFIRMED]
        distinguishing_aspect: "Participant.fraud_attributed_count starts at 0, and confirming one fraud case against a merchant boarded under that participant increments it to exactly 1."
        test_recipe:
          setup: ["Acquirer A ACTIVE; participant P ACTIVE under A; merchant Mc under P; fraud case F reported on Mc"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "P Co", sponsor_member_id: "${m_a}", program_name: "PP" }
              as: SponsorshipManager
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/approve"
              payload: {}
              as: SponsorshipManager
            - call: "POST /network/merchants"
              payload: { participant_id: "${p1}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 5000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/fraud-cases"
              payload: { merchant_id: "${mc}", reported_by_member_id: "${m_a}", fraud_amount_cents: 2000 }
              as: FraudAnalyst
              captures: { fc: $.data.id }
          trigger:
            - call: "POST /network/fraud-cases/${fc}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "GET /network/participants/${p1}"
              payload: {}
              as: FraudAnalyst
              captures: { p_count: $.data.fraud_attributed_count }
          assert:
            - "Participant.${p1}.fraud_attributed_count == 1"

      - name: dispute_evidence_immutable_append_only
        claim_type: immutability
        grounds: [entities.DisputeEvidence]
        distinguishing_aspect: "DisputeEvidence has common_fields: false — no update endpoint exists, no version field is exposed, and each submission appends a new row rather than mutating prior evidence."
        test_recipe:
          setup: ["Issuer I, acquirer A ACTIVE; merchant Mc; dispute D OPENED with two evidence submissions"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 1000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/disputes"
              payload: { reason_code: "10.4", issuer_member_id: "${m_i}", acquirer_member_id: "${m_a}", merchant_id: "${mc}", transaction_amount_cents: 10000, currency: "USD" }
              as: Member
              as_user_id: "${m_i}"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /network/disputes/${d1}/evidence"
              payload: { evidence_type: "TRANSACTION_RECORD", document_ref: "doc-a" }
              as: Member
              as_user_id: "${m_i}"
            - call: "POST /network/disputes/${d1}/evidence"
              payload: { evidence_type: "PROOF_OF_DELIVERY", document_ref: "doc-b" }
              as: Member
              as_user_id: "${m_a}"
            - call: "GET /network/disputes/${d1}/evidence-list"
              payload: {}
              as: DisputeAnalyst
          assert:
            - "GET evidence-list returns exactly 2 rows (append-only accumulation)"
            - "Each evidence row carries id and created_at but no version field"

      - name: not_found_on_unknown_member_id
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent member UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Placeholder", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
          trigger:
            - call: "GET /network/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: members_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, endpoints GET /network/members]
        distinguishing_aspect: "GET /network/members?limit=1 after creating 2 members returns exactly 1 row with total_count == 2 and has_more == true, using the fixed envelope pagination fields."
        test_recipe:
          setup: ["Two members created"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "P1", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "P2", member_kind: "ACQUIRER", region: "EU" }
              as: NetworkOperator
          trigger:
            - call: "GET /network/members"
              payload: { limit: 1 }
              as: NetworkOperator
          assert:
            - "response data length == 1, total_count == 2, has_more == true"

  - section: state_machines
    instances:
      - name: member_approve_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Member.APPLICATION_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-ACTIVE member is not a declared transition and returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Member M approved ACTIVE"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Member.${m1}.status == ACTIVE"

      - name: member_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Member]
        distinguishing_aspect: "From TERMINATED no transition exists: suspend, reinstate, terminate all return ERR_INVALID_STATE."
        test_recipe:
          setup: ["Member M driven ACTIVE -> SUSPENDED -> TERMINATED"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members/${m1}/suspend"
              payload: { reason: "R" }
              as: NetworkOperator
            - call: "POST /network/members/${m1}/terminate"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /network/members/${m1}/reinstate"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Member.${m1}.status == TERMINATED"

      - name: dispute_decide_idempotency_second_decide_rejected
        claim_type: idempotency
        grounds: [state_machines.DisputeCase.OPENED_to_DECIDED]
        distinguishing_aspect: "A second decide on an already-DECIDED dispute is rejected with ERR_INVALID_STATE; winning_side from the first decision is unchanged."
        test_recipe:
          setup: ["Dispute D opened and decided ISSUER"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 1000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/disputes"
              payload: { reason_code: "13.1", issuer_member_id: "${m_i}", acquirer_member_id: "${m_a}", merchant_id: "${mc}", transaction_amount_cents: 10000, currency: "USD" }
              as: Member
              as_user_id: "${m_i}"
              captures: { d1: $.data.id }
            - call: "POST /network/disputes/${d1}/decide"
              payload: { winning_side: "ISSUER" }
              as: DisputeAnalyst
          trigger:
            - call: "POST /network/disputes/${d1}/decide"
              payload: { winning_side: "ACQUIRER" }
              as: DisputeAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /network/disputes/${d1}"
              payload: {}
              as: DisputeAnalyst
              captures: { d1_w: $.data.winning_side }
          assert:
            - "Second decide -> ERR_INVALID_STATE (409)"
            - "DisputeCase.${d1}.winning_side == ISSUER"

      - name: program_production_enablement_after_edit_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Program.APPROVED_to_PRODUCTION_ENABLED
          - entities.Program.fields.approved_version
          - errors[ERR_PROGRAM_NOT_ENABLED]
        distinguishing_aspect: "Editing product_code after approval bumps Program.version from approved_version+1 to approved_version+2, so enable-production is rejected with ERR_PROGRAM_NOT_ENABLED — the version pin enforces re-approval."
        test_recipe:
          setup: ["Member M ACTIVE; program G certified, approved (version pin set), then PATCHed"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/programs"
              payload: { name: "G", program_type: "WALLET", product_code: "WL", owner_member_id: "${m1}" }
              as: CertificationEngineer
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "WALLET" }
              as: CertificationEngineer
              captures: { ct: $.data.id }
            - call: "POST /network/certification-tests/${ct}/pass"
              payload: {}
              as: CertificationEngineer
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v}" }
              as: CertificationEngineer
            - call: "PATCH /network/programs/${g1}"
              payload: { product_code: "WL2" }
              as: CertificationEngineer
          trigger:
            - call: "POST /network/programs/${g1}/enable-production"
              payload: {}
              as: CertificationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ENABLED (422)"
            - "Program.${g1}.status == APPROVED"

      - name: program_retire_deactivates_bound_bins
        claim_type: side_effect_execution
        grounds: [state_machines.Program.PRODUCTION_ENABLED_to_RETIRED, state_machines.BinRange.ACTIVE_to_DEACTIVATED]
        distinguishing_aspect: "Retiring a production program cascades: every ACTIVE BinRange bound to it via assigned_program_id transitions to DEACTIVATED."
        test_recipe:
          setup: ["Member M ACTIVE; program G fully production-enabled; BIN range B approved against G (ACTIVE)" ]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/programs"
              payload: { name: "G", program_type: "CARD_PRODUCT", product_code: "CC", owner_member_id: "${m1}" }
              as: CertificationEngineer
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "NEW_PRODUCT" }
              as: CertificationEngineer
              captures: { ct: $.data.id }
            - call: "POST /network/certification-tests/${ct}/pass"
              payload: {}
              as: CertificationEngineer
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v}" }
              as: CertificationEngineer
            - call: "POST /network/programs/${g1}/enable-production"
              payload: {}
              as: CertificationEngineer
            - call: "POST /network/bin-ranges"
              payload: { bin_prefix: "433333", issuer_member_id: "${m1}" }
              as: NetworkOperator
              captures: { b1: $.data.id }
            - call: "POST /network/bin-ranges/${b1}/approve"
              payload: { program_id: "${g1}" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/programs/${g1}/retire"
              payload: {}
              as: CertificationEngineer
            - call: "GET /network/bin-ranges/${b1}"
              payload: {}
              as: NetworkOperator
              captures: { b1_st: $.data.status }
          assert:
            - "Program.${g1}.status == RETIRED"
            - "BinRange.${b1}.status == DEACTIVATED"

      - name: certification_fail_reverts_program_to_registered
        claim_type: side_effect_execution
        grounds: [state_machines.Program.UNDER_CERTIFICATION_to_REGISTERED, entities.Program.fields.status]
        distinguishing_aspect: "Failing the only in-flight certification test reverts Program from UNDER_CERTIFICATION to REGISTERED with failure_reason recorded on the test."
        test_recipe:
          setup: ["Member M ACTIVE; program G REGISTERED with one SUBMITTED test"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/programs"
              payload: { name: "G", program_type: "CARD_PRODUCT", product_code: "CC", owner_member_id: "${m1}" }
              as: CertificationEngineer
              captures: { g1: $.data.id }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "NEW_PRODUCT" }
              as: CertificationEngineer
              captures: { ct: $.data.id }
          trigger:
            - call: "POST /network/certification-tests/${ct}/fail"
              payload: { failure_reason: "MTI mismatch" }
              as: CertificationEngineer
            - call: "GET /network/programs/${g1}"
              payload: {}
              as: CertificationEngineer
              captures: { g_st: $.data.status }
          assert:
            - "CertificationTest.${ct}.status == FAILED and failure_reason == 'MTI mismatch'"
            - "Program.${g1}.status == REGISTERED"

      - name: remediation_overdue_sweep_at_next_evaluation
        claim_type: side_effect_execution
        grounds: [state_machines.RemediationPlan.OPEN_to_OVERDUE, state_machines.FraudProgramCycle.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "A plan left OPEN past its due_at is not moved by the clock alone — it transitions to OVERDUE exactly when the next cycle evaluation sweeps it."
        test_recipe:
          setup: ["Acquirer A ACTIVE; merchant Mc flagged in cycle C1 (fraud 10000, volume 10000000); plan RP created OPEN due 2026-09-20+60d; clock advanced beyond due; cycle C2 evaluated"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "A Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "I Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
            - call: "POST /network/members/${m_i}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/merchants"
              payload: { acquirer_member_id: "${m_a}", mcc: "5411", region: "NA", declared_monthly_volume_cents: 10000000 }
              as: SponsorshipManager
              captures: { mc: $.data.id }
            - call: "POST /network/fraud-cases"
              payload: { merchant_id: "${mc}", reported_by_member_id: "${m_i}", fraud_amount_cents: 10000 }
              as: FraudAnalyst
              captures: { fc: $.data.id }
            - call: "POST /network/fraud-cases/${fc}/confirm"
              payload: {}
              as: FraudAnalyst
            - call: "POST /network/fraud-program-cycles"
              payload: { cycle_label: "C1", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-16T00:00:00Z" }
              as: FraudAnalyst
              captures: { c1: $.data.id }
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/fraud-program-cycles/${c1}/evaluate"
              payload: {}
              as: FraudAnalyst
            - call: "GET /network/fraud-program-cycles/${c1}/remediation-plans"
              payload: {}
              as: FraudAnalyst
              captures:
                rp: "$.data[0].id"
            - call: "POST /network/fraud-program-cycles"
              payload: { cycle_label: "C2", period_start: "2026-09-16T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: FraudAnalyst
              captures: { c2: $.data.id }
            - call: "POST /network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-25T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /network/fraud-program-cycles/${c2}/evaluate"
              payload: {}
              as: FraudAnalyst
            - call: "GET /network/remediation-plans/${rp}"
              payload: {}
              as: FraudAnalyst
              captures: { rp_st: $.data.status }
          assert:
            - "RemediationPlan.${rp}.status == OVERDUE after the sweep (was OPEN before C2 evaluation)"

  - section: calculations
    instances:
      - name: fine_severity_multiplier_stacks_on_tier
        claim_type: constants_applied
        grounds: [calculations.fine_tier_selection]
        distinguishing_aspect: "Severity multiplier applies AFTER tier selection: CRITICAL violation at amount 5000 (tier-1 fine 1000) yields fine_cents == 3000, not a re-lookup into a higher tier."
        test_recipe:
          setup: ["Member M ACTIVE; rule R with schedule [{1..9999:1000},{10000..~:9000}] published effective 2026-09-01; violation CRITICAL amount 5000 cited by ra-1"]
          setup_api_calls:
