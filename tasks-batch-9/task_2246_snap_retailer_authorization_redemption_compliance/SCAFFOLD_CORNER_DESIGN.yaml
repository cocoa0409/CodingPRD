              payload:
                store_id: "${store_id}"
                terminal_deployment_id: "${dep_id}"
                household_ebt_card_last4: "4417"
                line_items:
                  - { sku: "BEER-1", item_class: "ALCOHOL", unit_price_cents: 1200, qty: 1 }
                  - { sku: "HOT-1", item_class: "HOT_PREPARED", unit_price_cents: 800, qty: 1 }
                  - { sku: "CAT-1", item_class: "LIVE_ANIMAL", unit_price_cents: 3000, qty: 1 }
