              as: ArtisticAdmin
              captures: { cA1: "$.data.id" }
            - call: "POST /orchestra/concerts/${cA1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${sA}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Iris Lund", email: "iris@patron.test", subscriber_since_year: 2018 }
              as: BoxOfficeAgent
              captures: { p1: "$.data.id" }
            - call: "POST /orchestra/subscriptions"
              payload: { patron_id: "${p1}", season_id: "${sA}", seat_section_id: "${sec_balc}", seat_count: 1, concert_ids: ["${cA1}"] }
              as: BoxOfficeAgent
              captures: { sub1: "$.data.id" }
            - call: "POST /orchestra/subscriptions/${sub1}/pay"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /orchestra/seasons"
              payload: { name: "2028 Season", fiscal_year: 2028, renewal_deadline_utc: "2027-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { sB: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${sB}", scale_service_fee_cents: 21000 }
              as: OrchestraManager
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sB}", venue_id: "${v1}", title: "B1", performance_start_utc: "2027-11-05T19:30:00Z", performance_end_utc: "2027-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cB1: "$.data.id" }
            - call: "POST /orchestra/concerts/${cB1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${sB}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "GET /orchestra/subscriptions/${sub1}"
              payload: {}
              as: BoxOfficeAgent
              captures: { sub1_v_old: "$.data.version" }
            - call: "POST /orchestra/subscriptions/${sub1}/renew"
              payload: { season_id: "${sB}", concert_ids: ["${cB1}"], expected_package_version: "${sub1_v_old}", seat_count: 1 }
              as: BoxOfficeAgent
              captures: { sub2: "$.data.id" }
          trigger:
            - call: "POST /orchestra/subscriptions/${sub1}/renew"
              payload: { season_id: "${sB}", concert_ids: ["${cB1}"], expected_package_version: "${sub1_v_old}", seat_count: 1 }
              as: BoxOfficeAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_STALE_PACKAGE_VERSION"
            - "HTTP status == 412"
