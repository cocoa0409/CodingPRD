              payload: { action: "START" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "FIX" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "POST /api/disclosure-requests"
              payload: { report_id: "${rep}", proposed_publish_at: "2026-10-01T00:00:00Z" }
              as: Researcher
              as_user_id: "${res}"
              captures: { dr: $.data.id }
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "COUNTER", note: "need more time" }
              as: ProgramAdmin
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "COUNTER", note: "round 2" }
              as: Researcher
              as_user_id: "${res}"
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "COUNTER", note: "round 3" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "COUNTER", note: "round 4" }
              as: ProgramAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "AGREE", agreed_publish_at: "2026-10-01T00:00:00Z" }
              as: Researcher
              as_user_id: "${res}"
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "PUBLISH" }
              as: ProgramAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "PUBLISH" }
              as: ProgramAdmin
              captures: { err3: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/disclosure-requests/${dr}/respond"
              payload: { decision: "PUBLISH" }
              as: ProgramAdmin
          assert:
            - "${err1} == ERR_NEGOTIATION_EXHAUSTED (4th COUNTER at round 3)"
            - "AGREE succeeds: DisclosureRequest.${dr}.status == AGREED with agreed_publish_at == 2026-10-01T00:00:00Z"
            - "${err2} == ERR_DISCLOSURE_TOO_EARLY (clock still 2026-09-01 < agreed 2026-10-01)"
