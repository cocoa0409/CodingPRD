# =============================================================================
# PRD Benchmark Scaffold — Building Automation Retrofit & Guaranteed Savings
# Performance Contract (Johnson Controls-style ESCO performance contracting)
#
# §1.0 response envelope, §1.1 entities, §1.2 state machines (+ §1.2.1 OCC),
# §1.3 calculations, §1.4 validations, §1.5 endpoints, §1.6 errors, §1.7 RBAC.
# §1.8 and §1.9 live in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# SCAFFOLD_CORNER_DESIGN.yaml (sibling files) — NOT here.
# =============================================================================

scenario: |
  Building Automation Retrofit & Guaranteed Savings Performance Contract
  (Johnson Controls): facility energy audit establishing a measurement
  baseline and identifying conservation measures, project scoping with
  measure bundling so short-payback items subsidize long-payback ones,
  guaranteed savings contract where the vendor is financially responsible
  for a shortfall against the baseline, measurement and verification
  protocol selection with weather normalization and occupancy adjustments,
  financing arranged through lease, bond or third-party structures with
  payment from avoided cost, construction execution in occupied facilities
  with phasing and disruption limits, ongoing controls monitoring,
  maintenance obligations and annual reconciliation reports, baseline
  adjustment for facility changes and disputes over savings attribution.

domain_name: guaranteed-savings-performance-contract
api_prefix: ""

complexity_profile:
  primary_archetype: Ledger reconciliation       # guaranteed-savings ledger vs financing-obligation ledger reconcile against an annually restated baseline
  secondary_archetype: Temporal windowing        # measurement windows, construction phases, disruption windows, rate schedules, maintenance SLAs all collide
  complexity_layers:
    - optimistic_concurrency                     # OCC on PerformanceContract.version for baseline-restatement and reconciliation-close writers
    - cascading_side_effects                     # measure install → bundle posture → guarantee reserve → financing draw schedule → payment waterfall
    - dual_variant_calculation                   # stipulated vs measured savings; lease vs bond payment waterfall produce different numbers for identical inputs
    - derived_field_reconciliation               # baseline energy use restated; annual savings to date re-derived from restated baseline
    - rate_threshold_triggers                    # guarantee shortfall threshold, bundle subsidy cap, phase disruption-hour cap
    - scheduled_actions                          # annual reconciliation runs at period end via logical clock; maintenance windows scheduled in the future

  entity_topology: hybrid                        # contract tree (Contract→Baseline→MeasureBundle→Measure) plus cross-cutting FinancingFacility, WorkPhase, SavingsReport
  state_machine_shape: compound                  # contract posture derived from bundle/measure/report states; bundles posture-derived from measure payback mix
  relationship_patterns:
    - one_to_many
    - cross_aggregate                            # SavingsReport references FinancingFacility; WorkPhase references Measure; BaselineAdjustment references Baseline
    - self_referential                           # BaselineAdjustment may supersede a prior BaselineAdjustment (chain of restatements)
  role_model: approval_chain                     # ESCOEngineer → OwnerRep → LenderOfficer for financing draw approval; segregation on report attestation vs reconciliation close
  consistency_model: immediate                   # every mutation is atomic within the request; ledger fields recomputed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
#
# Topology: a PerformanceContract owns one Baseline (1:1), many MeasureBundles,
# each bundle many Measures, and many SavingsReports. FinancingFacility,
# WorkPhase, BaselineAdjustment and DisputeNotice cut across the tree.
# =============================================================================
entities:
  - name: PerformanceContract
    parent: null
    common_fields: true
    fields:
      - { name: facility_name, type: string, source: input, description: "Facility covered by the guaranteed savings contract" }
      - { name: contract_term_years, type: integer, source: input, description: "Guarantee term in years; must be >= 1 and <= 25" }
      - { name: guarantee_start_date, type: datetime, source: input, description: "First day of the first guarantee period; must be > audit completion date at activation" }
      - { name: mv_protocol, type: enum, source: input, description: "Measurement & verification protocol selected for the contract: IPMVP_A | IPMVP_B | IPMVP_C | IPMVP_D" }
      - { name: guaranteed_annual_savings_cents, type: integer, source: input, description: "Dollar-denominated guaranteed savings per guarantee year, committed at execution; must be > 0" }
      - { name: contract_value_cents, type: integer, source: input, description: "Total installed cost of all measures; must be > 0" }
      - { name: guarantee_shortfall_reserve_cents, type: integer, source: computed, description: "Cumulative vendor liability: sum of shortfall payments owed minus shortfall payments settled; floor 0" }
      - { name: cumulative_verified_savings_cents, type: integer, source: computed, description: "Sum of verified savings over all CLOSED reconciliation periods (recomputed when a period closes or a baseline restatement lands)" }
      - { name: status, type: enum, source: system, description: "AUDIT → SCOPED → EXECUTED → CONSTRUCTION → PERFORMANCE → CLOSED / TERMINATED" }
      - { name: executed_baseline_id, type: string, source: system, description: "FK -> Baseline.id; pinned at EXECUTED — the baseline against which the guarantee runs (stale-baseline guard)" }

  - name: Baseline
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: baseline_period_start, type: datetime, source: input, description: "Start of the historical measurement window (inclusive)" }
      - { name: baseline_period_end, type: datetime, source: input, description: "End of the historical measurement window (exclusive); must be > baseline_period_start" }
      - { name: annual_energy_kwh, type: integer, source: input, description: "Metered annual consumption in kWh for the baseline window; must be > 0" }
      - { name: rate_schedule, type: array, source: input, description: "Ordered tariff tiers: [{up_to_kwh, cents_per_kwh}], tiers contiguous, first up_to_kwh > 0, last tier up_to_kwh = null (unbounded), cents_per_kwh > 0" }
      - { name: heating_degree_days, type: number, source: input, description: "Observed HDD over baseline period; must be >= 0" }
      - { name: cooling_degree_days, type: number, source: input, description: "Observed CDD over baseline period; must be >= 0" }
      - { name: occupancy_factor, type: number, source: input, description: "Weekly occupied hours / 168; must be > 0 and <= 1" }
      - { name: adjusted_annual_cost_cents, type: integer, source: computed, description: "Weather+occupancy-normalized annual baseline cost; recomputed on every accepted BaselineAdjustment" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → LOCKED → RESTATED / REJECTED" }
      - { name: version_tag, type: integer, source: computed, default: 1, description: "Restatement counter; increments when an APPROVED BaselineAdjustment restates this baseline" }

  - name: MeasureBundle
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: name, type: string, source: input, description: "Bundle label" }
      - { name: blended_payback_years, type: number, source: computed, description: "sum(measure.installed_cost_cents) / sum(measure.annual_savings_cents) over measures in {INCLUDED}; recomputed on every measure inclusion/exclusion/cost change" }
      - { name: subsidy_pool_cents, type: integer, source: computed, description: "Cross-subsidy capacity: sum over INCLUDED short-payback measures of (annual_savings_cents * SHORT_PAYBACK_YEARS - installed_cost_cents), floored at 0 per measure; recomputed with blended_payback_years" }
      - { name: status, type: enum, source: system, description: "DRAFT → PROPOSED → APPROVED → ACTIVE → COMPLETE / WITHDRAWN" }

  - name: Measure
    parent: MeasureBundle
    common_fields: true
    fields:
      - { name: bundle_id, type: string, source: system, description: "FK -> MeasureBundle.id" }
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id (denormalized for filtered reads)" }
      - { name: measure_type, type: enum, source: input, description: "LIGHTING | HVAC | CONTROLS | ENVELOPE | WATER | OTHER" }
      - { name: installed_cost_cents, type: integer, source: input, description: "Fully installed cost; must be > 0" }
      - { name: annual_savings_cents, type: integer, source: input, description: "Engineering-estimated annual savings; must be >= 0" }
      - { name: simple_payback_years, type: number, source: computed, description: "installed_cost_cents / annual_savings_cents; if annual_savings_cents == 0 then null (never divides by zero)" }
      - { name: subsidy_draw_cents, type: integer, source: computed, default: 0, description: "Portion of installed_cost_cents covered by the bundle subsidy_pool_cents; assigned by waterfall at bundle approval, recomputed on bundle re-approval" }
      - { name: status, type: enum, source: system, description: "PROPOSED → INCLUDED → INSTALLED → VERIFIED / EXCLUDED" }

  - name: FinancingFacility
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: facility_type, type: enum, source: input, description: "LEASE | BOND | THIRD_PARTY" }
      - { name: principal_cents, type: integer, source: input, description: "Financed principal; must be > 0 and <= contract_value_cents of the parent contract" }
      - { name: annual_rate_pct, type: number, source: input, description: "Nominal annual interest rate in percent; must be >= 0 and <= 30" }
      - { name: term_years, type: integer, source: input, description: "Financing term; must be >= 1 and <= 30 and <= contract_term_years of parent contract" }
      - { name: annual_payment_cents, type: integer, source: computed, description: "Level annual payment amortization; algorithm differs per facility_type (lease annuity vs bond level-debt-service vs third-party rate-plus-spread)" }
      - { name: coverage_ratio, type: number, source: computed, description: "guaranteed_annual_savings_cents / annual_payment_cents, 4 decimal places; must be >= 1.0000 to APPROVE the facility" }
      - { name: drawn_cents, type: integer, source: computed, default: 0, description: "Cumulative principal drawn via approved draws" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED → FUNDING → PAID_OFF / CANCELLED" }

  - name: FinancingDraw
    parent: FinancingFacility
    common_fields: false
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> FinancingFacility.id" }
      - { name: amount_cents, type: integer, source: input, description: "Draw amount; must be > 0 and <= principal_cents - drawn_cents at approval time" }
      - { name: purpose, type: string, source: input, description: "Free-text purpose" }
      - { name: status, type: enum, source: system, description: "REQUESTED → APPROVED → RELEASED / REJECTED" }

  - name: WorkPhase
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: phase_label, type: string, source: input, description: "Human label" }
      - { name: window_start, type: datetime, source: input, description: "Construction window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Construction window end (exclusive); must be > window_start" }
      - { name: disruption_budget_hours, type: integer, source: input, description: "Maximum occupant-disruption hours allowed inside the window; must be > 0" }
      - { name: consumed_disruption_hours, type: integer, source: computed, default: 0, description: "Sum of DisruptionLog.hours for this phase" }
      - { name: status, type: enum, source: system, description: "PLANNED → MOBILIZED → IN_PROGRESS → COMPLETE / SUSPENDED" }

  - name: DisruptionLog
    parent: WorkPhase
    common_fields: false
    fields:
      - { name: phase_id, type: string, source: system, description: "FK -> WorkPhase.id" }
      - { name: occurred_at, type: datetime, source: input, description: "When the disruption occurred; must fall inside the phase window [window_start, window_end)" }
      - { name: hours, type: integer, source: input, description: "Disruption duration in whole hours; must be > 0" }
      - { name: cause, type: string, source: input, description: "Free-text cause" }

  - name: SavingsReport
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: period_year, type: integer, source: input, description: "1-indexed guarantee year; unique per contract" }
      - { name: actual_energy_kwh, type: integer, source: input, description: "Metered consumption for the guarantee year; must be >= 0" }
      - { name: period_hdd, type: number, source: input, description: "Observed HDD for the guarantee year; >= 0" }
      - { name: period_cdd, type: number, source: input, description: "Observed CDD for the guarantee year; >= 0" }
      - { name: period_occupancy_factor, type: number, source: input, description: "Observed occupancy factor for the guarantee year; > 0 and <= 1" }
      - { name: verified_savings_cents, type: integer, source: computed, description: "Savings computed by the contract's mv_protocol variant (stipulated vs measured)" }
      - { name: shortfall_cents, type: integer, source: computed, description: "max(0, guaranteed_annual_savings_cents - verified_savings_cents)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → ATTESTED → RECONCILED / DISPUTED" }
      - { name: attested_by_owner_rep_id, type: string, source: system, description: "FK -> OwnerRep.id; the attesting owner rep (segregation: cannot be the report's submitting engineer's counterpart — see validations)" }

  - name: BaselineAdjustment
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: baseline_id, type: string, source: system, description: "FK -> Baseline.id" }
      - { name: supersedes_adjustment_id, type: string, source: input, description: "FK -> BaselineAdjustment.id; self-referential chain — null for the first adjustment on a baseline, otherwise must reference the latest APPROVED adjustment on that baseline" }
      - { name: reason, type: enum, source: input, description: "FACILITY_EXPANSION | FACILITY_REDUCTION | OCCUPANCY_CHANGE | EQUIPMENT_CHANGE | RATE_CHANGE" }
      - { name: kwh_delta, type: integer, source: input, description: "Signed adjustment to annual_energy_kwh; may be negative but resulting annual_energy_kwh must remain > 0" }
      - { name: occupancy_factor_override, type: number, source: input, description: "Optional replacement occupancy factor; > 0 and <= 1 when present" }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED / REJECTED" }

  - name: DisputeNotice
    parent: PerformanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PerformanceContract.id" }
      - { name: report_id, type: string, source: input, description: "FK -> SavingsReport.id; disputed report" }
      - { name: filed_by_role, type: enum, source: system, description: "ESCO | OWNER — derived from caller role" }
      - { name: claimed_savings_cents, type: integer, source: input, description: "The filer's counter-claim for verified savings; must be >= 0" }
      - { name: resolution_savings_cents, type: integer, source: computed, description: "Set at RESOLVED: the agreed/cast-verified savings figure applied to the report" }
      - { name: status, type: enum, source: system, description: "OPEN → ESCALATED → RESOLVED / WITHDRAWN" }

  - name: OwnerRep
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner representative name" }
      - { name: organization, type: string, source: input, description: "Owning organization" }

  - name: ESCOEngineer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "ESCO engineer name" }
      - { name: license_number, type: string, source: input, description: "Professional engineering license number" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PerformanceContract
    initial_state: AUDIT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: AUDIT
        to: SCOPED
        trigger: POST /performance-contracts/{contractId}/complete-audit
        actor: ESCOEngineer
        preconditions:
          - "Contract in AUDIT (ERR_CONTRACT_NOT_IN_AUDIT)"
          - "A Baseline exists for the contract and is in APPROVED state (ERR_BASELINE_NOT_APPROVED)"
          - "At least one Measure exists in PROPOSED or INCLUDED state across the contract's bundles (ERR_NO_MEASURES_IDENTIFIED)"
        side_effects:
          - "Pin executed_baseline_id := the APPROVED Baseline.id"
          - "Increments PerformanceContract.version"

      - from: SCOPED
        to: EXECUTED
        trigger: POST /performance-contracts/{contractId}/execute
        actor: OwnerRep
        preconditions:
          - "Contract in SCOPED (ERR_CONTRACT_NOT_SCOPED)"
          - "At least one MeasureBundle in APPROVED state (ERR_NO_APPROVED_BUNDLE)"
          - "A FinancingFacility in APPROVED or FUNDING state exists (ERR_NO_APPROVED_FINANCING)"
          - "Every APPROVED bundle's blended_payback_years <= contract_term_years (ERR_BUNDLE_PAYBACK_EXCEEDS_TERM)"
        side_effects:
          - "Baseline pinned by executed_baseline_id transitions APPROVED → LOCKED"
          - "All APPROVED MeasureBundles → ACTIVE; their INCLUDED Measures remain INCLUDED"
          - "Increments PerformanceContract.version"

      - from: EXECUTED
        to: CONSTRUCTION
        trigger: POST /performance-contracts/{contractId}/mobilize
        actor: ESCOEngineer
        preconditions:
          - "Contract in EXECUTED (ERR_CONTRACT_NOT_EXECUTED)"
          - "At least one WorkPhase in MOBILIZED state (ERR_NO_MOBILIZED_PHASE)"
        side_effects:
          - "FinancingFacility in APPROVED → FUNDING (draws become available)"
          - "Increments PerformanceContract.version"

      - from: CONSTRUCTION
        to: PERFORMANCE
        trigger: POST /performance-contracts/{contractId}/commence-performance
        actor: OwnerRep
        preconditions:
          - "Contract in CONSTRUCTION (ERR_CONTRACT_NOT_IN_CONSTRUCTION)"
          - "All WorkPhases in COMPLETE (ERR_PHASES_INCOMPLETE)"
          - "Every Measure in an ACTIVE bundle is VERIFIED or EXCLUDED (ERR_MEASURES_UNVERIFIED)"
          - "Logical clock >= guarantee_start_date (ERR_GUARANTEE_PERIOD_NOT_STARTED)"
        side_effects:
          - "Increments PerformanceContract.version"

      - from: PERFORMANCE
        to: CLOSED
        trigger: POST /performance-contracts/{contractId}/close
        actor: OwnerRep
        preconditions:
          - "Contract in PERFORMANCE (ERR_CONTRACT_NOT_IN_PERFORMANCE)"
          - "SavingsReports exist in RECONCILED state for every period_year in 1..contract_term_years (ERR_RECONCILIATION_INCOMPLETE)"
          - "No DisputeNotice in OPEN or ESCALATED state (ERR_OPEN_DISPUTES_EXIST)"
          - "guarantee_shortfall_reserve_cents == 0 (ERR_UNPAID_SHORTFALL_RESERVE)"
        side_effects:
          - "FinancingFacility in FUNDING → PAID_OFF if drawn_cents fully serviced; otherwise close is blocked by ERR_UNPAID_SHORTFALL_RESERVE only, financing state is informational"
          - "Increments PerformanceContract.version"

      - from: AUDIT
        to: TERMINATED
        trigger: POST /performance-contracts/{contractId}/terminate
        actor: OwnerRep
        preconditions:
          - "Contract in AUDIT or SCOPED (ERR_CONTRACT_NOT_TERMINABLE)"
        side_effects:
          - "All non-terminal MeasureBundles → WITHDRAWN; their non-terminal Measures → EXCLUDED"
          - "All DRAFT/SUBMITTED FinancingFacilities → CANCELLED"
          - "Increments PerformanceContract.version"

      - from: SCOPED
        to: TERMINATED
        trigger: POST /performance-contracts/{contractId}/terminate
        actor: OwnerRep
        preconditions:
          - "Contract in AUDIT or SCOPED (ERR_CONTRACT_NOT_TERMINABLE)"
        side_effects:
          - "Same cascade as AUDIT → TERMINATED"

  - entity: Baseline
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /performance-contracts/{contractId}/baselines/{baselineId}/submit
        actor: ESCOEngineer
        preconditions:
          - "Baseline in DRAFT (ERR_BASELINE_NOT_DRAFT)"
          - "Contract in AUDIT (ERR_CONTRACT_NOT_IN_AUDIT)"
        side_effects:
          - "Compute adjusted_annual_cost_cents via baseline_cost calculation (initial pass: no adjustments)"

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /performance-contracts/{contractId}/baselines/{baselineId}/approve
        actor: OwnerRep
        preconditions:
          - "Baseline in SUBMITTED (ERR_BASELINE_NOT_SUBMITTED)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /performance-contracts/{contractId}/baselines/{baselineId}/reject
        actor: OwnerRep
        preconditions:
          - "Baseline in SUBMITTED (ERR_BASELINE_NOT_SUBMITTED)"
        side_effects: []

      - from: APPROVED
        to: LOCKED
        trigger: "system (automatic on PerformanceContract SCOPED → EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LOCKED
        to: RESTATED
        trigger: "system (automatic when a BaselineAdjustment on this baseline is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Baseline.version_tag += 1"
          - "annual_energy_kwh += adjustment.kwh_delta; occupancy_factor := adjustment.occupancy_factor_override if present"
          - "Recompute adjusted_annual_cost_cents"
          - "Recompute verified_savings_cents and shortfall_cents on every SUBMITTED/ATTESTED SavingsReport of the contract (RECONCILED reports are NOT reopened; DISPUTED reports are NOT reopened)"
          - "Cascade to contract: cumulative_verified_savings_cents recomputed over RECONCILED reports only"

  - entity: MeasureBundle
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, COMPLETE]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/propose
        actor: ESCOEngineer
        preconditions:
          - "Bundle in DRAFT (ERR_BUNDLE_NOT_DRAFT)"
          - "Contract in AUDIT or SCOPED (ERR_CONTRACT_NOT_SCOPABLE)"
          - "Bundle has >= 1 measure in PROPOSED or INCLUDED (ERR_BUNDLE_EMPTY)"
        side_effects:
          - "Recompute blended_payback_years and subsidy_pool_cents"

      - from: PROPOSED
        to: APPROVED
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/approve
        actor: OwnerRep
        preconditions:
          - "Bundle in PROPOSED (ERR_BUNDLE_NOT_PROPOSED)"
          - "blended_payback_years <= contract_term_years (ERR_BUNDLE_PAYBACK_EXCEEDS_TERM)"
        side_effects:
          - "All PROPOSED Measures of the bundle → INCLUDED"
          - "Assign subsidy_draw_cents via subsidy_waterfall calculation (sorted by simple_payback_years ASC, tie-break created_at ASC)"
          - "Increments bundle.version"

      - from: APPROVED
        to: ACTIVE
        trigger: "system (automatic on contract EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: COMPLETE
        trigger: "system (automatic when every non-EXCLUDED Measure of the bundle is VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/withdraw
        actor: ESCOEngineer
        preconditions:
          - "Bundle in DRAFT or PROPOSED (ERR_BUNDLE_NOT_WITHDRAWABLE)"
        side_effects:
          - "All PROPOSED Measures → EXCLUDED"

      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/withdraw
        actor: ESCOEngineer
        preconditions:
          - "Bundle in DRAFT or PROPOSED (ERR_BUNDLE_NOT_WITHDRAWABLE)"
        side_effects:
          - "All PROPOSED Measures → EXCLUDED"

  - entity: Measure
    initial_state: PROPOSED
    terminal_states: [VERIFIED, EXCLUDED]
    transitions:
      - from: PROPOSED
        to: INCLUDED
        trigger: "system (automatic on bundle PROPOSED → APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute bundle blended_payback_years and subsidy_pool_cents"

      - from: PROPOSED
        to: EXCLUDED
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/measures/{measureId}/exclude
        actor: ESCOEngineer
        preconditions:
          - "Measure in PROPOSED or INCLUDED (ERR_MEASURE_NOT_EXCLUDABLE)"
          - "Contract not in PERFORMANCE/CLOSED/TERMINATED (ERR_CONTRACT_LOCKED)"
        side_effects:
          - "Recompute bundle blended_payback_years and subsidy_pool_cents"
          - "If measure had subsidy_draw_cents > 0, the draw returns to the bundle subsidy pool and the waterfall is re-run over remaining INCLUDED measures"

      - from: INCLUDED
        to: EXCLUDED
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/measures/{measureId}/exclude
        actor: ESCOEngineer
        preconditions:
          - "Measure in PROPOSED or INCLUDED (ERR_MEASURE_NOT_EXCLUDABLE)"
          - "Contract not in PERFORMANCE/CLOSED/TERMINATED (ERR_CONTRACT_LOCKED)"
        side_effects:
          - "Same as PROPOSED → EXCLUDED"

      - from: INCLUDED
        to: INSTALLED
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/measures/{measureId}/install
        actor: ESCOEngineer
        preconditions:
          - "Measure in INCLUDED (ERR_MEASURE_NOT_INCLUDED)"
          - "Contract in CONSTRUCTION (ERR_CONTRACT_NOT_IN_CONSTRUCTION)"
          - "At least one WorkPhase of the contract in IN_PROGRESS whose window contains the logical clock (ERR_NO_ACTIVE_PHASE_WINDOW)"
        side_effects: []

      - from: INSTALLED
        to: VERIFIED
        trigger: POST /performance-contracts/{contractId}/bundles/{bundleId}/measures/{measureId}/verify
        actor: OwnerRep
        preconditions:
          - "Measure in INSTALLED (ERR_MEASURE_NOT_INSTALLED)"
        side_effects:
          - "If every non-EXCLUDED measure of the bundle is now VERIFIED, bundle ACTIVE → COMPLETE"

  - entity: FinancingFacility
    initial_state: DRAFT
    terminal_states: [CANCELLED, PAID_OFF]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/submit
        actor: ESCOEngineer
        preconditions:
          - "Facility in DRAFT (ERR_FACILITY_NOT_DRAFT)"
          - "Contract in SCOPED (ERR_CONTRACT_NOT_SCOPED)"
        side_effects:
          - "Compute annual_payment_cents and coverage_ratio per financing_payment calculation"

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/approve
        actor: LenderOfficer
        preconditions:
          - "Facility in SUBMITTED (ERR_FACILITY_NOT_SUBMITTED)"
          - "coverage_ratio >= 1.0000 (ERR_COVERAGE_BELOW_ONE)"
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/cancel
        actor: LenderOfficer
        preconditions:
          - "Facility in DRAFT or SUBMITTED (ERR_FACILITY_NOT_CANCELLABLE)"
        side_effects:
          - "All REQUESTED FinancingDraws of the facility → REJECTED"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/cancel
        actor: LenderOfficer
        preconditions:
          - "Facility in DRAFT or SUBMITTED (ERR_FACILITY_NOT_CANCELLABLE)"
        side_effects: []

      - from: APPROVED
        to: FUNDING
        trigger: "system (automatic on contract EXECUTED → CONSTRUCTION)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FUNDING
        to: PAID_OFF
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/payoff
        actor: OwnerRep
        preconditions:
          - "Facility in FUNDING (ERR_FACILITY_NOT_FUNDING)"
          - "Logical clock >= guarantee_start_date + term_years years (ERR_FACILITY_TERM_NOT_ELAPSED)"
        side_effects: []

  - entity: FinancingDraw
    initial_state: REQUESTED
    terminal_states: [REJECTED, RELEASED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/draws/{drawId}/approve
        actor: LenderOfficer
        preconditions:
          - "Draw in REQUESTED (ERR_DRAW_NOT_REQUESTED)"
          - "Facility in FUNDING (ERR_FACILITY_NOT_FUNDING)"
          - "draw.amount_cents <= facility.principal_cents - facility.drawn_cents - sum(other APPROVED-not-RELEASED draws) (ERR_DRAW_EXCEEDS_AVAILABLE)"
        side_effects: []

      - from: APPROVED
        to: RELEASED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/draws/{drawId}/release
        actor: LenderOfficer
        preconditions:
          - "Draw in APPROVED (ERR_DRAW_NOT_APPROVED)"
        side_effects:
          - "facility.drawn_cents += amount_cents"

      - from: REQUESTED
        to: REJECTED
        trigger: POST /performance-contracts/{contractId}/financing-facilities/{facilityId}/draws/{drawId}/reject
        actor: LenderOfficer
        preconditions:
          - "Draw in REQUESTED (ERR_DRAW_NOT_REQUESTED)"
        side_effects: []

  - entity: WorkPhase
    initial_state: PLANNED
    terminal_states: [COMPLETE, SUSPENDED]
    transitions:
      - from: PLANNED
        to: MOBILIZED
        trigger: POST /performance-contracts/{contractId}/phases/{phaseId}/mobilize
        actor: ESCOEngineer
        preconditions:
          - "Phase in PLANNED (ERR_PHASE_NOT_PLANNED)"
          - "Contract in EXECUTED (ERR_CONTRACT_NOT_EXECUTED)"
          - "Window does not overlap any other MOBILIZED/IN_PROGRESS phase window of the same contract (ERR_PHASE_WINDOW_OVERLAP)"
        side_effects: []

      - from: MOBILIZED
        to: IN_PROGRESS
        trigger: POST /performance-contracts/{contractId}/phases/{phaseId}/start
        actor: ESCOEngineer
        preconditions:
          - "Phase in MOBILIZED (ERR_PHASE_NOT_MOBILIZED)"
          - "Logical clock >= window_start (ERR_PHASE_WINDOW_NOT_STARTED)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: POST /performance-contracts/{contractId}/phases/{phaseId}/complete
        actor: OwnerRep
        preconditions:
          - "Phase in IN_PROGRESS (ERR_PHASE_NOT_IN_PROGRESS)"
          - "Logical clock < window_end OR every measure scheduled to this phase is INSTALLED/VERIFIED (late completion allowed only with all work done — else ERR_PHASE_OVERRUN)"
        side_effects: []

      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: POST /performance-contracts/{contractId}/phases/{phaseId}/suspend
        actor: OwnerRep
        preconditions:
          - "Phase in IN_PROGRESS (ERR_PHASE_NOT_IN_PROGRESS)"
        side_effects: []

      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: POST /performance-contracts/{contractId}/phases/{phaseId}/start
        actor: ESCOEngineer
        preconditions:
          - "Phase in SUSPENDED (ERR_PHASE_NOT_RESUMABLE)"
          - "Logical clock < window_end (ERR_PHASE_WINDOW_CLOSED)"
        side_effects: []

  - entity: SavingsReport
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /performance-contracts/{contractId}/reports/{reportId}/submit
        actor: ESCOEngineer
        preconditions:
          - "Report in DRAFT (ERR_REPORT_NOT_DRAFT)"
          - "Contract in PERFORMANCE (ERR_CONTRACT_NOT_IN_PERFORMANCE)"
          - "Logical clock >= guarantee_start_date + period_year years - 1 day (report submittable once its guarantee year has ended; else ERR_PERIOD_NOT_ENDED)"
        side_effects:
          - "Compute verified_savings_cents per savings_verification calculation (variant keyed by contract.mv_protocol)"
          - "Compute shortfall_cents = max(0, guaranteed_annual_savings_cents - verified_savings_cents)"

      - from: SUBMITTED
        to: ATTESTED
        trigger: POST /performance-contracts/{contractId}/reports/{reportId}/attest
        actor: OwnerRep
        preconditions:
          - "Report in SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects:
          - "attested_by_owner_rep_id := caller X-User-ID"

      - from: SUBMITTED
        to: DISPUTED
        trigger: POST /performance-contracts/{contractId}/reports/{reportId}/disputes
        actor: OwnerRep
        preconditions:
          - "Report in SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
        side_effects:
          - "Create DisputeNotice in OPEN with filed_by_role = OWNER"

      - from: ATTESTED
        to: DISPUTED
        trigger: POST /performance-contracts/{contractId}/reports/{reportId}/disputes
        actor: ESCOEngineer
        preconditions:
          - "Report in ATTESTED (ERR_REPORT_NOT_ATTESTED)"
        side_effects:
          - "Create DisputeNotice in OPEN with filed_by_role = ESCO"

      - from: ATTESTED
        to: RECONCILED
        trigger: POST /performance-contracts/{contractId}/reports/{reportId}/reconcile
        actor: OwnerRep
        preconditions:
          - "Report in ATTESTED (ERR_REPORT_NOT_ATTESTED)"
          - "expected_contract_version matches PerformanceContract.version (OCC — ERR_STALE_VERSION)"
        side_effects:
          - "contract.cumulative_verified_savings_cents += report.verified_savings_cents"
          - "contract.guarantee_shortfall_reserve_cents += report.shortfall_cents"
          - "Increments PerformanceContract.version"

      - from: DISPUTED
        to: ATTESTED
        trigger: "system (automatic when the open DisputeNotice on this report resolves RESOLVED)"
        actor: system
        preconditions: []
        side_effects:
          - "verified_savings_cents := dispute.resolution_savings_cents"
          - "shortfall_cents recomputed"
          - "report status back to ATTESTED"

  - entity: BaselineAdjustment
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /performance-contracts/{contractId}/baseline-adjustments/{adjustmentId}/approve
        actor: OwnerRep
        preconditions:
          - "Adjustment in PROPOSED (ERR_ADJUSTMENT_NOT_PROPOSED)"
          - "Referenced baseline in LOCKED or RESTATED (ERR_BASELINE_NOT_LOCKED)"
          - "supersedes_adjustment_id is null OR equals the latest APPROVED adjustment on that baseline (ERR_STALE_ADJUSTMENT_CHAIN)"
          - "expected_baseline_version matches Baseline.version (OCC — ERR_STALE_VERSION)"
          - "Resulting annual_energy_kwh after kwh_delta remains > 0 (ERR_BASELINE_WOULD_GO_NONPOSITIVE)"
        side_effects:
          - "Baseline LOCKED/RESTATED → RESTATED (see Baseline machine)"
          - "Increments Baseline.version"

      - from: PROPOSED
        to: REJECTED
        trigger: POST /performance-contracts/{contractId}/baseline-adjustments/{adjustmentId}/reject
        actor: OwnerRep
        preconditions:
          - "Adjustment in PROPOSED (ERR_ADJUSTMENT_NOT_PROPOSED)"
        side_effects: []

  - entity: DisputeNotice
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: POST /performance-contracts/{contractId}/disputes/{disputeId}/escalate
        actor: OwnerRep
        preconditions:
          - "Dispute in OPEN (ERR_DISPUTE_NOT_OPEN)"
        side_effects: []

      - from: OPEN
        to: RESOLVED
        trigger: POST /performance-contracts/{contractId}/disputes/{disputeId}/resolve
        actor: LenderOfficer
        preconditions:
          - "Dispute in OPEN or ESCALATED (ERR_DISPUTE_NOT_OPEN)"
          - "resolution_savings_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Report DISPUTED → ATTESTED with verified_savings_cents := resolution_savings_cents"

      - from: ESCALATED
        to: RESOLVED
        trigger: POST /performance-contracts/{contractId}/disputes/{disputeId}/resolve
        actor: LenderOfficer
        preconditions:
          - "Dispute in OPEN or ESCALATED (ERR_DISPUTE_NOT_OPEN)"
        side_effects:
          - "Report DISPUTED → ATTESTED with verified_savings_cents := resolution_savings_cents"

      - from: OPEN
        to: WITHDRAWN
        trigger: POST /performance-contracts/{contractId}/disputes/{disputeId}/withdraw
        actor: OwnerRep
        preconditions:
          - "Dispute in OPEN (ERR_DISPUTE_NOT_OPEN)"
          - "Caller role matches filed_by_role side (OWNER disputes withdrawn by OwnerRep; ESCO disputes withdrawn by ESCOEngineer) (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "Report DISPUTED → SUBMITTED if filed pre-attest, else DISPUTED → ATTESTED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — see SKILL.md §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: reconcile-stale-contract-version
    parent_entity: PerformanceContract
    write_endpoint: "POST /performance-contracts/{contractId}/reports/{reportId}/reconcile"
    occ_field: expected_contract_version
    description: |
      Reconciling a report against a PerformanceContract whose version has
      advanced since the caller last observed it is rejected. Another writer
      may have just reconciled a different report (legitimately advancing
      cumulative_verified_savings_cents and guarantee_shortfall_reserve_cents),
      so this caller's view of the ledger is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: baseline-adjust-stale-baseline-version
    parent_entity: Baseline
    write_endpoint: "POST /performance-contracts/{contractId}/baseline-adjustments/{adjustmentId}/approve"
    occ_field: expected_baseline_version
    description: |
      Approving a BaselineAdjustment against a Baseline whose version has
      advanced since the caller last observed it is rejected. Another
      adjustment may have just been approved (legitimately restating the
      baseline and incrementing version_tag), so this caller's kwh_delta
      chain position is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: baseline_cost
    trigger: "Baseline submit (initial) and every APPROVED BaselineAdjustment (restated)"
    algorithm: tiered_pricing
    formula: |
      weather_occupancy_normalized_kwh =
          annual_energy_kwh
          * (1 + HDD_COEF * (contract_avg_hdd - heating_degree_days) / max(1, heating_degree_days))
          * (1 + CDD_COEF * (contract_avg_cdd - cooling_degree_days) / max(1, cooling_degree_days))
          * (occupancy_factor / REFERENCE_OCCUPANCY)
      where contract_avg_hdd := heating_degree_days of the LOCKED/RESTATED baseline
      (self-referential at submit time, so factor is 1) and likewise for cdd.
      Then apply rate_schedule tiers to weather_occupancy_normalized_kwh:
        remaining = kwh; cost = 0
        for tier in rate_schedule order:
          tier_kwh = min(remaining, tier.up_to_kwh or remaining)
          cost += tier_kwh * tier.cents_per_kwh
          remaining -= tier_kwh
      adjusted_annual_cost_cents = round_half_up(cost)   # cents, 0 decimal places
    input_set: "The single Baseline being computed; rate_schedule tiers evaluated in array order"
    constants:
      HDD_COEF: 0.05      # 5% consumption swing per 100% HDD deviation
      CDD_COEF: 0.08      # 8% consumption swing per 100% CDD deviation
      REFERENCE_OCCUPANCY: 0.5
    precision: "integer cents, round_half_up; intermediate kwh at 4 decimal places"
    variants:
      - name: initial
        when: "Baseline DRAFT → SUBMITTED"
        difference: "Weather deltas are zero by construction (baseline vs itself); cost = tiered price of annual_energy_kwh * occupancy normalization"
      - name: restated
        when: "BaselineAdjustment APPROVED"
        difference: "Weather deltas computed against the PRE-adjustment stored HDD/CDD, so a restatement with rate changes and occupancy overrides produces a different adjusted cost than a naive recompute"

  - name: savings_verification
    trigger: "SavingsReport DRAFT → SUBMITTED; recomputed on Baseline RESTATED for SUBMITTED/ATTESTED reports"
    algorithm: aggregation
    formula: |
      Baseline annual_cost_baseline := baseline.adjusted_annual_cost_cents (current restated value)
      Period actual cost := tiered price of report.actual_energy_kwh under the CURRENT
        baseline rate_schedule, weather-normalized by:
          norm_kwh = actual_energy_kwh
                     * (1 - HDD_COEF * (period_hdd - baseline.heating_degree_days) / max(1, baseline.heating_degree_days))
                     * (1 - CDD_COEF * (period_cdd - baseline.cooling_degree_days) / max(1, baseline.cooling_degree_days))
                     * (baseline.occupancy_factor / period_occupancy_factor)
      Then verified_savings_cents depends on variant (see below).
      shortfall_cents = max(0, contract.guaranteed_annual_savings_cents - verified_savings_cents)
    input_set: "The report + the contract's LOCKED/RESTATED baseline (via executed_baseline_id)"
    constants:
      HDD_COEF: 0.05
      CDD_COEF: 0.08
    precision: "integer cents, round_half_up; intermediate kwh at 4 decimal places"
    variants:
      - name: measured
        when: "contract.mv_protocol in {IPMVP_B, IPMVP_C} (whole-fility / retrofit-isolation measured)"
        difference: "verified_savings_cents = round_half_up(baseline_cost - tiered_price(norm_kwh)) — metered consumption drives the result"
      - name: stipulated
        when: "contract.mv_protocol in {IPMVP_A, IPMVP_D} (stipulated/calibrated)"
        difference: "verified_savings_cents = round_half_up(0.95 * sum(annual_savings_cents over contract's VERIFIED measures)) — meter readings ignored; identical weather/meter inputs produce a different number than measured"

  - name: financing_payment
    trigger: "FinancingFacility DRAFT → SUBMITTED"
    algorithm: constraint_propagation
    formula: |
      r = annual_rate_pct / 100; n = term_years; P = principal_cents
      lease:       payment = round_half_up(P * r / (1 - (1 + r)^-n))          if r > 0
                   payment = round_half_up(P / n)                              if r == 0
      bond:        payment = round_half_up(P * r / (1 - (1 + r)^-n) * BOND_FEE_UPLIFT)
      third_party: payment = round_half_up(P * (r + TP_SPREAD) / (1 - (1 + r + TP_SPREAD)^-n))
      coverage_ratio = round(guaranteed_annual_savings_cents / payment, 4)
    input_set: "The facility + parent contract's guaranteed_annual_savings_cents"
    constants:
      BOND_FEE_UPLIFT: 1.02
      TP_SPREAD: 0.015      # 1.5 percentage points added to the note rate
    precision: "integer cents, round_half_up; coverage_ratio 4 decimal places"
    variants:
      - name: lease
        when: "facility_type == LEASE"
        difference: "Plain annuity on the note rate"
      - name: bond
        when: "facility_type == BOND"
        difference: "Annuity multiplied by BOND_FEE_UPLIFT — identical P, r, n yield a HIGHER payment than lease"
      - name: third_party
        when: "facility_type == THIRD_PARTY"
        difference: "Annuity computed at (r + TP_SPREAD) — different rate input, different payment"

  - name: subsidy_waterfall
    trigger: "MeasureBundle PROPOSED → APPROVED and on measure exclusion from an APPROVED bundle"
    algorithm: waterfall_allocation
    formula: |
      Eligible measures: bundle's measures in INCLUDED with simple_payback_years != null
      Sort ascending by simple_payback_years; tie-break by created_at ASC
      pool = bundle.subsidy_pool_cents
      for m in sorted measures where m.simple_payback_years > LONG_PAYBACK_YEARS:
          need = m.installed_cost_cents - m.annual_savings_cents * LONG_PAYBACK_YEARS
          m.subsidy_draw_cents = min(need, pool); pool -= m.subsidy_draw_cents
      All other INCLUDED measures: subsidy_draw_cents = 0
    input_set: "INCLUDED measures of the bundle only; EXCLUDED measures never draw"
    constants:
      SHORT_PAYBACK_YEARS: 3   # a measure whose simple_payback_years <= 3 feeds the pool
      LONG_PAYBACK_YEARS: 7    # a measure whose simple_payback_years > 7 may draw from the pool
    precision: "integer cents"
    variants: []

  - name: blended_payback
    trigger: "Bundle propose, measure create/exclude on the bundle"
    algorithm: aggregation
    formula: |
      over INCLUDED measures (or PROPOSED+INCLUDED when bundle is DRAFT/PROPOSED):
        blended_payback_years = sum(installed_cost_cents) / sum(annual_savings_cents)
        if sum(annual_savings_cents) == 0 then null
      subsidy_pool_cents = sum over measures with simple_payback_years <= SHORT_PAYBACK_YEARS
        of max(0, annual_savings_cents * SHORT_PAYBACK_YEARS - installed_cost_cents)
    input_set: "Bundle measures per state filter above"
    constants:
      SHORT_PAYBACK_YEARS: 3
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is permitted to call this endpoint", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path segment ids exist and are nested under each other correctly, validated left-to-right (contract → bundle/facility/phase/report/adjustment/dispute → measure/draw)", error_id: "ERR_CONTRACT_NOT_FOUND | ERR_BUNDLE_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_DRAW_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_BASELINE_NOT_FOUND", http_status: 404, applies_to: "all nested endpoints" }
  - { priority: 4, category: existence, check: "Body-referenced ids exist (report_id on dispute create; supersedes_adjustment_id)", error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "dispute create, adjustment create" }
  - { priority: 5, category: state, check: "Target entity is in a state from which the requested transition is defined", error_id: "state-specific ERR_*_NOT_* (see state machines)", http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6, category: business_safety, check: "Occupant-disruption budget: adding a DisruptionLog must not push phase.consumed_disruption_hours + hours > phase.disruption_budget_hours", error_id: ERR_DISRUPTION_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST .../phases/{id}/disruptions" }
  - { priority: 7, category: business_safety, check: "Disruption occurred_at must fall inside the phase window [window_start, window_end)", error_id: ERR_DISRUPTION_OUTSIDE_WINDOW, http_status: 422, applies_to: "POST .../phases/{id}/disruptions" }
  - { priority: 8, category: business_constraint, check: "WorkPhase mobilize: window must not overlap any MOBILIZED/IN_PROGRESS phase window of the same contract (half-open [start,end); touching windows where a.end == b.start do NOT overlap)", error_id: ERR_PHASE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST .../phases/{id}/mobilize" }
  - { priority: 9, category: business_constraint, check: "BaselineAdjustment chain: supersedes_adjustment_id must equal the latest APPROVED adjustment id on the baseline (or be null when none exist)", error_id: ERR_STALE_ADJUSTMENT_CHAIN, http_status: 409, applies_to: "POST .../baseline-adjustments/{id}/approve" }
  - { priority: 10, category: business_constraint, check: "Measure install requires at least one IN_PROGRESS WorkPhase whose window contains the logical clock", error_id: ERR_NO_ACTIVE_PHASE_WINDOW, http_status: 409, applies_to: "POST .../measures/{id}/install" }
  - { priority: 11, category: business_temporal, check: "SavingsReport submit requires the guarantee year for period_year to have ended (logical clock >= guarantee_start_date + period_year years - 1 day)", error_id: ERR_PERIOD_NOT_ENDED, http_status: 422, applies_to: "POST .../reports/{id}/submit" }
  - { priority: 12, category: business_temporal, check: "FinancingFacility payoff requires the full term to have elapsed from guarantee_start_date", error_id: ERR_FACILITY_TERM_NOT_ELAPSED, http_status: 422, applies_to: "POST .../financing-facilities/{id}/payoff" }
  - { priority: 13, category: business_fiscal, check: "FinancingFacility approve requires coverage_ratio >= 1.0000", error_id: ERR_COVERAGE_BELOW_ONE, http_status: 422, applies_to: "POST .../financing-facilities/{id}/approve" }
  - { priority: 14, category: business_fiscal, check: "FinancingDraw approve requires amount_cents <= principal_cents - drawn_cents - sum(other APPROVED-not-RELEASED draws)", error_id: ERR_DRAW_EXCEEDS_AVAILABLE, http_status: 422, applies_to: "POST .../draws/{id}/approve" }
  - { priority: 15, category: business_fiscal, check: "Bundle approve requires blended_payback_years <= contract_term_years", error_id: ERR_BUNDLE_PAYBACK_EXCEEDS_TERM, http_status: 422, applies_to: "POST .../bundles/{id}/approve, POST .../contracts/{id}/execute" }
  - { priority: 16, category: business_fiscal, check: "BaselineAdjustment approve must leave annual_energy_kwh > 0 after applying kwh_delta", error_id: ERR_BASELINE_WOULD_GO_NONPOSITIVE, http_status: 422, applies_to: "POST .../baseline-adjustments/{id}/approve" }
  - { priority: 17, category: business_referential, check: "Contract close requires every period_year 1..contract_term_years RECONCILED, no OPEN/ESCALATED disputes, and zero shortfall reserve", error_id: "ERR_RECONCILIATION_INCOMPLETE | ERR_OPEN_DISPUTES_EXIST | ERR_UNPAID_SHORTFALL_RESERVE", http_status: 409, applies_to: "POST .../contracts/{id}/close" }
  - { priority: 18, category: business_referential, check: "Contract commence-performance requires all phases COMPLETE and all non-EXCLUDED measures VERIFIED", error_id: "ERR_PHASES_INCOMPLETE | ERR_MEASURES_UNVERIFIED", http_status: 409, applies_to: "POST .../contracts/{id}/commence-performance" }
  - { priority: 19, category: business_referential, check: "Measure uniqueness of SavingsReport.period_year per contract (no duplicate guarantee-year reports)", error_id: ERR_DUPLICATE_REPORT_PERIOD, http_status: 409, applies_to: "POST .../reports" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
