# ===========================================================================
# 1.9 Scaffold Corner Design - breadth probe for
#     Special Olympics Local Program Administration
#
# Taxonomy: references/claim-extraction-guide.md. The nine guide sections are
# the `section:` values; the per-section table rows are the `claim_type:`
# values. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the covering §1.8 instance and no
# test_recipe.
#
# Logical clock: every chain pins it explicitly; the server default is
# 2026-08-01T00:00:00Z.
# Recurring bootstrap fragments (spelled out per instance, never abbreviated):
#   PROGRAM  = POST /programs                       -> posture FROZEN
#   COACH    = volunteer + credential + screening + training + certify
#              (three distinct X-User-IDs) -> posture OPEN
#   ATHLETE  = POST /programs/{id}/athletes + medical-forms + review APPROVE
#              -> registration ACTIVE, medical CLEARED
# ===========================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_create_returns_full_response_envelope
        claim_type: Creation
        grounds:
          - entities.Program
          - endpoints.POST_programs
          - response_envelope.success
        distinguishing_aspect: "POST /programs with both required fields returns 201 in the fixed envelope with every declared field present, all ledgers at their declared defaults and compliance_posture FROZEN because a brand-new program has no certified coach."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to the default instant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          assert:
            - "HTTP 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == object"
            - "Program.${prog}.name == Riverbend Special Olympics and region_code == OH"
            - "Program.${prog}.compliance_posture == FROZEN"
            - "Program.${prog}.certified_coach_count == 0, credential_denominator_count == 0, expired_credential_count == 0, expired_credential_ratio == 0.0000"
            - "Program.${prog}.unresolved_urgent_referral_count == 0, active_athlete_count == 0, program_practice_minutes == 0"
            - "Program.${prog}.recognized_support_cents == 0, pledged_support_cents == 0, family_engagement_credit_cents == 0"
            - "Program.${prog}.sweep_epoch == 0 and last_sweep_at == null"
            - "Program.${prog}.version == 1 and created_at == updated_at"

      - name: athlete_get_returns_stored_registration_row
        claim_type: Retrieval
        grounds:
          - entities.Athlete
          - endpoints.GET_athletes_id
        distinguishing_aspect: "GET /athletes/{id} echoes exactly what creation stored: both state dimensions at their initial values, a null registration_expires_on and a null current_medical_form_id - no medical form has been filed yet."
        test_recipe:
          setup:
            - "One program with one freshly registered athlete and no medical form"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath: $.data.id }
          trigger:
            - call: "GET /athletes/${ath}"
              as: ProgramManager
          assert:
            - "HTTP 200 and data.id == ${ath}"
            - "Athlete.${ath}.program_id == ${prog}, legal_name == Maya Foster, birth_date == 2004-03-09, sport == ATHLETICS, down_syndrome_flag == false"
            - "Athlete.${ath}.registration_status == PENDING_MEDICAL and medical_status == NONE"
            - "Athlete.${ath}.registration_expires_on == null and current_medical_form_id == null"
            - "Athlete.${ath}.cumulative_practice_minutes == 0, counted_session_count == 0, withdrawal_reason_code == null, version == 1"
            - "Program.${prog}.active_athlete_count == 0 - a PENDING_MEDICAL athlete is not yet active"

      - name: program_athletes_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_programs_id_athletes
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three athletes read with limit=2 returns exactly two rows with total_count 3 and has_more true; the second page with offset=2 returns one row and has_more false, so total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "One program with three registered athletes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath1: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Ivan Petrov", birth_date: "2003-10-01", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath2: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Grace Lin", birth_date: "1998-05-20", sport: "BOCCE", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath3: $.data.id }
          trigger:
            - call: "GET /programs/${prog}/athletes"
              payload: { limit: 2, offset: 0 }
              as: ProgramManager
            - call: "GET /programs/${prog}/athletes"
              payload: { limit: 2, offset: 2 }
              as: ProgramManager
          assert:
            - "the first read returns HTTP 200, response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second read returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the three ids returned across both pages are exactly ${ath1}, ${ath2}, ${ath3} with no duplicates"

      - name: athlete_get_unknown_id_returns_athlete_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ATHLETE_NOT_FOUND]
          - validations.priority_3.existence
        distinguishing_aspect: "A well-formed UUID that names no row returns the entity-specific 404 ERR_ATHLETE_NOT_FOUND in the error envelope, not a generic not-found and not an empty 200."
        test_recipe:
          setup:
            - "One program exists so the database is not empty, but no athlete has ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /athletes/00000000-0000-0000-0000-000000000000"
              as: ProgramManager
          assert:
            - "HTTP 404 with response_type == error, data.error_id == ERR_ATHLETE_NOT_FOUND and a non-empty data.message"
            - "GET /programs/${prog}/athletes still returns total_count == 0"

      - name: contribution_volunteer_hours_required_when_type_volunteer_hours
        claim_type: Required Fields
        grounds:
          - validations.priority_4.ERR_VOLUNTEER_HOURS_REQUIRED
          - entities.Contribution.fields.volunteer_hours
        distinguishing_aspect: "volunteer_hours is optional in the schema but conditionally required by contribution_type: a VOLUNTEER_HOURS contribution submitted without it is rejected 400 ERR_VOLUNTEER_HOURS_REQUIRED even though stated_value_cents was supplied, because that field is ignored for this type."
        test_recipe:
          setup:
            - "One program with empty support ledgers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Harbor Physio Group", contribution_type: "VOLUNTEER_HOURS", designation: "GENERAL", stated_value_cents: 250000 }
              as: ProgramManager
          assert:
            - "HTTP 400 with data.error_id == ERR_VOLUNTEER_HOURS_REQUIRED"
            - "no Contribution row was created: GET /programs/${prog}/contributions returns total_count == 0"
            - "Program.${prog}.pledged_support_cents == 0 and recognized_support_cents == 0"

      - name: contribution_create_defaults_pledged_with_zero_match
        claim_type: Defaults
        grounds:
          - entities.Contribution.fields.status
          - entities.Contribution.fields.match_credit_cents
          - entities.Contribution.fields.received_on
        distinguishing_aspect: "Omitting the optional received_on leaves the contribution PLEDGED with received_on null and match_credit_cents at its declared default 0, and the value lands in pledged_support_cents rather than recognized_support_cents even though the designation is FAMILY_ENGAGEMENT."
        test_recipe:
          setup:
            - "One program with empty support ledgers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Cedar Valley Rotary", contribution_type: "CASH_PLEDGE", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 250000 }
              as: ProgramManager
              captures: { c1: $.data.id }
          assert:
            - "HTTP 201 and Contribution.${c1}.status == PLEDGED"
            - "Contribution.${c1}.received_on == null, void_reason_code == null, match_credit_cents == 0"
            - "Contribution.${c1}.recognized_value_cents == 250000"
            - "Program.${prog}.pledged_support_cents == 250000, recognized_support_cents == 0, family_engagement_credit_cents == 0"

      - name: volunteer_hours_contribution_ignores_stated_value
        claim_type: Computed Fields
        grounds:
          - calculations.contribution_recognized_value
          - entities.Contribution.fields.recognized_value_cents
        distinguishing_aspect: "For contribution_type VOLUNTEER_HOURS the computed recognized_value_cents is round_half_up(12.5 * 3348) = 41850 and the client-supplied stated_value_cents 999999 is discarded entirely - the stored value proves the input was ignored rather than merely clamped."
        test_recipe:
          setup:
            - "One program with empty support ledgers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Harbor Physio Group", contribution_type: "VOLUNTEER_HOURS", designation: "GENERAL", stated_value_cents: 999999, volunteer_hours: 12.5, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c1: $.data.id }
          assert:
            - "HTTP 201 and Contribution.${c1}.recognized_value_cents == 41850"
            - "Contribution.${c1}.volunteer_hours == 12.5 and stated_value_cents is stored as submitted but never used in the computation"
            - "Contribution.${c1}.status == RECEIVED and received_on == 2026-08-01"
            - "Program.${prog}.recognized_support_cents == 41850 and pledged_support_cents == 0"
            - "Program.${prog}.family_engagement_credit_cents == 0 - designation GENERAL earns no match"

      - name: athlete_system_fields_minted_and_version_increments
        claim_type: System Fields
        grounds:
          - entities.Athlete.common_fields
          - state_machines.Athlete.medical_status.NONE_to_PENDING_REVIEW
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: the athlete is created at version 1 with updated_at == created_at, and filing a medical form - a write to a different endpoint that mutates the athlete as a side effect - lifts version to exactly 2 and refreshes updated_at while created_at and id stay frozen."
        test_recipe:
          setup:
            - "One program with one freshly registered athlete at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "ATHLETICS", down_syndrome_flag: false }
              as: ProgramManager
              captures: { ath: $.data.id, ath_created: $.data.created_at }
          trigger:
            - call: "POST /athletes/${ath}/medical-forms"
              payload: { exam_date: "2026-06-15", physician_name: "Dr Amara Cole", physician_license_id: "OH-77213", attestation_cardiac_clearance: true, attestation_seizure_history: false, attestation_atlantoaxial_screen: false, restrictions: ["NONE"] }
              as: ProgramManager
              captures: { form: $.data.id }
          assert:
            - "MedicalForm.${form}.id is a bare 36-character UUID with no type prefix, and version == 1"
            - "Athlete.${ath}.version == 2 and created_at == ${ath_created} (unchanged)"
            - "Athlete.${ath}.medical_status == PENDING_REVIEW and current_medical_form_id == ${form}"
            - "Athlete.${ath}.registration_status == PENDING_MEDICAL - filing a form does not activate registration"
            - "MedicalForm.${form}.status == SUBMITTED, revision_count == 0, athlete_id == ${ath}"

      - name: entity_type_constraints_reject_bad_enum_and_out_of_range_number
        claim_type: Type Constraints
        grounds:
          - entities.Athlete.fields.sport
          - entities.Contribution.fields.stated_value_cents
          - validations.priority_4.ERR_INVALID_REQUEST
        distinguishing_aspect: "The priority-4 schema gate rejects both an unknown enum member (sport CURLING, outside {ATHLETICS, BOCCE, BASKETBALL, SWIMMING}) and a number above its declared range (stated_value_cents 200000000 > 100000000) with the same 400 ERR_INVALID_REQUEST, and neither request writes a row."
        test_recipe:
          setup:
            - "One program with no athletes and no contributions"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "CURLING", down_syndrome_flag: false }
              as: ProgramManager
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Cedar Valley Rotary", contribution_type: "CASH_PLEDGE", designation: "GENERAL", stated_value_cents: 200000000 }
              as: ProgramManager
          assert:
            - "the athlete request returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the contribution request returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /programs/${prog}/athletes returns total_count == 0 and GET /programs/${prog}/contributions returns total_count == 0"

      - name: athlete_create_under_unknown_program_returns_program_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Athlete.fields.program_id
          - validations.priority_3.existence
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: "The parent path id is resolved before the body is validated: an athlete posted under a non-existent program returns 404 ERR_PROGRAM_NOT_FOUND, not the 400 the deliberately invalid sport in the same body would otherwise earn."
        test_recipe:
          setup:
            - "One real program exists, but the request targets a different, non-existent program id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/00000000-0000-0000-0000-000000000000/athletes"
              payload: { legal_name: "Maya Foster", birth_date: "2004-03-09", sport: "CURLING", down_syndrome_flag: false }
              as: ProgramManager
          assert:
            - "HTTP 404 with data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "the response is NOT ERR_INVALID_REQUEST even though sport is an unknown enum member - priority 3 precedes priority 4"
            - "GET /programs/${prog}/athletes returns total_count == 0"

      - name: entry_create_with_unknown_participant_returns_participant_not_found
        claim_type: flat
        grounds:
          - entities.CompetitionEntry.fields.participant_id
          - validations.priority_3.ERR_PARTICIPANT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "In this flat topology the polymorphic body FK is resolved against the collection named by participant_type: an ATHLETE participant_id that matches no athlete returns 404 ERR_PARTICIPANT_NOT_FOUND while the season path id in the same request resolves fine."
        test_recipe:
          setup:
            - "One program with a CERTIFIED coach so posture is OPEN, and one PRACTICE_OPEN season"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: ProgramManager
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred: $.data.id }
            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /credentials/${cred}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /programs/${prog}/seasons"
              payload: { sport: "ATHLETICS", season_name: "Fall 2026 Athletics", practice_minimum_sessions: 0, practice_minimum_minutes: 0, registration_deadline: "2026-09-01", divisioning_date: "2026-09-05", competition_date: "2026-09-20", games_level: "LOCAL", entry_slot_budget: 40, advancement_slots_per_division: 2 }
              as: CompetitionDirector
              captures: { season: $.data.id }
            - call: "POST /seasons/${season}/open-practice"
              payload: {}
              as: CompetitionDirector
          trigger:
            - call: "POST /competition-entries"
              payload: { season_id: "${season}", participant_type: "ATHLETE", participant_id: "00000000-0000-0000-0000-000000000000", event_code: "100M_DASH", skill_score: 40.0 }
              as: CompetitionDirector
          assert:
            - "HTTP 404 with data.error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "SportSeason.${season}.entry_count == 0 and status == PRACTICE_OPEN"
            - "GET /competition-entries?season_id=${season} returns total_count == 0"

  - section: state_machines
    instances:
      - name: season_open_practice_moves_planning_to_practice_open
        claim_type: Valid Transition
        grounds:
          - state_machines.SportSeason.PLANNING_to_PRACTICE_OPEN
          - endpoints.POST_seasons_id_open-practice
        distinguishing_aspect: "The declared trigger moves the season PLANNING -> PRACTICE_OPEN and returns the season itself; the posture gate is satisfied because certifying the coach already lifted the program out of FROZEN, and no counter other than SportSeason.version moves."
        test_recipe:
          setup:
            - "One program whose only coach credential is CERTIFIED, so compliance_posture is OPEN"
            - "One season in PLANNING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: ProgramManager
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
              captures: { cred: $.data.id }
            - call: "POST /credentials/${cred}/screening"
              payload: { completed_on: "2026-07-01", result: "CLEAR", vendor_reference: "BGS-1001" }
              as: CredentialingOfficer
              as_user_id: "officer-1"
            - call: "POST /credentials/${cred}/training"
              payload: { completed_on: "2026-07-05", curriculum_code: "PB-CORE-2026" }
              as: CredentialingOfficer
              as_user_id: "officer-2"
            - call: "POST /credentials/${cred}/certify"
              payload: {}
              as: CredentialingOfficer
              as_user_id: "officer-3"
            - call: "POST /programs/${prog}/seasons"
              payload: { sport: "ATHLETICS", season_name: "Fall 2026 Athletics", practice_minimum_sessions: 2, practice_minimum_minutes: 90, registration_deadline: "2026-09-01", divisioning_date: "2026-09-05", competition_date: "2026-09-20", games_level: "LOCAL", entry_slot_budget: 40, advancement_slots_per_division: 2 }
              as: CompetitionDirector
              captures: { season: $.data.id }
          assert:
            - "HTTP 200 and SportSeason.${season}.status == PRACTICE_OPEN"
            - "SportSeason.${season}.divisioning_run_count == 0, entry_count == 0, divisioned_entry_count == 0"
            - "Program.${prog}.compliance_posture == OPEN and certified_coach_count == 1"
            - "Volunteer.${vol}.status == CREDENTIALED and Credential.${cred}.status == CERTIFIED"
          trigger:
            - call: "POST /seasons/${season}/open-practice"
              payload: {}
              as: CompetitionDirector

      - name: certify_before_both_branches_returns_not_ready
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Credential.READY_TO_CERTIFY_to_CERTIFIED
          - validations.priority_6.ERR_CREDENTIAL_NOT_READY_TO_CERTIFY
        distinguishing_aspect: "Certification is legal only from READY_TO_CERTIFY: with the screening branch recorded but the training branch missing the credential sits in SCREENING_CLEARED and certify returns 409 ERR_CREDENTIAL_NOT_READY_TO_CERTIFY, leaving certified_at and expires_on null."
        test_recipe:
          setup:
            - "One program, one coach volunteer, one credential with only the screening branch recorded"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/volunteers"
              payload: { full_name: "Dana Ruiz", email: "dana@rb.example", date_of_birth: "1988-04-12", volunteer_class: "COACH" }
              as: ProgramManager
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/credentials"
              payload: { role_class: "COACH" }
              as: CredentialingOfficer
