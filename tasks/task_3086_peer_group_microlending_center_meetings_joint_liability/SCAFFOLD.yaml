    roles: [CenterManager]
    code: 200
    input: []
    output: CenterMeeting
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/center-meetings/{id}/attendance"
    description: "Record attendance for a member of the center (upsert while OPEN)"
    roles: [CenterManager]
    code: 201
    input: [member_id, present]
    output: MeetingAttendance
    side_effects: []

  - method: GET
    path: "/center-meetings/{id}/attendance"
    description: "List attendance rows of a meeting"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: "MeetingAttendance[]"
    side_effects: []

  - method: POST
