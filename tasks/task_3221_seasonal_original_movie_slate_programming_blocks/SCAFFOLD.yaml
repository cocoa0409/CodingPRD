# =============================================================================
# task_3221_seasonal_original_movie_slate_programming_blocks
# SCAFFOLD — §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Seasonal Original Movie Slate & Programming Blocks (Hallmark Media): annual
  production slate planning with a fixed count of holiday titles and delivery
  deadlines, production scheduling that shoots seasonal content out of season
  with location and set constraints, talent relationships and multi-picture
  deals with actor availability across the slate, programming block scheduling
  with premiere cadence, encore rotations and multiplatform windows, brand
  consistency rules on content, tone and creative guidelines, advertising sales
  tied to seasonal viewership spikes with sponsorship integration, streaming
  service windowing of library and originals, merchandise, publishing and
  licensing extensions of the brand.

domain_name: seasonal-slate-programming
api_prefix: /slate

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio display name" }
      - { name: ad_budget_cents, type: integer, source: input, description: "Seasonal advertising budget pool in cents; debited at sponsorship reconciliation" }

  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id; owning studio" }
      - { name: year, type: integer, source: input, description: "Slate year, e.g. 2027" }
      - { name: label, type: string, source: input, description: "Season label, e.g. 'Countdown to Christmas'" }
      - { name: required_title_count, type: integer, source: input, description: "Fixed count of original holiday titles the slate must deliver (1..60)" }
      - { name: air_window_start, type: datetime, source: input, description: "First instant premieres may air (inclusive)" }
      - { name: air_window_end, type: datetime, source: input, description: "Last instant premieres may air (exclusive); must be > air_window_start" }
      - { name: delivery_deadline, type: datetime, source: input, description: "Latest delivery timestamp for every title; must be < air_window_start" }
      - { name: max_shoot_days, type: integer, source: input, description: "Aggregate production-day quota shared across the whole slate (>0)" }
      - { name: booked_shoot_days, type: integer, source: computed, default: 0, description: "Sum of shoot_days over ProductionSlot rows in state BOOKED belonging to titles in this season" }
      - { name: committed_title_count, type: integer, source: computed, default: 0, description: "Count of Title rows in this season whose status is IN {APPROVED, IN_PRODUCTION, DELIVERED}" }
      - { name: premiered_title_count, type: integer, source: computed, default: 0, description: "Count of AirSlot rows in state AIRED with kind == PREMIERE whose title belongs to this season" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> LOCKED -> ARCHIVED" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; owning season" }
      - { name: name, type: string, source: input, description: "Working title" }
      - { name: genre, type: enum, source: input, description: "ROMANCE | FAMILY | MYSTERY | COMEDY" }
      - { name: tone_rating, type: enum, source: input, description: "GENTLE | WARM | FESTIVE — brand tone classification" }
      - { name: content_flags, type: array, source: input, default: [], description: "List of content flags drawn from {VIOLENCE, ALCOHOL, GAMBLING, HORROR}" }
      - { name: duration_minutes, type: integer, source: input, description: "Runtime in whole minutes, 60..180" }
      - { name: status, type: enum, source: system, default: PITCHED, description: "PITCHED -> APPROVED -> IN_PRODUCTION -> DELIVERED ; terminal REJECTED or CANCELLED" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp set when status -> DELIVERED; null until then" }

  - name: Talent
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id; talent roster is studio-scoped" }
      - { name: stage_name, type: string, source: input, description: "Public stage name" }
      - { name: availability_windows, type: array, source: input, default: [], description: "List of {start, end} ISO datetime windows (containment is endpoint-inclusive) during which the talent may be booked" }

  - name: TalentDeal
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; inherited from the talent's studio" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; deal counterparty" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the season the picture commitment must be fulfilled within" }
      - { name: picture_commitment, type: integer, source: input, description: "Number of distinct titles the talent must be cast in during the season (1..10)" }
      - { name: fulfilled_pictures, type: integer, source: computed, default: 0, description: "Count of distinct Casting rows in state CONFIRMED (for this deal's talent) whose title's season == deal.season_id" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> FULFILLED -> ACTIVE (cyclic) ; ACTIVE -> BREACHED (terminal, at season archive)" }

  - name: Casting
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; inferred from the title's season" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title being cast" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id; talent being attached" }
      - { name: status, type: enum, source: system, default: ATTACHED, description: "ATTACHED -> CONFIRMED -> RELEASED (terminal)" }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: name, type: string, source: input, description: "Location name" }
      - { name: blackout_windows, type: array, source: input, default: [], description: "List of {start, end} ISO datetime half-open windows [start, end) during which NO shoot may occupy the location" }

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; inferred from title" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id" }
      - { name: shoot_start, type: datetime, source: input, description: "Shoot interval start (inclusive)" }
      - { name: shoot_end, type: datetime, source: input, description: "Shoot interval end (exclusive); must be > shoot_start" }
      - { name: shoot_days, type: integer, source: input, description: "Quota cost in whole days; must equal ceil((shoot_end - shoot_start) / 86400s)" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED -> WRAPPED | CANCELLED" }

  - name: ProgramBlock
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: name, type: string, source: input, description: "Block name, e.g. 'Miracles of Christmas Fridays'" }
      - { name: block_start, type: datetime, source: input, description: "Grid origin for premieres (inclusive); must lie inside the season air window" }
      - { name: premiere_cadence_days, type: integer, source: input, description: "Days between premieres in this block; one of {7, 14}" }
      - { name: max_encores_per_title, type: integer, source: input, description: "Cap on ENCORE airings of any single title within this block (1..5)" }
      - { name: min_minutes_between_airings, type: integer, source: input, default: 1440, description: "Minimum start-to-start gap in whole minutes between any two airings of the same title inside this block" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED -> CLOSED" }

  - name: AirSlot
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> ProgramBlock.id" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title airing" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; inferred from the block's season" }
      - { name: air_start, type: datetime, source: input, description: "Airing start (inclusive); must lie within the owning season's air window" }
      - { name: kind, type: enum, source: input, description: "PREMIERE | ENCORE" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> AIRED | CANCELLED" }

  - name: Sponsorship
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: advertiser, type: string, source: input, description: "Advertiser name" }
      - { name: season_cpm_cents, type: integer, source: input, description: "Cost-per-mille rate in cents applied to viewership thousands (>0)" }
      - { name: viewership_thousands, type: integer, source: input, description: "Projected season viewership in thousands (>=0)" }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Projection at booking time (calc sponsorship_projection)" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Reconciled cost at reconciliation (calc sponsorship_reconciliation); null until RECONCILED" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED -> RECONCILED ; terminal CANCELLED" }

  - name: StreamingWindow
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id" }
      - { name: platform, type: enum, source: input, description: "OWN_STREAMER | PARTNER_STREAMER" }
      - { name: window_start, type: datetime, source: input, description: "Streaming window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Streaming window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> OPEN -> CLOSED ; SCHEDULED -> CLOSED (cascade)" }

  - name: LicenseGrant
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; licensed title" }
      - { name: category, type: enum, source: input, description: "MERCHANDISE | PUBLISHING" }
      - { name: licensee, type: string, source: input, description: "Licensee name" }
      - { name: royalty_rate, type: number, source: input, description: "Royalty fraction in (0, 1]" }
      - { name: reported_revenue_cents, type: integer, source: input, description: "Reported licensee revenue in cents (>=0)" }
      - { name: provisional_royalty_cents, type: integer, source: computed, description: "Per-report provisional royalty (calc royalty_provisional)" }
      - { name: trued_royalty_cents, type: integer, source: computed, description: "True-up DELTA vs provisional after audit (calc royalty_trueup); null until AUDITED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /slate/seasons/{id}/lock"
        actor: ProgrammingExec
        preconditions:
          - "Season.status == DRAFT"
        side_effects:
          - "Season.status -> LOCKED"
          - "increments Season.version by 1"
      - from: LOCKED
        to: ARCHIVED
        trigger: "POST /slate/seasons/{id}/archive"
        actor: ProgrammingExec
        preconditions:
          - "Season.status == LOCKED"
          - "every Title in the season is in {DELIVERED, REJECTED, CANCELLED} — else ERR_SEASON_HAS_OPEN_TITLES"
          - "no AirSlot whose season_id == this season is in state PLANNED — else ERR_SEASON_HAS_OPEN_TITLES"
        side_effects:
          - "Season.status -> ARCHIVED"
          - "cascade hop 1: every ProgramBlock of the season in state PUBLISHED -> CLOSED"
          - "cascade hop 1: every StreamingWindow of the season in state SCHEDULED -> CLOSED"
          - "cascade hop 2: for every TalentDeal with season_id == this season and status == ACTIVE, if fulfilled_pictures < picture_commitment the deal -> BREACHED (deals are evaluated only as a consequence of the archive cascade reaching them)"
          - "increments Season.version by 1"

  - entity: Title
    initial_state: PITCHED
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: PITCHED
        to: APPROVED
        trigger: "POST /slate/titles/{id}/approve"
        actor: SlatePlanner
        preconditions:
          - "Title.status == PITCHED"
          - "Season.status == LOCKED — else ERR_SEASON_NOT_LOCKED"
          - "Season.committed_title_count < Season.required_title_count — else ERR_SLATE_FULL"
          - "brand: Title.content_flags must not intersect {VIOLENCE, GAMBLING, HORROR} — else ERR_BRAND_VIOLATION"
          - "brand: if tone_rating == FESTIVE then genre IN {ROMANCE, FAMILY} — else ERR_BRAND_VIOLATION"
        side_effects:
          - "Title.status -> APPROVED"
          - "recompute Season.committed_title_count"
          - "increments Season.version by 1 (quota consumption bumps the OCC parent)"
      - from: PITCHED
        to: REJECTED
        trigger: "POST /slate/titles/{id}/reject"
        actor: SlatePlanner
        preconditions:
          - "Title.status == PITCHED"
        side_effects: ["Title.status -> REJECTED"]
      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "POST /slate/production-slots (first BOOKED ProductionSlot for the title)"
        actor: ProductionManager
        preconditions:
          - "Title.status == APPROVED"
        side_effects:
          - "Title.status -> IN_PRODUCTION"
      - from: IN_PRODUCTION
        to: DELIVERED
        trigger: "POST /slate/titles/{id}/deliver"
        actor: ProductionManager
        preconditions:
          - "Title.status == IN_PRODUCTION"
          - "at least one ProductionSlot of the title in state WRAPPED — else ERR_NO_WRAPPED_SHOOT"
          - "logical clock now <= Season.delivery_deadline — else ERR_DELIVERY_LATE"
        side_effects:
          - "Title.status -> DELIVERED, delivered_at := now"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /slate/titles/{id}/cancel"
        actor: SlatePlanner
        preconditions:
          - "Title.status IN {APPROVED, IN_PRODUCTION}"
        side_effects:
          - "Title.status -> CANCELLED"
          - "cascade hop 1: recompute Season.committed_title_count (quota frees)"
          - "cascade hop 2: every ProductionSlot of the title in state BOOKED -> CANCELLED; Season.booked_shoot_days -= shoot_days for each"
          - "cascade hop 3: every Casting of the title in state CONFIRMED -> RELEASED; each release recomputes the matching TalentDeal.fulfilled_pictures, and a FULFILLED deal whose fulfilled_pictures drops below picture_commitment flips back to ACTIVE"
          - "cascade hop 2 (parallel branch): every AirSlot of the title in state PLANNED -> CANCELLED"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /slate/titles/{id}/cancel"
        actor: SlatePlanner
        preconditions:
          - "Title.status IN {APPROVED, IN_PRODUCTION}"
        side_effects:
          - "identical side-effect set as APPROVED -> CANCELLED"

  - entity: Casting
    initial_state: ATTACHED
    terminal_states: [RELEASED]
    transitions:
      - from: ATTACHED
        to: CONFIRMED
        trigger: "POST /slate/castings/{id}/confirm"
        actor: TalentAgent
        preconditions:
          - "Casting.status == ATTACHED"
          - "Title.status IN {APPROVED, IN_PRODUCTION} — else ERR_INVALID_STATE"
          - "an ACTIVE TalentDeal exists with talent_id == Casting.talent_id AND season_id == Title.season_id — else ERR_TALENT_UNAVAILABLE"
          - "availability containment per calc availability_containment_check — else ERR_TALENT_UNAVAILABLE"
        side_effects:
          - "Casting.status -> CONFIRMED"
          - "recompute TalentDeal.fulfilled_pictures; if fulfilled_pictures == picture_commitment the deal flips ACTIVE -> FULFILLED"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /slate/castings/{id}/release (or cascade from Title cancel)"
        actor: TalentAgent
        preconditions:
          - "Casting.status == CONFIRMED"
        side_effects:
          - "Casting.status -> RELEASED"
          - "recompute TalentDeal.fulfilled_pictures; if the deal was FULFILLED and fulfilled_pictures drops below picture_commitment the deal flips FULFILLED -> ACTIVE"

  - entity: TalentDeal
    initial_state: ACTIVE
    terminal_states: [BREACHED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (recompute after Casting confirm raises fulfilled_pictures to picture_commitment)"
        actor: system
        preconditions: ["fulfilled_pictures == picture_commitment"]
        side_effects: []
      - from: FULFILLED
        to: ACTIVE
        trigger: "system (recompute after Casting release drops fulfilled_pictures below picture_commitment)"
        actor: system
        preconditions: ["fulfilled_pictures < picture_commitment"]
        side_effects: []
        note: "Cyclic revision loop — a deal may flip ACTIVE -> FULFILLED -> ACTIVE repeatedly."
      - from: ACTIVE
        to: BREACHED
        trigger: "system (Season archive cascade evaluates open deals)"
        actor: system
        preconditions: ["fulfilled_pictures < picture_commitment at archive time"]
        side_effects: []

  - entity: ProductionSlot
    initial_state: BOOKED
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: BOOKED
        to: WRAPPED
        trigger: "POST /slate/production-slots/{id}/wrap"
        actor: ProductionManager
        preconditions: ["ProductionSlot.status == BOOKED"]
        side_effects:
          - "ProductionSlot.status -> WRAPPED"
          - "Season.booked_shoot_days -= shoot_days (quota released at wrap)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /slate/production-slots/{id}/cancel (or cascade from Title cancel)"
        actor: ProductionManager
        preconditions: ["ProductionSlot.status == BOOKED"]
        side_effects:
          - "ProductionSlot.status -> CANCELLED"
          - "Season.booked_shoot_days -= shoot_days"

  - entity: ProgramBlock
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /slate/program-blocks/{id}/publish"
        actor: ProgrammingExec
        preconditions:
          - "ProgramBlock.status == DRAFT"
          - "Season.status == LOCKED — else ERR_SEASON_NOT_LOCKED"
        side_effects:
          - "ProgramBlock.status -> PUBLISHED"
          - "increments ProgramBlock.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "system (cascade from Season archive)"
        actor: system
        preconditions: []
        side_effects:
          - "every AirSlot of the block in state PLANNED -> CANCELLED"

  - entity: AirSlot
    initial_state: PLANNED
    terminal_states: [AIRED, CANCELLED]
    transitions:
      - from: PLANNED
        to: AIRED
        trigger: "POST /slate/air-slots/{id}/mark-aired"
        actor: ProgrammingExec
        preconditions:
          - "AirSlot.status == PLANNED"
          - "logical clock now >= AirSlot.air_start — else ERR_AIRSLOT_TOO_EARLY"
        side_effects:
          - "AirSlot.status -> AIRED"
          - "if kind == PREMIERE: recompute Season.premiered_title_count"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /slate/air-slots/{id}/cancel (or cascades from Title cancel / ProgramBlock close)"
        actor: ProgrammingExec
        preconditions: ["AirSlot.status == PLANNED"]
        side_effects: []

  - entity: Sponsorship
    initial_state: BOOKED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: BOOKED
        to: RECONCILED
        trigger: "POST /slate/sponsorships/{id}/reconcile"
        actor: AdSalesRep
        preconditions:
          - "Sponsorship.status == BOOKED"
          - "Season.status == ARCHIVED — else ERR_SEASON_NOT_LOCKED"
        side_effects:
          - "compute actual_cost_cents via calc sponsorship_reconciliation"
          - "if Studio.ad_budget_cents - actual_cost_cents < 0 reject with ERR_AD_BUDGET_EXCEEDED and leave Sponsorship BOOKED; otherwise debit Studio.ad_budget_cents by actual_cost_cents"
          - "Sponsorship.status -> RECONCILED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /slate/sponsorships/{id}/cancel"
        actor: AdSalesRep
        preconditions: ["Sponsorship.status == BOOKED"]
        side_effects: []

  - entity: StreamingWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /slate/streaming-windows/{id}/open"
        actor: StreamingCurator
        preconditions:
          - "StreamingWindow.status == SCHEDULED"
          - "Title.status == DELIVERED — else ERR_INVALID_STATE"
          - "logical clock now >= window_start — else ERR_AIRSLOT_TOO_EARLY"
          - "platform == OWN_STREAMER requires at least one AIRED AirSlot of kind PREMIERE for the title — else ERR_STREAMING_BEFORE_PREMIERE"
        side_effects:
          - "StreamingWindow.status -> OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /slate/streaming-windows/{id}/close"
        actor: StreamingCurator
        preconditions: ["StreamingWindow.status IN {SCHEDULED, OPEN}"]
        side_effects: ["StreamingWindow.status -> CLOSED"]
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /slate/streaming-windows/{id}/close (or cascade from Season archive)"
        actor: StreamingCurator
        preconditions: ["StreamingWindow.status IN {SCHEDULED, OPEN}"]
        side_effects: ["StreamingWindow.status -> CLOSED"]

  - entity: LicenseGrant
    initial_state: REPORTED
    terminal_states: [AUDITED]
    transitions:
      - from: REPORTED
        to: AUDITED
        trigger: "POST /slate/licenses/{id}/audit"
        actor: LicensingManager
        preconditions:
          - "LicenseGrant.status == REPORTED"
          - "Title.status == DELIVERED — else ERR_INVALID_STATE"
        side_effects:
          - "compute trued_royalty_cents via calc royalty_trueup"
          - "LicenseGrant.status -> AUDITED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: title-approve-stale-season
    parent_entity: Season
    write_endpoint: "POST /slate/titles/{id}/approve"
    occ_field: "expected_season_version"
    description: |
      Approving a Title against a Season whose version has advanced since the
      client last observed it (e.g. another approval just consumed the final
      slate slot, bumping Season.version) is rejected as a stale-version
      conflict; the client must re-read the season and re-issue.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: air-slot-create-stale-block
    parent_entity: ProgramBlock
    write_endpoint: "POST /slate/air-slots"
    occ_field: "expected_block_version"
    description: |
      Creating an AirSlot against a ProgramBlock whose version has advanced
      since the client last observed it (each slot creation bumps the block's
      version) is rejected as a stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: slate_quota_check
    trigger: "Title approve"
    algorithm: threshold
    formula: |
      committed = count(Title in season with status IN {APPROVED, IN_PRODUCTION, DELIVERED})
      if committed >= Season.required_title_count: reject ERR_SLATE_FULL
      # boundary: approving when committed == required_title_count - 1 SUCCEEDS;
      # approving when committed == required_title_count FAILS.
    input_set: "Titles of the season in statuses APPROVED, IN_PRODUCTION, DELIVERED only (PITCHED/REJECTED/CANCELLED excluded)"
    constants: {}
    precision: "integer counting, no rounding"

  - name: shoot_day_quota
    trigger: "ProductionSlot create (check); wrap/cancel (release)"
    algorithm: aggregation
    formula: |
      booked = sum(shoot_days for ProductionSlot in season with status == BOOKED)
      on create: if booked + new.shoot_days > Season.max_shoot_days: reject ERR_PRODUCTION_QUOTA_EXCEEDED
      # boundary: booked + new.shoot_days == max_shoot_days SUCCEEDS (strict >).
    input_set: "ProductionSlot rows of the season in state BOOKED only"
    constants: {}
    precision: "integer day arithmetic"

  - name: sponsorship_projection
    trigger: "Sponsorship create"
    algorithm: tiered_pricing
    formula: |
      # evaluation order pinned:
      #   1) base = season_cpm_cents * viewership_thousands (exact integer cents)
      #   2) if december_spike: projected_cost_cents = floor(base * 125 / 100)
      #      else:            projected_cost_cents = base
      # december_spike is true iff the season's air window [air_window_start, air_window_end)
      # intersects [year-12-01T00:00:00Z, year-12-26T00:00:00Z) (half-open intersection).
      base = season_cpm_cents * viewership_thousands
      if december_spike: projected_cost_cents = floor(base * 125 / 100)
      else: projected_cost_cents = base
    input_set: "the Sponsorship being created + owning Season air window"
    constants:
      DECEMBER_SPIKE_MULTIPLIER_NUM: 125
      DECEMBER_SPIKE_MULTIPLIER_DEN: 100
    precision: "integer cents; floor applied once, at the spike step only"
    variants:
      - name: spiked
        when: "season air window intersects the December 1..26 spike window of season.year"
        difference: "multiplies base by 125/100 with floor"
      - name: flat
        when: "no intersection with the December spike window"
        difference: "projected == base, no multiplier"

  - name: sponsorship_reconciliation
    trigger: "Sponsorship reconcile (post-archive)"
    algorithm: weighted_scoring
    formula: |
      # actual cost uses premiere-weighted viewership and DROPS the spike multiplier:
      #   actual_viewership_thousands = viewership_thousands + Season.premiered_title_count
      #   actual_cost_cents = season_cpm_cents * actual_viewership_thousands
      actual_viewership = viewership_thousands + Season.premiered_title_count
      actual_cost_cents = season_cpm_cents * actual_viewership
    input_set: "the Sponsorship + Season.premiered_title_count at reconcile time"
    constants: {}
    precision: "integer cents, exact multiplication"
    variants:
      - name: projected
        when: "state == BOOKED (read via projected_cost_cents)"
        difference: "raw viewership, December spike multiplier may apply"
      - name: actual
        when: "state == RECONCILED (read via actual_cost_cents)"
        difference: "adds premiered_title_count to viewership and drops the spike multiplier — identical stored inputs can yield actual < projected OR actual > projected depending on premiered count vs spike"

  - name: royalty_provisional
    trigger: "LicenseGrant create"
    algorithm: aggregation
    formula: |
      # rounding order pinned: floor AFTER multiplication on the single report
      # (round per-report; there is no sum-then-round anywhere in royalty math)
      provisional_royalty_cents = floor(reported_revenue_cents * royalty_rate)
    input_set: "the LicenseGrant being created"
    constants: {}
    precision: "integer cents, floor after multiplication"

  - name: royalty_trueup
    trigger: "LicenseGrant audit"
    algorithm: threshold
    formula: |
      # circular-looking dependency pinned by explicit evaluation order:
      #   1) gross = reported_revenue_cents * royalty_rate (exact rational)
      #   2) if reported_revenue_cents >= 1000000: gross += 50000   (flat audit bonus)
      #   3) trued_royalty_cents = floor(gross) - provisional_royalty_cents
      # floor applies to gross BEFORE subtracting the already-floored provisional;
      # the result is a signed DELTA and may be negative.
      gross = reported_revenue_cents * royalty_rate
      if reported_revenue_cents >= 1000000: gross += 50000
      trued_royalty_cents = floor(gross) - provisional_royalty_cents
    input_set: "the LicenseGrant being audited"
    constants:
      AUDIT_BONUS_THRESHOLD_CENTS: 1000000
      AUDIT_BONUS_CENTS: 50000
    precision: "integer cents; floor(gross) computed before subtracting provisional (order pinned)"

  - name: encore_cap_check
    trigger: "AirSlot create with kind == ENCORE"
    algorithm: threshold
    formula: |
      encores = count(AirSlot in block with title_id == new.title_id AND kind == ENCORE AND status IN {PLANNED, AIRED})
      if encores >= ProgramBlock.max_encores_per_title: reject ERR_ENCORE_CAP_EXCEEDED
      # boundary: encores == max_encores_per_title - 1 SUCCEEDS (>= rejects)
    input_set: "AirSlot rows of the block, same title, kind ENCORE, status PLANNED or AIRED"
    constants: {}
    precision: "integer counting"

  - name: premiere_cadence_check
    trigger: "AirSlot create with kind == PREMIERE"
    algorithm: interval_merge
    formula: |
      # premieres must sit exactly on the block's cadence grid:
      delta_seconds = air_start - block_start   (in whole seconds)
      if delta_seconds % (premiere_cadence_days * 86400) != 0: reject ERR_PREMIERE_CADENCE_VIOLATION
    input_set: "the AirSlot being created + owning ProgramBlock"
    constants: {}
    precision: "exact seconds; modulo must be exactly 0"

  - name: same_title_buffer_check
    trigger: "AirSlot create (any kind)"
    algorithm: interval_merge
    formula: |
      # aggregate-separation semantics: start-to-start gap between any two airings
      # of the SAME title in the SAME block must be >= min_minutes_between_airings.
      # exactly min_minutes passes (>=); one minute less fails.
      for each existing AirSlot E in block with E.title_id == new.title_id and E.status IN {PLANNED, AIRED}:
        if abs(new.air_start - E.air_start) < min_minutes_between_airings * 60 seconds: reject ERR_AIRSLOT_OVERLAP
    input_set: "AirSlot rows of the block with the same title in status PLANNED or AIRED"
    constants: {}
    precision: "exact seconds; < rejects, == passes"

  - name: location_overlap_check
    trigger: "ProductionSlot create"
    algorithm: interval_merge
    formula: |
      # half-open interval semantics: two BOOKED slots on the same Location conflict
      # iff [a_start, a_end) intersects [b_start, b_end); touching endpoints
      # (a_end == b_start) do NOT conflict. Blackout windows use the same rule.
      for each existing BOOKED ProductionSlot P with P.location_id == new.location_id:
        if new.shoot_start < P.shoot_end and P.shoot_start < new.shoot_end: reject ERR_LOCATION_OVERLAP
      for each blackout window B in Location.blackout_windows:
        if new.shoot_start < B.end and B.start < new.shoot_end: reject ERR_LOCATION_BLACKOUT
    input_set: "BOOKED ProductionSlot rows on the same Location + the Location's blackout_windows"
    constants: {}
    precision: "exact instants; half-open [start, end)"

  - name: availability_containment_check
    trigger: "Casting confirm"
    algorithm: interval_merge
    formula: |
      # CONTAINMENT semantics (distinct from location overlap): if the title has
      # at least one BOOKED ProductionSlot, the EARLIEST such slot (by shoot_start,
      # tie-break created_at ASC) must be FULLY contained in a SINGLE availability
      # window (endpoint-inclusive); union-of-windows coverage does NOT count.
      # If the title has NO BOOKED slot, require instead that at least one
      # availability window intersects [delivery_deadline - 365d, delivery_deadline].
      if exists BOOKED slot s of the title:
        ok = any(W in Talent.availability_windows: W.start <= s.shoot_start and s.shoot_end <= W.end)
      else:
        ok = any(W in Talent.availability_windows: W.start < delivery_deadline and (delivery_deadline - 365d) < W.end)
      if not ok: reject ERR_TALENT_UNAVAILABLE
    input_set: "Talent.availability_windows + earliest BOOKED ProductionSlot of the title"
    constants: {}
    precision: "exact instants; endpoint-inclusive containment"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in the §1.7 role set; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "body FK references exist and belong to the same studio scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FKs"
  - priority: 5
    category: state
    check: "optimistic concurrency: expected_*_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /slate/titles/{id}/approve, POST /slate/air-slots"
  - priority: 6
    category: state
    check: "resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "brand consistency: content_flags must not include VIOLENCE/GAMBLING/HORROR; FESTIVE tone requires genre in {ROMANCE, FAMILY}"
    error_id: ERR_BRAND_VIOLATION
    http_status: 422
    applies_to: "POST /slate/titles/{id}/approve"
  - priority: 8
    category: business_temporal
    check: "temporal rules: delivery deadline; air-window containment; cadence grid; same-title buffer; location overlap/blackout; talent availability containment; streaming-after-premiere; window shapes (end > start)"
    error_id: "ERR_DELIVERY_LATE | ERR_PREMIERE_CADENCE_VIOLATION | ERR_AIRSLOT_OVERLAP | ERR_LOCATION_OVERLAP | ERR_LOCATION_BLACKOUT | ERR_TALENT_UNAVAILABLE | ERR_STREAMING_BEFORE_PREMIERE | ERR_AIRSLOT_TOO_EARLY | ERR_INVALID_WINDOW"
    http_status: 422
    applies_to: "production-slot create, air-slot create, casting confirm, title deliver, streaming open/schedule, season/block create"
  - priority: 9
    category: business_referential
    check: "cross-entity reference rules: season locked for approve/publish; wrapped shoot exists for deliver; ACTIVE deal exists for confirm; no open titles/slots for archive"
    error_id: "ERR_SEASON_NOT_LOCKED | ERR_NO_WRAPPED_SHOOT | ERR_SEASON_HAS_OPEN_TITLES"
    http_status: 409
    applies_to: "title approve/deliver, block publish, casting confirm, season archive"
  - priority: 10
    category: business_constraint
    check: "aggregate quota rules: slate title count, production day quota, encore cap"
    error_id: "ERR_SLATE_FULL | ERR_PRODUCTION_QUOTA_EXCEEDED | ERR_ENCORE_CAP_EXCEEDED"
    http_status: 409
    applies_to: "title approve, production-slot create, air-slot create"
  - priority: 11
    category: business_fiscal
    check: "studio ad budget covers sponsorship actual cost at reconciliation"
    error_id: ERR_AD_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "sponsorship reconcile"
  - priority: 12
    category: business_constraint
    check: "input shape: required fields present, enum values valid, ranges respected (duration 60..180, cadence in {7,14}, shoot_end > shoot_start, window_end > window_start, royalty_rate in (0,1], shoot_days == ceil((shoot_end-shoot_start)/86400), non-negative amounts)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

# =============================================================================
# §1.5 API Endpoint Table (flat topology; all collections under /slate)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock used by all time-gated validations"]

  # --- Studio ---
  - method: POST
    path: "/slate/studios"
    description: "Create a Studio"
    roles: [PlatformAdmin]
    code: 201
    input: [name, ad_budget_cents]
    output: Studio
    side_effects: []
  - method: GET
    path: "/slate/studios/{id}"
    description: "Get a Studio"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: []
    output: Studio
    side_effects: []
  - method: GET
    path: "/slate/studios"
    description: "List Studios"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Studio[]"
    side_effects: []

  # --- Season ---
  - method: POST
    path: "/slate/seasons"
    description: "Create a Season (state DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [studio_id, year, label, required_title_count, air_window_start, air_window_end, delivery_deadline, max_shoot_days]
    output: Season
    side_effects: ["status=DRAFT; booked_shoot_days=0; committed_title_count=0; premiered_title_count=0"]
  - method: GET
    path: "/slate/seasons/{id}"
    description: "Get a Season"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: GET
    path: "/slate/seasons"
    description: "List Seasons; optional studio_id/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: ["studio_id?", "status?", "limit?", "offset?"]
    output: "Season[]"
    side_effects: []
  - method: POST
    path: "/slate/seasons/{id}/lock"
    description: "Lock a DRAFT season"
    roles: [ProgrammingExec]
    code: 200
    input: []
    output: Season
    side_effects: ["Season DRAFT -> LOCKED; increments Season.version by 1"]
  - method: POST
    path: "/slate/seasons/{id}/archive"
    description: "Archive a LOCKED season (cascades to blocks, windows, deals)"
    roles: [ProgrammingExec]
    code: 200
    input: []
    output: Season
    side_effects: ["Season LOCKED -> ARCHIVED; cascades per §1.2; increments Season.version by 1"]

  # --- Title ---
  - method: POST
    path: "/slate/titles"
    description: "Create a Title (state PITCHED)"
    roles: [SlatePlanner]
    code: 201
    input: [season_id, name, genre, tone_rating, content_flags, duration_minutes]
    output: Title
    side_effects: ["status=PITCHED"]
  - method: GET
    path: "/slate/titles/{id}"
    description: "Get a Title"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: []
    output: Title
    side_effects: []
  - method: GET
    path: "/slate/titles"
    description: "List Titles; optional season_id/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: "Title[]"
    side_effects: []
  - method: POST
    path: "/slate/titles/{id}/approve"
    description: "Approve a PITCHED title (OCC on Season.version via expected_season_version)"
    roles: [SlatePlanner]
    code: 200
    input: [expected_season_version]
    output: Title
    side_effects: ["Title PITCHED -> APPROVED; recompute Season.committed_title_count; increments Season.version by 1"]
  - method: POST
    path: "/slate/titles/{id}/reject"
    description: "Reject a PITCHED title"
    roles: [SlatePlanner]
    code: 200
    input: []
    output: Title
    side_effects: ["Title PITCHED -> REJECTED"]
  - method: POST
    path: "/slate/titles/{id}/cancel"
    description: "Cancel an APPROVED or IN_PRODUCTION title (deep cascade per §1.2)"
    roles: [SlatePlanner]
    code: 200
    input: []
    output: Title
    side_effects: ["Title -> CANCELLED; cascades to Season quota, ProductionSlots, Castings, TalentDeals, AirSlots"]
  - method: POST
    path: "/slate/titles/{id}/deliver"
    description: "Deliver an IN_PRODUCTION title before the deadline"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Title
    side_effects: ["Title IN_PRODUCTION -> DELIVERED; delivered_at := now"]

  # --- Talent ---
  - method: POST
    path: "/slate/talent"
    description: "Create Talent"
    roles: [TalentAgent]
    code: 201
    input: [studio_id, stage_name, availability_windows]
    output: Talent
    side_effects: []
  - method: GET
    path: "/slate/talent/{id}"
    description: "Get Talent"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: []
    output: Talent
    side_effects: []
  - method: GET
    path: "/slate/talent"
    description: "List Talent; optional studio_id filter"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec, AdSalesRep, StreamingCurator, LicensingManager]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "Talent[]"
    side_effects: []

  # --- TalentDeal ---
  - method: POST
    path: "/slate/deals"
    description: "Create a TalentDeal (state ACTIVE)"
    roles: [TalentAgent]
    code: 201
    input: [talent_id, season_id, picture_commitment]
    output: TalentDeal
    side_effects: ["status=ACTIVE; fulfilled_pictures=0; studio_id inherited from talent"]
  - method: GET
    path: "/slate/deals/{id}"
    description: "Get a TalentDeal"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec]
    code: 200
    input: []
    output: TalentDeal
    side_effects: []
  - method: GET
    path: "/slate/deals"
    description: "List TalentDeals; optional talent_id/season_id/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec]
    code: 200
    input: ["talent_id?", "season_id?", "studio_id?", "status?", "limit?", "offset?"]
    output: "TalentDeal[]"
    side_effects: []

  # --- Casting ---
  - method: POST
    path: "/slate/castings"
    description: "Attach talent to a title (Casting state ATTACHED)"
    roles: [TalentAgent]
    code: 201
    input: [title_id, talent_id]
    output: Casting
    side_effects: ["status=ATTACHED; season_id inferred from title"]
  - method: GET
    path: "/slate/castings/{id}"
    description: "Get a Casting"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec]
    code: 200
    input: []
    output: Casting
    side_effects: []
  - method: GET
    path: "/slate/castings"
    description: "List Castings; optional title_id/talent_id/season_id/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, TalentAgent, ProgrammingExec]
    code: 200
    input: ["title_id?", "talent_id?", "season_id?", "status?", "limit?", "offset?"]
    output: "Casting[]"
    side_effects: []
  - method: POST
    path: "/slate/castings/{id}/confirm"
    description: "Confirm an ATTACHED casting (ACTIVE deal + availability containment required)"
    roles: [TalentAgent]
    code: 200
    input: []
    output: Casting
    side_effects: ["Casting ATTACHED -> CONFIRMED; recompute deal.fulfilled_pictures; deal may flip ACTIVE -> FULFILLED"]
  - method: POST
    path: "/slate/castings/{id}/release"
    description: "Release a CONFIRMED casting (deal may flip FULFILLED -> ACTIVE)"
    roles: [TalentAgent]
    code: 200
    input: []
    output: Casting
    side_effects: ["Casting CONFIRMED -> RELEASED; recompute deal.fulfilled_pictures; deal may flip FULFILLED -> ACTIVE"]

  # --- Location ---
  - method: POST
    path: "/slate/locations"
    description: "Create a Location"
    roles: [ProductionManager]
    code: 201
    input: [studio_id, name, blackout_windows]
    output: Location
    side_effects: []
  - method: GET
    path: "/slate/locations/{id}"
    description: "Get a Location"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec]
    code: 200
    input: []
    output: Location
    side_effects: []
  - method: GET
    path: "/slate/locations"
    description: "List Locations; optional studio_id filter"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "Location[]"
    side_effects: []

  # --- ProductionSlot ---
  - method: POST
    path: "/slate/production-slots"
    description: "Book a ProductionSlot (shoot_days==ceil(days) shape check; quota, overlap, blackout checks; flips title APPROVED -> IN_PRODUCTION)"
    roles: [ProductionManager]
    code: 201
    input: [title_id, location_id, shoot_start, shoot_end, shoot_days]
    output: ProductionSlot
    side_effects: ["status=BOOKED; season_id inferred; Season.booked_shoot_days += shoot_days; Title APPROVED -> IN_PRODUCTION when first slot"]
  - method: GET
    path: "/slate/production-slots/{id}"
    description: "Get a ProductionSlot"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec]
    code: 200
    input: []
    output: ProductionSlot
    side_effects: []
  - method: GET
    path: "/slate/production-slots"
    description: "List ProductionSlots; optional season_id/title_id/location_id/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec]
    code: 200
    input: ["season_id?", "title_id?", "location_id?", "status?", "limit?", "offset?"]
    output: "ProductionSlot[]"
    side_effects: []
  - method: POST
    path: "/slate/production-slots/{id}/wrap"
    description: "Wrap a BOOKED slot (releases quota)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: ProductionSlot
    side_effects: ["BOOKED -> WRAPPED; Season.booked_shoot_days -= shoot_days"]
  - method: POST
    path: "/slate/production-slots/{id}/cancel"
    description: "Cancel a BOOKED slot (releases quota)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: ProductionSlot
    side_effects: ["BOOKED -> CANCELLED; Season.booked_shoot_days -= shoot_days"]

  # --- ProgramBlock ---
  - method: POST
    path: "/slate/program-blocks"
    description: "Create a ProgramBlock (state DRAFT; block_start must lie inside the season air window)"
    roles: [ProgrammingExec]
    code: 201
    input: [season_id, name, block_start, premiere_cadence_days, max_encores_per_title, min_minutes_between_airings]
    output: ProgramBlock
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/slate/program-blocks/{id}"
    description: "Get a ProgramBlock"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec, AdSalesRep, StreamingCurator]
    code: 200
    input: []
    output: ProgramBlock
    side_effects: []
  - method: GET
    path: "/slate/program-blocks"
    description: "List ProgramBlocks; optional season_id/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec, AdSalesRep, StreamingCurator]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: "ProgramBlock[]"
    side_effects: []
  - method: POST
    path: "/slate/program-blocks/{id}/publish"
    description: "Publish a DRAFT block (season must be LOCKED)"
    roles: [ProgrammingExec]
    code: 200
    input: []
    output: ProgramBlock
    side_effects: ["DRAFT -> PUBLISHED; increments ProgramBlock.version by 1"]

  # --- AirSlot ---
  - method: POST
    path: "/slate/air-slots"
    description: "Create an AirSlot (OCC on ProgramBlock.version; cadence grid, same-title buffer, encore cap, air-window checks)"
    roles: [ProgrammingExec]
    code: 201
    input: [block_id, title_id, air_start, kind, expected_block_version]
    output: AirSlot
    side_effects: ["status=PLANNED; season_id inferred from block; increments ProgramBlock.version by 1"]
  - method: GET
    path: "/slate/air-slots/{id}"
    description: "Get an AirSlot"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec, AdSalesRep, StreamingCurator]
    code: 200
    input: []
    output: AirSlot
    side_effects: []
  - method: GET
    path: "/slate/air-slots"
    description: "List AirSlots; optional block_id/title_id/kind/status filters"
    roles: [PlatformAdmin, SlatePlanner, ProductionManager, ProgrammingExec, AdSalesRep, StreamingCurator]
    code: 200
    input: ["block_id?", "title_id?", "season_id?", "kind?", "status?", "limit?", "offset?"]
    output: "AirSlot[]"
    side_effects: []
  - method: POST
    path: "/slate/air-slots/{id}/mark-aired"
    description: "Mark a PLANNED air slot AIRED (clock >= air_start)"
    roles: [ProgrammingExec]
    code: 200
    input: []
    output: AirSlot
    side_effects: ["PLANNED -> AIRED; if kind == PREMIERE recompute Season.premiered_title_count"]
  - method: POST
    path: "/slate/air-slots/{id}/cancel"
    description: "Cancel a PLANNED air slot"
    roles: [ProgrammingExec]
    code: 200
    input: []
    output: AirSlot
    side_effects: ["PLANNED -> CANCELLED"]

  # --- Sponsorship ---
  - method: POST
    path: "/slate/sponsorships"
    description: "Book a Sponsorship (computes projected_cost_cents)"
    roles: [AdSalesRep]
    code: 201
    input: [season_id, advertiser, season_cpm_cents, viewership_thousands]
    output: Sponsorship
    side_effects: ["status=BOOKED; compute projected_cost_cents via sponsorship_projection"]
  - method: GET
    path: "/slate/sponsorships/{id}"
    description: "Get a Sponsorship"
    roles: [PlatformAdmin, ProgrammingExec, AdSalesRep]
    code: 200
    input: []
    output: Sponsorship
    side_effects: []
  - method: GET
    path: "/slate/sponsorships"
    description: "List Sponsorships; optional season_id/status filters"
    roles: [PlatformAdmin, ProgrammingExec, AdSalesRep]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: "Sponsorship[]"
    side_effects: []
  - method: POST
    path: "/slate/sponsorships/{id}/reconcile"
    description: "Reconcile a BOOKED sponsorship after season archive (budget debit; ERR_AD_BUDGET_EXCEEDED leaves it BOOKED)"
    roles: [AdSalesRep]
    code: 200
    input: []
    output: Sponsorship
    side_effects: ["compute actual_cost_cents via sponsorship_reconciliation; debit Studio.ad_budget_cents; BOOKED -> RECONCILED"]
  - method: POST
    path: "/slate/sponsorships/{id}/cancel"
    description: "Cancel a BOOKED sponsorship"
    roles: [AdSalesRep]
    code: 200
    input: []
    output: Sponsorship
    side_effects: ["BOOKED -> CANCELLED"]

  # --- StreamingWindow ---
  - method: POST
    path: "/slate/streaming-windows"
    description: "Schedule a StreamingWindow (window_end > window_start required)"
    roles: [StreamingCurator]
    code: 201
    input: [season_id, title_id, platform, window_start, window_end]
    output: StreamingWindow
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/slate/streaming-windows/{id}"
    description: "Get a StreamingWindow"
    roles: [PlatformAdmin, ProgrammingExec, StreamingCurator]
    code: 200
    input: []
    output: StreamingWindow
    side_effects: []
  - method: GET
    path: "/slate/streaming-windows"
    description: "List StreamingWindows; optional season_id/title_id/platform/status filters"
    roles: [PlatformAdmin, ProgrammingExec, StreamingCurator]
    code: 200
    input: ["season_id?", "title_id?", "platform?", "status?", "limit?", "offset?"]
    output: "StreamingWindow[]"
    side_effects: []
  - method: POST
    path: "/slate/streaming-windows/{id}/open"
    description: "Open a SCHEDULED streaming window (delivered title, clock >= window_start, OWN_STREAMER requires aired premiere)"
    roles: [StreamingCurator]
    code: 200
    input: []
    output: StreamingWindow
    side_effects: ["SCHEDULED -> OPEN"]
  - method: POST
    path: "/slate/streaming-windows/{id}/close"
    description: "Close a SCHEDULED or OPEN streaming window"
    roles: [StreamingCurator]
    code: 200
    input: []
    output: StreamingWindow
    side_effects: ["-> CLOSED"]

  # --- LicenseGrant ---
  - method: POST
    path: "/slate/licenses"
    description: "Report a LicenseGrant (computes provisional_royalty_cents = floor(revenue * rate))"
    roles: [LicensingManager]
    code: 201
    input: [season_id, title_id, category, licensee, royalty_rate, reported_revenue_cents]
    output: LicenseGrant
    side_effects: ["status=REPORTED; compute provisional_royalty_cents via royalty_provisional"]
  - method: GET
    path: "/slate/licenses/{id}"
    description: "Get a LicenseGrant"
    roles: [PlatformAdmin, LicensingManager]
    code: 200
    input: []
    output: LicenseGrant
    side_effects: []
  - method: GET
    path: "/slate/licenses"
    description: "List LicenseGrants; optional season_id/title_id/category/status filters"
    roles: [PlatformAdmin, LicensingManager]
    code: 200
    input: ["season_id?", "title_id?", "category?", "status?", "limit?", "offset?"]
    output: "LicenseGrant[]"
    side_effects: []
  - method: POST
    path: "/slate/licenses/{id}/audit"
    description: "Audit a REPORTED license for a DELIVERED title (computes trued_royalty_cents delta)"
    roles: [LicensingManager]
    code: 200
    input: []
    output: LicenseGrant
    side_effects: ["compute trued_royalty_cents via royalty_trueup; REPORTED -> AUDITED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id missing or body FK reference missing/out of studio scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, or violated range/shape constraint (incl. shoot_days != ceil((shoot_end-shoot_start)/86400))" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition" }
  - { id: ERR_SEASON_NOT_LOCKED, http: 409, condition: "Operation requires Season LOCKED (title approve, block publish) or ARCHIVED (sponsorship reconcile)" }
  - { id: ERR_SEASON_HAS_OPEN_TITLES, http: 409, condition: "Season archive blocked by non-terminal titles or PLANNED air slots" }
  - { id: ERR_SLATE_FULL, http: 409, condition: "Approving would exceed Season.required_title_count (committed >= required)" }
  - { id: ERR_BRAND_VIOLATION, http: 422, condition: "Content flags contain VIOLENCE/GAMBLING/HORROR, or FESTIVE tone with genre outside {ROMANCE, FAMILY}" }
  - { id: ERR_DELIVERY_LATE, http: 422, condition: "Delivery attempted with logical clock after Season.delivery_deadline" }
  - { id: ERR_NO_WRAPPED_SHOOT, http: 409, condition: "Deliver requires at least one WRAPPED ProductionSlot" }
  - { id: ERR_PRODUCTION_QUOTA_EXCEEDED, http: 409, condition: "Booking would push Season.booked_shoot_days above max_shoot_days (strict >)" }
  - { id: ERR_LOCATION_OVERLAP, http: 422, condition: "Half-open shoot interval intersects another BOOKED slot on the same Location" }
  - { id: ERR_LOCATION_BLACKOUT, http: 422, condition: "Half-open shoot interval intersects a Location blackout window" }
  - { id: ERR_TALENT_UNAVAILABLE, http: 422, condition: "No ACTIVE deal for the talent/season, or earliest shoot not contained in a single availability window (or no window intersecting the production horizon)" }
  - { id: ERR_PREMIERE_CADENCE_VIOLATION, http: 422, condition: "PREMIERE air_start off the block cadence grid ((air_start - block_start) mod cadence != 0)" }
  - { id: ERR_AIRSLOT_OVERLAP, http: 422, condition: "Same title in block with start-to-start gap < min_minutes_between_airings" }
  - { id: ERR_ENCORE_CAP_EXCEEDED, http: 409, condition: "ENCORE creation would exceed ProgramBlock.max_encores_per_title for the title" }
  - { id: ERR_AIRSLOT_TOO_EARLY, http: 422, condition: "mark-aired or streaming open attempted before air_start/window_start" }
  - { id: ERR_STREAMING_BEFORE_PREMIERE, http: 422, condition: "OWN_STREAMER window open attempted before any AIRED PREMIERE exists for the title" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "air_start/block_start outside season air window, or an interval's end <= start" }
  - { id: ERR_AD_BUDGET_EXCEEDED, http: 402, condition: "Reconciliation actual cost exceeds remaining Studio.ad_budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties: planning / production / talent /
# programming / ad-sales / streaming / licensing are mutually exclusive)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Network operator; creates studios and seasons, drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/studios"
      - "POST /slate/seasons"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: SlatePlanner
    description: "Plans the slate: creates, approves, rejects, cancels titles. May NOT manage production, talent, or programming."
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/titles"
      - "POST /slate/titles/{id}/approve"
      - "POST /slate/titles/{id}/reject"
      - "POST /slate/titles/{id}/cancel"
    shared_operations:
      - "GET endpoints within scope"
  - name: ProductionManager
    description: "Owns locations and production slots; delivers titles. May NOT approve titles (segregation of duties vs SlatePlanner)."
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/locations"
      - "POST /slate/production-slots (+ wrap/cancel)"
      - "POST /slate/titles/{id}/deliver"
    shared_operations:
      - "GET endpoints within scope"
  - name: TalentAgent
    description: "Acts for a specific Talent (X-User-ID == Talent.id); manages talent, deals and castings"
    identity: "entity_backed:Talent"
    exclusive_operations:
      - "POST /slate/talent"
      - "POST /slate/deals"
      - "POST /slate/castings (+ confirm/release)"
    shared_operations:
      - "GET endpoints within scope"
  - name: ProgrammingExec
    description: "Owns the air schedule: locks/archives seasons, publishes blocks, schedules air slots"
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/seasons/{id}/lock"
      - "POST /slate/seasons/{id}/archive"
      - "POST /slate/program-blocks (+ publish)"
      - "POST /slate/air-slots (+ mark-aired/cancel)"
    shared_operations:
      - "GET endpoints within scope"
  - name: AdSalesRep
    description: "Books and reconciles sponsorships against the studio ad budget"
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/sponsorships (+ reconcile/cancel)"
    shared_operations:
      - "GET endpoints within scope"
  - name: StreamingCurator
    description: "Schedules and opens streaming windows"
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/streaming-windows (+ open/close)"
    shared_operations:
      - "GET endpoints within scope"
  - name: LicensingManager
    description: "Reports and audits merchandise/publishing licenses"
    identity: "opaque"
    exclusive_operations:
      - "POST /slate/licenses (+ audit)"
    shared_operations:
      - "GET endpoints within scope"
