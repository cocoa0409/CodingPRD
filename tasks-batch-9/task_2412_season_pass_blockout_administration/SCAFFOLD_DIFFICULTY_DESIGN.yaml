              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-05", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_805: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T09:00:00Z", gate_code: "NORTH", photo_match: "MISMATCH" }
              as: GateAgent
              captures: { visit_1: "$.data.id" }
            - call: "POST /sharing-cases"
              payload: { season_pass_id: "${pass_a}", evidence_visit_ids: ["${visit_1}"], note: "Photo does not match the bound identity" }
              as: GateAgent
              as_user_id: "agent-77"
              captures: { case_1: "$.data.id" }
            - call: "POST /sharing-cases/${case_1}/review"
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /sharing-cases/${case_1}/decide"
              payload: { decision: "SUBSTANTIATED", rationale: "Gate photo mismatch confirmed" }
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /sharing-cases/${case_1}/appeal"
              payload: { statement: "The gate camera was obstructed" }
              as: Passholder
              as_user_id: "${holder_a}"
            - call: "POST /sharing-cases/${case_1}/review"
              as: ComplianceOfficer
              as_user_id: "officer-9"
          trigger:
            - call: "POST /sharing-cases/${case_1}/decide"
              payload: { decision: "DISMISSED", rationale: "Obstruction confirmed on the second look" }
              as: ComplianceOfficer
              as_user_id: "officer-9"
          assert:
            - "trigger response data.case_status == 'DISMISSED' and data.review_round == 2 (the cycle ran OPEN -> UNDER_REVIEW -> SUBSTANTIATED -> APPEAL_PENDING -> UNDER_REVIEW -> DISMISSED)"
            - "trigger response data.revocation_forfeit_cents == 30000 is retained as the audit trail of what was reversed"
            - "GET /season-passes/${pass_a} → data.pass_status == 'ACTIVE' (REVOKED is not terminal; the round-2 dismissal restores access)"
            - "GET /season-passes/${pass_a} → data.billing_status == 'PAID_IN_FULL' and data.paid_to_date_cents == 30000"
            - "GET /pass-programs/${prog}/revenue-summary → data.forfeited_revenue_cents == 0, data.base_revenue_cents == 30000, data.recognized_revenue_cents == 30000, data.deferred_revenue_cents == 0, data.active_pass_count == 1"
            - "GET /passholders/${holder_a} → data.status == 'ACTIVE' (a dismissed case never bans the holder)"
            - "a further POST /sharing-cases/${case_1}/appeal is refused with ERR_INVALID_CASE_STATE (409) because DISMISSED is terminal"

