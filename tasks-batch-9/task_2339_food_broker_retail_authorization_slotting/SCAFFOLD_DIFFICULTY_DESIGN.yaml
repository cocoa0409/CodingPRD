  - rule_id: boundary_precision_check
    instances:
      - name: void_rate_exactly_at_at_risk_threshold_flips_authorization_state
        grounds:
          - calculations.void_rate
          - state_machines.Authorization.AUTHORIZED_to_AT_RISK
          - entities.Retailer.fields.at_risk_void_rate_bps
          - endpoints.POST_/distribution-snapshots
        distinguishing_aspect: |
          Metric = void_rate_bps against retailer.at_risk_void_rate_bps on
          POST /distribution-snapshots, tested at exactly the threshold and at
          threshold-1 with a ONE-STORE difference in the input (8500 vs 8501
          distributed of 10000 authorized → 1500 bps vs 1499 bps). The comparison
          is >= so the on-threshold authorization flips to AT_RISK while its twin
          stays AUTHORIZED; an implementation using > passes the twin and fails
          the on-threshold case. Both snapshots report reported_store_count ==
          authorized_store_count so the result is identical under either
          void_rate basis, isolating the threshold comparison from the basis
          choice. The sibling boundary is a different metric (set cardinality of
          authorized_item_ids) on a different endpoint (decide).
        test_recipe:
          setup:
            - "Retailer BIGMART with total_store_count 12000 and at_risk_void_rate_bps 1500; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement; two VALIDATED items (upc 011111000001 and 022222000002)."
            - "Review with new_item_slots 2, one SUBMITTED presentation carrying both items, no slotting deal."
            - "Decided at 2026-09-02 with default_store_count 10000, producing two authorizations — AUTHORIZED (auto-advanced because slotting_deal_id is null), UNBILLED, authorized_store_count 10000 each — ordered created_at ASC then upc ASC, so index 0 is the 011111000001 item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 12000, at_risk_void_rate_bps: 1500 }
              as: BrokerAdmin
