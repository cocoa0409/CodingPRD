              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/purchase-orders"
              payload: { covered_entity_id: "${ce_id}", drug_product_id: "${dp_id}", channel: "B340B", packages_ordered: 1, quarter: "2026Q2", unit_price_paid_cents: 2600 }
              as: PharmacyOperator
            - call: "GET /340b/drug-products/${dp_id}"
              payload: {}
              as: HrsaAuditor
              captures: { dp_ver: $.data.version }
          trigger:
            - call: "POST /340b/drug-products/${dp_id}/reconcile"
              payload: { quarter: "2026Q2", expected_drug_product_version: "${dp_ver}" }
              as: HrsaAuditor
              captures: { obl_id: $.data.id, assessed: $.data.assessed_cents }
          assert:
            - "Reconcile succeeds with HTTP status 201; RepaymentObligation.${obl_id}.assessed_cents == 3000 (overcharge 100/unit * 30 units)"

      - name: derived_open_repayment_reconciled_after_partial_remit_excluded
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CoveredEntity.fields.open_repayment_cents
