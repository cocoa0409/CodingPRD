              as: HarborMaster
            - call: "POST /marinas"
              payload: { name: "P2", harbor_code: "PP2", liveaboard_cap: 1 }
              as: HarborMaster
            - call: "POST /marinas"
              payload: { name: "P3", harbor_code: "PP3", liveaboard_cap: 1 }
              as: HarborMaster
          trigger:
            - call: "GET /marinas"
              payload: { limit: 2, offset: 0 }
              as: HarborMaster
          assert:
            - "response data array has length 2"
            - "response meta.total_count == 3"
            - "response meta.has_more == true"

      - name: error_cascading_side_effect_three_hop_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Slip.OCCUPIED_to_AVAILABLE]
        excluded_because:
          difficulty_instance: transitive_cascade / checkout_triggers_three_hop_cascade_to_waitlist
          rationale: "Three-hop cascade is the central assertion of the named §1.8 instance."

      - name: error_tiered_seasonal_pricing_already_covered
        claim_type: tiered_pricing
        grounds: [calculations.seasonal_lease_pricing]
        excluded_because:
          difficulty_instance: dual_variant_calc / seasonal_pricing_variants_diverge_on_lease
          rationale: "Tiered seasonal pricing divergence is the variant-divergence assertion of the named §1.8 instance."

      - name: selector_policy_waitlist_head_pick_already_covered
        claim_type: selector_policy
        grounds: [calculations.waitlist_promotion_pick]
        excluded_because:
          difficulty_instance: transitive_cascade / checkout_triggers_three_hop_cascade_to_waitlist
          rationale: "Selector ordering (requested_at ASC, created_at ASC) is asserted as the queue-head promotion in the named §1.8 instance."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_lease_appears_in_get_after_create
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "POST /leases followed immediately by GET /leases/{id} returns the just-created lease (immediate-consistency model)."
        test_recipe:
          setup: ["Marina/slip/tenant/vessel exist."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MIC", harbor_code: "MIC", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "IC-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tic@x.com", full_name: "TIC" }
              as: HarborMaster
              captures: { t_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${t_id}", name: "VIC", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PIC", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { v_id: $.data.id }
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${t_id}", vessel_id: "${v_id}", start_date: "2026-09-01", end_date: "2026-09-05", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
          trigger:
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: HarborMaster
          assert:
            - "response.data.id == ${lease_id}"
            - "response.data.status == \"RESERVED\""
