        claim_type: violation_error
        grounds:
          - validations[priority=33]
          - errors.ERR_ITERATION_OUT_OF_SEQUENCE
          - entities.PipeSizingIteration.fields.iteration_index
        distinguishing_aspect: |
          The check is against the row COUNT, not against the highest index seen, and skipping a number
          is refused rather than accepted-and-renumbered: with one row on file, index 3 is a 409 and the
          retry at index 2 succeeds and takes the chain to two segments. A server that appended the
          rejected row anyway would make the retry at index 2 fail too.
