# =====================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2556 - Senior Games & Masters Competition
#
# Every instance grounds in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in `assert:` was produced by executing the relevant
# calculations[].formula against its constants[] in Python.
#
# Fixture conventions used throughout:
#   * The server's logical clock starts at 2026-08-01T00:00:00Z (§1.5
#     POST /senior-games/_clock/set_current_utc). Chains that need another
#     instant set it explicitly.
#   * The reference edition is always competition_start_date 2026-09-10,
#     competition_end_date 2026-09-20, age_reference_date 2026-12-31,
#     registration_deadline_utc 2026-08-25T23:59:59Z.
#   * date_of_birth 1971-11-20 -> age_at_reference 55, age_at_first_day 54.
#   * date_of_birth 1966-03-02 -> age 60 on both bases (band 60-64).
# =====================================================================
scaffold_difficulty_design:

  # ===================================================================
  # RULE 1 - Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: age_basis_variant_flips_athlete_age_group_band
        grounds:
          - calculations.athlete_age_group_assignment
          - entities.GamesEdition.fields.age_basis
          - entities.Athlete.fields.age_group_code
          - entities.Athlete.fields.age_at_reference
          - entities.Athlete.fields.age_at_first_day
        distinguishing_aspect: |
          This dual variant is an eligibility CLASSIFICATION on the Athlete domain selected by the
          parent GamesEdition's age_basis configuration field: the identical date_of_birth
          1971-11-20 is assigned age_group_code "55-59" under REFERENCE_DATE and "50-54" under
          FIRST_COMPETITION_DAY, so the two variants disagree on which competitive band the row
          belongs to (not on any monetary amount).
        test_recipe:
          setup:
            - "Two GamesEdition rows exist with identical dates but opposite age_basis values: edition R uses REFERENCE_DATE, edition F uses FIRST_COMPETITION_DAY."
            - "One shared LOW-contact TRACK sport with min_age 50, and one OPEN SportEvent under each edition, so both editions satisfy the open-registration precondition."
            - "Both editions are in status REGISTRATION_OPEN and the logical clock sits at its 2026-08-01T00:00:00Z default, before both registration deadlines."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026 (reference basis)", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z", age_basis: "REFERENCE_DATE", municipal_support_cents: 500000 }
              as: GamesAdmin
              captures: { ed_r_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_r_id}", event_code: "T100M", age_group_code: "55-59", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_r_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_r_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026 (first-day basis)", host_city: "Peoria", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z", age_basis: "FIRST_COMPETITION_DAY", municipal_support_cents: 500000 }
              as: GamesAdmin
              captures: { ed_f_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_f_id}", event_code: "T100M", age_group_code: "50-54", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_f_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_f_id}/open-registration"
              payload: {}
              as: GamesAdmin
          trigger:
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_r_id}", full_name: "Ray Nolan", email: "ray.nolan@example.com", date_of_birth: "1971-11-20", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_r_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_f_id}", full_name: "Ray Nolan", email: "ray.nolan@example.com", date_of_birth: "1971-11-20", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_f_id: $.data.id }
          assert:
            - "Athlete.${ath_r_id}.age_at_reference == 55"
            - "Athlete.${ath_r_id}.age_at_first_day == 54"
            - "Athlete.${ath_r_id}.age_group_code == \"55-59\""
            - "Athlete.${ath_f_id}.age_at_reference == 55"
            - "Athlete.${ath_f_id}.age_at_first_day == 54"
            - "Athlete.${ath_f_id}.age_group_code == \"50-54\""
            - "Athlete.${ath_r_id}.age_group_code != Athlete.${ath_f_id}.age_group_code"
            - "both POST /senior-games/athletes calls return HTTP 201"

      - name: economic_impact_provisional_versus_final_divergence
        grounds:
          - calculations.economic_impact_projection
          - state_machines.GamesEdition.COMPLETED_to_IMPACT_FINALIZED
          - entities.GamesEdition.fields.provisional_impact_cents
          - entities.GamesEdition.fields.final_impact_cents
          - entities.VillageStay.fields.nights
        distinguishing_aspect: |
          This dual variant is a MONETARY projection on the GamesEdition domain selected by
          lifecycle phase rather than by a configuration field: the forward-looking variant counts
          all 3 non-terminal registrants at a flat 4 projected nights and yields 901320 cents at
          ops-run, while the chronological variant counts only the 1 athlete who reached CHECKED_IN
          and replays the real 5-night VillageStay to yield 375550 cents at finalize-impact.
        test_recipe:
          setup:
            - "One edition holds 3 athletes who all paid their 9500-cent no-entry registration fee and are therefore REGISTERED."
            - "Athlete A1 has a CLEARED medical screening, has checked in, and holds one 5-night VillageStay (2026-09-10 -> 2026-09-15) in a 4-bed block."
            - "The logical clock has been walked to 2026-09-21T00:00:00Z and ops-run has advanced the edition to COMPLETED, completing A1's stay."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z", age_basis: "REFERENCE_DATE", municipal_support_cents: 500000 }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Frost", email: "a1@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ben Hoyt", email: "a2@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { a2_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Cleo Vance", email: "a3@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { a3_id: $.data.id }
            - call: "POST /senior-games/athletes/${a1_id}/pay-fees"
              payload: { amount_cents: 9500 }
              as: GamesAdmin
            - call: "POST /senior-games/athletes/${a2_id}/pay-fees"
              payload: { amount_cents: 9500 }
              as: GamesAdmin
            - call: "POST /senior-games/athletes/${a3_id}/pay-fees"
              payload: { amount_cents: 9500 }
              as: GamesAdmin
            - call: "POST /senior-games/medical-screenings"
              payload: { athlete_id: "${a1_id}", screened_by_user_id: "md-lopez", systolic_bp: 128, resting_hr: 70, prior_cardiac_event: false }
              as: MedicalDirector
              as_user_id: "md-lopez"
            - call: "POST /senior-games/accommodation-blocks"
              payload: { games_edition_id: "${ed_id}", name: "Village Block A", bed_capacity: 4, nightly_rate_cents: 8000, accessible_units: 1 }
              as: GamesAdmin
              captures: { blk_id: $.data.id, blk_v1: $.data.version }
            - call: "POST /senior-games/village-stays"
              payload: { athlete_id: "${a1_id}", accommodation_block_id: "${blk_id}", check_in_date: "2026-09-10", check_out_date: "2026-09-15", expected_block_version: "${blk_v1}" }
              as: GamesAdmin
              captures: { stay_id: $.data.id }
            - call: "POST /senior-games/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:00:00Z" }
              as: GamesAdmin
            - call: "POST /senior-games/games-editions/${ed_id}/ops-run"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/games-editions/${ed_id}/ops-run"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes/${a1_id}/check-in"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T06:00:00Z" }
              as: GamesAdmin
            - call: "POST /senior-games/games-editions/${ed_id}/ops-run"
              payload: {}
              as: GamesAdmin
              captures: { ed_prov: $.data.provisional_impact_cents }
          trigger:
            - call: "POST /senior-games/games-editions/${ed_id}/finalize-impact"
              payload: {}
              as: SponsorLiaison
              as_user_id: "sl-marks"
          assert:
            - "GamesEdition.${ed_id}.provisional_impact_cents == 901320"
            - "GamesEdition.${ed_id}.final_impact_cents == 375550"
            - "GamesEdition.${ed_id}.provisional_impact_cents != GamesEdition.${ed_id}.final_impact_cents"
            - "GamesEdition.${ed_id}.status == IMPACT_FINALIZED"
            - "VillageStay.${stay_id}.status == COMPLETED"
            - "VillageStay.${stay_id}.nights == 5"
            - "GET /senior-games/games-editions/${ed_id}/economic-impact returns registered_heads == 3, checked_in_heads == 1, actual_room_nights == 5"

  # ===================================================================
  # RULE 2 - Combinatorial formulas across different modes
  #   mode (c): athlete_fee_settlement      - pinned evaluation order
  #   mode (b): sponsorship_recognition     - pinned rounding order
  #   mode (a): medical_risk_score          - non-linear >=3-input formula
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_settlement_pinned_order_count_discount_then_amount_surcharge
        grounds:
          - calculations.athlete_fee_settlement
          - state_machines.Athlete.PENDING_PAYMENT_to_REGISTERED
          - entities.Athlete.fields.fee_total_cents
          - entities.Athlete.fields.fee_breakdown
          - validations[priority=98]
        distinguishing_aspect: |
          MODE (c) - circular-looking dependency with a pinned evaluation order: fee_total_cents is
          discounted_cents + surcharge_cents, but the discount tier is keyed on the ENTRY COUNT
          while the surcharge tier is keyed on the amount the discount itself produced, so the
          order STEP 4 (count-keyed discount) -> STEP 5 (amount-keyed surcharge) must be pinned;
          4 entries totalling 29000 cents of event fees resolve to exactly 35380 cents.
        test_recipe:
          setup:
            - "One edition in REGISTRATION_OPEN, one LOW-contact sport, and four 60-64 events with entry_fee_cents 6000, 6000, 8500 and 8500."
            - "One athlete born 1966-03-02 (age 60, band 60-64) holds one SUBMITTED SportEntry on each of the four events, so entry_count == 4 and event_fees_cents == 29000."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, before the 2026-08-25T23:59:59Z deadline."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z", age_basis: "REFERENCE_DATE" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_100_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T200M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_200_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T400M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 8500, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_400_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T800M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 8500, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_800_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Frost", email: "ada.frost@example.com", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_100_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_200_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_400_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_800_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
          trigger:
            - call: "POST /senior-games/athletes/${ath_id}/pay-fees"
              payload: { amount_cents: 35380 }
              as: GamesAdmin
          assert:
            - "Athlete.${ath_id}.fee_total_cents == 35380"
            - "Athlete.${ath_id}.fee_paid_cents == 35380"
            - "Athlete.${ath_id}.registration_status == REGISTERED"
            - "Athlete.${ath_id}.fee_breakdown.entry_count == 4"
            - "Athlete.${ath_id}.fee_breakdown.event_fees_cents == 29000"
            - "Athlete.${ath_id}.fee_breakdown.subtotal_cents == 38500"
            - "Athlete.${ath_id}.fee_breakdown.discount_pct == 0.12"
            - "Athlete.${ath_id}.fee_breakdown.discount_cents == 4620"
            - "Athlete.${ath_id}.fee_breakdown.discounted_cents == 33880"
            - "Athlete.${ath_id}.fee_breakdown.surcharge_cents == 1500"

      - name: sponsorship_per_bucket_rounding_beats_sum_then_round_by_one_cent
        grounds:
          - calculations.sponsorship_recognition_allocation
          - state_machines.SponsorshipCommitment.PLEDGED_to_ALLOCATED
          - entities.SponsorshipCommitment.fields.allocation_map
          - entities.GamesEdition.fields.sponsorship_recognized_cents
          - concurrency_rules[sponsorship-allocate-stale-games-edition]
        distinguishing_aspect: |
          MODE (b) - nested rounding whose ORDER is observable: a 250100-cent SILVER pledge rounds
          per bucket to 105042 + 78782 + 52521 + 26261 = 262606 cents, whereas the forbidden
          sum-then-round alternative round_half_up(250100 * 1.05) yields 262605, so the assertion
          on 262606 falsifies any implementation that rounds the total once.
        test_recipe:
          setup:
            - "One edition exists (status DRAFT is sufficient; only IMPACT_FINALIZED is barred for sponsorship writes)."
            - "One SponsorshipCommitment exists with tier SILVER, pledged_cents 250100 and status PLEDGED; the edition ledger sponsorship_recognized_cents is still 0."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sponsorship-commitments"
              payload: { games_edition_id: "${ed_id}", sponsor_name: "Cardinal Mutual", sponsor_kind: "CORPORATE", tier: "SILVER", pledged_cents: 250100 }
              as: SponsorLiaison
              as_user_id: "sl-marks"
              captures: { sc_id: $.data.id }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: SponsorLiaison
              as_user_id: "sl-marks"
              captures: { ed_v: $.data.version }
          trigger:
            - call: "POST /senior-games/sponsorship-commitments/${sc_id}/allocate"
              payload: { expected_games_edition_version: "${ed_v}" }
              as: SponsorLiaison
              as_user_id: "sl-marks"
          assert:
            - "SponsorshipCommitment.${sc_id}.recognized_cents == 262606"
            - "SponsorshipCommitment.${sc_id}.recognized_cents != 262605"
            - "SponsorshipCommitment.${sc_id}.allocation_map.VENUE_SIGNAGE == 105042"
            - "SponsorshipCommitment.${sc_id}.allocation_map.ATHLETE_SERVICES == 78782"
            - "SponsorshipCommitment.${sc_id}.allocation_map.MEDICAL_COVERAGE == 52521"
            - "SponsorshipCommitment.${sc_id}.allocation_map.SOCIAL_PROGRAM == 26261"
            - "SponsorshipCommitment.${sc_id}.status == ALLOCATED"
            - "GamesEdition.${ed_id}.sponsorship_recognized_cents == 262606"

      - name: medical_risk_score_nested_min_max_with_tiered_bp_branch
        grounds:
          - calculations.medical_risk_score
          - state_machines.Athlete.NOT_SCREENED_to_SCREENED_HOLD
          - entities.MedicalScreening.fields.risk_score
          - entities.MedicalScreening.fields.contact_sport_count
          - entities.Athlete.fields.medical_status
        distinguishing_aspect: |
          MODE (a) - a single formula over five inputs with genuinely non-linear interaction: two
          nested caps (min(30, (age-55)*1.5) and min(20, contact_entries*7)), a floor
          (max(0, hr-70)*0.4), a three-way conditional tier on systolic_bp and a multiplicative
          cardiac factor; age 68 / bp 152 / hr 88 / no cardiac history / 2 HIGH-contact entries
          resolves to exactly 65.7 and therefore HOLD_PENDING_PHYSICIAN_REVIEW.
        test_recipe:
          setup:
            - "One edition in REGISTRATION_OPEN and one HIGH-contact sport with two 65-69 events."
            - "One athlete born 1958-06-15 (age_at_reference 68, band 65-69) holds one SUBMITTED SportEntry on each HIGH-contact event, so contact_sport_count == 2 and the 7-points-per-entry load term is 14, below its cap of 20."
            - "The athlete's medical dimension is still NOT_SCREENED."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "BASKET", name: "3x3 Basketball", contact_class: "HIGH", mark_direction: "HIGHER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_bb_id}", games_edition_id: "${ed_id}", event_code: "BB3X3", age_group_code: "65-69", gender_division: "MEN", entry_fee_cents: 4000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_bb3_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_bb_id}", games_edition_id: "${ed_id}", event_code: "BBFULL", age_group_code: "65-69", gender_division: "MEN", entry_fee_cents: 4000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_bbf_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Gus Marlow", email: "gus.marlow@example.com", date_of_birth: "1958-06-15", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_bb3_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries"
