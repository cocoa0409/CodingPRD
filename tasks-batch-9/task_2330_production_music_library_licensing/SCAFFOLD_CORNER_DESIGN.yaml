              as: RoyaltyAccountant
          assert:
            - "Call 1 → 200 with basis \"ACCRUAL\", accrual_gross_cents 40000, cash_gross_cents 40000, gross_cents 40000, included_entry_count 1, outstanding_advance_cents 0, projected_recoup_cents 0, projected_withholding_cents 12000, projected_net_cents 28000 and projected_payout_status \"PAYABLE\""
            - "Call 2 → 200 with exactly the same figures as call 1 (the composer may read its own preview)"
