  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: markdown_stage_windows_are_half_open_so_shared_boundary_dates_do_not_overlap
        grounds:
          - validations[priority=60]
          - errors[ERR_STAGE_WINDOW_OVERLAP]
          - entities.MarkdownStage.fields.window_start_date
          - state_machines.MarkdownStage.ARMED_to_VOIDED
          - concurrency_rules[markdown-stage-create-stale-store]
        distinguishing_aspect: |
          MarkdownStage windows use HALF-OPEN [start, end) interval semantics against a pairwise
          per-store constraint: stage 2 starting exactly on stage 1's window_end_date 2026-09-29 is
          accepted, while a stage 3 starting 2026-10-12 — one day inside stage 2's window that ends
          2026-10-13 — is rejected. The same create then succeeds under supersede_overlapping, which
          VOIDs the overlapped stage instead of refusing.
        test_recipe:
          setup:
            - "One SELLING store in NY, no sales days, both stages ARMED (never activated)"
            - "Stage 1 discount 0.20 over [2026-09-15,2026-09-29), stage 2 discount 0.40 over [2026-09-29,2026-10-13)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
