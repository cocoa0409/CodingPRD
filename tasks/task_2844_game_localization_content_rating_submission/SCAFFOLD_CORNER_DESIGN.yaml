            - "the first mark-release-ready returns HTTP 422 with error_id == ERR_TEXT_OVERFLOW_UNRESOLVED even though priority 44 (all passes CLOSED, one LINGUISTIC pass), 52, 53, 59, 60 and 70 are all satisfied"
            - "rejecting the bug makes it terminal REJECTED and drops it out of the open set: defect_density recomputes to 0.0000 on the second close"
            - "qa-marking the unit PASSED leaves overflow_chars at 15 - PASSED is an explicit overflow waiver, not a re-measurement"
            - "closing the already-CLOSED pass returns HTTP 409 with error_id == ERR_QA_PASS_NOT_OPEN (the mirror image of ERR_QA_PASS_NOT_CLOSED on reopen)"
            - "the second mark-release-ready returns HTTP 200 with status == RELEASE_READY; Title.ready_market_count == 1 == market_plan_count so Title.localization_state == SHIPPED and release_gate_state == CLEARED"

      - name: localization_incomplete_fires_for_missing_units_and_for_missing_voice_lines
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOCALIZATION_INCOMPLETE]
          - validations[priority 59]
          - state_machines.MarketPlan[IN_LOCALIZATION -> LQA]
        distinguishing_aspect: "One error code covers two disjoint completeness clauses, and the voice clause applies only to FULL_VOICE/FULL_CULTURAL: the KR plan has every unit delivered and still cannot enter LQA because no session was recorded, while the JP plan is blocked purely on unit count. Fixing the JP plan alone must not bubble the Title to CERT_WINDOW."
        test_recipe:
          setup:
            - "Title NOVA-80 with two keys; JP TEXT_ONLY plan and KR FULL_VOICE plan (required_voice_line_count 40), both at IN_LOCALIZATION. JP has only the menu unit delivered; KR has both units delivered and no recorded session."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-80", name: "Nova Drift 80", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 60, ui_surface: "HUD", display_char_limit: 80, tm_match_pct: 80 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
