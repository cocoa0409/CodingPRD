            - "the agent's 2026-07 statement has direct_residual_cents 8985 (2995 * 3) and 8985 + 8982 == 17967 exactly — the aggregate is conserved with no rounding drift"
            - "the empty batch ${b2} normalizes successfully to state NORMALIZED with line_count 0, gross_volume_cents 0 and total_normalized_net_revenue_cents 0"
            - "GET /residual-lines?residual_batch_id=${b1} taken right after the recall returns total_count 2 with processor_cost_cents, normalized_net_revenue_cents and normalization_mode_applied null on both rows — the lines themselves are never deleted by a recall"
            - "GET /residual-batches?processor_program_id=${p1} returns total_count 2 (${b1} POSTED, ${b2} NORMALIZED) and GET /processor-programs?status=ACTIVE returns total_count 1 with posted_batch_count 1 — only the posted batch counted"

  - section: validations
    instances:

      - name: coverage_window_shape_is_refused_three_ways_and_period_month_outranks_it
        claim_type: Violation → Error
        grounds:
          - validations[priority 11 / ERR_COVERAGE_WINDOW_INVALID]
          - validations[priority 5 / ERR_INVALID_PERIOD_MONTH]
          - endpoints.POST /residual-batches
        distinguishing_aspect: "All three legs of the coverage-shape rule are refused independently (empty window, start before the period, end more than one month past the period), while a request that breaks BOTH the period_month pattern and the window shape reports the priority-5 ERR_INVALID_PERIOD_MONTH — and the maximal legal spill (period 2026-07 ending exactly 2026-09-01) is accepted."
        test_recipe:
          setup: ["A single ACTIVE processor program and no existing batches, so no overlap or checksum rule can interfere."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-13", coverage_start: "2026-06-30", coverage_end: "2026-08-01", file_checksum: "sha256:cw-0001" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-07-01", file_checksum: "sha256:cw-0002" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-06-30", coverage_end: "2026-08-01", file_checksum: "sha256:cw-0003" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-09-02", file_checksum: "sha256:cw-0004" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e4: $.data.error_id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-09-01", file_checksum: "sha256:cw-0005" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
          assert:
            - "${e1} == ERR_INVALID_PERIOD_MONTH with HTTP 422 — the priority-5 pattern rule is reported even though coverage_start 2026-06-30 also breaks the priority-11 window rule"
            - "${e2} == ERR_COVERAGE_WINDOW_INVALID with HTTP 422 — coverage_end must be STRICTLY after coverage_start, so a zero-length window is refused"
            - "${e3} == ERR_COVERAGE_WINDOW_INVALID — coverage_start 2026-06-30 falls before the first day of period_month 2026-07"
            - "${e4} == ERR_COVERAGE_WINDOW_INVALID — coverage_end 2026-09-02 is past 2026-09-01, the first day of the second month after the period"
            - "the fifth call returns 201 and ResidualBatch.${b1} has state RECEIVED, line_count 0, gross_volume_cents 0, total_normalized_net_revenue_cents 0, iso_retained_cents 0, version 1 — 2026-09-01 is the maximal legal coverage_end"
            - "GET /residual-batches?processor_program_id=${p1} returns total_count 1: none of the four refused requests created a row"

      - name: recoupment_window_shape_is_refused_three_ways
        claim_type: Violation → Error
        grounds:
          - validations[priority 11 / ERR_RECOUPMENT_WINDOW_INVALID]
          - endpoints.POST /agents/{id}/advances
          - calculations.advance_recoupment_schedule.variants.straight_line_amortization
        distinguishing_aspect: "The rule has three independent legs and the third is conditional on recoupment_mode: an inverted window, a first month before the funding month, and a STRAIGHT_LINE_AMORTIZATION advance whose inclusive month span (5) disagrees with amortization_months (6). The same 5-month window with amortization_months 5 is then accepted, proving the span is counted INCLUSIVELY."
        test_recipe:
          setup: ["One ACTIVE agent with no advances; the logical clock is at the default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 100000, recoupment_pct: 0.30, first_recoupment_month: "2026-08", last_recoupment_month: "2026-07", funded_on: "2026-07-15", expected_agent_version: "${v1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 100000, recoupment_pct: 0.30, first_recoupment_month: "2026-06", last_recoupment_month: "2026-12", funded_on: "2026-07-15", expected_agent_version: "${v1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "PORTFOLIO_BUYOUT", recoupment_mode: "STRAIGHT_LINE_AMORTIZATION", principal_cents: 100000, amortization_months: 6, first_recoupment_month: "2026-08", last_recoupment_month: "2026-12", funded_on: "2026-07-15", expected_agent_version: "${v1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "PORTFOLIO_BUYOUT", recoupment_mode: "STRAIGHT_LINE_AMORTIZATION", principal_cents: 100000, amortization_months: 5, first_recoupment_month: "2026-08", last_recoupment_month: "2026-12", funded_on: "2026-07-15", expected_agent_version: "${v1}" }
              as: IsoAdmin
              captures: { adv: $.data.id }
          assert:
            - "${e1} == ERR_RECOUPMENT_WINDOW_INVALID with HTTP 422 — last_recoupment_month 2026-07 precedes first_recoupment_month 2026-08"
            - "${e2} == ERR_RECOUPMENT_WINDOW_INVALID — first_recoupment_month 2026-06 precedes the funding month 2026-07"
            - "${e3} == ERR_RECOUPMENT_WINDOW_INVALID — [2026-08, 2026-12] spans 5 inclusive months, not the declared 6"
            - "the fourth call returns 201: AgentAdvance.${adv}.state == ACTIVE, outstanding_cents == 100000, cumulative_recouped_cents == 0, months_recouped == 0, amortization_months == 5, recoupment_pct == null"
            - "Agent.${a1}.advance_outstanding_cents == 100000 and Agent.${a1}.version == ${v1} + 1 — none of the three refused requests bumped the version"
            - "GET /agent-advances?agent_id=${a1} returns total_count 1"

      - name: advance_exposure_ceiling_is_aggregate_and_lands_exactly_on_the_bootstrap_floor
        claim_type: Aggregate validation
        grounds:
          - validations[priority 13 / ERR_ADVANCE_EXPOSURE_EXCEEDED]
          - entities.Agent.fields.advance_outstanding_cents
          - entities.Agent.fields.trailing_residual_cents
        distinguishing_aspect: "An agent with no statements has trailing_residual_cents 0, so the ceiling is the 250000-cent bootstrap floor, not 0 and not 6 x 0. A first 200000 advance is fine and a second 60000 advance is individually trivial yet refused for 260000 in aggregate, while 50000 — landing exactly on 250000 — is accepted, proving the comparison is <=."
        test_recipe:
          setup: ["One ACTIVE agent with trailing_residual_cents 0 and one accepted 200000-cent advance."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id, v1: $.data.version }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 200000, recoupment_pct: 0.40, first_recoupment_month: "2026-08", last_recoupment_month: "2027-07", funded_on: "2026-07-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              captures: { advA: $.data.id }
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 60000, recoupment_pct: 0.40, first_recoupment_month: "2026-08", last_recoupment_month: "2027-07", funded_on: "2026-07-01", expected_agent_version: "${v2}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 50000, recoupment_pct: 0.40, first_recoupment_month: "2026-08", last_recoupment_month: "2027-07", funded_on: "2026-07-01", expected_agent_version: "${v2}" }
              as: IsoAdmin
              captures: { advB: $.data.id }
          assert:
            - "Agent.${a1}.trailing_residual_cents == 0 before both triggers, so the ceiling is max(250000, 6 x 0) == 250000"
            - "${e1} == ERR_ADVANCE_EXPOSURE_EXCEEDED with HTTP 409 — 200000 + 60000 == 260000 exceeds 250000 even though 60000 alone is far below it"
            - "the refused request created no AgentAdvance row and left Agent.${a1}.version == ${v2}, which is why the second trigger can reuse the same expected_agent_version"
            - "the second trigger returns 201: AgentAdvance.${advB}.principal_cents == 50000, outstanding_cents == 50000, state ACTIVE"
            - "Agent.${a1}.advance_outstanding_cents == 250000 — exactly the ceiling is admitted"
            - "GET /agent-advances?agent_id=${a1}&state=ACTIVE returns total_count 2 with outstanding_cents 200000 and 50000"

      - name: pct_range_outranks_the_recoupment_cap
        claim_type: Priority Ordering
        grounds:
          - validations[priority 5 / ERR_INVALID_PCT_RANGE]
          - validations[priority 13 / ERR_RECOUPMENT_PCT_EXCEEDS_CAP]
        distinguishing_aspect: "recoupment_pct 1.20 breaks the priority-5 range rule AND the priority-13 cap rule AND (in the same call) the priority-11 window rule — the range error must win. 0.60 is in range but over the 0.50 cap, and 0.50 exactly is accepted, so the cap comparison is <= and the two rules are genuinely distinct."
        test_recipe:
          setup: ["One ACTIVE agent with no advances."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 100000, recoupment_pct: 1.20, first_recoupment_month: "2026-09", last_recoupment_month: "2026-08", funded_on: "2026-07-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 100000, recoupment_pct: 0.60, first_recoupment_month: "2026-08", last_recoupment_month: "2027-07", funded_on: "2026-07-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 100000, recoupment_pct: 0.50, first_recoupment_month: "2026-08", last_recoupment_month: "2027-07", funded_on: "2026-07-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              captures: { adv: $.data.id }
          assert:
            - "${e1} == ERR_INVALID_PCT_RANGE with HTTP 422 — priority 5 beats both the priority-11 window error and the priority-13 cap error present in the same payload"
            - "${e2} == ERR_RECOUPMENT_PCT_EXCEEDS_CAP with HTTP 422 — 0.60 is a legal fraction but over MAX_TOTAL_RECOUPMENT_PCT"
            - "the third call returns 201 with AgentAdvance.${adv}.recoupment_pct == 0.50 — the cap is inclusive"
            - "Agent.${a1}.version == ${v1} + 1 and advance_outstanding_cents == 100000"

      - name: adjustment_sign_discipline_owns_the_zero_case
        claim_type: Violation → Error
        grounds:
          - validations[priority 13 / ERR_ADJUSTMENT_SIGN_INVALID]
          - validations[priority 4 / ERR_INVALID_REQUEST]
          - entities.StatementAdjustment.fields.kind
        distinguishing_aspect: "Sign discipline is one rule with three failure shapes on the same endpoint: a negative DISPUTE_CREDIT, a positive MANUAL_DEBIT, and amount_cents 0. Zero is a well-typed non-negative integer, so priority 4 does NOT fire — the non-zero clause lives inside the priority-13 rule and ERR_ADJUSTMENT_SIGN_INVALID must be reported. The accepted +500 DISPUTE_CREDIT then leaves the statement's money untouched because it is only PROPOSED."
        test_recipe:
          setup: ["CORNER-BASE through the 2026-07 post, giving agent A1 a DRAFT statement with direct_residual_cents 6300."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 1000, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:sg-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 20000, assessments_cents: 1300, gross_income_cents: 40000 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id", sv: "$.data[0].version" }
          trigger:
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "DISPUTE_CREDIT", amount_cents: -500, reason: "wrong direction", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "MANUAL_DEBIT", amount_cents: 500, reason: "wrong direction", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "DISPUTE_CREDIT", amount_cents: 0, reason: "no amount", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "DISPUTE_CREDIT", amount_cents: 500, reason: "chargeback reversed by issuer", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              as_user_id: analyst-1
              captures: { adj: $.data.id }
          assert:
            - "${e1} == ERR_ADJUSTMENT_SIGN_INVALID with HTTP 422 — DISPUTE_CREDIT must be strictly positive"
            - "${e2} == ERR_ADJUSTMENT_SIGN_INVALID — MANUAL_DEBIT must be strictly negative"
            - "${e3} == ERR_ADJUSTMENT_SIGN_INVALID and NOT ERR_INVALID_REQUEST — amount_cents 0 is a valid non-negative integer, so the priority-4 type rule passes and the priority-13 non-zero clause is what fails"
            - "none of the three refused calls bumped AgentStatement.${st}.version, so all four calls carry the same expected_statement_version"
            - "the fourth call returns 201: StatementAdjustment.${adj}.state == PROPOSED, amount_cents == 500, created_by_user_id == analyst-1, approved_by_user_id == null, version == 1"
            - "AgentStatement.${st}.adjustment_cents == 0 and net_payable_cents == 6300 — a PROPOSED adjustment moves no money"
            - "AgentStatement.${st}.version == ${sv} + 1 (the adjustment attached to it) while direct_residual_cents stays 6300"

      - name: clawback_reversal_may_not_exceed_lifetime_clawback
        claim_type: Violation → Error
        grounds:
          - validations[priority 13 / ERR_CLAWBACK_REVERSAL_EXCEEDS_CLAWBACK]
          - calculations.bonus_clawback
          - entities.Agent.fields.lifetime_clawback_cents
        distinguishing_aspect: "The ceiling is the agent's lifetime_clawback_cents (18800, produced by one 82-day attrition of a 27000-cent bonus), so 18801 is refused and exactly 18800 is accepted — the comparison is <=. Approving that reversal drives lifetime_clawback_cents to 0 and nets the statement's adjustment_cents back to 0."
        test_recipe:
          setup: ["Agent A1 with merchant M1 (upfront_bonus 27000, boarded 2026-04-10, equipment 0) attrited on 2026-07-01 — 82 days active — which creates an APPLIED BONUS_CLAWBACK of -18800 on A1's 2026-07 statement."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10", upfront_bonus_cents: 27000 }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m1}/attrite"
              payload: { attrition_date: "2026-07-01" }
              as: IsoAdmin
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id", sv: "$.data[0].version" }
          trigger:
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "CLAWBACK_REVERSAL", amount_cents: 18801, reason: "merchant re-signed, one cent too much", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "CLAWBACK_REVERSAL", amount_cents: 18800, reason: "merchant re-signed under a new MID", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              as_user_id: analyst-1
              captures: { adj: $.data.id }
            - call: "POST /statement-adjustments/${adj}/review"
              payload: {}
              as: ResidualController
              as_user_id: controller-1
            - call: "POST /statement-adjustments/${adj}/approve"
              payload: {}
              as: ResidualController
              as_user_id: controller-1
          assert:
            - "Merchant.${m1}.clawed_back_bonus_cents == 18800 == round_half_up(27000 x (270 - 82) / 270) and Agent.${a1}.lifetime_clawback_cents == 18800 before the triggers"
            - "${e1} == ERR_CLAWBACK_REVERSAL_EXCEEDS_CLAWBACK with HTTP 409 — one cent over the lifetime figure is refused"
            - "the second call returns 201 with StatementAdjustment.${adj}.kind == CLAWBACK_REVERSAL, amount_cents == 18800, state PROPOSED — exactly the lifetime figure is admitted"
            - "after the approve: StatementAdjustment.${adj}.state == APPLIED and approved_by_user_id == controller-1"
            - "AgentStatement.${st}.adjustment_cents == 0 (-18800 + 18800), net_payable_cents == 0 and carry_forward_deficit_cents == 0 — the earlier 18800 deficit is erased"
            - "Agent.${a1}.lifetime_clawback_cents == 0, so a further CLAWBACK_REVERSAL of any positive amount would now be refused"

      - name: hierarchy_cycle_and_depth_are_separate_refusals_and_depth_counts_descendants
        claim_type: Violation → Error
        grounds:
          - validations[priority 12 / ERR_HIERARCHY_CYCLE]
          - validations[priority 12 / ERR_HIERARCHY_DEPTH_EXCEEDED]
          - endpoints.PATCH /agents/{id}
          - entities.Agent.fields.hierarchy_depth
        distinguishing_aspect: "Self-parenting and descendant-parenting both raise ERR_HIERARCHY_CYCLE, while depth is checked for the moved agent AND every descendant: re-parenting B1 (which has a child) under the depth-3 agent A4 is refused because B2 would reach depth 5, even though B1 itself would only reach 4. Re-parenting under A3 instead succeeds and B2's depth is recomputed to 4."
        test_recipe:
          setup: ["Chain A1 <- A2 <- A3 <- A4 <- A5 with hierarchy_depth 0..4 (the maximum), plus a separate root B1 with one child B2. Every agent uses split_pct 0.10 and override_pct 0.90 so the monotonicity rule can never fire."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "A1 Root", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15", parent_agent_id: "${a1}" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /agents"
              payload: { name: "A3", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15", parent_agent_id: "${a2}" }
              as: IsoAdmin
              captures: { a3: $.data.id }
            - call: "POST /agents"
              payload: { name: "A4", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15", parent_agent_id: "${a3}" }
              as: IsoAdmin
              captures: { a4: $.data.id }
            - call: "POST /agents"
              payload: { name: "A5", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15", parent_agent_id: "${a4}" }
              as: IsoAdmin
              captures: { a5: $.data.id }
            - call: "POST /agents"
              payload: { name: "B1 Other Root", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { b1: $.data.id }
            - call: "POST /agents"
              payload: { name: "B2 Child", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15", parent_agent_id: "${b1}" }
              as: IsoAdmin
              captures: { b2: $.data.id }
          trigger:
            - call: "PATCH /agents/${a1}"
              payload: { parent_agent_id: "${a1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "PATCH /agents/${a1}"
              payload: { parent_agent_id: "${a3}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /agents"
              payload: { name: "A6 Too Deep", split_pct: 0.10, override_pct: 0.90, vesting_start_date: "2024-01-15", parent_agent_id: "${a5}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "PATCH /agents/${b1}"
              payload: { parent_agent_id: "${a4}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e4: $.data.error_id }
            - call: "PATCH /agents/${b1}"
              payload: { parent_agent_id: "${a3}" }
              as: IsoAdmin
          assert:
            - "hierarchy_depth is 0 / 1 / 2 / 3 / 4 for A1..A5 and 0 / 1 for B1 / B2 before the triggers"
            - "${e1} == ERR_HIERARCHY_CYCLE with HTTP 422 — an agent may not be its own parent"
            - "${e2} == ERR_HIERARCHY_CYCLE — A3 is reachable upward from A1, so the edge would close a loop"
            - "${e3} == ERR_HIERARCHY_DEPTH_EXCEEDED with HTTP 422 — a child of the depth-4 agent A5 would sit at depth 5, over MAX_HIERARCHY_DEPTH 4"
            - "${e4} == ERR_HIERARCHY_DEPTH_EXCEEDED — B1 itself would only reach depth 4, but its descendant B2 would reach 5, so the descendant walk is what refuses the write"
            - "after both refused PATCHes Agent.${b1}.parent_agent_id is still null and Agent.${b1}.hierarchy_depth is still 0"
            - "the fifth call returns 200: Agent.${b1}.parent_agent_id == ${a3}, hierarchy_depth == 3, and Agent.${b2}.hierarchy_depth == 4 — the descendant depth was recomputed by the parent's re-parent"
            - "GET /agents?parent_agent_id=${a3} returns total_count 2 (${a4} and ${b1})"

      - name: override_monotonicity_refuses_the_edge_that_would_pay_the_upline_nothing
        claim_type: Violation → Error
        grounds:
          - validations[priority 12 / ERR_OVERRIDE_PCT_NOT_MONOTONIC]
          - calculations.residual_split_allocation (STEP 2 differential walk)
        distinguishing_aspect: "The rule compares the parent's override_pct against max(child.split_pct, child.override_pct), so a child whose SPLIT alone exceeds the parent's override is refused even though its own override is smaller. Equality is accepted, and the check fires on a PATCH that MOVES an existing agent as well as on creation."
        test_recipe:
          setup: ["Parent P (split 0.10, override 0.40); root C (split 0.20, override 0.30) — legal under P; root D (split 0.60, override 0.60) — illegal under P."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "P Upline", split_pct: 0.10, override_pct: 0.40, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { p: $.data.id }
            - call: "POST /agents"
              payload: { name: "C Movable", split_pct: 0.20, override_pct: 0.30, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { c: $.data.id }
            - call: "POST /agents"
              payload: { name: "D Too Rich", split_pct: 0.60, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { d: $.data.id }
          trigger:
            - call: "POST /agents"
              payload: { name: "E Big Split", split_pct: 0.50, override_pct: 0.30, vesting_start_date: "2024-01-15", parent_agent_id: "${p}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agents"
              payload: { name: "F Big Override", split_pct: 0.20, override_pct: 0.45, vesting_start_date: "2024-01-15", parent_agent_id: "${p}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "PATCH /agents/${d}"
              payload: { parent_agent_id: "${p}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "POST /agents"
              payload: { name: "G At Equality", split_pct: 0.40, override_pct: 0.40, vesting_start_date: "2024-01-15", parent_agent_id: "${p}" }
              as: IsoAdmin
              captures: { g: $.data.id }
            - call: "PATCH /agents/${c}"
              payload: { parent_agent_id: "${p}" }
              as: IsoAdmin
          assert:
            - "${e1} == ERR_OVERRIDE_PCT_NOT_MONOTONIC with HTTP 422 — P's 0.40 override is below the child's 0.50 SPLIT, even though the child's override is only 0.30"
            - "${e2} == ERR_OVERRIDE_PCT_NOT_MONOTONIC — P's 0.40 is below the child's 0.45 override"
            - "${e3} == ERR_OVERRIDE_PCT_NOT_MONOTONIC — the rule fires on a PATCH that moves an existing agent, and Agent.${d}.parent_agent_id is still null afterwards"
            - "the fourth call returns 201: Agent.${g}.parent_agent_id == ${p}, hierarchy_depth == 1 — parent.override_pct == max(child.split_pct, child.override_pct) == 0.40 is admitted"
            - "the fifth call returns 200: Agent.${c}.parent_agent_id == ${p} and hierarchy_depth == 1"
            - "GET /agents?parent_agent_id=${p} returns total_count 2 (${g} and ${c}) — no refused edge exists"

      - name: uniqueness_and_program_membership_of_lines_and_mids
