            - "Booth.${booth_id}.stream_minutes_total == 7"
            - "Settlement.${st_id}.subject_type == SPONSOR"
            - "Settlement.${st_id}.line_items[0].line_total_cents == 900000"
            - "Settlement.${st_id}.line_items[1].line_total_cents == 413"
            - "Settlement.${st_id}.line_items[2].line_total_cents == 30"
            - "Settlement.${st_id}.subtotal_cents == 900443"
            - "Settlement.${st_id}.tax_cents == 74287"
            - "Settlement.${st_id}.total_cents == 974730"
            - "Settlement.${st_id}.platform_fee_cents == 0"

      - name: event_settlement_fee_discount_tier_keyed_on_subtotal_not_total
        grounds:
          - calculations.event_settlement_total
          - entities.Settlement.fields.platform_fee_cents
          - entities.Settlement.fields.total_cents
          - entities.Event.fields.streamed_minutes_total
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with pinned evaluation order: the volume discount
          that reduces the platform fee is keyed on subtotal_cents (202620, tier 1 => 10%), not on
          the total the fee itself produces (14709, which would key to 0%), giving platform_fee_cents
          14589 instead of the undiscounted 16210.
        test_recipe:
          setup:
            - "Event 'Summit D' driven to ENDED, early_bird_ends_at in the past."
            - "One registration on a 200000-cent GENERAL ticket, priced 202500 (processing fee clamped at the 2500 ceiling) and PAID."
            - "One session with an ACCEPTED speaker whose broadcast went LIVE at 2026-07-01T00:00:00Z and ENDED at 2026-07-01T00:30:00Z, giving Event.streamed_minutes_total 30."
