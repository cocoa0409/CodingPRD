            - { call: "POST /sap/plans", payload: { student_id: "${stu}", appeal_id: "${ap}", start_term_id: "${t3}", total_required_credits: 18, checkpoints: [{ term_id: "${t3}", required_term_gpa: 3.0, required_term_pace_pct: 75.0, required_earned_credits: 9 }, { term_id: "${t4}", required_term_gpa: 3.0, required_term_pace_pct: 75.0, required_earned_credits: 9 }] }, as: AidOfficer, captures: { plan: $.data.id } }
