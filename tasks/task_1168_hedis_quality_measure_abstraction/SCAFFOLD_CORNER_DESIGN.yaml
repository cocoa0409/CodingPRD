            - { call: "GET /hedis/supplemental-batches/${b2}/records", as: QualityAnalyst, captures: { dx: "$.data[0].disposition", dy: "$.data[1].disposition" } }
          assert:
            - "rc2 == 2 and acc2 == 0"
            - "dx == 'REJECTED_DUPLICATE' — matches the accepted R1 from batch1 (same run, ACCEPTED batch scope)"
            - "dy == 'REJECTED_OUT_OF_WINDOW' — 2024-12-31 is outside measurement year 2025"

      - name: provider_gap_burden_excludes_closed_gaps
        claim_type: input_set_filtering
        grounds:
          - "calculations.provider_gap_burden"
          - "entities.GapItem.fields.status"
        distinguishing_aspect: "The burden's open-gap input set is restricted to status {OPEN, OUTREACH_DONE}: a CLOSED_COMPLIANT gap leaves both open_gap_count and the per-measure line count."
        test_recipe:
          setup:
            - "ADMIN fixture: provider P1, members M1/M2 attr P1, spec CBP weight 1.0 (default); run RATE_COMPUTED -> gaps g1(M1), g2(M2) OPEN; g1 moved OUTREACH_DONE then CLOSED_COMPLIANT (MANUAL)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin, captures: { p1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M2", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v1}" }, as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_id}/gap-items", as: QualityAnalyst, captures: { g1: "$.data[0].id" } }
            - { call: "POST /hedis/gap-items/${g1}/mark-outreach-done", as: ProviderRelations }
            - { call: "POST /hedis/gap-items/${g1}/close", payload: { outcome: "CLOSED_COMPLIANT" }, as: ProviderRelations }
          trigger:
            - { call: "GET /hedis/providers/${p1}/gap-burden", payload: { season_id: "${season_id}" }, as: ProviderRelations, captures: { burden: $.data.burden_score, ogc: $.data.open_gap_count, lines: $.data.per_measure_lines } }
          assert:
            - "ogc == 1 and lines == 1 — the CLOSED_COMPLIANT gap is excluded from the {OPEN, OUTREACH_DONE} input set"
            - "burden == 1.0 — round_half_up(1 * 1.0, 2dp)"

  # ===========================================================================
  - section: validations
    instances:
      - name: create_member_missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails authentication before any other check (priority 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER' (headers absent)"

      - name: member_create_invalid_enum_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "entities.Member.fields.gender"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "gender outside the declared enum {F, M} is a request-shape error (400), not a business error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "X" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: segment_inverted_span_invalid_request
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "entities.MemberEnrollmentSegment.fields.span_end"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "span_start > span_end violates the closed-interval shape rule (span_start <= span_end) with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["member M1 exists"]
          setup_api_calls:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-12-31T00:00:00Z", span_end: "2025-01-01T00:00:00Z" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: overread_disagree_missing_final_result_invalid_request
        claim_type: violation_to_error
        grounds:
          - "entities.OverReadReview.fields.final_result"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "final_result is conditionally required: a DISAGREE review without it fails request shape (400) before state checks."
        test_recipe:
          setup: ["HYBRID floor-1 fixture: a1 (HIT) SUBMITTED by abs-1 and flagged"]
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", sample_size_floor: 1, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
          trigger:
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "DISAGREE" }, as: OverReader, as_user_id: "orr-1", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' — DISAGREE requires final_result"

      - name: receive_unknown_chase_returns_not_found
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 6): receiving a non-existent chase yields ERR_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/chart-chases/00000000-0000-0000-0000-000000000000/receive", as: QualityAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: occ_checked_before_state_returns_412
        claim_type: priority_ordering
        grounds:
          - "validations[priority=5]"
          - "concurrency_rules[compute-rate-stale-run]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC (priority 5) precedes state (priority 6): compute-rate on a POPULATION_PENDING run with a stale expected version returns ERR_STALE_VERSION, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["ADMIN fixture: run created (version 1), identify-population NOT called"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id, v_create: $.data.version } }
          trigger:
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v_create} - 1" }, as: QualityAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_STALE_VERSION' — the stale OCC view is reported before the POPULATION_PENDING state violation"

      - name: duplicate_measure_code_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_MEASURE_CODE]"
        distinguishing_aspect: "(season_id, hedis_measure_code) is unique: a second load of the same code into the same season with a FRESH season version still fails on the constraint (proving OCC passed and the constraint fired)."
        test_recipe:
          setup: ["season with spec BCS already loaded (season.version advanced to 2 by the load)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { sp1: $.data.id }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { season_v2: $.data.version } }
          trigger:
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.2", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v2}" }
              as: QualityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_DUPLICATE_MEASURE_CODE'"

      - name: duplicate_member_ref_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_MEMBER_REF]"
        distinguishing_aspect: "member_ref is globally unique across members."
        test_recipe:
          setup: ["member M1 registered"]
          setup_api_calls:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin }
          trigger:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1985-05-05T00:00:00Z", gender: "M" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_DUPLICATE_MEMBER_REF'"

      - name: duplicate_provider_ref_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_PROVIDER_REF]"
        distinguishing_aspect: "provider_ref is globally unique across providers."
        test_recipe:
          setup: ["provider P1 registered"]
          setup_api_calls:
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin }
          trigger:
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider Uno" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_DUPLICATE_PROVIDER_REF'"

      - name: sample_already_exists_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SAMPLE_ALREADY_EXISTS]"
        distinguishing_aspect: "At most one sample per run: the second draw is rejected even though the run is HYBRID and POPULATED."
        test_recipe:
          setup: ["HYBRID floor-1 fixture: run POPULATED, sample already drawn"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", sample_size_floor: 1, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst }
          trigger:
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_SAMPLE_ALREADY_EXISTS'"

      - name: duplicate_abstraction_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_ABSTRACTION]"
        distinguishing_aspect: "At most one non-terminal abstraction per chase: a second create while the first is still DRAFT is a constraint violation (not a state error — the chase is legitimately RECEIVED)."
        test_recipe:
          setup: ["HYBRID floor-1 fixture: chase c1 RECEIVED, abstraction a1 DRAFT on c1 (chase stays RECEIVED until first submit)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", sample_size_floor: 1, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "MISS" }, as: Abstractor, as_user_id: "abs-2", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_DUPLICATE_ABSTRACTION'"

      - name: method_gate_sample_on_admin_run_returns_422
        claim_type: conditional_validation
        grounds:
          - "validations[priority=10.3]"
          - "errors[ERR_METHOD_NOT_HYBRID]"
        distinguishing_aspect: "POST /hedis/samples is conditional on the run's pinned collection_method: ADMINISTRATIVE runs are rejected with ERR_METHOD_NOT_HYBRID."
        test_recipe:
          setup: ["ADMIN fixture: run POPULATED (denominator 1)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
          trigger:
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_METHOD_NOT_HYBRID'"

      - name: exclusion_after_draw_returns_422
        claim_type: conditional_validation
        grounds:
