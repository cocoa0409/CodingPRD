            - "l2_status == NOT_AWARDED and len(bids_list) == 2"

  # ===========================================================================
  # Section: validations (Table 4 claims)
  # ===========================================================================
  - section: validations
    instances:
      - name: request_with_unknown_role_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 rejects requests whose auth headers are absent entirely and
          requests whose X-User-Role carries an undeclared role value — both
          return ERR_UNAUTHENTICATED (401) before any role/existence check.
        test_recipe:
          setup:
            - "one owner and one parcel registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Zed Zelkova", mailing_address: "76 Zelkova St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-V1", owner_id: "${owner_id}", street_address: "76 Zelkova St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
          trigger:
            - call: "GET /parcels/${parcel_id}"
              note: "sent with no X-User-Role / X-User-ID headers at all"
              captures: { err_missing: "$.data.error_id" }
            - call: "GET /parcels/${parcel_id}"
              as: Anonymous
              note: "X-User-Role set to a value that is not a declared role"
              captures: { err_unknown: "$.data.error_id" }
          assert:
            - "err_missing == ERR_UNAUTHENTICATED (headers absent)"
            - "err_unknown == ERR_UNAUTHENTICATED (role value not recognized)"

      - name: appeal_by_non_owner_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=3]
          - errors[ERR_OWNERSHIP_MISMATCH]
          - state_machines.RepairNotice.ISSUED_to_UNDER_APPEAL
        distinguishing_aspect: |
          Ownership (priority 3) is evaluated against the parcel chain of the
          target notice: owner B appealing owner A's ISSUED notice fails with
          ERR_OWNERSHIP_MISMATCH (403) even though the notice state and appeal
          window are both valid.
        test_recipe:
          setup:
            - "two owners; parcel and notice (ISSUED) belong to owner A; owner B exists"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ann Acer", mailing_address: "77 Acer St" }, as: ProgramCoordinator, captures: { owner_a: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Bob Balsa", mailing_address: "78 Balsa St" }, as: ProgramCoordinator, captures: { owner_b: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-V2", owner_id: "${owner_a}", street_address: "77 Acer St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-V2-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /repair-notices/${notice_id}/appeal", payload: { grounds: "not mine to appeal" }, as: PropertyOwner, as_user_id: "${owner_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_OWNERSHIP_MISMATCH (acting owner does not own notice.parcel_id)"

      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_PROGRAM_CYCLE_NOT_FOUND]
        distinguishing_aspect: |
          Pair (auth, existence): an Inspector locking a NON-EXISTENT cycle
          violates priority 2 (role not in [ProgramCoordinator]) and priority 4
          (cycle id missing); priority 2 wins with ERR_FORBIDDEN_ROLE (403),
          never ERR_PROGRAM_CYCLE_NOT_FOUND.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /program-cycles/00000000-0000-0000-0000-000000000000/lock", as: Inspector, as_user_id: "insp-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (priority 2) and NOT ERR_PROGRAM_CYCLE_NOT_FOUND (priority 4)"

      - name: ownership_mismatch_beats_invalid_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_OWNERSHIP_MISMATCH]
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: |
          Pair (auth-ownership, state): owner B withdrawing owner A's already
          WITHDRAWN application violates priority 3 (ownership) and priority 5
          (review_status no longer withdrawable); priority 3 wins with
          ERR_OWNERSHIP_MISMATCH (403).
        test_recipe:
          setup:
            - "OPEN cycle; owner A's parcel/defect/notice issued; application created then withdrawn by owner A (WITHDRAWN); owner B exists"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Cat Caper", mailing_address: "79 Caper St" }, as: ProgramCoordinator, captures: { owner_a: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Don Dioon", mailing_address: "80 Dioon St" }, as: ProgramCoordinator, captures: { owner_b: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-V3", owner_id: "${owner_a}", street_address: "79 Caper St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-V3-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 50 }, as: PropertyOwner, as_user_id: "${owner_a}", captures: { app_id: "$.data.id" } }
            - { call: "POST /cost-share-applications/${app_id}/withdraw", as: PropertyOwner, as_user_id: "${owner_a}", captures: { st: "$.data.review_status" } }
          trigger:
            - { call: "POST /cost-share-applications/${app_id}/withdraw", as: PropertyOwner, as_user_id: "${owner_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "st == WITHDRAWN (state precondition would fail too)"
            - "err == ERR_OWNERSHIP_MISMATCH (priority 3) and NOT ERR_INVALID_APPLICATION_STATE (priority 5)"

      - name: stale_version_beats_bid_deadline
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_STALE_BATCH_VERSION]
          - errors[ERR_BID_DEADLINE_PASSED]
          - concurrency_rules[bid-create-stale-batch-version]
        distinguishing_aspect: |
          Pair (OCC state, business_temporal): a bid carrying a stale
          expected_batch_version AND submitted after bid_deadline violates
          priority 6 and priority 9; priority 6 wins with
          ERR_STALE_BATCH_VERSION (412) — the opposite instrument from §1.8's
          temporal_beats_constraint_on_bid, where the version was current.
        test_recipe:
          setup:
            - "DELINQUENT notice swept; batch NB-V4 sealed (version captured at seal); contractor 1 bids successfully (batch version advances); clock then moved past bid_deadline"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Eve Emu", mailing_address: "81 Emu St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-V4", owner_id: "${owner_id}", street_address: "81 Emu St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-V4-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-V4", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor1_id: "$.data.id" } }
            - { call: "POST /contractors", payload: { company_name: "Best Builders", license_number: "L-002", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor2_id: "$.data.id" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-23T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_STALE_BATCH_VERSION (priority 6 OCC) and NOT ERR_BID_DEADLINE_PASSED (priority 9), even though the clock is past bid_deadline"

  # ===========================================================================
  # Section: endpoints (Table 5 claims)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_endpoints_filter_foreign_keys
        claim_type: standard_crud
        grounds:
          - "endpoints.GET /parcels"
          - "endpoints.GET /segments"
          - "endpoints.GET /defects"
          - "endpoints.GET /repair-notices"
          - "endpoints.GET /cost-share-applications"
        distinguishing_aspect: |
          Filtered-list GETs honor their declared query inputs exactly:
          parcels?owner_id returns only that owner's parcels,
          segments?parcel_id only that parcel's segments,
          defects?segment_id&status=UNDER_REPAIR only matching rows, and
          repair-notices?parcel_id&status=ISSUED and
          cost-share-applications?parcel_id each return the single matching row.
        test_recipe:
          setup:
            - "one owner with two parcels; each parcel has one segment, one defect, one issued notice; one application exists on parcel 2's notice"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
            - { call: "POST /property-owners", payload: { full_name: "Fox Ficus", mailing_address: "82 Ficus St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-N1A", owner_id: "${owner_id}", street_address: "82 Ficus St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel1_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-N1B", owner_id: "${owner_id}", street_address: "83 Ficus St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel2_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel1_id}", segment_code: "S-N1A-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg1_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel2_id}", segment_code: "S-N1B-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { seg2_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg1_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { def1_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${seg2_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { def2_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel1_id}", defect_ids: ["${def1_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel2_id}", defect_ids: ["${def2_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice2_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice2_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice2_id}", parcel_id: "${parcel2_id}", cycle_id: "${cycle_id}", estimated_qty_sqft: 50 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { app2_id: "$.data.id" } }
          trigger:
            - { call: "GET /parcels?owner_id=${owner_id}", as: ProgramCoordinator, captures: { parcels_rows: "$.data" } }
            - { call: "GET /segments?parcel_id=${parcel1_id}", as: ProgramCoordinator, captures: { segs_rows: "$.data", segs_first: "$.data[0].id" } }
            - { call: "GET /defects?segment_id=${seg2_id}&status=UNDER_REPAIR", as: ProgramCoordinator, captures: { defs_rows: "$.data", defs_first: "$.data[0].id" } }
            - { call: "GET /repair-notices?parcel_id=${parcel1_id}&status=ISSUED", as: ProgramCoordinator, captures: { nots_rows: "$.data", nots_first: "$.data[0].id" } }
            - { call: "GET /cost-share-applications?parcel_id=${parcel2_id}", as: ProgramCoordinator, captures: { apps_rows: "$.data", apps_first: "$.data[0].id" } }
          assert:
            - "len(parcels_rows) == 2 (both parcels of the owner)"
            - "len(segs_rows) == 1 and segs_first == seg1_id"
            - "len(defs_rows) == 1 and defs_first == def2_id (issued notice moved it to UNDER_REPAIR)"
            - "len(nots_rows) == 1 and nots_first == notice1_id"
            - "len(apps_rows) == 1 and apps_first == app2_id"

      - name: notice_reissue_links_void_prior
        claim_type: cross_reference_link
        grounds:
          - entities.RepairNotice.fields.prior_notice_id
          - "endpoints.GET /repair-notices"
          - state_machines.RepairNotice.UNDER_APPEAL_to_VOID
        distinguishing_aspect: |
          The self-referential prior_notice_id link works end-to-end: after an
          appeal REVERSED voids notice 1, a re-issued notice 2 on the same parcel
          referencing it is accepted, and GET /repair-notices?prior_notice_id=
          returns exactly notice 2.
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice 1 issued, appealed, REVERSED -> VOID (defect back to OPEN)"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Gus Ginkgo", mailing_address: "84 Ginkgo St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-N2", owner_id: "${owner_id}", street_address: "84 Ginkgo St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-N2-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice1_id}/appeal", payload: { grounds: "wrong parcel" }, as: PropertyOwner, as_user_id: "${owner_id}" }
            - { call: "POST /repair-notices/${notice1_id}/appeal-decision", payload: { decision: "REVERSED" }, as: HearingOfficer, as_user_id: "hear-1", captures: { n1_status: "$.data.status" } }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"], prior_notice_id: "${notice1_id}" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice2_id: "$.data.id", n2_prior: "$.data.prior_notice_id", n2_status: "$.data.status" } }
            - { call: "POST /repair-notices/${notice2_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1", captures: { n2_issued: "$.data.status" } }
            - { call: "GET /repair-notices?prior_notice_id=${notice1_id}", as: ProgramCoordinator, captures: { rows: "$.data", row0: "$.data[0].id" } }
          assert:
            - "n1_status == VOID"
            - "n2_status == DRAFT and n2_prior == notice1_id (self-reference stored)"
            - "n2_issued == ISSUED (re-issue of a VOID notice's defects is legal)"
            - "len(rows) == 1 and row0 == notice2_id (reverse lookup by prior_notice_id)"

  # ===========================================================================
  # Section: errors (Table 6 cross-check — every catalogued error triggerable)
  # ===========================================================================
  - section: errors
    instances:
      - name: get_reads_return_not_found_per_resource
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_PROGRAM_CYCLE_NOT_FOUND]
          - errors[ERR_PARCEL_NOT_FOUND]
          - errors[ERR_SEGMENT_NOT_FOUND]
          - errors[ERR_DEFECT_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_BID_BATCH_NOT_FOUND]
          - errors[ERR_WORK_ITEM_NOT_FOUND]
          - errors[ERR_BID_NOT_FOUND]
          - errors[ERR_LIEN_CASE_NOT_FOUND]
        distinguishing_aspect: |
          Every single-resource GET returns its resource-specific 404 error_id
          for a well-formed but non-existent UUID, wrapped in the §1.0 error
          envelope (response_type error, data.error_id set).
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /program-cycles/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_cycle: "$.data.error_id", rtype: "$.response_type" } }
            - { call: "GET /parcels/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_parcel: "$.data.error_id" } }
            - { call: "GET /segments/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_segment: "$.data.error_id" } }
            - { call: "GET /defects/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_defect: "$.data.error_id" } }
            - { call: "GET /cost-share-applications/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_app: "$.data.error_id" } }
            - { call: "GET /bid-batches/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_batch: "$.data.error_id" } }
            - { call: "GET /batch-work-items/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_item: "$.data.error_id" } }
            - { call: "GET /bids/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_bid: "$.data.error_id" } }
            - { call: "GET /lien-cases/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_lien: "$.data.error_id" } }
          assert:
            - "rtype == error (error envelope per §1.0)"
            - "err_cycle == ERR_PROGRAM_CYCLE_NOT_FOUND and err_parcel == ERR_PARCEL_NOT_FOUND and err_segment == ERR_SEGMENT_NOT_FOUND"
            - "err_defect == ERR_DEFECT_NOT_FOUND and err_app == ERR_APPLICATION_NOT_FOUND"
            - "err_batch == ERR_BID_BATCH_NOT_FOUND and err_item == ERR_WORK_ITEM_NOT_FOUND and err_bid == ERR_BID_NOT_FOUND"
            - "err_lien == ERR_LIEN_CASE_NOT_FOUND"

      - name: entity_backed_header_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_PROPERTY_OWNER_NOT_FOUND]
          - errors[ERR_CONTRACTOR_NOT_FOUND]
          - roles[PropertyOwner]
          - roles[Contractor]
        distinguishing_aspect: |
          For entity_backed roles the priority-1 header check resolves X-User-ID
          against the backing entity table: a PropertyOwner header naming a
          non-existent owner id returns ERR_PROPERTY_OWNER_NOT_FOUND and a
          Contractor header naming a non-existent contractor id returns
          ERR_CONTRACTOR_NOT_FOUND — even on a shared read endpoint.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - { call: "GET /parcels", as: PropertyOwner, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err_owner: "$.data.error_id" } }
            - { call: "GET /contractors", as: Contractor, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err_contractor: "$.data.error_id" } }
          assert:
            - "err_owner == ERR_PROPERTY_OWNER_NOT_FOUND (entity-backed header lookup failed)"
            - "err_contractor == ERR_CONTRACTOR_NOT_FOUND (entity-backed header lookup failed)"

      - name: forestry_review_decision_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_FORESTRY_REVIEW_NOT_FOUND]
          - "endpoints.POST /forestry-reviews/{id}/decision"
        distinguishing_aspect: |
          The forestry review has no single-resource GET; its 404 surfaces on the
          action endpoint — deciding a non-existent review id returns
          ERR_FORESTRY_REVIEW_NOT_FOUND (404).
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /forestry-reviews/00000000-0000-0000-0000-000000000000/decision", payload: { decision: "PRUNE_APPROVED" }, as: ForestryOfficer, as_user_id: "for-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORESTRY_REVIEW_NOT_FOUND"

      - name: error_repair_notice_not_found_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REPAIR_NOTICE_NOT_FOUND]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / existence_beats_state_on_work_item_create
          rationale: "Asserted as the winning error (existence over state) when POST /batch-work-items references a non-existent notice id."

      - name: notice_create_defect_fk_and_membership
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_DEFECT_NOT_FOUND]
          - errors[ERR_DEFECT_NOT_IN_PARCEL]
        distinguishing_aspect: |
          Notice creation validates defect_ids left to right: a non-existent
          defect id fails existence (ERR_DEFECT_NOT_FOUND, 404), while an
          existing defect belonging to a DIFFERENT parcel's segment fails
          referential membership (ERR_DEFECT_NOT_IN_PARCEL, 422).
        test_recipe:
          setup:
            - "one owner with two parcels; parcel A has segment+defect; parcel B has none"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Hal Hakea", mailing_address: "85 Hakea St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R1A", owner_id: "${owner_id}", street_address: "85 Hakea St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_a: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R1B", owner_id: "${owner_id}", street_address: "86 Hakea St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_b: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_a}", segment_code: "S-R1A-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_a}", defect_ids: ["00000000-0000-0000-0000-000000000000"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err_nf: "$.data.error_id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_b}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err_mem: "$.data.error_id" } }
          assert:
            - "err_nf == ERR_DEFECT_NOT_FOUND (array element existence, priority 4)"
            - "err_mem == ERR_DEFECT_NOT_IN_PARCEL (defect belongs to parcel A's segment, notice targets parcel B)"

      - name: defect_under_active_notice_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_DEFECT_UNDER_ACTIVE_NOTICE]
          - entities.RepairNotice.fields.defect_ids
        distinguishing_aspect: |
          A defect already covered by a non-terminal notice (DRAFT counts — the
          defect is still OPEN, so the state check passes) cannot be covered by
          a second notice: ERR_DEFECT_UNDER_ACTIVE_NOTICE (422).
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice 1 created over the defect and left DRAFT"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ida Ilama", mailing_address: "87 Ilama St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R2", owner_id: "${owner_id}", street_address: "87 Ilama St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-R2-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id", n1_status: "$.data.status" } }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "n1_status == DRAFT (non-terminal, defect still OPEN)"
            - "err == ERR_DEFECT_UNDER_ACTIVE_NOTICE"

      - name: empty_defect_ids_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_NO_ELIGIBLE_DEFECTS]
          - entities.RepairNotice.fields.defect_ids
        distinguishing_aspect: |
          defect_ids: [] is a well-formed request (priority 0 passes) with no
          eligible elements — the referential rule fails with
          ERR_NO_ELIGIBLE_DEFECTS (422).
        test_recipe:
          setup:
            - "owner/parcel registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Jon Jojoba", mailing_address: "88 Jojoba St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R3", owner_id: "${owner_id}", street_address: "88 Jojoba St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: [] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NO_ELIGIBLE_DEFECTS (empty defect_ids)"

      - name: city_owned_parcel_not_noticable
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_CITY_PARCEL_NOT_NOTICABLE]
          - calculations.owner_responsibility_determination
        distinguishing_aspect: |
          A parcel with owner_responsibility_pct == 0 (is_city_owned) can carry
          segments and defects, but noticing it fails with
          ERR_CITY_PARCEL_NOT_NOTICABLE (422) — the city self-repairs.
        test_recipe:
          setup:
            - "city-owned parcel (responsibility 0) with segment and OPEN defect"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "City of Oaks", mailing_address: "1 Civic Center" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R4", owner_id: "${owner_id}", street_address: "1 Civic Center", street_class: "LOCAL", is_city_owned: true }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id", pct: "$.data.owner_responsibility_pct" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-R4-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "pct == 0 (computed by ordinance)"
            - "err == ERR_CITY_PARCEL_NOT_NOTICABLE"

      - name: notice_create_over_verified_defect_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_DEFECT_STATE]
          - entities.RepairNotice.fields.defect_ids
        distinguishing_aspect: |
          defect_ids elements must be OPEN or AWAITING_FORESTRY at notice
          create/issue: a VERIFIED defect (its earlier notice went COMPLIANT, so
          no active-notice conflict can mask the state check) fails with
          ERR_INVALID_DEFECT_STATE (409).
        test_recipe:
          setup:
            - "owner/parcel/segment/defect; notice 1 issued; PASS inspection by non-recorder -> defect VERIFIED, notice 1 COMPLIANT"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Kim Kapok", mailing_address: "89 Kapok St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R5", owner_id: "${owner_id}", street_address: "89 Kapok St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-R5-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice1_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice1_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /repair-notices/${notice1_id}/inspections", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_DEFECT_STATE (defect is VERIFIED, not in {OPEN, AWAITING_FORESTRY})"

      - name: notice_already_pooled_rejected
        claim_type: violation_to_error
