# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances. All chains replay from empty DB.
# Logical clock default: 2026-05-01T00:00:00Z (no set call needed unless noted).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: claim_amount_provisional_vs_final_remit
        grounds:
          - calculations.claim_provisional_amount
          - state_machines.Claim.SUBMITTED_to_PAID
          - entities.Claim.fields.provisional_gross_cents
          - entities.Claim.fields.remitted_amount_cents
        distinguishing_aspect: |
          Billing-domain dual variant: for identical delivery data the provisional
          rate-card variant yields 1850 cents gross while the final adjudicated
          variant yields 1758 cents remitted (plan liability after the 92-cent
          waiver cost share) — two valid algorithms, two different amounts, on the
          Claim entity (money domain, distinct from the adherence variant below).
        test_recipe:
          setup:
            - "Waiver member (fpl 145 -> 5% cost-share tier), ACTIVE, with ACCEPTED referral and ACTIVE RENAL prescription (10 meals/week)"
            - "Menu cycle 2026-04-13 with Rice Bowl x1 + Broth Soup x1 (2 units), FROZEN"
            - "APPROVED authorization (4 units, 500000 cents cap) covering 2026"
            - "Route drv-1 2026-04-15 DISPATCHED; one delivery DELIVERED"
            - "Claim created (DRAFT) and SUBMITTED"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M One", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-100", allergies: [], income_fpl_percent: 145, household_size: 3 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-items", payload: { name: "Broth Soup", sodium_mg: 100, potassium_mg: 100, phosphorus_mg: 50, carbs_g: 10, protein_g: 10, allergen_codes: [], base_cost_cents: 600 }, as: ProgramAdmin, captures: { i_b: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-04-13" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 1 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_b}", quantity: 1 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-15", weight_kg: 80.5, hba1c_pct: 7.1 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-100" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-1", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v: $.data.version } }
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { c_id: $.data.id, c_gross: $.data.provisional_gross_cents, c_share: $.data.member_cost_share_cents } }
            - { call: "POST /mtm/claims/${c_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
          trigger:
            - { call: "POST /mtm/claims/${c_id}/remit", payload: { outcome: "PAID", remitted_amount_cents: 1758 }, as: PayerReviewer, captures: { c_final: $.data.remitted_amount_cents, c_status: $.data.status } }
          assert:
            - "Claim.${c_id}.provisional_gross_cents == 1850 (provisional variant: 2 units x 925)"
            - "Claim.${c_id}.member_cost_share_cents == 92"
            - "Claim.${c_id}.plan_liability_cents == 1758"
            - "Claim.${c_id}.remitted_amount_cents == 1758 (final variant) and != provisional_gross_cents 1850"
            - "Claim.${c_id}.status == PAID"
            - "Member.${m_id}.oop_accumulator_cents == 92"
            - "Reauthorization.${a_id}.consumed_amount_cents == 1758"

      - name: adherence_delivered_vs_confirmed_variant
        grounds:
          - calculations.adherence_percentage
          - entities.Member.fields.adherence_delivered_pct
          - entities.Member.fields.adherence_confirmed_pct
          - state_machines.Delivery.OUT_FOR_DELIVERY_to_DELIVERED
        distinguishing_aspect: |
          Adherence-domain dual variant (distinct entity domain from the Claim
          money variant): the same five deliveries yield delivered-based
          adherence 80.00 but confirmed-based adherence 75.00, because the
          confirmed variant changes BOTH numerator (confirmed only) and
          denominator (DELIVERED only).
        test_recipe:
          setup:
            - "ACTIVE waiver member (fpl 120 -> 0% tier) with ACCEPTED referral, ACTIVE RENAL prescription, recent outcome assessment"
            - "APPROVED authorization (10 units) obtained while adherence is vacuously 100.00"
            - "One FROZEN cycle (week 2026-04-13); route 2026-04-15 DISPATCHED"
            - "Five deliveries on 2026-04-15: d1..d4 DELIVERED, d5 FAILED; member confirms receipt of d1, d2, d3 only"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Two", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-200", allergies: [], income_fpl_percent: 120, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-04-13" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 5 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-10", weight_kg: 79.0, hba1c_pct: 7.4 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 10, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-200" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-9", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d2: $.data.id } }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d3: $.data.id } }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d4: $.data.id } }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d5: $.data.id } }
            - { call: "POST /mtm/deliveries/${d1}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d2}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d3}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d4}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d5}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d1}/mark-delivered", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d2}/mark-delivered", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d3}/mark-delivered", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d4}/mark-delivered", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d5}/mark-failed", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d1}/confirm-receipt", payload: {}, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /mtm/deliveries/${d2}/confirm-receipt", payload: {}, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /mtm/deliveries/${d3}/confirm-receipt", payload: {}, as: Member, as_user_id: "${m_id}" }
          trigger:
            - { call: "GET /mtm/members/${m_id}/summary", payload: {}, as: Dietitian, captures: { ad: $.data.adherence_delivered_pct, ac: $.data.adherence_confirmed_pct } }
          assert:
            - "Member.${m_id}.adherence_delivered_pct == 80.00 (4 DELIVERED over 4 DELIVERED + 1 FAILED)"
            - "Member.${m_id}.adherence_confirmed_pct == 75.00 (3 confirmed over 4 DELIVERED)"
            - "adherence_delivered_pct != adherence_confirmed_pct for identical delivery data"
            - "MenuCycle.${mc_id}.status == FULFILLED (all 5 deliveries terminal, >= 1 DELIVERED)"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: cost_share_per_line_rounding_order
        grounds:
          - calculations.claim_provisional_amount
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Two 925-cent waiver lines at the 5% tier give 46 + 46 = 92 cents;
          the forbidden sum-then-round order gives round(1850 x 0.05) = 93.
        test_recipe:
          setup:
            - "Waiver member fpl 145 (5% tier), ACTIVE, referral ACCEPTED, RENAL prescription ACTIVE"
            - "Cycle with Rice Bowl x1 + Broth Soup x1 FROZEN; authorization APPROVED; one delivery DELIVERED"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Three", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-300", allergies: [], income_fpl_percent: 145, household_size: 4 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.4"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-items", payload: { name: "Broth Soup", sodium_mg: 100, potassium_mg: 100, phosphorus_mg: 50, carbs_g: 10, protein_g: 10, allergen_codes: [], base_cost_cents: 600 }, as: ProgramAdmin, captures: { i_b: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-04-13" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 1 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_b}", quantity: 1 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-15", weight_kg: 70.0, hba1c_pct: 6.9 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-300" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-2", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v: $.data.version } }
          trigger:
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { c_share: $.data.member_cost_share_cents, c_gross: $.data.provisional_gross_cents, c_plan: $.data.plan_liability_cents } }
          assert:
            - "Claim.member_cost_share_cents == 92 (46 + 46 per-line round_half_up of 46.25)"
            - "Claim.member_cost_share_cents != 93 (forbidden sum-then-round of 92.5)"
            - "Claim.provisional_gross_cents == 1850"
            - "Claim.plan_liability_cents == 1758"
            - "Claim.units_delivered == 2"

      - name: nutrition_multi_nutrient_gating
        grounds:
          - calculations.nutrition_compliance_check
        distinguishing_aspect: |
          Mode (a) combinatorial gate formula: five weekly nutrient totals
          (3+ inputs) interact non-linearly through per-nutrient min/max gates
          whose very set is selected by a conditional branch on
          prescription.diet_type; under RENAL the cycle passes the sodium and
          phosphorus ceilings but fails BOTH the potassium ceiling (14500 >
          14000) and the protein floor (105 < 420), and the violation list must
          report exactly those two gates.
        test_recipe:
          setup:
            - "ACTIVE waiver member with ACCEPTED referral and ACTIVE RENAL prescription (sodium 2000, potassium 2000, phosphorus 1000, protein 60 per day)"
            - "Cycle with Lentil Stew x5 + Banana x1: weekly totals sodium 7600, potassium 14500, phosphorus 3550, protein 105"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Four", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-400", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Lentil Stew", sodium_mg: 1500, potassium_mg: 2500, phosphorus_mg: 700, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 800 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-items", payload: { name: "Banana", sodium_mg: 100, potassium_mg: 2000, phosphorus_mg: 50, carbs_g: 10, protein_g: 5, allergen_codes: [], base_cost_cents: 200 }, as: ProgramAdmin, captures: { i_b: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-05-04" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 5 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_b}", quantity: 1 }, as: Dietitian }
          trigger:
            - { call: "GET /mtm/menu-cycles/${mc_id}/compliance", payload: {}, as: Dietitian, captures: { k_total: $.data.potassium_mg_total, compliant: $.data.nutrition_compliant } }
          assert:
            - "compliance.sodium_mg_total == 7600 (passes 14000 weekly limit)"
            - "compliance.potassium_mg_total == 14500 (exceeds 14000 weekly limit)"
            - "compliance.phosphorus_mg_total == 3550 (passes 7000)"
            - "compliance.protein_g_total == 105 (fails the 420 weekly floor: 105 < 420, so PROTEIN is also violated)"
            - "compliance.nutrition_compliant == false"
            - "compliance.nutrient_violations == [POTASSIUM, PROTEIN] (sorted)"
            - "compliance.allergen_ok == true and allergen_violations == []"
            - "MenuCycle.${mc_id}.meals_count == 6"

  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: menu_cycle_freeze_unfreeze_revision_cycle
        grounds:
          - state_machines.MenuCycle.PLANNED_to_FROZEN
