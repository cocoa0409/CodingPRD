      - name: forced_pricing_fires_when_clock_passes_deadline
        claim_type: Valid Transition
        grounds: [state_machines.OriginationContract.pricing_status.UNPRICED_to_PRICED, calculations.dp_storage_accrual]
        distinguishing_aspect: "The clock sweep force-prices a DEFERRED contract once pricing_deadline < clock: the forced election uses the DEADLINE-date as-of quote (1100), accrual runs through the deadline only (9 days x 100 bu x 1 cent = 900), and pricing_status lands PRICED without any client election."
        test_recipe:
          setup:
            - "DEFERRED contract 100 bu, rate 1 cent/bu/day, deadline 2026-09-10T00:00:00Z, futures 2026-12; BEAN 2026-12 quote 1100 as-of 2026-09-01."
            - "One clean 100-bu ticket applied at 2026-09-01 (unpriced pool 100, accrual anchored 09-01)."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 100, futures_month: "2026-12", pricing_deadline: "2026-09-10T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { k_ctr_f_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_f_id}", gross_bushels: 100, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_f2: $.data.id }
            - call: "POST /api/delivery-tickets/${k_tkt_f2}/apply"
              payload: {}
              as: OriginationMerchandiser
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/origination-contracts/${k_ctr_f_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "OriginationContract.${k_ctr_f_id}.pricing_status == PRICED and priced_bushels == 100"
            - "the elections array's last entry has origin FORCED, unit_price_cents == 1100, elected_at == 2026-09-10T00:00:00Z (the deadline, not the sweep time)"
            - "accrued_storage_cents == 900 (9 calendar days 09-01 -> 09-10 x 100 bu x 1 cent)"
            - "priced_value_cents == 110000"

      - name: pricing_election_at_exact_deadline_allowed
        claim_type: Precondition Enforcement
        grounds: [state_machines.OriginationContract.pricing_status, "validations[priority=7]"]
        distinguishing_aspect: "Deadline boundary: with the clock exactly AT pricing_deadline the sweep has not fired (deadline < clock is false) and a client election still succeeds; one second past the deadline the contract would be force-priced instead."
        test_recipe:
          setup: ["DEFERRED contract 100 bu, deadline 2026-09-10T00:00:00Z, futures 2026-12 quoted 1100; clock advanced to exactly the deadline."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 100, futures_month: "2026-12", pricing_deadline: "2026-09-10T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
              captures: { k_ctr_d_id: $.data.id, k_ctr_d_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/origination-contracts/${k_ctr_d_id}/pricing-elections"
              payload: { bushels: 100, expected_contract_version: "${k_ctr_d_v}" }
              as: OriginationMerchandiser
          assert:
            - "the election succeeds 200 — clock == deadline is still client-pricable (sweep requires deadline < clock)"
            - "pricing_status == PRICED with the election origin CLIENT (not forced)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: certified_ticket_carries_program_premium
        claim_type: Constants Applied
        grounds: [calculations.quality_grade_factors, entities.DeliveryTicket.fields.premium_cents_per_bushel, entities.SustainabilityProgram.fields.premium_cents_per_bushel]
        distinguishing_aspect: "A ticket on a program-enrolled contract earns premium_cents_per_bushel == 25 from the program while a conventional contract earns 0; the created storage lot inherits program_id, preserving the certified stream."
        test_recipe:
          setup: ["REGEN program premium 25; certified CASH contract 3000 bu; conventional CASH contract 100 bu; one clean 3000-bu ticket on the certified contract."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - *k_prog
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", program_id: "${k_prog_id}", contract_type: "CASH", quantity_bushels: 3000, cash_price_cents_per_bushel: 1000 }
              as: OriginationMerchandiser
              captures: { k_ctr_cert: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_cert}", gross_bushels: 3000, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_cert: $.data.id }
          trigger:
            - call: "POST /api/delivery-tickets/${k_tkt_cert}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "GET /api/storage-positions"
              payload: { elevator_id: "${k_elev_id}", program_id: "${k_prog_id}" }
              as: OriginationMerchandiser
              captures: { k_pos_cert: "$.data[0].id" }
            - call: "GET /api/elevators/${k_elev_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "DeliveryTicket.${k_tkt_cert}.premium_cents_per_bushel == 25 (from the program) and discount_cents_per_bushel == 0"
            - "StoragePosition.${k_pos_cert}.program_id == ${k_prog_id} with current_bushels == 3000 (chain of custody into storage)"
            - "Elevator.${k_elev_id}.certified_stored_bushels == 3000 and stored_bushels == 3000"

      - name: dp_accrual_day_count_exact
        claim_type: Correct Result
        grounds: [calculations.dp_storage_accrual, entities.OriginationContract.fields.accrued_storage_cents]
        distinguishing_aspect: "Chronological accumulator: 500 unpriced delivered bushels at 3 cents/bu/day accrue from 2026-09-01 to the 2026-09-06 election — exactly 5 calendar days -> 7500 cents, then the meter stops."
        test_recipe:
          setup: ["DEFERRED contract 500 bu, rate 3, deadline 2026-12-15, futures 2026-12 quoted 1100; clean 500-bu ticket applied at clock 2026-09-01."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_farm
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-12", price_cents: 1100, quote_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/origination-contracts"
              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 500, futures_month: "2026-12", pricing_deadline: "2026-12-15T00:00:00Z", storage_rate_cents_per_bushel_day: 3 }
              as: OriginationMerchandiser
              captures: { k_ctr_a_id: $.data.id }
            - call: "POST /api/delivery-tickets"
              payload: { contract_id: "${k_ctr_a_id}", gross_bushels: 500, moisture_pct: 13.0, damage_pct: 0, foreign_material_pct: 0 }
              as: OriginationMerchandiser
              captures: { k_tkt_a: $.data.id }
            - call: "POST /api/delivery-tickets/${k_tkt_a}/apply"
              payload: {}
              as: OriginationMerchandiser
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/origination-contracts/${k_ctr_a_id}"
              payload: {}
              as: OriginationMerchandiser
              captures: { k_ctr_a_v: $.data.version }
          trigger:
            - call: "POST /api/origination-contracts/${k_ctr_a_id}/pricing-elections"
              payload: { bushels: 500, expected_contract_version: "${k_ctr_a_v}" }
              as: OriginationMerchandiser
            - call: "GET /api/origination-contracts/${k_ctr_a_id}"
              payload: {}
              as: OriginationMerchandiser
          assert:
            - "OriginationContract.${k_ctr_a_id}.accrued_storage_cents == 7500 (3 x 500 x 5 days)"
            - "pricing_status == PRICED, unpriced_pool_bushels == 0, last_accrual_date is null (meter stopped)"
            - "priced_value_cents == 550000 (500 x 1100)"

      - name: hedge_locks_spread_and_margin_with_constants
        claim_type: Constants Applied
        grounds: [calculations.board_crush_spread, entities.BoardCrushPosition.fields.locked_spread_cents_per_bushel]
        distinguishing_aspect: "Entry locks spread = oil x 11 + meal x 47 - bean = 55x11 + 17x47 - 1200 = 204.00 cents/bu, and locked margin = 204.00 x 2 lots x 5000 bu = 2040000 cents — the OIL/MEAL yield and 5000-bu contract constants are load-bearing."
        test_recipe:
          setup: ["Quotes 2026-11: BEAN 1200, OIL 55, MEAL 17 as-of 2026-09-01."]
          setup_api_calls:
            - *k_clock
            - *k_qb
            - *k_qo
            - *k_qm
          trigger:
            - call: "POST /api/board-crush-positions"
              payload: { futures_month: "2026-11", bean_lots_long: 2, oil_lots_short: 2, meal_lots_short: 2, expiry_date: "2026-11-13T00:00:00Z" }
              as: CrushTrader
              as_user_id: "trader-77"
              captures: { k_pos_c: $.data.id }
          assert:
            - "BoardCrushPosition.${k_pos_c}.locked_spread_cents_per_bushel == 204.0"
            - "BoardCrushPosition.${k_pos_c}.locked_margin_cents == 2040000"
            - "status == ENTERED and entered_by_user_id == \"trader-77\""

      - name: hedge_offset_realizes_pnl_from_spread_move
        claim_type: Correct Result
        grounds: [calculations.board_crush_spread, entities.BoardCrushPosition.fields.realized_pnl_cents]
        distinguishing_aspect: "After confirmation by a different user, a bean rally 1200 -> 1150 lifts the spread 204 -> 254; offset realizes (254 - 204) x 2 x 5000 = 500000 cents."
        test_recipe:
          setup: ["Position ENTERED at spread 204.00 (quotes 1200/55/17); confirmed by RiskManager rm-1; BEAN 2026-11 requoted 1150 as-of 2026-09-05; clock at 2026-09-05."]
          setup_api_calls:
            - *k_clock
            - *k_qb
            - *k_qo
            - *k_qm
            - call: "POST /api/board-crush-positions"
              payload: { futures_month: "2026-11", bean_lots_long: 2, oil_lots_short: 2, meal_lots_short: 2, expiry_date: "2026-11-13T00:00:00Z" }
              as: CrushTrader
              as_user_id: "trader-77"
              captures: { k_pos_o: $.data.id }
            - call: "POST /api/board-crush-positions/${k_pos_o}/confirm"
              payload: {}
              as: RiskManager
              as_user_id: "rm-1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotes"
              payload: { commodity: "BEAN", quote_month: "2026-11", price_cents: 1150, quote_date: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/board-crush-positions/${k_pos_o}/offset"
              payload: {}
              as: CrushTrader
              as_user_id: "trader-77"
          assert:
            - "BoardCrushPosition.${k_pos_o}.status == OFFSET"
            - "realized_pnl_cents == 500000 ((254.0 - 204.0) x 2 x 5000)"
            - "confirmed_by_user_id == \"rm-1\" differs from entered_by_user_id == \"trader-77\""

      - name: routing_quote_ranks_by_freight_transit_created
        claim_type: Correct Result
        grounds: [calculations.destination_ranking, endpoints.POST_/api/shipment-routing-quotes]
        distinguishing_aspect: "Selector determinism: freight ASC, then transit_days ASC, then lane.created_at ASC; a cheaper lane to a MAINTENANCE plant is excluded from the candidate set entirely. Expected order: transit-1 lanes by creation order, then the transit-3 lane."
        test_recipe:
          setup: ["Elevator; plants A (ACTIVE), B (ACTIVE), M (MAINTENANCE). Lanes: L1 freight 20 transit 3 to A; L2 freight 20 transit 1 to A; L3 freight 20 transit 1 to B (created after L2); L4 freight 1 transit 1 to M."]
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_pub
            - *k_elev
            - *k_plant
            - call: "POST /api/crush-plants"
              payload: { name: "Quincy", daily_crush_capacity_bushels: 40000, daily_refinery_capacity_lbs: 800000, biodiesel_feedstock_share_pct: 10 }
              as: PlatformAdmin
              captures: { k_plant_b: $.data.id }
            - call: "POST /api/crush-plants"
              payload: { name: "Mothballed", daily_crush_capacity_bushels: 40000, daily_refinery_capacity_lbs: 800000, biodiesel_feedstock_share_pct: 10, status: "MAINTENANCE" }
              as: PlatformAdmin
              captures: { k_plant_m: $.data.id }
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${k_elev_id}", destination_plant_id: "${k_plant_id}", mode: "TRUCK", freight_cents_per_bushel: 20, transit_days: 3, daily_capacity_bushels: 5000 }
              as: LogisticsCoordinator
              captures: { k_lane1: $.data.id }
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${k_elev_id}", destination_plant_id: "${k_plant_id}", mode: "RAIL", freight_cents_per_bushel: 20, transit_days: 1, daily_capacity_bushels: 5000 }
              as: LogisticsCoordinator
              captures: { k_lane2: $.data.id }
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${k_elev_id}", destination_plant_id: "${k_plant_b}", mode: "BARGE", freight_cents_per_bushel: 20, transit_days: 1, daily_capacity_bushels: 5000 }
              as: LogisticsCoordinator
              captures: { k_lane3: $.data.id }
            - call: "POST /api/freight-lanes"
              payload: { origin_elevator_id: "${k_elev_id}", destination_plant_id: "${k_plant_m}", mode: "TRUCK", freight_cents_per_bushel: 1, transit_days: 1, daily_capacity_bushels: 5000 }
              as: LogisticsCoordinator
              captures: { k_lane4: $.data.id }
          trigger:
            - call: "POST /api/shipment-routing-quotes"
              payload: { origin_elevator_id: "${k_elev_id}", bushels: 100 }
              as: LogisticsCoordinator
          assert:
            - "ranked result order is [${k_lane2}, ${k_lane3}, ${k_lane1}] — freight ties at 20 break on transit_days 1 before 3, and the remaining tie breaks on created_at ASC"
            - "lane ${k_lane4} (freight 1, cheapest) is ABSENT — its destination plant is MAINTENANCE and leaves the candidate set"
            - "response_type array with total_count == 3"

      - name: routing_quote_empty_pool_rejected
        claim_type: Violation → Error
        grounds: [calculations.destination_ranking, errors.ERR_NO_ROUTE_AVAILABLE]
        distinguishing_aspect: "An origin elevator with no lanes yields the empty candidate set -> 422 ERR_NO_ROUTE_AVAILABLE (the pinned empty-pool fallback)."
        test_recipe:
