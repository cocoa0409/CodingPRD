            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T18:00:00Z" }
              as: ProgramAdmin
            - call: "POST /decon-orders/${do_id}/dry-verification"
              payload: { outcome: "RETREAT", notes: "third attempt still damp" }
              as: ReleaseVerifier
              as_user_id: "${insp_c}"
              captures: { do_v_r3: $.data.version }
          trigger:
            - call: "POST /decon-orders/${do_id}/treatment"
              payload: { water_temp_f: 140, pressure_psi: 3000, dwell_seconds: 120 }
              as: DeconTechnician
              as_user_id: "${insp_b}"
              captures: { err: $.data.error_id }
          assert:
            - "each of the three treatments returned status TREATED with required_dry_hours 18, and the three dry_until values were 2026-08-06T03:02:00Z, 2026-08-06T22:02:00Z and 2026-08-07T17:02:00Z"
            - "after the third RETREAT DeconOrder.${do_id}.status == RETREAT_REQUIRED and attempt_count == 3"
            - "the trigger returns 409 with error_id ERR_DECON_ATTEMPTS_EXHAUSTED"
            - "DeconOrder.${do_id}.attempt_count is still 3 and version == ${do_v_r3}"
            - "InspectionRecord.${rec_id}.inspection_status is still DECON_REQUIRED with decon_fee_cents 900 and total_fee_cents 3400 - each treatment overwrote the same decon component instead of accumulating"
            - "InspectionStation.${st_id}.collected_fees_cents == 3400"

      - name: violation_to_error_campaign_launch_without_candidate_stations_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_35
          - errors.ERR_NO_STATIONS_FOR_CAMPAIGN
          - calculations.campaign_station_allocation_cents
        distinguishing_aspect: "The candidate filter excludes CLOSED stations, so a campaign whose target water body is guarded only by a CLOSED station has an empty candidate set and the launch is refused 422 ERR_NO_STATIONS_FOR_CAMPAIGN - a station at a different water body does not rescue it."
        test_recipe:
          setup:
            - "Target water body A guarded by exactly one station, taken PLANNED -> OPEN -> CLOSED."
            - "A second, OPEN station guards an unrelated water body B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_a: $.data.id }
            - call: "POST /water-bodies"
              payload: { name: "Nilan Reservoir", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "LOW" }
              as: ProgramAdmin
              captures: { wb_b: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_a}" }
              as: ProgramAdmin
              captures: { st_a: $.data.id }
            - call: "POST /inspection-stations/${st_a}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_a}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_a}/status"
              payload: { target_status: "CLOSED", reason: "access washed out" }
              as: ProgramAdmin
            - call: "POST /inspection-stations"
              payload: { name: "Nilan Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_b}" }
              as: ProgramAdmin
              captures: { st_b: $.data.id }
            - call: "POST /education-campaigns"
              payload: { name: "Clean Drain Dry 2026", target_water_body_id: "${wb_a}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-31T00:00:00Z", budget_cents: 100000, evaluation_method: "PRE_POST" }
              as: ProgramAdmin
              captures: { cp_id: $.data.id, cp_v: $.data.version }
          trigger:
            - call: "POST /education-campaigns/${cp_id}/status"
              payload: { target_status: "RUNNING" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 422 with error_id ERR_NO_STATIONS_FOR_CAMPAIGN"
            - "EducationCampaign.${cp_id}.status == PLANNED, station_allocations == [] and version == ${cp_v}"
            - "InspectionStation.${st_a}.campaign_allocated_cents == 0 and InspectionStation.${st_b}.campaign_allocated_cents == 0"
            - "control: a second campaign targeting ${wb_b}, whose station is merely PLANNED, launches with 200 and allocates its whole budget to ${st_b}, proving PLANNED qualifies while CLOSED does not"

      - name: violation_to_error_campaign_budget_too_small_for_every_station_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_38
          - errors.ERR_CAMPAIGN_BUDGET_EXCEEDED
        distinguishing_aspect: "ERR_CAMPAIGN_BUDGET_EXCEEDED covers both ends of the budget rule: 1 cent spread over two qualifying stations cannot give each a non-zero allocation, so the launch is refused 422 - the same error a budget above CAMPAIGN_BUDGET_CAP_CENTS draws at creation."
        test_recipe:
          setup:
            - "Two OPEN stations guard the target water body; no inspection records exist, so both weights are 1."
            - "Campaign X created with budget_cents 1 and campaign Y with budget_cents 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
