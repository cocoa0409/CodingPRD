    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?", "category_id?", "discontinued?"]
    output: SKU[]
    side_effects: []
  - method: GET
    path: "/nabs/skus/{id}"
    description: "Fetch one SKU"
    roles: [PlatformAdmin, ShopStaff, Member, Anonymous]
    code: 200
    input: []
    output: SKU
    side_effects: []
  - method: PATCH
    path: "/nabs/skus/{id}"
    description: "Update SKU (e.g., discontinue)"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: ["title?", "base_price_cents?", "discontinued?", "ship_state_overrides?"]
    output: SKU
    side_effects: ["Re-run age_neutral_classification if abv or overrides changed"]
  - method: GET
    path: "/nabs/skus/{id}/flight-items"
    description: "Reverse-reachability: flight items that pour this SKU"
    roles: [PlatformAdmin, ShopStaff]
    code: 200
    input: ["limit?", "offset?"]
