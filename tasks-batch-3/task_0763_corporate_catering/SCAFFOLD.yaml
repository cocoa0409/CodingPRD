# =============================================================================
# Corporate Catering & Cafeteria Management — seed tables (Expert)
# =============================================================================

scenario: |
  Corporate Catering & Cafeteria Management (Aramark/Sodexo style): client site &
  meal-period/headcount, cycle menu & production forecast, POS/badge-pay & subsidy,
  inventory & food-cost/waste, special-event & catering order, dietary/allergen &
  labeling, vendor & invoice, satisfaction

domain_name: corporate-catering
api_prefix: /api

complexity_profile:
  primary_archetype: ledger_reconciliation      # theoretical (recipe) vs actual (FIFO inventory) food cost
  secondary_archetype: pricing_engine           # POS badge-pay subsidy tiers + catering volume pricing
  complexity_layers:
    - dual_variant_calculation                  # theoretical-vs-actual food cost; catering estimate-vs-final
    - cascading_side_effects                    # session close -> site rollup -> catering gating
    - derived_field_reconciliation              # inventory value, food_cost_pct, satisfaction_avg
    - optimistic_concurrency                    # catering confirm reserves shared site inventory pool

  entity_topology: flat                         # peer entities linked by foreign keys; no nested URL paths
  state_machine_shape: cyclic                   # catering revision loop; invoice dispute loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                               # SatisfactionSurvey references a session OR a catering order

  role_model: segregation_of_duties             # catering coordinator cannot approve own order
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: client_name, type: string, source: input, description: "Corporate client company name" }
      - { name: currency, type: enum, source: input, default: "USD", description: "USD | EUR | GBP" }
      - { name: employer_subsidy_pct, type: number, source: input, description: "Fraction (0..1) of subsidizable subtotal the employer covers per POS transaction", constraints: "0 <= x <= 1" }
      - { name: daily_subsidy_cap_cents, type: integer, source: input, description: "Max employer subsidy per employee per calendar (logical-clock) day, in cents" }
      - { name: food_cost_target_pct, type: number, source: input, description: "Target period food-cost ratio (0..1); cost_status flips OVER_TARGET when exceeded", constraints: "0 <= x <= 1" }
      - { name: session_changeover_buffer_minutes, type: integer, source: input, default: 30, description: "Minimum gap required between two ServiceSessions on the same date at this site" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — gates catering confirmation" }
      - { name: cost_status, type: enum, source: computed, default: "ON_TARGET", description: "ON_TARGET | OVER_TARGET — derived from food_cost_pct vs food_cost_target_pct" }
      - { name: period_food_cost_cents, type: integer, source: computed, default: 0, description: "Sum of CLOSED session actual food cost + WasteEvent cost + FULFILLED catering final cost" }
      - { name: period_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of CLOSED session revenue + INVOICED catering total charge" }
      - { name: food_cost_pct, type: number, source: computed, description: "period_food_cost_cents / period_revenue_cents; null when period_revenue_cents == 0" }
      - { name: inventory_value_cents, type: integer, source: computed, default: 0, description: "Sum over AVAILABLE InventoryLots at this site of qty_on_hand * unit_cost_cents" }
      - { name: satisfaction_avg, type: number, source: computed, description: "Mean rating over this site's SatisfactionSurveys, 2dp; null when none" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id; the site this employee dines at" }
      - { name: badge_id, type: string, source: input, description: "Badge/payroll identifier; unique within a client_site" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: restricted_allergens, type: array, source: input, default: [], description: "Allergen enums the employee must not be served: PEANUTS|TREE_NUTS|DAIRY|GLUTEN|SOY|SHELLFISH|EGGS" }
      - { name: wallet_balance_cents, type: integer, source: input, default: 0, description: "Prepaid wallet balance in cents; debited on WALLET transactions" }
      - { name: daily_subsidy_used_cents, type: integer, source: computed, default: 0, description: "Employer subsidy consumed on subsidy_day so far; resets when a transaction occurs on a new day" }
      - { name: subsidy_day, type: string, source: system, description: "Logical-clock date (YYYY-MM-DD) that daily_subsidy_used_cents currently accounts for" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | TERMINATED — TERMINATED cannot transact" }

  - name: MenuCycle
    parent: null
    common_fields: true
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: name, type: string, source: input, description: "Cycle name, e.g. 'Spring 4-Week'" }
      - { name: cycle_length_weeks, type: integer, source: input, description: "Rotation length in weeks", constraints: "x >= 1" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED — sessions require a PUBLISHED cycle to open" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: menu_cycle_id, type: string, source: input, description: "FK -> MenuCycle.id" }
      - { name: name, type: string, source: input, description: "Item name" }
      - { name: category, type: enum, source: input, description: "ENTREE | SIDE | BEVERAGE | DESSERT | HEALTHY" }
      - { name: price_cents, type: integer, source: input, description: "POS/catering menu price in cents", constraints: "x >= 0" }
      - { name: standard_recipe_cost_cents, type: integer, source: input, description: "Theoretical (recipe) ingredient cost per portion, in cents", constraints: "x >= 0" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen enums present in the item: PEANUTS|TREE_NUTS|DAIRY|GLUTEN|SOY|SHELLFISH|EGGS" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE — item sellable (single active state; retained for label lifecycle)" }

  - name: CateringVenue
    parent: null
    common_fields: true
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: name, type: string, source: input, description: "Room / space name" }
      - { name: capacity, type: integer, source: input, description: "Max headcount the venue seats", constraints: "x >= 1" }

  - name: ServiceSession
    parent: null
    common_fields: true
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: menu_cycle_id, type: string, source: input, description: "FK -> MenuCycle.id; menu served this session" }
      - { name: service_date, type: string, source: input, description: "Service calendar date (YYYY-MM-DD)" }
      - { name: meal_period, type: enum, source: input, description: "BREAKFAST | LUNCH | DINNER" }
      - { name: window_start, type: datetime, source: input, description: "Service window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Service window end (ISO 8601 UTC); must be after window_start" }
      - { name: forecast_headcount, type: integer, source: input, description: "Forecast diner count; locked at FORECAST_LOCKED", constraints: "x >= 0" }
      - { name: actual_headcount, type: integer, source: computed, default: 0, description: "Count of COMPLETED BadgeTransactions on this session" }
      - { name: revenue_cents, type: integer, source: computed, default: 0, description: "Sum of subtotal_cents over COMPLETED BadgeTransactions on this session" }
      - { name: actual_food_cost_cents, type: integer, source: computed, description: "FIFO value of inventory consumed at CLOSE (see actual_food_cost calc); null before close" }
      - { name: theoretical_food_cost_cents, type: integer, source: computed, default: 0, description: "Sum over COMPLETED transaction lines of standard_recipe_cost_cents * qty (recipe-based)" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | FORECAST_LOCKED | IN_SERVICE | CLOSED | CANCELLED" }

  - name: BadgeTransaction
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the transacting diner" }
      - { name: service_session_id, type: string, source: input, description: "FK -> ServiceSession.id; must be IN_SERVICE" }
      - { name: lines, type: array, source: input, description: "Array of { menu_item_id, qty }; qty >= 1" }
      - { name: payment_method, type: enum, source: input, description: "BADGE_PAYROLL | WALLET" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over lines of menu_item.price_cents * qty" }
      - { name: subsidy_applied_cents, type: integer, source: computed, description: "Employer subsidy applied (see badge_subsidy calc)" }
      - { name: employee_charge_cents, type: integer, source: computed, description: "subtotal_cents - subsidy_applied_cents" }
      - { name: status, type: enum, source: system, default: "COMPLETED", description: "COMPLETED | VOIDED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: category, type: enum, source: input, description: "PRODUCE | PROTEIN | DRY_GOODS | BEVERAGE | DISPOSABLES" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (single state; retained for lifecycle labeling)" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id; destination site for received stock" }
      - { name: lines, type: array, source: input, description: "Array of { ingredient, qty, unit_cost_cents }; ingredient is a free string, qty >= 1, unit_cost_cents >= 0" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over lines of qty * unit_cost_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | RECEIVED | CANCELLED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id; owning site" }
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the PO receipt that created this lot" }
      - { name: ingredient, type: string, source: system, description: "Ingredient key, copied from the PO line" }
      - { name: qty_received, type: integer, source: system, description: "Units received into this lot" }
      - { name: qty_on_hand, type: integer, source: computed, description: "Physical units remaining (qty_received minus consumption/waste)" }
      - { name: qty_reserved, type: integer, source: computed, default: 0, description: "Units reserved by CONFIRMED catering orders not yet fulfilled" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Per-unit cost, copied from the PO line" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock receipt time; FIFO consumption orders by this ascending" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | DEPLETED (qty_on_hand reached 0)" }

  - name: WasteEvent
    parent: null
    common_fields: false
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: inventory_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; the lot the waste is drawn from" }
      - { name: qty, type: integer, source: input, description: "Units wasted", constraints: "x >= 1" }
      - { name: reason, type: enum, source: input, description: "SPOILAGE | OVERPRODUCTION | PREP_ERROR | EXPIRY" }
      - { name: cost_cents, type: integer, source: computed, description: "qty * inventory_lot.unit_cost_cents" }

  - name: CateringOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> CateringVenue.id; must belong to the same client_site" }
      - { name: coordinator_id, type: string, source: system, description: "X-User-ID of the CateringCoordinator who created the order (opaque); used for segregation-of-duties" }
      - { name: event_date, type: string, source: input, description: "Event date (YYYY-MM-DD)" }
      - { name: event_start, type: datetime, source: input, description: "Event start (ISO 8601 UTC)" }
      - { name: event_end, type: datetime, source: input, description: "Event end (ISO 8601 UTC); must be after event_start" }
      - { name: headcount, type: integer, source: input, description: "Expected attendee count; drives volume discount tier", constraints: "x >= 1" }
      - { name: lines, type: array, source: input, description: "Array of { menu_item_id, qty }; qty >= 1" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Forward-looking recipe estimate (see catering_estimated_cost calc)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "FIFO actual inventory consumed at FULFILL; null before fulfillment" }
      - { name: order_charge_cents, type: integer, source: computed, description: "Client charge before service fee (per-line rounded, then summed)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "round_half_up(order_charge_cents * SERVICE_FEE_PCT)" }
      - { name: total_charge_cents, type: integer, source: computed, description: "order_charge_cents + service_fee_cents" }
      - { name: requires_finance_review, type: boolean, source: computed, default: false, description: "Stamped true by a session-close cascade when the site's cost_status flips OVER_TARGET while this order is SUBMITTED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REVISION_REQUESTED | CONFIRMED | FULFILLED | INVOICED | CANCELLED" }

  - name: VendorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: purchase_order_id, type: string, source: input, description: "FK -> PurchaseOrder.id; the PO being invoiced (must be RECEIVED to MATCH)" }
      - { name: invoiced_amount_cents, type: integer, source: input, description: "Amount the vendor billed, in cents", constraints: "x >= 0" }
      - { name: matched_variance_cents, type: integer, source: computed, description: "invoiced_amount_cents - purchase_order.total_cents (signed); set at MATCH" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | MATCHED | APPROVED | DISPUTED | PAID" }

  - name: SatisfactionSurvey
    parent: null
    common_fields: false
    fields:
      - { name: client_site_id, type: string, source: input, description: "FK -> ClientSite.id" }
      - { name: service_session_id, type: string, source: input, description: "FK -> ServiceSession.id; set when the survey targets a cafeteria session (else null)" }
      - { name: catering_order_id, type: string, source: input, description: "FK -> CateringOrder.id; set when the survey targets a catering event (else null)" }
      - { name: rating, type: integer, source: input, description: "1..5 star rating", constraints: "1 <= x <= 5" }
      - { name: comment, type: string, source: input, default: "", description: "Optional free-text comment" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ClientSite
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/client-sites/{id}/suspend"
        actor: SiteAdmin
        preconditions: []
        side_effects: ["Catering CONFIRM is blocked while SUSPENDED (cross-entity gate)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/client-sites/{id}/reactivate"
        actor: SiteAdmin
        preconditions: []
        side_effects: []

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/employees/{id}/terminate"
        actor: SiteAdmin
        preconditions: []
        side_effects: ["Future BadgeTransaction creation for this employee is rejected (ERR_EMPLOYEE_INACTIVE)"]

  - entity: MenuCycle
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/menu-cycles/{id}/publish"
        actor: CafeteriaManager
        preconditions: ["at least one MenuItem exists for this cycle (ERR_EMPTY_MENU_CYCLE)"]
        side_effects: ["Sessions referencing this cycle may now be opened to IN_SERVICE"]

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/purchase-orders/{id}/issue"
        actor: CafeteriaManager
        preconditions: ["PO has at least one line"]
        side_effects: []
      - from: ISSUED
        to: RECEIVED
        trigger: "POST /api/purchase-orders/{id}/receive"
        actor: CafeteriaManager
        preconditions: []
        side_effects:
          - "CASCADE hop 1: for each PO line, create an InventoryLot (qty_on_hand=qty, unit_cost_cents=line cost, received_at=logical clock, status=AVAILABLE)"
          - "CASCADE hop 2: ClientSite.inventory_value_cents recomputed to include the new lots"
          - "increments ClientSite.version by 1 (inventory pool changed)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/purchase-orders/{id}/cancel"
        actor: CafeteriaManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /api/purchase-orders/{id}/cancel"
        actor: CafeteriaManager
        preconditions: []
        side_effects: []

  - entity: ServiceSession
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: FORECAST_LOCKED
        trigger: "POST /api/service-sessions/{id}/lock-forecast"
        actor: CafeteriaManager
        preconditions: ["forecast_headcount is set"]
        side_effects: ["forecast_headcount becomes immutable"]
      - from: FORECAST_LOCKED
        to: IN_SERVICE
        trigger: "POST /api/service-sessions/{id}/open"
        actor: CafeteriaManager
        preconditions:
          - "referenced MenuCycle.status == PUBLISHED (ERR_MENU_CYCLE_NOT_PUBLISHED) — cross-entity"
        side_effects: ["BadgeTransactions may now be created against this session"]
      - from: IN_SERVICE
        to: CLOSED
        trigger: "POST /api/service-sessions/{id}/close"
        actor: CafeteriaManager
        preconditions:
          - "expected consumed_ingredients fit AVAILABLE inventory across FIFO lots (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "compute actual_food_cost_cents by FIFO-consuming InventoryLots for each consumed_ingredients line (received_at ASC, created_at ASC tie-break)"
          - "CASCADE hop 1: consumed InventoryLots decrement qty_on_hand; lots hitting 0 -> status DEPLETED"
          - "CASCADE hop 2: ClientSite.period_food_cost_cents += actual_food_cost_cents; period_revenue_cents += revenue_cents; inventory_value_cents recomputed; food_cost_pct recomputed"
          - "CASCADE hop 3: if food_cost_pct > food_cost_target_pct then ClientSite.cost_status -> OVER_TARGET, and every UNDER-consideration CateringOrder at this site in status SUBMITTED is stamped requires_finance_review=true (see note)"
          - "increments ClientSite.version by 1 (inventory pool changed)"
        note: "revenue_cents and theoretical_food_cost_cents are maintained incrementally on each COMPLETED/VOIDED BadgeTransaction; close only finalizes actual cost and rolls up to the site."
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/service-sessions/{id}/cancel"
        actor: CafeteriaManager
        preconditions: []
        side_effects: []
      - from: FORECAST_LOCKED
        to: CANCELLED
        trigger: "POST /api/service-sessions/{id}/cancel"
        actor: CafeteriaManager
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: CANCELLED
        trigger: "POST /api/service-sessions/{id}/cancel"
        actor: CafeteriaManager
        preconditions: ["no COMPLETED BadgeTransactions exist on this session (ERR_SESSION_HAS_SALES)"]
        side_effects: []

  - entity: BadgeTransaction
    initial_state: COMPLETED
    terminal_states: [VOIDED]
    transitions:
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /api/badge-transactions/{id}/void"
        actor: CafeteriaManager
        preconditions: ["parent ServiceSession.status == IN_SERVICE (ERR_SESSION_NOT_OPEN)"]
        side_effects:
          - "COMPENSATION: Employee.wallet_balance_cents += employee_charge_cents if payment_method==WALLET"
          - "COMPENSATION: Employee.daily_subsidy_used_cents -= subsidy_applied_cents (floored at 0)"
          - "ServiceSession.revenue_cents -= subtotal_cents; theoretical_food_cost_cents -= line recipe cost; actual_headcount -= 1"

  - entity: CateringOrder
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/catering-orders/{id}/submit"
        actor: CateringCoordinator
        preconditions:
          - "lines is non-empty"
          - "headcount <= venue.capacity (ERR_VENUE_CAPACITY_EXCEEDED)"
          - "no other non-terminal CateringOrder on venue_id overlaps [event_start,event_end) (ERR_VENUE_TIME_CONFLICT) — temporal"
        side_effects: ["estimated_cost_cents, order_charge_cents, service_fee_cents, total_charge_cents computed"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/catering-orders/{id}/review  (body decision=APPROVE)"
        actor: CateringApprover
        preconditions:
          - "acting X-User-ID != coordinator_id (ERR_SEGREGATION_OF_DUTIES) — referential"
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /api/catering-orders/{id}/review  (body decision=REQUEST_REVISION)"
        actor: CateringApprover
        preconditions: ["acting X-User-ID != coordinator_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /api/catering-orders/{id}/revise"
        actor: CateringCoordinator
        preconditions: []
        side_effects: ["lines/headcount editable again; recompute pricing on next submit"]
        note: "cycle: REVISION_REQUESTED -> DRAFT -> SUBMITTED re-enters review"
      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /api/catering-orders/{id}/confirm"
        actor: FinanceController
        preconditions:
          - "ClientSite.status == ACTIVE (ERR_SITE_SUSPENDED) — cross-entity"
          - "expected_client_site_version matches ClientSite.version (ERR_STALE_SITE_VERSION, 412) — OCC on shared inventory pool"
          - "for each reserved_ingredients line, sum(qty_on_hand - qty_reserved) over AVAILABLE lots of that ingredient >= qty (ERR_INSUFFICIENT_INVENTORY) — fiscal"
        side_effects:
          - "reserve inventory: for each reserved_ingredients line, increment InventoryLot.qty_reserved in FIFO order (received_at ASC, created_at ASC); record the per-lot reservation against this order"
          - "increments ClientSite.version by 1 (inventory pool availability changed)"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /api/catering-orders/{id}/fulfill"
        actor: CafeteriaManager
        preconditions: ["consumed_ingredients fit reserved+available inventory (ERR_INSUFFICIENT_INVENTORY)"]
        side_effects:
          - "release this order's reservations (qty_reserved -= reserved)"
          - "compute final_cost_cents by FIFO-consuming InventoryLots (received_at ASC, created_at ASC); consumed lots decrement qty_on_hand; lots hitting 0 -> DEPLETED"
          - "ClientSite.period_food_cost_cents += final_cost_cents; inventory_value_cents recomputed"
          - "increments ClientSite.version by 1 (inventory pool changed)"
      - from: FULFILLED
        to: INVOICED
        trigger: "POST /api/catering-orders/{id}/invoice"
        actor: FinanceController
        preconditions: []
        side_effects: ["ClientSite.period_revenue_cents += total_charge_cents; food_cost_pct and cost_status recomputed"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/catering-orders/{id}/cancel"
        actor: CateringCoordinator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/catering-orders/{id}/cancel"
        actor: CateringCoordinator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/catering-orders/{id}/cancel"
        actor: FinanceController
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/catering-orders/{id}/cancel"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "COMPENSATION: release reservations (InventoryLot.qty_reserved -= reserved for this order)"
          - "increments ClientSite.version by 1 (inventory pool changed)"

  - entity: VendorInvoice
    initial_state: RECEIVED
    terminal_states: [PAID]
    transitions:
      - from: RECEIVED
        to: MATCHED
        trigger: "POST /api/vendor-invoices/{id}/match"
        actor: FinanceController
        preconditions:
          - "referenced PurchaseOrder.status == RECEIVED (ERR_PO_NOT_RECEIVED) — cross-entity"
        side_effects: ["matched_variance_cents = invoiced_amount_cents - purchase_order.total_cents"]
      - from: MATCHED
        to: APPROVED
        trigger: "POST /api/vendor-invoices/{id}/resolve  (body resolution=APPROVE)"
        actor: FinanceController
        preconditions: ["abs(matched_variance_cents) <= MATCH_TOLERANCE_CENTS (ERR_VARIANCE_TOO_LARGE)"]
        side_effects: []
      - from: MATCHED
        to: DISPUTED
        trigger: "POST /api/vendor-invoices/{id}/resolve  (body resolution=DISPUTE)"
        actor: FinanceController
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: RECEIVED
        trigger: "POST /api/vendor-invoices/{id}/resubmit"
        actor: FinanceController
        preconditions: []
        side_effects: ["invoiced_amount_cents replaced with corrected value; matched_variance_cents cleared"]
        note: "cycle: MATCHED -> DISPUTED -> RECEIVED -> MATCHED"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/vendor-invoices/{id}/pay"
        actor: FinanceController
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: catering-confirm-stale-site
    parent_entity: ClientSite
    write_endpoint: "POST /api/catering-orders/{id}/confirm"
    occ_field: "expected_client_site_version"
    description: |
      Confirming a CateringOrder reserves stock from the client site's shared
      inventory pool. Confirmation is rejected when the caller's expected_client_site_version
      no longer equals ClientSite.version — i.e. the caller's view of the pool is
      stale because another inventory-mutating write (a PO receipt, a session close,
      or another catering confirmation that legitimately drew down the same pool)
      has advanced the site version since the caller last observed it.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: badge_subsidy
    trigger: "POST /api/badge-transactions (transaction creation)"
    algorithm: threshold
    formula: |
      subtotal_cents      = sum over lines of ( menu_item.price_cents * qty )
      subsidizable_cents  = sum over lines where menu_item.category in SUBSIDIZED_CATEGORIES of ( price_cents * qty )
      gross_subsidy_cents = round_half_up( subsidizable_cents * site.employer_subsidy_pct )
      # daily reset: if employee.subsidy_day != clock_date then treat daily_subsidy_used_cents as 0 first
      remaining_cap_cents = max( 0, site.daily_subsidy_cap_cents - employee.daily_subsidy_used_cents )
      subsidy_applied_cents = min( gross_subsidy_cents, remaining_cap_cents )
      employee_charge_cents = subtotal_cents - subsidy_applied_cents
    input_set: "the transaction's own lines; employee.daily_subsidy_used_cents for the current logical-clock day only"
    constants:
      SUBSIDIZED_CATEGORIES: [ENTREE, HEALTHY]
    precision: "cents integers; gross_subsidy rounded half-up to whole cents"
    variants: []

  - name: theoretical_food_cost
    trigger: "maintained incrementally on each COMPLETED / VOIDED BadgeTransaction; read at session close"
    algorithm: aggregation
    formula: |
      theoretical_food_cost_cents =
        sum over COMPLETED BadgeTransaction lines on the session of
          ( menu_item.standard_recipe_cost_cents * qty )
    input_set: "only COMPLETED transactions on the session (VOIDED excluded)"
    precision: "cents integers, exact"
    variants:
      - name: theoretical
        when: "recipe-based expectation of what the sold portions should have cost"
        difference: "uses MenuItem.standard_recipe_cost_cents, independent of which physical lots were drawn"

  - name: actual_food_cost
    trigger: "POST /api/service-sessions/{id}/close"
    algorithm: chronological
    formula: |
      For each consumed_ingredients line { ingredient, qty }:
        need = qty
        for lot in AVAILABLE InventoryLots of (ingredient, site) ordered by received_at ASC, created_at ASC:
            take = min( need, lot.qty_on_hand )
            actual_food_cost_cents += take * lot.unit_cost_cents
            lot.qty_on_hand -= take
            if lot.qty_on_hand == 0: lot.status = DEPLETED
            need -= take
            if need == 0: break
        if need > 0: reject ERR_INSUFFICIENT_INVENTORY (no partial consumption persisted)
    input_set: "AVAILABLE InventoryLots for the site+ingredient; FIFO by received_at then created_at"
    precision: "cents integers, exact; FIFO order is authoritative (order-sensitive)"
    variants:
      - name: actual
        when: "true cost of the physical inventory FIFO-consumed for the session"
        difference: "diverges from theoretical whenever lot unit_cost_cents differs from standard_recipe_cost_cents"

  - name: catering_estimated_cost
    trigger: "POST /api/catering-orders/{id}/submit"
    algorithm: forward_looking
    formula: |
      estimated_cost_cents =
        round_half_up( ( sum over lines of standard_recipe_cost_cents * qty ) * EVENT_OVERHEAD_FACTOR )
    input_set: "the order's lines at submit time; recipe costs only"
    constants:
      EVENT_OVERHEAD_FACTOR: 1.20
    precision: "cents integer, round half-up"
    variants:
      - name: estimate
        when: "computed at SUBMIT as a forward-looking projection"
        difference: "recipe cost scaled by overhead factor; ignores actual lot costs"

  - name: catering_final_cost
    trigger: "POST /api/catering-orders/{id}/fulfill"
    algorithm: chronological
    formula: |
      final_cost_cents = FIFO valuation of consumed_ingredients against InventoryLots
        (received_at ASC, created_at ASC), identical arithmetic to actual_food_cost.
    input_set: "AVAILABLE InventoryLots for the site+ingredient at fulfill time"
    precision: "cents integers, exact"
    variants:
      - name: final
        when: "computed at FULFILL from physically consumed inventory"
        difference: "replaces the estimate; equals real FIFO lot cost, not overhead-scaled recipe cost"

  - name: catering_client_charge
    trigger: "POST /api/catering-orders/{id}/submit"
    algorithm: tiered_pricing
    formula: |
      volume_discount_pct =
        0.15 if headcount >= 100
        else 0.10 if headcount >= 50
        else 0.05 if headcount >= 20
        else 0.00
      # ROUNDING ORDER PINNED: round each line, THEN sum (not sum-then-round)
      for each line:
        line_charge_cents = round_half_up( menu_item.price_cents * qty * (1 - volume_discount_pct) )
      order_charge_cents  = sum( line_charge_cents )
      service_fee_cents   = round_half_up( order_charge_cents * SERVICE_FEE_PCT )
      total_charge_cents  = order_charge_cents + service_fee_cents
    input_set: "the order's lines and headcount"
    constants:
      SERVICE_FEE_PCT: 0.18
    precision: "round_half_up per line to whole cents, then sum; service fee rounded half-up on the summed order_charge"
    variants: []

  - name: invoice_three_way_match
    trigger: "POST /api/vendor-invoices/{id}/match"
    algorithm: threshold
    formula: |
      matched_variance_cents = invoiced_amount_cents - purchase_order.total_cents
      eligible_to_approve = abs(matched_variance_cents) <= MATCH_TOLERANCE_CENTS
    input_set: "the invoice and its referenced RECEIVED PurchaseOrder"
    constants:
      MATCH_TOLERANCE_CENTS: 500
    precision: "cents integers, exact"
    variants: []

  - name: site_food_cost_rollup
    trigger: "session close / catering fulfill / catering invoice / waste creation"
    algorithm: aggregation
    formula: |
      period_food_cost_cents = sum(actual_food_cost_cents over CLOSED sessions)
                             + sum(cost_cents over WasteEvents)
                             + sum(final_cost_cents over FULFILLED/INVOICED catering orders)
      period_revenue_cents   = sum(revenue_cents over CLOSED sessions)
                             + sum(total_charge_cents over INVOICED catering orders)
      food_cost_pct = ( period_food_cost_cents / period_revenue_cents ) if period_revenue_cents > 0 else null
      cost_status   = OVER_TARGET if (food_cost_pct is not null and food_cost_pct > food_cost_target_pct) else ON_TARGET
    input_set: "CLOSED sessions, all WasteEvents, FULFILLED+INVOICED catering orders for the site"
    precision: "food_cost_pct as a ratio, 4 decimal places round_half_up; division-by-zero guarded (revenue 0 -> null, cost_status ON_TARGET)"
    variants: []

  - name: waste_cost
    trigger: "POST /api/waste-events"
    algorithm: aggregation
    formula: |
      cost_cents = qty * inventory_lot.unit_cost_cents
      # side effect: inventory_lot.qty_on_hand -= qty; if 0 -> DEPLETED
    input_set: "the single referenced InventoryLot"
    precision: "cents integer, exact"
    variants: []

  - name: satisfaction_avg
    trigger: "POST /api/satisfaction-surveys"
    algorithm: aggregation
    formula: |
      satisfaction_avg = round_half_up( mean(rating over site's SatisfactionSurveys), 2 )
                         (null when the site has zero surveys)
    input_set: "all SatisfactionSurveys whose client_site_id == site.id"
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "required body fields present, enums valid, numeric ranges satisfied (e.g. rating 1..5, qty>=1, pct in 0..1)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "path ids and referenced FKs resolve to existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "no line's MenuItem.allergens intersects the Employee.restricted_allergens (POS) — dietary/allergen safety"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /api/badge-transactions"

  - priority: 7
    category: business_referential
    check: "employee not TERMINATED (POS); catering approver X-User-ID != order.coordinator_id (segregation of duties)"
    error_id: "ERR_EMPLOYEE_INACTIVE / ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /api/badge-transactions ; POST /api/catering-orders/{id}/review"

  - priority: 8
    category: business_temporal
    check: "catering event window must not overlap another non-terminal order on the same venue [start,end); two same-date sessions at a site need >= changeover buffer"
    error_id: "ERR_VENUE_TIME_CONFLICT / ERR_SESSION_BUFFER_CONFLICT"
    http_status: 409
    applies_to: "POST /api/catering-orders/{id}/submit ; POST /api/service-sessions"

  - priority: 9
    category: business_constraint
    check: "uniqueness & capacity: one session per (site, date, meal_period); catering headcount <= venue.capacity; unique badge_id per site"
    error_id: "ERR_DUPLICATE_SESSION_SLOT / ERR_VENUE_CAPACITY_EXCEEDED / ERR_DUPLICATE_BADGE"
    http_status: 409
    applies_to: "POST /api/service-sessions ; POST /api/catering-orders/{id}/submit ; POST /api/employees"

  - priority: 10
    category: business_fiscal
    check: "sufficient inventory for close/confirm/fulfill; sufficient wallet for WALLET POS; invoice variance within tolerance to approve"
    error_id: "ERR_INSUFFICIENT_INVENTORY / ERR_WALLET_INSUFFICIENT / ERR_VARIANCE_TOO_LARGE"
    http_status: 409
    applies_to: "POS create; session close; catering confirm/fulfill; invoice resolve"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_client_site_version equals ClientSite.version on catering confirm"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /api/catering-orders/{id}/confirm"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [SiteAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; drives received_at, subsidy_day, overlap windows"]

  # ---- ClientSite ----
  - method: POST
    path: "/api/client-sites"
    description: "Create a client site (subsidy + food-cost config set here)."
    roles: [SiteAdmin]
    code: 201
    input: [name, client_name, "currency?", employer_subsidy_pct, daily_subsidy_cap_cents, food_cost_target_pct, "session_changeover_buffer_minutes?"]
    output: ClientSite
    side_effects: ["status=ACTIVE, cost_status=ON_TARGET, counters 0, version=1"]
  - method: GET
    path: "/api/client-sites/{id}"
    description: "Get a client site (includes version, cost_status, computed rollups)."
    roles: [SiteAdmin, CafeteriaManager, CateringCoordinator, CateringApprover, FinanceController, Diner]
    code: 200
    input: []
    output: ClientSite
    side_effects: []
  - method: GET
    path: "/api/client-sites"
    description: "List client sites (paginated)."
    roles: [SiteAdmin, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: ClientSite[]
    side_effects: []
  - method: POST
    path: "/api/client-sites/{id}/suspend"
    description: "Suspend a site (blocks catering confirmation)."
    roles: [SiteAdmin]
    code: 200
    input: []
    output: ClientSite
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/api/client-sites/{id}/reactivate"
    description: "Reactivate a suspended site."
    roles: [SiteAdmin]
    code: 200
    input: []
    output: ClientSite
    side_effects: ["status -> ACTIVE"]

  # ---- Employee ----
  - method: POST
    path: "/api/employees"
    description: "Register an employee/diner at a site."
    roles: [SiteAdmin]
    code: 201
    input: [client_site_id, badge_id, full_name, "restricted_allergens?", "wallet_balance_cents?"]
    output: Employee
    side_effects: ["status=ACTIVE, daily_subsidy_used_cents=0"]
  - method: GET
    path: "/api/employees/{id}"
    description: "Get an employee."
    roles: [SiteAdmin, CafeteriaManager, Diner]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/api/employees"
    description: "List employees, filterable by site (FK reverse-reachability for client_site_id)."
    roles: [SiteAdmin, CafeteriaManager]
    code: 200
    input: ["client_site_id?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: POST
    path: "/api/employees/{id}/terminate"
    description: "Terminate an employee (blocks further POS)."
    roles: [SiteAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: ["status -> TERMINATED"]

  # ---- MenuCycle ----
  - method: POST
    path: "/api/menu-cycles"
    description: "Create a cycle menu (DRAFT)."
    roles: [CafeteriaManager]
    code: 201
    input: [client_site_id, name, cycle_length_weeks]
    output: MenuCycle
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/api/menu-cycles/{id}"
    description: "Get a menu cycle."
    roles: [CafeteriaManager, CateringCoordinator, Diner]
    code: 200
    input: []
    output: MenuCycle
    side_effects: []
  - method: GET
    path: "/api/menu-cycles"
    description: "List menu cycles, filterable by site (FK reverse-reachability for client_site_id)."
    roles: [CafeteriaManager, CateringCoordinator]
    code: 200
    input: ["client_site_id?", "limit?", "offset?"]
    output: MenuCycle[]
    side_effects: []
  - method: POST
    path: "/api/menu-cycles/{id}/publish"
    description: "Publish a cycle (requires >=1 item)."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["status -> PUBLISHED"]

  # ---- MenuItem ----
  - method: POST
    path: "/api/menu-items"
    description: "Add a menu item (with price, recipe cost, allergens) to a cycle."
    roles: [CafeteriaManager]
    code: 201
    input: [menu_cycle_id, name, category, price_cents, standard_recipe_cost_cents, "allergens?"]
    output: MenuItem
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/menu-items/{id}"
    description: "Get a menu item (allergen/label data)."
    roles: [CafeteriaManager, CateringCoordinator, Diner]
    code: 200
    input: []
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/api/menu-items"
    description: "List menu items, filterable by cycle (FK reverse-reachability for menu_cycle_id)."
    roles: [CafeteriaManager, CateringCoordinator, Diner]
    code: 200
    input: ["menu_cycle_id?", "limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  # ---- CateringVenue ----
  - method: POST
    path: "/api/catering-venues"
    description: "Create a catering venue/room for a site."
    roles: [SiteAdmin]
    code: 201
    input: [client_site_id, name, capacity]
    output: CateringVenue
    side_effects: []
  - method: GET
    path: "/api/catering-venues/{id}"
    description: "Get a venue."
    roles: [SiteAdmin, CateringCoordinator, CateringApprover, FinanceController]
    code: 200
    input: []
    output: CateringVenue
    side_effects: []
  - method: GET
    path: "/api/catering-venues"
    description: "List venues, filterable by site (FK reverse-reachability for client_site_id)."
    roles: [SiteAdmin, CateringCoordinator]
    code: 200
    input: ["client_site_id?", "limit?", "offset?"]
    output: CateringVenue[]
    side_effects: []

  # ---- ServiceSession ----
  - method: POST
    path: "/api/service-sessions"
    description: "Plan a meal-period service session (unique per site+date+meal_period; changeover buffer enforced)."
    roles: [CafeteriaManager]
    code: 201
    input: [client_site_id, menu_cycle_id, service_date, meal_period, window_start, window_end, forecast_headcount]
    output: ServiceSession
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/api/service-sessions/{id}"
    description: "Get a session (headcount + food-cost fields)."
    roles: [CafeteriaManager, FinanceController, Diner]
    code: 200
    input: []
    output: ServiceSession
    side_effects: []
  - method: GET
    path: "/api/service-sessions"
    description: "List sessions, filterable by site or cycle (FK reverse-reachability for client_site_id and menu_cycle_id)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: ["client_site_id?", "menu_cycle_id?", "service_date?", "limit?", "offset?"]
    output: ServiceSession[]
    side_effects: []
  - method: POST
    path: "/api/service-sessions/{id}/lock-forecast"
    description: "Lock the production forecast headcount."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: ServiceSession
    side_effects: ["status -> FORECAST_LOCKED"]
  - method: POST
    path: "/api/service-sessions/{id}/open"
    description: "Open service (requires PUBLISHED menu cycle)."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: ServiceSession
    side_effects: ["status -> IN_SERVICE"]
  - method: POST
    path: "/api/service-sessions/{id}/close"
    description: "Close service; FIFO-consume inventory for consumed_ingredients, finalize actual food cost, roll up to site."
    roles: [CafeteriaManager]
    code: 200
    input: [consumed_ingredients]
    output: ServiceSession
    side_effects:
      - "actual_food_cost_cents computed (FIFO)"
      - "InventoryLots decremented; DEPLETED where 0; ClientSite rollup + cost_status cascade"
      - "increments ClientSite.version by 1"
  - method: POST
    path: "/api/service-sessions/{id}/cancel"
    description: "Cancel a session (no COMPLETED sales)."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: ServiceSession
    side_effects: ["status -> CANCELLED"]

  # ---- BadgeTransaction (POS) ----
  - method: POST
    path: "/api/badge-transactions"
    description: "POS/badge-pay purchase against an IN_SERVICE session; computes subsidy and charge."
    roles: [Diner]
    code: 201
    input: [employee_id, service_session_id, lines, payment_method]
    output: BadgeTransaction
    side_effects:
      - "subtotal/subsidy/charge computed; wallet debited if WALLET; daily_subsidy_used_cents += subsidy_applied"
      - "session revenue_cents/theoretical_food_cost_cents/actual_headcount updated"
  - method: GET
    path: "/api/badge-transactions/{id}"
    description: "Get a POS transaction."
    roles: [Diner, CafeteriaManager, FinanceController]
    code: 200
    input: []
    output: BadgeTransaction
    side_effects: []
  - method: GET
    path: "/api/badge-transactions"
    description: "List POS transactions, filterable by employee or session (FK reverse-reachability for employee_id and service_session_id)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: ["employee_id?", "service_session_id?", "limit?", "offset?"]
    output: BadgeTransaction[]
    side_effects: []
  - method: POST
    path: "/api/badge-transactions/{id}/void"
    description: "Void a POS transaction (compensating reversal of wallet + subsidy + session totals)."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: BadgeTransaction
    side_effects: ["status -> VOIDED; wallet/subsidy/session totals reversed"]

  # ---- Vendor ----
  - method: POST
    path: "/api/vendors"
    description: "Create a vendor."
    roles: [SiteAdmin]
    code: 201
    input: [name, category]
    output: Vendor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/vendors/{id}"
    description: "Get a vendor."
    roles: [SiteAdmin, CafeteriaManager, FinanceController]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/api/vendors"
    description: "List vendors (paginated)."
    roles: [SiteAdmin, CafeteriaManager, FinanceController]
    code: 200
    input: ["limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  # ---- PurchaseOrder ----
  - method: POST
    path: "/api/purchase-orders"
    description: "Create a purchase order (DRAFT) with ingredient lines."
    roles: [CafeteriaManager]
    code: 201
    input: [vendor_id, client_site_id, lines]
    output: PurchaseOrder
    side_effects: ["status=DRAFT; total_cents computed"]
  - method: GET
    path: "/api/purchase-orders/{id}"
    description: "Get a purchase order."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []
  - method: GET
    path: "/api/purchase-orders"
    description: "List POs, filterable by vendor or site (FK reverse-reachability for vendor_id and client_site_id)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: ["vendor_id?", "client_site_id?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []
  - method: POST
    path: "/api/purchase-orders/{id}/issue"
    description: "Issue a PO to the vendor."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status -> ISSUED"]
  - method: POST
    path: "/api/purchase-orders/{id}/receive"
    description: "Receive a PO; creates InventoryLots and raises site inventory value (cascade)."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status -> RECEIVED; InventoryLots created; ClientSite.inventory_value_cents recomputed; ClientSite.version +1"]
  - method: POST
    path: "/api/purchase-orders/{id}/cancel"
    description: "Cancel a DRAFT/ISSUED PO."
    roles: [CafeteriaManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["status -> CANCELLED"]

  # ---- InventoryLot ----
  - method: GET
    path: "/api/inventory-lots/{id}"
    description: "Get an inventory lot (qty_on_hand, qty_reserved, unit cost, status)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/api/inventory-lots"
    description: "List inventory lots, filterable by site, PO, or ingredient (FK reverse-reachability for client_site_id and purchase_order_id)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: ["client_site_id?", "purchase_order_id?", "ingredient?", "status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  # ---- WasteEvent ----
  - method: POST
    path: "/api/waste-events"
    description: "Log food waste against a lot; values it at the lot cost and depletes the lot."
    roles: [CafeteriaManager]
    code: 201
    input: [client_site_id, inventory_lot_id, qty, reason]
    output: WasteEvent
    side_effects: ["cost_cents computed; lot.qty_on_hand -= qty (DEPLETED if 0); site period_food_cost_cents += cost_cents; food_cost_pct recomputed"]
  - method: GET
    path: "/api/waste-events/{id}"
    description: "Get a waste event."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: []
    output: WasteEvent
    side_effects: []
  - method: GET
    path: "/api/waste-events"
    description: "List waste events, filterable by site or lot (FK reverse-reachability for client_site_id and inventory_lot_id)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: ["client_site_id?", "inventory_lot_id?", "limit?", "offset?"]
    output: WasteEvent[]
    side_effects: []

  # ---- CateringOrder ----
  - method: POST
    path: "/api/catering-orders"
    description: "Create a special-event catering order (DRAFT). coordinator_id captured from X-User-ID."
    roles: [CateringCoordinator]
    code: 201
    input: [client_site_id, venue_id, event_date, event_start, event_end, headcount, lines]
    output: CateringOrder
    side_effects: ["status=DRAFT; coordinator_id set from X-User-ID"]
  - method: GET
    path: "/api/catering-orders/{id}"
    description: "Get a catering order (estimate, charge, final cost)."
    roles: [CateringCoordinator, CateringApprover, FinanceController, CafeteriaManager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: []
  - method: GET
    path: "/api/catering-orders"
    description: "List catering orders, filterable by site or venue (FK reverse-reachability for client_site_id and venue_id)."
    roles: [CateringCoordinator, CateringApprover, FinanceController, CafeteriaManager]
    code: 200
    input: ["client_site_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: CateringOrder[]
    side_effects: []
  - method: POST
    path: "/api/catering-orders/{id}/submit"
    description: "Submit for review; computes estimate + client charge; enforces venue capacity & time overlap."
    roles: [CateringCoordinator]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> SUBMITTED; pricing computed"]
  - method: POST
    path: "/api/catering-orders/{id}/review"
    description: "Approver decision on a SUBMITTED order (segregation of duties enforced)."
    roles: [CateringApprover]
    code: 200
    input: [decision]
    output: CateringOrder
    side_effects: ["status -> APPROVED (decision=APPROVE) or REVISION_REQUESTED (decision=REQUEST_REVISION)"]
  - method: POST
    path: "/api/catering-orders/{id}/revise"
    description: "Coordinator pulls a REVISION_REQUESTED order back to DRAFT (cycle)."
    roles: [CateringCoordinator]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/api/catering-orders/{id}/confirm"
    description: "Finance confirms an APPROVED order; reserves inventory for reserved_ingredients (OCC on ClientSite.version)."
    roles: [FinanceController]
    code: 200
    input: [expected_client_site_version, reserved_ingredients]
    output: CateringOrder
    side_effects: ["status -> CONFIRMED; InventoryLot.qty_reserved += reserved_ingredients (FIFO); increments ClientSite.version by 1"]
  - method: POST
    path: "/api/catering-orders/{id}/fulfill"
    description: "Fulfill a CONFIRMED order; FIFO-consume inventory, finalize final_cost_cents."
    roles: [CafeteriaManager]
    code: 200
    input: [consumed_ingredients]
    output: CateringOrder
    side_effects: ["status -> FULFILLED; reservations released; lots consumed; final_cost_cents set; ClientSite.version +1"]
  - method: POST
    path: "/api/catering-orders/{id}/invoice"
    description: "Finance invoices a FULFILLED order; recognizes revenue to the site."
    roles: [FinanceController]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> INVOICED; ClientSite.period_revenue_cents += total_charge_cents; cost_status recomputed"]
  - method: POST
    path: "/api/catering-orders/{id}/cancel"
    description: "Cancel a catering order; releases reservations if CONFIRMED."
    roles: [CateringCoordinator, FinanceController]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status -> CANCELLED; reservations released if was CONFIRMED; ClientSite.version +1 if reservations released"]

  # ---- VendorInvoice ----
  - method: POST
    path: "/api/vendor-invoices"
    description: "Record a vendor invoice against a PO (RECEIVED status)."
    roles: [FinanceController]
    code: 201
    input: [vendor_id, purchase_order_id, invoiced_amount_cents]
    output: VendorInvoice
    side_effects: ["status=RECEIVED"]
  - method: GET
    path: "/api/vendor-invoices/{id}"
    description: "Get a vendor invoice."
    roles: [FinanceController, CafeteriaManager]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: []
  - method: GET
    path: "/api/vendor-invoices"
    description: "List invoices, filterable by vendor or PO (FK reverse-reachability for vendor_id and purchase_order_id)."
    roles: [FinanceController, CafeteriaManager]
    code: 200
    input: ["vendor_id?", "purchase_order_id?", "status?", "limit?", "offset?"]
    output: VendorInvoice[]
    side_effects: []
  - method: POST
    path: "/api/vendor-invoices/{id}/match"
    description: "Three-way match against the RECEIVED PO; computes variance."
    roles: [FinanceController]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["status -> MATCHED; matched_variance_cents set"]
  - method: POST
    path: "/api/vendor-invoices/{id}/resolve"
    description: "Approve (within tolerance) or dispute a MATCHED invoice."
    roles: [FinanceController]
    code: 200
    input: [resolution]
    output: VendorInvoice
    side_effects: ["status -> APPROVED (resolution=APPROVE, needs |variance|<=tolerance) or DISPUTED (resolution=DISPUTE)"]
  - method: POST
    path: "/api/vendor-invoices/{id}/resubmit"
    description: "Resubmit a DISPUTED invoice with a corrected amount (cycle back to RECEIVED)."
    roles: [FinanceController]
    code: 200
    input: [invoiced_amount_cents]
    output: VendorInvoice
    side_effects: ["status -> RECEIVED; invoiced_amount_cents replaced; matched_variance_cents cleared"]
  - method: POST
    path: "/api/vendor-invoices/{id}/pay"
    description: "Pay an APPROVED invoice."
    roles: [FinanceController]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["status -> PAID"]

  # ---- SatisfactionSurvey ----
  - method: POST
    path: "/api/satisfaction-surveys"
    description: "Submit a satisfaction rating for a session or catering event; updates site satisfaction_avg."
    roles: [Diner]
    code: 201
    input: [client_site_id, "service_session_id?", "catering_order_id?", rating, "comment?"]
    output: SatisfactionSurvey
    side_effects: ["ClientSite.satisfaction_avg recomputed"]
  - method: GET
    path: "/api/satisfaction-surveys/{id}"
    description: "Get a survey."
    roles: [Diner, CafeteriaManager, FinanceController]
    code: 200
    input: []
    output: SatisfactionSurvey
    side_effects: []
  - method: GET
    path: "/api/satisfaction-surveys"
    description: "List surveys, filterable by site, session, or catering order (FK reverse-reachability for client_site_id, service_session_id, catering_order_id)."
    roles: [CafeteriaManager, FinanceController]
    code: 200
    input: ["client_site_id?", "service_session_id?", "catering_order_id?", "limit?", "offset?"]
    output: SatisfactionSurvey[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid body field, bad enum, out-of-range number" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the transition" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "A line's MenuItem allergen intersects Employee.restricted_allergens" }
  - { id: ERR_EMPLOYEE_INACTIVE, http: 409, condition: "TERMINATED employee attempted a POS transaction" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Catering approver X-User-ID equals order.coordinator_id" }
  - { id: ERR_VENUE_TIME_CONFLICT, http: 409, condition: "Catering event window overlaps another non-terminal order on the same venue [start,end)" }
  - { id: ERR_SESSION_BUFFER_CONFLICT, http: 409, condition: "Two same-date sessions at a site violate the changeover buffer gap" }
  - { id: ERR_DUPLICATE_SESSION_SLOT, http: 409, condition: "A session already exists for (site, date, meal_period)" }
  - { id: ERR_DUPLICATE_BADGE, http: 409, condition: "badge_id already used at this site" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 409, condition: "Catering headcount exceeds venue.capacity" }
  - { id: ERR_MENU_CYCLE_NOT_PUBLISHED, http: 409, condition: "Opening a session whose MenuCycle is not PUBLISHED" }
  - { id: ERR_EMPTY_MENU_CYCLE, http: 409, condition: "Publishing a cycle with no menu items" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Not enough AVAILABLE/un-reserved inventory to close/confirm/fulfill" }
  - { id: ERR_WALLET_INSUFFICIENT, http: 409, condition: "WALLET payment exceeds employee wallet_balance_cents" }
  - { id: ERR_VARIANCE_TOO_LARGE, http: 409, condition: "Approving an invoice whose |matched_variance_cents| exceeds MATCH_TOLERANCE_CENTS" }
  - { id: ERR_PO_NOT_RECEIVED, http: 409, condition: "Matching an invoice whose PurchaseOrder is not RECEIVED" }
  - { id: ERR_SITE_SUSPENDED, http: 409, condition: "Confirming catering while ClientSite is SUSPENDED" }
  - { id: ERR_SESSION_HAS_SALES, http: 409, condition: "Cancelling an IN_SERVICE session that has COMPLETED transactions" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Creating or voiding a BadgeTransaction whose ServiceSession is not IN_SERVICE" }
  - { id: ERR_STALE_SITE_VERSION, http: 412, condition: "expected_client_site_version != ClientSite.version on catering confirm" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SiteAdmin
    description: "Sets up sites, employees, venues, vendors; controls the logical clock. Operational operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /api/client-sites"
      - "POST /api/client-sites/{id}/suspend"
      - "POST /api/client-sites/{id}/reactivate"
      - "POST /api/employees"
      - "POST /api/employees/{id}/terminate"
      - "POST /api/catering-venues"
      - "POST /api/vendors"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET /api/client-sites, GET /api/client-sites/{id}, GET /api/employees*, GET /api/vendors*, GET /api/catering-venues*"

  - name: CafeteriaManager
    description: "Runs cafeteria operations: menus, sessions, production close, purchasing, inventory, waste, catering fulfillment, POS voids."
    identity: opaque
    exclusive_operations:
      - "POST /api/menu-cycles, POST /api/menu-cycles/{id}/publish, POST /api/menu-items"
      - "POST /api/service-sessions and its lock-forecast/open/close/cancel actions"
      - "POST /api/badge-transactions/{id}/void"
      - "POST /api/purchase-orders and its issue/receive/cancel actions"
      - "POST /api/waste-events"
      - "POST /api/catering-orders/{id}/fulfill"
    shared_operations:
      - "GET on menus, sessions, inventory, purchase-orders, badge-transactions, catering-orders, vendor-invoices"

  - name: Diner
    description: "Badge holder making POS purchases and submitting satisfaction ratings. Acts as an Employee."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/badge-transactions (X-User-ID must equal the transaction's employee_id)"
      - "POST /api/satisfaction-surveys"
    shared_operations:
      - "GET /api/menu-items*, GET /api/menu-cycles/{id}, GET /api/service-sessions/{id}, GET /api/employees/{id} (self)"

  - name: CateringCoordinator
    description: "Creates, submits, revises, and cancels catering orders. Cannot approve (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /api/catering-orders"
      - "POST /api/catering-orders/{id}/submit"
      - "POST /api/catering-orders/{id}/revise"
    shared_operations:
      - "POST /api/catering-orders/{id}/cancel (shared with FinanceController)"
      - "GET on catering-orders, catering-venues, menu-items, client-sites/{id}"

  - name: CateringApprover
    description: "Reviews SUBMITTED catering orders (approve or request revision). Must not be the order's coordinator."
    identity: opaque
    exclusive_operations:
      - "POST /api/catering-orders/{id}/review"
    shared_operations:
      - "GET on catering-orders, catering-venues"

  - name: FinanceController
    description: "Confirms/invoices catering orders, runs vendor-invoice matching and payment. Owns fiscal controls."
    identity: opaque
    exclusive_operations:
      - "POST /api/catering-orders/{id}/confirm"
      - "POST /api/catering-orders/{id}/invoice"
      - "POST /api/vendor-invoices and its match/resolve/resubmit/pay actions"
    shared_operations:
      - "POST /api/catering-orders/{id}/cancel (shared with CateringCoordinator)"
      - "GET on client-sites, catering-orders, purchase-orders, inventory-lots, vendor-invoices, service-sessions"
