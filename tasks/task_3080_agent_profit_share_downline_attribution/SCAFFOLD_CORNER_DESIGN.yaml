            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 5000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
          trigger:
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /profit-share-periods/${per}", as: PlatformAdmin, captures: { pp: $.data.provisional_profit, pool: $.data.provisional_pool, dt: $.data.distributed_total, cr: $.data.center_retained_amount } }
          assert:
            - "provisional_profit == 1500.00 and provisional_pool == 780.00"
            - "mca's PROJECTION distribution amount == 750.00 (0.50 * 1500.00, unscaled)"
            - "distributed_total == 750.00 and center_retained_amount == 30.00"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_period_month_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_PERIOD_MONTH_CONFLICT]"]
        distinguishing_aspect: "Aggregate/uniqueness validation: a second 2026-09 period for the same center fails ERR_PERIOD_MONTH_CONFLICT even though the first is still OPEN."
        test_recipe:
          setup: ["Center with ACTIVE mca and an existing OPEN period 2026-09"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PERIOD_MONTH_CONFLICT, HTTP 409"

      - name: cross_center_sponsor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_SPONSOR_CROSS_CENTER]"]
        distinguishing_aspect: "Cross-entity referential validation: enrolling into MC1 with a sponsor who belongs to MC2 fails ERR_SPONSOR_CROSS_CENTER even though the sponsor exists and is ACTIVE."
        test_recipe:
          setup: ["Two centers; ext is ACTIVE in MC2"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc2}/agents", payload: { full_name: "Ext Agent", email: "ext@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { ext: $.data.id } }
            - { call: "POST /agents/${ext}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-ext-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${ext}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-ext-w9" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${ext}" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SPONSOR_CROSS_CENTER, HTTP 422"

      - name: dispute_evidence_not_attesting_filer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_EVIDENCE_INVALID]"]
        distinguishing_aspect: "Evidence validation is content-level: the attestation exists and belongs to the sponsored agent but names the recorded sponsor, not the filer — ERR_EVIDENCE_INVALID."
        test_recipe:
          setup: ["mca sponsors r1 and s2 (all ACTIVE); s2's attestation att names mca (the recorded sponsor)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "wrong attestee" }, as: Agent, as_user_id: "${r1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVIDENCE_INVALID, HTTP 422 (attestation names ${mca}, not filer ${r1})"

      - name: dispute_by_current_sponsor_not_actionable
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_DISPUTE_NOT_ACTIONABLE]"]
        distinguishing_aspect: "The current sponsor of record cannot dispute their own attribution: evidence is formally valid (attests the filer) yet the filing fails ERR_DISPUTE_NOT_ACTIONABLE."
        test_recipe:
          setup: ["mca sponsors s2; s2's attestation att names mca; mca files over s2"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "self dispute" }, as: Agent, as_user_id: "${mca}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISPUTE_NOT_ACTIONABLE, HTTP 422"

      - name: backdated_commission_before_cap_year_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_BACKDATED_COMMISSION]"]
        distinguishing_aspect: "Temporal validation on occurred_on: an event dated before the agent's cap_year_start fails ERR_BACKDATED_COMMISSION even though the agent is ACTIVE and the amount is positive."
        test_recipe:
          setup: ["ACTIVE a1 joined 2026-09-01 (cap year starts 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 1000.00, occurred_on: "2026-08-15T00:00:00Z", external_ref: "ref-old", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BACKDATED_COMMISSION, HTTP 422"

      - name: nonpositive_gross_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_NONPOSITIVE_AMOUNT]"]
        distinguishing_aspect: "Fiscal floor: gross_commission 0.00 is rejected (the check is strict >, not >=) with ERR_NONPOSITIVE_AMOUNT."
        test_recipe:
          setup: ["ACTIVE a1"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 0.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-zero", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NONPOSITIVE_AMOUNT, HTTP 422"

      - name: preliminary_close_requires_positive_profit
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_PROFIT_NOT_POSITIVE]"]
        distinguishing_aspect: "Aggregate fiscal validation: every input is individually valid (settled 1000.00 event, 500.00 expense) but provisional profit -200.00 makes the close fail ERR_PROFIT_NOT_POSITIVE."
        test_recipe:
          setup: ["mca ACTIVE; d1 (mca-sponsored) settled 1000.00 (company dollar 300.00); period 2026-09 with EXPENSE 500.00"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${mca}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${mca}", gross_commission: 1000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/ledger-entries", payload: { entry_type: "EXPENSE", amount: 500.00 }, as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROFIT_NOT_POSITIVE, HTTP 422 (provisional_profit 300.00 - 500.00 = -200.00)"
            - "ProfitSharePeriod.${per}.status remains OPEN"

      - name: preliminary_close_by_non_center_agent_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_MCA_NOT_CENTER_AGENT]"]
        distinguishing_aspect: "Conditional referential validation on the actor: the MarketCenterAdmin role passes RBAC, but an actor whose agent record belongs to a different center fails ERR_MCA_NOT_CENTER_AGENT."
        test_recipe:
          setup: ["MC1 (with period 2026-09 OPEN and a settled 10000.00 event by its own mca) and MC2 whose agent out is ACTIVE"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc2}/agents", payload: { full_name: "Out Sider", email: "out@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { out: $.data.id } }
            - { call: "POST /agents/${out}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-out-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${out}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-out-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${mca}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${mca}", gross_commission: 10000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc1}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
          trigger:
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${out}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MCA_NOT_CENTER_AGENT, HTTP 422 — ${out} is ACTIVE but in MC2, not the period's center"
            - "ProfitSharePeriod.${per}.status remains OPEN"

      - name: segregation_of_duties_on_ratify
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties across roles: the agent who ran preliminary close cannot also ratify the final close — ALCChair role with the closer's X-User-ID fails ERR_SEGREGATION_OF_DUTIES while a different chair succeeds."
        test_recipe:
          setup: ["Center with mca (runs prelim close) and alc; mca settled 20000.00; period proposed (FINAL_CLOSE_PENDING)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${mca}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${mca}", gross_commission: 20000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
          trigger:
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${mca}", captures: { err: $.data.error_id } }
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}", captures: { st: $.data.status } }
          assert:
            - "Ratify by the preliminary closer ${mca}: error_id == ERR_SEGREGATION_OF_DUTIES, HTTP 403, resolution stays PROPOSED"
            - "Ratify by ${alc}: resolution RATIFIED and period FINAL_CLOSED"

      - name: transfer_to_same_center_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_TRANSFER_SELF_CENTER]"]
        distinguishing_aspect: "Destination equal to the agent's current center fails ERR_TRANSFER_SELF_CENTER before any window or in-progress checks."
        test_recipe:
          setup: ["ACTIVE a1 in MC1"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc1}", effective_date: "2026-10-01T00:00:00Z", expected_agent_version: "${av}" }, as: Agent, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_SELF_CENTER, HTTP 422"

      - name: second_transfer_while_in_progress_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_TRANSFER_IN_PROGRESS]"]
        distinguishing_aspect: "Aggregate state validation: a second transfer request fails ERR_TRANSFER_IN_PROGRESS while a REQUESTED one exists — even though the agent is ACTIVE and the destination differs."
        test_recipe:
          setup: ["ACTIVE a1 in MC1 with a REQUESTED transfer to MC2 effective 2026-10-01"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Three", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc3: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-10-01T00:00:00Z", expected_agent_version: "${av}" }, as: Agent, as_user_id: "${a1}", captures: { tr: $.data.id } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av2: $.data.version } }
          trigger:
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc3}", effective_date: "2026-11-01T00:00:00Z", expected_agent_version: "${av2}" }, as: Agent, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_IN_PROGRESS, HTTP 409 (OCC version was current; the in-progress aggregate check fires first)"

      - name: transfer_complete_before_effective_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_TRANSFER_NOT_EFFECTIVE]"]
        distinguishing_aspect: "Temporal validation against the logical clock: completing an APPROVED transfer before its effective_date (clock 2026-09-01 < 2026-10-01) fails ERR_TRANSFER_NOT_EFFECTIVE; advancing the clock unblocks it."
        test_recipe:
          setup: ["ACTIVE a1 in MC1 with APPROVED transfer to MC2 effective 2026-10-01; clock at default 2026-09-01"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-10-01T00:00:00Z", expected_agent_version: "${av}" }, as: Agent, as_user_id: "${a1}", captures: { tr: $.data.id } }
            - { call: "POST /transfer-requests/${tr}/approve", as: MarketCenterAdmin, as_user_id: "${a1}" }
          trigger:
            - { call: "POST /transfer-requests/${tr}/complete", as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /transfer-requests/${tr}/complete", as: MarketCenterAdmin, as_user_id: "${a1}", captures: { st: $.data.status } }
          assert:
            - "Before effective date: error_id == ERR_TRANSFER_NOT_EFFECTIVE, HTTP 422"
            - "At exactly 2026-10-01T00:00:00Z (inclusive): TransferRequest.${tr}.status == COMPLETED"

      - name: appeal_exhausted_after_single_appeal
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_APPEAL_EXHAUSTED]", entities.SponsorshipDispute.fields.appeal_count]
        distinguishing_aspect: "Counter-bounded validation: exactly one appeal is allowed; the second appeal after a full re-review cycle fails ERR_APPEAL_EXHAUSTED."
        test_recipe:
          setup: ["mca sponsors r1 and s2; attestation att on s2 names r1; dispute by r1 resolved UPHELD, appealed, re-reviewed, resolved UPHELD again"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${r1}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "mine" }, as: Agent, as_user_id: "${r1}", captures: { dsp: $.data.id } }
            - { call: "POST /sponsorship-disputes/${dsp}/open-review", as: RegionalDirector }
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "UPHELD" }, as: RegionalDirector }
            - { call: "POST /sponsorship-disputes/${dsp}/appeal", payload: { reason: "appeal one" }, as: Agent, as_user_id: "${r1}" }
            - { call: "POST /sponsorship-disputes/${dsp}/open-review", as: RegionalDirector }
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "UPHELD" }, as: RegionalDirector }
          trigger:
            - { call: "POST /sponsorship-disputes/${dsp}/appeal", payload: { reason: "appeal two" }, as: Agent, as_user_id: "${r1}", captures: { err: $.data.error_id } }
          assert:
            - "Second appeal: error_id == ERR_APPEAL_EXHAUSTED, HTTP 422 (appeal_count already 1)"

      - name: sponsor_cycle_on_overturn_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_SPONSOR_CYCLE]", calculations.downline_attribution_closure]
        distinguishing_aspect: "Graph constraint under dispute resolution: overturning s1's sponsorship to her own descendant d1 would create a cycle, so resolve fails ERR_SPONSOR_CYCLE and no edges are mutated."
        test_recipe:
          setup: ["Chain mca -> s1 -> d1; s1 carries a second attestation att2 naming d1; d1 files over s1 with att2; dispute UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${s1}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att2", attested_sponsor_agent_id: "${d1}" }, as: PlatformAdmin, captures: { att2: $.data.id } }
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s1}", evidence_document_id: "${att2}", reason: "d1 claims sponsorship" }, as: Agent, as_user_id: "${d1}", captures: { dsp: $.data.id } }
            - { call: "POST /sponsorship-disputes/${dsp}/open-review", as: RegionalDirector }
          trigger:
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "OVERTURNED" }, as: RegionalDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SPONSOR_CYCLE, HTTP 422 (d1 is s1's descendant; re-point would loop the chain)"
            - "SponsorshipDispute.${dsp}.status remains UNDER_REVIEW and Agent.${s1}.sponsor_agent_id still == ${mca}"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_default_and_set_current_utc
        claim_type: custom_test_driving_endpoint
        grounds: [entities.SponsorshipDispute.fields.filed_at, entities.SponsorshipDispute.fields.window_deadline]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads the fixed default 2026-09-01T00:00:00Z (observable via a filed dispute's filed_at), and the set endpoint echoes the new time — no wall-clock dependence."
        test_recipe:
          setup: ["mca sponsors r1 and s2; attestation att on s2 names r1; no clock call made"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${r1}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "default clock probe" }, as: Agent, as_user_id: "${r1}", captures: { fa: $.data.filed_at, dl: $.data.window_deadline } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin, captures: { now: $.data.current_utc } }
          assert:
            - "SponsorshipDispute filed_at == 2026-09-01T00:00:00Z (server default, not wall clock) and window_deadline == 2026-11-30T00:00:00Z"
            - "set_current_utc echoes current_utc == 2026-10-01T00:00:00Z"

      - name: transfer_complete_preserves_downline_and_cap_year
        claim_type: action_side_effects
        grounds: [state_machines.TransferRequest, entities.TransferRequest.fields.downline_preserved, entities.Agent.fields.accrued_company_dollar]
        distinguishing_aspect: "Completing a transfer re-homes the agent but preserves the sponsorship closure verbatim (the mca -> s1 edge stays ACTIVE across centers) and carries cap year, accrual (12000.00), and cap_status across unchanged."
        test_recipe:
          setup: ["MC1, MC2; mca ACTIVE in MC1; s1 (sponsored by mca) ACTIVE with accrued_company_dollar 12000.00 from a 40000.00 post; transfer s1 -> MC2 APPROVED, effective 2026-09-10; clock at 2026-09-10"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { sv1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${s1}", gross_commission: 40000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-s1", expected_agent_version: "${sv1}" }, as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { sv2: $.data.version } }
            - { call: "POST /agents/${s1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-09-10T00:00:00Z", expected_agent_version: "${sv2}" }, as: Agent, as_user_id: "${s1}", captures: { tr: $.data.id } }
            - { call: "POST /transfer-requests/${tr}/approve", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /transfer-requests/${tr}/complete", as: MarketCenterAdmin, as_user_id: "${mca}", captures: { dp: $.data.downline_preserved } }
            - { call: "GET /agents/${s1}", as: PlatformAdmin, captures: { home: $.data.market_center_id, acc: $.data.accrued_company_dollar, cys: $.data.cap_year_start, mem: $.data.membership_status } }
            - { call: "GET /sponsorship-edges", as: PlatformAdmin, payload: { child_agent_id: "${s1}", status: "ACTIVE" } }
          assert:
            - "Agent.${s1}.market_center_id == ${mc2} and membership_status == ACTIVE (transfer does not depart the agent)"
            - "Agent.${s1}.accrued_company_dollar == 12000.00 and cap_year_start == 2026-09-01T00:00:00Z (cap year NOT reset by transfer)"
            - "Exactly one ACTIVE edge with child ${s1}: parent ${mca}, depth_level 1 — downline preserved across centers (downline_preserved == true)"

      - name: agents_filter_by_sponsor_reverse_reachability
        claim_type: filtered_list
        grounds: [entities.Agent.fields.sponsor_agent_id, entities.SponsorshipEdge.fields.parent_agent_id]
        distinguishing_aspect: "Both FK reverse-reachability forms answer 'who did mca sponsor': the filtered list GET /agents?sponsor_agent_id and the sub-resource GET /agents/{id}/downline return the same two children."
        test_recipe:
          setup: ["mca ACTIVE; s1 and s2 sponsored by mca"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
          trigger:
            - { call: "GET /agents", as: PlatformAdmin, payload: { sponsor_agent_id: "${mca}" } }
            - { call: "GET /agents/${mca}/downline", as: PlatformAdmin, payload: { status: "ACTIVE" } }
          assert:
            - "GET /agents?sponsor_agent_id=${mca} returns exactly 2 rows (${s1}, ${s2})"
            - "GET /agents/${mca}/downline returns exactly 2 ACTIVE edges, both depth_level 1, children ${s1} and ${s2}"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_cascade_for_secondary_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARKET_CENTER_NOT_FOUND]", "errors[ERR_PERIOD_NOT_FOUND]", "errors[ERR_DISPUTE_NOT_FOUND]", "errors[ERR_COMMISSION_EVENT_NOT_FOUND]", "errors[ERR_TRANSFER_NOT_FOUND]", "errors[ERR_RESOLUTION_NOT_FOUND]", "errors[ERR_DISTRIBUTION_NOT_FOUND]"]
        distinguishing_aspect: "Every remaining catalog 404 is triggerable: one sweep of GETs with non-existent UUIDs returns the resource-specific error id for each of the seven secondary resource types."
        test_recipe:
          setup: ["Empty database (a single center exists for contrast)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /market-centers/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /profit-share-periods/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /sponsorship-disputes/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /commission-events/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e4: $.data.error_id } }
            - { call: "GET /transfer-requests/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e5: $.data.error_id } }
            - { call: "GET /governance-resolutions/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e6: $.data.error_id } }
            - { call: "GET /profit-share-distributions/00000000-0000-0000-0000-000000000000", as: PlatformAdmin, captures: { e7: $.data.error_id } }
          assert:
            - "e1 == ERR_MARKET_CENTER_NOT_FOUND, e2 == ERR_PERIOD_NOT_FOUND, e3 == ERR_DISPUTE_NOT_FOUND"
            - "e4 == ERR_COMMISSION_EVENT_NOT_FOUND, e5 == ERR_TRANSFER_NOT_FOUND, e6 == ERR_RESOLUTION_NOT_FOUND, e7 == ERR_DISTRIBUTION_NOT_FOUND"
            - "All seven responses use HTTP 404 and the error envelope shape"

      - name: dispute_with_missing_evidence_returns_document_not_found
