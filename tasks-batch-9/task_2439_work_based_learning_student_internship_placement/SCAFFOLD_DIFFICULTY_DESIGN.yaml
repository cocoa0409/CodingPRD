  - rule_id: non_linear_state_machine
    instances:
      - name: placement_compliance_dimension_cycles_back_to_cleared_while_lifecycle_stays_active
        grounds:
          - state_machines.Placement
          - entities.Placement.fields.compliance_status
          - endpoints["POST /wbl/placements/{placementId}/compliance-decision"]
          - endpoints["POST /wbl/work-permits/{permitId}/revoke"]
        distinguishing_aspect: |
          Non-linear parallel machine: the compliance dimension leaves CLEARED for FLAGGED when the
          student's permit is revoked and then returns to CLEARED after a replacement permit is
          issued and a compliance decision is recorded, while the lifecycle dimension never leaves
          ACTIVE — so the pair (ACTIVE, CLEARED) is reachable twice with a FLAGGED excursion between.
        test_recipe:
          setup:
            - "logical clock at 2026-09-14T08:00:00Z"
            - "EXECUTED agreement on an APPROVED worksite with a trained supervisor"
            - "student with an ISSUED MINOR_16_17 permit and an APPROVED training plan"
