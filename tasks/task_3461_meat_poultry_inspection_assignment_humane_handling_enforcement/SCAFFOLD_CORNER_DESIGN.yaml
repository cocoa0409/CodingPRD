              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
