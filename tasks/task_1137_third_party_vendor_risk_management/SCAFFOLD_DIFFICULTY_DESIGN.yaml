            - call: "GET /tprm/vendors/${v_cw2}/monitoring-cycles"
              payload: {}
              as: RiskOfficer
          assert:
            - "count(MonitoringCycle on ${v_cw2} with status == SCHEDULED) == 1  # capacity-1 invariant held"
            - "new SCHEDULED cycle's due_at == 2026-06-01T00:00:00Z + 365 days = 2027-06-01T00:00:00Z  # anchor is previous completed_at"

      - name: audit_exercise_aggregate_capacity_one
        grounds:
          - validations[priority=16.6]
          - errors[ERR_AUDIT_ALREADY_ACTIVE]
        distinguishing_aspect: |
          Resource = VendorEngagement (its audit channel). Interval semantics =
          aggregate capacity (at most one active audit at any instant, where
          "active" means status IN {INITIATED, FIELDWORK, FINDINGS_ISSUED}).
          Different from the half-open-window semantics of the monitoring-cycle
          instance — this is a mutual-exclusion semaphore, not a geometric
          window. Test: open audit A; attempt to open audit B while A is in
          FIELDWORK → rejected with ERR_AUDIT_ALREADY_ACTIVE; close A; then B
          succeeds.
        test_recipe:
          setup:
