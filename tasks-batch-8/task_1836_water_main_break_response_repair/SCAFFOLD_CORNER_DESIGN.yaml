            - "After cancelling W1, a new work order is created successfully (DRAFT)"

      - name: claim_zero_amount_returns_invalid_amount
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_AMOUNT]"]
        distinguishing_aspect: "claimed_amount_cents of 0 violates the positive-amount rule -> ERR_INVALID_AMOUNT (400)."
        test_recipe:
          setup: ["Confirmed break"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
