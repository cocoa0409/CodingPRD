            - "level 1 — Inspection.${insp_a_id}.deficiency_score == 70 (3 MINOR + 1 CRITICAL = 58, round_half_up(58 * 1.20) = 70) and escalation_triggered == true"
            - "level 2 — ConstructionSite.${site_a_id}.field_status == STOP_WORK, stop_work_count == 1, open_deficiency_score == 70, stop_work_reason == AUTOMATIC_ESC_DEFICIENCY"
            - "level 3 — EnforcementAction.${auto_ea_id}.auto_generated == true, action_type == NOTICE_OF_VIOLATION, violation_days == 0, prior_assessed_total_cents == 0, escalation_multiplier == 1.00, penalty_cents == 25000"
            - "level 4 — PermitTerm.${term_id}.total_assessed_penalty_cents == 25000"
            - "level 5 — AnnualReport.${report_id}.status == DRAFT, invalidated_reason == PENALTY_LEDGER_CHANGED, invalidation_count == 1, compiled_at == null, compiled_by_user_id == null"
            - "side branch — ControlMeasure.${cr_id}.enforcement_count == 1 and goal_status == PENDING (the BEHIND gate needs 2)"
            - "ConstructionSite.${site_a_id}.plan_status == APPROVED: the cascade touched only the field dimension"

