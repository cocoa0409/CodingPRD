  - { method: GET, path: "/retention-boxes", description: "List retention boxes, filterable by account_id and location_id (reverse-reachability for RetentionBox.account_id and .location_id)", roles: [AccountManager, PlantOperator, ComplianceOfficer], code: 200,
      input: ["account_id?", "location_id?", "status?", "limit?", "offset?"], output: "RetentionBox[]", side_effects: [] }
