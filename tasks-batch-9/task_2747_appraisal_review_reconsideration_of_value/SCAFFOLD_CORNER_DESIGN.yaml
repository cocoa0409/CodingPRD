        grounds:
          - errors.ERR_ESCALATION_NOT_PENDING
          - validations.priority_15_ERR_ESCALATION_NOT_PENDING
        excluded_because:
          difficulty_instance: escalation_assign_state_error_precedes_budget_error
          rationale: "That §1.8 priority-pair instance assigns an order twice and asserts ERR_ESCALATION_NOT_PENDING on the second call -- while the same body also breaches the AMC budget -- proving both that the code is triggerable and that it outranks the 402."

      - name: error_amc_not_eligible_on_intake_for_a_suspended_amc
        claim_type: violation_to_error
        grounds:
          - errors.ERR_AMC_NOT_ELIGIBLE
          - validations.priority_23_ERR_AMC_NOT_ELIGIBLE
        excluded_because:
          difficulty_instance: appraisal_intake_blocked_by_suspended_amc
          rationale: "That §1.8 cross_entity_state_dependency instance drives an AMC to SUSPENDED through the breach cascade and asserts ERR_AMC_NOT_ELIGIBLE on the next delivery, then shows the same body accepted for an ACTIVE AMC."

      - name: error_appraiser_ineligible_for_a_second_appraisal_assignment
        claim_type: violation_to_error
        grounds:
          - errors.ERR_APPRAISER_INELIGIBLE
          - validations.priority_26_ERR_APPRAISER_INELIGIBLE
        excluded_because:
          difficulty_instance: second_appraisal_assignment_blocked_by_probation_appraiser
          rationale: "That §1.8 cross_entity_state_dependency instance asserts ERR_APPRAISER_INELIGIBLE for a PROBATION appraiser on a SECOND_APPRAISAL order and the acceptance of the same appraiser on a FIELD_REVIEW order, covering both halves of the standing rule."

      - name: error_loan_not_rov_eligible_on_a_closed_loan
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LOAN_NOT_ROV_ELIGIBLE
          - validations.priority_27_ERR_LOAN_NOT_ROV_ELIGIBLE
        excluded_because:
          difficulty_instance: rov_submit_referential_error_precedes_evidence_constraint
          rationale: "That §1.8 priority_pair_validation_conflict instance triggers ERR_LOAN_NOT_ROV_ELIGIBLE on an ineligible loan file and shows it outranking the admissible-evidence count check on the same submit call."

      - name: error_rov_round_limit_on_a_third_round
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ROV_ROUND_LIMIT
          - validations.priority_38_ERR_ROV_ROUND_LIMIT
        excluded_because:
          difficulty_instance: rov_request_cycles_back_to_intake_until_round_limit
          rationale: "That §1.8 non_linear_state_machine instance walks the RESPONDED -> INTAKE cycle to MAX_ROV_ROUNDS and asserts ERR_ROV_ROUND_LIMIT on the attempt to open a third round."

      - name: error_inspection_window_conflict_on_an_overlapping_assignment
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSPECTION_WINDOW_CONFLICT
          - validations.priority_31_ERR_INSPECTION_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: appraiser_inspection_window_travel_buffer_half_open_exclusive
          rationale: "That §1.8 resource_temporal_overlap instance asserts ERR_INSPECTION_WINDOW_CONFLICT at one minute inside the travel-buffered window and acceptance exactly at the buffered edge, which is the strongest form of the claim."

      - name: error_dispute_slot_capacity_exceeded_on_a_third_overlap
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DISPUTE_SLOT_CAPACITY_EXCEEDED
          - validations.priority_32_ERR_DISPUTE_SLOT_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: amc_dispute_slot_closed_interval_aggregate_capacity
          rationale: "That §1.8 resource_temporal_overlap instance fills concurrent_dispute_capacity with two overlapping slots, asserts ERR_DISPUTE_SLOT_CAPACITY_EXCEEDED on the third, and shows a touching-endpoint slot still counting under closed-interval semantics."

