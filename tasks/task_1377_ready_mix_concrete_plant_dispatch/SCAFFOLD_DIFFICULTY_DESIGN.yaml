scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (two different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_load_pricing
        grounds:
          - calculations.load_final_charge
          - entities.Order.fields.provisional_total_cents
          - entities.Load.fields.final_charge_cents
        distinguishing_aspect: |
          Same order data prices differently under the two variants: PROVISIONAL at
          confirm uses the confirm-month index (110.0 -> escalated base 16500) while
          FINAL at complete uses the pour-month index (115.0 -> 17250) plus actual
          wait minutes, so provisional_total_cents (145200) != final_charge_cents (159300).
        test_recipe:
          setup:
            - "Plant (cycle 30), ACTIVE mix M4000 (564 lb/yd3, design_wc 0.45, max_wc 0.50, admixtures AEA 1.55 / WR 2.65), ACTIVE price list (base 15000, min_load 4.0, short fee 7500, wait 60 free + 250/min cap 15000, Saturday 0.10)"
            - "Cement indices: 2026-06=100.0, 2026-07=110.0 published before confirm; 2026-08=115.0 published after confirm"
            - "Order qty 8.0, pour_date 2026-08-15 (Saturday), confirmed at clock 2026-07-15; one 8.0 yd3 load completed with 90 on-site minutes"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-06", index_points: 100.0 }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-07", index_points: 110.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
          assert:
            - "Order.${o_id}.escalated_base_cents == 16500 (provisional index 110.0)"
            - "Order.${o_id}.provisional_total_cents == 145200"
            - "Load.${l_id}.concrete_cents == 138000 (final index 115.0 -> escalated 17250)"
            - "Load.${l_id}.final_charge_cents == 159300"
            - "Order.${o_id}.provisional_total_cents != Load.${l_id}.final_charge_cents"

      - name: design_basis_vs_as_placed_strength_liability
        grounds:
          - calculations.strength_acceptance
          - state_machines.CylinderSet.FINAL_RECORDED_to_FLAGGED
          - entities.CylinderSet.fields.acceptance_basis
        distinguishing_aspect: |
          Identical 28-day break data (3800 psi < 4000 required) yields different
          liability by variant: the DESIGN_BASIS leg (no site water) attributes
          strength_liability = PLANT, while the AS_PLACED leg (60 gal customer-authorized
          water pushing w/c to 0.561 > 0.50) attributes strength_liability = CUSTOMER.
        test_recipe:
          setup:
            - "Catalog/pricing as standard; two orders qty 8.0 pour 2026-08-15, each one 8.0 yd3 load on truck T1 (leg 1) and T2 (leg 2)"
            - "Leg 1: no water addition; Leg 2: 60 gal customer_authorized addition while POURING (w/c 0.561 > max 0.50)"
            - "Each load gets a 3-cylinder set cast by qc-a, breaks entered by qc-b (3100 @7d, 3800 @28d), certified by qc-c"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T2", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t2_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o1_id}/confirm", payload: {}, as: Dispatcher, captures: { o1_v: "$.data.version" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o2_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o2_id}/confirm", payload: {}, as: Dispatcher, captures: { o2_v: "$.data.version" } }
            - { call: "POST /v1/orders/${o1_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o1_v}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l1_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o2_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o2_v}", truck_id: "${t2_id}" }, as: Dispatcher, captures: { l2_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l1_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l2_id}/batch", payload: { batch_time: "2026-08-15T10:30:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l1_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l2_id}/depart", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:35:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l1_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l1_id}/cylinder-sets", payload: { num_cylinders: 3 }, as: QCTech, as_user_id: "qc-a", captures: { cs1_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T11:05:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l2_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/loads/${l2_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/loads/${l2_id}/cylinder-sets", payload: { num_cylinders: 3 }, as: QCTech, as_user_id: "qc-a", captures: { cs2_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l2_id}/water-additions", payload: { gallons: 60, customer_authorized: true }, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l2_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T12:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/cylinder-sets/${cs1_id}/breaks", payload: { break_type: "SEVEN_DAY", strength_psi: 3100 }, as: QCTech, as_user_id: "qc-b" }
            - { call: "POST /v1/cylinder-sets/${cs2_id}/breaks", payload: { break_type: "SEVEN_DAY", strength_psi: 3100 }, as: QCTech, as_user_id: "qc-b" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T12:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/cylinder-sets/${cs1_id}/breaks", payload: { break_type: "TWENTY_EIGHT_DAY", strength_psi: 3800 }, as: QCTech, as_user_id: "qc-b" }
            - { call: "POST /v1/cylinder-sets/${cs2_id}/breaks", payload: { break_type: "TWENTY_EIGHT_DAY", strength_psi: 3800 }, as: QCTech, as_user_id: "qc-b" }
          trigger:
            - { call: "POST /v1/cylinder-sets/${cs1_id}/certify", payload: {}, as: QCTech, as_user_id: "qc-c" }
            - { call: "POST /v1/cylinder-sets/${cs2_id}/certify", payload: {}, as: QCTech, as_user_id: "qc-c" }
          assert:
            - "CylinderSet.${cs1_id}.status == FLAGGED and acceptance_basis == DESIGN_BASIS"
            - "CylinderSet.${cs2_id}.status == FLAGGED and acceptance_basis == AS_PLACED"
            - "Load.${l1_id}.strength_liability == PLANT"
            - "Load.${l2_id}.strength_liability == CUSTOMER"
            - "Load.${l2_id}.actual_wc_ratio == 0.561 and over_watered == true"
            - "Load.${l1_id}.over_watered == false"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes: (b) then (a))
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: admixture_round_per_line_then_sum
        grounds:
          - calculations.batch_weights_and_dosing
          - entities.BatchTicket.fields.total_admixture_oz
        distinguishing_aspect: |
          Mode (b) nested rounding: per-line doses round to 0.1 oz BEFORE summing —
          for a 6.0 yd3 load (cement 3384 lb) the pinned order yields
          total_admixture_oz == 142.2 (52.5 + 89.7), while sum-then-round of the raw
          doses would yield 142.1.
        test_recipe:
          setup:
            - "Standard catalog; order qty 6.0 pour 2026-08-17 (Monday); one 6.0 yd3 load on T1 batched"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 6.0, pour_date: "2026-08-17", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 6.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-17T09:00:00Z" }, as: BatchOperator }
            - { call: "GET /v1/loads/${l_id}/batch-ticket", payload: {}, as: BatchOperator, captures: { tkt_cement: "$.data[0].cement_lb", tkt_water: "$.data[0].batch_water_lb", tkt_adx: "$.data[0].total_admixture_oz" } }
          assert:
            - "BatchTicket.cement_lb == 3384"
            - "BatchTicket.batch_water_lb == 1523"
            - "BatchTicket.admixture_doses == [{AEA: 52.5}, {WR: 89.7}] (per-line round_half_up to 0.1 oz)"
            - "BatchTicket.total_admixture_oz == 142.2  (NOT 142.1 from sum-then-round)"

      - name: saturday_wait_shortload_conditional_interaction
        grounds:
          - calculations.load_final_charge
          - entities.Load.fields.saturday_fee_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: the Saturday surcharge applies
          to (concrete + short_load) but NOT to the wait fee; the wait fee is
          min(max(0, 90-60) x 250, 15000) = 7500; the pinned line order yields
          final_charge_cents == 159300, and any variant that surcharges the wait fee
          would produce 160050 instead.
        test_recipe:
          setup:
            - "Standard catalog with indices 2026-06=100, 2026-07=110, 2026-08=115 all published; order qty 8.0 pour 2026-08-15 (Saturday); one 8.0 yd3 load with 90 on-site minutes"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-06", index_points: 100.0 }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-07", index_points: 110.0 }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
          assert:
            - "Load.${l_id}.on_site_minutes == 90"
            - "Load.${l_id}.concrete_cents == 138000"
            - "Load.${l_id}.short_load_fee_cents == 0"
            - "Load.${l_id}.wait_fee_cents == 7500"
            - "Load.${l_id}.saturday_fee_cents == 13800  (10% of concrete+short only; wait fee excluded)"
            - "Load.${l_id}.final_charge_cents == 159300"

  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_dimensions_billing_independent_of_delivery
        grounds:
          - state_machines.Order
          - entities.Order.fields.delivery_status
          - entities.Order.fields.billing_status
        distinguishing_aspect: |
          Order carries two independent state axes: delivery reaches terminal
          DELIVERED while billing is still PRICED, then billing cycles
          PRICED -> INVOICED -> DISPUTED -> INVOICED -> PAID without delivery_status
          ever changing — a linear single-axis machine cannot express this.
        test_recipe:
          setup:
            - "Standard catalog (indices through 2026-08 published); order qty 8.0 pour 2026-08-15 fully delivered by one 8.0 yd3 load with 90 on-site minutes (invoice 159300)"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
