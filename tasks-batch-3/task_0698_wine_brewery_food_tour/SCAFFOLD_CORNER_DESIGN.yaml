              captures: { g_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${g_id}" }
              as: Operator
            - call: "POST /guests/${g_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
