            - call: "POST /technicians"
              payload: { name: "Tech R", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { ttr: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${srb}", vessel_id: "${vrb}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { trb: $.data.id }
          trigger:
            - call: "POST /service-tickets/${trb}/quote"
