            - *k_insp_front
            - *k_insp_rear
            - *k_insp_interior
            - *k_insp_roof
            - *k_insp_under
            - *k_verify_title
            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
            - *k_bk_approve
            - *k_bk_confirm
            - *k_read_pre
          trigger:
            - call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "MID_TRIP"
                odometer_miles: 41900
                generator_hours: 125.0
                recorded_at: "2026-08-30T12:00:00Z"
              as: Renter
              as_user_id: "${renter_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 422"
            - "data.error_id == 'ERR_METER_READING_REGRESSION'"
            - "GET /rv-marketplace/meter-readings with booking_id == ${booking_id} returns total_count == 1"

