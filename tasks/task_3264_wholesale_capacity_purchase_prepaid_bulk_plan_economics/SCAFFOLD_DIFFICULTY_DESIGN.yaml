            - "the adjacent add-on activates successfully at exactly 2026-10-08T00:00:00Z and reports start_at == 2026-10-08T00:00:00Z with addon_price_cents == 273"
            - "the two windows touch without intersecting, which is the half-open semantics the scaffold pins"
            - "moving the clock one second earlier to 2026-10-07T23:59:59Z and activating a fresh 7-day add-on fails with ERR_ADDON_WINDOW_OVERLAP and status 409"
            - "the overlap check ignores add-ons for other subscribers and add-ons in EXPIRED, CANCELLED or VOIDED status"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: term_purchase_requires_parent_agreement_active
        grounds:
          - state_machines.CapacityAgreement.ACTIVE_to_SUSPENDED
          - state_machines.CapacityAgreement.DRAFT_to_ACTIVE
          - validations[priority=8]
          - errors.ERR_AGREEMENT_SUSPENDED
          - endpoints.POST_/carriers/prepaid-terms/{id}/purchase
        distinguishing_aspect: "Agreement to PrepaidTerm: a term's purchase transition is gated on the parent agreement being ACTIVE, so the identical purchase call against the same plan rejects with ERR_AGREEMENT_SUSPENDED while the agreement is SUSPENDED and succeeds after reactivation."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL DRAFT with one offered plan and a subscriber whose term is quoted and unpurchased."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - &s_ag_activate
              call: "POST /carriers/capacity-agreements/${ag_local_id}/activate"
              payload: { expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: CapacityPlanner
            - &s_ag_suspend
              call: "POST /carriers/capacity-agreements/${ag_local_id}/suspend"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/prepaid-terms/${term_h_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGREEMENT_SUSPENDED and the response status is 409"
            - "err != ERR_PLAN_RETIRED, because the plan is still OFFERED and only the agreement is closed to new business"
            - "GET /carriers/prepaid-terms/${term_h_id} reports term_status == QUOTED with term_price_cents == 0 after the rejection"
            - "reactivating the agreement and re-purchasing then succeeds and leaves term_status == PURCHASED with term_price_cents == 1999"
            - "the same purchase against a CLOSED agreement fails with ERR_AGREEMENT_CLOSED rather than ERR_AGREEMENT_SUSPENDED"

      - name: addon_activation_requires_subscriber_term_active
        grounds:
          - state_machines.Subscriber.GRACE_to_ACTIVE
          - state_machines.PrepaidTerm.AWAITING_ACTIVATION_to_ACTIVE
          - validations[priority=15]
          - errors.ERR_TERM_NOT_ACTIVE
          - endpoints.POST_/carriers/add-ons/{id}/activate
        distinguishing_aspect: "Subscriber term to AddOn: an add-on's activation is gated on the subscriber's PrepaidTerm being ACTIVE or ACTIVE_RENEWAL, so an add-on in REQUESTED state stays unactivated while the term is only AWAITING_ACTIVATION and activates once the term goes live."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated-lineage CA subscriber whose term is AWAITING_ACTIVATION with a provisioned activation; a roaming add-on created in REQUESTED state."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &s_addon_pre
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_h_id}", addon_type: "ROAMING", addon_days: 7, per_day_allotment_mb: 500 }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { addon_pre_id: $.data.id }
          trigger:
            - call: "POST /carriers/add-ons/${addon_pre_id}/activate"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "GET /carriers/prepaid-terms/${term_h_id} reports term_status == AWAITING_ACTIVATION and the subscriber's subscriber_status == PENDING_PORT"
            - "err == ERR_TERM_NOT_ACTIVE and the response status is 409"
            - "err != ERR_SUBSCRIBER_NOT_ACTIVE, because the subscriber gate is not the one that decides here"
            - "after POST /carriers/activations/${act_h_id}/complete the term is ACTIVE and the same activation succeeds with addon_status == ACTIVE and addon_price_cents == 273"
            - "the subscriber now reports subscriber_status == ACTIVE, so the second attempt passes both gates"

      - name: term_void_requires_sim_media_exhaustion
        grounds:
          - state_machines.SimInventory.AVAILABLE or RESERVED_PREPAID or SHIPPED or DELIVERED or RETURNED_to_DEPLETED
          - state_machines.PrepaidTerm.AWAITING_ACTIVATION_to_VOIDED
          - errors.ERR_NO_ACTIVATABLE_SIM_MEDIA
          - endpoints.POST_/carriers/activations/{id}/provision
        distinguishing_aspect: "SIM inventory to PrepaidTerm: a term is only voided for spare-inventory reasons once the state-scoped media block is fully consumed, so a term in AWAITING_ACTIVATION whose state still has one reserveable unit stays payable while the same term in a state with no media is voided with void_reason SPARE_INVENTORY."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan; one 1-unit CA eSIM block; two CA subscribers each holding a purchased term awaiting activation."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - &s_inv_one
              call: "POST /carriers/sim-inventories"
              payload: { state_code: "CA", sim_media_type: "ESIM_PROFILE", unit_count: 1 }
              as: CapacityPlanner
              captures: { inv_one_id: $.data.id }
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - &s_sub_second
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550022", full_name: "Second In Line", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_2b_id: $.data.id }
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_2b_id}", plan_id: "${plan_h_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_2b_id}"
              captures: { term_2b_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_2b_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_2b_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_2b_id}", prepaid_term_id: "${term_2b_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_2b_id}"
              captures: { act_2b_id: $.data.id }
            - &s_prov_first
              call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/activations/${act_2b_id}/provision"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the first provision consumed the block's only unit and SimInventory.${inv_one_id}.reserved_count == 1 with inventory_status DEPLETED"
            - "err == ERR_NO_ACTIVATABLE_SIM_MEDIA and the response status is 422"
            - "err != ERR_SIM_INVENTORY_DEPLETED, because no partially-reserved block exists for the state at all"
            - "the second subscriber's term remains AWAITING_ACTIVATION and its activation remains REQUESTED after the rejection"
            - "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary reports allocated_data_mb == 6000, both terms counted, because a term in AWAITING_ACTIVATION still commits capacity even when no media can serve it"
            - "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary reports congestion_index == 38 and congestion_active == false, so deprioritization is not armed at this fill level"

      - name: churn_requires_no_port_in_flight_on_a_different_pair
        grounds:
          - state_machines.Subscriber.ACTIVE_to_CHURNED
          - state_machines.Activation.SUBMITTED_to_CANCELLED
          - validations[priority=25]
          - errors.ERR_PORT_IN_FLIGHT
        distinguishing_aspect: "Activation port dimension to Subscriber: a subscriber cancel is gated on the activation's port_status not being SUBMITTED, so cancelling the port first is what makes the churn reachable — the gate crosses from the Subscriber machine into the Activation machine's second dimension."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated CA subscriber on H3 with a submitted port on the same activation."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_reopen_port
              call: "POST /carriers/activations/${act_h_id}/submit-port"
              payload: { porting_msisdn: "13055550001", losing_carrier: "Cascade Wireless", account_number_last4: "9001" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
          trigger:
            - call: "POST /carriers/activations/${act_h_id}/cancel-port"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
          assert:
            - "before the trigger the activation reports port_status == SUBMITTED and a subscriber cancel would have failed with ERR_PORT_IN_FLIGHT"
            - "after cancel-port the activation reports port_status == CANCELLED and held_data_mb == 0"
            - "GET /carriers/subscribers/${sub_h_id} reports allocation_status == ALLOCATED after the port cancellation, because the live term still holds its capacity"
            - "a subscriber cancel now succeeds and the subscriber reports CHURNED with its term EXPIRED"
            - "cancelling an already CANCELLED port fails with ERR_PORT_ALREADY_TERMINAL and status 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: roaming_addon_half_open_window_overlap_on_a_subscriber
        grounds:
          - validations[priority=27]
          - errors.ERR_ADDON_WINDOW_OVERLAP
          - entities.AddOn.fields.start_at
          - endpoints.POST_/carriers/add-ons/{id}/activate
        distinguishing_aspect: "Half-open interval semantics on the AddOn resource: windows are [start_at, end_at), so a new window starting exactly at an existing end_at is admitted and one second earlier is rejected, and the resource shares one subscriber's timeline with other add-ons."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated CA subscriber on H3 with one 30-day roaming add-on ACTIVE covering 2026-10-01T00:00:00Z to 2026-10-31T00:00:00Z."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_addon_30
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_h_id}", addon_type: "ROAMING", addon_days: 30, per_day_allotment_mb: 1000 }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { addon_30_id: $.data.id }
            - call: "POST /carriers/add-ons/${addon_30_id}/activate"
              payload: {}
              as: CapacityPlanner
            - &s_clock_oct31
              call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - &s_addon_exact
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_h_id}", addon_type: "ROAMING", addon_days: 7, per_day_allotment_mb: 500 }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { addon_exact_id: $.data.id }
          trigger:
            - call: "POST /carriers/add-ons/${addon_exact_id}/activate"
              payload: {}
              as: CapacityPlanner
              captures: { price_exact: $.data.addon_price_cents }
          assert:
            - "the 30-day add-on is ACTIVE with addon_price_cents == 900"
            - "price_exact == 273 and the exact-adjacency activation is accepted because the intervals only touch"
            - "the new window starts at 2026-10-31T00:00:00Z, which is exactly the predecessor's end_at"
            - "with the clock at 2026-10-30T00:00:00Z a further 7-day activation fails with ERR_ADDON_WINDOW_OVERLAP and status 409 because that window would intersect the active 30-day window"
            - "an INTERNATIONAL_LD add-on for the same subscriber is exempt from the roaming overlap check and activates at INTL_LD_FLAT_CENTS == 500"

      - name: client_pipeline_backlog_aggregate_capacity_on_sim_state
        grounds:
          - validations[priority=14]
          - entities.SimInventory.fields.unit_count
          - entities.SimInventory.fields.state_code
          - endpoints.POST_/carriers/activations/{id}/provision
        distinguishing_aspect: "Aggregate-capacity semantics on a different resource and with a different geometry: SIM media is not a time interval but a state-scoped pool whose total outstanding reservations are capped at unit_count, so the collision is in quantity space rather than in time, and state scoping means a CA block never relieves a NV backlog."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan; one 2-unit CA eSIM block and one 10-unit NV block that is 60 percent reserved; two CA subscribers and one NV subscriber awaiting activation."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - &s_inv_ca_two
              call: "POST /carriers/sim-inventories"
              payload: { state_code: "CA", sim_media_type: "ESIM_PROFILE", unit_count: 2 }
              as: CapacityPlanner
              captures: { inv_ca_two_id: $.data.id }
            - &s_inv_nv_ten
              call: "POST /carriers/sim-inventories"
              payload: { state_code: "NV", sim_media_type: "ESIM_PROFILE", unit_count: 10 }
              as: CapacityPlanner
              captures: { inv_nv_id: $.data.id }
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - &s_sub_ca2
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550032", full_name: "CA Second", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_ca2_id: $.data.id }
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_ca2_id}", plan_id: "${plan_h_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_ca2_id}"
              captures: { term_ca2_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_ca2_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_ca2_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_ca2_id}", prepaid_term_id: "${term_ca2_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_ca2_id}"
              captures: { act_ca2_id: $.data.id }
            - &s_sub_nv
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550033", full_name: "Nevada Holder", state_code: "NV" }
              as: CapacityPlanner
              captures: { sub_nv_id: $.data.id }
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_nv_id}", plan_id: "${plan_h_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_nv_id}"
              captures: { term_nv_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_nv_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_nv_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_nv_id}", prepaid_term_id: "${term_nv_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_nv_id}"
              captures: { act_nv_id: $.data.id }
          trigger:
            - call: "POST /carriers/activations/${act_ca2_id}/provision"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the first CA provision consumes one of the two CA units; the second CA provision is what the trigger issues"
            - "err == null on the trigger and SimInventory.${inv_ca_two_id}.reserved_count == 2"
            - "a third CA activation fails with ERR_SIM_INVENTORY_DEPLETED even though the NV block still has 10 unreserved units"
            - "state scoping is enforced: the NV subscriber provisions successfully against ${inv_nv_id} and never against the CA block"
            - "reservations from a different state are never counted toward the CA block's aggregate, so the CA block's cap is decided only by CA reservations"

      - name: buffer_and_adjacency_on_the_support_sla_window
        grounds:
          - calculations.support_case_topic_window
          - validations[priority=23]
          - errors.ERR_SLA_NOT_DUE
          - entities.SupportCase.fields.sla_due_at
        distinguishing_aspect: "A third interval geometry on a third resource: the support case's SLA window is a closed deadline, so an escalation one second before sla_due_at is refused and the escalation at exactly sla_due_at is admitted — the adjacency rule is at-or-after rather than strictly-after."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated CA subscriber on H3 with an OPEN PORT_STATUS support case whose SLA window is 4 hours."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_case_sla
              call: "POST /carriers/support-cases"
              payload: { subscriber_id: "${sub_h_id}", topic_code: "PORT_STATUS" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { case_sla_id: $.data.id }
            - &s_clock_0359
              call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T03:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carriers/support-cases/${case_sla_id}/escalate"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "the case's sla_due_at is 2026-10-01T04:00:00Z, which is created_at plus 4 hours for topic PORT_STATUS"
            - "err == ERR_SLA_NOT_DUE and the response status is 409"
            - "at 2026-10-01T04:00:00Z exactly the same escalate call succeeds and sets case_status == ESCALATED with escalation_reason == SELF_SERVICE_FAILED"
            - "the handling seconds booked are the PORT_STATUS routing estimate 120 plus the escalation estimate 60, so Subscriber.${sub_h_id}.support_seconds_used == 180"
            - "the deadline is closed on the due instant, so one second early is refused and the due instant itself is admitted"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: term_purchase_and_refund_conserve_agreement_megabytes
        grounds:
          - calculations.settlement_clearing
          - calculations.wholesale_allocated_data_mb
          - entities.CapacityAgreement.fields.allocated_data_mb
          - entities.CapacityAgreement.fields.remaining_data_mb
          - endpoints.POST_/carriers/prepaid-terms/{id}/cancel
        distinguishing_aspect: "Megabytes are the conserved quantity: buying a 3000-megabyte term moves allocated_data_mb from 0 to 3000 and remaining_data_mb from 16000 to 13000, and a later refund of that same term restores allocated_data_mb to exactly 0 and remaining_data_mb to exactly 16000 with no drift."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL active with offered H3 plan (3000 megabytes) and one CA subscriber whose term is quoted."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
          trigger:
            - call: "POST /carriers/prepaid-terms/${term_h_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
          assert:
            - "before the trigger GET /carriers/capacity-agreements/${ag_local_id}/usage-summary reports allocated_data_mb == 0 and remaining_data_mb == 16000"
            - "after the purchase allocated_data_mb == 3000 and remaining_data_mb == 13000"
            - "the conserved identity holds on both reads: allocated_data_mb + remaining_data_mb == committed_data_mb == 16000"
            - "POST /carriers/prepaid-terms/${term_h_id}/cancel then leaves allocated_data_mb == 0 and remaining_data_mb == 16000 exactly"
            - "the identity still holds after the compensation: 0 + 16000 == 16000"
            - "PrepaidTerm.${term_h_id}.term_status == REFUNDED and its deferred_revenue_cents == 0"

      - name: port_rejection_releases_exactly_the_held_megabytes
        grounds:
          - calculations.settlement_clearing
          - state_machines.Activation.SUBMITTED_to_REJECTED
          - entities.Activation.fields.held_data_mb
          - entities.CapacityAgreement.fields.remaining_data_mb
        distinguishing_aspect: "Held megabytes are the conserved quantity: submitting a port on a live term moves remaining_data_mb from 13000 to 13000, because the term already counted, and rejecting the port leaves it at 13000, while the Activation's own held_data_mb moves 0 to 3000 and back to 0 — the two rows must not double-count the same 3000 megabytes."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan; a CA subscriber whose term is purchased and whose activation is COMPLETED, so the term already contributes 3000 megabytes."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_reopen_port2
              call: "POST /carriers/activations/${act_h_id}/submit-port"
              payload: { porting_msisdn: "13055550001", losing_carrier: "Cascade Wireless", account_number_last4: "7712" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
          trigger:
            - call: "POST /carriers/activations/${act_h_id}/reject-port"
              payload: { rejection_code: "E0403" }
              as: SupportAgent
          assert:
            - "before the trigger the activation reports held_data_mb == 3000 while the agreement still reports allocated_data_mb == 3000 and remaining_data_mb == 13000"
            - "after the rejection held_data_mb == 0 and the agreement still reports allocated_data_mb == 3000 and remaining_data_mb == 13000"
            - "the identity allocated_data_mb + remaining_data_mb == 16000 holds at every observation, including with a port in flight"
            - "the count is exactly once: allocated_data_mb never reads 6000 while a port is held"
            - "Subscriber.${sub_h_id} reports allocation_status == NONE after the rejection and the term remains ACTIVE"

      - name: deferred_revenue_conserved_across_an_early_churn
        grounds:
          - calculations.schedule_formula_provisional_vs_final
          - calculations.early_churn_revenue_recognition
          - entities.PrepaidTerm.fields.deferred_revenue_cents
          - entities.PrepaidTerm.fields.earned_revenue_cents
        distinguishing_aspect: "Cents are the conserved quantity: earned_revenue_cents plus deferred_revenue_cents equals term_price_cents at purchase, after each cycle roll and after an early churn, so the 32000-cent term that rolls two cycles then churns still satisfies the identity at every checkpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with a 12-month plan at intro_price_cents 32000 and 20000-megabyte allotment; activated CA subscriber with two cycles rolled and a third open."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - &s_plan_y12
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_local_id}", plan_code: "Y12", term_months: 12, intro_price_cents: 32000, renewal_price_cents: 38000, data_allotment_mb: 20000, voice_allotment_min: 2000, sms_allotment_msg: 4000 }
              as: CapacityPlanner
              captures: { plan_y12_id: $.data.id }
            - call: "POST /carriers/plans/${plan_y12_id}/offer"
              payload: { expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: CapacityPlanner
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - &s_sub_y
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550042", full_name: "Yara Okonkwo", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_y_id: $.data.id }
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_y_id}", plan_id: "${plan_y12_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_y_id}"
              captures: { term_y_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_y_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_y_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_y_id}", prepaid_term_id: "${term_y_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_y_id}"
              captures: { act_y_id: $.data.id }
            - call: "POST /carriers/activations/${act_y_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_y_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_y_id}"
            - call: "GET /carriers/subscribers/${sub_y_id}"
              payload: {}
              as: CapacityPlanner
              captures: { sub_y_v: $.data.version }
          trigger:
            - call: "POST /carriers/subscribers/${sub_y_id}/cancel"
              payload: { expected_Subscriber_version: "${sub_y_v}" }
              as: Subscriber
              as_user_id: "${sub_y_id}"
          assert:
            - "at purchase PrepaidTerm.${term_y_id}.earned_revenue_cents + deferred_revenue_cents == 32000"
            - "after each of the first two rolls the identity still equals 32000"
            - "after the churn earned_revenue_cents == 8000 and deferred_revenue_cents == 24000, and 8000 + 24000 == 32000"
            - "the breakage recognised is floor(32000 * 30 / 360) == 2666 and it is added to the 5334 already earned across the two rolled cycles (2 * ceil(32000 / 12)), never recomputed from scratch"
            - "breakage_days == 30 because the 10 remaining cycles would be 300 days and the cap is 30"
            - "the identity earned_revenue_cents + deferred_revenue_cents == term_price_cents holds at purchase, at both rolls and after the churn, so no cent of the prepaid amount is created or destroyed"