  - rule_id: transitive_cascade
    instances:
      - name: breakdown_major_cascade_day_appointments_statement
        grounds:
          - state_machines.SiteDayAssignment.IN_SERVICE_to_INTERRUPTED
          - state_machines.PatientAppointment.CONFIRMED_to_CANCELLED
          - state_machines.StaffingAssignment.ASSIGNED_to_RELEASED
          - calculations.site_day_billing_amount
        distinguishing_aspect: |
          Depth-4 cascade from POST /api/breakdowns (severity MAJOR): the breakdown interrupts
          the day (hop 1); the day interruption force-cancels its non-terminal appointments
          (hop 2, caused by the day transition); the statement auto-created from the interrupted
          day prices off the cancelled-appointment end state (hop 3, caused by hop 2's zero
          billable set -> guaranteed_minimum 200000); staffing release rides hop 2. Distinct
          trigger from the clock-driven accreditation expiry cascade.
