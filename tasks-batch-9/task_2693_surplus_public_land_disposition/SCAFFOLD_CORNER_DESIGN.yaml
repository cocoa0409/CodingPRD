        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - entities.Parcel.fields.apn
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: "Parcel.apn is a store-wide natural key, not a per-custodian one: re-using APN-2693-161 under a DIFFERENT custodian agency still returns HTTP 409 ERR_DUPLICATE_KEY, and no second Parcel row is created."
        test_recipe:
          setup:
            - "Two Agencies and one Parcel with apn APN-2693-161 held by the first agency."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend County Public Works", agency_type: "COUNTY", contact_email: "pw@riverbendcounty.gov" }
              as: SystemAdministrator
              captures: { other_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-161", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
          trigger:
            - call: "POST /parcels"
              payload: { apn: "APN-2693-161", address: "44 Depot Lane", acreage: 1.4, zoning_code: "C-2", book_value_cents: 30000000, custodian_agency_id: "${other_agency_id}" }
              as: RealPropertyOfficer
          assert:
            - "the response status is HTTP 409 and data.error_id == ERR_DUPLICATE_KEY"
            - "GET /parcels returns total_count == 1 and the surviving row is ${parcel_id} with address 9 Canal Street"
            - "Parcel.${parcel_id}.custodian_agency_id == ${cust_agency_id} and version is still 1"

      - name: second_active_declaration_on_same_parcel_rejected_then_allowed_after_withdrawal
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=12]
          - state_machines.SurplusDeclaration.DRAFT_to_WITHDRAWN
          - errors[ERR_DUPLICATE_ACTIVE_DECLARATION]
        distinguishing_aspect: "The uniqueness rule is scoped to non-terminal declarations, so it flips from violated to satisfied without deleting anything: a second declaration on the parcel is HTTP 409 ERR_DUPLICATE_ACTIVE_DECLARATION while the first is DRAFT, and the SAME payload succeeds with 201 once the first is WITHDRAWN - leaving two declaration rows on one parcel, one WITHDRAWN and one DRAFT."
        test_recipe:
          setup:
            - "One Agency, one Parcel and one DRAFT declaration on that parcel."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-162", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_1_id: "$.data.id" }
          trigger:
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Superseding declaration with a corrected legal description." }
              as: RealPropertyOfficer
            - call: "POST /declarations/${decl_1_id}/withdraw"
              payload: { withdrawn_reason: "Legal description was wrong on the first resolution packet" }
              as: BoardClerk
              as_user_id: "clerk-authorize-1"
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Superseding declaration with a corrected legal description." }
              as: RealPropertyOfficer
              captures: { decl_2_id: "$.data.id" }
          assert:
            - "the first retry is HTTP 409 with data.error_id == ERR_DUPLICATE_ACTIVE_DECLARATION"
            - "the withdraw response is HTTP 200 with data.status == WITHDRAWN"
            - "the second retry is HTTP 201 with data.status == DRAFT and data.parcel_id == ${parcel_id}"
            - "GET /declarations filtered by parcel_id ${parcel_id} returns total_count == 2"
            - "SurplusDeclaration.${decl_1_id}.status == WITHDRAWN and SurplusDeclaration.${decl_2_id}.status == DRAFT"

