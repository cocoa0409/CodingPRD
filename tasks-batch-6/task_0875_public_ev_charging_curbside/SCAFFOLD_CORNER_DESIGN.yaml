            - { call: "GET /stations/${stn_id}", payload: {}, as: ProgramAdmin, captures: { stn_v: "$.data.version" } }
            - { call: "POST /rebate-claims", payload: { station_id: "${stn_id}", grant_id: "${grant_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", reported_energy_kwh: 1000, reported_uptime_pct: 97.0, expected_station_version: "${stn_v}" }, as: ProgramAdmin, captures: { claim1_id: "$.data.id" } }
          trigger:
