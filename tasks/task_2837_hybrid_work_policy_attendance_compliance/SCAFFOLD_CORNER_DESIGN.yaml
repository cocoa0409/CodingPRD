              payload: { employee_id: "${e1_id}", jurisdiction_code: "IE", data_classification_tier: "CONFIDENTIAL", proposed_start_date: "2026-10-01" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { rl_id: $.data.id }
            - call: "POST /remote-location-requests/${rl_id}/tax-review"
              payload: { review_outcome: "CLEARED", licensing_gap_count: 5, tax_nexus_registration_cost_cents: 3000000 }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /remote-location-requests/${rl_id}/security-review"
              payload: { review_outcome: "BLOCKED", control_gap_count: 4 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /remote-location-requests/${rl_id}/decide"
