            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              captures: { plan_v_before: $.data.version }
          trigger:
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "approved for buy" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "GET /otb/option-plans/${op1_id}/size-curve-cells"
              payload: {}
              as: MerchandisePlanner
          assert:
            - "before the trigger: CategoryPlan.${plan_id}.receipt_budget_cents == 0, PlanMonth.${m1_id}.status == DRAFT with otb_planned_cents == 0, OptionPlan.${op1_id}.status == OPEN with option_slots_total == null, option_slots_open == null and target_units_per_option == null - none of the five link outputs exists yet (the PUT already persisted per-cell raw_units_x10000 and allocated_units for its own zero-cell check, but it wrote no OptionPlan slot or target field)"
            - "LINK 1: CategoryPlan.${plan_id}.status == APPROVED, approved_by_user_id == director-1, receipt_budget_cents == 60000000, which is min(dept_cap 60000000, max(role_cap 67500000, turn_cap 63281250)) over cost of goods 67500000"
            - "LINK 2 (caused by link 1): PlanMonth.${m1_id}.status == LOCKED_PLAN with provisional_sell_through_bps == 6750, reserve_rate_bps == 350, markdown_reserve_cents == 700000, otb_planned_cents == 18200000, otb_committed_cents == 0, otb_received_cents == 0, otb_open_cents == 18200000"
            - "LINK 2 (caused by link 1): PlanMonth.${m2_id}.status == LOCKED_PLAN with provisional_sell_through_bps == 7364, reserve_rate_bps == 350, markdown_reserve_cents == 770000, otb_planned_cents == 21970000, otb_open_cents == 21970000"
            - "LINK 3 (caused by link 2): CategoryPlan.${plan_id}.open_ratio_bps == 10000 (open 40170000 over planned 40170000) and otb_posture == OPEN - link 3 could not run before link 2 wrote otb_open_cents, since a plan with no LOCKED_PLAN month has no denominator"
            - "LINK 4 (caused by link 3 and link 1): OptionPlan.${op1_id}.status == SLOTTED with option_slots_total == 14, option_slots_assigned == 0, option_slots_open == 14 - tier share 21000000 (60000000 * 3500 / 10000), cluster share 24150000 (21000000 * 11500 / 10000), cost per option 576000 (6 * 40 * 2400), affordable 41, capped by breadth_target 14"
            - "LINK 5 (caused by link 4): OptionPlan.${op1_id}.target_units_per_option == 276 - null until link 4 slotted the cell - and the five SizeCurveCell rows carry raw_units_x10000 220800 / 607200 / 938400 / 717600 / 276000 and allocated_units 21 / 61 / 94 / 72 / 28 for XS / S / M / L / XL"
            - "LINK 5 (caused by link 4): sum(allocated_units) == 276 == OptionPlan.${op1_id}.target_units_per_option exactly, even though the naive per-cell rounding sums to 277 and the -1 remainder was taken from XS, whose fractional part 0.0800 is the smallest"
            - "the whole chain is one request: the response to the approve call already reflects links 1 through 5, per the immediate consistency model, and CategoryPlan.${plan_id}.version is strictly greater than ${plan_v_before}"
            - "causal ordering is observable: OptionPlan.${op1_id}.option_slots_total is derived from link 1's 60000000 budget, so had link 1 produced a different budget the link 4 and link 5 outputs would differ; and had link 3 produced FROZEN, link 4 would have left OP1 OPEN with null slots - see cancel_cascade_release_to_deferred_restore for the FROZEN posture path"

      - name: cancel_cascade_release_to_deferred_restore
