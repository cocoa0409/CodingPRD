          assert:
            - "HTTP 400"
            - "error_id == ERR_VALIDATION"
            - "the follow-up list shows meta.total_count == 0 — nothing was persisted"

      - name: category_belonging_to_another_conference_is_a_mismatch
        claim_type: flat
        grounds:
          - validations[priority=14]
          - errors[ERR_CATEGORY_CONFERENCE_MISMATCH]
          - entities.SubmissionCategory.fields.conference_id
        distinguishing_aspect: |
          The topology is flat, so cross-reference integrity is a validation
          rather than a routing property: a category that exists but belongs to
          conference B is NOT a 404 (priority 5 passes - the row exists) and
          becomes the priority-14 ERR_CATEGORY_CONFERENCE_MISMATCH with HTTP
          422.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; two conferences exist: GOS26 (with category GEN) and HEM26 (with category HEM)."
            - "Both conferences are at CFA_OPEN and Author Ada exists."
