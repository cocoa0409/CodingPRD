      - name: corner_age_out_constant_clips_the_final_eligibility_window
        claim_type: Constants Applied
        grounds:
          - calculations.coe_eligibility_window
          - calculations.coe_eligibility_window.constants
          - state_machines.CertificateOfEligibility.SUBMITTED_to_APPROVED
          - entities.CertificateOfEligibility.fields.age_out_capped
          - entities.EligibilityTerm.fields.term_end_on
        distinguishing_aspect: "Both declared constants are exercised on one certificate: ELIGIBILITY_TERM_MONTHS 36 gives uncapped_end_on 2029-06-30 from residency 2026-07-01, and AGE_OUT_AGE 22 gives age_out_on 2029-05-19 for a student born 2007-05-20, so eligibility_end_on is the earlier 2029-05-19 with age_out_capped true - and that clipped date, not the 36-month date, is what the EligibilityTerm and the Student inherit."
