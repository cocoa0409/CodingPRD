            - "the matching participant returns 200 with assigned_participant_count == 1, accounting_liability_cents == 11460000, settlement_liability_cents == 12540000 and data_readiness_flag == BLOCKED (nothing is cleansed yet)"
            - "the repeat assignment returns 409 ERR_PARTICIPANT_ALREADY_ASSIGNED, not ERR_PARTICIPANT_PLAN_MISMATCH, because the participant_status check is evaluated first"
            - "ParticipantRecord.${a_dv}.participant_status == ASSIGNED with tranche_id == ${tranche_id}, and the three refusals left the RETIREE_IN_PAY and plan-B participants IN_PLAN with tranche_id null"

      - name: second_quote_request_to_the_same_insurer_is_rejected_until_the_first_is_terminal
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/prt/tranches/{id}/quotes
          - errors.ERR_DUPLICATE_QUOTE_REQUEST
          - state_machines.AnnuityQuote.REQUESTED_to_DECLINED
        distinguishing_aspect: |
          The uniqueness constraint is scoped to non-terminal quotes, so the same
          insurer may be re-approached once its previous quote is DECLINED. A naive
          unique index on (tranche_id, insurer_id) passes the 409 assertion and then
          fails the re-request, while an implementation with no constraint at all
          fails the first.
        test_recipe:
          setup:
            - "a plan authorized BUYOUT_ONLY with an ENGAGED expert, one cleansed RETIREE_IN_PAY participant assigned to a QUOTING tranche, and one ACTIVE insurer"
