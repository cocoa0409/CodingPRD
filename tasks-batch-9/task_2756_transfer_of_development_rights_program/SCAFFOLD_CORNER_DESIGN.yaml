          - validations.priority_16_design_approved_before_finalize
          - calculations.rights_ledger_identity
        distinguishing_aspect: "Release is conditional in both directions: it returns units to the certificate and to the receiving area's reserve, leaves the source easement's units_outstanding untouched (released units were never consumed), and only then — because the remaining backing falls below required_backing_units — pushes the application out of DESIGN_APPROVED into BACKING_DEFICIENT, where finalization is refused."
