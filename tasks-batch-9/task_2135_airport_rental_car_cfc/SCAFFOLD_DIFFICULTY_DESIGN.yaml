              payload: {}
              as: FacilityAdmin
              captures: { agr_v1: $.data.version }
            - call: "POST /rac/counter-spaces"
              payload: { facility_id: "${fac_id}", terminal_code: "T1", space_label: "T1-A02", space_class: "COUNTER" }
              as: FacilityAdmin
              captures: { cs_id: $.data.id }
            - call: "POST /rac/counter-assignments"
              payload: { agreement_id: "${agr_a_id}", counter_space_id: "${cs_id}", effective_start_date: "2026-02-01", effective_end_date: "2026-05-01", expected_agreement_version: "${agr_v1}" }
