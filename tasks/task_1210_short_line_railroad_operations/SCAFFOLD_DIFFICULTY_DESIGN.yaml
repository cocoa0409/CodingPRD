            - call: "POST /rail/crew-members/${memB_id}/adjust-hos"
              payload: { rolling_24h_minutes: 720, expected_crew_member_version: "${memB_v}" }
              as: CrewCaller
          trigger:
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${memA_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-03T06:00:00Z", scheduled_end_at: "2026-05-03T18:00:00Z" }
              as: CrewCaller
              captures: { callA_id: $.data.id }
            - call: "POST /rail/crew-calls"
