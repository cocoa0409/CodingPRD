              payload: { visit_id: "${visit2}", line_id: "${line1}", chemical_lot_id: "${lot_acid}", chemical_type: "ACID", contact_minutes: 15, recirculation_temp_f: 80.0, concentrate_liters_used: 0.23 }
              as: ServiceTechnician
