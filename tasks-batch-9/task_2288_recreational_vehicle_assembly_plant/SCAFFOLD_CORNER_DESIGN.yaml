        distinguishing_aspect: "The dealer-level aggregate always equals the row-level sum: two funded units give financed_exposure_cents 11916630 == 5958315 + 5958315 at 1191 bp, and a 1000000 cent payment on one order drops the aggregate to 10916630 at 1091 bp — never to a stale 11916630."
