# =============================================================================
# task_2270 — Cruise Shore Excursion Operations
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# 9 rule_ids from §0.5 / 25 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only; deleting this file
# leaves the declared behavior identical.
#
# Logical clock default: 2026-08-01T00:00:00Z (SCAFFOLD.yaml logical_clock).
# Shared fixture instants: port call arrival 2026-09-15T08:00:00Z,
# all_aboard 2026-09-15T16:30:00Z, departure 2026-09-15T17:00:00Z,
# departure meeting_time 2026-09-15T09:00:00Z, tender wave W1 window
# 2026-09-15T08:30:00Z .. 2026-09-15T08:50:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: timing_risk_scheduled_green_versus_actual_red_on_the_same_departure
        grounds:
          - calculations.departure_timing_risk
          - entities.ExcursionDeparture.fields.slack_minutes_scheduled
          - entities.ExcursionDeparture.fields.slack_minutes_actual
          - entities.ExcursionDeparture.fields.timing_risk_band_scheduled
          - entities.ExcursionDeparture.fields.timing_risk_band_actual
          - entities.PortCall.fields.delay_minutes
          - state_machines.ExcursionDeparture.SELLING_to_CLOSED
        distinguishing_aspect: |
          This dual-variant pair operates on the ExcursionDeparture timing domain: the identical
          departure row carries slack_minutes_scheduled 65 / GREEN and slack_minutes_actual 0 / RED
          at the same instant, because SCHEDULED_BASIS anchors on meeting_time_utc while ACTUAL_BASIS
          anchors on the delayed tender wave landing.
        test_recipe:
          setup:
            - "Nassau is a TENDER port with risk_buffer_minutes 30 and tender_egress_minutes 25."
            - "One APPROVED operator owns one PUBLISHED 300-minute excursion."
            - "Port call V2609 is OPEN_FOR_SALE with delay_minutes 0 and one EXCURSION_PRIORITY tender wave W1 ending 08:50Z."
            - "One ExcursionDeparture is SELLING, meeting 09:00Z, dwell 20, capacity 40 (25 pre-cruise / 15 onboard), assigned to W1, no bookings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "NASS", name: "Nassau", country_code: "BS", docking_mode: "TENDER", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/ports/${port_id}/meeting-points"
              payload: { name: "Pier Apron A", zone: "PIER_APRON", max_concurrent_groups: 4, slot_buffer_minutes: 10 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { mp_id: $.data.id }
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Blue Lagoon Tours", contact_email: "ops@blt.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 1800 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-07-20T00:00:00Z", raw_score: 82, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "SUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "APPROVE" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/excursions"
              payload: { port_id: "${port_id}", operator_id: "${op_id}", title: "Blue Lagoon Snorkel", duration_minutes: 300, min_age: 18, mobility_level: "LEVEL_2", languages: ["EN", "ES"], base_price_cents: 12000, price_tier: "PREMIUM", is_line_operated: true }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { exc_id: $.data.id }
            - call: "POST /shore-excursions/excursions/${exc_id}/catalog-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "POST /shore-excursions/excursions/${exc_id}/catalog-actions"
              payload: { action: "PUBLISH" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "POST /shore-excursions/port-calls"
              payload: { port_id: "${port_id}", voyage_code: "V2609", ship_code: "MS-AURORA", arrival_utc: "2026-09-15T08:00:00Z", all_aboard_utc: "2026-09-15T16:30:00Z", departure_utc: "2026-09-15T17:00:00Z" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { pc_id: $.data.id }
            - call: "POST /shore-excursions/port-calls/${pc_id}/tender-waves"
              payload: { wave_index: 1, window_start_utc: "2026-09-15T08:30:00Z", window_end_utc: "2026-09-15T08:50:00Z", guest_capacity: 100, priority_class: "EXCURSION_PRIORITY" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { wave1_id: $.data.id }
            - call: "POST /shore-excursions/port-calls/${pc_id}/transitions"
              payload: { action: "OPEN_SALES" }
              as: PortAgent
              as_user_id: "u_agent_1"
            - call: "POST /shore-excursions/departures"
              payload: { excursion_id: "${exc_id}", port_call_id: "${pc_id}", meeting_point_id: "${mp_id}", meeting_time_utc: "2026-09-15T09:00:00Z", dispatch_dwell_minutes: 20, total_capacity: 40, precruise_allocation: 25, onboard_allocation: 15 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { dep_id: $.data.id }
            - call: "POST /shore-excursions/departures/${dep_id}/tender-assignment"
              payload: {}
              as: PortAgent
              as_user_id: "u_agent_1"
          trigger:
            - call: "POST /shore-excursions/port-calls/${pc_id}/delays"
              payload: { additional_delay_minutes: 75, reason_code: "PILOT_DELAY" }
              as: PortAgent
              as_user_id: "u_agent_1"
          assert:
            - "PortCall.${pc_id}.delay_minutes == 75"
            - "PortCall.${pc_id}.effective_arrival_utc == 2026-09-15T09:15:00Z"
            - "ExcursionDeparture.${dep_id}.projected_return_scheduled_utc == 2026-09-15T14:55:00Z"
            - "ExcursionDeparture.${dep_id}.slack_minutes_scheduled == 65"
            - "ExcursionDeparture.${dep_id}.timing_risk_band_scheduled == GREEN"
            - "ExcursionDeparture.${dep_id}.projected_return_actual_utc == 2026-09-15T16:00:00Z"
            - "ExcursionDeparture.${dep_id}.slack_minutes_actual == 0"
            - "ExcursionDeparture.${dep_id}.timing_risk_band_actual == RED"
            - "ExcursionDeparture.${dep_id}.meeting_time_utc == 2026-09-15T09:00:00Z (unchanged by the delay)"
            - "ExcursionDeparture.${dep_id}.status == CLOSED"

      - name: commission_provisional_versus_final_on_the_same_three_booking_lines
        grounds:
          - calculations.operator_commission_accrual
          - calculations.statement_net_payable
          - entities.CommissionStatement.fields.line_commission_cents
          - entities.CommissionStatement.fields.booking_line_count
          - entities.Booking.fields.commission_accrued_cents
          - concurrency_rules[statement-create-stale-operator]
        distinguishing_aspect: |
          This dual-variant pair operates on the operator-settlement money domain (a different entity
          domain from the ExcursionDeparture timing pair): the same three booking lines yield
          line_commission_cents 26193 on the PROVISIONAL basis and 11156 on the FINAL basis, because
          PROVISIONAL filters on financial_status while FINAL filters on fulfillment_status and applies
          the 500 bps no-show floor.
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port with risk_buffer_minutes 30."
            - "One APPROVED operator with commission_rate_bps 1800 owns one PUBLISHED 300-minute excursion at base_price_cents 12000 / PREMIUM."
            - "Port call V2609 is OPEN_FOR_SALE; one SELLING departure meets 09:00Z with capacity 40 (25/15)."
            - "Three GOLD guests each hold a PRE_CRUISE booking of party_size 4 quoted 48508 / fee 1455 / charge 49963, all TICKETED and CHARGED."
            - "A PROVISIONAL CommissionStatement has already been drafted over those three CHARGED lines."
            - "Booking C is then guest-cancelled 4319 minutes before the meeting (refunded 36381), booking A completes and booking B no-shows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
