  # ===========================================================================
  # SECTION 6 — errors
  # ===========================================================================
  - section: errors
    instances:

      - name: every_path_parameter_404_uses_its_own_entity_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors[ERR_DISTRIBUTOR_NOT_FOUND]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_FINDING_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_BLACKOUT_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_MFN_CLAUSE_NOT_FOUND]
          - errors[ERR_ANALYSIS_NOT_FOUND]
          - errors[ERR_RATE_CARD_ENTRY_NOT_FOUND]
        distinguishing_aspect: >-
          Priority 10 never collapses into a generic 404: on an empty database the
          same synthetic id produces a DIFFERENT error_id for each collection —
          ERR_DISTRIBUTOR_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_REPORT_NOT_FOUND,
          ERR_ENGAGEMENT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_TITLE_NOT_FOUND,
          ERR_WINDOW_NOT_FOUND, ERR_BLACKOUT_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND,
          ERR_INVOICE_NOT_FOUND, ERR_MFN_CLAUSE_NOT_FOUND, ERR_ANALYSIS_NOT_FOUND and
          ERR_RATE_CARD_ENTRY_NOT_FOUND — thirteen distinct codes for one id.
        test_recipe:
          setup:
            - "Completely empty database; the clock is untouched. Every id below is the same non-existent UUID."
          setup_api_calls: []
          trigger:
            - call: "GET /carriage/distributors/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "GET /carriage/agreements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "GET /carriage/subscriber-reports/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "GET /carriage/audit-engagements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "GET /carriage/audit-findings/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "GET /carriage/content-titles/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "GET /carriage/rights-windows/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "GET /carriage/blackout-rules/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "GET /carriage/marketing-commitments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "GET /carriage/invoices/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "GET /carriage/mfn-clauses/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "GET /carriage/renewal-analyses/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: AffiliateSalesExec
