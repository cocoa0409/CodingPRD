            - "Facility.${fac_id}.prepaid_credit_cents == 0 and fee_held_cents == 0 and fee_consumed_cents == 0"
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 3"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: survey_phantom_score_and_dose_pass_exactly_on_their_boundaries
        grounds:
          - calculations.survey_pass_determination
          - state_machines.PhysicistSurvey.status.DRAFT_to_PASSED
          - state_machines.PhysicistSurvey.status.DRAFT_to_FAILED_ACTION_REQUIRED
        distinguishing_aspect: |
          METRIC — phantom image score against PHANTOM_MIN_SCORE 6.0 (inclusive
          `>=`) and mean glandular dose against MAX_MEAN_GLANDULAR_DOSE_MGY 3.0
          (inclusive `<=`), exercised on ENDPOINT
          POST /physicist-surveys/{id}/submit. Exactly 6.0 with exactly 3.00
          passes (both comparisons are inclusive, so the boundary belongs to the
          passing side), while 5.9 with the same 3.00 dose fails — proving the
          dose ceiling is inclusive and the score floor is not `>`.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "Two DRAFT surveys on the same unit with the same window [2026-07-01, 2027-07-01) but different survey_type (ANNUAL and MOBILE), which the per-survey_type exclusivity rule permits."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-07-01T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { bnd_annual_id: $.data.id }
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "MOBILE", effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-07-01T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { bnd_mobile_id: $.data.id }
          trigger:
            - call: "POST /physicist-surveys/${bnd_annual_id}/submit"
              payload: { phantom_score: 6.0, mean_glandular_dose_mgy: 3.00, outcome_note: "Score exactly at the minimum, dose exactly at the ceiling" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
            - call: "POST /physicist-surveys/${bnd_mobile_id}/submit"
              payload: { phantom_score: 5.9, mean_glandular_dose_mgy: 3.00, outcome_note: "Score one tenth below the minimum" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
          assert:
            - "PhysicistSurvey.${bnd_annual_id}.status == PASSED (6.0 >= 6.0 and 3.00 <= 3.00 are both satisfied on the boundary)"
            - "PhysicistSurvey.${bnd_mobile_id}.status == FAILED_ACTION_REQUIRED (5.9 < 6.0)"
            - "PhysicistSurvey.${bnd_mobile_id}.remediation_attempts == 0"
            - "MammographyUnit.${unit_id}.survey_compliance == FAILED (the later failing decision governs)"
            - "MammographyUnit.${unit_id}.accreditation_status == PROBATION"
            - "MammographyUnit.${unit_id}.operational_state == IN_SERVICE (no critical deficiency codes were reported, so the unit is not withdrawn from service)"
            - "MammographyUnit.${unit_id}.last_passed_survey_end == \"2027-07-01T00:00:00Z\" (recorded by the passing ANNUAL survey and not erased by the later failure)"

      - name: read_volume_credit_on_the_exact_lookback_left_edge_still_counts
        grounds:
          - calculations.ce_and_volume_compliance
          - state_machines.Personnel.ce_status.COMPLIANT_to_GRACE
          - entities.Personnel.fields.volume_credit_24mo
        distinguishing_aspect: |
          METRIC — the 730-day read-volume lookback window's left edge (a
          temporal boundary, not a numeric score), exercised on the distinct
          ENDPOINT POST /personnel/{id}/qualification-reviews. A READ_VOLUME
          credit awarded exactly at clock minus 730 days (2024-08-01T00:00:00Z)
          is inside the closed window and keeps the technologist COMPLIANT, while
          an otherwise identical credit awarded one day earlier
          (2024-07-31T00:00:00Z) falls outside and drops that technologist to
          GRACE. The continuing CE hours are pinned at exactly the 15.00-hour
          threshold for both so the only variable is the date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so the 730-day volume lookback opens at 2024-08-01T00:00:00Z and the 1095-day CE lookback opens at 2023-08-02T00:00:00Z."
            - "CT policy (ce_grace_days 90), facility, one DBT_3D unit, and two QUALIFIED technologists."
            - "Each technologist has one CATEGORY_1_CE credit of exactly 15 hours awarded 2026-01-01 (meeting the 15.00-hour continuing threshold exactly)."
            - "Technologist A has a READ_VOLUME credit of exactly 200 exams awarded exactly on the left edge 2024-08-01T00:00:00Z; technologist B has the same 200-exam credit awarded 2024-07-31T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - &c_tech2
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Tara Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-15T00:00:00Z", initial_training_hours: 45, initial_read_volume: 30, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { tech2_id: $.data.id }
            - call: "POST /personnel/${tech_id}/credits"
              payload: { credit_type: "CATEGORY_1_CE", awarded_on: "2026-01-01T00:00:00Z", ce_hours: 15, source_note: "Digital breast tomosynthesis refresher" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /personnel/${tech_id}/credits"
              payload: { credit_type: "READ_VOLUME", awarded_on: "2024-08-01T00:00:00Z", exam_count: 200, modality: "DBT_3D", source_note: "Credit posted exactly on the lookback edge" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /personnel/${tech2_id}/credits"
              payload: { credit_type: "CATEGORY_1_CE", awarded_on: "2026-01-01T00:00:00Z", ce_hours: 15, source_note: "Digital breast tomosynthesis refresher" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /personnel/${tech2_id}/credits"
              payload: { credit_type: "READ_VOLUME", awarded_on: "2024-07-31T00:00:00Z", exam_count: 200, modality: "DBT_3D", source_note: "Credit posted one day before the lookback edge" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /personnel/${tech_id}/qualification-reviews"
              payload: { review_note: "Edge-inclusive volume credit" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /personnel/${tech2_id}/qualification-reviews"
              payload: { review_note: "Volume credit one day stale" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Personnel.${tech_id}.volume_credit_24mo == 200 (the credit dated exactly 2024-08-01 is inside the closed lookback)"
            - "Personnel.${tech_id}.ce_hours_36mo == 15.00"
            - "Personnel.${tech_id}.ce_status == COMPLIANT"
            - "Personnel.${tech_id}.ce_deadline_at == null"
            - "Personnel.${tech2_id}.volume_credit_24mo == 0 (the credit dated 2024-07-31 is outside the lookback)"
            - "Personnel.${tech2_id}.ce_hours_36mo == 15.00"
            - "Personnel.${tech2_id}.ce_status == GRACE"
            - "Personnel.${tech2_id}.ce_deadline_at == \"2026-10-30T00:00:00Z\" (clock plus the CT policy's 90 grace days)"
            - "Personnel.${tech2_id}.qualification_status == QUALIFIED (a continuing-education shortfall alone never revokes the qualification dimension)"
            - "Both Personnel rows have last_qualification_review_at == \"2026-08-01T00:00:00Z\""

      - name: unit_repeat_rates_are_null_on_an_empty_ledger_and_zero_once_imaged
        grounds:
          - calculations.unit_repeat_rate
          - entities.MammographyUnit.fields.image_based_repeat_rate_pct
          - entities.MammographyUnit.fields.repeat_rate_flag
        distinguishing_aspect: |
          METRIC — the empty-denominator edge of the repeat-rate percentages
          (division by an image ledger of zero), read on the distinct ENDPOINT
          GET /units/{id}. A unit with no exams reports null rather than 0.00,
          and the very first imaged exam with no repeats flips the same fields to
          0.00 — the two are different values and must not be conflated, while
          the 5.00 percent flag stays false in both readings because the flag
          uses a strict `>`.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit with no exams at all, qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9501", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { edge_exam_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "First read — MammographyUnit.${unit_id}.total_images_acquired == 0 and repeat_images_acquired == 0"
            - "First read — MammographyUnit.${unit_id}.image_based_repeat_rate_pct == null (empty ledger, not 0.00)"
            - "First read — MammographyUnit.${unit_id}.patient_based_repeat_rate_pct == null"
            - "First read — MammographyUnit.${unit_id}.repeat_rate_flag == false"
            - "Second read — MammographyUnit.${unit_id}.total_images_acquired == 4 and repeat_images_acquired == 0"
            - "Second read — MammographyUnit.${unit_id}.image_based_repeat_rate_pct == 0.00 (a real zero rate, distinct from the null above)"
            - "Second read — MammographyUnit.${unit_id}.patient_based_repeat_rate_pct == 0.00"
            - "Second read — MammographyUnit.${unit_id}.repeat_rate_flag == false (0.00 is not strictly greater than 5.00)"
            - "Exam.${edge_exam_id}.repeat_image_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: unit_restore_blocked_until_a_post_repair_survey_passes
        grounds:
          - validations[priority=55]
          - errors[ERR_POST_REPAIR_SURVEY_MISSING]
          - state_machines.EquipmentFailureEvent.status.OPEN_to_REPAIR_VERIFIED
          - state_machines.MammographyUnit.operational_state.OUT_OF_SERVICE_to_IN_SERVICE
          - calculations.survey_pass_determination
        distinguishing_aspect: |
          ENTITY PAIR (EquipmentFailureEvent, PhysicistSurvey) — the failure
          event's own transition to REPAIR_VERIFIED is gated on the state of a
          different entity that is not its parent: a PASSED PhysicistSurvey of
          type POST_REPAIR whose window opens at or after detected_at. The same
          restore call is rejected with 409 before that survey exists and
          accepted afterwards, with nothing else changed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "A CRITICAL DETECTOR failure detected 2026-07-30, so the event is OPEN with requires_post_repair_survey true, the unit is OUT_OF_SERVICE and the facility posture is SUSPENDED."
            - "No PhysicistSurvey of any type exists on the unit yet."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_crit_failure
          trigger:
            - call: "POST /equipment-failures/${crit_fail_id}/restore"
              payload: { repair_note: "Detector module swapped, no physics survey yet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "POST_REPAIR", effective_start: "2026-07-31T00:00:00Z", effective_end: "2026-08-31T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { pr_survey_id: $.data.id }
            - call: "POST /physicist-surveys/${pr_survey_id}/submit"
              payload: { phantom_score: 6.5, mean_glandular_dose_mgy: 2.50, outcome_note: "Replacement detector meets all limits" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
            - call: "POST /equipment-failures/${crit_fail_id}/restore"
              payload: { repair_note: "Detector module swapped, post-repair survey passed" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "First restore — HTTP status == 409 and error_id == \"ERR_POST_REPAIR_SURVEY_MISSING\""
            - "After the first restore — EquipmentFailureEvent.${crit_fail_id}.status == OPEN and resolved_at == null"
            - "After the first restore — MammographyUnit.${unit_id}.operational_state == OUT_OF_SERVICE"
            - "PhysicistSurvey.${pr_survey_id}.status == PASSED and survey_type == POST_REPAIR"
            - "Second restore — HTTP status == 200"
            - "EquipmentFailureEvent.${crit_fail_id}.status == REPAIR_VERIFIED and resolved_at == \"2026-08-01T00:00:00Z\""
            - "MammographyUnit.${unit_id}.operational_state == IN_SERVICE"
            - "MammographyUnit.${unit_id}.survey_compliance == CURRENT and last_passed_survey_end == \"2026-08-31T00:00:00Z\""
            - "Facility.${fac_id}.compliance_posture == COMPLIANT (the unit is back in service with a current survey)"

      - name: supplemental_scheduling_blocked_while_the_facility_posture_is_suspended
        grounds:
          - validations[priority=42]
          - errors[ERR_FACILITY_SUSPENDED]
          - state_machines.AnnualInspection.status.CORRECTIVE_ACTION_REQUIRED_to_CLOSED
          - state_machines.SupplementalScreeningOrder.status.COVERAGE_DETERMINED_to_SCHEDULED
          - calculations.facility_compliance_posture
          - calculations.supplemental_appointment_occupancy
        distinguishing_aspect: |
          ENTITY PAIR (SupplementalScreeningOrder, Facility) — a different pair
          from the failure/survey dependency: the order's own transition to
          SCHEDULED is gated on its grandparent facility's derived
          compliance_posture. The identical schedule call is rejected while an
          open LEVEL_1 inspection holds the posture at SUSPENDED and succeeds
          once that inspection is closed and the posture recomputes to
          CONDITIONAL. The inspection is recorded before the order exists, so the
          suspension cascade never refers the order out and priority 42 is
          genuinely the deciding rule rather than a state error at priority 40.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility with supplemental_concurrent_capacity 2, one DBT_3D unit, qualified staff."
            - "A LEVEL_1 FDA inspection dated 2026-07-28 is recorded FIRST, holding the posture at SUSPENDED while no supplemental orders exist."
            - "Then one SCREENING exam is interpreted BI-RADS 0 with density C, and an ULTRASOUND supplemental order on it reaches COVERAGE_DETERMINED."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_lv1_inspection
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9601", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-29T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { susp_exam_id: $.data.id }
            - call: "POST /exams/${susp_exam_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${susp_exam_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense tissue, recall workup" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { susp_order_id: $.data.id }
            - call: "POST /supplemental-orders/${susp_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /supplemental-orders/${susp_order_id}/schedule"
              payload: { appointment_start: "2026-08-10T09:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /inspections/${lv1_insp_id}/close"
              payload: { closure_note: "Corrective action verified on site" }
              as: FdaInspector
              as_user_id: "inspector-1"
            - call: "POST /supplemental-orders/${susp_order_id}/schedule"
              payload: { appointment_start: "2026-08-10T09:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "First schedule — HTTP status == 409 and error_id == \"ERR_FACILITY_SUSPENDED\""
            - "After the first schedule — SupplementalScreeningOrder.${susp_order_id}.status == COVERAGE_DETERMINED and appointment_start == null"
            - "AnnualInspection.${lv1_insp_id}.status == CLOSED after the close call"
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL (the unit's survey_compliance is still OVERDUE, so the posture does not return all the way to COMPLIANT)"
            - "Second schedule — HTTP status == 200"
            - "SupplementalScreeningOrder.${susp_order_id}.status == SCHEDULED"
            - "SupplementalScreeningOrder.${susp_order_id}.appointment_start == \"2026-08-10T09:00:00Z\" and appointment_end == \"2026-08-10T09:30:00Z\""
            - "SupplementalScreeningOrder.${susp_order_id}.coverage_outcome == COVERED_NO_COST_SHARE"
            - "Exam.${susp_exam_id}.follow_up_status == PENDING"

      - name: packet_submission_requires_every_cited_exam_to_be_interpreted_final
        grounds:
          - validations[priority=57]
          - errors[ERR_PACKET_EXAM_NOT_FINAL]
          - state_machines.Exam.report_status.AWAITING_INTERPRETATION_to_INTERPRETED_FINAL
          - entities.ClinicalImageReviewSubmission.fields.status
          - calculations.fee_escrow_ledger
        distinguishing_aspect: |
          ENTITY PAIR (ClinicalImageReviewSubmission, Exam) — a third distinct
          pair: creating the submission is gated on the report_status of every
          Exam it cites, a many-to-many set rather than a single parent. The same
          two-exam packet is rejected with 422 while the exams are
          AWAITING_INTERPRETATION and accepted once both reach
          INTERPRETED_FINAL, and the rejected attempt escrows nothing.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility funded with 1000000 cents, one DBT_3D unit, qualified staff."
            - "Two acquired SCREENING exams on the unit that have NOT been interpreted, so both sit in report_status AWAITING_INTERPRETATION."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_fund
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9701", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-25T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { nf_a_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9702", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-26T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { nf_b_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_u_v1: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${nf_a_id}", "${nf_b_id}"], expected_unit_version: "${nf_u_v1}", reviewer_note: "Packet built before the reads were finalized" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /exams/${nf_a_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${nf_b_id}/interpret"
              payload: { birads_assessment: 2, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_u_v2: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${nf_a_id}", "${nf_b_id}"], expected_unit_version: "${nf_u_v2}", reviewer_note: "Packet resubmitted after both reads were finalized" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_sub_id: $.data.id }
          assert:
            - "First submission attempt — HTTP status == 422 and error_id == \"ERR_PACKET_EXAM_NOT_FINAL\""
            - "After the rejected attempt — Facility.${fac_id}.prepaid_credit_cents == 1000000 and fee_held_cents == 0 and fee_consumed_cents == 0"
            - "After the rejected attempt — MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 3"
            - "Second submission attempt — HTTP status == 201"
            - "ClinicalImageReviewSubmission.${nf_sub_id}.status == SUBMITTED and attempt_number == 1"
            - "ClinicalImageReviewSubmission.${nf_sub_id}.fee_held_cents == 250000 and submitted_at == \"2026-08-01T00:00:00Z\""
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 2"
            - "Facility.${fac_id}.prepaid_credit_cents == 750000 and fee_held_cents == 250000 and fee_consumed_cents == 0"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: survey_windows_are_half_open_so_adjacent_windows_are_accepted
        grounds:
          - calculations.survey_window_exclusivity
          - validations[priority=62]
          - errors[ERR_SURVEY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          INTERVAL SEMANTICS — half-open [start, end): a window that begins at
          the exact instant a prior window ends does NOT collide, so back-to-back
          annual survey windows are both accepted, while a window that starts one
          day before the incumbent's end does collide. RESOURCE ENTITY —
          MammographyUnit, with capacity 1 per survey_type (pairwise
          exclusivity), not an aggregate counter.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "One ANNUAL survey already occupies the window [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z)."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2026-07-01T00:00:00Z", effective_end: "2026-08-01T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { ov_a_id: $.data.id }
          trigger:
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-07-01T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { ov_b_id: $.data.id }
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2027-06-30T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
          assert:
            - "Adjacent window — HTTP status == 201 and PhysicistSurvey.${ov_b_id}.status == DRAFT"
            - "PhysicistSurvey.${ov_b_id}.effective_start == \"2026-08-01T00:00:00Z\" (touching the incumbent's exclusive end instant is allowed)"
            - "PhysicistSurvey.${ov_b_id}.effective_end == \"2027-07-01T00:00:00Z\" (334 days, within the 396-day maximum)"
            - "Overlapping window — HTTP status == 409 and error_id == \"ERR_SURVEY_WINDOW_OVERLAP\""
            - "Overlapping window — error_id != \"ERR_SURVEY_WINDOW_INVALID\" (the window itself is well formed and inside the 396-day cap)"
            - "GET /units/${unit_id}/physicist-surveys returns total_count == 2 — the third window created nothing"
            - "MammographyUnit.${unit_id}.survey_compliance == OVERDUE (no survey has been submitted, so no window is proven)"

      - name: supplemental_appointments_use_closed_occupancy_against_facility_capacity
        grounds:
          - calculations.supplemental_appointment_occupancy
          - validations[priority=77]
          - errors[ERR_SUPPLEMENTAL_CAPACITY_CONFLICT]
          - entities.Facility.fields.supplemental_concurrent_capacity
        distinguishing_aspect: |
          INTERVAL SEMANTICS — closed [start, end + 15 minutes turnover] on both
          ends, the opposite convention from the half-open survey windows: an
          appointment that starts at the exact instant a prior appointment's
          turnover ends DOES collide. RESOURCE ENTITY — Facility, and the limit
          is an aggregate capacity of 2 concurrent appointments rather than
          pairwise exclusivity, so the first overlap is accepted and only the
          second is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy (COVERAGE_NO_COST_SHARING), facility with supplemental_concurrent_capacity 2, one DBT_3D unit, qualified staff."
            - "Three different patients each have a SCREENING exam interpreted BI-RADS 0 with density C and an ULTRASOUND supplemental order in COVERAGE_DETERMINED."
            - "Each ULTRASOUND appointment occupies its start plus 30 minutes of procedure plus 15 minutes of turnover, so a 09:00 start occupies [09:00, 09:45]."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9801", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-27T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { cap_e1_id: $.data.id }
            - call: "POST /exams/${cap_e1_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${cap_e1_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense tissue workup" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { cap_o1_id: $.data.id }
            - call: "POST /supplemental-orders/${cap_o1_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9802", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-27T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { cap_e2_id: $.data.id }
            - call: "POST /exams/${cap_e2_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${cap_e2_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense tissue workup" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { cap_o2_id: $.data.id }
            - call: "POST /supplemental-orders/${cap_o2_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9803", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-27T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { cap_e3_id: $.data.id }
            - call: "POST /exams/${cap_e3_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${cap_e3_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense tissue workup" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { cap_o3_id: $.data.id }
            - call: "POST /supplemental-orders/${cap_o3_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /supplemental-orders/${cap_o1_id}/schedule"
              payload: { appointment_start: "2026-08-10T09:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${cap_o2_id}/schedule"
              payload: { appointment_start: "2026-08-10T09:30:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${cap_o3_id}/schedule"
              payload: { appointment_start: "2026-08-10T09:45:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${cap_o3_id}/schedule"
              payload: { appointment_start: "2026-08-10T09:46:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "First schedule — HTTP status == 200 and SupplementalScreeningOrder.${cap_o1_id}.status == SCHEDULED with appointment_end == \"2026-08-10T09:30:00Z\""
            - "Second schedule — HTTP status == 200 (occupancy [09:30, 10:15] collides with only 1 existing appointment, which is under the capacity of 2)"
            - "SupplementalScreeningOrder.${cap_o2_id}.appointment_end == \"2026-08-10T10:00:00Z\""
            - "Third schedule at 09:45 — HTTP status == 409 and error_id == \"ERR_SUPPLEMENTAL_CAPACITY_CONFLICT\" (09:45 touches order 1's closed turnover end AND overlaps order 2, giving 2 collisions)"
            - "After the refusal — SupplementalScreeningOrder.${cap_o3_id}.status == COVERAGE_DETERMINED and appointment_start == null"
            - "Fourth schedule at 09:46 — HTTP status == 200 (order 1's occupancy ended at 09:45, so only 1 collision remains)"
            - "SupplementalScreeningOrder.${cap_o3_id}.status == SCHEDULED with appointment_start == \"2026-08-10T09:46:00Z\" and appointment_end == \"2026-08-10T10:16:00Z\""
            - "Exam.${cap_e3_id}.follow_up_status == PENDING"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: submission_withdrawal_restores_the_fee_ledger_identity_without_drift
        grounds:
          - calculations.fee_escrow_ledger
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_WITHDRAWN
          - entities.Facility.fields.fee_held_cents
          - entities.MammographyUnit.fields.reaccreditation_attempts_remaining
        distinguishing_aspect: |
          CONSERVED QUANTITY — money: the identity
          total_funded_cents == prepaid_credit_cents + fee_held_cents +
          fee_consumed_cents must hold before, during and after the escrow, and
          the withdrawal must move the held 250000 cents back to prepaid rather
          than minting or consuming it. The reaccreditation attempt counter is
          restored on the same compensating transition, so neither the money nor
          the attempt budget drifts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "A single funding deposit of 1000000 cents, so the ledger reads total_funded 1000000 / prepaid 1000000 / held 0 / consumed 0."
            - "Two interpreted exams on the unit and one SUBMITTED packet citing them, which escrows the 250000-cent application fee and consumes one reaccreditation attempt."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_fund
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9901", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { wd_a_id: $.data.id }
            - call: "POST /exams/${wd_a_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9902", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-21T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { wd_b_id: $.data.id }
            - call: "POST /exams/${wd_b_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { wd_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${wd_a_id}", "${wd_b_id}"], expected_unit_version: "${wd_u_v1}", reviewer_note: "Packet later withdrawn" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { wd_sub_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { wd_u_v2: $.data.version }
          trigger:
            - call: "POST /clinical-image-reviews/${wd_sub_id}/withdraw"
              payload: { expected_unit_version: "${wd_u_v2}", withdrawal_reason: "Better comparison images became available" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Before the withdrawal the escrowed ledger read total_funded 1000000 / prepaid 750000 / held 250000 / consumed 0, and 1000000 == 750000 + 250000 + 0"
            - "ClinicalImageReviewSubmission.${wd_sub_id}.status == WITHDRAWN"
            - "ClinicalImageReviewSubmission.${wd_sub_id}.fee_held_cents == 0"
            - "Facility.${fac_id}.total_funded_cents == 1000000 (unchanged — no money was minted)"
            - "Facility.${fac_id}.prepaid_credit_cents == 1000000 (the escrow returned in full)"
            - "Facility.${fac_id}.fee_held_cents == 0"
            - "Facility.${fac_id}.fee_consumed_cents == 0 (a withdrawal is a compensation, not a consumption)"
            - "Invariant after the trigger — 1000000 == 1000000 + 0 + 0"
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 3 (the attempt spent on submission was refunded; the sequence was 3 -> 2 -> 3)"
            - "MammographyUnit.${unit_id}.accreditation_status == PROVISIONAL (the withdrawal leaves the accreditation dimension exactly where it was)"

      - name: repeat_record_retraction_restores_the_unit_image_ledger_without_drift
        grounds:
          - calculations.unit_repeat_rate
          - entities.Exam.fields.repeat_image_count
          - entities.MammographyUnit.fields.total_images_acquired
          - entities.RepeatImagingRecord.fields.retracted
        distinguishing_aspect: |
          CONSERVED QUANTITY — imaging counts rather than money: the identity
          unit.total_images_acquired == sum of every non-retracted exam's
          original_image_count plus unit.repeat_images_acquired must survive both
          the addition and the retraction of a repeat record. Retraction must
          also recompute both repeat-rate percentages and clear the 5.00 percent
          flag, so the derived rates cannot be left stale after the compensating
          write.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "One SCREENING exam with original_image_count 4, so the ledger reads total_images 4 / repeat_images 0 and both rates are 0.00."
            - "One POSITIONING repeat record of 2 images on that exam, so the ledger reads total_images 6 / repeat_images 2 and the flag is raised."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9951", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-22T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { rr_exam_id: $.data.id }
            - call: "POST /exams/${rr_exam_id}/repeat-records"
              payload: { reason_code: "POSITIONING", repeat_image_count: 2 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { rr_rec_id: $.data.id }
          trigger:
            - call: "POST /repeat-records/${rr_rec_id}/retract"
              payload: { retraction_reason: "Repeat images were charted against the wrong accession" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "Before the retraction — MammographyUnit.${unit_id}.total_images_acquired == 6, repeat_images_acquired == 2, image_based_repeat_rate_pct == 33.33, patient_based_repeat_rate_pct == 100.00, repeat_rate_flag == true, and 6 == 4 + 2"
            - "RepeatImagingRecord.${rr_rec_id}.retracted == true"
            - "MammographyUnit.${unit_id}.total_images_acquired == 4 (the two repeat images were removed, not merely hidden)"
            - "MammographyUnit.${unit_id}.repeat_images_acquired == 0"
            - "Invariant after the trigger — 4 == 4 + 0"
            - "MammographyUnit.${unit_id}.image_based_repeat_rate_pct == 0.00 (recomputed, not left at 33.33)"
            - "MammographyUnit.${unit_id}.patient_based_repeat_rate_pct == 0.00 (recomputed, not left at 100.00)"
            - "MammographyUnit.${unit_id}.repeat_rate_flag == false"
            - "Exam.${rr_exam_id}.repeat_image_count == 0 and original_image_count == 4 (the acquisition itself is untouched)"
            - "GET /exams/${rr_exam_id}/repeat-records returns total_count == 1 with the single row flagged retracted — the audit trail is preserved while the ledger is corrected"
