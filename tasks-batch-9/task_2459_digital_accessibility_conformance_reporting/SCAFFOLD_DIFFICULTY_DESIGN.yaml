              as: AccessibilityLead
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/components"
              payload: { name: "Web UI", component_type: "WEB_UI", in_scope: true, assessment_scope: "FULL", applicable_criteria_count: 40, user_reach_pct: 60 }
              as: AccessibilityLead
              captures: { comp_id: $.data.id }
            - call: "POST /known-issues"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", severity: "MINOR", summary: "Decorative icons expose redundant alternative text", effort_points: 1, target_remediation_date: "2026-09-10", publish_intent: "INCLUDED" }
              as: AccessibilityTester
              captures: { iss_id: $.data.id }
            - call: "POST /known-issues/${iss_id}/triage"
              payload: { triage_note: "Cosmetic, low reach" }
              as: AccessibilityLead
            - call: "POST /known-issues/${iss_id}/board-review"
              payload: { board_review_note: "Deferred to a later programme increment", defer: true }
              as: AccessibilityLead
            - call: "POST /complaints"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", criterion_id: "${crit1_id}", channel: "WEB_FORM", description: "Icon labels are read twice by my screen reader", disability_category: "VISION" }
              as: CustomerLiaison
              captures: { cmp_a_id: $.data.id }
            - call: "POST /complaints/${cmp_a_id}/triage"
              payload: { route: "REMEDIATION" }
              as: AccessibilityLead
            - call: "POST /complaints"
              payload: { product_id: "${prod_id}", component_id: "${comp_id}", channel: "PHONE", description: "I need the report exported in large print for my team", disability_category: "VISION" }
              as: CustomerLiaison
              captures: { cmp_b_id: $.data.id }
            - call: "POST /complaints/${cmp_b_id}/triage"
              payload: { route: "ACCOMMODATION", requested_accommodation: "Large-print export of the conformance report", needed_by_date: "2026-09-01" }
              as: AccessibilityLead
          trigger:
            - call: "POST /complaints/${cmp_a_id}/link-issue"
              payload: { known_issue_id: "${iss_id}" }
              as: AccessibilityLead
              captures: { a_state: $.data.state, a_link: $.data.linked_issue_id }
            - call: "POST /complaints/${cmp_b_id}/fulfill-accommodation"
