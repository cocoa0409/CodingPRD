          trigger:
            - { call: "POST /credentialing/packet-items/${item_acls}/waive", payload: { waive_reason: "not needed" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/packet-items/${item_att}/waive", payload: { waive_reason: "on file" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "Waiving the critical ACLS item fails 422 error_id == 'ERR_ITEM_NOT_WAIVABLE'; item stays MISSING"
            - "Waiving the non-critical ATTESTATION item succeeds: status == 'WAIVED'; packet readiness_score recomputed to 0.0125 (5*0.5/200 = 0.0125)"

