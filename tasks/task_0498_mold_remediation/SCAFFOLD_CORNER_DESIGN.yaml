# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Mold & Environmental Remediation — Expert tier
# Breadth probe over claim-extraction-guide sections. Same seven-point contract
# and §1.5 priority ladder as §1.8. excluded_because stubs cite §1.8 instances
# by name. Logical clock default 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_computed_fields
        claim_type: Creation
        grounds: ["entities.Project", "endpoints.\"POST /api/projects\""]
        distinguishing_aspect: "POST /api/projects with all required fields -> 201; response carries posture=ASSESSMENT, status=OPEN, neshap_required computed, open_finding_count=0, version=1."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id, posture: $.data.posture }
          assert:
            - "response.status == 201"
            - "Project.${pid}.posture == ASSESSMENT"
            - "Project.${pid}.status == OPEN"
            - "Project.${pid}.neshap_required == false"
            - "Project.${pid}.open_finding_count == 0"
            - "Project.${pid}.version == 1"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Project", "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/projects/{nonexistent-uuid} -> 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: create_project_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Project.fields.hazard_class", "errors[ERR_INVALID_REQUEST]", "validations[priority=7]"]
        distinguishing_aspect: "POST /api/projects omitting hazard_class -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { site_name: "S", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: neshap_required_true_for_large_asbestos_project
        claim_type: Computed Fields
        grounds: ["entities.Project.fields.neshap_required", "calculations.neshap_applicability"]
        distinguishing_aspect: "ASBESTOS project with structure_sqft == 160 (== NESHAP_SQFT_THRESHOLD, >= inclusive) -> neshap_required true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { site_name: "Big Asb", hazard_class: "ASBESTOS", structure_sqft: 160, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id, nr: $.data.neshap_required }
          assert:
            - "Project.${pid}.neshap_required == true"

      - name: neshap_not_required_for_asbestos_below_threshold
        claim_type: Computed Fields
        grounds: ["entities.Project.fields.neshap_required", "calculations.neshap_applicability"]
        distinguishing_aspect: "ASBESTOS project with structure_sqft == 159 (just below 160) -> neshap_required false (boundary minus one)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { site_name: "Small Asb", hazard_class: "ASBESTOS", structure_sqft: 159, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id, nr: $.data.neshap_required }
          assert:
            - "Project.${pid}.neshap_required == false"

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints.\"GET /api/projects\"", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /api/projects returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Two MOLD projects created."]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { site_name: "P1", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
            - call: "POST /api/projects"
              payload: { site_name: "P2", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
          trigger:
            - call: "GET /api/projects"
              payload: { limit: 1, offset: 0 }
              as: ProjectManager
          assert:
            - "response.response_type == array"
            - "response.meta has total_count >= 2"
            - "response.has_more == true"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds: ["entities.Worker.fields.is_cert_current"]
        distinguishing_aspect: "is_cert_current is computed; a client-supplied value is ignored and the server computes it from cert_expires_at/ppe_fit_test_at."
        test_recipe:
          setup: ["Clock 2026-01-15T00:00:00Z."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/workers"
              payload: { full_name: "W", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id, cur: $.data.is_cert_current }
          assert:
            - "Worker.${wid}.is_cert_current == true"

      - name: worker_cert_expired_makes_is_cert_current_false
        claim_type: Computed Fields
        grounds: ["entities.Worker.fields.is_cert_current", "calculations.worker_eligibility"]
        distinguishing_aspect: "cert_expires_at == clock now exactly -> cert not current (strict > required), so is_cert_current false."
        test_recipe:
          setup: ["Clock 2026-01-15T00:00:00Z; worker cert_expires_at exactly 2026-01-15T00:00:00Z."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/workers"
              payload: { full_name: "Expired", cert_type: "MOLD", cert_expires_at: "2026-01-15T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
          assert:
            - "Worker.${wid}.is_cert_current == false"

      - name: assessment_creation_with_bad_project_fk_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.Assessment.fields.project_id", "validations[priority=5]", "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/assessments with non-existent project_id -> 404 ERR_PROJECT_NOT_FOUND (FK existence)."
        test_recipe:
          setup: ["A real worker exists for assessor_worker_id."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "A", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /api/assessments"
              payload: { project_id: "00000000-0000-0000-0000-000000000000", assessor_worker_id: "${wid}", area_label: "X" }
              as: LabTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: air_sample_missing_volume_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Sample.fields.volume_liters", "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "AIR sample without volume_liters -> 400 ERR_INVALID_REQUEST (conditional required field)."
        test_recipe:
          setup: ["MOLD project; assessment."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "A", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${wid}", area_label: "X" }
              as: LabTech
              captures: { asid: $.data.id }
          trigger:
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "AIR", collected_at: "2026-01-14T00:00:00Z" }
              as: LabTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: surface_sample_supplying_volume_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Sample.fields.volume_liters", "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "SURFACE sample supplying volume_liters (forbidden for SURFACE) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["MOLD project; assessment."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "A", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${wid}", area_label: "X" }
              as: LabTech
              captures: { asid: $.data.id }
          trigger:
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "SURFACE", collected_at: "2026-01-14T00:00:00Z", volume_liters: 100 }
              as: LabTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: surface_sample_concentration_equals_raw_count
        claim_type: Computed Fields
        grounds: ["entities.Sample.fields.concentration", "calculations.sample_concentration"]
        distinguishing_aspect: "SURFACE sample concentration == raw_count (no volume division); raw_count=60 -> concentration 60, grade ELEVATED (>= SURFACE_ELEVATED 50)."
        test_recipe:
          setup: ["MOLD project; assessment; SURFACE sample collected."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "A", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${wid}", area_label: "X" }
              as: LabTech
              captures: { asid: $.data.id }
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "SURFACE", collected_at: "2026-01-14T00:00:00Z" }
              as: LabTech
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /api/samples/${sid}/result"
              payload: { raw_count: 60 }
              as: LabTech
              captures: { conc: $.data.concentration, grade: $.data.result_grade }
          assert:
            - "Sample.${sid}.concentration == 60"
            - "Sample.${sid}.result_grade == ELEVATED"

      - name: pressure_log_is_immutable_event_no_version
        claim_type: Immutability
        grounds: ["entities.PressureLog"]
        distinguishing_aspect: "PressureLog has common_fields:false — response carries id and created_at but no version field; it is an append-only event."
        test_recipe:
          setup: ["MOLD project; zone."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
          trigger:
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
              captures: { plid: $.data.id }
          assert:
            - "response.status == 201"
            - "PressureLog.${plid}.created_at is present"
            - "PressureLog.${plid} has no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: void_already_voided_sample_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Sample.PENDING_to_VOIDED", "errors[ERR_INVALID_STATE]", "validations[priority=10]"]
        distinguishing_aspect: "Voiding a sample that is already VOIDED -> 409 ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["MOLD project; assessment; one PENDING sample voided once already (now VOIDED)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "A", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${wid}", area_label: "X" }
              as: LabTech
              captures: { asid: $.data.id }
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "SURFACE", collected_at: "2026-01-14T00:00:00Z" }
              as: LabTech
              captures: { sid: $.data.id }
            - call: "POST /api/samples/${sid}/void"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/samples/${sid}/void"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_sample_starts_pending_and_moves_assessment_to_sampled
        claim_type: initial_state
        grounds: ["state_machines.Sample", "state_machines.Assessment.DRAFT_to_SAMPLED"]
        distinguishing_aspect: "First sample under a DRAFT assessment starts PENDING and auto-moves the assessment DRAFT -> SAMPLED."
        test_recipe:
          setup: ["MOLD project; DRAFT assessment with no samples."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "A", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { wid: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${wid}", area_label: "X" }
              as: LabTech
              captures: { asid: $.data.id }
          trigger:
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "SURFACE", collected_at: "2026-01-14T00:00:00Z" }
              as: LabTech
              captures: { sid: $.data.id }
          assert:
            - "Sample.${sid}.status == PENDING"
            - "Assessment.${asid}.status == SAMPLED"

      - name: signoff_from_draft_clearance_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ClearanceTest.PASSED_to_SIGNED_OFF", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Signing off a ClearanceTest still in DRAFT (never analyzed) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["MOLD project; COMPLETED order; a DRAFT ClearanceTest (not analyzed)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Sampler", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { sampler_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Hyg", cert_type: "HYGIENIST", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { hyg_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "S", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { mid: $.data.id }
            - call: "POST /api/disposal-manifests/${mid}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 50 }
              as: AbatementSupervisor
            - call: "POST /api/clearance-tests"
              payload: { project_id: "${pid}", zone_id: "${zid}", abatement_order_id: "${aid}", sampler_worker_id: "${sampler_id}", clearance_air_count: 10, clearance_volume_liters: 100 }
              as: LabTech
              captures: { cid: $.data.id }
            - call: "GET /api/projects/${pid}"
              payload: {}
              as: Hygienist
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /api/clearance-tests/${cid}/signoff"
              payload: { signoff_worker_id: "${hyg_id}", expected_project_version: "${pv}" }
              as: Hygienist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_failed_clearance_cannot_be_signed_off
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ClearanceTest", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A FAILED ClearanceTest (terminal) cannot transition to SIGNED_OFF -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["MOLD project; COMPLETED order; a ClearanceTest analyzed to FAILED (air_count=90 vol=100 -> 900 == limit)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Sampler", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { sampler_id: $.data.id }
            - call: "POST /api/workers"
