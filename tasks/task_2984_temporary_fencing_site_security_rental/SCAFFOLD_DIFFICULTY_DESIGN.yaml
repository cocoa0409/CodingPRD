            - call: "POST /fence-rentals/permits"
              payload: { jobsite_id: "${j1_id}", closure_linear_feet: 600, closure_start_utc: "2026-08-15T00:00:00Z", closure_end_utc: "2026-08-25T00:00:00Z", sidewalk_closure_type: "FULL" }
              as: MunicipalLiaison
