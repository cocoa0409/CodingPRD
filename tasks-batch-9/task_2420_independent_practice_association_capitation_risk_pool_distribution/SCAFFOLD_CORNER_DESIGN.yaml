        grounds:
          - validations.priority_13_ERR_SPECIALTY_AGE_BAND_MISMATCH
          - endpoints.POST_/ipa/member-assignments
        distinguishing_aspect: |
          The rule is conditional on the enrollee's age_band: a PEDIATRIC
          enrollee may only sit on a PEDIATRICS or PRIMARY_CARE panel, while an
          ADULT enrollee is unconstrained. The same INTERNAL_MEDICINE physician
          must therefore reject the PEDIATRIC enrollee and accept the ADULT one,
          and the PEDIATRIC enrollee must be accepted by the PEDIATRICS
          physician. An implementation that applies the specialty rule to every
          age band rejects the ADULT assignment too.
