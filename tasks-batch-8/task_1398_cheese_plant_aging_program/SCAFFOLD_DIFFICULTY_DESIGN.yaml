            - { call: "POST /plant/make-sheets/${make_a}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_a}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_a}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_a}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_a}/complete", payload: { green_weight_kg: 500.0, wheels_produced: 8 }, as: Cheesemaker, as_user_id: "cm_alice" }
