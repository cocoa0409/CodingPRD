    purpose: "List or-equal submittals ordered by created_at ASC, filterable by project or status."
    roles: [PlatformAdmin, ApplicationEngineer, DesignReviewer, FabricationManager, QualityEngineer, CommissioningEngineer, EngineerOfRecord, OwnerRepresentative, ContractsAdministrator]
    input: ["project_id?", "status?"]
    output: "OrEqualSubmittal[]"
    side_effects:
      - "reads only"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: /water-treatment/or-equal-submittals/{submittal_id}
    purpose: "Fetch one or-equal submittal with its compliance score and open fundamental count."
    roles: [PlatformAdmin, ApplicationEngineer, DesignReviewer, FabricationManager, QualityEngineer, CommissioningEngineer, EngineerOfRecord, OwnerRepresentative, ContractsAdministrator]
    input: []
    output: OrEqualSubmittal
    side_effects:
      - "reads only"
