  - rule_id: transitive_cascade
    instances:
      - name: refusal_streak_cascade_depth_four
        depth: 4
        trigger_kind: "documenting the third consecutive REFUSED participation outcome"
        grounds:
          - calculations.resident_refusal_streak
          - state_machines.ParticipationRecord.PLANNED_to_REFUSED
          - state_machines.ActivityPlan.ACTIVE_to_UNDER_REVISION
          - entities.Resident.fields.care_plan_review_due
          - entities.Resident.fields.enrollment_gate
          - validations.priority_38_ERR_ENROLLMENT_GATED
        distinguishing_aspect: |
          Depth-4 chain fired by a participation write:
          ParticipationRecord.outcome = REFUSED (1) -> Resident.refusal_streak reaches the
          REFUSAL_REVIEW_THRESHOLD of 3 (2) -> the resident's ACTIVE ActivityPlan is driven to
          UNDER_REVISION with review_reason REFUSAL_PATTERN and Resident.care_plan_review_due
          becomes true (3) -> Resident.enrollment_gate becomes THERAPIST_REVIEW, so the very next
          enrollment attempt on an unrelated still-SCHEDULED session is refused with
          ERR_ENROLLMENT_GATED (4).
        test_recipe:
          setup:
            - "one ADMITTED resident, MILD_IMPAIRMENT + ASSIST_1 so supervision_tier == TIER_1, with an ACTIVE plan whose domain_frequency_targets are SOCIAL 3 and every other domain 0"
            - "four SOCIAL sessions on 2026-08-04 at 10:00-11:00, 12:00-13:00, 14:00-15:00 and 16:00-17:00 in a room with buffer_minutes 0, each with assigned_staff_count 2"
            - "the resident is enrolled in the first three sessions only; the fourth session has no enrollment and stays SCHEDULED"
            - "the first two sessions are started and documented REFUSED, advancing the clock to each start; immediately before the trigger Resident.refusal_streak == 2 and the plan is still ACTIVE"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Bernard Osei", room_number: "220A", admission_date: "2026-02-14" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "MILD_IMPAIRMENT", functional_mobility: "ASSIST_1", interest_domains: ["SOCIAL"], preferred_group_size: "SMALL", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { res_ver: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 3, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 0 }, expected_resident_version: "${res_ver}" }
              as: RecreationTherapist
              captures: { plan_id: $.data.id }
            - call: "POST /recreation/activity-plans/${plan_id}/transition"
              payload: { action: "ACTIVATE" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Music Hour", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Day Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-04T10:00:00Z", ends_at: "2026-08-04T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s1_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-04T12:00:00Z", ends_at: "2026-08-04T13:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s2_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-04T14:00:00Z", ends_at: "2026-08-04T15:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s3_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-04T16:00:00Z", ends_at: "2026-08-04T17:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s4_id: $.data.id }
            - call: "POST /recreation/sessions/${s1_id}/enrollments"
              payload: { resident_id: "${res_id}" }
              as: ActivityAide
              captures: { rec1_id: $.data.id }
            - call: "POST /recreation/sessions/${s2_id}/enrollments"
