        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_RX_DEVICE_FIELDS_INVALID]"]
        distinguishing_aspect: "BIPAP prescription with epap 10.0 >= ipap 8.0 violates the device-specific field rule -> 400 ERR_RX_DEVICE_FIELDS_INVALID on a SIGNED report."
