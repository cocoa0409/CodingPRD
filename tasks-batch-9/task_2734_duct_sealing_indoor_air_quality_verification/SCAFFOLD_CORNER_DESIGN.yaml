            - "First create: HTTP 412 ERR_STALE_DUCT_SYSTEM_VERSION, NOT 422 ERR_DUCT_SYSTEM_EXCLUDED"
            - "Second create with the refreshed version: HTTP 422 ERR_DUCT_SYSTEM_EXCLUDED"
