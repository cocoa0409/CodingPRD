              captures: { c_at_15: $.data.lock_cost_cents }
            - call: "POST /housing/rate-locks/${lk2}/extend"
              payload: { new_lock_days: 46 }
              as: MortgageBanker
              captures: { c_at_16: $.data.lock_cost_cents }
          assert:
            - "RateLock.${lk1}.lock_cost_cents == 0  # extra_days == 15 exactly, and <= FREE_EXTENSION_DAYS"
            - "RateLock.${lk2}.lock_cost_cents == 45  # extra_days == 16, tier1 = min(16,30)-15 == 1 day at 45 cents"
            - "the two costs differ by exactly MID_TIER_RATE_CENTS_PER_DAY == 45 for a one-day delta across the boundary"

      - name: commitment_window_inclusive_end_boundary_rejected_one_second_late
        grounds:
          - validations[priority=12]
          - errors[ERR_COMMITMENT_WINDOW_CLOSED]
          - decision_policies.SELECTOR-02
