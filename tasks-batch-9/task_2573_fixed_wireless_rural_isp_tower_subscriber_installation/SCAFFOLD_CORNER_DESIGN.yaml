        distinguishing_aspect: |
          The cumulative threshold is STRICTLY greater: 600.0 GB exactly is still STANDARD and 600.1
          flips to DEPRIORITIZED, so an implementation using >= is caught on the first ingest. The
          counters then behave differently from the posture: one breached cycle deprioritizes NOW but
          leaves sticky_deprioritization_active false, two consecutive breaches make the NEXT cycle open
