# =============================================================================
# Task 1260 — Care Gap Outreach & Population Health Registry
# =============================================================================

scenario: |
  1260. Care Gap Outreach & Population Health Registry (population health department):
  registry cohort definition & stratification, gap identification (screening/med adherence)
  & priority scoring, outreach campaign (call/text/mail) & attempt rules, appointment
  scheduling & transportation assist, gap closure documentation & data reconciliation,
  exclusion/refusal handling, panel manager workload & incentive, measure performance
  reporting.

domain_name: care-gap-outreach-population-health
api_prefix: /population-health

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: PopulationRegistry
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Registry display name" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: program_year, type: integer, source: input, description: "Measurement year (e.g., 2026); immutable after create" }
      - { name: current_business_date, type: datetime, source: system, description: "Logical clock; defaults to 2026-05-01T00:00:00Z at server start; advanced via POST /_clock/set_current_utc" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }

  - name: MeasureDefinition
    parent: PopulationRegistry
    common_fields: true
    fields:
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id" }
      - { name: measure_code, type: string, source: input, description: "Unique code within registry, e.g. COLON_SCREEN_50_75" }
      - { name: measure_domain, type: enum, source: input, description: "SCREENING | MED_ADHERENCE" }
      - { name: lookback_days, type: integer, source: input, description: "Days of history that satisfy the gap (e.g., 3650 for colonoscopy)" }
      - { name: exclusion_window_days, type: integer, source: input, default: 90, description: "Days an APPROVED exclusion suppresses the gap from the denominator" }
      - { name: reporting_lag_days, type: integer, source: input, default: 30, description: "Days after period-end before final reconciliation variant is published" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }

  - name: CohortDefinition
    parent: PopulationRegistry
    common_fields: true
    fields:
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id" }
      - { name: cohort_code, type: string, source: input, description: "Unique within registry" }
      - { name: min_age, type: integer, source: input, description: "Inclusive lower age bound" }
      - { name: max_age, type: integer, source: input, description: "Inclusive upper age bound" }
      - { name: risk_tier_filter, type: enum, source: input, description: "ANY | LOW | MEDIUM | HIGH" }
      - { name: requires_active_enrollment, type: boolean, source: input, default: true, description: "Member must be ENROLLED at evaluation time" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Member
    parent: PopulationRegistry
    common_fields: true
    fields:
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique within registry" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO8601 date" }
      - { name: risk_tier, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: phone_ok, type: boolean, source: input, default: true, description: "Consent flag for call/text outreach" }
      - { name: mail_ok, type: boolean, source: input, default: true, description: "Consent flag for postal outreach" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | DISENROLLED | DECEASED" }
      - { name: open_gap_count, type: integer, source: computed, default: 0, description: "Denormalized count of CareGap rows with status IN {OPEN, OUTREACH_IN_PROGRESS, AWAITING_APPOINTMENT, PENDING_EVIDENCE}" }

  - name: RegistryPanel
    parent: PopulationRegistry
    common_fields: true
    fields:
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id" }
      - { name: cohort_id, type: string, source: input, description: "FK -> CohortDefinition.id; the cohort this panel materializes" }
      - { name: measure_id, type: string, source: input, description: "FK -> MeasureDefinition.id; panel evaluates members against this measure" }
      - { name: panel_manager_id, type: string, source: input, description: "X-User-ID of the PanelManager who owns this panel" }
      - { name: member_count, type: integer, source: computed, default: 0, description: "Cardinality of Member rows currently satisfying cohort criteria" }
      - { name: status, type: enum, source: system, description: "BUILDING | ACTIVE | REBUILDING | RETIRED" }

  - name: CareGap
    parent: RegistryPanel
    common_fields: true
    fields:
      - { name: panel_id, type: string, source: system, description: "FK -> RegistryPanel.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: measure_id, type: string, source: input, description: "FK -> MeasureDefinition.id" }
      - { name: last_qualifying_event_at, type: datetime, source: input, required: false, description: "Date of last qualifying screening/adherence event; null = never" }
      - { name: due_date, type: datetime, source: computed, description: "= last_qualifying_event_at + measure.lookback_days; or member enrollment date when last_qualifying_event_at is null" }
      - { name: days_overdue, type: integer, source: computed, description: "max(0, current_business_date - due_date) in days" }
      - { name: priority_score, type: integer, source: computed, description: "0..100; see calculations.priority_score" }
      - { name: priority_band, type: enum, source: computed, description: "P1_URGENT | P2_HIGH | P3_ROUTINE | P4_LOW" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Count of OutreachAttempt rows with outcome != REVERSED" }
      - { name: next_eligible_attempt_at, type: datetime, source: computed, description: "Earliest time the next outreach attempt is permitted; see calculations.attempt_cadence" }
      - { name: status, type: enum, source: system, description: "OPEN | OUTREACH_IN_PROGRESS | AWAITING_APPOINTMENT | PENDING_EVIDENCE | CLOSED | REOPENED | EXCLUDED | EXPIRED" }
      - { name: closure_source, type: enum, source: system, required: false, description: "EVIDENCE | APPOINTMENT_COMPLETED | CLAIMS_FEED | EXCLUSION | null when not CLOSED" }

  - name: OutreachCampaign
    parent: PopulationRegistry
    common_fields: true
    fields:
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id" }
      - { name: panel_id, type: string, source: input, description: "FK -> RegistryPanel.id" }
      - { name: measure_id, type: string, source: input, description: "FK -> MeasureDefinition.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: channel, type: enum, source: input, description: "CALL | TEXT | MAIL" }
      - { name: quiet_hours_start_min, type: integer, source: input, default: 1260, description: "Local minutes-from-midnight after which outreach is blocked (default 21:00)" }
      - { name: quiet_hours_end_min, type: integer, source: input, default: 480, description: "Local minutes-from-midnight before which outreach is blocked (default 08:00)" }
      - { name: min_attempt_interval_hours, type: integer, source: input, default: 72, description: "Per-member per-channel cooldown between attempts" }
      - { name: max_attempts_per_member, type: integer, source: input, default: 5, description: "Cap; further attempts blocked with ERR_ATTEMPT_CAP_REACHED" }
      - { name: starts_at, type: datetime, source: input, description: "Campaign window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Campaign window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | ACTIVE | PAUSED | COMPLETED | CANCELLED" }

  - name: OutreachAttempt
    parent: CareGap
    common_fields: false
    fields:
      - { name: care_gap_id, type: string, source: system, description: "FK -> CareGap.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> OutreachCampaign.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; denormalized from CareGap at write time" }
      - { name: channel, type: enum, source: input, description: "CALL | TEXT | MAIL" }
      - { name: attempted_at, type: datetime, source: system, description: "Server-stamped from registry logical clock" }
      - { name: outcome, type: enum, source: input, description: "CONTACTED | LEFT_MESSAGE | NO_ANSWER | BAD_ADDRESS | REFUSED | REVERSED" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text note" }
      - { name: reversal_reason, type: string, source: input, required: false, description: "Required when outcome = REVERSED" }

  - name: Appointment
    parent: CareGap
    common_fields: true
    fields:
      - { name: care_gap_id, type: string, source: system, description: "FK -> CareGap.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; denormalized" }
      - { name: provider_id, type: string, source: input, description: "Opaque provider identifier" }
      - { name: slot_start_at, type: datetime, source: input, description: "Start of appointment (UTC)" }
      - { name: slot_end_at, type: datetime, source: input, description: "End of appointment (UTC)" }
      - { name: provider_capacity_per_slot, type: integer, source: input, default: 1, description: "Aggregate capacity this provider supports per overlapping slot (overbooking allowance)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: TransportationAssist
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; denormalized" }
      - { name: vendor, type: string, source: input, description: "Transport vendor name" }
      - { name: pickup_at, type: datetime, source: input, description: "Planned pickup time" }
      - { name: cost_cents, type: integer, source: input, description: "Negotiated cost in cents" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ARRANGED | COMPLETED | CANCELLED" }

  - name: GapClosureEvidence
    parent: CareGap
    common_fields: true
    fields:
      - { name: care_gap_id, type: string, source: system, description: "FK -> CareGap.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; denormalized" }
      - { name: evidence_type, type: enum, source: input, description: "CHART_REVIEW | CLAIMS_FEED | MEMBER_ATTESTATION | LAB_RESULT" }
      - { name: service_date, type: datetime, source: input, description: "Date the qualifying service occurred" }
      - { name: document_uri, type: string, source: input, description: "URI of supporting document" }
      - { name: submitted_by_role, type: string, source: system, description: "Captured from X-User-Role" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED" }

  - name: ExclusionRequest
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: measure_id, type: string, source: input, description: "FK -> MeasureDefinition.id; null means refusal applies to all measures" }
      - { name: exclusion_kind, type: enum, source: input, description: "MEDICAL_CONTRAINDICATION | MEMBER_REFUSAL | HOSPICE | DECEASED" }
      - { name: justification, type: string, source: input, description: "Free text (>= 20 chars for MEDICAL_CONTRAINDICATION)" }
      - { name: effective_from, type: datetime, source: input, description: "Start of suppression window" }
      - { name: effective_until, type: datetime, source: input, required: false, description: "End of suppression window; null = indefinite" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | REVOKED" }

  - name: PanelManagerWorkload
    parent: PopulationRegistry
    common_fields: true
    fields:
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id" }
      - { name: panel_manager_id, type: string, source: input, description: "Opaque PanelManager user id this row tracks" }
      - { name: assigned_member_count, type: integer, source: computed, default: 0, description: "Sum of RegistryPanel.member_count over ACTIVE panels where panel_manager_id matches" }
      - { name: closed_gap_count_period, type: integer, source: computed, default: 0, description: "CareGap transitions to CLOSED in the current program month" }
      - { name: utilization_ratio, type: number, source: computed, description: "assigned_member_count / WORKLOAD_TARGET (250); precision 4 decimals" }
      - { name: period_key, type: string, source: input, description: "YYYY-MM identifier of the incentive period" }

  - name: IncentivePayout
    parent: PanelManagerWorkload
    common_fields: true
    fields:
      - { name: workload_id, type: string, source: system, description: "FK -> PanelManagerWorkload.id" }
      - { name: panel_manager_id, type: string, source: system, description: "Denormalized from workload row" }
      - { name: period_key, type: string, source: system, description: "Denormalized from workload row" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Per-gap rate multiplied by closed_gap_count_period" }
      - { name: tier_multiplier_bps, type: integer, source: computed, description: "10000 | 12000 | 15000 by utilization tier" }
      - { name: quality_bonus_cents, type: integer, source: computed, description: "Flat bonus when closure_rate >= QUALITY_THRESHOLD_BPS" }
      - { name: total_payout_cents, type: integer, source: computed, description: "See calculations.panel_manager_incentive_payout — pins rounding order" }
      - { name: status, type: enum, source: system, description: "PROJECTED | APPROVED | PAID | VOID" }

  - name: MeasurePerformanceReport
    parent: MeasureDefinition
    common_fields: true
    fields:
      - { name: measure_id, type: string, source: system, description: "FK -> MeasureDefinition.id" }
      - { name: registry_id, type: string, source: system, description: "FK -> PopulationRegistry.id; denormalized" }
      - { name: period_key, type: string, source: input, description: "YYYY-MM" }
      - { name: denominator_count, type: integer, source: computed, description: "Members in cohort, enrolled, without APPROVED exclusion during window" }
      - { name: numerator_count, type: integer, source: computed, description: "Members with qualifying closure inside measurement window" }
      - { name: closure_rate_bps, type: integer, source: computed, description: "round(numerator * 10000 / denominator); null when denominator == 0" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL | FINAL" }
      - { name: reconciled_at, type: datetime, source: system, required: false, description: "Set when variant transitions PROVISIONAL -> FINAL" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CareGap
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /population-health/care-gaps/{id}/outreach-attempts (first non-REVERSED attempt)"
        actor: PanelManager
        preconditions:
          - "CareGap.status == OPEN (ERR_INVALID_STATE otherwise)"
          - "Campaign on the attempt is ACTIVE (ERR_CAMPAIGN_NOT_ACTIVE)"
          - "current_business_date >= care_gap.next_eligible_attempt_at (ERR_ATTEMPT_TOO_EARLY)"
          - "attempt_count < campaign.max_attempts_per_member (ERR_ATTEMPT_CAP_REACHED)"
        side_effects:
          - "CareGap.attempt_count += 1"
          - "CareGap.next_eligible_attempt_at recomputed via calculations.attempt_cadence"
          - "CareGap.priority_score recomputed via calculations.priority_score"
          - "Increments CareGap.version"
      - from: OUTREACH_IN_PROGRESS
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /population-health/care-gaps/{id}/outreach-attempts (subsequent attempt)"
        actor: PanelManager
        preconditions:
          - "CareGap.status == OUTREACH_IN_PROGRESS (self-loop allowed)"
          - "current_business_date >= next_eligible_attempt_at"
          - "attempt_count < campaign.max_attempts_per_member"
        side_effects:
          - "CareGap.attempt_count += 1"
          - "CareGap.next_eligible_attempt_at recomputed"
          - "CareGap.priority_score recomputed"
          - "Increments CareGap.version"
      - from: OUTREACH_IN_PROGRESS
        to: AWAITING_APPOINTMENT
        trigger: "POST /population-health/care-gaps/{id}/appointments (schedule)"
        actor: PanelManager
        preconditions:
          - "CareGap.status IN {OPEN, OUTREACH_IN_PROGRESS} (ERR_INVALID_STATE)"
          - "No other Appointment for this care_gap_id with status IN {SCHEDULED, CONFIRMED} (ERR_APPOINTMENT_ALREADY_ACTIVE)"
          - "Slot does not violate provider aggregate capacity (ERR_PROVIDER_SLOT_FULL)"
        side_effects:
          - "Appointment row created with status SCHEDULED"
          - "CareGap.attempt_count unchanged"
      - from: AWAITING_APPOINTMENT
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /population-health/appointments/{id}/mark-no-show OR /cancel (revert loop)"
        actor: PanelManager
        preconditions:
          - "Appointment.status IN {SCHEDULED, CONFIRMED}"
        side_effects:
          - "Appointment.status updated"
          - "CareGap reverts to OUTREACH_IN_PROGRESS"
          - "CareGap.priority_score recomputed with NO_SHOW_STRIKE_BONUS added"
          - "Any linked TransportationAssist with status IN {REQUESTED, ARRANGED} is transitioned to CANCELLED"
          - "OutreachAttempt with outcome=NO_ANSWER + notes='auto:no-show' appended (channel=CALL)"
          - "CareGap.attempt_count += 1 (the auto-attempt counts toward cadence)"
      - from: AWAITING_APPOINTMENT
        to: PENDING_EVIDENCE
        trigger: "POST /population-health/appointments/{id}/complete"
        actor: PanelManager
        preconditions:
          - "Appointment.status == CONFIRMED (ERR_APPOINTMENT_NOT_CONFIRMED)"
          - "If TransportationAssist row exists for this appointment, its status MUST be ARRANGED or COMPLETED (ERR_TRANSPORT_NOT_ARRANGED)"
        side_effects:
          - "Appointment.status = COMPLETED"
          - "GapClosureEvidence auto-created with evidence_type=CHART_REVIEW, service_date=appointment.slot_start_at, status=SUBMITTED"
          - "CareGap.closure_source pre-set to APPOINTMENT_COMPLETED (pending evidence approval)"
      - from: PENDING_EVIDENCE
        to: CLOSED
        trigger: "POST /population-health/gap-closure-evidence/{id}/approve"
        actor: QualityReviewer
        preconditions:
          - "GapClosureEvidence.status == SUBMITTED"
          - "GapClosureEvidence.service_date >= (current_business_date - measure.lookback_days) (ERR_EVIDENCE_OUT_OF_WINDOW)"
          - "Segregation of duties: X-User-ID of approver != X-User-ID that submitted the evidence (ERR_SOD_VIOLATION)"
        side_effects:
          - "GapClosureEvidence.status = APPROVED"
          - "CareGap.status = CLOSED"
          - "CareGap.closure_source = EVIDENCE (or APPOINTMENT_COMPLETED if appointment-derived)"
          - "Member.open_gap_count -= 1"
          - "PanelManagerWorkload.closed_gap_count_period += 1 for the panel's owner"
          - "PanelManagerWorkload.utilization_ratio recomputed"
          - "IncentivePayout rows in PROJECTED status for the current period_key recomputed via calculations.panel_manager_incentive_payout"
          - "MeasurePerformanceReport in PROVISIONAL variant for the current period_key: numerator_count recomputed; closure_rate_bps recomputed"
      - from: PENDING_EVIDENCE
        to: OUTREACH_IN_PROGRESS
        trigger: "POST /population-health/gap-closure-evidence/{id}/reject"
        actor: QualityReviewer
        preconditions:
          - "GapClosureEvidence.status == SUBMITTED"
        side_effects:
          - "GapClosureEvidence.status = REJECTED"
          - "CareGap reverts to OUTREACH_IN_PROGRESS"
          - "CareGap.closure_source = null"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /population-health/care-gaps/{id}/reopen (claims-feed reconciliation discovers gap)"
        actor: DataReconciliationBot
        preconditions:
          - "CareGap.status == CLOSED"
          - "closure_source == CLAIMS_FEED (only claims-closed gaps can be reopened by reconciliation)"
          - "current_business_date < due_date + measure.reporting_lag_days (ERR_RECONCILIATION_WINDOW_CLOSED)"
        side_effects:
          - "CareGap.status = REOPENED"
          - "CareGap.closure_source = null"
          - "Member.open_gap_count += 1"
          - "PanelManagerWorkload.closed_gap_count_period -= 1"
          - "IncentivePayout rows in PROJECTED recomputed"
          - "MeasurePerformanceReport PROVISIONAL numerator_count -= 1; closure_rate_bps recomputed"
      - from: REOPENED
        to: OPEN
        trigger: "system: automatic re-triage at next_eligible_attempt_at"
        actor: system
        preconditions:
          - "CareGap.status == REOPENED"
        side_effects:
          - "CareGap.status = OPEN"
          - "CareGap.priority_score recomputed (REOPENED gaps get REOPEN_BONUS)"
      - from: OPEN
        to: EXCLUDED
        trigger: "POST /population-health/exclusion-requests/{id}/approve (when measure matches CareGap)"
        actor: QualityReviewer
        preconditions:
          - "ExclusionRequest.status == UNDER_REVIEW"
          - "CareGap.status IN {OPEN, OUTREACH_IN_PROGRESS}"
        side_effects:
          - "CareGap.status = EXCLUDED"
          - "Member.open_gap_count -= 1"
          - "MeasurePerformanceReport PROVISIONAL denominator_count -= 1 (if within window)"
          - "Any Appointment in {SCHEDULED, CONFIRMED} for this CareGap is CANCELLED"
      - from: EXCLUDED
        to: OPEN
        trigger: "POST /population-health/exclusion-requests/{id}/revoke"
        actor: QualityReviewer
        preconditions:
          - "ExclusionRequest.status == APPROVED"
        side_effects:
          - "ExclusionRequest.status = REVOKED"
          - "CareGap.status = OPEN"
          - "Member.open_gap_count += 1"
          - "MeasurePerformanceReport PROVISIONAL denominator_count += 1 (if within window)"
      - from: OPEN
        to: EXPIRED
        trigger: "system: registry clock crosses due_date + measure.reporting_lag_days with no closure"
        actor: system
        preconditions:
          - "CareGap.status IN {OPEN, OUTREACH_IN_PROGRESS, AWAITING_APPOINTMENT, PENDING_EVIDENCE, REOPENED}"
          - "current_business_date >= due_date + measure.reporting_lag_days"
        side_effects:
          - "CareGap.status = EXPIRED (terminal)"
          - "Member.open_gap_count -= 1"

  - entity: OutreachCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /population-health/outreach-campaigns/{id}/schedule"
        actor: ProgramAdministrator
        preconditions:
          - "Campaign.status == DRAFT"
          - "starts_at < ends_at (ERR_INVALID_CAMPAIGN_WINDOW)"
          - "ends_at > current_business_date (ERR_CAMPAIGN_WINDOW_PAST)"
        side_effects: []
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /population-health/outreach-campaigns/{id}/launch OR system auto-launch at starts_at"
        actor: ProgramAdministrator
        preconditions:
          - "Campaign.status == SCHEDULED"
          - "current_business_date >= starts_at (ERR_CAMPAIGN_NOT_YET_OPEN)"
          - "Linked RegistryPanel.status == ACTIVE (ERR_PANEL_NOT_ACTIVE)"
        side_effects:
          - "OutreachAttempt becomes acceptable for CareGaps under this panel"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /population-health/outreach-campaigns/{id}/pause"
        actor: ProgramAdministrator
        preconditions: ["Campaign.status == ACTIVE"]
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /population-health/outreach-campaigns/{id}/resume"
        actor: ProgramAdministrator
        preconditions:
          - "Campaign.status == PAUSED"
          - "current_business_date < ends_at (ERR_CAMPAIGN_WINDOW_PAST)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: registry clock crosses ends_at OR POST /population-health/outreach-campaigns/{id}/complete"
        actor: ProgramAdministrator
        preconditions: ["Campaign.status IN {ACTIVE, PAUSED}"]
        side_effects:
          - "All CareGaps in OUTREACH_IN_PROGRESS whose campaign_id chain resolves to this campaign remain OUTREACH_IN_PROGRESS (no forced transition)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /population-health/outreach-campaigns/{id}/cancel"
        actor: ProgramAdministrator
        preconditions: ["Campaign.status IN {DRAFT, SCHEDULED, ACTIVE, PAUSED}"]
        side_effects:
          - "Campaign status = CANCELLED; no further attempts accepted"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /population-health/appointments/{id}/confirm"
        actor: PanelManager
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "If TransportationAssist exists: status must be ARRANGED (ERR_TRANSPORT_NOT_ARRANGED)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /population-health/appointments/{id}/cancel"
        actor: PanelManager
        preconditions: ["Appointment.status IN {SCHEDULED, CONFIRMED}"]
        side_effects:
          - "CareGap reverts from AWAITING_APPOINTMENT to OUTREACH_IN_PROGRESS"
          - "Linked TransportationAssist in {REQUESTED, ARRANGED} -> CANCELLED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /population-health/appointments/{id}/complete"
        actor: PanelManager
        preconditions: ["Appointment.status == CONFIRMED"]
        side_effects:
          - "See CareGap AWAITING_APPOINTMENT -> PENDING_EVIDENCE cascade"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /population-health/appointments/{id}/mark-no-show"
        actor: PanelManager
        preconditions:
          - "Appointment.status IN {SCHEDULED, CONFIRMED}"
          - "current_business_date > slot_end_at (ERR_CANNOT_MARK_FUTURE_APPOINTMENT)"
        side_effects:
          - "CareGap reverts to OUTREACH_IN_PROGRESS with priority_score NO_SHOW_STRIKE_BONUS"
          - "TransportationAssist in {REQUESTED, ARRANGED} -> CANCELLED"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /population-health/appointments/{id}/reschedule (cyclic self-loop)"
        actor: PanelManager
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "New slot does not violate provider capacity"
        side_effects:
          - "slot_start_at / slot_end_at updated"
          - "Appointment.version incremented"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /population-health/appointments/{id}/reschedule (back-transition)"
        actor: PanelManager
        preconditions:
          - "Appointment.status == CONFIRMED"
          - "New slot does not violate provider capacity"
        side_effects:
          - "Appointment.status reverts to SCHEDULED (must re-confirm)"
          - "slot_start_at / slot_end_at updated"

  - entity: TransportationAssist
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ARRANGED
        trigger: "POST /population-health/transportation-assists/{id}/arrange"
        actor: TransportationCoordinator
        preconditions: ["TransportationAssist.status == REQUESTED"]
        side_effects: []
      - from: ARRANGED
        to: COMPLETED
        trigger: "POST /population-health/transportation-assists/{id}/complete"
        actor: TransportationCoordinator
        preconditions:
          - "TransportationAssist.status == ARRANGED"
          - "Parent Appointment.status == COMPLETED"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /population-health/transportation-assists/{id}/cancel OR cascade from appointment cancel/no-show"
        actor: TransportationCoordinator
        preconditions: ["TransportationAssist.status IN {REQUESTED, ARRANGED}"]
        side_effects: []

  - entity: GapClosureEvidence
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /population-health/gap-closure-evidence/{id}/approve"
        actor: QualityReviewer
        preconditions:
          - "Evidence.status == SUBMITTED"
          - "service_date within lookback window"
          - "Segregation of duties: approver != submitter"
        side_effects: ["See CareGap PENDING_EVIDENCE -> CLOSED cascade"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /population-health/gap-closure-evidence/{id}/reject"
        actor: QualityReviewer
        preconditions:
          - "Evidence.status == SUBMITTED"
          - "Segregation of duties: rejector != submitter"
        side_effects: ["CareGap reverts to OUTREACH_IN_PROGRESS"]

  - entity: ExclusionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /population-health/exclusion-requests/{id}/start-review"
        actor: QualityReviewer
        preconditions: ["ExclusionRequest.status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /population-health/exclusion-requests/{id}/approve"
        actor: QualityReviewer
        preconditions:
          - "ExclusionRequest.status == UNDER_REVIEW"
          - "Member has no Appointment in {SCHEDULED, CONFIRMED} referencing a CareGap for this measure (ERR_EXCLUSION_BLOCKED_BY_APPOINTMENT)"
        side_effects:
          - "All CareGap rows for this member matching measure (or all when measure_id null) transition to EXCLUDED"
          - "Member.open_gap_count decremented by count of transitioned rows"
          - "MeasurePerformanceReport PROVISIONAL denominator_count decremented"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /population-health/exclusion-requests/{id}/deny"
        actor: QualityReviewer
        preconditions: ["ExclusionRequest.status == UNDER_REVIEW"]
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /population-health/exclusion-requests/{id}/revoke"
        actor: QualityReviewer
        preconditions: ["ExclusionRequest.status == APPROVED"]
        side_effects:
          - "All CareGap rows transitioned by the original approval revert EXCLUDED -> OPEN"
          - "Member.open_gap_count incremented"
          - "MeasurePerformanceReport PROVISIONAL denominator_count incremented"

  - entity: RegistryPanel
    initial_state: BUILDING
    terminal_states: [RETIRED]
    transitions:
      - from: BUILDING
        to: ACTIVE
        trigger: "POST /population-health/registry-panels/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "Panel.status == BUILDING"
          - "Cohort and Measure both in ACTIVE/PUBLISHED status"
        side_effects:
          - "CareGap rows materialized for every cohort-matching member lacking a qualifying event in lookback window"
      - from: ACTIVE
        to: REBUILDING
        trigger: "POST /population-health/registry-panels/{id}/rebuild (OCC)"
        actor: ProgramAdministrator
        preconditions:
          - "Panel.status == ACTIVE"
          - "expected_panel_version matches panel.version (ERR_STALE_VERSION 412)"
        side_effects:
          - "Panel.version incremented"
          - "New CareGap rows added for newly eligible members; existing untouched"
      - from: REBUILDING
        to: ACTIVE
        trigger: "POST /population-health/registry-panels/{id}/finalize-rebuild"
        actor: ProgramAdministrator
        preconditions: ["Panel.status == REBUILDING"]
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /population-health/registry-panels/{id}/retire"
        actor: ProgramAdministrator
        preconditions: ["Panel.status IN {ACTIVE, REBUILDING}"]
        side_effects: ["No new CareGaps; existing CareGaps unaffected"]

  - entity: MeasurePerformanceReport
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /population-health/measure-performance-reports/{id}/finalize"
        actor: ProgramAdministrator
        preconditions:
          - "Report.variant == PROVISIONAL"
          - "current_business_date >= period_end + measure.reporting_lag_days (ERR_RECONCILIATION_WINDOW_OPEN)"
        side_effects:
          - "variant = FINAL"
          - "reconciled_at = current_business_date"
          - "Numerator and denominator recomputed via FINAL variant rules (see calculations.gap_closure_rate)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: panel-rebuild-stale-version
    parent_entity: RegistryPanel
    write_endpoint: "POST /population-health/registry-panels/{panelId}/rebuild"
    occ_field: "expected_panel_version"
    description: |
      Rebuilding a RegistryPanel whose version has advanced since the caller
      last observed it is rejected. Captures the case where another writer has
      already triggered a rebuild (or another mutation) on the same panel,
      making the caller's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: care-gap-attempt-stale-version
    parent_entity: CareGap
    write_endpoint: "POST /population-health/care-gaps/{gapId}/outreach-attempts"
    occ_field: "expected_care_gap_version"
    description: |
      Recording an outreach attempt against a CareGap whose version has
      advanced since the caller last observed it is rejected. Captures the
      case where a prior attempt already advanced attempt_count and
      next_eligible_attempt_at, making the caller's cadence computation stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_score
    trigger: "CareGap creation, attempt recorded, appointment no-show, gap reopen, exclusion revoke"
    algorithm: weighted_scoring
    formula: |
      inputs:
        days_overdue          = CareGap.days_overdue
        risk_tier_weight      = { LOW: 1, MEDIUM: 2, HIGH: 3 }[Member.risk_tier]
        measure_domain_weight = { SCREENING: 1, MED_ADHERENCE: 2 }[Measure.measure_domain]
        attempt_count         = CareGap.attempt_count
        no_show_strikes       = count of Appointment with status=NO_SHOW for this care_gap_id
        is_reopened           = (CareGap ever transitioned CLOSED -> REOPENED)
      rule:
        base = min(days_overdue, 90)                    # cap overdue contribution at 90
        tier_term = risk_tier_weight * measure_domain_weight * 5
        attempt_decay = max(0, 20 - 4 * attempt_count)  # decaying boost for un-attempted gaps
        strike_bonus = no_show_strikes * NO_SHOW_STRIKE_BONUS
        reopen_bonus = REOPEN_BONUS if is_reopened else 0
        raw = base + tier_term + attempt_decay + strike_bonus + reopen_bonus
        priority_score = max(0, min(100, raw))          # clamp to [0,100]
      priority_band:
        P1_URGENT  when priority_score >= 80
        P2_HIGH    when 60 <= priority_score < 80
        P3_ROUTINE when 30 <= priority_score < 60
        P4_LOW     when priority_score < 30
    input_set: "CareGap rows with status IN {OPEN, OUTREACH_IN_PROGRESS, AWAITING_APPOINTMENT, PENDING_EVIDENCE, REOPENED}; EXCLUDED and EXPIRED rows keep their last computed score"
    constants:
      NO_SHOW_STRIKE_BONUS: 8
      REOPEN_BONUS: 12
    precision: "integer, floor after clamp"

  - name: gap_closure_rate
    trigger: "MeasurePerformanceReport generation, every CareGap transition affecting numerator/denominator"
    algorithm: aggregation
    formula: |
      denominator = count of Member rows matching the panel's CohortDefinition
                    with enrollment_status == ENROLLED at evaluation time
                    AND no APPROVED ExclusionRequest covering this measure whose
                    [effective_from, effective_until) overlaps the reporting period
      numerator   = count of denominator members with at least one CareGap for
                    this measure transitioning to CLOSED inside the period window
      closure_rate_bps = (denominator == 0) ? null : round_half_up(numerator * 10000 / denominator)
    precision: "integer basis points, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "current_business_date < period_end + measure.reporting_lag_days"
        difference: "Includes CareGap rows with closure_source = CLAIMS_FEED that have NOT yet been reconciliation-checked; denominator uses live exclusion list"
      - name: FINAL
        when: "current_business_date >= period_end + measure.reporting_lag_days"
        difference: "Excludes CLAIMS_FEED closures later reopened (i.e., rows whose current status is REOPENED or OPEN are NOT counted in numerator even if their original closure fell in the period); denominator freezes exclusions APPROVED as of period_end + lag"

  - name: panel_manager_incentive_payout
    trigger: "End-of-period job OR any recompute triggered by CareGap CLOSED/REOPENED cascades"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round per-line then sum (per-gap tier bonuses),
      # NOT sum-then-round. Different orders yield different cents.
      inputs:
        closed_gap_count_period
        utilization_ratio = assigned_member_count / WORKLOAD_TARGET
        tier_multiplier_bps =
            10000 if utilization_ratio <  0.80
            12000 if 0.80 <= utilization_ratio < 1.00
            15000 if utilization_ratio >= 1.00
      per_gap_line_cents = round_half_up(PER_GAP_BASE_CENTS * tier_multiplier_bps / 10000)
      base_amount_cents  = per_gap_line_cents * closed_gap_count_period
      quality_bonus_cents = QUALITY_BONUS_CENTS if gap_closure_rate_bps(PROVISIONAL) >= QUALITY_THRESHOLD_BPS else 0
      total_payout_cents = base_amount_cents + quality_bonus_cents
    input_set: "IncentivePayout rows with status = PROJECTED for the current period_key"
    constants:
      WORKLOAD_TARGET: 250
      PER_GAP_BASE_CENTS: 4500
      QUALITY_BONUS_CENTS: 50000
      QUALITY_THRESHOLD_BPS: 7000
    precision: "integer cents, round_half_up; per-gap rounding before multiplication"

  - name: attempt_cadence
    trigger: "Every successful OutreachAttempt creation, every no-show cascade, every REOPEN -> OPEN re-triage"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency resolved by PINNED evaluation order:
      #   step 1: pick channel (depends on priority_band)
      #   step 2: determine cooldown_hours (depends on channel)
      #   step 3: clip to campaign quiet-hours window (depends on cooldown result)
      #   step 4: floor against campaign.starts_at and current_business_date
      # priority_band itself depends on attempt_count which depends on attempts,
      # but evaluation order breaks the loop: use the PRE-attempt priority_band
      # for channel selection.
      step1_channel = { P1_URGENT: CALL, P2_HIGH: CALL, P3_ROUTINE: TEXT, P4_LOW: MAIL }[care_gap.priority_band_PRE_attempt]
      step2_cooldown_hours = campaign.min_attempt_interval_hours  # per-channel override allowed
      step3_candidate_at = current_business_date + step2_cooldown_hours
      # clip into waking hours [quiet_hours_end_min, quiet_hours_start_min) local:
      if local_minutes(step3_candidate_at) >= campaign.quiet_hours_start_min:
          step3_candidate_at = next_local_day(step3_candidate_at) + campaign.quiet_hours_end_min
      elif local_minutes(step3_candidate_at) < campaign.quiet_hours_end_min:
          step3_candidate_at = local_date(step3_candidate_at) + campaign.quiet_hours_end_min
      step4_next_eligible_attempt_at = max(step3_candidate_at, campaign.starts_at)
    input_set: "Triggered per CareGap; uses the linked OutreachCampaign configuration"
    precision: "datetime, second precision"

  - name: measure_performance_numerator_denominator
    trigger: "Report generation and on every numerator/denominator-affecting cascade"
    algorithm: aggregation
    formula: |
      See gap_closure_rate; this rule owns the count-level recompute while
      gap_closure_rate owns the bps derivation. Counts are integers; no rounding.
    precision: "integer"

  - name: workload_utilization
    trigger: "PanelManagerWorkload row mutation (panel assigned, gap closed/reopened, member panel join/leave)"
    algorithm: aggregation
    formula: |
      assigned_member_count = sum of RegistryPanel.member_count
                              where panel_manager_id == workload.panel_manager_id
                              AND panel.status == ACTIVE
      utilization_ratio = round_half_up(assigned_member_count / WORKLOAD_TARGET, 4)
    constants:
      WORKLOAD_TARGET: 250
    precision: "4 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Resource ids in path exist, evaluated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: state, check: "Target resource in correct state for the action (per state machine)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "OCC expected_*_version matches when required (see concurrency_rules)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /population-health/registry-panels/{id}/rebuild, POST /population-health/care-gaps/{id}/outreach-attempts" }
  - { priority: 6, category: business_temporal, check: "current_business_date >= CareGap.next_eligible_attempt_at before recording attempt", error_id: ERR_ATTEMPT_TOO_EARLY, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/outreach-attempts" }
  - { priority: 7, category: business_temporal, check: "current_business_date within campaign [starts_at, ends_at) and outside quiet-hours", error_id: ERR_CAMPAIGN_WINDOW_VIOLATION, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/outreach-attempts" }
  - { priority: 8, category: business_safety, check: "Member consent flags permit the chosen channel (phone_ok for CALL/TEXT; mail_ok for MAIL)", error_id: ERR_CHANNEL_CONSENT_MISSING, http_status: 403, applies_to: "POST /population-health/care-gaps/{id}/outreach-attempts" }
  - { priority: 9, category: business_constraint, check: "attempt_count < campaign.max_attempts_per_member", error_id: ERR_ATTEMPT_CAP_REACHED, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/outreach-attempts" }
  - { priority: 10, category: business_referential, check: "Member has no APPROVED ExclusionRequest covering this measure at current_business_date", error_id: ERR_MEMBER_EXCLUDED, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/outreach-attempts, POST /population-health/care-gaps/{id}/appointments" }
  - { priority: 11, category: business_referential, check: "OutreachCampaign referenced by attempt is ACTIVE", error_id: ERR_CAMPAIGN_NOT_ACTIVE, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/outreach-attempts" }
  - { priority: 12, category: business_referential, check: "No Appointment already in {SCHEDULED, CONFIRMED} for this care_gap_id", error_id: ERR_APPOINTMENT_ALREADY_ACTIVE, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/appointments" }
  - { priority: 13, category: business_constraint, check: "Provider slot capacity not exceeded for overlapping [slot_start_at, slot_end_at)", error_id: ERR_PROVIDER_SLOT_FULL, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/appointments, POST /population-health/appointments/{id}/reschedule" }
  - { priority: 14, category: business_temporal, check: "Appointment slot_start_at < slot_end_at and slot_start_at >= current_business_date", error_id: ERR_INVALID_SLOT, http_status: 400, applies_to: "POST /population-health/care-gaps/{id}/appointments, POST /population-health/appointments/{id}/reschedule" }
  - { priority: 15, category: business_temporal, check: "current_business_date > slot_end_at for no-show", error_id: ERR_CANNOT_MARK_FUTURE_APPOINTMENT, http_status: 409, applies_to: "POST /population-health/appointments/{id}/mark-no-show" }
  - { priority: 16, category: business_safety, check: "Segregation of duties: approver/rejector of GapClosureEvidence or ExclusionRequest differs from submitter", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /population-health/gap-closure-evidence/{id}/approve, /reject, /population-health/exclusion-requests/{id}/approve, /deny" }
  - { priority: 17, category: business_temporal, check: "GapClosureEvidence.service_date >= current_business_date - measure.lookback_days", error_id: ERR_EVIDENCE_OUT_OF_WINDOW, http_status: 409, applies_to: "POST /population-health/gap-closure-evidence/{id}/approve" }
  - { priority: 18, category: business_referential, check: "Member has no Appointment in {SCHEDULED, CONFIRMED} referencing a CareGap for this measure when approving ExclusionRequest", error_id: ERR_EXCLUSION_BLOCKED_BY_APPOINTMENT, http_status: 409, applies_to: "POST /population-health/exclusion-requests/{id}/approve" }
  - { priority: 19, category: business_temporal, check: "current_business_date >= period_end + reporting_lag_days before report finalize", error_id: ERR_RECONCILIATION_WINDOW_OPEN, http_status: 409, applies_to: "POST /population-health/measure-performance-reports/{id}/finalize" }
  - { priority: 20, category: business_temporal, check: "current_business_date < due_date + reporting_lag_days for care-gap reopen", error_id: ERR_RECONCILIATION_WINDOW_CLOSED, http_status: 409, applies_to: "POST /population-health/care-gaps/{id}/reopen" }
  - { priority: 21, category: business_constraint, check: "ExclusionRequest.justification >= 20 chars when exclusion_kind == MEDICAL_CONTRAINDICATION", error_id: ERR_INSUFFICIENT_JUSTIFICATION, http_status: 400, applies_to: "POST /population-health/members/{id}/exclusion-requests" }
  - { priority: 22, category: business_temporal, check: "OutreachCampaign.starts_at < ends_at and ends_at > current_business_date on schedule", error_id: ERR_INVALID_CAMPAIGN_WINDOW, http_status: 400, applies_to: "POST /population-health/outreach-campaigns/{id}/schedule" }
  - { priority: 23, category: business_referential, check: "RegistryPanel referenced by campaign is ACTIVE on launch", error_id: ERR_PANEL_NOT_ACTIVE, http_status: 409, applies_to: "POST /population-health/outreach-campaigns/{id}/launch" }
  - { priority: 24, category: business_fiscal, check: "TransportationAssist cost_cents non-negative", error_id: ERR_INVALID_COST, http_status: 400, applies_to: "POST /population-health/appointments/{id}/transportation-assists" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/population-health/_clock/set_current_utc"
    description: "Advance the registry logical clock. Server starts at default 2026-05-01T00:00:00Z; calling this is the only way to move time forward."
    roles: [ProgramAdministrator]
    code: 200
    input: [registry_id, to_iso8601]
    output: PopulationRegistry
    side_effects: ["PopulationRegistry.current_business_date = to_iso8601", "May trigger system transitions (CareGap EXPIRED, Campaign auto-launch/complete, REOPENED -> OPEN)"]

  # --- Population Registry ---
  - method: POST
    path: "/population-health/registries"
    description: "Create a population registry"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, "description?", program_year]
    output: PopulationRegistry
    side_effects: ["status = ACTIVE", "current_business_date = 2026-05-01T00:00:00Z"]
  - method: GET
    path: "/population-health/registries"
    description: "List registries"
    roles: [ProgramAdministrator, PanelManager, QualityReviewer, TransportationCoordinator, DataReconciliationBot]
    code: 200
    input: ["limit?", "offset?"]
    output: "PopulationRegistry[]"
    side_effects: []
  - method: GET
    path: "/population-health/registries/{id}"
    description: "Get registry"
    roles: [ProgramAdministrator, PanelManager, QualityReviewer, TransportationCoordinator, DataReconciliationBot]
    code: 200
    input: []
    output: PopulationRegistry
    side_effects: []

  # --- Measure Definitions ---
  - method: POST
    path: "/population-health/registries/{id}/measure-definitions"
    description: "Create measure"
    roles: [ProgramAdministrator]
    code: 201
    input: [measure_code, measure_domain, lookback_days, "exclusion_window_days?", "reporting_lag_days?"]
    output: MeasureDefinition
    side_effects: ["status = DRAFT"]
  - method: POST
    path: "/population-health/measure-definitions/{id}/publish"
    description: "Publish a measure (DRAFT -> PUBLISHED)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: MeasureDefinition
    side_effects: ["status = PUBLISHED"]
  - method: GET
    path: "/population-health/registries/{id}/measure-definitions"
    description: "List measures in registry"
    roles: [ProgramAdministrator, PanelManager, QualityReviewer, DataReconciliationBot]
    code: 200
    input: ["limit?", "offset?"]
    output: "MeasureDefinition[]"
    side_effects: []
  - method: GET
    path: "/population-health/measure-definitions/{id}"
    description: "Get measure"
    roles: [ProgramAdministrator, PanelManager, QualityReviewer, DataReconciliationBot]
    code: 200
    input: []
    output: MeasureDefinition
    side_effects: []

