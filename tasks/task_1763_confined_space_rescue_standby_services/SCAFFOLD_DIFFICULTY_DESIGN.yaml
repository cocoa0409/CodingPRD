            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-1", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Night job", planned_start_at: "2026-08-03T20:00:00Z", planned_end_at: "2026-08-04T08:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T20:00:00Z", standby_end_at: "2026-08-04T08:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T20:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
          trigger:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_amt: "$.data.line_amount_cents", sa_bmin: "$.data.billable_minutes" } }
          assert:
            - "StandbyAssignment.${sa}.billable_minutes == 600 (600 actual minutes, exact quarter-hour multiple)"
            - "chargeable_hours == 10.0 (above the 4h minimum floor)"
            - "tier1 portion == 8h * 20000 == 160000; tier2 portion == 2h * 20000 * 1.5 == 60000; base == 220000"
            - "day_multiplier == 1.5 (checked_in_at 2026-08-03T20:00:00Z: Monday, UTC hour 20 >= 19; weekend multiplier does NOT apply)"
            - "StandbyAssignment.${sa}.line_amount_cents == 330000"

      - name: statement_per_line_rounding_then_sum
        grounds:
          - calculations.statement_total_aggregation
          - entities.StatementLine.fields.amount_cents
          - entities.BillingStatement.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters (DIFFERENT mode from instance
          hourly_tier_crossing_with_after_hours_multiplier, which is mode (a)). Two
          assignments each price at 1h * 3333 * 1.5 = 4999.5 cents. Pinned order rounds
          per line first (5000 + 5000 = 10000); the forbidden sum-then-round order
          would give round(9999.0) = 9999 — a 1-cent observable divergence.
        test_recipe:
          setup:
            - "HOURLY_STANDBY account with hourly_standby_rate_cents 3333, minimum_billable_hours 1, after_hours_multiplier 1.5"
            - "ISSUED permit with two standby assignments (rescuers r1, r2), both window 2026-08-03T20:00-22:00Z, checked in at 20:00 (after-hours), released at 21:00 (60 min -> 1.0h each)"
            - "Statement generated for period [2026-08-03T00:00:00Z, 2026-08-04T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T19:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
