# ============================================================================
# SCAFFOLD.yaml — Corporate Archives & Heritage Program
# Sections §1.0 – §1.7. Difficulty design (§1.8) and corner design (§1.9) live
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2676. Corporate Archives & Heritage Program (company archives and heritage office): records appraisal for historical value with retention schedule interaction and legal hold coordination, accession processing with provenance documentation, arrangement and finding aid creation, physical and digital preservation planning with format migration and environmental storage standards, access policy across internal business use, external researchers and media with confidentiality screening, trademark and brand heritage support providing evidence of continuous use, anniversary, museum and exhibit projects drawing on collections, oral history program with interview consent and transcription, deaccession decisions and donation to external repositories

domain_name: corporate-archives-heritage-program
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing

  entity_topology: graph
  # graph: RecordSeries, Accession, ArchivalItem, StorageZone, PreservationPlan,
  # FindingAid, AccessRequest and TrademarkEvidencePackage form a many-to-many
  # reference web rather than a tree. ArchivalItem is reachable from Accession
  # (custody), StorageZone (physical location), MigrationJob (preservation),
  # ExhibitLoan (display), DeaccessionProposal (disposal), AccessRequest
  # (requested_item_ids array) and TrademarkEvidencePackage (evidence_item_ids
  # array). No URL nesting is used: every resource is addressed at the top level
  # and joined by explicit foreign keys.

  state_machine_shape: cyclic
  # Primary shape is cyclic: RecordSeries.disposition_state cycles
  # ACTIVE -> SUSPENDED -> ACTIVE (legal hold / release), AccessRequest.status
  # cycles SCREENING -> CHANGES_REQUESTED -> SCREENING (revision loop), and
  # FindingAid.status cycles PUBLISHED -> NEEDS_REVISION -> UNDER_REVIEW ->
  # PUBLISHED. Layered on top: OralHistoryInterview carries two independent
  # state axes (consent_status x transcription_status) and DeaccessionProposal
  # is a fork-join (two independent clearances converge on APPROVED, then the
  # route branch DESTRUCTION vs DONATION applies divergent side-effect sets).

  relationship_patterns:
    - one_to_many        # Accession -> ArchivalItem, PreservationPlan -> MigrationJob
    - many_to_many       # AccessRequest.requested_item_ids <-> ArchivalItem,
                         # TrademarkEvidencePackage.evidence_item_ids <-> ArchivalItem
    - polymorphic        # RecordSeries.pre_hold_disposition_state stores a prior
                         # value of its own enum for restore-on-release
    - cross_aggregate    # AccessRequest reads RecordSeries + Requester + FindingAid
                         # + ArchivalItem sensitivity across aggregate boundaries

  role_model: segregation_of_duties
  # Six business roles own disjoint operation sets (peer roles), and two
  # explicit segregation-of-duties constraints operate WITHIN a single role by
  # comparing X-User-ID: the officer who completed a ConfidentialityScreening
  # may not be the officer who approves/denies the AccessRequest, and the
  # officer who created a MigrationJob may not be the officer who approves it.

  consistency_model: immediate
  # Every cascade in §1.2 (legal-hold propagation, deaccession execution,
  # migration completion) is applied inside the triggering request, so all
  # derived fields are already reconciled in that request's response.

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  # ---------------------------------------------------------------- config ---
  - name: RetentionSchedule
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Unique schedule code such as FIN-07 or LEG-12.
        constraints: "Unique across all RetentionSchedule rows; 3..32 chars"
      - name: retention_years
        type: integer
        source: input
        description: Whole years a series must be retained after its latest record year.
        constraints: ">= 0 and <= 200"
      - name: disposition_action
        type: enum
        source: input
        description: Action the schedule prescribes once retention elapses.
        constraints: "One of {DESTROY, REVIEW, TRANSFER}"
      - name: legal_citation
        type: string
        source: input
        description: Statutory or policy citation backing the schedule.
        constraints: "1..200 chars"
      - name: min_appraisal_score_for_permanent
        type: number
        source: input
        description: Inclusive final-appraisal score at or above which a series becomes PERMANENT instead of following disposition_action.
        constraints: "0.00 .. 100.00, exactly 2 decimal places"

  # ------------------------------------------------------------- resources ---
  - name: RecordSeries
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Series title as it appears in the records inventory.
        constraints: "1..200 chars"
      - name: business_unit
        type: string
        source: input
        description: Owning business unit code.
        constraints: "1..64 chars"
      - name: retention_schedule_id
        type: string
        source: input
        description: "FK -> RetentionSchedule.id; the schedule governing this series"
      - name: sensitivity_ceiling
        type: enum
        source: input
        description: Highest sensitivity any record in the series may carry; used by the PRELIM confidentiality variant.
        constraints: "One of {PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED}"
      - name: annual_volume_linear_feet
        type: integer
        source: input
        description: Linear feet accruing per year; drives the appraisal volume penalty.
        constraints: ">= 0"
      - name: earliest_record_year
        type: integer
        source: input
        description: Calendar year of the oldest record in the series.
        constraints: "1800 .. 2100 and <= latest_record_year"
      - name: latest_record_year
        type: integer
        source: input
        description: Calendar year of the newest record in the series; retention clock starts at its 31 December.
        constraints: "1800 .. 2100 and >= earliest_record_year"
      - name: disposition_state
        type: enum
        source: computed
        description: Lifecycle state of the series; see §1.2 RecordSeries.
        default: ACTIVE
        constraints: "One of {ACTIVE, SUSPENDED, ELIGIBLE_FOR_DISPOSITION, PERMANENT, DISPOSED}"
      - name: pre_hold_disposition_state
        type: enum
        source: system
        description: Value of disposition_state captured when a legal hold suspended the series; restored verbatim on hold release. Null whenever disposition_state != SUSPENDED.
        default: null
        constraints: "One of {ACTIVE, ELIGIBLE_FOR_DISPOSITION, PERMANENT} or null"
      - name: legal_hold_active
        type: boolean
        source: computed
        description: True when at least one LegalHold with record_series_id == this id has status == ACTIVE.
        default: false
      - name: current_appraisal_id
        type: string
        source: computed
        description: "FK -> AppraisalRecord.id; the single AppraisalRecord for this series whose status is FINAL, else null"
        default: null
      - name: retention_expiry_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC instant date(latest_record_year, 12, 31)T23:59:59.000Z plus retention_schedule.retention_years whole years; the series is retention-elapsed once the logical clock is >= this instant"
      - name: disposition_certificate_reference
        type: string
        source: input
        description: Certificate of destruction/transfer reference recorded at disposal.
        default: null
      - name: blocked_access_request_count
        type: integer
        source: computed
        description: Count of AccessRequest rows with record_series_id == this id and status == BLOCKED.
        default: 0

  - name: LegalHold
    parent: RecordSeries
    common_fields: true
    fields:
      - name: matter_number
        type: string
        source: input
        description: Litigation or investigation matter number.
        constraints: "Unique across all LegalHold rows; 3..64 chars"
      - name: record_series_id
        type: string
        source: input
        description: "FK -> RecordSeries.id; the single series this hold freezes"
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which counsel considers the hold effective.
      - name: status
        type: enum
        source: computed
        description: Hold lifecycle; see §1.2 LegalHold.
        default: DRAFT
        constraints: "One of {DRAFT, ACTIVE, RELEASED}"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant at which the hold moved to ACTIVE.
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant at which the hold moved to RELEASED.
        default: null
      - name: release_note
        type: string
        source: input
        description: Counsel note recorded on release.
        default: null
      - name: issued_by
        type: string
        source: system
        description: X-User-ID of the LegalCounsel operator that created the hold.
      - name: suspended_access_request_count
        type: integer
        source: computed
        description: Number of AccessRequest rows this hold's activation cascade moved to BLOCKED.
        default: 0

  - name: AppraisalRecord
    parent: RecordSeries
    common_fields: true
    fields:
      - name: record_series_id
        type: string
        source: input
        description: "FK -> RecordSeries.id; the series being appraised"
      - name: informational_value
        type: integer
        source: input
        description: Archivist rating of informational value.
        constraints: "0 .. 10"
      - name: evidential_value
        type: integer
        source: input
        description: Archivist rating of evidential value.
        constraints: "0 .. 10"
      - name: brand_heritage_value
        type: integer
        source: input
        description: Archivist rating of brand/heritage value; counted only by the FINAL variant when a CERTIFIED TrademarkEvidencePackage exists for the series.
        constraints: "0 .. 10"
      - name: uniqueness_factor
        type: integer
        source: input
        description: Archivist rating of uniqueness/irreplaceability.
        constraints: "0 .. 10"
      - name: provenance_verified
        type: boolean
        source: input
        description: Whether the appraiser confirmed documented provenance; only the FINAL variant reacts to it.
      - name: status
        type: enum
        source: computed
        description: Appraisal lifecycle; see §1.2 AppraisalRecord.
        default: DRAFT
        constraints: "One of {DRAFT, SCREENED, FINAL, SUPERSEDED}"
      - name: screening_score
        type: number
        source: computed
        description: Output of calculations.appraisal_score variant SCREENING; null until status reaches SCREENED.
        default: null
      - name: final_score
        type: number
        source: computed
        description: Output of calculations.appraisal_score variant FINAL; null until status reaches FINAL.
        default: null
      - name: recommended_disposition
        type: enum
        source: computed
        description: PERMANENT when final_score >= retention_schedule.min_appraisal_score_for_permanent, else the schedule's disposition_action. Null until status reaches FINAL.
        default: null
        constraints: "One of {PERMANENT, DESTROY, REVIEW, TRANSFER} or null"
      - name: brand_heritage_counted
        type: boolean
        source: computed
        description: True when the FINAL variant admitted brand_heritage_value because a CERTIFIED TrademarkEvidencePackage existed for the series at finalize time.
        default: false
      - name: appraised_by
        type: string
        source: system
        description: X-User-ID of the Archivist that created the draft.
      - name: superseded_by_appraisal_id
        type: string
        source: system
        description: Id of the AppraisalRecord that superseded this one; null unless status == SUPERSEDED.
        default: null

  - name: Accession
    parent: RecordSeries
    common_fields: true
    fields:
      - name: record_series_id
        type: string
        source: input
        description: "FK -> RecordSeries.id; the series this accession belongs to"
      - name: donor_name
        type: string
        source: input
        description: Donor, department or estate transferring custody.
        constraints: "1..160 chars"
      - name: transfer_instrument
        type: enum
        source: input
        description: Legal instrument conveying custody.
        constraints: "One of {DEED_OF_GIFT, INTERNAL_TRANSFER, PURCHASE, BEQUEST}"
      - name: declared_unit_count
        type: integer
        source: input
        description: Units (boxes/carriers) the transferring party declared.
        constraints: ">= 1"
      - name: provenance_documented
        type: boolean
        source: computed
        description: Set true by POST /accessions/{id}/verify-provenance; gates processing.
        default: false
      - name: provenance_statement
        type: string
        source: input
        description: Custodial-history narrative recorded at provenance verification.
        default: null
      - name: transfer_instrument_reference
        type: string
        source: input
        description: Signed-instrument reference recorded at provenance verification.
        default: null
      - name: status
        type: enum
        source: computed
        description: Accession lifecycle; see §1.2 Accession.
        default: RECEIVED
        constraints: "One of {RECEIVED, PROVENANCE_VERIFIED, PROCESSED, REJECTED}"
      - name: processed_unit_count
        type: integer
        source: computed
        description: Sum of ArchivalItem.unit_count over items with accession_id == this id and status != REJECTED_ITEM; must equal declared_unit_count before processing succeeds.
        default: 0
      - name: deaccessioned_unit_count
        type: integer
        source: computed
        description: Sum of ArchivalItem.units_deaccessioned over items with accession_id == this id.
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: Reason recorded when the accession is rejected.
        default: null

  - name: ArchivalItem
    parent: Accession
    common_fields: true
    fields:
      - name: accession_id
        type: string
        source: input
        description: "FK -> Accession.id; the accession that brought this item into custody"
      - name: storage_zone_id
        type: string
        source: input
        description: "FK -> StorageZone.id; the physical zone shelving this item"
      - name: item_label
        type: string
        source: input
        description: Shelf label / container identifier.
        constraints: "1..120 chars"
      - name: unit_count
        type: integer
        source: input
        description: Total physical units in the item; conserved quantity for §1.3 unit_custody_conservation.
        constraints: ">= 1"
      - name: units_on_shelf
        type: integer
        source: computed
        description: Units currently shelved in storage_zone_id. Initialised to unit_count at creation.
        default: 0
      - name: units_on_loan
        type: integer
        source: computed
        description: Units currently checked out to exhibit loans in state OUT.
        default: 0
      - name: units_deaccessioned
        type: integer
        source: computed
        description: Units permanently removed by executed DeaccessionProposal rows.
        default: 0
      - name: condition_grade
        type: enum
        source: input
        description: Conservation condition; drives the migration condition surcharge and exhibit eligibility.
        constraints: "One of {GOOD, FAIR, POOR, UNSTABLE}"
      - name: original_format
        type: enum
        source: input
        description: Carrier format as received; drives migration rate and at-risk counting.
        constraints: "One of {PAPER, PHOTO, FILM, MAGNETIC_TAPE, BORN_DIGITAL}"
      - name: preservation_format
        type: enum
        source: computed
        description: Format the item is preserved in; equals original_format until a MigrationJob completes.
        constraints: "One of {PAPER, PHOTO, FILM, MAGNETIC_TAPE, BORN_DIGITAL, PRESERVATION_TIFF, PRESERVATION_WAV, PRESERVATION_MKV}"
      - name: digital_surrogate_available
        type: boolean
        source: computed
        description: Set true when a MigrationJob for this item completes; clears the item from PreservationPlan.at_risk_unit_count.
        default: false
      - name: sensitivity_level
        type: enum
        source: input
        description: Per-item sensitivity used by the POST_SCREEN confidentiality variant.
        constraints: "One of {PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED}"
      - name: brand_use_year
        type: integer
        source: input
        description: Calendar year this item evidences use of a mark in commerce; null when the item is not brand evidence.
        default: null
        constraints: "1800 .. 2100 or null"
      - name: status
        type: enum
        source: computed
        description: Item lifecycle; see §1.2 ArchivalItem.
        default: UNPROCESSED
        constraints: "One of {UNPROCESSED, ACCESSIONED, ON_LOAN, IN_TREATMENT, PENDING_DISPOSITION, DEACCESSIONED, REJECTED_ITEM}"
      - name: last_loan_window_end
        type: datetime
        source: computed
        description: window_end of the most recently created ExhibitLoan on this item with status in {REQUESTED, CONFIRMED, OUT, RETURNED}, ordered by ExhibitLoan.created_at ASC; null when no such loan exists.
        default: null

  - name: StorageZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Vault/zone code.
        constraints: "Unique across all StorageZone rows; 2..32 chars"
      - name: temperature_c
        type: number
        source: input
        description: Latest recorded dry-bulb temperature in Celsius, 1 decimal place.
      - name: relative_humidity_pct
        type: number
        source: input
        description: Latest recorded relative humidity percentage, 1 decimal place.
      - name: environmental_status
        type: enum
        source: computed
        description: Output of calculations.zone_environmental_status; recomputed on every environment reading.
        constraints: "One of {COMPLIANT, MARGINAL, NON_COMPLIANT}"
      - name: max_overlapping_migration_jobs
        type: integer
        source: input
        description: Aggregate ceiling on how many migration windows may cover any single instant in this zone.
        constraints: ">= 1 and <= 20"
      - name: reading_count
        type: integer
        source: computed
        description: Number of environment readings recorded against this zone, including the creation reading.
        default: 1

  - name: FindingAid
    parent: Accession
    common_fields: true
    fields:
      - name: accession_id
        type: string
        source: input
        description: "FK -> Accession.id; the accession this aid describes"
      - name: title
        type: string
        source: input
        description: Finding aid title.
        constraints: "1..200 chars"
      - name: arrangement_level
        type: enum
        source: input
        description: Deepest level of arrangement described.
        constraints: "One of {COLLECTION, SERIES, FILE, ITEM}"
      - name: version_label
        type: string
        source: input
        description: Human-readable revision label such as v1 or v2.
        constraints: "1..16 chars"
      - name: status
        type: enum
        source: computed
        description: Finding aid lifecycle; see §1.2 FindingAid.
        default: DRAFT
        constraints: "One of {DRAFT, UNDER_REVIEW, PUBLISHED, NEEDS_REVISION, WITHDRAWN}"
      - name: described_item_count
        type: integer
        source: computed
        description: Count of ArchivalItem rows with accession_id == this aid's accession_id and status != REJECTED_ITEM, evaluated at publish time and refreshed by every cascade that touches those items.
        default: 0
      - name: stale_item_count
        type: integer
        source: computed
        description: Count of ArchivalItem rows under the same accession whose status is PENDING_DISPOSITION or DEACCESSIONED.
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent PUBLISHED entry.
        default: null
      - name: revision_cycle_count
        type: integer
        source: computed
        description: Number of times this aid has re-entered UNDER_REVIEW from NEEDS_REVISION.
        default: 0

  - name: PreservationPlan
    parent: StorageZone
    common_fields: true
    fields:
      - name: storage_zone_id
        type: string
        source: input
        description: "FK -> StorageZone.id; the zone whose holdings this plan covers"
      - name: plan_name
        type: string
        source: input
        description: Plan name.
        constraints: "1..120 chars"
      - name: budget_cents
        type: integer
        source: input
        description: Total preservation budget in cents; conserved-quantity ceiling for §1.3 preservation_budget_conservation.
        constraints: ">= 0"
      - name: budget_committed_cents
        type: integer
        source: computed
        description: SUM(MigrationJob.committed_cost_cents) over jobs with preservation_plan_id == this id and status IN {APPROVED, IN_PROGRESS}. Jobs in PENDING_APPROVAL, REJECTED, CANCELLED and COMPLETED contribute zero.
        default: 0
      - name: budget_spent_cents
        type: integer
        source: computed
        description: SUM(MigrationJob.committed_cost_cents) over jobs with preservation_plan_id == this id and status == COMPLETED.
        default: 0
      - name: at_risk_unit_count
        type: integer
        source: computed
        description: Output of calculations.at_risk_unit_count for this plan's zone; reaching 0 while status == ACTIVE auto-transitions the plan to SATISFIED.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle; see §1.2 PreservationPlan.
        default: DRAFT
        constraints: "One of {DRAFT, ACTIVE, SATISFIED, CLOSED}"
      - name: satisfied_at
        type: datetime
        source: system
        description: Logical-clock instant at which at_risk_unit_count first reached 0 while ACTIVE.
        default: null

  - name: MigrationJob
    parent: PreservationPlan
    common_fields: true
    fields:
      - name: preservation_plan_id
        type: string
        source: input
        description: "FK -> PreservationPlan.id; the plan funding this job"
      - name: archival_item_id
        type: string
        source: input
        description: "FK -> ArchivalItem.id; the item being migrated"
      - name: target_format
        type: enum
        source: input
        description: Preservation master format produced by the migration.
        constraints: "One of {PRESERVATION_TIFF, PRESERVATION_WAV, PRESERVATION_MKV}"
      - name: units
        type: integer
        source: input
        description: Units of the item covered by this job; priced at the item's original_format rate.
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the treatment window; interval is CLOSED on both ends for zone capacity arithmetic.
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the treatment window; interval is CLOSED on both ends, so a window ending exactly when another begins still counts as covering that instant.
        constraints: "> window_start"
      - name: subtotal_cents
        type: integer
        source: computed
        description: Step 1 of calculations.migration_job_cost — format rate times units, before any discount.
        default: 0
      - name: volume_discount_pct
        type: number
        source: computed
        description: Step 2 of calculations.migration_job_cost — tier selected from subtotal_cents ONLY.
        default: 0
      - name: discounted_cents
        type: integer
        source: computed
        description: Step 3 of calculations.migration_job_cost.
        default: 0
      - name: handling_fee_cents
        type: integer
        source: computed
        description: Step 4 of calculations.migration_job_cost — tier selected from discounted_cents.
        default: 0
      - name: condition_surcharge_cents
        type: integer
        source: computed
        description: Step 5 of calculations.migration_job_cost.
        default: 0
      - name: committed_cost_cents
        type: integer
        source: computed
        description: Step 6 of calculations.migration_job_cost — the amount committed against the plan budget on approval.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Job lifecycle; see §1.2 MigrationJob.
        default: PENDING_APPROVAL
        constraints: "One of {PENDING_APPROVAL, APPROVED, IN_PROGRESS, COMPLETED, CANCELLED, REJECTED}"
      - name: requested_by
        type: string
        source: system
        description: X-User-ID of the PreservationOfficer that created the job.
      - name: approved_by
        type: string
        source: system
        description: X-User-ID of the PreservationOfficer that approved the job; must differ from requested_by.
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded on cancellation.
        default: null

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Requester's name as recorded by access services.
        constraints: "1..120 chars"
      - name: requester_class
        type: enum
        source: input
        description: Access-policy class; drives both confidentiality variants and the service fee rate.
        constraints: "One of {INTERNAL_BUSINESS, EXTERNAL_RESEARCHER, MEDIA}"
      - name: affiliation
        type: string
        source: input
        description: Employing business unit, institution or media outlet.
        constraints: "1..160 chars"
      - name: nda_on_file
        type: boolean
        source: input
        description: Whether a signed non-disclosure agreement is on file; grants the NDA risk credit.
        default: false
      - name: status
        type: enum
        source: computed
        description: Requester standing; SUSPENDED blocks access approval.
        default: ACTIVE
        constraints: "One of {ACTIVE, SUSPENDED}"
      - name: suspend_reason
        type: string
        source: input
        description: Reason recorded on suspension.
        default: null

  - name: AccessRequest
    parent: null
    common_fields: true
    fields:
      - name: requester_id
        type: string
        source: input
        description: "FK -> Requester.id; the requester on whose behalf the request is filed"
      - name: record_series_id
        type: string
        source: input
        description: "FK -> RecordSeries.id; the series whose holdings are requested"
      - name: finding_aid_id
        type: string
        source: input
        description: "FK -> FindingAid.id; the aid the requester cited, or null for an unmediated request"
        default: null
      - name: purpose
        type: string
        source: input
        description: Stated research/business purpose.
        constraints: "1..500 chars"
      - name: requested_item_ids
        type: array
        source: input
        description: Array of ArchivalItem.id values (see entities.ArchivalItem) whose accession_id must resolve to an Accession with record_series_id == this request's record_series_id. Emptiness is a business rejection, not a shape rejection.
        constraints: "0..50 elements, no duplicates; an empty array passes the priority-5 shape check and is rejected by validations[priority=31] with ERR_NO_QUALIFYING_EVIDENCE's sibling ERR_NO_ITEMS_REQUESTED"
      - name: requested_page_count
        type: integer
        source: computed
        description: PAGES_PER_UNIT times the sum of ArchivalItem.unit_count over requested_item_ids; used by calculations.access_service_fee.
        default: 0
      - name: prelim_risk_score
        type: integer
        source: computed
        description: Output of calculations.confidentiality_risk_score variant PRELIM, stamped at creation.
        default: 0
      - name: post_screen_risk_score
        type: integer
        source: computed
        description: Output of calculations.confidentiality_risk_score variant POST_SCREEN, stamped when the governing screening completes; null until then.
        default: null
      - name: service_fee_cents
        type: integer
        source: computed
        description: Output of calculations.access_service_fee, stamped when the request reaches APPROVED or PARTIALLY_APPROVED; null until then.
        default: null
      - name: status
        type: enum
        source: computed
        description: Request lifecycle; see §1.2 AccessRequest.
        default: SUBMITTED
        constraints: "One of {SUBMITTED, SCREENING, CHANGES_REQUESTED, APPROVED, PARTIALLY_APPROVED, DENIED, BLOCKED, REVALIDATION_REQUIRED, CLOSED}"
      - name: legal_hold_blocked
        type: boolean
        source: computed
        description: Set true by the LegalHold activation cascade when this request was moved to BLOCKED; cleared when the hold releases.
        default: false
      - name: revision_round
        type: integer
        source: computed
        description: Number of completed SCREENING -> CHANGES_REQUESTED -> SCREENING loops; increments on every POST /access-requests/{id}/revise.
        default: 0
      - name: current_screening_id
        type: string
        source: computed
        description: Id of the ConfidentialityScreening for this request whose status is OPEN or COMPLETED and which was created last by created_at ASC; null when none exists.
        default: null
      - name: decided_by
        type: string
        source: system
        description: X-User-ID of the AccessServicesOfficer that approved or denied the request.
        default: null
      - name: approval_scope
        type: enum
        source: input
        description: Scope granted at approval.
        default: null
        constraints: "One of {FULL, REDACTED} or null"
      - name: deny_reason
        type: string
        source: input
        description: Reason recorded on denial.
        default: null

  - name: ConfidentialityScreening
    parent: AccessRequest
    common_fields: true
    fields:
      - name: access_request_id
        type: string
        source: input
        description: "FK -> AccessRequest.id; the request under screening"
      - name: screened_by
        type: string
        source: system
        description: X-User-ID of the AccessServicesOfficer that created the screening; barred from later deciding the request.
      - name: max_item_sensitivity
        type: enum
        source: computed
        description: Highest ArchivalItem.sensitivity_level across the request's requested_item_ids, stamped at screening creation.
        constraints: "One of {PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED}"
      - name: redaction_required
        type: boolean
        source: input
        description: Whether redaction is required; recorded at completion and worth a risk credit.
        default: false
      - name: decision
        type: enum
        source: input
        description: Screening outcome recorded at completion.
        default: null
        constraints: "One of {GRANT_FULL, GRANT_REDACTED, DENY, CHANGES_REQUESTED} or null"
      - name: screening_note
        type: string
        source: input
        description: Free-text screening note.
        default: null
      - name: status
        type: enum
        source: computed
        description: Screening lifecycle; see §1.2 ConfidentialityScreening.
        default: OPEN
        constraints: "One of {OPEN, COMPLETED, SUPERSEDED}"
      - name: superseded_reason
        type: enum
        source: system
        description: Why this screening was superseded.
        default: null
        constraints: "One of {NEW_SCREENING, LEGAL_HOLD_BLOCK, REQUESTER_REVISION} or null"
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of completion.
        default: null

  - name: OralHistoryInterview
    parent: Accession
    common_fields: true
    fields:
      - name: accession_id
        type: string
        source: input
        description: "FK -> Accession.id; the accession holding this interview's recordings"
      - name: narrator_name
        type: string
        source: input
        description: Name of the narrator interviewed.
        constraints: "1..120 chars"
      - name: interview_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the interview was recorded.
      - name: embargo_until
        type: datetime
        source: input
        description: ISO 8601 UTC instant before which the transcript may not be released; null means no embargo.
        default: null
      - name: consent_status
        type: enum
        source: computed
        description: First independent state axis; see §1.2 OralHistoryInterview.
        default: PENDING
        constraints: "One of {PENDING, SIGNED, RESTRICTED, WITHDRAWN}"
      - name: transcription_status
        type: enum
        source: computed
        description: Second independent state axis; advances without reference to consent_status.
        default: NOT_STARTED
        constraints: "One of {NOT_STARTED, DRAFT, REVIEWED, APPROVED}"
      - name: release_state
        type: enum
        source: computed
        description: Output of calculations.interview_release_state — the joint reading of both axes plus the embargo clock.
        default: WITHHELD
        constraints: "One of {WITHHELD, RESEARCH_ROOM_ONLY, PUBLIC}"
      - name: consent_signed_at
        type: datetime
        source: system
        description: Logical-clock instant consent_status first became SIGNED.
        default: null
      - name: withdrawal_count
        type: integer
        source: computed
        description: Number of times consent_status moved to WITHDRAWN.
        default: 0

  - name: TrademarkEvidencePackage
    parent: RecordSeries
    common_fields: true
    fields:
      - name: record_series_id
        type: string
        source: input
        description: "FK -> RecordSeries.id; the series supplying continuous-use evidence"
      - name: mark_name
        type: string
        source: input
        description: Word mark or brand name whose continuous use is being evidenced.
        constraints: "1..120 chars"
      - name: claimed_first_use_year
        type: integer
        source: input
        description: Calendar year of first claimed use in commerce; start of the coverage span.
        constraints: "1800 .. 2100"
      - name: evidence_item_ids
        type: array
        source: input
        description: Array of ArchivalItem.id values (see entities.ArchivalItem) offered as evidence; items with null brand_use_year or status == DEACCESSIONED do not qualify.
        constraints: "0..80 elements, no duplicates"
      - name: qualifying_evidence_count
        type: integer
        source: computed
        description: Number of evidence_item_ids that qualify per calculations.continuous_use_coverage.
        default: 0
      - name: covered_year_count
        type: integer
        source: computed
        description: Count of distinct qualifying brand_use_year values inside the coverage span.
        default: 0
      - name: max_gap_years
        type: integer
        source: computed
        description: Largest run of consecutive uncovered years inside the coverage span, including the leading and trailing runs.
        default: 0
      - name: continuous_use_coverage_pct
        type: number
        source: computed
        description: Output of calculations.continuous_use_coverage, 2 decimal places.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Package lifecycle; see §1.2 TrademarkEvidencePackage.
        default: DRAFT
        constraints: "One of {DRAFT, CERTIFIED, REJECTED}"
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification.
        default: null
      - name: rejection_code
        type: enum
        source: computed
        description: Which certification gate failed, when status == REJECTED.
        default: null
        constraints: "One of {GAP_EXCEEDED, COVERAGE_BELOW_MINIMUM} or null"

  - name: ExhibitLoan
    parent: ArchivalItem
    common_fields: true
    fields:
      - name: archival_item_id
        type: string
        source: input
        description: "FK -> ArchivalItem.id; the item requested for display"
      - name: exhibit_name
        type: string
        source: input
        description: Anniversary, museum or exhibit project name.
        constraints: "1..160 chars"
      - name: units
        type: integer
        source: input
        description: Units of the item to be displayed; moved from units_on_shelf to units_on_loan at check-out.
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of display; interval is HALF-OPEN [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of display, exclusive; a light-recovery buffer is appended to it for conflict arithmetic.
        constraints: "> window_start"
      - name: recovery_until
        type: datetime
        source: computed
        description: window_end plus LIGHT_RECOVERY_BUFFER_DAYS; the effective end of this loan's occupation of the item.
      - name: status
        type: enum
        source: computed
        description: Loan lifecycle; see §1.2 ExhibitLoan.
        default: REQUESTED
        constraints: "One of {REQUESTED, CONFIRMED, OUT, RETURNED, CANCELLED}"
      - name: returned_condition_grade
        type: enum
        source: input
        description: Condition grade recorded at return; written back onto the item.
        default: null
        constraints: "One of {GOOD, FAIR, POOR, UNSTABLE} or null"
      - name: checked_out_at
        type: datetime
        source: system
        description: Logical-clock instant of check-out.
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: Logical-clock instant of return.
        default: null

  - name: DeaccessionProposal
    parent: ArchivalItem
    common_fields: true
    fields:
      - name: archival_item_id
        type: string
        source: input
        description: "FK -> ArchivalItem.id; the item proposed for removal"
      - name: rationale
        type: string
        source: input
        description: Curatorial rationale for removal.
        constraints: "1..500 chars"
      - name: route
        type: enum
        source: input
        description: Disposal route; DONATION requires recipient_repository.
        constraints: "One of {DESTRUCTION, DONATION}"
      - name: units
        type: integer
        source: input
        description: Units to remove; must not exceed the item's units_on_shelf at execution.
        constraints: ">= 1"
      - name: recipient_repository
        type: string
        source: input
        description: External repository receiving the donation; required when route == DONATION.
        default: null
      - name: status
        type: enum
        source: computed
        description: Proposal lifecycle; see §1.2 DeaccessionProposal (fork-join).
        default: SUBMITTED
        constraints: "One of {SUBMITTED, LEGAL_CLEARED, HERITAGE_CLEARED, DUALLY_CLEARED, APPROVED, EXECUTED, REJECTED}"
      - name: legal_cleared_by
        type: string
        source: system
        description: X-User-ID of the LegalCounsel operator that granted legal clearance.
        default: null
      - name: heritage_cleared_by
        type: string
        source: system
        description: X-User-ID of the ArchivesDirector that granted heritage clearance.
        default: null
      - name: approved_by
        type: string
        source: system
        description: X-User-ID of the ArchivesDirector that approved the proposal.
        default: null
      - name: clearance_note
        type: string
        source: input
        description: Note recorded with either clearance.
        default: null
      - name: transfer_reference
        type: string
        source: input
        description: Donation transfer receipt or destruction certificate reference recorded at execution.
        default: null
      - name: stale_finding_aid_count
        type: integer
        source: computed
        description: Number of FindingAid rows the approval cascade (hop 2) moved from PUBLISHED to NEEDS_REVISION.
        default: 0
      - name: revalidated_request_count
        type: integer
        source: computed
        description: Number of AccessRequest rows the approval cascade (hop 3) moved from APPROVED or PARTIALLY_APPROVED to REVALIDATION_REQUIRED.
        default: 0

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: RecordSeries
    initial_state: ACTIVE
    terminal_states: [DISPOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 1)"
        actor: system
        preconditions:
          - "series.disposition_state == ACTIVE"
          - "the activating LegalHold.record_series_id == series.id"
        side_effects:
          - "sets RecordSeries.pre_hold_disposition_state = 'ACTIVE'"
          - "sets RecordSeries.legal_hold_active = true"
          - "increments RecordSeries.version by 1 and refreshes updated_at"
          - "hop 2: every AccessRequest with record_series_id == series.id and status IN {SUBMITTED, SCREENING, CHANGES_REQUESTED} transitions to BLOCKED because the series became SUSPENDED"
        note: "First hop of the legal-hold cascade; see AccessRequest.*_to_BLOCKED for hop 2 and ConfidentialityScreening.OPEN_to_SUPERSEDED for hop 3."
      - from: ELIGIBLE_FOR_DISPOSITION
        to: SUSPENDED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 1)"
        actor: system
        preconditions:
          - "series.disposition_state == ELIGIBLE_FOR_DISPOSITION"
        side_effects:
          - "sets RecordSeries.pre_hold_disposition_state = 'ELIGIBLE_FOR_DISPOSITION'"
          - "sets RecordSeries.legal_hold_active = true"
          - "increments RecordSeries.version by 1 and refreshes updated_at"
      - from: PERMANENT
        to: SUSPENDED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 1)"
        actor: system
        preconditions:
          - "series.disposition_state == PERMANENT"
        side_effects:
          - "sets RecordSeries.pre_hold_disposition_state = 'PERMANENT'"
          - "sets RecordSeries.legal_hold_active = true"
          - "increments RecordSeries.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /legal-holds/{id}/release"
        actor: system
        preconditions:
          - "series.pre_hold_disposition_state == 'ACTIVE'"
          - "no other LegalHold with record_series_id == series.id has status == ACTIVE after this release"
        side_effects:
          - "restores disposition_state from pre_hold_disposition_state, then sets pre_hold_disposition_state = null"
          - "sets RecordSeries.legal_hold_active = false"
          - "every AccessRequest with record_series_id == series.id and status == BLOCKED and legal_hold_blocked == true returns to SUBMITTED with legal_hold_blocked = false"
          - "increments RecordSeries.version by 1 and refreshes updated_at"
        note: "Completes the ACTIVE -> SUSPENDED -> ACTIVE cycle."
      - from: SUSPENDED
        to: ELIGIBLE_FOR_DISPOSITION
        trigger: "POST /legal-holds/{id}/release"
        actor: system
        preconditions:
          - "series.pre_hold_disposition_state == 'ELIGIBLE_FOR_DISPOSITION'"
        side_effects:
          - "restores disposition_state, clears pre_hold_disposition_state, sets legal_hold_active = false"
          - "increments RecordSeries.version by 1"
      - from: SUSPENDED
        to: PERMANENT
        trigger: "POST /legal-holds/{id}/release"
        actor: system
        preconditions:
          - "series.pre_hold_disposition_state == 'PERMANENT'"
        side_effects:
          - "restores disposition_state, clears pre_hold_disposition_state, sets legal_hold_active = false"
          - "increments RecordSeries.version by 1"
      - from: ACTIVE
        to: PERMANENT
        trigger: "POST /appraisals/{id}/finalize"
        actor: system
        preconditions:
          - "series.disposition_state == ACTIVE"
          - "appraisal.recommended_disposition == PERMANENT"
        side_effects:
          - "sets RecordSeries.current_appraisal_id = appraisal.id"
          - "increments RecordSeries.version by 1"
      - from: ACTIVE
        to: ELIGIBLE_FOR_DISPOSITION
        trigger: "POST /appraisals/{id}/finalize"
        actor: system
        preconditions:
          - "series.disposition_state == ACTIVE"
          - "appraisal.recommended_disposition IN {DESTROY, REVIEW, TRANSFER}"
          - "logical clock >= series.retention_expiry_utc"
        side_effects:
          - "sets RecordSeries.current_appraisal_id = appraisal.id"
          - "increments RecordSeries.version by 1"
        note: "When recommended_disposition is non-PERMANENT but the clock is still before retention_expiry_utc, disposition_state stays ACTIVE and only current_appraisal_id changes."
      - from: ELIGIBLE_FOR_DISPOSITION
        to: DISPOSED
        trigger: "POST /record-series/{id}/dispose"
        actor: ArchivesDirector
        preconditions:
          - "series.disposition_state == ELIGIBLE_FOR_DISPOSITION"
          - "series.legal_hold_active == false"
          - "logical clock >= series.retention_expiry_utc"
          - "no ArchivalItem under any Accession of this series has status == ON_LOAN"
        side_effects:
          - "stores disposition_certificate_reference"
          - "every FindingAid whose accession_id belongs to this series and whose status == PUBLISHED transitions to WITHDRAWN"
          - "increments RecordSeries.version by 1"

  - entity: LegalHold
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /legal-holds/{id}/activate"
        actor: LegalCounsel
        preconditions:
          - "hold.status == DRAFT"
          - "no other LegalHold with the same record_series_id has status == ACTIVE"
        side_effects:
          - "stamps activated_at from the logical clock"
          - "cascade hop 1: the referenced RecordSeries moves to SUSPENDED (see RecordSeries.ACTIVE_to_SUSPENDED)"
          - "stamps suspended_access_request_count with the number of AccessRequest rows hop 2 moved to BLOCKED"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /legal-holds/{id}/release"
        actor: LegalCounsel
        preconditions:
          - "hold.status == ACTIVE"
        side_effects:
          - "stamps released_at from the logical clock and stores release_note"
          - "the referenced RecordSeries restores its pre-hold disposition_state (see RecordSeries.SUSPENDED_to_ACTIVE)"
          - "AccessRequest rows blocked by this hold return to SUBMITTED"

  - entity: AppraisalRecord
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /appraisals/{id}/screen"
        actor: Archivist
        preconditions:
          - "appraisal.status == DRAFT"
          - "series.disposition_state != SUSPENDED"
        side_effects:
          - "runs calculations.appraisal_score variant SCREENING and stores screening_score"
      - from: SCREENED
        to: FINAL
        trigger: "POST /appraisals/{id}/finalize"
        actor: ArchivesDirector
        preconditions:
          - "appraisal.status == SCREENED"
          - "series.disposition_state IN {ACTIVE}"
          - "series.legal_hold_active == false"
        side_effects:
          - "runs calculations.appraisal_score variant FINAL and stores final_score and brand_heritage_counted"
          - "derives recommended_disposition from final_score against retention_schedule.min_appraisal_score_for_permanent"
          - "drives the RecordSeries transition to PERMANENT or ELIGIBLE_FOR_DISPOSITION"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /appraisals (a newer appraisal is created for the same series)"
        actor: system
        preconditions:
          - "appraisal.status IN {DRAFT, SCREENED}"
          - "the new appraisal's record_series_id == this appraisal's record_series_id"
        side_effects:
          - "stores superseded_by_appraisal_id = the new appraisal's id"
      - from: SCREENED
        to: SUPERSEDED
        trigger: "POST /appraisals (a newer appraisal is created for the same series)"
        actor: system
        preconditions:
          - "appraisal.status == SCREENED"
        side_effects:
          - "stores superseded_by_appraisal_id = the new appraisal's id"
        note: "This supersede-on-create is exactly the true race guarded by concurrency_rules.appraisal-create-stale-series."

  - entity: Accession
    initial_state: RECEIVED
    terminal_states: [PROCESSED, REJECTED]
    transitions:
      - from: RECEIVED
        to: PROVENANCE_VERIFIED
        trigger: "POST /accessions/{id}/verify-provenance"
        actor: Archivist
        preconditions:
          - "accession.status == RECEIVED"
          - "series.disposition_state != SUSPENDED"
        side_effects:
          - "sets provenance_documented = true and stores provenance_statement plus transfer_instrument_reference"
      - from: PROVENANCE_VERIFIED
        to: PROCESSED
        trigger: "POST /accessions/{id}/process"
        actor: Archivist
        preconditions:
          - "accession.status == PROVENANCE_VERIFIED"
          - "accession.processed_unit_count == accession.declared_unit_count"
        side_effects:
          - "every ArchivalItem with accession_id == this id and status == UNPROCESSED transitions to ACCESSIONED with units_on_shelf = unit_count"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /accessions/{id}/reject"
        actor: ArchivesDirector
        preconditions:
          - "accession.status == RECEIVED"
        side_effects:
          - "stores rejection_reason"
          - "every ArchivalItem with accession_id == this id and status == UNPROCESSED transitions to REJECTED_ITEM"

  - entity: ArchivalItem
    initial_state: UNPROCESSED
    terminal_states: [DEACCESSIONED, REJECTED_ITEM]
    transitions:
      - from: UNPROCESSED
        to: ACCESSIONED
        trigger: "POST /accessions/{id}/process"
        actor: system
        preconditions:
          - "item.status == UNPROCESSED"
          - "parent Accession moved to PROCESSED in this request"
        side_effects:
          - "sets units_on_shelf = unit_count, units_on_loan = 0, units_deaccessioned = 0"
          - "sets preservation_format = original_format"
      - from: UNPROCESSED
        to: REJECTED_ITEM
        trigger: "POST /accessions/{id}/reject"
        actor: system
        preconditions:
          - "item.status == UNPROCESSED"
        side_effects:
          - "sets units_on_shelf = 0"
      - from: ACCESSIONED
        to: ON_LOAN
        trigger: "POST /exhibit-loans/{id}/check-out"
        actor: system
        preconditions:
          - "item.status == ACCESSIONED"
          - "item.units_on_shelf >= loan.units"
        side_effects:
          - "units_on_shelf -= loan.units and units_on_loan += loan.units, preserving unit_count = units_on_shelf + units_on_loan + units_deaccessioned"
      - from: ON_LOAN
        to: ACCESSIONED
        trigger: "POST /exhibit-loans/{id}/return"
        actor: system
        preconditions:
          - "item.status == ON_LOAN"
        side_effects:
          - "units_on_loan -= loan.units and units_on_shelf += loan.units, restoring the pre-check-out split exactly"
          - "overwrites condition_grade with loan.returned_condition_grade"
        note: "Compensating action for check-out; unit_count = units_on_shelf + units_on_loan + units_deaccessioned holds before and after."
      - from: ACCESSIONED
        to: IN_TREATMENT
        trigger: "POST /migration-jobs/{id}/start"
        actor: system
        preconditions:
          - "item.status == ACCESSIONED"
        side_effects:
          - "no unit movement; the item stays shelved in its zone while under treatment"
      - from: IN_TREATMENT
        to: ACCESSIONED
        trigger: "POST /migration-jobs/{id}/complete"
        actor: system
        preconditions:
          - "item.status == IN_TREATMENT"
        side_effects:
          - "sets preservation_format = job.target_format and digital_surrogate_available = true"
          - "cascade hop 2: the plan covering this item's zone recomputes at_risk_unit_count because the surrogate now exists"
      - from: IN_TREATMENT
        to: ACCESSIONED
        trigger: "POST /migration-jobs/{id}/cancel"
        actor: system
        preconditions:
          - "item.status == IN_TREATMENT"
          - "job.status == IN_PROGRESS"
        side_effects:
          - "leaves preservation_format and digital_surrogate_available untouched"
      - from: ACCESSIONED
        to: PENDING_DISPOSITION
        trigger: "POST /deaccession-proposals/{id}/approve"
        actor: system
        preconditions:
          - "item.status == ACCESSIONED"
        side_effects:
          - "cascade hop 2: every PUBLISHED FindingAid under the item's accession moves to NEEDS_REVISION because the item entered PENDING_DISPOSITION"
      - from: PENDING_DISPOSITION
        to: DEACCESSIONED
        trigger: "POST /deaccession-proposals/{id}/execute"
        actor: system
        preconditions:
          - "item.status == PENDING_DISPOSITION"
          - "proposal.units == item.units_on_shelf"
        side_effects:
          - "units_on_shelf -= proposal.units and units_deaccessioned += proposal.units"
      - from: PENDING_DISPOSITION
        to: ACCESSIONED
        trigger: "POST /deaccession-proposals/{id}/execute"
        actor: system
        preconditions:
          - "item.status == PENDING_DISPOSITION"
          - "proposal.units < item.units_on_shelf"
        side_effects:
          - "units_on_shelf -= proposal.units and units_deaccessioned += proposal.units; the item returns to ACCESSIONED because units remain"
        note: "Partial deaccession: the conserved sum unit_count = units_on_shelf + units_on_loan + units_deaccessioned is unchanged by execution."

  - entity: FindingAid
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /finding-aids/{id}/submit-review"
        actor: Archivist
        preconditions:
          - "aid.status == DRAFT"
          - "the parent Accession.status == PROCESSED"
        side_effects:
          - "recomputes described_item_count and stale_item_count"
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /finding-aids/{id}/publish"
        actor: ArchivesDirector
        preconditions:
          - "aid.status == UNDER_REVIEW"
          - "aid.stale_item_count == 0"
        side_effects:
          - "stamps published_at from the logical clock"
          - "recomputes described_item_count"
      - from: PUBLISHED
        to: NEEDS_REVISION
        trigger: "POST /deaccession-proposals/{id}/approve (cascade hop 2)"
        actor: system
        preconditions:
          - "aid.status == PUBLISHED"
          - "an ArchivalItem under aid.accession_id entered PENDING_DISPOSITION in this request"
        side_effects:
          - "increments stale_item_count by 1"
          - "cascade hop 3: every AccessRequest with finding_aid_id == aid.id and status == APPROVED moves to REVALIDATION_REQUIRED because the aid became NEEDS_REVISION"
      - from: NEEDS_REVISION
        to: UNDER_REVIEW
        trigger: "POST /finding-aids/{id}/submit-review"
        actor: Archivist
        preconditions:
          - "aid.status == NEEDS_REVISION"
        side_effects:
          - "increments revision_cycle_count by 1"
          - "recomputes described_item_count and stale_item_count"
        note: "Closes the PUBLISHED -> NEEDS_REVISION -> UNDER_REVIEW -> PUBLISHED cycle."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /record-series/{id}/dispose"
        actor: system
        preconditions:
          - "aid.status == PUBLISHED"
          - "aid.accession_id belongs to the series being disposed"
        side_effects:
          - "no further transitions are possible from WITHDRAWN"

  - entity: PreservationPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /preservation-plans/{id}/activate"
        actor: PreservationOfficer
        preconditions:
          - "plan.status == DRAFT"
          - "plan.budget_cents >= 1"
        side_effects:
          - "recomputes at_risk_unit_count from the zone's holdings"
      - from: ACTIVE
        to: SATISFIED
        trigger: "POST /migration-jobs/{id}/complete (cascade hop 3)"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.at_risk_unit_count recomputed to 0 in this request"
        side_effects:
          - "stamps satisfied_at from the logical clock"
          - "moves budget_committed_cents for the completed job into budget_spent_cents"
      - from: SATISFIED
        to: CLOSED
        trigger: "POST /preservation-plans/{id}/close"
        actor: PreservationOfficer
        preconditions:
          - "plan.status == SATISFIED"
          - "no MigrationJob with preservation_plan_id == plan.id has status IN {PENDING_APPROVAL, APPROVED, IN_PROGRESS}"
        side_effects:
          - "no further transitions are possible from CLOSED"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /preservation-plans/{id}/close"
        actor: PreservationOfficer
        preconditions:
          - "plan.status == ACTIVE"
          - "no MigrationJob with preservation_plan_id == plan.id has status IN {PENDING_APPROVAL, APPROVED, IN_PROGRESS}"
        side_effects:
          - "no further transitions are possible from CLOSED"

  - entity: MigrationJob
    initial_state: PENDING_APPROVAL
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /migration-jobs/{id}/approve"
        actor: PreservationOfficer
        preconditions:
          - "job.status == PENDING_APPROVAL"
          - "plan.status == ACTIVE"
          - "X-User-ID != job.requested_by"
          - "plan.budget_committed_cents + job.committed_cost_cents <= plan.budget_cents"
          - "inserting this job's CLOSED window keeps the zone's overlapping approved/in-progress job count <= zone.max_overlapping_migration_jobs at every instant"
        side_effects:
          - "stamps approved_by with X-User-ID"
          - "adds job.committed_cost_cents to plan.budget_committed_cents"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /migration-jobs/{id}/cancel"
        actor: PreservationOfficer
        preconditions:
          - "job.status == PENDING_APPROVAL"
        side_effects:
          - "stores cancel_reason; plan.budget_committed_cents is unchanged because nothing was committed"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /migration-jobs/{id}/start"
        actor: PreservationOfficer
        preconditions:
          - "job.status == APPROVED"
          - "the item's StorageZone.environmental_status == COMPLIANT"
          - "item.status == ACCESSIONED"
        side_effects:
          - "the item transitions ACCESSIONED -> IN_TREATMENT"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /migration-jobs/{id}/complete"
        actor: PreservationOfficer
        preconditions:
          - "job.status == IN_PROGRESS"
        side_effects:
          - "cascade hop 1: the item returns to ACCESSIONED with preservation_format = target_format and digital_surrogate_available = true"
          - "cascade hop 2 -> hop 3: the plan recomputes at_risk_unit_count and, when it reaches 0, auto-transitions ACTIVE -> SATISFIED"
          - "subtracts committed_cost_cents from plan.budget_committed_cents and adds it to plan.budget_spent_cents"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /migration-jobs/{id}/cancel"
        actor: PreservationOfficer
        preconditions:
          - "job.status == APPROVED"
        side_effects:
          - "stores cancel_reason"
          - "subtracts exactly committed_cost_cents from plan.budget_committed_cents, restoring the pre-approval value"
        note: "Compensating action for approve; the invariant plan.budget_committed_cents == SUM(committed_cost_cents of APPROVED/IN_PROGRESS jobs) is re-established with zero drift."
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /migration-jobs/{id}/cancel"
        actor: PreservationOfficer
        preconditions:
          - "job.status == IN_PROGRESS"
        side_effects:
          - "stores cancel_reason"
          - "subtracts exactly committed_cost_cents from plan.budget_committed_cents"
          - "the item returns IN_TREATMENT -> ACCESSIONED with preservation_format unchanged"

  - entity: Requester
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /requesters/{id}/suspend"
        actor: AccessServicesOfficer
        preconditions:
          - "requester.status == ACTIVE"
        side_effects:
          - "stores suspend_reason; existing AccessRequest rows keep their status but can no longer be approved"

  - entity: AccessRequest
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /access-requests/{id}/begin-screening"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "series.disposition_state != SUSPENDED"
          - "requester.status == ACTIVE"
        side_effects:
          - "no calculation runs; prelim_risk_score stamped at creation is retained"
      - from: REVALIDATION_REQUIRED
        to: SCREENING
        trigger: "POST /access-requests/{id}/begin-screening"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == REVALIDATION_REQUIRED"
          - "series.disposition_state != SUSPENDED"
        side_effects:
          - "clears service_fee_cents and post_screen_risk_score back to null; a fresh screening must be created"
      - from: SCREENING
        to: CHANGES_REQUESTED
        trigger: "POST /confidentiality-screenings/{id}/complete with decision == CHANGES_REQUESTED"
        actor: system
        preconditions:
          - "request.status == SCREENING"
          - "screening.access_request_id == request.id"
        side_effects:
          - "stamps post_screen_risk_score from calculations.confidentiality_risk_score variant POST_SCREEN"
      - from: CHANGES_REQUESTED
        to: SCREENING
        trigger: "POST /access-requests/{id}/revise"
        actor: Requester
        preconditions:
          - "request.status == CHANGES_REQUESTED"
          - "X-User-ID == request.requester_id"
        side_effects:
          - "increments revision_round by 1"
          - "recomputes requested_page_count and prelim_risk_score from the revised requested_item_ids"
          - "every ConfidentialityScreening with access_request_id == request.id and status IN {OPEN, COMPLETED} moves to SUPERSEDED with superseded_reason = REQUESTER_REVISION"
        note: "Closes the SCREENING -> CHANGES_REQUESTED -> SCREENING revision cycle."
      - from: SCREENING
        to: APPROVED
        trigger: "POST /access-requests/{id}/approve with approval_scope == FULL"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == SCREENING"
          - "the request's current_screening_id resolves to a screening with status == COMPLETED and decision == GRANT_FULL"
          - "X-User-ID != that screening's screened_by"
          - "requester.status == ACTIVE"
          - "series.disposition_state NOT IN {SUSPENDED, DISPOSED}"
          - "request.finding_aid_id is null OR the referenced FindingAid.status == PUBLISHED"
          - "request.post_screen_risk_score < RISK_REDACTION_THRESHOLD"
        side_effects:
          - "runs calculations.access_service_fee and stores service_fee_cents"
          - "stamps decided_by with X-User-ID and stores approval_scope = FULL"
      - from: SCREENING
        to: PARTIALLY_APPROVED
        trigger: "POST /access-requests/{id}/approve with approval_scope == REDACTED"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == SCREENING"
          - "the request's current_screening_id resolves to a screening with status == COMPLETED and decision IN {GRANT_FULL, GRANT_REDACTED}"
          - "X-User-ID != that screening's screened_by"
          - "requester.status == ACTIVE"
          - "series.disposition_state NOT IN {SUSPENDED, DISPOSED}"
          - "request.finding_aid_id is null OR the referenced FindingAid.status == PUBLISHED"
        side_effects:
          - "runs calculations.access_service_fee and stores service_fee_cents"
          - "stamps decided_by with X-User-ID and stores approval_scope = REDACTED"
        note: "REDACTED scope is the only approval permitted once post_screen_risk_score >= RISK_REDACTION_THRESHOLD."
      - from: SCREENING
        to: DENIED
        trigger: "POST /access-requests/{id}/deny"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == SCREENING"
          - "the request's current_screening_id resolves to a screening with status == COMPLETED"
          - "X-User-ID != that screening's screened_by"
        side_effects:
          - "stores deny_reason and stamps decided_by; service_fee_cents stays null"
      - from: SUBMITTED
        to: BLOCKED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 2)"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
          - "request.record_series_id == the suspended series' id"
        side_effects:
          - "sets legal_hold_blocked = true"
          - "increments RecordSeries.blocked_access_request_count by 1"
      - from: SCREENING
        to: BLOCKED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 2)"
        actor: system
        preconditions:
          - "request.status == SCREENING"
          - "request.record_series_id == the suspended series' id"
        side_effects:
          - "sets legal_hold_blocked = true"
          - "increments RecordSeries.blocked_access_request_count by 1"
          - "cascade hop 3: every ConfidentialityScreening with access_request_id == request.id and status == OPEN moves to SUPERSEDED with superseded_reason = LEGAL_HOLD_BLOCK because this request became BLOCKED"
      - from: CHANGES_REQUESTED
        to: BLOCKED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 2)"
        actor: system
        preconditions:
          - "request.status == CHANGES_REQUESTED"
        side_effects:
          - "sets legal_hold_blocked = true"
          - "increments RecordSeries.blocked_access_request_count by 1"
      - from: BLOCKED
        to: SUBMITTED
        trigger: "POST /legal-holds/{id}/release"
        actor: system
        preconditions:
          - "request.status == BLOCKED and request.legal_hold_blocked == true"
          - "no remaining LegalHold on the series has status == ACTIVE"
        side_effects:
          - "sets legal_hold_blocked = false and decrements RecordSeries.blocked_access_request_count by 1"
        note: "Unblocking always lands on SUBMITTED regardless of the pre-block status; a new screening cycle is required."
      - from: APPROVED
        to: REVALIDATION_REQUIRED
        trigger: "POST /deaccession-proposals/{id}/approve (cascade hop 3)"
        actor: system
        preconditions:
          - "request.status == APPROVED"
          - "request.finding_aid_id == the aid that moved to NEEDS_REVISION in this request"
        side_effects:
          - "increments DeaccessionProposal.revalidated_request_count by 1"
      - from: PARTIALLY_APPROVED
        to: REVALIDATION_REQUIRED
        trigger: "POST /deaccession-proposals/{id}/approve (cascade hop 3)"
        actor: system
        preconditions:
          - "request.status == PARTIALLY_APPROVED"
          - "request.finding_aid_id == the aid that moved to NEEDS_REVISION in this request"
        side_effects:
          - "increments DeaccessionProposal.revalidated_request_count by 1"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /access-requests/{id}/close"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status IN {APPROVED, PARTIALLY_APPROVED, DENIED}"
        side_effects:
          - "no further transitions are possible from CLOSED"
      - from: PARTIALLY_APPROVED
        to: CLOSED
        trigger: "POST /access-requests/{id}/close"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == PARTIALLY_APPROVED"
        side_effects: ["terminal"]
      - from: DENIED
        to: CLOSED
        trigger: "POST /access-requests/{id}/close"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == DENIED"
        side_effects: ["terminal"]
      - from: DENIED
        to: CLOSED
        trigger: "POST /access-requests/{id}/close"
        actor: AccessServicesOfficer
        preconditions:
          - "request.status == DENIED"
        side_effects: ["terminal"]

  - entity: ConfidentialityScreening
    initial_state: OPEN
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /confidentiality-screenings/{id}/complete"
        actor: AccessServicesOfficer
        preconditions:
          - "screening.status == OPEN"
          - "the parent AccessRequest.status == SCREENING"
        side_effects:
          - "stores decision, redaction_required and screening_note; stamps completed_at"
          - "stamps AccessRequest.post_screen_risk_score via calculations.confidentiality_risk_score variant POST_SCREEN"
          - "when decision == CHANGES_REQUESTED the parent request moves SCREENING -> CHANGES_REQUESTED"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /confidentiality-screenings (a newer screening is created for the same request)"
        actor: system
        preconditions:
          - "screening.status == OPEN"
          - "the new screening's access_request_id == this screening's access_request_id"
        side_effects:
          - "sets superseded_reason = NEW_SCREENING"
        note: "This supersede-on-create is exactly the true race guarded by concurrency_rules.screening-create-stale-request."
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "POST /confidentiality-screenings (a newer screening is created for the same request)"
        actor: system
        preconditions:
          - "screening.status == COMPLETED"
        side_effects:
          - "sets superseded_reason = NEW_SCREENING"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /legal-holds/{id}/activate (cascade hop 3)"
        actor: system
        preconditions:
          - "screening.status == OPEN"
          - "the parent AccessRequest moved SCREENING -> BLOCKED in this request"
        side_effects:
          - "sets superseded_reason = LEGAL_HOLD_BLOCK"

  - entity: "OralHistoryInterview#consent_status"
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /oral-history-interviews/{id}/consent with consent_action == SIGN"
        actor: Archivist
        preconditions:
          - "interview.consent_status == PENDING"
        side_effects:
          - "stamps consent_signed_at; recomputes release_state; transcription_status is untouched"
      - from: SIGNED
        to: RESTRICTED
        trigger: "POST /oral-history-interviews/{id}/consent with consent_action == RESTRICT"
        actor: Archivist
        preconditions:
          - "interview.consent_status == SIGNED"
        side_effects:
          - "recomputes release_state; transcription_status is untouched"
      - from: RESTRICTED
        to: SIGNED
        trigger: "POST /oral-history-interviews/{id}/consent with consent_action == SIGN"
        actor: Archivist
        preconditions:
          - "interview.consent_status == RESTRICTED"
        side_effects:
          - "recomputes release_state"
        note: "SIGNED <-> RESTRICTED is a cycle on the consent axis alone."
      - from: SIGNED
        to: WITHDRAWN
        trigger: "POST /oral-history-interviews/{id}/consent with consent_action == WITHDRAW"
        actor: Archivist
        preconditions:
          - "interview.consent_status == SIGNED"
        side_effects:
          - "increments withdrawal_count; forces release_state = WITHHELD irrespective of transcription_status"
      - from: RESTRICTED
        to: WITHDRAWN
        trigger: "POST /oral-history-interviews/{id}/consent with consent_action == WITHDRAW"
        actor: Archivist
        preconditions:
          - "interview.consent_status == RESTRICTED"
        side_effects:
          - "increments withdrawal_count; forces release_state = WITHHELD"

  - entity: "OralHistoryInterview#transcription_status"
    initial_state: NOT_STARTED
    terminal_states: [APPROVED]
    transitions:
      - from: NOT_STARTED
        to: DRAFT
        trigger: "POST /oral-history-interviews/{id}/transcription with transcription_action == START_DRAFT"
        actor: Archivist
        preconditions:
          - "interview.transcription_status == NOT_STARTED"
        side_effects:
          - "recomputes release_state; consent_status is untouched, so drafting is legal even while consent is PENDING"
      - from: DRAFT
        to: REVIEWED
        trigger: "POST /oral-history-interviews/{id}/transcription with transcription_action == MARK_REVIEWED"
        actor: Archivist
        preconditions:
          - "interview.transcription_status == DRAFT"
        side_effects:
          - "recomputes release_state"
      - from: REVIEWED
        to: APPROVED
        trigger: "POST /oral-history-interviews/{id}/transcription with transcription_action == APPROVE"
        actor: Archivist
        preconditions:
          - "interview.transcription_status == REVIEWED"
          - "interview.consent_status == SIGNED"
          - "interview.embargo_until is null OR logical clock >= interview.embargo_until"
        side_effects:
          - "recomputes release_state to PUBLIC"
        note: "The only point where the two axes interact: approving a transcript reads the consent axis and the embargo clock."

  - entity: TrademarkEvidencePackage
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /trademark-evidence-packages/{id}/certify"
        actor: LegalCounsel
        preconditions:
          - "package.status == DRAFT"
          - "qualifying_evidence_count >= 1"
          - "max_gap_years <= MAX_ALLOWED_GAP_YEARS"
          - "continuous_use_coverage_pct >= MIN_COVERAGE_PCT"
        side_effects:
          - "runs calculations.continuous_use_coverage and stores qualifying_evidence_count, covered_year_count, max_gap_years, continuous_use_coverage_pct"
          - "stamps certified_at from the logical clock"
          - "makes the series eligible for brand_heritage_value in the FINAL appraisal variant"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /trademark-evidence-packages/{id}/certify"
        actor: LegalCounsel
        preconditions:
          - "package.status == DRAFT"
          - "qualifying_evidence_count >= 1"
          - "max_gap_years > MAX_ALLOWED_GAP_YEARS OR continuous_use_coverage_pct < MIN_COVERAGE_PCT"
        side_effects:
          - "stores the computed coverage fields and sets rejection_code to GAP_EXCEEDED when the gap gate failed, else COVERAGE_BELOW_MINIMUM"
        note: "The gap gate is evaluated before the coverage gate, so a package failing both is stamped GAP_EXCEEDED. A package with qualifying_evidence_count == 0 is not transitioned at all — it is rejected with ERR_NO_QUALIFYING_EVIDENCE and stays DRAFT."

  - entity: ExhibitLoan
    initial_state: REQUESTED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /exhibit-loans/{id}/confirm"
        actor: PreservationOfficer
        preconditions:
          - "loan.status == REQUESTED"
          - "item.status == ACCESSIONED"
          - "item.condition_grade IN {GOOD, FAIR}"
          - "item.units_on_shelf >= loan.units"
        side_effects:
          - "no unit movement yet; units move at check-out"
      - from: CONFIRMED
        to: OUT
        trigger: "POST /exhibit-loans/{id}/check-out"
        actor: Archivist
        preconditions:
          - "loan.status == CONFIRMED"
          - "item.units_on_shelf >= loan.units"
          - "logical clock >= loan.window_start"
        side_effects:
          - "the item transitions ACCESSIONED -> ON_LOAN moving loan.units from units_on_shelf to units_on_loan"
          - "stamps checked_out_at from the logical clock"
      - from: OUT
        to: RETURNED
        trigger: "POST /exhibit-loans/{id}/return"
        actor: Archivist
        preconditions:
          - "loan.status == OUT"
        side_effects:
          - "the item transitions ON_LOAN -> ACCESSIONED moving loan.units back from units_on_loan to units_on_shelf"
          - "overwrites item.condition_grade with returned_condition_grade and stamps returned_at"
        note: "Compensating action for check-out; the conserved quantity unit_count = units_on_shelf + units_on_loan + units_deaccessioned is identical before check-out and after return."
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /exhibit-loans/{id}/cancel"
        actor: ArchivesDirector
        preconditions:
          - "loan.status == REQUESTED"
        side_effects:
          - "frees the item's occupation window (including its light-recovery buffer) for later loans"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /exhibit-loans/{id}/cancel"
        actor: ArchivesDirector
        preconditions:
          - "loan.status == CONFIRMED"
        side_effects:
          - "frees the item's occupation window (including its light-recovery buffer) for later loans"

  - entity: DeaccessionProposal
    initial_state: SUBMITTED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: LEGAL_CLEARED
        trigger: "POST /deaccession-proposals/{id}/legal-clearance"
        actor: LegalCounsel
        preconditions:
          - "proposal.status == SUBMITTED"
          - "the item's series legal_hold_active == false"
          - "the item's series disposition_state != PERMANENT"
        side_effects:
          - "stamps legal_cleared_by with X-User-ID and stores clearance_note"
        note: "Fork branch A of the fork-join; branch order is free."
      - from: SUBMITTED
        to: HERITAGE_CLEARED
        trigger: "POST /deaccession-proposals/{id}/heritage-clearance"
        actor: ArchivesDirector
        preconditions:
          - "proposal.status == SUBMITTED"
          - "the item's series disposition_state != PERMANENT"
        side_effects:
          - "stamps heritage_cleared_by with X-User-ID and stores clearance_note"
        note: "Fork branch B of the fork-join."
      - from: LEGAL_CLEARED
        to: DUALLY_CLEARED
        trigger: "POST /deaccession-proposals/{id}/heritage-clearance"
        actor: ArchivesDirector
        preconditions:
          - "proposal.status == LEGAL_CLEARED"
          - "the item's series disposition_state != PERMANENT"
        side_effects:
          - "stamps heritage_cleared_by with X-User-ID"
        note: "Join point reached via branch A then branch B."
      - from: HERITAGE_CLEARED
        to: DUALLY_CLEARED
        trigger: "POST /deaccession-proposals/{id}/legal-clearance"
        actor: LegalCounsel
        preconditions:
          - "proposal.status == HERITAGE_CLEARED"
          - "the item's series legal_hold_active == false"
        side_effects:
          - "stamps legal_cleared_by with X-User-ID"
        note: "Join point reached via branch B then branch A."
      - from: DUALLY_CLEARED
        to: APPROVED
        trigger: "POST /deaccession-proposals/{id}/approve"
        actor: ArchivesDirector
        preconditions:
          - "proposal.status == DUALLY_CLEARED"
          - "proposal.legal_cleared_by is not null AND proposal.heritage_cleared_by is not null"
          - "X-User-ID != proposal.legal_cleared_by"
          - "route == DONATION implies recipient_repository is not null"
          - "no ExhibitLoan on the item has status IN {REQUESTED, CONFIRMED, OUT}"
        side_effects:
          - "stamps approved_by with X-User-ID"
          - "cascade hop 1: the item transitions ACCESSIONED -> PENDING_DISPOSITION"
          - "cascade hop 2: every PUBLISHED FindingAid under the item's accession moves to NEEDS_REVISION; stale_finding_aid_count records how many"
          - "cascade hop 3: every AccessRequest citing one of those aids and sitting in APPROVED or PARTIALLY_APPROVED moves to REVALIDATION_REQUIRED; revalidated_request_count records how many"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /deaccession-proposals/{id}/execute"
        actor: Archivist
        preconditions:
          - "proposal.status == APPROVED"
          - "item.status == PENDING_DISPOSITION"
          - "proposal.units <= item.units_on_shelf"
        side_effects:
          - "DESTRUCTION branch: units move units_on_shelf -> units_deaccessioned and transfer_reference stores the destruction certificate reference"
          - "DONATION branch: units move units_on_shelf -> units_deaccessioned, transfer_reference stores the receiving repository's receipt, and recipient_repository is copied onto the item's audit trail"
          - "the parent Accession recomputes deaccessioned_unit_count"
          - "the item lands in DEACCESSIONED when units_on_shelf reaches 0, else returns to ACCESSIONED"
        note: "Divergent side-effect sets per route make this a true branching fork-join rather than a linear pipeline."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /deaccession-proposals/{id}/reject"
        actor: ArchivesDirector
        preconditions:
          - "proposal.status IN {SUBMITTED, LEGAL_CLEARED, HERITAGE_CLEARED, DUALLY_CLEARED}"
        side_effects:
          - "the item is left untouched in ACCESSIONED"

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ----------------------------------------------------------------------------

concurrency_rules:
  - rule_id: appraisal-create-stale-series
    parent_entity: RecordSeries
    write_endpoint: "POST /appraisals"
    occ_field: "expected_series_version"
    description: |
      Creating an AppraisalRecord against a RecordSeries whose version has
      advanced past the value the client last observed is rejected. A new
      appraisal legitimately supersedes every DRAFT/SCREENED appraisal on the
      same series (see state_machines.AppraisalRecord.DRAFT_to_SUPERSEDED), so a
      writer holding a stale view of the series would silently discard an
      appraisal it never saw. The stale-version check turns that into a
      deterministic 412 for the writer whose expected_series_version no longer
      matches RecordSeries.version.
    error_id: ERR_STALE_SERIES_VERSION
    http_status: 412

  - rule_id: screening-create-stale-request
    parent_entity: AccessRequest
    write_endpoint: "POST /confidentiality-screenings"
    occ_field: "expected_access_request_version"
    description: |
      Creating a ConfidentialityScreening against an AccessRequest whose version
      has advanced past the value the client last observed is rejected. A new
      screening legitimately supersedes the prior screening on the same request
      (see state_machines.ConfidentialityScreening.OPEN_to_SUPERSEDED), so a
      writer working from a stale request view would supersede a screening whose
      decision it never read. The stale-version check rejects that writer with a
      deterministic 412.
    error_id: ERR_STALE_ACCESS_REQUEST_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:

  - name: appraisal_score
    trigger: "state_machines.AppraisalRecord.DRAFT_to_SCREENED writes screening_score; state_machines.AppraisalRecord.SCREENED_to_FINAL writes final_score, brand_heritage_counted and recommended_disposition"
    algorithm: weighted_scoring
    formula: |
      # Inputs are read from the AppraisalRecord and its RecordSeries only.
      span_years        = series.latest_record_year - series.earliest_record_year + 1
      age_bonus         = min(10, floor(span_years / 5))
      volume_penalty    = 0                                       if series.annual_volume_linear_feet <= VOLUME_PENALTY_FLOOR_LF
                          else max(0, min(15, floor((series.annual_volume_linear_feet - VOLUME_PENALTY_FLOOR_LF) / 10)))
      # brand_admitted is the ONLY place the two variants disagree on inputs.
      brand_admitted    = appraisal.brand_heritage_value          # variant SCREENING
                          | appraisal.brand_heritage_value if a TrademarkEvidencePackage with
                            record_series_id == series.id has status == CERTIFIED, else 0   # variant FINAL
      core              = (appraisal.informational_value * W_INFORMATIONAL)
                        + (appraisal.evidential_value    * W_EVIDENTIAL)
                        + (brand_admitted                * W_BRAND_HERITAGE)
                        + (appraisal.uniqueness_factor   * W_UNIQUENESS)
      raw               = clamp(core + age_bonus - volume_penalty, 0, 100)
      provenance_mult   = 1.00                                    # variant SCREENING, unconditionally
                          | (1.00 if appraisal.provenance_verified else PROVENANCE_UNVERIFIED_MULT)  # variant FINAL
      score             = round_half_up(raw * provenance_mult, 2)
      # Disposition derivation runs ONLY in the FINAL variant:
      recommended_disposition = PERMANENT
                                if final_score >= series.retention_schedule.min_appraisal_score_for_permanent
                                else series.retention_schedule.disposition_action
    input_set: "Exactly one AppraisalRecord plus its RecordSeries and that series' RetentionSchedule. TrademarkEvidencePackage rows are consulted by the FINAL variant only, filtered to status == CERTIFIED; DRAFT and REJECTED packages are ignored."
    constants:
      W_INFORMATIONAL: 3
      W_EVIDENTIAL: 3
      W_BRAND_HERITAGE: 2
      W_UNIQUENESS: 2
      VOLUME_PENALTY_FLOOR_LF: 50
      PROVENANCE_UNVERIFIED_MULT: 0.80
    precision: "2 decimal places, round_half_up; the >= comparison against min_appraisal_score_for_permanent is made on the rounded value"
    variants:
      - name: SCREENING
        when: "POST /appraisals/{id}/screen — the archivist's own read of the series before director review"
        difference: "Admits brand_heritage_value with no trademark evidence requirement and applies provenance_mult = 1.00 even when provenance_verified is false. Writes screening_score."
      - name: FINAL
        when: "POST /appraisals/{id}/finalize — the record of decision that drives disposition"
        difference: "Zeroes brand_heritage_value unless a CERTIFIED TrademarkEvidencePackage exists for the series, and multiplies by PROVENANCE_UNVERIFIED_MULT when provenance_verified is false. Writes final_score, brand_heritage_counted and recommended_disposition."

  - name: confidentiality_risk_score
    trigger: "variant PRELIM runs on POST /access-requests and on POST /access-requests/{id}/revise; variant POST_SCREEN runs on state_machines.ConfidentialityScreening.OPEN_to_COMPLETED"
    algorithm: weighted_scoring
    formula: |
      class_weight  = CLASS_WEIGHT[requester.requester_class]
      nda_credit    = NDA_CREDIT if requester.nda_on_file else 0
      # variant PRELIM — no per-item read, series ceiling stands in for the holdings
      prelim        = clamp(class_weight + SENSITIVITY_WEIGHT[series.sensitivity_ceiling] - nda_credit, 0, 100)
      # variant POST_SCREEN — actual per-item sensitivities, hold surcharge, redaction credit
      item_max      = max(SENSITIVITY_WEIGHT[item.sensitivity_level]
                          for item in ArchivalItem where item.id IN request.requested_item_ids)
      hold_charge   = LEGAL_HOLD_SURCHARGE if series.legal_hold_active else 0
      redaction_cr  = REDACTION_CREDIT if screening.redaction_required else 0
      post_screen   = clamp(class_weight + item_max + hold_charge - nda_credit - redaction_cr, 0, 100)
    input_set: "The AccessRequest, its Requester, its RecordSeries, and — for POST_SCREEN only — every ArchivalItem whose id appears in requested_item_ids regardless of item status, plus the completing ConfidentialityScreening. requested_item_ids is guaranteed non-empty by validations[priority=31], so item_max always has at least one term."
    constants:
      CLASS_WEIGHT: { INTERNAL_BUSINESS: 10, EXTERNAL_RESEARCHER: 30, MEDIA: 45 }
      SENSITIVITY_WEIGHT: { PUBLIC: 0, INTERNAL: 15, CONFIDENTIAL: 35, RESTRICTED: 60 }
      NDA_CREDIT: 12
      LEGAL_HOLD_SURCHARGE: 25
      REDACTION_CREDIT: 10
      RISK_REDACTION_THRESHOLD: 75
    precision: "integer arithmetic only; both variants clamp to [0, 100]"
    variants:
      - name: PRELIM
        when: "AccessRequest creation and every revision — before any item is inspected"
        difference: "Uses the series' sensitivity_ceiling as a single upper-bound proxy, ignores legal_hold_active and ignores redaction. Writes AccessRequest.prelim_risk_score."
      - name: POST_SCREEN
        when: "ConfidentialityScreening completion"
        difference: "Replaces the ceiling proxy with the maximum actual sensitivity across the requested items, adds LEGAL_HOLD_SURCHARGE when the series is under an active hold, and subtracts REDACTION_CREDIT when the screener requires redaction. Writes AccessRequest.post_screen_risk_score."

  - name: access_service_fee
    trigger: "state_machines.AccessRequest.SCREENING_to_APPROVED and SCREENING_to_PARTIALLY_APPROVED write AccessRequest.service_fee_cents"
    algorithm: tiered_pricing
    formula: |
      # Line items are the requested ArchivalItem rows, processed in ArchivalItem.created_at ASC
      # order (ties broken by created_at only — never by id).
      pages_i        = item_i.unit_count * PAGES_PER_UNIT
      total_pages    = SUM(pages_i)                         # == AccessRequest.requested_page_count
      tier_pct       = 0.000  if total_pages <= 100
                       0.075  if 101 <= total_pages <= 500
                       0.125  if total_pages >= 501
      gross_i        = pages_i * PER_PAGE_CENTS[requester.requester_class]
      # PINNED ROUNDING ORDER: round EACH line item to whole cents FIRST, then sum.
      line_i         = round_half_up(gross_i * (1 - tier_pct), 0)
      fee_subtotal   = SUM(line_i)
      service_fee_cents = fee_subtotal
                        + BASE_HANDLING_CENTS
                        + (MEDIA_LICENSE_SURCHARGE_CENTS if requester.requester_class == MEDIA else 0)
      # The rejected alternative — round_half_up(SUM(gross_i) * (1 - tier_pct), 0) — is NOT used.
      # For unit_counts [2, 2, 6] at MEDIA rates the pinned order yields 9159 and the rejected
      # order yields 9158; the scaffold's answer is 9159.
    input_set: "Every ArchivalItem whose id appears in AccessRequest.requested_item_ids, in created_at ASC order, with no status filter (a requested item that later moved to PENDING_DISPOSITION still bills). tier_pct is selected once from total_pages and applied to every line."
    constants:
      PAGES_PER_UNIT: 11
      PER_PAGE_CENTS: { INTERNAL_BUSINESS: 0, EXTERNAL_RESEARCHER: 35, MEDIA: 90 }
      BASE_HANDLING_CENTS: 2500
      MEDIA_LICENSE_SURCHARGE_CENTS: 15000
    precision: "whole cents; round_half_up applied per line item, never to the aggregate"

  - name: migration_job_cost
    trigger: "POST /migration-jobs stamps subtotal_cents, volume_discount_pct, discounted_cents, handling_fee_cents, condition_surcharge_cents and committed_cost_cents at creation; the values are frozen for the life of the job and are what state_machines.MigrationJob.PENDING_APPROVAL_to_APPROVED commits against the plan budget"
    algorithm: waterfall_allocation
    formula: |
      # The tier lookups LOOK circular (handling fee depends on the discounted amount, and it is
      # tempting to re-derive the volume discount from the net total that includes the handling
      # fee). The evaluation order below is PINNED and MUST be executed exactly in these six
      # steps; step 2 reads step 1's output and NOTHING later.
      step1  subtotal_cents         = FORMAT_RATE_CENTS_PER_UNIT[item.original_format] * job.units
      step2  volume_discount_pct    = 0.00  if subtotal_cents <= 50000
                                      0.06  if 50001 <= subtotal_cents <= 200000
                                      0.11  if subtotal_cents >= 200001
                                      # keyed on step1 ONLY — never on discounted_cents or the net
      step3  discounted_cents       = round_half_up(subtotal_cents * (1 - volume_discount_pct), 0)
      step4  handling_fee_cents     = 1500  if discounted_cents <= 25000
                                      4000  if 25001 <= discounted_cents <= 100000
                                      9000  if discounted_cents >= 100001
                                      # keyed on step3 output
      step5  condition_surcharge_cents = round_half_up((discounted_cents + handling_fee_cents)
                                          * CONDITION_SURCHARGE_PCT[item.condition_grade], 0)
      step6  committed_cost_cents   = discounted_cents + handling_fee_cents + condition_surcharge_cents
      # Worked reference: MAGNETIC_TAPE, units 40, condition FAIR ->
      #   168000 -> 0.06 -> 157920 -> 9000 -> 8346 -> 175266
    input_set: "Exactly one MigrationJob plus the ArchivalItem named by archival_item_id, read at job-creation time. The rate is keyed on the item's original_format (the carrier being migrated FROM), never on target_format."
    constants:
      FORMAT_RATE_CENTS_PER_UNIT: { PAPER: 900, PHOTO: 1800, FILM: 3600, MAGNETIC_TAPE: 4200, BORN_DIGITAL: 600 }
      CONDITION_SURCHARGE_PCT: { GOOD: 0.00, FAIR: 0.05, POOR: 0.12, UNSTABLE: 0.20 }
    precision: "whole cents; round_half_up at step 3 and step 5 only, in that order"

  - name: continuous_use_coverage
    trigger: "POST /trademark-evidence-packages/{id}/certify writes qualifying_evidence_count, covered_year_count, max_gap_years and continuous_use_coverage_pct before either package transition fires"
    algorithm: interval_merge
    formula: |
      current_year  = calendar year of the logical clock (UTC)
      span_start    = package.claimed_first_use_year
      span_end      = current_year
      span_years    = span_end - span_start + 1
      qualifying    = [ item for item in ArchivalItem where item.id IN package.evidence_item_ids
                        AND item.brand_use_year is not null
                        AND item.status != DEACCESSIONED
                        AND span_start <= item.brand_use_year <= span_end ]
      qualifying_evidence_count = COUNT(qualifying)
      # empty set is a hard stop, evaluated BEFORE any gap or coverage arithmetic
      if qualifying_evidence_count == 0: raise ERR_NO_QUALIFYING_EVIDENCE and leave the package DRAFT
      years         = sorted(distinct item.brand_use_year for item in qualifying)   # ascending
      covered_year_count = COUNT(years)
      gaps          = [ years[0] - span_start ]                                  # leading run
                    + [ years[i+1] - years[i] - 1 for i in 0..len(years)-2 ]     # interior runs
                    + [ span_end - years[-1] ]                                   # trailing run
      max_gap_years = max(gaps)
      continuous_use_coverage_pct = round_half_up(100 * covered_year_count / span_years, 2)
      # Gates, evaluated in this order:
      #   1. max_gap_years <= MAX_ALLOWED_GAP_YEARS      else REJECTED with rejection_code GAP_EXCEEDED
      #   2. continuous_use_coverage_pct >= MIN_COVERAGE_PCT else REJECTED with COVERAGE_BELOW_MINIMUM
      # Worked reference (clock in 2026): first_use 2018 with years [2018, 2022, 2026] ->
      #   covered 3, span 9, max_gap 3, coverage 33.33 -> CERTIFIED (gap of exactly 3 passes).
      #   first_use 2018 with years [2018, 2023, 2026] -> max_gap 4 -> REJECTED / GAP_EXCEEDED.
    input_set: "ArchivalItem rows named in evidence_item_ids, filtered to brand_use_year not null AND status != DEACCESSIONED AND brand_use_year inside the closed span [claimed_first_use_year, current_year]. Duplicate years collapse to one covered year."
    constants:
      MAX_ALLOWED_GAP_YEARS: 3
      MIN_COVERAGE_PCT: 25.00
    precision: "coverage percentage to 2 decimal places, round_half_up; gap arithmetic is whole years"

  - name: zone_environmental_status
    trigger: "POST /storage-zones and POST /storage-zones/{id}/environment-readings write StorageZone.environmental_status"
    algorithm: threshold
    formula: |
      COMPLIANT      if temperature_c <= TEMP_COMPLIANT_MAX_C
                     AND RH_MIN_PCT <= relative_humidity_pct <= RH_COMPLIANT_MAX_PCT
      MARGINAL       else if temperature_c <= TEMP_MARGINAL_MAX_C
                     AND RH_MIN_PCT <= relative_humidity_pct <= RH_MARGINAL_MAX_PCT
      NON_COMPLIANT  otherwise
      # All four comparisons are inclusive: 18.0C / 50.0% is COMPLIANT, 18.1C is not.
    input_set: "The single StorageZone row's latest temperature_c and relative_humidity_pct; historical readings are not retained beyond reading_count."
    constants:
      TEMP_COMPLIANT_MAX_C: 18.0
      TEMP_MARGINAL_MAX_C: 21.0
      RH_MIN_PCT: 30.0
      RH_COMPLIANT_MAX_PCT: 50.0
      RH_MARGINAL_MAX_PCT: 55.0
    precision: "1 decimal place on both readings; comparisons are inclusive on every bound"

  - name: at_risk_unit_count
    trigger: "POST /preservation-plans/{id}/activate and state_machines.MigrationJob.IN_PROGRESS_to_COMPLETED recompute PreservationPlan.at_risk_unit_count"
    algorithm: aggregation
    formula: |
      at_risk_unit_count = SUM(item.unit_count)
        over ArchivalItem where item.storage_zone_id == plan.storage_zone_id
          AND item.status IN {UNPROCESSED, ACCESSIONED, IN_TREATMENT}
          AND item.original_format IN {MAGNETIC_TAPE, FILM}
          AND item.digital_surrogate_available == false
      # Items in ON_LOAN, PENDING_DISPOSITION, DEACCESSIONED or REJECTED_ITEM are excluded.
      # Reaching exactly 0 while plan.status == ACTIVE fires PreservationPlan.ACTIVE_to_SATISFIED.
    input_set: "ArchivalItem rows sharing the plan's storage_zone_id, filtered by the explicit status set {UNPROCESSED, ACCESSIONED, IN_TREATMENT}, the explicit format set {MAGNETIC_TAPE, FILM}, and digital_surrogate_available == false. Order-independent (pure sum), so no tie-break is required."
    constants:
      AT_RISK_FORMATS: [MAGNETIC_TAPE, FILM]
    precision: "integer units"

  - name: exhibit_loan_window_conflict
    trigger: "POST /exhibit-loans evaluates the new interval against the item's existing loans before the row is created"
    algorithm: interval_merge
    formula: |
      # Interval semantics A — HALF-OPEN [window_start, window_end) with an asymmetric
      # light-recovery buffer appended to the END of every existing loan. Pairwise rejection:
      # ONE colliding loan is enough.
      existing_occupation(L) = [ L.window_start , L.window_end + LIGHT_RECOVERY_BUFFER_DAYS )
      candidates             = ExhibitLoan where archival_item_id == new.archival_item_id
                               AND status IN {REQUESTED, CONFIRMED, OUT}
      conflict               = EXISTS L in candidates such that
                                 new.window_start < (L.window_end + LIGHT_RECOVERY_BUFFER_DAYS)
                                 AND L.window_start < new.window_end
      # Consequences of the half-open + buffer geometry:
      #   * new.window_start == L.window_end  -> CONFLICT (inside the buffer)
      #   * new.window_end   == L.window_start -> NO conflict (half-open, and no buffer is
      #     applied to the front of an existing loan)
      #   * new.window_start == L.window_end + 45 days exactly -> NO conflict (strict <)
      # RETURNED and CANCELLED loans release their occupation entirely, buffer included.
    input_set: "ExhibitLoan rows on the same archival_item_id with status IN {REQUESTED, CONFIRMED, OUT}; RETURNED and CANCELLED rows are excluded."
    constants:
      LIGHT_RECOVERY_BUFFER_DAYS: 45
    precision: "instant comparison at millisecond resolution on ISO 8601 UTC values"

  - name: zone_migration_capacity
    trigger: "state_machines.MigrationJob.PENDING_APPROVAL_to_APPROVED evaluates zone capacity before committing budget"
    algorithm: interval_merge
    formula: |
      # Interval semantics B — CLOSED [window_start, window_end] on BOTH ends, no buffer, and
      # rejection is AGGREGATE rather than pairwise: overlap is legal until the count of
      # simultaneously-covering jobs would exceed the zone's ceiling.
      zone                = the StorageZone of the job's ArchivalItem
      candidates          = MigrationJob J where J.id != job.id
                            AND the ArchivalItem of J has storage_zone_id == zone.id
                            AND J.status IN {APPROVED, IN_PROGRESS}
      overlaps            = [ J in candidates where J.window_start <= job.window_end
                              AND job.window_start <= J.window_end ]     # CLOSED on both ends,
                                                                          # so touching endpoints DO overlap
      peak_after_insert   = 1 + max over the boundary instants
                            {job.window_start} UNION {J.window_start for J in overlaps}
                            of COUNT(J in overlaps whose closed interval covers that instant)
      conflict            = peak_after_insert > zone.max_overlapping_migration_jobs
      # peak_after_insert == zone.max_overlapping_migration_jobs is ALLOWED (strict >).
    input_set: "MigrationJob rows whose item shares the zone and whose status IN {APPROVED, IN_PROGRESS}; PENDING_APPROVAL, COMPLETED, CANCELLED and REJECTED jobs occupy nothing. Boundary instants are the candidate window_start values plus the new job's window_start — a finite, deterministic scan set requiring no tie-break."
    constants:
      CAPACITY_COMPARISON: "strict greater-than against StorageZone.max_overlapping_migration_jobs"
    precision: "instant comparison at millisecond resolution; both interval ends inclusive"

  - name: interview_release_state
    trigger: "every POST /oral-history-interviews/{id}/consent and POST /oral-history-interviews/{id}/transcription recomputes OralHistoryInterview.release_state"
    algorithm: constraint_propagation
    formula: |
      if consent_status == WITHDRAWN or consent_status == PENDING:      release_state = WITHHELD
      elif consent_status == RESTRICTED:
          release_state = RESEARCH_ROOM_ONLY if transcription_status IN {REVIEWED, APPROVED} else WITHHELD
      else:  # consent_status == SIGNED
          if transcription_status == APPROVED
             AND (embargo_until is null OR logical_clock >= embargo_until):  release_state = PUBLIC
          elif transcription_status IN {REVIEWED, APPROVED}:                 release_state = RESEARCH_ROOM_ONLY
          else:                                                             release_state = WITHHELD
    input_set: "The single OralHistoryInterview row's two state axes plus embargo_until compared against the logical clock. No other entity is read."
    constants:
      EMBARGO_COMPARISON: "logical_clock >= embargo_until is inclusive"
    precision: "enum output; instant comparison at millisecond resolution"

  - name: retention_expiry
    trigger: "POST /record-series computes RecordSeries.retention_expiry_utc; it is recomputed whenever latest_record_year or the referenced RetentionSchedule changes"
    algorithm: threshold
    formula: |
      base               = ISO instant "{latest_record_year}-12-31T23:59:59.000Z"
      retention_expiry_utc = base + retention_schedule.retention_years whole calendar years
                             (year field incremented; month/day/time preserved verbatim)
      retention_elapsed  = logical_clock >= retention_expiry_utc      # inclusive
    input_set: "The RecordSeries' latest_record_year and its RetentionSchedule.retention_years. No other rows participate."
    constants:
      RETENTION_BASE_TIME: "23:59:59.000Z on 31 December of latest_record_year"
    precision: "millisecond ISO 8601 UTC; the elapsed test uses >= so the exact expiry instant counts as elapsed"

  - name: preservation_budget_conservation
    trigger: "invariant re-established by state_machines.MigrationJob.APPROVED_to_CANCELLED, IN_PROGRESS_to_CANCELLED and IN_PROGRESS_to_COMPLETED"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 — MONEY. Must hold after EVERY request, including cascades:
      PreservationPlan.budget_committed_cents
        == SUM(MigrationJob.committed_cost_cents
               WHERE preservation_plan_id == plan.id AND status IN {APPROVED, IN_PROGRESS})
      PreservationPlan.budget_spent_cents
        == SUM(MigrationJob.committed_cost_cents
               WHERE preservation_plan_id == plan.id AND status == COMPLETED)
      # Approve commits exactly committed_cost_cents; cancel from APPROVED or IN_PROGRESS
      # releases exactly committed_cost_cents, so approve-then-cancel returns
      # budget_committed_cents to its pre-approval value with zero drift.
    input_set: "All MigrationJob rows of the plan, partitioned by the explicit status sets {APPROVED, IN_PROGRESS} and {COMPLETED}. Pure sums, so order-independent."
    constants:
      DRIFT_TOLERANCE_CENTS: 0
    precision: "exact integer cents; no tolerance"

  - name: unit_custody_conservation
    trigger: "invariant re-established by state_machines.ArchivalItem.ON_LOAN_to_ACCESSIONED and PENDING_DISPOSITION_to_DEACCESSIONED / PENDING_DISPOSITION_to_ACCESSIONED"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2 — PHYSICAL UNITS. Must hold on every ArchivalItem after every
      # request, for every item status except REJECTED_ITEM:
      ArchivalItem.unit_count
        == ArchivalItem.units_on_shelf + ArchivalItem.units_on_loan + ArchivalItem.units_deaccessioned
      # Check-out moves loan.units shelf -> loan; return moves the same loan.units loan -> shelf,
      # so check-out followed by return restores the exact triple. Deaccession execution moves
      # proposal.units shelf -> deaccessioned and is deliberately NOT reversible.
      # REJECTED_ITEM rows carry units_on_shelf = 0 and are exempt.
    input_set: "A single ArchivalItem row's four unit fields. No aggregation across rows, so no ordering question arises."
    constants:
      DRIFT_TOLERANCE_UNITS: 0
    precision: "exact integer units; no tolerance"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# ============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Every required body field for the endpoint is present, every enum value is a declared member, every integer/number is inside its §1.1 constraints range, requested_item_ids and evidence_item_ids contain no duplicates, and window_end > window_start on every windowed create"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that accept a body"

  - priority: 8
    category: existence
    check: "The {id} in the request path resolves to an existing row of the endpoint's own resource type"
    error_id: "the resource type's NOT_FOUND code, e.g. ERR_MIGRATION_JOB_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 12
    category: existence
    check: "Every foreign-key id in the request body resolves, checked in the exact left-to-right order the endpoint's `input:` list declares those fields; the first unresolved reference wins"
    error_id: "the referenced type's NOT_FOUND code, e.g. ERR_STORAGE_ZONE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /record-series, POST /legal-holds, POST /appraisals, POST /accessions, POST /archival-items, POST /finding-aids, POST /preservation-plans, POST /migration-jobs, POST /access-requests, POST /confidentiality-screenings, POST /oral-history-interviews, POST /trademark-evidence-packages, POST /exhibit-loans, POST /deaccession-proposals"

  - priority: 14
    category: business_constraint
    check: "Uniqueness of RetentionSchedule.code, LegalHold.matter_number and StorageZone.zone_code across all existing rows"
    error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    applies_to: "POST /retention-schedules, POST /legal-holds, POST /storage-zones"

  - priority: 15
    category: auth
    check: "When the acting role is Requester, X-User-ID equals the target AccessRequest.requester_id (or, on create, the requester_id in the body)"
    error_id: ERR_NOT_REQUEST_OWNER
    http_status: 403
    applies_to: "POST /access-requests, POST /access-requests/{id}/revise"

  - priority: 16
    category: business_referential
    check: "DeaccessionProposal.legal_cleared_by is not null. Deliberately evaluated ahead of the priority-20 proposal-state guard so that an approval attempted from HERITAGE_CLEARED names the missing legal clearance instead of returning a generic state error"
    error_id: ERR_LEGAL_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /deaccession-proposals/{id}/approve"

  - priority: 17
    category: business_referential
    check: "DeaccessionProposal.heritage_cleared_by is not null. Deliberately evaluated ahead of the priority-20 proposal-state guard, and after the legal-clearance check, so that an approval attempted from LEGAL_CLEARED names the missing heritage clearance"
    error_id: ERR_HERITAGE_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /deaccession-proposals/{id}/approve"

  - priority: 18
    category: state
    check: "The OCC field expected_<parent>_version equals the current version of the parent row named by concurrency_rules"
    error_id: "ERR_STALE_SERIES_VERSION on POST /appraisals; ERR_STALE_ACCESS_REQUEST_VERSION on POST /confidentiality-screenings"
    http_status: 412
    applies_to: "POST /appraisals, POST /confidentiality-screenings"

  - priority: 19
    category: business_referential
    check: "Accession.provenance_documented == true before processing. Deliberately evaluated ahead of the priority-20 accession-state guard so that processing a RECEIVED accession names the undocumented provenance rather than returning a generic state error"
    error_id: ERR_PROVENANCE_NOT_DOCUMENTED
    http_status: 422
    applies_to: "POST /accessions/{id}/process"

  - priority: 20
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2 (including the derived-state guards such as FindingAid.stale_item_count == 0 before publish and PreservationPlan having no open jobs before close)"
    error_id: "the resource's STATE_INVALID code, e.g. ERR_JOB_STATE_INVALID, ERR_REQUEST_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints that drive a §1.2 transition"

  - priority: 21
    category: state
    check: "Creating a LegalHold activation when another LegalHold on the same record_series_id is already ACTIVE"
    error_id: ERR_SERIES_ALREADY_ON_HOLD
    http_status: 409
    applies_to: "POST /legal-holds/{id}/activate"

  - priority: 22
    category: auth
    check: "Segregation of duties on X-User-ID: the officer approving a MigrationJob differs from MigrationJob.requested_by; the officer approving or denying an AccessRequest differs from the screened_by of the request's current screening; the director approving a DeaccessionProposal differs from its legal_cleared_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /migration-jobs/{id}/approve, POST /access-requests/{id}/approve, POST /access-requests/{id}/deny, POST /deaccession-proposals/{id}/approve"

  - priority: 25
    category: business_safety
    check: "The governing RecordSeries has disposition_state != SUSPENDED and legal_hold_active == false"
    error_id: ERR_SERIES_DISPOSITION_SUSPENDED
    http_status: 409
    applies_to: "POST /appraisals/{id}/screen, POST /appraisals/{id}/finalize, POST /accessions/{id}/verify-provenance, POST /access-requests/{id}/begin-screening, POST /access-requests/{id}/approve, POST /deaccession-proposals/{id}/legal-clearance, POST /record-series/{id}/dispose"

  - priority: 26
    category: business_safety
    check: "The governing RecordSeries has disposition_state != PERMANENT — permanently designated heritage records cannot be cleared for removal or disposed"
    error_id: ERR_SERIES_PERMANENT
    http_status: 409
    applies_to: "POST /deaccession-proposals/{id}/legal-clearance, POST /deaccession-proposals/{id}/heritage-clearance, POST /record-series/{id}/dispose"

  - priority: 27
    category: business_safety
    check: "OralHistoryInterview.consent_status == SIGNED before a transcript may be approved"
    error_id: ERR_CONSENT_NOT_SIGNED
    http_status: 422
    applies_to: "POST /oral-history-interviews/{id}/transcription with transcription_action == APPROVE"

  - priority: 28
    category: business_temporal
    check: "OralHistoryInterview.embargo_until is null OR the logical clock is >= embargo_until"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /oral-history-interviews/{id}/transcription with transcription_action == APPROVE"

  - priority: 29
    category: business_temporal
    check: "The logical clock is >= RecordSeries.retention_expiry_utc"
    error_id: ERR_RETENTION_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /record-series/{id}/dispose"

  - priority: 30
    category: business_temporal
    check: "The logical clock is >= ExhibitLoan.window_start"
    error_id: ERR_LOAN_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /exhibit-loans/{id}/check-out"

  - priority: 31
    category: business_constraint
    check: "AccessRequest.requested_item_ids contains at least one element"
    error_id: ERR_NO_ITEMS_REQUESTED
    http_status: 422
    applies_to: "POST /access-requests, POST /access-requests/{id}/revise"

  - priority: 32
    category: business_referential
    check: "Every ArchivalItem in requested_item_ids has an accession_id resolving to an Accession whose record_series_id equals the request's record_series_id"
    error_id: ERR_ITEM_NOT_IN_SERIES
    http_status: 422
    applies_to: "POST /access-requests, POST /access-requests/{id}/revise"

  - priority: 33
    category: business_referential
    check: "When AccessRequest.finding_aid_id is not null, the referenced FindingAid.status == PUBLISHED"
    error_id: ERR_FINDING_AID_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /access-requests/{id}/approve"

  - priority: 35
    category: business_referential
    check: "Accession.processed_unit_count == Accession.declared_unit_count before processing"
    error_id: ERR_UNIT_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /accessions/{id}/process"

  - priority: 36
    category: business_referential
    check: "The AccessRequest's Requester has status == ACTIVE"
    error_id: ERR_REQUESTER_SUSPENDED
    http_status: 409
    applies_to: "POST /access-requests/{id}/begin-screening, POST /access-requests/{id}/approve"

  - priority: 37
    category: business_referential
    check: "The request's current_screening_id resolves to a ConfidentialityScreening with status == COMPLETED, and its decision is GRANT_FULL for a FULL approval or IN {GRANT_FULL, GRANT_REDACTED} for a REDACTED approval"
    error_id: ERR_SCREENING_DECISION_MISSING
    http_status: 422
    applies_to: "POST /access-requests/{id}/approve, POST /access-requests/{id}/deny"

  - priority: 40
    category: business_referential
    check: "DeaccessionProposal.route == DONATION requires recipient_repository to be a non-empty string"
    error_id: ERR_RECIPIENT_REPOSITORY_REQUIRED
    http_status: 422
    applies_to: "POST /deaccession-proposals, POST /deaccession-proposals/{id}/approve"

  - priority: 41
    category: business_constraint
    check: "ArchivalItem.condition_grade IN {GOOD, FAIR} before an exhibit loan may be confirmed"
    error_id: ERR_ITEM_CONDITION_UNSUITABLE
    http_status: 422
    applies_to: "POST /exhibit-loans/{id}/confirm"

  - priority: 42
    category: business_constraint
    check: "No ExhibitLoan on the item has status IN {REQUESTED, CONFIRMED, OUT}"
    error_id: ERR_ITEM_HAS_ACTIVE_LOAN
    http_status: 409
    applies_to: "POST /deaccession-proposals/{id}/approve"

  - priority: 43
    category: business_constraint
    check: "ArchivalItem.units_on_shelf >= the requested units"
    error_id: ERR_INSUFFICIENT_SHELF_UNITS
    http_status: 422
    applies_to: "POST /exhibit-loans/{id}/confirm, POST /exhibit-loans/{id}/check-out, POST /deaccession-proposals/{id}/execute"

  - priority: 44
    category: business_constraint
    check: "calculations.exhibit_loan_window_conflict finds no colliding loan on the item under half-open + light-recovery-buffer semantics"
    error_id: ERR_LOAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exhibit-loans"

  - priority: 45
    category: business_constraint
    check: "The item's StorageZone.environmental_status == COMPLIANT"
    error_id: ERR_ZONE_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /migration-jobs/{id}/start"

  - priority: 46
    category: business_constraint
    check: "calculations.zone_migration_capacity finds peak_after_insert <= StorageZone.max_overlapping_migration_jobs under closed-interval aggregate semantics"
    error_id: ERR_ZONE_MIGRATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /migration-jobs/{id}/approve"

  - priority: 47
    category: business_constraint
    check: "calculations.continuous_use_coverage finds qualifying_evidence_count >= 1"
    error_id: ERR_NO_QUALIFYING_EVIDENCE
    http_status: 422
    applies_to: "POST /trademark-evidence-packages/{id}/certify"

  - priority: 48
    category: business_constraint
    check: "A FULL approval requires AccessRequest.post_screen_risk_score < RISK_REDACTION_THRESHOLD (75); at or above the threshold only approval_scope == REDACTED is permitted"
    error_id: ERR_RISK_THRESHOLD_REQUIRES_REDACTION
    http_status: 422
    applies_to: "POST /access-requests/{id}/approve"

  - priority: 50
    category: business_fiscal
    check: "PreservationPlan.budget_committed_cents + MigrationJob.committed_cost_cents <= PreservationPlan.budget_cents (equality is permitted)"
    error_id: ERR_PRESERVATION_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /migration-jobs/{id}/approve"

# ============================================================================
# §1.5 API Endpoint Table
# All paths are top-level (api_prefix "/"); relationships are expressed by
# explicit foreign keys and by filtered-list GETs, never by URL nesting.
# Every list endpoint accepts limit? / offset? per response_envelope.
# ============================================================================

endpoints:

  # ------------------------------------------------------- retention schedules
  - method: POST
    path: "/retention-schedules"
    description: "Register a retention schedule (immutable configuration row: no version, no update endpoint)."
    roles: [ArchivesDirector]
    code: 201
    input: [code, retention_years, disposition_action, legal_citation, min_appraisal_score_for_permanent]
    output: RetentionSchedule
    side_effects:
      - "none; the row is immutable once created"

  - method: GET
    path: "/retention-schedules"
    description: "List retention schedules."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: ["disposition_action?", "limit?", "offset?"]
    output: RetentionSchedule[]
    side_effects: []

  - method: GET
    path: "/retention-schedules/{id}"
    description: "Fetch one retention schedule."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: []
    output: RetentionSchedule
    side_effects: []

  # ------------------------------------------------------------ record series
  - method: POST
    path: "/record-series"
    description: "Create a record series governed by a retention schedule."
    roles: [Archivist]
    code: 201
    input: [title, business_unit, retention_schedule_id, sensitivity_ceiling, annual_volume_linear_feet, earliest_record_year, latest_record_year]
    output: RecordSeries
    side_effects:
      - "computes retention_expiry_utc via calculations.retention_expiry"
      - "disposition_state initialised to ACTIVE, legal_hold_active to false, version to 1"

  - method: GET
    path: "/record-series"
    description: "List record series, optionally filtered by governing schedule, by the appraisal currently designated FINAL, or by lifecycle state."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: ["retention_schedule_id?", "current_appraisal_id?", "disposition_state?", "business_unit?", "limit?", "offset?"]
    output: RecordSeries[]
    side_effects: []

  - method: GET
    path: "/record-series/{id}"
    description: "Fetch one record series with all derived fields reconciled."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: []
    output: RecordSeries
    side_effects: []

  - method: POST
    path: "/record-series/{id}/dispose"
    description: "Dispose a retention-elapsed, non-permanent, hold-free series per its schedule's disposition_action."
    roles: [ArchivesDirector]
    code: 200
    input: [disposition_certificate_reference]
    output: RecordSeries
    side_effects:
      - "state_machines.RecordSeries ELIGIBLE_FOR_DISPOSITION -> DISPOSED"
      - "every PUBLISHED FindingAid under the series' accessions moves to WITHDRAWN"
      - "increments version by 1"

  # -------------------------------------------------------------- legal holds
  - method: POST
    path: "/legal-holds"
    description: "Draft a legal hold over one record series."
    roles: [LegalCounsel]
    code: 201
    input: [matter_number, record_series_id, effective_from]
    output: LegalHold
    side_effects:
      - "stamps issued_by from X-User-ID; status DRAFT; the series is not yet affected"

  - method: GET
    path: "/legal-holds"
    description: "List legal holds, optionally filtered by the series they freeze."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer]
    code: 200
    input: ["record_series_id?", "status?", "limit?", "offset?"]
    output: LegalHold[]
    side_effects: []

  - method: GET
    path: "/legal-holds/{id}"
    description: "Fetch one legal hold."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer]
    code: 200
    input: []
    output: LegalHold
    side_effects: []

  - method: POST
    path: "/legal-holds/{id}/activate"
    description: "Activate the hold; drives the three-hop suspension cascade."
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalHold
    side_effects:
      - "state_machines.LegalHold DRAFT -> ACTIVE; stamps activated_at from the logical clock"
      - "cascade hop 1: the series captures pre_hold_disposition_state and moves to SUSPENDED with legal_hold_active = true"
      - "cascade hop 2: every AccessRequest on the series in SUBMITTED, SCREENING or CHANGES_REQUESTED moves to BLOCKED with legal_hold_blocked = true"
      - "cascade hop 3: every OPEN ConfidentialityScreening on those requests moves to SUPERSEDED with superseded_reason LEGAL_HOLD_BLOCK"
      - "writes suspended_access_request_count and the series' blocked_access_request_count"

  - method: POST
    path: "/legal-holds/{id}/release"
    description: "Release the hold and restore the series' pre-hold disposition state."
    roles: [LegalCounsel]
    code: 200
    input: [release_note]
    output: LegalHold
    side_effects:
      - "state_machines.LegalHold ACTIVE -> RELEASED; stamps released_at"
      - "the series returns to pre_hold_disposition_state verbatim and legal_hold_active becomes false"
      - "BLOCKED AccessRequests on the series return to SUBMITTED with legal_hold_blocked = false"

  # --------------------------------------------------------------- appraisals
  - method: POST
    path: "/appraisals"
    description: "Create a draft appraisal for a series. Carries the OCC token expected_series_version per §1.2.1 appraisal-create-stale-series; a stale value is rejected with ERR_STALE_SERIES_VERSION (412)."
    roles: [Archivist]
    code: 201
    input: [record_series_id, informational_value, evidential_value, brand_heritage_value, uniqueness_factor, provenance_verified, expected_series_version]
    output: AppraisalRecord
    side_effects:
      - "stamps appraised_by from X-User-ID; status DRAFT; no score is computed yet"
      - "every prior AppraisalRecord on the same series in DRAFT, SCREENED or FINAL moves to SUPERSEDED with superseded_by_appraisal_id set to the new row"
      - "clears RecordSeries.current_appraisal_id when the superseded set contained the FINAL appraisal"
      - "increments RecordSeries.version by 1"

  - method: GET
    path: "/appraisals"
    description: "List appraisals, optionally filtered by series."
    roles: [ArchivesDirector, Archivist, LegalCounsel]
    code: 200
    input: ["record_series_id?", "status?", "limit?", "offset?"]
    output: AppraisalRecord[]
    side_effects: []

  - method: GET
    path: "/appraisals/{id}"
    description: "Fetch one appraisal with its scores."
    roles: [ArchivesDirector, Archivist, LegalCounsel]
    code: 200
    input: []
    output: AppraisalRecord
    side_effects: []

  - method: POST
    path: "/appraisals/{id}/screen"
    description: "Run the SCREENING variant of calculations.appraisal_score."
    roles: [Archivist]
    code: 200
    input: []
    output: AppraisalRecord
    side_effects:
      - "state_machines.AppraisalRecord DRAFT -> SCREENED; writes screening_score"

  - method: POST
    path: "/appraisals/{id}/finalize"
    description: "Run the FINAL variant of calculations.appraisal_score and stamp the series' disposition designation."
    roles: [ArchivesDirector]
    code: 200
    input: []
    output: AppraisalRecord
    side_effects:
      - "state_machines.AppraisalRecord SCREENED -> FINAL; writes final_score, brand_heritage_counted and recommended_disposition"
      - "sets RecordSeries.current_appraisal_id to this appraisal"
      - "the series moves to PERMANENT when final_score >= schedule.min_appraisal_score_for_permanent, else to ELIGIBLE_FOR_DISPOSITION"
      - "increments RecordSeries.version by 1"

  # --------------------------------------------------------------- accessions
  - method: POST
    path: "/accessions"
    description: "Record a new accession (transfer of custody) against a series."
    roles: [Archivist]
    code: 201
    input: [record_series_id, donor_name, transfer_instrument, declared_unit_count]
    output: Accession
    side_effects:
      - "status RECEIVED; provenance_documented false; processed_unit_count 0"

  - method: GET
    path: "/accessions"
    description: "List accessions, optionally filtered by series."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: ["record_series_id?", "status?", "limit?", "offset?"]
    output: Accession[]
    side_effects: []

  - method: GET
    path: "/accessions/{id}"
    description: "Fetch one accession with its reconciled unit counters."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: []
    output: Accession
    side_effects: []

  - method: POST
    path: "/accessions/{id}/verify-provenance"
    description: "Record the custodial history and signed instrument, unlocking processing."
    roles: [Archivist]
    code: 200
    input: [provenance_statement, transfer_instrument_reference]
    output: Accession
    side_effects:
      - "state_machines.Accession RECEIVED -> PROVENANCE_VERIFIED; sets provenance_documented = true"

  - method: POST
    path: "/accessions/{id}/process"
    description: "Close accession processing once every declared unit is represented by an archival item."
    roles: [Archivist]
    code: 200
    input: []
    output: Accession
    side_effects:
      - "state_machines.Accession PROVENANCE_VERIFIED -> PROCESSED"
      - "every UNPROCESSED ArchivalItem under the accession moves to ACCESSIONED with units_on_shelf = unit_count"

  - method: POST
    path: "/accessions/{id}/reject"
    description: "Reject an accession that must be returned to the transferring party."
    roles: [ArchivesDirector]
    code: 200
    input: [rejection_reason]
    output: Accession
    side_effects:
      - "state_machines.Accession RECEIVED or PROVENANCE_VERIFIED -> REJECTED"
      - "every ArchivalItem under the accession moves to REJECTED_ITEM with units_on_shelf = 0"

  # ------------------------------------------------------------ archival items
  - method: POST
    path: "/archival-items"
    description: "Create an archival item (container) under an accession and shelve it in a storage zone."
    roles: [Archivist]
    code: 201
    input: ["accession_id", "storage_zone_id", "item_label", "unit_count", "condition_grade", "original_format", "sensitivity_level", "brand_use_year?"]
    output: ArchivalItem
    side_effects:
      - "status UNPROCESSED; preservation_format = original_format; units_on_shelf = unit_count; units_on_loan = 0; units_deaccessioned = 0"
      - "the parent Accession recomputes processed_unit_count"

  - method: GET
    path: "/archival-items"
    description: "List archival items, optionally filtered by accession or by shelving zone."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: ["accession_id?", "storage_zone_id?", "status?", "original_format?", "limit?", "offset?"]
    output: ArchivalItem[]
    side_effects: []

  - method: GET
    path: "/archival-items/{id}"
    description: "Fetch one archival item with its custody counters."
    roles: [ArchivesDirector, Archivist, LegalCounsel, AccessServicesOfficer, PreservationOfficer]
    code: 200
    input: []
    output: ArchivalItem
    side_effects: []

  # ------------------------------------------------------------- storage zones
  - method: POST
    path: "/storage-zones"
    description: "Create a storage zone with its first environment reading."
    roles: [PreservationOfficer]
    code: 201
    input: [zone_code, temperature_c, relative_humidity_pct, max_overlapping_migration_jobs]
    output: StorageZone
    side_effects:
      - "runs calculations.zone_environmental_status over the creation reading; reading_count = 1"

  - method: GET
    path: "/storage-zones"
    description: "List storage zones."
    roles: [ArchivesDirector, Archivist, PreservationOfficer]
    code: 200
    input: ["environmental_status?", "limit?", "offset?"]
    output: StorageZone[]
    side_effects: []

  - method: GET
    path: "/storage-zones/{id}"
    description: "Fetch one storage zone."
    roles: [ArchivesDirector, Archivist, PreservationOfficer]
    code: 200
    input: []
    output: StorageZone
    side_effects: []

  - method: POST
    path: "/storage-zones/{id}/environment-readings"
    description: "Record a new temperature/humidity reading, re-deriving environmental_status."
    roles: [PreservationOfficer]
    code: 200
    input: [temperature_c, relative_humidity_pct]
    output: StorageZone
    side_effects:
      - "overwrites temperature_c and relative_humidity_pct, re-runs calculations.zone_environmental_status and increments reading_count by 1"

  # --------------------------------------------------------------- finding aids
  - method: POST
    path: "/finding-aids"
    description: "Draft a finding aid describing one accession."
    roles: [Archivist]
    code: 201
    input: [accession_id, title, arrangement_level, version_label]
    output: FindingAid
    side_effects:
      - "status DRAFT; described_item_count and stale_item_count 0"

  - method: GET
    path: "/finding-aids"
    description: "List finding aids, optionally filtered by the accession they describe."
    roles: [ArchivesDirector, Archivist, AccessServicesOfficer, Requester]
    code: 200
    input: ["accession_id?", "status?", "limit?", "offset?"]
    output: FindingAid[]
    side_effects: []

  - method: GET
    path: "/finding-aids/{id}"
    description: "Fetch one finding aid."
    roles: [ArchivesDirector, Archivist, AccessServicesOfficer, Requester]
    code: 200
    input: []
    output: FindingAid
    side_effects: []

  - method: POST
    path: "/finding-aids/{id}/submit-review"
    description: "Send a DRAFT or NEEDS_REVISION aid into review; the NEEDS_REVISION entry closes the revision cycle."
    roles: [Archivist]
    code: 200
    input: ["version_label?"]
    output: FindingAid
    side_effects:
      - "state_machines.FindingAid DRAFT -> UNDER_REVIEW or NEEDS_REVISION -> UNDER_REVIEW"
      - "recomputes described_item_count and stale_item_count; increments revision_cycle_count on the NEEDS_REVISION entry"

  - method: POST
    path: "/finding-aids/{id}/publish"
    description: "Publish a reviewed aid; refuses while any described item is stale."
    roles: [ArchivesDirector]
    code: 200
    input: []
    output: FindingAid
    side_effects:
      - "state_machines.FindingAid UNDER_REVIEW -> PUBLISHED; stamps published_at and recomputes described_item_count"

  # --------------------------------------------------------- preservation plans
  - method: POST
    path: "/preservation-plans"
    description: "Create a preservation plan with a budget for one storage zone."
    roles: [PreservationOfficer]
    code: 201
    input: [storage_zone_id, plan_name, budget_cents]
    output: PreservationPlan
    side_effects:
      - "status DRAFT; budget_committed_cents, budget_spent_cents and at_risk_unit_count all 0"

  - method: GET
    path: "/preservation-plans"
    description: "List preservation plans, optionally filtered by the zone they cover."
    roles: [ArchivesDirector, PreservationOfficer]
    code: 200
    input: ["storage_zone_id?", "status?", "limit?", "offset?"]
    output: PreservationPlan[]
    side_effects: []

  - method: GET
    path: "/preservation-plans/{id}"
    description: "Fetch one preservation plan with reconciled budget counters."
    roles: [ArchivesDirector, PreservationOfficer]
    code: 200
    input: []
    output: PreservationPlan
    side_effects: []

  - method: POST
    path: "/preservation-plans/{id}/activate"
    description: "Activate a plan, taking the first at-risk census of its zone."
    roles: [PreservationOfficer]
    code: 200
    input: []
    output: PreservationPlan
    side_effects:
      - "state_machines.PreservationPlan DRAFT -> ACTIVE"
      - "runs calculations.at_risk_unit_count; a zero census transitions straight to SATISFIED and stamps satisfied_at"

  - method: POST
    path: "/preservation-plans/{id}/close"
    description: "Close an active plan once no job on it is still open."
    roles: [PreservationOfficer]
    code: 200
    input: []
    output: PreservationPlan
    side_effects:
      - "state_machines.PreservationPlan ACTIVE -> CLOSED"

  # -------------------------------------------------------------- migration jobs
  - method: POST
    path: "/migration-jobs"
    description: "Request a format migration for one item inside a treatment window; the full six-step cost is frozen at creation."
    roles: [PreservationOfficer]
    code: 201
    input: [preservation_plan_id, archival_item_id, target_format, units, window_start, window_end]
    output: MigrationJob
    side_effects:
      - "stamps requested_by from X-User-ID; status PENDING_APPROVAL"
      - "runs calculations.migration_job_cost and freezes subtotal_cents, volume_discount_pct, discounted_cents, handling_fee_cents, condition_surcharge_cents and committed_cost_cents"

  - method: GET
    path: "/migration-jobs"
    description: "List migration jobs, optionally filtered by funding plan or by migrated item."
    roles: [ArchivesDirector, PreservationOfficer]
    code: 200
    input: ["preservation_plan_id?", "archival_item_id?", "status?", "limit?", "offset?"]
    output: MigrationJob[]
    side_effects: []

  - method: GET
    path: "/migration-jobs/{id}"
    description: "Fetch one migration job with its frozen cost breakdown."
    roles: [ArchivesDirector, PreservationOfficer]
    code: 200
    input: []
    output: MigrationJob
    side_effects: []

  - method: POST
    path: "/migration-jobs/{id}/approve"
    description: "Commit the job's frozen cost against the plan budget; enforces segregation of duties, zone window capacity and the budget ceiling."
    roles: [PreservationOfficer]
    code: 200
    input: []
    output: MigrationJob
    side_effects:
      - "state_machines.MigrationJob PENDING_APPROVAL -> APPROVED; stamps approved_by from X-User-ID"
      - "runs calculations.zone_migration_capacity before committing"
      - "adds committed_cost_cents to PreservationPlan.budget_committed_cents"

  - method: POST
    path: "/migration-jobs/{id}/start"
    description: "Begin treatment; refuses while the zone is out of environmental compliance."
    roles: [PreservationOfficer]
    code: 200
    input: []
    output: MigrationJob
    side_effects:
      - "state_machines.MigrationJob APPROVED -> IN_PROGRESS"
      - "the item moves ACCESSIONED -> IN_TREATMENT"

  - method: POST
    path: "/migration-jobs/{id}/complete"
    description: "Complete treatment; drives the two-hop preservation cascade onto the item and the plan."
    roles: [PreservationOfficer]
    code: 200
    input: []
    output: MigrationJob
    side_effects:
      - "state_machines.MigrationJob IN_PROGRESS -> COMPLETED"
      - "cascade hop 1: the item returns IN_TREATMENT -> ACCESSIONED with preservation_format = target_format and digital_surrogate_available = true"
      - "cascade hop 2: the plan re-runs calculations.at_risk_unit_count and auto-transitions ACTIVE -> SATISFIED at zero"
      - "moves committed_cost_cents from budget_committed_cents to budget_spent_cents"

  - method: POST
    path: "/migration-jobs/{id}/cancel"
    description: "Cancel a job. A PENDING_APPROVAL job lands in REJECTED with no budget movement; an APPROVED or IN_PROGRESS job lands in CANCELLED and releases exactly its committed amount."
    roles: [PreservationOfficer]
    code: 200
    input: [cancel_reason]
    output: MigrationJob
    side_effects:
      - "state_machines.MigrationJob PENDING_APPROVAL -> REJECTED, or APPROVED/IN_PROGRESS -> CANCELLED"
      - "subtracts exactly committed_cost_cents from PreservationPlan.budget_committed_cents when the job was APPROVED or IN_PROGRESS"
      - "an IN_PROGRESS cancellation returns the item IN_TREATMENT -> ACCESSIONED with preservation_format unchanged"

