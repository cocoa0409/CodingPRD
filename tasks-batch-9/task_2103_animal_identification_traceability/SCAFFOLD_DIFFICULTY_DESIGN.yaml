  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_lot_not_issuable_beats_referential_ain_out_of_range
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_LOT_NOT_ISSUABLE]
          - errors[ERR_AIN_OUT_OF_LOT_RANGE]
          - state_machines.TagLot.ISSUED_to_RECALLED
        distinguishing_aspect: |
          Category pair `state` (priority 10) versus `business_referential` (priority 14): one request
          violates both - the lot is RECALLED and the AIN's serial is outside the lot range - and the
          server must answer ERR_LOT_NOT_ISSUABLE, never ERR_AIN_OUT_OF_LOT_RANGE.
        test_recipe:
          setup:
            - "Supplier DMRS is APPROVED with one 4000-device lot issued to premises P (ACTIVE)."
            - "Eleven defect reports drive the score to 100 - 12*(11/4.0) = 67.00, auto-suspending the supplier and recalling the lot."
            - "The producer then tries to apply serial 100000009999, which is outside the lot's 100000000001-100000004000 range."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Ozark Cattle", contact_email: "ops@ozark.example", state_code: "MO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_v: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_v}", pin: "MOV0001", operation_type: "COW_CALF", state_code: "MO", capacity: 40 }
              as: Producer
              as_user_id: "${prod_v}"
              captures: { pv: $.data.id }
            - call: "POST /premises/${pv}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mo-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "Datamars US", supplier_code: "DMRS" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_v: $.data.id }
            - call: "POST /device-suppliers/${sup_v}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_v_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_v}", premises_id: "${pv}", serial_start: 100000000001, serial_end: 100000004000, expected_supplier_version: "${sup_v_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_v}"
              captures: { lot_v: $.data.id }
            - call: "POST /device-suppliers/${sup_v}/defect-reports"
              payload: { defect_count: 11 }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mo-1"
              captures: { score_after: $.data.conformance_score, status_after: $.data.status }
          trigger:
            - call: "POST /tag-lots/${lot_v}/apply-tag"
              payload: { ain: "840100000009999", species: "BOVINE", birth_date: "2026-02-10", birth_premises_id: "${pv}" }
              as: Producer
              as_user_id: "${prod_v}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${score_after} == 67.00"
            - "${status_after} == SUSPENDED"
            - "TagLot.${lot_v}.status == RECALLED"
            - "${err_id} == ERR_LOT_NOT_ISSUABLE"
            - "HTTP status is 409 (not 422)"
            - "No Tag and no Animal are created"

      - name: safety_hold_cooldown_beats_temporal_inverted_window
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_HOLD_COOLDOWN_ACTIVE]
          - errors[ERR_INVALID_WINDOW]
          - entities.Premises.fields.last_hold_released_at
        distinguishing_aspect: |
          Category pair `business_safety` (priority 12) versus `business_temporal` (priority 13): the
          request both lands inside the 72-hour post-release cooldown and carries effective_until
          earlier than effective_from, and the server must answer ERR_HOLD_COOLDOWN_ACTIVE, never
          ERR_INVALID_WINDOW.
        test_recipe:
          setup:
            - "Premises P is ACTIVE. A hold covering 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z was activated and then released at clock 2026-08-01T06:00:00Z, so last_hold_released_at is 2026-08-01T06:00:00Z and the cooldown runs to 2026-08-04T06:00:00Z."
            - "The new request asks for effective_from 2026-08-02T00:00:00Z (inside the cooldown) with effective_until 2026-08-01T12:00:00Z (before its own start)."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Bitterroot Livestock", contact_email: "ops@bitterroot.example", state_code: "MT" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_w: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_w}", pin: "MTW0001", operation_type: "COW_CALF", state_code: "MT", capacity: 40 }
              as: Producer
              as_user_id: "${prod_w}"
              captures: { pw: $.data.id }
            - call: "POST /premises/${pw}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { pw_v1: $.data.version }
            - call: "POST /hold-orders"
              payload: { premises_id: "${pw}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-02T00:00:00Z", expected_premises_version: "${pw_v1}" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { ho_w: $.data.id }
            - call: "POST /hold-orders/${ho_w}/activate"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /hold-orders/${ho_w}/release"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
            - call: "GET /premises/${pw}"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { pw_v2: $.data.version, released_anchor: $.data.last_hold_released_at }
          trigger:
            - call: "POST /hold-orders"
              payload: { premises_id: "${pw}", effective_from: "2026-08-02T00:00:00Z", effective_until: "2026-08-01T12:00:00Z", expected_premises_version: "${pw_v2}" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { err_id2: $.data.error_id }
          assert:
            - "${released_anchor} == 2026-08-01T06:00:00.000Z"
            - "${err_id2} == ERR_HOLD_COOLDOWN_ACTIVE"
            - "HTTP status is 409 (not 422)"
            - "Premises.${pw}.pending_hold_count == 0 (no new hold row was created)"

      - name: constraint_serial_overlap_beats_fiscal_issuance_cap
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_SERIAL_RANGE_OVERLAP]
          - errors[ERR_ISSUANCE_CAP_EXCEEDED]
          - calculations.supplier_conformance_score
        distinguishing_aspect: |
          Category pair `business_constraint` (priority 15) versus `business_fiscal` (priority 16):
          the requested range both intersects an existing lot and asks for 3001 devices against an
          issuance_cap of 2000, and the server must answer ERR_SERIAL_RANGE_OVERLAP, never
          ERR_ISSUANCE_CAP_EXCEEDED.
        test_recipe:
