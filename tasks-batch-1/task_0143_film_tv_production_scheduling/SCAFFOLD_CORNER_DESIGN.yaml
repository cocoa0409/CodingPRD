  - section: consistency_model
    instances:
      - name: page_eighths_visible_in_same_request_cycle
        claim_type: immediate
        grounds: [entities.ShootingDay.fields.estimated_page_eighths, endpoints]
        distinguishing_aspect: "After POST /scenes/{id}/schedule the parent ShootingDay's estimated_page_eighths is immediately consistent on the next GET (8 after a single 8-eighth scene)."
        test_recipe:
          setup: ["ACTIVE production with one PLANNED day; schedule an 8-eighth scene onto it."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-10-16", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /scenes"
              payload: { production_id: "${prod_id}", scene_number: "20A", page_eighths: 8, int_ext: "INT", day_night: "DAY" }
              as: FirstAD
              captures: { scene_id: $.data.id }
            - call: "POST /scenes/${scene_id}/schedule"
              payload: { shooting_day_id: "${day_id}" }
              as: FirstAD
          trigger:
            - call: "GET /shooting-days/${day_id}"
              payload: {}
              as: FirstAD
              captures: { pe: $.data.estimated_page_eighths }
          assert:
            - "ShootingDay.${day_id}.estimated_page_eighths == 8"
