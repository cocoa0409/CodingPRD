  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: no_access_strike_escalation_cascade
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_ACCESS_FAILED
          - calculations.no_access_escalation
          - entities.NoAccessCase.fields.stage
          - entities.CustomerNotification.fields.no_access_case_id
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /api/appointments/{id}/no-access:
          link1 Appointment NO_ACCESS -> WorkOrder strikes=3 + ACCESS_FAILED;
          link2 strike threshold -> NoAccessCase auto-created (OPEN, STAGE_1);
          link3 case creation -> CustomerNotification (DOOR_HANGER, SENT) auto-created.
          Each link is caused by the previous link, not by the original trigger.
        test_recipe:
          setup:
            - "Work order NOTIFIED; two prior no-access cycles already recorded (strikes = 2); third appointment BOOKED"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
