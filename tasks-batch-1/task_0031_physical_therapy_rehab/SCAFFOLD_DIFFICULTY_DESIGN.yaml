            - call: "GET /rehab/visits/${visit_id}"
              payload: {}
              as: BillingClerk
              captures: { v_status_after: $.data.status }
            - call: "GET /rehab/authorization-grants/${grant_id}"
              payload: {}
              as: BillingClerk
              captures: { g_status_after: $.data.status, g_consumed_after: $.data.units_consumed }
          assert:
            - "PlanOfCare.${poc_id}.status == DISCHARGED"
            - "Visit.${visit_id}.status == CANCELLED"
            - "AuthorizationGrant.${grant_id}.units_consumed == 0"
            - "AuthorizationGrant.${grant_id}.status == CANCELLED"

      - name: visit_finalize_depth2_cumulative_then_posture_to_exceeded
        grounds:
          - state_machines.Visit.COMPLETED_to_FINALIZED
          - calculations.cumulative_billed
          - calculations.capped_poc_posture
          - entities.PlanOfCare.fields.capped_status
        distinguishing_aspect: |
          Triggered by Visit COMPLETED -> FINALIZED. Hop1 — finalize side-effect
