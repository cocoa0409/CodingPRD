      - name: c_wash_validity_window_restricted_tightens
        claim_type: conditional_action
        grounds:
          - "calculations.wash_water_result"
          - "errors[ERR_WASH_CHECK_STALE]"
        distinguishing_aspect: "The wash-validity window is posture-conditional: under RESTRICTED a PASS exactly 4h old still authorizes a run (inclusive boundary) but 4.5h old fails — while under NORMAL the same 4.5h-old PASS would pass the 12h window."
        test_recipe:
          setup:
            - "allocated order (requested 75.00, reservation raw 100.00 at default blend) on a shed whose only PASS was measured 2026-08-10T00:00:00Z, followed by two mild FAILs at 00:30 and 00:45 driving posture RESTRICTED"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
