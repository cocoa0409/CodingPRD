  - section: endpoints
    instances:
      - name: registrations_list_pagination_and_filter
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET_/api/registrations"]
        distinguishing_aspect: "List endpoint honors the fixed envelope: default limit 10 with total_count and has_more; limit=2 returns the first two registrations in created_at order with has_more true; offset=2 returns the remainder with has_more false."
        test_recipe:
          setup: ["tournament with 3 registrations"]
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Page Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p3", date_of_birth: "2000-03-03", region: NA }, as: OrganizerAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Gamma", manager_contact_email: "g@x.gg", region_rank_points: 60, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p3}" }, as: OrganizerAdmin, captures: { r3: $.data.id } }
          trigger:
            - { call: "GET /api/registrations?tournament_id=${t}", as: TournamentDirector }
            - { call: "GET /api/registrations?tournament_id=${t}&limit=2", as: TournamentDirector }
            - { call: "GET /api/registrations?tournament_id=${t}&limit=2&offset=2", as: TournamentDirector }
          assert:
            - "default page: response_type == array, data has 3 items ordered ${r1}, ${r2}, ${r3} (created_at ASC); total_count == 3, has_more == false, limit == 10, offset == 0"
            - "limit=2 page: data == [${r1}, ${r2}], total_count == 3, has_more == true"
            - "limit=2&offset=2 page: data == [${r3}], has_more == false"

      - name: response_envelope_meta_and_error_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every response uses the fixed envelope: success carries meta.api_request_id + meta.api_request_timestamp + response_type; errors carry response_type == error with data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/players", payload: { handle: "env", date_of_birth: "2001-01-01", region: APAC }, as: OrganizerAdmin, captures: { p: $.data.id } }
            - { call: "GET /api/players/00000000-0000-0000-0000-000000000000", as: OrganizerAdmin, captures: { err: $.data.error_id } }
          assert:
            - "success response: meta.api_request_id present and non-empty, meta.api_request_timestamp ISO8601, response_type == object, data.id == ${p}"
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

