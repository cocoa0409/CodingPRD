  # ===========================================================================
  # Section: validations (Table 4 claims)
  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "Priority 1 auth: a request sent with no X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT before any other check."
        test_recipe:
          setup: ["Empty database; request carries no auth headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { client_name: "No Auth", client_address: "1 Authless Way", client_phone: "555-0401" }
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"

      - name: existence_check_case_before_nested_quote
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "Existence validated left-to-right: with BOTH caseId and quoteId unknown, the error must be ERR_CASE_NOT_FOUND (the leftmost path segment), not ERR_QUOTE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000/quotes/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_CASE_NOT_FOUND (leftmost missing resource wins)"

      - name: assessment_scheduled_in_past_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_SCHEDULE_DATE]
        distinguishing_aspect: "Priority 7 temporal: with clock at 2026-06-01, an assessment scheduled_date of 2026-05-01 (in the past) is rejected with ERR_INVALID_SCHEDULE_DATE 422."
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; INTAKE case exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Quo Tam", client_address: "43 Past Ln", client_phone: "555-0402" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-30", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_SCHEDULE_DATE"
            - "Case.${case_id}.status == INTAKE (no assessment persisted)"

      - name: allocation_above_remaining_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_ALLOCATION_EXCEEDS_REMAINING]
        distinguishing_aspect: "Standalone fiscal check (the §1.8 priority instance pairs it with a restriction violation): amount 10001 against remaining 10000 is rejected with ERR_ALLOCATION_EXCEEDS_REMAINING 422."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case ASSESSED; quote SUBMITTED total 5000 (contingency 0); funding APPROVED 10000 remaining 10000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Rae Ulf", client_address: "44 Exceed Ave", client_phone: "555-0403" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "ot-31", assessor_role: "OT", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 50, hazard_count: 1 }
              as: IntakeCoordinator
              captures: { asmt_id: $.data.id }
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/start"
              payload: {}
              as: Assessor
            - call: "POST /cases/${case_id}/assessments/${asmt_id}/complete"
              payload: { mobility_score: 50, hazard_count: 1, recommended_modifications: ["RAMP"] }
              as: Assessor
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", contingency_pct: 0.0, expected_case_version: "${case_v1}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
            - call: "POST /cases/${case_id}/quotes/${quote_id}/line-items"
              payload: { line_type: "MATERIAL", description: "Kit", quantity: 1, unit: "each", unit_price_cents: 5000, tax_rate_pct: 0.0, sort_order: 1 }
              as: ProjectManager
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "STATE_GRANT", program_name: "G1", requested_cents: 10000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 10000, expected_case_version: "${case_v2}" }
              as: FundingCoordinator
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/allocations"
              payload: { quote_id: "${quote_id}", amount_cents: 10001, allocation_type: "QUOTE_LEVEL" }
              as: FundingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_ALLOCATION_EXCEEDS_REMAINING"
            - "FundingSource.${fs_id}.remaining_cents == 10000 (unchanged)"

      - name: third_party_invoice_above_funding_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVOICE_EXCEEDS_FUNDING]
        distinguishing_aspect: "Third-party billed invoice whose total 12000 exceeds case total_funded_cents 10000 is rejected with ERR_INVOICE_EXCEEDS_FUNDING 422; the check can only fire once the invoice total is known, i.e. at send time after line items are added."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case INTAKE; funding APPROVED 10000; DRAFT invoice with funding_source_id set and one line 12000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Sky Vann", client_address: "45 Thirdparty Rd", client_phone: "555-0404" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/funding-sources"
              payload: { source_type: "PRIVATE_INSURANCE", program_name: "InsCo", requested_cents: 10000, priority_rank: 1 }
              as: FundingCoordinator
              captures: { fs_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/funding-sources/${fs_id}/approve"
              payload: { approved_cents: 10000, expected_case_version: "${case_v1}" }
              as: FundingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/invoices"
              payload: { invoice_type: "INSTALLATION", due_date: "2026-06-01T00:00:00Z", funding_source_id: "${fs_id}", expected_case_version: "${case_v2}" }
              as: BillingCoordinator
              captures: { inv_id: $.data.id }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/line-items"
              payload: { description: "Overfunded work", quantity: 1, unit_price_cents: 12000, tax_rate_pct: 0.0 }
              as: BillingCoordinator
          trigger:
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v3: $.data.version }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/send"
              payload: { expected_case_version: "${case_v3}" }
              as: BillingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVOICE_EXCEEDS_FUNDING"
            - "Invoice.${inv_id}.status == DRAFT (not sent)"
            - "Case.${case_id}.total_billed_cents == 0"

      - name: line_item_zero_price_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6b]
          - errors[ERR_INVALID_LINE_ITEM]
        distinguishing_aspect: "Standalone 6b violation on a DRAFT quote (state check passes): unit_price_cents 0 is rejected with ERR_INVALID_LINE_ITEM 422."
