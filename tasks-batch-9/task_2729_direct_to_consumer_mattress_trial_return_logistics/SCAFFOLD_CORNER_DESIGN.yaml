      - name: approving_an_exchange_on_a_stale_order_version_is_rejected
        claim_type: Optimistic concurrency
        grounds:
          - concurrency_rules[exchange-approve-stale-order]
          - validations[priority=14]
          - errors.ERR_STALE_ORDER_VERSION
        distinguishing_aspect: "Here the OCC parent is the order the exchange will retire: the version observed at order creation is two writes behind after dispatch and delivery, so approve answers 412 ERR_STALE_ORDER_VERSION and mints nothing; with the current version the same call approves and mints the replacement."
        test_recipe:
          setup:
            - "A QUEEN MEDIUM model and a QUEEN FIRM model, both 120000."
            - "One Customer whose DTC MEDIUM order is created (version captured here), then dispatched and delivered on 2026-08-01."
            - "Clock 2026-08-22 (break-in elapsed); a REQUESTED ComfortExchange to the FIRM model."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-C3M", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-C3F", name: "Comfort Q Firm", firmness: "FIRM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { m2: $.data.id }
