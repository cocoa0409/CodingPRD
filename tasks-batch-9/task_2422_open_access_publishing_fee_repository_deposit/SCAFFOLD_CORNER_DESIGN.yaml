      - name: corner_every_entity_lookup_has_its_own_not_found_code
        claim_type: not_found_error
        grounds:
          - errors[ERR_PUBLISHER_NOT_FOUND]
          - errors[ERR_JOURNAL_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_COVERAGE_NOT_FOUND]
          - errors[ERR_AUTHOR_NOT_FOUND]
          - errors[ERR_FUNDER_NOT_FOUND]
          - errors[ERR_GRANT_NOT_FOUND]
          - errors[ERR_FUND_NOT_FOUND]
          - errors[ERR_ARTICLE_NOT_FOUND]
          - errors[ERR_DETERMINATION_NOT_FOUND]
          - errors[ERR_FUND_REQUEST_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_DEPOSIT_NOT_FOUND]
        distinguishing_aspect: |
          Thirteen reads against unknown ids each return their own entity-specific 404 code
          rather than a single generic ERR_NOT_FOUND. The coverage code is reachable through the
          determination list's coverage_id filter, which is the only place an AgreementCoverage
          id is accepted from the caller.
        test_recipe:
          setup:
            - "empty database, so every id below is unknown"
          setup_api_calls: []
          trigger:
            - call: "GET /publishers/00000000-0000-4000-8000-000000000001"
              as: AgreementAdmin
              captures: { x3_publisher: $.data.error_id }
            - call: "GET /journals/00000000-0000-4000-8000-000000000002"
              as: AgreementAdmin
              captures: { x3_journal: $.data.error_id }
            - call: "GET /transformative-agreements/00000000-0000-4000-8000-000000000003"
              as: AgreementAdmin
              captures: { x3_agreement: $.data.error_id }
            - call: "GET /eligibility-determinations"
              payload: { coverage_id: "00000000-0000-4000-8000-000000000004", limit: 10, offset: 0 }
              as: ScholCommLibrarian
              captures: { x3_coverage: $.data.error_id }
            - call: "GET /authors/00000000-0000-4000-8000-000000000005"
              as: AgreementAdmin
              captures: { x3_author: $.data.error_id }
            - call: "GET /funders/00000000-0000-4000-8000-000000000006"
              as: AgreementAdmin
              captures: { x3_funder: $.data.error_id }
            - call: "GET /grants/00000000-0000-4000-8000-000000000007"
              as: FundManager
              captures: { x3_grant: $.data.error_id }
            - call: "GET /apc-funds/00000000-0000-4000-8000-000000000008"
              as: FundManager
              captures: { x3_fund: $.data.error_id }
            - call: "GET /articles/00000000-0000-4000-8000-000000000009"
              as: ScholCommLibrarian
              captures: { x3_article: $.data.error_id }
            - call: "GET /eligibility-determinations/00000000-0000-4000-8000-00000000000a"
              as: ScholCommLibrarian
              captures: { x3_determination: $.data.error_id }
            - call: "GET /fund-requests/00000000-0000-4000-8000-00000000000b"
              as: FundManager
              captures: { x3_request: $.data.error_id }
            - call: "GET /publisher-invoices/00000000-0000-4000-8000-00000000000c"
              as: FundManager
              captures: { x3_invoice: $.data.error_id }
            - call: "GET /repository-deposits/00000000-0000-4000-8000-00000000000d"
              as: RepositoryCurator
              captures: { x3_deposit: $.data.error_id }
          assert:
            - "every response returned HTTP 404"
            - "${x3_publisher} == ERR_PUBLISHER_NOT_FOUND"
            - "${x3_journal} == ERR_JOURNAL_NOT_FOUND"
            - "${x3_agreement} == ERR_AGREEMENT_NOT_FOUND"
            - "${x3_coverage} == ERR_COVERAGE_NOT_FOUND"
            - "${x3_author} == ERR_AUTHOR_NOT_FOUND"
            - "${x3_funder} == ERR_FUNDER_NOT_FOUND"
            - "${x3_grant} == ERR_GRANT_NOT_FOUND"
            - "${x3_fund} == ERR_FUND_NOT_FOUND"
            - "${x3_article} == ERR_ARTICLE_NOT_FOUND"
            - "${x3_determination} == ERR_DETERMINATION_NOT_FOUND"
            - "${x3_request} == ERR_FUND_REQUEST_NOT_FOUND"
            - "${x3_invoice} == ERR_INVOICE_NOT_FOUND"
            - "${x3_deposit} == ERR_DEPOSIT_NOT_FOUND"

      - name: corner_each_uniqueness_rule_has_its_own_conflict_code
        claim_type: conflict_error
        grounds:
          - errors[ERR_DUPLICATE_CODE]
          - errors[ERR_DUPLICATE_ISSN]
          - errors[ERR_DUPLICATE_ORCID]
          - errors[ERR_DUPLICATE_AGREEMENT_CODE]
          - errors[ERR_DUPLICATE_FUND_PRIORITY]
        distinguishing_aspect: |
          Five distinct uniqueness rules produce five distinct 409 codes. The duplicate
          agreement_code is submitted on an abutting window [2026-10-01, 2027-01-01) so the
          higher-priority overlap rule cannot fire first, isolating ERR_DUPLICATE_AGREEMENT_CODE.
          ISSN uniqueness is global (the clash is on a different publisher), fund_code
          uniqueness is global (the clash is in a different fiscal year), while
          (fiscal_year, priority_rank) is the composite key behind ERR_DUPLICATE_FUND_PRIORITY.
        test_recipe:
