          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (http 403)"

      - name: rbac_owner_of_other_vessel_denied
        claim_type: role_denial
        grounds:
          - roles[VesselOwner]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "VesselOwner is entity-backed: owner of vessel A passing vessel_id B fails ownership (ERR_NOT_RESOURCE_OWNER), distinct from a role error."
        test_recipe:
          setup: ["two ACTIVE vessels A and B with permits; one opening"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-R7A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { vA: $.data.id } }
            - { call: "POST /vessels/${vA}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${vA}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-R7B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { vB: $.data.id } }
            - { call: "POST /vessels/${vB}/activate", as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /fishing-trips", payload: { vessel_id: "${vB}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${vA}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (http 403): X-User-ID ${vA} != vessel_id ${vB}"

  # ------------------------------------------------- cross-cutting layers ---
  - section: cross_cutting_layers
    instances:
      - name: occ_observer_assign_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[observer-assignment-stale-observer]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Second assign carrying the observer's pre-first-assign version is rejected with 412 even though both assignments would individually be legal (non-overlapping coverages)."
        test_recipe:
          setup: ["two observer-required trips (a1, a2 REQUESTED); cert-A observer at version 1"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-X1A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-31T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs One", certification_level: "A", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T00:00:00Z", planned_return_utc: "2026-08-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tA: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-17T00:00:00Z", planned_return_utc: "2026-08-22T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { tB: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${tA}", as: ObserverCoordinator, captures: { aA: "$.data[0].id" } }
            - { call: "GET /observer-assignments?trip_id=${tB}", as: ObserverCoordinator, captures: { aB: "$.data[0].id" } }
          trigger:
            - { call: "POST /observer-assignments/${aA}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-15T00:00:00Z", expected_observer_version: "${ob_v}" }, as: ObserverCoordinator }
            - { call: "POST /observer-assignments/${aB}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-17T00:00:00Z", coverage_to: "2026-08-22T00:00:00Z", expected_observer_version: "${ob_v}" }, as: ObserverCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "first assign succeeds (observer version 1 -> 2, status ON_ASSIGNMENT)"
            - "second assign with the stale captured version -> ERR_STALE_VERSION (http 412)"
            - "ObserverAssignment.${aB}.status stays REQUESTED"

      - name: occ_trip_patch_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[trip-reschedule-stale-trip]
        distinguishing_aspect: "Rescheduling with a superseded trip version is rejected with 412; the current version reschedules cleanly."
        test_recipe:
          setup: ["PLANNED trip at version 1"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-X2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id, t_v: $.data.version } }
          trigger:
            - { call: "PATCH /fishing-trips/${t1}", payload: { planned_departure_utc: "2026-08-11T06:00:00Z", planned_return_utc: "2026-08-13T06:00:00Z", expected_trip_version: "${t_v}" }, as: VesselOwner, as_user_id: "${v1}", captures: { t_v2: $.data.version } }
            - { call: "PATCH /fishing-trips/${t1}", payload: { planned_departure_utc: "2026-08-12T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z", expected_trip_version: "${t_v}" }, as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "first patch succeeds (version 1 -> 2, window updated)"
            - "second patch with the original version -> ERR_STALE_VERSION (http 412); window unchanged at 2026-08-11..2026-08-13"

      - name: occ_settlement_recalculate_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settlement-recalc-stale-settlement]
        distinguishing_aspect: "Recalculate requires the version observed before the dispute; a pre-dispute version is stale after the dispute bump and is rejected with 412."
        test_recipe:
          setup: ["settlement CALCULATED then DISPUTED (versions 2 then 3)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-X3", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator }
            - { call: "POST /landing-declarations/${ld1}/finalize", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/crew-contracts", payload: { crew_name: "Alice", share_points: 1, joined_at: "2026-01-15T00:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { c1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/settlement", payload: { gross_revenue_cents: 1000000 }, as: SettlementClerk, captures: { s1: $.data.id } }
            - { call: "POST /trip-settlements/${s1}/calculate", as: SettlementClerk, captures: { s_v2: $.data.version } }
            - { call: "POST /trip-settlements/${s1}/dispute", as: CrewMember, as_user_id: "${c1}", captures: { s_v3: $.data.version } }
          trigger:
            - { call: "POST /trip-settlements/${s1}/recalculate", payload: { expected_settlement_version: "${s_v2}" }, as: SettlementClerk, captures: { err: $.data.error_id } }
            - { call: "POST /trip-settlements/${s1}/recalculate", payload: { expected_settlement_version: "${s_v3}" }, as: SettlementClerk, captures: { st_ok: $.data.status } }
          assert:
            - "recalculate with the pre-dispute version -> ERR_STALE_VERSION (http 412)"
            - "recalculate with the post-dispute version -> 200 CALCULATED"

      - name: occ_transfer_counter_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-counter-stale-transfer]
        distinguishing_aspect: "A counter referencing one round behind the current offer is rejected with 412 — negotiation rounds are OCC-serialized."
        test_recipe:
          setup: ["PROPOSED transfer at version 1"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-X4A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-X4B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id, tr_v: $.data.version } }
          trigger:
            - { call: "POST /quota-transfers/${tr}/counter", payload: { pounds: 4500, price_per_lb_cents: 450, expected_transfer_version: "${tr_v} - 1" }, as: VesselOwner, as_user_id: "${v2}", captures: { err: $.data.error_id } }
          assert:
            - "counter with expected_transfer_version one behind -> ERR_STALE_VERSION (http 412)"
            - "QuotaTransfer.${tr} stays PROPOSED at round_number 1"

      - name: clock_default_before_any_set
        claim_type: scheduled_actions
        grounds:
          - state_machines.SeasonOpening.SCHEDULED_to_OPEN
        distinguishing_aspect: "Before any set_current_utc call the clock reads exactly 2026-08-01T00:00:00Z: an opening created with opens_at 2026-08-05 stays SCHEDULED, and setting the clock to 2026-08-01T00:00:00Z is already a regression."
        test_recipe:
          setup: ["opening opens 2026-08-05, created without any prior clock call"]
          setup_api_calls:
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
          trigger:
            - { call: "GET /season-openings/${o1}", as: FisheriesRegulator, captures: { st: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FisheriesRegulator, captures: { err: $.data.error_id } }
          assert:
            - "SeasonOpening.${o1}.status == SCHEDULED (default clock 2026-08-01T00:00:00Z < opens_at)"
            - "set_current_utc to 2026-08-01T00:00:00Z -> ERR_CLOCK_REGRESSION, proving the default is already that instant (monotonic, non-wall-clock)"

      - name: exempt_vessel_never_requires_observer
        claim_type: conditional_feature_flags
        grounds:
          - entities.Vessel.fields.observer_coverage_class
          - entities.FishingTrip.fields.observer_required
        distinguishing_aspect: "EXEMPT class overrides the duration rule entirely: a 200h trip on an EXEMPT vessel has observer_required == false, no assignment is auto-created, and depart succeeds with no coverage."
        test_recipe:
          setup: ["EXEMPT vessel ACTIVE with permit; opening covering a 200h trip"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Small", license_number: "LIC-X6", home_port: "HOMER", length_ft: 28, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FisheriesRegulator }
          trigger:
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T00:00:00Z", planned_return_utc: "2026-08-18T08:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id, req: $.data.observer_required } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}", captures: { st: $.data.status } }
          assert:
            - "observer_required == false despite the 200h duration"
            - "zero ObserverAssignments exist for the trip"
            - "depart succeeds with no assignment and no waiver -> DEPARTED"

  # ------------------------------------------------------- consistency model ---
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.QuotaShareHolding.fields.landed_pounds
        distinguishing_aspect: "Immediate consistency: the verify response and an immediate re-read of the declaration and the holding both reflect the landed pounds — no eventual-consistency lag anywhere."
        test_recipe:
          setup: ["trip RETURNED, declaration SUBMITTED for 4000 lbs"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-M1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator, captures: { h1: $.data.id } }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/catch-reports", payload: { fishery_code: "HALIBUT", report_type: "HARVEST", reported_lbs: 4000, reported_at: "2026-08-11T06:00:00Z" }, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips/${t1}/return", as: Captain, as_user_id: "${v1}" }
            - { call: "POST /fishing-trips/${t1}/landing-declarations", payload: { port_code: "HOMER", lines: [{ fishery_code: "HALIBUT", declared_lbs: 4000 }] }, as: Captain, as_user_id: "${v1}", captures: { ld1: $.data.id } }
            - { call: "POST /landing-declarations/${ld1}/submit", as: Captain, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /landing-declarations/${ld1}/verify", as: FisheriesRegulator, captures: { st: $.data.status } }
            - { call: "GET /landing-declarations/${ld1}", as: FisheriesRegulator, captures: { st2: $.data.status } }
            - { call: "GET /quota-holdings/${h1}", as: FisheriesRegulator, captures: { landed: $.data.landed_pounds } }
          assert:
            - "verify response status == VERIFIED in the same response"
            - "immediate GET declaration == VERIFIED; GET holding landed_pounds == 4000 — same logical instant"

  # ------------------------------------ state_machines: precondition errors ---
  - section: state_machines
    instances:
      - name: gear_shortage_blocks_depart
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FishingTrip.PLANNED_to_DEPARTED
          - errors[ERR_GEAR_SHORTAGE]
        distinguishing_aspect: "Depart checks operational gear units per required gear type; 4 operational LONGLINE units cannot satisfy a 5-unit requirement."
        test_recipe:
          setup: ["ACTIVE vessel, OPEN opening, gear asset LONGLINE 4 units; trip requires 5"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z1", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/gear-assets", payload: { gear_type: "LONGLINE", units_total: 4 }, as: VesselOwner, as_user_id: "${v1}" }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: FisheriesRegulator }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-12T06:00:00Z", gear_requirements: [{ gear_type: "LONGLINE", units: 5 }] }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /fishing-trips/${t1}/depart", as: Captain, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GEAR_SHORTAGE (http 409); trip stays PLANNED"

      - name: observer_cert_insufficient_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ObserverAssignment.REQUESTED_to_ASSIGNED
          - errors[ERR_OBSERVER_CERT_INSUFFICIENT]
        distinguishing_aspect: "PARTIAL-class vessels require cert A or B; a cert-C observer cannot be assigned."
        test_recipe:
          setup: ["observer-required trip (REQUESTED assignment); cert-C observer"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z2", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /season-openings", payload: { fishery_code: "HALIBUT", area_code: "3A", opens_at: "2026-08-05T00:00:00Z", closes_at: "2026-08-25T00:00:00Z", tac_pounds: 100000 }, as: FisheriesRegulator, captures: { o1: $.data.id } }
            - { call: "POST /observers", payload: { observer_name: "Obs Junior", certification_level: "C", home_base: "HOMER" }, as: ObserverCoordinator, captures: { ob1: $.data.id, ob_v: $.data.version } }
            - { call: "POST /fishing-trips", payload: { vessel_id: "${v1}", season_opening_id: "${o1}", planned_departure_utc: "2026-08-10T06:00:00Z", planned_return_utc: "2026-08-14T06:00:00Z" }, as: VesselOwner, as_user_id: "${v1}", captures: { t1: $.data.id } }
            - { call: "GET /observer-assignments?trip_id=${t1}", as: ObserverCoordinator, captures: { a1: "$.data[0].id" } }
          trigger:
            - { call: "POST /observer-assignments/${a1}/assign", payload: { observer_id: "${ob1}", coverage_from: "2026-08-10T00:00:00Z", coverage_to: "2026-08-14T06:00:00Z", expected_observer_version: "${ob_v}" }, as: ObserverCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OBSERVER_CERT_INSUFFICIENT (http 422); assignment stays REQUESTED"

      - name: accept_own_offer_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QuotaTransfer.PROPOSED_to_ACCEPTED
          - errors[ERR_TRANSFER_OWN_OFFER]
        distinguishing_aspect: "The side that tabled the current offer cannot accept it — accept must come from the counterparty."
        test_recipe:
          setup: ["PROPOSED transfer (last_offered_by FROM_VESSEL)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z3A", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 20000 }, as: FisheriesRegulator }
            - { call: "POST /vessels", payload: { vessel_name: "FV Bristol", license_number: "LIC-Z3B", home_port: "KODIAK", length_ft: 42, observer_coverage_class: "EXEMPT" }, as: FisheriesRegulator, captures: { v2: $.data.id } }
            - { call: "POST /vessels/${v2}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/permits", payload: { fishery_code: "HALIBUT", gear_type: "POT", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v2}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 5000 }, as: FisheriesRegulator }
            - { call: "POST /quota-transfers", payload: { from_vessel_id: "${v1}", to_vessel_id: "${v2}", fishery_code: "HALIBUT", season_year: 2026, pounds: 5000, price_per_lb_cents: 400 }, as: VesselOwner, as_user_id: "${v1}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /quota-transfers/${tr}/accept", as: VesselOwner, as_user_id: "${v1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_OWN_OFFER (http 409): proposer cannot accept their own offer"

      - name: no_active_crew_blocks_calculate
