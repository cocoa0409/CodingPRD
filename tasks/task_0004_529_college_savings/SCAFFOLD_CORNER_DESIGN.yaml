  # Section: endpoints
  # ============================================================
  - section: endpoints
    instances:
      - name: scheduler_tick_due_schedule_produces_recurring_contribution
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /_scheduler/tick"]
          - state_machines.Contribution.DRAFT_to_POSTED
        distinguishing_aspect: "/_scheduler/tick with an ACTIVE schedule due (next_run_utc <= current_utc) produces and POSTs one RECURRING Contribution; advances next_run_utc and posted_runs."
        test_recipe:
          setup:
            - "Account a OPEN."
            - "ScheduledContribution s MONTHLY 50000 ACTIVE."
            - "Clock advanced past next_run_utc."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "DST", state_code: "CA", federal_tax_id_last4: "1111", email: "dst@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BST", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /scheduled-contributions"
              payload: { account_id: "${a_id}", amount_cents: 50000, cadence: "MONTHLY" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00.000Z" }
              as: CustodianAgent
          trigger:
            - call: "POST /_scheduler/tick"
              payload: {}
              as: CustodianAgent
            - call: "GET /scheduled-contributions/${s_id}"
              payload: {}
              as: CustodianAgent
              captures: { posted_runs: $.data.posted_runs }
            - call: "GET /contributions"
              payload: { scheduled_contribution_id: "${s_id}" }
              as: CustodianAgent
          assert:
            - "ScheduledContribution.${s_id}.posted_runs == 1"
            - "GET /contributions filtered by scheduled_contribution_id returns 1 POSTED RECURRING contribution"
            - "Account.${a_id}.account_balance_cents == 50000"

  # ============================================================
  # Section: errors
  # ============================================================
  - section: errors
    instances:
      - name: every_error_is_triggerable_audit
        claim_type: error_triggerability
        grounds:
          - errors
        distinguishing_aspect: "Every error_id declared in §1.6 has at least one trigger in §1.8 or §1.9. Covered audit: ERR_UNAUTHENTICATED (auth section below), ERR_FORBIDDEN (rbac section below), ERR_SEGREGATION_OF_DUTIES (rule 5 instance 2), ERR_NOT_FOUND (entities section), ERR_REFERENCED_NOT_FOUND (entities section), ERR_INVALID_REQUEST (entities section), ERR_INVALID_STATE (rule 5/7 + state_machines section), ERR_STALE_ACCOUNT_VERSION (corner instances below), ERR_BENEFICIARY_NOT_FAMILY_MEMBER (validations section), ERR_INSUFFICIENT_BALANCE (validations section), ERR_REVISION_LIMIT_EXCEEDED (validations section), ERR_REVERSE_WINDOW_CLOSED (rule 8 instance 2), ERR_UNSUPPORTED_STATE_CODE (entities section), ERR_EMAIL_TAKEN (validations section), ERR_FORM_ALREADY_EXISTS (validations section), ERR_INCENTIVE_ALREADY_EXISTS (validations section), ERR_FORM_PREMATURE_ISSUANCE (rule 6 instance 2), ERR_FORM_CORRECTION_WINDOW_CLOSED (validations section)."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_business_fiscal_on_revise_after_three_rejections
          rationale: "Audit-only meta-claim; the substantive triggers are realized across all sibling corner and §1.8 instances; this entry serves as the §1.6 coverage audit."

  # ============================================================
  # Section: rbac
  # ============================================================
  - section: rbac
    instances:
      - name: missing_x_user_role_header_unauthenticated
        claim_type: missing_credentials
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Request without X-User-Role header → 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["No auth header on request."]
          setup_api_calls: []
          trigger:
            - call: "POST /donors"
              payload: { full_name: "X", state_code: "CA", federal_tax_id_last4: "1111", email: "unauth@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: account_owner_cannot_create_donor
        claim_type: exclusive_op_denial
        grounds:
          - roles.AccountOwner
          - roles.CustodianAgent
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /donors is CustodianAgent-exclusive; AccountOwner attempting it → 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Donor d_existing acting as AccountOwner."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DXO", state_code: "CA", federal_tax_id_last4: "1111", email: "dxo@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /donors"
              payload: { full_name: "Y", state_code: "CA", federal_tax_id_last4: "2222", email: "y@x.com" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: account_owner_cannot_approve_own_withdrawal
        claim_type: segregation_of_duties
        grounds:
          - roles.ComplianceOfficer
          - validations[priority=2]
        distinguishing_aspect: "Withdrawal.approve is ComplianceOfficer-exclusive; AccountOwner attempting /approve → 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Withdrawal w SUBMITTED owned by donor d."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "DAO", state_code: "CA", federal_tax_id_last4: "1111", email: "dao@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BAO", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 100000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
              captures: { a_v2: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 30000, expense_class: "HIGHER_ED_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /withdrawals/${w_id}/approve"
              payload: { expected_account_version: "${a_v2}" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

  # ============================================================
  # Section: cross_cutting_complexity_layers
  # ============================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_withdrawal_approve
        claim_type: optimistic_concurrency_stale_version
        grounds:
          - concurrency_rules[withdrawal-approve-stale-account]
          - validations[priority=7]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        distinguishing_aspect: "Approving a Withdrawal with expected_account_version one less than current Account.version → 412 ERR_STALE_ACCOUNT_VERSION."
        test_recipe:
          setup:
            - "Account a with posted contribution=200000; withdrawal w SUBMITTED."
            - "Account version bumped by /restrict + /release after officer's last read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "DSV", state_code: "CA", federal_tax_id_last4: "1111", email: "dsv@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BSV", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 200000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
              captures: { a_v_observed: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 50000, expense_class: "HIGHER_ED_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
            - call: "POST /accounts/${a_id}/restrict"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /accounts/${a_id}/release"
              payload: {}
              as: ComplianceOfficer
              captures: { a_v_current: $.data.version }
          trigger:
            - call: "POST /withdrawals/${w_id}/approve"
              payload: { expected_account_version: "${a_v_observed}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 412"
            - "response.data.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "Withdrawal.${w_id}.status == SUBMITTED"

      - name: rate_threshold_k12_cap_boundary
        claim_type: rate_threshold_triggers_boundary
        grounds:
          - calculations.k12_excess_calc
        excluded_because:
          difficulty_instance: boundary_precision_check / k12_cap_exact_equality_no_excess
          rationale: "K-12 annual cap boundary already tested as the named §1.8 instance."

      - name: derived_field_account_balance_reconciles_after_contribution
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Account.fields.account_balance_cents
        excluded_because:
          difficulty_instance: transitive_cascade / contribution_post_cascade_to_state_tax_incentive_via_account
          rationale: "Account.account_balance_cents reconciliation after Contribution.POSTED is asserted in the named §1.8 cascade instance."

      - name: dual_variant_earnings_ratio_pre_vs_post
        claim_type: dual_variant_calculation_divergence
        grounds:
          - calculations.earnings_ratio
        excluded_because:
          difficulty_instance: dual_variant_calc / earnings_ratio_pre_vs_post_disbursal_divergence
          rationale: "Pre vs post disbursal earnings_ratio divergence is the named §1.8 instance."

  # ============================================================
  # Section: consistency_model
  # ============================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_post_returns_final_state
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "consistency_model: immediate — POST /contributions/{id}/post returns the contribution with status=POSTED in the same response (no async lag)."
        test_recipe:
          setup: ["Account a with one DRAFT contribution c."]
          setup_api_calls:
            - call: "POST /donors"
              payload: { full_name: "DIC", state_code: "CA", federal_tax_id_last4: "1111", email: "dic@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BIC", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 50000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
              captures: { st: $.data.status }
            - call: "GET /accounts/${a_id}"
              payload: {}
              as: CustodianAgent
              captures: { bal: $.data.account_balance_cents }
          assert:
            - "post-response data.status == POSTED"
            - "Account.${a_id}.account_balance_cents == 50000 (visible in same-batch GET)"
