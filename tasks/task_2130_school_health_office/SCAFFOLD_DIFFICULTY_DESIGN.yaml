  - rule_id: priority_pair_validation_conflict
    instances:

      - name: conflict_a_visit_state_outranks_consent_not_granted
        grounds:
          - validations[priority=9]
          - validations[priority=23]
          - errors[ERR_VISIT_INVALID_STATE]
          - errors[ERR_CONSENT_NOT_GRANTED]
          - state_machines.HealthVisit.null_to_OPEN
        distinguishing_aspect: |
          Error-category pair = `state` (priority 9, ERR_VISIT_INVALID_STATE)
          versus `business_safety` (priority 23, ERR_CONSENT_NOT_GRANTED). One
          request violates both — the encounter is still OPEN rather than
          IN_ASSESSMENT AND the order's consent_status is CONSENT_PENDING — and
          the lower-numbered `state` row must win.
