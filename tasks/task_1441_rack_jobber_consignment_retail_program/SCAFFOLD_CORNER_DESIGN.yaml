  # ============================ CONSISTENCY MODEL ============================
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile, entities.ScanEvent.fields.unit_price_cents]
        distinguishing_aspect: "Immediate consistency: the scan ingest RESPONSE itself carries the fully matched valuation (no async lag, no re-read needed)."
        test_recipe:
          setup: ["ACTIVE agreement; directive 200"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "ImmCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ICStore", store_code: "IC1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "IC-001", name: "Imm Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
          trigger:
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 2, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "ic-1" }, as: RetailerManager, as_user_id: "${store}", captures: { st: "$.data.status", price: "$.data.unit_price_cents", line: "$.data.line_value_cents" } }
            - { call: "GET /inventory-balances", payload: { store_agreement_id: "${agr}", product_id: "${prod}" }, as: JobberAdmin }
          assert:
            - "the ingest response itself reports st == MATCHED, price == 200, line == 400"
            - "a read immediately after shows on_hand_units == -2 — side effects are visible in the same request epoch"

  # ============================ EXCLUDED (covered by §1.8) ============================
  - section: state_machines
    instances:
      - name: submit_counts_from_scheduled_state_covered
        claim_type: invalid_transition
        grounds: [state_machines.ServiceVisit.CHECKED_IN_to_COUNTS_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: submit_counts_state_beats_fiscal
          rationale: "The §1.8 instance asserts ERR_INVALID_STATE on submit-counts from SCHEDULED as the winning half of the priority pair."

      - name: payout_below_minimum_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=32]", "errors[ERR_PAYOUT_BELOW_MINIMUM]"]
        excluded_because:
          difficulty_instance: payout_minimum_exact_cents
          rationale: "The §1.8 instance exercises both sides of the 5000-cent payout boundary including the 4950 rejection."

      - name: directive_blocked_when_agreement_suspended_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: audit_certify_shrink_suspension_cascade
          rationale: "The cascade instance's second trigger asserts POST /price-directives on the freshly suspended agreement fails with ERR_AGREEMENT_NOT_ACTIVE."

      - name: finalize_blocked_by_open_audit_covered
        claim_type: precondition_enforcement
        grounds: ["validations[priority=28]", "errors[ERR_AUDIT_NOT_CERTIFIED]"]
        excluded_because:
          difficulty_instance: settlement_finalize_requires_certified_audits
          rationale: "Asserted verbatim as the failure path of the named §1.8 instance."
