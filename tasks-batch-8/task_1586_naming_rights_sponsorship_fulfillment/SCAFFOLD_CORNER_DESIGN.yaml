  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: renewal_mark_won_creates_renewal_contract
        claim_type: conditional_action
        grounds: [state_machines.RenewalOpportunity.PROPOSED_to_WON, entities.SponsorshipContract.fields.renewed_from_contract_id]
        distinguishing_aspect: "MARK_WON materializes the renewal contract: term slides to [2029,2031] (source length 3), base_fee_cents takes the countered 11,500,000, escalator terms are copied, and renewed_from_contract_id links back — reachable via the filtered contracts list."
        test_recipe:
          setup: ["Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2028 base 10,000,000 COMPOUND 0.03; opportunity O negotiated to a countered fee 11,500,000 (stage PROPOSED)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /renewal-opportunities", payload: { contract_id: "${c_id}", proposed_fee_cents: 12000000 }, as: SponsorshipSales, captures: { o_id: $.data.id } }
            - { call: "POST /renewal-opportunities/${o_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales }
            - { call: "POST /renewal-opportunities/${o_id}/transition", payload: { action: "OPEN_NEGOTIATION" }, as: SponsorshipSales, captures: { o_v: $.data.version } }
            - { call: "POST /renewal-opportunities/${o_id}/counter", payload: { proposed_fee_cents: 11500000, expected_opportunity_version: "${o_v}" }, as: SponsorshipSales }
          trigger:
            - { call: "POST /renewal-opportunities/${o_id}/transition", payload: { action: "MARK_WON" }, as: SponsorshipSales, captures: { o_stage: $.data.stage, rc_id: $.data.resulting_contract_id } }
            - { call: "GET /contracts/${rc_id}", as: SponsorshipSales, captures: { rc_first: $.data.term_first_season, rc_last: $.data.term_last_season, rc_base: $.data.base_fee_cents, rc_from: $.data.renewed_from_contract_id, rc_mode: $.data.escalator_mode, rc_status: $.data.contract_status } }
            - { call: "GET /contracts", payload: { renewed_from_contract_id: "${c_id}" }, as: SponsorshipSales, captures: { link_id: "$.data[0].id" } }
          assert:
            - "o_stage == WON and rc_id is set"
            - "rc_first == 2029 and rc_last == 2031 (source term slid forward by its 3-season length)"
            - "rc_base == 11500000 (countered fee), rc_mode == COMPOUND (copied), rc_status == DRAFT"
            - "rc_from == ${c_id} and the filtered list GET /contracts?renewed_from_contract_id resolves to ${rc_id}"

      - name: opportunity_terminal_stages_reject_further_actions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RenewalOpportunity, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "LOST is terminal: MARK_WON after MARK_LOST fails ERR_INVALID_STATE, and no renewal contract is materialized."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; ACTIVE contract C; opportunity O MARK_LOST from IDENTIFIED"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /renewal-opportunities", payload: { contract_id: "${c_id}", proposed_fee_cents: 12000000 }, as: SponsorshipSales, captures: { o_id: $.data.id } }
            - { call: "POST /renewal-opportunities/${o_id}/transition", payload: { action: "MARK_LOST" }, as: SponsorshipSales }
          trigger:
            - { call: "POST /renewal-opportunities/${o_id}/transition", payload: { action: "MARK_WON" }, as: SponsorshipSales, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with http 409"
            - "RenewalOpportunity.${o_id}.resulting_contract_id remains null"

      - name: report_issue_then_sponsor_acknowledge
        claim_type: action_endpoint
        grounds: [state_machines.ValuationReport]
        distinguishing_aspect: "The report hand-off splits roles: ActivationManager ISSUEs, only the owning SponsorContact can ACKNOWLEDGE, and a second ACKNOWLEDGE fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Venue V (2026->2027); ACTIVE sponsor S; ACTIVE contract C term 2026-2026; season 2026 closed; report R created (DRAFT)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /venues/${v_id}/advance-season", payload: {}, as: VenueAdmin }
            - { call: "POST /valuation-reports", payload: { contract_id: "${c_id}", season: 2026 }, as: ActivationManager, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /valuation-reports/${r_id}/transition", payload: { action: "ISSUE" }, as: ActivationManager, captures: { st1: $.data.report_status } }
            - { call: "POST /valuation-reports/${r_id}/transition", payload: { action: "ACKNOWLEDGE" }, as: SponsorContact, as_user_id: "${sp_id}", captures: { st2: $.data.report_status } }
            - { call: "POST /valuation-reports/${r_id}/transition", payload: { action: "ACKNOWLEDGE" }, as: SponsorContact, as_user_id: "${sp_id}", captures: { err: $.data.error_id } }
          assert:
            - "st1 == ISSUED and st2 == ACKNOWLEDGED (role-split hand-off)"
            - "second ACKNOWLEDGE -> err == ERR_INVALID_STATE (terminal)"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID fail ERR_UNAUTHENTICATED 401 before role or existence checks (priority 1 beats everything)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Trigger is sent with auth headers stripped: err == ERR_UNAUTHENTICATED with http 401"
            - "A 404-eligible unknown id on an authenticated route still loses to auth when headers are missing (priority 1 < 4)"

      - name: error_envelope_shape_on_rejection
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == 'error' and data carries error_id + message; success responses carry response_type object/array with data."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sponsors/00000000-0000-0000-0000-000000000000", as: VenueAdmin, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "err == ERR_NOT_FOUND and msg is a non-empty string"
            - "Envelope exposes meta.api_request_id + meta.api_request_timestamp and response_type == 'error'"

