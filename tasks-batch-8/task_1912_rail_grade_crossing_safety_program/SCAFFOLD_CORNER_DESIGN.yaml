            - "member DELETE allowed while SUPPLEMENT_REQUIRED (editable state)"
            - "second submit re-pins: riwh_pre_ssm == 75.00, riwh_post_ssm == 31.00  # mean(80*0.25 capped credit, 70*0.60)"
            - "second decide: APPROVED (31.00 <= NSRT 40.00)"

      - name: fra_reportability_threshold
        claim_type: boundary
        grounds: [calculations.fra_reportable, state_machines.IncidentReport.FINDINGS_ISSUED_to_FRA_SUBMITTED, "errors[ERR_FRA_NOT_REPORTABLE]"]
        distinguishing_aspect: "property_damage_cents == 1100000 is reportable (>=) and may go FRA_SUBMITTED; 1099999 is not, its FRA submit fails with ERR_FRA_NOT_REPORTABLE, and it closes directly from FINDINGS_ISSUED."
        test_recipe:
          setup: ["Locality; ACTIVE crossing; two incidents at the damage threshold boundary, both screened and desk-reviewed"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Report City", state_code: "KS", contact_email: "pw@rep.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-020081", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2026-03-01T10:00:00Z", severity: "PROPERTY_DAMAGE", property_damage_cents: 1100000 }
              as: RailSafetyOfficer
              captures: { i1: $.data.id, i1_fra: $.data.fra_reportable }
            - call: "POST /incident-reports/${i1}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${i1}/transition"
              payload: { to_status: "DESK_REVIEW" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${i1}/issue-findings"
              payload: { findings_summary: "threshold case", warning_devices_functioning: true }
              as: RailSafetyOfficer
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2026-04-01T10:00:00Z", severity: "PROPERTY_DAMAGE", property_damage_cents: 1099999 }
              as: RailSafetyOfficer
              captures: { i2: $.data.id, i2_fra: $.data.fra_reportable }
            - call: "POST /incident-reports/${i2}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${i2}/transition"
              payload: { to_status: "DESK_REVIEW" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${i2}/issue-findings"
              payload: { findings_summary: "sub-threshold case", warning_devices_functioning: true }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /incident-reports/${i1}/transition"
              payload: { to_status: "FRA_SUBMITTED" }
              as: RailSafetyOfficer
              captures: { i1_st: $.data.status, i1_sub: $.data.fra_submitted_at }
            - call: "POST /incident-reports/${i2}/transition"
              payload: { to_status: "FRA_SUBMITTED" }
              as: RailSafetyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /incident-reports/${i2}/transition"
              payload: { to_status: "CLOSED" }
              as: RailSafetyOfficer
              captures: { i2_st: $.data.status }
          assert:
            - "IncidentReport.${i1}.fra_reportable == true at damage == 1100000; FRA_SUBMITTED succeeds with fra_submitted_at set"
            - "IncidentReport.${i2}.fra_reportable == false at damage == 1099999; FRA_SUBMITTED rejected with ERR_FRA_NOT_REPORTABLE"
            - "IncidentReport.${i2} then closes directly FINDINGS_ISSUED -> CLOSED (non-reportable path)"

  - section: calculations
    instances:
      - name: incident_five_year_window_boundary
        claim_type: input_set_filtering
        grounds: [calculations.incident_count_5yr]
        distinguishing_aspect: "The trailing 5-year window includes occurred_at exactly at clock_now minus 5 years (inclusive lower bound) and excludes one second earlier; verified against the default logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Locality; ACTIVE crossing (exposure 5.00); incident A occurred 2021-08-01T00:00:00Z and incident B occurred 2021-07-31T23:59:59Z, both brought to FINDINGS_ISSUED via desk review"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Window City", state_code: "KS", contact_email: "pw@win.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-030001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2021-08-01T00:00:00Z", severity: "PROPERTY_DAMAGE", property_damage_cents: 500000 }
              as: RailSafetyOfficer
              captures: { ia: $.data.id }
            - call: "POST /incident-reports/${ia}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${ia}/transition"
              payload: { to_status: "DESK_REVIEW" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${ia}/issue-findings"
              payload: { findings_summary: "A at inclusive bound", warning_devices_functioning: true }
              as: RailSafetyOfficer
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2021-07-31T23:59:59Z", severity: "PROPERTY_DAMAGE", property_damage_cents: 500000 }
              as: RailSafetyOfficer
              captures: { ib: $.data.id }
            - call: "POST /incident-reports/${ib}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${ib}/transition"
              payload: { to_status: "DESK_REVIEW" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${ib}/issue-findings"
              payload: { findings_summary: "B one second outside", warning_devices_functioning: true }
              as: RailSafetyOfficer
          trigger:
            - call: "GET /crossings/${cx_id}"
              as: ProgramAdministrator
              captures: { cnt: $.data.incident_count_5yr, hz: $.data.hazard_score }
          assert:
            - "Crossing.${cx_id}.incident_count_5yr == 1 (A at the inclusive bound counts; B one second earlier does not)"
            - "Crossing.${cx_id}.hazard_score == 13.50  # (5.00*1.10 + 8) * 1.00 * 1.00"

      - name: uninvestigated_incidents_excluded_from_counts
        claim_type: input_set_filtering
        grounds: [calculations.incident_count_5yr]
        distinguishing_aspect: "A REPORTED (not yet investigated) incident does not enter incident_count_5yr; hazard stays at the zero-incident value."
        test_recipe:
          setup: ["Locality; ACTIVE crossing (hazard 5.50); one incident left in REPORTED"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Filter City", state_code: "KS", contact_email: "pw@filt.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-030011", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2026-05-01T10:00:00Z", severity: "NEAR_MISS" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
          trigger:
            - call: "GET /crossings/${cx_id}"
              as: ProgramAdministrator
              captures: { cnt: $.data.incident_count_5yr, hz: $.data.hazard_score }
          assert:
            - "Crossing.${cx_id}.incident_count_5yr == 0 (REPORTED status excluded)"
            - "Crossing.${cx_id}.hazard_score == 5.50 (unchanged)"

      - name: consolidation_incentive_computed
        claim_type: correct_result
        grounds: [calculations.closure_incentive_offer]
        distinguishing_aspect: "CONSOLIDATION incentive = 175000 + min(exposure, 50)*5000 = 225000 at exposure 10.00; the standing offer starts at the computed minimum."
        test_recipe:
          setup: ["Locality; consolidation target crossing (ACTIVE); subject crossing at exposure 10.00"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Incentive City", state_code: "KS", contact_email: "pw@inc.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-030021", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 730, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_subj: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-030022", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_tgt: $.data.id }
          trigger:
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_subj}", locality_id: "${loc_id}", closure_type: "CONSOLIDATION", consolidation_target_crossing_id: "${cx_tgt}" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag: $.data.id, inc: $.data.computed_incentive_cents, offer: $.data.current_offer_cents }
          assert:
            - "ClosureAgreement.${ag}.computed_incentive_cents == 225000  # 175000 + 10.00*5000"
            - "ClosureAgreement.${ag}.current_offer_cents == 225000 and negotiation_round == 0, status DRAFT"

      - name: exposure_projected_variant
        claim_type: variant_divergence
        grounds: [calculations.exposure_index]
        excluded_because:
          difficulty_instance: dual_variant_calc / crossing_exposure_snapshot_vs_projected
          rationale: "Snapshot 20.00 vs projected 25.60 divergence asserted there."

      - name: allocation_variant_selection
        claim_type: variant_selection
        grounds: [calculations.funding_allocation]
        excluded_because:
          difficulty_instance: dual_variant_calc / funding_allocation_waterfall_vs_proportional
          rationale: "Both variants exercised and divergent awards asserted there."

      - name: riwh_evaluation_order
        claim_type: correct_result
        grounds: [calculations.quiet_zone_risk]
        excluded_because:
          difficulty_instance: combinatorial_formula / quiet_zone_ssm_pinned_evaluation_order
          rationale: "Pinned pre/post evaluation order asserted with literals 42.00/32.00 there."

      - name: hazard_staleness_derived_recompute
        claim_type: reconciliation
        grounds: [entities.FundingProgram.fields.eligible_demand_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_findings_cascade_to_program_demand
          rationale: "eligible_demand_cents recompute (300000 -> 0) asserted as cascade link 3 there."

