            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
          trigger:
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-9", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T08:30:00Z", horsepower: 320, oil_pressure_psi: 19.9, coolant_temp_f: 195 }
