        excluded_because:
          difficulty_instance: transitive_cascade / reject_cascade_probation_suspends_certification_and_cancels_loan
          rationale: "The five-link propagation is asserted end-to-end by the named difficulty instance."

      - name: dual_variant_calculation_provisional_vs_final
        claim_type: dual_variant_calculation
        grounds: ["calculations.observation_quality_points"]
        excluded_because:
          difficulty_instance: dual_variant_calc / observation_provisional_vs_final_points_diverge
          rationale: "Both variants and their divergence are asserted by the named difficulty instance."

