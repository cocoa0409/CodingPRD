              as: HostOperations
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "CA-SOT-20551", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "CA" }
