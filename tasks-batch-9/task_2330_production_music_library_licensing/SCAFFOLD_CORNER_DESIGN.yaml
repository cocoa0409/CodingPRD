            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${t1}", media_type: "GAME", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${t1}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 36 }
              as: LicensingAgent
              captures: { sr1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${t1}", media_type: "FILM", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12 }
