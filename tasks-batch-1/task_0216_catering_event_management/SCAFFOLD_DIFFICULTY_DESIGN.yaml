scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_provisional_vs_final_diverge_on_guarantee_floor
        grounds:
          - calculations.order_grand_total
          - calculations.effective_headcount
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.DEPOSIT_HELD_to_INVOICED
        distinguishing_aspect: "Same Order priced two ways — provisional uses booked_headcount=80 (grand 587000), final uses effective_headcount=max(60,72)=72 (grand 528300); the two numbers differ because the guarantee-floor variant raises the billed headcount above the 60 the client guaranteed. Entity domain: Order cost accounting."
        test_recipe:
          setup:
            - "Package P1 base 5000c, min 1, lead 24h; Venue tax 875bps svc 2000bps; Client tax_exempt=false gratuity INCLUDED."
            - "Order booked 80, confirmed (provisional 587000), guaranteed 60 (floor 72)."
            - "Clock 2026-07-01; event_start 2026-09-01 (far out, non-rush)."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Grand Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version, prov: $.data.provisional_total_cents }
            - call: "POST /catering/orders/${ord_id}/guarantee"
              payload: { expected_order_version: "${ord_v2}", guaranteed_headcount: 60 }
              as: SalesCoordinator
              captures: { ord_v3: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/invoice"
              payload: { expected_order_version: "${ord_v3}" }
              as: SalesCoordinator
              captures: { final: $.data.final_total_cents }
          assert:
            - "Order.${ord_id}.provisional_total_cents == 587000"
            - "Order.${ord_id}.final_total_cents == 528300"
            - "Order.${ord_id}.final_total_cents != Order.${ord_id}.provisional_total_cents"

      - name: cancellation_refund_vs_forfeit_on_deposit_ledger
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.DepositLedgerEntry.fields.entry_type
          - entities.Order.fields.settlement_status
        distinguishing_aspect: "Same held deposit (146750) settled two ways depending on the cancellation window — at >=168h the deposit ledger nets to a full REFUND (settlement_status REFUNDED), at <72h it nets to a full FORFEIT (settlement_status FORFEITED); entity domain: DepositLedgerEntry conserved-money settlement, distinct from the Order-cost-accounting domain of the first instance."
        test_recipe:
          setup:
            - "Two confirmed orders O_full and O_forfeit on the same client/package/venue, each deposit 146750."
            - "O_full cancelled with clock 2026-06-01 vs event 2026-09-01 (>168h apart): full refund."
            - "O_forfeit cancelled with clock 2026-08-30 vs event 2026-09-01 (<72h apart): full forfeit."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Grand Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { o_full: $.data.id, o_full_v: $.data.version }
            - call: "POST /catering/orders/${o_full}/confirm"
              payload: { expected_order_version: "${o_full_v}" }
              as: SalesCoordinator
              captures: { o_full_v2: $.data.version }
          trigger:
            - call: "POST /catering/orders/${o_full}/cancel"
              payload: { expected_order_version: "${o_full_v2}" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { settle: $.data.settlement_status }
          assert:
            - "Order.${o_full}.settlement_status == REFUNDED"
            - "Order.${o_full}.lifecycle_status == CANCELLED"
            - "DepositLedgerEntry list for ${o_full} sums to 0 (HOLD +146750 then REFUND -146750), forfeit entry absent"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: grand_total_round_per_component_not_sum_then_round
        grounds:
          - calculations.order_grand_total
          - entities.Venue.fields.tax_rate_bps
          - entities.Venue.fields.service_fee_bps
          - entities.Client.fields.gratuity_policy
        distinguishing_aspect: "Mode (b) nested rounding where order matters: with subtotal 10002, rounding service_fee/tax/gratuity per-component (2000+875+1800) then summing yields grand 14677, whereas summing the three raw fractional components then rounding yields 14678 — the scaffold pins round-per-component, so 14677 is correct."
        test_recipe:
          setup:
            - "Package base 3334c, min 1, lead 24h; headcount 3 -> food subtotal 10002."
            - "Venue tax 875bps svc 2000bps; Client INCLUDED gratuity, not tax_exempt; clock far before event."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Tiny", per_head_cents: 3334, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 3, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Order.${ord_id}.provisional_total_cents == 14677"

      - name: grand_total_pinned_eval_order_subtotal_then_fees
        grounds:
          - calculations.order_grand_total
          - calculations.package_headcount_charge
          - entities.Order.fields.provisional_total_cents
        distinguishing_aspect: "Mode (c) circular-looking dependency with pinned evaluation order: gratuity_bps is selected by a tier keyed on subtotal, service_fee and tax also key on subtotal — the scaffold pins food->addon->subtotal->fees so the gratuity tier (subtotal 5008500 >= 5,000,000 -> 2200bps) is well-defined and grand == 7550314."
        test_recipe:
          setup:
            - "Package base 5000c with volume tier @100 -> 4500c; headcount 1102 -> food 5008500 (>= 5M gratuity tier)."
            - "Venue tax 875 svc 2000; Client INCLUDED gratuity."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Mega", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24, volume_tiers: [{ min_headcount: 100, per_head_cents: 4500 }] }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 1102, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Order.${ord_id}.provisional_total_cents == 7550314"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_request_proposed_countered_proposed_cycle
        grounds:
          - state_machines.ChangeRequest.PROPOSED_to_COUNTERED
          - state_machines.ChangeRequest.COUNTERED_to_PROPOSED
          - entities.ChangeRequest.fields.status
        distinguishing_aspect: "ChangeRequest is cyclic: PROPOSED -> COUNTERED (counter) -> PROPOSED (revise) loops; after one full loop the status returns to PROPOSED and counter_headcount is cleared to null, proving a true cycle on the ChangeRequest entity."
        test_recipe:
          setup:
            - "A confirmed order with an open PROPOSED change request requesting 90."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
            - call: "POST /catering/change-requests"
              payload: { order_id: "${ord_id}", requested_headcount: 90, requested_event_start: "2026-09-01T17:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /catering/change-requests/${cr_id}/counter"
              payload: { counter_headcount: 85 }
              as: SalesCoordinator
          trigger:
            - call: "POST /catering/change-requests/${cr_id}/revise"
              payload: { requested_headcount: 95 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { st: $.data.status }
          assert:
            - "ChangeRequest.${cr_id}.status == PROPOSED"
            - "ChangeRequest.${cr_id}.requested_headcount == 95"
            - "ChangeRequest.${cr_id}.counter_headcount == null"

      - name: order_parallel_lifecycle_and_settlement_dimensions
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.DEPOSIT_HELD_to_INVOICED
          - entities.Order.fields.lifecycle_status
          - entities.Order.fields.settlement_status
        distinguishing_aspect: "Order carries two independent state axes on one row: confirming advances lifecycle DRAFT->CONFIRMED AND settlement UNBILLED->DEPOSIT_HELD, while invoicing later advances ONLY settlement DEPOSIT_HELD->INVOICED leaving lifecycle at GUARANTEED — the two dimensions hold distinct values together on the same Order, distinct from the cyclic ChangeRequest entity."
        test_recipe:
          setup:
            - "An order confirmed then guaranteed, then invoiced."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
            - call: "POST /catering/orders/${ord_id}/guarantee"
              payload: { expected_order_version: "${ord_v2}", guaranteed_headcount: 80 }
              as: SalesCoordinator
              captures: { ord_v3: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/invoice"
              payload: { expected_order_version: "${ord_v3}" }
              as: SalesCoordinator
              captures: { life: $.data.lifecycle_status, settle: $.data.settlement_status }
          assert:
            - "Order.${ord_id}.lifecycle_status == GUARANTEED"
            - "Order.${ord_id}.settlement_status == INVOICED"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_order_cascades_to_legs_then_route_posture
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - state_machines.DeliveryLeg.PLANNED_to_FAILED
          - calculations.route_posture
          - entities.ServiceRoute.fields.posture
        distinguishing_aspect: "Depth-3 cascade from order cancellation: cancel mutates Order(CANCELLED) -> that cancellation mutates each PLANNED DeliveryLeg to FAILED -> each leg's FAILED state mutates its ServiceRoute.posture to BLOCKED; each hop is caused by the prior hop, not directly by the cancel call."
        test_recipe:
          setup:
            - "Confirmed order with a route and one PLANNED delivery leg on it; route posture OPEN."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/routes"
              payload: { route_date: "2026-09-01T00:00:00Z", vehicle_capacity_legs: 3 }
              as: CateringAdmin
              captures: { route_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
            - call: "POST /catering/delivery-legs"
              payload: { order_id: "${ord_id}", route_id: "${route_id}", window_start: "2026-09-01T15:00:00Z", window_end: "2026-09-01T16:00:00Z" }
              as: SalesCoordinator
              captures: { leg_id: $.data.id }
          trigger:
            - call: "POST /catering/orders/${ord_id}/cancel"
              payload: { expected_order_version: "${ord_v2}" }
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "Order.${ord_id}.lifecycle_status == CANCELLED"
            - "DeliveryLeg.${leg_id}.stop_status == FAILED"
            - "ServiceRoute.${route_id}.posture == BLOCKED"

      - name: confirm_order_cascades_deposit_ledger_and_staffing_reservation
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - calculations.deposit_amount
          - entities.DepositLedgerEntry.fields.entry_type
          - entities.StaffingReservation.fields.reserved_staff
        distinguishing_aspect: "Depth-2 cascade from a different trigger (confirm, not cancel): confirm mutates Order(CONFIRMED + provisional_total_cents) -> that provisional total drives the deposit calculation which appends a DEPOSIT_HOLD DepositLedgerEntry; and the STAFFING add-on lines drive creation of a StaffingReservation HELD with reserved_staff debited from the pool — a distinct propagation pattern from the cancellation cascade."
        test_recipe:
          setup:
            - "Draft order with one STAFFING add-on (quantity 3); staff pool capacity 10."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/_staff-pool/set_capacity"
              payload: { total_staff: 10 }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/add-ons"
              payload: { kind: "STAFFING", unit_cents: 8000, quantity: 3 }
              as: Client
              as_user_id: "${cli_id}"
          trigger:
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { dep: $.data.deposit_due_cents }
          assert:
            - "Order.${ord_id}.settlement_status == DEPOSIT_HELD"
            - "DepositLedgerEntry list for ${ord_id} has exactly one DEPOSIT_HOLD entry with amount_cents == Order.deposit_due_cents"
            - "StaffingReservation for ${ord_id} has status HELD and reserved_staff == 3"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: package_retired_outranks_lead_time_on_confirm
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_PACKAGE_RETIRED]
          - errors[ERR_LEAD_TIME_VIOLATED]
        distinguishing_aspect: "Pair business_referential (P7 ERR_PACKAGE_RETIRED) vs business_temporal (P8 ERR_LEAD_TIME_VIOLATED): a confirm where the package is RETIRED AND the event is inside lead time returns ERR_PACKAGE_RETIRED because P7 < P8."
        test_recipe:
          setup:
            - "Package retired; order's event_start only 1h out vs a 24h lead_time (both checks fail)."
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id, pkg_v: $.data.version }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
