scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: reviewer_accuracy_audit_only_vs_blended_diverge
        grounds:
          - calculations.reviewer_accuracy_score
          - entities.Reviewer.fields.accuracy_score_audit_only
          - entities.Reviewer.fields.accuracy_score_blended
          - state_machines.Appeal.INDEPENDENT_REVIEW_to_OVERTURNED
          - state_machines.Reviewer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Over one identical dataset (one AUDITED AGREE sample plus one OVERTURNED appeal on the
          same reviewer) the audit_only variant scores 1.0000 while the blended_final variant
          scores 0.5000, and the gate consumes the blended value because appeals >= 1, which is
          what drives the reviewer to SUSPENDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "STANDARD account acct_alpha with 3 appeal credits, one TEXT content item of graphic_weight 2."
            - "ACTIVE policy version v1 of T2/VIOLENCE category VIOLENT_THREAT (auto 0.9000, floor 0.4000, REMOVE, 72h window, 240 min SLA)."
            - "FRONTLINE reviewer Rita certified on v1 has decided the classifier case REMOVE (4 strike points)."
            - "QA reviewer Quinn has sampled that case and audited it AGREE, so Rita's audited_count is 1 and agree_count is 1."
            - "SENIOR reviewer Sven, certified on v1, holds the account's appeal in INDEPENDENT_REVIEW."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_alpha", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE", appeal_window_hours: 72, review_sla_minutes: 240 }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { q_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci1_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ci1_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig1_id: $.data.id, case1_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${case1_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { c1_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${case1_id}/assign"
              payload: { expected_case_version: "${c1_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/moderation-cases/${case1_id}/decide"
              payload: { outcome: "REMOVE", rationale: "Credible threat" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Quinn", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "QA" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { qa_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Sven", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "SENIOR" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
            - call: "POST /moderation/reviewers/${r2_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r2_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/audit-samples"
              payload: { case_id: "${case1_id}", sampling_reason: "RANDOM" }
              as: QAAuditor
              as_user_id: "${qa_id}"
              captures: { as1_id: $.data.id }
            - call: "POST /moderation/audit-samples/${as1_id}/audit"
              payload: { verdict: "AGREE" }
              as: QAAuditor
              as_user_id: "${qa_id}"
            - call: "POST /moderation/appeals"
              payload: { case_id: "${case1_id}", grounds_text: "The post was a song lyric" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /moderation/appeals/${ap1_id}/assign-reviewer"
              payload: { target_reviewer_id: "${r2_id}" }
              as: QAAuditor
              as_user_id: "${qa_id}"
          trigger:
            - call: "POST /moderation/appeals/${ap1_id}/resolve"
              payload: { resolution: "OVERTURNED", resolution_note: "Satire, not a threat" }
              as: Reviewer
              as_user_id: "${r2_id}"
          assert:
            - "Reviewer.${r1_id}.accuracy_score_audit_only == 1.0000"
            - "Reviewer.${r1_id}.accuracy_score_blended == 0.5000"
            - "Reviewer.${r1_id}.audited_count == 1 and Reviewer.${r1_id}.agree_count == 1"
            - "Reviewer.${r1_id}.appealed_count == 1 and Reviewer.${r1_id}.upheld_appeal_count == 0"
            - "Reviewer.${r1_id}.status == SUSPENDED because gate_score is the blended 0.5000 (< SUSPEND_FLOOR 0.6000) with audited_count + appealed_count == 2 == MIN_GATE_SAMPLE"
            - "ModerationCase.${case1_id}.is_overturned == true"
            - "Account.${acct_id}.strike_points == 0 and Account.${acct_id}.standing == GOOD_STANDING"
            - "Account.${acct_id}.appeal_credits_remaining == 3"
      - name: transparency_provisional_vs_restated_volume_diverge
        grounds:
          - calculations.transparency_enforcement_volumes
          - entities.TransparencyReport.fields.enforcement_volume
          - entities.TransparencyReport.fields.overturn_adjusted_volume
          - state_machines.TransparencyReport.COMPUTED_to_COMPUTED
        distinguishing_aspect: |
          Recomputing one report over the same two decided cases yields enforcement_volume 2 and
          removal_volume 1 under PROVISIONAL but enforcement_volume 1 and removal_volume 0 under
          RESTATED, because RESTATED drops the overturned REMOVE while overturn_adjusted_volume
          stays 1 under both variants.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z throughout, so both decisions carry decided_at 2026-08-01T09:00:00Z."
            - "One STANDARD account with two TEXT content items; T2/VIOLENCE category with ACTIVE v1 (auto 0.9000, floor 0.4000, 240 min SLA, 72h appeal window)."
            - "Reviewer Rita decided case 1 REMOVE (4 points) and case 2 WARN (ceil(4 * 0.25 * 1.25) = 2 points, so the account sits at exactly 6 points)."
            - "The appeal on case 1 has been OVERTURNED by independent SENIOR reviewer Sven, so case 1 carries is_overturned true."
            - "A DRAFT report covers the closed period 2026-08-01T00:00:00Z .. 2026-08-01T23:59:59Z."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_beta", region_code: "US", tier: "STANDARD" }
