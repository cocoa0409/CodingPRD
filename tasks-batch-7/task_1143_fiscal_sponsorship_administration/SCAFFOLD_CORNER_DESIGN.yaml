          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"

      - name: sod_compliance_approver_cannot_pay
        claim_type: segregation_of_duties
        grounds: ["validations[priority=9]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Same human, two hats: the payer's X-User-ID equals compliance_approved_by_user_id -> ERR_SOD_VIOLATION (403), even though FinanceOfficer is the correct role."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE, funded; disbursement APPROVED_FOR_PAYMENT with compliance_approved_by_user_id == user_fo_1 (the officer legitimately wore the compliance hat earlier)"]
