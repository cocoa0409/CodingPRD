              payload: { legal_name: "Tenant C", contact_email: "c@tenant.example", tax_id: "T-C" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "Suite 200 TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS-1" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/plan-submissions/${sub_id}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub_id}/approve"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-pre-construction"
              as: LandlordPM
            - call: "POST /api/contractors"
              payload: { company_name: "BuildCo", license_number: "LIC-2", insurance_expiry_date: "2027-01-01T00:00:00Z" }
              as: LandlordPM
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contractors/${ctr_id}/qualify"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/contractor-engagements"
              payload: { contractor_id: "${ctr_id}", scope_note: "GC" }
              as: LandlordPM
              captures: { eng_id: $.data.id }
            - call: "POST /api/contractor-engagements/${eng_id}/acknowledge-rules"
              as: ContractorRep
