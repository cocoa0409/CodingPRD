scaffold_corner_design:

  # ============================================================================
  # SECTION: entities
  # ============================================================================
  - section: entities
    instances:
      - name: create_purchase_agreement_required_fields_present
        claim_type: Creation
        grounds:
          - 'endpoints."POST /purchase-agreements"'
        distinguishing_aspect: |
          POST /purchase-agreements with all seven required fields returns 201 and a body
          containing id, version=1, status=DRAFT, and every input field echoed.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one EscrowOfficer user exists."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "Buyer One", seller_name: "Seller One", property_address: "1 Main St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id", agr_status: "$.data.status", agr_v: "$.data.version" }
          assert:
            - "trigger[0].response.status_code == 201"
            - "PurchaseAgreement.${agr_id}.status == DRAFT"
            - "PurchaseAgreement.${agr_id}.version == 1"

      - name: get_purchase_agreement_not_found
        claim_type: Not Found
        grounds:
          - 'endpoints."GET /purchase-agreements/{id}"'
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: |
          GET /purchase-agreements/{random-uuid} where the id does not exist returns
          404 with error_id=ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; no PurchaseAgreement rows."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
          trigger:
            - call: "GET /purchase-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "trigger[0].response.status_code == 404"
            - "trigger[0].response.data.error_id == ERR_NOT_FOUND"

      - name: list_purchase_agreements_pagination_defaults
        claim_type: Listing
        grounds:
          - 'endpoints."GET /purchase-agreements"'
        distinguishing_aspect: |
          GET /purchase-agreements with no query parameters returns paginated response
          with limit=10, offset=0 defaults, total_count and has_more populated.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one PurchaseAgreement exists in DRAFT."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 Pag St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
          trigger:
            - call: "GET /purchase-agreements"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "trigger[0].response.data.total_count == 1"
            - "trigger[0].response.data.has_more == false"

      - name: create_agreement_missing_purchase_price_invalid_request
        claim_type: Required Fields
        grounds:
          - 'endpoints."POST /purchase-agreements"'
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          Omitting purchase_price_cents from POST /purchase-agreements returns
          422 with error_id=ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one EscrowOfficer exists."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
          trigger:
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 NF St", earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "trigger[0].response.status_code == 422"
            - "trigger[0].response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_agreement_purchase_price_below_floor_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_PRICE_OUT_OF_RANGE]"
        distinguishing_aspect: |
          purchase_price_cents=99999 (one below 100000 floor) returns 422 with
          error_id=ERR_PRICE_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one EscrowOfficer exists."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
          trigger:
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 Lo St", purchase_price_cents: 99999, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "trigger[0].response.status_code == 422"
            - "trigger[0].response.data.error_id == ERR_PRICE_OUT_OF_RANGE"

      - name: ccr_review_is_immutable
        claim_type: Immutability
        grounds:
          - "entities.CCRReview"
        distinguishing_aspect: |
          CCRReview has common_fields=false (no version, no updated_at). Scaffold declares
          no UPDATE/DELETE endpoints; only POST /ccr-reviews (create), GET /ccr-reviews
          (list), GET /ccr-reviews/{id} (read).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one CCRReview exists."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 Imm St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
            - call: "POST /ccr-reviews"
              payload: { agreement_id: "${agr_id}", hoa_name: "HOA", restrictions_summary: "ok", buyer_acknowledged: true }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ccr_id: "$.data.id" }
          trigger:
            - call: "GET /ccr-reviews/${ccr_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ccr_fields: "$.data" }
          assert:
            - "trigger[0].response.status_code == 200"
            - "trigger[0].response.data.buyer_acknowledged == true"

      - name: computed_field_earnest_money_received_cents_updates_on_confirm
        claim_type: Computed Fields
        grounds:
          - "entities.PurchaseAgreement.fields.earnest_money_received_cents"
          - "state_machines.EarnestMoneyDeposit.PENDING_to_CONFIRMED"
        distinguishing_aspect: |
          PurchaseAgreement.earnest_money_received_cents is computed as sum of CONFIRMED
          EarnestMoneyDeposit.amount_cents for this agreement, updated atomically as part
          of the confirm transition's side effects.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; agreement A in ACTIVE; two PENDING deposits (500000 and 300000)."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 CF St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 500000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd1_id: "$.data.id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 300000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd2_id: "$.data.id" }
          trigger:
            - call: "POST /earnest-money-deposits/${emd1_id}/confirm"
              payload: { confirmation_reference: "CF-1" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /purchase-agreements/${agr_id}"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_emr_partial: "$.data.earnest_money_received_cents" }
          assert:
            - "PurchaseAgreement.${agr_id}.earnest_money_received_cents == 500000"

      - name: system_fields_id_and_created_at_are_generated
        claim_type: System Fields
        grounds:
          - "entities.PurchaseAgreement.fields.id"
          - "entities.PurchaseAgreement.fields.created_at"
        distinguishing_aspect: |
          Even when the request body contains a stray 'id' or 'created_at' value, the
          server-minted values are used; the client-supplied values are ignored. Response
          carries the server-minted id (a UUID without prefix per scaffold rule).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
          trigger:
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 SF St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id", agr_created_at: "$.data.created_at" }
          assert:
            - "trigger[0].response.data.id != null"
            - "trigger[0].response.data.created_at != null"
            - "trigger[0].response.data.version == 1"

  # ============================================================================
  # SECTION: state_machines
  # ============================================================================
  - section: state_machines
    instances:
      - name: agreement_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - "state_machines.PurchaseAgreement.initial_state"
        distinguishing_aspect: |
          A freshly-created PurchaseAgreement has status=DRAFT (the initial_state).
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
          trigger:
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 IS St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id", agr_status: "$.data.status" }
          assert:
            - "PurchaseAgreement.${agr_id}.status == DRAFT"

      - name: agreement_close_from_draft_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.PurchaseAgreement"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          POST /purchase-agreements/{id}/close on a DRAFT agreement is rejected with
          ERR_INVALID_STATE (409). DRAFT is not in the from-set for the close transition.
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; one DRAFT agreement."]
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 IT St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
          trigger:
            - call: "POST /purchase-agreements/${agr_id}/close"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "trigger[0].response.status_code == 409"
            - "trigger[0].response.data.error_id == ERR_INVALID_STATE"

      - name: title_search_resolved_is_terminal_re_resolve_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.TitleSearch.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          POST /title-searches/{id}/resolve a second time on a TitleSearch already in
          RESOLVED returns ERR_INVALID_STATE.
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; one TitleSearch in RESOLVED."]
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "TA", role: "TitleAgent" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ta_id: "$.data.id" }
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 TR St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /title-searches"
              payload: { agreement_id: "${agr_id}" }
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { ts_id: "$.data.id" }
            - call: "POST /title-searches/${ts_id}/complete"
              payload: { defects: [] }
              as: TitleAgent
              as_user_id: "${ta_id}"
            - call: "POST /title-searches/${ts_id}/resolve"
              payload: {}
              as: TitleAgent
              as_user_id: "${ta_id}"
          trigger:
            - call: "POST /title-searches/${ts_id}/resolve"
              payload: {}
              as: TitleAgent
              as_user_id: "${ta_id}"
          assert:
            - "trigger[0].response.status_code == 409"
            - "trigger[0].response.data.error_id == ERR_INVALID_STATE"

      - name: emd_confirm_does_not_promote_when_threshold_not_met
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.PurchaseAgreement.ACTIVE_to_UNDER_CONTRACT"
        distinguishing_aspect: |
          When confirming an EarnestMoneyDeposit whose post-confirm sum is still strictly
          less than earnest_money_required_cents, the bubble-up side effect does NOT fire:
          PurchaseAgreement.status stays ACTIVE; EscrowAccount.status stays OPEN.
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; agreement requires 1000000 earnest; one PENDING deposit of 600000."]
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: "$.data.id" }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 SE St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 600000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd_id: "$.data.id" }
          trigger:
            - call: "POST /earnest-money-deposits/${emd_id}/confirm"
              payload: { confirmation_reference: "PARTIAL" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /purchase-agreements/${agr_id}"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_status: "$.data.status" }
            - call: "GET /escrow-accounts/${esc_id}"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_status: "$.data.status" }
          assert:
            - "PurchaseAgreement.${agr_id}.status == ACTIVE"
            - "EscrowAccount.${esc_id}.status == OPEN"

      - name: error_state_machine_branch_confirm_then_promote
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.PurchaseAgreement.ACTIVE_to_UNDER_CONTRACT"
        excluded_because:
          difficulty_instance: transitive_cascade / confirm_deposit_chain_emd_to_agreement_to_escrow_depth3
          rationale: "The cascade EMD confirm -> PurchaseAgreement UNDER_CONTRACT -> EscrowAccount FUNDED is fully exercised in the named §1.8 instance."

      - name: error_close_disbursement_waterfall_invariant
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.PurchaseAgreement.CLEARED_TO_CLOSE_to_CLOSED"
          - "calculations.disbursement_waterfall"
        excluded_because:
          difficulty_instance: compensating_invariant / close_balance_invariant_escrow_drain_equals_disbursements
          rationale: "Close + waterfall + escrow drain invariant verified in the named §1.8 instance."

  # ============================================================================
  # SECTION: calculations
  # ============================================================================
  - section: calculations
    instances:
      - name: title_premium_at_lower_tier_boundary_250k
        claim_type: Correct Result
        grounds:
          - "calculations.title_insurance_premium"
        distinguishing_aspect: |
          PurchaseAgreement at purchase_price_cents=25000000 ($250k) produces
          premium_cents=105000 via tier-1 (10000000 * 0.00450) + tier-2 slice
