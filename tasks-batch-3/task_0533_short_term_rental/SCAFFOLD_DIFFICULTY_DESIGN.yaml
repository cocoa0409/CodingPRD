# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Short-Term Rental City Registration & Lodging Tax — Expert
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tot_due_cost_accounting_on_tax_filing
        grounds:
          - calculations.tot_due
          - entities.TaxFiling.fields.tot_due_cents
          - state_machines.TaxFiling.DRAFT_to_FILED
        distinguishing_aspect: |
          tot_due is cost-accounting on a TaxFiling (a tiered lodging-tax owed amount);
          its dual counterpart host_strike_standing is risk-scoring on a Host — different entity domains.
        test_recipe:
          setup:
            - "A CityRegistrar has created a zone R1 (str_eligible, permit_cap 5), a host, a 3-bedroom property in R1, an ISSUED permit, and a DRAFT tax filing for period 2026-03 with nights_booked=10 and gross_revenue_cents=500000."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R1", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h1@x.com", full_name: "Host One" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "1 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /tax-filings"
              payload: { permit_id: "${permit_id}", period_year: 2026, period_month: 3, nights_booked: 10, gross_revenue_cents: 500000 }
              as: TaxOfficer
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /tax-filings/${filing_id}/file"
              payload: {}
              as: TaxOfficer
              captures: { tot: $.data.tot_due_cents }
          assert:
            - "TaxFiling.${filing_id}.status == FILED"
            - "TaxFiling.${filing_id}.tot_due_cents == 43000"

      - name: host_strike_standing_risk_scoring_on_host
        grounds:
          - calculations.host_strike_standing
          - entities.Host.fields.strike_total
          - entities.Host.fields.standing
          - state_machines.Complaint.OPEN_to_UPHELD
        distinguishing_aspect: |
          host_strike_standing aggregates UPHELD strike_points across ALL a host's permits and thresholds
          at 3 (a risk-scoring/standing decision on the Host entity) — a different subject and formula from tot_due's TaxFiling cost accounting.
        test_recipe:
          setup:
            - "A host with a single ISSUED permit; two UPHELD complaints already recorded on that permit: one UNPERMITTED (2 pts) making strike_total=2, host still GOOD."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R2", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h2@x.com", full_name: "Host Two" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "2 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /complaints"
              payload: { permit_id: "${permit_id}", category: "NOISE" }
              as: CityRegistrar
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c1_id}/uphold"
              payload: {}
              as: CityRegistrar
            - call: "GET /hosts/${host_id}"
              payload: {}
              as: CityRegistrar
              captures: { st: $.data.strike_total, standing: $.data.standing }
          assert:
            - "Host.${host_id}.strike_total == 1"
            - "Host.${host_id}.standing == GOOD"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tot_due_straddle_round_per_share_then_sum
        grounds:
          - calculations.tot_due
          - entities.TaxFiling.fields.tot_due_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: for a period straddling TOT_TIER_NIGHTS the base-share and surge-share
          are each rounded to whole cents BEFORE summation (round-per-share-then-sum), a pinned order that
          differs from sum-then-round.
        test_recipe:
          setup:
            - "An ISSUED permit with a DRAFT filing for 20 nights, gross_revenue_cents=600000 (straddles the 14-night tier)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R3", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h3@x.com", full_name: "Host Three" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "3 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /tax-filings"
              payload: { permit_id: "${permit_id}", period_year: 2026, period_month: 3, nights_booked: 20, gross_revenue_cents: 600000 }
              as: TaxOfficer
              captures: { filing_id: $.data.id }
          trigger:
            - call: "POST /tax-filings/${filing_id}/file"
              payload: {}
              as: TaxOfficer
              captures: { tot: $.data.tot_due_cents }
          assert:
            - "TaxFiling.${filing_id}.tot_due_cents == 61200"

      - name: tax_penalty_min_of_interest_and_cap_branch
        grounds:
          - calculations.tax_penalty
          - entities.TaxFiling.fields.penalty_cents
          - state_machines.TaxFiling.FILED_to_DELINQUENT
        distinguishing_aspect: |
          Mode (a) non-linear multi-input: penalty = min(PENALTY_FLAT_CENTS + round(unpaid*daily*days), cap(unpaid))
          with >=3 inputs (unpaid, days_late, constants) and a min() branch selecting cap when interest overflows.
        test_recipe:
          setup:
            - "A FILED filing tot_due_cents=43000, no remittance, due_at=2026-04-30; clock advanced to 2026-06-29 (60 days late) to force the cap branch."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R4", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h4@x.com", full_name: "Host Four" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "4 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /tax-filings"
              payload: { permit_id: "${permit_id}", period_year: 2026, period_month: 3, nights_booked: 10, gross_revenue_cents: 500000 }
              as: TaxOfficer
              captures: { filing_id: $.data.id }
            - call: "POST /tax-filings/${filing_id}/file"
              payload: {}
              as: TaxOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-29T00:00:00Z" }
              as: TaxOfficer
          trigger:
            - call: "GET /tax-filings/${filing_id}"
              payload: {}
              as: TaxOfficer
              captures: { pen: $.data.penalty_cents, st: $.data.status }
          assert:
            - "TaxFiling.${filing_id}.status == DELINQUENT"
            - "TaxFiling.${filing_id}.penalty_cents == 10750"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_cyclic_active_renew_self_loop
        grounds:
          - state_machines.Permit.ACTIVE_to_ACTIVE
          - entities.Permit.fields.expires_at
        distinguishing_aspect: |
          Permit has a cyclic self-loop ACTIVE->ACTIVE (renew) that re-anchors expires_at without changing state —
          a non-linear shape on the Permit entity, distinct from the TaxFiling machine's cycle.
        test_recipe:
          setup:
            - "An ACTIVE permit issued at default clock (expires_at 2027-05-01); clock advanced into the renewal window (2027-04-15)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R5", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h5@x.com", full_name: "Host Five" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "5 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /permits/${permit_id}/activate"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-15T00:00:00Z" }
              as: CityRegistrar
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /permits/${permit_id}/renew"
              payload: { expected_permit_version: "${pv}" }
              as: Host
              as_user_id: "${host_id}"
              captures: { new_exp: $.data.expires_at, st: $.data.status }
          assert:
            - "Permit.${permit_id}.status == ACTIVE"
            - "Permit.${permit_id}.expires_at == 2028-05-01T00:00:00.000Z"

      - name: tax_filing_cyclic_amend_loop
        grounds:
          - state_machines.TaxFiling.FILED_to_DRAFT
          - state_machines.TaxFiling.DRAFT_to_FILED
        distinguishing_aspect: |
          TaxFiling has a cyclic amend loop FILED->DRAFT->FILED that resets and recomputes tot_due_cents —
          a non-linear cycle on the TaxFiling entity, a different entity from Permit's renew self-loop.
        test_recipe:
          setup:
            - "A FILED filing (nights 10, gross 500000, tot_due 43000, no remittance)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R6", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h6@x.com", full_name: "Host Six" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "6 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /tax-filings"
              payload: { permit_id: "${permit_id}", period_year: 2026, period_month: 3, nights_booked: 10, gross_revenue_cents: 500000 }
              as: TaxOfficer
              captures: { filing_id: $.data.id }
            - call: "POST /tax-filings/${filing_id}/file"
              payload: {}
              as: TaxOfficer
          trigger:
            - call: "POST /tax-filings/${filing_id}/amend"
              payload: {}
              as: TaxOfficer
              captures: { st: $.data.status }
          assert:
            - "TaxFiling.${filing_id}.status == DRAFT"
            - "TaxFiling.${filing_id}.tot_due_cents == null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: uphold_revoke_frees_seat_and_bars_host_depth3
        grounds:
          - state_machines.Complaint.OPEN_to_UPHELD
          - state_machines.Permit.ACTIVE_to_REVOKED
          - entities.Zone.fields.active_permit_count
          - entities.Host.fields.standing
        distinguishing_aspect: |
          Depth-3 chain: uphold (Complaint) -> permit cumulative strike >=4 -> Permit REVOKED which decrements
          zone.active_permit_count -> Host.standing recomputed to BARRED (strike_total>=3). Each hop is caused by the previous.
        test_recipe:
          setup:
            - "An ACTIVE permit in zone R7 (permit_cap 5, active_permit_count 1). One UPHELD OVER_OCCUPANCY complaint (2 pts) already recorded so the permit is SUSPENDED and cumulative strike_points = 2. A fresh OPEN OVER_OCCUPANCY complaint (2 pts) is queued; upholding it pushes cumulative to 4 (REVOKE) and host strike_total to 4 (BARRED)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R7", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h7@x.com", full_name: "Host Seven" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "7 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /permits/${permit_id}/activate"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /complaints"
              payload: { permit_id: "${permit_id}", category: "OVER_OCCUPANCY" }
              as: CityRegistrar
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/uphold"
              payload: {}
              as: CityRegistrar
            - call: "POST /complaints"
              payload: { permit_id: "${permit_id}", category: "OVER_OCCUPANCY" }
              as: CityRegistrar
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c2_id}/uphold"
              payload: {}
              as: CityRegistrar
            - call: "GET /permits/${permit_id}"
              payload: {}
              as: CityRegistrar
              captures: { pstat: $.data.status }
            - call: "GET /zones/${zone_id}"
              payload: {}
              as: CityRegistrar
              captures: { apc: $.data.active_permit_count }
            - call: "GET /hosts/${host_id}"
              payload: {}
              as: CityRegistrar
              captures: { standing: $.data.standing }
          assert:
            - "Permit.${permit_id}.status == REVOKED"
            - "Zone.${zone_id}.active_permit_count == 0"
            - "Host.${host_id}.standing == BARRED"

      - name: lottery_draw_award_issues_and_counts_seat_depth2
        grounds:
          - state_machines.LotteryRound.OPEN_to_DRAWN
          - state_machines.Permit.LOTTERY_PENDING_to_ISSUED
          - entities.Zone.fields.active_permit_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: draw (LotteryRound) -> awarded Permit LOTTERY_PENDING->ISSUED ->
          zone.active_permit_count incremented. The seat increment is caused by the permit's award, not directly by the draw call.
        test_recipe:
          setup:
            - "Zone R8 permit_cap 1, lottery_enabled true. One permit already ISSUED (active_permit_count=1). A second permit routed to LOTTERY_PENDING because cap reached. A LotteryRound OPEN with seats_available 1."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R8", str_eligible: true, whole_home_allowed: true, permit_cap: 1, lottery_enabled: true }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h8a@x.com", full_name: "Host 8A" }
              as: CityRegistrar
              captures: { host_a: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h8b@x.com", full_name: "Host 8B" }
              as: CityRegistrar
              captures: { host_b: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_a}", zone_id: "${zone_id}", street_address: "8A Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_a: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_b}", zone_id: "${zone_id}", street_address: "8B Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_b: $.data.id }
            - call: "POST /hosts/${host_a}/attest-primary-residence"
              payload: { property_id: "${prop_a}" }
              as: Host
              as_user_id: "${host_a}"
            - call: "POST /hosts/${host_b}/attest-primary-residence"
              payload: { property_id: "${prop_b}" }
              as: Host
              as_user_id: "${host_b}"
            - call: "POST /permits"
              payload: { property_id: "${prop_a}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_a: $.data.id }
            - call: "POST /permits/${permit_a}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /permits"
              payload: { property_id: "${prop_b}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_b: $.data.id }
            - call: "POST /permits/${permit_b}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /lottery-rounds"
              payload: { zone_id: "${zone_id}", seats_available: 1 }
              as: CityRegistrar
              captures: { round_id: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /lottery-rounds/${round_id}/draw"
              payload: { expected_lottery_round_version: "${rv}" }
              as: CityRegistrar
            - call: "GET /permits/${permit_b}"
              payload: {}
              as: CityRegistrar
              captures: { pbstat: $.data.status }
            - call: "GET /zones/${zone_id}"
              payload: {}
              as: CityRegistrar
              captures: { apc: $.data.active_permit_count }
          assert:
            - "Permit.${permit_b}.status == ISSUED"
            - "Zone.${zone_id}.active_permit_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_issue
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          A permit already ISSUED with safety_attested=false-equivalent: re-issuing violates BOTH the state
          precondition (priority 4, category state, ERR_INVALID_STATE) and the safety check (priority 8, business_safety);
          the state error wins — pairing state vs business_safety.
        test_recipe:
          setup:
            - "A permit already ISSUED. A second issue attempt is made; because the permit is not DRAFT the state check fires before any business_safety re-check."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "R9", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "h9@x.com", full_name: "Host Nine" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "9 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
