          - calculations.credential_compliance_pct.constants.MIN_LEVEL_LEAD_TEACHER
          - endpoints[POST /staff-credentials/{credential_id}/registry-link]
          - entities.Provider.fields.credential_compliance_pct
        distinguishing_aspect: "Only rows that pass all four filters enter the numerator: verifying the UNLINKED LEAD_TEACHER at level 5 lifts compliance from 50.00 to exactly 75.00, proving the level-2 LEAD_TEACHER (below MIN_LEVEL_LEAD_TEACHER 3) and the SEPARATED DIRECTOR are both excluded from the numerator while active_staff_fte 4.00 remains the denominator."
        test_recipe:
          setup:
            - "Clock 2026-08-01. Provider with active_staff_fte 4.00 holding: VERIFIED DIRECTOR level 4 fte 1.00 expiring exactly 2026-08-01; VERIFIED LEAD_TEACHER level 2 fte 1.00; VERIFIED ASSISTANT level 1 fte 1.00; VERIFIED but SEPARATED DIRECTOR level 5 fte 1.00; UNLINKED LEAD_TEACHER level 5 fte 1.00."
