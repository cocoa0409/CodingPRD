            - "after the third trigger call ComponentPlacement.${pl_v2_id}.retrofit_quantity == 2, retrofit_handling_cents == 0 and retrofit_total_cents == 494000"
            - "ComponentPlacement.${pl_leg_id}.status == DRAFT and ComponentPlacement.${pl_v2_id}.status == DRAFT (a like-for-like part sale does not change placement status)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: design_project_revision_cycle_reenters_rendered
        grounds:
          - state_machines.DesignProject.COMMUNITY_REVIEW_to_REVISION_REQUESTED
          - state_machines.DesignProject.REVISION_REQUESTED_to_RENDERED
          - state_machines.DesignProject.RENDERED_to_COMMUNITY_REVIEW
          - state_machines.DesignRendering.ISSUED_to_WITHDRAWN
          - entities.DesignProject.fields.revision_rounds
          - entities.DesignRendering.fields.round_number
        distinguishing_aspect: |
          DesignProject.design_status is a true cycle: COMMUNITY_REVIEW -> REVISION_REQUESTED ->
          RENDERED -> COMMUNITY_REVIEW re-enters a state it already occupied, with
          revision_rounds incremented to 1, the round-1 rendering left in the terminal WITHDRAWN
          state, and a fresh rendering carrying round_number 2 - the loop is bounded by nothing
          but the review outcome, so the second pass through RENDERED is observationally distinct
          from the first only via revision_rounds and round_number.
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 is ACTIVE; DECK-TDL-122 is CERTIFIED."
            - "DesignProject 'Fernwood Commons' in CONSULTATION (soil CLAY, required_age_groups [TODDLER_6_23M]) with one toddler ENGINEERED_WOOD_FIBER area 0..2000 depth 30 holding one DRAFT deck placement at x=700."
            - "Round-1 DesignRendering ISSUED, pinned to the ACTIVE standard; project.design_status == RENDERED and revision_rounds == 0."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
