      - name: determination_objection_cycle_returns_to_draft_and_reanalyzes
        grounds:
          - state_machines.EligibilityDetermination.PARENT_REVIEW_to_DRAFT
          - state_machines.EligibilityDetermination.DRAFT_to_PARENT_REVIEW
          - state_machines.EligibilityDetermination.PARENT_REVIEW_to_PARENT_AGREED
          - state_machines.EligibilityDetermination.PARENT_AGREED_to_FINALIZED
          - entities.EligibilityDetermination.fields.objection_round_count
          - entities.EligibilityDetermination.fields.analyzed_by_user_id
        distinguishing_aspect: |
          A CYCLE on EligibilityDetermination - a different entity from the
          CompensatoryAward instance: PARENT_REVIEW -> DRAFT -> PARENT_REVIEW runs
          twice through the same analyze endpoint, objection_round_count rises to 1,
          analyzed_by_user_id is cleared on the way back to DRAFT and re-stamped by
          the second analyze, and the recommendation flips INELIGIBLE -> ELIGIBLE
          because the second pass carries amended probes.
        test_recipe:
          setup:
            - "Student S1 exists with a DRAFT PROBE_BASED determination whose probes are READING_FLUENCY 80 -> 60 / 20 recoupment days / 4 trials and EXPRESSIVE_LANGUAGE 80 -> 60 / 19 recoupment days / 4 trials."
            - "The determination has been analysed once by user cm-001 and sits in PARENT_REVIEW with eligibility_recommendation INELIGIBLE and criteria_met_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "EXPRESSIVE_LANGUAGE", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 19, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "OBJECT", parent_comment: "Summer probe for expressive language was cut short." }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: { skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "EXPRESSIVE_LANGUAGE", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-002"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
          assert:
            - "After the first analyze: EligibilityDetermination.${d1_id}.criteria_met_count == 1 and eligibility_recommendation == INELIGIBLE and max_recoupment_days == 20"
            - "After the OBJECT response: EligibilityDetermination.${d1_id}.status == DRAFT and objection_round_count == 1 and analyzed_by_user_id == null"
            - "After the second analyze: EligibilityDetermination.${d1_id}.status == PARENT_REVIEW and criteria_met_count == 2 and eligibility_recommendation == ELIGIBLE and analyzed_by_user_id == cm-002"
            - "After the second analyze: EligibilityDetermination.${d1_id}.max_regression_pct == 25.0 and max_recoupment_days == 20"
            - "After the AGREE response: EligibilityDetermination.${d1_id}.status == PARENT_AGREED and objection_round_count is still 1"
            - "After finalize: EligibilityDetermination.${d1_id}.status == FINALIZED and finalized_by_user_id == dir-001"
            - "After finalize: Student.${s1_id}.esy_eligibility_status == ELIGIBLE"

