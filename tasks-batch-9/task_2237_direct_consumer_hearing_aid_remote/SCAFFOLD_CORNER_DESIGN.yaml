        claim_type: priority_conflict
        grounds: [validations.priority_16, validations.priority_17]
        distinguishing_aspect: "A POST /state-policies that both re-uses the unique state_code CA and carries restocking_fee_mode \"BOGUS_MODE\" must answer 422 ERR_INVALID_ENUM_VALUE (priority 16), not 409 ERR_DUPLICATE_KEY (priority 17)."
        test_recipe:
          setup:
            - "One CA policy already exists."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
          trigger:
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "BOGUS_MODE", restocking_fee_pct: 0.1 }, as: PlatformAdmin }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_INVALID_ENUM_VALUE\""
            - "the same body with restocking_fee_mode FLAT_PCT returns 409 ERR_DUPLICATE_KEY"
            - "GET /state-policies?state_code=CA returns total_count == 1"

      - name: validation_cascading_reference_existence_runs_before_retired_check
        claim_type: cascading_validation
        grounds: [validations.priority_11, validations.priority_12]
        distinguishing_aspect: "Assigning a soft-deleted (is_retired) policy to a new patient must fail with 409 ERR_STATE_POLICY_RETIRED, while an unknown policy id on the same field fails earlier with 404 ERR_REFERENCE_NOT_FOUND -- existence is resolved before the retired predicate can be evaluated."
        test_recipe:
          setup:
            - "A CA policy is created and then soft-deleted via DELETE /state-policies/{id}, setting is_retired true."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_dead: "$.data.id" } }
            - { call: "DELETE /state-policies/${pol_dead}", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /patients", payload: { state_policy_id: "${pol_dead}", email: "retired@x.test", full_name: "Ret One", age_years: 70 }, as: CareOpsAgent }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_STATE_POLICY_RETIRED\""
            - "the same call with state_policy_id 00000000-0000-4000-8000-000000000000 returns 404 ERR_REFERENCE_NOT_FOUND"
            - "GET /state-policies?is_retired=true returns total_count == 1 while GET /state-policies (default) excludes the retired row"

      - name: validation_segregation_of_duties_answers_before_fiscal_eligibility
        claim_type: priority_conflict
        grounds: [validations.priority_8, validations.priority_60]
        distinguishing_aspect: "When the same specialist user both submitted and approves a claim whose claimed amount also exceeds the eligible ceiling, the answer must be 403 ERR_SEGREGATION_OF_DUTIES (priority 8) rather than the deliberately-last fiscal 422 ERR_CLAIM_AMOUNT_EXCEEDS_ELIGIBLE (priority 60)."
        test_recipe:
          setup:
            - "A REPAIR_ORDER claim for 90000 (eligible 50000) is submitted by user spec-1 and moved to UNDER_REVIEW."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
