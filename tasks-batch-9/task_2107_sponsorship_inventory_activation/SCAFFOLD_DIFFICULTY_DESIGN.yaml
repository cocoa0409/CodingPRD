  - rule_id: resource_temporal_overlap
    instances:
      - name: asset_half_open_window_with_changeover_buffer_boundary
        grounds:
          - validations[priority=15]
          - errors[ERR_BOOKING_WINDOW_CONFLICT]
          - entities.InventoryAsset.fields.changeover_buffer_minutes
          - entities.AssetBooking.fields.window_start
        distinguishing_aspect: |
          InventoryAsset geometry: windows are half-open [start, end) and non-intersecting bookings of
          DIFFERENT contracts must be separated by changeover_buffer_minutes, so a start at 21:15 after
          a 21:00 end is rejected while a start at exactly 21:30 (gap == buffer) is accepted — an
          adjacency-with-buffer rule, not an occupancy rule.
        test_recipe:
          setup:
            - "Property IN_SEASON with asset 'North LED Ribbon', capacity_units 6, changeover_buffer_minutes 30"
