        grounds: ["validations[priority=8]", "errors[ERR_RECORD_NOT_IN_SCOPE]", "errors[ERR_RECORD_ALREADY_RELEASED]"]
        distinguishing_aspect: "release-records enforces scope (a TripRequest id is not a handover record -> ERR_RECORD_NOT_IN_SCOPE 422) and single-release (re-releasing the same filing -> ERR_RECORD_ALREADY_RELEASED 409)."
        test_recipe:
          setup: ["Agreement ACTIVE then TERMINATION_PENDING via notice; aircraft has one ACCEPTED INSURANCE_COI filing and one CANCELLED trip"]
          setup_api_calls:
