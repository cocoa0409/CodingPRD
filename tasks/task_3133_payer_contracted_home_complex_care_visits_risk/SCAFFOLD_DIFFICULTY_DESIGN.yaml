  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_activate_gated_by_care_team_active
        grounds:
          - state_machines.MemberEnrollment.transitions.CONSENTED_to_ACTIVE
          - state_machines.CareTeam
          - errors.ERR_CARE_TEAM_NOT_ACTIVE
        distinguishing_aspect: |
          Pair (MemberEnrollment, CareTeam). An enrollment cannot transition
          CONSENTED → ACTIVE while its CareTeam is still DRAFT (or SUSPENDED).
          The error is ERR_CARE_TEAM_NOT_ACTIVE. After the CareTeam is
          activated (a separate actor's action), the SAME activation call
          succeeds — proving the gate is on the cross-entity state, not on
          the enrollment's own history.
        test_recipe:
          setup:
            - "Standard setup; enrollment E in CONSENTED, CareTeam CT in DRAFT."
          setup_api_calls:
            - call: "POST /care-programs"
              payload: { program_code: "LMRK-TX", display_name: "Landmark TX", service_geography_zips: ["75201"], urgent_response_sla_hours: 24 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { care_program_id: "${prog_id}", payer_name: "PlanA", contract_effective_date: "2026-01-01T00:00:00Z", contract_expiration_date: "2027-12-31T23:59:59Z", payment_model: "CAPITATED", pmpm_rate_cents: 500000, quality_withhold_pct: 0.10, min_performance_threshold: 0.80 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
          trigger:
            # Try to activate while CT is DRAFT — must fail
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
              captures: { error_id_first: $.data.error_id }
            # Activate CT, then retry — must succeed
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
              captures: { final_status: $.data.status }
          assert:
            - "first activate attempt returns 409 and error_id_first == ERR_CARE_TEAM_NOT_ACTIVE"
            - "MemberEnrollment.${enr_id}.status remains CONSENTED after the failed activate"
            - "after CareTeam activation, the retry returns status == ACTIVE"
            - "the cross-entity gate is on CareTeam.status, not on the enrollment's own field set"

      - name: visit_creation_gated_by_enrollment_active_and_care_team_active
        grounds:
          - state_machines.Visit
          - state_machines.MemberEnrollment
          - state_machines.CareTeam
          - errors.ERR_ENROLLMENT_NOT_ACTIVE
          - errors.ERR_CARE_TEAM_NOT_ACTIVE
        distinguishing_aspect: |
          Pair (Visit, MemberEnrollment) and (Visit, CareTeam) — both gates
          must hold simultaneously. A Visit POST against an enrollment in
          CONSENTED (CareTeam ACTIVE) returns ERR_ENROLLMENT_NOT_ACTIVE. A
          Visit POST against an ACTIVE enrollment whose CareTeam has been
          SUSPENDED returns ERR_CARE_TEAM_NOT_ACTIVE. Two distinct error
          codes, two distinct cross-entity state gates on the same target
          endpoint.
        test_recipe:
          setup:
            - "Two enrollments E1 (CONSENTED, CT ACTIVE) and E2 (ACTIVE, CT SUSPENDED) for two distinct members."
          setup_api_calls:
            - call: "POST /care-programs"
