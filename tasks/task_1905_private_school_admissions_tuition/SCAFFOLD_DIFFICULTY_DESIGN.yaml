  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: sweep_contract_lapse_full_cascade
        grounds:
          - state_machines.EnrollmentContract.ISSUED_to_LAPSED
          - state_machines.Application.CONTRACT_ISSUED_to_EXPIRED
          - state_machines.AidApplication.award_status.ACCEPTED_to_RELEASED
          - state_machines.Application.WAITLISTED_to_OFFERED
          - calculations.waitlist_promotion_selector
        distinguishing_aspect: |
          Depth-4+ cascade triggered by run-sweep (distinct trigger from the deposit
          instance): contract lapses (hop 1) -> its application expires (hop 2) -> the
          application's ACCEPTED award is released and the cycle budget debited back
          (hop 3) -> the freed seat promotes the top waitlisted application to a fresh
          7-day offer (hop 4). Each hop is caused by the previous mutation, not by the
          sweep directly.
        test_recipe:
          setup:
            - "OPEN cycle (budget 18,050,000), G9 section capacity 1 tuition 3,000,000 pct 1.0; test session capacity 5"
            - "fam-a EARLY application, composite 100.0, aid verified 12,000,000 hh4 -> final 1,820,000"
            - "fam-b EARLY application, composite 84.0, no aid"
            - "Clock 2026-11-02; close EARLY: fam-a OFFERED (seat held), fam-b WAITLISTED"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
