            - "GET /indemnity-claims filtered by warehouse_id ${wh_id} returns total_count == 0"

      - name: error_warehouse_not_licensed_on_receipt_issuance
        claim_type: violation_to_error
        grounds: ["validations[priority 60]", "errors[ERR_WAREHOUSE_NOT_LICENSED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_gate_beats_capacity_fiscal_on_receipt_issuance"
          rationale: "That §1.8 instance returns ERR_WAREHOUSE_NOT_LICENSED as its asserted outcome."

      - name: error_licensed_capacity_exceeded_on_receipt_issuance
        claim_type: violation_to_error
        grounds: ["validations[priority 84]", "errors[ERR_LICENSED_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_gate_beats_capacity_fiscal_on_receipt_issuance"
          rationale: "That §1.8 instance isolates the capacity breach on a LICENSED warehouse as its control arm, asserting ERR_LICENSED_CAPACITY_EXCEEDED."

      - name: error_bin_out_of_condition_on_deposit_ticket
        claim_type: violation_to_error
        grounds: ["validations[priority 65]", "errors[ERR_BIN_OUT_OF_CONDITION]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / bin_condition_safety_beats_fill_window_constraint_on_deposit_ticket"
          rationale: "That §1.8 instance asserts ERR_BIN_OUT_OF_CONDITION as the winning error."

      - name: error_bin_window_conflict_on_deposit_ticket
        claim_type: violation_to_error
        grounds: ["validations[priority 71]", "errors[ERR_BIN_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / bin_fill_window_buffered_closed_interval_conflict"
          rationale: "That §1.8 instance asserts the buffered closed-interval conflict and its 240-minute boundary."

      - name: error_loadout_capacity_exceeded_on_delivery_order
        claim_type: violation_to_error
        grounds: ["validations[priority 72]", "errors[ERR_LOADOUT_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / loadout_lane_half_open_aggregate_capacity_conflict"
          rationale: "That §1.8 instance fills every lane with half-open overlapping appointments and asserts the error on the next order."

  - section: rbac
    instances:
      - name: missing_role_and_user_headers_return_unauthenticated
        claim_type: authentication_required
        grounds: ["validations[priority 10]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 10 runs before everything: with X-User-Role and X-User-ID omitted the call fails 401 ERR_UNAUTHENTICATED even though the payload is complete and valid, and no Warehouse row is created."
        test_recipe:
          setup: ["Clock set; empty DB."]
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "POST /warehouses"
              payload:
                name: "Ghost Elevator"
                operator_name: "Nobody Grain LLC"
                state_code: "KS"
                license_program: "STATE"
                licensed_capacity_bushels: 500000
                bond_amount_cents: 2500000
                net_worth_cents: 5000000
                loadout_lane_count: 2
                registry_participant: true
              as: "NONE (X-User-Role and X-User-ID headers omitted)"
              as_user_id: "NONE"
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "GET /warehouses (as StateRegulator reg-001) returns total_count == 0"

      - name: unknown_role_name_in_header_is_unauthenticated_not_unauthorized
        claim_type: authentication_required
        grounds: ["validations[priority 10]", "errors[ERR_UNAUTHENTICATED]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A syntactically present but undeclared role (GrainInspector) is an authentication failure at priority 10, returning 401 ERR_UNAUTHENTICATED — not the 403 ERR_UNAUTHORIZED that priority 20 gives a declared-but-unlisted role."
        test_recipe:
          setup: ["Clock set; empty DB."]
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "POST /warehouses"
              payload:
                name: "Ghost Elevator"
                operator_name: "Nobody Grain LLC"
                state_code: "KS"
                license_program: "STATE"
                licensed_capacity_bushels: 500000
                bond_amount_cents: 2500000
                net_worth_cents: 5000000
                loadout_lane_count: 2
                registry_participant: true
              as: "GrainInspector (undeclared role)"
              as_user_id: "insp-001"
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The response is not 403 and data.error_id is not ERR_UNAUTHORIZED"

      - name: depositor_cannot_issue_a_receipt
        claim_type: role_denied_exclusive_operation
        grounds: ["validations[priority 20]", "errors[ERR_UNAUTHORIZED]", "rbac.WarehouseOperator.exclusive_operations[POST /receipts]"]
        distinguishing_aspect: "POST /receipts is exclusive to WarehouseOperator: the holder-to-be Depositor gets 403 ERR_UNAUTHORIZED even though the ticket is ACCEPTED and the warehouse version supplied is current."
        test_recipe:
          setup: ["Base chain through accept; a current warehouse version is captured."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
          trigger:
            - call: "POST /receipts"
              payload:
                deposit_ticket_id: "${tk_id}"
                holder_party_id: "${dep_id}"
                receipt_number: "WR-0009"
                form: "NEGOTIABLE"
                medium: "ELECTRONIC"
                expected_warehouse_version: "${wh_v}"
              as: Depositor
              as_user_id: "${dep_id}"
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /receipts filtered by deposit_ticket_id ${tk_id} returns total_count == 0"
            - "DepositTicket.${tk_id}.ticket_state == ACCEPTED"

      - name: warehouse_operator_cannot_examine_a_position_report
        claim_type: role_denied_exclusive_operation
        grounds: ["validations[priority 20]", "errors[ERR_UNAUTHORIZED]", "rbac.StateRegulator.exclusive_operations[POST /position-reports/{report_id}/examine]"]
        distinguishing_aspect: "The operator may create and submit a report but examination is exclusively the regulator's: examine as WarehouseOperator returns 403 ERR_UNAUTHORIZED and the report stays UNDER_EXAMINATION."
        test_recipe:
          setup: ["Licensed warehouse with a report submitted at 0/0 for an empty facility, so report_state is UNDER_EXAMINATION or ACCEPTED-pending examination."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - call: "POST /position-reports"
              payload: { warehouse_id: "${wh_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", as_of_date: "2026-08-05" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rpt_x_id: $.data.id }
            - call: "POST /position-reports/${rpt_x_id}/submit"
              payload: { reported_physical_bushels: 900, reported_obligation_bushels: 0 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          trigger:
            - call: "POST /position-reports/${rpt_x_id}/examine"
              payload: { result: "PASS" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "PositionReport.${rpt_x_id}.report_state == UNDER_EXAMINATION"
            - "PositionReport.${rpt_x_id}.examination_result == null"

      - name: lender_cannot_adjudicate_an_indemnity_claim
        claim_type: role_denied_exclusive_operation
        grounds: ["validations[priority 20]", "errors[ERR_UNAUTHORIZED]", "rbac.StateRegulator.exclusive_operations[POST /indemnity-claims/{claim_id}/adjudicate]"]
        distinguishing_aspect: "A Lender may file a claim (shared operation) but not decide it: adjudicate as Lender returns 403 ERR_UNAUTHORIZED and the claim stays FILED with entitlement_cents unset."
        test_recipe:
          setup: ["Base chain complete; insolvency DECLARED at 400 c/bu then OPEN_CLAIMS; the lender has filed a claim on WR-0001."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "DECLARE", insolvency_price_cents_per_bushel: 400, note: "receivership" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /warehouses/${wh_id}/insolvency"
              payload: { action: "OPEN_CLAIMS" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /indemnity-claims"
              payload: { warehouse_id: "${wh_id}", receipt_id: "${rc_id}", claimant_party_id: "${len_id}", claimed_cents: 300000 }
              as: Lender
              as_user_id: "${len_id}"
              captures: { clm_l_id: $.data.id }
          trigger:
            - call: "POST /indemnity-claims/${clm_l_id}/adjudicate"
              payload: { decision: "ALLOW", adjudication_note: "self-approved" }
              as: Lender
              as_user_id: "${len_id}"
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "IndemnityClaim.${clm_l_id}.claim_state == FILED"
            - "IndemnityClaim.${clm_l_id}.allowed_cents == 0"

      - name: registry_administrator_cannot_create_a_bin
        claim_type: role_denied_exclusive_operation
        grounds: ["validations[priority 20]", "errors[ERR_UNAUTHORIZED]", "rbac.WarehouseOperator.exclusive_operations[POST /bins]"]
        distinguishing_aspect: "The registry administrator's writes are limited to parties and registry transfers; POST /bins returns 403 ERR_UNAUTHORIZED for it even though its identity is opaque and no ownership test could apply."
        test_recipe:
          setup: ["Licensed warehouse, no bins."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
          trigger:
            - call: "POST /bins"
              payload: { warehouse_id: "${wh_id}", bin_code: "B9", capacity_bushels: 10000, commodity: "CORN", commingling_allowed: true }
              as: RegistryAdministrator
              as_user_id: "reg-admin-001"
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /bins filtered by warehouse_id ${wh_id} returns total_count == 0"

      - name: warehouse_operator_cannot_restate_a_lender_credit_line
        claim_type: role_denied_exclusive_operation
        grounds: ["validations[priority 20]", "errors[ERR_UNAUTHORIZED]", "rbac.StateRegulator.exclusive_operations[PATCH /parties/{party_id}/credit-line]"]
        distinguishing_aspect: "PATCH /parties/{party_id}/credit-line is regulator-exclusive while PATCH /warehouses/{warehouse_id}/financials is shared with the operator; the operator calling the former gets 403 ERR_UNAUTHORIZED and the line is unchanged."
        test_recipe:
          setup: ["Licensed warehouse and lender AgCredit Bank with credit_line_cents 50000000."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_len
          trigger:
            - call: "PATCH /parties/${len_id}/credit-line"
              payload: { credit_line_cents: 99000000 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "Party.${len_id}.credit_line_cents == 50000000"
            - "Party.${len_id}.available_credit_cents == 50000000"
            - "Party.${len_id}.version == 1"

      - name: depositor_cannot_perfect_a_lien_on_its_own_receipt
        claim_type: role_denied_exclusive_operation
        grounds: ["validations[priority 20]", "errors[ERR_UNAUTHORIZED]", "rbac.Lender.exclusive_operations[POST /collateral-liens/{lien_id}/perfect]"]
        distinguishing_aspect: "Perfection is the lender's act alone: the pledgor Depositor calling perfect gets 403 ERR_UNAUTHORIZED, the lien stays REQUESTED and no credit is committed."
        test_recipe:
          setup: ["Base chain complete; clock 2026-08-20T09:00:00Z; an ELECTRONIC_CONTROL MARK_TO_MARKET lien at 450 c/bu is REQUESTED by AgCredit Bank."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /collateral-liens"
              payload:
                receipt_id: "${rc_id}"
                lender_party_id: "${len_id}"
                principal_cents: 250000
                valuation_basis: "MARK_TO_MARKET"
                mark_price_cents_per_bushel: 450
                perfection_method: "ELECTRONIC_CONTROL"
              as: Lender
              as_user_id: "${len_id}"
              captures: { lien_p_id: $.data.id }
          trigger:
            - call: "POST /collateral-liens/${lien_p_id}/perfect"
              payload: { attestation_note: "pledgor attests" }
              as: Depositor
              as_user_id: "${dep_id}"
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "CollateralLien.${lien_p_id}.lien_state == REQUESTED"
            - "WarehouseReceipt.${rc_id}.encumbrance_state == UNENCUMBERED"
            - "Party.${len_id}.committed_advance_cents == 0"

      - name: licensing_regulator_cannot_examine_its_own_warehouses_report
        claim_type: segregation_of_duties
        grounds: ["validations[priority 27]", "errors[ERR_SEGREGATION_OF_DUTIES]", "rbac.role_model[segregation_of_duties]", "entities.Warehouse.licensed_by_user_id"]
        distinguishing_aspect: "Priority 27 is a per-user bar, not a per-role bar: reg-001 (recorded in licensed_by_user_id) is refused with 403 ERR_SEGREGATION_OF_DUTIES, and the identical call by reg-002 then succeeds with result PASS."
        test_recipe:
          setup: ["Warehouse licensed by reg-001, so licensed_by_user_id == reg-001; an empty facility with a report submitted at 900/0 (variance 900 within no obligation is irrelevant to the auth gate)."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - call: "POST /position-reports"
              payload: { warehouse_id: "${wh_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", as_of_date: "2026-08-05" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rpt_s_id: $.data.id }
            - call: "POST /position-reports/${rpt_s_id}/submit"
              payload: { reported_physical_bushels: 0, reported_obligation_bushels: 0 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          trigger:
            - call: "POST /position-reports/${rpt_s_id}/examine"
              payload: { result: "PASS", findings_note: "same regulator" }
              as: StateRegulator
              as_user_id: "reg-001"
            - call: "POST /position-reports/${rpt_s_id}/examine"
              payload: { result: "PASS", findings_note: "independent examiner" }
              as: StateRegulator
              as_user_id: "reg-002"
          assert:
            - "Call 1: HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Warehouse.${wh_id}.licensed_by_user_id == reg-001"
            - "Call 2: HTTP 200, PositionReport.${rpt_s_id}.examination_result == PASS"
            - "Call 2: PositionReport.${rpt_s_id}.report_state == ACCEPTED"
            - "Call 2: PositionReport.${rpt_s_id}.examined_by_user_id == reg-002"

      - name: depositor_cannot_read_a_receipt_it_does_not_hold
        claim_type: resource_ownership_denied
        grounds: ["validations[priority 25]", "errors[ERR_NOT_RESOURCE_OWNER]", "rbac.Depositor.identity[entity_backed:Party]"]
        distinguishing_aspect: "Depositor is listed on GET /receipts/{receipt_id}, so priority 20 passes; priority 25 still refuses Bo Farms with 403 ERR_NOT_RESOURCE_OWNER because holder_party_id is Ada Farms, while Ada Farms reads the same row successfully."
        test_recipe:
          setup: ["Base chain complete; WR-0001 held by Ada Farms; an unrelated producer Bo Farms exists."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /parties"
              payload: { name: "Bo Farms", party_kind: "PRODUCER_DEPOSITOR", state_code: "KS" }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { dep_b_id: $.data.id }
          trigger:
            - call: "GET /receipts/${rc_id}"
              payload: {}
              as: Depositor
              as_user_id: "${dep_b_id}"
            - call: "GET /receipts/${rc_id}"
              payload: {}
              as: Depositor
              as_user_id: "${dep_id}"
          assert:
            - "Call 1: HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Call 2: HTTP 200 with data.receipt_number == WR-0001 and data.holder_party_id == ${dep_id}"

      - name: lender_cannot_create_a_lien_naming_another_lender
        claim_type: resource_ownership_denied
        grounds: ["validations[priority 25]", "errors[ERR_NOT_RESOURCE_OWNER]", "rbac.Lender.note"]
        distinguishing_aspect: "Ownership for lien writes is body-based, not path-based: Thin Bank submitting lender_party_id of AgCredit Bank is refused 403 ERR_NOT_RESOURCE_OWNER before any valuation runs, so neither lender's committed advance moves."
        test_recipe:
          setup: ["Base chain complete plus a second lender Thin Bank (credit_line_cents 100000); clock 2026-08-20T09:00:00Z."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /parties"
              payload: { name: "Thin Bank", party_kind: "LENDER", state_code: "KS", credit_line_cents: 100000 }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { len_t2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
          trigger:
            - call: "POST /collateral-liens"
              payload:
                receipt_id: "${rc_id}"
                lender_party_id: "${len_id}"
                principal_cents: 250000
                valuation_basis: "MARK_TO_MARKET"
                mark_price_cents_per_bushel: 450
                perfection_method: "ELECTRONIC_CONTROL"
              as: Lender
              as_user_id: "${len_t2_id}"
          assert:
            - "HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "GET /collateral-liens filtered by receipt_id ${rc_id} returns total_count == 0"
            - "Party.${len_id}.committed_advance_cents == 0"
            - "Party.${len_t2_id}.committed_advance_cents == 0"

      - name: registry_administrator_shared_operations_succeed
        claim_type: role_allowed_shared_operation
        grounds: ["rbac.RegistryAdministrator.shared_operations", "endpoints[POST /parties]", "endpoints[POST /receipts/{receipt_id}/transfer]", "entities.WarehouseReceipt.transfer_log"]
        distinguishing_aspect: "The registry administrator is the only role permitted transfer_channel REGISTRY: it creates the transferee party and moves the ELECTRONIC receipt WR-0001, appending exactly one REGISTRY record to transfer_log."
        test_recipe:
          setup: ["Base chain complete; WR-0001 is NEGOTIABLE / ELECTRONIC at a registry-participant warehouse and held by Ada Farms."]
          setup_api_calls: *base_full
          trigger:
            - call: "POST /parties"
              payload: { name: "Cargo Trading Co", party_kind: "COMMERCIAL_DEPOSITOR", state_code: "KS" }
              as: RegistryAdministrator
              as_user_id: "reg-admin-001"
              captures: { dep_ct_id: $.data.id }
            - call: "POST /receipts/${rc_id}/transfer"
              payload: { to_party_id: "${dep_ct_id}", transfer_channel: "REGISTRY" }
              as: RegistryAdministrator
              as_user_id: "reg-admin-001"
          assert:
            - "Call 1: HTTP 201 with data.party_kind == COMMERCIAL_DEPOSITOR"
            - "Call 2: HTTP 200, WarehouseReceipt.${rc_id}.holder_party_id == ${dep_ct_id}"
            - "WarehouseReceipt.${rc_id}.transfer_log has length 1 with transfer_channel REGISTRY, from_party_id ${dep_id} and to_party_id ${dep_ct_id}"
            - "WarehouseReceipt.${rc_id}.receipt_state == ISSUED"

      - name: lender_revalues_its_own_perfected_lien_and_credit_moves_by_the_delta
        claim_type: role_allowed_exclusive_operation
        grounds: ["rbac.Lender.exclusive_operations[POST /collateral-liens/{lien_id}/revalue]", "endpoints[POST /collateral-liens/{lien_id}/revalue]", "calculations.collateral_valuation_and_advance_limit"]
        distinguishing_aspect: "Re-marking 949 US_NO_1 bushels from 450 to 400 c/bu re-runs every step: eligible 379600, admin fee 949, warehouseman lien 11957, net 367643, low tier, advance_limit 257350 — a delta of -33132 that is applied to the lender's committed advance because the lien is PERFECTED."
        test_recipe:
          setup:
            - "Base chain complete; clock 2026-08-20T09:00:00Z (16 inclusive storage days from the 2026-08-05 issuance)."
            - "An ELECTRONIC_CONTROL MARK_TO_MARKET lien at 450 c/bu with principal 250000 is PERFECTED, giving advance_limit_cents 290482 and committed_advance_cents 290482."
          setup_api_calls:
