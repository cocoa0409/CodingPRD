# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# Task 1913: Industrial Gas Production & Cylinder Fill
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fill_draw_provisional_vs_final_divergence
        grounds:
          - calculations.fill_draw_liters
          - entities.FillLot.fields.draw_estimate_liters
          - entities.FillLot.fields.draw_actual_liters
          - entities.StorageTank.fields.reserved_liters
          - entities.StorageTank.fields.drawn_liters
        distinguishing_aspect: |
          Dual-variant logic on the PRODUCTION domain (FillLot/StorageTank): the
          PROVISIONAL variant (standard 5 bar residual) and the FINAL variant
          (measured 15 bar residuals) produce 197.0 vs 187.0 liters for identical
          cylinder inputs, and the tank ledger must reconcile the 10-liter delta.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01; plant OPERATING; O2 tank level 5000 cap 10000"
            - "Two STANDARD (50L) O2 cylinders hydro-compliant and RESERVED into a 200-bar lot"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-DV1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-DV1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-DV1-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator, captures: { lot_est: $.data.id } }
            - { call: "GET /api/fill-lots/${lot}", as: ProductionOperator, captures: { est: $.data.draw_estimate_liters } }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1", captures: { act: $.data.draw_actual_liters } }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { lvl: $.data.current_level_liters, res: $.data.reserved_liters, drn: $.data.drawn_liters } }
          assert:
            - "FillLot.${lot}.draw_estimate_liters == 197.0 (PROVISIONAL: 2*50*(200-5)/100 + 2)"
            - "FillLot.${lot}.draw_actual_liters == 187.0 (FINAL: 2*50*(200-15)/100 + 2)"
            - "draw_estimate_liters != draw_actual_liters (divergence 10.0 liters)"
            - "StorageTank.${t}.reserved_liters == 0 and drawn_liters == 187.0 after complete-fill"
            - "StorageTank.${t}.current_level_liters == 4813.0"

      - name: rental_charge_calendar_vs_grace_divergence
        grounds:
          - calculations.rental_final_charge
          - entities.CustomerAccount.fields.billing_variant
          - entities.CylinderRental.fields.final_charge_cents
        distinguishing_aspect: |
          Dual-variant logic on the BILLING domain (CylinderRental/CustomerAccount)
          — a different entity domain from fill_draw: identical dates and rates bill
          13000 cents under CALENDAR_DAY and 10000 cents under GRACE_PERIOD(3).
        test_recipe:
          setup:
            - "Clock default 2026-08-01; two FILLED O2 cylinders from a released lot"
            - "Customer CAL (CALENDAR_DAY, free_days 0) and customer GRP (GRACE_PERIOD, free_days 3), credit 100000 each"
            - "Each rents one cylinder at 1000 cents/day planned 5 days (due 2026-08-06)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-DV2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-DV2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-DV2-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "CAL", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu1: $.data.id } }
            - { call: "POST /api/customers", payload: { account_name: "GRP", billing_variant: "GRACE_PERIOD", free_days: 3, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu2: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu1}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 5 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu2}", cylinder_id: "${c2}", daily_rate_cents: 1000, planned_days: 5 }, as: BillingClerk, captures: { r2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /api/rentals/${r1}/return", payload: { return_condition: "OK" }, as: BillingClerk, captures: { chg1: $.data.final_charge_cents } }
            - { call: "POST /api/rentals/${r2}/return", payload: { return_condition: "OK" }, as: BillingClerk, captures: { chg2: $.data.final_charge_cents } }
          assert:
            - "CylinderRental.${r1}.final_charge_cents == 13000 (CALENDAR_DAY: 9*1000 base + 4 overdue days * 1000)"
            - "CylinderRental.${r2}.final_charge_cents == 10000 (GRACE_PERIOD: max(0, 9-3)*1000 base + 4000 demurrage)"
            - "CustomerAccount.${cu1}.outstanding_balance_cents == 13000; CustomerAccount.${cu2}.outstanding_balance_cents == 10000"
            - "final charges diverge by exactly 3000 cents for identical dates and rates"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: demurrage_tier_straddle_marginal_rates
        grounds:
          - calculations.demurrage_accrual
          - entities.CylinderRental.fields.final_charge_cents
        distinguishing_aspect: |
          Mode (a): a tiered-rate formula with >= 3 inputs (overdue day index,
          daily rate, tier multiplier) and non-linear tier straddling — 9 overdue
          days split 7 at 1.0x and 2 at 1.5x, and the marginal tier applies only
          to days 8..9, not retroactively to all 9 days.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; one FILLED cylinder; CALENDAR_DAY customer, credit 100000"
            - "Rental at 1000 cents/day, planned 2 days (due 2026-08-03)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CF1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CF1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-CF1", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 2 }, as: BillingClerk, captures: { r: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /api/rentals/${r}/return", payload: { return_condition: "OK" }, as: BillingClerk, captures: { chg: $.data.final_charge_cents } }
          assert:
            - "CylinderRental.${r}.final_charge_cents == 21000 (base 11*1000 + demurrage 7*1000*1.0 + 2*1000*1.5 = 11000 + 7000 + 3000)"
            - "Demurrage portion is 10000, proving marginal tier split; a flat 9*1500 retroactive reading would give 13500"

      - name: billing_run_per_line_rounding_order
        grounds:
          - calculations.billing_run_total
          - calculations.demurrage_accrual
          - entities.BillingRun.fields.charge_lines
          - entities.BillingRun.fields.total_charges_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round per tier segment per
          line, then sum lines. Two rentals at 333 cents/day each accrue a 499.5-cent
          tier-2 segment; per-line rounding yields 2831+2831 = 5662, while
          sum-then-round would yield 5661.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; two FILLED cylinders; CALENDAR_DAY customer credit 500000"
            - "Two rentals at 333 cents/day, planned 1 day (due 2026-08-02), both still out"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CF2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CF2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CF2-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-CF2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 500000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 333, planned_days: 1 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 333, planned_days: 1 }, as: BillingClerk, captures: { r2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/billing-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-10" }, as: BillingClerk, captures: { br: $.data.id } }
          trigger:
            - { call: "POST /api/billing-runs/${br}/finalize", payload: {}, as: BillingClerk, captures: { tot: $.data.total_charges_cents } }
          assert:
            - "BillingRun.${br}.charge_lines has exactly 2 lines, each demurrage_cents == 2831 (7*333 + round_half_up(1*333*1.5) = 2331 + 500)"
            - "BillingRun.${br}.total_charges_cents == 5662 (per-line rounding; sum-then-round would give 5661)"
            - "CylinderRental.${r1}.status == OVERDUE and billed_through_date == 2026-08-10; demurrage_billed_cents == 2831"

      - name: blend_quote_fee_tier_keyed_on_cost_not_total
        grounds:
          - calculations.blend_price_quote
          - entities.BlendOrder.fields.component_cost_cents
          - entities.BlendOrder.fields.service_fee_cents
          - entities.BlendOrder.fields.total_price_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency broken by pinned evaluation
          order — the service fee tier reads component_cost_cents only, never
          total_price_cents; keying on total would pick the same tier here but a
          12%-of-total fee (19085) differs from the pinned 12%-of-cost (17040).
        test_recipe:
          setup:
            - "Clock default 2026-08-01; ACTIVE customer credit 100000"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-CF3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
          trigger:
            - { call: "POST /api/blend-orders", payload: { customer_id: "${cu}", batch_qty_liters: 1000, components: [ { product_code: "O2", target_pct: 21.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 300 }, { product_code: "N2", target_pct: 79.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 100 } ] }, as: BillingClerk, captures: { bo: $.data.id, cost: $.data.component_cost_cents, fee: $.data.service_fee_cents, tot: $.data.total_price_cents } }
          assert:
            - "BlendOrder.${bo}.component_cost_cents == 142000 (210*300 + 790*100)"
            - "BlendOrder.${bo}.service_fee_cents == 17040 (round_half_up(0.12 * 142000); 12% of the 159040 total would be 19085)"
            - "BlendOrder.${bo}.total_price_cents == 159040"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: fill_lot_rework_cycle_reentry
        grounds:
          - state_machines.FillLot.ANALYSIS_FAILED_to_FILLING
          - state_machines.CylinderAsset.QUARANTINED_to_RESERVED
        distinguishing_aspect: |
          Cyclic machine on FillLot: FILLING -> AWAITING_ANALYSIS -> ANALYSIS_FAILED
          -> FILLING (rework) -> AWAITING_ANALYSIS -> RELEASED, with the cylinder
          riding QUARANTINED -> RESERVED -> FILLED across loop iterations.
        test_recipe:
          setup:
            - "Clock default; O2 tank level 5000; one cylinder; lot completed once with a FAIL analysis (CO 20 > 1.5*10)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-NL1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-NL1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 20 } ] }, as: LabAnalyst, as_user_id: "lab-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/rework", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
          assert:
            - "After FAIL: FillLot.${lot}.status == ANALYSIS_FAILED and CylinderAsset.${c1}.status == QUARANTINED"
            - "After rework: FillLot.${lot}.status == FILLING and CylinderAsset.${c1}.status == RESERVED (cycle re-entry)"
            - "After second complete + PASS: FillLot.${lot}.status == RELEASED and CylinderAsset.${c1}.status == FILLED with last_fill_lot_id == ${lot}"

      - name: cylinder_full_lifecycle_loop
        grounds:
          - state_machines.CylinderAsset.IN_STOCK_to_RESERVED
          - state_machines.CylinderAsset.RESERVED_to_FILLED
          - state_machines.CylinderAsset.FILLED_to_ON_RENT
          - state_machines.CylinderAsset.ON_RENT_to_IN_STOCK
        distinguishing_aspect: |
          Cyclic machine on CylinderAsset (different entity from FillLot): the
          cylinder loops IN_STOCK -> RESERVED -> FILLED -> ON_RENT -> IN_STOCK and
          can enter RESERVED a second time, proving the loop is re-entrant.
        test_recipe:
          setup:
            - "Clock default; released lot with one FILLED cylinder; ACTIVE customer"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-NL2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-NL2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot1: $.data.id } }
            - { call: "POST /api/fill-lots/${lot1}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot1}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-NL2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
          trigger:
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 3 }, as: BillingClerk, captures: { r: $.data.id } }
            - { call: "POST /api/rentals/${r}/return", payload: { return_condition: "OK" }, as: BillingClerk }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot2: $.data.id } }
            - { call: "POST /api/fill-lots/${lot2}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
          assert:
            - "CylinderAsset.${c1} walked IN_STOCK -> RESERVED -> FILLED -> ON_RENT -> IN_STOCK -> RESERVED (second loop entry succeeds)"
            - "CylinderAsset.${c1}.current_fill_lot_id == ${lot2} while last_fill_lot_id == ${lot1} until the second lot releases"
            - "CylinderRental.${r}.status == RETURNED with final_charge_cents == 3000 (3 days * 1000, no overdue)"

      - name: route_driver_unassign_reassign_cycle
        grounds:
          - state_machines.DeliveryRoute.DRIVER_ASSIGNED_to_PLANNED
          - state_machines.Driver.QUALIFIED_to_CERT_EXPIRED
          - state_machines.Driver.CERT_EXPIRED_to_QUALIFIED
        distinguishing_aspect: |
          Cycle on DeliveryRoute (different entity again): DRIVER_ASSIGNED ->
          PLANNED via the cert cascade, then PLANNED -> DRIVER_ASSIGNED again after
          the driver renews — the route re-enters PLANNED without becoming terminal.
        test_recipe:
          setup:
            - "Clock default; driver QUALIFIED with NONFLAMMABLE_GAS endorsement (expiry 2027-01-01) and medical 2026-08-20"
            - "Route 2026-08-05 window 8-12 assigned to the driver"
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-NL3", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2026-08-20" }, as: LogisticsCoordinator, captures: { d: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "S1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /api/routes/${ro}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
          trigger:
            - { call: "PATCH /api/drivers/${d}", payload: { medical_card_expiry: "2026-07-01" }, as: LogisticsCoordinator }
            - { call: "PATCH /api/drivers/${d}", payload: { medical_card_expiry: "2027-06-01" }, as: LogisticsCoordinator }
            - { call: "POST /api/drivers/${d}/set-status", payload: { target_status: "QUALIFIED" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes/${ro}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
          assert:
            - "After expiry PATCH: Driver.${d}.status == CERT_EXPIRED and DeliveryRoute.${ro}.status == PLANNED with driver_id == null"
            - "After renewal + reinstatement: Driver.${d}.status == QUALIFIED"
            - "Re-assignment succeeds: DeliveryRoute.${ro}.status == DRIVER_ASSIGNED with driver_id == ${d}"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 4, 2, 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fill_lot_recall_chain_depth4
        grounds:
          - state_machines.FillLot.RELEASED_to_RECALLED
          - state_machines.CylinderAsset.FILLED_to_QUARANTINED
          - state_machines.CylinderRental.ACTIVE_to_RECALL_HOLD
          - entities.CustomerAccount.fields.recall_flag
        distinguishing_aspect: |
          Depth-4 chain from the recall trigger: FillLot RECALLED -> cylinders
          QUARANTINED -> their ACTIVE/OVERDUE rentals RECALL_HOLD -> each affected
          customer recall_flag = true; each link is caused by the previous link.
        test_recipe:
          setup:
            - "Clock default; one lot released with three cylinders: c1 rented by customer A, c2 rented by customer B, c3 FILLED unrented"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-TC1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-TC1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-TC1-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-TC1-C", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c3: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c3}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 }, { cylinder_id: "${c3}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-TC1-A", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cuA: $.data.id } }
            - { call: "POST /api/customers", payload: { account_name: "C-TC1-B", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cuB: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cuA}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 5 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cuB}", cylinder_id: "${c2}", daily_rate_cents: 1000, planned_days: 5 }, as: BillingClerk, captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/recall", payload: {}, as: QualityManager }
          assert:
            - "Link 1: FillLot.${lot}.status == RECALLED"
            - "Link 2: CylinderAsset ${c1}, ${c2}, ${c3} all status == QUARANTINED (c3 proves FILLED-but-unrented cylinders are swept)"
            - "Link 3: CylinderRental.${r1}.status == RECALL_HOLD and CylinderRental.${r2}.status == RECALL_HOLD"
            - "Link 4: CustomerAccount.${cuA}.recall_flag == true and CustomerAccount.${cuB}.recall_flag == true"

      - name: driver_cert_cascade_depth2
        grounds:
          - state_machines.Driver.QUALIFIED_to_CERT_EXPIRED
          - state_machines.DeliveryRoute.DRIVER_ASSIGNED_to_PLANNED
          - state_machines.DeliveryRoute.DISPATCHED_to_PLANNED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (driver PATCH recording an expired
          medical card): Driver CERT_EXPIRED -> every DRIVER_ASSIGNED and DISPATCHED
          route of that driver reverts to PLANNED with driver_id cleared.
        test_recipe:
          setup:
            - "Clock default; driver QUALIFIED; route A (2026-08-05, 8-12) DRIVER_ASSIGNED; route B (2026-08-05, 13-17) DISPATCHED — same driver, non-overlapping half-open windows"
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-TC2", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2026-08-20" }, as: LogisticsCoordinator, captures: { d: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "A1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roA: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 13, window_end_hour: 17, stops: [ { stop_name: "B1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roB: $.data.id } }
            - { call: "POST /api/routes/${roA}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes/${roB}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes/${roB}/dispatch", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "PATCH /api/drivers/${d}", payload: { medical_card_expiry: "2026-07-01" }, as: LogisticsCoordinator }
          assert:
            - "Link 1: Driver.${d}.status == CERT_EXPIRED"
            - "Link 2: DeliveryRoute.${roA}.status == PLANNED and driver_id == null"
            - "Link 2: DeliveryRoute.${roB}.status == PLANNED and driver_id == null (DISPATCHED routes revert too)"

      - name: billing_post_credit_hold_cascade_depth3
        grounds:
          - state_machines.BillingRun.FINALIZED_to_POSTED
          - state_machines.CustomerAccount.ACTIVE_to_CREDIT_HOLD
          - state_machines.BulkInstallation.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Depth-3 chain from the billing-post trigger (different from recall and
          cert-PATCH): post adds 2831 cents to outstanding -> crossing the credit
          limit flips the customer to CREDIT_HOLD -> the customer's ACTIVE bulk
          installation is PAUSED.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; two FILLED cylinders; customer limit 10000 CALENDAR_DAY"
            - "Rental r1 (daily 1000, planned 10) returned on 2026-08-10: 9 days, no overdue -> outstanding 9000"
            - "Rental r2 (daily 333, planned 1, due 2026-08-02) still out; customer has an ACTIVE bulk installation"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-TC3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-TC3-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-TC3-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-TC3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 10000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 10 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 333, planned_days: 1 }, as: BillingClerk, captures: { r2: $.data.id } }
            - { call: "POST /api/bulk-installations", payload: { customer_id: "${cu}", product_code: "O2", capacity_liters: 5000, initial_level_liters: 2000, reorder_point_liters: 400, max_order_qty_liters: 3000 }, as: PlantManager, captures: { inst: $.data.id } }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "INSTALLED" }, as: PlantManager }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "ACTIVE" }, as: PlantManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/rentals/${r1}/return", payload: { return_condition: "OK" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-10" }, as: BillingClerk, captures: { br: $.data.id } }
            - { call: "POST /api/billing-runs/${br}/finalize", payload: {}, as: BillingClerk }
          trigger:
            - { call: "POST /api/billing-runs/${br}/post", payload: {}, as: BillingClerk }
          assert:
            - "Link 1: CustomerAccount.${cu}.outstanding_balance_cents == 11831 (9000 + 2831)"
            - "Link 2: CustomerAccount.${cu}.status == CREDIT_HOLD (11831 > 10000)"
            - "Link 3: BulkInstallation.${inst}.status == PAUSED"
            - "BillingRun.${br}.status == POSTED; CylinderRental.${r2}.status == OVERDUE with demurrage_billed_cents == 2831"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_conflict_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.CylinderAsset.IN_STOCK_to_RESERVED
        distinguishing_aspect: |
          Pair state x business_safety: a cylinder that is both ON_RENT (state,
          priority 5) and hydro OVERDUE (safety, priority 6) must fail assignment
          with ERR_CYLINDER_NOT_AVAILABLE, not ERR_HYDRO_RETEST_OVERDUE.
        test_recipe:
          setup:
            - "Cylinder filled and rented while hydro-compliant (due 2026-08-15); clock then advanced to 2026-08-20 so it is ON_RENT and OVERDUE at once; a second PLANNED lot awaits"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-PP1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-PP1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-08-15" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot1: $.data.id } }
            - { call: "POST /api/fill-lots/${lot1}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot1}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-PP1", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 10 }, as: BillingClerk, captures: { r: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot2: $.data.id } }
          trigger:
            - { call: "POST /api/fill-lots/${lot2}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYLINDER_NOT_AVAILABLE (state, priority 5) — NOT ERR_HYDRO_RETEST_OVERDUE (safety, priority 6), though both conditions hold"

      - name: dispatch_assign_conflict_safety_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.DeliveryRoute.PLANNED_to_DRIVER_ASSIGNED
        distinguishing_aspect: |
          Pair business_safety x business_temporal: assigning a driver who both
          lacks a required hazmat endorsement (safety, priority 8) and has an
          overlapping route window (temporal, priority 10) must fail with
          ERR_HAZMAT_ENDORSEMENT_MISSING, not ERR_DRIVER_ROUTE_OVERLAP.
        test_recipe:
          setup:
            - "Driver has only NONFLAMMABLE_GAS (expiry 2027-01-01); already assigned route X 2026-08-05 08-12"
            - "Route Y 2026-08-05 10-14 requires POISON_GAS"
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-PP2", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2027-01-01" }, as: LogisticsCoordinator, captures: { d: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "X1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roX: $.data.id } }
            - { call: "POST /api/routes/${roX}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 10, window_end_hour: 14, stops: [ { stop_name: "Y1", hazmat_classes: ["POISON_GAS"] } ] }, as: LogisticsCoordinator, captures: { roY: $.data.id } }
          trigger:
            - { call: "POST /api/routes/${roY}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HAZMAT_ENDORSEMENT_MISSING (safety, priority 8) — NOT ERR_DRIVER_ROUTE_OVERLAP (temporal, priority 10), though both hold"
            - "DeliveryRoute.${roY}.status remains PLANNED with driver_id == null"

      - name: rental_conflict_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - state_machines.CylinderAsset.FILLED_to_ON_RENT
        distinguishing_aspect: |
          Pair state x business_fiscal: a checkout whose cylinder is IN_STOCK
          (never filled; state, priority 5) and whose charge estimate would breach
          the credit limit (fiscal, priority 16) must fail with
          ERR_CYLINDER_NOT_AVAILABLE, not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Customer limit 10000 with outstanding 9500 (prior rental daily 500 planned 20 returned at 19 days, no overdue)"
            - "Cylinder B registered but never filled (IN_STOCK)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-PP3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-PP3-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-PP3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 10000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 500, planned_days: 20 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/rentals/${r1}/return", payload: { return_condition: "OK" }, as: BillingClerk }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-PP3-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 1000, planned_days: 10 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYLINDER_NOT_AVAILABLE (state, priority 5) — NOT ERR_CREDIT_LIMIT_EXCEEDED (fiscal, priority 16), though 9500 + 10000 > 10000 also holds"
            - "CustomerAccount.${cu}.outstanding_balance_cents == 9500 (19 days * 500, unchanged by the rejected checkout)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics and endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: hydro_due_today_still_fillable
        grounds:
          - calculations.hydro_status_derivation
          - validations[priority=6]
        distinguishing_aspect: |
          Metric: days-to-due on the assign endpoint. hydro_due_date == clock date
          is DUE_SOON and fillable (strict > for OVERDUE); one day later the same
          cylinder is rejected with ERR_HYDRO_RETEST_OVERDUE.
        test_recipe:
          setup:
            - "O2 cylinder last hydro 2025-08-10 -> due 2026-08-10 (12-month interval)"
            - "PLANNED lot; clock 2026-08-10 for the first assign"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-BP1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-08-10" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP1-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-08-10" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator, captures: { ok_cyl: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "Assign at days_to_due == 0 succeeds: CylinderAsset.${c1}.status == RESERVED, hydro_status == DUE_SOON"
            - "Assign at days_to_due == -1 fails: error_id == ERR_HYDRO_RETEST_OVERDUE (due date strictly passed)"

      - name: credit_limit_exact_equality_allowed
        grounds:
          - validations[priority=16]
          - calculations.credit_hold_evaluation
        distinguishing_aspect: |
          Metric: cents on the rental-create endpoint. outstanding + estimate ==
          credit_limit passes (strict > rejects); one planned day more tips the
          estimate over and is rejected with ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Customer CALENDAR_DAY limit 16000; outstanding 8000 from a returned 8-day 1000-cent rental"
            - "Two more FILLED cylinders available"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-BP2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP2-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP2-C", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c3: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c3}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 }, { cylinder_id: "${c3}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-BP2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 16000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 8 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/rentals/${r1}/return", payload: { return_condition: "OK" }, as: BillingClerk }
          trigger:
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 1000, planned_days: 8 }, as: BillingClerk, captures: { r2: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c3}", daily_rate_cents: 1000, planned_days: 9 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "Equality allowed: 8000 + 8*1000 == 16000 == limit -> rental ${r2} created (201)"
            - "Strictly over rejected: 8000 + 9*1000 = 17000 > 16000 -> error_id == ERR_CREDIT_LIMIT_EXCEEDED"
            - "CustomerAccount.${cu}.status remains ACTIVE at outstanding 8000 (hold requires a posted charge crossing, not an estimate)"

      - name: tank_reserve_exact_equality_start_fill
        grounds:
          - calculations.fill_draw_liters
          - validations[priority=13]
        distinguishing_aspect: |
          Metric: liters on the start-fill endpoint. current_level - reserved ==
          draw_estimate + 100 exactly passes (>= boundary); one liter less fails
          with ERR_TANK_LEVEL_TOO_LOW.
        test_recipe:
          setup:
            - "O2 tank; latest telemetry reading pins current_level at exactly 297 liters; lot estimate is 197.0 (2 STANDARD cylinders at 200 bar)"
            - "A second identical lot against a second tank pinned at 296 liters"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-BP3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: PlantManager }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlantManager }
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t1}", measured_level_liters: 297, measured_at: "2026-08-01T08:30:00Z", source: "MANUAL_DIP" }, as: ProductionOperator }
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t2}", measured_level_liters: 296, measured_at: "2026-08-01T08:30:00Z", source: "MANUAL_DIP" }, as: ProductionOperator }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP3-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP3-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP3-C", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c3: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-BP3-D", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c4: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t1}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot1: $.data.id } }
            - { call: "POST /api/fill-lots/${lot1}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t2}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot2: $.data.id } }
            - { call: "POST /api/fill-lots/${lot2}/cylinders", payload: { cylinder_id: "${c3}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot2}/cylinders", payload: { cylinder_id: "${c4}" }, as: ProductionOperator }
          trigger:
            - { call: "POST /api/fill-lots/${lot1}/start-fill", payload: {}, as: ProductionOperator, captures: { ok_lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot2}/start-fill", payload: {}, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "297 >= 197 + 100 exactly: FillLot.${lot1}.status == FILLING"
            - "296 < 197 + 100 by one liter: error_id == ERR_TANK_LEVEL_TOO_LOW; FillLot.${lot2} remains PLANNED"

      - name: route_window_adjacency_half_open
        grounds:
          - validations[priority=10]
          - state_machines.DeliveryRoute.PLANNED_to_DRIVER_ASSIGNED
        distinguishing_aspect: |
          Metric: integer hours on the assign-driver endpoint. Half-open windows:
          end == start of another route is NOT an overlap (12-16 after 08-12
          succeeds), while a one-hour interior overlap (11-13) is rejected with
          ERR_DRIVER_ROUTE_OVERLAP.
        test_recipe:
          setup:
            - "Driver with NONFLAMMABLE_GAS endorsement; route A 2026-08-05 08-12 already DRIVER_ASSIGNED"
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-BP4", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2027-01-01" }, as: LogisticsCoordinator, captures: { d: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "A1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roA: $.data.id } }
            - { call: "POST /api/routes/${roA}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 12, window_end_hour: 16, stops: [ { stop_name: "B1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roB: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 11, window_end_hour: 13, stops: [ { stop_name: "C1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roC: $.data.id } }
          trigger:
            - { call: "POST /api/routes/${roB}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator, captures: { ok_route: $.data.id } }
            - { call: "POST /api/routes/${roC}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Touching windows allowed: DeliveryRoute.${roB}.status == DRIVER_ASSIGNED (12-16 after 08-12)"
            - "Interior overlap rejected: error_id == ERR_DRIVER_ROUTE_OVERLAP for 11-13; ${roC} remains PLANNED"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fill_start_requires_tank_in_service
        grounds:
          - state_machines.FillLot.PLANNED_to_FILLING
          - state_machines.StorageTank.IN_SERVICE_to_MAINTENANCE
          - validations[priority=5]
        distinguishing_aspect: |
          Pair FillLot x StorageTank: start-fill is gated on the tank's state, and
          flipping the tank back to IN_SERVICE re-enables the exact same request.
        test_recipe:
          setup:
            - "Clock default; lot PLANNED with one cylinder assigned; tank then moved to MAINTENANCE"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CE1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CE1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/tanks/${t}/set-status", payload: { target_status: "MAINTENANCE" }, as: PlantManager }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator, captures: { err: $.data.error_id } }
            - { call: "POST /api/tanks/${t}/set-status", payload: { target_status: "IN_SERVICE" }, as: PlantManager }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator, captures: { ok_lot: $.data.id } }
          assert:
            - "While tank MAINTENANCE: error_id == ERR_TANK_NOT_IN_SERVICE; lot remains PLANNED"
            - "After tank returns IN_SERVICE: FillLot.${lot}.status == FILLING (identical request now succeeds)"

      - name: rental_requires_customer_active_not_credit_hold
        grounds:
          - state_machines.CylinderRental.transitions
          - state_machines.CustomerAccount.ACTIVE_to_CREDIT_HOLD
          - validations[priority=5]
        distinguishing_aspect: |
          Pair CylinderRental x CustomerAccount: a CREDIT_HOLD customer cannot
          check out even a perfectly valid FILLED cylinder; payment that releases
          the hold re-enables checkout.
        test_recipe:
          setup:
            - "Customer limit 5000; first rental (daily 1000, planned 4, est 4000 <= 5000 OK) returned at 9 days with 5 overdue -> charge 14000 -> CREDIT_HOLD"
            - "Second FILLED cylinder available"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CE2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CE2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CE2-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-CE2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 5000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 4 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/rentals/${r1}/return", payload: { return_condition: "OK" }, as: BillingClerk }
          trigger:
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 1000, planned_days: 1 }, as: BillingClerk, captures: { err: $.data.error_id } }
            - { call: "POST /api/customers/${cu}/payments", payload: { amount_cents: 14000 }, as: BillingClerk }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 1000, planned_days: 1 }, as: BillingClerk, captures: { r2: $.data.id } }
          assert:
            - "On CREDIT_HOLD: error_id == ERR_ACCOUNT_NOT_ACTIVE (14000 outstanding > 5000 limit)"
            - "Payment of 14000 -> outstanding 0 <= 4000 release point -> CustomerAccount.${cu}.status == ACTIVE"
            - "Retry succeeds: CylinderRental.${r2}.status == ACTIVE"

      - name: blend_start_requires_plant_operating
        grounds:
          - state_machines.BlendOrder.APPROVED_to_BLENDING
          - state_machines.Plant.OPERATING_to_MAINTENANCE_SHUTDOWN
          - validations[priority=5]
        distinguishing_aspect: |
          Pair BlendOrder x Plant (a third distinct pair): the plant-level shutdown
          gates blending even though every component tank is eligible.
        test_recipe:
          setup:
            - "O2 and N2 tanks with ample level; APPROVED 1000-liter blend (O2 21% / N2 79%)"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CE3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { tO: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "N2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { tN: $.data.id } }
            - { call: "POST /api/customers", payload: { account_name: "C-CE3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/blend-orders", payload: { customer_id: "${cu}", batch_qty_liters: 1000, components: [ { product_code: "O2", target_pct: 21.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 300 }, { product_code: "N2", target_pct: 79.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 100 } ] }, as: BillingClerk, captures: { bo: $.data.id } }
            - { call: "POST /api/blend-orders/${bo}/approve", payload: {}, as: QualityManager }
            - { call: "POST /api/plants/${p}/set-status", payload: { target_status: "MAINTENANCE_SHUTDOWN" }, as: PlantManager }
          trigger:
            - { call: "POST /api/blend-orders/${bo}/start-blend", payload: {}, as: ProductionOperator, captures: { err: $.data.error_id } }
            - { call: "POST /api/plants/${p}/set-status", payload: { target_status: "OPERATING" }, as: PlantManager }
            - { call: "POST /api/blend-orders/${bo}/start-blend", payload: {}, as: ProductionOperator, captures: { ok_blend: $.data.id } }
          assert:
            - "During shutdown: error_id == ERR_PLANT_NOT_OPERATING; blend remains APPROVED"
            - "After resume: BlendOrder.${bo}.status == BLENDING and components carry server-selected tank ids"

      - name: dispatch_requires_driver_qualified_at_current_clock
        grounds:
          - state_machines.DeliveryRoute.DRIVER_ASSIGNED_to_DISPATCHED
          - calculations.route_hazmat_coverage
          - validations[priority=8]
        distinguishing_aspect: |
          Pair DeliveryRoute x Driver via a fourth mechanism — dispatch revalidates
          the driver against the CURRENT clock (not assignment-time state), so
          advancing the clock past the medical expiry blocks dispatch with
          ERR_DRIVER_CERT_EXPIRED without any driver PATCH or cascade firing.
        test_recipe:
          setup:
            - "Driver medical 2026-08-10, NONFLAMMABLE_GAS endorsement 2027-01-01; route 2026-08-05 assigned at clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-CE4", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2026-08-10" }, as: LogisticsCoordinator, captures: { d: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "S1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /api/routes/${ro}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /api/routes/${ro}/dispatch", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRIVER_CERT_EXPIRED (medical 2026-08-10 < clock 2026-08-15 at dispatch time)"
            - "DeliveryRoute.${ro}.status remains DRIVER_ASSIGNED and Driver.${d}.status remains QUALIFIED (dispatch rejection is not a cascade)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_route_half_open_overlap
        grounds:
          - validations[priority=10]
          - entities.DeliveryRoute.fields.window_start_hour
          - entities.DeliveryRoute.fields.window_end_hour
        distinguishing_aspect: |
          Resource Driver, half-open semantics: [start, end) intervals on the same
          route_date collide only on interior overlap; adjacency (end == start) is
          allowed, and routes on different dates never collide.
        test_recipe:
          setup:
            - "Driver fully endorsed; route A 2026-08-05 08-12 DRIVER_ASSIGNED"
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-TO1", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2027-01-01" }, as: LogisticsCoordinator, captures: { d: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "A1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roA: $.data.id } }
            - { call: "POST /api/routes/${roA}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 10, window_end_hour: 14, stops: [ { stop_name: "B1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roB: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-06", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "C1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { roC: $.data.id } }
          trigger:
            - { call: "POST /api/routes/${roB}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/routes/${roC}/assign-driver", payload: { driver_id: "${d}" }, as: LogisticsCoordinator, captures: { ok_route: $.data.id } }
          assert:
            - "Same date, interior overlap 10-14 vs 08-12: error_id == ERR_DRIVER_ROUTE_OVERLAP"
            - "Different date, identical window: DeliveryRoute.${roC}.status == DRIVER_ASSIGNED (no cross-date collision)"

      - name: replenishment_gap_buffer_semantics
        grounds:
          - validations[priority=12]
          - calculations.replenishment_order_qty
          - concurrency_rules[replenishment-create-stale-installation]
        distinguishing_aspect: |
          Resource BulkInstallation, buffer-gap semantics (different from the
          half-open route windows): a new order's scheduled_delivery_at must be
          >= last delivered_at + 24h; 23:59 after is rejected, exactly 24:00 is
          accepted — adjacency in time is forbidden here, unlike driver routes.
        test_recipe:
          setup:
            - "ACTIVE installation (level 2000 / cap 5000 / max order 3000); first order delivered at 2026-08-02T08:00:00Z"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-TO2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/bulk-installations", payload: { customer_id: "${cu}", product_code: "O2", capacity_liters: 5000, initial_level_liters: 2000, reorder_point_liters: 400, max_order_qty_liters: 3000 }, as: PlantManager, captures: { inst: $.data.id } }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "INSTALLED" }, as: PlantManager }
            - { call: "POST /api/bulk-installations/${inst}/set-status", payload: { target_status: "ACTIVE" }, as: PlantManager }
            - { call: "GET /api/bulk-installations/${inst}", as: LogisticsCoordinator, captures: { iv1: $.data.version } }
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-02T08:00:00Z", expected_installation_version: "${iv1}" }, as: LogisticsCoordinator, captures: { o1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /api/replenishment-orders/${o1}/set-status", payload: { target_status: "DELIVERED" }, as: LogisticsCoordinator }
            - { call: "GET /api/bulk-installations/${inst}", as: LogisticsCoordinator, captures: { iv2: $.data.version } }
          trigger:
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-03T07:59:00Z", expected_installation_version: "${iv2}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/telemetry-readings", payload: { installation_id: "${inst}", measured_level_liters: 1000, measured_at: "2026-08-02T08:00:00Z", source: "MANUAL_DIP" }, as: LogisticsCoordinator }
            - { call: "GET /api/bulk-installations/${inst}", as: LogisticsCoordinator, captures: { iv3: $.data.version } }
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-03T08:00:00Z", expected_installation_version: "${iv3}" }, as: LogisticsCoordinator, captures: { o2: $.data.id, qty2: $.data.requested_qty_liters } }
          assert:
            - "23h59m after delivery: error_id == ERR_REPLENISHMENT_WINDOW_CONFLICT"
            - "Delivery filled the installation to 5000 (2000 + 3000); the dip reading (measured_at equal to the clock, later created_at wins the tie) drops current_level to 1000"
            - "Exactly 24h after delivery (boundary, >= allowed): ReplenishmentOrder.${o2} created with requested_qty_liters == 3000 (min(5000 - 1000, 20000, 3000)); the gap check passes and no ERR_REPLENISHMENT_WINDOW_CONFLICT is raised"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: tank_reserve_then_vent_volume_conserved
        grounds:
          - state_machines.FillLot.FILLING_to_VENTED
          - state_machines.FillLot.AWAITING_ANALYSIS_to_VENTED
          - entities.StorageTank.fields.reserved_liters
          - entities.StorageTank.fields.drawn_liters
        distinguishing_aspect: |
          Conserved quantity: tank product volume. start-fill (+reserve) paired
          with vent (-reserve) leaves current_level_liters unchanged, and
          complete-fill (+drawn) paired with vent (-drawn) also restores it —
          5000.0 liters before and after both forward/compensating pairs.
        test_recipe:
          setup:
            - "Clock default; tank level 5000; two cylinders; lot1 started then vented; lot2 started, completed, then vented"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CI1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI1-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot1: $.data.id } }
            - { call: "POST /api/fill-lots/${lot1}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot1}/vent", payload: {}, as: ProductionOperator }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { lvl_mid: $.data.current_level_liters } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot2: $.data.id } }
            - { call: "POST /api/fill-lots/${lot2}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot2}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot2}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot2}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /api/fill-lots/${lot2}/vent", payload: {}, as: ProductionOperator }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { lvl_end: $.data.current_level_liters, res_end: $.data.reserved_liters, drn_end: $.data.drawn_liters } }
          assert:
            - "After reserve+vent pair: current_level_liters == 5000.0, reserved_liters == 0, drawn_liters == 0"
            - "After reserve+complete+vent chain: current_level_liters == 5000.0 again (draw of 187.0 fully reversed)"
            - "Cylinders ${c1} and ${c2} are IN_STOCK with current_fill_lot_id == null; both lots VENTED"

      - name: ledger_post_then_equal_payment_conserved
        grounds:
          - state_machines.BillingRun.FINALIZED_to_POSTED
          - calculations.credit_hold_evaluation
          - entities.CustomerAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity: customer ledger balance (money, not volume). A
          billing post of 2831 cents followed by a payment of exactly 2831 cents
          returns outstanding_balance_cents to its pre-post value of 9000.
        test_recipe:
          setup:
            - "Customer limit 20000; rental r1 returned for 9000; rental r2 (daily 333, due 2026-08-02) accrues a 2831-cent line on the 08-01..08-10 run"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CI2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI2-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-CI2", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 20000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 10 }, as: BillingClerk, captures: { r1: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c2}", daily_rate_cents: 333, planned_days: 1 }, as: BillingClerk, captures: { r2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlantManager }
            - { call: "POST /api/rentals/${r1}/return", payload: { return_condition: "OK" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-10" }, as: BillingClerk, captures: { br: $.data.id } }
            - { call: "POST /api/billing-runs/${br}/finalize", payload: {}, as: BillingClerk }
            - { call: "GET /api/customers/${cu}", as: BillingClerk, captures: { bal_pre: $.data.outstanding_balance_cents } }
          trigger:
            - { call: "POST /api/billing-runs/${br}/post", payload: {}, as: BillingClerk }
            - { call: "POST /api/customers/${cu}/payments", payload: { amount_cents: 2831 }, as: BillingClerk, captures: { bal_post: $.data.outstanding_balance_cents } }
          assert:
            - "Pre-post outstanding == 9000; after post == 11831"
            - "After compensating payment of exactly 2831: outstanding_balance_cents == 9000 (== pre-post value)"
            - "CustomerAccount.${cu}.status remains ACTIVE throughout (11831 <= 20000)"

      - name: fleet_count_conserved_across_checkout_return
        grounds:
          - state_machines.CylinderAsset.FILLED_to_ON_RENT
          - state_machines.CylinderAsset.ON_RENT_to_IN_STOCK
          - entities.CylinderAsset.fields.status
        distinguishing_aspect: |
          Conserved quantity: active fleet count (a cardinality, not volume or
          money). checkout (FILLED -> ON_RENT) paired with return (ON_RENT ->
          IN_STOCK) leaves count(status NOT IN {LOST, RETIRED}) == 3 invariant,
          even though the per-status multiset changes.
        test_recipe:
          setup:
            - "Three registered cylinders; two FILLED via a released lot, one still IN_STOCK"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CI3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI3-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI3-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c2: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CI3-C", size_code: "SMALL", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c3: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c2}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 }, { cylinder_id: "${c2}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-CI3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
          trigger:
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 3 }, as: BillingClerk, captures: { r: $.data.id } }
            - { call: "GET /api/cylinders", as: BillingClerk }
            - { call: "POST /api/rentals/${r}/return", payload: { return_condition: "OK" }, as: BillingClerk }
            - { call: "GET /api/cylinders", as: BillingClerk }
          assert:
            - "Before checkout: 2 FILLED + 1 IN_STOCK = 3 non-terminal cylinders"
            - "While rented: 1 FILLED + 1 ON_RENT + 1 IN_STOCK = 3 (multiset changed, sum invariant)"
            - "After return: 1 FILLED + 2 IN_STOCK = 3; no cylinder entered LOST or RETIRED anywhere in the pair"
