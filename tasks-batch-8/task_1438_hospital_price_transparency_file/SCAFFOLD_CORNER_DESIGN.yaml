  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: success_envelope_shape_on_create
        claim_type: standard_crud
        grounds: [response_envelope, "endpoints: POST /transparency/payers"]
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == 'object', data carries the entity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pid: $.data.id } }
          assert:
            - "http 201; response_type == 'object'; meta.api_request_id present; meta.api_request_timestamp is ISO8601"
            - "data.id is the server-minted UUID captured as pid; data.created_at == data.updated_at; data.version == 1"

      - name: error_envelope_shape_on_failure
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Every failure wraps in the error envelope: response_type == 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /transparency/payers", payload: { name: "PA" }, as: ContractManager, captures: { err: $.data.error_id, msg: $.data.message } }
          assert: ["response_type == 'error'; data.error_id == ERR_INVALID_REQUEST; data.message is a non-empty string"]

      - name: record_list_pagination_defaults_applied
        claim_type: pagination
        grounds: [response_envelope, "endpoints: GET /transparency/standard-charge-records"]
        distinguishing_aspect: "Omitting limit/offset applies the defaults (limit 10, offset 0): two records both returned, total_count == 2, has_more == false."
        test_recipe:
          setup: ["Facility F; items SI1, SI2; cycle CY OPEN with two DRAFT records (no contracts needed for DRAFT creation)"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-P1", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si1: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70450", code_type: "CPT", description: "CT", service_class: "SHOPPABLE", gross_charge_cents: 80000 }, as: TransparencyOfficer, captures: { si2: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si1}", discounted_cash_cents: 50000 }, as: TransparencyOfficer }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si2}", discounted_cash_cents: 40000 }, as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/standard-charge-records", as: Consumer }
          assert: ["2 records returned under the default limit 10; total_count == 2; has_more == false; response_type == 'array'"]

      - name: fk_reverse_reachability_filtered_list_and_subresource
        claim_type: cross_reference_link
        grounds: ["endpoints: GET /transparency/standard-charge-records", "endpoints: GET /transparency/payers/{id}/payer-contracts", "entities.StandardChargeRecord.fields.publication_cycle_id"]
        distinguishing_aspect: "Children are findable from parents: the cycle-filtered list returns exactly the cycle's own records (not another cycle's), and the payer sub-resource lists exactly that payer's contracts."
        test_recipe:
          setup: ["Facility F; payers PA (with contract CA) and PB (no contracts); cycles CY_A and CY_B; record R_A in CY_A only"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-P2", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PB", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pb: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cya: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyb: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cya}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { ra: $.data.id } }
          trigger:
            - { call: "GET /transparency/standard-charge-records?publication_cycle_id=${cya}", as: Consumer, captures: { got_a: "$.data[0].id" } }
            - { call: "GET /transparency/standard-charge-records?publication_cycle_id=${cyb}", as: Consumer }
            - { call: "GET /transparency/payers/${pa}/payer-contracts", as: Consumer }
            - { call: "GET /transparency/payers/${pb}/payer-contracts", as: Consumer }
          assert:
            - "filter by CY_A: exactly 1 record with id == R_A"
            - "filter by CY_B: 0 records, total_count == 0"
            - "PA sub-resource: exactly 1 contract (CA); PB sub-resource: empty array"

      - name: display_computed_read_covered
        claim_type: computed_read
        grounds: ["endpoints: GET /transparency/shoppable-service-lists/{id}/display"]
        excluded_because:
          difficulty_instance: consumer_display_price_min_branch
          rationale: "Computed read correctness (package price, staleness) asserted by §1.8 instances."

