            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-CH", supported_container_types: ["PET_473", "CAN_330"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-CH1" }, as: WarehouseLead, captures: { clot1: $.data.id } }
            - { call: "POST /v1/container-lots/${clot1}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/container-lots", payload: { container_type: "CAN_330", quantity_received: 5000, supplier_lot_code: "SUP-CH2" }, as: WarehouseLead, captures: { clot2: $.data.id } }
            - { call: "POST /v1/container-lots/${clot2}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 500, unit_price_cents: 150 }, as: ProductionPlanner, captures: { ra: $.data.id, ra_v: $.data.version } }
            - { call: "POST /v1/production-runs/${ra}/confirm", payload: {}, as: ProductionPlanner, captures: { ra_v: $.data.version } }
            - { call: "POST /v1/production-runs/${ra}/schedule", payload: { batch_id: "${batch1}", line_id: "${line_id}", scheduled_start_at: "2026-08-12T08:00:00Z", scheduled_end_at: "2026-08-12T12:00:00Z", expected_production_run_version: "${ra_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "CAN_330", planned_units: 500, unit_price_cents: 150 }, as: ProductionPlanner, captures: { rb: $.data.id, rb_v: $.data.version } }
            - { call: "POST /v1/production-runs/${rb}/confirm", payload: {}, as: ProductionPlanner, captures: { rb_v: $.data.version } }
          trigger:
            - { call: "POST /v1/production-runs/${rb}/schedule", payload: { batch_id: "${batch2}", line_id: "${line_id}", scheduled_start_at: "2026-08-12T13:29:00Z", scheduled_end_at: "2026-08-12T17:29:00Z", expected_production_run_version: "${rb_v}" }, as: ProductionPlanner, captures: { err_rb: $.data.error_id } }
            - { call: "POST /v1/production-runs/${rb}/schedule", payload: { batch_id: "${batch2}", line_id: "${line_id}", scheduled_start_at: "2026-08-12T13:30:00Z", scheduled_end_at: "2026-08-12T17:30:00Z", expected_production_run_version: "${rb_v}" }, as: ProductionPlanner, captures: { rb_status: $.data.production_status } }
          assert:
            - "err_rb == ERR_LINE_WINDOW_CONFLICT, HTTP 409 (different container -> 90 min: 12:00 + 90 = 13:30 > 13:29)"
            - "rb_status == SCHEDULED at exactly 13:30 (equality to the buffered boundary allowed)"

  # ===========================================================================
  # Section: validations (claim-extraction-guide Table 4)
  # ===========================================================================
  - section: validations
    instances:
      - name: empty_user_context_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: |
          Priority-1 auth: a present-but-empty X-User-ID value is rejected with
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role,
          existence, or state check runs.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/customer-accounts", payload: { name: "HdrCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, as_user_id: "", captures: { err: $.data.error_id } }
            - { call: "POST /v1/customer-accounts", payload: { name: "HdrOk", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { ok_id: $.data.id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, HTTP 400 (empty X-User-ID)"
            - "Control call with a normal opaque PlantManager context succeeds (201, ok_id minted)"

      - name: role_denial_beats_existence_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: |
          Category pair (auth, existence): a role that is not listed on the
          endpoint gets 403 ERR_INSUFFICIENT_PERMISSIONS even when the path id
          does not exist — the authorization check (p2) fires before the 404
          existence check (p3).
        test_recipe:
          setup:
            - "Empty DB (the path id below references nothing)"
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/customer-accounts/00000000-0000-0000-0000-000000000000/approve-credit", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { err1: $.data.error_id } }
            - { call: "POST /v1/production-runs/00000000-0000-0000-0000-000000000000/confirm", payload: {}, as: BlendOperator, as_user_id: "op-1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INSUFFICIENT_PERMISSIONS, HTTP 403 — NOT ERR_CUSTOMER_NOT_FOUND (404)"
            - "err2 == ERR_INSUFFICIENT_PERMISSIONS, HTTP 403 — NOT ERR_PRODUCTION_RUN_NOT_FOUND (404)"

      - name: occ_stale_version_beats_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_FORMULA_STATE_INVALID]
        distinguishing_aspect: |
          Category pair (state OCC, state precondition): submitting a label
          review on a RETIRED formula with a stale expected version yields 412
          ERR_STALE_VERSION; the same call with the current version yields 409
          ERR_FORMULA_STATE_INVALID — the OCC check (p4) runs before the
          state-machine gate (p5).
        test_recipe:
          setup:
            - "Customer; formula retired from DRAFT (version now 2)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "OccPrio", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "OP-1", name: "Occ Prio", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/formulas/${form_id}/retire", payload: {}, as: ProductDeveloper, as_user_id: "dev-1", captures: { fret_v: $.data.version } }
          trigger:
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fret_v} - 1" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { err_stale: $.data.error_id } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${fret_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { err_state: $.data.error_id } }
          assert:
            - "err_stale == ERR_STALE_VERSION, HTTP 412 (stale expected_formula_version ${fret_v} - 1)"
            - "err_state == ERR_FORMULA_STATE_INVALID, HTTP 409 (current version -> OCC passes; RETIRED gate fires)"

      - name: payment_amount_bounds
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PAYMENT_INVALID_AMOUNT]
          - entities.CustomerAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Payment gate is 0 < amount <= outstanding: 0 and 149401 (one cent
          over the 149400 balance) are ERR_PAYMENT_INVALID_AMOUNT; exactly
          149400 succeeds and zeroes the balance; any further payment then
          fails because outstanding is 0.
        test_recipe:
          setup:
            - "ACTIVE customer; run COMPLETED so outstanding_balance_cents == 149400 (provisional invoice, no giveaway)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "PayCo", credit_limit_cents: 1000000, minimum_run_units: 500, pallet_deposit_cents: 1500 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "PY-473", name: "Pay Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id, form_v: $.data.version } }
            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-PY", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch_id}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun_id: $.data.id } }
            - { call: "POST /v1/process-runs/${prun_id}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun_id}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-PY", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-PY" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-PY", temperature_class: "AMBIENT", pallet_capacity: 50 }, as: PlantManager, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_id}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /v1/customer-accounts/${cust_id}/payments", payload: { amount_cents: 0 }, as: FinanceClerk, captures: { err_zero: $.data.error_id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/payments", payload: { amount_cents: 149401 }, as: FinanceClerk, captures: { err_over: $.data.error_id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/payments", payload: { amount_cents: 149400 }, as: FinanceClerk, captures: { out_after: $.data.outstanding_balance_cents } }
            - { call: "POST /v1/customer-accounts/${cust_id}/payments", payload: { amount_cents: 1 }, as: FinanceClerk, captures: { err_empty: $.data.error_id } }
          assert:
            - "err_zero == ERR_PAYMENT_INVALID_AMOUNT, HTTP 422 (amount must be > 0)"
            - "err_over == ERR_PAYMENT_INVALID_AMOUNT, HTTP 422 (149401 > outstanding 149400)"
            - "out_after == 0 (payment of exactly the full balance is allowed)"
            - "err_empty == ERR_PAYMENT_INVALID_AMOUNT, HTTP 422 (1 > outstanding 0)"

      - name: shipment_order_create_date_and_customer_gates
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DELIVERY_DATE_IN_PAST]
          - errors[ERR_CUSTOMER_NOT_ACTIVE]
          - entities.ShipmentOrder.fields.requested_delivery_date
        distinguishing_aspect: |
          requested_delivery_date >= current logical date is inclusive: the
          default clock date 2026-08-01 is accepted, 2026-07-31 is rejected;
          and placement for a PENDING_CREDIT customer fails with
          ERR_CUSTOMER_NOT_ACTIVE even with a valid future date.
        test_recipe:
          setup:
            - "ACTIVE customer A with DRAFT formula FA; customer B still PENDING_CREDIT with DRAFT formula FB; logical clock untouched (default 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "GateA", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_a: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_a}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_a}", formula_code: "GA-1", name: "Gate A", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_a: $.data.id } }
            - { call: "POST /v1/customer-accounts", payload: { name: "GateB", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_b: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_b}", formula_code: "GB-1", name: "Gate B", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_b: $.data.id } }
          trigger:
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_a}", formula_id: "${form_a}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-07-31", units_requested: 100 }, as: CustomerServiceRep, captures: { err_past: $.data.error_id } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_a}", formula_id: "${form_a}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-01", units_requested: 100 }, as: CustomerServiceRep, captures: { ok_today: $.data.status } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_b}", formula_id: "${form_b}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-10", units_requested: 100 }, as: CustomerServiceRep, captures: { err_cust: $.data.error_id } }
          assert:
            - "err_past == ERR_DELIVERY_DATE_IN_PAST, HTTP 422 (2026-07-31 < current logical date 2026-08-01)"
            - "ok_today == PLACED (delivery date equal to the current logical date is allowed)"
            - "err_cust == ERR_CUSTOMER_NOT_ACTIVE, HTTP 409 (PENDING_CREDIT customer cannot place orders)"

      - name: formula_customer_mismatch_on_run_and_order
        claim_type: cross_entity_validation
        grounds:
          - errors[ERR_FORMULA_CUSTOMER_MISMATCH]
          - entities.ProductionRun.fields.formula_id
        distinguishing_aspect: |
          Cross-entity FK consistency: both run creation and order creation
          reject a formula owned by a different customer with
          ERR_FORMULA_CUSTOMER_MISMATCH (422), independent of either customer's
          credit status.
        test_recipe:
          setup:
            - "Customers A and B both ACTIVE; formula owned by B"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "MmA", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_a: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_a}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/customer-accounts", payload: { name: "MmB", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_b: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_b}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_b}", formula_code: "MM-1", name: "Mismatch Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_b: $.data.id } }
          trigger:
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_a}", formula_id: "${form_b}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { err_run: $.data.error_id } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_a}", formula_id: "${form_b}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-10", units_requested: 100 }, as: CustomerServiceRep, captures: { err_ord: $.data.error_id } }
          assert:
            - "err_run == ERR_FORMULA_CUSTOMER_MISMATCH, HTTP 422 (formula.customer_id != run customer_id)"
            - "err_ord == ERR_FORMULA_CUSTOMER_MISMATCH, HTTP 422 (same rule on order placement)"

      - name: run_start_window_half_open_edges
        claim_type: boundary_edge
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_IN_PRODUCTION
          - errors[ERR_RUN_WINDOW_NOT_ACTIVE]
        distinguishing_aspect: |
          The start window is half-open [start, end): one minute before start
          fails, exactly at start succeeds, and exactly at end fails — three
          observations on two runs proving both edges.
        test_recipe:
