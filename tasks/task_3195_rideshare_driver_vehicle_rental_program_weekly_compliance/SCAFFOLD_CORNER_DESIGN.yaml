  - section: errors
    instances:
      - name: driving_record_over_six_is_ineligible
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DRIVING_RECORD_INELIGIBLE]
          - validations[priority=11]
          - calculations.driver_eligibility_score
        distinguishing_aspect: |
          A driving record of 7 points is refused at enrollment with
          ERR_DRIVING_RECORD_INELIGIBLE and status 422, a safety rule that outranks the
          activity-floor rule so the activity score never enters the decision.
        test_recipe:
          setup: ["one registered driver with driving_record_points 7 and platform_activity_score 95"]
          setup_api_calls:
            - call: "POST /program/drivers"
              payload: { full_name: "Hal Bright", email: "hal@example.com", platform_driver_id: "PLT-9B3N7WS2", platform_activity_score: 95, driving_record_points: 7, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response carries ERR_DRIVING_RECORD_INELIGIBLE with status 422, not ERR_PLATFORM_ACTIVITY_INSUFFICIENT"
            - "GET /program/enrollments for driver ${d_id} returns total_count 0"

