        distinguishing_aspect: "Each flat collection answers an unknown path id with its own entity-specific 404 code rather than a shared generic one, and the path rung fires before any role- or body-level check."
        test_recipe:
          setup: ["an empty database - no seeding is required because every read targets a well-formed but unknown id"]
          setup_api_calls: []
