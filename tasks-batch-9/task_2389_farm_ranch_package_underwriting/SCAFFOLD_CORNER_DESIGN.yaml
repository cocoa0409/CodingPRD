              as: Agent
              as_user_id: "${ag_id}"
              captures: { sh_pol_a: $.data.id, sh_pol_a_v: $.data.version }
            - call: "POST /farm-policies/${sh_pol_a}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { sh_it_a: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Shared Ops Farms B", state_code: "KS", county_name: "Reno", cat_zone_code: "ZN-1", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { sh_acct_b: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${sh_acct_b}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { sh_pol_b: $.data.id, sh_pol_b_v: $.data.version }
            - call: "POST /farm-policies/${sh_pol_b}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { sh_it_b: $.data.id }
          trigger:
            - call: "POST /farm-policies/${sh_pol_a}/rate"
              payload: { expected_policy_version: "${sh_pol_a_v}" }
              as: Underwriter
              captures: { sh_a_total: $.data.total_premium_cents }
            - call: "POST /farm-policies/${sh_pol_b}/rate"
              payload: { expected_policy_version: "${sh_pol_b_v}" }
              as: SeniorUnderwriter
              captures: { sh_b_total: $.data.total_premium_cents }
            - call: "POST /inspections"
              payload: { policy_id: "${sh_pol_a}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { sh_ins_a: $.data.id }
            - call: "POST /inspections"
              payload: { policy_id: "${sh_pol_b}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T13:00:00Z", duration_minutes: 120 }
              as: ComplianceOfficer
