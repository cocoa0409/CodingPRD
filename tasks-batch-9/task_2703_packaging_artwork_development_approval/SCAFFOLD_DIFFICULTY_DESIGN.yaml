  # ==========================================================================
  # RULE 9 - compensating_invariant
  # Two conserved ledgers with reversing operations that never rewrite the
  # original amounts: plate-order cancellation against
  # committed_plate_cost_cents, and runout disposition-reversal against
  # obsolete_units_total plus changeover_cost_committed_cents.
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: plate_order_cancellation_debits_the_committed_ledger_without_rewriting_cost
        grounds:
          - entities.ArtworkAsset.fields.committed_plate_cost_cents
          - entities.PlateOrder.fields.cost_cents
          - entities.PlateOrder.fields.auto_cancelled
          - entities.PlateOrder.fields.cancelled_at
          - state_machines.PlateOrder.ORDERED_to_CANCELLED
          - validations[priority=55]
          - errors[ERR_PLATE_ORDER_NOT_CANCELLABLE]
          - calculations.plate_order_cost
        distinguishing_aspect: |
          Cancellation is a compensating action, not a correction: cost_cents on the
          cancelled order keeps its full 163000 forever while
          ArtworkAsset.committed_plate_cost_cents is debited by exactly that amount, so
          the invariant `committed_plate_cost_cents == sum of cost_cents over ORDERED
          orders` holds after every call. The re-cancel proves the debit is not applied
          twice, and the 10-plate expedited order costing 312500 is the falsifier: it
          only fits under the 500000 budget because the cancelled 163000 was released
          (277000 + 312500 == 589500 would exceed it), so an implementation that
          rewrites cost_cents to 0, or that forgets the debit, produces a different
          HTTP status on that call rather than a merely different field value.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED; ArtworkAsset (CARTON / COATED_PAPER / US) with plate_budget_cents 500000 and committed_plate_cost_cents 0."
            - "ArtworkVersion v1 APPROVED through all three review stages."
            - "Printer 'Cascade Print Co' CERTIFIED, G7_MASTER, certified_substrates [COATED_PAPER, FILM]; one PrinterProof on v1 driven to PROOF_APPROVED (COLOR_PASS at 1.2 against tolerance 2.0, SUBSTRATE_APPROVED, press check NOT_REQUIRED)."
            - "Two ORDERED PlateOrders against that proof: order_1 with 6 plates costing 4*18000 + 2*15500 + 60000 == 163000, and order_2 with 3 plates costing 3*18000 + 60000 == 114000."
            - "committed_plate_cost_cents is therefore 277000 and 223000 of budget headroom remains - not enough for the 312500 order the trigger attempts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
