      - name: a_package_holds_one_open_round_at_a_time_and_a_resolved_round_takes_no_more_votes
        claim_type: idempotency
        grounds:
          - state_machines.DesignPackage.status
          - state_machines.ReviewRound.status
          - validations.priority_32
          - validations.priority_44
          - validations.priority_45
          - errors.ERR_ROUND_ALREADY_OPEN
          - errors.ERR_INVALID_PACKAGE_STATE
          - errors.ERR_INVALID_ROUND_STATE
          - complexity_profile.state_machine_shape.cyclic
        distinguishing_aspect: |
          Three different refusals guard the same button. Re-pressing it while a round
          is OPEN is ERR_ROUND_ALREADY_OPEN (priority 32, a uniqueness rule about the
          round set); pressing it after the package is APPROVED is
          ERR_INVALID_PACKAGE_STATE (priority 44, a rule about the package's own
          state); and a late vote into a resolved round is ERR_INVALID_ROUND_STATE
          (priority 45). The cyclic half of the claim is the one state from which
          re-pressing IS legal: REVISION_REQUESTED. The same endpoint that is a 409
          on an APPROVED package must be a 201 on a revision-requested one, and the
          new round must carry round_number 2 rather than restarting at 1.
        test_recipe:
          setup:
            - "project in SCHEMATIC with package SCHEMATIC-1 already IN_REVIEW under an OPEN round on the 3-role panel"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
          trigger:
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "AccessibilitySpecialist"], decision_deadline_at: "2026-08-25T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { g1: $.data.error_id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
              captures: { s1: $.data.status, c1: $.data.cast_vote_count }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { s2: $.data.status, c2: $.data.cast_vote_count, a2: $.data.approve_count, d2: $.data.decided_at }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
