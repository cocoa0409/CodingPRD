            - "At exactly expires_at the sweep expired 1 lot (inclusive <= boundary)"
            - "PackagedLot.${lot_id}.status == EXPIRED"

      - name: exact_tonnage_allocation_exhausts_batch
        grounds:
          - calculations.substrate_tonnage_ledger
          - state_machines.SubstrateBatch.SPAWNED_to_EXHAUSTED
          - entities.SubstrateBatch.fields.remaining_tonnage
        distinguishing_aspect: |
          Zero-quantity edge on a mass metric through a different endpoint (POST
          /api/room-cycles, not the sweep): allocating exactly the remaining 40.0 t succeeds
          (<=, not <) and leaves remaining_tonnage at exactly 0.0, which flips the batch
          SPAWNED -> EXHAUSTED automatically.
        test_recipe:
          setup:
            - "Batch b1 (40.0 t) is SPAWNED with WB1; remaining_tonnage == 40.0; room r1 fresh (version 1)"
          setup_api_calls:
