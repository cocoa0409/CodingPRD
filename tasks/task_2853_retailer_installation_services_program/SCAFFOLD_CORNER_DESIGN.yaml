              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "22 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/permit/apply"
              payload: { permit_application_reference: "PA-1001" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/permit/issue"
              payload: { permit_fee_cents: 25000, permit_issued_on: "2026-08-03T00:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /projects/${proj_id}/inspection-slot"
              payload: { inspection_slot_start: "2026-08-06T09:00:00.000Z", inspection_slot_end: "2026-08-06T17:00:00.000Z" }
              as: ProjectCoordinator
              captures: { ps1: $.data.permit_status, slot1: $.data.inspection_slot_start }
            - call: "POST /projects/${proj_id}/inspection-result"
              payload: { result: "FAILED", inspector_note: "Transition strip not fastened" }
              as: ProgramAdmin
              captures: { ps2: $.data.permit_status, ac1: $.data.inspection_attempt_count }
            - call: "POST /projects/${proj_id}/inspection-slot"
              payload: { inspection_slot_start: "2026-08-10T09:00:00.000Z", inspection_slot_end: "2026-08-10T17:00:00.000Z" }
              as: ProjectCoordinator
              captures: { ps3: $.data.permit_status }
            - call: "POST /projects/${proj_id}/inspection-result"
