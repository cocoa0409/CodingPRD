            - "the review by the sponsor -> 403 ERR_UNAUTHORIZED (a role failure, distinct from the ERR_SELF_CERTIFICATION identity failure)"
            - "the submission by the officer -> 403 ERR_UNAUTHORIZED"
            - "the closure attempt by the sponsor -> 403 ERR_UNAUTHORIZED, returned before the ERR_CAP_NOT_FOUND that the wrong id would otherwise produce"
            - "ComparativeAnalysis.${ca_id}.status is still SUBMITTED and certified_by_user_id == null"
            - "VendorDataRequest.${vr_id}.validated_submission_count == 0 and fulfillment_status == OPEN"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 0.00 (no evidence was ever admitted)"

      - name: shared_operations_work_for_every_declared_owner
        claim_type: Shared Operation Allowed
        grounds:
          - roles.PlanSponsor.shared_operations
          - roles.Administrator.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - roles.Regulator.shared_operations
        distinguishing_aspect: "Every shared write is exercised from both of its declared owners in one recipe — limitations from the sponsor and the TPA, NQTL items and parity tests from the sponsor and the officer, the clock from all four roles — and none of them 403s."
        test_recipe:
