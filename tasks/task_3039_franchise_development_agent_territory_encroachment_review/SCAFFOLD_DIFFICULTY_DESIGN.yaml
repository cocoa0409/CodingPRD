          different endpoint than close-voting): a proposed site beyond every
          store's radius yields affected_store_count == 0 and both impact figures
          == 0, and the zero-impact study still finalizes and still gates approval.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Assigned territory with one OPEN store at (40.0,-75.0); application proposed at (41.5,-76.5) — Manhattan distance 2.5 deg, far outside the 2.0-mile (0.029 deg) radius."
