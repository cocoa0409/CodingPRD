              payload: {}
              as: DistrictManager
          assert:
            - "the response is 200 with response_type array and exactly 1 element"
            - "the element's citation_id == ${cit1} and status == PROPOSED"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_inspector_engaged_isolated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INSPECTOR_ENGAGED
          - validations[priority=10]
        distinguishing_aspect: "With no imminent-danger order anywhere, the one-IN_PROGRESS-per-inspector capacity rule fires alone: starting a second reviewed inspection while the first is still in the mine answers ERR_INSPECTOR_ENGAGED."
        test_recipe:
          setup:
            - "Inspector 1 holds inspection A IN_PROGRESS; inspection B (different mine, non-overlapping planned window) is FILE_REVIEWED."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 2", mine_type: "SURFACE", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m2: $.data.id }
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m2}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-11T08:00:00Z", planned_end_at: "2026-02-11T12:00:00Z" }
              as: DistrictManager
              captures: { insp2: $.data.id }
            - call: "POST /msha/inspections/${insp2}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /msha/inspections/${insp2}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_INSPECTOR_ENGAGED"
            - "Inspection.${insp2}.status remains FILE_REVIEWED"

      - name: err_mine_not_active_on_accident_and_ido
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MINE_NOT_ACTIVE
          - validations[priority=7]
        distinguishing_aspect: "Two different operations key off Mine.status: an accident report and a manual imminent-danger order both require ACTIVE and fail ERR_MINE_NOT_ACTIVE at an IDLED mine — while inspection cycles still open there."
        test_recipe:
          setup:
            - "Mine idled before any operation."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - call: "POST /msha/mines/${m_id}/idle"
              payload: {}
              as: MSHAAdmin
          trigger:
            - call: "POST /msha/accidents"
              payload: { mine_id: "${m_id}", occurred_at: "2026-02-10T07:55:00Z", severity: "NO_LOST_TIME", description: "probe accident at idled mine" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { err_acc: $.data.error_id }
            - call: "POST /msha/imminent-danger-orders"
              payload: { mine_id: "${m_id}", hazard_description: "probe order at idled mine" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { err_ido: $.data.error_id }
          assert:
            - "the accident report answers 409 ERR_MINE_NOT_ACTIVE"
            - "the IDO issuance answers 409 ERR_MINE_NOT_ACTIVE"

      - name: err_finalize_window_active
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FINALIZE_WINDOW_ACTIVE
          - state_machines.PenaltyAssessment
        distinguishing_aspect: "Finalizing at issued_at + 15 days (window still open) fails ERR_FINALIZE_WINDOW_ACTIVE even though the assessment is PROPOSED and uncontested — the lapse precondition is checked independently."
        test_recipe:
          setup:
            - "Uncontested citation issued 2026-02-10T09:00:00Z; clock at 2026-02-25T09:00:00Z."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
