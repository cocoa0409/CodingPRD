            - { call: "POST /union-compliance/contribution-reports", payload: { production_id: "${prod_id}", period_index: 1, work_day_log_ids: [ "${l1_id}" ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { rep2_id: $.data.id } }
