      - name: program_cannot_advance_from_design_to_season_active
        claim_type: invalid_transitions
        grounds:
          - state_machines.PassProgram.transitions
          - validations[priority=40]
          - errors[ERR_INVALID_PROGRAM_TRANSITION]
          - endpoints[POST /pass-programs/{program_id}/advance-status]
        distinguishing_aspect: "SEASON_ACTIVE is reachable only from SALES_OPEN; asking for it from DESIGN is ERR_INVALID_PROGRAM_TRANSITION (409), and CLOSED is likewise unreachable from DESIGN even though CLOSED is a permitted skip from SEASON_ACTIVE."
        test_recipe:
          setup:
            - "A program in DESIGN whose BRONZE tier is already PUBLISHED, so the DESIGN → SALES_OPEN precondition is satisfied and only the transition table can reject the trigger."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
          trigger:
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == 'ERR_INVALID_PROGRAM_TRANSITION'"
            - "GET /pass-programs/${prog} → data.status == 'DESIGN' and data.version == 1 (no partial move)"
            - "the same call with target_status 'CLOSED' also returns ERR_INVALID_PROGRAM_TRANSITION"
            - "the same call with target_status 'SALES_OPEN' returns 200 with data.status == 'SALES_OPEN'"

      - name: season_pass_initial_states_on_both_dimensions
