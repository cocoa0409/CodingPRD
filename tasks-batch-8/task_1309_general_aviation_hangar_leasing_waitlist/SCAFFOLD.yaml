scenario: |
  General Aviation Hangar Leasing & Waitlist (GA airport properties office):
  hangar inventory by size/type & rate schedule, waitlist priority & offer
  acceptance window, lease with aeronautical-use requirement & subleasing
  rules, tenant insurance & environmental compliance, hangar condition &
  maintenance responsibility, non-aeronautical use audit & cure, annual rate
  escalation, eviction & abandoned aircraft

domain_name: ga-hangar-leasing
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Airport
    parent: null
    common_fields: true
    fields:
      - { name: airport_code, type: string, source: input, description: "Unique ICAO/FAA identifier (e.g. KPAO)" }
      - { name: name, type: string, source: input, description: "Airport display name" }
      - { name: escalation_pct, type: number, source: input, description: "Annual rent escalation percentage as a decimal fraction (e.g. 0.04 = 4%); applied per lease on its anniversary per escalation_policy" }
      - { name: escalation_policy, type: enum, source: input, description: "ANNIVERSARY_COMPOUND | ANNIVERSARY_SIMPLE — governs how annual escalation compounds across lease renewals; see calculation annual_rent_escalation" }
      - { name: offer_acceptance_window_hours, type: integer, source: input, description: "Hours a hangar offer remains open before auto-expiry; must be > 0" }
      - { name: cure_window_days, type: integer, source: input, description: "Days a tenant has to cure a non-aeronautical-use audit finding before eviction may be filed; must be > 0" }
      - { name: late_fee_grace_days, type: integer, source: input, description: "Days after a rent charge's due date before late fees begin accruing" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED airports reject new leases, offers, and applications" }

  - name: Hangar
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; owning airport" }
      - { name: hangar_code, type: string, source: input, description: "Tenant-facing code (e.g. T-12); unique within airport" }
      - { name: size_class, type: enum, source: input, description: "T_HANGAR | BOX | EXECUTIVE | CORPORATE — drives waitlist queue and rate schedule matching" }
      - { name: door_type, type: enum, source: input, description: "SLIDING | BIFOLD | HYDRAULIC — descriptive; does not gate operations" }
      - { name: condition_rating, type: enum, source: system, description: "GOOD | FAIR | POOR | OUT_OF_SERVICE — latest closed inspection's rating; initial GOOD" }
      - { name: posture, type: enum, source: system, description: "Compound availability posture derived from lease state + condition_rating: AVAILABLE | LEASED | MAINTENANCE_HOLD | OFFLINE. AVAILABLE iff no lease in {ACTIVE, DELINQUENT, CURE_PERIOD, EVICTION_PENDING} and condition_rating != OUT_OF_SERVICE. MAINTENANCE_HOLD iff no such lease and condition_rating == OUT_OF_SERVICE. LEASED iff such a lease exists and condition_rating != OUT_OF_SERVICE. OFFLINE iff such a lease exists and condition_rating == OUT_OF_SERVICE." }
      - { name: status, type: enum, source: system, description: "OPERATIONAL | DECOMMISSIONED — DECOMMISSIONED is terminal; hangar leaves inventory and its applications are rejected" }

  - name: RateSchedule
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; owning airport" }
      - { name: size_class, type: enum, source: input, description: "T_HANGAR | BOX | EXECUTIVE | CORPORATE — must match the hangar size class this schedule prices" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Base monthly rent in cents for the size class; must be > 0" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 UTC; schedule applies to leases whose base period starts at or after this instant" }
      - { name: effective_to, type: datetime, source: input, description: "ISO8601 UTC exclusive; may be null-equivalent sentinel only via explicit 'OPEN' string for open-ended schedules. Overlap rules in calculation rate_schedule_selection." }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — SUPERSEDED only when a newer schedule for the same airport+size_class is created with exactly the same effective_from (replacement); otherwise overlapping schedules stay ACTIVE and are resolved at selection time per rate_schedule_selection" }

  - name: WaitlistApplication
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; owning airport" }
      - { name: applicant_name, type: string, source: input, description: "Applicant legal name" }
      - { name: applicant_contact, type: string, source: input, description: "Contact email/phone" }
      - { name: size_class_requested, type: enum, source: input, description: "T_HANGAR | BOX | EXECUTIVE | CORPORATE — application competes only in this queue" }
      - { name: aircraft_n_number, type: string, source: input, description: "Tail number of the aircraft to be based; required at application time (aeronautical intent)" }
      - { name: is_based_tenant_transfer, type: boolean, source: input, description: "true if the applicant already holds any ACTIVE lease at this airport and requests an in-airport transfer; transfer applicants receive TRANSFER_PRIORITY_BONUS in waitlist priority score" }
      - { name: priority_score, type: integer, source: computed, description: "Composite waitlist ranking score; see calculation waitlist_priority_score. Higher = better rank. Ties broken by created_at ASC (older first)." }
      - { name: decline_count, type: integer, source: system, description: "Number of times this application has declined an offer; 0 at creation; the first decline returns the application to QUEUED, the second (decline_count >= 1 at decline time) moves it to REJECTED" }
      - { name: status, type: enum, source: system, description: "QUEUED | OFFERED | ACCEPTED | LEASED | WITHDRAWN | EXPIRED_OFFER | REJECTED — see WaitlistApplication state machine" }

  - name: HangarOffer
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; owning airport" }
      - { name: hangar_id, type: string, source: system, description: "FK -> Hangar.id; hangar being offered" }
      - { name: application_id, type: string, source: system, description: "FK -> WaitlistApplication.id; application receiving the offer" }
      - { name: rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; pinned schedule used to quote monthly_rate_cents at offer time (version-pinned on creation)" }
      - { name: quoted_monthly_rate_cents, type: integer, source: computed, description: "Rate copied from rate_schedule at offer creation; immutable thereafter (pin-on-approve)" }
      - { name: offer_sent_at, type: datetime, source: system, description: "Server timestamp when offer was created" }
      - { name: acceptance_deadline, type: datetime, source: computed, description: "= offer_sent_at + airport.offer_acceptance_window_hours; boundary semantics in calculation offer_window_expiry" }
      - { name: status, type: enum, source: system, description: "OPEN | ACCEPTED | DECLINED | EXPIRED | CANCELLED" }

  - name: Lease
    parent: Airport
    common_fields: true
    fields:
      - { name: airport_id, type: string, source: system, description: "FK -> Airport.id; owning airport" }
      - { name: hangar_id, type: string, source: system, description: "FK -> Hangar.id; leased hangar" }
      - { name: application_id, type: string, source: system, description: "FK -> WaitlistApplication.id; originating application (immutable)" }
      - { name: offer_id, type: string, source: system, description: "FK -> HangarOffer.id; originating offer (immutable)" }
      - { name: tenant_name, type: string, source: system, description: "Copied from WaitlistApplication.applicant_name at lease creation" }
      - { name: base_monthly_rate_cents, type: integer, source: system, description: "Copied from the offer's quoted_monthly_rate_cents at lease start; the escalation base" }
      - { name: current_monthly_rate_cents, type: integer, source: computed, description: "Result of annual_rent_escalation as of the logical clock; updated on each anniversary boundary crossing and on renewal" }
      - { name: lease_start_date, type: datetime, source: system, description: "Server timestamp at lease activation" }
      - { name: last_escalation_anniversary, type: integer, source: system, description: "Integer count of anniversaries already applied to current_monthly_rate_cents (0 at start); see annual_rent_escalation" }
      - { name: aeronautical_use_attested, type: boolean, source: input, description: "Tenant attestation at lease signing that primary use is aeronautical; must be true at creation" }
      - { name: sublease_allowed, type: boolean, source: input, description: "Whether subleasing is permitted under this lease; if false, any registered sublease request is rejected" }
      - { name: days_delinquent, type: integer, source: computed, description: "= max over the lease's OPEN/PARTIALLY_PAID RentCharges of that charge's days_overdue per late_fee_accrual (0 when no charge is past grace); drives DELINQUENT status and the delinquency eviction threshold (system constant DELINQUENCY_EVICTION_THRESHOLD_DAYS = 30)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of RentCharge.balance_cents over this lease's OPEN/PARTIALLY_PAID charges; ledger-synced on charge create, late-fee accrual, and payment" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | CURE_PERIOD | EVICTION_PENDING | EVICTED | TERMINATED — see Lease state machine" }

  - name: LeaseAircraft
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: n_number, type: string, source: input, description: "Aircraft tail number; must be unique across all ACTIVE-lease aircraft at the same airport" }
      - { name: make_model, type: string, source: input, description: "Aircraft make/model (descriptive)" }
      - { name: is_primary, type: boolean, source: input, description: "Exactly one primary aircraft per lease; the primary aircraft is the aeronautical-use anchor" }
      - { name: removed_at, type: datetime, source: system, description: "Null while based; set when the aircraft is removed from the lease" }
      - { name: status, type: enum, source: system, description: "BASED | REMOVED" }

  - name: InsuranceCertificate
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: insurer_name, type: string, source: input, description: "Insurance carrier name" }
      - { name: policy_number, type: string, source: input, description: "Policy identifier" }
      - { name: liability_coverage_cents, type: integer, source: input, description: "Liability coverage amount; must be >= MIN_LIABILITY_COVERAGE_CENTS for lease activation and to clear INSURANCE_NONCOMPLIANT posture" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage start (ISO8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage end (ISO8601 UTC, exclusive); certificate is expired when logical clock >= effective_to" }
      - { name: status, type: enum, source: system, description: "VALID | EXPIRED — VALID at creation when coverage/dates pass insurance_compliance_check; EXPIRED set by the rent_charge_overdue_scan sweep when effective_to <= sweep instant" }

  - name: EnvironmentalComplianceRecord
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: record_type, type: enum, source: input, description: "FUEL_STORAGE_PERMIT | STORMWATER_PLAN | HAZMAT_DISCLOSURE" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp of submission" }
      - { name: expires_at, type: datetime, source: input, description: "Record expiry (ISO8601 UTC, exclusive)" }
      - { name: review_note, type: string, source: system, description: "Reviewer note on approval/rejection" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED | EXPIRED — PENDING_REVIEW at submission; APPROVED/REJECTED via reviewer endpoints; EXPIRED set by the rent_charge_overdue_scan sweep when expires_at <= sweep instant" }

  - name: HangarConditionInspection
    parent: Hangar
    common_fields: true
    fields:
      - { name: hangar_id, type: string, source: system, description: "FK -> Hangar.id; inspected hangar" }
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease occupying the hangar at inspection time, null-equivalent '' when vacant" }
      - { name: inspected_at, type: datetime, source: system, description: "Server timestamp of inspection submission" }
      - { name: condition_rating, type: enum, source: input, description: "GOOD | FAIR | POOR | OUT_OF_SERVICE — inspector's rating" }
      - { name: maintenance_responsibility, type: enum, source: input, description: "TENANT | AIRPORT | SHARED — who must remediate deficiencies" }
      - { name: deficiency_note, type: string, source: input, description: "Free-text deficiency description" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — CLOSED when remediation attested; the latest CLOSED inspection's condition_rating drives Hangar.condition_rating" }

  - name: UseAuditFinding
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease under audit" }
      - { name: finding_type, type: enum, source: input, description: "NON_AERONAUTICAL_USE | UNAUTHORIZED_SUBLEASE | INSURANCE_LAPSE | ENVIRONMENTAL_LAPSE" }
      - { name: observed_at, type: datetime, source: system, description: "Server timestamp when finding was opened" }
      - { name: cure_deadline, type: datetime, source: computed, description: "= observed_at + airport.cure_window_days, computed at filing; see cure_deadline calculation" }
      - { name: cured_at, type: datetime, source: system, description: "Set when the finding is cured; null while open" }
      - { name: status, type: enum, source: system, description: "OPEN | CURED | ESCALATED_TO_EVICTION" }

  - name: EvictionCase
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease being evicted" }
      - { name: use_audit_finding_id, type: string, source: system, description: "FK -> UseAuditFinding.id; the finding that triggered eviction (may be '' for delinquency-triggered evictions)" }
      - { name: reason, type: enum, source: input, description: "UNCURED_AUDIT | DELINQUENCY | NON_AERONAUTICAL_USE" }
      - { name: filed_at, type: datetime, source: system, description: "Server timestamp when the case was filed" }
      - { name: executed_at, type: datetime, source: system, description: "Set when the eviction is executed (tenant locked out); null until EXECUTED" }
      - { name: abandoned_aircraft_storage_cents_per_day, type: integer, source: computed, description: "Daily storage accrual rate for abandoned aircraft, set at execution = ABANDONED_AIRCRAFT_DAILY_CENTS constant snapshot; see abandoned_aircraft_storage_accrual" }
      - { name: storage_days_already_billed, type: integer, source: system, description: "Cumulative whole days of abandoned-aircraft storage already billed; 0 at execution; incremented by each accrual sweep" }
      - { name: status, type: enum, source: system, description: "FILED | EXECUTED | CLOSED_AIRCRAFT_REMOVED | CLOSED_AIRCRAFT_ABANDONED" }

  - name: RentCharge
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease billed" }
      - { name: period_start, type: datetime, source: system, description: "Start of the monthly service period (ISO8601 UTC)" }
      - { name: period_end, type: datetime, source: system, description: "End of the monthly service period (ISO8601 UTC, exclusive)" }
      - { name: due_date, type: datetime, source: system, description: "Payment due date; = period_start" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Rent portion per monthly_rent_charge (pro-rated on partial first/last periods)" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late-fee portion per late_fee_accrual; 0 while inside grace window" }
      - { name: paid_cents, type: integer, source: system, description: "Cumulative payments applied to this charge via waterfall_allocation" }
      - { name: balance_cents, type: integer, source: computed, description: "= base_amount_cents + late_fee_cents - paid_cents; recomputed on every payment/fee event" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | PARTIALLY_PAID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Airport
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /airports/{id}/suspend
        actor: AirportManager
        preconditions:
          - "Airport must be ACTIVE (ERR_AIRPORT_NOT_ACTIVE)"
        side_effects:
          - "All OPEN HangarOffers at this airport → CANCELLED (compensation)"
          - "All QUEUED/OFFERED WaitlistApplications remain in place but cannot receive new offers while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /airports/{id}/resume
        actor: AirportManager
        preconditions:
          - "Airport must be SUSPENDED (ERR_AIRPORT_NOT_SUSPENDED)"
        side_effects: []

  - entity: Hangar
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: POST /hangars/{id}/decommission
        actor: AirportManager
        preconditions:
          - "No Lease on this hangar in {ACTIVE, DELINQUENT, CURE_PERIOD, EVICTION_PENDING} (ERR_HANGAR_OCCUPIED)"
          - "No OPEN HangarOffer on this hangar (ERR_OPEN_OFFER_EXISTS)"
        side_effects:
          - "All QUEUED WaitlistApplications whose size_class_requested == this hangar's size_class and which are still QUEUED remain queued; decommissioning does not cascade"
          - "Hangar.posture recomputed → removed from AVAILABLE pool"
    # posture is a compound derived field, not a stored transition state:
    # posture = f(lease states, condition_rating) recomputed on every mutation
    # of a child lease or inspection; see Hangar.posture description.

  - entity: HangarOffer
    initial_state: OPEN
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: POST /offers/{id}/accept
        actor: Applicant
        preconditions:
          - "See WaitlistApplication OFFERED→ACCEPTED (window, posture, OCC)"
        side_effects:
          - "Lease created; Application → LEASED; Hangar.version += 1"
      - from: OPEN
        to: DECLINED
        trigger: POST /offers/{id}/decline
        actor: Applicant
        preconditions:
          - "Offer must be OPEN (ERR_OFFER_NOT_OPEN)"
        side_effects:
          - "Application.decline_count += 1; application → QUEUED (count was 0) or REJECTED (count was >= 1); Hangar posture recomputed"
      - from: OPEN
        to: EXPIRED
        trigger: system (offer_window_expiry sweep when logical clock > acceptance_deadline)
        actor: system
        preconditions: []
        side_effects:
          - "Application → EXPIRED_OFFER; Hangar posture recomputed → AVAILABLE"
      - from: OPEN
        to: CANCELLED
        trigger: "system cascade (airport suspend) or POST /applications/{id}/withdraw while its application is OFFERED"
        actor: system
        preconditions: []
        side_effects:
          - "Hangar posture recomputed → AVAILABLE"

  - entity: WaitlistApplication
    initial_state: QUEUED
    terminal_states: [LEASED, WITHDRAWN, EXPIRED_OFFER, REJECTED]
    transitions:
      - from: QUEUED
        to: OFFERED
        trigger: POST /offers (creates HangarOffer for this application)
        actor: AirportManager
        preconditions:
          - "Airport must be ACTIVE (ERR_AIRPORT_NOT_ACTIVE)"
          - "Application must be QUEUED (ERR_APPLICATION_NOT_QUEUED)"
          - "Target hangar posture must be AVAILABLE (ERR_HANGAR_NOT_AVAILABLE)"
          - "Target hangar size_class must equal application.size_class_requested (ERR_SIZE_CLASS_MISMATCH)"
          - "Application must be the highest-ranked eligible QUEUED application for that size_class per waitlist_priority_score (created_at ASC tie-break) (ERR_NOT_NEXT_IN_QUEUE) — unless overridden with AirportManager override_next_in_queue=true"
        side_effects:
          - "HangarOffer created in OPEN with pinned quoted_monthly_rate_cents"
          - "Hangar.posture recomputed (hangar reserved by open offer → no longer AVAILABLE to other offers)"
      - from: OFFERED
        to: ACCEPTED
        trigger: POST /offers/{id}/accept
        actor: Applicant
        preconditions:
          - "Offer must be OPEN (ERR_OFFER_NOT_OPEN)"
          - "Logical clock must be strictly before offer.acceptance_deadline (ERR_OFFER_WINDOW_EXPIRED) — boundary: exactly at deadline rejects (>= deadline rejects on the accept path; the lazy sweep only flips the row strictly after the deadline)"
          - "Hangar posture must still be AVAILABLE-reserved-for-this-offer (ERR_HANGAR_NOT_AVAILABLE)"
        side_effects:
          - "HangarOffer → ACCEPTED"
          - "Lease created in ACTIVE with base_monthly_rate_cents = offer.quoted_monthly_rate_cents"
          - "First RentCharge pro-rated per monthly_rent_charge"
          - "Hangar.posture → LEASED"
      - from: OFFERED
        to: EXPIRED_OFFER
        trigger: system (offer_window_expiry sweep when logical clock > acceptance_deadline, strict)
        actor: system
        preconditions: []
        side_effects:
          - "HangarOffer → EXPIRED"
          - "Hangar.posture recomputed → AVAILABLE if no other lease/offer"
      - from: OFFERED
        to: QUEUED
        trigger: POST /offers/{id}/decline (applicant declines, returns to queue without penalty once)
        actor: Applicant
        preconditions:
          - "Offer must be OPEN (ERR_OFFER_NOT_OPEN)"
          - "Application must not have previously declined an offer at this airport (ERR_REPEAT_DECLINE_NOT_ALLOWED) — one free decline per application lifetime"
        side_effects:
          - "HangarOffer → DECLINED"
          - "Hangar.posture recomputed → AVAILABLE"
      - from: OFFERED
        to: REJECTED
        trigger: POST /offers/{id}/decline (second decline)
        actor: Applicant
        preconditions:
          - "Offer must be OPEN"
          - "Application has already used its one free decline (decline_count >= 1)"
        side_effects:
          - "HangarOffer → DECLINED"
          - "Application → REJECTED (removed from queue)"
          - "Hangar.posture recomputed → AVAILABLE"
      - from: ACCEPTED
        to: LEASED
        trigger: "system — atomic continuation of POST /offers/{id}/accept in the same request once the Lease row commits"
        actor: system
        preconditions: []
        side_effects:
          - "Application → LEASED once Lease row commits"
      - from: QUEUED
        to: WITHDRAWN
        trigger: POST /applications/{id}/withdraw
        actor: Applicant
        preconditions:
          - "Application must be QUEUED or OFFERED (ERR_APPLICATION_NOT_WITHDRAWABLE)"
        side_effects:
          - "If OFFERED: linked OPEN HangarOffer → CANCELLED and hangar posture recomputed"
      - from: OFFERED
        to: WITHDRAWN
        trigger: POST /applications/{id}/withdraw
        actor: Applicant
        preconditions:
          - "Application must be QUEUED or OFFERED"
        side_effects:
          - "Linked OPEN HangarOffer → CANCELLED"
          - "Hangar.posture recomputed → AVAILABLE"
      - from: QUEUED
        to: REJECTED
        trigger: POST /applications/{id}/reject
        actor: AirportManager
        preconditions:
          - "Application must be QUEUED (ERR_APPLICATION_NOT_QUEUED)"
        side_effects: []

  - entity: Lease
    initial_state: ACTIVE
    terminal_states: [EVICTED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: system (rent_charge_overdue_scan sweep when any RentCharge balance_cents > 0 and logical clock > due_date + airport.late_fee_grace_days)
        actor: system
        preconditions: []
        side_effects:
          - "Lease.days_delinquent recomputed per late_fee_accrual"
          - "Hangar.posture stays LEASED (DELINQUENT still occupies)"
      - from: DELINQUENT
        to: ACTIVE
        trigger: POST /leases/{id}/payments (full payoff of outstanding_balance_cents)
        actor: Tenant
        preconditions:
          - "Payment waterfall must zero outstanding_balance_cents (ERR_PARTIAL_CURE_NOT_ALLOWED for the status flip; partial payment still applies to charges but does not flip status)"
        side_effects:
          - "days_delinquent → 0"
      - from: ACTIVE
        to: CURE_PERIOD
        trigger: "POST /leases/{id}/audit-findings (UseAuditFinding filed by ComplianceOfficer) OR system (insurance_compliance_check sweep auto-files INSURANCE_LAPSE when a lease loses coverage and no INSURANCE_LAPSE finding is already OPEN)"
        actor: "ComplianceOfficer | system"
        preconditions:
          - "Lease must be ACTIVE or DELINQUENT (ERR_LEASE_NOT_AUDITABLE)"
          - "finding_type must be valid enum (ERR_INVALID_REQUEST)"
          - "For UNAUTHORIZED_SUBLEASE finding: lease.sublease_allowed must be false (ERR_FINDING_NOT_APPLICABLE)"
          - "System-triggered INSURANCE_LAPSE filings skip the sublease check and require only that the lease is ACTIVE or DELINQUENT"
        side_effects:
          - "UseAuditFinding created OPEN with cure_deadline = now + airport.cure_window_days"
          - "If lease was DELINQUENT it stays DELINQUENT (CURE_PERIOD only from ACTIVE; DELINQUENT+open finding keeps DELINQUENT status but finding is OPEN)"
      - from: CURE_PERIOD
        to: ACTIVE
        trigger: POST /audit-findings/{id}/cure
        actor: Tenant
        preconditions:
          - "Finding must be OPEN (ERR_FINDING_NOT_OPEN)"
          - "Logical clock must be strictly before cure_deadline (ERR_CURE_WINDOW_EXPIRED); at exactly cure_deadline the finding is no longer curable (>= rejects)"
          - "For INSURANCE_LAPSE findings: a new InsuranceCertificate in VALID status covering the current instant must exist (ERR_INSURANCE_STILL_LAPSED)"
          - "For ENVIRONMENTAL_LAPSE findings: a new EnvironmentalComplianceRecord in APPROVED status covering the current instant must exist (ERR_ENVIRONMENTAL_STILL_LAPSED)"
        side_effects:
          - "Finding → CURED with cured_at = now"
          - "If no other OPEN findings on the lease → Lease → ACTIVE"
      - from: CURE_PERIOD
        to: EVICTION_PENDING
        trigger: system (cure_deadline_expiry sweep when logical clock >= cure_deadline and finding still OPEN)
        actor: system
        preconditions: []
        side_effects:
          - "Finding → ESCALATED_TO_EVICTION"
          - "EvictionCase auto-created in FILED with reason UNCURED_AUDIT (cascade depth 2: sweep → finding → eviction case)"
      - from: DELINQUENT
        to: EVICTION_PENDING
        trigger: POST /leases/{id}/eviction-cases (manual delinquency eviction)
        actor: AirportManager
        preconditions:
          - "Lease must be DELINQUENT (ERR_LEASE_NOT_DELINQUENT)"
          - "days_delinquent must be >= DELINQUENCY_EVICTION_THRESHOLD_DAYS (fixed system constant 30) (ERR_DELINQUENCY_THRESHOLD_NOT_MET)"
        side_effects:
          - "EvictionCase created FILED with reason DELINQUENCY, use_audit_finding_id = ''"
      - from: EVICTION_PENDING
        to: EVICTED
        trigger: POST /eviction-cases/{id}/execute
        actor: AirportManager
        preconditions:
          - "Case must be FILED (ERR_CASE_NOT_FILED)"
          - "expected_lease_version must match (ERR_STALE_VERSION)"
        side_effects:
          - "EvictionCase → EXECUTED, executed_at = now, abandoned_aircraft_storage_cents_per_day snapshot"
          - "Lease → EVICTED; all LeaseAircraft stay BASED until removed (abandoned-aircraft flow)"
          - "Hangar.posture recomputed → AVAILABLE (hangar freed even though aircraft may remain — storage accrues against evicted tenant)"
          - "Increments Lease.version by 1"
      - from: EVICTED
        to: TERMINATED
        trigger: POST /leases/{id}/terminate (final close-out after aircraft disposition)
        actor: AirportManager
        preconditions:
          - "Lease must be EVICTED (ERR_LEASE_NOT_EVICTED)"
          - "All LeaseAircraft must be REMOVED, OR the request carries abandon_remaining_aircraft=true to close with aircraft abandoned (ERR_AIRCRAFT_STILL_BASED when aircraft remain and the flag is absent)"
        side_effects:
          - "EvictionCase → CLOSED_AIRCRAFT_REMOVED if all aircraft removed, else → CLOSED_AIRCRAFT_ABANDONED (remaining BASED aircraft flip to REMOVED and storage accrual stops)"
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /leases/{id}/terminate (voluntary termination)
        actor: Tenant
        preconditions:
          - "Lease must be ACTIVE (ERR_LEASE_NOT_ACTIVE)"
          - "outstanding_balance_cents must be 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "Hangar.posture recomputed → AVAILABLE"
      - from: DELINQUENT
        to: TERMINATED
        trigger: POST /leases/{id}/terminate
        actor: Tenant
        preconditions:
          - "Lease must be ACTIVE or DELINQUENT"
          - "outstanding_balance_cents must be 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "Hangar.posture recomputed → AVAILABLE"

  - entity: HangarConditionInspection
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: POST /inspections/{id}/close
        actor: AirportManager
        preconditions:
          - "Inspection must be OPEN (ERR_INSPECTION_NOT_OPEN)"
          - "If maintenance_responsibility == TENANT and condition_rating in {POOR, OUT_OF_SERVICE}, a remediation attestation note must be supplied (ERR_REMEDIATION_NOTE_REQUIRED)"
        side_effects:
          - "Hangar.condition_rating ← this inspection's condition_rating (latest CLOSED wins)"
          - "Hangar.posture recomputed (compound: lease states × new condition_rating)"

  - entity: UseAuditFinding
    initial_state: OPEN
    terminal_states: [CURED, ESCALATED_TO_EVICTION]
    transitions:
      - from: OPEN
        to: CURED
        trigger: POST /audit-findings/{id}/cure
        actor: Tenant
        preconditions:
          - "Finding must be OPEN (ERR_FINDING_NOT_OPEN)"
          - "Logical clock strictly before cure_deadline (ERR_CURE_WINDOW_EXPIRED)"
          - "Type-specific gates: INSURANCE_LAPSE needs a covering VALID certificate (ERR_INSURANCE_STILL_LAPSED); ENVIRONMENTAL_LAPSE needs a covering APPROVED record (ERR_ENVIRONMENTAL_STILL_LAPSED)"
        side_effects:
          - "cured_at = now; lease → ACTIVE if no other OPEN findings"
      - from: OPEN
        to: ESCALATED_TO_EVICTION
        trigger: system (rent_charge_overdue_scan sweep when logical clock >= cure_deadline)
        actor: system
        preconditions: []
        side_effects:
          - "EvictionCase auto-created FILED with reason UNCURED_AUDIT and use_audit_finding_id = this finding (cascade hop 2)"
          - "Lease → EVICTION_PENDING (cascade hop 3)"

  - entity: EvictionCase
    initial_state: FILED
    terminal_states: [CLOSED_AIRCRAFT_REMOVED, CLOSED_AIRCRAFT_ABANDONED]
    transitions:
      - from: FILED
        to: EXECUTED
        trigger: POST /eviction-cases/{id}/execute
        actor: AirportManager
        preconditions:
          - "Case must be FILED (ERR_CASE_NOT_FILED)"
          - "expected_lease_version must match Lease.version (ERR_STALE_VERSION)"
        side_effects:
          - "executed_at = now; abandoned_aircraft_storage_cents_per_day snapshotted; storage_days_already_billed = 0"
          - "Lease → EVICTED; Lease.version += 1; Hangar posture recomputed → AVAILABLE"
      - from: EXECUTED
        to: CLOSED_AIRCRAFT_REMOVED
        trigger: POST /leases/{id}/terminate when all LeaseAircraft are REMOVED
        actor: AirportManager
        preconditions:
          - "Lease must be EVICTED (ERR_LEASE_NOT_EVICTED)"
          - "All LeaseAircraft on the lease must be REMOVED (else ERR_AIRCRAFT_STILL_BASED)"
        side_effects:
          - "Lease → TERMINATED"
      - from: EXECUTED
        to: CLOSED_AIRCRAFT_ABANDONED
        trigger: POST /leases/{id}/terminate when at least one LeaseAircraft is still BASED and the manager attests abandonment
        actor: AirportManager
        preconditions:
          - "Lease must be EVICTED"
          - "At least one LeaseAircraft still BASED — the terminating request must carry abandon_remaining_aircraft=true (ERR_AIRCRAFT_STILL_BASED otherwise)"
        side_effects:
          - "Lease → TERMINATED; remaining BASED aircraft flip to REMOVED with removed_at = now; storage accrual stops"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-accept-stale-hangar
    parent_entity: Hangar
    write_endpoint: "POST /offers/{id}/accept"
    occ_field: expected_hangar_version
    description: |
      Accepting a hangar offer against a Hangar whose version has advanced
      since the client last observed it is rejected. Two applicants holding
      OPEN offers for the same hangar is impossible under the posture gate,
      but a second ACCEPT with a stale expected_hangar_version — e.g. sent
      after a prior accept already bumped Hangar.version and flipped posture
      — must be rejected deterministically via OCC rather than relying on
      ordering.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: eviction-execute-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /eviction-cases/{id}/execute"
    occ_field: expected_lease_version
    description: |
      Executing an eviction case against a Lease whose version has advanced
      since the client last observed it is rejected. A stale execution — for
      example after a payment cascade bumped Lease.version and flipped the
      lease back to ACTIVE — must not silently succeed against a lease the
      caller no longer has an accurate view of.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: waitlist_priority_score
    trigger: "WaitlistApplication creation; recomputed lazily whenever the queue is ranked for an offer"
    algorithm: weighted_scoring
    formula: |
      score = BASE_POINTS
            + WAIT_POINTS_PER_DAY * whole_days_queued
            + (TRANSFER_PRIORITY_BONUS if is_based_tenant_transfer else 0)
      where whole_days_queued = floor((ranking_instant - application.created_at) / 86400s)
      Ranking: sort by score DESC; ties broken by created_at ASC (older first);
      further ties impossible because created_at has millisecond precision and
      applications are created sequentially. Random id is NEVER used as tie-break.
    input_set: "All WaitlistApplications at this airport with status == QUEUED and size_class_requested == target hangar's size_class"
    constants:
      BASE_POINTS: 100
      WAIT_POINTS_PER_DAY: 1
      TRANSFER_PRIORITY_BONUS: 30
    precision: "integer score; whole-day floor, no rounding of fractions"

  - name: offer_window_expiry
    trigger: "system sweep (rent_charge_overdue_scan) and on any accept attempt"
    algorithm: threshold
    formula: |
      acceptance_deadline = offer.offer_sent_at + airport.offer_acceptance_window_hours * 3600s
      Two distinct boundary rules, deliberately asymmetric:
      (a) ACCEPT path: an accept attempt is rejected with ERR_OFFER_WINDOW_EXPIRED
          iff logical_clock >= acceptance_deadline (closed boundary: strictly-before
          is required to accept; exactly at the deadline rejects).
      (b) SWEEP path: the rent_charge_overdue_scan sweep flips an OPEN offer to
          EXPIRED iff logical_clock > acceptance_deadline (strictly-after; lazy
          expiry). At exactly the deadline the row is still OPEN in storage, so
          an accept at that instant is rejected by rule (a) with
          ERR_OFFER_WINDOW_EXPIRED, not by a state check.
    input_set: "HangarOffers in OPEN status at the swept airport"
    constants: {}
    precision: "millisecond comparison against logical clock"

  - name: monthly_rent_charge
    trigger: "Lease activation (first, pro-rated charge) and monthly billing sweep (rent_charge_overdue_scan) at each period boundary"
    algorithm: chronological
    formula: |
      Charge creation: the first charge is created at lease activation with
      period [lease_start_date, first-of-next-month). On every sweep, for each
      lease in the input set whose latest charge has period_end <= sweep_instant,
      one new charge per elapsed calendar-month boundary is created with
      period [boundary, next-boundary) and due_date = period_start, in
      chronological order (oldest period first). Charges are never created for
      periods starting after the sweep instant.
      For a full monthly period: base_amount_cents = lease.current_monthly_rate_cents
      (the rate in force at that period's start, AFTER any escalation the same
      sweep applies — escalation runs before billing within one sweep).
      For the first partial period (lease_start_date mid-month):
        days_in_month = number of days in the calendar month containing lease_start_date
        days_remaining = days_in_month - day_of_month(lease_start_date) + 1  (inclusive of start day)
        base_amount_cents = floor(current_monthly_rate_cents * days_remaining / days_in_month)
      Rounding order is pinned: pro-rate FIRST (integer floor at the daily level),
      THEN add late fees later as a separate component. Never sum-then-round.
    input_set: "Leases in {ACTIVE, DELINQUENT, CURE_PERIOD, EVICTION_PENDING} at the swept airport"
    constants: {}
    precision: "integer cents; floor division for pro-ration; round-half-up forbidden here"

  - name: annual_rent_escalation
    trigger: "rent_charge_overdue_scan sweep when logical clock crosses a lease anniversary"
    algorithm: threshold
    formula: |
      Let n = number of integers k >= 1 such that
        lease_start_date + k * 365 days <= sweep_instant   (INCLUSIVE boundary:
        an anniversary landing exactly on the sweep instant counts as elapsed;
        one millisecond before the anniversary does not).
      Let applied = lease.last_escalation_anniversary.
      For k in (applied+1 .. n), applied in ascending order:
        if airport.escalation_policy == ANNIVERSARY_COMPOUND:
          current_monthly_rate_cents = round_half_up(current_monthly_rate_cents * (1 + airport.escalation_pct))
        else:  # ANNIVERSARY_SIMPLE
          current_monthly_rate_cents = round_half_up(base_monthly_rate_cents * (1 + airport.escalation_pct * k))
      Set last_escalation_anniversary = n.
      COMPOUND composes on the running value (each anniversary multiplies the
      already-escalated rate); SIMPLE always multiplies the original base by
      (1 + pct*k), so the two variants diverge from the second anniversary onward.
    input_set: "Leases in {ACTIVE, DELINQUENT, CURE_PERIOD, EVICTION_PENDING} whose next anniversary <= sweep instant"
    constants:
      ANNIVERSARY_DAYS: 365
    precision: "integer cents; round_half_up applied once per anniversary step"
    variants:
      - name: compound
        when: "airport.escalation_policy == ANNIVERSARY_COMPOUND"
        difference: "multiplies the running current_monthly_rate_cents each anniversary; growth is exponential"
      - name: simple
        when: "airport.escalation_policy == ANNIVERSARY_SIMPLE"
        difference: "multiplies base_monthly_rate_cents by (1 + pct*k); growth is linear in k"

  - name: late_fee_accrual
    trigger: "rent_charge_overdue_scan sweep for each OPEN/PARTIALLY_PAID RentCharge past grace"
    algorithm: threshold
    formula: |
      days_overdue = max(0, floor((sweep_instant - (due_date + airport.late_fee_grace_days * 86400s)) / 86400s))
      if days_overdue <= 0: late_fee_cents unchanged (inside grace)
      else:
        daily_fee = max(LATE_FEE_FLOOR_CENTS, round_half_up(base_amount_cents * LATE_FEE_DAILY_PCT))
        accrued = daily_fee * days_overdue
        late_fee_cents = min(accrued, round_half_up(base_amount_cents * LATE_FEE_CAP_PCT))
      The cap is a percentage of THIS charge's base_amount_cents (per-charge cap),
      not of the lease balance. Boundary: at exactly due_date + grace_days the fee
      is still 0 (days_overdue == 0); the first fee day is the day AFTER grace ends.
    input_set: "RentCharges in {OPEN, PARTIALLY_PAID} at the swept airport"
    constants:
      LATE_FEE_DAILY_PCT: 0.005
      LATE_FEE_FLOOR_CENTS: 500
      LATE_FEE_CAP_PCT: 0.25
    precision: "integer cents; round_half_up for daily fee and cap; floor for day count"

  - name: cure_deadline
    trigger: "UseAuditFinding creation"
    algorithm: threshold
    formula: |
      cure_deadline = finding.observed_at + airport.cure_window_days * 86400s
      Finding is curable iff logical_clock < cure_deadline (strictly before).
      At exactly cure_deadline, cure attempts reject with ERR_CURE_WINDOW_EXPIRED
      and the escalation sweep flips the finding to ESCALATED_TO_EVICTION.
    input_set: "UseAuditFindings in OPEN status"
    constants: {}
    precision: "millisecond comparison against logical clock"

  - name: payment_waterfall
    trigger: "POST /leases/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      Payment amount is applied to the lease's RentCharges in chronological
      order (period_start ASC, then created_at ASC as tie-break). Within each
      charge, pay late_fee_cents FIRST, then base_amount_cents (fees-before-principal).
      Remainder after all charges are PAID is rejected (ERR_OVERPAYMENT) — no
      credit balance is held. Partial application to the final charge is allowed;
      the charge stays PARTIALLY_PAID.
      Rounding: integer cents throughout; no fractional allocation.
    input_set: "RentCharges for the lease in {OPEN, PARTIALLY_PAID}"
    constants: {}
    precision: "integer cents"

  - name: abandoned_aircraft_storage_accrual
    trigger: "rent_charge_overdue_scan sweep for EVICTED leases with BASED aircraft remaining"
    algorithm: aggregation
    formula: |
      For each EvictionCase in EXECUTED whose lease has any LeaseAircraft with
      status == BASED:
        days_accrued = floor((sweep_instant - case.executed_at) / 86400s) - case.storage_days_already_billed
        if days_accrued > 0:
          create a RentCharge-like storage accrual entry of
            days_accrued * case.abandoned_aircraft_storage_cents_per_day * count(BASED aircraft)
          increment case.storage_days_already_billed by days_accrued
      Per-aircraft multiplier: storage is charged PER BASED aircraft per day.
    input_set: "EvictionCases in EXECUTED at the swept airport with >= 1 BASED LeaseAircraft on the lease"
    constants:
      ABANDONED_AIRCRAFT_DAILY_CENTS: 2500
    precision: "integer cents; whole-day floor"

  - name: rate_schedule_selection
    trigger: "HangarOffer creation (pin quoted rate) and Lease renewal"
    algorithm: interval_merge
    formula: |
      Candidate schedules: RateSchedules for this airport + size_class with
      status == ACTIVE and effective_from <= offer_instant and
      (effective_to == 'OPEN' or offer_instant < effective_to).
      Half-open interval semantics: [effective_from, effective_to).
      Adjacent schedules (a.effective_to == b.effective_from) do NOT overlap —
      the instant a.effective_to belongs to b, not a (half-open).
      If two candidates both contain the instant (authoring error overlap),
      pick the one with the LATEST effective_from; tie-break by created_at ASC.
      If no candidate exists → ERR_NO_ACTIVE_RATE_SCHEDULE.
    input_set: "RateSchedules for the airport + size_class"
    constants: {}
    precision: "millisecond interval comparison"

  - name: insurance_compliance_check
    trigger: "Lease activation, rent_charge_overdue_scan sweep, and audit-finding cure for INSURANCE_LAPSE"
    algorithm: threshold
    formula: |
      A lease is insurance-compliant at instant t iff there EXISTS an
      InsuranceCertificate for the lease with status == VALID,
      effective_from <= t < effective_to (half-open), and
      liability_coverage_cents >= MIN_LIABILITY_COVERAGE_CENTS.
      On sweep, any VALID certificate with effective_to <= sweep_instant flips
      to EXPIRED; a lease with zero covering certificates is flagged with an
      INSURANCE_LAPSE UseAuditFinding if one is not already OPEN.
    input_set: "InsuranceCertificates for the lease"
    constants:
      MIN_LIABILITY_COVERAGE_CENTS: 100000000
    precision: "integer cents; millisecond interval comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right (airport → hangar/application/lease/offer → child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Airport must be ACTIVE for offers, applications, lease actions"
    error_id: ERR_AIRPORT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /applications, POST /offers, POST /offers/{id}/accept, POST /leases/{id}/payments, POST /leases/{id}/audit-findings"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for the transition (application QUEUED, offer OPEN, finding OPEN, case FILED, inspection OPEN, lease ACTIVE/DELINQUENT/EVICTED per endpoint); specific error id per resource per the state machines (ERR_APPLICATION_NOT_QUEUED, ERR_OFFER_NOT_OPEN, ERR_FINDING_NOT_OPEN, ERR_CASE_NOT_FILED, ERR_INSPECTION_NOT_OPEN, ERR_LEASE_NOT_AUDITABLE, ERR_LEASE_NOT_DELINQUENT, ERR_LEASE_NOT_EVICTED, ERR_LEASE_NOT_ACTIVE, ERR_APPLICATION_NOT_WITHDRAWABLE, ERR_AIRPORT_NOT_SUSPENDED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_temporal
    check: "Time-window checks: offer acceptance strictly before acceptance_deadline (ERR_OFFER_WINDOW_EXPIRED); cure strictly before cure_deadline (ERR_CURE_WINDOW_EXPIRED)"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /offers/{id}/accept, POST /audit-findings/{id}/cure"

  - priority: 7
    category: business_constraint
    check: "Selector/queue rule: offer must target the highest-ranked eligible QUEUED application for the hangar's size_class unless override_next_in_queue=true"
    error_id: ERR_NOT_NEXT_IN_QUEUE
    http_status: 409
    applies_to: "POST /offers"

  - priority: 8
    category: business_constraint
    check: "Hangar posture must be AVAILABLE for new offers (ERR_HANGAR_NOT_AVAILABLE); size_class must match (ERR_SIZE_CLASS_MISMATCH); hangar must be OPERATIONAL; a covering ACTIVE rate schedule must exist (ERR_NO_ACTIVE_RATE_SCHEDULE)"
    error_id: ERR_HANGAR_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /offers"

  - priority: 9
    category: business_referential
    check: "Cross-entity referential rules: n_number unique among BASED aircraft at airport (ERR_DUPLICATE_N_NUMBER); exactly one primary aircraft per lease (ERR_PRIMARY_AIRCRAFT_CONFLICT); lease.sublease_allowed gates sublease findings (ERR_FINDING_NOT_APPLICABLE); aeronautical_use_attested must be true"
    error_id: ERR_REFERENTIAL_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /leases/{id}/aircraft, POST /offers/{id}/accept, POST /leases/{id}/audit-findings"

  - priority: 10
    category: business_safety
    check: "Compliance gates: insurance coverage >= MIN_LIABILITY_COVERAGE_CENTS at lease activation (ERR_INSUFFICIENT_COVERAGE); remediation note required for TENANT-responsibility POOR/OUT_OF_SERVICE inspection close (ERR_REMEDIATION_NOTE_REQUIRED); cure gates for lapsed insurance/environmental coverage (ERR_INSURANCE_STILL_LAPSED, ERR_ENVIRONMENTAL_STILL_LAPSED)"
    error_id: ERR_COMPLIANCE_GATE
    http_status: 422
    applies_to: "POST /offers/{id}/accept, POST /inspections/{id}/close, POST /audit-findings/{id}/cure"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gates: outstanding_balance_cents == 0 for voluntary termination (ERR_OUTSTANDING_BALANCE); payment must not exceed total outstanding (ERR_OVERPAYMENT); delinquency threshold for eviction filing (ERR_DELINQUENCY_THRESHOLD_NOT_MET); DELINQUENT status flip requires full payoff (ERR_PARTIAL_CURE_NOT_ALLOWED is informational — a partial payment still applies to charges without flipping status)"
    error_id: ERR_FISCAL_GATE
    http_status: 402
    applies_to: "POST /leases/{id}/terminate, POST /leases/{id}/payments, POST /leases/{id}/eviction-cases"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock (default time fixed by scaffold contract) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [AirportManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Runs rent_charge_overdue_scan sweep at the new instant: offer_window_expiry, annual_rent_escalation, late_fee_accrual, insurance_compliance_check, abandoned_aircraft_storage_accrual, cure_deadline escalation, monthly_rent_charge billing"

  # --- Airport ---
  - method: POST
    path: "/airports"
    description: "Create an airport"
    roles: [AirportManager]
    code: 201
    input: [airport_code, name, escalation_pct, escalation_policy, offer_acceptance_window_hours, cure_window_days, late_fee_grace_days]
    output: Airport
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/airports"
    description: "List airports"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "Airport[]"
    side_effects: []

  - method: GET
    path: "/airports/{id}"
    description: "Get an airport"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: Airport
    side_effects: []

  - method: POST
    path: "/airports/{id}/suspend"
    description: "Suspend an airport (cancels open offers)"
    roles: [AirportManager]
    code: 200
    input: []
    output: Airport
    side_effects: ["status → SUSPENDED; OPEN HangarOffers → CANCELLED"]

  - method: POST
    path: "/airports/{id}/resume"
    description: "Resume a suspended airport"
    roles: [AirportManager]
    code: 200
    input: []
    output: Airport
    side_effects: ["status → ACTIVE"]

  - method: GET
    path: "/airports/{id}/hangars"
    description: "List hangars of an airport (sub-resource reverse-reachability)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["size_class?", "posture?", "limit?", "offset?"]
    output: "Hangar[]"
    side_effects: []

  # --- RateSchedule ---
  - method: POST
    path: "/rate-schedules"
    description: "Create a rate schedule for a size class at an airport"
    roles: [AirportManager]
    code: 201
    input: [airport_id, size_class, monthly_rate_cents, effective_from, effective_to]
    output: RateSchedule
    side_effects: ["prior schedule for same airport+size_class with identical effective_from → SUPERSEDED; overlapping non-identical schedules remain ACTIVE and are resolved per rate_schedule_selection"]

  - method: GET
    path: "/rate-schedules"
    description: "List rate schedules (filtered)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["airport_id?", "size_class?", "limit?", "offset?"]
    output: "RateSchedule[]"
    side_effects: []

  - method: GET
    path: "/rate-schedules/{id}"
    description: "Get a rate schedule"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []

  # --- Hangar ---
  - method: POST
    path: "/hangars"
    description: "Add a hangar to an airport's inventory"
    roles: [AirportManager]
    code: 201
    input: [airport_id, hangar_code, size_class, door_type]
    output: Hangar
    side_effects: ["condition_rating = GOOD; posture = AVAILABLE; status = OPERATIONAL"]

  - method: GET
    path: "/hangars"
    description: "List hangars (filtered)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["airport_id?", "size_class?", "posture?", "limit?", "offset?"]
    output: "Hangar[]"
    side_effects: []

  - method: GET
    path: "/hangars/{id}"
    description: "Get a hangar"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: Hangar
    side_effects: []

  - method: POST
    path: "/hangars/{id}/decommission"
    description: "Decommission a hangar"
    roles: [AirportManager]
    code: 200
    input: []
    output: Hangar
    side_effects: ["status → DECOMMISSIONED; posture removed from pool"]

  # --- WaitlistApplication ---
  - method: POST
    path: "/applications"
    description: "Submit a waitlist application"
    roles: [Applicant]
    code: 201
    input: [airport_id, applicant_name, applicant_contact, size_class_requested, aircraft_n_number, is_based_tenant_transfer]
    output: WaitlistApplication
    side_effects: ["status = QUEUED; priority_score computed; decline_count = 0"]

  - method: GET
    path: "/applications"
    description: "List waitlist applications (filtered)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["airport_id?", "size_class_requested?", "status?", "limit?", "offset?"]
    output: "WaitlistApplication[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: WaitlistApplication
    side_effects: []

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application"
    roles: [Applicant]
    code: 200
    input: []
    output: WaitlistApplication
    side_effects: ["status → WITHDRAWN; linked OPEN offer → CANCELLED"]

  - method: POST
    path: "/applications/{id}/reject"
    description: "Reject an application (manager)"
    roles: [AirportManager]
    code: 200
    input: []
    output: WaitlistApplication
    side_effects: ["status → REJECTED"]

  # --- HangarOffer ---
  - method: POST
    path: "/offers"
    description: "Extend a hangar offer to the next eligible applicant"
    roles: [AirportManager]
    code: 201
    input: [airport_id, hangar_id, application_id, "override_next_in_queue?"]
    output: HangarOffer
    side_effects:
      - "Application → OFFERED; offer OPEN with acceptance_deadline = now + airport.offer_acceptance_window_hours"
      - "quoted_monthly_rate_cents pinned from selected RateSchedule"
      - "Hangar posture reserved (no other offers while OPEN); Hangar.version NOT incremented by offer creation"

  - method: GET
    path: "/offers"
    description: "List offers (filtered)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["airport_id?", "hangar_id?", "application_id?", "rate_schedule_id?", "status?", "limit?", "offset?"]
    output: "HangarOffer[]"
    side_effects: []

  - method: GET
    path: "/offers/{id}"
    description: "Get an offer"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: HangarOffer
    side_effects: []

  - method: POST
    path: "/offers/{id}/accept"
    description: "Applicant accepts an offer; creates the lease"
    roles: [Applicant]
    code: 201
    input: [expected_hangar_version, aeronautical_use_attested, sublease_allowed, insurance_policy_number, insurance_insurer_name, insurance_liability_coverage_cents, insurance_effective_from, insurance_effective_to, aircraft_n_number, aircraft_make_model]
    output: Lease
    side_effects:
      - "Offer → ACCEPTED; Application → LEASED"
      - "Lease created ACTIVE; base_monthly_rate_cents = offer.quoted_monthly_rate_cents"
      - "First RentCharge created pro-rated per monthly_rent_charge"
      - "InsuranceCertificate created VALID (validated per insurance_compliance_check)"
      - "LeaseAircraft created BASED as primary"
      - "Hangar.posture → LEASED; Hangar.version incremented by 1 (OCC)"

  - method: POST
    path: "/offers/{id}/decline"
    description: "Applicant declines an offer"
    roles: [Applicant]
    code: 200
    input: []
    output: HangarOffer
    side_effects: ["Offer → DECLINED; application decline_count += 1; application → QUEUED (first decline) or REJECTED (repeat decline); hangar posture recomputed"]

  # --- Lease ---
  - method: GET
    path: "/leases"
    description: "List leases (filtered)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["airport_id?", "hangar_id?", "application_id?", "offer_id?", "status?", "limit?", "offset?"]
    output: "Lease[]"
    side_effects: []

  - method: GET
    path: "/leases/{id}"
    description: "Get a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: POST
    path: "/leases/{id}/payments"
    description: "Tenant makes a payment; waterfall allocation across open charges"
    roles: [Tenant]
    code: 200
    input: [amount_cents]
    output: Lease
    side_effects: ["payment_waterfall applied; RentCharge statuses updated; outstanding_balance_cents recomputed; Lease.version incremented; DELINQUENT → ACTIVE if zeroed"]

  - method: POST
    path: "/leases/{id}/terminate"
    description: "Terminate a lease (voluntary by tenant when ACTIVE/DELINQUENT with zero balance; manager close-out when EVICTED)"
    roles: [Tenant, AirportManager]
    code: 200
    input: ["abandon_remaining_aircraft?"]
    output: Lease
    side_effects: ["Lease → TERMINATED; EvictionCase closed if present; hangar posture recomputed"]

  # --- LeaseAircraft ---
  - method: POST
    path: "/leases/{id}/aircraft"
    description: "Add an aircraft to a lease"
    roles: [Tenant]
    code: 201
    input: [n_number, make_model, is_primary]
    output: LeaseAircraft
    side_effects: ["n_number uniqueness enforced among BASED aircraft at airport; single-primary invariant"]

  - method: GET
    path: "/leases/{id}/aircraft"
    description: "List aircraft on a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "LeaseAircraft[]"
    side_effects: []

  - method: POST
    path: "/aircraft/{id}/remove"
    description: "Remove an aircraft from its lease (abandoned-aircraft flow after eviction)"
    roles: [Tenant, AirportManager]
    code: 200
    input: []
    output: LeaseAircraft
    side_effects: ["status → REMOVED, removed_at = now; storage accrual stops for this aircraft"]

  # --- InsuranceCertificate ---
  - method: POST
    path: "/leases/{id}/insurance-certificates"
    description: "Submit a new insurance certificate"
    roles: [Tenant]
    code: 201
    input: [insurer_name, policy_number, liability_coverage_cents, effective_from, effective_to]
    output: InsuranceCertificate
    side_effects: ["status = VALID if coverage and dates valid"]

  - method: GET
    path: "/leases/{id}/insurance-certificates"
    description: "List insurance certificates for a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsuranceCertificate[]"
    side_effects: []

  # --- EnvironmentalComplianceRecord ---
  - method: POST
    path: "/leases/{id}/environmental-records"
    description: "Submit an environmental compliance record"
    roles: [Tenant]
    code: 201
    input: [record_type, expires_at]
    output: EnvironmentalComplianceRecord
    side_effects: ["status = PENDING_REVIEW"]

  - method: GET
    path: "/leases/{id}/environmental-records"
    description: "List environmental records for a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "EnvironmentalComplianceRecord[]"
    side_effects: []

  - method: POST
    path: "/environmental-records/{id}/approve"
    description: "Approve an environmental record"
    roles: [ComplianceOfficer]
    code: 200
    input: [review_note]
    output: EnvironmentalComplianceRecord
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/environmental-records/{id}/reject"
    description: "Reject an environmental record"
    roles: [ComplianceOfficer]
    code: 200
    input: [review_note]
    output: EnvironmentalComplianceRecord
    side_effects: ["status → REJECTED"]

  # --- HangarConditionInspection ---
  - method: POST
    path: "/hangars/{id}/inspections"
    description: "Open a condition inspection"
    roles: [AirportManager, ComplianceOfficer]
    code: 201
    input: [condition_rating, maintenance_responsibility, deficiency_note]
    output: HangarConditionInspection
    side_effects: ["status = OPEN; lease_id bound to occupying lease if any"]

  - method: GET
    path: "/hangars/{id}/inspections"
    description: "List inspections for a hangar"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "HangarConditionInspection[]"
    side_effects: []

  - method: GET
    path: "/leases/{id}/inspections"
    description: "List inspections bound to a lease (reverse reachability for HangarConditionInspection.lease_id)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "HangarConditionInspection[]"
    side_effects: []

  - method: POST
    path: "/inspections/{id}/close"
    description: "Close an inspection; applies condition rating to hangar"
    roles: [AirportManager]
    code: 200
    input: ["remediation_note?"]
    output: HangarConditionInspection
    side_effects: ["status → CLOSED; Hangar.condition_rating updated; Hangar.version incremented; posture recomputed"]

  # --- UseAuditFinding ---
  - method: POST
    path: "/leases/{id}/audit-findings"
    description: "File a non-aeronautical-use / compliance audit finding"
    roles: [ComplianceOfficer]
    code: 201
    input: [finding_type]
    output: UseAuditFinding
    side_effects: ["status = OPEN; cure_deadline computed; Lease ACTIVE → CURE_PERIOD"]

  - method: GET
    path: "/leases/{id}/audit-findings"
    description: "List audit findings for a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "UseAuditFinding[]"
    side_effects: []

  - method: GET
    path: "/audit-findings/{id}"
    description: "Get an audit finding"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: UseAuditFinding
    side_effects: []

  - method: POST
    path: "/audit-findings/{id}/cure"
    description: "Tenant cures a finding before its deadline"
    roles: [Tenant]
    code: 200
    input: []
    output: UseAuditFinding
    side_effects: ["Finding → CURED; lease → ACTIVE if no other OPEN findings"]

  # --- EvictionCase ---
  - method: POST
    path: "/leases/{id}/eviction-cases"
    description: "File an eviction case (delinquency)"
    roles: [AirportManager]
    code: 201
    input: [reason]
    output: EvictionCase
    side_effects: ["Case FILED; Lease → EVICTION_PENDING; Lease.version incremented"]

  - method: GET
    path: "/leases/{id}/eviction-cases"
    description: "List eviction cases for a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["limit?", "offset?"]
    output: "EvictionCase[]"
    side_effects: []

  - method: GET
    path: "/eviction-cases"
    description: "List eviction cases (filtered; reverse reachability for EvictionCase.use_audit_finding_id)"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["use_audit_finding_id?", "lease_id?", "limit?", "offset?"]
    output: "EvictionCase[]"
    side_effects: []

  - method: GET
    path: "/eviction-cases/{id}"
    description: "Get an eviction case"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: EvictionCase
    side_effects: []

  - method: POST
    path: "/eviction-cases/{id}/execute"
    description: "Execute an eviction (OCC on lease version)"
    roles: [AirportManager]
    code: 200
    input: [expected_lease_version]
    output: EvictionCase
    side_effects: ["Case → EXECUTED; Lease → EVICTED; Lease.version incremented by 1; hangar posture recomputed; storage accrual begins"]

  # --- RentCharge ---
  - method: GET
    path: "/leases/{id}/rent-charges"
    description: "List rent charges for a lease"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RentCharge[]"
    side_effects: []

  - method: GET
    path: "/rent-charges/{id}"
    description: "Get a rent charge"
    roles: [AirportManager, ComplianceOfficer, Applicant, Tenant]
    code: 200
    input: []
    output: RentCharge
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum, or malformed payload" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path resource does not exist" }
  - { id: ERR_AIRPORT_NOT_ACTIVE, http: 409, condition: "Operation requires airport ACTIVE; airport is SUSPENDED" }
  - { id: ERR_AIRPORT_NOT_SUSPENDED, http: 409, condition: "Resume requires airport SUSPENDED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for a transition" }
  - { id: ERR_APPLICATION_NOT_QUEUED, http: 409, condition: "Application must be QUEUED for this operation" }
  - { id: ERR_APPLICATION_NOT_WITHDRAWABLE, http: 409, condition: "Application must be QUEUED or OFFERED to withdraw" }
  - { id: ERR_OFFER_NOT_OPEN, http: 409, condition: "Offer must be OPEN for accept/decline" }
  - { id: ERR_OFFER_WINDOW_EXPIRED, http: 409, condition: "Logical clock >= acceptance_deadline at accept time (boundary-inclusive expiry)" }
  - { id: ERR_CURE_WINDOW_EXPIRED, http: 409, condition: "Logical clock >= cure_deadline at cure time (boundary-inclusive expiry)" }
  - { id: ERR_NOT_NEXT_IN_QUEUE, http: 409, condition: "Application is not the highest-ranked eligible QUEUED application for the size class and override not set" }
  - { id: ERR_HANGAR_NOT_AVAILABLE, http: 409, condition: "Hangar posture is not AVAILABLE (leased, reserved, maintenance hold, offline, or decommissioned)" }
  - { id: ERR_SIZE_CLASS_MISMATCH, http: 409, condition: "Hangar size_class does not match application.size_class_requested" }
  - { id: ERR_NO_ACTIVE_RATE_SCHEDULE, http: 409, condition: "No ACTIVE RateSchedule covers the offer instant for this airport+size_class" }
  - { id: ERR_REPEAT_DECLINE_NOT_ALLOWED, http: 409, condition: "Application has already used its one free decline; second decline forces REJECTED" }
  - { id: ERR_HANGAR_OCCUPIED, http: 409, condition: "Decommission blocked: an active-phase lease occupies the hangar" }
  - { id: ERR_OPEN_OFFER_EXISTS, http: 409, condition: "Decommission blocked: an OPEN offer exists on the hangar" }
  - { id: ERR_LEASE_NOT_AUDITABLE, http: 409, condition: "Audit finding requires lease ACTIVE or DELINQUENT" }
  - { id: ERR_FINDING_NOT_APPLICABLE, http: 422, condition: "Finding type inconsistent with lease config (e.g. UNAUTHORIZED_SUBLEASE on a sublease-allowed lease)" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "Cure requires finding OPEN" }
  - { id: ERR_INSURANCE_STILL_LAPSED, http: 422, condition: "INSURANCE_LAPSE cure attempted without a covering VALID certificate" }
  - { id: ERR_ENVIRONMENTAL_STILL_LAPSED, http: 422, condition: "ENVIRONMENTAL_LAPSE cure attempted without an APPROVED covering record" }
  - { id: ERR_LEASE_NOT_DELINQUENT, http: 409, condition: "Delinquency eviction filing requires lease DELINQUENT" }
  - { id: ERR_DELINQUENCY_THRESHOLD_NOT_MET, http: 402, condition: "days_delinquent below eviction threshold" }
  - { id: ERR_CASE_NOT_FILED, http: 409, condition: "Eviction execute requires case FILED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent's current version" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Operation requires lease ACTIVE" }
  - { id: ERR_LEASE_NOT_EVICTED, http: 409, condition: "Manager close-out requires lease EVICTED" }
  - { id: ERR_AIRCRAFT_STILL_BASED, http: 409, condition: "Termination blocked: aircraft still BASED and case not abandoned-closed" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Voluntary termination requires outstanding_balance_cents == 0" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "Payment exceeds total outstanding balance across open charges" }
  - { id: ERR_PARTIAL_CURE_NOT_ALLOWED, http: 402, condition: "Payment on a DELINQUENT lease that does not zero the balance leaves status DELINQUENT" }
  - { id: ERR_DUPLICATE_N_NUMBER, http: 422, condition: "n_number already BASED on another ACTIVE-phase lease at this airport" }
  - { id: ERR_PRIMARY_AIRCRAFT_CONFLICT, http: 422, condition: "Lease already has a primary aircraft; new primary requires removing the old one first" }
  - { id: ERR_INSUFFICIENT_COVERAGE, http: 422, condition: "liability_coverage_cents below MIN_LIABILITY_COVERAGE_CENTS at lease activation" }
  - { id: ERR_REMEDIATION_NOTE_REQUIRED, http: 422, condition: "Closing a TENANT-responsibility POOR/OUT_OF_SERVICE inspection requires a remediation note" }
  - { id: ERR_INSPECTION_NOT_OPEN, http: 409, condition: "Close requires inspection OPEN" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AirportManager
    description: "Airport properties office manager; administers inventory, offers, evictions, inspections"
    identity: opaque
    exclusive_operations:
      - "POST /airports and all airport admin actions (suspend/resume)"
      - "POST /rate-schedules"
      - "POST /hangars and POST /hangars/{id}/decommission"
      - "POST /offers"
      - "POST /applications/{id}/reject"
      - "POST /leases/{id}/eviction-cases and POST /eviction-cases/{id}/execute"
      - "POST /inspections/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /hangars/{id}/inspections (with ComplianceOfficer)"
      - "POST /aircraft/{id}/remove (with Tenant)"
      - "POST /leases/{id}/terminate (with Tenant)"

  - name: ComplianceOfficer
    description: "Airport compliance/audit officer; files findings, reviews environmental records"
    identity: opaque
    exclusive_operations:
      - "POST /leases/{id}/audit-findings"
      - "POST /environmental-records/{id}/approve"
      - "POST /environmental-records/{id}/reject"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /hangars/{id}/inspections (with AirportManager)"

  - name: Applicant
    description: "Prospective tenant on the waitlist"
    identity: entity_backed:WaitlistApplication
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/withdraw"
      - "POST /offers/{id}/accept"
      - "POST /offers/{id}/decline"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: Tenant
    description: "Active leaseholder"
    identity: entity_backed:Lease
    exclusive_operations:
      - "POST /leases/{id}/payments"
      - "POST /leases/{id}/aircraft"
      - "POST /leases/{id}/insurance-certificates"
      - "POST /leases/{id}/environmental-records"
      - "POST /audit-findings/{id}/cure"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /aircraft/{id}/remove (with AirportManager)"
      - "POST /leases/{id}/terminate (with AirportManager)"
