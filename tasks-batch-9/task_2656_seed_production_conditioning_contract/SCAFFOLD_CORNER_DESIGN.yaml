        excluded_because:
          difficulty_instance: non_linear_state_machine / contract_rogueing_cycle_returns_to_planted
          rationale: "The named difficulty instance drives the full PLANTED -> ROGUEING_REQUIRED -> ROGUEING_DECLARED -> ROGUEING_VERIFIED -> PLANTED loop and asserts the rogueing_rounds_used termination counter."

      - name: seed_lot_parallel_dimensions_move_independently
        claim_type: parallel
        grounds: [state_machines.SeedLot.certification_status_UNSAMPLED_to_SAMPLED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / seed_lot_parallel_axes_independence
          rationale: "The named difficulty instance asserts BAGGED x SAMPLED and that neither axis perturbs the other."

      - name: inspection_fork_branch_coverage
        claim_type: branching
        grounds: [state_machines.FieldInspection.RECORDED_fork]
        excluded_because:
          difficulty_instance: non_linear_state_machine / inspection_fork_three_outcome_branches
          rationale: "All three fork branches (PASSED, ROGUEING_ORDERED, FAILED) are driven and asserted there."

      - name: sample_fail_cascades_down_to_tags_and_settlement
        claim_type: cascade_down
        grounds: [state_machines.SeedLot.certification_status_SAMPLED_to_FAILED]
        excluded_because:
          difficulty_instance: transitive_cascade / sample_fail_cascade_voids_tags_and_supersedes_settlement
          rationale: "The five-hop cascade including tag voiding and settlement supersession is asserted hop by hop there."

