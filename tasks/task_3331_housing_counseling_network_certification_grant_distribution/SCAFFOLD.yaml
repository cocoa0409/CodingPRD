scenario: "Housing Counseling Network Certification & Grant Distribution (NeighborWorks America): network member organization chartering with organizational assessment on governance, finance and program capacity, training institute course delivery and certification for counselors and practitioners with continuing requirements, grant allocation to network members through formula and competitive components with match requirements, program area coverage across homeownership counseling, rental services and community development with outcome reporting, financial capability and foreclosure prevention program standards with client file review, expenditure compliance monitoring and audit of subgrantee spending, network member performance review with corrective action or charter revocation, data collection on households served for congressional reporting"
domain_name: "housing-counseling-network"
api_prefix: "/housing-network"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: NetworkMember
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the applicant organization"
        constraints: "required, non-empty, unique across all NetworkMember rows"
      - name: ein
        type: string
        source: input
        description: "Employer Identification Number, 9-digit string"
        constraints: "required, matches ^[0-9]{9}$, unique"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the principal office"
        constraints: "required, uppercase A-Z x2"
      - name: charter_status
        type: enum
        source: system
        description: "Chartering lifecycle state of the member organization"
        constraints: "APPLICANT | UNDER_ASSESSMENT | PROVISIONAL | CHARTERED | PROBATION | REVOKED; initial APPLICANT"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived aggregate posture gating child operations, recomputed from open findings, failed reviews and audit escalations"
        constraints: "CLEAR | WATCH | RESTRICTED | FROZEN"
      - name: service_regions
        type: array
        source: input
        description: "List of county FIPS codes the member proposes to serve"
        constraints: "required, 1..50 items, each ^[0-9]{5}$"
      - name: chartered_at
        type: datetime
        source: system
        description: "Timestamp when charter_status first reached CHARTERED; null until then"
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason recorded on charter revocation"
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of FileReview findings with status OPEN plus ComplianceAudits in FINDINGS_ISSUED linked to this member"
        default: 0
      - name: failed_review_flag
        type: boolean
        source: computed
        description: "True when the member has any PerformanceReview in CORRECTIVE_ACTION or a ClientFile failure rate above the threshold"
        default: false

  - name: OrganizationalAssessment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> NetworkMember.id; the organization under assessment"
      - name: governance_score
        type: integer
        source: input
        description: "Assessor-awarded governance dimension score"
        constraints: "integer 0..100"
      - name: finance_score
        type: integer
        source: input
        description: "Assessor-awarded finance dimension score"
        constraints: "integer 0..100"
      - name: program_capacity_score
        type: integer
        source: input
        description: "Assessor-awarded program capacity dimension score"
        constraints: "integer 0..100"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted composite per calculation assessment_composite"
      - name: provisional_rating
        type: enum
        source: computed
        description: "Rating derived from provisional variant of assessment_composite"
        constraints: "STRONG | ADEQUATE | MARGINAL | DEFICIENT"
      - name: final_rating
        type: enum
        source: computed
        description: "Rating derived from final variant of assessment_composite; null until adjudication"
        constraints: "STRONG | ADEQUATE | MARGINAL | DEFICIENT | null"
      - name: assessment_status
        type: enum
        source: system
        description: "Assessment workflow state"
        constraints: "DRAFT | SUBMITTED | SCORED | ADJUDICATED | WITHDRAWN"
      - name: assessor_id
        type: string
        source: system
        description: "X-User-ID of the Assessor who submitted scores; recorded for segregation-of-duties"

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> NetworkMember.id; employing member organization"
      - name: full_name
        type: string
        source: input
        description: "Counselor legal name"
        constraints: "required, non-empty"
      - name: email
        type: string
        source: input
        description: "Contact email"
        constraints: "required, unique"
      - name: counselor_status
        type: enum
        source: system
        description: "Employment/enrollment lifecycle"
        constraints: "ACTIVE | SUSPENDED | SEPARATED; initial ACTIVE"
      - name: ce_credits_accumulated
        type: integer
        source: computed
        description: "Continuing-education credits accumulated in the current CE window from COMPLETED enrollments of CE-eligible courses"
        default: 0
      - name: ce_window_end
        type: datetime
        source: system
        description: "End of the counselor's current continuing-education window: created_at + CE_WINDOW_MONTHS (24) months"

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: "Catalog code"
        constraints: "required, unique, ^[A-Z]{2,4}-[0-9]{3}$"
      - name: title
        type: string
        source: input
        description: "Course title"
      - name: program_area
        type: enum
        source: input
        description: "Program area this course certifies toward"
        constraints: "HOMEOWNERSHIP | RENTAL | COMMUNITY_DEVELOPMENT | FINANCIAL_CAPABILITY | FORECLOSURE_PREVENTION"
      - name: capacity
        type: integer
        source: input
        description: "Maximum seats; seat occupation uses half-open interval semantics on the delivery window"
        constraints: "integer 1..500"
      - name: ce_eligible
        type: boolean
        source: input
        description: "Whether completion awards continuing-education credits"
        default: false
      - name: ce_credits
        type: integer
        source: input
        description: "CE credits awarded on completion when ce_eligible"
        default: 0
        constraints: "integer 0..60"
      - name: delivery_start
        type: datetime
        source: input
        description: "Delivery window start (inclusive)"
      - name: delivery_end
        type: datetime
        source: input
        description: "Delivery window end (exclusive); must be strictly after delivery_start"
      - name: prerequisite_course_id
        type: string
        source: input
        description: "FK -> Course.id; self-referential prerequisite; null when none"
      - name: course_status
        type: enum
        source: system
        description: "Course lifecycle"
        constraints: "SCHEDULED | IN_SESSION | CONCLUDED | CANCELLED; initial SCHEDULED"
      - name: seats_taken
        type: integer
        source: computed
        description: "Count of Enrollments in REGISTERED or COMPLETED for this course"
        default: 0

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id"
      - name: counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id"
      - name: enrollment_status
        type: enum
        source: system
        description: "Enrollment lifecycle"
        constraints: "REGISTERED | COMPLETED | FAILED | WITHDRAWN; initial REGISTERED"
      - name: score
        type: integer
        source: input
        description: "Final score 0..100 recorded at completion grading; null until graded"
      - name: pass_threshold
        type: integer
        source: system
        description: "Pass mark in force at grading time; snapshot of the course policy constant"
        default: 70

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id; holder of the credential"
      - name: program_area
        type: enum
        source: input
        description: "Program area of the credential"
        constraints: "HOMEOWNERSHIP | RENTAL | COMMUNITY_DEVELOPMENT | FINANCIAL_CAPABILITY | FORECLOSURE_PREVENTION"
      - name: certification_status
        type: enum
        source: system
        description: "Credential lifecycle; cyclic CERTIFIED -> LAPSED -> CERTIFIED reinstatement loop"
        constraints: "CANDIDATE | CERTIFIED | LAPSED | EXPIRED | REVOKED; initial CANDIDATE"
      - name: certified_at
        type: datetime
        source: system
        description: "Timestamp of most recent transition into CERTIFIED"
      - name: lapse_deadline
        type: datetime
        source: system
        description: "CE compliance deadline; certified_at + CE_WINDOW_MONTHS (24) months"
      - name: continuing_requirement_met
        type: boolean
        source: computed
        description: "True when holder's ce_credits_accumulated >= CE_REQUIRED_CREDITS (30) at evaluation time"
        default: false

  - name: GrantCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: "Federal fiscal year of the cycle"
        constraints: "integer 2000..2100, unique"
      - name: formula_pool_cents
        type: integer
        source: input
        description: "Total cents allocated to the formula component"
        constraints: "integer >= 0"
      - name: competitive_pool_cents
        type: integer
        source: input
        description: "Total cents allocated to the competitive component"
        constraints: "integer >= 0"
      - name: cycle_status
        type: enum
        source: system
        description: "Grant cycle phase"
        constraints: "OPEN | FORMULA_LOCKED | COMPETITIVE_REVIEW | AWARDED | CLOSED; initial OPEN"
      - name: formula_committed_cents
        type: integer
        source: computed
        description: "Sum of formula_component_cents over GrantAwards created from this cycle"
        default: 0
      - name: competitive_committed_cents
        type: integer
        source: computed
        description: "Sum of competitive_component_cents over non-declined GrantAwards created from this cycle"
        default: 0

  - name: GrantApplication
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> GrantCycle.id"
      - name: member_id
        type: string
        source: input
        description: "FK -> NetworkMember.id; applicant organization"
      - name: program_area
        type: enum
        source: input
        description: "Program area the application covers"
        constraints: "HOMEOWNERSHIP | RENTAL | COMMUNITY_DEVELOPMENT | FINANCIAL_CAPABILITY | FORECLOSURE_PREVENTION"
      - name: requested_formula_cents
        type: integer
        source: input
        description: "Requested formula component in cents"
        constraints: "integer >= 0"
      - name: requested_competitive_cents
        type: integer
        source: input
        description: "Requested competitive component in cents; 0 means formula-only application"
        constraints: "integer >= 0"
      - name: pledged_match_cents
        type: integer
        source: input
        description: "Non-federal match pledged by the applicant"
        constraints: "integer >= 0"
      - name: application_status
        type: enum
        source: system
        description: "Application workflow"
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | AWARDED | DECLINED | WITHDRAWN; initial DRAFT"
      - name: review_score
        type: integer
        source: input
        description: "Competitive review score 0..100; required for competitive component"
      - name: reviewer_id
        type: string
        source: system
        description: "X-User-ID of GrantOfficer who scored; segregation-of-duties anchor"

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> GrantApplication.id; exactly one award per application"
      - name: cycle_id
        type: string
        source: system
        description: "FK -> GrantCycle.id; copied from the application at award creation"
      - name: member_id
        type: string
        source: system
        description: "FK -> NetworkMember.id; copied from the application at award creation"
      - name: formula_component_cents
        type: integer
        source: computed
        description: "Formula allocation per calculation formula_allocation"
      - name: competitive_component_cents
        type: integer
        source: computed
        description: "Competitive allocation per calculation competitive_allocation"
      - name: required_match_cents
        type: integer
        source: computed
        description: "Match the member must evidence, per calculation match_requirement"
      - name: verified_match_cents
        type: integer
        source: input
        description: "Match verified by a GrantOfficer; grows monotonically via verify-match endpoint"
        default: 0
      - name: award_status
        type: enum
        source: system
        description: "Award lifecycle with parallel fiscal dimension"
        constraints: "DISBURSING | ACTIVE | SUSPENDED | RECONCILED | CLOSED | TERMINATED; initial DISBURSING"
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Sum of Disbursement.amount_cents with status POSTED for this award"
        default: 0

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> GrantAward.id"
      - name: tranche_index
        type: integer
        source: computed
        description: "1-based ordinal of this disbursement within the award, assigned by created_at ASC order"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount of this tranche in cents"
        constraints: "integer > 0"
      - name: disbursement_status
        type: enum
        source: system
        description: "Tranche lifecycle"
        constraints: "PENDING | POSTED | VOIDED; initial PENDING"

  - name: ClientFile
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> NetworkMember.id; servicing organization"
      - name: counselor_id
        type: string
        source: input
        description: "FK -> Counselor.id; assigned counselor"
      - name: program_area
        type: enum
        source: input
        description: "Program area under which the household is served"
        constraints: "HOMEOWNERSHIP | RENTAL | COMMUNITY_DEVELOPMENT | FINANCIAL_CAPABILITY | FORECLOSURE_PREVENTION"
      - name: household_size
        type: integer
        source: input
        description: "Persons in household"
        constraints: "integer 1..20"
      - name: opened_on
        type: datetime
        source: system
        description: "File open timestamp"
      - name: file_status
        type: enum
        source: system
        description: "Client file lifecycle"
        constraints: "OPEN | COUNSELING | OUTCOME_RECORDED | CLOSED; initial OPEN"
      - name: outcome_code
        type: enum
        source: input
        description: "Outcome recorded for congressional reporting"
        constraints: "PURCHASED_HOME | MORTGAGE_READY | RENTAL_STABILIZED | FORECLOSURE_AVERTED | BUDGET_PLAN_ADOPTED | NO_OUTCOME; null until recorded"
      - name: counseling_hours
        type: number
        source: input
        description: "Hours of counseling delivered"
        constraints: "number >= 0, 1 decimal place"
        default: 0

  - name: FileReview
    parent: null
    common_fields: true
    fields:
      - name: client_file_id
        type: string
        source: input
        description: "FK -> ClientFile.id; the file under review"
      - name: reviewer_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceReviewer"
      - name: review_status
        type: enum
        source: system
        description: "Review lifecycle"
        constraints: "OPEN | PASSED | FAILED | REMEDIATED; initial OPEN"
      - name: deficiency_codes
        type: array
        source: input
        description: "List of deficiency codes found; empty when passed"
      - name: reviewed_at
        type: datetime
        source: system
        description: "Timestamp of pass/fail decision"

  - name: ExpenditureReport
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> GrantAward.id the spending is charged against"
      - name: period_start
        type: datetime
        source: input
        description: "Reporting period start (inclusive)"
      - name: period_end
        type: datetime
        source: input
        description: "Reporting period end (exclusive); strictly after period_start"
      - name: reported_spent_cents
        type: integer
        source: input
        description: "Total spending claimed for the period"
        constraints: "integer >= 0"
      - name: report_status
        type: enum
        source: system
        description: "Expenditure report lifecycle"
        constraints: "SUBMITTED | ACCEPTED | FLAGGED | AUDITED; initial SUBMITTED"
      - name: cumulative_spent_cents
        type: integer
        source: computed
        description: "Sum of reported_spent_cents over ACCEPTED or AUDITED reports for this award with period_start <= this report's period_start"
        default: 0

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: "FK -> GrantAward.id under audit"
      - name: auditor_id
        type: string
        source: system
        description: "X-User-ID of the Auditor; segregation-of-duties anchor"
      - name: audit_status
        type: enum
        source: system
        description: "Audit lifecycle; cyclic FINDINGS_ISSUED -> OPEN re-open loop when remediation fails"
        constraints: "OPEN | FINDINGS_ISSUED | RESOLVED | ESCALATED; initial OPEN"
      - name: disallowance_cents
        type: integer
        source: input
        description: "Disallowed spending determined by audit; triggers clawback on escalation"
        default: 0
      - name: parent_audit_id
        type: string
        source: input
        description: "FK -> ComplianceAudit.id; self-referential link when a re-opened audit supersedes an earlier one; null for initial audits"

  - name: PerformanceReview
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> NetworkMember.id under review"
      - name: review_period
        type: string
        source: input
        description: "Review period label, e.g. FY2026-H1"
        constraints: "required, unique per member"
      - name: households_served
        type: integer
        source: computed
        description: "Households served in period per calculation households_served_rollup"
      - name: review_score
        type: integer
        source: input
        description: "Performance score 0..100"
      - name: review_status
        type: enum
        source: system
        description: "Review lifecycle with branching fork: SATISFACTORY closes, CORRECTIVE_ACTION escalates"
        constraints: "OPEN | SCORED | SATISFACTORY | CORRECTIVE_ACTION | ESCALATED | CLOSED; initial OPEN"
      - name: corrective_plan_due
        type: datetime
        source: system
        description: "Deadline for corrective action plan submission; resolve timestamp + CORRECTIVE_PLAN_DAYS (60 days)"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: NetworkMember
    initial_state: APPLICANT
    terminal_states: [REVOKED]
    transitions:
      - from: APPLICANT
        to: UNDER_ASSESSMENT
        trigger: "POST /housing-network/members/{id}/begin-assessment"
        actor: Assessor
        preconditions:
          - "member.charter_status == APPLICANT"
        side_effects:
          - "creates OrganizationalAssessment in DRAFT for this member"
          - "increments NetworkMember.version by 1"
      - from: UNDER_ASSESSMENT
        to: PROVISIONAL
        trigger: "POST /housing-network/assessments/{id}/adjudicate (rating STRONG or ADEQUATE)"
        actor: NetworkDirector
        preconditions:
          - "assessment.assessment_status == SCORED"
          - "assessment.final_rating IN {STRONG, ADEQUATE}"
        side_effects:
          - "NetworkMember.charter_status := PROVISIONAL"
          - "increments NetworkMember.version by 1"
      - from: UNDER_ASSESSMENT
        to: APPLICANT
        trigger: "POST /housing-network/assessments/{id}/adjudicate (rating DEFICIENT)"
        actor: NetworkDirector
        preconditions:
          - "assessment.assessment_status == SCORED"
          - "assessment.final_rating == DEFICIENT"
        side_effects:
          - "NetworkMember.charter_status := APPLICANT (revision loop back to applicant)"
          - "increments NetworkMember.version by 1"
      - from: PROVISIONAL
        to: CHARTERED
        trigger: "POST /housing-network/members/{id}/charter"
        actor: NetworkDirector
        preconditions:
          - "member.charter_status == PROVISIONAL"
          - "member has >= 1 Certification with certification_status == CERTIFIED held by a Counselor of this member"
        side_effects:
          - "NetworkMember.chartered_at := current logical clock"
          - "increments NetworkMember.version by 1"
      - from: CHARTERED
        to: PROBATION
        trigger: "POST /housing-network/performance-reviews/{id}/escalate"
        actor: NetworkDirector
        preconditions:
          - "review.review_status == CORRECTIVE_ACTION"
          - "current logical clock > review.corrective_plan_due"
        side_effects:
          - "NetworkMember.charter_status := PROBATION"
          - "member.compliance_posture recomputed (becomes RESTRICTED or FROZEN per posture rule)"
          - "increments NetworkMember.version by 1"
      - from: PROBATION
        to: CHARTERED
        trigger: "POST /housing-network/members/{id}/reinstate"
        actor: NetworkDirector
        preconditions:
          - "member.charter_status == PROBATION"
          - "member.open_finding_count == 0"
          - "member.failed_review_flag == false"
        side_effects:
          - "NetworkMember.charter_status := CHARTERED (probation loop back)"
          - "increments NetworkMember.version by 1"
      - from: PROBATION
        to: REVOKED
        trigger: "POST /housing-network/members/{id}/revoke"
        actor: NetworkDirector
        preconditions:
          - "member.charter_status == PROBATION"
        side_effects:
          - "NetworkMember.revocation_reason := request payload"
          - "cascade: every GrantAward with award_status IN {DISBURSING, ACTIVE, SUSPENDED} for this member transitions to TERMINATED"
          - "cascade: every Counselor with counselor_status == ACTIVE for this member transitions to SUSPENDED"
          - "cascade: every Certification with certification_status == CERTIFIED held by those counselors transitions to REVOKED"
          - "increments NetworkMember.version by 1"

  - entity: OrganizationalAssessment
    initial_state: DRAFT
    terminal_states: [ADJUDICATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /housing-network/assessments/{id}/submit"
        actor: Assessor
        preconditions:
          - "governance_score, finance_score, program_capacity_score all non-null"
        side_effects:
          - "records assessor_id from X-User-ID"
          - "recomputes composite_score and provisional_rating (provisional variant)"
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /housing-network/assessments/{id}/score"
        actor: NetworkDirector
        preconditions:
          - "assessment.assessment_status == SUBMITTED"
          - "X-User-ID != assessment.assessor_id (segregation of duties: scorer differs from submitter)"
        side_effects:
          - "assessment.assessment_status := SCORED"
      - from: SCORED
        to: ADJUDICATED
        trigger: "POST /housing-network/assessments/{id}/adjudicate"
        actor: NetworkDirector
        preconditions:
          - "assessment.assessment_status == SCORED"
        side_effects:
          - "recomputes composite_score and final_rating (final variant, includes site-visit adjustment)"
          - "applies member charter transition per final_rating (see NetworkMember machine)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /housing-network/assessments/{id}/withdraw"
        actor: Assessor
        preconditions:
          - "assessment.assessment_status == DRAFT"
        side_effects:
          - "member.charter_status := APPLICANT if it was UNDER_ASSESSMENT"

  - entity: Counselor
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade from NetworkMember revocation, or POST /housing-network/counselors/{id}/suspend"
        actor: NetworkDirector
        preconditions:
          - "counselor.counselor_status == ACTIVE"
        side_effects:
          - "cascade: every Certification with certification_status == CERTIFIED for this counselor transitions to LAPSED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /housing-network/counselors/{id}/reactivate"
        actor: NetworkDirector
        preconditions:
          - "counselor.counselor_status == SUSPENDED"
          - "counselor.member.charter_status == CHARTERED"
        side_effects: []
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /housing-network/counselors/{id}/separate"
        actor: NetworkDirector
        preconditions:
          - "counselor.counselor_status == ACTIVE"
        side_effects:
          - "cascade: every Enrollment with enrollment_status == REGISTERED for this counselor transitions to WITHDRAWN; each withdrawal decrements Course.seats_taken by 1"
          - "cascade: every Certification not terminal transitions to REVOKED"
      - from: SUSPENDED
        to: SEPARATED
        trigger: "POST /housing-network/counselors/{id}/separate"
        actor: NetworkDirector
        preconditions:
          - "counselor.counselor_status == SUSPENDED"
        side_effects:
          - "cascade: every Certification not terminal transitions to REVOKED"

  - entity: Course
    initial_state: SCHEDULED
    terminal_states: [CONCLUDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "system clock reaches delivery_start"
        actor: system
        preconditions:
          - "current logical clock >= course.delivery_start"
        side_effects: []
      - from: IN_SESSION
        to: CONCLUDED
        trigger: "system clock reaches delivery_end"
        actor: system
        preconditions:
          - "current logical clock >= course.delivery_end"
        side_effects:
          - "cascade: every Enrollment still REGISTERED transitions to FAILED with score recorded as null and no CE credit"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /housing-network/courses/{id}/cancel"
        actor: TrainingRegistrar
        preconditions:
          - "course.course_status == SCHEDULED"
        side_effects:
          - "cascade: every Enrollment REGISTERED transitions to WITHDRAWN and Course.seats_taken decremented accordingly"

  - entity: Enrollment
    initial_state: REGISTERED
    terminal_states: [COMPLETED, FAILED, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: COMPLETED
        trigger: "POST /housing-network/enrollments/{id}/grade with score >= pass_threshold"
        actor: TrainingRegistrar
        preconditions:
          - "course.course_status == IN_SESSION"
          - "payload score >= enrollment.pass_threshold"
        side_effects:
          - "if course.ce_eligible: counselor.ce_credits_accumulated += course.ce_credits"
          - "re-evaluates every CERTIFIED Certification of this counselor: continuing_requirement_met recomputed"
      - from: REGISTERED
        to: FAILED
        trigger: "POST /housing-network/enrollments/{id}/grade with score < pass_threshold"
        actor: TrainingRegistrar
        preconditions:
          - "course.course_status == IN_SESSION"
          - "payload score < enrollment.pass_threshold"
        side_effects:
          - "Course.seats_taken decremented by 1"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /housing-network/enrollments/{id}/withdraw or cascade"
        actor: TrainingRegistrar
        preconditions:
          - "enrollment.enrollment_status == REGISTERED"
        side_effects:
          - "Course.seats_taken decremented by 1"

  - entity: Certification
    initial_state: CANDIDATE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: CANDIDATE
        to: CERTIFIED
        trigger: "POST /housing-network/certifications/{id}/certify"
        actor: TrainingRegistrar
        preconditions:
          - "counselor has a COMPLETED Enrollment in a Course whose program_area == certification.program_area"
          - "counselor.counselor_status == ACTIVE"
          - "counselor.member.charter_status IN {PROVISIONAL, CHARTERED}"
        side_effects:
          - "certified_at := current logical clock; lapse_deadline := certified_at + CE_WINDOW_MONTHS months"
      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /housing-network/certifications/{id}/evaluate-continuing-requirement when requirement unmet"
        actor: TrainingRegistrar
        preconditions:
          - "current logical clock > certification.lapse_deadline"
          - "certification.continuing_requirement_met == false"
        side_effects:
          - "recomputes member posture if this lapse raises the member's lapsed-certification count above LAPSE_POSTURE_THRESHOLD"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /housing-network/certifications/{id}/reinstate"
        actor: TrainingRegistrar
        preconditions:
          - "certification.certification_status == LAPSED"
          - "counselor.ce_credits_accumulated >= CE_REQUIRED_CREDITS (30)"
          - "counselor.counselor_status == ACTIVE"
        side_effects:
          - "certified_at := current logical clock; lapse_deadline reset (reinstatement loop)"
      - from: LAPSED
        to: EXPIRED
        trigger: "system: LAPSED for more than LAPSE_GRACE_DAYS (90) days"
        actor: system
        preconditions:
          - "current logical clock > lapse_deadline + LAPSE_GRACE_DAYS (90 days)"
        side_effects: []

  - entity: GrantCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FORMULA_LOCKED
        trigger: "POST /housing-network/grant-cycles/{id}/lock-formula"
        actor: GrantOfficer
        preconditions:
          - "cycle.cycle_status == OPEN"
        side_effects:
          - "all GrantApplications with application_status == SUBMITTED for this cycle transition to UNDER_REVIEW"
      - from: FORMULA_LOCKED
        to: COMPETITIVE_REVIEW
        trigger: "POST /housing-network/grant-cycles/{id}/open-competitive-review"
        actor: GrantOfficer
        preconditions:
          - "cycle.cycle_status == FORMULA_LOCKED"
        side_effects: []
      - from: COMPETITIVE_REVIEW
        to: AWARDED
        trigger: "POST /housing-network/grant-cycles/{id}/finalize"
        actor: GrantOfficer
        preconditions:
          - "cycle.cycle_status == COMPETITIVE_REVIEW"
          - "every GrantApplication UNDER_REVIEW has review_score non-null when requested_competitive_cents > 0"
        side_effects:
          - "cycle.cycle_status := AWARDED"
      - from: AWARDED
        to: CLOSED
        trigger: "POST /housing-network/grant-cycles/{id}/close"
        actor: GrantOfficer
        preconditions:
          - "cycle.cycle_status == AWARDED"
          - "every GrantAward for this cycle has award_status IN {RECONCILED, CLOSED, TERMINATED}"
        side_effects: []

  - entity: GrantApplication
    initial_state: DRAFT
    terminal_states: [AWARDED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /housing-network/grant-applications/{id}/submit"
        actor: MemberAdmin
        preconditions:
          - "member.charter_status == CHARTERED"
          - "member.compliance_posture IN {CLEAR, WATCH}"
          - "cycle.cycle_status == OPEN"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "cascade from GrantCycle lock-formula"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /housing-network/grant-applications/{id}/award"
        actor: GrantOfficer
        preconditions:
          - "cycle.cycle_status == AWARDED"
          - "requested_competitive_cents == 0 OR review_score >= COMPETITIVE_SCORE_FLOOR (60)"
          - "member.compliance_posture != FROZEN"
          - "X-User-ID != application.reviewer_id when review_score was set by a GrantOfficer (segregation of duties)"
        side_effects:
          - "creates GrantAward with computed formula/competitive/match fields"
          - "cycle.formula_committed_cents += award.formula_component_cents"
          - "cycle.competitive_committed_cents += award.competitive_component_cents"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /housing-network/grant-applications/{id}/decline"
        actor: GrantOfficer
        preconditions:
          - "application.application_status == UNDER_REVIEW"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /housing-network/grant-applications/{id}/withdraw"
        actor: MemberAdmin
        preconditions:
          - "application.application_status == DRAFT"
          - "X-User-ID belongs to the applicant member"
        side_effects: []

  - entity: GrantAward
    initial_state: DISBURSING
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DISBURSING
        to: ACTIVE
        trigger: "POST /housing-network/grant-awards/{id}/activate"
        actor: GrantOfficer
        preconditions:
          - "award.verified_match_cents >= award.required_match_cents"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /housing-network/grant-awards/{id}/suspend or cascade from ComplianceAudit escalation"
        actor: GrantOfficer
        preconditions:
          - "award.award_status == ACTIVE"
        side_effects:
          - "suspended awards block new Disbursement creation"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /housing-network/grant-awards/{id}/resume"
        actor: GrantOfficer
        preconditions:
          - "award.award_status == SUSPENDED"
          - "no ComplianceAudit in FINDINGS_ISSUED or ESCALATED exists for this award"
        side_effects: []
      - from: ACTIVE
        to: RECONCILED
        trigger: "POST /housing-network/grant-awards/{id}/reconcile"
        actor: GrantOfficer
        preconditions:
          - "award.award_status == ACTIVE"
          - "award.disbursed_cents == formula_component_cents + competitive_component_cents"
          - "every ExpenditureReport for this award has report_status IN {ACCEPTED, AUDITED}"
        side_effects: []
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /housing-network/grant-awards/{id}/close"
        actor: GrantOfficer
        preconditions:
          - "award.award_status == RECONCILED"
        side_effects: []
      - from: DISBURSING
        to: TERMINATED
        trigger: "cascade from NetworkMember revocation"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "cascade from NetworkMember revocation"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "cascade from NetworkMember revocation"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /housing-network/disbursements/{id}/post"
        actor: GrantOfficer
        preconditions:
          - "award.award_status IN {DISBURSING, ACTIVE}"
          - "award.disbursed_cents + amount_cents <= award.formula_component_cents + award.competitive_component_cents"
        side_effects:
          - "award.disbursed_cents += amount_cents (ledger sync)"
      - from: PENDING
        to: VOIDED
        trigger: "POST /housing-network/disbursements/{id}/void"
        actor: GrantOfficer
        preconditions:
          - "disbursement.disbursement_status == PENDING"
        side_effects: []

  - entity: ClientFile
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: COUNSELING
        trigger: "POST /housing-network/client-files/{id}/begin-counseling"
        actor: MemberAdmin
        preconditions:
          - "assigned counselor.counselor_status == ACTIVE"
          - "assigned counselor holds a Certification CERTIFIED whose program_area == file.program_area"
          - "member.compliance_posture != FROZEN"
        side_effects: []
      - from: COUNSELING
        to: OUTCOME_RECORDED
        trigger: "POST /housing-network/client-files/{id}/record-outcome"
        actor: MemberAdmin
        preconditions:
          - "file.file_status == COUNSELING"
          - "payload outcome_code != NO_OUTCOME OR counseling_hours >= MIN_HOURS_NO_OUTCOME (2.0)"
        side_effects: []
      - from: OUTCOME_RECORDED
        to: CLOSED
        trigger: "POST /housing-network/client-files/{id}/close"
        actor: MemberAdmin
        preconditions:
          - "every FileReview for this file has review_status IN {PASSED, REMEDIATED}"
        side_effects: []

  - entity: FileReview
    initial_state: OPEN
    terminal_states: [PASSED, REMEDIATED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /housing-network/file-reviews/{id}/pass"
        actor: ComplianceReviewer
        preconditions:
          - "review.review_status == OPEN"
        side_effects:
          - "member.open_finding_count recomputed"
      - from: OPEN
        to: FAILED
        trigger: "POST /housing-network/file-reviews/{id}/fail"
        actor: ComplianceReviewer
        preconditions:
          - "review.review_status == OPEN"
          - "payload deficiency_codes non-empty"
        side_effects:
          - "member.open_finding_count += 1"
          - "member.compliance_posture recomputed per posture rule"
          - "if member's failed-review ratio crosses FILE_FAIL_RATIO_THRESHOLD, member.failed_review_flag := true"
      - from: FAILED
        to: REMEDIATED
        trigger: "POST /housing-network/file-reviews/{id}/remediate"
        actor: ComplianceReviewer
        preconditions:
          - "review.review_status == FAILED"
        side_effects:
          - "member.open_finding_count -= 1"
          - "member.compliance_posture recomputed per posture rule"

  - entity: ExpenditureReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, AUDITED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /housing-network/expenditure-reports/{id}/accept"
        actor: GrantOfficer
        preconditions:
          - "report.cumulative_spent_cents <= award.disbursed_cents"
        side_effects:
          - "award-level spending totals reconciled (derived field reconciliation)"
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /housing-network/expenditure-reports/{id}/flag"
        actor: GrantOfficer
        preconditions:
          - "report.report_status == SUBMITTED"
        side_effects:
          - "creates a ComplianceAudit in OPEN for the award (transitive cascade link 1)"
      - from: FLAGGED
        to: AUDITED
        trigger: "cascade: linked ComplianceAudit reaches FINDINGS_ISSUED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComplianceAudit
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /housing-network/compliance-audits/{id}/issue-findings"
        actor: Auditor
        preconditions:
          - "audit.audit_status == OPEN"
          - "payload disallowance_cents >= 0"
        side_effects:
          - "linked ExpenditureReport transitions FLAGGED -> AUDITED (cascade link 2)"
          - "member.open_finding_count recomputed (audit in FINDINGS_ISSUED counts)"
      - from: FINDINGS_ISSUED
        to: RESOLVED
        trigger: "POST /housing-network/compliance-audits/{id}/resolve"
        actor: Auditor
        preconditions:
          - "audit.audit_status == FINDINGS_ISSUED"
        side_effects:
          - "member.open_finding_count recomputed"
      - from: FINDINGS_ISSUED
        to: ESCALATED
        trigger: "POST /housing-network/compliance-audits/{id}/escalate"
        actor: Auditor
        preconditions:
          - "audit.audit_status == FINDINGS_ISSUED"
          - "disallowance_cents > 0"
        side_effects:
          - "award transitions to SUSPENDED (cascade link 3)"
          - "award.disbursed_cents reduced by disallowance_cents via clawback adjusting entry (compensating invariant: cycle pool conserved)"
          - "cycle.competitive_committed_cents or formula_committed_cents credited back by disallowance_cents (waterfall: competitive first, then formula)"
          - "member.compliance_posture recomputed (escalation forces FROZEN)"
      - from: FINDINGS_ISSUED
        to: OPEN
        trigger: "POST /housing-network/compliance-audits/{id}/reopen"
        actor: Auditor
        preconditions:
          - "audit.audit_status == FINDINGS_ISSUED"
          - "a new ComplianceAudit is created with parent_audit_id == this audit (re-open loop; the new audit starts OPEN)"
        side_effects:
          - "creates successor ComplianceAudit in OPEN with parent_audit_id set"

  - entity: PerformanceReview
    initial_state: OPEN
    terminal_states: [SATISFACTORY, CLOSED]
    transitions:
      - from: OPEN
        to: SCORED
        trigger: "POST /housing-network/performance-reviews/{id}/score"
        actor: NetworkDirector
        preconditions:
          - "payload review_score in 0..100"
        side_effects:
          - "recomputes review.households_served via households_served_rollup"
      - from: SCORED
        to: SATISFACTORY
        trigger: "POST /housing-network/performance-reviews/{id}/resolve with verdict SATISFACTORY"
        actor: NetworkDirector
        preconditions:
          - "review.review_score >= PERFORMANCE_PASS_SCORE (70)"
        side_effects: []
      - from: SCORED
        to: CORRECTIVE_ACTION
        trigger: "POST /housing-network/performance-reviews/{id}/resolve with verdict CORRECTIVE_ACTION"
        actor: NetworkDirector
        preconditions:
          - "review.review_score < PERFORMANCE_PASS_SCORE (70)"
        side_effects:
          - "corrective_plan_due := current logical clock + CORRECTIVE_PLAN_DAYS (60 days)"
          - "member.failed_review_flag := true; posture recomputed"
      - from: CORRECTIVE_ACTION
        to: CLOSED
        trigger: "POST /housing-network/performance-reviews/{id}/close-plan"
        actor: NetworkDirector
        preconditions:
          - "review.review_status == CORRECTIVE_ACTION"
          - "current logical clock <= review.corrective_plan_due"
          - "member.open_finding_count == 0"
        side_effects:
          - "member.failed_review_flag := false; posture recomputed"
      - from: CORRECTIVE_ACTION
        to: ESCALATED
        trigger: "POST /housing-network/performance-reviews/{id}/escalate"
        actor: NetworkDirector
        preconditions:
          - "current logical clock > review.corrective_plan_due"
        side_effects:
          - "member.charter_status := PROBATION (see NetworkMember CHARTERED -> PROBATION)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: application-submit-stale-cycle
    parent_entity: GrantCycle
    write_endpoint: "POST /housing-network/grant-applications"
    occ_field: "expected_cycle_version"
    description: |
      Creating a GrantApplication against a GrantCycle whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just locked the formula or otherwise
      mutated the cycle and the current writer's view of the cycle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: award-activate-stale-award
    parent_entity: GrantAward
    write_endpoint: "POST /housing-network/grant-awards/{id}/activate"
    occ_field: "expected_award_version"
    description: |
      Activating a GrantAward whose version has advanced since the client
      last observed it is rejected. This captures the case where a match
      verification or clawback has just mutated the award and the activating
      client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assessment_composite
    trigger: "OrganizationalAssessment submit (provisional) and adjudicate (final)"
    algorithm: weighted_scoring
    formula: |
      base = 0.40*governance_score + 0.35*finance_score + 0.25*program_capacity_score
      provisional: composite_score = round_half_up(base, 2)
      final: composite_score = round_half_up(min(100, base + site_visit_adjustment), 2)
      rating bands (both variants):
        composite >= 85 -> STRONG
        70 <= composite < 85 -> ADEQUATE
        50 <= composite < 70 -> MARGINAL
        composite < 50 -> DEFICIENT
    input_set: "the three dimension scores of this assessment; final variant adds site_visit_adjustment from adjudicate payload"
    constants:
      W_GOVERNANCE: 0.40
      W_FINANCE: 0.35
      W_PROGRAM: 0.25
      STRONG_FLOOR: 85
      ADEQUATE_FLOOR: 70
      MARGINAL_FLOOR: 50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "on submit"
        difference: "no site-visit adjustment; drives provisional_rating"
      - name: final
        when: "on adjudicate"
        difference: "adds site_visit_adjustment (integer -10..+10), clamps at 100; drives final_rating and charter decision. Identical dimension scores yield different composite/rating whenever adjustment is non-zero."

  - name: formula_allocation
    trigger: "GrantApplication award — formula component"
    algorithm: waterfall_allocation
    formula: |
      eligible = members with charter_status == CHARTERED and an UNDER_REVIEW application in this cycle
      weight(m) = (1 + households_served(m, prior FY)) * REGIONAL_NEED_FACTOR(m.state_code)
      raw(m) = formula_pool_cents * weight(m) / sum(weight over eligible)
      per-application cap: formula_component = min(raw(m), requested_formula_cents)
      rounding: round each member's share DOWN to whole cents (floor), then distribute the
      residual cents one at a time to members in order of weight DESC, tie-break
      created_at ASC of the application, until residual is exhausted (waterfall remainder rule).
    input_set: "GrantApplications of this cycle in UNDER_REVIEW or AWARDED at lock time; excludes DECLINED/WITHDRAWN"
    constants:
      REGIONAL_NEED_FACTOR_DEFAULT: 1.0
    precision: "whole cents; floor then waterfall remainder"
    variants:
      - name: capped
        when: "requested_formula_cents < raw share"
        difference: "allocation capped at the request; the excess redistributes to uncapped members via the waterfall, so identical pool and weights yield different totals depending on one member's request."

  - name: competitive_allocation
    trigger: "GrantApplication award — competitive component"
    algorithm: tiered_pricing
    formula: |
      if requested_competitive_cents == 0: competitive_component = 0
      else tier by review_score:
        score >= 90: fund 100% of request
        75 <= score < 90: fund 80% of request, rounded down to whole cents
        60 <= score < 75: fund 50% of request, rounded down to whole cents
        score < 60: fund 0 (ineligible; application may still win formula component)
      funding is marginal by tier on the REQUEST, not cumulative across tiers.
    input_set: "this application's review_score and requested_competitive_cents"
    constants:
      TIER1_FLOOR: 90
      TIER2_FLOOR: 75
      TIER3_FLOOR: 60
      COMPETITIVE_SCORE_FLOOR: 60
      TIER2_RATE: 0.80
      TIER3_RATE: 0.50
    precision: "whole cents, floor"
    variants:
      - name: ineligible_zero
        when: "review_score < 60"
        difference: "competitive component is zero even when the request is large; the same request at score 90 funds in full."

  - name: match_requirement
    trigger: "GrantAward creation"
    algorithm: threshold
    formula: |
      total = formula_component_cents + competitive_component_cents
      if member.chartered_at is within MATCH_REDUCED_MONTHS months of award creation
      (provisional-period members): required_match_cents = ceil(0.10 * total)
      else: required_match_cents = ceil(0.25 * total)
      evaluation order: total first, then rate selection, then ceiling — the rate
      never feeds back into total.
    input_set: "award components and member.chartered_at relative to current logical clock"
    constants:
      MATCH_STANDARD_RATE: 0.25
      MATCH_REDUCED_RATE: 0.10
      MATCH_REDUCED_MONTHS: 24
    precision: "whole cents, ceil"
    variants:
      - name: reduced_match
        when: "member chartered < 24 months ago"
        difference: "10% rate instead of 25%; identical award totals produce different match requirements by member tenure."

  - name: households_served_rollup
    trigger: "PerformanceReview score; congressional report endpoint; formula_allocation weight"
    algorithm: aggregation
    formula: |
      households_served(member, FY) = count of ClientFile rows where
        file.member_id == member AND file.file_status IN {OUTCOME_RECORDED, CLOSED}
        AND file.outcome_code IS NOT NULL AND file.outcome_code != 'NO_OUTCOME'
        AND file.opened_on within the fiscal year window [FY-10-01, FY+1-09-30)
      No tie-break needed (count). Excludes OPEN and COUNSELING files.
    input_set: "ClientFile rows of the member filtered by status, outcome, and fiscal-year window (half-open on the end boundary)"
    constants: {}
    precision: "integer count"
    variants:
      - name: congressional
        when: "congressional report endpoint"
        difference: "aggregates across ALL members with charter_status != REVOKED, grouped by program_area; per-member variant is scoped to one member. Same files, different grouping yields different numbers."

  - name: posture_recompute
    trigger: "any FileReview fail/remediate, ComplianceAudit issue/resolve/escalate, PerformanceReview corrective/close, Counselor certification lapse"
    algorithm: constraint_propagation
    formula: |
      open_finding_count = count(FileReview FAILED for member) + count(ComplianceAudit FINDINGS_ISSUED for awards of member)
      lapsed_certs = count(Certification LAPSED for counselors of member)
      if any ComplianceAudit ESCALATED for member -> FROZEN
      elif open_finding_count >= 3 OR member in PROBATION -> RESTRICTED
      elif open_finding_count >= 1 OR failed_review_flag OR lapsed_certs > LAPSE_POSTURE_THRESHOLD -> WATCH
      else -> CLEAR
      Propagation order: recompute open_finding_count, then failed_review_flag, then posture.
    input_set: "FileReview, ComplianceAudit, PerformanceReview, Certification rows linked to the member"
    constants:
      POSTURE_RESTRICTED_FINDINGS: 3
      LAPSE_POSTURE_THRESHOLD: 2
    precision: "integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and body FK resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "segregation of duties: X-User-ID must differ from the recorded counterpart (assessment scorer != submitter; award approver != reviewer)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /housing-network/assessments/{id}/score, POST /housing-network/grant-applications/{id}/award"
  - priority: 6
    category: business_safety
    check: "member compliance posture gate: FROZEN members cannot begin counseling, submit applications, receive awards, or post disbursements; RESTRICTED members cannot submit applications"
    error_id: ERR_MEMBER_POSTURE_BLOCKED
    http_status: 422
    applies_to: "POST /housing-network/client-files/{id}/begin-counseling, POST /housing-network/grant-applications/{id}/submit, POST /housing-network/grant-applications/{id}/award, POST /housing-network/disbursements"
  - priority: 7
    category: business_constraint
    check: "course capacity: enrollment allowed only while seats_taken < capacity; delivery windows of two courses sharing a prerequisite chain must not overlap unless sequential"
    error_id: ERR_COURSE_FULL
    http_status: 422
    applies_to: "POST /housing-network/courses/{id}/enrollments"
  - priority: 8
    category: business_constraint
    check: "course prerequisite: counselor has a COMPLETED enrollment in course.prerequisite_course_id when one is declared"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /housing-network/courses/{id}/enrollments"
  - priority: 9
    category: business_temporal
    check: "logical-clock gates: cycle phases ordered in time; certification evaluation only after lapse_deadline; escalation only after corrective_plan_due; enrollment window within course delivery window"
    error_id: ERR_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /housing-network/grant-applications/{id}/submit, POST /housing-network/certifications/{id}/evaluate-continuing-requirement, POST /housing-network/performance-reviews/{id}/escalate, POST /housing-network/courses/{id}/enrollments"
  - priority: 10
    category: business_referential
    check: "cross-entity referential integrity: counselor belongs to the file's member; certification program_area matches file/course program_area; award FKs consistent with application"
    error_id: ERR_CROSS_ENTITY_MISMATCH
    http_status: 422
    applies_to: "POST /housing-network/client-files, POST /housing-network/client-files/{id}/begin-counseling, POST /housing-network/certifications"
  - priority: 11
    category: business_fiscal
    check: "fiscal sufficiency: formula/competitive committed plus new allocation must not exceed the respective pool; disbursement total must not exceed award total; cumulative spending must not exceed disbursed"
    error_id: ERR_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /housing-network/grant-applications/{id}/award, POST /housing-network/disbursements, POST /housing-network/expenditure-reports"
  - priority: 12
    category: business_fiscal
    check: "match requirement: award activation requires verified_match_cents >= required_match_cents"
    error_id: ERR_MATCH_NOT_MET
    http_status: 422
    applies_to: "POST /housing-network/grant-awards/{id}/activate"
  - priority: 13
    category: business_constraint
    check: "uniqueness: ein, legal_name, email, course_code, fiscal_year, review_period per member, one award per application"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /housing-network/members, POST /housing-network/counselors, POST /housing-network/courses, POST /housing-network/grant-cycles, POST /housing-network/performance-reviews, POST /housing-network/grant-awards"
  - priority: 14
    category: business_constraint
    check: "payload shape: required fields present, enum values valid, ranges respected (scores 0..100, household_size 1..20, period_end > period_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 15
    category: state
    check: "OCC: expected_*_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /housing-network/grant-applications, POST /housing-network/grant-awards/{id}/activate"

