            - "SalesJournal.${journal_id}.open_case_count == 2 and net_unexplained_cents == 40000"

      - name: card_settlement_amex_adder_applied_on_top_tier
        claim_type: constants_applied
        grounds:
          - calculations.card_settlement_reconciliation.constants
          - entities.CardSettlement.fields.expected_fee_cents
          - endpoints["POST /cash-ops/card-settlements"]
        distinguishing_aspect: >
          The AMEX adder is added to the tier rate before rounding: 412750 at tier 3 (0.0195) plus the
          0.0035 adder rounds to 9493, plus 12 * 143 = 1716, giving expected_fee_cents 11209 — a VISA_MC
          row on the identical figures would owe 9765, so the adder alone moves the fee by 1444.
        test_recipe:
          setup:
            - "Store S-1937 and journal 2026-08-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1937", name: "Store 1937", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "${journal_id}", card_network: "AMEX", gross_card_sales_cents: 412750, txn_count: 143, monthly_volume_cents: 21000000, chargeback_cents: 1500, funded_amount_cents: 400041 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
          assert:
            - "HTTP status is 201 and data.expected_fee_cents == 11209 (round_half_up(412750 * 0.0230) == 9493, plus 1716)"
            - "data.expected_funded_cents == 400041 (412750 - 11209 - 1500)"
            - "data.settlement_variance_cents == 0 and data.settlement_status == \"MATCHED\""
            - "SalesJournal.${journal_id}.settlement_count == 1 and settlement_variance_total_cents == 0"

      - name: provisional_credit_variant_divergence_on_identical_cash
        claim_type: variant_divergence
        excluded_because:
          grounds: calculations.provisional_credit.variants
          difficulty_instance: provisional_credit_smart_validator_versus_carrier_receipt_divergence
          rationale: >
            The §1.8 dual_variant_calc instance runs the identical bag through both credit bases and
            asserts the 46000 divergence (196000 versus 242000), which is the whole content of the
            divergence claim.

      - name: card_settlement_tier_boundary_and_rounding_precision
        claim_type: precision
        excluded_because:
          grounds: calculations.card_settlement_reconciliation.precision
          difficulty_instance: card_settlement_tier_floor_and_round_half_up_boundaries
          rationale: >
            The §1.8 boundary_precision_check instance already pins monthly_volume_cents exactly on
            TIER_2_FLOOR_CENTS and a fee whose fractional part is exactly .5, covering both the
            inclusive-lower-edge rule and round_half_up.

      - name: rolling_threshold_boundary_behaviour
        claim_type: threshold
        excluded_because:
          grounds: calculations.cashier_rolling_variance
          difficulty_instance: rolling_variance_one_cent_below_threshold_keeps_cashier_eligible
          rationale: >
            The §1.8 instance tests 9999 versus 10000 on the rolling arm, which is the boundary triple
            this row would otherwise re-probe.

  - section: validations
    instances:
      - name: register_occupied_rejects_a_second_till_on_the_same_register
        claim_type: violation_error
        grounds:
          - validations[priority=58]
          - errors[ERR_REGISTER_OCCUPIED]
        distinguishing_aspect: >
          Register occupancy is per (sales_journal, register_number) and is held by any ACTIVE or
          PENDING_COUNT session: assigning E-200 to register 1 while E-100's session is still ACTIVE
          returns 409 ERR_REGISTER_OCCUPIED even though the two shifts belong to different cashiers.
        test_recipe:
          setup:
            - "Store S-1940, MANUAL safe SAFE-A (500000), cashiers E-100 and E-200, journal 2026-08-03, E-100 ACTIVE on register 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1940", name: "Store 1940", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_a_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-200", display_name: "Cashier 200" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { cashier_b_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_a_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
