            - "after also scoring ${oc2_id} with 1 point, verified_coverage_bp would be 6500 and completing with recommendation PASS returns 422 ERR_RECOMMENDATION_INCONSISTENT because 6500 < PASS_THRESHOLD_BP 7000"
            - "scoring on the assignment BEFORE accepting it returns 409 ERR_ASSIGNMENT_NOT_ACCEPTED"

      - name: claim_creation_eligibility_family_is_rejected_by_the_priority_ladder
