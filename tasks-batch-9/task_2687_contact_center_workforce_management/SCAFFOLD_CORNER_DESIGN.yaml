          assert:
            - "r1_initial == \"DRAFT\""
            - "err_draft == \"ERR_BID_ROUND_NOT_OPEN\" with status 409, not ERR_INVALID_STATE"
            - "ok_status == \"SUBMITTED\" -- the OPEN window accepts the same payload"
            - "err_scoring == \"ERR_BID_ROUND_NOT_OPEN\": the window closes on the SCORING side too"
            - "err_withdraw == \"ERR_BID_ROUND_NOT_OPEN\": withdrawal is only legal while the round is OPEN"
            - "GET /shift-bids filtered to bid_round_id ${r1_id} returns total_count 1 and that row is still SUBMITTED"

      - name: adherence_observation_on_unpublished_shift_rejected
