        grounds:
          - validations[priority 11]
        excluded_because:
          difficulty_instance: submit_blocked_when_target_institution_is_merged_out
          rationale: "that §1.8 instance shows submission failing with ERR_INSTITUTION_NOT_ACTIVE purely because the target Institution is MERGED_OUT, and succeeding while it is ACTIVE"

