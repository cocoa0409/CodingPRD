      - name: assignments_on_unknown_window_return_not_found
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SHIFT_WINDOW_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "An unknown window id in the path fails existence (404 ERR_SHIFT_WINDOW_NOT_FOUND) before the OCC version field is even examined — path resources validate left-to-right."
        test_recipe:
          setup: ["Clock default. Inspector exists; no window exists."]
          setup_api_calls:
