scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overtime_fee_provisional_vs_final_on_parcel
        grounds:
          - calculations.overtime_fee_calc
          - state_machines.Parcel.DEPOSITED_to_PICKUP_PENDING
          - state_machines.Parcel.PICKUP_PENDING_to_PICKED_UP
          - entities.Parcel.fields.provisional_overtime_fee
          - entities.Parcel.fields.final_overtime_fee
          - entities.OvertimeFeeRecord.fields.variant
        distinguishing_aspect: |
          Same parcel, same deposited_at, but PROVISIONAL is computed at the moment recipient
          transitions DEPOSITED→PICKUP_PENDING and FINAL is recomputed at PICKUP_PENDING→PICKED_UP.
          When a tier boundary (24/72/168 hours) is crossed in the gap between those two transitions,
          the two variants produce DIFFERENT integer cents on the same Parcel — Parcel domain.
        test_recipe:
          setup:
            - "OperationsAdmin creates a LockerMachine, one MEDIUM Compartment in AVAILABLE"
            - "Courier deposits a parcel; clock advance: deposited_at=t0"
            - "POST /_clock/advance seconds=71*3600  (now-deposited_at = 71h, still TIER1)"
            - "Recipient POST /parcels/{id}/initiate-pickup with valid CODE → PROVISIONAL fee record created"
            - "POST /_clock/advance seconds=2*3600  (now-deposited_at = 73h, into TIER2)"
            - "Recipient simulates payment of provisional via POST /events/emit payment_succeeded"
          trigger:
            - "POST /parcels/{id}/pickup-confirm"
          assert:
            - "OvertimeFeeRecord PROVISIONAL.amount_cents == 4700  (71h elapsed, 47*100)"
            - "OvertimeFeeRecord FINAL.amount_cents == 5000  (73h elapsed, 48*100 + 1*200)"
            - "Parcel.provisional_overtime_fee == 4700 AND Parcel.final_overtime_fee == 5000"
            - "Two records exist with variant in {PROVISIONAL, FINAL}; FINAL > PROVISIONAL"

      - name: courier_quality_lifetime_vs_window_30d
        grounds:
          - calculations.courier_quality_score
          - entities.Courier.fields.lifetime_deposit_success_rate
          - entities.Courier.fields.window_wrong_deposit_rate
          - endpoints[GET /couriers/{courierId}/rating]
        distinguishing_aspect: |
          Same Courier with a long, mostly-clean lifetime history but a recent bad streak — the
          rolling 30-day variant trips the BLACKLIST_THRESHOLD_RATE while the lifetime variant
          does not. Different entity domain (Courier) than the parcel-fee dual-variant.
        test_recipe:
          setup:
            - "Courier C registered; 100 successful deposits older than 30 days (advance clock between batches)"
            - "POST /_clock/advance to push the prior batch outside the 30-day window"
            - "Courier C performs 10 deposits in current window: 9 successful, 1 corrected via /correct-wrong-deposit within grace"
          trigger:
            - "GET /couriers/{C.id}/rating"
          assert:
            - "rating.lifetime.success_rate (100/(100+0)) > 0.99 → analytic dashboard sees a strong courier"
            - "rating.window_30d.window_wrong_deposit_rate == 0.1000 (1/10)"
            - "Courier.blacklist_status == 'RESTRICTED' (auto-flipped because window rate >= 0.10)"
            - "Lifetime score and window score yield DIFFERENT downstream gating decisions on the SAME courier"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overtime_tiered_pricing_with_three_breakpoints   # mode (a) — ≥3 inputs, non-linear (tiered + cap)
        grounds:
          - calculations.overtime_fee_calc
          - calculations.overtime_fee_calc.constants  # FREE_HOURS, TIER1_END_HOURS, TIER2_END_HOURS, FEE_CAP_CENTS
          - endpoints[POST /parcels/{parcelId}/pickup-confirm]
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (elapsed_hours, free_threshold, tier1_end, tier2_end, three rates, cap)
          and non-linear interaction via three nested min/max clauses plus a cap. The minimum of
          (tiered_total, FEE_CAP_CENTS) creates a fourth conditional branch.
        test_recipe:
          setup:
            - "Deposit a parcel at t0; advance clock 100 hours; recipient initiates pickup; pay; pickup-confirm"
          trigger:
            - "GET /parcels/{id}/fees"
          assert:
            - "FINAL.amount_cents == 10000  (raw=4800+5600=10400 capped at FEE_CAP_CENTS=10000)"
            - "Parcel.final_overtime_fee == 10000 (capped)"
            - "Parcel.deposited_at + 100h == cutoff_at"

      - name: settlement_revenue_split_floor_then_residual    # mode (b) — nested rounding where ORDER matters
        grounds:
          - calculations.settlement_revenue_split
          - calculations.settlement_revenue_split.constants   # PARTNER_SHARE_RATIO=0.30
          - entities.SettlementBatch.fields.partner_share_cents
          - entities.SettlementBatch.fields.platform_share_cents
          - endpoints[GET /settlements/{batchId}]
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — partner_share = floor(net*0.30); platform = net - partner.
          On odd-cent nets the alternative order (round platform first) would shift one cent. With
          net=333 cents, the pinned order yields partner=99/platform=234; reversing yields partner=100/platform=233.
        test_recipe:
          setup:
            - "Single LockerMachine for partner P; one parcel deposited then picked up after 25h producing FINAL=100 cents PAID"
            - "Two more parcels yielding FINAL=133 cents and 100 cents respectively, both PAID; total gross=333 cents"
            - "No refunds in window"
            - "OperationsAdmin POST /settlements partner_id=P period_start=t0 period_end=now"
          trigger:
            - "GET /settlements/{batchId}"
          assert:
            - "gross_overtime_revenue_cents == 333"
            - "refund_reversal_cents == 0"
            - "net_revenue_cents == 333"
            - "partner_share_cents == 99   (floor(333*0.30) = floor(99.9))"
            - "platform_share_cents == 234 (333 - 99; residual to platform — pinned order)"
            - "partner_share_cents + platform_share_cents == net_revenue_cents (no drift)"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: parcel_state_branching_with_revert
        grounds:
          - state_machines.Parcel
          - state_machines.Parcel.DEPOSITED_to_PICKUP_PENDING
          - state_machines.Parcel.PICKUP_PENDING_to_DEPOSITED   # revert
          - state_machines.Parcel.DEPOSITED_to_WRONG_DEPOSIT_VOID
          - state_machines.Parcel.DEPOSITED_to_LONG_STAY
        distinguishing_aspect: |
          Parcel is non-linear in TWO ways simultaneously: (i) a revert edge PICKUP_PENDING→DEPOSITED
          (cycle-like loop returning to a prior state) and (ii) branching from DEPOSITED into three
          distinct downstream paths (PICKUP_PENDING, WRONG_DEPOSIT_VOID, LONG_STAY) with divergent
          side effects. Pure linear A→B→C does not satisfy.
        test_recipe:
          setup:
            - "Deposit a parcel and bring it to DEPOSITED state"
          trigger:
            - "Recipient POST /parcels/{id}/initiate-pickup → status=PICKUP_PENDING"
            - "Recipient POST /parcels/{id}/cancel-pickup → status reverts to DEPOSITED"
            - "Repeat initiate-pickup → again PICKUP_PENDING (cycle confirmed)"
          assert:
            - "After cancel-pickup: Parcel.status == 'DEPOSITED'"
            - "Audit trail contains two PICKUP_PENDING entries for the same parcel id"
            - "Provisional OvertimeFeeRecord retained UNPAID across the revert"

      - name: courier_blacklist_branching_with_reinstate
        grounds:
          - state_machines.Courier
          - state_machines.Courier.ACTIVE_to_RESTRICTED
          - state_machines.Courier.RESTRICTED_to_BLACKLISTED
          - state_machines.Courier.RESTRICTED_to_ACTIVE   # reinstate cycle
          - state_machines.Courier.BLACKLISTED_to_ACTIVE
        distinguishing_aspect: |
          Courier is non-linear on a DIFFERENT entity than Parcel. Branching ACTIVE→{RESTRICTED, BLACKLISTED}
          with reinstate edges from BOTH RESTRICTED and BLACKLISTED back to ACTIVE forms a cycle, and the
          two forward edges have divergent gating side effects (RESTRICTED only blocks SMALL deposits at
          non-NORMAL machines; BLACKLISTED blocks all deposits).
        test_recipe:
          setup:
            - "Courier C in ACTIVE; 10 deposits with 1 wrong-deposit correction → window_wrong_deposit_rate=0.10"
          trigger:
            - "Auto cascade flips C to RESTRICTED"
            - "Resolve 5 disputes COURIER_AT_FAULT within 30d → BLACKLISTED"
            - "OperationsAdmin POST /couriers/{C.id}/reinstate (after wrong rate clears via /clock/advance pushing the bad week out of window)"
          assert:
            - "Path traversed: ACTIVE → RESTRICTED → BLACKLISTED → ACTIVE (cycle observed on the same courier)"
            - "On RESTRICTED: deposit with required_size=SMALL at NEAR_FULL machine returns ERR_COURIER_RESTRICTED"
            - "On BLACKLISTED: any deposit returns ERR_COURIER_BLACKLISTED"
            - "After reinstate: ACTIVE; deposits succeed again"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: wrong_deposit_correction_cascade_depth_3   # depth ≥ 3
        grounds:
          - state_machines.Parcel.DEPOSITED_to_WRONG_DEPOSIT_VOID
          - state_machines.Courier.ACTIVE_to_RESTRICTED
          - calculations.courier_quality_score
          - validations[priority=6]   # ERR_COURIER_BLACKLISTED gating
          - errors.ERR_COURIER_RESTRICTED
        distinguishing_aspect: |
          Trigger: courier POST /parcels/{id}/correct-wrong-deposit.
          Hop 1: Parcel.status DEPOSITED→WRONG_DEPOSIT_VOID, fee waived.
          Hop 2: that mutation increments Courier.lifetime_wrong_deposit_count → recomputes window_wrong_deposit_rate.
          Hop 3: rate >= 0.10 causes Courier.blacklist_status ACTIVE→RESTRICTED (a downstream mutation caused by hop 2's recomputed value).
          Each hop is caused by the previous one — not by the original action — yielding depth 3.
        test_recipe:
          setup:
            - "Courier C in ACTIVE with exactly 9 prior successful deposits in the 30-day window"
            - "C deposits parcel P (10th in window); confirm-deposit"
          trigger:
            - "POST /parcels/{P.id}/correct-wrong-deposit (within 900s grace)"
          assert:
            - "Hop1: Parcel(P).status == 'WRONG_DEPOSIT_VOID' AND P.fee_waived == true"
            - "Hop2: Courier(C).window_wrong_deposit_rate == 0.1000 (1/10)"
            - "Hop3: Courier(C).blacklist_status == 'RESTRICTED' (each hop triggered by previous)"
            - "Audit log records three distinct events: COMPARTMENT_OPEN, FEE_ADJUSTMENT, BLACKLIST_CHANGE"

      - name: long_stay_recall_cascade_depth_2          # depth ≥ 2 — DIFFERENT triggering transition
        grounds:
          - state_machines.Parcel.DEPOSITED_to_LONG_STAY     # initial trigger (sweep)
          - state_machines.Parcel.LONG_STAY_to_RECALLED       # courier action
          - state_machines.Compartment.OCCUPIED_to_AVAILABLE
          - calculations.compartment_occupancy_warning
        distinguishing_aspect: |
          Different originating trigger from the wrong-deposit cascade: here it is courier POST /parcels/{id}/recall
          on a LONG_STAY parcel.
          Hop 1: Parcel.status LONG_STAY→RECALLED.
          Hop 2: that mutation drives Compartment.status OCCUPIED→AVAILABLE which itself recomputes
          LockerMachine.capacity_warning_level (the recomputation is caused by the compartment's status
          change, not directly by the recall call).
        test_recipe:
          setup:
            - "Machine M with 5 SMALL compartments, 4 occupied, capacity_warning_level=NEAR_FULL (0.80 ratio)"
            - "One of the 4 parcels is in LONG_STAY (push deposited_at >168h via /_clock/advance + /_sweep/run)"
          trigger:
            - "Courier C POST /parcels/{P.id}/recall (within RECALL_WINDOW_HOURS, C is owner)"
          assert:
            - "Hop1: Parcel(P).status == 'RECALLED'"
            - "Hop2: Compartment(P.compartment_id).status == 'AVAILABLE' (caused by hop1)"
            - "Hop2-derived: GET /locker-machines/{M.id} returns capacity_warning_level == 'NORMAL' (recomputed; ratio drops to 0.60)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_blacklisted_courier_on_offline_machine
        grounds:
          - validations[priority=4]    # state: ERR_MACHINE_OFFLINE_DEGRADED
          - validations[priority=6]    # business_safety: ERR_COURIER_BLACKLISTED
          - errors.ERR_MACHINE_OFFLINE_DEGRADED
          - errors.ERR_COURIER_BLACKLISTED
        distinguishing_aspect: |
          Pair: state (priority 4) vs business_safety (priority 6). Both fail simultaneously; lower
          priority number wins — the test must observe ERR_MACHINE_OFFLINE_DEGRADED, NOT ERR_COURIER_BLACKLISTED.
        test_recipe:
          setup:
            - "Courier C is BLACKLISTED"
            - "Machine M forced OFFLINE via /locker-machines/{M.id}/offline (degraded_mode=true)"
          trigger:
            - "C POST /parcels with locker_machine_id=M.id"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_MACHINE_OFFLINE_DEGRADED' (state check wins over courier blacklist)"

      - name: business_fiscal_vs_business_constraint_unpaid_fee_with_invalid_code
        grounds:
          - validations[priority=11]   # business_safety: ERR_INVALID_PICKUP_CODE
          - validations[priority=12]   # business_fiscal: ERR_FEE_PAYMENT_REQUIRED
          - errors.ERR_INVALID_PICKUP_CODE
          - errors.ERR_FEE_PAYMENT_REQUIRED
        distinguishing_aspect: |
          Different pair of categories than instance #1: business_safety (priority 11, pickup-code auth)
          vs business_fiscal (priority 12, payment requirement). On /pickup-confirm with both an invalid
          re-auth attempt mid-flow and an unpaid fee, the safety check wins.
        test_recipe:
          setup:
            - "Parcel deposited 73 hours, recipient initiated pickup → PROVISIONAL fee=5000 cents UNPAID"
            - "Recipient calls /pickup-confirm without paying"
          trigger:
            - "Server checks: state precondition OK (PICKUP_PENDING), but a separate pickup-code recheck on this endpoint requires the bound recipient_phone match X-User-ID. If mismatch test sends a confused recipient_phone header, server should treat as invalid auth on the pickup channel."
            - "Concretely: caller POST /parcels/{id}/pickup-confirm with X-User-ID NOT equal to recipient_phone — server returns ERR_INVALID_PICKUP_CODE BEFORE evaluating fee gate"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_INVALID_PICKUP_CODE' (priority 11 wins over priority 12)"
            - "Fee record remains UNPAID — fee gate never evaluated"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: free_storage_24h_exact_boundary
        grounds:
          - calculations.overtime_fee_calc
          - calculations.overtime_fee_calc.constants  # FREE_HOURS=24
          - endpoints[POST /parcels/{parcelId}/initiate-pickup]
        distinguishing_aspect: |
          Numeric threshold metric: elapsed_hours == 24 yields zero fee (boundary inclusive of free
          period); elapsed_hours == 25 yields exactly 100 cents. Reachable via /parcels/{id}/initiate-pickup
          after /_clock/advance.
        test_recipe:
          setup:
            - "Deposit parcel at t0"
          trigger:
            - "Case A: POST /_clock/advance seconds=24*3600 → initiate-pickup → expect provisional_overtime_fee == 0"
            - "Case B: fresh parcel, advance 25*3600 → initiate-pickup → expect provisional_overtime_fee == 100"
          assert:
            - "Case A OvertimeFeeRecord.amount_cents == 0"
            - "Case B OvertimeFeeRecord.amount_cents == 100"
            - "ERR_FEE_PAYMENT_REQUIRED is NOT raised in case A on subsequent /pickup-confirm (zero fee path)"

      - name: capacity_full_block_ratio_exact_boundary
        grounds:
          - calculations.compartment_occupancy_warning
          - calculations.compartment_occupancy_warning.constants  # FULL_BLOCK_RATIO=0.95
          - endpoints[POST /parcels]
          - errors.ERR_CAPACITY_BLOCKED
        distinguishing_aspect: |
          Different metric (occupancy ratio, empty/aggregate) on a DIFFERENT endpoint (POST /parcels).
          ratio == 0.95 BLOCKS deposit; ratio == 0.94999… (e.g., 18/20=0.90) NEAR_FULL but allows.
        test_recipe:
          setup:
            - "Machine M with 20 SMALL compartments, 19 OCCUPIED (ratio = 0.95 exactly)"
          trigger:
            - "Courier C POST /parcels locker_machine_id=M.id required_size=SMALL"
          assert:
            - "Response status == 409"
            - "data.error_id == 'ERR_CAPACITY_BLOCKED'"
            - "Mark one parcel PICKED_UP via the full deposit/pickup flow → 18 OCCUPIED → ratio=0.90"
            - "Retry deposit: succeeds with 201; new compartment becomes RESERVED"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: parcel_pickup_depends_on_overtime_fee_record_payment_status
        grounds:
          - state_machines.Parcel.PICKUP_PENDING_to_PICKED_UP
          - state_machines.OvertimeFeeRecord.UNPAID_to_PAID
          - validations[priority=12]
          - errors.ERR_FEE_PAYMENT_REQUIRED
        distinguishing_aspect: |
          Pair: Parcel ↔ OvertimeFeeRecord. Parcel cannot transition PICKUP_PENDING→PICKED_UP unless
          the latest PROVISIONAL OvertimeFeeRecord has payment_status==PAID (or the parcel is fee_waived).
          Different pair from instance #2.
        test_recipe:
          setup:
            - "Parcel P deposited 73h ago; recipient /initiate-pickup → PROVISIONAL fee=5000 UNPAID"
          trigger:
            - "Recipient POST /parcels/{P.id}/pickup-confirm WITHOUT paying"
          assert:
            - "Response 402 with error_id == 'ERR_FEE_PAYMENT_REQUIRED'"
            - "Parcel.status remains PICKUP_PENDING"
            - "After POST /events/emit payment_succeeded → fee.payment_status == 'PAID'"
            - "Retry pickup-confirm → 200 with Parcel.status == 'PICKED_UP'"

      - name: deposit_depends_on_locker_machine_degraded_mode
        grounds:
          - state_machines.LockerMachine.ONLINE_to_OFFLINE
          - state_machines.Parcel  # initial deposit precondition
          - validations[priority=4]
          - errors.ERR_MACHINE_OFFLINE_DEGRADED
        distinguishing_aspect: |
          Different pair: Parcel ↔ LockerMachine. Parcel creation (DRAFT) depends on the parent machine's
          degraded_mode==false. The check is on the LockerMachine entity, not the OvertimeFeeRecord, so
          this is a structurally distinct cross-entity pair.
        test_recipe:
          setup:
            - "Machine M, with available compartments"
            - "OperationsAdmin POST /locker-machines/{M.id}/offline (degraded_mode=true)"
          trigger:
            - "Courier POST /parcels locker_machine_id=M.id"
          assert:
            - "Response 409 with error_id == 'ERR_MACHINE_OFFLINE_DEGRADED'"
            - "POST /locker-machines/{M.id}/heartbeat with firmware_version >= MIN_FIRMWARE_VERSION → online_status=ONLINE, degraded_mode=false"
            - "Retry deposit → 201; Compartment becomes RESERVED"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: compartment_single_occupancy_invariant
        grounds:
          - concurrency_rules[two-couriers-deposit-same-compartment]
          - state_machines.Compartment.AVAILABLE_to_RESERVED
          - errors.ERR_COMPARTMENT_ALREADY_RESERVED
          - entities.Compartment.fields.current_parcel_id
        distinguishing_aspect: |
          Interval semantics: a Compartment supports AT MOST ONE active Parcel at any instant
          (point-in-time exclusion — half-open interval [reserved_at, released_at) cannot overlap
          with any other parcel's interval on the same compartment).
        test_recipe:
          setup:
            - "Machine M with one MEDIUM Compartment in AVAILABLE"
            - "Two couriers C1, C2 both attempting deposits"
          trigger:
            - "C1 POST /parcels (selects the compartment, RESERVED)"
            - "C2 POST /parcels concurrently (no other compartment matches MEDIUM)"
          assert:
            - "C1 receives 201"
            - "C2 receives 409 with error_id in {'ERR_COMPARTMENT_ALREADY_RESERVED','ERR_NO_COMPARTMENT_FITS'} — when compartment was selected by C1, no MEDIUM remains so the loser sees ERR_NO_COMPARTMENT_FITS or ERR_COMPARTMENT_ALREADY_RESERVED depending on race timing"
            - "Compartment.current_parcel_id resolves to exactly one parcel id"

      - name: settlement_window_no_overlap_per_partner
        grounds:
          - state_machines.SettlementBatch.DRAFT_to_LOCKED
          - entities.SettlementBatch.fields.period_start
          - entities.SettlementBatch.fields.period_end
          - validations[priority=13]
          - errors.ERR_PENDING_FEES_IN_WINDOW
          - errors.ERR_PERIOD_NOT_CLOSED
        distinguishing_aspect: |
          Different interval semantics from the compartment case: this is a half-open AGGREGATE-CAPACITY
          window [period_start, period_end) over OvertimeFeeRecord rows for one partner. Adjacency is
          ALLOWED (one batch ending at T can sit beside another starting at T) but overlap is rejected
          via the pending-fees check + period_end<=now() guard. Different resource (SettlementBatch),
          different geometric treatment.
        test_recipe:
          setup:
            - "Partner P with two LockerMachines"
            - "Batch B1 created with [t0, t10) and locked successfully (gross=100 cents PAID)"
            - "Now ingest a payment_succeeded event for a parcel whose fee.created_at falls in [t10, t20) → fee record PAID"
            - "Create Batch B2 with [t10, t20) — adjacent boundary"
          trigger:
            - "POST /settlements/{B2.id}/lock when period_end == now"
          assert:
            - "B2 lock returns 200; the adjacent boundary [t10, t20) does not overlap [t0, t10) (half-open)"
            - "Try to create Batch B3 with [t5, t15) → on lock attempt, server returns 409 with ERR_PENDING_FEES_IN_WINDOW because window includes already-settled fees that span across B1's range"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compartment_occupancy_count_invariant_under_recall
        grounds:
          - state_machines.Parcel.DEPOSITED_to_LONG_STAY
          - state_machines.Parcel.LONG_STAY_to_RECALLED
          - state_machines.Compartment.OCCUPIED_to_AVAILABLE
          - entities.LockerMachine.fields.occupied_count_small
          - entities.LockerMachine.fields.occupied_count_medium
          - entities.LockerMachine.fields.occupied_count_large
        distinguishing_aspect: |
          Conserved quantity: per-size occupied_count on a LockerMachine. The forward action (deposit
          confirm-deposit) increments occupied_count_<size> by 1; the compensating action (recall on a
          LONG_STAY parcel) decrements it by 1. The named invariant pinned as a formula:
              occupied_count_<size> == count(Compartments WHERE size==<size> AND status=='OCCUPIED')
          and after deposit→…→recall the value MUST equal what it was before deposit.
        test_recipe:
          setup:
            - "Machine M; baseline occupied_count_medium == 0"
            - "Courier C deposits a MEDIUM parcel → confirm-deposit; occupied_count_medium == 1"
            - "Advance clock past LONG_STAY_THRESHOLD_HOURS; POST /_sweep/run → parcel LONG_STAY"
          trigger:
            - "C POST /parcels/{id}/recall"
          assert:
            - "Final GET /locker-machines/{M.id}.occupied_count_medium == 0 (returned to baseline)"
            - "Invariant: count(Compartments size=='MEDIUM' AND status=='OCCUPIED') == occupied_count_medium"
            - "No drift: total_compartments unchanged"

      - name: settlement_partner_plus_platform_equals_net_invariant
        grounds:
          - calculations.settlement_revenue_split
          - entities.SettlementBatch.fields.partner_share_cents
          - entities.SettlementBatch.fields.platform_share_cents
          - entities.SettlementBatch.fields.net_revenue_cents
          - state_machines.OvertimeFeeRecord.PAID_to_REFUNDED
        distinguishing_aspect: |
          Different conserved quantity: monetary cents in net_revenue_cents. Forward: payment of FINAL fee
          adds amount to gross. Compensating: refund subtracts. Named invariant pinned as a formula:
              partner_share_cents + platform_share_cents == net_revenue_cents
          MUST hold for every recompute under any combination of payments and refunds within window.
        test_recipe:
          setup:
            - "Partner P; one parcel with FINAL fee 333 cents PAID; another FINAL 100 cents PAID"
            - "Refund the second one via POST /events/emit payment_refunded → record REFUNDED"
            - "POST /settlements partner_id=P period covering both events"
          trigger:
            - "GET /settlements/{batchId}"
          assert:
            - "gross_overtime_revenue_cents == 333  (refunded 100 excluded from gross because state is REFUNDED at compute time)"
            - "refund_reversal_cents == 100"
            - "net_revenue_cents == 233"
