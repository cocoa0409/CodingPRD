              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Riverbend Rotary", contact_email: "rotary@example.org", organization_type: "LOCAL_ORGANIZATION" }
              as: VenueAdmin
              captures: { cl_rr_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings/${bk_ssp_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_ssp_id: $.data.id }
          trigger:
            - call: "GET /convention-center/licenses/${lic_ssp_id}"
              payload: {}
              as: Licensee
              as_user_id: "${cl_rr_id}"
            - call: "GET /convention-center/clients/${cl_ssp_id}"
              payload: {}
              as: Licensee
              as_user_id: "${cl_rr_id}"
          assert:
            - "both triggers return 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "the same GET on ${lic_ssp_id} as Licensee with X-User-ID ${cl_ssp_id} returns 200"
            - "the same GET on ${lic_ssp_id} as VenueAdmin returns 200 because the opaque roles carry no ownership edge"
            - "neither refusal reports ERR_LICENSE_NOT_FOUND, so existence is not leaked as absence"

      - name: shared_booking_read_allowed_for_five_internal_roles_and_the_owner
        claim_type: shared_operations_allowed
        grounds:
          - rbac.roles.VenueAdmin.shared_operations
          - rbac.roles.SalesManager.shared_operations
          - rbac.roles.EventServicesManager.shared_operations
          - rbac.roles.SettlementAnalyst.shared_operations
          - rbac.roles.FacilitiesPlanner.shared_operations
          - rbac.roles.Licensee.shared_operations
          - endpoints[GET /convention-center/bookings/{id}]
        distinguishing_aspect: |
          The booking record is the shared spine of the whole model, so all six roles read
          the same row by id, and every one of them sees the identical computed money
          figures. The listing endpoint is narrower than the read-by-id endpoint: the owner
          cannot enumerate bookings, only fetch the one it is party to, which distinguishes
          a shared read from a shared collection.
        test_recipe:
          setup:
            - "a Meeting Room 301 CONSUMER_SHOW booking exists with contracted_rental_cents 363600 and deposit_required_cents 90900"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
