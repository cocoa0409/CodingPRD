      - name: endorsement_round_blocked_until_required_sessions_complete
        grounds:
          - validations.priority_40_ERR_ENGAGEMENT_INCOMPLETE
          - validations.priority_41_ERR_NO_SCREENED_PROJECTS
          - state_machines.PlanCycle.ENGAGEMENT_to_ENDORSEMENT_ROUND
          - state_machines.EngagementSession.SCHEDULED_to_COMPLETED
          - entities.PlanCycle.fields.required_session_count
        distinguishing_aspect: |
          The blocking condition is a COUNT over sibling rows measured against a per-cycle
          configuration field rather than a single foreign row's state: the cycle demands two
          COMPLETED EngagementSessions and has one COMPLETED plus one SCHEDULED. Completing the
          second session — an operation on a different entity, performed by a different role, that
          names neither the cycle transition nor the project — is what unblocks the transition.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and one PlanCycle with required_session_count 2 and quorum_weight_bps 6600."
            - "One AdaptationProject already screened to SCREENED_IN, so priority 41 can never be the reason for a rejection."
            - "EngagementSession S1 hosted by that jurisdiction over [2026-09-10T17:00:00Z, 2026-09-10T20:00:00Z] already COMPLETED with equity_reach_bps 5833."
            - "EngagementSession S2 hosted by the same jurisdiction over [2026-09-12T00:00:00Z, 2026-09-12T02:00:00Z], which clears the 24-hour session buffer, still in status SCHEDULED."
            - "The cycle has been advanced DRAFT -> ENGAGEMENT."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 2 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
              payload: { host_jurisdiction_id: "${j_harbor_id}", modality: "IN_PERSON", window_start: "2026-09-10T17:00:00Z", window_end: "2026-09-10T20:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /resilience/engagement-sessions/${s1_id}/complete"
              payload: { attendee_count: 120, disadvantaged_attendee_count: 70, preferred_strategy_type: "PROTECT" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
              payload: { host_jurisdiction_id: "${j_harbor_id}", modality: "VIRTUAL", window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-12T02:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-engagement"
              payload: {}
              as: RegionalAdministrator
          trigger:
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-endorsement-round"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/engagement-sessions/${s2_id}/complete"
              payload: { attendee_count: 80, disadvantaged_attendee_count: 10, preferred_strategy_type: "PROTECT" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-endorsement-round"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "the first trigger call returns 409 with error_id ERR_ENGAGEMENT_INCOMPLETE at one COMPLETED session against required_session_count 2"
            - "PlanCycle.${cycle_id}.status is still ENGAGEMENT and round_number is still 0 after the rejection"
            - "EngagementSession.${s2_id}.status == COMPLETED and equity_reach_bps == 1250 after the second trigger call"
            - "EngagementSession.${s1_id}.equity_reach_bps == 5833 is unchanged"
            - "the third trigger call returns 200 and PlanCycle.${cycle_id}.status == ENDORSEMENT_ROUND with round_number == 1 and revision_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: session_closed_interval_plus_buffer_blocks_a_host_jurisdiction
        grounds:
          - calculations.session_window_conflict
          - validations.priority_45_ERR_SESSION_WINDOW_CONFLICT
          - endpoints.post_plan_cycle_engagement_sessions
          - entities.EngagementSession.fields.host_jurisdiction_id
        distinguishing_aspect: |
          Occupancy here is CLOSED [window_start, window_end] widened by a symmetric 24-hour travel
          buffer and scoped per host_jurisdiction_id, so a booking that begins at exactly
          2026-09-11T20:00:00Z — precisely 24 hours after the incumbent session ends — is rejected
          because the comparison is <=, while the byte-identical window is admitted for a different
          host. This is the opposite endpoint convention from the mutual-aid instance, which admits
          exact adjacency under half-open windows.
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions and one DRAFT PlanCycle."
            - "One EngagementSession S1 hosted by the first jurisdiction over [2026-09-10T17:00:00Z, 2026-09-10T20:00:00Z] in status SCHEDULED."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 1 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
              payload: { host_jurisdiction_id: "${j_harbor_id}", modality: "IN_PERSON", window_start: "2026-09-10T17:00:00Z", window_end: "2026-09-10T20:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
              payload: { host_jurisdiction_id: "${j_harbor_id}", modality: "HYBRID", window_start: "2026-09-11T20:00:00Z", window_end: "2026-09-11T22:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
              payload: { host_jurisdiction_id: "${j_ridge_id}", modality: "HYBRID", window_start: "2026-09-11T20:00:00Z", window_end: "2026-09-11T22:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { s_ridge_id: $.data.id }
            - call: "POST /resilience/plan-cycles/${cycle_id}/engagement-sessions"
              payload: { host_jurisdiction_id: "${j_harbor_id}", modality: "VIRTUAL", window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-12T02:00:00Z" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { s_late_id: $.data.id }
          assert:
            - "the first trigger call returns 409 with error_id ERR_SESSION_WINDOW_CONFLICT, because 2026-09-11T20:00:00Z <= 2026-09-10T20:00:00Z + 24h holds with equality"
            - "the second trigger call returns 201 for the identical window under a different host_jurisdiction_id, proving occupancy is scoped per host"
            - "EngagementSession.${s_ridge_id}.host_jurisdiction_id == ${j_ridge_id} and status == SCHEDULED"
            - "the third trigger call returns 201, because 2026-09-12T00:00:00Z is past the buffered end 2026-09-11T20:00:00Z"
            - "EngagementSession.${s_late_id}.status == SCHEDULED, equity_reach_bps == null and preferred_strategy_type == null while SCHEDULED"
            - "EngagementSession.${s1_id}.status == SCHEDULED is unchanged by any of the three calls"

      - name: aid_commitment_half_open_windows_admit_exact_adjacency_at_the_pledge
        grounds:
          - calculations.aid_peak_overlap_capacity
          - calculations.aid_unit_ledger
          - validations.priority_48_ERR_AID_CAPACITY_EXCEEDED
          - state_machines.MutualAidCommitment.COMMITTED_to_RELEASED
          - entities.MutualAidPact.fields.reserved_units
        distinguishing_aspect: |
          Capacity is an aggregate PEAK over half-open [window_start, window_end) intervals, not a
          pairwise check and not a running sum: three individually admissible commitments breach
          pledged_units 10 at 2026-09-12 with load 11, while a 10-unit commitment starting at exactly
          the instant a 4-unit commitment ends is admitted at load exactly 10. Touching endpoints do
          NOT collide here, which is the inverse of the buffered closed-interval session rule.
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions and one LifelineAsset with is_shared true."
            - "One OPEN MutualAidPact with pledged_units 10, max_concurrent_commitments 4 and window [2026-09-01, 2026-10-01), so the concurrency count never becomes the binding constraint."
            - "Two COMMITTED MutualAidCommitments of 4 units each over [2026-09-05, 2026-09-15) and [2026-09-10, 2026-09-20), giving reserved_units 8 and free_units 2."
