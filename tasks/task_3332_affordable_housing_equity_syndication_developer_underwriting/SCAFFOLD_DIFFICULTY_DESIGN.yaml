              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
