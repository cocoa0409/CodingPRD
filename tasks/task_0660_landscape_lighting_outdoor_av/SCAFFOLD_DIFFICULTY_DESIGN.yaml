              as: LightingDesigner
              captures: { fx_i9a: $.data.id }
            - call: "POST /fixtures/${fx_i9a}/assign-zone"
              payload: { zone_id: "${zone_i9a}", expected_transformer_version: "${tx_i9a_v}" }
              as: LightingDesigner
            - call: "POST /projects/${proj_i9a}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes"
              payload: { project_id: "${proj_i9a}" }
              as: LightingDesigner
              captures: { q_i9a: $.data.id }
            - call: "POST /quotes/${q_i9a}/lines"
              payload: { model_code: "SPOT-80", quantity: 1, unit_price_cents: 9000 }
              as: LightingDesigner
            - call: "POST /quotes/${q_i9a}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_i9a}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_i9a}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_i9a}", quote_id: "${q_i9a}" }
              as: InstallTech
              captures: { job_i9a: $.data.id }
            - call: "POST /install-jobs/${job_i9a}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_i9a}/complete-wiring"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_i9a}/complete-fixtures"
              payload: {}
              as: InstallTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /warranty-claims"
              payload: { fixture_id: "${fx_i9a}", project_id: "${proj_i9a}", reason: "Out" }
              as: Customer
              as_user_id: "${cust_i9a}"
              captures: { claim_i9a: $.data.id }
          trigger:
