# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# safe-deposit-private-vault — Expert
# Nine Difficulty Rules, >= 2 instances each (18 total).
# All amounts in cents. Logical-clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: surrender_refund_provisional_vs_final
        grounds:
          - calculations.surrender_refund
          - state_machines.Rental.ACTIVE_to_SURRENDER_PENDING
          - state_machines.Rental.SURRENDER_PENDING_to_CLOSED
          - entities.Rental.fields.provisional_refund_cents
          - entities.Rental.fields.final_refund_cents
        distinguishing_aspect: |
          Same Rental (annual_rate 24000, 12mo, start 2026-05-01, surrender clock 2026-08-10):
          the provisional variant (whole-month basis) yields 16000 while the final variant
          (exact-day basis) yields 17359 — two valid algorithms on the Rental domain diverge.
        test_recipe:
          setup:
            - "Branch, MEDIUM box-type (annual_rate_cents=24000), box, verified renter, rental (12mo, no rider)."
            - "Rental ACTIVE with first invoice (24000) paid in full → balance 0; clock at 2026-08-10 (101 days elapsed)."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Downtown", code: "DT1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "A-101" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Ada Vault", email: "ada@x.com", gov_id_ref: "G-1", date_of_birth: "1980-01-01" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: { decision: "VERIFY" }, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", amount_cents: 24000, method: "WIRE" }, as: BillingClerk, captures: { pay_id: "$.data.id" } }
            - { call: "POST /vault/payments/${pay_id}/clear", payload: {}, as: BillingClerk }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/rentals/${rental_id}/request-surrender", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/rentals/${rental_id}/close", payload: {}, as: VaultAdmin }
          assert:
            - "Rental(${rental_id}).provisional_refund_cents == 16000"
            - "Rental(${rental_id}).final_refund_cents == 17359"
            - "Rental(${rental_id}).status == CLOSED"

      - name: metal_valuation_declared_vs_appraised
        grounds:
          - calculations.metal_valuation
          - state_machines.InventoryItem.DECLARED_to_APPRAISED
          - entities.InventoryItem.fields.declared_value_cents
          - entities.InventoryItem.fields.appraised_value_cents
        distinguishing_aspect: |
          Same PRECIOUS_METAL item: declared basis = 50017 (renter figure) vs appraised basis =
          round(100 * 0.9999 * 7000) = 699930 (weight*purity*spot). Dual variant on the
          InventoryItem domain — a different entity domain than surrender_refund (Rental).
        test_recipe:
          setup:
            - "Rental ACTIVE with one PRECIOUS_METAL InventoryItem DECLARED (declared_value_cents=50017, weight 100g, purity 0.9999)."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Downtown", code: "DT2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "A-102" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Ben Gold", email: "ben@x.com", gov_id_ref: "G-2", date_of_birth: "1975-03-03" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/inventory-items", payload: { rental_id: "${rental_id}", description: "Gold bar", category: "PRECIOUS_METAL", metal_type: "GOLD", weight_grams: 100, purity: 0.9999, declared_value_cents: 50017 }, as: VaultOfficer, captures: { item_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/inventory-items/${item_id}/appraise", payload: { spot_price_per_gram_cents: 7000 }, as: VaultOfficer }
          assert:
            - "InventoryItem(${item_id}).declared_value_cents == 50017"
            - "InventoryItem(${item_id}).appraised_value_cents == 699930"
            - "InventoryItem(${item_id}).status == APPRAISED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_charge_per_component_rounding
        grounds:
          - calculations.invoice_charge_rounding
          - state_machines.Rental.PENDING_to_ACTIVE
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.insurance_rider_cents
          - entities.Invoice.fields.precious_metal_surcharge_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order. rider=round(100033*0.015)=1500, surcharge=round(50017*0.005)=250,
          base=24000 → per-component-then-sum total = 25750. Sum-then-round would give 25751; the scaffold
          pins per-component rounding, so 25750 is the only correct answer.
        test_recipe:
          setup:
            - "Rental (rider enabled, declared_contents_value_cents=100033) with one PRECIOUS_METAL item (declared_value_cents=50017) declared BEFORE activation."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Midtown", code: "MT1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "B-201" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Cora Mint", email: "cora@x.com", gov_id_ref: "G-3", date_of_birth: "1990-05-05" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12, insurance_rider_enabled: true, declared_contents_value_cents: 100033 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/inventory-items", payload: { rental_id: "${rental_id}", description: "Gold coin", category: "PRECIOUS_METAL", metal_type: "GOLD", weight_grams: 50, purity: 0.999, declared_value_cents: 50017 }, as: VaultOfficer }
          trigger:
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "GET /vault/invoices?rental_id=${rental_id}", payload: {}, as: Any, captures: { inv_total: "$.data[0].total_cents" } }
          assert:
            - "Invoice(rental=${rental_id}).base_rent_cents == 24000"
            - "Invoice(rental=${rental_id}).insurance_rider_cents == 1500"
            - "Invoice(rental=${rental_id}).precious_metal_surcharge_cents == 250"
            - "Invoice(rental=${rental_id}).total_cents == 25750"

      - name: late_fee_tiered_size_clamp
        grounds:
          - calculations.late_fee_escalation
          - state_machines.Rental.PAST_DUE_to_DELINQUENT
          - entities.Invoice.fields.late_fee_cents
        distinguishing_aspect: |
          Mode (a) non-linear ≥3 inputs. At days_past_due=40 (tier2 rate 0.10), outstanding 24000,
          MEDIUM size_multiplier 1.25 → raw 3000; inside [2500,25000] clamp → late_fee_cents == 3000.
          Three inputs (tier, balance, multiplier) interact then clamp — different combinatorial mode than 2a.
        test_recipe:
          setup:
            - "Rental ACTIVE with unpaid first invoice (24000, issued 2026-05-01, due 2026-05-31); clock at 2026-07-10 (dpd=40)."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Midtown", code: "MT2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "B-202" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Dan Late", email: "dan@x.com", gov_id_ref: "G-4", date_of_birth: "1988-08-08" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
          assert:
            - "Invoice(rental=${rental_id}).late_fee_cents == 3000"
            - "Rental(${rental_id}).status == DELINQUENT"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_delinquent_cure_cycle
        grounds:
          - state_machines.Rental.PAST_DUE_to_DELINQUENT
          - state_machines.Rental.DELINQUENT_to_ACTIVE
          - state_machines.Box.DELINQUENT_to_RENTED
        distinguishing_aspect: |
          Rental is cyclic: ACTIVE → DELINQUENT (billing) → ACTIVE (payment cure). A linear pipeline
          could not return to ACTIVE. The cure loop is on the Rental entity.
        test_recipe:
          setup:
            - "Rental DELINQUENT at dpd=15 (clock 2026-06-15), late_fee 2500 clamped → balance 26500, box DELINQUENT."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Uptown", code: "UP1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "C-301" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Eve Cure", email: "eve@x.com", gov_id_ref: "G-5", date_of_birth: "1979-09-09" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", amount_cents: 26500, method: "WIRE" }, as: BillingClerk, captures: { pay_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/payments/${pay_id}/clear", payload: {}, as: BillingClerk }
          assert:
            - "Rental(${rental_id}).status == ACTIVE"
            - "Box(${box_id}).status == RENTED"

      - name: drilling_order_branch_fork
        grounds:
          - state_machines.DrillingOrder.SCHEDULED_to_DRILLED
          - state_machines.DrillingOrder.APPROVED_to_CANCELLED
          - state_machines.DrillingOrder.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          DrillingOrder forks REQUESTED→APPROVED→SCHEDULED→{DRILLED | CANCELLED} with divergent side
          effects: the DRILLED branch abandons the rental and drills the box; the CANCELLED branch leaves
          box/rental untouched (SCHEDULED→CANCELLED restores box to DELINQUENT). Branching on DrillingOrder,
          a different entity than the cyclic Rental in 3a.
        test_recipe:
          setup:
            - "Rental DELINQUENT (clock 2026-07-10, billing run); DrillingOrder REQUESTED (admin-1) → APPROVED (comp-1) → SCHEDULED (box DRILL_PENDING)."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Uptown", code: "UP2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "C-302" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Fay Drill", email: "fay@x.com", gov_id_ref: "G-6", date_of_birth: "1970-07-07" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/drilling-orders", payload: { box_id: "${box_id}", rental_id: "${rental_id}", reason: "DELINQUENCY" }, as: VaultAdmin, as_user_id: "admin-1", captures: { drill_id: "$.data.id" } }
            - { call: "POST /vault/drilling-orders/${drill_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /vault/drilling-orders/${drill_id}/schedule", payload: { scheduled_at: "2026-07-11T09:00:00Z" }, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/drilling-orders/${drill_id}/complete", payload: { proceeds_cents: 0 }, as: VaultAdmin }
          assert:
            - "DrillingOrder(${drill_id}).status == DRILLED"
            - "Box(${box_id}).status == DRILLED"
            - "Rental(${rental_id}).status == ABANDONED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: drilling_complete_depth4_cascade
        grounds:
          - state_machines.DrillingOrder.SCHEDULED_to_DRILLED
          - state_machines.Box.DRILL_PENDING_to_DRILLED
          - state_machines.Rental.DELINQUENT_to_ABANDONED
          - state_machines.AccessGrant.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the previous: complete → DrillingOrder DRILLED →
          Box DRILLED → Rental ABANDONED → AccessGrant REVOKED. Not a fan-out; every hop is caused
          by its predecessor. Trigger = drilling complete.
        test_recipe:
          setup:
            - "Rental ACTIVE with an ACTIVE CO_RENTER AccessGrant; rental then DELINQUENT; DrillingOrder SCHEDULED."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Harbor", code: "HB1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "D-401" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Gus Chain", email: "gus@x.com", gov_id_ref: "G-7", date_of_birth: "1965-01-02" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/access-grants", payload: { rental_id: "${rental_id}", grant_type: "CO_RENTER", grantee_name: "Jo Deputy", dual_control_required: true }, as: VaultAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /vault/access-grants/${grant_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/drilling-orders", payload: { box_id: "${box_id}", rental_id: "${rental_id}", reason: "DELINQUENCY" }, as: VaultAdmin, as_user_id: "admin-1", captures: { drill_id: "$.data.id" } }
            - { call: "POST /vault/drilling-orders/${drill_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /vault/drilling-orders/${drill_id}/schedule", payload: { scheduled_at: "2026-07-11T09:00:00Z" }, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/drilling-orders/${drill_id}/complete", payload: { proceeds_cents: 0 }, as: VaultAdmin }
          assert:
            - "DrillingOrder(${drill_id}).status == DRILLED"
            - "Box(${box_id}).status == DRILLED"
            - "Rental(${rental_id}).status == ABANDONED"
            - "AccessGrant(${grant_id}).status == REVOKED"

      - name: payment_cure_depth2_cascade
        grounds:
          - state_machines.Payment.INITIATED_to_CLEARED
          - state_machines.Rental.DELINQUENT_to_ACTIVE
          - state_machines.Box.DELINQUENT_to_RENTED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (payment clear): clear → Rental cure (DELINQUENT→ACTIVE)
          → Box RENTED. Each hop caused by the previous; origin transition differs from the depth-4
          drilling cascade in 4a.
        test_recipe:
          setup:
            - "Rental DELINQUENT at dpd=15 (clock 2026-06-15, billing run), balance 26500, box DELINQUENT; payment 26500 INITIATED."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Harbor", code: "HB2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "D-402" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Hal Fix", email: "hal@x.com", gov_id_ref: "G-8", date_of_birth: "1983-04-04" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", amount_cents: 26500, method: "WIRE" }, as: BillingClerk, captures: { pay_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/payments/${pay_id}/clear", payload: {}, as: BillingClerk }
          assert:
            - "Rental(${rental_id}).status == ACTIVE"
            - "Box(${box_id}).status == RENTED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_compliance_hold_beats_state
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.AccessAppointment.BOOKED_to_CHECKED_IN
          - errors[ERR_COMPLIANCE_HOLD]
          - errors[ERR_RENTAL_NOT_ACCESSIBLE]
        distinguishing_aspect: |
          Check-in of a BOOKED appointment whose rental is DELINQUENT (state fail, ERR_RENTAL_NOT_ACCESSIBLE
          priority 6) AND whose renter has an open HOLD compliance case (safety fail, ERR_COMPLIANCE_HOLD
          priority 5). Safety precedes state → ERR_COMPLIANCE_HOLD wins. Category pair: business_safety vs state.
        test_recipe:
          setup:
            - "Rental ACTIVE with a BOOKED future appointment; rental driven to DELINQUENT; renter under an open HOLD compliance case."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Central", code: "CN1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "E-501" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Ivy Hold", email: "ivy@x.com", gov_id_ref: "G-9", date_of_birth: "1991-11-11" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/access-appointments", payload: { box_id: "${box_id}", rental_id: "${rental_id}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }, as: VaultOfficer, captures: { appt_id: "$.data.id" } }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/compliance-cases", payload: { renter_id: "${renter_id}", case_type: "SANCTIONS", severity: "HOLD" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /vault/access-appointments/${appt_id}/check-in", payload: {}, as: VaultOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_COMPLIANCE_HOLD"
            - "http_status == 409"
            - "AccessAppointment(${appt_id}).status == BOOKED"

      - name: booking_temporal_beats_referential
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.AccessAppointment.BOOKED_to_CHECKED_IN
          - errors[ERR_APPOINTMENT_IN_PAST]
          - errors[ERR_GRANT_RENTAL_MISMATCH]
        distinguishing_aspect: |
          Booking an appointment for rentalA with scheduled_start in the past (temporal fail, priority 7)
          AND grant_id belonging to rentalB (referential fail, priority 9). Temporal precedes referential
          → ERR_APPOINTMENT_IN_PAST wins. Category pair: business_temporal vs business_referential — a
          different pair than 5a.
        test_recipe:
          setup:
            - "rentalA ACTIVE on boxA; rentalB ACTIVE on boxB with a PENDING grant grantB; clock at default 2026-05-01."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Central", code: "CN2", viewing_room_capacity: 4 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "E-511" }, as: VaultAdmin, captures: { boxA_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "E-512" }, as: VaultAdmin, captures: { boxB_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Kip A", email: "kipa@x.com", gov_id_ref: "G-10", date_of_birth: "1980-02-02" }, as: VaultAdmin, captures: { renterA_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renterA_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/renters", payload: { full_name: "Kip B", email: "kipb@x.com", gov_id_ref: "G-11", date_of_birth: "1981-03-03" }, as: VaultAdmin, captures: { renterB_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renterB_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${boxA_id}", renter_id: "${renterA_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rentalA_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rentalA_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/rentals", payload: { box_id: "${boxB_id}", renter_id: "${renterB_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rentalB_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rentalB_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/access-grants", payload: { rental_id: "${rentalB_id}", grant_type: "CO_RENTER", grantee_name: "Other Person" }, as: VaultAdmin, captures: { grantB_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/access-appointments", payload: { box_id: "${boxA_id}", rental_id: "${rentalA_id}", scheduled_start: "2026-04-15T10:00:00Z", scheduled_end: "2026-04-15T11:00:00Z", grant_id: "${grantB_id}" }, as: VaultOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_APPOINTMENT_IN_PAST"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_boundary_15_days
        grounds:
          - calculations.late_fee_escalation
          - state_machines.Rental.PAST_DUE_to_DELINQUENT
          - entities.Rental.fields.status
        distinguishing_aspect: |
          Metric = days_past_due. Invoice due 2026-05-31; at clock 2026-06-15 days_past_due == 15 ==
          DELINQUENCY_GRACE_DAYS → DELINQUENT (>= boundary). At dpd 14 it stays PAST_DUE. Reached via
          POST /vault/_billing/run_cycle.
        test_recipe:
          setup:
            - "Rental ACTIVE, unpaid first invoice due 2026-05-31; clock advanced to exactly dpd=15 (2026-06-15)."
          setup_api_calls:
