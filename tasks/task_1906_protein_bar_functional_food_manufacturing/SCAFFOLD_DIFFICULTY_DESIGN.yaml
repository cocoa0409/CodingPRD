            - { call: "POST /mfg/shelf-life-studies", payload: { revision_id: "${rs}", chamber_id: "CH1", shelf_position: "P1", start_utc: "2026-10-31T00:00:00Z", expiry_utc: "2027-01-15T00:00:00Z", hardness_limit_n: 200.0 }, as: LabTechnician, captures: { st3: "$.data.id" } }
          assert:
            - "start == other's expiry_utc on the same (chamber, position): ERR_CHAMBER_POSITION_OCCUPIED (409) — closed interval, expiry inclusive"
            - "same instant on a different position P2: created (capacity is per position)"
            - "start one day after the inclusive end (2026-10-31) on P1: created"

  - rule_id: compensating_invariant
