            - call: "POST /dog-shows/classes/${cb_id}/complete"
              payload: { placements: ["${eb1_id}"] }
              as: Judge
              as_user_id: "${j1_id}"
          assert:
            - "ShowClass.${ca_id}.counted_dog_count == 2"
            - "ShowClass.${ca_id}.base_points == 1"
            - "Entry.${ea1_id}.points_awarded == 1"
            - "Dog.${d1_id}.championship_points_total == 1"
            - "Dog.${d1_id}.majors_count == 0"
            - "ShowClass.${cb_id}.counted_dog_count == 1"
            - "ShowClass.${cb_id}.base_points == 0"
            - "Entry.${eb1_id}.points_awarded == 0"
            - "Dog.${d3_id}.championship_points_total == 0"
            - "Show.${show_id}.points_awarded_total == 1"
  - rule_id: combinatorial_formula
    instances:
      - name: catalog_levy_rounded_per_entry_then_summed
        grounds:
          - calculations.entry_fee_assessment
          - entities.Entry.fields.levy_cents
          - entities.Show.fields.levy_total_cents
          - state_machines.Entry.RECEIVED_to_CONFIRMED
        distinguishing_aspect: |
            Mode b - order of operations. The levy is 7.5% of a 3500-cent base, i.e. exactly 262.5 cents, so
            the rounding ORDER is observable: round_half_up per entry first and then sum gives 263 * 3 = 789,
            while summing the unrounded 787.5 and rounding once gives 788. The one-cent gap is the whole
            assertion, and it also pins that the show ledger never re-rounds an already-rounded per-entry value.

        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, inside the show's entry window"
            - "APPROVED CONFORMATION show, one OPEN BREED class GR-OPEN-D on a CONFIRMED panel slot"
            - "Three dogs of one handler entered in that class; entries 1 and 2 already CONFIRMED"
            - "Before the trigger: Show.levy_total_cents == 526 and Show.fee_charged_cents == 8426"
