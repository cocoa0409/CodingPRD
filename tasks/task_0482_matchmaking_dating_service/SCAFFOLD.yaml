# =============================================================================
# Scaffold: Matchmaking & Dating Service (Expert tier)
# §1.0–§1.7 single source of truth. §1.8/§1.9 live in sibling files.
# =============================================================================

scenario: |
  Matchmaking & Dating Service: member profile & screening, preference/compatibility
  matching, introduction & feedback loop, membership tier & guarantee (# of matches),
  date scheduling & coaching, pause/freeze, background-check add-on, success/exit.

domain_name: matchmaking-dating-service
api_prefix: ""   # flat top-level resources (/members, /membership-plans, /introductions, ...); collection segments derive from each single-resource GET

# =============================================================================
# Complexity Profile (Expert)
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation     # an Introduction requires BOTH members to accept (quorum of 2)
  secondary_archetype: quota_allocation          # membership guarantee = finite pool of introduction credits competed for, consumed, refunded
  complexity_layers:
    - optimistic_concurrency                      # OCC on Member.version for guarantee-consuming introduction creation
    - cascading_side_effects                      # introduction decline / member exit propagate across Introduction → DateEvent → CoachingSession
    - dual_variant_calculation                    # guarantee remaining (committed vs forecast); refund (per-line vs sum rounding)
    - scheduled_actions                           # freeze windows + logical clock extend the membership term and re-arm the guarantee deadline

  entity_topology: graph
  # Introduction is a many-to-many self-referential junction over Member; DateEvent/Feedback/CoachingSession hang off Introduction.

  state_machine_shape: branching
  # Introduction forks: SUGGESTED → {one-sided accept} → MUTUAL or DECLINED; DateEvent branches to OUTCOME variants with divergent side-effects.

  relationship_patterns:
    - many_to_many        # Introduction links two Members
    - self_referential    # Introduction.member_a_id and member_b_id both -> Member.id
    - cross_aggregate     # Feedback / DateEvent / CoachingSession reference Introduction across aggregate boundaries
    - one_to_many         # Member has many Memberships, Freezes, BackgroundChecks

  role_model: peer_roles
  # Matchmaker owns suggestion/coaching; Member acts on own introductions/feedback/dates; ScreeningOfficer owns screening + background checks; BillingAdmin owns plans + membership lifecycle/refunds.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | ELITE; unique among non-archived plans", constraints: "one of BASIC,PLUS,ELITE" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly fee in cents", constraints: ">= 0" }
      - { name: term_months, type: integer, source: input, description: "Length of the committed term in months", constraints: ">= 1" }
      - { name: guaranteed_introductions, type: integer, source: input, description: "Number of introduction credits guaranteed over the term (the matches guarantee)", constraints: ">= 0" }
      - { name: priority_match_enabled, type: boolean, source: input, default: false, description: "If true, each introduction this plan creates consumes 2 guarantee credits instead of 1 (priority matching)" }
      - { name: included_coaching_sessions, type: integer, source: input, description: "Coaching sessions included in the term", constraints: ">= 0" }
      - { name: coaching_value_cents, type: integer, source: input, description: "Total cents of coaching value bundled in the plan, used as the per-session refund basis", constraints: ">= 0" }
      - { name: background_check_addon_cents, type: integer, source: input, description: "One-time price of the optional background-check add-on", constraints: ">= 0" }
      - { name: archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived plans reject new memberships but keep existing ones" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", constraints: "ACTIVE,ARCHIVED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: email, type: string, source: input, description: "Login email; unique among Members whose status != EXITED" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth (ISO 8601 UTC); used for age-gap eligibility against the clock" }
      - { name: city, type: string, source: input, description: "Home city label used by location proximity scoring" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE | NONBINARY" }
      - { name: status, type: enum, source: system, description: "PROSPECT | SCREENING | ACTIVE | FROZEN | EXITED", constraints: "PROSPECT,SCREENING,ACTIVE,FROZEN,EXITED" }
      - { name: screening_decision, type: enum, source: system, default: "NONE", description: "NONE | APPROVED | REJECTED", constraints: "NONE,APPROVED,REJECTED" }
      - { name: active_membership_id, type: string, source: computed, description: "Convenience back-pointer to the id of the currently ACTIVE Membership for this member, null if none (discoverable via GET /members/{id}/memberships)" }
      - { name: guarantee_remaining_committed, type: integer, source: computed, description: "Committed remaining guaranteed introductions = guaranteed_introductions - sum of credits consumed by introductions that reached MUTUAL or later; floored at 0" }
      - { name: guarantee_remaining_forecast, type: integer, source: computed, description: "Forecast remaining = guaranteed_introductions - credits consumed by (MUTUAL or later) AND still-open SUGGESTED/ONE_SIDED introductions; floored at 0" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Coaching no-show strike counter; 3 strikes suspends coaching booking; decays per clean window" }
      - { name: coaching_suspended, type: boolean, source: computed, default: false, description: "True when no_show_strikes >= COACHING_STRIKE_LIMIT" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Refund wallet balance in cents accrued from membership cancellation refunds" }
      - { name: frozen_days_total, type: integer, source: computed, default: 0, description: "Cumulative committed freeze days applied across all completed Freeze windows; extends term end" }
      - { name: term_end_at, type: datetime, source: computed, description: "Membership term end = membership.start_at + plan.term_months months + frozen_days_total days; null when no active membership" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation including cascades" }

  - name: Screening
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the screened member" }
      - { name: questionnaire_score, type: integer, source: input, description: "0..100 intake questionnaire score", constraints: "0..100" }
      - { name: identity_verified, type: boolean, source: input, description: "Whether government ID was verified during intake" }
      - { name: decision, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | REJECTED", constraints: "PENDING,APPROVED,REJECTED" }
      - { name: decision_note, type: string, source: input, default: "", description: "Free-text reviewer note recorded at decision time" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED (mirrors decision)", constraints: "PENDING,APPROVED,REJECTED" }

  - name: Preference
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of these preferences" }
      - { name: seeking_gender, type: enum, source: input, description: "MALE | FEMALE | NONBINARY | ANY" }
      - { name: min_age, type: integer, source: input, description: "Minimum acceptable partner age in years", constraints: ">= 18" }
      - { name: max_age, type: integer, source: input, description: "Maximum acceptable partner age in years; must be >= min_age", constraints: ">= min_age" }
      - { name: max_distance_band, type: integer, source: input, description: "Acceptable location proximity band 0..3 (0=same city, 3=anywhere)", constraints: "0..3" }
      - { name: attribute_weights, type: object, source: input, description: "Self-declared attribute vector {education:0..100, lifestyle:0..100, values:0..100} used by attribute_match scoring" }
      - { name: dealbreaker_tags, type: array, source: input, default: [], description: "Array of string tags; a candidate carrying any matching tag in their attribute_weights keys is disqualified" }

  - name: Membership
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the subscriber" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the purchased plan" }
      - { name: start_at, type: datetime, source: system, description: "Term start timestamp, stamped from the logical clock at activation" }
      - { name: base_term_end_at, type: datetime, source: computed, description: "start_at + plan.term_months months, before any freeze extension" }
      - { name: guaranteed_introductions, type: integer, source: system, description: "Snapshot of plan.guaranteed_introductions at activation (pinned; later plan edits do not change it)" }
      - { name: credits_consumed_committed, type: integer, source: computed, description: "Sum of guarantee credits consumed by introductions that reached MUTUAL or later under this membership" }
      - { name: guarantee_met, type: boolean, source: computed, description: "True when credits_consumed_committed >= guaranteed_introductions" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | FULFILLED | CANCELLED | EXPIRED", constraints: "ACTIVE,FROZEN,FULFILLED,CANCELLED,EXPIRED" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Refund computed at cancellation; 0 until cancelled" }

  - name: Freeze
    parent: Membership
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; the frozen membership" }
      - { name: start_at, type: datetime, source: input, description: "Freeze start (ISO 8601 UTC); must be >= clock now" }
      - { name: end_at, type: datetime, source: input, description: "Freeze end (ISO 8601 UTC); half-open [start_at, end_at); must be > start_at" }
      - { name: committed_days, type: integer, source: computed, description: "Whole days credited to term extension once the freeze is RESUMED, = ceil((min(end_at,resume_now) - start_at)/1 day)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | RESUMED | CANCELLED", constraints: "SCHEDULED,ACTIVE,RESUMED,CANCELLED" }

  - name: Introduction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: member_a_id, type: string, source: input, description: "FK -> Member.id; the first member of the pair (suggestion initiator side)" }
      - { name: member_b_id, type: string, source: input, description: "FK -> Member.id; the second member of the pair" }
      - { name: compatibility_score, type: number, source: computed, description: "Symmetric compatibility 0..100 computed at suggestion time, 2 dp round_half_up" }
      - { name: credits_consumed, type: integer, source: computed, description: "Guarantee credits this introduction consumed from member_a's membership at suggestion (1, or 2 if priority_match_enabled, 0 if win-back promo)" }
      - { name: a_response, type: enum, source: system, default: "PENDING", description: "PENDING | ACCEPTED | DECLINED — member_a's response", constraints: "PENDING,ACCEPTED,DECLINED" }
      - { name: b_response, type: enum, source: system, default: "PENDING", description: "PENDING | ACCEPTED | DECLINED — member_b's response", constraints: "PENDING,ACCEPTED,DECLINED" }
      - { name: status, type: enum, source: system, description: "SUGGESTED | ONE_SIDED | MUTUAL | DECLINED | CLOSED", constraints: "SUGGESTED,ONE_SIDED,MUTUAL,DECLINED,CLOSED" }
      - { name: win_back_promo, type: boolean, source: input, default: false, description: "If true, this introduction consumes 0 guarantee credits (re-engagement promo)" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation" }

  - name: Feedback
    parent: Introduction
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: introduction_id, type: string, source: system, description: "FK -> Introduction.id; the introduction being rated" }
      - { name: author_member_id, type: string, source: input, description: "Member id of the feedback author; MUST equal member_a_id or member_b_id of the parent Introduction (discoverable via GET /introductions/{id}/feedback)" }
      - { name: rating, type: integer, source: input, description: "1..5 satisfaction rating of the date/introduction", constraints: "1..5" }
      - { name: continue_interest, type: boolean, source: input, description: "Whether the author wants to continue seeing the match" }
      - { name: comments, type: string, source: input, default: "", description: "Free-text feedback" }

  - name: DateEvent
    parent: Introduction
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: introduction_id, type: string, source: system, description: "FK -> Introduction.id; the mutual introduction this date belongs to" }
      - { name: scheduled_by_member_id, type: string, source: input, description: "Member id of the scheduler; MUST equal member_a_id or member_b_id of the parent Introduction (discoverable via GET /introductions/{id}/date-events)" }
      - { name: start_at, type: datetime, source: input, description: "Date start (ISO 8601 UTC); must be >= clock now" }
      - { name: end_at, type: datetime, source: input, description: "Date end; half-open [start_at, end_at); must be > start_at" }
      - { name: outcome, type: enum, source: system, default: "NONE", description: "NONE | COMPLETED | NO_SHOW | CANCELLED", constraints: "NONE,COMPLETED,NO_SHOW,CANCELLED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED", constraints: "SCHEDULED,COMPLETED,NO_SHOW,CANCELLED" }

  - name: CoachingSession
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the coached member" }
      - { name: coach_user_id, type: string, source: input, description: "Opaque Matchmaker operator id who runs the session" }
      - { name: start_at, type: datetime, source: input, description: "Session start (ISO 8601 UTC); must be >= clock now" }
      - { name: end_at, type: datetime, source: input, description: "Session end; half-open [start_at, end_at); must be > start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED | HELD | NO_SHOW | CANCELLED", constraints: "BOOKED,HELD,NO_SHOW,CANCELLED" }

  - name: BackgroundCheck
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the subject of the check" }
      - { name: provider_ref, type: string, source: input, description: "External provider reference string" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Snapshot of plan.background_check_addon_cents charged at order time" }
      - { name: result, type: enum, source: system, default: "NONE", description: "NONE | CLEAR | FLAGGED", constraints: "NONE,CLEAR,FLAGGED" }
      - { name: status, type: enum, source: system, description: "ORDERED | COMPLETED | CANCELLED", constraints: "ORDERED,COMPLETED,CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: status
    initial_state: PROSPECT
    terminal_states: [EXITED]
    transitions:
      - from: PROSPECT
        to: SCREENING
        trigger: "POST /members/{id}/screenings"
        actor: ScreeningOfficer
        preconditions:
          - "Member.status == PROSPECT (else ERR_MEMBER_NOT_PROSPECT)"
        side_effects:
          - "Creates a Screening with decision=PENDING, status=PENDING"

      - from: SCREENING
        to: ACTIVE
        trigger: "POST /members/{id}/screenings/{screeningId}/decide with decision=APPROVED (then membership activation)"
        actor: ScreeningOfficer
        preconditions:
          - "Screening.decision == PENDING (else ERR_SCREENING_ALREADY_DECIDED)"
          - "Member must have an ACTIVE Membership activated for ACTIVE status (see Membership.ACTIVE); a member with an approved screening but no membership remains SCREENING"
        side_effects:
          - "Screening.decision = APPROVED; Screening.status = APPROVED"
          - "Member.screening_decision = APPROVED"
          - "On subsequent membership activation, Member.status -> ACTIVE"
        note: "APPROVED screening alone sets screening_decision; status flips to ACTIVE only when a Membership is activated (cross-entity guard)."

      - from: SCREENING
        to: EXITED
        trigger: "POST /members/{id}/screenings/{screeningId}/decide with decision=REJECTED"
        actor: ScreeningOfficer
        preconditions:
          - "Screening.decision == PENDING (else ERR_SCREENING_ALREADY_DECIDED)"
        side_effects:
          - "Screening.decision = REJECTED; Screening.status = REJECTED"
          - "Member.screening_decision = REJECTED; Member.status = EXITED (rejected applicants leave the funnel)"

      - from: ACTIVE
        to: FROZEN
        trigger: "system: a Freeze window for the member's ACTIVE membership becomes ACTIVE (clock reaches Freeze.start_at, applied on resume-check or freeze-create when start_at <= now)"
        actor: system
        preconditions:
          - "Member.status == ACTIVE"
          - "Membership.status == ACTIVE"
        side_effects:
          - "Membership.status = FROZEN"
          - "Open SUGGESTED/ONE_SIDED Introductions for this member are not advanced while frozen (new suggestions blocked by ERR_MEMBER_FROZEN)"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /memberships/{id}/freezes/{freezeId}/resume"
        actor: BillingAdmin
        preconditions:
          - "Freeze.status == ACTIVE (else ERR_FREEZE_NOT_ACTIVE)"
        side_effects:
          - "Freeze.status = RESUMED; Freeze.committed_days computed"
          - "Membership.status = ACTIVE"
          - "Member.frozen_days_total += Freeze.committed_days; Member.term_end_at recomputed (term extended)"

      - from: [ACTIVE, FROZEN]
        to: EXITED
        trigger: "POST /members/{id}/exit"
        actor: BillingAdmin
        preconditions:
          - "Member.status IN {ACTIVE, FROZEN} (else ERR_MEMBER_NOT_EXITABLE)"
        side_effects:
          - "Member.status = EXITED"
          - "ACTIVE/FROZEN Membership.status = CANCELLED with refund computed (see refund_on_cancel); refund credited to wallet_credit_cents"
          - "All SUGGESTED/ONE_SIDED Introductions for the member -> CLOSED (cascade); each CLOSED introduction whose status was below MUTUAL refunds its consumed guarantee credits"
          - "All SCHEDULED DateEvents for the member's introductions -> CANCELLED (cascade); all BOOKED CoachingSessions for the member -> CANCELLED (cascade)"
        note: "Exit triggers a depth-3 cascade: Member.exit -> Introduction.CLOSED -> DateEvent.CANCELLED."

  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system: an introduction reaches MUTUAL that makes credits_consumed_committed >= guaranteed_introductions"
        actor: system
        preconditions:
          - "Membership.status == ACTIVE"
          - "credits_consumed_committed >= guaranteed_introductions after the MUTUAL transition"
        side_effects:
          - "Membership.status = FULFILLED; guarantee_met = true"

      - from: ACTIVE
        to: FROZEN
        trigger: "system: Freeze window becomes ACTIVE (see Member.ACTIVE->FROZEN)"
        actor: system
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "Membership.status = FROZEN"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /memberships/{id}/freezes/{freezeId}/resume"
        actor: BillingAdmin
        preconditions:
          - "Membership.status == FROZEN"
        side_effects:
          - "Membership.status = ACTIVE; term extended by Freeze.committed_days"

      - from: [ACTIVE, FROZEN]
        to: CANCELLED
        trigger: "POST /members/{id}/exit (member exit) or POST /memberships/{id}/cancel"
        actor: BillingAdmin
        preconditions:
          - "Membership.status IN {ACTIVE, FROZEN} (else ERR_MEMBERSHIP_NOT_CANCELLABLE)"
        side_effects:
          - "refund_cents = refund_on_cancel; Membership.status = CANCELLED"
          - "Member.wallet_credit_cents += refund_cents"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock now >= term_end_at and guarantee not met"
        actor: system
        preconditions:
          - "now >= Member.term_end_at"
          - "Membership.status == ACTIVE"
        side_effects:
          - "Membership.status = EXPIRED"
        note: "Evaluated lazily on read/operations that touch the membership after the clock advances past term_end_at."

  - entity: Freeze
    field: status
    initial_state: SCHEDULED
    terminal_states: [RESUMED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: clock now >= Freeze.start_at"
        actor: system
        preconditions:
          - "Freeze.status == SCHEDULED"
          - "now >= Freeze.start_at"
        side_effects:
          - "Freeze.status = ACTIVE; Membership.status = FROZEN; Member.status = FROZEN"

      - from: ACTIVE
        to: RESUMED
        trigger: "POST /memberships/{id}/freezes/{freezeId}/resume"
        actor: BillingAdmin
        preconditions:
          - "Freeze.status == ACTIVE (else ERR_FREEZE_NOT_ACTIVE)"
        side_effects:
          - "committed_days = ceil((min(end_at, now) - start_at) / 1 day)"
          - "Member.frozen_days_total += committed_days; term_end_at recomputed; Membership.status = ACTIVE; Member.status = ACTIVE"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /memberships/{id}/freezes/{freezeId}/cancel"
        actor: BillingAdmin
        preconditions:
          - "Freeze.status == SCHEDULED (else ERR_FREEZE_NOT_CANCELLABLE)"
        side_effects:
          - "Freeze.status = CANCELLED; no term extension"

  - entity: Introduction
    field: status
    initial_state: SUGGESTED
    terminal_states: [DECLINED, CLOSED]
    transitions:
      - from: SUGGESTED
        to: ONE_SIDED
        trigger: "POST /introductions/{id}/respond with response=ACCEPTED (first of the two members)"
        actor: Member
        preconditions:
          - "Introduction.status == SUGGESTED"
          - "Acting member is member_a or member_b and their response is PENDING (else ERR_NOT_INTRODUCTION_PARTY / ERR_ALREADY_RESPONDED)"
          - "Member.status == ACTIVE (else ERR_MEMBER_FROZEN if FROZEN)"
        side_effects:
          - "Sets the acting member's response = ACCEPTED; status = ONE_SIDED"

      - from: [SUGGESTED, ONE_SIDED]
        to: MUTUAL
        trigger: "POST /introductions/{id}/respond with response=ACCEPTED (the second member)"
        actor: Member
        preconditions:
          - "Both a_response and b_response become ACCEPTED"
          - "Acting member's response is PENDING (else ERR_ALREADY_RESPONDED)"
        side_effects:
          - "status = MUTUAL; credits_consumed becomes committed against member_a's membership"
          - "credits_consumed_committed recomputed on member_a's membership; if it reaches guaranteed_introductions the membership FULFILLS (bubble-up)"
          - "Both members may now schedule a DateEvent"

      - from: [SUGGESTED, ONE_SIDED]
        to: DECLINED
        trigger: "POST /introductions/{id}/respond with response=DECLINED"
        actor: Member
        preconditions:
          - "Acting member's response is PENDING (else ERR_ALREADY_RESPONDED)"
        side_effects:
          - "Sets acting member's response = DECLINED; status = DECLINED"
          - "Refunds credits_consumed to member_a's guarantee (forward action + compensating refund; guarantee_remaining_forecast restored)"

      - from: [SUGGESTED, ONE_SIDED, MUTUAL]
        to: CLOSED
        trigger: "system: a party member EXITS, or POST /introductions/{id}/close"
        actor: system
        preconditions:
          - "Introduction.status IN {SUGGESTED, ONE_SIDED, MUTUAL}"
        side_effects:
          - "status = CLOSED"
          - "If prior status was below MUTUAL, refund credits_consumed to member_a's guarantee; if MUTUAL, no refund (already committed)"
          - "Any SCHEDULED DateEvent on this introduction -> CANCELLED (cascade)"

  - entity: DateEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /date-events/{dateEventId}/outcome with outcome=COMPLETED"
        actor: Matchmaker
        preconditions:
          - "DateEvent.status == SCHEDULED (else ERR_DATE_NOT_SCHEDULED)"
          - "now >= DateEvent.start_at (else ERR_DATE_NOT_STARTED)"
        side_effects:
          - "outcome = COMPLETED; status = COMPLETED"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /date-events/{dateEventId}/outcome with outcome=NO_SHOW"
        actor: Matchmaker
        preconditions:
          - "DateEvent.status == SCHEDULED (else ERR_DATE_NOT_SCHEDULED)"
          - "now >= DateEvent.start_at"
        side_effects:
          - "outcome = NO_SHOW; status = NO_SHOW"
        note: "Date no-show does NOT add coaching strikes; coaching strikes come only from CoachingSession no-shows."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /date-events/{dateEventId}/cancel or system cascade (introduction CLOSED / member EXIT)"
        actor: Member
        preconditions:
          - "DateEvent.status == SCHEDULED (else ERR_DATE_NOT_SCHEDULED)"
        side_effects:
          - "outcome = CANCELLED; status = CANCELLED; frees the member's calendar interval"

  - entity: CoachingSession
    field: status
    initial_state: BOOKED
    terminal_states: [HELD, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: HELD
        trigger: "POST /coaching-sessions/{sessionId}/outcome with outcome=HELD"
        actor: Matchmaker
        preconditions:
          - "CoachingSession.status == BOOKED (else ERR_SESSION_NOT_BOOKED)"
          - "now >= CoachingSession.start_at"
        side_effects:
          - "status = HELD"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /coaching-sessions/{sessionId}/outcome with outcome=NO_SHOW"
        actor: Matchmaker
        preconditions:
          - "CoachingSession.status == BOOKED (else ERR_SESSION_NOT_BOOKED)"
          - "now >= CoachingSession.start_at"
        side_effects:
          - "status = NO_SHOW"
          - "Member.no_show_strikes += 1; if no_show_strikes >= COACHING_STRIKE_LIMIT then coaching_suspended = true (threshold breach)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /coaching-sessions/{sessionId}/cancel or system cascade (member EXIT)"
        actor: Member
        preconditions:
          - "CoachingSession.status == BOOKED (else ERR_SESSION_NOT_BOOKED)"
        side_effects:
          - "status = CANCELLED; frees the member's calendar interval; no strike"

  - entity: BackgroundCheck
    field: status
    initial_state: ORDERED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /members/{id}/background-checks/{checkId}/complete with result=CLEAR|FLAGGED"
        actor: ScreeningOfficer
        preconditions:
          - "BackgroundCheck.status == ORDERED (else ERR_CHECK_NOT_ORDERED)"
        side_effects:
          - "result set; status = COMPLETED"
          - "If result == FLAGGED, all open SUGGESTED/ONE_SIDED Introductions for the member -> CLOSED with credit refund (cascade)"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /members/{id}/background-checks/{checkId}/cancel"
        actor: ScreeningOfficer
        preconditions:
          - "BackgroundCheck.status == ORDERED (else ERR_CHECK_NOT_ORDERED)"
        side_effects:
          - "status = CANCELLED; fee_charged_cents refunded to Member.wallet_credit_cents"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: intro-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /introductions"
    occ_field: "expected_member_a_version"
    description: |
      Creating an Introduction consumes guarantee credits from member_a's
      Member record (decrementing guarantee_remaining_forecast). If member_a's
      version has advanced since the Matchmaker last observed it — because
      another suggestion already consumed credits, legitimately superseding the
      caller's view of the remaining pool — the create is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: respond-mutual-stale-intro
    parent_entity: Introduction
    write_endpoint: "POST /introductions/{id}/respond"
    occ_field: "expected_introduction_version"
    description: |
      Responding to an Introduction commits or refunds guarantee credits when
      it crosses to MUTUAL or DECLINED. If the Introduction's version has
      advanced since the responder last read it — the counterpart already
      recorded a response that legitimately moved the introduction's state —
      the response is rejected as stale rather than re-applied to a changed row.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compatibility_score
    trigger: "Introduction suggestion (POST /introductions)"
    algorithm: weighted_scoring
    formula: |
      # All four factors are derived to a 0..100 sub-score, then weighted.
      # attribute_match: 100 * (1 - normalized L1 distance between the two members'
      #   Preference.attribute_weights vectors over the shared keys {education,lifestyle,values});
      #   if no shared keys, attribute_match = 0.
      # preference_overlap: 100 if each member's gender satisfies the other's seeking_gender
      #   (ANY always satisfies) AND each member's age is within the other's [min_age,max_age];
      #   else a proportional partial score = 50 * (gender_ok ? 1 : 0) + 50 * (age_ok_both ? 1 : 0).
      # location_proximity: 100 if same city; else 100 - 25 * band_gap, floored at 0, where
      #   band_gap is the difference between cities' proximity band index.
      # activity_recency: 100 if both members ACTIVE; 50 if one FROZEN; computed from status.
      raw = attribute_match * W_ATTR
          + preference_overlap * W_PREF
          + location_proximity * W_LOC
          + activity_recency  * W_ACT
      compatibility_score = round_half_up(raw, 2)   # 2 decimal places
    input_set: "The two Members' Preference rows and statuses at suggestion time."
    constants:
      W_ATTR: 0.40
      W_PREF: 0.35
      W_LOC: 0.15
      W_ACT: 0.10
      COMPATIBILITY_THRESHOLD: 70
    precision: "2 decimal places, round_half_up"
    note: "An Introduction may only be SUGGESTED when compatibility_score >= COMPATIBILITY_THRESHOLD (>= 70.00, NOT > 70). Worked: attr=80,pref=60,loc=100,act=50 -> 32+21+15+5 = 73.00 (eligible). attr=70,pref=55,loc=80,act=40 -> 28+19.25+12+4 = 63.25 (rejected)."

  - name: guarantee_consume_on_suggest
    trigger: "Introduction suggestion (POST /introductions)"
    algorithm: waterfall_allocation
    formula: |
      # >=3 inputs with non-linear interaction (mode (a)): tier flag, promo flag, remaining pool.
      if introduction.win_back_promo:
        cost = 0
      elif plan.priority_match_enabled:
        cost = 2
      else:
        cost = 1
      consumed = min(cost, member_a.guarantee_remaining_forecast)   # capped, never over-draws
      credits_consumed = consumed
      member_a.guarantee_remaining_forecast = max(member_a.guarantee_remaining_forecast - consumed, 0)
    input_set: "member_a's active Membership snapshot guaranteed_introductions; the plan's priority flag; the introduction's win_back_promo flag."
    constants:
      PRIORITY_COST: 2
      STANDARD_COST: 1
      PROMO_COST: 0
    precision: "integer credits"
    note: "Cost is min(tier-cost, remaining); win-back waives to 0. Worked: remaining=5, priority -> consume 2, remaining 3. remaining=1, priority -> consume 1 (capped), remaining 0. win_back -> consume 0."

  - name: guarantee_remaining
    trigger: "Read of Member/Membership; recomputed on Introduction MUTUAL, DECLINED, CLOSED transitions"
    algorithm: aggregation
    formula: |
      committed_consumed = sum(intro.credits_consumed
                               for intro in introductions where member_a_id == M.id
                               AND intro.status IN {MUTUAL, CLOSED_FROM_MUTUAL})
      forecast_consumed  = sum(intro.credits_consumed
                               for intro in introductions where member_a_id == M.id
                               AND intro.status IN {SUGGESTED, ONE_SIDED, MUTUAL})
      guarantee_remaining_committed = max(membership.guaranteed_introductions - committed_consumed, 0)
      guarantee_remaining_forecast  = max(membership.guaranteed_introductions - forecast_consumed, 0)
    input_set: "Introductions where member_a_id == the member, filtered by status as above. CLOSED-from-below-MUTUAL and DECLINED introductions are excluded from both sums (their credits were refunded)."
    constants: {}
    precision: "integer credits"
    variants:
      - name: committed
        when: "Used to decide membership FULFILLED and the matches-guarantee obligation at exit/expiry."
        difference: "Counts only introductions that reached MUTUAL (or CLOSED after having been MUTUAL); pending/one-sided do NOT count."
      - name: forecast
        when: "Used to gate new suggestions (ERR_GUARANTEE_EXHAUSTED) and shown as the projected remaining."
        difference: "Also counts still-open SUGGESTED/ONE_SIDED introductions as provisionally consuming the pool; can be strictly less than committed remaining."
    note: "Divergence: with guaranteed=8, 3 MUTUAL (3 credits) and 2 still-open SUGGESTED (2 credits): committed remaining = 5, forecast remaining = 3."

  - name: refund_on_cancel
    trigger: "Membership cancellation (member exit or POST /memberships/{id}/cancel)"
    algorithm: tiered_pricing
    formula: |
      # Nested rounding where order matters (mode (b)). Refund has two parts:
      #   (1) unused full term months refunded at monthly_fee_cents each (integer cents, no rounding).
      #   (2) unused coaching sessions refunded at a fractional per-session rate, summed PER LINE
      #       then truncated — the scaffold PINS round-per-line-then-sum.
      now = clock_now()
      elapsed_days = floor((now - membership.start_at) / 1 day)
      elapsed_full_months = floor(elapsed_days / 30)           # 30-day month basis
      remaining_months = max(plan.term_months - elapsed_full_months - 1, 0)
      months_refund_cents = remaining_months * plan.monthly_fee_cents
      per_session_rate = plan.coaching_value_cents / plan.included_coaching_sessions   # fractional
      unused_sessions = plan.included_coaching_sessions - count(CoachingSession for member where status IN {HELD, NO_SHOW})
      # round_half_up EACH line, THEN sum (PINNED ORDER):
      coaching_refund_cents = sum(round_half_up(per_session_rate) for _ in range(unused_sessions))
      refund_cents = months_refund_cents + coaching_refund_cents
    input_set: "The member's plan snapshot, elapsed time vs clock, and CoachingSession rows in {HELD, NO_SHOW} (consumed); BOOKED/CANCELLED sessions do not consume."
    constants:
      DAYS_PER_MONTH: 30
    precision: "integer cents; round_half_up per coaching line, then sum"
    variants:
      - name: per_line_rounding
        when: "The canonical pinned order used by the implementation."
        difference: "round_half_up(per_session_rate) is applied to each unused session line, then the lines are summed."
      - name: sum_then_round
        when: "The forbidden alternative interpretation a naive implementation might pick."
        difference: "round_half_up(per_session_rate * unused_sessions) — produces a different total when per_session_rate has a repeating fractional part."
    note: "Worked: coaching_value_cents=5000, included=3, per_session_rate=1666.6667. 3 unused: per-line-then-sum = 1667*3 = 5001; sum-then-round = round(5000.00) = 5000. PINNED result is 5001."

  - name: no_show_strike_decay
    trigger: "Read of Member; recomputed when the clock advances and on CoachingSession NO_SHOW"
    algorithm: decay_function
    formula: |
      # Strikes decay by 1 for every full STRIKE_DECAY_DAYS elapsed since the most recent
      # NO_SHOW CoachingSession start_at, floored at 0.
      last_no_show_at = max(CoachingSession.start_at for sessions with status == NO_SHOW for member)  # null if none
      if last_no_show_at is null:
        effective_strikes = 0
      else:
        raw = recorded_strikes - floor((clock_now() - last_no_show_at) / STRIKE_DECAY_DAYS days)
        effective_strikes = max(raw, 0)
      no_show_strikes = effective_strikes
      coaching_suspended = (no_show_strikes >= COACHING_STRIKE_LIMIT)
    input_set: "CoachingSession rows with status == NO_SHOW for the member, ordered by start_at; clock now."
    constants:
      COACHING_STRIKE_LIMIT: 3
      STRIKE_DECAY_DAYS: 30
    precision: "integer strikes"
    note: "Boundary: 3 strikes suspends coaching booking (>= 3), 2 does not. After 30 clean days one strike decays off."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; for entity_backed roles acting on own resource, X-User-ID must match the resource's owning Member"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (memberId, then membershipId/screeningId/checkId; introductionId; dateEventId; sessionId; planId)"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND / ERR_SCREENING_NOT_FOUND / ERR_INTRODUCTION_NOT_FOUND / ERR_DATE_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_CHECK_NOT_FOUND / ERR_FREEZE_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges (rating 1..5, age >= 18, max_age >= min_age, end_at > start_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Acting/target resource in a state that permits the operation (member status, introduction status, membership status, freeze status, date/session/check status)"
    error_id: "ERR_MEMBER_NOT_PROSPECT / ERR_MEMBER_NOT_APPROVED / ERR_MEMBER_FROZEN / ERR_MEMBER_NOT_EXITABLE / ERR_SCREENING_ALREADY_DECIDED / ERR_INVALID_INTRODUCTION_STATE / ERR_ALREADY_RESPONDED / ERR_MEMBERSHIP_NOT_CANCELLABLE / ERR_FREEZE_NOT_ACTIVE / ERR_FREEZE_NOT_CANCELLABLE / ERR_DATE_NOT_SCHEDULED / ERR_DATE_NOT_STARTED / ERR_SESSION_NOT_BOOKED / ERR_CHECK_NOT_ORDERED"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity reference integrity: introduction parties are distinct existing Members; feedback author and date scheduler are a party to the introduction; membership plan not archived"
    error_id: "ERR_NOT_INTRODUCTION_PARTY / ERR_SELF_INTRODUCTION / ERR_PLAN_ARCHIVED"
    http_status: 422
    applies_to: "POST /introductions, POST /introductions/{id}/feedback, POST /introductions/{id}/date-events, POST /members/{id}/memberships"

  - priority: 7
    category: business_safety
    check: "Eligibility gates for suggestion: both members ACTIVE and screening APPROVED; mutual gender/age preference satisfaction; neither party carries the other's dealbreaker tag; if either member has a FLAGGED BackgroundCheck, suggestion is blocked"
    error_id: "ERR_MEMBER_NOT_ELIGIBLE / ERR_PREFERENCE_MISMATCH / ERR_DEALBREAKER / ERR_BACKGROUND_FLAGGED"
    http_status: 422
    applies_to: "POST /introductions"

  - priority: 8
    category: business_temporal
    check: "Calendar overlap: a new DateEvent must not overlap (half-open [start,end), so touching endpoints do NOT collide) any SCHEDULED DateEvent OR BOOKED CoachingSession of the scheduling member; a new CoachingSession must additionally keep a COACHING_BUFFER_MIN = 30-minute gap (closed buffer; a 30-min gap is exactly allowed, 29 min collides) from the member's SCHEDULED DateEvents"
    error_id: "ERR_DATE_OVERLAP / ERR_COACHING_BUFFER_CONFLICT"
    http_status: 409
    applies_to: "POST /introductions/{id}/date-events, POST /members/{id}/coaching-sessions"

  - priority: 9
    category: business_constraint
    check: "Compatibility threshold: Introduction may only be SUGGESTED when compatibility_score >= COMPATIBILITY_THRESHOLD (70.00)"
    error_id: ERR_COMPATIBILITY_TOO_LOW
    http_status: 422
    applies_to: "POST /introductions"

  - priority: 10
    category: business_constraint
    check: "Coaching availability: member's coaching_suspended must be false (no_show_strikes < COACHING_STRIKE_LIMIT) to book a CoachingSession"
    error_id: ERR_COACHING_SUSPENDED
    http_status: 409
    applies_to: "POST /members/{id}/coaching-sessions"

  - priority: 11
    category: business_fiscal
    check: "Guarantee pool: a new Introduction's credit cost must not exceed member_a's guarantee_remaining_forecast unless win_back_promo (cost 0)"
    error_id: ERR_GUARANTEE_EXHAUSTED
    http_status: 402
    applies_to: "POST /introductions"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_member_a_version / expected_introduction_version must match the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /introductions, POST /introductions/{id}/respond"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Test-driving: logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO 8601 UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects:
      - "Logical clock advanced; lazily evaluates Freeze SCHEDULED->ACTIVE, Membership ACTIVE->EXPIRED, and strike decay on next touch"

  # ---------- MembershipPlan ----------
  - method: POST
    path: "/membership-plans"
    description: "Create a MembershipPlan"
    roles: [BillingAdmin]
    code: 201
    input: [tier, monthly_fee_cents, term_months, guaranteed_introductions, "priority_match_enabled?", included_coaching_sessions, coaching_value_cents, background_check_addon_cents]
    output: MembershipPlan
    side_effects: ["status=ACTIVE, archived=false"]

  - method: GET
    path: "/membership-plans"
    description: "List MembershipPlans (excludes archived unless include_archived=true)"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["include_archived?", "limit?", "offset?"]
    output: "MembershipPlan[]"
    side_effects: []

  - method: GET
    path: "/membership-plans/{id}"
    description: "Get a MembershipPlan"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  - method: POST
    path: "/membership-plans/{id}/archive"
    description: "Archive a plan (soft delete; blocks new memberships)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: ["archived=true; status=ARCHIVED"]

  - method: GET
    path: "/membership-plans/{id}/memberships"
    description: "List memberships purchased on a plan (reverse lookup by plan_id)"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  # ---------- Member ----------
  - method: POST
    path: "/members"
    description: "Register a prospect Member"
    roles: [ScreeningOfficer, Matchmaker]
    code: 201
    input: [email, full_name, birth_date, city, gender]
    output: Member
    side_effects: ["status=PROSPECT, screening_decision=NONE, version=1"]

  - method: GET
    path: "/members"
    description: "List Members with optional status filter"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Get a Member (computed guarantee/strike/wallet/term fields included)"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: Member
    side_effects: ["lazily evaluates EXPIRED/strike decay on read"]

  - method: POST
    path: "/members/{id}/exit"
    description: "Exit a member (success/exit); cancels active membership and cascades"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "Member.status=EXITED; active Membership CANCELLED with refund_on_cancel -> wallet"
      - "Open Introductions CLOSED (cascade) with credit refunds for below-MUTUAL"
      - "SCHEDULED DateEvents CANCELLED; BOOKED CoachingSessions CANCELLED (cascade)"
      - "increments Member.version by 1"

  # ---------- Screening ----------
  - method: POST
    path: "/members/{id}/screenings"
    description: "Open a screening for a prospect"
    roles: [ScreeningOfficer]
    code: 201
    input: [questionnaire_score, identity_verified]
    output: Screening
    side_effects: ["Member.status PROSPECT->SCREENING; Screening.decision=PENDING"]

  - method: GET
    path: "/members/{id}/screenings"
    description: "List screenings for a member"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Screening[]"
    side_effects: []

  - method: POST
    path: "/members/{id}/screenings/{screeningId}/decide"
    description: "Approve or reject a screening"
    roles: [ScreeningOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: Screening
    side_effects:
      - "decision=APPROVED -> Member.screening_decision=APPROVED (status ACTIVE only after membership activation)"
      - "decision=REJECTED -> Member.screening_decision=REJECTED, Member.status=EXITED"

  # ---------- Preference ----------
  - method: PUT
    path: "/members/{id}/preferences"
    description: "Create or replace a member's matching preferences (idempotent upsert)"
    roles: [Member, Matchmaker]
    code: 200
    input: [seeking_gender, min_age, max_age, max_distance_band, attribute_weights, "dealbreaker_tags?"]
    output: Preference
    side_effects: ["Preference row upserted for the member"]

  - method: GET
    path: "/members/{id}/preferences"
    description: "Get a member's preferences (array of 0 or 1)"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: "Preference[]"
    side_effects: []

  # ---------- Membership ----------
  - method: POST
    path: "/members/{id}/memberships"
    description: "Activate a membership for an APPROVED member; flips status to ACTIVE"
    roles: [BillingAdmin]
    code: 201
    input: [plan_id]
    output: Membership
    side_effects:
      - "Member.screening_decision must be APPROVED (else ERR_MEMBER_NOT_APPROVED); Member.status -> ACTIVE"
      - "Plan must not be archived (else ERR_PLAN_ARCHIVED)"
      - "start_at stamped from clock; guaranteed_introductions snapshotted; status=ACTIVE"
      - "Member.active_membership_id set; term_end_at computed; increments Member.version by 1"

  - method: GET
    path: "/members/{id}/memberships"
    description: "List a member's memberships"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: GET
    path: "/memberships/{id}"
    description: "Get a membership"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: Membership
    side_effects: ["lazily evaluates EXPIRED on read"]

  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel a membership (refund to wallet) without exiting the member"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["refund_cents=refund_on_cancel; status=CANCELLED; wallet credited"]

  # ---------- Freeze (pause/freeze) ----------
  - method: POST
    path: "/memberships/{id}/freezes"
    description: "Schedule a pause/freeze window on a membership"
    roles: [BillingAdmin]
    code: 201
    input: [start_at, end_at]
    output: Freeze
    side_effects:
      - "status=SCHEDULED; if start_at <= clock now, immediately ACTIVE -> Membership FROZEN, Member FROZEN"

  - method: GET
    path: "/memberships/{id}/freezes"
    description: "List freezes for a membership"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Freeze[]"
    side_effects: []

  - method: POST
    path: "/memberships/{id}/freezes/{freezeId}/resume"
    description: "Resume from an ACTIVE freeze; commits term-extension days"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Freeze
    side_effects:
      - "Freeze.status=RESUMED; committed_days computed; Member.frozen_days_total/term_end_at updated; Membership ACTIVE; Member ACTIVE"

  - method: POST
    path: "/memberships/{id}/freezes/{freezeId}/cancel"
    description: "Cancel a SCHEDULED freeze before it activates"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Freeze
    side_effects: ["status=CANCELLED; no term extension"]

  # ---------- Introduction (matching + negotiation) ----------
  - method: POST
    path: "/introductions"
    description: "Suggest an introduction between two members; runs compatibility + eligibility + guarantee gates and consumes credits"
    roles: [Matchmaker]
    code: 201
    input: [member_a_id, member_b_id, "win_back_promo?", expected_member_a_version]
    output: Introduction
    side_effects:
      - "compatibility_score computed; credits_consumed via guarantee_consume_on_suggest"
      - "member_a guarantee_remaining_forecast decremented; status=SUGGESTED"
      - "increments Member.version by 1 (member_a) and Introduction.version starts at 1"

  - method: GET
    path: "/introductions"
    description: "List introductions, optionally filtered by member_a_id or member_b_id"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["member_a_id?", "member_b_id?", "status?", "limit?", "offset?"]
    output: "Introduction[]"
    side_effects: []

  - method: GET
    path: "/introductions/{id}"
    description: "Get an introduction"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: Introduction
    side_effects: []

  - method: POST
    path: "/introductions/{id}/respond"
    description: "A party member responds ACCEPTED/DECLINED; advances the introduction (ONE_SIDED/MUTUAL/DECLINED)"
    roles: [Member]
    code: 200
    input: [response, expected_introduction_version]
    output: Introduction
    side_effects:
      - "Records acting member's response; recomputes status; on MUTUAL commits credits and may FULFILL membership (bubble-up)"
      - "on DECLINED refunds credits to member_a guarantee"
      - "increments Introduction.version by 1"

  - method: POST
    path: "/introductions/{id}/close"
    description: "Close an introduction (administrative)"
    roles: [Matchmaker]
    code: 200
    input: []
    output: Introduction
    side_effects:
      - "status=CLOSED; below-MUTUAL refunds credits; SCHEDULED DateEvents CANCELLED (cascade)"
      - "increments Introduction.version by 1"

  # ---------- Feedback ----------
  - method: POST
    path: "/introductions/{id}/feedback"
    description: "A party member submits feedback on the introduction/date"
    roles: [Member]
    code: 201
    input: [author_member_id, rating, continue_interest, "comments?"]
    output: Feedback
    side_effects: ["Feedback row created"]

  - method: GET
    path: "/introductions/{id}/feedback"
    description: "List feedback for an introduction"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Feedback[]"
    side_effects: []

  # ---------- DateEvent ----------
  - method: POST
    path: "/introductions/{id}/date-events"
    description: "Schedule a date for a MUTUAL introduction; calendar overlap checked"
    roles: [Member, Matchmaker]
    code: 201
    input: [scheduled_by_member_id, start_at, end_at]
    output: DateEvent
    side_effects: ["status=SCHEDULED; occupies the scheduler's calendar interval"]

  - method: GET
    path: "/introductions/{id}/date-events"
    description: "List date events for an introduction"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "DateEvent[]"
    side_effects: []

  - method: GET
    path: "/date-events/{dateEventId}"
    description: "Get a date event"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: DateEvent
    side_effects: []

  - method: POST
    path: "/date-events/{dateEventId}/outcome"
    description: "Record a date outcome (COMPLETED/NO_SHOW)"
    roles: [Matchmaker]
    code: 200
    input: [outcome]
    output: DateEvent
    side_effects: ["outcome+status set"]

  - method: POST
    path: "/date-events/{dateEventId}/cancel"
    description: "Cancel a scheduled date"
    roles: [Member, Matchmaker]
    code: 200
    input: []
    output: DateEvent
    side_effects: ["status=CANCELLED; frees calendar interval"]

  # ---------- CoachingSession ----------
  - method: POST
    path: "/members/{id}/coaching-sessions"
    description: "Book a coaching session; checks coaching_suspended and buffer"
    roles: [Matchmaker, Member]
    code: 201
    input: [coach_user_id, start_at, end_at]
    output: CoachingSession
    side_effects: ["status=BOOKED; occupies the member's calendar interval"]

  - method: GET
    path: "/members/{id}/coaching-sessions"
    description: "List coaching sessions for a member"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "CoachingSession[]"
    side_effects: []

  - method: GET
    path: "/coaching-sessions/{sessionId}"
    description: "Get a coaching session"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: []
    output: CoachingSession
    side_effects: []

  - method: POST
    path: "/coaching-sessions/{sessionId}/outcome"
    description: "Record coaching outcome (HELD/NO_SHOW); NO_SHOW adds a strike"
    roles: [Matchmaker]
    code: 200
    input: [outcome]
    output: CoachingSession
    side_effects: ["HELD or NO_SHOW; NO_SHOW increments member no_show_strikes (may suspend)"]

  - method: POST
    path: "/coaching-sessions/{sessionId}/cancel"
    description: "Cancel a booked coaching session"
    roles: [Member, Matchmaker]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["status=CANCELLED; frees calendar interval; no strike"]

  # ---------- BackgroundCheck (add-on) ----------
  - method: POST
    path: "/members/{id}/background-checks"
    description: "Order the optional background-check add-on; charges the plan add-on fee"
    roles: [ScreeningOfficer, Member]
    code: 201
    input: [provider_ref]
    output: BackgroundCheck
    side_effects: ["status=ORDERED; fee_charged_cents = plan.background_check_addon_cents"]

  - method: GET
    path: "/members/{id}/background-checks"
    description: "List background checks for a member"
    roles: [BillingAdmin, Matchmaker, ScreeningOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []

  - method: POST
    path: "/members/{id}/background-checks/{checkId}/complete"
    description: "Complete a background check with a result"
    roles: [ScreeningOfficer]
    code: 200
    input: [result]
    output: BackgroundCheck
    side_effects: ["result set; status=COMPLETED; FLAGGED closes open introductions (cascade)"]

  - method: POST
    path: "/members/{id}/background-checks/{checkId}/cancel"
    description: "Cancel an ordered background check (refund fee to wallet)"
    roles: [ScreeningOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["status=CANCELLED; fee refunded to wallet_credit_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed user acting on a resource it does not own" }

  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, out-of-range value, or end_at <= start_at / max_age < min_age" }

  # --- Not found ---
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "MembershipPlan id does not exist" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "Membership id does not exist" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "Screening id does not exist" }
  - { id: ERR_INTRODUCTION_NOT_FOUND, http: 404, condition: "Introduction id does not exist" }
  - { id: ERR_FREEZE_NOT_FOUND, http: 404, condition: "Freeze id does not exist" }
  - { id: ERR_DATE_NOT_FOUND, http: 404, condition: "DateEvent id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "CoachingSession id does not exist" }
  - { id: ERR_CHECK_NOT_FOUND, http: 404, condition: "BackgroundCheck id does not exist" }

  # --- State ---
  - { id: ERR_MEMBER_NOT_PROSPECT, http: 409, condition: "Screening requested but Member is not in PROSPECT state" }
  - { id: ERR_MEMBER_FROZEN, http: 409, condition: "Operation blocked because the Member/Membership is FROZEN" }
  - { id: ERR_MEMBER_NOT_EXITABLE, http: 409, condition: "Exit requested but Member is not ACTIVE or FROZEN" }
  - { id: ERR_SCREENING_ALREADY_DECIDED, http: 409, condition: "Decide called on a screening whose decision is not PENDING" }
  - { id: ERR_MEMBER_NOT_APPROVED, http: 409, condition: "Membership activation requires Member.screening_decision == APPROVED" }
  - { id: ERR_INVALID_INTRODUCTION_STATE, http: 409, condition: "Introduction operation invalid for its current status (e.g., respond on DECLINED/CLOSED, close on terminal)" }
  - { id: ERR_ALREADY_RESPONDED, http: 409, condition: "Acting member already recorded a response on this introduction" }
  - { id: ERR_MEMBERSHIP_NOT_CANCELLABLE, http: 409, condition: "Cancel/exit requires Membership in ACTIVE or FROZEN" }
  - { id: ERR_FREEZE_NOT_ACTIVE, http: 409, condition: "Resume requires Freeze in ACTIVE status" }
  - { id: ERR_FREEZE_NOT_CANCELLABLE, http: 409, condition: "Cancel requires Freeze in SCHEDULED status" }
  - { id: ERR_DATE_NOT_SCHEDULED, http: 409, condition: "Date operation requires DateEvent in SCHEDULED status" }
  - { id: ERR_DATE_NOT_STARTED, http: 409, condition: "Outcome requires clock now >= DateEvent.start_at" }
  - { id: ERR_SESSION_NOT_BOOKED, http: 409, condition: "Coaching operation requires CoachingSession in BOOKED status" }
  - { id: ERR_CHECK_NOT_ORDERED, http: 409, condition: "Complete/cancel requires BackgroundCheck in ORDERED status" }
  - { id: ERR_COACHING_SUSPENDED, http: 409, condition: "Coaching booking blocked because coaching_suspended (no_show_strikes >= 3)" }

  # --- Referential ---
  - { id: ERR_SELF_INTRODUCTION, http: 422, condition: "member_a_id == member_b_id" }
  - { id: ERR_NOT_INTRODUCTION_PARTY, http: 422, condition: "Responder/feedback author/date scheduler is not member_a or member_b" }
  - { id: ERR_PLAN_ARCHIVED, http: 422, condition: "Membership activation against an archived plan" }

  # --- Safety / eligibility ---
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 422, condition: "An introduction party is not ACTIVE with APPROVED screening" }
  - { id: ERR_PREFERENCE_MISMATCH, http: 422, condition: "Gender/age preference not mutually satisfied" }
  - { id: ERR_DEALBREAKER, http: 422, condition: "A party carries a dealbreaker tag of the other" }
  - { id: ERR_BACKGROUND_FLAGGED, http: 422, condition: "A party has a FLAGGED BackgroundCheck" }
  - { id: ERR_COMPATIBILITY_TOO_LOW, http: 422, condition: "compatibility_score < 70.00 at suggestion" }

  # --- Temporal ---
  - { id: ERR_DATE_OVERLAP, http: 409, condition: "New DateEvent overlaps an existing SCHEDULED DateEvent or BOOKED CoachingSession of the scheduler (half-open)" }
  - { id: ERR_COACHING_BUFFER_CONFLICT, http: 409, condition: "New CoachingSession violates the COACHING_BUFFER_MIN gap from a SCHEDULED DateEvent" }

  # --- Fiscal ---
  - { id: ERR_GUARANTEE_EXHAUSTED, http: 402, condition: "Introduction credit cost exceeds member_a guarantee_remaining_forecast" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_a_version / expected_introduction_version does not match current parent version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BillingAdmin
    description: "Operator who manages plans, membership lifecycle (activate/cancel/exit/freeze) and refunds"
    identity: "opaque"
    exclusive_operations:
      - "POST /membership-plans — create plan"
      - "POST /membership-plans/{id}/archive — archive plan"
      - "POST /members/{id}/memberships — activate membership"
      - "POST /memberships/{id}/cancel — cancel membership"
      - "POST /members/{id}/exit — exit member"
      - "POST /memberships/{id}/freezes — schedule freeze"
      - "POST /memberships/{id}/freezes/{id}/resume — resume freeze"
      - "POST /memberships/{id}/freezes/{id}/cancel — cancel freeze"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET endpoints across plans, members, memberships, introductions, dates, sessions, checks"

  - name: ScreeningOfficer
    description: "Operator who registers prospects, runs screening and background checks"
    identity: "opaque"
    exclusive_operations:
      - "POST /members/{id}/screenings — open screening"
      - "POST /members/{id}/screenings/{id}/decide — decide screening"
      - "POST /members/{id}/background-checks/{id}/complete — complete check"
      - "POST /members/{id}/background-checks/{id}/cancel — cancel check"
    shared_operations:
      - "POST /members — register prospect (shared with Matchmaker)"
      - "POST /members/{id}/background-checks — order check (shared with Member)"
      - "GET endpoints"

  - name: Matchmaker
    description: "Operator who suggests introductions, runs coaching, records date/coaching outcomes"
    identity: "opaque"
    exclusive_operations:
      - "POST /introductions — suggest introduction"
      - "POST /introductions/{id}/close — close introduction"
      - "POST /date-events/{id}/outcome — record date outcome"
      - "POST /coaching-sessions/{id}/outcome — record coaching outcome"
    shared_operations:
      - "POST /members — register prospect (shared with ScreeningOfficer)"
      - "PUT /members/{id}/preferences — set preferences (shared with Member)"
      - "POST /introductions/{id}/date-events — schedule date (shared with Member)"
      - "POST /date-events/{id}/cancel — cancel date (shared with Member)"
      - "POST /members/{id}/coaching-sessions — book coaching (shared with Member)"
      - "POST /coaching-sessions/{id}/cancel — cancel coaching (shared with Member)"
      - "GET endpoints"

  - name: Member
    description: "An authenticated member acting on their own introductions, feedback, preferences, dates, coaching and checks"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /introductions/{id}/respond — respond to own introduction"
      - "POST /introductions/{id}/feedback — submit feedback on own introduction"
    shared_operations:
      - "PUT /members/{id}/preferences — set own preferences (shared with Matchmaker)"
      - "POST /introductions/{id}/date-events — schedule own date (shared with Matchmaker)"
      - "POST /date-events/{id}/cancel — cancel own date (shared with Matchmaker)"
      - "POST /members/{id}/coaching-sessions — book own coaching (shared with Matchmaker)"
      - "POST /coaching-sessions/{id}/cancel — cancel own coaching (shared with Matchmaker)"
      - "POST /members/{id}/background-checks — order own check (shared with ScreeningOfficer)"
      - "GET endpoints on own resources"
