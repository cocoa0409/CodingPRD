      - name: corner_plan_type_must_agree_with_the_schooling_status
        claim_type: Error triggerability
        grounds:
          - errors[ERR_OSY_PLAN_REQUIRES_OUT_OF_SCHOOL]
          - errors[ERR_SUPPLEMENTAL_REQUIRES_ENROLLED]
          - validations[priority 25 ERR_OSY_PLAN_REQUIRES_OUT_OF_SCHOOL]
          - validations[priority 26 ERR_SUPPLEMENTAL_REQUIRES_ENROLLED]
          - entities.Student.fields.schooling_status
          - endpoints[POST /mep/service-plans]
          - endpoints[PATCH /mep/students/{student_id}]
        distinguishing_aspect: "The two plan-type gates are mirror images and both are keyed on the live Student.schooling_status: OSY_ALTERNATIVE is refused for an ENROLLED student, SUPPLEMENTAL_INSTRUCTION is refused once the same student is patched to OUT_OF_SCHOOL, and only then does OSY_ALTERNATIVE succeed - with the refused attempts leaving Student.version untouched."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one ENROLLED Student with grade_level 9 and no ServicePlan"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}", schooling_status: "ENROLLED", grade_level: 9 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id, stu_v1: $.data.version }
          trigger:
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "OSY_ALTERNATIVE", delivery_mode: "WORKSITE", expected_student_version: "${stu_v1}" }
              as: ServiceCoordinator
            - call: "PATCH /mep/students/${stu_id}"
              payload: { schooling_status: "OUT_OF_SCHOOL", has_hs_credential: false, primary_language_not_english: true }
              as: ServiceCoordinator
              captures: { stu_v2: $.data.version, sched_after: $.data.schooling_status }
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "SUPPLEMENTAL_INSTRUCTION", delivery_mode: "IN_PERSON", expected_student_version: "${stu_v2}" }
              as: ServiceCoordinator
            - call: "POST /mep/service-plans"
              payload: { student_id: "${stu_id}", plan_type: "OSY_ALTERNATIVE", delivery_mode: "WORKSITE", expected_student_version: "${stu_v2}" }
              as: ServiceCoordinator
              captures: { plan_id: $.data.id, plan_type_after: $.data.plan_type, plan_alloc: $.data.allocated_hours }
          assert:
            - "first create: HTTP 422 with data.error_id == ERR_OSY_PLAN_REQUIRES_OUT_OF_SCHOOL, because Student.${stu_id}.schooling_status == ENROLLED"
            - "first create wrote nothing: GET /mep/service-plans filtered by student_id ${stu_id} returns 0 rows and Student.${stu_id}.version is still ${stu_v1}"
            - "the PATCH succeeded: Student.${stu_id}.schooling_status == OUT_OF_SCHOOL, pfs_variant == OSY_PATHWAY and version == ${stu_v2} == ${stu_v1} + 1"
            - "second create: HTTP 422 with data.error_id == ERR_SUPPLEMENTAL_REQUIRES_ENROLLED, and Student.${stu_id}.version is still ${stu_v2} - a refused create does not consume the version"
            - "third create: HTTP 201 with ServicePlan.${plan_id}.plan_type == OSY_ALTERNATIVE, delivery_mode == WORKSITE and status == DRAFT"
            - "third create: Student.${stu_id}.service_status == PLAN_DRAFTED and version == ${stu_v2} + 1"

