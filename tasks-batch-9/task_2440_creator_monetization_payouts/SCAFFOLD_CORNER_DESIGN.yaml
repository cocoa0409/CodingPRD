          - state_machines.CreatorFund.transitions.ALLOCATED_to_DRAFT
        distinguishing_aspect: "void-allocations is defined only from ALLOCATED, so calling it on a never-allocated DRAFT fund is 409 ERR_FUND_NOT_ALLOCATED and the state check precedes the OCC comparison even though the supplied version is current."
        test_recipe:
          setup: ["One OPEN period and one DRAFT fund that has never been allocated."]
          setup_api_calls:
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
