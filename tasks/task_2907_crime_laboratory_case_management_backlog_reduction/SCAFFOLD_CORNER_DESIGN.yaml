            - "Analyst.${a1}.qualification_state == QUALIFIED and Analyst.${a1}.consecutive_pt_failures == 0"

      - name: proficiency_test_creation_links_both_parents_and_is_unique_per_cycle
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /lab/proficiency-tests]
          - entities.ProficiencyTest.fields.analyst_id
          - entities.ProficiencyTest.fields.method_id
          - errors[ERR_METHOD_NOT_FOUND]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Both parents must resolve before the junction row is written - an unresolvable method_id gives 404 ERR_METHOD_NOT_FOUND - and once the row exists the scoped key (analyst_id, method_id, test_cycle) is taken, so an identical body gives 409 ERR_DUPLICATE_RESOURCE while the same pair in cycle 2026-C2 is accepted."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00."
            - "Method M1 VALIDATED, BIOLOGY, standard_hours_per_item 4.00, min_competency_level 3."
            - "No Method row has id 00000000-0000-4000-8000-0000000000ff."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Junction Subject", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "STR Autosomal Typing", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 3, max_items_per_request: 6, is_consumptive: true, accreditation_scope_code: "BIO-STR-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
          trigger:
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "00000000-0000-4000-8000-0000000000ff", test_cycle: "2026-C1", due_utc: "2026-08-15T00:00:00Z" }
              as: QualityManager
              captures: { err_fk: $.data.error_id }
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C1", due_utc: "2026-08-15T00:00:00Z" }
              as: QualityManager
              captures: { pt1: $.data.id }
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C1", due_utc: "2026-08-20T00:00:00Z" }
              as: QualityManager
              captures: { err_dup: $.data.error_id }
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C2", due_utc: "2026-09-15T00:00:00Z" }
              as: QualityManager
              captures: { pt2: $.data.id }
            - call: "GET /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}" }
              as: QualityManager
          assert:
            - "first trigger: HTTP status == 404 and ${err_fk} == ERR_METHOD_NOT_FOUND"
            - "second trigger: HTTP status == 201"
            - "ProficiencyTest.${pt1}.analyst_id == ${a1} and ProficiencyTest.${pt1}.method_id == ${m1}"
            - "ProficiencyTest.${pt1}.status == ASSIGNED and ProficiencyTest.${pt1}.test_cycle == 2026-C1"
            - "third trigger: HTTP status == 409 and ${err_dup} == ERR_DUPLICATE_RESOURCE"
            - "ProficiencyTest.${pt1}.due_utc == 2026-08-15T00:00:00Z (the duplicate body did not overwrite it)"
            - "fourth trigger: HTTP status == 201 and ProficiencyTest.${pt2}.test_cycle == 2026-C2"
            - "the listing returns total_count == 2"

      - name: analyst_patch_lowers_capacity_and_the_workload_read_follows
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /lab/analysts/{analyst_id}]
          - calculations.analyst_workload_variants
          - entities.Analyst.fields.weekly_capacity_hours
        distinguishing_aspect: "PATCH stores the new weekly_capacity_hours and the derived read recomputes from it - available_hours 32.00 -> 16.00 and projected_utilization_pct 25.00 -> 50.00 on an unchanged 8.00-hour assignment - and the utilization gate is NOT re-run on update, so the existing ACTIVE assignment survives untouched."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00 -> available 32.00."
            - "Method M1 VALIDATED, BIOLOGY, standard_hours_per_item 4.00, min_competency_level 3, max_items_per_request 6."
            - "Case C1 (OTHER) ACCEPTED with one BIOLOGICAL vault item; request R1 (item_count 2 -> 8.00 hours) is assigned to A1."
            - "Hand-executed formulas: before round_half_up(8.00 / 32.00 * 100, 2) == 25.00; after available round_half_up(24.00 - 8.00, 2) == 16.00 and round_half_up(8.00 / 16.00 * 100, 2) == 50.00; casework_training_ratio round_half_up(8.00 / 8.00, 2) == 1.00 in both reads."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Capacity Patch Subject", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /lab/methods"
              payload: { name: "STR Autosomal Typing", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 3, max_items_per_request: 6, is_consumptive: true, accreditation_scope_code: "BIO-STR-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0401", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab box", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg1: $.data.id }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: QualityManager
              captures: { pre_available: $.data.available_hours, pre_pct: $.data.projected_utilization_pct }
          trigger:
            - call: "PATCH /lab/analysts/${a1}"
              payload: { weekly_capacity_hours: 24.00 }
              as: LabDirector
              captures: { a1_v1: $.data.version, patched_capacity: $.data.weekly_capacity_hours }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: QualityManager
              captures: { post_available: $.data.available_hours, post_pct: $.data.projected_utilization_pct, post_ratio: $.data.casework_training_ratio }
          assert:
            - "${pre_available} == 32.00 and ${pre_pct} == 25.00"
            - "first trigger: HTTP status == 200 and ${patched_capacity} == 24.00"
            - "${a1_v1} != ${a1_v0}"
            - "Analyst.${a1}.training_hours_per_week == 8.00 and Analyst.${a1}.competency_level == 4 (untouched fields keep their values)"
            - "${post_available} == 16.00 and ${post_pct} == 50.00 and ${post_ratio} == 1.00"
            - "Assignment.${asg1}.status == ACTIVE and Assignment.${asg1}.estimated_hours == 8.00"
            - "ExaminationRequest.${r1}.status == ASSIGNED"
            - "Analyst.${a1}.assigned_casework_hours == 8.00"

      - name: workload_read_is_a_pure_derived_view
        claim_type: computed_read
        grounds:
          - endpoints[GET /lab/analysts/{analyst_id}/workload]
          - calculations.analyst_workload_variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / analyst_workload_projected_estimate_vs_realized_logged"
          rationale: "That instance reads the endpoint after a mixed ACTIVE/COMPLETED history and asserts every derived field of both variants against pre-computed literals, which is the computed-read claim for this endpoint."

      - name: court_event_creation_is_allowed_only_on_a_released_request
        claim_type: conditional_action
        grounds:
          - endpoints[POST /lab/court-events]
          - errors[ERR_EXAM_REQUEST_INVALID_STATE]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / court_event_creation_gated_on_examination_request_release_state"
          rationale: "That instance attempts the scheduling call on a request that is not yet RELEASED, asserts the refusal, then repeats it after release, which is exactly the conditional-action claim."

  # ===========================================================================
  # Table 6 (Errors). The catalog is walked for triggerability: every error id in
  # SS1.6 that no SS1.8 instance already exercises gets an instance here. Several
  # instances batch a family of codes that share one setup, so the asserts name
  # every code individually.
  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_ids_return_the_not_found_code_of_each_entity_family
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EXAM_REQUEST_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_REVIEW_RECORD_NOT_FOUND]
          - errors[ERR_PROFICIENCY_TEST_NOT_FOUND]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_VENDOR_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_NONCONFORMANCE_NOT_FOUND]
          - errors[ERR_COURT_EVENT_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns a distinct 404 code; a well-formed UUID that matches no row must not collapse to one generic ERR_NOT_FOUND, and must not be reported as 400 just because the row is absent."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z. No rows of any of the eight families exist, so every id below is syntactically valid and semantically unknown."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "GET /lab/examination-requests/00000000-0000-4000-8000-0000000e0001"
              payload: {}
              as: LabDirector
              captures: { e_req: $.data.error_id }
            - call: "GET /lab/assignments/00000000-0000-4000-8000-0000000e0002"
              payload: {}
              as: LabDirector
              captures: { e_asg: $.data.error_id }
            - call: "GET /lab/review-records/00000000-0000-4000-8000-0000000e0003"
              payload: {}
              as: LabDirector
              captures: { e_rev: $.data.error_id }
            - call: "GET /lab/proficiency-tests/00000000-0000-4000-8000-0000000e0004"
              payload: {}
              as: QualityManager
              captures: { e_pt: $.data.error_id }
            - call: "GET /lab/vendors/00000000-0000-4000-8000-0000000e0005"
              payload: {}
              as: LabDirector
              captures: { e_vendor: $.data.error_id }
            - call: "GET /lab/vendor-engagements/00000000-0000-4000-8000-0000000e0006"
              payload: {}
              as: CaseManager
              captures: { e_eng: $.data.error_id }
            - call: "GET /lab/nonconformances/00000000-0000-4000-8000-0000000e0007"
              payload: {}
              as: QualityManager
              captures: { e_ncr: $.data.error_id }
            - call: "GET /lab/court-events/00000000-0000-4000-8000-0000000e0008"
              payload: {}
              as: CaseManager
              captures: { e_court: $.data.error_id }
          assert:
            - "every one of the eight triggers: HTTP status == 404"
            - "${e_req} == ERR_EXAM_REQUEST_NOT_FOUND"
            - "${e_asg} == ERR_ASSIGNMENT_NOT_FOUND"
            - "${e_rev} == ERR_REVIEW_RECORD_NOT_FOUND"
            - "${e_pt} == ERR_PROFICIENCY_TEST_NOT_FOUND"
            - "${e_vendor} == ERR_VENDOR_NOT_FOUND"
            - "${e_eng} == ERR_VENDOR_ENGAGEMENT_NOT_FOUND"
            - "${e_ncr} == ERR_NONCONFORMANCE_NOT_FOUND"
            - "${e_court} == ERR_COURT_EVENT_NOT_FOUND"
            - "the eight error_id values are pairwise distinct"

      - name: absent_headers_and_unlisted_roles_are_rejected_before_any_state_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=1]
          - validations[priority=2]
          - rbac
        distinguishing_aspect: "401 and 403 are separated by cause, not by endpoint: an empty X-Role or an empty X-User-ID is ERR_UNAUTHENTICATED (401), while a syntactically fine but unrecognised role and a recognised role missing from the endpoint's roles list are both ERR_UNAUTHORIZED (403). All four are decided before the target row is even looked up, so an unknown path id still yields the auth code rather than 404."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
            - "The path ids in the triggers are deliberately unknown - the point is that authentication and authorisation outrank existence."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "GET /lab/cases"
              payload: {}
              as: ""
              captures: { e_no_role: $.data.error_id }
            - call: "POST /lab/examination-requests/00000000-0000-4000-8000-0000000e0011/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: ""
              captures: { e_no_user: $.data.error_id }
            - call: "GET /lab/cases"
              payload: {}
              as: "Custodian"
              captures: { e_bad_role: $.data.error_id }
            - call: "POST /lab/methods/00000000-0000-4000-8000-0000000e0012/retire"
              payload: { retirement_reason: "Role not on this endpoint" }
              as: EvidenceTechnician
              captures: { e_wrong_role: $.data.error_id }
          assert:
            - "first trigger: HTTP status == 401 and ${e_no_role} == ERR_UNAUTHENTICATED"
            - "second trigger: HTTP status == 401 and ${e_no_user} == ERR_UNAUTHENTICATED (the empty X-User-ID is checked before the unknown request id)"
            - "third trigger: HTTP status == 403 and ${e_bad_role} == ERR_UNAUTHORIZED"
            - "fourth trigger: HTTP status == 403 and ${e_wrong_role} == ERR_UNAUTHORIZED (not 404 for the unknown method id)"

      - name: evidence_custody_and_method_lifecycle_violations_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EVIDENCE_CUSTODY_INVALID_STATE]
          - errors[ERR_METHOD_INVALID_STATE]
          - errors[ERR_METHOD_NOT_CONSUMPTIVE]
          - state_machines.EvidenceItem
          - state_machines.Method
          - state_machines.ExaminationRequest[ASSIGNED->IN_ANALYSIS]
        distinguishing_aspect: "One physical item can carry two examination requests (uniqueness is the pair evidence_item_id + method_id), but it can only be in one analyst's hands at a time: the second start-analysis is refused with the custody code, not with the request code, and it succeeds later once the first examination checks the item back in. In the same setup the Method lifecycle refuses both a re-validation of a VALIDATED method and a retirement of a DRAFT method with the single shared ERR_METHOD_INVALID_STATE, and evidence_consumed true is refused on a non-consumptive method."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00 -> available 32.00; the two assignments below total 6.00 hours, so the capacity gate never fires."
            - "Method M1 VALIDATED, BIOLOGY, standard_hours_per_item 4.00, min_competency_level 2, is_consumptive FALSE. Method M2 VALIDATED, BIOLOGY, standard_hours_per_item 2.00, min_competency_level 2. Method M3 left DRAFT."
            - "Case C1 (OTHER, no custody, no dates -> P3_ROUTINE) ACCEPTED with a single BIOLOGICAL item E1."
            - "Requests R1 = (E1, M1, item_count 1 -> 4.00 h) and R2 = (E1, M2, item_count 1 -> 2.00 h); both assigned to A1."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Custody Cycle Examiner", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Serology Screening", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, max_items_per_request: 6, is_consumptive: false, accreditation_scope_code: "BIO-SER-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/methods"
              payload: { name: "Species Determination", discipline: "BIOLOGY", standard_hours_per_item: 2.00, min_competency_level: 2, max_items_per_request: 6, is_consumptive: true, accreditation_scope_code: "BIO-SPC-01" }
              as: QualityManager
              captures: { m2: $.data.id }
            - call: "POST /lab/methods/${m2}/validate"
              payload: { validation_study_item_count: 16, precision_cv_pct: 3.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/methods"
              payload: { name: "Draft Presumptive Screen", discipline: "BIOLOGY", standard_hours_per_item: 3.00, min_competency_level: 2, accreditation_scope_code: "BIO-DRF-01" }
              as: QualityManager
              captures: { m3: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0501", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed stain cutting", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m2}", item_count: 1 }
              as: CaseManager
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v}", assignment_reason: "MANUAL" }
              as: CaseManager
            - call: "POST /lab/examination-requests/${r2}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r2_v}", assignment_reason: "MANUAL" }
              as: CaseManager
            - call: "POST /lab/examination-requests/${r1}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
          trigger:
            - call: "POST /lab/examination-requests/${r2}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
              captures: { e_custody: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/complete-analysis"
              payload: { actual_hours: 4.00, evidence_consumed: true }
              as: Analyst
              as_user_id: "${a1}"
