              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_b_v3: $.data.version }
          trigger:
            - call: "POST /partners/${partner_a}/status-changes"
              payload: { target_status: "SUSPENDED", reason: "Suspend straight out of onboarding.", expected_partner_version: "${partner_a_v1}" }
