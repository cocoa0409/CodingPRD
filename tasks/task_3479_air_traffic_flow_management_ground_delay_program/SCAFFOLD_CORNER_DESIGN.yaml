        distinguishing_aspect: "CDM data-exchange freshness: after the clock advances to 13:30 with the last ETA reported at 12:00 (5400s > FLIGHT_DATA_FRESHNESS_SECONDS 3600), the substitution is rejected with ERR_STALE_FLIGHT_DATA even though both flights are slotted and the shift is legal."
