  - rule_id: resource_temporal_overlap
    instances:
      - name: enclave_session_half_open_span_with_sanitization_buffer
        grounds:
          - calculations.enclave_occupancy_span
          - validations[priority=190]
          - entities.SecureEnclave.fields.sanitization_buffer_minutes
          - entities.SecureEnclave.fields.booked_session_count
          - state_machines.EnclaveSession.BOOKED_to_CLOSED
        distinguishing_aspect: |
          Enclave occupancy is a HALF-OPEN span extended by a 30-minute sanitization buffer and enforced
          by PAIRWISE EXCLUSION, so a booking starting at 11:29 collides with a session that ended at
          11:00 while one starting at exactly 11:30 does not, and the buffer applies to the candidate's
          own tail as well. Closing the first session frees its span immediately, so a window that was
          previously unreachable becomes bookable with no change to the candidate payload's shape.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk, one Agency, one RecordsRequest submitted and RELEASED_FULL, one Investigation, one CLEAN_LOCKED Dataset."
            - "One SecureEnclave with sanitization_buffer_minutes 30 and max_documents 20."
            - "One BOOKED EnclaveSession S1 spanning [2026-08-20T09:00:00Z, 2026-08-20T11:00:00Z) with document_count 5, so its buffered occupancy runs to 2026-08-20T11:30:00Z exclusive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
