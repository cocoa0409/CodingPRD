      - name: site_posture_propagates_the_worst_of_every_required_permit_kind
        claim_type: constraint_propagation
        grounds:
          - calculations.site_permit_posture
          - entities.ServiceSite.fields.right_of_way_required
          - validations[priority=41]
          - errors[ERR_SITE_POSTURE_RESTRICTED]
        distinguishing_aspect: "On a right_of_way_required site an APPROVED PLACEMENT alone rolls up to permit_status NONE (the missing kind is worse than the approved one), and the chain only reaches its fixed point OPEN after the second kind is approved — a single-kind site can never show this."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account and one site with right_of_way_required true."
            - "A PLACEMENT permit is filed, submitted and approved; no RIGHT_OF_WAY filing exists yet."
            - "A CONSTRUCTION contract 40 / freq 3 on that site is quoted so activation can be used as the posture probe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Hollyhock Streetworks", account_type: "MUNICIPAL", credit_terms_days: 45 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
