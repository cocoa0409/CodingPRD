          The identical POST /menu-items/{id}/review APPROVE call returns two different errors
          depending only on the logical clock. The item's shelf_life_days is 30 against a policy
          maximum of 14, so priority 29 is always violated; once the clock passes the cert's
          expires_on, priority 22 is violated too and must win with 409 ERR_CERT_EXPIRED instead
          of 422 ERR_SHELF_LIFE_EXCEEDS_POLICY. The menu item must stay UNDER_REVIEW through both
          rejections.
