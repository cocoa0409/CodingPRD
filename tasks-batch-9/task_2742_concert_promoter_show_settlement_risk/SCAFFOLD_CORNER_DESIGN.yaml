            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${sr_t1_id}", kind: "PROMOTER_HOLD", qty: 6, holder: "Trade and radio, expiring", expires_at: "2026-08-02T00:00:00.000Z" }
