  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/blank, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_STATION_OWNERSHIP_MISMATCH, http: 403, condition: "DealerOperator acting on a resource whose station id != X-User-ID" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Missing required field, unknown field, bad type, invalid enum member, window_start >= window_end, term/period dates inverted, duplicate product_code/truck_code, score out of range" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not exist" }
  - { id: ERR_DEALER_STATION_NOT_FOUND, http: 404, condition: "station id does not exist" }
  - { id: ERR_SUPPLY_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement id does not exist" }
  - { id: ERR_RACK_PRICE_POSTING_NOT_FOUND, http: 404, condition: "posting id does not exist" }
  - { id: ERR_STORAGE_TANK_NOT_FOUND, http: 404, condition: "tank id does not exist" }
  - { id: ERR_TRUCK_NOT_FOUND, http: 404, condition: "truck id does not exist" }
  - { id: ERR_TRANSPORT_DROP_NOT_FOUND, http: 404, condition: "drop id does not exist" }
  - { id: ERR_METER_READING_NOT_FOUND, http: 404, condition: "meter reading id does not exist" }
  - { id: ERR_LOSS_EVENT_NOT_FOUND, http: 404, condition: "loss event id does not exist" }
  - { id: ERR_INVENTORY_RECONCILIATION_NOT_FOUND, http: 404, condition: "reconciliation id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_EFT_DRAFT_NOT_FOUND, http: 404, condition: "draft id does not exist" }
  - { id: ERR_TAX_REMITTANCE_NOT_FOUND, http: 404, condition: "remittance id does not exist" }
  - { id: ERR_BRAND_AUDIT_NOT_FOUND, http: 404, condition: "audit id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state precondition failed (generic transition guard)" }
  - { id: ERR_STATION_NOT_ACTIVE, http: 409, condition: "Station operating_status is not ACTIVE where required (drop create, agreement activate, initiate-buyout)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "No SupplyAgreement in ACTIVE status for the station (drop create gate)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_SAFE_FILL_EXCEEDED, http: 422, condition: "planned_gallons + tank.physical_gallons > capacity_gallons * safe_fill_pct" }
  - { id: ERR_TRUCK_CAPACITY_EXCEEDED, http: 422, condition: "planned_gallons > truck.capacity_gallons" }
  - { id: ERR_TRUCK_WINDOW_CONFLICT, http: 409, condition: "Truck already has a drop in {PLANNED, SCHEDULED, EN_ROUTE} whose half-open window overlaps; adjacency (end == start) is allowed" }
  - { id: ERR_TANK_SETTLE_WINDOW, http: 409, condition: "Same-tank drops in {PLANNED, SCHEDULED, EN_ROUTE} must leave >= 4h between earlier window end and later window start" }
  - { id: ERR_PRICE_POSTING_CONFLICT, http: 409, condition: "A POSTED posting already exists for (terminal_code, product_id, effective_date); use supersede" }
  - { id: ERR_PRICE_NOT_POSTED, http: 422, condition: "No POSTED posting with effective_date <= relevant date for (product, station.home_terminal_code) when pricing a drop" }
  - { id: ERR_EFFECTIVE_DATE_IN_PAST, http: 422, condition: "Posting effective_date is before the current clock date at create" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "current_exposure_cents + estimated_amount_cents > credit_limit_cents (equality allowed)" }
  - { id: ERR_TAX_PERIOD_ALREADY_FILED, http: 409, condition: "Another remittance for the same state with an overlapping (closed-interval) period exists" }
  - { id: ERR_RECONCILIATION_OPEN_EXISTS, http: 409, condition: "Station already has a reconciliation in OPEN or VARIANCE_FLAGGED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reconciliation resolver X-User-ID equals opener_user_id" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "Clock date outside [term_end_date - 90 days, term_end_date] for start-renewal" }
  - { id: ERR_CURE_PERIOD_ACTIVE, http: 409, condition: "Renew blocked: station compliance_status is CURE_PERIOD (or DEFAULT)" }
  - { id: ERR_OVERDUE_INVOICES_EXIST, http: 409, condition: "Renew blocked: station has invoices in OVERDUE" }
  - { id: ERR_METER_READING_REGRESSION, http: 422, condition: "New totalizer below chronological predecessor's or above chronological successor's" }
  - { id: ERR_DRAFT_NOT_EXECUTABLE, http: 409, condition: "Draft not SCHEDULED, or clock date before scheduled_date" }
  - { id: ERR_DRAFT_ALREADY_SCHEDULED, http: 409, condition: "Invoice already has a draft in SCHEDULED" }
  - { id: ERR_LINKED_LOSS_NOT_WRITTEN_OFF, http: 409, condition: "Reconciliation resolve blocked: a linked auto LossEvent is not yet WRITTEN_OFF or VOIDED" }
  - { id: ERR_AGREEMENT_HAS_OPEN_DROPS, http: 409, condition: "Agreement terminate blocked: drops in {PLANNED, SCHEDULED, EN_ROUTE} exist for the station" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: JobberAdmin
    description: "Jobber head-office administrator; owns stations, agreements, tanks, trucks, reconciliations, loss adjudication, logical clock"
    identity: opaque
    exclusive_operations: [create/activate/suspend/reactivate/terminate dealer stations, supply agreement lifecycle (create/amend/activate/renewal/buyout/terminate), create storage tanks, create trucks, create products, open/resolve reconciliations, verify/write-off/void loss events, set logical clock]
    shared_operations: [all GET reads]
  - name: PricingDesk
    description: "Rack pricing desk; posts and supersedes daily rack prices"
    identity: opaque
    exclusive_operations: [create/post/supersede/discard rack price postings]
    shared_operations: [all GET reads]
  - name: Dispatcher
    description: "Transport dispatcher; plans and executes drops"
    identity: opaque
    exclusive_operations: [create/schedule/dispatch/deliver/fail/replan/reconcile/cancel transport drops]
    shared_operations: [all GET reads]
  - name: CreditManager
    description: "Credit desk; sets credit terms, voids invoices, schedules and executes EFT drafts"
    identity: opaque
    exclusive_operations: [patch station credit terms, restore-credit, void invoices, schedule/execute/retry/cancel EFT drafts]
    shared_operations: [all GET reads]
  - name: TaxAccountant
    description: "Fuel tax accountant; opens, files, and pays jurisdictional remittances"
    identity: opaque
    exclusive_operations: [create/file/pay tax remittances]
    shared_operations: [all GET reads]
  - name: BrandInspector
    description: "Brand/image inspector; records station compliance audits"
    identity: opaque
    exclusive_operations: [create brand compliance audits]
    shared_operations: [all GET reads]
  - name: DealerOperator
    description: "Station-side operator; gauges tanks, submits meter readings, reports and disputes losses — only for the station whose id == X-User-ID"
    identity: entity_backed:DealerStation
    exclusive_operations: [gauge tank, create meter readings, create loss events, dispute loss events]
    shared_operations: [GET reads scoped to own station's resources]
