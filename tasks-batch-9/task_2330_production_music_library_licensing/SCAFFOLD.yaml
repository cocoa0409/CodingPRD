    input: ["composition_id?", "fingerprint_match_id?", "status?", "limit?", "offset?"]
    output: InfringementClaim[]
    status_code: 200
    description: "Reverse lookup for InfringementClaim.composition_id and InfringementClaim.fingerprint_match_id."
    side_effects: []

  - method: POST
    path: /music-library/infringement-claims/{claim_id}/notice
    roles: [RightsManager]
    input: [notice_channel]
    output: InfringementClaim
