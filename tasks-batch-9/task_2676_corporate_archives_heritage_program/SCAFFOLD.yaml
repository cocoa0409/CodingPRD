    output: AccessRequest[]
    side_effects: []

  - method: GET
    path: "/access-requests/{id}"
    description: "Fetch one access request with its risk scores and fee."
    roles: [ArchivesDirector, AccessServicesOfficer, LegalCounsel, Requester]
    code: 200
    input: []
    output: AccessRequest
    side_effects: []

  - method: POST
    path: "/access-requests/{id}/begin-screening"
