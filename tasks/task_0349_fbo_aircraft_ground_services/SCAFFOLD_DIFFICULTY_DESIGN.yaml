  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fuel_dispatch_requires_visit_on_ground
        grounds:
          - state_machines.FuelOrder.REQUESTED_to_DISPATCHED
          - state_machines.ServiceVisit.SCHEDULED_to_ON_GROUND
          - entities.ServiceVisit.fields.status
        distinguishing_aspect: |
          A FuelOrder REQUESTED->DISPATCHED is rejected when its parent
          ServiceVisit is still SCHEDULED (not in {ON_GROUND, SERVICING}) —
          the FuelOrder<-ServiceVisit pair gates the transition.
        test_recipe:
          setup:
            - "A REQUESTED fuel order whose parent visit is still SCHEDULED (never arrived)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_id: $.data.id }
          trigger:
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "FuelOrder.${fo_id}.logistics_status == REQUESTED"

      - name: visit_mark_ready_requires_children_settled
        grounds:
          - state_machines.ServiceVisit.SERVICING_to_READY_FOR_DEPARTURE
          - entities.ServiceVisit.fields.services_outstanding
          - entities.RampService.fields.status
        distinguishing_aspect: |
          A ServiceVisit SERVICING->READY_FOR_DEPARTURE is rejected while a child
          RampService is still REQUESTED/IN_PROGRESS (services_outstanding > 0) —
          a ServiceVisit<-RampService pair, different from the FuelOrder<-ServiceVisit pair.
        test_recipe:
          setup:
            - "A SERVICING visit with one RampService still IN_PROGRESS (services_outstanding == 1)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "TD-3", spot_type: "TIE_DOWN", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T08:00:00.000Z", occupy_end_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa_id: $.data.id, pa_ver: $.data.version }
            - call: "POST /parking-assignments/${pa_id}/occupy"
              payload: { expected_assignment_version: "${pa_ver}" }
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/start-servicing"
              payload: {}
              as: OpsDispatcher
            - call: "POST /ramp-services"
              payload: { service_visit_id: "${v_id}", service_type: "GPU" }
              as: OpsDispatcher
              captures: { rs_id: $.data.id }
            - call: "POST /ramp-services/${rs_id}/start"
              payload: {}
              as: LineManager
          trigger:
            - call: "POST /service-visits/${v_id}/mark-ready"
