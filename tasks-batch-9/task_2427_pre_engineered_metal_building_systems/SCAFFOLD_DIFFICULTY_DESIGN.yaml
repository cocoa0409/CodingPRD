  - rule_id: priority_pair_validation_conflict
    instances:
      - name: drawings_not_sealed_beats_credit_exceeded_on_release
        grounds:
          - validations[priority=10, error_id=ERR_DRAWINGS_NOT_SEALED]
          - validations[priority=15, error_id=ERR_BUILDER_CREDIT_EXCEEDED]
          - calculations.quote_price_pipeline
          - calculations.builder_credit_ledger
        distinguishing_aspect: |
          Category pair: state (priority 10) versus business_fiscal (priority 15), on
          POST /orders/{id}/release-to-fabrication. Both conditions hold at once — the order's drawing
          package is still PENDING and the FINAL price is 1981535 cents above the builder's remaining
          credit of 0 — and the permitting gate must win. An implementation that prices the order before
          checking the permit set returns ERR_BUILDER_CREDIT_EXCEEDED (402) instead of
          ERR_DRAWINGS_NOT_SEALED (409).
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; BRONZE builder b2 with credit_limit_cents exactly 10019831, AUTHORIZED."
            - "Configuration cfg2 for b2 with the reference geometry and both reference accessory kits, LOCKED."
            - "Quote q2 (BRONZE, no tier discount, 240 freight miles, no adjustment) prices at 10019831 and is issued and accepted, leaving credit_available_cents at 0."
            - "Heavy ASD design d2 on cfg2 (20 x C-1 and 16 x R-1 plus both connection details) is APPROVED, so the FINAL price will be 12001366."
            - "DrawingPackage dp2 exists for d2 but is still PENDING."
