  - section: rbac
    instances:

      - name: operations_coordinator_cannot_create_regions_returns_forbidden
        claim_type: role_denial
        grounds:
          - roles.OperationsCoordinator
          - endpoints.POST_/regions
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Region provisioning is exclusive to PlatformAdmin: the same body that returns 201 for the admin returns 403 ERR_FORBIDDEN for the operations coordinator, and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /regions"
              payload: { name: "Puget Sound", service_area_codes: ["98101"], traditional_commission_pct: 0.025, target_client_ratio: 2.0 }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 403 with error_id == ERR_FORBIDDEN"
            - "error_id != ERR_UNAUTHENTICATED — the role is known, it is simply not permitted"
            - "GET /regions/00000000-0000-4000-8000-000000000000 returns 404, confirming no region was written"

      - name: lead_agent_cannot_create_a_listing_for_another_agents_client
        claim_type: ownership
        grounds:
          - roles.ListingAgent
          - endpoints.POST_/listing-agreements
          - validations[priority=2]
        distinguishing_aspect: "ListingAgent is entity_backed: the acting agent can only list a client whose assigned_agent_id is its own id, so a second agent attempting the same call is refused with 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with a high ratio target, two lead agents, one SELL client assigned to the first agent."
          setup_api_calls:
