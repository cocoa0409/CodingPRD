scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 - dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: budget_basis_variant_divergence_on_same_analysis
        grounds: "§1.3 calculations.study_budget_totals declares variants coverage_driven_per_patient and calendar_driven_per_patient; §1.5 POST /research-billing/studies/{id}/budget-build takes `basis` as the variant selector; §1.1 Study.budget_basis records which variant produced the stored totals."
        distinguishing_aspect: "The COVERAGE_DRIVEN variant sums CoverageItem.expected_occurrences (what the protocol projected); the CALENDAR_DRIVEN variant sums VisitChargeRoute.occurrences (what the EHR calendar will actually drop). Item 36415 is projected 4 times but routed 3 times, so the same approved analysis yields per_patient_subtotal_cents 372000 / per_patient_budget_cents 491040 under COVERAGE_DRIVEN and 369000 / 487080 under CALENDAR_DRIVEN - a 3960-cent delta that no single-variant implementation can produce. invoiceable_budget_cents is 396000 under both, proving the divergence is confined to the per-patient dimension."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study with a qualifying QCT determination and one approved analysis carrying three PER_PATIENT items (one payer-borne, two sponsor-borne) plus one sponsor-borne INVOICEABLE item. A single-visit calendar routes 36415 three times (against 4 projected occurrences), 71260 twice and 80053 once. The budget is first built COVERAGE_DRIVEN, then rebuilt CALENDAR_DRIVEN from the identical analysis."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-A", title: "Phase II hepatic imaging", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000001" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "36415", description: "Research blood draw", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 5000, negotiated_unit_cents: 3000, units_per_occurrence: 1, expected_occurrences: 4 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_draw_id: "$.data.id" }
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v2}", item_code: "71260", description: "CT abdomen with contrast", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 200000, negotiated_unit_cents: 180000, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_ct_id: "$.data.id" }
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v3: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v3}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_cmp_id: "$.data.id" }
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v4: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v4}", item_code: "IRB-FEE", description: "One-time IRB review fee", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "INVOICEABLE", charge_master_unit_cents: 0, negotiated_unit_cents: 300000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_irb_id: "$.data.id" }
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v3: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 32.0, expected_study_version: "${study_v3}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { coverage_driven_per_patient: "$.data.per_patient_budget_cents" }
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_id}", source_analysis_id: "${analysis_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { calendar_id: "$.data.id" }
            - call: "POST /research-billing/calendar-visits"
              payload: { study_calendar_id: "${calendar_id}", visit_name: "Cycle 1 Day 1", sequence_index: 1, target_day_offset: 0, window_before_days: 0, window_after_days: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { visit_1_id: "$.data.id" }
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_1_id}", coverage_item_id: "${item_draw_id}", occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_1_id}", coverage_item_id: "${item_ct_id}", occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_1_id}", coverage_item_id: "${item_cmp_id}", occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/study-calendars/${calendar_id}/publish"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v4: "$.data.version" }
          trigger:
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "CALENDAR_DRIVEN", indirect_rate_pct: 32.0, expected_study_version: "${study_v4}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
          assert:
            - "the COVERAGE_DRIVEN build in setup returned per_patient_subtotal_cents 372000 and per_patient_budget_cents 491040 (12000 + 360000, indirect 119040 at 32.0%)"
            - "trigger response 200 with budget_basis == \"CALENDAR_DRIVEN\""
            - "trigger response per_patient_subtotal_cents == 369000 (9000 from 36415 routed 3 times + 360000 from 71260 routed twice; the payer-borne 80053 route contributes 0)"
            - "trigger response per_patient_budget_cents == 487080 (369000 + round_half_up(369000 * 32.0 / 100) == 369000 + 118080)"
            - "trigger response invoiceable_subtotal_cents == 300000 and invoiceable_budget_cents == 396000, identical under both variants"
            - "trigger response effective_indirect_rate_pct == 32.0 and budget_status == \"BUILT\""

      - name: routing_expectation_service_date_vs_current_effective_divergence
        grounds: "§1.3 calculations.charge_routing_expectation declares variants as_of_service_date and current_effective; §1.4 priority 28 uses the as_of_service_date variant to gate ERR_ROUTING_CONTRADICTS_COVERAGE while §1.1 Charge.expected_routing_target and Charge.improper_flag are fed by current_effective."
        distinguishing_aspect: "Same charge row, same request, two answers: the review gate consults the analysis that was effective on 2026-08-05 (revision 1, where 80053 is ROUTINE_CARE -> PAYER) and therefore accepts CLEAR_TO_PAYER with no override_justification, while the persisted expectation consults the study's single currently-APPROVED analysis (revision 2, where 80053 is RESEARCH_PAID -> SPONSOR) and immediately marks the very charge it just accepted as improper. A single-variant implementation either rejects the review (if it uses current_effective everywhere) or leaves improper_flag false (if it uses as_of_service_date everywhere)."
        test_recipe:
          setup:
            - "Reuse the study/analysis skeleton of budget_basis_variant_divergence_on_same_analysis through approval of revision 1 (80053 classified ROUTINE_CARE / STANDARD_OF_CARE / PER_PATIENT, charge_master 9000). Clock is 2026-08-05 when a charge for 80053 is posted. Clock then advances to 2026-08-20, an ITEM_CHANGE amendment is implemented, and revision 2 - which reclassifies 80053 as RESEARCH_PAID with negotiated 7000 - is approved. The amendment's scope is ITEM_CHANGE so calendar_rebuild_required is false and billing_hold_posture returns to OPEN once revision 2 is approved."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-B", title: "Metabolic substudy", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000002" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { rev1_id: "$.data.id", rev1_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${rev1_id}", expected_coverage_analysis_version: "${rev1_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${rev1_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${rev1_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "80053", service_date: "2026-08-05", amount_cents: 9000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id" }
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/amendments"
              payload: { study_id: "${study_id}", scope: "ITEM_CHANGE", effective_date: "2026-08-18" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { amendment_id: "$.data.id" }
            - call: "POST /research-billing/amendments/${amendment_id}/implement"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { study_v3: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v3}", supersedes_analysis_id: "${rev1_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { rev2_id: "$.data.id", rev2_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${rev2_id}", expected_coverage_analysis_version: "${rev2_v1}", item_code: "80053", description: "Comprehensive metabolic panel (now sponsor-paid)", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 7000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${rev2_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${rev2_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          trigger:
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "CLEAR_TO_PAYER" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          assert:
            - "trigger response 200 - NOT ERR_ROUTING_CONTRADICTS_COVERAGE - because the as_of_service_date variant resolves 2026-08-05 to revision 1 (approved_at 2026-08-05T09:00:00Z, still selectable in status SUPERSEDED) where 80053 is billable_to PAYER"
            - "trigger response routing_state == \"ROUTED_PAYER\" and billing_state == \"BILLED_PAYER\""
            - "trigger response expected_routing_target == \"SPONSOR\" (current_effective variant reads revision 2, the study's only APPROVED analysis)"
            - "trigger response improper_flag == true in the same response body that recorded the successful payer routing"
            - "trigger response coverage_item_id equals the 80053 item of revision 1, not of revision 2 (the link follows the as_of_service_date variant)"
            - "GET /research-billing/studies/${study_id} afterwards shows payer_billed_cents == 9000 and improper_payer_exposure_cents == 9000"

  # =========================================================================
  # RULE 2 - combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: indirect_rate_surcharge_before_cap_three_input_interaction
        grounds: "§1.3 calculations.study_effective_indirect_rate with constants FEDERAL_INDIRECT_CAP_PCT 26.0, INDUSTRY_INDIRECT_CAP_PCT 32.0, INDUSTRY_SMALL_STUDY_SURCHARGE_PCT 3.0, INDUSTRY_TIER_THRESHOLD_CENTS 500000."
        distinguishing_aspect: "Mode (a) - three independent inputs combine through a branch, a threshold and two nested caps: funding_source picks the branch, per_patient_subtotal_cents (itself an output of step 1 of study_budget_totals) picks the tier inside the INDUSTRY branch, and the requested rate is then surcharged BEFORE being capped. A requested 30.0 on a small industry study yields exactly 32.0 - not 33.0 (surcharge without cap), not 30.0 (cap applied to a rate that never exceeded it), and not 26.0 (federal cap misapplied). The cap therefore swallows exactly 1.0 point of the 3.0-point surcharge. This is a different combinatorial mode from invoice_indirect_rounds_per_line_then_sums (mode b, rounding order over a set of lines) and invoice_volume_credit_tiered_on_gross_never_on_net (mode c, evaluation order of an apparently self-referential total)."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study whose approved analysis carries exactly the two sponsor-borne PER_PATIENT items of the 372000-cent grid (36415 at 3000 x 4 and 71260 at 180000 x 2), so per_patient_subtotal_cents is 372000, below INDUSTRY_TIER_THRESHOLD_CENTS 500000."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C", title: "Small industry study", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000003" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "36415", description: "Research blood draw", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 5000, negotiated_unit_cents: 3000, units_per_occurrence: 1, expected_occurrences: 4 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "GET /research-billing/coverage-analyses/${analysis_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v2}", item_code: "71260", description: "CT abdomen with contrast", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 200000, negotiated_unit_cents: 180000, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v3: "$.data.version" }
          trigger:
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 30.0, expected_study_version: "${study_v3}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
          assert:
            - "trigger response 200 with indirect_rate_pct == 30.0 (the request is stored verbatim)"
            - "trigger response effective_indirect_rate_pct == 32.0 - min(30.0 + 3.0, 32.0), i.e. the small-study surcharge is applied first and then clipped by the industry cap"
            - "trigger response per_patient_subtotal_cents == 372000, which is below INDUSTRY_TIER_THRESHOLD_CENTS 500000 and therefore selects the surcharged branch"
            - "trigger response per_patient_budget_cents == 491040 (372000 + round_half_up(372000 * 32.0 / 100) == 372000 + 119040), NOT 494760 which 33.0% would give and NOT 483600 which 30.0% would give"
            - "trigger response invoiceable_subtotal_cents == 0 and invoiceable_budget_cents == 0 (this study's grid has no INVOICEABLE item)"

      - name: invoice_indirect_rounds_per_line_then_sums
        grounds: "§1.3 calculations.sponsor_invoice_indirect pins round-per-line-then-sum, in explicit contrast to calculations.study_budget_totals which pins sum-then-round; §1.1 SponsorInvoice.indirect_cents and gross_total_cents."
        distinguishing_aspect: "Mode (b) - the combinatorial content is the interaction between a set of line amounts and one rounding operator, and the answer depends on where the operator is applied. Two lines of 12345 cents at 32.0% give 3950 + 3950 == 7900 under round-per-line, but round_half_up(24690 * 0.32) == 7901 under sum-then-round. The one-cent gap is the whole test: gross_total_cents must read 32590, never 32591. The same scaffold demands the opposite order in study_budget_totals, so an implementation with a single shared helper fails one of the two."
        test_recipe:
          setup:
            - "An INDUSTRY_SPONSORED study with effective_indirect_rate_pct 32.0 (requested 32.0 on a small per-patient subtotal), open to accrual with a published single-visit calendar, and exactly two sponsor-routed UNBILLED charges of 12345 cents each posted through the charge interface and reviewed HOLD_FOR_SPONSOR."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-D", title: "Rounding-order probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000004" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 20000, negotiated_unit_cents: 12345, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { item_infusion_id: "$.data.id" }
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
