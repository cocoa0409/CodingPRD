  - { method: POST, path: "/api/production-runs", description: "schedule a production run on a plant line; half-open window overlap check", roles: [PlantScheduler], code: 201, input: [plant_id, line_code, product_id, window_start, window_end, capacity_units, planned_units], output: ProductionRun, side_effects: [] }
  - { method: GET, path: "/api/production-runs", description: "list runs; filters plant_id?, product_id?, status?", roles: [BrandAdmin, PlantScheduler, SafetyOfficer], code: 200, input: ["plant_id?", "product_id?", "status?"], output: "ProductionRun[]", side_effects: [] }
  - { method: POST, path: "/api/production-runs/{id}/complete", description: "complete a run; creates one Lot with available_units = actual_units - waste_units", roles: [PlantScheduler], code: 200, input: [actual_units, waste_units], output: ProductionRun, side_effects: ["creates Lot", "increments ProductionRun.version by 1"] }
  - { method: GET, path: "/api/lots", description: "list lots; filters production_run_id?, product_id?, status?", roles: [BrandAdmin, DistributorRep, PlantScheduler, SafetyOfficer], code: 200, input: ["production_run_id?", "product_id?", "status?"], output: "Lot[]", side_effects: ["lazy EXHAUSTED evaluation"] }
  - { method: POST, path: "/api/deliveries", description: "distributor ships allocated lots to an account; moves lot allocated->delivered, order UNSHIPPED->IN_TRANSIT", roles: [DistributorRep], code: 201, input: [order_id, account_id, lines], output: Delivery, side_effects: ["lot.allocated_units -= qty; lot.delivered_units += qty per line", "order.fulfillment_status = IN_TRANSIT", "increments Order.version by 1"] }
