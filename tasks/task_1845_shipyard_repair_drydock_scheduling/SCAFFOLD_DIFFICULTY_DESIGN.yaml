  # ===================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: hot_work_item_start_requires_granted_permit
        grounds:
          - state_machines.WorkItem.PLANNED_to_IN_PROGRESS
          - state_machines.Permit.APPLIED_to_GRANTED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair WorkItem -> Permit: the start transition's legality depends on
          the state of a DIFFERENT entity (a project Permit must be GRANTED, not
          APPLIED or SUSPENDED, and covering the current logical time). The same
          start request fails before the grant and succeeds after it, with no change
          to the work item itself.
        test_recipe:
          setup:
            - "IN_DOCK project with one hot-work work item; an HOT_WORK permit for 2026-08-01..2026-08-15 exists only in APPLIED state"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Weld doubler plate", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 1, unit_price_cents: 10000, requires_hot_work: true }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/permits"
              payload: { project_id: "${p_id}", permit_type: "HOT_WORK", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-15T23:59:59Z" }
              as: EnvironmentalOfficer
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err_applied: $.data.error_id }
            - call: "POST /v1/permits/${permit_id}/grant"
              as: EnvironmentalOfficer
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_status: $.data.status }
          assert:
            - "captured err_applied == ERR_HOT_WORK_PERMIT_REQUIRED (APPLIED permit does not satisfy the gate; current logical time 2026-08-01T00:00:00Z is inside the window but state is wrong)"
            - "captured w_status == IN_PROGRESS after the permit transitions to GRANTED"
      - name: project_completion_gate_awaits_passed_survey
        grounds:
          - state_machines.RepairProject.IN_DOCK_to_WORK_COMPLETE
          - state_machines.Survey.SCHEDULED_to_FAILED
          - state_machines.Survey.SCHEDULED_to_PASSED
        distinguishing_aspect: |
          Entity pair RepairProject -> Survey (different pair from WorkItem ->
          Permit above): the project's auto-completion is withheld while the LATEST
          USCG_INSPECTION survey is FAILED, and released only when a newer survey of
          the same type is PASSED — project state is a function of survey state.
        test_recipe:
          setup:
            - "IN_DOCK project with required_survey_types [USCG_INSPECTION]; its only work item COMPLETE; latest USCG survey FAILED with 2 deficiencies"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10", required_survey_types: ["USCG_INSPECTION"] }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Propeller polish", trade_code: "MACHINERY", pricing_mode: "LUMP_SUM", duration_days: 3, quantity: 1, unit_price_cents: 800000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "USCG_INSPECTION", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T12:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s1: $.data.id }
            - call: "POST /v1/surveys/${s1}/record-result"
              payload: { result: "FAILED", deficiency_count: 2 }
              as: ClassSurveyor
              as_user_id: "sv_1"
          trigger:
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { st_failed: $.data.status }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "USCG_INSPECTION", scheduled_start_utc: "2026-08-03T09:00:00Z", scheduled_end_utc: "2026-08-03T10:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s2: $.data.id }
            - call: "POST /v1/surveys/${s2}/record-result"
              payload: { result: "PASSED" }
              as: ClassSurveyor
              as_user_id: "sv_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { st_passed: $.data.status }
          assert:
            - "captured st_failed == IN_DOCK (all work COMPLETE but latest USCG_INSPECTION survey FAILED — completion withheld)"
            - "captured st_passed == WORK_COMPLETE (latest survey of the required type is PASSED — gate released)"

  # ===================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_booking_half_open_buffer_overlap
        grounds:
          - validations[priority=9]
          - calculations.calc_dockage_fee
          - errors[ERR_DOCK_SLOT_CONFLICT]
        distinguishing_aspect: |
          Resource DockBerth, half-open semantics with a 12h turnaround buffer: the
          occupied interval is [start_utc, end_utc + 12h). A follow-on booking
          starting exactly at the prior end (inside the buffer) conflicts, while one
          starting exactly at end + 12h is admitted — adjacency at the buffer edge
          is NOT a conflict, unlike the closed-interval survey rule below.
        test_recipe:
          setup:
            - "Dock 1 holds a BOOKED reservation 2026-08-01T00:00Z -> 2026-08-10T00:00Z (occupied through 2026-08-10T12:00Z with the buffer)"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-10T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r1: $.data.id }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-15T00:00:00Z", expected_project_version: "${p_v2}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-10T12:00:00Z", end_utc: "2026-08-15T00:00:00Z", expected_project_version: "${p_v2}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r3_status: $.data.status }
          assert:
            - "captured err_overlap == ERR_DOCK_SLOT_CONFLICT (start 2026-08-10T00:00Z falls inside the prior booking's 12h turnaround buffer)"
            - "captured r3_status == BOOKED (start exactly at end + 12h = 2026-08-10T12:00Z: half-open semantics admit exact adjacency at the buffer edge)"
            - "the failed middle booking left project version unchanged, so ${p_v2} was accepted on the third call"
      - name: surveyor_back_to_back_closed_interval_conflict
        grounds:
          - validations[priority=9]
          - state_machines.Survey.SCHEDULED_to_PASSED
          - errors[ERR_SURVEYOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: the surveyor's calendar (different resource entity from
          DockBerth), CLOSED-interval semantics: a survey starting exactly when the
          surveyor's previous survey ends still conflicts (touching endpoints count),
          whereas the same window booked under a different surveyor succeeds —
          opposite adjacency behaviour from the dock's half-open buffer rule.
        test_recipe:
          setup:
            - "Surveyor sv_1 holds a SCHEDULED survey 2026-08-04T09:00Z -> 2026-08-04T12:00Z"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "CLASS_INTERMEDIATE", scheduled_start_utc: "2026-08-04T09:00:00Z", scheduled_end_utc: "2026-08-04T12:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "LOAD_LINE", scheduled_start_utc: "2026-08-04T12:00:00Z", scheduled_end_utc: "2026-08-04T15:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { err_touch: $.data.error_id }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "LOAD_LINE", scheduled_start_utc: "2026-08-04T09:00:00Z", scheduled_end_utc: "2026-08-04T12:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_2"
              captures: { s3_status: $.data.status }
          assert:
            - "captured err_touch == ERR_SURVEYOR_SCHEDULE_CONFLICT (closed interval: start == prior end still overlaps for the same surveyor)"
            - "captured s3_status == SCHEDULED (identical window under a different surveyor conflicts with nothing)"

  # ===================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_change_order_restores_contract_price
        grounds:
          - state_machines.ChangeOrder.UNDER_REVIEW_to_APPROVED
          - calculations.calc_bid_line_pricing
          - entities.RepairProject.fields.contracted_price_cents
        distinguishing_aspect: |
          Conserved quantity: money. Invariant pinned over entity fields:
          contracted_price_cents - awarded_price_cents - sum(proposed_cost_cents over
          APPROVED change orders) == 0. Approving a +200000 change order followed by
          its compensating -200000 credit change order returns
          contracted_price_cents to exactly awarded_price_cents = 49900000.
        test_recipe:
          setup:
            - "IN_DOCK project, awarded price 49900000; growth work approved (+200000), then a credit change order approved (-200000, negative unit price is permitted on change orders)"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Hull plate renewal", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 14, quantity: 99.8, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth steel work", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, schedule_delta_days: 0, quantity: 0.4, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co1: $.data.id }
            - call: "POST /v1/change-orders/${co1}/approve"
              as: CommercialApprover
              as_user_id: "comm_1"
          trigger:
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v3: $.data.version, price_mid: $.data.contracted_price_cents }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v3}", description: "Credit: scope found sound on opening", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 1, schedule_delta_days: 0, quantity: 0.4, unit_price_cents: -500000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co2: $.data.id, co2_cost: $.data.proposed_cost_cents }
            - call: "POST /v1/change-orders/${co2}/approve"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { price_end: $.data.contracted_price_cents, awarded: $.data.awarded_price_cents }
          assert:
            - "captured price_mid == 50100000 (forward action: +200000)"
            - "captured co2_cost == -200000 (compensating credit priced by the same formula)"
            - "captured price_end == 49900000 and captured awarded == 49900000 (invariant: contracted == awarded + 200000 - 200000, zero drift)"
      - name: book_then_cancel_restores_dock_availability
        grounds:
          - state_machines.DockReservation.BOOKED_to_CANCELLED
          - validations[priority=9]
          - errors[ERR_DOCK_SLOT_CONFLICT]
        distinguishing_aspect: |
          Conserved quantity: dock window capacity (a different quantity type from
          money above). Invariant: for any dock, the set of windows occupied by
          BOOKED/ACTIVE reservations is identical before a book+cancel pair and
          after it — a third-party booking over the exact cancelled window must be
          admitted, proving the cancellation fully released the capacity including
          the turnaround buffer.
        test_recipe:
          setup:
            - "Dock 1; project P1 cancels its booking of 2026-08-01T00:00Z -> 2026-08-10T00:00Z; project P2 (same dock, same vessel) then requests the identical window"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p1}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-10T00:00:00Z", expected_project_version: "${p1_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r1: $.data.id }
            - call: "POST /v1/dock-reservations/${r1}/cancel"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r1_status: $.data.status }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p2: $.data.id, p2_v: $.data.version }
          trigger:
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p2}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-10T00:00:00Z", expected_project_version: "${p2_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r2_status: $.data.status }
          assert:
            - "captured r1_status == CANCELLED"
            - "captured r2_status == BOOKED (the exact window, including its 12h buffer tail, was fully returned to the dock's available capacity)"
