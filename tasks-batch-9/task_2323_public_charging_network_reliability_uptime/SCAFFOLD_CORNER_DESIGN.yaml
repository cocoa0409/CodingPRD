              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p1_id}", fault_code: "EVSE-CRIT-01", fault_class: "CRITICAL", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o1_id: $.data.id }
            - call: "POST /outage-events/${o1_id}/classify"
              payload: { fault_class: "CRITICAL" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p2_id}", fault_code: "EVSE-CRIT-02", fault_class: "CRITICAL", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o2_id: $.data.id }
            - call: "POST /outage-events/${o2_id}/classify"
              payload: { fault_class: "CRITICAL" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o1_id}", port_id: "${p1_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_ADVANCED", window_start_at: "2026-08-01T00:30:00Z", window_end_at: "2026-08-01T06:00:00Z" }
              as: NetworkOperator
              captures: { d1_id: $.data.id }
