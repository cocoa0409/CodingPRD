  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_dispute_clientfavor_depth3
        grounds:
          - state_machines.Dispute.UNDER_ARBITRATION_to_RESOLVED
          - state_machines.Milestone.DISPUTED_to_REFUNDED
          - calculations.reputation_score
          - entities.Client.fields.wallet_balance_cents
          - entities.Freelancer.fields.dispute_loss_count
        distinguishing_aspect: |
          Depth-3 cascade originating from dispute resolve: resolve(award 0) -> Milestone REFUNDED ->
          REFUND EscrowTransaction credits Client.wallet (hop 2) -> Freelancer.dispute_loss_count++ and
          reputation_score recomputed (hop 3); each hop caused by the prior, not the original action.
        test_recipe:
          setup:
            - "ACTIVE FIXED contract; one FUNDED(20000)->SUBMITTED->DISPUTED milestone under arbitration; client wallet at 0 after funding."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Eta", email: "eta@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev7", email: "dev7@x.com", skills: ["qa"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Cascade", billing_type: "FIXED", budget_cents: 30000, required_skills: ["qa"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 20000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "cascade work" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m_id: $.data.id }
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fl_id}"
            - call: "POST /contracts/${contract_id}/milestones/${m_id}/dispute"
              payload: { raised_by: "CLIENT", reason: "fail", claimed_release_cents: 20000 }
              as: Client
              as_user_id: "${client_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disputes/${d_id}/assign-arbitration"
              payload: {}
              as: Arbitrator
          trigger:
            - call: "POST /disputes/${d_id}/resolve"
              payload: { arbitrator_award_cents: 0 }
              as: Arbitrator
            - call: "GET /clients/${client_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { wallet: $.data.wallet_balance_cents }
            - call: "GET /freelancers/${fl_id}"
              payload: {}
              as: PlatformAdmin
              captures: { losses: $.data.dispute_loss_count }
          assert:
            - "Milestone.${m_id}.status == REFUNDED and refunded_cents == 20000"
            - "Client.${client_id}.wallet_balance_cents == 20000 (escrow returned by hop-2 REFUND)"
            - "Freelancer.${fl_id}.dispute_loss_count == 1 (hop 3) and reputation_score == 0.0"

      - name: cascade_contract_terminate_depth2
        grounds:
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - state_machines.Milestone.DRAFT_to_CANCELLED
          - entities.Client.fields.wallet_balance_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (contract terminate): terminate -> each non-terminal
          Milestone CANCELLED (hop 1) -> each cancelled FUNDED milestone emits a REFUND crediting
          Client.wallet (hop 2); originates from Contract.terminate, not Dispute.resolve.
        test_recipe:
          setup:
            - "ACTIVE FIXED contract with one FUNDED(15000) milestone and one DRAFT milestone; wallet 0 after funding."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Theta", email: "theta@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
