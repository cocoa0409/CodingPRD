scenario: |
  desgin task harder than expert level.!!!! 2121. Medical/Surgical Supply Distribution
  (McKesson/Cardinal style): GPO contract tier & price activation, formulary/item master
  mapping per facility, low-unit-of-measure & par-level replenishment, recall & lot
  notification cascade, backorder substitution approval by clinician, cold-chain &
  controlled-item handling, chargeback reconciliation with manufacturer, delivery route
  into supply room

domain_name: medsurg-supply-distribution
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # 12 entities wired by junction rows (ContractLine = GpoContract x Item,
  # FormularyItem = SupplyRoom x Item) plus two self-referential edges
  # (Item.lum_parent_item_id, GpoContract.supersedes_contract_id). No strict
  # ownership tree: OrderLine reaches Item, Lot and ContractLine across
  # aggregate boundaries.

  state_machine_shape: parallel
  # ReplenishmentOrder carries two independent axes (fulfillment_status x
  # settlement_status). SubstitutionRequest and ChargebackClaim are cyclic;
  # GpoContract is cyclic (ACTIVE <-> SUSPENDED); Lot is cyclic
  # (AVAILABLE <-> EXCURSION_HOLD); FormularyItem is cyclic
  # (APPROVED <-> RESTRICTED).

  relationship_patterns:
    - one_to_many          # GpoContract -> ContractLine, ReplenishmentOrder -> OrderLine
    - many_to_many         # ContractLine and FormularyItem are junction rows
    - self_referential     # Item.lum_parent_item_id, GpoContract.supersedes_contract_id
    - cross_aggregate      # OrderLine -> Lot, OrderLine -> ContractLine, ChargebackClaim -> GpoContract

  role_model: segregation_of_duties
  # Two two-person rules keyed on X-User-ID: the ContractAdmin who submitted a
  # ChargebackClaim may not reconcile it; the DistributionOperator who flagged a
  # cold-chain excursion on a Lot may not release it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 51 endpoints / 46 error codes / 5 calculations (2 dual-variant)
  # / 10 state machines / 2 OCC rules. Deliberately above the Expert band because
  # the scenario names eight independent workflows that must interlock.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SupplyRoom
    parent: null
    common_fields: true
    description: "A stocking supply room at a member facility. Carries the facility-level GPO membership, controlled-substance licence and cold-chain attributes that govern everything delivered into it."
    fields:
      - name: facility_code
        type: string
        source: input
        description: "Member facility code the room belongs to."
      - name: room_code
        type: string
        source: input
        description: "Room identifier, globally unique across all supply rooms."
        constraints: "unique; 1-40 chars"
      - name: gpo_member_class
        type: enum
        source: input
        description: "GPO membership class used to select which GpoContract may price items for this room."
        constraints: "one of ACUTE, NON_ACUTE, SURGERY_CENTER"
      - name: room_type
        type: enum
        source: input
        description: "Physical room type."
        constraints: "one of OR_CORE, ICU, GENERAL_STORE, PHARMACY_VAULT"
      - name: refrigerated
        type: boolean
        source: input
        description: "True when the room has validated 2-8 C storage. Required for COLD_CHAIN and CONTROLLED_COLD items."
        default: false
      - name: controlled_secured
        type: boolean
        source: input
        description: "True when the room has a DEA-compliant secured cabinet. Required for CONTROLLED and CONTROLLED_COLD items."
        default: false
      - name: controlled_license_status
        type: enum
        source: input
        description: "Facility controlled-substance licence state at this room."
        default: NONE
        constraints: "one of ACTIVE, LAPSED, NONE"
      - name: window_open_min
        type: integer
        source: input
        description: "Earliest delivery minute-of-day the room accepts a route stop, inclusive."
        default: 360
        constraints: "0 <= window_open_min <= 1439"
      - name: window_close_min
        type: integer
        source: input
        description: "Latest delivery minute-of-day by which a route stop must finish, inclusive."
        default: 1080
        constraints: "window_open_min < window_close_min <= 1439"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum open commitment the room may carry across SUBMITTED/ALLOCATED/IN_TRANSIT orders."
        default: 100000000
        constraints: ">= 0"
      - name: open_commitment_cents
        type: integer
        source: computed
        description: "Sum of order_total_cents over this room's ReplenishmentOrder rows whose fulfillment_status IN {SUBMITTED, ALLOCATED, IN_TRANSIT, HELD}."
        default: 0

  - name: Item
    parent: null
    common_fields: true
    description: "Item-master record. Case-level (CS) items may be broken down into each-level (EA) items for low-unit-of-measure picking."
    fields:
      - name: sku
        type: string
        source: input
        description: "Distributor SKU, globally unique."
        constraints: "unique"
      - name: description
        type: string
        source: input
        description: "Human-readable item description."
      - name: manufacturer_code
        type: string
        source: input
        description: "Manufacturer identifier used to match GpoContract.manufacturer_code."
      - name: uom
        type: enum
        source: input
        description: "Ordering unit of measure for this item record."
        constraints: "one of EA, BX, CS"
      - name: units_per_parent
        type: integer
        source: input
        description: "Number of eaches contained in one unit of this item's uom. 1 for EA items."
        default: 1
        constraints: ">= 1"
      - name: lum_parent_item_id
        type: string
        source: input
        description: "FK -> Item.id; the case-level item this each-level item is broken down from. null for case-level items."
        default: null
      - name: handling_class
        type: enum
        source: input
        description: "Storage and security class that gates which SupplyRoom may receive the item."
        constraints: "one of AMBIENT, COLD_CHAIN, CONTROLLED, CONTROLLED_COLD"
      - name: wac_cents
        type: integer
        source: input
        description: "Wholesale acquisition cost per unit of this item's uom. Acts as the hard ceiling on any contract-derived unit price and as the chargeback baseline."
        constraints: "> 0"
      - name: is_lot_tracked
        type: boolean
        source: input
        description: "True when allocation must draw from a Lot row."
        default: true
      - name: status
        type: enum
        source: input
        description: "Item-master lifecycle."
        default: ACTIVE
        constraints: "one of ACTIVE, DISCONTINUED"

  - name: GpoContract
    parent: null
    common_fields: true
    description: "A GPO contract header carrying the tier that multiplies every one of its line prices, the member class it may price for, and its effective period."
    fields:
      - name: manufacturer_code
        type: string
        source: input
        description: "Manufacturer this contract is written against; also the chargeback counterparty."
      - name: contract_code
        type: string
        source: input
        description: "Contract identifier, globally unique."
        constraints: "unique"
      - name: tier
        type: enum
        source: input
        description: "Committed-volume tier. Selects TIER_MULT in the unit-price formula."
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: member_class_scope
        type: enum
        source: input
        description: "Only SupplyRoom rows whose gpo_member_class equals this value may be priced by this contract."
        constraints: "one of ACUTE, NON_ACUTE, SURGERY_CENTER"
      - name: committed_volume_units
        type: integer
        source: input
        description: "Volume commitment recorded on the contract header, reported only."
        default: 0
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "First instant the contract may price, inclusive."
      - name: effective_to
        type: datetime
        source: input
        description: "Last instant the contract may price, inclusive. Contract periods are CLOSED intervals on both ends."
        constraints: "effective_to > effective_from"
      - name: supersedes_contract_id
        type: string
        source: input
        description: "FK -> GpoContract.id; the ACTIVE contract this one replaces on activation. null when the contract does not supersede anything."
        default: null
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle."
        default: DRAFT
        constraints: "one of DRAFT, PENDING_ACTIVATION, ACTIVE, SUSPENDED, SUPERSEDED, EXPIRED"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into ACTIVE."
        default: null
      - name: chargeback_payable_cents
        type: integer
        source: computed
        description: "Running manufacturer ledger. Equals the sum of net_chargeback_cents over this contract's ChargebackClaim rows whose status IN {SUBMITTED, ACCEPTED, RECONCILED}."
        default: 0

  - name: ContractLine
    parent: GpoContract
    common_fields: true
    description: "Per-item contracted price under a GpoContract. Activation of the contract header cascades into every line."
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> GpoContract.id; taken from the path on creation."
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the item this line prices."
      - name: tier_price_cents
        type: integer
        source: input
        description: "Base contracted price per unit of the item's uom, before the tier multiplier and handling adders."
        constraints: "> 0"
      - name: floor_price_cents
        type: integer
        source: input
        description: "Contractual price floor. The computed unit price is raised to this value before the WAC ceiling is applied."
        constraints: "> 0; MAY exceed tier_price_cents, in which case the floor binds after the tier multiplier and the handling adders have been applied"
      - name: chargeback_eligible
        type: boolean
        source: input
        description: "True when delivered quantity on this line may be claimed back from the manufacturer."
        default: true
      - name: activation_state
        type: enum
        source: system
        description: "Line-level price activation state, driven entirely by the parent contract's transitions."
        default: PENDING
        constraints: "one of PENDING, ACTIVE, BLOCKED"

  - name: FormularyItem
    parent: SupplyRoom
    common_fields: true
    description: "Item-master mapping for one supply room: the facility's own code for the item, its formulary standing, and its par-level replenishment configuration and on-hand count."
    fields:
      - name: supply_room_id
        type: string
        source: system
        description: "FK -> SupplyRoom.id; taken from the path on creation."
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the mapped item."
      - name: facility_item_code
        type: string
        source: input
        description: "Facility-local code for the item."
      - name: formulary_status
        type: enum
        source: system
        description: "Formulary standing. Only APPROVED permits a new OrderLine."
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, RESTRICTED, DELISTED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Clinician who last recorded a formulary decision."
        default: null
      - name: par_qty
        type: integer
        source: input
        description: "Target on-hand quantity in eaches."
        constraints: "> 0"
      - name: reorder_point
        type: integer
        source: input
        description: "On-hand quantity in eaches at or below which replenishment is due."
        constraints: "0 <= reorder_point < par_qty"
      - name: on_hand_qty
        type: integer
        source: system
        description: "Current on-hand quantity in eaches. Moved by adjust-on-hand and by order delivery."
        default: 0
        constraints: ">= 0"
      - name: lum_enabled
        type: boolean
        source: input
        description: "True when the room is served in low unit of measure. Enables the LUM_SPLIT suggestion variant and the per-each LUM handling fee."
        default: false

  - name: Lot
    parent: null
    common_fields: true
    description: "A manufacturer lot held at the distribution centre. The unit of recall, expiry and cold-chain excursion control."
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the item this lot holds."
      - name: lot_code
        type: string
        source: input
        description: "Manufacturer lot code."
      - name: expiry_date
        type: datetime
        source: input
        description: "Lot expiry instant. A lot is allocatable only while expiry_date > current logical clock."
      - name: received_quantity
        type: integer
        source: input
        description: "Quantity received into the lot, in the item's uom. Immutable after creation; anchors the units-conservation invariant."
        constraints: "> 0"
      - name: quantity_on_hand
        type: integer
        source: system
        description: "Unallocated quantity remaining in the lot. Initialised to received_quantity."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lot disposition."
        default: AVAILABLE
        constraints: "one of AVAILABLE, EXCURSION_HOLD, QUARANTINED, DESTROYED"
      - name: excursion_flagged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DistributionOperator who flagged the open temperature excursion. Cleared on release."
        default: null

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    description: "A replenishment order for one supply room. Carries two independent state axes: fulfillment_status (picking and delivery) and settlement_status (manufacturer chargeback)."
    fields:
      - name: supply_room_id
        type: string
        source: input
        description: "FK -> SupplyRoom.id; the destination room."
      - name: route_id
        type: string
        source: system
        description: "FK -> DeliveryRoute.id; the route carrying this order, null while unassigned."
        default: null
      - name: stop_arrival_min
        type: integer
        source: system
        description: "Minute-of-day the route stop begins at the supply room. Set when the order is added to a route."
        default: null
      - name: stop_service_minutes
        type: integer
        source: system
        description: "Duration in minutes of the route stop at the supply room."
        default: null
      - name: service_date
        type: string
        source: system
        description: "YYYY-MM-DD copied from the DeliveryRoute when the order is added to a route."
        default: null
      - name: fulfillment_status
        type: enum
        source: system
        description: "Picking and delivery axis."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, ALLOCATED, IN_TRANSIT, DELIVERED, HELD, CANCELLED"
      - name: settlement_status
        type: enum
        source: system
        description: "Manufacturer chargeback axis. Evolves independently of fulfillment_status."
        default: UNBILLED
        constraints: "one of UNBILLED, CLAIMED, REBILL_REQUIRED, RECONCILED"
      - name: order_total_cents
        type: integer
        source: computed
        description: "Per-line-rounded distributor total. Recomputed on every line mutation."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT to SUBMITTED transition."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the IN_TRANSIT to DELIVERED transition."
        default: null

  - name: OrderLine
    parent: ReplenishmentOrder
    common_fields: true
    description: "One item line on a replenishment order. Holds both pricing variants: the price pinned when the line was written and the price settled at delivery."
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> ReplenishmentOrder.id; taken from the path on creation."
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the ordered item. Rewritten in place when a substitution is approved."
      - name: lot_id
        type: string
        source: system
        description: "FK -> Lot.id; the lot the line was allocated from, null while unallocated."
        default: null
      - name: pinned_contract_line_id
        type: string
        source: computed
        description: "FK -> ContractLine.id; the contract line selected when the price was pinned."
        default: null
      - name: requested_qty
        type: integer
        source: input
        description: "Quantity requested in the item's uom."
        constraints: "> 0"
      - name: allocated_qty
        type: integer
        source: system
        description: "Quantity actually allocated from a lot. Allocation is all-or-nothing per line."
        default: 0
      - name: pinned_unit_price_cents
        type: integer
        source: computed
        description: "Unit price pinned at line creation (or re-pinned on substitution approval) from the contract ACTIVE at that instant."
        default: 0
      - name: settled_unit_price_cents
        type: integer
        source: computed
        description: "Unit price recomputed at delivery from the contract ACTIVE at the delivery instant. Diverges from pinned_unit_price_cents when the contract was superseded in between."
        default: null
      - name: extended_price_cents
        type: integer
        source: computed
        description: "pinned_unit_price_cents multiplied by the line's quantity basis."
        default: 0
      - name: line_fee_cents
        type: integer
        source: computed
        description: "Distribution fee for this line, rounded at line level before any summation."
        default: 0
      - name: chargeback_eligible
        type: boolean
        source: computed
        description: "Copied from the pinned ContractLine.chargeback_eligible at pin time."
        default: false
      - name: line_status
        type: enum
        source: system
        description: "Line fulfillment state."
        default: OPEN
        constraints: "one of OPEN, ALLOCATED, BACKORDERED, SUBSTITUTED, SHORTED, DELIVERED, CANCELLED"

  - name: SubstitutionRequest
    parent: OrderLine
    common_fields: true
    description: "A request to swap a backordered line to a different item, decided by a clinician. Supports a bounded information-request loop."
    fields:
      - name: order_line_id
        type: string
        source: system
        description: "FK -> OrderLine.id; taken from the path on creation."
      - name: proposed_item_id
        type: string
        source: input
        description: "FK -> Item.id; the substitute item proposed to the clinician."
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MaterialsManager who raised the request."
      - name: clinician_user_id
        type: string
        source: system
        description: "X-User-ID of the Clinician who last acted on the request."
        default: null
      - name: justification
        type: string
        source: input
        description: "Free-text clinical justification supplied by the requester."
      - name: info_request_note
        type: string
        source: system
        description: "Most recent clinician information request."
        default: null
      - name: response_note
        type: string
        source: system
        description: "Most recent requester response to an information request."
        default: null
      - name: rounds_used
        type: integer
        source: system
        description: "Number of completed information-request rounds. Capped at SUBSTITUTION_MAX_ROUNDS."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Request lifecycle."
        default: PENDING
        constraints: "one of PENDING, INFO_REQUESTED, APPROVED, REJECTED, WITHDRAWN"
      - name: price_delta_cents
        type: integer
        source: computed
        description: "Per-unit price difference the substitution introduces: new pinned unit price minus the previously pinned unit price. Written on approval."
        default: null

  - name: RecallNotice
    parent: null
    common_fields: true
    description: "A manufacturer recall on an item, optionally narrowed to a single lot. Cascading it quarantines lots and unwinds every downstream allocation."
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the recalled item."
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the single recalled lot. null means every lot of the item is in scope."
        default: null
      - name: recall_class
        type: enum
        source: input
        description: "FDA recall class."
        constraints: "one of CLASS_I, CLASS_II, CLASS_III"
      - name: reason
        type: string
        source: input
        description: "Recall reason text."
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle."
        default: ISSUED
        constraints: "one of ISSUED, CASCADED, CLOSED"
      - name: quarantined_lot_count
        type: integer
        source: computed
        description: "Number of lots moved to QUARANTINED by this notice's cascade."
        default: 0
      - name: backordered_line_count
        type: integer
        source: computed
        description: "Number of order lines moved to BACKORDERED by this notice's cascade."
        default: 0
      - name: cascaded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ISSUED to CASCADED transition."
        default: null

  - name: DeliveryRoute
    parent: null
    common_fields: true
    description: "A dated delivery route into supply rooms. Enforces stop-window geometry per room and an aggregate cold-chain payload ceiling."
    fields:
      - name: route_code
        type: string
        source: input
        description: "Route identifier, globally unique."
        constraints: "unique"
      - name: service_date
        type: string
        source: input
        description: "Service date in YYYY-MM-DD form."
      - name: vehicle_class
        type: enum
        source: input
        description: "Vehicle type. Only REEFER_VAN may carry COLD_CHAIN or CONTROLLED_COLD lines."
        constraints: "one of AMBIENT_VAN, REEFER_VAN"
      - name: planned_order_count
        type: integer
        source: computed
        description: "Number of ReplenishmentOrder rows currently assigned to this route."
        default: 0
      - name: cold_units_loaded
        type: integer
        source: computed
        description: "Aggregate allocated quantity of COLD_CHAIN and CONTROLLED_COLD lines across the route's assigned orders."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Route lifecycle."
        default: PLANNED
        constraints: "one of PLANNED, DISPATCHED, COMPLETED, CANCELLED"
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PLANNED to DISPATCHED transition."
        default: null

  - name: ChargebackClaim
    parent: null
    common_fields: true
    description: "A chargeback claim raised against a manufacturer contract for the delivered, chargeback-eligible quantity on one order."
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> ReplenishmentOrder.id; the delivered order being claimed."
      - name: contract_id
        type: string
        source: input
        description: "FK -> GpoContract.id; the contract the claim settles against."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ContractAdmin who created the claim. May not equal reconciled_by_user_id."
      - name: reconciled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ContractAdmin who reconciled the claim."
        default: null
      - name: gross_chargeback_cents
        type: integer
        source: computed
        description: "Sum over eligible delivered lines of (Item.wac_cents minus settled_unit_price_cents) multiplied by allocated_qty, floored at zero per line."
        default: 0
      - name: admin_fee_pct
        type: number
        source: computed
        description: "Administrative fee rate selected from the gross-chargeback bracket."
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Administrative fee in cents, rounded once from gross_chargeback_cents."
        default: 0
      - name: net_chargeback_cents
        type: integer
        source: computed
        description: "gross_chargeback_cents minus admin_fee_cents. This is the amount posted to GpoContract.chargeback_payable_cents."
        default: 0
      - name: eligible_line_count
        type: integer
        source: computed
        description: "Number of order lines that entered the gross computation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle."
        default: SUBMITTED
        constraints: "one of SUBMITTED, ACCEPTED, DISPUTED, REBILL_REQUIRED, RECONCILED"
      - name: dispute_reason
        type: string
        source: system
        description: "Reason supplied by the manufacturer when the claim was disputed."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- GpoContract: cyclic (ACTIVE <-> SUSPENDED) with two terminal exits ----
  - entity: GpoContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_ACTIVATION
        trigger: "POST /contracts/{contract_id}/transition with to_status=PENDING_ACTIVATION"
        actor: ContractAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "at least one ContractLine exists with contract_id == contract.id"
        side_effects:
          - "no price becomes usable yet; every ContractLine.activation_state stays PENDING"
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/transition with to_status=ACTIVE"
        actor: ContractAdmin
        preconditions:
          - "contract.status == PENDING_ACTIVATION"
          - "contract.effective_from <= clock_now <= contract.effective_to"
          - "validation priority 17 passes: no other GpoContract with status == ACTIVE, the same member_class_scope, and a ContractLine for an overlapping item has a CLOSED effective interval intersecting this contract's CLOSED effective interval, unless that contract is exactly contract.supersedes_contract_id"
        side_effects:
          - "contract.activated_at := clock_now"
          - "every ContractLine of this contract moves activation_state PENDING -> ACTIVE"
          - "if contract.supersedes_contract_id is not null: that contract moves status ACTIVE -> SUPERSEDED, and because it left ACTIVE every one of ITS ContractLine rows moves activation_state ACTIVE -> BLOCKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/transition with to_status=ACTIVE"
        actor: ContractAdmin
        preconditions:
          - "contract.status == SUSPENDED"
          - "contract.effective_from <= clock_now <= contract.effective_to"
          - "validation priority 17 passes"
        side_effects:
          - "contract.activated_at := clock_now"
          - "every ContractLine of this contract moves activation_state BLOCKED -> ACTIVE"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{contract_id}/transition with to_status=SUSPENDED"
        actor: ContractAdmin
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "every ContractLine of this contract moves activation_state ACTIVE -> BLOCKED"
          - "already-pinned OrderLine prices are NOT rewritten"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, during another contract's PENDING_ACTIVATION -> ACTIVE transition when that contract's supersedes_contract_id equals this contract's id"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "every ContractLine of this contract moves activation_state ACTIVE -> BLOCKED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /contracts/{contract_id}/transition with to_status=EXPIRED"
        actor: ContractAdmin
        preconditions:
          - "contract.status == ACTIVE"
          - "clock_now > contract.effective_to"
        side_effects:
          - "every ContractLine of this contract moves activation_state ACTIVE -> BLOCKED"

  # --- ContractLine: driven entirely by the parent contract -----------------
  - entity: ContractLine
    state_field: activation_state
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system, cascaded from GpoContract PENDING_ACTIVATION -> ACTIVE"
        actor: system
        preconditions:
          - "parent contract.status becomes ACTIVE in the same request"
        side_effects:
          - "the line becomes selectable by the unit-price selector"
      - from: ACTIVE
        to: BLOCKED
        trigger: "system, cascaded from GpoContract ACTIVE -> SUSPENDED, ACTIVE -> SUPERSEDED or ACTIVE -> EXPIRED"
        actor: system
        preconditions:
          - "parent contract leaves ACTIVE in the same request"
        side_effects:
          - "the line stops being selectable by the unit-price selector"
      - from: BLOCKED
        to: ACTIVE
        trigger: "system, cascaded from GpoContract SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "parent contract.status becomes ACTIVE in the same request"
        side_effects:
          - "the line becomes selectable again"

  # --- FormularyItem: cyclic (APPROVED <-> RESTRICTED) ----------------------
  - entity: FormularyItem
    state_field: formulary_status
    initial_state: REQUESTED
    terminal_states: [DELISTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /formulary-items/{formulary_item_id}/decision with decision=APPROVED"
        actor: Clinician
        preconditions:
          - "formulary_item.formulary_status == REQUESTED"
        side_effects:
          - "formulary_item.decided_by_user_id := X-User-ID"
          - "the item becomes orderable into this supply room"
      - from: REQUESTED
        to: RESTRICTED
        trigger: "POST /formulary-items/{formulary_item_id}/decision with decision=RESTRICTED"
        actor: Clinician
        preconditions:
          - "formulary_item.formulary_status == REQUESTED"
        side_effects:
          - "formulary_item.decided_by_user_id := X-User-ID"
      - from: APPROVED
        to: RESTRICTED
        trigger: "POST /formulary-items/{formulary_item_id}/decision with decision=RESTRICTED"
        actor: Clinician
        preconditions:
          - "formulary_item.formulary_status == APPROVED"
        side_effects:
          - "formulary_item.decided_by_user_id := X-User-ID"
          - "new OrderLine creation for this item into this room is refused from now on; existing lines are untouched"
      - from: RESTRICTED
        to: APPROVED
        trigger: "POST /formulary-items/{formulary_item_id}/decision with decision=APPROVED"
        actor: Clinician
        preconditions:
          - "formulary_item.formulary_status == RESTRICTED"
        side_effects:
          - "formulary_item.decided_by_user_id := X-User-ID"
        note: "Closes the APPROVED <-> RESTRICTED cycle."
      - from: APPROVED
        to: DELISTED
        trigger: "POST /formulary-items/{formulary_item_id}/decision with decision=DELISTED"
        actor: Clinician
        preconditions:
          - "formulary_item.formulary_status == APPROVED"
        side_effects:
          - "formulary_item.decided_by_user_id := X-User-ID"
      - from: RESTRICTED
        to: DELISTED
        trigger: "POST /formulary-items/{formulary_item_id}/decision with decision=DELISTED"
        actor: Clinician
        preconditions:
          - "formulary_item.formulary_status == RESTRICTED"
        side_effects:
          - "formulary_item.decided_by_user_id := X-User-ID"

  # --- Lot: cyclic (AVAILABLE <-> EXCURSION_HOLD) --------------------------
  - entity: Lot
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [DESTROYED]
    transitions:
      - from: AVAILABLE
        to: EXCURSION_HOLD
        trigger: "POST /lots/{lot_id}/excursion with action=FLAG"
        actor: DistributionOperator
        preconditions:
          - "lot.status == AVAILABLE"
        side_effects:
          - "lot.excursion_flagged_by_user_id := X-User-ID"
          - "the lot stops being a candidate for allocation"
      - from: EXCURSION_HOLD
        to: AVAILABLE
        trigger: "POST /lots/{lot_id}/excursion with action=RELEASE"
        actor: DistributionOperator
        preconditions:
          - "lot.status == EXCURSION_HOLD"
          - "validation priority 14 passes: X-User-ID != lot.excursion_flagged_by_user_id"
        side_effects:
          - "lot.excursion_flagged_by_user_id := null"
        note: "Closes the AVAILABLE <-> EXCURSION_HOLD cycle under a two-person rule."
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system, cascaded from RecallNotice ISSUED -> CASCADED"
        actor: system
        preconditions:
          - "lot.status == AVAILABLE"
          - "lot matches the notice scope"
        side_effects:
          - "every OrderLine allocated from this lot is unwound (see RecallNotice cascade)"
      - from: EXCURSION_HOLD
        to: QUARANTINED
        trigger: "system, cascaded from RecallNotice ISSUED -> CASCADED"
        actor: system
        preconditions:
          - "lot.status == EXCURSION_HOLD"
          - "lot matches the notice scope"
        side_effects:
          - "lot.excursion_flagged_by_user_id := null"
      - from: QUARANTINED
        to: DESTROYED
        trigger: "POST /lots/{lot_id}/excursion with action=DESTROY"
        actor: DistributionOperator
        preconditions:
          - "lot.status == QUARANTINED"
        side_effects:
          - "lot.quantity_on_hand := 0"
      - from: EXCURSION_HOLD
        to: DESTROYED
        trigger: "POST /lots/{lot_id}/excursion with action=DESTROY"
        actor: DistributionOperator
        preconditions:
          - "lot.status == EXCURSION_HOLD"
        side_effects:
          - "lot.quantity_on_hand := 0"
          - "lot.excursion_flagged_by_user_id := null"

  # --- ReplenishmentOrder, axis 1 of 2: fulfillment_status -----------------
  - entity: ReplenishmentOrder
    state_field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    note: "Axis 1 of a parallel state machine. Evolves independently of settlement_status; neither axis constrains the other's transition set."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{order_id}/submit"
        actor: MaterialsManager
        preconditions:
          - "order.fulfillment_status == DRAFT"
          - "at least one OrderLine exists with order_id == order.id and line_status == OPEN"
          - "validations priority 10, 11, 15, 21 and 24 pass for every OPEN line, evaluated in that ascending order"
        side_effects:
          - "order.submitted_at := clock_now"
          - "supply_room.open_commitment_cents += order.order_total_cents"
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /orders/{order_id}/allocate"
        actor: DistributionOperator
        preconditions:
          - "order.fulfillment_status == SUBMITTED"
          - "at least one OPEN line finds an allocatable lot under the FEFO selector"
        side_effects:
          - "each OPEN or SUBSTITUTED line that finds a lot moves OPEN|SUBSTITUTED -> ALLOCATED, sets lot_id and allocated_qty, and decrements Lot.quantity_on_hand by allocated_qty"
          - "each OPEN or SUBSTITUTED line that finds no lot moves to BACKORDERED"
          - "order.order_total_cents is recomputed"
      - from: SUBMITTED
        to: HELD
        trigger: "POST /orders/{order_id}/allocate"
        actor: DistributionOperator
        preconditions:
          - "order.fulfillment_status == SUBMITTED"
          - "no OPEN line finds an allocatable lot under the FEFO selector"
        side_effects:
          - "every OPEN line moves to BACKORDERED"
          - "order.order_total_cents is recomputed to 0 because BACKORDERED lines are excluded from the total"
      - from: ALLOCATED
        to: HELD
        trigger: "system, cascaded from RecallNotice ISSUED -> CASCADED"
        actor: system
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
          - "after the cascade every OrderLine of the order has line_status IN {BACKORDERED, SHORTED, CANCELLED}"
        side_effects:
          - "supply_room.open_commitment_cents is adjusted by the change in order.order_total_cents"
          - "if order.route_id is not null the order is detached from its route (see DeliveryRoute cascade)"
      - from: HELD
        to: ALLOCATED
        trigger: "POST /orders/{order_id}/allocate"
        actor: DistributionOperator
        preconditions:
          - "order.fulfillment_status == HELD"
          - "at least one BACKORDERED or SUBSTITUTED line finds an allocatable lot under the FEFO selector"
        side_effects:
          - "matching lines move BACKORDERED|SUBSTITUTED -> ALLOCATED"
          - "order.order_total_cents is recomputed"
          - "supply_room.open_commitment_cents is adjusted by the change in order.order_total_cents"
      - from: ALLOCATED
        to: IN_TRANSIT
        trigger: "system, cascaded from DeliveryRoute PLANNED -> DISPATCHED"
        actor: system
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
          - "order.route_id == the dispatched route's id"
        side_effects:
          - "no price is recomputed at dispatch"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /orders/{order_id}/deliver"
        actor: DistributionOperator
        preconditions:
          - "order.fulfillment_status == IN_TRANSIT"
        side_effects:
          - "every ALLOCATED line moves to DELIVERED and receives settled_unit_price_cents from the settlement_reprice variant"
          - "for every DELIVERED line the destination FormularyItem.on_hand_qty += allocated_qty * (item.uom == CS ? item.units_per_parent : 1)"
          - "order.delivered_at := clock_now"
          - "supply_room.open_commitment_cents -= order.order_total_cents"
          - "if every ReplenishmentOrder on the route now has fulfillment_status == DELIVERED the route moves DISPATCHED -> COMPLETED"
      - from: DRAFT
        to: CANCELLED
        trigger: "system, cascaded from SubstitutionRequest PENDING|INFO_REQUESTED -> WITHDRAWN when that withdrawal cancels the last remaining OrderLine of a DRAFT order"
        actor: system
        preconditions:
          - "order.fulfillment_status == DRAFT"
          - "every OrderLine of the order has line_status == CANCELLED"
        side_effects:
          - "order.order_total_cents := 0"
        note: "Reached only when every line of a DRAFT order has been cancelled by the substitution-withdrawal cascade; no direct endpoint targets this transition."

  # --- ReplenishmentOrder, axis 2 of 2: settlement_status ------------------
  - entity: ReplenishmentOrder
    state_field: settlement_status
    initial_state: UNBILLED
    terminal_states: [RECONCILED]
    note: "Axis 2 of the parallel state machine. A DELIVERED order can sit at UNBILLED forever, and a CLAIMED order can still move on the fulfillment axis."
    transitions:
      - from: UNBILLED
        to: CLAIMED
        trigger: "POST /chargeback-claims"
        actor: ContractAdmin
        preconditions:
          - "order.settlement_status == UNBILLED"
          - "order.fulfillment_status == DELIVERED"
        side_effects:
          - "a ChargebackClaim is created in SUBMITTED"
          - "contract.chargeback_payable_cents += claim.net_chargeback_cents"
      - from: CLAIMED
        to: REBILL_REQUIRED
        trigger: "system, cascaded when order.order_total_cents changes while settlement_status == CLAIMED"
        actor: system
        preconditions:
          - "order.settlement_status == CLAIMED"
          - "order.order_total_cents changed in this request"
        side_effects:
          - "the order's open ChargebackClaim moves SUBMITTED -> REBILL_REQUIRED"
          - "contract.chargeback_payable_cents -= claim.net_chargeback_cents"
      - from: REBILL_REQUIRED
        to: CLAIMED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/settle with action=RESUBMIT"
        actor: ContractAdmin
        preconditions:
          - "order.settlement_status == REBILL_REQUIRED"
        side_effects:
          - "the claim is recomputed and moves REBILL_REQUIRED -> SUBMITTED"
          - "contract.chargeback_payable_cents += the recomputed claim.net_chargeback_cents"
      - from: CLAIMED
        to: RECONCILED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/settle with action=RECONCILE"
        actor: ContractAdmin
        preconditions:
          - "order.settlement_status == CLAIMED"
          - "the order's claim has status == ACCEPTED"
          - "validation priority 14 passes: X-User-ID != claim.submitted_by_user_id"
        side_effects:
          - "the claim moves ACCEPTED -> RECONCILED"
          - "claim.reconciled_by_user_id := X-User-ID"
      - from: CLAIMED
        to: UNBILLED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/response with outcome=DISPUTE"
        actor: ManufacturerRep
        preconditions:
          - "order.settlement_status == CLAIMED"
          - "the order's claim has status == SUBMITTED"
        side_effects:
          - "the claim moves SUBMITTED -> DISPUTED"
          - "contract.chargeback_payable_cents -= claim.net_chargeback_cents"

  # --- OrderLine -----------------------------------------------------------
  - entity: OrderLine
    state_field: line_status
    initial_state: OPEN
    terminal_states: [DELIVERED, SHORTED, CANCELLED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /orders/{order_id}/allocate"
        actor: DistributionOperator
        preconditions:
          - "line.line_status == OPEN"
          - "the FEFO selector returns a lot"
        side_effects:
          - "line.lot_id and line.allocated_qty are set; Lot.quantity_on_hand -= line.allocated_qty"
          - "line.extended_price_cents and line.line_fee_cents are recomputed"
      - from: OPEN
        to: BACKORDERED
        trigger: "POST /orders/{order_id}/allocate"
        actor: DistributionOperator
        preconditions:
          - "line.line_status == OPEN"
          - "the FEFO selector returns no lot"
        side_effects:
          - "line.extended_price_cents := 0 and line.line_fee_cents := 0 because BACKORDERED lines leave the order total"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system, cascaded from Lot AVAILABLE|EXCURSION_HOLD -> QUARANTINED during a recall cascade"
        actor: system
        preconditions:
          - "line.line_status == ALLOCATED"
          - "line.lot_id == the quarantined lot's id"
        side_effects:
          - "Lot.quantity_on_hand += line.allocated_qty; line.allocated_qty := 0; line.lot_id := null"
          - "line.extended_price_cents := 0 and line.line_fee_cents := 0"
      - from: BACKORDERED
        to: SUBSTITUTED
        trigger: "POST /substitution-requests/{substitution_request_id}/clinician-action with action=APPROVE"
        actor: Clinician
        preconditions:
          - "line.line_status == BACKORDERED"
          - "the request targets this line and has status == PENDING"
        side_effects:
          - "line.item_id := request.proposed_item_id"
          - "line.pinned_contract_line_id, line.pinned_unit_price_cents and line.chargeback_eligible are re-pinned by the pin_at_line_write variant at clock_now"
          - "line.extended_price_cents and line.line_fee_cents are recomputed on requested_qty"
      - from: SUBSTITUTED
        to: ALLOCATED
        trigger: "POST /orders/{order_id}/allocate"
        actor: DistributionOperator
        preconditions:
          - "line.line_status == SUBSTITUTED"
          - "the FEFO selector returns a lot for the substituted item"
        side_effects:
          - "line.lot_id and line.allocated_qty are set; Lot.quantity_on_hand -= line.allocated_qty"
      - from: BACKORDERED
        to: SHORTED
        trigger: "system, cascaded from SubstitutionRequest PENDING|INFO_REQUESTED -> REJECTED"
        actor: system
        preconditions:
          - "line.line_status == BACKORDERED"
          - "the rejected request targets this line"
        side_effects:
          - "the line leaves the order permanently and never re-enters order_total_cents"
      - from: ALLOCATED
        to: DELIVERED
        trigger: "POST /orders/{order_id}/deliver"
        actor: DistributionOperator
        preconditions:
          - "line.line_status == ALLOCATED"
          - "parent order moves IN_TRANSIT -> DELIVERED in the same request"
        side_effects:
          - "line.settled_unit_price_cents is written by the settlement_reprice variant"
          - "the destination FormularyItem.on_hand_qty is incremented"
      - from: OPEN
        to: CANCELLED
        trigger: "system, cascaded from SubstitutionRequest PENDING|INFO_REQUESTED -> WITHDRAWN when the withdrawal leaves the line unfulfillable"
        actor: system
        preconditions:
          - "line.line_status == OPEN"
          - "a SubstitutionRequest targeting this line moves to WITHDRAWN"
        side_effects:
          - "line.extended_price_cents := 0 and line.line_fee_cents := 0"
        note: "Only reachable for a line still OPEN when its request is withdrawn."

  # --- SubstitutionRequest: cyclic PENDING <-> INFO_REQUESTED --------------
  - entity: SubstitutionRequest
    state_field: status
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: INFO_REQUESTED
        trigger: "POST /substitution-requests/{substitution_request_id}/clinician-action with action=REQUEST_INFO"
        actor: Clinician
        preconditions:
          - "request.status == PENDING"
          - "request.rounds_used < SUBSTITUTION_MAX_ROUNDS"
        side_effects:
          - "request.info_request_note := note"
          - "request.clinician_user_id := X-User-ID"
      - from: INFO_REQUESTED
        to: PENDING
        trigger: "POST /substitution-requests/{substitution_request_id}/respond with action=RESPOND"
        actor: MaterialsManager
        preconditions:
          - "request.status == INFO_REQUESTED"
        side_effects:
          - "request.response_note := response_note"
          - "request.rounds_used += 1"
        note: "Closes the PENDING <-> INFO_REQUESTED cycle; the round counter bounds the loop."
      - from: PENDING
        to: APPROVED
        trigger: "POST /substitution-requests/{substitution_request_id}/clinician-action with action=APPROVE"
        actor: Clinician
        preconditions:
          - "request.status == PENDING"
          - "the target OrderLine.line_status == BACKORDERED"
          - "a FormularyItem for (order.supply_room_id, request.proposed_item_id) exists with formulary_status == APPROVED"
          - "an ACTIVE ContractLine resolves for the proposed item at clock_now"
        side_effects:
          - "request.clinician_user_id := X-User-ID"
          - "request.price_delta_cents := new pinned unit price - previous pinned unit price"
          - "the target OrderLine moves BACKORDERED -> SUBSTITUTED (see OrderLine machine); because that line re-priced, order.order_total_cents is recomputed; because order_total_cents changed while order.settlement_status == CLAIMED, the order moves CLAIMED -> REBILL_REQUIRED and its claim moves SUBMITTED -> REBILL_REQUIRED and contract.chargeback_payable_cents is decremented"
      - from: PENDING
        to: REJECTED
        trigger: "POST /substitution-requests/{substitution_request_id}/clinician-action with action=REJECT"
        actor: Clinician
        preconditions:
          - "request.status == PENDING"
        side_effects:
          - "request.clinician_user_id := X-User-ID"
          - "the target OrderLine moves BACKORDERED -> SHORTED"
      - from: INFO_REQUESTED
        to: REJECTED
        trigger: "POST /substitution-requests/{substitution_request_id}/clinician-action with action=REJECT"
        actor: Clinician
        preconditions:
          - "request.status == INFO_REQUESTED"
        side_effects:
          - "request.clinician_user_id := X-User-ID"
          - "the target OrderLine moves BACKORDERED -> SHORTED"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /substitution-requests/{substitution_request_id}/respond with action=WITHDRAW"
        actor: MaterialsManager
        preconditions:
          - "request.status == PENDING"
        side_effects:
          - "if the target OrderLine.line_status == OPEN it moves OPEN -> CANCELLED"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /substitution-requests/{substitution_request_id}/respond with action=WITHDRAW"
        actor: MaterialsManager
        preconditions:
          - "request.status == INFO_REQUESTED"
        side_effects:
          - "if the target OrderLine.line_status == OPEN it moves OPEN -> CANCELLED"

  # --- RecallNotice --------------------------------------------------------
  - entity: RecallNotice
    state_field: status
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: CASCADED
        trigger: "POST /recall-notices/{recall_notice_id}/cascade with action=CASCADE"
        actor: DistributionOperator
        preconditions:
          - "notice.status == ISSUED"
        side_effects:
          - "HOP 1: every Lot with item_id == notice.item_id, matching notice.lot_id when it is not null, and status IN {AVAILABLE, EXCURSION_HOLD}, processed in Lot.created_at ASC order, moves to QUARANTINED; notice.quarantined_lot_count := that count"
          - "HOP 2: because a Lot became QUARANTINED, every OrderLine with lot_id == that lot and line_status == ALLOCATED, processed in OrderLine.created_at ASC order, moves ALLOCATED -> BACKORDERED, returns allocated_qty to Lot.quantity_on_hand, clears lot_id and allocated_qty; notice.backordered_line_count := that count"
          - "HOP 3: because an OrderLine became BACKORDERED, its parent ReplenishmentOrder recomputes order_total_cents and supply_room.open_commitment_cents is adjusted by the delta; if every line of that order is now IN {BACKORDERED, SHORTED, CANCELLED} and the order is ALLOCATED it moves ALLOCATED -> HELD"
          - "HOP 4: because the order moved to HELD, if it carried a route_id the order is detached (route_id, stop_arrival_min, stop_service_minutes and service_date cleared), the route recomputes planned_order_count and cold_units_loaded, and if planned_order_count reaches 0 while route.status == PLANNED the route moves PLANNED -> CANCELLED"
          - "notice.cascaded_at := clock_now"
      - from: CASCADED
        to: CLOSED
        trigger: "POST /recall-notices/{recall_notice_id}/cascade with action=CLOSE"
        actor: DistributionOperator
        preconditions:
          - "notice.status == CASCADED"
        side_effects:
          - "no further lots or lines are touched"

  # --- DeliveryRoute -------------------------------------------------------
  - entity: DeliveryRoute
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /delivery-routes/{route_id}/dispatch"
        actor: DistributionOperator
        preconditions:
          - "route.status == PLANNED"
          - "route.planned_order_count >= 1"
          - "every assigned ReplenishmentOrder has fulfillment_status == ALLOCATED"
        side_effects:
          - "route.dispatched_at := clock_now"
          - "every assigned order moves ALLOCATED -> IN_TRANSIT"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system, cascaded from the last assigned ReplenishmentOrder moving IN_TRANSIT -> DELIVERED"
        actor: system
        preconditions:
          - "route.status == DISPATCHED"
          - "every assigned order has fulfillment_status == DELIVERED"
        side_effects:
          - "route.planned_order_count is left at its final value"
      - from: PLANNED
        to: CANCELLED
        trigger: "system, cascaded from a recall cascade that detaches the route's last assigned order"
        actor: system
        preconditions:
          - "route.status == PLANNED"
          - "route.planned_order_count reaches 0 in this request"
        side_effects:
          - "route.cold_units_loaded := 0"

  # --- ChargebackClaim: branching plus a resubmit cycle --------------------
  - entity: ChargebackClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [RECONCILED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/response with outcome=ACCEPT"
        actor: ManufacturerRep
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "contract.chargeback_payable_cents is unchanged, because ACCEPTED remains inside the payable set"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/response with outcome=DISPUTE"
        actor: ManufacturerRep
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "claim.dispute_reason := dispute_reason"
          - "contract.chargeback_payable_cents -= claim.net_chargeback_cents"
          - "the order moves settlement_status CLAIMED -> UNBILLED"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/settle with action=RESUBMIT"
        actor: ContractAdmin
        preconditions:
          - "claim.status == DISPUTED"
        side_effects:
          - "gross_chargeback_cents, admin_fee_pct, admin_fee_cents and net_chargeback_cents are recomputed at clock_now"
          - "contract.chargeback_payable_cents += the recomputed claim.net_chargeback_cents"
          - "the order moves settlement_status UNBILLED -> CLAIMED"
        note: "Closes the SUBMITTED -> DISPUTED -> SUBMITTED cycle."
      - from: SUBMITTED
        to: REBILL_REQUIRED
        trigger: "system, cascaded when the claimed order's order_total_cents changes"
        actor: system
        preconditions:
          - "claim.status == SUBMITTED"
          - "the claimed order's order_total_cents changed in this request"
        side_effects:
          - "contract.chargeback_payable_cents -= claim.net_chargeback_cents"
      - from: REBILL_REQUIRED
        to: SUBMITTED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/settle with action=RESUBMIT"
        actor: ContractAdmin
        preconditions:
          - "claim.status == REBILL_REQUIRED"
        side_effects:
          - "gross_chargeback_cents, admin_fee_pct, admin_fee_cents and net_chargeback_cents are recomputed at clock_now"
          - "contract.chargeback_payable_cents += the recomputed claim.net_chargeback_cents"
          - "the order moves settlement_status REBILL_REQUIRED -> CLAIMED"
      - from: ACCEPTED
        to: RECONCILED
        trigger: "POST /chargeback-claims/{chargeback_claim_id}/settle with action=RECONCILE"
        actor: ContractAdmin
        preconditions:
          - "claim.status == ACCEPTED"
          - "validation priority 14 passes: X-User-ID != claim.submitted_by_user_id"
        side_effects:
          - "claim.reconciled_by_user_id := X-User-ID"
          - "contract.chargeback_payable_cents is unchanged, because RECONCILED remains inside the payable set"
          - "the order moves settlement_status CLAIMED -> RECONCILED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-line-write-stale-order
    parent_entity: ReplenishmentOrder
    write_endpoint: "POST /orders/{order_id}/lines"
    occ_field: "expected_order_version"
    description: |
      Writing an OrderLine against a ReplenishmentOrder whose version has advanced
      since the client last read it is rejected. A second line write is a legitimate
      operation in its own right - a DRAFT order accepts any number of lines - so the
      stale-version check is the only thing that tells a client its view of
      order_total_cents and of the already-written lines is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: par-adjust-stale-formulary-item
    parent_entity: FormularyItem
    write_endpoint: "POST /formulary-items/{formulary_item_id}/adjust-on-hand"
    occ_field: "expected_formulary_item_version"
    description: |
      Posting an on-hand delta against a FormularyItem whose version has advanced
      since the client last read it is rejected. Deltas are relative, so a second
      adjustment on identical state would legitimately succeed; the stale-version
      check is what stops a cycle-count client from posting a delta derived from an
      on_hand_qty that a delivery receipt has already moved.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: contract_unit_price
    trigger: "Runs on POST /orders/{order_id}/lines (writes OrderLine.pinned_unit_price_cents, pinned_contract_line_id, chargeback_eligible), on POST /substitution-requests/{substitution_request_id}/clinician-action with action=APPROVE (re-writes the same three fields for the swapped item), and on POST /orders/{order_id}/deliver (writes OrderLine.settled_unit_price_cents)."
    algorithm: tiered_pricing
    input_set: |
      Candidate ContractLine set for an (item_id, supply_room, evaluation instant T):
        ContractLine.item_id == line.item_id
        AND ContractLine.activation_state == ACTIVE
        AND parent GpoContract.status == ACTIVE
        AND parent GpoContract.member_class_scope == supply_room.gpo_member_class
        AND parent GpoContract.effective_from <= T <= parent GpoContract.effective_to   (CLOSED interval)
      Two contracts from DIFFERENT manufacturer_code values may both be ACTIVE and
      cover the same item at the same instant (validation priority 17 only forbids
      same-manufacturer overlap), so the candidate set can genuinely hold more than one row.
      Ranking (selector determinism):
        1. ContractLine.tier_price_cents ASC
        2. tie-break: parent GpoContract.effective_from DESC
        3. tie-break: ContractLine.created_at ASC
      Empty candidate set -> ERR_NO_ACTIVE_CONTRACT_PRICE (422). Never falls back to id.
    formula: |
      cl   = the top-ranked candidate ContractLine
      ctr  = cl's parent GpoContract
      base = cl.tier_price_cents
      tier_priced = round_half_up(base * TIER_MULT[ctr.tier])
      lum_adj  = LUM_FEE_CENTS_PER_EA
                 if (item.uom == "EA" AND formulary_item.lum_enabled == true) else 0
      cold_adj = max(COLD_HANDLING_MIN_CENTS, round_half_up(base * COLD_HANDLING_PCT))
                 if item.handling_class IN {COLD_CHAIN, CONTROLLED_COLD} else 0
      raw  = tier_priced + lum_adj + cold_adj
      unit_price_cents = min(max(raw, cl.floor_price_cents), item.wac_cents)
      # Evaluation order is pinned: tier multiplier is rounded FIRST, then the two
      # adders are added at full precision, then the floor is applied, then the WAC
      # ceiling. Applying the ceiling before the floor is wrong.
    constants:
      TIER_MULT: { TIER_1: 1.00, TIER_2: 1.06, TIER_3: 1.13 }
      LUM_FEE_CENTS_PER_EA: 12
      COLD_HANDLING_MIN_CENTS: 45
      COLD_HANDLING_PCT: 0.03
    precision: "integer cents; round_half_up at every named round_half_up step"
    variants:
      - name: pin_at_line_write
        when: "Evaluated at OrderLine creation and again at substitution approval, with T = the logical clock at that instant. Result is stored in OrderLine.pinned_unit_price_cents and drives order_total_cents and the room's credit commitment."
        difference: "Uses the contract ACTIVE at the moment the line was written. Survives later supersession untouched."
      - name: settlement_reprice
        when: "Evaluated at POST /orders/{order_id}/deliver with T = the delivery instant. Result is stored in OrderLine.settled_unit_price_cents and is the ONLY price the manufacturer chargeback uses."
        difference: "Re-selects the candidate set at delivery time. When the pinned contract was superseded between line write and delivery, the successor contract's tier and price apply, so settled_unit_price_cents != pinned_unit_price_cents for identical line inputs. order_total_cents is never restated from the settled price."

  - name: order_total
    trigger: "Runs on POST /orders/{order_id}/lines, POST /orders/{order_id}/allocate, POST /orders/{order_id}/deliver, POST /substitution-requests/{substitution_request_id}/clinician-action with action=APPROVE or action=REJECT, and inside the recall cascade. Writes OrderLine.extended_price_cents, OrderLine.line_fee_cents and ReplenishmentOrder.order_total_cents."
    algorithm: aggregation
    input_set: |
      Lines of the order with line_status IN {OPEN, ALLOCATED, SUBSTITUTED, DELIVERED}.
      Lines with line_status IN {BACKORDERED, SHORTED, CANCELLED} are excluded and have
      their extended_price_cents and line_fee_cents zeroed.
      Quantity basis per line:
        qty_basis = allocated_qty  when line_status IN {ALLOCATED, DELIVERED}
        qty_basis = requested_qty  when line_status IN {OPEN, SUBSTITUTED}
    formula: |
      # NESTED ROUNDING ORDER IS PINNED: round the fee on EACH line first, then sum.
      for each line L in the input set:
          L.extended_price_cents = L.pinned_unit_price_cents * qty_basis(L)
          L.line_fee_cents       = round_half_up(L.extended_price_cents * DIST_FEE_PCT)
      order.order_total_cents = sum over L of (L.extended_price_cents + L.line_fee_cents)
      # Summing extended_price_cents first and rounding the fee once over the sum is
      # explicitly WRONG and produces a different total (two lines of 200 cents give
      # 412 per-line versus 411 sum-then-round).
    constants:
      DIST_FEE_PCT: 0.0275
    precision: "integer cents; round_half_up applied once per line, never over the sum"

  - name: chargeback_settlement
    trigger: "Runs on POST /chargeback-claims and again on POST /chargeback-claims/{chargeback_claim_id}/settle with action=RESUBMIT. Writes ChargebackClaim.gross_chargeback_cents, admin_fee_pct, admin_fee_cents, net_chargeback_cents and eligible_line_count."
    algorithm: threshold
    input_set: |
      Lines of the claimed ReplenishmentOrder with line_status == DELIVERED
      AND chargeback_eligible == true. Every other line status is excluded.
      eligible_line_count = the size of that set. An empty set is a hard rejection,
      not a zero claim: ERR_NO_CHARGEBACK_ELIGIBLE_LINES (422).
    formula: |
      # The bracket looks circular - the fee depends on the amount and the amount
      # depends on the fee - so the evaluation order is PINNED to four steps.
      STEP 1: gross_chargeback_cents =
                sum over eligible lines L of
                  max(0, item(L).wac_cents - L.settled_unit_price_cents) * L.allocated_qty
      STEP 2: admin_fee_pct = ADMIN_FEE_BRACKETS keyed on gross_chargeback_cents:
                gross_chargeback_cents < 50000                              -> 0.020
                50000 <= gross_chargeback_cents < 250000                    -> 0.015
                gross_chargeback_cents >= 250000                            -> 0.010
      STEP 3: admin_fee_cents = round_half_up(gross_chargeback_cents * admin_fee_pct)
      STEP 4: net_chargeback_cents = gross_chargeback_cents - admin_fee_cents
      # The bracket is keyed on GROSS, never re-derived from net. Re-keying on net
      # after STEP 4 changes the answer whenever net crosses a bracket edge.
      # Bracket edges are inclusive on the lower bound: gross == 50000 selects 0.015.
    constants:
      ADMIN_FEE_BRACKET_1_MAX_EXCLUSIVE: 50000
      ADMIN_FEE_BRACKET_2_MAX_EXCLUSIVE: 250000
      ADMIN_FEE_PCT_BRACKET_1: 0.020
      ADMIN_FEE_PCT_BRACKET_2: 0.015
      ADMIN_FEE_PCT_BRACKET_3: 0.010
    precision: "integer cents; round_half_up applied exactly once, at STEP 3"

  - name: par_replenishment_suggestion
    trigger: "Runs on GET /formulary-items/{formulary_item_id}/replenishment-suggestion. Returns a computed projection; persists nothing."
    algorithm: threshold
    input_set: |
      A single FormularyItem and its Item. Eligibility is a two-part gate:
        formulary_item.formulary_status == APPROVED
        AND formulary_item.on_hand_qty <= formulary_item.reorder_point   (INCLUSIVE)
      An on-hand count exactly equal to reorder_point IS due for replenishment;
      reorder_point + 1 is not.
    formula: |
      if NOT eligible:
          eligible = false; deficit_eaches = 0
          suggested_case_qty = 0; suggested_each_qty = 0; suggested_total_eaches = 0
      else:
          eligible = true
          deficit_eaches = formulary_item.par_qty - formulary_item.on_hand_qty
          upp = item.units_per_parent
          # variant-specific, see variants below
    constants:
      MIN_UNITS_PER_PARENT: 1
    precision: "integer eaches; ceil and floor as named per variant, no rounding mode involved"
    variants:
      - name: STANDARD_TOPOFF
        when: "variant=STANDARD_TOPOFF on the query. Whole-case picking only."
        difference: |
          suggested_case_qty     = ceil(deficit_eaches / upp)
          suggested_each_qty     = 0
          suggested_total_eaches = suggested_case_qty * upp
          Over-ships whenever deficit_eaches is not a multiple of upp.
      - name: LUM_SPLIT
        when: "variant=LUM_SPLIT on the query. Low-unit-of-measure picking: whole cases plus loose eaches."
        difference: |
          suggested_case_qty     = floor(deficit_eaches / upp)
          suggested_each_qty     = deficit_eaches - suggested_case_qty * upp
          suggested_total_eaches = deficit_eaches
          Ships the deficit exactly. For par_qty 100, on_hand_qty 30, upp 24 the two
          variants disagree: STANDARD_TOPOFF gives 3 cases / 72 eaches, LUM_SPLIT
          gives 2 cases plus 22 eaches / 70 eaches.

  - name: route_cold_chain_load
    trigger: "Runs on POST /delivery-routes/{route_id}/stops (before the stop is accepted) and is re-run inside the recall cascade when an order is detached. Writes DeliveryRoute.cold_units_loaded and DeliveryRoute.planned_order_count."
    algorithm: aggregation
    input_set: |
      ReplenishmentOrder rows with route_id == route.id and
      fulfillment_status IN {ALLOCATED, IN_TRANSIT, DELIVERED};
      within each such order, OrderLine rows with line_status IN {ALLOCATED, DELIVERED}
      whose Item.handling_class IN {COLD_CHAIN, CONTROLLED_COLD}.
    formula: |
      cold_units_loaded = sum over those lines of allocated_qty
      planned_order_count = count of ReplenishmentOrder rows with route_id == route.id
                            and fulfillment_status IN {ALLOCATED, IN_TRANSIT, DELIVERED}
      # Acceptance gate on POST /delivery-routes/{route_id}/stops, evaluated as a
      # projection BEFORE the assignment is written:
      projected = cold_units_loaded + (cold units of the incoming order)
      accept iff projected <= COLD_CHAIN_ROUTE_CAPACITY_UNITS      (strict > rejects)
      # A route whose vehicle_class == AMBIENT_VAN has an effective capacity of 0:
      # any incoming order with cold units at all is rejected.
    constants:
      COLD_CHAIN_ROUTE_CAPACITY_UNITS: 400
      AMBIENT_VAN_COLD_CAPACITY_UNITS: 0
    precision: "integer units; no rounding"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing rule determines the response, later rules are not run)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the endpoint's declared roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body schema: every required input field is present, types match, enum values are members of the declared set, integer fields honour their declared bounds (requested_qty > 0, par_qty > 0, 0 <= reorder_point < par_qty, floor_price_cents > 0, effective_to > effective_from, 0 <= window_open_min < window_close_min <= 1439, service_minutes > 0, 0 <= arrival_min <= 1439), and pagination limit is within [1, 100] with offset >= 0."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path-segment resource exists, validated left to right."
    error_id: "ERR_SUPPLY_ROOM_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_CONTRACT_LINE_NOT_FOUND | ERR_FORMULARY_ITEM_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_SUBSTITUTION_REQUEST_NOT_FOUND | ERR_RECALL_NOTICE_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_CHARGEBACK_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all path-templated endpoints"

  - priority: 5
    category: existence
    check: "Every foreign-key value supplied in the request body resolves to an existing row (item_id, lot_id, lum_parent_item_id, supersedes_contract_id, supply_room_id, order_id, contract_id, proposed_item_id)."
    error_id: "ERR_ITEM_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_SUPPLY_ROOM_NOT_FOUND | ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /items, POST /contracts, POST /contracts/{contract_id}/lines, POST /supply-rooms/{supply_room_id}/formulary-items, POST /lots, POST /orders, POST /orders/{order_id}/lines, POST /order-lines/{order_line_id}/substitution-requests, POST /recall-notices, POST /delivery-routes/{route_id}/stops, POST /chargeback-claims"

  - priority: 6
    category: auth
    check: "When X-User-Role is MaterialsManager, X-User-ID must equal the SupplyRoom.id that scopes the target resource: the path supply room, or order.supply_room_id, or formulary_item.supply_room_id, or the order behind the targeted order line or substitution request."
    error_id: ERR_SUPPLY_ROOM_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /supply-rooms/{supply_room_id}/formulary-items, POST /formulary-items/{formulary_item_id}/adjust-on-hand, GET /formulary-items/{formulary_item_id}/replenishment-suggestion, POST /orders, POST /orders/{order_id}/lines, POST /orders/{order_id}/submit, POST /order-lines/{order_line_id}/substitution-requests, POST /substitution-requests/{substitution_request_id}/respond"

  - priority: 7
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version integer."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{order_id}/lines, POST /formulary-items/{formulary_item_id}/adjust-on-hand"

  - priority: 8
    category: state
    check: "The target entity's current state permits the requested transition, per the 1.2 state machine that owns it."
    error_id: "ERR_ORDER_NOT_DRAFT | ERR_ORDER_STATE_INVALID | ERR_ORDER_LINE_STATE_INVALID | ERR_CONTRACT_TRANSITION_INVALID | ERR_FORMULARY_STATE_INVALID | ERR_LOT_STATE_INVALID | ERR_SUBSTITUTION_STATE_INVALID | ERR_RECALL_STATE_INVALID | ERR_ROUTE_STATE_INVALID | ERR_CLAIM_STATE_INVALID"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: SupplyRoom.room_code, Item.sku, GpoContract.contract_code and DeliveryRoute.route_code are globally unique; (contract_id, item_id) is unique across ContractLine; (supply_room_id, item_id) is unique across FormularyItem; a ReplenishmentOrder may carry at most one ChargebackClaim whose status is not DISPUTED."
    error_id: "ERR_DUPLICATE_ROOM_CODE | ERR_DUPLICATE_SKU | ERR_DUPLICATE_CONTRACT_CODE | ERR_DUPLICATE_ROUTE_CODE | ERR_DUPLICATE_CONTRACT_LINE | ERR_DUPLICATE_FORMULARY_ITEM | ERR_CLAIM_ALREADY_OPEN"
    http_status: 409
    applies_to: "POST /supply-rooms, POST /items, POST /contracts, POST /contracts/{contract_id}/lines, POST /supply-rooms/{supply_room_id}/formulary-items, POST /delivery-routes, POST /chargeback-claims"

  - priority: 10
    category: business_safety
    check: "For every non-terminal line whose Item.handling_class IN {CONTROLLED, CONTROLLED_COLD}, the destination SupplyRoom must have controlled_secured == true AND controlled_license_status == ACTIVE. A DRAFT order is a worksheet: the check runs at submission and at substitution approval, never at line write."
    error_id: ERR_CONTROLLED_HANDLING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /orders/{order_id}/submit, POST /substitution-requests/{substitution_request_id}/clinician-action"

  - priority: 11
    category: business_safety
    check: "For every non-terminal line whose Item.handling_class IN {COLD_CHAIN, CONTROLLED_COLD}, the destination SupplyRoom must have refrigerated == true. Like priority 10 this runs at submission and at substitution approval, never at line write."
    error_id: ERR_COLD_CHAIN_ROOM_REQUIRED
    http_status: 422
    applies_to: "POST /orders/{order_id}/submit, POST /substitution-requests/{substitution_request_id}/clinician-action"

  - priority: 12
    category: business_safety
    check: "At delivery, every ALLOCATED line's referenced Lot must still have status == AVAILABLE."
    error_id: ERR_LOT_NOT_ALLOCATABLE
    http_status: 422
    applies_to: "POST /orders/{order_id}/deliver"

  - priority: 13
    category: business_safety
    check: "At delivery, every ALLOCATED line's referenced Lot must have expiry_date > clock_now."
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /orders/{order_id}/deliver"

  - priority: 14
    category: business_safety
    check: "Two-person rules keyed on X-User-ID: the ContractAdmin reconciling a ChargebackClaim must not be claim.submitted_by_user_id; the DistributionOperator releasing a cold-chain excursion must not be lot.excursion_flagged_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /chargeback-claims/{chargeback_claim_id}/settle, POST /lots/{lot_id}/excursion"

  - priority: 15
    category: business_referential
    check: "A FormularyItem for (order.supply_room_id, item_id) exists with formulary_status == APPROVED."
    error_id: ERR_ITEM_NOT_ON_FORMULARY
    http_status: 422
    applies_to: "POST /orders/{order_id}/lines, POST /orders/{order_id}/submit, POST /substitution-requests/{substitution_request_id}/clinician-action"

  - priority: 16
    category: business_referential
    check: "The contract_unit_price candidate set is non-empty for the item, the room's gpo_member_class and the current logical clock."
    error_id: ERR_NO_ACTIVE_CONTRACT_PRICE
    http_status: 422
    applies_to: "POST /orders/{order_id}/lines, POST /substitution-requests/{substitution_request_id}/clinician-action, POST /orders/{order_id}/deliver"

  - priority: 17
    category: business_temporal
    check: "Contract effective periods are CLOSED intervals with no buffer. Activating a contract is refused when another GpoContract with status == ACTIVE shares its manufacturer_code AND its member_class_scope, prices at least one item in common, and satisfies new.effective_from <= other.effective_to AND other.effective_from <= new.effective_to - endpoints that merely touch DO collide. Contracts from different manufacturer_code values may legitimately price the same item over one shared instant; the unit-price selector then ranks between them. The refusal is waived only when other.id == new.supersedes_contract_id."
    error_id: ERR_CONTRACT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /contracts/{contract_id}/transition"

  - priority: 18
    category: business_temporal
    check: "Route stops are HALF-OPEN intervals [arrival_min, arrival_min + service_minutes) that additionally demand a ROOM_TURNOVER_BUFFER_MIN separation. A new stop at a supply room collides with an existing stop at the same supply room on the same service_date, on any route with status IN {PLANNED, DISPATCHED}, when new.arrival_min < other.arrival_min + other.service_minutes + ROOM_TURNOVER_BUFFER_MIN AND other.arrival_min < new.arrival_min + new.service_minutes + ROOM_TURNOVER_BUFFER_MIN."
    error_id: ERR_ROOM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-routes/{route_id}/stops"

  - priority: 19
    category: business_temporal
    check: "The stop must lie inside the destination room's receiving window: supply_room.window_open_min <= arrival_min AND arrival_min + service_minutes <= supply_room.window_close_min."
    error_id: ERR_STOP_OUTSIDE_ROOM_WINDOW
    http_status: 422
    applies_to: "POST /delivery-routes/{route_id}/stops"

  - priority: 20
    category: business_constraint
    check: "Route cold-chain payload gate: cold_units_loaded plus the incoming order's cold units must be <= COLD_CHAIN_ROUTE_CAPACITY_UNITS for a REEFER_VAN, and <= AMBIENT_VAN_COLD_CAPACITY_UNITS for an AMBIENT_VAN."
    error_id: ERR_ROUTE_COLD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-routes/{route_id}/stops"

  - priority: 21
    category: business_constraint
    check: "Total requested_qty across the order's non-terminal lines whose Item.handling_class IN {CONTROLLED, CONTROLLED_COLD} must be <= CONTROLLED_MAX_UNITS_PER_ORDER (100)."
    error_id: ERR_CONTROLLED_QTY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /orders/{order_id}/submit"

  - priority: 22
    category: business_constraint
    check: "A clinician may open an information-request round only while request.rounds_used < SUBSTITUTION_MAX_ROUNDS (2)."
    error_id: ERR_SUBSTITUTION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /substitution-requests/{substitution_request_id}/clinician-action"

  - priority: 23
    category: business_constraint
    check: "A chargeback claim requires at least one DELIVERED line with chargeback_eligible == true on the claimed order."
    error_id: ERR_NO_CHARGEBACK_ELIGIBLE_LINES
    http_status: 422
    applies_to: "POST /chargeback-claims, POST /chargeback-claims/{chargeback_claim_id}/settle"

  - priority: 24
    category: business_fiscal
    check: "supply_room.open_commitment_cents + order.order_total_cents must be <= supply_room.credit_limit_cents at submission."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /orders/{order_id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- SupplyRoom --------------------------------------------------------
  - method: POST
    path: "/supply-rooms"
    description: "Register a supply room at a member facility."
    roles: [ContractAdmin]
    code: 201
    input: ["facility_code", "room_code", "gpo_member_class", "room_type", "refrigerated?", "controlled_secured?", "controlled_license_status?", "window_open_min?", "window_close_min?", "credit_limit_cents?"]
    output: SupplyRoom
    side_effects: ["open_commitment_cents initialised to 0"]
  - method: GET
    path: "/supply-rooms/{supply_room_id}"
    description: "Read one supply room."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: SupplyRoom
    side_effects: []

  # ---- Item --------------------------------------------------------------
  - method: POST
    path: "/items"
    description: "Create an item-master record. Supply lum_parent_item_id to declare this each-level item as the low-unit-of-measure breakdown of a case-level item."
    roles: [ContractAdmin]
    code: 201
    input: ["sku", "description", "manufacturer_code", "uom", "wac_cents", "handling_class", "units_per_parent?", "lum_parent_item_id?", "is_lot_tracked?", "status?"]
    output: Item
    side_effects: []
  - method: GET
    path: "/items/{item_id}"
    description: "Read one item-master record."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: GET
    path: "/items"
    description: "List item-master records. Filtering by lum_parent_item_id returns the each-level children of a case-level item."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["lum_parent_item_id?", "manufacturer_code?", "handling_class?", "status?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  # ---- GpoContract -------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Create a GPO contract header in DRAFT."
    roles: [ContractAdmin]
    code: 201
    input: ["manufacturer_code", "contract_code", "tier", "member_class_scope", "effective_from", "effective_to", "committed_volume_units?", "supersedes_contract_id?"]
    output: GpoContract
    side_effects: ["chargeback_payable_cents initialised to 0"]
  - method: GET
    path: "/contracts/{contract_id}"
    description: "Read one GPO contract, including its running chargeback_payable_cents ledger."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: GpoContract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List GPO contracts. Filtering by supersedes_contract_id returns the successors of a given contract."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["supersedes_contract_id?", "manufacturer_code?", "status?", "limit?", "offset?"]
    output: GpoContract[]
    side_effects: []
  - method: POST
    path: "/contracts/{contract_id}/transition"
    description: "Drive the contract status machine: PENDING_ACTIVATION, ACTIVE, SUSPENDED or EXPIRED."
    roles: [ContractAdmin]
    code: 200
    input: ["to_status"]
    output: GpoContract
    side_effects:
      - "cascades activation_state across every ContractLine of the contract"
      - "on activation with supersedes_contract_id set, moves the superseded contract to SUPERSEDED and BLOCKS its lines"
      - "sets activated_at on entry to ACTIVE"

  # ---- ContractLine ------------------------------------------------------
  - method: POST
    path: "/contracts/{contract_id}/lines"
    description: "Add a per-item contracted price to a contract. The line starts PENDING and only becomes selectable when the contract activates."
    roles: [ContractAdmin]
    code: 201
    input: ["item_id", "tier_price_cents", "floor_price_cents", "chargeback_eligible?"]
    output: ContractLine
    side_effects: ["activation_state initialised to PENDING"]
  - method: GET
    path: "/contract-lines/{contract_line_id}"
    description: "Read one contract line."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: ContractLine
    side_effects: []
  - method: GET
    path: "/contract-lines"
    description: "List contract lines. Filter by contract_id to walk a contract's price sheet, or by item_id to see every contract that prices an item."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["contract_id?", "item_id?", "activation_state?", "limit?", "offset?"]
    output: ContractLine[]
    side_effects: []

  # ---- FormularyItem -----------------------------------------------------
  - method: POST
    path: "/supply-rooms/{supply_room_id}/formulary-items"
    description: "Map an item onto a supply room's formulary and configure its par level. Starts REQUESTED and is not orderable until a clinician approves it."
    roles: [MaterialsManager]
    code: 201
    input: ["item_id", "facility_item_code", "par_qty", "reorder_point", "lum_enabled?"]
    output: FormularyItem
    side_effects: ["formulary_status initialised to REQUESTED; on_hand_qty initialised to 0"]
  - method: GET
    path: "/formulary-items/{formulary_item_id}"
    description: "Read one formulary mapping with its par configuration and on-hand count."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: FormularyItem
    side_effects: []
  - method: GET
    path: "/formulary-items"
    description: "List formulary mappings. Filter by supply_room_id for a room's formulary or by item_id for every room stocking an item."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["supply_room_id?", "item_id?", "formulary_status?", "limit?", "offset?"]
    output: FormularyItem[]
    side_effects: []
  - method: POST
    path: "/formulary-items/{formulary_item_id}/decision"
    description: "Record a clinician formulary decision: APPROVED, RESTRICTED or DELISTED."
    roles: [Clinician]
    code: 200
    input: ["decision"]
    output: FormularyItem
    side_effects: ["sets decided_by_user_id to the acting X-User-ID"]
  - method: POST
    path: "/formulary-items/{formulary_item_id}/adjust-on-hand"
    description: "Post a cycle-count delta against the room's on-hand quantity. Optimistically concurrent on the formulary item's version."
    roles: [MaterialsManager]
    code: 200
    input: ["delta_qty", "expected_formulary_item_version"]
    output: FormularyItem
    side_effects:
      - "on_hand_qty += delta_qty, floored at 0"
      - "increments FormularyItem.version by 1"
  - method: GET
    path: "/formulary-items/{formulary_item_id}/replenishment-suggestion"
    description: "Computed read. Returns the par-level replenishment suggestion under the requested variant (STANDARD_TOPOFF whole cases, or LUM_SPLIT cases plus loose eaches). Persists nothing."
    roles: [MaterialsManager, ContractAdmin]
    code: 200
    input: ["variant"]
    output: { eligible: boolean, deficit_eaches: integer, suggested_case_qty: integer, suggested_each_qty: integer, suggested_total_eaches: integer, variant: string }
    side_effects: []

  # ---- Lot ---------------------------------------------------------------
  - method: POST
    path: "/lots"
    description: "Receive a manufacturer lot into the distribution centre."
    roles: [DistributionOperator]
    code: 201
    input: ["item_id", "lot_code", "expiry_date", "received_quantity"]
    output: Lot
    side_effects: ["quantity_on_hand initialised to received_quantity; status initialised to AVAILABLE"]
  - method: GET
    path: "/lots/{lot_id}"
    description: "Read one lot."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/lots"
    description: "List lots. Filter by item_id to see every lot of an item."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["item_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: POST
    path: "/lots/{lot_id}/excursion"
    description: "Cold-chain excursion handling: FLAG places the lot on hold, RELEASE returns it to AVAILABLE under a two-person rule, DESTROY writes it off."
    roles: [DistributionOperator]
    code: 200
    input: ["action", "note?"]
    output: Lot
    side_effects:
      - "FLAG records excursion_flagged_by_user_id"
      - "RELEASE clears excursion_flagged_by_user_id and is refused when the acting user flagged it"
      - "DESTROY zeroes quantity_on_hand"

  # ---- ReplenishmentOrder ------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Open a DRAFT replenishment order for a supply room."
    roles: [MaterialsManager]
    code: 201
    input: ["supply_room_id"]
    output: ReplenishmentOrder
    side_effects: ["fulfillment_status initialised to DRAFT; settlement_status initialised to UNBILLED"]
  - method: GET
    path: "/orders/{order_id}"
    description: "Read one replenishment order, including both state axes and order_total_cents."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List replenishment orders. Filter by supply_room_id for a room's orders or by route_id for a route's manifest."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["supply_room_id?", "route_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []
  - method: POST
    path: "/orders/{order_id}/lines"
    description: "Write a line onto a DRAFT order. Pins the unit price from the contract ACTIVE at this instant. Optimistically concurrent on the order's version."
    roles: [MaterialsManager]
    code: 201
    input: ["item_id", "requested_qty", "expected_order_version"]
    output: OrderLine
    side_effects:
      - "runs contract_unit_price variant pin_at_line_write and stores pinned_contract_line_id, pinned_unit_price_cents and chargeback_eligible"
      - "runs order_total and rewrites extended_price_cents, line_fee_cents and ReplenishmentOrder.order_total_cents"
      - "increments ReplenishmentOrder.version by 1"
  - method: POST
    path: "/orders/{order_id}/submit"
    description: "Submit a DRAFT order for picking."
    roles: [MaterialsManager]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "sets submitted_at to the logical clock"
      - "adds order_total_cents to supply_room.open_commitment_cents"
  - method: POST
    path: "/orders/{order_id}/allocate"
    description: "Run FEFO lot allocation over the order's OPEN, BACKORDERED and SUBSTITUTED lines."
    roles: [DistributionOperator]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "allocates each eligible line all-or-nothing from the earliest-expiring AVAILABLE lot, decrementing Lot.quantity_on_hand"
      - "moves unallocatable lines to BACKORDERED"
      - "recomputes order_total_cents and adjusts supply_room.open_commitment_cents by the delta"
      - "moves the order to ALLOCATED, or to HELD when nothing could be allocated"
  - method: POST
    path: "/orders/{order_id}/deliver"
    description: "Receive an in-transit order into the supply room. Re-prices every allocated line against the contract ACTIVE at the delivery instant."
    roles: [DistributionOperator]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "runs contract_unit_price variant settlement_reprice and stores settled_unit_price_cents on every delivered line"
      - "increments the destination FormularyItem.on_hand_qty by allocated_qty times units_per_parent for CS items"
      - "sets delivered_at and releases order_total_cents from supply_room.open_commitment_cents"
      - "moves the route to COMPLETED when every assigned order is DELIVERED"

  # ---- OrderLine ---------------------------------------------------------
  - method: GET
    path: "/order-lines/{order_line_id}"
    description: "Read one order line, including both the pinned and the settled unit price."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines. Filter by order_id, by item_id, by lot_id to find every line drawn from a lot, or by pinned_contract_line_id to find every line priced off a contract line."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["order_id?", "item_id?", "lot_id?", "pinned_contract_line_id?", "line_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # ---- SubstitutionRequest -----------------------------------------------
  - method: POST
    path: "/order-lines/{order_line_id}/substitution-requests"
    description: "Propose a substitute item for an order line, for clinician decision. Permitted while the line is OPEN or BACKORDERED; approval itself still requires BACKORDERED."
    roles: [MaterialsManager]
    code: 201
    input: ["proposed_item_id", "justification"]
    output: SubstitutionRequest
    side_effects: ["records requested_by_user_id from the acting X-User-ID; status initialised to PENDING"]
  - method: GET
    path: "/substitution-requests/{substitution_request_id}"
    description: "Read one substitution request."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: GET
    path: "/substitution-requests"
    description: "List substitution requests. Filter by order_line_id or by proposed_item_id."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["order_line_id?", "proposed_item_id?", "status?", "limit?", "offset?"]
    output: SubstitutionRequest[]
    side_effects: []
  - method: POST
    path: "/substitution-requests/{substitution_request_id}/clinician-action"
    description: "Clinician decision on a substitution: REQUEST_INFO opens another round, APPROVE swaps the line's item and re-pins its price, REJECT shorts the line."
    roles: [Clinician]
    code: 200
    input: ["action", "note?"]
    output: SubstitutionRequest
    side_effects:
      - "APPROVE rewrites OrderLine.item_id, moves the line BACKORDERED -> SUBSTITUTED, re-runs contract_unit_price and order_total, and cascades a rebill onto any open ChargebackClaim"
      - "REJECT moves the line BACKORDERED -> SHORTED and re-runs order_total"
      - "records clinician_user_id from the acting X-User-ID"
  - method: POST
    path: "/substitution-requests/{substitution_request_id}/respond"
    description: "Requester follow-up: RESPOND answers an information request and returns the case to PENDING, WITHDRAW closes it."
    roles: [MaterialsManager]
    code: 200
    input: ["action", "response_note?"]
    output: SubstitutionRequest
    side_effects:
      - "RESPOND increments rounds_used and returns the request to PENDING"
      - "WITHDRAW closes the request and cancels the target line when it is still OPEN"

  # ---- RecallNotice ------------------------------------------------------
  - method: POST
    path: "/recall-notices"
    description: "Issue a manufacturer recall on an item, optionally narrowed to a single lot."
    roles: [ContractAdmin]
    code: 201
    input: ["item_id", "recall_class", "reason", "lot_id?"]
    output: RecallNotice
    side_effects: ["status initialised to ISSUED; nothing is quarantined until the notice is cascaded"]
  - method: GET
    path: "/recall-notices/{recall_notice_id}"
    description: "Read one recall notice with its cascade counters."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: GET
    path: "/recall-notices"
    description: "List recall notices. Filter by item_id or lot_id."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["item_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []
  - method: POST
    path: "/recall-notices/{recall_notice_id}/cascade"
    description: "CASCADE quarantines every in-scope lot and unwinds the four-hop notification chain into order lines, orders and routes. CLOSE ends the notice."
    roles: [DistributionOperator]
    code: 200
    input: ["action"]
    output: RecallNotice
    side_effects:
      - "HOP 1 quarantines matching lots and writes quarantined_lot_count"
      - "HOP 2 backorders the lines allocated from those lots, returns their quantity to the lot and writes backordered_line_count"
      - "HOP 3 recomputes each affected order's order_total_cents and holds fully-backordered orders"
      - "HOP 4 detaches held orders from their route and cancels a route left with no orders"

  # ---- DeliveryRoute -----------------------------------------------------
  - method: POST
    path: "/delivery-routes"
    description: "Plan a dated delivery route."
    roles: [DistributionOperator]
    code: 201
    input: ["route_code", "service_date", "vehicle_class"]
    output: DeliveryRoute
    side_effects: ["status initialised to PLANNED; planned_order_count and cold_units_loaded initialised to 0"]
  - method: GET
    path: "/delivery-routes/{route_id}"
    description: "Read one route with its stop counters and cold-chain load."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/delivery-routes"
    description: "List delivery routes."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["status?", "service_date?", "limit?", "offset?"]
    output: DeliveryRoute[]
    side_effects: []
  - method: POST
    path: "/delivery-routes/{route_id}/stops"
    description: "Add an allocated order to the route as a timed stop at its supply room. Enforces the room window, the half-open stop geometry with turnover buffer, and the aggregate cold-chain ceiling. Returns the updated order."
    roles: [DistributionOperator]
    code: 200
    input: ["order_id", "arrival_min", "service_minutes"]
    output: ReplenishmentOrder
    side_effects:
      - "sets order.route_id, stop_arrival_min, stop_service_minutes and service_date"
      - "recomputes DeliveryRoute.planned_order_count and cold_units_loaded"
  - method: POST
    path: "/delivery-routes/{route_id}/dispatch"
    description: "Dispatch the route; every assigned order moves ALLOCATED -> IN_TRANSIT."
    roles: [DistributionOperator]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["sets dispatched_at; moves every assigned order to IN_TRANSIT"]

  # ---- ChargebackClaim ---------------------------------------------------
  - method: POST
    path: "/chargeback-claims"
    description: "Raise a chargeback claim against a manufacturer contract for a delivered order's eligible lines."
    roles: [ContractAdmin]
    code: 201
    input: ["order_id", "contract_id"]
    output: ChargebackClaim
    side_effects:
      - "runs chargeback_settlement and stores gross_chargeback_cents, admin_fee_pct, admin_fee_cents, net_chargeback_cents and eligible_line_count"
      - "adds net_chargeback_cents to GpoContract.chargeback_payable_cents"
      - "moves the order settlement_status UNBILLED -> CLAIMED"
      - "records submitted_by_user_id from the acting X-User-ID"
  - method: GET
    path: "/chargeback-claims/{chargeback_claim_id}"
    description: "Read one chargeback claim with its full settlement breakdown."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: []
    output: ChargebackClaim
    side_effects: []
  - method: GET
    path: "/chargeback-claims"
    description: "List chargeback claims. Filter by order_id or contract_id."
    roles: [ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep]
    code: 200
    input: ["order_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: ChargebackClaim[]
    side_effects: []
  - method: POST
    path: "/chargeback-claims/{chargeback_claim_id}/response"
    description: "Manufacturer response to a submitted claim: ACCEPT or DISPUTE."
    roles: [ManufacturerRep]
    code: 200
    input: ["outcome", "dispute_reason?"]
    output: ChargebackClaim
    side_effects:
      - "DISPUTE removes net_chargeback_cents from GpoContract.chargeback_payable_cents and returns the order to UNBILLED"
      - "ACCEPT leaves the ledger untouched"
  - method: POST
    path: "/chargeback-claims/{chargeback_claim_id}/settle"
    description: "Distributor settlement action: RECONCILE closes an accepted claim under the two-person rule, RESUBMIT recomputes and re-posts a disputed or rebill-required claim."
    roles: [ContractAdmin]
    code: 200
    input: ["action"]
    output: ChargebackClaim
    side_effects:
      - "RECONCILE records reconciled_by_user_id and moves the order to RECONCILED"
      - "RESUBMIT re-runs chargeback_settlement at the current clock and re-posts net_chargeback_cents to the ledger"

  # ---- Test-driving surface ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at exactly 2026-08-01T00:00:00Z on server start and never falls back to wall-clock time; every effective-date, expiry and delivery timestamp in this API reads from it."
    roles: [ContractAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; subsequent requests evaluate against the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of ContractAdmin, MaterialsManager, Clinician, DistributionOperator, ManufacturerRep."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_SUPPLY_ROOM_SCOPE_VIOLATION
    http: 403
    condition: "A MaterialsManager acts on a resource scoped to a SupplyRoom other than the one its X-User-ID identifies."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals claim.submitted_by_user_id on a RECONCILE, or equals lot.excursion_flagged_by_user_id on an excursion RELEASE."

  # -- schema -------------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, enum value outside the declared set, numeric bound violated, or pagination limit outside [1, 100] / offset below 0."

  # -- existence ----------------------------------------------------------
  - id: ERR_SUPPLY_ROOM_NOT_FOUND
    http: 404
    condition: "supply_room_id in path or body does not resolve."
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "item_id, lum_parent_item_id or proposed_item_id does not resolve."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id or supersedes_contract_id does not resolve."
  - id: ERR_CONTRACT_LINE_NOT_FOUND
    http: 404
    condition: "contract_line_id in path does not resolve."
  - id: ERR_FORMULARY_ITEM_NOT_FOUND
    http: 404
    condition: "formulary_item_id in path does not resolve."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot_id in path or body does not resolve."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id in path or body does not resolve."
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order_line_id in path does not resolve."
  - id: ERR_SUBSTITUTION_REQUEST_NOT_FOUND
    http: 404
    condition: "substitution_request_id in path does not resolve."
  - id: ERR_RECALL_NOTICE_NOT_FOUND
    http: 404
    condition: "recall_notice_id in path does not resolve."
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "route_id in path does not resolve."
  - id: ERR_CHARGEBACK_CLAIM_NOT_FOUND
    http: 404
    condition: "chargeback_claim_id in path does not resolve."

  # -- concurrency --------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version or expected_formulary_item_version does not equal the parent's current version."

  # -- state --------------------------------------------------------------
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "A line write or a submit is attempted on an order whose fulfillment_status is not DRAFT."
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "allocate, deliver or route assignment is attempted from a fulfillment_status that does not permit it."
  - id: ERR_ORDER_LINE_STATE_INVALID
    http: 409
    condition: "A substitution request is opened against a line whose line_status is neither OPEN nor BACKORDERED, or a clinician APPROVE targets a line that is not BACKORDERED."
  - id: ERR_CONTRACT_TRANSITION_INVALID
    http: 409
    condition: "The requested to_status is not reachable from the contract's current status, or EXPIRED is requested while clock_now <= effective_to, or ACTIVE is requested outside the effective period, or PENDING_ACTIVATION is requested with no contract line."
  - id: ERR_FORMULARY_STATE_INVALID
    http: 409
    condition: "A formulary decision is requested from a state that does not permit it, including any decision on a DELISTED mapping."
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "FLAG, RELEASE or DESTROY is requested from a lot status that does not permit it."
  - id: ERR_SUBSTITUTION_STATE_INVALID
    http: 409
    condition: "A clinician action or a requester response is attempted on a request in a terminal status, or a RESPOND is attempted while the request is PENDING."
  - id: ERR_RECALL_STATE_INVALID
    http: 409
    condition: "CASCADE is requested on a notice that is not ISSUED, or CLOSE on a notice that is not CASCADED."
  - id: ERR_ROUTE_STATE_INVALID
    http: 409
    condition: "A stop is added to a route that is not PLANNED, dispatch is requested on a route that is not PLANNED, or dispatch is requested with planned_order_count == 0 or with an assigned order not in ALLOCATED."
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "A manufacturer response or a settle action is requested from a claim status that does not permit it."

  # -- uniqueness ---------------------------------------------------------
  - id: ERR_DUPLICATE_ROOM_CODE
    http: 409
    condition: "room_code already exists."
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "sku already exists."
  - id: ERR_DUPLICATE_CONTRACT_CODE
    http: 409
    condition: "contract_code already exists."
  - id: ERR_DUPLICATE_ROUTE_CODE
    http: 409
    condition: "route_code already exists."
  - id: ERR_DUPLICATE_CONTRACT_LINE
    http: 409
    condition: "The contract already prices this item."
  - id: ERR_DUPLICATE_FORMULARY_ITEM
    http: 409
    condition: "The supply room already maps this item."
  - id: ERR_CLAIM_ALREADY_OPEN
    http: 409
    condition: "The order already carries a ChargebackClaim whose status is not DISPUTED."

  # -- safety and compliance ---------------------------------------------
  - id: ERR_CONTROLLED_HANDLING_NOT_PERMITTED
    http: 422
    condition: "A CONTROLLED or CONTROLLED_COLD item is destined for a supply room without controlled_secured == true and controlled_license_status == ACTIVE."
  - id: ERR_COLD_CHAIN_ROOM_REQUIRED
    http: 422
    condition: "A COLD_CHAIN or CONTROLLED_COLD item is destined for a supply room with refrigerated == false."
  - id: ERR_LOT_NOT_ALLOCATABLE
    http: 422
    condition: "At delivery an allocated line's lot is no longer AVAILABLE."
  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "At delivery an allocated line's lot has expiry_date <= the logical clock."

  # -- referential --------------------------------------------------------
  - id: ERR_ITEM_NOT_ON_FORMULARY
    http: 422
    condition: "No FormularyItem with formulary_status == APPROVED exists for the destination supply room and the item."
  - id: ERR_NO_ACTIVE_CONTRACT_PRICE
    http: 422
    condition: "No ACTIVE ContractLine covers the item for the room's gpo_member_class at the evaluation instant."

  # -- temporal -----------------------------------------------------------
  - id: ERR_CONTRACT_PERIOD_OVERLAP
    http: 409
    condition: "Activating the contract would leave two ACTIVE contracts from the same manufacturer_code with intersecting CLOSED effective intervals pricing a shared item for the same member class, and the incumbent is not the declared supersedes_contract_id."
  - id: ERR_ROOM_WINDOW_CONFLICT
    http: 409
    condition: "The proposed stop's half-open interval, expanded by ROOM_TURNOVER_BUFFER_MIN on both sides, intersects another stop at the same supply room on the same service date."
  - id: ERR_STOP_OUTSIDE_ROOM_WINDOW
    http: 422
    condition: "arrival_min is before window_open_min or arrival_min + service_minutes exceeds window_close_min."

  # -- capacity and limits ------------------------------------------------
  - id: ERR_ROUTE_COLD_CAPACITY_EXCEEDED
    http: 409
    condition: "Adding the order would push the route's cold_units_loaded above its vehicle-class capacity."
  - id: ERR_CONTROLLED_QTY_LIMIT_EXCEEDED
    http: 422
    condition: "Controlled units on the order would exceed CONTROLLED_MAX_UNITS_PER_ORDER."
  - id: ERR_SUBSTITUTION_ROUNDS_EXHAUSTED
    http: 409
    condition: "REQUEST_INFO is attempted when rounds_used has already reached SUBSTITUTION_MAX_ROUNDS."
  - id: ERR_NO_CHARGEBACK_ELIGIBLE_LINES
    http: 422
    condition: "The order has no DELIVERED line with chargeback_eligible == true."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Submitting the order would push the room's open_commitment_cents above credit_limit_cents."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractAdmin
    description: "Distributor contracting and settlement desk. Owns the item master, GPO contracts and their price activation, recall issuance, chargeback claims and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /supply-rooms"
      - "POST /items"
      - "POST /contracts"
      - "POST /contracts/{contract_id}/lines"
      - "POST /contracts/{contract_id}/transition"
      - "POST /recall-notices"
      - "POST /chargeback-claims"
      - "POST /chargeback-claims/{chargeback_claim_id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /formulary-items/{formulary_item_id}/replenishment-suggestion (shared with MaterialsManager)"
      - "every GET read endpoint (shared with all roles)"
    note: "Segregation of duties: the X-User-ID that created a ChargebackClaim may never be the X-User-ID that reconciles it, even though both act as ContractAdmin."

  - name: MaterialsManager
    description: "Supply-room materials manager. Owns the room's formulary mappings, par levels, cycle counts, replenishment orders and substitution requests."
    identity: "entity_backed:SupplyRoom"
    exclusive_operations:
      - "POST /supply-rooms/{supply_room_id}/formulary-items"
      - "POST /formulary-items/{formulary_item_id}/adjust-on-hand"
      - "POST /orders"
      - "POST /orders/{order_id}/lines"
      - "POST /orders/{order_id}/submit"
      - "POST /order-lines/{order_line_id}/substitution-requests"
      - "POST /substitution-requests/{substitution_request_id}/respond"
    shared_operations:
      - "GET /formulary-items/{formulary_item_id}/replenishment-suggestion (shared with ContractAdmin)"
      - "every GET read endpoint (shared with all roles)"
    note: "X-User-ID equals the SupplyRoom.id the manager works for; every write is scope-checked against it by validation priority 6."

  - name: Clinician
    description: "Facility clinician. Decides formulary standing and approves or rejects backorder substitutions."
    identity: "opaque"
    exclusive_operations:
      - "POST /formulary-items/{formulary_item_id}/decision"
      - "POST /substitution-requests/{substitution_request_id}/clinician-action"
    shared_operations:
      - "every GET read endpoint (shared with all roles)"

  - name: DistributionOperator
    description: "Distribution-centre operator. Owns lot receipt and disposition, order picking and delivery, recall cascade execution and delivery routing."
    identity: "opaque"
    exclusive_operations:
      - "POST /lots"
      - "POST /lots/{lot_id}/excursion"
      - "POST /orders/{order_id}/allocate"
      - "POST /orders/{order_id}/deliver"
      - "POST /recall-notices/{recall_notice_id}/cascade"
      - "POST /delivery-routes"
      - "POST /delivery-routes/{route_id}/stops"
      - "POST /delivery-routes/{route_id}/dispatch"
    shared_operations:
      - "every GET read endpoint (shared with all roles)"
    note: "Segregation of duties: the X-User-ID that flagged a cold-chain excursion on a lot may never be the X-User-ID that releases it."

  - name: ManufacturerRep
    description: "Manufacturer settlement representative. Accepts or disputes chargeback claims raised against the manufacturer's contracts."
    identity: "opaque"
    exclusive_operations:
      - "POST /chargeback-claims/{chargeback_claim_id}/response"
    shared_operations:
      - "every GET read endpoint (shared with all roles)"

# =============================================================================
# Global constants referenced by 1.2 preconditions and 1.4 validations that do
# not belong to any single 1.3 formula.
# =============================================================================
global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  ROOM_TURNOVER_BUFFER_MIN: 15
  CONTROLLED_MAX_UNITS_PER_ORDER: 100
  SUBSTITUTION_MAX_ROUNDS: 2
