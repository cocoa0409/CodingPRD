              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra1_id: $.data.id }
            - call: POST /cds/review-assignments/${ra1_id}/cast
              payload: { vote: "APPROVE", comment: "Passive advisory is fine" }
              as: SpecialtyApprover
              as_user_id: "${s1_id}"
            - call: POST /cds/alerts/${passive_id}/activate
              payload: { activation_note: "Passive go live" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { passive_state: $.data.lifecycle_state }
            - call: POST /cds/content-requests/${cr_id}/alerts
              payload: { name: "Interruptive Beers stop", firing_criteria: { trigger_event: "ORDER_ENTRY", expression: "beers_medication and age >= 80" }, severity_tier: "TIER_2_INTERRUPTIVE", designed_by_clinician_id: "${builder_id}", override_reason_codes: ["CLINICAL_JUDGMENT"], override_reason_required: false }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { interrupt_id: $.data.id, interrupt_flag: $.data.override_reason_required }
            - call: POST /cds/review-assignments
              payload: { reviewer_id: "${s1_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${interrupt_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra2_id: $.data.id }
            - call: POST /cds/review-assignments
              payload: { reviewer_id: "${s2_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${interrupt_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra3_id: $.data.id }
            - call: POST /cds/review-assignments/${ra2_id}/cast
              payload: { vote: "APPROVE", comment: "Agree" }
              as: SpecialtyApprover
              as_user_id: "${s1_id}"
            - call: POST /cds/review-assignments/${ra3_id}/cast
              payload: { vote: "APPROVE", comment: "Agree" }
              as: SpecialtyApprover
              as_user_id: "${s2_id}"
          trigger:
            - call: POST /cds/alerts/${interrupt_id}/activate
              payload: { activation_note: "Interruptive go live" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "${passive_flag} == false and ${passive_state} == ACTIVE (an empty override_reason_codes array is legal when the flag is false)"
            - "${interrupt_flag} == true (TIER_2_INTERRUPTIVE forces the flag true regardless of the submitted false)"
            - "HTTP 422 with error_id ERR_OVERRIDE_REASON_REQUIRED"
            - "GET /cds/alerts/${interrupt_id} shows lifecycle_state == UNPUBLISHED, review_state == APPROVED, activated_at == null and review_due_date == null"

      - name: validation_suppression_justification_is_checked_only_after_disposition_completeness
        claim_type: cascading_validation
        grounds:
          - validations[priority=25]
          - validations[priority=26]
        distinguishing_aspect: "A CLINICAL_REVIEW release holding an unjustified SUPPRESS delta AND an undispositioned delta returns priority 25's ERR_DELTA_DISPOSITION_INCOMPLETE (409) first; only after the count check passes does the same call surface priority 26's ERR_SUPPRESSION_JUSTIFICATION_REQUIRED (422)."
        test_recipe:
          setup:
            - "A vendor release with three SEVERITY_INCREASED deltas to CONTRAINDICATED, scoring 27 and forking to IMPACT_ANALYZED_CLINICAL_REVIEW."
            - "Delta 1 dispositioned SUPPRESS with no justification, delta 2 dispositioned ACCEPT, delta 3 left undispositioned."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Pia Pharmacist PharmD", npi: "1000000008", specialty: "PHARMACY", credential: "PHARMD", authorized_roles: ["PharmacyInformaticist"] }
              as: SystemAdmin
              captures: { pharm_id: $.data.id }
            - call: POST /cds/vendor-releases
              payload: { vendor_name: "Medisafe", release_label: "2026.10", content_domain: "DRUG_INTERACTION", received_at: "2026-08-01T00:00:00Z" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { vr_id: $.data.id }
            - call: POST /cds/vendor-releases/${vr_id}/deltas
              payload: { rule_code: "DDI-3001", change_type: "SEVERITY_INCREASED", description: "Raised to contraindicated", drug_pair: "warfarin|fluconazole", new_severity: "CONTRAINDICATED", prior_severity: "MAJOR" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { d1_id: $.data.id }
            - call: POST /cds/vendor-releases/${vr_id}/deltas
              payload: { rule_code: "DDI-3002", change_type: "SEVERITY_INCREASED", description: "Raised to contraindicated", drug_pair: "linezolid|sertraline", new_severity: "CONTRAINDICATED", prior_severity: "MAJOR" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { d2_id: $.data.id }
            - call: POST /cds/vendor-releases/${vr_id}/deltas
              payload: { rule_code: "DDI-3003", change_type: "SEVERITY_INCREASED", description: "Raised to contraindicated", drug_pair: "methotrexate|trimethoprim", new_severity: "CONTRAINDICATED", prior_severity: "MAJOR" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { d3_id: $.data.id }
            - call: POST /cds/vendor-releases/${vr_id}/run-impact-analysis
              payload: { analysis_note: "Three contraindicated escalations" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { score: $.data.impact_score, branch: $.data.review_cycle_state }
            - call: POST /cds/vendor-rule-deltas/${d1_id}/disposition
              payload: { disposition: "SUPPRESS" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: POST /cds/vendor-rule-deltas/${d2_id}/disposition
              payload: { disposition: "ACCEPT" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
          trigger:
            - call: POST /cds/vendor-releases/${vr_id}/activate
              payload: { activation_note: "First attempt, two of three dispositioned" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/vendor-rule-deltas/${d3_id}/disposition
              payload: { disposition: "ACCEPT" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/vendor-releases/${vr_id}/activate
              payload: { activation_note: "Second attempt, all dispositioned" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/vendor-rule-deltas/${d1_id}/disposition
              payload: { disposition: "SUPPRESS", suppression_justification: "Duplicate of an existing local rule already surfaced at order entry" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/vendor-releases/${vr_id}/activate
              payload: { activation_note: "Third attempt, justification supplied" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "${score} == 27 (three deltas at DELTA_WEIGHTS[SEVERITY_INCREASED] 5 plus HIGH_SEVERITY_BONUS 4 each) and ${branch} == IMPACT_ANALYZED_CLINICAL_REVIEW"
            - "the first activate returns HTTP 409 with error_id ERR_DELTA_DISPOSITION_INCOMPLETE, not ERR_SUPPRESSION_JUSTIFICATION_REQUIRED, even though the unjustified SUPPRESS delta already exists"
            - "the second activate returns HTTP 422 with error_id ERR_SUPPRESSION_JUSTIFICATION_REQUIRED once dispositioned_delta_count == delta_count == 3"
            - "the third activate returns HTTP 200 with review_cycle_state == ACTIVATED and activated_at == \"2026-08-01T00:00:00Z\""
            - "VendorContentRelease.restaged_order_set_count == 0 because supersedes_release_id is null"

