          - errors.ERR_AMENITY_NOT_FOUND
          - errors.ERR_ALLOCATION_NOT_FOUND
          - errors.ERR_COMMISSIONING_RECORD_NOT_FOUND
        distinguishing_aspect: "Each of the eight remaining scalar reads answers an unknown id with its own entity-scoped 404 code rather than one shared generic 404 code, so the catalog's 404 family is fully discriminated."
