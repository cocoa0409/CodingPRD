  - rule_id: transitive_cascade
    instances:
      - name: cascade_incapable_run_freezes_line_blocks_run_and_supersedes_recipe
        grounds:
          - state_machines.ExtrusionRun.RUNNING_to_COMPLETED
          - calculations.gauge_capability
          - calculations.line_posture
          - state_machines.ExtrusionLine.posture.RESTRICTED_to_FROZEN
          - state_machines.ExtrusionRun.SCHEDULED_to_BLOCKED
          - state_machines.FilmRoll.WOUND_to_QUARANTINED
          - state_machines.BlendRecipe.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          One POST /extrusion-runs/{id}/complete propagates six hops with no intermediate API call:
          Cpk 0.703 -> INCAPABLE (1) -> line.incapable_run_count 2 (2) -> line.posture FROZEN (3)
          -> the SCHEDULED RUN-NF-C is BLOCKED and both WOUND rolls are QUARANTINED (4) ->
          the blocked run releases its recipe pin so R-NF-0.pinned_run_count falls to 0 (5) ->
          the deferred supersede fires and R-NF-0 becomes SUPERSEDED (6).
        test_recipe:
          setup:
            - "non-food product P-NF-1 on line L-NF (purge_buffer_minutes 45) with APPROVED recipe R-NF-0"
            - "RUN-NF-A already COMPLETED with gauge readings 37/43/40/40/40 -> Cpk 0.703 INCAPABLE, leaving incapable_run_count 1 and posture RESTRICTED"
            - "roll 1 (100.0 kg) WOUND on RUN-NF-A and roll 2 (100.0 kg) WOUND on RUN-NF-B"
            - "RUN-NF-C SCHEDULED for 2026-08-06T06:00:00Z-14:00:00Z on the same line and the same recipe"
            - "RUN-NF-B RUNNING at logical clock 2026-08-05T15:00:00Z with the same five gauge readings appended"
            - "successor recipe R-NF-0B APPROVED while R-NF-0.pinned_run_count is 2, so R-NF-0.supersede_pending is true"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - &a_runA_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-A", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runA: "$.data.id" } }
            - &a_runA_start { call: "POST /extrusion-runs/${runA}/start", payload: {}, as: ExtrusionOperator }
            - &a_gA_37 { call: "POST /extrusion-runs/${runA}/gauge-readings", payload: { thickness_micron: 37.0 }, as: ExtrusionOperator }
            - &a_gA_43 { call: "POST /extrusion-runs/${runA}/gauge-readings", payload: { thickness_micron: 43.0 }, as: ExtrusionOperator }
            - &a_gA_40 { call: "POST /extrusion-runs/${runA}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_gA_40
            - *a_gA_40
            - &a_roll_a { call: "POST /film-rolls", payload: { extrusion_run_id: "${runA}", roll_number: 1, net_kg: 100.0 }, as: ExtrusionOperator, captures: { roll_a: "$.data.id" } }
            - &a_runA_comp { call: "POST /extrusion-runs/${runA}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
            - *a_clock_d1_1500
            - &a_runC_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-C", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-06T06:00:00Z", scheduled_end: "2026-08-06T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runC: "$.data.id" } }
            - &a_runB_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-B", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T15:00:00Z", scheduled_end: "2026-08-05T20:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runB: "$.data.id" } }
            - &a_runB_start { call: "POST /extrusion-runs/${runB}/start", payload: {}, as: ExtrusionOperator }
            - &a_gB_37 { call: "POST /extrusion-runs/${runB}/gauge-readings", payload: { thickness_micron: 37.0 }, as: ExtrusionOperator }
            - &a_gB_43 { call: "POST /extrusion-runs/${runB}/gauge-readings", payload: { thickness_micron: 43.0 }, as: ExtrusionOperator }
            - &a_gB_40 { call: "POST /extrusion-runs/${runB}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_gB_40
            - *a_gB_40
            - &a_roll_b { call: "POST /film-rolls", payload: { extrusion_run_id: "${runB}", roll_number: 2, net_kg: 100.0 }, as: ExtrusionOperator, captures: { roll_b: "$.data.id" } }
            - &a_r0b_new { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-0B", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1, supersedes_recipe_id: "${r0}" }, as: BlendEngineer, captures: { r0b: "$.data.id" } }
            - &a_r0b_c1 { call: "POST /blend-recipes/${r0b}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 100.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r0b_sub { call: "POST /blend-recipes/${r0b}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-2" }
            - &a_r0b_app { call: "POST /blend-recipes/${r0b}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-2" }
          trigger:
            - { call: "POST /extrusion-runs/${runB}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
          assert:
            - "hop 1: ExtrusionRun.${runB}.gauge_capability_index == 0.703 and gauge_capability_state == INCAPABLE"
            - "hop 1: ExtrusionRun.${runB}.gauge_mean_micron == 40.000, gauge_sd_micron == 1.8974, gauge_cv_pct == 4.743"
            - "hop 2: ExtrusionLine.${line_nf}.incapable_run_count == 2"
            - "hop 3: ExtrusionLine.${line_nf}.posture == FROZEN"
            - "hop 4: ExtrusionRun.${runC}.status == BLOCKED"
            - "hop 4: FilmRoll.${roll_a}.status == QUARANTINED and release_blocked_reason is non-null"
            - "hop 4: FilmRoll.${roll_b}.status == QUARANTINED"
            - "hop 5: BlendRecipe.${r0}.pinned_run_count == 0"
            - "hop 6: BlendRecipe.${r0}.status == SUPERSEDED and supersede_pending == false"
            - "BlendRecipe.${r0b}.status == APPROVED and BlendRecipe.${r0b}.pinned_run_count == 0"
            - "ExtrusionRun.${runB}.status == COMPLETED, net_good_kg == 400.000, actual_recycled_content_pct == 0.000"
            - "RegrindPool.${pool_nf}.cumulative_in_kg == 200.000, available_kg == 200.000, generation_count == 2, embedded_pcr_pct == 0.000"
            - "POST /film-rolls/${roll_b}/release -> 409 ERR_LINE_POSTURE_FROZEN is not reachable because the roll is already QUARANTINED; GET /film-rolls?extrusion_run_id=${runB} shows status QUARANTINED"
      - name: cascade_dossier_revocation_quarantines_lot_wears_plate_and_freezes_line
        grounds:
          - state_machines.ComplianceDossier.ISSUED_to_REVOKED
          - state_machines.BagLot.PACKED_to_QUARANTINED
          - state_machines.PlateSet.MOUNTED_to_WORN
          - state_machines.PrintJob.SETUP_to_BLOCKED
          - state_machines.ExtrusionLine.posture.OPEN_to_FROZEN
          - calculations.line_posture
        distinguishing_aspect: |
          A different cascade root -- a compliance action rather than a production measurement --
          walks a different entity chain five hops deep: dossier REVOKED (1) -> BagLot QUARANTINED
          with the packout unwound (2) -> PlateSet.nonconformance_count 1 (3) -> that plate WORN and
          its SETUP job PJ-2 BLOCKED with the cylinder window released (4) ->
          line.revoked_dossier_count 1 -> posture FROZEN, blocking RUN-FD-2 and quarantining the
          WOUND roll 3 (5).
        test_recipe:
          setup:
            - "food-contact lot BL-1 PACKED (22500 of 46000 bags, 45 cases, 2 pallets) with dossier CD-1 ISSUED and CONFORMING"
            - "plate PL-1 MOUNTED on PR-1 with impressions_count 576 (wear_limit_impressions default 500000)"
            - "print job PJ-2 in SETUP on PR-1 against roll 2, reserving 4 of the press's 8 cylinders"
            - "RUN-FD-2 SCHEDULED on L-FD for 2026-08-06T06:00:00Z-14:00:00Z and roll 3 (50.0 kg) still WOUND"
            - "PLATE_NONCONFORMANCE_LIMIT is 1 and POSTURE_FROZEN_MIN_REVOKED is 1"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
