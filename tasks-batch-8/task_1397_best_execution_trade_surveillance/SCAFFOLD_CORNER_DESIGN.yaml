        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[arrangement-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential amends carrying the same observed version: the first succeeds (version 2 -> 3), the second observes version 3 != 2 and is rejected 412 — no parallelism involved."
        test_recipe:
          setup: ["Venue + arrangement ACTIVE (version 2 after activation)"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { a_v: "$.data.version" } }
          trigger:
            - { call: "POST /surveillance/routing-arrangements/${a_id}/amend", payload: { expected_arrangement_version: "${a_v}", routing_fee_bps: 5 }, as: ComplianceAdmin, captures: { a_v2: "$.data.version" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/amend", payload: { expected_arrangement_version: "${a_v}", routing_fee_bps: 7 }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "First amend succeeds and increments: ${a_v2} == 3"
            - "Second amend with the stale observed version: ${err} == ERR_STALE_VERSION (412)"
      - name: occ_disclosure_revise_chain_and_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disclosure-revise-stale-version]", "state_machines.PfofDisclosure"]
        distinguishing_aspect: "Revise is OCC-guarded and bumps the SOURCE disclosure's version: the revision chain PUBLISHED -> (revise) new DRAFT with revision_number 2 and supersedes_id set; a second revise with the same observed version fails 412; publishing the revision supersedes the source."
        test_recipe:
          setup: ["PUBLISHED disclosure for 2026-Q3 (no executed orders — empty lines); version captured at publish"]
          setup_api_calls:
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d1: "$.data.id" } }
            - { call: "POST /surveillance/pfof-disclosures/${d1}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer }
            - { call: "POST /surveillance/pfof-disclosures/${d1}/transition", payload: { to_status: "PUBLISHED" }, as: FilingOfficer, captures: { d_v: "$.data.version" } }
          trigger:
            - { call: "POST /surveillance/pfof-disclosures/${d1}/revise", payload: { expected_disclosure_version: "${d_v}" }, as: FilingOfficer, captures: { d2: "$.data.id", d2_rev: "$.data.revision_number", d2_sup: "$.data.supersedes_id" } }
            - { call: "POST /surveillance/pfof-disclosures/${d1}/revise", payload: { expected_disclosure_version: "${d_v}" }, as: FilingOfficer, captures: { err: "$.data.error_id" } }
            - { call: "GET /surveillance/pfof-disclosures/${d1}", payload: {}, as: FilingOfficer, captures: { d1_pending: "$.data.has_pending_revision", d1_v: "$.data.version" } }
            - { call: "POST /surveillance/pfof-disclosures/${d2}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer }
            - { call: "POST /surveillance/pfof-disclosures/${d2}/transition", payload: { to_status: "PUBLISHED" }, as: FilingOfficer }
            - { call: "GET /surveillance/pfof-disclosures/${d1}", payload: {}, as: FilingOfficer, captures: { d1_final: "$.data.status" } }
          assert:
            - "Revision created: ${d2_rev} == 2 and ${d2_sup} == ${d1}"
            - "Source bumped: ${d1_pending} == true and ${d1_v} == ${d_v} + 1 (revise increments the source version)"
            - "Stale revise: ${err} == ERR_STALE_VERSION (412)"
            - "Publishing the revision supersedes the source: ${d1_final} == SUPERSEDED"
      - name: occ_lexicon_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lexicon-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Lexicon retunes serialize on LexiconPolicy.version: activation bumped the policy to v2; a retune carrying v2 succeeds (-> v3); a second retune still carrying v2 fails 412."
        test_recipe:
          setup: ["ACTIVE LexiconPolicy at version 2"]
          setup_api_calls:
            - { call: "POST /surveillance/lexicon-policies", payload: { name: "LX", terms: [ { term: "guarantee", weight: 60 } ] }, as: ComplianceAdmin, captures: { l_id: "$.data.id", l_v1: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v1}", to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { l_v2: "$.data.version" } }
          trigger:
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v2}", terms: [ { term: "guarantee", weight: 70 } ] }, as: ComplianceAdmin, captures: { l_v3: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v2}", terms: [ { term: "guarantee", weight: 80 } ] }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "First retune: ${l_v3} == 3"
            - "Stale retune: ${err} == ERR_STALE_VERSION (412)"
      - name: provisional_snapshot_reconciles_locked_snapshot_frozen
