                window_start: "2026-08-03T00:00:00Z"
                window_end: "2026-08-07T00:00:00Z"
              as: TestCoordinator
              captures: { order_b_id: "$.data.id" }
          trigger:
            - "Third overlapper: POST /compliance/test-orders with window 2026-08-04T00:00:00Z..2026-08-05T00:00:00Z on the same laboratory, as TestCoordinator."
            - "Adjacent window: POST /compliance/test-orders with window 2026-08-06T00:00:00Z..2026-08-08T00:00:00Z, as TestCoordinator."
            - "Free a slot then retry: POST /compliance/test-orders/${order_b_id}/cancel as TestCoordinator, then re-post the 2026-08-04..2026-08-05 order."
          assert:
            - "Orders A [08-02, 08-06) and B [08-03, 08-07) both create successfully with HTTP 201 — overlap alone is not a conflict, because concurrent_slot_capacity is 2 and peak_concurrency reaches exactly 2."
            - "The 2026-08-04..2026-08-05 order returns HTTP 409 with error_id == \"ERR_LAB_SLOT_CAPACITY_EXCEEDED\": at breakpoint 2026-08-04 the candidate contributes 1 and both A and B are live, so peak_concurrency is 3 > 2."
            - "The 2026-08-06..2026-08-08 order returns HTTP 201. Order A ends exactly at 2026-08-06 and, under half-open semantics, does not count at that instant, so peak_concurrency is 2 (the candidate plus B) and not 3."
            - "After cancelling B, the identical 2026-08-04..2026-08-05 request now returns HTTP 201: with B excluded from the input set, peak_concurrency is 2 (the candidate plus A)."
            - "SamplingPlan.units_authorized == 6 throughout; after the three successful creations and the one cancellation, units_committed == 3 and units_available == 3, so the rejected attempt committed nothing."
            - "Laboratory.billed_fee_cents_total == 74800 and credited_fee_cents_total == 18700 at the end: four successful single-sample orders at 18700 each were billed and the cancelled one was credited back."

      - name: temporal_overlap_component_coverage_closed_buffered_exclusive_capacity_one_per_part_rule_pair
        grounds:
          - calculations.component_certificate_coverage_overlap_check
          - validations[priority=29]
          - errors.ERR_COMPONENT_COVERAGE_OVERLAP
          - entities.ComponentPartCertificate.fields.coverage_through
        distinguishing_aspect: "A different resource entity — the (ComponentPart, ApplicableRule) coverage slot rather than a Laboratory bench — governed by the opposite interval semantics: CLOSED on both endpoints, widened by a mandatory 7-day quarantine buffer, with capacity of exactly ONE and adjacency FORBIDDEN. Where the laboratory rule tolerates overlap up to an aggregate ceiling, here a single overlap of any width is fatal, and even a non-overlapping interval that merely touches or sits within the buffer is fatal. Scope is also narrower: the exclusion window is keyed on the part-and-rule pair, so a sibling part of the same product may hold the identical interval, and a REJECTED certificate releases its interval."
