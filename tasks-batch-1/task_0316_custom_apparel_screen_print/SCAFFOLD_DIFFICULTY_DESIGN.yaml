              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: ShopManager
            - call: "POST /presses"
              payload: { shop_id: "${shop_id}", name: "P1", teardown_buffer_min: 30 }
              as: ShopManager
              captures: { press_id: $.data.id }
            - call: "POST /orders/${order_id}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T10:00:00.000Z", window_end: "2026-06-02T12:00:00.000Z" }
              as: ShopManager
          trigger:
            - call: "POST /orders/${order_id}/production-runs"
              payload: { press_id: "${press_id}", window_start: "2026-06-02T12:15:00.000Z", window_end: "2026-06-02T13:00:00.000Z" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PRESS_WINDOW_CONFLICT (15-min gap < 30-min teardown buffer)"

      - name: embroidery_station_halfopen_oversubscribe
        grounds:
          - validations[priority=12]
          - entities.EmbroideryStation.fields.head_count
          - errors[ERR_STATION_OVERSUBSCRIBED]
          - entities.ProductionRun.fields.window_end
        distinguishing_aspect: "EmbroideryStation uses different interval semantics: half-open [start,end) with head_count concurrency and gap=0 adjacency allowed. With head_count 1, run A [10:00,12:00) and run B [11:00,13:00) truly overlap so B is rejected; a touching run [12:00,13:00) (gap=0) would be accepted — distinct geometry from the press buffer rule and on a different resource entity."
        test_recipe:
          setup:
            - "Embroidery order CONFIRMED (line {L:30} stitch 8500); EmbroideryStation S head_count 1; run A scheduled [10:00,12:00)."
