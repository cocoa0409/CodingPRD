# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header is missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "districtId does not exist" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "schoolId does not exist (within district)" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "studentId does not exist (within school)" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "windowId does not exist (within school)" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId does not exist (within student)" }
  - { id: ERR_MOVEMENT_NOT_FOUND, http: 404, condition: "movementId does not exist" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "meetingId does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referralId does not exist" }
  - { id: ERR_CATALOG_NOT_FOUND, http: 404, condition: "catalog_entry_id does not exist (within district)" }
  - { id: ERR_INTERVENTIONIST_NOT_FOUND, http: 404, condition: "interventionist_id does not exist (within school)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (window not CLOSED for scoring, plan not ACTIVE for probes, meeting not CONVENED for ratify, etc.)" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "ScreeningScore creation requires window.status == OPEN and current date within [opens_on, closes_on]" }
  - { id: ERR_CUT_POINT_NOT_DEFINED, http: 422, condition: "No BenchmarkCutPoint matches (school, window_kind, grade_level, subject)" }
  - { id: ERR_INVALID_CUT_POINT, http: 400, condition: "tier3_max_score must be strictly less than tier2_max_score" }
  - { id: ERR_CATALOG_MISMATCH, http: 422, condition: "Catalog entry inactive, subject not in interventionist.subjects, grade out of range, or tier_target != student.current_tier" }
  - { id: ERR_TIER_MOVE_NOT_INDICATED, http: 422, condition: "Proposed movement lacks screening evidence or plan-outcome evidence" }
  - { id: ERR_TIER_SKIP_NOT_ALLOWED, http: 422, condition: "Movement from TIER_3 to TIER_1 must step through TIER_2" }
  - { id: ERR_INVALID_TIER_MOVE, http: 422, condition: "to_tier equals from_tier, or movement is otherwise incoherent" }
  - { id: ERR_SPED_REFERRAL_PRECONDITION, http: 422, condition: "Student not at TIER_3, weeks_at_tier3_unresponsive < district minimum, or another open referral exists" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Plan's weekly_minute_cost would push interventionist over weekly_minute_capacity" }
  - { id: ERR_PROBE_NOT_DUE, http: 422, condition: "Probe attempted before plan.probe_due_on or while plan not ACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or enum value out of range" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; creates districts/schools and operates the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /districts"
      - "POST /districts/{d}/schools"
      - "POST /_clock/set_current_utc"

  - name: DistrictCoordinator
    description: "District-level MTSS coordinator; owns screening windows, cut points, catalog"
    identity: opaque
    exclusive_operations:
      - "POST /districts/{d}/schools/{s}/screening-windows"
      - "POST /districts/{d}/schools/{s}/screening-windows/{w}/close"
      - "POST /districts/{d}/schools/{s}/screening-windows/{w}/score"
      - "POST /districts/{d}/schools/{s}/benchmark-cut-points"
      - "POST /districts/{d}/intervention-catalog"
    shared_operations:
      - "POST /districts/{d}/schools/{s}/students (with SchoolRegistrar)"
      - "POST /districts/{d}/schools/{s}/screening-windows/{w}/scores (with Teacher)"
      - "POST /districts/{d}/schools/{s}/interventionists (with SchoolRegistrar)"
      - "POST /districts/{d}/schools/{s}/students/{st}/plans (with TeamLead)"
      - "POST /districts/{d}/schools/{s}/students/{st}/tier-movements (with Teacher, TeamLead)"

  - name: SchoolRegistrar
    description: "School-level enrollment/staff administrator"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /districts/{d}/schools/{s}/students"
      - "POST /districts/{d}/schools/{s}/interventionists"

  - name: Teacher
    description: "Classroom teacher; administers screeners and proposes movements"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /districts/{d}/schools/{s}/screening-windows/{w}/scores"
      - "POST /districts/{d}/schools/{s}/students/{st}/tier-movements"
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/probes (with InterventionistRole)"

  - name: InterventionistRole
    description: "Delivers interventions; logs probes and sessions; may pause/resume plans"
    identity: entity_backed:Interventionist
    exclusive_operations:
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/sessions"
    shared_operations:
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/pause (with TeamLead)"
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/resume (with TeamLead)"
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/probes (with Teacher)"

  - name: TeamLead
    description: "MTSS team chair; convenes meetings, ratifies movements, exits plans"
    identity: opaque
    exclusive_operations:
      - "POST /districts/{d}/schools/{s}/team-meetings"
      - "POST /districts/{d}/schools/{s}/team-meetings/{m}/convene"
      - "POST /districts/{d}/schools/{s}/team-meetings/{m}/ratify"
      - "POST /districts/{d}/schools/{s}/team-meetings/{m}/reject"
      - "POST /districts/{d}/schools/{s}/team-meetings/{m}/minute"
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/exit"
      - "POST /districts/{d}/schools/{s}/students/{st}/plans/{p}/cancel"
    shared_operations:
      - "POST /districts/{d}/schools/{s}/students/{st}/plans"
      - "POST /districts/{d}/schools/{s}/students/{st}/tier-movements"
      - "POST /districts/{d}/schools/{s}/students/{st}/sped-referrals (with SpEdDirector)"

  - name: SpEdDirector
    description: "Special education director; drives referral lifecycle after consent"
    identity: opaque
    exclusive_operations:
      - "POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/record-consent"
      - "POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/start-evaluation"
      - "POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/determine"
      - "POST /districts/{d}/schools/{s}/students/{st}/sped-referrals/{r}/withdraw"
    shared_operations:
      - "POST /districts/{d}/schools/{s}/students/{st}/sped-referrals"

  - name: Any
    description: "Marker role indicating read-only endpoints accept any authenticated role"
    identity: opaque
    shared_operations:
      - "GET /districts/{d}, GET /districts/{d}/schools/{s}, and all other GET endpoints" 
