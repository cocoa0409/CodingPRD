            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
            - *k_batch_a
            - *k_batch_b
            - *k_statement
          trigger:
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
              captures: { err_fin: $.data.error_id }
            - call: "POST /api/collection-batches/${batch_a}/settle"
              payload: { denial_amount_cents: 0 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
              captures: { err_fin2: $.data.error_id }
            - call: "POST /api/collection-batches/${batch_b}/settle"
              payload: { denial_amount_cents: 0 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "err_fin == ERR_UNSETTLED_BATCHES_EXIST and err_fin2 == ERR_UNSETTLED_BATCHES_EXIST — one POSTED batch is enough to block"
            - "After both batches settled: finalize succeeds, status FINAL_ISSUED"
            - "gross_collections_cents == 45000000 (30,000,000 + 15,000,000), fee == 3150000, net == 41850000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: wave_windows_half_open_shared_boundary_allowed_one_day_earlier_rejected
        grounds:
          - validations[priority=9]
          - errors.ERR_WAVE_WINDOW_OVERLAP
          - entities.ImplementationWave.fields.cutover_end_date
        distinguishing_aspect: |
          Resource ImplementationWave, half-open [start, end) semantics: a wave
          starting exactly at the existing wave's end date does NOT overlap;
          starting one day earlier does. Adjacency is free, intersection is not.
        test_recipe:
          setup:
            - "Group OPERATING; market; wave W1 occupies [2026-08-01, 2026-12-31)."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
          trigger:
            - call: "POST /api/implementation-waves"
              payload: { market_id: "${mkt_id}", wave_code: "W2-ADJ", cutover_start_date: "2026-12-31", cutover_end_date: "2027-03-31" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { wave2_id: $.data.id }
            - call: "POST /api/implementation-waves"
              payload: { market_id: "${mkt_id}", wave_code: "W3-OVER", cutover_start_date: "2026-12-30", cutover_end_date: "2027-03-31" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { err_ov: $.data.error_id }
          assert:
            - "W2 created with 201 — start == W1's end shares only the boundary instant, which the half-open window does not occupy"
            - "err_ov == ERR_WAVE_WINDOW_OVERLAP with http 409 — 2026-12-30 lies inside [2026-08-01, 2026-12-31) and inside [2026-12-31, 2027-03-31) is irrelevant; overlap with W1 suffices"
            - "GET /api/implementation-waves?market_id=${mkt_id} returns exactly 2 rows"

      - name: enrollment_windows_closed_interval_termination_day_occupied_next_day_free
        grounds:
          - validations[priority=9]
          - errors.ERR_ENROLLMENT_WINDOW_OVERLAP
          - calculations.credentialing_effective_date
        distinguishing_aspect: |
          Resource CredentialingEnrollment, CLOSED-interval semantics — different
          geometry than the wave's half-open windows. An existing window
          [2026-11-30, 2027-02-28] blocks a new enrollment whose computed
          effective_date is 2027-02-28 itself (termination day still occupied),
          while an effective_date of 2027-03-03 is free.
        test_recipe:
          setup:
            - "Base affiliated setup with EFFECTIVE enrollment E1 (STANDARD, effective 2026-11-30). E1 manually terminated with termination_date 2027-02-28. Clock then moved to 2026-12-03. New enrollment E2 STANDARD (application 2026-12-03 + 90d = 2027-03-03) is free; E3 EXPEDITED (application 2026-12-03 + 30d = 2027-01-02) collides with the closed window."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
            - call: "POST /api/credentialing-enrollments/${enr_id}/terminate"
              payload: { termination_date: "2027-02-28" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-03T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov_id}", payer_contract_id: "${pc_id}", channel: "STANDARD", requested_effective_date: "2027-03-03" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr2_id: $.data.id }
            - call: "POST /api/credentialing-enrollments/${enr2_id}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
            - call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov_id}", payer_contract_id: "${pc_id}", channel: "EXPEDITED", requested_effective_date: "2027-01-15" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr3_id: $.data.id }
            - call: "POST /api/credentialing-enrollments/${enr3_id}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { err_enr3: $.data.error_id }
          assert:
            - "E2 approves to EFFECTIVE with effective_date == \"2027-03-03\" — the day after the closed window's termination date is free"
            - "err_enr3 == ERR_ENROLLMENT_WINDOW_OVERLAP with http 409 — computed effective 2027-01-02 falls inside the closed interval [2026-11-30, 2027-02-28]; a wave-style half-open reading would not help either, because the window occupies its termination day"
            - "CredentialingEnrollment.${enr3_id}.status remains SUBMITTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: batch_adjustment_plus_statement_amend_reissue_conserves_period_dollars
        grounds:
          - state_machines.CollectionBatch.SETTLED_to_ADJUSTED
          - state_machines.DistributionStatement.FINAL_ISSUED_to_AMENDED
          - state_machines.DistributionStatement.AMENDED_to_REISSUED
          - calculations.practice_distribution_net
        distinguishing_aspect: |
          Conserved quantity: period collection dollars. Forward action (batch
          recoupment -2,000,000) plus compensating actions (statement amend +
          reissue) must leave gross == fee + net and net == gross - fee exactly,
          with the amended figures reflecting the adjustment: gross 27,000,000,
          fee 1,890,000, net 25,110,000 — no cent created or destroyed.
        test_recipe:
          setup:
            - "Base affiliated setup; one batch posted 30,000,000, settled with denials 1,000,000 (net settled 29,000,000); statement finalized (fee 2,030,000, net 26,970,000)."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - *k_wave_complete
            - *k_batch_a
            - *k_batch_a_settle
            - *k_statement
            - call: "POST /api/distribution-statements/${stmt_id}/finalize"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
              captures: { stmt_v: $.data.version }
          trigger:
            - call: "POST /api/collection-batches/${batch_a}/adjust"
              payload: { adjustment_cents: -2000000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
            - call: "POST /api/distribution-statements/${stmt_id}/amend"
              payload: { expected_statement_version: "${stmt_v}" }
              as: GroupFinancialController
              as_user_id: "gfc-lena"
            - call: "POST /api/distribution-statements/${stmt_id}/reissue"
              payload: {}
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "CollectionBatch.${batch_a}.status == ADJUSTED, adjustment_total_cents == -2000000, net_settled_cents == 27000000"
            - "After amend: gross_collections_cents == 27000000, shared_services_fee_cents == 1890000, net_distribution_cents == 25110000"
            - "Invariant holds at every step: gross_collections_cents == shared_services_fee_cents + net_distribution_cents (both pre-adjustment: 29,000,000 == 2,030,000 + 26,970,000; post-adjustment: 27,000,000 == 1,890,000 + 25,110,000)"
            - "Statement status REISSUED and version == stmt_v + 1 after amend"
            - "payable_total_cents == 25110000 and payout_cents == 25110000 (well above hold threshold), carried_forward_out_cents == 0"

      - name: affiliate_then_depart_conserves_provider_headcount
        grounds:
          - state_machines.Provider.ROSTERED_to_ACTIVE
          - state_machines.Provider.ACTIVE_to_DEACTIVATED
          - state_machines.Practice.DEPARTING_to_DEPARTED
          - entities.Practice.fields.active_provider_count
        distinguishing_aspect: |
          Conserved quantity: provider headcount (a count, not money — a
          different conserved-quantity type than period dollars). Affiliation
          activates exactly the rostered providers (0 -> 2); departure
          deactivates exactly the same set (2 -> 0). The forward+compensating
          pair leaves active_provider_count back at its pre-affiliation value.
        test_recipe:
          setup:
            - "Base affiliated setup with TWO providers, both with EFFECTIVE enrollments (P1 physician, P2 an APP). Clock 2027-06-01; departure case at SETTLEMENT_PENDING with requested_exit_date 2027-12-01; clock 2027-12-01."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - *k_provider
            - *k_contract
            - *k_rate
            - *k_vote
            - *k_vote_cast
            - *k_contract_act
            - *k_enrollment
            - *k_enroll_approve
            - call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "7778889990", full_name: "Nina Park, PA", specialty: "Family Medicine", provider_role: "APP", employment_start_date: "2026-03-01" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov2b_id: $.data.id }
            - call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov2b_id}", payer_contract_id: "${pc_id}", channel: "STANDARD", requested_effective_date: "2026-12-01" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr2b_id: $.data.id }
            - call: "POST /api/credentialing-enrollments/${enr2b_id}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
            - *k_wave_complete
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/departure-cases"
              payload: { practice_id: "${prac_id}", requested_exit_date: "2027-12-01" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { dc_id: $.data.id }
            - call: "POST /api/departure-cases/${dc_id}/complete-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/departure-cases/${dc_id}/settle"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          assert:
            - "Before departure: Practice.${prac_id}.active_provider_count == 2 (both providers activated by their EFFECTIVE enrollments at wave completion)"
            - "After settle: Practice.${prac_id}.active_provider_count == 0 — exactly the pre-affiliation value; the forward (activation) and compensating (deactivation) cascades touch the same set"
            - "Provider.${prov_id}.status == DEACTIVATED and Provider.${prov2b_id}.status == DEACTIVATED"
            - "Both enrollments TERMINATED with termination_date == \"2027-12-01\""
            - "GET /api/providers?practice_id=${prac_id}&status=ACTIVE returns 0 rows"
