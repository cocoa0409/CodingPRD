          and the state error must win with HTTP 409, not the 422 fiscal error.
        test_recipe:
          setup:
            - "One IN_NETWORK policy with frame_allowance_cents 15000, shared by customers A and B."
            - "Customer B builds an order while the allowance is untouched, so B's order freezes benefit_frame_cents 15000."
            - "Customer A then confirms their own order, draining frame_allowance_remaining_cents to 0."
