# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# (Task 1927). Breadth probe: every testable claim of §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections and claim_type values
# follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: account_create_applies_defaults
        claim_type: creation
        grounds: ["entities.Account.fields.status"]
        distinguishing_aspect: "Create returns 201 with all input fields echoed plus system defaults status == ACTIVE and version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "Account.${a1}: status == ACTIVE (default), version == 1, account_code == A1, custodian_name == CUSTO, id is a prefix-less UUID"

      - name: order_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "entities.Order.fields.side"]
        distinguishing_aspect: "Omitting required field side on order create yields 400 ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["Account A1 ACTIVE; security ACTIVE"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", order_qty: 100, order_type: MARKET }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST; GET /trading/orders?account_id=${a1} total_count == 0"]

      - name: order_create_limit_missing_price_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "entities.Order.fields.limit_price_cents"]
        distinguishing_aspect: "LIMIT order without limit_price_cents violates the conditional requirement -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Account A1 ACTIVE; security ACTIVE"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: LIMIT }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST"]

      - name: order_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Order.fields.allocated_qty", "validations[priority=3]"]
        distinguishing_aspect: "Client-supplied computed field allocated_qty is ignored, not rejected: create succeeds and allocated_qty == 0."
        test_recipe:
          setup: ["Account A1 ACTIVE; security ACTIVE"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET, allocated_qty: 999 }, as: Trader, captures: { aq: $.data.allocated_qty, st: $.data.status } }
          assert: ["Order created: status == PENDING_COMPLIANCE, allocated_qty == 0 (input 999 ignored)"]

      - name: order_lot_size_type_constraint_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=9]", "entities.Security.fields.lot_size"]
        distinguishing_aspect: "order_qty 7 against lot_size 2 violates the multiple-of-lot constraint -> ERR_LOT_SIZE_VIOLATION (422)."
        test_recipe:
          setup: ["Account A1 ACTIVE; security lot_size 2"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 2, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 7, order_type: MARKET }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_LOT_SIZE_VIOLATION; no order persisted"]

      - name: fill_immutable_event_shape
        claim_type: immutability
        grounds: ["entities.Fill"]
        distinguishing_aspect: "Fill is append-only (common_fields false): response carries id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["Full chain to a WORKING block with one approved order 100"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
          trigger:
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 40, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk, captures: { fseq: $.data.fill_seq, fg: $.data.gross_amount_cents } }
          assert:
            - "Fill created with fill_seq == 1, gross_amount_cents == 40000, id and created_at present, and NO version/updated_at keys"

      - name: order_create_body_fk_integrity_rejected
        claim_type: parent_relationships
        grounds: ["entities.Order.fields.account_id", "validations[priority=4]"]
        distinguishing_aspect: "Body-referenced account_id that does not exist yields ERR_ACCOUNT_NOT_FOUND (404) even though the path has no ids."
        test_recipe:
          setup: ["Security ACTIVE"]
          setup_api_calls:
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "00000000-0000-4000-8000-000000000000", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ACCOUNT_NOT_FOUND"]

  - section: state_machines
    instances:
      - name: block_initial_state
        claim_type: initial_state
        grounds: ["state_machines.BlockOrder"]
        distinguishing_aspect: "New block starts OPEN with parallel allocation dimension UNALLOCATED, total_qty 0, allocated_through_seq 0, version 1."
        test_recipe:
          setup: ["Security ACTIVE"]
          setup_api_calls:
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { st: $.data.status, dim: $.data.allocation_status, tq: $.data.total_qty, sq: $.data.allocated_through_seq, v: $.data.version } }
          assert: ["status == OPEN, allocation_status == UNALLOCATED, total_qty == 0, allocated_through_seq == 0, version == 1"]

      - name: order_cancel_from_allocated_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Order"]
        distinguishing_aspect: "ALLOCATED is outside the cancellable from-state set; cancel yields ERR_INVALID_STATE and the order is unchanged."
        test_recipe:
          setup:
            - "Account A1 budget 100000; order 100 approved, blocked, routed, filled 100@1000; plan proposed/approved/posted -> order ALLOCATED"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
          trigger:
            - { call: "POST /trading/orders/${o1}/cancel", as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE; Order.${o1}.status remains ALLOCATED"]

      - name: instruction_settle_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.SettlementInstruction"]
        distinguishing_aspect: "SETTLED is terminal: a second settle on the settled instruction yields ERR_INVALID_STATE; allocation and order remain SETTLED."
        test_recipe:
          setup: ["Posted plan (order 100@1000); instruction instructed and settled once"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: SettlementOps, captures: { al: "$.data[0].id" } }
            - { call: "GET /trading/settlement-instructions?allocation_id=${al}", as: SettlementOps, captures: { si: "$.data[0].id" } }
            - { call: "POST /trading/settlement-instructions/${si}/instruct", as: SettlementOps }
            - { call: "POST /trading/settlement-instructions/${si}/settle", as: SettlementOps, captures: { st1: $.data.instruction_status } }
          trigger:
            - { call: "POST /trading/settlement-instructions/${si}/settle", as: SettlementOps, captures: { err: $.data.error_id } }
            - { call: "GET /trading/orders/${o1}", as: SettlementOps, captures: { ost: $.data.status } }
          assert:
            - "First settle: instruction_status == SETTLED; order bubble-up: Order.${o1}.status == SETTLED"
            - "Second settle: error_id == ERR_INVALID_STATE (terminal lockdown)"

      - name: restriction_retire_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Restriction"]
        distinguishing_aspect: "RETIRED is terminal: activating a retired restriction yields ERR_INVALID_STATE."
        test_recipe:
          setup: ["Security; DRAFT restriction retired"]
          setup_api_calls:
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/restrictions", payload: { security_id: "${sec}", rule_type: PROHIBITED, side: BUY, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: ComplianceOfficer, captures: { r1: $.data.id } }
            - { call: "POST /trading/restrictions/${r1}/retire", as: ComplianceOfficer, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /trading/restrictions/${r1}/activate", as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert: ["After retire: status == RETIRED; activate attempt: error_id == ERR_INVALID_STATE"]

      - name: block_parallel_dimensions_independent
        claim_type: valid_transition
        grounds: ["state_machines.BlockOrder"]
        distinguishing_aspect: "Parallel dimensions evolve independently on one row: with 300 of 400 filled, posting full coverage gives status PARTIALLY_FILLED with allocation_status FULL; the next fill flips allocation_status FULL -> PARTIAL while execution status advances to FILLED."
        test_recipe:
          setup:
            - "Accounts A1, A2 budgets 100000; orders 100 (A1) + 300 (A2); block routed; fill 300@1000 -> PARTIALLY_FILLED"
            - "Plan PRO_RATA over batch 300 (lines 75/225 @1000, commissions 375/1125) proposed/approved/posted -> allocated_through_seq 1 == max fill_seq"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/accounts/${a2}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 300, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 300, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { st1: $.data.status, dim1: $.data.allocation_status } }
          trigger:
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1100, executed_at: "2026-08-01T09:05:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { st2: $.data.status, dim2: $.data.allocation_status } }
          assert:
            - "After post: status == PARTIALLY_FILLED (300/400) while allocation_status == FULL — dimensions independent"
            - "After final fill: status == FILLED and allocation_status == PARTIAL (new uncovered fill reopens the allocation dimension)"

      - name: block_cancel_cascades_detach
        claim_type: side_effect_execution
        grounds: ["state_machines.BlockOrder.OPEN_to_CANCELLED", "state_machines.Order.BLOCKED_to_APPROVED"]
        distinguishing_aspect: "Cascade down: cancelling an OPEN block returns both member orders to APPROVED with block_id null and block CANCELLED."
        test_recipe:
          setup: ["Account A1; security; block OPEN with two APPROVED orders attached (BLOCKED)"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 200, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o2}" }, as: Trader }
          trigger:
            - { call: "POST /trading/blocks/${blk}/cancel", as: Trader, captures: { bst: $.data.status } }
            - { call: "GET /trading/orders/${o1}", as: Trader, captures: { s1: $.data.status, bid1: $.data.block_id } }
            - { call: "GET /trading/orders/${o2}", as: Trader, captures: { s2: $.data.status } }
          assert:
            - "BlockOrder.${blk}.status == CANCELLED"
            - "Order.${o1}: status == APPROVED, block_id == null; Order.${o2}: status == APPROVED"

  - section: calculations
    instances:
      - name: calc_vwap_correct_result
        claim_type: correct_result
        grounds: ["calculations.block_average_price"]
        excluded_because:
          difficulty_instance: avg_price_provisional_vs_final_batch
          rationale: "VWAP correct-result and precision claims are asserted there with literals 1667/2200/1800."

      - name: position_input_set_includes_error_flagged
        claim_type: input_set_filtering
