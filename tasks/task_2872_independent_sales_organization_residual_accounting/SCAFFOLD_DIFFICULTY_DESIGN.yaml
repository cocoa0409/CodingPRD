          - endpoints.POST /processor-programs/{id}/suspend
          - endpoints.POST /processor-programs/{id}/reinstate
          - errors.ERR_PROGRAM_SUSPENDED
        distinguishing_aspect: |
          The batch itself is in a perfectly legal state (NORMALIZED) and nothing about
          the request changes; posting is refused purely because a DIFFERENT entity, the
          ProcessorProgram it points at, is SUSPENDED. Reinstating that other entity —
          with no touch to the batch — makes the identical call succeed, so the
          dependency must be evaluated at post time rather than captured at ingest.
        test_recipe:
          setup:
            - "Program P1 with one ACTIVE merchant M1 and a NORMALIZED 2026-07 batch holding M1's canonical line."
            - "P1 is then SUSPENDED while the batch stays NORMALIZED."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:susp-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /processor-programs/${p1}/suspend"
              payload: {}
              as: IsoAdmin
          trigger:
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
              is_negative_trigger: true
              captures: { err: $.data.error_id }
            - call: "POST /processor-programs/${p1}/reinstate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
          assert:
            - "first trigger call: HTTP 409 with error_id == ERR_PROGRAM_SUSPENDED"
            - "immediately after it: ResidualBatch.${b1}.state == NORMALIZED, posted_at == null, iso_retained_cents == 0 and GET /merchant-profitability?residual_batch_id=${b1} returns total_count 0"
            - "ProcessorProgram.${p1}.status == SUSPENDED before the reinstate and ACTIVE after it"
            - "after the reinstate + re-post: ResidualBatch.${b1}.state == POSTED and GET /residual-allocations?merchant_id=${m1} returns total_count 1 with gross_allocation_cents 14643"
            - "ProcessorProgram.${p1}.posted_batch_count == 1"

      - name: statement_issue_gated_by_sibling_batch_state_of_another_program
        grounds:
          - state_machines.AgentStatement.lifecycle_DRAFT_to_ISSUED (precondition on every batch of the period)
          - validations[priority 12 — ERR_BATCHES_NOT_POSTED]
          - errors.ERR_BATCHES_NOT_POSTED
          - endpoints.POST /residual-batches/{id}/post
        distinguishing_aspect: |
          The gate spans an entity the statement has no reference to at all: a NORMALIZED
          batch of a DIFFERENT processor program that merely shares period_month 2026-07
          blocks the issue, even though every batch that actually fed this statement is
          POSTED. Posting that unrelated (and line-less) batch unblocks the same call —
          the check is period-wide, not statement-wide.
        test_recipe:
          setup:
            - "Program P1 with merchant M1 and a POSTED 2026-07 batch, so A1 holds a DRAFT statement of 14643."
