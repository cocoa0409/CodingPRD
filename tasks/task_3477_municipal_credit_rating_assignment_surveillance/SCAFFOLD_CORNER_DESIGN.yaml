            - "engagement ${eng_go} status == PUBLISHED (engagement lifecycle ends at publication)"
            - "obligation period_index == 1, fiscal_year_end == 2027-06-30T00:00:00Z (first 06-30 strictly after published_at), due_at == 2028-01-26T00:00:00Z (FYE + 210 days), status PENDING"
            - "issuer notification log's latest entry has event_type RATING_PUBLISHED"

      - name: bond_sale_get_returns_computed_pricing
        claim_type: Computed read
        grounds:
