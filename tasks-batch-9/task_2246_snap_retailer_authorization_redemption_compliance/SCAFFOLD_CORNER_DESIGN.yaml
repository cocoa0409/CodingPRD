    # ERR_REPLY_WINDOW_CLOSED             temporal_gate_codes_are_distinct_and_each_names_its_own_window
    # ERR_REPLY_WINDOW_OPEN               temporal_gate_codes_are_distinct_and_each_names_its_own_window
    # ERR_ADMIN_REVIEW_WINDOW_CLOSED      temporal_gate_codes_... + administrative_review_at_its_deadline_is_closed_and_finalize_opens
    #                                     + D admin_review_state_gate_priority_9_beats_deadline_gate_priority_12
    # ERR_CMP_ELECTION_WINDOW_CLOSED      D cmp_election_deadline_priority_12_beats_hardship_gate_priority_18
    # ERR_ENFORCEMENT_NOT_DUE             temporal_gate_codes_... + enforcement_before_the_effective_date_is_refused_and_allowed_at_it
    # ERR_VISIT_WINDOW_NOT_OPEN           visit_start_before_window_start_cannot_open_the_visit
    #                                     + temporal_gate_codes_are_distinct_and_each_names_its_own_window
    # ERR_PERIOD_NOT_ELAPSED              period_close_is_refused_before_period_end_and_allowed_exactly_at_it
    #                                     + temporal_gate_codes_are_distinct_and_each_names_its_own_window
    # ERR_INSPECTOR_WINDOW_CONFLICT       D inspector_half_open_window_with_travel_buffer_boundary_one_minute_apart
    # ERR_TERMINAL_ALREADY_COMMITTED      D terminal_deployment_closed_interval_touching_endpoint_collides
    #                                     + terminal_awaiting_return_cannot_be_committed_to_a_new_deployment
    # ERR_REDEMPTION_PERIOD_OVERLAP       overlapping_period_is_rejected_while_an_abutting_period_is_accepted
    # ERR_DUPLICATE_TERMINAL_SERIAL       uniqueness_rules_reject_duplicate_serial_period_index_and_second_open_application
    # ERR_DUPLICATE_PERIOD_INDEX          uniqueness_rules_reject_duplicate_serial_period_index_and_second_open_application
    # ERR_APPLICATION_ALREADY_OPEN        uniqueness_rules_reject_duplicate_serial_period_index_and_second_open_application
    # ERR_STORE_TERMINAL_SLOTS_EXCEEDED   D store_terminal_slot_aggregate_capacity_allows_equality_refuses_third
    # ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED  inspector_daily_minute_ceiling_blocks_the_same_day_and_frees_the_next
    # ERR_DEPOT_STOCK_EXHAUSTED           D depot_unit_conservation_reserve_activate_return_round_trip
    # ERR_STAPLE_STOCK_INSUFFICIENT       criterion_a_submit_with_only_three_qualifying_categories_is_rejected
    # ERR_CRITERION_B_NOT_MET             D criterion_b_strict_boundary_at_exactly_five_thousand_bps
    # ERR_DEPTH_OF_STOCK_INSUFFICIENT     approval_is_refused_when_the_verified_shelf_depth_is_below_the_floor
    # ERR_INSUFFICIENT_EVIDENCE           decayed_evidence_sum_rounds_once_to_fifty_eight_and_misses_the_sixty_gate
    # ERR_TRIGGER_PERIOD_NOT_FLAGGED      D anomaly_investigation_requires_trigger_period_actually_at_flag_l3
    # ERR_CMP_NOT_AVAILABLE               cmp_in_lieu_is_unavailable_to_a_store_without_hardship_designation
    # ERR_CMP_OVERPAYMENT                 cmp_payment_may_not_exceed_the_balance_and_an_exact_payment_closes_the_election
    # ERR_NO_REDEMPTION_HISTORY           cmp_cannot_be_computed_without_any_closed_redemption_period
    # ERR_NO_ELIGIBLE_ITEMS               all_ineligible_basket_declines_with_no_eligible_items
    #                                     + declined_transactions_persist_while_rejected_ones_leave_no_trace
    # ERR_SPLIT_TENDER_SHORTFALL          declined_transactions_persist_while_rejected_ones_leave_no_trace
    #                                     + D pos_authorization_gate_priority_10_beats_tender_feasibility_priority_19
    # ERR_SANCTION_TYPE_NOT_ALLOWED       trafficking_case_refuses_a_temporary_disqualification_sanction_type
    #                                     + cmp_only_sanction_never_suspends_and_cannot_be_enforced
    # ERR_REDEMPTION_PERIOD_CLOSED        closed_period_refuses_both_a_void_and_a_settlement_import
    #                                     + void_action_is_conditional_on_the_covering_period_still_being_open
    # ERR_TRANSFER_CMP_OUTSTANDING        D reauthorization_approval_blocked_by_predecessor_owner_cmp_debt
    # ERR_OWNERSHIP_UNCHANGED             ownership_change_reauthorization_to_the_same_owner_is_refused
    #
    # RESULT: 57 / 57 codes triggerable; no code is reachable only through
    # another code's instance.
    # ------------------------------------------------------------------------

  - section: rbac
    instances:
      - name: exclusive_operations_are_refused_to_every_other_role
        claim_type: Role Denied
        grounds:
          - roles.FnsAdmin.exclusive_operations
          - roles.FnsAnalyst.exclusive_operations
          - roles.AdminReviewOfficer.exclusive_operations
          - roles.Inspector.exclusive_operations
          - roles.StoreClerk.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Six cross-role attempts on one fixture, each by a caller who is legitimately authenticated and whose target is in a perfectly actionable state, so the only reason for refusal is the role: notably FnsAdmin - which shares every other write - is still refused the administrative review decision, so there is no admin override of the review seat."
        test_recipe:
          setup:
            - "The authorized store with an ACTIVE deployment, a DETERMINED case with a review requested, an UNDER_REVIEW second application, and an IN_PROGRESS visit."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - *k_deploy
            - *k_activate
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
            - *k_case
            - *k_charge
            - *k_clock_0811
            - *k_det_tdq
            - *k_review_req
            - *k_store_b
            - *k_app_b
            - *k_submit_b
            - *k_visit_b
            - *k_start_b
            - *k_findings_b
          trigger:
            - call: "POST /applications/${app_b_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { rbac_decision: $.data.error_id }
            - call: "POST /sanction-cases/${case_id}/administrative-review-decision"
              payload: { outcome: "SUSTAINED" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { rbac_review: $.data.error_id }
            - call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 9, period_start: "2026-09-01", period_end: "2026-09-30" }
              as: AdminReviewOfficer
              as_user_id: "review-officer-1"
              captures: { rbac_period: $.data.error_id }
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "9001", line_items: [ { sku: "MILK-GAL", item_class: "STAPLE_FOOD", unit_price_cents: 399, qty: 1 } ], snap_benefit_available_cents: 399, other_tender_offered_cents: 0 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rbac_sale: $.data.error_id }
            - call: "POST /store-visits/${visit_b_id}/start"
              payload: {}
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { rbac_start: $.data.error_id }
            - call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "UNDERCOVER_BUY", observed_at: "2026-07-20T00:00:00Z" }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { rbac_evidence: $.data.error_id }
          assert:
            - "all six responses are 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "${rbac_decision}, ${rbac_review}, ${rbac_period}, ${rbac_sale}, ${rbac_start} and ${rbac_evidence} are each ERR_ROLE_NOT_PERMITTED"
            - "no state moved: Application.${app_b_id}.status == UNDER_REVIEW, SanctionCase.${case_id}.admin_review_outcome == null, StoreVisit.${visit_b_id}.status == IN_PROGRESS"
            - "GET /pos-transactions?store_id=${store_id} returns total_count == 0 and GET /redemption-periods?store_id=${store_id} returns total_count == 0"
            - "GET /investigations/${inv_id} shows the evidence set unchanged and trafficking_confidence_score == 10"

      - name: each_role_performs_its_own_exclusive_operations_successfully
        claim_type: Role Allowed
        grounds:
          - roles.FnsAdmin.exclusive_operations
          - roles.FnsAnalyst.exclusive_operations
          - roles.Inspector.exclusive_operations
          - roles.StoreClerk.exclusive_operations
          - roles.RetailerOwner.exclusive_operations
        distinguishing_aspect: "The positive mirror of the denial sweep: the exact same operations succeed when issued by their owning role, which is what proves the refusals above are role checks and not latent state bugs - clock, decision, inspector registration, terminal provisioning, period lifecycle, evidence, findings, sale, election and payment all land 2xx."
        test_recipe:
          setup:
            - "An owner, a store and a depot."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_depot
          trigger:
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_term
            - *k_deploy
            - *k_activate
            - *k_period_aug
            - *k_sale_keep
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
            - *k_case
            - *k_charge
            - *k_election
            - *k_reply
          assert:
            - "every call in the trigger sequence returns 200 or 201"
            - "the FnsAdmin-only calls (clock, decision, inspector create, terminal create, deployment create and activate, sanction case, charge letter) all succeed"
            - "the FnsAnalyst-only calls (period create, evidence, conclude) all succeed"
            - "the Inspector-only calls (start, findings) succeed for the assigned inspector"
            - "the StoreClerk-only sale succeeds at the store's ACTIVE deployment"
            - "the RetailerOwner-only calls (cmp-elections, reply) succeed for the owning firm"
            - "Store.${store_id}.authorization_status == AUTHORIZED and sanction_status == CHARGED"

      - name: clerk_of_one_store_cannot_ring_a_sale_at_another_store
        claim_type: Role Denied
        grounds:
          - roles.StoreClerk.identity
          - validations.priority_5_ownership
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "StoreClerk identity is entity_backed on Store, so the role is right but the store is wrong: a clerk carrying store B's id is refused 403 ERR_NOT_RESOURCE_OWNER on store A's ACTIVE deployment - not ERR_ROLE_NOT_PERMITTED and not ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE - and the sale that the store's own clerk then rings on the identical basket succeeds."
        test_recipe:
          setup:
            - "Two authorized stores of the same owner; store A has an ACTIVE deployment."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_store_b
            - *k_app_b
            - *k_submit_b
            - *k_visit_b
            - *k_clock_0401
            - *k_start_b
            - *k_findings_b
            - *k_decision_b
            - *k_depot
            - *k_term
            - *k_deploy
            - *k_activate
          trigger:
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "4102", line_items: [ { sku: "MILK-GAL", item_class: "STAPLE_FOOD", unit_price_cents: 399, qty: 1 } ], snap_benefit_available_cents: 399, other_tender_offered_cents: 0 }
              as: StoreClerk
              as_user_id: "${store_b_id}"
              captures: { foreign_clerk_error_id: $.data.error_id }
            - call: "POST /pos-transactions"
              payload: { store_id: "${store_id}", terminal_deployment_id: "${dep_id}", household_ebt_card_last4: "4102", line_items: [ { sku: "MILK-GAL", item_class: "STAPLE_FOOD", unit_price_cents: 399, qty: 1 } ], snap_benefit_available_cents: 399, other_tender_offered_cents: 0 }
              as: StoreClerk
              as_user_id: "${store_id}"
              captures: { own_clerk_txn_id: $.data.id }
          assert:
            - "the first sale is 403 with ${foreign_clerk_error_id} == ERR_NOT_RESOURCE_OWNER"
            - "the first sale is NOT ERR_ROLE_NOT_PERMITTED (the role is correct) and NOT ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE (the deployment is active)"
            - "no row is written for the refused attempt"
            - "the second sale is 201 with PosTransaction.${own_clerk_txn_id}.status == AUTHORIZED and ebt_tender_cents == 399"
            - "GET /pos-transactions?store_id=${store_id} returns total_count == 1"

      - name: inspector_can_only_act_on_visits_assigned_to_itself
        claim_type: Role Denied
        grounds:
          - roles.Inspector.identity
          - validations.priority_5_ownership
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "A second ACTIVE inspector with the same role and an open window is refused 403 ERR_NOT_RESOURCE_OWNER on someone else's visit, and the refusal does not consume the visit's minutes from either inspector - the assigned one still holds 60 committed minutes and the intruder holds 0."
        test_recipe:
          setup:
            - "A SCHEDULED visit assigned to Dana Ruiz whose window is open, plus a second ACTIVE inspector."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - call: "POST /inspectors"
              payload: { full_name: "Miguel Santos", state_code: "TX", max_daily_minutes: 480 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { insp2_id: $.data.id }
          trigger:
            - call: "POST /store-visits/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp2_id}"
              captures: { foreign_inspector_error_id: $.data.error_id }
            - *k_start
          assert:
            - "the first start is 403 with ${foreign_inspector_error_id} == ERR_NOT_RESOURCE_OWNER"
            - "after the refusal StoreVisit.${visit_id}.status == SCHEDULED"
            - "Inspector.${insp2_id}.committed_minutes == 0 and Inspector.${insp_id}.committed_minutes == 60"
            - "the assigned inspector's start is 200 and StoreVisit.${visit_id}.status == IN_PROGRESS"

      - name: retailer_owner_reads_are_scoped_to_its_own_records
        claim_type: Role Allowed
        grounds:
          - roles.RetailerOwner.shared_operations
          - validations.priority_5_ownership
        distinguishing_aspect: "The same list endpoints return different row sets per caller identity: the second owner sees total_count 0 for stores and sanction cases that the first owner and the FNS staff both see, and a direct detail read of the other firm's case is refused rather than returned redacted."
        test_recipe:
          setup:
            - "One authorized store with a CHARGE_ISSUED case under owner 1, plus an unrelated owner 2."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
            - *k_case
            - *k_charge
            - *k_owner2
          trigger:
            - call: "GET /stores"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner2_id}"
            - call: "GET /sanction-cases"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner2_id}"
            - call: "GET /sanction-cases/${case_id}"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner2_id}"
              captures: { scoped_read_error_id: $.data.error_id }
            - call: "GET /sanction-cases"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - call: "GET /sanction-cases"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          assert:
            - "owner 2's store list is 200 with total_count == 0 and its case list is 200 with total_count == 0"
            - "owner 2's detail read is refused with ${scoped_read_error_id} == ERR_NOT_RESOURCE_OWNER (403)"
            - "owner 1's case list is 200 with total_count == 1 containing ${case_id}"
            - "the analyst's case list is 200 with total_count == 1 - staff reads are not owner-scoped"

      - name: read_routes_are_role_gated_and_the_review_officer_has_no_equipment_visibility
        claim_type: Role Denied
        grounds:
          - endpoints.GET_/equipment-orders
          - endpoints.GET_/ebt-terminals
          - endpoints.GET_/equipment-depots
          - roles.AdminReviewOfficer.shared_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "RBAC is enforced on reads, not only on writes: AdminReviewOfficer - which may read every case, investigation, period, visit and transaction - is refused all three equipment reads with 403, while the identical requests from FnsAnalyst succeed, so the denial is role-scoped rather than route-wide."
        test_recipe:
          setup:
            - "The authorized store, a depot, a terminal and one equipment order."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "SIGNAGE_PACK", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { rbac_order_id: $.data.id }
          trigger:
            - call: "GET /equipment-orders?store_id=${store_id}"
              payload: {}
              as: AdminReviewOfficer
              as_user_id: "review-officer-1"
              captures: { officer_orders_error_id: $.data.error_id }
            - call: "GET /ebt-terminals"
              payload: {}
              as: AdminReviewOfficer
              as_user_id: "review-officer-1"
              captures: { officer_terminals_error_id: $.data.error_id }
            - call: "GET /equipment-depots/${depot_id}"
              payload: {}
              as: AdminReviewOfficer
              as_user_id: "review-officer-1"
              captures: { officer_depot_error_id: $.data.error_id }
            - call: "GET /equipment-orders?store_id=${store_id}"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          assert:
            - "all three officer reads are 403 with ERR_ROLE_NOT_PERMITTED"
            - "${officer_orders_error_id}, ${officer_terminals_error_id} and ${officer_depot_error_id} are each ERR_ROLE_NOT_PERMITTED"
            - "the analyst read is 200 with total_count == 1 containing ${rbac_order_id}"
            - "the officer can still read GET /sanction-cases and GET /store-visits successfully"

      - name: anonymous_may_only_register_an_owner
        claim_type: Role Denied
        grounds:
          - roles.Anonymous
          - endpoints.POST_/owners
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The Anonymous role has exactly one shared operation and no exclusive ones: registering an owner works with no identity at all, but the very next step of the workflow - registering the store - is refused 403 ERR_ROLE_NOT_PERMITTED under the Anonymous role, and so is a plain store read, so anonymous access is write-once and read-never."
        test_recipe:
          setup:
            - "An empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { legal_name: "Anonymous Registrant LLC", ownership_type: "LLC", tax_id_last4: "9911" }
              as: Anonymous
              captures: { anon_owner_id: $.data.id }
            - call: "POST /stores"
              payload: { owner_id: "${anon_owner_id}", store_name: "Anonymous Mart", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 3, staple_shelf_linear_feet: 80, annual_gross_sales_cents: 50000000, annual_staple_sales_cents: 30000000, max_terminal_slots: 2 }
              as: Anonymous
              captures: { anon_store_error_id: $.data.error_id }
            - call: "GET /owners/${anon_owner_id}"
              payload: {}
              as: Anonymous
              captures: { anon_read_error_id: $.data.error_id }
          assert:
            - "the registration is 201 with Owner.${anon_owner_id}.status == ACTIVE and sanction_flag == CLEAR"
            - "the store create is 403 with ${anon_store_error_id} == ERR_ROLE_NOT_PERMITTED"
            - "the read is refused with ${anon_read_error_id} being ERR_ROLE_NOT_PERMITTED (role present) or ERR_MISSING_USER_CONTEXT (no headers at all)"
            - "GET /stores as FnsAdmin returns total_count == 0"

    # ------------------------------------------------------------------------
    # role_model: segregation_of_duties - the three same-user prohibitions are
    # asserted in the `validations` section of this file rather than duplicated
    # here, because each one needs a full multi-step case fixture:
    #   SOD-1  review_officer_who_signed_the_determination_cannot_decide_the_review
    #   SOD-2  reverification_findings_cannot_be_filed_by_the_pre_authorization_inspector
    #   SOD-3  investigation_cannot_be_concluded_by_the_analyst_who_opened_it
    # Each pairs the 403 with the same request succeeding for an independent
    # user, which is what separates a duty check from a role check.
    # ------------------------------------------------------------------------

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_store_version_is_refused_and_the_refreshed_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.application-create-stale-store
          - errors.ERR_STALE_STORE_VERSION
          - endpoints.PATCH_/stores/{storeId}
          - endpoints.POST_/applications
        distinguishing_aspect: "The declared OCC rule is exercised from both writes that carry expected_store_version: after a profile edit bumps the store, an application filed against the pre-edit snapshot is 412 ERR_STALE_STORE_VERSION and so is a second PATCH quoting the same stale token, while the refreshed token succeeds - and the successful application creation itself bumps Store.version again, so the next caller must re-read too."
        test_recipe:
          setup:
            - "One owner and one freshly registered store."
          setup_api_calls:
            - *k_owner
            - call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Occ Corner Market", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 2, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2, tax_rate_bps: 825 }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { occ_store_id: $.data.id, occ_store_v1: $.data.version }
          trigger:
            - call: "PATCH /stores/${occ_store_id}"
              payload: { expected_store_version: "${occ_store_v1}", staple_shelf_linear_feet: 36 }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { occ_store_v2: $.data.version }
            - call: "POST /applications"
              payload: { store_id: "${occ_store_id}", expected_store_version: "${occ_store_v1}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *k_inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { stale_app_error_id: $.data.error_id }
            - call: "PATCH /stores/${occ_store_id}"
              payload: { expected_store_version: "${occ_store_v1}", staple_shelf_linear_feet: 40 }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { stale_patch_error_id: $.data.error_id }
            - call: "POST /applications"
              payload: { store_id: "${occ_store_id}", expected_store_version: "${occ_store_v2}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *k_inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { occ_app_id: $.data.id }
            - call: "GET /stores/${occ_store_id}"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { occ_store_v3: $.data.version }
          assert:
            - "the patch is 200 with ${occ_store_v2} == ${occ_store_v1} + 1 and staple_shelf_linear_feet == 36"
            - "the stale application is 412 with ${stale_app_error_id} == ERR_STALE_STORE_VERSION and NO Application row is written"
            - "the stale patch is 412 with ${stale_patch_error_id} == ERR_STALE_STORE_VERSION and staple_shelf_linear_feet is still 36, not 40"
            - "the refreshed application is 201 with Application.${occ_app_id}.status == DRAFT"
            - "${occ_store_v3} == ${occ_store_v2} + 1 - the application creation bumped the store version"
            - "GET /applications?store_id=${occ_store_id} returns total_count == 1"

      - name: stale_sanction_case_version_blocks_the_cmp_election
