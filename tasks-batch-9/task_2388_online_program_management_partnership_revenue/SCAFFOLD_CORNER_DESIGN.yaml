            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_lead2_create
            - *k_lead2_contact
            - *k_lead3_create
            - *k_lead3_contact_late
          trigger:
