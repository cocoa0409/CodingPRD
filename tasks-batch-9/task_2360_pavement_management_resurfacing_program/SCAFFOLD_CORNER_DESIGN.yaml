  # state_machines — transitions, preconditions, side effects, terminal lockdown
  - section: state_machines
    instances:
      - name: survey_seal_attempted_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.ConditionSurvey", "validations.ERR_SURVEY_NOT_OPEN", "errors.ERR_SURVEY_NOT_OPEN"]
        distinguishing_aspect: "SEALED is the only terminal state of ConditionSurvey, so the second seal is a 409 ERR_SURVEY_NOT_OPEN rather than an idempotent 200 — and the network_condition_index and sealed_at written by the FIRST seal are left byte-identical, proving the rejected call did not re-run the cascade."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One LOCAL segment with an ACCEPTED observation measuring 69.1."
            - "The survey has already been sealed once at that clock, publishing network_condition_index 69.1 and sealed_at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { first_idx: "$.data.network_condition_index", first_sealed: "$.data.sealed_at" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/condition-surveys/${sv}"
              payload: {}
              as: PavementEngineer
              captures: { idx_after: "$.data.network_condition_index", sealed_after: "$.data.sealed_at", st_after: "$.data.survey_status" }
          assert:
            - "HTTP 409 on the second seal."
            - "data.error_id == 'ERR_SURVEY_NOT_OPEN'."
            - "${idx_after} == ${first_idx} == 69.1 and ${sealed_after} == ${first_sealed} == '2026-08-01T00:00:00Z' — the second attempt did not restamp sealed_at with the new 2026-08-02 clock."
            - "survey_status == 'SEALED'."

      - name: survey_seal_with_a_pending_qc_observation_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ConditionSurvey.OPEN_to_SEALED", "validations.ERR_OBSERVATIONS_PENDING_QC", "errors.ERR_OBSERVATIONS_PENDING_QC"]
        distinguishing_aspect: "The seal precondition is 'no PENDING observation', not 'at least one ACCEPTED': a survey that ALREADY satisfies the accepted-observation half of the rule is still refused because a second, un-QC'd reading is outstanding — ERR_OBSERVATIONS_PENDING_QC, 409, at priority 66."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Two LOCAL segments, Maple St and Oak St, each with one observation on the same OPEN 2026 survey."
            - "Maple St's observation is ACCEPTED (measured 69.1); Oak St's observation is left in qc_status PENDING."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Oak St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 3517.5, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg3: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg3}", alligator_cracking_sqft: 0.0, longitudinal_cracking_lf: 0.0, rutting_depth_in: 0.875, patching_sqft: 0.0, iri_in_per_mi: 95.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs3: "$.data.id" }
          trigger:
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/condition-surveys/${sv}"
              payload: {}
              as: PavementEngineer
              captures: { st: "$.data.survey_status", oc: "$.data.observation_count", aoc: "$.data.accepted_observation_count" }
          assert:
            - "HTTP 409."
            - "data.error_id == 'ERR_OBSERVATIONS_PENDING_QC'."
            - "survey_status is still 'OPEN', sealed_at is still null and network_condition_index is still null."
            - "observation_count == 2 while accepted_observation_count == 1 — the ACCEPTED reading alone is not enough."
            - "GET /pavement/segments/{seg1} still shows condition_index == 76.0 (MODEL_PROJECTED) — the blocked seal published nothing."

      - name: survey_seal_with_only_a_rejected_observation_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ConditionSurvey.OPEN_to_SEALED", "validations.ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS", "errors.ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS"]
        distinguishing_aspect: "The other half of the same priority-66 rule, isolated: nothing is PENDING (the single observation was REJECTED, a terminal QC state), yet the seal still fails — with the DIFFERENT error code ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS, proving the two halves are distinguishable and not collapsed into one code."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One LOCAL segment with a single observation on the OPEN 2026 survey."
            - "That observation was REJECTED at QC, so no observation is PENDING and none is ACCEPTED."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "REJECT", qc_note: "collection artifact — sensor dropout" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/condition-surveys/${sv}"
              payload: {}
              as: PavementEngineer
              captures: { st: "$.data.survey_status", oc: "$.data.observation_count", aoc: "$.data.accepted_observation_count" }
          assert:
            - "HTTP 409."
            - "data.error_id == 'ERR_SURVEY_HAS_NO_ACCEPTED_OBSERVATIONS' (NOT ERR_OBSERVATIONS_PENDING_QC — nothing is pending)."
            - "survey_status == 'OPEN', observation_count == 1, accepted_observation_count == 0."

      - name: observation_flagged_then_accepted_reaches_the_accepted_terminal
        claim_type: valid_transition
        grounds: ["state_machines.DistressObservation.PENDING_to_FLAGGED", "state_machines.DistressObservation.FLAGGED_to_ACCEPTED", "entities.ConditionSurvey.fields.accepted_observation_count"]
        distinguishing_aspect: "FLAGGED is a re-entrant middle state, not a dead end: PENDING -> FLAGGED -> ACCEPTED walks a two-hop path to the same terminal a single ACCEPT would have reached, the survey's accepted_observation_count moves 0 -> 0 -> 1 (the FLAG step does NOT increment it), and the qc_note from the second decision overwrites the first."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One LOCAL segment with one observation on an OPEN 2026 survey; the observation measures 69.1 and starts qc_status PENDING."
            - "A first QC decision FLAGs the reading for review with note 'rut depth outlier — re-drive requested'."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "FLAG", qc_note: "rut depth outlier — re-drive requested" }
              as: PavementEngineer
            - call: "GET /pavement/condition-surveys/${sv}"
              payload: {}
              as: PavementEngineer
              captures: { aoc_flagged: "$.data.accepted_observation_count" }
          trigger:
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "re-drive confirms the original reading" }
              as: PavementEngineer
            - call: "GET /pavement/distress-observations/${obs1}"
              payload: {}
              as: PavementEngineer
              captures: { q_st: "$.data.qc_status", q_note: "$.data.qc_note", q_pci: "$.data.measured_condition_index" }
            - call: "GET /pavement/condition-surveys/${sv}"
              payload: {}
              as: PavementEngineer
              captures: { aoc_after: "$.data.accepted_observation_count", oc_after: "$.data.observation_count" }
          assert:
            - "HTTP 200 on the ACCEPT."
            - "${aoc_flagged} == 0 — FLAG did not count the observation as accepted."
            - "qc_status == 'ACCEPTED' and qc_note == 're-drive confirms the original reading' (the FLAG note was replaced)."
            - "measured_condition_index is still 69.1 — QC decides admissibility, it never re-derives the measurement."
            - "${aoc_after} == 1 and ${oc_after} == 1."
            - "The survey can now be sealed successfully."

      - name: observation_qc_on_an_already_accepted_observation_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DistressObservation.terminal_states", "validations.ERR_OBSERVATION_ALREADY_DECIDED", "errors.ERR_OBSERVATION_ALREADY_DECIDED"]
        distinguishing_aspect: "ACCEPTED and REJECTED are terminal, so a REJECT aimed at an ACCEPTED observation is 409 ERR_OBSERVATION_ALREADY_DECIDED — the escape hatch that FLAGGED enjoys (FLAGGED -> ACCEPTED / REJECTED) does not exist once the reading has been admitted, and accepted_observation_count stays at 1."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One LOCAL segment with one observation on an OPEN 2026 survey; the observation has already been ACCEPTED."
