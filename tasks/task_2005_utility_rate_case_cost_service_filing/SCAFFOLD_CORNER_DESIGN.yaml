      - name: rr_mismatch_tolerance_boundary
        claim_type: priority_ordering
        grounds: ["validations[priority=11]", "errors[ERR_RR_MISMATCH]", "errors[ERR_NONPOSITIVE_REVENUE_REQUIREMENT]"]
        distinguishing_aspect: "The 100-cent RR tolerance is inclusive and the fiscal sub-order is pinned: case A (proposed = computed + 100) files successfully; case B (computed + 101) fails ERR_RR_MISMATCH; case C (computed 0, proposed 0) fails ERR_NONPOSITIVE_REVENUE_REQUIREMENT which is evaluated before the mismatch check."
        test_recipe:
          setup: ["Three minimal cases, each with one locked O&M entry and one submitted rate-base item: A proposed 1,180,000,100 vs computed 1,180,000,000; B proposed 1,180,000,101; C computed 0 with proposed 0"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-A", utility_name: "Utility A", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1180000100, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rca: $.data.id } }
