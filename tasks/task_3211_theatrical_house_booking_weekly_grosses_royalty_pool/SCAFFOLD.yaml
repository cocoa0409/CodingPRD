  # --- Weekly gross reports ---
  - method: POST
    path: "/theatres/bookings/{booking_id}/weekly-gross-reports"
    description: "Open the weekly gross report for a settlement week (provisional gross)"
    roles: [CompanyRep]
    code: 201
    input: [week_start]
    output: WeeklyGrossReport
    side_effects: ["gross_cents computed via weekly_gross_sum provisional variant"]

  - method: GET
    path: "/theatres/weekly-gross-reports/{id}"
    description: "Read a weekly gross report"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: []
    output: WeeklyGrossReport
    side_effects: []

  - method: POST
    path: "/theatres/weekly-gross-reports/{id}/submit"
    description: "Submit the report for house verification (final gross variant, frozen)"
    roles: [CompanyRep]
    code: 200
    input: []
    output: WeeklyGrossReport
    side_effects: ["gross_cents re-derived via final variant; status -> SUBMITTED"]

  - method: POST
    path: "/theatres/weekly-gross-reports/{id}/verify"
    description: "Verify a submitted report; drives the stop-clause counter"
    roles: [HouseManager]
    code: 200
    input: []
    output: WeeklyGrossReport
    side_effects:
      - "status -> VERIFIED; gross locked"
      - "stop_clause_counter applied (increment + OPEN notice, or reset + DISCHARGE)"

  - method: POST
    path: "/theatres/weekly-gross-reports/{id}/reject"
    description: "Reject a submitted report"
    roles: [HouseManager]
    code: 200
    input: []
    output: WeeklyGrossReport
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/theatres/weekly-gross-reports/{id}/revise"
    description: "Return a rejected report to DRAFT for correction (cycle)"
    roles: [CompanyRep]
    code: 200
    input: []
    output: WeeklyGrossReport
    side_effects: ["status -> DRAFT; gross recomputed provisional"]

  - method: GET
    path: "/theatres/weekly-gross-reports/{id}/settlement"
    description: "Fetch the settlement for a report (0 or 1 elements)"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: []
    output: "Settlement[]"
    side_effects: []

  # --- Settlements ---
  - method: POST
    path: "/theatres/weekly-gross-reports/{report_id}/settlements"
    description: "Create a settlement for a VERIFIED report"
    roles: [HouseManager]
    code: 201
    input: [house_expenses_cents]
    output: Settlement
    side_effects:
      - "crew_cost_cents, theatre_share_cents, weekly_operating_profit_cents, royalty_pool_cents computed via weekly_settlement_split"
      - "one settlement per report (second create -> ERR_ALREADY_TERMINAL)"

  - method: GET
    path: "/theatres/settlements/{id}"
    description: "Read a settlement"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/theatres/settlements"
    description: "List settlements; filterable by booking_id"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/theatres/settlements/{id}/finalize"
    description: "Finalize a settlement; freezes all computed amounts"
    roles: [HouseManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> FINALIZED"]

  # --- Crew ---
  - method: POST
    path: "/theatres/bookings/{booking_id}/crew-assignments"
    description: "Engage crew for a booking; crew_size must meet the union minimum for the house"
    roles: [HouseManager]
    code: 201
    input: [crew_size]
    output: CrewAssignment
    side_effects: []

  # --- Capital projects ---
  - method: POST
    path: "/theatres/houses/{theatre_id}/capital-projects"
    description: "Schedule a capital maintenance window on a landmark theatre"
    roles: [HouseManager]
    code: 201
    input: [description, window_start, window_end]
    output: CapitalProject
    side_effects: []

  - method: GET
    path: "/theatres/capital-projects/{id}"
    description: "Read a capital project"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []

  - method: POST
    path: "/theatres/capital-projects/{id}/complete"
    description: "Complete a maintenance window; releases bookings in MAINTENANCE_HOLD"
    roles: [HouseManager]
    code: 200
    input: []
    output: CapitalProject
    side_effects:
      - "status -> COMPLETED"
      - "MAINTENANCE_HOLD bookings whose load-out fell inside the window -> DONE (cascade)"

  - method: POST
    path: "/theatres/capital-projects/{id}/cancel"
    description: "Cancel a scheduled maintenance window"
    roles: [HouseManager]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status -> CANCELLED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601 UTC). Server startup default before any call is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [HouseManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "advances logical clock; booking auto-transitions (REQUESTED window arrival, ACTIVE at loadin_start, CLOSED/EVICTED -> MAINTENANCE_HOLD/DONE at load-out completion) are evaluated against the new clock value"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Missing/invalid role headers, role not authorized, or CompanyRep acting on a resource owned by another company"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced path resource does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed datetime, or invalid enum value"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition attempted from a state that does not allow it (e.g., approve a WITHDRAWN booking, refund a REFUNDED order, submit a VERIFIED report)"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Operation targets a resource in a terminal state (e.g., second settlement for a report, cancel a COMPLETED capital project)"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_booking_version does not match the booking's current version (OCC)"

  - id: ERR_BOOKING_WINDOW_CONFLICT
    http: 409
    condition: "Booking window overlaps an APPROVED/ACTIVE booking on the same theatre (buffers included) or a SCHEDULED capital project window"

  - id: ERR_SIZE_CLASS_MISMATCH
    http: 422
    condition: "Theatre size_class is smaller than Production.required_size_class"

  - id: ERR_UNION_MIN_CREW_VIOLATION
    http: 422
    condition: "Crew size below the union minimum for the theatre size_class, or activation attempted with no qualifying CrewAssignment"

  - id: ERR_ROYALTY_POINTS_OUT_OF_BOUNDS
    http: 422
    condition: "Royalty point total for the production is outside [1, 100] at settlement finalize, or a single participant has < 1 point"

  - id: ERR_DISCOUNT_CODE_INVALID
    http: 422
    condition: "Discount code does not belong to the order's production, is inactive, or percent_off is outside (0, 100)"

  - id: ERR_DYNAMIC_FACTOR_OUT_OF_RANGE
    http: 422
    condition: "dynamic_pricing_factor outside [0.5, 2.0]"

  - id: ERR_GROUP_SALE_FLAG_MISMATCH
    http: 422
    condition: "ticket_count >= 8 without is_group_sale true, or ticket_count < 8 with is_group_sale true"

  - id: ERR_STOP_CLAUSE_NOT_MET
    http: 409
    condition: "execute_stop_notice attempted while consecutive_under_floor_weeks < stop_clause_consecutive_weeks or no OPEN notice exists"

  - id: ERR_CAPITAL_PROJECT_IN_USE
    http: 409
    condition: "Cancelling a capital project whose window holds a booking in MAINTENANCE_HOLD"

  - id: ERR_REPORT_WEEK_DUPLICATE
    http: 409
    condition: "A weekly gross report already exists for this booking and week_start"

  - id: ERR_FISCAL_GUARD_VIOLATION
    http: 422
    condition: "Negative house_expenses or rent, or a fiscal computation guard breached"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: HouseManager
    description: "Theatre operator staff; manages houses, approves/declines bookings, drafts licenses, verifies grosses, creates/finalizes settlements, schedules capital maintenance, engages crew"
    identity: "opaque"
    exclusive_operations:
      - "POST /theatres/companies"
      - "POST /theatres/houses"
      - "POST /theatres/bookings/{id}/approve"
      - "POST /theatres/bookings/{id}/decline"
      - "POST /theatres/bookings/{id}/execute_stop_notice"
      - "POST /theatres/bookings/{booking_id}/license-agreements"
      - "POST /theatres/weekly-gross-reports/{id}/verify"
      - "POST /theatres/weekly-gross-reports/{id}/reject"
      - "POST /theatres/weekly-gross-reports/{report_id}/settlements"
      - "POST /theatres/settlements/{id}/finalize"
      - "POST /theatres/bookings/{booking_id}/crew-assignments"
      - "POST /theatres/houses/{theatre_id}/capital-projects"
      - "POST /theatres/capital-projects/{id}/complete"
      - "POST /theatres/capital-projects/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"

  - name: CompanyRep
    description: "Production company representative; creates productions, requests bookings, signs licenses, reports weekly grosses, manages royalty participants and discount codes. Segregation of duties: the rep who owns the production cannot also verify its own grosses (HouseManager duty)."
    identity: "entity_backed:ProductionCompany"
    exclusive_operations:
      - "POST /theatres/productions"
      - "POST /theatres/bookings"
      - "POST /theatres/bookings/{id}/withdraw"
      - "POST /theatres/bookings/{id}/close"
      - "POST /theatres/license-agreements/{id}/sign"
      - "POST /theatres/productions/{production_id}/royalty-participants"
      - "POST /theatres/productions/{production_id}/discount-codes"
      - "POST /theatres/discount-codes/{id}/deactivate"
      - "POST /theatres/bookings/{booking_id}/weekly-gross-reports"
      - "POST /theatres/weekly-gross-reports/{id}/submit"
      - "POST /theatres/weekly-gross-reports/{id}/revise"
    shared_operations:
      - "GET endpoints"

  - name: BoxOfficeAgent
    description: "Box office operator; sells and refunds ticket orders only"
    identity: "opaque"
    exclusive_operations:
      - "POST /theatres/bookings/{booking_id}/ticket-orders"
      - "POST /theatres/ticket-orders/{id}/refund"
    shared_operations:
      - "GET endpoints"
