  - rule_id: boundary_precision_check
    instances:
      - name: prequal_band_exactly_80_approves
        grounds:
          - calculations.prequal_score
          - state_machines.ContractorOrg.UNDER_REVIEW_to_APPROVED
          - entities.ContractorOrg.fields.prequal_valid_until
        distinguishing_aspect: |
          Metric: weighted prequal score at the exact 80.00 band edge — the >= comparison
          is inclusive, so 80.00 yields computed_decision APPROVE and decide APPROVE
          succeeds; endpoint: POST /safety/contractor-orgs/{id}/decide.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01; contractor with emr 0.50, trir 0.0, safety_audit_pct 80, cert 2026-12-15 -> score exactly 80.00"
            - "No ACTIVE program, so the posture gate does not apply"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "EHS Manager", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/contractor-orgs", payload: { name: "Acme Erectors", contact_email: "safety@acme.example", emr: 0.50, trir: 0.0, safety_audit_pct: 80, insurance_cert_expires_on: "2026-12-15" }, as: EHSAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/contractor-orgs/${c_id}/submit", payload: {}, as: ContractorRep, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /safety/contractor-orgs/${c_id}/decide", payload: { decision: "APPROVE" }, as: SafetyManager, as_user_id: "${m_id}", captures: { st: $.data.status, vu: $.data.prequal_valid_until } }
          assert:
            - "prequal_score == 80.00 sits ON the APPROVE band edge (inclusive >=)"
            - "status == APPROVED"
            - "prequal_valid_until == 2027-09-01T00:00:00Z (decide timestamp + 365 days)"

      - name: quorum_exactly_min_holds
        grounds:
          - calculations.quorum_check
          - state_machines.CommitteeMeeting.SCHEDULED_to_HELD
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: |
          Metric: distinct committee-member attendee count at exactly program.quorum_min —
          inclusive >= passes at 2 of 2 and fails at 1 of 2; endpoint:
          POST /safety/committee-meetings/{id}/hold. Different metric and endpoint than
          the prequal-score boundary.
        test_recipe:
          setup:
            - "ACTIVE program with quorum_min 2; committee members C1, C2; chair M"
            - "Two meetings scheduled on distinct half-open slots"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 2 }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "C One", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { c1_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "C Two", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { c2_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt1: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T11:00:00Z", scheduled_end: "2026-06-10T12:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt2: $.data.id } }
          trigger:
            - { call: "POST /safety/committee-meetings/${mt1}/hold", payload: { attendee_ids: ["${c1_id}", "${c2_id}"] }, as: CommitteeChair, as_user_id: "${m_id}", captures: { st: $.data.status } }
            - { call: "POST /safety/committee-meetings/${mt2}/hold", payload: { attendee_ids: ["${c1_id}"] }, as: CommitteeChair, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "First hold with exactly quorum_min (2) distinct committee members succeeds: status == HELD"
            - "Second hold with 1 of 2 returns ERR_QUORUM_NOT_MET and meeting stays SCHEDULED"
            - "Two MEETING_ATTENDED events exist (one per committee attendee of the held meeting)"

      - name: near_miss_ratio_exactly_floor
        grounds:
          - calculations.leading_indicator_rates
          - entities.SafetyProgram.fields.integrity_flag
        distinguishing_aspect: |
          Metric: near_miss_ratio at exactly the 0.20 floor with an accepted claim
          present — the flag uses a strict < comparison on the unrounded ratio, so
          exactly 0.20 does NOT flag while 1/6 (0.1667) does; endpoint:
          GET /safety/programs/{id}/leading-indicators. Different metric and endpoint
          than the prequal and quorum boundaries.
        test_recipe:
          setup:
            - "ACTIVE program (near_miss_floor_ratio default 0.20); one ACCEPTED INDEMNITY claim"
            - "4 OBSERVATION + 1 NEAR_MISS observations by A, all triaged NO_ACTION by M -> ratio exactly 1/5 = 0.20"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-01", kind: "INDEMNITY", incurred_cents: 100000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { cl_id: $.data.id } }
            - { call: "POST /safety/claims/${cl_id}/accept", payload: {}, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Obs 1", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o1: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Obs 2", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o2: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Obs 3", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o3: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Obs 4", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o4: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "NEAR_MISS", description: "NM 1", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o5: $.data.id } }
            - { call: "POST /safety/observations/${o1}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o2}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o3}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o4}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o5}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
          trigger:
            - { call: "GET /safety/programs/${p_id}/leading-indicators", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { r1: $.data.near_miss_ratio, f1: $.data.integrity_flag } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Obs 5", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o6: $.data.id } }
            - { call: "POST /safety/observations/${o6}/triage", payload: { action: "NO_ACTION" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "GET /safety/programs/${p_id}/leading-indicators", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { r2: $.data.near_miss_ratio, f2: $.data.integrity_flag } }
          assert:
            - "First read: near_miss_ratio == 0.2 exactly and integrity_flag == false (floor comparison is strict <)"
            - "Second read: near_miss_ratio == 0.1667 and integrity_flag == true (accepted claim + ratio below floor)"
            - "observation_count == 5 then 6; near_miss_count == 1 throughout"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: control_verify_gated_by_hazard_state
        grounds:
          - state_machines.ControlItem.IMPLEMENTED_to_VERIFIED
          - state_machines.Hazard.IN_PROGRESS_to_PENDING_VERIFICATION
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair ControlItem x Hazard: verify on an IMPLEMENTED control is rejected
          while the parent Hazard is IN_PROGRESS (sibling control still PLANNED) — the
          hazard must reach PENDING_VERIFICATION (all controls IMPLEMENTED|VERIFIED) first.
        test_recipe:
          setup:
            - "ACTIVE program; employees A (implementer), M (verifier)"
            - "Hazard assessed MEDIUM with controls c1 (IMPLEMENTED) and c2 (still PLANNED) -> hazard IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "Line 1", description: "Exposed wiring", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Conduit", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Lockout", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /safety/controls/${c1_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /safety/controls/${c1_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (hazard IN_PROGRESS, not PENDING_VERIFICATION)"
            - "c1 remains IMPLEMENTED; hazard remains IN_PROGRESS; no IncentiveEvent created"

      - name: observation_create_gated_by_program_active
        grounds:
          - state_machines.SafetyProgram.DRAFT_to_ACTIVE
          - errors[ERR_PROGRAM_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Observation x SafetyProgram: submitting an observation against a
          DRAFT (never activated) program is rejected with ERR_PROGRAM_NOT_ACTIVE — the
          program's lifecycle gates a child entity's creation. Different pair than
          ControlItem x Hazard.
        test_recipe:
          setup:
            - "Program in DRAFT; LOW role and employee A exist"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Wet floor", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "GET /safety/observations?program_id=${p_id} returns zero rows"

      - name: training_assignment_gated_by_employee_active
        grounds:
          - state_machines.Employee.ACTIVE_to_INACTIVE
          - validations[priority=15]
          - errors[ERR_EMPLOYEE_INACTIVE]
        distinguishing_aspect: |
          Entity pair TrainingAssignment x Employee: creating an assignment for an
          INACTIVE employee is rejected with ERR_EMPLOYEE_INACTIVE — no duplicate or
          certification-window constraint applies, isolating the cross-entity gate.
          Third distinct pair in the scaffold.
        test_recipe:
          setup:
            - "LOW role, HAZCOM course, employee E deactivated before any assignment"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/training-courses", payload: { title: "HAZCOM", hazard_class: "LOW", validity_months: 12, renewal_window_days: 30 }, as: EHSAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /safety/employees/${e_id}/deactivate", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-07-01T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EMPLOYEE_INACTIVE"
            - "no TrainingAssignment row exists for employee ${e_id}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_half_open_overlap
        grounds:
          - calculations.meeting_overlap
          - validations[priority=10]
          - errors[ERR_MEETING_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: strict half-open [start, end) on the program's meeting
          resource — back-to-back adjacency (new.start == existing.end) is ALLOWED while
          any strict intersection is rejected with ERR_MEETING_OVERLAP.
        test_recipe:
          setup:
            - "Program exists (DRAFT is fine — meetings have no program-state gate); chair M"
            - "Meeting A scheduled 2026-06-10 09:00-10:00"
          setup_api_calls:
