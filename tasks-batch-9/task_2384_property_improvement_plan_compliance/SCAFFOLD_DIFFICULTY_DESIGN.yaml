              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-8.1.1", brand_estimated_cost_cents: 4000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_a_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-8.1.2", brand_estimated_cost_cents: 5000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_b_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 10642500, contingency_pct: 0.10, financing_source: "MIXED", expected_plan_version: "${plan_v}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_id: $.data.id }
            - call: "POST /pip/capital-budgets/${budget_id}/approve"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/capital-budgets/${budget_id}/lock"
              payload: {}
              as: FranchiseeOwner
