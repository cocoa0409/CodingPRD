          assert:
            - "HTTP 409 and data.error_id == \"ERR_FORECAST_NOT_SUBMITTED\"."
            - "RenewalForecast.${fc_id}.cs_state == \"DRAFT\" and finance_state == \"PENDING\"."
            - "RenewalForecast.${fc_id}.finance_amount_cents is null and variance_cents is null and reconciled_at is null."

      - name: coverage_assignment_get_with_unknown_id_returns_not_found
        claim_type: error_triggerability
        grounds:
          - errors.ERR_COVERAGE_ASSIGNMENT_NOT_FOUND
          - validations[priority=3]
          - endpoints[id=E13]
        distinguishing_aspect: "The CoverageAssignment 404 is triggerable on its own read endpoint: an unknown UUID returns ERR_COVERAGE_ASSIGNMENT_NOT_FOUND, distinct from the account-level 404."
        test_recipe:
          setup:
