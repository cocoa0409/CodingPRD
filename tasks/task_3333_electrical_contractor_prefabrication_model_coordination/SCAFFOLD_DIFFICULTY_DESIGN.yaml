              payload: { project_code: "P-3333-OV1", project_name: "Deck Z", jurisdiction_key: "J1", planned_value_cents: 100000000, power_on_iso: "2026-12-01T00:00:00Z", laydown_slots: 4, credit_policy: "FIRST_ACCEPTED", posture_thresholds: { SLIP_RELEASE_AT: 0.02, SLIP_RECOVERY_AT: 0.05, SLIP_HOLD_AT: 0.10, SLIP_FREEZE_AT: 0.15 }, shop_utilization_pct: 0.50, total_quantity: 400, released_quantity: 0, float_band_low_pct: 0.10, safety_program_required: true }
