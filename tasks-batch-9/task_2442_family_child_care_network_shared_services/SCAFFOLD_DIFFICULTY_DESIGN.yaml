# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty
# Rules. Nine rule_id blocks, 2 instances each = 18 instances.
# Every numeric literal in `assert:` was computed by executing the relevant
# `calculations[].formula` against its `constants:`.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: subsidy_claim_provisional_advance_vs_final_reconciled_divergence
        grounds:
          - calculations.subsidy_claim_amount
          - state_machines.SubsidyClaim.DRAFT_to_SUBMITTED
          - state_machines.SubsidyClaim.SUBMITTED_to_ADVANCE_PAID
          - state_machines.SubsidyClaim.ADVANCE_PAID_to_RECONCILED
          - entities.SubsidyClaim.fields.provisional_amount_cents
          - entities.SubsidyClaim.fields.final_amount_cents
          - entities.SubsidyClaim.fields.settlement_delta_cents
        distinguishing_aspect: |
          This instance is the fiscal-ledger variant pair on SubsidyClaim: over the identical two
          attendance lines the PROVISIONAL_ADVANCE variant pays every absent day at the full daily
          rate (153000) while FINAL_RECONCILED caps absences at 3 per line, pays them at 50 percent,
          and zeroes them for the line whose enrollment withdrew (132750) — a 20250-cent divergence
          on the same stored `lines` array.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with network_fee_pct 6.0 and an ACTIVE SubsidyContract at daily_rate_cents 4500, absence_rate_pct 50, authorized_amount_cents 5000000."
            - "Two subsidy-certified enrollments CH-1 and CH-2, both ENROLLED with committed slots."
            - "One DRAFT SubsidyClaim for 2026-07 with lines CH-1 (18 attended, 4 absent) and CH-2 (10 attended, 2 absent)."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING", "FOOD_PROGRAM"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-07-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-07", lines: [{ enrollment_id: "${e1}", attended_days: 18, absent_days: 4 }, { enrollment_id: "${e2}", attended_days: 10, absent_days: 2 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /fccn/subsidy-claims/${cl1}/submit"
              as: Provider
              as_user_id: "${p1}"
              captures: { prov_amount: $.data.provisional_amount_cents }
            - call: "POST /fccn/subsidy-claims/${cl1}/advance"
              as: FiscalOfficer
              captures: { adv_amount: $.data.advance_paid_cents }
            - call: "POST /fccn/enrollments/${e2}/withdraw"
              payload: { exit_on: "2026-07-31T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-claims/${cl1}/reconcile"
              as: FiscalOfficer
              captures: { fin_amount: $.data.final_amount_cents, delta: $.data.settlement_delta_cents }
          assert:
            - "SubsidyClaim.${cl1}.provisional_amount_cents == 153000"
            - "SubsidyClaim.${cl1}.advance_paid_cents == 122400"
            - "SubsidyClaim.${cl1}.final_amount_cents == 132750"
            - "SubsidyClaim.${cl1}.settlement_delta_cents == 10350"
            - "SubsidyClaim.${cl1}.final_amount_cents != SubsidyClaim.${cl1}.provisional_amount_cents (132750 vs 153000)"
            - "SubsidyClaim.${cl1}.status == RECONCILED"
            - "SubsidyContract.${c1}.claimed_amount_cents == 132750"

      - name: provider_quality_score_coaching_weighted_vs_compliance_anchored_divergence
        grounds:
          - calculations.provider_quality_score
          - state_machines.CoachingVisit.SCHEDULED_to_COMPLETED
          - state_machines.ComplianceReview.CAP_SUBMITTED_to_CLOSED_COMPLIANT
          - entities.Provider.fields.quality_score
          - entities.Provider.fields.quality_tier
          - entities.Provider.fields.quality_variant_applied
        distinguishing_aspect: |
          This is the quality-scoring variant pair on Provider — a different entity domain and a
          different metric from the SubsidyClaim cents pair: over the identical three completed
          visits (60, 88, 98) COACHING_WEIGHTED returns 87.40 / TIER_1 (recency weights 0.5/0.3/0.2,
          no date window) while COMPLIANCE_ANCHORED returns 82.00 / TIER_2 (unweighted mean over the
          inclusive 180-day window), a 5.40-point divergence with a tier flip.
        test_recipe:
          setup:
            - "Provider P1 ACTIVE (clock walked from 2026-04-01 forward via the clock endpoint)."
            - "Three COMPLETED coaching visits: 2026-04-10 score 60, 2026-05-20 score 88, 2026-06-30 score 98; each scheduled by coach-a and conducted by coach-b to satisfy segregation of duties; scheduled dates are more than 29 days apart so the coaching window never saturates."
            - "provider.open_finding_count == 0 at the moment the third visit is conducted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-04-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-04-10T00:00:00Z", focus_area: "ENVIRONMENT" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-10T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/coaching-visits/${v1}/conduct"
              payload: { visit_conducted_on: "2026-04-10T00:00:00Z", observation_score: 60, findings: "Cluttered nap area", critical_finding: false }
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-10T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-05-20T00:00:00Z", focus_area: "INTERACTIONS" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-20T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/coaching-visits/${v2}/conduct"
              payload: { visit_conducted_on: "2026-05-20T00:00:00Z", observation_score: 88, findings: "Strong language modeling", critical_finding: false }
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-20T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-06-30T00:00:00Z", focus_area: "CURRICULUM" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-30T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/coaching-visits/${v3}/conduct"
              payload: { visit_conducted_on: "2026-06-30T00:00:00Z", observation_score: 98, findings: "Curriculum fully sequenced", critical_finding: false }
              as: QualityCoach
              as_user_id: "coach-b"
          trigger:
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { qs_weighted: $.data.quality_score, qt_weighted: $.data.quality_tier, qv_weighted: $.data.quality_variant_applied }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fccn/compliance-reviews"
              payload: { provider_id: "${p1}", standard_codes: ["QS-7"], severity: "MODERATE", cap_due_on: "2026-08-31T00:00:00Z" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { rv1: $.data.id }
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "Nap-area layout corrected and staff retrained" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/close"
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { qs_anchored: $.data.quality_score, qt_anchored: $.data.quality_tier, qv_anchored: $.data.quality_variant_applied }
          assert:
            - "${qs_weighted} == 87.40"
            - "${qt_weighted} == TIER_1"
            - "${qv_weighted} == COACHING_WEIGHTED"
            - "${qs_anchored} == 82.00"
            - "${qt_anchored} == TIER_2"
            - "${qv_anchored} == COMPLIANCE_ANCHORED"
            - "${qs_weighted} - ${qs_anchored} == 5.40 over the identical three CoachingVisit rows"
            - "Provider.${p1}.open_finding_count == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: group_purchase_order_per_line_rounding_then_sum_mode_b
        grounds:
          - calculations.group_purchase_order_total
          - state_machines.GroupPurchaseOrder.OPEN_to_COMMITTED
          - entities.GroupPurchaseOrder.fields.subtotal_cents
          - entities.GroupPurchaseOrder.fields.insurance_admin_fee_cents
          - entities.GroupPurchaseOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (b), nested rounding where the order matters: the two lines discounted at 5 percent
          each land on x.4 cents, so rounding per line then summing yields subtotal_cents 27306 while
          summing gross then rounding once yields 27307 — the scaffold pins per-line rounding, and
          the INSURANCE admin fee is then rounded a second time off that pinned subtotal (819).
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with network_posture OPEN."
            - "One OPEN GroupPurchaseOrder in category INSURANCE with lines LIAB-BASE 2749 cents x 8 and ACCIDENT-RIDER 844 cents x 8 (total_quantity 16, which selects the 5 percent tier)."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["GROUP_PURCHASING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/group-purchase-orders"
              payload: { provider_id: "${p1}", category: "INSURANCE", lines: [{ sku: "LIAB-BASE", unit_price_cents: 2749, quantity: 8 }, { sku: "ACCIDENT-RIDER", unit_price_cents: 844, quantity: 8 }] }
              as: Provider
              as_user_id: "${p1}"
              captures: { go1: $.data.id }
          trigger:
            - call: "POST /fccn/group-purchase-orders/${go1}/commit"
              as: Provider
              as_user_id: "${p1}"
              captures: { sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "GroupPurchaseOrder.${go1}.total_quantity == 16"
            - "GroupPurchaseOrder.${go1}.discount_pct == 0.05"
            - "GroupPurchaseOrder.${go1}.subtotal_cents == 27306"
            - "GroupPurchaseOrder.${go1}.subtotal_cents != 27307 (the sum-then-round reading)"
            - "GroupPurchaseOrder.${go1}.insurance_admin_fee_cents == 819"
            - "GroupPurchaseOrder.${go1}.total_cents == 28125"
            - "GroupPurchaseOrder.${go1}.status == COMMITTED"

      - name: substitute_cost_fee_tier_keyed_on_pre_fee_subtotal_mode_c
        grounds:
          - calculations.substitute_assignment_cost
          - state_machines.SubstituteAssignment.CONFIRMED_to_COMPLETED
          - entities.SubstituteAssignment.fields.pre_fee_subtotal_cents
          - entities.SubstituteAssignment.fields.network_admin_fee_cents
          - entities.SubstituteAssignment.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (c), circular-looking dependency with a pinned evaluation order: total_cost_cents =
          pre_fee_subtotal_cents + network_admin_fee_cents, yet the fee percentage is keyed on
          pre_fee_subtotal_cents (14800 -> 10 percent -> 1480 -> total 16280). Keying it on
          total_cost_cents instead would select the 8 percent bracket and produce 1184 / 15984, so
          the assertion falsifies the wrong evaluation order.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE in county_tier STANDARD."
            - "Substitute S1 with credential_level NONE, hourly_rate_cents 3700, clearance_expires_on 2026-12-31, service_county_tiers [STANDARD]."
            - "One CONFIRMED SubstituteAssignment covering exactly 4 hours (2026-08-05 08:00 to 12:00 UTC), which lands pre_fee_subtotal_cents at 14800 — 200 cents below the 15000 fee-tier breakpoint."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Rosa Nunez", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 3700, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "ILLNESS", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa1: $.data.id }
            - call: "POST /fccn/substitute-assignments/${sa1}/accept"
              as: Substitute
              as_user_id: "${s1}"
          trigger:
            - call: "POST /fccn/substitute-assignments/${sa1}/complete"
              as: Provider
              as_user_id: "${p1}"
              captures: { pf: $.data.pre_fee_subtotal_cents, fee: $.data.network_admin_fee_cents, tc: $.data.total_cost_cents }
          assert:
            - "SubstituteAssignment.${sa1}.billable_hours == 4"
            - "SubstituteAssignment.${sa1}.pre_fee_subtotal_cents == 14800"
            - "SubstituteAssignment.${sa1}.network_admin_fee_cents == 1480"
            - "SubstituteAssignment.${sa1}.total_cost_cents == 16280"
            - "SubstituteAssignment.${sa1}.network_admin_fee_cents != 1184 (the tier-keyed-on-total reading)"
            - "SubstituteAssignment.${sa1}.staffing_status == COMPLETED"
            - "SubstituteAssignment.${sa1}.billing_status == ACCRUED"
            - "Substitute.${s1}.assignment_count_completed == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: membership_agreement_negotiation_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.MembershipAgreement.SENT_to_COUNTERED
          - state_machines.MembershipAgreement.COUNTERED_to_SENT
          - state_machines.MembershipAgreement.SENT_to_EXECUTED
          - entities.MembershipAgreement.fields.round_index
          - validations[priority=15]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          MembershipAgreement carries a true cycle SENT -> COUNTERED -> SENT whose only termination
          condition is the monotonically increasing round_index: the third counter leaves
          round_index at 3 and the fourth counter is refused with ERR_NEGOTIATION_ROUNDS_EXHAUSTED
          while the row stays in SENT, so the loop is bounded by a field, not by the graph shape.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 in PENDING_AGREEMENT after licensing verification."
            - "One MembershipAgreement in SENT at network_fee_pct 8.0 with round_index 0."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 8.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
          trigger:
            - call: "POST /fccn/membership-agreements/${ag1}/counter"
              payload: { proposed_network_fee_pct: 5.0 }
              as: Provider
              as_user_id: "${p1}"
              captures: { r1: $.data.round_index }
            - call: "POST /fccn/membership-agreements/${ag1}/revise"
              payload: { network_fee_pct: 7.0 }
              as: NetworkAdmin
            - call: "POST /fccn/membership-agreements/${ag1}/counter"
              payload: { proposed_network_fee_pct: 5.0 }
              as: Provider
              as_user_id: "${p1}"
              captures: { r2: $.data.round_index }
            - call: "POST /fccn/membership-agreements/${ag1}/revise"
              payload: { network_fee_pct: 6.5 }
              as: NetworkAdmin
            - call: "POST /fccn/membership-agreements/${ag1}/counter"
              payload: { proposed_network_fee_pct: 5.0 }
              as: Provider
              as_user_id: "${p1}"
              captures: { r3: $.data.round_index }
            - call: "POST /fccn/membership-agreements/${ag1}/revise"
              payload: { network_fee_pct: 5.5 }
              as: NetworkAdmin
              captures: { st3: $.data.status }
            - call: "POST /fccn/membership-agreements/${ag1}/counter"
              payload: { proposed_network_fee_pct: 5.0 }
              as: Provider
              as_user_id: "${p1}"
              captures: { err4: $.data.error_id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
              captures: { st_final: $.data.status }
          assert:
            - "${r1} == 1 and ${r2} == 2 and ${r3} == 3"
            - "${st3} == SENT"
            - "${err4} == ERR_NEGOTIATION_ROUNDS_EXHAUSTED with HTTP 409"
            - "MembershipAgreement.${ag1}.round_index == 3 after the refused fourth counter (unchanged)"
            - "${st_final} == EXECUTED"
            - "MembershipAgreement.${ag1}.network_fee_pct == 5.5"
            - "MembershipAgreement.${ag1}.proposed_network_fee_pct == null"
            - "Provider.${p1}.membership_status == ACTIVE and Provider.${p1}.network_fee_pct == 5.5"

      - name: substitute_assignment_parallel_status_dimensions_with_decline_reoffer_loop
        grounds:
          - state_machines.SubstituteAssignment.OFFERED_to_REQUESTED
          - state_machines.SubstituteAssignment.REQUESTED_to_OFFERED
          - state_machines.SubstituteAssignment.CONFIRMED_to_COMPLETED
          - state_machines.SubstituteAssignment.COMPLETED_to_COMPLETED
          - calculations.substitute_selection
          - entities.SubstituteAssignment.fields.staffing_status
          - entities.SubstituteAssignment.fields.billing_status
          - entities.SubstituteAssignment.fields.declined_substitute_ids
        distinguishing_aspect: |
          SubstituteAssignment is a different entity from MembershipAgreement and is non-linear in
          two ways at once: a decline cycle OFFERED -> REQUESTED -> OFFERED that re-runs the selector
          against a growing declined_substitute_ids set, and two independent status dimensions —
          invoicing moves billing_status ACCRUED -> INVOICED while staffing_status stays COMPLETED.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE in county_tier STANDARD."
            - "Two available substitutes serving STANDARD: S1 at hourly_rate_cents 2000 and S2 at 2400, both credential_level NONE with clearance_expires_on 2026-12-31."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Rosa Nunez", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2000, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Dana Okoye", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2400, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "VACATION", min_credential_level: "NONE" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa1: $.data.id, first_pick: $.data.substitute_id, st1: $.data.staffing_status }
            - call: "POST /fccn/substitute-assignments/${sa1}/decline"
              as: Substitute
              as_user_id: "${s1}"
              captures: { second_pick: $.data.substitute_id, st2: $.data.staffing_status }
            - call: "POST /fccn/substitute-assignments/${sa1}/accept"
              as: Substitute
              as_user_id: "${s2}"
              captures: { st3: $.data.staffing_status }
            - call: "POST /fccn/substitute-assignments/${sa1}/complete"
              as: Provider
              as_user_id: "${p1}"
              captures: { st4: $.data.staffing_status, bs4: $.data.billing_status, tc: $.data.total_cost_cents }
            - call: "POST /fccn/substitute-assignments/${sa1}/invoice"
              as: FiscalOfficer
              captures: { st5: $.data.staffing_status, bs5: $.data.billing_status }
          assert:
            - "${first_pick} == ${s1} (cheapest eligible candidate) and ${st1} == OFFERED"
            - "${second_pick} == ${s2} and ${st2} == OFFERED"
            - "SubstituteAssignment.${sa1}.declined_substitute_ids == [${s1}]"
            - "${st3} == CONFIRMED"
            - "${st4} == COMPLETED and ${bs4} == ACCRUED"
            - "${tc} == 10560"
            - "${st5} == COMPLETED and ${bs5} == INVOICED"
            - "Substitute.${s2}.assignment_count_completed == 1 and Substitute.${s1}.assignment_count_completed == 0"

  - rule_id: transitive_cascade
    instances:
      - name: quality_escalation_cascade_depth_four_review_provider_contract_claim_revenue
        grounds:
          - state_machines.ComplianceReview.CAP_REJECTED_to_ESCALATED_TO_LICENSING
          - state_machines.Provider.ACTIVE_to_PROBATION
          - state_machines.SubsidyContract.ACTIVE_to_SUSPENDED_FOR_QUALITY
          - state_machines.SubsidyClaim.DRAFT_to_HELD
          - calculations.provider_revenue_projection
          - entities.Provider.fields.projected_monthly_revenue_cents
          - entities.SubsidyClaim.fields.held_from_status
        distinguishing_aspect: |
          Depth-4 chain from a single escalate call, each hop caused by the previous one and by
          nothing else: the review reaching ESCALATED_TO_LICENSING moves the Provider to PROBATION;
          the Provider being on PROBATION moves its ACTIVE contract to SUSPENDED_FOR_QUALITY; the
          contract being suspended moves its DRAFT claim to HELD; the claim being HELD drops the two
          enrollments named on its lines out of the subsidy component, so
          projected_monthly_revenue_cents falls from 300000 to 102000.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with fixed_monthly_cost_cents 237000 and network_fee_pct 6.0."
            - "ACTIVE SubsidyContract at daily_rate_cents 4500 with contracted_slots 4, authorized_amount_cents 5000000."
            - "Two subsidy-certified enrollments CH-1 and CH-2 (slots committed) plus one private enrollment CH-3 at private_monthly_tuition_cents 102000, giving projected_monthly_revenue_cents 300000."
            - "One DRAFT SubsidyClaim for 2026-08 naming CH-1 and CH-2."
            - "One ComplianceReview in CAP_REJECTED with cap_rejection_count 2."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-3", family_name: "Cortez", days_per_week: 5, private_monthly_tuition_cents: 102000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e3: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }, { enrollment_id: "${e2}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
            - call: "POST /fccn/compliance-reviews"
              payload: { provider_id: "${p1}", standard_codes: ["QS-3", "QS-9"], severity: "SERIOUS", cap_due_on: "2026-08-31T00:00:00Z" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { rv1: $.data.id }
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "First corrective plan" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/reject-cap"
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "Second corrective plan" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/reject-cap"
              as: QualityCoach
              as_user_id: "coach-b"
          trigger:
            - call: "GET /fccn/providers/${p1}/revenue-model"
              as: NetworkAdmin
              captures: { rev_before: $.data.monthly_revenue_cents, sub_before: $.data.subsidy_component_cents }
            - call: "POST /fccn/compliance-reviews/${rv1}/escalate"
              as: NetworkAdmin
              captures: { rv_status: $.data.status }
            - call: "GET /fccn/providers/${p1}/revenue-model"
              as: NetworkAdmin
              captures: { rev_after: $.data.monthly_revenue_cents, sub_after: $.data.subsidy_component_cents, priv_after: $.data.private_component_cents, sust_after: $.data.sustainability }
          assert:
            - "${rev_before} == 300000 and ${sub_before} == 198000"
            - "${rv_status} == ESCALATED_TO_LICENSING (hop 0)"
            - "Provider.${p1}.membership_status == PROBATION and Provider.${p1}.network_posture == RESTRICTED (hop 1)"
            - "SubsidyContract.${c1}.status == SUSPENDED_FOR_QUALITY (hop 2)"
            - "SubsidyClaim.${cl1}.status == HELD, held_from_status == DRAFT, hold_reason == CONTRACT_SUSPENDED_FOR_QUALITY (hop 3)"
            - "${sub_after} == 0 and ${priv_after} == 102000 and ${rev_after} == 102000 (hop 4)"
            - "Provider.${p1}.projected_monthly_revenue_cents == 102000"
            - "${sust_after} == AT_RISK"
            - "SubsidyContract.${c1}.claimed_amount_cents == 0 (the held claim was never submitted, so no authorization was consumed or released)"
            - "Provider.${p1}.open_finding_count == 0"

      - name: enrollment_withdraw_cascade_depth_three_status_slot_release_revenue
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Enrollment.fields.slot_committed
          - entities.SubsidyContract.fields.committed_slots
          - entities.SubsidyContract.fields.available_slots
          - calculations.provider_revenue_projection
          - entities.Provider.fields.projected_monthly_revenue_cents
        distinguishing_aspect: |
          A different triggering transition (Enrollment ENROLLED -> WITHDRAWN rather than review
          escalation) drives a depth-3 chain: the status change releases the committed subsidy slot
          (slot_committed false, committed_slots 2 -> 1, available_slots 2 -> 3), and it is that
          released slot — not the status change itself — that removes the child from the subsidy
          component, taking projected_monthly_revenue_cents from 300000 to 201000.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with fixed_monthly_cost_cents 237000 and network_fee_pct 6.0."
            - "ACTIVE SubsidyContract at daily_rate_cents 4500 with contracted_slots 4, committed_slots 2, available_slots 2."
            - "Enrollments CH-1 and CH-2 subsidy-certified with slot_committed true, plus private CH-3 at 102000; projected_monthly_revenue_cents 300000."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-3", family_name: "Cortez", days_per_week: 5, private_monthly_tuition_cents: 102000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: NetworkAdmin
              captures: { cm_before: $.data.committed_slots, av_before: $.data.available_slots }
            - call: "POST /fccn/enrollments/${e1}/withdraw"
              payload: { exit_on: "2026-08-15T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { en_status: $.data.status, sc_after: $.data.slot_committed }
            - call: "GET /fccn/providers/${p1}/revenue-model"
              as: NetworkAdmin
              captures: { rev_after: $.data.monthly_revenue_cents, sub_after: $.data.subsidy_component_cents }
          assert:
            - "${cm_before} == 2 and ${av_before} == 2"
            - "${en_status} == WITHDRAWN and ${sc_after} == false (hop 1 and hop 2)"
            - "Enrollment.${e1}.exit_on == 2026-08-15T00:00:00Z"
            - "SubsidyContract.${c1}.committed_slots == 1 and SubsidyContract.${c1}.available_slots == 3 (hop 2)"
            - "${sub_after} == 99000 and ${rev_after} == 201000 (hop 3)"
            - "Provider.${p1}.projected_monthly_revenue_cents == 201000"
            - "SubsidyContract.${c1}.committed_slots + SubsidyContract.${c1}.available_slots == 4"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_submit_held_state_error_beats_authorization_exceeded_fiscal_error
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - errors[ERR_INVALID_CLAIM_STATE]
          - errors[ERR_CONTRACT_AUTHORIZATION_EXCEEDED]
          - state_machines.SubsidyClaim.DRAFT_to_HELD
          - entities.SubsidyContract.fields.authorized_amount_cents
        distinguishing_aspect: |
          Pairs the `state` category at priority 9 against the `business_fiscal` category at
          priority 16 on one request: the claim is HELD (invalid from-state for submit) AND its
          provisional amount 153000 would blow the contract's authorized_amount_cents of 100000.
          A naive implementation that checks the money first returns
          ERR_CONTRACT_AUTHORIZATION_EXCEEDED (402); the ordered ladder must return
          ERR_INVALID_CLAIM_STATE (409).
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE; SubsidyContract at daily_rate_cents 4500, absence_rate_pct 50, authorized_amount_cents 100000, claimed_amount_cents 0."
            - "DRAFT SubsidyClaim for 2026-08 whose PROVISIONAL_ADVANCE amount is 153000 (over the 100000 authorization)."
            - "A ComplianceReview escalated to licensing, which cascades the contract to SUSPENDED_FOR_QUALITY and the claim to HELD."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 100000, period_start_on: "2026-08-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 18, absent_days: 4 }, { enrollment_id: "${e2}", attended_days: 10, absent_days: 2 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
            - call: "POST /fccn/compliance-reviews"
              payload: { provider_id: "${p1}", standard_codes: ["QS-3"], severity: "SERIOUS", cap_due_on: "2026-08-31T00:00:00Z" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { rv1: $.data.id }
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "First plan" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/reject-cap"
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "Second plan" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/reject-cap"
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /fccn/compliance-reviews/${rv1}/escalate"
              as: NetworkAdmin
          trigger:
            - call: "POST /fccn/subsidy-claims/${cl1}/submit"
              as: Provider
              as_user_id: "${p1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_CLAIM_STATE with HTTP 409 (priority 9 wins)"
            - "${err_id} != ERR_CONTRACT_AUTHORIZATION_EXCEEDED and the response is not HTTP 402 (priority 16 must not be reached)"
            - "SubsidyClaim.${cl1}.status == HELD (unchanged) and submitted_at == null"
            - "SubsidyClaim.${cl1}.provisional_amount_cents == 0 (never computed)"
            - "SubsidyContract.${c1}.claimed_amount_cents == 0 (unchanged)"

      - name: assignment_clearance_safety_error_beats_interval_overlap_temporal_error
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_SUBSTITUTE_CLEARANCE_EXPIRED]
          - errors[ERR_SUBSTITUTE_INTERVAL_CONFLICT]
          - endpoints[POST /fccn/substitutes/{id}/clearance]
          - calculations.substitute_selection
        distinguishing_aspect: |
          A different error-category pair from instance (a): `business_safety` at priority 12 against
          `business_temporal` at priority 13. The requested substitute simultaneously has a lapsed
          clearance and an already-CONFIRMED assignment that overlaps the requested window, so an
          implementation that runs the cheap interval scan first returns
          ERR_SUBSTITUTE_INTERVAL_CONFLICT (409) instead of the required
          ERR_SUBSTITUTE_CLEARANCE_EXPIRED (422).
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE in county_tier STANDARD."
            - "Substitute S1 serving STANDARD, hourly_rate_cents 2000, clearance_expires_on 2026-12-31."
            - "Assignment A for 2026-08-10T08:00Z-14:00Z accepted by S1 (CONFIRMED)."
            - "S1's clearance then back-dated to 2026-08-05 by the network admin, so it is lapsed relative to the clock."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
