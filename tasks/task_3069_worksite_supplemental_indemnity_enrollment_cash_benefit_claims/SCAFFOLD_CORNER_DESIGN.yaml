            - "After rejecting the pending document: ${err_b2} == ERR_INSUFFICIENT_DOCUMENTS (no accepted DIAGNOSIS_PROOF / ATTENDING_PHYSICIAN_STATEMENT, and no documents remain pending)"
            - "Claim.${clb1}.status remains UNDER_REVIEW after both rejections"

  # ===========================================================================
  - section: validations
