          - errors.ERR_SOD_SELF_REVIEW
        distinguishing_aspect: |
          The single review request violates the seat rule at priority 17 (the named reviewer is RECUSED)
          and the segregation-of-duties rule at priority 18 (the reviewer is also the item's preparer),
          and the two rules sit adjacent in the ordering, so only a genuinely ordered validator returns
          ERR_MEMBER_SEAT_INVALID. Reinstating the member and repeating the identical request must then
          flip the answer to ERR_SOD_SELF_REVIEW, proving both rules are live and correctly ranked
          rather than one masking the other.
