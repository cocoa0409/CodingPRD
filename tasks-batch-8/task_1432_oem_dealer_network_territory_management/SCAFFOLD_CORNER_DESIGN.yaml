            - "Dealer.${d}.status == ACTIVE (unchanged)"

      - name: terminate_without_low_scorecard_quarters_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Dealer.ACTIVE_to_TERMINATED"
          - "errors[ERR_SCORECARD_THRESHOLD_NOT_MET]"
        distinguishing_aspect: "Termination gate: an ACTIVE dealer with no closed quarters (fewer than two consecutive STRICT scores < 60) cannot be terminated."
        test_recipe:
          setup: ["Dealer DL-TM1 ACTIVE; no sales targets at all"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer TM1", dealer_code: "DL-TM1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-TM1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-TM2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-TM1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
