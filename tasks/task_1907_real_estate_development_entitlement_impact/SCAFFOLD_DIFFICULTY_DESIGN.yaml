  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: referendum_qualified_cascades_da_repeal_vesting_invalidate
        grounds:
          - state_machines.ReferendumPetition.FILED_to_CERTIFIED_QUALIFIED
          - state_machines.DevelopmentAgreement.ADOPTED_to_REPEALED
          - entities.DevelopmentAgreement.fields.vesting_status
        distinguishing_aspect: |
          Depth-3 cascade triggered by petition certification: certify
          (ReferendumPetition FILED→CERTIFIED_QUALIFIED) → mutates parent
          DevelopmentAgreement (ADOPTED→REPEALED) → whose side-effect mutates
          vesting_status (→INVALIDATED). Each link is caused by the previous
          link, and the trigger differs from the appeal cascade.
        test_recipe:
          setup:
            - "Application APPROVED; DA adopted with registered_voters=12500 (threshold 1250); petition filed in-window with 1250 valid signatures"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "RefCo", contact_email: "r@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Ref", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/decision-authorities"
              payload: { full_name: "Council", body: "CITY_COUNCIL" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/advance-to-decision"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { app_v: $.data.version }
            - call: "POST /entitlement/applications/${app_id}/decisions"
              payload: { decision: "APPROVE", decided_by: "${auth_id}", expected_application_version: "${app_v}" }
              as: DecisionAuthority
              as_user_id: "${auth_id}"
            - call: "POST /entitlement/applications/${app_id}/development-agreements"
              payload: { agreement_number: "ORD-1", adoption_date: "2026-08-05T00:00:00Z", vesting_term_years: 5, registered_voters: 12500 }
              as: DecisionAuthority
