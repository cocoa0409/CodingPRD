  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_order_confirm_state_beats_credit_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_ORDER_NOT_CONFIRMABLE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (p5) vs business_fiscal (p10): confirming a
          CANCELLED order whose total also exceeds the customer's credit limit
          must surface ERR_ORDER_NOT_CONFIRMABLE (state) — never
          ERR_CREDIT_LIMIT_EXCEEDED (fiscal).
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 1000; product list 10000; order with line qty 1 (total 10000 > limit 1000); order then cancelled while DRAFT"
          setup_api_calls:
            - call: "POST /motion/products"
