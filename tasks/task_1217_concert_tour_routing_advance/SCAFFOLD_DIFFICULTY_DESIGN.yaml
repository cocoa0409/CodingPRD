  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: show_cancel_depth3_cascade
        grounds:
          - state_machines.Show.CONFIRMED_to_CANCELLED
          - state_machines.PromoterHold.ACCEPTED_to_WITHDRAWN
          - entities.Venue.fields.booked_dates
          - entities.Tour.fields.projected_gross_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by show cancel: (1) Show.status CONFIRMED→CANCELLED
          mutates (2) PromoterHold.status ACCEPTED→WITHDRAWN, whose withdrawal then
          mutates (3) Venue.booked_dates (release show_date), whose release then
          (4) Tour.projected_* recomputes because Show exits the projection set.
          Each link is caused by the previous, not by the original cancel call.
        test_recipe:
          setup:
            - "Show in CONFIRMED with ACCEPTED hold; venue.booked_dates contains show_date"
            - "Tour.projected_gross_cents includes this show's contribution"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TCas", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "DEN", metro_name: "Denver", country_code: "US", radius_miles: 60, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Red Rocks", capacity: 9000, base_rent_cents: 500000, curfew_local_time: "23:00", available_dates: ["2026-08-15"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-15", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 10000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 2000000, versus_pct: 80 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "GET /tours/${tour_id}/venues/${venue_id}"
              payload: {}
              as: TourManager
              captures: { booked_pre: $.data.booked_dates }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { gross_pre: $.data.projected_gross_cents }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${show_id}/cancel"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/holds/${hold_id}"
              payload: {}
              as: TourManager
              captures: { hst: $.data.status }
            - call: "GET /tours/${tour_id}/venues/${venue_id}"
              payload: {}
              as: TourManager
              captures: { booked_post: $.data.booked_dates }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { gross_post: $.data.projected_gross_cents }
          assert:
            - "hst == WITHDRAWN (link 1→2: cancel cascades to hold)"
            - "booked_pre contains 2026-08-15; booked_post does not (link 2→3: withdrawal releases date)"
            - "gross_pre == 5850000 (9000*10000*0.65); gross_post == 0 (link 3→4: removal from projection set)"

      - name: hold_accept_depth2_cascade
        grounds:
          - state_machines.PromoterHold.PENDING_to_ACCEPTED
          - state_machines.Show.HOLD_REQUESTED_to_HOLD_PLACED
          - entities.Show.fields.capacity
        distinguishing_aspect: |
          Depth-2 chain triggered by hold accept: (1) PromoterHold PENDING→ACCEPTED
          mutates (2) Show.status HOLD_REQUESTED→HOLD_PLACED, whose transition then
          (3) snapshots Show.capacity from Venue.capacity and (4) recomputes
          Show.gross_potential_cents. Different trigger from the cancel chain.
        test_recipe:
          setup:
            - "Show in HOLD_REQUESTED, no accepted hold yet"
            - "Show.capacity not yet snapshotted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
