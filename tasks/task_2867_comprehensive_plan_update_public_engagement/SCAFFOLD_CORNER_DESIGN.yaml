              captures: { e9: $.data.error_id }
            - call: "GET /planning/plan-updates/${pu}/compliance-summary"
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "step 1 (four elements approved, zero allocation rows): HTTP 409 with error_id == \"ERR_REQUIRED_ELEMENT_MISSING\" - inside priority 75 the element requirement is reported before the allocation requirement"
            - "step 4 (all five elements approved, zero allocation rows): HTTP 409 with error_id == \"ERR_ALLOCATION_INCOMPLETE\""
            - "step 8 (three of four TIER_ORDER tiers present): HTTP 409 with error_id == \"ERR_ALLOCATION_INCOMPLETE\" again - the rule counts tiers, it does not merely check for a non-empty allocation set"
            - "creating the ABOVE_MODERATE row on the POLICY pool of 7115 yields tier_capacity_units == 4716 and shortfall_units == 4284, so the plan's housing_shortfall_total is non-zero from this point on"
            - "step 11 (one OPEN consistency link AND a 4284-unit shortfall): HTTP 409 with error_id == \"ERR_CONSISTENCY_UNRESOLVED\" - priority 76 outranks priority 80"
            - "step 13 (link reconciled, no environmental review AND the same shortfall): HTTP 409 with error_id == \"ERR_ENVIRONMENTAL_REVIEW_MISSING\" - priority 77 outranks priority 80"
            - "step 18 (review CIRCULATED, shortfall still 4284): HTTP 409 with error_id == \"ERR_HOUSING_SHORTFALL\""
            - "adopting the TREND scenario supersedes the POLICY one, raises land_capacity_units to 11700, re-runs the waterfall so ABOVE_MODERATE gets tier_capacity_units == 9300 and shortfall_units == 0, and the plan's housing_shortfall_total becomes 0"
            - "step 22 (shortfall cleared, equity_share_pct still 0.0): HTTP 409 with error_id == \"ERR_EQUITY_TARGET_NOT_MET\""
            - "completing the workshop sets the activity's equity_share_pct == 40.0 (2 of 5 respondents in UNDERREPRESENTED_GROUPS at BASE_WEIGHT, LOW_INCOME and RENTER; GENERAL and SENIOR do not count) and lifts the plan's equity_share_pct to exactly 40.0"
            - "step 31 then SUCCEEDS with HTTP 200: status == \"STATE_SUBMITTED\", state_review_status == \"SUBMITTED\", resubmission_count == 0 (the first submission is not a resubmission)"
            - "step 32, the identical call repeated: HTTP 409 with error_id == \"ERR_PLAN_NOT_DRAFTING\" - the priority-50 state check fires and none of the seven readiness rules is consulted"
            - "after each DEFICIENT determination the named element is APPROVED -> REVISION_REQUESTED with revision_round == 1, so no element ever reaches MAX_REVISION_ROUNDS and no ESCALATED override is ever needed"
            - "resubmission 1 returns HTTP 200 with status == \"STATE_SUBMITTED\" and resubmission_count == 1; resubmission 2 returns HTTP 200 with resubmission_count == 2"
            - "step 47, the third resubmission with every readiness condition satisfied: HTTP 409 with error_id == \"ERR_RESUBMISSION_LIMIT_EXCEEDED\" - the guard is the strict resubmission_count < MAX_RESUBMISSIONS (2 < 2 is false), so an implementation using <= would wrongly accept it"
            - "the plan remains status == \"STATE_DEFICIENT\" with resubmission_count == 2 and version unchanged by the refused call"
            - "the closing compliance-summary reports compliance_posture == \"FROZEN\", state_review_status == \"DEFICIENT\", required_elements_complete_count == 5, missing_element_types == [], open_consistency_link_count == 0, housing_shortfall_total == 0, equity_share_pct == 40.0, land_capacity_units == 11700 and capacity_gap_units == 0"

      - name: venue_equity_eligibility_is_conditional_on_activity_type
        claim_type: satisfaction_to_pass
        grounds:
          - state_machines.EngagementActivity.null_to_SCHEDULED.preconditions
          - errors.ERR_VENUE_NOT_EQUITY_ELIGIBLE
        distinguishing_aspect: |
          ERR_VENUE_NOT_EQUITY_ELIGIBLE is a *conditional* rule: transit_served and ada_accessible
          are only required when activity_type == TARGETED_OUTREACH. The obvious implementation
          mistake is to make the venue check unconditional (rejecting a plain WORKSHOP at a
          non-accessible hall) or to require only one of the two flags. This instance holds the
          venue fixed and varies the activity type, then holds the activity type fixed and varies
          the flags one at a time, so the truth table of the guard is pinned in both directions:
          a WORKSHOP passes at a venue with both flags false, while TARGETED_OUTREACH at that same
          venue is refused; TARGETED_OUTREACH is still refused when only ada_accessible is true and
          when only transit_served is true, and passes only when both are true. The passing outreach
          row is also the only place the STANDARD/OUTREACH_WEIGHTED variant assignment is observed
          at creation time - before any participation record exists to exercise it - and the SURVEY
          row proves the rule is not reached at all when venue_id is absent.
        test_recipe:
          setup:
            - "One plan and four venues that differ only in their two equity flags: neither, ada only, transit only, both."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Basement hall - neither flag", seated_capacity: 60, turnover_buffer_minutes: 0, ada_accessible: false, transit_served: false }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_none: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Ramped annex - ada only", seated_capacity: 60, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: false }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_ada: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Transit plaza room - transit only", seated_capacity: 60, turnover_buffer_minutes: 0, ada_accessible: false, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_tra: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Center - both flags", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_both: $.data.id }
          trigger:
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "WORKSHOP", title: "Workshop at the non-accessible hall", start_at: "2026-09-10T18:00:00Z", end_at: "2026-09-10T20:00:00Z", venue_id: "${v_none}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { a_ws: $.data.id, a_ws_var: $.data.weighting_variant }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "TARGETED_OUTREACH", title: "Outreach at the non-accessible hall", start_at: "2026-09-11T18:00:00Z", end_at: "2026-09-11T20:00:00Z", venue_id: "${v_none}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_none: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "TARGETED_OUTREACH", title: "Outreach at the ada-only annex", start_at: "2026-09-12T18:00:00Z", end_at: "2026-09-12T20:00:00Z", venue_id: "${v_ada}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_ada: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "TARGETED_OUTREACH", title: "Outreach at the transit-only room", start_at: "2026-09-13T18:00:00Z", end_at: "2026-09-13T20:00:00Z", venue_id: "${v_tra}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_tra: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "TARGETED_OUTREACH", title: "Outreach at the community center", start_at: "2026-09-14T18:00:00Z", end_at: "2026-09-14T20:00:00Z", venue_id: "${v_both}", interpretation_offered: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { a_to: $.data.id, a_to_var: $.data.weighting_variant, a_to_st: $.data.status }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "SURVEY", title: "Citywide mailed survey", start_at: "2026-09-15T00:00:00Z", end_at: "2026-09-30T00:00:00Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { a_sv: $.data.id, a_sv_var: $.data.weighting_variant }
            - call: "GET /planning/engagement-activities?plan_update_id=${pu}&activity_type=TARGETED_OUTREACH"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "the WORKSHOP at the venue with both flags false is CREATED (HTTP 201) with status \"SCHEDULED\" and weighting_variant == \"STANDARD\" - the equity check does not apply to WORKSHOP"
            - "TARGETED_OUTREACH at that same venue returns HTTP 409 with error_id == \"ERR_VENUE_NOT_EQUITY_ELIGIBLE\""
            - "TARGETED_OUTREACH at the ada-only venue returns the same error_id - ada_accessible alone is not sufficient"
            - "TARGETED_OUTREACH at the transit-only venue returns the same error_id - transit_served alone is not sufficient"
            - "TARGETED_OUTREACH at the venue with both flags true is CREATED (HTTP 201) with status \"SCHEDULED\", weighting_variant == \"OUTREACH_WEIGHTED\", record_count == 0, total_weighted_count == 0.0 and equity_share_pct == 0.0"
            - "the SURVEY with no venue_id is CREATED with weighting_variant == \"STANDARD\"; the venue rule is never evaluated because there is no venue"
            - "the filtered list returns total_count == 1 - none of the three refused outreach rows was persisted"
            - "all four venues remain unchanged; a refused activity never mutates the venue"

      - name: readiness_rules_never_run_before_the_role_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_20_role
          - validations.priority_30_path_existence
        distinguishing_aspect: |
          The generic statement that the authorization band (10-30) outranks every business band.
        excluded_because:
          difficulty_instance: role_check_outranks_path_existence_on_inventory_certify
          rationale: |
            That instance already pins the counter-intuitive half of the ordering - a wrong role
            against a non-existent path id returns 403 ERR_ROLE_NOT_PERMITTED, not 404 - which is
            the only part of the 10/20/30 ordering an implementation can plausibly get wrong (most
            frameworks resolve the path parameter before the role guard). Restating it here against
            a different endpoint would add no discriminating power; the corner sweep instead
            exercises the far end of the table, where priorities 75-85 must be ordered among
            themselves (see state_submission_readiness_gauntlet).

      - name: consistency_graph_integrity_triad
        claim_type: violation_to_error
        grounds:
          - validations.priority_71_graph_integrity
          - errors.ERR_SELF_CONSISTENCY_LINK
          - errors.ERR_DUPLICATE_CONSISTENCY_LINK
          - errors.ERR_CONSISTENCY_CYCLE
        distinguishing_aspect: |
          Priority 71 bundles three different failures behind one priority number, and they do not
          even share an HTTP status: the self-edge is 422 (a malformed request - the two ids are the
          same) while the duplicate edge and the cycle are 409 (a conflict with stored state). An
          implementation that hangs all three off one handler will almost certainly return one
          status for all three. This instance also pins the two properties of the cycle check that
          are easy to get wrong: the edge set is DIRECTED, so after A->B exists the reverse edge
          B->A is a two-node cycle and must be refused while a second forward edge A->C is fine;
          and the check spans the whole path, so a three-edge cycle A->B->C->A is caught at the
          closing edge, not at the edge that first created a chain. The duplicate check is likewise
          directed and pair-scoped, not element-scoped: A->B twice is a duplicate even with a
          different dependency_type, while A->C after A->B is not.
        test_recipe:
          setup:
            - "One plan with four DRAFT elements: LAND_USE (A), TRANSPORTATION (B), PARKS (C) and INFRASTRUCTURE (D)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Centers and corridors.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { a: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Mobility Element", draft_body: "Network plan.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { b: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Open space standards.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { c: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "INFRASTRUCTURE", title: "Public Facilities Element", draft_body: "Capacity phasing.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { d: $.data.id }
          trigger:
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${a}", target_element_id: "${a}", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_self: $.data.error_id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${a}", target_element_id: "${b}", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk_ab: $.data.id, lk_ab_st: $.data.status }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${a}", target_element_id: "${b}", dependency_type: "FUNDING_ASSUMPTION" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_dup: $.data.error_id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${b}", target_element_id: "${a}", dependency_type: "LEVEL_OF_SERVICE" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_cyc2: $.data.error_id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${b}", target_element_id: "${c}", dependency_type: "CAPACITY_ASSUMPTION" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk_bc: $.data.id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${c}", target_element_id: "${a}", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_cyc3: $.data.error_id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${c}", target_element_id: "${d}", dependency_type: "LEVEL_OF_SERVICE" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk_cd: $.data.id }
            - call: "GET /planning/consistency-links?source_element_id=${a}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningDirector
              as_user_id: "director-1"
          assert:
            - "the self-edge A->A returns HTTP 422 with error_id == \"ERR_SELF_CONSISTENCY_LINK\" - note the 422, not 409"
            - "A->B is created with HTTP 201 and status \"OPEN\""
            - "the second A->B, with a different dependency_type, returns HTTP 409 with error_id == \"ERR_DUPLICATE_CONSISTENCY_LINK\" - uniqueness is on the (source, target) pair and ignores dependency_type"
            - "the reverse edge B->A returns HTTP 409 with error_id == \"ERR_CONSISTENCY_CYCLE\" - a two-node cycle, so the check is directed and is not satisfied by merely rejecting duplicates"
            - "B->C is created (HTTP 201), extending the chain A->B->C without closing anything"
            - "C->A returns HTTP 409 with error_id == \"ERR_CONSISTENCY_CYCLE\" - the three-edge cycle is detected at the closing edge, which requires walking the graph rather than looking one hop back"
            - "C->D is created (HTTP 201): a fourth node hanging off the chain is not a cycle"
            - "the list filtered by source_element_id == A returns total_count == 1 (only the surviving A->B row); none of the four refused edges was persisted"
            - "the plan reports open_consistency_link_count == 3 (A->B, B->C, C->D), so the refused edges never touched the denormalised counter"

      - name: scope_uniqueness_triad
        claim_type: violation_to_error
        grounds:
          - validations.priority_72_scope_uniqueness
          - errors.ERR_DUPLICATE_ELEMENT_TYPE
          - errors.ERR_DUPLICATE_ALLOCATION_TIER
          - errors.ERR_DUPLICATE_PARTICIPATION
        distinguishing_aspect: |
          Three uniqueness constraints share priority 72, and each one is scoped to a DIFFERENT
          parent: PlanElement is unique per (plan_update_id, element_type), HousingAllocation per
          (plan_update_id, income_tier), ParticipationRecord per (activity_id, respondent_ref) -
          the last one keyed on the activity, not on the plan. A global unique index on
          element_type, income_tier or respondent_ref would pass a single-plan test and fail here,
          because this instance creates a SECOND plan and a SECOND activity and re-uses every key
          in the new scope, which must succeed. It also fixes the surprising half of the
          participation rule: the same respondent_ref may appear once per activity, so the same
          person can be recorded at a workshop and again at a survey of the same plan, and the
          duplicate is only refused within one activity.
        test_recipe:
          setup:
            - "Two plans, each with a LAND_USE element; the first plan additionally has a venue and two SCHEDULED activities (a workshop and a survey)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu1: $.data.id }
            - call: "POST /planning/plan-updates"
              payload: { title: "Riverside 2045 General Plan", jurisdiction_code: "CA-0452", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu2: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu1}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Centers and corridors.", policy_count: 4 }
              as: PlanningStaff
