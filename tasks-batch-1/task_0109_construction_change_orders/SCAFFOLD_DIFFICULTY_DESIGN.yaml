            - "Project.${proj}.retainage_held_cents == 0  (full release zeroes held)"
            - "SovLine.${sov1}.retainage_withheld_to_date_cents == 0 and SovLine.${sov2}.retainage_withheld_to_date_cents == 0"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payapp_certify_blocked_by_open_architect_rfi
        grounds:
          - state_machines.PayApplication.SUBMITTED_to_CERTIFIED
          - entities.Rfi.fields.ball_in_court
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          Entity pair PayApplication -> Rfi: a SUBMITTED PayApplication cannot be
          certified while any Rfi for the same project is OPEN with ball_in_court
          == ARCHITECT. Certify is rejected; after the architect answers the RFI
          (ball passes to CONTRACTOR), certify succeeds.
