        claim_type: violation_to_error
        grounds: ["errors[ERR_DEADLINE_PASSED]"]
        distinguishing_aspect: "POST /applications/{id}/submit with plan=REGULAR after rd_deadline_iso returns ERR_DEADLINE_PASSED (priority 12). Distinct from §1.8 priority instance because no second conflicting validation fires (letter is SUBMITTED)."
