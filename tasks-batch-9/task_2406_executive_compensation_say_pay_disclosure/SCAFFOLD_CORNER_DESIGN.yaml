      - name: an_unauthenticated_request_is_rejected_before_any_role_or_state_check
        claim_type: triggerability
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_1_ERR_UNAUTHENTICATED
          - cross_cutting.authentication
        distinguishing_aspect: |
          Authentication is the outermost gate at priority 1: a read with no credential returns
          ERR_UNAUTHENTICATED (401) rather than the 403 a wrong role would give or the 404 an unknown id would give —
          the same call with a bad id and no credential still reports 401, proving the check runs before resolution.
        test_recipe:
          setup:
            - "A single registered issuer company, ACME."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
          trigger:
            - call: "GET /exec-comp/companies/${acme_id}"
              as: NONE
              captures: { err_auth: $.data.error_id }
            - call: "GET /exec-comp/companies/00000000-0000-4000-8000-000000000111"
              as: NONE
              captures: { err_auth_404: $.data.error_id }
          assert:
            - "${err_auth} == 'ERR_UNAUTHENTICATED' with HTTP status 401"
            - "${err_auth_404} == 'ERR_UNAUTHENTICATED' with HTTP status 401 — not ERR_COMPANY_NOT_FOUND"
            - "no Company row is read or modified by either call"

