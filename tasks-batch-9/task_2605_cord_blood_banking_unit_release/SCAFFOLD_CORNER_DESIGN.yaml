      - name: corner_payment_above_the_residual_is_refused_then_the_exact_residual_pays_the_invoice
        claim_type: conditional_action
        grounds: "§1.4 priority 35 ERR_PAYMENT_EXCEEDS_BALANCE (422) 'a payment's amount_cents does not exceed the invoice's residual'; §1.5 POST /cbb/storage-invoices/{id}/payments side effects (amount_paid_cents +=, invoice -> PAID at zero residual, lifetime_paid_cents +=, account -> ACTIVE at zero balance)."
        distinguishing_aspect: "Conditional action taken one cent either side of its condition: 18226 is refused against an 18225 residual and 18225 is accepted, so the boundary is exact and the accepted call's full side-effect set is observable in one response."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "One PRIVATE_FAMILY enrollment with a 5-year StorageAccount (PRORATED_TERMINATION) prepaid through 2027-08-01T00:00:00Z."
            - "One ISSUED invoice for the full year: base_line 18000 + admin_line 225 = amount_due_cents 18225, amount_paid_cents 0."
            - "The account is still ACTIVE and no nightly run has been executed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/storage-accounts"
              payload: { enrollment_id: "${enr_id}", billing_contact_email: "avery@example.com", plan_term_years: 5, prepaid_through_date: "2027-08-01T00:00:00Z" }
              as: BillingAdministrator
              as_user_id: "ba-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /cbb/storage-invoices"
              payload: { account_id: "${acct_id}", billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2027-08-01T00:00:00Z", prorated_days: 365 }
              as: BillingAdministrator
              as_user_id: "ba-001"
              captures: { inv_id: "$.data.id" }
          trigger:
            - call: "POST /cbb/storage-invoices/${inv_id}/payments"
              payload: { amount_cents: 18226, payment_reference: "PAY-OVER" }
              as: BillingAdministrator
              as_user_id: "ba-001"
            - call: "POST /cbb/storage-invoices/${inv_id}/payments"
              payload: { amount_cents: 18225, payment_reference: "PAY-EXACT" }
              as: BillingAdministrator
              as_user_id: "ba-001"
            - call: "GET /cbb/storage-accounts/${acct_id}"
              as: BillingAdministrator
              as_user_id: "ba-001"
          assert:
            - "the invoice was issued with amount_due_cents == 18225, late_fee_line_cents == 0 and status == ISSUED"
            - "the first payment returns HTTP 422 with error_id ERR_PAYMENT_EXCEEDS_BALANCE and writes nothing"
            - "the second payment returns HTTP 200 with data.amount_paid_cents == 18225 and data.status == PAID"
            - "account read: balance_cents == 0, lifetime_paid_cents == 18225, status == ACTIVE"
            - "the refused payment did not contribute to lifetime_paid_cents (18225, not 36451)"

      - name: corner_reservation_action_endpoints_enforce_their_preconditions
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: reservation_fork_join_divergent_side_effect_sets
          rationale: "That §1.8 instance drives confirm, decline, cancel and release on the same unit, asserting each action's preconditions and its divergent side-effect set, which is the action-endpoint claim for the richest action family in the scaffold."

      - name: corner_confirmatory_test_links_itself_to_its_reservation
        claim_type: cross_reference_link
        excluded_because:
          difficulty_instance: dose_variant_divergence_pre_cryo_vs_post_thaw
          rationale: "The CONFIRMATORY QualityTest -> Reservation association (both rows must exist, confirmatory_test_id and post_thaw_dose_x1e7_per_kg written on the reservation) is created and asserted there as the precondition of the POST_THAW variant."


  - section: errors
    instances:
      - name: corner_every_entity_read_with_an_unknown_id_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds: "§1.4 priority 6 maps each path id to its own 404 code; §1.6 declares ERR_ENROLLMENT_NOT_FOUND, ERR_STORAGE_ACCOUNT_NOT_FOUND, ERR_KIT_NOT_FOUND, ERR_COLLECTION_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_PROCESSING_RUN_NOT_FOUND, ERR_QUALITY_TEST_NOT_FOUND, ERR_SCREENING_NOT_FOUND, ERR_TANK_NOT_FOUND, ERR_EXCURSION_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_INVOICE_NOT_FOUND and ERR_RESERVATION_NOT_FOUND."
        distinguishing_aspect: "One sweep proving all thirteen entity-specific 404 codes are distinct and reachable: the same fabricated UUID is offered to every by-id read, and each endpoint must answer with ITS entity's code, never a shared generic 404."
        test_recipe:
          setup:
            - "Completely empty database; logical clock at 2026-08-01T00:00:00Z."
            - "Every read below uses the same fabricated id 00000000-0000-0000-0000-0000000000ff."
            - "Roles are chosen so no ownership rule (priority 3 or 4) can pre-empt the 404."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cbb/enrollments/00000000-0000-0000-0000-0000000000ff"
              as: IntakeCoordinator
              as_user_id: "ic-001"
            - call: "GET /cbb/storage-accounts/00000000-0000-0000-0000-0000000000ff"
              as: BillingAdministrator
              as_user_id: "ba-001"
            - call: "GET /cbb/collection-kits/00000000-0000-0000-0000-0000000000ff"
              as: IntakeCoordinator
              as_user_id: "ic-001"
            - call: "GET /cbb/collections/00000000-0000-0000-0000-0000000000ff"
              as: ProcessingTechnologist
              as_user_id: "pt-001"
            - call: "GET /cbb/units/00000000-0000-0000-0000-0000000000ff"
              as: ProcessingTechnologist
              as_user_id: "pt-001"
            - call: "GET /cbb/processing-runs/00000000-0000-0000-0000-0000000000ff"
              as: ProcessingTechnologist
              as_user_id: "pt-001"
            - call: "GET /cbb/quality-tests/00000000-0000-0000-0000-0000000000ff"
              as: ProcessingTechnologist
              as_user_id: "pt-001"
            - call: "GET /cbb/maternal-screenings/00000000-0000-0000-0000-0000000000ff"
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "GET /cbb/storage-tanks/00000000-0000-0000-0000-0000000000ff"
              as: FacilitiesEngineer
              as_user_id: "fe-001"
            - call: "GET /cbb/temperature-excursions/00000000-0000-0000-0000-0000000000ff"
              as: FacilitiesEngineer
              as_user_id: "fe-001"
            - call: "GET /cbb/registry-listings/00000000-0000-0000-0000-0000000000ff"
              as: RegistryOperator
              as_user_id: "ro-001"
            - call: "GET /cbb/storage-invoices/00000000-0000-0000-0000-0000000000ff"
              as: BillingAdministrator
              as_user_id: "ba-001"
            - call: "GET /cbb/reservations/00000000-0000-0000-0000-0000000000ff"
              as: MedicalDirector
              as_user_id: "md-001"
          assert:
            - "every one of the thirteen calls returns HTTP 404 with the single-key envelope {error: {error_id: ...}}"
            - "the codes are, in call order, ERR_ENROLLMENT_NOT_FOUND, ERR_STORAGE_ACCOUNT_NOT_FOUND, ERR_KIT_NOT_FOUND, ERR_COLLECTION_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_PROCESSING_RUN_NOT_FOUND"
            - "and then ERR_QUALITY_TEST_NOT_FOUND, ERR_SCREENING_NOT_FOUND, ERR_TANK_NOT_FOUND, ERR_EXCURSION_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_RESERVATION_NOT_FOUND"
            - "no call returns 403: the chosen roles are all in each endpoint's role set and no ParentGuardian or TransplantCenter ownership rule applies"

      - name: corner_missing_x_user_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds: "§1.4 priority 1 ERR_UNAUTHENTICATED (401) 'X-User-ID and X-User-Role headers are both present and X-User-Role is one of the ten declared roles'."
        distinguishing_aspect: "The outermost gate: both failure modes of priority 1 (a missing X-User-ID and an X-User-Role that is not one of the ten declared roles) are checked on an endpoint that would otherwise succeed, proving 401 outranks even the 403 role check."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "The first trigger call omits the X-User-ID header entirely while sending a valid X-User-Role."
            - "The second trigger call sends both headers but with the undeclared role AuditorGeneral."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cbb/storage-tanks"
              as: FacilitiesEngineer
            - call: "GET /cbb/storage-tanks"
              as: AuditorGeneral
              as_user_id: "xx-001"
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-A", tank_class: "STANDARD", capacity_slots: 4 }
              as: AuditorGeneral
              as_user_id: "xx-001"
          assert:
            - "call 1 (X-User-ID header omitted) returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "call 2 (X-User-Role AuditorGeneral, not one of the ten declared roles) returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "call 3 returns HTTP 401 ERR_UNAUTHENTICATED as well — priority 1 pre-empts the priority-2 role check and the priority-5 body validation"
            - "no StorageTank row was created: a later authenticated GET /cbb/storage-tanks has total_count == 0"

      - name: corner_parent_guardian_cannot_read_another_enrollment
        claim_type: error_triggerable
        grounds: "§1.4 priority 3 ERR_NOT_RESOURCE_OWNER (403) 'a ParentGuardian caller may only address the Enrollment whose id equals its X-User-ID, and rows reachable from it'."
        distinguishing_aspect: "Ownership rather than role: the caller's role IS permitted on the endpoint, so only the X-User-ID / enrollment-id identity check can refuse it, and the same caller succeeds on its own row in the same chain."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "Two enrollments exist, each acting as its own ParentGuardian principal (X-User-ID == enrollment id)."
            - "Neither has consented yet, so no downstream row can confuse the read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_a: "$.data.id" }
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Blair Nakamura", expected_delivery_date: "2026-08-20T00:00:00Z", collection_site_code: "SITE-02" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_b: "$.data.id" }
          trigger:
            - call: "GET /cbb/enrollments/${enr_b}"
              as: ParentGuardian
              as_user_id: "${enr_a}"
            - call: "GET /cbb/enrollments/${enr_a}"
              as: ParentGuardian
              as_user_id: "${enr_a}"
            - call: "GET /cbb/enrollments/${enr_b}/collection-kits"
              as: ParentGuardian
              as_user_id: "${enr_a}"
          assert:
            - "call 1 returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER — ParentGuardian is in the endpoint's role set, so this is not ERR_ROLE_NOT_PERMITTED"
            - "call 2 returns HTTP 200 with data.id == ${enr_a} and primary_parent_name == Avery Lin"
            - "call 3 returns HTTP 403 ERR_NOT_RESOURCE_OWNER as well: the rule extends to rows reachable from a foreign enrollment, and 403 pre-empts the empty-list answer"

      - name: corner_fourth_consent_amendment_hits_the_declared_limit
        claim_type: error_triggerable
        grounds: "§1.4 priority 12 ERR_CONSENT_AMENDMENT_LIMIT (409) 'consent_amendment_count is strictly below MAX_CONSENT_AMENDMENTS (3) before a new amendment is opened'."
        distinguishing_aspect: "A counter-based refusal walked to its exact limit: three amendments each closed by a re-consent are accepted and the fourth is refused, so the boundary is 3 accepted / 4th rejected rather than an off-by-one."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "One PRIVATE_FAMILY enrollment consented once, then amended and re-consented three times."
            - "consent_amendment_count therefore stands at 3 with consent_status CONSENTED before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-aaa" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/enrollments/${enr_id}/consent-amendment"
              payload: { amendment_reason_code: "RESEARCH_OPT_IN" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-bbb", research_use_authorized: true }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/enrollments/${enr_id}/consent-amendment"
              payload: { amendment_reason_code: "CONTACT_CHANGE" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-ccc" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/enrollments/${enr_id}/consent-amendment"
              payload: { amendment_reason_code: "HLA_OPT_IN" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-ddd", hla_typing_consent: true }
              as: ParentGuardian
              as_user_id: "${enr_id}"
          trigger:
            - call: "POST /cbb/enrollments/${enr_id}/consent-amendment"
              payload: { amendment_reason_code: "RESEARCH_OPT_OUT" }
