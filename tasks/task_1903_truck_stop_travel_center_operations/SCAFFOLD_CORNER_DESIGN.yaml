      - name: sm_parking_no_show_grace
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ParkingReservation.CONFIRMED_to_NO_SHOW"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "No-show is rejected before reserved_from + 2h grace (ERR_INVALID_STATE at 23:30 for a 22:00 window) and accepted after (00:31 next day -> NO_SHOW); clock-driven via /_clock."
        test_recipe:
          setup: ["Site parking_paid_capacity 2; member with plate AAA111; reservation 2026-08-12T22:00:00Z..2026-08-13T06:00:00Z CONFIRMED; clock starts 2026-08-12T10:00:00Z"]
