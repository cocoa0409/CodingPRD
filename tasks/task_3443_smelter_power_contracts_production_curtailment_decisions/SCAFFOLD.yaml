errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role.
- id: ERR_UNAUTHORIZED
  http: 403
  condition: Authenticated role is not in the endpoint's roles list.
- id: ERR_NOT_FOUND
  http: 404
  condition: A path id or body FK (smelter_id, potline_id, contract_id) does not resolve to an existing resource; path ids
    validated left-to-right.
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, invalid enum value, numeric range violation, malformed datetime/month, components composition
    invalid, pricing-model-conditional field missing or forbidden, allocations not covering exactly BILLET/SLAB/VALUE_ADDED,
    or temporal field ordering violated (window_start < window_end, valid_from < valid_to, planned_start < planned_end, observed_at
    <= clock, delivery_month/period_month not in the past, interrupt event inside contract window and not in the future).
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_potline_version / expected_smelter_version does not match the parent entity's current version (OCC;
    see concurrency_rules).
- id: ERR_POTLINE_INVALID_STATE
  http: 409
  condition: Potline transition from a non-matching operating_status; decision create on potline not in {OPERATING, CURTAILED};
    restart-plan create on potline not in {IDLE, SHUTDOWN}.
- id: ERR_DECISION_INVALID_STATE
  http: 409
  condition: CurtailmentDecision action invoked from a status for which that transition is not declared (including reverse
    when the potline already left CURTAILED, and actions on terminal SUPERSEDED/REVERSED decisions).
- id: ERR_RESTART_PLAN_INVALID_STATE
  http: 409
  condition: RestartPlan start/complete invoked from a non-matching plan status.
- id: ERR_INVALID_LIFECYCLE_STATE
  http: 409
  condition: Hedge close on non-OPEN hedge; permit suspend on non-ACTIVE permit; contract activate on non-DRAFT contract;
    labor expire on non-ACTIVE agreement.
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: economic-approve by the proposer, or labor-approve by the proposer or the economic reviewer (same X-User-ID).
- id: ERR_PERMIT_NOT_ACTIVE
  http: 409
  condition: RestartPlan start without an ACTIVE SPL_DISPOSAL EnvironmentalPermit on the potline's smelter (absent, SUSPENDED,
    or EXPIRED).
- id: ERR_LABOR_AGREEMENT_INACTIVE
  http: 409
  condition: Decision execute while the smelter has no ACTIVE LaborAgreement.
- id: ERR_LABOR_NOTICE_PERIOD
  http: 422
  condition: Decision execute before decision.approved_at + labor_agreement.notice_period_days; exactly at the boundary is
    allowed.
- id: ERR_CONTRACT_WINDOW_OVERLAP
  http: 409
  condition: Contract activate would overlap another ACTIVE contract of the same smelter under half-open [window_start, window_end)
    semantics; touching windows are allowed.
- id: ERR_CURTAILMENT_DEPTH_INVALID
  http: 422
  condition: depth_pct outside [0, 100]; a positive deepen that does not strictly exceed current curtailment_depth_pct; or
    depth 0 restore while active_decision_id is set.
- id: ERR_INTERRUPTIBLE_CAP_EXCEEDED
  http: 422
  condition: InterruptEvent would push the contract year's cumulative interruptible hours above interruptible_cap_hours_per_year;
    landing exactly on the cap is allowed.
- id: ERR_PRODUCT_MIX_OVER_CAPACITY
  http: 422
  condition: ProductionPlan allocations sum exceeds rated_capacity_tpd * 30; equality is allowed.
- id: ERR_PERMIT_DUPLICATE_TYPE
  http: 409
  condition: Creating an EnvironmentalPermit when an ACTIVE permit of the same (smelter, permit_type) exists.
- id: ERR_LABOR_AGREEMENT_EXISTS
  http: 409
  condition: Creating a LaborAgreement when an ACTIVE agreement exists for the smelter.
- id: ERR_RESTART_PLAN_EXISTS
  http: 409
  condition: Creating a RestartPlan while another PLANNED or IN_PROGRESS plan exists for the potline.
- id: ERR_NO_ACTIVE_POWER_CONTRACT
  http: 422
  condition: Potline create or decision economics snapshot requires an ACTIVE PowerContract whose half-open window covers
    the current logical clock and none exists.
- id: ERR_NO_PRICE_OBSERVATION
  http: 422
  condition: A computation requires a latest price observation (ALUMINUM_LME, REGIONAL_PREMIUM for the region, ALUMINA_INDEX
    as transfer fallback) and none exists at or before the current logical clock.
- id: ERR_HEDGE_VOLUME_EXCEEDS_EXPOSURE
  http: 422
  condition: Hedge create would push OPEN volume for (smelter, delivery_month) above rated_capacity_tpd * 30; equality allowed.
- id: ERR_HEDGE_COVERAGE_INSUFFICIENT
  http: 422
  condition: Decision execute requires hedge_coverage_ratio >= 0.5.
roles:
- name: PlatformAdmin
  description: Operator of the platform; onboards smelters, registers/expires labor agreements, drives the logical clock.
  identity: opaque
  exclusive_operations:
  - POST /smelter-ops/smelters
  - POST /smelter-ops/labor-agreements
  - POST /smelter-ops/labor-agreements/{id}/expire
