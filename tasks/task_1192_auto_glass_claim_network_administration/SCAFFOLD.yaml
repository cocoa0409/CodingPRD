# =============================================================================
# Task 1192: Auto Glass Claim Network Administration (glass claim TPA network)
# Scaffold seed tables — §1.0–§1.7
# =============================================================================

scenario: |
  generate task hard than expert level! 1192. Auto Glass Claim Network Administration (glass claim TPA network): claim intake & coverage/deductible determination by state (zero-deductible rules), shop network routing & scheduling, part sourcing (OEM vs aftermarket) & calibration requirement for ADAS, invoice pricing agreement & audit, steering compliance & customer choice documentation, fraud pattern & solicitation monitoring, mobile vs in-shop service, quality warranty

domain_name: auto-glass-claim-network
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
    - optimistic_concurrency
  entity_topology: hybrid          # claim-centric tree + flat network/config peers (shops, parts, regulations)
  state_machine_shape: cyclic      # supplement re-verify loop on Claim; dispute/resubmit cycle on Invoice; no-show/reschedule cycle on WorkOrder
  relationship_patterns:
    - one_to_many
    - cross_aggregate              # WorkOrder -> GlassShop; Invoice -> WorkOrder; FraudAlert -> Policyholder/Claim
  role_model: segregation_of_duties  # coverage verifier of a claim may not audit that claim's invoices
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Policyholder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Policyholder full legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: state_code, type: string, source: input, description: "Residence state, 2-letter USPS code" }
      - { name: fraud_score, type: integer, source: computed, default: 0, description: "Accumulated fraud signal points across all claims; reversed when a signal alert is DISMISSED" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Count of customer no-show events across work orders" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED when a fraud alert is resolved CONFIRMED" }

  - name: StateRegulation
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter USPS code; unique — one regulation row per state" }
      - { name: zero_deductible_windshield, type: boolean, source: input, description: "True when state law mandates zero deductible for windshield replacement under comprehensive coverage (e.g., FL, KY, SC)" }
      - { name: max_deductible_cents, type: integer, source: input, default: null, description: "Optional state cap on deductible; null = no cap" }
      - { name: glass_sales_tax_rate_bp, type: integer, source: input, description: "Sales tax on glass PART lines, basis points (560 = 5.60%)" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id; owner of the policy" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number" }
      - { name: state_code, type: string, source: input, description: "State the policy is written in" }
      - { name: coverage_type, type: enum, source: input, description: "COMPREHENSIVE | LIABILITY; glass claims require COMPREHENSIVE" }
      - { name: deductible_cents, type: integer, source: input, description: "Comprehensive deductible in cents" }
      - { name: oem_endorsement, type: boolean, source: input, default: false, description: "True when policyholder paid for OEM-parts endorsement (waives OEM upcharge)" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date, coverage start" }
      - { name: effective_end_date, type: string, source: input, description: "ISO date, coverage end" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation | CANCELLED" }

  - name: GlassShop
    parent: null
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Shop display name" }
      - { name: state_code, type: string, source: input, description: "Home state of the shop" }
      - { name: service_zip_prefixes, type: array, source: input, description: "Array of ZIP prefix strings the shop serves; eligibility = claim.service_zip_code startsWith any prefix" }
      - { name: mobile_capable, type: boolean, source: input, description: "True when the shop operates mobile service units" }
      - { name: adas_certified, type: boolean, source: input, description: "True when certified to perform ADAS recalibration" }
      - { name: oem_certified, type: boolean, source: input, description: "True when certified to install OEM glass" }
      - { name: agreement_tier, type: enum, source: input, description: "PLATINUM | PREFERRED | STANDARD; drives pricing multiplier 0.75 / 0.85 / 0.95" }
      - { name: bay_count, type: integer, source: input, description: "In-shop bays; daily in-shop capacity = bay_count x operating_minutes_per_day" }
      - { name: mobile_unit_count, type: integer, source: input, description: "Mobile service vans; buffered-overlap capacity per day" }
      - { name: operating_minutes_per_day, type: integer, source: input, default: 480, description: "Operating minutes per bay per calendar date" }
      - { name: network_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED when warranty_strike_count reaches 3 or via admin PATCH" }
      - { name: warranty_strike_count, type: integer, source: computed, default: 0, description: "Approved warranty rework claims against this shop" }
      - { name: rolling_audit_score, type: number, source: computed, default: 100, description: "EMA (alpha 0.3) of per-audit event scores; updated on every APPROVE audit decision" }
      - { name: period_close_audit_score, type: number, source: computed, default: 100, description: "Read-time arithmetic mean of all audit event scores for this shop" }

  - name: PartCatalogEntry
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Catalog part number" }
      - { name: part_description, type: string, source: input, description: "Human-readable description" }
      - { name: part_category, type: enum, source: input, description: "WINDSHIELD | SIDE_GLASS | REAR_GLASS | MOLDING_KIT | CALIBRATION" }
      - { name: part_origin, type: enum, source: input, description: "OEM | AFTERMARKET; OEM lines receive no tier discount" }
      - { name: nags_list_price_cents, type: integer, source: input, description: "NAGS list price in cents" }
      - { name: status, type: enum, source: system, description: "AVAILABLE on creation | DISCONTINUED via PATCH" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id; set from X-User-ID of the creating Policyholder" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy the claim is filed against" }
      - { name: assigned_shop_id, type: string, source: system, description: "FK -> GlassShop.id; nullable, set by the latest routing decision" }
      - { name: incident_state_code, type: string, source: input, description: "State where the loss occurred; drives StateRegulation lookup" }
      - { name: service_zip_code, type: string, source: input, description: "5-digit ZIP where service is needed; drives shop eligibility" }
      - { name: part_category, type: enum, source: input, description: "WINDSHIELD | SIDE_GLASS | REAR_GLASS; damaged glass" }
      - { name: loss_date, type: string, source: input, description: "ISO date of loss" }
      - { name: description, type: string, source: input, description: "Free-text damage description" }
      - { name: requires_adas_calibration, type: boolean, source: input, description: "True when the vehicle has ADAS requiring recalibration after glass replacement" }
      - { name: estimated_repair_cost_cents, type: integer, source: input, description: "Intake estimate; basis of the provisional customer responsibility" }
      - { name: provisional_customer_responsibility_cents, type: integer, source: computed, description: "Provisional variant: 0 when zero-deductible applies, else min(effective deductible, estimated_repair_cost_cents); recomputed on supplement" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Final deductible basis stored at verify-coverage: 0 under zero-deductible rule, else min(policy.deductible_cents, state max_deductible_cents when set)" }
      - { name: oem_upcharge_cents, type: integer, source: computed, default: 0, description: "Computed at invoice APPROVE: sum over approved PART lines with final origin OEM and policy.oem_endorsement=false of round_half_up(approved_amount_cents x 0.25), per line then summed" }
      - { name: customer_responsibility_cents, type: integer, source: computed, description: "Final variant, at invoice APPROVE: deductible_applied_cents + oem_upcharge_cents, capped at approved_total_cents" }
      - { name: insurer_payment_cents, type: integer, source: computed, description: "At invoice APPROVE: max(0, approved_total_cents - customer_responsibility_cents)" }
      - { name: coverage_verified_by_user_id, type: string, source: system, description: "X-User-ID of the ClaimAdjuster who ran verify-coverage; used by segregation-of-duties" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | FRAUD_HOLD | COVERAGE_VERIFIED | WORK_AUTHORIZED | WORK_COMPLETED | INVOICED | SETTLED | DENIED | CANCELLED" }

  - name: ChoiceDisclosureRecord
    parent: null
    common_fields: false   # append-only, immutable
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim this disclosure documents" }
      - { name: disclosure_channel, type: enum, source: input, description: "PHONE | PORTAL | IN_PERSON" }
      - { name: shop_solicited, type: boolean, source: input, description: "True when a shop solicited the customer before/without insurer referral (steering/solicitation signal)" }
      - { name: customer_selected_shop_name, type: string, source: input, default: null, description: "Shop name the customer independently requested, if any" }
      - { name: informed_of_network_options, type: boolean, source: input, description: "True when the customer was informed of the right to choose any shop" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; claim being serviced" }
      - { name: shop_id, type: string, source: system, description: "FK -> GlassShop.id; shop selected by routing (or rework target)" }
      - { name: warranty_claim_id, type: string, source: system, default: null, description: "FK -> WarrantyClaim.id; non-null only on rework work orders" }
      - { name: service_mode, type: enum, source: system, description: "MOBILE | IN_SHOP; null until scheduled" }
      - { name: scheduled_start, type: datetime, source: system, description: "ISO datetime; null until scheduled" }
      - { name: scheduled_end, type: datetime, source: system, description: "ISO datetime; null until scheduled" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when marked COMPLETED" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | SCHEDULED | NO_SHOW | COMPLETED | DECLINED | CANCELLED | SUPERSEDED" }

  - name: CalibrationEvent
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id (path); work order this calibration belongs to" }
      - { name: calibration_type, type: enum, source: input, description: "STATIC | DYNAMIC" }
      - { name: scheduled_start, type: datetime, source: input, description: "Calibration rig window start (ISO datetime)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Calibration rig window end (ISO datetime)" }
      - { name: report_reference, type: string, source: input, default: null, description: "Calibration report reference supplied at verify" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | VERIFIED | FAILED | WAIVED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id (path); completed work order being billed" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DISPUTED | APPROVED | PAID | REJECTED" }
      - { name: submitted_total_cents, type: integer, source: computed, description: "Sum of billed line totals + tax_amount_cents; recomputed on (re)submit" }
      - { name: tax_amount_cents, type: integer, source: computed, description: "round_half_up(sum of billed PART line totals x glass_sales_tax_rate_bp / 10000); computed once on the summed parts subtotal" }
      - { name: approved_total_cents, type: integer, source: computed, default: 0, description: "At APPROVE: sum(line approved_amount_cents) + tax_amount_cents" }
      - { name: adjustment_total_cents, type: integer, source: computed, default: 0, description: "Always == submitted_total_cents - approved_total_cents (the unapproved remainder); 0 only when fully approved" }
      - { name: audited_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the NetworkAuditor who last decided the audit" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when paid" }

  - name: InvoiceLineItem
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; owning invoice" }
      - { name: part_catalog_entry_id, type: string, source: input, default: null, description: "FK -> PartCatalogEntry.id; required for PART and CALIBRATION lines, null otherwise" }
      - { name: line_type, type: enum, source: input, description: "PART | CALIBRATION | MOBILE_FEE | MATERIALS" }
      - { name: quantity, type: integer, source: input, description: "Units billed; >= 1" }
      - { name: origin_claimed, type: enum, source: input, default: null, description: "OEM | AFTERMARKET; shop's claim of installed origin (PART lines)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Shop-billed unit price; must be <= agreement_unit_price_cents" }
      - { name: agreement_unit_price_cents, type: integer, source: computed, description: "Server-computed price per invoice_line_pricing (tier multiplier x NAGS, OEM multiplier 1.00, MOBILE_FEE flat 5000, MATERIALS flat 1500 x tier multiplier), rounded per line HALF_UP" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents x quantity (no further rounding)" }
      - { name: approved_amount_cents, type: integer, source: system, default: null, description: "Auditor-approved line total; set by audit-decisions" }
      - { name: approved_origin, type: enum, source: system, default: null, description: "OEM | AFTERMARKET; auditor-corrected origin, overrides origin_claimed when set" }

  - name: FraudAlert
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id; subject of the alert" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; claim that triggered the alert" }
      - { name: alert_type, type: enum, source: system, description: "REPEAT_WINDOW (+40) | SOLICITATION (+35) | RAPID_COMPLETION (+25) | SCORE_THRESHOLD (+0, gate alert)" }
      - { name: score_contribution, type: integer, source: system, description: "Points added to Policyholder.fraud_score on creation; reversed on DISMISSED" }
      - { name: resolution_notes, type: string, source: input, default: null, description: "Investigator notes at resolve" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: original_work_order_id, type: string, source: input, description: "FK -> WorkOrder.id (path); completed work order the warranty claim is filed against" }
      - { name: issue_description, type: string, source: input, description: "Description of the defect (leak, wind noise, calibration fault)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing" }
      - { name: decision_notes, type: string, source: input, default: null, description: "Auditor notes at decide" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED_REWORK | DENIED | REWORK_COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED, CANCELLED]
    transitions:
      - from: "(create)"
        to: FRAUD_HOLD
        trigger: "POST /claims when Policyholder.fraud_score >= 100 at intake"
        actor: system
        preconditions: []
        side_effects:
          - "FraudAlert created: alert_type=SCORE_THRESHOLD, score_contribution=0, status=OPEN, claim_id = new claim"
      - from: SUBMITTED
        to: COVERAGE_VERIFIED
        trigger: "POST /claims/{id}/verify-coverage"
        actor: ClaimAdjuster
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "Policy.status == ACTIVE (ERR_POLICY_INACTIVE)"
          - "Policy.coverage_type == COMPREHENSIVE (ERR_COVERAGE_TYPE_INELIGIBLE)"
          - "StateRegulation exists for claim.incident_state_code (ERR_STATE_REGULATION_NOT_FOUND)"
        side_effects:
          - "deductible_applied_cents computed per deductible_determination (final basis)"
          - "coverage_verified_by_user_id = X-User-ID"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimAdjuster
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects: ["increments Claim.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /claims/{id}/cancel"
        actor: Policyholder
        preconditions:
          - "Claim.status in {SUBMITTED, COVERAGE_VERIFIED, WORK_AUTHORIZED} (ERR_CLAIM_NOT_CANCELLABLE)"
          - "X-User-ID == claim.policyholder_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects: ["increments Claim.version by 1"]
      - from: COVERAGE_VERIFIED
        to: SUBMITTED
        trigger: "POST /claims/{id}/supplement"
        actor: Policyholder
        preconditions:
          - "Claim.status == COVERAGE_VERIFIED (ERR_CLAIM_NOT_COVERAGE_VERIFIED)"
          - "X-User-ID == claim.policyholder_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "estimated_repair_cost_cents replaced by revised_estimated_repair_cost_cents"
          - "provisional_customer_responsibility_cents recomputed"
          - "deductible_applied_cents reset to null until next verify-coverage"
          - "increments Claim.version by 1"
        note: "Revision loop: supplement re-opens a verified claim for re-verification."
      - from: COVERAGE_VERIFIED
        to: CANCELLED
        trigger: "POST /claims/{id}/cancel"
        actor: Policyholder
        preconditions: ["same as SUBMITTED -> CANCELLED"]
        side_effects: ["increments Claim.version by 1"]
      - from: COVERAGE_VERIFIED
        to: WORK_AUTHORIZED
        trigger: "POST /claims/{id}/routing-decisions"
        actor: ClaimAdjuster
        preconditions:
          - "Claim.status == COVERAGE_VERIFIED (ERR_CLAIM_NOT_COVERAGE_VERIFIED)"
          - "expected_claim_version == Claim.version (ERR_STALE_CLAIM_VERSION, 412)"
          - "At least one ChoiceDisclosureRecord exists for the claim (ERR_CHOICE_DISCLOSURE_REQUIRED)"
          - "No linked WorkOrder in {ACCEPTED, SCHEDULED} (ERR_ACTIVE_WORK_ORDER_EXISTS)"
          - "Shop selector pool non-empty (ERR_NO_ELIGIBLE_SHOP); requested_shop_id, when supplied, must be eligible (ERR_SHOP_NOT_ELIGIBLE)"
        side_effects:
          - "Existing linked WorkOrders in {OFFERED, NO_SHOW} -> SUPERSEDED"
          - "New WorkOrder created: shop_id per shop_selection_ranking, status=OFFERED, warranty_claim_id=null"
          - "assigned_shop_id = selected shop"
          - "increments Claim.version by 1"
      - from: WORK_AUTHORIZED
        to: WORK_COMPLETED
        trigger: "system (automatic when linked WorkOrder -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "Rapid-completion fraud signal evaluated per fraud_score_accumulation"
          - "increments Claim.version by 1"
      - from: WORK_AUTHORIZED
        to: COVERAGE_VERIFIED
        trigger: "system (automatic when the active WorkOrder is CANCELLED or DECLINED and no other non-terminal WorkOrder remains)"
        actor: system
        preconditions: []
        side_effects:
          - "assigned_shop_id cleared to null"
          - "increments Claim.version by 1"
      - from: WORK_AUTHORIZED
        to: CANCELLED
        trigger: "POST /claims/{id}/cancel"
        actor: Policyholder
        preconditions: ["same ownership check as SUBMITTED -> CANCELLED"]
        side_effects:
          - "Linked WorkOrders in {OFFERED, ACCEPTED, SCHEDULED} -> CANCELLED; SCHEDULED ones release reserved capacity"
          - "increments Claim.version by 1"
      - from: WORK_COMPLETED
        to: INVOICED
        trigger: "system (automatic when linked Invoice DRAFT -> SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: ["increments Claim.version by 1"]
      - from: INVOICED
        to: SETTLED
        trigger: "system (automatic when linked Invoice APPROVED -> PAID)"
        actor: system
        preconditions: []
        side_effects: ["increments Claim.version by 1"]
      - from: INVOICED
        to: DENIED
        trigger: "system (automatic when linked Invoice audit action REJECT)"
        actor: system
        preconditions: []
        side_effects: ["increments Claim.version by 1"]
      - from: FRAUD_HOLD
        to: SUBMITTED
        trigger: "system (automatic when the claim's SCORE_THRESHOLD FraudAlert is resolved DISMISSED)"
        actor: system
        preconditions: []
        side_effects: ["increments Claim.version by 1"]
      - from: FRAUD_HOLD
        to: DENIED
        trigger: "system (automatic when the claim's SCORE_THRESHOLD FraudAlert is resolved CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "Policyholder.status -> SUSPENDED"
          - "increments Claim.version by 1"

  - entity: WorkOrder
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, CANCELLED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /work-orders/{id}/accept"
        actor: ShopOperator
        preconditions:
          - "WorkOrder.status == OFFERED (ERR_WORK_ORDER_NOT_OFFERED)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
          - "GlassShop.network_status == ACTIVE (ERR_SHOP_SUSPENDED)"
        side_effects: ["increments WorkOrder.version by 1"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /work-orders/{id}/decline"
        actor: ShopOperator
        preconditions:
          - "WorkOrder.status == OFFERED (ERR_WORK_ORDER_NOT_OFFERED)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "If no other non-terminal WorkOrder for the claim remains: Claim WORK_AUTHORIZED -> COVERAGE_VERIFIED"
          - "increments WorkOrder.version by 1"
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system (automatic when a new routing-decision is created for the same claim)"
        actor: system
        preconditions: []
        side_effects: ["increments WorkOrder.version by 1"]
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel or claim-cancel cascade"
        actor: ClaimAdjuster
        preconditions: ["WorkOrder.status in {OFFERED, ACCEPTED, SCHEDULED} (ERR_WORK_ORDER_NOT_CANCELLABLE)"]
        side_effects: ["increments WorkOrder.version by 1"]
      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: ShopOperator
        preconditions:
          - "WorkOrder.status in {ACCEPTED, SCHEDULED, NO_SHOW} (ERR_WORK_ORDER_NOT_SCHEDULABLE)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
          - "expected_work_order_version == WorkOrder.version (ERR_STALE_WORK_ORDER_VERSION, 412)"
          - "business_safety: claim.requires_adas_calibration == true -> GlassShop.adas_certified == true (ERR_ADAS_CERTIFICATION_REQUIRED)"
          - "business_constraint: service_mode == MOBILE -> GlassShop.mobile_capable == true (ERR_SERVICE_MODE_CAPABILITY_MISMATCH)"
          - "business_temporal IN_SHOP: sum of duration minutes of the shop's non-terminal SCHEDULED IN_SHOP work orders on the calendar date of scheduled_start + (scheduled_end - scheduled_start) <= bay_count x operating_minutes_per_day (ERR_BAY_CAPACITY_EXCEEDED)"
          - "business_temporal MOBILE: buffered interval [scheduled_start, scheduled_end + 45min) must overlap fewer than mobile_unit_count of the shop's non-terminal SCHEDULED MOBILE work orders' buffered intervals (ERR_MOBILE_BUFFER_VIOLATION)"
          - "scheduled_end > scheduled_start (ERR_INVALID_REQUEST)"
        side_effects:
          - "Capacity consumed on the shop for the scheduled date"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule (reschedule)"
        actor: ShopOperator
        preconditions: ["same as ACCEPTED -> SCHEDULED"]
        side_effects:
          - "Previously reserved capacity released; new capacity consumed"
          - "increments WorkOrder.version by 1"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule (reschedule after no-show)"
        actor: ShopOperator
        preconditions: ["same as ACCEPTED -> SCHEDULED"]
        side_effects:
          - "Capacity consumed on the new slot"
          - "increments WorkOrder.version by 1"
        note: "No-show recovery cycle: SCHEDULED -> NO_SHOW -> SCHEDULED."
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /work-orders/{id}/mark-no-show"
        actor: ShopOperator
        preconditions:
          - "WorkOrder.status == SCHEDULED (ERR_WORK_ORDER_NOT_SCHEDULED)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Policyholder.no_show_count += 1"
          - "Reserved capacity released"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: ShopOperator
        preconditions:
          - "WorkOrder.status == SCHEDULED (ERR_WORK_ORDER_NOT_SCHEDULED)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
          - "business_safety: claim.requires_adas_calibration == true -> at least one linked CalibrationEvent in {VERIFIED, WAIVED} (ERR_CALIBRATION_NOT_VERIFIED)"
          - "business_temporal: logical clock >= scheduled_start (ERR_COMPLETION_BEFORE_SCHEDULED_START)"
        side_effects:
          - "completed_at = logical clock"
          - "Reserved capacity released"
          - "Claim WORK_AUTHORIZED -> WORK_COMPLETED (cascade up)"
          - "fraud_score_accumulation RAPID_COMPLETION signal evaluated: (completed_at - scheduled_start) < 45 minutes and claim.part_category == WINDSHIELD -> FraudAlert(+25) created and Policyholder.fraud_score += 25; if score crosses from <100 to >=100, a SCORE_THRESHOLD alert is also created"
          - "If work_order.warranty_claim_id non-null: that WarrantyClaim APPROVED_REWORK -> REWORK_COMPLETED (cascade)"
          - "increments WorkOrder.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel or claim-cancel cascade"
        actor: ClaimAdjuster
        preconditions: ["WorkOrder.status in {OFFERED, ACCEPTED, SCHEDULED}"]
        side_effects:
          - "If no other non-terminal WorkOrder for the claim remains: Claim WORK_AUTHORIZED -> COVERAGE_VERIFIED"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel or claim-cancel cascade"
        actor: ClaimAdjuster
        preconditions: ["WorkOrder.status in {OFFERED, ACCEPTED, SCHEDULED}"]
        side_effects:
          - "Reserved capacity released"
          - "If no other non-terminal WorkOrder for the claim remains: Claim WORK_AUTHORIZED -> COVERAGE_VERIFIED"
          - "increments WorkOrder.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /invoices/{id}/submit"
        actor: ShopOperator
        preconditions:
          - "Invoice.status in {DRAFT, DISPUTED} (ERR_INVOICE_NOT_SUBMITTABLE)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
          - "Invoice has >= 1 line item (ERR_INVOICE_EMPTY)"
        side_effects:
          - "Claim WORK_COMPLETED -> INVOICED (cascade up)"
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /invoices/{id}/submit with revised_line_items"
        actor: ShopOperator
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects:
          - "Line items replaced by revised_line_items; agreement prices recomputed; submitted_total_cents and tax_amount_cents recomputed; approved/adjustment totals reset to 0"
          - "increments Invoice.version by 1"
        note: "Dispute/resubmit cycle: SUBMITTED -> DISPUTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /invoices/{id}/audit-decisions action=APPROVE"
        actor: NetworkAuditor
        preconditions:
          - "Invoice.status == SUBMITTED (ERR_INVOICE_NOT_SUBMITTED)"
          - "segregation_of_duties: X-User-ID != claim.coverage_verified_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "adjustment_lines covers every line item exactly once (ERR_AUDIT_INCOMPLETE); each approved_amount_cents <= line_total_cents"
        side_effects:
          - "approved_total_cents = sum(approved_amount_cents) + tax_amount_cents; adjustment_total_cents = submitted_total_cents - approved_total_cents"
          - "Claim.oem_upcharge_cents, customer_responsibility_cents, insurer_payment_cents computed (final variant)"
          - "audited_by_user_id = X-User-ID"
          - "Shop rolling_audit_score updated per shop_network_score (EMA)"
          - "increments Invoice.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /invoices/{id}/audit-decisions action=DISPUTE"
        actor: NetworkAuditor
        preconditions: ["same as SUBMITTED -> APPROVED"]
        side_effects:
          - "Proposed approved_amount_cents recorded on lines; adjustment_total_cents computed; approved_total_cents unchanged (0 until APPROVE)"
          - "audited_by_user_id = X-User-ID"
          - "increments Invoice.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /invoices/{id}/audit-decisions action=REJECT"
        actor: NetworkAuditor
        preconditions: ["Invoice.status == SUBMITTED (ERR_INVOICE_NOT_SUBMITTED)"]
        side_effects:
          - "Claim INVOICED -> DENIED (cascade up)"
          - "increments Invoice.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: NetworkAuditor
        preconditions:
          - "Invoice.status == APPROVED (ERR_INVOICE_NOT_APPROVED)"
        side_effects:
          - "paid_at = logical clock"
          - "Claim INVOICED -> SETTLED (cascade up)"
          - "increments Invoice.version by 1"

  - entity: CalibrationEvent
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: VERIFIED
        trigger: "POST /calibration-events/{id}/verify outcome=VERIFIED"
        actor: ShopOperator
        preconditions:
          - "CalibrationEvent.status == SCHEDULED (ERR_CALIBRATION_NOT_SCHEDULED)"
          - "X-User-ID == work_order.shop_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects: ["increments CalibrationEvent.version by 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /calibration-events/{id}/verify outcome=FAILED"
        actor: ShopOperator
        preconditions: ["CalibrationEvent.status == SCHEDULED (ERR_CALIBRATION_NOT_SCHEDULED)"]
        side_effects: ["increments CalibrationEvent.version by 1"]
        note: "A FAILED event is left behind; the shop creates a new CalibrationEvent to retry."
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /calibration-events/{id}/verify outcome=WAIVED"
        actor: NetworkAuditor
        preconditions:
          - "CalibrationEvent.status == SCHEDULED (ERR_CALIBRATION_NOT_SCHEDULED)"
          - "outcome=WAIVED requires role NetworkAuditor (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: ["increments CalibrationEvent.version by 1"]

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [DENIED, REWORK_COMPLETED]
    transitions:
      - from: FILED
        to: APPROVED_REWORK
        trigger: "POST /warranty-claims/{id}/decide decision=APPROVE_REWORK"
        actor: NetworkAuditor
        preconditions:
          - "WarrantyClaim.status == FILED (ERR_WARRANTY_NOT_FILED)"
        side_effects:
          - "Rework WorkOrder created: claim_id = original work order's claim, shop_id = original work order's shop, warranty_claim_id = this warranty claim, status=OFFERED"
          - "GlassShop.warranty_strike_count += 1 (on the rework-responsible shop)"
          - "If warranty_strike_count reaches 3: GlassShop.network_status -> SUSPENDED (contagion)"
          - "increments WarrantyClaim.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/decide decision=DENY"
        actor: NetworkAuditor
        preconditions:
          - "WarrantyClaim.status == FILED (ERR_WARRANTY_NOT_FILED)"
        side_effects: ["increments WarrantyClaim.version by 1"]
      - from: APPROVED_REWORK
        to: REWORK_COMPLETED
        trigger: "system (automatic when the rework WorkOrder -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["increments WarrantyClaim.version by 1"]

  - entity: FraudAlert
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: DISMISSED
        trigger: "POST /fraud-alerts/{id}/resolve resolution=DISMISSED"
        actor: FraudInvestigator
        preconditions: ["FraudAlert.status == OPEN (ERR_ALERT_NOT_OPEN)"]
        side_effects:
          - "Policyholder.fraud_score -= score_contribution (floor 0)"
          - "If alert_type == SCORE_THRESHOLD and the linked claim is in FRAUD_HOLD: Claim FRAUD_HOLD -> SUBMITTED"
          - "increments FraudAlert.version by 1"
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /fraud-alerts/{id}/resolve resolution=CONFIRMED"
        actor: FraudInvestigator
        preconditions: ["FraudAlert.status == OPEN (ERR_ALERT_NOT_OPEN)"]
        side_effects:
          - "If alert_type == SCORE_THRESHOLD and the linked claim is in FRAUD_HOLD: Claim FRAUD_HOLD -> DENIED and Policyholder.status -> SUSPENDED"
          - "increments FraudAlert.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: routing-decision-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/routing-decisions"
    occ_field: "expected_claim_version"
    description: |
      Creating a routing decision against a Claim whose version has advanced since
      the client last observed it is rejected. A routing decision legitimately
      supersedes any OFFERED/NO_SHOW work order, so a second sequential create
      would otherwise succeed on stale claim data (e.g., a supplement or a prior
      routing decision changed the claim in between); the stale writer is rejected
      with 412 instead of silently superseding.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: schedule-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/schedule"
    occ_field: "expected_work_order_version"
    description: |
      Scheduling or rescheduling a WorkOrder whose version has advanced since the
      client last observed it is rejected. Rescheduling from SCHEDULED or NO_SHOW
      is a legitimate forward action, so a second sequential schedule carrying an
      already-consumed version would otherwise succeed and silently clobber the
      slot chosen by the earlier write; the stale writer is rejected with 412.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deductible_determination
    trigger: "claim creation and supplement (provisional variant, on Claim read fields); verify-coverage (final deductible basis); invoice APPROVE (final customer responsibility)"
    algorithm: threshold
    formula: |
      regulation = StateRegulation[claim.incident_state_code]
      effective_deductible = policy.deductible_cents
      if regulation.max_deductible_cents is not null:
        effective_deductible = min(effective_deductible, regulation.max_deductible_cents)
      zero_deductible_applies = (regulation.zero_deductible_windshield == true
                                 AND claim.part_category == WINDSHIELD
                                 AND policy.coverage_type == COMPREHENSIVE)
      PROVISIONAL (intake/supplement):
        provisional_customer_responsibility_cents =
          0 if zero_deductible_applies
          else min(effective_deductible, claim.estimated_repair_cost_cents)
      FINAL BASIS (verify-coverage):
        deductible_applied_cents = 0 if zero_deductible_applies else effective_deductible
      FINAL (invoice APPROVE):
        customer_responsibility_cents = min(approved_total_cents, deductible_applied_cents + oem_upcharge_cents)
        insurer_payment_cents = max(0, approved_total_cents - customer_responsibility_cents)
    input_set: "Claim + its Policy + StateRegulation[incident_state_code]; FINAL also uses the APPROVED invoice"
    constants:
      OEM_UPCHARGE_RATE: 0.25
    precision: "integer cents; upcharge rounded HALF_UP per line then summed"
    variants:
      - name: provisional
        when: "computed at claim creation and after each supplement; assumes estimated_repair_cost_cents and no OEM upcharge"
        difference: "customer responsibility derived from the intake estimate, never exceeds effective deductible"
      - name: final
        when: "computed at invoice APPROVE from audited line items"
        difference: "adds oem_upcharge_cents (25% per approved OEM PART line when policy.oem_endorsement == false) and is capped at approved_total_cents; differs from provisional whenever actual cost or part origin diverges from the estimate"

  - name: invoice_line_pricing
    trigger: "invoice creation and resubmit, per line item"
    algorithm: tiered_pricing
    formula: |
      tier_multiplier = {PLATINUM: 0.75, PREFERRED: 0.85, STANDARD: 0.95}[shop.agreement_tier]
      per line:
        if line_type in {PART, CALIBRATION}:
          entry = PartCatalogEntry[line.part_catalog_entry_id]  (must exist and be AVAILABLE)
          multiplier = 1.00 if entry.part_origin == OEM else tier_multiplier
          agreement_unit_price_cents = round_half_up(entry.nags_list_price_cents * multiplier)
        if line_type == MOBILE_FEE:
          require work_order.service_mode == MOBILE (ERR_MOBILE_FEE_NOT_ALLOWED)
          agreement_unit_price_cents = 5000   (flat, no tier multiplier, no tax)
        if line_type == MATERIALS:
          agreement_unit_price_cents = round_half_up(1500 * tier_multiplier)
      validation: billed unit_price_cents > agreement_unit_price_cents -> ERR_LINE_PRICE_EXCEEDS_AGREEMENT (402)
    input_set: "lines of the invoice being created/resubmitted; shop = work_order.shop; regulation = StateRegulation[claim.incident_state_code]"
    constants:
      TIER_PLATINUM: 0.75
      TIER_PREFERRED: 0.85
      TIER_STANDARD: 0.95
      MOBILE_FEE_CENTS: 5000
      MATERIALS_BASE_CENTS: 1500
    precision: "agreement_unit_price_cents rounded HALF_UP to integer cents per line"

  - name: invoice_totals_rounding
    trigger: "invoice creation and resubmit"
    algorithm: aggregation
    formula: |
      PINNED ORDER (per-line first, then sum; the alternative sum-then-round order is forbidden):
      1. per line: line_total_cents = unit_price_cents * quantity        (integers, no rounding)
      2. parts_subtotal = sum(line_total_cents over lines whose line_type == PART)
      3. tax_amount_cents = round_half_up(parts_subtotal * glass_sales_tax_rate_bp / 10000)   (tax once, on the summed parts subtotal; labor/calibration/fees untaxed)
      4. submitted_total_cents = sum(all line_total_cents) + tax_amount_cents
      (Rounding of the unit price itself happens inside invoice_line_pricing per line before this aggregation; per-line-then-sum is the pinned order.)
    input_set: "current line items of the invoice"
    constants: {}
    precision: "integer cents, HALF_UP; single rounding point at tax"

  - name: fraud_score_accumulation
    trigger: "claim intake (REPEAT_WINDOW), choice-disclosure creation with shop_solicited=true (SOLICITATION), work order completion (RAPID_COMPLETION), alert DISMISSED (reversal)"
    algorithm: threshold
    formula: |
      Signals (each creates a FraudAlert with the listed score_contribution and adds to Policyholder.fraud_score):
        REPEAT_WINDOW (+40): at POST /claims, another claim of the same policyholder exists with created_at in (now - 90 days, now]
        SOLICITATION (+35): at POST /claims/{id}/choice-disclosures with shop_solicited == true
        RAPID_COMPLETION (+25): at work order completion, (completed_at - scheduled_start) < 45 minutes AND claim.part_category == WINDSHIELD
      Threshold gate:
        If a signal causes fraud_score to cross from < 100 to >= 100, additionally create a SCORE_THRESHOLD alert (+0).
        At POST /claims, if Policyholder.fraud_score >= 100 (BEFORE this claim's own signals are applied), the new claim is created in FRAUD_HOLD with its own SCORE_THRESHOLD alert instead of SUBMITTED.
      Reversal: DISMISSED resolution subtracts score_contribution (floor 0).
    input_set: "policyholder's claims and alerts; boundary is inclusive: score == 100 triggers the hold"
    constants:
      REPEAT_WINDOW_POINTS: 40
      REPEAT_WINDOW_DAYS: 90
      SOLICITATION_POINTS: 35
      RAPID_COMPLETION_POINTS: 25
      RAPID_COMPLETION_MINUTES: 45
      FRAUD_THRESHOLD: 100
    precision: "integer points"

  - name: shop_network_score
    trigger: "rolling_audit_score updated on every audit-decisions APPROVE; period_close_audit_score computed on read of the shop"
    algorithm: weighted_scoring
    formula: |
      Per-audit event score (on APPROVE of an invoice of this shop):
        variance_ratio = adjustment_total_cents / submitted_total_cents   (0 when submitted_total_cents == 0)
        event_score = 100 * (1 - variance_ratio)
      ROLLING (provisional variant), applied per APPROVE in chronological order of the audit decision:
        rolling_audit_score = round_half_up(0.7 * previous_rolling_audit_score + 0.3 * event_score)   (initial previous = 100)
      PERIOD_CLOSE (final variant), computed on read over ALL APPROVE events of the shop:
        period_close_audit_score = round_half_up(sum(event_score) / count(event_score))   (100 when no events)
    input_set: "all invoices of the shop that reached APPROVED or PAID, in audit-decision chronological order (created_at ASC of the decision, tie-break invoice.created_at ASC)"
    constants:
      EMA_ALPHA: 0.3
      INITIAL_SCORE: 100
    precision: "score rounded HALF_UP to 2 decimal places per update"
    variants:
      - name: rolling_ema
        when: "maintained incrementally on each APPROVE"
        difference: "exponentially weights recent audits; order-sensitive"
      - name: period_close_average
        when: "computed on read from the full audit history"
        difference: "flat arithmetic mean, order-insensitive; for two audits at event scores 100 then 90, rolling = 97.0 while period_close = 95.0"

  - name: shop_selection_ranking
    trigger: "POST /claims/{id}/routing-decisions when requested_shop_id is absent"
    algorithm: selector_policy
    formula: |
      eligibility filter: GlassShop.network_status == ACTIVE
        AND any prefix p in service_zip_prefixes with claim.service_zip_code.startsWith(p)
        AND (claim.requires_adas_calibration == false OR GlassShop.adas_certified == true)
      requested_shop_id supplied: use that shop if it passes the eligibility filter, else ERR_SHOP_NOT_ELIGIBLE
      ranking expression: tier_multiplier ASC (PLATINUM 0.75 < PREFERRED 0.85 < STANDARD 0.95)
      tie-break: GlassShop.created_at ASC
      empty pool fallback: ERR_NO_ELIGIBLE_SHOP (422)
    input_set: "all GlassShop rows"
    constants: {}
    precision: "n/a (selection, not numeric)"

  - name: warranty_window_check
    trigger: "POST /work-orders/{id}/warranty-claims"
    algorithm: threshold
    formula: |
      window_days = 365 if work_order.service_mode == MOBILE else 730   (IN_SHOP)
      deadline = work_order.completed_at + window_days
      allowed when filed_at <= deadline (inclusive boundary)
      filed_at > deadline -> ERR_WARRANTY_WINDOW_EXPIRED
      Also rejected when another WarrantyClaim of the same work order is in {FILED, APPROVED_REWORK} (ERR_WARRANTY_ALREADY_OPEN)
      and when the work order is not COMPLETED (ERR_WORK_ORDER_NOT_COMPLETED).
    input_set: "the target work order and its existing warranty claims; filed_at = logical clock"
    constants:
      MOBILE_WINDOW_DAYS: 365
      IN_SHOP_WINDOW_DAYS: 730
    precision: "second precision on the deadline comparison"

  - name: invoice_audit_conservation
    trigger: "every audit-decisions action and every read of an invoice in {SUBMITTED, DISPUTED, APPROVED, PAID}"
    algorithm: constraint_propagation
    formula: |
      INVARIANT (money conserved): at every moment after invoice creation,
        submitted_total_cents == approved_total_cents + adjustment_total_cents
        (adjustment_total_cents is the unapproved remainder; before any APPROVE it equals submitted_total_cents).
      At DISPUTE: proposed approved_amount_cents values are recorded on the lines, but invoice-level
        approved_total_cents remains 0 and adjustment_total_cents == submitted_total_cents (whole amount disputed).
      At APPROVE: approved_total_cents = sum(approved_amount_cents) + tax_amount_cents;
                  adjustment_total_cents = submitted_total_cents - approved_total_cents.
      At resubmit: both reset (approved 0, adjustment == new submitted) and submitted_total_cents is recomputed;
        conservation holds at every step.
    input_set: "the invoice and its line items"
    constants: {}
    precision: "integer cents, exact equality"

  - name: shop_capacity_bookkeeping
    trigger: "work order schedule/reschedule/cancel/no-show/complete; GET /glass-shops/{id}/capacity"
    algorithm: aggregation
    formula: |
      INVARIANT (capacity conserved per shop per calendar date):
        bay_minutes_available(shop, date) == bay_count * operating_minutes_per_day - bay_minutes_booked(shop, date)
        bay_minutes_booked(shop, date) == sum(scheduled_end - scheduled_start in minutes) over the shop's
          non-terminal (status == SCHEDULED) IN_SHOP work orders whose scheduled_start calendar date == date
      Scheduling consumes minutes; cancel / no-show / complete releases exactly the minutes originally consumed;
      schedule-then-cancel restores availability to its prior value with zero drift.
    input_set: "the shop's work orders with status == SCHEDULED"
    constants: {}
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: Policyholder may only act on own claims/work-order-derived resources; ShopOperator only on work orders where work_order.shop_id == X-User-ID"
    error_id: ERR_RESOURCE_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "claim cancel/supplement/choice-disclosures/warranty-claims; work-order accept/decline/schedule/mark-no-show/complete/calibration-events/invoices/submit"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right (claim before work order, etc.); StateRegulation must exist for claim.incident_state_code at verify-coverage"
    error_id: "ERR_POLICYHOLDER_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_STATE_REGULATION_NOT_FOUND | ERR_SHOP_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_CALIBRATION_EVENT_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND | ERR_FRAUD_ALERT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body resource references"
  - priority: 5
    category: state
    check: "Target resource in the required state for this transition (incl. OCC expected_*_version match at 412); request payload shape/enum/required-field sanity"
    error_id: "ERR_INVALID_REQUEST (400) | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_COVERAGE_VERIFIED | ERR_CLAIM_NOT_CANCELLABLE | ERR_WORK_ORDER_NOT_OFFERED | ERR_WORK_ORDER_NOT_SCHEDULABLE | ERR_WORK_ORDER_NOT_SCHEDULED | ERR_WORK_ORDER_NOT_CANCELLABLE | ERR_WORK_ORDER_NOT_COMPLETED | ERR_INVOICE_NOT_SUBMITTABLE | ERR_INVOICE_NOT_SUBMITTED | ERR_INVOICE_NOT_APPROVED | ERR_INVOICE_EMPTY | ERR_CALIBRATION_NOT_SCHEDULED | ERR_WARRANTY_NOT_FILED | ERR_ALERT_NOT_OPEN | ERR_STALE_CLAIM_VERSION (412) | ERR_STALE_WORK_ORDER_VERSION (412)"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "ADAS: routing/scheduling to non-certified shop for ADAS claim; completing ADAS work order without VERIFIED/WAIVED calibration; routing before any choice disclosure; segregation of duties (coverage verifier may not audit that claim's invoices)"
    error_id: "ERR_ADAS_CERTIFICATION_REQUIRED (422) | ERR_CALIBRATION_NOT_VERIFIED (422) | ERR_CHOICE_DISCLOSURE_REQUIRED (422) | ERR_SEGREGATION_OF_DUTIES_VIOLATION (403)"
    http_status: 422
    applies_to: "routing-decisions, schedule, complete, audit-decisions"
  - priority: 7
    category: business_constraint
    check: "Capability/uniqueness constraints: MOBILE mode requires mobile_capable shop; one StateRegulation per state_code; no routing while an ACCEPTED/SCHEDULED work order exists; requested shop must pass eligibility; no second open warranty claim; suspended policyholder may not file"
    error_id: "ERR_SERVICE_MODE_CAPABILITY_MISMATCH (422) | ERR_DUPLICATE_STATE_REGULATION (409) | ERR_ACTIVE_WORK_ORDER_EXISTS (409) | ERR_SHOP_NOT_ELIGIBLE (422) | ERR_NO_ELIGIBLE_SHOP (422) | ERR_WARRANTY_ALREADY_OPEN (409) | ERR_POLICYHOLDER_SUSPENDED (422) | ERR_SHOP_SUSPENDED (409) | ERR_POLICY_INACTIVE (422) | ERR_COVERAGE_TYPE_INELIGIBLE (422) | ERR_PART_DISCONTINUED (422) | ERR_MOBILE_FEE_NOT_ALLOWED (422)"
    http_status: 422
    applies_to: "resource creation and scheduling endpoints"
  - priority: 8
    category: business_temporal
    check: "Temporal conflicts: in-shop daily minutes budget; mobile buffered-interval overlap; calibration rig strict half-open overlap; completion before scheduled start; warranty filing window"
    error_id: "ERR_BAY_CAPACITY_EXCEEDED (409) | ERR_MOBILE_BUFFER_VIOLATION (409) | ERR_CALIBRATION_SLOT_CONFLICT (409) | ERR_COMPLETION_BEFORE_SCHEDULED_START (422) | ERR_WARRANTY_WINDOW_EXPIRED (422)"
    http_status: 409
    applies_to: "schedule, calibration-events create, complete, warranty-claims create"
  - priority: 9
    category: business_fiscal
    check: "Fiscal: billed unit price exceeds agreement price; audit adjustment_lines must cover every line with approved amounts <= line totals"
    error_id: "ERR_LINE_PRICE_EXCEEDS_AGREEMENT (402) | ERR_AUDIT_INCOMPLETE (422)"
    http_status: 402
    applies_to: "invoice create/resubmit, audit-decisions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Policyholder ---
  - { method: POST, path: "/policyholders", description: "Register a policyholder", roles: [NetworkAdmin], code: 201, input: [full_name, email, phone, state_code], output: Policyholder, side_effects: ["status=ACTIVE, fraud_score=0, no_show_count=0"] }
  - { method: GET, path: "/policyholders/{id}", description: "Read a policyholder (incl. fraud_score, no_show_count, status)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: Policyholder, side_effects: [] }

  # --- StateRegulation ---
  - { method: POST, path: "/state-regulations", description: "Create a state's glass-claim regulation (one per state_code)", roles: [NetworkAdmin], code: 201, input: [state_code, zero_deductible_windshield, "max_deductible_cents?", glass_sales_tax_rate_bp], output: StateRegulation, side_effects: ["duplicate state_code -> ERR_DUPLICATE_STATE_REGULATION"] }
  - { method: GET, path: "/state-regulations", description: "List state regulations", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["state_code?", "limit?", "offset?"], output: "StateRegulation[]", side_effects: [] }

  # --- Policy ---
  - { method: POST, path: "/policies", description: "Create a policy for a policyholder", roles: [NetworkAdmin], code: 201, input: [policyholder_id, policy_number, state_code, coverage_type, deductible_cents, "oem_endorsement?", effective_start_date, effective_end_date], output: Policy, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/policies/{id}", description: "Read a policy", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: GET, path: "/policies", description: "List policies (reverse reachability for Policy.policyholder_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["policyholder_id?", "status?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }

  # --- GlassShop ---
  - { method: POST, path: "/glass-shops", description: "Onboard a network glass shop", roles: [NetworkAdmin], code: 201, input: [shop_name, state_code, service_zip_prefixes, mobile_capable, adas_certified, oem_certified, agreement_tier, bay_count, mobile_unit_count, "operating_minutes_per_day?"], output: GlassShop, side_effects: ["network_status=ACTIVE, warranty_strike_count=0, scores=100"] }
  - { method: GET, path: "/glass-shops/{id}", description: "Read a shop (incl. rolling_audit_score, period_close_audit_score computed on read)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: GlassShop, side_effects: [] }
  - { method: PATCH, path: "/glass-shops/{id}", description: "Admin update: network_status, agreement_tier, certifications", roles: [NetworkAdmin], code: 200, input: ["network_status?", "agreement_tier?", "adas_certified?", "mobile_capable?"], output: GlassShop, side_effects: ["increments GlassShop.version by 1"] }
  - { method: GET, path: "/glass-shops/{id}/work-orders", description: "List a shop's work orders (reverse reachability for WorkOrder.shop_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/glass-shops/{id}/capacity", description: "Computed capacity read for a calendar date", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [date], output: "{ bay_minutes_total: integer, bay_minutes_booked: integer, bay_minutes_available: integer, mobile_units_total: integer }", side_effects: [] }

  # --- PartCatalogEntry ---
  - { method: POST, path: "/part-catalog-entries", description: "Add a part to the catalog", roles: [NetworkAdmin], code: 201, input: [part_number, part_description, part_category, part_origin, nags_list_price_cents], output: PartCatalogEntry, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/part-catalog-entries/{id}", description: "Read a catalog entry", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: PartCatalogEntry, side_effects: [] }
  - { method: GET, path: "/part-catalog-entries", description: "List catalog entries", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["part_number?", "part_category?", "status?", "limit?", "offset?"], output: "PartCatalogEntry[]", side_effects: [] }
  - { method: PATCH, path: "/part-catalog-entries/{id}", description: "Discontinue a part or update its NAGS price", roles: [NetworkAdmin], code: 200, input: ["status?", "nags_list_price_cents?"], output: PartCatalogEntry, side_effects: ["increments PartCatalogEntry.version by 1"] }
  - { method: GET, path: "/part-catalog-entries/{id}/line-items", description: "Invoice lines referencing this part (reverse reachability for InvoiceLineItem.part_catalog_entry_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "InvoiceLineItem[]", side_effects: [] }

  # --- Claim ---
  - { method: POST, path: "/claims", description: "Claim intake; FRAUD_HOLD instead of SUBMITTED when policyholder fraud_score >= 100", roles: [Policyholder], code: 201, input: [policy_id, incident_state_code, service_zip_code, part_category, loss_date, description, requires_adas_calibration, estimated_repair_cost_cents], output: Claim, side_effects: ["policyholder_id = X-User-ID; provisional_customer_responsibility_cents computed (requires Policy and StateRegulation to exist); REPEAT_WINDOW signal evaluated; ERR_POLICYHOLDER_SUSPENDED when suspended"] }
  - { method: GET, path: "/claims/{id}", description: "Read a claim (incl. deductible and settlement fields)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/claims", description: "List claims (reverse reachability for Claim.policyholder_id / policy_id / assigned_shop_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["policyholder_id?", "policy_id?", "assigned_shop_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/verify-coverage", description: "Verify coverage and store final deductible basis", roles: [ClaimAdjuster], code: 200, input: ["verification_notes?"], output: Claim, side_effects: ["Claim SUBMITTED -> COVERAGE_VERIFIED; deductible_applied_cents computed; increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny a submitted claim", roles: [ClaimAdjuster], code: 200, input: [denial_reason], output: Claim, side_effects: ["Claim SUBMITTED -> DENIED; increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/cancel", description: "Policyholder cancels own claim; cascades to non-terminal work orders", roles: [Policyholder], code: 200, input: [], output: Claim, side_effects: ["Claim -> CANCELLED; linked OFFERED/ACCEPTED/SCHEDULED work orders -> CANCELLED with capacity release; increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/supplement", description: "Policyholder supplements a verified claim (revision loop to SUBMITTED)", roles: [Policyholder], code: 200, input: [additional_damage_description, revised_estimated_repair_cost_cents], output: Claim, side_effects: ["Claim COVERAGE_VERIFIED -> SUBMITTED; estimate + provisional responsibility recomputed; increments Claim.version by 1"] }
  - { method: POST, path: "/claims/{id}/choice-disclosures", description: "Document customer choice / anti-steering disclosure", roles: [Policyholder], code: 201, input: [disclosure_channel, shop_solicited, "customer_selected_shop_name?", informed_of_network_options], output: ChoiceDisclosureRecord, side_effects: ["shop_solicited == true -> SOLICITATION FraudAlert (+35)"] }
  - { method: GET, path: "/claims/{id}/choice-disclosures", description: "List disclosures for a claim (reverse reachability)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "ChoiceDisclosureRecord[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/routing-decisions", description: "Route the claim to a shop (selector or requested_shop_id); supersedes OFFERED/NO_SHOW work orders", roles: [ClaimAdjuster], code: 201, input: [expected_claim_version, "requested_shop_id?"], output: WorkOrder, side_effects: ["Claim COVERAGE_VERIFIED -> WORK_AUTHORIZED; new WorkOrder OFFERED; prior OFFERED/NO_SHOW work orders -> SUPERSEDED; increments Claim.version by 1"] }

  # --- WorkOrder ---
  - { method: GET, path: "/work-orders/{id}", description: "Read a work order", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: GET, path: "/claims/{id}/work-orders", description: "List a claim's work orders (reverse reachability for WorkOrder.claim_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/accept", description: "Shop accepts an offered work order", roles: [ShopOperator], code: 200, input: [], output: WorkOrder, side_effects: ["WorkOrder OFFERED -> ACCEPTED; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/decline", description: "Shop declines an offered work order; claim may revert to COVERAGE_VERIFIED", roles: [ShopOperator], code: 200, input: ["decline_reason?"], output: WorkOrder, side_effects: ["WorkOrder OFFERED -> DECLINED; claim bubble-up; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/schedule", description: "Schedule or reschedule (from ACCEPTED/SCHEDULED/NO_SHOW) with OCC and capacity checks", roles: [ShopOperator], code: 200, input: [service_mode, scheduled_start, scheduled_end, expected_work_order_version], output: WorkOrder, side_effects: ["WorkOrder -> SCHEDULED; capacity consumed/released; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/mark-no-show", description: "Mark a scheduled appointment as customer no-show", roles: [ShopOperator], code: 200, input: [], output: WorkOrder, side_effects: ["WorkOrder SCHEDULED -> NO_SHOW; Policyholder.no_show_count += 1; capacity released; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/complete", description: "Mark a scheduled work order completed (ADAS gate applies)", roles: [ShopOperator], code: 200, input: [], output: WorkOrder, side_effects: ["WorkOrder SCHEDULED -> COMPLETED; claim cascade to WORK_COMPLETED; rapid-completion fraud signal; rework warranty claim cascade; capacity released; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/work-orders/{id}/cancel", description: "Adjuster cancels a non-terminal work order; releases capacity", roles: [ClaimAdjuster], code: 200, input: ["cancel_reason?"], output: WorkOrder, side_effects: ["WorkOrder -> CANCELLED; claim bubble-up when no non-terminal work order remains; increments WorkOrder.version by 1"] }

  # --- CalibrationEvent ---
  - { method: POST, path: "/work-orders/{id}/calibration-events", description: "Book a calibration on the shop's single rig (strict half-open overlap check); work order must be in {ACCEPTED, SCHEDULED}", roles: [ShopOperator], code: 201, input: [calibration_type, scheduled_start, scheduled_end], output: CalibrationEvent, side_effects: ["status=SCHEDULED; ERR_WORK_ORDER_NOT_SCHEDULABLE when work order not in {ACCEPTED, SCHEDULED}; ERR_CALIBRATION_SLOT_CONFLICT on overlap with the shop's other SCHEDULED calibration events"] }
  - { method: GET, path: "/work-orders/{id}/calibration-events", description: "List calibration events of a work order (reverse reachability)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "CalibrationEvent[]", side_effects: [] }
  - { method: POST, path: "/calibration-events/{id}/verify", description: "Record calibration outcome; WAIVED requires NetworkAuditor", roles: [ShopOperator, NetworkAuditor], code: 200, input: [outcome, "report_reference?"], output: CalibrationEvent, side_effects: ["CalibrationEvent SCHEDULED -> VERIFIED | FAILED | WAIVED; increments CalibrationEvent.version by 1"] }

  # --- Invoice ---
  - { method: POST, path: "/work-orders/{id}/invoices", description: "Create a DRAFT invoice with line items; server computes agreement prices and totals", roles: [ShopOperator], code: 201, input: [line_items], output: Invoice, side_effects: ["WorkOrder must be COMPLETED (ERR_WORK_ORDER_NOT_COMPLETED); line agreement prices per invoice_line_pricing; ERR_LINE_PRICE_EXCEEDS_AGREEMENT when billed > agreement; totals per invoice_totals_rounding"] }
  - { method: GET, path: "/invoices/{id}", description: "Read an invoice", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/work-orders/{id}/invoices", description: "List invoices of a work order (reverse reachability)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/invoices/{id}/line-items", description: "List an invoice's line items (reverse reachability for InvoiceLineItem.invoice_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "InvoiceLineItem[]", side_effects: [] }
  - { method: POST, path: "/invoices/{id}/submit", description: "Submit a DRAFT invoice, or resubmit a DISPUTED one with revised_line_items", roles: [ShopOperator], code: 200, input: ["revised_line_items?"], output: Invoice, side_effects: ["Invoice -> SUBMITTED; claim cascade WORK_COMPLETED -> INVOICED; on resubmit, lines/totals recomputed; increments Invoice.version by 1"] }
  - { method: POST, path: "/invoices/{id}/audit-decisions", description: "Auditor approves, disputes, or rejects a submitted invoice (SOD enforced)", roles: [NetworkAuditor], code: 200, input: [action, "adjustment_lines?", "audit_notes?"], output: Invoice, side_effects: ["APPROVE: approved/adjustment totals + claim settlement fields + shop rolling_audit_score; DISPUTE: proposed amounts recorded; REJECT: claim -> DENIED; increments Invoice.version by 1"] }
  - { method: POST, path: "/invoices/{id}/pay", description: "Pay an approved invoice; settles the claim", roles: [NetworkAuditor], code: 200, input: [], output: Invoice, side_effects: ["Invoice APPROVED -> PAID; claim INVOICED -> SETTLED; increments Invoice.version by 1"] }

  # --- FraudAlert ---
  - { method: GET, path: "/fraud-alerts/{id}", description: "Read a fraud alert", roles: [ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: FraudAlert, side_effects: [] }
  - { method: GET, path: "/fraud-alerts", description: "List fraud alerts (reverse reachability for FraudAlert.policyholder_id / claim_id)", roles: [ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["policyholder_id?", "claim_id?", "status?", "limit?", "offset?"], output: "FraudAlert[]", side_effects: [] }
  - { method: POST, path: "/fraud-alerts/{id}/resolve", description: "Investigator confirms or dismisses an open alert; dismissal reverses score contribution", roles: [FraudInvestigator], code: 200, input: [resolution, "resolution_notes?"], output: FraudAlert, side_effects: ["DISMISSED: fraud_score -= score_contribution; threshold alert on FRAUD_HOLD claim -> claim SUBMITTED; CONFIRMED on threshold alert -> claim DENIED + policyholder SUSPENDED; increments FraudAlert.version by 1"] }

  # --- WarrantyClaim ---
  - { method: POST, path: "/work-orders/{id}/warranty-claims", description: "Policyholder files a warranty claim against a completed work order", roles: [Policyholder], code: 201, input: [issue_description], output: WarrantyClaim, side_effects: ["filed_at = logical clock; window + open-claim checks per warranty_window_check"] }
  - { method: GET, path: "/work-orders/{id}/warranty-claims", description: "List warranty claims against a work order (reverse reachability for WarrantyClaim.original_work_order_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/warranty-claims/{id}", description: "Read a warranty claim", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/warranty-claims/{id}/work-orders", description: "List rework work orders spawned by a warranty claim (reverse reachability for WorkOrder.warranty_claim_id)", roles: [Policyholder, ShopOperator, ClaimAdjuster, NetworkAuditor, FraudInvestigator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/warranty-claims/{id}/decide", description: "Auditor approves rework or denies; approval spawns rework work order and a warranty strike", roles: [NetworkAuditor], code: 200, input: [decision, "decision_notes?"], output: WarrantyClaim, side_effects: ["APPROVE_REWORK: rework WorkOrder created (OFFERED to original shop), GlassShop.warranty_strike_count += 1, suspension at 3 strikes; increments WarrantyClaim.version by 1"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Server startup default is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [NetworkAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all created_at/completed_at/filed_at/paid_at stamps and duration/window calculations read this clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, invalid enum value, or scheduled_end <= scheduled_start" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not in endpoint roles (incl. ShopOperator attempting calibration outcome=WAIVED)" }
  - { id: ERR_RESOURCE_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller acts on a resource it does not own (policyholder vs claim; shop vs work order)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "NetworkAuditor X-User-ID equals claim.coverage_verified_by_user_id on audit-decisions" }
  - { id: ERR_POLICYHOLDER_NOT_FOUND, http: 404, condition: "Referenced policyholder does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Referenced policy does not exist" }
  - { id: ERR_STATE_REGULATION_NOT_FOUND, http: 404, condition: "No StateRegulation for the claim's incident_state_code (checked at intake/verify-coverage)" }
  - { id: ERR_SHOP_NOT_FOUND, http: 404, condition: "Referenced shop does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "Referenced part catalog entry does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced claim does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "Referenced work order does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Referenced invoice does not exist" }
  - { id: ERR_CALIBRATION_EVENT_NOT_FOUND, http: 404, condition: "Referenced calibration event does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "Referenced warranty claim does not exist" }
  - { id: ERR_FRAUD_ALERT_NOT_FOUND, http: 404, condition: "Referenced fraud alert does not exist" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "verify-coverage/deny requires Claim SUBMITTED" }
  - { id: ERR_CLAIM_NOT_COVERAGE_VERIFIED, http: 409, condition: "routing-decisions/supplement requires Claim COVERAGE_VERIFIED" }
  - { id: ERR_CLAIM_NOT_CANCELLABLE, http: 409, condition: "cancel requires Claim in {SUBMITTED, COVERAGE_VERIFIED, WORK_AUTHORIZED}" }
  - { id: ERR_WORK_ORDER_NOT_OFFERED, http: 409, condition: "accept/decline requires WorkOrder OFFERED" }
  - { id: ERR_WORK_ORDER_NOT_SCHEDULABLE, http: 409, condition: "schedule requires WorkOrder in {ACCEPTED, SCHEDULED, NO_SHOW}" }
  - { id: ERR_WORK_ORDER_NOT_SCHEDULED, http: 409, condition: "mark-no-show/complete requires WorkOrder SCHEDULED" }
  - { id: ERR_WORK_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires WorkOrder in {OFFERED, ACCEPTED, SCHEDULED}" }
  - { id: ERR_WORK_ORDER_NOT_COMPLETED, http: 409, condition: "invoice create / warranty claim requires WorkOrder COMPLETED" }
  - { id: ERR_INVOICE_NOT_SUBMITTABLE, http: 409, condition: "submit requires Invoice in {DRAFT, DISPUTED}" }
  - { id: ERR_INVOICE_NOT_SUBMITTED, http: 409, condition: "audit-decisions requires Invoice SUBMITTED" }
  - { id: ERR_INVOICE_NOT_APPROVED, http: 409, condition: "pay requires Invoice APPROVED" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "submit requires at least one line item" }
  - { id: ERR_CALIBRATION_NOT_SCHEDULED, http: 409, condition: "verify requires CalibrationEvent SCHEDULED" }
  - { id: ERR_WARRANTY_NOT_FILED, http: 409, condition: "decide requires WarrantyClaim FILED" }
  - { id: ERR_ALERT_NOT_OPEN, http: 409, condition: "resolve requires FraudAlert OPEN" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version != Claim.version on routing-decisions" }
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version != WorkOrder.version on schedule" }
  - { id: ERR_ADAS_CERTIFICATION_REQUIRED, http: 422, condition: "ADAS-required claim routed/scheduled to a shop with adas_certified == false" }
  - { id: ERR_CALIBRATION_NOT_VERIFIED, http: 422, condition: "Completing an ADAS work order without a VERIFIED or WAIVED calibration event" }
  - { id: ERR_CHOICE_DISCLOSURE_REQUIRED, http: 422, condition: "routing-decisions before any ChoiceDisclosureRecord exists for the claim" }
  - { id: ERR_SERVICE_MODE_CAPABILITY_MISMATCH, http: 422, condition: "service_mode MOBILE on a shop with mobile_capable == false" }
  - { id: ERR_DUPLICATE_STATE_REGULATION, http: 409, condition: "Second StateRegulation for the same state_code" }
  - { id: ERR_ACTIVE_WORK_ORDER_EXISTS, http: 409, condition: "routing-decisions while a linked WorkOrder is ACCEPTED or SCHEDULED" }
  - { id: ERR_SHOP_NOT_ELIGIBLE, http: 422, condition: "requested_shop_id fails the selector eligibility filter" }
  - { id: ERR_NO_ELIGIBLE_SHOP, http: 422, condition: "Selector candidate pool is empty" }
  - { id: ERR_WARRANTY_ALREADY_OPEN, http: 409, condition: "Another WarrantyClaim of the same work order is FILED or APPROVED_REWORK" }
  - { id: ERR_POLICYHOLDER_SUSPENDED, http: 422, condition: "POST /claims by a policyholder with status SUSPENDED" }
  - { id: ERR_SHOP_SUSPENDED, http: 409, condition: "accept on a work order whose shop has network_status SUSPENDED" }
  - { id: ERR_POLICY_INACTIVE, http: 422, condition: "verify-coverage on a claim whose policy is not ACTIVE" }
  - { id: ERR_COVERAGE_TYPE_INELIGIBLE, http: 422, condition: "verify-coverage on a policy with coverage_type != COMPREHENSIVE" }
  - { id: ERR_PART_DISCONTINUED, http: 422, condition: "Invoice line references a PartCatalogEntry with status DISCONTINUED" }
  - { id: ERR_MOBILE_FEE_NOT_ALLOWED, http: 422, condition: "MOBILE_FEE line on a work order whose service_mode is IN_SHOP" }
  - { id: ERR_BAY_CAPACITY_EXCEEDED, http: 409, condition: "In-shop daily minutes budget (bay_count x operating_minutes_per_day) would be exceeded" }
  - { id: ERR_MOBILE_BUFFER_VIOLATION, http: 409, condition: "Mobile buffered interval [start, end+45min) overlaps mobile_unit_count existing buffered intervals" }
  - { id: ERR_CALIBRATION_SLOT_CONFLICT, http: 409, condition: "Calibration rig strict half-open overlap with another SCHEDULED calibration event of the same shop" }
  - { id: ERR_COMPLETION_BEFORE_SCHEDULED_START, http: 422, condition: "complete when logical clock < scheduled_start" }
  - { id: ERR_WARRANTY_WINDOW_EXPIRED, http: 422, condition: "Warranty filed after completed_at + window (365d MOBILE / 730d IN_SHOP)" }
  - { id: ERR_LINE_PRICE_EXCEEDS_AGREEMENT, http: 402, condition: "Billed unit_price_cents exceeds the computed agreement_unit_price_cents for a line" }
  - { id: ERR_AUDIT_INCOMPLETE, http: 422, condition: "adjustment_lines does not cover every line item exactly once, or an approved amount exceeds its line total" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Policyholder
    description: "Vehicle owner filing and managing own glass claims"
    identity: "entity_backed:Policyholder"
    exclusive_operations: ["POST /claims", "POST /claims/{id}/cancel", "POST /claims/{id}/supplement", "POST /claims/{id}/choice-disclosures", "POST /work-orders/{id}/warranty-claims"]
    shared_operations: ["GET reads"]
  - name: ShopOperator
    description: "Network glass shop staff fulfilling work orders and billing"
    identity: "entity_backed:GlassShop"
    exclusive_operations: ["POST /work-orders/{id}/accept", "POST /work-orders/{id}/decline", "POST /work-orders/{id}/schedule", "POST /work-orders/{id}/mark-no-show", "POST /work-orders/{id}/complete", "POST /work-orders/{id}/calibration-events", "POST /work-orders/{id}/invoices", "POST /invoices/{id}/submit"]
    shared_operations: ["GET reads", "POST /calibration-events/{id}/verify (outcome VERIFIED/FAILED only)"]
  - name: ClaimAdjuster
    description: "TPA adjuster verifying coverage, denying, and routing claims"
    identity: "opaque"
    exclusive_operations: ["POST /claims/{id}/verify-coverage", "POST /claims/{id}/deny", "POST /claims/{id}/routing-decisions", "POST /work-orders/{id}/cancel"]
    shared_operations: ["GET reads"]
  - name: NetworkAuditor
    description: "TPA auditor deciding invoices and warranty claims; may not audit a claim whose coverage they verified"
    identity: "opaque"
    exclusive_operations: ["POST /invoices/{id}/audit-decisions", "POST /invoices/{id}/pay", "POST /warranty-claims/{id}/decide"]
    shared_operations: ["GET reads", "POST /calibration-events/{id}/verify (any outcome incl. WAIVED)"]
  - name: FraudInvestigator
    description: "Fraud unit resolving fraud alerts"
    identity: "opaque"
    exclusive_operations: ["POST /fraud-alerts/{id}/resolve"]
    shared_operations: ["GET reads"]
  - name: NetworkAdmin
    description: "TPA platform administrator managing network configuration and reference data"
    identity: "opaque"
    exclusive_operations: ["POST /policyholders", "POST /policies", "POST /state-regulations", "POST /glass-shops", "PATCH /glass-shops/{id}", "POST /part-catalog-entries", "PATCH /part-catalog-entries/{id}", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads"]
