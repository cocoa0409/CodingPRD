  # ===========================================================================
  # Rule 5 - priority-pair validation conflicts across different error categories
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: facility_closed_outranks_dues_delinquent_on_party_reservation
        grounds:
          - validations[priority=41]
          - validations[priority=80]
          - errors[ERR_FACILITY_CLOSED]
          - errors[ERR_DUES_DELINQUENT]
          - calculations.facility_posture_derivation
          - endpoints[POST /swim-club/party-reservations]
        distinguishing_aspect: |
          The competing pair is category `state` (priority 41, ERR_FACILITY_CLOSED, 409) versus
          category `business_fiscal` (priority 80, ERR_DUES_DELINQUENT, 402) on
          POST /swim-club/party-reservations, i.e. a 39-priority gap that crosses from resource
          state straight to money. The recipe is falsifiable in both directions: the same request
          returns 402 while the pool is open and 409 once it is shut, so an implementation that
          evaluates money first is caught by the second call and an implementation that evaluates
          state first is caught by the first. The companion instance
          cert_wall_outranks_shift_rest_buffer_on_guard_shift_create pits a DIFFERENT category
          pair - business_safety (50) against business_constraint (62) - on a different endpoint.
        test_recipe:
          setup:
            - "One COUPLE category with bond_cents 0 and party_privileges true, so the bond gate at priority 81 passes on the bond_paid_cents >= category.bond_cents branch and never competes."
            - "One OPEN 2027 season with facility_posture OPEN."
            - "One household with an invoiced Membership (dues INVOICED, access ACTIVE) in GOOD_STANDING, so priorities 40, 45 and 46 all pass."
            - "That household owes 1000 cents of guest fees from a weekday GuestVisit for 4 guests against a 2-pass balance under PASS_FIRST (2 passes burned, 2 guests charged at GUEST_FEE_WEEKDAY_CENTS 500), so household.guest_fee_owed_cents is 1000 and priority 80's tolerance of 0 cents is violated."
            - "The logical clock sits at 2027-07-20T12:00:00Z, after the visit instant and before the requested party window on 2027-07-25."
            - "The party request itself is otherwise clean: no zone conflict, aggregate load far below capacity, inside the season window."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-20T12:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_couple_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Bhatt Household", address_line: "9 Cabana Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_b_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_b_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "GET /swim-club/households/${h_b_id}"
              payload: {}
              as: PoolManager
              captures: { h_b_v: $.data.version }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_b_id}", sponsor_name: "Ravi Bhatt", guest_count: 4, visit_start_iso: "2027-07-20T11:00:00Z", expected_household_version: "${h_b_v}" }
              as: PoolManager
              captures: { v_b_id: $.data.id, v_b_fee: $.data.fee_charged_cents }
          trigger:
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_b_id}", zone: "PAVILION", start_iso: "2027-07-25T14:00:00Z", end_iso: "2027-07-25T17:00:00Z", guest_count: 8, host_party_size: 2 }
              as: PoolManager
              captures: { err_open_pool: $.data.error_id }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-07-20", inspector_name: "K. Rowe", finding_code: "PH-FECAL-INCIDENT", severity: "CRITICAL", narrative: "Confirmed fecal contamination; immediate closure required." }
              as: HealthInspector
              as_user_id: "hi-001"
              captures: { f_crit_id: $.data.id }
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_b_id}", zone: "PAVILION", start_iso: "2027-07-25T14:00:00Z", end_iso: "2027-07-25T17:00:00Z", guest_count: 8, host_party_size: 2 }
              as: PoolManager
              captures: { err_closed_pool: $.data.error_id }
          assert:
            - "the GuestVisit settled as PASS_FIRST: passes_used == 2, fee_charged_cents == 1000, and Household.${h_b_id}.guest_fee_owed_cents == 1000"
            - "call 1 (posture OPEN, only priority 80 violated) returns 402 with error_id ERR_DUES_DELINQUENT"
            - "after the CRITICAL finding, Season.${s27_id}.facility_posture == CLOSED and open_critical_finding_count == 1"
            - "call 3 is byte-identical to call 1 yet returns 409 with error_id ERR_FACILITY_CLOSED, because priority 41 is now also violated and outranks priority 80"
            - "call 3 does NOT return ERR_DUES_DELINQUENT and does NOT return ERR_BOND_NOT_PAID (priority 81 is satisfied because bond_paid_cents 0 >= category.bond_cents 0)"
            - "no PartyReservation row exists after either failed call, and Household.${h_b_id}.party_charges_owed_cents is still 0"

      - name: cert_wall_outranks_shift_rest_buffer_on_guard_shift_create
        grounds:
          - validations[priority=50]
          - validations[priority=62]
          - errors[ERR_CERT_NOT_VALID_FOR_SHIFT]
          - errors[ERR_SHIFT_REST_BUFFER_VIOLATION]
          - state_machines[Certification].VALID_to_REVOKED
          - endpoints[POST /swim-club/guard-shifts]
        distinguishing_aspect: |
          The competing pair is category `business_safety` (priority 50,
          ERR_CERT_NOT_VALID_FOR_SHIFT, 422) versus category `business_constraint` (priority 62,
          ERR_SHIFT_REST_BUFFER_VIOLATION, 409) on POST /swim-club/guard-shifts - a
          public-health compliance rule beating a scheduling rule, which is the opposite kind of
          pairing from the state-versus-money conflict in
          facility_closed_outranks_dues_delinquent_on_party_reservation, and on a different
          endpoint. Falsifiability comes from repairing exactly one of the two violations: the
          identical request returns 422 while the CPR certification is revoked and 409 once a
          fresh CPR certification is issued, so the rest-buffer violation was present the whole
          time and was simply outranked.
          Note that revoking CPR_AED - not LIFEGUARD - keeps Lifeguard.employment_status ACTIVE,
          so no other precondition changes between the two attempts.
        test_recipe:
          setup:
            - "One OPEN 2027 season."
            - "One Lifeguard holding a VALID LIFEGUARD certification and a VALID CPR_AED certification, both expiring 2027-12-31, so employment_status is ACTIVE."
            - "One GuardShift already on the books for that guard on 2027-07-20 from 09:00:00Z to 13:00:00Z, left in SCHEDULED (priority 62 counts SCHEDULED as well as CONFIRMED)."
            - "The CPR_AED certification is then REVOKED, which leaves has_valid_cpr_cert false while has_valid_lifeguard_cert stays true and employment_status stays ACTIVE."
            - "The requested new shift starts at exactly the previous shift's end instant, so under the closed-interval rule with SHIFT_REST_BUFFER_MINUTES 30 the gap is 0 minutes and priority 62 is violated."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Ivy Okafor", hire_date: "2027-05-01" }
              as: PoolManager
              captures: { lg1_id: $.data.id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "LIFEGUARD", issued_on: "2027-01-10", expires_on: "2027-12-31" }
              as: PoolManager
              captures: { cert_lg_id: $.data.id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "CPR_AED", issued_on: "2027-01-10", expires_on: "2027-12-31" }
              as: PoolManager
              captures: { cert_cpr_id: $.data.id }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg1_id}", season_id: "${s27_id}", shift_role: "PRIMARY", start_iso: "2027-07-20T09:00:00Z", end_iso: "2027-07-20T13:00:00Z" }
              as: PoolManager
              captures: { sh1_id: $.data.id, sh1_status: $.data.status }
            - call: "POST /swim-club/certifications/${cert_cpr_id}/revoke"
              payload: { revoked_reason: "Recertification course not completed by the audit deadline" }
              as: PoolManager
              captures: { cert_cpr_status: $.data.status }
            - call: "GET /swim-club/lifeguards/${lg1_id}"
              payload: {}
              as: PoolManager
              captures: { lg1_employment: $.data.employment_status, lg1_has_cpr: $.data.has_valid_cpr_cert, lg1_has_lg: $.data.has_valid_lifeguard_cert }
          trigger:
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg1_id}", season_id: "${s27_id}", shift_role: "SECONDARY", start_iso: "2027-07-20T13:00:00Z", end_iso: "2027-07-20T17:00:00Z" }
              as: PoolManager
              captures: { err_no_cpr: $.data.error_id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "CPR_AED", issued_on: "2027-07-20", expires_on: "2028-07-19" }
              as: PoolManager
              captures: { cert_cpr2_id: $.data.id, cert_cpr2_status: $.data.status }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg1_id}", season_id: "${s27_id}", shift_role: "SECONDARY", start_iso: "2027-07-20T13:00:00Z", end_iso: "2027-07-20T17:00:00Z" }
              as: PoolManager
              captures: { err_rest_buffer: $.data.error_id }
          assert:
            - "after the revoke: Certification.${cert_cpr_id}.status == REVOKED, Lifeguard.${lg1_id}.has_valid_cpr_cert == false, has_valid_lifeguard_cert == true, employment_status == ACTIVE"
            - "call 1 (both priority 50 and priority 62 violated) returns 422 with error_id ERR_CERT_NOT_VALID_FOR_SHIFT"
            - "the new CPR_AED certification is created VALID and does NOT supersede the REVOKED row (the supersede edge requires an existing VALID or EXPIRED row), so Certification.${cert_cpr_id}.status stays REVOKED"
            - "Lifeguard.${lg1_id}.has_valid_cpr_cert == true after the new certification is issued"
            - "call 3 is byte-identical to call 1 yet returns 409 with error_id ERR_SHIFT_REST_BUFFER_VIOLATION, proving priority 62 was violated all along and was merely outranked"
            - "call 3 does NOT return ERR_CERT_NOT_VALID_FOR_SHIFT"
            - "no second GuardShift row exists after either failed call; Lifeguard.${lg1_id}.scheduled_hours is still 4 (only the 09:00-13:00 shift counts)"

  # ===========================================================================
  # Rule 6 - boundary precision checks on different metrics AND different endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: guard_ratio_boundary_50_vs_51_bathers
        grounds:
          - calculations.staffing_ratio_compliance
          - endpoints[GET /swim-club/seasons/{id}/staffing-window]
          - validations[priority=64]
        distinguishing_aspect: |
          The metric is BATHER LOAD against GUARD_BATHER_RATIO 25, and the boundary is the exact
          multiple: 50 bathers need ceil(50/25) == 2 guards, and one more bather - 51 - needs 3.
          The endpoint under test is the computed read
          GET /swim-club/seasons/{id}/staffing-window. Neither the metric nor the endpoint is
          shared with volunteer_slots_required_zero_closes_roster_as_staffed_empty_set, whose
          metric is a volunteer CREDIT count against a per-meet requirement and whose endpoint is
          POST /swim-club/meets/{id}/close-roster.
        test_recipe:
          setup:
            - "One COUPLE category with bond_cents 0 and party_privileges true, so no bond payment is needed for either host."
            - "One OPEN 2027 season with baseline_bather_load 0 and bather_load_capacity 120, so the aggregate ceiling never interferes and the observed bather_load is exactly the sum of the reservations' own loads."
            - "Two SEPARATE households, each with its own invoiced Membership (access ACTIVE), because a household holding an unpaid party charge cannot book a second party under priority 80."
            - "Household X holds a REQUESTED PAVILION reservation on 2027-07-20 from 14:00:00Z to 18:00:00Z with guest_count 45 and host_party_size 5, i.e. a load of exactly 50."
            - "Household Y will add a REQUESTED SHALLOW_END reservation over the same window with guest_count 1 and host_party_size 0, i.e. a load of exactly 1 - a different zone, so priority 63 never fires."
            - "No GuardShift is ever CONFIRMED, so scheduled_guard_count is 0 at both observations and the only thing that moves is required_guard_count."
            - "The probe instant 2027-07-20T15:00:00Z is strictly inside both half-open windows."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
