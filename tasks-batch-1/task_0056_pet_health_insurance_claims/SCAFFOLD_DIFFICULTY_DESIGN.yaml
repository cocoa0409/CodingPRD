              payload: {}
              as: Underwriter
            - call: "POST /accounts/${acct}/policies/${pol}/conditions"
              payload: { name: "chronic", first_diagnosed_date: "2026-01-05T00:00:00Z" }
              as: Underwriter
              captures: { cond: $.data.id }
            - call: "POST /accounts/${acct}/policies/${pol}/claims"
              payload: { claim_type: "ILLNESS", incident_date: "2026-01-10T00:00:00Z", condition_id: "${cond}" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/lines"
              payload: { description: "x", billed_amount_cents: 40000 }
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/invoices"
              payload: { file_uri: "s3://inv/w" }
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { inv: $.data.id }
            - call: "POST /claims/${cl}/invoices/${inv}/run-ocr"
              payload: { ocr_total_cents: 40000 }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/invoices/${inv}/accept"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
            - call: "POST /claims/${cl}/begin-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /accounts/${acct}/policies/${pol}/policy-years"
              payload: {}
              as: ClaimsAdjuster
              captures: { pyv: "$.data[0].version "}
          trigger:
            - call: "POST /claims/${cl}/adjudicate"
              payload: { decision: "APPROVE", expected_policy_year_version: "${pyv}" }
              as: ClaimsAdjuster
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_WITHIN_WAITING_PERIOD"
            - "Claim.${cl}.status == IN_REVIEW (unchanged)"

      - name: not_found_beats_invalid_state_existence_vs_state
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: |
          Error-category pair existence(3) vs state(5): submitting a non-existent claim id returns
          ERR_NOT_FOUND (priority 3), never an ERR_INVALID_STATE about its (absent) status.
        test_recipe:
          setup:
            - "An account holder exists; the referenced claim id does not."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "a10@x.com", full_name: "A Ten" }
              as: Underwriter
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /claims/00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: PolicyHolder
              as_user_id: "${acct}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

