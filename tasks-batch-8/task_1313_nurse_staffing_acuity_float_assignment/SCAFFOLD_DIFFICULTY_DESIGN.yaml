scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_assignment_cost
        grounds:
          - calculations.provisional_assignment_cost
          - calculations.final_assignment_cost
          - entities.ShiftAssignment.fields.provisional_cost_cents
          - entities.ShiftAssignment.fields.final_cost_cents
        distinguishing_aspect: |
          Entity domain ShiftAssignment: the forward-looking provisional variant (12 planned hours,
          projected OT, no penalty) and the chronological final variant (actual hours + missed-break
          penalty) produce different costs for the same assignment: 60000 vs 57500 cents.
        test_recipe:
          setup:
            - "ICU unit with full matrix; DAY shift 2026-08-10 with required_nurses == 4 (census 2/3/2/1)"
            - "CORE ICU nurse at 5000 cents/h with no other week-33 assignments"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU West", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 2, census_critical: 1 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Nora Core", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id, prov: $.data.provisional_cost_cents }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
            - call: "POST /assignments/${a1}/complete"
              payload: { actual_hours_worked: 10.5, missed_breaks: 1 }
              as: ChargeNurse
              captures: { fin: $.data.final_cost_cents, fot: $.data.final_ot_hours }
          assert:
            - "ShiftAssignment.${a1}.provisional_cost_cents == 60000 (12h * 5000, no projected OT)"
            - "ShiftAssignment.${a1}.final_cost_cents == 57500 (10.5h * 5000 = 52500 + 1 missed break * 5000)"
            - "ShiftAssignment.${a1}.final_ot_hours == 0"
            - "ShiftAssignment.${a1}.provisional_cost_cents != ShiftAssignment.${a1}.final_cost_cents"

      - name: census_vs_shift_weighted_fill_rate
        grounds:
          - calculations.compliance_fill_rates
          - entities.ComplianceReport.fields.fill_rate_shift_weighted_pct
          - entities.ComplianceReport.fields.fill_rate_census_weighted_pct
        distinguishing_aspect: |
          Entity domain ComplianceReport: identical locked-shift inputs yield 87.5 under the
          shift-weighted variant and 91.7 under the census-weighted variant (high-census shift B
          at 100% fill dominates the census weighting).
        test_recipe:
          setup:
            - "Unit A (ICU): shift 2026-08-10 DAY required 4 (census 8), 3 ACCEPTED assignments, LOCKED -> fill ratio 0.75"
            - "Unit B (MED_SURG): shift 2026-08-10 DAY required 4 (census 16), 4 ACCEPTED assignments, LOCKED -> fill ratio 1.0"
            - "ComplianceReport for 2026-08-10 in DRAFT"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU A", unit_type: "ICU", bed_count: 10, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { ua: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${ua}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 2, census_critical: 1 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${ua}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sha: $.data.id, sha_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "A One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${ua}" }
              as: NurseAdmin
              captures: { na1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "A Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${ua}" }
              as: NurseAdmin
              captures: { na2: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "A Three", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${ua}" }
              as: NurseAdmin
              captures: { na3: $.data.id }
            - call: "POST /shifts/${sha}/assignments"
              payload: { nurse_id: "${na1}", expected_shift_version: "${sha_v}" }
              as: ChargeNurse
              captures: { aa1: $.data.id }
            - call: "GET /shifts/${sha}"
              as: NurseAdmin
              captures: { sha_v2: $.data.version }
            - call: "POST /shifts/${sha}/assignments"
              payload: { nurse_id: "${na2}", expected_shift_version: "${sha_v2}" }
              as: ChargeNurse
              captures: { aa2: $.data.id }
            - call: "GET /shifts/${sha}"
              as: NurseAdmin
              captures: { sha_v3: $.data.version }
            - call: "POST /shifts/${sha}/assignments"
              payload: { nurse_id: "${na3}", expected_shift_version: "${sha_v3}" }
              as: ChargeNurse
              captures: { aa3: $.data.id }
            - call: "POST /assignments/${aa1}/accept"
              as: StaffNurse
              as_user_id: "${na1}"
            - call: "POST /assignments/${aa2}/accept"
              as: StaffNurse
              as_user_id: "${na2}"
            - call: "POST /assignments/${aa3}/accept"
              as: StaffNurse
              as_user_id: "${na3}"
            - call: "POST /units"
              payload: { name: "MS B", unit_type: "MED_SURG", bed_count: 30, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { ub: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "LOW", patients_per_nurse: 5 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "MODERATE", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${ub}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 10, census_moderate: 4, census_high: 2, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${ub}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { shb: $.data.id, shb_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "B One", employment_type: "CORE", competencies: ["MED_SURG"], base_hourly_rate_cents: 4500, home_unit_id: "${ub}" }
              as: NurseAdmin
              captures: { nb1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "B Two", employment_type: "CORE", competencies: ["MED_SURG"], base_hourly_rate_cents: 4500, home_unit_id: "${ub}" }
              as: NurseAdmin
              captures: { nb2: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "B Three", employment_type: "CORE", competencies: ["MED_SURG"], base_hourly_rate_cents: 4500, home_unit_id: "${ub}" }
              as: NurseAdmin
              captures: { nb3: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "B Four", employment_type: "CORE", competencies: ["MED_SURG"], base_hourly_rate_cents: 4500, home_unit_id: "${ub}" }
              as: NurseAdmin
              captures: { nb4: $.data.id }
            - call: "POST /shifts/${shb}/assignments"
              payload: { nurse_id: "${nb1}", expected_shift_version: "${shb_v}" }
              as: ChargeNurse
              captures: { ab1: $.data.id }
            - call: "GET /shifts/${shb}"
              as: NurseAdmin
              captures: { shb_v2: $.data.version }
            - call: "POST /shifts/${shb}/assignments"
              payload: { nurse_id: "${nb2}", expected_shift_version: "${shb_v2}" }
              as: ChargeNurse
              captures: { ab2: $.data.id }
            - call: "GET /shifts/${shb}"
              as: NurseAdmin
              captures: { shb_v3: $.data.version }
            - call: "POST /shifts/${shb}/assignments"
              payload: { nurse_id: "${nb3}", expected_shift_version: "${shb_v3}" }
              as: ChargeNurse
              captures: { ab3: $.data.id }
            - call: "GET /shifts/${shb}"
              as: NurseAdmin
              captures: { shb_v4: $.data.version }
            - call: "POST /shifts/${shb}/assignments"
              payload: { nurse_id: "${nb4}", expected_shift_version: "${shb_v4}" }
              as: ChargeNurse
              captures: { ab4: $.data.id }
            - call: "POST /assignments/${ab1}/accept"
              as: StaffNurse
              as_user_id: "${nb1}"
            - call: "POST /assignments/${ab2}/accept"
              as: StaffNurse
              as_user_id: "${nb2}"
            - call: "POST /assignments/${ab3}/accept"
              as: StaffNurse
              as_user_id: "${nb3}"
            - call: "POST /assignments/${ab4}/accept"
              as: StaffNurse
              as_user_id: "${nb4}"
            - call: "POST /shifts/${sha}/lock"
              as: ChargeNurse
            - call: "POST /shifts/${shb}/lock"
              as: ChargeNurse
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-10" }
              as: NurseAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep}/submit"
              as: NurseAdmin
              captures: { sw: $.data.fill_rate_shift_weighted_pct, cw: $.data.fill_rate_census_weighted_pct, inc: $.data.shifts_included_count, und: $.data.understaffed_shift_count }
          assert:
            - "ComplianceReport.${rep}.fill_rate_shift_weighted_pct == 87.5 (100 * (0.75 + 1.0) / 2)"
            - "ComplianceReport.${rep}.fill_rate_census_weighted_pct == 91.7 (100 * (0.75*8 + 1.0*16) / 24)"
            - "ComplianceReport.${rep}.fill_rate_shift_weighted_pct != ComplianceReport.${rep}.fill_rate_census_weighted_pct"
            - "ComplianceReport.${rep}.shifts_included_count == 2"
            - "ComplianceReport.${rep}.understaffed_shift_count == 1"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: required_nurses_multi_level_ceil_floor
        grounds:
          - calculations.required_nurses_from_acuity
          - entities.AcuitySnapshot.fields.required_nurses
        distinguishing_aspect: |
          Mode (a) formula: >= 3 inputs with non-linear interaction — per-level ceil before summation
          plus a max() floor. Census 2/3/2/1 on ICU ratios 4/3/2/1 yields 4 (each ceil lands exactly);
          census 1/0/0/0 yields 2 because the MIN_REQUIRED_NURSES floor engages over the raw sum of 1.
        test_recipe:
          setup:
            - "ICU unit with all four matrix rules (LOW 4, MODERATE 3, HIGH 2, CRITICAL 1); no shifts exist"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU East", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
          trigger:
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 2, census_critical: 1 }
              as: ChargeNurse
              captures: { sa: $.data.id, req_a: $.data.required_nurses, tot_a: $.data.total_census }
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "NIGHT", census_low: 1, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
              captures: { req_b: $.data.required_nurses }
          assert:
            - "AcuitySnapshot.${sa}.required_nurses == 4 (ceil(2/4)+ceil(3/3)+ceil(2/2)+ceil(1/1) = 1+1+1+1)"
            - "AcuitySnapshot.${sa}.total_census == 8"
            - "NIGHT snapshot required_nurses == 2 (raw sum 1 raised to the MIN_REQUIRED_NURSES floor of 2)"

      - name: final_cost_component_rounding_order
        grounds:
          - calculations.final_assignment_cost
          - entities.ShiftAssignment.fields.final_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: normal_cost (4999.5) and ot_cost (4999.5) are each rounded
          half-up to whole cents BEFORE summation, giving 10000; summing exact components first
          would give 9999. The scaffold pins per-component rounding.
        test_recipe:
          setup:
            - "ICU unit with matrix; four DAY shifts Mon-Thu 2026-08-10..13 (all ISO week 33), each required 2"
            - "CORE ICU nurse at 3333 cents/h; completed actuals of 16.0, 16.0, 6.5 on Mon-Wed (running 38.5h)"
            - "Thursday assignment completed with actual_hours_worked 2.5: normal 1.5h, OT 1.0h"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU R", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-11", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-12", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-13", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-11", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh2: $.data.id, sh2_v: $.data.version }
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-12", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh3: $.data.id, sh3_v: $.data.version }
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-13", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh4: $.data.id, sh4_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Ruth Round", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 3333, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /shifts/${sh1}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh1_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
            - call: "POST /assignments/${a1}/complete"
              payload: { actual_hours_worked: 16.0, missed_breaks: 0 }
              as: ChargeNurse
            - call: "POST /shifts/${sh2}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh2_v}" }
              as: ChargeNurse
              captures: { a2: $.data.id }
            - call: "POST /assignments/${a2}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a2}/confirm"
              as: ChargeNurse
            - call: "POST /assignments/${a2}/complete"
              payload: { actual_hours_worked: 16.0, missed_breaks: 0 }
              as: ChargeNurse
            - call: "POST /shifts/${sh3}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh3_v}" }
              as: ChargeNurse
              captures: { a3: $.data.id }
            - call: "POST /assignments/${a3}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a3}/confirm"
              as: ChargeNurse
            - call: "POST /assignments/${a3}/complete"
              payload: { actual_hours_worked: 6.5, missed_breaks: 0 }
              as: ChargeNurse
          trigger:
            - call: "POST /shifts/${sh4}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh4_v}" }
              as: ChargeNurse
              captures: { a4: $.data.id, prov4: $.data.provisional_cost_cents }
            - call: "POST /assignments/${a4}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a4}/confirm"
              as: ChargeNurse
            - call: "POST /assignments/${a4}/complete"
              payload: { actual_hours_worked: 2.5, missed_breaks: 0 }
              as: ChargeNurse
              captures: { fin4: $.data.final_cost_cents, fot4: $.data.final_ot_hours }
          assert:
            - "ShiftAssignment.${a4}.final_ot_hours == 1.0 (running 38.5 + 2.5 = 41.0; OT = min(2.5, 1.0))"
            - "ShiftAssignment.${a4}.final_cost_cents == 10000 (round(1.5*3333)=5000 + round(1.0*3333*1.5)=5000; sum-then-round would give 9999)"
            - "ShiftAssignment.${a4}.provisional_cost_cents == 57494 (prior 38.5h -> projected OT 10.5h: 1.5*3333 + 10.5*4999.5 = 57494.25 -> round_half_up)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_confirm_revoke_cycle
        grounds:
          - state_machines.ShiftAssignment.ACCEPTED_to_CONFIRMED
          - state_machines.ShiftAssignment.CONFIRMED_to_ACCEPTED
        distinguishing_aspect: |
          ShiftAssignment supports a CONFIRMED -> ACCEPTED revert (cyclic edge): after revoke the
          assignment returns to ACCEPTED and can be confirmed again; ACCEPTED still counts toward
          counted_assignments, so the count stays 1 across the whole cycle.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 required 2; charge-qualified CORE ICU nurse"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU C", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Carol Charge", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
              captures: { st_confirm: $.data.status }
            - call: "POST /assignments/${a1}/revoke-confirmation"
              as: ChargeNurse
              captures: { st_revoke: $.data.status }
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
              captures: { st_confirm2: $.data.status }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { counted: $.data.counted_assignments, charge: $.data.charge_covered }
          assert:
            - "st_confirm == CONFIRMED (ACCEPTED -> CONFIRMED)"
            - "st_revoke == ACCEPTED (CONFIRMED -> ACCEPTED revert edge)"
            - "st_confirm2 == CONFIRMED (cycle closes: re-confirm succeeds)"
            - "Shift.${sh}.counted_assignments == 1 (ACCEPTED and CONFIRMED both count; the cycle never double-counts)"
            - "Shift.${sh}.charge_covered == true"

      - name: report_return_resubmit_cycle
        grounds:
          - state_machines.ComplianceReport.DRAFT_to_SUBMITTED
          - state_machines.ComplianceReport.SUBMITTED_to_RETURNED
          - state_machines.ComplianceReport.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          ComplianceReport is cyclic: DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED -> ACCEPTED.
          Resubmission recomputes the same fill rates (both 100.0) and the cycle terminates only
          at ACCEPTED.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 required 2; two ACCEPTED assignments (one charge); shift LOCKED"
            - "ComplianceReport for 2026-08-10 in DRAFT"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU D", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "C One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "C Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n2: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { sh_v2: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n2}", expected_shift_version: "${sh_v2}" }
              as: ChargeNurse
              captures: { a2: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a2}/accept"
              as: StaffNurse
              as_user_id: "${n2}"
            - call: "POST /shifts/${sh}/lock"
              as: ChargeNurse
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-10" }
              as: NurseAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep}/submit"
              as: NurseAdmin
              captures: { st1: $.data.status, sw1: $.data.fill_rate_shift_weighted_pct, cw1: $.data.fill_rate_census_weighted_pct }
            - call: "POST /compliance-reports/${rep}/return"
              payload: { return_reason: "missing attestation" }
              as: Regulator
              captures: { st2: $.data.status }
            - call: "POST /compliance-reports/${rep}/submit"
              as: NurseAdmin
              captures: { st3: $.data.status, sw2: $.data.fill_rate_shift_weighted_pct }
            - call: "POST /compliance-reports/${rep}/accept"
              as: Regulator
              captures: { st4: $.data.status }
          assert:
            - "st1 == SUBMITTED and st2 == RETURNED and st3 == SUBMITTED (cycle RETURNED -> SUBMITTED) and st4 == ACCEPTED"
            - "sw1 == 100.0 and cw1 == 100.0 (2/2 counted at lock, both variants agree at full fill)"
            - "sw2 == 100.0 (resubmission recomputes identical values)"
            - "ComplianceReport.${rep}.return_reason == 'missing attestation' persists after RETURNED"

  # ===========================================================================
  # Rule 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: acuity_amendment_triggers_float_deployment
        grounds:
          - state_machines.AcuitySnapshot.SUBMITTED_to_SUPERSEDED
          - calculations.required_nurses_from_acuity
          - calculations.float_candidate_selection
          - state_machines.FloatRequest.transitions
        distinguishing_aspect: |
          Depth-3 chain from a single snapshot POST: (1) prior snapshot SUPERSEDED and Shift
          recomputed to required 7; (2) the recompute itself flips posture to CRITICAL which
          creates a FloatRequest(origin=AUTO_ACUITY); (3) the request's own creation runs the
          selector and creates a PROPOSED FLOAT assignment. Distinct trigger from the
          cancel-driven offer cascade.
        test_recipe:
          setup:
            - "ICU unit with matrix; snapshot S1 census 2/3/2/1 (required 4) governs DAY shift 2026-08-10"
            - "FLOAT_POOL nurse F1 competent in ICU, zero projected hours"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU E", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 2, census_critical: 1 }
              as: ChargeNurse
              captures: { s1: $.data.id }
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Flo Float", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000 }
              as: NurseAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 4, census_critical: 3 }
              as: ChargeNurse
              captures: { s2: $.data.id, req2: $.data.required_nurses }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { sh_req: $.data.required_nurses, sh_posture: $.data.staffing_posture, sh_ver: $.data.version }
            - call: "GET /acuity-snapshots/${s1}"
              as: NurseAdmin
              captures: { s1_status: $.data.status }
            - call: "GET /float-requests"
              payload: { shift_id: "${sh}" }
              as: FloatCoordinator
              captures: { fr_status: "$.data[0].status", fr_origin: "$.data[0].origin", fr_nurse: "$.data[0].deployed_nurse_id", fr_id: "$.data[0].id" }
            - call: "GET /assignments"
              payload: { shift_id: "${sh}" }
              as: NurseAdmin
              captures: { as_source: "$.data[0].source", as_status: "$.data[0].status", as_nurse: "$.data[0].nurse_id" }
          assert:
            - "AcuitySnapshot.${s2}.required_nurses == 7 (1+1+ceil(4/2)+3)"
            - "Shift.${sh}.required_nurses == 7 and staffing_posture == CRITICAL and version advanced to 2 (hop 1)"
            - "AcuitySnapshot.${s1}.status == SUPERSEDED"
            - "FloatRequest status == DEPLOYED, origin == AUTO_ACUITY, deployed_nurse_id == ${f1} (hop 2 + hop 3)"
            - "Cascade-created ShiftAssignment has source == FLOAT, status == PROPOSED, nurse_id == ${f1}"

      - name: cancel_triggers_auto_incentive_offer
        grounds:
          - state_machines.ShiftAssignment.ACCEPTED_to_CANCELLED
          - calculations.incentive_premium_reserve
          - calculations.staffing_posture_evaluation
        distinguishing_aspect: |
          Depth-2 chain from assignment cancel: (1) cancel drops counted_assignments 2 -> 1 which
          flips posture ADEQUATE -> UNDERSTAFFED and status STAFFED -> OPEN; (2) the posture flip
          itself auto-creates an IncentiveOffer(origin=AUTO, multiplier 1.5) reserving 36000 cents
          on the unit. Distinct trigger from the acuity-amendment cascade.
        test_recipe:
          setup:
            - "ICU unit (budget 500000, auto_incentive_multiplier 1.5); DAY shift required 2; two ACCEPTED assignments (one charge) -> ADEQUATE/STAFFED"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU F", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000, auto_incentive_multiplier: 1.5 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "F One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "F Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n2: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { sh_v2: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n2}", expected_shift_version: "${sh_v2}" }
              as: ChargeNurse
              captures: { a2: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a2}/accept"
              as: StaffNurse
              as_user_id: "${n2}"
          trigger:
            - call: "POST /assignments/${a2}/cancel"
              as: ChargeNurse
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { posture: $.data.staffing_posture, st: $.data.status, counted: $.data.counted_assignments }
            - call: "GET /incentive-offers"
              payload: { shift_id: "${sh}" }
              as: NurseAdmin
              captures: { off_status: "$.data[0].status", off_mult: "$.data[0].premium_multiplier", off_res: "$.data[0].premium_reserve_cents", off_origin: "$.data[0].origin" }
            - call: "GET /units/${u}"
              as: NurseAdmin
              captures: { reserved: $.data.incentive_reserved_cents }
          assert:
            - "Shift.${sh}.staffing_posture == UNDERSTAFFED and status == OPEN and counted_assignments == 1 (hop 1)"
            - "IncentiveOffer auto-created: status == OFFERED, origin == AUTO, premium_multiplier == 1.5 (hop 2)"
            - "IncentiveOffer.premium_reserve_cents == 36000 (0 + round_half_up(12 * 6000 * 0.5))"
            - "NursingUnit.${u}.incentive_reserved_cents == 36000"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_assignment_create
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SHIFT_NOT_OPEN]
          - errors[ERR_COMPETENCY_NOT_HELD]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the request violates both (shift LOCKED
          and nurse lacks ICU competency); priority 6 state error ERR_SHIFT_NOT_OPEN must win over
          the priority 7 safety error.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 required 2; shift LOCKED while empty"
            - "Nurse with competencies [MED_SURG] only (would fail ERR_COMPETENCY_NOT_HELD)"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU G", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
