  # --- Matter ---
  - method: POST
    path: "/legal-departments/{deptId}/matters"
    description: "Create a matter engaged to a panel firm"
    roles: [LegalOpsReviewer]
    code: 201
    input: [panel_firm_id, title, budget_cents]
    output: Matter
    side_effects: ["engagement_status = PENDING", "billed_to_date_cents = 0", "accrual_outstanding_cents = 0"]

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}"
    description: "Get a matter"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: Matter
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/matters"
    description: "List matters of a department"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "engagement_status?", "panel_firm_id?"]
    output: "Matter[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/engage"
    description: "Firm accepts engagement"
    roles: [PanelFirmUser]
    code: 200
    input: []
    output: Matter
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/close"
    description: "Close a matter"
