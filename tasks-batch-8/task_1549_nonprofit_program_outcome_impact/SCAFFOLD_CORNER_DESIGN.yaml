        distinguishing_aspect: "Report creation is OCC-guarded on ProgramCycle.version: a stale expected_program_cycle_version yields 412 ERR_STALE_CYCLE_VERSION, while a current version succeeds and supersedes the prior DRAFT report for the same (cycle, funder, report_type) triple."
