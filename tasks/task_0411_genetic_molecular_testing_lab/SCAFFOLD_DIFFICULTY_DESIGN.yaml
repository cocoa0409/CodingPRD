              as: MolecularTechnologist
              captures: { report_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/reports/${report_id}/sign-out"
              payload: {}
              as: LabDirector
              as_user_id: "director-1"
            - call: "GET /lab/test-orders/${order_id}"
              payload: {}
              as: LabDirector
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /lab/test-orders/${order_id}/reports/${report_id}/amend"
              payload: { expected_test_order_version: "${ord_v}" }
              as: LabDirector
              as_user_id: "director-1"
              captures: { successor_id: $.data.id }
          assert:
            - "Report.${report_id}.status == AMENDED"
            - "Report.${successor_id}.status == SIGNED_OUT"
            - "count of Reports for order ${order_id} with status == SIGNED_OUT equals 1"
