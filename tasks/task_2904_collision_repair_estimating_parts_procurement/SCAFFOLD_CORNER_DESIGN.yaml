            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90067", vehicle_vin: "1HGCV1F30LA090067", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ver_seen: $.data.version }
            - call: "POST /repair-orders/${ro_id}/consent-decisions"
              payload: { decision: "CONSENT", alternate_parts_ok: false, expected_repair_order_version: "${ver_seen}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /repair-orders/${ro_id}/consent-decisions"
              payload: { decision: "DECLINE", alternate_parts_ok: false, expected_repair_order_version: "${ver_seen}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_REPAIR_ORDER_VERSION"
            - "RepairOrder.${ro_id}.consent_state is still CONSENTED with consent_basis_cents 25000, and its version is unchanged by the refusal"
            - "the first decision advanced version past ${ver_seen}, which is the only reason the replay is stale - the endpoint is not once-only"
            - "re-reading the order and issuing the DECLINE with the fresh version is accepted: consent_state becomes DECLINED and consent_basis_cents is re-stamped at 25000"
            - "the accepted decline advanced version once more, so a third decision reusing the second read is refused 412"

      - name: stall_booked_minutes_reconcile_across_two_orders_sharing_a_stall
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.stall_occupancy_rollup
          - entities.Stall.fields.booked_minutes
          - state_machines.StageAssignment.SCHEDULED_to_ACTIVE
          - state_machines.StageAssignment.ACTIVE_to_COMPLETED
        distinguishing_aspect: >-
          booked_minutes is a rollup over the SCHEDULED and ACTIVE assignments of one stall, which two
          different repair orders share. It must rise on each booking, stay put when an assignment merely
          activates, and fall by exactly the finished window's length when the owning order leaves that
          stage - leaving the other order's reservation intact. An implementation that recomputes from
          "all assignments" never releases anything, and one that clears the stall on completion loses
          the neighbour's 120 minutes.
