        claim_type: violation_to_error
        grounds: ["errors[ERR_ROSTER_INVALID_STATE]", state_machines.RosterEntry.ON_DUTY_to_COMPLETED]
        distinguishing_aspect: "Checking out a SCHEDULED roster entry (never checked in) fails with ERR_ROSTER_INVALID_STATE."
        test_recipe:
          setup: ["ISSUED permit with one SCHEDULED roster entry"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
