    output: Equipment
    side_effects: ["maintenance_windows appended after overlap/past validation"]

  # --- MeltHeat ---
  - method: POST
    path: "/api/heats"
    description: "Open a melt heat on a furnace with a pinned chemistry spec snapshot"
    roles: [MeltSupervisor]
    code: 201
    input: [foundry_id, furnace_id, alloy_grade, chemistry_spec]
    output: MeltHeat
    side_effects: ["status=CHARGING, charge_total_kg=0"]
  - method: GET
    path: "/api/heats/{id}"
    description: "Get a heat (chemistry, certification, tap data)"
    roles: [FoundryAdmin, MeltSupervisor, Spectrographer, LineOperator, QualityInspector]
    code: 200
    input: []
    output: MeltHeat
    side_effects: []
  - method: GET
    path: "/api/heats"
    description: "List heats (reverse-reachability for MeltHeat.foundry_id/furnace_id)"
    roles: [FoundryAdmin, MeltSupervisor, Spectrographer, LineOperator, QualityInspector]
    code: 200
    input: ["foundry_id?", "furnace_id?", "status?", "limit?", "offset?"]
    output: "MeltHeat[]"
    side_effects: []
  - method: POST
    path: "/api/heats/{id}/charges"
    description: "Add charge material (VIRGIN / RETURN_LOT / AUTO_CORRECT). OCC-guarded. AUTO_CORRECT applies corrective_charge_masses."
    roles: [MeltSupervisor]
    code: 200
    input: [expected_heat_version, "additions?", "mode?"]
    output: MeltHeat
    side_effects:
      - "mode omitted: apply additions [{source, weight_kg, composition?, return_lot_id?}]"
      - "mode=AUTO_CORRECT: compute and apply corrective_charge_masses; store last_correction_masses"
      - "RETURN_LOT additions debit the lot (remaining/consumed; CONSUMED at exactly 0)"
      - "charge_total_kg/charge_composition recomputed; SAMPLED heats loop back to CHARGING"
      - "increments MeltHeat.version by 1"
  - method: POST
    path: "/api/heats/{id}/samples"
    description: "Record a spectro reading; passing reading certifies the heat. OCC-guarded; a new sample supersedes the prior reading."
    roles: [Spectrographer]
    code: 200
    input: [expected_heat_version, reading]
    output: MeltHeat
    side_effects:
      - "spectro_certification evaluated; pass -> CERTIFIED (certified_by_user_id := caller), fail -> SAMPLED"
      - "increments MeltHeat.version by 1"
  - method: POST
    path: "/api/heats/{id}/tap"
    description: "Tap a CERTIFIED heat to ladle; furnace daily capacity enforced with equality allowed"
    roles: [MeltSupervisor]
    code: 200
    input: [tap_weight_kg]
    output: MeltHeat
    side_effects: ["status -> TAPPED; tapped_weight_kg/tapped_date/remaining_metal_kg set; increments MeltHeat.version by 1"]

  # --- PourSlot ---
  - method: POST
    path: "/api/pour-slots"
