              as_user_id: "qm-1"
            - call: "GET /wire-lots"
              payload: { steel_heat_id: "${heat_id}", status: "RELEASED", limit: 10, offset: 0 }
              as: QualityManager
              as_user_id: "qm-1"
            - call: "GET /wire-lots"
              payload: { status: "DRAWN", limit: 10, offset: 0 }
              as: QualityManager
              as_user_id: "qm-1"
          assert:
            - "The first query returns total_count 3 and has_more false, containing W-1, W-2 and W-3 but never W-4"
            - "limit 2 / offset 2 over the heat returns exactly 1 item with total_count 3 and has_more false"
            - "After releasing W-2 the DRAWN query on that heat returns total_count 2 and the RELEASED query returns total_count 1 with reduction_pct 27.75"
            - "The heat-wide DRAWN query returns total_count 3 — W-1, W-3 and W-4 across both heats"
            - "Every returned row carries available_mass_kg 200.000, reserved_mass_kg 0.000 and consumed_mass_kg 0.000"

      - name: counterfeit_cascade_reaches_four_entity_levels
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: counterfeit_heat_cascades_four_links_to_recalled_pack_unit
          rationale: >
            The §1.8 instance drives the full heat -> wire lot -> production lot -> certificate ->
            pack unit chain in one call and checks every intermediate state and version bump, which is
            exactly the cascading_side_effects layer claim.

      - name: piece_and_mass_ledgers_reconcile_after_compensation
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: lot_piece_ledger_restored_exactly_by_pack_reopen
          rationale: >
            Derived-field reconciliation after a reversal is the whole subject of the §1.8 pack-reopen
            instance (and its wire-mass twin), which asserts the ledger identity before and after the
            compensating call rather than only the final value.

      - name: upstream_defect_severity_contaminates_the_lot_risk_score
        claim_type: contagion_risk_propagation
        excluded_because:
          difficulty_instance: risk_score_two_pass_freezes_severity_before_failure_penalty
          rationale: >
            Contagion in this domain is the risk score: an unverified heat, a worn die, a late relief bake
            and a deep decarb layer each carry their severity forward into the lot's certifiability, and the
            §1.8 two-pass instance already pins every weighted term, the freeze point and the certification
            ceiling that the contagion finally trips.

      - name: die_life_budget_diverges_between_the_two_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: tool_life_budget_rated_derated_vs_conservative_observed
          rationale: >
            The §1.8 instance runs one die with a short-cycle history against an automotive lot and an
            identically sized aerospace lot, so both variants and their delta are already pinned.

