          - "GET /warranty-claims/${claim2}: data.deductible_paid_cents == 0"

  # =======================================================================
  # 0.5 rule 3: non_linear_state_machine
  # Three instances on THREE DIFFERENT entities:
  #   parallel dimensions -> DeviceOrder (payment_status x fulfillment_status)
  #   cycle               -> ProviderReferral (OPEN -> SCHEDULED -> OPEN)
  #   fork-join           -> RepairOrder (REPAIRED vs UNREPAIRABLE)
  # =======================================================================
  non_linear_state_machine:

    - name: device_order_payment_and_fulfillment_dimensions_advance_independently
      grounds:
        - "state_machines.DeviceOrder.DELIVERED_to_RETURN_IN_TRANSIT"
        - "state_machines.DeviceOrder.CAPTURED_to_PARTIALLY_REFUNDED"
        - "entities.DeviceOrder.fields.payment_status"
        - "entities.DeviceOrder.fields.fulfillment_status"
      distinguishing_aspect: >-
        PARALLEL DIMENSIONS on one row: the same DeviceOrder carries two
        independent state fields. RETURN_PICKED_UP moves fulfillment_status
        DELIVERED -> RETURN_IN_TRANSIT while payment_status stays CAPTURED with
        refunded_cents 0; the inspect step writes the settlement onto the
        ReturnAuthorization while BOTH order dimensions stay put; only settle moves
        fulfillment_status -> RETURNED and payment_status -> PARTIALLY_REFUNDED in
        the same request. A single-state-field model cannot hold
        (RETURN_IN_TRANSIT, CAPTURED) at all.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with restocking_fee_mode FLAT_PCT, restocking_fee_pct 0.1000, restocking_fee_cap_cents 0, shipping_refundable false, trial_period_days 30."
          - "One InventoryPool NEO/M/OPEN with 5 units and one IN_STOCK NEO device."
          - "Patient age 67 screens clean; order list_price_cents 199900 / discount_cents 9900 / accessory_subtotal_cents 4500 / shipping_cents 1495 -> total_cents 210096."
          - "Authorized, fit-confirmed, shipped (captured_cents 210096, open_balance_cents 210096) and DELIVERED on 2026-08-01T00:00:00Z."
          - "Clock moved to 2026-08-07T00:00:00Z and a ReturnAuthorization issued under OCC (days_used_at_issue 6)."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /inventory-pools"
            payload: { sku: "NEO-M-OPEN", model: "NEO", dome_size: "M", tip_type: "OPEN" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pool: "$.data.id" }
          - { call: "POST /inventory-pools/${pool}/restock", payload: { units: 5 }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /devices"
            payload: { serial_number: "SN-PD-0001", model: "NEO", firmware_version: "4.0.0" }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { dev: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "pd@example.com", full_name: "Pia Doyle", age_years: 67 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
            as_user_id: "${pat}"
            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
