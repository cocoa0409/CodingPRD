            - "MachinePlacement.${pl_id}.operational_status == DOWN and placement_status is still INSTALLED (link 2)"
            - "exactly one ServiceTicket exists for ${pl_id}: origin == TELEMETRY_AUTO, reported_symptom == MACHINE_DOWN, alert_id == the CRITICAL alert's id, reported_by_user_id == null, status == QUEUED (link 3)"
            - "that ticket's priority_score == 700 (base 400 + DOWN_IN_HOURS 300 + 0 tier + 0 sanitation + 0 posture) and response_deadline_at == 2026-08-05T16:00:00Z (the 120-minute SLA band)"
