- method: POST
  path: /blackout-windows
  description: Create a blackout window
  roles:
  - ComplianceOfficer
  code: 201
  input:
  - asset_id
  - territory_code
  - platform_class
  - blackout_start
  - blackout_end
  - applies_to_sublicense_only
  - reason
  output: BlackoutWindow
  side_effects: []
- method: GET
  path: /blackout-windows
  description: List blackout windows
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - asset_id?
  - territory_code?
  - platform_class?
  output: BlackoutWindow[]
  side_effects: []
