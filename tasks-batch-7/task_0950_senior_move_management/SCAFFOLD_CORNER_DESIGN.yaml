              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /engagements/${eng}/hold"
              payload: { reason: "Awaiting the family conference" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /move-day-plans"
              payload: { engagement_id: "${eng}", scheduled_start_utc: "2026-06-15T14:00:00.000Z", truck_capacity_cft: 1000, truck_count: 1 }
              as: MOVE_MANAGER
              captures: { r1: "$.data.error_id" }
          assert:
