            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "MM-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "MM-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Month Mart", reimbursement_rate_pct: 50, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 1000, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/program-funds", payload: { fiscal_year: 2026, allocated_cents: 10000 }, as: ProgramAdministrator, captures: { fund_id: $.data.id } }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 1000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 1000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 1000 }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/merchants/${m_id}/reimbursement-claims", payload: { period_month: "2026-08" }, as: MerchantOperator, as_user_id: "${m_id}", captures: { cl1: $.data.id } }
          trigger:
            - { call: "POST /senior-benefits/reimbursement-claims/${cl1}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1" }
            - { call: "GET /senior-benefits/merchants/${m_id}", as: ProgramAdministrator, captures: { cmr_sep: $.data.current_month_reimbursed_cents } }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "GET /senior-benefits/merchants/${m_id}", as: ProgramAdministrator, captures: { cmr_oct: $.data.current_month_reimbursed_cents } }
