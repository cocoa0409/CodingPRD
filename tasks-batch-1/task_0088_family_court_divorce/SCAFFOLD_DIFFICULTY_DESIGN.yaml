# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Family Court / Divorce Case — EXPERT
#
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.6. All formula-derived asserts are pre-computed literals
# (see the Python derivations the author ran against §1.3 formulas + constants).
#
# Canonical guideline schedule used throughout ("CA"):
#   basic_obligation_tiers:
#     - { min_combined_monthly_cents: 0,       max_combined_monthly_cents: 999999,   base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 }
#     - { min_combined_monthly_cents: 1000000, max_combined_monthly_cents: 1999999,  base_cents_one_child: 150000, marginal_pct_per_extra_child: 0.50 }
#     - { min_combined_monthly_cents: 2000000, max_combined_monthly_cents: 99999999, base_cents_one_child: 200000, marginal_pct_per_extra_child: 0.50 }
#   spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50,
#   shared_custody_threshold_pct: 0.40, long_marriage_months: 120
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ----- Instance 1: CHILD support TEMPORARY vs FINAL (domain: Child) -----
      - name: child_support_temporary_vs_final_divergence
        grounds:
          - calculations.child_support_guideline
          - entities.SupportOrder.fields.variant
          - entities.Party.fields.gross_monthly_income_cents
          - entities.FinancialDisclosure.fields.net_monthly_income_cents
          - state_machines.ParentingPlan.AGREED_to_ADOPTED
        distinguishing_aspect: |
          Same case, same children, same plan: a TEMPORARY CHILD order computed from
          DECLARED gross income (800000+400000 combined -> tier2 base) yields 150000
          cents, while a FINAL CHILD order from VERIFIED NET income (600000+300000 ->
          tier1 base) yields 100000 cents — a genuine divergence on the Child domain.
        test_recipe:
          setup:
            - "GuidelineSchedule(CA) registered with the canonical tiers."
            - "Case(CA) in DISCOVERY; petitioner declared gross=800000, respondent declared gross=400000."
            - "Two children on the case."
            - "ParentingPlan PROPOSED 110/255 (petitioner is the lower-overnight payor; time_pct=0.3014 < 0.40 so no offset)."
            - "Both disclosures VERIFIED: petitioner net=600000, respondent net=300000."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 }, { min_combined_monthly_cents: 1000000, max_combined_monthly_cents: 1999999, base_cents_one_child: 150000, marginal_pct_per_extra_child: 0.50 }, { min_combined_monthly_cents: 2000000, max_combined_monthly_cents: 99999999, base_cents_one_child: 200000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of A", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat Petitioner", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin Respondent", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child One", birth_year: 2016 }
              as: Clerk
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child Two", birth_year: 2018 }
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "ANSWER", filed_by_party_id: "${res_id}" }
              as: Clerk
              captures: { ans_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${ans_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/advance"
              payload: { to_status: "DISCOVERY" }
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 90000, mandatory_retirement_cents: 20000, health_insurance_cents: 10000 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { pet_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${pet_fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
            - call: "POST /api/financial-disclosures/${pet_fd_id}/verify"
              payload: {}
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${res_id}", case_id: "${case_id}", gross_monthly_income_cents: 360000, tax_withholding_cents: 45000, mandatory_retirement_cents: 10000, health_insurance_cents: 5000 }
              as: Respondent
              as_user_id: "u-res"
              captures: { res_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${res_fd_id}/submit"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
            - call: "POST /api/financial-disclosures/${res_fd_id}/verify"
              payload: {}
              as: Clerk
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 110, respondent_overnights: 255 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "CHILD", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "TEMPORARY" }
              as: Clerk
              captures: { temp_child_id: $.data.id, temp_amt: $.data.monthly_amount_cents }
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "CHILD", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "FINAL" }
              as: Clerk
              captures: { final_child_id: $.data.id, final_amt: $.data.monthly_amount_cents }
          assert:
            - "SupportOrder.${temp_child_id}.monthly_amount_cents == 150000"
            - "SupportOrder.${final_child_id}.monthly_amount_cents == 100000"
            - "SupportOrder.${temp_child_id}.monthly_amount_cents != SupportOrder.${final_child_id}.monthly_amount_cents"

      # ----- Instance 2: SPOUSAL support TEMPORARY vs FINAL (domain: spouse/marriage) -----
      - name: spousal_support_temporary_vs_final_divergence
        grounds:
          - calculations.spousal_support_guideline
          - entities.SupportOrder.fields.variant
          - entities.Party.fields.gross_monthly_income_cents
          - entities.FinancialDisclosure.fields.net_monthly_income_cents
          - entities.Case.fields.marriage_months
        distinguishing_aspect: |
          Dual-variant on a DIFFERENT entity domain than child support: the spousal
          obligation between the two SPOUSES. TEMPORARY (gross 800000/400000) =
          0.40*800000 - 0.50*400000 = 120000 cents; FINAL (net 600000/300000) =
          0.40*600000 - 0.50*300000 = 90000 cents.
        test_recipe:
          setup:
            - "Same CA case as instance 1: both disclosures VERIFIED (petitioner net 600000, respondent net 300000); declared gross 800000/400000; marriage_months=84."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of B", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "ANSWER", filed_by_party_id: "${res_id}" }
              as: Clerk
              captures: { ans_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${ans_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/advance"
              payload: { to_status: "DISCOVERY" }
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 90000, mandatory_retirement_cents: 20000, health_insurance_cents: 10000 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { pet_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${pet_fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
            - call: "POST /api/financial-disclosures/${pet_fd_id}/verify"
              payload: {}
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${res_id}", case_id: "${case_id}", gross_monthly_income_cents: 360000, tax_withholding_cents: 45000, mandatory_retirement_cents: 10000, health_insurance_cents: 5000 }
              as: Respondent
              as_user_id: "u-res"
              captures: { res_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${res_fd_id}/submit"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
            - call: "POST /api/financial-disclosures/${res_fd_id}/verify"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "SPOUSAL", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "TEMPORARY" }
              as: Clerk
              captures: { temp_sp_id: $.data.id }
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "SPOUSAL", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "FINAL" }
              as: Clerk
              captures: { final_sp_id: $.data.id }
          assert:
            - "SupportOrder.${temp_sp_id}.monthly_amount_cents == 120000"
            - "SupportOrder.${final_sp_id}.monthly_amount_cents == 90000"
            - "SupportOrder.${temp_sp_id}.monthly_amount_cents != SupportOrder.${final_sp_id}.monthly_amount_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ----- Instance 1: MODE (a) — child support tiered + proration + non-linear branch -----
      - name: child_support_tiered_proration_mode_a
        grounds:
          - calculations.child_support_guideline
          - entities.GuidelineSchedule.fields.basic_obligation_tiers
          - entities.Child.fields.case_id
          - entities.ParentingPlan.fields.petitioner_time_pct
        distinguishing_aspect: |
          Mode (a): >=3 inputs (combined income 1200000, child_count 2, payor share)
          with non-linear tier selection (tier2 base 150000) + marginal multi-child
          scale-up (150000*1.5=225000) + proration (225000*0.6667=150000) — multiple
          interacting steps, not a single linear formula.
        test_recipe:
          setup:
            - "GuidelineSchedule(CA) full tiers; Case(CA) in DISCOVERY; petitioner gross 800000, respondent gross 400000; 2 children; plan PROPOSED 110/255."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 }, { min_combined_monthly_cents: 1000000, max_combined_monthly_cents: 1999999, base_cents_one_child: 150000, marginal_pct_per_extra_child: 0.50 }, { min_combined_monthly_cents: 2000000, max_combined_monthly_cents: 99999999, base_cents_one_child: 200000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of C", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child One", birth_year: 2016 }
              as: Clerk
            - call: "POST /api/children"
              payload: { case_id: "${case_id}", full_name: "Child Two", birth_year: 2018 }
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/default"
              payload: {}
              as: Clerk
            - call: "POST /api/parenting-plans"
              payload: { case_id: "${case_id}", proposed_by_party_id: "${pet_id}", petitioner_overnights: 110, respondent_overnights: 255 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/support-orders"
              payload: { case_id: "${case_id}", support_type: "CHILD", payor_party_id: "${pet_id}", payee_party_id: "${res_id}", variant: "TEMPORARY" }
              as: Clerk
              captures: { child_id: $.data.id }
          assert:
            - "SupportOrder.${child_id}.monthly_amount_cents == 150000"

      # ----- Instance 2: MODE (b) — net_disposable_income pinned rounding/aggregation order -----
      - name: net_disposable_income_pinned_order_mode_b
        grounds:
          - calculations.net_disposable_income
          - entities.FinancialDisclosure.fields.net_monthly_income_cents
          - state_machines.FinancialDisclosure.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): the rounding/aggregation order is pinned — SUM the three deduction
          lines first (tax 90000 + retire 20000 + health 10000 = 120000), THEN subtract
          from gross 720000, THEN floor at 0 => net 600000. A different order (e.g.
          subtracting then re-rounding) is explicitly excluded by the pinned rule.
        test_recipe:
          setup:
            - "Case(CA) in DISCOVERY with a petitioner Party; one DRAFT FinancialDisclosure gross=720000, tax=90000, retire=20000, health=10000."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of D", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/default"
              payload: {}
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 90000, mandatory_retirement_cents: 20000, health_insurance_cents: 10000 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { fd_id: $.data.id }
          trigger:
            - call: "POST /api/financial-disclosures/${fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
              captures: { net: $.data.net_monthly_income_cents }
          assert:
            - "FinancialDisclosure.${fd_id}.net_monthly_income_cents == 600000"
            - "FinancialDisclosure.${fd_id}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ----- Instance 1: MediationSession cyclic (PARTIAL_AGREEMENT -> IN_SESSION) -----
      - name: mediation_session_partial_then_reopen_cycle
        grounds:
          - state_machines.MediationSession.IN_SESSION_to_PARTIAL_AGREEMENT
          - state_machines.MediationSession.PARTIAL_AGREEMENT_to_IN_SESSION
          - entities.MediationSession.fields.status
        distinguishing_aspect: |
          MediationSession is cyclic: IN_SESSION -> PARTIAL_AGREEMENT -> IN_SESSION,
          re-entering a state already visited. A single session row legitimately
          returns to IN_SESSION after a partial-agreement round.
        test_recipe:
          setup:
            - "Case(CA) in MEDIATION with mediator u-med; a SCHEDULED MediationSession on the case."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
              as: Clerk
            - call: "POST /api/cases"
              payload: { state_code: "CA", caption: "In re Marriage of E", marriage_months: 84, filing_fee_cents: 43500 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "PETITIONER", user_id: "u-pet", full_name: "Pat", gross_monthly_income_cents: 800000 }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /api/parties"
              payload: { case_id: "${case_id}", role: "RESPONDENT", user_id: "u-res", full_name: "Robin", gross_monthly_income_cents: 400000 }
              as: Clerk
              captures: { res_id: $.data.id }
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "PETITION", filed_by_party_id: "${pet_id}" }
              as: Clerk
              captures: { pet_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${pet_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/pleadings"
              payload: { case_id: "${case_id}", pleading_type: "ANSWER", filed_by_party_id: "${res_id}" }
              as: Clerk
              captures: { ans_pleading_id: $.data.id }
            - call: "POST /api/pleadings/${ans_pleading_id}/serve"
              payload: {}
              as: Clerk
            - call: "POST /api/cases/${case_id}/advance"
              payload: { to_status: "DISCOVERY" }
              as: Clerk
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${pet_id}", case_id: "${case_id}", gross_monthly_income_cents: 720000, tax_withholding_cents: 90000, mandatory_retirement_cents: 20000, health_insurance_cents: 10000 }
              as: Petitioner
              as_user_id: "u-pet"
              captures: { pet_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${pet_fd_id}/submit"
              payload: {}
              as: Petitioner
              as_user_id: "u-pet"
            - call: "POST /api/financial-disclosures"
              payload: { party_id: "${res_id}", case_id: "${case_id}", gross_monthly_income_cents: 360000, tax_withholding_cents: 45000, mandatory_retirement_cents: 10000, health_insurance_cents: 5000 }
              as: Respondent
              as_user_id: "u-res"
              captures: { res_fd_id: $.data.id }
            - call: "POST /api/financial-disclosures/${res_fd_id}/submit"
              payload: {}
              as: Respondent
              as_user_id: "u-res"
            - call: "POST /api/cases/${case_id}/assign-mediator"
              payload: { mediator_user_id: "u-med" }
              as: Clerk
            - call: "POST /api/mediation-sessions"
              payload: { case_id: "${case_id}", mediator_user_id: "u-med", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Mediator
              as_user_id: "u-med"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /api/mediation-sessions/${sess_id}/start"
              payload: {}
              as: Mediator
              as_user_id: "u-med"
            - call: "POST /api/mediation-sessions/${sess_id}/conclude"
              payload: { outcome: "PARTIAL_AGREEMENT" }
              as: Mediator
              as_user_id: "u-med"
            - call: "POST /api/mediation-sessions/${sess_id}/start"
              payload: {}
              as: Mediator
              as_user_id: "u-med"
              captures: { st2: $.data.status }
          assert:
            - "MediationSession.${sess_id}.status == IN_SESSION"

      # ----- Instance 2: ParentingPlan cyclic revision (REVISED -> DISPUTED) -----
      - name: parenting_plan_revision_loop_cycle
        grounds:
          - state_machines.ParentingPlan.DISPUTED_to_REVISED
