      - name: availability_shortfall_and_lda_cap_pinned_at_zero_equality_and_one_cent_of_cap
        grounds:
          - calculations.availability_and_liquidated_damages
          - entities.ServiceAgreement.fields.assessed_lda_cents
          - entities.ServiceAgreement.fields.lda_cap_cents
          - entities.ServiceAgreement.fields.energy_based_availability_pct
          - state_machines.ServiceAgreement.ACTIVE_to_IN_SETTLEMENT
        distinguishing_aspect: |
          Five agreements over one identical farm period probe four different boundaries at once:
          the zero-potential-energy division guard returns exactly 100.0000 rather than dividing;
          a guarantee equal to the basis figure yields shortfall exactly 0.0000 and zero damages
          through the max(0, ...) floor; one ten-thousandth of a percentage point above it yields
          100 cents; and the cap binds at exactly the uncapped figure (666700) versus one cent
          below it (666699).
        test_recipe:
          setup:
            - "one farm with two ONLINE turbines and NO scada-sync at all, so period_actual_energy_kwh and period_potential_energy_kwh are both 0 on every turbine"
            - "a period of 2026-06-01T00:00:00Z to 2026-07-01T00:00:00Z, i.e. 720 period hours and a 1440-hour denominator"
            - "exactly one CLOSED non-excluded fault event on T-01 spanning 24 hours inside the period, so time_based_availability_pct is 98.3333"
            - "five ACTIVE agreements on that farm over the identical period, differing only in availability_basis, guaranteed_availability_pct and lda_cap_cents"
