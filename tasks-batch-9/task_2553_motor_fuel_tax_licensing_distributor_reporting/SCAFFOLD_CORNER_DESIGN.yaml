          - calculations.refund_allowable_gallons.constants
          - entities.RefundClaim.fields.allowable_gallons
        distinguishing_aspect: "333.33 gallons at the CONCRETE_MIXER 0.30 allocation is 99.999 gallons, which must be rounded half-up to 100.00 BEFORE the rate is applied, giving 3090 cents; rounding only at the money step would give 3089 cents."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant; clock at 2026-09-05T00:00:00Z."
