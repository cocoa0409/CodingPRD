            - call: "POST /flight-school/enrollments/${enr_id}/clearance"
              payload: { clearance_type: "TSA", decision: "CLEARED" }
              as: SchoolAdmin
            - call: "POST /flight-school/enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "GET /flight-school/aircraft/${ac_id}"
              payload: {}
              as: Dispatcher
              captures: { acv_ac_id_16: $.data.version }
            - call: "POST /flight-school/bookings"
              payload: { enrollment_id: "${enr_id}", aircraft_id: "${ac_id}", instructor_id: "${instr_id}", lesson_type: "DUAL", start_at: "2026-07-01T14:00:00.000Z", end_at: "2026-07-01T16:00:00.000Z", estimated_hours: 2.0, expected_aircraft_version: "${acv_ac_id_16}" }
