            - call: "GET /cecl/model-runs/${run_q2}/allowance-summary"
              payload: {}
              as: CreditAnalyst
          assert:
            - "Run Q1: qualitative_adjustment_cents == 25000 (round_half_up(10000000*25/10000)); total 75000"
            - "Run Q2: qualitative_adjustment_cents == 0 (window 2026-Q1..2026-Q1 does not cover Q2); total 50000"

      - name: segment_allowance_floor_at_zero
        claim_type: constants_applied
        grounds: [calculations.qualitative_adjustment]
