          trigger:
            - { call: "POST /packinghouse/caretaking-invoices/${v6_inv}/payments", payload: { amount_cents: 0 }, as: Grower, as_user_id: "${v6_g}", captures: { v6_e0: "$.data.error_id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${v6_inv}/payments", payload: { amount_cents: 20001 }, as: Grower, as_user_id: "${v6_g}", captures: { v6_e1: "$.data.error_id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${v6_inv}/payments", payload: { amount_cents: 5000 }, as: Grower, as_user_id: "${v6_g}" }
