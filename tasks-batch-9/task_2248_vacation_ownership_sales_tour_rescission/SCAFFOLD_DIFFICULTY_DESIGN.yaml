      - name: funding_state_gate_precedes_fiscal_amount_mismatch
        grounds:
          - validations[priority=9]
          - validations[priority=37]
          - errors[ERR_RESCISSION_PERIOD_ACTIVE]
          - errors[ERR_FUNDING_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          One POST /purchase-agreements/{id}/fund call violates the priority-9 STATE rule
          (rescission_status is still OPEN) and the priority-37 BUSINESS_FISCAL rule
          (collected_amount_cents 999 != financed_amount_cents 3019980) at the same time and
          must return ERR_RESCISSION_PERIOD_ACTIVE (409); the identical payload replayed after
          the sweep expires the window returns ERR_FUNDING_AMOUNT_MISMATCH (422), proving the
          ordering rather than merely asserting one error. Category pair: state vs
          business_fiscal.
