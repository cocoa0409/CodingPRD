              as: ProjectManager
            - call: "POST /procurement-orders/${poB_id}/issue"
              as: ProjectManager
            - call: "POST /procurement-orders/${poC_id}/issue"
              as: ProjectManager
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv2: $.data.version }
            - call: "POST /staging-reservations"
              payload: { procurement_order_id: "${poA_id}", sqft: 600, hold_start: "2026-08-05T00:00:00Z", hold_end: "2026-08-10T00:00:00Z", expected_project_version: "${pv2}" }
