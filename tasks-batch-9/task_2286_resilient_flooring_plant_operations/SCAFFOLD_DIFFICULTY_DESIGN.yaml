  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: raw_material_restriction_five_hop_cascade_to_allocation
        grounds:
          - state_machines.RawMaterial.ACTIVE_to_RESTRICTED
          - state_machines.Formulation.APPROVED_to_RETIRED
          - state_machines.ProductSku.CERTIFIED_to_SUSPENDED
          - state_machines.ProductSku.RELEASED_to_HOLD
          - state_machines.Batch.IN_STOCK_to_HELD
          - state_machines.Allocation.PARTIALLY_FILLED_to_OPEN
          - entities.AllocationLine.fields.void_reason
        distinguishing_aspect: |
          A single POST /raw-materials/{id}/status propagates five hops across five
          different aggregates: RawMaterial -> Formulation -> ProductSku (both
          dimensions) -> Batch -> AllocationLine/Allocation. The proof is that the
          most distant effect is quantitative — the voided line's 1200.00 sqm is
          returned to Batch.available_quantity_sqm and Allocation.allocated_quantity_sqm
          collapses to 0.00 — from a request that never named a batch or allocation.
        test_recipe:
          setup:
            - "RM-STAB is used ONLY by F-MIN, so restricting it isolates the cascade"
            - "F-MIN APPROVED; SKU-A CERTIFIED and commercial_status RELEASED"
            - "RUN-A1 COMPLETED at 1200.00 sqm with qc_disposition RELEASED, so its Batch is IN_STOCK with available_quantity_sqm 1200.00"
            - "Allocation AL-C1 requests 1500.00 sqm STRICT_SKU and is filled to PARTIALLY_FILLED with one 1200.00 sqm line, leaving available_quantity_sqm 0.00"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - &skuARelease
              call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: "RELEASED" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *runA1Qc
            - *getBatchA1
            - *dist
            - call: "POST /allocations"
              payload: { allocation_code: "AL-C1", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 1500.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_c1_id: $.data.id, al_c1_v: $.data.version }
            - call: "POST /allocations/${al_c1_id}/fill"
              payload: { expected_allocation_version: "${al_c1_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_c1_status_before: $.data.status, al_c1_alloc_before: $.data.allocated_quantity_sqm }
          trigger:
            - call: "POST /raw-materials/${rm_stab_id}/status"
              payload: { to_status: "RESTRICTED" }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_stab_status: $.data.status }
            - call: "GET /allocations/${al_c1_id}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { al_c1_status_after: $.data.status, al_c1_alloc_after: $.data.allocated_quantity_sqm }
          assert:
            - "${al_c1_status_before} == PARTIALLY_FILLED and ${al_c1_alloc_before} == 1200.00"
            - "hop 1: ${rm_stab_status} == RESTRICTED"
            - "hop 2: Formulation.${f_min_id}.status == RETIRED"
            - "hop 3: ProductSku.${sku_a_id}.certification_status == SUSPENDED and ProductSku.${sku_a_id}.commercial_status == HOLD"
            - "hop 4: Batch.${batch_a1_id}.status == HELD with hold_reason == 'SKU_ON_HOLD'"
            - "hop 5: GET /allocations/${al_c1_id}/lines returns total_count == 1 with status == VOIDED and void_reason == BATCH_HELD"
            - "${al_c1_status_after} == OPEN and ${al_c1_alloc_after} == 0.00"
            - "Batch.${batch_a1_id}.available_quantity_sqm == 1200.00 — the voided line's area is returned even though the batch is HELD"
            - "Batch.${batch_a1_id}.quantity_sqm == 1200.00 (unchanged)"
            - "ProductionRun.${run_a1_id}.run_status == COMPLETED and qc_disposition == RELEASED — the cascade does not reach back into the run"
            - "RawMaterial.${rm_resin_id}.status == ACTIVE — only the restricted material's recipes are touched"

      - name: license_termination_four_hop_cascade_to_allocation_line
        grounds:
          - state_machines.DesignLicense.ACTIVE_to_TERMINATED
          - state_machines.PrintFilm.AVAILABLE_to_WITHDRAWN
          - state_machines.ProductSku.CERTIFIED_to_SUSPENDED
          - state_machines.Batch.IN_STOCK_to_HELD
          - validations[V-RBAC-2]
          - entities.AllocationLine.fields.void_reason
        distinguishing_aspect: |
          A DIFFERENT four-hop chain rooted in a different aggregate and requiring a
          different actor: only TechnicalDirector may terminate a licence (V-RBAC-2),
          and termination drives PrintFilm -> ProductSku -> Batch -> AllocationLine.
          Unlike SUSPENSION, which stops at RESTRICTED films and never touches the
          certification dimension, TERMINATION drives films all the way to WITHDRAWN
          and forces certification_status to SUSPENDED — asserted side by side.
        test_recipe:
          setup:
            - "LIC-OAK ACTIVE with PF-OAK-1200 AVAILABLE beneath it"
            - "SKU-A CERTIFIED and RELEASED on that film; Batch from RUN-A1 IN_STOCK at 1200.00 sqm"
            - "Allocation AL-C2 filled for 400.00 sqm, leaving available_quantity_sqm 800.00"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *runA1Qc
            - *getBatchA1
            - *dist
            - call: "POST /allocations"
              payload: { allocation_code: "AL-C2", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 400.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_c2_id: $.data.id, al_c2_v: $.data.version }
            - call: "POST /allocations/${al_c2_id}/fill"
              payload: { expected_allocation_version: "${al_c2_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_c2_status_before: $.data.status }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { avail_before_termination: $.data.available_quantity_sqm }
          trigger:
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: "TERMINATED" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { lic_status: $.data.status }
            - call: "GET /allocations/${al_c2_id}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { al_c2_status_after: $.data.status, al_c2_alloc_after: $.data.allocated_quantity_sqm }
          assert:
            - "${al_c2_status_before} == FILLED and ${avail_before_termination} == 800.00"
            - "hop 1: ${lic_status} == TERMINATED and PrintFilm.${pf1_id}.status == WITHDRAWN (not RESTRICTED — that is the SUSPEND path)"
            - "hop 2: ProductSku.${sku_a_id}.certification_status == SUSPENDED and ProductSku.${sku_a_id}.commercial_status == HOLD"
            - "hop 3: Batch.${batch_a1_id}.status == HELD with hold_reason == 'SKU_ON_HOLD'"
            - "hop 4: GET /allocations/${al_c2_id}/lines returns total_count == 1 with status == VOIDED and void_reason == BATCH_HELD"
            - "${al_c2_status_after} == OPEN and ${al_c2_alloc_after} == 0.00"
            - "Batch.${batch_a1_id}.available_quantity_sqm == 1200.00"
            - "Formulation.${f_min_id}.status == APPROVED — a licence termination never reaches the recipe, unlike the raw-material cascade"
            - "DesignLicense.${lic_id}.consumed_volume_sqm == 1200.00 and accrued_royalty_cents == 126000 — the ledger is not reversed by termination"

      - name: panel_failure_aborts_planned_runs_and_releases_reservation
        grounds:
          - state_machines.TestPanel.IN_TEST_to_FAILED
          - state_machines.ProductSku.TESTING_to_UNCERTIFIED
          - state_machines.ProductionRun.PLANNED_to_ABORTED
          - calculations.license_volume_ledger
          - calculations.test_spec_limit_and_outcome
        distinguishing_aspect: |
          A three-hop cascade whose ROOT is a measurement, not a status write: a single
          FAIL TestResult (0.30 mm against a 0.10 mm limit) fails the panel, collapses
          the SKU's certification, aborts its PLANNED run and — through the abort's own
          compensation — returns DesignLicense.reserved_volume_sqm to exactly 0.00. The
          reservation release is two hops removed from the request that caused it.
        test_recipe:
          setup:
            - "SKU-A in certification_status TESTING under APPROVED F-MIN (CLASS_34_43, indentation spec limit 0.10 mm)"
            - "RUN-A1 created and PLANNED for 1200.00 sqm, so LIC-OAK reserved_volume_sqm == 1200.00"
            - "TestPanel TP-F IN_TEST for SKU-A with attempt_no 1 and no results yet"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *pl1
            - *runA1
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { reserved_before_fail: $.data.reserved_volume_sqm }
            - call: "POST /test-panels"
              payload: { panel_code: "TP-F", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_f_id: $.data.id }
            - call: "POST /test-panels/${tp_f_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
          trigger:
            - call: "POST /test-panels/${tp_f_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.30 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { fail_outcome: $.data.outcome, fail_limit: $.data.spec_limit }
            - call: "GET /production-runs/${run_a1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_status_after: $.data.run_status }
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { reserved_after_fail: $.data.reserved_volume_sqm }
          assert:
            - "${reserved_before_fail} == 1200.00"
            - "${fail_limit} == 0.10 and ${fail_outcome} == FAIL (0.30 exceeds the 0.1050 marginal edge)"
            - "hop 1: TestPanel.${tp_f_id}.status == FAILED immediately, without waiting for DIMENSIONAL_STABILITY_HEAT coverage"
            - "TestPanel.${tp_f_id}.retest_count == 0 — a FAIL is not a retest"
            - "hop 2: ProductSku.${sku_a_id}.certification_status == UNCERTIFIED"
            - "hop 3: ${run_status_after} == ABORTED with abort_reason == 'SKU_CERTIFICATION_LOST'"
            - "${reserved_after_fail} == 0.00 — the abort compensation restores the reserved ledger exactly"
            - "DesignLicense.${lic_id}.consumed_volume_sqm == 0.00 and accrued_royalty_cents == 0"
            - "GET /batches with production_run_id == ${run_a1_id} returns total_count == 0"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict (four distinct category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: allocation_own_state_beats_no_eligible_batch_referential
        grounds:
          - validations[V-STATE-9]
          - validations[V-REF-7]
          - errors.ERR_INVALID_ALLOCATION_STATE
          - errors.ERR_NO_ELIGIBLE_BATCH
          - endpoints["POST /allocations/{id}/fill"]
        distinguishing_aspect: |
          CONFLICT A — own_entity_state (priority 7) versus business_referential
          (priority 14). A RELEASED allocation for a SKU with NO stock in hand
          violates both V-STATE-9 and V-REF-7 in the same request; the response must
          be ERR_INVALID_ALLOCATION_STATE (409), and a sibling OPEN allocation in the
          same database proves V-REF-7 was genuinely violated by returning
          ERR_NO_ELIGIBLE_BATCH (409) for exactly the same empty candidate set.
        test_recipe:
          setup:
            - "SKU-A CERTIFIED and commercial_status RELEASED, so neither V-REF-6 nor V-XSTATE-6 can fire"
            - "no ProductionRun has ever completed, so no Batch exists for SKU-A and the candidate set of allocation_fill_plan step 1 is empty"
            - "Allocation AL-P1 created then RELEASED; Allocation AL-P2 created and left OPEN"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *dist
            - call: "POST /allocations"
              payload: { allocation_code: "AL-P1", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 100.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_p1_id: $.data.id }
            - call: "POST /allocations/${al_p1_id}/release"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_p1_released_status: $.data.status, al_p1_v: $.data.version }
            - call: "POST /allocations"
              payload: { allocation_code: "AL-P2", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 100.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_p2_id: $.data.id, al_p2_v: $.data.version }
          trigger:
            - call: "POST /allocations/${al_p1_id}/fill"
              payload: { expected_allocation_version: "${al_p1_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { conflict_a_error: $.data.error_id }
            - call: "POST /allocations/${al_p2_id}/fill"
              payload: { expected_allocation_version: "${al_p2_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { control_a_error: $.data.error_id }
          assert:
            - "${al_p1_released_status} == RELEASED"
            - "the AL-P1 fill returns HTTP 409 with ${conflict_a_error} == ERR_INVALID_ALLOCATION_STATE (priority 7 wins)"
            - "${conflict_a_error} != ERR_NO_ELIGIBLE_BATCH even though the candidate set is empty for this allocation too"
            - "the AL-P2 fill returns HTTP 409 with ${control_a_error} == ERR_NO_ELIGIBLE_BATCH (priority 14 surfaces once priority 7 is satisfied)"
            - "Allocation.${al_p1_id}.status == RELEASED and allocated_quantity_sqm == 0.00 — the rejected fill changed nothing"
            - "Allocation.${al_p2_id}.status == OPEN and allocated_quantity_sqm == 0.00"
            - "Allocation.${al_p2_id}.version == ${al_p2_v} — a rejected fill does not increment version"

      - name: test_coverage_safety_beats_formulation_referential_on_certify
        grounds:
          - validations[V-SAFE-3]
          - validations[V-REF-1]
          - errors.ERR_TEST_COVERAGE_INCOMPLETE
          - errors.ERR_FORMULATION_NOT_APPROVED
          - state_machines.Formulation.APPROVED_to_SUPERSEDED
          - endpoints["POST /formulations/{id}/revisions"]
        distinguishing_aspect: |
          CONFLICT B — business_safety (priority 11) versus business_referential
          (priority 14) on POST /product-skus/{id}/certify. The SKU has NO passing
          coverage AND its recipe has been SUPERSEDED by an approved revision, so both
          rules are live: the answer must be ERR_TEST_COVERAGE_INCOMPLETE (422). Adding
          the missing coverage afterwards then exposes ERR_FORMULATION_NOT_APPROVED
          (409) on an otherwise identical request, which is what makes the ordering
          falsifiable rather than merely asserted.
        test_recipe:
          setup:
            - "SKU-A in certification_status TESTING with no TestPanel at all"
            - "F-MIN APPROVED, then revised: the revision F-MIN-R2 is submitted and approved, which drives F-MIN to SUPERSEDED without touching SKU-A's certification"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - call: "GET /formulations/${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { f_min_v: $.data.version }
            - call: "POST /formulations/${f_min_id}/revisions"
              payload: { formulation_code: "F-MIN-R2", expected_formulation_version: "${f_min_v}" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_rev_id: $.data.id }
            - call: "POST /formulations/${f_rev_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_rev_id}/components"
              payload: { raw_material_id: "${rm_stab_id}", phr: 4 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_rev_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_rev_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { rev_status: $.data.status }
          trigger:
            - call: "POST /product-skus/${sku_a_id}/certify"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { conflict_b_error: $.data.error_id }
            - call: "POST /test-panels"
              payload: { panel_code: "TP-CB", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_cb_id: $.data.id }
            - call: "POST /test-panels/${tp_cb_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_cb_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.08 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_cb_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.12 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_cb_status_marker: $.data.outcome }
            - call: "POST /product-skus/${sku_a_id}/certify"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { control_b_error: $.data.error_id }
          assert:
            - "${rev_status} == APPROVED and Formulation.${f_min_id}.status == SUPERSEDED"
            - "ProductSku.${sku_a_id}.certification_status == TESTING immediately after the supersession — a SUPERSEDED recipe does not cascade, unlike a RETIRED one"
            - "the first certify returns HTTP 422 with ${conflict_b_error} == ERR_TEST_COVERAGE_INCOMPLETE (priority 11 wins)"
            - "${conflict_b_error} != ERR_FORMULATION_NOT_APPROVED even though F-MIN is SUPERSEDED"
            - "${tp_cb_status_marker} == PASS and TestPanel.${tp_cb_id}.status == PASSED"
            - "ProductSku.${sku_a_id}.certification_status == PROVISIONAL after the panel PASSES"
            - "the second certify returns HTTP 409 with ${control_b_error} == ERR_FORMULATION_NOT_APPROVED (priority 14 surfaces once coverage is complete)"
            - "ProductSku.${sku_a_id}.standard_cost_cents_per_sqm is null — neither certify attempt stamped a cost"
            - "ProductSku.${sku_a_id}.certification_status == PROVISIONAL, never CERTIFIED"

      - name: press_window_temporal_beats_license_volume_fiscal
        grounds:
          - validations[V-TEMP-1]
          - validations[V-FISC-1]
          - errors.ERR_PRESS_LINE_WINDOW_CONFLICT
          - errors.ERR_LICENSE_VOLUME_CAP_EXCEEDED
          - calculations.license_volume_ledger
        distinguishing_aspect: |
          CONFLICT C — business_temporal (priority 13) versus business_fiscal
          (priority 15). One POST /production-runs both overlaps RUN-A1's press-line
          window AND pushes 0.00 + 1200.00 + 900.00 == 2100.00 past the 2000.00 cap,
          so ERR_PRESS_LINE_WINDOW_CONFLICT (409) must win. Moving only the window to a
          disjoint slot, with the identical 900.00 quantity, then yields
          ERR_LICENSE_VOLUME_CAP_EXCEEDED (422). SKU-C rides a second film with
          master_roll_sets 2 precisely so that the co-priority V-TEMP-3 stays silent.
        test_recipe:
          setup:
            - "LIC-OAK term_volume_cap_sqm 2000.00; RUN-A1 PLANNED for 1200.00 sqm on PL-1 across [01:00, 09:00)"
            - "PF-OAK-1800 AVAILABLE under the same licence with master_roll_sets 2"
            - "SKU-C on that second film, same F-MIN recipe and 2.5 mm thickness, in certification_status TESTING"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *pl1
            - *runA1
            - &pf2
              call: "POST /print-films"
              payload: { design_code: "PF-OAK-1800", license_id: "${lic_id}", pattern_repeat_mm_length: 1800.0, pattern_repeat_mm_width: 300.0, registration_tolerance_mm: 0.30, emboss_plate_code: "EMB-OAK-B", emboss_alignment_offset_mm: 0.12, master_roll_sets: 2 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf2_id: $.data.id }
            - &skuC
              call: "POST /product-skus"
              payload: { sku_code: "SKU-C", formulation_id: "${f_min_id}", print_film_id: "${pf2_id}", construction_type: "GLUE_DOWN", wear_layer_mil: 12, overall_thickness_mm: 2.5, waterproof_rated: false, attached_underlayment_type: "NONE", profile_family: "NONE", royalty_basis_price_cents_per_sqm: 2100, target_margin_bps: 3500 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_c_id: $.data.id }
            - &skuCBegin
              call: "POST /product-skus/${sku_c_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-C-OVERLAP", sku_id: "${sku_c_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T05:00:00Z", planned_end_utc: "2026-08-01T07:00:00Z", planned_quantity_sqm: 900.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { conflict_c_error: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-C-DISJOINT", sku_id: "${sku_c_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T10:00:00Z", planned_end_utc: "2026-08-01T12:00:00Z", planned_quantity_sqm: 900.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { control_c_error: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-C-FITS", sku_id: "${sku_c_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T10:00:00Z", planned_end_utc: "2026-08-01T12:00:00Z", planned_quantity_sqm: 800.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_c_fits_id: $.data.id }
          assert:
            - "the overlapping 900.00 attempt returns HTTP 409 with ${conflict_c_error} == ERR_PRESS_LINE_WINDOW_CONFLICT (priority 13 wins)"
            - "${conflict_c_error} != ERR_LICENSE_VOLUME_CAP_EXCEEDED and != ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED and != ERR_CHANGEOVER_GAP_INSUFFICIENT — no other priority-13 rule is co-violated"
            - "the disjoint 900.00 attempt returns HTTP 422 with ${control_c_error} == ERR_LICENSE_VOLUME_CAP_EXCEEDED (priority 15 surfaces once the window is clean)"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 1200.00 after both rejections — neither rejected request reserved anything"
            - "the 800.00 attempt in the same disjoint window returns 201, because 0.00 + 1200.00 + 800.00 == 2000.00 exactly"
            - "ProductionRun.${run_c_fits_id}.run_status == PLANNED and planned_quantity_sqm == 800.00"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 2000.00 after the admitted run"
            - "the changeover gap from RUN-A1 (ends 09:00) to RUN-C-FITS (starts 10:00) is 60 minutes against a requirement of 30 (CEIL(60 * 0.50) + 0, same formulation, zero thickness delta), so V-TEMP-2 is satisfied"

      - name: segregation_of_duties_beats_raw_material_referential_on_review
        grounds:
          - validations[V-SOD-1]
          - validations[V-REF-2]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_RAW_MATERIAL_NOT_ACTIVE
          - entities.Formulation.fields.authored_by_user_id
          - rbac.TechnicalDirector
        distinguishing_aspect: |
          CONFLICT D — segregation_of_duties (priority 9) versus business_referential
          (priority 14). The recipe under review contains a RESTRICTED material AND is
          being reviewed by its own author, who happens to also hold the
          TechnicalDirector role, so V-RBAC-1 is satisfied and the two remaining rules
          race: ERR_SEGREGATION_OF_DUTIES (403) must win over
          ERR_RAW_MATERIAL_NOT_ACTIVE (409). A second reviewer with a different
          X-User-ID then draws the referential error from the identical state.
        test_recipe:
          setup:
            - "user 'td-dual' authors Formulation F-SOD while acting as Formulator and also holds the TechnicalDirector role"
            - "F-SOD = RM-RESIN 100 phr + RM-PLAST 30 phr, submitted and therefore UNDER_REVIEW"
            - "RM-PLAST is then set to RESTRICTED, so V-REF-2 is violated for every write on this recipe"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmPlast
            - call: "POST /formulations"
              payload: { formulation_code: "F-SOD" }
              as: Formulator
              as_user_id: "td-dual"
              captures: { f_sod_id: $.data.id, f_sod_author: $.data.authored_by_user_id }
            - call: "POST /formulations/${f_sod_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "td-dual"
            - call: "POST /formulations/${f_sod_id}/components"
              payload: { raw_material_id: "${rm_plast_id}", phr: 30 }
              as: Formulator
              as_user_id: "td-dual"
            - call: "POST /formulations/${f_sod_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "td-dual"
              captures: { f_sod_submitted_status: $.data.status }
            - call: "POST /raw-materials/${rm_plast_id}/status"
              payload: { to_status: "RESTRICTED" }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { plast_status: $.data.status }
          trigger:
            - call: "POST /formulations/${f_sod_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-dual"
              captures: { conflict_d_error: $.data.error_id }
            - call: "POST /formulations/${f_sod_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { control_d_error: $.data.error_id }
          assert:
            - "${f_sod_author} == 'td-dual' and ${f_sod_submitted_status} == UNDER_REVIEW"
            - "${plast_status} == RESTRICTED, and Formulation.${f_sod_id}.status == UNDER_REVIEW (a DRAFT/UNDER_REVIEW recipe is not RETIRED by the restriction, unlike an APPROVED one)"
            - "the author's review returns HTTP 403 with ${conflict_d_error} == ERR_SEGREGATION_OF_DUTIES (priority 9 wins)"
            - "${conflict_d_error} != ERR_RAW_MATERIAL_NOT_ACTIVE and != ERR_UNAUTHORIZED — the acting role is legitimate, only the identity is not"
            - "the second reviewer's identical request returns HTTP 409 with ${control_d_error} == ERR_RAW_MATERIAL_NOT_ACTIVE (priority 14 surfaces once SoD is satisfied)"
            - "Formulation.${f_sod_id}.status == UNDER_REVIEW after both rejections and rejection_count == 0"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: formulation_score_exactly_sixty_and_indentation_class_floor
        grounds:
          - calculations.formulation_blend_metrics
          - validations[V-CON-1]
          - validations[V-CON-2]
          - errors.ERR_PERFORMANCE_SCORE_BELOW_MINIMUM
          - errors.ERR_INDENTATION_CLASS_TOO_LOW
        distinguishing_aspect: |
          Three single-resin recipes sit on two independent inclusive floors at once.
          F-B60 scores exactly 60.00 with blended_indentation exactly 70.000000 and is
          APPROVED (both floors inclusive). F-B59 scores 59.75 and is rejected by
          V-CON-1. F-B69 scores exactly 60.00 as well but its indentation is 69.000000,
          one point under the class floor, so it clears V-CON-1 and is rejected by
          V-CON-2 — proving performance_score and indentation_resistance_class are
          independent gates read off different quantities.
        test_recipe:
          setup:
            - "RM-B60: cost 120, indentation_index 70, thermal_stability_index 40, plasticizer_migration_index 28, max_phr 100 -> 0.40*70 + 0.35*40 + 0.25*72 == 60.00 exactly"
            - "RM-B59: cost 115, indentation_index 70, thermal_stability_index 40, plasticizer_migration_index 29 -> 59.75"
            - "RM-B69: cost 100, indentation_index 69, thermal_stability_index 64, plasticizer_migration_index 60 -> 60.00 exactly but CLASS_23_31"
            - "each recipe holds exactly one component at 100 phr, so both ratios are 0.0000 and no penalty applies"
          setup_api_calls:
            - *clock0
            - call: "POST /raw-materials"
              payload: { material_code: "RM-B60", name: "Boundary resin at sixty", category: "VINYL_RESIN", cost_per_kg_cents: 120, indentation_index: 70, thermal_stability_index: 40, plasticizer_migration_index: 28, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_b60_id: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "RM-B59", name: "Boundary resin just under", category: "VINYL_RESIN", cost_per_kg_cents: 115, indentation_index: 70, thermal_stability_index: 40, plasticizer_migration_index: 29, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_b59_id: $.data.id }
            - call: "POST /raw-materials"
              payload: { material_code: "RM-B69", name: "Boundary resin under class floor", category: "VINYL_RESIN", cost_per_kg_cents: 100, indentation_index: 69, thermal_stability_index: 64, plasticizer_migration_index: 60, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_b69_id: $.data.id }
            - call: "POST /formulations"
              payload: { formulation_code: "F-B60" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_b60_id: $.data.id }
            - call: "POST /formulations/${f_b60_id}/components"
              payload: { raw_material_id: "${rm_b60_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_b60_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { b60_score: $.data.performance_score, b60_class: $.data.indentation_resistance_class }
            - call: "POST /formulations"
              payload: { formulation_code: "F-B59" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_b59_id: $.data.id }
            - call: "POST /formulations/${f_b59_id}/components"
              payload: { raw_material_id: "${rm_b59_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_b59_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { b59_score: $.data.performance_score }
            - call: "POST /formulations"
              payload: { formulation_code: "F-B69" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_b69_id: $.data.id }
            - call: "POST /formulations/${f_b69_id}/components"
              payload: { raw_material_id: "${rm_b69_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_b69_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { b69_score: $.data.performance_score, b69_class: $.data.indentation_resistance_class }
          trigger:
            - call: "POST /formulations/${f_b60_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { b60_final_status: $.data.status }
            - call: "POST /formulations/${f_b59_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { b59_error: $.data.error_id }
            - call: "POST /formulations/${f_b69_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { b69_error: $.data.error_id }
          assert:
            - "${b60_score} == 60.00 and ${b60_class} == CLASS_33_42"
            - "${b60_final_status} == APPROVED — MIN_APPROVAL_SCORE 60.00 is inclusive"
            - "Formulation.${f_b60_id}.blended_cost_per_kg_cents == 120 and cost_basis == PINNED"
            - "${b59_score} == 59.75"
            - "the F-B59 approval returns HTTP 422 with ${b59_error} == ERR_PERFORMANCE_SCORE_BELOW_MINIMUM"
            - "Formulation.${f_b59_id}.status == UNDER_REVIEW and rejection_count == 0 — a validation rejection is not a REJECT decision"
            - "${b69_score} == 60.00 and ${b69_class} == CLASS_23_31"
            - "the F-B69 approval returns HTTP 422 with ${b69_error} == ERR_INDENTATION_CLASS_TOO_LOW, not ERR_PERFORMANCE_SCORE_BELOW_MINIMUM"
            - "Formulation.${f_b69_id}.status == UNDER_REVIEW"

      - name: changeover_gap_exactly_required_versus_one_minute_short
        grounds:
          - calculations.press_line_changeover_gap
          - validations[V-TEMP-2]
          - errors.ERR_CHANGEOVER_GAP_INSUFFICIENT
          - entities.ProductionRun.fields.changeover_minutes_applied
          - calculations.sku_required_test_types
        distinguishing_aspect: |
          The required gap after RUN-A1 for a SKU on a different recipe and a different
          film with a 2.5 mm thickness step is CEIL(60 * 1.00) + 30 == 90 minutes
          exactly. A start at 10:29 (89 minutes) is rejected and a start at 10:30
          (exactly 90) is admitted, and setup then persists
          changeover_minutes_applied == 90 — the same number read through two
          different code paths (the V-TEMP-2 predicate and the stored field).
        test_recipe:
          setup:
            - "SKU-A (F-MIN, PF-OAK-1200, 2.5 mm) with RUN-A1 PLANNED across [01:00, 09:00) on PL-1 (changeover_minutes 60)"
            - "F-STD APPROVED (performance_score 87.15, CLASS_34_43)"
            - "SKU-B: CLICK_LOCK_SPC on F-STD and PF-OAK-1800, waterproof, IXPE_1MM, UNILIN_5G, wear 20 mil, 5.0 mm, tongue 2.00 +0.15/-0.10 mm, target lock shear 1.20 N/mm"
            - "SKU-B reaches PROVISIONAL via TestPanel TP-B covering all five required test types"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *rmPlast
            - *rmFiller
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *fstd
            - *fstdC1
            - *fstdC2
            - *fstdC3
            - *fstdC4
            - &fstdSubmit
              call: "POST /formulations/${f_std_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-002"
            - &fstdApprove
              call: "POST /formulations/${f_std_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - *lic
            - *pf1
            - *skuA
            - *pl1
            - *runA1
            - *pf2
            - &skuB
              call: "POST /product-skus"
              payload: { sku_code: "SKU-B", formulation_id: "${f_std_id}", print_film_id: "${pf2_id}", construction_type: "CLICK_LOCK_SPC", wear_layer_mil: 20, overall_thickness_mm: 5.0, waterproof_rated: true, attached_underlayment_type: "IXPE_1MM", profile_family: "UNILIN_5G", tongue_thickness_target_mm: 2.00, tolerance_plus_mm: 0.15, tolerance_minus_mm: 0.10, target_lock_shear_n_per_mm: 1.20, royalty_basis_price_cents_per_sqm: 3200, target_margin_bps: 4000 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_b_id: $.data.id }
            - &skuBBegin
              call: "POST /product-skus/${sku_b_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpB
              call: "POST /test-panels"
              payload: { panel_code: "TP-B", sku_id: "${sku_b_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_b_id: $.data.id, tp_b_required: $.data.required_test_types }
            - &tpBStart
              call: "POST /test-panels/${tp_b_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpBInd
              call: "POST /test-panels/${tp_b_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.08 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpBDim
              call: "POST /test-panels/${tp_b_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.10 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpBSlip
              call: "POST /test-panels/${tp_b_id}/results"
              payload: { test_type: "SLIP_RESISTANCE", measured_value: 0.55 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpBPeel
              call: "POST /test-panels/${tp_b_id}/results"
              payload: { test_type: "PEEL_ADHESION_DELAMINATION", measured_value: 40.0 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpBLock
              call: "POST /test-panels/${tp_b_id}/results"
              payload: { test_type: "LOCK_SHEAR", measured_value: 1.50 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_b_last_outcome: $.data.outcome }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-B-89", sku_id: "${sku_b_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T10:29:00Z", planned_end_utc: "2026-08-01T12:29:00Z", planned_quantity_sqm: 300.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { gap_error: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-B-90", sku_id: "${sku_b_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T10:30:00Z", planned_end_utc: "2026-08-01T12:30:00Z", planned_quantity_sqm: 300.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_b90_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:30:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "POST /production-runs/${run_b90_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { applied_changeover: $.data.changeover_minutes_applied }
          assert:
            - "${tp_b_required} == ['RESIDUAL_INDENTATION', 'DIMENSIONAL_STABILITY_HEAT', 'SLIP_RESISTANCE', 'PEEL_ADHESION_DELAMINATION', 'LOCK_SHEAR']"
            - "${tp_b_last_outcome} == PASS and TestPanel.${tp_b_id}.status == PASSED"
            - "ProductSku.${sku_b_id}.certification_status == PROVISIONAL"
            - "ProductSku.${sku_b_id}.warranty_years == 30 and light_commercial_warranty_years == 20 (25 + 5 and 15 + 5, both capped)"
            - "the 10:29 attempt returns HTTP 409 with ${gap_error} == ERR_CHANGEOVER_GAP_INSUFFICIENT — 89 < 90"
            - "the 10:30 attempt returns 201: 90 >= 90, the check is inclusive"
            - "${applied_changeover} == 90"
            - "ProductionRun.${run_b90_id}.changeover_minutes_applied == 90 == CEIL(60 * 1.00) + 30 (unrelated formulation and film, |5.0 - 2.5| == 2.5 >= 2.0)"
            - "ProductionRun.${run_b90_id}.run_status == SETUP"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 1500.00 (1200.00 from RUN-A1 plus 300.00 from RUN-B-90; the rejected attempt reserved nothing)"

      - name: zero_actual_quantity_mints_no_batch_and_accrues_no_royalty
        grounds:
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - calculations.license_royalty_accrual
          - calculations.run_quality_metrics
          - calculations.license_volume_ledger
          - entities.Batch
        distinguishing_aspect: |
          actual_quantity_sqm == 0.00 is the exclusive boundary of Batch creation: the
          run completes normally, its four QC gates are all true and
          auto_disposition_recommendation is RELEASED, yet NO Batch row is minted,
          royalty_accrued_cents is 0, pattern_waste_sqm is 0.00 and the licence ledger
          ends at reserved 0.00 / consumed 0.00 — the 1200.00 reservation is released
          against a zero consumption.
        test_recipe:
          setup:
            - "SKU-A CERTIFIED, RUN-A1 RUNNING on PL-1 with planned_quantity_sqm 1200.00 and LIC-OAK reserved_volume_sqm 1200.00"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
          trigger:
            - call: "POST /production-runs/${run_a1_id}/complete"
              payload: { actual_quantity_sqm: 0.00, registration_drift_mm: 0.10, curl_deviation_mm: 0.05, emboss_alignment_offset_mm: 0.15, wear_layer_measured_mil: 12.0 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { zero_royalty: $.data.royalty_accrued_cents, zero_waste: $.data.pattern_waste_sqm, zero_reco: $.data.auto_disposition_recommendation }
            - call: "GET /batches"
              payload: { production_run_id: "${run_a1_id}" }
              as: ProductionPlanner
              as_user_id: "pp-001"
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { zero_reserved: $.data.reserved_volume_sqm, zero_consumed: $.data.consumed_volume_sqm, zero_accrued: $.data.accrued_royalty_cents }
          assert:
            - "ProductionRun.${run_a1_id}.run_status == COMPLETED and actual_quantity_sqm == 0.00"
            - "${zero_royalty} == 0"
            - "${zero_waste} == 0.00"
            - "${zero_reco} == RELEASED"
            - "ProductionRun.${run_a1_id}.registration_within_tolerance == true and emboss_within_tolerance == true and curl_within_tolerance == true and tongue_within_tolerance == true"
            - "GET /batches with production_run_id == ${run_a1_id} returns total_count == 0 and has_more == false"
            - "${zero_reserved} == 0.00 and ${zero_consumed} == 0.00 and ${zero_accrued} == 0"
            - "GET /design-licenses/${lic_id}/utilization returns data.contributing_run_count == 1 and data.remaining_volume_sqm == 2000.00"

      - name: test_result_pass_at_spec_limit_versus_marginal_edge_versus_one_increment_beyond
        grounds:
          - calculations.test_spec_limit_and_outcome
          - state_machines.TestPanel.IN_TEST_to_FAILED
          - entities.TestResult.fields.outcome
          - entities.TestResult.fields.spec_limit
          - entities.TestResult.fields.unit
        distinguishing_aspect: |
          Three panels of the same SKU receive RESIDUAL_INDENTATION values 0.1000,
          0.1050 and 0.1051 mm against an inclusive 0.10 limit whose marginal edge is
          ROUND_HALF_UP(0.10 * 1.05, 4) == 0.1050. The outcomes must be PASS, MARGINAL
          and FAIL respectively — the entire discrimination lives in the fourth decimal
          place, and only the FAIL propagates to the panel and the SKU.
        test_recipe:
          setup:
            - "SKU-A in TESTING under CLASS_34_43 F-MIN, so the indentation spec limit is 0.10 mm"
            - "three TestPanels TP-E1, TP-E2, TP-E3 all created and started while the SKU is still TESTING"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - call: "POST /test-panels"
              payload: { panel_code: "TP-E1", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_e1_id: $.data.id }
            - call: "POST /test-panels"
              payload: { panel_code: "TP-E2", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_e2_id: $.data.id }
            - call: "POST /test-panels"
              payload: { panel_code: "TP-E3", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_e3_id: $.data.id }
            - call: "POST /test-panels/${tp_e1_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_e2_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_e3_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
          trigger:
            - call: "POST /test-panels/${tp_e1_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.1000 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { e1_outcome: $.data.outcome, e1_unit: $.data.unit, e1_limit: $.data.spec_limit }
            - call: "POST /test-panels/${tp_e2_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.1050 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { e2_outcome: $.data.outcome }
            - call: "POST /test-panels/${tp_e3_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.1051 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { e3_outcome: $.data.outcome }
          assert:
            - "${e1_limit} == 0.10 and ${e1_unit} == 'mm'"
            - "${e1_outcome} == PASS — measured_value exactly equal to the limit is inclusive"
            - "${e2_outcome} == MARGINAL — 0.1050 is exactly the marginal edge"
            - "${e3_outcome} == FAIL — one increment of the fourth decimal beyond the edge"
            - "TestPanel.${tp_e1_id}.status == IN_TEST and attempt_no == 1 (coverage still incomplete)"
            - "TestPanel.${tp_e2_id}.status == IN_TEST and retest_count == 0 — a MARGINAL only becomes RETEST_REQUIRED once coverage is complete"
            - "TestPanel.${tp_e3_id}.status == FAILED — a FAIL short-circuits coverage"
            - "ProductSku.${sku_a_id}.certification_status == UNCERTIFIED"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_setup_blocked_until_sku_certification_reaches_provisional
        grounds:
          - validations[V-XSTATE-2]
          - errors.ERR_SKU_NOT_PRODUCIBLE
          - state_machines.ProductSku.TESTING_to_PROVISIONAL
          - state_machines.ProductionRun.PLANNED_to_SETUP
          - endpoints["POST /production-runs/{id}/setup"]
        distinguishing_aspect: |
          V-XSTATE-2 uses a DIFFERENT admissible set at creation than at setup:
          TESTING is enough to create a run but not to set it up. The same run object,
          untouched, is first rejected with ERR_SKU_NOT_PRODUCIBLE and then accepted
          after a PASSED panel moves the SKU from TESTING to PROVISIONAL — nothing
          about the run changed, only a different aggregate's state.
        test_recipe:
          setup:
            - "SKU-A in certification_status TESTING, PL-1 AVAILABLE"
            - "RUN-A1 PLANNED across [01:00, 09:00); the clock is 2026-08-01T00:00:00Z, comfortably inside the 120-minute setup lead window"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *pl1
            - *runA1
          trigger:
            - call: "POST /production-runs/${run_a1_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { setup_blocked_error: $.data.error_id }
            - call: "POST /test-panels"
              payload: { panel_code: "TP-X1", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_x1_id: $.data.id }
            - call: "POST /test-panels/${tp_x1_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_x1_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.08 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_x1_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.12 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /production-runs/${run_a1_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { setup_ok_status: $.data.run_status }
          assert:
            - "the first setup returns HTTP 409 with ${setup_blocked_error} == ERR_SKU_NOT_PRODUCIBLE while certification_status == TESTING"
            - "${setup_blocked_error} != ERR_SETUP_TOO_EARLY — the clock at 2026-08-01T00:00:00Z is later than 01:00 minus 120 minutes"
            - "ProductionRun.${run_a1_id}.run_status == PLANNED after the rejection"
            - "TestPanel.${tp_x1_id}.status == PASSED and ProductSku.${sku_a_id}.certification_status == PROVISIONAL"
            - "the second setup returns 200 with ${setup_ok_status} == SETUP"
            - "ProductionRun.${run_a1_id}.changeover_minutes_applied == 0 — RUN-A1 has no predecessor on PL-1"
            - "the creation of RUN-A1 itself succeeded while the SKU was only TESTING, which is the asymmetry under test"

      - name: batch_hold_release_gated_by_producing_run_qc_disposition
        grounds:
          - validations[V-XSTATE-4]
          - validations[V-SOD-3]
          - errors.ERR_RUN_NOT_RELEASED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.Batch.IN_PRODUCTION_to_HELD
          - state_machines.ProductionRun.QUARANTINED_to_RELEASED
        distinguishing_aspect: |
          A HELD Batch cannot be released while its producing run sits in
          qc_disposition QUARANTINED, and the gate is layered: the quarantining
          technician is refused first with ERR_SEGREGATION_OF_DUTIES (priority 9) and a
          second technician is then refused with ERR_RUN_NOT_RELEASED (priority 10).
          Flipping the RUN's disposition to RELEASED moves the Batch to IN_STOCK by
          side effect, so the batch endpoint is never needed at all.
        test_recipe:
          setup:
            - "SKU-A CERTIFIED; RUN-A1 COMPLETED at 1200.00 sqm with all four QC gates true"
            - "qa-001 quarantines the run, so the minted Batch is HELD with hold_reason 'QC_QUARANTINE' and held_by_user_id 'qa-001'"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: "QUARANTINED" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { qc_quarantined: $.data.qc_disposition }
            - call: "GET /batches"
              payload: { production_run_id: "${run_a1_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { batch_q_id: "$.data[0].id", batch_q_status: "$.data[0].status", batch_q_holder: "$.data[0].held_by_user_id" }
          trigger:
            - call: "POST /batches/${batch_q_id}/hold-status"
              payload: { action: "RELEASE_HOLD" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { sod_error: $.data.error_id }
            - call: "POST /batches/${batch_q_id}/hold-status"
              payload: { action: "RELEASE_HOLD" }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { xstate_error: $.data.error_id }
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: "RELEASED" }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { qc_released: $.data.qc_disposition }
            - call: "GET /batches/${batch_q_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { batch_final_status: $.data.status, batch_final_available: $.data.available_quantity_sqm }
          assert:
            - "${qc_quarantined} == QUARANTINED, ${batch_q_status} == HELD and ${batch_q_holder} == 'qa-001'"
            - "Batch.${batch_q_id}.hold_reason == 'QC_QUARANTINE' and available_quantity_sqm == 0.00 while HELD"
            - "the qa-001 release returns HTTP 403 with ${sod_error} == ERR_SEGREGATION_OF_DUTIES (priority 9 precedes the cross-entity gate)"
            - "the qa-002 release returns HTTP 409 with ${xstate_error} == ERR_RUN_NOT_RELEASED"
            - "${qc_released} == RELEASED and ProductionRun.${run_a1_id}.run_status == COMPLETED"
            - "${batch_final_status} == IN_STOCK and ${batch_final_available} == 1200.00 — the HELD -> IN_STOCK move is a side effect of the run write"
            - "Batch.${batch_q_id}.hold_reason is null and held_by_user_id is null"
            - "no successful POST /batches/${batch_q_id}/hold-status call occurs anywhere in this instance"

      - name: allocation_create_gated_by_certification_and_fill_gated_by_commercial_status
        grounds:
          - validations[V-REF-6]
          - validations[V-XSTATE-6]
          - errors.ERR_SKU_NOT_PRODUCIBLE
          - state_machines.ProductSku.PROVISIONAL_to_CERTIFIED
          - state_machines.ProductSku.DEVELOPMENT_to_RELEASED
          - calculations.allocation_fill_plan
        distinguishing_aspect: |
          The SAME error code is produced by two rules reading two DIFFERENT dimensions
          of the same parallel state machine at two different endpoints: creation needs
          certification_status == CERTIFIED (V-REF-6, priority 14) and filling needs
          commercial_status == RELEASED (V-XSTATE-6, priority 10). A PROVISIONAL SKU
          fails creation; a CERTIFIED but DEVELOPMENT SKU creates fine and fails the
          fill; only after the commercial release does the fill draw stock.
        test_recipe:
          setup:
            - "SKU-A reaches PROVISIONAL via a PASSED panel and produces RUN-A1 (1200.00 sqm, qc RELEASED), so a Batch is IN_STOCK with available_quantity_sqm 1200.00"
            - "SKU-A is deliberately left in commercial_status DEVELOPMENT until the last step"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *runA1Qc
            - *getBatchA1
            - *dist
          trigger:
            - call: "POST /allocations"
              payload: { allocation_code: "AL-G1", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 300.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { create_blocked_error: $.data.error_id }
            - call: "POST /product-skus/${sku_a_id}/certify"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { cert_status: $.data.certification_status, cert_commercial: $.data.commercial_status }
            - call: "POST /allocations"
              payload: { allocation_code: "AL-G1", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 300.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_g1_id: $.data.id, al_g1_v: $.data.version }
            - call: "POST /allocations/${al_g1_id}/fill"
              payload: { expected_allocation_version: "${al_g1_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { fill_blocked_error: $.data.error_id }
            - call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: "RELEASED" }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { released_commercial: $.data.commercial_status }
            - call: "POST /allocations/${al_g1_id}/fill"
              payload: { expected_allocation_version: "${al_g1_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { fill_ok_status: $.data.status, fill_ok_alloc: $.data.allocated_quantity_sqm }
          assert:
            - "ProductSku.${sku_a_id}.certification_status == PROVISIONAL before the certify call"
            - "the first allocation creation returns HTTP 409 with ${create_blocked_error} == ERR_SKU_NOT_PRODUCIBLE (V-REF-6: PROVISIONAL is not CERTIFIED)"
            - "${cert_status} == CERTIFIED and ${cert_commercial} == DEVELOPMENT"
            - "ProductSku.${sku_a_id}.standard_cost_cents_per_sqm == 1157 and list_price_cents_per_sqm == 1562"
            - "the second allocation creation returns 201 with the identical payload"
            - "the first fill returns HTTP 409 with ${fill_blocked_error} == ERR_SKU_NOT_PRODUCIBLE (V-XSTATE-6: commercial_status is DEVELOPMENT)"
            - "Allocation.${al_g1_id}.version == ${al_g1_v} after the rejected fill, so the same expected_allocation_version is still valid"
            - "${released_commercial} == RELEASED"
            - "${fill_ok_status} == FILLED and ${fill_ok_alloc} == 300.00"
            - "Batch.${batch_a1_id}.available_quantity_sqm == 900.00 and GET /allocations/${al_g1_id}/lines returns total_count == 1 with substitution_kind == EXACT"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap (three resources, three geometries)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: press_line_half_open_window_admits_touching_endpoints
        grounds:
          - validations[V-TEMP-1]
          - errors.ERR_PRESS_LINE_WINDOW_CONFLICT
          - entities.ProductionRun.fields.planned_start_utc
          - entities.ProductionRun.fields.planned_end_utc
          - calculations.press_line_changeover_gap
        distinguishing_aspect: |
          PRESS LINE, HALF-OPEN geometry: a run starting exactly at another's
          planned_end_utc is admitted, while a one-hour straddle is refused. PL-2 is
          declared with changeover_minutes 0 and every run uses the same SKU, so the
          required changeover gap is CEIL(0 * 0.50) + 0 == 0 and V-TEMP-2 cannot
          confound the result; the second film carries master_roll_sets 2 so the CLOSED
          film geometry cannot fire either. The exclusion is therefore purely V-TEMP-1.
        test_recipe:
          setup:
            - "PL-2 CALENDER, 1.5-8.0 mm, changeover_minutes 0, curl_control_index 95"
            - "SKU-C (F-MIN, PF-OAK-1800 with master_roll_sets 2, 2.5 mm) in certification_status TESTING"
            - "RUN-W1 PLANNED across [02:00, 06:00) for 100.00 sqm"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *pf2
            - *skuC
            - *skuCBegin
            - &pl2
              call: "POST /press-lines"
              payload: { line_code: "PL-2", line_type: "CALENDER", min_thickness_mm: 1.5, max_thickness_mm: 8.0, changeover_minutes: 0, curl_control_index: 95 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl2_id: $.data.id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-W1", sku_id: "${sku_c_id}", press_line_id: "${pl2_id}", planned_start_utc: "2026-08-01T02:00:00Z", planned_end_utc: "2026-08-01T06:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_w1_id: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-W2", sku_id: "${sku_c_id}", press_line_id: "${pl2_id}", planned_start_utc: "2026-08-01T05:00:00Z", planned_end_utc: "2026-08-01T08:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { straddle_error: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-W3", sku_id: "${sku_c_id}", press_line_id: "${pl2_id}", planned_start_utc: "2026-08-01T06:00:00Z", planned_end_utc: "2026-08-01T08:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_w3_id: $.data.id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-W4", sku_id: "${sku_c_id}", press_line_id: "${pl2_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_w4_id: $.data.id }
          assert:
            - "the [05:00, 08:00) attempt returns HTTP 409 with ${straddle_error} == ERR_PRESS_LINE_WINDOW_CONFLICT"
            - "${straddle_error} != ERR_CHANGEOVER_GAP_INSUFFICIENT and != ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED"
            - "the [06:00, 08:00) attempt returns 201 — new.planned_start_utc == other.planned_end_utc is disjoint under the half-open rule"
            - "ProductionRun.${run_w3_id}.run_status == PLANNED"
            - "the [01:00, 02:00) attempt returns 201 — touching from below is equally disjoint"
            - "ProductionRun.${run_w4_id}.run_status == PLANNED"
            - "GET /production-runs with press_line_id == ${pl2_id} returns total_count == 3 (RUN-W1, RUN-W3, RUN-W4)"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 300.00 — only the three admitted runs reserved volume"

      - name: print_film_closed_interval_aggregate_roll_set_capacity
        grounds:
          - validations[V-TEMP-3]
          - errors.ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED
          - entities.PrintFilm.fields.master_roll_sets
          - state_machines.ProductionRun.PLANNED_to_ABORTED
        distinguishing_aspect: |
          A DIFFERENT resource with a DIFFERENT geometry and a DIFFERENT arity: the film
          roll-set rule uses CLOSED intervals, so a run starting exactly at another's
          planned_end_utc DOES collide (the opposite of the press-line rule proved in
          the sibling instance), and it is an aggregate count against master_roll_sets
          rather than a pairwise exclusion. Every run sits on a different press line so
          V-TEMP-1 can never fire, and aborting the incumbent frees the roll set.
        test_recipe:
          setup:
            - "PF-OAK-900 AVAILABLE under LIC-OAK with master_roll_sets 1"
            - "SKU-D (F-MIN, PF-OAK-900, GLUE_DOWN, 2.5 mm) in certification_status TESTING"
            - "three press lines PL-A, PL-B, PL-C, each 1.5-8.0 mm with changeover_minutes 0"
            - "RUN-F1 PLANNED on PL-A across [02:00, 06:00] for 100.00 sqm"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - call: "POST /print-films"
              payload: { design_code: "PF-OAK-900", license_id: "${lic_id}", pattern_repeat_mm_length: 900.0, pattern_repeat_mm_width: 200.0, registration_tolerance_mm: 0.20, emboss_plate_code: "EMB-OAK-C", emboss_alignment_offset_mm: 0.08, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf3_id: $.data.id }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-D", formulation_id: "${f_min_id}", print_film_id: "${pf3_id}", construction_type: "GLUE_DOWN", wear_layer_mil: 12, overall_thickness_mm: 2.5, waterproof_rated: false, attached_underlayment_type: "NONE", profile_family: "NONE", royalty_basis_price_cents_per_sqm: 2100, target_margin_bps: 3500 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_d_id: $.data.id }
            - call: "POST /product-skus/${sku_d_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /press-lines"
              payload: { line_code: "PL-A", line_type: "CALENDER", min_thickness_mm: 1.5, max_thickness_mm: 8.0, changeover_minutes: 0, curl_control_index: 90 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl_a_id: $.data.id }
            - call: "POST /press-lines"
              payload: { line_code: "PL-B", line_type: "CALENDER", min_thickness_mm: 1.5, max_thickness_mm: 8.0, changeover_minutes: 0, curl_control_index: 90 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl_b_id: $.data.id }
            - call: "POST /press-lines"
              payload: { line_code: "PL-C", line_type: "MULTI_DAY_PRESS", min_thickness_mm: 1.5, max_thickness_mm: 8.0, changeover_minutes: 0, curl_control_index: 90 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl_c_id: $.data.id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-F1", sku_id: "${sku_d_id}", press_line_id: "${pl_a_id}", planned_start_utc: "2026-08-01T02:00:00Z", planned_end_utc: "2026-08-01T06:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_f1_id: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-F2", sku_id: "${sku_d_id}", press_line_id: "${pl_b_id}", planned_start_utc: "2026-08-01T06:00:00Z", planned_end_utc: "2026-08-01T09:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { closed_touch_error: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-F3", sku_id: "${sku_d_id}", press_line_id: "${pl_b_id}", planned_start_utc: "2026-08-01T06:01:00Z", planned_end_utc: "2026-08-01T09:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_f3_id: $.data.id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-F4", sku_id: "${sku_d_id}", press_line_id: "${pl_c_id}", planned_start_utc: "2026-08-01T04:00:00Z", planned_end_utc: "2026-08-01T05:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { contained_error: $.data.error_id }
            - call: "POST /production-runs/${run_f1_id}/abort"
              payload: { abort_reason: "film master roll set reassigned to a trial" }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { f1_aborted: $.data.run_status }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-F5", sku_id: "${sku_d_id}", press_line_id: "${pl_c_id}", planned_start_utc: "2026-08-01T04:00:00Z", planned_end_utc: "2026-08-01T05:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_f5_id: $.data.id }
          assert:
            - "the [06:00, 09:00] attempt on a DIFFERENT press line returns HTTP 409 with ${closed_touch_error} == ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED — closed intervals collide at a shared endpoint"
            - "${closed_touch_error} != ERR_PRESS_LINE_WINDOW_CONFLICT — PL-B holds no other run"
            - "the [06:01, 09:00] attempt returns 201: one minute of separation clears the closed geometry"
            - "ProductionRun.${run_f3_id}.run_status == PLANNED"
            - "the strictly contained [04:00, 05:00] attempt returns HTTP 409 with ${contained_error} == ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED — containment counts as intersection"
            - "${f1_aborted} == ABORTED"
            - "the identical [04:00, 05:00] window is admitted after the abort, because ABORTED runs are excluded from the intersecting count"
            - "ProductionRun.${run_f5_id}.run_status == PLANNED"
            - "PrintFilm.${pf3_id}.master_roll_sets == 1 throughout — the rule reads the film, not the runs"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 200.00 (RUN-F3 and RUN-F5; RUN-F1's reservation was compensated by the abort)"

      - name: license_term_window_lazy_expiry_blocks_run_creation_before_status_flips
        grounds:
          - validations[V-TEMP-4]
          - errors.ERR_LICENSE_EXPIRED
          - state_machines.DesignLicense.ACTIVE_to_EXPIRED
          - entities.DesignLicense.fields.valid_until
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          A THIRD resource with a third geometry: the licence term is a half-open
          entitlement window read against TWO different instants. A run whose
          planned_start_utc is 2026-08-31T23:00Z is admitted while one at exactly
          2026-09-01T00:00Z is refused (valid_until is exclusive) — and crucially the
          licence is still ACTIVE after that refusal, because the lazy EXPIRED flip is
          driven by the CLOCK, not by the requested window. Advancing the clock to
          valid_until and retrying flips the status.
        test_recipe:
          setup:
            - "LIC-EXP ACTIVE, valid_from 2026-01-01T00:00:00Z, valid_until 2026-09-01T00:00:00Z, term_volume_cap_sqm 2000.00, royalty_rate_bps 500"
            - "PF-EXP AVAILABLE under LIC-EXP with master_roll_sets 2"
            - "SKU-E (F-MIN, PF-EXP, GLUE_DOWN, 2.5 mm) in certification_status TESTING"
            - "PL-1 AVAILABLE with changeover_minutes 60; the clock starts at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *pl1
            - call: "POST /design-licenses"
              payload: { license_code: "LIC-EXP", licensor_name: "Terrazzo Studios", license_type: "EXCLUSIVE", royalty_rate_bps: 500, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z", term_volume_cap_sqm: 2000.00, territory_codes: ["US"] }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { lic_exp_id: $.data.id }
            - call: "POST /print-films"
              payload: { design_code: "PF-EXP", license_id: "${lic_exp_id}", pattern_repeat_mm_length: 1200.0, pattern_repeat_mm_width: 180.0, registration_tolerance_mm: 0.25, emboss_plate_code: "EMB-EXP-A", emboss_alignment_offset_mm: 0.10, master_roll_sets: 2 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf_exp_id: $.data.id }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-E", formulation_id: "${f_min_id}", print_film_id: "${pf_exp_id}", construction_type: "GLUE_DOWN", wear_layer_mil: 12, overall_thickness_mm: 2.5, waterproof_rated: false, attached_underlayment_type: "NONE", profile_family: "NONE", royalty_basis_price_cents_per_sqm: 2100, target_margin_bps: 3500 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_e_id: $.data.id }
            - call: "POST /product-skus/${sku_e_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-E-IN", sku_id: "${sku_e_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-31T23:00:00Z", planned_end_utc: "2026-08-31T23:30:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_e_in_id: $.data.id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-E-EDGE", sku_id: "${sku_e_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-09-01T00:00:00Z", planned_end_utc: "2026-09-01T02:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { edge_error: $.data.error_id }
            - call: "GET /design-licenses/${lic_exp_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { lic_status_after_edge: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "POST /production-runs"
              payload: { run_code: "RUN-E-LATE", sku_id: "${sku_e_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-09-01T03:00:00Z", planned_end_utc: "2026-09-01T05:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { late_error: $.data.error_id }
            - call: "GET /design-licenses/${lic_exp_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { lic_status_after_late: $.data.status }
          assert:
            - "the 2026-08-31T23:00Z run returns 201 — one hour inside the term"
            - "ProductionRun.${run_e_in_id}.run_status == PLANNED and DesignLicense.${lic_exp_id}.reserved_volume_sqm == 100.00"
            - "the 2026-09-01T00:00:00Z run returns HTTP 409 with ${edge_error} == ERR_LICENSE_EXPIRED — valid_until is exclusive"
            - "${lic_status_after_edge} == ACTIVE — the requested window is outside the term but the CLOCK is not, so no lazy expiry occurs"
            - "the 2026-09-01T03:00Z run after the clock advance returns HTTP 409 with ${late_error} == ERR_LICENSE_EXPIRED"
            - "${lic_status_after_late} == EXPIRED — the lazy flip fires only once clock >= valid_until"
            - "${late_error} != ERR_CHANGEOVER_GAP_INSUFFICIENT — the gap from RUN-E-IN (ends 2026-08-31T23:30Z) is far beyond the 30-minute same-formulation requirement"
            - "DesignLicense.${lic_exp_id}.reserved_volume_sqm == 100.00 after both rejections"
            - "ProductionRun rows for RUN-E-EDGE and RUN-E-LATE do not exist: GET /production-runs with sku_id == ${sku_e_id} returns total_count == 1"

  # ===========================================================================
  # RULE 9 — compensating_invariant (three conserved quantity types)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: license_reserved_entitlement_conserved_across_create_and_abort
        grounds:
          - calculations.license_volume_ledger
          - state_machines.ProductionRun.PLANNED_to_ABORTED
          - entities.DesignLicense.fields.reserved_volume_sqm
          - endpoints["POST /production-runs/{id}/abort"]
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 — reserved entitlement AREA. Creating two runs raises
          reserved_volume_sqm from 0.00 to 1500.00; aborting the 300.00 run returns it
          to exactly 1200.00 and aborting the other returns it to exactly 0.00, with
          consumed_volume_sqm never moving off 0.00. The abort compensation is exact and
          order-independent, and the ABORTED rows keep their planned_quantity_sqm so the
          reversal cannot be inferred from the run rows alone.
        test_recipe:
          setup:
            - "LIC-OAK cap 2000.00 with reserved_volume_sqm 0.00 and consumed_volume_sqm 0.00"
            - "SKU-A CERTIFIED, PL-1 AVAILABLE, PL-2 AVAILABLE"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *pl1
            - *pl2
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inv1_reserved_zero: $.data.reserved_volume_sqm }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-I1", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T09:00:00Z", planned_quantity_sqm: 1200.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_i1_id: $.data.id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-I2", sku_id: "${sku_a_id}", press_line_id: "${pl2_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T05:00:00Z", planned_quantity_sqm: 300.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_i2_id: $.data.id }
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inv1_reserved_peak: $.data.reserved_volume_sqm }
            - call: "POST /production-runs/${run_i2_id}/abort"
              payload: { abort_reason: "calender roll change brought forward" }
              as: ProductionPlanner
              as_user_id: "pp-001"
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inv1_reserved_mid: $.data.reserved_volume_sqm }
            - call: "POST /production-runs/${run_i1_id}/abort"
              payload: { abort_reason: "order cancelled by the distributor" }
              as: ProductionPlanner
              as_user_id: "pp-001"
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inv1_reserved_end: $.data.reserved_volume_sqm, inv1_consumed_end: $.data.consumed_volume_sqm }
          assert:
            - "${inv1_reserved_zero} == 0.00"
            - "${inv1_reserved_peak} == 1500.00 == 1200.00 + 300.00"
            - "${inv1_reserved_mid} == 1200.00 — the 300.00 abort reverses exactly its own reservation"
            - "${inv1_reserved_end} == 0.00 and ${inv1_consumed_end} == 0.00"
            - "DesignLicense.${lic_id}.accrued_royalty_cents == 0 — no royalty is ever accrued for aborted runs"
            - "ProductionRun.${run_i1_id}.run_status == ABORTED and planned_quantity_sqm == 1200.00 (the row keeps its quantity)"
            - "ProductionRun.${run_i2_id}.run_status == ABORTED and planned_quantity_sqm == 300.00"
            - "ProductionRun.${run_i1_id}.actual_quantity_sqm == 0.00 and royalty_accrued_cents == 0"
            - "GET /design-licenses/${lic_id}/utilization returns data.remaining_volume_sqm == 2000.00 and data.projected_volume_sqm == 0.00"
            - "GET /batches returns total_count == 0"

      - name: royalty_money_and_consumed_area_reversed_exactly_on_qc_scrap
        grounds:
          - state_machines.ProductionRun.RELEASED_to_SCRAPPED
          - calculations.license_royalty_accrual
          - calculations.license_volume_ledger
          - entities.ProductionRun.fields.royalty_accrued_cents
          - entities.Batch.fields.available_quantity_sqm
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 — accrued royalty MONEY together with consumed AREA, a
          different pair from the reserved-area invariant. A QC scrap must reverse
          126000 cents and 1200.00 sqm in the same transaction and zero the run's own
          royalty_accrued_cents, while the ABORT path of the sibling instance touches
          neither. The Batch is scrapped rather than deleted, so the reversal is only
          visible in the licence ledger.
        test_recipe:
          setup:
            - "RUN-A1 COMPLETED at actual 1200.00 sqm with qc_disposition RELEASED, so LIC-OAK shows consumed 1200.00 and accrued_royalty_cents 126000"
            - "the Batch is IN_STOCK with available_quantity_sqm 1200.00"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *runA1Qc
            - *getBatchA1
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inv2_consumed_before: $.data.consumed_volume_sqm, inv2_royalty_before: $.data.accrued_royalty_cents }
          trigger:
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: "SCRAPPED", hold_reason: "gel specks across the whole lot" }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { scrap_disposition: $.data.qc_disposition, scrap_royalty: $.data.royalty_accrued_cents }
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inv2_consumed_after: $.data.consumed_volume_sqm, inv2_royalty_after: $.data.accrued_royalty_cents }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { inv2_batch_status: $.data.status, inv2_batch_available: $.data.available_quantity_sqm }
          assert:
            - "${inv2_consumed_before} == 1200.00 and ${inv2_royalty_before} == 126000"
            - "${scrap_disposition} == SCRAPPED and ${scrap_royalty} == 0 — the run's own accrual is zeroed, not left dangling"
            - "${inv2_consumed_after} == 0.00 — exactly the run's actual_quantity_sqm was removed"
            - "${inv2_royalty_after} == 0 — exactly the run's royalty_accrued_cents was removed"
            - "${inv2_batch_status} == SCRAPPED and ${inv2_batch_available} == 0.00"
            - "Batch.${batch_a1_id}.quantity_sqm == 1200.00 — the produced quantity is preserved for traceability even though the ledger is reversed"
            - "ProductionRun.${run_a1_id}.run_status == COMPLETED and actual_quantity_sqm == 1200.00 — the run_status dimension is untouched by a qc scrap"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 0.00 (released at completion and not restored by the scrap)"
            - "GET /design-licenses/${lic_id}/utilization returns data.remaining_volume_sqm == 2000.00"

      - name: physical_stock_area_conserved_across_fill_and_release
        grounds:
          - state_machines.Allocation.FILLED_to_RELEASED
          - calculations.allocation_fill_plan
          - entities.Batch.fields.available_quantity_sqm
          - entities.AllocationLine.fields.void_reason
          - entities.Allocation.fields.allocated_quantity_sqm
        distinguishing_aspect: |
          CONSERVED QUANTITY 3 — physical STOCK area, with the invariant
          available_quantity_sqm + SUM(ACTIVE line.quantity_sqm) == quantity_sqm holding
          before, between and after. Two successive fills and one release move the split
          1200/0 -> 900/300 -> 700/500 -> 1200/0, and the release voids the lines with
          ALLOCATION_RELEASED rather than a batch-driven reason, distinguishing this
          compensation from the BATCH_HELD and BATCH_SCRAPPED paths.
        test_recipe:
          setup:
            - "SKU-A CERTIFIED and RELEASED with a single Batch IN_STOCK at 1200.00 sqm"
            - "Allocation AL-V1 for 300.00 sqm and AL-V2 for 200.00 sqm, both STRICT_SKU for Distributor D-100"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *runA1Qc
            - *getBatchA1
            - *dist
            - call: "POST /allocations"
              payload: { allocation_code: "AL-V1", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 300.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_v1_id: $.data.id, al_v1_v: $.data.version }
            - call: "POST /allocations"
              payload: { allocation_code: "AL-V2", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 200.00, substitution_policy: "STRICT_SKU" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { al_v2_id: $.data.id, al_v2_v: $.data.version }
          trigger:
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { inv3_avail_start: $.data.available_quantity_sqm, inv3_qty: $.data.quantity_sqm }
            - call: "POST /allocations/${al_v1_id}/fill"
              payload: { expected_allocation_version: "${al_v1_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { inv3_v1_status: $.data.status }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { inv3_avail_after_v1: $.data.available_quantity_sqm }
            - call: "POST /allocations/${al_v2_id}/fill"
              payload: { expected_allocation_version: "${al_v2_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { inv3_v2_status: $.data.status }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { inv3_avail_after_v2: $.data.available_quantity_sqm }
            - call: "POST /allocations/${al_v1_id}/release"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { inv3_v1_released: $.data.status, inv3_v1_alloc: $.data.allocated_quantity_sqm }
            - call: "POST /allocations/${al_v2_id}/release"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { inv3_v2_released: $.data.status }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { inv3_avail_end: $.data.available_quantity_sqm }
          assert:
            - "${inv3_qty} == 1200.00 and ${inv3_avail_start} == 1200.00 with no ACTIVE line"
            - "${inv3_v1_status} == FILLED and ${inv3_avail_after_v1} == 900.00 (900.00 + 300.00 == 1200.00)"
            - "${inv3_v2_status} == FILLED and ${inv3_avail_after_v2} == 700.00 (700.00 + 300.00 + 200.00 == 1200.00)"
            - "${inv3_v1_released} == RELEASED and ${inv3_v1_alloc} == 0.00"
            - "GET /allocations/${al_v1_id}/lines returns total_count == 1 with status == VOIDED and void_reason == ALLOCATION_RELEASED (not BATCH_HELD, not ALLOCATION_CANCELLED)"
            - "${inv3_v2_released} == RELEASED and Allocation.${al_v2_id}.allocated_quantity_sqm == 0.00"
            - "${inv3_avail_end} == 1200.00 — the stock ledger is restored exactly, with no drift from the two fills"
            - "Batch.${batch_a1_id}.quantity_sqm == 1200.00 and status == IN_STOCK throughout"
            - "GET /batches/${batch_a1_id}/allocation-lines with status == ACTIVE returns total_count == 0"
            - "Allocation.${al_v1_id}.upgrade_cost_total_cents == 0 and Allocation.${al_v2_id}.upgrade_cost_total_cents == 0"
