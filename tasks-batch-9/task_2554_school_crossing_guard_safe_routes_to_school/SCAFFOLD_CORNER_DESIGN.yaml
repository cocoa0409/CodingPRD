      - name: corner_speed_multiplier_tier_excludes_twenty_nine_mph
        claim_type: constants_applied
        grounds:
          - calculations.warrant_score.constants.SPEED_MULT_MID
          - calculations.warrant_score.constants.SPEED_THRESHOLD_MID_MPH
          - calculations.warrant_determination
        distinguishing_aspect: |
          SPEED_THRESHOLD_MID_MPH is 30 and the comparison is >=, so 29 mph takes
          SPEED_MULT_BASE 1.00, not 1.15. The identical count and crash fixture that
          scores 66.19 / WARRANTED at 30 mph must score exactly 57.56 at 29 mph, and the
          determination must flip to CONDITIONAL (57.56 is below 60.00 but at or above
          40.00 with CP 2 >= 1) rather than NOT_WARRANTED. A one-mph change therefore
          moves the intersection across two decision boundaries at once.
        test_recipe:
          setup:
            - "Same fixture as the MIDDAY case but with speed_limit_mph 29 and no MIDDAY session: AM 70/28/500 and PM 50/20/380 give PC 120, AG 48, V 880; gap_deficit_ratio 0.6000; exposure 10.56; crash_term 20.0."
