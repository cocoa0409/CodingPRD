scenario: |
  Pasture-Raised Family Farm Network Audits & Traceability (Vital Farms): farm network recruitment with acreage per bird requirements, pasture standards and housing specifications, third-party audit scheduling and certification maintenance with corrective action for non-conforming farms, egg collection routing from many small farms to a central washing and grading facility with lot identification, carton-level traceability allowing a consumer to identify the originating farm, seasonal and weather-driven production variability with supply commitments to retailers, pricing programs paying farmers a premium above commodity with contract terms, animal welfare incident response and farm removal, grading, sizing and packing operations with quality holds

domain_name: pasture-raised-farm-network
api_prefix: /farm-network

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Farm
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Farm display name"
        constraints: "required, non-empty"
      - name: region
        type: string
        source: input
        description: "State/region code of the farm"
        constraints: "required, non-empty"
      - name: pasture_sqft
        type: number
        source: input
        description: "Total pasture square footage available to the flock"
        constraints: "required, > 0"
      - name: barn_sqft
        type: number
        source: input
        description: "Indoor housing (barn) square footage"
        constraints: "required, > 0"
      - name: nest_box_count
        type: integer
        source: input
        description: "Number of nest boxes installed"
        constraints: "required, >= 0"
      - name: declared_bird_count
        type: integer
        source: input
        description: "Number of laying hens the farm declares it will keep"
        constraints: "required, > 0"
      - name: status
        type: enum
        source: system
        description: "Operational lifecycle state"
        default: ONBOARDING
        constraints: "one of ONBOARDING, ACTIVE, PROBATION, SUSPENDED, REMOVED"
      - name: certification_status
        type: enum
        source: computed
        description: "Certification posture derived from audit history, corrective actions and removal (see calculations.certification_status_derivation)"
        default: CERTIFICATION_PENDING
        constraints: "one of CERTIFICATION_PENDING, CERTIFIED, CERT_LAPSED, DECERTIFIED"
      - name: effective_bird_capacity
        type: integer
        source: computed
        description: "min of the three housing/pasture constraints (see calculations.effective_bird_capacity); recomputed on create and PATCH"
      - name: last_passed_audit_at
        type: datetime
        source: system
        description: "Completion timestamp of the most recent PASSED audit; null until first pass"
        constraints: "nullable"
      - name: removal_reason
        type: string
        source: system
        description: "Reason recorded when the farm was removed; null otherwise"
        constraints: "nullable"

  - name: FarmContract
    parent: null
    common_fields: true
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; the farm this pricing contract belongs to"
        constraints: "required"
      - name: commodity_base_cents_per_dozen
        type: integer
        source: input
        description: "Commodity egg base price component in cents per dozen (provisional basis)"
        constraints: "required, >= 0"
      - name: premium_cents_per_dozen
        type: integer
        source: input
        description: "Pasture-raised premium paid above commodity, cents per dozen"
        constraints: "required, >= 0"
      - name: start_date
        type: string
        source: input
        description: "First covered date, YYYY-MM-DD (inclusive)"
        constraints: "required, ISO date, <= end_date"
      - name: end_date
        type: string
        source: input
        description: "Last covered date, YYYY-MM-DD (inclusive)"
        constraints: "required, ISO date"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; superseded by a newer contract or terminated on farm removal"
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED, TERMINATED"

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; the farm under audit"
        constraints: "required"
      - name: audit_type
        type: enum
        source: input
        description: "Audit kind"
        constraints: "one of INITIAL, ANNUAL, FOR_CAUSE, RE_AUDIT"
      - name: scheduled_for
        type: datetime
        source: input
        description: "Planned audit instant; completion window is [scheduled_for - 3 days, scheduled_for + 7 days]"
        constraints: "required, ISO8601"
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle state"
        default: SCHEDULED
        constraints: "one of SCHEDULED, PASSED, FAILED, CORRECTIVE_ACTION_REQUIRED, EXPIRED, CANCELLED"
      - name: auditor_user_id
        type: string
        source: system
        description: "X-User-ID of the Auditor who completed the audit; null until completed. Used for segregation-of-duties on corrective-action verification."
        constraints: "nullable"
      - name: non_conformities_count
        type: integer
        source: system
        description: "Number of findings recorded at completion"
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Completion timestamp; null until completed"
        constraints: "nullable"

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: system
        description: "FK -> Audit.id; the audit whose findings opened this corrective action"
        constraints: "set at creation from the parent audit"
      - name: severity
        type: enum
        source: input
        description: "Finding severity carried from the audit completion payload"
        constraints: "one of MINOR, MAJOR, CRITICAL"
      - name: description
        type: string
        source: input
        description: "Finding description carried from the audit completion payload"
        constraints: "required, non-empty"
      - name: status
        type: enum
        source: system
        description: "Corrective action lifecycle"
        default: OPEN
        constraints: "one of OPEN, SUBMITTED, VERIFIED_CLOSED, OVERDUE, CANCELLED"
      - name: due_at
        type: datetime
        source: system
        description: "completed_at of parent audit + CA_DUE_DAYS[severity] (MINOR 90d, MAJOR 30d, CRITICAL 7d)"
      - name: evidence_notes
        type: string
        source: input
        description: "Remediation evidence submitted by the network on the farm's behalf"
        constraints: "nullable until submitted"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the verifying auditor; MUST differ from the completing audit's auditor_user_id (segregation of duties)"
        constraints: "nullable until verified"
      - name: closed_at
        type: datetime
        source: system
        description: "Verification timestamp; null until VERIFIED_CLOSED"
        constraints: "nullable"

  - name: WelfareIncident
    parent: null
    common_fields: true
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; the farm where the animal-welfare incident occurred"
        constraints: "required"
      - name: severity
        type: enum
        source: input
        description: "Incident severity; CRITICAL auto-suspends the farm at report time"
        constraints: "one of LOW, MODERATE, HIGH, CRITICAL"
      - name: incident_type
        type: string
        source: input
        description: "Category of welfare incident (free-form label, e.g. PREDATOR_BREACH, LITTER_QUALITY)"
        constraints: "required, non-empty"
      - name: description
        type: string
        source: input
        description: "Incident narrative"
        constraints: "required, non-empty"
      - name: status
        type: enum
        source: system
        description: "Incident lifecycle"
        default: REPORTED
        constraints: "one of REPORTED, RESOLVED"
      - name: disposition
        type: enum
        source: system
        description: "Resolution outcome chosen at resolve time; null until resolved"
        default: null
        constraints: "nullable; one of NONE, PROBATION, SUSPENSION, REMOVAL when set"
      - name: resolved_at
        type: datetime
        source: system
        description: "Resolution timestamp; null until resolved"
        constraints: "nullable"

  - name: CollectionRoute
    parent: null
    common_fields: true
    fields:
      - name: route_date
        type: string
        source: input
        description: "Collection date, YYYY-MM-DD; a farm may occupy at most one non-skipped stop across all routes sharing a route_date"
        constraints: "required, ISO date"
      - name: driver_name
        type: string
        source: input
        description: "Driver assigned to the route"
        constraints: "required, non-empty"
      - name: capacity_cases
        type: integer
        source: input
        description: "Maximum egg cases the truck can carry on this route"
        constraints: "required, > 0"
      - name: status
        type: enum
        source: system
        description: "Route lifecycle"
        default: PLANNED
        constraints: "one of PLANNED, COMPLETED"
      - name: stops
        type: array
        source: input
        description: "Ordered stops. Each item: { stop_sequence: integer (unique per route), farm_id: string (FK -> Farm.id), planned_cases: integer > 0, collected_cases: integer (null until collected), status: one of SCHEDULED, COLLECTED, SKIPPED }. Items are addressed in endpoints by stop_sequence."
        default: []
      - name: committed_cases
        type: integer
        source: computed
        description: "sum of planned_cases over SCHEDULED stops + sum of collected_cases over COLLECTED stops (see calculations.route_load_reconciliation)"
        default: 0
      - name: available_cases
        type: integer
        source: computed
        description: "capacity_cases - committed_cases; invariant: capacity_cases == committed_cases + available_cases at all times"
        default: 0

  - name: EggLot
    parent: null
    common_fields: true
    fields:
      - name: farm_id
        type: string
        source: system
        description: "FK -> Farm.id; originating farm, copied from the collected stop"
      - name: route_id
        type: string
        source: system
        description: "FK -> CollectionRoute.id; the route that delivered this lot"
      - name: stop_sequence
        type: integer
        source: system
        description: "Sequence number of the originating stop within the route's stops array (embedded reference, not a standalone entity)"
      - name: lot_code
        type: string
        source: system
        description: "Human-facing lot identifier, minted sequentially as LOT-000001, LOT-000002, ... at collection"
      - name: laid_start_date
        type: string
        source: input
        description: "Earliest lay date covered by this lot, YYYY-MM-DD (supplied at collection)"
        constraints: "required, ISO date, <= laid_end_date"
      - name: laid_end_date
        type: string
        source: input
        description: "Latest lay date covered by this lot, YYYY-MM-DD (supplied at collection)"
        constraints: "required, ISO date"
      - name: received_cases
        type: integer
        source: system
        description: "Cases received at the washing/grading facility; equals collected_cases of the stop"
      - name: received_dozens
        type: integer
        source: computed
        description: "received_cases * DOZENS_PER_CASE (30)"
      - name: quality_score
        type: number
        source: input
        description: "Grading score 0-100 supplied at grade time; null until graded"
        constraints: "nullable; when set, 0 <= quality_score <= 100"
      - name: grade
        type: enum
        source: computed
        description: "Grade letter from quality_score thresholds; NONE before grading or while ON_HOLD; set to B when a hold is released"
        default: NONE
        constraints: "one of AA, A, B, NONE"
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle"
        default: RECEIVED
        constraints: "one of RECEIVED, GRADED, ON_HOLD, RELEASED, REJECTED, PACKED"
      - name: remaining_dozens
        type: integer
        source: computed
        description: "Dozens not yet packed or destroyed. Invariant: received_dozens == remaining_dozens + packed_dozens + destroyed_dozens at all times"
      - name: packed_dozens
        type: integer
        source: computed
        description: "Dozens packed into cartons so far"
        default: 0
      - name: destroyed_dozens
        type: integer
        source: system
        description: "Dozens destroyed when the lot is rejected from hold"
        default: 0
      - name: graded_at
        type: datetime
        source: system
        description: "Timestamp of grading; null until graded"
        constraints: "nullable"

  - name: Carton
    parent: null
    common_fields: false
    fields:
      - name: carton_code
        type: string
        source: system
        description: "Consumer-facing traceability code: <lot_code>-C<NNN> with per-lot 3-digit sequence (e.g. LOT-000001-C001)"
      - name: lot_id
        type: string
        source: system
        description: "FK -> EggLot.id; the lot this carton was packed from"
      - name: pack_size
        type: enum
        source: input
        description: "Carton size class chosen at pack time"
        constraints: "one of MEDIUM, LARGE, EXTRA_LARGE"
      - name: dozens
        type: integer
        source: system
        description: "Dozens contained; fixed at DOZENS_PER_CARTON (1)"
        default: 1
      - name: source_farm_id
        type: string
        source: system
        description: "Denormalized copy of the originating farm's id from the parent lot at pack time (informational; the authoritative lineage link is lot_id)"
      - name: source_farm_name
        type: string
        source: system
        description: "Denormalized copy of the originating farm's name at pack time; enables carton-level consumer traceability without a join"
      - name: packed_at
        type: datetime
        source: system
        description: "Pack timestamp (logical clock); drives settlement-week and commitment-fill attribution"

  - name: RetailerAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Retailer legal name"
        constraints: "required, non-empty"
      - name: banner
        type: string
        source: input
        description: "Store banner / chain label"
        constraints: "required, non-empty"
      - name: terms_net_days
        type: integer
        source: input
        description: "Payment terms in days (e.g. 60 for net-60)"
        constraints: "required, > 0"

  - name: SupplyCommitment
    parent: null
    common_fields: true
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; farm supplying the commitment"
        constraints: "required"
      - name: retailer_id
        type: string
        source: input
        description: "FK -> RetailerAccount.id; retailer receiving the supply commitment"
        constraints: "required"
      - name: week_start
        type: string
        source: input
        description: "First day (YYYY-MM-DD) of the committed week; the week is the half-open interval [week_start, week_start + 7 days)"
        constraints: "required, ISO date"
      - name: committed_dozens
        type: integer
        source: input
        description: "Dozens committed to the retailer for that week"
        constraints: "required, > 0"
      - name: status
        type: enum
        source: system
        description: "Commitment lifecycle; FILLED/SHORTFALL are assigned at settlement finalization"
        default: ACTIVE
        constraints: "one of ACTIVE, FILLED, SHORTFALL, CANCELLED"
      - name: delivered_dozens
        type: integer
        source: computed
        description: "Dozens packed from this farm with packed_at inside the commitment week; populated at settlement finalization, null before"
        constraints: "nullable"
      - name: fill_rate
        type: number
        source: computed
        description: "delivered_dozens / committed_dozens rounded to 4 decimal places, round_half_up; populated at settlement finalization, null before"
        constraints: "nullable"

  - name: ProductionForecast
    parent: null
    common_fields: false
    fields:
      - name: farm_id
        type: string
        source: input
        description: "FK -> Farm.id; farm this forecast belongs to"
        constraints: "required"
      - name: week_start
        type: string
        source: input
        description: "First day (YYYY-MM-DD) of the forecast week; unique per farm"
        constraints: "required, ISO date"
      - name: season
        type: enum
        source: input
        description: "Declared seasonal production profile"
        constraints: "one of SPRING, SUMMER, AUTUMN, WINTER"
      - name: weather_severity
        type: enum
        source: input
        description: "Declared weather stress for the week"
        constraints: "one of NONE, MODERATE, SEVERE"
      - name: optimistic_dozens
        type: integer
        source: computed
        description: "P50 forecast variant (see calculations.production_forecast)"
      - name: conservative_dozens
        type: integer
        source: computed
        description: "P90 weather-hedged forecast variant; basis for commitment caps"

  - name: SettlementRun
    parent: null
    common_fields: true
    fields:
      - name: week_start
        type: string
        source: input
        description: "First day (YYYY-MM-DD) of the settlement week [week_start, week_start + 7 days); unique across runs"
        constraints: "required, ISO date"
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle; created directly in CALCULATED with provisional lines"
        default: CALCULATED
        constraints: "one of CALCULATED, FINALIZED"
      - name: lines
        type: array
        source: computed
        description: "One line per farm with cartons packed in the week. Each item: { farm_id, contract_id, dozens_aa, dozens_a, dozens_b, total_dozens, provisional_cents, final_cents (null until FINALIZED) }"
        default: []
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Sum of line provisional_cents (provisional variant of calculations.farmer_payment)"
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Sum of line final_cents after finalize; null until FINALIZED"
        constraints: "nullable"
      - name: actual_commodity_base_cents_per_dozen
        type: integer
        source: input
        description: "Published actual commodity base used by the final variant; captured at finalize"
        constraints: "nullable until finalized; >= 0 when set"
      - name: finalized_at
        type: datetime
        source: system
        description: "Finalization timestamp; null until FINALIZED"
        constraints: "nullable"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Farm
    initial_state: ONBOARDING
    terminal_states: [REMOVED]
    note: "Farm carries two parallel state dimensions: operational status (this machine) and certification_status (derived; see calculations.certification_status_derivation). The pair evolves independently: a FAILED audit moves status ACTIVE->PROBATION while certification_status stays CERTIFIED."
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /farm-network/farms/{id}/activate"
        actor: NetworkManager
        preconditions:
          - "farm.status == ONBOARDING"
          - "farm.certification_status == CERTIFIED (at least one PASSED audit exists; else ERR_CERTIFICATION_REQUIRED)"
          - "farm.declared_bird_count <= farm.effective_bird_capacity (else ERR_BIRD_CAPACITY_INSUFFICIENT)"
          - "an ACTIVE FarmContract exists with start_date <= current date <= end_date (else ERR_CONTRACT_REQUIRED)"
        side_effects:
          - "farm.status := ACTIVE; farm.version += 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "system: audit completed with outcome FAILED, or clock advance flips a MAJOR corrective action to OVERDUE, or incident resolved with disposition PROBATION"
        actor: system
        preconditions:
          - "farm.status == ACTIVE"
        side_effects:
          - "farm.status := PROBATION; farm.version += 1"
          - "route stops are NOT skipped on probation (only suspension skips stops)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: CRITICAL WelfareIncident reported, or clock advance flips a CRITICAL corrective action to OVERDUE"
        actor: system
        preconditions:
          - "farm.status == ACTIVE"
        side_effects:
          - "farm.status := SUSPENDED; farm.version += 1"
          - "every stop with this farm_id in status SCHEDULED on any PLANNED route becomes SKIPPED; each affected route recomputes committed_cases/available_cases (calculations.route_load_reconciliation)"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: CRITICAL WelfareIncident reported, or clock advance flips a CRITICAL corrective action to OVERDUE"
        actor: system
        preconditions:
          - "farm.status == PROBATION"
        side_effects:
          - "farm.status := SUSPENDED; farm.version += 1"
          - "every stop with this farm_id in status SCHEDULED on any PLANNED route becomes SKIPPED; each affected route recomputes committed_cases/available_cases"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /farm-network/farms/{id}/reinstate"
        actor: NetworkManager
        preconditions:
          - "farm.status == PROBATION"
          - "no CorrectiveAction on any audit of this farm is in status OPEN, OVERDUE or SUBMITTED (else ERR_INVALID_STATE)"
          - "no WelfareIncident of this farm is in status REPORTED (else ERR_INVALID_STATE)"
        side_effects:
          - "farm.status := ACTIVE; farm.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /farm-network/farms/{id}/reinstate"
        actor: NetworkManager
        preconditions:
          - "farm.status == SUSPENDED"
          - "no CorrectiveAction on any audit of this farm is in status OPEN, OVERDUE or SUBMITTED (else ERR_INVALID_STATE)"
          - "no WelfareIncident of this farm is in status REPORTED (else ERR_INVALID_STATE)"
        side_effects:
          - "farm.status := ACTIVE; farm.version += 1"
      - from: ONBOARDING
        to: REMOVED
        trigger: "POST /farm-network/farms/{id}/remove, or incident resolved with disposition REMOVAL"
        actor: NetworkManager
        preconditions: ["farm.status != REMOVED"]
        side_effects: ["see shared REMOVAL cascade on the any-state->REMOVED transition"]
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /farm-network/farms/{id}/remove, or incident resolved with disposition REMOVAL"
        actor: NetworkManager
        preconditions: ["farm.status != REMOVED"]
        side_effects: ["see shared REMOVAL cascade on the note below"]
      - from: PROBATION
        to: REMOVED
        trigger: "POST /farm-network/farms/{id}/remove, or incident resolved with disposition REMOVAL"
        actor: NetworkManager
        preconditions: ["farm.status != REMOVED"]
        side_effects: ["see shared REMOVAL cascade on the note below"]
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /farm-network/farms/{id}/remove, or incident resolved with disposition REMOVAL"
        actor: NetworkManager
        preconditions: ["farm.status != REMOVED"]
        side_effects: ["see shared REMOVAL cascade on the note below"]
    removal_cascade_note: |
      REMOVAL cascade (applies to every ->REMOVED transition, in this order):
      (1) farm.status := REMOVED, farm.certification_status := DECERTIFIED, farm.removal_reason set, farm.version += 1;
      (2) the farm's FarmContract in status ACTIVE (if any) -> TERMINATED;
      (3) every SupplyCommitment of this farm in status ACTIVE with week_start strictly after the current date -> CANCELLED;
      (4) every stop with this farm_id in status SCHEDULED on any PLANNED route -> SKIPPED (route loads recomputed);
      (5) every Audit of this farm in status SCHEDULED -> CANCELLED;
      (6) every CorrectiveAction of this farm's audits in status OPEN, OVERDUE or SUBMITTED -> CANCELLED.
      EggLots and Cartons of the farm are NOT touched (traceability is preserved after removal).

  - entity: FarmContract
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a new FarmContract is created for the same farm via POST /farm-network/farms/{id}/contracts"
        actor: system
        preconditions: ["the new contract creation succeeds (OCC check on farm.version passes)"]
        side_effects:
          - "previous ACTIVE contract.status := SUPERSEDED; farm.version += 1 (single increment covering contract creation + supersede)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: farm removal cascade"
        actor: system
        preconditions: ["farm transitions to REMOVED"]
        side_effects:
          - "contract.status := TERMINATED"

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CORRECTIVE_ACTION_REQUIRED, EXPIRED, CANCELLED]
    note: "Re-audit after FAILED/CORRECTIVE_ACTION_REQUIRED is expressed as scheduling a NEW Audit with audit_type RE_AUDIT (entity-level recurrence loop)."
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /farm-network/audits/{id}/complete with outcome=PASSED"
        actor: Auditor
        preconditions:
          - "audit.status == SCHEDULED (else ERR_AUDIT_NOT_SCHEDULED)"
          - "completion time within [scheduled_for - AUDIT_WINDOW_EARLY_DAYS, scheduled_for + AUDIT_WINDOW_LATE_DAYS] (else ERR_AUDIT_WINDOW_MISSED)"
          - "findings must be empty or omitted when outcome=PASSED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "audit.status := PASSED; audit.auditor_user_id := X-User-ID of caller; audit.completed_at := now"
          - "farm.last_passed_audit_at := now; farm.certification_status := CERTIFIED; farm.version += 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /farm-network/audits/{id}/complete with outcome=FAILED"
        actor: Auditor
        preconditions:
          - "audit.status == SCHEDULED (else ERR_AUDIT_NOT_SCHEDULED)"
          - "completion time within the window (else ERR_AUDIT_WINDOW_MISSED)"
        side_effects:
          - "audit.status := FAILED; audit.auditor_user_id := X-User-ID; audit.completed_at := now"
          - "if farm.status == ACTIVE: farm.status := PROBATION; farm.version += 1"
          - "one CorrectiveAction is created per findings[] entry (status OPEN, due_at := now + CA_DUE_DAYS[severity])"
      - from: SCHEDULED
        to: CORRECTIVE_ACTION_REQUIRED
        trigger: "POST /farm-network/audits/{id}/complete with outcome=CORRECTIVE_ACTION_REQUIRED"
        actor: Auditor
        preconditions:
          - "audit.status == SCHEDULED (else ERR_AUDIT_NOT_SCHEDULED)"
          - "completion time within the window (else ERR_AUDIT_WINDOW_MISSED)"
          - "findings must contain at least 1 entry (else ERR_INVALID_REQUEST)"
        side_effects:
          - "audit.status := CORRECTIVE_ACTION_REQUIRED; audit.auditor_user_id := X-User-ID; audit.completed_at := now; audit.non_conformities_count := len(findings)"
          - "one CorrectiveAction is created per findings[] entry (status OPEN, due_at := now + CA_DUE_DAYS[severity])"
          - "farm status is NOT changed by this outcome"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system: POST /farm-network/_clock/set_current_utc advances the clock strictly past scheduled_for + AUDIT_WINDOW_LATE_DAYS"
        actor: system
        preconditions: ["audit.status == SCHEDULED", "now > scheduled_for + 7 days"]
        side_effects:
          - "audit.status := EXPIRED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: farm removal cascade"
        actor: system
        preconditions: ["farm transitions to REMOVED"]
        side_effects:
          - "audit.status := CANCELLED"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, CANCELLED]
    note: "OPEN -> SUBMITTED -> OPEN is a deliberate rework cycle (rejection loop); the same CA can cycle multiple times until verified or the farm is removed."
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /farm-network/corrective-actions/{id}/submit"
        actor: NetworkManager
        preconditions: ["ca.status in {OPEN, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "ca.status := SUBMITTED; ca.evidence_notes := payload evidence_notes"
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /farm-network/corrective-actions/{id}/submit"
        actor: NetworkManager
        preconditions: ["ca.status in {OPEN, OVERDUE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "ca.status := SUBMITTED; ca.evidence_notes := payload evidence_notes"
      - from: SUBMITTED
        to: VERIFIED_CLOSED
        trigger: "POST /farm-network/corrective-actions/{id}/verify with decision=VERIFY_CLOSED"
        actor: Auditor
        preconditions:
          - "ca.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != parent audit.auditor_user_id (segregation of duties; else ERR_SOD_VIOLATION)"
        side_effects:
          - "ca.status := VERIFIED_CLOSED; ca.verified_by_user_id := X-User-ID; ca.closed_at := now"
      - from: SUBMITTED
        to: OPEN
        trigger: "POST /farm-network/corrective-actions/{id}/verify with decision=REJECT"
        actor: Auditor
        preconditions:
          - "ca.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != parent audit.auditor_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "ca.status := OPEN (rework loop; due_at unchanged)"
      - from: OPEN
        to: OVERDUE
        trigger: "system: POST /farm-network/_clock/set_current_utc advances the clock strictly past due_at"
        actor: system
        preconditions: ["ca.status in {OPEN, SUBMITTED}", "now > due_at"]
        side_effects:
          - "ca.status := OVERDUE"
          - "severity CRITICAL: farm -> SUSPENDED (with stop-skip cascade) if farm.status in {ACTIVE, PROBATION}"
          - "severity MAJOR: farm -> PROBATION if farm.status == ACTIVE"
          - "severity MINOR: no farm status change"
      - from: SUBMITTED
        to: OVERDUE
        trigger: "system: clock advances past due_at while evidence awaited verification"
        actor: system
        preconditions: ["ca.status in {OPEN, SUBMITTED}", "now > due_at"]
        side_effects: ["same escalation side effects as OPEN->OVERDUE"]
      - from: OPEN
        to: CANCELLED
        trigger: "system: farm removal cascade"
        actor: system
        preconditions: ["farm transitions to REMOVED"]
        side_effects: ["ca.status := CANCELLED"]
      - from: OVERDUE
        to: CANCELLED
        trigger: "system: farm removal cascade"
        actor: system
        preconditions: ["farm transitions to REMOVED"]
        side_effects: ["ca.status := CANCELLED"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system: farm removal cascade"
        actor: system
        preconditions: ["farm transitions to REMOVED"]
        side_effects: ["ca.status := CANCELLED"]

  - entity: WelfareIncident
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: RESOLVED
        trigger: "POST /farm-network/incidents/{id}/resolve"
        actor: NetworkManager
        preconditions: ["incident.status == REPORTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "incident.status := RESOLVED; incident.disposition := payload disposition; incident.resolved_at := now"
          - "disposition NONE: no farm change"
          - "disposition PROBATION: farm -> PROBATION if farm.status == ACTIVE"
          - "disposition SUSPENSION: farm -> SUSPENDED if farm.status in {ACTIVE, PROBATION} (with stop-skip cascade)"
          - "disposition REMOVAL: farm -> REMOVED with the full REMOVAL cascade (see Farm.removal_cascade_note)"
    report_time_note: |
      Reporting an incident (POST /farm-network/farms/{id}/incidents) is a creation, not a
      transition of this machine, but it has a conditional cascade: severity == CRITICAL
      immediately moves the farm ACTIVE|PROBATION -> SUSPENDED (with the stop-skip cascade)
      at report time, before any resolution.

  - entity: CollectionRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    note: "Stops are embedded items with their own mini-lifecycle: SCHEDULED -> COLLECTED (via collect) and SCHEDULED -> SKIPPED (via skip or farm suspension/removal cascade). Route completion is a compound gate on child stop states."
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /farm-network/routes/{id}/complete"
        actor: PlantOperator
        preconditions:
          - "route.status == PLANNED (else ERR_INVALID_STATE)"
          - "every stop in route.stops is in status COLLECTED or SKIPPED (else ERR_ROUTE_STOPS_OPEN)"
        side_effects:
          - "route.status := COMPLETED; route.version += 1"

  - entity: EggLot
    initial_state: RECEIVED
    terminal_states: [REJECTED, PACKED]
    note: "Branching fork at grading: score >= GRADE_B_MIN goes GRADED, below goes ON_HOLD; ON_HOLD forks again to RELEASED (packable, salvaged as grade B) or REJECTED (destroyed)."
    transitions:
      - from: RECEIVED
        to: GRADED
        trigger: "POST /farm-network/lots/{id}/grade with quality_score >= GRADE_B_MIN (70)"
        actor: QualityManager
        preconditions: ["lot.status == RECEIVED (else ERR_LOT_NOT_GRADABLE)"]
        side_effects:
          - "lot.grade := AA | A | B per calculations.quality_grade_assignment; lot.quality_score := payload; lot.graded_at := now; lot.status := GRADED"
      - from: RECEIVED
        to: ON_HOLD
        trigger: "POST /farm-network/lots/{id}/grade with quality_score < GRADE_B_MIN (70)"
        actor: QualityManager
        preconditions: ["lot.status == RECEIVED (else ERR_LOT_NOT_GRADABLE)"]
        side_effects:
          - "lot.grade := NONE; lot.quality_score := payload; lot.graded_at := now; lot.status := ON_HOLD"
      - from: ON_HOLD
        to: RELEASED
        trigger: "POST /farm-network/lots/{id}/resolve-hold with disposition=RELEASE"
        actor: QualityManager
        preconditions: ["lot.status == ON_HOLD (else ERR_LOT_NOT_ON_HOLD)"]
        side_effects:
          - "lot.status := RELEASED; lot.grade := B (salvage grade)"
      - from: ON_HOLD
        to: REJECTED
        trigger: "POST /farm-network/lots/{id}/resolve-hold with disposition=REJECT"
        actor: QualityManager
        preconditions: ["lot.status == ON_HOLD (else ERR_LOT_NOT_ON_HOLD)"]
        side_effects:
          - "lot.status := REJECTED; lot.destroyed_dozens := lot.remaining_dozens; lot.remaining_dozens := 0"
          - "conservation invariant holds: received_dozens == remaining_dozens + packed_dozens + destroyed_dozens"
      - from: GRADED
        to: PACKED
        trigger: "system: POST /farm-network/lots/{id}/cartons brings remaining_dozens to exactly 0"
        actor: system
        preconditions: ["lot.status in {GRADED, RELEASED}", "pack succeeds"]
        side_effects:
          - "lot.status := PACKED when remaining_dozens == 0 after the pack"
      - from: RELEASED
        to: PACKED
        trigger: "system: POST /farm-network/lots/{id}/cartons brings remaining_dozens to exactly 0"
        actor: system
        preconditions: ["lot.status in {GRADED, RELEASED}", "pack succeeds"]
        side_effects:
          - "lot.status := PACKED when remaining_dozens == 0 after the pack"

  - entity: SupplyCommitment
    initial_state: ACTIVE
    terminal_states: [FILLED, SHORTFALL, CANCELLED]
    transitions:
      - from: ACTIVE
        to: FILLED
        trigger: "system: POST /farm-network/settlement-runs/{id}/finalize for the matching week_start"
        actor: system
        preconditions: ["commitment.week_start == settlement.week_start", "delivered_dozens >= floor(committed_dozens * MIN_FILL_RATE)"]
        side_effects:
          - "commitment.status := FILLED; commitment.delivered_dozens and fill_rate populated (calculations.commitment_fill_evaluation)"
      - from: ACTIVE
        to: SHORTFALL
        trigger: "system: POST /farm-network/settlement-runs/{id}/finalize for the matching week_start"
        actor: system
        preconditions: ["commitment.week_start == settlement.week_start", "delivered_dozens < floor(committed_dozens * MIN_FILL_RATE)"]
        side_effects:
          - "commitment.status := SHORTFALL; commitment.delivered_dozens and fill_rate populated"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: farm removal cascade (only when commitment.week_start is strictly after the current date)"
        actor: system
        preconditions: ["farm transitions to REMOVED", "week_start > current date"]
        side_effects:
          - "commitment.status := CANCELLED"

  - entity: SettlementRun
    initial_state: CALCULATED
    terminal_states: [FINALIZED]
    transitions:
      - from: CALCULATED
        to: FINALIZED
        trigger: "POST /farm-network/settlement-runs/{id}/finalize"
        actor: NetworkManager
        preconditions: ["settlement.status == CALCULATED (else ERR_INVALID_STATE)"]
        side_effects:
          - "final_cents recomputed per line with the actual commodity base (calculations.farmer_payment, final variant); final_total_cents set"
          - "every ACTIVE SupplyCommitment with week_start == settlement.week_start is evaluated to FILLED or SHORTFALL (calculations.commitment_fill_evaluation)"
          - "settlement.status := FINALIZED; finalized_at := now; settlement.version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: contract-create-stale-farm-version
    parent_entity: Farm
    write_endpoint: "POST /farm-network/farms/{id}/contracts"
    occ_field: expected_farm_version
    description: |
      Creating a FarmContract legitimately supersedes the farm's current ACTIVE
      contract, so a client must present the farm version it last observed via
      expected_farm_version. If the farm's version has advanced since (for
      example another writer just created a contract, which bumps farm.version),
      the caller's view is stale and the create is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_bird_capacity
    trigger: "on Farm creation and on every PATCH /farm-network/farms/{id} that touches pasture_sqft, barn_sqft, nest_box_count"
    algorithm: threshold
    formula: |
      pasture_cap = floor(pasture_sqft / MIN_PASTURE_SQFT_PER_BIRD)
      barn_cap    = floor(barn_sqft / MIN_BARN_SQFT_PER_BIRD)
      nest_cap    = nest_box_count * BIRDS_PER_NEST_BOX
      effective_bird_capacity = min(pasture_cap, barn_cap, nest_cap)
      Activation requires declared_bird_count <= effective_bird_capacity (inclusive at equality).
    input_set: "the Farm row being created or patched"
    constants:
      MIN_PASTURE_SQFT_PER_BIRD: 108.0
      MIN_BARN_SQFT_PER_BIRD: 1.2
      BIRDS_PER_NEST_BOX: 5
    precision: "integer, floor at each component before min"

  - name: production_forecast
    trigger: "on POST /farm-network/farms/{id}/forecasts; both variants computed and stored at creation"
    algorithm: aggregation
    formula: |
      weekly_eggs(variant) = declared_bird_count * LAY_RATE[season] * WEATHER_FACTOR[variant][weather_severity] * DAYS_PER_WEEK
      result(variant) = floor(weekly_eggs(variant) / EGGS_PER_DOZEN)
      optimistic_dozens   = result("OPTIMISTIC")
      conservative_dozens = result("CONSERVATIVE")
      Non-linear interaction: three tiered lookups (season rate, variant table, severity
      column) multiply, so the ratio between variants is not constant across severity levels.
    input_set: "the Farm row (declared_bird_count) + forecast payload (season, weather_severity)"
    constants:
      LAY_RATE_SPRING: 0.82
      LAY_RATE_SUMMER: 0.78
      LAY_RATE_AUTUMN: 0.72
      LAY_RATE_WINTER: 0.61
      WEATHER_OPTIMISTIC_NONE: 1.00
      WEATHER_OPTIMISTIC_MODERATE: 0.95
      WEATHER_OPTIMISTIC_SEVERE: 0.88
      WEATHER_CONSERVATIVE_NONE: 0.98
      WEATHER_CONSERVATIVE_MODERATE: 0.88
      WEATHER_CONSERVATIVE_SEVERE: 0.75
      DAYS_PER_WEEK: 7
      EGGS_PER_DOZEN: 12
    precision: "integer dozens, floor after the full product (no intermediate rounding)"
    variants:
      - name: optimistic
        when: "P50 planning view; shown to network planners"
        difference: "uses WEATHER_OPTIMISTIC_* factors"
      - name: conservative
        when: "P90 weather-hedged view; sole basis for commitment_cap"
        difference: "uses WEATHER_CONSERVATIVE_* factors; strictly lower than optimistic whenever weather_severity != NONE (equal factors differ even at NONE: 1.00 vs 0.98)"

  - name: commitment_cap
    trigger: "on POST /farm-network/commitments (validation) and used cumulatively per farm-week"
    algorithm: threshold
    formula: |
      cap(farm, week_start) = floor(ProductionForecast.conservative_dozens * MAX_COMMIT_RATIO)
      total_committed(farm, week_start) = sum of committed_dozens over SupplyCommitment rows
        with this farm_id, this week_start, and status in {ACTIVE, FILLED, SHORTFALL}
      a new commitment is accepted iff total_committed + new.committed_dozens <= cap  (inclusive at equality)
    input_set: "the ProductionForecast row for (farm_id, week_start) — exactly one may exist — plus all non-cancelled commitments of the same farm-week"
    constants:
      MAX_COMMIT_RATIO: 0.9
    precision: "integer dozens, floor"

  - name: quality_grade_assignment
    trigger: "on POST /farm-network/lots/{id}/grade"
    algorithm: threshold
    formula: |
      if quality_score >= GRADE_AA_MIN: grade = AA
      elif quality_score >= GRADE_A_MIN: grade = A
      elif quality_score >= GRADE_B_MIN: grade = B, status = GRADED
      else: grade = NONE, status = ON_HOLD
      Boundaries are inclusive (>=): exactly 95.0 is AA, exactly 85.0 is A, exactly 70.0 is B.
      A lot released from hold via resolve-hold is assigned grade B regardless of its original score.
    input_set: "the EggLot being graded"
    constants:
      GRADE_AA_MIN: 95.0
      GRADE_A_MIN: 85.0
      GRADE_B_MIN: 70.0
    precision: "quality_score compared as given (number, up to 2 decimals)"

  - name: route_load_reconciliation
    trigger: "on every stop add, collect, skip, and on cascaded skips (farm suspension/removal)"
    algorithm: aggregation
    formula: |
      committed_cases = sum(stops[i].planned_cases   where status == SCHEDULED)
                      + sum(stops[i].collected_cases where status == COLLECTED)
      available_cases = capacity_cases - committed_cases
      Invariant (conserved quantity): capacity_cases == committed_cases + available_cases at all times.
      Adding a stop consumes planned_cases; collecting may consume more or less than planned
      (delta settles against available_cases); skipping restores the full planned_cases.
    input_set: "the route's own stops array"
    constants: {}
    precision: "integer cases"

  - name: farmer_payment
    trigger: "on POST /farm-network/settlement-runs (provisional variant) and on POST /farm-network/settlement-runs/{id}/finalize (final variant)"
    algorithm: tiered_pricing
    formula: |
      For each farm with cartons packed_at inside [week_start, week_start + 7 days):
        group packed dozens by parent-lot grade g in {AA, A, B} -> dozens_g
        applicable contract = the farm's FarmContract (any status) with the LATEST start_date
          satisfying start_date <= week_start <= end_date
        provisional rate_cents = contract.commodity_base_cents_per_dozen + contract.premium_cents_per_dozen
        final rate_cents       = actual_commodity_base_cents_per_dozen   + contract.premium_cents_per_dozen
        ROUNDING ORDER (pinned): per grade subline FIRST, then sum:
          subline_g(variant) = round_half_up(dozens_g * rate_cents(variant) * QUALITY_MULT[g])   # whole cents
          line_total(variant) = sum over g of subline_g(variant)
      REJECTED lots contribute nothing (no cartons can be packed from them).
      The two variants differ for identical packed data whenever actual base != contract base.
    input_set: "all Carton rows with packed_at in the settlement week, joined through EggLot (grade, farm) and the farm's covering FarmContract"
    constants:
      QUALITY_MULT_AA: 1.10
      QUALITY_MULT_A: 1.00
      QUALITY_MULT_B: 0.85
    precision: "integer cents, round_half_up per grade subline before summation"
    variants:
      - name: provisional
        when: "at settlement-run creation (status CALCULATED)"
        difference: "uses the contract's commodity_base_cents_per_dozen as the base"
      - name: final
        when: "at finalize (status FINALIZED)"
        difference: "uses the published actual_commodity_base_cents_per_dozen supplied in the finalize payload"

  - name: certification_status_derivation
    trigger: "recomputed on audit completion, on clock advance, and on farm removal"
    algorithm: constraint_propagation
    formula: |
      if farm.status == REMOVED: certification_status = DECERTIFIED
      elif farm.last_passed_audit_at is null: certification_status = CERTIFICATION_PENDING
      elif now > last_passed_audit_at + CERT_VALIDITY_DAYS: certification_status = CERT_LAPSED
      else: certification_status = CERTIFIED
      Boundary: at exactly last_passed_audit_at + 365 days the farm is still CERTIFIED
      (lapse requires strictly greater). FAILED / CORRECTIVE_ACTION_REQUIRED audits never
      change certification_status directly.
    input_set: "the Farm row + its Audit history (latest PASSED completion)"
    constants:
      CERT_VALIDITY_DAYS: 365
    precision: "datetime comparison to the second"

  - name: commitment_fill_evaluation
    trigger: "on POST /farm-network/settlement-runs/{id}/finalize, per ACTIVE SupplyCommitment whose week_start equals the settlement week"
    algorithm: threshold
    formula: |
      delivered_dozens = sum of dozens over all Carton rows with source_farm_id == commitment.farm_id
                         and packed_at inside [week_start, week_start + DAYS_PER_WEEK)
      threshold = floor(committed_dozens * MIN_FILL_RATE)
      status = FILLED iff delivered_dozens >= threshold (inclusive), else SHORTFALL
      fill_rate = round_half_up(delivered_dozens / committed_dozens, 4)
    input_set: "the SupplyCommitment row + all Carton rows of the farm in the week"
    constants:
      MIN_FILL_RATE: 0.85
      DAYS_PER_WEEK: 7
    precision: "delivered/threshold integer dozens; fill_rate 4 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins when
#     several checks fail on the same request)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "RetailerBuyer scope: on GET /farm-network/commitments the retailer_id filter is required and must equal X-User-ID; on GET /farm-network/commitments/{id} the commitment's retailer_id must equal X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "GET /farm-network/commitments, GET /farm-network/commitments/{id}"
  - priority: 4
    category: auth
    check: "segregation of duties: on corrective-action verify, X-User-ID must differ from the parent audit's auditor_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /farm-network/corrective-actions/{id}/verify"
  - priority: 5
    category: existence
    check: "path identifiers resolve, validated left-to-right (farm before audit before corrective action, etc.); body references (retailer_id, farm_id on commitments) resolve"
    error_id: ERR_FARM_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_CA_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_STOP_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_CARTON_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body references"
  - priority: 6
    category: existence
    check: "request body is a well-formed object: required fields present, enum values in their declared sets, numeric ranges respected, start_date <= end_date / laid_start_date <= laid_end_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 7
    category: state
    check: "target resource is in a legal from-state for the requested transition (covers ERR_FARM_TERMINAL on REMOVED farms, ERR_AUDIT_NOT_SCHEDULED on audit complete, ERR_LOT_NOT_GRADABLE on grade, ERR_LOT_NOT_ON_HOLD on resolve-hold, ERR_FARM_NOT_ACTIVE on stop-add/forecast/commitment creation, ERR_INVALID_STATE for all other wrong-from-state transitions)"
    error_id: ERR_INVALID_STATE | ERR_FARM_TERMINAL | ERR_AUDIT_NOT_SCHEDULED | ERR_LOT_NOT_GRADABLE | ERR_LOT_NOT_ON_HOLD | ERR_FARM_NOT_ACTIVE
    http_status: 409
    applies_to: "all mutation endpoints"
  - priority: 8
    category: state
    check: "optimistic concurrency: expected_farm_version must equal the farm's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /farm-network/farms/{id}/contracts"
  - priority: 9
    category: business_safety
    check: "certification gate: activate requires certification_status == CERTIFIED (ERR_CERTIFICATION_REQUIRED); route-stop add and commitment creation require certification_status == CERTIFIED (ERR_CERTIFICATION_NOT_CURRENT)"
    error_id: ERR_CERTIFICATION_REQUIRED | ERR_CERTIFICATION_NOT_CURRENT
    http_status: 422
    applies_to: "POST /farm-network/farms/{id}/activate, POST /farm-network/routes/{id}/stops, POST /farm-network/commitments"
  - priority: 10
    category: business_referential
    check: "covering contract exists: activate requires an ACTIVE contract covering today; commitment creation requires a contract (any status except none) with start_date <= week_start <= end_date; commitment creation also requires an existing ProductionForecast for (farm, week_start)"
    error_id: ERR_CONTRACT_REQUIRED | ERR_FORECAST_REQUIRED
    http_status: 422
    applies_to: "POST /farm-network/farms/{id}/activate, POST /farm-network/commitments"
  - priority: 11
    category: business_temporal
    check: "audit scheduling gap: new audit's scheduled_for must be >= MIN_AUDIT_GAP_DAYS (30 days) away from every non-CANCELLED audit of the same farm (ERR_AUDIT_TOO_SOON); audit completion must fall inside [scheduled_for - 3d, scheduled_for + 7d] (ERR_AUDIT_WINDOW_MISSED); route-stop date exclusivity: the same farm may not occupy a SCHEDULED/COLLECTED stop on another route with the same route_date (ERR_STOP_DATE_CONFLICT)"
    error_id: ERR_AUDIT_TOO_SOON | ERR_AUDIT_WINDOW_MISSED | ERR_STOP_DATE_CONFLICT
    http_status: 422
    applies_to: "POST /farm-network/farms/{id}/audits, POST /farm-network/audits/{id}/complete, POST /farm-network/routes/{id}/stops"
  - priority: 12
    category: business_constraint
    check: "uniqueness and aggregate gates: stop_sequence unique per route (ERR_STOP_SEQUENCE_CONFLICT); one ProductionForecast per (farm, week_start) (ERR_FORECAST_EXISTS); one SettlementRun per week_start (ERR_DUPLICATE_SETTLEMENT); route completion requires all stops terminal (ERR_ROUTE_STOPS_OPEN)"
    error_id: ERR_STOP_SEQUENCE_CONFLICT | ERR_FORECAST_EXISTS | ERR_DUPLICATE_SETTLEMENT | ERR_ROUTE_STOPS_OPEN
    http_status: 409
    applies_to: "POST /farm-network/routes/{id}/stops, POST /farm-network/farms/{id}/forecasts, POST /farm-network/settlement-runs, POST /farm-network/routes/{id}/complete"
  - priority: 13
    category: business_fiscal
    check: "capacity and quota: declared_bird_count <= effective_bird_capacity at activation (ERR_BIRD_CAPACITY_INSUFFICIENT); cumulative committed dozens <= commitment cap (ERR_COMMITMENT_EXCEEDS_FORECAST); stop planned_cases <= route available_cases (ERR_ROUTE_CAPACITY_EXCEEDED); carton_count <= lot remaining_dozens (ERR_INSUFFICIENT_LOT_DOZENS)"
    error_id: ERR_BIRD_CAPACITY_INSUFFICIENT | ERR_COMMITMENT_EXCEEDS_FORECAST | ERR_ROUTE_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_LOT_DOZENS
    http_status: 422
    applies_to: "POST /farm-network/farms/{id}/activate, POST /farm-network/commitments, POST /farm-network/routes/{id}/stops, POST /farm-network/lots/{id}/cartons"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/farm-network/farms"
    description: "Recruit a farm into the network (enters ONBOARDING with certification CERTIFICATION_PENDING)"
    roles: [NetworkManager]
    code: 201
    input: [name, region, pasture_sqft, barn_sqft, nest_box_count, declared_bird_count]
    output: Farm
    side_effects: ["computes effective_bird_capacity (calculations.effective_bird_capacity)"]
  - method: GET
    path: "/farm-network/farms/{id}"
    description: "Farm detail including computed capacity and derived certification_status"
    roles: [NetworkManager, QualityManager, PlantOperator, PlatformAdmin]
    code: 200
    input: []
    output: Farm
    side_effects: []
  - method: PATCH
    path: "/farm-network/farms/{id}"
    description: "Amend pasture/housing specs; allowed only while ONBOARDING or PROBATION (spec corrections during remediation)"
    roles: [NetworkManager]
    code: 200
    input: ["name?", "region?", "pasture_sqft?", "barn_sqft?", "nest_box_count?", "declared_bird_count?"]
    output: Farm
    side_effects: ["recomputes effective_bird_capacity", "increments farm.version by 1"]
  - method: POST
    path: "/farm-network/farms/{id}/activate"
    description: "Activation gate: capacity, CERTIFIED certification, and covering ACTIVE contract (validations priority 9/10/13)"
    roles: [NetworkManager]
    code: 200
    input: []
    output: Farm
    side_effects: ["farm ONBOARDING -> ACTIVE; increments farm.version by 1"]
  - method: POST
    path: "/farm-network/farms/{id}/reinstate"
    description: "Return a PROBATION or SUSPENDED farm to ACTIVE once all corrective actions are terminal and no incident is REPORTED"
    roles: [NetworkManager]
    code: 200
    input: []
    output: Farm
    side_effects: ["farm PROBATION|SUSPENDED -> ACTIVE; increments farm.version by 1"]
  - method: POST
    path: "/farm-network/farms/{id}/remove"
    description: "Permanently remove a farm from the network; runs the full REMOVAL cascade (contract, commitments, stops, audits, corrective actions)"
    roles: [NetworkManager]
    code: 200
    input: [reason]
    output: Farm
    side_effects: ["farm -> REMOVED with removal_cascade_note steps (1)-(6)"]
  - method: POST
    path: "/farm-network/farms/{id}/contracts"
    description: "Create a pricing contract for the farm; supersedes the current ACTIVE contract. OCC: expected_farm_version must match farm.version."
    roles: [NetworkManager]
    code: 201
    input: [commodity_base_cents_per_dozen, premium_cents_per_dozen, start_date, end_date, expected_farm_version]
    output: FarmContract
    side_effects: ["previous ACTIVE contract -> SUPERSEDED", "increments farm.version by 1"]
  - method: GET
    path: "/farm-network/farms/{id}/contracts"
    description: "List contracts of a farm (all statuses), paginated"
    roles: [NetworkManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FarmContract[]
    side_effects: []
  - method: POST
    path: "/farm-network/farms/{id}/audits"
    description: "Schedule an audit; enforces the 30-day minimum gap against the farm's other non-CANCELLED audits"
    roles: [NetworkManager]
    code: 201
    input: [audit_type, scheduled_for]
    output: Audit
    side_effects: []
  - method: GET
    path: "/farm-network/farms/{id}/audits"
    description: "List audits of a farm, paginated"
    roles: [NetworkManager, Auditor, QualityManager]
    code: 200
    input: ["status?", "audit_type?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: GET
    path: "/farm-network/audits/{id}"
    description: "Audit detail"
    roles: [NetworkManager, Auditor, QualityManager]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: "/farm-network/audits/{id}/complete"
    description: "Record audit outcome within the scheduling window; creates one CorrectiveAction per finding; PASSED refreshes farm certification, FAILED moves farm to PROBATION"
    roles: [Auditor]
    code: 200
    input: [outcome, "findings?"]
    output: Audit
    side_effects: ["audit transition per state_machines.Audit", "farm certification/status side effects", "CorrectiveAction creation with due_at := now + CA_DUE_DAYS[severity]"]
  - method: GET
    path: "/farm-network/audits/{id}/corrective-actions"
    description: "List corrective actions opened by an audit, paginated"
    roles: [NetworkManager, Auditor]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: CorrectiveAction[]
    side_effects: []
  - method: POST
    path: "/farm-network/corrective-actions/{id}/submit"
    description: "Submit remediation evidence (farm side, filed by the network)"
    roles: [NetworkManager]
    code: 200
    input: [evidence_notes]
    output: CorrectiveAction
    side_effects: ["ca OPEN|OVERDUE -> SUBMITTED"]
  - method: POST
    path: "/farm-network/corrective-actions/{id}/verify"
    description: "Auditor verdict on submitted evidence; the verifying auditor MUST NOT be the auditor who completed the parent audit (segregation of duties)"
    roles: [Auditor]
    code: 200
    input: [decision, "notes?"]
    output: CorrectiveAction
    side_effects: ["VERIFY_CLOSED: ca -> VERIFIED_CLOSED; REJECT: ca -> OPEN (rework)"]
  - method: POST
    path: "/farm-network/farms/{id}/incidents"
    description: "Report an animal-welfare incident; CRITICAL severity immediately suspends the farm (stop-skip cascade)"
    roles: [NetworkManager, Auditor, QualityManager]
    code: 201
    input: [severity, incident_type, description]
    output: WelfareIncident
    side_effects: ["severity CRITICAL: farm ACTIVE|PROBATION -> SUSPENDED with stop-skip cascade"]
  - method: GET
    path: "/farm-network/farms/{id}/incidents"
    description: "List welfare incidents of a farm, paginated"
    roles: [NetworkManager, Auditor, QualityManager]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: WelfareIncident[]
    side_effects: []
  - method: POST
    path: "/farm-network/incidents/{id}/resolve"
    description: "Resolve an incident with a disposition; REMOVAL runs the farm removal cascade"
    roles: [NetworkManager]
    code: 200
    input: [disposition, "resolution_notes?"]
    output: WelfareIncident
    side_effects: ["incident -> RESOLVED", "disposition-driven farm transition per state_machines.WelfareIncident"]

  - method: POST
    path: "/farm-network/routes"
    description: "Plan a collection route to the central washing/grading facility"
    roles: [PlantOperator]
    code: 201
    input: [route_date, driver_name, capacity_cases]
    output: CollectionRoute
    side_effects: ["route created PLANNED with empty stops, committed_cases 0, available_cases == capacity_cases"]
  - method: GET
    path: "/farm-network/routes/{id}"
    description: "Route detail including embedded stops array and derived load fields"
    roles: [PlantOperator, NetworkManager]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: []
  - method: POST
    path: "/farm-network/routes/{id}/stops"
    description: "Add a farm stop to a PLANNED route; enforces farm ACTIVE + CERTIFIED, same-date exclusivity, sequence uniqueness, and capacity"
    roles: [PlantOperator]
    code: 201
    input: [farm_id, stop_sequence, planned_cases]
    output: CollectionRoute
    side_effects: ["stop appended with status SCHEDULED", "route_load_reconciliation", "increments route.version by 1"]
  - method: POST
    path: "/farm-network/routes/{id}/stops/{stop_sequence}/collect"
    description: "Record pickup at a stop; creates the EggLot (lot_code minted) in status RECEIVED"
    roles: [PlantOperator]
    code: 201
    input: [collected_cases, laid_start_date, laid_end_date]
    output: EggLot
    side_effects: ["stop SCHEDULED -> COLLECTED", "route_load_reconciliation (collected may differ from planned; delta settles against available_cases)", "EggLot created with received_dozens = collected_cases * 30", "increments route.version by 1"]
  - method: POST
    path: "/farm-network/routes/{id}/stops/{stop_sequence}/skip"
    description: "Skip a scheduled stop; restores its planned_cases to route capacity"
    roles: [PlantOperator]
    code: 200
    input: ["reason?"]
    output: CollectionRoute
    side_effects: ["stop SCHEDULED -> SKIPPED", "route_load_reconciliation", "increments route.version by 1"]
  - method: POST
    path: "/farm-network/routes/{id}/complete"
    description: "Close a route once every stop is COLLECTED or SKIPPED"
    roles: [PlantOperator]
    code: 200
    input: []
    output: CollectionRoute
    side_effects: ["route PLANNED -> COMPLETED; increments route.version by 1"]
  - method: GET
    path: "/farm-network/lots"
    description: "List egg lots with filters, paginated"
    roles: [PlantOperator, QualityManager, NetworkManager]
    code: 200
    input: ["farm_id?", "route_id?", "status?", "limit?", "offset?"]
    output: EggLot[]
    side_effects: []
  - method: GET
    path: "/farm-network/lots/{id}"
    description: "Lot detail including conservation fields (remaining/packed/destroyed dozens)"
    roles: [PlantOperator, QualityManager, NetworkManager]
    code: 200
    input: []
    output: EggLot
    side_effects: []
  - method: POST
    path: "/farm-network/lots/{id}/grade"
    description: "Record grading results; assigns grade by threshold or auto-holds the lot below GRADE_B_MIN"
    roles: [QualityManager]
    code: 200
    input: [quality_score]
    output: EggLot
    side_effects: ["lot RECEIVED -> GRADED or ON_HOLD (calculations.quality_grade_assignment)"]
  - method: POST
    path: "/farm-network/lots/{id}/resolve-hold"
    description: "Disposition a quality hold: RELEASE (salvage as grade B, packable) or REJECT (destroy remaining dozens)"
    roles: [QualityManager]
    code: 200
    input: [disposition]
    output: EggLot
    side_effects: ["lot ON_HOLD -> RELEASED or REJECTED", "on REJECT: destroyed_dozens := remaining_dozens, remaining_dozens := 0"]
  - method: POST
    path: "/farm-network/lots/{id}/cartons"
    description: "Pack cartons from a GRADED or RELEASED lot; mints carton codes and decrements remaining_dozens; lot auto-transitions to PACKED at exactly zero"
    roles: [PlantOperator]
    code: 201
    input: [carton_count, pack_size]
    output: Carton[]
    side_effects: ["carton_count Carton rows created with packed_at := now", "lot.remaining_dozens -= carton_count; lot.packed_dozens += carton_count", "lot -> PACKED when remaining_dozens == 0"]
  - method: GET
    path: "/farm-network/lots/{id}/cartons"
    description: "List cartons packed from a lot, paginated"
    roles: [PlantOperator, QualityManager, NetworkManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Carton[]
    side_effects: []
  - method: GET
    path: "/farm-network/cartons/{code}"
    description: "Consumer traceability read: carton plus denormalized originating-farm identity (source_farm_id, source_farm_name), parent lot, pack time and grade lineage"
    roles: [PlatformAdmin, NetworkManager, Auditor, QualityManager, PlantOperator, RetailerBuyer]
    code: 200
    input: []
    output: Carton
    side_effects: []
  - method: POST
    path: "/farm-network/retailers"
    description: "Onboard a retailer account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, banner, terms_net_days]
    output: RetailerAccount
    side_effects: []
  - method: POST
    path: "/farm-network/commitments"
    description: "Commit weekly dozens of a farm to a retailer; gated on farm ACTIVE, CERTIFIED certification, covering contract, existing forecast, and the cumulative commitment cap"
    roles: [NetworkManager]
    code: 201
    input: [retailer_id, farm_id, week_start, committed_dozens]
    output: SupplyCommitment
    side_effects: []
  - method: GET
    path: "/farm-network/commitments"
    description: "List commitments with filters, paginated; RetailerBuyer must pass retailer_id equal to its own account id"
    roles: [NetworkManager, PlatformAdmin, RetailerBuyer]
    code: 200
    input: ["farm_id?", "retailer_id?", "week_start?", "status?", "limit?", "offset?"]
    output: SupplyCommitment[]
    side_effects: []
  - method: GET
    path: "/farm-network/commitments/{id}"
    description: "Commitment detail; RetailerBuyer may only read its own"
    roles: [NetworkManager, PlatformAdmin, RetailerBuyer]
    code: 200
    input: []
    output: SupplyCommitment
    side_effects: []
  - method: POST
    path: "/farm-network/farms/{id}/forecasts"
    description: "Declare a seasonal/weather forecast for a farm-week; computes and stores both optimistic and conservative variants"
    roles: [NetworkManager]
    code: 201
    input: [week_start, season, weather_severity]
    output: ProductionForecast
    side_effects: ["computes optimistic_dozens and conservative_dozens (calculations.production_forecast)"]
  - method: GET
    path: "/farm-network/farms/{id}/forecasts"
    description: "List forecasts of a farm, paginated"
    roles: [NetworkManager, PlatformAdmin]
    code: 200
    input: ["week_start?", "limit?", "offset?"]
    output: ProductionForecast[]
    side_effects: []
  - method: POST
    path: "/farm-network/settlement-runs"
    description: "Open the weekly settlement: computes provisional payment lines for every farm with cartons packed in the week (provisional variant of farmer_payment)"
    roles: [NetworkManager]
    code: 201
    input: [week_start]
    output: SettlementRun
    side_effects: ["computes lines + provisional_total_cents (calculations.farmer_payment, provisional variant)"]
  - method: GET
    path: "/farm-network/settlement-runs/{id}"
    description: "Settlement detail including payment lines"
    roles: [NetworkManager, PlatformAdmin]
    code: 200
    input: []
    output: SettlementRun
    side_effects: []
  - method: POST
    path: "/farm-network/settlement-runs/{id}/finalize"
    description: "Publish the actual commodity base and settle: recomputes final payment lines and evaluates the week's ACTIVE commitments to FILLED or SHORTFALL"
    roles: [NetworkManager]
    code: 200
    input: [actual_commodity_base_cents_per_dozen]
    output: SettlementRun
    side_effects: ["final variant of calculations.farmer_payment", "calculations.commitment_fill_evaluation for matching commitments", "settlement CALCULATED -> FINALIZED"]
  - method: POST
    path: "/farm-network/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server boots with the logical clock fixed at 2026-09-01T00:00:00Z and NEVER falls back to wall-clock time; this endpoint is the only way to advance it. The new value must be strictly after the current value (monotonic). Advancing the clock fires, in order: (1) SCHEDULED audits past their completion window -> EXPIRED; (2) OPEN/SUBMITTED corrective actions past due_at -> OVERDUE with severity escalations (CRITICAL suspends the farm with stop-skip cascade, MAJOR probates an ACTIVE farm); (3) CERTIFIED farms whose last pass is older than CERT_VALIDITY_DAYS -> CERT_LAPSED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["audit expiry sweep", "corrective-action overdue sweep + farm cascades", "certification lapse sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint; or RetailerBuyer querying another retailer's commitments" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Corrective-action verify attempted by the same X-User-ID that completed the parent audit (segregation of duties)" }
  - { id: ERR_FARM_NOT_FOUND, http: 404, condition: "farm id in path or body does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "audit id in path does not exist" }
  - { id: ERR_CA_NOT_FOUND, http: 404, condition: "corrective-action id in path does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "incident id in path does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "route id in path does not exist" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "stop_sequence does not address an existing stop on the route" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot id in path does not exist" }
  - { id: ERR_CARTON_NOT_FOUND, http: 404, condition: "carton code in path does not exist" }
  - { id: ERR_RETAILER_NOT_FOUND, http: 404, condition: "retailer_id in commitment body does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "commitment id in path does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement-run id in path does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum value outside declared set, numeric range violated, or start/end date ordering violated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic illegal from-state for the requested transition (e.g. activate an ACTIVE farm, verify a non-SUBMITTED corrective action, collect a non-SCHEDULED stop, finalize a FINALIZED settlement, pack a REJECTED lot)" }
  - { id: ERR_FARM_TERMINAL, http: 409, condition: "Any mutation targeting a REMOVED farm (other than reads)" }
  - { id: ERR_FARM_NOT_ACTIVE, http: 409, condition: "Route-stop add, forecast creation, or commitment creation against a farm whose status is not ACTIVE" }
  - { id: ERR_AUDIT_NOT_SCHEDULED, http: 409, condition: "Audit completion attempted when the audit is not in SCHEDULED (already completed, EXPIRED, or CANCELLED)" }
  - { id: ERR_LOT_NOT_GRADABLE, http: 409, condition: "Grade attempted on a lot not in RECEIVED" }
  - { id: ERR_LOT_NOT_ON_HOLD, http: 409, condition: "resolve-hold attempted on a lot not in ON_HOLD" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_farm_version does not match the farm's current version (OCC)" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "Farm activation requires certification_status == CERTIFIED" }
  - { id: ERR_CERTIFICATION_NOT_CURRENT, http: 422, condition: "Route-stop add or commitment creation requires certification_status == CERTIFIED (blocks CERTIFICATION_PENDING, CERT_LAPSED, DECERTIFIED)" }
  - { id: ERR_CONTRACT_REQUIRED, http: 422, condition: "No contract covers the required date: activation needs an ACTIVE contract covering today; commitment needs a contract with start_date <= week_start <= end_date" }
  - { id: ERR_FORECAST_REQUIRED, http: 422, condition: "Commitment creation requires an existing ProductionForecast for the same (farm, week_start)" }
  - { id: ERR_AUDIT_TOO_SOON, http: 422, condition: "New audit's scheduled_for is less than 30 days away from another non-CANCELLED audit of the same farm" }
  - { id: ERR_AUDIT_WINDOW_MISSED, http: 422, condition: "Audit completion attempted before scheduled_for - 3 days (the late side is unreachable: such audits are auto-EXPIRED first)" }
  - { id: ERR_STOP_DATE_CONFLICT, http: 409, condition: "Farm already occupies a SCHEDULED or COLLECTED stop on another route with the same route_date" }
  - { id: ERR_STOP_SEQUENCE_CONFLICT, http: 409, condition: "stop_sequence already used on this route" }
  - { id: ERR_FORECAST_EXISTS, http: 409, condition: "A ProductionForecast already exists for this (farm, week_start)" }
  - { id: ERR_DUPLICATE_SETTLEMENT, http: 409, condition: "A SettlementRun already exists for this week_start" }
  - { id: ERR_ROUTE_STOPS_OPEN, http: 409, condition: "Route completion attempted while a stop is still SCHEDULED" }
  - { id: ERR_BIRD_CAPACITY_INSUFFICIENT, http: 422, condition: "declared_bird_count > effective_bird_capacity at activation" }
  - { id: ERR_COMMITMENT_EXCEEDS_FORECAST, http: 422, condition: "Cumulative committed dozens for the farm-week would exceed floor(conservative_dozens * 0.9)" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "Stop planned_cases (or collect overage) exceeds the route's available_cases" }
  - { id: ERR_INSUFFICIENT_LOT_DOZENS, http: 422, condition: "carton_count exceeds the lot's remaining_dozens" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns retailer onboarding and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /farm-network/retailers"
      - "POST /farm-network/_clock/set_current_utc"
    shared_operations:
      - "read farms, contracts, forecasts, commitments, settlement runs, cartons"
  - name: NetworkManager
    description: "Farm-network operations manager; owns recruitment, contracts, audit scheduling, evidence submission, incident resolution, commitments, forecasts, settlements"
    identity: opaque
    exclusive_operations:
      - "POST /farm-network/farms and farm lifecycle actions (activate, reinstate, remove, PATCH)"
      - "POST /farm-network/farms/{id}/contracts"
      - "POST /farm-network/farms/{id}/audits"
      - "POST /farm-network/corrective-actions/{id}/submit"
      - "POST /farm-network/incidents/{id}/resolve"
      - "POST /farm-network/commitments"
      - "POST /farm-network/farms/{id}/forecasts"
      - "POST /farm-network/settlement-runs and finalize"
    shared_operations:
      - "read farms, audits, corrective actions, incidents, routes, lots, cartons, commitments"
  - name: Auditor
    description: "Third-party auditor; completes audits and verifies corrective actions. Segregation of duties: the auditor who completed an audit cannot verify that audit's corrective actions."
    identity: opaque
    exclusive_operations:
      - "POST /farm-network/audits/{id}/complete"
      - "POST /farm-network/corrective-actions/{id}/verify"
    shared_operations:
      - "read audits, corrective actions, incidents; report incidents; read cartons (traceability)"
  - name: QualityManager
    description: "Washing/grading facility quality lead; grades lots and dispositions quality holds"
    identity: opaque
    exclusive_operations:
      - "POST /farm-network/lots/{id}/grade"
      - "POST /farm-network/lots/{id}/resolve-hold"
    shared_operations:
      - "read farms, audits, incidents, lots, cartons; report incidents"
  - name: PlantOperator
    description: "Facility floor operator; runs collection routes and packing"
    identity: opaque
    exclusive_operations:
