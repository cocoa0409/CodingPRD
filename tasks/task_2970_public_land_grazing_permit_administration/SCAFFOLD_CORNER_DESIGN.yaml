            - "trigger returns HTTP 409 with data.error_id == \"ERR_ENVIRONMENTAL_REVIEW_INCOMPLETE\""
            - "PermitDecision.${c_d2_id}.decision_status is still \"PROPOSED\" and deciding_officer_id is still null"
            - "control: the same call with rationale \"Reduce stocking to restore upland trend on the burned north pasture.\" (63 characters) returns HTTP 200 with decision_status \"FINAL\" and deciding_officer_id \"u_officer_1\""

