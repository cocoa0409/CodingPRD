            - "BU AERO (lead-1); diverse suppliers A and B, each with a VERIFIED MBE cert covering the default clock (both ACTIVE and diverse_eligible)"
            - "Event E1 (required 2, estimated 500000): A and B invited, both BID_SUBMITTED -> diverse_bid_count == 2"
