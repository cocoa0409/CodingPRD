  - rule_id: transitive_cascade
    instances:
      - name: consent_revocation_four_hop_cascade
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.MoveRecord.SCHEDULING_to_ATTENTION_REQUIRED_ON_CONSENT_REVOCATION
          - state_machines.UtilityOrder.OPEN_PROVISION_to_SUSPENDED
          - state_machines.UtilityOrder.OPEN_CREDIT_to_VOIDED
          - state_machines.CreditCheckHandoff.OPEN_HANDOFF_to_VOIDED
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /consent-records/{id}/revocation: hop 1 flips the ConsentRecord to
          REVOKED, which causes hop 2 (MoveRecord consent_gate BLOCKED and SCHEDULING -> ATTENTION_REQUIRED),
          which causes hop 3 (the move's open UtilityOrder -> SUSPENDED with both window fields cleared),
          which causes hop 4 (that order's credit_status -> VOIDED and its CreditCheckHandoff -> VOIDED);
          each hop is impossible without the previous one having landed.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Move for 2026-08-20 in lifecycle SCHEDULING with UTILITY_SETUP consent granted."
            - "One ELECTRIC order in provision_status DRAFT with credit_status PENDING_CHECK."
            - "One CreditCheckHandoff on that order in handoff_status SUBMITTED, no bureau response yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
