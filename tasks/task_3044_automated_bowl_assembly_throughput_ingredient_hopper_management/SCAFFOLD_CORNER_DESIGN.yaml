      - name: drift_threshold_boundary_exactly_3pct_no_quarantine
        claim_type: rate_threshold_triggers
        grounds: ["calculations.calibration_drift_detection"]
        distinguishing_aspect: "Cumulative threshold with strict-> semantics: three samples at exactly +3.00 mean drift 3.00 which does NOT quarantine; a fourth sample at +3.00 keeps it at 3.00 (still no), while samples at +3.10 push the mean to 3.10 and DO quarantine."
        test_recipe:
