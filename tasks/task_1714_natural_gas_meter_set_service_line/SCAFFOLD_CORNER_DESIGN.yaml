        grounds: ["endpoints[GET /builders]", "response_envelope"]
        distinguishing_aspect: "With 3 builders, limit=2&offset=0 returns 2 rows + total_count 3 + has_more true; offset=2 returns 1 row + has_more false; every list response carries the four pagination fields."
        test_recipe:
