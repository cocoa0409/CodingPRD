      - name: release_blocked_by_superseded_product_returns_422
        grounds:
          - state_machines.LoanerSet.DELIVERED_ON_TIME_to_RELEASED_TO_OR
          - state_machines.ApprovedProduct.ACTIVE_to_SUSPENDED
          - state_machines.ProductIntroductionRequest.VALUE_ANALYSIS_REVIEW_to_APPROVED
          - validations.priority_36_ERR_PRODUCT_NOT_APPROVED
          - entities.ProductIntroductionRequest.fields.supersedes_request_id
          - entities.ApprovedProduct.fields.suspended_reason
        distinguishing_aspect: |
          A different dependency pair and a different direction from the rep/authorization instance:
          LoanerSet.release reads ApprovedProduct.status, which was mutated by the approval of an
          unrelated, self-referentially superseding ProductIntroductionRequest. Crucially the
          supersession path does NOT hold loaner sets — only the incident path does — so the set is
          still DELIVERED_ON_TIME and priority 17 cannot fire; the only possible refusal is the
          cross-entity referential check, ERR_PRODUCT_NOT_APPROVED (422).
        test_recipe:
          setup:
            - "Facility CE-14 has spd_turnaround_hours 6 and spd_bay_count 3."
            - "Vendor SUPRA gets a first implant product approved (request PIR-1), yielding ApprovedProduct AP-1 in status ACTIVE."
            - "Case CASE-10101 is an implant case 2026-09-28T10:00:00Z to 14:00:00Z; a 4-tray SIMPLE set on AP-1 has lead_hours = max(6 + 2 + 0, 24) = 24 and a deadline of 2026-09-27T10:00:00Z."
            - "The set is received at 2026-09-27T08:00:00Z, two hours early, so it is DELIVERED_ON_TIME."
            - "A second request PIR-2 carries supersedes_request_id = PIR-1 and is approved by the same two-user chain, which suspends AP-1 with suspended_reason SUPERSEDED and mints AP-2 ACTIVE."
            - "The Vendor version is re-read immediately before the second request because open_pir_count changes bump it."
