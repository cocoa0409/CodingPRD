              payload: { manufacturer_id: "${mfr_id}", license_model: "PER_VEHICLE", monthly_fee_cents: 100000, per_vehicle_fee_cents: 2500, seat_cap: 5, covered_system_area_ids: ["${sa_pt_id}"], effective_start: "2026-08-01T00:00:00Z", effective_end: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /shops"
              payload: { name: "Bay Auto", tier: "PRO" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/credit-funding"
              payload: { amount_cents: 100000, funding_ref: "FUND-1" }
