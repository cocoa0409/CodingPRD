scenario: |
  Print-on-Demand Creator Storefront (Printful/Printify style): product catalog & design
  upload/mockup, creator storefront & pricing/margin, on-demand print & fulfillment routing,
  order/variant & inventory-less model, sample order, return/reprint policy, payout & fee,
  integration (Etsy/Shopify)

domain_name: print-on-demand-storefront
api_prefix: "/pod"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Creator
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique creator email (login handle)
        constraints: unique
      - name: display_name
        type: string
        source: input
        description: Public storefront name
      - name: payout_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of payout bank
      - name: payout_wallet_cents
        type: integer
        source: computed
        description: Accumulated net earnings not yet paid out; recomputed by payout_cycle calculation on order fulfillment cascade
        default: 0
      - name: verification_status
        type: enum
        source: system
        description: Creator KYC state
        constraints: "one of [UNVERIFIED, PENDING, VERIFIED, REJECTED]"
        default: UNVERIFIED
      - name: default_payout_fee_bps
        type: integer
        source: system
        description: Basis-points fee subtracted from payout at each cycle; frozen at time of payout cycle run
        default: 250
      - name: reprint_strike_count
        type: integer
        source: computed
        description: Number of consumer-fault reprints in trailing 90 days; increments on ReprintRequest CONSUMER_FAULT approval, decays only via ops-run
        default: 0

  - name: Storefront
    parent: null
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: slug
        type: string
        source: input
        description: URL slug for storefront; unique across all storefronts
        constraints: unique
      - name: integration_channel
        type: enum
        source: input
        description: External sales channel this storefront syncs with
        constraints: "one of [NATIVE, ETSY, SHOPIFY]"
        default: NATIVE
      - name: integration_status
        type: enum
        source: computed
        description: State of external channel sync
        constraints: "one of [NONE, LINKED, SUSPENDED]"
        default: NONE
      - name: markup_bps
        type: integer
        source: input
        description: Creator's chosen markup in basis-points added to base cost + platform fee to derive listed price
        constraints: "0..10000"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Manufacturer SKU (blank T-shirt, mug, etc.)
        constraints: unique
      - name: category
        type: enum
        source: input
        description: Product family
        constraints: "one of [APPAREL, DRINKWARE, ACCESSORY, PRINT]"
      - name: base_cost_cents
        type: integer
        source: input
        description: Manufacturer base cost per unit (currency = USD)
        constraints: ">= 100"
      - name: dimensions_json
        type: object
        source: input
        description: Print-area dimensions {width_px, height_px, dpi}

  - name: Variant
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id
      - name: color
        type: string
        source: input
        description: Color name
      - name: size
        type: string
        source: input
        description: Size code
      - name: base_cost_delta_cents
        type: integer
        source: input
        description: Additive cost delta over Product.base_cost_cents for this variant
        default: 0
      - name: active
        type: boolean
        source: system
        description: Whether variant may currently be sold; set false by admin variant-deactivation transition
        default: true

  - name: Design
    parent: Creator
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: file_hash
        type: string
        source: input
        description: sha256 of design binary; server rejects duplicate hash for same creator
      - name: status
        type: enum
        source: system
        description: Moderation lifecycle
        constraints: "one of [UPLOADED, MOCKUP_READY, APPROVED, REJECTED]"
        default: UPLOADED
      - name: mockup_url
        type: string
        source: computed
        description: URL of generated mockup image; set by mockup generation transition
        default: null

  - name: Listing
    parent: Storefront
    common_fields: true
    fields:
      - name: storefront_id
        type: string
        source: input
        description: FK -> Storefront.id
      - name: design_id
        type: string
        source: input
        description: FK -> Design.id
      - name: variant_id
        type: string
        source: input
        description: FK -> Variant.id
      - name: title
        type: string
        source: input
        description: Product title as shown on storefront
      - name: listed_price_cents
        type: integer
        source: computed
        description: Derived by listing_price calculation from Variant + Storefront.markup_bps + platform fee ceiling; recomputed on Storefront.markup_bps update
      - name: status
        type: enum
        source: system
        description: Publication state
        constraints: "one of [DRAFT, PUBLISHED, ARCHIVED]"
        default: DRAFT

  - name: FulfillmentPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Print house display name
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country where this partner prints
      - name: cost_multiplier_bps
        type: integer
        source: input
        description: Multiplier applied to base_cost_cents to obtain this partner's charge (10000 = 1.00x)
      - name: current_backlog_hours
        type: integer
        source: computed
        description: Estimated queue backlog in hours; updated on FulfillmentJob create/complete cascade
        default: 0
      - name: max_backlog_hours
        type: integer
        source: input
        description: Backlog ceiling above which partner is ineligible for routing
        default: 168
      - name: status
        type: enum
        source: system
        description: Partner availability
        constraints: "one of [ACTIVE, SUSPENDED, RETIRED]"
        default: ACTIVE

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: storefront_id
        type: string
        source: input
        description: FK -> Storefront.id
      - name: buyer_email
        type: string
        source: input
        description: Contact email for buyer notifications
      - name: ship_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 destination country
      - name: item_count
        type: integer
        source: input
        description: Number of Variant units in this order (single-line for scaffold simplicity)
      - name: listing_id
        type: string
        source: input
        description: FK -> Listing.id
      - name: is_sample
        type: boolean
        source: input
        description: True if this is a creator sample order (creator pays base cost, no platform fee, no creator margin)
        default: false
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Buyer-paid gross = listed_price_cents * item_count + shipping_cents at commit
      - name: shipping_cents
        type: integer
        source: computed
        description: Shipping computed at commit from partner routing decision
      - name: payment_status
        type: enum
        source: system
        description: Payment dimension of the order state machine (independent of fulfillment_status)
        constraints: "one of [DRAFT, AUTHORIZED, CAPTURED, REFUND_PARTIAL, REFUND_FULL, VOIDED]"
        default: DRAFT
      - name: fulfillment_status
        type: enum
        source: system
        description: Fulfillment dimension of the order state machine (independent of payment_status)
        constraints: "one of [PENDING, ROUTED, IN_PRINT, SHIPPED, DELIVERED, CANCELLED]"
        default: PENDING
      - name: routed_partner_id
        type: string
        source: computed
        description: FK -> FulfillmentPartner.id; assigned by routing selector at PENDING->ROUTED transition
        default: null
      - name: creator_net_cents
        type: integer
        source: computed
        description: Creator's take-home from this order in cents; provisional value populated at order creation via creator_profit provisional variant, overwritten at fulfillment_status -> DELIVERED via creator_profit final variant (may deduct reprint absorbance)
        default: 0

  - name: FulfillmentJob
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> Order.id
      - name: partner_id
        type: string
        source: input
        description: FK -> FulfillmentPartner.id
      - name: status
        type: enum
        source: system
        description: Job lifecycle including reprint cycle
        constraints: "one of [QUEUED, PRINTING, SHIPPED, DELIVERED, FAILED, REPRINT_REQUESTED, CANCELLED]"
        default: QUEUED
      - name: reprint_generation
        type: integer
        source: system
        description: Zero-based reprint count; increments on each REPRINT_REQUESTED -> QUEUED transition
        default: 0
      - name: partner_charge_cents
        type: integer
        source: computed
        description: Amount partner bills the platform for this job; recomputed if reprint generation triggers pricing recalculation
      - name: shipped_at
        type: datetime
        source: system
        description: Timestamp when SHIPPED transition fired
        default: null

  - name: ReprintRequest
    parent: FulfillmentJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: FK -> FulfillmentJob.id
      - name: fault_category
        type: enum
        source: input
        description: Financial responsibility category
        constraints: "one of [PARTNER_FAULT, CONSUMER_FAULT, PLATFORM_GESTURE]"
      - name: reason_code
        type: string
        source: input
        description: Short reason keyword (WRONG_SIZE, DAMAGED, MISPRINT, LATE, OTHER)
      - name: status
        type: enum
        source: system
        description: Reprint request approval state
        constraints: "one of [OPEN, APPROVED, DENIED]"
        default: OPEN

  - name: PayoutCycle
    parent: Creator
    common_fields: true
    fields:
      - name: creator_id
        type: string
        source: input
        description: FK -> Creator.id
      - name: cycle_start
        type: datetime
        source: input
        description: Inclusive start of cycle window
      - name: cycle_end
        type: datetime
        source: input
        description: Exclusive end of cycle window
      - name: gross_earnings_cents
        type: integer
        source: computed
        description: Sum of eligible order margins in window; computed by payout_cycle calculation
      - name: fee_cents
        type: integer
        source: computed
        description: Payout fee subtracted (payout_fee_bps applied)
      - name: net_paid_cents
        type: integer
        source: computed
        description: gross_earnings_cents - fee_cents; posted to external payout on RELEASED
      - name: status
        type: enum
        source: system
        description: Payout cycle lifecycle
        constraints: "one of [DRAFT, RELEASED, RETURNED]"
        default: DRAFT

  - name: ChannelSyncEvent
    parent: Storefront
    common_fields: false
    fields:
      - name: storefront_id
        type: string
        source: input
        description: FK -> Storefront.id
      - name: channel
        type: enum
        source: input
        description: Which external channel emitted the event
        constraints: "one of [ETSY, SHOPIFY]"
      - name: event_type
        type: enum
        source: input
        description: What happened at the external channel
        constraints: "one of [LISTING_MIRROR, ORDER_INGEST, SYNC_FAIL]"
      - name: external_ref
        type: string
        source: input
        description: External system's reference id for the mirrored/ingested object

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Design
    initial_state: UPLOADED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: UPLOADED
        to: MOCKUP_READY
        trigger: "POST /pod/designs/{id}/mockup"
        actor: Creator
        preconditions:
          - "Design.status == UPLOADED"
          - "Design.file_hash present"
        side_effects:
          - "set Design.mockup_url to generated URL"
          - "Design.updated_at refreshed"

      - from: MOCKUP_READY
        to: APPROVED
        trigger: "POST /pod/designs/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Design.status == MOCKUP_READY"
        side_effects:
          - "Design.updated_at refreshed"

      - from: MOCKUP_READY
        to: REJECTED
        trigger: "POST /pod/designs/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "Design.status == MOCKUP_READY"
        side_effects:
          - "Design.updated_at refreshed (no downstream cascade — MOCKUP_READY has no PUBLISHED listings yet)"

      - from: APPROVED
        to: REJECTED
        trigger: "POST /pod/designs/{id}/reject (admin recall of an approved design)"
        actor: PlatformAdmin
        preconditions:
          - "Design.status == APPROVED"
        side_effects:
          - "cascade: for every Listing whose design_id == this Design.id AND Listing.status IN {DRAFT, PUBLISHED}, set Listing.status = ARCHIVED and refresh Listing.updated_at (Cascade depth 2 — Listing archival)"
          - "cascade: for every Order whose listing_id in the archived listings AND Order.fulfillment_status == PENDING AND Order.payment_status IN {DRAFT, AUTHORIZED}, transition Order.fulfillment_status -> CANCELLED and (if payment_status == AUTHORIZED) payment_status -> VOIDED (Cascade depth 3 — Order cancellation)"
        note: "Rule 4 depth-3 cascade chain (transitive_cascade instance A)"

  - entity: Order
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /pod/orders/{id}/authorize (payment dimension)"
        actor: system
        preconditions:
          - "Order.payment_status == DRAFT"
          - "Listing.status == PUBLISHED"
          - "Variant.active == true"
        side_effects:
          - "compute Order.gross_amount_cents via listing_price calc"
          - "Order.updated_at refreshed"

      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /pod/orders/{id}/capture (payment dimension)"
        actor: system
        preconditions:
          - "Order.payment_status == AUTHORIZED"
          - "Order.fulfillment_status IN {PENDING, ROUTED}"
        side_effects:
          - "Order.updated_at refreshed"
          - "the routing selector fires if fulfillment_status == PENDING (see PENDING->ROUTED below)"

      - from: CAPTURED
        to: REFUND_PARTIAL
        trigger: "POST /pod/orders/{id}/refund (partial)"
        actor: PlatformAdmin
        preconditions:
          - "Order.payment_status == CAPTURED"
          - "refund_amount_cents > 0 AND refund_amount_cents < Order.gross_amount_cents"
        side_effects:
          - "Order.updated_at refreshed"
          - "recompute Creator.payout_wallet_cents to reflect reduced net margin"

      - from: CAPTURED
        to: REFUND_FULL
        trigger: "POST /pod/orders/{id}/refund (full)"
        actor: PlatformAdmin
        preconditions:
          - "Order.payment_status == CAPTURED"
          - "refund_amount_cents == Order.gross_amount_cents"
        side_effects:
          - "Order.updated_at refreshed"
          - "recompute Creator.payout_wallet_cents (zero out this order's contribution)"
          - "if Order.fulfillment_status IN {PENDING, ROUTED} then transition fulfillment_status -> CANCELLED (parallel-dimension guarded transition)"
          - "if fulfillment_status was ROUTED at refund time, decrement FulfillmentPartner.current_backlog_hours by ceil(item_count * 0.5) (bounded at 0) — Rule 9 compensating action, releases the routed capacity"

      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /pod/orders/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "Order.payment_status == AUTHORIZED"
          - "Order.fulfillment_status IN {PENDING, CANCELLED}"
        side_effects:
          - "Order.updated_at refreshed"

      - from: PENDING
        to: ROUTED
        trigger: "POST /pod/orders/{id}/route (fulfillment dimension; system-run at capture)"
        actor: system
        preconditions:
          - "Order.fulfillment_status == PENDING"
          - "Order.payment_status == CAPTURED"
          - "Listing.status == PUBLISHED"
        side_effects:
          - "Order.routed_partner_id assigned via routing selector (see calculations.partner_routing)"
          - "compute Order.shipping_cents from partner + destination"
          - "compute FulfillmentJob.partner_charge_cents"
          - "FulfillmentJob row created (status = QUEUED, reprint_generation = 0)"
          - "FulfillmentPartner.current_backlog_hours increased by ceil(item_count * 0.5)"

      - from: ROUTED
        to: IN_PRINT
        trigger: "POST /pod/orders/{id}/mark-in-print"
        actor: FulfillmentPartner
        preconditions:
          - "Order.fulfillment_status == ROUTED"
          - "linked FulfillmentJob.status == QUEUED"
        side_effects:
          - "linked FulfillmentJob.status -> PRINTING"

      - from: IN_PRINT
        to: SHIPPED
        trigger: "POST /pod/orders/{id}/mark-shipped"
        actor: FulfillmentPartner
        preconditions:
          - "Order.fulfillment_status == IN_PRINT"
          - "linked FulfillmentJob.status == PRINTING"
        side_effects:
          - "linked FulfillmentJob.status -> SHIPPED"
          - "linked FulfillmentJob.shipped_at = clock now"
          - "FulfillmentPartner.current_backlog_hours decreased by ceil(item_count * 0.5) (bounded at 0)"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /pod/orders/{id}/mark-delivered"
        actor: FulfillmentPartner
        preconditions:
          - "Order.fulfillment_status == SHIPPED"
          - "linked FulfillmentJob.status == SHIPPED"
        side_effects:
          - "linked FulfillmentJob.status -> DELIVERED"
          - "recompute Creator.payout_wallet_cents to include this order's net margin (creator earnings recognized only on delivery)"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /pod/orders/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "Order.fulfillment_status == PENDING"
          - "Order.payment_status IN {DRAFT, AUTHORIZED}"
        side_effects:
          - "if Order.payment_status == AUTHORIZED then payment_status -> VOIDED"

  - entity: FulfillmentJob
    initial_state: QUEUED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SHIPPED
        to: FAILED
        trigger: "POST /pod/fulfillment-jobs/{id}/mark-failed"
        actor: FulfillmentPartner
        preconditions:
          - "FulfillmentJob.status == SHIPPED"
        side_effects:
          - "no recompute of Creator.payout_wallet_cents (delivery never happened)"

      - from: FAILED
        to: REPRINT_REQUESTED
        trigger: "POST /pod/fulfillment-jobs/{id}/reprint-requests"
        actor: PlatformAdmin
        preconditions:
          - "FulfillmentJob.status == FAILED"
        side_effects:
          - "ReprintRequest row created (status = OPEN)"

      - from: REPRINT_REQUESTED
        to: QUEUED
        trigger: "POST /pod/reprint-requests/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "FulfillmentJob.status == REPRINT_REQUESTED"
          - "ReprintRequest.status == OPEN"
          - "linked Order.fulfillment_status == SHIPPED"
        side_effects:
          - "ReprintRequest.status -> APPROVED"
          - "FulfillmentJob.reprint_generation incremented by 1"
          - "recompute FulfillmentJob.partner_charge_cents using reprint_generation surcharge"
          - "if ReprintRequest.fault_category == CONSUMER_FAULT then Creator.reprint_strike_count incremented by 1 (Rule 4 cascade depth 2 — creator penalty)"
          - "linked Order.fulfillment_status transitioned SHIPPED -> ROUTED (parallel-dimension retrograde is legal only on reprint approval — Rule 3 cyclic shape); the reprint cycle then re-enters mark-in-print -> mark-shipped -> mark-delivered as if it were a fresh routing"
        note: "Cyclic shape: SHIPPED -> FAILED -> REPRINT_REQUESTED -> QUEUED. Rule 3 non-linear machine instance A."

      - from: REPRINT_REQUESTED
        to: CANCELLED
        trigger: "POST /pod/reprint-requests/{id}/deny"
        actor: PlatformAdmin
        preconditions:
          - "FulfillmentJob.status == REPRINT_REQUESTED"
          - "ReprintRequest.status == OPEN"
        side_effects:
          - "ReprintRequest.status -> DENIED"

  - entity: PayoutCycle
    initial_state: DRAFT
    terminal_states: [RELEASED, RETURNED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /pod/payout-cycles/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "PayoutCycle.status == DRAFT"
          - "linked Creator.verification_status == VERIFIED"
          - "PayoutCycle.gross_earnings_cents > 0"
        side_effects:
          - "compute PayoutCycle.gross_earnings_cents via payout_cycle calc (sum of margin from Order where fulfillment_status == DELIVERED AND delivered_at IN [cycle_start, cycle_end))"
          - "compute PayoutCycle.fee_cents = floor(gross_earnings_cents * Creator.default_payout_fee_bps / 10000)"
          - "compute PayoutCycle.net_paid_cents = gross_earnings_cents - fee_cents"
          - "decrement Creator.payout_wallet_cents by net_paid_cents (Rule 9 invariant: creator_wallet + net_paid_over_time is conserved)"

      - from: RELEASED
        to: RETURNED
        trigger: "POST /pod/payout-cycles/{id}/return"
        actor: PlatformAdmin
        preconditions:
          - "PayoutCycle.status == RELEASED"
          - "clock_now < PayoutCycle.updated_at + 72 hours (bank recall window)"
        side_effects:
          - "restore Creator.payout_wallet_cents by adding back (gross_earnings_cents - fee_cents) — Rule 9 compensating action; the fee is refunded so wallet + external is conserved"

  - entity: Storefront
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: LINKED
        trigger: "POST /pod/storefronts/{id}/link-channel"
        actor: Creator
        preconditions:
          - "Storefront.integration_status == NONE"
          - "Storefront.integration_channel IN {ETSY, SHOPIFY}"
          - "linked Creator.verification_status IN {VERIFIED, PENDING}"
          - "expected_storefront_version matches Storefront.version"
        side_effects:
          - "Storefront.integration_status -> LINKED"
          - "cascade: for every Listing under this Storefront with status == PUBLISHED, emit a ChannelSyncEvent{event_type: LISTING_MIRROR}"

      - from: LINKED
        to: SUSPENDED
        trigger: "POST /pod/storefronts/{id}/suspend-channel"
        actor: PlatformAdmin
        preconditions:
          - "Storefront.integration_status == LINKED"
        side_effects:
          - "for every Order under this Storefront with payment_status == DRAFT, no state change (drafts persist)"

      - from: SUSPENDED
        to: LINKED
        trigger: "POST /pod/storefronts/{id}/resume-channel"
        actor: PlatformAdmin
        preconditions:
          - "Storefront.integration_status == SUSPENDED"
          - "linked Creator.verification_status == VERIFIED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: storefront-link-channel-stale-version
    parent_entity: Storefront
    write_endpoint: "POST /pod/storefronts/{id}/link-channel"
    occ_field: "expected_storefront_version"
    description: |
      Linking an external channel (Etsy/Shopify) to a Storefront whose version
      has advanced since the client last observed it is rejected. A prior
      writer may have already linked (setting integration_channel and
      integration_status = LINKED), which would legitimately supersede this
      request; requiring OCC on the parent's version forces the client to
      re-read and re-submit.
    error_id: ERR_STALE_STOREFRONT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: listing_price
    trigger: "on POST /pod/listings (create), on PUT /pod/storefronts/{id} (markup_bps update), on Order.DRAFT->AUTHORIZED transition"
    algorithm: tiered_pricing
    formula: |
      # Non-linear formula with 3+ inputs; tiered platform fee by category.
      base = Variant.base_cost_cents + Variant.base_cost_delta_cents
      platform_fee_bps = tier_by_category(Product.category)
        # APPAREL = 1500 bps, DRINKWARE = 1200 bps, ACCESSORY = 1000 bps, PRINT = 800 bps
      platform_fee = ceil(base * platform_fee_bps / 10000)
      creator_markup = ceil(base * Storefront.markup_bps / 10000)
      listed_price_cents = base + platform_fee + creator_markup
      # Boundary: for Order.is_sample == true, listed_price_cents = base (no fee, no markup)
    input_set: "Variant, Product, Storefront for the given Listing; on Order transitions, uses the Listing's already-computed listed_price_cents"
    constants:
      APPAREL_FEE_BPS: 1500
      DRINKWARE_FEE_BPS: 1200
      ACCESSORY_FEE_BPS: 1000
      PRINT_FEE_BPS: 800
    precision: "integer cents; rounding: platform_fee and creator_markup each rounded UP (ceil) BEFORE addition — Rule 2 (b) nested rounding"

  - name: partner_routing
    trigger: "on Order.PENDING->ROUTED transition (fired system-side after payment CAPTURED)"
    algorithm: waterfall_allocation
    formula: |
      # Selector policy with tie-break; picks ONE FulfillmentPartner.
      candidates = [ p in FulfillmentPartner
                     where p.status == ACTIVE
                       AND p.country_code == Order.ship_country_code
                       AND p.current_backlog_hours < p.max_backlog_hours ]
      if candidates is empty:
        expand to [ p in FulfillmentPartner
                    where p.status == ACTIVE
                      AND p.current_backlog_hours < p.max_backlog_hours ]  # cross-border fallback
      if candidates is still empty:
        raise ERR_NO_ELIGIBLE_PARTNER  # error surface on empty candidate set (Rule 6 boundary)
      rank by (cost_multiplier_bps ASC, current_backlog_hours ASC, created_at ASC)  # never id
      selected = candidates[0]
      Order.routed_partner_id = selected.id
      Order.shipping_cents = shipping_from(selected, Order.ship_country_code)
      FulfillmentJob.partner_charge_cents = ceil(
        (Variant.base_cost_cents + Variant.base_cost_delta_cents) * Order.item_count
        * selected.cost_multiplier_bps / 10000
      )
    input_set: "FulfillmentPartner rows in ACTIVE status, with country match preferred, backlog < max"
    constants:
      DOMESTIC_SHIPPING_CENTS: 599
      CROSS_BORDER_SHIPPING_CENTS: 1599
    precision: "integer cents; ceil on partner_charge_cents"

  - name: creator_profit
    trigger: "on POST /pod/orders (provisional variant, stores Order.creator_net_cents); on Order.fulfillment_status -> DELIVERED (final variant, OVERWRITES Order.creator_net_cents)"
    algorithm: forward_looking
    formula: |
      # DUAL VARIANT — same inputs, two algorithms, different results.
      # base_per_unit = Variant.base_cost_cents + Variant.base_cost_delta_cents
      # creator_markup_per_unit = ceil(base_per_unit * Storefront.markup_bps / 10000)
      # gross_markup = creator_markup_per_unit * Order.item_count  # rule 2(b): ceil-per-unit THEN sum
      # provisional_partner_absorb = 0
      # final_partner_absorb = (FulfillmentJob.reprint_generation > 0)
      #                          ? (FulfillmentJob.partner_charge_cents - initial_partner_charge_cents)
      #                          : 0
      #   # where initial_partner_charge_cents was locked at PENDING->ROUTED using reprint_generation = 0
      # creator_net_cents (provisional) = gross_markup
      # creator_net_cents (final)       = gross_markup - final_partner_absorb  # PARTNER_FAULT reprints don't reduce creator; CONSUMER_FAULT surcharge is 25% of partner charge charged to creator net
      # Reprint surcharge: on reprint approval, FulfillmentJob.partner_charge_cents = initial_partner_charge_cents + ceil(initial_partner_charge_cents * 0.25 * (reprint_generation)) if fault_category == CONSUMER_FAULT, else unchanged (partner eats it — no surcharge)
      # Order.is_sample == true forces creator_net_cents = 0 (creator pays base cost only, no margin)
      # THE TWO VARIANTS DIVERGE whenever a CONSUMER_FAULT reprint occurred, because the surcharge is subtracted only in the final variant.
    input_set: "Order + linked Listing/Variant/Product/Storefront/FulfillmentJob"
    constants:
      REPRINT_CONSUMER_FAULT_SURCHARGE_PCT: 25
    precision: "integer cents; ceil per line item BEFORE summing across item_count — Rule 2 (b): 'ceil-per-line then sum' NOT 'sum then ceil'"
    variants:
      - name: provisional
        when: "on POST /pod/orders (before delivery)"
        difference: "creator_net_cents = gross_markup, with no partner_absorb term"
      - name: final
        when: "on Order.fulfillment_status -> DELIVERED"
        difference: "creator_net_cents = gross_markup - final_partner_absorb; final_partner_absorb is non-zero only when a CONSUMER_FAULT reprint occurred; the two variants diverge exactly when reprint_generation > 0 with CONSUMER_FAULT"

  - name: creator_reprint_risk_score
    trigger: "on ReprintRequest APPROVED with fault_category == CONSUMER_FAULT; and on ops-run /_ops/decay-strikes"
    algorithm: weighted_scoring
    formula: |
      # Rule 1 second dual-variant on DIFFERENT entity domain (Creator, not Order).
      score = 0
      for each ReprintRequest R where R.status == APPROVED AND R.fault_category == CONSUMER_FAULT AND R.updated_at IN [now-90d, now):
        weight = weight_by_reason(R.reason_code)
          # DAMAGED = 1, WRONG_SIZE = 2, MISPRINT = 0 (partner-fault-ish), OTHER = 1
        score += weight
      Creator.reprint_strike_count = score  # this is a derived aggregate
    input_set: "ReprintRequest rows scoped to a Creator via ReprintRequest.job -> Order -> Listing -> Storefront -> Creator"
    constants:
      DAMAGED_WEIGHT: 1
      WRONG_SIZE_WEIGHT: 2
      MISPRINT_WEIGHT: 0
      OTHER_WEIGHT: 1
      STRIKE_THRESHOLD: 5
    precision: "integer score"
    variants:
      - name: incremental
        when: "on each ReprintRequest.APPROVED transition"
        difference: "only adds the delta for the newly-approved request; assumes stored aggregate is correct"
      - name: full_recompute
        when: "on POST /_ops/decay-strikes (ops-run)"
        difference: "walks the 90-day window fresh, drops requests whose updated_at fell outside the window; the two variants diverge when late-arriving retroactive corrections exist that the incremental variant missed"

  - name: payout_cycle
    trigger: "on POST /pod/payout-cycles/{id}/release"
    algorithm: aggregation
    formula: |
      # Circular-looking dependency: gross depends on which orders count, fee depends on gross,
      # net depends on gross - fee. Pinned evaluation order (Rule 2 (c)).
      # STEP 1: gross_earnings_cents = SUM over Order where
      #    Order.storefront_id.creator_id == PayoutCycle.creator_id
      #    AND Order.fulfillment_status == DELIVERED
      #    AND Order.updated_at IN [PayoutCycle.cycle_start, PayoutCycle.cycle_end)  # half-open
      #    AND Order.is_sample == false
      #    OF Order.creator_margin_cents (finalized value from creator_profit final variant)
      # STEP 2: fee_cents = floor(gross_earnings_cents * Creator.default_payout_fee_bps / 10000)
      # STEP 3: net_paid_cents = gross_earnings_cents - fee_cents
      # Rule 9 invariant: Creator.payout_wallet_cents_before - Creator.payout_wallet_cents_after == net_paid_cents (conserved quantity #1 — creator wallet)
    input_set: "Order rows whose fulfillment_status == DELIVERED AND delivered-during-window; is_sample == false excluded"
    constants: {}
    precision: "gross summed exactly; fee floored; boundary is half-open [start, end)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /pod/creators/register"

  - priority: 2
    category: auth
    check: "acting role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id referenced in the path resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} segments"

  - priority: 4
    category: existence
    check: "every FK in request body resolves to an existing entity"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints accepting FK fields in body"

  - priority: 5
    category: state
    check: "target entity is in a state that permits this operation per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "storefront link-channel: integration_status must be NONE (not LINKED)"
    error_id: ERR_STOREFRONT_CHANNEL_ALREADY_LINKED
    http_status: 409
    applies_to: "POST /pod/storefronts/{id}/link-channel"

  - priority: 5
    category: state
    check: "reprint approve: linked Order.fulfillment_status must be SHIPPED"
    error_id: ERR_REPRINT_ORDER_NOT_SHIPPED
    http_status: 422
    applies_to: "POST /pod/reprint-requests/{id}/approve"

  - priority: 5
    category: business_temporal
    check: "payout return: clock_now must be within 72h of PayoutCycle.updated_at at release"
    error_id: ERR_PAYOUT_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /pod/payout-cycles/{id}/return"

  - priority: 6
    category: state
    check: "concurrency: expected_<parent>_version matches parent's current version (OCC)"
    error_id: ERR_STALE_STOREFRONT_VERSION
    http_status: 412
    applies_to: "POST /pod/storefronts/{id}/link-channel"

  - priority: 7
    category: business_safety
    check: "acting Creator is VERIFIED before payout release; UNVERIFIED/PENDING/REJECTED cannot release"
    error_id: ERR_CREATOR_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /pod/payout-cycles/{id}/release"

  - priority: 8
    category: business_safety
    check: "Creator.reprint_strike_count < STRIKE_THRESHOLD (5) before any new Design.approve for that Creator; strikes at or above threshold block approval"
    error_id: ERR_STRIKE_THRESHOLD_EXCEEDED
    http_status: 422
    applies_to: "POST /pod/designs/{id}/approve"

  - priority: 9
    category: business_referential
    check: "Listing under a Storefront may only reference a Design belonging to the same Creator that owns the Storefront"
    error_id: ERR_DESIGN_CREATOR_MISMATCH
    http_status: 422
    applies_to: "POST /pod/listings"

  - priority: 10
    category: business_referential
    check: "Order references a Listing whose Design.status == APPROVED and whose Variant.active == true"
    error_id: ERR_LISTING_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /pod/orders"

  - priority: 11
    category: business_constraint
    check: "creator sample order (is_sample == true) must have item_count in [1, 3] inclusive; strictly > 3 is rejected"
    error_id: ERR_SAMPLE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /pod/orders"

  - priority: 12
    category: business_constraint
    check: "Storefront.markup_bps must be in [0, 10000] inclusive; 10001 or above rejected"
    error_id: ERR_MARKUP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /pod/storefronts, PUT /pod/storefronts/{id}"

  - priority: 13
    category: business_constraint
    check: "Design.file_hash unique per (creator_id, file_hash) pair"
    error_id: ERR_DESIGN_DUPLICATE_HASH
    http_status: 409
    applies_to: "POST /pod/creators/{id}/designs"

  - priority: 14
    category: business_temporal
    check: "PayoutCycle window is half-open [cycle_start, cycle_end); cycle_end - cycle_start must be > 0 hours; overlapping DRAFT cycles for the same Creator are rejected"
    error_id: ERR_PAYOUT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /pod/creators/{id}/payout-cycles"

  - priority: 15
    category: business_temporal
    check: "FulfillmentPartner backlog: candidate must have current_backlog_hours < max_backlog_hours (STRICTLY LESS THAN) to be eligible; equality means excluded"
    error_id: ERR_NO_ELIGIBLE_PARTNER
    http_status: 422
    applies_to: "POST /pod/orders/{id}/route (system-triggered on capture)"

  - priority: 16
    category: business_fiscal
    check: "refund_amount_cents strictly positive and <= Order.gross_amount_cents; zero or negative rejected"
    error_id: ERR_REFUND_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /pod/orders/{id}/refund"

  - priority: 17
    category: business_fiscal
    check: "PayoutCycle.gross_earnings_cents at release time must be strictly greater than zero; zero-margin release rejected"
    error_id: ERR_PAYOUT_ZERO_GROSS
    http_status: 422
    applies_to: "POST /pod/payout-cycles/{id}/release"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:
  # ---- Creator ----
  - method: POST
    path: "/pod/creators/register"
    description: "Register a new Creator (anonymous)."
    roles: [Anonymous]
    code: 201
    input: [email, display_name, payout_country_code]
    output: Creator
    side_effects: ["Creator row created (verification_status = UNVERIFIED, payout_wallet_cents = 0)"]

  - method: GET
    path: "/pod/creators/{id}"
    description: "Read a Creator."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Creator
    side_effects: []

  - method: POST
    path: "/pod/creators/{id}/verify"
    description: "Admin verifies a Creator's KYC."
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: Creator
    side_effects: ["Creator.verification_status -> VERIFIED or REJECTED per outcome"]

  # ---- Storefront ----
  - method: POST
    path: "/pod/storefronts"
    description: "Create a Storefront."
    roles: [Creator]
    code: 201
    input: [creator_id, slug, integration_channel, markup_bps]
    output: Storefront
    side_effects: ["Storefront row created (integration_status = NONE)"]

  - method: GET
    path: "/pod/storefronts/{id}"
    description: "Read a Storefront."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Storefront
    side_effects: []

  - method: GET
    path: "/pod/storefronts"
    description: "List storefronts, optionally filtered by creator_id."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["creator_id?", "limit?", "offset?"]
    output: Storefront[]
    side_effects: []

  - method: PUT
    path: "/pod/storefronts/{id}"
    description: "Update storefront markup (triggers listing_price recompute for all its Listings)."
    roles: [Creator]
    code: 200
    input: [markup_bps]
    output: Storefront
    side_effects:
      - "recompute listed_price_cents for every Listing under this Storefront (Rule 4 cascade depth 2 instance B — pricing propagation)"
      - "increments Storefront.version by 1"

  - method: POST
    path: "/pod/storefronts/{id}/link-channel"
    description: "Link Storefront to Etsy/Shopify (OCC on Storefront.version)."
    roles: [Creator]
    code: 200
    input: [expected_storefront_version]
    output: Storefront
    side_effects:
      - "Storefront.integration_status -> LINKED"
      - "emit ChannelSyncEvent{event_type=LISTING_MIRROR} for every PUBLISHED Listing"
      - "increments Storefront.version by 1"

  - method: POST
    path: "/pod/storefronts/{id}/suspend-channel"
    description: "Admin suspends Storefront's channel."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Storefront
    side_effects: ["Storefront.integration_status -> SUSPENDED", "increments Storefront.version by 1"]

  - method: POST
    path: "/pod/storefronts/{id}/resume-channel"
    description: "Admin resumes Storefront's channel."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Storefront
    side_effects: ["Storefront.integration_status -> LINKED", "increments Storefront.version by 1"]

  # ---- Product / Variant ----
  - method: POST
    path: "/pod/products"
    description: "Admin creates a Product (blank SKU)."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, category, base_cost_cents, dimensions_json]
    output: Product
    side_effects: []

  - method: GET
    path: "/pod/products/{id}"
    description: "Read a Product."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/pod/variants/{id}"
    description: "Read a Variant."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Variant
    side_effects: []

  - method: GET
    path: "/pod/variants"
    description: "List variants, optionally filtered by product_id."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: Variant[]
    side_effects: []

  - method: POST
    path: "/pod/products/{id}/variants"
    description: "Admin creates a Variant under a Product."
    roles: [PlatformAdmin]
    code: 201
    input: [color, size, "base_cost_delta_cents?"]
    output: Variant
    side_effects: []

  # ---- Design ----
  - method: POST
    path: "/pod/creators/{id}/designs"
    description: "Creator uploads a Design."
    roles: [Creator]
    code: 201
    input: [file_hash]
    output: Design
    side_effects: ["Design row created (status = UPLOADED)"]

  - method: GET
    path: "/pod/designs/{id}"
    description: "Read a Design."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Design
    side_effects: []

  - method: GET
    path: "/pod/creators/{id}/designs"
    description: "List a Creator's Designs."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Design[]
    side_effects: []

  - method: POST
    path: "/pod/designs/{id}/mockup"
    description: "Generate mockup for a Design (UPLOADED -> MOCKUP_READY)."
    roles: [Creator]
    code: 200
    input: []
    output: Design
    side_effects: ["Design.mockup_url set", "Design.status -> MOCKUP_READY"]

  - method: POST
    path: "/pod/designs/{id}/approve"
    description: "Admin approves a Design (MOCKUP_READY -> APPROVED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Design
    side_effects: ["Design.status -> APPROVED"]

  - method: POST
    path: "/pod/designs/{id}/reject"
    description: "Admin rejects a Design (MOCKUP_READY -> REJECTED). Cascades to Listing.ARCHIVED, then to Order.CANCELLED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Design
    side_effects:
      - "Design.status -> REJECTED"
      - "every Listing with design_id == this Design AND status IN {DRAFT, PUBLISHED} -> ARCHIVED"
      - "every Order with listing_id in those Listings AND fulfillment_status == PENDING AND payment_status IN {DRAFT, AUTHORIZED} -> fulfillment_status = CANCELLED, payment_status -> VOIDED if AUTHORIZED"

  # ---- Listing ----
  - method: POST
    path: "/pod/listings"
    description: "Creator creates a Listing."
    roles: [Creator]
    code: 201
    input: [storefront_id, design_id, variant_id, title]
    output: Listing
    side_effects:
      - "compute listed_price_cents via listing_price calc"
      - "Listing row created (status = DRAFT)"

  - method: GET
    path: "/pod/listings/{id}"
    description: "Read a Listing."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/pod/listings"
    description: "List Listings, optionally filtered by storefront_id/design_id/variant_id."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["storefront_id?", "design_id?", "variant_id?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/pod/listings/{id}/publish"
    description: "Publish a Listing (DRAFT -> PUBLISHED)."
    roles: [Creator]
    code: 200
    input: []
    output: Listing
    side_effects: ["Listing.status -> PUBLISHED"]

  # ---- Order ----
  - method: POST
    path: "/pod/orders"
    description: "Buyer creates an Order (or Creator creates a sample order with is_sample=true)."
    roles: [Anonymous, Creator]
    code: 201
    input: [storefront_id, listing_id, buyer_email, ship_country_code, item_count, "is_sample?"]
    output: Order
    side_effects:
      - "compute Order.gross_amount_cents (provisional creator_profit variant runs)"
      - "Order row created (payment_status = DRAFT, fulfillment_status = PENDING)"

  - method: GET
    path: "/pod/orders/{id}"
    description: "Read an Order."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/pod/orders"
    description: "List Orders, optionally filtered by storefront_id/listing_id/routed_partner_id."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["storefront_id?", "listing_id?", "routed_partner_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/pod/orders/{id}/authorize"
    description: "Authorize the buyer's payment (DRAFT -> AUTHORIZED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.payment_status -> AUTHORIZED"]

  - method: POST
    path: "/pod/orders/{id}/capture"
    description: "Capture the buyer's payment; system then fires routing selector (AUTHORIZED -> CAPTURED, PENDING -> ROUTED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.payment_status -> CAPTURED"
      - "routing selector runs: Order.fulfillment_status -> ROUTED, routed_partner_id assigned, FulfillmentJob created, shipping_cents computed"
      - "FulfillmentPartner.current_backlog_hours increased"

  - method: POST
    path: "/pod/orders/{id}/refund"
    description: "Refund a captured Order (partial or full)."
    roles: [PlatformAdmin]
    code: 200
    input: [refund_amount_cents]
    output: Order
    side_effects:
      - "Order.payment_status -> REFUND_PARTIAL or REFUND_FULL"
      - "on full refund: if fulfillment_status IN {PENDING, ROUTED} then fulfillment_status -> CANCELLED"
      - "recompute Creator.payout_wallet_cents"

  - method: POST
    path: "/pod/orders/{id}/void"
    description: "Void a not-yet-captured Order (AUTHORIZED -> VOIDED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.payment_status -> VOIDED"]

  - method: POST
    path: "/pod/orders/{id}/cancel"
    description: "Cancel a Pending Order (PENDING -> CANCELLED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.fulfillment_status -> CANCELLED"
      - "if payment_status == AUTHORIZED then payment_status -> VOIDED"

  - method: POST
    path: "/pod/orders/{id}/mark-in-print"
    description: "Partner marks an Order as printing (ROUTED -> IN_PRINT)."
    roles: [FulfillmentPartner]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.fulfillment_status -> IN_PRINT", "FulfillmentJob.status -> PRINTING"]

  - method: POST
    path: "/pod/orders/{id}/mark-shipped"
    description: "Partner marks an Order as shipped (IN_PRINT -> SHIPPED)."
    roles: [FulfillmentPartner]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.fulfillment_status -> SHIPPED"
      - "FulfillmentJob.status -> SHIPPED"
      - "FulfillmentJob.shipped_at = clock now"
      - "FulfillmentPartner.current_backlog_hours decreased"

  - method: POST
    path: "/pod/orders/{id}/mark-delivered"
    description: "Partner marks an Order as delivered (SHIPPED -> DELIVERED)."
    roles: [FulfillmentPartner]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.fulfillment_status -> DELIVERED"
      - "FulfillmentJob.status -> DELIVERED"
      - "recompute Creator.payout_wallet_cents (creator margin recognized on delivery)"

  # ---- FulfillmentJob / ReprintRequest ----
  - method: GET
    path: "/pod/fulfillment-jobs/{id}"
    description: "Read a FulfillmentJob."
    roles: [Creator, PlatformAdmin, FulfillmentPartner]
    code: 200
    input: []
    output: FulfillmentJob
    side_effects: []

  - method: GET
    path: "/pod/fulfillment-jobs"
    description: "List FulfillmentJobs, filtered by order_id or partner_id."
    roles: [Creator, PlatformAdmin, FulfillmentPartner]
    code: 200
    input: ["order_id?", "partner_id?", "limit?", "offset?"]
    output: FulfillmentJob[]
    side_effects: []

  - method: POST
    path: "/pod/fulfillment-jobs/{id}/mark-failed"
    description: "Partner marks a shipped job as failed in transit (SHIPPED -> FAILED)."
    roles: [FulfillmentPartner]
    code: 200
    input: []
    output: FulfillmentJob
    side_effects: ["FulfillmentJob.status -> FAILED"]

  - method: POST
    path: "/pod/fulfillment-jobs/{id}/reprint-requests"
    description: "Admin opens a reprint request against a failed job (FAILED -> REPRINT_REQUESTED)."
    roles: [PlatformAdmin]
    code: 201
    input: [fault_category, reason_code]
    output: ReprintRequest
    side_effects: ["ReprintRequest row created (status = OPEN)", "FulfillmentJob.status -> REPRINT_REQUESTED"]

  - method: GET
    path: "/pod/reprint-requests/{id}"
    description: "Read a ReprintRequest."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: ReprintRequest
    side_effects: []

  - method: GET
    path: "/pod/reprint-requests"
    description: "List ReprintRequests, filtered by job_id."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["job_id?", "limit?", "offset?"]
    output: ReprintRequest[]
    side_effects: []

  - method: POST
    path: "/pod/reprint-requests/{id}/approve"
    description: "Admin approves a reprint (REPRINT_REQUESTED -> QUEUED, cyclic)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReprintRequest
    side_effects:
      - "ReprintRequest.status -> APPROVED"
      - "FulfillmentJob.status -> QUEUED"
      - "FulfillmentJob.reprint_generation += 1"
      - "recompute FulfillmentJob.partner_charge_cents including reprint surcharge"
      - "if fault_category == CONSUMER_FAULT then Creator.reprint_strike_count += 1"
      - "linked Order.fulfillment_status SHIPPED -> IN_PRINT"

  - method: POST
    path: "/pod/reprint-requests/{id}/deny"
    description: "Admin denies a reprint (REPRINT_REQUESTED -> CANCELLED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReprintRequest
    side_effects:
      - "ReprintRequest.status -> DENIED"
      - "FulfillmentJob.status -> CANCELLED"

  # ---- FulfillmentPartner ----
  - method: POST
    path: "/pod/fulfillment-partners"
    description: "Admin registers a print partner."
    roles: [PlatformAdmin]
    code: 201
    input: [name, country_code, cost_multiplier_bps, "max_backlog_hours?"]
    output: FulfillmentPartner
    side_effects: []

  - method: GET
    path: "/pod/fulfillment-partners/{id}"
    description: "Read a partner."
    roles: [PlatformAdmin, FulfillmentPartner]
    code: 200
    input: []
    output: FulfillmentPartner
    side_effects: []

  - method: GET
    path: "/pod/fulfillment-partners"
    description: "List partners, filtered by country_code/status."
    roles: [PlatformAdmin]
    code: 200
    input: ["country_code?", "status?", "limit?", "offset?"]
    output: FulfillmentPartner[]
    side_effects: []

  # ---- PayoutCycle ----
  - method: POST
    path: "/pod/creators/{id}/payout-cycles"
    description: "Create a draft payout cycle for a Creator."
    roles: [PlatformAdmin]
    code: 201
    input: [cycle_start, cycle_end]
    output: PayoutCycle
    side_effects: ["PayoutCycle row created (status = DRAFT)"]

  - method: GET
    path: "/pod/payout-cycles/{id}"
    description: "Read a payout cycle."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: []
    output: PayoutCycle
    side_effects: []

  - method: GET
    path: "/pod/creators/{id}/payout-cycles"
    description: "List a Creator's payout cycles."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PayoutCycle[]
    side_effects: []

  - method: POST
    path: "/pod/payout-cycles/{id}/release"
    description: "Release a payout cycle: compute gross/fee/net, debit Creator.payout_wallet_cents (Rule 9 invariant)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutCycle
    side_effects:
      - "compute PayoutCycle.gross_earnings_cents, fee_cents, net_paid_cents"
      - "PayoutCycle.status -> RELEASED"
      - "Creator.payout_wallet_cents -= net_paid_cents"

  - method: POST
    path: "/pod/payout-cycles/{id}/return"
    description: "Reverse a released payout (within 72h) — Rule 9 compensating action."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutCycle
    side_effects:
      - "PayoutCycle.status -> RETURNED"
      - "Creator.payout_wallet_cents += (gross_earnings_cents - fee_cents)"

  # ---- ChannelSyncEvent (append-only log) ----
  - method: GET
    path: "/pod/storefronts/{id}/channel-sync-events"
    description: "Read the append-only sync log for a storefront."
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ChannelSyncEvent[]
    side_effects: []

  - method: POST
    path: "/pod/storefronts/{id}/ingest-channel-order"
    description: "External channel (Etsy/Shopify) posts an ingested order — server creates a native Order shell and emits ChannelSyncEvent{ORDER_INGEST}."
    roles: [PlatformAdmin]
    code: 201
    input: [channel, external_ref, listing_id, buyer_email, ship_country_code, item_count]
    output: Order
    side_effects:
      - "Order created (payment_status = DRAFT, fulfillment_status = PENDING)"
      - "ChannelSyncEvent{event_type=ORDER_INGEST} emitted"

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the logical clock. Default startup clock: 2026-03-01T00:00:00Z (before any set_current_utc, all timestamps derive from this fixed default; never wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  - method: POST
    path: "/_ops/decay-strikes"
    description: "Test-driving: run the ops-run decay pass over Creator.reprint_strike_count (full_recompute variant of creator_reprint_risk_score)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["Creator.reprint_strike_count re-scored for every Creator by walking last-90-day CONSUMER_FAULT ReprintRequests"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id does not resolve"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "body FK references non-existent entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "state precondition violated"
  - id: ERR_STALE_STOREFRONT_VERSION
    http: 412
    condition: "expected_storefront_version does not match Storefront.version (OCC)"
  - id: ERR_CREATOR_NOT_VERIFIED
    http: 403
    condition: "Creator.verification_status != VERIFIED at payout release"
  - id: ERR_STRIKE_THRESHOLD_EXCEEDED
    http: 422
    condition: "Creator.reprint_strike_count >= STRIKE_THRESHOLD (5) when attempting to approve a new Design"
  - id: ERR_DESIGN_CREATOR_MISMATCH
    http: 422
    condition: "Listing.design_id.creator_id != Listing.storefront_id.creator_id"
  - id: ERR_LISTING_NOT_AVAILABLE
    http: 422
    condition: "Order.listing_id references a Listing whose Design is not APPROVED, or whose Variant is inactive, or whose Listing.status != PUBLISHED"
  - id: ERR_SAMPLE_LIMIT_EXCEEDED
    http: 422
    condition: "is_sample == true AND item_count > 3"
  - id: ERR_MARKUP_OUT_OF_RANGE
    http: 422
    condition: "markup_bps not in [0, 10000]"
  - id: ERR_DESIGN_DUPLICATE_HASH
    http: 409
    condition: "(creator_id, file_hash) collision"
  - id: ERR_PAYOUT_WINDOW_OVERLAP
    http: 422
    condition: "PayoutCycle window overlaps another DRAFT cycle for the same Creator, or window length <= 0"
  - id: ERR_NO_ELIGIBLE_PARTNER
    http: 422
    condition: "routing selector yields empty candidate set even after cross-border fallback"
  - id: ERR_REFUND_AMOUNT_INVALID
    http: 422
    condition: "refund_amount_cents <= 0 or > Order.gross_amount_cents"
  - id: ERR_PAYOUT_ZERO_GROSS
    http: 422
    condition: "gross_earnings_cents == 0 at release"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body — missing required field, wrong type, or unknown enum value"
  - id: ERR_PAYOUT_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "PayoutCycle.return called after 72h of release (bank recall window closed)"
  - id: ERR_REPRINT_ORDER_NOT_SHIPPED
    http: 422
    condition: "attempting to open a reprint against a Job whose linked Order.fulfillment_status is not SHIPPED"
  - id: ERR_STOREFRONT_CHANNEL_ALREADY_LINKED
    http: 409
    condition: "attempting to link a Storefront whose integration_status is already LINKED"

