          - entities.ProductionRun.fields.invoice_status
        distinguishing_aspect: |
          Parallel dimensions on ProductionRun: production_status reaches its
          terminal COMPLETED while invoice_status is still PROVISIONAL and later
          moves to FINAL independently; a cancelled run keeps invoice_status
          NOT_INVOICED forever — the two axes never share a transition.
