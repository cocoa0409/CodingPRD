      - name: staff_member_list_total_count_counts_the_filtered_set_and_an_out_of_range_limit_is_rejected
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /obstetric-units/{unitId}/staff-members]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: |
          §1.0 fixes four pagination fields and this endpoint layers a staff_role filter on top, which
          creates the classic disagreement: with 5 staff members of which 3 are RN_LABOR_DELIVERY, a
          filtered page must report total_count 3 (and has_more computed against 3), not 5 — an
          implementation that counts the table before applying the WHERE clause reports 5 and gets
          has_more wrong on the last page. The out-of-range limits pin §1.0's declared bounds as real
          validation rather than silent clamping: limit 101 and limit 0 must both be 400
          ERR_INVALID_FIELD_VALUE, not "clamp to 100" and not "fall back to the default 10". Finally, a
          nested list under a nonexistent parent must 404 at priority 3, because the tempting
          implementation of a filtered child list — SELECT ... WHERE unit_id = ? — returns an empty page
          with total_count 0 and never notices the parent does not exist.
        test_recipe:
          setup: |
            One unit with exactly 5 staff members inserted in a known order: three RN_LABOR_DELIVERY
            (Ana, Cleo, Dev), one OB_ATTENDING (Ben) and one SURGICAL_TECH (Eli). Ben is created second
            and Eli last, so the RN subset is discontiguous in creation order and offset arithmetic
            performed on the unfiltered list lands on the wrong rows.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Ana Reyes RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_ana: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Ben Okafor MD", staff_role: "OB_ATTENDING", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_ben: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Cleo Marchetti RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_cleo: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Dev Patel RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_dev: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Eli Sandoval ST", staff_role: "SURGICAL_TECH", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
