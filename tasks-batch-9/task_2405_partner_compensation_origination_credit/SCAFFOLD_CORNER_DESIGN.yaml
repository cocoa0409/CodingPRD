          rationale: "The temporal-window claim, including its precedence over the referential check, is asserted by scaffold_difficulty_design instance claim_window_temporal_beats_client_history_referential, which advances the logical clock past claim_deadline_on and expects ERR_CLAIM_WINDOW_CLOSED."

  # =====================================================================
  - section: endpoints
    instances:

      - name: contribution_record_create_read_list_with_no_update_surface
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /comp/contribution-records]
          - endpoints[GET /comp/contribution-records/{id}]
          - endpoints[GET /comp/contribution-records]
          - endpoints[POST /comp/contribution-records/{id}/verify]
        distinguishing_aspect: |
          The CRUD surface is deliberately create-and-read only: a ContributionRecord can be
          created, read by id and listed with filters, but §1.5 declares no PATCH, PUT or
          DELETE for it - the only mutation is the /verify action, so an erroneous hour
          entry is corrected by a compensating row, not by editing history.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE and partner P exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Cru Dread", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
          trigger:
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "FIRM_MANAGEMENT", hours: 40.00, service_period_start: "2026-03-01", service_period_end: "2026-03-31" }
              as: CycleAdmin
              captures: { cr: "$.data.id", crv: "$.data.version" }
            - call: "GET /comp/contribution-records/${cr}"
              payload: {}
              as: CycleAdmin
              captures: { rid: "$.data.id", rk: "$.data.kind", rh: "$.data.hours", rv: "$.data.version" }
            - call: "GET /comp/contribution-records"
              payload: { partner_id: "${pp}", kind: "NON_BILLABLE" }
              as: CycleAdmin
              captures: { lid: "$.data[0].id", lcat: "$.data[0].category" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
              captures: { ver: "$.data.verified", vv: "$.data.version" }
          assert:
            - "${rid} == ${cr}, ${rk} == NON_BILLABLE, ${rh} == 40.00 and ${rv} == ${crv}"
            - "${lid} == ${cr} and ${lcat} == FIRM_MANAGEMENT"
            - "GET /comp/contribution-records with kind BILLABLE returns an empty list"
            - "${ver} == true and ${vv} > ${crv}"
            - "§1.5 declares no PATCH, PUT or DELETE whose path resolves to /comp/contribution-records/${cr}"
            - "Partner.${pp}.non_billable_points == 60.00, i.e. 40.00 hours at the FIRM_MANAGEMENT weight 1.50 under the FORMULA multiplier 1.00"

      - name: matter_reopen_is_allowed_only_from_closed
        claim_type: Conditional action
        grounds:
          - endpoints[POST /comp/matters/{id}/status]
          - state_machines[Matter].transitions[CLOSED->OPEN]
          - errors[ERR_MATTER_NOT_OPEN]
          - entities.Partner.fields.responsible_matter_count
        distinguishing_aspect: |
          The single status endpoint accepts OPEN -> CLOSED -> OPEN but refuses a second
          CLOSED with ERR_MATTER_NOT_OPEN 409, and the responsible_matter_count ledger walks
          1 -> 0 -> 1 with it - so the same endpoint's legality depends entirely on the
          current state rather than on the requested target.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; partner P is billing and responsible attorney of OPEN Matter M, and no award exists in any cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Ree Open", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-RO", client_display_name: "Reopen Realty", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-10", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id" }
          trigger:
            - call: "POST /comp/matters/${m}/status"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { s1: "$.data.state" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { rc1: "$.data.responsible_matter_count" }
            - call: "POST /comp/matters/${m}/status"
              payload: { target_state: "CLOSED" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /comp/matters/${m}/status"
              payload: { target_state: "OPEN" }
              as: CycleAdmin
              captures: { s2: "$.data.state" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { rc2: "$.data.responsible_matter_count" }
          assert:
            - "${s1} == CLOSED and ${rc1} == 0"
            - "${err} == ERR_MATTER_NOT_OPEN with HTTP 409 - the guard reads the current state, not the target"
            - "${s2} == OPEN and ${rc2} == 1"
            - "Matter.${m}.credit_allocations are still 2 ACTIVE rows throughout; closing is not a write-off"
            - "the OPEN -> WRITTEN_OFF edge is still available from the reopened matter"

      - name: peer_review_link_requires_both_endpoints_of_the_association
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /comp/peer-reviews]
          - errors[ERR_PARTNER_NOT_FOUND]
          - endpoints[GET /comp/peer-reviews]
          - validations[priority=55]
        distinguishing_aspect: |
          POST /comp/peer-reviews is a pure association endpoint: both ends must resolve, and
          it is the reviewer end that fails with ERR_PARTNER_NOT_FOUND 404 when unknown -
          then the successful call is visible from both directions, by self_assessment_id and
          by reviewer_partner_id, as the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026, partner PY with a DRAFT assessment, and committee member C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Link Ed", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { py: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Link One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Assessment awaiting reviewers.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${py}"
              captures: { sa: "$.data.id" }
          trigger:
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "44444444-4444-4444-8444-444444444444" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id", r1_state: "$.data.state", r1_comp: "$.data.composite_score" }
            - call: "GET /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}" }
              as: CycleAdmin
              captures: { byassess: "$.data[0].id" }
            - call: "GET /comp/peer-reviews"
              payload: { reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { byreviewer: "$.data[0].id" }
          assert:
            - "${err} == ERR_PARTNER_NOT_FOUND with HTTP 404, and no PeerReview was created"
            - "${r1_state} == ASSIGNED with ${r1_comp} null and every sub-score null"
            - "${byassess} == ${r1} and ${byreviewer} == ${r1} - one row, reachable from both ends"
            - "SelfAssessment.${sa}.scored_review_count == 0, since assignment alone scores nothing"

      - name: action_endpoint_preconditions
        claim_type: Action endpoint
        grounds:
          - "endpoints[POST /comp/credit-claims/{id}/submit]"
          - "endpoints[POST /comp/credit-claims/{id}/adjudicate]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / credit_claim_remand_cycle_bounded_at_max_remands
          rationale: "The action-endpoint pattern - transition fires correctly and its preconditions are enforced - is asserted by scaffold_difficulty_design instance credit_claim_remand_cycle_bounded_at_max_remands, which drives submit, dispute and adjudicate repeatedly and checks each precondition at the boundary."

      - name: computed_read_matches_the_calculation
        claim_type: Computed read
        grounds:
          - "endpoints[GET /comp/matters/{id}]"
          - "calculations.matter_realization_and_profitability"
        excluded_because:
          difficulty_instance: dual_variant_calc / matter_profitability_contribution_vs_fully_loaded_diverge
          rationale: "The derived-data-matches-the-calculation claim on a read endpoint is asserted by scaffold_difficulty_design instance matter_profitability_contribution_vs_fully_loaded_diverge, which reads GET /comp/matters/{id} and pins both profitability indices against pre-computed literals."

  # =====================================================================
  - section: errors
    instances:

      - name: every_not_found_code_is_reachable_with_an_unknown_uuid
        claim_type: Not Found
        grounds:
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_PARTNER_NOT_FOUND]
          - errors[ERR_MATTER_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_RECORD_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_BALLOT_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
          - errors[ERR_PAYMENT_NOT_FOUND]
          - errors[ERR_TRANSITION_NOT_FOUND]
          - validations[priority=50]
        distinguishing_aspect: |
          All twelve not-found codes are distinct and each read endpoint raises its own:
          the same syntactically valid but unknown UUID produces ERR_CYCLE_NOT_FOUND on
          /comp/cycles/{id} and ERR_PAYMENT_NOT_FOUND on /comp/draw-payments/{id}, never a
          shared generic 404 and never ERR_INVALID_REQUEST.
