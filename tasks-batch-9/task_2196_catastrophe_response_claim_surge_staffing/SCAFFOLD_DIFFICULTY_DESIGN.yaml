          assert:
            - "InspectionAssignment.${a_p}.status == SCHEDULED   # flush against the deployment start: inclusive lower bound"
            - "InspectionAssignment.${a_q}.status == SCHEDULED   # exact adjacency on the same adjuster is legal under priority 25"
            - "response.data.error_id == ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT"
            - "response HTTP status == 422"
            - "response.data.error_id != ERR_ASSIGNMENT_WINDOW_CONFLICT   # the requested window overlaps neither existing assignment"
            - "response.data.error_id != ERR_ADJUSTER_AT_CAPACITY   # open_assignment_count 2 < max_open_claims 5"
            - "Claim.${cr}.handling_status == TRIAGED   # no assignment was created"
            - "Claim.${cp}.handling_status == INSPECTION_PENDING"
            - "Claim.${cq}.handling_status == INSPECTION_PENDING"
            - "Claim.${cp}.severity_score == 4.30"
            - "Claim.${cp}.case_reserve == 2000.00"
            - "Adjuster.${adj}.open_assignment_count == 2"
            - "CatastropheEvent.${ev}.case_reserve_total == 6000.00"
            - "GET /inspection-assignments?deployment_id=${dep} returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:
      - name: incurred_dollars_conserved_across_advance_issue_then_void
        grounds:
          - calculations.reserve_conservation_invariant
          - calculations.advance_reserve_movement
          - calculations.advance_payment_amount
          - state_machines.AdvancePayment.ISSUED_to_VOIDED
          - entities.ReserveEntry
        distinguishing_aspect: |
          Conserved quantity #1: incurred DOLLARS (CatastropheEvent.incurred_total, 2dp money). The
          compensating action pair is POST /advance-payments followed by POST /advance-payments/{id}/void.
          incurred_total is bit-for-bit identical before, between and after, while case_reserve and
          paid_amount swing 13500.00 in opposite directions and the append-only ReserveEntry log grows from
          1 row to 3 rows. Nothing is deleted: the REVERSAL row participates in the sum rather than removing
          its target.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-901' in DECLARED: HURRICANE, FL, expected_severity_index 0.2000."
            - "One Claim triaged to STANDARD: reported_loss_amount 60000, one DWELLING line limit 200000 / deductible 5000 / estimated_damage 80000, access ACCESSIBLE."
            - "Severity: base = 100.0*min(1.0, 60000/200000) = 30.00; raw = 30.00*1.15 + 0.0 + 0.0 + 20.0*0.2000 = 34.50 + 4.00 = 38.50 -> STANDARD."
            - "initial_case_reserve: eligible_damage = min(80000,200000)-5000 = 75000.00; basis = max(60000, 75000) = 75000.00; round(75000.00*0.45,2) = 33750.00. ReserveEntry #1 INITIAL_CASE (delta_case_reserve +33750.00, delta_paid 0.00)."
            - "Baseline before issuance: CatastropheEvent.incurred_total 33750.00, Claim.case_reserve 33750.00, Claim.paid_amount 0.00, 1 ReserveEntry row."
            - "advance_cap: line_advance = round(75000.00*0.30,2) = 22500.00; tiered = round(22500.00*0.60,2) = 13500.00; no ADVANCE_PAYMENT_MANDATE bulletin exists so mandate_floor is 0.00 and advance_cap == 13500.00."
            - "Advance issued for the full cap: requested 13500.00 -> amount = min(13500.00, 13500.00) = 13500.00. ReserveEntry #2 PAYMENT (delta_paid +13500.00, delta_case_reserve -13500.00)."
            - "Mid-state: incurred_total still 33750.00 (= 20250.00 + 13500.00), Claim.case_reserve 20250.00, Claim.paid_amount 13500.00, payment_status ADVANCE_ISSUED."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-901", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-07-30T00:00:00.000Z", exposure_count: 1400, avg_insured_value: 240000, expected_severity_index: 0.2000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-9101", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 60000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 200000, deductible_amount: 5000, estimated_damage_amount: 80000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { incurred_before: $.data.incurred_total }
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 13500.00, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { adv: $.data.id, adv_amount: $.data.amount }
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { incurred_mid: $.data.incurred_total }
          trigger:
            - call: "POST /advance-payments/${adv}/void"
              payload: { void_reason: "Coverage question raised by SIU; advance withdrawn pending review" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "response HTTP status == 200"
            - "AdvancePayment.${adv}.status == VOIDED"
            - "AdvancePayment.${adv}.amount == 13500.00"
            - "AdvancePayment.${adv}.voided_at_utc == 2026-08-01T00:00:00.000Z"
            - "${incurred_before} == 33750.00"
            - "${incurred_mid} == 33750.00   # unchanged by issuance: +13500.00 paid, -13500.00 case reserve"
            - "CatastropheEvent.${ev}.incurred_total == 33750.00   # unchanged by the void: conserved quantity #1"
            - "CatastropheEvent.${ev}.case_reserve_total == 33750.00"
            - "CatastropheEvent.${ev}.paid_total == 0.00"
            - "Claim.${cl}.case_reserve == 33750.00   # EXACTLY the pre-issuance value"
            - "Claim.${cl}.paid_amount == 0.00   # EXACTLY the pre-issuance value"
            - "Claim.${cl}.advance_paid_total == 0.00   # VOIDED advances are excluded from the total"
            - "Claim.${cl}.advance_cap == 13500.00   # so the same advance could be reissued in full"
            - "Claim.${cl}.payment_status == NONE   # link 2b of void_advance_chain"
            - "GET /reserve-entries?claim_id=${cl} returns exactly 3 rows with sequence_no 1, 2, 3 and entry_type INITIAL_CASE, PAYMENT, REVERSAL"
            - "the REVERSAL row has delta_paid == -13500.00, delta_case_reserve == +13500.00 and reverses_entry_id == the PAYMENT row's id"
            - "sum over the 3 rows of (delta_case_reserve + delta_paid) == 33750.00, matching CatastropheEvent.${ev}.incurred_total exactly"

      - name: physical_rooms_conserved_across_confirm_then_cancel
        grounds:
          - calculations.housing_room_conservation_invariant
          - state_machines.Deployment.CONFIRMED_to_CANCELLED
          - state_machines.HousingBlock.EXHAUSTED_to_ACTIVE
          - calculations.deployment_cost
        distinguishing_aspect: |
          Conserved quantity #2: physical hotel ROOMS — an integer count, not money, on a different entity
          (HousingBlock) with a different compensating pair (confirm then cancel). rooms_total 4 splits and
          re-splits between rooms_occupied and rooms_available, the block's derived status makes a full
          ACTIVE -> EXHAUSTED -> ACTIVE round trip, and final_settled_cost is forced to 0.00 while
          provisional_cost 1920.00 is retained for audit — so the money ledger is NOT symmetric even though
          the room ledger is.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-902' in DECLARED: FLOOD, LA, posture OPEN (no claims)."
            - "One ACTIVE HousingBlock: rooms_total 4, nightly_rate 130, block 2026-09-01 -> 2026-09-30."
            - "Baseline before any confirm: rooms_occupied 0, rooms_available 4, status ACTIVE."
            - "Adjuster A (STAFF, LA, daily_rate 500, per_diem_rate 70) holds Deployment D1: FIELD, window 2026-09-05 -> 2026-09-08, rooms_reserved 3, CONFIRMED. rooms_occupied 3, rooms_available 1, still ACTIVE."
            - "Adjuster B (STAFF, LA, daily_rate 450, per_diem_rate 60) holds Deployment D2: FIELD, window 2026-09-06 -> 2026-09-09, rooms_reserved 1, CONFIRMED. Nights 09-06 and 09-07 are shared with D1, aggregate 3+1 = 4 == rooms_total, so priority 24 passes at its ceiling; priority 38 passes because rooms_available 1 >= 1. rooms_occupied 4, rooms_available 0, block flips ACTIVE -> EXHAUSTED."
            - "D2 provisional_cost: nights = whole_days(2026-09-06, 2026-09-09) = 3; base_labor = round(450*1.00*3,2) = 1350.00; per_diem_total = round(60*3*1,2) = 180.00; housing_share = round(130*1*3,2) = 390.00; subtotal = 1920.00 < PREMIUM_MID_FLOOR 5000, so TIER_NONE, surge_premium 0.00, total 1920.00."
            - "D2 has no InspectionAssignment at all, so the ERR_ASSIGNMENTS_IN_FLIGHT precondition on cancel is satisfied."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-902", peril_type: "FLOOD", jurisdiction_state: "LA", event_start_utc: "2026-07-29T00:00:00.000Z", exposure_count: 700, avg_insured_value: 155000, expected_severity_index: 0.1100 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /housing-blocks"
              payload: { event_id: "${ev}", hotel_name: "Delta Four Suites", city: "Houma", rooms_total: 4, nightly_rate: 130, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-30T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id }
            - call: "POST /housing-blocks/${hb}/open"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { rooms_available_before: $.data.rooms_available, status_before: $.data.status }
            - call: "POST /adjusters"
              payload: { full_name: "Room A", employment_type: "STAFF", home_state: "LA", licensed_states: ["LA"], license_expiry_utc: "2027-08-31T00:00:00.000Z", max_open_claims: 8, daily_rate: 500, per_diem_rate: 70, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj_a: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Room B", employment_type: "STAFF", home_state: "LA", licensed_states: ["LA"], license_expiry_utc: "2027-08-31T00:00:00.000Z", max_open_claims: 8, daily_rate: 450, per_diem_rate: 60, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj_b: $.data.id }
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "FIELD", window_start_utc: "2026-09-05T00:00:00.000Z", window_end_utc: "2026-09-08T00:00:00.000Z", adjuster_id: "${adj_a}", housing_block_id: "${hb}", rooms_reserved: 3 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { d1: $.data.id }
            - call: "POST /deployments/${d1}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "FIELD", window_start_utc: "2026-09-06T00:00:00.000Z", window_end_utc: "2026-09-09T00:00:00.000Z", adjuster_id: "${adj_b}", housing_block_id: "${hb}", rooms_reserved: 1 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { d2: $.data.id }
            - call: "POST /deployments/${d2}/confirm"
              payload: {}
              as: DeploymentCoordinator
