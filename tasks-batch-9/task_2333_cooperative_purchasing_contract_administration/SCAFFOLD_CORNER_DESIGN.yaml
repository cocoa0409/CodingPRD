        claim_type: Error Triggerable
        grounds:
          - errors.ERR_FEE_LEDGER_INCONSISTENT
          - validations.priority_62
          - calculations.admin_fee_assessment
          - entities.MasterContract.fields.fee_outstanding_cents
          - state_machines.UsageReport.status.ACCEPTED_to_RECONCILED
