        claim_type: immediate
        grounds:
          - "endpoints.\"POST /applications\""
          - "endpoints.\"GET /applications/{id}\""
        distinguishing_aspect: "immediate consistency: an application created by POST is fully readable by GET in the very next request."
        test_recipe:
          setup: ["A company exists."]
          setup_api_calls:
            - call: "POST /production-companies"
              payload: { legal_name: "Imm Co", contact_email: "im@x.test", primary_contact: "LL" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Imm", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_id}"
              as: FilmOfficeCoordinator
              captures: { st: $.data.status }
          assert:
            - "GET returns the just-created application with status == DRAFT and matching id ${app_id}"
