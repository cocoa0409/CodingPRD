              as: ChildFindCoordinator
              captures: { child_b_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "August Child Find Day", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T09:20:00Z", slot_capacity: 1, slot_length_minutes: 20, interpreter_languages: [] }
              as: ChildFindCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "OPEN" }
