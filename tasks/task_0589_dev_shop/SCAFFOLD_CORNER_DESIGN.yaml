scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_client_mints_system_fields_and_returns_201
        claim_type: creation
        grounds: ["entities.Client", "endpoints.POST /clients"]
        distinguishing_aspect: "POST /clients with name/billing_email/country_code returns 201 with a server-minted UUID id (no type prefix), created_at, updated_at and version == 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Acme Corp", billing_email: "ap@acme.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Client.${client_id}.id matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ (bare UUID, no prefix)"
            - "Client.${client_id}.version == 1"
            - "Client.${client_id}.name == Acme Corp"
            - "response envelope has meta.api_request_id, meta.api_request_timestamp, response_type == object"

      - name: engagement_creation_seeds_computed_defaults
        claim_type: computed_fields
        grounds:
          - entities.Engagement.fields.status
          - entities.Engagement.fields.billing_status
          - entities.Engagement.fields.budget_posture
          - entities.Engagement.fields.approved_hours
        distinguishing_aspect: "A freshly created Engagement is status LEAD, billing_status UNBILLED, budget_posture HEALTHY, approved_hours 0, burn_ratio 0, invoiced_amount 0, contract_value null (no SOW yet)."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme Corp", billing_email: "ap@acme.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Acme Portal", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
          assert:
            - "Engagement.${eng_id}.status == LEAD"
            - "Engagement.${eng_id}.billing_status == UNBILLED"
            - "Engagement.${eng_id}.budget_posture == HEALTHY"
            - "Engagement.${eng_id}.approved_hours == 0"
            - "Engagement.${eng_id}.burn_ratio == 0"
            - "Engagement.${eng_id}.invoiced_amount == 0"
            - "Engagement.${eng_id}.contract_value == null"
            - "Engagement.${eng_id}.version == 1"

      - name: get_engagement_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=10]", "errors[ERR_ENGAGEMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /engagements/{id} with a well-formed but unknown UUID returns 404 ERR_ENGAGEMENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /engagements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DeliveryLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_ENGAGEMENT_NOT_FOUND"
            - "response_type == error"

      - name: list_tickets_filtered_by_sprint_with_pagination
        claim_type: listing
        grounds: ["endpoints.GET /tickets", "entities.Ticket.fields.sprint_id"]
        distinguishing_aspect: "GET /tickets?sprint_id=X&limit=2&offset=0 returns exactly 2 of the 3 tickets with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "T&M engagement ACTIVE with one PLANNED sprint holding three TODO tickets."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Listco", billing_email: "ap@listco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Listco Site", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 500, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Ann Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "T1", estimated_hours: 3, assignee_user_id: "eng-001" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "T2", estimated_hours: 4, assignee_user_id: "eng-001" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "T3", estimated_hours: 5, assignee_user_id: "eng-002" }
              as: DeliveryLead
          trigger:
            - call: "GET /tickets"
              payload: { sprint_id: "${sprint_id}", limit: 2, offset: 0 }
              as: DeliveryLead
          assert:
            - "HTTP 200, response_type == array, data has 2 tickets"
            - "meta/pagination total_count == 3"
            - "has_more == true"
            - "Sprint.${sprint_id}.committed_hours == 12   (3 + 4 + 5, no cancelled tickets)"

      - name: create_engagement_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=20]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /engagements without source_channel returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Acme Corp", billing_email: "ap@acme.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Acme Portal" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /engagements?client_id=${client_id} returns 0 engagements"

      - name: time_entry_billable_defaults_to_true_when_omitted
        claim_type: defaults
        grounds: ["entities.TimeEntry.fields.billable", "endpoints.POST /time-entries"]
        distinguishing_aspect: "Omitting `billable` on POST /time-entries yields billable == true, so the entry enters the burn ledger once approved."
        test_recipe:
          setup: ["T&M engagement ACTIVE (rate 200.00, cap 500), ACTIVE sprint, ticket IN_PROGRESS assigned to eng-001."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Defaultco", billing_email: "ap@defaultco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Defaultco App", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 500, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Bea Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Feature A", estimated_hours: 8, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
          trigger:
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-05", hours: 2.0 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
          assert:
            - "TimeEntry.${te_id}.billable == true"
            - "TimeEntry.${te_id}.employee_user_id == eng-001   (system field taken from X-User-ID, not from the body)"
            - "Engagement.${eng_id}.approved_hours == 2.0"
            - "Engagement.${eng_id}.burned_cost == 400.00"

      - name: invalid_enum_source_channel_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=20]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "source_channel = 'COLD_CALL' is not in {REFERRAL, INBOUND, OUTBOUND, PARTNER} and is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Enumco", billing_email: "ap@enumco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Enumco Site", source_channel: "COLD_CALL" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: sprint_referencing_milestone_of_another_engagement_is_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=57]", "errors[ERR_MILESTONE_ENGAGEMENT_MISMATCH]"]
        distinguishing_aspect: "POST /sprints with a milestone_id belonging to a different engagement returns 422 ERR_MILESTONE_ENGAGEMENT_MISMATCH (the FK resolves, but the cross-aggregate ownership check fails)."
        test_recipe:
          setup:
            - "Two ACTIVE FIXED engagements for the same client; engagement B owns milestone MB."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Crossco", billing_email: "ap@crossco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Engagement A", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_a: $.data.id }
            - call: "POST /engagements/${eng_a}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_a}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_a}/sign"
              payload: { signed_by_name: "Cid Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Engagement B", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_b: $.data.id }
            - call: "POST /engagements/${eng_b}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_b}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_b}/sign"
              payload: { signed_by_name: "Cid Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /milestones"
              payload: { engagement_id: "${eng_b}", sequence: 1, title: "B Phase 1", amount: 5000.00, due_date: "2026-06-01" }
              as: DeliveryLead
              captures: { mb_id: $.data.id }
          trigger:
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_a}", name: "A Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18", milestone_id: "${mb_id}" }
              as: DeliveryLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_MILESTONE_ENGAGEMENT_MISMATCH"
            - "GET /sprints?engagement_id=${eng_a} returns 0 sprints"

  # =========================================================================
  - section: state_machines
    instances:
      - name: sign_engagement_while_still_lead_is_invalid_transition
        claim_type: invalid_transition
        grounds: ["state_machines.Engagement.SOW_ISSUED_to_ACTIVE", "validations[priority=44]", "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "POST /engagements/{id}/sign on a LEAD engagement (no SOW issued) returns 409 ERR_INVALID_TRANSITION and leaves status LEAD."
        test_recipe:
          setup: ["One engagement in status LEAD."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Earlyco", billing_email: "ap@earlyco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Earlyco App", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Dex Client" }
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_TRANSITION"
            - "Engagement.${eng_id}.status == LEAD"
            - "Engagement.${eng_id}.signed_at == null"

      - name: deploy_a_deployed_release_a_second_time_is_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Release.ACCEPTED_to_DEPLOYED", "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "DEPLOYED is terminal for Release: a second POST /releases/{id}/deploy returns 409 ERR_INVALID_TRANSITION and does not change release.environment."
        test_recipe:
          setup: ["FIXED engagement ACTIVE, milestone M1, release accepted and already DEPLOYED to production."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Shipco", billing_email: "ap@shipco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Shipco Store", source_channel: "PARTNER" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Eli Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /milestones"
              payload: { engagement_id: "${eng_id}", sequence: 1, title: "Phase 1", amount: 5000.00, due_date: "2026-06-01" }
              as: DeliveryLead
              captures: { m1_id: $.data.id }
            - call: "POST /releases"
              payload: { engagement_id: "${eng_id}", milestone_id: "${m1_id}", version_label: "v1.0.0" }
              as: Engineer
              as_user_id: "eng-001"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/qa-result"
              payload: { outcome: "PASS", defect_count: 0 }
              as: Engineer
              as_user_id: "eng-002"
            - call: "POST /releases/${rel_id}/acceptance"
              payload: { action: "ACCEPT" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /releases/${rel_id}/deploy"
              payload: { environment: "production" }
              as: Engineer
              as_user_id: "eng-001"
          trigger:
            - call: "POST /releases/${rel_id}/deploy"
              payload: { environment: "staging" }
              as: Engineer
              as_user_id: "eng-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_TRANSITION"
            - "Release.${rel_id}.status == DEPLOYED"
            - "Release.${rel_id}.environment == production   (unchanged)"

      - name: release_qa_fail_then_client_reject_then_pass_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Release.BUILDING_to_REWORK
          - state_machines.Release.REWORK_to_QA_PASSED
          - state_machines.Release.QA_PASSED_to_REWORK
          - entities.Release.fields.qa_rounds
        distinguishing_aspect: "Release cycles BUILDING -> REWORK (2 defects) -> QA_PASSED -> REWORK (client reject) -> QA_PASSED, ending with qa_rounds == 3 and defect_count == 0."
        test_recipe:
          setup: ["FIXED engagement ACTIVE, milestone M1, one release in BUILDING."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Cycleco", billing_email: "ap@cycleco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Cycleco Web", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 50000.00, budget_hours_cap: 200, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Fin Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /milestones"
              payload: { engagement_id: "${eng_id}", sequence: 1, title: "Phase 1", amount: 5000.00, due_date: "2026-06-01" }
              as: DeliveryLead
              captures: { m1_id: $.data.id }
            - call: "POST /releases"
              payload: { engagement_id: "${eng_id}", milestone_id: "${m1_id}", version_label: "v0.9.0" }
              as: Engineer
              as_user_id: "eng-001"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /releases/${rel_id}/qa-result"
              payload: { outcome: "FAIL", defect_count: 2 }
              as: Engineer
              as_user_id: "eng-002"
            - call: "POST /releases/${rel_id}/qa-result"
              payload: { outcome: "PASS", defect_count: 0 }
              as: Engineer
              as_user_id: "eng-002"
            - call: "POST /releases/${rel_id}/acceptance"
              payload: { action: "REJECT", note: "Copy is wrong on the pricing page" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /releases/${rel_id}/qa-result"
              payload: { outcome: "PASS", defect_count: 0 }
              as: Engineer
              as_user_id: "eng-002"
          assert:
            - "Release.${rel_id}.status == QA_PASSED"
            - "Release.${rel_id}.qa_rounds == 3"
            - "Release.${rel_id}.defect_count == 0"
            - "Milestone.${m1_id}.status == PLANNED   (a client REJECT never completes the milestone)"
            - "GET /invoices?milestone_id=${m1_id} returns 0 invoices"

      - name: close_engagement_with_an_active_sprint_is_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Engagement.ACTIVE_to_CLOSED", "validations[priority=48]", "errors[ERR_ENGAGEMENT_HAS_ACTIVE_SPRINT]"]
        distinguishing_aspect: "POST /engagements/{id}/close while a sprint of that engagement is ACTIVE returns 409 ERR_ENGAGEMENT_HAS_ACTIVE_SPRINT; after the sprint is CLOSED the same call succeeds."
        test_recipe:
          setup: ["T&M engagement ACTIVE with one ACTIVE sprint."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Closeco", billing_email: "ap@closeco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Closeco App", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 100000.00, budget_hours_cap: 500, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Gia Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
          trigger:
            - call: "POST /engagements/${eng_id}/close"
              payload: {}
              as: DeliveryLead
              captures: { err: $.data.error_id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "CLOSED" }
              as: DeliveryLead
            - call: "POST /engagements/${eng_id}/close"
              payload: {}
              as: DeliveryLead
          assert:
            - "First trigger call: HTTP 409 with error_id == ERR_ENGAGEMENT_HAS_ACTIVE_SPRINT"
            - "Engagement.${eng_id}.status == ACTIVE immediately after the first trigger call"
            - "After the sprint is CLOSED, Engagement.${eng_id}.status == CLOSED"

      - name: sprint_close_cancels_todo_tickets_and_recomputes_committed_hours
        claim_type: side_effect_execution
        grounds: ["state_machines.Sprint.ACTIVE_to_CLOSED", "entities.Sprint.fields.committed_hours", "entities.Ticket.fields.status"]
        distinguishing_aspect: "Closing an ACTIVE sprint cancels every TODO ticket (conditional cascade — the IN_PROGRESS ticket is untouched) and drops committed_hours from 12 to 4."
        test_recipe:
          setup:
            - "T&M engagement ACTIVE, one ACTIVE sprint with ticket A (4h, IN_PROGRESS) and tickets B (3h) and C (5h) still TODO; committed_hours == 12."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Sweepco", billing_email: "ap@sweepco.test", country_code: "US" }
              as: AccountManager
