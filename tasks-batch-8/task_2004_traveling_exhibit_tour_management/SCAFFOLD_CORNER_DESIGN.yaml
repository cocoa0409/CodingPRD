              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 100000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
              captures: { cert_id: $.data.id }
          trigger:
            - call: "GET /tours/${tour_id}/certificates/${cert_id}"
              payload: {}
              as: Insurer
              captures: { status_before: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
