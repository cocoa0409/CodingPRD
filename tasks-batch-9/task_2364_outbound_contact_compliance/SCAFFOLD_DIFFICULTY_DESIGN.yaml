          void_reason: COMPLIANCE_CORRECTION
        as: ComplianceOfficer
        as_user_id: officer-adjudicator
      assert:
      - ContactAttempt.${a1}.outcome == VOIDED with void_reason == COMPLIANCE_CORRECTION and voided_at set
      - Contact.${c1_id}.attempts_charged == 0 and Contact.${c1_id}.attempt_budget_remaining == 3
      - Contact.${c1_id}.attempts_charged + Contact.${c1_id}.attempt_budget_remaining == Contact.${c1_id}.attempt_budget_total == 3 (no drift)
      - Campaign.${camp_id}.live_answer_count_today == 0 and regulatory_abandonment_rate_pct == 0.00 and internal_abandonment_rate_pct == 0.00
      - Campaign.${camp_id}.permitted_attempt_count == 0 and voided_attempt_count == 1
  - name: consent_census_conserved_across_revoke_and_reinstate
    grounds:
    - calculations.consent_census_invariant
    - state_machines.ConsentRecord.ACTIVE_to_REVOKED
    - state_machines.ConsentRecord.REVOKED_to_ACTIVE
    - state_machines.SuppressionEntry.ACTIVE_to_REMOVED
    - entities.Contact.fields.total_consent_count
    distinguishing_aspect: 'A different conserved quantity - the contact''s consent census total (total == active + suspended + revoked + superseded): the revoke cascade and its reinstatement compensation shuffle buckets while total_consent_count stays 1 and the internal suppression it created is withdrawn.'
    test_recipe:
      setup:
      - clock 2026-08-03T00:00:00Z; contact with exactly one ACTIVE VOICE consent (total_consent_count 1)
      - a validated revocation with scope ALL_CHANNELS, so the consent is REVOKED, the contact is SUPPRESSED and an ACTIVE INTERNAL suppression row exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1-voice
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/revocation-requests
        payload:
          contact_id: ${c1_id}
          channel_received: WEB
          method: WEB_PORTAL
          scope: ALL_CHANNELS
          received_note: Opt-out submitted through the portal
        as: ComplianceOfficer
        captures:
          rev_id: $.data.id
      - call: POST /compliance/revocation-requests/${rev_id}/validate
        payload:
          validation_note: Portal identity matched
        as: ComplianceOfficer
        as_user_id: officer-adjudicator
      trigger:
      - call: POST /compliance/consent-records/${cons1_id}/reinstate
        payload:
          reinstatement_note: Consumer re-opted in by paper form
        as: ComplianceOfficer
        as_user_id: officer-adjudicator
      assert:
      - ConsentRecord.${cons1_id}.status == ACTIVE with revoked_at == null and reinstatement_count == 1
      - Contact.${c1_id}.total_consent_count == 1 (unchanged by the revoke/reinstate round trip)
      - Contact.${c1_id}.active_consent_count == 1, suspended_consent_count == 0, revoked_consent_count == 0, superseded_consent_count == 0
      - Contact.${c1_id}.total_consent_count == Contact.${c1_id}.active_consent_count + suspended_consent_count + revoked_consent_count + superseded_consent_count
      - Contact.${c1_id}.internal_dnc_status == CLEAR
      - GET /compliance/suppression-entries?list_type=INTERNAL&phone_number=+14155550101&status=ACTIVE returns total_count == 0, and the same query with status=REMOVED returns total_count == 1 with removal_reason == CONSENT_REINSTATED
      - RevocationRequest.${rev_id}.intake_status == VALIDATED (the compensation does not rewrite the revocation record)
