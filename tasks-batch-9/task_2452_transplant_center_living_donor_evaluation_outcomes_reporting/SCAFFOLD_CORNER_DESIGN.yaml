  - name: improvement_plan_creation_links_to_its_review_and_bumps_it
    claim_type: cross_reference_link
    grounds:
    - endpoints[POST /improvement-plans]
    - endpoints[GET /outcome-reviews/{id}/improvement-plans]
    - concurrency_rules[improvement-plan-create-stale-review]
    - entities.ImprovementPlan.fields.program_outcome_review_id
    distinguishing_aspect: The write links a child to a parent in another aggregate AND mutates that parent's
      version, so the reverse-lookup read and the parent's OCC token both change in one call.
    test_recipe:
      setup:
      - A FINALIZED review (cohort_size 25, observed 16, expected rate 0.80 -> oe_ratio 0.8000, FLAGGED,
        requires_improvement_plan true) has frozen the program.
      - ${rev_v1} is the review version read immediately after finalization.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Quality Officer One
          staff_role: QUALITY_OFFICER
          npi: '1000000005'
        as: ProgramAdmin
        captures:
          qo_id: $.data.id
      - call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2025-01-01'
          period_end_on: '2025-12-31'
          cohort_size: 25
          observed_survivor_count: 16
        as: QualityOfficer
        as_user_id: ${qo_id}
        captures:
          rev_id: $.data.id
      - call: POST /outcome-reviews/${rev_id}/finalization
        payload: {}
        as: QualityOfficer
        as_user_id: ${qo_id}
      - call: GET /outcome-reviews/${rev_id}
        payload: {}
        as: QualityOfficer
        as_user_id: ${qo_id}
        captures:
          rev_v1: $.data.version
      trigger:
        call: POST /improvement-plans
        payload:
          program_outcome_review_id: ${rev_id}
          expected_review_version: ${rev_v1}
          title: Donor selection tightening
          milestone_count: 3
          target_completion_on: '2027-01-31'
        as: QualityOfficer
        as_user_id: ${qo_id}
      assert:
      - HTTP 201 with program_outcome_review_id == ${rev_id}, status == SUBMITTED and milestone_count
        == 3
      - decision_reason_code, decided_at and closed_at are all null and version == 1
      - GET /outcome-reviews/${rev_id}/improvement-plans returns total_count == 1 with data[0].title ==
        Donor selection tightening
      - ProgramOutcomeReview.${rev_id}.version == ${rev_v1} + 1, so a competing writer holding ${rev_v1}
        is now stale
      - TransplantProgram.${prog_id}.compliance_posture remains FROZEN - filing a plan is not answering
        it
