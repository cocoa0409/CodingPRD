  # ============================================================================
  # SECTION 6 — errors
  # ============================================================================
  - section: errors
    instances:
      - name: every_child_resource_id_that_does_not_resolve_returns_its_own_not_found_error
        claim_type: violation_to_error
        grounds:
          - "§1.6 declares eleven distinct 404 codes, one per §1.1 entity; §1.4 priority 4 existence resolves path and body ids before any state or business rule, so an unknown id must surface the entity-specific code."
        distinguishing_aspect: "Nine different child paths each return their own error_id rather than one shared 404 body, and the OSE-order sweep proves the FK is resolved at priority 4 — before the budget-line OCC token is compared."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One SETUP BudgetLine authorized 1000000 at version 1, whose id and version are the only real references the sweep uses."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_id}", category: "SETUP", authorized_cents: 1000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { bl_setup: "$.data.id", bl_v1: "$.data.version" }
          trigger:
            - call: "GET /pre-opening/programs/99999999-9999-4999-8999-999999999999"
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { e_prog: "$.data.error_id" }
            - call: "GET /pre-opening/permit-applications/99999999-9999-4999-8999-999999999999"
              as: LicensingCoordinator
              as_user_id: "lc-1"
              captures: { e_permit: "$.data.error_id" }
            - call: "GET /pre-opening/system-implementations/99999999-9999-4999-8999-999999999999"
              as: SystemsIntegrator
              as_user_id: "si-1"
              captures: { e_system: "$.data.error_id" }
            - call: "GET /pre-opening/hires/99999999-9999-4999-8999-999999999999"
              as: TalentManager
              as_user_id: "tm-1"
              captures: { e_hire: "$.data.error_id" }
            - call: "GET /pre-opening/ose-orders/99999999-9999-4999-8999-999999999999"
              as: ProcurementManager
              as_user_id: "pm-1"
              captures: { e_order: "$.data.error_id" }
            - call: "GET /pre-opening/punch-list-items/99999999-9999-4999-8999-999999999999"
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { e_punch: "$.data.error_id" }
            - call: "POST /pre-opening/training-sessions/99999999-9999-4999-8999-999999999999/complete"
              payload: {}
              as: TalentManager
              as_user_id: "tm-1"
              captures: { e_session: "$.data.error_id" }
            - call: "POST /pre-opening/reservation-blocks/99999999-9999-4999-8999-999999999999/guarantee"
              payload: {}
              as: CommercialDirector
              as_user_id: "cd-1"
              captures: { e_block: "$.data.error_id" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_id}", budget_line_id: "99999999-9999-4999-8999-999999999999", description: "Orphan order", amount_cents: 1000, pallet_count: 1, delivery_window_start: "2026-09-05", delivery_window_end: "2026-09-15", expected_budget_line_version: "${bl_v1}" }
              as: ProcurementManager
              as_user_id: "pm-1"
              captures: { e_budget: "$.data.error_id" }
          assert:
            - "every trigger response carries the 404 status except the last one, which is 404 as well because the FK is resolved at priority 4"
            - "e_prog == 'ERR_PROGRAM_NOT_FOUND'"
            - "e_permit == 'ERR_PERMIT_APPLICATION_NOT_FOUND'"
            - "e_system == 'ERR_SYSTEM_IMPLEMENTATION_NOT_FOUND'"
            - "e_hire == 'ERR_HIRE_NOT_FOUND'"
            - "e_order == 'ERR_OSE_ORDER_NOT_FOUND'"
            - "e_punch == 'ERR_PUNCH_LIST_ITEM_NOT_FOUND'"
            - "e_session == 'ERR_TRAINING_SESSION_NOT_FOUND'"
            - "e_block == 'ERR_RESERVATION_BLOCK_NOT_FOUND'"
            - "e_budget == 'ERR_BUDGET_LINE_NOT_FOUND'"

      - name: replaying_a_finished_action_is_rejected_with_the_entity_specific_invalid_state_error
        claim_type: violation_to_error
        grounds:
          - "§1.6 declares one 409 ERR_INVALID_<ENTITY>_STATE per stateful entity and §1.2 lists the legal `from:` states for each trigger, so an action whose source state no longer matches must surface that entity's own code rather than a generic conflict."
        distinguishing_aspect: "Three different entities are replayed in one run and each answers with its own 409 code — ERR_INVALID_PERMIT_STATE, ERR_INVALID_HIRE_STATE, ERR_INVALID_PUNCH_ITEM_STATE — not a shared ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
