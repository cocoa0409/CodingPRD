          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL) holds i1 (max_cycle 150, distance 0) and i2 (max_cycle 90, distance 2640 ft), each with an identical BEFORE count recommending 105."
