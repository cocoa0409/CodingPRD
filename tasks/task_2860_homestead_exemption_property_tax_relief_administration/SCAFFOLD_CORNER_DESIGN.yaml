              as_user_id: "admin-01"
          trigger:
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "Parcel.${p1_id}.assessment_cap_pct_bps == 200"
            - "Parcel.${p1_id}.capped_value_cents == 33600000 and assessed_value_cents == 33600000"
            - "Parcel.${p1_id}.taxable_value_cents == 33600000 and exemption_status == UNEXEMPTED"

      - name: capped_value_rounds_half_up_on_a_trailing_half_cent
        claim_type: precision
        grounds:
          - calculations.parcel_value_decomposition
          - entities.Parcel.fields.capped_value_cents
        distinguishing_aspect: "base 20000010 with a 250 bps cap over 2 elapsed years gives the exact product 21000010.5, and the single round_half_up in STEP 1 stores 21000011 — truncation or banker's rounding would store 21000010."
        test_recipe:
          setup:
            - "Empty database; the parcel's market value 25000000 exceeds the capped value so the cap, not the market, sets the assessed basis."
            - "Arithmetic: years_since_base = 2026 - 2024 = 2; 20000010 * (10000 + 250*2)/10000 = 20000010 * 10500/10000 = 21000010.5 -> round_half_up -> 21000011."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /parcels"
              payload: { apn: "P-0011", situs_address_normalized: "1100 HALFCENT WAY NORTHFIELD ST 10011", county_zone: "EAST", tax_year: 2026, base_year: 2024, base_year_value_cents: 20000010, market_value_cents: 25000000, assessment_cap_pct_bps: 250 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p11_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "Parcel.${p11_id}.capped_value_cents == 21000011"
            - "Parcel.${p11_id}.assessed_value_cents == 21000011 (the cap binds below market 25000000)"
            - "Parcel.${p11_id}.taxable_value_cents == 21000011 and exempt_value_cents == 0"

