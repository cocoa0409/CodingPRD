  - section: complexity_layers
    note: >-
      Four declared layers: optimistic_concurrency (two concurrency_rules, one per parent entity), cascading_side_effects, dual_variant_calculation and derived_field_reconciliation. Each concurrency rule gets its own stale-version instance below, keyed to its declared write_endpoint and occ_field.
    instances:
      - name: spend_observation_stale_data_window_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules spend-observation-restatement-stale-window - parent DataWindow, write_endpoint POST /mmm/spend-observations, occ_field expected_data_window_version, error_id ERR_STALE_DATA_WINDOW_VERSION (412)"
          - "concurrency_rules required_when - always on POST /mmm/spend-observations, including the first non-restatement observation for a period"
          - "concurrency_rules version_source DataWindow.version, echoed back as SpendObservation.data_window_version_after"
          - "entities.DataWindow.spend_observation_count - counts only rows whose superseded_by_id IS null"
        distinguishing_aspect: |
          The DataWindow version is the serialization point for the whole observation surface, not just for
          restatements: a token that was current one write ago is 412, an omitted token is 400 at priority
          15, and only the echoed data_window_version_after lets the next caller chain. Because the counter
          is recomputed over live rows, the fourth write (a restatement) bumps the version without moving
          the count - so version and count are independent proofs that the write landed.
          
        test_recipe:
          setup:
            - "Market US_CORE with channels A_SEARCH and B_SOCIAL and an OPEN window W1 [2026-08-03, 2026-08-31) WEEKLY."
            - "The window version is read as ${v0} == 1 before any observation, then one A_SEARCH spend row for 2026-08-03 is filed with that token, which returns data_window_version_after ${v1} == 2."
            - "The clock is at 2026-08-03T00:00:00Z."
            - "${v0} is therefore stale by exactly one write when the trigger begins."
