  # --- Scholarship ---
  - method: POST
    path: "/funds/{fundId}/scholarship-programs"
    description: "Create a scholarship program on a SCHOLARSHIP fund"
    roles: [ProgramOfficer]
    code: 201
    input: [program_name, application_open, application_close, award_amount, max_awards]
    output: ScholarshipProgram
    side_effects: ["status SETUP; committee_size 0; quorum_threshold computed"]

  - method: GET
    path: "/funds/{fundId}/scholarship-programs"
    description: "List programs for a fund"
    roles: [FoundationAdmin, ProgramOfficer, Applicant, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScholarshipProgram[]"
    side_effects: []

  - method: GET
    path: "/programs/{programId}"
    description: "Get program"
    roles: [FoundationAdmin, ProgramOfficer, Applicant, CommitteeMember]
    code: 200
    input: []
    output: ScholarshipProgram
    side_effects: []

  - method: POST
    path: "/programs/{programId}/open"
    description: "Open program for applications"
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: ScholarshipProgram
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/programs/{programId}/close-applications"
    description: "Close application window; applications move UNDER_SCORING"
    roles: [ProgramOfficer]
    code: 200
