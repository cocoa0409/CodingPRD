            - { call: "POST /credit/commitment-letters/${letter}/issue", payload: { expiry_date: "2026-09-01", rate_lock_expires_at: "2026-08-31T23:59:59Z" }, as: CreditAdministrator, as_user_id: "${adm}" }
            - { call: "POST /credit/commitment-letters/${letter}/accept", payload: {}, as: CreditAdministrator, as_user_id: "${adm}" }
