      - name: quarantine_expires_only_after_end_at
        claim_type: valid_transition
        grounds:
          - state_machines.QuarantineOrder.ACTIVE_to_EXPIRED
          - entities.QuarantineOrder.fields.end_at
        distinguishing_aspect: |
          EXPIRED is a strict-greater lazy transition on the closed interval
          end: at clock == end_at (2026-08-15) the order is still ACTIVE and the
          premises still held; the next day the same read materializes EXPIRED
          and restores the premises to MONITORED.
        test_recipe:
          setup:
            - "Premises P under ACTIVE order [2026-08-01, 2026-08-15] issued at default clock"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S21", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-15T00:00:00Z", reason: "TRACE_EXPOSURE" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
