  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: program_patch_occ_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[program-config-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with a superseded expected_program_version → 412 ERR_STALE_VERSION; the observed-current version succeeds and bumps version by 1."
        test_recipe:
          setup: ["program created (version 1)"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "OC1", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /band/programs/${prog}", payload: { expected_program_version: "${v1}", subsidy_pool_cents: 5000 }, as: BandDirector, captures: { v2: $.data.version } }
            - { call: "PATCH /band/programs/${prog}", payload: { expected_program_version: "${v1}", subsidy_pool_cents: 9000 }, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "GET /band/programs/${prog}", payload: {}, as: Any }
          assert:
            - "First patch succeeds: version == ${v1} + 1, subsidy_pool_cents == 5000"
            - "err == ERR_STALE_VERSION (412) for the replayed stale version"
            - "subsidy_pool_cents remains 5000 (loser's write not applied)"
      - name: trip_create_occ_stale_event_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[trip-create-supersede-stale-event]"]
        distinguishing_aspect: "Create-with-supersede: a second trip create carrying the pre-first-create event version is rejected with 412 even though supersede would otherwise be legal."
        test_recipe:
          setup: ["program; event (version captured before any trip)"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "OC2", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, ev_v: $.data.version } }
          trigger:
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${ev_v}", capacity: 5, estimated_cost_cents: 5000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { t1: $.data.id } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${ev_v}", capacity: 6, estimated_cost_cents: 6000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "Trip.${t1} created; Event.${evt}.version advanced by 1"
            - "err == ERR_STALE_VERSION for the replayed stale event version; GET /band/trips?event_id total_count == 1"
      - name: placements_publish_occ_stale_audition_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[placements-publish-supersede-stale-audition]"]
        distinguishing_aspect: "Publish with the audition version observed before finalize-scores (which bumped it) → 412 ERR_STALE_VERSION; republish with current version supersedes prior placements."
        test_recipe:
          setup: ["program; audition with one scored entry; version captured at creation (v0); finalize-scores bumps to v1"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "OC3", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "OC3", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/auditions", payload: { program_id: "${prog}", section: "BRASS", chair_capacity: 1 }, as: BandDirector, captures: { aud: $.data.id, v0: $.data.version } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${stu}" }, as: BandDirector, captures: { ent: $.data.id } }
            - { call: "POST /band/audition-entries/${ent}/scores", payload: { judge_id: "J1", musicianship: 80, marching: 80, leadership: 80 }, as: BandDirector }
            - { call: "POST /band/auditions/${aud}/finalize-scores", payload: {}, as: BandDirector, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /band/auditions/${aud}/placements", payload: { expected_audition_version: "${v0}" }, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "POST /band/auditions/${aud}/placements", payload: { expected_audition_version: "${v1}" }, as: BandDirector }
          assert:
            - "err == ERR_STALE_VERSION for the pre-finalize version"
            - "Publish with ${v1} succeeds: Audition.${aud}.status == PLACEMENTS_PUBLISHED"
      - name: student_balance_reconciles_across_mixed_debits
        claim_type: derived_field_reconciliation
        grounds: [calculations.account_balance_aggregation]
        distinguishing_aspect: "Derived field stays exact through interleaved debits/credits/refund: MANUAL_DEBIT 3000 + PAYMENT 1000 + REFUND-of-payment... net asserted at each step."
        test_recipe:
          setup: ["program; enrolled student"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "DR", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "DR", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
          trigger:
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "MANUAL_DEBIT", amount_cents: 3000 }, as: BoosterTreasurer }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 1000 }, as: BoosterTreasurer, captures: { pay: $.data.id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "REFUND", amount_cents: 400, reference_payment_id: "${pay}" }, as: BoosterTreasurer }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "WAIVER", amount_cents: 500, reference_payment_id: "${pay}" }, as: BoosterTreasurer }
            - { call: "GET /band/students/${stu}", payload: {}, as: Any }
          assert:
            - "Student.${stu}.account_balance_cents == 3000 - 1000 + 400 - 500 == 1900"
            - "Student.${stu}.is_delinquent == false (1900 <= 2500 grace)"

