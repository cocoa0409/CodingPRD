  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_funds_ledger_nets_to_retained_fee
        grounds:
          - calculations.ledger_invariant
          - calculations.refund_amount
          - state_machines.Transfer.PENDING_to_REFUNDED
          - entities.LedgerEntry.fields.amount_minor
        distinguishing_aspect: |
          Conserved quantity = funds (signed send-currency minor units per
          transfer). Forward fund (SENDER_DEBIT -50799, FEE_REVENUE +799) paired
          with the compensating COMPLIANCE_REJECT refund (REFUND_CREDIT +50000,
          FEE_REVERSAL +799) leaves net(transfer) == fee_minor - fee_refunded ==
          799 - 799 == 0. No drift.
        test_recipe:
          setup:
            - "FUNDED+HELD transfer (P=50000, fee=799), OPEN case; reject the case to drive the compensating refund."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sanctions-list"
              payload: { listed_name: "Ivan Petrov", listed_country: "PH", program: "OFAC-SDN", weight_name_bps: 7000, weight_country_bps: 3000 }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Yara Sender", country: "US", date_of_birth: "1981-04-21" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Ivan Petrov", country: "PH", payout_method: "BANK", payout_account_ref: "PH-11" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-11" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /transfers/${transfer_id}/fund"
              payload: {}
              as: RemittanceAgent
            - call: "POST /transfers/${transfer_id}/screen"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /compliance-cases"
              payload: {}
              as: ComplianceOfficer
              captures: { case_id: $.data.0.id, case_v: $.data.0.version }
          trigger:
