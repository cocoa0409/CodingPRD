        claim_type: Segregation of duties
        grounds: ["validations[priority=34]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.Settlement.fields.issued_by_user_id]
        distinguishing_aspect: "The FinanceAdmin recorded in issued_by_user_id (fin-1) is refused the pay step with ERR_SEGREGATION_OF_DUTIES 403; the settlement stays ISSUED and paid_by_user_id stays null."
        test_recipe:
          setup: ["Event 'SoD' driven to ENDED with no paid registrations; its EVENT settlement (total 500) was created and ISSUED by fin-1."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "SoD", timezone: "UTC", starts_at: "2026-11-17T09:00:00Z", ends_at: "2026-11-17T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/start"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/end"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { v1: $.data.version }
            - call: "POST /api/events/${ev_id}/settlements"
              payload: { expected_event_version: "${v1}" }
              as: FinanceAdmin
              as_user_id: "fin-1"
              captures: { st_id: $.data.id }
            - call: "POST /api/settlements/${st_id}/issue"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fin-1"
              captures: { issuer: $.data.issued_by_user_id }
          trigger:
            - call: "POST /api/settlements/${st_id}/pay"
              payload: { paid_amount_cents: 500 }
              as: FinanceAdmin
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${issuer} == fin-1"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"
            - "Settlement.${st_id}.state == ISSUED"
            - "Settlement.${st_id}.paid_by_user_id == null"

      - name: corner_second_finance_admin_can_pay_issued_settlement
