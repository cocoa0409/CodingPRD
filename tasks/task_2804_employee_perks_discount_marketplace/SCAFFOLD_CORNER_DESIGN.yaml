            - "${file_1_status} == RECEIVED once the current version is echoed, and ${file_1_applied} == APPLIED"
            - "${e_stale_2} == ERR_STALE_VERSION with HTTP 412: applying the first file bumped the employer past ${employer_v_read}"
            - "${integration_now} == SYNCED and ${headcount_now} == 1"
            - "${file_2_status} == RECEIVED and ${file_2_records} == 2: the identical payload succeeds on the refreshed version"

      - name: stale_agreement_version_on_the_merchant_counter_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[counter-stale-agreement]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /perks/agreements/{id}/counter]
          - state_machines.PartnerAgreement.status.PROVIDER_PROPOSED_to_MERCHANT_COUNTERED
          - entities.NegotiationRound.fields.round_number
        distinguishing_aspect: |
          The merchant side of the negotiation aggregate is guarded by the same version chain: a
          counter echoing the pre-proposal version returns ERR_STALE_VERSION with HTTP 412 and
          writes no NegotiationRound, so round_number 2 only appears once the merchant re-reads the
          agreement and counters against the version the provider's proposal produced.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno exists and a DRAFT DINING/CA agreement was created (version captured as agreement_v0)."
            - "The provider proposes round 1 against agreement_v0, moving the agreement to PROVIDER_PROPOSED and bumping its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version, agreement_status_0: $.data.status }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500, note: "Opening terms." }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_v1: $.data.version, agreement_status_1: $.data.status, round_count_1: $.data.round_count }
          trigger:
            - call: "POST /perks/agreements/${agreement_id}/counter"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1000, placement_fee_base_cents: 30000, employer_revenue_share_bps: 3000, note: "Built on the pre-proposal read." }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /perks/agreements/${agreement_id}"
              payload: {}
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { status_after_refusal: $.data.status, round_count_after_refusal: $.data.round_count, agreement_v_read: $.data.version, commission_after_refusal: $.data.commission_rate_bps }
            - call: "GET /perks/agreements/${agreement_id}/negotiation-rounds"
              payload: { limit: 10, offset: 0 }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { first_round_number: "$.data[0].round_number", first_round_proposer: "$.data[0].proposer_role" }
            - call: "POST /perks/agreements/${agreement_id}/counter"
              payload: { expected_agreement_version: "${agreement_v_read}", commission_rate_bps: 1000, placement_fee_base_cents: 30000, employer_revenue_share_bps: 3000, note: "Counter on the current version." }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { status_after_counter: $.data.status, round_count_after_counter: $.data.round_count, commission_after_counter: $.data.commission_rate_bps, agreement_v2: $.data.version }
            - call: "GET /perks/agreements/${agreement_id}/negotiation-rounds"
              payload: { limit: 10, offset: 0 }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { second_round_number: "$.data[1].round_number", second_round_proposer: "$.data[1].proposer_role" }
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { accepted_status: $.data.status, accepted_by: $.data.accepted_by_role }
          assert:
            - "${agreement_status_0} == DRAFT and ${agreement_status_1} == PROVIDER_PROPOSED with ${round_count_1} == 1 and ${agreement_v1} == ${agreement_v0} + 1"
            - "${e_stale} == ERR_STALE_VERSION with HTTP 412 for the counter built on ${agreement_v0}"
            - "${status_after_refusal} == PROVIDER_PROPOSED, ${round_count_after_refusal} == 1, ${agreement_v_read} == ${agreement_v1} and ${commission_after_refusal} == 1200: the standing terms were not overwritten"
            - "${first_round_number} == 1 and ${first_round_proposer} == PARTNER_MANAGER, that list reporting meta.total_count == 1: the refused counter wrote no round"
            - "${status_after_counter} == MERCHANT_COUNTERED, ${round_count_after_counter} == 2, ${commission_after_counter} == 1000 and ${agreement_v2} == ${agreement_v_read} + 1"
            - "${second_round_number} == 2 and ${second_round_proposer} == MERCHANT, that list now reporting meta.total_count == 2"
            - "${accepted_status} == ACCEPTED and ${accepted_by} == PARTNER_MANAGER: accepting a merchant counter is the provider's leg"

      - name: propose_must_echo_the_agreement_version_the_proposer_last_read
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[propose-stale-agreement]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_agreement_version_outranks_exhausted_negotiation_round_budget
          rationale: "That §1.8 instance replays a stale expected_agreement_version into POST /perks/agreements/{id}/propose against an agreement whose round budget is also exhausted and asserts ERR_STALE_VERSION with HTTP 412, covering this rule's stale, fresh and precedence behaviour in one place."

      - name: merchant_termination_drives_the_full_five_level_side_effect_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Merchant.status.ACTIVE_to_TERMINATED
          - state_machines.Offer.status.ACTIVE_to_EXPIRED
          - state_machines.PlacementSlot.status.CONFIRMED_to_RELEASED
          - entities.LedgerEntry.fields.entry_type
        excluded_because:
          difficulty_instance: transitive_cascade / merchant_termination_cascades_agreement_offer_slot_and_refunds_placement_fee
          rationale: "That §1.8 instance walks one termination through agreement, offer, placement slot, ledger and the merchant's payable balance, asserting each level's state and derived fields plus the ordering that makes the refund land, which is the whole cascading-side-effects claim."

      - name: both_calculation_variants_produce_their_own_result_from_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.redemption_line_economics
          - calculations.engagement_analytics
          - calculations.fraud_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / percent_versus_fixed_discount_variant_divergence_at_identical_gross
          rationale: "That §1.8 instance drives both discount variants over an identical gross and asserts the divergent discount, commission, share and provider-net figures, and its sibling instance does the same for the EMPLOYER_SCOPE and PARTNER_SCOPE analytics cohorts."

      - name: cumulative_fault_score_threshold_suspends_the_merchant
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.merchant_fulfillment_failure_score
          - errors[ERR_MERCHANT_SUSPENDED]
          - errors[ERR_MERCHANT_SCORE_NOT_DECAYED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / merchant_fault_score_suspension_pauses_offer_and_blocks_resume
          rationale: "That §1.8 instance accumulates fault events to the 40-point suspension floor, asserts the suspension cascade and then shows the reinstatement refusal until the score decays, covering the cumulative threshold and its reset."

      - name: instantaneous_audit_score_threshold_blocks_a_single_verification
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.fraud_risk_score
          - errors[ERR_FRAUD_RISK_BLOCKED]
          - validations[priority=92]
        excluded_because:
          difficulty_instance: boundary_precision_check / audit_risk_score_blocks_at_exactly_seventy_and_passes_at_sixty_nine
          rationale: "That §1.8 instance sits the AUDIT score exactly on the 70-point block threshold and one point below it, which is the instantaneous-threshold boundary claim for this layer."

  - section: consistency model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response_that_changed_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.EligibilityFile.status.VALIDATED_to_APPLIED
          - state_machines.Employer.storefront_status.BRANDED_to_PUBLISHED
          - calculations.employer_eligible_headcount
          - calculations.employer_program_posture
          - entities.Offer.fields.inventory_reserved
        distinguishing_aspect: |
          No read-after-write delay is tolerated anywhere: the apply response itself already reports
          APPLIED with created_membership_count 2 and integration_status SYNCED, the publish response
          already reports program_posture LIVE, and the very next redemption creation succeeds and is
          already counted in the offer's inventory_reserved.
