  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: service_rule_window_end_adjacency_is_conflict
        grounds:
          - entities.ServiceStandardRule.fields.effective_to
          - validations.priority_11_business_temporal
          - errors.ERR_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics — CLOSED-ended windows: rule windows are
          [effective_from, effective_to] with BOTH ends inclusive, so a
          follow-on rule whose effective_from equals the incumbent's
          effective_to is a CONFLICT (end-adjacency is not allowed); only
          effective_from == incumbent.effective_to + 1 day is clean.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Origin LAX, dest JFK (both CONTIGUOUS); rule R1 FIRST_CLASS 2026-01-01 .. 2026-06-30 exists. Facility version observed after R1."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { lax_id: $.data.id, lax_v0: $.data.version }
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "JFK", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "18:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { jfk_id: $.data.id }
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${jfk_id}", mail_class: "FIRST_CLASS", service_days: 3, effective_from: "2026-01-01", effective_to: "2026-06-30", expected_facility_version: "${lax_v0}" }
              as: ServiceStandardsAdmin
            - call: "GET /api/processing-facilities/${lax_id}"
              payload: {}
              as: ServiceStandardsAdmin
              captures: { lax_v1: $.data.version }
          trigger:
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${jfk_id}", mail_class: "FIRST_CLASS", service_days: 2, effective_from: "2026-06-30", expected_facility_version: "${lax_v1}" }
              as: ServiceStandardsAdmin
              captures: { err_adjacent: $.data.error_id }
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${jfk_id}", mail_class: "FIRST_CLASS", service_days: 2, effective_from: "2026-07-01", expected_facility_version: "${lax_v1}" }
              as: ServiceStandardsAdmin
              captures: { rule2_id: $.data.id }
          assert:
            - "the end-adjacent rule (effective_from 2026-06-30 == incumbent effective_to) is rejected 409 with error_id == ERR_WINDOW_OVERLAP — closed-window semantics"
            - "the day-after rule (effective_from 2026-07-01) is accepted 201 as ServiceStandardRule.${rule2_id}"
            - "a query for acceptance_date 2026-06-30 still resolves to the 3-day incumbent (inclusive end), not the new 2-day rule"

      - name: hold_mail_half_open_overlap_on_shared_point
        grounds:
          - state_machines.HoldMail.SCHEDULED_to_ACTIVE
          - validations.priority_11_business_temporal
          - errors.ERR_HOLD_OVERLAP
        distinguishing_aspect: |
          Different resource entity (HoldMail on a DeliveryPoint, not
          ServiceStandardRule on a facility) with DIFFERENT interval
          semantics — half-open [start, end+1): a new hold starting the day
