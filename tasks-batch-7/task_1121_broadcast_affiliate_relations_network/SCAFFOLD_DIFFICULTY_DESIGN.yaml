          - errors[ERR_PREEMPTION_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_safety vs business_fiscal): when Network is in
          SWEEP_LOCKDOWN AND the request would also exceed the 10% preemption
          quota, ERR_NETWORK_LOCKDOWN (priority 5) wins over
          ERR_PREEMPTION_QUOTA_EXCEEDED (priority 12). Distinguishing: safety
          beats fiscal.
