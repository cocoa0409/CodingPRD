          share_units: 1
        as: Anonymous
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_UNAUTHENTICATED and HTTP 401
  - name: tariff_create_by_dispatcher_forbidden
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_FORBIDDEN]
    - roles.AssociationAdmin
    distinguishing_aspect: Dispatcher lacks the AssociationAdmin-exclusive tariff publication operation -> 403.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: Dispatcher
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_FORBIDDEN and HTTP 403
  - name: order_patch_by_other_agent_forbidden
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - entities.VesselOrder.fields.agent_id
    distinguishing_aspect: 'Ownership check precedes the OCC check: a different agent''s PATCH with a correct version is still 403, not 412.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; O1 created by agent-1 (version 1)
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
