    code: 201
    input: [enrollment_id, start_at, end_at, "buffer_window_days?"]
    output: HousingAssignment
    side_effects:
      - "status = SCHEDULED"
      - "housing_facility_id and assigned_tier set by the housing selector"
      - "nightly_rate_cents looked up from the tier rate card"
      - "housing_cost_cents computed"
  - method: GET
    path: "/programs/housing-assignments"
    description: "List housing assignments"
    roles: [Any]
    code: 200
    input: ["enrollment_id?", "housing_facility_id?", "status?", "limit?", "offset?"]
    output: "HousingAssignment[]"
    side_effects: []
  - method: GET
    path: "/programs/housing-assignments/{id}"
    description: "Get a housing assignment"
    roles: [Any]
    code: 200
    input: []
    output: HousingAssignment
    side_effects: []
  - method: PUT
    path: "/programs/housing-assignments/{id}"
    description: "Re-book a scheduled assignment to a different window, re-running capacity and step-down checks"
    roles: [HousingCoordinator]
    code: 200
    input: ["start_at?", "end_at?"]
    output: HousingAssignment
    side_effects:
      - "window replaced and housing_cost_cents recomputed"
      - "capacity and immunosuppression gates re-run"
      - "increments Enrollment.version by 1"
  - method: POST
    path: "/programs/housing-assignments/{id}/activate"
    description: "Activate a scheduled occupancy"
    roles: [HousingCoordinator]
    code: 200
    input: []
    output: HousingAssignment
    side_effects:
      - "status -> ACTIVE"
      - "HousingFacility.active_beds_committed recomputed from assignments covering each instant of the window"
      - "tier buffer rule applied against both window endpoints"
  - method: POST
    path: "/programs/housing-assignments/{id}/vacate"
    description: "Vacate an active occupancy"
    roles: [HousingCoordinator]
    code: 200
    input: [vacated_reason]
    output: HousingAssignment
    side_effects:
      - "status -> VACATED"
      - "HousingFacility.active_beds_committed recomputed from the remaining SCHEDULED and ACTIVE assignments"
      - "the enrollment's sibling session counter resets"
      - "for TRANSFERRED_AFFILIATE the affiliate coordination workflow is bookmarked"
  - method: POST
    path: "/programs/housing-assignments/{id}/cancel"
    description: "Cancel a scheduled occupancy"
    roles: [HousingCoordinator]
    code: 200
    input: []
    output: HousingAssignment
    side_effects: ["status -> CANCELLED"]

  # --- Enrollments -------------------------------------------------------------
  - method: GET
    path: "/programs/enrollments"
    description: "List enrollments. With no enrollment_status filter every enrollment is returned except those in WITHDRAWN status; an explicit enrollment_status=WITHDRAWN filter is the only way to surface withdrawn rows."
    roles: [Any]
    code: 200
    input: ["referral_id?", "protocol_id?", "enrollment_status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
    side_effects: []
  - method: GET
    path: "/programs/enrollments/{id}"
    description: "Get an enrollment"
    roles: [Any]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/programs/enrollments/{id}/sign-consent"
    description: "Record guardian consent and, where required, the child's own assent"
    roles: [IntakeCoordinator]
    code: 200
    input: [consent_signer, guardian_consent_signature_code, "child_assent_signature_code?"]
    output: Enrollment
    side_effects:
      - "guardian_consent_signed_at stamped"
      - "assent_state -> OBTAINED when the child's signature code is supplied, else unchanged"
      - "status -> ENROLLED when consent_signer matches the required signer and assent is not PENDING"
      - "ClinicalProtocol.enrolled_count += 1"
      - "protocol reservations released and is_budget_saturated recomputed"
      - "increments ClinicalProtocol.version by 1"
  - method: POST
    path: "/programs/enrollments/{id}/record-arm-assent"
    description: "Record the child's own assent as the deciding signature, used when the enrollment is otherwise blocked"
    roles: [IRBReviewer]
    code: 200
    input: [child_assent_signature_code]
    output: Enrollment
    side_effects: ["assent_state -> OBTAINED", "child_assent_signed_at stamped", "increments Enrollment.version by 1"]
  - method: POST
    path: "/programs/enrollments/{id}/start-treatment"
    description: "Begin active treatment for an enrolled patient"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ACTIVE_TREATMENT", "earliest scheduled milestone becomes DUE", "increments Enrollment.version by 1"]
  - method: POST
    path: "/programs/enrollments/{id}/hiatus"
    description: "Pause treatment for an affiliate-based care period"
    roles: [IntakeCoordinator]
    code: 200
    input: [hiatus_reason]
    output: Enrollment
    side_effects:
      - "status -> ON_HIATUS"
      - "active housing assignment -> VACATED with vacated_reason TRANSFERRED_AFFILIATE"
      - "current pledge settles"
  - method: POST
    path: "/programs/enrollments/{id}/resume"
    description: "Resume treatment after a hiatus"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ACTIVE_TREATMENT", "a fresh ACTIVE pledge is created"]
  - method: POST
    path: "/programs/enrollments/{id}/complete-treatment"
    description: "Complete treatment and open survivorship follow-up"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status -> SURVIVORSHIP"
      - "ClinicalProtocol.enrolled_count -= 1"
      - "a SurvivorshipEnrollment is created with status ON_STUDY"
      - "sibling services -> COMPLETED"
      - "current pledge settles"
  - method: POST
    path: "/programs/enrollments/{id}/complete-follow-up"
    description: "Close the survivor's enrollment once every study is graduated"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> COMPLETED"]
  - method: GET
    path: "/programs/enrollments/{id}/pledges"
    description: "List family-support pledges for this enrollment"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "FamilySupportPledge[]"
    side_effects: []
  - method: GET
    path: "/programs/enrollments/{id}/housing-assignments"
    description: "List housing assignments for this enrollment"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "HousingAssignment[]"
    side_effects: []
  - method: GET
    path: "/programs/enrollments/{id}/travel-arrangements"
