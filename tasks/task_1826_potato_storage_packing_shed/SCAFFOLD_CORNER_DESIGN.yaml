  - section: cross_cutting_complexity_layers
    instances:
      - name: c_occ_assessment_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[assessment-create-stale-lot]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on FieldLot.version: a second assessment carrying the pre-first-assessment version is rejected 412; re-reading and resubmitting with the fresh version succeeds."
        test_recipe:
          setup: ["BINNED lot at version 2 (created v1, binned v2)"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AS", grower_code: "G-AS" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed EB" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-01", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 10.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-05", us1_pct: 68.0, us2_pct: 20.0, cull_pct: 12.0, cumulative_shrink_cwt: 12.00, expected_field_lot_version: "${l_v}" }, as: StorageManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { l_v3: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-05", us1_pct: 68.0, us2_pct: 20.0, cull_pct: 12.0, cumulative_shrink_cwt: 12.00, expected_field_lot_version: "${l_v3}" }, as: StorageManager, captures: { ok_id: "$.data.id" } }
          assert:
            - "stale retry: err == ERR_STALE_VERSION (http 412) — ${l_v} was 2 but the lot advanced to 3"
            - "fresh retry with l_v3 == 3 succeeds 201 (ok_id present); GET assessments lists exactly 2 records"

      - name: c_occ_settlement_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[settlement-create-stale-grower]"
          - "errors[ERR_STALE_VERSION]"
          - "state_machines.GrowerSettlement.PROVISIONAL_to_SUPERSEDED"
        distinguishing_aspect: "OCC on Grower.version for the superseding settlement create: a second create with the stale version is 412; with the fresh version it succeeds and the prior PROVISIONAL flips to SUPERSEDED."
        test_recipe:
          setup: ["grower with PROVISIONAL settlement S1 for 2026-storage (grower version advanced to 2 by the create)"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AT", grower_code: "G-AT" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { st1_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { err: "$.data.error_id" } }
            - { call: "GET /potato-shed/growers/${g_id}", payload: {}, as: SettlementClerk, captures: { g_v2: "$.data.version" } }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v2}" }, as: SettlementClerk, captures: { st2_id: "$.data.id" } }
            - { call: "GET /potato-shed/settlements/${st1_id}", payload: {}, as: SettlementClerk, captures: { st1_status: "$.data.status" } }
          assert:
            - "stale second create: err == ERR_STALE_VERSION (grower version is 2, not the captured 1)"
            - "fresh create succeeds; st1_status == SUPERSEDED and S2 is the live PROVISIONAL for the season"

      - name: c_version_increments_on_each_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.FieldLot"
        distinguishing_aspect: "FieldLot.version increments by exactly 1 on every mutation including cascaded ones: create 1 -> assign 2 -> assess 3 -> sprout 4 -> hold 5."
        test_recipe:
          setup: ["grower, shed, bin"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AU", grower_code: "G-AU" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed EC" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { v2: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-01", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 10.00, expected_field_lot_version: "${v2}" }, as: StorageManager }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { v3: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-01T00:00:00Z" }, as: StorageManager, captures: { v4: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager, captures: { v5: "$.data.version" } }
          assert:
            - "v1 == 1, v2 == 2, v3 == 3, v4 == 4, v5 == 5 (each mutation — including the assessment's shrink re-baseline — bumps exactly one)"
            - "updated_at refreshes on every step (monotonically non-decreasing ISO timestamps)"

      - name: c_derived_reserved_reconciles_on_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.FieldLot.fields.reserved_cwt"
          - "state_machines.PackOrder.ALLOCATED_to_CANCELLED"
        distinguishing_aspect: "reserved_cwt is purely derived: 0 -> 100.00 after allocate -> 0 after cancel, while available_cwt never moves (500.00 throughout) — allocation reserves without debiting."
        test_recipe:
          setup: ["lot 500.00 (no assessment, default blend), contract 300.00, order requested 75.00"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AV", grower_code: "G-AV" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed ED" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer AC", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 75.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { res1: "$.data.reserved_cwt", avail1: "$.data.available_cwt" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/cancel", payload: {}, as: SalesManager }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { res2: "$.data.reserved_cwt", avail2: "$.data.available_cwt" } }
          assert:
            - "res1 == 100.00 and avail1 == 500.00 (reservation does not debit available)"
            - "after cancel: res2 == 0 and avail2 == 500.00 (derived field reconciled exactly)"

