  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_charge_adjust_stale_version_rejected
        claim_type: stale_version_conflict
        grounds:
          - "concurrency_rules[charge-adjust-stale-facility]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a first adjustment advances Facility.version to 2, a second posting carrying the pre-mutation version 1 is rejected 412 even though the posting is otherwise semantically valid."
        test_recipe:
          setup: ["Facility (version 1 observed); operator employee"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 100.0, reason: "first posting", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 50.0, reason: "stale posting", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { err: $.data.error_id }
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { tot: $.data.total_charge_lbs, ver: $.data.version }
          assert:
            - "Stale posting: error_id == 'ERR_STALE_VERSION' with http 412"
            - "Facility.total_charge_lbs == 100.0 (only the first posting landed) and version == 2"

      - name: occ_psid_issue_stale_version_rejected
        claim_type: stale_version_conflict
        grounds:
          - "concurrency_rules[psid-issue-stale-system]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Issuing Rev B with the system version observed before Rev A's issue (which bumped it) is rejected 412 — the client must re-read before superseding."
        test_recipe:
          setup: ["Facility + system (version 1 observed); Rev A issued (system version now 2)"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id, sys_v: $.data.version }
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev A", content_uri: "s3://docs/pid-rev-a.pdf", expected_system_version: "${sys_v}" }
              as: PsCoordinator
              captures: { doc1: $.data.id }
          trigger:
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev B", content_uri: "s3://docs/pid-rev-b.pdf", expected_system_version: "${sys_v}" }
              as: PsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_STALE_VERSION' with http 412"
            - "Rev A remains the only CURRENT PID document for the system"

      - name: occ_psid_issue_fresh_version_succeeds
        claim_type: version_increments
        grounds:
          - "concurrency_rules[psid-issue-stale-system]"
          - "state_machines.PsidDocument.CURRENT_to_SUPERSEDED"
        distinguishing_aspect: "Re-reading the system (version 2) and issuing with the fresh expected version succeeds; the supersede side effect retires Rev A and bumps the system to version 3."
        test_recipe:
          setup: ["Facility + system; Rev A CURRENT (system version 2)"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id, sys_v: $.data.version }
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev A", content_uri: "s3://docs/pid-rev-a.pdf", expected_system_version: "${sys_v}" }
              as: PsCoordinator
              captures: { doc1: $.data.id }
            - call: "GET /psm/refrigeration-systems/${sys}"
              as: PsCoordinator
              captures: { sys_v2: $.data.version }
          trigger:
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev B", content_uri: "s3://docs/pid-rev-b.pdf", expected_system_version: "${sys_v2}" }
              as: PsCoordinator
              captures: { doc2: $.data.id, st2: $.data.status }
            - call: "GET /psm/psid-documents/${doc1}"
              as: PsCoordinator
              captures: { st1: $.data.status }
            - call: "GET /psm/refrigeration-systems/${sys}"
              as: PsCoordinator
              captures: { sys_v3: $.data.version }
          assert:
            - "Rev B issued with status == 'CURRENT' (http 201)"
            - "Rev A status == 'SUPERSEDED'"
            - "RefrigerationSystem.version == 3 (increments by 1 per document issue)"

      - name: checkpoint_batch_effects_count
        claim_type: batch_checkpoint
        grounds:
          - "endpoints[POST /psm/checkpoints/run]"
          - "calculations.compliance_posture_score"
        distinguishing_aspect: "One checkpoint run sweeps all four time-driven transitions at once — overdue inspection, contractor expiry, permit expiry, notification overdue — and reports each count in the response."
        test_recipe:
          setup:
            - "Clock 2026-08-01: facility + operator + system; equipment with inspection due 2026-08-05; contractor QUALIFIED until 2026-08-15; ISSUED permit with window 2026-08-10T08:00..12:00; confirmed 120-lb leak (notification PENDING, deadline 2026-08-01T00:15:00Z)"
            - "Clock then advanced to 2026-08-20T00:00:00Z before the run"
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "V-101", equipment_type: "VESSEL", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { eq: $.data.id }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
              captures: { insp: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/contractors/${ctr}/qualify"
              payload: { qualified_until: "2026-08-15T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "weld repair", valid_from: "2026-08-10T08:00:00Z", valid_until: "2026-08-10T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { perm: $.data.id }
            - call: "POST /psm/hot-work-permits/${perm}/issue"
              as: MaintenanceLead
            - call: "POST /psm/leak-events"
              payload: { system_id: "${sys}", estimated_release_lbs: 120.0, source_description: "PRV lift" }
              as: Operator
              as_user_id: "${emp}"
              captures: { leak: $.data.id }
            - call: "POST /psm/leak-events/${leak}/confirm"
              payload: { final_release_lbs: 120.0 }
              as: ComplianceOfficer
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /psm/checkpoints/run"
              as: ComplianceOfficer
              captures: { n_insp: $.data.inspections_marked_overdue, n_ctr: $.data.contractors_expired, n_perm: $.data.permits_expired, n_ntf: $.data.notifications_marked_overdue }
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic: $.data.overdue_inspection_count, score: $.data.posture_score }
          assert:
            - "inspections_marked_overdue == 1, contractors_expired == 1, permits_expired == 1, notifications_marked_overdue == 1"
            - "Facility.overdue_inspection_count == 1 and posture_score == 8 (5 overdue + 3 open leak-incident) -> compliance_posture 'DEGRADED'"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_charge_posting
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.facility_charge_rollup]
        distinguishing_aspect: "No checkpoint or read-repair is needed: the very next GET after a 250.0 ADD shows total_charge_lbs == 250.0 and an incremented version (immediate consistency model)."
        test_recipe:
          setup: ["Facility; operator employee"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 250.0, reason: "initial charge", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { tot: $.data.total_charge_lbs, ver: $.data.version }
          assert:
            - "GET immediately after the write returns total_charge_lbs == 250.0"
            - "Facility.version == 2 (single mutation, incremented exactly once)"
