            - "the bay restore returns status 409 with data.error_id 'ERR_COOLING_BAY_ALREADY_OPERATIONAL' and CoolingBay.${bay}.version is still 1"
            - "the technician reinstate returns status 409 with data.error_id 'ERR_TECHNICIAN_ALREADY_ACTIVE' and Technician.${t_res}.status is still 'ACTIVE' with version 1"
            - "the customer reinstate returns status 409 with data.error_id 'ERR_CUSTOMER_ALREADY_ACTIVE' and Customer.${cust}.version is still 1"
            - "the second cancel returns status 409 with data.error_id 'ERR_ORDER_ALREADY_TERMINAL' and ProductionOrder.${po}.version == ${po_vc}"
            - "the mark-down returns status 200 with status 'DOWN', the next restore returns 200 with status 'OPERATIONAL' and version 3, and the restore after that returns 409 'ERR_OVEN_STATION_ALREADY_OPERATIONAL' with version still 3"

      - name: err_409_parallel_axis_family_build_state_versus_logistics_state_on_one_hull
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNIT_INVALID_BUILD_STATE
          - errors.ERR_UNIT_NOT_REINSPECTABLE
          - errors.ERR_UNIT_INVALID_LOGISTICS_STATE
          - validations.priority_38
          - validations.priority_39
        distinguishing_aspect: |
          One STORED, SELLABLE hull answers THREE different 409 codes depending
          on which axis blocks the call: trim is refused with
          ERR_UNIT_INVALID_BUILD_STATE because SELLABLE is not a trimmable
          build_status, inspect is refused with ERR_UNIT_NOT_REINSPECTABLE
          because SELLABLE IS inspectable and only the logistics axis blocks it,
          and a second store is refused with ERR_UNIT_INVALID_LOGISTICS_STATE —
          then release-storage makes the very same inspect succeed.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls SELLABLE and STORED in Z-A: hull 1 is the anchor at 2.0000 and hull 2 nests at 1.0000, so committed_cube_m3 is 3.0000."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
          trigger:
            - call: "POST /finished-units/${fu1}/trim"
              payload: { trim_waste_kg: 0.200 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v3: $.data.version }
            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_v3}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu1}/release-storage"
              payload: { release_reason: "pulled for a dealer demo" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu1}/release-storage"
              payload: { release_reason: "pulled again" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
          assert:
            - "the trim returns status 409 with data.error_id 'ERR_UNIT_INVALID_BUILD_STATE', because SELLABLE is not one of {DEMOLDED, REWORK}"
            - "the first inspect returns status 409 with data.error_id 'ERR_UNIT_NOT_REINSPECTABLE', a DIFFERENT code on the same row, because build_status SELLABLE is inspectable and only logistics_status STORED blocks it"
            - "the second store returns status 409 with data.error_id 'ERR_UNIT_INVALID_LOGISTICS_STATE' and Warehouse.${wh}.version == ${wh_v3}"
            - "the release-storage returns status 200 with FinishedUnit.${fu1}.logistics_status 'UNALLOCATED', storage_zone_code null, stored_footprint_cube_m3 0.0000 and is_zone_anchor false"
            - "after that release FinishedUnit.${fu2}.is_zone_anchor is true with stored_footprint_cube_m3 2.0000, and Warehouse.${wh}.committed_cube_m3 == 2.0000 with utilization_pct 10.00 and posture 'NORMAL'"
            - "the second release-storage returns status 409 with data.error_id 'ERR_UNIT_INVALID_LOGISTICS_STATE'"
            - "the final inspect returns status 200 with inspection_verdict 'PASS' and build_status 'SELLABLE', proving the earlier refusal came only from the logistics axis"

      # NOTE ON A STRUCTURAL GAP: ERR_FREIGHT_QUOTE_MISSING (§1.4 priority 48)
      # cannot be reached. seal ALWAYS sets quoted_freight_cents, and the only
      # writer that clears it (unseal / cancel / line-removal) simultaneously
      # moves the trailer OUT of SEALED, so priority 41 answers first and no
      # SEALED trailer can ever carry a null quote. This instance therefore
      # asserts the maximal REACHABLE corner around that code rather than
      # claiming an §1.8 instance covers it.
      - name: err_409_shipment_family_empty_underutilized_and_the_null_quote_near_miss
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SHIPMENT_EMPTY
          - errors.ERR_TRAILER_UNDERUTILIZED
          - errors.ERR_SHIPMENT_INVALID_STATE
          - errors.ERR_SHIPMENT_LINE_ALREADY_REMOVED
          - validations.priority_41
          - validations.priority_48
          - validations.priority_49
          - validations.priority_68
        distinguishing_aspect: |
          The trailer's four refusal codes are separated on one shipment, and the
          walk deliberately lands on the state ERR_FREIGHT_QUOTE_MISSING is
          written for — a trailer whose quoted_freight_cents IS null — showing
          that the answer there is ERR_SHIPMENT_INVALID_STATE because unsealing
          both clears the quote and leaves SEALED, and that the next seal
          repopulates the identical quote.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls SELLABLE and STORED in WH-CD."
            - "Shipment SHP-CD-1 out of WH-CD to zone Z2, trailer_cube_capacity_m3 5.0000, trailer_max_payload_kg 200.000, still PLANNED with no lines. One hull nests to 2.0000 of 5.0000 = 40.00 pct, both nest to 3.0000 = exactly 60.00 pct."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - *cd2_shp
          trigger:
            - call: "POST /shipments/${shp}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - *cd2_shpv1
            - *cd2_line1
            - call: "POST /shipments/${shp}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - *cd2_shpv2
            - *cd2_line2
            - call: "POST /shipments/${shp}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { quote1: $.data.quoted_freight_cents }
            - call: "POST /shipments/${shp}/unseal"
              payload: { unseal_reason: "re-checking the hull count" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments/${shp}/depart"
              payload: { departed_at: "2026-08-01T10:35:00Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipment-lines/${sl2}/remove"
              payload: { remove_reason: "hull held back for a dealer demo" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipment-lines/${sl2}/remove"
              payload: { remove_reason: "removing it a second time" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments/${shp}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_v9: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp}", finished_unit_id: "${fu2}", expected_shipment_version: "${shp_v9}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments/${shp}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "the first seal returns status 409 with data.error_id 'ERR_SHIPMENT_EMPTY' and Shipment.${shp}.status is still 'PLANNED'"
            - "after the first line is added Shipment.${shp}.status == 'LOADING' with nested_cube_m3 2.0000 and cube_utilization_pct 40.00"
            - "the second seal returns status 409 with data.error_id 'ERR_TRAILER_UNDERUTILIZED' and quoted_freight_cents is still null"
            - "after the second line is added nested_cube_m3 == 3.0000 and cube_utilization_pct == 60.00 exactly"
            - "the third seal returns status 200 with status 'SEALED', sealed_at '2026-08-01T10:35:00Z' and a non-null quoted_freight_cents ${quote1}"
            - "the unseal returns status 200 with status 'LOADING' and both quoted_freight_cents and sealed_at back to null"
            - "the depart taken while quoted_freight_cents IS null returns status 409 with data.error_id 'ERR_SHIPMENT_INVALID_STATE', not 'ERR_FREIGHT_QUOTE_MISSING' — priority 41 settles it before priority 48 is ever consulted"
            - "the first line removal returns status 200 with ShipmentLine.${sl2}.status 'REMOVED', FinishedUnit.${fu2}.logistics_status back to 'STORED' and Shipment.${shp}.status still 'LOADING'"
            - "the second removal of the same line returns status 409 with data.error_id 'ERR_SHIPMENT_LINE_ALREADY_REMOVED'"
            - "the seal attempted with only one LOADED line returns status 409 with data.error_id 'ERR_TRAILER_UNDERUTILIZED', not 'ERR_SHIPMENT_EMPTY'"
            - "the final seal returns status 200 with quoted_freight_cents == ${quote1} — the reseal recomputes the identical quote, which is why no SEALED trailer can ever carry a null quote"

      - name: err_molding_cycle_create_rejection_ladder_range_then_resource_then_safety
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_QUANTITY
          - errors.ERR_OVEN_STATION_DOWN
          - errors.ERR_COOLING_BAY_DOWN
          - errors.ERR_COOLING_MODE_MISMATCH
          - errors.ERR_SIZE_CLASS_NOT_SUPPORTED
          - errors.ERR_OVEN_START_IN_PAST
          - validations.priority_22
          - validations.priority_32
          - validations.priority_33
          - validations.priority_58
          - validations.priority_59
          - validations.priority_63
        distinguishing_aspect: |
          POST /molding-cycles is the endpoint with the most independent
          rejections, and this instance orders six of them on one order: an
          arm_index above the station's arm_count is 422 ERR_INVALID_QUANTITY, a
          DOWN station is 409 even when the cooling_mode is also wrong (32
          before 58), a mismatched cooling_mode is 422 even when oven_start_at
          is also back-dated (58 before 63), and a MID mould on a COMPACT
          station is 422 ERR_SIZE_CLASS_NOT_SUPPORTED — while the order's
          version is never consumed by a refusal.
