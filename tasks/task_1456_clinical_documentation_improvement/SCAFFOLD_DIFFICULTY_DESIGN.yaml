          proposed_drg_weight: 2.5
          proposed_soi: 3
          proposed_rom: 4
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      trigger:
      - call: POST /api/cdi-queries/${q}/responses
