      - name: releasing_an_already_released_contingency_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=57]
          - endpoints[POST /capital/allocations/{id}/release-contingency]
          - errors.ERR_CONTINGENCY_ALREADY_RELEASED
        distinguishing_aspect: >-
          The contingency reserve is drawn from the SYSTEM withholding on top of the facility's
          allocated_cents, so releasing it raises available_cents from 100000000 to 105000000 without
          touching allocated_cents — and a second release is a V20 state fault, not a no-op.
        test_recipe:
          setup:
            - "Cycle 2027: total 500000000, contingency_pct 0.10, facility_contingency_pct 0.05 -> system_contingency 50000000, distributable 450000000."
            - "One SCORED request of 100000000 at NRH -> allocated 100000000, contingency_reserve 5000000 (drawn 5000000 <= 50000000), available 100000000, unallocated 350000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
