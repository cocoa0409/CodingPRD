scenario: "1008. Pedorthic & Therapeutic Shoe Store: fitment & gait/orthotic, width/size inventory, diabetic/therapeutic shoe (Medicare) fitting & billing, kids measure & growth, return/exchange, special order, loyalty, recall"
domain_name: "pedorthic-therapeutic-shoe-store"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # Peer entities linked by FK; two creation sub-resources (measurements,
  # certifications) hang under Customer but every entity is FK-addressable.
  state_machine_shape: parallel
  # Sale carries parallel payment_status x fulfillment_status axes; MedicareClaim
  # is cyclic (DENIED<->SUBMITTED); ReturnRequest is branching (refund | exchange).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Model name of the shoe / insert."
      - name: brand
        type: string
        source: input
        description: "Manufacturer brand."
      - name: category
        type: enum
        source: input
        description: "Product family."
        constraints: "one of {THERAPEUTIC, DIABETIC, ORTHOTIC, REGULAR, INSERT}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Retail unit price in cents; copied onto each SaleLine at add time."
        constraints: ">= 0"
      - name: medicare_allowable_cents
        type: integer
        source: input
        description: "Medicare fee-schedule allowable in cents for this product's HCPCS code; used as the allowable cap in claim adjudication."
        default: 0
        constraints: ">= 0"
      - name: hcpcs_code
        type: string
        source: input
        description: "HCPCS billing code; A5500 = diabetic shoe (counts toward annual pair limit), A5512/A5513 = insert (counts toward annual insert limit). Null for non-billable products."
        default: null
      - name: is_recalled
        type: boolean
        source: computed
        description: "Computed true iff an ISSUED Recall references this product (matching lot if the recall is lot-scoped)."

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: size
        type: number
        source: input
        description: "US shoe size, half-size granularity (e.g. 9.0, 9.5)."
        constraints: "> 0"
      - name: width
        type: enum
        source: input
        description: "Shoe width."
        constraints: "one of {AAA, AA, A, B, C, D, E, 2E, 4E, 6E}"
      - name: lot_number
        type: string
        source: input
        description: "Manufacturing lot; recall matching key."
      - name: quantity_on_hand
        type: integer
        source: input
        description: "Physical units in stock."
        constraints: ">= 0"
      - name: quantity_reserved
        type: integer
        source: system
        description: "Units reserved by ACTIVE SaleLines not yet fulfilled or cancelled."
        default: 0
        constraints: ">= 0"
      - name: quantity_available
        type: integer
        source: computed
        description: "Computed = quantity_on_hand - quantity_reserved."
      - name: status
        type: enum
        source: system
        description: "Availability lifecycle."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, QUARANTINED, DISCONTINUED}"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer full name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "DOB (date). Drives pediatric classification."
      - name: medicare_beneficiary_id
        type: string
        source: input
        description: "Medicare Beneficiary Identifier; required for any Medicare claim on this customer."
        default: null
      - name: is_pediatric
        type: boolean
        source: computed
        description: "Computed true iff age (current clock date minus date_of_birth) < PEDIATRIC_AGE_THRESHOLD_YEARS (13)."
      - name: loyalty_points_balance
        type: integer
        source: computed
        description: "Computed = SUM(LoyaltyLedgerEntry.points_delta) over this customer's ledger."
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Computed from loyalty_points_balance: BRONZE [0,500), SILVER [500,2000), GOLD [2000,inf)."
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: medicare_deductible_remaining_cents
        type: integer
        source: computed
        description: "Computed = MEDICARE_ANNUAL_DEDUCTIBLE_CENTS (25700) - SUM(deductible_applied_cents) over this customer's PAID MedicareClaims whose calendar_year == current clock year."
      - name: medicare_pairs_claimed_ytd
        type: integer
        source: computed
        description: "Computed = COUNT(MedicareClaim) for this customer with status==PAID, hcpcs_code==A5500, calendar_year==current clock year."
      - name: medicare_inserts_claimed_ytd
        type: integer
        source: computed
        description: "Computed = COUNT(MedicareClaim) for this customer with status==PAID, hcpcs_code in {A5512,A5513}, calendar_year==current clock year."

  - name: FootMeasurement
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: measured_at
        type: datetime
        source: system
        description: "Set to current clock time at creation."
      - name: foot_length_mm_left
        type: number
        source: input
        description: "Left foot length in millimetres."
        constraints: "> 0"
      - name: foot_length_mm_right
        type: number
        source: input
        description: "Right foot length in millimetres."
        constraints: "> 0"
      - name: foot_width_mm_left
        type: number
        source: input
        description: "Left foot width in millimetres."
        constraints: "> 0"
      - name: foot_width_mm_right
        type: number
        source: input
        description: "Right foot width in millimetres."
        constraints: "> 0"
      - name: recommended_mondo_mm
        type: integer
        source: computed
        description: "Computed fitting length: ceil((max(foot_length_mm_left, foot_length_mm_right) + toe_allowance) / MONDO_STEP_MM) * MONDO_STEP_MM, where toe_allowance = PEDIATRIC_TOE_ALLOWANCE_MM (14) if the customer is_pediatric else ADULT_TOE_ALLOWANCE_MM (12)."
      - name: length_change_mm_from_prior
        type: integer
        source: computed
        description: "Computed = max(this.length) - max(length) of the immediately prior FootMeasurement for the same customer ordered by created_at ASC; 0 when this is the first measurement."

  - name: Fitter
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Pedorthist / fitter name."
      - name: credential
        type: string
        source: input
        description: "Professional credential, e.g. C.Ped."
        default: null

  - name: GaitLab
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Gait-analysis room label."
      - name: concurrent_capacity
        type: integer
        source: input
        description: "Max number of GAIT appointments whose intervals may overlap in this lab at any instant."
        constraints: ">= 1"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: fitter_id
        type: string
        source: input
        description: "FK -> Fitter.id; the fitter occupied by this appointment."
      - name: gait_lab_id
        type: string
        source: input
        description: "FK -> GaitLab.id; required when appointment_type==GAIT, else must be null."
        default: null
      - name: appointment_type
        type: enum
        source: input
        description: "Kind of visit."
        constraints: "one of {FITTING, GAIT, DIABETIC_FITTING}"
      - name: start_time
        type: datetime
        source: input
        description: "Interval start (inclusive)."
      - name: end_time
        type: datetime
        source: input
        description: "Interval end (exclusive); must be > start_time."
      - name: status
        type: enum
        source: system
        description: "Appointment lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}"
      - name: recommended_mondo_mm
        type: integer
        source: input
        description: "Fitting recommendation recorded at completion."
        default: null
      - name: recommended_width
        type: enum
        source: input
        description: "Recommended width recorded at completion."
        default: null
        constraints: "one of {AAA, AA, A, B, C, D, E, 2E, 4E, 6E}"
      - name: gait_findings
        type: string
        source: input
        description: "Free-text gait findings recorded at completion."
        default: null
      - name: recommended_orthotic
        type: string
        source: input
        description: "Recommended orthotic recorded at completion."
        default: null

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: fitter_id
        type: string
        source: input
        description: "FK -> Fitter.id; the fitter attributed to this sale."
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; optional originating appointment."
        default: null
      - name: payment_status
        type: enum
        source: system
        description: "Payment axis (evolves independently of fulfillment_status)."
        default: UNPAID
        constraints: "one of {UNPAID, PAID, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment axis (evolves independently of payment_status)."
        default: PENDING
        constraints: "one of {PENDING, FULFILLED, PARTIALLY_RETURNED, RETURNED, CANCELLED}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Computed = SUM(line_total_cents) over ACTIVE SaleLines."
      - name: loyalty_tier_at_fulfill
        type: enum
        source: system
        description: "Customer.loyalty_tier snapshot taken at fulfill; frozen multiplier basis for accrual and reversal."
        default: null
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: loyalty_points_earned
        type: integer
        source: system
        description: "Provisional points minted at fulfill by loyalty_points_accrual; set once at fulfill and not mutated by later returns."
        default: 0

  - name: SaleLine
    parent: Sale
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id"
      - name: inventory_item_id
        type: string
        source: input
        description: "FK -> InventoryItem.id"
      - name: quantity
        type: integer
        source: input
        description: "Units on this line."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: system
        description: "Copied from Product.base_price_cents of the line's inventory item at add time."
      - name: line_total_cents
        type: integer
        source: computed
        description: "Computed = unit_price_cents * quantity."
      - name: requires_medicare
        type: boolean
        source: input
        description: "Marks the line as a Medicare-billable diabetic dispense; forces the recalled/quarantined-item safety check and the completed DIABETIC_FITTING referential check."
        default: false
      - name: status
        type: enum
        source: system
        description: "Line lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETURNED, EXCHANGED}"

  - name: Certification
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: certifying_physician_npi
        type: string
        source: input
        description: "NPI of the certifying MD/DO; must be 10 digits."
      - name: prescribing_practitioner_npi
        type: string
        source: input
        description: "NPI of the prescribing practitioner; must be 10 digits."
      - name: statement_date
        type: datetime
        source: input
        description: "Date the certifying statement was signed (date)."
      - name: in_person_visit_date
        type: datetime
        source: input
        description: "Date of the qualifying in-person visit (date); must be within CERT_VISIT_WINDOW_MONTHS (6 calendar months) before the current clock date at creation."
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle."
        default: COMPLETE
        constraints: "one of {COMPLETE, SUPERSEDED}"

  - name: MedicareClaim
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id; the fulfilled sale being billed."
      - name: certification_id
        type: string
        source: input
        description: "FK -> Certification.id; the certification substantiating this claim."
      - name: hcpcs_code
        type: string
        source: input
        description: "Billed HCPCS code; A5500 counts toward the annual pair limit, A5512/A5513 toward the annual insert limit."
      - name: billed_amount_cents
        type: integer
        source: input
        description: "Amount billed to Medicare in cents."
        constraints: ">= 0"
      - name: calendar_year
        type: integer
        source: system
        description: "Current clock year captured at submit; scopes annual limits and deductible."
        default: null
      - name: allowed_amount_cents
        type: integer
        source: system
        description: "min(billed_amount_cents, Product.medicare_allowable_cents of the sale line's product); set at submit."
        default: null
      - name: provisional_reimbursement_cents
        type: integer
        source: system
        description: "Optimistic estimate set at submit (assumes deductible already met): round_half_up(allowed_amount_cents * (1 - MEDICARE_COINSURANCE_RATE))."
        default: null
      - name: deductible_applied_cents
        type: integer
        source: system
        description: "Final deductible consumed by this claim; set at PAID adjudication = min(allowed_amount_cents, customer deductible remaining at adjudication)."
        default: 0
      - name: medicare_paid_cents
        type: integer
        source: system
        description: "Final Medicare payment; set at PAID adjudication by medicare_final_reimbursement."
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: system
        description: "Final patient responsibility; set at PAID adjudication = deductible_applied_cents + coinsurance."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, PAID, DENIED, VOIDED}"

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id"
      - name: sale_line_id
        type: string
        source: input
        description: "FK -> SaleLine.id; the line being returned/exchanged."
      - name: replacement_inventory_item_id
        type: string
        source: input
        description: "FK -> InventoryItem.id; the swap-in item, set only on the exchange transition."
        default: null
      - name: return_type
        type: enum
        source: input
        description: "RETURN drives refund; EXCHANGE drives a swap."
        constraints: "one of {RETURN, EXCHANGE}"
      - name: reason
        type: string
        source: input
        description: "Free-text reason."
        default: null
      - name: refund_amount_cents
        type: integer
        source: system
        description: "Refund minted on the refund transition = line_total_cents - restocking_fee (see return_refund_amount)."
        default: 0
      - name: restocking_fee_cents
        type: integer
        source: system
        description: "Restocking fee applied on refund; 0 within RETURN_WINDOW_DAYS else round_half_up(line_total_cents * RESTOCKING_FEE_RATE)."
        default: 0
      - name: price_difference_cents
        type: integer
        source: system
        description: "On exchange = replacement Product.base_price_cents - original unit_price_cents (may be negative); set on the exchange transition."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Return lifecycle."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED, REFUNDED, EXCHANGED}"

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the ordered product."
      - name: fulfilled_inventory_item_id
        type: string
        source: input
        description: "FK -> InventoryItem.id; the item created/linked at receive."
        default: null
      - name: requested_size
        type: number
        source: input
        description: "Requested US size."
        constraints: "> 0"
      - name: requested_width
        type: enum
        source: input
        description: "Requested width."
        constraints: "one of {AAA, AA, A, B, C, D, E, 2E, 4E, 6E}"
      - name: deposit_cents
        type: integer
        source: input
        description: "Deposit collected up front; refunded as loyalty credit on cascade cancel."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Special-order lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, ORDERED, RECEIVED, FULFILLED, CANCELLED}"

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the recalled product."
      - name: lot_number
        type: string
        source: input
        description: "If set, only inventory of this lot is affected; if null, all lots of the product are affected."
        default: null
      - name: reason
        type: string
        source: input
        description: "Recall reason."
      - name: status
        type: enum
        source: system
        description: "Recall lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, CLOSED}"

  - name: LoyaltyLedgerEntry
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id; originating sale, null for manual adjustments."
        default: null
      - name: points_delta
        type: integer
        source: input
        description: "Signed point change (positive EARN/ADJUST, negative REVERSAL/REDEEM)."
      - name: reason
        type: enum
        source: input
        description: "Ledger reason."
        constraints: "one of {EARN, REVERSAL, REDEEM, ADJUST}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: Fitter
        preconditions: ["appointment.status == SCHEDULED"]
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Fitter
        preconditions: ["appointment.status in {SCHEDULED, CHECKED_IN}"]
        side_effects: ["record recommended_mondo_mm/recommended_width/gait_findings/recommended_orthotic from body"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Fitter
        preconditions: ["appointment.status in {SCHEDULED, CHECKED_IN}"]
        side_effects: ["record recommendation fields from body"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Fitter | StoreManager | Customer
        preconditions: ["appointment.status in {SCHEDULED, CHECKED_IN}"]
        side_effects: ["frees the fitter and gait-lab interval for future overlap checks"]
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Fitter | StoreManager | Customer
        preconditions: ["appointment.status in {SCHEDULED, CHECKED_IN}"]
        side_effects: ["frees the fitter and gait-lab interval"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Fitter | StoreManager
        preconditions: ["appointment.status in {SCHEDULED, CHECKED_IN}"]
        side_effects: ["frees the fitter and gait-lab interval"]

  - entity: Sale
    initial_state: "PENDING/UNPAID"
    terminal_states: [CANCELLED, RETURNED]
    # Parallel axes: payment_status {UNPAID->PAID->REFUNDED} x
    # fulfillment_status {PENDING->FULFILLED->PARTIALLY_RETURNED->RETURNED; PENDING->CANCELLED}.
    transitions:
      - from: "fulfillment=PENDING"
        to: "fulfillment=FULFILLED"
        trigger: "POST /sales/{id}/fulfill"
        actor: Fitter | StoreManager
        preconditions:
          - "sale.fulfillment_status == PENDING"
          - "sale has >= 1 ACTIVE SaleLine"
          - "every ACTIVE line's InventoryItem.status == AVAILABLE (else ERR_ITEM_QUARANTINED)"
        side_effects:
          - "for each ACTIVE line: InventoryItem.quantity_on_hand -= quantity; InventoryItem.quantity_reserved -= quantity"
          - "snapshot loyalty_tier_at_fulfill = Customer.loyalty_tier"
          - "loyalty_points_earned = loyalty_points_accrual(sale); create LoyaltyLedgerEntry(reason=EARN, points_delta=loyalty_points_earned, sale_id)"
      - from: "fulfillment=PENDING"
        to: "fulfillment=CANCELLED"
        trigger: "POST /sales/{id}/cancel"
        actor: Fitter | StoreManager
        preconditions: ["sale.fulfillment_status == PENDING"]
        side_effects:
          - "for each ACTIVE line: InventoryItem.quantity_reserved -= quantity (release; on_hand unchanged) -> quantity_available restored"
      - from: "payment=UNPAID"
        to: "payment=PAID"
        trigger: "POST /sales/{id}/pay"
        actor: Fitter | StoreManager
        preconditions: ["sale.payment_status == UNPAID", "amount_tendered_cents >= sale.subtotal_cents"]
        side_effects: []
      - from: "fulfillment=FULFILLED"
        to: "fulfillment=PARTIALLY_RETURNED"
        trigger: "system: ReturnRequest.refund when >=1 but not all lines RETURNED"
        actor: system
        preconditions: ["at least one ACTIVE line remains after this line flips to RETURNED"]
        side_effects: ["bubble-up recompute of fulfillment_status (see transitive cascade return_refund_chain)"]
      - from: "fulfillment=PARTIALLY_RETURNED"
        to: "fulfillment=RETURNED"
        trigger: "system: ReturnRequest.refund when the last ACTIVE line flips to RETURNED"
        actor: system
        preconditions: ["no ACTIVE line remains after this line flips to RETURNED"]
        side_effects: ["payment_status PAID -> REFUNDED if sale was PAID"]
      - from: "fulfillment=FULFILLED"
        to: "fulfillment=RETURNED"
        trigger: "system: ReturnRequest.refund when the sole ACTIVE line flips to RETURNED"
        actor: system
        preconditions: ["no ACTIVE line remains after this line flips to RETURNED"]
        side_effects: ["payment_status PAID -> REFUNDED if sale was PAID"]

  - entity: MedicareClaim
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /medicare-claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DRAFT"
          - "Sale.fulfillment_status in {FULFILLED, PARTIALLY_RETURNED} (cross-entity; else ERR_SALE_NOT_FULFILLED)"
          - "Certification.status == COMPLETE (cross-entity; else ERR_CERTIFICATION_INCOMPLETE)"
          - "if hcpcs_code == A5500: Customer.medicare_pairs_claimed_ytd < MEDICARE_ANNUAL_DIABETIC_SHOE_PAIR_LIMIT (1) else ERR_ANNUAL_PAIR_LIMIT_EXCEEDED"
          - "if hcpcs_code in {A5512,A5513}: Customer.medicare_inserts_claimed_ytd < MEDICARE_ANNUAL_INSERT_LIMIT (3) else ERR_ANNUAL_INSERT_LIMIT_EXCEEDED"
        side_effects:
          - "calendar_year = current clock year"
          - "allowed_amount_cents = min(billed_amount_cents, Product.medicare_allowable_cents)"
          - "provisional_reimbursement_cents = round_half_up(allowed_amount_cents * 0.80)"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /medicare-claims/{id}/adjudicate {payer_decision: PAID}"
        actor: BillingSpecialist
        preconditions: ["claim.status == SUBMITTED"]
        side_effects:
          - "deductible_applied_cents = min(allowed_amount_cents, Customer.medicare_deductible_remaining_cents)"
          - "medicare_paid_cents, patient_responsibility_cents = medicare_final_reimbursement(...)"
          - "consumes annual allowance: Customer.medicare_pairs_claimed_ytd / medicare_inserts_claimed_ytd and medicare_deductible_remaining_cents recompute to include this PAID claim"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /medicare-claims/{id}/adjudicate {payer_decision: DENIED}"
        actor: BillingSpecialist
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["no allowance consumed"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /medicare-claims/{id}/resubmit"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DENIED"
          - "same annual-limit preconditions as DRAFT->SUBMITTED re-checked against current counts"
        side_effects: ["recompute calendar_year, allowed_amount_cents, provisional_reimbursement_cents"]
        note: "Cycle: DENIED -> SUBMITTED -> DENIED may repeat."
      - from: PAID
        to: VOIDED
        trigger: "POST /medicare-claims/{id}/void"
        actor: BillingSpecialist
        preconditions: ["claim.status == PAID"]
        side_effects:
          - "compensation: claim no longer PAID so Customer.medicare_pairs_claimed_ytd / medicare_inserts_claimed_ytd and medicare_deductible_remaining_cents restore to pre-PAID values (compensating_invariant medicare_annual_allowance)"

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, REFUNDED, EXCHANGED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: StoreManager
        preconditions:
          - "return.status == REQUESTED"
          - "Sale.fulfillment_status in {FULFILLED, PARTIALLY_RETURNED} (cross-entity; else ERR_SALE_NOT_FULFILLED)"
          - "SaleLine.status == ACTIVE (else ERR_LINE_ALREADY_RETURNED)"
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: StoreManager
        preconditions: ["return.status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: REFUNDED
        trigger: "POST /returns/{id}/refund"
        actor: StoreManager
        preconditions: ["return.status == APPROVED", "return.return_type == RETURN (else ERR_EXCHANGE_TYPE_MISMATCH)"]
        side_effects:
          - "restocking_fee_cents = return_refund_amount.restocking_fee; refund_amount_cents = line_total_cents - restocking_fee_cents"
          - "SaleLine.status ACTIVE -> RETURNED; InventoryItem.quantity_on_hand += quantity (restock)"
          - "bubble-up Sale.fulfillment_status recompute (PARTIALLY_RETURNED or RETURNED)"
          - "create LoyaltyLedgerEntry(reason=REVERSAL, points_delta = -round_half_up((line_total_cents/100) * multiplier(loyalty_tier_at_fulfill)))"
      - from: APPROVED
        to: EXCHANGED
        trigger: "POST /returns/{id}/exchange"
        actor: StoreManager
        preconditions:
          - "return.status == APPROVED"
          - "return.return_type == EXCHANGE (else ERR_EXCHANGE_TYPE_MISMATCH)"
          - "replacement InventoryItem.status == AVAILABLE and quantity_available >= 1 (else ERR_OUT_OF_STOCK)"
        side_effects:
          - "price_difference_cents = replacement Product.base_price_cents - SaleLine.unit_price_cents"
          - "SaleLine.status ACTIVE -> EXCHANGED; original InventoryItem.quantity_on_hand += quantity; replacement InventoryItem.quantity_on_hand -= quantity"
          - "no loyalty reversal (net kept amount unchanged)"

  - entity: SpecialOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /special-orders/{id}/place"
        actor: StoreManager
        preconditions: ["special_order.status == DRAFT", "Product.is_recalled == false (else ERR_ITEM_QUARANTINED)"]
        side_effects: []
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: StoreManager
        preconditions: ["special_order.status == ORDERED"]
        side_effects: ["create InventoryItem(product_id, size=requested_size, width=requested_width, lot_number, quantity_on_hand) and set fulfilled_inventory_item_id"]
      - from: RECEIVED
        to: FULFILLED
        trigger: "POST /special-orders/{id}/fulfill"
        actor: Fitter | StoreManager
        preconditions: ["special_order.status == RECEIVED"]
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: StoreManager | Fitter
        preconditions: ["special_order.status in {DRAFT, ORDERED, RECEIVED}"]
        side_effects: ["if deposit_cents > 0: create LoyaltyLedgerEntry(reason=ADJUST, points_delta = floor(deposit_cents/100)) as store credit"]
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel OR system: Recall.issue cascade"
        actor: StoreManager | Fitter | system
        preconditions: ["special_order.status in {DRAFT, ORDERED, RECEIVED}"]
        side_effects: ["if deposit_cents > 0: create LoyaltyLedgerEntry(reason=ADJUST, points_delta = floor(deposit_cents/100)) -> Customer.loyalty_points_balance recompute"]
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel OR system: Recall.issue cascade"
        actor: StoreManager | Fitter | system
        preconditions: ["special_order.status in {DRAFT, ORDERED, RECEIVED}"]
        side_effects: ["if deposit_cents > 0: create LoyaltyLedgerEntry(reason=ADJUST, points_delta = floor(deposit_cents/100))"]

  - entity: Recall
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /recalls/{id}/issue"
        actor: StoreManager
        preconditions: ["recall.status == DRAFT"]
        side_effects:
          - "cascade link 1: every InventoryItem with product_id==recall.product_id (and lot_number==recall.lot_number if the recall is lot-scoped) and status==AVAILABLE -> QUARANTINED"
          - "cascade link 2 (caused by link 1): every SpecialOrder with product_id==recall.product_id and status in {ORDERED, RECEIVED} -> CANCELLED"
          - "cascade link 3 (caused by link 2): each such SpecialOrder with deposit_cents>0 mints a LoyaltyLedgerEntry(reason=ADJUST, points_delta=floor(deposit_cents/100))"
          - "cascade link 4 (caused by link 3): affected Customer.loyalty_points_balance recomputes"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /recalls/{id}/close"
        actor: StoreManager
        preconditions: ["recall.status == ISSUED"]
        side_effects: ["QUARANTINED items are NOT auto-restored; a manager re-stocks manually (out of scope)"]

  - entity: Certification
    initial_state: COMPLETE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPLETE
        to: SUPERSEDED
        trigger: "system: POST /customers/{id}/certifications creating a newer Certification for the same customer"
        actor: system
        preconditions: ["a newer Certification is created for the same customer_id"]
        side_effects: ["prior COMPLETE certification of the customer -> SUPERSEDED"]
        note: "Creation itself bumps Customer.version (OCC parent); see §1.2.1."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: cert-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /customers/{id}/certifications"
    occ_field: "expected_customer_version"
    description: |
      Creating a Certification against a Customer whose version has advanced
      since the client last observed it is rejected. A newer Certification
      legitimately supersedes the prior COMPLETE one (§1.2 Certification
      COMPLETE->SUPERSEDED) and bumps Customer.version; a create still carrying
      the pre-supersede version is stale and rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: medicare_final_reimbursement
    trigger: "MedicareClaim SUBMITTED -> PAID (POST /medicare-claims/{id}/adjudicate {payer_decision: PAID})"
    algorithm: threshold
    formula: |
      allowed            = allowed_amount_cents            # = min(billed, Product.medicare_allowable_cents), pinned at submit
      deductible_applied = min(allowed, deductible_remaining_at_adjudication)
      after_deductible   = allowed - deductible_applied
      coinsurance        = round_half_up(after_deductible * MEDICARE_COINSURANCE_RATE)
      medicare_paid      = after_deductible - coinsurance
      patient_resp       = deductible_applied + coinsurance
      # invariant: medicare_paid + patient_resp == allowed
    input_set: "This single claim; deductible_remaining_at_adjudication = Customer.medicare_deductible_remaining_cents over PAID claims of the same calendar_year created before this adjudication (created_at ASC)."
    constants:
      MEDICARE_COINSURANCE_RATE: 0.20
      MEDICARE_ANNUAL_DEDUCTIBLE_CENTS: 25700
    precision: "cents, round_half_up on the coinsurance product only"
    variants:
      - name: final
        when: "at PAID adjudication"
        difference: "subtracts the real remaining deductible before the 20% coinsurance."

  - name: medicare_provisional_reimbursement
    trigger: "MedicareClaim DRAFT -> SUBMITTED (POST /medicare-claims/{id}/submit)"
    algorithm: threshold
    formula: |
      provisional = round_half_up(allowed_amount_cents * (1 - MEDICARE_COINSURANCE_RATE))
      # optimistic: assumes the annual deductible is already fully met (deductible_applied = 0)
    input_set: "This single claim's allowed_amount_cents only; ignores deductible remaining."
    constants:
      MEDICARE_COINSURANCE_RATE: 0.20
    precision: "cents, round_half_up"
    variants:
      - name: provisional
        when: "at submit, before payer adjudication"
        difference: "omits the deductible subtraction, so for any customer with deductible remaining > 0 it over-estimates medicare_paid_cents."

  - name: loyalty_points_accrual
    trigger: "Sale fulfillment=PENDING -> FULFILLED (POST /sales/{id}/fulfill)"
    algorithm: weighted_scoring
    formula: |
      multiplier = { BRONZE: 1.00, SILVER: 1.25, GOLD: 1.50 }[ loyalty_tier_at_fulfill ]
      # PINNED ORDER: round each ACTIVE line, THEN sum (round-per-line-then-sum),
      # NOT sum-then-round.
      per_line_points = round_half_up((line.line_total_cents / 100) * multiplier)   # for each ACTIVE line
      loyalty_points_earned = SUM(per_line_points over ACTIVE lines)
    input_set: "ACTIVE SaleLines of the sale at fulfill time; multiplier frozen from loyalty_tier_at_fulfill snapshot."
    constants:
      BRONZE_MULTIPLIER: 1.00
      SILVER_MULTIPLIER: 1.25
      GOLD_MULTIPLIER: 1.50
    precision: "integer points, round_half_up per line before summing"
    variants:
      - name: provisional_at_fulfill
        when: "at fulfill"
        difference: "minted over ALL active lines (gross)."
      - name: net_after_returns
        when: "after any RETURN refund reverses a line"
        difference: "effective balance = provisional minus the reversed line's per-line points; equals accrual computed over only the kept (non-returned) lines."

  - name: return_refund_amount
    trigger: "ReturnRequest APPROVED -> REFUNDED (POST /returns/{id}/refund)"
    algorithm: threshold
    formula: |
      days_since_sale = whole_days(current_clock_date - Sale.created_at date)
      if days_since_sale <= RETURN_WINDOW_DAYS:
          restocking_fee_cents = 0
      else:
          restocking_fee_cents = round_half_up(line_total_cents * RESTOCKING_FEE_RATE)
      refund_amount_cents = line_total_cents - restocking_fee_cents
    input_set: "The single returned SaleLine's line_total_cents and the sale's age in whole days."
    constants:
      RETURN_WINDOW_DAYS: 30
      RESTOCKING_FEE_RATE: 0.15
    precision: "cents, round_half_up on the fee"

  - name: pediatric_recommended_mondo
    trigger: "POST /customers/{id}/measurements (computed on read of recommended_mondo_mm)"
    algorithm: threshold
    formula: |
      toe_allowance = PEDIATRIC_TOE_ALLOWANCE_MM if Customer.is_pediatric else ADULT_TOE_ALLOWANCE_MM
      fitting_length = max(foot_length_mm_left, foot_length_mm_right) + toe_allowance
      recommended_mondo_mm = ceil(fitting_length / MONDO_STEP_MM) * MONDO_STEP_MM
    input_set: "The measurement's two foot lengths plus the customer's pediatric flag at current clock."
    constants:
      PEDIATRIC_TOE_ALLOWANCE_MM: 14
      ADULT_TOE_ALLOWANCE_MM: 12
      MONDO_STEP_MM: 5
      PEDIATRIC_AGE_THRESHOLD_YEARS: 13
    precision: "integer millimetres, ceil to MONDO_STEP_MM"
    variants:
      - name: pediatric
        when: "customer age < 13"
        difference: "uses 14mm growth-toe allowance instead of 12mm, so the same foot can round up a whole 5mm step."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc? no — all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers non-negative where constrained, NPIs 10 digits, gait_lab_id present iff appointment_type==GAIT."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 4
    category: business_temporal
    check: "Appointment end_time > start_time."
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /appointments"
  - priority: 5
    category: existence
    check: "All path and body FK references resolve, validated left-to-right in the path first."
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 6
    category: state
    check: "Target entity is in a state that permits the requested transition (generic invalid transition / terminal lockdown)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "MedicareClaim submit/resubmit: referenced Certification.status == COMPLETE."
    error_id: ERR_CERTIFICATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /medicare-claims/{id}/submit, /resubmit"
  - priority: 8
    category: state
    check: "MedicareClaim submit and ReturnRequest approve: referenced Sale.fulfillment_status in {FULFILLED, PARTIALLY_RETURNED}."
    error_id: ERR_SALE_NOT_FULFILLED
    http_status: 409
    applies_to: "POST /medicare-claims/{id}/submit, POST /returns/{id}/approve"
  - priority: 9
    category: state
    check: "ReturnRequest approve: the SaleLine.status == ACTIVE (not already RETURNED/EXCHANGED)."
    error_id: ERR_LINE_ALREADY_RETURNED
    http_status: 409
    applies_to: "POST /returns/{id}/approve"
  - priority: 10
    category: state
    check: "refund requires return_type==RETURN; exchange requires return_type==EXCHANGE."
    error_id: ERR_EXCHANGE_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /returns/{id}/refund, POST /returns/{id}/exchange"
  - priority: 11
    category: business_safety
    check: "A line flagged requires_medicare (diabetic dispense) or a special-order place must not reference a recalled product / QUARANTINED item; fulfill must not consume a QUARANTINED item."
    error_id: ERR_ITEM_QUARANTINED
    http_status: 409
    applies_to: "POST /sales/{id}/lines, POST /sales/{id}/fulfill, POST /special-orders/{id}/place"
  - priority: 12
    category: business_safety
    check: "Selling to a pediatric customer: line's InventoryItem mondo-equivalent (size mapped) must not be below the customer's latest FootMeasurement.recommended_mondo_mm."
    error_id: ERR_PEDIATRIC_SIZE_TOO_SMALL
    http_status: 422
    applies_to: "POST /sales/{id}/lines"
  - priority: 13
    category: business_referential
    check: "A requires_medicare line requires the sale to reference an Appointment of type DIABETIC_FITTING in status COMPLETED for the same customer."
    error_id: ERR_MISSING_MEASUREMENT
    http_status: 409
    applies_to: "POST /sales/{id}/lines"
  - priority: 14
    category: business_temporal
    check: "Appointment overlaps the same fitter's interval including a FITTER_CLEANUP_BUFFER_MIN (15 min) trailing buffer against SCHEDULED/CHECKED_IN appointments."
    error_id: ERR_FITTER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"
  - priority: 15
    category: business_temporal
    check: "Certification in_person_visit_date within CERT_VISIT_WINDOW_MONTHS (6 calendar months) before current clock date."
    error_id: ERR_CERTIFICATION_VISIT_EXPIRED
    http_status: 422
    applies_to: "POST /customers/{id}/certifications"
  - priority: 16
    category: business_constraint
    check: "InventoryItem.quantity_available >= requested quantity for a new sale line; replacement item available for exchange."
    error_id: ERR_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /sales/{id}/lines, POST /returns/{id}/exchange"
  - priority: 17
    category: business_constraint
    check: "Number of SCHEDULED/CHECKED_IN GAIT appointments whose intervals overlap the requested interval in the same gait lab < GaitLab.concurrent_capacity."
    error_id: ERR_GAIT_LAB_AT_CAPACITY
    http_status: 409
    applies_to: "POST /appointments"
  - priority: 18
    category: business_fiscal
    check: "A5500 shoe claim: Customer.medicare_pairs_claimed_ytd < 1 for the calendar_year."
    error_id: ERR_ANNUAL_PAIR_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /medicare-claims/{id}/submit, /resubmit"
  - priority: 19
    category: business_fiscal
    check: "A5512/A5513 insert claim: Customer.medicare_inserts_claimed_ytd < 3 for the calendar_year."
    error_id: ERR_ANNUAL_INSERT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /medicare-claims/{id}/submit, /resubmit"
  - priority: 20
    category: business_constraint
    check: "OCC: expected_customer_version equals the current Customer.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /customers/{id}/certifications"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a product (shoe/insert catalog entry)."
    roles: [StoreManager]
    code: 201
    input: [name, brand, category, base_price_cents, "medicare_allowable_cents?", "hcpcs_code?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products."
    roles: [StoreManager, BillingSpecialist, Fitter]
    code: 200
    input: ["category?", "is_recalled?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/products/{product_id}"
    description: "Fetch a product."
    roles: [StoreManager, BillingSpecialist, Fitter]
    code: 200
    input: []
    output: Product
    side_effects: []
  # ---- InventoryItem ----
  - method: POST
    path: "/inventory-items"
    description: "Create a size/width/lot inventory unit."
    roles: [StoreManager]
    code: 201
    input: [product_id, size, width, lot_number, quantity_on_hand]
    output: InventoryItem
    side_effects: []
  - method: GET
    path: "/inventory-items"
    description: "List/filter inventory (reverse-reachability for InventoryItem.product_id)."
    roles: [StoreManager, Fitter]
    code: 200
    input: ["product_id?", "status?", "size?", "width?", "limit?", "offset?"]
    output: InventoryItem[]
    side_effects: []
  - method: GET
    path: "/inventory-items/{inventory_item_id}"
    description: "Fetch an inventory item (shows quantity_available, status)."
    roles: [StoreManager, Fitter]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer."
    roles: [Fitter, StoreManager]
    code: 201
    input: [full_name, date_of_birth, "medicare_beneficiary_id?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "List/filter customers."
    roles: [Fitter, StoreManager, BillingSpecialist]
    code: 200
    input: ["medicare_beneficiary_id?", "is_pediatric?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: GET
    path: "/customers/{customer_id}"
    description: "Fetch a customer (computed loyalty & Medicare-benefit fields)."
    roles: [Fitter, StoreManager, BillingSpecialist, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  # ---- FootMeasurement ----
  - method: POST
    path: "/customers/{id}/measurements"
    description: "Record a foot measurement; computes recommended_mondo_mm and growth delta."
    roles: [Fitter]
    code: 201
    input: [foot_length_mm_left, foot_length_mm_right, foot_width_mm_left, foot_width_mm_right]
    output: FootMeasurement
    side_effects: ["measured_at = current clock time"]
  - method: GET
    path: "/customers/{id}/measurements"
    description: "List a customer's measurements (reverse-reachability for FootMeasurement.customer_id)."
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: FootMeasurement[]
    side_effects: []
  # ---- Fitter ----
  - method: POST
    path: "/fitters"
    description: "Create a fitter."
    roles: [StoreManager]
    code: 201
    input: [full_name, "credential?"]
    output: Fitter
    side_effects: []
  - method: GET
    path: "/fitters/{fitter_id}"
    description: "Fetch a fitter."
    roles: [StoreManager, Fitter]
    code: 200
    input: []
    output: Fitter
    side_effects: []
  # ---- GaitLab ----
  - method: POST
    path: "/gait-labs"
    description: "Create a gait lab with a concurrent capacity."
    roles: [StoreManager]
    code: 201
    input: [name, concurrent_capacity]
    output: GaitLab
    side_effects: []
  - method: GET
    path: "/gait-labs/{gait_lab_id}"
    description: "Fetch a gait lab."
    roles: [StoreManager, Fitter]
    code: 200
    input: []
    output: GaitLab
    side_effects: []
  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment; enforces fitter buffer overlap and gait-lab capacity."
    roles: [Fitter, StoreManager]
    code: 201
    input: [customer_id, fitter_id, "gait_lab_id?", appointment_type, start_time, end_time]
    output: Appointment
    side_effects: ["occupies the fitter interval (+15min buffer) and, for GAIT, one gait-lab capacity slot"]
  - method: GET
    path: "/appointments"
    description: "List/filter appointments (reverse-reachability for customer_id/fitter_id/gait_lab_id)."
    roles: [Fitter, StoreManager]
    code: 200
    input: ["customer_id?", "fitter_id?", "gait_lab_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/appointments/{appointment_id}"
    description: "Fetch an appointment."
    roles: [Fitter, StoreManager, Customer]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{appointment_id}/check-in"
    description: "SCHEDULED -> CHECKED_IN."
    roles: [Fitter]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{appointment_id}/complete"
    description: "SCHEDULED/CHECKED_IN -> COMPLETED; records recommendation fields."
    roles: [Fitter]
    code: 200
    input: ["recommended_mondo_mm?", "recommended_width?", "gait_findings?", "recommended_orthotic?"]
    output: Appointment
    side_effects: ["persist recommendation fields"]
  - method: POST
    path: "/appointments/{appointment_id}/cancel"
    description: "SCHEDULED/CHECKED_IN -> CANCELLED; frees intervals."
    roles: [Fitter, StoreManager, Customer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["frees fitter and gait-lab intervals"]
  - method: POST
    path: "/appointments/{appointment_id}/no-show"
    description: "SCHEDULED/CHECKED_IN -> NO_SHOW; frees intervals."
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["frees fitter and gait-lab intervals"]
  # ---- Sale ----
  - method: POST
    path: "/sales"
    description: "Open a sale."
    roles: [Fitter, StoreManager]
    code: 201
    input: [customer_id, fitter_id, "appointment_id?"]
    output: Sale
    side_effects: []
  - method: GET
    path: "/sales"
    description: "List/filter sales (reverse-reachability for customer_id/fitter_id/appointment_id)."
    roles: [Fitter, StoreManager]
    code: 200
    input: ["customer_id?", "fitter_id?", "appointment_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: GET
    path: "/sales/{sale_id}"
    description: "Fetch a sale (computed subtotal, loyalty_points_earned)."
    roles: [Fitter, StoreManager, Customer]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/sales/{sale_id}/lines"
    description: "Add a line; reserves stock and runs safety/referential/stock checks."
    roles: [Fitter, StoreManager]
    code: 201
    input: [inventory_item_id, quantity, "requires_medicare?"]
    output: SaleLine
    side_effects: ["unit_price_cents = Product.base_price_cents", "InventoryItem.quantity_reserved += quantity"]
  - method: GET
    path: "/sale-lines"
    description: "List/filter sale lines (reverse-reachability for sale_id/inventory_item_id)."
    roles: [Fitter, StoreManager]
    code: 200
    input: ["sale_id?", "inventory_item_id?", "limit?", "offset?"]
    output: SaleLine[]
    side_effects: []
  - method: GET
    path: "/sale-lines/{sale_line_id}"
    description: "Fetch a sale line."
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: SaleLine
    side_effects: []
  - method: POST
    path: "/sales/{sale_id}/fulfill"
    description: "fulfillment PENDING -> FULFILLED; decrements stock, mints loyalty."
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: Sale
    side_effects: ["decrement on_hand & reserved per line", "snapshot loyalty_tier_at_fulfill", "mint EARN LoyaltyLedgerEntry"]
  - method: POST
    path: "/sales/{sale_id}/pay"
    description: "payment UNPAID -> PAID."
    roles: [Fitter, StoreManager]
    code: 200
    input: [amount_tendered_cents]
    output: Sale
    side_effects: []
  - method: POST
    path: "/sales/{sale_id}/cancel"
    description: "fulfillment PENDING -> CANCELLED; releases reservations."
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: Sale
    side_effects: ["release quantity_reserved for each ACTIVE line (compensating_invariant inventory_availability)"]
  # ---- Certification ----
  - method: POST
    path: "/customers/{id}/certifications"
    description: "Create a diabetic-shoe certification (OCC on Customer.version). Default clock start is 2026-07-01T00:00:00Z."
    roles: [BillingSpecialist]
    code: 201
    input: [certifying_physician_npi, prescribing_practitioner_npi, statement_date, in_person_visit_date, expected_customer_version]
    output: Certification
    side_effects: ["supersede prior COMPLETE certification -> SUPERSEDED", "increments Customer.version by 1"]
  - method: GET
    path: "/customers/{id}/certifications"
    description: "List a customer's certifications (reverse-reachability for Certification.customer_id)."
    roles: [BillingSpecialist, Fitter]
    code: 200
    input: []
    output: Certification[]
    side_effects: []
  # ---- MedicareClaim ----
  - method: POST
    path: "/medicare-claims"
    description: "Draft a Medicare claim."
    roles: [BillingSpecialist]
    code: 201
    input: [customer_id, sale_id, certification_id, hcpcs_code, billed_amount_cents]
    output: MedicareClaim
    side_effects: []
  - method: GET
    path: "/medicare-claims"
    description: "List/filter claims (reverse-reachability for customer_id/sale_id/certification_id)."
    roles: [BillingSpecialist]
    code: 200
    input: ["customer_id?", "sale_id?", "certification_id?", "status?", "calendar_year?", "limit?", "offset?"]
    output: MedicareClaim[]
    side_effects: []
  - method: GET
    path: "/medicare-claims/{claim_id}"
    description: "Fetch a claim."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: MedicareClaim
    side_effects: []
  - method: POST
    path: "/medicare-claims/{claim_id}/submit"
    description: "DRAFT -> SUBMITTED; validates cert/sale/limits, sets allowed & provisional."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: MedicareClaim
    side_effects: ["set calendar_year, allowed_amount_cents, provisional_reimbursement_cents"]
  - method: POST
    path: "/medicare-claims/{claim_id}/adjudicate"
    description: "SUBMITTED -> PAID or DENIED; PAID sets final reimbursement and consumes allowance/deductible."
    roles: [BillingSpecialist]
    code: 200
    input: [payer_decision]
    output: MedicareClaim
    side_effects: ["on PAID: set deductible_applied/medicare_paid/patient_responsibility; consume annual allowance & deductible"]
  - method: POST
    path: "/medicare-claims/{claim_id}/resubmit"
    description: "DENIED -> SUBMITTED (cycle); re-checks annual limits, recomputes allowed & provisional."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: MedicareClaim
    side_effects: ["recompute calendar_year, allowed_amount_cents, provisional_reimbursement_cents"]
  - method: POST
    path: "/medicare-claims/{claim_id}/void"
    description: "PAID -> VOIDED; compensates annual allowance & deductible."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: MedicareClaim
    side_effects: ["restore Customer medicare_pairs_claimed_ytd/inserts and deductible_remaining"]
  # ---- ReturnRequest ----
  - method: POST
    path: "/returns"
    description: "Request a return/exchange of a sale line."
    roles: [Customer, Fitter, StoreManager]
    code: 201
    input: [sale_id, sale_line_id, return_type, "reason?"]
    output: ReturnRequest
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List/filter returns (reverse-reachability for sale_id/sale_line_id/replacement_inventory_item_id)."
    roles: [Fitter, StoreManager, Customer]
    code: 200
    input: ["sale_id?", "sale_line_id?", "replacement_inventory_item_id?", "status?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []
  - method: GET
    path: "/returns/{return_id}"
    description: "Fetch a return."
    roles: [Fitter, StoreManager, Customer]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: POST
    path: "/returns/{return_id}/approve"
    description: "REQUESTED -> APPROVED; requires fulfilled sale and ACTIVE line."
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: POST
    path: "/returns/{return_id}/reject"
    description: "REQUESTED -> REJECTED."
    roles: [StoreManager]
    code: 200
    input: ["reason?"]
    output: ReturnRequest
    side_effects: []
  - method: POST
    path: "/returns/{return_id}/refund"
    description: "APPROVED -> REFUNDED (RETURN only); restock, reverse loyalty, bubble-up sale status."
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["restock inventory", "SaleLine -> RETURNED", "REVERSAL LoyaltyLedgerEntry", "Sale fulfillment recompute", "payment PAID->REFUNDED if fully returned (return_refund_chain)"]
  - method: POST
    path: "/returns/{return_id}/exchange"
    description: "APPROVED -> EXCHANGED (EXCHANGE only); swaps inventory, computes price difference."
    roles: [StoreManager]
    code: 200
    input: [replacement_inventory_item_id]
    output: ReturnRequest
    side_effects: ["price_difference_cents", "SaleLine -> EXCHANGED", "restock original, decrement replacement on_hand"]
  # ---- SpecialOrder ----
  - method: POST
    path: "/special-orders"
    description: "Create a special order for an out-of-stock size/width."
    roles: [Fitter, StoreManager]
    code: 201
    input: [customer_id, product_id, requested_size, requested_width, deposit_cents]
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/special-orders"
    description: "List/filter special orders (reverse-reachability for customer_id/product_id/fulfilled_inventory_item_id)."
    roles: [Fitter, StoreManager]
    code: 200
    input: ["customer_id?", "product_id?", "fulfilled_inventory_item_id?", "status?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: GET
    path: "/special-orders/{special_order_id}"
    description: "Fetch a special order."
    roles: [Fitter, StoreManager, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/special-orders/{special_order_id}/place"
    description: "DRAFT -> ORDERED; blocked if product recalled."
    roles: [StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/special-orders/{special_order_id}/receive"
    description: "ORDERED -> RECEIVED; creates the inventory item."
    roles: [StoreManager]
    code: 200
    input: [lot_number, quantity_on_hand]
    output: SpecialOrder
    side_effects: ["create InventoryItem and set fulfilled_inventory_item_id"]
  - method: POST
    path: "/special-orders/{special_order_id}/fulfill"
    description: "RECEIVED -> FULFILLED."
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: POST
    path: "/special-orders/{special_order_id}/cancel"
    description: "DRAFT/ORDERED/RECEIVED -> CANCELLED; refunds deposit as loyalty credit."
    roles: [StoreManager, Fitter]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["deposit refund -> ADJUST LoyaltyLedgerEntry"]
  # ---- Recall ----
  - method: POST
    path: "/recalls"
    description: "Draft a recall for a product (optionally lot-scoped)."
    roles: [StoreManager]
    code: 201
    input: [product_id, "lot_number?", reason]
    output: Recall
    side_effects: []
  - method: GET
    path: "/recalls"
    description: "List/filter recalls (reverse-reachability for Recall.product_id)."
    roles: [StoreManager, Fitter]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []
  - method: GET
    path: "/recalls/{recall_id}"
    description: "Fetch a recall."
    roles: [StoreManager, Fitter]
    code: 200
    input: []
    output: Recall
    side_effects: []
  - method: POST
    path: "/recalls/{recall_id}/issue"
    description: "DRAFT -> ISSUED; quarantine cascade + special-order cancel cascade + deposit refund cascade."
    roles: [StoreManager]
    code: 200
    input: []
    output: Recall
    side_effects: ["quarantine matching inventory", "cancel matching ORDERED/RECEIVED special orders", "mint deposit-refund ledger entries"]
  - method: POST
    path: "/recalls/{recall_id}/close"
    description: "ISSUED -> CLOSED."
    roles: [StoreManager]
    code: 200
    input: []
    output: Recall
    side_effects: []
  # ---- Loyalty ----
  - method: POST
    path: "/loyalty-ledger"
    description: "Manual ledger adjustment/redemption."
    roles: [StoreManager]
    code: 201
    input: [customer_id, points_delta, reason, "sale_id?"]
    output: LoyaltyLedgerEntry
    side_effects: ["Customer.loyalty_points_balance recompute"]
  - method: GET
    path: "/loyalty-ledger"
    description: "List/filter ledger (reverse-reachability for customer_id/sale_id)."
    roles: [StoreManager, Fitter, Customer]
    code: 200
    input: ["customer_id?", "sale_id?", "reason?", "limit?", "offset?"]
    output: LoyaltyLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/loyalty-ledger/{ledger_entry_id}"
    description: "Fetch a ledger entry."
    roles: [StoreManager, Fitter, Customer]
    code: 200
    input: []
    output: LoyaltyLedgerEntry
    side_effects: []
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [StoreManager, BillingSpecialist, Fitter]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all deadline/expiry/window/calendar_year evaluations use this clock"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the operation."
  - id: ERR_VALIDATION
    http: 422
    condition: "Malformed body: missing required field, out-of-range enum, negative constrained integer, bad NPI, or gait_lab_id present/absent contrary to appointment_type."
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "Appointment end_time <= start_time."
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id does not resolve."
  - id: ERR_INVENTORY_ITEM_NOT_FOUND
    http: 404
    condition: "inventory_item_id does not resolve."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id does not resolve."
  - id: ERR_FITTER_NOT_FOUND
    http: 404
    condition: "fitter_id does not resolve."
  - id: ERR_GAIT_LAB_NOT_FOUND
    http: 404
    condition: "gait_lab_id does not resolve."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "appointment_id does not resolve."
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "sale_id does not resolve."
  - id: ERR_SALE_LINE_NOT_FOUND
    http: 404
    condition: "sale_line_id does not resolve."
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification_id does not resolve."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id does not resolve."
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "return_id does not resolve."
  - id: ERR_SPECIAL_ORDER_NOT_FOUND
    http: 404
    condition: "special_order_id does not resolve."
  - id: ERR_RECALL_NOT_FOUND
    http: 404
    condition: "recall_id does not resolve."
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "ledger_entry_id does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not permitted from the entity's current state (generic invalid/terminal)."
  - id: ERR_CERTIFICATION_INCOMPLETE
    http: 409
    condition: "Claim submit/resubmit references a Certification whose status != COMPLETE."
  - id: ERR_SALE_NOT_FULFILLED
    http: 409
    condition: "Claim submit or return approve references a Sale not in {FULFILLED, PARTIALLY_RETURNED}."
  - id: ERR_LINE_ALREADY_RETURNED
    http: 409
    condition: "Return approve on a SaleLine already RETURNED/EXCHANGED."
  - id: ERR_EXCHANGE_TYPE_MISMATCH
    http: 409
    condition: "refund on a non-RETURN return, or exchange on a non-EXCHANGE return."
  - id: ERR_ITEM_QUARANTINED
    http: 409
    condition: "Line add / fulfill / special-order place touches a recalled product or QUARANTINED inventory item."
  - id: ERR_PEDIATRIC_SIZE_TOO_SMALL
    http: 422
    condition: "Selling a pediatric customer a size below their latest recommended_mondo_mm."
  - id: ERR_MISSING_MEASUREMENT
    http: 409
    condition: "A requires_medicare line lacks a COMPLETED DIABETIC_FITTING appointment for the customer."
  - id: ERR_FITTER_DOUBLE_BOOKED
    http: 409
    condition: "Appointment overlaps the fitter's interval including the 15-minute trailing buffer."
  - id: ERR_CERTIFICATION_VISIT_EXPIRED
    http: 422
    condition: "in_person_visit_date is more than 6 calendar months before current clock date."
  - id: ERR_OUT_OF_STOCK
    http: 409
    condition: "quantity_available below requested quantity for a sale line or exchange replacement."
  - id: ERR_GAIT_LAB_AT_CAPACITY
    http: 409
    condition: "Overlapping GAIT appointments in the lab reach concurrent_capacity."
  - id: ERR_ANNUAL_PAIR_LIMIT_EXCEEDED
    http: 409
    condition: "A5500 shoe claim when medicare_pairs_claimed_ytd already == 1 for the calendar_year."
  - id: ERR_ANNUAL_INSERT_LIMIT_EXCEEDED
    http: 409
    condition: "A5512/A5513 insert claim when medicare_inserts_claimed_ytd already == 3 for the calendar_year."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_customer_version != current Customer.version on certification create."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: StoreManager
    description: "Operational admin: catalog, inventory, appointments, sales, returns adjudication, special orders, recalls, loyalty adjustments."
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /inventory-items"
      - "POST /fitters"
      - "POST /gait-labs"
      - "POST /returns/{id}/approve"
      - "POST /returns/{id}/reject"
      - "POST /returns/{id}/refund"
      - "POST /returns/{id}/exchange"
      - "POST /special-orders/{id}/place"
      - "POST /special-orders/{id}/receive"
      - "POST /recalls"
      - "POST /recalls/{id}/issue"
      - "POST /recalls/{id}/close"
      - "POST /loyalty-ledger"
    shared_operations:
      - "POST /customers"
      - "POST /appointments and lifecycle"
      - "POST /sales, lines, fulfill, pay, cancel"
      - "POST /special-orders, fulfill, cancel"
      - "reads"
  - name: Fitter
    description: "Pedorthist: measurements, appointment lifecycle, fitting completion, sales."
    identity: "entity_backed:Fitter"
    exclusive_operations:
      - "POST /customers/{id}/measurements"
      - "POST /appointments/{id}/check-in"
      - "POST /appointments/{id}/complete"
    shared_operations:
      - "POST /customers"
      - "POST /appointments, cancel, no-show"
      - "POST /sales, lines, fulfill, pay, cancel"
      - "POST /special-orders, fulfill, cancel"
      - "POST /returns"
      - "reads"
  - name: BillingSpecialist
    description: "Medicare certifications and claims lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers/{id}/certifications"
      - "POST /medicare-claims"
      - "POST /medicare-claims/{id}/submit"
      - "POST /medicare-claims/{id}/adjudicate"
      - "POST /medicare-claims/{id}/resubmit"
      - "POST /medicare-claims/{id}/void"
    shared_operations:
      - "reads (customers, certifications, claims, products)"
  - name: Customer
    description: "Self-service: view own records, request returns, cancel own appointments."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /returns"
      - "POST /appointments/{id}/cancel"
      - "GET own customer, sales, appointments, returns, loyalty-ledger"
