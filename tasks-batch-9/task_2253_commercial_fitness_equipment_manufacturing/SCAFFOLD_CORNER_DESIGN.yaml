  - name: chronological_walk_orders_by_window_end_not_by_creation
    claim_type: correct_result
    grounds:
    - calculations.revision_cycle_qualification
    - entities.DurabilityTestRun.fields.window_end
    - state_machines.ModelRevision.IN_TESTING_to_TEST_FAILED
    distinguishing_aspect: 'The walk is ordered by window_end ASC, not by created_at: the FAILED run (window ending 2026-08-22) was created FIRST but is processed SECOND, so verified_cycle_count == 850000
      (300000 passed, then 550000 up to the failure, then STOP) and projected_cycle_count == 575000 (300000 + floor(550000 x 0.5)). A creation-order walk would return 550000 and would wrongly trip TEST_FAILED.'
    test_recipe:
      setup:
      - T900-R1 is IN_TESTING on a FULL_COMMERCIAL model (min_required_cycles 500000).
      - Run x1 was created first with window 2026-08-18 -> 2026-08-22T12:00 and completed FAILED at 550000 cycles.
      - Run x2 was created second with the EARLIER window 2026-08-02 -> 2026-08-06T12:00 and completed PASSED at 300000 cycles.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-18T00:00:00Z', window_end: '2026-08-22T12:00:00Z', target_cycles: 600000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: FAILED, failure_cycle_count: 550000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      trigger:
      - call: GET /model-revisions/${r1}/qualification-report
        payload: {}
        as: ProductEngineer
      - call: GET /model-revisions/${r1}
        payload: {}
        as: ProductEngineer
      - call: GET /test-runs
        payload: {model_revision_id: '${r1}'}
        as: ProductEngineer
      assert:
      - verified_cycle_count == 850000 (chronological order is x2 then x1; the walk stops AFTER crediting the failure's 550000)
      - projected_cycle_count == 575000 (300000 + floor(550000 x 0.5) = 300000 + 275000)
      - completed_run_count == 2, running_run_count == 0, min_required_cycles == 500000, qualifies == true
      - ModelRevision.${r1}.status == IN_TESTING — the FAILED run did NOT force TEST_FAILED because 850000 >= 500000
      - GET /test-runs?model_revision_id=${r1} lists ${x1} before ${x2} (created_at ASC), proving the calculation does not use list order
      - DurabilityTestRun.${x1}.failure_cycle_count == 550000 and achieved_cycles == null
