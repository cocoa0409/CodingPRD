              payload: { license_number: "LCSW-CA-77120", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { license_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-02-01T00:00:00Z" }
              as: OpsAdmin
              captures: { enrollment_id: $.data.id }
            - call: "PATCH /network/payers/${payer_id}"
              payload: { status: "SUSPENDED_AT_PAYER" }
              as: OpsAdmin
          trigger:
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { error_id_blocked: $.data.error_id }
            - call: "PATCH /network/payers/${payer_id}"
              payload: { status: "ACTIVE" }
              as: OpsAdmin
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { pinned_rate_set_version: $.data.rate_set_version_pinned }
          assert:
            - "while the payer reads SUSPENDED_AT_PAYER the activation returns status 409 and ${error_id_blocked} == ERR_PAYER_SUSPENDED"
            - "PayerEnrollment.${enrollment_id}.status == PENDING after the rejection, so nothing was written"
            - "after the payer returns to ACTIVE the identical activation succeeds and PayerEnrollment.${enrollment_id}.status == EFFECTIVE"
            - "Clinician.${clinician_id}.billing_posture == BILLABLE after the enrollment became EFFECTIVE, since a VERIFIED license, an ACTIVE malpractice policy and one EFFECTIVE enrollment are all present"
            - "${pinned_rate_set_version} is null, confirming that the rate pin is derived from rate rows rather than from the enrollment's own inputs, and that a null pin does not by itself block billing posture"
            - "the posture read was driven by the Payer's status at hop one and by the enrollment's own activation at hop two, so the gate and the outcome sit on different entities"

