      - name: corner_stale_expected_application_version_rejected_on_revision
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-revision-stale-version]", "validations[priority=54]", "errors[ERR_STALE_APPLICATION_VERSION]", "entities.PermitApplication.fields.version"]
        distinguishing_aspect: "A revision carrying ${av1} - 1, one behind the application's current version, is refused with 412 ERR_STALE_APPLICATION_VERSION while the application stays CHANGES_REQUESTED with revision_count 0; resending the exact current version succeeds."
