          assert:
            - "HTTP status is 200"
            - "${usage_gb} == 615.0 - round_half_up(300.0 + 20.0, 1) then round_half_up(320.0 + 280.0 + 15.0, 1)"
            - "${priority} == \"DEPRIORITIZED\" because 615.0 > 600.0 strictly, and ${eff_mbps} == 12.5 - max(50 * 0.25, 0.1)"
            - "${breaches} == 0 and ${sticky} == false - no cycle has closed yet, so the counters stay put even though the account is deprioritized right now"
            - "${credit_bal} == 1706 - the single APPLIED credit"
            - "${settle_bal} == 0 - the DEPLOYED assignment has not been settled, so it contributes nothing to the settlement roll-up"
            - "${equip_charge} == 1000 - that same DEPLOYED rental radio does drive the monthly charge"
            - "${status} == \"ACTIVE\" and deprioritized_at == \"2026-08-12T00:00:00Z\", the clock at the ingest that crossed the cap"

      - name: reschedule_is_legal_only_out_of_resurvey_required_and_preserves_the_measurements
        claim_type: conditional_action
        grounds:
          - endpoints[POST /install-work-orders/{id}/reschedule]
          - state_machines.InstallWorkOrder.transitions
          - errors.ERR_WORK_ORDER_STATE_INVALID
        distinguishing_aspect: |
          The same endpoint is a legal move from RESURVEY_REQUIRED and a 409 from SCHEDULED, and the two
          calls are one after the other on the same row - reschedule returns the order to SCHEDULED and
          thereby disarms itself. It also differs from the exception REQUEST_RESURVEY path: reschedule
          only rewrites scheduled_at, leaving field_los_margin_m, recommended_mast_height_m and
          recommended_mounting_type from the failed survey intact until the next survey overwrites them.
        test_recipe:
          setup:
            - "PRELUDE P3 plus a SCHEDULED work order."
            - "A survey with measured_tree_line_height_m 5.5, measured_roof_height_m 4.0 and structure_penetration_allowed false: required_amsl 1219.0, margin 26.0, mast 5.0 -> ROOF_MAST_GUYED without penetration, i.e. branch 3 -> RESURVEY_REQUIRED with resurvey_count 1."
