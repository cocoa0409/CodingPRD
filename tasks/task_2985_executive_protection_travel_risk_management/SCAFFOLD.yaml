# =============================================================================
# SCAFFOLD — Executive Protection & Travel Risk Management
# Sections §1.0 – §1.7. Difficulty design (§1.8) and corner design (§1.9) live
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2985. Executive Protection & Travel Risk Management (corporate security department): executive risk assessment with threat monitoring, public exposure analysis and residential security surveys, protective detail planning for travel with advance work, route planning and local liaison, traveler tracking across bookings with location awareness and consent boundaries, destination risk rating with pre-trip briefings, approval requirements and insurance coverage verification, incident response including medical evacuation, political unrest and natural disaster with vendor activation, communication protocols, check-in requirements and duress procedures, event and public appearance security planning, cost allocation and disclosure of security-related perquisites

domain_name: exec-protection-travel-risk
api_prefix: /exec-protection

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Thirteen peer entities linked by explicit foreign keys. Only two URL
    families nest (TripLeg / Incident / CheckIn under Trip, exposure signals
    and insurance policies under Executive); every other relationship is a
    body-level FK on a flat collection, and cross-aggregate references
    (Trip -> RiskAssessment, VendorEngagement -> Incident) are peer links,
    not ownership paths.

  state_machine_shape: parallel
  state_machine_shape_note: |
    Trip carries two independent state dimensions on one row —
    `approval_state` (DRAFT -> PENDING_REVIEW -> PENDING_COMPLIANCE ->
    APPROVED | DENIED, a fork-join on required_approval_level) and
    `readiness_state` (NOT_READY <-> ADVANCE_IN_PROGRESS -> READY <->
    DEGRADED -> CLOSED, which revisits READY after remediation). They advance
    on disjoint triggers and are gated against each other only at close.
    RiskAssessment is cyclic (SUBMITTED <-> RETURNED with a bounded revision
    counter); Incident is a branching fork-join (TRIAGED forks into three
    response tracks with divergent side-effect sets, rejoining at RESOLVED).

  relationship_patterns:
    - one_to_many          # Trip -> TripLeg, Executive -> RiskAssessment
    - self_referential     # RiskAssessment.supersedes_assessment_id -> RiskAssessment.id
    - cross_aggregate      # Trip -> RiskAssessment, VendorEngagement -> Incident
    - polymorphic_absent   # no polymorphic FKs; every FK names one parent type

  role_model: segregation_of_duties
  role_model_note: |
    The staff member who authors a RiskAssessment may not approve it, and the
    staff member who creates a Trip may not decide it. Both checks compare
    X-User-ID against a persisted staff FK, so the three staff roles are all
    entity_backed on SecurityStaff.

  consistency_model: immediate

  difficulty_level: expert_plus
  difficulty_note: |
    13 entities / 49 endpoints / 50 error codes / 14 calculation rules with 3
    dual-variant pairs / 7 state machines. Density, not volume, is the source
    of difficulty: cost, perquisite disclosure, readiness, approval level and
    check-in cadence are all derived from the same leg/band/tier lattice, so a
    single destination-rating edit re-derives four entities.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Executive
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: protectee legal name
        constraints: "1..120 chars, non-blank"
      - name: tier
        type: enum
        source: input
        description: protection tier driving risk uplift and approval level
        constraints: "one of TIER_1 | TIER_2 | TIER_3"
      - name: role_title
        type: string
        source: input
        description: corporate title shown on briefings
        constraints: "1..120 chars"
      - name: base_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 home country of the protectee
        constraints: "exactly 2 uppercase A-Z letters"
      - name: annual_security_budget_cents
        type: integer
        source: input
        description: yearly protection budget ceiling for this executive, in cents
        constraints: ">= 0"
      - name: consent_scope
        type: enum
        source: input
        description: location-tracking consent granted by the protectee
        default: NONE
        constraints: "one of NONE | TRIP_ONLY | CONTINUOUS"
      - name: consent_expires_at
        type: datetime
        source: input
        description: ISO-8601 UTC instant at which consent_scope reverts to NONE; null means no expiry
        default: null
        constraints: "nullable; when consent_scope != NONE and non-null it MUST be > clock_now"
      - name: residential_survey_status
        type: enum
        source: system
        description: outcome of the residential security survey
        default: PENDING
        constraints: "one of PENDING | COMPLETE | DEFICIENT"
      - name: residential_component
        type: number
        source: computed
        description: 0..100 residential-hardening deficiency score recorded by the latest survey
        default: 0
        constraints: "2 decimal places"
      - name: public_exposure_score
        type: number
        source: computed
        description: DECAY_WEIGHTED variant of calculations.public_exposure_score over this executive's PublicExposureSignal rows
        default: 0
        constraints: "0.00 .. 100.00, 2 decimal places"
      - name: threat_level
        type: enum
        source: computed
        description: threshold band of the latest APPROVED RiskAssessment.composite_risk_score
        default: LOW
        constraints: "one of LOW | ELEVATED | HIGH | SEVERE"
      - name: committed_budget_cents
        type: integer
        source: computed
        description: sum of provisional_security_cost_cents over this executive's trips whose approval_state IN {PENDING_REVIEW, PENDING_COMPLIANCE, APPROVED} and readiness_state != CLOSED
        default: 0
      - name: spent_budget_cents
        type: integer
        source: computed
        description: sum of total_security_cost_cents over this executive's trips whose readiness_state == CLOSED
        default: 0
      - name: remaining_budget_cents
        type: integer
        source: computed
        description: annual_security_budget_cents - committed_budget_cents - spent_budget_cents
      - name: annual_disclosed_perquisite_cents
        type: integer
        source: computed
        description: sum of perquisite_taxable_cents over this executive's trips whose readiness_state == CLOSED
        default: 0
      - name: business_borne_security_cents
        type: integer
        source: computed
        description: sum of business_borne_cents over this executive's trips whose readiness_state == CLOSED
        default: 0
      - name: open_degraded_trip_count
        type: integer
        source: computed
        description: count of this executive's trips whose readiness_state == DEGRADED
        default: 0

  - name: SecurityStaff
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: staff member legal name
        constraints: "1..120 chars, non-blank"
      - name: staff_role
        type: enum
        source: input
        description: which API role this staff row may authenticate as
        constraints: "one of ANALYST | MANAGER | DIRECTOR; ANALYST -> SecurityAnalyst, MANAGER -> ProtectionManager, DIRECTOR -> SecurityDirector"
      - name: certification_expires_at
        type: datetime
        source: input
        description: ISO-8601 UTC instant after which this staff member may not be assigned to a protective detail
        constraints: "must be a valid ISO-8601 UTC instant"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: billable rate per hour, in cents, used by calculations.detail_assignment_cost
        constraints: "> 0"
      - name: committed_detail_hours
        type: integer
        source: computed
        description: sum of planned_billable_hours over this staff member's ProtectiveDetailAssignment rows whose status == CONFIRMED
        default: 0
      - name: released_detail_hours
        type: integer
        source: computed
        description: sum of final_billable_hours over this staff member's ProtectiveDetailAssignment rows whose status == RELEASED
        default: 0

  - name: PublicExposureSignal
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: executive_id
        type: string
        source: input
        description: "FK -> Executive.id; the protectee this exposure signal was observed for"
      - name: signal_type
        type: enum
        source: input
        description: exposure channel, selects SIGNAL_TYPE_MULTIPLIER in calculations.public_exposure_score
        constraints: "one of MEDIA_MENTION | SOCIAL_GEOTAG | PUBLIC_FILING | PROTEST_MENTION"
      - name: severity
        type: integer
        source: input
        description: analyst-assigned intensity of the signal
        constraints: "integer 1..5 inclusive"
      - name: observed_at
        type: datetime
        source: input
        description: ISO-8601 UTC instant the signal was observed; drives the decay window
        constraints: "must be <= clock_now"
      - name: source_note
        type: string
        source: input
        description: free-text provenance note
        default: null
        constraints: "nullable, 0..500 chars"

  - name: RiskAssessment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: executive_id
        type: string
        source: input
        description: "FK -> Executive.id; the protectee being assessed"
      - name: authored_by_staff_id
        type: string
        source: input
        description: "FK -> SecurityStaff.id; the analyst who drafted the assessment; MUST equal the creating request's X-User-ID"
      - name: approved_by_staff_id
        type: string
        source: system
        description: "FK -> SecurityStaff.id; the director who approved it; null until APPROVED"
        default: null
      - name: supersedes_assessment_id
        type: string
        source: system
        description: "FK -> RiskAssessment.id; the previously APPROVED assessment for the same executive that this row superseded on approval; null when none existed"
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines[entity=RiskAssessment]
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | RETURNED | APPROVED | SUPERSEDED | VOIDED"
      - name: threat_monitoring_score
        type: number
        source: input
        description: 0..100 analyst score from the threat-monitoring feed review
        constraints: "0.00 .. 100.00"
      - name: public_exposure_component
        type: number
        source: computed
        description: ROLLING_WINDOW variant of calculations.public_exposure_score, snapshotted at each submit
        default: 0
        constraints: "0.00 .. 100.00, 2 decimal places"
      - name: residential_component_snapshot
        type: number
        source: computed
        description: copy of Executive.residential_component taken at each submit
        default: 0
      - name: composite_risk_score
        type: number
        source: computed
        description: output of calculations.composite_risk_score, recomputed at each submit
        default: 0
        constraints: "0.00 .. 100.00, 2 decimal places"
      - name: revision_round
        type: integer
        source: computed
        description: number of times this assessment has been RETURNED; VOIDED once it would exceed MAX_REVISION_ROUNDS
        default: 0
      - name: review_notes
        type: string
        source: input
        description: director note recorded by the review action
        default: null
        constraints: "nullable; required and 1..500 chars when review outcome == RETURN"
      - name: submitted_at
        type: datetime
        source: system
        description: clock_now at the most recent submit
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: clock_now at approval
        default: null

  - name: DestinationRating
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country code; natural key, unique across DestinationRating
        constraints: "exactly 2 uppercase A-Z letters, unique"
      - name: crime_index
        type: number
        source: input
        description: 0..100 violent-and-property crime index
        constraints: "0.00 .. 100.00"
      - name: political_instability_index
        type: number
        source: input
        description: 0..100 political-unrest index
        constraints: "0.00 .. 100.00"
      - name: medical_infrastructure_index
        type: number
        source: input
        description: 0..100 medical capability index; HIGHER is better and enters the composite inverted
        constraints: "0.00 .. 100.00"
      - name: natural_hazard_index
        type: number
        source: input
        description: 0..100 natural-disaster exposure index
        constraints: "0.00 .. 100.00"
      - name: composite_destination_score
        type: number
        source: computed
        description: output of calculations.destination_composite_score
        constraints: "0.00 .. 100.00, 2 decimal places"
      - name: rating_band
        type: enum
        source: computed
        description: threshold band of composite_destination_score
        constraints: "one of LOW | MODERATE | HIGH | EXTREME"
      - name: insurance_required_coverage_cents
        type: integer
        source: computed
        description: INSURANCE_REQUIRED_COVERAGE_CENTS[rating_band]
      - name: advisory_effective_at
        type: datetime
        source: input
        description: ISO-8601 UTC instant the advisory took effect
      - name: advisory_note
        type: string
        source: input
        description: free-text advisory text
        default: null
        constraints: "nullable, 0..500 chars"

  - name: InsurancePolicy
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: executive_id
        type: string
        source: input
        description: "FK -> Executive.id; the insured protectee"
      - name: policy_type
        type: enum
        source: input
        description: coverage family
        constraints: "one of MEDICAL_EVAC | KIDNAP_RANSOM | TRAVEL_ACCIDENT"
      - name: coverage_cents
        type: integer
        source: input
        description: maximum indemnity in cents
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: ISO-8601 UTC inclusive start of cover
      - name: effective_to
        type: datetime
        source: input
        description: ISO-8601 UTC exclusive end of cover; MUST be > effective_from
      - name: excluded_country_codes
        type: array
        source: input
        description: ISO-3166 alpha-2 codes this policy does not cover
        default: []
        constraints: "array of exactly-2-uppercase-letter strings; may be empty"
      - name: status
        type: enum
        source: system
        description: verification state, see state_machines[entity=InsurancePolicy]
        default: UNVERIFIED
        constraints: "one of UNVERIFIED | VERIFIED | REJECTED"
      - name: verified_at
        type: datetime
        source: system
        description: clock_now at verification
        default: null
      - name: verification_note
        type: string
        source: input
        description: compliance note recorded by the verify action
        default: null
        constraints: "nullable, 0..500 chars"

  - name: Trip
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: executive_id
        type: string
        source: input
        description: "FK -> Executive.id; the travelling protectee"
      - name: created_by_staff_id
        type: string
        source: input
        description: "FK -> SecurityStaff.id; the protection manager who created the trip; MUST equal the creating request's X-User-ID and is the segregation-of-duties counterparty for the decision action"
      - name: risk_assessment_id
        type: string
        source: input
        description: "FK -> RiskAssessment.id; the assessment this trip is planned against; re-pointed by cascade when that assessment is superseded"
      - name: insurance_policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; the policy carried for this trip; any policy_type may be attached, but validations[priority=43] requires status == VERIFIED at submit-for-approval and additionally policy_type == MEDICAL_EVAC at a MEDEVAC triage; null until attached"
        default: null
      - name: trip_purpose
        type: enum
        source: input
        description: purpose of travel; PUBLIC_APPEARANCE adds CROWD_PLAN advance work and uplifts required_approval_level one step
        constraints: "one of BUSINESS_TRAVEL | PUBLIC_APPEARANCE | BOARD_EVENT"
      - name: primary_destination_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 code; MUST resolve to an existing DestinationRating.country_code
        constraints: "exactly 2 uppercase A-Z letters"
      - name: depart_at
        type: datetime
        source: input
        description: ISO-8601 UTC inclusive start of the trip window
      - name: return_at
        type: datetime
        source: input
        description: ISO-8601 UTC exclusive end of the trip window; MUST be > depart_at
      - name: cost_allocation_method
        type: enum
        source: input
        description: how calculations.perquisite_allocation splits total cost between the company and the protectee
        default: PRORATA
        constraints: "one of BUSINESS_ONLY | PRORATA | EXEC_PERQUISITE; BUSINESS_ONLY requires trip_purpose == BUSINESS_TRAVEL"
      - name: approval_state
        type: enum
        source: system
        description: approval dimension, see state_machines[entity=Trip, state_field=approval_state]
        default: DRAFT
        constraints: "one of DRAFT | PENDING_REVIEW | PENDING_COMPLIANCE | APPROVED | DENIED"
      - name: readiness_state
        type: enum
        source: system
        description: readiness dimension, see state_machines[entity=Trip, state_field=readiness_state]
        default: NOT_READY
        constraints: "one of NOT_READY | ADVANCE_IN_PROGRESS | READY | DEGRADED | CLOSED"
      - name: required_approval_level
        type: enum
        source: computed
        description: output of calculations.required_approval_level; recomputed whenever a leg is added or any leg_risk_band changes
        default: MANAGER
        constraints: "one of MANAGER | DIRECTOR | DIRECTOR_AND_COMPLIANCE"
      - name: max_leg_risk_band
        type: enum
        source: computed
        description: highest TripLeg.leg_risk_band across this trip's legs under the order LOW < MODERATE < HIGH < EXTREME; null when the trip has no legs
        default: null
        constraints: "nullable; one of LOW | MODERATE | HIGH | EXTREME"
      - name: provisional_security_cost_cents
        type: integer
        source: computed
        description: PROVISIONAL variant of calculations.trip_security_cost, frozen at submit-for-approval
        default: 0
      - name: total_security_cost_cents
        type: integer
        source: computed
        description: FINAL variant of calculations.trip_security_cost, computed at close
        default: 0
      - name: perquisite_taxable_cents
        type: integer
        source: computed
        description: protectee-borne share from calculations.perquisite_allocation, computed at close
        default: 0
      - name: business_borne_cents
        type: integer
        source: computed
        description: total_security_cost_cents - perquisite_taxable_cents, computed at close
        default: 0
      - name: perquisite_rate_applied
        type: number
        source: computed
        description: the PERQUISITE_TIERS rate actually applied at close, pinned for audit
        default: 0
        constraints: "one of 0.00 | 0.10 | 0.25 | 0.40 | 1.00"
      - name: check_in_interval_hours
        type: integer
        source: computed
        description: output of calculations.check_in_schedule; communication cadence the protectee must honor
        default: 24
      - name: next_check_in_due_at
        type: datetime
        source: computed
        description: clock instant the next SCHEDULED check-in is due; null before approval
        default: null
      - name: missed_check_in_count
        type: integer
        source: computed
        description: number of CheckIn rows on this trip whose late == true
        default: 0
      - name: duress_active
        type: boolean
        source: computed
        description: true once a DURESS CheckIn has been recorded on this trip; never cleared
        default: false
      - name: briefing_ack_at
        type: datetime
        source: system
        description: clock_now when the protectee acknowledged the pre-trip briefing
        default: null
      - name: denied_reason
        type: string
        source: input
        description: reason recorded by the decision action when decision == DENY
        default: null
        constraints: "nullable; required and 1..500 chars when decision == DENY"
      - name: closed_at
        type: datetime
        source: system
        description: clock_now at close
        default: null

  - name: TripLeg
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: trip_id
        type: string
        source: input
        description: "FK -> Trip.id; the itinerary this leg belongs to"
      - name: sequence_no
        type: integer
        source: input
        description: 1-based position of this leg within the trip; unique per trip
        constraints: ">= 1, unique per trip_id"
      - name: destination_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 code; MUST resolve to an existing DestinationRating.country_code
        constraints: "exactly 2 uppercase A-Z letters"
      - name: arrive_at
        type: datetime
        source: input
        description: ISO-8601 UTC inclusive start of on-ground presence; MUST be >= trip.depart_at
      - name: depart_at
        type: datetime
        source: input
        description: ISO-8601 UTC exclusive end of on-ground presence; MUST be > arrive_at and <= trip.return_at
      - name: leg_risk_band
        type: enum
        source: computed
        description: output of calculations.leg_risk_band; recomputed when the destination rating or the executive's threat_level changes
        constraints: "one of LOW | MODERATE | HIGH | EXTREME"
      - name: required_advance_items
        type: array
        source: computed
        description: ADVANCE_REQUIRED_BY_BAND[leg_risk_band] plus CROWD_PLAN when trip.trip_purpose == PUBLIC_APPEARANCE
        constraints: "array of ROUTE_SURVEY | HOTEL_SURVEY | HOSPITAL_SURVEY | COMMS_TEST | LOCAL_LIAISON | CROWD_PLAN"
      - name: completed_advance_items
        type: array
        source: computed
        description: advance item types recorded COMPLETE on this leg
        default: []
      - name: waived_advance_items
        type: array
        source: computed
        description: advance item types recorded WAIVED on this leg by a SecurityDirector
        default: []
      - name: advance_complete
        type: boolean
        source: computed
        description: true iff every member of required_advance_items appears in completed_advance_items or waived_advance_items
        default: false
      - name: lead_agent_covered
        type: boolean
        source: computed
        description: true iff some ProtectiveDetailAssignment with status == CONFIRMED, role_on_detail == LEAD_AGENT, starts_at <= arrive_at and ends_at >= depart_at exists on this leg
        default: false

  - name: ProtectiveDetailAssignment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: trip_leg_id
        type: string
        source: input
        description: "FK -> TripLeg.id; the leg this detail covers"
      - name: staff_id
        type: string
        source: input
        description: "FK -> SecurityStaff.id; the agent assigned"
      - name: role_on_detail
        type: enum
        source: input
        description: detail position, selects ROLE_MULTIPLIER in calculations.detail_assignment_cost
        constraints: "one of LEAD_AGENT | AGENT | DRIVER | ADVANCE"
      - name: starts_at
        type: datetime
        source: input
        description: ISO-8601 UTC inclusive start of the agent's window
      - name: ends_at
        type: datetime
        source: input
        description: ISO-8601 UTC exclusive end of the agent's window; MUST be > starts_at
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines[entity=ProtectiveDetailAssignment]
        default: CONFIRMED
        constraints: "one of CONFIRMED | RELEASED | CANCELLED"
      - name: planned_billable_hours
        type: integer
        source: computed
        description: ceil((ends_at - starts_at) in minutes / 60), frozen at creation
      - name: actual_ends_at
        type: datetime
        source: system
        description: ISO-8601 UTC instant supplied by the release action
        default: null
      - name: final_billable_hours
        type: integer
        source: computed
        description: max(MIN_BILLABLE_HOURS, ceil((actual_ends_at - starts_at) in minutes / 60)); null until RELEASED
        default: null
      - name: cost_cents
        type: integer
        source: computed
        description: output of calculations.detail_assignment_cost; PROVISIONAL basis at creation, FINAL basis at release, 0 when CANCELLED
        default: 0
      - name: cost_basis
        type: enum
        source: computed
        description: which variant produced cost_cents
        default: PROVISIONAL
        constraints: "one of PROVISIONAL | FINAL | VOID"
      - name: cancelled_reason
        type: string
        source: system
        description: cascade reason recorded when status becomes CANCELLED
        default: null

  - name: Vendor
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: vendor_name
        type: string
        source: input
        description: vendor legal name
        constraints: "1..120 chars, non-blank"
      - name: vendor_type
        type: enum
        source: input
        description: capability family this vendor can be activated for
        constraints: "one of MEDICAL_EVAC | GROUND_SECURITY | LOCAL_LIAISON | INTEL"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country the vendor operates in
        constraints: "exactly 2 uppercase A-Z letters"
      - name: max_concurrent_engagements
        type: integer
        source: input
        description: aggregate capacity — how many ACTIVE engagements may overlap at any instant
        constraints: ">= 1"
      - name: sla_response_minutes
        type: integer
        source: input
        description: contracted response time; primary ranking key in the incident vendor selector
        constraints: "> 0"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: engagement rate per hour in cents
        constraints: "> 0"
      - name: retainer_cents
        type: integer
        source: input
        description: flat activation retainer in cents charged once per engagement
        constraints: ">= 0"
      - name: activation_status
        type: enum
        source: system
        description: whether the vendor may be engaged
        default: AVAILABLE
        constraints: "one of AVAILABLE | SUSPENDED"
      - name: committed_engagement_hours
        type: integer
        source: computed
        description: sum of engagement_hours over this vendor's VendorEngagement rows whose status == ACTIVE
        default: 0
      - name: suspension_reason
        type: string
        source: input
        description: reason recorded by the suspend action
        default: null

  - name: VendorEngagement
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the engaged vendor"
      - name: trip_leg_id
        type: string
        source: input
        description: "FK -> TripLeg.id; the leg the vendor is engaged for"
      - name: incident_id
        type: string
        source: system
        description: "FK -> Incident.id; set only when the engagement was created by an incident triage cascade; null for planned engagements"
        default: null
      - name: engagement_purpose
        type: enum
        source: input
        description: what the vendor was engaged to do; MUST equal Vendor.vendor_type of the engaged vendor
        constraints: "one of MEDICAL_EVAC | GROUND_SECURITY | LOCAL_LIAISON | INTEL"
      - name: starts_at
        type: datetime
        source: input
        description: ISO-8601 UTC inclusive start of the engagement window
      - name: ends_at
        type: datetime
        source: input
        description: ISO-8601 UTC exclusive end of the engagement window; MUST be > starts_at
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines[entity=VendorEngagement]
        default: ACTIVE
        constraints: "one of ACTIVE | COMPLETED | CANCELLED"
      - name: engagement_hours
        type: integer
        source: computed
        description: ceil((ends_at - starts_at) in minutes / 60), frozen at creation
      - name: engagement_cost_cents
        type: integer
        source: computed
        description: retainer_cents + engagement_hours * hourly_rate_cents while ACTIVE or COMPLETED; forced to 0 when CANCELLED
        default: 0
      - name: cancelled_reason
        type: string
        source: system
        description: cascade reason recorded when status becomes CANCELLED
        default: null

  - name: Incident
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: trip_id
        type: string
        source: input
        description: "FK -> Trip.id; the trip the incident occurred on"
      - name: affected_leg_sequence_no
        type: integer
        source: input
        description: sequence_no of the TripLeg on this trip where the incident occurred; resolves to the unique TripLeg with trip_id == this.trip_id AND sequence_no == this value
        constraints: ">= 1; must resolve to an existing leg of the trip"
      - name: incident_type
        type: enum
        source: input
        description: nature of the event, constrains the permitted response_track
        constraints: "one of MEDICAL | UNREST | NATURAL_DISASTER"
      - name: severity
        type: integer
        source: input
        description: analyst-assigned severity
        constraints: "integer 1..5 inclusive"
      - name: status
        type: enum
        source: system
        description: lifecycle state, see state_machines[entity=Incident]
        default: REPORTED
        constraints: "one of REPORTED | MEDEVAC_ACTIVE | SHELTER_ACTIVE | EXTRACTION_ACTIVE | RESOLVED | CLOSED"
      - name: response_track
        type: enum
        source: input
        description: branch chosen at triage; null until the triage action runs
        default: null
        constraints: "nullable; one of MEDEVAC | SHELTER_IN_PLACE | EXTRACTION"
      - name: duress_flag
        type: boolean
        source: system
        description: true when the incident was auto-created by a DURESS check-in
        default: false
      - name: narrative
        type: string
        source: input
        description: free-text description of the event
        constraints: "1..1000 chars"
      - name: opened_at
        type: datetime
        source: system
        description: clock_now at report
      - name: triaged_at
        type: datetime
        source: system
        description: clock_now at triage
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: clock_now at resolve
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: clock_now at close
        default: null
      - name: response_cost_cents
        type: integer
        source: computed
        description: output of calculations.incident_response_cost, computed at close
        default: 0

  - name: CheckIn
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: trip_id
        type: string
        source: input
        description: "FK -> Trip.id; the trip this check-in belongs to"
      - name: kind
        type: enum
        source: input
        description: communication-protocol category
        constraints: "one of SCHEDULED | AD_HOC | DURESS"
      - name: reported_at
        type: datetime
        source: system
        description: clock_now when the check-in was received
      - name: location_country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 code the protectee reported; retained only within consent boundaries
        default: null
        constraints: "nullable; exactly 2 uppercase A-Z letters when present"
      - name: recorded_location_country_code
        type: string
        source: computed
        description: location_country_code when the consent gate permits retention, otherwise null
        default: null
      - name: location_withheld
        type: boolean
        source: computed
        description: true iff location_country_code was supplied but not retained because the consent gate refused it
        default: false
      - name: consent_scope_snapshot
        type: enum
        source: computed
        description: effective consent scope at reported_at — NONE when the executive's consent_expires_at is non-null and <= reported_at, otherwise Executive.consent_scope
        constraints: "one of NONE | TRIP_ONLY | CONTINUOUS"
      - name: late
        type: boolean
        source: computed
        description: true iff kind == SCHEDULED and reported_at > trip.next_check_in_due_at at the moment of recording
        default: false
      - name: note
        type: string
        source: input
        description: free-text message from the protectee
        default: null
        constraints: "nullable, 0..500 chars"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: RiskAssessment
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exec-protection/risk-assessments/{id}/submit"
        actor: SecurityAnalyst
        preconditions:
          - "assessment.status == DRAFT"
          - "assessment.authored_by_staff_id == X-User-ID"
          - "Executive(assessment.executive_id).residential_survey_status != PENDING (COMPLETE and DEFICIENT both pass, per validations[priority=28])"
        side_effects:
          - "public_exposure_component := calculations.public_exposure_score variant ROLLING_WINDOW for assessment.executive_id evaluated at clock_now"
          - "residential_component_snapshot := Executive.residential_component"
          - "composite_risk_score := calculations.composite_risk_score"
          - "submitted_at := clock_now"
          - "increments RiskAssessment.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /exec-protection/risk-assessments/{id}/submit"
        actor: SecurityAnalyst
        preconditions:
          - "assessment.status == RETURNED"
          - "assessment.authored_by_staff_id == X-User-ID"
          - "Executive(assessment.executive_id).residential_survey_status != PENDING (COMPLETE and DEFICIENT both pass, per validations[priority=28])"
        side_effects:
          - "public_exposure_component, residential_component_snapshot and composite_risk_score are recomputed exactly as on the DRAFT -> SUBMITTED edge, against the state of the signal log at this clock_now"
          - "submitted_at := clock_now"
          - "revision_round is NOT changed by submit"
          - "increments RiskAssessment.version by 1"
        note: "This edge closes the revision cycle SUBMITTED -> RETURNED -> SUBMITTED."
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /exec-protection/risk-assessments/{id}/review with outcome == RETURN"
        actor: SecurityDirector
        preconditions:
          - "assessment.status == SUBMITTED"
          - "review_notes present, 1..500 chars"
          - "revision_round + 1 <= MAX_REVISION_ROUNDS"
        side_effects:
          - "revision_round := revision_round + 1"
          - "review_notes := request review_notes"
          - "increments RiskAssessment.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /exec-protection/risk-assessments/{id}/review with outcome == RETURN when revision_round + 1 > MAX_REVISION_ROUNDS"
        actor: SecurityDirector
        preconditions:
          - "assessment.status == SUBMITTED"
          - "review_notes present, 1..500 chars"
          - "revision_round + 1 > MAX_REVISION_ROUNDS"
        side_effects:
          - "revision_round := revision_round + 1"
          - "status := VOIDED (terminal); the assessment can never be submitted or approved again"
          - "increments RiskAssessment.version by 1"
        note: "Boundary: with MAX_REVISION_ROUNDS == 3 the 1st, 2nd and 3rd RETURN yield RETURNED (revision_round 1,2,3); the 4th yields VOIDED (revision_round 4)."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /exec-protection/risk-assessments/{id}/review with outcome == APPROVE"
        actor: SecurityDirector
        preconditions:
          - "assessment.status == SUBMITTED"
          - "X-User-ID != assessment.authored_by_staff_id (segregation of duties)"
        side_effects:
          - "CASCADE CH-B hop 1: approved_by_staff_id := X-User-ID; approved_at := clock_now; Executive.threat_level := calculations.executive_threat_level(this.composite_risk_score)"
          - "CASCADE CH-B hop 2: because this row became APPROVED, the prior assessment Y — the unique RiskAssessment with executive_id == this.executive_id AND status == APPROVED AND id != this.id — transitions APPROVED -> SUPERSEDED and this.supersedes_assessment_id := Y.id (null when no such Y exists)"
          - "CASCADE CH-B hop 3: because Y is now SUPERSEDED, every Trip with risk_assessment_id == Y.id AND readiness_state != CLOSED is re-pointed: risk_assessment_id := this.id"
          - "CASCADE CH-B hop 4: because those trips now reference this assessment (and the executive's threat_level moved), each of their TripLeg rows recomputes leg_risk_band and required_advance_items, each trip recomputes max_leg_risk_band, required_approval_level and check_in_interval_hours; a re-pointed trip whose approval_state == APPROVED and whose required_approval_level increased reverts approval_state := PENDING_REVIEW and clears briefing_ack_at := null; a re-pointed trip whose readiness_state == READY but which now has a leg with advance_complete == false moves readiness_state := DEGRADED and increments Executive.open_degraded_trip_count"
          - "increments RiskAssessment.version by 1 on this row, on Y, and on every mutated Trip / TripLeg"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — cascade hop 2 of a later assessment's approval for the same executive"
        actor: system
        preconditions:
          - "a different RiskAssessment for the same executive_id transitioned SUBMITTED -> APPROVED"
        side_effects:
          - "no further transitions are possible from SUPERSEDED"
          - "increments RiskAssessment.version by 1"

  - entity: Trip
    state_field: approval_state
    shape: branching
    initial_state: DRAFT
    terminal_states: [DENIED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /exec-protection/trips/{id}/submit-for-approval"
        actor: ProtectionManager
        preconditions:
          - "trip.approval_state == DRAFT"
          - "trip has at least one TripLeg (else ERR_TRIP_HAS_NO_LEGS)"
          - "RiskAssessment(trip.risk_assessment_id).status == APPROVED"
          - "every TripLeg of the trip has advance_complete == true"
          - "trip.insurance_policy_id is non-null, that policy's status == VERIFIED, effective_from <= trip.depart_at, effective_to >= trip.return_at, and no leg destination_country_code appears in its excluded_country_codes"
          - "that policy's coverage_cents >= max over the trip's legs of DestinationRating(leg.destination_country_code).insurance_required_coverage_cents"
          - "when max_leg_risk_band IN {HIGH, EXTREME}: trip.briefing_ack_at is non-null"
          - "Executive.remaining_budget_cents >= the PROVISIONAL cost computed by this transition"
        side_effects:
          - "provisional_security_cost_cents := calculations.trip_security_cost variant PROVISIONAL"
          - "Executive.committed_budget_cents += provisional_security_cost_cents; remaining_budget_cents recomputed"
          - "check_in_interval_hours := calculations.check_in_schedule; next_check_in_due_at := max(trip.depart_at, clock_now) + check_in_interval_hours"
          - "increments Trip.version by 1"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /exec-protection/trips/{id}/decision with decision == APPROVE by a SecurityDirector when required_approval_level IN {MANAGER, DIRECTOR}"
        actor: SecurityDirector
        preconditions:
          - "trip.approval_state == PENDING_REVIEW"
          - "trip.required_approval_level IN {MANAGER, DIRECTOR}"
          - "X-User-ID != trip.created_by_staff_id (segregation of duties)"
          - "trip.readiness_state IN {READY, ADVANCE_IN_PROGRESS}"
        side_effects:
          - "readiness_state := READY when every leg has advance_complete == true AND lead_agent_covered == true"
          - "increments Trip.version by 1"
      - from: PENDING_REVIEW
        to: PENDING_COMPLIANCE
        trigger: "POST /exec-protection/trips/{id}/decision with decision == APPROVE by a SecurityDirector when required_approval_level == DIRECTOR_AND_COMPLIANCE"
        actor: SecurityDirector
        preconditions:
          - "trip.approval_state == PENDING_REVIEW"
          - "trip.required_approval_level == DIRECTOR_AND_COMPLIANCE"
          - "X-User-ID != trip.created_by_staff_id (segregation of duties)"
        side_effects:
          - "increments Trip.version by 1"
        note: "Fork point: the same endpoint and payload lands in APPROVED or PENDING_COMPLIANCE depending on the computed required_approval_level."
      - from: PENDING_COMPLIANCE
        to: APPROVED
        trigger: "POST /exec-protection/trips/{id}/decision with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "trip.approval_state == PENDING_COMPLIANCE"
          - "trip.cost_allocation_method != BUSINESS_ONLY OR trip.trip_purpose == BUSINESS_TRAVEL"
        side_effects:
          - "readiness_state := READY when every leg has advance_complete == true AND lead_agent_covered == true"
          - "increments Trip.version by 1"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /exec-protection/trips/{id}/decision with decision == DENY"
        actor: SecurityDirector
        preconditions:
          - "trip.approval_state == PENDING_REVIEW"
          - "denied_reason present, 1..500 chars"
          - "X-User-ID != trip.created_by_staff_id (segregation of duties)"
        side_effects:
          - "CASCADE CH-D hop 1: approval_state := DENIED; denied_reason recorded"
          - "CASCADE CH-D hop 2: because the trip is DENIED, every ProtectiveDetailAssignment whose trip_leg_id belongs to this trip and whose status == CONFIRMED transitions CONFIRMED -> CANCELLED with cost_cents := 0, cost_basis := VOID, cancelled_reason := 'TRIP_DENIED'"
          - "CASCADE CH-D hop 3: because those assignments are CANCELLED, each affected SecurityStaff.committed_detail_hours decreases by that assignment's planned_billable_hours, and Executive.committed_budget_cents decreases by trip.provisional_security_cost_cents with remaining_budget_cents recomputed"
          - "increments Trip.version by 1 and each cancelled assignment's version by 1"
      - from: PENDING_COMPLIANCE
        to: DENIED
        trigger: "POST /exec-protection/trips/{id}/decision with decision == DENY"
        actor: ComplianceOfficer
        preconditions:
          - "trip.approval_state == PENDING_COMPLIANCE"
          - "denied_reason present, 1..500 chars"
        side_effects:
          - "identical to the PENDING_REVIEW -> DENIED edge, including CASCADE CH-D hops 2 and 3"
          - "increments Trip.version by 1"
      - from: APPROVED
        to: PENDING_REVIEW
        trigger: "system — cascade CH-B hop 4 or CASCADE CH-C hop 4 raised required_approval_level"
        actor: system
        preconditions:
          - "trip.approval_state == APPROVED AND readiness_state != CLOSED"
          - "the recomputed required_approval_level is strictly higher than the level in force when the trip was approved, under the order MANAGER < DIRECTOR < DIRECTOR_AND_COMPLIANCE"
        side_effects:
          - "briefing_ack_at := null (the acknowledged briefing no longer reflects the destination posture)"
          - "increments Trip.version by 1"

  - entity: Trip
    state_field: readiness_state
    shape: cyclic
    initial_state: NOT_READY
    terminal_states: [CLOSED]
    transitions:
      - from: NOT_READY
        to: ADVANCE_IN_PROGRESS
        trigger: "POST /exec-protection/trip-legs/{id}/advance-progress (first item recorded on any leg of the trip)"
        actor: ProtectionManager
        preconditions:
          - "trip.readiness_state == NOT_READY"
          - "at least one leg of the trip now has a non-empty completed_advance_items or waived_advance_items"
        side_effects:
          - "increments Trip.version by 1"
      - from: ADVANCE_IN_PROGRESS
        to: NOT_READY
        trigger: "system — cascade CH-A hop 4 / CASCADE CH-C hop 3 removed the trip's only recorded advance item"
        actor: system
        preconditions:
          - "trip.readiness_state == ADVANCE_IN_PROGRESS"
          - "every leg of the trip now has empty completed_advance_items and empty waived_advance_items"
        side_effects:
          - "increments Trip.version by 1"
        note: "Reverse edge — readiness is re-derived, not ratcheted."
      - from: ADVANCE_IN_PROGRESS
        to: READY
        trigger: "POST /exec-protection/trips/{id}/decision with decision == APPROVE reaching approval_state APPROVED"
        actor: SecurityDirector | ComplianceOfficer
        preconditions:
          - "the approval transition to APPROVED succeeded"
          - "every leg has advance_complete == true AND lead_agent_covered == true"
        side_effects:
          - "next_check_in_due_at := max(trip.depart_at, clock_now) + check_in_interval_hours"
          - "increments Trip.version by 1"
      - from: READY
        to: DEGRADED
        trigger: "system — cascade CH-A hop 4, CASCADE CH-B hop 4, CASCADE CH-C hop 3, CASCADE CH-E hop 2, missed-check-in escalation, or release of the last covering LEAD_AGENT assignment"
        actor: system
        preconditions:
          - "trip.readiness_state == READY"
          - "at least one of: some leg has advance_complete == false; some leg has lead_agent_covered == false; trip.duress_active == true; trip.missed_check_in_count >= MISSED_CHECKIN_ESCALATION"
        side_effects:
          - "check_in_interval_hours := DEGRADED_CHECK_IN_INTERVAL_HOURS, or DURESS_CHECK_IN_INTERVAL_HOURS when duress_active == true"
          - "next_check_in_due_at := min(next_check_in_due_at, clock_now + check_in_interval_hours)"
          - "Executive.open_degraded_trip_count += 1"
          - "increments Trip.version by 1"
      - from: DEGRADED
        to: READY
        trigger: "POST /exec-protection/trip-legs/{id}/advance-progress or POST /exec-protection/detail-assignments restoring full coverage"
        actor: ProtectionManager
        preconditions:
          - "trip.readiness_state == DEGRADED"
          - "trip.approval_state == APPROVED"
          - "trip.duress_active == false"
          - "trip.missed_check_in_count < MISSED_CHECKIN_ESCALATION"
          - "every leg has advance_complete == true AND lead_agent_covered == true"
        side_effects:
          - "check_in_interval_hours := calculations.check_in_schedule (band-derived value, no degradation floor)"
          - "Executive.open_degraded_trip_count -= 1"
          - "increments Trip.version by 1"
        note: "Closes the readiness cycle READY -> DEGRADED -> READY. A trip whose duress_active is true can never return to READY."
      - from: READY
        to: CLOSED
        trigger: "POST /exec-protection/trips/{id}/close"
        actor: ProtectionManager
        preconditions:
          - "trip.readiness_state IN {READY, DEGRADED}"
          - "trip.approval_state == APPROVED"
          - "clock_now >= trip.return_at"
          - "no Incident on this trip has status != CLOSED"
          - "no ProtectiveDetailAssignment on this trip's legs has status == CONFIRMED"
        side_effects:
          - "total_security_cost_cents := calculations.trip_security_cost variant FINAL"
          - "perquisite_rate_applied and perquisite_taxable_cents := calculations.perquisite_allocation; business_borne_cents := total_security_cost_cents - perquisite_taxable_cents"
          - "Executive.committed_budget_cents -= provisional_security_cost_cents; Executive.spent_budget_cents += total_security_cost_cents; remaining_budget_cents recomputed"
          - "Executive.annual_disclosed_perquisite_cents += perquisite_taxable_cents; Executive.business_borne_security_cents += business_borne_cents"
          - "closed_at := clock_now; next_check_in_due_at := null"
          - "increments Trip.version by 1"
      - from: DEGRADED
        to: CLOSED
        trigger: "POST /exec-protection/trips/{id}/close"
        actor: ProtectionManager
        preconditions:
          - "identical to the READY -> CLOSED edge"
        side_effects:
          - "identical to the READY -> CLOSED edge, plus Executive.open_degraded_trip_count -= 1"
          - "increments Trip.version by 1"

  - entity: ProtectiveDetailAssignment
    state_field: status
    shape: branching_with_compensation
    initial_state: CONFIRMED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: null
        to: CONFIRMED
        trigger: "POST /exec-protection/detail-assignments"
        actor: ProtectionManager
        preconditions:
          - "SecurityStaff(staff_id).certification_expires_at > the request's ends_at, exactly as stated by validations[priority=29]; an equal instant fails"
          - "RiskAssessment(Trip(TripLeg.trip_id).risk_assessment_id).status == APPROVED"
          - "Trip(TripLeg.trip_id).approval_state != DENIED AND readiness_state != CLOSED"
          - "no existing CONFIRMED assignment for the same staff_id collides under the REST_BUFFER_HOURS rule in validations[priority=33]"
          - "request expected_trip_leg_version == TripLeg.version"
        side_effects:
          - "planned_billable_hours := ceil((ends_at - starts_at) minutes / 60); cost_cents := calculations.detail_assignment_cost variant PROVISIONAL; cost_basis := PROVISIONAL"
          - "SecurityStaff.committed_detail_hours += planned_billable_hours"
          - "TripLeg.lead_agent_covered recomputed; increments TripLeg.version by 1"
          - "owning Trip: readiness_state DEGRADED -> READY when coverage is now complete (see Trip readiness machine)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /exec-protection/detail-assignments/{id}/release"
        actor: ProtectionManager
        preconditions:
          - "assignment.status == CONFIRMED"
          - "request actual_ends_at > assignment.starts_at"
        side_effects:
          - "actual_ends_at := request actual_ends_at; final_billable_hours := max(MIN_BILLABLE_HOURS, ceil((actual_ends_at - starts_at) minutes / 60))"
          - "cost_cents := calculations.detail_assignment_cost variant FINAL; cost_basis := FINAL"
          - "SecurityStaff.committed_detail_hours -= planned_billable_hours; SecurityStaff.released_detail_hours += final_billable_hours"
          - "TripLeg.lead_agent_covered recomputed; when it flips to false the owning Trip moves readiness_state READY -> DEGRADED"
          - "increments ProtectiveDetailAssignment.version and TripLeg.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system — cascade CH-D hop 2 on trip denial, or the EXTRACTION branch of POST /exec-protection/incidents/{id}/triage"
        actor: system
        preconditions:
          - "assignment.status == CONFIRMED"
          - "either the owning trip transitioned to approval_state DENIED (cancels EVERY CONFIRMED assignment on the trip), or an Incident on the owning trip was triaged onto response_track EXTRACTION (cancels only those assignments whose starts_at > clock_now)"
        side_effects:
          - "cost_cents := 0; cost_basis := VOID; cancelled_reason := 'TRIP_DENIED' on the denial path and 'EXTRACTION' on the incident path"
          - "SecurityStaff.committed_detail_hours -= planned_billable_hours (restoring the pre-creation value)"
          - "increments ProtectiveDetailAssignment.version by 1"

  - entity: VendorEngagement
    state_field: status
    shape: branching_with_compensation
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /exec-protection/vendor-engagements (manual) or incident triage cascade (automatic)"
        actor: ProtectionManager | system
        preconditions:
          - "Vendor(vendor_id).activation_status == AVAILABLE"
          - "engagement_purpose == Vendor(vendor_id).vendor_type"
          - "Vendor(vendor_id).country_code == TripLeg(trip_leg_id).destination_country_code"
          - "aggregate-capacity rule in validations[priority=39] is satisfied"
          - "request expected_vendor_version == Vendor.version (manual creations only)"
        side_effects:
          - "engagement_hours := ceil((ends_at - starts_at) minutes / 60); engagement_cost_cents := Vendor.retainer_cents + engagement_hours * Vendor.hourly_rate_cents"
          - "Vendor.committed_engagement_hours += engagement_hours; increments Vendor.version by 1"
          - "when engagement_purpose == LOCAL_LIAISON: LOCAL_LIAISON becomes eligible to be recorded COMPLETE on TripLeg(trip_leg_id)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /exec-protection/vendor-engagements/{id}/complete"
        actor: ProtectionManager
        preconditions:
          - "engagement.status == ACTIVE"
        side_effects:
          - "Vendor.committed_engagement_hours -= engagement_hours; increments Vendor.version by 1"
          - "engagement_cost_cents unchanged (it enters the trip's FINAL cost when incident_id is null, or the incident's response cost when incident_id is set)"
          - "increments VendorEngagement.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system — cascade CH-A hop 2 on vendor suspension"
        actor: system
        preconditions:
          - "engagement.status == ACTIVE"
          - "Vendor(vendor_id).activation_status transitioned AVAILABLE -> SUSPENDED"
        side_effects:
          - "engagement_cost_cents := 0; cancelled_reason := 'VENDOR_SUSPENDED'"
          - "Vendor.committed_engagement_hours -= engagement_hours (restoring the pre-creation value)"
          - "CASCADE CH-A hop 3: when engagement_purpose == LOCAL_LIAISON, LOCAL_LIAISON is removed from TripLeg(trip_leg_id).completed_advance_items and advance_complete is recomputed"
          - "increments VendorEngagement.version and TripLeg.version by 1"

  - entity: Incident
    state_field: status
    shape: branching_fork_join
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: MEDEVAC_ACTIVE
        trigger: "POST /exec-protection/incidents/{id}/triage with response_track == MEDEVAC"
        actor: ProtectionManager
        preconditions:
          - "incident.status == REPORTED"
          - "incident_type IN {MEDICAL, NATURAL_DISASTER}"
          - "Trip(trip_id).insurance_policy_id is non-null and that policy's status == VERIFIED"
          - "that policy's policy_type == MEDICAL_EVAC and coverage_cents >= DestinationRating(affected leg's destination_country_code).insurance_required_coverage_cents"
          - "the vendor selector in calculations.incident_vendor_selection returns a non-empty candidate set"
        side_effects:
          - "status := MEDEVAC_ACTIVE; triaged_at := clock_now; response_track := MEDEVAC"
          - "a VendorEngagement is auto-created (status ACTIVE, incident_id := this.id, engagement_purpose MEDICAL_EVAC, trip_leg_id := the affected leg, starts_at := clock_now, ends_at := clock_now + 24h) against the vendor chosen by calculations.incident_vendor_selection"
          - "Trip.readiness_state READY -> DEGRADED; Trip.check_in_interval_hours := DEGRADED_CHECK_IN_INTERVAL_HOURS"
          - "increments Incident.version, Vendor.version and Trip.version by 1"
      - from: REPORTED
        to: SHELTER_ACTIVE
        trigger: "POST /exec-protection/incidents/{id}/triage with response_track == SHELTER_IN_PLACE"
        actor: ProtectionManager
        preconditions:
          - "incident.status == REPORTED"
          - "incident_type IN {UNREST, NATURAL_DISASTER}"
          - "the vendor selector in calculations.incident_vendor_selection returns a non-empty candidate set for vendor_type GROUND_SECURITY"
        side_effects:
          - "status := SHELTER_ACTIVE; triaged_at := clock_now; response_track := SHELTER_IN_PLACE"
          - "a VendorEngagement is auto-created (GROUND_SECURITY, incident_id := this.id, clock_now .. clock_now + 24h)"
          - "Trip.check_in_interval_hours := DEGRADED_CHECK_IN_INTERVAL_HOURS; next_check_in_due_at := clock_now + DEGRADED_CHECK_IN_INTERVAL_HOURS; readiness_state READY -> DEGRADED"
          - "no insurance precondition applies on this branch — this is the branch-divergent behavior"
          - "increments Incident.version, Vendor.version and Trip.version by 1"
      - from: REPORTED
        to: EXTRACTION_ACTIVE
        trigger: "POST /exec-protection/incidents/{id}/triage with response_track == EXTRACTION"
        actor: ProtectionManager
        preconditions:
          - "incident.status == REPORTED"
          - "incident_type == UNREST"
          - "incident.severity >= 4"
          - "the vendor selector in calculations.incident_vendor_selection returns a non-empty candidate set for vendor_type GROUND_SECURITY"
        side_effects:
          - "status := EXTRACTION_ACTIVE; triaged_at := clock_now; response_track := EXTRACTION"
          - "a VendorEngagement is auto-created (GROUND_SECURITY, incident_id := this.id, clock_now .. clock_now + 24h)"
          - "every ProtectiveDetailAssignment on the trip's legs with status == CONFIRMED and starts_at > clock_now transitions CONFIRMED -> CANCELLED with cost_cents := 0, cost_basis := VOID and cancelled_reason := 'EXTRACTION'; an assignment whose starts_at <= clock_now is already under way and is left CONFIRMED (branch-divergent: the other two tracks leave every assignment untouched). Each affected SecurityStaff.committed_detail_hours falls out of Q_STAFF_HOURS automatically because that ledger sums only CONFIRMED rows; Executive.committed_budget_cents is NOT touched here — the trip's provisional commitment is reversed only by DENY or close"
          - "Trip.readiness_state READY -> DEGRADED; check_in_interval_hours := DEGRADED_CHECK_IN_INTERVAL_HOURS"
          - "increments Incident.version, Vendor.version, Trip.version and each cancelled assignment's version by 1"
      - from: MEDEVAC_ACTIVE
        to: RESOLVED
        trigger: "POST /exec-protection/incidents/{id}/resolve"
        actor: ProtectionManager
        preconditions:
          - "incident.status IN {MEDEVAC_ACTIVE, SHELTER_ACTIVE, EXTRACTION_ACTIVE}"
          - "every VendorEngagement with incident_id == this.id has status IN {COMPLETED, CANCELLED}"
        side_effects:
          - "resolved_at := clock_now"
          - "increments Incident.version by 1"
        note: "Join point: all three branches converge on RESOLVED through this single edge."
      - from: SHELTER_ACTIVE
        to: RESOLVED
        trigger: "POST /exec-protection/incidents/{id}/resolve"
        actor: ProtectionManager
        preconditions:
          - "identical to the MEDEVAC_ACTIVE -> RESOLVED edge"
        side_effects:
          - "resolved_at := clock_now"
          - "increments Incident.version by 1"
      - from: EXTRACTION_ACTIVE
        to: RESOLVED
        trigger: "POST /exec-protection/incidents/{id}/resolve"
        actor: ProtectionManager
        preconditions:
          - "identical to the MEDEVAC_ACTIVE -> RESOLVED edge"
        side_effects:
          - "resolved_at := clock_now"
          - "increments Incident.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /exec-protection/incidents/{id}/close"
        actor: SecurityDirector
        preconditions:
          - "incident.status == RESOLVED"
        side_effects:
          - "response_cost_cents := calculations.incident_response_cost"
          - "closed_at := clock_now"
          - "increments Incident.version by 1"

  - entity: InsurancePolicy
    state_field: status
    shape: linear_with_branch
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /exec-protection/insurance-policies/{id}/verify with outcome == VERIFY"
        actor: ComplianceOfficer
        preconditions:
          - "policy.status == UNVERIFIED"
          - "policy.effective_to > clock_now"
        side_effects:
          - "verified_at := clock_now; verification_note recorded"
          - "increments InsurancePolicy.version by 1"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /exec-protection/insurance-policies/{id}/verify with outcome == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "policy.status == UNVERIFIED"
          - "verification_note present, 1..500 chars"
        side_effects:
          - "verification_note recorded; the policy can never be attached to a trip submission"
          - "increments InsurancePolicy.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: detail-assignment-create-stale-leg
    parent_entity: TripLeg
    write_endpoint: "POST /exec-protection/detail-assignments"
    occ_field: "expected_trip_leg_version"
    description: |
      Creating a ProtectiveDetailAssignment against a TripLeg whose version has
      advanced since the client last observed it is rejected. Two assignments
      for different agents over non-colliding windows on the same leg are both
      legitimate under §1.5, so this is not a state precondition: the rejection
      exists because the leg's version advances whenever its risk band,
      required advance set or coverage flag is re-derived, and a writer holding
      a stale view may be planning coverage against a band that no longer
      applies.
    error_id: ERR_STALE_TRIP_LEG_VERSION
    http_status: 412

  - rule_id: vendor-engagement-create-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /exec-protection/vendor-engagements"
    occ_field: "expected_vendor_version"
    description: |
      Creating a VendorEngagement against a Vendor whose version has advanced
      since the client last observed it is rejected. Overlapping engagements on
      one vendor are legitimate up to max_concurrent_engagements, so a second
      create is not blocked by any state field; the rejection exists because
      every engagement create, complete, cancel or suspension advances the
      vendor's version, and a stale writer's capacity and rate view is no
      longer the vendor's.
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: public_exposure_score
    trigger: "on POST /exec-protection/executives/{id}/exposure-signals (DECAY_WEIGHTED, writes Executive.public_exposure_score) and on POST /exec-protection/risk-assessments/{id}/submit (ROLLING_WINDOW, writes RiskAssessment.public_exposure_component)"
    algorithm: decay_function
    formula: |
      age_days(s)  = floor((clock_now - s.observed_at) / 86400 seconds)   # whole days, floor
      in_window(s) = (age_days(s) >= 0) AND (age_days(s) < EXPOSURE_WINDOW_DAYS)   # half-open at 90
      w_DECAY(s)   = 0.5 ** (age_days(s) / EXPOSURE_HALF_LIFE_DAYS)       # real-valued
      w_ROLLING(s) = 1
      raw(variant) = SUM over s in window, accumulated in s.observed_at ASC then
                     s.created_at ASC order, of
                     s.severity * SIGNAL_TYPE_MULTIPLIER[s.signal_type] * w_variant(s)
      score        = min(EXPOSURE_SCORE_CAP, round_half_up(raw * EXPOSURE_SCALE, 2))
      # rounding happens exactly once, after scaling and before the cap comparison
    input_set: "PublicExposureSignal rows with executive_id == the executive and in_window(s) == true. Signals older than the window are excluded outright, not down-weighted. There is no status filter — PublicExposureSignal is an append-only log with no lifecycle."
    constants:
      EXPOSURE_WINDOW_DAYS: 90
      EXPOSURE_HALF_LIFE_DAYS: 30
      EXPOSURE_SCALE: 5
      EXPOSURE_SCORE_CAP: 100.00
      SIGNAL_TYPE_MULTIPLIER: { MEDIA_MENTION: 1.0, SOCIAL_GEOTAG: 1.5, PUBLIC_FILING: 0.5, PROTEST_MENTION: 2.0 }
    precision: "2 decimal places, round_half_up, applied once at the end"
    variants:
      - name: DECAY_WEIGHTED
        when: "continuous monitoring — every write of Executive.public_exposure_score"
        difference: "each in-window signal is multiplied by w_DECAY(s), so a 30-day-old signal contributes half of its severity and a 60-day-old signal a quarter"
      - name: ROLLING_WINDOW
        when: "assessment snapshot — every write of RiskAssessment.public_exposure_component at submit"
        difference: "every in-window signal is counted at full weight (w == 1) regardless of age; for identical signal sets this variant returns a value >= the DECAY_WEIGHTED value and the two differ whenever any in-window signal has age_days > 0"

  - name: composite_risk_score
    trigger: "on POST /exec-protection/risk-assessments/{id}/submit (both the DRAFT -> SUBMITTED and RETURNED -> SUBMITTED edges); writes RiskAssessment.composite_risk_score"
    algorithm: weighted_scoring
    formula: |
      base      = 0.45 * threat_monitoring_score
                + 0.35 * public_exposure_component        # ROLLING_WINDOW value just written
                + 0.20 * residential_component_snapshot
      uplifted  = base * TIER_UPLIFT[Executive.tier]
      protest   = EXISTS s in the same in-window signal set used for
                  public_exposure_component with s.signal_type == PROTEST_MENTION
                  AND s.severity >= 4
      floored   = uplifted            when protest == false
                = max(uplifted, PROTEST_FLOOR)  when protest == true
      composite = min(100.00, round_half_up(floored, 2))
      # evaluation order is pinned: weight -> tier uplift -> protest floor -> cap -> round
    input_set: "the three component scores on this RiskAssessment row after the submit-time refresh, plus Executive.tier and the same PublicExposureSignal window that produced public_exposure_component"
    constants:
      RISK_WEIGHT_THREAT: 0.45
      RISK_WEIGHT_EXPOSURE: 0.35
      RISK_WEIGHT_RESIDENTIAL: 0.20
      TIER_UPLIFT: { TIER_1: 1.20, TIER_2: 1.10, TIER_3: 1.00 }
      PROTEST_FLOOR: 60.00
    precision: "2 decimal places, round_half_up"

  - name: executive_threat_level
    trigger: "cascade CH-B hop 1 of POST /exec-protection/risk-assessments/{id}/review with outcome == APPROVE; writes Executive.threat_level"
    algorithm: threshold
    formula: |
      c = the newly APPROVED RiskAssessment.composite_risk_score
      threat_level = LOW        when c < 30.00
                   = ELEVATED   when 30.00 <= c < 55.00
                   = HIGH       when 55.00 <= c < 80.00
                   = SEVERE     when c >= 80.00
    input_set: "exactly the assessment being approved; no other assessment contributes"
    constants:
      THREAT_ELEVATED_AT: 30.00
      THREAT_HIGH_AT: 55.00
      THREAT_SEVERE_AT: 80.00
    precision: "comparisons on the stored 2-decimal value; lower bounds inclusive, upper bounds exclusive"

  - name: destination_composite_score
    trigger: "on POST /exec-protection/destination-ratings and PATCH /exec-protection/destination-ratings/{country_code}; writes composite_destination_score, rating_band, insurance_required_coverage_cents"
    algorithm: weighted_scoring
    formula: |
      composite = round_half_up( 0.30 * crime_index
                               + 0.30 * political_instability_index
                               + 0.20 * (100 - medical_infrastructure_index)
                               + 0.20 * natural_hazard_index , 2)
      rating_band = LOW      when composite < 25.00
                  = MODERATE when 25.00 <= composite < 50.00
                  = HIGH     when 50.00 <= composite < 75.00
                  = EXTREME  when composite >= 75.00
      insurance_required_coverage_cents = INSURANCE_REQUIRED_COVERAGE_CENTS[rating_band]
    input_set: "the four indices on this DestinationRating row only"
    constants:
      DEST_WEIGHT_CRIME: 0.30
      DEST_WEIGHT_POLITICAL: 0.30
      DEST_WEIGHT_MEDICAL_INVERSE: 0.20
      DEST_WEIGHT_HAZARD: 0.20
      BAND_MODERATE_AT: 25.00
      BAND_HIGH_AT: 50.00
      BAND_EXTREME_AT: 75.00
      INSURANCE_REQUIRED_COVERAGE_CENTS: { LOW: 25000000, MODERATE: 50000000, HIGH: 150000000, EXTREME: 500000000 }
    precision: "2 decimal places, round_half_up; medical_infrastructure_index enters inverted as (100 - value)"

  - name: leg_risk_band
    trigger: "on POST /exec-protection/trips/{id}/legs, and on every cascade that recomputes a leg (CH-B hop 4, CH-C hop 2); writes TripLeg.leg_risk_band"
    algorithm: threshold
    formula: |
      d        = DestinationRating(leg.destination_country_code).composite_destination_score
      adjusted = min(100.00, round_half_up(d + THREAT_UPLIFT[Executive.threat_level], 2))
      leg_risk_band = LOW      when adjusted < 25.00
                    = MODERATE when 25.00 <= adjusted < 50.00
                    = HIGH     when 50.00 <= adjusted < 75.00
                    = EXTREME  when adjusted >= 75.00
    input_set: "the leg's destination rating and the trip's executive threat_level at evaluation time; the executive is Trip(leg.trip_id).executive_id"
    constants:
      THREAT_UPLIFT: { LOW: 0, ELEVATED: 5, HIGH: 10, SEVERE: 20 }
    precision: "2 decimal places, round_half_up; same band cut-points as destination_composite_score"

  - name: advance_requirement_set
    trigger: "whenever TripLeg.leg_risk_band or Trip.trip_purpose is written; writes TripLeg.required_advance_items and re-derives advance_complete"
    algorithm: constraint_propagation
    formula: |
      required = ADVANCE_REQUIRED_BY_BAND[leg.leg_risk_band]
      if Trip(leg.trip_id).trip_purpose == PUBLIC_APPEARANCE: required = required + [CROWD_PLAN]
      required is emitted in the canonical order
        [ROUTE_SURVEY, HOTEL_SURVEY, HOSPITAL_SURVEY, COMMS_TEST, LOCAL_LIAISON, CROWD_PLAN]
        filtered to members of the set
      advance_complete = required is a subset of (completed_advance_items UNION waived_advance_items)
      # shrinking the required set (band lowered) can flip advance_complete to true;
      # expanding it (band raised) can flip it to false. Items already recorded are
      # never discarded by a band change — only by cascade CH-A hop 3.
    input_set: "the leg's band and the owning trip's purpose"
    constants:
      ADVANCE_REQUIRED_BY_BAND:
        LOW: [ROUTE_SURVEY]
        MODERATE: [ROUTE_SURVEY, HOTEL_SURVEY]
        HIGH: [ROUTE_SURVEY, HOTEL_SURVEY, HOSPITAL_SURVEY, COMMS_TEST]
        EXTREME: [ROUTE_SURVEY, HOTEL_SURVEY, HOSPITAL_SURVEY, COMMS_TEST, LOCAL_LIAISON]
    precision: "exact set membership; array order is canonical, not insertion order"

  - name: required_approval_level
    trigger: "whenever a leg is created or any leg_risk_band changes; writes Trip.max_leg_risk_band and Trip.required_approval_level"
    algorithm: threshold
    formula: |
      LEVEL_ORDER = [MANAGER, DIRECTOR, DIRECTOR_AND_COMPLIANCE]
      BAND_ORDER  = [LOW, MODERATE, HIGH, EXTREME]
      max_leg_risk_band = the BAND_ORDER-maximum leg_risk_band over the trip's legs
                          (null when the trip has zero legs)
      base  = MANAGER                  when max_leg_risk_band == LOW or is null
            = DIRECTOR                 when max_leg_risk_band IN {MODERATE, HIGH}
            = DIRECTOR_AND_COMPLIANCE  when max_leg_risk_band == EXTREME
      lvl_1 = base                                       when trip_purpose != PUBLIC_APPEARANCE
            = next level up in LEVEL_ORDER, capped at
              DIRECTOR_AND_COMPLIANCE                    when trip_purpose == PUBLIC_APPEARANCE
      lvl_2 = DIRECTOR_AND_COMPLIANCE  when Executive.tier == TIER_1
                                        AND max_leg_risk_band IN {HIGH, EXTREME}
            = lvl_1                     otherwise
      required_approval_level = LEVEL_ORDER-maximum of (lvl_1, lvl_2)
      # evaluation order pinned: band base -> purpose step-up -> tier override -> max
    input_set: "every TripLeg of the trip regardless of sequence_no; a trip with zero legs yields max_leg_risk_band null and required_approval_level MANAGER, and its submit is rejected by ERR_TRIP_HAS_NO_LEGS before the level is ever used"
    constants:
      LEVEL_ORDER: [MANAGER, DIRECTOR, DIRECTOR_AND_COMPLIANCE]
    precision: "exact enum comparison"

  - name: detail_assignment_cost
    trigger: "on POST /exec-protection/detail-assignments (PROVISIONAL) and POST /exec-protection/detail-assignments/{id}/release (FINAL); writes ProtectiveDetailAssignment.cost_cents and cost_basis"
    algorithm: tiered_pricing
    formula: |
      planned_billable_hours = ceil((ends_at - starts_at) in whole minutes / 60)
      final_billable_hours   = max(MIN_BILLABLE_HOURS,
                                   ceil((actual_ends_at - starts_at) in whole minutes / 60))
      hours = planned_billable_hours   for variant PROVISIONAL
            = final_billable_hours     for variant FINAL
      cost_cents = round_half_up(hours * SecurityStaff.hourly_rate_cents
                                       * ROLE_MULTIPLIER[role_on_detail], 0)
      # PINNED ROUNDING ORDER: each assignment is rounded to a whole cent HERE,
      # at line-item granularity. trip_security_cost then sums those integers and
      # never re-rounds. Summing unrounded products first and rounding the total
      # afterwards is explicitly WRONG and produces a different cent figure.
    input_set: "one assignment row plus its staff member's hourly_rate_cents"
    constants:
      ROLE_MULTIPLIER: { LEAD_AGENT: 1.25, AGENT: 1.00, DRIVER: 0.85, ADVANCE: 1.10 }
      MIN_BILLABLE_HOURS: 4
      REST_BUFFER_HOURS: 12   # not used by this formula; declared here as the single source of truth for the rest-buffer exclusion enforced by validations[priority=33]
    precision: "whole cents, round_half_up, one rounding per assignment"
    variants:
      - name: PROVISIONAL
        when: "at creation, from the planned window"
        difference: "uses ceil of the planned window with no minimum floor"
      - name: FINAL
        when: "at release, from actual_ends_at"
        difference: "applies MIN_BILLABLE_HOURS as a floor, so a 1h47m actual release still bills 4 hours while the same planned window would have billed 2"

  - name: trip_security_cost
    trigger: "PROVISIONAL on POST /exec-protection/trips/{id}/submit-for-approval; FINAL on POST /exec-protection/trips/{id}/close"
    algorithm: aggregation
    formula: |
      legs = { TripLeg : trip_id == trip.id }
      PROVISIONAL =
          SUM over ProtectiveDetailAssignment p with p.trip_leg_id IN legs
              AND p.status == CONFIRMED of p.cost_cents
        + SUM over VendorEngagement v with v.trip_leg_id IN legs
              AND v.incident_id IS NULL AND v.status == ACTIVE
              of v.engagement_cost_cents
      FINAL =
          SUM over ProtectiveDetailAssignment p with p.trip_leg_id IN legs
              AND p.status == RELEASED of p.cost_cents
        + SUM over VendorEngagement v with v.trip_leg_id IN legs
              AND v.incident_id IS NULL AND v.status == COMPLETED
              of v.engagement_cost_cents
        + SUM over Incident i with i.trip_id == trip.id
              AND i.status == CLOSED of i.response_cost_cents
      # accumulation order: created_at ASC within each of the three sums.
      # Every addend is already a whole-cent integer; the total is NEVER re-rounded.
      # incident-linked engagements (incident_id IS NOT NULL) are deliberately
      # excluded from the engagement sum because they are already inside
      # Incident.response_cost_cents — that exclusion is what prevents double counting.
    input_set: "explicit status filters as written above. CANCELLED assignments and CANCELLED engagements contribute nothing (their cost_cents is 0). Incidents that are not CLOSED contribute nothing, which is why close is gated on every incident being CLOSED."
    constants: {}
    precision: "whole cents; sum of already-rounded line items, no further rounding"
    variants:
      - name: PROVISIONAL
        when: "budget commitment at submit-for-approval"
        difference: "counts CONFIRMED assignments at their planned hours and ACTIVE non-incident engagements; ignores incidents entirely"
      - name: FINAL
        when: "settlement at close"
        difference: "counts RELEASED assignments at their MIN_BILLABLE_HOURS-floored actual hours, COMPLETED non-incident engagements, and CLOSED incident response costs; for the same trip the two variants differ whenever any release changed hours or any incident occurred"

  - name: perquisite_allocation
    trigger: "on POST /exec-protection/trips/{id}/close, immediately after trip_security_cost variant FINAL; writes Trip.perquisite_rate_applied, Trip.perquisite_taxable_cents, Trip.business_borne_cents and then the executive's annual roll-ups"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 (pinned FIRST): read the executive's pre-trip cumulative disclosure.
      prior = Executive.annual_disclosed_perquisite_cents
              # this trip is not yet CLOSED, so its own share is NOT in `prior`
      # STEP 2: select the tier from `prior` — never from the post-trip total.
      tier_rate = 0.10  when prior < 5000000
                = 0.25  when 5000000 <= prior < 20000000
                = 0.40  when prior >= 20000000
      # STEP 3: the allocation method overrides the tier.
      rate = 0.00       when cost_allocation_method == BUSINESS_ONLY
           = 1.00       when cost_allocation_method == EXEC_PERQUISITE
           = tier_rate  when cost_allocation_method == PRORATA
      # STEP 4:
      perquisite_taxable_cents = round_half_up(total_security_cost_cents * rate, 0)
      business_borne_cents     = total_security_cost_cents - perquisite_taxable_cents
      perquisite_rate_applied  = rate
      # STEP 5 (pinned LAST): roll up.
      Executive.annual_disclosed_perquisite_cents += perquisite_taxable_cents
      Executive.business_borne_security_cents     += business_borne_cents
      # The dependency LOOKS circular — the rate is keyed on a total that this very
      # trip feeds. It is resolved by pinning the read in STEP 1 before the write in
      # STEP 5, so the value is well-defined and order-independent for a single close.
      # Two trips closed in different orders therefore CAN receive different rates;
      # that is intended, and the close order is the observable that decides it.
    input_set: "Trip.total_security_cost_cents (FINAL, already written), Trip.cost_allocation_method, and Executive.annual_disclosed_perquisite_cents summed over that executive's trips with readiness_state == CLOSED as of the instant before this close"
    constants:
      PERQUISITE_TIER_MID_AT: 5000000
      PERQUISITE_TIER_TOP_AT: 20000000
      PERQUISITE_TIER_RATES: { LOW: 0.10, MID: 0.25, TOP: 0.40 }
    precision: "whole cents, round_half_up; the tier boundaries are inclusive at the lower edge (prior == 5000000 selects 0.25, prior == 4999999 selects 0.10)"

  - name: incident_response_cost
    trigger: "on POST /exec-protection/incidents/{id}/close; writes Incident.response_cost_cents"
    algorithm: aggregation
    formula: |
      response_cost_cents =
          SUM over VendorEngagement v with v.incident_id == incident.id
              AND v.status == COMPLETED, accumulated in v.created_at ASC order,
              of v.engagement_cost_cents
        + (EVAC_SURCHARGE_CENTS when incident.response_track == MEDEVAC else 0)
    input_set: "only engagements whose incident_id equals this incident and whose status is COMPLETED. ACTIVE engagements cannot be present because resolve is gated on every one of them being COMPLETED or CANCELLED; CANCELLED ones contribute 0."
    constants:
      EVAC_SURCHARGE_CENTS: 2500000
    precision: "whole cents; sum of integers plus an integer surcharge, no rounding"

  - name: check_in_schedule
    trigger: "on trip approval, on every POST /exec-protection/trips/{id}/check-ins, and on every readiness transition; writes Trip.check_in_interval_hours and Trip.next_check_in_due_at, and CheckIn.late"
    algorithm: interval_merge
    formula: |
      # interval selection, pinned precedence duress > degraded > band
      interval = DURESS_CHECK_IN_INTERVAL_HOURS    when trip.duress_active == true
               = DEGRADED_CHECK_IN_INTERVAL_HOURS  when trip.readiness_state == DEGRADED
               = CHECK_IN_INTERVAL_HOURS[LOW]      when trip.max_leg_risk_band IS NULL
               = CHECK_IN_INTERVAL_HOURS[trip.max_leg_risk_band]  otherwise
      # due-date anchoring
      at approval:            next_check_in_due_at = max(trip.depart_at, clock_now) + interval hours
      on a SCHEDULED check-in: next_check_in_due_at = reported_at + interval hours
      on an AD_HOC check-in:   next_check_in_due_at unchanged
      on a DURESS check-in:    next_check_in_due_at = reported_at + DURESS_CHECK_IN_INTERVAL_HOURS
      # lateness, evaluated against the due instant in force BEFORE this row is applied
      late = (kind == SCHEDULED) AND (reported_at > next_check_in_due_at_before)
      missed_check_in_count = COUNT of this trip's CheckIn rows with late == true
    input_set: "the trip's duress flag, readiness_state and max_leg_risk_band, plus the CheckIn rows of this trip"
    constants:
      CHECK_IN_INTERVAL_HOURS: { LOW: 24, MODERATE: 12, HIGH: 8, EXTREME: 4 }
      DEGRADED_CHECK_IN_INTERVAL_HOURS: 2
      DURESS_CHECK_IN_INTERVAL_HOURS: 1
      MISSED_CHECKIN_ESCALATION: 2
    precision: "whole hours; comparison is strict (>) so a check-in arriving exactly at next_check_in_due_at is on time"

  - name: incident_vendor_selection
    trigger: "cascade inside POST /exec-protection/incidents/{id}/triage; selects the Vendor for the auto-created VendorEngagement"
    algorithm: topological
    formula: |
      leg           = the TripLeg with trip_id == incident.trip_id
                      AND sequence_no == incident.affected_leg_sequence_no
      required_type = MEDICAL_EVAC     when response_track == MEDEVAC
                    = GROUND_SECURITY  when response_track IN {SHELTER_IN_PLACE, EXTRACTION}
      window        = [clock_now, clock_now + 24h)
      # (a) eligibility filter — explicit predicate, no adjectives
      candidates = { v in Vendor :
            v.vendor_type == required_type
        AND v.activation_status == AVAILABLE
        AND v.country_code == leg.destination_country_code
        AND COUNT{ e in VendorEngagement : e.vendor_id == v.id AND e.status == ACTIVE
                   AND e.starts_at < window.end AND e.ends_at > window.start }
              < v.max_concurrent_engagements }
      # (b) ranking expression
      order candidates by sla_response_minutes ASC, then hourly_rate_cents ASC,
                          then retainer_cents ASC
      # (c) tie-break when the ranking expression ties
      then created_at ASC        # Vendor.id is NEVER consulted
      # (d) empty-set fallback
      if candidates is empty: reject the whole triage request with
         ERR_NO_ELIGIBLE_VENDOR (409); the incident stays REPORTED, no engagement
         is created, and no version field anywhere is incremented
      chosen = first element of the ordered candidate list
    input_set: "all Vendor rows; only the eligibility predicate above narrows them"
    constants:
      INCIDENT_ENGAGEMENT_WINDOW_HOURS: 24
    precision: "exact integer comparisons on the ranking keys; created_at compared at millisecond precision"

  - name: commitment_ledgers
    trigger: "every transition that touches a commitment: trip submit / decision / close, assignment create / release / cancel, engagement create / complete / cancel"
    algorithm: constraint_propagation
    formula: |
      # Q_BUDGET (money) — holds at every observable instant, for every executive
      Executive.remaining_budget_cents =
          Executive.annual_security_budget_cents
        - Executive.committed_budget_cents
        - Executive.spent_budget_cents
      INVARIANT Q_BUDGET:
          committed_budget_cents + spent_budget_cents + remaining_budget_cents
          == annual_security_budget_cents
      # Q_STAFF_HOURS (labour hours)
      SecurityStaff.committed_detail_hours =
          SUM of planned_billable_hours over that staff member's
          ProtectiveDetailAssignment rows with status == CONFIRMED
      # Q_VENDOR_HOURS (vendor hours)
      Vendor.committed_engagement_hours =
          SUM of engagement_hours over that vendor's VendorEngagement rows
          with status == ACTIVE
      # Compensating pairs — each MUST restore its quantity exactly
      #  submit-for-approval (+provisional to committed_budget_cents)
      #    <-> decision DENY   (-provisional)                      => Q_BUDGET restored
      #  POST /detail-assignments (+planned_billable_hours)
      #    <-> trip DENY cascade CH-D hop 2 (-planned_billable_hours) => Q_STAFF_HOURS restored
      #  POST /vendor-engagements (+engagement_hours)
      #    <-> vendor suspend cascade CH-A hop 2 (-engagement_hours)  => Q_VENDOR_HOURS restored
    input_set: "as written in each sum; every filter is an explicit status enum set"
    constants: {}
    precision: "integers throughout; no rounding, so a compensated pair must return the exact pre-action value"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
#
# Business-band ordering for this domain, most-significant first:
#   (a) safety / duty-of-care / compliance   -> priorities 28-33
#   (b) temporal and structural constraints  -> priorities 34-41
#   (c) referential / coverage prerequisites -> priorities 42-48
#   (d) fiscal capacity                      -> priority   49  (LAST)
# A protective-security domain must never let a budget ceiling mask an
# unqualified-agent or missing-advance-work defect, so every fiscal check sorts
# after every safety, constraint and coverage check.
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: every required input field present, every field of the declared JSON type, every enum value a declared member, every numeric value inside its declared range, every country code exactly two uppercase A-Z letters, every datetime a valid ISO-8601 UTC instant. Unknown extra fields are ignored, not rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 4
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /exec-protection/risk-assessments, GET /exec-protection/trips, GET /exec-protection/detail-assignments, GET /exec-protection/vendor-engagements, and every sub-resource list endpoint"

  - priority: 5
    category: business_temporal
    check: "every start/end pair is strictly ordered: InsurancePolicy.effective_to > effective_from; Trip.return_at > depart_at; TripLeg.depart_at > arrive_at; ProtectiveDetailAssignment.ends_at > starts_at; VendorEngagement.ends_at > starts_at; release actual_ends_at > starts_at"
    error_id: ERR_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /exec-protection/insurance-policies, POST /exec-protection/trips, POST /exec-protection/trips/{id}/legs, POST /exec-protection/detail-assignments, POST /exec-protection/vendor-engagements, POST /exec-protection/detail-assignments/{id}/release"

  - priority: 6
    category: existence
    check: "the Executive named by a path id or an executive_id field exists"
    error_id: ERR_EXECUTIVE_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH|POST /exec-protection/executives/{id}/*, POST /exec-protection/insurance-policies, POST /exec-protection/risk-assessments, POST /exec-protection/trips"

  - priority: 7
    category: existence
    check: "the SecurityStaff row named by authored_by_staff_id, created_by_staff_id or staff_id exists"
    error_id: ERR_STAFF_NOT_FOUND
    http_status: 404
    applies_to: "POST /exec-protection/risk-assessments, POST /exec-protection/trips, POST /exec-protection/detail-assignments"

  - priority: 8
    category: existence
    check: "the RiskAssessment named by a path id or by risk_assessment_id exists"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /exec-protection/risk-assessments/{id}*, POST /exec-protection/trips"

  - priority: 9
    category: existence
    check: "a DestinationRating row exists for the country_code in the path, and for primary_destination_country_code / destination_country_code on trip and leg creation"
    error_id: ERR_DESTINATION_RATING_NOT_FOUND
    http_status: 404
    applies_to: "PATCH /exec-protection/destination-ratings/{country_code}, POST /exec-protection/trips, POST /exec-protection/trips/{id}/legs"

  - priority: 10
    category: existence
    check: "the InsurancePolicy named by a path id or by insurance_policy_id exists"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "POST /exec-protection/insurance-policies/{id}/verify, POST /exec-protection/trips"

  - priority: 11
    category: existence
    check: "the Trip named by the path id or by trip_id exists"
    error_id: ERR_TRIP_NOT_FOUND
    http_status: 404
    applies_to: "every /exec-protection/trips/{id}/* endpoint"

  - priority: 12
    category: existence
    check: "the TripLeg named by the path id or by trip_leg_id exists"
    error_id: ERR_TRIP_LEG_NOT_FOUND
    http_status: 404
    applies_to: "GET /exec-protection/trip-legs/{id}, POST /exec-protection/trip-legs/{id}/advance-progress, POST /exec-protection/detail-assignments, POST /exec-protection/vendor-engagements"

  - priority: 13
    category: existence
    check: "the ProtectiveDetailAssignment named by the path id exists"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /exec-protection/detail-assignments/{id}, POST /exec-protection/detail-assignments/{id}/release"

  - priority: 14
    category: existence
    check: "the Vendor named by the path id or by vendor_id exists"
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /exec-protection/vendors/{id}/suspend, POST /exec-protection/vendor-engagements"

  - priority: 15
    category: existence
    check: "the VendorEngagement named by the path id exists"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /exec-protection/vendor-engagements/{id}, POST /exec-protection/vendor-engagements/{id}/complete"

  - priority: 16
    category: existence
    check: "the Incident named by the path id exists; and on POST /exec-protection/trips/{id}/incidents the affected_leg_sequence_no resolves to a TripLeg of that trip"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /exec-protection/incidents/{id}/triage, POST /exec-protection/incidents/{id}/resolve, POST /exec-protection/incidents/{id}/close"

  - priority: 17
    category: auth
    check: "when X-User-Role is Executive, X-User-Id equals the Executive.id addressed by the request — the {id} in the path for consent and perquisite-disclosure reads, or Trip.executive_id for briefing-ack and check-in writes"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /exec-protection/executives/{id}, PATCH /exec-protection/executives/{id}/consent, GET /exec-protection/executives/{id}/perquisite-disclosure, POST /exec-protection/trips/{id}/briefing-ack, POST /exec-protection/trips/{id}/check-ins"

  - priority: 18
    category: business_safety
    check: "the acting staff member is not the same person who produced the artefact being reviewed: on assessment review X-User-Id != RiskAssessment.authored_by_staff_id; on trip decision X-User-Id != Trip.created_by_staff_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /exec-protection/risk-assessments/{id}/review, POST /exec-protection/trips/{id}/decision"

  - priority: 19
    category: business_safety
    check: "the acting role matches the approval stage: a SecurityDirector may decide only while approval_state == PENDING_REVIEW, a ComplianceOfficer only while approval_state == PENDING_COMPLIANCE"
    error_id: ERR_APPROVAL_LEVEL_MISMATCH
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/decision"

  - priority: 20
    category: state
    check: "RiskAssessment.status permits the action: submit requires DRAFT or RETURNED; review requires SUBMITTED"
    error_id: ERR_ASSESSMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /exec-protection/risk-assessments/{id}/submit, POST /exec-protection/risk-assessments/{id}/review"

  - priority: 21
    category: state
    check: "Trip state permits the action: adding a leg requires approval_state == DRAFT; submit-for-approval requires approval_state == DRAFT; decision requires approval_state IN {PENDING_REVIEW, PENDING_COMPLIANCE}; briefing-ack requires approval_state IN {PENDING_REVIEW, PENDING_COMPLIANCE}; check-ins and incidents require approval_state == APPROVED and readiness_state IN {READY, DEGRADED}; close requires readiness_state IN {READY, DEGRADED}; recording advance progress requires approval_state != DENIED and readiness_state != CLOSED; creating a ProtectiveDetailAssignment or a VendorEngagement requires the owning Trip readiness_state != CLOSED and approval_state != DENIED"
    error_id: ERR_TRIP_INVALID_APPROVAL_STATE
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/legs, POST /exec-protection/trips/{id}/submit-for-approval, POST /exec-protection/trips/{id}/decision, POST /exec-protection/trips/{id}/briefing-ack, POST /exec-protection/trips/{id}/check-ins, POST /exec-protection/trips/{id}/incidents, POST /exec-protection/trips/{id}/close, POST /exec-protection/trip-legs/{id}/advance-progress, POST /exec-protection/detail-assignments, POST /exec-protection/vendor-engagements"

  - priority: 22
    category: state
    check: "ProtectiveDetailAssignment.status == CONFIRMED for release"
    error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /exec-protection/detail-assignments/{id}/release"

  - priority: 23
    category: state
    check: "VendorEngagement.status == ACTIVE for complete"
    error_id: ERR_ENGAGEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /exec-protection/vendor-engagements/{id}/complete"

  - priority: 24
    category: state
    check: "Incident.status permits the action: triage requires REPORTED; resolve requires MEDEVAC_ACTIVE, SHELTER_ACTIVE or EXTRACTION_ACTIVE and every VendorEngagement of this incident in COMPLETED or CANCELLED; close requires RESOLVED"
    error_id: ERR_INCIDENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /exec-protection/incidents/{id}/triage, POST /exec-protection/incidents/{id}/resolve, POST /exec-protection/incidents/{id}/close"

  - priority: 25
    category: state
    check: "InsurancePolicy.status == UNVERIFIED for the verify action"
    error_id: ERR_POLICY_INVALID_STATE
    http_status: 409
    applies_to: "POST /exec-protection/insurance-policies/{id}/verify"

  - priority: 26
    category: state
    check: "Vendor.activation_status == AVAILABLE when a new engagement is created against it, and == AVAILABLE for the suspend action itself"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /exec-protection/vendor-engagements, POST /exec-protection/vendors/{id}/suspend"

  - priority: 27
    category: state
    check: "the caller-supplied parent version matches the stored one, per §1.2.1: expected_trip_leg_version == TripLeg.version on detail-assignment creation; expected_vendor_version == Vendor.version on engagement creation"
    error_id: "ERR_STALE_TRIP_LEG_VERSION on POST /exec-protection/detail-assignments; ERR_STALE_VENDOR_VERSION on POST /exec-protection/vendor-engagements"
    http_status: 412
    applies_to: "POST /exec-protection/detail-assignments, POST /exec-protection/vendor-engagements"

  # --- business band (a): safety / duty-of-care / compliance -----------------
  - priority: 28
    category: business_safety
    check: "Executive.residential_survey_status != PENDING when a risk assessment is submitted — an assessment may not be filed before the residential security survey has been performed (COMPLETE and DEFICIENT both pass; only PENDING blocks)"
    error_id: ERR_RESIDENTIAL_SURVEY_INCOMPLETE
    http_status: 409
    applies_to: "POST /exec-protection/risk-assessments/{id}/submit"

  - priority: 29
    category: business_safety
    check: "SecurityStaff.certification_expires_at > the assignment's ends_at — the agent's certification must remain valid through the whole detail window; an equal instant fails"
    error_id: ERR_STAFF_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /exec-protection/detail-assignments"

  - priority: 30
    category: business_safety
    check: "an advance item may be recorded with outcome == WAIVED only when X-User-Role == SecurityDirector AND the item_type is not ROUTE_SURVEY and not CROWD_PLAN; those two are never waivable by any role"
    error_id: ERR_WAIVER_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /exec-protection/trip-legs/{id}/advance-progress"

  - priority: 31
    category: business_safety
    check: "every TripLeg of the trip has advance_complete == true when the trip is submitted for approval"
    error_id: ERR_ADVANCE_WORK_INCOMPLETE
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval"

  - priority: 32
    category: business_safety
    check: "Trip.briefing_ack_at is non-null when the decision is APPROVE — the protectee must have acknowledged the pre-trip briefing before any approval hop; a DENY decision does not require it"
    error_id: ERR_BRIEFING_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/decision"

  - priority: 33
    category: business_safety
    check: "no existing CONFIRMED assignment for the same staff_id violates the rest buffer: the new assignment is rejected when there EXISTS another CONFIRMED assignment X of that staff member with new.starts_at < X.ends_at + REST_BUFFER_HOURS AND X.starts_at < new.ends_at + REST_BUFFER_HOURS. RELEASED and CANCELLED assignments are ignored. REST_BUFFER_HOURS is 12 hours, declared in calculations.detail_assignment_cost.constants. Both comparisons are STRICT: a new assignment whose starts_at equals X.ends_at + REST_BUFFER_HOURS passes. This is a pairwise exclusion — a single conflicting neighbour is enough."
    error_id: ERR_STAFF_REST_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /exec-protection/detail-assignments"

  # --- business band (b): temporal and structural constraints ---------------
  - priority: 34
    category: business_temporal
    check: "the leg sits inside the trip window: leg.arrive_at >= trip.depart_at AND leg.depart_at <= trip.return_at"
    error_id: ERR_LEG_OUTSIDE_TRIP_WINDOW
    http_status: 422
    applies_to: "POST /exec-protection/trips/{id}/legs"

  - priority: 35
    category: business_temporal
    check: "clock_now >= Trip.return_at when the trip is closed — a trip may not be settled before its window has ended; an equal instant passes"
    error_id: ERR_TRIP_NOT_ENDED
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/close"

  - priority: 36
    category: business_constraint
    check: "sequence_no is not already used by another TripLeg of the same trip"
    error_id: ERR_DUPLICATE_LEG_SEQUENCE
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/legs"

  - priority: 37
    category: business_constraint
    check: "no DestinationRating row already exists for the submitted country_code"
    error_id: ERR_DESTINATION_RATING_EXISTS
    http_status: 409
    applies_to: "POST /exec-protection/destination-ratings"

  - priority: 38
    category: business_constraint
    check: "the trip has at least one TripLeg when submitted for approval — an empty itinerary cannot be risk-rated"
    error_id: ERR_TRIP_HAS_NO_LEGS
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval"

  - priority: 39
    category: business_constraint
    check: "the vendor's aggregate capacity is not exceeded: COUNT of that vendor's ACTIVE engagements whose [starts_at, ends_at) intersects the new engagement's window must be < Vendor.max_concurrent_engagements. This is an aggregate check — each existing engagement is individually legal and only the collective count fails."
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /exec-protection/vendor-engagements"

  - priority: 40
    category: business_constraint
    check: "the vendor set the action needs is non-empty: at triage calculations.incident_vendor_selection must yield a non-empty candidate set; on a manual POST /exec-protection/vendor-engagements the named vendor must itself be eligible for the leg, meaning engagement_purpose == Vendor.vendor_type AND Vendor.country_code == TripLeg(trip_leg_id).destination_country_code"
    error_id: ERR_NO_ELIGIBLE_VENDOR
    http_status: 409
    applies_to: "POST /exec-protection/incidents/{id}/triage; POST /exec-protection/vendor-engagements"

  - priority: 41
    category: business_constraint
    check: "response_track is permitted for the incident_type and severity: MEDICAL permits only MEDEVAC; UNREST permits SHELTER_IN_PLACE, and permits EXTRACTION only when severity >= 4; NATURAL_DISASTER permits MEDEVAC or SHELTER_IN_PLACE but never EXTRACTION"
    error_id: ERR_INCIDENT_TRACK_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /exec-protection/incidents/{id}/triage"

  # --- business band (c): referential / coverage prerequisites --------------
  - priority: 42
    category: business_referential
    check: "the Trip's RiskAssessment has status == APPROVED at submit-for-approval time — a SUPERSEDED, VOIDED, SUBMITTED, RETURNED or DRAFT assessment blocks the trip even though the FK resolves"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval"

  - priority: 43
    category: business_referential
    check: "insurance verification: at submit-for-approval the trip MUST carry a non-null insurance_policy_id whose status == VERIFIED (a null policy fails here, which is what makes the two lower-priority insurance rules safe to state over a non-null policy); at triage with response_track == MEDEVAC the trip MUST carry a non-null insurance_policy_id whose policy_type == MEDICAL_EVAC and whose status == VERIFIED"
    error_id: ERR_INSURANCE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval, POST /exec-protection/incidents/{id}/triage"

  - priority: 44
    category: business_referential
    check: "no TripLeg destination_country_code appears in the policy's excluded_country_codes, and the policy window covers the trip window: effective_from <= trip.depart_at AND effective_to >= trip.return_at"
    error_id: ERR_INSURANCE_COUNTRY_EXCLUDED
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval"

  - priority: 45
    category: business_constraint
    check: "cost_allocation_method == BUSINESS_ONLY is permitted only when trip_purpose == BUSINESS_TRAVEL"
    error_id: ERR_ALLOCATION_METHOD_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /exec-protection/trips"

  - priority: 46
    category: business_referential
    check: "every Incident of the trip has status == CLOSED at close — an open incident would otherwise be silently omitted from the FINAL cost"
    error_id: ERR_OPEN_INCIDENTS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/close"

  - priority: 47
    category: business_referential
    check: "no ProtectiveDetailAssignment on any leg of the trip is still CONFIRMED at close — every assignment must be RELEASED or CANCELLED so its FINAL cost basis exists"
    error_id: ERR_ASSIGNMENTS_NOT_SETTLED
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/close"

  - priority: 48
    category: business_referential
    check: "the policy's coverage_cents >= the maximum insurance_required_coverage_cents over the DestinationRating rows of all the trip's legs; priority 43 has already established that the policy is non-null and VERIFIED, so this rule never sees a null policy"
    error_id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval"

  # --- business band (d): fiscal capacity, evaluated LAST --------------------
  - priority: 49
    category: business_fiscal
    check: "the PROVISIONAL trip_security_cost fits the executive's remaining budget: provisional_security_cost_cents <= Executive.remaining_budget_cents. Equality passes; a one-cent excess fails."
    error_id: ERR_SECURITY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /exec-protection/trips/{id}/submit-for-approval"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every business path carries the /exec-protection namespace prefix. The single
# test-driving endpoint POST /_clock/set_current_utc sits outside it by design.
# -----------------------------------------------------------------------------
endpoints:

  - method: POST
    path: "/exec-protection/security-staff"
    description: "Register a security department staff member. staff_role decides which API role this person may authenticate as (ANALYST -> SecurityAnalyst, MANAGER -> ProtectionManager, DIRECTOR -> SecurityDirector)."
    roles: [SystemOperator, SecurityDirector]
    code: 201
    input: [full_name, staff_role, certification_expires_at, hourly_rate_cents]
    output: SecurityStaff
    side_effects: ["committed_detail_hours and released_detail_hours initialised to 0"]

  - method: GET
    path: "/exec-protection/security-staff/{id}"
    description: "Read one staff member, including the committed_detail_hours / released_detail_hours labour ledger."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer, SystemOperator]
    code: 200
    input: []
    output: SecurityStaff
    side_effects: []

  - method: POST
    path: "/exec-protection/executives"
    description: "Register a protectee. Budget, tier and tracking consent are set here."
    roles: [ProtectionManager, SecurityDirector]
    code: 201
    input: [full_name, tier, role_title, base_country_code, annual_security_budget_cents, "consent_scope?", "consent_expires_at?"]
    output: Executive
    side_effects:
      - "residential_survey_status set to PENDING"
      - "threat_level set to LOW, public_exposure_score to 0.00"
      - "remaining_budget_cents set to annual_security_budget_cents per calculations.commitment_ledgers"

  - method: GET
    path: "/exec-protection/executives/{id}"
    description: "Read one protectee, including threat_level, public_exposure_score and the whole budget ledger."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer, Executive]
    code: 200
    input: []
    output: Executive
    side_effects: []

  - method: PATCH
    path: "/exec-protection/executives/{id}/consent"
    description: "Set the protectee's location-tracking consent scope and expiry. The consent boundary is what decides whether a later check-in's location is retained."
    roles: [Executive, ProtectionManager]
    code: 200
    input: [consent_scope, "consent_expires_at?"]
    output: Executive
    side_effects: ["consent_scope and consent_expires_at replaced; already-recorded CheckIn rows are never rewritten"]

  - method: POST
    path: "/exec-protection/executives/{id}/residential-survey"
    description: "Record the outcome of a residential security survey. survey_outcome is COMPLETE or DEFICIENT; residential_component is the 0..100 hardening-deficiency score."
    roles: [SecurityAnalyst]
    code: 200
    input: [survey_outcome, residential_component]
    output: Executive
    side_effects:
      - "residential_survey_status set to survey_outcome"
      - "residential_component replaced; already-submitted RiskAssessment snapshots are not retro-fitted"

  - method: POST
    path: "/exec-protection/executives/{id}/exposure-signals"
    description: "Append a public-exposure signal observed for this protectee. Append-only: signals are never updated or deleted."
    roles: [SecurityAnalyst]
    code: 201
    input: [signal_type, severity, observed_at, "source_note?"]
    output: PublicExposureSignal
    side_effects: ["recomputes Executive.public_exposure_score via calculations.public_exposure_score variant DECAY_WEIGHTED"]

  - method: GET
    path: "/exec-protection/executives/{id}/exposure-signals"
    description: "List the exposure signals of one protectee, newest observed_at first."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector]
    code: 200
    input: ["signal_type?", "limit?", "offset?"]
    output: PublicExposureSignal[]
    side_effects: []

  - method: GET
    path: "/exec-protection/executives/{id}/insurance-policies"
    description: "List the insurance policies held for one protectee."
    roles: [ComplianceOfficer, ProtectionManager, SecurityDirector, Executive]
    code: 200
    input: ["status?", "policy_type?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  - method: GET
    path: "/exec-protection/executives/{id}/perquisite-disclosure"
    description: "Computed read of the protectee's security-perquisite disclosure position, aggregated over that executive's CLOSED trips only."
    roles: [Executive, ComplianceOfficer, SecurityDirector]
    code: 200
    input: []
    output: "{ executive_id: string, closed_trip_count: integer, annual_disclosed_perquisite_cents: integer, business_borne_security_cents: integer, total_security_cost_cents: integer, latest_perquisite_rate_applied: number }"
    side_effects: []

  - method: POST
    path: "/exec-protection/insurance-policies"
    description: "Create an insurance policy for a protectee. Starts UNVERIFIED."
    roles: [ComplianceOfficer, ProtectionManager]
    code: 201
    input: [executive_id, policy_type, coverage_cents, effective_from, effective_to, "excluded_country_codes?"]
    output: InsurancePolicy
    side_effects: ["status set to UNVERIFIED"]

  - method: POST
    path: "/exec-protection/insurance-policies/{id}/verify"
    description: "Compliance decision on a policy. outcome is VERIFY or REJECT."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "verification_note?"]
    output: InsurancePolicy
    side_effects:
      - "status set to VERIFIED or REJECTED per state_machines[entity=InsurancePolicy]"
      - "verified_at set to clock_now on VERIFY"

  - method: POST
    path: "/exec-protection/destination-ratings"
    description: "Publish a destination risk rating for a country. country_code is the natural key and is unique."
    roles: [SecurityAnalyst]
    code: 201
    input: [country_code, crime_index, political_instability_index, medical_infrastructure_index, natural_hazard_index, advisory_effective_at, "advisory_note?"]
    output: DestinationRating
    side_effects: ["computes composite_destination_score, rating_band and insurance_required_coverage_cents via calculations.destination_composite_score"]

  - method: PATCH
    path: "/exec-protection/destination-ratings/{country_code}"
    description: "Revise a destination's indices. Entry point of cascade CH-C."
    roles: [SecurityAnalyst]
    code: 200
    input: ["crime_index?", "political_instability_index?", "medical_infrastructure_index?", "natural_hazard_index?", "advisory_effective_at?", "advisory_note?"]
    output: DestinationRating
    side_effects:
      - "CH-C hop 1: recomputes composite_destination_score, rating_band, insurance_required_coverage_cents"
      - "CH-C hop 2: recomputes leg_risk_band and required_advance_items on every TripLeg whose destination_country_code matches and whose trip readiness_state != CLOSED"
      - "CH-C hop 3: sets those trips readiness_state READY -> DEGRADED when a leg lost advance_complete, and recomputes max_leg_risk_band and required_approval_level"
      - "CH-C hop 4: any affected trip with approval_state == APPROVED whose required_approval_level rose reverts to PENDING_REVIEW and has briefing_ack_at cleared"

  - method: POST
    path: "/exec-protection/risk-assessments"
    description: "Draft an executive risk assessment. authored_by_staff_id must be the acting analyst."
    roles: [SecurityAnalyst]
    code: 201
    input: [executive_id, authored_by_staff_id, threat_monitoring_score]
    output: RiskAssessment
    side_effects: ["status set to DRAFT, revision_round to 0"]

  - method: GET
    path: "/exec-protection/risk-assessments"
    description: "Filtered list of risk assessments, newest created_at first."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: ["executive_id?", "authored_by_staff_id?", "approved_by_staff_id?", "supersedes_assessment_id?", "status?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  - method: GET
    path: "/exec-protection/risk-assessments/{id}"
    description: "Read one risk assessment including all four score components."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []

  - method: POST
    path: "/exec-protection/risk-assessments/{id}/submit"
    description: "Submit a DRAFT or RETURNED assessment for director review. Every submit re-snapshots the exposure and residential components and re-scores the composite."
    roles: [SecurityAnalyst]
    code: 200
    input: []
    output: RiskAssessment
    side_effects:
      - "status -> SUBMITTED; submitted_at set to clock_now"
      - "public_exposure_component recomputed via calculations.public_exposure_score variant ROLLING_WINDOW"
      - "residential_component_snapshot copied from Executive.residential_component"
      - "composite_risk_score recomputed via calculations.composite_risk_score"

  - method: POST
    path: "/exec-protection/risk-assessments/{id}/review"
    description: "Director review of a SUBMITTED assessment. outcome is APPROVE or RETURN. Entry point of cascade CH-B."
    roles: [SecurityDirector]
    code: 200
    input: [outcome, "review_notes?"]
    output: RiskAssessment
    side_effects:
      - "outcome RETURN: revision_round is incremented by 1 first; status -> RETURNED when the incremented revision_round <= MAX_REVISION_ROUNDS, otherwise status -> VOIDED. The incremented value is stored in either case, so the 4th RETURN leaves revision_round == 4 and status == VOIDED."
      - "outcome APPROVE: CH-B hop 1 — status -> APPROVED, approved_at and approved_by_staff_id set, Executive.threat_level recomputed via calculations.executive_threat_level"
      - "CH-B hop 2: the executive's previously APPROVED assessment (if any) -> SUPERSEDED and this row's supersedes_assessment_id set to it"
      - "CH-B hop 3: every non-CLOSED trip of that executive that pointed at the superseded assessment is re-pointed to this one"
      - "CH-B hop 4: those trips' legs recompute leg_risk_band and required_advance_items, the trips recompute max_leg_risk_band and required_approval_level, READY trips that lost advance_complete go DEGRADED, and APPROVED trips whose required_approval_level rose revert to PENDING_REVIEW with briefing_ack_at cleared"

  - method: POST
    path: "/exec-protection/trips"
    description: "Create a trip in DRAFT / NOT_READY. created_by_staff_id must be the acting manager and is remembered for the segregation-of-duties check at decision time."
    roles: [ProtectionManager]
    code: 201
    input: [executive_id, created_by_staff_id, risk_assessment_id, "insurance_policy_id?", trip_purpose, primary_destination_country_code, depart_at, return_at, "cost_allocation_method?"]
    output: Trip
    side_effects:
      - "approval_state DRAFT, readiness_state NOT_READY, required_approval_level MANAGER, max_leg_risk_band null"
      - "check_in_interval_hours seeded to CHECK_IN_INTERVAL_HOURS[LOW]"

  - method: GET
    path: "/exec-protection/trips"
    description: "Filtered list of trips, newest created_at first."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: ["executive_id?", "created_by_staff_id?", "risk_assessment_id?", "insurance_policy_id?", "approval_state?", "readiness_state?", "limit?", "offset?"]
    output: Trip[]
    side_effects: []

  - method: GET
    path: "/exec-protection/trips/{id}"
    description: "Read one trip with both state dimensions, the cost fields and the check-in cadence."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer, Executive]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: POST
    path: "/exec-protection/trips/{id}/legs"
    description: "Add an itinerary leg to a DRAFT trip. Each leg is immediately risk-banded and given its advance-work requirement set."
    roles: [ProtectionManager]
    code: 201
    input: [sequence_no, destination_country_code, arrive_at, depart_at]
    output: TripLeg
    side_effects:
      - "computes leg_risk_band via calculations.leg_risk_band"
      - "computes required_advance_items via calculations.advance_requirement_set"
      - "recomputes Trip.max_leg_risk_band and Trip.required_approval_level via calculations.required_approval_level"

  - method: GET
    path: "/exec-protection/trips/{id}/legs"
    description: "List the legs of one trip in sequence_no order."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer, Executive]
    code: 200
    input: ["limit?", "offset?"]
    output: TripLeg[]
    side_effects: []

  - method: POST
    path: "/exec-protection/trips/{id}/submit-for-approval"
    description: "Submit a DRAFT trip for approval. This is where the safety, constraint, coverage and fiscal ladder (validations priorities 31, 38, 42, 43, 44, 48, 49) is enforced in that order, and where the provisional budget commitment is taken."
    roles: [ProtectionManager]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "approval_state DRAFT -> PENDING_REVIEW"
      - "provisional_security_cost_cents computed via calculations.trip_security_cost variant PROVISIONAL"
      - "Executive.committed_budget_cents increased by provisional_security_cost_cents and remaining_budget_cents reduced by the same amount per calculations.commitment_ledgers"

  - method: POST
    path: "/exec-protection/trips/{id}/decision"
    description: "Approval decision on a trip. decision is APPROVE or DENY. A SecurityDirector acts on PENDING_REVIEW; a ComplianceOfficer acts on PENDING_COMPLIANCE. Entry point of cascade CH-D on DENY."
    roles: [SecurityDirector, ComplianceOfficer]
    code: 200
    input: [decision, "denied_reason?"]
    output: Trip
    side_effects:
      - "APPROVE with required_approval_level IN {MANAGER, DIRECTOR}: approval_state -> APPROVED"
      - "APPROVE with required_approval_level == DIRECTOR_AND_COMPLIANCE: approval_state PENDING_REVIEW -> PENDING_COMPLIANCE, then a second APPROVE by a ComplianceOfficer -> APPROVED"
      - "reaching APPROVED: readiness_state ADVANCE_IN_PROGRESS -> READY, check_in_interval_hours and next_check_in_due_at set via calculations.check_in_schedule"
      - "DENY: CH-D hop 1 — approval_state -> DENIED and denied_reason stored"
      - "DENY: CH-D hop 2 — every CONFIRMED ProtectiveDetailAssignment on every leg of the trip -> CANCELLED with cost_cents 0 and cost_basis VOID"
      - "DENY: CH-D hop 3 — each affected SecurityStaff.committed_detail_hours reduced by that assignment's planned_billable_hours, and Executive.committed_budget_cents reduced by the trip's provisional_security_cost_cents (restoring remaining_budget_cents) per calculations.commitment_ledgers"

  - method: POST
    path: "/exec-protection/trips/{id}/briefing-ack"
    description: "The protectee acknowledges the pre-trip briefing. Required before any APPROVE hop; cleared again by cascades CH-B and CH-C when the risk picture changes."
    roles: [Executive]
    code: 200
    input: []
    output: Trip
    side_effects: ["briefing_ack_at set to clock_now"]

  - method: POST
    path: "/exec-protection/trips/{id}/check-ins"
    description: "Record a traveller check-in. kind is SCHEDULED, AD_HOC or DURESS. Location retention obeys the consent boundary; a DURESS check-in is the entry point of cascade CH-E."
    roles: [Executive]
    code: 201
    input: [kind, "location_country_code?", "note?"]
    output: CheckIn
    side_effects:
      - "reported_at set to clock_now; consent_scope_snapshot resolved to NONE when the executive's consent_expires_at <= clock_now, otherwise to Executive.consent_scope"
      - "recorded_location_country_code set to the reported code only when consent_scope_snapshot != NONE; otherwise null and location_withheld true"
      - "late computed against the trip's pre-existing next_check_in_due_at, then Trip.missed_check_in_count and next_check_in_due_at recomputed via calculations.check_in_schedule"
      - "missed_check_in_count reaching MISSED_CHECKIN_ESCALATION sets readiness_state READY -> DEGRADED"
      - "kind == DURESS: CH-E hop 1 — Trip.duress_active set true; CH-E hop 2 — check_in_interval_hours forced to DURESS_CHECK_IN_INTERVAL_HOURS and readiness_state -> DEGRADED; CH-E hop 3 — an Incident is auto-created with incident_type UNREST, severity 5, duress_flag true, affected_leg_sequence_no of the lowest-sequence leg whose window contains clock_now (or the lowest sequence_no when none does), and Executive.open_degraded_trip_count incremented"

  - method: GET
    path: "/exec-protection/trips/{id}/check-ins"
    description: "List the check-ins of one trip, newest reported_at first."
    roles: [ProtectionManager, SecurityDirector, ComplianceOfficer, Executive]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: CheckIn[]
    side_effects: []

  - method: POST
    path: "/exec-protection/trips/{id}/incidents"
    description: "Report an incident on an approved, in-flight trip."
    roles: [ProtectionManager, SecurityDirector]
    code: 201
    input: [affected_leg_sequence_no, incident_type, severity, narrative]
    output: Incident
    side_effects:
      - "status set to REPORTED, opened_at set to clock_now"
      - "Trip.readiness_state READY -> DEGRADED and check_in_interval_hours recomputed via calculations.check_in_schedule"
      - "Executive.open_degraded_trip_count incremented when the trip was not already DEGRADED"

  - method: GET
    path: "/exec-protection/trips/{id}/incidents"
    description: "List the incidents of one trip, newest opened_at first."
    roles: [ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: ["status?", "incident_type?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/exec-protection/trips/{id}/close"
    description: "Settle and close a trip whose window has ended. Computes the FINAL cost, then the perquisite split, then rolls both into the executive's annual disclosure."
    roles: [ProtectionManager]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "readiness_state READY or DEGRADED -> CLOSED; closed_at set to clock_now"
      - "total_security_cost_cents computed via calculations.trip_security_cost variant FINAL"
      - "perquisite_rate_applied, perquisite_taxable_cents and business_borne_cents computed via calculations.perquisite_allocation"
      - "Executive.committed_budget_cents reduced by provisional_security_cost_cents, spent_budget_cents increased by total_security_cost_cents, remaining_budget_cents re-derived per calculations.commitment_ledgers"
      - "Executive.annual_disclosed_perquisite_cents and business_borne_security_cents rolled up; open_degraded_trip_count decremented when the trip was DEGRADED"

  - method: GET
    path: "/exec-protection/trip-legs/{id}"
    description: "Read one leg with its risk band, advance-work requirement set and coverage flags."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: TripLeg
    side_effects: []

  - method: POST
    path: "/exec-protection/trip-legs/{id}/advance-progress"
    description: "Record advance work on a leg. item_type is one of ROUTE_SURVEY, HOTEL_SURVEY, HOSPITAL_SURVEY, COMMS_TEST, LOCAL_LIAISON, CROWD_PLAN; outcome is COMPLETE or WAIVED. Only a SecurityDirector may WAIVE, and ROUTE_SURVEY and CROWD_PLAN are never waivable."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector]
    code: 200
    input: [item_type, outcome, "note?"]
    output: TripLeg
    side_effects:
      - "item_type appended to completed_advance_items (COMPLETE) or waived_advance_items (WAIVED); recording the same item twice is idempotent in the array but still returns 200"
      - "advance_complete re-derived via calculations.advance_requirement_set"
      - "Trip.readiness_state NOT_READY -> ADVANCE_IN_PROGRESS on the trip's first recorded item; DEGRADED -> READY once every leg is advance_complete again and every leg has lead_agent_covered"

  - method: POST
    path: "/exec-protection/detail-assignments"
    description: "Assign a staff member to a protective detail on a leg. expected_trip_leg_version is the TripLeg.version the client last observed and is checked per concurrency_rules[detail-assignment-create-stale-leg]."
    roles: [ProtectionManager]
    code: 201
    input: [trip_leg_id, staff_id, role_on_detail, starts_at, ends_at, expected_trip_leg_version]
    output: ProtectiveDetailAssignment
    side_effects:
      - "increments TripLeg.version by 1"
      - "status set to CONFIRMED; planned_billable_hours and cost_cents computed via calculations.detail_assignment_cost variant PROVISIONAL; cost_basis PROVISIONAL"
      - "SecurityStaff.committed_detail_hours increased by planned_billable_hours per calculations.commitment_ledgers"
      - "TripLeg.lead_agent_covered set true when role_on_detail == LEAD_AGENT"
      - "Trip.readiness_state DEGRADED -> READY when this assignment restores full lead-agent coverage and every leg is advance_complete"

  - method: GET
    path: "/exec-protection/detail-assignments"
    description: "Filtered list of protective detail assignments, newest created_at first."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: ["trip_leg_id?", "staff_id?", "status?", "limit?", "offset?"]
    output: ProtectiveDetailAssignment[]
    side_effects: []

  - method: GET
    path: "/exec-protection/detail-assignments/{id}"
    description: "Read one assignment with its cost basis and both hour figures."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: ProtectiveDetailAssignment
    side_effects: []

  - method: POST
    path: "/exec-protection/detail-assignments/{id}/release"
    description: "Release a CONFIRMED assignment at its actual end instant and re-cost it on the FINAL basis."
    roles: [ProtectionManager]
    code: 200
    input: [actual_ends_at]
    output: ProtectiveDetailAssignment
    side_effects:
      - "status CONFIRMED -> RELEASED"
      - "final_billable_hours and cost_cents recomputed via calculations.detail_assignment_cost variant FINAL; cost_basis FINAL"
      - "SecurityStaff.committed_detail_hours reduced by planned_billable_hours and released_detail_hours increased by final_billable_hours"
      - "TripLeg.lead_agent_covered re-derived; releasing the last covering LEAD_AGENT sets Trip.readiness_state READY -> DEGRADED and increments Executive.open_degraded_trip_count"

  - method: POST
    path: "/exec-protection/vendors"
    description: "Register a local security, medical-evacuation, liaison or intelligence vendor."
    roles: [ProtectionManager, SecurityDirector]
    code: 201
    input: [vendor_name, vendor_type, country_code, max_concurrent_engagements, sla_response_minutes, hourly_rate_cents, retainer_cents]
    output: Vendor
    side_effects: ["activation_status set to AVAILABLE, committed_engagement_hours to 0"]

  - method: GET
    path: "/exec-protection/vendors/{id}"
    description: "Read one vendor, including activation_status and the committed_engagement_hours ledger. Also the only way to re-observe Vendor.version between two engagement creations, which the OCC rule requires."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/exec-protection/vendors/{id}/suspend"
    description: "Suspend a vendor. Entry point of cascade CH-A, the deepest chain in this scaffold."
    roles: [SecurityDirector]
    code: 200
    input: [suspension_reason]
    output: Vendor
    side_effects:
      - "CH-A hop 1: activation_status AVAILABLE -> SUSPENDED, suspension_reason stored, Vendor.version incremented"
      - "CH-A hop 2: every ACTIVE VendorEngagement of this vendor -> CANCELLED with engagement_cost_cents 0 and cancelled_reason VENDOR_SUSPENDED; committed_engagement_hours reduced by each engagement_hours per calculations.commitment_ledgers"
      - "CH-A hop 3: for each cancelled engagement whose engagement_purpose == LOCAL_LIAISON, LOCAL_LIAISON is removed from that TripLeg.completed_advance_items and advance_complete re-derived"
      - "CH-A hop 4: every affected non-CLOSED trip whose leg lost advance_complete goes readiness_state READY -> DEGRADED (or ADVANCE_IN_PROGRESS -> NOT_READY when its only recorded item was removed)"
      - "CH-A hop 5: those trips' check_in_interval_hours tightened via calculations.check_in_schedule and Executive.open_degraded_trip_count incremented once per newly DEGRADED trip"

  - method: POST
    path: "/exec-protection/vendor-engagements"
    description: "Engage a vendor for a leg. expected_vendor_version is the Vendor.version the client last observed and is checked per concurrency_rules[vendor-engagement-create-stale-vendor]."
    roles: [ProtectionManager, SecurityDirector]
    code: 201
    input: [vendor_id, trip_leg_id, engagement_purpose, starts_at, ends_at, expected_vendor_version]
    output: VendorEngagement
    side_effects:
      - "increments Vendor.version by 1"
      - "status set to ACTIVE; engagement_hours and engagement_cost_cents computed as retainer_cents + engagement_hours * hourly_rate_cents"
      - "Vendor.committed_engagement_hours increased by engagement_hours per calculations.commitment_ledgers"
      - "engagement_purpose == LOCAL_LIAISON appends LOCAL_LIAISON to TripLeg.completed_advance_items and re-derives advance_complete"

  - method: GET
    path: "/exec-protection/vendor-engagements"
    description: "Filtered list of vendor engagements, newest created_at first. incident_id is the only discovery channel for engagements the incident-triage cascade created."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: ["vendor_id?", "trip_leg_id?", "incident_id?", "status?", "limit?", "offset?"]
    output: VendorEngagement[]
    side_effects: []

  - method: GET
    path: "/exec-protection/vendor-engagements/{id}"
    description: "Read one vendor engagement with its hours and cost."
    roles: [SecurityAnalyst, ProtectionManager, SecurityDirector, ComplianceOfficer]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []

  - method: POST
    path: "/exec-protection/vendor-engagements/{id}/complete"
    description: "Mark an ACTIVE engagement COMPLETED so its cost enters the settlement sums."
    roles: [ProtectionManager, SecurityDirector]
    code: 200
    input: []
    output: VendorEngagement
    side_effects:
      - "status ACTIVE -> COMPLETED"
      - "Vendor.committed_engagement_hours reduced by engagement_hours per calculations.commitment_ledgers"

  - method: POST
    path: "/exec-protection/incidents/{id}/triage"
    description: "Choose the response track for a REPORTED incident and activate a vendor for it. response_track is MEDEVAC, SHELTER_IN_PLACE or EXTRACTION and must be compatible with incident_type."
    roles: [ProtectionManager, SecurityDirector]
    code: 200
    input: [response_track]
    output: Incident
    side_effects:
      - "status REPORTED -> MEDEVAC_ACTIVE, SHELTER_ACTIVE or EXTRACTION_ACTIVE; triaged_at set to clock_now"
      - "a Vendor is chosen via calculations.incident_vendor_selection and a VendorEngagement is auto-created ACTIVE with incident_id set to this incident, trip_leg_id of the affected leg, starts_at clock_now, ends_at clock_now + INCIDENT_ENGAGEMENT_WINDOW_HOURS; discoverable only through GET /exec-protection/vendor-engagements?incident_id="
      - "that vendor's committed_engagement_hours increased by the engagement_hours"

  - method: POST
    path: "/exec-protection/incidents/{id}/resolve"
    description: "Resolve an active incident. Every VendorEngagement of the incident must already be COMPLETED or CANCELLED — this is the join point of the fork."
    roles: [ProtectionManager, SecurityDirector]
    code: 200
    input: ["resolution_note?"]
    output: Incident
    side_effects: ["status -> RESOLVED; resolved_at set to clock_now"]

  - method: POST
    path: "/exec-protection/incidents/{id}/close"
    description: "Close a RESOLVED incident and freeze its response cost."
    roles: [SecurityDirector]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "status RESOLVED -> CLOSED; closed_at set to clock_now"
      - "response_cost_cents computed via calculations.incident_response_cost"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — that fixed default is the server's startup time and it MUST NOT fall back to real wall-clock time. Every window, expiry, decay and due-date rule in this scaffold is evaluated against this logical clock."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock used by every calculation and validation is set to current_utc; no business entity is modified"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog — every id below is produced by exactly the
# validations row of the same error_id in §1.4.
# -----------------------------------------------------------------------------
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role header missing, empty, or naming an undeclared role"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong JSON type, undeclared enum member, out-of-range number, malformed country code, or malformed ISO-8601 instant"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer"
  - id: ERR_INTERVAL_INVALID
    http: 422
    condition: "an end instant is not strictly after its start instant"

  - id: ERR_EXECUTIVE_NOT_FOUND
    http: 404
    condition: "no Executive with the referenced id"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "no SecurityStaff with the referenced id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no RiskAssessment with the referenced id"
  - id: ERR_DESTINATION_RATING_NOT_FOUND
    http: 404
    condition: "no DestinationRating published for the referenced country_code"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no InsurancePolicy with the referenced id"
  - id: ERR_TRIP_NOT_FOUND
    http: 404
    condition: "no Trip with the referenced id"
  - id: ERR_TRIP_LEG_NOT_FOUND
    http: 404
    condition: "no TripLeg with the referenced id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no ProtectiveDetailAssignment with the referenced id"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "no Vendor with the referenced id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "no VendorEngagement with the referenced id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no Incident with the referenced id, or affected_leg_sequence_no does not resolve to a leg of the trip"

  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Executive caller addressed a protectee or trip that is not their own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the reviewer is the author of the assessment, or the trip decider is the trip's creator"
  - id: ERR_APPROVAL_LEVEL_MISMATCH
    http: 409
    condition: "a SecurityDirector decided a PENDING_COMPLIANCE trip, or a ComplianceOfficer decided a PENDING_REVIEW trip"

  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "submit attempted from a status other than DRAFT or RETURNED, or review attempted from a status other than SUBMITTED"
  - id: ERR_TRIP_INVALID_APPROVAL_STATE
    http: 409
    condition: "a trip action was attempted from an approval_state or readiness_state that does not permit it"
  - id: ERR_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "release attempted on an assignment that is not CONFIRMED"
  - id: ERR_ENGAGEMENT_INVALID_STATE
    http: 409
    condition: "complete attempted on an engagement that is not ACTIVE"
  - id: ERR_INCIDENT_INVALID_STATE
    http: 409
    condition: "triage from a non-REPORTED status, resolve from a non-active status or with an engagement still ACTIVE, or close from a non-RESOLVED status"
  - id: ERR_POLICY_INVALID_STATE
    http: 409
    condition: "verify attempted on a policy that is not UNVERIFIED"
  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "an engagement was created against a SUSPENDED vendor, or suspend was attempted on an already-SUSPENDED vendor"

  - id: ERR_STALE_TRIP_LEG_VERSION
    http: 412
    condition: "expected_trip_leg_version does not equal the stored TripLeg.version"
  - id: ERR_STALE_VENDOR_VERSION
    http: 412
    condition: "expected_vendor_version does not equal the stored Vendor.version"

  - id: ERR_RESIDENTIAL_SURVEY_INCOMPLETE
    http: 409
    condition: "an assessment was submitted while the protectee's residential_survey_status is still PENDING"
  - id: ERR_STAFF_CERTIFICATION_EXPIRED
    http: 409
    condition: "the assigned staff member's certification_expires_at is not strictly after the assignment's ends_at"
  - id: ERR_WAIVER_NOT_PERMITTED
    http: 403
    condition: "a WAIVED outcome was recorded by a role other than SecurityDirector, or for ROUTE_SURVEY or CROWD_PLAN which are never waivable"
  - id: ERR_ADVANCE_WORK_INCOMPLETE
    http: 409
    condition: "a trip was submitted for approval while some leg has advance_complete == false"
  - id: ERR_BRIEFING_NOT_ACKNOWLEDGED
    http: 409
    condition: "an APPROVE decision was attempted while briefing_ack_at is null"
  - id: ERR_STAFF_REST_BUFFER_CONFLICT
    http: 409
    condition: "the new assignment falls inside REST_BUFFER_HOURS of another CONFIRMED assignment of the same staff member"

  - id: ERR_LEG_OUTSIDE_TRIP_WINDOW
    http: 422
    condition: "the leg's on-ground window is not contained in the trip's depart_at..return_at window"
  - id: ERR_TRIP_NOT_ENDED
    http: 409
    condition: "close was attempted while clock_now is before the trip's return_at"
  - id: ERR_DUPLICATE_LEG_SEQUENCE
    http: 409
    condition: "another leg of the same trip already uses that sequence_no"
  - id: ERR_DESTINATION_RATING_EXISTS
    http: 409
    condition: "a DestinationRating already exists for that country_code"
  - id: ERR_TRIP_HAS_NO_LEGS
    http: 409
    condition: "a trip with zero legs was submitted for approval"
  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 409
    condition: "the vendor already has max_concurrent_engagements ACTIVE engagements overlapping the requested window"
  - id: ERR_NO_ELIGIBLE_VENDOR
    http: 409
    condition: "no vendor satisfies the incident_vendor_selection eligibility predicate at triage, or the vendor named on a manual engagement create does not match the leg's country or the requested purpose"
  - id: ERR_INCIDENT_TRACK_INCOMPATIBLE
    http: 422
    condition: "the chosen response_track is not permitted for the incident_type, or EXTRACTION was chosen for an UNREST incident with severity < 4"

  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "the trip's RiskAssessment is not in status APPROVED at submit-for-approval time"
  - id: ERR_INSURANCE_NOT_VERIFIED
    http: 409
    condition: "a trip was submitted for approval with no insurance_policy_id or with a policy that is not VERIFIED, or a MEDEVAC triage was attempted without a VERIFIED MEDICAL_EVAC policy on the trip"
  - id: ERR_INSURANCE_COUNTRY_EXCLUDED
    http: 409
    condition: "a leg destination appears in the policy's excluded_country_codes, or the policy window does not cover the trip window"
  - id: ERR_ALLOCATION_METHOD_NOT_PERMITTED
    http: 422
    condition: "cost_allocation_method BUSINESS_ONLY was requested for a trip whose purpose is not BUSINESS_TRAVEL"
  - id: ERR_OPEN_INCIDENTS_BLOCK_CLOSE
    http: 409
    condition: "close was attempted while some incident of the trip is not CLOSED"
  - id: ERR_ASSIGNMENTS_NOT_SETTLED
    http: 409
    condition: "close was attempted while some assignment on the trip's legs is still CONFIRMED"
  - id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http: 409
    condition: "the policy's coverage_cents is below the highest insurance_required_coverage_cents demanded by the trip's destinations"

  - id: ERR_SECURITY_BUDGET_EXCEEDED
    http: 402
    condition: "the provisional trip cost exceeds the executive's remaining_budget_cents"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# -----------------------------------------------------------------------------
roles:

  - name: SecurityAnalyst
    description: "Threat-monitoring and assessment analyst. Owns the intelligence inputs — exposure signals, residential surveys, destination ratings — and drafts risk assessments, but can never approve one."
    identity: "entity_backed:SecurityStaff"
    exclusive_operations:
      - "POST /exec-protection/executives/{id}/residential-survey"
      - "POST /exec-protection/executives/{id}/exposure-signals"
      - "POST /exec-protection/destination-ratings"
      - "PATCH /exec-protection/destination-ratings/{country_code}"
      - "POST /exec-protection/risk-assessments"
      - "POST /exec-protection/risk-assessments/{id}/submit"
    shared_operations:
      - "POST /exec-protection/trip-legs/{id}/advance-progress with outcome COMPLETE (shared with ProtectionManager, SecurityDirector)"
      - "all GET reads of executives, exposure signals, assessments, trips, legs, assignments and engagements"

  - name: ProtectionManager
    description: "Detail planner and trip owner. Builds trips, legs, details and vendor engagements, submits trips for approval and settles them at close, but can never approve or deny its own trip."
    identity: "entity_backed:SecurityStaff"
    exclusive_operations:
      - "POST /exec-protection/trips"
      - "POST /exec-protection/trips/{id}/legs"
      - "POST /exec-protection/trips/{id}/submit-for-approval"
      - "POST /exec-protection/trips/{id}/close"
      - "POST /exec-protection/detail-assignments"
      - "POST /exec-protection/detail-assignments/{id}/release"
    shared_operations:
      - "POST /exec-protection/executives (shared with SecurityDirector)"
      - "PATCH /exec-protection/executives/{id}/consent (shared with Executive)"
      - "POST /exec-protection/insurance-policies (shared with ComplianceOfficer)"
      - "POST /exec-protection/vendors, POST /exec-protection/vendor-engagements, POST /exec-protection/vendor-engagements/{id}/complete (shared with SecurityDirector)"
      - "POST /exec-protection/trips/{id}/incidents, POST /exec-protection/incidents/{id}/triage, POST /exec-protection/incidents/{id}/resolve (shared with SecurityDirector)"
      - "POST /exec-protection/trip-legs/{id}/advance-progress with outcome COMPLETE (shared with SecurityAnalyst, SecurityDirector)"

  - name: SecurityDirector
    description: "Approving authority for assessments and for trips at the PENDING_REVIEW stage. The only role that may waive advance work, suspend a vendor or close an incident."
    identity: "entity_backed:SecurityStaff"
    exclusive_operations:
      - "POST /exec-protection/risk-assessments/{id}/review"
      - "POST /exec-protection/vendors/{id}/suspend"
      - "POST /exec-protection/incidents/{id}/close"
      - "POST /exec-protection/trip-legs/{id}/advance-progress with outcome WAIVED"
    shared_operations:
      - "POST /exec-protection/security-staff (shared with SystemOperator)"
      - "POST /exec-protection/executives (shared with ProtectionManager)"
      - "POST /exec-protection/trips/{id}/decision while approval_state == PENDING_REVIEW (the PENDING_COMPLIANCE hop belongs to ComplianceOfficer)"
      - "POST /exec-protection/vendors, POST /exec-protection/vendor-engagements, POST /exec-protection/vendor-engagements/{id}/complete (shared with ProtectionManager)"
      - "POST /exec-protection/trips/{id}/incidents, POST /exec-protection/incidents/{id}/triage, POST /exec-protection/incidents/{id}/resolve (shared with ProtectionManager)"

  - name: Executive
    description: "The protectee. Controls their own tracking-consent boundary, acknowledges pre-trip briefings and files check-ins including duress signals. Reads are restricted to their own record and trips."
    identity: "entity_backed:Executive"
    exclusive_operations:
      - "POST /exec-protection/trips/{id}/briefing-ack"
      - "POST /exec-protection/trips/{id}/check-ins"
      - "GET /exec-protection/executives/{id}/perquisite-disclosure for their own id (shared with ComplianceOfficer and SecurityDirector, who may read any)"
    shared_operations:
      - "PATCH /exec-protection/executives/{id}/consent for their own id (shared with ProtectionManager)"
      - "GET /exec-protection/executives/{id}, GET /exec-protection/trips/{id}, GET /exec-protection/trips/{id}/legs, GET /exec-protection/trips/{id}/check-ins, GET /exec-protection/executives/{id}/insurance-policies — always narrowed to their own records by ERR_NOT_RESOURCE_OWNER"

  - name: ComplianceOfficer
    description: "Insurance and disclosure control. Verifies coverage and owns the second approval hop for DIRECTOR_AND_COMPLIANCE trips. Never plans or costs a detail."
    identity: opaque
    exclusive_operations:
      - "POST /exec-protection/insurance-policies/{id}/verify"
      - "POST /exec-protection/trips/{id}/decision while approval_state == PENDING_COMPLIANCE"
    shared_operations:
      - "POST /exec-protection/insurance-policies (shared with ProtectionManager)"
      - "GET /exec-protection/executives/{id}/perquisite-disclosure for any executive"
      - "read-only access to assessments, trips, legs, assignments, engagements, incidents and check-ins"

  - name: SystemOperator
    description: "Operational bootstrap and time control. Holds the logical clock and can register the first staff rows before any staff-backed role exists."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /exec-protection/security-staff (shared with SecurityDirector)"
      - "GET /exec-protection/security-staff/{id}"
