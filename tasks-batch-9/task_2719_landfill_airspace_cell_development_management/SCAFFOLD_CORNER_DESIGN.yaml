              payload: { last_vacuum_in_h2o: 8.0, last_methane_pct: 40.0, last_oxygen_pct: 11.9 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { w1_state2: $.data.status }
          assert:
            - "${w1_state} == 'CONNECTED' in setup (C-1 is ACTIVE, so the wellfield guard passes)"
            - "${e_pending} == 'ERR_PENDING_SCREENING_PRESENT' with HTTP 409 — L-2 is still PENDING"
            - "${l2_screen} == 'CLEARED' and then ${e_uncert} == 'ERR_UNCERTIFIED_LOADS_PRESENT' with HTTP 409 — a cleared load with certified_net_tons null blocks the close"
            - "${l3_screen} == 'PENDING' and the create succeeds: three non-REJECTED loads is EXACTLY daily_load_limit 3, and exact equality is allowed"
            - "${e_limit} == 'ERR_DAILY_LOAD_LIMIT_EXCEEDED' with HTTP 409 for the fourth load, and GET /operating-days/${od_id}/waste-loads still reports total_count 3"
            - "${e_date} == 'ERR_DUPLICATE_OPERATING_DATE' with HTTP 409 — operating_date is unique per landfill"
            - "${e_oxygen} == 'ERR_WELL_OXYGEN_CRITICAL' with HTTP 422 at oxygen exactly 12.0 (the constant is itself critical), and GasWell W-1 is untouched: status 'CONNECTED', last_oxygen_pct null, last_tuned_at null"
            - "${w1_state2} == 'TUNING_REQUIRED' at oxygen 11.9 with methane 40.0 below the 45.0 spec, and Landfill.gas_collection_status becomes 'CORRECTIVE_ACTION'"
            - "OperatingDay D-1 is still OPEN with tons_placed 0 after both refused closes"

      - name: closing_a_day_past_the_permit_ceiling_is_rejected_without_cascade
