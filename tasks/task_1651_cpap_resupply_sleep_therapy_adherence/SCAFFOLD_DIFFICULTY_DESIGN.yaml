              as: IntakeCoordinator
              captures: { pat18: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments"
              payload: { patient_id: "${pat18}", device_serial: "SN-018", device_model: "Airsense-11", acquisition_type: "RENTAL" }
              as: IntakeCoordinator
              captures: { de18: $.data.id }
            - call: "POST /sleep-therapy/device-enrollments/${de18}/begin-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de18}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/rental-contracts"
              payload: { patient_id: "${pat18}" }
              as: OpsAdmin
              captures: { rc18: "$.data[0].id" }
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sleep-therapy/_ops/run-daily-sweep"
              payload: {}
              as: OpsAdmin
            - call: "POST /sleep-therapy/rental-contracts/${rc18}/bill-rental-month"
              payload: {}
              as: BillingSpecialist
            - call: "GET /sleep-therapy/rental-contracts/${rc18}"
              payload: {}
              as: OpsAdmin
              captures: { rc18_months_pre_pause: $.data.rental_months_billed }
            # pause
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pat18}", device_enrollment_id: "${de18}", window_end_on: "2026-09-30", nights_reported: 30, compliant_nights: 5 }
              as: RespiratoryTherapist
              captures: { ar18a: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ar18a}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar18a}/finalize"
              payload: {}
              as: RespiratoryTherapist
            # resume
            - call: "POST /sleep-therapy/adherence-reports"
              payload: { patient_id: "${pat18}", device_enrollment_id: "${de18}", window_end_on: "2026-10-15", nights_reported: 30, compliant_nights: 28 }
              as: RespiratoryTherapist
              captures: { ar18b: $.data.id }
            - call: "POST /sleep-therapy/adherence-reports/${ar18b}/begin-review"
              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/adherence-reports/${ar18b}/finalize"
              payload: {}
              as: RespiratoryTherapist
          trigger:
            - call: "GET /sleep-therapy/rental-contracts/${rc18}"
              payload: {}
              as: OpsAdmin
              captures: { rc18_months_post_resume: $.data.rental_months_billed, rc18_status: $.data.billing_status }
          assert:
            - "before pause: rental_months_billed == 1 (${rc18_months_pre_pause})"
            - "after pause+resume cycle: rental_months_billed == 1 (${rc18_months_post_resume})   # compensating invariant holds"
