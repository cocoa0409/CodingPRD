  - { method: GET, path: "/grain-drying/damage-claims/{id}", description: "Get one damage claim", roles: [ElevatorManager, Grower, ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: POST, path: "/grain-drying/damage-claims/{id}/review", description: "Open review on a FILED or APPEALED claim", roles: [ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: ["FILED|APPEALED -> UNDER_REVIEW", "reviewed_by_user_id=X-User-ID"] }
