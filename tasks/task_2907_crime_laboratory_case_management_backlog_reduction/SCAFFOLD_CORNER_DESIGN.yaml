            - "second trigger: HTTP status == 409 and ${e_reinstate} == ERR_ANALYST_DECERTIFIED and Analyst.${a1}.qualification_state == DECERTIFIED"
            - "third trigger: HTTP status == 409 and ${e_auto} == ERR_NO_ELIGIBLE_ANALYST (the decertified analyst is filtered out of the candidate pool rather than reported individually)"

  # ===========================================================================
  # Table 7 (RBAC). role_model is segregation_of_duties, so the only applicable
  # role-model row of the guide is that one; approval_chain, peer_roles,
  # hierarchical_override and delegated_authority are not this scaffold's model
  # and are skipped. The person-level clause of the model (same operator cannot
  # sign two review steps) is exercised by
  # caller_identity_and_reviewer_identity_violations_are_rejected in the errors
  # section above; the instance below covers the role-level clause.
  # ===========================================================================
  - section: rbac
    instances:

      - name: cross_role_exclusive_operations_are_unauthorized_in_both_directions
        claim_type: segregation_of_duties
        grounds:
          - rbac
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
          - endpoints[GET /lab/cases]
        distinguishing_aspect: "The five roles partition the exclusive operations with no hierarchical override anywhere: LabDirector owns the registries yet is refused the technical review, QualityManager owns the quality system yet is refused the administrative release, CaseManager routes work yet is refused method validation, EvidenceTechnician owns custody yet is refused analyst creation, and Analyst performs casework yet is refused case intake. Shared reads are not universal either - the Analyst role is absent from the GET /lab/cases roles list and is refused there while the other four roles are admitted, and every refusal is a 403 that never reaches the state machine."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 is left DRAFT (the target of the refused validation) and Method M2 is VALIDATED; Case C1 (OTHER) is ACCEPTED with BIOLOGICAL item E1 and carries one QUEUED request R1 on (E1, M2, item_count 1). Every setup row is created by its legitimate owning role."
            - "R1's state is irrelevant to every trigger below: authorisation is decided at validations[priority=2], ahead of the priority 8 state guard."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "Draft Scope Method", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, accreditation_scope_code: "BIO-DSC-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Validated Scope Method", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, max_items_per_request: 6, accreditation_scope_code: "BIO-VSC-01" }
              as: QualityManager
              captures: { m2: $.data.id }
            - call: "POST /lab/methods/${m2}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0509", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m2}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /lab/analysts"
              payload: { full_name: "Technician Created Examiner", disciplines: ["BIOLOGY"], weekly_capacity_hours: 40.00 }
              as: EvidenceTechnician
              captures: { e_tech: $.data.error_id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CaseManager
              captures: { e_cm: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/administrative-review"
              payload: { decision: "APPROVE", rationale: "Quality manager releasing casework" }
              as: QualityManager
              captures: { e_qm: $.data.error_id }
            - call: "POST /lab/examination-requests/${r1}/technical-review"
              payload: { decision: "AGREE", rationale: "Director reviewing casework" }
              as: LabDirector
              captures: { e_dir: $.data.error_id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0510", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: Analyst
              as_user_id: "00000000-0000-4000-8000-0000000e0021"
              captures: { e_analyst: $.data.error_id }
            - call: "GET /lab/cases"
              payload: {}
              as: Analyst
              as_user_id: "00000000-0000-4000-8000-0000000e0021"
              captures: { e_analyst_list: $.data.error_id }
            - call: "GET /lab/cases"
              payload: {}
              as: EvidenceTechnician
            - call: "GET /lab/cases"
              payload: {}
              as: CaseManager
            - call: "GET /lab/cases"
              payload: {}
              as: QualityManager
            - call: "GET /lab/cases"
              payload: {}
              as: LabDirector
            - call: "GET /lab/cases/${c1}"
              payload: {}
              as: Analyst
              as_user_id: "00000000-0000-4000-8000-0000000e0021"
              captures: { seen_case: $.data.agency_case_number }
          assert:
            - "the first five triggers each return HTTP status == 403 with ${e_tech} == ${e_cm} == ${e_qm} == ${e_dir} == ${e_analyst} == ERR_UNAUTHORIZED"
            - "Method.${m1}.validation_status == DRAFT (the refused validation changed nothing)"
            - "ExaminationRequest.${r1}.status == QUEUED and no ReviewRecord exists for ${r1}"
            - "GET /lab/cases returns total_count == 1 for exactly one case after all refusals (the Analyst-role creation attempt persisted nothing)"
            - "sixth trigger: HTTP status == 403 and ${e_analyst_list} == ERR_UNAUTHORIZED (Analyst is not in the GET /lab/cases roles list)"
            - "triggers seven through ten: HTTP status == 200 for EvidenceTechnician, CaseManager, QualityManager and LabDirector"
            - "eleventh trigger: HTTP status == 200 and ${seen_case} == O-2026-0509 (the single-case read IS shared with Analyst)"

  # ===========================================================================
  # Cross-cutting complexity layers. complexity_layers declares exactly four:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  # rate_threshold_triggers; no other row of the guide's layer table is active.
  # Both SS1.2.1 concurrency_rules entries get their own stale-version instance.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: priority_override_with_a_stale_case_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[priority-override-create-stale-case]
          - errors[ERR_STALE_CASE_VERSION]
          - endpoints[POST /lab/cases/{case_id}/priority-overrides]
        distinguishing_aspect: "The intake acceptance silently bumps Case.version, so the version observed at creation is already stale by the time the director records an override: that call is refused with 412 ERR_STALE_CASE_VERSION and leaves priority_override_class null, while the identical call carrying the re-read version succeeds and bumps the version again - which is why the second, superseding override has to re-read once more rather than reuse the value it just sent."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Case C1 (OTHER, no custody, no dates -> priority_score 4.00, priority_class P3_ROUTINE) is created, given one sealed BIOLOGICAL item, then ACCEPTED. The accept transition increments Case.version, invalidating the version captured at creation."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0511", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id, c1_v0: $.data.version }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { c1_v1: $.data.version }
          trigger:
            - call: "POST /lab/cases/${c1}/priority-overrides"
              payload: { priority_override_class: "P1_STATUTORY", priority_override_reason: "District attorney trial setting", expected_case_version: "${c1_v0}" }
              as: LabDirector
              captures: { e_stale: $.data.error_id }
            - call: "POST /lab/cases/${c1}/priority-overrides"
              payload: { priority_override_class: "P1_STATUTORY", priority_override_reason: "District attorney trial setting", expected_case_version: "${c1_v1}" }
              as: LabDirector
              captures: { c1_v2: $.data.version, override1: $.data.priority_override_class }
            - call: "POST /lab/cases/${c1}/priority-overrides"
              payload: { priority_override_class: "P3_ROUTINE", priority_override_reason: "Trial continued; returned to routine", expected_case_version: "${c1_v1}" }
              as: LabDirector
              captures: { e_stale2: $.data.error_id }
            - call: "POST /lab/cases/${c1}/priority-overrides"
              payload: { priority_override_class: "P3_ROUTINE", priority_override_reason: "Trial continued; returned to routine", expected_case_version: "${c1_v2}" }
              as: LabDirector
              captures: { override2: $.data.priority_override_class, reason2: $.data.priority_override_reason }
          assert:
            - "first trigger: HTTP status == 412 and ${e_stale} == ERR_STALE_CASE_VERSION"
            - "Case.${c1}.priority_override_class == null and Case.${c1}.priority_override_reason == null and Case.${c1}.version == ${c1_v1} after the refusal"
            - "second trigger: HTTP status == 200, ${override1} == P1_STATUTORY and ${c1_v2} != ${c1_v1}"
            - "Case.${c1}.priority_score == 4.00 (the override replaces the class, not the score)"
            - "third trigger: HTTP status == 412 and ${e_stale2} == ERR_STALE_CASE_VERSION (the version consumed by the successful override is stale for the next writer)"
            - "Case.${c1}.priority_override_class == P1_STATUTORY after the third trigger"
            - "fourth trigger: HTTP status == 200, ${override2} == P3_ROUTINE and ${reason2} == Trial continued; returned to routine"

      - name: reassignment_with_a_stale_request_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-request]
          - errors[ERR_STALE_EXAM_REQUEST_VERSION]
          - state_machines.ExaminationRequest[ASSIGNED->ASSIGNED]
        distinguishing_aspect: "A reassignment displaces whoever currently holds the request, so a writer working from the version it saw before the first assignment must be refused with 412 rather than silently superseding a holder it never observed: A1 keeps the ACTIVE Assignment and its 4.00 committed hours after the refusal, and only the re-read version performs the supersede. This is the OCC axis of the endpoint, distinct from the hour-conservation invariant asserted by the SS1.8 instance reassignment_conserves_total_committed_casework_hours."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analysts A1 and A2: BIOLOGY, competency 4, capacity 40.00, training 8.00 -> available 32.00 each."
            - "Method M1 VALIDATED BIOLOGY, standard_hours_per_item 4.00, min_competency_level 2."
            - "Case C1 (OTHER -> P3_ROUTINE) ACCEPTED with BIOLOGICAL item E1; request R1 (item_count 1 -> 4.00 h) created, version captured, then assigned to A1 (which bumps the version)."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "OCC Incumbent", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "OCC Successor", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Touch DNA Recovery", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, max_items_per_request: 6, accreditation_scope_code: "BIO-TDR-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0512", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed swab", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v0: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v0}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg1: $.data.id }
          trigger:
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a2}", expected_examination_request_version: "${r1_v0}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { e_stale: $.data.error_id }
            - call: "GET /lab/examination-requests/${r1}"
              payload: {}
              as: CaseManager
              captures: { r1_v1: $.data.version, holder_after_refusal: $.data.assigned_analyst_id }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a2}", expected_examination_request_version: "${r1_v1}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg2: $.data.id, asg2_hours: $.data.estimated_hours }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: CaseManager
              captures: { a1_hours: $.data.assigned_casework_hours, a1_active: $.data.active_assignment_count }
            - call: "GET /lab/analysts/${a2}/workload"
              payload: {}
              as: CaseManager
              captures: { a2_hours: $.data.assigned_casework_hours, a2_pct: $.data.projected_utilization_pct }
          assert:
            - "first trigger: HTTP status == 412 and ${e_stale} == ERR_STALE_EXAM_REQUEST_VERSION"
            - "${holder_after_refusal} == ${a1} and Assignment.${asg1}.status == ACTIVE with superseded_by_assignment_id == null"
            - "${r1_v1} != ${r1_v0} (the first, successful assignment had already bumped the version)"
            - "third trigger: HTTP status == 201, ${asg2_hours} == 4.00 and Assignment.${asg2}.analyst_id == ${a2}"
            - "Assignment.${asg1}.status == SUPERSEDED and Assignment.${asg1}.superseded_by_assignment_id == ${asg2}"
            - "${a1_hours} == 0.00 and ${a1_active} == 0"
            - "${a2_hours} == 4.00 and ${a2_pct} == 12.50"
            - "ExaminationRequest.${r1}.assigned_analyst_id == ${a2} and ExaminationRequest.${r1}.status == ASSIGNED"

      - name: pt_failure_cascade_reaches_case_requeue_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProficiencyTest[SUBMITTED->SCORED]
          - state_machines.Analyst[PROBATION->SUSPENDED]
          - state_machines.ExaminationRequest[ASSIGNED->QUEUED]
        excluded_because:
          difficulty_instance: "transitive_cascade / second_pt_failure_suspends_analyst_releases_hours_and_requeues_case"
          rationale: "That instance walks the full four-hop chain (counter increment, qualification transition, assignment release with hour de-encumbrance, CASE_RECOMPUTE back to AWAITING_ASSIGNMENT) and asserts every hop's observable, which is exactly this layer's N-level claim."

      - name: workload_variants_diverge_on_the_same_history
        claim_type: dual_variant_calculation
        grounds:
          - calculations.analyst_workload_variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / analyst_workload_projected_estimate_vs_realized_logged"
          rationale: "That instance drives one analyst through a mixed ACTIVE/COMPLETED history and asserts both variants plus their delta against pre-computed literals."

      - name: backlog_outsourcing_threshold_at_the_exact_trigger_index
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.backlog_aging_index
        excluded_because:
          difficulty_instance: "boundary_precision_check / backlog_outsourcing_trigger_fires_at_exactly_index_45"
          rationale: "That instance pins the instantaneous-threshold half of this layer at exactly OUTSOURCE_TRIGGER_INDEX 45.0 and one increment either side."

      - name: consecutive_failure_counter_resets_on_a_pass_so_the_third_failure_does_not_suspend
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.proficiency_test_grading
          - state_machines.Analyst[PROBATION->QUALIFIED]
          - state_machines.Nonconformance[CAPA_APPROVED->CLOSED]
        distinguishing_aspect: "The suspension trigger counts CONSECUTIVE failures, so a PASS between two failures resets consecutive_pt_failures to 0 and the later failure lands at 1 - PROBATION again, never SUSPENDED - even though the analyst has now failed twice in total. The reset is a property of the counter, not of the qualification state: the closure of the first finding lifts the analyst to QUALIFIED while the counter is still 1, and only the PASS zeroes it."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00, QUALIFIED with consecutive_pt_failures 0."
            - "Method M1 VALIDATED BIOLOGY, standard_hours_per_item 4.00, min_competency_level 2."
            - "Three proficiency cycles, each submitted before its due instant so late_submission stays false: 2026-C1 scored 50.00 (< PT_INCONCLUSIVE_PCT 70.0 -> FAIL), 2026-C2 scored exactly PT_PASS_PCT 90.00 (-> PASS), 2026-C3 scored 60.00 (-> FAIL)."
            - "The MAJOR PT_FAILURE finding raised by the first failure is read back from the filtered listing and driven to CLOSED, which lifts the analyst PROBATION -> QUALIFIED because no other finding remains open."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Counter Reset Examiner", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Quantitation Proficiency Method", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, max_items_per_request: 6, accreditation_scope_code: "BIO-QPM-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C1", due_utc: "2026-08-15T00:00:00Z" }
              as: QualityManager
              captures: { pt1: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt1}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt1}/score"
              payload: { score_pct: 50.00 }
              as: QualityManager
              captures: { r1_result: $.data.result }
            - call: "GET /lab/nonconformances"
              payload: { analyst_id: "${a1}", source: "PT_FAILURE" }
              as: QualityManager
              captures: { n1: "$.data[0].id" }
          trigger:
            - call: "POST /lab/nonconformances/${n1}/root-cause"
              payload: { root_cause_category: "TRAINING", corrective_action_plan: "Refresher on quantitation calibration" }
              as: CaseManager
            - call: "POST /lab/nonconformances/${n1}/capa-decision"
              payload: { decision: "APPROVE", rationale: "Plan accepted" }
              as: QualityManager
            - call: "POST /lab/nonconformances/${n1}/verify-close"
              payload: { closure_note: "Refresher completed and witnessed" }
              as: QualityManager
            - call: "GET /lab/analysts/${a1}"
              payload: {}
              as: QualityManager
              captures: { state_after_close: $.data.qualification_state, counter_after_close: $.data.consecutive_pt_failures }
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C2", due_utc: "2026-08-20T00:00:00Z" }
              as: QualityManager
              captures: { pt2: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt2}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt2}/score"
              payload: { score_pct: 90.00 }
              as: QualityManager
              captures: { r2_result: $.data.result }
            - call: "GET /lab/analysts/${a1}"
              payload: {}
              as: QualityManager
              captures: { state_after_pass: $.data.qualification_state, counter_after_pass: $.data.consecutive_pt_failures }
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C3", due_utc: "2026-08-25T00:00:00Z" }
              as: QualityManager
              captures: { pt3: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt3}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt3}/score"
              payload: { score_pct: 60.00 }
              as: QualityManager
              captures: { r3_result: $.data.result }
            - call: "GET /lab/analysts/${a1}"
              payload: {}
              as: QualityManager
              captures: { final_state: $.data.qualification_state, final_counter: $.data.consecutive_pt_failures, final_suspended_at: $.data.suspended_at_utc }
          assert:
            - "setup: ${r1_result} == FAIL, Analyst.${a1}.qualification_state == PROBATION and Analyst.${a1}.consecutive_pt_failures == 1"
            - "third trigger: Nonconformance.${n1}.status == CLOSED"
            - "${state_after_close} == QUALIFIED and ${counter_after_close} == 1 (closure lifts the state, it does not touch the counter)"
            - "seventh trigger: ${r2_result} == PASS (90.00 is inclusive on the pass band)"
            - "${state_after_pass} == QUALIFIED and ${counter_after_pass} == 0"
            - "eleventh trigger: ${r3_result} == FAIL"
            - "${final_counter} == 1, not 2 - the pass reset the run"
            - "${final_state} == PROBATION and ${final_suspended_at} == null (PT_SUSPENSION_THRESHOLD 2 was never reached)"
            - "ProficiencyTest.${pt3}.late_submission == false"

  # ===========================================================================
  # Consistency model. complexity_profile.consistency_model is `immediate`, so the
  # only applicable row of the guide's table is that one; the eventual and saga
  # rows do not apply to this scaffold.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: assignment_cascades_are_visible_in_the_immediately_following_reads
        claim_type: immediate
        grounds:
          - state_machines.Case[ACCEPTED->AWAITING_ASSIGNMENT]
          - state_machines.Case[AWAITING_ASSIGNMENT->IN_PROGRESS]
          - calculations.analyst_workload_variants
          - calculations.backlog_aging_index
          - endpoints[GET /lab/analysts/{analyst_id}/workload]
        distinguishing_aspect: "Every derived surface touched by a write is correct in the very next read with no settling step: creating the request has already flipped the case ACCEPTED -> AWAITING_ASSIGNMENT in the create response itself, and the assignment response is immediately followed by a workload read showing assigned_casework_hours 8.00 / projected_utilization_pct 25.00, a case read showing IN_PROGRESS, a filtered request listing of total_count 1 and a backlog report of open_request_count 1 - all without re-issuing any write."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: BIOLOGY, competency 4, capacity 40.00, training 8.00 -> available_hours round_half_up(40.00 - 8.00, 2) == 32.00."
            - "Method M1 VALIDATED BIOLOGY, standard_hours_per_item 4.00, min_competency_level 2, max_items_per_request 6."
            - "Case C1 (OTHER, no custody, no dates -> priority_score 4.00, P3_ROUTINE) ACCEPTED with BIOLOGICAL item E1."
            - "Hand-executed formulas for the reads: estimated_hours round_half_up(4.00 * 2, 2) == 8.00; projected_utilization_pct round_half_up(8.00 / 32.00 * 100, 2) == 25.00; casework_training_ratio round_half_up(8.00 / 8.00, 2) == 1.00; the request's age at 2026-08-01T00:00:00Z is round_half_up(0 / 86400, 2) == 0.00 days, so weighted age round_half_up(0.00 * 1.0, 2) == 0.00 and backlog_index == 0.00, below OUTSOURCE_TRIGGER_INDEX 45.0."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Read After Write Examiner", disciplines: ["BIOLOGY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "Reference Sample Typing", discipline: "BIOLOGY", standard_hours_per_item: 4.00, min_competency_level: 2, max_items_per_request: 6, accreditation_scope_code: "BIO-RST-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 2.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0513", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed reference card", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { status_after_accept: $.data.workflow_status }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: CaseManager
              captures: { pre_hours: $.data.assigned_casework_hours, pre_pct: $.data.projected_utilization_pct }
          trigger:
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v: $.data.version, r1_hours: $.data.estimated_hours }
            - call: "GET /lab/cases/${c1}"
              payload: {}
              as: CaseManager
              captures: { status_after_request: $.data.workflow_status, open_count: $.data.open_examination_request_count }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v}", assignment_reason: "MANUAL" }
              as: CaseManager
              captures: { asg1: $.data.id, asg1_status: $.data.status }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: CaseManager
              captures: { post_hours: $.data.assigned_casework_hours, post_pct: $.data.projected_utilization_pct, post_ratio: $.data.casework_training_ratio, post_active: $.data.active_assignment_count, post_realized: $.data.realized_load_hours }
            - call: "GET /lab/cases/${c1}"
              payload: {}
              as: CaseManager
              captures: { status_after_assign: $.data.workflow_status }
            - call: "GET /lab/examination-requests"
              payload: { assigned_analyst_id: "${a1}", status: "ASSIGNED" }
              as: CaseManager
            - call: "GET /lab/backlog-report"
              payload: { discipline: "BIOLOGY" }
              as: CaseManager
              captures: { open_requests: $.data.open_request_count, idx: $.data.backlog_index, b0: $.data.bucket_0_29_count, p1: $.data.p1_open_count, rec: $.data.outsourcing_recommended, as_of: $.data.as_of_utc }
          assert:
            - "setup: ${status_after_accept} == ACCEPTED, ${pre_hours} == 0.00 and ${pre_pct} == 0.00"
            - "first trigger: HTTP status == 201 and ${r1_hours} == 8.00"
            - "second trigger: ${status_after_request} == AWAITING_ASSIGNMENT and ${open_count} == 1 (the CASE_RECOMPUTE hop is already visible in the next read)"
            - "third trigger: HTTP status == 201 and ${asg1_status} == ACTIVE"
            - "${post_hours} == 8.00, ${post_pct} == 25.00, ${post_ratio} == 1.00 and ${post_active} == 1"
            - "${post_realized} == 8.00 (an ACTIVE assignment with no logged hours falls back to its estimate in the realized variant)"
            - "${status_after_assign} == IN_PROGRESS"
            - "the filtered request listing returns total_count == 1 with has_more false"
            - "${open_requests} == 1, ${idx} == 0.00, ${b0} == 1, ${p1} == 0, ${rec} == false and ${as_of} == 2026-08-01T00:00:00Z"
