# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Background Actor & Extras Casting. Breadth probe over §1.1–§1.7 per
# references/claim-extraction-guide.md. Chains replay from empty DB;
# clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: production_create_defaults
        claim_type: creation_defaults
        grounds: [entities.Production]
        distinguishing_aspect: "POST /productions returns 201 with server-computed fields initialized: status SETUP, compliance_index 100, payroll_exposure_cents 0, version 1, bare-UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film D", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id, st: $.data.status, ci: $.data.compliance_index, ex: $.data.payroll_exposure_cents, v: $.data.version } }
          trigger: []
          assert:
            - "${st} == SETUP, ${ci} == 100, ${ex} == 0, ${v} == 1"
            - "${prod} is a bare UUID (no type prefix); created_at/updated_at present with 3 fractional digits"
      - name: actor_create_defaults
        claim_type: creation_defaults
        grounds: [entities.BackgroundActor]
        distinguishing_aspect: "Actor starts REGISTERED with reliability_score 100, no_show_count 0, special_abilities defaulting to []."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /central-casting/actors", payload: { legal_name: "A One", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { act: $.data.id, st: $.data.status, rel: $.data.reliability_score, ns: $.data.no_show_count, sa: $.data.special_abilities } }
          trigger: []
          assert:
            - "${st} == REGISTERED, ${rel} == 100, ${ns} == 0, ${sa} == []"
      - name: casting_call_computed_fields_init
        claim_type: computed_fields
        grounds: [entities.CastingCall]
        distinguishing_aspect: "Computed slot/ratio fields initialize from inputs: slots_available = union_slots + nonunion_slots, required_union_slots = union_slots, approved_waiver_reduction 0, actual_compliant null, status DRAFT."
        test_recipe:
          setup: ["Production ACTIVE"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film E", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
          trigger:
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 30", union_slots: 2, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 9000 }, as: CastingDirector, captures: { av: $.data.slots_available, rus: $.data.required_union_slots, awr: $.data.approved_waiver_reduction, ac: $.data.actual_compliant, st: $.data.status } }
          assert:
            - "${av} == 3, ${rus} == 2, ${awr} == 0, ${ac} == null, ${st} == DRAFT"
      - name: look_requirement_immutable_no_version
        claim_type: immutability
        grounds: [entities.LookRequirement]
        distinguishing_aspect: "common_fields: false entity carries id + created_at only — no version/updated_at keys in the response, and no update endpoint exists."
        test_recipe:
          setup: ["Production ACTIVE; call DRAFT"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film F", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 31", union_slots: 1, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 9000 }, as: CastingDirector, captures: { cc: $.data.id } }
          trigger:
            - { call: "POST /central-casting/look-requirements", payload: { casting_call_id: "${cc}", category: "PERIOD_COSTUME", description: "1920s tuxedo", bump_amount_cents: 2500, mandatory: true }, as: CastingDirector, captures: { lr: $.data.id } }
          assert:
            - "Response has id and created_at but no version or updated_at key"
            - "GET /central-casting/look-requirements/${lr} returns the same immutable record"
      - name: booking_rate_snapshot_on_create
        claim_type: computed_fields
        grounds: [entities.Booking, calculations.booking_rate_snapshot]
        distinguishing_aspect: "daily_rate_cents and slot_type are snapshotted from actor union_status at creation: union actor gets union_rate_cents/UNION, nonunion gets nonunion_rate_cents/NONUNION."
        test_recipe:
          setup: ["Production ACTIVE; call PUBLISHED with union_rate 12345, nonunion_rate 6789; one SAG_AFTRA and one NONUNION actor ELIGIBLE"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film G", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "U Snap", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { au: $.data.id } }
            - { call: "POST /central-casting/actors/${au}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Snap", union_status: "NONUNION" }, as: AgencyAdmin, captures: { an: $.data.id } }
            - { call: "POST /central-casting/actors/${an}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 32", union_slots: 1, nonunion_slots: 1, union_rate_cents: 12345, nonunion_rate_cents: 6789 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
          trigger:
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${au}" }, as: CastingAssociate, captures: { ru: $.data.daily_rate_cents, su: $.data.slot_type, cf: $.data.call_time, ew: $.data.expected_wrap_time } }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${an}" }, as: CastingAssociate, captures: { rn: $.data.daily_rate_cents, sn: $.data.slot_type } }
          assert:
            - "Union booking: daily_rate_cents == 12345, slot_type == UNION"
            - "Nonunion booking: daily_rate_cents == 6789, slot_type == NONUNION"
            - "call_time defaulted to 2026-08-10T07:00:00Z and expected_wrap_time == 2026-08-10T17:00:00Z (computed, not client-supplied)"
      - name: voucher_auto_created_draft_at_checkin
        claim_type: computed_fields
        grounds: [entities.Voucher, state_machines.Booking.CONFIRMED_to_CHECKED_IN]
        distinguishing_aspect: "check-in cascade creates exactly one DRAFT voucher per booking (1:1), discoverable via the filtered list GET /vouchers?booking_id= before wrap-out happens."
        test_recipe:
          setup: ["Production ACTIVE; nonunion actor ELIGIBLE; booking CONFIRMED on SHOOTING call; CHECKED_IN at 07:00"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film H", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N V", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 33", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/check-in", payload: {}, as: CastingAssociate }
          trigger:
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bk}" }, as: CastingAssociate, captures: { vc: "$.data[0].id", vst: "$.data[0].status", vbk: "$.data[0].booking_id" } }
          assert:
            - "Exactly one voucher exists for the booking; ${vst} == DRAFT; ${vbk} == ${bk}"
      - name: production_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PRODUCTION_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns the error envelope with ERR_PRODUCTION_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /central-casting/productions/00000000-0000-4000-8000-000000000000", payload: {}, as: AgencyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRODUCTION_NOT_FOUND, HTTP 404"
      - name: actors_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, entities.BackgroundActor]
        distinguishing_aspect: "Default limit is 10: 11 actors list as 10 items with has_more true and total_count 11; offset 10 returns the 11th with has_more false."
        test_recipe:
          setup: ["11 actors registered"]
          setup_api_calls:
            - { call: "POST /central-casting/actors", payload: { legal_name: "P01", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P02", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P03", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P04", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P05", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P06", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P07", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P08", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P09", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P10", union_status: "NONUNION" }, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "P11", union_status: "NONUNION" }, as: AgencyAdmin }
          trigger:
            - { call: "GET /central-casting/actors", payload: {}, as: AgencyAdmin }
            - { call: "GET /central-casting/actors", payload: { limit: 5, offset: 10 }, as: AgencyAdmin }
          assert:
            - "First page: exactly 10 items, has_more == true, total_count == 11 (defaults limit=10, offset=0)"
            - "Second page (limit 5, offset 10): exactly 1 item, has_more == false"
      - name: production_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Production]
        distinguishing_aspect: "Client-supplied status/compliance_index in the create payload are ignored: the server-minted values (SETUP, 100) win."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /central-casting/productions", payload: { title: "Film I", studio_code: "STX", payroll_company_name: "EntPay", status: "ACTIVE", compliance_index: 5 }, as: AgencyAdmin, captures: { st: $.data.status, ci: $.data.compliance_index } }
          assert:
            - "201 created with ${st} == SETUP and ${ci} == 100 (system fields ignore input)"
  - section: state_machines
    instances:
      - name: booking_double_accept_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Booking.OFFERED_to_CONFIRMED, "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-CONFIRMED booking is rejected with ERR_BOOKING_INVALID_STATE; the first accept's side effects are not re-applied (slot not double-consumed)."
        test_recipe:
          setup: ["Production ACTIVE; call (u0/n1) PUBLISHED; booking OFFERED"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film J", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Dbl", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 34", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
          trigger:
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}", captures: { err: $.data.error_id } }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { av: $.data.slots_available } }
          assert:
            - "error_id == ERR_BOOKING_INVALID_STATE, HTTP 409"
            - "CastingCall.${cc}.slots_available == 0 still (no double side effect)"
      - name: wrapped_booking_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Booking]
        distinguishing_aspect: "WRAPPED is terminal: both cancel and mark-no-show on a WRAPPED booking fail with ERR_BOOKING_INVALID_STATE."
        test_recipe:
          setup: ["Full day flow complete: booking WRAPPED on SHOOTING call"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film K", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Term", union_status: "NONUNION" }, as: AgencyAdmin, captures: { act: $.data.id } }
            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 35", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/wrap-out", payload: {}, as: CastingAssociate }
          trigger:
            - { call: "POST /central-casting/bookings/${bk}/cancel", payload: {}, as: CastingAssociate, captures: { err1: $.data.error_id } }
            - { call: "POST /central-casting/bookings/${bk}/mark-no-show", payload: {}, as: CastingAssociate, captures: { err2: $.data.error_id } }
          assert:
            - "Both triggers fail: error_id == ERR_BOOKING_INVALID_STATE for cancel and mark-no-show from WRAPPED"
      - name: casting_call_cancel_cascades
        claim_type: side_effect_execution
        grounds: [state_machines.CastingCall.PUBLISHED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a PUBLISHED call cascades: OFFERED booking -> CANCELLED with slot released, ACTIVE standby -> EXPIRED, REQUESTED waiver -> REVOKED."
        test_recipe:
          setup: ["Production ACTIVE; call (u1/n0) PUBLISHED with one OFFERED union booking, one ACTIVE standby entry, one REQUESTED waiver"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film L", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "U C1", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { a1: $.data.id } }
            - { call: "POST /central-casting/actors/${a1}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "U C2", union_status: "SAG_AFTRA" }, as: AgencyAdmin, captures: { a2: $.data.id } }
            - { call: "POST /central-casting/actors/${a2}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 36", union_slots: 1, nonunion_slots: 0, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${a1}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/standby-entries", payload: { casting_call_id: "${cc}", actor_id: "${a2}" }, as: CastingAssociate, captures: { se: $.data.id } }
            - { call: "POST /central-casting/ratio-waivers", payload: { casting_call_id: "${cc}", union_slot_reduction: 1, justification: "location shortage" }, as: CastingDirector, as_user_id: "dir-1", captures: { wv: $.data.id } }
          trigger:
            - { call: "POST /central-casting/casting-calls/${cc}/cancel", payload: { reason: "scene cut" }, as: CastingDirector }
            - { call: "GET /central-casting/bookings/${bk}", payload: {}, as: CastingAssociate, captures: { bst: $.data.status } }
            - { call: "GET /central-casting/standby-entries/${se}", payload: {}, as: CastingAssociate, captures: { sst: $.data.status } }
            - { call: "GET /central-casting/ratio-waivers/${wv}", payload: {}, as: CastingAssociate, captures: { wst: $.data.status } }
            - { call: "GET /central-casting/casting-calls/${cc}", payload: {}, as: CastingAssociate, captures: { av: $.data.slots_available, cst: $.data.status } }
          assert:
            - "Booking.${bk}.status == CANCELLED; StandbyEntry.${se}.status == EXPIRED; RatioWaiver.${wv}.status == REVOKED"
            - "CastingCall.${cc}.status == CANCELLED and slots_available == 1 (slot released)"
      - name: production_wrap_blocked_with_open_call_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.Production.ACTIVE_to_WRAPPED, "errors[ERR_PRODUCTION_NOT_WRAPPABLE]"]
        distinguishing_aspect: "Production wrap is rejected while any of its casting calls is not WRAPPED|CANCELLED (here: SHOOTING)."
        test_recipe:
          setup: ["Production ACTIVE; call (u0/n1) taken to SHOOTING with no bookings"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film M2", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 37", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
          trigger:
            - { call: "POST /central-casting/productions/${prod}/wrap", payload: {}, as: CastingDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRODUCTION_NOT_WRAPPABLE, HTTP 409; Production remains ACTIVE"
      - name: payroll_batch_rejection_resubmission_cycle
        claim_type: valid_transition
        grounds: [state_machines.PayrollBatch, state_machines.Voucher.SUBMITTED_to_REJECTED, state_machines.Voucher.REJECTED_to_ISSUED]
        distinguishing_aspect: "Full resubmission cycle: OPEN -> SUBMITTED -> PARTIALLY_REJECTED (voucher REJECTED+removed) -> adjust voucher back to ISSUED -> add-item auto-returns batch to OPEN -> SUBMITTED -> ACKNOWLEDGED with voucher PAID."
        test_recipe:
          setup: ["Issued voucher (gross 10938) in an OPEN batch; batch version tracked for OCC"]
          setup_api_calls:
            - { call: "POST /central-casting/productions", payload: { title: "Film N2", studio_code: "STX", payroll_company_name: "EntPay" }, as: AgencyAdmin, captures: { prod: $.data.id } }
            - { call: "POST /central-casting/productions/${prod}/activate", payload: {}, as: AgencyAdmin }
