              as: AllocationManager
              captures: { dw_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { dw_citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${dw_id}", variety_id: "${dw_citra_id}", crop_year_program_id: "${dw_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { dw_k_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${dw_id}", requested_ship_date: "2026-08-31T00:00:00Z" }
              as: Brewer
              as_user_id: "${dw_id}"
              captures: { dw_early_id: $.data.id }
            - call: "POST /sales-orders/${dw_early_id}/lines"
              payload: { item_type: "HOP", quantity: 1000, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${dw_citra_id}", hop_contract_id: "${dw_k_id}" }
              as: Brewer
              as_user_id: "${dw_id}"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${dw_id}", requested_ship_date: "2026-12-31T00:00:00Z" }
              as: Brewer
              as_user_id: "${dw_id}"
              captures: { dw_edge_id: $.data.id }
            - call: "POST /sales-orders/${dw_edge_id}/lines"
              payload: { item_type: "HOP", quantity: 1000, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${dw_citra_id}", hop_contract_id: "${dw_k_id}" }
              as: Brewer
              as_user_id: "${dw_id}"
          trigger:
            - call: "POST /sales-orders/${dw_early_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${dw_id}"
              captures: { dw_err: $.data.error_id }
            - call: "POST /sales-orders/${dw_edge_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${dw_id}"
