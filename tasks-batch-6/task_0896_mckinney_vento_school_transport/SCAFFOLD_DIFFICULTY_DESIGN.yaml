            - "District.${d1}.transport_balance_cents == 0"
            - "CostShareAgreement.${csa1}.actual_cost_cents == 0"
            - "GET /mv/cost-ledger-entries?cost_share_agreement_id=${csa1} returns 2 entries whose amount_cents sum to 0 (one TRIP_CHARGE +2160, one REVERSAL -2160)"

      - name: benefit_revoke_restores_categorical_eligible_count
        grounds:
          - state_machines.BenefitLink.ACTIVE_to_REVOKED
          - entities.District.fields.categorical_eligible_count
        distinguishing_aspect: "Conserved quantity District.categorical_eligible_count (different from a cents balance): finalize creates the ACTIVE BenefitLink (count 1); revoking it decrements back to 0."
        test_recipe:
          setup:
            - "Eligible student with one ACTIVE BenefitLink (created by finalize); District.categorical_eligible_count == 1."
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "GG", last_name: "HH", birthdate: "2012-09-09", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "GET /mv/benefit-links?student_id=${s1}"
              payload: {}
              as: StateCoordinator
              captures: { bl1: $.data.0.id }
          trigger:
            - call: "POST /mv/benefit-links/${bl1}/revoke"
              payload: {}
              as: StateCoordinator
          assert:
            - "BenefitLink.${bl1}.status == REVOKED"
            - "District.${d1}.categorical_eligible_count == 0"
