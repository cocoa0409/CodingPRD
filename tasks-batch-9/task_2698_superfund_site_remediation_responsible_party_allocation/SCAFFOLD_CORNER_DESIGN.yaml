      - name: corner_provisional_and_final_share_variants_diverge_on_the_same_records
        claim_type: variant_divergence
        grounds:
          - calculations.allocation_share_computation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / allocation_share_provisional_vs_final_diverge_on_waste_in_verification
          rationale: "That instance drives both variants off one fixture and asserts the full divergence including the shifted percentages."

      - name: corner_correct_risk_variant_drives_the_action_level_flag
        claim_type: variant_selection
        grounds:
          - calculations.risk_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_assessment_central_tendency_vs_rme_diverge_on_same_sample_set
          rationale: "That instance pins which variant is reported in which field and that only the RME variant sets action_level_exceeded."

      - name: corner_verification_delta_reconciles_into_the_draft_round_shares
        claim_type: reconciliation
        grounds:
          - calculations.allocation_share_computation.trigger
        excluded_because:
          difficulty_instance: transitive_cascade / waste_in_verification_cascades_three_hops_into_draft_round_shares
          rationale: "The three-hop reconciliation from a verification decision into the DRAFTING round's provisional shares is that instance's subject."

      - name: corner_oversight_indirect_tier_is_keyed_on_the_pre_fee_subtotal
        claim_type: constants_applied
        grounds:
          - calculations.oversight_cost_reimbursement.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / oversight_indirect_tier_keyed_on_pre_fee_direct_subtotal
          rationale: "That instance walks every tier ceiling and proves the full re-rating rather than marginal blending."

      - name: corner_remedy_npv_rounds_each_annual_term
        claim_type: precision
        grounds:
          - calculations.remedy_npv.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / remedy_npv_rounds_each_annual_term_before_summation
          rationale: "That instance contrasts the mandated per-term rounding against the sum-then-round answer at one-cent resolution."

      - name: corner_risk_assessment_excludes_rejected_and_foreign_medium_samples
        claim_type: input_set_filtering
        grounds:
          - calculations.risk_assessment.input_set
        excluded_because:
          difficulty_instance: boundary_precision_check / hazard_index_exactly_at_limit_with_empty_valid_set_first_returns_4XX
          rationale: "That instance builds the empty-VALID-set refusal and then the mixed VALID/ESTIMATED/REJECTED set, so both filters are already pinned."

      - name: corner_de_minimis_ceilings_are_inclusive
        claim_type: constants_applied
        grounds:
          - calculations.de_minimis_eligibility.constants
          - calculations.de_minimis_premium_floor.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / de_minimis_share_exactly_at_ceiling_and_premium_exactly_at_floor
          rationale: "That instance sits a party exactly on the 1.00 share ceiling and exactly on the premium floor, covering both constant sets."

      - name: corner_cost_recovery_ledger_identity_holds_after_every_write
        claim_type: correct_result
        grounds:
          - calculations.cost_recovery_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / collect_then_void_restores_the_money_ledger_identity_around_an_orphan_write_off
          rationale: "That instance asserts the money identity after award, collection and void, including the untouched orphan bucket."

      - name: corner_ownership_days_are_a_half_open_day_count
        claim_type: correct_result
        grounds:
          - calculations.ownership_period_days
        excluded_because:
          difficulty_instance: resource_temporal_overlap / chain_of_title_half_open_adjacency_and_open_ended_period_conflict
          rationale: "That instance asserts the exact day counts for a normal, an adjacent, a zero-length and an open-ended period."

      - name: corner_work_window_capacity_counts_buffered_intervals
        claim_type: correct_result
        grounds:
          - calculations.work_window_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / work_window_buffered_capacity_counts_windows_six_hours_apart
          rationale: "That instance covers the mobilisation buffer, the buffered-adjacency pass and the capacity refusal."

      - name: corner_cost_posture_derivation_prefers_frozen_over_restricted
        claim_type: correct_result
        grounds:
          - calculations.cost_posture_derivation
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_site_posture_outranks_oversight_cap_exceeded_returns_4XX
          rationale: "That instance drives the site into FROZEN while it is also over-utilised and proves FROZEN dominates."

      - name: corner_five_year_review_chains_off_the_previous_due_date
        claim_type: correct_result
        grounds:
