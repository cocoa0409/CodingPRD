scenario: |
  Transfer Credit Evaluation & Articulation (university transfer center): incoming transcript intake & course-to-course equivalency lookup, articulation agreement maintenance with partner institutions, syllabus-based petition review & faculty adjudication, general-education & major requirement application, credit maximum & residency requirement, military/prior-learning credit assessment, appeal & re-evaluation, publication of transfer guides

domain_name: transfer-credit-evaluation-articulation
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PartnerInstitution
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner college/university name" }
      - { name: institution_code, type: string, source: input, description: "Unique short code, e.g. 'PC'" }
      - { name: credit_system, type: enum, source: input, description: "SEMESTER | QUARTER — unit system of partner credits" }
      - { name: state_code, type: string, source: input, required: false, description: "Optional US state code" }

  - name: InternalCourse
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Home catalog code, unique, e.g. 'MATH-150'" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: number, source: input, description: "Semester credit hours; multiple of 0.5 within [0.5, 6.0]" }
      - { name: level, type: enum, source: input, description: "LOWER | UPPER | GRADUATE" }
      - { name: department, type: string, source: input, description: "Owning department code, e.g. 'MATH'" }
      - { name: gened_tags, type: array, source: input, default: [], description: "Zero or one GenEd slot tags: GENED_COMMS | GENED_MATH | GENED_SCIENCE | GENED_HUMANITIES | GENED_SOCIAL; natural-slot rule reads element [0]" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Soft-archival flag; archived courses reject NEW equivalency/petition references but existing references still resolve" }

  - name: ArticulationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: partner_institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id" }
      - { name: program_scope, type: string, source: input, description: "'ALL' or a department code; scopes the agreement" }
      - { name: effective_start, type: datetime, source: input, description: "Half-open window start date (inclusive), ISO date" }
      - { name: effective_end, type: datetime, source: input, description: "Half-open window end date (exclusive); must be strictly after effective_start" }
      - { name: amends_agreement_id, type: string, source: system, default: null, description: "FK -> ArticulationAgreement.id; set when created via the amendments endpoint" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Timestamp of last DRAFT->ACTIVE transition" }
      - { name: expired_at, type: datetime, source: system, default: null, description: "Timestamp of automatic expiry when logical clock reached effective_end" }

  - name: CourseEquivalency
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ArticulationAgreement.id (from path)" }
      - { name: internal_course_id, type: string, source: input, description: "FK -> InternalCourse.id" }
      - { name: external_course_code, type: string, source: input, description: "Partner course code, e.g. 'MATH-101'" }
      - { name: external_title, type: string, source: input, description: "Partner course title" }
      - { name: external_credit_hours, type: number, source: input, description: "Credit hours in the partner's credit_system units; > 0" }
      - { name: effective_from, type: datetime, source: input, description: "CLOSED window start date (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "CLOSED window end date (inclusive); >= effective_from" }
      - { name: equivalency_type, type: enum, source: input, default: DIRECT, description: "DIRECT | GENED_ONLY | ELECTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE — system-managed from parent agreement status cascades; creation under DRAFT agreement yields INACTIVE" }

  - name: TransferStudent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Unique email" }
      - { name: declared_major, type: string, source: input, description: "Department code of declared major, e.g. 'MATH'" }
      - { name: catalog_year, type: integer, source: input, description: "Catalog year, e.g. 2026" }
      - { name: total_posted_transfer_credits, type: number, source: computed, default: 0, description: "Sum of applied_credits over all POSTED EvaluationLineItems of this student; maintained by post/reopen transitions" }
      - { name: total_posted_pla_credits, type: number, source: computed, default: 0, description: "Sum of verified_credits over CREDITED PriorLearningAssessments of this student" }

  - name: Transcript
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> TransferStudent.id" }
      - { name: partner_institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id" }
      - { name: term_completed, type: datetime, source: input, description: "Date the external coursework was completed; used for equivalency window coverage" }
      - { name: courses, type: array, source: input, description: "Array of {external_course_code, title, credit_hours, grade}; grade letter from GRADE_SCALE keys" }
      - { name: status, type: enum, source: system, description: "RECEIVED | VERIFIED | EXTRACTED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set on reject" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Timestamp of verification" }

  - name: TransferCreditEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> TransferStudent.id; must equal the transcript's student_id" }
      - { name: transcript_id, type: string, source: input, description: "FK -> Transcript.id; at most one evaluation per transcript" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | EVALUATED | POSTED" }
      - { name: provisional_credits_total, type: number, source: computed, default: 0, description: "Sum of per-line provisional_credits (per-line rounded values summed; NO second rounding)" }
      - { name: awarded_credits_total, type: number, source: computed, default: 0, description: "Sum of awarded_credits over ADOPTED lines; recomputed at finalize" }
      - { name: applied_credits_total, type: number, source: computed, default: 0, description: "Sum of applied_credits over POSTED lines; set by the posting waterfall" }
      - { name: open_line_count, type: integer, source: computed, default: 0, description: "Count of lines in PENDING | AUTO_MATCHED | PETITION_REQUIRED" }
      - { name: evaluated_by_id, type: string, source: system, default: null, description: "X-User-ID of the evaluator who finalized" }
      - { name: posted_by_id, type: string, source: system, default: null, description: "X-User-ID of the evaluator who posted; must differ from evaluated_by_id" }
      - { name: posted_at, type: datetime, source: system, default: null, description: "Timestamp of posting" }
      - { name: reopen_reason, type: string, source: system, default: null, description: "Reason recorded on reopen (manual or APPEAL_OVERTURN)" }

  - name: EvaluationLineItem
    parent: null
    common_fields: true
    fields:
      - { name: evaluation_id, type: string, source: system, description: "FK -> TransferCreditEvaluation.id" }
      - { name: external_course_code, type: string, source: system, description: "Copied from transcript course at intake" }
      - { name: external_title, type: string, source: system, description: "Copied from transcript course at intake" }
      - { name: external_credit_hours, type: number, source: system, description: "Copied from transcript course at intake (partner units)" }
      - { name: grade, type: string, source: system, description: "Letter grade copied from transcript course" }
      - { name: grade_points, type: number, source: computed, description: "Mapped from grade via GRADE_SCALE" }
      - { name: equivalency_id, type: string, source: system, default: null, description: "FK -> CourseEquivalency.id; set by the auto-match selector; cleared by agreement suspend/expire cascade" }
      - { name: internal_course_id, type: string, source: system, default: null, description: "FK -> InternalCourse.id; from matched equivalency, manual adopt, or petition approval" }
      - { name: provisional_credits, type: number, source: computed, default: null, description: "Provisional variant estimate; null while PENDING or after cascade flip to PETITION_REQUIRED" }
      - { name: awarded_credits, type: number, source: computed, default: null, description: "Final-variant credits; computed when line becomes ADOPTED, recomputed at finalize" }
      - { name: applied_credits, type: number, source: computed, default: null, description: "Credits actually applied to the degree after the posting waterfall; null until posted" }
      - { name: status, type: enum, source: system, description: "PENDING | AUTO_MATCHED | PETITION_REQUIRED | ADOPTED | DENIED | POSTED" }
      - { name: resolution, type: enum, source: system, default: null, description: "AUTO_EQUIVALENCY | MANUAL_OVERRIDE | PETITION | AUTO_GRADE | null" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Set on deny (manual) or auto-grade denial" }

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> EvaluationLineItem.id" }
      - { name: student_id, type: string, source: system, description: "FK -> TransferStudent.id; derived server-side from the line item's evaluation" }
      - { name: proposed_internal_course_id, type: string, source: input, description: "FK -> InternalCourse.id the student petitions for" }
      - { name: syllabus_ref, type: string, source: input, description: "Syllabus document reference/URI" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED" }
      - { name: adjudicator_id, type: string, source: system, default: null, description: "X-User-ID of the faculty who started review" }
      - { name: adjudication_note, type: string, source: system, default: null, description: "Faculty rationale, >= 10 chars" }
      - { name: awarded_internal_course_id, type: string, source: system, default: null, description: "FK -> InternalCourse.id; adjudicator override when approving for a different course than proposed" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Timestamp of adjudication; appeal window anchor" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; petition must be DENIED" }
      - { name: student_id, type: string, source: system, description: "FK -> TransferStudent.id; derived from petition" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds, >= 20 chars" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | OVERTURNED" }
      - { name: adjudicator_id, type: string, source: system, default: null, description: "X-User-ID of appeal reviewer; MUST differ from petition.adjudicator_id" }
      - { name: adjudication_note, type: string, source: system, default: null, description: "Appeal decision rationale" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Timestamp of appeal adjudication" }

  - name: PriorLearningAssessment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> TransferStudent.id; must equal X-User-ID for Student role" }
      - { name: source_type, type: enum, source: input, description: "MILITARY_JST | CLEP | AP | IB | PORTFOLIO" }
      - { name: credential_ref, type: string, source: input, description: "Credential/transcript reference" }
      - { name: claimed_credits, type: number, source: input, description: "Credits requested; > 0, multiple of 0.5" }
      - { name: verified_credits, type: number, source: system, default: null, description: "Credits confirmed at verification; <= claimed_credits" }
      - { name: proposed_internal_course_id, type: string, source: input, required: false, default: null, description: "FK -> InternalCourse.id; optional course linkage for slot assignment" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | CREDITED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set on reject" }

  - name: RequirementApplication
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> TransferStudent.id" }
      - { name: line_item_id, type: string, source: system, default: null, description: "FK -> EvaluationLineItem.id; exactly one of line_item_id / pla_id is set (polymorphic source)" }
      - { name: pla_id, type: string, source: system, default: null, description: "FK -> PriorLearningAssessment.id; exactly one of line_item_id / pla_id is set" }
      - { name: slot, type: enum, source: system, description: "MAJOR_CORE | MAJOR_ELECTIVE | GENED_COMMS | GENED_MATH | GENED_SCIENCE | GENED_HUMANITIES | GENED_SOCIAL | FREE_ELECTIVE" }
      - { name: applied_credits, type: number, source: system, description: "Credits placed into this slot-bucket by the waterfall (one row per line per bucket)" }
      - { name: status, type: enum, source: system, description: "APPLIED | PARTIAL | UNAPPLIED" }

  - name: TransferGuide
    parent: null
    common_fields: true
    fields:
      - { name: partner_institution_id, type: string, source: input, description: "FK -> PartnerInstitution.id" }
      - { name: catalog_year, type: integer, source: input, description: "Catalog year this guide serves" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ARCHIVED" }
      - { name: pinned_agreement_id, type: string, source: system, default: null, description: "FK -> ArticulationAgreement.id pinned at publish time" }
      - { name: pinned_agreement_version, type: integer, source: system, default: null, description: "Agreement version integer pinned at publish time (version-pinning)" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Timestamp of publication" }
      - { name: entries_snapshot, type: array, source: system, default: null, description: "Immutable snapshot of the pinned agreement's equivalency rows (external_course_code, external_title, external_credit_hours, internal_course_id, equivalency_type, effective_from, effective_until) captured at publish time" }
      - { name: is_stale, type: boolean, source: computed, default: false, description: "True when pinned_agreement_id is set AND (that agreement's status != ACTIVE OR that agreement's version != pinned_agreement_version)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ArticulationAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/articulation-agreements/{id}/activate"
        actor: RegistrarAdmin
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "effective_start < effective_end already enforced at creation"
        side_effects:
          - "activated_at := logical clock"
          - "If another ACTIVE agreement exists with same (partner_institution_id, program_scope): that agreement -> SUPERSEDED (amendment supersede)"
          - "All CourseEquivalency rows with agreement_id == this.id and status == INACTIVE -> ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/articulation-agreements/{id}/suspend"
        actor: RegistrarAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All CourseEquivalency rows with agreement_id == this.id and status == ACTIVE -> INACTIVE (cascade link 1)"
          - "Each EvaluationLineItem with status == AUTO_MATCHED whose equivalency_id references one of those equivalencies AND whose evaluation status IN {DRAFT, IN_REVIEW} -> PETITION_REQUIRED; equivalency_id := null; internal_course_id := null; provisional_credits := null (cascade link 2)"
          - "Each affected TransferCreditEvaluation recomputes provisional_credits_total and open_line_count (cascade link 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/articulation-agreements/{id}/reactivate"
        actor: RegistrarAdmin
        preconditions:
          - "status == SUSPENDED (ERR_INVALID_STATE)"
          - "logical clock date strictly before effective_end (a window already ended cannot reactivate; ERR_INVALID_STATE)"
        side_effects:
          - "All CourseEquivalency rows with agreement_id == this.id and status == INACTIVE -> ACTIVE (restores exactly the suspended set; INVARIANT: count(ACTIVE equivalencies) after reactivate == count before the paired suspend)"
          - "Line items previously flipped to PETITION_REQUIRED are NOT auto-restored (asymmetric compensation; evaluator re-adopts)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (evaluated synchronously inside POST /api/_clock/set_current_utc when new clock >= effective_end)"
        actor: system
        preconditions:
          - "status == ACTIVE and clock date >= effective_end (half-open window: end date itself is NOT covered)"
        side_effects:
          - "expired_at := logical clock"
          - "Same equivalency -> INACTIVE and line-item -> PETITION_REQUIRED cascade as suspend (links 1-3)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (same clock evaluation)"
        actor: system
        preconditions:
          - "status == SUSPENDED and clock date >= effective_end"
        side_effects:
          - "expired_at := logical clock (equivalencies already INACTIVE; no further line cascade)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when a DRAFT amendment agreement with same (partner_institution_id, program_scope) activates)"
        actor: system
        preconditions:
          - "another agreement with same (partner_institution_id, program_scope) transitions DRAFT -> ACTIVE"
        side_effects:
          - "Equivalency rows of the superseded agreement -> INACTIVE; same line-item cascade as suspend (links 1-3)"

  - entity: Transcript
    initial_state: RECEIVED
    terminal_states: [EXTRACTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /api/transcripts/{id}/verify"
        actor: TransferCenterStaff
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "verified_at := logical clock"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /api/transcripts/{id}/reject"
        actor: TransferCenterStaff
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason := input reason"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /api/transcripts/{id}/reject"
        actor: TransferCenterStaff
        preconditions:
          - "status IN {RECEIVED, VERIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason := input reason"
      - from: VERIFIED
        to: EXTRACTED
        trigger: "system (when POST /api/transfer-credit-evaluations succeeds against this transcript)"
        actor: system
        preconditions:
          - "status == VERIFIED"
        side_effects: []

  - entity: TransferCreditEvaluation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/transfer-credit-evaluations/{id}/start-review"
        actor: TransferEvaluator
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_REVIEW
        to: EVALUATED
        trigger: "POST /api/transfer-credit-evaluations/{id}/finalize"
        actor: TransferEvaluator
        preconditions:
          - "status == IN_REVIEW (ERR_INVALID_STATE)"
          - "Every line item status IN {ADOPTED, DENIED} (ERR_UNRESOLVED_LINE_ITEMS)"
        side_effects:
          - "For each ADOPTED line: awarded_credits := final_credit_award (final variant recompute)"
          - "awarded_credits_total := sum of awarded_credits over ADOPTED lines"
          - "evaluated_by_id := X-User-ID"
      - from: EVALUATED
        to: POSTED
        trigger: "POST /api/transfer-credit-evaluations/{id}/post"
        actor: TransferEvaluator
        preconditions:
          - "status == EVALUATED (ERR_INVALID_STATE)"
          - "X-User-ID != evaluated_by_id (segregation of duties; ERR_POSTER_IS_EVALUATOR)"
          - "For every ADOPTED line with equivalency_id set: that equivalency's agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "credit_cap_waterfall runs over ADOPTED lines (slot priority, then line created_at ASC): sets per-line applied_credits and creates RequirementApplication rows (one per line per bucket)"
          - "Each ADOPTED line -> POSTED"
          - "student.total_posted_transfer_credits += sum(applied_credits)"
          - "applied_credits_total := sum(applied_credits); posted_by_id := X-User-ID; posted_at := clock"
      - from: POSTED
        to: IN_REVIEW
        trigger: "POST /api/transfer-credit-evaluations/{id}/reopen OR system (appeal OVERTURNED on a petition of one of this evaluation's DENIED lines)"
        actor: TransferEvaluator | system
        preconditions:
          - "status == POSTED (ERR_INVALID_STATE for the manual endpoint)"
        side_effects:
          - "Each POSTED line -> ADOPTED; applied_credits := null"
          - "RequirementApplication rows whose line_item_id belongs to this evaluation are deleted"
          - "student.total_posted_transfer_credits -= the previously applied sum (full compensation; INVARIANT: totals after reopen equal totals before the paired post when no other writes intervened)"
          - "applied_credits_total := 0; posted_by_id := null; posted_at := null; reopen_reason := input reason or 'APPEAL_OVERTURN'"

  - entity: EvaluationLineItem
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: AUTO_MATCHED
        trigger: "system (evaluation creation intake: grade_points >= TRANSFER_MIN_GRADE_POINTS and equivalency selector found a candidate)"
        actor: system
        preconditions:
          - "grade_points >= 2.0 and selector pool non-empty"
        side_effects:
          - "equivalency_id := selected equivalency; internal_course_id := equivalency.internal_course_id"
          - "provisional_credits := provisional_credit_award"
          - "evaluation.provisional_credits_total and open_line_count recomputed"
      - from: PENDING
        to: PETITION_REQUIRED
        trigger: "system (intake: grade transferable but selector pool empty)"
        actor: system
        preconditions:
          - "grade_points >= 2.0 and selector pool empty (intake)"
        side_effects:
          - "evaluation.provisional_credits_total and open_line_count recomputed"
      - from: AUTO_MATCHED
        to: PETITION_REQUIRED
        trigger: "system (agreement suspend/expire/supersede cascade inactivates the line's equivalency)"
        actor: system
        preconditions:
          - "line.equivalency_id references an equivalency whose agreement left ACTIVE"
          - "owning evaluation status IN {DRAFT, IN_REVIEW} (conditional cascade: lines in EVALUATED/POSTED evaluations are NOT flipped)"
        side_effects:
          - "equivalency_id := null; internal_course_id := null; provisional_credits := null"
          - "evaluation.provisional_credits_total and open_line_count recomputed"
      - from: PENDING
        to: DENIED
        trigger: "system (intake: grade_points < TRANSFER_MIN_GRADE_POINTS)"
        actor: system
        preconditions:
          - "grade_points < 2.0"
        side_effects:
          - "resolution := AUTO_GRADE; denial_reason := 'GRADE_BELOW_TRANSFER_THRESHOLD'"
      - from: AUTO_MATCHED
        to: ADOPTED
        trigger: "POST /api/evaluation-line-items/{id}/adopt"
        actor: TransferEvaluator
        preconditions:
          - "line status IN {AUTO_MATCHED, PETITION_REQUIRED} (ERR_INVALID_STATE)"
          - "evaluation.status == IN_REVIEW (ERR_EVALUATION_NOT_IN_REVIEW)"
        side_effects:
          - "resolution := AUTO_EQUIVALENCY; awarded_credits := final_credit_award"
      - from: PETITION_REQUIRED
        to: ADOPTED
        trigger: "POST /api/evaluation-line-items/{id}/adopt (with internal_course_id body) OR system (petition APPROVED cascade) OR system (appeal OVERTURNED cascade via petition)"
        actor: TransferEvaluator | system
        preconditions:
          - "manual adopt: internal_course_id required in body, course exists and is_active (ERR_COURSE_INACTIVE)"
          - "petition cascade: petition status transitioned to APPROVED"
        side_effects:
          - "resolution := MANUAL_OVERRIDE or PETITION; internal_course_id := chosen course"
          - "awarded_credits := final_credit_award (manual/petition path: converted from external_credit_hours capped by the adopted course's credit_hours)"
      - from: AUTO_MATCHED
        to: DENIED
        trigger: "POST /api/evaluation-line-items/{id}/deny"
        actor: TransferEvaluator
        preconditions:
          - "line status IN {AUTO_MATCHED, PETITION_REQUIRED} (ERR_INVALID_STATE)"
          - "evaluation.status == IN_REVIEW (ERR_EVALUATION_NOT_IN_REVIEW)"
        side_effects:
          - "denial_reason := input reason; provisional_credits := null"
      - from: PETITION_REQUIRED
        to: DENIED
        trigger: "POST /api/evaluation-line-items/{id}/deny"
        actor: TransferEvaluator
        preconditions:
          - "same as AUTO_MATCHED -> DENIED"
        side_effects:
          - "denial_reason := input reason; provisional_credits := null"
      - from: ADOPTED
        to: POSTED
        trigger: "system (evaluation post waterfall)"
        actor: system
        preconditions:
          - "evaluation post transition fired"
        side_effects:
          - "applied_credits set by waterfall"
      - from: POSTED
        to: ADOPTED
        trigger: "system (evaluation reopen compensation)"
        actor: system
        preconditions:
          - "evaluation reopen transition fired"
        side_effects:
          - "applied_credits := null"

  - entity: Petition
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/petitions/{id}/start-review"
        actor: FacultyAdjudicator
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "adjudicator_id := X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/petitions/{id}/adjudicate"
        actor: FacultyAdjudicator
        preconditions:
          - "status == UNDER_REVIEW (ERR_PETITION_NOT_UNDER_REVIEW)"
          - "decision == APPROVED; awarded_internal_course_id (if provided) exists and is_active (ERR_COURSE_INACTIVE)"
        side_effects:
          - "adjudication_note := input; decided_at := clock"
          - "Line item -> ADOPTED (resolution PETITION; internal_course_id := awarded_internal_course_id or proposed_internal_course_id; awarded_credits := final_credit_award)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/petitions/{id}/adjudicate"
        actor: FacultyAdjudicator
        preconditions:
          - "status == UNDER_REVIEW (ERR_PETITION_NOT_UNDER_REVIEW)"
        side_effects:
          - "adjudication_note := input; decided_at := clock"
          - "Line item remains PETITION_REQUIRED (re-petition loop stays open)"
      - from: DENIED
        to: APPROVED
        trigger: "system (appeal OVERTURNED cascade)"
        actor: system
        preconditions:
          - "appeal on this petition adjudicated OVERTURNED"
        side_effects:
          - "Line item DENIED -> ADOPTED if evaluation POSTED (forced path), or PETITION_REQUIRED -> ADOPTED otherwise; awarded_credits := final_credit_award"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/appeals/{id}/start-review"
        actor: FacultyAdjudicator
        preconditions:
          - "status == FILED (ERR_INVALID_STATE)"
          - "X-User-ID != petition.adjudicator_id (segregation of duties; ERR_APPEAL_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "adjudicator_id := X-User-ID"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /api/appeals/{id}/adjudicate"
        actor: FacultyAdjudicator
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "adjudication_note := input; decided_at := clock"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /api/appeals/{id}/adjudicate"
        actor: FacultyAdjudicator
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "adjudication_note := input; decided_at := clock"
          - "Petition DENIED -> APPROVED (cascade link 1)"
          - "Line item -> ADOPTED with awarded_credits recomputed (cascade link 2)"
          - "If evaluation.status == POSTED: evaluation -> IN_REVIEW with full reopen compensation (cascade link 3: POSTED lines -> ADOPTED, applications deleted, student totals decremented)"

  - entity: PriorLearningAssessment
    initial_state: SUBMITTED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/prior-learning-assessments/{id}/verify"
        actor: TransferEvaluator
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "verified_credits <= claimed_credits (ERR_VERIFIED_EXCEEDS_CLAIMED)"
        side_effects:
          - "verified_credits := input"
      - from: VERIFIED
        to: CREDITED
        trigger: "POST /api/prior-learning-assessments/{id}/credit"
        actor: TransferEvaluator
        preconditions:
          - "status == VERIFIED (ERR_INVALID_STATE)"
          - "student.total_posted_pla_credits + verified_credits <= MAX_PLA_CREDITS (ERR_PLA_CAP_EXCEEDED)"
        side_effects:
          - "student.total_posted_pla_credits += verified_credits"
          - "RequirementApplication row created: pla_id set, slot := natural slot of proposed_internal_course_id (or FREE_ELECTIVE when null), applied_credits := verified_credits, status APPLIED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/prior-learning-assessments/{id}/reject"
        actor: TransferEvaluator
        preconditions:
          - "status IN {SUBMITTED, VERIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason := input"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /api/prior-learning-assessments/{id}/reject"
        actor: TransferEvaluator
        preconditions:
          - "status IN {SUBMITTED, VERIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason := input; verified_credits retained for audit"

  - entity: TransferGuide
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/transfer-guides/{id}/publish"
        actor: RegistrarAdmin
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "At least one ArticulationAgreement with partner_institution_id == guide.partner_institution_id and status == ACTIVE exists (ERR_GUIDE_NO_ACTIVE_AGREEMENT)"
        side_effects:
          - "Selector: among ACTIVE agreements for the partner, pick the one with latest effective_start; tie-break created_at ASC. pinned_agreement_id := that agreement; pinned_agreement_version := its current version"
          - "published_at := clock"
          - "Any other PUBLISHED guide with same (partner_institution_id, catalog_year) -> ARCHIVED (supersede)"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /api/transfer-guides/{id}/archive OR system (superseded by a newer publish for same partner+catalog_year)"
        actor: RegistrarAdmin | system
        preconditions:
          - "status == PUBLISHED (ERR_INVALID_STATE for manual endpoint)"
        side_effects: []

  - entity: CourseEquivalency
    initial_state: INACTIVE
    terminal_states: []
    transitions:
      - from: INACTIVE
        to: ACTIVE
        trigger: "system (parent agreement DRAFT -> ACTIVE or SUSPENDED -> ACTIVE)"
        actor: system
        preconditions:
          - "parent agreement transitioned to ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "system (parent agreement ACTIVE -> SUSPENDED / EXPIRED / SUPERSEDED)"
        actor: system
        preconditions:
          - "parent agreement left ACTIVE"
        side_effects:
          - "Dependent AUTO_MATCHED line items flip to PETITION_REQUIRED (see ArticulationAgreement cascades)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; state preconditions live in 1.2/1.4)
# =============================================================================
concurrency_rules:
  - rule_id: equivalency-create-stale-agreement
    parent_entity: ArticulationAgreement
    write_endpoint: "POST /api/articulation-agreements/{agreementId}/course-equivalencies"
    occ_field: expected_agreement_version
    description: |
      Creating a CourseEquivalency against an ArticulationAgreement whose
      version has advanced since the client last observed it is rejected.
      This captures the case where another writer has just added an
      equivalency (legitimately superseding the client's view of the
      agreement's rule set) so the current writer's base version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: student-patch-stale-version
    parent_entity: TransferStudent
    write_endpoint: "PATCH /api/students/{id}"
    occ_field: expected_student_version
    description: |
      Updating a TransferStudent whose version has advanced since the client
      last observed it is rejected; the client's edits would otherwise
      silently overwrite an intervening mutation (e.g. a cascade-updated
      credit total or an earlier profile change).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: grade_point_conversion
    trigger: "evaluation creation (per transcript course line)"
    algorithm: threshold
    formula: |
      grade_points = GRADE_SCALE[grade]
      transferable = (grade_points >= TRANSFER_MIN_GRADE_POINTS)   # boundary: 2.0 inclusive
      if not transferable: line -> DENIED with resolution AUTO_GRADE
    input_set: "Every course entry of the transcript at intake"
    constants:
      TRANSFER_MIN_GRADE_POINTS: 2.0
      GRADE_SCALE: { A: 4.0, "A-": 3.7, "B+": 3.3, B: 3.0, "B-": 2.7, "C+": 2.3, C: 2.0, "C-": 1.7, D: 1.0, F: 0.0 }
    precision: "1 decimal place (scale literals)"

  - name: provisional_credit_award
    trigger: "line intake when status becomes AUTO_MATCHED"
    algorithm: forward_looking
    formula: |
      factor = PROVISIONAL_FACTOR[partner.credit_system]   # QUARTER: 0.75 estimate; SEMESTER: 1.0
      raw = external_credit_hours * factor
      provisional_credits = min(round_half_up(raw, 1), internal_course.credit_hours)
    input_set: "The single line item being auto-matched"
    constants:
      PROVISIONAL_QUARTER_FACTOR: 0.75
      PROVISIONAL_SEMESTER_FACTOR: 1.0
    precision: "round_half_up to 1 decimal place, applied BEFORE the cap min()"
    variants:
      - name: provisional
        when: "evaluation in DRAFT/IN_REVIEW — planning estimate"
        difference: "uses estimate factor 0.75 for quarter units"
      - name: final
        when: "line becomes ADOPTED and at finalize"
        difference: "uses exact factor 2/3 for quarter units and half-step rounding (see final_credit_award); identical data yields different credits"

  - name: final_credit_award
    trigger: "line transitions to ADOPTED; recomputed at evaluation finalize"
    algorithm: forward_looking
    formula: |
      factor = EXACT_FACTOR[partner.credit_system]         # QUARTER: 2/3; SEMESTER: 1.0
      raw = external_credit_hours * factor
      half_stepped = round_half_up(raw * 2, 0) / 2         # nearest 0.5, halves away from zero
      awarded_credits = min(half_stepped, internal_course.credit_hours)
    input_set: "The single ADOPTED (or being-adopted) line item"
    constants:
      EXACT_QUARTER_FACTOR: 0.6666666666666667
      EXACT_SEMESTER_FACTOR: 1.0
    precision: "round_half_up(raw*2)/2 then cap; result is a multiple of 0.5"
    variants:
      - name: provisional
        when: "intake estimate"
        difference: "0.75 quarter factor, 1dp rounding — see provisional_credit_award"
      - name: final
        when: "adopt/finalize"
        difference: "2/3 quarter factor, 0.5-step rounding"

  - name: evaluation_provisional_total
    trigger: "any line provisional_credits change (intake, cascade flip, deny)"
    algorithm: aggregation
    formula: |
      provisional_credits_total = sum over lines with provisional_credits NOT NULL of provisional_credits
      Rounding order is pinned: each line was rounded individually at intake;
      the total sums the ROUNDED per-line values and applies NO second rounding.
      (Summing raw unrounded values then rounding once yields a different number — forbidden.)
    input_set: "Lines of the evaluation with status AUTO_MATCHED (provisional_credits not null)"
    precision: "1 decimal place by construction (sum of 1dp values)"

  - name: credit_cap_waterfall
    trigger: "evaluation post"
    algorithm: waterfall_allocation
    formula: |
      Slot need table (constants below). global_remaining = MAX_TRANSFER_CREDITS.
      Process ADOPTED lines ordered by: natural_slot priority ASC
      (MAJOR_CORE=1, MAJOR_ELECTIVE=2, GENED_*=3 ordered by slot enum name, FREE_ELECTIVE=4),
      tie-break line.created_at ASC (never id).
      natural_slot(line): course = line.internal_course_id
        if course.department == student.declared_major -> MAJOR_CORE
        elif course.gened_tags non-empty -> first element of gened_tags
        else -> FREE_ELECTIVE
      For each line:
        natural_remaining = slot_need[natural_slot] - slot_filled[natural_slot]
        place_natural = min(line.awarded_credits, natural_remaining, global_remaining)
        slot_filled[natural_slot] += place_natural; global_remaining -= place_natural
        create RequirementApplication(line, natural_slot, place_natural) if place_natural > 0
        leftover = line.awarded_credits - place_natural
        if leftover > 0 and natural_slot != FREE_ELECTIVE:
          fe_remaining = slot_need[FREE_ELECTIVE] - slot_filled[FREE_ELECTIVE]
          spill = min(leftover, fe_remaining, global_remaining)
          slot_filled[FREE_ELECTIVE] += spill; global_remaining -= spill
          create RequirementApplication(line, FREE_ELECTIVE, spill) if spill > 0
        else: spill = 0
        line.applied_credits = place_natural + spill
        line application status: APPLIED if applied == awarded; PARTIAL if 0 < applied < awarded;
          UNAPPLIED if applied == 0 (still create a row with applied_credits 0)
        every RequirementApplication row of the line is stamped with the line's application status
      DENIED lines get no rows and consume nothing.
    input_set: "ADOPTED lines of the posting evaluation only"
    constants:
      MAX_TRANSFER_CREDITS: 60.0
      SLOT_NEED_MAJOR_CORE: 30.0
      SLOT_NEED_MAJOR_ELECTIVE: 12.0
      SLOT_NEED_GENED_COMMS: 6.0
      SLOT_NEED_GENED_MATH: 6.0
      SLOT_NEED_GENED_SCIENCE: 6.0
      SLOT_NEED_GENED_HUMANITIES: 6.0
      SLOT_NEED_GENED_SOCIAL: 6.0
      SLOT_NEED_FREE_ELECTIVE: 24.0
      RESIDENCY_MIN_INSTITUTIONAL_CREDITS: 30.0
    precision: "0.5-step inputs; arithmetic exact to 0.5"

  - name: transfer_gpa
    trigger: "read via GET /api/students/{id}/degree-progress"
    algorithm: aggregation
    formula: |
      For each POSTED line: qp_line = round_half_up(grade_points * awarded_credits, 2)
      transfer_gpa = round_half_up(sum(qp_line) / sum(awarded_credits), 3)
      Rounding order pinned: per-line products rounded to 2dp FIRST, then summed, then divided.
      If sum(awarded_credits) == 0 -> transfer_gpa is null.
    input_set: "POSTED lines of all evaluations of the student"
    precision: "per-line 2dp round_half_up; final 3dp round_half_up"

  - name: equivalency_selection
    trigger: "line intake (PENDING -> AUTO_MATCHED path)"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter (ALL must hold):
        eq.external_course_code == line.external_course_code
        eq.status == ACTIVE
        eq.agreement.status == ACTIVE
        eq.agreement.partner_institution_id == transcript.partner_institution_id
        eq.agreement.program_scope IN {"ALL", student.declared_major}
        eq.effective_from <= transcript.term_completed <= eq.effective_until   (CLOSED window)
        eq.internal_course.is_active == true
      Ranking (total order, no id usage):
        1. scope specificity DESC: agreement.program_scope == student.declared_major beats "ALL"
        2. eq.effective_from DESC (latest window start wins)
        3. eq.created_at ASC (earliest created wins)
        4. eq.equivalency_type ASC in enum order [DIRECT, GENED_ONLY, ELECTIVE]
      Empty pool -> line -> PETITION_REQUIRED.
    input_set: "All CourseEquivalency rows (filtered as above)"
    precision: "n/a (selection)"

  - name: pla_cap_allocation
    trigger: "PLA credit transition"
    algorithm: threshold
    formula: |
      remaining = MAX_PLA_CREDITS - student.total_posted_pla_credits
      allowed iff verified_credits <= remaining    # boundary: exactly-equal is allowed
    input_set: "The single VERIFIED PriorLearningAssessment"
    constants:
      MAX_PLA_CREDITS: 30.0
    precision: "0.5-step"

  - name: posted_transfer_credit_ledger
    trigger: "evaluation post / reopen (invariant definition)"
    algorithm: aggregation
    formula: |
      INVARIANT: student.total_posted_transfer_credits
        == sum of applied_credits over all EvaluationLineItems with status == POSTED
           belonging to that student's evaluations.
      A post transition adds exactly sum(newly posted applied_credits);
      the paired reopen subtracts exactly the same amount.
    input_set: "POSTED line items of the student"
    precision: "0.5-step"

  - name: requirement_coverage
    trigger: "GET /api/students/{id}/degree-progress?variant=..."
    algorithm: aggregation
    formula: |
      CERTIFIED variant: include RequirementApplication rows whose source is
        (line_item with status POSTED) or (pla with status CREDITED).
      PROVISIONAL variant: CERTIFIED set plus projected rows for
        ADOPTED lines (projected at awarded_credits into their natural slot, no waterfall truncation)
        and VERIFIED plas (projected at verified_credits).
      Output per slot: {slot, required_credits, applied_credits, remaining_credits};
      plus total_applied_credits, residency_min_institutional_credits, transfer_gpa.
    input_set: "Student's RequirementApplications + ADOPTED lines + VERIFIED plas"
    precision: "0.5-step"
    variants:
      - name: certified
        when: "variant=CERTIFIED (default)"
        difference: "posted/credited sources only"
      - name: provisional
        when: "variant=PROVISIONAL"
        difference: "adds ADOPTED lines and VERIFIED plas — identical student data yields a larger total"

  - name: equivalency_activation_invariant
    trigger: "agreement suspend / reactivate (invariant definition)"
    algorithm: aggregation
    formula: |
      INVARIANT: count(CourseEquivalency where agreement_id == A and status == ACTIVE)
        immediately before suspend == same count immediately after the paired reactivate.
      Suspend moves ACTIVE -> INACTIVE; reactivate restores exactly that set (window
      eligibility is enforced by the selector at match time, not by status).
    input_set: "CourseEquivalency rows of the agreement"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, enum values valid, date ranges ordered (effective_start < effective_end; effective_from <= effective_until), numeric domains (>0, 0.5-steps)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path resource ids exist; body FK references (student_id, transcript_id, partner_institution_id, internal_course_id, line_item_id, petition_id, proposed_internal_course_id, awarded_internal_course_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version == parent.version on endpoints declaring an occ field", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/articulation-agreements/{agreementId}/course-equivalencies; PATCH /api/students/{id}" }
  - { priority: 6, category: auth, check: "Ownership: Student role may only act on resources whose owning student_id == X-User-ID (petition create, appeal create, PLA create, own reads)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /api/petitions; POST /api/appeals; POST /api/prior-learning-assessments" }
  - { priority: 7, category: state, check: "State machine from-state precondition for the invoked transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7.5, category: business_constraint, check: "Uniqueness: at most one evaluation per transcript (checked before transcript-state so the duplicate path is observable after the transcript moved to EXTRACTED)", error_id: ERR_DUPLICATE_EVALUATION, http_status: 409, applies_to: "POST /api/transfer-credit-evaluations" }
  - { priority: 8, category: state, check: "Cross-entity: transcript.status == VERIFIED when creating an evaluation", error_id: ERR_TRANSCRIPT_NOT_VERIFIED, http_status: 409, applies_to: "POST /api/transfer-credit-evaluations" }
  - { priority: 9, category: state, check: "Cross-entity: transcript.student_id == evaluation input student_id", error_id: ERR_TRANSCRIPT_STUDENT_MISMATCH, http_status: 422, applies_to: "POST /api/transfer-credit-evaluations" }
  - { priority: 10, category: state, check: "Cross-entity: evaluation.status == IN_REVIEW for line adopt/deny", error_id: ERR_EVALUATION_NOT_IN_REVIEW, http_status: 409, applies_to: "POST /api/evaluation-line-items/{id}/adopt; POST /api/evaluation-line-items/{id}/deny" }
  - { priority: 11, category: state, check: "Petition status == UNDER_REVIEW for adjudicate", error_id: ERR_PETITION_NOT_UNDER_REVIEW, http_status: 409, applies_to: "POST /api/petitions/{id}/adjudicate" }
  - { priority: 12, category: state, check: "Agreement status IN {DRAFT, ACTIVE} for equivalency creation", error_id: ERR_AGREEMENT_NOT_EDITABLE, http_status: 409, applies_to: "POST /api/articulation-agreements/{agreementId}/course-equivalencies" }
  - { priority: 13, category: state, check: "Cross-entity: every ADOPTED line's equivalency agreement must be ACTIVE when posting", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/transfer-credit-evaluations/{id}/post" }
  - { priority: 14, category: state, check: "Line item status IN {PETITION_REQUIRED, DENIED} and evaluation.status IN {IN_REVIEW, POSTED} for petition create", error_id: ERR_LINE_ITEM_NOT_PETITIONABLE, http_status: 409, applies_to: "POST /api/petitions" }
  - { priority: 15, category: state, check: "Petition status == DENIED for appeal create", error_id: ERR_APPEAL_NOT_FILEABLE, http_status: 409, applies_to: "POST /api/appeals" }
  - { priority: 16, category: state, check: "Aggregate: all lines IN {ADOPTED, DENIED} for finalize", error_id: ERR_UNRESOLVED_LINE_ITEMS, http_status: 409, applies_to: "POST /api/transfer-credit-evaluations/{id}/finalize" }
  - { priority: 16.5, category: state, check: "Cross-entity: at least one ACTIVE agreement exists for the guide's partner when publishing", error_id: ERR_GUIDE_NO_ACTIVE_AGREEMENT, http_status: 409, applies_to: "POST /api/transfer-guides/{id}/publish" }
  - { priority: 17, category: business_temporal, check: "Agreement half-open window: no overlap with any existing agreement of same (partner_institution_id, program_scope) whose status IN {DRAFT, ACTIVE, SUSPENDED}; adjacency (new.start == existing.end or new.end == existing.start) is ALLOWED", error_id: ERR_AGREEMENT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/articulation-agreements; POST /api/articulation-agreements/{id}/amendments" }
  - { priority: 18, category: business_temporal, check: "Equivalency closed window: within the SAME agreement, for the same external_course_code, new [effective_from, effective_until] must be strictly disjoint from every sibling equivalency's closed window; touching endpoints (new.from == existing.until) IS overlap. Equivalencies under DIFFERENT agreements may share code+window (the selector ranks them)", error_id: ERR_EQUIVALENCY_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/articulation-agreements/{agreementId}/course-equivalencies" }
  - { priority: 19, category: business_temporal, check: "Appeal timeliness: clock <= petition.decided_at + APPEAL_WINDOW_DAYS (inclusive boundary)", error_id: ERR_APPEAL_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /api/appeals" }
  - { priority: 21, category: business_constraint, check: "Uniqueness: at most one open (SUBMITTED or UNDER_REVIEW) petition per line item", error_id: ERR_PETITION_ALREADY_OPEN, http_status: 409, applies_to: "POST /api/petitions" }
  - { priority: 22, category: business_constraint, check: "Uniqueness: at most one appeal per petition", error_id: ERR_APPEAL_ALREADY_EXISTS, http_status: 409, applies_to: "POST /api/appeals" }
  - { priority: 23, category: business_constraint, check: "Uniqueness: at most one DRAFT amendment (agreement with amends_agreement_id == this.id and status DRAFT) per agreement", error_id: ERR_AMENDMENT_EXISTS, http_status: 409, applies_to: "POST /api/articulation-agreements/{id}/amendments" }
  - { priority: 24, category: business_referential, check: "Referenced internal course must be is_active == true for NEW references (equivalency create, petition create, petition adjudicate override)", error_id: ERR_COURSE_INACTIVE, http_status: 422, applies_to: "POST /api/articulation-agreements/{agreementId}/course-equivalencies; POST /api/petitions; POST /api/petitions/{id}/adjudicate" }
  - { priority: 25, category: business_fiscal, check: "PLA verified_credits <= claimed_credits", error_id: ERR_VERIFIED_EXCEEDS_CLAIMED, http_status: 422, applies_to: "POST /api/prior-learning-assessments/{id}/verify" }
  - { priority: 26, category: business_fiscal, check: "PLA cap: student.total_posted_pla_credits + verified_credits <= MAX_PLA_CREDITS", error_id: ERR_PLA_CAP_EXCEEDED, http_status: 422, applies_to: "POST /api/prior-learning-assessments/{id}/credit" }
  - { priority: 27, category: business_safety, check: "Segregation of duties: poster X-User-ID != evaluation.evaluated_by_id", error_id: ERR_POSTER_IS_EVALUATOR, http_status: 403, applies_to: "POST /api/transfer-credit-evaluations/{id}/post" }
  - { priority: 28, category: business_safety, check: "Segregation of duties: appeal reviewer X-User-ID != petition.adjudicator_id", error_id: ERR_APPEAL_ADJUDICATOR_CONFLICT, http_status: 403, applies_to: "POST /api/appeals/{id}/start-review" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default logical time 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-05-01T00:00:00Z (fixed default; never falls back to wall-clock). Setting the clock synchronously evaluates agreement expiry cascades."
    roles: [RegistrarAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Agreement ACTIVE/SUSPENDED -> EXPIRED where clock date >= effective_end, with full cascades"]

  # --- Partner institutions ---
  - method: POST
    path: "/api/partner-institutions"
    description: "Create a partner institution"
    roles: [RegistrarAdmin]
    code: 201
    input: [name, institution_code, credit_system, "state_code?"]
    output: PartnerInstitution
    side_effects: []
  - method: GET
    path: "/api/partner-institutions"
    description: "List partner institutions (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["credit_system?"]
    output: "PartnerInstitution[]"
    side_effects: []
  - method: GET
    path: "/api/partner-institutions/{id}"
    description: "Get one partner institution"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: PartnerInstitution
    side_effects: []

  # --- Internal courses ---
  - method: POST
    path: "/api/internal-courses"
    description: "Create a catalog course"
    roles: [RegistrarAdmin]
    code: 201
    input: [course_code, title, credit_hours, level, department, "gened_tags?"]
    output: InternalCourse
    side_effects: ["is_active := true"]
  - method: GET
    path: "/api/internal-courses"
    description: "List catalog courses (paginated); archival filter semantics: with no is_active parameter only is_active=true rows are returned; pass is_active=false to list archived rows"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["is_active?", "department?"]
    output: "InternalCourse[]"
    side_effects: []
  - method: GET
    path: "/api/internal-courses/{id}"
    description: "Get one catalog course"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: InternalCourse
    side_effects: []
  - method: POST
    path: "/api/internal-courses/{id}/deactivate"
    description: "Archive a course (soft delete): is_active := false; existing equivalencies/lines still resolve"
    roles: [RegistrarAdmin]
    code: 200
    input: []
    output: InternalCourse
    side_effects: ["is_active := false"]

  # --- Articulation agreements ---
  - method: POST
    path: "/api/articulation-agreements"
    description: "Create an agreement (DRAFT); half-open window overlap check applies"
    roles: [RegistrarAdmin]
    code: 201
    input: [partner_institution_id, program_scope, effective_start, effective_end]
    output: ArticulationAgreement
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/api/articulation-agreements"
    description: "List agreements (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["partner_institution_id?", "status?", "amends_agreement_id?"]
    output: "ArticulationAgreement[]"
    side_effects: []
  - method: GET
    path: "/api/articulation-agreements/{id}"
    description: "Get one agreement"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: ArticulationAgreement
    side_effects: []
  - method: POST
    path: "/api/articulation-agreements/{id}/activate"
    description: "Activate a DRAFT agreement; supersedes any ACTIVE agreement with same (partner, scope)"
    roles: [RegistrarAdmin]
    code: 200
    input: []
    output: ArticulationAgreement
    side_effects: ["status DRAFT -> ACTIVE; supersede cascade; equivalencies INACTIVE -> ACTIVE"]
  - method: POST
    path: "/api/articulation-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement (cascades to equivalencies and open line items)"
    roles: [RegistrarAdmin]
    code: 200
    input: []
    output: ArticulationAgreement
    side_effects: ["status ACTIVE -> SUSPENDED; equivalency + line-item cascade"]
  - method: POST
    path: "/api/articulation-agreements/{id}/reactivate"
    description: "Reactivate a SUSPENDED agreement whose window has not ended"
    roles: [RegistrarAdmin]
    code: 200
    input: []
    output: ArticulationAgreement
    side_effects: ["status SUSPENDED -> ACTIVE; equivalencies restored"]
  - method: POST
    path: "/api/articulation-agreements/{id}/amendments"
    description: "Create a DRAFT amendment agreement amending this one (amends_agreement_id set); at most one open DRAFT amendment"
    roles: [RegistrarAdmin]
    code: 201
    input: [effective_start, effective_end]
    output: ArticulationAgreement
    side_effects: ["new agreement status := DRAFT; program_scope and partner inherited from amended agreement"]

  # --- Course equivalencies ---
  - method: POST
    path: "/api/articulation-agreements/{agreementId}/course-equivalencies"
    description: "Add an equivalency rule to an agreement (OCC-guarded on agreement version)"
    roles: [RegistrarAdmin]
    code: 201
    input: [internal_course_id, external_course_code, external_title, external_credit_hours, effective_from, effective_until, "equivalency_type?", expected_agreement_version]
    output: CourseEquivalency
    side_effects: ["increments ArticulationAgreement.version by 1", "status := ACTIVE if agreement ACTIVE else INACTIVE", "closed-window overlap check"]
  - method: GET
    path: "/api/articulation-agreements/{agreementId}/course-equivalencies"
    description: "List equivalencies under an agreement"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: "CourseEquivalency[]"
    side_effects: []
  - method: GET
    path: "/api/course-equivalencies"
    description: "Filtered list of equivalencies"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["agreement_id?", "internal_course_id?", "external_course_code?", "status?"]
    output: "CourseEquivalency[]"
    side_effects: []
  - method: GET
    path: "/api/course-equivalencies/{id}"
    description: "Get one equivalency"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: CourseEquivalency
    side_effects: []

  # --- Students ---
  - method: POST
    path: "/api/students"
    description: "Register a transfer student"
    roles: [RegistrarAdmin]
    code: 201
    input: [full_name, email, declared_major, catalog_year]
    output: TransferStudent
    side_effects: ["credit totals initialized to 0"]
  - method: GET
    path: "/api/students/{id}"
    description: "Get one student"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: TransferStudent
    side_effects: []
  - method: PATCH
    path: "/api/students/{id}"
    description: "Update student profile (OCC-guarded); declared_major change re-derives natural slots on future waterfalls only"
    roles: [RegistrarAdmin]
    code: 200
    input: ["full_name?", "declared_major?", "catalog_year?", expected_student_version]
    output: TransferStudent
    side_effects: ["increments TransferStudent.version by 1"]
  - method: GET
    path: "/api/students/{id}/degree-progress"
    description: "Computed degree-audit read: per-slot coverage, totals, residency constant, transfer GPA; variant CERTIFIED (default) | PROVISIONAL"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["variant?"]
    output: { variant: string, total_applied_credits: number, residency_min_institutional_credits: number, transfer_gpa: number, slots: array }
    side_effects: []

  # --- Transcripts ---
  - method: POST
    path: "/api/transcripts"
    description: "Intake an external transcript with embedded course list"
    roles: [TransferCenterStaff]
    code: 201
    input: [student_id, partner_institution_id, term_completed, courses]
    output: Transcript
    side_effects: ["status := RECEIVED"]
  - method: GET
    path: "/api/transcripts"
    description: "List transcripts (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["student_id?", "partner_institution_id?", "status?"]
    output: "Transcript[]"
    side_effects: []
  - method: GET
    path: "/api/transcripts/{id}"
    description: "Get one transcript"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: Transcript
    side_effects: []
  - method: POST
    path: "/api/transcripts/{id}/verify"
    description: "Verify a received transcript"
    roles: [TransferCenterStaff]
    code: 200
    input: []
    output: Transcript
    side_effects: ["status RECEIVED -> VERIFIED; verified_at set"]
  - method: POST
    path: "/api/transcripts/{id}/reject"
    description: "Reject a transcript"
    roles: [TransferCenterStaff]
    code: 200
    input: [reason]
    output: Transcript
    side_effects: ["status -> REJECTED; rejection_reason set"]

  # --- Evaluations ---
  - method: POST
    path: "/api/transfer-credit-evaluations"
    description: "Create an evaluation from a verified transcript; auto-creates line items with grade conversion and equivalency auto-match"
    roles: [TransferEvaluator]
    code: 201
    input: [student_id, transcript_id]
    output: TransferCreditEvaluation
    side_effects: ["transcript VERIFIED -> EXTRACTED", "line items created; per-line grade conversion, auto-match selector, provisional credits", "provisional_credits_total and open_line_count computed"]
  - method: GET
    path: "/api/transfer-credit-evaluations"
    description: "List evaluations (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["student_id?", "transcript_id?", "status?"]
    output: "TransferCreditEvaluation[]"
    side_effects: []
  - method: GET
    path: "/api/transfer-credit-evaluations/{id}"
    description: "Get one evaluation"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: TransferCreditEvaluation
    side_effects: []
  - method: GET
    path: "/api/transfer-credit-evaluations/{id}/line-items"
    description: "List line items of an evaluation"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: "EvaluationLineItem[]"
    side_effects: []
  - method: POST
    path: "/api/transfer-credit-evaluations/{id}/start-review"
    description: "DRAFT -> IN_REVIEW"
    roles: [TransferEvaluator]
    code: 200
    input: []
    output: TransferCreditEvaluation
    side_effects: ["status := IN_REVIEW"]
  - method: POST
    path: "/api/transfer-credit-evaluations/{id}/finalize"
    description: "IN_REVIEW -> EVALUATED; recomputes final awarded credits"
    roles: [TransferEvaluator]
    code: 200
    input: []
    output: TransferCreditEvaluation
    side_effects: ["final_credit_award per ADOPTED line; awarded_credits_total; evaluated_by_id := X-User-ID"]
  - method: POST
    path: "/api/transfer-credit-evaluations/{id}/post"
    description: "EVALUATED -> POSTED; runs credit cap waterfall, creates RequirementApplications, updates student totals; maker-checker SoD"
    roles: [TransferEvaluator]
    code: 200
    input: []
    output: TransferCreditEvaluation
    side_effects: ["credit_cap_waterfall", "ADOPTED lines -> POSTED", "student.total_posted_transfer_credits updated"]
  - method: POST
    path: "/api/transfer-credit-evaluations/{id}/reopen"
    description: "POSTED -> IN_REVIEW with full compensation"
    roles: [TransferEvaluator]
    code: 200
    input: [reason]
    output: TransferCreditEvaluation
    side_effects: ["POSTED lines -> ADOPTED", "RequirementApplications deleted", "student totals decremented"]

  # --- Line items ---
  - method: GET
    path: "/api/evaluation-line-items"
    description: "Filtered list of line items"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["equivalency_id?", "internal_course_id?", "status?", "evaluation_id?"]
    output: "EvaluationLineItem[]"
    side_effects: []
  - method: GET
    path: "/api/evaluation-line-items/{id}"
    description: "Get one line item"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: EvaluationLineItem
    side_effects: []
  - method: POST
    path: "/api/evaluation-line-items/{id}/adopt"
    description: "Adopt a line: AUTO_MATCHED confirm (no body course) or PETITION_REQUIRED manual override (internal_course_id required)"
    roles: [TransferEvaluator]
    code: 200
    input: ["internal_course_id?"]
    output: EvaluationLineItem
    side_effects: ["line -> ADOPTED; awarded_credits := final_credit_award; evaluation totals recomputed"]
  - method: POST
    path: "/api/evaluation-line-items/{id}/deny"
    description: "Deny a line with a reason"
    roles: [TransferEvaluator]
    code: 200
    input: [reason]
    output: EvaluationLineItem
    side_effects: ["line -> DENIED; denial_reason set; evaluation totals recomputed"]

  # --- Petitions ---
  - method: POST
    path: "/api/petitions"
    description: "Student files a syllabus-based petition for a line item"
    roles: [Student]
    code: 201
    input: [line_item_id, proposed_internal_course_id, syllabus_ref]
    output: Petition
    side_effects: ["status := SUBMITTED; student_id derived from line's evaluation"]
  - method: GET
    path: "/api/petitions"
    description: "List petitions (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["student_id?", "line_item_id?", "proposed_internal_course_id?", "awarded_internal_course_id?", "status?"]
    output: "Petition[]"
    side_effects: []
  - method: GET
    path: "/api/petitions/{id}"
    description: "Get one petition"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: Petition
    side_effects: []
  - method: POST
    path: "/api/petitions/{id}/start-review"
    description: "SUBMITTED -> UNDER_REVIEW; binds adjudicator"
    roles: [FacultyAdjudicator]
    code: 200
    input: []
    output: Petition
    side_effects: ["adjudicator_id := X-User-ID"]
  - method: POST
    path: "/api/petitions/{id}/adjudicate"
    description: "UNDER_REVIEW -> APPROVED | DENIED; approval cascades to the line item"
    roles: [FacultyAdjudicator]
    code: 200
    input: [decision, adjudication_note, "awarded_internal_course_id?"]
    output: Petition
    side_effects: ["decided_at set; on APPROVED: line -> ADOPTED (resolution PETITION)"]

  # --- Appeals ---
  - method: POST
    path: "/api/appeals"
    description: "Student appeals a DENIED petition within APPEAL_WINDOW_DAYS"
    roles: [Student]
    code: 201
    input: [petition_id, grounds]
    output: Appeal
    side_effects: ["status := FILED"]
  - method: GET
    path: "/api/appeals"
    description: "List appeals (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["petition_id?", "student_id?", "status?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/api/appeals/{id}"
    description: "Get one appeal"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/api/appeals/{id}/start-review"
    description: "FILED -> UNDER_REVIEW; SoD: reviewer != original petition adjudicator"
    roles: [FacultyAdjudicator]
    code: 200
    input: []
    output: Appeal
    side_effects: ["adjudicator_id := X-User-ID"]
  - method: POST
    path: "/api/appeals/{id}/adjudicate"
    description: "UNDER_REVIEW -> UPHELD | OVERTURNED; OVERTURNED cascades petition -> line -> evaluation"
    roles: [FacultyAdjudicator]
    code: 200
    input: [decision, adjudication_note]
    output: Appeal
    side_effects: ["on OVERTURNED: petition -> APPROVED, line -> ADOPTED, evaluation forced reopen if POSTED"]

  # --- Prior learning assessments ---
  - method: POST
    path: "/api/prior-learning-assessments"
    description: "Student submits a military/prior-learning credit assessment"
    roles: [Student]
    code: 201
    input: [student_id, source_type, credential_ref, claimed_credits, "proposed_internal_course_id?"]
    output: PriorLearningAssessment
    side_effects: ["status := SUBMITTED"]
  - method: GET
    path: "/api/prior-learning-assessments"
    description: "List PLAs (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["student_id?", "proposed_internal_course_id?", "status?", "source_type?"]
    output: "PriorLearningAssessment[]"
    side_effects: []
  - method: GET
    path: "/api/prior-learning-assessments/{id}"
    description: "Get one PLA"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: PriorLearningAssessment
    side_effects: []
  - method: POST
    path: "/api/prior-learning-assessments/{id}/verify"
    description: "Verify credential; sets verified_credits (<= claimed)"
    roles: [TransferEvaluator]
    code: 200
    input: [verified_credits]
    output: PriorLearningAssessment
    side_effects: ["status SUBMITTED -> VERIFIED"]
  - method: POST
    path: "/api/prior-learning-assessments/{id}/credit"
    description: "Credit a verified PLA subject to MAX_PLA_CREDITS; creates RequirementApplication"
    roles: [TransferEvaluator]
    code: 200
    input: []
    output: PriorLearningAssessment
    side_effects: ["status VERIFIED -> CREDITED; student.total_posted_pla_credits += verified_credits; RequirementApplication created"]
  - method: POST
    path: "/api/prior-learning-assessments/{id}/reject"
    description: "Reject a PLA"
    roles: [TransferEvaluator]
    code: 200
    input: [reason]
    output: PriorLearningAssessment
    side_effects: ["status -> REJECTED; rejection_reason set"]

  # --- Requirement applications ---
  - method: GET
    path: "/api/requirement-applications"
    description: "Filtered list of requirement applications"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["student_id?", "line_item_id?", "pla_id?", "slot?"]
    output: "RequirementApplication[]"
    side_effects: []
  - method: GET
    path: "/api/requirement-applications/{id}"
    description: "Get one requirement application"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: RequirementApplication
    side_effects: []

  # --- Transfer guides ---
  - method: POST
    path: "/api/transfer-guides"
    description: "Create a transfer guide draft for a partner + catalog year"
    roles: [RegistrarAdmin]
    code: 201
    input: [partner_institution_id, catalog_year]
    output: TransferGuide
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/api/transfer-guides"
    description: "List transfer guides (paginated)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: ["partner_institution_id?", "pinned_agreement_id?", "status?", "catalog_year?"]
    output: "TransferGuide[]"
    side_effects: []
  - method: GET
    path: "/api/transfer-guides/{id}"
    description: "Get one transfer guide (includes is_stale)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: TransferGuide
    side_effects: []
  - method: POST
    path: "/api/transfer-guides/{id}/publish"
    description: "Publish: pins the selected ACTIVE agreement + its version; supersedes any PUBLISHED guide for same partner+catalog_year"
    roles: [RegistrarAdmin]
    code: 200
    input: []
    output: TransferGuide
    side_effects: ["status DRAFT -> PUBLISHED; pinned_agreement_id/version set; prior PUBLISHED guide -> ARCHIVED"]
  - method: POST
    path: "/api/transfer-guides/{id}/archive"
    description: "Manually archive a published guide"
    roles: [RegistrarAdmin]
    code: 200
    input: []
    output: TransferGuide
    side_effects: ["status PUBLISHED -> ARCHIVED"]
  - method: GET
    path: "/api/transfer-guides/{id}/entries"
    description: "Published snapshot content: returns pinned_agreement_id, pinned_agreement_version, and entries == the guide's immutable entries_snapshot captured at publish time (immune to later agreement edits)"
    roles: [RegistrarAdmin, TransferCenterStaff, TransferEvaluator, FacultyAdjudicator, Student]
    code: 200
    input: []
    output: { pinned_agreement_id: string, pinned_agreement_version: integer, entries: array }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, unordered date range, or out-of-domain numeric" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Student role acting on a resource owned by a different student" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic from-state violation of a state machine transition" }
  - { id: ERR_TRANSCRIPT_NOT_VERIFIED, http: 409, condition: "Evaluation create against a transcript not in VERIFIED status" }
  - { id: ERR_TRANSCRIPT_STUDENT_MISMATCH, http: 422, condition: "Evaluation input student_id differs from the transcript's student_id" }
  - { id: ERR_DUPLICATE_EVALUATION, http: 409, condition: "An evaluation already exists for this transcript" }
  - { id: ERR_EVALUATION_NOT_IN_REVIEW, http: 409, condition: "Line adopt/deny while evaluation not IN_REVIEW" }
  - { id: ERR_UNRESOLVED_LINE_ITEMS, http: 409, condition: "Finalize attempted with lines outside {ADOPTED, DENIED}" }
  - { id: ERR_POSTER_IS_EVALUATOR, http: 403, condition: "SoD: posting evaluator equals evaluated_by_id" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Post blocked: an ADOPTED line's equivalency belongs to a non-ACTIVE agreement" }
  - { id: ERR_AGREEMENT_NOT_EDITABLE, http: 409, condition: "Equivalency create against an agreement not in {DRAFT, ACTIVE}" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Half-open agreement window overlaps an existing non-terminal agreement for same partner+scope" }
  - { id: ERR_EQUIVALENCY_WINDOW_OVERLAP, http: 409, condition: "Closed equivalency window overlaps a sibling equivalency in the same agreement for the same external course code (adjacency counts as overlap)" }
  - { id: ERR_AMENDMENT_EXISTS, http: 409, condition: "A DRAFT amendment already exists for this agreement" }
  - { id: ERR_COURSE_INACTIVE, http: 422, condition: "New reference to an archived (is_active=false) internal course" }
  - { id: ERR_LINE_ITEM_NOT_PETITIONABLE, http: 409, condition: "Petition create against a line not in {PETITION_REQUIRED, DENIED} or evaluation not in {IN_REVIEW, POSTED}" }
  - { id: ERR_PETITION_ALREADY_OPEN, http: 409, condition: "An open (SUBMITTED/UNDER_REVIEW) petition already exists for this line item" }
  - { id: ERR_PETITION_NOT_UNDER_REVIEW, http: 409, condition: "Adjudicate against a petition not UNDER_REVIEW" }
  - { id: ERR_APPEAL_NOT_FILEABLE, http: 409, condition: "Appeal create against a petition not DENIED" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed after petition.decided_at + 30 days" }
  - { id: ERR_APPEAL_ALREADY_EXISTS, http: 409, condition: "An appeal already exists for this petition" }
  - { id: ERR_APPEAL_ADJUDICATOR_CONFLICT, http: 403, condition: "SoD: appeal reviewer equals the original petition adjudicator" }
  - { id: ERR_VERIFIED_EXCEEDS_CLAIMED, http: 422, condition: "PLA verified_credits greater than claimed_credits" }
  - { id: ERR_PLA_CAP_EXCEEDED, http: 422, condition: "Crediting would push student.total_posted_pla_credits above MAX_PLA_CREDITS (30)" }
  - { id: ERR_GUIDE_NO_ACTIVE_AGREEMENT, http: 409, condition: "Guide publish with no ACTIVE agreement for the partner" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistrarAdmin
    description: "Transfer center administrator: partners, catalog, agreements, equivalencies, guides, student records, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/partner-institutions"
      - "POST /api/internal-courses (+ deactivate)"
      - "POST /api/articulation-agreements (+ activate/suspend/reactivate/amendments)"
      - "POST /api/articulation-agreements/{agreementId}/course-equivalencies"
      - "POST /api/students; PATCH /api/students/{id}"
      - "POST /api/transfer-guides (+ publish/archive)"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: TransferCenterStaff
    description: "Intake staff: transcript receipt, verification, rejection"
    identity: opaque
    exclusive_operations:
      - "POST /api/transcripts"
      - "POST /api/transcripts/{id}/verify"
      - "POST /api/transcripts/{id}/reject"
    shared_operations:
      - "All GET endpoints"
  - name: TransferEvaluator
    description: "Credential evaluator: runs evaluations, adopts/denies lines, verifies/credits PLAs; maker-checker applies at posting"
    identity: opaque
    exclusive_operations:
      - "POST /api/transfer-credit-evaluations (+ start-review/finalize/post/reopen)"
      - "POST /api/evaluation-line-items/{id}/adopt|deny"
      - "POST /api/prior-learning-assessments/{id}/verify|credit|reject"
    shared_operations:
      - "All GET endpoints"
  - name: FacultyAdjudicator
    description: "Faculty reviewer for syllabus petitions and appeals; appeal reviewer must differ from petition adjudicator"
    identity: opaque
    exclusive_operations:
      - "POST /api/petitions/{id}/start-review|adjudicate"
      - "POST /api/appeals/{id}/start-review|adjudicate"
    shared_operations:
      - "All GET endpoints"
  - name: Student
    description: "Transfer student; acts only on own records"
    identity: "entity_backed:TransferStudent"
    exclusive_operations:
      - "POST /api/petitions"
      - "POST /api/appeals"
      - "POST /api/prior-learning-assessments"
    shared_operations:
      - "All GET endpoints (ownership-filtered for own resources)"
