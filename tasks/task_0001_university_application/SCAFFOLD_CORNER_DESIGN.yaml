scaffold_corner_design:

  # =========================================================================
  # Section: entities  — per-entity creation, required fields, defaults,
  #                       computed fields, system fields, immutability, FKs
  # =========================================================================
  - section: entities
    instances:
      - name: applicant_create_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Applicant
          - endpoints.POST_/applicants
        distinguishing_aspect: "POST /applicants with email, full_name, gpa_unweighted=3.50, residency=IN_STATE returns 201 and an Applicant with profile_status=DRAFT, submitted_application_count=0, version=1."
        test_recipe:
          setup:
            - "Empty database; no applicant rows."
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { email: "creation@u.edu", full_name: "Cre Ation", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { ap_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Applicant.${ap_id}.profile_status == 'DRAFT'"
            - "Applicant.${ap_id}.submitted_application_count == 0"
            - "Applicant.${ap_id}.version == 1"
            - "response.data.email == 'creation@u.edu'"

      - name: applicant_create_missing_required_email_returns_400
        claim_type: required_fields
        grounds:
          - entities.Applicant.fields.email
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting email on POST /applicants returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "No Email", gpa_unweighted: 3.50, residency: "IN_STATE" }
              as: Anonymous
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: applicant_create_invalid_gpa_above_max_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Applicant.fields.gpa_unweighted
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "gpa_unweighted=4.50 (>4.00) is out of range and rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { email: "bad_gpa@u.edu", full_name: "Bad GPA", gpa_unweighted: 4.50, residency: "IN_STATE" }
              as: Anonymous
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: applicant_create_invalid_sat_below_min_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Applicant.fields.sat_total
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "sat_total=300 (<400) is out of range and rejected."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { email: "bad_sat@u.edu", full_name: "Bad SAT", gpa_unweighted: 3.0, sat_total: 300, residency: "IN_STATE" }
              as: Anonymous
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: get_applicant_non_existent_returns_404
        claim_type: not_found
        grounds:
          - entities.Applicant
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /applicants/{uuid} for a never-created id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No applicant with id 00000000-0000-0000-0000-000000000000."]
          setup_api_calls: []
          trigger:
            - call: "GET /applicants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'"

      - name: applicant_listing_returns_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Applicant
          - endpoints.GET_/applicants
        distinguishing_aspect: "GET /applicants returns a paginated list response_envelope.pagination_fields are present (limit, offset, total_count, has_more)."
        test_recipe:
          setup: ["Three applicants exist."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { email: "p1@u.edu", full_name: "P 1", gpa_unweighted: 3.0, residency: "IN_STATE" }
              as: Anonymous
            - call: "POST /applicants"
              payload: { email: "p2@u.edu", full_name: "P 2", gpa_unweighted: 3.1, residency: "IN_STATE" }
              as: Anonymous
            - call: "POST /applicants"
              payload: { email: "p3@u.edu", full_name: "P 3", gpa_unweighted: 3.2, residency: "OUT_OF_STATE" }
              as: Anonymous
          trigger:
            - call: "GET /applicants?limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "response includes pagination fields limit=2, offset=0, total_count=3, has_more=true"
            - "response.data length == 2"

      - name: applicant_email_uniqueness_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Applicant.fields.email
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Two POSTs with the same email collide on the unique constraint; second returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["First applicant with email 'dup@u.edu' exists."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { email: "dup@u.edu", full_name: "Dup 1", gpa_unweighted: 3.0, residency: "IN_STATE" }
              as: Anonymous
          trigger:
            - call: "POST /applicants"
              payload: { email: "dup@u.edu", full_name: "Dup 2", gpa_unweighted: 3.1, residency: "IN_STATE" }
              as: Anonymous
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: applicant_id_and_timestamps_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.Applicant
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated; response includes server-minted values."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { email: "sys@u.edu", full_name: "Sys Fields", gpa_unweighted: 3.0, residency: "IN_STATE" }
              as: Anonymous
              captures: { sys_id: $.data.id, sys_created_at: $.data.created_at, sys_version: $.data.version }
          assert:
            - "Applicant.${sys_id}.id matches 8-4-4-4-12 hex UUID pattern (server-minted)"
            - "Applicant.${sys_id}.created_at is a recent ISO-8601 timestamp"
            - "Applicant.${sys_id}.version == 1"

  # =========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown,
  #                            initial state, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: application_submit_from_already_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Application already in SUBMITTED rejects a second SUBMIT with ERR_INVALID_STATE; no side effects fire (composite_score unchanged, submitted_application_count unchanged)."
        test_recipe:
          setup: ["Application app_x at applicant a_x is SUBMITTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Inv SM", state_code: "MO", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_inv_sm_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "inv_sm@u.edu", full_name: "Inv SM", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_inv_sm_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_inv_sm_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_inv_sm_id}", school_id: "${s_inv_sm_id}" }
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
              captures: { app_inv_sm_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_inv_sm_id}", prompt_code: "P1", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_inv_sm_id}", prompt_code: "P2", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_inv_sm_id}", school_id: "${s_inv_sm_id}", recommender_email: "rinvsm1@x.edu" }
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
              captures: { rec_invsm1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_inv_sm_id}", school_id: "${s_inv_sm_id}", recommender_email: "rinvsm2@x.edu" }
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
              captures: { rec_invsm2: $.data.id }
            - call: "POST /recommendation-requests/${rec_invsm1}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_invsm2}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /applications/${app_inv_sm_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
          trigger:
            - call: "POST /applications/${app_inv_sm_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_inv_sm_id}"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Application.${app_inv_sm_id}.status == 'SUBMITTED' (unchanged)"
            - "Applicant.${a_inv_sm_id}.submitted_application_count == 1 (no double-increment)"

      - name: application_admit_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_ADMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Admit from DRAFT (skipping SUBMITTED and UNDER_REVIEW) rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT Application app_d exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Admit D", state_code: "TN", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_ad_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "ad@u.edu", full_name: "Ad D", gpa_unweighted: 3.50, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_ad_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${a_ad_id}", school_id: "${s_ad_id}" }
              as: Applicant
              as_user_id: "${a_ad_id}"
              captures: { app_ad_id: $.data.id, ver_ad: $.data.version }
          trigger:
            - call: "POST /applications/${app_ad_id}/admit"
              payload: { expected_application_version: "${ver_ad}" }
              as: AdmissionsOfficer
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: application_create_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.Application
          - entities.Application.fields.status
        distinguishing_aspect: "A newly created Application has status == DRAFT, version == 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "U Init", state_code: "WI", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_init_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "init@u.edu", full_name: "Init A", gpa_unweighted: 3.50, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_init_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${a_init_id}", school_id: "${s_init_id}" }
              as: Applicant
              as_user_id: "${a_init_id}"
              captures: { app_init_id: $.data.id }
          assert:
            - "Application.${app_init_id}.status == 'DRAFT'"
            - "Application.${app_init_id}.version == 1"
            - "Application.${app_init_id}.submitted_at == null"

      - name: application_terminal_state_denied_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Application
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal status DENIED, no further triggers (submit, admit, enroll, decline, withdraw) succeed; each returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Application app_term is in terminal state DENIED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Term", state_code: "KS", admission_track: "REGULAR", deadline_iso: "2026-10-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_term_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "term@u.edu", full_name: "Term A", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_term_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_term_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_term_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_term_id}", school_id: "${s_term_id}" }
              as: Applicant
              as_user_id: "${a_term_id}"
              captures: { app_term_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_term_id}", prompt_code: "P1", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_term_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_term_id}", prompt_code: "P2", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_term_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_term_id}", school_id: "${s_term_id}", recommender_email: "rt1@x.edu" }
              as: Applicant
              as_user_id: "${a_term_id}"
              captures: { rec_term1: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_term_id}", school_id: "${s_term_id}", recommender_email: "rt2@x.edu" }
              as: Applicant
              as_user_id: "${a_term_id}"
              captures: { rec_term2: $.data.id }
            - call: "POST /recommendation-requests/${rec_term1}/submit"
              payload: { rating: 3 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_term2}/submit"
              payload: { rating: 3 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_term_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_term_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_term_id}/begin-review"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applications/${app_term_id}/deny"
              payload: {}
              as: AdmissionsOfficer
          trigger:
            - call: "POST /applications/${app_term_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${a_term_id}"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Application.${app_term_id}.status == 'DENIED' (unchanged)"

      - name: ed_admit_decline_already_covered_by_difficulty_rule_5_or_priority
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ED_BINDING_VIOLATION]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ed_exclusivity_safety_outranks_incomplete_constraint
          rationale: "ED-binding behavior at decision points is exercised; the binding rule's own direct trigger is also covered by validations[priority=9]."

  # =========================================================================
  # Section: calculations — input filtering, constants applied, precision,
  #                          variant correctness on canonical examples
  # =========================================================================
  - section: calculations
    instances:
      - name: efc_fafsa_zero_assets_canonical_calc_passes
        claim_type: correct_result
        grounds:
          - calculations.efc_calc
          - calculations.efc_calc.variants.fafsa_variant
        distinguishing_aspect: "FAFSA with household_income_cents=12000000, household_size=3 yields expected_family_contribution_cents = round_half_up((12000000 - 3*800000)*0.22, 0) = 2112000."
        test_recipe:
          setup: ["Empty database; applicant exists."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { email: "efc1@u.edu", full_name: "EFC 1", gpa_unweighted: 3.0, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_efc1_id: $.data.id }
          trigger:
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_efc1_id}", profile_type: "FAFSA", household_income_cents: 12000000, household_size: 3 }
              as: Applicant
              as_user_id: "${a_efc1_id}"
              captures: { fap1_id: $.data.id }
          assert:
            - "FinancialAidProfile.${fap1_id}.expected_family_contribution_cents == 2112000"

      - name: efc_high_income_zero_after_shelter_caps_at_zero
        claim_type: input_set_filtering
        grounds:
          - calculations.efc_calc
        distinguishing_aspect: "Shelter * household_size > household_income → adjusted_income clamped to 0 → EFC=0 (FAFSA)."
        test_recipe:
          setup: ["Applicant exists."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { email: "efc_low@u.edu", full_name: "EFC Low", gpa_unweighted: 3.0, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_low_id: $.data.id }
          trigger:
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_low_id}", profile_type: "FAFSA", household_income_cents: 2000000, household_size: 5 }
              as: Applicant
              as_user_id: "${a_low_id}"
              captures: { fap_low_id: $.data.id }
          assert:
            - "FinancialAidProfile.${fap_low_id}.expected_family_contribution_cents == 0"

      - name: net_cost_in_state_canonical_calc
        claim_type: correct_result
        grounds:
          - calculations.net_cost_calc
          - entities.AidPackage.fields.net_cost_cents
        distinguishing_aspect: "IN_STATE applicant at school with in_state_tuition_cents=1500000 and aid grant=500000+loan=400000+work_study=100000 yields net_cost_cents = 500000."
        excluded_because:
          difficulty_instance: transitive_cascade / enroll_chains_through_other_admit_to_aid_revoke_depth_3
          rationale: "net_cost on FINALIZE is exercised within the depth-3 cascade chain; canonical numeric result is part of that fixture."

      - name: composite_score_test_optional_canonical_calc
        claim_type: variant_divergence
        grounds:
          - calculations.composite_score_calc.variants.test_optional_variant
        distinguishing_aspect: "sat_total=null defaults to neutral 50.00 → sat_term=10.00; remainder of weighted-sum formula unchanged."
        excluded_because:
          difficulty_instance: dual_variant_calc / composite_with_sat_vs_test_optional_diverge_on_same_applicant_data
          rationale: "Test-optional canonical numeric result asserted as 79.50 in the named §1.8 instance."

  # =========================================================================
  # Section: validations  — direct trigger of each validation rule + error
  # =========================================================================
  - section: validations
    instances:
      - name: deadline_passed_blocks_submit
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_DEADLINE_PASSED]
        distinguishing_aspect: "Submit attempted after School.deadline_iso (current_utc > deadline) is rejected with ERR_DEADLINE_PASSED on a non-ROLLING school."
        test_recipe:
          setup: ["DRAFT app fully eligible to submit at REGULAR school S whose deadline has already passed (current_utc > deadline_iso)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Dl", state_code: "OK", admission_track: "REGULAR", deadline_iso: "2026-10-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_dl_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "dl@u.edu", full_name: "DL A", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_dl_id: $.data.id }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_dl_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_dl_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_dl_id}", school_id: "${s_dl_id}" }
              as: Applicant
              as_user_id: "${a_dl_id}"
              captures: { app_dl_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_dl_id}", prompt_code: "P1", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_dl_id}"
