          qty_received: 10
          receipt_date: '2026-08-31'
        as: SupplyChainCoordinator
        captures:
          rcc_id: $.data.id
      - call: POST /api/v1/component-receipts/${rcc_id}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 2
          planned_shop_days: 2
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-08-25'
          required_delivery_date: '2026-09-20'
          lessee_id: ${ls_id}
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          price: $.data.unit_price_cents
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/release
        payload:
          lease_contract_id: ${lc_id}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/LINE-IM2-L1/changeover
        payload:
          production_order_id: ${po_id}
          scheduled_start_date: '2026-08-30'
          scheduled_end_date: '2026-09-01'
        as: ProductionPlanner
        captures:
          v_in_production: $.data.version
          status_before: $.data.status
      trigger:
      - call: POST /api/v1/production-orders/${po_id}/complete
        payload:
          completed_qty: 2
          completion_date: '2026-09-01'
        as: ProductionPlanner
        captures:
          status_in_response: $.data.status
          qty_in_response: $.data.completed_qty
          v_in_response: $.data.version
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${po_id}
        payload: {}
        as: ProductionPlanner
        captures:
          car_a: $.data[0].id
          car_a_status: $.data[0].status
          car_b_status: $.data[1].status
      - call: GET /api/v1/lease-contracts/${lc_id}
        payload: {}
        as: PortfolioManager
        captures:
          capital_immediate: $.data.capital_allocation_cents
      - call: GET /api/v1/portfolio-ledger/reconciliation
        payload: {}
        as: PortfolioManager
        captures:
          committed_immediate: $.data.committed_capital_cents
          drift_immediate: $.data.drift_cents
      assert:
      - The order stood IN_PRODUCTION at ${status_before} before the call
      - 'The completion response itself carries the new state: data.status == ${status_in_response} ==
        "COMPLETED", data.completed_qty == ${qty_in_response} == 2 and data.version == ${v_in_response}
        == ${v_in_production} + 1'
      - 'The quote that drives the capital is the committed literal: data.unit_price_cents == ${price}
        == 98000'
      - 'Level 1 is already materialised: the immediate list read returns two cars, data[0].status ==
        ${car_a_status} == "HELD" and data[1].status == ${car_b_status} == "HELD"'
      - 'Level 2 is already materialised: the contract reads data.capital_allocation_cents == ${capital_immediate}
        == 196000 == 2 * 98000'
      - 'Level 3 is already materialised: the reconciliation read returns data.committed_capital_cents
        == ${committed_immediate} == 196000 with data.drift_cents == ${drift_immediate} == 0, so the historic
        and depreciated bases already agree at the completion instant'
      - Every one of those reads is issued in the same logical instant as the write — the clock is never
        moved and no retry is performed
  - name: consistency_immediate_ratify_response_carries_amendment_seq_and_restated_accrual
    claim_type: immediate
    grounds:
    - POST /api/v1/lease-contracts/{id}/amendments/ratify
    - entities.LeaseContract.fields.amendment_seq
    - entities.CarAssignment.fields.per_diem_accrued_cents
    - calculations.assignment_per_diem_accrual
    distinguishing_aspect: The ratify request's own response already reports ACTIVE with amendment_seq
      1 and the bumped version, and the live placement's restated per_diem_accrued_cents of 3650000 is
      readable in the same instant — neither the counter nor the restated accrual waits for a later write
      or a clock advance.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z and never moved during the instance.
      - Car type CT-IM3-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-IM3)
        carries one COATING bill-of-material row CO-IM3-1 covered by a CONFIRMED purchase order.
      - RETAINED order of 1 car under contract LC-IM3-1 (FULL_SERVICE, per_diem 10000, LESSOR-liable,
        term [2024-01-01, 2028-01-01)) is reserved, released, changed over on LINE-IM3-L1 for [2024-01-01,
        2024-01-02) and completed on 2024-01-02.
      - The car is placed on [2024-06-01, 2027-01-01) with mileage_allowance 1000 and stays ACTIVE with
        mileage_used 0; the lessee's utilization_threshold_pct 50 keeps the utilization credit at 0 in
        both variants.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-IM3-1
          credit_tier: A
          utilization_threshold_pct: 50
          credit_ceiling_cents: 9000000
        as: LeaseAdministrator
        captures:
          ls_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${ls_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 10000
          liability_bearer: LESSOR
          term_start_date: '2024-01-01'
          term_end_date: '2028-01-01'
          fleet_car_cap: 10
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_v1: $.data.version
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-IM3-1
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-IM3
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CO-IM3-1
          component_class: COATING
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          co_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${co_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${co_id}
          qty_ordered: 5
          unit_cost_cents: 1000
          order_date: '2024-01-01'
          expected_receipt_date: '2024-01-06'
        as: SupplyChainCoordinator
        captures:
          po_id: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_id}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: RETAINED
          priority_rank: 1
          order_date: '2024-01-01'
          required_delivery_date: '2024-01-20'
          lessee_id: ${ls_id}
        as: ProductionPlanner
        captures:
          po_o_id: $.data.id
      - call: POST /api/v1/production-orders/${po_o_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_o_id}/release
        payload:
          lease_contract_id: ${lc_id}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/LINE-IM3-L1/changeover
        payload:
          production_order_id: ${po_o_id}
          scheduled_start_date: '2024-01-01'
          scheduled_end_date: '2024-01-02'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_o_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2024-01-02'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${po_o_id}
        payload: {}
        as: LeaseAdministrator
        captures:
          car_id: $.data[0].id
      - call: POST /api/v1/car-assignments
        payload:
          lease_fleet_car_id: ${car_id}
          lease_contract_id: ${lc_id}
          lessee_id: ${ls_id}
          start_date: '2024-06-01'
          end_date: '2027-01-01'
          mileage_allowance: 1000
        as: LeaseAdministrator
        captures:
          asg_id: $.data.id
          seq_before: $.data.id
      - call: GET /api/v1/car-assignments/${asg_id}
        payload: {}
        as: LeaseAdministrator
        captures:
          accrued_before: $.data.per_diem_accrued_cents
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 10000
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v1}
        as: LeaseAdministrator
        captures:
          lc_v2: $.data.version
      trigger:
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments/ratify
        payload:
          expected_lease_version: ${lc_v2}
        as: LeaseAdministrator
        captures:
          status_in_response: $.data.status
          seq_in_response: $.data.amendment_seq
          v_in_response: $.data.version
      - call: GET /api/v1/car-assignments/${asg_id}
        payload: {}
        as: LeaseAdministrator
        captures:
          accrued_immediate: $.data.per_diem_accrued_cents
          asg_status_immediate: $.data.status
      assert:
      - Before ratification the placement reads the open-placement accrual data.per_diem_accrued_cents
        == ${accrued_before} == 8220000
      - 'The ratify response itself carries the cascade counter, not a deferred one: data.status == ${status_in_response}
        == "ACTIVE" and data.amendment_seq == ${seq_in_response} == 1'
      - 'The response also carries its own version bump: data.version == ${v_in_response} == ${lc_v2}
        + 1'
      - 'The restated accrual is readable in the same instant, with no clock movement and no second write:
        the placement now returns data.per_diem_accrued_cents == ${accrued_immediate} == 3650000'
      - 'The placement is untouched by the restatement: data.status == ${asg_status_immediate} == "ACTIVE"'
      - Both the contract counter and the restated assignment field are observable without any delay,
        which is exactly what the immediate consistency model promises
