  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: application_committee_sendback_loop
        grounds:
          - state_machines.Application.COMMITTEE_REVIEW_to_IN_REVIEW
          - state_machines.Application.IN_REVIEW_to_COMMITTEE_REVIEW
          - state_machines.CommitteeReview.ASSIGNED_to_CANCELLED
        distinguishing_aspect: |
          Application loops COMMITTEE_REVIEW -> IN_REVIEW -> COMMITTEE_REVIEW
          (revision cycle on the Application entity): send-back cancels the
          ASSIGNED read and bumps review_round 1 -> 2; a fresh assignment
          re-enters COMMITTEE_REVIEW and the application can still reach
          DECISION_PENDING once quorum is met in the new round.
        test_recipe:
          setup:
            - "Cycle OPEN; program capacity 5 target 3; one application in COMMITTEE_REVIEW with one ASSIGNED review"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "MAT", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "S One", email: "s1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "REFERRAL", distance_band: "NATIONAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 82, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1_id: $.data.id }
          trigger:
            # --- send-back: COMMITTEE_REVIEW -> IN_REVIEW (loop) ---
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            # --- cancelled review can no longer be submitted ---
            - call: "POST /enrollment/reviews/${r1_id}/submit"
              payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }
              as: ApplicationReader
              as_user_id: "reader-1"
              captures: { cancel_err: $.data.error_id }
            # --- re-enter committee with two fresh reads ---
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2_id}/submit", payload: { score_academic: 82, score_fit: 82, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-3", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r3_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r3_id}/submit", payload: { score_academic: 82, score_fit: 82, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-3" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "GET /enrollment/applications/${app_id}"
              payload: {}
              as: AdmissionsOfficer
              captures: { round_after: $.data.review_round }
          assert:
            - "After send-back: Application.review_round == 2 and review ${r1_id}.status == CANCELLED"
            - "Submitting cancelled review ${r1_id} returns ERR_INVALID_STATE (409)"
            - "Application re-enters COMMITTEE_REVIEW on the new assignment and reaches DECISION_PENDING (submitted_read_count == 2)"
            - "Final Application.status == DECISION_PENDING and review_round == 2"

      - name: aid_offer_revision_reoffer_recomputes_amount
        grounds:
          - state_machines.AidOffer.OFFERED_to_REVISION_REQUESTED
          - state_machines.AidOffer.REVISION_REQUESTED_to_OFFERED
          - calculations.aid_leveraging_award
        distinguishing_aspect: |
          AidOffer negotiation cycle OFFERED -> REVISION_REQUESTED -> OFFERED on
          the SAME offer row (a cyclic machine on AidOffer, distinct from the
          Application loop): revision releases the offer from committed budget;
          after the budget is patched down to 1000000 the re-offer recomputes
          amount_cents from 2500000 to 1000000 against current availability.
        test_recipe:
          setup:
            - "Cycle OPEN; program tuition 5000000, budget 3000000, capacity 5, target 3"
            - "One ADMITTED application (score 96) with an OFFERED MERIT offer of 2500000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "PHY", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 3000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "A Neg", email: "neg@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 96, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r1_id}/submit", payload: { score_academic: 96, score_fit: 96, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2_id}/submit", payload: { score_academic: 96, score_fit: 96, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_v: $.data.version }
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_id}", fund_type: "MERIT", expected_application_version: "${app_v}" }
              as: FinancialAidOfficer
              captures: { offer_id: $.data.id, offer_amt_initial: $.data.amount_cents }
          trigger:
            # --- applicant requests revision (funds release from committed) ---
            - { call: "POST /enrollment/aid-offers/${offer_id}/transition", payload: { to_status: "REVISION_REQUESTED" }, as: Applicant, as_user_id: "${ap_id}" }
            # --- budget patched down; committed is 0 while REVISION_REQUESTED, so 1000000 >= 0 passes ---
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: EnrollmentManager
              captures: { p_v_now: $.data.version }
            - { call: "PATCH /enrollment/programs/${p_id}", payload: { scholarship_budget_cents: 1000000, expected_program_version: "${p_v_now}" }, as: EnrollmentManager }
            # --- re-offer recomputes against current availability ---
            - call: "POST /enrollment/aid-offers/${offer_id}/transition"
              payload: { to_status: "OFFERED" }
              as: FinancialAidOfficer
              captures: { offer_amt_re: $.data.amount_cents }
          assert:
            - "Initial AidOffer.amount_cents == 2500000 (min(0.50*5000000, MERIT_MAX 2500000, available 3000000))"
            - "After REVISION_REQUESTED: Program.scholarship_committed_cents == 0 and scholarship_available_cents == 3000000"
            - "Re-offered amount_cents == 1000000 (min(2500000, available 1000000)) — same offer id, OFFERED again"
            - "${offer_amt_initial} != ${offer_amt_re}"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: melt_sweep_cascade_to_waitlist_activation
        grounds:
          - state_machines.Application.DEPOSITED_to_MELTED
          - state_machines.Deposit.PAID_to_FORFEITED
          - state_machines.WaitlistEntry.ACTIVE_to_ACTIVATED
          - entities.Program.fields.auto_waitlist_activation
        distinguishing_aspect: |
          Depth-4 chain from the melt-sweep trigger: sweep melts the DEPOSITED
          application (link 1) -> its Deposit forfeits (link 2) -> program
          counters/posture recompute OPEN (link 3) -> top-ranked ACTIVE waitlist
          entry auto-activates and its application is ADMITTED (link 4). Each
          link is caused by the previous one, not by the sweep directly.
        test_recipe:
          setup:
            - "Program capacity 3, target 2, auto_waitlist_activation true, deposit 50000, tuition 5000000, budget 0"
            - "M (score 70) and K (score 80) admitted and deposited at clock 2027-04-01; W (score 60) waitlisted with rank_score 76.0 (2 ADMIT recs)"
            - "K enrolled; cycle advanced to ENROLLMENT_TRACKING at clock 2027-05-02"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
