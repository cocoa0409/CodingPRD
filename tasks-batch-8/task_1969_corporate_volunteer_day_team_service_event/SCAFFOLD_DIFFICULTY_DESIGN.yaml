            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 1 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day J", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol A", email: "va@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { volA: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol B", email: "vb@corp.com", department: "Eng", date_of_birth: "1991-01-01" }, as: CommunityEngagementManager, captures: { volB: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volA}", captures: { regA: $.data.id } }
            - { call: "POST /registrations/${regA}/sign-waiver", payload: { signer_name: "Vol A", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${volA}" }
            - { call: "POST /registrations/${regA}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volB}", captures: { regB: $.data.id } }
          trigger:
