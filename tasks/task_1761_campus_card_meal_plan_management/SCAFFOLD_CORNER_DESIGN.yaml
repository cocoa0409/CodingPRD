            - call: "POST /api/door-zones"
              payload: { zone_code: "Z-CYC", building: "Gym", security_level: "STANDARD", access_windows: [{ day_of_week: "TUE", start_minute: 480, end_minute: 1080 }] }
              as: SecurityOfficer
              captures: { zy_id: "$.data.id" }
            - call: "POST /api/cards/${c_id}/access-grants"
              payload: { zone_id: "${zx_id}", clearance: "STANDARD", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: SecurityOfficer
              captures: { gx_id: "$.data.id" }
            - call: "POST /api/cards/${c_id}/access-grants"
