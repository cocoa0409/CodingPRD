# =============================================================================
# SCAFFOLD.yaml — Rack Jobber & Consignment Retail Program (scan-based trading)
# §1.0–§1.7 seed tables. Difficulty: beyond-expert (maximum density directive).
# =============================================================================

scenario: |
  Rack Jobber & Consignment Retail Program (scan-based rack jobber): consignment inventory ownership & scan-based trading, retail price maintenance & promo, shrink allocation & audit count, service route & restock frequency, retailer margin split & settlement timing, category exclusivity & space allocation, returns/markdown responsibility, seasonal set & tear-down

domain_name: rack-jobber-consignment
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation      # scan ledger vs audit/shrink ledger; provisional vs final settlement
  secondary_archetype: quota_allocation          # store facing capacity + category exclusivity windows
  complexity_layers:
    - optimistic_concurrency                     # OCC on StoreAgreement / SettlementStatement / AuditCount versions
    - cascading_side_effects                     # audit certify -> balance -> ratio -> suspension -> visit cancellation
    - dual_variant_calculation                   # provisional vs final settlement; jobber-cost vs blended-retail shrink valuation
    - rate_threshold_triggers                    # shrink suspension ratio, margin tiers, payout minimum, restock cap
  entity_topology: flat                          # peer resources joined by foreign keys; filtered-list reverse reachability
  state_machine_shape: cyclic                    # multiple revision/recount cycles + compound derived postures
  relationship_patterns:
    - one_to_many
    - many_to_many                               # StoreAgreement joins Program x Store with terms
    - self_referential                           # ScanEvent.void_of_event_id -> ScanEvent.id
    - cross_aggregate                            # SettlementStatement reads ScanEvent/AuditCount/MarkdownAuthorization/SeasonalSet
  role_model: segregation_of_duties              # audit counter != certifier; settlement creator != approver
  consistency_model: immediate                   # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology, FK joins)
# All money is integer cents. All dates are ISO-8601 date strings (YYYY-MM-DD);
# all datetimes are ISO-8601 UTC with three fractional digits.
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: promo_min_gap_days, type: integer, source: input, default: 1, description: "Minimum full days required between two non-CANCELLED promotions on the same (program, product)" }
      - { name: min_payout_cents, type: integer, source: input, default: 5000, description: "Minimum net_payable_to_jobber_cents for a settlement to be payable" }
      - { name: default_settlement_cadence, type: enum, source: input, default: "WEEKLY", description: "WEEKLY | BIWEEKLY | MONTHLY; inherited by agreements", constraints: "enum: WEEKLY, BIWEEKLY, MONTHLY" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED; ARCHIVED when POST /programs/{id}/archive succeeds", constraints: "enum: ACTIVE, ARCHIVED" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: store_code, type: string, source: input, description: "Unique store code", constraints: "unique across all stores" }
      - { name: total_facings, type: integer, source: input, description: "Total rack facing capacity of the store", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED; CLOSED when POST /stores/{id}/close succeeds", constraints: "enum: ACTIVE, CLOSED" }

  - name: StoreAgreement
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the consignment program" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the host store" }
      - { name: base_margin_pct, type: number, source: input, description: "Retailer base margin fraction (e.g. 0.25)", constraints: "0 < value < 1" }
      - { name: tier1_threshold_cents, type: integer, source: input, default: 100000, description: "Net-sales threshold for tier-1 margin uplift (>=)" }
      - { name: tier1_uplift_pct, type: number, source: input, default: 0.01, description: "Margin uplift when net sales >= tier1 threshold" }
      - { name: tier2_threshold_cents, type: integer, source: input, default: 200000, description: "Net-sales threshold for tier-2 margin uplift (>=)" }
      - { name: tier2_uplift_pct, type: number, source: input, default: 0.02, description: "Margin uplift when net sales >= tier2 threshold (replaces, not cumulative with, tier1)" }
      - { name: min_margin_pct, type: number, source: input, default: 0.15, description: "Floor for computed margin_pct" }
      - { name: max_margin_pct, type: number, source: input, default: 0.40, description: "Ceiling for computed margin_pct" }
      - { name: shrink_retailer_share_pct, type: number, source: input, description: "Retailer share of chargeable shrink value (e.g. 0.50)", constraints: "0 <= value <= 1" }
      - { name: free_allowance_pct, type: number, source: input, default: 0.01, description: "Shrink units up to round_half_up(scanned_units_since_last_audit * pct) are not charged" }
      - { name: shrink_suspend_ratio, type: number, source: input, default: 0.02, description: "Auto-suspend when cumulative_shrink_units / cumulative_delivered_units >= this ratio" }
      - { name: shrink_valuation_mode, type: enum, source: input, default: "JOBBER_COST", description: "JOBBER_COST | BLENDED_RETAIL — selects audit_variance_valuation variant at CERTIFY", constraints: "enum: JOBBER_COST, BLENDED_RETAIL" }
      - { name: estimated_shrink_rate, type: number, source: input, default: 0.0, description: "Provisional-variant estimated shrink units per scanned unit" }
      - { name: restock_value_cap_cents, type: integer, source: input, description: "Max jobber-cost value of restock_units submittable per service visit" }
      - { name: markdown_liability, type: enum, source: input, default: "SHARED", description: "JOBBER | RETAILER | SHARED — who funds markdown credits", constraints: "enum: JOBBER, RETAILER, SHARED" }
      - { name: markdown_jobber_share_pct, type: number, source: input, default: 0.5, description: "Jobber share of markdown credit when markdown_liability == SHARED; forced 1.0 for JOBBER, 0.0 for RETAILER" }
      - { name: markdown_cap_pct_of_gross, type: number, source: input, default: 0.08, description: "Per-period markdown credit cap as fraction of gross scanned sales" }
      - { name: settlement_cadence, type: enum, source: input, default: "WEEKLY", description: "WEEKLY | BIWEEKLY | MONTHLY — settlement period length (7/14 days, or calendar month)", constraints: "enum: WEEKLY, BIWEEKLY, MONTHLY" }
      - { name: service_frequency_days, type: integer, source: input, default: 7, description: "Nominal days between route service visits" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PENDING_ACCEPTANCE | ACTIVE | SUSPENDED | REJECTED | TERMINATED", constraints: "enum set as listed" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock timestamp of ACTIVE transition; anchors settlement period 0" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (SoD reference)" }
      - { name: cumulative_delivered_units, type: integer, source: computed, default: 0, description: "Sum of restock_units confirmed across all visits of this agreement" }
      - { name: cumulative_shrink_units, type: integer, source: computed, default: 0, description: "Sum of variance_units posted by CERTIFIED audits (all physical shrink, including free-allowance units)" }
      - { name: cumulative_shrink_ratio, type: number, source: computed, default: 0.0, description: "cumulative_shrink_units / cumulative_delivered_units; 0.0 when denominator is 0" }
      - constraints_note: "At most one agreement per (program_id, store_id) may exist in {DRAFT, PENDING_ACCEPTANCE, ACTIVE, SUSPENDED}; a second create -> ERR_AGREEMENT_EXISTS"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: sku, type: string, source: input, description: "Stock-keeping unit", constraints: "unique within program_id" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: jobber_cost_cents, type: integer, source: input, description: "Jobber unit cost; basis for restock caps and JOBBER_COST shrink valuation", constraints: ">= 1" }
      - { name: min_retail_cents, type: integer, source: input, description: "Retail price floor enforced on price directives (price maintenance)", constraints: ">= 1" }
      - { name: units_per_facing, type: integer, source: input, description: "Units that fit one facing; doubles as reorder point for balances", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISCONTINUED via PATCH /products/{id}", constraints: "enum: ACTIVE, DISCONTINUED" }

  - name: SpaceAllocation
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id; agreement granting the space" }
      - { name: store_id, type: string, source: computed, description: "Denormalized from StoreAgreement.store_id at creation; drives overlap/capacity checks" }
      - { name: category, type: enum, source: input, description: "Rack category", constraints: "enum: SNACKS, BEVERAGES, IMPULSE, HOUSEWARES, SEASONAL, PERSONAL_CARE" }
      - { name: facings, type: integer, source: input, description: "Number of facings allocated", constraints: ">= 1" }
      - { name: window_start_date, type: string, source: input, description: "First day of allocation (inclusive)" }
      - { name: window_end_date, type: string, source: input, description: "Day after last day (EXCLUSIVE — half-open interval [start, end))" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | ACTIVE | CLOSED; PLANNED->ACTIVE by clock sweep when window opens and agreement ACTIVE; -> CLOSED via close endpoint", constraints: "enum: PLANNED, ACTIVE, CLOSED" }

  - name: PriceDirective
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id; scope of the maintained retail price" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: price_cents, type: integer, source: input, description: "Maintained retail price", constraints: ">= product.min_retail_cents" }
      - { name: effective_from, type: datetime, source: input, description: "When the price takes effect" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EFFECTIVE | SUPERSEDED; EFFECTIVE iff effective_from <= clock and not superseded", constraints: "enum: SCHEDULED, EFFECTIVE, SUPERSEDED" }
      - { name: superseded_at, type: datetime, source: system, description: "When a newer directive superseded this one (null while current)" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: name, type: string, source: input, description: "Promo name" }
      - { name: depth_pct, type: number, source: input, description: "Discount depth off the directive price", constraints: "0 < depth_pct <= 0.50" }
      - { name: jobber_funding_pct, type: number, source: input, description: "Jobber share of the discount (rest is retailer-absorbed)", constraints: "0 <= value <= 1" }
      - { name: start_date, type: string, source: input, description: "First day of promo (inclusive — CLOSED interval)" }
      - { name: end_date, type: string, source: input, description: "Last day of promo (inclusive — CLOSED interval)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SCHEDULED | ACTIVE | SUSPENDED | ENDED | CANCELLED", constraints: "enum set as listed" }

  - name: InventoryBalance
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: system, description: "FK -> StoreAgreement.id; auto-created on first confirmed restock or first matched scan for the pair" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: on_hand_units, type: integer, source: computed, default: 0, description: "Consignment units currently owned by jobber at store; INVARIANT: on_hand == delivered - scanned + customer_returns - shrink - rma (may go negative on unscanned shelf stock)" }
      - { name: lifetime_delivered_units, type: integer, source: computed, default: 0, description: "Sum of confirmed restock_units" }
      - { name: lifetime_scanned_units, type: integer, source: computed, default: 0, description: "Net scanned SALE units (VOID reverses)" }
      - { name: lifetime_customer_return_units, type: integer, source: computed, default: 0, description: "RETURN scan units put back on shelf" }
      - { name: lifetime_shrink_units, type: integer, source: computed, default: 0, description: "Variance units posted by certified audits" }
      - { name: lifetime_rma_units, type: integer, source: computed, default: 0, description: "Units removed via applied RETURN_TO_VENDOR authorizations" }
      - { name: reorder_point_units, type: integer, source: computed, description: "= product.units_per_facing" }
      - { name: stock_posture, type: enum, source: computed, description: "DEPLETED (on_hand <= 0) | LOW (0 < on_hand <= reorder_point) | NORMAL (on_hand > reorder_point)", constraints: "enum: DEPLETED, LOW, NORMAL" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Route name" }
      - { name: assigned_driver_id, type: string, source: input, description: "Opaque driver identifier; RouteDriver X-User-ID must equal this to execute visits" }
      - { name: service_frequency_days, type: integer, source: input, default: 7, description: "Nominal visit cadence" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE via PATCH", constraints: "enum: ACTIVE, INACTIVE" }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id; must belong to route.program_id" }
      - { name: scheduled_date, type: string, source: input, description: "Planned service date; check-in allowed only when logical clock date == scheduled_date" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CHECKED_IN | COUNTS_SUBMITTED | CONFIRMED | DISPUTED | MISSED | CANCELLED", constraints: "enum set as listed" }
      - { name: submitted_lines, type: array, source: system, description: "Frozen copy of submitted count lines: [{product_id, counted_units, restock_units}]" }
      - { name: total_counted_units, type: integer, source: computed, default: 0, description: "Sum of counted_units over submitted lines" }
      - { name: total_restock_units, type: integer, source: computed, default: 0, description: "Sum of restock_units over submitted lines" }
      - { name: total_variance_units, type: integer, source: computed, default: 0, description: "Sum over lines of (counted_units - book_on_hand_at_submit); informational only, not charged at visits" }
      - { name: applied_restock_value_cents, type: integer, source: computed, default: 0, description: "Sum of restock_units * product.jobber_cost_cents; checked against agreement cap at submit" }
      - { name: auto_restock_flag, type: boolean, source: computed, default: false, description: "Set true when a matched scan drops a balance at/below reorder point and this visit is the selected next visit" }
      - { name: suggested_restock_units, type: integer, source: computed, default: 0, description: "Set by reorder cascade: max(0, 2 * reorder_point_units - on_hand_units) evaluated at trigger time" }

  - name: ScanEvent
    parent: null
    common_fields: false
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: client_event_id, type: string, source: input, description: "Retailer idempotency key; unique per store_agreement_id", constraints: "duplicate -> ERR_DUPLICATE_SCAN_EVENT" }
      - { name: event_type, type: enum, source: input, description: "SALE | RETURN | VOID", constraints: "enum: SALE, RETURN, VOID" }
      - { name: quantity, type: integer, source: input, description: "Units (> 0); for VOID must equal target quantity" }
      - { name: scanned_at, type: datetime, source: input, description: "POS timestamp; selects price directive/promo window and settlement period" }
      - { name: void_of_event_id, type: string, source: input, description: "FK -> ScanEvent.id; required iff event_type == VOID; target must be a MATCHED non-VOID scan" }
      - { name: status, type: enum, source: system, description: "MATCHED | UNMATCHED; resolved synchronously at ingest and via resolve", constraints: "enum: MATCHED, UNMATCHED" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Resolved scan unit price (null while UNMATCHED); see scan_pricing_resolution" }
      - { name: line_value_cents, type: integer, source: computed, description: "SALE: +unit_price*qty; RETURN: -unit_price*qty; VOID: -(target line_value_cents)" }
      - { name: jobber_funding_cents, type: integer, source: computed, description: "Per-line jobber promo funding, rounded per line (see promo_funding_split); 0 when no promo applies" }
      - { name: is_promo_priced, type: boolean, source: computed, default: false, description: "True when a promotion window applied to this scan" }
      - { name: settled_in_statement_id, type: string, source: system, description: "FK -> SettlementStatement.id; set when a FINALIZED statement first includes this scan" }

  - name: AuditCount
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id" }
      - { name: scope, type: enum, source: input, description: "FULL | CATEGORY", constraints: "enum: FULL, CATEGORY" }
      - { name: category, type: enum, source: input, description: "Required iff scope == CATEGORY", constraints: "enum: SNACKS, BEVERAGES, IMPULSE, HOUSEWARES, SEASONAL, PERSONAL_CARE" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | SUBMITTED | DISPUTED | CERTIFIED | LOCKED", constraints: "enum set as listed" }
      - { name: counted_lines, type: array, source: system, description: "Frozen at submit: [{product_id, counted_units}]; only listed products are varianced" }
      - { name: counted_by_user_id, type: string, source: system, description: "X-User-ID of the FieldAuditor who submitted (SoD: certifier must differ)" }
      - { name: scanned_units_since_last_audit, type: integer, source: computed, description: "MATCHED SALE units for audited products with scanned_at >= previous CERTIFIED/LOCKED audit's submitted_at (or agreement activation when none) and < this audit's submitted_at" }
      - { name: variance_units, type: integer, source: computed, default: 0, description: "Sum over counted lines of (book_on_hand_at_submit - counted_units); positive = shrink; frozen at submit" }
      - { name: free_allowance_units, type: integer, source: computed, default: 0, description: "round_half_up(scanned_units_since_last_audit * agreement.free_allowance_pct)" }
      - { name: chargeable_units, type: integer, source: computed, default: 0, description: "max(0, variance_units - free_allowance_units)" }
      - { name: valuation_unit_cents, type: integer, source: computed, description: "Per audit_variance_valuation variant selected by agreement.shrink_valuation_mode" }
      - { name: variance_value_cents, type: integer, source: computed, default: 0, description: "chargeable_units * valuation_unit_cents" }
      - { name: retailer_charge_cents, type: integer, source: computed, default: 0, description: "round_half_up(variance_value_cents * agreement.shrink_retailer_share_pct)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submit; window anchor for scanned_units_since_last_audit" }
      - { name: certified_at, type: datetime, source: system, description: "Logical clock at certify; settlement window membership key" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifier (must != counted_by_user_id)" }

  - name: MarkdownAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: auth_type, type: enum, source: input, description: "MARKDOWN (price protection credit, no unit movement) | RETURN_TO_VENDOR (units pulled, no credit)", constraints: "enum: MARKDOWN, RETURN_TO_VENDOR" }
      - { name: units, type: integer, source: input, description: "Affected units", constraints: ">= 1" }
      - { name: markdown_price_cents, type: integer, source: input, description: "Required iff auth_type == MARKDOWN; new clearance price", constraints: "0 <= value < current directive price" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | REJECTED | APPLIED | EXPIRED", constraints: "enum set as listed" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "MARKDOWN: round_half_up((directive_price_at_apply - markdown_price_cents) * units * jobber_share_pct); RETURN_TO_VENDOR: 0" }
      - { name: approved_at, type: datetime, source: system, description: "Logical clock at approve; EXPIRED if not applied within 14 days" }
      - { name: applied_at, type: datetime, source: system, description: "Logical clock at apply; settlement window membership key" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id" }
      - { name: period_index, type: integer, source: input, description: "Zero-based period number anchored at agreement.activated_at", constraints: ">= 0; unique per agreement" }
      - { name: period_start, type: string, source: computed, description: "ISO date, inclusive window start (see settlement_period_window)" }
      - { name: period_end, type: string, source: computed, description: "ISO date, EXCLUSIVE window end (half-open [start, end))" }
      - { name: status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | FINALIZED | DISPUTED | APPROVED | PAID", constraints: "enum set as listed" }
      - { name: variant_used, type: enum, source: computed, description: "PROVISIONAL (estimated shrink at generate/revise) | FINAL (certified audits at finalize)", constraints: "enum: PROVISIONAL, FINAL" }
      - { name: gross_scanned_sales_cents, type: integer, source: computed, default: 0, description: "Sum of line_value_cents over MATCHED scans with scanned_at in [period_start, period_end)" }
      - { name: scanned_units, type: integer, source: computed, default: 0, description: "Net SALE units in window (SALE +, RETURN -, VOID reverses target qty)" }
      - { name: promo_scan_units, type: integer, source: computed, default: 0, description: "Units scanned at promo price in window" }
      - { name: promo_jobber_funding_cents, type: integer, source: computed, default: 0, description: "Sum of scan.jobber_funding_cents in window (per-line rounded, then summed)" }
      - { name: markdown_credit_cents, type: integer, source: computed, default: 0, description: "min(sum of MARKDOWN credits applied in window, round_half_up(markdown_cap_pct_of_gross * gross_scanned_sales_cents))" }
      - { name: net_sales_cents, type: integer, source: computed, default: 0, description: "gross_scanned_sales_cents - markdown_credit_cents" }
      - { name: margin_pct, type: number, source: computed, description: "Per retailer_margin_split; tier selected on net_sales_cents" }
      - { name: retailer_margin_cents, type: integer, source: computed, default: 0, description: "round_half_up(net_sales_cents * margin_pct)" }
      - { name: shrink_retailer_charge_cents, type: integer, source: computed, default: 0, description: "FINAL: sum of retailer_charge_cents of audits CERTIFIED with certified_at in window; PROVISIONAL: estimate per settlement_net_payable provisional variant" }
      - { name: teardown_penalty_cents, type: integer, source: computed, default: 0, description: "Sum of penalty_cents of SeasonalSets reconciled in window" }
      - { name: net_payable_to_jobber_cents, type: integer, source: computed, default: 0, description: "net_sales_cents - retailer_margin_cents + shrink_retailer_charge_cents - teardown_penalty_cents" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of generator (SoD: approver must differ)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock at pay" }

  - name: SeasonalSet
    parent: null
    common_fields: true
    fields:
      - { name: store_agreement_id, type: string, source: input, description: "FK -> StoreAgreement.id" }
      - { name: theme, type: string, source: input, description: "Display theme name" }
      - { name: category, type: enum, source: input, description: "Category whose space the set occupies", constraints: "enum: SNACKS, BEVERAGES, IMPULSE, HOUSEWARES, SEASONAL, PERSONAL_CARE" }
      - { name: allocated_facings, type: integer, source: input, description: "Facings the set requires", constraints: ">= 1" }
      - { name: set_window_start, type: string, source: input, description: "First day setup may begin (CLOSED interval)" }
      - { name: set_window_end, type: string, source: input, description: "Last day setup may begin (CLOSED interval)" }
      - { name: teardown_deadline, type: string, source: input, description: "Last grace-free teardown day" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | SET_IN_PROGRESS | SET_COMPLETE | ACTIVE_SEASON | TEARDOWN_DUE | TORN_DOWN | RECONCILED", constraints: "enum set as listed" }
      - { name: actual_teardown_date, type: string, source: system, description: "Logical clock date at teardown" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Per seasonal_teardown_penalty; posted to the settlement of the reconciliation window" }

# =============================================================================
# §1.2 State Machine Table (8 machines; cycles on ServiceVisit, SettlementStatement,
# Promotion, AuditCount; compound derived posture on InventoryBalance)
# =============================================================================
state_machines:
  - entity: StoreAgreement
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_ACCEPTANCE
        trigger: "POST /agreements/{id}/submit"
        actor: JobberAdmin
        preconditions: ["agreement.status == DRAFT"]
        side_effects: ["increments StoreAgreement.version by 1"]
      - from: PENDING_ACCEPTANCE
        to: ACTIVE
        trigger: "POST /agreements/{id}/accept"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id (else ERR_STORE_MANAGER_MISMATCH)"]
        side_effects:
          - "activated_at = logical clock now; anchors settlement period 0"
          - "increments StoreAgreement.version by 1"
      - from: PENDING_ACCEPTANCE
        to: REJECTED
        trigger: "POST /agreements/{id}/reject"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id"]
        side_effects: ["increments StoreAgreement.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agreements/{id}/suspend OR system (shrink_suspend_ratio breach on audit certify)"
        actor: JobberAdmin | system
        preconditions: []
        side_effects:
          - "every ServiceVisit of this agreement with status SCHEDULED -> CANCELLED"
          - "increments StoreAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agreements/{id}/resume"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments StoreAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: JobberAdmin
        preconditions:
          - "no SettlementStatement in {PROVISIONAL, FINALIZED, DISPUTED, APPROVED} (else ERR_INVALID_STATE)"
          - "no SeasonalSet in {PLANNED, SET_IN_PROGRESS, SET_COMPLETE, ACTIVE_SEASON, TEARDOWN_DUE} (else ERR_INVALID_STATE)"
        side_effects:
          - "ACTIVE SpaceAllocations of this agreement -> CLOSED"
          - "SCHEDULED ServiceVisits -> CANCELLED"
          - "increments StoreAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: JobberAdmin
        preconditions: ["same as ACTIVE -> TERMINATED"]
        side_effects: ["same as ACTIVE -> TERMINATED"]

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /service-visits/{id}/check-in"
        actor: RouteDriver
        preconditions:
          - "X-User-ID == route.assigned_driver_id (else ERR_DRIVER_NOT_ASSIGNED)"
          - "logical clock date == scheduled_date (else ERR_VISIT_WINDOW_CLOSED)"
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: ["increments ServiceVisit.version by 1"]
      - from: CHECKED_IN
        to: COUNTS_SUBMITTED
        trigger: "POST /service-visits/{id}/submit-counts"
        actor: RouteDriver
        preconditions:
          - "X-User-ID == route.assigned_driver_id"
          - "sum(restock_units * jobber_cost_cents) <= agreement.restock_value_cap_cents (else ERR_RESTOCK_VALUE_CAP_EXCEEDED)"
        side_effects:
          - "freezes submitted_lines; computes total_counted_units, total_restock_units, total_variance_units (counted - book), applied_restock_value_cents"
          - "increments ServiceVisit.version by 1"
      - from: COUNTS_SUBMITTED
        to: CONFIRMED
        trigger: "POST /service-visits/{id}/confirm"
        actor: RetailerManager
        preconditions:
          - "X-User-ID == agreement.store_id (else ERR_STORE_MANAGER_MISMATCH)"
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "per line: upsert InventoryBalance; on_hand_units := counted_units + restock_units (count resets book); lifetime_delivered_units += restock_units; stock_posture recomputed"
          - "agreement.cumulative_delivered_units += total_restock_units; cumulative_shrink_ratio recomputed"
          - "increments ServiceVisit.version by 1 and StoreAgreement.version by 1"
      - from: COUNTS_SUBMITTED
        to: DISPUTED
        trigger: "POST /service-visits/{id}/dispute"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id"]
        side_effects: ["increments ServiceVisit.version by 1"]
      - from: DISPUTED
        to: CHECKED_IN
        trigger: "POST /service-visits/{id}/recount (revision loop: re-count and re-submit)"
        actor: RouteDriver
        preconditions: ["X-User-ID == route.assigned_driver_id"]
        side_effects: ["clears submitted_lines and computed totals", "increments ServiceVisit.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /service-visits/{id}/cancel OR system (agreement suspension/termination)"
        actor: JobberAdmin | system
        preconditions: []
        side_effects: ["increments ServiceVisit.version by 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "system (clock sweep when logical clock date > scheduled_date)"
        actor: system
        preconditions: []
        side_effects: ["increments ServiceVisit.version by 1"]

  - entity: ScanEvent
    initial_state: MATCHED
    terminal_states: []
    transitions:
      - from: <create>
        to: MATCHED
        trigger: "POST /scan-events"
        actor: RetailerManager
        preconditions:
          - "agreement.status == ACTIVE"
          - "product.program_id == agreement.program_id"
          - "an EFFECTIVE PriceDirective exists for (agreement, product) with effective_from <= scanned_at"
          - "event_type == VOID additionally requires void_of_event_id to reference a MATCHED non-VOID scan of the same agreement with equal quantity"
        side_effects:
          - "resolves unit_price_cents via scan_pricing_resolution; computes line_value_cents, jobber_funding_cents, is_promo_priced"
          - "upsert InventoryBalance: SALE -> on_hand -= qty, lifetime_scanned_units += qty; RETURN -> on_hand += qty, lifetime_customer_return_units += qty; VOID -> reverses target units and counters"
          - "if resulting on_hand_units <= reorder_point_units: reorder cascade (see §1.3 restock_suggested_quantity) selects the SCHEDULED ServiceVisit of this agreement with earliest scheduled_date >= clock date (tie-break: created_at ASC) and sets auto_restock_flag=true, suggested_restock_units per formula; that visit mutation recomputes nothing further"
      - from: <create>
        to: UNMATCHED
        trigger: "POST /scan-events (any MATCHED precondition fails except VOID target rules)"
        actor: RetailerManager
        preconditions: []
        side_effects: ["unit_price_cents/line_value_cents/jobber_funding_cents remain null/0; no inventory effect"]
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /scan-events/{id}/resolve"
        actor: JobberAdmin
        preconditions: ["match preconditions now hold"]
        side_effects: ["same inventory + reorder side effects as MATCHED creation"]
      - from: <create VOID with invalid target>
        to: <rejected>
        trigger: "POST /scan-events with event_type VOID and missing/UNMATCHED/VOID/mismatched-quantity target"
        actor: RetailerManager
        preconditions: []
        side_effects: ["rejected with ERR_VOID_TARGET_INVALID"]
    note: "ScanEvent is append-only (common_fields: false): no update/delete; correction happens only via compensating VOID events."

  - entity: AuditCount
    initial_state: SCHEDULED
    terminal_states: [LOCKED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audit-counts/{id}/start"
        actor: FieldAuditor
        preconditions: ["agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"]
        side_effects: ["increments AuditCount.version by 1"]
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /audit-counts/{id}/submit"
        actor: FieldAuditor
        preconditions: []
        side_effects:
          - "freezes counted_lines, counted_by_user_id = X-User-ID, submitted_at = clock"
          - "computes and freezes: scanned_units_since_last_audit, variance_units (book at submit minus counted), free_allowance_units, chargeable_units"
          - "increments AuditCount.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /audit-counts/{id}/certify"
        actor: JobberAdmin
        preconditions:
          - "OCC: expected_audit_count_version == audit.version (else ERR_STALE_VERSION)"
          - "SoD: X-User-ID != counted_by_user_id (else ERR_SOD_CERTIFIER_IS_COUNTER)"
        side_effects:
          - "computes valuation_unit_cents per audit_variance_valuation variant (agreement.shrink_valuation_mode), variance_value_cents, retailer_charge_cents; certified_at = clock; certified_by_user_id = X-User-ID"
          - "CASCADE link 1: per counted line, InventoryBalance.on_hand_units := counted_units; lifetime_shrink_units += max(0, book - counted)"
          - "CASCADE link 2: agreement.cumulative_shrink_units += max(0, variance_units); cumulative_shrink_ratio recomputed; increments StoreAgreement.version by 1"
          - "CASCADE link 3: if cumulative_shrink_ratio >= agreement.shrink_suspend_ratio then agreement ACTIVE -> SUSPENDED, which itself cancels SCHEDULED ServiceVisits (link 4)"
          - "increments AuditCount.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /audit-counts/{id}/dispute"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id"]
        side_effects: ["increments AuditCount.version by 1"]
      - from: DISPUTED
        to: IN_PROGRESS
        trigger: "POST /audit-counts/{id}/order-recount (revision loop)"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["clears counted_lines, counted_by_user_id, and frozen computed fields", "increments AuditCount.version by 1"]
      - from: CERTIFIED
        to: LOCKED
        trigger: "POST /audit-counts/{id}/lock OR system (when a SettlementStatement finalizes with this audit in its window)"
        actor: JobberAdmin | system
        preconditions: []
        side_effects: ["increments AuditCount.version by 1"]

  - entity: SettlementStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: <create>
        to: PROVISIONAL
        trigger: "POST /settlement-statements"
        actor: JobberFinance
        preconditions:
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "period_start <= clock date (period has begun; else ERR_SETTLEMENT_PERIOD_NOT_CLOSED)"
          - "no existing statement for (agreement, period_index) (else ERR_SETTLEMENT_ALREADY_EXISTS)"
        side_effects:
          - "computes all money fields with variant_used = PROVISIONAL (see settlement_net_payable)"
          - "created_by_user_id = X-User-ID"
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /settlement-statements/{id}/finalize"
        actor: JobberFinance
        preconditions:
          - "OCC: expected_settlement_statement_version == statement.version (else ERR_STALE_VERSION)"
          - "clock date >= period_end (period fully closed; else ERR_SETTLEMENT_PERIOD_NOT_CLOSED)"
          - "every AuditCount of this agreement with submitted_at in [period_start, period_end) is in {CERTIFIED, LOCKED} (else ERR_AUDIT_NOT_CERTIFIED)"
        side_effects:
          - "recomputes all money fields with variant_used = FINAL (certified-audit shrink)"
          - "stamps settled_in_statement_id on included MATCHED scans; locks included CERTIFIED audits (-> LOCKED)"
          - "increments SettlementStatement.version by 1"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /settlement-statements/{id}/dispute"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id"]
        side_effects: ["increments SettlementStatement.version by 1"]
      - from: DISPUTED
        to: PROVISIONAL
        trigger: "POST /settlement-statements/{id}/revise (revision loop)"
        actor: JobberFinance
        preconditions: []
        side_effects:
          - "recomputes money fields with variant_used = PROVISIONAL"
          - "increments SettlementStatement.version by 1"
      - from: FINALIZED
        to: APPROVED
        trigger: "POST /settlement-statements/{id}/approve"
        actor: JobberAdmin
        preconditions: ["SoD: X-User-ID != created_by_user_id (else ERR_SOD_APPROVER_IS_CREATOR)"]
        side_effects: ["approved_by_user_id = X-User-ID", "increments SettlementStatement.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /settlement-statements/{id}/pay"
        actor: JobberFinance
        preconditions: ["net_payable_to_jobber_cents >= program.min_payout_cents (else ERR_PAYOUT_BELOW_MINIMUM)"]
        side_effects: ["paid_at = clock", "increments SettlementStatement.version by 1"]

  - entity: Promotion
    initial_state: DRAFT
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /promotions/{id}/schedule"
        actor: JobberAdmin
        preconditions: ["start_date <= end_date (else ERR_WINDOW_INVALID)"]
        side_effects: ["if set_window covers clock date (start_date <= clock <= end_date): immediately ACTIVE instead", "increments Promotion.version by 1"]
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (clock sweep when start_date <= clock date <= end_date)"
        actor: system
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /promotions/{id}/suspend"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /promotions/{id}/resume (suspend/resume cycle; requires clock date still within [start_date, end_date])"
        actor: JobberAdmin
        preconditions: ["clock date within promo window (else ERR_WINDOW_INVALID)"]
        side_effects: ["increments Promotion.version by 1"]
      - from: ACTIVE
        to: ENDED
        trigger: "POST /promotions/{id}/end OR system (clock sweep when clock date > end_date)"
        actor: JobberAdmin | system
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: SUSPENDED
        to: ENDED
        trigger: "POST /promotions/{id}/end OR system (clock sweep when clock date > end_date)"
        actor: JobberAdmin | system
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /promotions/{id}/cancel"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /promotions/{id}/cancel"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /promotions/{id}/cancel"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /promotions/{id}/cancel"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments Promotion.version by 1"]

  - entity: PriceDirective
    initial_state: EFFECTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: <create>
        to: EFFECTIVE
        trigger: "POST /price-directives (effective_from <= clock)"
        actor: JobberAdmin
        preconditions:
          - "OCC: expected_store_agreement_version == agreement.version (else ERR_STALE_VERSION)"
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "product.program_id == agreement.program_id (else ERR_PRODUCT_NOT_IN_PROGRAM)"
          - "product.status == ACTIVE (else ERR_PRODUCT_DISCONTINUED)"
          - "price_cents >= product.min_retail_cents (else ERR_PRICE_BELOW_FLOOR)"
        side_effects:
          - "existing EFFECTIVE directive for (agreement, product) -> SUPERSEDED with superseded_at = clock (create-with-supersede)"
          - "increments StoreAgreement.version by 1"
      - from: <create>
        to: SCHEDULED
        trigger: "POST /price-directives (effective_from > clock)"
        actor: JobberAdmin
        preconditions: ["same as EFFECTIVE creation"]
        side_effects: ["increments StoreAgreement.version by 1"]
      - from: SCHEDULED
        to: EFFECTIVE
        trigger: "system (clock sweep when effective_from <= clock)"
        actor: system
        preconditions: []
        side_effects: ["existing EFFECTIVE directive for (agreement, product) -> SUPERSEDED", "increments PriceDirective.version by 1"]

  - entity: MarkdownAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, APPLIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /markdown-authorizations/{id}/approve"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id"]
        side_effects: ["approved_at = clock", "increments MarkdownAuthorization.version by 1"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /markdown-authorizations/{id}/reject"
        actor: RetailerManager
        preconditions: ["X-User-ID == agreement.store_id"]
        side_effects: ["increments MarkdownAuthorization.version by 1"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /markdown-authorizations/{id}/apply"
        actor: JobberAdmin
        preconditions:
          - "MARKDOWN only: credit_cents <= round_half_up(agreement.markdown_cap_pct_of_gross * gross sales of the clock-current period) (else ERR_MARKDOWN_CAP_EXCEEDED)"
          - "RETURN_TO_VENDOR only: balance.on_hand_units >= units (else ERR_RANGE_INVALID on units)"
        side_effects:
          - "MARKDOWN: credit_cents computed per formula; no unit movement"
          - "RETURN_TO_VENDOR: balance.on_hand_units -= units; lifetime_rma_units += units; credit_cents = 0"
          - "applied_at = clock; increments MarkdownAuthorization.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep when clock date > approved_at date + 14 days)"
        actor: system
        preconditions: []
        side_effects: ["increments MarkdownAuthorization.version by 1"]

  - entity: SeasonalSet
    initial_state: PLANNED
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNED
        to: SET_IN_PROGRESS
        trigger: "POST /seasonal-sets/{id}/begin-setup"
        actor: RouteDriver
        preconditions: ["set_window_start <= clock date <= set_window_end (CLOSED; else ERR_SEASONAL_WINDOW_NOT_OPEN)"]
        side_effects: ["increments SeasonalSet.version by 1"]
      - from: SET_IN_PROGRESS
        to: SET_COMPLETE
        trigger: "POST /seasonal-sets/{id}/complete-setup"
        actor: RouteDriver
        preconditions:
          - "an ACTIVE SpaceAllocation exists for this agreement with category == set.category and facings >= allocated_facings (else ERR_SEASONAL_ALLOCATION_MISSING)"
        side_effects: ["increments SeasonalSet.version by 1"]
      - from: SET_COMPLETE
        to: ACTIVE_SEASON
        trigger: "POST /seasonal-sets/{id}/activate"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["increments SeasonalSet.version by 1"]
      - from: ACTIVE_SEASON
        to: TEARDOWN_DUE
        trigger: "system (clock sweep when clock date > teardown_deadline)"
        actor: system
        preconditions: []
        side_effects: ["increments SeasonalSet.version by 1"]
      - from: ACTIVE_SEASON
        to: TORN_DOWN
        trigger: "POST /seasonal-sets/{id}/teardown"
        actor: RouteDriver
        preconditions: []
        side_effects: ["actual_teardown_date = clock date", "penalty_cents computed per seasonal_teardown_penalty", "increments SeasonalSet.version by 1"]
      - from: TEARDOWN_DUE
        to: TORN_DOWN
        trigger: "POST /seasonal-sets/{id}/teardown"
        actor: RouteDriver
        preconditions: []
        side_effects: ["same as ACTIVE_SEASON -> TORN_DOWN"]
      - from: TORN_DOWN
        to: RECONCILED
        trigger: "POST /seasonal-sets/{id}/reconcile"
        actor: JobberAdmin
        preconditions: []
        side_effects: ["penalty_cents becomes eligible for the settlement statement whose window contains the reconciliation date", "increments SeasonalSet.version by 1"]

  - entity: SpaceAllocation
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: <create>
        to: PLANNED
        trigger: "POST /space-allocations (window_start_date > clock date)"
        actor: JobberAdmin
        preconditions: ["see validations: window order, overlap, exclusivity, capacity"]
        side_effects: []
      - from: <create>
        to: ACTIVE
        trigger: "POST /space-allocations (window_start_date <= clock date < window_end_date)"
        actor: JobberAdmin
        preconditions: ["same as PLANNED creation"]
        side_effects: []
      - from: PLANNED
        to: ACTIVE
        trigger: "system (clock sweep when window opens and agreement ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CLOSED
        trigger: "POST /space-allocations/{id}/close"
        actor: JobberAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /space-allocations/{id}/close OR system (agreement termination)"
        actor: JobberAdmin | system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-only; every entry passed the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: StoreAgreement
    write_endpoint: "PATCH /agreements/{id}"
    occ_field: "expected_store_agreement_version"
    description: |
      Amending agreement terms with an expected_store_agreement_version that no
      longer equals the agreement's current version is rejected: another write
      (e.g., a price-directive supersede or a shrink-ratio recompute) has
      advanced the version since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: price-directive-supersede-stale-agreement
    parent_entity: StoreAgreement
    write_endpoint: "POST /price-directives"
    occ_field: "expected_store_agreement_version"
    description: |
      Creating a PriceDirective supersedes the currently EFFECTIVE directive for
      the same (agreement, product); doing so against an agreement whose version
      has advanced since the client last read it is rejected so the client always
      supersedes the directive set it actually saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-finalize-stale-version
    parent_entity: SettlementStatement
    write_endpoint: "POST /settlement-statements/{id}/finalize"
    occ_field: "expected_settlement_statement_version"
    description: |
      Finalizing a settlement whose version has advanced since the client last
      observed it (e.g., a revise cycle recomputed the money fields) is rejected;
      the client must re-read the statement and finalize the version it verified.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: audit-certify-stale-version
    parent_entity: AuditCount
    write_endpoint: "POST /audit-counts/{id}/certify"
    occ_field: "expected_audit_count_version"
    description: |
      Certifying an audit whose version has advanced since the client last
      observed it (e.g., a dispute/order-recount/resubmit cycle replaced the
      frozen count lines) is rejected; the certifier must certify the counts it
      actually reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Global precision: all money integer cents; every rounding is round_half_up
# (0.5 rounds away from zero) unless a rule states otherwise.
# =============================================================================
calculations:
  - name: scan_pricing_resolution
    trigger: "scan ingest (MATCHED path) and scan resolve"
    algorithm: threshold
    formula: |
      directive = EFFECTIVE PriceDirective for (agreement, product) with
                  effective_from <= scanned_at (match precondition guarantees one)
      base_price = directive.price_cents
      promo = Promotion of (agreement.program_id, product) with
              status == ACTIVE and start_date <= date(scanned_at) <= end_date
              (CLOSED interval). Eligibility when several match: the one with
              greatest depth_pct; tie-break: earliest start_date, then created_at ASC.
      if promo exists:
        promo_price = round_half_up(base_price * (1 - promo.depth_pct))
        scan_unit_price = min(base_price, promo_price)
        is_promo_priced = (scan_unit_price < base_price)
      else:
        scan_unit_price = base_price
        is_promo_priced = false
      line_value_cents = +scan_unit_price * qty   (SALE)
                       = -scan_unit_price * qty   (RETURN)
      VOID: unit_price_cents = target.unit_price_cents;
            line_value_cents = -target.line_value_cents;
            is_promo_priced = target.is_promo_priced
    input_set: "the scan being ingested; EFFECTIVE directives and ACTIVE promotions at scanned_at"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"

  - name: promo_funding_split
    trigger: "scan ingest when scan_pricing_resolution applied a promotion"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (per-line first, then sum):
        discount_unit_cents = directive.price_cents - scan_unit_price
        line_jobber_funding_cents = round_half_up(discount_unit_cents * quantity * promo.jobber_funding_pct)
      Statement total: promo_jobber_funding_cents = SUM(scan.jobber_funding_cents)
      over MATCHED scans in the period window.
      (Alternative order "sum raw discounts then round" is FORBIDDEN: it yields
      different cents — e.g. price 101, depth 0.25, funding 0.5, two qty-1 lines:
      pinned order gives 13 + 13 = 26; sum-then-round gives round(25.25) = 25.)
    input_set: "MATCHED scans with is_promo_priced == true in the statement window"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up per line then integer sum"

  - name: retailer_margin_split
    trigger: "settlement generate / finalize / revise"
    algorithm: tiered_pricing
    formula: |
      tier_uplift = agreement.tier2_uplift_pct  if net_sales_cents >= agreement.tier2_threshold_cents
                  = agreement.tier1_uplift_pct  elif net_sales_cents >= agreement.tier1_threshold_cents
                  = 0                            otherwise            (boundaries are >=)
      promo_share = promo_scan_units / scanned_units   (0.0 when scanned_units == 0)
      promo_drag  = 0.01 if promo_share > 0.30 else 0.0   (strictly greater)
      margin_pct  = clamp(base_margin_pct + tier_uplift - promo_drag,
                          min_margin_pct, max_margin_pct)   (nested min/max)
      retailer_margin_cents = round_half_up(net_sales_cents * margin_pct)
    input_set: "statement's net_sales_cents, scanned_units, promo_scan_units; agreement term fields"
    constants:
      PROMO_DRAG_PCT: 0.01
      PROMO_DRAG_SHARE: 0.30
    precision: "margin_pct exact decimal; margin cents round_half_up"

  - name: shrink_allocation
    trigger: "audit submit (freeze units side) and audit certify (value side)"
    algorithm: waterfall_allocation
    formula: |
      At SUBMIT (frozen):
        variance_units   = SUM over counted lines of (book_on_hand_at_submit - counted_units)
        free_allowance_units = round_half_up(scanned_units_since_last_audit * agreement.free_allowance_pct)
        chargeable_units = max(0, variance_units - free_allowance_units)
      At CERTIFY:
        variance_value_cents  = chargeable_units * valuation_unit_cents
        retailer_charge_cents = round_half_up(variance_value_cents * agreement.shrink_retailer_share_pct)
        jobber absorbs the remainder (variance_value_cents - retailer_charge_cents)
    input_set: "counted lines only; products absent from counted_lines are not varianced"
    constants:
      ROUNDING: round_half_up
    precision: "integer units and cents"

  - name: audit_variance_valuation
    trigger: "audit certify (feeds shrink_allocation value side)"
    algorithm: weighted_scoring
    formula: |
      Variant selected by agreement.shrink_valuation_mode:
        JOBBER_COST:    valuation_unit_cents = product.jobber_cost_cents
        BLENDED_RETAIL: valuation_unit_cents =
          round_half_up(COST_W * product.jobber_cost_cents
                        + RETAIL_W * EFFECTIVE directive price_cents for (agreement, product) at certify time)
      The two variants produce different values for identical count data whenever
      directive price != jobber cost (e.g. cost 100, price 200 -> 100 vs
      round(0.6*100 + 0.4*200) = 140).
    input_set: "audited product, agreement.shrink_valuation_mode, EFFECTIVE price directive"
    constants:
      COST_W: 0.6
      RETAIL_W: 0.4
    precision: "integer cents, round_half_up"
    variants:
      - name: JOBBER_COST
        when: "agreement.shrink_valuation_mode == JOBBER_COST"
        difference: "values shrink at pure jobber cost"
      - name: BLENDED_RETAIL
        when: "agreement.shrink_valuation_mode == BLENDED_RETAIL"
        difference: "values shrink at 60/40 cost/retail blend — strictly higher when retail > cost"

  - name: settlement_net_payable
    trigger: "settlement generate (PROVISIONAL), finalize (FINAL), revise (PROVISIONAL)"
    algorithm: aggregation
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency resolved top-down):
      1. gross_scanned_sales_cents = SUM(ScanEvent.line_value_cents) for MATCHED
         scans with scanned_at in [period_start, period_end)  (half-open: a scan at
         exactly period_end belongs to the NEXT period)
      2. scanned_units = net SALE units in window; promo_scan_units = promo-priced units
      3. promo_jobber_funding_cents = SUM(scan.jobber_funding_cents) in window
      4. raw_markdown = SUM(credit_cents of MARKDOWN auths with applied_at in window)
         markdown_credit_cents = min(raw_markdown,
           round_half_up(agreement.markdown_cap_pct_of_gross * gross_scanned_sales_cents))
         # cap is keyed on GROSS (step 1), never on net
      5. net_sales_cents = gross_scanned_sales_cents - markdown_credit_cents
      6. margin_pct = retailer_margin_split(net_sales_cents, ...)  # tier keyed on NET (step 5), never on gross
      7. retailer_margin_cents = round_half_up(net_sales_cents * margin_pct)
      8. shrink_retailer_charge_cents per variant (below)
      9. teardown_penalty_cents = SUM(SeasonalSet.penalty_cents) reconciled in window
      10. net_payable_to_jobber_cents = net_sales_cents - retailer_margin_cents
          + shrink_retailer_charge_cents - teardown_penalty_cents
    input_set: "MATCHED scans, APPLIED MARKDOWN auths, CERTIFIED/LOCKED audits, RECONCILED seasonal sets — all keyed to the half-open period window"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "generate and revise"
        difference: |
          shrink_retailer_charge_cents = round_half_up(
            round_half_up(scanned_units * agreement.estimated_shrink_rate)
            * avg_cost * agreement.shrink_retailer_share_pct)
          where avg_cost = round_half_up(SUM(line qty * product.jobber_cost_cents) / scanned_units)
          over the window's scans (0 when scanned_units == 0); audits are ignored.
      - name: FINAL
        when: "finalize"
        difference: |
          shrink_retailer_charge_cents = SUM(retailer_charge_cents) over audits
          CERTIFIED/LOCKED with certified_at in [period_start, period_end);
          estimated_shrink_rate is ignored. Same scan data therefore yields a
          different payable whenever estimate != certified actual.

  - name: settlement_period_window
    trigger: "settlement generate (derives window), period membership tests elsewhere"
    algorithm: interval_merge
    formula: |
      anchor = date(agreement.activated_at)
      length = 7 days (WEEKLY) | 14 days (BIWEEKLY) | 1 calendar month (MONTHLY)
      period_start(p) = anchor + p * length
      period_end(p)   = anchor + (p + 1) * length      # EXCLUSIVE (half-open)
      Example (WEEKLY, anchor 2026-08-01): period 0 = [2026-08-01, 2026-08-08).
    input_set: "agreement.activated_at, agreement.settlement_cadence, period_index"
    constants:
      WEEKLY_DAYS: 7
      BIWEEKLY_DAYS: 14
    precision: "date granularity"

  - name: shrink_ratio_posture
    trigger: "audit certify (after inventory posting), visit confirm"
    algorithm: threshold
    formula: |
      cumulative_shrink_ratio = cumulative_shrink_units / cumulative_delivered_units
                                (0.0 when cumulative_delivered_units == 0)
      if agreement.status == ACTIVE and cumulative_shrink_ratio >= agreement.shrink_suspend_ratio:
        agreement -> SUSPENDED            (boundary is >=: exactly equal suspends)
    input_set: "agreement cumulative counters"
    constants:
      BOUNDARY: ">="
    precision: "ratio compared exactly (integer division avoided: compare shrink_units * 1.0 / delivered_units)"

  - name: restock_suggested_quantity
    trigger: "scan match landing a balance at/below reorder point (reorder cascade)"
    algorithm: forward_looking
    formula: |
      if balance.on_hand_units <= balance.reorder_point_units after a matched scan:
        suggested_restock_units = max(0, 2 * balance.reorder_point_units - balance.on_hand_units)
        target visit = the SCHEDULED ServiceVisit of the same agreement with the
          earliest scheduled_date >= clock date; tie-break: ServiceVisit.created_at ASC;
          empty candidate set: no visit is mutated (no error)
        set target.auto_restock_flag = true, target.suggested_restock_units = computed value
    input_set: "the mutated balance; SCHEDULED visits of the agreement"
    constants:
      REORDER_TARGET_MULTIPLIER: 2
    precision: "integer units"

  - name: space_capacity_check
    trigger: "space allocation create"
    algorithm: aggregation
    formula: |
      overlapping = allocations of the same store (denormalized store_id) with
        status in {PLANNED, ACTIVE} whose half-open windows intersect the candidate
        ([s1,e1) vs [s2,e2) intersect iff s1 < e2 and s2 < e1; touching endpoints
        s1 == e2 do NOT intersect)
      committed = SUM(facings of overlapping) + candidate.facings
      reject if committed > store.total_facings    (equality is ALLOWED: 10 == 10 passes)
    input_set: "store's non-CLOSED allocations"
    constants:
      BOUNDARY: "reject only on strict >"
    precision: "integer facings"

  - name: promo_gap_check
    trigger: "promotion create"
    algorithm: interval_merge
    formula: |
      For each existing non-CANCELLED promotion of the same (program_id, product_id)
      with CLOSED window [s2, e2] and candidate window [s1, e1]:
        reject if NOT (s1 > e2 + program.promo_min_gap_days OR e1 < s2 - program.promo_min_gap_days)
      With gap = 1 and existing ending 2026-08-10: start 2026-08-11 is REJECTED
      (1 day diff, need > 1), start 2026-08-12 is ACCEPTED.
      (Buffer semantics — deliberately unlike space allocations where touching
      endpoints are allowed.)
    input_set: "program's promotions for the product"
    constants:
      BOUNDARY: "strict > on day difference"
    precision: "date granularity"

  - name: seasonal_teardown_penalty
    trigger: "seasonal set teardown"
    algorithm: decay_function
    formula: |
      days_late = max(0, (actual_teardown_date - teardown_deadline).days - GRACE_DAYS)
      penalty_cents = min(PENALTY_CAP_CENTS, days_late * PENALTY_PER_DAY_CENTS)
      Example: deadline 2026-08-20, teardown 2026-08-25 -> (5 - 2) * 2500 = 7500.
    input_set: "the torn-down SeasonalSet"
    constants:
      GRACE_DAYS: 2
      PENALTY_PER_DAY_CENTS: 2500
      PENALTY_CAP_CENTS: 100000
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first matching failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_AUTH_CONTEXT, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "Request-body FK references exist (program_id, store_id, product_id, route_id, store_agreement_id, void_of_event_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "create/action endpoints" }
  - { priority: 5, category: existence, check: "Required fields present and well-typed", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with input" }
  - { priority: 6, category: existence, check: "Enum fields carry a declared member", error_id: ERR_INVALID_ENUM, http_status: 422, applies_to: "endpoints with enum inputs" }
  - { priority: 7, category: existence, check: "Numeric ranges: quantity >= 1, facings >= 1, units >= 1, depth_pct in (0, 0.50], pcts in [0,1], prices >= 1", error_id: ERR_RANGE_INVALID, http_status: 422, applies_to: "endpoints with numeric inputs" }
  - { priority: 8, category: state, check: "Ownership/identity: RetailerManager X-User-ID == agreement.store_id; RouteDriver X-User-ID == route.assigned_driver_id", error_id: "ERR_STORE_MANAGER_MISMATCH | ERR_DRIVER_NOT_ASSIGNED", http_status: 403, applies_to: "ownership-scoped endpoints (accept/reject/confirm/dispute/approve markdown/dispute statement, scan ingest; check-in/submit-counts/recount)" }
  - { priority: 9, category: state, check: "Target resource in a valid from-state for the transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 10, category: state, check: "Target resource already terminal", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "action endpoints on terminal-state resources" }
  - { priority: 11, category: state, check: "OCC: expected_<parent>_version equals parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /agreements/{id}, POST /price-directives, POST /settlement-statements/{id}/finalize, POST /audit-counts/{id}/certify" }
  - { priority: 12, category: business_safety, check: "Segregation of duties: audit certifier != counter; settlement approver != creator", error_id: "ERR_SOD_CERTIFIER_IS_COUNTER | ERR_SOD_APPROVER_IS_CREATOR", http_status: 403, applies_to: "audit certify, settlement approve" }
  - { priority: 13, category: business_temporal, check: "Window order: start < end (half-open) or start <= end (closed promo/set windows)", error_id: ERR_WINDOW_INVALID, http_status: 422, applies_to: "space-allocations, promotions, seasonal-sets create; promo schedule/resume" }
  - { priority: 14, category: business_temporal, check: "Visit check-in only when clock date == scheduled_date", error_id: ERR_VISIT_WINDOW_CLOSED, http_status: 409, applies_to: "POST /service-visits/{id}/check-in" }
  - { priority: 15, category: business_temporal, check: "Seasonal setup begin only within [set_window_start, set_window_end]", error_id: ERR_SEASONAL_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /seasonal-sets/{id}/begin-setup" }
  - { priority: 16, category: business_temporal, check: "Settlement period fully closed (clock >= period_end) at finalize; period begun at generate", error_id: ERR_SETTLEMENT_PERIOD_NOT_CLOSED, http_status: 409, applies_to: "settlement generate/finalize" }
  - { priority: 17, category: business_temporal, check: "Space allocation half-open overlap on same store+category (same program)", error_id: ERR_SPACE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /space-allocations" }
  - { priority: 18, category: business_temporal, check: "Promotion minimum gap on same (program, product)", error_id: ERR_PROMO_GAP_VIOLATION, http_status: 409, applies_to: "POST /promotions" }
  - { priority: 19, category: business_constraint, check: "Uniqueness: one live agreement per (program, store); sku unique per program; client_event_id unique per agreement; one statement per (agreement, period_index)", error_id: "ERR_AGREEMENT_EXISTS | ERR_SKU_EXISTS | ERR_DUPLICATE_SCAN_EVENT | ERR_SETTLEMENT_ALREADY_EXISTS", http_status: 409, applies_to: "corresponding create endpoints" }
  - { priority: 20, category: business_constraint, check: "Category exclusivity: overlapping same-store same-category window under a DIFFERENT program", error_id: ERR_CATEGORY_EXCLUSIVE_CONFLICT, http_status: 409, applies_to: "POST /space-allocations" }
  - { priority: 21, category: business_constraint, check: "Facing capacity: overlapping allocations + candidate <= store.total_facings", error_id: ERR_SPACE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /space-allocations" }
  - { priority: 22, category: business_constraint, check: "Price maintenance floor: price_cents >= product.min_retail_cents", error_id: ERR_PRICE_BELOW_FLOOR, http_status: 422, applies_to: "POST /price-directives" }
  - { priority: 23, category: business_constraint, check: "product.program_id == agreement.program_id for directives, visit lines, scans", error_id: ERR_PRODUCT_NOT_IN_PROGRAM, http_status: 422, applies_to: "price-directives, scan-events, visit submit-counts" }
  - { priority: 24, category: business_constraint, check: "product.status == ACTIVE for new directives", error_id: ERR_PRODUCT_DISCONTINUED, http_status: 409, applies_to: "POST /price-directives" }
  - { priority: 25, category: business_constraint, check: "visit.store_agreement_id belongs to route.program_id", error_id: ERR_ROUTE_PROGRAM_MISMATCH, http_status: 422, applies_to: "POST /service-visits" }
  - { priority: 26, category: business_constraint, check: "Seasonal complete-setup requires covering ACTIVE SpaceAllocation", error_id: ERR_SEASONAL_ALLOCATION_MISSING, http_status: 409, applies_to: "POST /seasonal-sets/{id}/complete-setup" }
  - { priority: 27, category: business_referential, check: "Related aggregate state: agreement ACTIVE for scans (else UNMATCHED, not an error), visits, directives, audits, statements", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "visit check-in/confirm, price-directives, audit start, settlement generate" }
  - { priority: 28, category: business_referential, check: "Finalize requires all in-window audits CERTIFIED/LOCKED", error_id: ERR_AUDIT_NOT_CERTIFIED, http_status: 409, applies_to: "POST /settlement-statements/{id}/finalize" }
  - { priority: 29, category: business_referential, check: "VOID target: MATCHED non-VOID scan of same agreement, equal quantity", error_id: ERR_VOID_TARGET_INVALID, http_status: 409, applies_to: "POST /scan-events" }
  - { priority: 30, category: business_fiscal, check: "Visit restock value <= agreement.restock_value_cap_cents", error_id: ERR_RESTOCK_VALUE_CAP_EXCEEDED, http_status: 409, applies_to: "POST /service-visits/{id}/submit-counts" }
  - { priority: 31, category: business_fiscal, check: "Markdown credit <= round_half_up(markdown_cap_pct_of_gross * current-period gross)", error_id: ERR_MARKDOWN_CAP_EXCEEDED, http_status: 409, applies_to: "POST /markdown-authorizations/{id}/apply" }
  - { priority: 32, category: business_fiscal, check: "Payout >= program.min_payout_cents", error_id: ERR_PAYOUT_BELOW_MINIMUM, http_status: 409, applies_to: "POST /settlement-statements/{id}/pay" }

# =============================================================================
# §1.5 API Endpoint Table (flat resources; every FK has a filtered-list reverse GET)
# ALL_ROLES = [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor]
# =============================================================================
endpoints:
  # --- clock (test-driving; logical clock defaults to 2026-08-01T00:00:00Z at startup) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock; startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Fires the time sweep: visits MISSED, promos activate/end, markdowns EXPIRED, seasonal sets TEARDOWN_DUE, allocations PLANNED->ACTIVE, SCHEDULED price directives EFFECTIVE (superseding)."
    roles: [JobberAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, swept_transitions: integer }
    side_effects: ["all time-based auto-transitions listed in §1.2"]

  # --- Program ---
  - { method: POST, path: "/programs", description: "Create program", roles: [JobberAdmin], code: 201, input: [name, "promo_min_gap_days?", "min_payout_cents?", "default_settlement_cadence?"], output: Program, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/programs", description: "List programs", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: GET, path: "/programs/{id}", description: "Get program", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/programs/{id}/archive", description: "Archive program (no live agreements)", roles: [JobberAdmin], code: 200, input: [], output: Program, side_effects: ["status=ARCHIVED; increments Program.version by 1"] }

  # --- Store ---
  - { method: POST, path: "/stores", description: "Create store", roles: [JobberAdmin], code: 201, input: [name, store_code, total_facings], output: Store, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/stores", description: "List stores", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Store[]", side_effects: [] }
  - { method: GET, path: "/stores/{id}", description: "Get store", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: Store, side_effects: [] }
  - { method: POST, path: "/stores/{id}/close", description: "Close store (no live agreements)", roles: [JobberAdmin], code: 200, input: [], output: Store, side_effects: ["status=CLOSED; increments Store.version by 1"] }

  # --- StoreAgreement ---
  - { method: POST, path: "/agreements", description: "Create store agreement (junction with commercial terms)", roles: [JobberAdmin], code: 201, input: [program_id, store_id, base_margin_pct, shrink_retailer_share_pct, restock_value_cap_cents, "tier1_threshold_cents?", "tier1_uplift_pct?", "tier2_threshold_cents?", "tier2_uplift_pct?", "min_margin_pct?", "max_margin_pct?", "free_allowance_pct?", "shrink_suspend_ratio?", "shrink_valuation_mode?", "estimated_shrink_rate?", "markdown_liability?", "markdown_jobber_share_pct?", "markdown_cap_pct_of_gross?", "settlement_cadence?", "service_frequency_days?"], output: StoreAgreement, side_effects: ["status=DRAFT; uniqueness gate ERR_AGREEMENT_EXISTS"] }
  - { method: GET, path: "/agreements", description: "List agreements (FK reverse reachability for program_id/store_id)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["program_id?", "store_id?", "status?", "limit?", "offset?"], output: "StoreAgreement[]", side_effects: [] }
  - { method: GET, path: "/agreements/{id}", description: "Get agreement", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: StoreAgreement, side_effects: [] }
  - { method: PATCH, path: "/agreements/{id}", description: "Amend commercial terms (OCC-guarded)", roles: [JobberAdmin], code: 200, input: [expected_store_agreement_version, "base_margin_pct?", "shrink_retailer_share_pct?", "free_allowance_pct?", "estimated_shrink_rate?", "restock_value_cap_cents?", "markdown_jobber_share_pct?", "shrink_suspend_ratio?"], output: StoreAgreement, side_effects: ["increments StoreAgreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/submit", description: "DRAFT -> PENDING_ACCEPTANCE", roles: [JobberAdmin], code: 200, input: [], output: StoreAgreement, side_effects: ["increments StoreAgreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/accept", description: "PENDING_ACCEPTANCE -> ACTIVE (store manager)", roles: [RetailerManager], code: 200, input: [], output: StoreAgreement, side_effects: ["activated_at=clock; increments StoreAgreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/reject", description: "PENDING_ACCEPTANCE -> REJECTED", roles: [RetailerManager], code: 200, input: ["reason?"], output: StoreAgreement, side_effects: ["increments StoreAgreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/suspend", description: "ACTIVE -> SUSPENDED; cancels SCHEDULED visits", roles: [JobberAdmin], code: 200, input: ["reason?"], output: StoreAgreement, side_effects: ["SCHEDULED ServiceVisits -> CANCELLED; increments StoreAgreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/resume", description: "SUSPENDED -> ACTIVE", roles: [JobberAdmin], code: 200, input: [], output: StoreAgreement, side_effects: ["increments StoreAgreement.version by 1"] }
  - { method: POST, path: "/agreements/{id}/terminate", description: "ACTIVE|SUSPENDED -> TERMINATED", roles: [JobberAdmin], code: 200, input: [], output: StoreAgreement, side_effects: ["ACTIVE allocations -> CLOSED; SCHEDULED visits -> CANCELLED; increments StoreAgreement.version by 1"] }

  # --- Product ---
  - { method: POST, path: "/products", description: "Create product", roles: [JobberAdmin], code: 201, input: [program_id, sku, name, jobber_cost_cents, min_retail_cents, units_per_facing], output: Product, side_effects: ["status=ACTIVE; sku uniqueness per program (ERR_SKU_EXISTS)"] }
  - { method: GET, path: "/products", description: "List products (FK reverse reachability for program_id)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Get product", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: Product, side_effects: [] }
  - { method: PATCH, path: "/products/{id}", description: "Update cost/floor or discontinue", roles: [JobberAdmin], code: 200, input: ["jobber_cost_cents?", "min_retail_cents?", "status?"], output: Product, side_effects: ["increments Product.version by 1"] }

  # --- SpaceAllocation ---
  - { method: POST, path: "/space-allocations", description: "Allocate rack facings for a category window (overlap/exclusivity/capacity gates)", roles: [JobberAdmin], code: 201, input: [store_agreement_id, category, facings, window_start_date, window_end_date], output: SpaceAllocation, side_effects: ["status=ACTIVE if window covers clock else PLANNED"] }
  - { method: GET, path: "/space-allocations", description: "List allocations (FK reverse reachability for store_agreement_id)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "category?", "status?", "limit?", "offset?"], output: "SpaceAllocation[]", side_effects: [] }
  - { method: GET, path: "/space-allocations/{id}", description: "Get allocation", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: SpaceAllocation, side_effects: [] }
  - { method: POST, path: "/space-allocations/{id}/close", description: "PLANNED|ACTIVE -> CLOSED", roles: [JobberAdmin], code: 200, input: [], output: SpaceAllocation, side_effects: ["increments SpaceAllocation.version by 1"] }

  # --- PriceDirective ---
  - { method: POST, path: "/price-directives", description: "Set maintained retail price (OCC on agreement; supersedes current EFFECTIVE)", roles: [JobberAdmin], code: 201, input: [store_agreement_id, product_id, price_cents, effective_from, expected_store_agreement_version], output: PriceDirective, side_effects: ["current EFFECTIVE directive for (agreement, product) -> SUPERSEDED; increments StoreAgreement.version by 1"] }
  - { method: GET, path: "/price-directives", description: "List directives (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "product_id?", "status?", "limit?", "offset?"], output: "PriceDirective[]", side_effects: [] }
  - { method: GET, path: "/price-directives/{id}", description: "Get directive", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: PriceDirective, side_effects: [] }

  # --- Promotion ---
  - { method: POST, path: "/promotions", description: "Create promo (gap rule per promo_gap_check)", roles: [JobberAdmin], code: 201, input: [program_id, product_id, name, depth_pct, jobber_funding_pct, start_date, end_date], output: Promotion, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/promotions", description: "List promos (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["program_id?", "product_id?", "status?", "limit?", "offset?"], output: "Promotion[]", side_effects: [] }
  - { method: GET, path: "/promotions/{id}", description: "Get promo", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: Promotion, side_effects: [] }
  - { method: POST, path: "/promotions/{id}/schedule", description: "DRAFT -> SCHEDULED (or ACTIVE if clock in window)", roles: [JobberAdmin], code: 200, input: [], output: Promotion, side_effects: ["increments Promotion.version by 1"] }
  - { method: POST, path: "/promotions/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [JobberAdmin], code: 200, input: [], output: Promotion, side_effects: ["increments Promotion.version by 1"] }
  - { method: POST, path: "/promotions/{id}/resume", description: "SUSPENDED -> ACTIVE (clock must be in window)", roles: [JobberAdmin], code: 200, input: [], output: Promotion, side_effects: ["increments Promotion.version by 1"] }
  - { method: POST, path: "/promotions/{id}/cancel", description: "DRAFT|SCHEDULED|ACTIVE|SUSPENDED -> CANCELLED", roles: [JobberAdmin], code: 200, input: [], output: Promotion, side_effects: ["increments Promotion.version by 1"] }
  - { method: POST, path: "/promotions/{id}/end", description: "ACTIVE|SUSPENDED -> ENDED", roles: [JobberAdmin], code: 200, input: [], output: Promotion, side_effects: ["increments Promotion.version by 1"] }

  # --- InventoryBalance (read-only; auto-created) ---
  - { method: GET, path: "/inventory-balances", description: "List balances (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "product_id?", "stock_posture?", "limit?", "offset?"], output: "InventoryBalance[]", side_effects: [] }
  - { method: GET, path: "/inventory-balances/{id}", description: "Get balance", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: InventoryBalance, side_effects: [] }

  # --- Route ---
  - { method: POST, path: "/routes", description: "Create route with assigned driver", roles: [JobberAdmin], code: 201, input: [program_id, name, assigned_driver_id, "service_frequency_days?"], output: Route, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/routes", description: "List routes (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Route[]", side_effects: [] }
  - { method: GET, path: "/routes/{id}", description: "Get route", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: Route, side_effects: [] }
  - { method: PATCH, path: "/routes/{id}", description: "Reassign driver / cadence / deactivate", roles: [JobberAdmin], code: 200, input: ["assigned_driver_id?", "service_frequency_days?", "status?"], output: Route, side_effects: ["increments Route.version by 1"] }

  # --- ServiceVisit ---
  - { method: POST, path: "/service-visits", description: "Schedule a route service visit", roles: [JobberAdmin], code: 201, input: [route_id, store_agreement_id, scheduled_date], output: ServiceVisit, side_effects: ["status=SCHEDULED; agreement must be ACTIVE; route program must match"] }
  - { method: GET, path: "/service-visits", description: "List visits (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["route_id?", "store_agreement_id?", "status?", "limit?", "offset?"], output: "ServiceVisit[]", side_effects: [] }
  - { method: GET, path: "/service-visits/{id}", description: "Get visit", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: ServiceVisit, side_effects: [] }
  - { method: POST, path: "/service-visits/{id}/check-in", description: "SCHEDULED -> CHECKED_IN (assigned driver, day-of only)", roles: [RouteDriver], code: 200, input: [], output: ServiceVisit, side_effects: ["increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/service-visits/{id}/submit-counts", description: "CHECKED_IN -> COUNTS_SUBMITTED; freezes count+restock lines", roles: [RouteDriver], code: 200, input: [lines], output: ServiceVisit, side_effects: ["computes totals and variance snapshot; fiscal cap check; increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/service-visits/{id}/confirm", description: "COUNTS_SUBMITTED -> CONFIRMED; posts restock to inventory ledger", roles: [RetailerManager], code: 200, input: [], output: ServiceVisit, side_effects: ["upserts InventoryBalance per line (on_hand := counted + restock); agreement cumulative_delivered_units += restock; increments ServiceVisit.version and StoreAgreement.version by 1"] }
  - { method: POST, path: "/service-visits/{id}/dispute", description: "COUNTS_SUBMITTED -> DISPUTED", roles: [RetailerManager], code: 200, input: ["reason?"], output: ServiceVisit, side_effects: ["increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/service-visits/{id}/recount", description: "DISPUTED -> CHECKED_IN (revision loop)", roles: [RouteDriver], code: 200, input: [], output: ServiceVisit, side_effects: ["clears submitted_lines/totals; increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/service-visits/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [JobberAdmin], code: 200, input: [], output: ServiceVisit, side_effects: ["increments ServiceVisit.version by 1"] }

  # --- ScanEvent (append-only) ---
  - { method: POST, path: "/scan-events", description: "Ingest POS scan (sale/return/void); synchronous match against price directive + promo", roles: [RetailerManager], code: 201, input: [store_agreement_id, product_id, event_type, quantity, scanned_at, client_event_id, "void_of_event_id?"], output: ScanEvent, side_effects: ["MATCHED: inventory decrement/increment, valuation, promo funding, reorder cascade; UNMATCHED: no side effects"] }
  - { method: GET, path: "/scan-events", description: "List scans (FK reverse reachability incl. self-FK void_of_event_id)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "product_id?", "event_type?", "status?", "void_of_event_id?", "settled_in_statement_id?", "limit?", "offset?"], output: "ScanEvent[]", side_effects: [] }
  - { method: GET, path: "/scan-events/{id}", description: "Get scan", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: ScanEvent, side_effects: [] }
  - { method: POST, path: "/scan-events/{id}/resolve", description: "UNMATCHED -> MATCHED after master-data fix", roles: [JobberAdmin], code: 200, input: [], output: ScanEvent, side_effects: ["applies MATCHED side effects (valuation, inventory, reorder cascade)"] }

  # --- AuditCount ---
  - { method: POST, path: "/audit-counts", description: "Schedule a shrink audit", roles: [JobberAdmin], code: 201, input: [store_agreement_id, scope, "category?"], output: AuditCount, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/audit-counts", description: "List audits (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "status?", "limit?", "offset?"], output: "AuditCount[]", side_effects: [] }
  - { method: GET, path: "/audit-counts/{id}", description: "Get audit", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: AuditCount, side_effects: [] }
  - { method: POST, path: "/audit-counts/{id}/start", description: "SCHEDULED -> IN_PROGRESS", roles: [FieldAuditor], code: 200, input: [], output: AuditCount, side_effects: ["increments AuditCount.version by 1"] }
  - { method: POST, path: "/audit-counts/{id}/submit", description: "IN_PROGRESS -> SUBMITTED; freezes counts and unit-side variance", roles: [FieldAuditor], code: 200, input: [counted_lines], output: AuditCount, side_effects: ["freezes counted_by_user_id, submitted_at, variance_units, free_allowance_units, chargeable_units; increments AuditCount.version by 1"] }
  - { method: POST, path: "/audit-counts/{id}/dispute", description: "SUBMITTED -> DISPUTED", roles: [RetailerManager], code: 200, input: ["reason?"], output: AuditCount, side_effects: ["increments AuditCount.version by 1"] }
  - { method: POST, path: "/audit-counts/{id}/order-recount", description: "DISPUTED -> IN_PROGRESS (revision loop)", roles: [JobberAdmin], code: 200, input: [], output: AuditCount, side_effects: ["clears frozen count state; increments AuditCount.version by 1"] }
  - { method: POST, path: "/audit-counts/{id}/certify", description: "SUBMITTED -> CERTIFIED (OCC + SoD); posts shrink and runs suspension cascade", roles: [JobberAdmin], code: 200, input: [expected_audit_count_version], output: AuditCount, side_effects: ["valuates variance per shrink_valuation_mode; posts shrink to InventoryBalance; recomputes agreement cumulative_shrink_ratio; auto-suspends agreement at/above threshold (cancelling its SCHEDULED visits); increments AuditCount.version and StoreAgreement.version by 1"] }
  - { method: POST, path: "/audit-counts/{id}/lock", description: "CERTIFIED -> LOCKED", roles: [JobberAdmin], code: 200, input: [], output: AuditCount, side_effects: ["increments AuditCount.version by 1"] }

  # --- MarkdownAuthorization ---
  - { method: POST, path: "/markdown-authorizations", description: "Request markdown credit or vendor return", roles: [JobberAdmin], code: 201, input: [store_agreement_id, product_id, auth_type, units, "markdown_price_cents?"], output: MarkdownAuthorization, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/markdown-authorizations", description: "List markdown auths (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "product_id?", "status?", "limit?", "offset?"], output: "MarkdownAuthorization[]", side_effects: [] }
  - { method: GET, path: "/markdown-authorizations/{id}", description: "Get markdown auth", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: MarkdownAuthorization, side_effects: [] }
  - { method: POST, path: "/markdown-authorizations/{id}/approve", description: "REQUESTED -> APPROVED (retailer accepts responsibility split)", roles: [RetailerManager], code: 200, input: [], output: MarkdownAuthorization, side_effects: ["approved_at=clock; increments MarkdownAuthorization.version by 1"] }
  - { method: POST, path: "/markdown-authorizations/{id}/reject", description: "REQUESTED -> REJECTED", roles: [RetailerManager], code: 200, input: ["reason?"], output: MarkdownAuthorization, side_effects: ["increments MarkdownAuthorization.version by 1"] }
  - { method: POST, path: "/markdown-authorizations/{id}/apply", description: "APPROVED -> APPLIED; computes credit / pulls RMA units", roles: [JobberAdmin], code: 200, input: [], output: MarkdownAuthorization, side_effects: ["MARKDOWN: credit_cents computed (cap-checked); RETURN_TO_VENDOR: on_hand -= units, lifetime_rma_units += units; applied_at=clock; increments MarkdownAuthorization.version by 1"] }

  # --- SettlementStatement ---
  - { method: POST, path: "/settlement-statements", description: "Generate PROVISIONAL statement for a period", roles: [JobberFinance], code: 201, input: [store_agreement_id, period_index], output: SettlementStatement, side_effects: ["computes money fields (PROVISIONAL variant); created_by_user_id=X-User-ID"] }
  - { method: GET, path: "/settlement-statements", description: "List statements (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "status?", "limit?", "offset?"], output: "SettlementStatement[]", side_effects: [] }
  - { method: GET, path: "/settlement-statements/{id}", description: "Get statement", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: SettlementStatement, side_effects: [] }
  - { method: POST, path: "/settlement-statements/{id}/finalize", description: "PROVISIONAL -> FINALIZED (OCC); FINAL variant recompute", roles: [JobberFinance], code: 200, input: [expected_settlement_statement_version], output: SettlementStatement, side_effects: ["recomputes money fields (FINAL variant); stamps settled_in_statement_id on included scans; locks included audits; increments SettlementStatement.version by 1"] }
  - { method: POST, path: "/settlement-statements/{id}/dispute", description: "FINALIZED -> DISPUTED", roles: [RetailerManager], code: 200, input: ["reason?"], output: SettlementStatement, side_effects: ["increments SettlementStatement.version by 1"] }
  - { method: POST, path: "/settlement-statements/{id}/revise", description: "DISPUTED -> PROVISIONAL (revision loop, recompute)", roles: [JobberFinance], code: 200, input: [], output: SettlementStatement, side_effects: ["recomputes money fields (PROVISIONAL variant); increments SettlementStatement.version by 1"] }
  - { method: POST, path: "/settlement-statements/{id}/approve", description: "FINALIZED -> APPROVED (SoD vs creator)", roles: [JobberAdmin], code: 200, input: [], output: SettlementStatement, side_effects: ["approved_by_user_id=X-User-ID; increments SettlementStatement.version by 1"] }
  - { method: POST, path: "/settlement-statements/{id}/pay", description: "APPROVED -> PAID (minimum payout gate)", roles: [JobberFinance], code: 200, input: [], output: SettlementStatement, side_effects: ["paid_at=clock; increments SettlementStatement.version by 1"] }

  # --- SeasonalSet ---
  - { method: POST, path: "/seasonal-sets", description: "Plan a seasonal display set", roles: [JobberAdmin], code: 201, input: [store_agreement_id, theme, category, allocated_facings, set_window_start, set_window_end, teardown_deadline], output: SeasonalSet, side_effects: ["status=PLANNED"] }
  - { method: GET, path: "/seasonal-sets", description: "List seasonal sets (FK reverse reachability)", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: ["store_agreement_id?", "status?", "limit?", "offset?"], output: "SeasonalSet[]", side_effects: [] }
  - { method: GET, path: "/seasonal-sets/{id}", description: "Get seasonal set", roles: [JobberAdmin, RetailerManager, RouteDriver, JobberFinance, FieldAuditor], code: 200, input: [], output: SeasonalSet, side_effects: [] }
  - { method: POST, path: "/seasonal-sets/{id}/begin-setup", description: "PLANNED -> SET_IN_PROGRESS (within set window)", roles: [RouteDriver], code: 200, input: [], output: SeasonalSet, side_effects: ["increments SeasonalSet.version by 1"] }
  - { method: POST, path: "/seasonal-sets/{id}/complete-setup", description: "SET_IN_PROGRESS -> SET_COMPLETE (requires covering ACTIVE allocation)", roles: [RouteDriver], code: 200, input: [], output: SeasonalSet, side_effects: ["increments SeasonalSet.version by 1"] }
  - { method: POST, path: "/seasonal-sets/{id}/activate", description: "SET_COMPLETE -> ACTIVE_SEASON", roles: [JobberAdmin], code: 200, input: [], output: SeasonalSet, side_effects: ["increments SeasonalSet.version by 1"] }
  - { method: POST, path: "/seasonal-sets/{id}/teardown", description: "ACTIVE_SEASON|TEARDOWN_DUE -> TORN_DOWN; computes penalty", roles: [RouteDriver], code: 200, input: [], output: SeasonalSet, side_effects: ["actual_teardown_date=clock date; penalty_cents per seasonal_teardown_penalty; increments SeasonalSet.version by 1"] }
  - { method: POST, path: "/seasonal-sets/{id}/reconcile", description: "TORN_DOWN -> RECONCILED; posts penalty to settlement window", roles: [JobberAdmin], code: 200, input: [], output: SeasonalSet, side_effects: ["increments SeasonalSet.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries an undeclared member" }
  - { id: ERR_RANGE_INVALID, http: 422, condition: "Numeric input outside declared range (quantity/units/facings < 1, pct outside [0,1], depth outside (0,0.5], RMA units > on_hand)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version != parent's current version (OCC)" }
  - { id: ERR_STORE_MANAGER_MISMATCH, http: 403, condition: "RetailerManager X-User-ID != agreement.store_id" }
  - { id: ERR_DRIVER_NOT_ASSIGNED, http: 403, condition: "RouteDriver X-User-ID != route.assigned_driver_id" }
  - { id: ERR_SOD_CERTIFIER_IS_COUNTER, http: 403, condition: "Audit certifier X-User-ID == counted_by_user_id" }
  - { id: ERR_SOD_APPROVER_IS_CREATOR, http: 403, condition: "Settlement approver X-User-ID == created_by_user_id" }
  - { id: ERR_AGREEMENT_EXISTS, http: 409, condition: "Live agreement already exists for (program_id, store_id)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires agreement.status == ACTIVE" }
  - { id: ERR_SKU_EXISTS, http: 409, condition: "sku already exists within program" }
  - { id: ERR_DUPLICATE_SCAN_EVENT, http: 409, condition: "client_event_id already ingested for this agreement" }
  - { id: ERR_VOID_TARGET_INVALID, http: 409, condition: "VOID target missing, UNMATCHED, itself a VOID, wrong agreement, or quantity mismatch" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "Window endpoints inverted (start >= end for half-open; start > end for closed) or promo resume outside window" }
  - { id: ERR_VISIT_WINDOW_CLOSED, http: 409, condition: "Check-in when logical clock date != scheduled_date" }
  - { id: ERR_SEASONAL_WINDOW_NOT_OPEN, http: 409, condition: "begin-setup outside [set_window_start, set_window_end]" }
  - { id: ERR_SEASONAL_ALLOCATION_MISSING, http: 409, condition: "complete-setup without a covering ACTIVE SpaceAllocation (same category, facings >= allocated_facings)" }
  - { id: ERR_SETTLEMENT_PERIOD_NOT_CLOSED, http: 409, condition: "Generate before period_start or finalize before period_end" }
  - { id: ERR_SETTLEMENT_ALREADY_EXISTS, http: 409, condition: "Statement already exists for (agreement, period_index)" }
  - { id: ERR_AUDIT_NOT_CERTIFIED, http: 409, condition: "Finalize blocked by an in-window audit not in {CERTIFIED, LOCKED}" }
  - { id: ERR_PAYOUT_BELOW_MINIMUM, http: 409, condition: "net_payable_to_jobber_cents < program.min_payout_cents at pay" }
  - { id: ERR_RESTOCK_VALUE_CAP_EXCEEDED, http: 409, condition: "Submitted restock value > agreement.restock_value_cap_cents" }
  - { id: ERR_MARKDOWN_CAP_EXCEEDED, http: 409, condition: "Markdown credit > round_half_up(markdown_cap_pct_of_gross * current-period gross)" }
  - { id: ERR_SPACE_WINDOW_OVERLAP, http: 409, condition: "Same-store same-category same-program allocation windows intersect (half-open)" }
  - { id: ERR_CATEGORY_EXCLUSIVE_CONFLICT, http: 409, condition: "Same-store same-category window intersects another PROGRAM's allocation (exclusivity)" }
  - { id: ERR_SPACE_CAPACITY_EXCEEDED, http: 422, condition: "Overlapping allocations' facings + candidate > store.total_facings" }
  - { id: ERR_PROMO_GAP_VIOLATION, http: 409, condition: "Promo window violates minimum gap vs another non-CANCELLED promo on same (program, product)" }
  - { id: ERR_PRICE_BELOW_FLOOR, http: 422, condition: "price_cents < product.min_retail_cents" }
  - { id: ERR_PRODUCT_NOT_IN_PROGRAM, http: 422, condition: "product.program_id != agreement.program_id" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "New price directive for DISCONTINUED product" }
  - { id: ERR_ROUTE_PROGRAM_MISMATCH, http: 422, condition: "Visit's agreement does not belong to route's program" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: JobberAdmin
    description: "Rack jobber operations administrator: owns all master data, commercial terms, pricing, promos, space, seasonal programs; certifies audits; approves settlements"
    identity: opaque
    exclusive_operations: [create/archive programs, create/close stores, create/amend/lifecycle-submit agreements (submit/suspend/resume/terminate), create/update products, create/close space allocations, create price directives, full promotion lifecycle, create routes, schedule/cancel visits, order audit recounts, certify audits, lock audits, apply markdowns, approve settlements, reconcile seasonal sets, resolve scans, set logical clock]
    shared_operations: [read any resource]
  - name: RetailerManager
    description: "Store-side manager; X-User-ID must equal the Store id of the agreement being acted on"
    identity: "entity_backed:Store"
    exclusive_operations: [accept/reject agreements, confirm/dispute service visits, ingest scan events, approve/reject markdown authorizations, dispute settlement statements, dispute audit counts]
    shared_operations: [read any resource]
  - name: RouteDriver
    description: "Jobber route driver; X-User-ID must equal the route's assigned_driver_id to execute its visits"
    identity: opaque
    exclusive_operations: [check in visits, submit counts, recount disputed visits, begin/complete seasonal setup, teardown seasonal sets]
    shared_operations: [read any resource]
