            - *k_clock_0802
          trigger:
            - call: "POST /redemption-periods/${p_aug_id}/settlement-import"
              payload: { imported_total_cents: 1500, imported_transaction_count: 9, imported_large_transaction_cents: 120000, imported_even_dollar_transaction_count: 3 }
