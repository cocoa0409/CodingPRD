        distinguishing_aspect: "Entity-backed identity: FleetManager acting as customer B (X-User-ID == B's id) submitting customer A's order is a 403 ERR_OWNERSHIP_MISMATCH — roles match, ownership does not."
        test_recipe:
          setup:
            - "Logical clock set; customers A and B exist; A has a DRAFT order (via A's depot and a supplier)."
          setup_api_calls:
            - *c_clock
