scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: net_to_seller_provisional_vs_final_diverge
        grounds:
          - calculations.net_to_seller
          - calculations.net_to_seller.variants.provisional_net
          - calculations.net_to_seller.variants.final_net
          - endpoints.GET_/listings/{listingId}/net-sheet
        distinguishing_aspect: |
          On a Listing entity, the provisional net-sheet basis (leading live offer current_price_cents=49000000)
          yields net=46060000, while the final net basis (accepted effective_price_cents=50000000) yields
          net=47000000 — same listing, two algorithms, different cents.
        test_recipe:
          setup:
            - "Brokerage with default_total_commission_pct=0.06, default_coop_split_pct=0.50."
            - "Listing ACTIVE at list_price 50000000; one buyer with budget 60000000."
            - "An OPEN offer at 49000000 exists (the leading live offer)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme Realty", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara Listing", license_no: "L-1001" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben Buyer", license_no: "B-2001" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob Client", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "1 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-1" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 49000000, earnest_money_cents: 1000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "GET /listings/${lst_id}/net-sheet"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { prov_net: $.data.net_to_seller_cents }
          assert:
            - "provisional net_to_seller_cents == 46060000 (49000000 - round_half_up(49000000*0.06)=49000000-2940000)"
            - "This basis is the leading live offer current_price_cents (49000000), NOT the list price 50000000"

      - name: appraisal_gap_vs_financing_dti_diverge_on_contingency
        grounds:
          - calculations.financing_dti
          - state_machines.Contingency.transitions.PENDING_to_SATISFIED
          - state_machines.Contingency.transitions.PENDING_to_FAILED
          - entities.Contingency.fields.kind
        distinguishing_aspect: |
          On the Contingency entity, the APPRAISAL gate (value vs effective price) and the FINANCING gate
          (DTI ratio + prequal ceiling) are two distinct algorithms over the same accepted offer: an APPRAISAL
          contingency with appraised_value 50000000 SATISFIES while a FINANCING contingency at DTI 0.4300001 FAILS.
        test_recipe:
          setup:
            - "Listing UNDER_CONTRACT with accepted offer effective_price_cents=50000000."
            - "Offer requested both APPRAISAL and FINANCING contingencies (both PENDING)."
            - "Buyer income=1000000, debt=180001, prequalified_amount_cents=50000000."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme Realty", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara Listing", license_no: "L-1002" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben Buyer", license_no: "B-2002" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob Client", max_budget_cents: 60000000, monthly_income_cents: 1000000, monthly_debt_cents: 180001, prequalified_amount_cents: 50000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "2 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id, lst_v: $.data.version }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-2" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 1000000, requested_contingencies: ["APPRAISAL", "FINANCING"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${off_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { appr_id: "$.data[?(@.kind=='APPRAISAL')].id", fin_id: "$.data[?(@.kind=='FINANCING')].id" }
          trigger:
            - call: "POST /contingencies/${appr_id}/resolve"
              payload: { appraised_value_cents: 50000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { appr_status: $.data.status }
            - call: "POST /contingencies/${fin_id}/resolve"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { fin_status: $.data.status }
          assert:
            - "APPRAISAL contingency status == SATISFIED (50000000 >= 50000000)"
            - "FINANCING contingency status == FAILED (DTI=(180001+250000)/1000000=0.430001 > 0.43)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commission_split_nested_rounding_order_pinned   # mode (b)
        grounds:
          - calculations.run_commission_split
          - entities.CommissionLedger.fields.coop_commission_cents
          - entities.CommissionLedger.fields.listing_side_commission_cents
          - state_machines.Listing.transitions.PENDING_to_CLOSED
        distinguishing_aspect: |
          Mode (b) nested rounding: at sale 16666675 cents the pinned order (round total FIRST = 1000001,
          THEN round coop off that = 500001) gives coop 500001, whereas rounding coop directly off the raw
          sale*0.06*0.50 product gives 500000 — a one-cent divergence the pinned order resolves.
        test_recipe:
          setup:
            - "Listing PENDING with no contingencies (empty requested_contingencies), accepted effective_price 16666675."
            - "Brokerage total_commission_pct=0.06, coop_split_pct=0.50."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme Realty", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1003" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2003" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 20000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "3 Oak St", list_price_cents: 16666675 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-3" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 16666675, earnest_money_cents: 0, requested_contingencies: [] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v3: $.data.version }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v4: $.data.version }
          trigger:
            - call: "POST /listings/${lst_id}/close"
              payload: { expected_listing_version: "${lst_v4}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /listings/${lst_id}/commission-ledger"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { coop: "$.data[0].coop_commission_cents" }
          assert:
            - "ledger total_commission_cents == 1000001 (round_half_up(16666675*0.06)=1000000.5->1000001)"
            - "ledger coop_commission_cents == 500001 (round_half_up(1000001*0.50)=500000.5->500001)"
            - "ledger listing_side_commission_cents == 500000 (1000001 - 500001)"

      - name: financing_dti_three_input_nonlinear_gate          # mode (a)
        grounds:
          - calculations.financing_dti
          - entities.Buyer.fields.monthly_income_cents
          - entities.Buyer.fields.monthly_debt_cents
          - entities.Buyer.fields.prequalified_amount_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: the FINANCING gate combines monthly_debt, an effective-price-derived
          monthly_pi, monthly_income (a ratio), AND a prequalified ceiling via a conjunction — the pass/fail flips on any
          one of the three crossing its boundary, unlike a single-input threshold.
        test_recipe:
          setup:
            - "Listing UNDER_CONTRACT, accepted offer effective_price 50000000 with FINANCING contingency PENDING."
            - "Buyer income=1000000, debt=180000 (DTI exactly 0.43), prequalified=50000000 (price at ceiling)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1004" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2004" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 1000000, monthly_debt_cents: 180000, prequalified_amount_cents: 50000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "4 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-4" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: ["FINANCING"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${off_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { fin_id: "$.data[0].id" }
          trigger:
            - call: "POST /contingencies/${fin_id}/resolve"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { fin_status: $.data.status }
          assert:
            - "FINANCING contingency status == SATISFIED (DTI=(180000+250000)/1000000=0.43 exactly, <=0.43 passes; price 50000000 <= prequal 50000000)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle_seller_buyer_loop
        grounds:
          - state_machines.Offer.transitions.OPEN_to_SELLER_COUNTERED
          - state_machines.Offer.transitions.SELLER_COUNTERED_to_BUYER_COUNTERED
          - state_machines.Offer.transitions.BUYER_COUNTERED_to_SELLER_COUNTERED
        distinguishing_aspect: |
          The Offer entity cycles SELLER_COUNTERED <-> BUYER_COUNTERED across repeated counter rounds (a genuine
          A->B->A negotiation loop), distinct from any linear pipeline — round_count grows monotonically while the
          state oscillates between the two countered states.
        test_recipe:
          setup:
            - "ACTIVE listing with an OPEN offer at 49000000; current_party=SELLER."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1005" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2005" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "5 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-5" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 49000000, earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { counter_price_cents: 50000000, actor_agent_id: "${la_id}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { counter_price_cents: 49500000, actor_agent_id: "${ba_id}" }
              as: BuyerAgent
              as_user_id: "${ba_id}"
            - call: "POST /offers/${off_id}/counter"
              payload: { counter_price_cents: 49800000, actor_agent_id: "${la_id}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${off_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { st: $.data.status, rc: $.data.round_count, cp: $.data.current_price_cents }
          assert:
            - "After 3 counters Offer.status == SELLER_COUNTERED (cycled BUYER_COUNTERED -> SELLER_COUNTERED)"
            - "Offer.round_count == 3 and current_price_cents == 49800000 and current_party == BUYER"

      - name: contingency_branch_satisfied_vs_failed_divergent_effects
        grounds:
          - state_machines.Contingency.transitions.PENDING_to_SATISFIED
          - state_machines.Contingency.transitions.PENDING_to_FAILED
          - state_machines.Contingency.transitions.PENDING_to_WAIVED
        distinguishing_aspect: |
          The Contingency entity branches from PENDING into {SATISFIED, WAIVED, FAILED} with divergent side-effect sets:
          SATISFIED/WAIVED can bubble the listing to PENDING, whereas FAILED runs a compensation that reverts the
          listing to ACTIVE and withdraws the offer — a fork-with-divergent-effects on one entity.
        test_recipe:
          setup:
            - "Listing UNDER_CONTRACT, accepted offer with a single INSPECTION contingency PENDING."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1006" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2006" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "6 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-6" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: ["INSPECTION"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${off_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { ins_id: "$.data[0].id" }
          trigger:
            - call: "POST /contingencies/${ins_id}/fail"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_status: $.data.status }
            - call: "GET /offers/${off_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { off_status: $.data.status }
          assert:
            - "Contingency status == FAILED triggers compensation"
            - "Listing.status reverts to ACTIVE and accepted_offer_id == null"
            - "Offer.status == WITHDRAWN"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_offer_three_hop_cascade   # depth >= 3
        grounds:
          - state_machines.Offer.transitions.OPEN_to_ACCEPTED
          - state_machines.Listing.transitions.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Listing.transitions.UNDER_CONTRACT_to_PENDING
        distinguishing_aspect: |
          Accepting an OPEN offer with NO contingencies cascades transitively: accept (A) freezes the offer & moves
          Listing ACTIVE->UNDER_CONTRACT (B), which because requested_contingencies is empty itself bubbles
          UNDER_CONTRACT->PENDING (C) — three caused hops from one accept trigger, each caused by the prior hop.
        test_recipe:
          setup:
            - "ACTIVE listing with two OPEN offers (multiple-offer); accept one with no contingencies."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1007" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2007" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Cara", license_no: "B-2008" }
              as: Anonymous
              captures: { ba2_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer1_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba2_id}", full_name: "Cathy", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
