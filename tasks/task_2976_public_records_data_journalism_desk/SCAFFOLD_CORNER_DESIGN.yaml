  - section: cross-cutting complexity layers
    instances:
      - name: both_occ_rules_reject_a_stale_parent_version_and_accept_a_fresh_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[request-create-stale-desk]
          - concurrency_rules[analysis-run-create-stale-investigation]
          - validations[priority=90]
        distinguishing_aspect: |
          The two OCC rules guard different parents with different error codes, and the fixture proves
          both are live in the same run: a Desk version invalidated by a budget adjustment rejects a
          records-request create with ERR_STALE_DESK_VERSION, and an Investigation version invalidated by
          a sibling analysis-run create rejects the next analysis-run with ERR_STALE_INVESTIGATION_VERSION.
          Crucially the invalidating write in each case is a DIFFERENT endpoint from the guarded one, and
          re-reading the parent makes the identical payload succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. One Desk, one Agency, one RELEASED RecordsRequest, one Investigation with one CLEAN_LOCKED Dataset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
