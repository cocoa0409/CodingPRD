  - method: GET
    path: "/tooling/coating-recipes/{recipeId}"
    description: "Read one coating recipe with its computed thickness and validation state."
    roles: [CoatingEngineer, MetallurgyEngineer, GeometryEngineer, ApplicationEngineer, QualityApprover, ProductionPlanner]
    code: 200
    output: CoatingRecipe
    side_effects: []

  - method: GET
    path: "/tooling/coating-recipes"
