            - "after cancelling session 3, HearingRoom.${room_a_id}.booked_minutes_total == 150 and NOT 0: the cancel compensates only its own reservation and the adjourned session's 150 minutes stay on the ledger forever"
            - "GET /integrity/hearing-sessions?room_id=${room_a_id} returns total_count 3 with statuses CANCELLED, ADJOURNED and CANCELLED"
            - "Case.${case_id}.hearing_round == 3 throughout the teardown: neither cancel decrements it, so the counter is monotone while the minutes ledger is not"

      - name: student_points_and_department_open_case_count_return_to_their_pre_operation_values
        grounds:
          - invariants.inv-active-sanction-points
          - invariants.inv-department-open-cases
          - endpoints[POST /integrity/sanctions/{id}/impose]
          - endpoints[POST /integrity/sanctions/{id}/complete]
          - endpoints[POST /integrity/cases/{id}/dismiss]
          - validations[priority=13]
          - validations[priority=19]
        distinguishing_aspect: |
          Two independent derived ledgers are driven up and then back down through DIFFERENT compensations
          in one run: Student.active_sanction_points is incremented by ladder_rank on impose and released by
          complete, while Department.open_case_count is incremented by case creation and released by a
          completed sanction on one case and by a dismissal on the other. Both must land back on the exact
          value they held before any case existed. The trap is double-release: replaying the compensation
          must not drive either counter below its floor, and because priority 13 outranks priority 19 the
          replay is refused with ERR_CASE_STATE_INVALID rather than ERR_SANCTION_STATE_INVALID - a naive
          implementation that checks the sanction first reports the wrong error while still leaking a
          decrement. A control department that owns no cases must read 0 at every observation point.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "two departments: ENGL, which owns the offering, and HIST, a control that never owns a case"
            - "two students, each with exactly one report on ENGL-201, so no prior-case escalation and no cross-course pattern points apply to either case"
            - "case A is taken through the FORMAL pathway to DECIDED with panel recommendations 4 and 6 plus one NOT_RESPONSIBLE vote, giving panel_severity_recommendation 4 and office band [3, 5]"
            - "case B is left in INTAKE_REVIEW"
            - "a rank-4 TRANSCRIPT_NOTATION_ONLY Sanction is PROPOSED on case A with effective_from 2026-08-21T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
