        distinguishing_aspect: "CLEARANCE diverges from the other two exception types by discarding requested_override_floor_cents entirely: with clearance_discount_pct 0.20 on a 15000 floor the result is 12000, not the requested 9000, and the MIN_FLOOR_RATIO guard is never consulted."
        test_recipe:
          setup: ["Product SKU-CLR-1 with lifecycle_status CLEARANCE, clearance_discount_pct 0.20 and standard_map_floor_cents 15000; a REQUESTED CLEARANCE exception asking for 9000."]
          setup_api_calls:
