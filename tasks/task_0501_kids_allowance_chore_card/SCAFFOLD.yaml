# =============================================================================
# Task 0501 — Kids' Allowance & Chore Debit Card (Greenlight/GoHenry style)
# Scaffold seed tables (§1.0–§1.7). Expert tier per §0.4.
# =============================================================================

scenario: |
  501. Kids' Allowance & Chore Debit Card (Greenlight/GoHenry style): parent-managed
  child sub-accounts, chore-list → reward automation, spend/save/give jars, per-store &
  category card controls, scheduled allowance transfer, parent-paid savings interest
  match, real-time spend alert & instant card lock, teen investing add-on

domain_name: kids-allowance-chore-card
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration   # chore-completion approval pipeline + reward automation
  secondary_archetype: ledger_reconciliation  # jar balances, interest-match accrual, allowance ledger
  complexity_layers:
    - cascading_side_effects          # chore approve -> reward post -> jar credit -> card available-balance recompute
    - dual_variant_calculation        # interest match (whole-period vs daily-accrual) + spend authorization (provisional hold vs final settle)
    - scheduled_deferred_actions      # scheduled allowance transfer fires on a logical clock
    - optimistic_concurrency          # card lock vs in-flight authorization on DebitCard.version
    - rate_threshold_triggers         # interest-match monthly cap, spend-alert threshold breach

  entity_topology: hierarchical       # Family -> ChildAccount -> {Jar, Chore, DebitCard, ...}
  state_machine_shape: parallel       # DebitCard carries lock_state x funding_state independently; ChoreCompletion has a revision cycle
  relationship_patterns:
    - one_to_many                     # Family->ChildAccount, ChildAccount->Jar/Chore/Transaction
    - cross_aggregate                 # Transaction debits a Jar across the card boundary; InterestAccrual reads Jar.balance
  role_model: peer_roles              # Parent owns family config; Child acts on own card/chores; PlatformAdmin operational
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: family_name, type: string, source: input, description: "Household display name" }
      - { name: primary_parent_id, type: string, source: system, description: "X-User-ID of the Parent who created the family; opaque operator id, not an entity FK" }
      - { name: funding_balance_cents, type: integer, source: computed, description: "Parent funding wallet in cents; debited by allowance runs, reward posts, interest accruals, and investment buys; credited by deposits and sells. Starts at 0." }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. SUSPENDED freezes all child money movement.", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED" }

  - name: ChildAccount
    parent: Family
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id" }
      - { name: display_name, type: string, source: input, description: "Child's name" }
      - { name: birthdate, type: datetime, source: input, description: "ISO date; used to gate teen investing eligibility (>= 13 years at enable time)" }
      - { name: is_teen, type: boolean, source: computed, description: "True when (clock_now - birthdate) >= 13 years; recomputed on read and on investing enable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED. ARCHIVED child cannot earn rewards, spend, or accrue interest.", default: "ACTIVE", constraints: "ACTIVE | ARCHIVED" }

  - name: Jar
    parent: ChildAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: child_account_id, type: string, source: system, description: "FK -> ChildAccount.id" }
      - { name: jar_type, type: enum, source: system, description: "SPEND | SAVE | GIVE. Exactly one jar of each type auto-created with the ChildAccount.", constraints: "SPEND | SAVE | GIVE" }
      - { name: balance_cents, type: integer, source: computed, description: "Running balance in cents. SPEND jar funds the card; SAVE jar earns interest match; GIVE jar funds donations. Starts at 0; never negative." }
      - { name: lifetime_credited_cents, type: integer, source: computed, description: "Cumulative cents ever credited to this jar (never decremented); used for give-jar reporting. Starts at 0." }

  - name: Chore
    parent: ChildAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: child_account_id, type: string, source: system, description: "FK -> ChildAccount.id" }
      - { name: title, type: string, source: input, description: "Chore label, e.g. 'Take out trash'" }
      - { name: reward_cents, type: integer, source: input, description: "Reward paid on parent approval, in cents; must be > 0" }
      - { name: payout_jar_type, type: enum, source: input, description: "Which jar the reward credits: SPEND | SAVE | GIVE", default: "SPEND", constraints: "SPEND | SAVE | GIVE" }
      - { name: is_recurring, type: boolean, source: input, description: "If true, chore returns to AVAILABLE after a completion is approved/paid; if false it goes ARCHIVED.", default: false }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SUBMITTED | APPROVED | REJECTED | ARCHIVED", default: "AVAILABLE", constraints: "AVAILABLE | SUBMITTED | APPROVED | REJECTED | ARCHIVED" }

  - name: ChoreCompletion
    parent: Chore
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: chore_id, type: string, source: system, description: "FK -> Chore.id" }
      - { name: child_account_id, type: string, source: system, description: "Denormalized child id; equals Chore.child_account_id of chore_id (not an independent FK — discover completions via GET /chores/{id}/completions)" }
      - { name: reward_cents_snapshot, type: integer, source: system, description: "Copy of Chore.reward_cents at submission time; the amount actually paid on approval (immune to later Chore edits)" }
      - { name: payout_jar_type_snapshot, type: enum, source: system, description: "Copy of Chore.payout_jar_type at submission time: SPEND | SAVE | GIVE", constraints: "SPEND | SAVE | GIVE" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times this completion was kicked back to NEEDS_REVISION then resubmitted; starts at 0", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | NEEDS_REVISION | PAID | DENIED", default: "PENDING_REVIEW", constraints: "PENDING_REVIEW | NEEDS_REVISION | PAID | DENIED" }

  - name: DebitCard
    parent: ChildAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: child_account_id, type: string, source: system, description: "FK -> ChildAccount.id; exactly one card per child, created with the child" }
      - { name: lock_state, type: enum, source: system, description: "Independent lock dimension: UNLOCKED | LOCKED. LOCKED blocks all authorizations regardless of funding_state.", default: "UNLOCKED", constraints: "UNLOCKED | LOCKED" }
      - { name: funding_state, type: enum, source: system, description: "Independent funding dimension: FUNDED when linked SPEND jar balance_cents > 0, else DRAINED. Recomputed on every SPEND-jar balance change.", default: "DRAINED", constraints: "FUNDED | DRAINED" }
      - { name: held_cents, type: integer, source: computed, description: "Sum of reward_cents_snapshot-equivalent: total of all PENDING authorization Transaction.amount_cents on this card; reduces available balance. Starts at 0." }
      - { name: available_cents, type: integer, source: computed, description: "Linked SPEND jar balance_cents minus held_cents; the spendable amount. Never negative." }

  - name: CardControl
    parent: DebitCard
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: debit_card_id, type: string, source: system, description: "FK -> DebitCard.id" }
      - { name: control_kind, type: enum, source: input, description: "STORE blocks/limits a specific merchant_id; CATEGORY blocks/limits a merchant category.", constraints: "STORE | CATEGORY" }
      - { name: match_value, type: string, source: input, description: "merchant_id (when STORE) or category code e.g. GAMING, FOOD (when CATEGORY)" }
      - { name: rule, type: enum, source: input, description: "BLOCK denies any matching authorization; LIMIT caps cumulative matching spend at per_period_cap_cents within the current period.", constraints: "BLOCK | LIMIT" }
      - { name: per_period_cap_cents, type: integer, source: input, description: "Required when rule=LIMIT: cumulative cap in cents for matching SETTLED+PENDING transactions in the current period; ignored when rule=BLOCK", default: 0 }
      - { name: is_active, type: boolean, source: system, description: "True while enforced; set false by DELETE (soft archive). Inactive controls are skipped at authorization.", default: true }

  - name: Transaction
    parent: DebitCard
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: debit_card_id, type: string, source: system, description: "FK -> DebitCard.id" }
      - { name: child_account_id, type: string, source: system, description: "Denormalized child id; equals DebitCard.child_account_id of debit_card_id (not an independent FK — discover transactions via GET /debit-cards/{id}/transactions)" }
      - { name: merchant_id, type: string, source: input, description: "Merchant identifier presented at authorization" }
      - { name: category, type: string, source: input, description: "Merchant category code, e.g. GAMING, FOOD, BOOKS" }
      - { name: amount_cents, type: integer, source: input, description: "Authorization amount in cents; must be > 0" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Final settled amount supplied at settle; may be <= amount_cents (partial) or == amount_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING (hold placed) | SETTLED | DECLINED | REVERSED", default: "PENDING", constraints: "PENDING | SETTLED | DECLINED | REVERSED" }

  - name: AllowanceSchedule
    parent: ChildAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: child_account_id, type: string, source: system, description: "FK -> ChildAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Allowance amount transferred each run, in cents; must be > 0" }
      - { name: payout_jar_type, type: enum, source: input, description: "Jar credited each run: SPEND | SAVE | GIVE", default: "SPEND", constraints: "SPEND | SAVE | GIVE" }
      - { name: cadence_days, type: integer, source: input, description: "Days between runs; next_run_at advances by this many days after each run; must be >= 1" }
      - { name: next_run_at, type: datetime, source: system, description: "ISO8601 UTC; the run is due when clock_now >= next_run_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED", default: "ACTIVE", constraints: "ACTIVE | PAUSED | CANCELLED" }

  - name: AllowanceRun
    parent: AllowanceSchedule
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: allowance_schedule_id, type: string, source: system, description: "FK -> AllowanceSchedule.id" }
      - { name: amount_cents, type: integer, source: system, description: "Snapshot of schedule.amount_cents at run time" }
      - { name: ran_at, type: datetime, source: system, description: "Logical clock value when the run executed" }
      - { name: outcome, type: enum, source: system, description: "EXECUTED (funding debited + jar credited) | SKIPPED_INSUFFICIENT_FUNDS (funding_balance_cents < amount_cents)", constraints: "EXECUTED | SKIPPED_INSUFFICIENT_FUNDS" }

  - name: InterestMatchConfig
    parent: ChildAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; exactly one config per child" }
      - { name: child_account_id, type: string, source: system, description: "FK -> ChildAccount.id" }
      - { name: annual_rate_bps, type: integer, source: input, description: "Parent-paid annual interest rate in basis points (100 bps = 1%); applied to SAVE jar balance" }
      - { name: monthly_cap_cents, type: integer, source: input, description: "Maximum interest match credited per accrual period, in cents; 0 means uncapped" }
      - { name: accrual_method, type: enum, source: input, description: "WHOLE_PERIOD uses SAVE jar balance at period end; DAILY_AVERAGE uses time-weighted average balance over the period. Selects calculation variant.", default: "WHOLE_PERIOD", constraints: "WHOLE_PERIOD | DAILY_AVERAGE" }
      - { name: status, type: enum, source: system, description: "ENABLED | DISABLED", default: "ENABLED", constraints: "ENABLED | DISABLED" }

  - name: InterestAccrual
    parent: InterestMatchConfig
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: interest_match_config_id, type: string, source: system, description: "FK -> InterestMatchConfig.id" }
      - { name: child_account_id, type: string, source: system, description: "Denormalized child id; equals InterestMatchConfig.child_account_id (not an independent FK — discover accruals via GET /interest-match-configs/{id}/accruals)" }
      - { name: period_days, type: integer, source: input, description: "Length of the accrual period in days; used in the rate proration" }
      - { name: period_start_at, type: datetime, source: computed, description: "Window start = accrued_at - period_days days. The covered window is the half-open interval (period_start_at, accrued_at]." }
      - { name: matched_cents, type: integer, source: system, description: "Interest match actually credited to the SAVE jar this accrual (after cap)" }
      - { name: accrued_at, type: datetime, source: system, description: "Logical clock value when the accrual posted; equals the window end (closed end of the half-open period)" }

  - name: InvestmentAccount
    parent: ChildAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; at most one per child (teen investing add-on)" }
      - { name: child_account_id, type: string, source: system, description: "FK -> ChildAccount.id" }
      - { name: cash_cents, type: integer, source: computed, description: "Uninvested cash inside the investing account, in cents; funded from SAVE jar, drained by buys, credited by sells. Starts at 0." }
      - { name: holdings, type: object, source: computed, description: "Map of symbol -> {shares_milli: integer}; shares tracked in thousandths of a share (milli-shares). Empty at creation." }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED. CLOSED forbids new orders.", default: "ACTIVE", constraints: "ACTIVE | CLOSED" }

  - name: InvestmentOrder
    parent: InvestmentAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: investment_account_id, type: string, source: system, description: "FK -> InvestmentAccount.id" }
      - { name: side, type: enum, source: input, description: "BUY consumes cash_cents and adds milli-shares; SELL removes milli-shares and adds cash_cents.", constraints: "BUY | SELL" }
      - { name: symbol, type: string, source: input, description: "Ticker symbol, e.g. AAPL" }
      - { name: shares_milli, type: integer, source: input, description: "Order size in milli-shares (1000 = 1 share); must be > 0" }
      - { name: price_cents_per_share, type: integer, source: input, description: "Quoted price per whole share in cents at order time" }
      - { name: gross_cents, type: integer, source: computed, description: "Order notional = round_half_up(shares_milli * price_cents_per_share / 1000)" }
      - { name: status, type: enum, source: system, description: "FILLED | REJECTED", constraints: "FILLED | REJECTED" }

  - name: SpendAlert
    parent: Transaction
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: transaction_id, type: string, source: system, description: "FK -> Transaction.id" }
      - { name: child_account_id, type: string, source: system, description: "Denormalized child id; equals Transaction.child_account_id of transaction_id (not an independent FK — discover alerts via GET /transactions/{id}/alerts)" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC when alert was emitted" }
      - { name: alert_kind, type: enum, source: system, description: "LARGE_SPEND when amount_cents >= family alert threshold; LOW_BALANCE when post-hold available_cents < low_balance_threshold_cents.", constraints: "LARGE_SPEND | LOW_BALANCE" }
      - { name: amount_cents, type: integer, source: system, description: "The authorization amount that triggered the alert" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- 1. ChoreCompletion — CYCLIC (PENDING_REVIEW <-> NEEDS_REVISION) ----
  - entity: ChoreCompletion
    field: status
    initial_state: PENDING_REVIEW
    terminal_states: [PAID, DENIED]
    transitions:
      - from: PENDING_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /chore-completions/{id}/kick-back"
        actor: Parent
        preconditions:
          - "ChoreCompletion.status == PENDING_REVIEW"
          - "acting Parent owns the family of ChoreCompletion.child_account_id"
        side_effects:
          - "no money moves"
          - "increments updated_at, version"

      - from: NEEDS_REVISION
        to: PENDING_REVIEW
        trigger: "POST /chore-completions/{id}/resubmit"
        actor: Child
        preconditions:
          - "ChoreCompletion.status == NEEDS_REVISION"
          - "acting Child is ChoreCompletion.child_account_id"
        side_effects:
          - "increments ChoreCompletion.revision_count by 1"
          - "increments updated_at, version"
        note: "Cycle: PENDING_REVIEW -> NEEDS_REVISION -> PENDING_REVIEW; revision_count grows each loop."

      - from: PENDING_REVIEW
        to: PAID
        trigger: "POST /chore-completions/{id}/approve"
        actor: Parent
        preconditions:
          - "ChoreCompletion.status == PENDING_REVIEW"
          - "Family.status == ACTIVE (cross-entity: family of the child)"
          - "ChildAccount.status == ACTIVE"
          - "Family.funding_balance_cents >= ChoreCompletion.reward_cents_snapshot"
        side_effects:
          - "CASCADE step 1: debits Family.funding_balance_cents by reward_cents_snapshot"
          - "CASCADE step 2: credits the child's payout_jar_type_snapshot Jar.balance_cents by reward_cents_snapshot (this is the link that mutates the Jar)"
          - "CASCADE step 3: Jar credit raises lifetime_credited_cents; if payout jar is SPEND, the SPEND-jar balance change recomputes DebitCard.funding_state and DebitCard.available_cents"
          - "transitions parent Chore: AVAILABLE again if is_recurring else ARCHIVED"
          - "increments updated_at, version"
        note: "Reward-automation cascade depth 3: completion approve -> jar credit -> card funding recompute."

      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /chore-completions/{id}/deny"
        actor: Parent
        preconditions:
          - "ChoreCompletion.status == PENDING_REVIEW"
        side_effects:
          - "no money moves"
          - "transitions parent Chore to REJECTED"
          - "increments updated_at, version"

  # ---- 2. Chore — branching with revert (AVAILABLE <-> SUBMITTED, plus terminal) ----
  - entity: Chore
    field: status
    initial_state: AVAILABLE
    terminal_states: [ARCHIVED]
    transitions:
      - from: AVAILABLE
        to: SUBMITTED
        trigger: "POST /chores/{id}/submit"
        actor: Child
        preconditions:
          - "Chore.status == AVAILABLE"
          - "ChildAccount.status == ACTIVE (cross-entity)"
        side_effects:
          - "creates a ChoreCompletion in PENDING_REVIEW with reward_cents_snapshot = Chore.reward_cents and payout_jar_type_snapshot = Chore.payout_jar_type"
          - "increments updated_at, version"
      - from: SUBMITTED
        to: APPROVED
        trigger: "system: ChoreCompletion approved"
        actor: system
        preconditions:
          - "Chore.status == SUBMITTED"
        side_effects:
          - "Chore returns to AVAILABLE if is_recurring else ARCHIVED (this is the auto bubble-up)"
        note: "Bubble-up from ChoreCompletion approve; APPROVED is transient and immediately resolves to AVAILABLE/ARCHIVED."
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: ChoreCompletion denied"
        actor: system
        preconditions: []
        side_effects:
          - "Chore stays REJECTED until a Parent re-opens it"
      - from: REJECTED
        to: AVAILABLE
        trigger: "POST /chores/{id}/reopen"
        actor: Parent
        preconditions:
          - "Chore.status == REJECTED"
        side_effects:
          - "increments updated_at, version"
      - from: AVAILABLE
        to: ARCHIVED
        trigger: "DELETE /chores/{id}"
        actor: Parent
        preconditions:
          - "Chore.status IN {AVAILABLE, REJECTED}"
        side_effects:
          - "soft-archive; chore excluded from default chore lists"

  # ---- 3. DebitCard — PARALLEL dimensions (lock_state x funding_state) ----
  - entity: DebitCard
    field: "lock_state x funding_state (parallel)"
    initial_state: "UNLOCKED x DRAINED"
    terminal_states: []
    transitions:
      # lock dimension
      - from: "lock_state=UNLOCKED"
        to: "lock_state=LOCKED"
        trigger: "POST /debit-cards/{id}/lock"
        actor: Parent | Child
        preconditions:
          - "DebitCard.lock_state == UNLOCKED"
          - "request carries expected_debit_card_version matching current DebitCard.version (OCC)"
        side_effects:
          - "sets lock_state=LOCKED; future authorizations rejected with ERR_CARD_LOCKED"
          - "increments DebitCard.version by 1"
        note: "Instant card lock; OCC guards against locking a stale card view that an authorization already advanced."
      - from: "lock_state=LOCKED"
        to: "lock_state=UNLOCKED"
        trigger: "POST /debit-cards/{id}/unlock"
        actor: Parent
        preconditions:
          - "DebitCard.lock_state == LOCKED"
          - "request carries expected_debit_card_version matching current DebitCard.version (OCC)"
        side_effects:
          - "sets lock_state=UNLOCKED"
          - "increments DebitCard.version by 1"
      # funding dimension — system-driven, independent of lock
      - from: "funding_state=DRAINED"
        to: "funding_state=FUNDED"
        trigger: "system: linked SPEND Jar.balance_cents becomes > 0"
        actor: system
        preconditions:
          - "SPEND Jar.balance_cents > 0"
        side_effects:
          - "sets funding_state=FUNDED; available_cents recomputed"
        note: "Funding dimension evolves independently of lock_state; a LOCKED card can still flip FUNDED<->DRAINED."
      - from: "funding_state=FUNDED"
        to: "funding_state=DRAINED"
        trigger: "system: linked SPEND Jar.balance_cents becomes 0"
        actor: system
        preconditions:
          - "SPEND Jar.balance_cents == 0"
        side_effects:
          - "sets funding_state=DRAINED"

  # ---- 4. Transaction — branching fork-join (PENDING -> {SETTLED, REVERSED, DECLINED}) ----
  - entity: Transaction
    field: status
    initial_state: PENDING
    terminal_states: [SETTLED, DECLINED, REVERSED]
    transitions:
      - from: "(none)"
        to: PENDING
        trigger: "POST /debit-cards/{id}/authorizations"
        actor: Child | system
        preconditions:
          - "DebitCard.lock_state == UNLOCKED (cross-entity: this card)"
          - "Family.status == ACTIVE (cross-entity)"
          - "no active BLOCK CardControl matches merchant_id/category"
          - "for each active LIMIT CardControl that matches: matched cumulative (SETTLED+PENDING) + amount_cents <= per_period_cap_cents"
          - "DebitCard.available_cents >= amount_cents"
        side_effects:
          - "creates Transaction PENDING; places a hold (DebitCard.held_cents += amount_cents); available_cents recomputed"
          - "emits SpendAlert LARGE_SPEND if amount_cents >= Family large_spend_threshold_cents"
          - "emits SpendAlert LOW_BALANCE if post-hold available_cents < Family low_balance_threshold_cents"
          - "increments DebitCard.version by 1"
        note: "Authorization is the spend path; declines surface as ERR_* not a DECLINED row unless force-recorded."
      - from: PENDING
        to: SETTLED
        trigger: "POST /transactions/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "Transaction.status == PENDING"
          - "0 < settled_amount_cents <= amount_cents"
        side_effects:
          - "CASCADE step 1: releases the hold (DebitCard.held_cents -= amount_cents)"
          - "CASCADE step 2: debits SPEND Jar.balance_cents by settled_amount_cents (final settle variant)"
          - "CASCADE step 3: SPEND jar balance change recomputes DebitCard.funding_state and available_cents; may flip FUNDED->DRAINED"
          - "increments DebitCard.version by 1"
        note: "Settle cascade depth 3: settle -> jar debit -> card funding recompute. Conserved quantity: held+settled accounting (see calc reversal_conservation)."
      - from: PENDING
        to: REVERSED
        trigger: "POST /transactions/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "Transaction.status == PENDING"
        side_effects:
          - "releases the hold (DebitCard.held_cents -= amount_cents); SPEND jar balance unchanged"
          - "recomputes DebitCard.funding_state and available_cents"
          - "increments DebitCard.version by 1"
        note: "Compensation: reverse of an authorization must leave SPEND Jar.balance_cents exactly as it was before the authorization (no drift)."
      - from: PENDING
        to: DECLINED
        trigger: "POST /debit-cards/{id}/authorizations (recorded decline)"
        actor: system
        preconditions:
          - "an authorization precondition failed AND record_decline flag true"
        side_effects:
          - "creates Transaction DECLINED with no hold; no jar movement"

  # ---- 5. AllowanceSchedule — linear with pause/resume cycle + scheduled run ----
  - entity: AllowanceSchedule
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /allowance-schedules/{id}/pause"
        actor: Parent
        preconditions:
          - "AllowanceSchedule.status == ACTIVE"
        side_effects: ["paused schedules are skipped by the run sweep"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /allowance-schedules/{id}/resume"
        actor: Parent
        preconditions:
          - "AllowanceSchedule.status == PAUSED"
        side_effects: ["next_run_at unchanged; eligible again for the run sweep"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /_scheduler/run-due-allowances (system sweep)"
        actor: PlatformAdmin
        preconditions:
          - "AllowanceSchedule.status == ACTIVE"
          - "clock_now >= AllowanceSchedule.next_run_at"
          - "Family.status == ACTIVE (cross-entity)"
        side_effects:
          - "creates AllowanceRun; if Family.funding_balance_cents >= amount_cents: debits funding, credits payout jar, outcome=EXECUTED; else outcome=SKIPPED_INSUFFICIENT_FUNDS"
          - "advances next_run_at by cadence_days regardless of outcome"
          - "if payout jar is SPEND and outcome EXECUTED, recomputes DebitCard funding_state/available_cents"
        note: "Self-loop on ACTIVE driven by logical clock; scheduled/deferred action."
      - from: ACTIVE
        to: CANCELLED
        trigger: "DELETE /allowance-schedules/{id}"
        actor: Parent
        preconditions:
          - "AllowanceSchedule.status IN {ACTIVE, PAUSED}"
        side_effects: ["no further runs"]

  # ---- 6. InvestmentAccount — guarded enable + close ----
  - entity: InvestmentAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: "(none)"
        to: ACTIVE
        trigger: "POST /child-accounts/{id}/investment-account"
        actor: Parent
        preconditions:
          - "ChildAccount.is_teen == true (cross-entity guard: child >= 13 years at clock_now)"
          - "ChildAccount.status == ACTIVE"
          - "no existing InvestmentAccount for this child"
        side_effects: ["creates InvestmentAccount ACTIVE with cash_cents=0, empty holdings"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /investment-accounts/{id}/close"
        actor: Parent
        preconditions:
          - "InvestmentAccount.status == ACTIVE"
          - "all holdings empty (every symbol shares_milli == 0)"
        side_effects:
          - "sweeps remaining cash_cents back to the child's SAVE Jar.balance_cents"
          - "recomputes nothing on the card (SAVE jar does not fund the card)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lock-stale-card-version
    parent_entity: DebitCard
    write_endpoint: "POST /debit-cards/{id}/lock"
    occ_field: "expected_debit_card_version"
    description: |
      Locking a DebitCard whose version has advanced since the client last
      observed it is rejected. This captures the case where an authorization
      already placed a hold on the card (advancing its version and held_cents)
      after the client read the card, so the client's "lock at version N" view
      is stale and the lock must be re-issued against the current version.
    error_id: ERR_STALE_CARD_VERSION
    http_status: 412

  - rule_id: control-create-stale-card-version
    parent_entity: DebitCard
    write_endpoint: "POST /debit-cards/{id}/controls"
    occ_field: "expected_debit_card_version"
    description: |
      Creating a CardControl against a DebitCard whose version has advanced
      since the client last observed it is rejected. A control added on a stale
      card view could miss authorizations that already advanced the card's
      version; the writer must re-read and re-issue against the current version.
    error_id: ERR_STALE_CARD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- A. Interest match — DUAL VARIANT on InterestMatchConfig/Jar domain ----
  - name: interest_match_accrual
    trigger: "POST /interest-match-configs/{id}/accrue"
    algorithm: tiered_pricing
    formula: |
      base = SAVE Jar.balance_cents          # WHOLE_PERIOD variant
      raw_interest_cents = round_half_up(base * annual_rate_bps * period_days / (10000 * 365))
      matched_cents = raw_interest_cents
      if monthly_cap_cents > 0:
        matched_cents = min(matched_cents, monthly_cap_cents)
      # credit matched_cents to SAVE Jar.balance_cents and to Family funding debit
    input_set: "SAVE jar of the config's child; balance read per accrual_method variant"
    constants:
      DAYS_PER_YEAR: 365
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up at the single division"
    variants:
      - name: whole_period
        when: "accrual_method == WHOLE_PERIOD"
        difference: "base = SAVE Jar.balance_cents observed at accrual time (period-end snapshot)"
      - name: daily_average
        when: "accrual_method == DAILY_AVERAGE"
        difference: "base = time-weighted average SAVE jar balance over period_days, supplied as avg_balance_cents in the accrue payload; produces a different matched_cents for identical end balance when the jar grew mid-period"

  # ---- B. Authorization hold vs final settle — DUAL VARIANT on Transaction/Jar domain ----
  - name: spend_authorization_amount
    trigger: "POST /debit-cards/{id}/authorizations"
    algorithm: aggregation
    formula: |
      # provisional/hold variant
      hold_cents = amount_cents
      new_held = DebitCard.held_cents + hold_cents
      available_after = SPEND Jar.balance_cents - new_held
      require available_after >= 0
    input_set: "current SPEND jar balance and sum of PENDING holds on the card"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_hold
        when: "at authorization time"
        difference: "reserves full amount_cents as a hold; SPEND jar balance is NOT yet debited; available_cents drops by amount_cents"
      - name: final_settle
        when: "at settle time"
        difference: "releases the full hold (amount_cents) and debits SPEND jar by settled_amount_cents which may be < amount_cents; net effect on available_cents differs from the provisional reservation by (amount_cents - settled_amount_cents)"

  # ---- C. CardControl LIMIT cumulative cap — combinatorial mode (a): >=3 inputs, conditional branches ----
  - name: card_control_limit_check
    trigger: "POST /debit-cards/{id}/authorizations"
    algorithm: aggregation
    formula: |
      for each active CardControl c on the card where c.rule == LIMIT and c matches the txn:
        # match: STORE -> c.match_value == merchant_id ; CATEGORY -> c.match_value == category
        matched_so_far = sum(t.amount_cents for t in Transactions on this card
                             where t.status IN {PENDING, SETTLED}
                             and ( (c.control_kind==STORE  and t.merchant_id == c.match_value)
                                or (c.control_kind==CATEGORY and t.category    == c.match_value) ))
        if matched_so_far + amount_cents > c.per_period_cap_cents:
          reject ERR_CONTROL_LIMIT_EXCEEDED
    input_set: "all PENDING+SETTLED transactions on the card matching the control's dimension"
    constants: {}
    precision: "integer cents"
    variants:
      - name: store_dimension
        when: "control_kind == STORE"
        difference: "matches on merchant_id equality"
      - name: category_dimension
        when: "control_kind == CATEGORY"
        difference: "matches on category equality; a single txn can be counted under both a STORE limit and a CATEGORY limit independently"

  # ---- D. Investment order notional + cash settlement — combinatorial mode (b): rounding order pinned ----
  - name: investment_order_settlement
    trigger: "POST /investment-accounts/{id}/orders"
    algorithm: tiered_pricing
    formula: |
      # Rounding ORDER pinned: compute per-order gross with a single round, never per-share then sum.
      gross_cents = round_half_up(shares_milli * price_cents_per_share / 1000)
      if side == BUY:
        require InvestmentAccount.cash_cents >= gross_cents   # ERR_INSUFFICIENT_INVEST_CASH
        cash_cents -= gross_cents
        holdings[symbol].shares_milli += shares_milli
      else: # SELL
        require holdings[symbol].shares_milli >= shares_milli # ERR_INSUFFICIENT_SHARES
        holdings[symbol].shares_milli -= shares_milli
        cash_cents += gross_cents
    input_set: "the single order; the account's cash_cents and holdings"
    constants:
      MILLI_PER_SHARE: 1000
    precision: "integer cents, round_half_up; round once over the whole order (shares_milli*price/1000), NOT per share"
    variants:
      - name: buy_side
        when: "side == BUY"
        difference: "cash decreases by gross_cents, shares increase"
      - name: sell_side
        when: "side == SELL"
        difference: "shares decrease, cash increases by gross_cents"

  # ---- E. Reversal conservation — compensating invariant on SPEND jar ----
  - name: reversal_conservation
    trigger: "POST /transactions/{id}/reverse"
    algorithm: aggregation
    formula: |
      # invariant pinned over fields:
      SPEND_jar_balance_after_reverse == SPEND_jar_balance_before_authorization
      DebitCard.held_cents_after_reverse == DebitCard.held_cents_before_authorization
      # i.e. authorize(+hold) then reverse(-hold) leaves both quantities identical
    input_set: "the reversed Transaction and its card's SPEND jar"
    constants: {}
    precision: "integer cents (exact, no rounding)"

  # ---- G. Temporal window overlap — two different interval semantics on two resources ----
  - name: temporal_window_overlap
    trigger: "POST /interest-match-configs/{id}/accrue AND POST /child-accounts/{id}/allowance-schedules"
    algorithm: interval_merge
    formula: |
      # ACCRUAL window (half-open, single resource = InterestMatchConfig):
      new_window = ( clock_now - period_days*DAY_SECONDS , clock_now ]   # open start, closed end
      latest_prior = accrual on this config with max accrued_at (tie-break: max created_at)
      if latest_prior exists and (clock_now - period_days*DAY_SECONDS) < latest_prior.accrued_at:
        reject ERR_ACCRUAL_PERIOD_OVERLAP   # back-dating into an already-covered period
      # adjacency allowed: new start == latest_prior.accrued_at passes (strict < only)

      # SCHEDULE window (closed buffer, single resource = ChildAccount, grouped by payout_jar_type):
      for each existing ACTIVE AllowanceSchedule s on the same child with s.payout_jar_type == new.payout_jar_type:
        if abs(new.next_run_at - s.next_run_at) < MIN_SCHEDULE_GAP_DAYS*DAY_SECONDS:
          reject ERR_SCHEDULE_WINDOW_CONFLICT   # buffer collision (closed: exactly MIN_SCHEDULE_GAP_DAYS apart passes)
    input_set: "prior InterestAccruals of one config; ACTIVE AllowanceSchedules of one child filtered to the same payout_jar_type"
    constants:
      DAY_SECONDS: 86400
      MIN_SCHEDULE_GAP_DAYS: 7
    precision: "whole seconds on the logical clock"
    variants:
      - name: accrual_half_open
        when: "accrue endpoint"
        difference: "half-open interval (open start / closed end); adjacency at the start boundary (new start == prior end) is allowed via strict < comparison"
      - name: schedule_closed_buffer
        when: "schedule create endpoint"
        difference: "closed buffer of MIN_SCHEDULE_GAP_DAYS around each existing next_run_at; exactly MIN_SCHEDULE_GAP_DAYS apart passes (strict < on the absolute gap), tighter spacing rejected"

  # ---- F. Funding-wallet conservation across allowance run — compensating/aggregate invariant ----
  - name: allowance_funding_conservation
    trigger: "POST /_scheduler/run-due-allowances"
    algorithm: aggregation
    formula: |
      # invariant pinned over fields for an EXECUTED run:
      Family.funding_balance_cents_after + sum(child SPEND/SAVE/GIVE Jar.balance_cents)_after
        == Family.funding_balance_cents_before + sum(child Jar.balance_cents)_before
      # money is conserved between the family wallet and the jars; a run only moves it, never creates it
    input_set: "the family funding wallet and all jars of children whose schedules ran"
    constants: {}
    precision: "integer cents (exact)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /families register" }
  - { priority: 2,  category: auth,                 check: "acting role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth,                 check: "acting Parent owns the Family of the target resource; acting Child is the ChildAccount of the target resource", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 4,  category: existence,            check: "referenced resources exist, validated left-to-right in path", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all /{id} paths" }
  - { priority: 5,  category: business_constraint,  check: "request body well-formed: required fields present, recognized enum members, correct JSON types", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 6,  category: business_constraint,  check: "semantic field bounds on a well-formed body: amount_cents/reward_cents/shares_milli/price_cents_per_share > 0; cadence_days >= 1; annual_rate_bps >= 0; monthly_cap_cents >= 0", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all writes with numeric fields" }
  - { priority: 7,  category: state,                check: "OCC: expected_debit_card_version equals current DebitCard.version on lock/unlock/controls", error_id: ERR_STALE_CARD_VERSION, http_status: 412, applies_to: "POST /debit-cards/{id}/lock, /unlock, /controls" }
  - { priority: 8,  category: state,                check: "target resource in a state that permits this transition (see §1.2 from/preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state transitions" }
  - { priority: 9,  category: state,                check: "investing add-on not already enabled for this child", error_id: ERR_DUPLICATE_INVEST_ACCOUNT, http_status: 409, applies_to: "POST /child-accounts/{id}/investment-account" }
  - { priority: 10, category: state,                check: "InvestmentAccount.status == ACTIVE (not CLOSED) before placing an order", error_id: ERR_ACCOUNT_CLOSED, http_status: 409, applies_to: "POST /investment-accounts/{id}/orders" }
  - { priority: 11, category: state,                check: "InterestMatchConfig.status == ENABLED before accruing", error_id: ERR_INTEREST_DISABLED, http_status: 409, applies_to: "POST /interest-match-configs/{id}/accrue" }
  - { priority: 12, category: business_referential, check: "Family.status == ACTIVE for any money movement (chore approve, allowance run, interest accrue, authorization)", error_id: ERR_FAMILY_SUSPENDED, http_status: 409, applies_to: "money-movement endpoints" }
  - { priority: 13, category: business_referential, check: "ChildAccount.status == ACTIVE for earn/spend/accrue; ARCHIVED child rejected", error_id: ERR_CHILD_ARCHIVED, http_status: 409, applies_to: "child money-movement endpoints" }
  - { priority: 14, category: business_safety,      check: "DebitCard.lock_state == UNLOCKED before any authorization", error_id: ERR_CARD_LOCKED, http_status: 409, applies_to: "POST /debit-cards/{id}/authorizations" }
  - { priority: 15, category: business_safety,      check: "no active BLOCK CardControl matches the authorization's merchant_id (STORE) or category (CATEGORY)", error_id: ERR_CONTROL_BLOCKED, http_status: 409, applies_to: "POST /debit-cards/{id}/authorizations" }
  - { priority: 16, category: business_constraint,  check: "for each active LIMIT CardControl that matches, matched PENDING+SETTLED + amount_cents <= per_period_cap_cents", error_id: ERR_CONTROL_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /debit-cards/{id}/authorizations" }
  - { priority: 17, category: business_temporal,    check: "ChildAccount.is_teen (>= 13 years at clock_now) before enabling investing add-on", error_id: ERR_NOT_TEEN_ELIGIBLE, http_status: 409, applies_to: "POST /child-accounts/{id}/investment-account" }
  - { priority: 18, category: business_temporal,    check: "new ACTIVE allowance schedule's next_run_at must be >= MIN_SCHEDULE_GAP_DAYS (closed buffer) from every existing ACTIVE schedule's next_run_at for the same child + payout_jar_type", error_id: ERR_SCHEDULE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /child-accounts/{id}/allowance-schedules" }
  - { priority: 19, category: business_temporal,    check: "new accrual's half-open window (clock_now - period_days, clock_now] must not back-cover the latest prior accrual's window: require clock_now - period_days >= latest_prior.accrued_at (adjacency at the boundary is allowed)", error_id: ERR_ACCRUAL_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /interest-match-configs/{id}/accrue" }
  - { priority: 20, category: business_constraint,  check: "InvestmentAccount has enough cash_cents for a BUY", error_id: ERR_INSUFFICIENT_INVEST_CASH, http_status: 409, applies_to: "POST /investment-accounts/{id}/orders (BUY)" }
  - { priority: 21, category: business_constraint,  check: "InvestmentAccount holds enough shares_milli for a SELL", error_id: ERR_INSUFFICIENT_SHARES, http_status: 409, applies_to: "POST /investment-accounts/{id}/orders (SELL)" }
  - { priority: 22, category: business_fiscal,      check: "Family.funding_balance_cents >= reward/transfer/interest amount before debiting the funding wallet (chore approve, fund-jar, interest accrue)", error_id: ERR_INSUFFICIENT_FUNDING, http_status: 409, applies_to: "POST /chore-completions/{id}/approve, POST /child-accounts/{id}/fund-jar, POST /interest-match-configs/{id}/accrue" }
  - { priority: 23, category: business_fiscal,      check: "DebitCard.available_cents >= amount_cents at authorization (after holds)", error_id: ERR_INSUFFICIENT_CARD_FUNDS, http_status: 409, applies_to: "POST /debit-cards/{id}/authorizations" }
  - { priority: 24, category: business_constraint,  check: "settle amount in range: 0 < settled_amount_cents <= Transaction.amount_cents", error_id: ERR_INVALID_SETTLE_AMOUNT, http_status: 422, applies_to: "POST /transactions/{id}/settle" }
  - { priority: 25, category: business_constraint,  check: "InvestmentAccount has no non-empty holdings before close", error_id: ERR_HOLDINGS_NOT_EMPTY, http_status: 409, applies_to: "POST /investment-accounts/{id}/close" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Family ----
  - { method: POST,  path: "/families",                                  description: "Register a family (parent's first call; mints primary_parent_id from X-User-ID)", roles: [Parent], code: 201, input: [family_name], output: Family, side_effects: ["sets primary_parent_id = X-User-ID", "funding_balance_cents=0", "status=ACTIVE"] }
  - { method: GET,   path: "/families/{id}",                             description: "Read a family", roles: [Parent, PlatformAdmin], code: 200, input: [], output: Family, side_effects: [] }
  - { method: POST,  path: "/families/{id}/deposit",                     description: "Parent deposits external money into the family funding wallet", roles: [Parent], code: 200, input: [amount_cents], output: Family, side_effects: ["credits funding_balance_cents by amount_cents"] }
  - { method: POST,  path: "/families/{id}/alert-thresholds",            description: "Configure large_spend and low_balance alert thresholds for the family", roles: [Parent], code: 200, input: [large_spend_threshold_cents, low_balance_threshold_cents], output: Family, side_effects: ["stores thresholds used by SpendAlert emission"] }
  - { method: POST,  path: "/families/{id}/suspend",                     description: "Suspend a family (freezes all child money movement)", roles: [Parent, PlatformAdmin], code: 200, input: [], output: Family, side_effects: ["status=SUSPENDED"] }
  - { method: POST,  path: "/families/{id}/reactivate",                  description: "Reactivate a suspended family", roles: [Parent, PlatformAdmin], code: 200, input: [], output: Family, side_effects: ["status=ACTIVE"] }

  # ---- ChildAccount ----
  - { method: POST,  path: "/families/{id}/child-accounts",             description: "Create a child sub-account; auto-creates SPEND/SAVE/GIVE jars, one DebitCard, one InterestMatchConfig", roles: [Parent], code: 201, input: [display_name, birthdate], output: ChildAccount, side_effects: ["creates 3 Jars", "creates DebitCard (UNLOCKED/DRAINED)", "creates InterestMatchConfig (DISABLED until configured)"] }
  - { method: GET,   path: "/families/{id}/child-accounts",             description: "List children of a family (reverse-reachability for ChildAccount.family_id)", roles: [Parent, PlatformAdmin], code: 200, input: ["status?"], output: "ChildAccount[]", side_effects: [] }
  - { method: GET,   path: "/child-accounts/{id}",                      description: "Read a child account (computes is_teen at clock_now)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: ChildAccount, side_effects: [] }
  - { method: POST,  path: "/child-accounts/{id}/archive",             description: "Archive a child account", roles: [Parent], code: 200, input: [], output: ChildAccount, side_effects: ["status=ARCHIVED"] }
  - { method: POST,  path: "/child-accounts/{id}/fund-jar",            description: "Parent moves money from funding wallet into one of the child's jars", roles: [Parent], code: 200, input: [jar_type, amount_cents], output: Jar, side_effects: ["debits Family.funding_balance_cents", "credits target Jar.balance_cents", "if SPEND jar, recomputes DebitCard funding_state/available_cents"] }

  # ---- Jar ----
  - { method: GET,   path: "/child-accounts/{id}/jars",                 description: "List the child's jars (reverse-reachability for Jar.child_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: ["jar_type?"], output: "Jar[]", side_effects: [] }
  - { method: GET,   path: "/jars/{id}",                                description: "Read a jar", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: Jar, side_effects: [] }

  # ---- Chore + ChoreCompletion ----
  - { method: POST,  path: "/child-accounts/{id}/chores",              description: "Parent creates a chore for the child", roles: [Parent], code: 201, input: [title, reward_cents, "payout_jar_type?", "is_recurring?"], output: Chore, side_effects: ["status=AVAILABLE"] }
  - { method: GET,   path: "/child-accounts/{id}/chores",             description: "List chores for a child (reverse-reachability for Chore.child_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: ["status?"], output: "Chore[]", side_effects: [] }
  - { method: GET,   path: "/chores/{id}",                              description: "Read a chore", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: Chore, side_effects: [] }
  - { method: POST,  path: "/chores/{id}/submit",                       description: "Child submits a chore as done; creates a ChoreCompletion", roles: [Child], code: 201, input: [], output: ChoreCompletion, side_effects: ["Chore AVAILABLE->SUBMITTED", "creates ChoreCompletion PENDING_REVIEW with reward/payout snapshots"] }
  - { method: POST,  path: "/chores/{id}/reopen",                       description: "Parent reopens a REJECTED chore", roles: [Parent], code: 200, input: [], output: Chore, side_effects: ["Chore REJECTED->AVAILABLE"] }
  - { method: DELETE, path: "/chores/{id}",                             description: "Soft-archive a chore", roles: [Parent], code: 200, input: [], output: Chore, side_effects: ["status=ARCHIVED"] }
  - { method: GET,   path: "/chores/{id}/completions",                  description: "List completions for a chore (reverse-reachability for ChoreCompletion.chore_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: "ChoreCompletion[]", side_effects: [] }
  - { method: GET,   path: "/chore-completions/{id}",                   description: "Read a chore completion", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: ChoreCompletion, side_effects: [] }
  - { method: POST,  path: "/chore-completions/{id}/approve",           description: "Parent approves a completion; pays reward (cascade)", roles: [Parent], code: 200, input: [], output: ChoreCompletion, side_effects: ["debits Family.funding_balance_cents", "credits payout jar", "recomputes card if SPEND jar", "Chore -> AVAILABLE/ARCHIVED", "status=PAID"] }
  - { method: POST,  path: "/chore-completions/{id}/kick-back",         description: "Parent kicks a completion back for revision", roles: [Parent], code: 200, input: [], output: ChoreCompletion, side_effects: ["status=NEEDS_REVISION"] }
  - { method: POST,  path: "/chore-completions/{id}/resubmit",          description: "Child resubmits a kicked-back completion", roles: [Child], code: 200, input: [], output: ChoreCompletion, side_effects: ["status=PENDING_REVIEW", "revision_count += 1"] }
  - { method: POST,  path: "/chore-completions/{id}/deny",              description: "Parent denies a completion (no pay)", roles: [Parent], code: 200, input: [], output: ChoreCompletion, side_effects: ["status=DENIED", "Chore -> REJECTED"] }

  # ---- DebitCard + CardControl + Transaction ----
  - { method: GET,   path: "/child-accounts/{id}/debit-cards",          description: "List the child's debit card(s) (reverse-reachability for DebitCard.child_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: "DebitCard[]", side_effects: [] }
  - { method: GET,   path: "/debit-cards/{id}",                         description: "Read a debit card (held_cents, available_cents, lock_state, funding_state)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: DebitCard, side_effects: [] }
  - { method: POST,  path: "/debit-cards/{id}/lock",                    description: "Instantly lock a card (OCC on version)", roles: [Parent, Child], code: 200, input: [expected_debit_card_version], output: DebitCard, side_effects: ["lock_state=LOCKED", "increments DebitCard.version by 1"] }
  - { method: POST,  path: "/debit-cards/{id}/unlock",                  description: "Unlock a card (Parent only; OCC on version)", roles: [Parent], code: 200, input: [expected_debit_card_version], output: DebitCard, side_effects: ["lock_state=UNLOCKED", "increments DebitCard.version by 1"] }
  - { method: POST,  path: "/debit-cards/{id}/controls",               description: "Add a STORE/CATEGORY control to a card (OCC on version)", roles: [Parent], code: 201, input: [control_kind, match_value, rule, "per_period_cap_cents?", expected_debit_card_version], output: CardControl, side_effects: ["creates CardControl is_active=true", "increments DebitCard.version by 1"] }
  - { method: GET,   path: "/debit-cards/{id}/controls",               description: "List controls on a card (reverse-reachability for CardControl.debit_card_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: ["is_active?"], output: "CardControl[]", side_effects: [] }
  - { method: DELETE, path: "/card-controls/{id}",                      description: "Soft-deactivate a card control", roles: [Parent], code: 200, input: [], output: CardControl, side_effects: ["is_active=false"] }
  - { method: POST,  path: "/debit-cards/{id}/authorizations",          description: "Authorize a card spend; places hold, runs controls, emits alerts", roles: [Child, PlatformAdmin], code: 201, input: [merchant_id, category, amount_cents, "record_decline?"], output: Transaction, side_effects: ["Transaction PENDING + hold", "DebitCard.held_cents += amount_cents", "may emit SpendAlert(s)", "increments DebitCard.version by 1"] }
  - { method: GET,   path: "/debit-cards/{id}/transactions",           description: "List transactions on a card (reverse-reachability for Transaction.debit_card_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: ["status?"], output: "Transaction[]", side_effects: [] }
  - { method: GET,   path: "/transactions/{id}",                        description: "Read a transaction", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: Transaction, side_effects: [] }
  - { method: POST,  path: "/transactions/{id}/settle",                 description: "Settle a pending authorization (cascade: release hold, debit SPEND jar)", roles: [PlatformAdmin], code: 200, input: [settled_amount_cents], output: Transaction, side_effects: ["status=SETTLED", "releases hold", "debits SPEND jar by settled_amount_cents", "recomputes card funding"] }
  - { method: POST,  path: "/transactions/{id}/reverse",               description: "Reverse a pending authorization (compensation: release hold, no jar debit)", roles: [PlatformAdmin], code: 200, input: [], output: Transaction, side_effects: ["status=REVERSED", "releases hold", "recomputes card funding"] }
  - { method: GET,   path: "/transactions/{id}/alerts",                description: "List spend alerts emitted for a transaction (reverse-reachability for SpendAlert.transaction_id)", roles: [Parent, PlatformAdmin], code: 200, input: [], output: "SpendAlert[]", side_effects: [] }

  # ---- AllowanceSchedule + AllowanceRun ----
  - { method: POST,  path: "/child-accounts/{id}/allowance-schedules",  description: "Create a scheduled allowance transfer for a child", roles: [Parent], code: 201, input: [amount_cents, "payout_jar_type?", cadence_days, next_run_at], output: AllowanceSchedule, side_effects: ["status=ACTIVE"] }
  - { method: GET,   path: "/child-accounts/{id}/allowance-schedules",  description: "List allowance schedules for a child (reverse-reachability for AllowanceSchedule.child_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: ["status?"], output: "AllowanceSchedule[]", side_effects: [] }
  - { method: GET,   path: "/allowance-schedules/{id}",                  description: "Read an allowance schedule", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: AllowanceSchedule, side_effects: [] }
  - { method: POST,  path: "/allowance-schedules/{id}/pause",           description: "Pause a schedule", roles: [Parent], code: 200, input: [], output: AllowanceSchedule, side_effects: ["status=PAUSED"] }
  - { method: POST,  path: "/allowance-schedules/{id}/resume",          description: "Resume a paused schedule", roles: [Parent], code: 200, input: [], output: AllowanceSchedule, side_effects: ["status=ACTIVE"] }
  - { method: DELETE, path: "/allowance-schedules/{id}",                description: "Cancel a schedule", roles: [Parent], code: 200, input: [], output: AllowanceSchedule, side_effects: ["status=CANCELLED"] }
  - { method: GET,   path: "/allowance-schedules/{id}/runs",            description: "List runs of a schedule (reverse-reachability for AllowanceRun.allowance_schedule_id)", roles: [Parent, PlatformAdmin], code: 200, input: [], output: "AllowanceRun[]", side_effects: [] }
  - { method: POST,  path: "/_scheduler/run-due-allowances",            description: "Test-driving sweep: execute all ACTIVE schedules whose next_run_at <= clock_now", roles: [PlatformAdmin], code: 200, input: [], output: "AllowanceRun[]", side_effects: ["creates AllowanceRun per due schedule", "EXECUTED or SKIPPED_INSUFFICIENT_FUNDS", "advances next_run_at by cadence_days"] }

  # ---- InterestMatchConfig + InterestAccrual ----
  - { method: GET,   path: "/child-accounts/{id}/interest-match-config", description: "Read the child's interest match config (reverse-reachability for InterestMatchConfig.child_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: "InterestMatchConfig[]", side_effects: [] }
  - { method: GET,   path: "/interest-match-configs/{id}",              description: "Read an interest match config", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: InterestMatchConfig, side_effects: [] }
  - { method: PUT,   path: "/interest-match-configs/{id}",              description: "Configure & enable the interest match (rate, cap, method)", roles: [Parent], code: 200, input: [annual_rate_bps, monthly_cap_cents, accrual_method], output: InterestMatchConfig, side_effects: ["status=ENABLED"] }
  - { method: POST,  path: "/interest-match-configs/{id}/accrue",       description: "Post one interest accrual to the SAVE jar (parent-paid match)", roles: [Parent, PlatformAdmin], code: 201, input: [period_days, "avg_balance_cents?"], output: InterestAccrual, side_effects: ["credits SAVE jar by matched_cents", "debits Family.funding_balance_cents by matched_cents", "creates InterestAccrual"] }
  - { method: GET,   path: "/interest-match-configs/{id}/accruals",     description: "List accruals for a config (reverse-reachability for InterestAccrual.interest_match_config_id)", roles: [Parent, PlatformAdmin], code: 200, input: [], output: "InterestAccrual[]", side_effects: [] }

  # ---- InvestmentAccount + InvestmentOrder ----
  - { method: POST,  path: "/child-accounts/{id}/investment-account",   description: "Enable teen investing add-on (guarded: is_teen)", roles: [Parent], code: 201, input: [], output: InvestmentAccount, side_effects: ["creates InvestmentAccount ACTIVE"] }
  - { method: GET,   path: "/child-accounts/{id}/investment-account",   description: "Read the child's investment account (reverse-reachability for InvestmentAccount.child_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: "InvestmentAccount[]", side_effects: [] }
  - { method: GET,   path: "/investment-accounts/{id}",                 description: "Read an investment account (cash_cents, holdings)", roles: [Parent, Child, PlatformAdmin], code: 200, input: [], output: InvestmentAccount, side_effects: [] }
  - { method: POST,  path: "/investment-accounts/{id}/fund",            description: "Move money from SAVE jar into the investing account cash", roles: [Parent], code: 200, input: [amount_cents], output: InvestmentAccount, side_effects: ["debits SAVE jar by amount_cents", "credits cash_cents"] }
  - { method: POST,  path: "/investment-accounts/{id}/orders",          description: "Place a BUY/SELL order (cash & holdings settle immediately)", roles: [Parent, Child], code: 201, input: [side, symbol, shares_milli, price_cents_per_share], output: InvestmentOrder, side_effects: ["updates cash_cents and holdings", "status=FILLED"] }
  - { method: GET,   path: "/investment-accounts/{id}/orders",          description: "List orders (reverse-reachability for InvestmentOrder.investment_account_id)", roles: [Parent, Child, PlatformAdmin], code: 200, input: ["side?"], output: "InvestmentOrder[]", side_effects: [] }
  - { method: POST,  path: "/investment-accounts/{id}/close",           description: "Close the investing account; sweep cash to SAVE jar (guard: no holdings)", roles: [Parent], code: 200, input: [], output: InvestmentAccount, side_effects: ["status=CLOSED", "cash_cents swept to SAVE jar"] }

  # ---- Test-driving clock ----
  - { method: POST,  path: "/_clock/set_current_utc",                   description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets logical clock used by is_teen, next_run_at, accrued_at, ran_at"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE,            http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER,        http: 403, condition: "Parent does not own the family, or Child is not the target child account" }
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST,           http: 400, condition: "Malformed body: missing required field, bad enum, non-positive amount where positive required" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "Target resource not in a state that permits this transition" }
  - { id: ERR_STALE_CARD_VERSION,        http: 412, condition: "expected_debit_card_version does not match current DebitCard.version (OCC)" }
  - { id: ERR_FAMILY_SUSPENDED,          http: 409, condition: "Family.status == SUSPENDED blocks money movement" }
  - { id: ERR_CHILD_ARCHIVED,            http: 409, condition: "ChildAccount.status == ARCHIVED blocks earn/spend/accrue" }
  - { id: ERR_CARD_LOCKED,               http: 409, condition: "DebitCard.lock_state == LOCKED at authorization" }
  - { id: ERR_CONTROL_BLOCKED,           http: 409, condition: "An active BLOCK CardControl matches the authorization's merchant/category" }
  - { id: ERR_CONTROL_LIMIT_EXCEEDED,    http: 409, condition: "Cumulative matching spend would exceed a LIMIT control's per_period_cap_cents" }
  - { id: ERR_NOT_TEEN_ELIGIBLE,         http: 409, condition: "Child is under 13 at clock_now when enabling investing add-on" }
  - { id: ERR_INSUFFICIENT_INVEST_CASH,  http: 409, condition: "BUY order exceeds InvestmentAccount.cash_cents" }
  - { id: ERR_INSUFFICIENT_SHARES,       http: 409, condition: "SELL order exceeds held shares_milli for the symbol" }
  - { id: ERR_INSUFFICIENT_FUNDING,      http: 409, condition: "Family.funding_balance_cents below the amount required (reward/fund/interest)" }
  - { id: ERR_INSUFFICIENT_CARD_FUNDS,   http: 409, condition: "DebitCard.available_cents below amount_cents at authorization" }
  - { id: ERR_INVALID_SETTLE_AMOUNT,     http: 422, condition: "settled_amount_cents not in (0, Transaction.amount_cents]" }
  - { id: ERR_HOLDINGS_NOT_EMPTY,        http: 409, condition: "Investment account has non-empty holdings at close" }
  - { id: ERR_ACCOUNT_CLOSED,            http: 409, condition: "Order placed on a CLOSED InvestmentAccount" }
  - { id: ERR_DUPLICATE_INVEST_ACCOUNT,  http: 409, condition: "Investing add-on already enabled for this child" }
  - { id: ERR_INTEREST_DISABLED,         http: 409, condition: "Accrue called on an InterestMatchConfig with status DISABLED" }
  - { id: ERR_ACCRUAL_PERIOD_OVERLAP,    http: 409, condition: "New accrual's half-open window (clock_now - period_days, clock_now] overlaps the latest prior accrual's window for the same config (clock_now - period_days < latest_prior.accrued_at)" }
  - { id: ERR_SCHEDULE_WINDOW_CONFLICT,  http: 409, condition: "New ACTIVE allowance schedule for the same child + payout_jar_type has next_run_at within MIN_SCHEDULE_GAP_DAYS (closed buffer) of an existing ACTIVE schedule's next_run_at" }
  - { id: ERR_VALIDATION,                http: 422, condition: "Semantically invalid but well-formed payload (e.g., cadence_days < 1, annual_rate_bps < 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Parent
    description: "Household manager. Owns Family configuration, funds wallets/jars, approves chores, sets card controls, runs interest accruals, enables investing."
    identity: "opaque"
    exclusive_operations:
      - "POST /families"
      - "POST /families/{id}/deposit"
      - "POST /families/{id}/alert-thresholds"
      - "POST /families/{id}/child-accounts"
      - "POST /child-accounts/{id}/archive"
      - "POST /child-accounts/{id}/fund-jar"
      - "POST /child-accounts/{id}/chores"
      - "POST /chores/{id}/reopen"
      - "DELETE /chores/{id}"
      - "POST /chore-completions/{id}/approve"
      - "POST /chore-completions/{id}/kick-back"
      - "POST /chore-completions/{id}/deny"
      - "POST /debit-cards/{id}/unlock"
      - "POST /debit-cards/{id}/controls"
      - "DELETE /card-controls/{id}"
      - "POST /child-accounts/{id}/allowance-schedules"
      - "POST /allowance-schedules/{id}/pause"
      - "POST /allowance-schedules/{id}/resume"
      - "DELETE /allowance-schedules/{id}"
      - "PUT /interest-match-configs/{id}"
      - "POST /interest-match-configs/{id}/accrue"
      - "POST /child-accounts/{id}/investment-account"
      - "POST /investment-accounts/{id}/fund"
      - "POST /investment-accounts/{id}/close"
    shared_operations:
      - "GET reads on owned family/children/jars/chores/cards/transactions/schedules/configs/accounts"
      - "POST /families/{id}/suspend, /reactivate (shared with PlatformAdmin)"
      - "POST /debit-cards/{id}/lock (shared with Child)"
      - "POST /investment-accounts/{id}/orders (shared with Child)"

  - name: Child
    description: "Sub-account holder. Submits/resubmits chores, spends on own card, locks own card, places investment orders. Cannot approve, fund, or set controls."
    identity: "entity_backed:ChildAccount"
    exclusive_operations:
      - "POST /chores/{id}/submit"
      - "POST /chore-completions/{id}/resubmit"
    shared_operations:
      - "GET reads on own child account/jars/chores/card/transactions/schedules/config/investing"
      - "POST /debit-cards/{id}/lock (shared with Parent)"
      - "POST /debit-cards/{id}/authorizations (shared with PlatformAdmin)"
      - "POST /investment-accounts/{id}/orders (shared with Parent)"

  - name: PlatformAdmin
    description: "Operational role. Settles/reverses card transactions, runs the allowance scheduler sweep, sets the logical clock, can post interest accruals."
    identity: "opaque"
    exclusive_operations:
      - "POST /transactions/{id}/settle"
      - "POST /transactions/{id}/reverse"
      - "POST /_scheduler/run-due-allowances"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads (all)"
      - "POST /families/{id}/suspend, /reactivate (shared with Parent)"
      - "POST /debit-cards/{id}/authorizations (shared with Child)"
      - "POST /interest-match-configs/{id}/accrue (shared with Parent)"
