scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: backfill_budget_provisional_vs_final
        grounds:
          - calculations.backfill_budget_projection
          - entities.Campaign.fields.backfill_spent_cents
          - entities.BackfillPurchase.fields.final_cost_cents
        distinguishing_aspect: |
          Entity domain = Campaign fiscal ledger. The provisional variant computes
          remaining budget against quoted_cost_cents of ORDERED purchases; the
          final variant uses final_cost_cents at mark-purchased and is the only
          one that mutates campaign.backfill_spent_cents. Identical inputs
          produce different remaining-budget numbers.
        test_recipe:
          setup:
            - "campaign C in MATCHING with backfill_budget_cents=10000"
            - "child CH in BACKFILL_ELIGIBLE with one APPROVED wish item estimated 3000"
            - "backfill purchase BP created with quoted_cost_cents=2500 (provisional optimistic estimate)"
            - "actual receipt cost turned out to be 3200 (final variant)"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 10000, privacy_mode: "STRICT" }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AG1", legal_name: "Agency One", referral_quota: 50, contact_email: "a1@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "Pat Care", caregiver_dob: "1990-01-01", household_size: 3, address_text: "1 Main St", phone_last4: "1234" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
            - call: "POST /toy-drive/families/${fam_id}/children"
              payload: { first_name: "Kid", dob: "2018-06-01", gender: "X", clothing_size: "youth M", interest_tags: ["lego"] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                child_id: "$.data.id"
            - call: "POST /toy-drive/children/${child_id}/wish-items"
              payload: { description: "Lego set", category: "TOY", estimated_price_cents: 3000, priority_rank: 1 }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                wish_id: "$.data.id"
            - call: "POST /toy-drive/families/${fam_id}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${fam_id}/verify"
              payload: { verification_note: "ok" }
              as: CaseWorker
              as_user_id: "cw_2"
            - call: "POST /toy-drive/donors"
              payload: { email: "d1@x.com", display_name: "Donor One", max_adoptions_per_season: 5, thank_you_opt_in: true }
              as: PlatformAdmin
              captures:
                donor_id: "$.data.id"
            - call: "GET /toy-drive/families/${fam_id}"
              payload: {}
              as: PlatformAdmin
              captures:
                fam_v: "$.data.version"
            - call: "POST /toy-drive/adoptions"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", family_id: "${fam_id}", scope: "WHOLE_FAMILY", expected_family_version: "${fam_v}" }
              as: Donor
              as_user_id: "${donor_id}"
              captures:
                adopt_id: "$.data.id"
            - call: "POST /toy-drive/adoptions/${adopt_id}/confirm"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /toy-drive/campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures:
                camp_v: "$.data.version"
            - call: "POST /toy-drive/campaigns/${camp_id}/close-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/advance"
              payload: { expected_campaign_version: "${camp_v}" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/backfill/select"
              payload: { limit: 10 }
              as: PlatformAdmin
              captures:
                bp_id: "$.data[0].id"
          trigger:
            - call: "POST /toy-drive/backfill-purchases/${bp_id}/mark-purchased"
              payload: { final_cost_cents: 3200 }
              as: PlatformAdmin
              as_user_id: "admin_2"
          assert:
            - "Campaign.${camp_id}.backfill_spent_cents == 3200"
            - "BackfillPurchase.${bp_id}.final_cost_cents == 3200"
            - "BackfillPurchase.${bp_id}.quoted_cost_cents == 3000 (selector snapshot) != final 3200"
            - "Child.${child_id}.status == BACKFILL_PURCHASED"

      - name: age_band_at_intake_vs_at_distribution
        grounds:
          - calculations.child_age_band
          - entities.Child.fields.age_band
        distinguishing_aspect: |
          Entity domain = Child demographic derivation. The at_intake variant
          computes age_band against the distribution_date current at Child POST;
          the at_distribution variant lazily recomputes against a PATCHed
          distribution_date. Same dob + same child, two different bands when
          distribution_date is moved across a birthday boundary.
        test_recipe:
          setup:
            - "campaign C with distribution_date=2026-12-18"
            - "child born 2016-12-20 — at intake the child is 9 years old at distribution (SCHOOL_AGE)"
            - "campaign distribution_date is then PATCHed earlier to 2026-12-15 — child is still 9 (turns 10 on 12-20)"
            - "second scenario: distribution_date PATCHed later to 2026-12-25 — child is now 10 (PRETEEN)"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0, privacy_mode: "STRICT" }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AG2", legal_name: "Agency Two", referral_quota: 50, contact_email: "a2@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "Pat", caregiver_dob: "1990-01-01", household_size: 2, address_text: "5 Oak St", phone_last4: "9999" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_id: "$.data.id"
            - call: "POST /toy-drive/families/${fam_id}/children"
              payload: { first_name: "Sam", dob: "2016-12-20", gender: "M", clothing_size: "youth L", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                child_id: "$.data.id"
                band_at_intake: "$.data.age_band"
          trigger:
            - call: "PATCH /toy-drive/campaigns/${camp_id}"
              payload: { distribution_date: "2026-12-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /toy-drive/children/${child_id}"
              payload: {}
              as: PlatformAdmin
              captures:
                band_after: "$.data.age_band"
          assert:
            - "band_at_intake == SCHOOL_AGE (9 years old on 2026-12-18)"
            - "band_after == PRETEEN (10 years old on 2026-12-25)"
            - "Child.${child_id}.age_band changed under identical dob when distribution_date moved"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: backfill_selector_weighted_score_mode_a
        grounds:
          - calculations.backfill_child_selector
          - entities.Child.fields.status
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction.
          score = 100*priority_weight + age_urgency + wait_days combines a
          min-over-wish-priority nested term, an age-decay term, and a
          wait-days term capped at 30, then ranks desc with a two-level
          tie-break (family.verified_at ASC, child.created_at ASC).
        test_recipe:
          setup:
            - "campaign with three BACKFILL_ELIGIBLE children:"
            - "  CH_A: family verified 2026-09-20, age 5, top wish priority_rank=1"
            - "  CH_B: family verified 2026-09-10, age 14, top wish priority_rank=1"
            - "  CH_C: family verified 2026-10-01, age 5, top wish priority_rank=3"
            - "selector called with limit=2"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 100000, privacy_mode: "STRICT" }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AG3", legal_name: "Agency Three", referral_quota: 100, contact_email: "a3@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            # Family A — verified 2026-09-20 (we'll set clock to that before verify)
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "A Care", caregiver_dob: "1985-01-01", household_size: 2, address_text: "1 A St", phone_last4: "0001" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_a: "$.data.id"
            - call: "POST /toy-drive/families/${fam_a}/children"
              payload: { first_name: "A", dob: "2021-06-01", gender: "F", clothing_size: "5T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                ch_a: "$.data.id"
            - call: "POST /toy-drive/children/${ch_a}/wish-items"
              payload: { description: "A wish", category: "TOY", estimated_price_cents: 2000, priority_rank: 1 }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
            # Family B — verified 2026-09-10
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "B Care", caregiver_dob: "1980-01-01", household_size: 2, address_text: "2 B St", phone_last4: "0002" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_b: "$.data.id"
            - call: "POST /toy-drive/families/${fam_b}/children"
              payload: { first_name: "B", dob: "2012-06-01", gender: "M", clothing_size: "youth XL", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                ch_b: "$.data.id"
            - call: "POST /toy-drive/children/${ch_b}/wish-items"
              payload: { description: "B wish", category: "TOY", estimated_price_cents: 2000, priority_rank: 1 }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
            # Family C — verified 2026-10-01
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "C Care", caregiver_dob: "1992-01-01", household_size: 2, address_text: "3 C St", phone_last4: "0003" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                fam_c: "$.data.id"
            - call: "POST /toy-drive/families/${fam_c}/children"
              payload: { first_name: "C", dob: "2021-06-01", gender: "F", clothing_size: "5T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                ch_c: "$.data.id"
            - call: "POST /toy-drive/children/${ch_c}/wish-items"
              payload: { description: "C wish", category: "TOY", estimated_price_cents: 2000, priority_rank: 3 }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
            # Verify B first (earliest)
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/families/${fam_b}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${fam_b}/verify"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_2"
            # Verify A on 2026-09-20
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/families/${fam_a}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${fam_a}/verify"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_2"
            # Verify C on 2026-10-01
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/families/${fam_c}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${fam_c}/verify"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_2"
            # Adopt all three with donors who then abandon (let expire by advancing clock past return deadline)
            - call: "POST /toy-drive/donors"
              payload: { email: "dx@x.com", display_name: "D", max_adoptions_per_season: 10, thank_you_opt_in: false }
              as: PlatformAdmin
              captures:
                donor_id: "$.data.id"
            - call: "GET /toy-drive/families/${fam_a}"
              payload: {}
              as: PlatformAdmin
              captures:
                fam_a_v: "$.data.version"
            - call: "POST /toy-drive/adoptions"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", family_id: "${fam_a}", scope: "WHOLE_FAMILY", expected_family_version: "${fam_a_v}" }
              as: Donor
              as_user_id: "${donor_id}"
              captures:
                ad_a: "$.data.id"
            - call: "POST /toy-drive/adoptions/${ad_a}/confirm"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /toy-drive/families/${fam_b}"
              payload: {}
              as: PlatformAdmin
              captures:
                fam_b_v: "$.data.version"
            - call: "POST /toy-drive/adoptions"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", family_id: "${fam_b}", scope: "WHOLE_FAMILY", expected_family_version: "${fam_b_v}" }
              as: Donor
              as_user_id: "${donor_id}"
              captures:
                ad_b: "$.data.id"
            - call: "POST /toy-drive/adoptions/${ad_b}/confirm"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /toy-drive/families/${fam_c}"
              payload: {}
              as: PlatformAdmin
              captures:
                fam_c_v: "$.data.version"
            - call: "POST /toy-drive/adoptions"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", family_id: "${fam_c}", scope: "WHOLE_FAMILY", expected_family_version: "${fam_c_v}" }
              as: Donor
              as_user_id: "${donor_id}"
              captures:
                ad_c: "$.data.id"
            - call: "POST /toy-drive/adoptions/${ad_c}/confirm"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
            # Advance past return deadline; expire all adoptions -> children BACKFILL_ELIGIBLE
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/close-intake"
              payload: {}
              as: PlatformAdmin
            - call: "GET /toy-drive/campaigns/${camp_id}"
              payload: {}
              as: PlatformAdmin
              captures:
                camp_v: "$.data.version"
            - call: "POST /toy-drive/campaigns/${camp_id}/advance"
              payload: { expected_campaign_version: "${camp_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-drive/campaigns/${camp_id}/backfill/select"
              payload: { limit: 2 }
              as: PlatformAdmin
              captures:
                first_bp_child: "$.data[0].child_id"
                second_bp_child: "$.data[1].child_id"
          assert:
            - "selector picked exactly 2 BackfillPurchase rows"
            - "first_bp_child == ${ch_b} (highest score: rank-1 priority, wait_days capped at 30 dominates age penalty)"
            - "second_bp_child == ${ch_a} (rank-1 priority, age 5, wait 11 days)"
            - "CH_C not selected (lower priority_rank 3 reduces priority_weight below CH_A/CH_B)"

      - name: slot_overlap_interval_semantics_mode_b
        grounds:
          - calculations.distribution_slot_overlap
          - validations[priority=19]
          - validations[priority=20]
        distinguishing_aspect: |
          Mode (b) — nested boundary semantics where evaluation order matters.
          The family-axis check uses half-open [start,end) overlap where
          adjacency (new.start == existing.end) is PERMITTED; the lane-bucket
          check then aggregates slots per 30-minute bucket aligned to :00/:30
          UTC and rejects when count would exceed LANE_BUCKET_CAPACITY=4.
          The two checks run in a pinned order and produce different errors.
        test_recipe:
          setup:
            - "event EV 2026-12-18 09:00-17:00, capacity 100"
            - "family F1 with existing slot 10:00-11:00 lane A"
            - "attempt to book F1 again at exactly 11:00-12:00 (adjacent — must SUCCEED)"
            - "attempt to book F1 at 10:30-11:30 (overlapping — must fail ERR_SLOT_OVERLAP)"
            - "families F2..F6 each book lane A slots inside the 10:00-10:30 bucket; the 5th attempt fails ERR_LANE_CAPACITY_EXCEEDED"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0, privacy_mode: "STRICT" }
              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/agencies"
              payload: { agency_code: "AG4", legal_name: "Agency Four", referral_quota: 100, contact_email: "a4@x.org" }
              as: PlatformAdmin
              captures:
                ag_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            # Create and verify F1..F5 in one loop-like sequence (unrolled)
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "F1", caregiver_dob: "1990-01-01", household_size: 2, address_text: "1 F1", phone_last4: "1001" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                f1: "$.data.id"
            - call: "POST /toy-drive/families/${f1}/children"
              payload: { first_name: "k1", dob: "2020-01-01", gender: "X", clothing_size: "5T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
            - call: "POST /toy-drive/families/${f1}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${f1}/verify"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_2"
            - call: "POST /toy-drive/families"
              payload: { agency_id: "${ag_id}", campaign_id: "${camp_id}", primary_caregiver_name: "F2", caregiver_dob: "1990-01-02", household_size: 2, address_text: "1 F2", phone_last4: "1002" }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
              captures:
                f2: "$.data.id"
            - call: "POST /toy-drive/families/${f2}/children"
              payload: { first_name: "k2", dob: "2020-01-01", gender: "X", clothing_size: "5T", interest_tags: [] }
              as: AgencyCoordinator
              as_user_id: "${ag_id}"
            - call: "POST /toy-drive/families/${f2}/begin-review"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /toy-drive/families/${f2}/verify"
              payload: {}
              as: CaseWorker
