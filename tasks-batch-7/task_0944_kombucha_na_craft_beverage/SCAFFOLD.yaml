    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shipments/{id}/lines"
    description: "Lines on this shipment"
    roles: [SalesRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["line_status?", "limit?", "offset?"]
    output: "ShipmentLine[]"
    side_effects: []

  # ------------------------------------------------------------ Subscription
