            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cmx_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-O", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cmx_id}" }
