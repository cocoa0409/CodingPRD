# =============================================================================
# task_2397 — Tax Amnesty & Voluntary Disclosure Administration
# Seed tables §1.0–§1.7. Difficulty band: beyond Expert.
# =============================================================================

scenario: |
  2397. Tax Amnesty & Voluntary Disclosure Administration (state department of revenue): program design with eligible tax types, periods and penalty or interest waiver terms, taxpayer eligibility screening excluding those under audit or criminal investigation, anonymous pre-clearance for voluntary disclosure with representative-mediated negotiation, lookback period limitation and agreement drafting with prospective compliance commitments, return filing, payment and installment options within the program window, post-program enforcement escalation with increased penalties for non-participants, program revenue tracking against forecast and compliance behavior analysis, agreement breach remedies and reinstatement of waived amounts

domain_name: tax-amnesty-voluntary-disclosure
api_prefix: /amnesty

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by explicit foreign keys. Only four short sub-resource
  # segments exist (program terms, pre-clearance rounds, agreement children,
  # plan installments) and they exist purely as FK reverse-reachability reads;
  # every mutation addresses a top-level collection with FKs in the body.

  state_machine_shape: cyclic
  # PreClearanceRequest cycles TERMS_OFFERED -> COUNTERED -> TERMS_OFFERED for up
  # to three representative counters; VoluntaryDisclosureAgreement carries two
  # independent dimensions (status x payment_status) and cycles
  # EXECUTED -> BREACHED -> EXECUTED via rescission; PaymentPlan forks
  # PROPOSED -> {ACTIVE, REJECTED, SUPERSEDED}.

  relationship_patterns:
    - one_to_many
    - self_referential      # VoluntaryDisclosureAgreement.amends_agreement_id
    - cross_aggregate       # EnforcementCase gates VoluntaryDisclosureAgreement drafting
    - polymorphic_scope     # EnforcementAction may or may not reference an agreement

  role_model: segregation_of_duties
  # The DisclosureOfficer who drafts an agreement may not execute it; the
  # ComplianceAuditor who drafts an EnforcementAction may not issue it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AmnestyProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program title" }
      - { name: window_open_at, type: datetime, source: input, description: "First instant participation is accepted (ISO 8601 UTC)" }
      - { name: window_close_at, type: datetime, source: input, description: "Instant participation stops; participation requires clock_now < window_close_at (strict)" }
      - { name: lookback_months, type: integer, source: input, description: "Maximum lookback depth in months measured back from window_open_at", constraints: "1..120" }
      - { name: base_penalty_waiver_pct, type: number, source: input, description: "Default penalty waiver fraction before haircut", constraints: "0.00..1.00" }
      - { name: base_interest_waiver_pct, type: number, source: input, description: "Default interest waiver fraction before haircut", constraints: "0.00..1.00" }
      - { name: post_program_penalty_multiplier, type: number, source: input, description: "Multiplier applied to post-program enforcement penalties of non-participants", constraints: "1.00..3.00" }
      - { name: prospective_compliance_months, type: integer, source: input, default: 36, description: "Default prospective compliance commitment length copied onto agreements", constraints: "12..120" }
      - { name: revenue_forecast_cents, type: integer, source: input, description: "Forecast collections used by program_revenue_realization", constraints: "> 0" }
      - { name: installment_max_count, type: integer, source: input, default: 12, description: "Upper bound on PaymentPlan.installment_count", constraints: "1..24" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | CLOSED | RECONCILED" }
      - { name: closed_at, type: datetime, source: system, description: "Clock instant at which /close ran; null before that" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents with status == APPLIED across all agreements whose program_id == this program" }
      - { name: waived_total_cents, type: integer, source: computed, default: 0, description: "Sum of VoluntaryDisclosureAgreement.waived_amount_cents over agreements with status IN {EXECUTED, FULFILLED, SUPERSEDED} of this program" }
      - { name: reinstated_total_cents, type: integer, source: computed, default: 0, description: "Sum of VoluntaryDisclosureAgreement.reinstated_amount_cents over agreements with status == BREACHED of this program" }
      - { name: participant_count, type: integer, source: computed, default: 0, description: "Count of DISTINCT VoluntaryDisclosureAgreement.taxpayer_id over agreements of this program with status IN {EXECUTED, FULFILLED, BREACHED, SUPERSEDED}" }
      - { name: nonparticipant_count, type: integer, source: computed, default: 0, description: "Count of DISTINCT Taxpayer.id with nonparticipant_flag == true flagged by this program's close cascade" }
      - { name: final_realization_pct, type: number, source: computed, description: "realization_pct frozen by /reconcile; null until RECONCILED" }

  - name: ProgramTaxTypeTerm
    parent: AmnestyProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> AmnestyProgram.id; owning program, taken from the path" }
      - { name: tax_type, type: enum, source: input, description: "SALES_USE | CORPORATE_INCOME | PERSONAL_INCOME | WITHHOLDING | EXCISE_FUEL" }
      - { name: eligible_period_start, type: string, source: input, description: "Inclusive start of the eligible period window (YYYY-MM-DD)" }
      - { name: eligible_period_end, type: string, source: input, description: "EXCLUSIVE end of the eligible period window (YYYY-MM-DD); term windows are half-open [start, end)" }
      - { name: penalty_waiver_pct, type: number, source: input, description: "Per-tax-type penalty waiver override; null inherits AmnestyProgram.base_penalty_waiver_pct", constraints: "0.00..1.00 or null" }
      - { name: interest_waiver_pct, type: number, source: input, description: "Per-tax-type interest waiver override; null inherits AmnestyProgram.base_interest_waiver_pct", constraints: "0.00..1.00 or null" }
      - { name: min_liability_cents, type: integer, source: input, description: "Minimum DisclosureReturn.reported_tax_cents accepted for this tax type (>= passes)", constraints: ">= 0" }
      - { name: requires_prior_nonfiler, type: boolean, source: input, default: false, description: "When true only returns with is_nonfiler_period == true are accepted for this tax type" }

  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name" }
      - { name: taxpayer_type, type: enum, source: input, description: "INDIVIDUAL | BUSINESS" }
      - { name: tin_last4, type: string, source: input, description: "Last four digits of the taxpayer identification number", constraints: "exactly 4 digits" }
      - { name: is_registered, type: boolean, source: input, default: true, description: "Whether the taxpayer already holds a state tax account" }
      - { name: open_case_count, type: integer, source: computed, default: 0, description: "Count of EnforcementCase rows of this taxpayer with status == OPEN" }
      - { name: open_enforcement_action_count, type: integer, source: computed, default: 0, description: "Count of EnforcementAction rows of this taxpayer with status == ISSUED" }
      - { name: nonfiler_period_count, type: integer, source: computed, default: 0, description: "Count of DisclosureReturn rows with is_nonfiler_period == true and status IN {FILED, ASSESSED, SETTLED, REINSTATED} under agreements of this taxpayer" }
      - { name: nonparticipant_flag, type: boolean, source: computed, default: false, description: "Set true by the AmnestyProgram close cascade for identified taxpayers whose pre-clearance expired unexecuted" }
      - { name: escalation_tier, type: enum, source: computed, default: T0, description: "T0 | T1 | T2 — post-program enforcement tier, recomputed by taxpayer_escalation_tier_resolution" }
      - { name: compliance_behavior_score, type: integer, source: computed, default: 100, description: "HISTORICAL variant of taxpayer_compliance_behavior_score, clamped to 0..100" }

  - name: EnforcementCase
    parent: null
    common_fields: true
    fields:
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; subject of the audit or investigation" }
      - { name: case_type, type: enum, source: input, description: "FIELD_AUDIT | DESK_AUDIT | CRIMINAL_INVESTIGATION | COLLECTION" }
      - { name: tax_type, type: enum, source: input, description: "Tax type under examination; same enum as ProgramTaxTypeTerm.tax_type" }
      - { name: opened_at, type: string, source: input, description: "Date the case was opened (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | REFERRED" }
      - { name: closed_at, type: datetime, source: system, description: "Clock instant of /close; null otherwise" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceAuditor that created the case" }

  - name: Representative
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Representing firm" }
      - { name: bar_number, type: string, source: input, description: "State bar or CPA licence number" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: PreClearanceRequest
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AmnestyProgram.id; program under which pre-clearance is sought" }
      - { name: representative_id, type: string, source: system, description: "FK -> Representative.id; taken from X-User-ID of the submitting Representative" }
      - { name: disclosed_taxpayer_id, type: string, source: system, description: "FK -> Taxpayer.id; null until /disclose-identity runs" }
      - { name: tax_type, type: enum, source: input, description: "Tax type the anonymous client wants to disclose" }
      - { name: anonymous_alias, type: string, source: input, description: "Alias used while the client stays anonymous" }
      - { name: estimated_liability_cents, type: integer, source: input, description: "Representative's estimate of unpaid tax", constraints: "> 0" }
      - { name: self_reported_under_audit, type: boolean, source: input, description: "Representative's declaration that the client is already under examination" }
      - { name: earliest_unfiled_period_start, type: string, source: input, description: "Earliest unfiled period start the client admits (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | TERMS_OFFERED | COUNTERED | ACCEPTED | REJECTED | EXPIRED" }
      - { name: screening_result, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE_SELF_REPORTED_AUDIT | INELIGIBLE_CRIMINAL_INVESTIGATION | INELIGIBLE_AUDIT_IN_PROGRESS; null before /begin-review" }
      - { name: rejection_reason, type: string, source: system, description: "Free text or screening enum name recorded on REJECTED" }
      - { name: round_index, type: integer, source: system, default: 0, description: "Total NegotiationRound rows attached to this request" }
      - { name: counter_count, type: integer, source: system, default: 0, description: "Count of NegotiationRound rows with proposed_by == REPRESENTATIVE; capped by MAX_REPRESENTATIVE_COUNTERS" }
      - { name: current_offer_lookback_months, type: integer, source: computed, description: "lookback_months of the newest NegotiationRound with proposed_by == STATE; null before the first offer" }
      - { name: current_offer_penalty_waiver_pct, type: number, source: computed, description: "penalty_waiver_pct of the newest NegotiationRound with proposed_by == STATE" }
      - { name: current_offer_interest_waiver_pct, type: number, source: computed, description: "interest_waiver_pct of the newest NegotiationRound with proposed_by == STATE" }
      - { name: last_offer_officer_user_id, type: string, source: system, description: "X-User-ID of the DisclosureOfficer that posted the newest STATE offer; drives the drafting side of segregation of duties" }

  - name: NegotiationRound
    parent: PreClearanceRequest
    common_fields: false
    fields:
      - { name: pre_clearance_id, type: string, source: system, description: "FK -> PreClearanceRequest.id; owning request, taken from the path" }
      - { name: round_index, type: integer, source: system, description: "1-based position of this round in the negotiation, assigned by the server" }
      - { name: proposed_by, type: enum, source: system, description: "STATE | REPRESENTATIVE" }
      - { name: lookback_months, type: integer, source: input, description: "Lookback depth proposed in this round" }
      - { name: penalty_waiver_pct, type: number, source: input, description: "Penalty waiver fraction proposed in this round" }
      - { name: interest_waiver_pct, type: number, source: input, description: "Interest waiver fraction proposed in this round" }
      - { name: note, type: string, source: input, description: "Optional negotiation note" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the officer or representative that posted this round" }

  - name: VoluntaryDisclosureAgreement
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AmnestyProgram.id; program whose terms govern this agreement" }
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; disclosing taxpayer" }
      - { name: pre_clearance_id, type: string, source: input, description: "FK -> PreClearanceRequest.id; null for a walk-in amnesty filing, set for a negotiated voluntary disclosure" }
      - { name: amends_agreement_id, type: string, source: system, description: "FK -> VoluntaryDisclosureAgreement.id; null unless this row was produced by /amend" }
      - { name: tax_types, type: array, source: input, description: "Tax types in scope; every member must have a ProgramTaxTypeTerm on the program", constraints: "non-empty array of the tax_type enum" }
      - { name: lookback_start_date, type: string, source: input, description: "Inclusive first day of the limited lookback period (YYYY-MM-DD)" }
      - { name: lookback_end_date, type: string, source: input, description: "Inclusive last day of the limited lookback period (YYYY-MM-DD)" }
      - { name: prospective_compliance_months, type: integer, source: input, description: "Prospective compliance commitment length; defaults to AmnestyProgram.prospective_compliance_months" }
      - { name: liability_variant, type: enum, source: computed, description: "AMNESTY_STATUTORY when pre_clearance_id is null, VDA_NEGOTIATED otherwise; selects the return_statutory_liability variant" }
      - { name: status, type: enum, source: system, default: DRAFTED, description: "DRAFTED | EXECUTED | FULFILLED | BREACHED | LAPSED | SUPERSEDED" }
      - { name: payment_status, type: enum, source: computed, default: UNPAID, description: "UNPAID | PARTIAL | PAID_IN_FULL | DELINQUENT — second, independent state dimension" }
      - { name: gross_liability_cents, type: integer, source: computed, default: 0, description: "Step 2 of agreement_effective_waiver_resolution: sum of reported_tax_cents + gross_penalty_cents + gross_interest_cents over returns with status IN {FILED, ASSESSED, SETTLED}" }
      - { name: haircut_pct, type: number, source: computed, default: 0, description: "High-liability haircut selected from gross_liability_cents" }
      - { name: effective_penalty_waiver_pct, type: number, source: computed, description: "Base penalty waiver minus haircut_pct, floored at 0" }
      - { name: effective_interest_waiver_pct, type: number, source: computed, description: "Base interest waiver minus haircut_pct / 2, floored at 0" }
      - { name: waived_amount_cents, type: integer, source: computed, default: 0, description: "Sum of per-return waived_penalty_cents + waived_interest_cents, each already rounded per return" }
      - { name: reinstated_amount_cents, type: integer, source: computed, default: 0, description: "Waived amounts clawed back by /declare-breach; reset to 0 by /rescind-breach" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "Sum of DisclosureReturn.balance_due_cents over returns with status IN {FILED, ASSESSED, SETTLED, REINSTATED}" }
      - { name: paid_total_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents with status == APPLIED on this agreement" }
      - { name: unapplied_credit_cents, type: integer, source: computed, default: 0, description: "Payment cents not yet absorbed by an installment or by the down payment" }
      - { name: down_payment_applied_cents, type: integer, source: computed, default: 0, description: "Cents consumed from unapplied_credit_cents when a PaymentPlan was approved" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the drafting DisclosureOfficer" }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID of the executing DisclosureOfficer; must differ from drafted_by_user_id" }
      - { name: executed_at, type: datetime, source: system, description: "Clock instant of /execute; the VDA_NEGOTIATED interest accrual cutoff" }
      - { name: compliance_due_at, type: datetime, source: computed, description: "executed_at plus prospective_compliance_months whole months; null before execution" }
      - { name: breach_reason, type: string, source: system, description: "Reason recorded by /declare-breach; cleared by /rescind-breach" }

  - name: DisclosureReturn
    parent: VoluntaryDisclosureAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> VoluntaryDisclosureAgreement.id; owning agreement, taken from the path" }
      - { name: tax_type, type: enum, source: input, description: "Tax type of this filing; must be a member of the agreement's tax_types" }
      - { name: period_start_date, type: string, source: input, description: "Inclusive first day of the filing period (YYYY-MM-DD)" }
      - { name: period_end_date, type: string, source: input, description: "Inclusive last day of the filing period (YYYY-MM-DD); return periods are CLOSED intervals [start, end]" }
      - { name: original_due_date, type: string, source: input, description: "Statutory due date the filing missed (YYYY-MM-DD)" }
      - { name: reported_tax_cents, type: integer, source: input, description: "Tax reported for the period", constraints: "> 0" }
      - { name: is_nonfiler_period, type: boolean, source: input, default: false, description: "True when no return was ever filed for the period; adds NONFILER_SURCHARGE_RATE to the penalty rate" }
      - { name: accrual_end_date, type: string, source: computed, description: "Interest and penalty cutoff date chosen by the agreement's liability_variant" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "Whole days from original_due_date to accrual_end_date, floored at 0" }
      - { name: penalty_rate_applied, type: number, source: computed, description: "Tier rate selected from days_late plus any nonfiler surcharge" }
      - { name: gross_penalty_cents, type: integer, source: computed, default: 0, description: "Statutory penalty before waiver" }
      - { name: gross_interest_cents, type: integer, source: computed, default: 0, description: "Statutory interest before waiver" }
      - { name: waived_penalty_cents, type: integer, source: computed, default: 0, description: "Penalty forgiven under the program; zeroed by breach reinstatement" }
      - { name: waived_interest_cents, type: integer, source: computed, default: 0, description: "Interest forgiven under the program; zeroed by breach reinstatement" }
      - { name: payable_penalty_cents, type: integer, source: computed, default: 0, description: "gross_penalty_cents - waived_penalty_cents" }
      - { name: payable_interest_cents, type: integer, source: computed, default: 0, description: "gross_interest_cents - waived_interest_cents" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "reported_tax_cents + payable_penalty_cents + payable_interest_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FILED | ASSESSED | SETTLED | REINSTATED | VOIDED" }
      - { name: filed_at, type: datetime, source: system, description: "Clock instant of /file; null while DRAFT" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the DisclosureOfficer that assessed the return" }

  - name: PaymentPlan
    parent: VoluntaryDisclosureAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> VoluntaryDisclosureAgreement.id; agreement being paid" }
      - { name: plan_type, type: enum, source: input, description: "LUMP_SUM | INSTALLMENT; LUMP_SUM requires installment_count == 1" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments to generate", constraints: "1..AmnestyProgram.installment_max_count" }
      - { name: down_payment_cents, type: integer, source: input, description: "Down payment the taxpayer commits to; must be >= MIN_DOWN_PAYMENT_PCT of the agreement balance", constraints: ">= 0" }
      - { name: scheduled_total_cents, type: integer, source: computed, default: 0, description: "Sum of generated Installment.amount_cents; equals agreement balance minus down_payment_cents" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ACTIVE | REJECTED | SUPERSEDED | COMPLETED | DEFAULTED" }
      - { name: approved_at, type: datetime, source: system, description: "Clock instant of /approve; anchor for installment due dates" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded by /reject" }
      - { name: default_reason, type: string, source: system, description: "Reason recorded by /default, by the installment sweep, or the literal BREACH_CASCADE when the breach cascade defaulted the plan" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposing Taxpayer" }

  - name: Installment
    parent: PaymentPlan
    common_fields: true
    fields:
      - { name: payment_plan_id, type: string, source: system, description: "FK -> PaymentPlan.id; owning plan" }
      - { name: seq_index, type: integer, source: system, description: "1-based position in the schedule" }
      - { name: due_date, type: string, source: computed, description: "approved_at date plus 30 * seq_index days (YYYY-MM-DD)" }
      - { name: amount_cents, type: integer, source: computed, description: "Scheduled amount; the final installment absorbs the division remainder" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Cents allocated to this installment by payment_waterfall_allocation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | LATE | PAID | DEFAULTED | VOIDED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> VoluntaryDisclosureAgreement.id; agreement credited" }
      - { name: amount_cents, type: integer, source: input, description: "Cents remitted", constraints: "> 0" }
      - { name: payment_reference, type: string, source: input, description: "Optional remittance reference" }
      - { name: received_at, type: datetime, source: system, description: "Clock instant at which the payment was posted" }
      - { name: status, type: enum, source: system, default: APPLIED, description: "APPLIED | REVERSED" }
      - { name: allocations, type: array, source: computed, description: "Ordered list of { installment_id, amount_cents } objects produced by payment_waterfall_allocation; replayed in reverse on /reverse" }
      - { name: unapplied_delta_cents, type: integer, source: computed, default: 0, description: "Portion of amount_cents that landed in VoluntaryDisclosureAgreement.unapplied_credit_cents" }
      - { name: reversal_reason, type: string, source: system, description: "Reason recorded by /reverse" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; subject of the escalation" }
      - { name: program_id, type: string, source: input, description: "FK -> AmnestyProgram.id; program whose post-program regime is applied" }
      - { name: agreement_id, type: string, source: input, description: "FK -> VoluntaryDisclosureAgreement.id; null for a pure non-participant escalation, set when the action arose from a breached agreement" }
      - { name: action_type, type: enum, source: input, description: "NOTICE | ASSESSMENT | LIEN_REFERRAL" }
      - { name: base_tax_cents, type: integer, source: input, description: "Tax base the penalty is computed on", constraints: "> 0" }
      - { name: escalation_tier_applied, type: enum, source: computed, description: "Taxpayer.escalation_tier snapshotted at creation (T0 | T1 | T2)" }
      - { name: multiplier_applied, type: number, source: computed, description: "AmnestyProgram.post_program_penalty_multiplier when the taxpayer is a flagged non-participant, else 1.00" }
      - { name: behavior_adjustment_applied, type: number, source: computed, description: "BEHAVIOR_ADJUSTMENT_RATE when the snapshotted compliance_behavior_score < BEHAVIOR_SCORE_FLOOR, else 0.00" }
      - { name: assessed_penalty_cents, type: integer, source: computed, description: "Output of post_program_penalty_assessment" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | ABATED" }
      - { name: origin, type: enum, source: system, default: MANUAL, description: "MANUAL | BREACH_CASCADE — BREACH_CASCADE rows are created directly in ISSUED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the drafting ComplianceAuditor; the auditor that drafted may not issue" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing ComplianceAuditor; the literal SYSTEM for BREACH_CASCADE rows" }
      - { name: issued_at, type: datetime, source: system, description: "Clock instant of issuance" }
      - { name: abatement_reason, type: string, source: system, description: "Reason recorded by /abate or the literal BREACH_RESCINDED when the rescission cascade abated it" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AmnestyProgram
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /amnesty/programs/{id}/open"
        actor: ProgramAdministrator
        preconditions:
          - "program.status == DRAFT"
          - "at least one ProgramTaxTypeTerm exists with program_id == program.id (empty set -> ERR_NO_ELIGIBLE_TAX_TYPE_TERMS)"
          - "clock_now < program.window_close_at"
        side_effects:
          - "status := OPEN"
          - "increments AmnestyProgram.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /amnesty/programs/{id}/close"
        actor: ProgramAdministrator
        preconditions:
          - "program.status == OPEN"
          - "clock_now >= program.window_close_at (>= is inclusive at the exact instant)"
        side_effects:
          - "status := CLOSED; closed_at := clock_now"
          - "CASCADE HOP 1: every PreClearanceRequest with program_id == program.id and status IN {SUBMITTED, UNDER_REVIEW, TERMS_OFFERED, COUNTERED} transitions to EXPIRED"
          - "CASCADE HOP 2 (caused by hop 1): for each request that just became EXPIRED and whose disclosed_taxpayer_id is not null, that Taxpayer.nonparticipant_flag := true and AmnestyProgram.nonparticipant_count is recomputed"
          - "CASCADE HOP 3 (caused by hop 2): each taxpayer whose nonparticipant_flag flipped has escalation_tier recomputed by taxpayer_escalation_tier_resolution"
          - "CASCADE HOP 4 (caused by hop 3): each such taxpayer's compliance_behavior_score is recomputed by taxpayer_compliance_behavior_score variant HISTORICAL (the NONPARTICIPANT_PENALTY term now applies)"
          - "SECONDARY CHAIN HOP 1: every VoluntaryDisclosureAgreement with program_id == program.id and status == DRAFTED transitions to LAPSED"
          - "SECONDARY CHAIN HOP 2 (caused by the LAPSED transition): every DisclosureReturn of a LAPSED agreement with status == DRAFT transitions to VOIDED"
          - "increments AmnestyProgram.version by 1"
        note: "Close is the only producer of PreClearanceRequest.EXPIRED, VoluntaryDisclosureAgreement.LAPSED and Taxpayer.nonparticipant_flag == true."
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /amnesty/programs/{id}/reconcile"
        actor: ProgramAdministrator
        preconditions:
          - "program.status == CLOSED"
          - "no VoluntaryDisclosureAgreement of this program has status == DRAFTED"
        side_effects:
          - "status := RECONCILED"
          - "final_realization_pct := realization_pct from program_revenue_realization, frozen at this instant"
          - "increments AmnestyProgram.version by 1"

  - entity: PreClearanceRequest
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /amnesty/pre-clearances/{id}/begin-review"
        actor: DisclosureOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "program.status == OPEN"
          - "request.self_reported_under_audit == false"
        side_effects:
          - "status := UNDER_REVIEW; screening_result := ELIGIBLE"
          - "increments PreClearanceRequest.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /amnesty/pre-clearances/{id}/begin-review (automatic screening outcome)"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
          - "request.self_reported_under_audit == true"
        side_effects:
          - "screening_result := INELIGIBLE_SELF_REPORTED_AUDIT; status := REJECTED; rejection_reason := 'INELIGIBLE_SELF_REPORTED_AUDIT'"
          - "increments PreClearanceRequest.version by 1"
        note: "Automatic branch of the same trigger: the anonymous eligibility screen rejects self-declared audit subjects without officer discretion."
      - from: UNDER_REVIEW
        to: TERMS_OFFERED
        trigger: "POST /amnesty/pre-clearances/{id}/offer-terms"
        actor: DisclosureOfficer
        preconditions:
          - "request.status IN {UNDER_REVIEW, COUNTERED}"
          - "program.status == OPEN"
          - "payload.expected_pre_clearance_version == request.version"
          - "payload.offered_lookback_months <= program.lookback_months"
        side_effects:
          - "creates a NegotiationRound with proposed_by := STATE, round_index := request.round_index + 1, actor_user_id := X-User-ID"
          - "round_index := round_index + 1; current_offer_* := this round's terms; last_offer_officer_user_id := X-User-ID"
          - "status := TERMS_OFFERED"
          - "increments PreClearanceRequest.version by 1"
      - from: COUNTERED
        to: TERMS_OFFERED
        trigger: "POST /amnesty/pre-clearances/{id}/offer-terms"
        actor: DisclosureOfficer
        preconditions:
          - "request.status == COUNTERED"
          - "program.status == OPEN"
          - "payload.expected_pre_clearance_version == request.version"
        side_effects:
          - "creates a NegotiationRound with proposed_by := STATE, round_index := request.round_index + 1"
          - "round_index := round_index + 1; current_offer_* := this round's terms; last_offer_officer_user_id := X-User-ID"
          - "status := TERMS_OFFERED"
          - "increments PreClearanceRequest.version by 1"
        note: "Cycle edge: the negotiation loops TERMS_OFFERED -> COUNTERED -> TERMS_OFFERED."
      - from: TERMS_OFFERED
        to: COUNTERED
        trigger: "POST /amnesty/pre-clearances/{id}/counter"
        actor: Representative
        preconditions:
          - "request.status == TERMS_OFFERED"
          - "program.status == OPEN"
          - "representative.status == ACTIVE (cross-entity: PreClearanceRequest depends on Representative state)"
          - "request.counter_count < MAX_REPRESENTATIVE_COUNTERS (3)"
        side_effects:
          - "creates a NegotiationRound with proposed_by := REPRESENTATIVE, round_index := request.round_index + 1"
          - "round_index := round_index + 1; counter_count := counter_count + 1"
          - "status := COUNTERED"
          - "increments PreClearanceRequest.version by 1"
      - from: TERMS_OFFERED
        to: TERMS_OFFERED
        trigger: "POST /amnesty/pre-clearances/{id}/disclose-identity"
        actor: Representative
        preconditions:
          - "request.status == TERMS_OFFERED"
          - "request.disclosed_taxpayer_id is null"
          - "the referenced Taxpayer exists"
        side_effects:
          - "disclosed_taxpayer_id := payload.taxpayer_id; screening_result := ELIGIBLE"
          - "increments PreClearanceRequest.version by 1"
      - from: TERMS_OFFERED
        to: REJECTED
        trigger: "POST /amnesty/pre-clearances/{id}/disclose-identity (automatic screening outcome)"
        actor: system
        preconditions:
          - "request.status == TERMS_OFFERED"
          - "the disclosed Taxpayer has an EnforcementCase with status == OPEN and case_type == CRIMINAL_INVESTIGATION, or one with status == OPEN, case_type IN {FIELD_AUDIT, DESK_AUDIT} and tax_type == request.tax_type"
        side_effects:
          - "disclosed_taxpayer_id := payload.taxpayer_id"
          - "screening_result := INELIGIBLE_CRIMINAL_INVESTIGATION when a criminal case matched, else INELIGIBLE_AUDIT_IN_PROGRESS"
          - "status := REJECTED; rejection_reason := screening_result"
          - "increments PreClearanceRequest.version by 1"
        note: "Identity disclosure is the moment the anonymous screen is re-run against real enforcement records; the criminal test is evaluated before the audit test."
      - from: TERMS_OFFERED
        to: ACCEPTED
        trigger: "POST /amnesty/pre-clearances/{id}/accept"
        actor: Representative
        preconditions:
          - "request.status == TERMS_OFFERED"
          - "request.disclosed_taxpayer_id is not null (else ERR_IDENTITY_NOT_DISCLOSED)"
          - "representative.status == ACTIVE"
          - "program.status == OPEN"
        side_effects:
          - "status := ACCEPTED"
          - "increments PreClearanceRequest.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /amnesty/pre-clearances/{id}/reject"
        actor: DisclosureOfficer
        preconditions: ["request.status IN {UNDER_REVIEW, TERMS_OFFERED, COUNTERED}"]
        side_effects:
          - "status := REJECTED; rejection_reason := payload.rejection_reason"
          - "increments PreClearanceRequest.version by 1"
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /amnesty/pre-clearances/{id}/reject"
        actor: DisclosureOfficer
        preconditions: ["request.status IN {UNDER_REVIEW, TERMS_OFFERED, COUNTERED}"]
        side_effects:
          - "status := REJECTED; rejection_reason := payload.rejection_reason"
          - "increments PreClearanceRequest.version by 1"
      - from: COUNTERED
        to: EXPIRED
        trigger: "AmnestyProgram close cascade hop 1"
        actor: system
        preconditions: ["request.status IN {SUBMITTED, UNDER_REVIEW, TERMS_OFFERED, COUNTERED}"]
        side_effects:
          - "status := EXPIRED"
          - "when disclosed_taxpayer_id is not null: Taxpayer.nonparticipant_flag := true (hop 2)"
          - "increments PreClearanceRequest.version by 1"

  - entity: VoluntaryDisclosureAgreement
    initial_state: DRAFTED
    terminal_states: [FULFILLED, LAPSED, SUPERSEDED]
    transitions:
      - from: DRAFTED
        to: EXECUTED
        trigger: "POST /amnesty/agreements/{id}/execute"
        actor: DisclosureOfficer
        preconditions:
          - "agreement.status == DRAFTED"
          - "program.status == OPEN and clock_now < program.window_close_at"
          - "X-User-ID != agreement.drafted_by_user_id (segregation of duties)"
          - "the taxpayer has no EnforcementCase with status == OPEN and case_type == CRIMINAL_INVESTIGATION"
        side_effects:
          - "status := EXECUTED; executed_by_user_id := X-User-ID; executed_at := clock_now"
          - "compliance_due_at := executed_at + prospective_compliance_months months"
          - "AmnestyProgram.participant_count recomputed"
          - "increments VoluntaryDisclosureAgreement.version by 1"
      - from: EXECUTED
        to: FULFILLED
        trigger: "POST /amnesty/agreements/{id}/certify-compliance"
        actor: ComplianceAuditor
        preconditions:
          - "agreement.status == EXECUTED"
          - "at least one DisclosureReturn exists on the agreement (empty set -> ERR_NO_DISCLOSURE_RETURNS)"
          - "every DisclosureReturn with status not in {VOIDED} has status == SETTLED"
          - "clock_now >= agreement.compliance_due_at"
        side_effects:
          - "status := FULFILLED"
          - "Taxpayer.compliance_behavior_score recomputed (FULFILLED_AGREEMENT_CREDIT now applies)"
          - "increments VoluntaryDisclosureAgreement.version by 1"
      - from: EXECUTED
        to: BREACHED
        trigger: "POST /amnesty/agreements/{id}/declare-breach"
        actor: ComplianceAuditor
        preconditions:
          - "agreement.status == EXECUTED"
          - "agreement.waived_amount_cents > 0 or at least one DisclosureReturn has status IN {FILED, ASSESSED, SETTLED}"
        side_effects:
          - "status := BREACHED; breach_reason := payload.breach_reason"
          - "CASCADE HOP 1: reinstated_amount_cents := sum over returns with status IN {FILED, ASSESSED, SETTLED} of (waived_penalty_cents + waived_interest_cents); waived_amount_cents := 0"
          - "CASCADE HOP 2 (caused by hop 1): each of those returns transitions to REINSTATED with payable_penalty_cents := gross_penalty_cents, payable_interest_cents := gross_interest_cents, waived_penalty_cents := 0, waived_interest_cents := 0, balance_due_cents recomputed; agreement.total_due_cents recomputed"
          - "CASCADE HOP 3 (caused by hop 2): when a PaymentPlan with status == ACTIVE exists and the recomputed total_due_cents now exceeds down_payment_applied_cents + scheduled_total_cents, that plan transitions to DEFAULTED with default_reason := 'BREACH_CASCADE', its installments with status IN {SCHEDULED, LATE} transition to VOIDED, and payment_status := DELINQUENT"
          - "CASCADE HOP 4 (caused by hop 3): an EnforcementAction is created with origin := BREACH_CASCADE, action_type := ASSESSMENT, base_tax_cents := reinstated_amount_cents, status := ISSUED, issued_by_user_id := 'SYSTEM'; assessed_penalty_cents comes from post_program_penalty_assessment using the taxpayer snapshot taken BEFORE hop 5"
          - "CASCADE HOP 5 (caused by hop 4): Taxpayer.open_enforcement_action_count recomputed and compliance_behavior_score recomputed (ISSUED_ACTION_PENALTY now applies)"
          - "AmnestyProgram.reinstated_total_cents and waived_total_cents recomputed"
          - "increments VoluntaryDisclosureAgreement.version by 1"
      - from: BREACHED
        to: EXECUTED
        trigger: "POST /amnesty/agreements/{id}/rescind-breach"
        actor: ComplianceAuditor
        preconditions:
          - "agreement.status == BREACHED"
          - "program.status IN {OPEN, CLOSED}"
        side_effects:
          - "status := EXECUTED; breach_reason := null"
          - "COMPENSATION HOP 1: every DisclosureReturn with status == REINSTATED is restored — waived_penalty_cents and waived_interest_cents recomputed by agreement_waiver_rollup, payable_* and balance_due_cents recomputed, status := SETTLED when agreement.paid_total_cents >= agreement.total_due_cents else FILED"
          - "COMPENSATION HOP 2: reinstated_amount_cents := 0; waived_amount_cents recomputed; total_due_cents recomputed"
          - "COMPENSATION HOP 3: every PaymentPlan with status == DEFAULTED and default_reason == 'BREACH_CASCADE' returns to ACTIVE, its VOIDED installments return to SCHEDULED with paid_cents preserved, and payment_status is recomputed"
          - "COMPENSATION HOP 4: every EnforcementAction with origin == BREACH_CASCADE, agreement_id == agreement.id and status == ISSUED transitions to ABATED with abatement_reason := 'BREACH_RESCINDED'; Taxpayer.open_enforcement_action_count and compliance_behavior_score recomputed"
          - "AmnestyProgram.reinstated_total_cents and waived_total_cents recomputed"
          - "increments VoluntaryDisclosureAgreement.version by 1"
        note: "Cycle edge and exact compensation of /declare-breach: the waiver ledger identity must hold again."
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "POST /amnesty/agreements/{id}/amend"
        actor: DisclosureOfficer
        preconditions:
          - "agreement.status == EXECUTED"
          - "program.status == OPEN and clock_now < program.window_close_at"
          - "payload.expected_agreement_version == agreement.version"
        side_effects:
          - "status := SUPERSEDED"
          - "creates a new VoluntaryDisclosureAgreement in DRAFTED with amends_agreement_id := agreement.id, same program_id/taxpayer_id/pre_clearance_id/tax_types, lookback bounds from the payload, drafted_by_user_id := X-User-ID"
          - "AmnestyProgram.participant_count recomputed (distinct-taxpayer count is unchanged by amendment)"
          - "increments VoluntaryDisclosureAgreement.version by 1"
      - from: DRAFTED
        to: LAPSED
        trigger: "AmnestyProgram close cascade secondary chain hop 1"
        actor: system
        preconditions: ["agreement.status == DRAFTED"]
        side_effects:
          - "status := LAPSED"
          - "every DisclosureReturn of this agreement with status == DRAFT transitions to VOIDED (secondary hop 2)"
          - "increments VoluntaryDisclosureAgreement.version by 1"

  - entity: DisclosureReturn
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /amnesty/returns/{id}/file"
        actor: Taxpayer | Representative
        preconditions:
          - "return.status == DRAFT"
          - "agreement.status == EXECUTED"
          - "program.status == OPEN and clock_now < program.window_close_at"
        side_effects:
          - "filed_at := clock_now; status := FILED"
          - "accrual_end_date, days_late, penalty_rate_applied, gross_penalty_cents and gross_interest_cents computed by return_statutory_liability using the agreement's liability_variant"
          - "agreement.gross_liability_cents, haircut_pct, effective_penalty_waiver_pct and effective_interest_waiver_pct recomputed by agreement_effective_waiver_resolution — this REVISES waived_penalty_cents / waived_interest_cents / payable_* / balance_due_cents on EVERY sibling return with status IN {FILED, ASSESSED, SETTLED}"
          - "agreement.waived_amount_cents and total_due_cents recomputed by agreement_waiver_rollup; AmnestyProgram.waived_total_cents recomputed"
          - "when is_nonfiler_period == true: Taxpayer.nonfiler_period_count and compliance_behavior_score recomputed"
          - "increments VoluntaryDisclosureAgreement.version by 1 and DisclosureReturn.version by 1 on this and every revised sibling return"
      - from: FILED
        to: ASSESSED
        trigger: "POST /amnesty/returns/{id}/assess"
        actor: DisclosureOfficer
        preconditions:
          - "return.status == FILED"
          - "agreement.status == EXECUTED"
        side_effects:
          - "status := ASSESSED; assessed_by_user_id := X-User-ID"
          - "increments DisclosureReturn.version by 1"
      - from: ASSESSED
        to: SETTLED
        trigger: "payment_waterfall_allocation side effect of POST /amnesty/payments"
        actor: system
        preconditions:
          - "return.status IN {FILED, ASSESSED}"
          - "agreement.paid_total_cents >= agreement.total_due_cents after the payment is applied"
        side_effects:
          - "status := SETTLED"
          - "agreement.payment_status := PAID_IN_FULL"
          - "increments DisclosureReturn.version by 1"
      - from: SETTLED
        to: REINSTATED
        trigger: "VoluntaryDisclosureAgreement declare-breach cascade hop 2"
        actor: system
        preconditions: ["return.status IN {FILED, ASSESSED, SETTLED}"]
        side_effects:
          - "waived_penalty_cents := 0; waived_interest_cents := 0; payable_* := gross_*; balance_due_cents recomputed; status := REINSTATED"
          - "increments DisclosureReturn.version by 1"
      - from: REINSTATED
        to: FILED
        trigger: "VoluntaryDisclosureAgreement rescind-breach compensation hop 1"
        actor: system
        preconditions: ["return.status == REINSTATED"]
        side_effects:
          - "waived_* recomputed by agreement_waiver_rollup; payable_* and balance_due_cents recomputed"
          - "status := SETTLED when agreement.paid_total_cents >= agreement.total_due_cents else FILED"
          - "increments DisclosureReturn.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "VoluntaryDisclosureAgreement LAPSED cascade (secondary hop 2)"
        actor: system
        preconditions: ["return.status == DRAFT", "agreement.status just became LAPSED"]
        side_effects:
          - "status := VOIDED"
          - "increments DisclosureReturn.version by 1"

  - entity: PaymentPlan
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED, COMPLETED, DEFAULTED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /amnesty/payment-plans/{id}/approve"
        actor: DisclosureOfficer
        preconditions:
          - "plan.status == PROPOSED"
          - "agreement.status == EXECUTED"
          - "program.status == OPEN and clock_now < program.window_close_at (cross-entity: PaymentPlan depends on AmnestyProgram state)"
          - "agreement.paid_total_cents >= plan.down_payment_cents (else ERR_DOWN_PAYMENT_NOT_RECEIVED)"
          - "every generated installment amount >= MIN_INSTALLMENT_CENTS"
          - "the last generated due_date <= program.window_close_at + INSTALLMENT_GRACE_DAYS days"
        side_effects:
          - "status := ACTIVE; approved_at := clock_now"
          - "Installment rows generated by installment_schedule_generation; scheduled_total_cents := sum of their amount_cents"
          - "agreement.unapplied_credit_cents -= plan.down_payment_cents; agreement.down_payment_applied_cents += plan.down_payment_cents"
          - "agreement.payment_status recomputed"
          - "increments PaymentPlan.version by 1 and VoluntaryDisclosureAgreement.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /amnesty/payment-plans/{id}/reject"
        actor: DisclosureOfficer
        preconditions: ["plan.status == PROPOSED"]
        side_effects:
          - "status := REJECTED; rejection_reason := payload.rejection_reason"
          - "no Installment rows are generated and the agreement's cash fields are untouched (divergent side-effect set from the ACTIVE branch)"
          - "increments PaymentPlan.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /amnesty/payment-plans (a newer proposal for the same agreement)"
        actor: system
        preconditions: ["plan.status == PROPOSED"]
        side_effects:
          - "status := SUPERSEDED"
          - "increments PaymentPlan.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /amnesty/payment-plans/{id}/default"
        actor: ComplianceAuditor
        preconditions: ["plan.status == ACTIVE"]
        side_effects:
          - "status := DEFAULTED; default_reason := payload.default_reason"
          - "every Installment with status IN {SCHEDULED, LATE} transitions to DEFAULTED"
          - "agreement.payment_status := DELINQUENT (the agreement's own status dimension is untouched)"
          - "increments PaymentPlan.version by 1 and VoluntaryDisclosureAgreement.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /amnesty/programs/{id}/installment-sweep (step 2 of the sweep)"
        actor: system
        preconditions: ["plan.status == ACTIVE", "an Installment of this plan has status == LATE and due_date + INSTALLMENT_GRACE_DAYS_LATE days < clock_now date"]
        side_effects:
          - "status := DEFAULTED; default_reason := 'SWEEP_GRACE_EXPIRED'"
          - "remaining Installments with status IN {SCHEDULED, LATE} transition to DEFAULTED"
          - "agreement.payment_status := DELINQUENT"
          - "increments PaymentPlan.version by 1 and VoluntaryDisclosureAgreement.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "payment_waterfall_allocation side effect of POST /amnesty/payments"
        actor: system
        preconditions: ["plan.status == ACTIVE", "every Installment of the plan has status == PAID"]
        side_effects:
          - "status := COMPLETED"
          - "increments PaymentPlan.version by 1"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "VoluntaryDisclosureAgreement rescind-breach compensation hop 3"
        actor: system
        preconditions: ["plan.status == DEFAULTED", "plan.default_reason == 'BREACH_CASCADE'"]
        side_effects:
          - "status := ACTIVE; default_reason := null"
          - "every Installment with status == VOIDED returns to SCHEDULED with paid_cents preserved"
          - "increments PaymentPlan.version by 1"

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID, DEFAULTED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "payment_waterfall_allocation side effect of POST /amnesty/payments"
        actor: system
        preconditions: ["installment.status IN {SCHEDULED, LATE}", "paid_cents == amount_cents after allocation"]
        side_effects:
          - "status := PAID"
          - "when every sibling installment is PAID the plan transitions to COMPLETED"
          - "increments Installment.version by 1"
      - from: SCHEDULED
        to: LATE
        trigger: "POST /amnesty/programs/{id}/installment-sweep (step 1 of the sweep)"
        actor: system
        preconditions: ["installment.status == SCHEDULED", "installment.due_date < clock_now date"]
        side_effects:
          - "status := LATE"
          - "increments Installment.version by 1"
      - from: LATE
        to: DEFAULTED
        trigger: "POST /amnesty/programs/{id}/installment-sweep (step 2 of the sweep)"
        actor: system
        preconditions: ["installment.status == LATE", "due_date + INSTALLMENT_GRACE_DAYS_LATE days < clock_now date"]
        side_effects:
          - "status := DEFAULTED"
          - "the owning PaymentPlan transitions ACTIVE -> DEFAULTED, which defaults the remaining installments"
          - "increments Installment.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "VoluntaryDisclosureAgreement declare-breach cascade hop 3"
        actor: system
        preconditions: ["installment.status IN {SCHEDULED, LATE}", "the owning plan just defaulted with default_reason == 'BREACH_CASCADE'"]
        side_effects:
          - "status := VOIDED (paid_cents preserved)"
          - "increments Installment.version by 1"
      - from: VOIDED
        to: SCHEDULED
        trigger: "VoluntaryDisclosureAgreement rescind-breach compensation hop 3"
        actor: system
        preconditions: ["installment.status == VOIDED", "the owning plan is returning to ACTIVE"]
        side_effects:
          - "status := SCHEDULED"
          - "increments Installment.version by 1"

  - entity: Payment
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /amnesty/payments/{id}/reverse"
        actor: ProgramAdministrator
        preconditions:
          - "payment.status == APPLIED"
          - "agreement.status != FULFILLED"
          - "agreement.paid_total_cents - payment.amount_cents >= agreement.down_payment_applied_cents (else ERR_REVERSAL_BREAKS_DOWN_PAYMENT)"
        side_effects:
          - "status := REVERSED; reversal_reason := payload.reversal_reason"
          - "every entry in allocations is unwound: Installment.paid_cents -= entry.amount_cents and any PAID installment returns to SCHEDULED"
          - "agreement.unapplied_credit_cents -= unapplied_delta_cents; agreement.paid_total_cents -= amount_cents; payment_status recomputed"
          - "AmnestyProgram.collected_cents recomputed; SETTLED returns whose agreement is no longer fully paid return to ASSESSED when assessed_by_user_id is not null else FILED"
          - "increments Payment.version by 1 and VoluntaryDisclosureAgreement.version by 1"

  - entity: EnforcementCase
    initial_state: OPEN
    terminal_states: [CLOSED, REFERRED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /amnesty/enforcement-cases/{id}/close"
        actor: ComplianceAuditor
        preconditions: ["case.status == OPEN"]
        side_effects:
          - "status := CLOSED; closed_at := clock_now"
          - "Taxpayer.open_case_count, escalation_tier and compliance_behavior_score recomputed"
          - "increments EnforcementCase.version by 1"
      - from: OPEN
        to: REFERRED
        trigger: "POST /amnesty/enforcement-cases/{id}/refer"
        actor: ComplianceAuditor
        preconditions: ["case.status == OPEN"]
        side_effects:
          - "status := REFERRED"
          - "Taxpayer.open_case_count, escalation_tier and compliance_behavior_score recomputed (REFERRED_CASE_PENALTY replaces OPEN_CASE_PENALTY)"
          - "increments EnforcementCase.version by 1"

  - entity: EnforcementAction
    initial_state: DRAFT
    terminal_states: [ABATED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /amnesty/enforcement-actions/{id}/issue"
        actor: ComplianceAuditor
        preconditions:
          - "action.status == DRAFT"
          - "program.status IN {CLOSED, RECONCILED} (post-program escalation only)"
          - "X-User-ID != action.created_by_user_id (segregation of duties)"
        side_effects:
          - "status := ISSUED; issued_by_user_id := X-User-ID; issued_at := clock_now"
          - "Taxpayer.open_enforcement_action_count and compliance_behavior_score recomputed"
          - "increments EnforcementAction.version by 1"
      - from: ISSUED
        to: ABATED
        trigger: "POST /amnesty/enforcement-actions/{id}/abate"
        actor: ComplianceAuditor
        preconditions: ["action.status == ISSUED"]
        side_effects:
          - "status := ABATED; abatement_reason := payload.abatement_reason"
          - "Taxpayer.open_enforcement_action_count and compliance_behavior_score recomputed (the ISSUED_ACTION_PENALTY is removed)"
          - "increments EnforcementAction.version by 1"
      - from: ISSUED
        to: ABATED
        trigger: "VoluntaryDisclosureAgreement rescind-breach compensation hop 4"
        actor: system
        preconditions: ["action.status == ISSUED", "action.origin == BREACH_CASCADE", "action.agreement_id == the rescinded agreement"]
        side_effects:
          - "status := ABATED; abatement_reason := 'BREACH_RESCINDED'"
          - "Taxpayer.open_enforcement_action_count and compliance_behavior_score recomputed"
          - "increments EnforcementAction.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-agreement
    parent_entity: VoluntaryDisclosureAgreement
    write_endpoint: "POST /amnesty/payment-plans"
    occ_field: "expected_agreement_version"
    description: |
      Proposing a PaymentPlan against an agreement whose version has advanced
      since the client last read it is rejected. A newer proposal legitimately
      supersedes the prior PROPOSED plan, so the writer's stale view of the
      agreement (its balance, its existing proposal) must be refused rather
      than silently superseding a plan the writer never saw.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: terms-offer-stale-pre-clearance
    parent_entity: PreClearanceRequest
    write_endpoint: "POST /amnesty/pre-clearances/{id}/offer-terms"
    occ_field: "expected_pre_clearance_version"
    description: |
      Posting a state offer against a pre-clearance whose version has advanced
      since the officer last read it is rejected. A new offer legitimately
      supersedes the current offer, so an officer writing from a stale view of
      the negotiation (an unseen counter, an unseen identity disclosure) must
      be refused.
    error_id: ERR_STALE_PRE_CLEARANCE_VERSION
    http_status: 412
  - rule_id: amend-stale-agreement
    parent_entity: VoluntaryDisclosureAgreement
    write_endpoint: "POST /amnesty/agreements/{id}/amend"
    occ_field: "expected_agreement_version"
    description: |
      Amending an agreement whose version has advanced since the officer last
      read it is rejected. The amendment supersedes the prior agreement and
      copies its scope, so drafting from a stale view would carry forward
      lookback bounds or liability figures that no longer hold.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: return_statutory_liability
    algorithm_type: tiered_pricing
    trigger: "POST /amnesty/returns/{id}/file"
    inputs:
      - "DisclosureReturn.reported_tax_cents"
      - "DisclosureReturn.original_due_date"
      - "DisclosureReturn.is_nonfiler_period"
      - "VoluntaryDisclosureAgreement.liability_variant"
      - "VoluntaryDisclosureAgreement.executed_at"
      - "AmnestyProgram.window_close_at"
    variants:
      - name: AMNESTY_STATUTORY
        applies_when: "VoluntaryDisclosureAgreement.pre_clearance_id is null (walk-in amnesty filing)"
        formula: |
          accrual_end_date = date(AmnestyProgram.window_close_at)
          days_late        = max(0, accrual_end_date - original_due_date)   # whole days
          penalty_rate_applied = tier_rate(days_late) + (is_nonfiler_period ? NONFILER_SURCHARGE_RATE : 0)
          gross_penalty_cents  = round_half_up(reported_tax_cents * penalty_rate_applied)
          gross_interest_cents = round_half_up(reported_tax_cents * DAILY_INTEREST_RATE * days_late)
        note: "A walk-in accrues to the end of the program window regardless of when it files: the statutory clock is not stopped by early filing."
      - name: VDA_NEGOTIATED
        applies_when: "VoluntaryDisclosureAgreement.pre_clearance_id is not null (negotiated voluntary disclosure)"
        formula: |
          accrual_end_date = date(VoluntaryDisclosureAgreement.executed_at)
          days_late        = max(0, accrual_end_date - original_due_date)
          penalty_rate_applied = tier_rate(days_late) + (is_nonfiler_period ? NONFILER_SURCHARGE_RATE : 0)
          gross_penalty_cents  = round_half_up(reported_tax_cents * penalty_rate_applied)
          gross_interest_cents = round_half_up(reported_tax_cents * DAILY_INTEREST_RATE * days_late)
        note: "Executing the negotiated agreement freezes the accrual clock, so an identical return carries a strictly smaller liability than the walk-in variant whenever executed_at < window_close_at."
    formula: |
      tier_rate(days_late) =
        PENALTY_RATE_TIER_1  when days_late <= TIER_1_MAX_DAYS_LATE
        PENALTY_RATE_TIER_2  when TIER_1_MAX_DAYS_LATE < days_late <= TIER_2_MAX_DAYS_LATE
        PENALTY_RATE_TIER_3  when days_late > TIER_2_MAX_DAYS_LATE
      The variant selected by VoluntaryDisclosureAgreement.liability_variant supplies accrual_end_date;
      everything downstream of accrual_end_date is shared between the two variants.
    constants:
      TIER_1_MAX_DAYS_LATE: 90
      TIER_2_MAX_DAYS_LATE: 365
      PENALTY_RATE_TIER_1: 0.05
      PENALTY_RATE_TIER_2: 0.15
      PENALTY_RATE_TIER_3: 0.25
      NONFILER_SURCHARGE_RATE: 0.05
      DAILY_INTEREST_RATE: 0.00025
    rounding: "round_half_up to whole cents, applied once per return per component (penalty and interest rounded independently)"

  - name: agreement_effective_waiver_resolution
    algorithm_type: threshold
    trigger: "POST /amnesty/returns/{id}/file (recomputed on every filing, and by the breach and rescission cascades)"
    inputs:
      - "DisclosureReturn.reported_tax_cents, gross_penalty_cents, gross_interest_cents (over returns with status IN {FILED, ASSESSED, SETTLED})"
      - "AmnestyProgram.base_penalty_waiver_pct, base_interest_waiver_pct"
      - "ProgramTaxTypeTerm.penalty_waiver_pct, interest_waiver_pct"
      - "PreClearanceRequest.current_offer_penalty_waiver_pct, current_offer_interest_waiver_pct"
    formula: |
      # step 1 — resolve the base waiver pair, in this precedence order:
      base_penalty_pct, base_interest_pct =
        (pre_clearance.current_offer_penalty_waiver_pct, pre_clearance.current_offer_interest_waiver_pct)
            when liability_variant == VDA_NEGOTIATED
        else (term.penalty_waiver_pct, term.interest_waiver_pct) for the return's tax_type
            when that term override is not null
        else (program.base_penalty_waiver_pct, program.base_interest_waiver_pct)

      # step 2 — aggregate the whole agreement BEFORE any waiver is applied
      gross_liability_cents = SUM over qualifying returns of
                              (reported_tax_cents + gross_penalty_cents + gross_interest_cents)

      # step 3 — high-liability haircut, selected from the aggregate
      haircut_pct = HAIRCUT_TIER_2_PCT when gross_liability_cents >= HAIRCUT_TIER_2_MIN_CENTS
                    HAIRCUT_TIER_1_PCT when gross_liability_cents >= HAIRCUT_TIER_1_MIN_CENTS
                    0.00               otherwise

      # step 4 — the haircut bites the penalty waiver at full strength and the interest waiver at half
      effective_penalty_waiver_pct  = max(0.00, base_penalty_pct  - haircut_pct)
      effective_interest_waiver_pct = max(0.00, base_interest_pct - haircut_pct / 2)
    constants:
      HAIRCUT_TIER_1_MIN_CENTS: 5000000
      HAIRCUT_TIER_1_PCT: 0.10
      HAIRCUT_TIER_2_MIN_CENTS: 25000000
      HAIRCUT_TIER_2_PCT: 0.25
    rounding: "percentages carry four decimal places and are never rounded to cents here; the >= comparison at each threshold is inclusive"
    note: |
      Step 2 depends on the aggregate across ALL qualifying returns, so filing the
      Nth return can move the agreement across a haircut threshold and REVISE the
      already-stored waiver figures of returns 1..N-1. Resolution order matters:
      the haircut is derived from pre-waiver gross figures, never from post-waiver ones.

  - name: agreement_waiver_rollup
    algorithm_type: aggregation
    trigger: "POST /amnesty/returns/{id}/file, POST /amnesty/agreements/{id}/rescind-breach"
    inputs:
      - "DisclosureReturn.gross_penalty_cents, gross_interest_cents"
      - "VoluntaryDisclosureAgreement.effective_penalty_waiver_pct, effective_interest_waiver_pct"
    formula: |
      # per return, each component rounded independently, THEN summed (sum-of-rounded,
      # never round-of-sum):
      waived_penalty_cents   = round_half_up(gross_penalty_cents  * effective_penalty_waiver_pct)
      waived_interest_cents  = round_half_up(gross_interest_cents * effective_interest_waiver_pct)
      payable_penalty_cents  = gross_penalty_cents  - waived_penalty_cents
      payable_interest_cents = gross_interest_cents - waived_interest_cents
      balance_due_cents      = reported_tax_cents + payable_penalty_cents + payable_interest_cents

      # agreement rollups
      waived_amount_cents = SUM over qualifying returns of (waived_penalty_cents + waived_interest_cents)
      total_due_cents     = SUM over returns with status IN {FILED, ASSESSED, SETTLED, REINSTATED}
                            of balance_due_cents
      # invariant that must hold whenever the agreement is not BREACHED:
      #   SUM(gross_penalty + gross_interest) == waived_amount_cents
      #                                        + SUM(payable_penalty + payable_interest)
    constants: {}
    rounding: "round_half_up per return per component; the agreement total is the sum of already-rounded per-return values"

  - name: installment_schedule_generation
    algorithm_type: chronological
    trigger: "POST /amnesty/payment-plans/{id}/approve"
    inputs:
      - "VoluntaryDisclosureAgreement.total_due_cents"
      - "PaymentPlan.down_payment_cents, installment_count"
      - "PaymentPlan.approved_at"
      - "AmnestyProgram.window_close_at"
    formula: |
      schedulable_cents = VoluntaryDisclosureAgreement.total_due_cents - PaymentPlan.down_payment_cents
      base_amount       = floor(schedulable_cents / installment_count)
      for k in 1..installment_count:
        amount_cents(k) = base_amount                                        when k < installment_count
                          schedulable_cents - base_amount * (installment_count - 1)
                                                                             when k == installment_count
        due_date(k)     = date(approved_at) + INSTALLMENT_PERIOD_DAYS * k    # k = 1 is the first due date
      scheduled_total_cents = SUM amount_cents(k)                            # exactly schedulable_cents
      # horizon guard evaluated before any row is written:
      #   due_date(installment_count) <= date(window_close_at) + INSTALLMENT_HORIZON_DAYS
      # floor guard evaluated before any row is written:
      #   min amount_cents(k) >= MIN_INSTALLMENT_CENTS
      # down-payment guard:
      #   down_payment_cents >= round_half_up(total_due_cents * MIN_DOWN_PAYMENT_PCT)
    constants:
      INSTALLMENT_PERIOD_DAYS: 30
      INSTALLMENT_HORIZON_DAYS: 365
      MIN_INSTALLMENT_CENTS: 2500
      MIN_DOWN_PAYMENT_PCT: 0.10
      INSTALLMENT_GRACE_DAYS_LATE: 30
    rounding: "integer floor division; the final installment absorbs the entire remainder so the schedule is exact"

  - name: payment_waterfall_allocation
    algorithm_type: waterfall_allocation
    trigger: "POST /amnesty/payments"
    inputs:
      - "Payment.amount_cents"
      - "Installment.seq_index, amount_cents, paid_cents (of the agreement's ACTIVE PaymentPlan)"
      - "VoluntaryDisclosureAgreement.unapplied_credit_cents"
    formula: |
      remaining = Payment.amount_cents
      allocations = []
      for each Installment of the agreement's ACTIVE PaymentPlan, ordered by seq_index ASC,
      skipping those with status IN {PAID, VOIDED, DEFAULTED}:
        take = min(remaining, amount_cents - paid_cents)
        when take > 0: paid_cents += take; allocations.append({installment_id, take}); remaining -= take
        when paid_cents == amount_cents: status := PAID
        when remaining == 0: break
      unapplied_delta_cents = remaining
      VoluntaryDisclosureAgreement.unapplied_credit_cents += remaining
      # when the agreement has no ACTIVE plan the whole payment becomes unapplied credit,
      # which is what a pre-approval down payment is
      paid_total_cents = SUM of Payment.amount_cents with status == APPLIED
      payment_status   = PAID_IN_FULL when paid_total_cents >= total_due_cents
                         DELINQUENT   when a PaymentPlan of the agreement has status == DEFAULTED
                         PARTIAL      when paid_total_cents > 0
                         UNPAID       otherwise
    constants: {}
    rounding: "exact integer cents; no rounding occurs during allocation"
    note: "Earlier installments fill completely before later ones receive anything; the tail lands in unapplied credit rather than overpaying an installment."

  - name: post_program_penalty_assessment
    algorithm_type: threshold
    trigger: "POST /amnesty/enforcement-actions, VoluntaryDisclosureAgreement declare-breach cascade hop 4"
    inputs:
      - "EnforcementAction.base_tax_cents"
      - "Taxpayer.escalation_tier (snapshotted at creation)"
      - "Taxpayer.nonparticipant_flag (snapshotted at creation)"
      - "Taxpayer.compliance_behavior_score (snapshotted at creation)"
      - "AmnestyProgram.post_program_penalty_multiplier"
    formula: |
      tier_rate = TIER_RATE_T0 when escalation_tier == T0
                  TIER_RATE_T1 when escalation_tier == T1
                  TIER_RATE_T2 when escalation_tier == T2
      behavior_adjustment_applied = BEHAVIOR_ADJUSTMENT_RATE
                                      when compliance_behavior_score < BEHAVIOR_SCORE_FLOOR
                                    else 0.00
      multiplier_applied = AmnestyProgram.post_program_penalty_multiplier
                             when Taxpayer.nonparticipant_flag == true
                           else 1.00
      raw_cents = round_half_up(base_tax_cents * (tier_rate + behavior_adjustment_applied)
                                               * multiplier_applied)
      cap_cents = round_half_up(base_tax_cents * PENALTY_CAP_PCT)
      assessed_penalty_cents = max(PENALTY_FLOOR_CENTS, min(raw_cents, cap_cents))
    constants:
      TIER_RATE_T0: 0.10
      TIER_RATE_T1: 0.20
      TIER_RATE_T2: 0.35
      BEHAVIOR_SCORE_FLOOR: 60
      BEHAVIOR_ADJUSTMENT_RATE: 0.05
      PENALTY_CAP_PCT: 0.50
      PENALTY_FLOOR_CENTS: 10000
    rounding: "round_half_up once on raw_cents and once on cap_cents; the outer max/min operate on already-rounded integers so the floor can beat the cap on tiny bases"
    note: "Nested composition: an additive rate (tier + behavior), a multiplicative escalation, an upper cap and a lower floor. The floor is applied last, so it wins even when it exceeds the cap."

  - name: taxpayer_compliance_behavior_score
    algorithm_type: weighted_scoring
    trigger: "EnforcementCase close/refer, EnforcementAction issue/abate, DisclosureReturn file, agreement certify-compliance, AmnestyProgram close cascade, GET /amnesty/taxpayers/{id}/compliance-behavior"
    inputs:
      - "Taxpayer.open_case_count and the case_type / status of the taxpayer's EnforcementCase rows"
      - "Taxpayer.nonfiler_period_count"
      - "Taxpayer.nonparticipant_flag"
      - "Taxpayer.open_enforcement_action_count"
      - "VoluntaryDisclosureAgreement.status and lookback bounds of the taxpayer's agreements"
    variants:
      - name: HISTORICAL
        applies_when: "always — this is the variant persisted in Taxpayer.compliance_behavior_score"
        formula: |
          score = SCORE_BASE
                  - OPEN_CASE_PENALTY       * count(EnforcementCase status == OPEN)
                  - REFERRED_CASE_PENALTY   * count(EnforcementCase status == REFERRED)
                  - NONFILER_PERIOD_PENALTY * nonfiler_period_count
                  - NONPARTICIPANT_PENALTY  * (nonparticipant_flag ? 1 : 0)
                  - ISSUED_ACTION_PENALTY   * open_enforcement_action_count
                  + FULFILLED_AGREEMENT_CREDIT * count(agreements with status == FULFILLED)
          score = clamp(score, 0, 100)
      - name: PROGRAM_ADJUSTED
        applies_when: "reported by GET /amnesty/programs/{id}/revenue-summary and GET /amnesty/taxpayers/{id}/compliance-behavior as program_adjusted_score"
        formula: |
          # nonfiler periods that were disclosed under an agreement of this program with
          # status IN {EXECUTED, FULFILLED, SUPERSEDED} are FORGIVEN, and participation earns credit
          forgiven = count(DisclosureReturn with is_nonfiler_period == true whose agreement
                           belongs to the program and has status IN {EXECUTED, FULFILLED, SUPERSEDED}
                           and whose period_start_date >= agreement.lookback_start_date)
          score = HISTORICAL_score
                  + NONFILER_PERIOD_PENALTY * forgiven
                  + PROGRAM_PARTICIPATION_CREDIT * (taxpayer has such an agreement ? 1 : 0)
          score = clamp(score, 0, 100)
        note: "The same underlying facts yield a materially different score; the persisted field always holds HISTORICAL."
    formula: "See the two variants; the persisted Taxpayer.compliance_behavior_score is always HISTORICAL."
    constants:
      SCORE_BASE: 100
      OPEN_CASE_PENALTY: 20
      REFERRED_CASE_PENALTY: 30
      NONFILER_PERIOD_PENALTY: 5
      NONPARTICIPANT_PENALTY: 25
      ISSUED_ACTION_PENALTY: 8
      FULFILLED_AGREEMENT_CREDIT: 15
      PROGRAM_PARTICIPATION_CREDIT: 18
    rounding: "integer arithmetic throughout; clamped to the inclusive range 0..100"

  - name: taxpayer_escalation_tier_resolution
    algorithm_type: threshold
    trigger: "AmnestyProgram close cascade hop 3, EnforcementCase close/refer"
    inputs:
      - "Taxpayer.nonparticipant_flag"
      - "Taxpayer.open_case_count"
    formula: |
      escalation_tier = T2 when nonparticipant_flag == true and open_case_count >= T2_MIN_OPEN_CASES
                        T1 when nonparticipant_flag == true
                        T0 otherwise
    constants:
      T2_MIN_OPEN_CASES: 1
    rounding: "not applicable"

  - name: program_revenue_realization
    algorithm_type: aggregation
    trigger: "GET /amnesty/programs/{id}/revenue-summary, POST /amnesty/programs/{id}/reconcile"
    inputs:
      - "Payment.amount_cents with status == APPLIED across the program's agreements"
      - "AmnestyProgram.revenue_forecast_cents"
      - "VoluntaryDisclosureAgreement.waived_amount_cents, reinstated_amount_cents"
      - "Taxpayer.compliance_behavior_score under both variants"
    formula: |
      collected_cents  = SUM of Payment.amount_cents with status == APPLIED
      realization_pct  = round_half_up(collected_cents / revenue_forecast_cents, 4)
      forecast_status  = ON_TRACK  when realization_pct >= ON_TRACK_MIN_PCT
                         WATCH     when realization_pct >= WATCH_MIN_PCT
                         SHORTFALL otherwise
      avg_historical_score        = round_half_up(mean of HISTORICAL scores of participant taxpayers)
      avg_program_adjusted_score  = round_half_up(mean of PROGRAM_ADJUSTED scores of participant taxpayers)
    constants:
      ON_TRACK_MIN_PCT: 0.9000
      WATCH_MIN_PCT: 0.7000
    rounding: "realization_pct is rounded half-up to FOUR decimal places FIRST and forecast_status is then derived from the ROUNDED value; average scores are rounded half-up to whole integers"
    note: "The rounding happens before the comparison, so a raw ratio of 0.89999974 becomes 0.9000 and reports ON_TRACK."

# =============================================================================
# §1.4 Validation Rules (evaluated strictly in ascending priority; first violation wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "X-User-Role and X-User-ID headers must both be present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: ["all endpoints"]
  - priority: 2
    category: auth
    rule: "X-User-Role must be one of ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Representative, Taxpayer"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: ["all endpoints"]
  - priority: 3
    category: auth
    rule: "the role must appear in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: ["all endpoints"]
  - priority: 4
    category: auth
    rule: "for an entity-backed role, X-User-ID must be an existing id of the backing entity: Taxpayer.id for Taxpayer, Representative.id for Representative"
    error_id: ERR_IDENTITY_NOT_RECOGNIZED
    http_status: 403
    applies_to: ["all endpoints reachable by Taxpayer or Representative"]
  - priority: 5
    category: existence
    rule: "path ids are resolved left to right; the leftmost missing id decides the error"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_TAX_TYPE_TERM_NOT_FOUND | ERR_TAXPAYER_NOT_FOUND | ERR_ENFORCEMENT_CASE_NOT_FOUND | ERR_REPRESENTATIVE_NOT_FOUND | ERR_PRE_CLEARANCE_NOT_FOUND | ERR_NEGOTIATION_ROUND_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_PAYMENT_PLAN_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_ENFORCEMENT_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: ["every endpoint with a path parameter"]
  - priority: 6
    category: existence
    rule: "foreign keys supplied in the request body must resolve to existing rows, checked in the declared field order"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_TAXPAYER_NOT_FOUND | ERR_PRE_CLEARANCE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /amnesty/pre-clearances", "POST /amnesty/agreements", "POST /amnesty/enforcement-cases", "POST /amnesty/enforcement-actions", "POST /amnesty/payment-plans", "POST /amnesty/payments", "POST /amnesty/pre-clearances/{id}/disclose-identity"]
  - priority: 7
    category: ownership
    rule: "a Taxpayer may only address agreements, returns, payment plans and payments whose taxpayer_id == X-User-ID; a Representative may only address pre-clearances whose representative_id == X-User-ID and returns whose agreement's pre_clearance_id belongs to that representative"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /amnesty/agreements/{id}/returns", "POST /amnesty/returns/{id}/file", "POST /amnesty/payment-plans", "POST /amnesty/payments", "POST /amnesty/pre-clearances/{id}/counter", "POST /amnesty/pre-clearances/{id}/disclose-identity", "POST /amnesty/pre-clearances/{id}/accept"]
  - priority: 8
    category: schema
    rule: "required fields present, types correct, enum members valid, dates well formed as YYYY-MM-DD, timestamps ISO 8601, monetary fields integer cents > 0 where declared, percentages within 0.00..1.00"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: ["all endpoints with a request body"]
  - priority: 9
    category: schema
    rule: "limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: ["all list endpoints"]
  - priority: 10
    category: concurrency
    rule: "expected_agreement_version must equal VoluntaryDisclosureAgreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: ["POST /amnesty/payment-plans", "POST /amnesty/agreements/{id}/amend"]
  - priority: 11
    category: concurrency
    rule: "expected_pre_clearance_version must equal PreClearanceRequest.version"
    error_id: ERR_STALE_PRE_CLEARANCE_VERSION
    http_status: 412
    applies_to: ["POST /amnesty/pre-clearances/{id}/offer-terms"]
  - priority: 12
    category: state
    rule: "AmnestyProgram must be in the state the operation requires: DRAFT to add terms or open, OPEN to participate, CLOSED to reconcile or to issue post-program actions"
    error_id: "ERR_PROGRAM_NOT_DRAFT | ERR_PROGRAM_NOT_OPEN | ERR_PROGRAM_NOT_CLOSED"
    http_status: 409
    applies_to: ["POST /amnesty/programs/{id}/tax-type-terms", "POST /amnesty/programs/{id}/open", "POST /amnesty/programs/{id}/close", "POST /amnesty/programs/{id}/reconcile", "POST /amnesty/pre-clearances", "POST /amnesty/pre-clearances/{id}/begin-review", "POST /amnesty/pre-clearances/{id}/offer-terms", "POST /amnesty/pre-clearances/{id}/counter", "POST /amnesty/pre-clearances/{id}/accept", "POST /amnesty/agreements", "POST /amnesty/agreements/{id}/execute", "POST /amnesty/agreements/{id}/amend", "POST /amnesty/payment-plans/{id}/approve", "POST /amnesty/enforcement-actions/{id}/issue"]
  - priority: 13
    category: state
    rule: "PreClearanceRequest must be in a state that admits the operation: SUBMITTED for begin-review, UNDER_REVIEW or COUNTERED for offer-terms, TERMS_OFFERED for counter, disclose-identity and accept; terminal requests admit nothing"
    error_id: "ERR_PRE_CLEARANCE_NOT_SUBMITTED | ERR_PRE_CLEARANCE_NOT_NEGOTIABLE | ERR_PRE_CLEARANCE_NOT_OFFERED | ERR_PRE_CLEARANCE_TERMINAL"
    http_status: 409
    applies_to: ["POST /amnesty/pre-clearances/{id}/begin-review", "POST /amnesty/pre-clearances/{id}/offer-terms", "POST /amnesty/pre-clearances/{id}/counter", "POST /amnesty/pre-clearances/{id}/disclose-identity", "POST /amnesty/pre-clearances/{id}/accept", "POST /amnesty/pre-clearances/{id}/reject"]
  - priority: 14
    category: state
    rule: "VoluntaryDisclosureAgreement must be in the state the operation requires: DRAFTED to execute, DRAFTED or EXECUTED to draft a return, EXECUTED to file returns, amend, certify, propose or approve a plan, pay or declare breach, BREACHED to rescind"
    error_id: "ERR_AGREEMENT_NOT_DRAFTED | ERR_AGREEMENT_NOT_EXECUTED | ERR_AGREEMENT_NOT_BREACHED"
    http_status: 409
    applies_to: ["POST /amnesty/agreements/{id}/execute", "POST /amnesty/agreements/{id}/amend", "POST /amnesty/agreements/{id}/certify-compliance", "POST /amnesty/agreements/{id}/declare-breach", "POST /amnesty/agreements/{id}/rescind-breach", "POST /amnesty/agreements/{id}/returns", "POST /amnesty/returns/{id}/file", "POST /amnesty/payment-plans", "POST /amnesty/payment-plans/{id}/approve", "POST /amnesty/payments"]
  - priority: 15
    category: state
    rule: "DisclosureReturn must be DRAFT to file and FILED to assess"
    error_id: "ERR_RETURN_NOT_DRAFT | ERR_RETURN_NOT_FILED"
    http_status: 409
    applies_to: ["POST /amnesty/returns/{id}/file", "POST /amnesty/returns/{id}/assess"]
  - priority: 16
    category: state
    rule: "PaymentPlan must be PROPOSED to approve or reject and ACTIVE to default"
    error_id: "ERR_PLAN_NOT_PROPOSED | ERR_PLAN_NOT_ACTIVE"
    http_status: 409
    applies_to: ["POST /amnesty/payment-plans/{id}/approve", "POST /amnesty/payment-plans/{id}/reject", "POST /amnesty/payment-plans/{id}/default"]
  - priority: 17
    category: state
    rule: "Payment must be APPLIED to be reversed"
    error_id: ERR_PAYMENT_NOT_APPLIED
    http_status: 409
    applies_to: ["POST /amnesty/payments/{id}/reverse"]
  - priority: 18
    category: state
    rule: "EnforcementCase must be OPEN to close or refer; EnforcementAction must be DRAFT to issue and ISSUED to abate"
    error_id: "ERR_CASE_NOT_OPEN | ERR_ACTION_NOT_DRAFT | ERR_ACTION_NOT_ISSUED"
    http_status: 409
    applies_to: ["POST /amnesty/enforcement-cases/{id}/close", "POST /amnesty/enforcement-cases/{id}/refer", "POST /amnesty/enforcement-actions/{id}/issue", "POST /amnesty/enforcement-actions/{id}/abate"]
  - priority: 19
    category: business_safety
    rule: "a taxpayer with an EnforcementCase in status OPEN and case_type CRIMINAL_INVESTIGATION may not be brought into the program"
    error_id: ERR_TAXPAYER_UNDER_CRIMINAL_INVESTIGATION
    http_status: 422
    applies_to: ["POST /amnesty/agreements", "POST /amnesty/agreements/{id}/execute"]
  - priority: 20
    category: business_safety
    rule: "a taxpayer with an EnforcementCase in status OPEN, case_type FIELD_AUDIT or DESK_AUDIT and tax_type inside the agreement's tax_types may not disclose that tax type"
    error_id: ERR_TAXPAYER_UNDER_AUDIT_FOR_TAX_TYPE
    http_status: 422
    applies_to: ["POST /amnesty/agreements", "POST /amnesty/agreements/{id}/execute"]
  - priority: 21
    category: business_safety
    rule: "a Representative with status SUSPENDED may not act on a pre-clearance"
    error_id: ERR_REPRESENTATIVE_SUSPENDED
    http_status: 422
    applies_to: ["POST /amnesty/pre-clearances", "POST /amnesty/pre-clearances/{id}/counter", "POST /amnesty/pre-clearances/{id}/disclose-identity", "POST /amnesty/pre-clearances/{id}/accept"]
  - priority: 22
    category: business_safety
    rule: "segregation of duties: X-User-ID must differ from VoluntaryDisclosureAgreement.drafted_by_user_id when executing, and from EnforcementAction.created_by_user_id when issuing"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /amnesty/agreements/{id}/execute", "POST /amnesty/enforcement-actions/{id}/issue"]
  - priority: 23
    category: business_temporal
    rule: "participation requires clock_now < AmnestyProgram.window_close_at (strict) and clock_now >= window_open_at; closing requires clock_now >= window_close_at"
    error_id: "ERR_PROGRAM_WINDOW_CLOSED | ERR_PROGRAM_WINDOW_NOT_OPEN | ERR_PROGRAM_WINDOW_NOT_ELAPSED"
    http_status: 422
    applies_to: ["POST /amnesty/pre-clearances", "POST /amnesty/agreements", "POST /amnesty/agreements/{id}/execute", "POST /amnesty/agreements/{id}/amend", "POST /amnesty/agreements/{id}/returns", "POST /amnesty/returns/{id}/file", "POST /amnesty/payment-plans/{id}/approve", "POST /amnesty/programs/{id}/close"]
  - priority: 24
    category: business_temporal
    rule: "window_open_at must be strictly before window_close_at"
    error_id: ERR_INVALID_PROGRAM_WINDOW
    http_status: 422
    applies_to: ["POST /amnesty/programs"]
  - priority: 25
    category: business_temporal
    rule: "the agreement's lookback_start_date may not precede date(window_open_at) minus AmnestyProgram.lookback_months whole months, and lookback_end_date must not precede lookback_start_date"
    error_id: ERR_LOOKBACK_EXCEEDS_PROGRAM_LIMIT
    http_status: 422
    applies_to: ["POST /amnesty/agreements", "POST /amnesty/agreements/{id}/amend"]
  - priority: 26
    category: business_temporal
    rule: "a return period must sit inside the agreement's inclusive lookback window: period_start_date >= lookback_start_date and period_end_date <= lookback_end_date"
    error_id: ERR_PERIOD_OUTSIDE_LOOKBACK
    http_status: 422
    applies_to: ["POST /amnesty/agreements/{id}/returns"]
  - priority: 27
    category: business_temporal
    rule: "a return period must sit inside the half-open eligible window of its ProgramTaxTypeTerm: period_start_date >= eligible_period_start and period_end_date < eligible_period_end"
    error_id: ERR_PERIOD_OUTSIDE_ELIGIBLE_WINDOW
    http_status: 422
    applies_to: ["POST /amnesty/agreements/{id}/returns"]
  - priority: 28
    category: business_temporal
    rule: "the last generated installment due_date may not exceed date(window_close_at) plus INSTALLMENT_HORIZON_DAYS"
    error_id: ERR_INSTALLMENT_HORIZON_EXCEEDED
    http_status: 422
    applies_to: ["POST /amnesty/payment-plans/{id}/approve"]
  - priority: 29
    category: business_constraint
    rule: "return periods are CLOSED intervals and may not overlap another non-VOIDED return of the same agreement and tax_type; touching endpoints (new_start == existing_end) overlap, adjacency (new_start == existing_end + 1 day) does not"
    error_id: ERR_RETURN_PERIOD_OVERLAP
    http_status: 409
    applies_to: ["POST /amnesty/agreements/{id}/returns"]
  - priority: 30
    category: business_constraint
    rule: "ProgramTaxTypeTerm windows are HALF-OPEN [start, end) and may not overlap another term of the same program and tax_type; touching endpoints (new_start == existing_end) are allowed"
    error_id: ERR_TAX_TYPE_TERM_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /amnesty/programs/{id}/tax-type-terms"]
  - priority: 31
    category: business_constraint
    rule: "a representative may post at most MAX_REPRESENTATIVE_COUNTERS (3) counters on one pre-clearance"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: ["POST /amnesty/pre-clearances/{id}/counter"]
  - priority: 32
    category: business_constraint
    rule: "a program with no ProgramTaxTypeTerm rows may not open"
    error_id: ERR_NO_ELIGIBLE_TAX_TYPE_TERMS
    http_status: 422
    applies_to: ["POST /amnesty/programs/{id}/open"]
  - priority: 33
    category: business_constraint
    rule: "installment_count must be within 1..AmnestyProgram.installment_max_count, and a LUMP_SUM plan must declare installment_count == 1"
    error_id: ERR_INVALID_INSTALLMENT_COUNT
    http_status: 422
    applies_to: ["POST /amnesty/payment-plans"]
  - priority: 34
    category: business_constraint
    rule: "every generated installment amount must be >= MIN_INSTALLMENT_CENTS"
    error_id: ERR_INSTALLMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: ["POST /amnesty/payment-plans/{id}/approve"]
  - priority: 35
    category: business_constraint
    rule: "certifying compliance requires at least one DisclosureReturn on the agreement and every non-VOIDED return to be SETTLED, and requires clock_now >= compliance_due_at"
    error_id: "ERR_NO_DISCLOSURE_RETURNS | ERR_RETURNS_NOT_SETTLED | ERR_COMPLIANCE_PERIOD_NOT_ELAPSED"
    http_status: 422
    applies_to: ["POST /amnesty/agreements/{id}/certify-compliance"]
  - priority: 36
    category: business_referential
    rule: "when pre_clearance_id is supplied it must have status ACCEPTED"
    error_id: ERR_PRECLEARANCE_NOT_ACCEPTED
    http_status: 422
    applies_to: ["POST /amnesty/agreements"]
  - priority: 37
    category: business_referential
    rule: "when pre_clearance_id is supplied its disclosed_taxpayer_id must equal the agreement's taxpayer_id"
    error_id: ERR_PRECLEARANCE_TAXPAYER_MISMATCH
    http_status: 422
    applies_to: ["POST /amnesty/agreements"]
  - priority: 38
    category: business_referential
    rule: "every member of tax_types must have a ProgramTaxTypeTerm on the program, and a return's tax_type must be a member of its agreement's tax_types"
    error_id: "ERR_TAX_TYPE_NOT_IN_PROGRAM | ERR_TAX_TYPE_NOT_IN_AGREEMENT"
    http_status: 422
    applies_to: ["POST /amnesty/agreements", "POST /amnesty/agreements/{id}/returns"]
  - priority: 39
    category: business_referential
    rule: "a ProgramTaxTypeTerm with requires_prior_nonfiler == true only accepts returns with is_nonfiler_period == true"
    error_id: ERR_NONFILER_PERIOD_REQUIRED
    http_status: 422
    applies_to: ["POST /amnesty/agreements/{id}/returns"]
  - priority: 40
    category: business_fiscal
    rule: "reported_tax_cents must be >= the ProgramTaxTypeTerm.min_liability_cents of its tax type"
    error_id: ERR_BELOW_MINIMUM_LIABILITY
    http_status: 422
    applies_to: ["POST /amnesty/agreements/{id}/returns"]
  - priority: 41
    category: business_fiscal
    rule: "down_payment_cents must be >= round_half_up(agreement.total_due_cents * MIN_DOWN_PAYMENT_PCT)"
    error_id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: ["POST /amnesty/payment-plans"]
  - priority: 42
    category: business_fiscal
    rule: "approving a plan requires agreement.paid_total_cents >= plan.down_payment_cents"
    error_id: ERR_DOWN_PAYMENT_NOT_RECEIVED
    http_status: 422
    applies_to: ["POST /amnesty/payment-plans/{id}/approve"]
  - priority: 43
    category: business_fiscal
    rule: "a payment may not exceed the agreement's outstanding amount: amount_cents <= total_due_cents - paid_total_cents; the ceiling is not enforced while the agreement has no non-VOIDED DisclosureReturn in status FILED, ASSESSED, SETTLED or REINSTATED, because a pre-filing down payment has nothing to be measured against and lands wholly in unapplied_credit_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: ["POST /amnesty/payments"]
  - priority: 44
    category: business_fiscal
    rule: "reversing a payment may not drop agreement.paid_total_cents below agreement.down_payment_applied_cents"
    error_id: ERR_REVERSAL_BREAKS_DOWN_PAYMENT
    http_status: 422
    applies_to: ["POST /amnesty/payments/{id}/reverse"]

# =============================================================================
# §1.5 API Endpoint Table
# Fields suffixed with ? are optional; every other input field is required.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- programs
  - method: POST
    path: /amnesty/programs
    purpose: "Design an amnesty program with its window, lookback limit, base waiver terms, revenue forecast and post-program multiplier"
    input: ["name", "window_open_at", "window_close_at", "lookback_months", "base_penalty_waiver_pct", "base_interest_waiver_pct", "post_program_penalty_multiplier", "revenue_forecast_cents", "prospective_compliance_months?", "installment_max_count?"]
    output: AmnestyProgram
    side_effects: ["creates AmnestyProgram in DRAFT with all computed totals at 0"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_INVALID_PROGRAM_WINDOW]
  - method: GET
    path: /amnesty/programs
    purpose: "List programs"
    input: ["status?", "limit?", "offset?"]
    output: AmnestyProgram[]
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Representative, Taxpayer]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_PAGINATION]
  - method: GET
    path: /amnesty/programs/{id}
    purpose: "Read one program with its live revenue and participation counters"
    input: []
    output: AmnestyProgram
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Representative, Taxpayer]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND]
  - method: POST
    path: /amnesty/programs/{id}/tax-type-terms
    purpose: "Attach an eligible tax type, its eligible period window and its waiver overrides to a draft program"
    input: ["tax_type", "eligible_period_start", "eligible_period_end", "min_liability_cents", "penalty_waiver_pct?", "interest_waiver_pct?", "requires_prior_nonfiler?"]
    output: ProgramTaxTypeTerm
    side_effects: ["creates ProgramTaxTypeTerm bound to the program"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_DRAFT, ERR_TAX_TYPE_TERM_WINDOW_OVERLAP]
  - method: GET
    path: /amnesty/programs/{id}/tax-type-terms
    purpose: "List the eligible tax type terms of a program (FK reverse lookup for ProgramTaxTypeTerm.program_id)"
    input: ["tax_type?", "limit?", "offset?"]
    output: ProgramTaxTypeTerm[]
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Representative, Taxpayer]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_INVALID_PAGINATION]
  - method: GET
    path: /amnesty/tax-type-terms/{id}
    purpose: "Read one eligible tax type term"
    input: []
    output: ProgramTaxTypeTerm
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Representative, Taxpayer]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TAX_TYPE_TERM_NOT_FOUND]
  - method: POST
    path: /amnesty/programs/{id}/open
    purpose: "Open the program window for participation"
    input: []
    output: AmnestyProgram
    side_effects: ["status := OPEN", "increments AmnestyProgram.version by 1"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_NOT_DRAFT, ERR_NO_ELIGIBLE_TAX_TYPE_TERMS, ERR_PROGRAM_WINDOW_CLOSED]
  - method: POST
    path: /amnesty/programs/{id}/close
    purpose: "Close the program window, expire unfinished pre-clearances, lapse unexecuted agreements and flag non-participants"
    input: []
    output: AmnestyProgram
    side_effects: ["status := CLOSED; closed_at := clock_now", "expires PreClearanceRequest rows in SUBMITTED, UNDER_REVIEW, TERMS_OFFERED or COUNTERED", "flags the identified taxpayers of expired requests as non-participants and recomputes their escalation_tier and compliance_behavior_score", "lapses DRAFTED agreements and voids their DRAFT returns", "recomputes nonparticipant_count", "increments AmnestyProgram.version by 1"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_NOT_OPEN, ERR_PROGRAM_WINDOW_NOT_ELAPSED]
  - method: POST
    path: /amnesty/programs/{id}/reconcile
    purpose: "Freeze the program's revenue realization against forecast"
    input: []
    output: AmnestyProgram
    side_effects: ["status := RECONCILED", "final_realization_pct := realization_pct at this instant", "increments AmnestyProgram.version by 1"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_PROGRAM_NOT_CLOSED]
  - method: POST
    path: /amnesty/programs/{id}/installment-sweep
    purpose: "Age the installment schedules of the program: mark overdue installments LATE, then default those past the grace period together with their plans"
    input: []
    output: "{ marked_late_count: integer, defaulted_installment_count: integer, defaulted_plan_count: integer }"
    side_effects: ["step 1: every SCHEDULED installment with due_date < clock_now date becomes LATE", "step 2: every LATE installment with due_date + INSTALLMENT_GRACE_DAYS_LATE < clock_now date becomes DEFAULTED and its ACTIVE plan becomes DEFAULTED with default_reason SWEEP_GRACE_EXPIRED", "step 3: the remaining SCHEDULED or LATE installments of a defaulted plan become DEFAULTED", "agreements of defaulted plans get payment_status := DELINQUENT", "increments Installment.version, PaymentPlan.version and VoluntaryDisclosureAgreement.version by 1 on every touched row"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND]
  - method: GET
    path: /amnesty/programs/{id}/revenue-summary
    purpose: "Report collections against forecast plus the compliance behavior analysis under both score variants"
    input: []
    output: "{ collected_cents: integer, revenue_forecast_cents: integer, realization_pct: number, forecast_status: string, waived_total_cents: integer, reinstated_total_cents: integer, participant_count: integer, nonparticipant_count: integer, avg_historical_score: integer, avg_program_adjusted_score: integer }"
    side_effects: []
    roles: [ProgramAdministrator, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND]

  # ---------------------------------------------------------------- taxpayers
  - method: POST
    path: /amnesty/taxpayers
    purpose: "Register a taxpayer in the amnesty registry"
    input: ["legal_name", "taxpayer_type", "tin_last4", "is_registered?"]
    output: Taxpayer
    side_effects: ["creates Taxpayer with escalation_tier T0 and compliance_behavior_score 100"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /amnesty/taxpayers
    purpose: "List taxpayers"
    input: ["nonparticipant_flag?", "escalation_tier?", "limit?", "offset?"]
    output: Taxpayer[]
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_PAGINATION]
  - method: GET
    path: /amnesty/taxpayers/{id}
    purpose: "Read one taxpayer with the persisted HISTORICAL behavior score and escalation tier"
    input: []
    output: Taxpayer
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Taxpayer]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_IDENTITY_NOT_RECOGNIZED, ERR_TAXPAYER_NOT_FOUND, ERR_NOT_RESOURCE_OWNER]
  - method: GET
    path: /amnesty/taxpayers/{id}/compliance-behavior
    purpose: "Report the taxpayer's behavior score under both variants with the component breakdown"
    input: []
    output: "{ taxpayer_id: string, historical_score: integer, program_adjusted_score: integer, open_case_count: integer, referred_case_count: integer, nonfiler_period_count: integer, forgiven_nonfiler_period_count: integer, open_enforcement_action_count: integer, nonparticipant_flag: boolean, escalation_tier: string }"
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TAXPAYER_NOT_FOUND]
  - method: GET
    path: /amnesty/taxpayers/{id}/enforcement-cases
    purpose: "List the audit and investigation cases of a taxpayer (FK reverse lookup for EnforcementCase.taxpayer_id)"
    input: ["status?", "case_type?", "limit?", "offset?"]
    output: EnforcementCase[]
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TAXPAYER_NOT_FOUND, ERR_INVALID_PAGINATION]

  # ---------------------------------------------------------- enforcement cases
  - method: POST
    path: /amnesty/enforcement-cases
    purpose: "Open an audit, investigation or collection case that gates program eligibility"
    input: ["taxpayer_id", "case_type", "tax_type", "opened_at"]
    output: EnforcementCase
    side_effects: ["creates EnforcementCase in OPEN; opened_by_user_id := X-User-ID", "recomputes Taxpayer.open_case_count, escalation_tier and compliance_behavior_score"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_TAXPAYER_NOT_FOUND]
  - method: GET
    path: /amnesty/enforcement-cases/{id}
    purpose: "Read one enforcement case"
    input: []
    output: EnforcementCase
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENFORCEMENT_CASE_NOT_FOUND]
  - method: POST
    path: /amnesty/enforcement-cases/{id}/close
    purpose: "Close an enforcement case, which unblocks program eligibility for that taxpayer"
    input: []
    output: EnforcementCase
    side_effects: ["status := CLOSED; closed_at := clock_now", "recomputes Taxpayer.open_case_count, escalation_tier and compliance_behavior_score", "increments EnforcementCase.version by 1"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENFORCEMENT_CASE_NOT_FOUND, ERR_CASE_NOT_OPEN]
  - method: POST
    path: /amnesty/enforcement-cases/{id}/refer
    purpose: "Refer an enforcement case out of the amnesty channel; the taxpayer keeps a heavier behavior penalty"
    input: []
    output: EnforcementCase
    side_effects: ["status := REFERRED", "recomputes Taxpayer.open_case_count, escalation_tier and compliance_behavior_score with REFERRED_CASE_PENALTY", "increments EnforcementCase.version by 1"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENFORCEMENT_CASE_NOT_FOUND, ERR_CASE_NOT_OPEN]

  # ------------------------------------------------------------ representatives
  - method: POST
    path: /amnesty/representatives
    purpose: "Register a representative who may mediate anonymous pre-clearance"
    input: ["firm_name", "bar_number"]
    output: Representative
    side_effects: ["creates Representative in ACTIVE"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /amnesty/representatives/{id}
    purpose: "Read one representative"
    input: []
    output: Representative
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor, Representative]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REPRESENTATIVE_NOT_FOUND]
  - method: POST
    path: /amnesty/representatives/{id}/suspend
    purpose: "Suspend a representative, blocking further negotiation activity"
    input: []
    output: Representative
    side_effects: ["status := SUSPENDED", "increments Representative.version by 1"]
    roles: [ProgramAdministrator]
