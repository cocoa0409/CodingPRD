            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-25T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/false-alarm-incidents/${inc3}", payload: {}, as: AlarmUser, as_user_id: "${site_id}", captures: {inc3_v: $.data.version}}
            - {call: "POST /false-alarm-program/appeals", payload: {false_alarm_incident_id: "${inc3}", grounds: "WRONG_CAUSE_CODE", narrative: "The cause code was recorded before the technician report arrived.", expected_false_alarm_incident_version: "${inc3_v}"}, as: AlarmUser, as_user_id: "${site_id}", captures: {appeal1: $.data.id}}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-10T09:00:00Z", session_end: "2026-03-10T12:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {docket1: $.data.id}}
            - {call: "GET /false-alarm-program/hearing-dockets/${docket1}", payload: {}, as: HearingOfficer, as_user_id: "ho-2507", captures: {docket1_v: $.data.version}}
            - {call: "POST /false-alarm-program/appeals/${appeal1}/schedule", payload: {hearing_docket_id: "${docket1}", expected_hearing_docket_version: "${docket1_v}"}, as: HearingOfficer, as_user_id: "ho-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-10T10:00:00Z"}, as: ProgramAdministrator}
