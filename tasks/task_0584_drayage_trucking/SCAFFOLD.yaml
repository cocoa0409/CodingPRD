# =============================================================================
# PRD Benchmark Scaffold — Drayage & Container Trucking (port/rail)
# Difficulty: Expert
# =============================================================================

scenario: |
  584. Drayage & Container Trucking (port/rail): container/booking & chassis
  assignment, port/terminal appointment & last-free-day, demurrage/per-diem
  accrual, driver dispatch & street turn, scale/overweight & permit,
  accessorial (chassis/pre-pull), POD & invoice, empty return

domain_name: drayage-trucking
api_prefix: ""            # flat topology: resources are peer top-level collections (/bookings, /chassis, /drivers, /terminals, /appointments, /legs, /weigh-tickets, /permits, /invoices) rooted at "/"

complexity_profile:
  primary_archetype: ledger_reconciliation      # demurrage (terminal, Booking) vs per-diem (equipment, Chassis): two chronological accrual ledgers, different baselines/rates
  secondary_archetype: quota_allocation          # chassis pool + terminal appointment-slot capacity
  complexity_layers:
    - dual_variant_calculation                   # estimate vs actual (demurrage); provisional vs final (per-diem)
    - cascading_side_effects                      # empty-return and cancel cascades span Leg -> Chassis -> Booking -> Invoice
    - rate_threshold_triggers                     # LFD day boundary, free-day boundary, overweight limit
    - optimistic_concurrency                      # chassis (re)assignment supersede on Booking.version

  entity_topology: flat                          # peer resources linked by FK; shared pools (Chassis/Driver/Terminal) not owned by any Booking
  state_machine_shape: cyclic                    # Booking APPOINTED<->CHASSIS_ASSIGNED re-appointment loop; Leg branch on completion type
  relationship_patterns:
    - one_to_many                                # Booking -> Appointments/Legs/WeighTickets/Permits/Invoice
    - cross_aggregate                            # Booking references shared Chassis/Terminal; Leg references Driver/Appointment
    - polymorphic                                # Leg.leg_type {PICKUP,RETURN,STREET_TURN} drives divergent side-effects
  role_model: peer_roles                         # Dispatcher owns operations; Biller owns billing; Driver acts only on own Legs
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Port/rail terminal name" }
      - { name: code, type: string, source: input, description: "Terminal / firms code" }
      - { name: demurrage_daily_rate_cents, type: integer, source: input, description: "Base demurrage rate per calendar day past LFD, before port fee", constraints: ">= 0" }
      - { name: slot_capacity_per_window, type: integer, source: input, default: 1, description: "Max BOOKED appointments allowed to overlap the same [window_start, window_end) at this terminal", constraints: ">= 1" }

  - name: Chassis
    parent: null
    common_fields: true
    fields:
      - { name: chassis_number, type: string, source: input, description: "Chassis unit number" }
      - { name: pool_scac, type: string, source: input, description: "Chassis pool owner code" }
      - { name: per_diem_rate_cents, type: integer, source: input, description: "Per-diem rate per day held past free days", constraints: ">= 0" }
      - { name: free_days, type: integer, source: input, default: 4, description: "Free days out before per-diem begins accruing", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | OUT", default: AVAILABLE, constraints: "AVAILABLE(init), ASSIGNED(assign), OUT(pickup dispatch), back to AVAILABLE(release/return)" }
      - { name: assigned_out_at, type: datetime, source: system, description: "Logical-clock instant chassis went OUT (pickup dispatched); null while not OUT" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock instant chassis returned to AVAILABLE via empty return; null until then" }
      - { name: per_diem_provisional_cents, type: integer, source: computed, description: "Per-diem accrued as of the current logical clock while OUT (see calc per_diem_accrued, provisional variant); 0 when not OUT" }
      - { name: per_diem_final_cents, type: integer, source: computed, description: "Per-diem finalized at empty return using returned_at (see calc per_diem_accrued, final variant); 0 until returned" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Driver full name" }
      - { name: license_number, type: string, source: input, description: "Driver license / CDL number" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | INACTIVE — dispatch requires ACTIVE", constraints: "both values settable at create" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: container_number, type: string, source: input, description: "Container/equipment number" }
      - { name: direction, type: enum, source: input, description: "IMPORT | EXPORT" }
      - { name: container_size, type: enum, source: input, default: D40, description: "D20 | D40 | HC40" }
      - { name: origin_terminal_id, type: string, source: input, description: "FK -> Terminal.id; port/rail terminal of pickup/return" }
      - { name: chassis_id, type: string, source: system, description: "FK -> Chassis.id; null until assign-chassis; set/superseded by assign-chassis" }
      - { name: last_free_day, type: datetime, source: input, description: "LFD as ISO8601 UTC; demurrage accrues for each calendar day strictly after this date" }
      - { name: linehaul_base_cents, type: integer, source: input, description: "Base linehaul trucking rate for the move", constraints: ">= 0" }
      - { name: gross_weight_lbs, type: integer, source: system, description: "Latest weighed gross weight (from most recent WeighTicket); null until weighed" }
      - { name: requires_permit, type: boolean, source: computed, default: false, description: "True once any overweight WeighTicket exists (gross_weight_lbs > LEGAL_LIMIT_LBS)" }
      - { name: scheduled_pickup_at, type: datetime, source: system, description: "window_start of the current PICKUP Appointment; basis for demurrage estimate; null until first PICKUP appointment" }
      - { name: actual_pickup_at, type: datetime, source: system, description: "Logical-clock instant the PICKUP leg was dispatched; basis for demurrage actual; null until pickup dispatch" }
      - { name: demurrage_estimate_cents, type: integer, source: computed, description: "Forward-looking demurrage locked at first PICKUP appointment using scheduled_pickup_at (see calc demurrage_accrued, estimate variant); 0 until then" }
      - { name: demurrage_actual_cents, type: integer, source: computed, description: "Chronological demurrage finalized at pickup dispatch using actual_pickup_at (see calc demurrage_accrued, actual variant); 0 until then" }
      - { name: per_diem_final_cents, type: integer, source: computed, description: "Mirror of the assigned Chassis.per_diem_final_cents, stamped when the booking reaches EMPTY_RETURNED; 0 until then" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFIRMED | CHASSIS_ASSIGNED | APPOINTED | DISPATCHED | DELIVERED | EMPTY_RETURNED | CANCELED", constraints: "terminal: EMPTY_RETURNED, CANCELED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: purpose, type: enum, source: input, description: "PICKUP | RETURN" }
      - { name: window_start, type: datetime, source: input, description: "Appointment window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Appointment window end (exclusive)" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | USED | CANCELED", constraints: "BOOKED(init), USED(consumed by leg dispatch), CANCELED(cancel)" }

  - name: Leg
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; required when leg_type=PICKUP, optional otherwise" }
      - { name: linked_export_booking_id, type: string, source: input, description: "FK -> Booking.id; required when leg_type=STREET_TURN — the export booking receiving the reused empty/chassis" }
      - { name: leg_type, type: enum, source: input, description: "PICKUP | RETURN | STREET_TURN" }
      - { name: window_start, type: datetime, source: input, description: "Planned move start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Planned move end (inclusive)" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | DISPATCHED | COMPLETED | CANCELED", constraints: "terminal: COMPLETED, CANCELED" }

  - name: WeighTicket
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Weighed gross vehicle+container weight in pounds", constraints: ">= 0" }
      - { name: is_overweight, type: boolean, source: computed, description: "True iff gross_weight_lbs > LEGAL_LIMIT_LBS (strict) — see calc overweight_check" }
      - { name: weighed_at, type: datetime, source: system, description: "Logical-clock instant recorded" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: permit_number, type: string, source: input, description: "Overweight/oversize permit number" }
      - { name: max_gross_weight_lbs, type: integer, source: input, description: "Maximum gross weight the permit authorizes", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED", constraints: "REQUESTED(init), APPROVED(approve)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: linehaul_base_cents, type: integer, source: computed, description: "Snapshot of Booking.linehaul_base_cents at generation" }
      - { name: effective_linehaul_cents, type: integer, source: computed, description: "linehaul after volume discount (see calc invoice_total)" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "round_half_up(effective_linehaul_cents * FUEL_PCT)" }
      - { name: accessorials_total_cents, type: integer, source: computed, description: "Sum of amount_cents over ACTIVE AccessorialCharges of this invoice" }
      - { name: demurrage_cents, type: integer, source: computed, description: "Snapshot of Booking.demurrage_actual_cents at generation" }
      - { name: per_diem_cents, type: integer, source: computed, description: "Snapshot of Booking.per_diem_final_cents at generation (0 if booking not yet EMPTY_RETURNED)" }
      - { name: total_charge_cents, type: integer, source: computed, description: "max(subtotal, MIN_CHARGE_CENTS); recomputed on every accessorial add/void while DRAFT (see calc invoice_total)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED", constraints: "DRAFT(init), ISSUED(issue); accessorials editable only while DRAFT" }

  - name: AccessorialCharge
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id (from path)" }
      - { name: kind, type: enum, source: input, description: "CHASSIS_RENTAL | PRE_PULL | STORAGE | HAZMAT | REEFER" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | VOIDED", constraints: "ACTIVE(init), VOIDED(void)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Booking
    field: status
    initial_state: DRAFT
    terminal_states: [EMPTY_RETURNED, CANCELED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Dispatcher
        preconditions: ["booking exists and is DRAFT"]
        side_effects: ["increments Booking.version by 1"]

      - from: CONFIRMED
        to: CHASSIS_ASSIGNED
        trigger: "POST /bookings/{id}/assign-chassis"
        actor: Dispatcher
        preconditions:
          - "expected_booking_version equals Booking.version (OCC)"
          - "target Chassis exists and is AVAILABLE"
        side_effects:
          - "sets Booking.chassis_id to the target chassis"
          - "target Chassis.status AVAILABLE -> ASSIGNED"
          - "increments Booking.version by 1"

      - from: CHASSIS_ASSIGNED
        to: CHASSIS_ASSIGNED
        trigger: "POST /bookings/{id}/assign-chassis (re-assign / supersede)"
        actor: Dispatcher
        preconditions:
          - "expected_booking_version equals Booking.version (OCC)"
          - "target Chassis exists and is AVAILABLE"
        side_effects:
          - "previously assigned Chassis.status ASSIGNED -> AVAILABLE (released)"
          - "sets Booking.chassis_id to the new chassis; new Chassis.status AVAILABLE -> ASSIGNED"
          - "increments Booking.version by 1"
        note: "CREATE-with-supersede — the OCC race guarded by concurrency_rules[chassis-assign-stale-booking]"

      - from: CHASSIS_ASSIGNED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/release-chassis"
        actor: Dispatcher
        preconditions: ["Chassis.status is ASSIGNED (not yet OUT)"]
        side_effects:
          - "assigned Chassis.status ASSIGNED -> AVAILABLE"
          - "clears Booking.chassis_id"
          - "increments Booking.version by 1"

      - from: CHASSIS_ASSIGNED
        to: APPOINTED
        trigger: "POST /appointments (purpose=PICKUP for this booking)"
        actor: Dispatcher
        preconditions: ["terminal slot capacity not exhausted for the window (see validation p10)"]
        side_effects:
          - "sets Booking.scheduled_pickup_at = Appointment.window_start"
          - "computes and locks Booking.demurrage_estimate_cents (calc demurrage_accrued, estimate variant)"
          - "increments Booking.version by 1"

      - from: APPOINTED
        to: CHASSIS_ASSIGNED
        trigger: "POST /appointments/{id}/cancel (the current PICKUP appointment)"
        actor: Dispatcher
        preconditions: ["no non-terminal PICKUP Leg exists for this booking"]
        side_effects:
          - "Appointment.status BOOKED -> CANCELED"
          - "clears Booking.scheduled_pickup_at (re-appointment loop; demurrage_estimate_cents retained as the original locked projection)"
          - "increments Booking.version by 1"
        note: "cycle APPOINTED -> CHASSIS_ASSIGNED -> APPOINTED (re-appointment / revision loop)"

      - from: APPOINTED
        to: DISPATCHED
        trigger: "POST /legs/{id}/dispatch (the PICKUP leg)"
        actor: Dispatcher
        preconditions:
          - "Booking.chassis_id set and that Chassis.status is ASSIGNED"
          - "linked Appointment.status is BOOKED"
          - "assigned Driver.status is ACTIVE"
          - "if Booking.requires_permit: an APPROVED Permit exists for the booking (business_safety)"
          - "current logical clock < Appointment.window_end (not expired)"
        side_effects:
          - "Leg.status PLANNED -> DISPATCHED"
          - "Appointment.status BOOKED -> USED"
          - "assigned Chassis.status ASSIGNED -> OUT; sets Chassis.assigned_out_at = current clock"
          - "sets Booking.actual_pickup_at = current clock"
          - "computes Booking.demurrage_actual_cents (calc demurrage_accrued, actual variant)"
          - "increments Booking.version by 1"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /legs/{id}/complete (the PICKUP leg — POD captured)"
        actor: "Dispatcher or Driver (owner)"
        preconditions: ["Leg.status is DISPATCHED", "Leg.leg_type is PICKUP"]
        side_effects:
          - "Leg.status DISPATCHED -> COMPLETED (POD recorded)"
          - "increments Booking.version by 1"

      - from: DELIVERED
        to: EMPTY_RETURNED
        trigger: "system: RETURN leg completed (chassis returned) — see Leg COMPLETED cascade"
        actor: system
        preconditions: ["assigned Chassis transitioned OUT -> AVAILABLE via empty return"]
        side_effects:
          - "stamps Booking.per_diem_final_cents = Chassis.per_diem_final_cents"
          - "increments Booking.version by 1"
        note: "cascade link 3: caused by the Chassis OUT->AVAILABLE transition, itself caused by the RETURN Leg completion"

      - from: [DRAFT, CONFIRMED, CHASSIS_ASSIGNED, APPOINTED, DISPATCHED, DELIVERED]
        to: CANCELED
        trigger: "POST /bookings/{id}/cancel"
        actor: Dispatcher
        preconditions: ["booking is not already terminal"]
        side_effects:
          - "cascade: every non-terminal Leg of this booking -> CANCELED (each Leg's own CANCELED side-effects then fire)"
          - "increments Booking.version by 1"
        note: "cascade origin: Booking -> Leg -> Chassis"

  - entity: Chassis
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /bookings/{id}/assign-chassis"
        actor: Dispatcher
        preconditions: ["Chassis.status is AVAILABLE"]
        side_effects: ["increments Chassis.version by 1"]
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /bookings/{id}/release-chassis, or booking cancel before pickup"
        actor: "Dispatcher or system"
        preconditions: []
        side_effects: ["increments Chassis.version by 1"]
      - from: ASSIGNED
        to: OUT
        trigger: "POST /legs/{id}/dispatch (PICKUP)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "sets assigned_out_at = current clock"
          - "increments Chassis.version by 1"
      - from: OUT
        to: AVAILABLE
        trigger: "system: RETURN leg completed"
        actor: system
        preconditions: []
        side_effects:
          - "sets returned_at = current clock"
          - "finalizes per_diem_final_cents (calc per_diem_accrued, final variant)"
          - "cascade: stamps the linked Booking (b.chassis_id == this.id) per_diem_final_cents and advances that Booking DELIVERED -> EMPTY_RETURNED"
          - "increments Chassis.version by 1"
        note: "cascade link 2 -> link 3"

  - entity: Appointment
    field: status
    initial_state: BOOKED
    terminal_states: [USED, CANCELED]
    transitions:
      - from: BOOKED
        to: USED
        trigger: "POST /legs/{id}/dispatch (PICKUP leg linked to this appointment)"
        actor: Dispatcher
        preconditions: ["current clock < window_end"]
        side_effects: ["increments Appointment.version by 1"]
      - from: BOOKED
        to: CANCELED
        trigger: "POST /appointments/{id}/cancel"
        actor: Dispatcher
        preconditions: ["no non-terminal PICKUP Leg references this appointment"]
        side_effects:
          - "if purpose=PICKUP: reverts owning Booking APPOINTED -> CHASSIS_ASSIGNED"
          - "increments Appointment.version by 1"

  - entity: Leg
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /legs/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "cross-entity gates per leg_type (see Booking APPOINTED->DISPATCHED for PICKUP)"
          - "assigned Driver.status is ACTIVE"
        side_effects: ["per-leg_type effects (PICKUP: chassis OUT, demurrage_actual)", "increments Leg.version by 1"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /legs/{id}/complete (leg_type=PICKUP)"
        actor: "Dispatcher or Driver (owner)"
        preconditions: ["Leg.leg_type is PICKUP"]
        side_effects:
          - "POD recorded; owning Booking DISPATCHED -> DELIVERED"
          - "increments Leg.version by 1"
        note: "branch A"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /legs/{id}/complete (leg_type=RETURN)"
        actor: "Dispatcher or Driver (owner)"
        preconditions: ["Leg.leg_type is RETURN", "owning Booking is DELIVERED", "assigned Chassis.status is OUT"]
        side_effects:
          - "cascade link 1: assigned Chassis.status OUT -> AVAILABLE (which finalizes per-diem and advances Booking -> EMPTY_RETURNED)"
          - "increments Leg.version by 1"
        note: "branch B — divergent from branch A: releases chassis, finalizes per-diem, empties the booking"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /legs/{id}/complete (leg_type=STREET_TURN)"
        actor: "Dispatcher or Driver (owner)"
        preconditions: ["Leg.leg_type is STREET_TURN", "owning Booking is DELIVERED", "linked_export_booking_id refers to an EXPORT Booking in CONFIRMED"]
        side_effects:
          - "owning (import) Booking DELIVERED -> EMPTY_RETURNED WITHOUT returning the chassis to the terminal (empty reused)"
          - "assigned Chassis stays OUT and is reassigned: export Booking.chassis_id = this chassis; export Booking CONFIRMED -> CHASSIS_ASSIGNED"
          - "import Booking.per_diem_final_cents stamped from Chassis.per_diem_final_cents computed as of current clock (per-diem continues to accrue under the export booking)"
          - "increments Leg.version by 1"
        note: "branch C — divergent from B: chassis NOT returned; per-diem liability transfers to the export booking"
      - from: [PLANNED, DISPATCHED]
        to: CANCELED
        trigger: "POST /legs/{id}/cancel, or system (owning booking canceled)"
        actor: "Dispatcher or system"
        preconditions: []
        side_effects:
          - "if this leg had taken its Chassis OUT (PICKUP dispatched) and the chassis is still OUT: Chassis.status OUT -> AVAILABLE, returned_at = current clock, per-diem finalized"
          - "increments Leg.version by 1"
        note: "cascade link 2 (from Booking cancel): Leg cancel releases the chassis it took OUT"

  - entity: Permit
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /permits/{id}/approve"
        actor: Dispatcher
        preconditions: ["Permit.status is REQUESTED"]
        side_effects: ["increments Permit.version by 1"]

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: Biller
        preconditions: ["Invoice.status is DRAFT"]
        side_effects: ["freezes accessorials (no further add/void)", "increments Invoice.version by 1"]

  - entity: AccessorialCharge
    field: status
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /invoices/{id}/accessorials/{accessorial_id}/void"
        actor: Biller
        preconditions: ["parent Invoice.status is DRAFT"]
        side_effects:
          - "recomputes parent Invoice.accessorials_total_cents and Invoice.total_charge_cents (calc invoice_total)"
          - "increments AccessorialCharge.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: chassis-assign-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/assign-chassis"
    occ_field: "expected_booking_version"
    description: |
      Assigning (or re-assigning/superseding) a Chassis to a Booking whose
      version has advanced since the client last observed it is rejected. This
      captures the case where a prior assign already set or superseded the
      chassis and advanced Booking.version, so the current writer's view of the
      booking is stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: demurrage_accrued
    trigger: "estimate: first PICKUP appointment booked (Booking CHASSIS_ASSIGNED->APPOINTED); actual: pickup leg dispatched (Booking APPOINTED->DISPATCHED)"
    algorithm: chronological
    formula: |
      # per-day charge (round-per-day BEFORE summing is the pinned order):
      per_day_charge = round_half_up(Terminal.demurrage_daily_rate_cents * (1 + PORT_FEE_PCT))
      # calendar days STRICTLY after LFD, counted by UTC date:
      demurrage_days(basis) = max(0, date(basis) - date(Booking.last_free_day))   # in whole days
      amount = per_day_charge * demurrage_days(basis)
      # PINNED ORDER: multiply the already-rounded per_day_charge by the integer
      # day count. Do NOT compute round_half_up(rate * (1+PORT_FEE_PCT) * days).
    input_set: "the Booking's origin Terminal supplies demurrage_daily_rate_cents; the day count is over the single Booking"
    constants:
      PORT_FEE_PCT: 0.075
    precision: "cents, round_half_up on the per-day charge only"
    variants:
      - name: estimate
        when: "locked when the first PICKUP Appointment is booked"
        difference: "basis = Booking.scheduled_pickup_at (Appointment.window_start); stored in demurrage_estimate_cents and NOT recomputed on re-appointment"
      - name: actual
        when: "computed when the PICKUP leg is dispatched"
        difference: "basis = Booking.actual_pickup_at (logical clock at dispatch); stored in demurrage_actual_cents"

  - name: per_diem_accrued
    trigger: "provisional: on read of Chassis while OUT; final: when a RETURN leg completes (Chassis OUT->AVAILABLE) or the pickup leg is canceled"
    algorithm: chronological
    formula: |
      days_out(basis) = max(0, date(basis) - date(Chassis.assigned_out_at))       # whole UTC days
      per_diem_days(basis) = max(0, days_out(basis) - Chassis.free_days)
      amount = Chassis.per_diem_rate_cents * per_diem_days(basis)
    input_set: "single Chassis; assigned_out_at set at pickup dispatch"
    constants: {}
    precision: "cents (rate is integer per whole day)"
    variants:
      - name: provisional
        when: "Chassis.status == OUT, read at current clock"
        difference: "basis = current logical clock; written to per_diem_provisional_cents"
      - name: final
        when: "empty return (Chassis OUT->AVAILABLE)"
        difference: "basis = Chassis.returned_at; written to per_diem_final_cents and mirrored to Booking.per_diem_final_cents"

  - name: invoice_total
    trigger: "on invoice generation and on every accessorial add/void while Invoice is DRAFT"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER: discount -> fuel -> sum -> floor
      effective_linehaul_cents = Booking.linehaul_base_cents
      if Booking.linehaul_base_cents >= VOLUME_THRESHOLD_CENTS:
          effective_linehaul_cents = round_half_up(Booking.linehaul_base_cents * (1 - VOLUME_DISCOUNT_PCT))
      fuel_surcharge_cents   = round_half_up(effective_linehaul_cents * FUEL_PCT)
      accessorials_total     = sum(a.amount_cents for a in AccessorialCharge where a.invoice_id == Invoice.id and a.status == ACTIVE)
      demurrage_cents        = Booking.demurrage_actual_cents      # snapshot
      per_diem_cents         = Booking.per_diem_final_cents        # snapshot (0 unless EMPTY_RETURNED)
      subtotal               = effective_linehaul_cents + fuel_surcharge_cents + accessorials_total + demurrage_cents + per_diem_cents
      total_charge_cents     = max(subtotal, MIN_CHARGE_CENTS)
    input_set: "one Invoice, its ACTIVE AccessorialCharges, and its Booking's finalized demurrage/per-diem snapshots"
    constants:
      FUEL_PCT: 0.22
      MIN_CHARGE_CENTS: 50000
      VOLUME_THRESHOLD_CENTS: 100000
      VOLUME_DISCOUNT_PCT: 0.10
    precision: "cents, round_half_up on discount and on fuel surcharge independently"

  - name: overweight_check
    trigger: "POST /weigh-tickets"
    algorithm: threshold
    formula: |
      is_overweight = (gross_weight_lbs > LEGAL_LIMIT_LBS)   # strict '>' — 80000 is legal, 80001 is over
      # side effect: sets Booking.gross_weight_lbs = gross_weight_lbs;
      # Booking.requires_permit becomes true once any overweight ticket exists.
    input_set: "single WeighTicket; updates its Booking"
    constants:
      LEGAL_LIMIT_LBS: 80000
    precision: "integer pounds"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "role is permitted for the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "path resources and body FK references exist (left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, integers >= 0, window_start < window_end; PICKUP leg supplies appointment_id; STREET_TURN leg supplies linked_export_booking_id; assign-chassis supplies expected_booking_version"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"

  - priority: 5
    category: auth
    check: "ownership — when acting as Driver on a Leg, Leg.driver_id must equal X-User-ID"
    error_id: ERR_LEG_NOT_OWNED
    http_status: 403
    applies_to: "POST /legs/{id}/complete"

  - priority: 6
    category: state
    check: "target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "if Booking.requires_permit, an APPROVED Permit for the booking exists before the PICKUP leg is dispatched"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /legs/{id}/dispatch"

  - priority: 8
    category: business_referential
    check: "referenced entity is in the required state: assign-chassis target Chassis is AVAILABLE (ERR_CHASSIS_UNAVAILABLE); pickup dispatch Booking.chassis is ASSIGNED (ERR_CHASSIS_NOT_ASSIGNED); linked Appointment is BOOKED (ERR_APPOINTMENT_NOT_BOOKED); assigned Driver is ACTIVE (ERR_DRIVER_INACTIVE)"
    error_id: ERR_CHASSIS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/assign-chassis, POST /legs/{id}/dispatch"

  - priority: 9
    category: business_temporal
    check: "current logical clock is before the linked Appointment.window_end (appointment not expired)"
    error_id: ERR_APPOINTMENT_EXPIRED
    http_status: 422
    applies_to: "POST /legs/{id}/dispatch"

  - priority: 10
    category: business_constraint
    check: "terminal appointment-slot overlap: count of BOOKED appointments on the terminal whose [window_start, window_end) intersects the requested window must be < Terminal.slot_capacity_per_window (half-open; adjacent windows do NOT collide)"
    error_id: ERR_APPOINTMENT_SLOT_FULL
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 11
    category: business_constraint
    check: "driver double-book: for the requested Leg driver, no non-terminal Leg exists whose closed [window_start, window_end] plus a DRIVER_TURNAROUND_BUFFER_MIN buffer overlaps the requested window"
    error_id: ERR_DRIVER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /legs"

  - priority: 12
    category: business_fiscal
    check: "invoice generation requires Booking.status in {DELIVERED, EMPTY_RETURNED} and no existing invoice for the booking; accessorial add/void requires parent Invoice DRAFT"
    error_id: ERR_NOT_INVOICEABLE
    http_status: 409
    applies_to: "POST /invoices, POST /invoices/{id}/accessorials, POST /invoices/{id}/accessorials/{accessorial_id}/void"

  - priority: 13
    category: state
    check: "OCC — expected_booking_version equals current Booking.version"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/assign-chassis"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock."
    roles: [Dispatcher]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets logical clock used by all demurrage/per-diem/appointment/LFD rules"]

  # ---- Terminals ----
  - method: POST
    path: "/terminals"
    description: "Register a terminal"
    roles: [Dispatcher]
    code: 201
    input: [name, code, demurrage_daily_rate_cents, "slot_capacity_per_window?"]
    output: Terminal
    side_effects: []
  - method: GET
    path: "/terminals/{id}"
    description: "Get a terminal"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  # ---- Chassis ----
  - method: POST
    path: "/chassis"
    description: "Register a chassis into the pool (AVAILABLE)"
    roles: [Dispatcher]
    code: 201
    input: [chassis_number, pool_scac, per_diem_rate_cents, "free_days?"]
    output: Chassis
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/chassis/{id}"
    description: "Get a chassis; per_diem_provisional_cents reflects the current logical clock while OUT"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Chassis
    side_effects: ["computes per_diem_provisional_cents at read time (calc per_diem_accrued, provisional variant)"]

  # ---- Drivers ----
  - method: POST
    path: "/drivers"
    description: "Register a driver"
    roles: [Dispatcher]
    code: 201
    input: [name, license_number, "status?"]
    output: Driver
    side_effects: []
  - method: GET
    path: "/drivers/{id}"
    description: "Get a driver"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []

  # ---- Bookings ----
  - method: POST
    path: "/bookings"
    description: "Create a container booking (DRAFT)"
    roles: [Dispatcher]
    code: 201
    input: [container_number, direction, origin_terminal_id, last_free_day, linehaul_base_cents, "container_size?"]
    output: Booking
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking with derived demurrage/per-diem fields"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings (reverse-reachability for Terminal and Chassis FKs)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: ["origin_terminal_id?", "chassis_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Confirm a booking"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects: ["status DRAFT -> CONFIRMED", "increments Booking.version by 1"]
  - method: POST
    path: "/bookings/{id}/assign-chassis"
    description: "Assign (or supersede) the chassis for a booking; OCC-guarded"
    roles: [Dispatcher]
    code: 200
    input: [chassis_id, expected_booking_version]
    output: Booking
    side_effects:
      - "releases any previously assigned chassis (ASSIGNED -> AVAILABLE)"
      - "target Chassis AVAILABLE -> ASSIGNED; sets Booking.chassis_id; status -> CHASSIS_ASSIGNED"
      - "increments Booking.version by 1"
  - method: POST
    path: "/bookings/{id}/release-chassis"
    description: "Release the assigned chassis before pickup (compensating action)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "assigned Chassis ASSIGNED -> AVAILABLE; clears Booking.chassis_id; status CHASSIS_ASSIGNED -> CONFIRMED"
      - "increments Booking.version by 1"
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking (cascades to legs and chassis)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> CANCELED"
      - "cascade: non-terminal Legs -> CANCELED; a canceled PICKUP leg releases its OUT chassis -> AVAILABLE"
      - "increments Booking.version by 1"

  # ---- Weigh tickets ----
  - method: POST
    path: "/weigh-tickets"
    description: "Record a scale weigh ticket; computes overweight and updates booking"
    roles: [Dispatcher]
    code: 201
    input: [booking_id, gross_weight_lbs]
    output: WeighTicket
    side_effects:
      - "computes is_overweight (calc overweight_check)"
      - "sets Booking.gross_weight_lbs; if overweight sets Booking.requires_permit = true"
  - method: GET
    path: "/weigh-tickets/{id}"
    description: "Get a weigh ticket"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: WeighTicket
    side_effects: []
  - method: GET
    path: "/weigh-tickets"
    description: "List weigh tickets (reverse-reachability for Booking FK)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: WeighTicket[]
    side_effects: []

  # ---- Appointments ----
  - method: POST
    path: "/appointments"
    description: "Book a terminal appointment window for a booking"
    roles: [Dispatcher]
    code: 201
    input: [booking_id, terminal_id, purpose, window_start, window_end]
    output: Appointment
    side_effects:
      - "status=BOOKED"
      - "if purpose=PICKUP and booking is CHASSIS_ASSIGNED: booking -> APPOINTED, sets scheduled_pickup_at, locks demurrage_estimate_cents"
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments (reverse-reachability for Booking and Terminal FKs)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: ["booking_id?", "terminal_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel an appointment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> CANCELED", "if PICKUP: owning booking APPOINTED -> CHASSIS_ASSIGNED"]

  # ---- Legs ----
  - method: POST
    path: "/legs"
    description: "Create a dispatch leg (PLANNED)"
    roles: [Dispatcher]
    code: 201
    input: [booking_id, driver_id, leg_type, window_start, window_end, "appointment_id?", "linked_export_booking_id?"]
    output: Leg
    side_effects: ["status=PLANNED", "validates driver double-book with buffer"]
  - method: GET
    path: "/legs/{id}"
    description: "Get a leg"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Leg
    side_effects: []
  - method: GET
    path: "/legs"
    description: "List legs (reverse-reachability for Booking, Driver, Appointment, export-booking FKs)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: ["booking_id?", "driver_id?", "appointment_id?", "linked_export_booking_id?", "limit?", "offset?"]
    output: Leg[]
    side_effects: []
  - method: POST
    path: "/legs/{id}/dispatch"
    description: "Dispatch a leg (all cross-entity gates apply)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Leg
    side_effects: ["status PLANNED -> DISPATCHED; per-leg_type effects", "increments Leg.version by 1"]
  - method: POST
    path: "/legs/{id}/complete"
    description: "Complete a leg (POD for PICKUP; empty return for RETURN; street turn for STREET_TURN)"
    roles: [Dispatcher, Driver]
    code: 200
    input: []
    output: Leg
    side_effects: ["status DISPATCHED -> COMPLETED; divergent side-effects per leg_type", "increments Leg.version by 1"]
  - method: POST
    path: "/legs/{id}/cancel"
    description: "Cancel a leg"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Leg
    side_effects: ["status -> CANCELED; releases an OUT chassis it had taken", "increments Leg.version by 1"]

  # ---- Permits ----
  - method: POST
    path: "/permits"
    description: "Request an overweight permit for a booking"
    roles: [Dispatcher]
    code: 201
    input: [booking_id, permit_number, max_gross_weight_lbs]
    output: Permit
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/permits/{id}"
    description: "Get a permit"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List permits (reverse-reachability for Booking FK)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/approve"
    description: "Approve a permit"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Permit
    side_effects: ["status REQUESTED -> APPROVED", "increments Permit.version by 1"]

  # ---- Invoices ----
  - method: POST
    path: "/invoices"
    description: "Generate an invoice for a booking (computes all line items)"
    roles: [Biller]
    code: 201
    input: [booking_id]
    output: Invoice
    side_effects: ["status=DRAFT; computes line items and total_charge_cents (calc invoice_total)"]
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices (reverse-reachability for Booking FK)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue (freeze) an invoice"
    roles: [Biller]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status DRAFT -> ISSUED", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/accessorials"
    description: "Add an accessorial charge line to a DRAFT invoice"
    roles: [Biller]
    code: 201
    input: [kind, amount_cents]
    output: AccessorialCharge
    side_effects: ["status=ACTIVE; recomputes Invoice.accessorials_total_cents and total_charge_cents"]
  - method: GET
    path: "/invoices/{id}/accessorials"
    description: "List accessorial charges of an invoice (reverse-reachability for Invoice FK)"
    roles: [Dispatcher, Biller, Driver]
    code: 200
    input: []
    output: AccessorialCharge[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/accessorials/{accessorial_id}/void"
    description: "Void an accessorial charge (compensating action) on a DRAFT invoice"
    roles: [Biller]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: ["status ACTIVE -> VOIDED; recomputes Invoice.accessorials_total_cents and total_charge_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_LEG_NOT_OWNED, http: 403, condition: "Driver acting on a Leg whose driver_id != X-User-ID" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, negative integer, window_start >= window_end, missing appointment_id on PICKUP, missing linked_export_booking_id on STREET_TURN, missing expected_booking_version" }
  - { id: ERR_TERMINAL_NOT_FOUND, http: 404, condition: "Referenced terminal does not exist" }
  - { id: ERR_CHASSIS_NOT_FOUND, http: 404, condition: "Referenced chassis does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Referenced driver does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Referenced booking does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Referenced appointment does not exist" }
  - { id: ERR_LEG_NOT_FOUND, http: 404, condition: "Referenced leg does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Referenced permit does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Referenced invoice does not exist" }
  - { id: ERR_WEIGH_TICKET_NOT_FOUND, http: 404, condition: "Referenced weigh ticket does not exist" }
  - { id: ERR_ACCESSORIAL_NOT_FOUND, http: 404, condition: "Referenced accessorial charge does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_PERMIT_REQUIRED, http: 422, condition: "Overweight booking dispatched without an APPROVED permit" }
  - { id: ERR_CHASSIS_UNAVAILABLE, http: 409, condition: "assign-chassis target chassis is not AVAILABLE" }
  - { id: ERR_CHASSIS_NOT_ASSIGNED, http: 409, condition: "Pickup dispatch but booking chassis is not ASSIGNED" }
  - { id: ERR_APPOINTMENT_NOT_BOOKED, http: 409, condition: "Linked appointment is not in BOOKED status at dispatch" }
  - { id: ERR_DRIVER_INACTIVE, http: 409, condition: "Assigned driver is INACTIVE at dispatch" }
  - { id: ERR_APPOINTMENT_EXPIRED, http: 422, condition: "Current logical clock is at/after the appointment window_end" }
  - { id: ERR_APPOINTMENT_SLOT_FULL, http: 409, condition: "Terminal slot capacity for the overlapping window is exhausted" }
  - { id: ERR_DRIVER_UNAVAILABLE, http: 409, condition: "Driver already committed to an overlapping leg within the turnaround buffer" }
  - { id: ERR_NOT_INVOICEABLE, http: 409, condition: "Invoice generation on a non-invoiceable booking, duplicate invoice, or accessorial edit on a non-DRAFT invoice" }
  - { id: ERR_STALE_BOOKING_VERSION, http: 412, condition: "expected_booking_version does not match current Booking.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Operations: terminals, chassis, drivers, bookings, chassis assignment, appointments, legs, weigh tickets, permits, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /terminals"
      - "POST /chassis"
      - "POST /drivers"
      - "POST /bookings"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/assign-chassis"
      - "POST /bookings/{id}/release-chassis"
      - "POST /bookings/{id}/cancel"
      - "POST /weigh-tickets"
      - "POST /appointments"
      - "POST /appointments/{id}/cancel"
      - "POST /legs"
      - "POST /legs/{id}/dispatch"
      - "POST /legs/{id}/cancel"
      - "POST /permits"
      - "POST /permits/{id}/approve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /legs/{id}/complete (shared with Driver-owner)"
      - "all GET reads"
  - name: Driver
    description: "Field driver; may complete only their own assigned legs (POD/empty return/street turn)."
    identity: "entity_backed:Driver"
    exclusive_operations: []
    shared_operations:
      - "POST /legs/{id}/complete (only when Leg.driver_id == X-User-ID)"
      - "all GET reads"
  - name: Biller
    description: "Billing: invoice generation, issuance, and accessorial charge management."
    identity: opaque
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/accessorials"
      - "POST /invoices/{id}/accessorials/{accessorial_id}/void"
    shared_operations:
      - "all GET reads"
