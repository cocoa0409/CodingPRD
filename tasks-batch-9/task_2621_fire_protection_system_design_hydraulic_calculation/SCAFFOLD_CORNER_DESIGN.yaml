      - name: chain_restart_recomputes_the_active_window_in_index_order
        claim_type: chronological
        grounds:
          - calculations.pipe_sizing_chain
          - entities.HydraulicCalculation.fields.chain_start_index
          - entities.PipeSizingIteration.fields.in_active_chain
        excluded_because:
          difficulty_instance: non_linear_state_machine / calculation_pressure_deficient_restart_loop_reconverges_on_new_chain
          rationale: "That instance restarts the chain after a PRESSURE_DEFICIENT close and asserts the abandoned rows keep in_active_chain false while the new window re-accumulates from its own end_head_psi."

      - name: auxiliary_roll_up_is_correct_after_an_add_and_after_a_reversal
        claim_type: aggregation
        grounds:
          - calculations.project_demand_ledger
          - entities.Project.fields.total_system_demand_gpm
        excluded_because:
          difficulty_instance: compensating_invariant / auxiliary_withdrawal_returns_the_demand_ledger_to_its_exact_prior_total
          rationale: "The add-then-reverse round trip on the roll-up (2130.0 -> 2610.0 -> 2130.0) is exactly that instance's invariant."

      - name: pump_rating_walks_the_catalogue_to_the_first_rating_at_or_above_demand
        claim_type: waterfall_allocation
        grounds:
          - calculations.fire_pump_sizing
          - entities.FirePump.fields.rated_flow_gpm
          - entities.FirePump.fields.rated_pressure_psi
        excluded_because:
          difficulty_instance: combinatorial_formula / fire_pump_sizing_catalogue_step_churn_and_150_pct_combination
          rationale: "The catalogue step, the suction figure taken at the rated flow, the 5 psi pressure step with its 40 psi floor and all four verdict branches are asserted numerically there."

      - name: same_hazard_area_yields_different_demand_under_the_two_methods
        claim_type: variant_divergence
        grounds:
          - calculations.hazard_design_demand.variants
          - entities.HydraulicCalculation.fields.method
        excluded_because:
          difficulty_instance: dual_variant_calc / hazard_demand_area_density_versus_room_design_divergence
          rationale: "Two calculations over one hazard area, AREA_DENSITY at 247.5 gpm against ROOM_DESIGN at 198.0 gpm plus the 45.0 gpm opening penalty, are compared side by side there."

      - name: evaluation_basis_selects_which_supply_figures_are_used
        claim_type: variant_selection
        grounds:
          - calculations.water_supply_availability.variants
          - entities.WaterSupplyEvaluation.fields.evaluation_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / supply_basis_raw_versus_seasonal_flips_margin_verdict
          rationale: "That instance derives both bases from the same FlowTest row and asserts the derated triple (70.0 / 54.0 / 2025.0) against the raw one, including the verdict flip."

      - name: preliminary_and_final_evaluations_reconcile_across_the_converging_chain
        claim_type: reconciliation
        grounds:
          - calculations.water_supply_availability
          - entities.WaterSupplyEvaluation.fields.pinned_calculation_iteration_count
