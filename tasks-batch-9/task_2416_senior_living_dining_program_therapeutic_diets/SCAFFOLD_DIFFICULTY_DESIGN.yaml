            - "hop 2: ${rev_trigger_obs} == ${obs2_id} and ${rev_score} == 75.00 and PlanOfCareReview.${rev_id}.trigger_reason == WEIGHT_LOSS_30D"
            - "hop 3: DietOrder.${do_id}.review_status == REREVIEW_REQUIRED while DietOrder.${do_id}.clinical_status == ACTIVE"
