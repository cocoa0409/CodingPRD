            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per2_id}", memo_narrative: "Sep-2026 re-estimate after August redemptions", sensitivity_low_bp: 6761, sensitivity_high_bp: 7761 }
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
              captures: { e2_id: $.data.id }
            - call: "POST /breakage-estimates/${e2_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: "u_acct_1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v2: $.data.version }
            - call: "POST /breakage-estimates/${e2_id}/approve"
              payload: { expected_program_version: "${prog_v2}" }
              as: Controller
              as_user_id: "u_ctrl_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
