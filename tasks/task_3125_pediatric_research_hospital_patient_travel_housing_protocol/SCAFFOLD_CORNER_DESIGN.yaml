# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3125
# Breadth probe over §1.1–§1.7. Corners already carried by §1.8 appear as
# excluded_because: stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_referral_returns_computed_alias_and_age
        claim_type: Creation
        grounds:
          - entities.Referral
          - entities.Referral.fields.eligibility_alias
          - entities.Referral.fields.computed_age_years
          - endpoints.POST_/programs/referrals
        distinguishing_aspect: "A referral created with only the declared inputs comes back 201 in SUBMITTED with version 1, the system-minted id, and two derived fields the client never supplied: eligibility_alias \"ava-reyes\" and computed_age_years 11 against the 2026-09-01 clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001 exists; the database holds no referrals."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_id: $.data.id }
              - call: "POST /programs/clinical-protocols/${protocol_id}/open"
                payload: {}
                as: ProtocolCoordinator
                captures: { protocol_v0: $.data.version }
          trigger:
              - call: "POST /programs/referrals"
                payload: { protocol_id: "${protocol_id}", child_name: "Ava  Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
                as: IntakeCoordinator
                captures: { ref_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Referral.${ref_id}.child_name == \"Ava  Reyes\" and eligibility_alias == \"ava-reyes\", so internal whitespace runs collapse to one hyphen"
            - "Referral.${ref_id}.computed_age_years == 11 for a 2015-04-01 birth date at the 2026-09-01 clock"
            - "Referral.${ref_id}.status == SUBMITTED and applied_tier == PENDING"
            - "Referral.${ref_id}.version == 1 and screening_fee_cents == 0 before any screen"
            - "the response data carries non-null id, created_at and updated_at, and meta.api_request_id is present"

      - name: entity_get_protocol_round_trips_declared_fields
        claim_type: Retrieval
        grounds:
          - entities.ClinicalProtocol
          - endpoints.GET_/programs/clinical-protocols/{id}
          - entities.ClinicalProtocol.fields.age_tier
          - entities.ClinicalProtocol.fields.mental_capacity_floor
        distinguishing_aspect: "Every declared protocol field round-trips through GET exactly as posted, and the two derived band fields read MIXED and 7 for a 5-to-17 age band, since the band straddles the paediatric boundary and the floor is max(age_min_years, 7)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a fund and one DRAFT protocol with a 5-to-17 age band."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_id: $.data.id }
          trigger:
              - call: "GET /programs/clinical-protocols/${protocol_id}"
                payload: {}
                as: Any
          assert:
            - "the response status is 200"
            - "ClinicalProtocol.${protocol_id}.protocol_code == \"ALL-INT-001\" and disease_group == \"ALL\""
            - "ClinicalProtocol.${protocol_id}.age_min_years == 5 and age_max_years == 17"
            - "ClinicalProtocol.${protocol_id}.required_stage == NEWLY_DIAGNOSED"
            - "ClinicalProtocol.${protocol_id}.capacity == 8 and enrolled_count == 0"
            - "ClinicalProtocol.${protocol_id}.protocol_budget_cents == 10000000 and reserved_cents == 0 and available_cents == 10000000"
            - "ClinicalProtocol.${protocol_id}.age_tier == MIXED and mental_capacity_floor == 7"

      - name: entity_list_housing_assignments_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/programs/housing-assignments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three assignments on file, limit 2 offset 0 returns two rows with total_count 3 and has_more true, and offset 2 returns the remaining row with has_more false, so total_count counts the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one arrived enrolment with three SCHEDULED assignments on non-overlapping windows."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_id: $.data.id }
              - call: "POST /programs/clinical-protocols/${protocol_id}/open"
                payload: {}
                as: ProtocolCoordinator
                captures: { protocol_v0: $.data.version }
              - call: "POST /programs/housing-facilities"
                payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 6, buffer_beds: 0 }
                as: HousingCoordinator
                captures: { fac_id: $.data.id }
              - call: "POST /programs/referrals"
                payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
                as: IntakeCoordinator
                captures: { ref_id: $.data.id }
              - call: "POST /programs/referrals/${ref_id}/screen"
                payload: { expected_protocol_version: "${protocol_v0}" }
                as: IntakeCoordinator
                captures: { ref_v: $.data.version }
              - call: "POST /programs/referrals/${ref_id}/arrive"
                payload: { expected_referral_version: "${ref_v}" }
                as: IntakeCoordinator
                captures: { enr_id: $.data.enrollment_id }
          trigger:
              - call: "POST /programs/housing-assignments"
                payload: { enrollment_id: "${enr_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", buffer_window_days: 1 }
                as: HousingCoordinator
                captures: { ha_1_id: $.data.id }
              - call: "POST /programs/housing-assignments"
                payload: { enrollment_id: "${enr_id}", start_at: "2026-09-06T00:00:00Z", end_at: "2026-09-10T00:00:00Z", buffer_window_days: 1 }
                as: HousingCoordinator
                captures: { ha_2_id: $.data.id }
              - call: "POST /programs/housing-assignments"
                payload: { enrollment_id: "${enr_id}", start_at: "2026-09-11T00:00:00Z", end_at: "2026-09-15T00:00:00Z", buffer_window_days: 1 }
                as: HousingCoordinator
                captures: { ha_3_id: $.data.id }
              - call: "GET /programs/housing-assignments?enrollment_id=${enr_id}&limit=2&offset=0"
                payload: {}
                as: Any
              - call: "GET /programs/housing-assignments?enrollment_id=${enr_id}&limit=2&offset=2"
                payload: {}
                as: Any
              - call: "GET /programs/housing-assignments"
                payload: {}
                as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "the filtered list returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"
            - "each of the three rows carries status SCHEDULED and the three windows do not overlap"

      - name: entity_get_referral_with_unknown_id_returns_referral_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/programs/referrals/{id}
          - errors.ERR_REFERRAL_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the path produces the entity-specific 404 ERR_REFERRAL_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; no referral has been created."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
          trigger:
              - call: "GET /programs/referrals/00000000-0000-4000-8000-000000000000"
                payload: {}
                as: Any
                captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_REFERRAL_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "the id is rejected on existence alone, before any state or business check"

      - name: entity_create_protocol_without_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ClinicalProtocol.fields.capacity
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "capacity is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 409 duplicate or a 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a fund exists."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
          trigger:
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-NOCAP", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000 }
                as: ProtocolCoordinator
                captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_DUPLICATE_ENTITY and != ERR_FUND_NOT_FOUND"
            - "GET /programs/clinical-protocols?fund_id=${fund_id} returns 0 rows"

      - name: entity_create_fund_defaults_optional_donations_to_zero
        claim_type: Defaults
        grounds:
          - entities.ResearchFund.fields.fundraising_raised_cents
          - entities.ResearchFund.fields.federal_grant_cents
          - entities.ResearchFund.fields.patient_support_balance_cents
        distinguishing_aspect: "fundraising_raised_cents and federal_grant_cents each declare a default of 0, so a fund created without them stores 0 rather than null and derives two pools of 0 from the split."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
          trigger:
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-EMPTY", fiscal_year: 2026, research_allocation_pct: 0.5 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ResearchFund.${fund_id}.fundraising_raised_cents == 0 and federal_grant_cents == 0"
            - "ResearchFund.${fund_id}.research_balance_cents == 0 and patient_support_balance_cents == 0"
            - "the omitted fields are stored as the integer 0 rather than null"

      - name: entity_create_facility_extra_field_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.HousingFacility.fields.status
          - endpoints.POST_/programs/housing-facilities
        distinguishing_aspect: "HousingFacility.status is source system with initial state OPEN, so a client that sends status CLOSED is ignored: the row is created OPEN with version 1 and the facility stays in the selector pool."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
          trigger:
              - call: "POST /programs/housing-facilities"
                payload: { facility_code: "ONC-99", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0, status: "CLOSED", version: 99 }
                as: HousingCoordinator
                captures: { fac_id: $.data.id }
          assert:
            - "the response status is 201"
            - "HousingFacility.${fac_id}.status == OPEN, so the supplied CLOSED was ignored"
            - "HousingFacility.${fac_id}.version == 1, so the supplied version was ignored"
            - "HousingFacility.${fac_id}.is_on_campus == true and is_partner_site == false"
            - "HousingFacility.${fac_id}.status == OPEN, so the facility is eligible for selection"

      - name: entity_create_facility_with_out_of_enum_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.HousingFacility.fields.tier
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "tier is a closed four-member enum, so a value such as HOTEL_SUITE is rejected with 400 ERR_INVALID_REQUEST rather than silently creating a residence of an unknown class."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
          trigger:
              - call: "POST /programs/housing-facilities"
                payload: { facility_code: "BAD-01", name: "Nowhere", tier: "HOTEL_SUITE", total_beds: 4, buffer_beds: 0 }
                as: HousingCoordinator
                captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /programs/housing-facilities returns 0 rows, so nothing was persisted"
            - "no facility of an undeclared tier is reachable through the selector"

      - name: entity_create_second_protocol_with_same_code_returns_duplicate_entity
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - errors.ERR_DUPLICATE_ENTITY
          - entities.ClinicalProtocol.fields.protocol_code
        distinguishing_aspect: "protocol_code is unique across the program, so a second protocol carrying ALL-INT-001 is rejected at the uniqueness priority with 409 ERR_DUPLICATE_ENTITY even when the fund and every other field differ."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one protocol ALL-INT-001 already exists on fund SJ-FY26."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_first_id: $.data.id }
          trigger:
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 1, age_max_years: 4, required_stage: "RELAPSED", protocol_budget_cents: 2000000, capacity: 3 }
                as: ProtocolCoordinator
                captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_ENTITY"
            - "error_id != ERR_INVALID_REQUEST and != ERR_PROTOCOL_NOT_FOUND"
            - "GET /programs/clinical-protocols?fund_id=${fund_id} returns exactly 1 row"
            - "ClinicalProtocol.${protocol_first_id}.protocol_code is still ALL-INT-001"

      - name: entity_pledge_body_fk_fails_before_state_check
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3.5]
          - errors.ERR_ENROLLMENT_NOT_FOUND
          - entities.FamilySupportPledge.fields.enrollment_id
        distinguishing_aspect: "The flat topology puts the enrollment reference in the request body, and the body foreign key is validated at the referential priority, so an unknown enrollment_id reports ERR_ENROLLMENT_NOT_FOUND rather than any state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001 with one arrived enrolment."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_id: $.data.id }
              - call: "POST /programs/clinical-protocols/${protocol_id}/open"
                payload: {}
                as: ProtocolCoordinator
                captures: { protocol_v0: $.data.version }
              - call: "POST /programs/referrals"
                payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
                as: IntakeCoordinator
                captures: { ref_id: $.data.id }
              - call: "POST /programs/referrals/${ref_id}/screen"
                payload: { expected_protocol_version: "${protocol_v0}" }
                as: IntakeCoordinator
                captures: { ref_v: $.data.version }
              - call: "POST /programs/referrals/${ref_id}/arrive"
                payload: { expected_referral_version: "${ref_v}" }
                as: IntakeCoordinator
                captures: { enr_id: $.data.enrollment_id }
          trigger:
              - call: "POST /programs/family-support-pledges"
                payload: { enrollment_id: "00000000-0000-4000-8000-000000000000", patient_support_budget_cents: 400000 }
                as: PatientSupportOfficer
                captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ENROLLMENT_NOT_FOUND"
            - "GET /programs/family-support-pledges?enrollment_id=${enr_id} returns 0 rows"
            - "the referential check at priority 3.5 fired before any state check on the pledge"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_screen_from_declined_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Referral.SUBMITTED_to_DECLINED
          - errors.ERR_REFERRAL_NOT_SUBMITTED
          - validations[priority=6]
        distinguishing_aspect: "From DECLINED the screen trigger is not in the transition list, so re-screening a declined referral in place is rejected with ERR_REFERRAL_NOT_SUBMITTED and no fee or reservation moves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001; a referral declined for an age outside the band."
          setup_api_calls:
              - call: "POST /_clock/set_current_utc"
                payload: { current_utc: "2026-09-01T00:00:00Z" }
                as: PlatformAdmin
              - call: "POST /programs/research-funds"
                payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
                as: PlatformAdmin
                captures: { fund_id: $.data.id }
              - call: "POST /programs/clinical-protocols"
                payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
                as: ProtocolCoordinator
                captures: { protocol_id: $.data.id }
              - call: "POST /programs/clinical-protocols/${protocol_id}/open"
                payload: {}
                as: ProtocolCoordinator
                captures: { protocol_v0: $.data.version }
              - call: "POST /programs/referrals"
                payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 200, is_immunosuppressed: false, insurance_coverage_cents: 4000000 }
                as: IntakeCoordinator
                captures: { ref_id: $.data.id }
          trigger:
              - call: "POST /programs/referrals/${ref_id}/screen"
                payload: { expected_protocol_version: "${protocol_v0}" }
                as: IntakeCoordinator
                captures: { decline_reason: $.data.decline_reason }
              - call: "POST /programs/referrals/${ref_id}/screen"
                payload: { expected_protocol_version: "${protocol_v0}" }
                as: IntakeCoordinator
                captures: { error_id: $.data.error_id }
          assert:
            - "the first screen returns decline_reason == ELIGIBILITY_AGE"
            - "the second screen returns 409 and error_id == ERR_REFERRAL_NOT_SUBMITTED"
            - "Referral.${ref_id}.status == DECLINED and applied_tier == DECLINED after both attempts"
            - "Referral.${ref_id}.reservation_basis_cents == 0"
            - "ClinicalProtocol.${protocol_id}.reserved_cents == 0"

      - name: sm_arriving_a_referral_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Referral.ACCEPTED_to_ARRIVED
          - errors.ERR_REFERRAL_NOT_ACCEPTED
        distinguishing_aspect: "The same trigger sent twice must fail the second time: once the referral is ARRIVED the arrival precondition no longer holds, so the replay is rejected rather than creating a second enrollment."
        test_recipe:
          setup:
