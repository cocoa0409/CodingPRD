  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_allocation_sum_conserved
        grounds:
          - calculations.recovery_waterfall_allocation
          - entities.RecoveryPayment.fields.alloc_deductible_cents
          - entities.RecoveryPayment.fields.alloc_commission_cents
          - entities.RecoveryPayment.fields.alloc_carrier_cents
        distinguishing_aspect: "Conserved quantity = payment cents: alloc_deductible_cents + alloc_commission_cents + alloc_carrier_cents == amount_cents (500000 + 625000 + 1875000 == 3000000) with zero drift."
        test_recipe:
          setup:
            - "Claim SETTLED at 3000000 (deductible 500000, NET carrier 2500 bps); RecoveryPayment 3000000 RECEIVED"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Conserve Connie", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-15", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 3000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
            - call: "POST /subro/settlements/${settlement_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-2"
            - call: "POST /subro/settlements/${settlement_id}/accept"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
            - call: "POST /subro/claims/${claim_id}/recovery-payments"
              payload: { amount_cents: 3000000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /subro/recovery-payments/${pay_id}/clear"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "RecoveryPayment.${pay_id}.alloc_deductible_cents == 500000"
            - "RecoveryPayment.${pay_id}.alloc_commission_cents == 625000"
            - "RecoveryPayment.${pay_id}.alloc_carrier_cents == 1875000"
            - "RecoveryPayment.${pay_id}.alloc_deductible_cents + RecoveryPayment.${pay_id}.alloc_commission_cents + RecoveryPayment.${pay_id}.alloc_carrier_cents == 3000000"

      - name: deductible_pool_conserved_under_reverse
        grounds:
          - state_machines.RecoveryPayment.CLEARED_to_REVERSED
          - state_machines.DeductibleReimbursement.DISBURSED_to_CLAWED_BACK
          - entities.Claim.fields.deductible_reimbursed_cents
        distinguishing_aspect: "Conserved quantity = claim deductible pool (distinct from the per-payment allocation total): after disburse then payment reverse, deductible_reimbursed_cents returns to 0 so reimbursed(0) + outstanding(500000) == deductible_cents(500000); the reimbursement is CLAWED_BACK and the claim returns to SETTLED."
