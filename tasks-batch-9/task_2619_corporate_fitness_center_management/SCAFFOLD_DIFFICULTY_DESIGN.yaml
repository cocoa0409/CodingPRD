          assert:
            - "After the failed inspection: FacilityRoom.${room_a_id}.room_state == \"RESTRICTED\" AND FacilityRoom.${room_a_id}.open_deficiency_count == 1 AND FacilityRoom.${room_a_id}.last_cleanliness_score == 78"
            - "After the failed inspection: ProgramSession.${sess1_id}.status == \"STAFFED\" (outside the lock window, so no CANCELLED_FACILITY cascade)"
            - "First START -> HTTP 422 with data.error_id == \"ERR_ROOM_NOT_OPEN\""
            - "ProgramSession.${sess1_id}.status == \"STAFFED\" AND ProgramSession.${sess1_id}.started_at == null"
            - "After the passing inspection: FacilityRoom.${room_a_id}.room_state == \"OPEN\" AND FacilityRoom.${room_a_id}.open_deficiency_count == 0"
            - "Second START -> HTTP 200 AND ProgramSession.${sess1_id}.status == \"IN_PROGRESS\" AND ProgramSession.${sess1_id}.started_at == \"2026-08-05T11:50:00.000Z\""

