  # Errors (each catalog entry must be triggerable; those not exercised by
  # §1.8 or earlier corner instances get one here)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: promote_with_empty_waitlist_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_WAITLIST_EMPTY]", calculations.waitlist_promotion_order]
        distinguishing_aspect: "Promotion with a free seat but zero WAITLISTED applications returns ERR_WAITLIST_EMPTY."
