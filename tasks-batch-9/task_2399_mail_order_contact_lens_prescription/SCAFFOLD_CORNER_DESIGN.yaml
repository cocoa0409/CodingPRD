scaffold_corner_design:
  - section: entities
    instances:
      - name: insurance_plan_creation_returns_all_declared_input_fields
        claim_type: creation
        grounds:
          - entities.InsurancePlan
          - endpoints[POST /insurance-plans]
        distinguishing_aspect: "POST /insurance-plans with every declared input field returns 201 and echoes each field verbatim alongside a system-minted id, created_at, updated_at and version 1."
        test_recipe:
          setup:
            - The database is empty and the logical clock is pinned to 2026-08-01T00:00:00Z.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
          trigger:
            - call: POST /insurance-plans
              payload: { name: "VisionOne", network_status: "OUT_OF_NETWORK", annual_allowance_cents: 15000, coinsurance_rate: 0.20, requires_itemized_receipt: false, covers_shipping: false, claim_window_days: 90, plan_year_start_month_day: "01-01", status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { plan_id: "$.data.id" }
          assert:
            - "Response status is 201 and response_type is object."
            - "data.name is VisionOne, data.network_status is OUT_OF_NETWORK, data.annual_allowance_cents is 15000, data.coinsurance_rate is 0.20, data.claim_window_days is 90 and data.plan_year_start_month_day is 01-01."
            - "data.id is a non-empty uuid, data.version is 1, and data.created_at equals data.updated_at equals 2026-08-01T00:00:00.000Z."
            - "GET /insurance-plans/${plan_id} as PlatformAdmin admin-root returns the identical field values."

      - name: order_retrieval_returns_stored_price_snapshot
        claim_type: retrieval
        grounds:
          - entities.Order.fields.unit_price_cents
          - entities.Order.fields.lenses_per_box_at_capture
          - endpoints[GET /orders/{id}]
        distinguishing_aspect: "GET /orders/{id} returns the price snapshot captured at order creation, so a later product repricing is invisible to the stored order."
        test_recipe:
          setup:
            - A verified prescription backs one PENDING order for two boxes at 3200 cents each.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: "$.data.id" }
            - call: POST /prescriptions/${rx_id}/submit
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: POST /orders
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", ordered_product_id: "${p1_id}", boxes_od: 1, boxes_os: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: GET /orders/${order_id}
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Response status is 200 and data.id equals ${order_id}."
            - "data.unit_price_cents is 3200, data.lenses_per_box_at_capture is 30, data.subtotal_cents is 6400, data.shipping_cents is 0 and data.total_cents is 6400."
            - "data.verification_state is RX_CLEARED, data.fulfillment_state is PENDING, data.substitution_type is NONE and data.parameter_deviation_index is 0.0."
            - "data.fulfilled_product_id equals ${p1_id} and data.recall_flagged is false."

      - name: prescription_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /prescriptions]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three prescriptions stored, GET /prescriptions with limit 2 and offset 0 returns exactly 2 rows with total_count 3 and has_more true, while offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - One customer holds three DRAFT prescriptions with disjoint validity intervals.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-2", issue_date: "2027-07-01", expiry_date: "2028-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-3", issue_date: "2028-07-01", expiry_date: "2029-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: GET /prescriptions
              payload: { customer_id: "${cust_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: co-alpha
          assert:
            - "Response status is 200, response_type is array, and data holds exactly 2 Prescription objects."
            - "meta reports limit 2, offset 0, total_count 3 and has_more true."
            - "Repeating the call with limit 2 and offset 2 returns 1 object with total_count 3 and has_more false."
            - "Every returned object has status DRAFT, boxes_consumed 0 and verification_rounds 0."

      - name: order_not_found_returns_err_order_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /orders/{id} for a well-formed uuid that names no stored row returns 404 ERR_ORDER_NOT_FOUND, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - The database holds reference data but no orders.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
          trigger:
            - call: GET /orders/00000000-0000-0000-0000-0000000000ff
              payload: {}
              as: ComplianceOfficer
              as_user_id: co-alpha
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 404, response_type is error and data.error_id is ERR_ORDER_NOT_FOUND."
            - "data.message is present and non-empty, and meta.api_request_id is present."
            - "GET /orders as ComplianceOfficer co-alpha still returns total_count 0."

      - name: prescription_creation_missing_required_boxes_authorized_total_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Prescription.fields.boxes_authorized_total
          - validations[priority=2]
        distinguishing_aspect: "Omitting boxes_authorized_total, which has source input and no default, returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - One product and one customer exist; no prescriptions have been created.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 400 and data.error_id is ERR_INVALID_REQUEST."
            - "GET /prescriptions with customer_id=${cust_id} as ComplianceOfficer co-alpha returns total_count 0."

      - name: insurance_plan_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.InsurancePlan.fields.requires_itemized_receipt
          - entities.InsurancePlan.fields.claim_window_days
          - entities.InsurancePlan.fields.plan_year_start_month_day
        distinguishing_aspect: "Omitting the optional plan fields yields requires_itemized_receipt true, covers_shipping false, claim_window_days 90, plan_year_start_month_day 01-01 and status ACTIVE; an implementation defaulting requires_itemized_receipt to false is wrong."
        test_recipe:
          setup:
            - The database is empty and the logical clock is pinned to 2026-08-01T00:00:00Z.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
          trigger:
            - call: POST /insurance-plans
              payload: { name: "BareBones", network_status: "OUT_OF_NETWORK", annual_allowance_cents: 10000, coinsurance_rate: 0.10 }
              as: PlatformAdmin
              as_user_id: admin-root
          assert:
            - "Response status is 201, data.requires_itemized_receipt is true and data.covers_shipping is false."
            - "data.claim_window_days is 90, data.plan_year_start_month_day is 01-01 and data.status is ACTIVE."

      - name: order_total_cents_is_computed_and_client_supplied_value_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Order.fields.total_cents
          - calculations.order_total_cents
        distinguishing_aspect: "POST /orders carrying an unsolicited total_cents of 1 still stores total_cents 6400 from the order_total_cents formula, proving the field is server-computed rather than client-supplied."
        test_recipe:
          setup:
            - A verified prescription authorises 24 boxes for a 3200-cent product.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: "$.data.id" }
            - call: POST /prescriptions/${rx_id}/submit
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: POST /orders
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", ordered_product_id: "${p1_id}", boxes_od: 1, boxes_os: 1, total_cents: 1, subtotal_cents: 1, shipping_cents: 9999 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Response status is 201 and data.subtotal_cents is 6400, data.shipping_cents is 0 and data.total_cents is 6400."
            - "GET /customers/${cust_id}/ledger as Customer ${cust_id} reports lifetime_charged_cents 6400 and net_cash_position_cents 6400, so no client-supplied amount reached the ledger."

      - name: prescription_status_is_a_system_field_and_client_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Prescription.fields.status
          - state_machines.prescription_lifecycle.initial_state
        distinguishing_aspect: "POST /prescriptions asking for status VERIFIED_ACTIVE still stores DRAFT, because status has source system and the only way out of DRAFT is the submit transition."
        test_recipe:
          setup:
            - One product and one customer exist.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24, status: "VERIFIED_ACTIVE", boxes_consumed: 9, verification_rounds: 7 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: "$.data.id" }
          assert:
            - "Response status is 201, data.status is DRAFT, data.boxes_consumed is 0 and data.verification_rounds is 0."
            - "data.id was minted by the server, data.version is 1 and data.created_at is 2026-08-01T00:00:00.000Z."
            - "GET /prescriptions/${rx_id} as ComplianceOfficer co-alpha confirms status DRAFT."

      - name: prescription_creation_with_invalid_enum_capture_mode_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Prescription.fields.capture_mode
          - validations[priority=2]
        distinguishing_aspect: "capture_mode PHONE_CALL is outside the declared enum domain UPLOAD, DOCTOR_LOOKUP, SELF_REPORT, so the create returns 400 ERR_INVALID_REQUEST rather than falling back to a default mode."
        test_recipe:
          setup:
            - One product and one customer exist.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "PHONE_CALL", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 400 and data.error_id is ERR_INVALID_REQUEST."
            - "GET /prescriptions with customer_id=${cust_id} as ComplianceOfficer co-alpha returns total_count 0."

      - name: compliance_event_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ComplianceEvent
          - endpoints[GET /prescriptions/{id}/compliance-events]
        distinguishing_aspect: "ComplianceEvent declares common_fields false, so its rows carry id and occurred_at but no version and no updated_at, and the API exposes no create, update or delete endpoint for them — the only writer is a side effect."
        test_recipe:
          setup:
            - One prescription has been submitted by upload, which emits its RX_SUBMITTED compliance event.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
            - call: POST /customers
              payload: { full_name: "Ada Lin", email: "ada.lin@example.com", state_code: "UT" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { cust_id: "$.data.id" }
            - call: POST /prescriptions
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2026-07-01", expiry_date: "2027-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: "$.data.id" }
            - call: POST /prescriptions/${rx_id}/submit
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: GET /prescriptions/${rx_id}/compliance-events
              payload: { event_type: "RX_SUBMITTED" }
              as: ComplianceOfficer
              as_user_id: co-alpha
          assert:
            - "Response status is 200 and data holds exactly 1 ComplianceEvent with event_type RX_SUBMITTED and prescription_id ${rx_id}."
            - "The object exposes id, subject_type, subject_id, actor_role, actor_user_id and occurred_at 2026-08-01T00:00:00.000Z, and carries no version and no updated_at key."
            - "subject_type is Prescription, subject_id equals ${rx_id}, actor_role is Customer and actor_user_id equals ${cust_id}."

      - name: prescription_with_unknown_customer_id_returns_customer_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Prescription.fields.customer_id
          - validations[priority=5]
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "A body foreign key naming no stored Customer returns 404 ERR_CUSTOMER_NOT_FOUND under priority 5, which outranks the domain checks at priority 14 and above even though expiry_date also precedes issue_date in this payload."
        test_recipe:
          setup:
            - One product exists and no customers have been created.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /products
              payload: { brand: "AcuityFlex", name: "Daily 30", wear_schedule: "DAILY_DISPOSABLE", lenses_per_box: 30, unit_price_cents: 3200, base_curve: 8.60, diameter: 14.20, sphere_min: -8.00, sphere_max: 4.00, sphere_step: 0.25, material_family: "silicone_hydrogel" }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: POST /prescriptions
              payload: { customer_id: "00000000-0000-0000-0000-0000000000aa", product_id: "${p1_id}", capture_mode: "UPLOAD", document_reference: "scan-1", issue_date: "2027-07-01", expiry_date: "2026-07-01", od_sphere: -2.25, os_sphere: -4.00, base_curve: 8.60, diameter: 14.20, boxes_authorized_total: 24 }
              as: PlatformAdmin
              as_user_id: admin-root
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 404 and data.error_id is ERR_CUSTOMER_NOT_FOUND, not ERR_EXPIRY_BEFORE_ISSUE."
            - "GET /prescriptions as ComplianceOfficer co-alpha returns total_count 0."

      - name: reimbursement_claim_validates_all_three_foreign_keys
        claim_type: foreign_key_references
        grounds:
          - entities.ReimbursementClaim.fields.order_id
          - entities.ReimbursementClaim.fields.insurance_plan_id
          - validations[priority=5]
        distinguishing_aspect: "In this flat topology a claim carries three peer foreign keys and each is independently resolved: an unknown insurance_plan_id returns ERR_INSURANCE_PLAN_NOT_FOUND while the same call with the stored plan id succeeds, proving no key is silently ignored."
        test_recipe:
          setup:
            - A plan-covered customer has one delivered order and no claims.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-root
            - call: POST /insurance-plans
              payload: { name: "VisionOne", network_status: "OUT_OF_NETWORK", annual_allowance_cents: 15000, coinsurance_rate: 0.20, requires_itemized_receipt: false, covers_shipping: false, claim_window_days: 90, plan_year_start_month_day: "01-01" }
              as: PlatformAdmin
              as_user_id: admin-root
