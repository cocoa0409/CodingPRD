      - name: application_screening_gated_by_needs_assessment_publication
        grounds:
          - validations.priority_9.ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED
          - validations.priority_9.ERR_NO_PUBLIC_NEED
          - state_machines.NeedsAssessment
        distinguishing_aspect: |
          ENTITY PAIR: PermitApplication depends on NeedsAssessment — a third distinct pair, and the
          only one where the dependency is matched by a COMPOSITE key rather than by a direct foreign
          key: the application carries no needs_assessment_id, so the gate is satisfied by whichever
          assessment shares the application's use_area_id and season_year AND is PUBLISHED. That
          makes three separate ways to fail with the assessment row physically present: still DRAFT,
          PUBLISHED for the wrong year, and PUBLISHED with a NO_NEED finding.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01, with a DRAFT 2027 assessment (NEED_EXISTS, capacity 900) and a PUBLISHED 2026 assessment (NEED_EXISTS, capacity 900)"
            - "UseArea BRW-02, with a PUBLISHED 2027 assessment whose public_need_finding is NO_NEED"
            - "Outfitter Alpine with a SUBMITTED 2027 application on BRW-01 and a SUBMITTED 2027 application on BRW-02"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
