            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/crew-calls"
              payload: { call_type: LOAD_IN, scheduled_start: "2026-09-05T08:00:00Z", lines: [ { position: "carpenter", rate_cents_per_hour: 2000 }, { position: "rigger", rate_cents_per_hour: 2000 } ] }
              as: TourManager
              captures: { cc_id: "$.data.id "}
          trigger:
            - call: "PUT /crew-calls/${cc_id}"
              payload: { status: SETTLED, actual_lines: [ { position: "carpenter", hours_worked: 8 }, { position: "rigger", hours_worked: 8.25 } ] }
              as: TourManager
              captures: { total: "$.data.total_pay_cents "}
          assert:
            - "CrewCall.${cc_id}.total_pay_cents == 32750 (16,000 for exactly 8h + 16,750 for 8.25h = 16,000 + 750 OT)"
            - "The 8.00h line contributes zero overtime (boundary inclusive of 8 in straight time)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: performance_requires_stop_ready_or_playing
        grounds:
          - state_machines.Performance.SCHEDULED_to_PLAYED
          - validations[priority=5]
          - errors[ERR_STOP_NOT_SCHEDULABLE]
        distinguishing_aspect: |
          Pair Performance->Stop: scheduling and PLAYED are gated on the parent stop's
          booking_status being READY|PLAYING; an ADVANCED stop rejects scheduling even
          though the performance payload itself is valid.
        test_recipe:
          setup:
            - "Stop ADVANCED (tech advance begun, not yet certified)"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
          trigger:
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { err: "$.data.error_id "}
          assert:
            - "POST performance on ADVANCED stop -> ERR_STOP_NOT_SCHEDULABLE (Performance gated on Stop.booking_status)"

      - name: coverage_requires_member_contracted
        grounds:
          - state_machines.CastMember
          - validations[priority=9]
          - errors[ERR_PRINCIPAL_NOT_CONTRACTED]
        distinguishing_aspect: |
          Pair CoverageAssignment->CastMember (distinct from Performance->Stop): creating a
          coverage requires the referenced member's status == CONTRACTED; an OFFERED member
          is rejected with ERR_PRINCIPAL_NOT_CONTRACTED before any track-side logic runs.
        test_recipe:
          setup:
            - "Tour with a track (no principal yet) and one OFFERED understudy"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "U1", contract_type: UNDERSTUDY, weekly_salary_cents: 500000 }
              as: CompanyManager
              captures: { u1: "$.data.id "}
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Lead", required_covers: 1 }
              as: CompanyManager
              captures: { t1: "$.data.id "}
          trigger:
            - call: "POST /tracks/${t1}/coverages"
              payload: { cast_member_id: "${u1}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
              captures: { err: "$.data.error_id "}
          assert:
            - "POST coverage for OFFERED member -> ERR_PRINCIPAL_NOT_CONTRACTED (CoverageAssignment gated on CastMember.status)"

      - name: stop_certify_requires_all_checks_compliant
        grounds:
          - state_machines.Stop.ADVANCED_to_READY
          - entities.Stop.fields.compliance_status
          - errors[ERR_STOP_NOT_COMPLIANT]
        distinguishing_aspect: |
          Pair Stop->TechRiderCheck (distinct from both above): ADVANCED->READY requires
          every child check PASS|WAIVED with at least one check; a single FAIL child (or an
          empty check set) keeps the parent blocked.
        test_recipe:
          setup:
            - "Stop ADVANCED with one check FAILed (actual 38 < required 40); second ADVANCED stop on the same tour with NO checks"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop1: "$.data.id "}
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { tour_v2: "$.data.version "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-15", play_week_end: "2026-09-20", load_in_date: "2026-09-14", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v2}" }
              as: TourManager
              captures: { stop2: "$.data.id "}
            - call: "PUT /stops/${stop1}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop1}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop1}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk1: "$.data.id "}
            - call: "PUT /tech-checks/${chk1}"
              payload: { actual_value: 38 }
              as: TourManager
            - call: "PUT /stops/${stop2}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop2}"
              payload: { status: ADVANCED }
              as: TourManager
          trigger:
            - call: "PUT /stops/${stop1}"
              payload: { status: READY }
              as: TourManager
              captures: { err1: "$.data.error_id "}
            - call: "PUT /stops/${stop2}"
              payload: { status: READY }
              as: TourManager
              captures: { err2: "$.data.error_id "}
          assert:
            - "Certify with a FAIL child -> ERR_STOP_NOT_COMPLIANT"
            - "Certify with zero checks (compliance PENDING, empty set) -> ERR_STOP_NOT_COMPLIANT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: stop_routing_travel_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_STOP_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Tour-route resource with closed-interval-plus-buffer semantics: stop B must
          satisfy B.start > A.end + B.travel_in_days, so start == end + travel (2026-09-16
          vs week end 09-13 + 3) is REJECTED and start == end + travel + 1 (2026-09-17) is
          accepted — adjacency is not enough, the buffer is mandatory.
        test_recipe:
          setup:
            - "Tour with stop A contracted for 2026-09-07..2026-09-13"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 0, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_a: "$.data.id "}
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { tour_v2: "$.data.version "}
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-16", play_week_end: "2026-09-20", load_in_date: "2026-09-15", travel_in_days: 3, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v2}" }
              as: TourManager
              captures: { err: "$.data.error_id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-17", play_week_end: "2026-09-20", load_in_date: "2026-09-16", travel_in_days: 3, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v2}" }
              as: TourManager
              captures: { stop_b: "$.data.id "}
          assert:
            - "Stop B with start == A.end + travel_in_days (2026-09-16) -> ERR_STOP_WINDOW_CONFLICT"
            - "Stop B' with start == A.end + travel_in_days + 1 (2026-09-17) succeeds with the SAME expected_tour_version (a rejected create mutates nothing)"
            - "Stop B' booking_status == TENTATIVE"

      - name: same_day_curtain_gap
        grounds:
          - validations[priority=8]
          - errors[ERR_CURTAIN_GAP_CONFLICT]
        distinguishing_aspect: |
          Stage-day resource with different interval semantics (min-gap on clock times
          within one date, not date windows with travel buffers): the later curtain must be
          >= earlier curtain + duration + 120, so 16:49 fails and 16:50 passes against a
          14:00 curtain with a 150-minute show.
        test_recipe:
          setup:
            - "READY stop with one SCHEDULED performance 2026-09-08 14:00, duration 150"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "14:00", duration_minutes: 150 }
              as: TourManager
          trigger:
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "16:49", duration_minutes: 150 }
              as: TourManager
              captures: { err: "$.data.error_id "}
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "16:50", duration_minutes: 150 }
              as: TourManager
              captures: { perf2: "$.data.id "}
          assert:
            - "Second show at 16:49 -> ERR_CURTAIN_GAP_CONFLICT (269 min < 150 + 120)"
            - "Second show at 16:50 succeeds (270 min == duration + 120; equality passes)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_contract_cancel_identity
        grounds:
          - entities.Tour.fields.budget_available_cents
          - calculations.calc_cancellation_penalty
          - state_machines.Stop
        distinguishing_aspect: |
          Conserved budget-allocation quantity: budget_committed + budget_spent +
          budget_available == budget_total after every step, and the forward/compensating
          pair (contract guarantee 4,000,000, then cancel 61 days out at penalty 0)
          restores all three counters to their pre-pair values exactly.
        test_recipe:
          setup:
            - "Tour budget 50,000,000; logical clock at the default 2026-08-01; stop with play_week_start 2026-10-01 (61 days out), guarantee 4,000,000"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-10-01", play_week_end: "2026-10-04", load_in_date: "2026-09-29", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { committed_mid: "$.data.budget_committed_cents", available_mid: "$.data.budget_available_cents "}
          trigger:
            - call: "PUT /stops/${stop_id}"
              payload: { status: CANCELLED }
              as: Producer
              captures: { penalty: "$.data.cancellation_penalty_cents "}
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { committed_end: "$.data.budget_committed_cents", spent_end: "$.data.budget_spent_cents", available_end: "$.data.budget_available_cents "}
          assert:
            - "After contract: budget_committed_cents == 4000000 and budget_available_cents == 46000000"
            - "Cancel at 61 days out -> cancellation_penalty_cents == 0 (days_out > 60 boundary)"
            - "After cancel: budget_committed_cents == 0, budget_spent_cents == 0, budget_available_cents == 50000000 (pair nets to zero)"
            - "Invariant committed + spent + available == 50000000 holds before, mid, and after"

      - name: royalty_accrual_dispute_cycle_identity
        grounds:
          - entities.Tour.fields.royalty_accrued_cents
          - state_machines.Settlement
        distinguishing_aspect: |
          Conserved royalty-payable quantity (distinct from budget allocation): across the
          compensating pair SUBMITTED->DISPUTED->SUBMITTED the accrual is untouched (0);
          APPROVED adds royalty exactly once; PAID keeps it constant because the invariant
          counts both APPROVED and PAID.
        test_recipe:
          setup:
            - "Closed stop with settlement figures producing royalty 105,000 (audited 6,000,000 / taxes 300,000 / levies 200,000; guarantee 4,000,000; split 70; T 1,000,000; not recouped)"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf_id: "$.data.id "}
            - call: "PUT /performances/${perf_id}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
          trigger:
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { acc_submitted: "$.data.royalty_accrued_cents "}
            - call: "PUT /settlements/${s_id}"
              payload: { status: DISPUTED, dispute_reason: "audit query" }
              as: Producer
              as_user_id: prod-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { acc_after_cycle: "$.data.royalty_accrued_cents "}
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { acc_approved: "$.data.royalty_accrued_cents "}
            - call: "PUT /settlements/${s_id}"
              payload: { status: PAID }
              as: Treasurer
              as_user_id: trs-1
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { acc_paid: "$.data.royalty_accrued_cents "}
          assert:
            - "royalty_accrued_cents == 0 while SUBMITTED and after the DISPUTED->SUBMITTED cycle (compensating pair leaves the conserved quantity unchanged)"
            - "royalty_accrued_cents == 105000 after APPROVED"
            - "royalty_accrued_cents == 105000 after PAID (APPROVED and PAID both inside the invariant's input set)"
