            - { call: "POST /compliance/screening-checks/${a1}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${a2}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "TP-B", country_code: "CH", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tpb: $.data.id } }
            - { call: "POST /compliance/third-parties/${tpb}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tpb}/screening-checks", as: ComplianceOfficer, captures: { b0: "$.data[0].id", b1: "$.data[1].id", b2: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${b0}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${b1}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${b2}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/third-parties/${tpa}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 20000, fx_rate_to_usd: 1.0, event_date: "2026-05-05" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { ga1: $.data.id } }
            - { call: "POST /compliance/gift-hospitality-entries/${ga1}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tpb}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 20000, fx_rate_to_usd: 1.0, event_date: "2026-05-05" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { gb1: $.data.id } }
            - { call: "POST /compliance/gift-hospitality-entries/${gb1}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /compliance/third-parties/${tpa}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 4999, fx_rate_to_usd: 1.0, event_date: "2026-05-06" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { ga2: $.data.id, ga2_enh: $.data.requires_enhanced_approval } }
            - { call: "POST /compliance/gift-hospitality-entries/${ga2}/approve", payload: {}, as: ComplianceOfficer, captures: { ga2_st: $.data.entry_status } }
            - { call: "POST /compliance/third-parties/${tpb}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 5000, fx_rate_to_usd: 1.0, event_date: "2026-05-06" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { gb2: $.data.id, gb2_enh: $.data.requires_enhanced_approval } }
            - { call: "POST /compliance/gift-hospitality-entries/${gb2}/approve", payload: {}, as: ComplianceOfficer, captures: { gb2_err: $.data.error_id } }
          assert:
            - "captured ga2_enh == false (20000 + 4999 = 24999 < 25000) and ga2_st == APPROVED without evidence"
            - "captured gb2_enh == true (20000 + 5000 = 25000 >= 25000, inclusive boundary)"
            - "captured gb2_err == ERR_ENHANCED_REVIEW_REQUIRED when approving without enhanced_review_evidence"

