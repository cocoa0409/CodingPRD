      - name: license_fee_step_order_and_independent_caps
        claim_type: correct_result
        grounds:
          - calculations.license_fee_assessment
        excluded_because:
          difficulty_instance: license_fee_nested_caps_and_tier_multiplier
          rationale: "The fee formula's load-bearing step order (tier multiplier on the base fee only, then the capped surcharge, the floored/capped facility credit and the capped late penalty) is exercised across three configurations by that §1.8 combinatorial_formula instance, including the canonical wrong answer."

      - name: provisional_versus_final_fee_delta_on_a_late_renewal
        claim_type: variant_selection
        grounds:
          - calculations.license_fee_assessment.variants
        excluded_because:
          difficulty_instance: license_fee_nested_caps_and_tier_multiplier
          rationale: "The PROVISIONAL/FINAL reference-date divergence and the resulting fee_delta_cents on a renewal decided later than it was submitted are asserted inside that §1.8 instance."

      - name: hearing_assessment_tier_selected_from_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.hearing_cost_assessment
        excluded_because:
          difficulty_instance: hearing_assessment_surcharge_tier_keyed_on_subtotal
          rationale: "Tier selection from the pre-surcharge subtotal, the late-evidence gate on the surcharge and the prevailing-share rounding are the entire subject of that §1.8 combinatorial_formula instance."

      - name: declared_rate_diverges_from_franchisor_counter_rate
        claim_type: variant_divergence
        grounds:
          - calculations.warranty_labor_rate_determination.variants
        excluded_because:
          difficulty_instance: warranty_rate_per_order_mean_vs_aggregate_weighted
          rationale: "The PER_ORDER_MEAN versus AGGREGATE_WEIGHTED divergence on identical repair-order data, the spread and the midpoint approval are all asserted by that §1.8 dual_variant_calc instance."

      - name: expected_penetration_basis_changes_the_good_cause_score
        claim_type: variant_divergence
        grounds:
          - calculations.market_penetration_analysis.variants
          - calculations.good_cause_score
        excluded_because:
          difficulty_instance: good_cause_expected_penetration_statewide_vs_comparable
          rationale: "That §1.8 dual_variant_calc instance runs the same registration counts through both bases and shows the different net shortfall, score and disposition, which subsumes any single-basis corner check."

      - name: renewal_term_starts_the_day_after_the_prior_expiry
        claim_type: chronological
        grounds:
          - calculations.license_term_dates
          - validations.priority_51_ERR_TERM_NOT_CONTIGUOUS
        excluded_because:
          difficulty_instance: renewal_term_must_abut_prior_expiry_no_overlap
          rationale: "Term abutment, the rejection of an overlapping or gapped requested_term_start_on and the retroactive continuity of the renewed term are covered by that §1.8 resource_temporal_overlap instance."

      - name: buffered_room_intervals_and_day_capacity_ledger
        claim_type: interval_merge
        grounds:
          - calculations.hearing_room_slot_ledger
        excluded_because:
          difficulty_instance: hearing_room_buffered_overlap_rejects_adjacent_session
          rationale: "The buffered collision test, the exactly-equal-to-buffer acceptance and the per-day capacity ceiling in the same room are all exercised by that §1.8 resource_temporal_overlap instance."

      - name: qualifying_line_filter_sets_the_sample_size
        claim_type: precision
        grounds:
          - calculations.warranty_labor_rate_determination
          - validations.priority_80_ERR_INSUFFICIENT_RO_SAMPLE
        excluded_because:
          difficulty_instance: warranty_sample_exactly_five_qualifying_lines_accepted
          rationale: "The 0.5-hour floor, the CUSTOMER_PAID filter and the exactly-five-line acceptance boundary are asserted by that §1.8 boundary_precision_check instance."

  - section: validations
    instances:
      - name: duplicate_line_make_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_68_ERR_DUPLICATE_LINE_MAKE
          - errors[ERR_DUPLICATE_LINE_MAKE]
        distinguishing_aspect: "line_make is unique across Manufacturer rows: a second franchisor claiming AURORA is refused with 409 ERR_DUPLICATE_LINE_MAKE even though its legal_name and home_office_state differ."
        test_recipe:
          setup:
            - "One manufacturer already holds line_make AURORA."
          setup_api_calls:
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_c30_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Distribution West", line_make: "AURORA", home_office_state: "CA", posted_warranty_labor_rate_cents: 7000 }
              as: BoardAdmin
              captures: { c30_err: $.data.error_id }
          assert:
            - "HTTP status 409"
            - "error_id == ERR_DUPLICATE_LINE_MAKE"
            - "GET /dealer-board/manufacturers reports total_count 1"
            - "Manufacturer.${mfr_c30_id}.posted_warranty_labor_rate_cents == 6000"

