  - rule_id: cross_entity_state_dependency
    instances:

      - name: statement_issue_requires_every_night_in_period_terminal
        grounds:
          - validations[priority=26]
          - errors[ERR_PERIOD_NOT_CLOSED]
          - state_machines.MonthlyStatement.DRAFT_to_ISSUED
          - state_machines.ServiceNight.IN_PROGRESS_to_VERIFIED
          - calculations.statement_settlement
        distinguishing_aspect: |
          Entity pair (MonthlyStatement, ServiceNight): the statement's own state is a perfectly
          legal DRAFT and the actor holds the right role, yet ISSUED is unreachable while any
          ServiceNight of the billing period is still non-terminal. Closing the offending night —
          touching a different entity entirely — is what unblocks the transition, and the FINAL
          settlement then recomputes off that night's freshly derived verification_status.
        test_recipe:
          setup:
            - "Property 'Maple Court' unit_count 4, contract ACTIVE at 3495 cents/unit, share 1500 bps, sla_missed_threshold_bps 1000"
            - "Residents: 101 all month, 102 moved in 2026-09-14, 103 moved out 2026-09-18, 104 vacant"
            - "Night 2026-09-01 closed MISSED; night 2026-09-02 fully scanned (101 and 103) but deliberately left IN_PROGRESS"
            - "A PROVISIONAL DRAFT statement for 2026-09 already cut"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
