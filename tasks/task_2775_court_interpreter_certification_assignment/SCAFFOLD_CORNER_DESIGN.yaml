              payload: { courthouse_id: "${ch_main}", status: "COVERED" }
              as: SchedulingCoordinator
              captures: { covered_first: "$.data[0].id" }
          assert:
            - "${ch_enc0} == 0, ${ch_avail0} == 5000000 and ${iA_pending0} == 0 before the confirmation, and no PayClaim exists for ${a1}"
            - "the confirmation response itself already carries ${a1_status} == CONFIRMED with ${a1_v2} == ${a1_v1} + 1 — the caller does not need a follow-up read to learn the outcome"
            - "${h1_status} == COVERED on the immediately following read: coverage is recorded by the confirmation, not by any later pass"
            - "${pc1_status} == ENCUMBERED with ${pc1_prov} == 17500 (2.0 minimum-call hours * 8750, no travel and no rare premium) and ${pc1_rs} == ${rs1} pinned at confirmation time"
            - "${ch_enc1} == 17500, ${ch_obl1} == 0 and ${ch_avail1} == 4982500 == 5000000 - 17500 — the ledger reconciles against the single ENCUMBERED claim ${pc1} with no drift"
            - "${iA_pending1} == 17500 — the denormalised roster field is updated in the same write, not left stale for a sweep to fix"
            - "${conf_first} == ${a1} and ${covered_first} == ${h1}: both list endpoints filter on the post-confirmation states right away"
            - "GET /assignments with hearing_id ${h1} and service_status PROPOSED returns an empty list, so no read path still observes the pre-confirmation state"

      - name: no_partial_state_survives_a_confirmation_that_fails_the_budget_check
        claim_type: immediate
        grounds: ["validations[priority 36]", "endpoints[POST /assignments/{id}/confirm]", "calculations[courthouse_encumbrance_ledger]", "complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency cuts both ways: a confirmation rejected by the budget check must leave no half-applied write behind. The assignment keeps its version, the hearing stays SCHEDULED, no PayClaim row appears, and the courthouse ledger is byte-identical to what it was before the failed call — so the same call can succeed later once budget is freed."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Courthouse Thrift Annex with pay_budget_cents 20000 — deliberately smaller than two minimum-call encumbrances."
            - "Interpreter Ana Reyes (iA), ACTIVE with a CERTIFIED spa credential; the CERTIFIED minimum-call encumbrance is 17500."
            - "Two non-overlapping spa hearings at that courthouse on 2026-09-10: h1 09:00-10:30 and h2 13:00-14:30, both IN_PERSON, each with a PROPOSED assignment for iA. Because both are at the same courthouse the travel-buffer rule does not apply, and the intervals do not touch."
            - "a1 is confirmed first, encumbering 17500 and leaving available_pay_cents 2500."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Thrift Annex", county_code: "CAS", courtroom_count: 2, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 20000 }
              as: ProgramAdmin
              captures: { ch_thrift: "$.data.id" }
            - call: "POST /rate-schedules"
              payload: { effective_from: "2026-01-01", master_hourly_cents: 10500, certified_hourly_cents: 8750, registered_hourly_cents: 6500, provisional_hourly_cents: 4900, minimum_call_hours: 2.0, travel_mileage_rate_cents: 67.5, travel_free_radius_miles: 30.0, remote_rate_multiplier: 0.90, late_cancellation_hours: 48, late_cancellation_pay_hours: 2.0, rare_premium_low_pct: 0.10, rare_premium_high_pct: 0.15, rare_premium_bracket_cents: 30000 }
              as: ProgramAdmin
              captures: { rs1: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { iA: "$.data.id" }
            - call: "POST /interpreters/${iA}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { iA_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${iA}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${iA_v2}" }
              as: CredentialingOfficer
              captures: { credA: "$.data.id" }
            - call: "POST /credentials/${credA}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_thrift}", language_id: "${lang_spa}", case_number: "CR-2026-4501", hearing_type: "PLEA", in_custody: true, scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T10:30:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h1: "$.data.id", h1_v1: "$.data.version" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_thrift}", language_id: "${lang_spa}", case_number: "CR-2026-4502", hearing_type: "PLEA", in_custody: true, scheduled_start: "2026-09-10T13:00:00.000Z", scheduled_end: "2026-09-10T14:30:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h2: "$.data.id", h2_v1: "$.data.version" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${iA}", delivery_mode: "IN_PERSON", expected_hearing_version: "${h1_v1}" }
              as: SchedulingCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h2}", interpreter_id: "${iA}", delivery_mode: "IN_PERSON", expected_hearing_version: "${h2_v1}" }
              as: SchedulingCoordinator
              captures: { a2: "$.data.id", a2_v1: "$.data.version" }
            - call: "POST /assignments/${a1}/confirm"
              payload: {}
              as: Interpreter
              captures: { a1_status: "$.data.service_status" }
            - call: "GET /courthouses/${ch_thrift}"
              payload: {}
              as: FiscalOfficer
              captures: { ch_enc0: "$.data.encumbered_pay_cents", ch_avail0: "$.data.available_pay_cents" }
            - call: "GET /pay-claims"
              payload: { assignment_id: "${a1}" }
              as: FiscalOfficer
              captures: { pc1: "$.data[0].id" }
          trigger:
            - call: "POST /assignments/${a2}/confirm"
              payload: {}
              as: Interpreter
              captures: { budget_err: "$.data.error_id" }
            - call: "GET /assignments/${a2}"
              payload: {}
