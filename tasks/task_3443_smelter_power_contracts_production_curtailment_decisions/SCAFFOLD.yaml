  - EHSManager
  code: 200
  input:
  - limit?
  - offset?
  output: AluminaSupplyAgreement[]
  side_effects: []
- method: GET
  path: /smelter-ops/smelters/{id}/environmental-permits
  description: List environmental permits of a smelter.
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
  code: 200
  input:
  - limit?
  - offset?
  output: EnvironmentalPermit[]
  side_effects: []
- method: GET
  path: /smelter-ops/smelters/{id}/labor-agreements
  description: List labor agreements of a smelter.
