          Boundary on the CARDINALITY metric, reached through a different endpoint
          (POST /interline/tickets/{id}/prorate): the ticket has two coupons but none is
          FLOWN, so the FINAL variant's input set is empty and the run must be refused with
          ERR_NO_PRORATABLE_COUPONS while the PROVISIONAL variant over the same two OPEN
          coupons succeeds.
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; clock at 2026-08-10T00:00:00Z."
