              payload: { current_yard_id: "${yA}", status: "AVAILABLE" }
              as: Any
          assert:
            - "after cancel: Locomotive.${l1}.status == AVAILABLE at ${yA} (lock released — AVAILABLE count back to 1)"
            - "re-book succeeds: TrainDeparture.${d2}.status == SCHEDULED and Locomotive.${l1}.status == ASSIGNED (lock re-acquired)"
            - "net invariant: AVAILABLE-count(${yA}) after book+cancel == AVAILABLE-count before book (== 1); no phantom units created or destroyed by the cycle"

      - name: service_credit_accrual_and_adjustment_conservation
        grounds:
          - calculations.service_credit
          - entities.Customer.fields.service_credit_balance
          - errors[ERR_CREDIT_BALANCE_NEGATIVE]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — customer service credits: late
          delivery accrues +car_count, an explicit adjustment of the exact
