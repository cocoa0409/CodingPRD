            - { call: "GET /spd/technicians/${ta}", as: Any, captures: { tst: "$.data.status" } }
            - { call: "PUT /spd/technicians/${ta}", payload: { certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tst2: "$.data.status" } }
