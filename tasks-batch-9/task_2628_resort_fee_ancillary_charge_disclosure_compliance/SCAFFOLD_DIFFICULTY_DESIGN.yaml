            - "RevenueImpactModel.${rm_rp}.modeled_guest_total_cents == 39057"
            - "RevenueImpactModel.${rm_rp}.modeled_net_revenue_cents == 28680"
            - "RevenueImpactModel.${rm_rp}.modeled_net_revenue_delta_cents == -226"
            - "RevenueImpactModel.${rm_rp}.modeled_guest_total_delta_cents == 268"
            - "RevenueImpactModel.${rm_ta}.baseline_net_revenue_cents == 28906"
            - "RevenueImpactModel.${rm_ta}.modeled_adr_cents == 28263"
            - "RevenueImpactModel.${rm_ta}.applied_commission_bps == 1800"
            - "RevenueImpactModel.${rm_ta}.modeled_commission_cents == 5087"
            - "RevenueImpactModel.${rm_ta}.modeled_tax_cents == 4065"
            - "RevenueImpactModel.${rm_ta}.modeled_guest_total_cents == 34448"
            - "RevenueImpactModel.${rm_ta}.modeled_net_revenue_cents == 25296"
            - "RevenueImpactModel.${rm_ta}.modeled_net_revenue_delta_cents == -3610"
            - "RevenueImpactModel.${rm_ta}.modeled_guest_total_delta_cents == -4341"
            - "RevenueImpactModel.${rm_rp}.modeled_adr_cents != RevenueImpactModel.${rm_ta}.modeled_adr_cents"

      - name: complaint_refund_full_fee_versus_disclosure_gap_differential
        grounds:
          - calculations.complaint_refund_entitlement
          - entities.GuestComplaint.fields.refund_variant
          - entities.GuestComplaint.fields.refund_entitlement_cents
          - state_machines.GuestComplaint.UNDER_INVESTIGATION_to_SUBSTANTIATED
        distinguishing_aspect: |
          A third dual variant on yet another entity domain — guest remediation on
          GuestComplaint: the SAME posted folio yields refund_entitlement_cents
          2600 for a NOT_DISCLOSED complaint (FULL_FEE_REFUND, line plus its own
          tax) and 3367 for a MISSTATED_AMOUNT complaint (DISCLOSURE_GAP_
          DIFFERENTIAL, 8970 minus the disclosed 6000 plus a freshly rounded 397
          of tax), and 3367 is not any proportional slice of the full 10170.
        test_recipe:
          setup:
            - "The canonical fixture through a POSTED folio: jurisdiction at 1338 bps, property at 29900, three mandatory fees with inclusions, PUBLISHED program, DEPLOYED profile, booking with disclosed_fee_amounts {RESORT: 6000, DESTINATION: 5980}, checked out, itemized and posted"
