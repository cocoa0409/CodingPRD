      - name: corner_service_contract_auto_expires_when_clock_passes_term
        claim_type: Valid Transition
        grounds:
          - state_machines.ServiceContract.transitions[ACTIVE->EXPIRED]
          - calculations.service_contract_recognition
          - endpoints[POST /warranty/_clock/set_current_utc]
        distinguishing_aspect: "The ACTIVE -> EXPIRED transition is system-driven by the clock: at 2026-08-01 a CLAIMS_PATTERN contract sold 2026-03-01 for 12 months shows 5 whole months (4167 bps elapsed -> 3000 bps cumulative -> 108000 recognized), and after the clock moves to 2027-04-01 it is EXPIRED with the full 360000 recognized and 0 deferred."
        test_recipe:
          setup:
            - "One ProductFamily FAM-SC launched 2024-01-01."
            - "One ACTIVE ServiceContract: sold 2026-03-01, term 12 months, price 360000 cents, recognition_method CLAIMS_PATTERN."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-SC", name: "Service Contract Platform", launch_date: "2024-01-01", base_warranty_months: 12, standard_cost_per_claim_cents: 9000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_sc_id: $.data.id }
            - call: "POST /warranty/service-contracts"
              payload: { family_id: "${fam_sc_id}", contract_number: "SC-EXP-1", sold_date: "2026-03-01", term_months: 12, total_contract_price_cents: 360000, recognition_method: "CLAIMS_PATTERN" }
              as: WarrantyAnalyst
              captures: { sc_exp_id: $.data.id }
          trigger:
            - call: "POST /warranty/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranty/service-contracts/${sc_exp_id}"
              payload: {}
              as: WarrantyAnalyst
          assert:
            - "Before the clock move: ServiceContract.${sc_exp_id}.status == ACTIVE and months_elapsed == 5; the curve puts elapsed_bps at round_half_up(5*10000/12) == 4167, which falls in the <=5000 bucket for cum_bps 3000, so recognized_revenue_cents == 108000 and deferred_revenue_cents == 252000"
            - "The second trigger call returns 200 with ServiceContract.${sc_exp_id}.status == EXPIRED"
            - "ServiceContract.${sc_exp_id}.months_elapsed == 12 (clamped at term_months), recognized_revenue_cents == 360000, deferred_revenue_cents == 0, refunded_revenue_cents == 0"

