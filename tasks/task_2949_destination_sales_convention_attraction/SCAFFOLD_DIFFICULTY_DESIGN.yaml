              as: SalesManager
              captures: { opp_inc_id: $.data.id }
            - call: "POST /opportunities/${opp_inc_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_inc_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { h0_id: $.data.id, h0_rank: $.data.hold_rank, h0_expiry: $.data.expires_at }
            - call: "POST /opportunities"
