              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: TaxSupervisor
              as_user_id: "sup-01"
          trigger:
            - call: "POST /mft/audit-cases/${case_id}/assessments"
              payload: { additional_tax_cents: 250000, evasion_indicator: true }
              as: TaxSupervisor
              as_user_id: "sup-01"
          assert:
            - "HTTP 200; data.assessment_penalty_cents == 125000 (0.50 of 250000), data.assessment_interest_cents == 250 and data.assessed_total_cents == 375250"
            - "data.assessment_status == ISSUED, data.case_status == PRELIM_FINDINGS and data.assessed_by_user_id == sup-01"
            - "GET /mft/licensees/${dist_id}/ledger-entries with payload { entry_type: ASSESSMENT } returns total_count == 1 with amount_cents == 375250"
            - "GET /mft/licensees/${dist_id} reports balance_cents == 375250"

      - name: rack_basis_variant_divergence_between_net_and_gross_electors
        claim_type: variant_divergence
        grounds:
          - calculations.rack_removal_tax_imposition.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / rack_basis_net_vs_gross_diverges_on_deferred_tax
          rationale: "The named Section 1.8 instance runs the identical 8000.00/7960.00 load past both electors and asserts the 1236-cent divergence together with the deferral-point interaction."
      - name: late_filing_penalty_tier_and_floor_boundaries
        claim_type: constants_applied
        grounds:
          - calculations.return_penalty_and_interest.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / late_filing_interest_then_penalty_tier_then_floor
          rationale: "The named Section 1.8 instance pins the interest-then-tier-then-floor evaluation order with pre-computed literals, which is exactly this row's threshold-boundary claim."
      - name: cross_match_tolerance_gallons_boundary
        claim_type: precision
        grounds:
          - calculations.cross_match_variance.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / cross_match_tolerance_exact_five_gallons_creates_nothing
          rationale: "The named Section 1.8 instance asserts both sides of the strict tolerance comparison at 5.00 and 5.01 gallons."
      - name: risk_score_weighting_selects_the_audit_gate
        claim_type: constants_applied
        grounds:
          - calculations.licensee_risk_score.constants
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_score_variance_vs_frequency_weighted_flips_audit_selectability
          rationale: "The named Section 1.8 instance asserts the AUDIT_SELECTION_THRESHOLD gate at exactly 60 under both weightings from one identical history."

  - section: validations
    instances:
      - name: agriculture_certificate_on_a_gasoline_exempt_line_returns_exemption_product_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=104]
          - errors[ERR_EXEMPTION_PRODUCT_MISMATCH]
        distinguishing_aspect: "CERT_PRODUCT_SET[AGRICULTURE] holds UNDYED_DIESEL only, so an otherwise perfect AGRICULTURE certificate - right holder, ACTIVE, document_date inside the window - still cannot carry a GASOLINE exempt line."
        test_recipe:
          setup:
            - "One SUPPLIER filer and one FARM-channel RETAILER purchaser; clock at 2026-09-05T00:00:00Z."
            - "The purchaser holds an ACTIVE AGRICULTURE certificate valid 2026-08-01..2026-08-31."
            - "The filer's DRAFT 2026-08 return carries a SCH_6_EXEMPT_SALES GASOLINE schedule."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Prairie Fuel Supply LLC", fein: "41-5300001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Prairie Farm Fuels LLC", fein: "41-5300002", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { farm_id: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${farm_id}", exemption_type: "AGRICULTURE", document_number: "AG-5300-001", valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: LicensingOfficer
              captures: { ag_cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_6_EXEMPT_SALES", product_code: "GASOLINE", total_gallons: 400.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${farm_id}", transaction_type: "SALE", gallons: 400.00, document_date: "2026-08-14", bill_of_lading_number: "BOL-AG-0001", exemption_certificate_id: "${ag_cert}" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_EXEMPTION_PRODUCT_MISMATCH"
            - "GET /mft/schedules/${sch_id} still reports line_count == 0 and GET /mft/schedule-lines with payload { schedule_id: ${sch_id} } returns total_count == 0"
            - "the same line with product-compatible facts - a SCH_6_EXEMPT_SALES UNDYED_DIESEL schedule on the same return under the same certificate - is accepted with HTTP 201"

      - name: certificate_holder_mismatch_outranks_product_mismatch_on_one_line
        claim_type: priority_ordering
        grounds:
          - validations[priority=102]
          - validations[priority=104]
        distinguishing_aspect: "One line violates both rules at once - the certificate belongs to a different purchaser AND names a product outside its exemption set - and the 102 holder check must answer first, so ERR_CERTIFICATE_HOLDER_MISMATCH is returned rather than ERR_EXEMPTION_PRODUCT_MISMATCH."
        test_recipe:
          setup:
            - "One SUPPLIER filer and two FARM-channel RETAILER purchasers, each holding its own ACTIVE AGRICULTURE certificate for 2026-08-01..2026-08-31; clock at 2026-09-05T00:00:00Z."
            - "The filer's DRAFT 2026-08 return carries a SCH_6_EXEMPT_SALES GASOLINE schedule."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Two Farms Fuel Supply LLC", fein: "41-5400001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Farm A Fuels LLC", fein: "41-5400002", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { farm_a: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Farm B Fuels LLC", fein: "41-5400003", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { farm_b: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${farm_b}", exemption_type: "AGRICULTURE", document_number: "AG-5400-002", valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: LicensingOfficer
              captures: { cert_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_6_EXEMPT_SALES", product_code: "GASOLINE", total_gallons: 300.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${farm_a}", transaction_type: "SALE", gallons: 300.00, document_date: "2026-08-14", bill_of_lading_number: "BOL-AG-0002", exemption_certificate_id: "${cert_b}" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_CERTIFICATE_HOLDER_MISMATCH (the lower priority number wins)"
            - "data.error_id is NOT ERR_EXEMPTION_PRODUCT_MISMATCH even though the GASOLINE product also violates the AGRICULTURE product set"
            - "repeating the line with counterparty_licensee_id ${farm_b} - fixing only the holder - now returns HTTP 422 with data.error_id == ERR_EXEMPTION_PRODUCT_MISMATCH, proving the second violation was masked and not absent"

      - name: payment_of_exactly_the_balance_is_accepted_and_one_cent_more_is_not
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=506]
          - endpoints[POST /mft/licensees/{id}/payments]
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "506 forbids only payments that EXCEED the balance, so a payment of exactly the 28600-cent balance passes and drives balance_cents to 0; the very next 1-cent payment is then refused, pinning the comparison as strict."
        test_recipe:
          setup:
            - "One DISTRIBUTOR whose FILED 2026-08 return (SCH_2 GASOLINE 1000.00 gallons) leaves balance_cents == 28600 with no interest or penalty; clock at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Exact Pay Fuel Supply LLC", fein: "41-5500001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Exact Pay Distribution Inc", fein: "41-5500002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-06", bill_of_lading_number: "BOL-PAY-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "E. Exact" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/licensees/${dist_id}/payments"
              payload: { amount_cents: 28600, effective_date: "2026-09-05", memo: "ACH settlement of the 2026-08 period" }
              as: TaxSupervisor
              as_user_id: "sup-01"
          assert:
            - "HTTP 201; the returned LedgerEntry has entry_type == PAYMENT and amount_cents == -28600"
            - "GET /mft/licensees/${dist_id} reports balance_cents == 0"
            - "GET /mft/licensees/${dist_id}/ledger-entries returns total_count == 2 (RETURN_TAX +28600 and PAYMENT -28600) whose amounts sum to the reported balance"
            - "a following payment of amount_cents 1 returns HTTP 422 with data.error_id == ERR_PAYMENT_EXCEEDS_BALANCE and leaves total_count at 2"

      - name: cross_match_run_for_the_clock_s_own_month_returns_period_not_closed
        claim_type: temporal_validation
        grounds:
          - validations[priority=300]
          - errors[ERR_PERIOD_NOT_CLOSED]
        distinguishing_aspect: "The comparison is strictly on the month, not on the day: standing at 2026-09-05 the 2026-09 period is still in flight and unmatchable, while the immediately preceding 2026-08 period runs fine from the same clock position."
        test_recipe:
          setup:
            - "No returns are needed - the period gate is checked before any data is gathered."
            - "Clock at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-09" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_PERIOD_NOT_CLOSED"
            - "GET /mft/cross-match-runs with payload { period_month: 2026-09 } returns total_count == 0 (no FAILED shell row is left behind)"
            - "the same call for period_month 2026-08 returns HTTP 201 with run_status == COMPLETED, matched_cells_count == 0 and discrepancy_count == 0"

      - name: refund_claim_against_a_draft_period_returns_refund_period_not_filed
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=304]
          - errors[ERR_REFUND_PERIOD_NOT_FILED]
        distinguishing_aspect: "The claim's admissibility hinges on a different entity's state: with the 2026-08 return still DRAFT the claim is refused, and filing that very return - changing nothing on the claim - makes the identical request succeed."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR claimant; clock at 2026-09-05T00:00:00Z."
            - "The claimant's 2026-08 return carries SCH_1 UNDYED_DIESEL 200.00 gallons but has NOT been filed."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Draft Period Fuel Supply LLC", fein: "41-5600001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Draft Period Distribution Inc", fein: "41-5600002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "UNDYED_DIESEL", total_gallons: 200.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 200.00, document_date: "2026-08-09", bill_of_lading_number: "BOL-DP-0001" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "OFF_ROAD", period_month: "2026-08", claimed_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_REFUND_PERIOD_NOT_FILED (not ERR_REFUND_EXCEEDS_TAX_PAID - the period gate at 304 answers before the pool test at 503)"
            - "GET /mft/refund-claims with payload { licensee_id: ${dist_id} } returns total_count == 0"
            - "after POST /mft/returns/${ret_id}/file with attest_name the identical claim returns HTTP 201 with allowable_gallons == 100.00 and refund_amount_cents == 3090"

      - name: declared_schedule_total_that_misses_a_line_returns_schedule_totals_mismatch
        claim_type: aggregate_validation
        grounds:
          - validations[priority=202]
          - errors[ERR_SCHEDULE_TOTALS_MISMATCH]
          - endpoints[POST /mft/schedules/{id}/lines].side_effects
          - state_machines.MonthlyReturn.DRAFT_to_FILED.preconditions
        distinguishing_aspect: "Every line is legal on its own and the declared total was legal when the schedule was created; the offence is purely an aggregate one, and it can only surface at filing because line creation deliberately never adjusts the schedule's declared total."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR filer; clock at 2026-09-05T00:00:00Z so the 2026-08 period may be filed."
            - "The filer's DRAFT 2026-08 return carries one SCH_2_RECEIVED_TAX_UNPAID UNDYED_DIESEL schedule declaring 1000.00 gallons, against which only two lines of 400.00 and 550.00 gallons (949.99 short of nothing, exactly 50.00 short of the declaration) have been entered."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Attest Fuel Supply LLC", fein: "41-5700001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Attest Distribution Inc", fein: "41-5700002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "UNDYED_DIESEL", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { in_sch: $.data.id }
            - call: "POST /mft/schedules/${in_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 400.00, document_date: "2026-08-04", bill_of_lading_number: "BOL-AT-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/schedules/${in_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 550.00, document_date: "2026-08-19", bill_of_lading_number: "BOL-AT-0002" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "A. Attester" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_SCHEDULE_TOTALS_MISMATCH"
            - "GET /mft/schedules/${in_sch} still reports total_gallons == 1000.00 with line_count == 2, so the declared total was never quietly repaired"
            - "GET /mft/returns/${ret_id} still reports filing_status == DRAFT with no filed_at and no tax_due_cents, and GET /mft/licensees/${dist_id}/ledger-entries returns total_count == 0"
            - "adding a third line of exactly 50.00 gallons and repeating the identical file call returns HTTP 200 with taxable_gallons_total == 1000.00 and tax_due_cents == 30900 (1000.00 x 30.9 rounded once)"
            - "on a sibling return whose schedule declares 1000.01 against lines summing to 1000.00 the same file call also returns ERR_SCHEDULE_TOTALS_MISMATCH, so the rule is an equality and not a ceiling"

      - name: dyed_sale_to_a_highway_retailer_is_refused_and_to_a_farm_retailer_passes
        claim_type: conditional_validation
        grounds:
          - validations[priority=105]
          - entities.Licensee.fields.retail_channel
          - errors[ERR_DYED_FUEL_ON_ROAD_PROHIBITED]
        distinguishing_aspect: "The rule is conditional on the counterparty's retail_channel flag alone: the identical SCH_10_DYED_SALES line is refused for a HIGHWAY retailer and accepted for a FARM retailer, and the untaxed DYED_DIESEL product code is what makes the flag matter."
        test_recipe:
          setup:
            - "One SUPPLIER filer, one HIGHWAY-channel RETAILER and one FARM-channel RETAILER; clock at 2026-09-05T00:00:00Z."
            - "The filer's DRAFT 2026-08 return carries a SCH_10_DYED_SALES DYED_DIESEL schedule of 2000.00 gallons."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dyed Channel Fuel Supply LLC", fein: "41-5800001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dyed Channel Highway Stops LLC", fein: "41-5800002", license_type: "RETAILER", mailing_state: "MN", retail_channel: "HIGHWAY" }
              as: LicensingOfficer
              captures: { hwy_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dyed Channel Farm Depot LLC", fein: "41-5800003", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { farm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_10_DYED_SALES", product_code: "DYED_DIESEL", total_gallons: 2000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${hwy_id}", transaction_type: "SALE", gallons: 1000.00, document_date: "2026-08-12", bill_of_lading_number: "BOL-DY-0001" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_DYED_FUEL_ON_ROAD_PROHIBITED"
            - "the same line addressed to ${farm_id} (retail_channel FARM) returns HTTP 201, so the flag and not the product alone drove the refusal"
            - "GET /mft/schedules/${sch_id} reports line_count == 1 after both calls (only the FARM line landed)"
            - "GET /mft/licensees/${hwy_id} reports dyed_violation_count == 0 - a refused schedule line is not a roadside violation"

      - name: bond_deficiency_is_derived_before_the_deferral_shape_refusal
        claim_type: cascading_validation
        grounds:
          - validations[priority=500]
          - calculations.licensee_bond_requirement
          - errors[ERR_PURCHASER_BOND_DEFICIENT]
        distinguishing_aspect: "500 cannot be decided without first running the bond-requirement calculation: the same purchaser with the same status is refused while its derived bond_deficiency_cents is 1500000 and accepted the instant a bond is posted, with no other input changed."
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER position holder holding a 1500000-cent bond, one MN terminal, and one DISTRIBUTOR purchaser that has posted no bond at all (required 1500000, deficiency 1500000)."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Cascade Fuel Supply LLC", fein: "41-5900001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
