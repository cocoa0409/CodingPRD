      - name: grievance_blocked_until_appeal_is_upheld
        grounds:
          - validations[priority=20]
          - errors[ERR_APPEAL_NOT_EXHAUSTED]
          - state_machines.Appeal.UNDER_REVIEW_to_MODIFIED
          - state_machines.EvaluationCycle.APPEAL_RESOLVED_to_GRIEVED
          - state_machines.ImprovementPlan.ACTIVE_to_VOIDED
        distinguishing_aspect: |
          A different entity pair from Observation -> Evaluator: Grievance -> Appeal. The
          cycle's dispute_state is already APPEAL_RESOLVED so the dispute dimension permits
          the grievance, yet filing fails with ERR_APPEAL_NOT_EXHAUSTED purely because
          Appeal.status is MODIFIED rather than UPHELD.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; policy requiring 1 formal and 0 informal observations."
            - "Cycle FINALIZED INEFFECTIVE at composite 1.00, which created an ACTIVE ImprovementPlan."
