scaffold_corner_design:
  # ==================================================================
  # Section: endpoints (response envelope / pagination / clock)
  # ==================================================================
  - section: endpoints
    instances:
      - name: success_envelope_shape_on_single_object
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "A single-object response carries meta.api_request_id, meta.api_request_timestamp, response_type == 'object', and data."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 2 }, as: SalesManager, captures: { slot_id: $.data.id } }
          trigger:
            - { call: "GET /dealership/factory-build-slots/${slot_id}", payload: {}, as: SalesManager }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'object' and data.id == ${slot_id}"
      - name: list_pagination_defaults_and_fields
        claim_type: pagination
        grounds: [response_envelope]
        distinguishing_aspect: "Default limit 10 / offset 0; response carries limit, offset, total_count, has_more; with 12 accounts, default page returns 10 and has_more == true."
        test_recipe:
          setup: ["12 customer accounts exist"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A01", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A02", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A03", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A04", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A05", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A06", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A07", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A08", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A09", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A10", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A11", account_type: "RETAIL" }, as: SalesManager }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "A12", account_type: "RETAIL" }, as: SalesManager }
          trigger:
            - { call: "GET /dealership/customer-accounts", payload: {}, as: SalesManager }
          assert:
            - "data length == 10 (default limit)"
            - "total_count == 12 and has_more == true and offset == 0"
      - name: list_filter_and_offset_interaction
        claim_type: pagination
        grounds: [response_envelope, "endpoints[GET /dealership/customer-accounts]"]
        distinguishing_aspect: "Filter (account_type=FLEET) plus offset paginate the FILTERED set only; limit=1&offset=1 returns the second FLEET account and total_count counts only FLEET."
        test_recipe:
          setup: ["2 FLEET accounts and 1 RETAIL account exist"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "F1", account_type: "FLEET", credit_limit_cents: 900000 }, as: SalesManager, captures: { f1: $.data.id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "F2", account_type: "FLEET", credit_limit_cents: 900000 }, as: SalesManager, captures: { f2: $.data.id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "R1", account_type: "RETAIL" }, as: SalesManager }
          trigger:
            - { call: "GET /dealership/customer-accounts", payload: { account_type: "FLEET", limit: 1, offset: 1 }, as: SalesManager }
          assert:
            - "total_count == 2 (filter applied before counting)"
            - "data length == 1 and has_more == false"
      - name: clock_default_and_monotonic_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_CLOCK_REGRESSION]", "endpoints[POST /dealership/_clock/set_current_utc]"]
        distinguishing_aspect: "The unset clock reads exactly 2026-08-01T00:00:00Z at startup; setting an earlier timestamp is rejected with ERR_CLOCK_REGRESSION."
        test_recipe:
          setup: ["empty DB; clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DealershipAdmin, captures: { now: $.data.current_utc } }
          trigger:
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: DealershipAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first set succeeded: current_utc == 2026-08-02T00:00:00Z"
            - "regression rejected: error_id == ERR_CLOCK_REGRESSION; clock remains 2026-08-02T00:00:00Z"
      - name: error_envelope_shape_on_failure
        claim_type: response_envelope
        grounds: [response_envelope, "errors[ERR_FACTORY_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Errors carry response_type == 'error' and data.error_id/data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 1 }, as: SalesManager }
          trigger:
            - { call: "GET /dealership/factory-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesManager, captures: { err: $.data.error_id } }
          assert:
            - "response_type == 'error' and data.error_id == ERR_FACTORY_ORDER_NOT_FOUND and data.message present"
            - "http status 404"

  # ==================================================================
  # Section: entities (creation, defaults, computed, system fields, 404)
  # ==================================================================
  - section: entities
    instances:
      - name: customer_account_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.CustomerAccount.fields.fleet_tier, entities.CustomerAccount.fields.credit_limit_cents]
        distinguishing_aspect: "Omitting fleet_tier and credit_limit_cents applies STANDARD and 0; system sets status ACTIVE, open_ar_cents 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "DefaultCo", account_type: "RETAIL" }, as: SalesManager, captures: { a: $.data.id, tier: $.data.fleet_tier } }
          assert:
            - "fleet_tier == STANDARD and credit_limit_cents == 0"
            - "status == ACTIVE and open_ar_cents == 0 and version == 1"
            - "id is a server-minted UUID; created_at/updated_at stamped"
      - name: customer_account_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.CustomerAccount.fields.account_type, "validations[priority=4]"]
        distinguishing_aspect: "Missing required account_type -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "NoType" }, as: SalesManager, captures: { err: $.data.error_id } }
          assert:
            - "http 400 and error_id == ERR_INVALID_REQUEST"
      - name: unit_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.Unit.fields.floorplan_balance_cents, entities.Unit.fields.aging_bucket]
        distinguishing_aspect: "Computed fields (floorplan_balance_cents, aging_bucket, days_in_stock) derive from ledger/clock; receive response shows balance == invoice_cost and bucket B0_90."
        test_recipe:
          setup: ["NEW unit received via full order chain at clock 2026-08-15"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88326" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
          trigger:
            - { call: "GET /dealership/units/${unit_id}", payload: {}, as: Controller }
          assert:
            - "invoice_cost_cents == 10085000 and floorplan_balance_cents == 10085000 (ADVANCE posted)"
            - "days_in_stock == 0 and aging_bucket == B0_90 and curtailment_due_cents == 0"
            - "floorplan_active == true and unit_kind == NEW and status == IN_STOCK"
      - name: floorplan_entry_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.FloorPlanEntry]
        distinguishing_aspect: "FloorPlanEntry has common_fields: false (no version/updated_at) and no PATCH/PUT endpoint exists for it; entries are only created by system actions."
        test_recipe:
          setup: ["unit with ADVANCE entry exists (order chain)"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88327" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
          trigger:
            - { call: "GET /dealership/units/${unit_id}/floor-plan-entries", payload: {}, as: Controller, captures: { first_type: "$.data[0].entry_type", first_amt: "$.data[0].amount_cents" } }
          assert:
            - "exactly 1 entry: entry_type == ADVANCE, amount_cents == 10085000, resulting_balance_cents == 10085000"
            - "entry has id and created_at but no version field"
      - name: get_nonexistent_resources_return_per_entity_404
        claim_type: not_found
        grounds: ["errors[ERR_UNIT_NOT_FOUND]", "errors[ERR_PART_NOT_FOUND]", "errors[ERR_WARRANTY_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Each entity family returns its own domain-specific 404 error id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dealership/units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: SalesManager, captures: { e1: $.data.error_id } }
            - { call: "GET /dealership/parts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PartsCounterRep, captures: { e2: $.data.error_id } }
            - { call: "GET /dealership/warranty-claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: WarrantyAdministrator, captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_UNIT_NOT_FOUND, e2 == ERR_PART_NOT_FOUND, e3 == ERR_WARRANTY_CLAIM_NOT_FOUND (all http 404)"
      - name: fk_reverse_reachability_filtered_lists
        claim_type: cross_reference_integrity
        grounds: [entities.FactoryOrder.fields.factory_build_slot_id, entities.ServiceBooking.fields.service_bay_id, "endpoints[GET /dealership/factory-orders]", "endpoints[GET /dealership/service-bookings]"]
        distinguishing_aspect: "Children are discoverable from parent ids via filtered lists: factory-orders?factory_build_slot_id= and service-bookings?service_bay_id= return only matching children."
        test_recipe:
          setup: ["two pools; two orders on pool A only; account+RO+bay with one booking"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_a: $.data.id } }
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-09", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_b: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_a}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_a}", chassis_model: "SD_114", engine_option: "DD15", axle_config: "A6X4" }, as: SalesConsultant }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "FKCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042798", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B7", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor }
          trigger:
            - { call: "GET /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_a}" }, as: SalesManager, captures: { n_a: $.data } }
            - { call: "GET /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_b}" }, as: SalesManager }
            - { call: "GET /dealership/service-bookings", payload: { service_bay_id: "${bay_id}" }, as: ServiceAdvisor }
          assert:
            - "orders filtered by slot A: total_count == 2; filtered by slot B: total_count == 0"
            - "bookings filtered by bay: total_count == 1"

  # ==================================================================
  # Section: state_machines (invalid-from, initial, terminal lockdown,
  # idempotency, guarded transitions, side-effect patterns)
  # ==================================================================
  - section: state_machines
    instances:
      - name: commit_from_expired_rejected_invalid_from
        claim_type: invalid_transition
        grounds: [state_machines.FactoryOrder.SLOT_HELD_to_COMMITTED, "errors[ERR_ORDER_STATE]"]
        distinguishing_aspect: "commit is declared only from SLOT_HELD; an EXPIRED order (post-sweep) rejects commit with ERR_ORDER_STATE."
        test_recipe:
          setup: ["pool cap 1; order held at 2026-08-01; clock 2026-08-16 + sweep -> EXPIRED"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 1 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
          trigger:
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_STATE and order remains EXPIRED"
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.FactoryOrder, state_machines.RepairOrder, state_machines.WarrantyClaim, state_machines.ServiceBooking]
        distinguishing_aspect: "New order starts SLOT_HELD; new RO starts auth DRAFT + work OPEN; new claim starts DRAFT; new booking starts BOOKED."
        test_recipe:
          setup: ["pool, account exist"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 3 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "InitCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
          trigger:
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", customer_account_id: "${acct_id}", chassis_model: "SD_114", engine_option: "CUMMINS_X15", axle_config: "A6X4" }, as: SalesConsultant, captures: { o_st: $.data.status } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042799", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_auth: $.data.auth_status, ro_work: $.data.work_status, ro_id: $.data.id } }
          assert:
            - "order status == SLOT_HELD"
            - "RO auth_status == DRAFT and work_status == OPEN"
      - name: terminal_lockdown_cancelled_order_and_declined_appraisal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FactoryOrder, state_machines.TradeAppraisal, "errors[ERR_ORDER_STATE]", "errors[ERR_APPRAISAL_STATE]"]
        distinguishing_aspect: "Terminal CANCELLED order rejects commit/re-hold/cancel; terminal DECLINED appraisal rejects offer/accept/counter."
        test_recipe:
          setup: ["order created then cancelled (SLOT_HELD -> CANCELLED); appraisal offered then declined"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-10", vocation_group: "STANDARD", capacity: 3 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "TermCo", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", customer_account_id: "${acct_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/cancel", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/trade-appraisals", payload: { customer_account_id: "${acct_id}", trade_vin: "3AKJHHDR5LSMW4453", model_year: 2023, mileage: 90000, condition_grade: "A", base_book_value_cents: 7000000 }, as: SalesConsultant, captures: { appr_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10000, offered_allowance_cents: 4900000 }, as: SalesManager }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/decline", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
          trigger:
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant, captures: { e1: $.data.error_id } }
            - { call: "POST /dealership/factory-orders/${order_id}/cancel", payload: {}, as: SalesConsultant, captures: { e2: $.data.error_id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10000, offered_allowance_cents: 5000000 }, as: SalesManager, captures: { e3: $.data.error_id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/accept", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}", captures: { e4: $.data.error_id } }
          assert:
            - "e1 == ERR_ORDER_STATE and e2 == ERR_ORDER_STATE (CANCELLED is terminal)"
            - "e3 == ERR_APPRAISAL_STATE and e4 == ERR_APPRAISAL_STATE (DECLINED is terminal)"
      - name: double_transition_idempotency_second_call_rejected
        claim_type: idempotency
        grounds: [state_machines.RepairOrder.work_COMPLETED_to_work_INVOICED, "errors[ERR_RO_STATE]"]
        distinguishing_aspect: "invoice is not idempotent: the second invoice call observes work_status == INVOICED and fails with ERR_RO_STATE; totals are not recomputed or double-posted to AR."
        test_recipe:
          setup: ["RETAIL account; RO with one 1.0h labor line driven to INVOICED (due 17325)"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "IdemCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042800", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/repair-order-lines", payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.0, description: "l" }, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/submit-estimate", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/approve-estimate", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}" }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B8", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk_id}/check-in", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/start-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/complete-work", payload: {}, as: ServiceAdvisor }
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/invoice", payload: {}, as: ServiceManager, captures: { err: $.data.error_id } }
            - { call: "GET /dealership/customer-accounts/${acct_id}", payload: {}, as: Controller, captures: { ar: $.data.open_ar_cents } }
          assert:
            - "second invoice: error_id == ERR_RO_STATE"
            - "account open_ar_cents == 17325 exactly once (not double-posted)"
      - name: booking_cancel_demotes_ro_scheduled_to_open
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceBooking.BOOKED_to_CANCELLED, state_machines.RepairOrder]
        distinguishing_aspect: "Cancelling the RO's only open booking demotes work_status SCHEDULED -> OPEN (bubble-up demotion on child cancel)."
        test_recipe:
          setup: ["RETAIL account; RO with booking (work SCHEDULED)"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "DemoteCo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042801", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "B9", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk_id: $.data.id } }
          trigger:
            - { call: "POST /dealership/service-bookings/${bk_id}/cancel", payload: {}, as: ServiceAdvisor, captures: { bst: $.data.status } }
            - { call: "GET /dealership/repair-orders/${ro_id}", payload: {}, as: ServiceAdvisor, captures: { ws: $.data.work_status } }
          assert:
            - "booking status == CANCELLED"
            - "RO work_status == OPEN (demoted; no remaining BOOKED | CHECKED_IN bookings)"
      - name: ro_cancel_cascades_to_open_bookings
        claim_type: side_effect_execution
        grounds: [state_machines.RepairOrder."any_non_terminal_(auth,_work)"_to_"auth_CANCELLED,_work_CANCELLED", state_machines.ServiceBooking]
        distinguishing_aspect: "Cancelling the RO cascades down: all its BOOKED and CHECKED_IN bookings become CANCELLED (cascade-down pattern)."
        test_recipe:
          setup: ["RETAIL account; RO with two bookings, one CHECKED_IN one BOOKED"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "CascRo", account_type: "RETAIL" }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/repair-orders", payload: { customer_account_id: "${acct_id}", external_vin: "1M8GDM9A6KP042802", concern: "x", promised_ready_at: "2026-08-20T17:00:00Z" }, as: ServiceAdvisor, captures: { ro_id: $.data.id } }
            - { call: "POST /dealership/service-bays", payload: { bay_code: "C1", bay_type: "STANDARD" }, as: ServiceManager, captures: { bay_id: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ServiceAdvisor, captures: { bk1: $.data.id } }
            - { call: "POST /dealership/service-bookings", payload: { repair_order_id: "${ro_id}", service_bay_id: "${bay_id}", start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T11:00:00Z" }, as: ServiceAdvisor, captures: { bk2: $.data.id } }
            - { call: "POST /dealership/service-bookings/${bk1}/check-in", payload: {}, as: ServiceAdvisor }
          trigger:
            - { call: "POST /dealership/repair-orders/${ro_id}/cancel", payload: {}, as: ServiceAdvisor, captures: { ast: $.data.auth_status, wst: $.data.work_status } }
            - { call: "GET /dealership/service-bookings", payload: { repair_order_id: "${ro_id}" }, as: ServiceAdvisor }
          assert:
            - "RO auth_status == CANCELLED and work_status == CANCELLED"
            - "both bookings (former CHECKED_IN and BOOKED) are CANCELLED"
      - name: appraisal_accept_creates_used_unit_in_reconditioning
        claim_type: side_effect_execution
        grounds: [state_machines.TradeAppraisal.OFFERED_to_ACCEPTED, entities.Unit.fields.unit_kind]
        distinguishing_aspect: "Accept synthesizes a USED Unit: status RECONDITIONING, floorplan_active false, invoice_cost_cents == offered_allowance_cents; reachable only via GET /dealership/units?trade_appraisal_id=."
        test_recipe:
          setup: ["FLEET account; appraisal offered at 3800000 (2023/120000/B/6000000 -> book 3840000; index 10000 x cond 1.00 -> acv 3840000)"]
          setup_api_calls:
            - { call: "POST /dealership/customer-accounts", payload: { account_name: "TradeCo", account_type: "FLEET", credit_limit_cents: 50000000 }, as: SalesManager, captures: { acct_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals", payload: { customer_account_id: "${acct_id}", trade_vin: "3AKJHHDR5LSMW4454", model_year: 2023, mileage: 120000, condition_grade: "B", base_book_value_cents: 6000000 }, as: SalesConsultant, captures: { appr_id: $.data.id } }
            - { call: "POST /dealership/trade-appraisals/${appr_id}/offer", payload: { market_index_bp: 10000, offered_allowance_cents: 3800000 }, as: SalesManager }
          trigger:
            - { call: "POST /dealership/trade-appraisals/${appr_id}/accept", payload: {}, as: FleetCustomer, as_user_id: "${acct_id}", captures: { st: $.data.status, cu: $.data.created_unit_id } }
            - { call: "GET /dealership/units", payload: { trade_appraisal_id: "${appr_id}" }, as: SalesManager, captures: { u_st: "$.data[0].status", u_kind: "$.data[0].unit_kind" } }
          assert:
            - "appraisal status == ACCEPTED and created_unit_id set"
            - "GET units?trade_appraisal_id -> exactly 1 unit: unit_kind == USED, status == RECONDITIONING, invoice_cost_cents == 3800000, floorplan_active == false, floorplan_balance_cents == 0"
      - name: unit_inspect_fail_loop_increments_recondition_count
        claim_type: valid_transition
        grounds: [state_machines.Unit.READY_to_RECONDITIONING, state_machines.Unit.RECONDITIONING_to_RECONDITIONING]
        distinguishing_aspect: "The READY -> RECONDITIONING -> RECONDITIONING -> READY loop: FAIL from READY bumps recondition_count to 1, FAIL again to 2, PASS lands READY with count preserved."
        test_recipe:
          setup: ["NEW unit READY via full chain"]
          setup_api_calls:
            - { call: "POST /dealership/factory-build-slots", payload: { build_month: "2026-08", vocation_group: "STANDARD", capacity: 5 }, as: SalesManager, captures: { slot_id: $.data.id } }
            - { call: "POST /dealership/factory-orders", payload: { factory_build_slot_id: "${slot_id}", chassis_model: "M2_106", engine_option: "DD13", axle_config: "A4X2" }, as: SalesConsultant, captures: { order_id: $.data.id } }
            - { call: "POST /dealership/factory-orders/${order_id}/commit", payload: {}, as: SalesConsultant }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DealershipAdmin }
            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin }
            - { call: "POST /dealership/factory-orders/${order_id}/receive", payload: { vin: "1FUJGBDV1CLW88328" }, as: SalesManager, captures: { unit_id: $.data.received_unit_id } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "PASS" }, as: ServiceManager }
          trigger:
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "FAIL" }, as: ServiceManager, captures: { s1: $.data.status, c1: $.data.recondition_count } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "FAIL" }, as: ServiceManager, captures: { s2: $.data.status, c2: $.data.recondition_count } }
            - { call: "POST /dealership/units/${unit_id}/inspect", payload: { outcome: "PASS" }, as: ServiceManager, captures: { s3: $.data.status, c3: $.data.recondition_count } }
          assert:
            - "FAIL from READY: status == RECONDITIONING, recondition_count == 1"
            - "FAIL from RECONDITIONING: status stays RECONDITIONING, recondition_count == 2"
            - "PASS: status == READY, recondition_count stays 2"
      - name: booking_no_show_via_sweep
        claim_type: automatic_transition
        grounds: [state_machines.ServiceBooking.BOOKED_to_NO_SHOW]
        distinguishing_aspect: "Sweep marks BOOKED bookings NO_SHOW once clock passes start_at + 60 min without check-in; RO demotes to OPEN."
