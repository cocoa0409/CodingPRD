              payload: { order_id: "${order3_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-13", scheduled_end_date: "2026-08-15", labor_base_cents: 480000, expected_order_version: "${order3_v}" }
              as: NetworkAdmin
              captures: { job3_id: $.data.id }
          assert:
            - "trigger step 1 returns HTTP 409 with error_id ERR_SET_CREW_CAPACITY_EXCEEDED"
