  # ========================================================== 4. Validations
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /claims"
              payload: { policyholder_id: "00000000-0000-0000-0000-000000000000", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status == 400"

      - name: existence_beats_state_on_nested_path
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_COVERAGE_VERIFICATION_NOT_FOUND]"]
        distinguishing_aspect: "decide on a non-existent verification id returns 404 (existence, priority 3) rather than any state error — existence precedes state."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /coverage-verifications/00000000-0000-0000-0000-000000000000/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COVERAGE_VERIFICATION_NOT_FOUND and http status == 404"

