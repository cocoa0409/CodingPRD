            - *k_verify_reg
            - *k_verify_ins
            - *k_submit
            - *k_list_approve
            - *k_fund
            - *k_booking
            - *k_bk_approve
            - *k_bk_confirm
            - *k_read_pre
            - *k_tp_pre_front
            - *k_tp_pre_rear
            - *k_tp_pre_interior
            - *k_tp_pre_roof
            - *k_tp_pre_under
            - *k_bk_start
          trigger:
            - call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "MID_TRIP"
                odometer_miles: 42200
                generator_hours: 126.0
                recorded_at: "2026-08-31T09:00:00Z"
              as: Renter
              as_user_id: "${renter_id}"
            - call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "POST_TRIP"
                odometer_miles: 42470
                generator_hours: 134.5
                recorded_at: "2026-09-02T10:00:00Z"
              as: Owner
              as_user_id: "${owner_id}"
            - *k_tp_post_front
            - *k_tp_post_rear
            - *k_tp_post_interior
            - *k_tp_post_roof
