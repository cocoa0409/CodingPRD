scenario: |
  551. Hardscape & Paver Patio / Outdoor Living (Belgard contractor style): design & 3D
  rendering, material selection (paver/retaining wall/fire pit/outdoor kitchen), site
  measure & sq-ft estimate, permit & HOA, material order & delivery, crew & phase
  scheduling, change order, deposit/progress draw & warranty.

domain_name: hardscape-outdoor-living
# Flat (peer) topology: every entity is its own top-level collection keyed by a server-
# minted UUID and linked to others by FK fields in the request body, so there is no
# top-level nesting prefix. api_prefix is empty; each endpoint path is absolute.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration      # design -> estimate -> approvals -> contract -> order -> schedule -> build -> warranty, with branching + compensation
  secondary_archetype: ledger_reconciliation      # estimate-vs-as-built billing, deposit/progress/retention draws, change-order deltas
  complexity_layers:
    - dual_variant_calculation                    # estimate (billable+waste) vs as-built (installed) project valuation; recompute vs line-delta change order
    - cascading_side_effects                      # change-order-raises-permit revert chain; final-phase bubble-up chain
    - rate_threshold_triggers                      # labor tier boundaries, permit wall-height boundary, deposit cap, delivery daily capacity
    - optimistic_concurrency                       # OCC on Project.version for change-order and draw creation (CREATE-with-supersede on the financial ledger)

  entity_topology: flat
  state_machine_shape: branching                   # DesignRevision cyclic revision loop; HOA fork-join; Permit branch; Project posture with revert
  relationship_patterns:
    - one_to_many                                  # Project -> (LineItem, DesignRevision, Permit, HoaSubmission, ChangeOrder, MaterialOrder, WorkPhase, ProgressDraw, WarrantyClaim, SiteMeasurement)
    - cross_aggregate                              # WorkPhase -> Crew, LineItem -> Product, ChangeOrder -> Product, ProgressDraw -> WorkPhase, Project -> Customer
  role_model: peer_roles                            # DesignConsultant / ProjectManager / Client own different slices; PlatformAdmin is the authority-of-record clerk
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Homeowner name.
      - name: email
        type: string
        source: input
        description: Contact email; unique across customers.
        constraints: unique
      - name: phone
        type: string
        source: input
        description: Contact phone.
      - name: billing_address
        type: string
        source: input
        description: Billing address.

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Belgard catalog SKU; unique.
        constraints: unique
      - name: name
        type: string
        source: input
        description: Product display name.
      - name: category
        type: enum
        source: input
        description: "Product family."
        constraints: "one of {PAVER, WALL_BLOCK, FIRE_PIT, OUTDOOR_KITCHEN}"
      - name: unit
        type: enum
        source: input
        description: "Selling/measurement unit."
        constraints: "one of {SQFT, FACE_SQFT, EACH, LINEAR_FT}"
      - name: unit_price_cents
        type: integer
        source: input
        description: Current catalog price per unit, in cents.
        constraints: ">= 0"
      - name: waste_factor
        type: number
        source: input
        description: "Fractional overage billed on measured quantity (e.g., 0.10 = 10%). Applied to PAVER/WALL_BLOCK; use 0 for EACH/LINEAR_FT."
        default: 0
        constraints: ">= 0 and < 1"
      - name: coverage_per_pallet_sqft
        type: number
        source: input
        description: "SQFT/FACE_SQFT covered by one pallet, used for material-order pallet rounding. Ignored (may be 0) for EACH/LINEAR_FT."
        default: 0
        constraints: ">= 0"
      - name: is_feature
        type: boolean
        source: computed
        description: "True iff category in {FIRE_PIT, OUTDOOR_KITCHEN}; feeds per-feature labor."

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Crew name.
      - name: region_code
        type: string
        source: input
        description: Region the crew serves.
      - name: active_booking_count
        type: integer
        source: computed
        description: "Count of WorkPhase where crew_id == this.id AND status IN {SCHEDULED, IN_PROGRESS}. Incremented on schedule, decremented on the phase leaving those states (cancel/block)."
        default: 0

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the homeowner who owns this project."
      - name: site_address
        type: string
        source: input
        description: Job-site address.
      - name: region_code
        type: string
        source: input
        description: Region used for crew matching and delivery-capacity scoping.
      - name: in_hoa
        type: boolean
        source: input
        description: Whether the site is inside an HOA (drives hoa_required).
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle posture."
        default: DRAFT
        constraints: "one of {DRAFT, QUOTED, PENDING_APPROVALS, CONTRACTED, IN_PRODUCTION, COMPLETED, CANCELLED}"
      - name: permit_required
        type: boolean
        source: computed
        description: "Set at generate-estimate: true iff any SiteMeasurement.wall_height_in >= 48 (PERMIT_WALL_HEIGHT_IN). May flip true later via an approved ChangeOrder that raises wall height."
        default: false
      - name: hoa_required
        type: boolean
        source: computed
        description: "Set at generate-estimate: equals in_hoa."
        default: false
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "project_valuation calc, variant=estimate (billable quantities incl. waste). Set at generate-estimate."
        default: 0
      - name: prompt_pay_discount_cents
        type: integer
        source: computed
        description: "Prompt-pay discount component of project_valuation."
        default: 0
      - name: contract_value_cents
        type: integer
        source: computed
        description: "Signed contract value. Equals estimated_total_cents at generate-estimate; re-derived by each approved ChangeOrder (recompute variant)."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "SUM of ProgressDraw.amount_cents WHERE status == PAID (money-conservation invariant)."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "contract_value_cents - amount_paid_cents."
        default: 0
      - name: final_billed_total_cents
        type: integer
        source: computed
        description: "project_valuation calc, variant=as_built (installed quantities, no waste). Set when status -> COMPLETED; 0 until then."
        default: 0
      - name: warranty_start_date
        type: datetime
        source: computed
        description: "Logical clock instant at COMPLETED; null before."
      - name: warranty_end_date
        type: datetime
        source: computed
        description: "warranty_start_date + WARRANTY_TERM_DAYS (365); null before COMPLETED."

  - name: DesignRevision
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: revision_round
        type: integer
        source: system
        description: "Starts at 1; incremented each time a REVISION_REQUESTED revision is revised back to DRAFTING."
        default: 1
      - name: render_url
        type: string
        source: system
        description: "3D render artifact URL; set by the render transition."
      - name: notes
        type: string
        source: input
        description: Designer notes.
      - name: status
        type: enum
        source: system
        description: "Design revision state."
        default: DRAFTING
        constraints: "one of {DRAFTING, RENDERED, IN_REVIEW, REVISION_REQUESTED, APPROVED}"

  - name: SiteMeasurement
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: zone_label
        type: string
        source: input
        description: "Measured zone (e.g., 'rear patio', 'seat wall')."
      - name: measured_sqft
        type: number
        source: input
        description: Measured area for the zone.
        constraints: ">= 0"
      - name: wall_height_in
        type: number
        source: input
        description: "Retaining/seat wall height in inches for this zone (0 if no wall). Feeds permit_determination boundary."
        default: 0
        constraints: ">= 0"

  - name: LineItem
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id."
      - name: category
        type: enum
        source: computed
        description: "Denormalized from Product.category at creation."
        constraints: "one of {PAVER, WALL_BLOCK, FIRE_PIT, OUTDOOR_KITCHEN}"
      - name: measured_quantity
        type: number
        source: input
        description: "Quantity in the product's unit (sqft/face-sqft/each/linear-ft) from the site measure."
        constraints: "> 0"
      - name: pinned_unit_price_cents
        type: integer
        source: computed
        description: "Snapshot of Product.unit_price_cents taken at sign-contract; null until CONTRACTED. Used as the pinned price in change-order line-delta pricing."
      - name: installed_quantity
        type: number
        source: system
        description: "Actual installed quantity recorded when a covering WorkPhase completes; null until then."
      - name: origin
        type: enum
        source: system
        description: "How the line entered the project."
        default: ORIGINAL
        constraints: "one of {ORIGINAL, CHANGE_ORDER}"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id. Created (not client-POSTed) by submit-approvals when permit_required."
      - name: permit_number
        type: string
        source: system
        description: Authority-issued number, set on approval.
      - name: fee_cents
        type: integer
        source: computed
        description: "PERMIT_FLAT_FEE_CENTS (35000) at creation."
        default: 35000
      - name: correction_notes
        type: string
        source: input
        description: Notes attached on denial.
      - name: status
        type: enum
        source: system
        description: "Permit application state."
        default: PREPARING
        constraints: "one of {PREPARING, SUBMITTED, APPROVED, DENIED}"

  - name: HoaSubmission
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id. Created by submit-approvals when hoa_required."
      - name: decision_notes
        type: string
        source: input
        description: Reviewer notes on decision.
      - name: conditions
        type: string
        source: input
        description: Conditions attached to a CONDITIONAL decision.
      - name: status
        type: enum
        source: system
        description: "HOA architectural-review state."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, CONDITIONAL, REJECTED}"

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: description
        type: string
        source: input
        description: Scope-change description.
      - name: add_product_id
        type: string
        source: input
        description: "FK -> Product.id; the product whose new line this change order adds on approval."
      - name: add_measured_quantity
        type: number
        source: input
        description: Measured quantity for the added line.
        constraints: "> 0"
      - name: add_wall_height_in
        type: number
        source: input
        description: "Wall height (inches) if the added product is a WALL_BLOCK; feeds the permit-revert cascade. 0 otherwise."
        default: 0
        constraints: ">= 0"
      - name: expected_project_version
        type: integer
        source: input
        description: "OCC guard: the Project.version the client last observed. Rejected with ERR_STALE_VERSION if it no longer matches."
      - name: pricing_method
        type: enum
        source: system
        description: "Pinned to RECOMPUTE (whole-project re-estimate minus prior contract value)."
        default: RECOMPUTE
        constraints: "one of {RECOMPUTE}"
      - name: price_delta_cents
        type: integer
        source: computed
        description: "change_order_price_delta calc (RECOMPUTE variant). Set on approval; 0 while PROPOSED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Change-order state."
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, REJECTED}"

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: region_code
        type: string
        source: computed
        description: "Denormalized from Project.region_code; scopes the delivery-capacity check."
      - name: requested_delivery_date
        type: string
        source: input
        description: "Requested delivery calendar date (YYYY-MM-DD)."
      - name: line_item_ids
        type: array
        source: input
        description: "LineItem ids covered by this order (must be non-empty; must belong to project_id)."
      - name: total_pallets
        type: integer
        source: computed
        description: "material_order_pallets calc: SUM over covered SQFT/FACE_SQFT lines of ceil(billable_quantity / coverage_per_pallet_sqft). Set at place; 0 while DRAFT."
        default: 0
      - name: total_sqft_ordered
        type: number
        source: computed
        description: "total_pallets * (per-line coverage), i.e. SUM of pallet-rounded coverage; set at place."
        default: 0
      - name: supplier_ref
        type: string
        source: input
        description: Supplier reference/PO string.
      - name: status
        type: enum
        source: system
        description: "Order state."
        default: DRAFT
        constraints: "one of {DRAFT, PLACED, DELIVERED, CANCELLED}"

  - name: WorkPhase
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; null until scheduled. Set by the schedule transition."
      - name: phase_type
        type: enum
        source: input
        description: "Build phase."
        constraints: "one of {EXCAVATION, BASE_PREP, PAVER_SET, WALL_BUILD, FEATURE_INSTALL, FINAL_GRADE}"
      - name: requires_permit
        type: boolean
        source: computed
        description: "True iff phase_type == WALL_BUILD AND Project.permit_required at schedule time."
        default: false
      - name: covered_line_item_ids
        type: array
        source: input
        description: "LineItem ids whose installed_quantity this phase records on completion."
        default: []
      - name: sequence_index
        type: integer
        source: input
        description: Ordering hint within the project build.
        default: 0
      - name: is_final
        type: boolean
        source: input
        description: "If true, completing this phase bubbles the Project to COMPLETED."
        default: false
      - name: start_date
        type: string
        source: input
        description: "Scheduled start calendar date (YYYY-MM-DD); set by schedule."
      - name: end_date
        type: string
        source: input
        description: "Scheduled end calendar date (YYYY-MM-DD), inclusive; set by schedule."
      - name: status
        type: enum
        source: system
        description: "Phase state."
        default: PLANNED
        constraints: "one of {PLANNED, SCHEDULED, IN_PROGRESS, COMPLETED, BLOCKED, CANCELLED}"

  - name: ProgressDraw
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: work_phase_id
        type: string
        source: input
        description: "FK -> WorkPhase.id; optional milestone this draw is tied to (null for DEPOSIT/RETENTION_RELEASE)."
      - name: draw_type
        type: enum
        source: input
        description: "Draw kind. RETENTION_RELEASE is system-created at COMPLETED, never client-POSTed."
        constraints: "one of {DEPOSIT, PROGRESS, RETENTION_RELEASE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Requested amount. For DEPOSIT/PROGRESS this is client input; for RETENTION_RELEASE it is computed = round(contract_value_cents * RETENTION_PCT)."
        constraints: "> 0"
      - name: expected_project_version
        type: integer
        source: input
        description: "OCC guard: the Project.version the client last observed. Required for DEPOSIT/PROGRESS create."
      - name: status
        type: enum
        source: system
        description: "Draw state."
        default: PENDING
        constraints: "one of {PENDING, PAID, REFUNDED, VOID}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id."
      - name: claim_category
        type: enum
        source: input
        description: "Claim type."
        constraints: "one of {WORKMANSHIP, MATERIAL, SETTLEMENT}"
      - name: description
        type: string
        source: input
        description: Claim description.
      - name: filed_at
        type: datetime
        source: system
        description: Logical clock instant when filed.
      - name: status
        type: enum
        source: system
        description: "Claim state."
        default: FILED
        constraints: "one of {FILED, APPROVED, DENIED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    note: "Project.version increments by 1 on EVERY mutation of a Project field (status or any *_cents/permit/hoa/warranty field), including mutations caused by cascades from child transitions."
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /projects/{id}/generate-estimate"
        actor: DesignConsultant
        preconditions:
          - "At least one DesignRevision for this project has status == APPROVED (else ERR_DESIGN_NOT_APPROVED)"
          - "At least one SiteMeasurement exists for this project (else ERR_NO_MEASUREMENT)"
          - "At least one LineItem exists for this project (else ERR_NO_LINE_ITEMS)"
        side_effects:
          - "Run project_valuation variant=estimate -> set estimated_total_cents and prompt_pay_discount_cents"
          - "Set contract_value_cents = estimated_total_cents; set balance_due_cents = contract_value_cents"
          - "Run permit_determination -> set permit_required = (max SiteMeasurement.wall_height_in >= 48)"
          - "Set hoa_required = in_hoa"
          - "Increment Project.version by 1"
      - from: QUOTED
        to: PENDING_APPROVALS
        trigger: "POST /projects/{id}/submit-approvals"
        actor: ProjectManager
        preconditions:
          - "Project.status == QUOTED"
        side_effects:
          - "If permit_required: create a Permit (status PREPARING, fee_cents=35000) for this project"
          - "If hoa_required: create a HoaSubmission (status DRAFT) for this project"
          - "Increment Project.version by 1"
      - from: PENDING_APPROVALS
        to: CONTRACTED
        trigger: "POST /projects/{id}/sign-contract"
        actor: Client
        preconditions:
          - "Caller is the project owner (Project.customer_id == X-User-ID)"
          - "A ProgressDraw of draw_type DEPOSIT exists with status == PAID (else ERR_DEPOSIT_NOT_PAID)"
          - "If hoa_required: the HoaSubmission.status == APPROVED (else ERR_HOA_NOT_APPROVED). NOTE: permit approval is NOT required to sign."
        side_effects:
          - "For every LineItem: set pinned_unit_price_cents = its Product.unit_price_cents (price lock)"
          - "Set contract_value_cents = estimated_total_cents (final)"
          - "Increment Project.version by 1"
      - from: CONTRACTED
        to: IN_PRODUCTION
        trigger: "POST /projects/{id}/start-production"
        actor: ProjectManager
        preconditions:
          - "At least one MaterialOrder for this project has status == DELIVERED (else ERR_MATERIAL_NOT_DELIVERED)"
          - "At least one WorkPhase for this project has status == SCHEDULED"
        side_effects:
          - "Increment Project.version by 1"
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "system: final WorkPhase (is_final == true) completes"
        actor: system
        preconditions:
          - "The completing WorkPhase has is_final == true"
        side_effects:
          - "Run project_valuation variant=as_built -> set final_billed_total_cents"
          - "Create a RETENTION_RELEASE ProgressDraw (status PENDING, amount_cents = round(contract_value_cents * 0.05))"
          - "Set warranty_start_date = current logical clock; warranty_end_date = warranty_start_date + 365 days"
          - "Increment Project.version by 1"
      - from: CONTRACTED
        to: PENDING_APPROVALS
        trigger: "system: an approved ChangeOrder raises wall height to >= 48 while permit_required was false"
        actor: system
        preconditions:
          - "ChangeOrder.add_wall_height_in >= 48 AND Project.permit_required == false before approval"
        side_effects:
          - "Set permit_required = true; create a Permit (PREPARING) if none exists"
          - "Cascade: every WorkPhase in {SCHEDULED, IN_PROGRESS} for this project -> BLOCKED (which releases its crew)"
          - "Increment Project.version by 1"
        note: "Depth-3 cascade origin (ChangeOrder -> Project -> WorkPhase -> Crew). See ChangeOrder.APPROVE."
      - from: IN_PRODUCTION
        to: PENDING_APPROVALS
        trigger: "system: an approved ChangeOrder raises wall height to >= 48 while permit_required was false"
        actor: system
        preconditions:
          - "ChangeOrder.add_wall_height_in >= 48 AND Project.permit_required == false before approval"
        side_effects:
          - "Set permit_required = true; create a Permit (PREPARING) if none exists"
          - "Cascade: every WorkPhase in {SCHEDULED, IN_PROGRESS} for this project -> BLOCKED (releases crew)"
          - "Increment Project.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: ["Project.status not in {COMPLETED, CANCELLED}"]
        side_effects: ["Increment Project.version by 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: ["Project.status not in {COMPLETED, CANCELLED}"]
        side_effects: ["Increment Project.version by 1"]
      - from: PENDING_APPROVALS
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: ["Project.status not in {COMPLETED, CANCELLED}"]
        side_effects: ["Increment Project.version by 1"]
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: ["Project.status not in {COMPLETED, CANCELLED}"]
        side_effects:
          - "Cascade down: every non-terminal MaterialOrder -> CANCELLED; every WorkPhase in {PLANNED, SCHEDULED, IN_PROGRESS, BLOCKED} -> CANCELLED (releasing crews); every ProgressDraw in {PENDING} -> VOID"
          - "Increment Project.version by 1"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: ["Project.status not in {COMPLETED, CANCELLED}"]
        side_effects:
          - "Cascade down: every non-terminal MaterialOrder -> CANCELLED; every WorkPhase in {PLANNED, SCHEDULED, IN_PROGRESS, BLOCKED} -> CANCELLED (releasing crews); every ProgressDraw in {PENDING} -> VOID"
          - "Increment Project.version by 1"

  - entity: DesignRevision
    initial_state: DRAFTING
    terminal_states: [APPROVED]
    note: "Cyclic revision loop (Rule 3): IN_REVIEW -> REVISION_REQUESTED -> DRAFTING re-enters the loop."
    transitions:
      - from: DRAFTING
        to: RENDERED
        trigger: "POST /design-revisions/{id}/render"
        actor: DesignConsultant
        preconditions: ["status == DRAFTING"]
        side_effects: ["Set render_url to a generated artifact URL"]
      - from: RENDERED
        to: IN_REVIEW
        trigger: "POST /design-revisions/{id}/submit-review"
        actor: DesignConsultant
        preconditions: ["status == RENDERED"]
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /design-revisions/{id}/approve"
        actor: Client
        preconditions:
          - "status == IN_REVIEW"
          - "Caller owns the parent Project (Project.customer_id == X-User-ID)"
        side_effects: []
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /design-revisions/{id}/request-revision"
        actor: Client
        preconditions:
          - "status == IN_REVIEW"
          - "Caller owns the parent Project"
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFTING
        trigger: "POST /design-revisions/{id}/revise"
        actor: DesignConsultant
        preconditions: ["status == REVISION_REQUESTED"]
        side_effects: ["Increment revision_round by 1; clear render_url"]

  - entity: Permit
    initial_state: PREPARING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PREPARING
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: ProjectManager
        preconditions: ["status == PREPARING"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permits/{id}/approve"
        actor: PlatformAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["Set permit_number"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /permits/{id}/deny"
        actor: PlatformAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["Set correction_notes from request"]

  - entity: HoaSubmission
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    note: "Branching fork-join (Rule 3): SUBMITTED forks to {APPROVED, CONDITIONAL, REJECTED} with divergent side effects; CONDITIONAL re-enters via submit."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hoa-submissions/{id}/submit"
        actor: ProjectManager
        preconditions: ["status in {DRAFT, CONDITIONAL}"]
        side_effects: []
      - from: CONDITIONAL
        to: SUBMITTED
        trigger: "POST /hoa-submissions/{id}/submit"
        actor: ProjectManager
        preconditions: ["status in {DRAFT, CONDITIONAL}"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /hoa-submissions/{id}/decide (outcome=APPROVED)"
        actor: PlatformAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["Set decision_notes"]
      - from: SUBMITTED
        to: CONDITIONAL
        trigger: "POST /hoa-submissions/{id}/decide (outcome=CONDITIONAL)"
        actor: PlatformAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["Set conditions and decision_notes; sign-contract remains blocked until a later APPROVED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /hoa-submissions/{id}/decide (outcome=REJECTED)"
        actor: PlatformAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects: ["Set decision_notes"]

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "status == PROPOSED"
          - "Project.status in {CONTRACTED, IN_PRODUCTION}"
        side_effects:
          - "Create a LineItem (origin=CHANGE_ORDER) from add_product_id/add_measured_quantity; set its pinned_unit_price_cents = Product.unit_price_cents"
          - "Run change_order_price_delta (RECOMPUTE) -> set price_delta_cents; set Project.contract_value_cents = new recomputed valuation; recompute Project.balance_due_cents"
          - "If add_wall_height_in >= 48 AND Project.permit_required was false: trigger the Project CONTRACTED/IN_PRODUCTION -> PENDING_APPROVALS revert cascade (see Project machine)"
          - "Increment Project.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: ProjectManager
        preconditions: ["status == PROPOSED"]
        side_effects: ["Increment Project.version by 1 (ledger touch)"]

  - entity: MaterialOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /material-orders/{id}/place"
        actor: ProjectManager
        preconditions:
          - "status == DRAFT"
          - "Project.status in {CONTRACTED, IN_PRODUCTION}"
          - "Fewer than DELIVERY_DAILY_CAP (2) other MaterialOrders in {PLACED, DELIVERED} share this order's (region_code, requested_delivery_date) (else ERR_DELIVERY_SLOT_FULL)"
        side_effects:
          - "Run material_order_pallets -> set total_pallets and total_sqft_ordered"
      - from: PLACED
        to: DELIVERED
        trigger: "POST /material-orders/{id}/confirm-delivery"
        actor: ProjectManager
        preconditions: ["status == PLACED"]
        side_effects: []

  - entity: WorkPhase
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /work-phases/{id}/schedule"
        actor: ProjectManager
        preconditions:
          - "status == PLANNED"
          - "Project.status in {CONTRACTED, IN_PRODUCTION}"
          - "crew_id references an existing Crew (else ERR_CREW_NOT_FOUND)"
          - "If phase_type == WALL_BUILD AND Project.permit_required: the project's Permit.status == APPROVED (else ERR_PERMIT_NOT_APPROVED)"
          - "end_date >= start_date (else ERR_INVALID_DATE_RANGE)"
          - "The crew has no other WorkPhase in {SCHEDULED, IN_PROGRESS} whose [start_date, end_date] closed interval intersects this one (else ERR_CREW_DOUBLE_BOOKED)"
        side_effects:
          - "Set crew_id, start_date, end_date; set requires_permit; increment Crew.active_booking_count by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-phases/{id}/start"
        actor: ProjectManager
        preconditions:
          - "status == SCHEDULED"
          - "Project.status == IN_PRODUCTION"
          - "If phase_type == WALL_BUILD AND Project.permit_required: Permit.status == APPROVED (else ERR_PERMIT_NOT_APPROVED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-phases/{id}/complete"
        actor: ProjectManager
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "For each covered LineItem: set installed_quantity from the request's installed_quantities map"
          - "Decrement Crew.active_booking_count by 1"
          - "If is_final == true: bubble up -> Project.status IN_PRODUCTION -> COMPLETED (runs the Project COMPLETED side effects)"
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system: Project reverts to PENDING_APPROVALS via change-order permit raise"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["Decrement Crew.active_booking_count by 1 (release crew)"]
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "system: Project reverts to PENDING_APPROVALS via change-order permit raise"
        actor: system
        preconditions: ["status == IN_PROGRESS"]
        side_effects: ["Decrement Crew.active_booking_count by 1 (release crew)"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system: Project cancel cascade"
        actor: system
        preconditions: ["Project.status -> CANCELLED"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: Project cancel cascade"
        actor: system
        preconditions: ["Project.status -> CANCELLED"]
        side_effects: ["Decrement Crew.active_booking_count by 1 (release crew)"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system: Project cancel cascade"
        actor: system
        preconditions: ["Project.status -> CANCELLED"]
        side_effects: ["Decrement Crew.active_booking_count by 1 (release crew)"]
      - from: BLOCKED
        to: CANCELLED
        trigger: "system: Project cancel cascade"
        actor: system
        preconditions: ["Project.status -> CANCELLED"]
        side_effects: []

  - entity: ProgressDraw
    initial_state: PENDING
    terminal_states: [REFUNDED, VOID]
    note: "amount_paid conservation (Rule 9): Project.amount_paid_cents == SUM of amount_cents over draws with status == PAID at all times."
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /draws/{id}/record-payment"
        actor: ProjectManager
        preconditions: ["status == PENDING"]
        side_effects:
          - "Add amount_cents to Project.amount_paid_cents; recompute Project.balance_due_cents; increment Project.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /draws/{id}/refund"
        actor: ProjectManager
        preconditions: ["status == PAID"]
        side_effects:
          - "Subtract amount_cents from Project.amount_paid_cents; recompute Project.balance_due_cents; increment Project.version by 1"
      - from: PENDING
        to: VOID
        trigger: "system: Project cancel cascade voids PENDING draws"
        actor: system
        preconditions: ["status == PENDING", "Project.status -> CANCELLED"]
        side_effects: []

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/decide (outcome=APPROVED)"
        actor: PlatformAdmin
        preconditions: ["status == FILED"]
        side_effects: []
      - from: FILED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/decide (outcome=DENIED)"
        actor: PlatformAdmin
        preconditions: ["status == FILED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on Project.version; CREATE-with-supersede on the ledger)
# =============================================================================
concurrency_rules:
  - rule_id: change-order-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder whose price_delta will be recomputed against a Project
      whose version has advanced since the client last observed it is rejected. A prior
      change-order or draw that touched the ledger legitimately superseded the client's
      view, so the stale expected_project_version no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: draw-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /draws"
    occ_field: "expected_project_version"
    description: |
      Creating a ProgressDraw against a Project whose version has advanced since the
      client last observed it is rejected. Another draw or an approved change-order has
      already shifted contract_value_cents / amount_paid_cents, so the client's balance
      view (and thus expected_project_version) is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: project_valuation
    trigger: "generate-estimate (variant=estimate); Project -> COMPLETED (variant=as_built)"
    algorithm: forward_looking
    input_set: "All LineItems of the project. variant=estimate uses billable quantity = measured_quantity * (1 + Product.waste_factor). variant=as_built uses installed_quantity (no waste). SiteMeasurement.wall_height_in drives permit_fee via permit_determination."
    formula: |
      # Pinned evaluation order (mode c: prompt-pay discount is keyed on a subtotal that also feeds the total):
      # 1. per LineItem: line_material = round_half_up( qty * unit_price_cents )
      #      qty = measured_quantity*(1+waste_factor)   [estimate]   OR   installed_quantity [as_built]
      #      unit_price_cents = Product.unit_price_cents (estimate) or pinned_unit_price_cents (as_built)
      # 2. material_subtotal = SUM(line_material)
      # 3. paver_sqft = SUM(qty of category==PAVER lines)
      #    base_paver_labor = paver_sqft * labor_rate(paver_sqft)     [labor_cost calc]
      #    if any SiteMeasurement.wall_height_in >= 48: base_paver_labor = round_half_up(base_paver_labor * 1.15)
      # 4. wall_labor = SUM(qty of category==WALL_BLOCK lines) * 900
      # 5. feature_labor = COUNT(lines where Product.is_feature) * 25000
      # 6. labor_cost = base_paver_labor + wall_labor + feature_labor
      # 7. pre_tax_subtotal = material_subtotal + labor_cost
      # 8. prompt_pay_discount = round_half_up(pre_tax_subtotal * 0.02) if pre_tax_subtotal >= 2000000 else 0
      # 9. tax = round_half_up(material_subtotal * 0.0725)          # material only; labor/permit untaxed
      # 10. permit_fee = 35000 if permit_required else 0
      # 11. total = pre_tax_subtotal - prompt_pay_discount + tax + permit_fee
    constants:
      TAX_RATE: 0.0725
      PROMPT_PAY_THRESHOLD_CENTS: 2000000
      PROMPT_PAY_RATE: 0.02
      PERMIT_FLAT_FEE_CENTS: 35000
      WALL_LABOR_RATE_CENTS: 900
      FEATURE_LABOR_CENTS: 25000
      COMPLEX_SITE_MULTIPLIER: 1.15
    precision: "integer cents, round_half_up per the pinned order above"
    variants:
      - name: estimate
        when: "generate-estimate; before any as-built data exists"
        difference: "Uses billable quantity = measured_quantity*(1+waste_factor) and live Product.unit_price_cents -> estimated_total_cents."
      - name: as_built
        when: "Project -> COMPLETED"
        difference: "Uses actual installed_quantity (no waste) and pinned_unit_price_cents -> final_billed_total_cents; diverges from estimate whenever installed != billable."

  - name: labor_cost
    trigger: "sub-calc of project_valuation (steps 3-6)"
    algorithm: tiered_pricing
    input_set: "PAVER and WALL_BLOCK LineItems; feature line count."
    formula: |
      labor_rate(paver_sqft) =
        700 if paver_sqft <= 200
        600 if 200 < paver_sqft <= 500
        525 if paver_sqft > 500          # FLAT selection by tier (average rate on whole sqft, not marginal)
      base_paver_labor = paver_sqft * labor_rate(paver_sqft)
      if any wall_height_in >= 48: base_paver_labor = round_half_up(base_paver_labor * 1.15)
      labor_cost = base_paver_labor + wall_sqft*900 + feature_count*25000
    constants:
      TIER1_MAX_SQFT: 200
      TIER2_MAX_SQFT: 500
      TIER1_RATE_CENTS: 700
      TIER2_RATE_CENTS: 600
      TIER3_RATE_CENTS: 525
      COMPLEX_SITE_MULTIPLIER: 1.15
    precision: "integer cents, round_half_up when the multiplier applies"

  - name: material_order_pallets
    trigger: "POST /material-orders/{id}/place"
    algorithm: aggregation
    input_set: "Covered LineItems whose Product.unit in {SQFT, FACE_SQFT}; EACH/LINEAR_FT lines contribute 0 pallets."
    formula: |
      # Rounding order is PINNED: round per line to whole pallets, THEN sum.
      # (sum-then-round is the tempting divergent interpretation and is WRONG here.)
      for each covered SQFT/FACE_SQFT line:
        billable = measured_quantity * (1 + Product.waste_factor)
        pallets_line = ceil( billable / Product.coverage_per_pallet_sqft )
      total_pallets = SUM(pallets_line)
      total_sqft_ordered = SUM(pallets_line * Product.coverage_per_pallet_sqft)
    constants: {}
    precision: "integer pallets; ceil per line"

  - name: change_order_price_delta
    trigger: "POST /change-orders/{id}/approve"
    algorithm: forward_looking
    input_set: "Project LineItems before approval plus the newly added line. RECOMPUTE variant re-runs project_valuation(estimate) over the enlarged line set."
    formula: |
      old_value = Project.contract_value_cents (before approval)
      new_value = project_valuation(estimate) recomputed over {existing lines + added line}
      price_delta_cents = new_value - old_value          # RECOMPUTE (pinned/official)
      # line_delta variant (divergent, NOT used): add_material + add_labor_at_current_tier + add_tax,
      # which ignores re-tiering of the pre-existing paver sqft and therefore differs from RECOMPUTE.
    constants: {}
    precision: "integer cents"
    variants:
      - name: recompute
        when: "always (pinned official method)"
        difference: "Whole-project re-estimate minus prior contract value; re-tiers ALL paver sqft."
      - name: line_delta
        when: "tempting alternative — NOT used"
        difference: "Prices only the added line at the current tier; diverges from recompute when the addition crosses a labor tier boundary."

  - name: deposit_cap
    trigger: "validation on POST /draws where draw_type == DEPOSIT"
    algorithm: threshold
    input_set: "Project.contract_value_cents at time of deposit."
    formula: |
      deposit_cap_cents = min( round_half_up(contract_value_cents * 0.10), 100000 )
      reject if requested amount_cents > deposit_cap_cents
    constants:
      DEPOSIT_PCT: 0.10
      DEPOSIT_FLAT_CAP_CENTS: 100000
    precision: "integer cents, round_half_up on the percentage leg"

  - name: balance_due
    trigger: "after any draw record-payment/refund, sign-contract, or change-order approve"
    algorithm: aggregation
    input_set: "PAID ProgressDraws of the project."
    formula: |
      amount_paid_cents = SUM(amount_cents for draws where status == PAID)
      balance_due_cents = contract_value_cents - amount_paid_cents
    constants: {}
    precision: "integer cents"

  - name: permit_determination
    trigger: "POST /projects/{id}/generate-estimate; re-evaluated on ChangeOrder approve"
    algorithm: threshold
    input_set: "All SiteMeasurements of the project (and add_wall_height_in of an approved WALL_BLOCK change order)."
    formula: |
      permit_required = ( max(SiteMeasurement.wall_height_in over project) >= 48 )
      # boundary: 47 -> false, 48 -> true  (>=, inclusive)
    constants:
      PERMIT_WALL_HEIGHT_IN: 48
    precision: "boolean"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation (per RBAC matrix)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, types valid, enum members valid, quantities > 0, dates parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 4
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints (per-entity NOT_FOUND error used)"
  - priority: 5
    category: auth
    check: "Client acting on a project resource owns it (Project.customer_id == X-User-ID)"
    error_id: ERR_NOT_PROJECT_OWNER
    http_status: 403
    applies_to: "Client endpoints: design-revisions approve/request-revision, projects sign-contract, warranty-claims create"
  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is legal (state precondition). Domain-specific error id where defined."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_referential
    check: "Body FK targets exist and are consistent (product_id, crew_id, add_product_id, work_phase_id, line_item_ids belong to project)"
    error_id: ERR_CREW_NOT_FOUND
    http_status: 404
    applies_to: "create/link endpoints carrying body FKs"
  - priority: 8
    category: business_safety
    check: "Compliance gates: permit approved for permit-gated phase; HOA approved before contract"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "work-phases schedule/start, projects sign-contract"
  - priority: 9
    category: business_temporal
    check: "Temporal/resource conflicts: crew double-booking (closed-interval overlap), delivery daily capacity, end_date >= start_date"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "work-phases schedule, material-orders place"
  - priority: 10
    category: business_fiscal
    check: "Fiscal limits: deposit within cap; progress draw within balance_due"
    error_id: ERR_DRAW_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "draws create"
  - priority: 11
    category: business_fiscal
    check: "OCC: expected_project_version matches current Project.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "change-orders create, draws create"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Governs warranty_start_date/warranty_end_date and filed_at."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Set logical clock to to_iso8601"]

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a homeowner."
    roles: [DesignConsultant, PlatformAdmin]
    code: 201
    input: [full_name, email, "phone?", "billing_address?"]
    output: Customer
    side_effects: []

  # ---- Product (catalog) ----
  - method: POST
    path: "/products"
    description: "Create a catalog product."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, category, unit, unit_price_cents, "waste_factor?", "coverage_per_pallet_sqft?"]
    output: Product
    side_effects: ["Set is_feature from category"]
  - method: GET
    path: "/products/{id}"
    description: "Read a catalog product (also anchors the product URL segment for reverse lookups)."
    roles: [PlatformAdmin, DesignConsultant, ProjectManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Create an install crew."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Read a crew, including active_booking_count."
    roles: [PlatformAdmin, ProjectManager]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}/work-phases"
    description: "List work phases assigned to a crew (reverse lookup for WorkPhase.crew_id)."
    roles: [PlatformAdmin, ProjectManager]
    code: 200
    input: []
    output: WorkPhase[]
    side_effects: []

  # ---- Project ----
  - method: POST
    path: "/projects"
    description: "Create a project (DRAFT)."
    roles: [DesignConsultant, PlatformAdmin]
    code: 201
    input: [customer_id, site_address, region_code, "in_hoa?"]
    output: Project
    side_effects: []
  - method: GET
    path: "/projects/{id}"
    description: "Read a project (financials, posture, warranty dates, version)."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "List projects; filter by customer_id (reverse lookup for Project.customer_id)."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin, Client]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/generate-estimate"
    description: "DRAFT -> QUOTED. Runs project_valuation(estimate) and permit_determination."
    roles: [DesignConsultant]
    code: 200
    input: []
    output: Project
    side_effects: ["Set estimated_total_cents, prompt_pay_discount_cents, contract_value_cents, balance_due_cents, permit_required, hoa_required; increment version"]
  - method: POST
    path: "/projects/{id}/submit-approvals"
    description: "QUOTED -> PENDING_APPROVALS. Creates Permit/HoaSubmission as required."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Create Permit if permit_required; create HoaSubmission if hoa_required; increment version"]
  - method: POST
    path: "/projects/{id}/sign-contract"
    description: "PENDING_APPROVALS -> CONTRACTED. Pins line prices."
    roles: [Client]
    code: 200
    input: []
    output: Project
    side_effects: ["Pin every LineItem.pinned_unit_price_cents; finalize contract_value_cents; increment version"]
  - method: POST
    path: "/projects/{id}/start-production"
    description: "CONTRACTED -> IN_PRODUCTION."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Increment version"]
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Non-terminal -> CANCELLED with cascade."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Cascade cancel material orders/work phases (release crews); void PENDING draws; increment version"]

  # ---- DesignRevision ----
  - method: POST
    path: "/design-revisions"
    description: "Create a design revision (DRAFTING)."
    roles: [DesignConsultant]
    code: 201
    input: [project_id, "notes?"]
    output: DesignRevision
    side_effects: []
  - method: GET
    path: "/design-revisions/{id}"
    description: "Read a design revision."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: DesignRevision
    side_effects: []
  - method: GET
    path: "/projects/{id}/design-revisions"
    description: "List a project's design revisions (reverse lookup for DesignRevision.project_id)."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: DesignRevision[]
    side_effects: []
  - method: POST
    path: "/design-revisions/{id}/render"
    description: "DRAFTING -> RENDERED."
    roles: [DesignConsultant]
    code: 200
    input: []
    output: DesignRevision
    side_effects: ["Set render_url"]
  - method: POST
    path: "/design-revisions/{id}/submit-review"
    description: "RENDERED -> IN_REVIEW."
    roles: [DesignConsultant]
    code: 200
    input: []
    output: DesignRevision
    side_effects: []
  - method: POST
    path: "/design-revisions/{id}/approve"
    description: "IN_REVIEW -> APPROVED (Client, owner)."
    roles: [Client]
    code: 200
    input: []
    output: DesignRevision
    side_effects: []
  - method: POST
    path: "/design-revisions/{id}/request-revision"
    description: "IN_REVIEW -> REVISION_REQUESTED (Client, owner)."
    roles: [Client]
    code: 200
    input: []
    output: DesignRevision
    side_effects: []
  - method: POST
    path: "/design-revisions/{id}/revise"
    description: "REVISION_REQUESTED -> DRAFTING (cycle)."
    roles: [DesignConsultant]
    code: 200
    input: []
    output: DesignRevision
    side_effects: ["Increment revision_round; clear render_url"]

  # ---- SiteMeasurement ----
  - method: POST
    path: "/site-measurements"
    description: "Record a site measurement."
    roles: [DesignConsultant]
    code: 201
    input: [project_id, zone_label, measured_sqft, "wall_height_in?"]
    output: SiteMeasurement
    side_effects: []
  - method: GET
    path: "/site-measurements/{id}"
    description: "Read a site measurement."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin]
    code: 200
    input: []
    output: SiteMeasurement
    side_effects: []
  - method: GET
    path: "/projects/{id}/site-measurements"
    description: "List a project's site measurements (reverse lookup for SiteMeasurement.project_id)."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin]
    code: 200
    input: []
    output: SiteMeasurement[]
    side_effects: []

  # ---- LineItem ----
  - method: POST
    path: "/line-items"
    description: "Add a material selection line to a project."
    roles: [DesignConsultant]
    code: 201
    input: [project_id, product_id, measured_quantity]
    output: LineItem
    side_effects: ["Denormalize category from Product"]
  - method: GET
    path: "/line-items/{id}"
    description: "Read a line item."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: LineItem
    side_effects: []
  - method: GET
    path: "/projects/{id}/line-items"
    description: "List a project's line items (reverse lookup for LineItem.project_id)."
    roles: [DesignConsultant, ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: LineItem[]
    side_effects: []
  - method: GET
    path: "/products/{id}/line-items"
    description: "List line items referencing a product (reverse lookup for LineItem.product_id)."
    roles: [PlatformAdmin, DesignConsultant]
    code: 200
    input: []
    output: LineItem[]
    side_effects: []

  # ---- Permit ----
  - method: GET
    path: "/permits/{id}"
    description: "Read a permit."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/projects/{id}/permits"
    description: "List a project's permits (reverse lookup for Permit.project_id)."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/submit"
    description: "PREPARING -> SUBMITTED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/permits/{id}/approve"
    description: "SUBMITTED -> APPROVED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: ["Set permit_number"]
  - method: POST
    path: "/permits/{id}/deny"
    description: "SUBMITTED -> DENIED."
    roles: [PlatformAdmin]
    code: 200
    input: ["correction_notes?"]
    output: Permit
    side_effects: ["Set correction_notes"]

  # ---- HoaSubmission ----
  - method: GET
    path: "/hoa-submissions/{id}"
    description: "Read an HOA submission."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: HoaSubmission
    side_effects: []
  - method: GET
    path: "/projects/{id}/hoa-submissions"
    description: "List a project's HOA submissions (reverse lookup for HoaSubmission.project_id)."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: HoaSubmission[]
    side_effects: []
  - method: POST
    path: "/hoa-submissions/{id}/submit"
    description: "DRAFT/CONDITIONAL -> SUBMITTED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: HoaSubmission
    side_effects: []
  - method: POST
    path: "/hoa-submissions/{id}/decide"
    description: "SUBMITTED -> APPROVED | CONDITIONAL | REJECTED per outcome."
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "decision_notes?", "conditions?"]
    output: HoaSubmission
    side_effects: ["Set decision_notes/conditions per outcome"]

  # ---- ChangeOrder ----
  - method: POST
    path: "/change-orders"
    description: "Create a change order (PROPOSED). OCC-guarded on Project.version."
    roles: [ProjectManager]
    code: 201
    input: [project_id, "description?", add_product_id, add_measured_quantity, "add_wall_height_in?", expected_project_version]
    output: ChangeOrder
    side_effects: ["Increment Project.version by 1 (ledger touch)"]
  - method: GET
    path: "/change-orders/{id}"
    description: "Read a change order."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: GET
    path: "/projects/{id}/change-orders"
    description: "List a project's change orders (reverse lookup for ChangeOrder.project_id)."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/products/{id}/change-orders"
    description: "List change orders adding a given product (reverse lookup for ChangeOrder.add_product_id)."
    roles: [PlatformAdmin, ProjectManager]
    code: 200
    input: []
    output: ChangeOrder[]
    side_effects: []
  - method: POST
    path: "/change-orders/{id}/approve"
    description: "PROPOSED -> APPROVED; creates line, recomputes contract value, may trigger permit-revert cascade."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["Create CHANGE_ORDER LineItem; set price_delta_cents; update Project.contract_value_cents/balance_due_cents; possible revert cascade; increment Project.version"]
  - method: POST
    path: "/change-orders/{id}/reject"
    description: "PROPOSED -> REJECTED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["Increment Project.version"]

  # ---- MaterialOrder ----
  - method: POST
    path: "/material-orders"
    description: "Create a material order (DRAFT). line_item_ids must be non-empty and belong to project."
    roles: [ProjectManager]
    code: 201
    input: [project_id, requested_delivery_date, line_item_ids, "supplier_ref?"]
    output: MaterialOrder
    side_effects: ["Denormalize region_code from Project"]
  - method: GET
    path: "/material-orders/{id}"
    description: "Read a material order (total_pallets after place)."
    roles: [ProjectManager, PlatformAdmin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []
  - method: GET
    path: "/projects/{id}/material-orders"
    description: "List a project's material orders (reverse lookup for MaterialOrder.project_id)."
    roles: [ProjectManager, PlatformAdmin]
    code: 200
    input: []
    output: MaterialOrder[]
    side_effects: []
  - method: POST
    path: "/material-orders/{id}/place"
    description: "DRAFT -> PLACED; runs material_order_pallets and delivery-capacity check."
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["Set total_pallets, total_sqft_ordered"]
  - method: POST
    path: "/material-orders/{id}/confirm-delivery"
    description: "PLACED -> DELIVERED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []

  # ---- WorkPhase ----
  - method: POST
    path: "/work-phases"
    description: "Create a build phase (PLANNED)."
    roles: [ProjectManager]
    code: 201
    input: [project_id, phase_type, "covered_line_item_ids?", "sequence_index?", "is_final?"]
    output: WorkPhase
    side_effects: []
  - method: GET
    path: "/work-phases/{id}"
    description: "Read a work phase."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: WorkPhase
    side_effects: []
  - method: GET
    path: "/projects/{id}/work-phases"
    description: "List a project's work phases (reverse lookup for WorkPhase.project_id)."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: WorkPhase[]
    side_effects: []
  - method: POST
    path: "/work-phases/{id}/schedule"
    description: "PLANNED -> SCHEDULED; books a crew over [start_date,end_date]."
    roles: [ProjectManager]
    code: 200
    input: [crew_id, start_date, end_date]
    output: WorkPhase
    side_effects: ["Set crew_id/start_date/end_date/requires_permit; increment Crew.active_booking_count"]
  - method: POST
    path: "/work-phases/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WorkPhase
    side_effects: []
  - method: POST
    path: "/work-phases/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; records installed quantities; final phase bubbles Project to COMPLETED."
    roles: [ProjectManager]
    code: 200
    input: [installed_quantities]
    output: WorkPhase
    side_effects: ["Set covered LineItem.installed_quantity; decrement Crew.active_booking_count; if is_final, complete the Project"]

  # ---- ProgressDraw ----
  - method: POST
    path: "/draws"
    description: "Create a DEPOSIT or PROGRESS draw (PENDING). OCC-guarded on Project.version."
    roles: [ProjectManager]
    code: 201
    input: [project_id, draw_type, amount_cents, "work_phase_id?", expected_project_version]
    output: ProgressDraw
    side_effects: ["Increment Project.version by 1 (ledger touch)"]
  - method: GET
    path: "/draws/{id}"
    description: "Read a draw."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: ProgressDraw
    side_effects: []
  - method: GET
    path: "/projects/{id}/draws"
    description: "List a project's draws (reverse lookup for ProgressDraw.project_id)."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: ProgressDraw[]
    side_effects: []
  - method: GET
    path: "/work-phases/{id}/draws"
    description: "List draws tied to a work phase (reverse lookup for ProgressDraw.work_phase_id)."
    roles: [ProjectManager, PlatformAdmin]
    code: 200
    input: []
    output: ProgressDraw[]
    side_effects: []
  - method: POST
    path: "/draws/{id}/record-payment"
    description: "PENDING -> PAID; credits Project.amount_paid_cents."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressDraw
    side_effects: ["Add amount to Project.amount_paid_cents; recompute balance; increment Project.version"]
  - method: POST
    path: "/draws/{id}/refund"
    description: "PAID -> REFUNDED; debits Project.amount_paid_cents."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressDraw
    side_effects: ["Subtract amount from Project.amount_paid_cents; recompute balance; increment Project.version"]

  # ---- WarrantyClaim ----
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim (Client, owner). Requires Project COMPLETED and clock within warranty window."
    roles: [Client]
    code: 201
    input: [project_id, claim_category, "description?"]
    output: WarrantyClaim
    side_effects: ["Set filed_at from clock"]
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Read a warranty claim."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/projects/{id}/warranty-claims"
    description: "List a project's warranty claims (reverse lookup for WarrantyClaim.project_id)."
    roles: [ProjectManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/decide"
    description: "FILED -> APPROVED | DENIED per outcome."
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "resolution_notes?"]
    output: WarrantyClaim
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this operation."
  - id: ERR_NOT_PROJECT_OWNER
    http: 403
    condition: "Client acting on a project resource they do not own."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad type, invalid enum member, non-positive quantity, or unparseable date."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id references no Customer."
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id / add_product_id references no Product."
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crew_id references no Crew."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Project path/body id references no Project."
  - id: ERR_DESIGN_REVISION_NOT_FOUND
    http: 404
    condition: "DesignRevision id references none."
  - id: ERR_SITE_MEASUREMENT_NOT_FOUND
    http: 404
    condition: "SiteMeasurement id references none."
  - id: ERR_LINE_ITEM_NOT_FOUND
    http: 404
    condition: "A line_item_id / covered id references no LineItem, or it belongs to a different project."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "Permit id references none."
  - id: ERR_HOA_SUBMISSION_NOT_FOUND
    http: 404
    condition: "HoaSubmission id references none."
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "ChangeOrder id references none."
  - id: ERR_MATERIAL_ORDER_NOT_FOUND
    http: 404
    condition: "MaterialOrder id references none."
  - id: ERR_WORK_PHASE_NOT_FOUND
    http: 404
    condition: "WorkPhase id references none."
  - id: ERR_DRAW_NOT_FOUND
    http: 404
    condition: "ProgressDraw id references none."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "WarrantyClaim id references none."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition attempted from a state that does not allow it (generic)."
  - id: ERR_DESIGN_NOT_APPROVED
    http: 409
    condition: "generate-estimate with no APPROVED DesignRevision."
  - id: ERR_NO_MEASUREMENT
    http: 409
    condition: "generate-estimate with no SiteMeasurement."
  - id: ERR_NO_LINE_ITEMS
    http: 409
    condition: "generate-estimate with no LineItem."
  - id: ERR_DEPOSIT_NOT_PAID
    http: 409
    condition: "sign-contract before a DEPOSIT draw is PAID."
  - id: ERR_HOA_NOT_APPROVED
    http: 409
    condition: "sign-contract while hoa_required and HoaSubmission not APPROVED."
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "Scheduling/starting a WALL_BUILD phase while permit_required and Permit not APPROVED."
  - id: ERR_MATERIAL_NOT_DELIVERED
    http: 409
    condition: "start-production with no DELIVERED MaterialOrder."
  - id: ERR_NO_ORDERABLE_ITEMS
    http: 422
    condition: "MaterialOrder created with an empty line_item_ids array."
  - id: ERR_DELIVERY_SLOT_FULL
    http: 409
    condition: "place would exceed DELIVERY_DAILY_CAP (2) orders for the (region_code, requested_delivery_date)."
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "Crew already has a SCHEDULED/IN_PROGRESS phase whose closed interval intersects the requested one."
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "end_date earlier than start_date on schedule."
  - id: ERR_DEPOSIT_EXCEEDS_CAP
    http: 422
    condition: "DEPOSIT amount exceeds min(10% of contract_value, 100000)."
  - id: ERR_DRAW_EXCEEDS_BALANCE
    http: 422
    condition: "PROGRESS draw amount exceeds balance_due_cents."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_project_version does not match current Project.version (OCC)."
  - id: ERR_NOT_COMPLETED
    http: 409
    condition: "Filing a warranty claim on a project not COMPLETED."
  - id: ERR_WARRANTY_WINDOW_CLOSED
    http: 409
    condition: "Filing a warranty claim after warranty_end_date."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office/authority clerk: manages the Belgard catalog and crew roster, and records permit/HOA/warranty decisions (authority of record)."
    identity: opaque
    exclusive_operations:
      - "POST /products"
      - "POST /crews"
      - "POST /permits/{id}/approve"
      - "POST /permits/{id}/deny"
      - "POST /hoa-submissions/{id}/decide"
      - "POST /warranty-claims/{id}/decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers (with DesignConsultant)"
      - "POST /projects (with DesignConsultant)"
      - "GET reads"
  - name: DesignConsultant
    description: "Sales/design: creates customers, projects, design revisions (render/review/revise), site measurements, line items, and generates the estimate."
    identity: opaque
    exclusive_operations:
      - "POST /design-revisions"
      - "POST /design-revisions/{id}/render"
      - "POST /design-revisions/{id}/submit-review"
      - "POST /design-revisions/{id}/revise"
      - "POST /site-measurements"
      - "POST /line-items"
      - "POST /projects/{id}/generate-estimate"
    shared_operations:
      - "POST /customers (with PlatformAdmin)"
      - "POST /projects (with PlatformAdmin)"
      - "GET reads"
  - name: ProjectManager
    description: "Operations: approvals submission, production, ordering, scheduling, change orders, and draws/payments."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/submit-approvals"
      - "POST /projects/{id}/start-production"
      - "POST /projects/{id}/cancel"
      - "POST /permits/{id}/submit"
      - "POST /hoa-submissions/{id}/submit"
      - "POST /change-orders and its approve/reject"
      - "POST /material-orders and its place/confirm-delivery"
      - "POST /work-phases and its schedule/start/complete"
      - "POST /draws and its record-payment/refund"
    shared_operations:
      - "GET reads"
  - name: Client
    description: "Homeowner: approves/requests-revision on their own designs, signs their own contract, files warranty claims on their own completed project."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /design-revisions/{id}/approve"
      - "POST /design-revisions/{id}/request-revision"
      - "POST /projects/{id}/sign-contract"
      - "POST /warranty-claims"
    shared_operations:
      - "GET reads on own project resources"
