            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 300000000
                note_rate: 0.0700
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_post_fund}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a3_id: "$.data.id" }
            - call: "GET /advances/${a3_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w3_id: "$.data[0].id" }
            - *c_adv_v1
            - *c_valuation_1900
            - *c_mc_lookup
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
