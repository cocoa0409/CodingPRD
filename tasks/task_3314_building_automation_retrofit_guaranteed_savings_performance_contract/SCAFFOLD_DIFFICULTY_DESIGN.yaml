        payload:
          facility_name: North High
          contract_term_years: 10
          guarantee_start_date: '2026-10-01T00:00:00Z'
          mv_protocol: IPMVP_C
          guaranteed_annual_savings_cents: 250000
          contract_value_cents: 2000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          c1_id: $.data.id
      - &id005
        call: POST /performance-contracts/${c1_id}/baselines
        payload:
          baseline_period_start: '2025-09-01T00:00:00Z'
          baseline_period_end: '2026-09-01T00:00:00Z'
          annual_energy_kwh: 100000
          rate_schedule:
          - up_to_kwh: 100000
            cents_per_kwh: 12
          - up_to_kwh: null
            cents_per_kwh: 15
          heating_degree_days: 3000
          cooling_degree_days: 1200
          occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          b1_id: $.data.id
      - &id006
