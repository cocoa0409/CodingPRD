            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "POST /animal-records/${an1}/mark-travel-ready", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /reservations/${res1}/verify-compliance", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
          trigger:
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: ReservationsAgent, as_user_id: "agent-01" }
          assert:
            - "response status is 200 and the returned body already reports booking_status CONFIRMED"
            - "the same body reports subtotal_amount 33180, loyalty_tier_pct 0, loyalty_discount_amount 0, refunded_amount 0 and net_payable_amount 33180"
            - "an immediately following GET /reservations/${res1} returns the identical field values and the identical version"
            - "GET /reservations/${res1}/charge-summary computed by a different role reports invariant_holds true with no intervening write"
            - "AnimalRecord.${an1}.status == TRAVEL_READY and SegmentAssignment.${seg1}.status == RESERVED, so confirm touched only the booking dimension"

      - name: multi_entity_cascade_is_visible_without_any_settling_step
        claim_type: read_your_writes
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transitive_cascade / leg_delay_cascades_through_connection_recompute_to_partial_hold
          rationale: "The named §1.8 instance asserts leg, segment and reservation state immediately after the single delay call, with no intervening read or retry, which is exactly the immediate-consistency claim."
