scenario: |
  Subscription Moviegoing Program Capacity & Reservation Limits (AMC Stubs A-List):
  monthly subscription granting a fixed number of reservations per week with rollover
  and expiration rules, premium format eligibility included without surcharge affecting
  yield on high-demand showings, seat reservation limits and cancellation windows to
  prevent hoarding of prime seats, no-show penalties and account suspension for abuse,
  capacity management where subscribers displace full-price ticket buyers on opening
  weekends, membership tier interactions with loyalty points and concession discounts,
  subscription pause, cancellation and rejoin waiting periods, studio settlement where
  the theater reports admissions regardless of subscription revenue

domain_name: subscription-moviegoing
api_prefix: /cinemas

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique member email" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | SUSPENDED | CLOSED — lifecycle of the member account, distinct from Subscription.status", constraints: "REGISTERED | ACTIVE | SUSPENDED | CLOSED" }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "Current redeemable loyalty points; recomputed from LoyaltyLedgerEntry rows by loyalty_points_balance rule" }
      - { name: no_show_strikes_active, type: integer, source: computed, description: "Count of NoShowStrike rows in state ACTIVE for this member (rolling 90-day window); recomputed by strike_window_count rule" }
      - { name: suspended_until, type: datetime, source: system, description: "Null unless status==SUSPENDED; the instant at which a strike-suspension auto-lifts", default: null }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique plan code, e.g. ALIST_BASIC" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | PREMIER — tier drives loyalty multiplier and concession discount", constraints: "BASIC | PLUS | PREMIER" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly subscription price charged at cycle anchor" }
      - { name: weekly_reservation_quota, type: integer, source: input, description: "Base number of reservations granted per program week" }
      - { name: max_rollover_credits, type: integer, source: input, description: "Cap on credits that may carry from one program week into the next" }
      - { name: premium_format_allowed, type: boolean, source: input, description: "Whether plan grants no-surcharge access to premium-format showings (IMAX, DOLBY, 3D)" }
      - { name: max_future_reservations, type: integer, source: input, description: "Cap on the number of future-dated reservations a member may hold at once (anti-hoarding)" }
      - { name: loyalty_points_multiplier_pct, type: integer, source: input, description: "Percent multiplier applied to base points earned on concession spend; BASIC=100, PLUS=125, PREMIER=150" }
      - { name: concession_discount_pct, type: integer, source: input, description: "Percent discount on concession purchases; BASIC=0, PLUS=10, PREMIER=15" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED", constraints: "DRAFT | PUBLISHED | RETIRED" }

  - name: Subscription
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; plan at enrollment (re-resolved on plan change)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED | REJOIN_LOCKED — CANCELLED and REJOIN_LOCKED are terminal-per-cycle but a new Subscription row may be created after the lock window", constraints: "ACTIVE | PAUSED | CANCELLED | REJOIN_LOCKED" }
      - { name: cycle_anchor_date, type: string, source: system, description: "ISO date of monthly billing anchor; program weeks derive from this anchor" }
      - { name: current_cycle_index, type: integer, source: computed, description: "0-based index of the current monthly billing cycle, derived from clock vs cycle_anchor_date" }
      - { name: pause_count_in_cycle, type: integer, source: system, description: "Number of pauses consumed in current billing cycle; max 1 per cycle" }
      - { name: paused_at, type: datetime, source: system, description: "When the active pause began; null unless PAUSED", default: null }
      - { name: pause_resume_at, type: datetime, source: system, description: "Scheduled auto-resume instant for the current pause; null unless PAUSED", default: null }
      - { name: cancelled_at, type: datetime, source: system, description: "When cancellation took effect; null unless CANCELLED or REJOIN_LOCKED", default: null }
      - { name: rejoin_locked_until, type: datetime, source: system, description: "Earliest instant a new subscription may be created for this member after cancellation; null unless CANCELLED or REJOIN_LOCKED", default: null }

  - name: ReservationCreditBucket
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; owning subscription" }
      - { name: week_index, type: integer, source: input, description: "0-based program-week index within the subscription (week boundary = cycle_anchor_date + 7*k days); unique per (subscription_id, week_index)" }
      - { name: base_granted, type: integer, source: system, description: "Quota granted at week open from plan.weekly_reservation_quota" }
      - { name: rollover_in, type: integer, source: system, description: "Credits carried in from the immediately previous week, capped by plan.max_rollover_credits at rollover time" }
      - { name: credits_used, type: integer, source: computed, description: "Credits consumed by reservations in state HELD or CONFIRMED created against this bucket" }
      - { name: credits_available, type: integer, source: computed, description: "base_granted + rollover_in - credits_used; never negative" }
      - { name: posture, type: enum, source: computed, description: "OPEN | EXHAUSTED | EXPIRED — EXPIRED when clock passes week end; EXHAUSTED when credits_available == 0 and week still open", constraints: "OPEN | EXHAUSTED | EXPIRED" }

  - name: Theater
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Theater display name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone used for showtime-local computations" }
      - { name: status, type: enum, source: system, description: "OPERATING | DARK — DARK theaters reject new showtimes", constraints: "OPERATING | DARK" }

  - name: Auditorium
    parent: Theater
    common_fields: true
    fields:
      - { name: theater_id, type: string, source: input, description: "FK -> Theater.id; owning theater" }
      - { name: label, type: string, source: input, description: "Auditorium label, e.g. 'Auditorium 7'" }
      - { name: seat_count, type: integer, source: input, description: "Fixed physical seat count" }
      - { name: supported_formats, type: array, source: input, description: "Subset of {STANDARD, IMAX, DOLBY, THREE_D} this auditorium can present" }

  - name: Showtime
    parent: Auditorium
    common_fields: true
    fields:
      - { name: auditorium_id, type: string, source: input, description: "FK -> Auditorium.id; where it plays" }
      - { name: film_title, type: string, source: input, description: "Title of the film" }
      - { name: studio_code, type: string, source: input, description: "Studio identifier used for settlement grouping, e.g. WB, DIS, UNI" }
      - { name: format, type: enum, source: input, description: "STANDARD | IMAX | DOLBY | THREE_D — must be in auditorium.supported_formats", constraints: "STANDARD | IMAX | DOLBY | THREE_D" }
      - { name: runtime_minutes, type: integer, source: input, description: "Film runtime; drives the COMPLETED sweep instant (starts_at + runtime_minutes + NO_SHOW_GRACE_MINUTES)" }
      - { name: starts_at, type: datetime, source: input, description: "Show start instant (UTC)" }
      - { name: base_price_cents, type: integer, source: input, description: "Full-price general-admission ticket price for settlement valuation" }
      - { name: premium_surcharge_cents, type: integer, source: input, description: "Surcharge over base_price_cents for premium formats on paid tickets; subscriptions waive it" }
      - { name: opening_weekend, type: boolean, source: input, description: "True when the showing falls inside the film's opening weekend (Fri 00:00–Sun 23:59 of release week); activates subscriber displacement cap" }
      - { name: subscriber_displacement_cap_pct, type: integer, source: input, description: "On opening_weekend showings, max percent of seat_count that may be occupied by subscription reservations; ignored otherwise", default: 40 }
      - { name: seats_held_subscription, type: integer, source: computed, description: "Seats currently held or confirmed by subscription reservations" }
      - { name: seats_held_paid, type: integer, source: computed, description: "Seats currently held by paid (non-subscription) holds" }
      - { name: seats_available, type: integer, source: computed, description: "auditorium.seat_count - seats_held_subscription - seats_held_paid" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ON_SALE | LOCKED | COMPLETED | CANCELLED", constraints: "SCHEDULED | ON_SALE | LOCKED | COMPLETED | CANCELLED" }

  - name: Reservation
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; reserving member" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; subscription the credit draws from (must be ACTIVE)" }
      - { name: showtime_id, type: string, source: input, description: "FK -> Showtime.id; target showing" }
      - { name: bucket_id, type: string, source: system, description: "FK -> ReservationCreditBucket.id; bucket debited (the program week containing reservation creation)" }
      - { name: seat_count, type: integer, source: input, description: "Seats requested; must be exactly 1 for subscription reservations" , default: 1}
      - { name: is_premium_format, type: boolean, source: computed, description: "True when showtime.format != STANDARD; drives premium-eligibility validation" }
      - { name: credit_consumed, type: boolean, source: system, description: "True once a weekly credit has been debited and not yet refunded" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED | NO_SHOW | CHECKED_IN | EXPIRED", constraints: "HELD | CONFIRMED | CANCELLED | NO_SHOW | CHECKED_IN | EXPIRED" }
      - { name: cancel_deadline, type: datetime, source: system, description: "showtime.starts_at minus CANCELLATION_WINDOW_MINUTES; free cancellation allowed strictly before this instant" }
      - { name: settlement_reported, type: boolean, source: system, description: "True once a SettlementLine referencing this reservation has been finalized in a SUBMITTED report", default: false }

  - name: NoShowStrike
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; penalized member" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the NO_SHOW reservation that produced the strike" }
      - { name: issued_at, type: datetime, source: system, description: "Instant the strike was issued (showtime end + grace)" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + STRIKE_WINDOW_DAYS days; strikes older than this stop counting" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVERSED", constraints: "ACTIVE | EXPIRED | REVERSED" }
      - { name: reversal_reason, type: string, source: system, description: "Populated when status == REVERSED", default: null }

  - name: LoyaltyLedgerEntry
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: kind, type: enum, source: system, description: "EARN_CONCESSION | EARN_ADMISSION | REDEEM | EXPIRE | ADJUST", constraints: "EARN_CONCESSION | EARN_ADMISSION | REDEEM | EXPIRE | ADJUST" }
      - { name: points, type: integer, source: system, description: "Signed point delta; EARN_* positive, REDEEM/EXPIRE negative" }
      - { name: source_id, type: string, source: system, description: "Id of the originating entity (ConcessionPurchase or Reservation) for EARN kinds; null otherwise", default: null }
      - { name: note, type: string, source: input, description: "Free-text annotation for ADJUST entries", default: null }

  - name: ConcessionPurchase
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; purchasing member (must be ACTIVE, not SUSPENDED)" }
      - { name: theater_id, type: string, source: input, description: "FK -> Theater.id; where the purchase occurs" }
      - { name: pre_discount_cents, type: integer, source: input, description: "List price before member discount" }
      - { name: discount_cents, type: integer, source: computed, description: "Tier discount computed by concession_discount rule from the member's ACTIVE subscription plan" }
      - { name: charged_cents, type: integer, source: computed, description: "pre_discount_cents - discount_cents" }
      - { name: points_earned, type: integer, source: computed, description: "Loyalty points credited by loyalty_points_earn rule on charged_cents" }

  - name: SettlementReport
    parent: Theater
    common_fields: true
    fields:
      - { name: theater_id, type: string, source: input, description: "FK -> Theater.id; reporting theater" }
      - { name: studio_code, type: string, source: input, description: "Studio this report settles with" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of settlement window" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of settlement window; must be after period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | DISPUTED — DISPUTED returns to DRAFT on revise (cyclic)", constraints: "DRAFT | SUBMITTED | ACKNOWLEDGED | DISPUTED" }
      - { name: total_admissions, type: integer, source: computed, description: "Count of included SettlementLine rows; subscription and paid admissions both counted" }
      - { name: total_subscription_admissions, type: integer, source: computed, description: "Count of included lines with line_kind == SUBSCRIPTION" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Sum of reported_value_cents over included lines" }
      - { name: dispute_note, type: string, source: system, description: "Studio's reason when transitioning SUBMITTED -> DISPUTED", default: null }

  - name: SettlementLine
    parent: SettlementReport
    common_fields: false
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> SettlementReport.id; containing report" }
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id; admission being reported (CHECKED_IN or NO_SHOW subscription reservations; never CANCELLED/EXPIRED/HELD)" }
      - { name: showtime_id, type: string, source: system, description: "FK -> Showtime.id; denormalized for valuation" }
      - { name: line_kind, type: enum, source: system, description: "SUBSCRIPTION | PAID", constraints: "SUBSCRIPTION | PAID" }
      - { name: reported_value_cents, type: integer, source: computed, description: "Settlement valuation per settlement_valuation rule; subscription lines use contract rate, not zero" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: REGISTERED
    terminal_states: [CLOSED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /cinemas/members/{member_id}/activate"
        actor: MemberServices
        preconditions:
          - "Member has no ACTIVE subscription requirement here — activation is account-level"
        side_effects:
          - "Member.status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (no_show_strikes_active reaches SUSPENSION_THRESHOLD)"
        actor: system
        preconditions:
          - "no_show_strikes_active >= SUSPENSION_THRESHOLD (3)"
        side_effects:
          - "Member.status = SUSPENDED"
          - "Member.suspended_until = now + SUSPENSION_DAYS (30)"
          - "All member's reservations in state HELD or CONFIRMED -> CANCELLED with their credits refunded to the originating bucket only if that bucket's posture is OPEN (cascade link 1)"
          - "If the member's ACTIVE subscription exists it is force-transitioned to PAUSED with paused_at=now and pause_resume_at=suspended_until (cascade link 2)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (clock reaches suspended_until) or POST /cinemas/members/{member_id}/unsuspend"
        actor: system | MemberServices
        preconditions:
          - "system path: clock >= suspended_until; manual path: no precondition"
        side_effects:
          - "Member.status = ACTIVE; suspended_until = null"
          - "If subscription is PAUSED solely due to suspension (pause_resume_at == suspended_until), subscription auto-resumes to ACTIVE (cascade link 3)"
      - from: [REGISTERED, ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /cinemas/members/{member_id}/close"
        actor: MemberServices
        preconditions:
          - "Member has no subscription in state ACTIVE or PAUSED"
        side_effects:
          - "Member.status = CLOSED"

  - entity: SubscriptionPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /cinemas/subscription-plans/{plan_id}/publish"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Plan becomes enrollable"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /cinemas/subscription-plans/{plan_id}/retire"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "New subscriptions referencing this plan are rejected (ERR_PLAN_NOT_ENROLLABLE)"
          - "Existing subscriptions keep their current plan snapshot until next cycle rollover"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED, REJOIN_LOCKED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /cinemas/subscriptions/{subscription_id}/pause"
        actor: Member
        preconditions:
          - "Subscription.status == ACTIVE"
          - "pause_count_in_cycle < 1 (ERR_PAUSE_LIMIT_REACHED otherwise)"
          - "Member.status == ACTIVE (not SUSPENDED)"
        side_effects:
          - "status = PAUSED; paused_at = now; pause_resume_at = now + requested pause_days (7..30, ERR_INVALID_REQUEST outside range)"
          - "pause_count_in_cycle += 1"
          - "No new reservations may be created while PAUSED; existing HELD/CONFIRMED reservations remain valid"
          - "Weekly bucket granting halts: buckets whose week opens while PAUSED are created with base_granted = 0 at week rollover"
      - from: PAUSED
        to: ACTIVE
        trigger: "system (clock reaches pause_resume_at) or POST /cinemas/subscriptions/{subscription_id}/resume"
        actor: system | Member
        preconditions:
          - "Manual resume requires Member.status == ACTIVE"
        side_effects:
          - "status = ACTIVE; paused_at = null; pause_resume_at = null"
          - "Partial-week pro-rata grant: if resume falls mid-week, the current bucket's base_granted is topped up by weekly_reservation_quota * ceil(remaining_days_in_week / 7) (see weekly_bucket_grant rule)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /cinemas/subscriptions/{subscription_id}/cancel"
        actor: Member
        preconditions:
          - "Subscription.status == ACTIVE or PAUSED"
        side_effects:
          - "status = CANCELLED; cancelled_at = now"
          - "rejoin_locked_until = now + REJOIN_WAIT_DAYS (30); status immediately re-derived to REJOIN_LOCKED is NOT used — CANCELLED is terminal and the lock is consulted at next enroll"
          - "All reservations in HELD or CONFIRMED -> CANCELLED; credits refunded per cancellation_credit_refund rule (cascade into Reservation and ReservationCreditBucket)"
          - "Current and future buckets -> posture EXPIRED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /cinemas/subscriptions/{subscription_id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "Same side effects as ACTIVE -> CANCELLED"
      - from: CANCELLED
        to: REJOIN_LOCKED
        trigger: "system (cosmetic re-derivation; the lock is represented by rejoin_locked_until)"
        actor: system
        preconditions: []
        side_effects: []
        note: "REJOIN_LOCKED exists so reads can distinguish 'cancelled, lock elapsed' from 'cancelled, lock active'; enroll checks rejoin_locked_until directly"

  - entity: Reservation
    initial_state: HELD
    terminal_states: [CANCELLED, NO_SHOW, CHECKED_IN, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /cinemas/reservations/{reservation_id}/confirm"
        actor: Member
        preconditions:
          - "Reservation created no more than HOLD_TTL_MINUTES (15) ago, else it has auto-EXPIRED"
          - "Showtime.status == ON_SALE"
        side_effects:
          - "status = CONFIRMED"
      - from: HELD
        to: CANCELLED
        trigger: "POST /cinemas/reservations/{reservation_id}/cancel or system (subscription cancel/suspend cascade)"
        actor: Member | system
        preconditions:
          - "Member-initiated: now < cancel_deadline (ERR_CANCEL_WINDOW_CLOSED otherwise); system cascade: none"
        side_effects:
          - "Showtime.seats_held_subscription -= 1"
          - "If credit_consumed, credit refunded to bucket per cancellation_credit_refund rule"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /cinemas/reservations/{reservation_id}/cancel or system (subscription cancel/suspend cascade)"
        actor: Member | system
        preconditions:
          - "Member-initiated: now < cancel_deadline; system cascade: none"
        side_effects:
          - "Showtime.seats_held_subscription -= 1"
          - "Credit refund per cancellation_credit_refund rule"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /cinemas/reservations/{reservation_id}/check_in"
        actor: TheaterStaff
        preconditions:
          - "Showtime.status == ON_SALE or LOCKED"
          - "now within [starts_at - 45 minutes, starts_at + 30 minutes] (ERR_CHECKIN_WINDOW otherwise)"
        side_effects:
          - "status = CHECKED_IN; reservation becomes settleable as an admission"
          - "LoyaltyLedgerEntry EARN_ADMISSION appended per loyalty_points_earn rule"
      - from: HELD
        to: EXPIRED
        trigger: "system (HOLD_TTL_MINUTES elapsed without confirm)"
        actor: system
        preconditions: []
        side_effects:
          - "Showtime.seats_held_subscription -= 1"
          - "credit_consumed refunded in full (hold expiry always refunds)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (clock passes showtime.starts_at + NO_SHOW_GRACE_MINUTES (30) without check-in)"
        actor: system
        preconditions: []
        side_effects:
          - "Showtime.seats_held_subscription -= 1"
          - "Credit is NOT refunded"
          - "NoShowStrike appended for member (cascade link 1 of strike chain)"
          - "Member.no_show_strikes_active recomputed by strike_window_count; if it reaches SUSPENSION_THRESHOLD, Member ACTIVE -> SUSPENDED transition fires (cascade link 2)"
          - "Reservation remains settleable: studios are owed an admission report regardless of attendance"

  - entity: Showtime
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_SALE
        trigger: "POST /cinemas/showtimes/{showtime_id}/open_sales"
        actor: ProgramAdmin
        preconditions:
          - "Theater.status == OPERATING"
          - "starts_at is in the future"
        side_effects: []
      - from: ON_SALE
        to: LOCKED
        trigger: "system (clock reaches starts_at - LOCK_MINUTES_BEFORE_START (10))"
        actor: system
        preconditions: []
        side_effects:
          - "New reservation creation rejected (ERR_SHOWTIME_LOCKED, evaluated as part of the priority-5 state gate for create/confirm); check-ins still allowed"
      - from: LOCKED
        to: COMPLETED
        trigger: "system (clock passes starts_at + runtime_minutes + NO_SHOW_GRACE_MINUTES)"
        actor: system
        preconditions: []
        side_effects:
          - "Remaining CONFIRMED reservations swept to NO_SHOW (firing the full no-show cascade per reservation)"
          - "Remaining HELD reservations swept to EXPIRED"
      - from: [SCHEDULED, ON_SALE]
        to: CANCELLED
        trigger: "POST /cinemas/showtimes/{showtime_id}/cancel"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "All reservations in HELD or CONFIRMED -> CANCELLED with full credit refund regardless of cancel_deadline (force-majeure cancellation)"
          - "seats_held_subscription and seats_held_paid reset to 0"

  - entity: SettlementReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cinemas/settlement-reports/{report_id}/submit"
        actor: TheaterStaff
        preconditions:
          - "Report has >= 1 SettlementLine (ERR_EMPTY_REPORT otherwise)"
          - "Every line's reservation has settlement_reported == false at line-add time; submit flips them true"
        side_effects:
          - "All included Reservation.settlement_reported = true"
          - "Report totals frozen"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /cinemas/settlement-reports/{report_id}/acknowledge"
        actor: StudioRep
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /cinemas/settlement-reports/{report_id}/dispute"
        actor: StudioRep
        preconditions:
          - "dispute_note required"
        side_effects:
          - "Included Reservation.settlement_reported reverted to false so a corrected report may re-include them"
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /cinemas/settlement-reports/{report_id}/revise"
        actor: TheaterStaff
        preconditions: []
        side_effects:
          - "Lines may be added/removed again; totals recomputed"

# =============================================================================
# Concurrency Rules (§1.2.1 — true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-showtime
    parent_entity: Showtime
    write_endpoint: "POST /cinemas/reservations"
    occ_field: "expected_showtime_version"
    description: |
      Creating a Reservation against a Showtime whose version has advanced since
      the client last read it is rejected with ERR_STALE_VERSION. This captures
      the case where another writer has just taken or released seats on the same
      showtime (mutating seats_held_subscription / seats_available), so the
      current writer's capacity view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-plan-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /cinemas/subscriptions/{subscription_id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing a Subscription's plan against a Subscription whose version has
      advanced since the client last read it is rejected with ERR_STALE_VERSION.
      A pause/resume or cycle rollover in between may have changed bucket granting
      baselines, so the plan change must be re-based on the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: weekly_bucket_grant
    trigger: "program week rollover (system, when clock crosses week boundary), subscription resume mid-week, subscription enrollment"
    algorithm: threshold
    formula: |
      week_index(k) covers [cycle_anchor_date + 7*k, cycle_anchor_date + 7*(k+1)).
      At week open for an ACTIVE subscription:
        bucket.base_granted = plan.weekly_reservation_quota
        prev = bucket(subscription, week_index-1)
        bucket.rollover_in = min(prev.base_granted + prev.rollover_in - prev.credits_used,
                                 plan.max_rollover_credits)   # clamp at 0 below
        rollover_in = max(0, that)
      If the subscription is PAUSED at the moment the week opens: base_granted = 0,
      rollover_in still computed from prev (paused members keep rollover).
      On mid-week RESUME at day offset d (0-based) into the current 7-day week:
        top_up = plan.weekly_reservation_quota * ceil((7 - d) / 7)
        Note ceil((7-d)/7) is 1 for d in 0..6 — i.e. resume always restores the FULL
        weekly quota for the current week, credited as an increase to base_granted.
      bucket.credits_available = base_granted + rollover_in - credits_used
    constants:
      WEEK_DAYS: 7
    precision: "integer credits; no rounding"
    variants:
      - name: fresh_enrollment
        when: "bucket for week_index 0 of a new subscription"
        difference: "rollover_in = 0 unconditionally (no previous week exists); base_granted = full weekly_reservation_quota regardless of enrollment day within the week"
      - name: paused_week
        when: "subscription is PAUSED at week-open instant"
        difference: "base_granted = 0 but rollover_in still carried; credits_available may therefore be > 0 while PAUSED, yet reservations remain blocked by state validation"

  - name: cancellation_credit_refund
    trigger: "Reservation -> CANCELLED from HELD or CONFIRMED"
    algorithm: chronological
    formula: |
      Let origin = bucket referenced by reservation.bucket_id.
      Member-initiated cancel while now < reservation.cancel_deadline:
        if origin.posture == OPEN:      origin.credits_used -= 1 (credit returns)
        if origin.posture == EXHAUSTED: origin.credits_used -= 1 (returns, posture may reopen to OPEN)
        if origin.posture == EXPIRED:   credit is forfeited (credits_used unchanged)
      System cascade cancel (subscription cancel/suspend, showtime cancel):
        refund is ALWAYS applied if origin.posture != EXPIRED, regardless of
        cancel_deadline; EXPIRED buckets still forfeit.
      Hold EXPIRED (auto): always refunds if origin.posture != EXPIRED.
    precision: "integer credits"
    variants:
      - name: within_window
        when: "member cancels strictly before cancel_deadline"
        difference: "full refund into non-EXPIRED bucket"
      - name: past_window
        when: "member attempts cancel at or after cancel_deadline"
        difference: "request rejected with ERR_CANCEL_WINDOW_CLOSED; no refund computation runs — the variant divergence is that system-cascade cancels at the same instant still refund"

  - name: displacement_capacity_check
    trigger: "POST /cinemas/reservations (subscription reservation creation)"
    algorithm: threshold
    formula: |
      Let S = showtime, A = auditorium(S.auditorium_id).
      General capacity: S.seats_available >= 1 required (seats_available =
      A.seat_count - S.seats_held_subscription - S.seats_held_paid).
      Opening-weekend displacement gate (applies iff S.opening_weekend == true):
        subscriber_share_after = (S.seats_held_subscription + 1) / A.seat_count
        require subscriber_share_after * 100 <= S.subscriber_displacement_cap_pct
        i.e. floor semantics: allowed iff (seats_held_subscription + 1) * 100 <=
             subscriber_displacement_cap_pct * A.seat_count
      Non-opening-weekend showings: no displacement cap — subscribers may fill to
      the last seat.
    constants:
      DEFAULT_DISPLACEMENT_CAP_PCT: 40
    precision: "integer seat arithmetic; the comparison uses integer multiplication, never floating point"

  - name: no_show_suspension_ladder
    trigger: "NoShowStrike insert, NoShowStrike -> REVERSED, NoShowStrike expiry sweep"
    algorithm: threshold
    formula: |
      active_strikes = count(NoShowStrike where member_id = M and status == ACTIVE
                             and expires_at > now)
      Ladder (evaluated in order; first match wins):
        active_strikes >= 3  -> Member ACTIVE -> SUSPENDED, suspended_until = now + 30d
        active_strikes == 2  -> member flagged: no state change, but
                                max_future_reservations effectively halved (floor) —
                                enforced inside reservation_create validation
        active_strikes <= 1  -> no effect
      Reversal/expiry that drops the count below 3 does NOT auto-lift a suspension
      early; suspension lifts only at suspended_until or manual unsuspend.
    constants:
      SUSPENSION_THRESHOLD: 3
      SUSPENSION_DAYS: 30
      STRIKE_WINDOW_DAYS: 90
      FLAG_LEVEL: 2
    precision: "integer strike counts"

  - name: strike_window_count
    trigger: "any read of Member.no_show_strikes_active; strike insert/reverse/expire"
    algorithm: aggregation
    formula: |
      Member.no_show_strikes_active = count of NoShowStrike rows with
      member_id = M, status == ACTIVE, expires_at > now.
      Expiry sweep: rows with status == ACTIVE and expires_at <= now are
      transitioned to EXPIRED lazily on read and eagerly by the clock-advance hook.
    precision: "integer"

  - name: loyalty_points_earn
    trigger: "ConcessionPurchase creation; Reservation -> CHECKED_IN"
    algorithm: weighted_scoring
    formula: |
      Base earn rates:
        concession: floor(charged_cents / 100) * POINTS_PER_DOLLAR  (per purchase)
        admission check-in: ADMISSION_POINTS flat
      Tier multiplier (from member's ACTIVE subscription plan; if subscription is
      PAUSED/CANCELLED at earn time the multiplier falls back to 100):
        points = floor(base * plan.loyalty_points_multiplier_pct / 100)
      Evaluation order is pinned: (1) compute charged_cents via concession_discount;
      (2) derive base from charged_cents; (3) apply tier multiplier; (4) floor once.
    constants:
      POINTS_PER_DOLLAR: 20
      ADMISSION_POINTS: 50
    precision: "integer points, floor at the final step only"

  - name: concession_discount
    trigger: "ConcessionPurchase creation"
    algorithm: tiered_pricing
    formula: |
      plan = member's ACTIVE subscription's plan; if none, discount_pct = 0.
      discount_cents = floor(pre_discount_cents * plan.concession_discount_pct / 100)
      charged_cents  = pre_discount_cents - discount_cents
      Rounding order pinned: compute discount with floor FIRST, then subtract —
      never floor(charged). For pre_discount_cents = 999 and pct = 15:
      discount = floor(149.85) = 149, charged = 850.
    precision: "integer cents, round-down (floor) on discount before subtraction"

  - name: settlement_valuation
    trigger: "SettlementLine inclusion at report submit"
    algorithm: aggregation
    formula: |
      For each included reservation r with showtime s:
        line_kind == PAID:         reported_value_cents = s.base_price_cents
                                   + (s.premium_surcharge_cents if s.format != STANDARD)
        line_kind == SUBSCRIPTION: reported_value_cents = STUDIO_CONTRACT_RATE_CENTS
                                   regardless of format, surcharge, or attendance
                                   (CHECKED_IN and NO_SHOW both count as admissions)
      Report totals:
        total_admissions = count(lines)
        total_subscription_admissions = count(lines where line_kind == SUBSCRIPTION)
        total_gross_cents = sum(reported_value_cents)
    constants:
      STUDIO_CONTRACT_RATE_CENTS: 899
    precision: "integer cents"
    variants:
      - name: provisional_draft
        when: "report in DRAFT or DISPUTED -> DRAFT"
        difference: "totals recomputed live from current lines; lines may include reservations whose settlement_reported is still false"
      - name: finalized_submitted
        when: "report transitions DRAFT -> SUBMITTED"
        difference: "totals frozen as stored fields; the line set is locked (add/remove rejected with ERR_INVALID_STATE) so the same lines re-priced later by a price change do NOT alter the submitted totals — provisional and finalized totals can diverge when showtime.base_price_cents changes between draft read and submit"

  - name: future_reservation_count
    trigger: "POST /cinemas/reservations; read of member reservation summary"
    algorithm: aggregation
    formula: |
      future_held = count(Reservation where member_id = M,
                          status IN {HELD, CONFIRMED},
                          showtime.starts_at > now)
      Cap = plan.max_future_reservations; if Member.no_show_strikes_active == FLAG_LEVEL (2),
      effective cap = floor(plan.max_future_reservations / 2).
      Reservation creation requires future_held < effective cap.
    constants:
      FLAG_LEVEL: 2
    precision: "integer"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path id and body FK references an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Entity-backed identity: Member role may only act on resources whose member_id == X-User-ID; TheaterStaff may only act on reports/showtimes of their theater scope"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "member-scoped and theater-scoped mutations"
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition (reservation create/confirm on a LOCKED showtime fails here with ERR_SHOWTIME_LOCKED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (confirm/cancel/check_in/pause/resume/submit/etc.)"
  - priority: 6
    category: state
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cinemas/reservations; POST /cinemas/subscriptions/{id}/change-plan"
  - priority: 7
    category: business_safety
    check: "Member-level gates: Member.status == ACTIVE for reservation creation and concession purchase (SUSPENDED members are blocked even if their subscription row still reads ACTIVE)"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /cinemas/reservations; POST /cinemas/concession-purchases"
  - priority: 8
    category: business_temporal
    check: "Rejoin lock: creating a subscription when the member's CANCELLED subscription with the greatest rejoin_locked_until still has rejoin_locked_until > now is rejected"
    error_id: ERR_REJOIN_LOCKED
    http_status: 409
    applies_to: "POST /cinemas/members/{member_id}/subscriptions"
  - priority: 9
    category: business_temporal
    check: "Cancellation window: member-initiated reservation cancel requires now < cancel_deadline"
    error_id: ERR_CANCEL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /cinemas/reservations/{id}/cancel"
  - priority: 10
    category: business_temporal
    check: "Check-in window: now within [starts_at-45m, starts_at+30m]"
    error_id: ERR_CHECKIN_WINDOW
    http_status: 409
    applies_to: "POST /cinemas/reservations/{id}/check_in"
  - priority: 11
    category: business_constraint
    check: "Premium-format eligibility: showtime.format != STANDARD requires plan.premium_format_allowed == true"
    error_id: ERR_PREMIUM_NOT_INCLUDED
    http_status: 422
    applies_to: "POST /cinemas/reservations"
  - priority: 12
    category: business_constraint
    check: "Weekly quota: current bucket posture == OPEN and credits_available >= 1"
    error_id: ERR_WEEKLY_QUOTA_EXHAUSTED
    http_status: 422
    applies_to: "POST /cinemas/reservations"
  - priority: 13
    category: business_constraint
    check: "Anti-hoarding: future_reservation_count < effective max_future_reservations (halved at 2 active strikes)"
    error_id: ERR_FUTURE_RESERVATION_LIMIT
    http_status: 422
    applies_to: "POST /cinemas/reservations"
  - priority: 14
    category: business_constraint
    check: "Capacity: showtime seats_available >= 1; opening-weekend displacement cap satisfied per displacement_capacity_check"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cinemas/reservations"
  - priority: 15
    category: business_fiscal
    check: "Pause policy: pause_count_in_cycle < 1 and pause_days within 7..30"
    error_id: ERR_PAUSE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /cinemas/subscriptions/{id}/pause"
  - priority: 16
    category: business_constraint
    check: "Settlement: report lines reference distinct, settleable reservations (status CHECKED_IN or NO_SHOW, settlement_reported == false; a reservation already present in the same report yields ERR_DUPLICATE_LINE); period_end > period_start; report non-empty at submit"
    error_id: ERR_LINE_NOT_SETTLEABLE
    http_status: 422
    applies_to: "POST /cinemas/settlement-reports/{id}/lines; POST /cinemas/settlement-reports/{id}/submit (ERR_EMPTY_REPORT)"
  - priority: 17
    category: business_constraint
    check: "Plan enrollability: plan.status == PUBLISHED at enrollment (evaluated AFTER the rejoin lock at priority 8)"
    error_id: ERR_PLAN_NOT_ENROLLABLE
    http_status: 422
    applies_to: "POST /cinemas/members/{member_id}/subscriptions"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving infrastructure ---
  - method: POST
    path: "/cinemas/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is 2026-09-01T00:00:00Z; before any set call the clock reads exactly this default and never the wall clock. Drives week rollovers, bucket expiry, hold expiry, no-show sweeps, strike expiry, suspension lifts, pause auto-resume, and showtime locking."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Runs all time-based system transitions whose deadline now <= clock"
      - "Creates next week's ReservationCreditBucket lazily when a week boundary is crossed"
      - "Billing-cycle rollover: when the clock crosses a monthly cycle boundary (cycle_anchor_date + 30*n days), Subscription.current_cycle_index increments and pause_count_in_cycle resets to 0"

  # --- Members ---
  - method: POST
    path: "/cinemas/members"
    description: "Register a member"
    roles: [MemberServices]
    code: 201
    input: [email, full_name]
    output: Member
    side_effects: ["Member.status = REGISTERED, loyalty_points_balance = 0"]
  - method: GET
    path: "/cinemas/members/{member_id}"
    description: "Read member (recomputes strike window lazily)"
    roles: [MemberServices, Member, ProgramAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Lazy expiry of out-of-window NoShowStrike rows"]
  - method: GET
    path: "/cinemas/members"
    description: "List members (paginated)"
    roles: [MemberServices, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: "/cinemas/members/{member_id}/activate"
    description: "Activate member account"
    roles: [MemberServices]
    code: 200
    input: []
    output: Member
    side_effects: ["Member REGISTERED -> ACTIVE"]
  - method: POST
    path: "/cinemas/members/{member_id}/unsuspend"
    description: "Manually lift a suspension early"
    roles: [MemberServices]
    code: 200
    input: []
    output: Member
    side_effects: ["Member SUSPENDED -> ACTIVE; suspension-driven PAUSED subscription resumes"]
  - method: POST
    path: "/cinemas/members/{member_id}/close"
    description: "Close member account"
    roles: [MemberServices]
    code: 200
    input: []
    output: Member
    side_effects: ["Member -> CLOSED; requires no ACTIVE/PAUSED subscription"]
  - method: GET
    path: "/cinemas/members/{member_id}/strikes"
    description: "List no-show strikes for a member"
    roles: [MemberServices, Member, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: NoShowStrike[]
    side_effects: []
  - method: GET
    path: "/cinemas/members/{member_id}/loyalty-ledger"
    description: "List loyalty ledger entries for a member"
    roles: [MemberServices, Member, ProgramAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: LoyaltyLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/cinemas/members/{member_id}/loyalty-adjustments"
    description: "Append an ADJUST loyalty entry (manual correction)"
    roles: [MemberServices]
    code: 201
    input: [points, note]
    output: LoyaltyLedgerEntry
    side_effects: ["Member.loyalty_points_balance recomputed"]

  # --- Subscription plans ---
  - method: POST
    path: "/cinemas/subscription-plans"
    description: "Create a subscription plan (DRAFT)"
    roles: [ProgramAdmin]
    code: 201
    input: [code, tier, monthly_fee_cents, weekly_reservation_quota, max_rollover_credits, premium_format_allowed, max_future_reservations, loyalty_points_multiplier_pct, concession_discount_pct]
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/cinemas/subscription-plans/{plan_id}"
    description: "Read plan"
    roles: [ProgramAdmin, MemberServices, Member]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []
  - method: POST
    path: "/cinemas/subscription-plans/{plan_id}/publish"
    description: "Publish plan (enrollable)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: ["Plan DRAFT -> PUBLISHED"]
  - method: POST
    path: "/cinemas/subscription-plans/{plan_id}/retire"
    description: "Retire plan"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: ["Plan PUBLISHED -> RETIRED"]

  # --- Subscriptions ---
  - method: POST
    path: "/cinemas/members/{member_id}/subscriptions"
    description: "Enroll member in a plan"
    roles: [Member, MemberServices]
    code: 201
    input: [plan_id]
    output: Subscription
    side_effects:
      - "Subscription ACTIVE; cycle_anchor_date = today; current week bucket created via weekly_bucket_grant (fresh_enrollment variant)"
      - "Rejected with ERR_REJOIN_LOCKED if a prior CANCELLED subscription's rejoin_locked_until > now"
      - "Rejected with ERR_PLAN_NOT_ENROLLABLE if plan not PUBLISHED"
  - method: GET
    path: "/cinemas/subscriptions/{subscription_id}"
    description: "Read subscription"
    roles: [Member, MemberServices, ProgramAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/cinemas/members/{member_id}/subscriptions"
    description: "List a member's subscriptions"
    roles: [Member, MemberServices, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/cinemas/subscriptions/{subscription_id}/pause"
    description: "Pause subscription (7-30 days, once per billing cycle)"
    roles: [Member]
    code: 200
    input: [pause_days]
    output: Subscription
    side_effects: ["Subscription ACTIVE -> PAUSED; pause_count_in_cycle += 1"]
  - method: POST
    path: "/cinemas/subscriptions/{subscription_id}/resume"
    description: "Resume a paused subscription early"
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription PAUSED -> ACTIVE; mid-week top-up per weekly_bucket_grant"]
  - method: POST
    path: "/cinemas/subscriptions/{subscription_id}/cancel"
    description: "Cancel subscription"
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "Subscription -> CANCELLED; rejoin_locked_until = now + 30d"
      - "Cascades: HELD/CONFIRMED reservations cancelled with refund; buckets EXPIRED"
  - method: POST
    path: "/cinemas/subscriptions/{subscription_id}/change-plan"
    description: "Change plan at next cycle boundary (OCC-guarded)"
    roles: [Member, MemberServices]
    code: 200
    input: [new_plan_id, expected_subscription_version]
    output: Subscription
    side_effects:
      - "plan_id updated; increments Subscription.version by 1"
      - "Next week bucket granting uses the new plan's quota and caps"

  # --- Credit buckets ---
  - method: GET
    path: "/cinemas/subscriptions/{subscription_id}/credit-buckets"
    description: "List weekly credit buckets for a subscription"
    roles: [Member, MemberServices, ProgramAdmin]
    code: 200
    input: ["week_index?", "limit?", "offset?"]
