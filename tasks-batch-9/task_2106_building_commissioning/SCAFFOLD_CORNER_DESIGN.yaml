      - name: success_and_error_envelopes_carry_meta_and_response_type
        claim_type: standard_crud
        grounds:
          - response_envelope.success
          - response_envelope.error
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp; a successful single-object read sets response_type object with the entity under data, while a 404 sets response_type error with error_id and message under data."
