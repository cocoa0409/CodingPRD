scenario: "Network Rule Administration, Sponsorship & Program Approval (Visa): issuer and acquirer principal membership with sponsorship of non-member program participants, bank identification number assignment, program registration and product code configuration, network rule publication with regional variations and compliance enforcement through fines, dispute rules governing chargeback reason codes, evidence requirements and arbitration, interchange rate qualification criteria by merchant category, transaction type and data quality, fraud monitoring programs with thresholds triggering remediation plans for merchants and acquirers, new product and wallet certification testing before production enablement, settlement and clearing windows with funds transfer between members"
domain_name: "network-rule-administration-sponsorship-program-approval"
api_prefix: "/network"
complexity_profile:
  primary_archetype: "compliance / audit"
  secondary_archetype: "workflow orchestration"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal entity name of the financial institution"
      - name: member_kind
        type: enum
        source: input
        description: "One of ISSUER, ACQUIRER, or BOTH"
        constraints: "enum {ISSUER, ACQUIRER, BOTH}; immutable after creation"
      - name: region
        type: enum
        source: input
        description: "Home regulatory region of the member"
        constraints: "enum {NA, EU, APAC, LATAM, CEMEA}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the membership"
        default: APPLICATION
        constraints: "enum {APPLICATION, ACTIVE, SUSPENDED, TERMINATED}"
      - name: suspension_reason
        type: string
        source: system
        description: "Populated when status transitions to SUSPENDED; null otherwise"
      - name: settled_balance_cents
        type: integer
        source: computed
        description: "Running cleared funds position of this member; debited/credited on every committed SettlementLine; 0 at creation"
        default: 0

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trading name of the non-member program participant"
      - name: sponsor_member_id
        type: string
        source: input
        description: "FK -> Member.id; sponsoring principal member (must be ACTIVE ACQUIRER or BOTH)"
      - name: program_name
        type: string
        source: input
        description: "Registered program name the participant operates under"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the participant"
        default: PENDING_REVIEW
        constraints: "enum {PENDING_REVIEW, ACTIVE, SUSPENDED, TERMINATED}"
      - name: fraud_attributed_count
        type: integer
        source: computed
        description: "Count of FraudCase rows in status CONFIRMED attributed to this participant; incremented when a fraud case on one of its merchants is confirmed"
        default: 0

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; operating participant (null while directly boarded under a member acquirer)"
        constraints: "nullable; exactly one of participant_id, acquirer_member_id must be non-null"
      - name: acquirer_member_id
        type: string
        source: input
        description: "FK -> Member.id; acquiring member (used when the merchant boards directly under a member rather than a participant)"
        constraints: "nullable; exactly one of participant_id, acquirer_member_id must be non-null"
      - name: mcc
        type: string
        source: input
        description: "Merchant category code, exactly 4 digits"
      - name: region
        type: enum
        source: input
        description: "Operating region"
        constraints: "enum {NA, EU, APAC, LATAM, CEMEA}"
      - name: declared_monthly_volume_cents
        type: integer
        source: input
        description: "Merchant's declared transaction volume per evaluation period in cents; used as the denominator of fraud-rate calculations; strictly positive"
      - name: status
        type: enum
        source: system
        description: "Merchant boarding status"
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED, TERMINATED}"
      - name: fraud_monitoring_status
        type: enum
        source: system
        description: "Fraud program posture derived from the merchant's most recent evaluation"
        default: NOT_MONITORED
        constraints: "enum {NOT_MONITORED, UNDER_MONITORING, REMEDIATION_REQUIRED, EXEMPTED}"

  - name: BinRange
    parent: null
    common_fields: true
    fields:
      - name: bin_prefix
        type: string
        source: input
        description: "Bank identification number prefix; exactly 6 digits"
      - name: issuer_member_id
        type: string
        source: input
        description: "FK -> Member.id; owning issuer (must be ACTIVE ISSUER or BOTH)"
      - name: status
        type: enum
        source: system
        description: "Assignment status"
        default: REQUESTED
        constraints: "enum {REQUESTED, ACTIVE, SUSPENDED, DEACTIVATED}"
      - name: assigned_program_id
        type: string
        source: system
        description: "FK -> Program.id; program this BIN range is bound to once approved (null until approval)"
        constraints: "nullable"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program name"
      - name: program_type
        type: enum
        source: input
        description: "One of CARD_PRODUCT, WALLET, COMMERCIAL"
        constraints: "enum {CARD_PRODUCT, WALLET, COMMERCIAL}"
      - name: product_code
        type: string
        source: input
        description: "Product code configuration; 2-4 uppercase alphanumeric characters"
      - name: owner_member_id
        type: string
        source: input
        description: "FK -> Member.id; member registering the program (must be ACTIVE)"
      - name: status
        type: enum
        source: system
        description: "Program lifecycle status"
        default: REGISTERED
        constraints: "enum {REGISTERED, UNDER_CERTIFICATION, APPROVED, PRODUCTION_ENABLED, RETIRED}"
      - name: approved_version
        type: integer
        source: system
        description: "Program.version value BEFORE the approval transition's own increment (i.e. equal to the expected_program_version supplied at approval); production enablement requires Program.version == approved_version + 1, so any post-approval edit (which increments version) breaks the pin"
        constraints: "nullable"

  - name: CertificationTest
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; program under certification"
      - name: scope
        type: enum
        source: input
        description: "Certification scope"
        constraints: "enum {NEW_PRODUCT, WALLET, COMBINED}"
      - name: status
        type: enum
        source: system
        description: "Test run status"
        default: SUBMITTED
        constraints: "enum {SUBMITTED, PASSED, FAILED}"
      - name: failure_reason
        type: string
        source: system
        description: "Populated when status FAILED; null otherwise"
        constraints: "nullable"
      - name: evaluated_program_version
        type: integer
        source: system
        description: "Program.version captured when this test run was submitted; a PASS is only valid while Program.version == evaluated_program_version"

  - name: NetworkRule
    parent: null
    common_fields: true
    fields:
      - name: rule_code
        type: string
        source: input
        description: "Globally unique rule identifier, e.g. R-CHGBK-001"
      - name: title
        type: string
        source: input
        description: "Human-readable rule title"
      - name: body
        type: string
        source: input
        description: "Rule text"
      - name: region_scope
        type: enum
        source: input
        description: "Regions the rule applies to; GLOBAL or one region code"
        constraints: "enum {GLOBAL, NA, EU, APAC, LATAM, CEMEA}"
      - name: regional_override_of_rule_id
        type: string
        source: input
        description: "FK -> NetworkRule.id; when set, this rule is a regional variation overriding the referenced GLOBAL rule within its region_scope"
        constraints: "nullable; when set, region_scope MUST NOT be GLOBAL"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO8601 timestamp at which the rule becomes effective; publication of a new effective rule auto-supersedes the prior rule with the same rule_code and overlapping scope"
      - name: status
        type: enum
        source: system
        description: "Publication status"
        default: DRAFT
        constraints: "enum {DRAFT, PUBLISHED, SUPERSEDED, RETIRED}"
      - name: fine_schedule
        type: array
        source: input
        description: "Ordered tier schedule of fines: array of objects {min_amount_minor, max_amount_minor, fine_cents}; tier 1 always starts at min_amount_minor 1"

  - name: RuleViolation
    parent: null
    common_fields: true
    fields:
      - name: rule_id
        type: string
        source: input
        description: "FK -> NetworkRule.id; the rule violated (must be PUBLISHED and effective)"
      - name: subject_member_id
        type: string
        source: input
        description: "FK -> Member.id; member cited for the violation"
      - name: severity
        type: enum
        source: input
        description: "Violation severity driving fine tier selection"
        constraints: "enum {MINOR, MAJOR, CRITICAL}"
      - name: transaction_amount_minor
        type: integer
        source: input
        description: "Aggregate transaction amount in minor currency units associated with the violation; selects the fine tier"
      - name: status
        type: enum
        source: system
        description: "Enforcement workflow status"
        default: CITED
        constraints: "enum {CITED, ASSESSED, APPEALED, CONFIRMED, WAIVED}"
      - name: fine_cents
        type: integer
        source: system
        description: "Computed fine from the rule's fine_schedule at assessment; null until ASSESSED"
        constraints: "nullable"
      - name: assessed_by_id
        type: string
        source: system
        description: "X-User-ID of the RulesAdministrator who assessed the violation; used for segregation-of-duties checks on confirm/waive"
        constraints: "nullable"
      - name: cited_by_id
        type: string
        source: system
        description: "X-User-ID of the RulesAdministrator who cited the violation; used for segregation-of-duties checks on assess"
        constraints: "nullable"

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - name: reason_code
        type: string
        source: input
        description: "Chargeback reason code, e.g. 10.4 (fraud), 13.1 (merchandise not received)"
      - name: issuer_member_id
        type: string
        source: input
        description: "FK -> Member.id; issuer raising the dispute on behalf of a cardholder"
      - name: acquirer_member_id
        type: string
        source: input
        description: "FK -> Member.id; acquirer defending the dispute"
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant whose transaction is disputed"
      - name: transaction_amount_cents
        type: integer
        source: input
        description: "Disputed amount in cents"
      - name: currency
        type: string
        source: input
        description: "ISO 4217 currency code, 3 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Dispute workflow status"
        default: OPENED
        constraints: "enum {OPENED, EVIDENCE_SUBMITTED, DECIDED, ARBITRATION_REQUESTED, ARBITRATION_DECIDED, CLOSED}"
      - name: winning_side
        type: enum
        source: system
        description: "ISSUER or ACQUIRER once decided; null earlier"
        constraints: "enum {ISSUER, ACQUIRER}; nullable"
      - name: filing_clock
        type: datetime
        source: system
        description: "Logical-clock timestamp at which the current phase deadline was set"

  - name: DisputeEvidence
    parent: null
    common_fields: false
    fields:
      - name: dispute_case_id
        type: string
        source: input
        description: "FK -> DisputeCase.id; case this evidence supports"
      - name: submitted_by_member_id
        type: string
        source: input
        description: "FK -> Member.id; submitting member (must be issuer or acquirer on the case)"
      - name: evidence_type
        type: enum
        source: input
        description: "Document class of the evidence"
        constraints: "enum {TRANSACTION_RECORD, PROOF_OF_DELIVERY, REFUND_POLICY, CARDHOLDER_LETTER, OTHER}"
      - name: document_ref
        type: string
        source: input
        description: "Opaque document reference"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of submission"

  - name: InterchangeRate
    parent: null
    common_fields: true
    fields:
      - name: merchant_category
        type: string
        source: input
        description: "MCC this rate applies to; exactly 4 digits"
      - name: transaction_type
        type: enum
        source: input
        description: "Transaction channel class"
        constraints: "enum {CARD_PRESENT, CARD_NOT_PRESENT, ECOM_TOKENIZED, RECURRING}"
      - name: data_quality_tier
        type: enum
        source: input
        description: "Data quality tier the transaction must meet for this rate"
        constraints: "enum {STANDARD, ENHANCED, PREMIUM}"
      - name: rate_basis_points
        type: integer
        source: input
        description: "Interchange rate in basis points of the transaction amount"
      - name: fixed_fee_cents
        type: integer
        source: input
        description: "Fixed per-transaction fee in cents"
      - name: region_scope
        type: enum
        source: input
        description: "GLOBAL or one region code; a region-scoped rate overrides GLOBAL within that region"
        constraints: "enum {GLOBAL, NA, EU, APAC, LATAM, CEMEA}"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO8601 timestamp at which the rate becomes effective"
      - name: status
        type: enum
        source: system
        description: "Publication status"
        default: DRAFT
        constraints: "enum {DRAFT, PUBLISHED, RETIRED}"

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; merchant the confirmed fraud is attributed to"
      - name: reported_by_member_id
        type: string
        source: input
        description: "FK -> Member.id; issuer reporting the fraud"
      - name: fraud_amount_cents
        type: integer
        source: input
        description: "Amount of the fraudulent transaction in cents"
      - name: status
        type: enum
        source: system
        description: "Case review status"
        default: REPORTED
        constraints: "enum {REPORTED, CONFIRMED, DISMISSED}"
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of confirmation; null until CONFIRMED"
        constraints: "nullable"

  - name: RemediationPlan
    parent: null
    common_fields: true
    fields:
      - name: subject_type
        type: enum
        source: input
        description: "What the plan remediates"
        constraints: "enum {MERCHANT, ACQUIRER}"
      - name: subject_id
        type: string
        source: input
        description: "Polymorphic FK: Merchant.id when subject_type=MERCHANT; Member.id when subject_type=ACQUIRER"
      - name: fraud_program_cycle_id
        type: string
        source: input
        description: "FK -> FraudProgramCycle.id; evaluation cycle whose threshold breach triggered this plan"
      - name: actions
        type: array
        source: input
        description: "Ordered list of remediation action descriptions; at least one entry required"
      - name: status
        type: enum
        source: system
        description: "Plan status"
        default: OPEN
        constraints: "enum {OPEN, SUBMITTED, APPROVED, COMPLETED, OVERDUE, ESCALATED}"
      - name: due_at
        type: datetime
        source: system
        description: "Logical-clock deadline: cycle evaluated_at + REMEDIATION_WINDOW_DAYS"
      - name: approved_by_id
        type: string
        source: system
        description: "X-User-ID of the FraudAnalyst approving; null until APPROVED; approver must differ from submitter"
        constraints: "nullable"

  - name: FraudProgramCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: "Human label, e.g. 2026-09"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the evaluation window"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the evaluation window; must be strictly after period_start"
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when evaluation ran; null until COMPLETED"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Cycle status"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, COMPLETED}"
      - name: merchants_flagged
        type: integer
        source: computed
        description: "Count of merchants whose fraud_rate_bps at evaluation met or exceeded MERCHANT_FRAUD_THRESHOLD_BPS"
        default: 0
      - name: acquirers_flagged
        type: integer
        source: computed
        description: "Count of acquirer members whose aggregate fraud_rate_bps met or exceeded ACQUIRER_FRAUD_THRESHOLD_BPS"
        default: 0

  - name: SettlementWindow
    parent: null
    common_fields: true
    fields:
      - name: window_date
        type: string
        source: input
        description: "Business date of the window, YYYY-MM-DD; globally unique across all windows"
      - name: opens_at
        type: datetime
        source: input
        description: "ISO8601 timestamp when the window opens; globally unique (no two windows may share opens_at)"
      - name: closes_at
        type: datetime
        source: input
        description: "ISO8601 timestamp when the window closes; must be strictly after opens_at"
      - name: status
        type: enum
        source: system
        description: "Window lifecycle"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, OPEN, RECONCILED, CLOSED}"
      - name: total_settled_cents
        type: integer
        source: computed
        description: "Absolute sum of all SettlementLine.amount_cents in this window; maintained on line commit and on reversal"
        default: 0

  - name: SettlementLine
    parent: null
    common_fields: true
    fields:
      - name: window_id
        type: string
        source: input
        description: "FK -> SettlementWindow.id; window this line settles in (must be OPEN at commit time)"
      - name: from_member_id
        type: string
        source: input
        description: "FK -> Member.id; paying member (must be ACTIVE and distinct from to_member_id)"
      - name: to_member_id
        type: string
        source: input
        description: "FK -> Member.id; receiving member (must be ACTIVE and distinct from from_member_id)"
      - name: amount_cents
        type: integer
        source: input
        description: "Transfer amount in cents; strictly positive"
      - name: currency
        type: string
        source: input
        description: "ISO 4217 currency code, 3 uppercase letters"
      - name: reference
        type: string
        source: input
        description: "Business reference of the obligation being settled"
      - name: status
        type: enum
        source: system
        description: "Line lifecycle"
        default: DRAFT
        constraints: "enum {DRAFT, COMMITTED, REVERSED}"
      - name: committed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of commit; must satisfy opens_at <= committed_at < closes_at of the window"
        constraints: "nullable"

state_machines:
  - entity: Member
    initial_state: APPLICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICATION
        to: ACTIVE
        trigger: "POST /network/members/{id}/approve"
        actor: NetworkOperator
        preconditions: ["Member.status == APPLICATION"]
        side_effects: ["Member.version increments", "Member.updated_at refreshes"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/members/{id}/suspend"
        actor: NetworkOperator
        preconditions: ["Member.status == ACTIVE"]
        side_effects:
          - "Member.suspension_reason set from request"
          - "Cascade: every Participant with sponsor_member_id == this Member and status == ACTIVE transitions to SUSPENDED"
          - "Cascade (depth 3): every Merchant with participant_id referencing a Participant suspended by the previous hop transitions to SUSPENDED"
          - "Cascade: every BinRange with issuer_member_id == this Member and status == ACTIVE transitions to SUSPENDED"
          - "Member.version increments"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/members/{id}/reinstate"
        actor: NetworkOperator
        preconditions: ["Member.status == SUSPENDED"]
        side_effects:
          - "Member.suspension_reason cleared to null"
          - "Cascade: Participants suspended by this member's suspension (sponsor_member_id == this Member, status == SUSPENDED) return to ACTIVE"
          - "Cascade (depth 3): Merchants under those reactivated participants return to ACTIVE"
          - "Member.version increments"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network/members/{id}/terminate"
        actor: NetworkOperator
        preconditions: ["Member.status == SUSPENDED"]
        side_effects: ["Cascade: sponsored Participants in status SUSPENDED transition to TERMINATED", "Member.version increments"]

  - entity: Participant
    initial_state: PENDING_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /network/participants/{id}/approve"
        actor: SponsorshipManager
        preconditions: ["Participant.status == PENDING_REVIEW", "Sponsor Member.status == ACTIVE"]
        side_effects: ["Participant.version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/participants/{id}/suspend or cascade from Member ACTIVE->SUSPENDED"
        actor: SponsorshipManager
        preconditions: ["Participant.status == ACTIVE"]
        side_effects: ["Participant.version increments"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/participants/{id}/reinstate or cascade from Member SUSPENDED->ACTIVE"
        actor: SponsorshipManager
        preconditions: ["Participant.status == SUSPENDED", "Sponsor Member.status == ACTIVE"]
        side_effects: ["Participant.version increments"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network/participants/{id}/terminate or cascade from Member SUSPENDED->TERMINATED"
        actor: SponsorshipManager
        preconditions: ["Participant.status == SUSPENDED"]
        side_effects: ["Cascade: Merchants with participant_id == this Participant transition to TERMINATED", "Participant.version increments"]

  - entity: BinRange
    initial_state: REQUESTED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /network/bin-ranges/{id}/approve"
        actor: NetworkOperator
        preconditions: ["BinRange.status == REQUESTED", "Issuer Member.status == ACTIVE", "Program referenced by program_id in request has status == PRODUCTION_ENABLED"]
        side_effects: ["BinRange.assigned_program_id set to the approved program", "BinRange.version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Cascade from issuer Member ACTIVE->SUSPENDED"
        actor: system
        preconditions: ["BinRange.status == ACTIVE"]
        side_effects: ["BinRange.version increments"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "Cascade from issuer Member SUSPENDED->ACTIVE"
        actor: system
        preconditions: ["BinRange.status == SUSPENDED"]
        side_effects: ["BinRange.version increments"]
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /network/bin-ranges/{id}/deactivate"
        actor: NetworkOperator
        preconditions: ["BinRange.status == ACTIVE"]
        side_effects: ["BinRange.version increments"]

  - entity: Program
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: UNDER_CERTIFICATION
        trigger: "POST /network/programs/{id}/certification-tests (creating the test run moves the program under certification)"
        actor: CertificationEngineer
        preconditions: ["Program.status IN {REGISTERED, UNDER_CERTIFICATION}"]
        side_effects: ["CertificationTest created in SUBMITTED", "Program.status set to UNDER_CERTIFICATION if it was REGISTERED", "Program.version increments"]
      - from: UNDER_CERTIFICATION
        to: APPROVED
        trigger: "POST /network/programs/{id}/approve"
        actor: CertificationEngineer
        preconditions: ["Program.status == UNDER_CERTIFICATION", "At least one CertificationTest with program_id == this Program has status == PASSED AND evaluated_program_version == Program.version"]
        side_effects: ["Program.approved_version set to the pre-increment Program.version (equal to expected_program_version)", "Program.version increments"]
      - from: APPROVED
        to: PRODUCTION_ENABLED
        trigger: "POST /network/programs/{id}/enable-production"
        actor: CertificationEngineer
        preconditions: ["Program.status == APPROVED", "Program.version == Program.approved_version + 1 (approval itself incremented version once; any later edit increments it again and blocks enablement)"]
        side_effects: ["Program.version increments"]
      - from: UNDER_CERTIFICATION
        to: REGISTERED
        trigger: "POST /network/certification-tests/{id}/fail on the latest SUBMITTED test run"
        actor: CertificationEngineer
        preconditions: ["CertificationTest.status == SUBMITTED"]
        side_effects: ["CertificationTest.status set to FAILED with failure_reason", "If no other CertificationTest for this Program remains in SUBMITTED, Program.status reverts to REGISTERED", "Program.version increments"]
      - from: PRODUCTION_ENABLED
        to: RETIRED
        trigger: "POST /network/programs/{id}/retire"
        actor: CertificationEngineer
        preconditions: ["Program.status == PRODUCTION_ENABLED"]
        side_effects: ["Cascade: BinRange rows with assigned_program_id == this Program and status == ACTIVE transition to DEACTIVATED", "Program.version increments"]

  - entity: NetworkRule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /network/rules/{id}/publish"
        actor: RulesAdministrator
        preconditions: ["NetworkRule.status == DRAFT", "effective_from >= current logical clock time"]
        side_effects:
          - "Supersede: any existing NetworkRule in PUBLISHED with the same rule_code and (same region_scope, or this rule is GLOBAL overriding a GLOBAL, or this rule region_scope matches the other's region_scope) whose effective_from < this rule's effective_from transitions to SUPERSEDED"
          - "NetworkRule.version increments"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "Cascade from a later-effective rule with same rule_code and overlapping scope being published"
        actor: system
        preconditions: ["NetworkRule.status == PUBLISHED"]
        side_effects: ["NetworkRule.version increments"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /network/rules/{id}/retire"
        actor: RulesAdministrator
        preconditions: ["NetworkRule.status == PUBLISHED"]
        side_effects: ["NetworkRule.version increments"]

  - entity: RuleViolation
    initial_state: CITED
    terminal_states: [CONFIRMED, WAIVED]
    transitions:
      - from: CITED
        to: ASSESSED
        trigger: "POST /network/rule-violations/{id}/assess"
        actor: RulesAdministrator
        preconditions: ["RuleViolation.status == CITED", "Segregation of duties: assessing X-User-ID != RuleViolation.cited_by_id"]
        side_effects: ["RuleViolation.fine_cents computed per calculations.fine_tier_selection", "RuleViolation.assessed_by_id set to X-User-ID", "RuleViolation.version increments"]
      - from: ASSESSED
        to: APPEALED
        trigger: "POST /network/rule-violations/{id}/appeal"
        actor: Member
        preconditions: ["RuleViolation.status == ASSESSED", "X-User-ID == RuleViolation.subject_member_id"]
        side_effects: ["RuleViolation.version increments"]
      - from: ASSESSED
        to: CONFIRMED
        trigger: "POST /network/rule-violations/{id}/confirm"
        actor: RulesAdministrator
        preconditions: ["RuleViolation.status == ASSESSED", "Segregation of duties: confirming X-User-ID != RuleViolation.assessed_by_id"]
        side_effects: ["RuleViolation.version increments"]
      - from: APPEALED
        to: CONFIRMED
        trigger: "POST /network/rule-violations/{id}/confirm"
        actor: RulesAdministrator
        preconditions: ["RuleViolation.status == APPEALED", "Segregation of duties: confirming X-User-ID != RuleViolation.assessed_by_id"]
        side_effects: ["RuleViolation.version increments"]
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /network/rule-violations/{id}/waive"
        actor: RulesAdministrator
        preconditions: ["RuleViolation.status == ASSESSED", "Segregation of duties: waiving X-User-ID != RuleViolation.assessed_by_id"]
        side_effects: ["RuleViolation.fine_cents reset to 0", "RuleViolation.version increments"]
      - from: APPEALED
        to: WAIVED
        trigger: "POST /network/rule-violations/{id}/waive"
        actor: RulesAdministrator
        preconditions: ["RuleViolation.status == APPEALED", "Segregation of duties: waiving X-User-ID != RuleViolation.assessed_by_id"]
        side_effects: ["RuleViolation.fine_cents reset to 0", "RuleViolation.version increments"]

  - entity: DisputeCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /network/disputes/{id}/evidence (first evidence submission by either party)"
        actor: Member
        preconditions: ["DisputeCase.status IN {OPENED, EVIDENCE_SUBMITTED}", "X-User-ID equals issuer_member_id or acquirer_member_id", "submitted_at within EVIDENCE_WINDOW_DAYS of filing_clock"]
        side_effects: ["DisputeEvidence row created (append-only)", "DisputeCase.status set to EVIDENCE_SUBMITTED if it was OPENED", "DisputeCase.version increments"]
      - from: OPENED
        to: DECIDED
        trigger: "POST /network/disputes/{id}/decide"
        actor: DisputeAnalyst
        preconditions: ["DisputeCase.status IN {OPENED, EVIDENCE_SUBMITTED}"]
        side_effects: ["winning_side set from request", "filing_clock reset to logical now (opens the arbitration window)", "DisputeCase.version increments"]
      - from: EVIDENCE_SUBMITTED
        to: DECIDED
        trigger: "POST /network/disputes/{id}/decide"
        actor: DisputeAnalyst
        preconditions: ["DisputeCase.status IN {OPENED, EVIDENCE_SUBMITTED}"]
        side_effects: ["winning_side set from request", "filing_clock reset to logical now", "DisputeCase.version increments"]
      - from: DECIDED
        to: ARBITRATION_REQUESTED
        trigger: "POST /network/disputes/{id}/request-arbitration"
        actor: Member
        preconditions: ["DisputeCase.status == DECIDED", "X-User-ID equals issuer_member_id or acquirer_member_id", "logical now < filing_clock + ARBITRATION_WINDOW_DAYS"]
        side_effects: ["DisputeCase.version increments"]
      - from: ARBITRATION_REQUESTED
        to: ARBITRATION_DECIDED
        trigger: "POST /network/disputes/{id}/arbitrate"
        actor: DisputeAnalyst
        preconditions: ["DisputeCase.status == ARBITRATION_REQUESTED"]
        side_effects: ["winning_side overwritten with the arbitration outcome", "DisputeCase.version increments"]
      - from: DECIDED
        to: CLOSED
        trigger: "POST /network/disputes/{id}/close"
        actor: DisputeAnalyst
        preconditions: ["DisputeCase.status IN {DECIDED, ARBITRATION_DECIDED}"]
        side_effects: ["DisputeCase.version increments"]
      - from: ARBITRATION_DECIDED
        to: CLOSED
        trigger: "POST /network/disputes/{id}/close"
        actor: DisputeAnalyst
        preconditions: ["DisputeCase.status IN {DECIDED, ARBITRATION_DECIDED}"]
        side_effects: ["DisputeCase.version increments"]

  - entity: InterchangeRate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /network/interchange-rates/{id}/publish"
        actor: PricingAnalyst
        preconditions: ["InterchangeRate.status == DRAFT", "effective_from >= current logical clock time"]
        side_effects: ["InterchangeRate.version increments"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /network/interchange-rates/{id}/retire"
        actor: PricingAnalyst
        preconditions: ["InterchangeRate.status == PUBLISHED"]
        side_effects: ["InterchangeRate.version increments"]

  - entity: FraudCase
    initial_state: REPORTED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /network/fraud-cases/{id}/confirm"
        actor: FraudAnalyst
        preconditions: ["FraudCase.status == REPORTED", "Merchant.status == ACTIVE"]
        side_effects: ["FraudCase.confirmed_at set to logical now", "Merchant under-monitoring recompute flag set (merchant enters fraud-rate scope for cycles containing confirmed_at)", "If Merchant.participant_id is non-null, Participant.fraud_attributed_count increments by 1", "FraudCase.version increments"]
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /network/fraud-cases/{id}/dismiss"
        actor: FraudAnalyst
        preconditions: ["FraudCase.status == REPORTED"]
        side_effects: ["FraudCase.version increments"]

  - entity: RemediationPlan
    initial_state: OPEN
    terminal_states: [COMPLETED, ESCALATED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /network/remediation-plans/{id}/submit"
        actor: FraudAnalyst
        preconditions: ["RemediationPlan.status == OPEN", "logical now <= due_at"]
        side_effects: ["RemediationPlan.version increments"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /network/remediation-plans/{id}/approve"
        actor: FraudAnalyst
        preconditions: ["RemediationPlan.status == SUBMITTED", "Segregation of duties: approving X-User-ID != submitting X-User-ID (submitter recorded at submit time)"]
        side_effects: ["RemediationPlan.approved_by_id set to X-User-ID", "If subject_type == MERCHANT, Merchant.fraud_monitoring_status set to UNDER_MONITORING", "RemediationPlan.version increments"]
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /network/remediation-plans/{id}/complete"
        actor: FraudAnalyst
        preconditions: ["RemediationPlan.status == APPROVED", "logical now <= due_at"]
        side_effects: ["If subject_type == MERCHANT, Merchant.fraud_monitoring_status set to EXEMPTED for the remainder of the cycle", "RemediationPlan.version increments"]
      - from: OPEN
        to: OVERDUE
        trigger: "POST /network/fraud-program-cycles/{id}/evaluate (system sweep at cycle evaluation marks plans of prior cycles past due)"
        actor: system
        preconditions: ["RemediationPlan.status IN {OPEN, SUBMITTED}", "logical now > due_at"]
        side_effects: ["RemediationPlan.version increments"]
      - from: SUBMITTED
        to: OVERDUE
        trigger: "System sweep at next cycle evaluation"
        actor: system
        preconditions: ["RemediationPlan.status IN {OPEN, SUBMITTED}", "logical now > due_at"]
        side_effects: ["RemediationPlan.version increments"]
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /network/remediation-plans/{id}/escalate"
        actor: FraudAnalyst
        preconditions: ["RemediationPlan.status == OVERDUE"]
        side_effects: ["If subject_type == ACQUIRER, the subject Member transitions ACTIVE -> SUSPENDED with suspension_reason 'FRAUD_REMEDIATION_ESCALATION' (firing the full Member suspension cascade)", "RemediationPlan.version increments"]

  - entity: FraudProgramCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /network/fraud-program-cycles/{id}/evaluate"
        actor: FraudAnalyst
        preconditions: ["FraudProgramCycle.status == SCHEDULED", "logical clock >= period_end"]
        side_effects:
          - "For every Merchant with status == ACTIVE at evaluation: compute fraud_rate_bps per calculations.merchant_fraud_rate; if >= MERCHANT_FRAUD_THRESHOLD_BPS set Merchant.fraud_monitoring_status = REMEDIATION_REQUIRED and create a RemediationPlan (subject_type MERCHANT, status OPEN, due_at = logical now + REMEDIATION_WINDOW_DAYS); merchants_flagged counts these"
          - "For every acquirer Member (member_kind IN {ACQUIRER, BOTH}, status == ACTIVE): compute aggregate fraud_rate_bps over its portfolio per calculations.acquirer_fraud_rate; if >= ACQUIRER_FRAUD_THRESHOLD_BPS create a RemediationPlan (subject_type ACQUIRER, status OPEN, due_at = logical now + REMEDIATION_WINDOW_DAYS); acquirers_flagged counts these"
          - "Sweep: every RemediationPlan with status IN {OPEN, SUBMITTED} and due_at < logical now transitions to OVERDUE"
          - "evaluated_at set to logical now"
          - "FraudProgramCycle.version increments"

  - entity: SettlementWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /network/settlement-windows/{id}/open"
        actor: SettlementOperator
        preconditions: ["SettlementWindow.status == SCHEDULED", "logical now >= opens_at", "No other SettlementWindow in status OPEN exists (strictly one open window at a time)"]
        side_effects: ["SettlementWindow.version increments"]
      - from: OPEN
        to: RECONCILED
        trigger: "POST /network/settlement-windows/{id}/reconcile"
        actor: SettlementOperator
        preconditions: ["SettlementWindow.status == OPEN", "Every SettlementLine with window_id == this window is in status COMMITTED or REVERSED (no DRAFT lines remain)"]
        side_effects: ["SettlementWindow.version increments"]
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /network/settlement-windows/{id}/close"
        actor: SettlementOperator
        preconditions: ["SettlementWindow.status == RECONCILED"]
        side_effects: ["SettlementWindow.version increments"]

  - entity: SettlementLine
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /network/settlement-lines/{id}/commit"
        actor: SettlementOperator
        preconditions: ["SettlementLine.status == DRAFT", "Window status == OPEN", "opens_at <= logical now < closes_at of the window", "Both members ACTIVE"]
        side_effects:
          - "committed_at set to logical now"
          - "From-member.settled_balance_cents -= amount_cents"
          - "To-member.settled_balance_cents += amount_cents"
          - "Window.total_settled_cents += amount_cents"
          - "Both member versions and window version increment"
      - from: COMMITTED
        to: REVERSED
        trigger: "POST /network/settlement-lines/{id}/reverse"
        actor: SettlementOperator
        preconditions: ["SettlementLine.status == COMMITTED", "Window status == OPEN"]
        side_effects:
          - "From-member.settled_balance_cents += amount_cents"
          - "To-member.settled_balance_cents -= amount_cents"
          - "Window.total_settled_cents -= amount_cents"
          - "Both member versions and window version increment"

concurrency_rules:
  - rule_id: rule-publish-stale-rule
    parent_entity: NetworkRule
    write_endpoint: "POST /network/rules"
    occ_field: "expected_rule_version"
    description: |
      Creating a NetworkRule that supersedes an existing published rule is
      rejected when the client's view of that existing rule is stale —
      the referenced supersedes_rule_id's version advanced since the client
      observed it, so the supersede decision was made against an outdated
      effective_from or fine_schedule.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: program-approve-stale-program
    parent_entity: Program
    write_endpoint: "POST /network/programs/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a Program whose version advanced since the client observed it
      is rejected; a concurrent edit (e.g. a product_code change) bumps
      Program.version, invalidating the certification results the approval
      was based on.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: fine_tier_selection
    trigger: "POST /network/rule-violations/{id}/assess"
    algorithm: threshold
    formula: |
      schedule = rule.fine_schedule (ordered by min_amount_minor ASC)
      tier = last entry of schedule where transaction_amount_minor >= entry.min_amount_minor
        AND (entry.max_amount_minor is null OR transaction_amount_minor <= entry.max_amount_minor)
      fine_cents = tier.fine_cents
      Severity multiplier applied AFTER tier selection:
        MINOR -> x1, MAJOR -> x2, CRITICAL -> x3
      fine_cents = fine_cents * severity_multiplier
    input_set: "The violated NetworkRule's fine_schedule; the violation's transaction_amount_minor and severity"
    constants:
      SEVERITY_MULTIPLIER_MINOR: 1
      SEVERITY_MULTIPLIER_MAJOR: 2
      SEVERITY_MULTIPLIER_CRITICAL: 3
    precision: "integer cents, no rounding"
    variants:
      - name: effective_rule_provisional
        when: "Violation is assessed before the rule's effective_from has passed on the logical clock"
        difference: "Citation is rejected at creation: rule must be PUBLISHED and effective_from <= logical now; no provisional fine exists"
      - name: regional_override_applied
        when: "A PUBLISHED regional rule exists whose regional_override_of_rule_id == cited GLOBAL rule and region_scope == subject member's region, effective at assessment time"
        difference: "fine_schedule is taken from the regional override rule, not the GLOBAL base rule"

  - name: dispute_liability
    trigger: "POST /network/disputes/{id}/decide and POST /network/disputes/{id}/arbitrate"
    algorithm: waterfall_allocation
    formula: |
      If winning_side == ISSUER:
        acquirer_liability_cents = transaction_amount_cents + DISPUTE_FEE_CENTS
        issuer_liability_cents = 0
      If winning_side == ACQUIRER:
        issuer_liability_cents = CASE_PROCESSING_FEE_CENTS
        acquirer_liability_cents = 0
      Arbitration adds ARBITRATION_FEE_CENTS to the LOSING side's liability on top of the base outcome.
    input_set: "DisputeCase.transaction_amount_cents, winning_side, whether the decision came from decide or arbitrate"
    constants:
      DISPUTE_FEE_CENTS: 1500
      CASE_PROCESSING_FEE_CENTS: 500
      ARBITRATION_FEE_CENTS: 25000
    precision: "integer cents, no rounding"
    variants:
      - name: initial_decision
        when: "Dispute decided at DECIDED stage (no arbitration)"
        difference: "Only DISPUTE_FEE_CENTS or CASE_PROCESSING_FEE_CENTS applies"
      - name: arbitration_decision
        when: "Dispute decided at ARBITRATION_DECIDED stage"
        difference: "ARBITRATION_FEE_CENTS added to losing side's liability in addition to the base outcome fee"

  - name: interchange_fee
    trigger: "POST /network/interchange-rates/quote"
    algorithm: tiered_pricing
    formula: |
      Candidate set: InterchangeRate rows with status == PUBLISHED, effective_from <= logical now,
        merchant_category == request.mcc, transaction_type == request.transaction_type,
        and data_quality_tier == the tier the request's data QUALIFIES for.
      Qualification (data quality): request qualifies for PREMIUM if it supplies token AND avs_match;
        else ENHANCED if it supplies avs_match; else STANDARD.
      Scope selection: a row with region_scope == request.region is preferred over region_scope == GLOBAL;
        among remaining ties, the row with the LATEST effective_from wins; if effective_from ties, the row
        with the earliest created_at wins.
      Fallback: if no row matches the qualified tier, fall back DOWNWARD tier-by-tier
        (PREMIUM -> ENHANCED -> STANDARD); if no row matches any tier, return ERR_RATE_NOT_FOUND.
      fee_cents = floor(amount_cents * rate_basis_points / 10000) + fixed_fee_cents
    input_set: "PUBLISHED InterchangeRate rows effective at logical now; request fields mcc, transaction_type, region, amount_cents, token?, avs_match?"
    constants: {}
    precision: "integer cents; floor on the percentage component BEFORE adding fixed fee"
    variants:
      - name: provisional_versus_final
        when: "request.as_of supplied"
        difference: "as_of in the past replays which rate row was effective at that timestamp (chronological selection on effective_from <= as_of); absent as_of uses logical now — the two can select different rows and produce different fees for identical payloads"

  - name: merchant_fraud_rate
    trigger: "POST /network/fraud-program-cycles/{id}/evaluate"
    algorithm: aggregation
    formula: |
      confirmed = FraudCase rows with merchant_id == merchant, status == CONFIRMED,
        period_start <= confirmed_at < period_end
      fraud_rate_bps = (sum(confirmed.fraud_amount_cents) * 10000) / max(portfolio_volume_cents, 1)
      portfolio_volume_cents = merchant.declared_monthly_volume_cents
        (the declared volume is denominated per evaluation period; cycles are fixed-length
         periods so no proration is applied)
      Tier flag: fraud_rate_bps >= MERCHANT_FRAUD_THRESHOLD_BPS -> REMEDIATION_REQUIRED
    input_set: "CONFIRMED FraudCase rows in [period_start, period_end); Merchant.declared_monthly_volume_cents"
    constants:
      MERCHANT_FRAUD_THRESHOLD_BPS: 100
    precision: "basis points as rational; comparison done on exact rational cross-multiplication, no intermediate rounding"
    variants:
      - name: participant_attributed
        when: "Merchant.participant_id is non-null"
        difference: "The same confirmed cases ALSO roll up to the Participant.fraud_attributed_count and feed the sponsoring acquirer's aggregate rate via the participant's merchants — the same event counted in two different aggregations (merchant-level bps vs acquirer-level bps) produces different flagging outcomes"

  - name: acquirer_fraud_rate
    trigger: "POST /network/fraud-program-cycles/{id}/evaluate"
    algorithm: aggregation
    formula: |
      portfolio = all Merchants with (acquirer_member_id == member) OR
        (participant.sponsor_member_id == member), any merchant status except TERMINATED
      confirmed = FraudCase rows with merchant_id IN portfolio, status == CONFIRMED,
        period_start <= confirmed_at < period_end
      numerator = sum(confirmed.fraud_amount_cents)
      denominator = sum(merchant.declared_monthly_volume_cents) over portfolio
      acquirer_fraud_rate_bps = numerator * 10000 / max(denominator, 1)
      Flag when >= ACQUIRER_FRAUD_THRESHOLD_BPS
    input_set: "Portfolio merchants (direct + via sponsored participants), CONFIRMED fraud cases in [period_start, period_end)"
    constants:
      ACQUIRER_FRAUD_THRESHOLD_BPS: 50
    precision: "exact rational comparison, no intermediate rounding"
    variants: []

  - name: settlement_net_position
    trigger: "GET /network/settlement-windows/{id}/positions"
    algorithm: waterfall_allocation
    formula: |
      For each member M with lines in window W:
        net_cents = sum(amount where to_member == M, status == COMMITTED)
                  - sum(amount where from_member == M, status == COMMITTED)
      Global invariant per window: sum over all members of net_cents == 0 exactly.
      Ordering: positions returned sorted by net_cents ASC (largest debtor first);
        ties broken by member created_at ASC.
    input_set: "SettlementLine rows of the window in status COMMITTED (REVERSED and DRAFT excluded)"
    constants: {}
    precision: "integer cents; sum of all positions must equal 0"
    variants:
      - name: provisional_intra_day
        when: "Window status == OPEN"
        difference: "Positions include COMMITTED lines so far and can still change; DRAFT lines excluded in both variants"
      - name: final_post_reconcile
        when: "Window status IN {RECONCILED, CLOSED}"
        difference: "Positions are frozen; identical formula but the input set can no longer change — reading both variants across a reconcile can produce different numbers for the same window"

  - name: dispute_filing_windows
    trigger: "POST /network/disputes/{id}/evidence and POST /network/disputes/{id}/request-arbitration"
    algorithm: threshold
    formula: |
      Evidence admissible when submitted_at <= filing_clock_at_open + EVIDENCE_WINDOW_DAYS
        (filing_clock_at_open is the logical timestamp at which the dispute was OPENED;
         the window boundary is INCLUSIVE — submitted_at == deadline is admitted).
      Arbitration admissible when request_time < filing_clock_at_decision + ARBITRATION_WINDOW_DAYS
        (the arbitration boundary is EXCLUSIVE — a request exactly at the deadline is rejected).
      The two windows deliberately use different boundary semantics (inclusive vs exclusive).
    input_set: "DisputeCase.filing_clock (reset at each phase change), logical now"
    constants:
      EVIDENCE_WINDOW_DAYS: 30
      ARBITRATION_WINDOW_DAYS: 45
      REMEDIATION_WINDOW_DAYS: 60
    precision: "second-precision ISO8601 comparison"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path and body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Entity-backed identity check: X-User-ID must equal the referenced entity id where the endpoint pins ownership (e.g. member-scoped actions)"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "member-scoped endpoints"
  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from the user who performed the prior step (cite/assess, submit/approve)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /network/rule-violations/{id}/assess, POST /network/rule-violations/{id}/confirm, POST /network/rule-violations/{id}/waive, POST /network/remediation-plans/{id}/approve"
  - priority: 7
    category: business_constraint
    check: "Structural constraints: exactly one of participant_id/acquirer_member_id set on Merchant; bin_prefix 6 digits; mcc 4 digits; sponsor is ACTIVE and member_kind IN {ACQUIRER, BOTH}; issuer is ACTIVE and member_kind IN {ISSUER, BOTH}"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "creation endpoints"
  - priority: 8
    category: business_temporal
    check: "Temporal windows: evidence submitted within EVIDENCE_WINDOW_DAYS of filing_clock; arbitration requested within ARBITRATION_WINDOW_DAYS; committed_at within [opens_at, closes_at); cycle evaluation only after period_end"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /network/disputes/{id}/evidence, POST /network/disputes/{id}/request-arbitration, POST /network/settlement-lines/{id}/commit, POST /network/fraud-program-cycles/{id}/evaluate"
  - priority: 9
    category: business_constraint
    check: "Certification validity: a PASSED test only counts when evaluated_program_version == current Program.version"
    error_id: ERR_CERTIFICATION_STALE
    http_status: 422
    applies_to: "POST /network/programs/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "Uniqueness: rule_code + region_scope + effective_from combination unique among non-RETIRED rules; settlement window opens_at unique; window_date unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /network/rules, POST /network/settlement-windows"
  - priority: 11
    category: business_referential
    check: "Program enablement gate: BinRange approval requires referenced Program in PRODUCTION_ENABLED; production enablement requires Program.version == Program.approved_version + 1 (approval's own increment already accounted for)"
    error_id: ERR_PROGRAM_NOT_ENABLED
    http_status: 422
    applies_to: "POST /network/bin-ranges/{id}/approve, POST /network/programs/{id}/enable-production"
  - priority: 12
    category: business_fiscal
    check: "Settlement fiscal checks: amount_cents > 0; from_member != to_member; both members ACTIVE"
    error_id: ERR_SETTLEMENT_INVALID
    http_status: 422
    applies_to: "POST /network/settlement-lines, POST /network/settlement-lines/{id}/commit"
  - priority: 13
    category: business_referential
    check: "No published interchange rate matches the qualified tier or any lower tier for (mcc, transaction_type, region)"
    error_id: ERR_RATE_NOT_FOUND
    http_status: 422
    applies_to: "POST /network/interchange-rates/quote"

