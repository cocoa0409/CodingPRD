              as: InnovationLead
              as_user_id: "lead-fz"
              captures: { fz_p_id: $.data.id }
            - call: "POST /innovation-projects/${fz_p_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-fz"
              captures: { fz_p_v2: $.data.version }
            - call: "POST /innovation-projects/${fz_p_id}/business-cases"
              payload: { expected_project_version: "${fz_p_v2}", variant_mode: "TOP_DOWN", category_size_units_year: 4000000, target_share_pct: 4.00, cogs_per_unit_usd: 2.5000, slotting_fees_usd: 0.00, capex_usd: 100000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
              captures: { fz_bc_id: $.data.id }
            - call: "POST /business-cases/${fz_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 5.0000 }
              as: InnovationLead
            - call: "GET /deliverables?project_id=${fz_p_id}&gate_id=${fz_g2_id}"
              as: GateChair
              captures: { fz_d0_id: "$.data[0].id", fz_d1_id: "$.data[1].id" }
            - call: "POST /deliverables/${fz_d0_id}/submit"
              payload: { evidence_url: "https://npd.example/fz/mfg" }
              as: InnovationLead
              as_user_id: "sub-fz"
            - call: "POST /deliverables/${fz_d0_id}/decide"
