              captures: { total_final: $.data.total_final_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /loan-applications/${loan_id}/payoff"
              payload: { payoff_date: "2026-10-01T00:00:00Z" }
              as: LoanOperations
              as_user_id: "ops-1"
              captures: { loan_status: $.data.status, loan_comp: $.data.compensation_status }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { accrued_after: $.data.lifetime_accrued_cents, clawed_after: $.data.lifetime_clawed_back_cents, net_after: $.data.net_compensation_cents, score_after: $.data.exposure_score, mon_after: $.data.monitoring_status }
            - call: "GET /compensation-records"
              payload: { loan_application_id: "${loan_id}", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rec_status: "$.data[0].status", rec_days: "$.data[0].days_held", rec_recap: "$.data[0].recapture_pct", rec_claw: "$.data[0].clawback_cents", rec_paid: "$.data[0].paid_cents", rec_accrued: "$.data[0].accrued_cents" }
          assert:
            - "${net_before} == 0 (the pre-close baseline the invariant must return to)"
            - "${accrued_after_close} == 400000 and ${net_after_close} == 400000"
            - "${total_final} == 400000"
            - "${loan_status} == PAID_OFF and ${loan_comp} == CLAWED_BACK"
            - "${rec_days} == 30 and ${rec_recap} == 100 and ${rec_paid} == 400000 and
               ${rec_claw} == 400000 and ${rec_accrued} == 400000 and ${rec_status} == CLAWED_BACK"
            - "${net_after} == 0 == ${net_before} - the compensating action restores the net ledger
               exactly, with no residual cent"
            - "${accrued_after} == 400000 and ${clawed_after} == 400000 - the gross history is NOT
               erased; only the net is reversed"
            - "${net_after} == ${accrued_after} - ${clawed_after} (the invariant declared in
               calculations.early_payoff_clawback holds after the compensating action)"
            - "${score_after} == 25 and ${mon_after} == STANDARD (0.25 * clawback ratio 100 = 25;
               no dual pay, no spread, no approved exception)"
            - "A second payoff attempt is rejected with ERR_INVALID_STATE_TRANSITION, so the
               reversal cannot be applied twice and net_compensation_cents stays 0"

