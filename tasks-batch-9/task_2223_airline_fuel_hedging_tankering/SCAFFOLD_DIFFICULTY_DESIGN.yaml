          creates exactly one MTM_MARGIN_CALL posting for 440000.00, the counterparty
          utilization jumps from 24.00 to 112.00 and credit_posture becomes BREACH, and
          the program still lands COMPLIANT because 400000.00 of undesignated volatility
          is inside its 500000.00 limit - so hop 4 stops short of raising an exception.
