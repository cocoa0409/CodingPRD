      - name: storage_early_bird_cutoff
        claim_type: constants_applied
        grounds: ["calculations.storage_fee_cents"]
        distinguishing_aspect: "30-day early-bird boundary is inclusive: created exactly at starts_on - 30 days (2026-10-25T00:00:00Z) gets the 15% discount (fee 213); one day later (2026-10-26) pays full rate (fee 250)."
        test_recipe:
          setup: ["ENROLLED student; THANKSGIVING break starting 2026-11-24; storage unit cap 100"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat X", email: "px@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu X", grade: 11, gender: "FEMALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/break-periods", payload: { name: "THANKSGIVING_2026", kind: "THANKSGIVING", starts_on: "2026-11-24", ends_on: "2026-11-29", housing_available: true }, as: SchoolAdmin, captures: { brk: "$.data.id" } }
            - { call: "POST /reslife/storage-units", payload: { label: "UNIT-D", capacity_cuft: 100 }, as: SchoolAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /reslife/_clock/set_current_utc", payload: { to_iso8601: "2026-10-25T00:00:00Z" }, as: SchoolAdmin }
          trigger:
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Box A" }, as: Student, as_user_id: "${stu}", captures: { fee_a: "$.data.fee_cents", early_a: "$.data.early_bird" } }
            - { call: "POST /reslife/_clock/set_current_utc", payload: { to_iso8601: "2026-10-26T00:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Box B" }, as: Student, as_user_id: "${stu}", captures: { fee_b: "$.data.fee_cents", early_b: "$.data.early_bird" } }
          assert:
            - "captured early_a == true and fee_a == 213"
            - "captured early_b == false and fee_b == 250"
  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["none (empty database)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /reslife/students", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHENTICATED"
      - name: parent_decides_other_childs_leave_forbidden
        claim_type: cross_entity_validation
        grounds: ["validations[priority=2]", "roles[Parent]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Ownership scoping: Parent A (X-User-ID = parent of student A) deciding the leave of student B is rejected with ERR_FORBIDDEN even though Parent is in the endpoint's role list."
        test_recipe:
          setup: ["term ACTIVE; domestic students A and B with distinct parents; B has a REQUESTED leave"]
          setup_api_calls:
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat A", email: "pa@x.com" }, as: SchoolAdmin, captures: { par_a: "$.data.id" } }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat B", email: "pb@x.com" }, as: SchoolAdmin, captures: { par_b: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu A", grade: 12, gender: "MALE", is_international: false, parent_id: "${par_a}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_a: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu B", grade: 12, gender: "FEMALE", is_international: false, parent_id: "${par_b}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_b: "$.data.id" } }
            - { call: "POST /reslife/leave-requests", payload: { leave_type: "WEEKEND_OVERNIGHT", destination: "Home", departs_at: "2026-09-04T17:00:00Z", returns_at: "2026-09-06T19:00:00Z" }, as: Student, as_user_id: "${stu_b}", captures: { leave_b: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/leave-requests/${leave_b}/parent-decision", payload: { decision: "APPROVE" }, as: Parent, as_user_id: "${par_a}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_FORBIDDEN"
      - name: segregation_officer_equals_reporter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_REPORTER_CANNOT_ADJUDICATE]"]
        distinguishing_aspect: "Segregation of duties: scheduling a hearing whose hearing_officer_id equals reported_by_staff_id is rejected with ERR_REPORTER_CANNOT_ADJUDICATE."
        test_recipe:
          setup: ["MAJOR case in UNDER_REVIEW reported by dean1"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat C", email: "pc@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu C", grade: 11, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu}", category: "MAJOR", description: "Theft", points_proposed: 12 }, as: Dean, as_user_id: "${dean1}", captures: { case1: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case1}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
          trigger:
            - { call: "POST /reslife/discipline-cases/${case1}/schedule-hearing", payload: { hearing_at: "2026-09-10T15:00:00Z", hearing_officer_id: "${dean1}" }, as: Dean, as_user_id: "${dean1}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_REPORTER_CANNOT_ADJUDICATE"
      - name: controlled_admin_without_witness_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=12]", "errors[ERR_WITNESS_REQUIRED]"]
        distinguishing_aspect: "Conditional on is_controlled: an ADMINISTERED row on a controlled order without a witness — or with the witness equal to the administering nurse — is rejected with ERR_WITNESS_REQUIRED; a non-controlled order accepts the same shape."
        test_recipe:
          setup: ["ENROLLED student; controlled order and non-controlled order; two nurses"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat D", email: "pd@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu D", grade: 10, gender: "FEMALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Nurse One", staff_role: "NURSE" }, as: SchoolAdmin, captures: { nurse1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Nurse Two", staff_role: "NURSE" }, as: SchoolAdmin, captures: { nurse2: "$.data.id" } }
            - { call: "POST /reslife/medication-orders", payload: { student_id: "${stu}", medication_name: "Methylphenidate", dose_mg: 10, slot: "MORNING", doses_total: 30, is_controlled: true, prescriber_name: "Dr E" }, as: Nurse, as_user_id: "${nurse1}", captures: { order_c: "$.data.id" } }
            - { call: "POST /reslife/medication-orders", payload: { student_id: "${stu}", medication_name: "Vitamin C", dose_mg: 500, slot: "MORNING", doses_total: 30, is_controlled: false, prescriber_name: "Dr E" }, as: Nurse, as_user_id: "${nurse1}", captures: { order_n: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/medication-orders/${order_c}/administrations", payload: { scheduled_date: "2026-09-01", outcome: "ADMINISTERED" }, as: Nurse, as_user_id: "${nurse1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /reslife/medication-orders/${order_c}/administrations", payload: { scheduled_date: "2026-09-01", outcome: "ADMINISTERED", witness_staff_id: "${nurse1}" }, as: Nurse, as_user_id: "${nurse1}", captures: { err2: "$.data.error_id" } }
            - { call: "POST /reslife/medication-orders/${order_n}/administrations", payload: { scheduled_date: "2026-09-01", outcome: "ADMINISTERED" }, as: Nurse, as_user_id: "${nurse1}", captures: { ok_id: "$.data.id" } }
          assert:
            - "captured err1 == ERR_WITNESS_REQUIRED (no witness on controlled order)"
            - "captured err2 == ERR_WITNESS_REQUIRED (witness equals administering nurse)"
            - "MedicationAdministration.${ok_id} created for the non-controlled order without a witness"
      - name: duplicate_dose_rejected_when_order_active
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DOSE_ALREADY_LOGGED]"]
        distinguishing_aspect: "Pure referential uniqueness: on an ACTIVE order (no HOLD in play), a second administration for the same scheduled_date fails with ERR_DOSE_ALREADY_LOGGED."
