      - name: empty_license_pool_blocks_run_compliance
        grounds:
          - calculations.license_selection
          - validations[priority=13]
          - entities.ComplianceCheck.fields.reason_code
        distinguishing_aspect: |
          EMPTY-SET boundary on POST /visits/{id}/run-compliance: the candidate StateLicense pool for
          (physician, determined_state) is empty -> ERR_NO_LICENSE_IN_STATE and a BLOCKED ComplianceCheck
          with reason_code NO_LICENSE_IN_STATE. A collection-emptiness edge, reachable through a different
          endpoint and metric than the numeric DEA-day boundary above.
