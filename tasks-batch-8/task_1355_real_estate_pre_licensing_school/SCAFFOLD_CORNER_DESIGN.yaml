      - name: cn_double_certificate_and_double_pay_rejected
        claim_type: idempotency
        grounds: ["state_machines.Enrollment.EXAM_PASSED_to_COMPLETED", "errors[ERR_ENROLLMENT_STATE_INVALID]"]
        distinguishing_aspect: "Repeated triggers fail safely: a second certificate on a COMPLETED enrollment and a second pay on a PAID enrollment both fail with ERR_ENROLLMENT_STATE_INVALID."
        test_recipe:
          setup: ["LICENSED school; course required 60; PUBLISHED offering; enrollment COMPLETED with certificate; second PAID-then-completed flow not needed — reuse the same enrollment"]
