  # =========================================================================
  # Consistency model: immediate. Nothing in the model is allowed to lag a
  # response, so the claim worth pinning is that a single write's own body
  # already carries every field its cascade touched.
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_same_response_that_caused_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /mpl/enrollments/{id}/completion]
          - endpoints[POST /mpl/policy-terms/{id}/issuance]
        distinguishing_aspect: "No read-after-write delay is tolerated: the completion response itself carries credit_pct_snapshot and expires_on, and the DRAFT term re-rated by that completion already shows the credited premium on the very next read with no intervening write."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured CREDENTIALED to 2028-01-01."
            - "One DRAFT term 2026-09-01 to 2027-09-01 quoted with no program credit yet, and one ENROLLED SIM_LAB enrollment on the insured. The term's effective_date is deliberately later than the completion date so the completed enrollment is inside program_credit_pct's as_of window."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id, ins_a_v0: $.data.version }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-09-01", expiration_date: "2027-09-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { term_a1: $.data.id }
            - call: "GET /mpl/insureds/${ins_a}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a_v_now: $.data.version }
            - call: "POST /mpl/insureds/${ins_a}/enrollments"
              payload: { program_code: "SIM_LAB", enrolled_on: "2026-08-05", expected_insured_version: "${ins_a_v_now}" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { enr_a: $.data.id }
          trigger:
            - call: "POST /mpl/enrollments/${enr_a}/completion"
              payload: { completed_on: "2026-08-10", attestation_reference: "SIM-2026-0001" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/policy-terms/${term_a1}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/policies/${pol_a}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
          assert:
            - "completion response.status == 200 with data.credit_pct_snapshot 0.05 and data.expires_on 2028-08-09 already present in that same body"
            - "term read response.status == 200 with data.credit_pct_applied 0.05, no second write needed"
            - "PolicyTerm.${term_a1}.status == DRAFT"
            - "PolicyTerm.${term_a1}.credit_pct_applied == 0.05"
            - "Policy.${pol_a}.quoted_premium_total equals PolicyTerm.${term_a1}.term_total on the immediately following read"
            - "RiskProgramEnrollment.${enr_a}.status == COMPLETED"
