            - "CoreDepositInvoice.${inv2_id}.status == SETTLED_PARTIAL"

  # ===========================================================================
  # Rule 7 - cross_entity_state_dependency: WarrantyClaim x RemanOrder vs
  # DynoTestRun x DynoBooking. Different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: warranty_claim_requires_shipped_order
        grounds:
          - state_machines.WarrantyClaim.transitions.SUBMITTED_to_APPROVED
          - validations[priority=6]
          - errors[ERR_ORDER_NOT_SHIPPED]
        distinguishing_aspect: |
          Pair WarrantyClaim x RemanOrder: claim creation is gated on the
          referenced order being SHIPPED; the same payload is rejected with
          ERR_ORDER_NOT_SHIPPED while the order sits in CALIBRATION and
          accepted after the order reaches SHIPPED.
        test_recipe:
          setup:
            - "One order in CALIBRATION (not yet dyno-tested or shipped)"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
          trigger:
            - call: "POST /api/warranty-claims"
              payload: { reman_order_id: "${o_id}", failure_code: "GEAR_CLUNK", claimed_labor_hours: 5.0, installer_labor_rate_cents: 12000, allowance_policy: "BOOK_HOURS" }
              as: Installer
              as_user_id: "inst-1"
              captures: { err: "$.data.error_id" }
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "POST /api/warranty-claims"
              payload: { reman_order_id: "${o_id}", failure_code: "GEAR_CLUNK", claimed_labor_hours: 5.0, installer_labor_rate_cents: 12000, allowance_policy: "BOOK_HOURS" }
              as: Installer
              as_user_id: "inst-1"
              captures: { cl_id: "$.data.id" }
          assert:
            - "first claim attempt: status 409, error_id == ERR_ORDER_NOT_SHIPPED"
            - "second claim attempt (after ship): 201, WarrantyClaim.${cl_id}.claim_status == SUBMITTED"
            - "WarrantyClaim.${cl_id}.installer_id == inst-1"

      - name: dyno_run_requires_covering_booking
        grounds:
          - state_machines.RemanOrder.transitions.DYNO_QUEUE_to_DYNO_PASSED
          - errors[ERR_NO_ACTIVE_DYNO_BOOKING]
          - entities.DynoTestRun.fields.dyno_booking_id
        distinguishing_aspect: |
          Pair DynoTestRun x DynoBooking (different pair than claim x order):
          a run posted while the order is in DYNO_QUEUE but no BOOKED booking
          covers the current logical time is rejected; once a covering booking
          exists the same run succeeds and the run row references the booking.
        test_recipe:
          setup:
            - "One order in DYNO_QUEUE; no dyno bookings exist"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
          trigger:
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
              captures: { err: "$.data.error_id" }
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
              captures: { b_id: "$.data.id" }
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
              captures: { r_id: "$.data.id" }
          assert:
            - "first run attempt: status 409, error_id == ERR_NO_ACTIVE_DYNO_BOOKING"
            - "second run attempt: 201, DynoTestRun.${r_id}.verdict == PASS"
            - "DynoTestRun.${r_id}.dyno_booking_id == ${b_id}"
            - "RemanOrder.${o_id}.status == DYNO_PASSED"

  # ===========================================================================
  # Rule 8 - resource_temporal_overlap: dyno cell half-open semantics vs core
  # dock closed-interval + buffer semantics. Different resources and
  # different interval geometry.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dyno_cell_half_open_adjacency
        grounds:
          - errors[ERR_DYNO_CELL_OVERLAP]
          - entities.DynoBooking.fields.dyno_cell_code
          - validations[priority=9]
        distinguishing_aspect: |
          Dyno cells use half-open [start_utc, end_utc) windows: a booking
          starting exactly when another ends is ADJACENT and allowed, while
          one overlapping by 30 minutes is rejected. Adjacency is legal - the
          opposite of the dock rule in the sibling instance.
        test_recipe:
          setup:
            - "One order in DYNO_QUEUE; booking B1 on cell DYNO-7 covers [10:00, 11:00)"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-7", start_utc: "2026-08-01T10:00:00Z", end_utc: "2026-08-01T11:00:00Z" }
              as: RemanTechnician
              captures: { b1_id: "$.data.id" }
          trigger:
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-7", start_utc: "2026-08-01T11:00:00Z", end_utc: "2026-08-01T12:00:00Z" }
              as: RemanTechnician
              captures: { b2_id: "$.data.id" }
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-7", start_utc: "2026-08-01T10:30:00Z", end_utc: "2026-08-01T11:30:00Z" }
              as: RemanTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "adjacent booking [11:00,12:00) succeeds: 201, DynoBooking.${b2_id}.status == BOOKED"
            - "overlapping booking [10:30,11:30) fails: 409, error_id == ERR_DYNO_CELL_OVERLAP"

      - name: core_dock_closed_interval_with_buffer
        grounds:
          - errors[ERR_DOCK_OVERLAP]
          - entities.CoreUnit.fields.dock_code
          - validations[priority=9]
        distinguishing_aspect: |
          Receiving docks use CLOSED intervals plus a mandatory 30-minute
          turnaround buffer: an appointment starting exactly when another ends
          CONFLICTS (blocked until end+30m), and only a start at or after
          end+30m is accepted - geometrically different from the dyno cell's
          half-open adjacency, on a different resource entity (CoreUnit dock
          vs DynoBooking cell).
        test_recipe:
          setup:
            - "Two SHIPPED orders o1/o2 with invoices inv1/inv2 (deposit 50000c each); core1 registered at dock DOCK-9 for [10:00, 11:00]"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o1_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o1_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o1_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o1_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o1_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o1_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o1_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o1_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o1_id}"
              as: Any
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv1_id}", dock_code: "DOCK-9", dock_start_utc: "2026-08-01T10:00:00Z", dock_end_utc: "2026-08-01T11:00:00Z" }
              as: CoreIntakeClerk
              captures: { c1_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-2" }
              as: RemanPlanner
              captures: { o2_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o2_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o2_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o2_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o2_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o2_id}", dyno_cell_code: "DYNO-2", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o2_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o2_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o2_id}"
              as: Any
              captures: { inv2_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv2_id}", dock_code: "DOCK-9", dock_start_utc: "2026-08-01T11:00:00Z", dock_end_utc: "2026-08-01T12:00:00Z" }
              as: CoreIntakeClerk
              captures: { err: "$.data.error_id" }
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv2_id}", dock_code: "DOCK-9", dock_start_utc: "2026-08-01T11:30:00Z", dock_end_utc: "2026-08-01T12:30:00Z" }
              as: CoreIntakeClerk
              captures: { c2_id: "$.data.id" }
          assert:
            - "appointment starting at 11:00 (exactly at prior end) fails: 409, error_id == ERR_DOCK_OVERLAP (buffer blocks until 11:30)"
            - "appointment starting at 11:30 (end + 30m buffer) succeeds: 201, CoreUnit.${c2_id}.status == RECEIVED"
            - "CoreDepositInvoice.${inv2_id}.status == AWAITING_GRADE after the accepted registration"

  # ===========================================================================
  # Rule 9 - compensating_invariant: part availability units vs deposit
  # cents. Different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: part_reserve_cancel_release_conserves_availability
        grounds:
          - state_machines.RemanOrder.transitions.ASSEMBLY_to_CANCELLED
          - state_machines.RemanOrder.transitions.QUEUED_to_ASSEMBLY
          - entities.HardPart.fields.availability
        distinguishing_aspect: |
          Conserved quantity: HardPart availability (qty_on_hand -
          qty_reserved). A reserve of 2 followed by its compensating release
          on cancel must restore the exact pre-reserve availability (5 - 0 ==
          5) - the paired actions net to zero drift.
        test_recipe:
          setup:
            - "Model FULL requires 2x PUMP; HardPart P1 DIRECT on_hand 5; order kitted into ASSEMBLY holding 2x P1"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "FULL-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [ {part_family: "PUMP", qty: 2} ] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p1_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p1_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "GET /api/hard-parts/${p1_id}"
              as: Any
              captures: { mid_reserved: "$.data.qty_reserved" }
          trigger:
            - call: "POST /api/reman-orders/${o_id}/cancel"
              as: RemanPlanner
            - call: "GET /api/hard-parts/${p1_id}"
              as: Any
          assert:
            - "after kit-reserve: HardPart.${p1_id}.qty_reserved == 2 and availability == 3"
            - "after cancel: HardPart.${p1_id}.qty_on_hand == 5 and qty_reserved == 0"
            - "availability invariant: 5 - 0 == pre-reserve availability (5); reserve+release pair nets to zero drift"
            - "RemanOrder.${o_id}.status == CANCELLED"

      - name: deposit_settlement_adjustment_conserves_total
        grounds:
          - state_machines.CoreDepositInvoice.transitions.DISPUTED_to_SETTLED_ADJUSTED
          - entities.CoreDepositInvoice.fields.final_credit_cents
          - entities.CoreDepositInvoice.fields.forfeited_cents
        distinguishing_aspect: |
          Conserved quantity: deposit cents. At every settlement -
          grade-driven (37500 + 12500) and compensating dispute adjustment
          (40000 + 10000) - final_credit_cents + forfeited_cents == deposit
          50000; the adjustment re-splits but never leaks the total.
        test_recipe:
          setup:
            - "One SHIPPED order (deposit 50000c); core graded B on-time -> SETTLED_PARTIAL; dispute opened"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o_id}"
              as: Any
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /api/core-units"
              payload: { core_deposit_invoice_id: "${inv_id}", dock_code: "DOCK-1", dock_start_utc: "2026-08-01T10:00:00Z", dock_end_utc: "2026-08-01T11:00:00Z" }
              as: CoreIntakeClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/core-units/${c_id}/inspect"
              payload: { case_cracked: false, findings: ["SENSOR_HARNESS_MISSING"] }
              as: CoreInspector
            - call: "POST /api/core-deposit-invoices/${inv_id}/dispute"
              as: CoreIntakeClerk
          trigger:
            - call: "POST /api/core-deposit-invoices/${inv_id}/resolve-dispute"
              payload: { action: "ADJUST", adjusted_credit_cents: 40000 }
              as: ProgramAdmin
          assert:
            - "grade settlement conserved: 37500 + 12500 == 50000"
            - "CoreDepositInvoice.${inv_id}.status == SETTLED_ADJUSTED"
            - "CoreDepositInvoice.${inv_id}.final_credit_cents == 40000"
            - "CoreDepositInvoice.${inv_id}.forfeited_cents == 10000"
            - "adjustment conserved: 40000 + 10000 == 50000 (deposit_cents unchanged)"
            - "RemanOrder.${o_id}.core_settlement_status == CLOSED"
