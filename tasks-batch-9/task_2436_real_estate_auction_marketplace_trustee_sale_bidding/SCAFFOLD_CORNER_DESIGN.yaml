  # ===========================================================================
  - section: calculations
    instances:
      - name: required_deposit_correct_result_for_tenant_occupied_lot
        claim_type: correct_result
        grounds:
          - calculations.required_deposit
          - entities.AuctionLot.fields.required_deposit_cents
        distinguishing_aspect: "required_deposit is keyed on the lot's OPENING bid and the asset's occupancy multiplier, not on the estimated value or the reserve: 20000000 opening under TENANT_OCCUPIED gives 1250000 (5% -> 1000000, then x1.25), and it is frozen on the lot at add time."
        test_recipe:
          setup:
            - "A TENANT_OCCUPIED / CLEAR asset in CA-ALAMEDA (estimated_value 40000000) on a SCHEDULED event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Correct Result Bank", seller_type: "BANK", contact_email: "c@correct.example", settlement_account_ref: "ACH-CORR" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Correct Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 40000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "TENANT_OCCUPIED", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { tier: $.data.eviction_risk_tier }
            - call: "POST /auction-events"
              payload: { title: "Correct Result Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v: $.data.version }
