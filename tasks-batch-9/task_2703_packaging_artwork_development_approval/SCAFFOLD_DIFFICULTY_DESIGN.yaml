  # ==========================================================================
  # RULE 6 - boundary_precision_check
  # One instance pins an inclusive threshold whose value is itself derived
  # (2.0 - 0.5) at 2-decimal resolution; the other pins a round_half_up tie at
  # x.5, a round-up-not-truncate mean, an exact-division ceil that must not add
  # a week, and a remaining-units landing on exactly zero.
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: delta_e_verdict_inclusive_at_1_50_after_brand_critical_tightening
        grounds:
          - calculations.proof_color_tolerance_verdict
          - calculations.proof_color_tolerance_verdict.constants.DELTA_E_TOLERANCE
          - calculations.proof_color_tolerance_verdict.constants.BRAND_CRITICAL_TIGHTENING
          - entities.PrinterProof.fields.effective_tolerance
          - entities.PrinterProof.fields.color_status
          - entities.ArtworkAsset.fields.brand_critical_color
        distinguishing_aspect: |
          The tolerance is not a scaffold constant: it is 2.0 looked up from
          (G7_MASTER, COATED_PAPER) minus the 0.5 brand-critical tightening, so an
          implementation that skips the tightening gets 2.0 and passes all three
          measurements, and one that treats the comparison as strict < fails the 1.50
          proof. Only the exact effective tolerance of 1.5 with an inclusive <=
          produces PASS / PASS / FAIL across 1.49 / 1.50 / 1.51.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]); ArtworkAsset (CARTON / COATED_PAPER / US) with brand_critical_color true."
            - "ArtworkVersion v1 APPROVED through all three review stages, so POST /printer-proofs is admitted by priority 24."
            - "Printer 'Cascade Print Co' is CERTIFIED with color_standard G7_MASTER and certified_substrates [COATED_PAPER, FILM]."
            - "Three PrinterProofs on v1, all substrate_code COATED_PAPER, all PROOF_IN_REVIEW with color_status COLOR_PENDING; each therefore resolves the same effective tolerance of round_half_up(2.0 - 0.5, 1) == 1.5."
            - "No substrate or press-check decision has been written on any of them, so none is locked by priority 29."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
