  - section: state_machines
    instances:
      - name: new_participant_starts_in_draft_state
        claim_type: Initial State
        grounds:
          - state_machines.Participant.initial_state
          - entities.Participant.fields.enrollment_status
        distinguishing_aspect: "The enrollment machine's initial_state is DRAFT, so a freshly created participant is in DRAFT and none of the later states is reachable without its own trigger - in particular a participant supplied with SEND_AND_RECEIVE is still DRAFT and therefore cannot originate anything."
        test_recipe:
          setup:
            - "The database is empty; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
          assert:
            - "Participant.${pa_id}.enrollment_status == DRAFT"
            - "Participant.${pa_id}.attestation_document_reference == null, certification_test_suite_version == null and certification_round == 0"
            - "Participant.${pa_id}.operational_posture == NORMAL (posture is independent of enrollment progress until a suspension or an outage intervenes)"

      - name: rfp_delivery_stamps_deadline_and_advances_state
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RequestForPayment.CREATED_to_DELIVERED
          - endpoints[POST /request-for-payments/{id}/delivery]
          - entities.RequestForPayment.fields.response_deadline_at
          - global_constants.RFP_RESPONSE_SLA_MINUTES
        distinguishing_aspect: "Delivery is not a status-only hop: it stamps delivered_at from the clock and sets response_deadline_at to min(expiry_at, delivered_at + 30 minutes), so with an expiry a day out the deadline is the SLA-derived 13:30 rather than the expiry."
        test_recipe:
          setup:
            - "Alpha National Bank and Beta Trust Bank are both LIVE; Beta owns customer account CUST-BETA-0001 (CORPORATE, baseline 20)."
            - "Alpha raised a request for payment for 5,000,000 cents with expiry_at 2026-08-04T13:00:00Z; it is still CREATED."
            - "The clock is 2026-08-03T13:00:00Z."
