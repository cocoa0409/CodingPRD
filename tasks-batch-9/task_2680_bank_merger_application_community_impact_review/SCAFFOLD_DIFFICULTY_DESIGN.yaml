              payload: { application_id: "${app_id}", designation_type: "CLOSURE", notice_sent_at: "2027-07-01T00:00:00Z", planned_closure_date: "2027-09-30" }
              as: Filer
              as_user_id: "${acq_id}"
          assert:
            - "the first designate call returns HTTP 409 with error_id ERR_CONVERSION_BLACKOUT_CONFLICT and leaves Branch.${br_id}.status == OPEN"
            - "the second designate call returns HTTP 200"
            - "Branch.${br_id}.status == DESIGNATED_FOR_CLOSURE"
            - "Branch.${br_id}.designation_application_id == ${app_id}"
            - "Branch.${br_id}.notice_sent_at == 2027-07-01T00:00:00Z"
            - "Branch.${br_id}.planned_closure_date == 2027-09-30"
            - "Branch.${br_id}.notice_lead_days == 91"
            - "SystemsConversionPlan.${scp_id}.status == DRAFT"
            - "DepositMarket.${mkt_id}.total_deposits_usd == 35000000 (a closure designation stays in the deposit base)"

  - rule_id: compensating_invariant
    instances:
      - name: designate_then_rescind_restores_market_base_and_pre_merger_hhi
        conserved_quantity: "DepositMarket.total_deposits_usd, participant_count and hhi_current, plus the analysis mitigation trio"
        grounds:
          - endpoints[POST /branches/{id}/rescind-designation].side_effects
          - calculations.market_deposit_aggregation
          - calculations.required_divestiture
          - calculations.competitive_posture_rollup
        distinguishing_aspect: |
          The conserved quantity is the concentration state of the Kestrel MSA. Designating Harbor Kestrel
          West drives designated_divestiture_deposits_usd to 40,000,000, hhi_post_mitigated to 5592,
          mitigation_satisfied to true and the posture to CLEARED_WITH_DIVESTITURE; rescinding must undo
          every one of those numbers exactly - back to 0, 5800, false and MITIGATION_REQUIRED - while the
          untouched deposit base 1,000,000,000, participant_count 3 and hhi_current 5400 must be identical
          before and after, proving the designation never removed deposits from the base in the first place.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the Kestrel MSA world with base 1,000,000,000 and hhi_current 5400"
            - "an application with a CompetitiveAnalysis of that market: MITIGATION_REQUIRED, required 39,000,000"
            - "Harbor Kestrel West (40,000,000) designated for divestiture under the application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-markets"
              payload: { market_code: "KESTREL-MSA", market_name: "Kestrel MSA", market_type: "MSA" }
