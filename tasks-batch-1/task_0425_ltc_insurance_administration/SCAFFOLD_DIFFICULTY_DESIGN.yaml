              captures: { pol_v: $.data.version }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", care_plan_id: "${cp_id}", service_month: "2026-04", expected_policy_version: "${pol_v}" }
              as: ClaimsExaminer
