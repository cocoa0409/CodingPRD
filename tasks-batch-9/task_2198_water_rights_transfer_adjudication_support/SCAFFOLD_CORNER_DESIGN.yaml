      - name: rbac_standing_sanction_is_adjudicator_exclusive_and_binds_the_sanctioned_holder
        claim_type: exclusive_operations
        grounds:
          - roles[BasinAdjudicator].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=24]
        distinguishing_aspect: >-
          Standing is the one field a claimant can never touch on itself: the sanction
          endpoint is adjudicator-exclusive, so both the analyst who administers the
          file and the claimant who suffers the sanction are refused with 403, and the
          sanction it writes then bites that claimant's own protest filing.
