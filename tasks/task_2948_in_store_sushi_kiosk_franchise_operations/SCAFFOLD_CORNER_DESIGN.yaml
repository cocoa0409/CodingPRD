          trigger:
            - call: "GET /kiosk-ops/kiosks?license_agreement_id=${la_id}&limit=1&offset=0"
              as: FranchisorOps
              captures: { page1_code: "$.data[0].kiosk_code" }
          assert:
            - "the response status is 200 and response_type is \"array\""
            - "the data array holds exactly 1 element"
            - "total_count == 2 and has_more == true"
            - "limit == 1 and offset == 0 are echoed on the envelope"
            - "GET /kiosk-ops/kiosks?license_agreement_id=${la_id}&limit=1&offset=1 returns 1 element with total_count 2 and has_more false"
            - "GET /kiosk-ops/kiosks?license_agreement_id=${la_id} with no pagination params applies the default limit 10 and offset 0 and returns both kiosks with has_more false"
            - "GET /kiosk-ops/kiosks?limit=0 and GET /kiosk-ops/kiosks?limit=101 both return ERR_INVALID_REQUEST with HTTP 400"
            - "GET /kiosk-ops/kiosks?operational_state=SUSPENDED returns an empty data array with total_count 0"
      - name: fish_lot_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_SOURCING_RECORD_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: |
          A well-formed UUID that names no FishLot row returns ERR_SOURCING_RECORD_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200 object.
        test_recipe:
          setup:
            - "clock at 2026-08-03T11:00:00Z (the mandatory logical clock default is 2026-08-01T00:00:00Z)"
            - "one HostStore 'Northgate Market 418' with pos_integration_status CONNECTED and an attestation of 240 sqft / 20.0 case linear ft, so space_compliance_state is COMPLIANT"
