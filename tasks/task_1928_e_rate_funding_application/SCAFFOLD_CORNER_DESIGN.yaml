        claim_type: constants_applied
        grounds: ["calculations.discount_rate_lookup", "entities.NSLPSnapshot.fields.effective_share_pct"]
        distinguishing_aspect: "CEP multiplier constant 1.6 with cap 100.00: identified_student_pct 70.00 projects 112.00 but is capped to 100.00, landing in the [75,100] band (C1 90 / C2 85 urban)."
        test_recipe:
          setup: ["FY2027; school urban applicant; CEP snapshot identified 70.00"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
