# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Required X-User-ID / X-User-Role headers missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not authorized for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic request payload validation failure (missing required field, type mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in the required state for this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_CYCLE_DETECTED, http: 422, condition: "Relationship would introduce a cycle in the schedule DAG" }
  - { id: ERR_SELF_RELATIONSHIP, http: 422, condition: "predecessor_activity_id == successor_activity_id" }
  - { id: ERR_ACTIVITY_NOT_IN_VERSION, http: 422, condition: "Activity referenced does not belong to the schedule_version in the path" }
  - { id: ERR_INVALID_RELATIONSHIP_TYPE, http: 422, condition: "relationship_type not in {FS,SS,FF,SF}" }
  - { id: ERR_EMPTY_SCHEDULE, http: 422, condition: "Schedule submit requires at least one Activity" }
  - { id: ERR_INVALID_PROGRESS, http: 422, condition: "ProgressEntry invariants violated (actual_finish<actual_start, percent==100 but remaining>0, etc.)" }
  - { id: ERR_SCHEDULE_NOT_ACCEPTED, http: 409, condition: "Operation requires the parent ScheduleVersion to be ACCEPTED" }
  - { id: ERR_BASELINE_ALREADY_ACCEPTED, http: 409, condition: "A different BASELINE is already ACCEPTED for this project" }
  - { id: ERR_BASELINE_NOT_ACCEPTED, http: 409, condition: "Operation requires an ACCEPTED BASELINE on this project" }
  - { id: ERR_TIA_NOT_ACCEPTED, http: 409, condition: "Operation requires DelayEvent.status == TIA_ACCEPTED" }
  - { id: ERR_REQUESTED_DAYS_EXCEED_ENTITLEMENT, http: 422, condition: "EOT requested_days exceeds apportioned compensable + excusable-non-compensable days" }
  - { id: ERR_NON_COMPENSABLE_COST, http: 422, condition: "EOT carries cost_recovery_cents > 0 but linked DelayEvent has zero compensable days" }
  - { id: ERR_APPROVED_DAYS_MISMATCH, http: 422, condition: "Full approval requires approved_days == requested_days" }
  - { id: ERR_INVALID_PARTIAL_DAYS, http: 422, condition: "Partial approval requires 0 < approved_days < requested_days" }
  - { id: ERR_AWARD_MISMATCH, http: 422, condition: "Full approval requires awarded_cost_cents == cost_recovery_cents when compensable" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "EOT appeal cap (submission_round >= 3) reached" }
  - { id: ERR_LD_CAP_EXCEEDED, http: 422, condition: "Assessment would exceed project.ld_cap_cents aggregate" }
  - { id: ERR_NO_CULPABLE_DELAY, http: 422, condition: "LDA culpable_days is zero — nothing to assess" }
  - { id: ERR_REDUCTION_NOT_SMALLER, http: 422, condition: "Reduced LD must be strictly less than currently assessed" }
  - { id: ERR_NOTICE_DATA_INVALID, http: 422, condition: "DelayEvent dates inconsistent with notice evaluation (e.g., event_end before event_start)" }
  - { id: ERR_COST_DATA_MISSING, http: 422, condition: "Required cost fields (actual_cost_cents, measured_mile_cost_cents, recovery_variant) not supplied" }
  - { id: ERR_ACTIVITIES_INCOMPLETE, http: 409, condition: "Substantial completion requires all activities in latest ACCEPTED UPDATE at percent_complete == 100" }
  - { id: ERR_CLAIMS_OPEN, http: 409, condition: "Close requires all EOTs in terminal state" }
  - { id: ERR_ACCELERATION_OPEN, http: 409, condition: "Close requires all acceleration directives in terminal state" }
  - { id: ERR_LD_OPEN, http: 409, condition: "Close requires all LDAs in terminal state" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractorScheduler
    description: "Builds and updates CPM schedules, files notices, TIAs, EOTs; acknowledges acceleration directives"
    identity: opaque
    exclusive_operations:
      - "POST .../schedule-versions — Create schedule version"
      - "POST .../schedule-versions/{vid}/submit"
      - "POST .../schedule-versions/{vid}/revise"
      - "POST .../activities — Add activity"
      - "POST .../relationships — Add relationship"
      - "POST .../progress-updates (and entries) — File progress"
      - "POST .../progress-updates/{puid}/submit"
      - "POST .../progress-updates/{puid}/revise"
      - "POST .../delay-events — Record delay event"
      - "POST .../delay-events/{did}/notice"
      - "POST .../delay-events/{did}/tia/submit"
      - "POST .../delay-events/{did}/resubmit"
      - "POST .../eot-requests — Draft EOT"
      - "POST .../eot-requests/{eid}/submit"
      - "POST .../eot-requests/{eid}/appeal"
      - "POST .../acceleration-directives/{aid}/acknowledge"
      - "POST .../acceleration-directives/{aid}/begin-performance"
      - "POST .../acceleration-directives/{aid}/complete"
      - "POST .../acceleration-directives/{aid}/dispute"
      - "POST .../ld-assessments/{lid}/appeal"
    shared_operations:
      - "All GET endpoints"

  - name: ProjectControlsEngineer
    description: "Reviews and accepts/rejects schedule versions and progress updates; activates projects"
    identity: opaque
    exclusive_operations:
