            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "EAST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842GRD000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-05T00:00:00.000Z", customer_region_code: "EAST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_a: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842GRD000002", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3100000, sale_date: "2026-08-05T00:00:00.000Z", customer_region_code: "EAST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_b: $.data.id }
            - call: "POST /incentives/deliveries/${del_a}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${del_b}/validate"
              payload: {}
