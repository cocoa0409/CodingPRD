      - name: corner_cellar_supervisor_cannot_create_contracts
        claim_type: role_denied_operations
        grounds: ["roles.CellarSupervisor", "roles.FacilityAdmin", "validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /contracts is a FacilityAdmin exclusive operation, so a CellarSupervisor with a perfectly valid body answers ERR_FORBIDDEN_ROLE (403) and stores nothing."
        test_recipe:
          setup: ["One registered Client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "GET /contracts with client_id ${cl1} returns data == [] with total_count == 0"

