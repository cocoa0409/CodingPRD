  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED_RECORDABLE, CLOSED_NOT_RECORDABLE]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /incidents/{id}/begin-investigation"
        actor: SafetyOfficer
        preconditions: ["status == REPORTED (ERR_INCIDENT_INVALID_TRANSITION)"]
        side_effects: ["increments DailyReport.version by 1"]
      - from: REPORTED
        to: OSHA_NOTIFIED
        trigger: "POST /incidents/{id}/notify-osha"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION} (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == true (ERR_OSHA_NOT_APPLICABLE)"
        side_effects: ["osha_notified_at = logical now", "increments DailyReport.version by 1"]
      - from: UNDER_INVESTIGATION
        to: OSHA_NOTIFIED
        trigger: "POST /incidents/{id}/notify-osha"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION} (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == true (ERR_OSHA_NOT_APPLICABLE)"
        side_effects: ["osha_notified_at = logical now", "increments DailyReport.version by 1"]
      - from: REPORTED
        to: CLOSED_NOT_RECORDABLE
        trigger: "POST /incidents/{id}/close (outcome=NOT_RECORDABLE)"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION} for outcome=NOT_RECORDABLE (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == false (ERR_INCIDENT_RECORDABLE_MISMATCH)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE L1: report.has_open_incident recomputes; if this was the last open incident it flips to false"
          - "CASCADE L2: distribution_hold follows has_open_incident to false"
          - "CASCADE L3: every BLOCKED DistributionRecord on the report flips back to PENDING"
          - "increments DailyReport.version by 1"
      - from: UNDER_INVESTIGATION
        to: CLOSED_NOT_RECORDABLE
        trigger: "POST /incidents/{id}/close (outcome=NOT_RECORDABLE)"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION} for outcome=NOT_RECORDABLE (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == false (ERR_INCIDENT_RECORDABLE_MISMATCH)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE L1: report.has_open_incident recomputes; if this was the last open incident it flips to false"
          - "CASCADE L2: distribution_hold follows has_open_incident to false"
          - "CASCADE L3: every BLOCKED DistributionRecord on the report flips back to PENDING"
          - "increments DailyReport.version by 1"
      - from: REPORTED
        to: CLOSED_RECORDABLE
        trigger: "POST /incidents/{id}/close (outcome=RECORDABLE)"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION, OSHA_NOTIFIED} for outcome=RECORDABLE (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == true (ERR_INCIDENT_RECORDABLE_MISMATCH)"
          - "osha_notification_deadline == null OR osha_notified_at != null (ERR_OSHA_NOTIFICATION_REQUIRED)"
          - "at least one ACTIVE MediaAttachment with linked_incident_id == this incident (ERR_INCIDENT_MEDIA_REQUIRED)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE L1: report.has_open_incident recomputes; if this was the last open incident it flips to false"
          - "CASCADE L2: distribution_hold follows has_open_incident"
          - "CASCADE L3: every BLOCKED DistributionRecord on the report flips back to PENDING"
          - "CASCADE L4: retention_class stays CLAIMS_HOLD (sticky); retention_release_date remains null even after hold clears"
          - "increments DailyReport.version by 1"
      - from: UNDER_INVESTIGATION
        to: CLOSED_RECORDABLE
        trigger: "POST /incidents/{id}/close (outcome=RECORDABLE)"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION, OSHA_NOTIFIED} for outcome=RECORDABLE (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == true (ERR_INCIDENT_RECORDABLE_MISMATCH)"
          - "osha_notification_deadline == null OR osha_notified_at != null (ERR_OSHA_NOTIFICATION_REQUIRED)"
          - "at least one ACTIVE MediaAttachment with linked_incident_id == this incident (ERR_INCIDENT_MEDIA_REQUIRED)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE L1: report.has_open_incident recomputes; if this was the last open incident it flips to false"
          - "CASCADE L2: distribution_hold follows has_open_incident"
          - "CASCADE L3: every BLOCKED DistributionRecord on the report flips back to PENDING"
          - "CASCADE L4: retention_class stays CLAIMS_HOLD (sticky); retention_release_date remains null even after hold clears"
          - "increments DailyReport.version by 1"
      - from: OSHA_NOTIFIED
        to: CLOSED_RECORDABLE
        trigger: "POST /incidents/{id}/close (outcome=RECORDABLE)"
        actor: SafetyOfficer
        preconditions:
          - "status in {REPORTED, UNDER_INVESTIGATION, OSHA_NOTIFIED} for outcome=RECORDABLE (ERR_INCIDENT_INVALID_TRANSITION)"
          - "recordable == true (ERR_INCIDENT_RECORDABLE_MISMATCH)"
          - "osha_notification_deadline == null OR osha_notified_at != null (ERR_OSHA_NOTIFICATION_REQUIRED)"
          - "at least one ACTIVE MediaAttachment with linked_incident_id == this incident (ERR_INCIDENT_MEDIA_REQUIRED)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE L1: report.has_open_incident recomputes; if this was the last open incident it flips to false"
          - "CASCADE L2: distribution_hold follows has_open_incident"
          - "CASCADE L3: every BLOCKED DistributionRecord on the report flips back to PENDING"
          - "CASCADE L4: retention_class stays CLAIMS_HOLD (sticky); retention_release_date remains null even after hold clears"
          - "increments DailyReport.version by 1"

  - entity: MaterialDelivery
    initial_state: DELIVERED
    terminal_states: [INSPECTED]
    transitions:
      - from: DELIVERED
        to: INSPECTED
        trigger: "POST /deliveries/{id}/inspect"
        actor: Superintendent
        preconditions:
          - "status in {DELIVERED, PARTIAL} (ERR_DELIVERY_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
          - "accepted_qty >= 0 AND rejected_qty >= 0 AND accepted_qty + rejected_qty <= pending_recount_qty (ERR_INSPECTION_QTY_OVERFLOW)"
          - "this transition fires only when accepted_qty + rejected_qty == pending_recount_qty (zero remainder); otherwise lands in PARTIAL"
        side_effects:
          - "accepted_qty += input.accepted_qty; rejected_qty += input.rejected_qty; pending_recount_qty -= (input.accepted_qty + input.rejected_qty) -> reaches 0"
          - "partition invariant held: accepted + rejected + pending_recount == delivered_qty"
          - "increments DailyReport.version by 1"
      - from: DELIVERED
        to: PARTIAL
        trigger: "POST /deliveries/{id}/inspect"
        actor: Superintendent
        preconditions:
          - "status in {DELIVERED, PARTIAL} (ERR_DELIVERY_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
          - "accepted_qty >= 0 AND rejected_qty >= 0 AND accepted_qty + rejected_qty <= pending_recount_qty (ERR_INSPECTION_QTY_OVERFLOW)"
          - "this transition fires only when accepted_qty + rejected_qty < pending_recount_qty"
        side_effects:
          - "accepted_qty += input.accepted_qty; rejected_qty += input.rejected_qty; pending_recount_qty -= (accepted + rejected of input)"
          - "partition invariant held"
          - "increments DailyReport.version by 1"
      - from: PARTIAL
        to: INSPECTED
        trigger: "POST /deliveries/{id}/inspect (additional partial inspection reaching zero remainder) OR POST /deliveries/{id}/resolve-recount"
        actor: Superintendent
        preconditions:
          - "status == PARTIAL (ERR_DELIVERY_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
          - "resolve-recount: recount_accepted_qty >= 0 AND recount_accepted_qty <= pending_recount_qty (ERR_INSPECTION_QTY_OVERFLOW)"
        side_effects:
          - "resolve-recount: accepted_qty += recount_accepted_qty; rejected_qty += (pending_recount_qty - recount_accepted_qty); pending_recount_qty = 0"
          - "partition invariant held"
          - "increments DailyReport.version by 1"

  - entity: TmTicket
    initial_state: DRAFT
    terminal_states: [APPROVED, VOID]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURES
        trigger: "POST /tm-tickets/{id}/submit-for-signature"
        actor: Superintendent
        preconditions:
          - "status == DRAFT (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
          - "total_cents > 0 (ERR_TICKET_EMPTY)"
        side_effects: ["increments DailyReport.version by 1"]
      - from: PENDING_SIGNATURES
        to: PARTIALLY_SIGNED
        trigger: "POST /tm-tickets/{id}/sign (signer_role=CONTRACTOR)"
        actor: ContractorRep
        preconditions:
          - "status in {PENDING_SIGNATURES, PARTIALLY_SIGNED} for any signature (ERR_TICKET_INVALID_TRANSITION)"
          - "signer_role must match caller role: CONTRACTOR <- ContractorRep, OWNER <- OwnerRep (mismatch -> ERR_FORBIDDEN)"
          - "order rule: signer_role=OWNER while contractor_signed_by is null -> ERR_SIGNATURE_ORDER (priority 8.1)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["contractor_signed_by = X-User-ID"]
      - from: PARTIALLY_SIGNED
        to: FULLY_SIGNED
        trigger: "POST /tm-tickets/{id}/sign (signer_role=OWNER)"
        actor: OwnerRep
        preconditions:
          - "status in {PENDING_SIGNATURES, PARTIALLY_SIGNED} for any signature (ERR_TICKET_INVALID_TRANSITION)"
          - "signer_role must match caller role (mismatch -> ERR_FORBIDDEN)"
          - "order rule: signer_role=OWNER is only effective once contractor_signed_by is set; from PENDING_SIGNATURES it fails with ERR_SIGNATURE_ORDER"
          - "X-User-ID != created_by_user_id AND X-User-ID != contractor_signed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["owner_signed_by = X-User-ID"]
      - from: FULLY_SIGNED
        to: APPROVED
        trigger: "POST /tm-tickets/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "status == FULLY_SIGNED (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.status not in {DRAFT, REVISION_REQUESTED} (ERR_TICKET_REPORT_NOT_SUBMITTED)"
          - "if authorized_ceiling_cents set: total_cents <= authorized_ceiling_cents, equality passes (ERR_TM_CEILING_EXCEEDED)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: FULLY_SIGNED
        to: REJECTED
        trigger: "POST /tm-tickets/{id}/reject"
        actor: ProjectManager
        preconditions: ["status == FULLY_SIGNED (ERR_TICKET_INVALID_TRANSITION)"]
        side_effects: ["reject_reason set"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /tm-tickets/{id}/revise (revision cycle)"
        actor: Superintendent
        preconditions:
          - "status == REJECTED (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
        side_effects: ["revision_count += 1", "contractor_signed_by = null; owner_signed_by = null"]
      - from: DRAFT
        to: VOID
        trigger: "POST /tm-tickets/{id}/void"
        actor: Superintendent
        preconditions:
          - "status in {DRAFT, PENDING_SIGNATURES, PARTIALLY_SIGNED, REJECTED} (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
        side_effects: ["increments DailyReport.version by 1"]
      - from: PENDING_SIGNATURES
        to: VOID
        trigger: "POST /tm-tickets/{id}/void"
        actor: Superintendent
        preconditions:
          - "status in {DRAFT, PENDING_SIGNATURES, PARTIALLY_SIGNED, REJECTED} (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
        side_effects: []
      - from: PARTIALLY_SIGNED
        to: VOID
        trigger: "POST /tm-tickets/{id}/void"
        actor: Superintendent
        preconditions:
          - "status in {DRAFT, PENDING_SIGNATURES, PARTIALLY_SIGNED, REJECTED} (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
        side_effects: []
      - from: REJECTED
        to: VOID
        trigger: "POST /tm-tickets/{id}/void"
        actor: Superintendent
        preconditions:
          - "status in {DRAFT, PENDING_SIGNATURES, PARTIALLY_SIGNED, REJECTED} (ERR_TICKET_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
        side_effects: []

  - entity: MediaAttachment
    initial_state: ACTIVE
    terminal_states: [PURGED]
    transitions:
      - from: ACTIVE
        to: PURGED
        trigger: "POST /media-attachments/{id}/purge"
        actor: Superintendent | SafetyOfficer
        preconditions:
          - "status == ACTIVE (ERR_MEDIA_INVALID_TRANSITION)"
          - "parent DailyReport.content_posture == EDITABLE (ERR_REPORT_NOT_EDITABLE)"
          - "linked_incident_id is null (ERR_MEDIA_LINKED_TO_INCIDENT)"
        side_effects:
          - "if referenced by an OPEN/MITIGATED SafetyObservation.media_attachment_id, that observation's reference is cleared to null"
          - "increments DailyReport.version by 1"

  - entity: DistributionRecord
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /distribution-records/{id}/send"
        actor: SystemAdmin
        preconditions:
          - "status == PENDING (ERR_DISTRIBUTION_INVALID_TRANSITION)"
          - "parent DailyReport.distribution_hold == false at send time (ERR_DISTRIBUTION_HOLD)"
        side_effects:
          - "sent_at = logical now"
          - "report.retention_release_date recomputes (calc_retention_release)"
          - "increments DailyReport.version by 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /distribution-records/{id}/acknowledge"
        actor: OwnerRep
        preconditions: ["status == SENT (ERR_DISTRIBUTION_INVALID_TRANSITION)"]
        side_effects: ["acknowledged_at = logical now"]
      - from: PENDING
        to: BLOCKED
        trigger: "system (report distribution_hold flips to true on incident create/escalate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: PENDING
        trigger: "system (report distribution_hold flips to false when last open incident closes)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: report-header-stale-edit
    parent_entity: DailyReport
    write_endpoint: "PUT /daily-reports/{id}"
    occ_field: "expected_report_version"
    description: |
      Editing a DailyReport header with an expected_report_version older than the
      report's current version is rejected: any child-entry write or transition in
      between has legitimately advanced the aggregate version, so the editor's view
      is stale and must be refreshed before re-applying the edit.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quantity-entry-supersede-stale-report
    parent_entity: DailyReport
    write_endpoint: "POST /quantity-entries"
    occ_field: "expected_report_version"
    description: |
      Creating a QuantityEntry against a report whose version has advanced since the
      client last observed it is rejected. The create legitimately supersedes (voids)
      any prior ACTIVE entry for the same (report, work_item, work_area) triple, so a
      writer working from a stale report snapshot must not silently void entries it
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tm-ticket-revise-stale-ticket
    parent_entity: TmTicket
    write_endpoint: "PUT /tm-tickets/{id}"
    occ_field: "expected_ticket_version"
    description: |
      Editing a DRAFT TmTicket's lines with an expected_ticket_version older than the
      ticket's current version is rejected: a prior edit has already repriced the
      ticket, so the stale writer's total/ceiling assumptions no longer hold.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_manpower_split
    trigger: "CrewEntry create / void; report read"
    algorithm: threshold
    formula: |
      Per ACTIVE CrewEntry, band boundaries are exact:
        reg_per_worker  = min(hours_per_worker, 8)
        ot_per_worker   = min(max(hours_per_worker - 8, 0), 4)
        dt_per_worker   = max(hours_per_worker - 12, 0)
      Boundary pins: hours_per_worker == 8.0 -> ot = 0 (OT starts strictly above 8);
      hours_per_worker == 12.0 -> ot = 4, dt = 0 (DT starts strictly above 12).
      Entry bands = worker_count * band_per_worker.
      Report totals: manhours_regular/ot/dt = SUM of entry bands over ACTIVE rows only;
      total_workers = SUM(worker_count) over ACTIVE rows only. VOIDED rows excluded.
    input_set: "CrewEntry rows with status == ACTIVE on the report"
    constants:
      OT_FLOOR_HOURS: 8
      DT_FLOOR_HOURS: 12
      OT_BAND_WIDTH: 4
    precision: "2 decimal places, round_half_up"

  - name: calc_lost_hours
    trigger: "DelayEvent classify (RECORDED->CLASSIFIED or DISPUTED->CLASSIFIED)"
    algorithm: interval_merge
    formula: |
      shift_start = report.shift_start_actual if set else (report_date T project.scheduled_shift_start Z)
      shift_window = [shift_start, shift_start + project.scheduled_shift_hours)   # half-open
      lost_hours = length( [start_at, end_at) INTERSECT shift_window ) in hours, 2dp round_half_up
      A window entirely outside the shift yields 0.00; adjacency contributes 0.
    input_set: "the DelayEvent being classified, its parent report, and the report's project"
    precision: "2 decimal places, round_half_up"

  - name: calc_lost_day_classification
    trigger: "DelayEvent classify / dispute / re-classify; report read"
    algorithm: threshold
    formula: |
      weather_lost_hours = SUM(lost_hours) over DelayEvent rows of the report where
        cause == WEATHER AND status IN {CLASSIFIED, FINAL}
        AND classification IN {EXCUSABLE_COMPENSABLE, EXCUSABLE_NON_COMPENSABLE}
      (DISPUTED and RECORDED rows are excluded from the input set.)
    input_set: "DelayEvent rows on the report with cause == WEATHER, status in {CLASSIFIED, FINAL}, classification excusable"
    constants:
      LOST_DAY_THRESHOLD_RATIO: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: calendar_day
        when: "claims calendar view (DailyReport.weather_lost_day_calendar)"
        difference: "boolean: weather_lost_hours >= 0.5 * scheduled_shift_hours; at exactly half the shift the day IS lost (>= boundary)"
      - name: prorated_hours
        when: "schedule-fragnet view (DailyReport.weather_lost_day_fraction)"
        difference: "number: min(weather_lost_hours / scheduled_shift_hours, 1.0), 2dp; same input set, different output type and value"

  - name: calc_progress_percent
    trigger: "DailyReport approve / reopen (after rollup); GET /projects/{id}/progress-summary"
    algorithm: aggregation
    formula: |
      Per WorkItem i: pct_units_i = min(installed_to_date_i, budgeted_quantity_i) / budgeted_quantity_i
      Project units_based_pct   = MEAN(pct_units_i) over all WorkItems of the project (0 when none), * 100, 2dp
      Project cost_weighted_pct = SUM(installed_to_date_i * unit_cost_cents_i) / SUM(budgeted_quantity_i * unit_cost_cents_i) * 100, 2dp;
                                  UNCAPPED (over-install inflates); 0 when denominator == 0.
    input_set: "all WorkItem rows of the project, any status"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: units_based
        when: "percent_complete_units"
        difference: "unweighted mean of per-item CAPPED percents; a cheap over-installed item cannot exceed 100% and weighs the same as an expensive item"
      - name: cost_weighted
        when: "percent_complete_cost"
        difference: "cost-weighted, UNCAPPED; identical rollup data produces a different percent whenever item unit costs differ or any item is over-installed"

  - name: calc_quantity_rollup
    trigger: "QuantityEntry write (round at write); DailyReport approve / reopen (sum)"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER PINNED: at write time, rounded_quantity = round_half_up(quantity_installed, 3).
      Rollup NEVER rounds the sum: WorkItem.installed_to_date = SUM(rounded_quantity) over
      QuantityEntry rows with status == ACTIVE whose report.status IN {APPROVED, LOCKED}
      (approve adds this report's rows; reopen subtracts exactly the same rounded values).
      Per-entry-round-then-sum vs sum-then-round diverge; the scaffold pins round-then-sum.
      Example: two entries 1.2344 each -> stored 1.234 + 1.234 -> installed_to_date 2.468
      (sum-then-round would give 2.469).
    input_set: "QuantityEntry rows with status == ACTIVE on reports in {APPROVED, LOCKED} for the WorkItem"
    precision: "3 decimal places per entry, round_half_up; sums are exact over stored values"

  - name: calc_tm_ticket_total
    trigger: "TmTicket create / PUT (line replacement)"
    algorithm: tiered_pricing
    formula: |
      ROUNDING ORDER PINNED: every line is rounded to integer cents (round_half_up) BEFORE summing.
      labor line cost  = round(worker_count * (regular_hours * rate + ot_hours * rate * OT_MULT + dt_hours * rate * DT_MULT))
      equipment line   = round(hours * rate * (STANDBY_MULT if line.standby AND parent report has >= 1 WeatherObservation
                         with work_impact == STOPPAGE else 1))   # cross-entity conditional branch
      materials        = calc_material_markup(material_lines)     # tier keyed on pre-markup subtotal
      labor_cost_cents = SUM(labor line costs);  equipment_cost_cents = SUM(equipment line costs)
      total_cents = labor_cost_cents + equipment_cost_cents + materials_cost_cents
      Approval gate (separate from pricing): total_cents <= authorized_ceiling_cents when ceiling set.
    input_set: "the ticket's three line arrays + parent report's WeatherObservation rows (any impact)"
    constants:
      OT_MULT: 1.5
      DT_MULT: 2.0
      STANDBY_MULT: 0.5
    precision: "integer cents, round_half_up per line, then exact integer sum"

  - name: calc_material_markup
    trigger: "inside calc_tm_ticket_total whenever material_lines present"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency):
        (1) materials_subtotal_cents = SUM over lines of round(quantity * unit_price_cents)
        (2) tier is selected from the PRE-MARKUP subtotal only:
            subtotal <= TIER_CAP_CENTS -> MARKUP_LOW_PCT ; subtotal > TIER_CAP_CENTS -> MARKUP_HIGH_PCT
        (3) materials_markup_cents = round_half_up(materials_subtotal_cents * tier_pct)
        (4) materials_cost_cents = materials_subtotal_cents + materials_markup_cents
      The markup feeds the ticket total, and the tier depends on the subtotal that the markup
      itself inflates; selecting the tier from the POST-markup amount is a DIFFERENT, wrong
      algorithm (e.g. subtotal 95,000 -> post 104,500 would cross the cap and mis-tier).
      Boundary: subtotal == TIER_CAP_CENTS exactly -> LOW tier (<= semantics).
    input_set: "TmTicket.material_lines"
    constants:
      TIER_CAP_CENTS: 100000
      MARKUP_LOW_PCT: 0.10
      MARKUP_HIGH_PCT: 0.05
    precision: "integer cents, round_half_up at each rounding step"

  - name: calc_report_posture
    trigger: "report status transitions; Incident create/close; SafetyObservation escalate"
    algorithm: aggregation
    formula: |
      content_posture    = EDITABLE if status IN {DRAFT, REVISION_REQUESTED} else SEALED
      has_open_incident  = EXISTS Incident on report with status NOT IN {CLOSED_RECORDABLE, CLOSED_NOT_RECORDABLE}
      distribution_hold  = has_open_incident
      retention_class    = CLAIMS_HOLD if EXISTS Incident on report with recordable == true (any status,
                           sticky forever) else STANDARD
    input_set: "Incident rows linked to the report"
    precision: "boolean/enum derivation, no rounding"

  - name: calc_osha_deadline
    trigger: "Incident create; every read of Incident; clock set"
    algorithm: threshold
    formula: |
      osha_notification_deadline = occurred_at + 8h  if severity == FATALITY
                                 = occurred_at + 24h if severity == LOST_TIME
                                 = null            otherwise
      notification_overdue = recordable AND deadline IS NOT NULL AND osha_notified_at IS NULL
                             AND logical_now > deadline     # strictly greater: AT the deadline => NOT overdue
    input_set: "the Incident row and the logical clock"
    constants:
      FATALITY_NOTIFY_HOURS: 8
      LOST_TIME_NOTIFY_HOURS: 24
    precision: "instant comparison, no rounding"

  - name: calc_retention_release
    trigger: "DistributionRecord send; incident create/close (retention_class change); report lock"
    algorithm: aggregation
    formula: |
      if retention_class == CLAIMS_HOLD: retention_release_date = null
      else if no DistributionRecord on the report has status IN {SENT, ACKNOWLEDGED}: null
      else retention_release_date = max(sent_at over records with status IN {SENT, ACKNOWLEDGED})
                                    + project.retention_days (days)
    input_set: "DistributionRecord rows of the report with status in {SENT, ACKNOWLEDGED}"
    precision: "datetime arithmetic, no rounding"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: "ERR_NOT_FOUND / ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: business_constraint, check: "Request shape: required fields present, types match, enum members valid, numeric ranges honored (worker_count >= 1, hours_per_worker in [0,24], delivered_qty > 0, quantity_installed > 0, budgeted_quantity > 0, unit_cost_cents >= 0, buffer_minutes >= 0, injured_count/days_away >= 0)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 5, category: existence, check: "Body-referenced FK ids resolve to existing rows (report_id, work_area_id, work_item_id, delivery_zone_id, media_attachment_id, linked_incident_id, linked_delivery_id, safety_observation_id)", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "create endpoints with body FKs" }
  - { priority: 6, category: state, check: "Target resource state machine 'from' state holds for the requested transition", error_id: "ERR_<RESOURCE>_INVALID_TRANSITION", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6.1, category: state, check: "Parent DailyReport.content_posture == EDITABLE for child create/void/purge/inspect/ticket-create (carve-out: POST /incidents allowed unless report LOCKED)", error_id: ERR_REPORT_NOT_EDITABLE, http_status: 409, applies_to: "POST /crew-entries, /equipment-entries, /weather-observations, /delay-events, /safety-observations, /media-attachments, /deliveries, /quantity-entries, /tm-tickets, void/purge/inspect/resolve-recount endpoints, PUT /daily-reports/{id}, PUT /tm-tickets/{id}" }
  - { priority: 6.2, category: state, check: "Incident-specific report gate: report.status != LOCKED", error_id: ERR_INCIDENT_ON_LOCKED_REPORT, http_status: 409, applies_to: "POST /incidents, POST /safety-observations/{id}/escalate" }
  - { priority: 6.5, category: state, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /daily-reports/{id}, POST /quantity-entries, PUT /tm-tickets/{id}" }
  - { priority: 7, category: business_safety, check: "SafetyObservation with risk_level == HIGH must carry media_attachment_id", error_id: ERR_HIGH_RISK_OBSERVATION_REQUIRES_MEDIA, http_status: 422, applies_to: "POST /safety-observations" }
  - { priority: 7.1, category: business_safety, check: "Incident with severity in {MEDICAL_TREATMENT, LOST_TIME, FATALITY} must carry narrative of >= 50 chars", error_id: ERR_INCIDENT_NARRATIVE_REQUIRED, http_status: 422, applies_to: "POST /incidents" }
  - { priority: 7.2, category: business_safety, check: "Incident close with outcome=RECORDABLE requires >= 1 ACTIVE MediaAttachment linked to the incident", error_id: ERR_INCIDENT_MEDIA_REQUIRED, http_status: 409, applies_to: "POST /incidents/{id}/close" }
  - { priority: 7.3, category: business_safety, check: "Incident close with outcome=RECORDABLE requires OSHA notification when a deadline exists", error_id: ERR_OSHA_NOTIFICATION_REQUIRED, http_status: 409, applies_to: "POST /incidents/{id}/close" }
  - { priority: 7.4, category: business_safety, check: "close outcome must match computed recordability (RECORDABLE requires recordable == true; NOT_RECORDABLE requires recordable == false)", error_id: ERR_INCIDENT_RECORDABLE_MISMATCH, http_status: 422, applies_to: "POST /incidents/{id}/close" }
  - { priority: 7.5, category: business_safety, check: "notify-osha only for recordable incidents", error_id: ERR_OSHA_NOT_APPLICABLE, http_status: 409, applies_to: "POST /incidents/{id}/notify-osha" }
  - { priority: 8, category: business_constraint, check: "Segregation of duties: approve vs submit, sign vs create, verify-close vs create, close vs create, recall-by-submitter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /daily-reports/{id}/approve, /recall; POST /tm-tickets/{id}/sign, /approve; POST /safety-observations/{id}/verify-close; POST /incidents/{id}/close" }
  - { priority: 8.1, category: business_constraint, check: "Signature order: owner cannot sign before contractor", error_id: ERR_SIGNATURE_ORDER, http_status: 409, applies_to: "POST /tm-tickets/{id}/sign" }
  - { priority: 8.2, category: business_constraint, check: "Uniqueness: Project.contract_number global; WorkArea.code, DeliveryZone.zone_code, WorkItem.cost_code per project; (project_id, report_date) for DailyReport; (report_id, recipient_email) for DistributionRecord", error_id: "ERR_DUPLICATE_CONTRACT_NUMBER | ERR_DUPLICATE_WORK_AREA_CODE | ERR_DUPLICATE_ZONE_CODE | ERR_DUPLICATE_COST_CODE | ERR_DUPLICATE_REPORT_DATE | ERR_DUPLICATE_RECIPIENT", http_status: 409, applies_to: "create endpoints for those entities" }
  - { priority: 8.3, category: business_constraint, check: "EquipmentEntry capacity: hours_used + hours_idle <= 24 * unit_count (equality allowed)", error_id: ERR_EQUIPMENT_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /equipment-entries" }
  - { priority: 8.4, category: business_constraint, check: "MediaAttachment: at most one of linked_incident_id / linked_delivery_id set; gps_lat and gps_lng supplied together or neither", error_id: "ERR_MEDIA_LINK_CONSTRAINT | ERR_GPS_INCOMPLETE_PAIR", http_status: 422, applies_to: "POST /media-attachments" }
  - { priority: 8.5, category: business_constraint, check: "Idempotency: idempotency_key reused with identical body returns original; reused with different body conflicts (scope: endpoint path + X-User-ID)", error_id: ERR_IDEMPOTENCY_CONFLICT, http_status: 409, applies_to: "POST /incidents, POST /tm-tickets, POST /media-attachments" }
  - { priority: 8.6, category: business_constraint, check: "T&M submit-for-signature requires total_cents > 0", error_id: ERR_TICKET_EMPTY, http_status: 422, applies_to: "POST /tm-tickets/{id}/submit-for-signature" }
  - { priority: 8.7, category: business_constraint, check: "Inspection quantities non-negative and not exceeding pending_recount_qty", error_id: ERR_INSPECTION_QTY_OVERFLOW, http_status: 422, applies_to: "POST /deliveries/{id}/inspect, POST /deliveries/{id}/resolve-recount" }
  - { priority: 8.8, category: business_constraint, check: "Media purge forbidden while linked to an incident", error_id: ERR_MEDIA_LINKED_TO_INCIDENT, http_status: 409, applies_to: "POST /media-attachments/{id}/purge" }
  - { priority: 9, category: business_temporal, check: "report_date not after logical current date at submit", error_id: ERR_REPORT_DATE_FUTURE, http_status: 422, applies_to: "POST /daily-reports/{id}/submit" }
  - { priority: 9.1, category: business_temporal, check: "WeatherObservation.observed_at within report_date [00:00:00Z, +24h)", error_id: ERR_WEATHER_OUTSIDE_REPORT_DATE, http_status: 422, applies_to: "POST /weather-observations" }
  - { priority: 9.2, category: business_temporal, check: "MediaAttachment.captured_at within report_date [00:00:00Z, +24h)", error_id: ERR_MEDIA_CAPTURED_OUTSIDE_REPORT_DATE, http_status: 422, applies_to: "POST /media-attachments" }
  - { priority: 9.3, category: business_temporal, check: "Incident.occurred_at <= logical now", error_id: ERR_INCIDENT_OCCURRED_IN_FUTURE, http_status: 422, applies_to: "POST /incidents" }
  - { priority: 9.4, category: business_temporal, check: "DelayEvent end_at strictly after start_at; delivery window end strictly after start", error_id: "ERR_DELAY_WINDOW_INVALID | ERR_INVALID_WINDOW", http_status: 422, applies_to: "POST /delay-events, POST /deliveries" }
  - { priority: 9.5, category: business_temporal, check: "DelayEvent EXCUSABLE_COMPENSABLE half-open overlap prohibition per work_area (adjacency allowed)", error_id: ERR_DELAY_OVERLAP_COMPENSABLE, http_status: 409, applies_to: "POST /delay-events/{id}/classify" }
  - { priority: 9.6, category: business_temporal, check: "Delivery scheduled windows in same zone must be separated by >= buffer_minutes on both sides (closed intervals + buffer; touching without buffer is a collision)", error_id: ERR_DELIVERY_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /deliveries" }
  - { priority: 10, category: business_referential, check: "Referenced WorkArea.status == OPEN for new child entries", error_id: ERR_WORK_AREA_CLOSED, http_status: 409, applies_to: "POST /crew-entries, /equipment-entries, /delay-events, /safety-observations, /media-attachments, /quantity-entries, /incidents" }
  - { priority: 10.1, category: business_referential, check: "Referenced DeliveryZone.status == OPEN for new deliveries", error_id: ERR_DELIVERY_ZONE_CLOSED, http_status: 409, applies_to: "POST /deliveries" }
  - { priority: 10.2, category: business_referential, check: "Referenced media/incident/delivery/observation belong to the SAME report as the referencing row", error_id: ERR_MEDIA_REPORT_MISMATCH, http_status: 422, applies_to: "POST /safety-observations, POST /media-attachments" }
  - { priority: 10.3, category: business_referential, check: "DailyReport submit gates: >= 1 WeatherObservation; crew/no_work_performed exactly-one; all deliveries INSPECTED; no RECORDED delay events", error_id: "ERR_WEATHER_MISSING | ERR_NO_WORK_RECORDED | ERR_WORK_ENTRIES_CONFLICT | ERR_DELIVERY_NOT_INSPECTED | ERR_DELAY_EVENT_UNCLASSIFIED", http_status: 409, applies_to: "POST /daily-reports/{id}/submit" }
  - { priority: 10.4, category: business_referential, check: "Distribution create requires report.status in {APPROVED, LOCKED}; send requires distribution_hold == false", error_id: "ERR_REPORT_NOT_APPROVED | ERR_DISTRIBUTION_HOLD", http_status: 409, applies_to: "POST /distribution-records, POST /distribution-records/{id}/send" }
  - { priority: 10.5, category: business_referential, check: "DelayEvent finalize requires report.status in {SUBMITTED, UNDER_REVIEW, APPROVED}; classify forbidden when report APPROVED/LOCKED", error_id: "ERR_DELAY_FINALIZE_REQUIRES_SUBMITTED_REPORT | ERR_DELAY_LOCKED_REPORT", http_status: 409, applies_to: "POST /delay-events/{id}/finalize, POST /delay-events/{id}/classify" }
  - { priority: 10.6, category: business_referential, check: "Project close requires all reports LOCKED; report submit requires Project.status == ACTIVE", error_id: "ERR_PROJECT_HAS_OPEN_REPORTS | ERR_PROJECT_NOT_ACTIVE", http_status: 409, applies_to: "POST /projects/{id}/close, POST /daily-reports/{id}/submit" }
  - { priority: 10.7, category: business_referential, check: "T&M approve requires report.status not in {DRAFT, REVISION_REQUESTED}", error_id: ERR_TICKET_REPORT_NOT_SUBMITTED, http_status: 409, applies_to: "POST /tm-tickets/{id}/approve" }
  - { priority: 10.8, category: business_referential, check: "Distribution delete allowed only from PENDING or BLOCKED (SENT/ACKNOWLEDGED retained for claims)", error_id: ERR_DISTRIBUTION_ALREADY_SENT, http_status: 409, applies_to: "DELETE /distribution-records/{id}" }
  - { priority: 11, category: business_fiscal, check: "T&M approve: total_cents <= authorized_ceiling_cents when set (equality passes)", error_id: ERR_TM_CEILING_EXCEEDED, http_status: 422, applies_to: "POST /tm-tickets/{id}/approve" }

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (flat topology)
# =============================================================================
x_all_roles: &ALL_ROLES [SystemAdmin, Superintendent, ProjectManager, SafetyOfficer, ContractorRep, OwnerRep]

endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Setting recomputes time-derived flags (notification_overdue).", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["recompute Incident.notification_overdue for all open incidents"] }

  # --- Project ---
  - { method: POST, path: "/projects", description: "Create project", roles: [SystemAdmin], code: 201, input: [name, contract_number, "scheduled_shift_start?", "scheduled_shift_hours?", "retention_days?"], output: Project, side_effects: ["status = MOBILIZING"] }
  - { method: GET, path: "/projects/{id}", description: "Get project", roles: *ALL_ROLES, code: 200, input: [], output: Project, side_effects: [] }
  - { method: GET, path: "/projects", description: "List projects", roles: *ALL_ROLES, code: 200, input: ["status?", "limit?", "offset?"], output: "Project[]", side_effects: [] }
  - { method: POST, path: "/projects/{id}/activate", description: "MOBILIZING -> ACTIVE", roles: [SystemAdmin], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }
