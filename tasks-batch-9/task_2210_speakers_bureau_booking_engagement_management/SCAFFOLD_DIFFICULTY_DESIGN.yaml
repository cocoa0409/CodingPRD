  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_proposal_revision_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.Proposal.PRESENTED_to_REVISION_REQUESTED
          - state_machines.Proposal.REVISION_REQUESTED_to_PRESENTED
          - entities.Proposal.fields.round_no
          - entities.Proposal.fields.revision_count
          - validations[priority=16]
        distinguishing_aspect: |
          A true cycle: the proposal re-enters PRESENTED it has already occupied, twice, and
          the loop counter round_no reaches 3 while revision_count reaches its cap of 2 —
          the loop is bounded on the revision leg, not on the presentation leg.
        test_recipe:
          setup:
            - "Proposal PRESENTED with one OFFERED option and valid_until_utc 2026-09-20T00:00:00Z"
            - "Logical clock at the 2026-08-01T00:00:00Z default, well before expiry"
