          assert:
            - "the response status is 422 and err_desc == ERR_DESCRIPTION_INCOMPLETE"
            - "Collection.${col_c2}.processing_status remains PROCESSING"

      - name: adjudicate_twice_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_FOIA_ALREADY_ADJUDICATED
          - state_machines.FoiaRequest
        distinguishing_aspect: "Adjudication is only valid from RECEIVED or IN_REVIEW: a second adjudicate on a GRANTED request is 409 ERR_FOIA_ALREADY_ADJUDICATED and the original decision stands."
        test_recipe:
