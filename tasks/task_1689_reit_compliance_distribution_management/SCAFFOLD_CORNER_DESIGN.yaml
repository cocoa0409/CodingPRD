              as: ComplianceOfficer
              captures: { r_status: $.data.status }
          assert:
            - "qualifying_75_pct == 0.0 and qualifying_95_pct == 0.0"
            - "status == BREACHED; Reit.status == SUSPENDED"

      - name: trs_concentration_exactly_20_passes_and_20_0001_breaches
        claim_type: boundary_edge
        grounds: [calculations.calc_trs_concentration]
        distinguishing_aspect: "TRS limit is inclusive at 20.0000: a reit with exactly 20% TRS-held value locks LOCKED; a second reit at 20.0001% (20000100 of 100000000) breaches with Reit SUSPENDED."
        test_recipe:
          setup: ["Reit RA with TRS-held REAL_ESTATE 20000000 + direct REAL_ESTATE 80000000; Reit RB with TRS-held 20000100 + direct 79999900"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "TRA", ticker: "TRAA", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { ra: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${ra}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { qa: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${ra}", asset_name: "TRS Tower", asset_class: "REAL_ESTATE", held_by_trs: true, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 20000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-holdings"
