      - name: accident_filing_cascades_through_investigation_and_coverage_to_future_flight
        grounds:
          - endpoints.POST_/drone-ops/accident-reports
          - state_machines.Flight
          - state_machines.InsurancePolicy
          - calculations.accident_settlement
          - calculations.coverage_ledger_conservation
          - validations.priority_37
        distinguishing_aspect: |
          A different trigger from the suspension cascade - filing an accident report - and a
          different chain of entities. Depth 4: the report is FILED (link 1), the flown flight's
          investigation dimension opens (link 2), the covering policy books the PROVISIONAL
          reserve and drops below MIN_COMMERCIAL_COVERAGE_CENTS so it moves ACTIVE ->
          INSUFFICIENT (link 3), and that demotion cancels an unrelated PLANNED COMMERCIAL
