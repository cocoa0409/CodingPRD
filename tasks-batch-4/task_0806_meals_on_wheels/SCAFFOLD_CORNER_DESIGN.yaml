scaffold_corner_design:
  # ========================================================================
  # Section: entities
  # ========================================================================
  - section: entities
    instances:
      - name: client_create_returns_all_fields
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "POST /clients with all required fields returns 201 with a server-minted id, income_tier and oaa_eligible computed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
          assert:
            - "response status 201 and data.id is a non-prefixed UUID"
            - "data.enrollment_status == INTAKE"
            - "data.income_tier == TIER_A and data.oaa_eligible == true"
            - "data.version == 1"

      - name: client_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Client]
        distinguishing_aspect: "Omitting required field monthly_income_cents on POST /clients returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: client_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Client]
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLIENT_NOT_FOUND (404)"

      - name: client_oaa_eligible_false_when_under_60
        claim_type: computed_fields
        grounds: [entities.Client, calculations.client_oaa_eligibility]
        distinguishing_aspect: "A client with birth_date 2005-01-01 (age < 60 at intake) has oaa_eligible == false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Young Client", birth_date: "2005-01-01", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0199" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
          assert:
            - "data.oaa_eligible == false"

      - name: wellness_check_has_no_version_field
        claim_type: immutability
        grounds: [entities.WellnessCheck]
        distinguishing_aspect: "WellnessCheck is common_fields:false — its read carries id and created_at but no version and there is no update endpoint."
        test_recipe:
          setup: ["ACTIVE client with a delivery completed NO_ANSWER, producing one WellnessCheck."]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { full_name: "Dana Driver", phone: "555-0100" }
              as: ProgramAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /routes"
              payload: { name: "R1", zone: "Z1", service_days: [MON, WED, FRI], max_meals_per_run: 50 }
              as: RouteManager
              captures: { rt_id: $.data.id }
            - call: "POST /routes/${rt_id}/assign-driver"
              payload: { driver_id: "${drv_id}" }
              as: RouteManager
            - call: "POST /routes/${rt_id}/activate"
              payload: {}
              as: RouteManager
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
            - call: "GET /clients/${cli_id}"
              payload: {}
              as: RouteManager
              captures: { cli_v: $.data.version }
            - call: "POST /clients/${cli_id}/meal-plans"
              payload: { assessment_id: "${as_id}", route_id: "${rt_id}", meal_type: "HOT", meals_per_day: 2, delivery_days: [MON, WED, FRI], expected_client_version: "${cli_v}" }
              as: RouteManager
              captures: { mp_id: $.data.id }
            - call: "POST /clients/${cli_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /deliveries"
              payload: { meal_plan_id: "${mp_id}", scheduled_date: "2026-03-02" }
              as: RouteManager
              captures: { del1: $.data.id }
            - call: "POST /deliveries/${del1}/complete"
              payload: { outcome: "NO_ANSWER" }
              as: VolunteerDriver
              as_user_id: "${drv_id}"
          trigger:
            - call: "GET /wellness-checks"
              payload: { delivery_id: "${del1}" }
              as: RouteManager
              captures: { wc_id: "$.data[0].id" }
          assert:
            - "GET /wellness-checks?delivery_id=${del1} returns exactly 1 WellnessCheck"
            - "the WellnessCheck object has created_at but no version field"

      - name: contributions_list_pagination
        claim_type: listing
        grounds: [entities.Contribution]
        distinguishing_aspect: "GET /contributions with limit 1 over a client with 2 contributions returns total_count 2 and has_more true."
        test_recipe:
          setup: ["A client with two RECORDED contributions."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/contributions"
              payload: { amount_cents: 5000, period_month: "2026-03" }
              as: ContributionClerk
            - call: "POST /clients/${cli_id}/contributions"
              payload: { amount_cents: 2500, period_month: "2026-03" }
              as: ContributionClerk
          trigger:
            - call: "GET /contributions"
              payload: { client_id: "${cli_id}", limit: 1 }
              as: ContributionClerk
          assert:
            - "meta pagination total_count == 2 and has_more == true and returned array length == 1"

  # ========================================================================
  # Section: state_machines
  # ========================================================================
  - section: state_machines
    instances:
      - name: assessment_finalize_from_finalized_returns_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Assessment.DRAFT_to_FINALIZED, "errors[ERR_ASSESSMENT_NOT_DRAFT]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED assessment returns ERR_ASSESSMENT_NOT_DRAFT (409); no side effects fire."
        test_recipe:
          setup: ["A client with one FINALIZED assessment."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Client", birth_date: "1950-06-15", household_size: 1, monthly_income_cents: 120000, address_zone: "Z1", phone: "555-0101" }
              as: IntakeCoordinator
              captures: { cli_id: $.data.id }
            - call: "POST /clients/${cli_id}/assessments"
              payload: { nutrition_determine_points: 1, adl_score: 0, recommended_meals_per_day: 2 }
              as: Nutritionist
              captures: { as_id: $.data.id }
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
          trigger:
            - call: "POST /assessments/${as_id}/finalize"
              payload: {}
              as: Nutritionist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSESSMENT_NOT_DRAFT (409)"

      - name: delivery_void_from_scheduled_returns_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Delivery.DELIVERED_to_VOIDED, "errors[ERR_DELIVERY_NOT_DELIVERED]"]
        distinguishing_aspect: "Voiding a SCHEDULED (never delivered) delivery returns ERR_DELIVERY_NOT_DELIVERED (409)."
