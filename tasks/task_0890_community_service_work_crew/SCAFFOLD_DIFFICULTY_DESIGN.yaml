            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T11:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { ws1_id: "$.data.id" } }
          trigger:
            - { call: "POST /work-sessions", payload: { placement_id: "${plc_id}", scheduled_start: "2026-06-05T11:30:00Z", scheduled_end: "2026-06-05T12:30:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SESSION_OVERLAP"
            - "http status == 409"

      - name: rto_site_capacity_aggregate_overlap
        grounds:
          - calculations.site_concurrent_occupancy
          - validations[priority=16]
          - entities.Site.fields.capacity_slots
        distinguishing_aspect: "Site resource, aggregate half-open capacity semantics: two DIFFERENT participants with clock-overlapping sessions exceed capacity_slots=1 -> ERR_SITE_CAPACITY_EXCEEDED (per-participant buffer does not apply across participants)."
        test_recipe:
          setup:
            - "Capacity-1 site; two participants P1, P2 each with an ACTIVE placement; P1 session 09:00-11:00; candidate P2 session 10:00-12:00 (clock-overlaps)."
          setup_api_calls:
