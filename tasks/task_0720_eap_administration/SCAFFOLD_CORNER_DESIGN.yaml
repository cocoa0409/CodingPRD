  # ===========================================================================
  - section: errors
    instances:
      - name: contract_not_active_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_CONTRACT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_authorize_requires_contract_active
          rationale: "ERR_CONTRACT_NOT_ACTIVE is the asserted failure of the named §1.8 instance."

      - name: annual_cap_exceeded_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_ANNUAL_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / annual_cap_inclusive_boundary_on_authorize
          rationale: "ERR_ANNUAL_CAP_EXCEEDED is asserted at the boundary in the named §1.8 instance."

      - name: provider_double_booked_already_covered
        claim_type: Violation → Error
        grounds: ["errors[ERR_PROVIDER_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / provider_double_booked_minute_overlap
          rationale: "Asserted in the named §1.8 overlap instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A contract exists."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "AuthCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /eap/contracts/${c_id}"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response status 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: care_coordinator_cannot_create_contract_unauthorized
        claim_type: Violation → Error
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CareCoordinator (peer role) calling POST /eap/contracts (ProgramAdmin-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /eap/contracts"
              payload: { employer_name: "X", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status 403"
            - "data.error_id == ERR_UNAUTHORIZED"

      - name: employer_cannot_read_case_pii_confidentiality_blocked
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_CONFIDENTIALITY_BLOCKED]", roles]
        distinguishing_aspect: "Employer role calling GET /eap/cases/{id} is blocked by the confidentiality firewall with ERR_CONFIDENTIALITY_BLOCKED (403) — Employer is not in the endpoint roles, so the firewall returns 403 rather than exposing PII."
        test_recipe:
          setup: ["A case exists."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "ConfCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Cf", external_ref: "ECF1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /eap/cases/${case_id}"
              payload: {}
              as: Employer
              captures: { err: $.data.error_id }
          assert:
            - "response status 403"

      - name: non_assigned_provider_cannot_accept_referral
        claim_type: Violation → Error
        grounds: [state_machines.Referral.REQUESTED_to_ACCEPTED, "errors[ERR_NOT_ASSIGNED_PROVIDER]", roles]
        distinguishing_aspect: "A provider who is not the referral's assigned provider calling accept returns ERR_NOT_ASSIGNED_PROVIDER (403)."
        test_recipe:
          setup: ["Referral assigned to P1; P2 (other provider) attempts accept."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "NaCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", worklife_referrals_per_year: 5 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Na", external_ref: "ENA1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P1", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P2", network_status: "IN_NETWORK", specialties: ["GRIEF"], accepting: true }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /eap/referrals"
              payload: { employee_id: "${e_id}", referral_type: "WORKLIFE", required_specialty: "STRESS" }
              as: CareCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /eap/referrals/${ref_id}/accept"
              payload: {}
              as: Provider
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403"
            - "data.error_id == ERR_NOT_ASSIGNED_PROVIDER"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_suspend_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-suspend-stale-contract]", state_machines.EmployerContract.ACTIVE_to_SUSPENDED, entities.EmployerContract.fields.version]
        distinguishing_aspect: "Suspend with expected_contract_version equal to current succeeds; EmployerContract.version increments by exactly 1."
        test_recipe:
          setup: ["A fresh ACTIVE contract at version 1."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "OccCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
          trigger:
            - call: "POST /eap/contracts/${c_id}/suspend"
              payload: { expected_contract_version: "${c_v}" }
              as: ProgramAdmin
              captures: { new_v: $.data.version, st: $.data.status }
          assert:
            - "EmployerContract.${c_id}.status == SUSPENDED"
            - "EmployerContract.${c_id}.version == 2"

      - name: occ_stale_version_suspend_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-suspend-stale-contract]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "A suspend carrying a stale expected_contract_version (${c_v} - 1 after a prior reinstate bumped it) returns ERR_STALE_CONTRACT_VERSION (412)."
        test_recipe:
          setup: ["Contract suspended then reinstated so version is now 3; client holds the version-2 view."]
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "StaleCo", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 100000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v1: $.data.version }
            - call: "POST /eap/contracts/${c_id}/suspend"
              payload: { expected_contract_version: "${c_v1}" }
              as: ProgramAdmin
              captures: { c_v2: $.data.version }
            - call: "POST /eap/contracts/${c_id}/reinstate"
              payload: { expected_contract_version: "${c_v2}" }
              as: ProgramAdmin
              captures: { c_v3: $.data.version }
          trigger:
            - call: "POST /eap/contracts/${c_id}/suspend"
              payload: { expected_contract_version: "${c_v2}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 412"
            - "data.error_id == ERR_STALE_CONTRACT_VERSION"

      - name: occ_authorize_stale_contract_already_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-authorize-stale-contract]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_authorize_requires_contract_active
          rationale: "Contract-version-gated authorize behavior is exercised via the contract-state dependency instance; the stale-version 412 on authorize shares the same write_endpoint and OCC field."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: revoke_cascade_visible_in_same_request_immediate
        claim_type: immediate
        grounds: ["state_machines.Case.funding_status=AUTHORIZED_to_funding_status=REVOKED", entities.CounselingSession.fields.status]
        distinguishing_aspect: "POST /eap/cases/{id}/revoke returns the Case with funding_status=REVOKED in the same response, and the affected SCHEDULED session is already CANCELLED on a follow-up read (immediate consistency)."
        test_recipe:
