            - call: "POST /reformulation-projects"
              payload: { product_id: "${prod_a}", chemical_id: "${chem_bz}", material_chemical_id: "${link_1}", target_concentration_ppm: 8.0, planned_start_date: "2026-08-01T00:00:00Z", planned_end_date: "2026-12-01T00:00:00Z" }
              as: ComplianceAnalyst
