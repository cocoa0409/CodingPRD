            - "Participant.${p_post_id}.vested_employer_balance_cents == 17500"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contribution_close_requires_plan_active
        grounds:
          - state_machines.ContributionPeriod.OPEN_to_CLOSED
          - state_machines.Plan.ACTIVE_to_FROZEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair: ContributionPeriod -> Plan. Closing a ContributionPeriod
          requires Plan.status == ACTIVE. With Plan.status == FROZEN the close
          is rejected even though the ContributionPeriod is itself in a valid
          OPEN state and the participant is ENROLLED.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "Plan ACTIVE then FROZEN; participant ENROLLED; one OPEN ContributionPeriod."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "CE1", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "J", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /plans/${plan_id}/freeze"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "ContributionPeriod.${cp_id}.status == OPEN"

      - name: loan_disburse_requires_participant_enrolled
        grounds:
          - state_machines.Loan.REQUESTED_to_DISBURSED
          - state_machines.Participant.ENROLLED_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Different entity pair: Loan -> Participant. Disbursing a Loan
          requires Participant.enrollment_status == ENROLLED. With participant
