      - name: notice_and_depart_dates_are_bounded_by_the_clock
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Agent.ACTIVE_to_DEPARTURE_NOTICE
          - state_machines.Agent.DEPARTURE_NOTICE_to_DEPARTED
          - validations[priority 11 — departure dates bounded by the logical clock]
          - errors.ERR_DEPARTURE_DATE_OUT_OF_RANGE
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "The same error id guards both edges from opposite directions: notice needs a date NOT BEFORE the clock, depart needs the clock to have REACHED that date. Advancing the logical clock is what unblocks the second edge, and the vesting freeze is evaluated against the advanced clock, not against the notice date."
        test_recipe:
          setup: ["One ACTIVE agent with vesting_start_date 2024-01-15; the clock is at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "A1 Departing", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /agents/${a1}/notice"
              payload: { departure_effective_date: "2026-07-31" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agents/${a1}/notice"
              payload: { departure_effective_date: "2026-09-15" }
              as: IsoAdmin
            - call: "POST /agents/${a1}/depart"
              payload: {}
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: IsoAdmin
            - call: "POST /agents/${a1}/depart"
              payload: {}
              as: IsoAdmin
          assert:
            - "backdated notice: HTTP 422 with error_id == ERR_DEPARTURE_DATE_OUT_OF_RANGE; Agent.${a1}.status is still ACTIVE and departure_effective_date == null"
            - "the 2026-09-15 notice succeeds: HTTP 200, status == DEPARTURE_NOTICE, departure_effective_date == 2026-09-15"
            - "departing early (clock 2026-08-01 < 2026-09-15): HTTP 422 with error_id == ERR_DEPARTURE_DATE_OUT_OF_RANGE; status is still DEPARTURE_NOTICE"
            - "after the clock advance the depart succeeds: HTTP 200, status == DEPARTED"
            - "Agent.${a1}.vested_pct_at_departure == 50 and vested_pct == 50 — 32 months elapsed at the ADVANCED clock (2024-01-15 -> 2026-09-15), floor(32/12) x 25"
            - "no VESTED_BUYOUT adjustment was created: GET /statement-adjustments returns total_count 0, since the agent has no ISSUED or FINALIZED statement"

