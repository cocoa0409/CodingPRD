            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /firmware-campaigns/${camp_c1}/advance", payload: {}, as: FirmwareEngineer }
          assert:
            - "HTTP 200"
            - "data.status == \"ROLLING\""
            - "data.rollout_count == 2"
            - "data.installed_count == 0"
            - "GET /firmware-campaigns/${camp_c1}/rollouts returns total_count == 2"
            - "the rollout whose device_id == ${dev_cb} has selection_rank == 1 (warranty_expires_at 2028-07-31)"
            - "the rollout whose device_id == ${dev_cay} has selection_rank == 2 (warranty_expires_at 2028-08-01)"
            - "both rollouts have status == \"PENDING\" and from_version_observed == \"4.0.0\""
            - "an immediate second POST /firmware-campaigns/${camp_c1}/advance is rejected 409 ERR_NO_ELIGIBLE_DEVICES because both devices now carry a PENDING rollout for this campaign"

  # =====================================================================
  # SECTION 4 -- validations  (§1.4 rules, priority ordering and the four
  # documented dual-failure conflicts)
  # =====================================================================
  - section: validations
    instances:

      - name: validation_conflict1_invalid_state_beats_payment_declined
        claim_type: priority_conflict
        grounds: [validations.priority_22, validations.priority_62, validations.documented_conflict_1]
        distinguishing_aspect: "Billing a CANCELLED subscription with a declining instrument violates both priority 22 and priority 62, and the state band must win: the response is 409 ERR_INVALID_STATE, never 402 ERR_PAYMENT_DECLINED."
        test_recipe:
          setup:
            - "Canonical delivered order with a STANDARD plan activated on delivery, then the patient cancels the plan (ACTIVE -> CANCELLED, credit forfeited)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
