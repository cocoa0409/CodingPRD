  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_issue_restores_project_retainage_exactly
        grounds:
          - state_machines.Issue.OPEN_to_VOID
          - calculations.issue_retainage_hold
          - entities.CxProject.fields.retainage_withheld_cents
          - entities.Issue.fields.retainage_hold_cents
        distinguishing_aspect: |
          The conserved quantity is money in cents: after every void the
          invariant CxProject.retainage_withheld_cents == sum of
          Issue.retainage_hold_cents over issues with status IN
          {OPEN, IN_REVIEW, DEFERRED} must hold exactly, with zero drift
          (112500 -> 82500 -> 0); this is a different conserved quantity from the
          dimensionless verification units below.
        test_recipe:
          setup:
            - "Project P with contract_value_cents 100000000 (cap 10000000 cents)."
            - "EquipmentUnit ELS with contract_value_cents 1000005 and criticality LIFE_SAFETY."
            - "Three OPEN issues on ELS with severities S3 (7500), S2 (30000) and S1 (75000), so retainage_withheld_cents is 112500."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Ridge Cx", building_name: "Ridge Pavilion", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000, certification_target: "NONE", witness_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "FA-3", system_type: "FIRE_ALARM", criticality: "LIFE_SAFETY", contract_value_cents: 1000005, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { els: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S3", description: "Legend incomplete", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s3: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S2", description: "Battery calc missing", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s2: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S1", description: "Detector spacing violation", equipment_id: "${els}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i_s1: $.data.id }
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { held_before: $.data.retainage_withheld_cents }
          trigger:
            - call: "POST /issues/${i_s2}/void"
              payload: { reason: "Battery calc was in a superseded package" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { held_mid: $.data.retainage_withheld_cents }
            - call: "POST /issues/${i_s3}/void"
              payload: { reason: "Duplicate of drawing note" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /issues/${i_s1}/void"
              payload: { reason: "Raised against the wrong building" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "${held_before} == 112500"
            - "${held_mid} == 82500 (exactly 112500 minus Issue.${i_s2}.retainage_hold_cents of 30000)"
            - "CxProject.${p}.retainage_withheld_cents == 0 after all three voids"
            - "Issue.${i_s1}.status == VOID and Issue.${i_s2}.status == VOID and Issue.${i_s3}.status == VOID"
            - "Issue.${i_s1}.retainage_hold_cents == 75000 (the frozen per-issue hold is never rewritten by the void)"
            - "CxProject.${p}.issue_severity_index == 0.00 and CxProject.${p}.readiness_posture == OPEN"

      - name: reject_checklist_restores_verified_prefunctional_units_exactly
