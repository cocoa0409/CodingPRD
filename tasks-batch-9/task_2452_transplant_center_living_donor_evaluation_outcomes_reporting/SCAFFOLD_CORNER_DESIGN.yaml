  - name: err_recipient_not_active_covered_by_difficulty_design
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RECIPIENT_NOT_ACTIVE]
    - validations[priority=14]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / participant_eligibility_precedes_topology_on_chain_validation
      rationale: That §1.8 instance asserts ERR_RECIPIENT_NOT_ACTIVE as the winner over the priority-16
        ERR_ABO_INCOMPATIBLE, proving the rule both fires and out-ranks topology.
  - name: err_donor_not_committed_returns_422
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DONOR_NOT_COMMITTED]
    - validations[priority=14]
    - calculations.donor_overall_status
    - calculations.chain_commitment_conservation
    distinguishing_aspect: The chain IS committed (so the priority-9 gate passes) but this segment was
      inserted AFTER committed_at, so calculations.donor_overall_status leaves its donor at APPROVED -
      the offer is refused on the donor axis, not the chain axis.
