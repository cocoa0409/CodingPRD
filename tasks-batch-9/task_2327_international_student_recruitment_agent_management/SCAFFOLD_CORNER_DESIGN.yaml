      - name: terminate_with_ineligible_successor_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=62]
          - errors[ERR_SUCCESSOR_NOT_ELIGIBLE]
          - endpoints["POST /recruitment/contracts/{id}/terminate"]
        distinguishing_aspect: |
          The successor named for the student-file transition is validated against a
          three-part condition on a different agency (CLEARED, posture in
          {GOOD_STANDING, WATCH}, at least one ACTIVE contract). A freshly created agency
          fails the last two parts and the termination is refused with
          ERR_SUCCESSOR_NOT_ELIGIBLE (422), leaving the contract ACTIVE.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED with ACTIVE contract c1."
            - "Agency ag2 exists in vetting_state DRAFT with no contract at all."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Outgoing Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Unvetted Successor Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag2_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id", c1_v: "$.data.version" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-08-01", effective_to: "2027-07-31", deposit_rate_bps: 400, enrollment_rate_bps: 500, census_rate_bps: 200, persistence_rate_bps: 150, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "SEND_FOR_SIGNATURE" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "AGENCY_SIGN" }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "COMPLIANCE_APPROVE" }
              as: ComplianceOfficer
              as_user_id: "compliance-2"
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/terminate"
              payload: { reason_code: "CONVENIENCE", effective_date: "2026-08-01", transition_note: "Transfer the book to the new partner", successor_agency_id: "${ag2_id}" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { err_succ: "$.data.error_id" }
            - call: "POST /recruitment/contracts/${c1_id}/terminate"
              payload: { reason_code: "CONVENIENCE", effective_date: "2026-08-01", transition_note: "Wind down without a successor" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'the first terminate returns HTTP 422 with data.error_id == "ERR_SUCCESSOR_NOT_ELIGIBLE" and AgentContract.${c1_id}.status stays "ACTIVE"'
            - 'the second terminate (successor omitted) returns HTTP 200 with status "TERMINATED", .termination_reason_code == "CONVENIENCE" and .terminated_on == "2026-08-01"'
            - 'GET /recruitment/file-transitions returns total_count == 0 (no applications existed to transition)'

      - name: two_gates_violated_higher_priority_wins
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: submit_disclosure_state_outranks_training_lapse
          rationale: |
            That instance violates priority 46 and priority 52 in the same submit and asserts
            that the response is ERR_DISCLOSURE_NOT_ACKNOWLEDGED with an explicit negative
            assertion that ERR_TRAINING_LAPSED is not returned, which is the canonical
            priority-conflict witness for this scaffold.

  - section: endpoints
    instances:
      - name: agency_crud_round_trip_read_patch_list
        claim_type: standard_crud
        grounds:
          - endpoints["POST /recruitment/agencies"]
          - endpoints["GET /recruitment/agencies/{id}"]
          - endpoints["PATCH /recruitment/agencies/{id}"]
          - endpoints["GET /recruitment/agencies"]
        distinguishing_aspect: |
          The four plain CRUD surfaces of Agency are exercised in one pass: creation applies
          the checklist defaults, the read echoes the stored row with every computed score at
          zero, the PATCH completes the checklist and bumps version, and the filtered list
          returns exactly the patched agency with pagination metadata.
        test_recipe:
          setup:
            - "Two agencies are created: ag1 with an incomplete checklist and ag2 which is later CLEARED so the vetting_state filter has something to exclude."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "CRUD Agency One", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id", ag1_v: "$.data.version" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "CRUD Agency Two", home_country_code: "VN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag2_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag2_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag2_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "GET /recruitment/agencies/${ag1_id}"
              payload: {}
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "PATCH /recruitment/agencies/${ag1_id}"
              payload: { legal_name: "CRUD Agency One Pvt Ltd", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "GET /recruitment/agencies/${ag1_id}"
              payload: {}
              as: AgencyOwner
              as_user_id: "${ag1_id}"
            - call: "GET /recruitment/agencies"
              payload: { vetting_state: "DRAFT", limit: 10, offset: 0 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
          assert:
            - 'the first read returns Agency.${ag1_id} with vetting_state "DRAFT", compliance_posture "GOOD_STANDING", current_tier "UNRATED", ownership_disclosed false, beneficial_owner_count 0, sanctions_screen_passed false, reference_check_count 0 and every score 0.00'
            - 'the PATCH returns HTTP 200 with legal_name "CRUD Agency One Pvt Ltd" and version == ${ag1_v} + 1'
            - 'the second read shows the patched checklist values, so the write is durable and readable by the owning AgencyOwner'
            - 'the list returns total_count == 1, has_more == false and data[0].id == "${ag1_id}" - the CLEARED ag2 is filtered out'

      - name: posture_action_places_agency_on_watch_and_clears_it
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /recruitment/agencies/{id}/posture-actions"]
          - state_machines.Agency.compliance_posture.GOOD_STANDING_to_WATCH
          - state_machines.Agency.compliance_posture.WATCH_to_GOOD_STANDING
        distinguishing_aspect: |
          The manual posture action moves the compliance_posture dimension with no change to
          vetting_state and no risk score movement: WATCH is reached at rolling_risk_score
          0.00 because the officer asked for it, and CLEAR_WATCH returns the agency to
          GOOD_STANDING. The mandatory reason is recorded on both hops.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED with no incidents, so rolling_risk_score is 0.00 and compliance_posture is GOOD_STANDING."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Posture Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/posture-actions"
              payload: { action: "PLACE_ON_WATCH", reason: "Peer university reported aggressive marketing" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "GET /recruitment/agencies/${ag1_id}/risk-profile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/agencies/${ag1_id}/posture-actions"
              payload: { action: "CLEAR_WATCH", reason: "Marketing review closed with no finding" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'the first action returns HTTP 200 with Agency.${ag1_id}.compliance_posture == "WATCH" and .vetting_state still "CLEARED"'
            - 'the risk-profile read still reports rolling_risk_score 0.00, lifetime_risk_score 0.00 and posture_band "GOOD_STANDING" - the manual posture is not derived from the score'
            - 'CLEAR_WATCH returns compliance_posture "GOOD_STANDING" and Agency.${ag1_id}.version advanced by exactly 2 across the two actions'

      - name: commission_projection_on_draft_application_is_all_zero
        claim_type: computed_read
        grounds:
          - endpoints["GET /recruitment/applications/{id}/commission-projection"]
          - calculations.commission_entitlement.variants
        distinguishing_aspect: |
          The dual-variant computed read is defined before any pricing exists. On a DRAFT
          application both variants are zero, the delta is zero, and the pinned fields are
          null rather than absent - the endpoint does not 404 or 409 merely because nothing
          has been submitted yet.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED and application a1 has just been created in DRAFT with no documents and no disclosure."
