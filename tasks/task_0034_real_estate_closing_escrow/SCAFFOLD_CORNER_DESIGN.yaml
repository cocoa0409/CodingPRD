              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { ta_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 CSE St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: "$.data.id" }
            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 1000000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd_id: "$.data.id" }
            - call: "POST /earnest-money-deposits/${emd_id}/confirm"
              payload: { confirmation_reference: "CSE-1" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /title-searches"
              payload: { agreement_id: "${agr_id}" }
              as: TitleAgent
              as_user_id: "${ta_id}"
              captures: { ts_id: "$.data.id" }
            - call: "POST /title-searches/${ts_id}/complete"
              payload: { defects: [{ kind: "lien", severity: "MATERIAL", description: "Unpaid lien." }] }
              as: TitleAgent
              as_user_id: "${ta_id}"
            - call: "POST /wire-instructions"
              payload: { agreement_id: "${agr_id}", party: "BUYER", beneficiary_bank_name: "BB", beneficiary_account_last4: "1111", routing_number: "021000021" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { wi_b: "$.data.id" }
            - call: "POST /wire-instructions/${wi_b}/callback-verify"
