            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp2_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { svc2_id: $.data.id }
            - call: "POST /ei/ifsps/${ifsp1_id}/consent"
              payload: { consent_scope: "FULL", consent_signed_date: "2026-09-01" }
              as: FamilyRepresentative
              as_user_id: "${child1_id}"
            - call: "POST /ei/ifsps/${ifsp2_id}/consent"
              payload: { consent_scope: "FULL", consent_signed_date: "2026-09-01" }
              as: FamilyRepresentative
              as_user_id: "${child2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T09:00:00Z" }
