  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_requires_confirmed_prior_notice
        grounds:
          - state_machines.ImportEntry
          - state_machines.PriorNotice.CONFIRMED_to_SUPERSEDED
          - validations[priority=5]
          - errors.ERR_PN_NOT_CONFIRMED
        distinguishing_aspect: "Entity pair ImportEntry -> PriorNotice: entry filing is gated on the notice being CONFIRMED; filing against the SUPERSEDED original after an amendment fails with ERR_PN_NOT_CONFIRMED while filing against the superseding notice succeeds."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z; Facility N (FOREIGN, DE); Importer I10"
            - "PN1 filed then amended -> PN1 SUPERSEDED, PN1A CONFIRMED"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Sicilia Agrumi", facility_kind: "FOREIGN", country_code: "IT", ufi: "UFI-IT-1001" }
              as: FacilityOwner
              captures: { fac_n: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Sunbelt Distributing", account_code: "IMP-1001" }
              as: PlatformAdmin
              captures: { imp10: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp10}", facility_id: "${fac_n}", product_code: "PC-CIT-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 15, unit_value_cents: 250, port_code: "US-NYC" }
              as: Importer
              as_user_id: "${imp10}"
              captures: { pn_n1: $.data.id }
            - call: "POST /registry/prior-notices/${pn_n1}/amend"
              payload: { arrival_eta: "2026-09-03T06:00:00Z" }
              as: Importer
              as_user_id: "${imp10}"
              captures: { pn_n1a: $.data.id }
          trigger:
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_n1}" }
              as: Importer
              as_user_id: "${imp10}"
              captures: { err_pn: $.data.error_id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_n1a}" }
              as: Importer
              as_user_id: "${imp10}"
              captures: { ent_n: $.data.id }
          assert:
            - "filing against the SUPERSEDED notice: err_pn == ERR_PN_NOT_CONFIRMED (http 409)"
            - "filing against the superseding CONFIRMED notice succeeds: ImportEntry.${ent_n}.review_status == PENDING_SCREENING and disposition_status == PENDING"
            - "PriorNotice.${pn_n1a}.status == CONSUMED after entry creation"

      - name: petition_requires_active_alert
        grounds:
          - state_machines.AlertPetition
          - state_machines.ImportAlert.ACTIVE_to_LIFTED
          - validations[priority=5]
          - errors.ERR_IMPORT_ALERT_NOT_ACTIVE
        distinguishing_aspect: "Entity pair AlertPetition -> ImportAlert (different pair from Entry -> PriorNotice): after a successful petition lifts its alert, a second petition filed against the LIFTED alert fails with ERR_IMPORT_ALERT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z; Facility O (FOREIGN, DE); Importer I11"
            - "FIRM alert A3 on O by co-1; three post-alert entries detained then ComplianceOfficer-released (streak 3); petition P3 approved by co-2 so A3 is LIFTED"
