      - name: makeup_session_inherits_same_day_spacing_boundary_on_a_different_assignment
        grounds:
          - endpoints.POST_hhi_sessions_id_makeup
          - validations.priority_13.ERR_SESSION_GAP_TOO_SHORT
          - validations.priority_12.ERR_MAKEUP_NOT_ELIGIBLE
          - state_machines.InstructionSession.SCHEDULED_to_STUDENT_UNAVAILABLE
        distinguishing_aspect: |
          The makeup endpoint is a second creation path that must re-run every scheduling guard. The
          makeup is placed on the SUPPORT assignment (a different teacher, so the teacher-busy scan is
          silent) and lands 10 minutes after the PRIMARY teacher's existing session on the same case and
          date, which the per-case gap rule rejects; shifting to exactly 15 minutes passes. Once the
