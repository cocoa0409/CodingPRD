            - call: "POST /funding-sources/${f4_trunc_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_1"
            - call: "POST /postdocs"
              payload: { full_name: "Omar Haddad", email: "omar.h@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-05-01", prior_external_months_in_rank: 0 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_4"
              captures: { p4a_id: "$.data.id" }
            - call: "POST /postdocs"
