# =============================================================================
# 1.8 SCAFFOLD DIFFICULTY DESIGN - Test Targeting Index
# task_2768_pool_service_route_brokerage_account_transfer
#
# Nine Difficulty Rules from SKILL.md 0.5, each with >= 2 grounded instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml 1.1-1.7; every setup_api_calls
# chain drives empty-DB -> the described setup state using only 1.5 endpoints;
# every numeric assert is a literal computed against the 1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: route_valuation_listed_versus_verified_basis
        grounds:
          - "calculations.route_valuation"
          - "calculations.route_valuation.variants.LISTED_BASIS"
          - "calculations.route_valuation.variants.VERIFIED_BASIS"
          - "entities.RouteValuation.fields.basis"
          - "entities.RouteValuation.fields.effective_multiple"
          - "entities.ServiceAccount.fields.verified_recurring_mrr_cents"
          - "endpoints[POST /route-listings/{id}/valuations]"
        distinguishing_aspect: "Entity domain = RouteValuation: the same three-account listing at the same clock yields valuation_cents 463500 on LISTED_BASIS and 343725 on VERIFIED_BASIS because the two variants differ in BOTH the membership filter (3 accounts vs 2) and the per-account amounts, which drags weighted_avg_account_age_months from 50 to 64 and effective_multiple from 10.5 to 11.0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "AZ StateLicenseProfile seeded; seller Sun Valley Pools LLC ACTIVE; buyer APPROVED."
            - "One DRAFT listing PHX-NE with three accounts: A1 (claimed 16000, repair 1500, age 88), A2 (claimed 15000 because chemical is PASS_THROUGH, repair 2000, age 38), A3 (claimed 12000, repair 500, age 17)."
            - "Nine BANK_VERIFIED BillingHistoryRecord rows (three trailing months each)."
            - "All three accounts verified: A1 -> VERIFIED (16000, variance 0.0000), A2 -> VERIFIED (14318, variance 0.0455), A3 -> DISPUTED (10000, variance 0.1667)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A1-SUNRISE", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 12000, "avg_monthly_chemical_cents": 4000, "avg_monthly_repair_cents": 1500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a1_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A2-MESA", "service_start_date": "2023-06-01", "route_day": "MON", "monthly_service_fee_cents": 15000, "avg_monthly_chemical_cents": 5000, "avg_monthly_repair_cents": 2000, "chemical_billing_method": "PASS_THROUGH", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a2_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A3-GILBERT", "service_start_date": "2025-02-10", "route_day": "WED", "monthly_service_fee_cents": 9000, "avg_monthly_chemical_cents": 3000, "avg_monthly_repair_cents": 500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a3_id": "$.data.id"}
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a1_id}", "period_month": "2026-05", "billed_service_cents": 12000, "billed_chemical_cents": 4000, "billed_repair_cents": 1500, "collected_cents": 17500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a1_id}", "period_month": "2026-06", "billed_service_cents": 12000, "billed_chemical_cents": 4000, "billed_repair_cents": 1500, "collected_cents": 17500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a1_id}", "period_month": "2026-07", "billed_service_cents": 12000, "billed_chemical_cents": 4000, "billed_repair_cents": 1500, "collected_cents": 17500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a2_id}", "period_month": "2026-05", "billed_service_cents": 15000, "billed_chemical_cents": 5000, "billed_repair_cents": 2000, "collected_cents": 21000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a2_id}", "period_month": "2026-06", "billed_service_cents": 15000, "billed_chemical_cents": 5000, "billed_repair_cents": 2000, "collected_cents": 21000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a2_id}", "period_month": "2026-07", "billed_service_cents": 15000, "billed_chemical_cents": 5000, "billed_repair_cents": 2000, "collected_cents": 21000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a3_id}", "period_month": "2026-05", "billed_service_cents": 8000, "billed_chemical_cents": 2000, "billed_repair_cents": 500, "collected_cents": 10500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a3_id}", "period_month": "2026-06", "billed_service_cents": 8000, "billed_chemical_cents": 2000, "billed_repair_cents": 500, "collected_cents": 10500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a3_id}", "period_month": "2026-07", "billed_service_cents": 8000, "billed_chemical_cents": 2000, "billed_repair_cents": 500, "collected_cents": 10500, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /service-accounts/${a1_id}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
            - call: "POST /service-accounts/${a2_id}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
            - call: "POST /service-accounts/${a3_id}/verify"
              payload: {}
              as: Broker
              as_user_id: "broker-verify-1"
          trigger:
            - call: "GET /route-listings/${listing_id}"
              as: Broker
              captures: {"lv_a": "$.data.version"}
            - call: "POST /route-listings/${listing_id}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${lv_a}"}
              as: Broker
              captures: {"val_listed_id": "$.data.id"}
            - call: "GET /route-listings/${listing_id}"
              as: Broker
              captures: {"lv_b": "$.data.version"}
            - call: "POST /route-listings/${listing_id}/valuations"
              payload: {"basis": "VERIFIED_BASIS", "expected_listing_version": "${lv_b}"}
              as: Broker
              captures: {"val_verified_id": "$.data.id"}
          assert:
            - "RouteValuation.${val_listed_id}.basis == LISTED_BASIS"
            - "RouteValuation.${val_listed_id}.account_count == 3"
            - "RouteValuation.${val_listed_id}.recurring_mrr_cents == 43000"
            - "RouteValuation.${val_listed_id}.repair_mrr_cents == 4000"
            - "RouteValuation.${val_listed_id}.weighted_avg_account_age_months == 50"
            - "RouteValuation.${val_listed_id}.base_multiple == 10.0"
            - "RouteValuation.${val_listed_id}.age_adjustment == 0.5"
            - "RouteValuation.${val_listed_id}.effective_multiple == 10.5"
            - "RouteValuation.${val_listed_id}.recurring_component_cents == 451500"
            - "RouteValuation.${val_listed_id}.repair_component_cents == 12000"
            - "RouteValuation.${val_listed_id}.valuation_cents == 463500"
            - "RouteValuation.${val_verified_id}.basis == VERIFIED_BASIS"
            - "RouteValuation.${val_verified_id}.account_count == 2"
            - "RouteValuation.${val_verified_id}.recurring_mrr_cents == 30318"
            - "RouteValuation.${val_verified_id}.repair_mrr_cents == 3409"
            - "RouteValuation.${val_verified_id}.weighted_avg_account_age_months == 64"
            - "RouteValuation.${val_verified_id}.base_multiple == 10.0"
            - "RouteValuation.${val_verified_id}.age_adjustment == 1.0"
            - "RouteValuation.${val_verified_id}.effective_multiple == 11.0"
            - "RouteValuation.${val_verified_id}.recurring_component_cents == 333498"
            - "RouteValuation.${val_verified_id}.repair_component_cents == 10227"
            - "RouteValuation.${val_verified_id}.valuation_cents == 343725"
            - "the two snapshots differ by exactly 119775 cents on the same listing at the same clock"
            - "RouteValuation.${val_listed_id}.is_superseded == false and RouteValuation.${val_verified_id}.is_superseded == false (supersession is scoped per (listing_id, basis), so neither snapshot retires the other)"

      - name: clawback_replacement_versus_price_adjustment_basis
        grounds:
          - "calculations.clawback_settlement"
          - "calculations.clawback_settlement.variants.REPLACEMENT_BASIS"
          - "calculations.clawback_settlement.variants.PRICE_ADJUSTMENT_BASIS"
          - "entities.ClawbackSettlement.fields.remedy_basis"
          - "entities.ClawbackSettlement.fields.raw_adjustment_cents"
          - "entities.Deal.fields.effective_multiple_at_close"
          - "validations[priority=57]"
        distinguishing_aspect: "Entity domain = ClawbackSettlement (not RouteValuation): two structurally identical closed NV deals each lose exactly 3000 of NATURAL MRR, and the same compensable_natural_mrr_cents of 2000 prices at 20000 cents under REPLACEMENT_BASIS (2000 x multiple 10.0) but 18000 cents under PRICE_ADJUSTMENT_BASIS (180000 x natural_pct 0.1000) - a 2000-cent divergence caused purely by the remedy_basis switch."
        test_recipe:
          setup:
            - "Logical clock advanced 2026-08-01 -> 2026-09-01 (close) -> 2026-10-01 (attrition)."
            - "NV StateLicenseProfile (required_permit_types = [BUSINESS_TAX], reciprocity_states = [AZ])."
            - "Two independent listings NV-LV1 and NV-LV2 for the same ACTIVE seller, each with one VERIFIED 20000-MRR account, each closed at price 180000 (down 60000 / note 120000, SELLER_NOTE, 90-day guarantee)."
            - "Each closed deal therefore carries guaranteed_mrr_cents 20000, allowance_mrr_cents 1000, effective_multiple_at_close 10.0, clawback_cap_cents 36000 and escrow holdback_balance_cents 27000."
            - "One DOWNGRADED / NATURAL AttritionEvent of -3000 on each deal, so both ledgers report net_attrition_mrr_cents 3000 and compensable_natural_mrr_cents 2000."
