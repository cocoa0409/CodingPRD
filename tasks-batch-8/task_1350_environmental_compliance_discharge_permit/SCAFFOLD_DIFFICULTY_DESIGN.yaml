scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 - dual_variant_calc (two variants, DIFFERENT entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dmr_monthly_average_arithmetic_vs_flow_weighted
        grounds:
          - calculations.monthly_average_effluent
          - entities.EffluentLimit.fields.average_method
          - entities.DischargeMonitoringReport.fields.summary_lines
        distinguishing_aspect: |
          Variant selection lives on the EffluentLimit (discharge-monitoring domain), NOT on the
          ConsentOrder: identical VALIDATED results (1.0 @ 4.0 MGD, 3.0 @ 1.0 MGD) yield
          avg_concentration 2.000 under ARITHMETIC and 1.400 under FLOW_WEIGHTED.
        test_recipe:
          setup:
            - "Permit ACTIVE with two outfalls; outfall 001 holds a TSS MONTHLY_AVG limit (10.0 MG_L, MONTHLY, ARITHMETIC), outfall 002 the same limit but FLOW_WEIGHTED"
            - "Each outfall has two VALIDATED TSS results collected 2026-08-05: 1.0 MG_L @ 4.0 MGD and 3.0 MG_L @ 1.0 MGD"
            - "Two DMRs generated for period 2026-08-01..2026-08-31, one per outfall"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-DV1", facility_name: "Dual Variant Metals", receiving_water_body: "Blackstone River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o1_id: $.data.id, o1_v: $.data.version } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "002" }, as: EnvironmentalManager, captures: { o2_id: $.data.id, o2_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o1_id}", parameter_code: "TSS", limit_type: "MONTHLY_AVG", limit_value: 10.0, unit: "MG_L", average_method: "ARITHMETIC", monitoring_frequency: "MONTHLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o1_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o2_id}", parameter_code: "TSS", limit_type: "MONTHLY_AVG", limit_value: 10.0, unit: "MG_L", average_method: "FLOW_WEIGHTED", monitoring_frequency: "MONTHLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o2_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            # --- outfall 001, sample A (1.0 @ 4.0) ---
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o1_id}", parameter_code: "TSS", scheduled_for: "2026-08-05T08:00:00Z" }, as: FieldSampler, captures: { s1a: $.data.id } }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o1_id}", parameter_code: "TSS", scheduled_for: "2026-08-05T09:00:00Z" }, as: FieldSampler, captures: { s1b: $.data.id } }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o2_id}", parameter_code: "TSS", scheduled_for: "2026-08-05T08:00:00Z" }, as: FieldSampler, captures: { s2a: $.data.id } }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o2_id}", parameter_code: "TSS", scheduled_for: "2026-08-05T09:00:00Z" }, as: FieldSampler, captures: { s2b: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s1a}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1b}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2a}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2b}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1a}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T10:30:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1a}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T12:00:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s1a}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-06T08:00:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s1b}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T10:30:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1b}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T12:00:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s1b}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-06T08:00:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2a}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T10:30:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2a}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T12:00:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2a}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-06T08:00:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2b}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T10:30:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2b}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T12:00:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2b}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-06T08:00:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s1a}", parameter_code: "TSS", reported_value: 1.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 4.0, analyzed_at: "2026-08-06T09:00:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r1a: $.data.id } }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s1b}", parameter_code: "TSS", reported_value: 3.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 1.0, analyzed_at: "2026-08-06T09:00:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r1b: $.data.id } }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s2a}", parameter_code: "TSS", reported_value: 1.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 4.0, analyzed_at: "2026-08-06T09:00:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r2a: $.data.id } }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s2b}", parameter_code: "TSS", reported_value: 3.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 1.0, analyzed_at: "2026-08-06T09:00:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r2b: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:30:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/lab-results/${r1a}/validate", as: LabValidator, as_user_id: "validator-1" }
            - { call: "POST /npdes/lab-results/${r1b}/validate", as: LabValidator, as_user_id: "validator-1" }
            - { call: "POST /npdes/lab-results/${r2a}/validate", as: LabValidator, as_user_id: "validator-1" }
            - { call: "POST /npdes/lab-results/${r2b}/validate", as: LabValidator, as_user_id: "validator-1" }
          trigger:
            - { call: "POST /npdes/dmrs", payload: { outfall_id: "${o1_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d1_id: $.data.id } }
            - { call: "POST /npdes/dmrs", payload: { outfall_id: "${o2_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d2_id: $.data.id } }
          assert:
            - "DischargeMonitoringReport.${d1_id}.summary_lines[0].parameter_code == TSS and .sample_count == 2"
            - "DischargeMonitoringReport.${d1_id}.summary_lines[0].avg_concentration == 2.0 (ARITHMETIC: (1.0+3.0)/2)"
            - "DischargeMonitoringReport.${d2_id}.summary_lines[0].avg_concentration == 1.4 (FLOW_WEIGHTED: (1.0*4.0+3.0*1.0)/(4.0+1.0))"
            - "Both DMR lines have exceeds_limit == false (both averages < 10.0)"

      - name: consent_order_penalty_per_day_vs_economic_benefit
        grounds:
          - calculations.penalty_accrual
          - entities.ConsentOrder.fields.assessment_variant
          - entities.ConsentOrder.fields.final_amount_cents
        distinguishing_aspect: |
          Variant selection lives on the ConsentOrder (enforcement/fiscal domain), NOT on lab
          analytics: identical violation date, identical 10-day accrual window and identical
          base/cap yield final_amount_cents 1500000 under PER_DAY and 4000000 under ECONOMIC_BENEFIT.
        test_recipe:
          setup:
            - "Permit ACTIVE, outfall 001 with COPPER DAILY_MAX 1.0 MG_L limit (WEEKLY)"
            - "Two samples collected 2026-08-05, both results 1.5 MG_L, both VALIDATED at logical clock 2026-08-05T10:00:00Z -> exceedances E1 and E2, both detected_at 2026-08-05T10:00:00Z"
            - "ConsentOrder CO1 on E1 (PER_DAY: base 1000000, daily 50000, cap 5000000) and CO2 on E2 (ECONOMIC_BENEFIT: base 1000000, cap 5000000, avoided 2000000, gravity 1.5), both ISSUED"
            - "Logical clock at 2026-08-15T00:00:00Z; neither exceedance's corrective action is verified (cure falls back to finalize date)"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-DV2", facility_name: "Variant Plating", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", limit_type: "DAILY_MAX", limit_value: 1.0, unit: "MG_L", monitoring_frequency: "WEEKLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", scheduled_for: "2026-08-05T08:00:00Z" }, as: FieldSampler, captures: { s1: $.data.id } }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "COPPER", scheduled_for: "2026-08-05T08:30:00Z" }, as: FieldSampler, captures: { s2: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s1}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T09:10:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T09:20:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s1}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-05T09:30:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T09:10:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T09:20:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-05T09:30:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s1}", parameter_code: "COPPER", reported_value: 1.5, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 2.0, analyzed_at: "2026-08-05T09:45:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r1: $.data.id } }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s2}", parameter_code: "COPPER", reported_value: 1.5, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 2.0, analyzed_at: "2026-08-05T09:45:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r2: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/lab-results/${r1}/validate", as: LabValidator, as_user_id: "validator-1", captures: { r1v: $.data.exceedance_id } }
            - { call: "POST /npdes/lab-results/${r2}/validate", as: LabValidator, as_user_id: "validator-1", captures: { r2v: $.data.exceedance_id } }
            - { call: "POST /npdes/consent-orders", payload: { exceedance_id: "${r1v}", assessment_variant: "PER_DAY", base_penalty_cents: 1000000, daily_accrual_cents: 50000, statutory_cap_cents: 5000000 }, as: Regulator, captures: { co1: $.data.id } }
            - { call: "POST /npdes/consent-orders/${co1}/issue", as: Regulator }
            - { call: "POST /npdes/consent-orders", payload: { exceedance_id: "${r2v}", assessment_variant: "ECONOMIC_BENEFIT", base_penalty_cents: 1000000, statutory_cap_cents: 5000000, avoided_cost_cents: 2000000, gravity_factor: 1.5 }, as: Regulator, captures: { co2: $.data.id } }
            - { call: "POST /npdes/consent-orders/${co2}/issue", as: Regulator }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /npdes/consent-orders/${co1}/finalize", as: Regulator }
            - { call: "POST /npdes/consent-orders/${co2}/finalize", as: Regulator }
          assert:
            - "ConsentOrder.${co1}.accrued_days == 10 and .final_amount_cents == 1500000 (1000000 + 50000*10)"
            - "ConsentOrder.${co2}.accrued_days == 10 and .final_amount_cents == 4000000 (1000000 + round(2000000*ceil(10/30)*1.5))"
            - "ConsentOrder.${co1}.outstanding_cents == 1500000 and ConsentOrder.${co2}.outstanding_cents == 4000000"
            - "Both orders status == FINAL; identical violation dates and window, divergent totals purely from assessment_variant"

  # =====================================================================
  # Rule 2 - combinatorial_formula (instances in DIFFERENT modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dmr_loading_per_sample_round_then_sum
        grounds:
          - calculations.dmr_pollutant_loading
          - entities.DischargeMonitoringReport.fields.summary_lines
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-sample-to-3dp THEN sum THEN
          round-to-2dp; the forbidden sum-then-round order yields 0.24 on the same data while the
          pinned order yields 0.25.
        test_recipe:
          setup:
            - "Permit ACTIVE, outfall 001 with TSS DAILY_MAX 10.0 MG_L limit (MONTHLY frequency)"
            - "Two VALIDATED TSS results: 1.0 MG_L @ 0.0324 MGD and 1.0 MG_L @ 0.0323 MGD, collected 2026-08-05"
            - "Raw loads: 0.122634 and 0.1222555 kg"
          setup_api_calls:
            - { call: "POST /npdes/permits", payload: { permit_number: "NPDES-CF1", facility_name: "Rounding Works", receiving_water_body: "Mill River", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-12-31T00:00:00Z" }, as: EnvironmentalManager, captures: { p_id: $.data.id } }
            - { call: "POST /npdes/outfalls", payload: { permit_id: "${p_id}", outfall_number: "001" }, as: EnvironmentalManager, captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /npdes/effluent-limits", payload: { outfall_id: "${o_id}", parameter_code: "TSS", limit_type: "DAILY_MAX", limit_value: 10.0, unit: "MG_L", monitoring_frequency: "MONTHLY", effective_from: "2026-01-01T00:00:00Z", expected_outfall_version: "${o_v}" }, as: EnvironmentalManager }
            - { call: "POST /npdes/permits/${p_id}/issue", as: EnvironmentalManager }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-05T08:00:00Z" }, as: FieldSampler, captures: { s1: $.data.id } }
            - { call: "POST /npdes/sampling-events", payload: { outfall_id: "${o_id}", parameter_code: "TSS", scheduled_for: "2026-08-05T09:00:00Z" }, as: FieldSampler, captures: { s2: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/sampling-events/${s1}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2}/collect", as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T10:30:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s1}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T12:00:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s1}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-06T08:00:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2}/custody-events", payload: { event_type: "TRANSFER", event_at: "2026-08-05T10:30:00Z", from_party: "sampler", to_party: "courier" }, as: FieldSampler }
            - { call: "POST /npdes/sampling-events/${s2}/custody-events", payload: { event_type: "RECEIVE_LAB", event_at: "2026-08-05T12:00:00Z", from_party: "courier", to_party: "lab" }, as: LabAnalyst }
            - { call: "POST /npdes/sampling-events/${s2}/custody-events", payload: { event_type: "ANALYSIS_START", event_at: "2026-08-06T08:00:00Z" }, as: LabAnalyst }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s1}", parameter_code: "TSS", reported_value: 1.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 0.0324, analyzed_at: "2026-08-06T09:00:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r1: $.data.id } }
            - { call: "POST /npdes/lab-results", payload: { sampling_event_id: "${s2}", parameter_code: "TSS", reported_value: 1.0, unit: "MG_L", method_detection_limit: 0.02, flow_mgd: 0.0323, analyzed_at: "2026-08-06T09:00:00Z" }, as: LabAnalyst, as_user_id: "analyst-1", captures: { r2: $.data.id } }
            - { call: "POST /npdes/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:30:00Z" }, as: SystemAdmin }
            - { call: "POST /npdes/lab-results/${r1}/validate", as: LabValidator, as_user_id: "validator-1" }
            - { call: "POST /npdes/lab-results/${r2}/validate", as: LabValidator, as_user_id: "validator-1" }
          trigger:
            - { call: "POST /npdes/dmrs", payload: { outfall_id: "${o_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d_id: $.data.id } }
          assert:
            - "DischargeMonitoringReport.${d_id}.summary_lines[0].sample_count == 2"
            - "DischargeMonitoringReport.${d_id}.summary_lines[0].total_loading_kg == 0.25 (pinned: round3(0.122634)=0.123, round3(0.1222555)=0.122, round2(0.123+0.122)=round2(0.245)=0.25 round_half_up)"
            - "The forbidden order would give round2(0.2448895) == 0.24; the observed value MUST be 0.25"
            - "DischargeMonitoringReport.${d_id}.summary_lines[0].avg_concentration == 1.0"

      - name: monitoring_completeness_tiered_ratio
        grounds:
          - calculations.monitoring_completeness
          - entities.DischargeMonitoringReport.fields.monitoring_completeness_ratio
          - entities.DischargeMonitoringReport.fields.required_sample_count
        distinguishing_aspect: |
          Mode (a) combinatorial formula: required_sample_count = f(frequency x period length x
          ACTIVE-limit coverage) = ceil(31/7) + 1 = 6 across two parameter limits; with 3 validated
          results the ratio lands exactly on the 0.5 tier boundary (DEFICIENT, certification allowed).
        test_recipe:
          setup:
            - "Permit ACTIVE, outfall 001 with BOD5 DAILY_MAX 5.0 MG_L WEEKLY limit and TSS DAILY_MAX 10.0 MG_L MONTHLY limit"
            - "Three BOD5 samples collected 2026-08-05 / 2026-08-12 / 2026-08-19, each validated within the 48h holding time; zero TSS samples"
            - "DMR period 2026-08-01..2026-08-31 (31 days): required = ceil(31/7)=5 (BOD5 weekly) + 1 (TSS monthly) = 6"
          setup_api_calls:
