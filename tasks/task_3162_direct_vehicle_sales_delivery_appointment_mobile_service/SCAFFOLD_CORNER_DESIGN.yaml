          assert:
            - "\"${posture_full}\" == READY and \"${paid_full}\" == 25000"
            - "\"${posture_partial}\" == RESTRICTED because the settlement is 24700 against a provisional total of 4824000"
            - "GET /v1/orders/${ord_partial_id} reports delivery_readiness_posture RESTRICTED"
            - "GET /v1/orders?delivery_readiness_posture=RESTRICTED returns exactly 1 row"
            - "GET /v1/orders?delivery_readiness_posture=READY returns exactly 1 row"

      - name: scheduled_action_deadline_fires_on_the_clock_advance
        claim_type: scheduled_actions
        grounds:
          - state_machines.VehicleOrder.PLACED_to_CONFIG_LOCKED
          - endpoints.POST_/v1/_clock/set_current_utc
          - entities.VehicleOrder.fields.configuration_lock_deadline
        distinguishing_aspect: "The PLACED to CONFIG_LOCKED transition is deferred: it does not occur at placement, it occurs the moment the logical clock strictly exceeds configuration_lock_deadline, and a clock advance to the deadline instant alone does not fire it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order placed so configuration_lock_deadline is 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/orders/${ord_id}"
              payload: {}
              as: PlatformAdmin
              captures: { state_at_deadline: $.data.status }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /v1/orders/${ord_id}"
              payload: {}
              as: PlatformAdmin
              captures: { state_after: $.data.status }
          assert:
            - "\"${state_at_deadline}\" == PLACED — landing exactly on the deadline does not fire the deferred transition"
            - "\"${state_after}\" == CONFIG_LOCKED"
            - "GET /v1/orders/${ord_id}/delivery-estimates shows the single estimate's notification_state now NOTIFIED"
            - "VehicleOrder.${ord_id}.delivery_readiness_posture == FROZEN, because no unit has been allocated yet"

      - name: rate_threshold_bundle_tier_flips_between_the_second_and_the_fourth_row
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.entitlement_bundle_price_cents
          - entities.SoftwareEntitlement.fields.bundle_discount_bps
        distinguishing_aspect: "The bundle rate steps at two boundaries: a first purchase on a vehicle holding one ACTIVE entitlement pays in full at 0 basis points, the second pays with a 500-basis-point discount, and a purchase on a vehicle holding four pays at 1000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delivered vehicle holding one ACTIVE entitlement."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - *c_alloc
            - *c_disp
            - *c_arrive
            - *c_appt
            - *c_confirm
            - *c_complete
            - call: "POST /v1/vehicles/${veh_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "AUTOPILOT_BASIC", price_cents: 0 }], entitlement_source: "FACTORY_OPTION" }
              as: PlatformAdmin
              captures: { ent_base_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/vehicles/${veh_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "PREMIUM_CONNECTIVITY", price_cents: 100000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
              captures: { bps_tier1: "$.data[0].bundle_discount_bps", net_tier1: "$.data[0].bundle_net_cents" }
            - call: "POST /v1/vehicles/${veh_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "PREMIUM_AUDIO", price_cents: 200000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
              captures: { bps_tier2: "$.data[0].bundle_discount_bps", net_tier2: "$.data[0].bundle_net_cents" }
          assert:
            - "\"${bps_tier1}\" == 0 and \"${net_tier1}\" == 100000 — one existing entitlement keeps the vehicle in the undiscounted band"
            - "\"${bps_tier2}\" == 500 and \"${net_tier2}\" == 190000 — two existing entitlements cross into the 500-basis-point band"
            - "GET /v1/software-entitlements?vehicle_id=${veh_id} reports exactly 3 ACTIVE rows"
            - "a third purchase on this vehicle reports bundle_discount_bps 500, and a fourth reports 1000"

      - name: saga_compensation_on_cancellation_restores_every_touched_aggregate
        claim_type: saga
        grounds:
          - state_machines.VehicleOrder.PLACED_to_CANCELLED
          - entities.Buyer.fields.order_credit_balance_cents
          - entities.TradeInAppraisal.fields.status
          - state_machines.DeliveryEstimate.PROVISIONAL_to_SUPERSEDED
        distinguishing_aspect: "Cancelling part-way through the order saga compensates every aggregate it touched: the appraisal returns to REJECTED with its credit reversed, the live estimate is superseded, the financing application is declined and the buyer's balance settles at 5000 cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order placed, paid and locked, carrying an OFFERED appraisal, a SUBMITTED financing application in impossible state and a live estimate."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
            - *c_lock
            - *c_appraisal
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_id}/appraise"
              payload: {}
              as: TradeInSpecialist
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_id}/offer"
              payload: {}
              as: TradeInSpecialist
            - call: "POST /v1/orders/${ord_id}/financing-applications"
              payload: { term_months: 60, down_payment_cents: 100000, include_trade_in_credit: true }
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { saga_app_id: $.data.id }
          trigger:
            - call: "POST /v1/orders/${ord_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { saga_state: $.data.status }
          assert:
            - "\"${saga_state}\" == CANCELLED"
            - "TradeInAppraisal.${apr_id}.status == REJECTED"
            - "FinancingApplication.${saga_app_id}.status == DECLINED"
            - "DeliveryEstimate.${est_id}.estimate_state == SUPERSEDED"
            - "GET /v1/buyers/${byr_id} reports order_credit_balance_cents == 5000 (25000 order fee less the 20000 refund, with the trade-in credit and its reversal netting to 0)"

      - name: idempotency_key_guard_on_repeated_manual_ledger_posting
        claim_type: idempotency
        grounds:
          - endpoints.POST_/v1/orders/{id}/fee-ledger-entries
          - entities.OrderFeeLedgerEntry.fields.reason_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Posting the same reason_code twice is not silently absorbed: the second row is written and the balance moves again, so the ledger is append-only and the conserved quantity reflects both postings."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a placed, paid order."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - *c_pay
          trigger:
            - call: "POST /v1/orders/${ord_id}/fee-ledger-entries"
              payload: { entry_type: "DELIVERY_FEE_CHARGE", amount_cents: -2500, reason_code: "SAME_CODE" }
              as: PlatformAdmin
              captures: { first_entry_id: $.data.id }
            - call: "POST /v1/orders/${ord_id}/fee-ledger-entries"
              payload: { entry_type: "DELIVERY_FEE_CHARGE", amount_cents: -2500, reason_code: "SAME_CODE" }
              as: PlatformAdmin
              captures: { second_entry_id: $.data.id }
          assert:
            - "the two accepted postings produce two distinct entries, \"${first_entry_id}\" != \"${second_entry_id}\""
            - "GET /v1/orders/${ord_id}/fee-ledger-entries reports exactly 3 rows with total_count 3"
            - "GET /v1/buyers/${byr_id} reports order_credit_balance_cents == 20000"
            - "a posting with amount_cents \"not a number\" returns 400 with error_id == ERR_INVALID_REQUEST and the ledger stays at 3 rows"

      - name: pagination_interacts_with_the_status_filter_and_reports_total_count
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/v1/orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count counts the whole filtered set rather than the page, so a limit of 1 over three DRAFT orders returns one row with total_count 3 and has_more true, and the second page returns the remainder with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; three DRAFT orders for one buyer."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/orders"
              payload: { buyer_id: "${byr_id}", status: "DRAFT", limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { page1_id: "$.data[0].id" }
            - call: "GET /v1/orders"
              payload: { buyer_id: "${byr_id}", status: "DRAFT", limit: 1, offset: 2 }
              as: PlatformAdmin
              captures: { page3_id: "$.data[0].id" }
          assert:
            - "the first page returns exactly 1 row and reports total_count 3 with has_more true"
            - "the offset-2 page returns exactly 1 row and reports total_count 3 with has_more false"
            - "\"${page1_id}\" and \"${page3_id}\" are two different orders, so the two pages did not overlap"
            - "GET /v1/orders?buyer_id=${byr_id} with no limit returns all 3 rows and offset defaults to 0"
            - "GET /v1/orders?limit=101 returns 400 with error_id == ERR_INVALID_REQUEST"