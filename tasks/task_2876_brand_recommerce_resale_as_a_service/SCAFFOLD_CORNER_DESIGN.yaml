              as_user_id: "merch-001"
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_a}", product_category: "OUTERWEAR", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { camp_id: "$.data.id" }
            - call: "GET /recommerce/channels/${chan_a}/markdown-campaigns"
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { list_camp: "$.data[0].id", list_cat: "$.data[0].product_category" }
            - call: "GET /recommerce/channels/${chan_b}/markdown-campaigns"
              as: MerchandisingManager
              as_user_id: "merch-001"
            - call: "PATCH /recommerce/channels/${chan_a}"
              payload: { status: "PAUSED" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { p_status: "$.data.status", p_ver: "$.data.version", p_code: "$.data.code" }
          assert:
            - "${r_code} == RESALE-MP, ${r_type} == RESALE_MARKETPLACE, ${r_assort} == RESALE_ONLY, ${r_cap} == 7000 and ${chan_a_status} == ACTIVE (the default)"
            - "${r_ver} == ${chan_a_ver} — a GET never bumps version"
            - "the first sub-resource listing returns total_count 0 and has_more false"
            - "after the campaign is created the same listing returns total_count 1 with ${list_camp} == ${camp_id} and ${list_cat} == OUTERWEAR, while channel B's listing still returns total_count 0"
            - "${p_status} == PAUSED, ${p_code} == RESALE-MP (untouched by the PATCH) and ${p_ver} == ${chan_a_ver} + 1"

