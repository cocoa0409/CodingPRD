              payload: { tier_provided: "STANDARD" }
              as: Surgeon
              captures: { cl: $.data.id, req: $.data.tier_required, cleared: $.data.cleared }
          assert:
            - "ClearanceRecord.${cl}.tier_required == MEDICAL"
            - "ClearanceRecord.${cl}.cleared == false"

