              as: Owner
              as_user_id: "${o5_id}"
              captures: { p5_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${o5_id}", sitter_id: "${s5_id}", pet_id: "${p5_id}", scheduled_at: "2026-06-06T07:30:00Z" }
              as: Owner
              as_user_id: "${o5_id}"
              captures: { mg5_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mg5_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${o5_id}"
            - call: "POST /api/v1/bookings"
