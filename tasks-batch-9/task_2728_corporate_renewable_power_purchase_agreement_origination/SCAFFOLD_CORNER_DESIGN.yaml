      - name: two_individually_valid_shares_are_collectively_over_contracted_mw
        claim_type: aggregate_validation
        grounds:
          - validations.priority_30_ERR_ALLOCATION_EXCEEDS_CONTRACTED_MW
          - endpoints.POST_/ppa/allocations/{id}/decision
          - endpoints.POST_/ppa/deals/{id}/allocations
          - entities.Deal.fields.confirmed_allocated_mw
        distinguishing_aspect: |
          Neither 15.000 MW share is individually invalid against a 25.000 MW deal, and
          proposal is not the checkpoint - two PROPOSED shares summing to 30.000 MW sit
          side by side without complaint. The aggregate is only tested at CONFIRM, and
          only over CONFIRMED rows, so the second buyer's confirmation is refused by
          arithmetic that involves a row it does not own. The remedy is a withdraw and a
          re-proposal at 10.000 MW, whose confirmation lands exactly on contracted_mw -
          equality is allowed and drives unallocated_mw to 0.000.
        test_recipe:
          setup:
            - "CHAIN A, with a second QUALIFIED buyer (Cascadia Foods, credit_score 75.60 STANDARD, sustainability_score 70.00) so that both named offtakers pass the allocation-create qualification gate."
