  # =============================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offer_decline_promotes_waitlist_creates_new_offer_depth3
        grounds:
          - state_machines.Offer.OFFERED_to_DECLINED
          - state_machines.WaitlistEntry.ACTIVE_to_PROMOTED
          - state_machines.Application.WAITLISTED_to_ACCEPTED
        distinguishing_aspect: |
          Depth-3 transitive cascade: (1) Guardian POSTs decline -> Offer transitions OFFERED->DECLINED, (2) the Offer change CAUSES the linked Application (ACCEPTED) to transition to DECLINED and a separate WaitlistEntry promotion fires: top ACTIVE WaitlistEntry -> PROMOTED, (3) the WaitlistEntry promotion CAUSES its Application to transition WAITLISTED->ACCEPTED AND a new Offer with source=WAITLIST_PROMOTION to be CREATED. Three hops, each caused by the previous. Trigger: Offer decline.
        test_recipe:
          setup:
            - "Window LOTTERY_RUN. School S07 total_seats=1 with 2 SUBMITTED apps. After run-lottery: top app ACCEPTED with OFFERED offer; bottom app WAITLISTED with ACTIVE waitlist entry (queue_rank=1)."
