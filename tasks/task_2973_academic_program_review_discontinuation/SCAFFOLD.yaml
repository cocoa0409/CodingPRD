# =============================================================================
# SCAFFOLD — Academic Program Review & Discontinuation (university provost office)
# §1.0–§1.7 seed tables. Single source of truth for PRD, unit tests, and
# reference implementation.
# =============================================================================

scenario: "2973. Academic Program Review & Discontinuation (university provost office): review cycle scheduling with self-study, external reviewer visit and response, viability metrics on enrollment, cost per credit hour, completions and market demand, program improvement plan versus consolidation or discontinuation decisions, teach-out plan development with student advising and course guarantees, faculty reassignment, tenure obligations and staffing reduction sequencing, accreditor and state agency notification requirements, catalog, marketing and admissions suppression coordination, post-decision monitoring of displaced student completion"

domain_name: academic-program-review-discontinuation
api_prefix: /provost

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Program-rooted tree (program -> review cycle -> self-study / visits / decision
  # -> teach-out plan -> guarantees / students) crossed by two self-referential
  # program edges (consolidation target, decision receiving program) and by
  # cross-aggregate gates (decision <-> agency notification, faculty appointment
  # <-> teach-out plan).

  state_machine_shape: parallel
  # AcademicProgram carries two independent state axes on one row
  # (lifecycle_state x catalog_status). ReviewCycle and SelfStudy are cyclic
  # (revision / addendum loops), DecisionRecord and FacultyAppointment branch
  # with divergent side-effect sets, TeachOutPlan is compound (auto-completes
  # from child DisplacedStudent states).

  relationship_patterns:
    - one_to_many
    - self_referential      # AcademicProgram.consolidated_into_program_id
    - cross_aggregate       # DecisionRecord <-> AgencyNotification, FacultyAppointment <-> TeachOutPlan

  role_model: segregation_of_duties
  # A DecisionRecord MUST be ratified by a Provost whose X-User-ID differs from
  # the proposing Provost's X-User-ID, and effectuation is owned by a different
  # role entirely (ReviewCoordinator).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 43 endpoints / 9 state machines / 6 calculation rules /
  # 2 OCC rules. Density targets: dual-variant cost accounting vs dual-variant
  # student projection, a pinned rounding order, a pinned waterfall evaluation
  # order, two interval-overlap geometries, and two conserved quantities.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: AcademicProgram
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Institutional program code, unique across all AcademicProgram rows
        constraints: 4-12 chars, uppercase A-Z, digits and '-' only
      - name: name
        type: string
        source: input
        description: Human-readable program title
        constraints: 1-200 chars
      - name: degree_level
        type: enum
        source: input
        description: Award level; selects the composite-score weight vector in §1.3 program_viability_composite
        constraints: "UNDERGRADUATE | GRADUATE | CERTIFICATE"
      - name: department_code
        type: string
        source: input
        description: Owning department code (opaque string, no entity behind it)
        constraints: 2-12 chars
      - name: host_capacity_per_day
        type: integer
        source: input
        description: Maximum number of reviewer visits whose UTC calendar-day spans may intersect on this program (aggregate hosting capacity, §1.4 priority 66)
        default: 2
        constraints: 1..5
      - name: lifecycle_state
        type: enum
        source: system
        description: Review/discontinuation lifecycle axis (independent of catalog_status)
        default: ACTIVE
        constraints: "ACTIVE | UNDER_REVIEW | IMPROVEMENT_MONITORED | CONSOLIDATION_PENDING | TEACH_OUT_PENDING | TEACH_OUT_ACTIVE | DISCONTINUED | CONSOLIDATED"
      - name: catalog_status
        type: enum
        source: system
        description: Catalog / marketing / admissions suppression axis (independent of lifecycle_state)
        default: LISTED
        constraints: "LISTED | MARKETING_SUPPRESSED | ADMISSIONS_CLOSED | CATALOG_WITHDRAWN"
      - name: catalog_status_pre_decision
        type: enum
        source: system
        description: catalog_status captured immediately before a DecisionRecord ratification mutated it; restored verbatim on rescission
        default: null
        constraints: "null | LISTED | MARKETING_SUPPRESSED | ADMISSIONS_CLOSED | CATALOG_WITHDRAWN"
      - name: consolidated_into_program_id
        type: string
        source: system
        description: "FK -> AcademicProgram.id; null until a CONSOLIDATION DecisionRecord is effectuated, then the receiving program's id (self-referential)"
        default: null
      - name: discontinuation_override
        type: boolean
        source: system
        description: Set true when an IMPROVEMENT_PLAN decision on this program is evaluated UNMET; permits a DISCONTINUATION outcome regardless of viability_band
        default: false
      - name: snapshot_count
        type: integer
        source: computed
        description: Count of ViabilityMetricSnapshot rows whose program_id is this program
      - name: cost_per_credit_hour_rolling_cents
        type: integer
        source: computed
        description: "§1.3 program_cost_per_credit_hour, variant rolling_three_term; null when the window's credit_hours sum is 0"
      - name: cost_per_credit_hour_latest_cents
        type: integer
        source: computed
        description: "§1.3 program_cost_per_credit_hour, variant latest_term; null when the newest snapshot's credit_hours is 0"
      - name: composite_score
        type: number
        source: computed
        description: "§1.3 program_viability_composite result, 2 decimals; null when snapshot_count == 0"
      - name: viability_band
        type: enum
        source: computed
        description: Band derived from composite_score; gates permitted DecisionRecord outcomes
        constraints: "CONTINUE_ELIGIBLE | IMPROVEMENT_ELIGIBLE | NONVIABLE | INSUFFICIENT_DATA"
      - name: faculty_fte_baseline
        type: number
        source: computed
        description: Sum of fte over every FacultyAppointment row whose program_id is this program, in any state (2 decimals)
      - name: active_fte_total
        type: number
        source: computed
        description: Sum of fte over FacultyAppointment rows with state IN {ASSIGNED, TEACH_OUT_RETAINED, REASSIGNMENT_PROPOSED, NOTICE_ISSUED} (2 decimals)
      - name: reassigned_fte_total
        type: number
        source: computed
        description: Sum of fte over FacultyAppointment rows with state == REASSIGNED (2 decimals)
      - name: separated_fte_total
        type: number
        source: computed
        description: Sum of fte over FacultyAppointment rows with state == SEPARATED (2 decimals)
      - name: assigned_pool_fte
        type: number
        source: computed
        description: Sum of fte over FacultyAppointment rows with state == ASSIGNED only; the staffing-reduction candidate pool (2 decimals)
      - name: retained_teach_out_fte
        type: number
        source: computed
        description: "§1.3 staffing_reduction_waterfall step 1 output (2 decimals)"
      - name: reducible_fte
        type: number
        source: computed
        description: "§1.3 staffing_reduction_waterfall step 2 output (2 decimals)"
      - name: severance_budget_cap_cents
        type: integer
        source: computed
        description: "§1.3 staffing_reduction_waterfall step 3 output"
      - name: staffing_liability_cents
        type: integer
        source: computed
        description: "§1.3 staffing_reduction_waterfall step 4 accumulated notice-pay liability"
      - name: deferred_fte
        type: number
        source: computed
        description: "§1.3 staffing_reduction_waterfall step 4 overflow FTE that the severance cap defers (2 decimals)"

  - name: ViabilityMetricSnapshot
    parent: AcademicProgram
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AcademicProgram.id; supplied by the path segment on POST /provost/academic-programs/{id}/metric-snapshots"
      - name: term_code
        type: string
        source: input
        description: Display code of the academic term (e.g. "2026FA")
        constraints: 4-10 chars
      - name: term_index
        type: integer
        source: input
        description: Monotonic term ordinal; unique per program and the only ordering key for windows
        constraints: ">= 1; unique per program_id"
      - name: enrollment_headcount
        type: integer
        source: input
        description: Distinct students enrolled in the program that term
        constraints: ">= 0"
      - name: credit_hours
        type: integer
        source: input
        description: Student credit hours the program delivered that term
        constraints: ">= 0"
      - name: direct_cost_cents
        type: integer
        source: input
        description: Direct instructional cost attributed to the program that term, in cents
        constraints: ">= 0"
      - name: completions_count
        type: integer
        source: input
        description: Degrees/certificates awarded that term
        constraints: ">= 0"
      - name: market_demand_index
        type: integer
        source: input
        description: External labour-market demand index for the program that term
        constraints: 0..100
      - name: cost_per_credit_hour_cents
        type: integer
        source: computed
        description: Per-term diagnostic value round_half_up(direct_cost_cents / credit_hours); null when credit_hours == 0. NEVER an input to the rolling window aggregate (see §1.3 rounding-order pin)

  - name: ReviewCycle
    parent: AcademicProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AcademicProgram.id; supplied by the path segment on POST /provost/academic-programs/{id}/review-cycles"
      - name: cycle_year
        type: integer
        source: input
        description: Academic year label of the review cycle
        constraints: 2000..2100
      - name: state
        type: enum
        source: system
        description: Cycle workflow state; see §1.2 ReviewCycle
        default: SELF_STUDY_OPEN
        constraints: "SELF_STUDY_OPEN | SELF_STUDY_ACCEPTED | VISIT_SCHEDULED | VISIT_COMPLETED | REPORT_RECEIVED | ADDENDUM_REQUESTED | RESPONSE_SUBMITTED | DECISION_PROPOSED | DECIDED | CLOSED"
      - name: self_study_due_at
        type: datetime
        source: input
        description: Instant after which self-study submission is refused (ISO 8601 UTC, 3 fractional digits)
      - name: required_section_codes
        type: array
        source: input
        description: Section codes the self-study MUST contain before it can be submitted
        constraints: non-empty array of 1-20 char uppercase codes
      - name: addendum_round
        type: integer
        source: system
        description: Number of reviewer addenda requested by DISPUTE responses on this cycle
        default: 0
        constraints: 0..2
      - name: response_concurrence
        type: enum
        source: system
        description: Program's concurrence with the latest reviewer report
        default: null
        constraints: "null | CONCUR | PARTIAL_CONCUR | DISPUTE"
      - name: response_text
        type: string
        source: system
        description: Program response narrative as submitted
        default: null
      - name: disputed_finding_codes
        type: array
        source: system
        description: Finding codes the program disputes; MUST be a subset of the latest ReviewerReport.finding_codes
        default: []
      - name: response_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest program response
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant at which a DecisionRecord for this cycle was ratified
        default: null
      - name: compliance_posture
        type: enum
        source: computed
        description: NOT_APPLICABLE while no AgencyNotification exists for the cycle's decisions; NOTICES_PENDING while any such notification is in {PENDING, SENT, OVERDUE}; NOTICES_CLEARED when at least one exists and all are in {ACKNOWLEDGED, VOIDED}
        constraints: "NOT_APPLICABLE | NOTICES_PENDING | NOTICES_CLEARED"

  - name: SelfStudy
    parent: ReviewCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id; supplied by the path segment on POST /provost/review-cycles/{id}/self-studies. At most one SelfStudy per cycle"
      - name: narrative
        type: string
        source: input
        description: Self-study narrative text
        constraints: 1-20000 chars
      - name: section_codes
        type: array
        source: input
        description: Section codes present in this self-study
        constraints: array of 1-20 char uppercase codes; MAY be empty at creation
      - name: state
        type: enum
        source: system
        description: See §1.2 SelfStudy (DRAFT <-> SUBMITTED revision loop)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED"
      - name: revision_round
        type: integer
        source: system
        description: Number of times the coordinator returned this self-study to DRAFT
        default: 0
        constraints: 0..2
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submission
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of acceptance
        default: null
      - name: revision_notes
        type: string
        source: system
        description: Coordinator's notes from the most recent RETURN
        default: null
      - name: attestation_note
        type: string
        source: system
        description: Chair's attestation text captured on the most recent submission
        default: null
      - name: missing_section_codes
        type: array
        source: computed
        description: Elements of the parent cycle's required_section_codes absent from section_codes, in the cycle's declared order

  - name: ExternalReviewer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Reviewer's name
        constraints: 1-120 chars
      - name: institution
        type: string
        source: input
        description: Reviewer's home institution
        constraints: 1-120 chars
      - name: specialty_code
        type: string
        source: input
        description: Disciplinary specialty code
        constraints: 2-20 chars
      - name: conflict_program_codes
        type: array
        source: input
        description: AcademicProgram.code values this reviewer is conflicted out of
        default: []
        constraints: array of 4-12 char program codes
      - name: travel_buffer_hours
        type: integer
        source: input
        description: Minimum gap this reviewer requires between the end of one visit window and the start of the next
        default: 48
        constraints: 0..168
      - name: visit_count
        type: integer
        source: computed
        description: Count of ReviewerVisit rows whose reviewer_id is this reviewer, in any state

  - name: ReviewerVisit
    parent: ReviewCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id; the review cycle this visit serves"
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> ExternalReviewer.id; the visiting reviewer"
      - name: window_start_at
        type: datetime
        source: input
        description: Inclusive start instant of the visit window (ISO 8601 UTC, 3 fractional digits)
      - name: window_end_at
        type: datetime
        source: input
        description: Exclusive end instant of the visit window; MUST be strictly after window_start_at
      - name: state
        type: enum
        source: system
        description: See §1.2 ReviewerVisit
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | REPORTED"
      - name: span_start_date
        type: string
        source: computed
        description: UTC calendar date of window_start_at, YYYY-MM-DD; left endpoint of the inclusive day span used by the program hosting-capacity rule
      - name: span_end_date
        type: string
        source: computed
        description: UTC calendar date of window_end_at, YYYY-MM-DD; right endpoint of the inclusive day span (the end day counts even when window_end_at is exactly midnight)
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the visit was marked complete
        default: null
      - name: report_count
        type: integer
        source: computed
        description: Count of ReviewerReport rows whose visit_id is this visit

  - name: ReviewerReport
    parent: ReviewerVisit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> ReviewerVisit.id; supplied by the path segment on POST /provost/reviewer-visits/{id}/reports"
      - name: recommendation
        type: enum
        source: input
        description: Reviewer's recommendation for the program
        constraints: "CONTINUE | IMPROVE | CONSOLIDATE | DISCONTINUE"
      - name: finding_codes
        type: array
        source: input
        description: Finding codes raised by the reviewer; the program may dispute only codes drawn from the newest report
        constraints: non-empty array of 1-20 char uppercase codes
      - name: narrative
        type: string
        source: input
        description: Report body text
        constraints: 1-20000 chars
      - name: sequence_number
        type: integer
        source: computed
        description: 1 for the initial report on the visit, 2 for the first addendum, 3 for the second
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the report was filed (append-only; reports are never mutated)

  - name: DecisionRecord
    parent: ReviewCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ReviewCycle.id; supplied by the path segment on POST /provost/review-cycles/{id}/decision-records"
      - name: outcome
        type: enum
        source: input
        description: Provost's decision branch; each branch has its own side-effect set in §1.2 DecisionRecord
        constraints: "CONTINUE | IMPROVEMENT_PLAN | CONSOLIDATION | DISCONTINUATION"
      - name: rationale
        type: string
        source: input
        description: Written rationale
        constraints: 1-5000 chars
      - name: effective_term_index
        type: integer
        source: input
        description: Term ordinal from which the decision takes effect
        constraints: ">= 1"
      - name: receiving_program_id
        type: string
        source: input
        description: "FK -> AcademicProgram.id; REQUIRED when outcome == CONSOLIDATION, MUST be null otherwise; MUST differ from the reviewed program"
        default: null
      - name: improvement_target_score
        type: number
        source: input
        description: composite_score the program must reach by improvement_review_term_index; REQUIRED when outcome == IMPROVEMENT_PLAN, MUST be null otherwise
        default: null
        constraints: 0.00..100.00, 2 decimals
      - name: improvement_review_term_index
        type: integer
        source: input
        description: Term ordinal at which the improvement plan is evaluated; REQUIRED when outcome == IMPROVEMENT_PLAN, MUST be null otherwise
        default: null
        constraints: ">= 1"
      - name: improvement_milestones
        type: array
        source: input
        description: Ordered milestone descriptions for the improvement plan
        default: []
        constraints: array of 1-200 char strings
      - name: state
        type: enum
        source: system
        description: See §1.2 DecisionRecord
        default: PROPOSED
        constraints: "PROPOSED | RATIFIED | EFFECTUATED | RESCINDED | WITHDRAWN"
      - name: improvement_state
        type: enum
        source: system
        description: NOT_APPLICABLE unless outcome == IMPROVEMENT_PLAN; ACTIVE from effectuation; MET/UNMET after evaluation
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | ACTIVE | MET | UNMET"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Provost who created the record (segregation-of-duties comparand)
      - name: ratified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ratifying Provost; MUST differ from proposed_by_user_id
        default: null
      - name: ratification_note
        type: string
        source: system
        description: Optional note captured at ratification
        default: null
      - name: ratified_at
        type: datetime
        source: system
        description: Logical-clock instant of ratification; the origin for every AgencyNotification.due_at on this decision
        default: null
      - name: effectuated_at
        type: datetime
        source: system
        description: Logical-clock instant of effectuation
        default: null
      - name: rescission_reason
        type: string
        source: system
        description: Reason captured on rescission
        default: null
      - name: composite_score_at_proposal
        type: number
        source: system
        description: AcademicProgram.composite_score frozen at proposal time
        default: null
      - name: viability_band_at_proposal
        type: enum
        source: system
        description: AcademicProgram.viability_band frozen at proposal time
        constraints: "CONTINUE_ELIGIBLE | IMPROVEMENT_ELIGIBLE | NONVIABLE | INSUFFICIENT_DATA"
      - name: notification_count
        type: integer
        source: computed
        description: Count of AgencyNotification rows whose decision_id is this decision, in any status
      - name: unacknowledged_notification_count
        type: integer
        source: computed
        description: Count of AgencyNotification rows whose decision_id is this decision with status IN {PENDING, SENT, OVERDUE}

  - name: AgencyNotification
    parent: DecisionRecord
    common_fields: true
    fields:
      - name: decision_id
        type: string
        source: input
        description: "FK -> DecisionRecord.id; supplied by the path segment on POST /provost/decision-records/{id}/agency-notifications"
      - name: agency_type
        type: enum
        source: input
        description: Notification recipient class; selects the statutory notice window constant in §1.3 agency_notice_deadline
        constraints: "ACCREDITOR | STATE_AGENCY | FEDERAL"
      - name: agency_code
        type: string
        source: input
        description: Recipient agency identifier
        constraints: 2-20 chars
      - name: status
        type: enum
        source: system
        description: See §1.2 AgencyNotification
        default: PENDING
        constraints: "PENDING | SENT | ACKNOWLEDGED | OVERDUE | VOIDED"
      - name: due_at
        type: datetime
        source: computed
        description: "§1.3 agency_notice_deadline result; ratified_at + AGENCY_NOTICE_DAYS[agency_type] * 24h"
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant the notice was transmitted
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant the agency acknowledgement was recorded
        default: null
      - name: transmitted_reference
        type: string
        source: system
        description: Transmission reference captured on SEND
        default: null
      - name: origin
        type: enum
        source: system
        description: AUTO_MINTED when created by a ratification cascade, MANUAL when created through the agency-notifications endpoint
        default: MANUAL
        constraints: "AUTO_MINTED | MANUAL"
      - name: overdue_marked_at
        type: datetime
        source: system
        description: Logical-clock instant a compliance sweep moved the notice to OVERDUE
        default: null

  - name: TeachOutPlan
    parent: AcademicProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AcademicProgram.id; supplied by the path segment on POST /provost/academic-programs/{id}/teach-out-plans"
      - name: decision_id
        type: string
        source: input
        description: "FK -> DecisionRecord.id; the decision this plan discharges; MUST belong to a cycle on the same program and have outcome IN {CONSOLIDATION, DISCONTINUATION}"
      - name: last_admit_term_index
        type: integer
        source: input
        description: Final term in which the program may admit new students
        constraints: ">= 1"
      - name: first_teach_out_term_index
        type: integer
        source: input
        description: First term of the teach-out window; the base term for student completion projections
        constraints: ">= 1; MUST be > last_admit_term_index"
      - name: final_award_term_index
        type: integer
        source: input
        description: Last term in which the program may award a credential; students projected beyond it are at risk
        constraints: ">= 1; MUST be >= first_teach_out_term_index"
      - name: state
        type: enum
        source: system
        description: See §1.2 TeachOutPlan
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | IN_EFFECT | COMPLETED | SUPERSEDED"
      - name: plan_revision_round
        type: integer
        source: system
        description: Number of times the provost returned this plan to DRAFT
        default: 0
        constraints: 0..3
      - name: revision_notes
        type: string
        source: system
        description: Provost notes from the most recent RETURN
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of approval
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant the plan entered IN_EFFECT
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the plan auto-completed
        default: null
      - name: guaranteed_seat_total
        type: integer
        source: computed
        description: Sum of seats_guaranteed over CourseGuarantee rows on this plan with status IN {PLANNED, OFFERED, SUBSTITUTED}
      - name: committed_seat_total
        type: integer
        source: computed
        description: Sum of seats_committed over CourseGuarantee rows on this plan with status IN {PLANNED, OFFERED, SUBSTITUTED}
      - name: required_seat_total
        type: integer
        source: computed
        description: Sum of required_seat_count over DisplacedStudent rows on this plan with advising_status IN {PENDING, ADVISED, PLAN_SIGNED}
      - name: seat_shortfall
        type: integer
        source: computed
        description: max(0, required_seat_total - guaranteed_seat_total)
      - name: at_risk_student_count
        type: integer
        source: computed
        description: Count of DisplacedStudent rows on this plan with at_risk == true and advising_status IN {PENDING, ADVISED, PLAN_SIGNED}
      - name: open_student_count
        type: integer
        source: computed
        description: Count of DisplacedStudent rows on this plan with advising_status IN {PENDING, ADVISED, PLAN_SIGNED}
      - name: substituted_guarantee_count
        type: integer
        source: computed
        description: Count of CourseGuarantee rows on this plan with status == SUBSTITUTED
      - name: waived_guarantee_count
        type: integer
        source: computed
        description: Count of CourseGuarantee rows on this plan with status == WAIVED

  - name: CourseGuarantee
    parent: TeachOutPlan
    common_fields: true
    fields:
      - name: teach_out_plan_id
        type: string
        source: input
        description: "FK -> TeachOutPlan.id; supplied by the path segment on POST /provost/teach-out-plans/{id}/course-guarantees"
      - name: course_code
        type: string
        source: input
        description: Guaranteed course code
        constraints: 3-16 chars
      - name: term_index
        type: integer
        source: input
        description: Term ordinal in which the course is guaranteed to run
        constraints: ">= 1"
      - name: seats_guaranteed
        type: integer
        source: input
        description: Seats the institution guarantees in this offering
        constraints: ">= 1"
      - name: seats_committed
        type: integer
        source: computed
        description: Seats currently held by DisplacedStudent commitments (raised by COMMIT, lowered by RELEASE)
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: seats_guaranteed - seats_committed
      - name: status
        type: enum
        source: system
        description: See §1.2 CourseGuarantee
        default: PLANNED
        constraints: "PLANNED | OFFERED | SUBSTITUTED | WAIVED"
      - name: substitute_course_code
        type: string
        source: system
        description: Replacement course code recorded by a SUBSTITUTE action
        default: null
      - name: substitution_justification
        type: string
        source: system
        description: Justification recorded by a SUBSTITUTE action
        default: null
      - name: waived_reason_code
        type: string
        source: system
        description: Reason code recorded by a WAIVE action
        default: null

  - name: DisplacedStudent
    parent: TeachOutPlan
    common_fields: true
    fields:
      - name: teach_out_plan_id
        type: string
        source: input
        description: "FK -> TeachOutPlan.id; supplied by the path segment on POST /provost/teach-out-plans/{id}/displaced-students"
      - name: student_number
        type: string
        source: input
        description: Registrar student number; unique within the plan
        constraints: 4-20 chars
      - name: credits_remaining
        type: integer
        source: input
        description: Credits the student still needs to complete the program
        constraints: ">= 0"
      - name: max_credits_per_term
        type: integer
        source: input
        description: Maximum credits the student may carry per term; denominator of the OPTIMISTIC_FULL_LOAD projection variant
        constraints: 1..21
      - name: advised_credits_per_term
        type: integer
        source: system
        description: Credits per term agreed at advising; denominator of the CONSERVATIVE_ADVISED_LOAD projection variant
        default: null
        constraints: "null or 1..21"
      - name: advising_status
        type: enum
        source: system
        description: See §1.2 DisplacedStudent
        default: PENDING
        constraints: "PENDING | ADVISED | PLAN_SIGNED | COMPLETED | WITHDRAWN"
      - name: projection_variant
        type: enum
        source: computed
        description: OPTIMISTIC_FULL_LOAD while advising_status == PENDING; CONSERVATIVE_ADVISED_LOAD once advising_status IN {ADVISED, PLAN_SIGNED, COMPLETED, WITHDRAWN}
        constraints: "OPTIMISTIC_FULL_LOAD | CONSERVATIVE_ADVISED_LOAD"
      - name: projected_terms_remaining
        type: integer
        source: computed
        description: "§1.3 displaced_student_completion_projection result"
      - name: projected_completion_term_index
        type: integer
        source: computed
        description: plan.first_teach_out_term_index + projected_terms_remaining - 1; null when projected_terms_remaining == 0
      - name: at_risk
        type: boolean
        source: computed
        description: true when projected_completion_term_index is non-null and greater than the plan's final_award_term_index
      - name: required_seat_count
        type: integer
        source: computed
        description: ceil(credits_remaining / CREDITS_PER_COURSE) using CREDITS_PER_COURSE = 3
      - name: committed_seat_count
        type: integer
        source: computed
        description: Total seats this student currently holds across CourseGuarantee commitments on the same plan
        default: 0
      - name: completion_term_index
        type: integer
        source: system
        description: Term ordinal recorded when the student completed
        default: null
      - name: withdrawal_reason_code
        type: string
        source: system
        description: Reason code recorded when the student withdrew
        default: null
      - name: advised_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent advising record
        default: null

  - name: FacultyAppointment
    parent: AcademicProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> AcademicProgram.id; supplied by the path segment on POST /provost/academic-programs/{id}/faculty-appointments"
      - name: faculty_number
        type: string
        source: input
        description: HR faculty number; unique within the program
        constraints: 4-20 chars
      - name: tenure_status
        type: enum
        source: input
        description: Tenure class; sets both the waterfall tier rank (ADJUNCT 1, NON_TENURE_TRACK 2, TENURE_TRACK 3, TENURED 4) and the statutory notice length
        constraints: "TENURED | TENURE_TRACK | NON_TENURE_TRACK | ADJUNCT"
      - name: fte
        type: number
        source: input
        description: Appointment load as a fraction of full time
        constraints: 0.01..1.00, exactly 2 decimals
      - name: annual_salary_cents
        type: integer
        source: input
        description: Full-time-equivalent annual salary in cents (multiplied by fte in the notice-pay formula)
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: See §1.2 FacultyAppointment
        default: ASSIGNED
        constraints: "ASSIGNED | TEACH_OUT_RETAINED | REASSIGNMENT_PROPOSED | REASSIGNED | NOTICE_ISSUED | SEPARATED"
      - name: reassigned_to_department_code
        type: string
        source: system
        description: Destination department code captured by PROPOSE_REASSIGNMENT and cleared by WITHDRAW_REASSIGNMENT
        default: null
      - name: notice_days
        type: integer
        source: system
        description: Notice period recorded by ISSUE_NOTICE; MUST be >= STATUTORY_NOTICE_DAYS for the tenure_status
        default: null
      - name: notice_issued_at
        type: datetime
        source: system
        description: Logical-clock instant the notice was issued
        default: null
      - name: separated_at
        type: datetime
        source: system
        description: Logical-clock instant of separation
        default: null
      - name: reassignment_withdraw_count
        type: integer
        source: system
        description: Number of times a proposed reassignment on this appointment was withdrawn
        default: 0
      - name: notice_pay_cents
        type: integer
        source: computed
        description: "§1.3 staffing_reduction_waterfall notice_pay(appointment); independent of state"
      - name: reduction_sequence_position
        type: integer
        source: computed
        description: 1-based position of this appointment in the program's staffing-reduction waterfall; null when the appointment is not a funded candidate
        default: null

# =============================================================================
# §1.2 State Machine Table
# AcademicProgram carries TWO independent state axes on one row; they are
# declared as two machines over the same entity (state_field pins the axis).
# =============================================================================

state_machines:

  - entity: AcademicProgram
    state_field: lifecycle_state
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED, CONSOLIDATED]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /provost/academic-programs/{id}/review-cycles"
        actor: ReviewCoordinator
        preconditions:
          - "program.lifecycle_state == ACTIVE"
          - "no ReviewCycle on this program has state NOT IN {CLOSED}"
        side_effects:
          - "increments AcademicProgram.version by 1 and refreshes updated_at"
          - "creates the ReviewCycle in state SELF_STUDY_OPEN"
      - from: IMPROVEMENT_MONITORED
        to: UNDER_REVIEW
        trigger: "POST /provost/decision-records/{id}/transitions {action: EVALUATE_IMPROVEMENT} resolving UNMET"
        actor: ReviewCoordinator
        preconditions:
          - "decision.outcome == IMPROVEMENT_PLAN AND decision.state == EFFECTUATED AND decision.improvement_state == ACTIVE"
          - "program.composite_score < decision.improvement_target_score"
        side_effects:
          - "sets DecisionRecord.improvement_state = UNMET"
          - "sets AcademicProgram.discontinuation_override = true"
          - "reopens the cycle: ReviewCycle CLOSED -> RESPONSE_SUBMITTED so a replacement decision can be proposed"
        note: "Escalation path — a failed improvement plan makes DISCONTINUATION permissible regardless of viability_band."
      - from: IMPROVEMENT_MONITORED
        to: ACTIVE
        trigger: "POST /provost/decision-records/{id}/transitions {action: EVALUATE_IMPROVEMENT} resolving MET"
        actor: ReviewCoordinator
        preconditions:
          - "decision.outcome == IMPROVEMENT_PLAN AND decision.state == EFFECTUATED AND decision.improvement_state == ACTIVE"
          - "program.composite_score >= decision.improvement_target_score"
        side_effects:
          - "sets DecisionRecord.improvement_state = MET"
          - "ReviewCycle CLOSED -> CLOSED (no change); catalog_status untouched"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "DecisionRecord ratification cascade, outcome CONTINUE"
        actor: system
        preconditions:
          - "the ratified decision's cycle_id belongs to this program"
        side_effects:
          - "no catalog_status change; catalog_status_pre_decision stays null"
      - from: UNDER_REVIEW
        to: IMPROVEMENT_MONITORED
        trigger: "DecisionRecord ratification cascade, outcome IMPROVEMENT_PLAN"
        actor: system
        preconditions:
          - "the ratified decision's cycle_id belongs to this program"
        side_effects:
          - "sets DecisionRecord.improvement_state = ACTIVE at effectuation (not at ratification)"
          - "no AgencyNotification rows are minted for this branch"
      - from: UNDER_REVIEW
        to: CONSOLIDATION_PENDING
        trigger: "DecisionRecord ratification cascade, outcome CONSOLIDATION"
        actor: system
        preconditions:
          - "the ratified decision's cycle_id belongs to this program"
          - "decision.receiving_program_id is non-null"
        side_effects:
          - "catalog_status_pre_decision := catalog_status, then catalog_status LISTED -> MARKETING_SUPPRESSED"
          - "mints AgencyNotification rows (ACCREDITOR, STATE_AGENCY) with origin AUTO_MINTED"
      - from: UNDER_REVIEW
        to: TEACH_OUT_PENDING
        trigger: "DecisionRecord ratification cascade, outcome DISCONTINUATION"
        actor: system
        preconditions:
          - "the ratified decision's cycle_id belongs to this program"
        side_effects:
          - "catalog_status_pre_decision := catalog_status, then catalog_status LISTED -> MARKETING_SUPPRESSED"
          - "mints AgencyNotification rows (ACCREDITOR, STATE_AGENCY) with origin AUTO_MINTED"
      - from: TEACH_OUT_PENDING
        to: TEACH_OUT_ACTIVE
        trigger: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE} on a DISCONTINUATION decision"
        actor: ReviewCoordinator
        preconditions:
          - "decision.state == RATIFIED"
          - "decision.unacknowledged_notification_count == 0"
          - "a TeachOutPlan for this program with decision_id == decision.id is in state APPROVED"
        side_effects:
          - "catalog_status MARKETING_SUPPRESSED -> ADMISSIONS_CLOSED"
          - "sets DecisionRecord.state = EFFECTUATED and effectuated_at = clock"
      - from: CONSOLIDATION_PENDING
        to: CONSOLIDATED
        trigger: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE} on a CONSOLIDATION decision"
        actor: ReviewCoordinator
        preconditions:
          - "decision.state == RATIFIED"
          - "decision.unacknowledged_notification_count == 0"
          - "AcademicProgram(decision.receiving_program_id).lifecycle_state == ACTIVE"
        side_effects:
          - "sets consolidated_into_program_id = decision.receiving_program_id"
          - "catalog_status MARKETING_SUPPRESSED -> ADMISSIONS_CLOSED"
          - "every FacultyAppointment on this program in state ASSIGNED moves to REASSIGNMENT_PROPOSED with reassigned_to_department_code = AcademicProgram(decision.receiving_program_id).department_code"
      - from: TEACH_OUT_ACTIVE
        to: DISCONTINUED
        trigger: "TeachOutPlan IN_EFFECT -> COMPLETED cascade"
        actor: system
        preconditions:
          - "the completing plan's program_id is this program"
        side_effects:
          - "catalog_status ADMISSIONS_CLOSED -> CATALOG_WITHDRAWN"
          - "every FacultyAppointment on this program in TEACH_OUT_RETAINED returns to ASSIGNED"
      - from: CONSOLIDATION_PENDING
        to: UNDER_REVIEW
        trigger: "POST /provost/decision-records/{id}/transitions {action: RESCIND}"
        actor: Provost
        preconditions:
          - "decision.state == RATIFIED (a plan on this program can never be IN_EFFECT yet, because ACTIVATE requires the decision to be EFFECTUATED)"
        side_effects:
          - "catalog_status := catalog_status_pre_decision, then catalog_status_pre_decision := null"
      - from: TEACH_OUT_PENDING
        to: UNDER_REVIEW
        trigger: "POST /provost/decision-records/{id}/transitions {action: RESCIND}"
        actor: Provost
        preconditions:
          - "decision.state == RATIFIED (a plan on this program can never be IN_EFFECT yet, because ACTIVATE requires the decision to be EFFECTUATED)"
        side_effects:
          - "catalog_status := catalog_status_pre_decision, then catalog_status_pre_decision := null"
          - "every TeachOutPlan on this program in {DRAFT, SUBMITTED, APPROVED} moves to SUPERSEDED"
          - "every FacultyAppointment on this program in TEACH_OUT_RETAINED returns to ASSIGNED"
      - from: IMPROVEMENT_MONITORED
        to: UNDER_REVIEW
        trigger: "POST /provost/decision-records/{id}/transitions {action: RESCIND} on an IMPROVEMENT_PLAN decision"
        actor: Provost
        preconditions:
          - "decision.state == RATIFIED"
        side_effects:
          - "sets DecisionRecord.improvement_state = NOT_APPLICABLE"

  - entity: AcademicProgram
    state_field: catalog_status
    initial_state: LISTED
    terminal_states: [CATALOG_WITHDRAWN]
    transitions:
      - from: LISTED
        to: MARKETING_SUPPRESSED
        trigger: "POST /provost/academic-programs/{id}/catalog-status {target_catalog_status: MARKETING_SUPPRESSED}"
        actor: Registrar
        preconditions:
          - "program.lifecycle_state NOT IN {DISCONTINUED, CONSOLIDATED}"
        side_effects:
          - "increments AcademicProgram.version by 1"
        note: "Registrar may suppress marketing pre-emptively on any non-terminal program; the same edge also fires as a ratification cascade with actor system."
      - from: MARKETING_SUPPRESSED
        to: LISTED
        trigger: "POST /provost/academic-programs/{id}/catalog-status {target_catalog_status: LISTED}"
        actor: Registrar
        preconditions:
          - "program.lifecycle_state IN {ACTIVE, UNDER_REVIEW, IMPROVEMENT_MONITORED}"
        side_effects:
          - "increments AcademicProgram.version by 1"
        note: "Reverse edge (cycle on the catalog axis) — blocked once the lifecycle axis has committed to consolidation or teach-out."
      - from: MARKETING_SUPPRESSED
        to: ADMISSIONS_CLOSED
        trigger: "POST /provost/academic-programs/{id}/catalog-status {target_catalog_status: ADMISSIONS_CLOSED} or the DecisionRecord EFFECTUATE cascade"
        actor: Registrar
        preconditions:
          - "program.lifecycle_state IN {UNDER_REVIEW, CONSOLIDATION_PENDING, TEACH_OUT_PENDING, TEACH_OUT_ACTIVE, CONSOLIDATED}"
        side_effects:
          - "increments AcademicProgram.version by 1"
      - from: ADMISSIONS_CLOSED
        to: CATALOG_WITHDRAWN
        trigger: "POST /provost/academic-programs/{id}/catalog-status {target_catalog_status: CATALOG_WITHDRAWN} or the TeachOutPlan COMPLETED cascade"
        actor: Registrar
        preconditions:
          - "program.lifecycle_state IN {DISCONTINUED, CONSOLIDATED}"
        side_effects:
          - "increments AcademicProgram.version by 1"
        note: "Cross-axis guard: the catalog axis cannot reach its terminal state until the lifecycle axis is terminal."

  - entity: SelfStudy
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /provost/self-studies/{id}/transitions {action: SUBMIT}"
        actor: ProgramChair
        preconditions:
          - "self_study.state == DRAFT"
          - "clock <= cycle.self_study_due_at"
          - "missing_section_codes is empty AND section_codes is non-empty"
        side_effects:
          - "sets submitted_at = clock and attestation_note from the payload"
          - "increments SelfStudy.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /provost/self-studies/{id}/transitions {action: RETURN}"
        actor: ReviewCoordinator
        preconditions:
          - "self_study.state == SUBMITTED"
          - "self_study.revision_round < 2"
        side_effects:
          - "increments revision_round by 1 and stores revision_notes"
          - "clears submitted_at"
        note: "Revision loop DRAFT -> SUBMITTED -> DRAFT; the third RETURN is refused with ERR_REVISION_LIMIT_REACHED."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /provost/self-studies/{id}/transitions {action: ACCEPT}"
        actor: ReviewCoordinator
        preconditions:
          - "self_study.state == SUBMITTED"
        side_effects:
          - "sets accepted_at = clock"
          - "parent ReviewCycle SELF_STUDY_OPEN -> SELF_STUDY_ACCEPTED"

  - entity: ReviewCycle
    initial_state: SELF_STUDY_OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: SELF_STUDY_OPEN
        to: SELF_STUDY_ACCEPTED
        trigger: "SelfStudy SUBMITTED -> ACCEPTED cascade"
        actor: system
        preconditions:
          - "the accepted self-study's cycle_id is this cycle"
        side_effects:
          - "increments ReviewCycle.version by 1"
      - from: SELF_STUDY_ACCEPTED
        to: VISIT_SCHEDULED
        trigger: "POST /provost/reviewer-visits"
        actor: ReviewCoordinator
        preconditions:
          - "cycle.state == SELF_STUDY_ACCEPTED"
        side_effects:
          - "creates the ReviewerVisit in state SCHEDULED"
          - "increments ReviewCycle.version by 1"
      - from: VISIT_SCHEDULED
        to: VISIT_SCHEDULED
        trigger: "POST /provost/reviewer-visits (an additional team member on a cycle that already has a visit)"
        actor: ReviewCoordinator
        preconditions:
          - "cycle.state == VISIT_SCHEDULED"
        side_effects:
          - "creates an additional ReviewerVisit in state SCHEDULED for a different reviewer or a different window; increments ReviewCycle.version by 1"
        note: "Self-loop: a review team may have several external reviewers, each with their own visit window. This is the only way a program can host more than one non-REPORTED visit, so it is the state the host-capacity aggregate at §1.4 priority 23 guards."
      - from: VISIT_SCHEDULED
        to: VISIT_COMPLETED
        trigger: "POST /provost/reviewer-visits/{id}/complete"
        actor: ReviewCoordinator
        preconditions:
          - "visit.state == SCHEDULED AND visit.cycle_id == cycle.id"
          - "clock >= visit.window_end_at"
          - "every OTHER ReviewerVisit on this cycle is already in state COMPLETED or REPORTED"
        side_effects:
          - "sets ReviewerVisit.state = COMPLETED and completed_at = clock"
        note: "Compound guard: with a multi-reviewer team the cycle stays in VISIT_SCHEDULED until the last outstanding visit is completed."
      - from: VISIT_COMPLETED
        to: REPORT_RECEIVED
        trigger: "POST /provost/reviewer-visits/{id}/reports (sequence_number 1)"
        actor: ExternalReviewer
        preconditions:
          - "visit.state == COMPLETED"
          - "visit.report_count == 0"
        side_effects:
          - "creates the ReviewerReport with sequence_number 1 and sets ReviewerVisit.state = REPORTED"
      - from: REPORT_RECEIVED
        to: RESPONSE_SUBMITTED
        trigger: "POST /provost/review-cycles/{id}/program-response {concurrence: CONCUR | PARTIAL_CONCUR}"
        actor: ProgramChair
        preconditions:
          - "cycle.state == REPORT_RECEIVED"
        side_effects:
          - "stores response_concurrence, response_text, disputed_finding_codes and response_submitted_at = clock"
      - from: REPORT_RECEIVED
        to: ADDENDUM_REQUESTED
        trigger: "POST /provost/review-cycles/{id}/program-response {concurrence: DISPUTE}"
        actor: ProgramChair
        preconditions:
          - "cycle.state == REPORT_RECEIVED"
          - "cycle.addendum_round < 2"
          - "disputed_finding_codes is non-empty and is a subset of the newest ReviewerReport.finding_codes on the cycle's visit"
        side_effects:
          - "increments addendum_round by 1"
          - "stores response_concurrence = DISPUTE, response_text, disputed_finding_codes, response_submitted_at = clock"
      - from: ADDENDUM_REQUESTED
        to: REPORT_RECEIVED
        trigger: "POST /provost/reviewer-visits/{id}/reports (addendum, sequence_number >= 2)"
        actor: ExternalReviewer
        preconditions:
          - "cycle.state == ADDENDUM_REQUESTED AND visit.state == REPORTED AND visit.cycle_id == cycle.id"
        side_effects:
          - "creates a ReviewerReport with sequence_number = visit.report_count + 1"
          - "clears response_concurrence, response_text, disputed_finding_codes back to null/[] so the program must respond to the addendum"
        note: "Cyclic: REPORT_RECEIVED -> ADDENDUM_REQUESTED -> REPORT_RECEIVED, bounded to 2 rounds by addendum_round."
      - from: RESPONSE_SUBMITTED
        to: DECISION_PROPOSED
        trigger: "POST /provost/review-cycles/{id}/decision-records"
        actor: Provost
        preconditions:
          - "cycle.state == RESPONSE_SUBMITTED"
          - "the cycle's SelfStudy is in state ACCEPTED"
          - "payload.expected_cycle_version == cycle.version"
        side_effects:
          - "creates the DecisionRecord in state PROPOSED"
          - "any prior DecisionRecord on this cycle in state PROPOSED moves to WITHDRAWN"
          - "increments ReviewCycle.version by 1"
      - from: DECISION_PROPOSED
        to: DECIDED
        trigger: "POST /provost/decision-records/{id}/transitions {action: RATIFY}"
        actor: Provost
        preconditions:
          - "decision.state == PROPOSED AND decision.cycle_id == cycle.id"
          - "X-User-ID != decision.proposed_by_user_id"
        side_effects:
          - "sets decided_at = decision.ratified_at"
          - "CASCADE hop 2: drives the AcademicProgram lifecycle_state branch for the ratified outcome"
      - from: DECIDED
        to: RESPONSE_SUBMITTED
        trigger: "POST /provost/decision-records/{id}/transitions {action: RESCIND}"
        actor: Provost
        preconditions:
          - "decision.state == RATIFIED AND decision.cycle_id == cycle.id"
        side_effects:
          - "clears decided_at"
          - "every AgencyNotification on the decision in {PENDING, SENT, OVERDUE} moves to VOIDED"
        note: "Cyclic: RESPONSE_SUBMITTED -> DECISION_PROPOSED -> DECIDED -> RESPONSE_SUBMITTED."
      - from: DECIDED
        to: CLOSED
        trigger: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE}"
        actor: ReviewCoordinator
        preconditions:
          - "decision.state == RATIFIED AND decision.cycle_id == cycle.id"
        side_effects:
          - "sets DecisionRecord.state = EFFECTUATED"
      - from: CLOSED
        to: RESPONSE_SUBMITTED
        trigger: "POST /provost/decision-records/{id}/transitions {action: EVALUATE_IMPROVEMENT} resolving UNMET"
        actor: ReviewCoordinator
        preconditions:
          - "decision.outcome == IMPROVEMENT_PLAN AND decision.improvement_state == ACTIVE"
          - "program.composite_score < decision.improvement_target_score"
        side_effects:
          - "sets DecisionRecord.improvement_state = UNMET and AcademicProgram.discontinuation_override = true"
        note: "Second cycle back-edge — a failed improvement plan reopens the same review cycle for a replacement decision."

  - entity: ReviewerVisit
    initial_state: SCHEDULED
    terminal_states: [REPORTED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /provost/reviewer-visits/{id}/complete"
        actor: ReviewCoordinator
        preconditions:
          - "visit.state == SCHEDULED"
          - "clock >= visit.window_end_at"
        side_effects:
          - "sets completed_at = clock"
          - "parent ReviewCycle VISIT_SCHEDULED -> VISIT_COMPLETED, but only once every other ReviewerVisit on the cycle is already COMPLETED or REPORTED; otherwise the cycle stays in VISIT_SCHEDULED"
      - from: COMPLETED
        to: REPORTED
        trigger: "POST /provost/reviewer-visits/{id}/reports"
        actor: ExternalReviewer
        preconditions:
          - "visit.state == COMPLETED AND visit.report_count == 0"
          - "X-User-ID == visit.reviewer_id"
        side_effects:
          - "creates ReviewerReport with sequence_number 1 and filed_at = clock"
          - "parent ReviewCycle VISIT_COMPLETED -> REPORT_RECEIVED"
      - from: REPORTED
        to: REPORTED
        trigger: "POST /provost/reviewer-visits/{id}/reports (addendum)"
        actor: ExternalReviewer
        preconditions:
          - "visit.state == REPORTED AND cycle.state == ADDENDUM_REQUESTED"
          - "X-User-ID == visit.reviewer_id"
        side_effects:
          - "creates ReviewerReport with sequence_number = report_count + 1"
          - "parent ReviewCycle ADDENDUM_REQUESTED -> REPORT_RECEIVED"
        note: "Self-loop: the terminal state accepts addenda only while the cycle has an open addendum request."

  - entity: DecisionRecord
    state_field: state
    initial_state: PROPOSED
    terminal_states: [EFFECTUATED, RESCINDED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /provost/review-cycles/{id}/decision-records (a later proposal supersedes this one)"
        actor: system
        preconditions:
          - "a new DecisionRecord is created on the same cycle while this one is PROPOSED"
        side_effects:
          - "increments DecisionRecord.version by 1"
      - from: PROPOSED
        to: RATIFIED
        trigger: "POST /provost/decision-records/{id}/transitions {action: RATIFY}"
        actor: Provost
        preconditions:
          - "decision.state == PROPOSED"
          - "cycle.state == DECISION_PROPOSED"
          - "X-User-ID != decision.proposed_by_user_id (segregation of duties)"
        side_effects:
          - "sets ratified_by_user_id = X-User-ID, ratification_note, ratified_at = clock; increments DecisionRecord.version by 1"
          - "CASCADE hop 1: parent ReviewCycle DECISION_PROPOSED -> DECIDED with decided_at = ratified_at"
          - "CASCADE hop 2 (caused by hop 1): because its cycle became DECIDED, AcademicProgram.lifecycle_state advances on the outcome branch — CONTINUE -> ACTIVE, IMPROVEMENT_PLAN -> IMPROVEMENT_MONITORED, CONSOLIDATION -> CONSOLIDATION_PENDING, DISCONTINUATION -> TEACH_OUT_PENDING"
          - "CASCADE hop 3 (caused by hop 2, CONSOLIDATION and DISCONTINUATION branches only): because the program left UNDER_REVIEW into a wind-down state, catalog_status_pre_decision := catalog_status and catalog_status LISTED -> MARKETING_SUPPRESSED, and two AgencyNotification rows are minted (agency_type ACCREDITOR with agency_code AUTO_ACCREDITOR_CODE, agency_type STATE_AGENCY with agency_code AUTO_STATE_AGENCY_CODE, origin AUTO_MINTED, status PENDING, due_at per §1.3 agency_notice_deadline)"
          - "CASCADE hop 4 (caused by hop 3): because AUTO_MINTED notifications now exist in PENDING, ReviewCycle.compliance_posture recomputes NOT_APPLICABLE -> NOTICES_PENDING"
        note: "Branch fork with divergent side-effect sets per outcome; CONTINUE and IMPROVEMENT_PLAN mint no notifications and leave catalog_status untouched, so their compliance_posture stays NOT_APPLICABLE."
      - from: RATIFIED
        to: EFFECTUATED
        trigger: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE}"
        actor: ReviewCoordinator
        preconditions:
          - "decision.state == RATIFIED"
          - "decision.unacknowledged_notification_count == 0"
          - "when outcome IN {CONSOLIDATION, DISCONTINUATION}: AcademicProgram.deferred_fte == 0.00"
          - "when outcome == DISCONTINUATION: a TeachOutPlan with decision_id == decision.id is in state APPROVED"
          - "when outcome == CONSOLIDATION: AcademicProgram(receiving_program_id).lifecycle_state == ACTIVE"
        side_effects:
          - "sets effectuated_at = clock; increments DecisionRecord.version by 1"
          - "when outcome == IMPROVEMENT_PLAN: improvement_state NOT_APPLICABLE -> ACTIVE"
          - "when outcome == DISCONTINUATION: AcademicProgram TEACH_OUT_PENDING -> TEACH_OUT_ACTIVE and catalog_status MARKETING_SUPPRESSED -> ADMISSIONS_CLOSED"
          - "when outcome == CONSOLIDATION: AcademicProgram CONSOLIDATION_PENDING -> CONSOLIDATED, consolidated_into_program_id := receiving_program_id, catalog_status MARKETING_SUPPRESSED -> ADMISSIONS_CLOSED, and every ASSIGNED FacultyAppointment on the program moves to REASSIGNMENT_PROPOSED with reassigned_to_department_code = receiving program's department_code"
          - "parent ReviewCycle DECIDED -> CLOSED"
      - from: RATIFIED
        to: RESCINDED
        trigger: "POST /provost/decision-records/{id}/transitions {action: RESCIND}"
        actor: Provost
        preconditions:
          - "decision.state == RATIFIED"
          - "no TeachOutPlan with decision_id == decision.id is IN_EFFECT — satisfied for free, since plan ACTIVATE requires the decision to be EFFECTUATED and RESCIND only leaves RATIFIED"
        side_effects:
          - "stores rescission_reason; increments DecisionRecord.version by 1"
          - "every AgencyNotification on this decision in {PENDING, SENT, OVERDUE} moves to VOIDED"
          - "AcademicProgram returns to UNDER_REVIEW and catalog_status is restored from catalog_status_pre_decision, which is then set back to null"
          - "every TeachOutPlan with decision_id == decision.id in {DRAFT, SUBMITTED, APPROVED} moves to SUPERSEDED"
          - "every FacultyAppointment on the program in TEACH_OUT_RETAINED returns to ASSIGNED"
          - "parent ReviewCycle DECIDED -> RESPONSE_SUBMITTED"
        note: "Compensation edge — restores both AcademicProgram axes to their pre-ratification values."

  - entity: DecisionRecord
    state_field: improvement_state
    initial_state: NOT_APPLICABLE
    terminal_states: [MET, UNMET]
    transitions:
      - from: NOT_APPLICABLE
        to: ACTIVE
        trigger: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE} on an IMPROVEMENT_PLAN decision"
        actor: ReviewCoordinator
        preconditions:
          - "decision.outcome == IMPROVEMENT_PLAN AND decision.state transitions RATIFIED -> EFFECTUATED"
        side_effects:
          - "no notifications are minted for this outcome branch"
      - from: ACTIVE
        to: MET
        trigger: "POST /provost/decision-records/{id}/transitions {action: EVALUATE_IMPROVEMENT}"
        actor: ReviewCoordinator
        preconditions:
          - "decision.state == EFFECTUATED AND improvement_state == ACTIVE"
          - "AcademicProgram.composite_score >= decision.improvement_target_score"
        side_effects:
          - "AcademicProgram IMPROVEMENT_MONITORED -> ACTIVE"
      - from: ACTIVE
        to: UNMET
        trigger: "POST /provost/decision-records/{id}/transitions {action: EVALUATE_IMPROVEMENT}"
        actor: ReviewCoordinator
        preconditions:
          - "decision.state == EFFECTUATED AND improvement_state == ACTIVE"
          - "AcademicProgram.composite_score < decision.improvement_target_score"
        side_effects:
          - "AcademicProgram IMPROVEMENT_MONITORED -> UNDER_REVIEW and discontinuation_override := true"
          - "parent ReviewCycle CLOSED -> RESPONSE_SUBMITTED"
      - from: ACTIVE
        to: NOT_APPLICABLE
        trigger: "POST /provost/decision-records/{id}/transitions {action: RESCIND}"
        actor: Provost
        preconditions:
          - "decision.state == RATIFIED AND outcome == IMPROVEMENT_PLAN"
        side_effects:
          - "AcademicProgram IMPROVEMENT_MONITORED -> UNDER_REVIEW"

  - entity: AgencyNotification
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, VOIDED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /provost/agency-notifications/{id}/transitions {action: SEND}"
        actor: ReviewCoordinator
        preconditions:
          - "notification.status == PENDING"
          - "transmitted_reference is present and non-blank"
        side_effects:
          - "sets sent_at = clock and transmitted_reference"
          - "recomputes ReviewCycle.compliance_posture (stays NOTICES_PENDING while any notice is in {PENDING, SENT, OVERDUE})"
      - from: OVERDUE
        to: SENT
        trigger: "POST /provost/agency-notifications/{id}/transitions {action: SEND}"
        actor: ReviewCoordinator
        preconditions:
          - "notification.status == OVERDUE"
          - "transmitted_reference is present and non-blank"
        side_effects:
          - "sets sent_at = clock; overdue_marked_at is preserved as the audit trail of the missed deadline"
      - from: PENDING
        to: OVERDUE
        trigger: "POST /provost/compliance-sweeps"
        actor: ReviewCoordinator
        preconditions:
          - "notification.status == PENDING"
          - "clock > notification.due_at (strictly greater; equality leaves the notice PENDING)"
        side_effects:
          - "sets overdue_marked_at = clock; increments AgencyNotification.version by 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /provost/agency-notifications/{id}/transitions {action: ACKNOWLEDGE}"
        actor: ReviewCoordinator
        preconditions:
          - "notification.status == SENT"
        side_effects:
          - "sets acknowledged_at = clock"
          - "recomputes DecisionRecord.unacknowledged_notification_count and ReviewCycle.compliance_posture (NOTICES_CLEARED once every notice is in {ACKNOWLEDGED, VOIDED})"
      - from: PENDING
        to: VOIDED
        trigger: "DecisionRecord RATIFIED -> RESCINDED cascade"
        actor: system
        preconditions:
          - "the rescinded decision is this notification's decision_id"
        side_effects:
          - "increments AgencyNotification.version by 1"
      - from: SENT
        to: VOIDED
        trigger: "DecisionRecord RATIFIED -> RESCINDED cascade"
        actor: system
        preconditions:
          - "the rescinded decision is this notification's decision_id"
        side_effects:
          - "increments AgencyNotification.version by 1"
      - from: OVERDUE
        to: VOIDED
        trigger: "DecisionRecord RATIFIED -> RESCINDED cascade"
        actor: system
        preconditions:
          - "the rescinded decision is this notification's decision_id"
        side_effects:
          - "increments AgencyNotification.version by 1"

  - entity: TeachOutPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /provost/teach-out-plans/{id}/transitions {action: SUBMIT}"
        actor: ProgramChair
        preconditions:
          - "plan.state == DRAFT"
          - "plan.decision_id's DecisionRecord state IN {RATIFIED, EFFECTUATED}"
        side_effects:
          - "increments TeachOutPlan.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /provost/teach-out-plans/{id}/transitions {action: RETURN}"
        actor: Provost
        preconditions:
          - "plan.state == SUBMITTED"
          - "plan.plan_revision_round < 3"
        side_effects:
          - "increments plan_revision_round by 1 and stores revision_notes"
        note: "Revision loop DRAFT -> SUBMITTED -> DRAFT, bounded at 3 returns."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /provost/teach-out-plans/{id}/transitions {action: APPROVE}"
        actor: Provost
        preconditions:
          - "plan.state == SUBMITTED"
          - "plan.seat_shortfall == 0"
          - "plan.at_risk_student_count == 0"
        side_effects:
          - "sets approved_at = clock"
      - from: APPROVED
        to: IN_EFFECT
        trigger: "POST /provost/teach-out-plans/{id}/transitions {action: ACTIVATE}"
        actor: ReviewCoordinator
        preconditions:
          - "plan.state == APPROVED"
          - "the plan's DecisionRecord state == EFFECTUATED"
        side_effects:
          - "sets activated_at = clock"
          - "every CourseGuarantee on the plan with status == PLANNED and term_index <= plan.first_teach_out_term_index moves to OFFERED"
          - "if plan.open_student_count == 0 the plan immediately auto-transitions IN_EFFECT -> COMPLETED in the same request (empty-cohort teach-out)"
      - from: IN_EFFECT
        to: COMPLETED
        trigger: "DisplacedStudent reaching COMPLETED or WITHDRAWN leaves plan.open_student_count == 0, or ACTIVATE on an empty cohort"
        actor: system
        preconditions:
          - "plan.state == IN_EFFECT AND plan.open_student_count == 0"
        side_effects:
          - "sets completed_at = clock; increments TeachOutPlan.version by 1"
          - "CASCADE: AcademicProgram TEACH_OUT_ACTIVE -> DISCONTINUED, then catalog_status ADMISSIONS_CLOSED -> CATALOG_WITHDRAWN, then every FacultyAppointment in TEACH_OUT_RETAINED returns to ASSIGNED"
        note: "Compound/bubble-up: the parent's terminal state is a function of the children's states."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /provost/academic-programs/{id}/teach-out-plans (a newer plan supersedes this one) or the RESCIND cascade"
        actor: system
        preconditions:
          - "a newer TeachOutPlan is created on the same program, or the plan's decision is rescinded"
        side_effects:
          - "increments TeachOutPlan.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /provost/academic-programs/{id}/teach-out-plans (a newer plan supersedes this one) or the RESCIND cascade"
        actor: system
        preconditions:
          - "a newer TeachOutPlan is created on the same program, or the plan's decision is rescinded"
        side_effects:
          - "increments TeachOutPlan.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "DecisionRecord RATIFIED -> RESCINDED cascade"
        actor: system
        preconditions:
          - "the plan's decision_id is the rescinded decision"
        side_effects:
          - "increments TeachOutPlan.version by 1"

  - entity: CourseGuarantee
    initial_state: PLANNED
    terminal_states: [WAIVED]
    transitions:
      - from: PLANNED
        to: OFFERED
        trigger: "TeachOutPlan APPROVED -> IN_EFFECT cascade"
        actor: system
        preconditions:
          - "guarantee.status == PLANNED AND guarantee.term_index <= plan.first_teach_out_term_index"
        side_effects:
          - "increments CourseGuarantee.version by 1"
      - from: PLANNED
        to: SUBSTITUTED
        trigger: "POST /provost/course-guarantees/{id}/seat-allocations {action: SUBSTITUTE}"
        actor: Registrar
        preconditions:
          - "guarantee.status IN {PLANNED, OFFERED}"
          - "substitute_course_code is present and differs from course_code"
        side_effects:
          - "stores substitute_course_code and substitution_justification; seats_guaranteed and seats_committed are unchanged"
      - from: OFFERED
        to: SUBSTITUTED
        trigger: "POST /provost/course-guarantees/{id}/seat-allocations {action: SUBSTITUTE}"
        actor: Registrar
        preconditions:
          - "guarantee.status IN {PLANNED, OFFERED}"
          - "substitute_course_code is present and differs from course_code"
        side_effects:
          - "stores substitute_course_code and substitution_justification; the seat ledger is untouched"
      - from: PLANNED
        to: WAIVED
        trigger: "POST /provost/course-guarantees/{id}/seat-allocations {action: WAIVE}"
        actor: Registrar
        preconditions:
          - "guarantee.status IN {PLANNED, OFFERED, SUBSTITUTED}"
          - "guarantee.seats_committed == 0 (empty commitment set)"
        side_effects:
          - "stores waived_reason_code; removes the row from guaranteed_seat_total, which re-derives plan.seat_shortfall"
      - from: OFFERED
        to: WAIVED
        trigger: "POST /provost/course-guarantees/{id}/seat-allocations {action: WAIVE}"
        actor: Registrar
        preconditions:
          - "guarantee.status IN {PLANNED, OFFERED, SUBSTITUTED}"
          - "guarantee.seats_committed == 0"
        side_effects:
          - "stores waived_reason_code; re-derives plan.guaranteed_seat_total and plan.seat_shortfall"
      - from: SUBSTITUTED
        to: WAIVED
        trigger: "POST /provost/course-guarantees/{id}/seat-allocations {action: WAIVE}"
        actor: Registrar
        preconditions:
          - "guarantee.status IN {PLANNED, OFFERED, SUBSTITUTED}"
          - "guarantee.seats_committed == 0"
        side_effects:
          - "stores waived_reason_code; re-derives plan.guaranteed_seat_total and plan.seat_shortfall"

  - entity: DisplacedStudent
    initial_state: PENDING
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ADVISED
        trigger: "POST /provost/displaced-students/{id}/advising {plan_signed: false}"
        actor: Registrar
        preconditions:
          - "student.advising_status IN {PENDING, ADVISED}"
          - "plan.state IN {DRAFT, SUBMITTED, APPROVED, IN_EFFECT}"
        side_effects:
          - "stores advised_credits_per_term and advised_at = clock"
          - "projection_variant flips OPTIMISTIC_FULL_LOAD -> CONSERVATIVE_ADVISED_LOAD, which re-derives projected_terms_remaining, projected_completion_term_index, at_risk and plan.at_risk_student_count"
      - from: ADVISED
        to: PLAN_SIGNED
        trigger: "POST /provost/displaced-students/{id}/advising {plan_signed: true}"
        actor: Registrar
        preconditions:
          - "student.advising_status IN {PENDING, ADVISED}"
        side_effects:
          - "stores advised_credits_per_term and advised_at = clock; re-derives the projection fields"
      - from: PENDING
        to: PLAN_SIGNED
        trigger: "POST /provost/displaced-students/{id}/advising {plan_signed: true}"
        actor: Registrar
        preconditions:
          - "student.advising_status IN {PENDING, ADVISED}"
        side_effects:
          - "stores advised_credits_per_term and advised_at = clock; re-derives the projection fields"
      - from: PLAN_SIGNED
        to: COMPLETED
        trigger: "POST /provost/displaced-students/{id}/progress {action: COMPLETE}"
        actor: Registrar
        preconditions:
          - "student.advising_status == PLAN_SIGNED"
          - "plan.state == IN_EFFECT"
        side_effects:
          - "sets completion_term_index from the payload"
          - "releases every seat this student holds: each affected CourseGuarantee.seats_committed decreases by the seats held, and committed_seat_count becomes 0"
          - "CASCADE hop 1: plan.open_student_count re-derives; when it reaches 0 the plan auto-transitions IN_EFFECT -> COMPLETED"
          - "CASCADE hop 2 (caused by hop 1): because the plan COMPLETED, AcademicProgram TEACH_OUT_ACTIVE -> DISCONTINUED and catalog_status ADMISSIONS_CLOSED -> CATALOG_WITHDRAWN"
          - "CASCADE hop 3 (caused by hop 2): because the program became DISCONTINUED, every FacultyAppointment in TEACH_OUT_RETAINED returns to ASSIGNED, re-deriving assigned_pool_fte, retained_teach_out_fte, reducible_fte, staffing_liability_cents, deferred_fte and every reduction_sequence_position"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /provost/displaced-students/{id}/progress {action: WITHDRAW}"
        actor: Registrar
        preconditions:
          - "student.advising_status IN {PENDING, ADVISED, PLAN_SIGNED}"
        side_effects:
          - "stores withdrawal_reason_code; releases every held seat; re-derives plan.required_seat_total, seat_shortfall, open_student_count and at_risk_student_count"
      - from: ADVISED
        to: WITHDRAWN
        trigger: "POST /provost/displaced-students/{id}/progress {action: WITHDRAW}"
        actor: Registrar
        preconditions:
          - "student.advising_status IN {PENDING, ADVISED, PLAN_SIGNED}"
        side_effects:
          - "stores withdrawal_reason_code; releases every held seat; re-derives the plan aggregates"
      - from: PLAN_SIGNED
        to: WITHDRAWN
        trigger: "POST /provost/displaced-students/{id}/progress {action: WITHDRAW}"
        actor: Registrar
        preconditions:
          - "student.advising_status IN {PENDING, ADVISED, PLAN_SIGNED}"
        side_effects:
          - "stores withdrawal_reason_code; releases every held seat; when plan.open_student_count reaches 0 while the plan is IN_EFFECT the same compound cascade as COMPLETE fires"

  - entity: FacultyAppointment
    initial_state: ASSIGNED
    terminal_states: [REASSIGNED, SEPARATED]
    transitions:
      - from: ASSIGNED
        to: TEACH_OUT_RETAINED
        trigger: "POST /provost/faculty-appointments/{id}/transitions {action: RETAIN}"
        actor: HRPartner
        preconditions:
          - "appointment.state == ASSIGNED"
          - "a TeachOutPlan on the appointment's program is in state IN {APPROVED, IN_EFFECT}"
        side_effects:
          - "removes the appointment from assigned_pool_fte, which lowers reducible_fte and re-derives every reduction_sequence_position on the program"
      - from: TEACH_OUT_RETAINED
        to: ASSIGNED
        trigger: "AcademicProgram -> DISCONTINUED cascade, or the DecisionRecord RESCIND cascade"
        actor: system
        preconditions:
          - "appointment.state == TEACH_OUT_RETAINED"
        side_effects:
          - "returns the fte to assigned_pool_fte and re-derives the waterfall outputs"
        note: "Cycle ASSIGNED -> TEACH_OUT_RETAINED -> ASSIGNED; active_fte_total is unchanged by both edges."
      - from: ASSIGNED
        to: REASSIGNMENT_PROPOSED
        trigger: "POST /provost/faculty-appointments/{id}/transitions {action: PROPOSE_REASSIGNMENT}"
        actor: HRPartner
        preconditions:
          - "appointment.state == ASSIGNED"
          - "reassigned_to_department_code is present and differs from the program's department_code"
        side_effects:
          - "stores reassigned_to_department_code; the fte leaves assigned_pool_fte but stays inside active_fte_total"
      - from: REASSIGNMENT_PROPOSED
        to: ASSIGNED
        trigger: "POST /provost/faculty-appointments/{id}/transitions {action: WITHDRAW_REASSIGNMENT}"
        actor: HRPartner
        preconditions:
          - "appointment.state == REASSIGNMENT_PROPOSED"
        side_effects:
          - "clears reassigned_to_department_code, increments reassignment_withdraw_count by 1"
          - "returns the fte to assigned_pool_fte; active_fte_total, reassigned_fte_total and separated_fte_total are all unchanged by the propose+withdraw pair"
        note: "Compensating edge for the FTE conservation invariant."
      - from: REASSIGNMENT_PROPOSED
        to: REASSIGNED
        trigger: "POST /provost/faculty-appointments/{id}/transitions {action: CONFIRM_REASSIGNMENT}"
        actor: HRPartner
        preconditions:
          - "appointment.state == REASSIGNMENT_PROPOSED"
        side_effects:
          - "moves the fte from active_fte_total into reassigned_fte_total (faculty_fte_baseline unchanged)"
      - from: ASSIGNED
        to: NOTICE_ISSUED
        trigger: "POST /provost/faculty-appointments/{id}/transitions {action: ISSUE_NOTICE}"
        actor: HRPartner
        preconditions:
          - "appointment.state == ASSIGNED"
          - "appointment.reduction_sequence_position is non-null and is the minimum reduction_sequence_position among the program's ASSIGNED appointments"
          - "notice_days >= STATUTORY_NOTICE_DAYS[tenure_status]"
        side_effects:
          - "stores notice_days and notice_issued_at = clock"
          - "removes the appointment from assigned_pool_fte, lowering reducible_fte and re-deriving every remaining reduction_sequence_position"
      - from: NOTICE_ISSUED
        to: SEPARATED
        trigger: "POST /provost/faculty-appointments/{id}/transitions {action: SEPARATE}"
        actor: HRPartner
        preconditions:
          - "appointment.state == NOTICE_ISSUED"
          - "clock >= notice_issued_at + notice_days * 24h"
          - "when tenure_status == TENURED: no TeachOutPlan on the program is in state IN {APPROVED, IN_EFFECT}"
        side_effects:
          - "sets separated_at = clock; moves the fte from active_fte_total into separated_fte_total (faculty_fte_baseline unchanged)"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================

concurrency_rules:
  - rule_id: teach-out-plan-create-stale-program
    parent_entity: AcademicProgram
    write_endpoint: "POST /provost/academic-programs/{id}/teach-out-plans"
    occ_field: "expected_program_version"
    description: |
      Creating a TeachOutPlan against an AcademicProgram whose version has
      advanced since the client last observed it is rejected. A new plan
      legitimately supersedes any existing DRAFT or SUBMITTED plan on the same
      program, so the write itself is valid product behaviour; the stale
      expected_program_version is the only signal that the author was working
      from an outdated view of the program (for example one taken before a
      ratification cascade suppressed the catalog or before an earlier plan
      was filed).
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: decision-propose-stale-cycle
    parent_entity: ReviewCycle
    write_endpoint: "POST /provost/review-cycles/{id}/decision-records"
    occ_field: "expected_cycle_version"
    description: |
      Proposing a DecisionRecord against a ReviewCycle whose version has
      advanced since the client last observed it is rejected. A later proposal
      legitimately supersedes an earlier PROPOSED decision on the same cycle,
      so the write is valid product behaviour; the stale expected_cycle_version
      is what tells the server the proposing provost had not seen the cycle
      state produced by the earlier proposal (or by an addendum round).
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================

calculations:
  - name: program_cost_per_credit_hour
    trigger: "On every POST /provost/academic-programs/{id}/metric-snapshots, recomputed from scratch over the program's snapshot set; both output fields are rewritten on the AcademicProgram row in the same request."
    algorithm: aggregation
    formula: |
      window = the ROLLING_WINDOW_TERMS snapshots of this program with the
               highest term_index, ordered by term_index ASC.
               If fewer than ROLLING_WINDOW_TERMS snapshots exist, the window is
               every snapshot the program has.
      if window is empty:
        cost_per_credit_hour_rolling_cents = null
        cost_per_credit_hour_latest_cents  = null
      else:
        # VARIANT rolling_three_term — sum-then-divide, ONE rounding at the end
        total_direct_cost_cents = sum(s.direct_cost_cents for s in window)
        total_credit_hours      = sum(s.credit_hours      for s in window)
        cost_per_credit_hour_rolling_cents =
            round_half_up(total_direct_cost_cents / total_credit_hours, 0)

        # VARIANT latest_term — the single highest-term_index snapshot
        latest = window[-1]
        cost_per_credit_hour_latest_cents =
            round_half_up(latest.direct_cost_cents / latest.credit_hours, 0)

      # ViabilityMetricSnapshot.cost_per_credit_hour_cents is a PER-TERM
      # diagnostic computed the same way for its own single term. It is NEVER
      # an input to either program-level output.
      #
      # FORBIDDEN evaluation order: rounding each term's cost-per-credit-hour to
      # cents first and then averaging those rounded per-term values. That
      # divide-then-average order is a different number: for the three snapshots
      # (300 ch / 12000000 cents), (240 ch / 11000000 cents), (200 ch /
      # 11000000 cents) the mandated sum-then-divide order yields 45946 while
      # the forbidden per-term-average order yields 46944, and the latest-term
      # variant yields 55000. All three are distinct.
    input_set: "Every ViabilityMetricSnapshot row of the program (immutable, append-only); the rolling variant restricts to the ROLLING_WINDOW_TERMS highest term_index values. No state filter applies — snapshots have no state."
    constants:
      ROLLING_WINDOW_TERMS: 3
    precision: "Integer cents, round_half_up, applied exactly once to the final quotient of each variant. Intermediate sums stay exact integers."
    variants:
      - name: rolling_three_term
        when: "AcademicProgram.cost_per_credit_hour_rolling_cents, and the sole cost input to program_viability_composite's efficiency_score and to staffing_reduction_waterfall's severance budget cap."
        difference: "Sums direct_cost_cents and credit_hours across the window first, then divides once. Smooths a single expensive term."
      - name: latest_term
        when: "AcademicProgram.cost_per_credit_hour_latest_cents — the trend-facing figure reported to the accreditor; never used by any gate."
        difference: "Divides the newest term's cost by the newest term's credit hours only, ignoring history. Diverges upward from the rolling variant whenever costs are rising while credit hours fall."

  - name: program_viability_composite
    trigger: "On every POST /provost/academic-programs/{id}/metric-snapshots, immediately after program_cost_per_credit_hour has been rewritten (it consumes cost_per_credit_hour_rolling_cents). Writes composite_score and viability_band on the AcademicProgram row."
    algorithm: weighted_scoring
    formula: |
      window = same rolling window as program_cost_per_credit_hour
               (the ROLLING_WINDOW_TERMS highest term_index snapshots,
                ordered by term_index ASC)

      if snapshot_count == 0:
        composite_score = null
        viability_band  = INSUFFICIENT_DATA
        stop.

      window_headcount = sum(s.enrollment_headcount for s in window)
      earliest = window[0]      # lowest term_index in the window
      latest   = window[-1]     # highest term_index in the window

      # -- factor 1: enrollment trend, an unbounded percentage mapped onto 0..100
      trend_pct = (latest.enrollment_headcount - earliest.enrollment_headcount)
                  / earliest.enrollment_headcount * 100
      enrollment_score = clamp(50 + ENROLLMENT_TREND_GAIN * trend_pct, 0, 100)

      # -- factor 2: completions per enrolled head, scaled
      completion_score = clamp(
          COMPLETION_SCALE * sum(s.completions_count for s in window)
                           / window_headcount, 0, 100)

      # -- factor 3: market demand, taken from the newest term only
      demand_score = clamp(latest.market_demand_index, 0, 100)

      # -- factor 4: cost efficiency against the institutional benchmark
      efficiency_score = clamp(
          EFFICIENCY_GAIN * (BENCHMARK_COST_PER_CH_CENTS
                             / cost_per_credit_hour_rolling_cents), 0, 100)

      # -- CONDITIONAL WEIGHT VECTOR keyed on degree_level
      (w_enrollment, w_completion, w_demand, w_efficiency) =
          WEIGHTS[program.degree_level]

      weighted = enrollment_score  * w_enrollment
               + completion_score  * w_completion
               + demand_score      * w_demand
               + efficiency_score  * w_efficiency

      # -- SMALL-PROGRAM FLOOR OVERRIDE, applied to the weighted sum before
      #    the single final rounding. A program whose rolling window enrolled
      #    fewer than MIN_VIABLE_WINDOW_HEADCOUNT heads cannot score above the
      #    improvement band no matter how good its other factors are.
      if window_headcount < MIN_VIABLE_WINDOW_HEADCOUNT:
        weighted = min(weighted, SMALL_PROGRAM_CEILING)

      composite_score = round_half_up(weighted, 2)

      # -- band, on the ROUNDED score, inclusive lower bounds
      if composite_score >= CONTINUE_BAND_MIN:      viability_band = CONTINUE_ELIGIBLE
      elif composite_score >= IMPROVEMENT_BAND_MIN: viability_band = IMPROVEMENT_ELIGIBLE
      else:                                        viability_band = NONVIABLE

      # Every clamp() and the floor override happen on UNROUNDED factor values;
      # round_half_up to 2 dp is applied exactly once, to `weighted`. Rounding
      # each factor first would drift the composite.
    input_set: "The rolling window of ViabilityMetricSnapshot rows (see ROLLING_WINDOW_TERMS) plus the program's own degree_level and cost_per_credit_hour_rolling_cents. Snapshots outside the window are excluded; INSUFFICIENT_DATA is reserved for snapshot_count == 0."
    constants:
      ROLLING_WINDOW_TERMS: 3
      ENROLLMENT_TREND_GAIN: 2.5
      COMPLETION_SCALE: 250
      EFFICIENCY_GAIN: 60
      BENCHMARK_COST_PER_CH_CENTS: 50000
      MIN_VIABLE_WINDOW_HEADCOUNT: 60
      SMALL_PROGRAM_CEILING: 39.99
      CONTINUE_BAND_MIN: 60.00
      IMPROVEMENT_BAND_MIN: 40.00
      WEIGHTS:
        UNDERGRADUATE: [0.35, 0.25, 0.20, 0.20]
        GRADUATE: [0.25, 0.30, 0.15, 0.30]
        CERTIFICATE: [0.30, 0.20, 0.35, 0.15]
    precision: "composite_score is 2 decimal places, round_half_up, rounded exactly once at the end. Band comparisons use the rounded value, so a weighted sum of 39.995 rounds to 40.00 and lands in IMPROVEMENT_ELIGIBLE."

  - name: displaced_student_completion_projection
    trigger: "On POST /provost/teach-out-plans/{id}/displaced-students (creation) and on every POST /provost/displaced-students/{id}/advising; also re-derived for every open student of a plan when the plan's first_teach_out_term_index or final_award_term_index is edited by a new plan revision."
    algorithm: forward_looking
    formula: |
      # VARIANT selection is driven by the student's own advising progress,
      # NOT by a request parameter.
      if student.advising_status == PENDING:
        projection_variant = OPTIMISTIC_FULL_LOAD
        load = student.max_credits_per_term
      else:                                   # ADVISED, PLAN_SIGNED, COMPLETED
        projection_variant = CONSERVATIVE_ADVISED_LOAD
        load = student.advised_credits_per_term

      projected_terms_remaining = ceil(student.credits_remaining / load)
      projected_completion_term_index =
          plan.first_teach_out_term_index + projected_terms_remaining - 1
      at_risk = projected_completion_term_index > plan.final_award_term_index

      required_seat_count = ceil(student.credits_remaining / CREDITS_PER_COURSE)

      # Worked example locked by this scaffold: credits_remaining 24,
      # max_credits_per_term 15, advised_credits_per_term 9,
      # first_teach_out_term_index 4, final_award_term_index 5.
      #   OPTIMISTIC_FULL_LOAD      -> ceil(24/15) = 2 terms -> completion 5 -> at_risk false
      #   CONSERVATIVE_ADVISED_LOAD -> ceil(24/ 9) = 3 terms -> completion 6 -> at_risk true
      #   required_seat_count = ceil(24/3) = 8 in BOTH variants.
    input_set: "One DisplacedStudent row plus its parent TeachOutPlan's term indices. Students in WITHDRAWN are excluded from plan.at_risk_student_count and plan.open_student_count but keep their last computed projection fields."
    constants:
      CREDITS_PER_COURSE: 3
    precision: "ceil to whole terms and whole seats — never round_half_up. A student needing 24 credits at 9 per term needs 3 terms, not 2.67 rounded to 3 by coincidence."
    variants:
      - name: OPTIMISTIC_FULL_LOAD
        when: "advising_status == PENDING — before an adviser has met the student, the registrar's provisional projection assumes the student carries the full permitted load."
        difference: "Divides by max_credits_per_term. Understates terms remaining, so it hides at_risk students and lets a plan look approvable."
      - name: CONSERVATIVE_ADVISED_LOAD
        when: "advising_status IN {ADVISED, PLAN_SIGNED, COMPLETED} — once advising has happened the agreed load is authoritative."
        difference: "Divides by advised_credits_per_term. For identical stored credits_remaining this yields a strictly larger projected_terms_remaining whenever advised < max, which can flip at_risk from false to true and thereby block TeachOutPlan APPROVE."

  - name: staffing_reduction_waterfall
    trigger: "Re-derived in full on every write that can change the program's appointment set, its course guarantees, or its cost history: POST /provost/academic-programs/{id}/faculty-appointments, every POST /provost/faculty-appointments/{id}/transitions action, every POST /provost/course-guarantees/{id}/seat-allocations action that changes a guarantee's status, POST /provost/teach-out-plans/{id}/course-guarantees, POST /provost/teach-out-plans/{id}/transitions {action: ACTIVATE}, POST /provost/academic-programs/{id}/metric-snapshots, and the DecisionRecord RATIFY / EFFECTUATE / RESCIND cascades."
    algorithm: waterfall_allocation
    formula: |
      # ---- STEP ORDER IS PART OF THE CONTRACT; steps consume earlier outputs.

      # STEP 1 — instructional demand that must survive the reduction.
      guaranteed_section_count =
          count(CourseGuarantee g
                where g.teach_out_plan_id IN (plans of this program whose state
                       IN {DRAFT, SUBMITTED, APPROVED, IN_EFFECT})
                  and g.status IN {PLANNED, OFFERED, SUBSTITUTED})
      retained_teach_out_fte = min(
          faculty_fte_baseline,
          round_half_up(guaranteed_section_count / SECTIONS_PER_FTE, 2))

      # STEP 2 — the pool that is still on the program's books and unshielded.
      assigned_pool_fte = sum(a.fte for a in FacultyAppointment
                              where a.program_id == program.id
                                and a.state == ASSIGNED)
      reducible_fte = max(0, assigned_pool_fte - retained_teach_out_fte)

      # STEP 3 — the money available, from the rolling cost window.
      window = the ROLLING_WINDOW_TERMS highest-term_index snapshots
      severance_budget_cap_cents =
          floor(SEVERANCE_CAP_RATE * sum(s.direct_cost_cents for s in window))
      # floor, not round_half_up: a budget cap is never rounded upward.

      # STEP 4 — ordered whole-appointment waterfall, stop on FTE target or cap.
      order = FacultyAppointment rows with state == ASSIGNED, sorted by
              TENURE_TIER_RANK[a.tenure_status] ASC,   # least protected first
              a.fte DESC,                              # then largest load
              a.created_at ASC                         # then oldest row
      # `id` is never a sort key.
      running_fte = 0; running_liability = 0; position = 1
      for a in order:
        a.reduction_sequence_position = null
        a.notice_pay_cents = round_half_up(
            a.annual_salary_cents * a.fte
            * STATUTORY_NOTICE_DAYS[a.tenure_status] / 365, 0)
      for a in order:
        if running_fte >= reducible_fte: break        # FTE target already met
        if running_liability + a.notice_pay_cents > severance_budget_cap_cents:
          break                                       # budget exhausted
        a.reduction_sequence_position = position; position += 1
        running_fte       += a.fte
        running_liability += a.notice_pay_cents
      staffing_liability_cents = running_liability
      deferred_fte = round_half_up(max(0, reducible_fte - running_fte), 2)

      # Because the FTE guard is tested BEFORE the appointment is taken, the
      # appointment that crosses reducible_fte is still funded. Therefore
      # deferred_fte > 0 if and only if the severance cap broke the loop, which
      # is exactly the condition ERR_SEVERANCE_CAP_EXCEEDED reports on
      # DecisionRecord EFFECTUATE.
      #
      # Worked example locked by this scaffold — roster (ADJUNCT 0.25 fte
      # 4000000 cents), (NON_TENURE_TRACK 1.00 fte 7200000), (TENURE_TRACK 1.00
      # fte 9000000), (TENURED 1.00 fte 12000000); baseline 3.25; rolling
      # direct-cost window sum 34000000 -> cap 5100000; notice pays 82192 /
      # 1775342 / 4438356 / 12000000.
      #   8 guaranteed sections  -> retained 1.33, reducible 1.92:
      #        ADJUNCT pos 1, NON_TENURE_TRACK pos 2, then 1857534 + 4438356
      #        = 6295890 > 5100000 -> stop. liability 1857534, deferred 0.67.
      #   12 guaranteed sections -> retained 2.00, reducible 1.25:
      #        same two positions, FTE target met at 1.25 -> deferred 0.00.
    input_set: "FacultyAppointment rows of the program in state ASSIGNED (TEACH_OUT_RETAINED, REASSIGNMENT_PROPOSED, REASSIGNED, NOTICE_ISSUED and SEPARATED rows are all outside the pool); CourseGuarantee rows in {PLANNED, OFFERED, SUBSTITUTED} under non-superseded plans; the program's rolling snapshot window."
    constants:
      SECTIONS_PER_FTE: 6
      SEVERANCE_CAP_RATE: 0.15
      ROLLING_WINDOW_TERMS: 3
      STATUTORY_NOTICE_DAYS:
        TENURED: 365
        TENURE_TRACK: 180
        NON_TENURE_TRACK: 90
        ADJUNCT: 30
      TENURE_TIER_RANK:
        TENURED: 4
        TENURE_TRACK: 3
        NON_TENURE_TRACK: 2
        ADJUNCT: 1
    precision: "notice_pay_cents: integer cents, round_half_up, computed per appointment before the loop runs. severance_budget_cap_cents: floor to integer cents. retained_teach_out_fte and deferred_fte: 2 decimal places, round_half_up. reduction_sequence_position: consecutive integers from 1 with no gaps."

  - name: agency_notice_deadline
    trigger: "due_at is stamped when an AgencyNotification row is created — by the DecisionRecord RATIFY auto-mint cascade or by POST /provost/decision-records/{id}/agency-notifications. The OVERDUE comparison runs on POST /provost/compliance-sweeps."
    algorithm: threshold
    formula: |
      anchor = decision.ratified_at if decision.ratified_at is not null
               else clock                      # manual notice on an unratified
                                               # decision anchors on `now`
      due_at = anchor + AGENCY_NOTICE_DAYS[notification.agency_type] * 24 hours

      # compliance sweep, per notification with status == PENDING:
      if clock > due_at:            status = OVERDUE; overdue_marked_at = clock
      else:                         status unchanged
      # STRICTLY greater. A sweep run at exactly due_at leaves the notice
      # PENDING; one second later marks it OVERDUE.
      #
      # Worked example locked by this scaffold: ratified_at
      # 2026-09-15T10:00:00Z gives ACCREDITOR due_at 2026-10-15T10:00:00Z and
      # STATE_AGENCY due_at 2026-10-30T10:00:00Z.

      # decision.notification_count = count of this decision's notifications
      #                               with status != VOIDED
      # decision.unacknowledged_notification_count =
      #     count with status IN {PENDING, SENT, OVERDUE}
      # cycle.compliance_posture =
      #     NOT_APPLICABLE  when the cycle's decision has no non-VOIDED notices
      #     NOTICES_PENDING when any non-VOIDED notice is not ACKNOWLEDGED
      #     NOTICES_CLEARED when every non-VOIDED notice is ACKNOWLEDGED
    input_set: "AgencyNotification rows of one DecisionRecord. VOIDED notices are excluded from both counters and from compliance_posture, so rescinding a decision clears the posture back to NOT_APPLICABLE."
    constants:
      AGENCY_NOTICE_DAYS:
        ACCREDITOR: 30
        STATE_AGENCY: 45
        FEDERAL: 60
      AUTO_ACCREDITOR_CODE: "REGIONAL-ACC"
      AUTO_STATE_AGENCY_CODE: "STATE-CHE"
    precision: "Whole-day offsets on an ISO-8601 UTC instant; the time-of-day component of ratified_at is preserved exactly. Comparison is strict `>` against the logical clock."

  - name: teach_out_seat_ledger
    trigger: "Re-derived on POST /provost/teach-out-plans/{id}/course-guarantees, every POST /provost/course-guarantees/{id}/seat-allocations action, POST /provost/teach-out-plans/{id}/displaced-students, POST /provost/displaced-students/{id}/advising and POST /provost/displaced-students/{id}/progress."
    algorithm: aggregation
    formula: |
      # per CourseGuarantee
      seats_available = g.seats_guaranteed - g.seats_committed

      # per TeachOutPlan
      open_students = DisplacedStudent rows of the plan with advising_status
                      IN {PENDING, ADVISED, PLAN_SIGNED}
      open_student_count      = count(open_students)
      guaranteed_seat_total   = sum(g.seats_guaranteed for g in guarantees
                                    where g.status IN {PLANNED, OFFERED,
                                                       SUBSTITUTED})
      committed_seat_total    = sum(g.seats_committed for g in guarantees
                                    where g.status != WAIVED)
      required_seat_total     = sum(s.required_seat_count for s in open_students)
      seat_shortfall          = max(0, required_seat_total
                                       - guaranteed_seat_total)
      at_risk_student_count   = count(s in open_students where s.at_risk)
      substituted_guarantee_count = count(g where g.status == SUBSTITUTED)
      waived_guarantee_count      = count(g where g.status == WAIVED)

      # CONSERVED QUANTITY (invariant, must hold after every seat-allocation
      # and every student progress write):
      #   sum(g.seats_committed for g in plan.guarantees where status != WAIVED)
      #     == sum(s.committed_seat_count for s in plan.students
      #            where advising_status != WITHDRAWN)
      # COMMIT adds n to both sides; RELEASE subtracts n from both sides;
      # COMPLETE and WITHDRAW subtract the student's whole holding from both.
    input_set: "CourseGuarantee and DisplacedStudent rows of one TeachOutPlan. WAIVED guarantees leave guaranteed_seat_total (which is why WAIVE requires seats_committed == 0 — otherwise the conserved quantity would break). WITHDRAWN and COMPLETED students leave every plan aggregate."
    constants:
      CREDITS_PER_COURSE: 3
    precision: "Whole seats, integer arithmetic only. seat_shortfall floors at 0 — surplus guaranteed seats never produce a negative shortfall."

# =============================================================================
# §1.4 Validation Rules (evaluated in ascending priority order; the FIRST
#      violated rule decides the response — later violations are never reported)
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID are both present and non-blank on every request. An empty-string or whitespace-only value counts as absent."
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list AND owns the requested action. Permission is checked per (endpoint, action) pair, not per endpoint: where §1.7 scopes an operation to specific actions — POST /provost/self-studies/{id}/transitions {action: SUBMIT} to ProgramChair but {action: RETURN | ACCEPT} to ReviewCoordinator; POST /provost/decision-records/{id}/transitions {action: RATIFY | RESCIND} to Provost but {action: EFFECTUATE | EVALUATE_IMPROVEMENT} to ReviewCoordinator; POST /provost/teach-out-plans/{id}/transitions {action: SUBMIT} to ProgramChair, {action: APPROVE | RETURN} to Provost and {action: ACTIVATE} to ReviewCoordinator — a role listed on the endpoint that requests an action it does not own is refused here, before any state or body check."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role is ProgramChair, X-User-ID equals the id of the AcademicProgram the target resource belongs to (followed transitively: self-study -> cycle -> program, plan -> program, appointment -> program)."
    error_id: ERR_NOT_PROGRAM_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list contains ProgramChair"

  - priority: 5
    category: auth
    check: "When X-User-Role is ExternalReviewer, X-User-ID equals ReviewerVisit.reviewer_id for the visit in the path."
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST|GET /provost/reviewer-visits/{id}/reports"

  - priority: 6
    category: auth
    check: "On DecisionRecord RATIFY, X-User-ID differs from DecisionRecord.proposed_by_user_id. Checked before any state precondition, so a self-ratification attempt on an already-ratified decision still reports the duties failure."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /provost/decision-records/{id}/transitions {action: RATIFY}"

  - priority: 7
    category: existence
    check: "Every id in the path resolves to an existing row, validated left-to-right in path order."
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_SELF_STUDY_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_DECISION_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_GUARANTEE_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every path-parameterised endpoint"

  - priority: 8
    category: existence
    check: "Every foreign key supplied in a request body resolves to an existing row: reviewer_id, receiving_program_id, decision_id, cycle_id."
    error_id: "ERR_REVIEWER_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_DECISION_NOT_FOUND | ERR_CYCLE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /provost/reviewer-visits, POST /provost/review-cycles/{id}/decision-records, POST /provost/academic-programs/{id}/teach-out-plans"

  - priority: 9
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum values in range, integers non-negative where the field is a count or a cent amount, fte in (0, 1], window_end_at strictly after window_start_at, term indices >= 1, market_demand_index within 0..100, advised_credits_per_term <= max_credits_per_term."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "every POST and PATCH"

  - priority: 10
    category: state
    check: "When the endpoint declares an OCC field, the supplied expected_program_version / expected_cycle_version equals the parent's current version. Evaluated before any state precondition so a stale writer always learns its view is stale rather than being told about a state it cannot see."
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_CYCLE_VERSION"
    http_status: 412
    applies_to: "POST /provost/academic-programs/{id}/teach-out-plans, POST /provost/review-cycles/{id}/decision-records"

  - priority: 11
    category: state
    check: "The target AcademicProgram's lifecycle_state is not one of the terminal states DISCONTINUED or CONSOLIDATED."
    error_id: ERR_PROGRAM_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every write nested under /provost/academic-programs/{id}, and every write on a descendant of a terminal program"

  - priority: 12
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2. One error per entity family. CARVE-OUT for DisplacedStudent: this check reports ERR_STUDENT_STATE_INVALID only when the student is already in a terminal advising_status (COMPLETED or WITHDRAWN); a COMPLETE attempt from PENDING or ADVISED is deliberately delegated to priority 40, whose ERR_ADVISING_REQUIRED names the actionable cause (no signed advising plan) instead of the generic state failure."
    error_id: "ERR_SELF_STUDY_NOT_DRAFT | ERR_CYCLE_STATE_INVALID | ERR_VISIT_NOT_SCHEDULED | ERR_DECISION_STATE_INVALID | ERR_NOTIFICATION_STATE_INVALID | ERR_PLAN_STATE_INVALID | ERR_GUARANTEE_STATE_INVALID | ERR_STUDENT_STATE_INVALID | ERR_APPOINTMENT_STATE_INVALID"
    http_status: 409
    applies_to: "every action and transition endpoint"

  - priority: 13
    category: state
    check: "A requested catalog_status change is an edge declared in the AcademicProgram catalog_status machine, and CATALOG_WITHDRAWN is only reachable while lifecycle_state is DISCONTINUED or CONSOLIDATED."
    error_id: ERR_CATALOG_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /provost/academic-programs/{id}/catalog-status"

  - priority: 14
    category: business_constraint
    check: "AcademicProgram.code is unique across all programs."
    error_id: ERR_DUPLICATE_PROGRAM_CODE
    http_status: 409
    applies_to: "POST /provost/academic-programs"

  - priority: 15
    category: business_constraint
    check: "term_index is unique within one program's ViabilityMetricSnapshot set."
    error_id: ERR_DUPLICATE_TERM_SNAPSHOT
    http_status: 409
    applies_to: "POST /provost/academic-programs/{id}/metric-snapshots"

  - priority: 16
    category: business_constraint
    check: "A ReviewCycle has at most one SelfStudy."
    error_id: ERR_SELF_STUDY_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /provost/review-cycles/{id}/self-studies"

  - priority: 17
    category: business_constraint
    check: "A program has at most one ReviewCycle that is not in state CLOSED."
    error_id: ERR_OPEN_CYCLE_EXISTS
    http_status: 409
    applies_to: "POST /provost/academic-programs/{id}/review-cycles"

  - priority: 18
    category: business_constraint
    check: "Bounded loop counters have not been exhausted: SelfStudy.revision_round < 2 on RETURN, ReviewCycle.addendum_round < 2 on an addendum request, TeachOutPlan.plan_revision_round < 3 on plan RETURN."
    error_id: "ERR_REVISION_LIMIT_REACHED | ERR_ADDENDUM_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /provost/self-studies/{id}/transitions {action: RETURN}, POST /provost/review-cycles/{id}/program-response, POST /provost/teach-out-plans/{id}/transitions {action: RETURN}"

  - priority: 19
    category: business_temporal
    check: "The logical clock is at or before ReviewCycle.self_study_due_at when a SelfStudy is SUBMITTED. Ranks BELOW the state check at priority 12, so submitting an already-SUBMITTED self-study after the deadline reports ERR_SELF_STUDY_NOT_DRAFT, not the deadline error."
    error_id: ERR_SELF_STUDY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /provost/self-studies/{id}/transitions {action: SUBMIT}"

  - priority: 20
    category: business_constraint
    check: "SelfStudy.section_codes covers every code in ReviewCycle.required_section_codes; the shortfall is echoed on SelfStudy.missing_section_codes."
    error_id: ERR_SELF_STUDY_SECTIONS_INCOMPLETE
    http_status: 422
    applies_to: "POST /provost/self-studies/{id}/transitions {action: SUBMIT}"

  - priority: 21
    category: business_safety
    check: "ExternalReviewer.conflict_program_codes does not contain the AcademicProgram.code of the cycle being visited."
    error_id: ERR_REVIEWER_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: "POST /provost/reviewer-visits"

  - priority: 22
    category: business_temporal
    check: "The reviewer has no other ReviewerVisit in state SCHEDULED or COMPLETED whose half-open window [window_start_at, window_end_at) overlaps the requested window after each existing window is extended by travel_buffer_hours on BOTH sides. Touching windows (a.end == b.start) do not overlap; the buffer makes them conflict."
    error_id: ERR_REVIEWER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /provost/reviewer-visits"

  - priority: 23
    category: business_constraint
    check: "For every inclusive UTC calendar day spanned by the requested window, the count of the program's non-REPORTED visits already spanning that day, plus this one, does not exceed AcademicProgram.host_capacity_per_day. Reachable because a cycle in VISIT_SCHEDULED accepts further team members (§1.2 ReviewCycle self-loop). This is a per-day aggregate over a different geometry (inclusive day span) than the overlap check at priority 22 (half-open instant window with buffer)."
    error_id: ERR_PROGRAM_HOST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /provost/reviewer-visits"

  - priority: 24
    category: business_temporal
    check: "The logical clock is at or after ReviewerVisit.window_end_at when the visit is completed."
    error_id: ERR_VISIT_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /provost/reviewer-visits/{id}/complete"

  - priority: 25
    category: business_constraint
    check: "A first report may be filed only while ReviewerVisit.report_count == 0; further reports require ReviewCycle.state == ADDENDUM_REQUESTED."
    error_id: ERR_REPORT_ALREADY_FILED
    http_status: 409
    applies_to: "POST /provost/reviewer-visits/{id}/reports"

  - priority: 26
    category: business_referential
    check: "Every code in ReviewCycle.disputed_finding_codes appears in the finding_codes of at least one ReviewerReport filed against the cycle."
    error_id: ERR_UNKNOWN_FINDING_CODE
    http_status: 422
    applies_to: "POST /provost/review-cycles/{id}/program-response"

  - priority: 27
    category: business_safety
    check: "The proposed outcome is supported by AcademicProgram.viability_band, evaluated on the CURRENT composite_score: CONTINUE requires CONTINUE_ELIGIBLE or IMPROVEMENT_ELIGIBLE; IMPROVEMENT_PLAN requires IMPROVEMENT_ELIGIBLE or NONVIABLE; CONSOLIDATION and DISCONTINUATION require NONVIABLE unless AcademicProgram.discontinuation_override is true; every outcome is refused while the band is INSUFFICIENT_DATA."
    error_id: ERR_OUTCOME_NOT_SUPPORTED_BY_VIABILITY
    http_status: 422
    applies_to: "POST /provost/review-cycles/{id}/decision-records"

  - priority: 28
    category: business_referential
    check: "outcome == CONSOLIDATION supplies receiving_program_id; every other outcome omits it."
    error_id: ERR_RECEIVING_PROGRAM_REQUIRED
    http_status: 422
    applies_to: "POST /provost/review-cycles/{id}/decision-records"

  - priority: 29
    category: business_referential
    check: "The receiving program differs from the reviewed program, is in lifecycle_state ACTIVE, and has viability_band CONTINUE_ELIGIBLE. Re-checked at EFFECTUATE time because the receiving program's band can decay between proposal and effectuation."
    error_id: ERR_RECEIVING_PROGRAM_INELIGIBLE
    http_status: 422
    applies_to: "POST /provost/review-cycles/{id}/decision-records, POST /provost/decision-records/{id}/transitions {action: EFFECTUATE}"

  - priority: 30
    category: business_constraint
    check: "TeachOutPlan term indices are ordered last_admit_term_index < first_teach_out_term_index <= final_award_term_index, and final_award_term_index >= decision.effective_term_index."
    error_id: ERR_TEACH_OUT_HORIZON_INSUFFICIENT
    http_status: 422
    applies_to: "POST /provost/academic-programs/{id}/teach-out-plans"

  - priority: 31
    category: business_safety
    check: "Every non-VOIDED AgencyNotification of the decision is ACKNOWLEDGED before the decision is effectuated (decision.unacknowledged_notification_count == 0). Ranks ABOVE the severance budget check at priority 33: a decision that is both unacknowledged and unfunded reports the compliance failure."
    error_id: ERR_AGENCY_NOTICE_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE}"

  - priority: 32
    category: business_safety
    check: "outcome == DISCONTINUATION requires a TeachOutPlan on the program in state APPROVED and linked to this decision."
    error_id: ERR_TEACH_OUT_REQUIRED
    http_status: 409
    applies_to: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE}"

  - priority: 33
    category: business_fiscal
    check: "The staffing reduction is fully funded within the severance budget: AcademicProgram.deferred_fte == 0.00 when outcome is CONSOLIDATION or DISCONTINUATION. Non-zero deferred_fte can only arise from the cap breaking the waterfall (§1.3 staffing_reduction_waterfall step 4)."
    error_id: ERR_SEVERANCE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /provost/decision-records/{id}/transitions {action: EFFECTUATE}"

  - priority: 34
    category: business_constraint
    check: "TeachOutPlan APPROVE requires seat_shortfall == 0."
    error_id: ERR_COURSE_GUARANTEE_SHORTFALL
    http_status: 409
    applies_to: "POST /provost/teach-out-plans/{id}/transitions {action: APPROVE}"

  - priority: 35
    category: business_constraint
    check: "TeachOutPlan APPROVE requires at_risk_student_count == 0. Ranks BELOW the shortfall check at priority 34, so a plan that is both short of seats and carrying an at-risk student reports the seat shortfall."
    error_id: ERR_AT_RISK_STUDENTS_PRESENT
    http_status: 409
    applies_to: "POST /provost/teach-out-plans/{id}/transitions {action: APPROVE}"

  - priority: 36
    category: business_safety
    check: "TeachOutPlan ACTIVATE requires the linked DecisionRecord to be in state EFFECTUATED."
    error_id: ERR_DECISION_NOT_EFFECTUATED
    http_status: 409
    applies_to: "POST /provost/teach-out-plans/{id}/transitions {action: ACTIVATE}"

  - priority: 37
    category: business_constraint
    check: "A seat COMMIT keeps CourseGuarantee.seats_committed <= seats_guaranteed. Aggregate check — each individual commit can be small while the collective exceeds the guarantee."
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /provost/course-guarantees/{id}/seat-allocations {action: COMMIT}"

  - priority: 38
    category: business_constraint
    check: "A seat RELEASE never drives CourseGuarantee.seats_committed or DisplacedStudent.committed_seat_count below 0, and the named student actually holds at least the released count on this guarantee."
    error_id: ERR_SEAT_NOT_COMMITTED
    http_status: 409
    applies_to: "POST /provost/course-guarantees/{id}/seat-allocations {action: RELEASE}"

  - priority: 39
    category: business_constraint
    check: "A guarantee may be WAIVED only while seats_committed == 0, so the seat conservation invariant cannot be broken by removing a guarantee that students still hold seats on."
    error_id: ERR_GUARANTEE_HAS_COMMITMENTS
    http_status: 409
    applies_to: "POST /provost/course-guarantees/{id}/seat-allocations {action: WAIVE}"

  - priority: 40
    category: business_safety
    check: "A DisplacedStudent may be marked COMPLETE only from advising_status PLAN_SIGNED — a student who never signed an advising plan cannot be recorded as completing the teach-out. Reached from PENDING and ADVISED by the priority-12 carve-out; a COMPLETE on an already COMPLETED or WITHDRAWN student is priority 12's ERR_STUDENT_STATE_INVALID instead."
    error_id: ERR_ADVISING_REQUIRED
    http_status: 409
    applies_to: "POST /provost/displaced-students/{id}/progress {action: COMPLETE}"

  - priority: 41
    category: business_constraint
    check: "ISSUE_NOTICE targets the appointment holding the minimum reduction_sequence_position among the program's ASSIGNED appointments, and that position is non-null (an appointment the waterfall never funded cannot be noticed)."
    error_id: ERR_REDUCTION_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /provost/faculty-appointments/{id}/transitions {action: ISSUE_NOTICE}"

  - priority: 42
    category: business_constraint
    check: "notice_days is at least STATUTORY_NOTICE_DAYS for the appointment's tenure_status."
    error_id: ERR_TENURE_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /provost/faculty-appointments/{id}/transitions {action: ISSUE_NOTICE}"

  - priority: 43
    category: business_safety
    check: "A TENURED appointment may not be SEPARATED while any TeachOutPlan on its program is in state APPROVED or IN_EFFECT — the tenure obligation outlives the discontinuation decision until the teach-out finishes. Ranks ABOVE the elapsed-notice check at priority 44."
    error_id: ERR_TENURE_OBLIGATION_ACTIVE
    http_status: 409
    applies_to: "POST /provost/faculty-appointments/{id}/transitions {action: SEPARATE}"

  - priority: 44
    category: business_temporal
    check: "The logical clock is at or after notice_issued_at + notice_days * 24 hours. Equality separates; one second earlier does not."
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /provost/faculty-appointments/{id}/transitions {action: SEPARATE}"

  - priority: 45
    category: business_constraint
    check: "RETAIN requires a TeachOutPlan on the appointment's program in state APPROVED or IN_EFFECT; PROPOSE_REASSIGNMENT requires reassigned_to_department_code to differ from the program's department_code."
    error_id: ERR_REASSIGNMENT_TARGET_INVALID
    http_status: 422
    applies_to: "POST /provost/faculty-appointments/{id}/transitions"

  - priority: 46
    category: business_constraint
    check: "A new TeachOutPlan may only supersede an existing plan that is still in DRAFT or SUBMITTED. Plan creation is refused when the program already has a TeachOutPlan in state APPROVED, IN_EFFECT or COMPLETED — §1.2 declares no plan-creation edge out of those states, and once students are being taught out the live plan cannot be replaced by a fresh draft."
    error_id: ERR_TEACH_OUT_IN_EFFECT
    http_status: 409
    applies_to: "POST /provost/academic-programs/{id}/teach-out-plans"

# =============================================================================
# §1.5 API Endpoint Table — every business path is nested under api_prefix
#      `/provost`; the single test-driving endpoint lives under `/_clock`.
#      Every path template carries at most one placeholder, always `{id}`,
#      naming the resource identified by the segment immediately before it.
# =============================================================================

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock to any UTC instant; every deadline, window, notice period and sweep comparison in this API reads this clock and never the host wall clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z, which is the mandatory startup default and sits at or before every fixture date used by this scaffold."
    roles: [ReviewCoordinator, Provost, Registrar, HRPartner, ProgramChair, ExternalReviewer]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Sets the logical clock. Does not itself advance any state machine — no notice is marked OVERDUE until POST /provost/compliance-sweeps runs."]

  - method: POST
    path: "/provost/compliance-sweeps"
    description: "Runs the agency-notification compliance sweep against the current logical clock, marking every PENDING notification whose due_at has strictly passed as OVERDUE. Idempotent for a fixed clock value."
    roles: [ReviewCoordinator]
    code: 200
    input: []
    output: { swept_at: string, marked_overdue_count: integer, marked_overdue_notification_ids: "string[]" }
    side_effects:
      - "AgencyNotification PENDING -> OVERDUE for every notification with clock > due_at; sets overdue_marked_at and increments AgencyNotification.version by 1"
      - "Does not change DecisionRecord.unacknowledged_notification_count (OVERDUE is still unacknowledged) and does not change ReviewCycle.compliance_posture"

  - method: POST
    path: "/provost/academic-programs"
    description: "Registers an academic program in the provost's review portfolio. lifecycle_state starts ACTIVE, catalog_status starts LISTED, viability_band starts INSUFFICIENT_DATA, faculty_fte_baseline starts 0.00."
    roles: [ReviewCoordinator]
    code: 201
    input: [code, name, degree_level, department_code, "host_capacity_per_day?"]
    output: AcademicProgram
    side_effects: ["Creates the program with snapshot_count 0, composite_score null, both cost_per_credit_hour fields null, discontinuation_override false, and every FTE aggregate 0.00"]

  - method: GET
    path: "/provost/academic-programs"
    description: "Lists academic programs. The consolidated_into_program_id filter is the reverse-reachability channel for the self-referential consolidation FK — it returns every program folded into the given receiving program."
    roles: [ReviewCoordinator, Provost, Registrar, HRPartner]
    code: 200
    input: ["lifecycle_state?", "catalog_status?", "department_code?", "viability_band?", "consolidated_into_program_id?", "limit?", "offset?"]
    output: AcademicProgram[]
    side_effects: []

  - method: GET
    path: "/provost/academic-programs/{id}"
    description: "Retrieves one academic program with both state axes, every derived viability figure and every derived staffing figure."
    roles: [ReviewCoordinator, Provost, Registrar, HRPartner, ProgramChair]
    code: 200
    input: []
    output: AcademicProgram
    side_effects: []

  - method: POST
    path: "/provost/academic-programs/{id}/catalog-status"
    description: "Moves the program along its catalog_status axis independently of its lifecycle_state axis. Used by the registrar to suppress marketing early, to reverse a premature suppression, or to withdraw the catalog entry once the lifecycle axis is terminal."
    roles: [Registrar]
    code: 200
    input: [target_catalog_status, "suppression_note?"]
    output: AcademicProgram
    side_effects:
      - "Sets catalog_status to target_catalog_status if that edge is declared on the catalog machine; increments AcademicProgram.version by 1"
      - "Does not touch lifecycle_state, catalog_status_pre_decision, or any derived viability field"

  - method: POST
    path: "/provost/academic-programs/{id}/metric-snapshots"
    description: "Appends one immutable term snapshot of viability metrics. Snapshots are the only source of the program's cost and viability figures."
    roles: [ReviewCoordinator]
    code: 201
    input: [term_code, term_index, enrollment_headcount, credit_hours, direct_cost_cents, completions_count, market_demand_index]
    output: ViabilityMetricSnapshot
    side_effects:
      - "Stamps the snapshot's own per-term cost_per_credit_hour_cents diagnostic"
      - "Increments AcademicProgram.snapshot_count by 1"
      - "Recomputes §1.3 program_cost_per_credit_hour (both variants) then §1.3 program_viability_composite (composite_score, viability_band) then §1.3 staffing_reduction_waterfall (the severance cap moves with the cost window)"
      - "Increments AcademicProgram.version by 1"

  - method: GET
    path: "/provost/academic-programs/{id}/metric-snapshots"
    description: "Lists the program's term snapshots. Reverse-reachability channel for ViabilityMetricSnapshot.program_id."
    roles: [ReviewCoordinator, Provost, ProgramChair]
    code: 200
    input: ["term_index?", "limit?", "offset?"]
    output: ViabilityMetricSnapshot[]
    side_effects: []

  - method: POST
    path: "/provost/academic-programs/{id}/review-cycles"
    description: "Opens a program review cycle. The cycle starts in SELF_STUDY_OPEN with compliance_posture NOT_APPLICABLE and addendum_round 0, and moves the program onto its UNDER_REVIEW lifecycle state."
    roles: [ReviewCoordinator]
    code: 201
    input: [cycle_year, self_study_due_at, required_section_codes]
    output: ReviewCycle
    side_effects:
      - "AcademicProgram lifecycle_state ACTIVE -> UNDER_REVIEW (or IMPROVEMENT_MONITORED -> UNDER_REVIEW when a prior improvement plan went UNMET); increments AcademicProgram.version by 1"

  - method: GET
    path: "/provost/academic-programs/{id}/review-cycles"
    description: "Lists the program's review cycles, newest cycle_year first. Reverse-reachability channel for ReviewCycle.program_id."
    roles: [ReviewCoordinator, Provost, ProgramChair]
    code: 200
    input: ["state?", "cycle_year?", "limit?", "offset?"]
    output: ReviewCycle[]
    side_effects: []

  - method: POST
    path: "/provost/academic-programs/{id}/faculty-appointments"
    description: "Records a faculty appointment on the program. Appointments start ASSIGNED and immediately enter the staffing reduction waterfall's ordered pool."
    roles: [HRPartner]
    code: 201
    input: [faculty_number, tenure_status, fte, annual_salary_cents]
    output: FacultyAppointment
    side_effects:
      - "Adds fte to AcademicProgram.faculty_fte_baseline, active_fte_total and assigned_pool_fte"
      - "Recomputes §1.3 staffing_reduction_waterfall — notice_pay_cents on every appointment, then reducible_fte, reduction_sequence_position, staffing_liability_cents and deferred_fte"
      - "Increments AcademicProgram.version by 1"

  - method: GET
    path: "/provost/academic-programs/{id}/faculty-appointments"
    description: "Lists the program's faculty appointments in reduction order (reduction_sequence_position ASC, unfunded appointments last). Reverse-reachability channel for FacultyAppointment.program_id."
    roles: [HRPartner, Provost, ReviewCoordinator, ProgramChair]
    code: 200
    input: ["state?", "tenure_status?", "limit?", "offset?"]
    output: FacultyAppointment[]
    side_effects: []

  - method: POST
    path: "/provost/academic-programs/{id}/teach-out-plans"
    description: "Files a teach-out plan for the program under a ratified or effectuated decision. Optimistically concurrent on the program: the author must echo the program version their draft was built against. A newly created plan supersedes any DRAFT or SUBMITTED plan already on the program."
    roles: [ProgramChair]
    code: 201
    input: [decision_id, last_admit_term_index, first_teach_out_term_index, final_award_term_index, expected_program_version]
    output: TeachOutPlan
    side_effects:
      - "Rejects with ERR_STALE_PROGRAM_VERSION (412) unless expected_program_version equals AcademicProgram.version"
      - "Creates the plan in DRAFT with plan_revision_round 0 and every seat aggregate 0"
      - "Moves any DRAFT or SUBMITTED plan on the same program to SUPERSEDED"
      - "Rejects with ERR_TEACH_OUT_IN_EFFECT (409) when the program already holds a plan in state APPROVED, IN_EFFECT or COMPLETED (§1.4 priority 46)"
      - "increments AcademicProgram.version by 1"

  - method: GET
    path: "/provost/teach-out-plans"
    description: "Lists teach-out plans. Reverse-reachability channel for both TeachOutPlan.program_id and TeachOutPlan.decision_id."
    roles: [ProgramChair, Provost, ReviewCoordinator, Registrar, HRPartner]
    code: 200
    input: ["program_id?", "decision_id?", "state?", "limit?", "offset?"]
    output: TeachOutPlan[]
    side_effects: []

  - method: GET
    path: "/provost/teach-out-plans/{id}"
    description: "Retrieves one teach-out plan with its full derived seat ledger and student risk counters."
    roles: [ProgramChair, Provost, ReviewCoordinator, Registrar]
    code: 200
    input: []
    output: TeachOutPlan
    side_effects: []

  - method: POST
    path: "/provost/teach-out-plans/{id}/transitions"
    description: "Drives the teach-out plan state machine. action is one of SUBMIT, RETURN, APPROVE, ACTIVATE."
    roles: [ProgramChair, Provost, ReviewCoordinator]
    code: 200
    input: [action, "revision_notes?"]
    output: TeachOutPlan
    side_effects:
      - "SUBMIT (ProgramChair): DRAFT -> SUBMITTED"
      - "RETURN (Provost): SUBMITTED -> DRAFT, increments plan_revision_round by 1, stores revision_notes"
      - "APPROVE (Provost): SUBMITTED -> APPROVED once seat_shortfall == 0 and at_risk_student_count == 0; stamps approved_at"
      - "ACTIVATE (ReviewCoordinator): APPROVED -> IN_EFFECT, stamps activated_at, moves every PLANNED guarantee with term_index <= first_teach_out_term_index to OFFERED, and auto-completes the plan in the same request when open_student_count == 0 — which cascades AcademicProgram to DISCONTINUED and CATALOG_WITHDRAWN"
      - "increments TeachOutPlan.version by 1"

  - method: POST
    path: "/provost/teach-out-plans/{id}/course-guarantees"
    description: "Adds a course-offering guarantee to the teach-out plan. Guarantees are the seat supply side of the ledger and also the instructional-demand input to the staffing reduction waterfall."
    roles: [ProgramChair]
    code: 201
    input: [course_code, term_index, seats_guaranteed]
    output: CourseGuarantee
    side_effects:
      - "Creates the guarantee in PLANNED with seats_committed 0 and seats_available == seats_guaranteed"
      - "Recomputes §1.3 teach_out_seat_ledger (guaranteed_seat_total, seat_shortfall) on the plan"
      - "Recomputes §1.3 staffing_reduction_waterfall on the program — one more guaranteed section raises retained_teach_out_fte and can lower reducible_fte and deferred_fte"
      - "increments TeachOutPlan.version by 1"

  - method: GET
    path: "/provost/teach-out-plans/{id}/course-guarantees"
    description: "Lists the plan's course guarantees. Reverse-reachability channel for CourseGuarantee.teach_out_plan_id."
    roles: [ProgramChair, Provost, Registrar, ReviewCoordinator]
    code: 200
    input: ["status?", "term_index?", "limit?", "offset?"]
    output: CourseGuarantee[]
    side_effects: []

  - method: POST
    path: "/provost/course-guarantees/{id}/seat-allocations"
    description: "Operates the seat ledger and the guarantee's own status axis. action is one of COMMIT, RELEASE, SUBSTITUTE, WAIVE. COMMIT and RELEASE move seats between a guarantee and one named displaced student and must preserve the seat conservation invariant."
    roles: [Registrar]
    code: 200
    input: [action, "displaced_student_id?", "seat_count?", "substitute_course_code?", "substitution_justification?", "waived_reason_code?"]
    output: CourseGuarantee
    side_effects:
      - "COMMIT: adds seat_count to CourseGuarantee.seats_committed and to DisplacedStudent.committed_seat_count, lowers seats_available; refuses with ERR_SEAT_CAPACITY_EXCEEDED if seats_committed would exceed seats_guaranteed"
      - "RELEASE: subtracts seat_count from both sides; refuses with ERR_SEAT_NOT_COMMITTED if the student does not hold that many seats on this guarantee"
      - "SUBSTITUTE: {PLANNED, OFFERED} -> SUBSTITUTED, stores substitute_course_code and substitution_justification, leaves the seat ledger untouched"
      - "WAIVE: {PLANNED, OFFERED, SUBSTITUTED} -> WAIVED only while seats_committed == 0; drops the row out of guaranteed_seat_total"
      - "Recomputes §1.3 teach_out_seat_ledger on the plan; SUBSTITUTE and WAIVE also recompute §1.3 staffing_reduction_waterfall on the program"
      - "increments CourseGuarantee.version by 1"

  - method: POST
    path: "/provost/teach-out-plans/{id}/displaced-students"
    description: "Enrolls a displaced student into the teach-out plan. The student starts with advising_status PENDING and therefore with the OPTIMISTIC_FULL_LOAD projection variant."
    roles: [Registrar]
    code: 201
    input: [student_number, credits_remaining, max_credits_per_term]
    output: DisplacedStudent
    side_effects:
      - "Computes §1.3 displaced_student_completion_projection under OPTIMISTIC_FULL_LOAD — projected_terms_remaining, projected_completion_term_index, at_risk — and required_seat_count"
      - "Recomputes §1.3 teach_out_seat_ledger (required_seat_total, seat_shortfall, open_student_count, at_risk_student_count)"
      - "increments TeachOutPlan.version by 1"

  - method: GET
    path: "/provost/teach-out-plans/{id}/displaced-students"
    description: "Lists the plan's displaced students with their current projection variant and risk flag. Reverse-reachability channel for DisplacedStudent.teach_out_plan_id."
    roles: [Registrar, Provost, ReviewCoordinator, ProgramChair]
    code: 200
    input: ["advising_status?", "at_risk?", "limit?", "offset?"]
    output: DisplacedStudent[]
    side_effects: []

  - method: POST
    path: "/provost/displaced-students/{id}/advising"
    description: "Records an advising outcome for a displaced student. Supplying plan_signed true moves the student to PLAN_SIGNED, otherwise to ADVISED; either way the projection switches to the CONSERVATIVE_ADVISED_LOAD variant."
    roles: [Registrar]
    code: 200
    input: [advised_credits_per_term, plan_signed]
    output: DisplacedStudent
    side_effects:
      - "advising_status PENDING|ADVISED -> ADVISED or PLAN_SIGNED; stamps advised_at"
      - "Switches projection_variant to CONSERVATIVE_ADVISED_LOAD and re-derives projected_terms_remaining, projected_completion_term_index and at_risk per §1.3 displaced_student_completion_projection"
      - "Recomputes §1.3 teach_out_seat_ledger — at_risk_student_count can rise here and block a later plan APPROVE"
      - "increments DisplacedStudent.version by 1"

  - method: POST
    path: "/provost/displaced-students/{id}/progress"
    description: "Closes out a displaced student's teach-out participation. action is COMPLETE (requires PLAN_SIGNED) or WITHDRAW (allowed from any open status). Either action releases the student's seats and can bubble the whole teach-out to completion."
    roles: [Registrar]
    code: 200
    input: [action, "completion_term_index?", "withdrawal_reason_code?"]
    output: DisplacedStudent
    side_effects:
      - "COMPLETE: PLAN_SIGNED -> COMPLETED, stores completion_term_index; WITHDRAW: any open status -> WITHDRAWN, stores withdrawal_reason_code"
      - "Releases every seat the student holds: each affected CourseGuarantee.seats_committed drops by the held count and committed_seat_count becomes 0, preserving the seat conservation invariant"
      - "Recomputes §1.3 teach_out_seat_ledger; when open_student_count reaches 0 while the plan is IN_EFFECT the plan auto-transitions to COMPLETED, which cascades AcademicProgram TEACH_OUT_ACTIVE -> DISCONTINUED, then catalog_status ADMISSIONS_CLOSED -> CATALOG_WITHDRAWN, then every TEACH_OUT_RETAINED appointment back to ASSIGNED with a full §1.3 staffing_reduction_waterfall re-derivation"
      - "increments DisplacedStudent.version by 1"

  - method: GET
    path: "/provost/review-cycles/{id}"
    description: "Retrieves one review cycle with its state, addendum round, response fields and derived compliance_posture."
    roles: [ReviewCoordinator, Provost, ProgramChair, ExternalReviewer]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: []

  - method: POST
    path: "/provost/review-cycles/{id}/self-studies"
    description: "Creates the cycle's single self-study document in DRAFT. A cycle accepts at most one self-study; revisions reuse this row through the DRAFT/SUBMITTED loop."
    roles: [ProgramChair]
    code: 201
    input: [narrative, section_codes]
    output: SelfStudy
    side_effects: ["Creates the self-study in DRAFT with revision_round 0 and missing_section_codes derived against the cycle's required_section_codes"]

  - method: GET
    path: "/provost/review-cycles/{id}/self-studies"
    description: "Lists the cycle's self-study — an array of length 0 or 1. Reverse-reachability channel for SelfStudy.cycle_id."
    roles: [ReviewCoordinator, Provost, ProgramChair, ExternalReviewer]
    code: 200
    input: ["state?"]
    output: SelfStudy[]
    side_effects: []

  - method: PATCH
    path: "/provost/self-studies/{id}"
    description: "Edits a DRAFT self-study's narrative and section coverage. The only mutable path for a returned self-study, and the reason the revision loop can converge."
    roles: [ProgramChair]
    code: 200
    input: ["narrative?", "section_codes?", "attestation_note?"]
    output: SelfStudy
    side_effects:
      - "Rewrites missing_section_codes against the cycle's required_section_codes"
      - "increments SelfStudy.version by 1"

  - method: POST
    path: "/provost/self-studies/{id}/transitions"
    description: "Drives the self-study state machine. action is one of SUBMIT (chair), RETURN (coordinator), ACCEPT (coordinator)."
    roles: [ProgramChair, ReviewCoordinator]
    code: 200
    input: [action, "revision_notes?"]
    output: SelfStudy
    side_effects:
      - "SUBMIT: DRAFT -> SUBMITTED, stamps submitted_at; refused after the cycle's self_study_due_at and refused while missing_section_codes is non-empty"
      - "RETURN: SUBMITTED -> DRAFT, increments revision_round by 1, stores revision_notes; refused once revision_round has reached 2"
      - "ACCEPT: SUBMITTED -> ACCEPTED, stamps accepted_at, and cascades ReviewCycle SELF_STUDY_OPEN -> SELF_STUDY_ACCEPTED"
      - "increments SelfStudy.version by 1"

  - method: POST
    path: "/provost/review-cycles/{id}/program-response"
    description: "Files the program's response to the reviewer report, or requests a reviewer addendum. A response with concurrence DISPUTE and a non-empty disputed_finding_codes list moves the cycle to ADDENDUM_REQUESTED instead of RESPONSE_SUBMITTED, reopening the reviewer's report channel."
    roles: [ProgramChair]
    code: 200
    input: [response_concurrence, response_text, "disputed_finding_codes?"]
    output: ReviewCycle
    side_effects:
      - "CONCUR or PARTIAL_CONCUR: REPORT_RECEIVED -> RESPONSE_SUBMITTED, stamps response_submitted_at"
      - "DISPUTE with disputed_finding_codes: REPORT_RECEIVED -> ADDENDUM_REQUESTED and increments addendum_round by 1; refused once addendum_round has reached 2"
      - "Every code in disputed_finding_codes must appear in some ReviewerReport.finding_codes on this cycle"
      - "increments ReviewCycle.version by 1"

  - method: POST
    path: "/provost/external-reviewers"
    description: "Registers an external reviewer with their conflict-of-interest declarations and travel buffer. X-User-ID for the ExternalReviewer role is this row's id."
    roles: [ReviewCoordinator]
    code: 201
    input: [full_name, institution, specialty_code, "conflict_program_codes?", "travel_buffer_hours?"]
    output: ExternalReviewer
    side_effects: ["Creates the reviewer with visit_count 0"]

  - method: POST
    path: "/provost/reviewer-visits"
    description: "Schedules an external reviewer's site visit against a review cycle. A cycle in SELF_STUDY_ACCEPTED or VISIT_SCHEDULED accepts visits, so a review team of several reviewers can be booked onto the same cycle. The window is half-open [window_start_at, window_end_at); the derived span_start_date and span_end_date give the inclusive UTC calendar days the visit occupies for host-capacity purposes."
    roles: [ReviewCoordinator]
    code: 201
    input: [cycle_id, reviewer_id, window_start_at, window_end_at]
    output: ReviewerVisit
    side_effects:
      - "Refuses with ERR_REVIEWER_CONFLICT_OF_INTEREST when the reviewer declared the program's code"
      - "Refuses with ERR_REVIEWER_WINDOW_CONFLICT when the buffer-extended window of another SCHEDULED or COMPLETED visit of the same reviewer overlaps"
      - "Refuses with ERR_PROGRAM_HOST_CAPACITY_EXCEEDED when any spanned inclusive calendar day would exceed AcademicProgram.host_capacity_per_day"
      - "Creates the visit in SCHEDULED with report_count 0, derives span_start_date and span_end_date, increments ExternalReviewer.visit_count by 1, and cascades ReviewCycle SELF_STUDY_ACCEPTED -> VISIT_SCHEDULED (a cycle already in VISIT_SCHEDULED stays there)"
      - "increments ReviewCycle.version by 1"

  - method: GET
    path: "/provost/reviewer-visits"
    description: "Lists reviewer visits. Reverse-reachability channel for both ReviewerVisit.cycle_id and ReviewerVisit.reviewer_id."
    roles: [ReviewCoordinator, Provost, ProgramChair, ExternalReviewer]
    code: 200
    input: ["cycle_id?", "reviewer_id?", "state?", "limit?", "offset?"]
    output: ReviewerVisit[]
    side_effects: []

  - method: GET
    path: "/provost/reviewer-visits/{id}"
    description: "Retrieves one reviewer visit with its window, derived day span and report count."
    roles: [ReviewCoordinator, Provost, ProgramChair, ExternalReviewer]
    code: 200
    input: []
    output: ReviewerVisit
    side_effects: []

  - method: POST
    path: "/provost/reviewer-visits/{id}/complete"
    description: "Marks a scheduled visit as completed. Permitted only once the logical clock has reached the visit's window_end_at."
    roles: [ReviewCoordinator]
    code: 200
    input: []
    output: ReviewerVisit
    side_effects:
      - "SCHEDULED -> COMPLETED, stamps completed_at, cascades ReviewCycle VISIT_SCHEDULED -> VISIT_COMPLETED"
      - "increments ReviewerVisit.version by 1"

  - method: POST
    path: "/provost/reviewer-visits/{id}/reports"
    description: "Files the reviewer's report, or an addendum to it. The first report requires report_count 0; every later report requires the cycle to be sitting in ADDENDUM_REQUESTED. Only the visit's own reviewer may file."
    roles: [ExternalReviewer]
    code: 201
    input: [recommendation, finding_codes, narrative]
    output: ReviewerReport
    side_effects:
      - "Creates an immutable, append-only report with sequence_number = report_count + 1 and filed_at = clock"
      - "Increments ReviewerVisit.report_count by 1 and moves the visit COMPLETED -> REPORTED (a REPORTED visit stays REPORTED for addenda)"
      - "Cascades ReviewCycle VISIT_COMPLETED -> REPORT_RECEIVED, or ADDENDUM_REQUESTED -> REPORT_RECEIVED for an addendum"
      - "increments ReviewCycle.version by 1"

  - method: GET
    path: "/provost/reviewer-visits/{id}/reports"
    description: "Lists the visit's reports in sequence_number order. Reverse-reachability channel for ReviewerReport.visit_id, and the only discovery channel for the finding codes a program response may dispute."
    roles: [ReviewCoordinator, Provost, ProgramChair, ExternalReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewerReport[]
    side_effects: []

  - method: POST
    path: "/provost/review-cycles/{id}/decision-records"
    description: "Proposes a review outcome for the cycle. Optimistically concurrent on the cycle: the proposer must echo the cycle version their proposal was built against. A new proposal withdraws any PROPOSED decision already on the cycle."
    roles: [Provost]
    code: 201
    input: [outcome, rationale, effective_term_index, expected_cycle_version, "receiving_program_id?", "improvement_target_score?", "improvement_review_term_index?", "improvement_milestones?"]
    output: DecisionRecord
    side_effects:
      - "Rejects with ERR_STALE_CYCLE_VERSION (412) unless expected_cycle_version equals ReviewCycle.version"
      - "Refuses outcomes the program's current viability_band does not support (ERR_OUTCOME_NOT_SUPPORTED_BY_VIABILITY)"
      - "Creates the decision in PROPOSED with improvement_state NOT_APPLICABLE, proposed_by_user_id = X-User-ID, and snapshots composite_score_at_proposal and viability_band_at_proposal"
      - "Moves any PROPOSED decision on the same cycle to WITHDRAWN"
      - "Cascades ReviewCycle RESPONSE_SUBMITTED -> DECISION_PROPOSED and increments ReviewCycle.version by 1"

  - method: GET
    path: "/provost/decision-records"
    description: "Lists decision records. Reverse-reachability channel for both DecisionRecord.cycle_id and DecisionRecord.receiving_program_id."
    roles: [Provost, ReviewCoordinator, ProgramChair, Registrar, HRPartner]
    code: 200
    input: ["cycle_id?", "receiving_program_id?", "outcome?", "state?", "limit?", "offset?"]
    output: DecisionRecord[]
    side_effects: []

  - method: GET
    path: "/provost/decision-records/{id}"
    description: "Retrieves one decision record with its outcome branch fields, ratification audit trail, improvement axis and notification counters."
    roles: [Provost, ReviewCoordinator, ProgramChair, Registrar, HRPartner]
    code: 200
    input: []
    output: DecisionRecord
    side_effects: []

  - method: POST
    path: "/provost/decision-records/{id}/transitions"
    description: "Drives the decision record's two axes. action is one of RATIFY (provost, must differ from the proposer), EFFECTUATE (coordinator), RESCIND (provost), EVALUATE_IMPROVEMENT (coordinator)."
    roles: [Provost, ReviewCoordinator]
    code: 200
    input: [action, "ratification_note?", "rescission_reason?"]
    output: DecisionRecord
    side_effects:
      - "RATIFY: PROPOSED -> RATIFIED under segregation of duties, then the four-hop cascade — cycle DECIDED, program lifecycle onto its outcome branch, catalog_status_pre_decision captured with LISTED -> MARKETING_SUPPRESSED plus the two AUTO_MINTED notifications and their due_at values per §1.3 agency_notice_deadline, then cycle.compliance_posture -> NOTICES_PENDING"
      - "EFFECTUATE: RATIFIED -> EFFECTUATED once every notice is acknowledged and (for CONSOLIDATION and DISCONTINUATION) deferred_fte is 0.00; applies the outcome's terminal side effects and closes the cycle; IMPROVEMENT_PLAN also moves improvement_state to ACTIVE"
      - "RESCIND: RATIFIED -> RESCINDED, voids every notification, restores both AcademicProgram axes from catalog_status_pre_decision, supersedes non-effective teach-out plans, un-retains appointments, and returns the cycle to RESPONSE_SUBMITTED"
      - "EVALUATE_IMPROVEMENT: improvement_state ACTIVE -> MET or UNMET by comparing AcademicProgram.composite_score with improvement_target_score; UNMET sets discontinuation_override true, returns the program to UNDER_REVIEW and reopens the cycle at RESPONSE_SUBMITTED"
      - "increments DecisionRecord.version by 1"

  - method: POST
    path: "/provost/decision-records/{id}/agency-notifications"
    description: "Adds an agency notification to a decision by hand — for example the FEDERAL notice the ratification cascade never auto-mints. due_at is derived from the decision's ratified_at when it exists, otherwise from the current clock."
    roles: [ReviewCoordinator]
    code: 201
    input: [agency_type, agency_code]
    output: AgencyNotification
    side_effects:
      - "Creates the notification in PENDING with origin MANUAL and due_at per §1.3 agency_notice_deadline"
      - "Recomputes DecisionRecord.notification_count and unacknowledged_notification_count and ReviewCycle.compliance_posture — which is how a manual notice can re-block an EFFECTUATE that was previously clear"
      - "increments DecisionRecord.version by 1"

  - method: GET
    path: "/provost/decision-records/{id}/agency-notifications"
    description: "Lists the decision's agency notifications with their deadlines and overdue audit stamps. Reverse-reachability channel for AgencyNotification.decision_id, and the only discovery channel for the notifications the ratification cascade mints."
    roles: [ReviewCoordinator, Provost, ProgramChair]
    code: 200
    input: ["status?", "agency_type?", "limit?", "offset?"]
    output: AgencyNotification[]
    side_effects: []

  - method: POST
    path: "/provost/agency-notifications/{id}/transitions"
    description: "Drives the notification status machine. action is SEND (requires a non-blank transmitted_reference; allowed from PENDING and from OVERDUE) or ACKNOWLEDGE (requires SENT)."
    roles: [ReviewCoordinator]
    code: 200
    input: [action, "transmitted_reference?"]
    output: AgencyNotification
    side_effects:
      - "SEND: PENDING|OVERDUE -> SENT, stamps sent_at, stores transmitted_reference, preserves overdue_marked_at as the missed-deadline audit trail"
      - "ACKNOWLEDGE: SENT -> ACKNOWLEDGED, stamps acknowledged_at, lowers DecisionRecord.unacknowledged_notification_count and can move ReviewCycle.compliance_posture to NOTICES_CLEARED"
      - "increments AgencyNotification.version by 1"

  - method: POST
    path: "/provost/faculty-appointments/{id}/transitions"
    description: "Drives the faculty appointment state machine. action is one of RETAIN, PROPOSE_REASSIGNMENT, WITHDRAW_REASSIGNMENT, CONFIRM_REASSIGNMENT, ISSUE_NOTICE, SEPARATE. Every action re-derives the program's staffing waterfall."
    roles: [HRPartner]
    code: 200
    input: [action, "reassigned_to_department_code?", "notice_days?"]
    output: FacultyAppointment
    side_effects:
      - "RETAIN: ASSIGNED -> TEACH_OUT_RETAINED (requires an APPROVED or IN_EFFECT plan on the program), removing the fte from assigned_pool_fte"
      - "PROPOSE_REASSIGNMENT / WITHDRAW_REASSIGNMENT: ASSIGNED <-> REASSIGNMENT_PROPOSED, the withdraw edge incrementing reassignment_withdraw_count and restoring assigned_pool_fte exactly"
      - "CONFIRM_REASSIGNMENT: REASSIGNMENT_PROPOSED -> REASSIGNED, moving the fte from active_fte_total into reassigned_fte_total"
      - "ISSUE_NOTICE: ASSIGNED -> NOTICE_ISSUED for the minimum reduction_sequence_position only, with notice_days at or above the statutory minimum for the tenure_status; stamps notice_issued_at"
      - "SEPARATE: NOTICE_ISSUED -> SEPARATED once the notice period has elapsed and, for TENURED holders, no plan is APPROVED or IN_EFFECT; moves the fte into separated_fte_total"
      - "Recomputes §1.3 staffing_reduction_waterfall and increments both FacultyAppointment.version and AcademicProgram.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  # ---- authentication and authorization -------------------------------------
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role or X-User-ID absent, empty, or whitespace-only."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the six roles in §1.7."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The authenticated role is not listed on the target endpoint, or is listed but does not own the requested action under §1.7's action-scoped grants (for example a Provost requesting EFFECTUATE, or a ProgramChair requesting APPROVE, on an endpoint both roles may otherwise call)."
  - id: ERR_NOT_PROGRAM_OWNER
    http: 403
    condition: "A ProgramChair acts on a resource that does not resolve to the AcademicProgram whose id equals X-User-ID."
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "An ExternalReviewer files or reads a report on a visit whose reviewer_id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The provost ratifying a decision is the same user id that proposed it."

  # ---- existence ------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No AcademicProgram for the given path id, receiving_program_id, or program_id filter target."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No ReviewCycle for the given path id or cycle_id."
  - id: ERR_SELF_STUDY_NOT_FOUND
    http: 404
    condition: "No SelfStudy for the given path id."
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "No ExternalReviewer for the given reviewer_id."
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "No ReviewerVisit for the given path id."
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "No DecisionRecord for the given path id or decision_id."
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "No AgencyNotification for the given path id."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No TeachOutPlan for the given path id."
  - id: ERR_GUARANTEE_NOT_FOUND
    http: 404
    condition: "No CourseGuarantee for the given path id."
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "No DisplacedStudent for the given path id or displaced_student_id."
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No FacultyAppointment for the given path id."

  # ---- payload shape --------------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, wrong type, unknown enum value, negative count or cent amount, fte outside (0, 1], window_end_at not strictly after window_start_at, term_index below 1, market_demand_index outside 0..100, advised_credits_per_term above max_credits_per_term, or a blank transmitted_reference on SEND."

  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version on teach-out-plan creation does not equal the AcademicProgram's current version."
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version on decision-record creation does not equal the ReviewCycle's current version."

  # ---- state preconditions --------------------------------------------------
  - id: ERR_PROGRAM_ALREADY_TERMINAL
    http: 409
    condition: "A write targets a program whose lifecycle_state is DISCONTINUED or CONSOLIDATED, or a descendant of such a program."
  - id: ERR_CATALOG_TRANSITION_INVALID
    http: 409
    condition: "The requested catalog_status is not a declared edge from the current catalog_status, or CATALOG_WITHDRAWN was requested while lifecycle_state is not terminal."
  - id: ERR_SELF_STUDY_NOT_DRAFT
    http: 409
    condition: "A self-study edit or SUBMIT was attempted from SUBMITTED or ACCEPTED, or RETURN/ACCEPT was attempted from a state other than SUBMITTED."
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "The review cycle is not in a state from which the requested cycle-level operation is declared — for example filing a program response outside REPORT_RECEIVED, or proposing a decision outside RESPONSE_SUBMITTED."
  - id: ERR_VISIT_NOT_SCHEDULED
    http: 409
    condition: "A visit completion was attempted from COMPLETED or REPORTED, or a first report was attempted from SCHEDULED."
  - id: ERR_DECISION_STATE_INVALID
    http: 409
    condition: "The requested decision action is not declared from the decision's current state or improvement_state — for example EFFECTUATE from PROPOSED, RATIFY from RATIFIED, or EVALUATE_IMPROVEMENT while improvement_state is NOT_APPLICABLE, MET or UNMET."
  - id: ERR_NOTIFICATION_STATE_INVALID
    http: 409
    condition: "SEND was attempted from SENT, ACKNOWLEDGED or VOIDED, or ACKNOWLEDGE was attempted from a status other than SENT."
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "The requested plan action is not declared from the plan's current state, or a course guarantee or displaced student was added to a plan in COMPLETED or SUPERSEDED."
  - id: ERR_GUARANTEE_STATE_INVALID
    http: 409
    condition: "A seat COMMIT or RELEASE was attempted on a WAIVED guarantee, or SUBSTITUTE was attempted on a guarantee already SUBSTITUTED or WAIVED."
  - id: ERR_STUDENT_STATE_INVALID
    http: 409
    condition: "An advising or progress write was attempted on a student already COMPLETED or WITHDRAWN."
  - id: ERR_APPOINTMENT_STATE_INVALID
    http: 409
    condition: "The requested appointment action is not declared from the appointment's current state — for example CONFIRM_REASSIGNMENT from ASSIGNED, SEPARATE from ASSIGNED, or any action on a REASSIGNED or SEPARATED row."

  # ---- uniqueness and loop bounds ------------------------------------------
  - id: ERR_DUPLICATE_PROGRAM_CODE
    http: 409
    condition: "Another AcademicProgram already carries the submitted code."
  - id: ERR_DUPLICATE_TERM_SNAPSHOT
    http: 409
    condition: "The program already has a ViabilityMetricSnapshot for the submitted term_index."
  - id: ERR_SELF_STUDY_ALREADY_EXISTS
    http: 409
    condition: "The review cycle already has a self-study."
  - id: ERR_OPEN_CYCLE_EXISTS
    http: 409
    condition: "The program already has a ReviewCycle that is not CLOSED."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A self-study RETURN was attempted at revision_round 2, or a teach-out plan RETURN at plan_revision_round 3."
  - id: ERR_ADDENDUM_LIMIT_REACHED
    http: 409
    condition: "A DISPUTE response was filed while ReviewCycle.addendum_round is already 2."

  # ---- self-study and review workflow --------------------------------------
  - id: ERR_SELF_STUDY_WINDOW_CLOSED
    http: 409
    condition: "The logical clock is strictly after ReviewCycle.self_study_due_at when the self-study is submitted."
  - id: ERR_SELF_STUDY_SECTIONS_INCOMPLETE
    http: 422
    condition: "The self-study's section_codes do not cover every required_section_code on the cycle."
  - id: ERR_REVIEWER_CONFLICT_OF_INTEREST
    http: 409
    condition: "The reviewer's conflict_program_codes contains the reviewed program's code."
  - id: ERR_REVIEWER_WINDOW_CONFLICT
    http: 409
    condition: "The requested visit window overlaps another SCHEDULED or COMPLETED visit of the same reviewer after travel_buffer_hours is applied on both sides of the existing window."
  - id: ERR_PROGRAM_HOST_CAPACITY_EXCEEDED
    http: 409
    condition: "An inclusive UTC calendar day in the requested span would carry more non-REPORTED visits than the program's host_capacity_per_day."
  - id: ERR_VISIT_WINDOW_NOT_ELAPSED
    http: 409
    condition: "A visit completion was attempted before the logical clock reached window_end_at."
  - id: ERR_REPORT_ALREADY_FILED
    http: 409
    condition: "A second report was filed while the cycle is not in ADDENDUM_REQUESTED."
  - id: ERR_UNKNOWN_FINDING_CODE
    http: 422
    condition: "A disputed_finding_code does not appear in any ReviewerReport filed against the cycle."

  # ---- decision, notification, consolidation --------------------------------
  - id: ERR_OUTCOME_NOT_SUPPORTED_BY_VIABILITY
    http: 422
    condition: "The proposed outcome is not permitted for the program's current viability_band (including any proposal while the band is INSUFFICIENT_DATA, and CONSOLIDATION or DISCONTINUATION above the NONVIABLE band without discontinuation_override)."
  - id: ERR_RECEIVING_PROGRAM_REQUIRED
    http: 422
    condition: "receiving_program_id was omitted for a CONSOLIDATION outcome, or supplied for any other outcome."
  - id: ERR_RECEIVING_PROGRAM_INELIGIBLE
    http: 422
    condition: "The receiving program is the reviewed program itself, is not ACTIVE, or is not CONTINUE_ELIGIBLE — checked at proposal and re-checked at effectuation."
  - id: ERR_AGENCY_NOTICE_NOT_ACKNOWLEDGED
    http: 409
    condition: "A decision was effectuated while any non-VOIDED AgencyNotification is still PENDING, SENT or OVERDUE."
  - id: ERR_TEACH_OUT_REQUIRED
    http: 409
    condition: "A DISCONTINUATION decision was effectuated without an APPROVED TeachOutPlan linked to it."
  - id: ERR_SEVERANCE_CAP_EXCEEDED
    http: 409
    condition: "A CONSOLIDATION or DISCONTINUATION decision was effectuated while AcademicProgram.deferred_fte is above 0.00 — the severance budget cap stopped the reduction waterfall before the full reducible FTE was funded."
  - id: ERR_TEACH_OUT_IN_EFFECT
    http: 409
    condition: "A new TeachOutPlan was posted while the program already holds a plan in state APPROVED, IN_EFFECT or COMPLETED — only DRAFT and SUBMITTED plans may be superseded."

  # ---- teach-out, seats, advising ------------------------------------------
  - id: ERR_TEACH_OUT_HORIZON_INSUFFICIENT
    http: 422
    condition: "Plan term indices are not ordered last_admit < first_teach_out <= final_award, or final_award_term_index is earlier than the decision's effective_term_index."
  - id: ERR_COURSE_GUARANTEE_SHORTFALL
    http: 409
    condition: "A plan APPROVE was attempted while seat_shortfall is above 0."
  - id: ERR_AT_RISK_STUDENTS_PRESENT
    http: 409
    condition: "A plan APPROVE was attempted while at_risk_student_count is above 0."
  - id: ERR_DECISION_NOT_EFFECTUATED
    http: 409
    condition: "A plan ACTIVATE was attempted while the linked decision is not EFFECTUATED."
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "A seat COMMIT would push CourseGuarantee.seats_committed above seats_guaranteed."
  - id: ERR_SEAT_NOT_COMMITTED
    http: 409
    condition: "A seat RELEASE names more seats than the student currently holds on that guarantee."
  - id: ERR_GUARANTEE_HAS_COMMITMENTS
    http: 409
    condition: "A WAIVE was attempted on a guarantee whose seats_committed is above 0."
  - id: ERR_ADVISING_REQUIRED
    http: 409
    condition: "A student COMPLETE was attempted from advising_status PENDING or ADVISED."

  # ---- faculty and staffing -------------------------------------------------
  - id: ERR_REDUCTION_SEQUENCE_VIOLATION
    http: 409
    condition: "ISSUE_NOTICE targeted an appointment whose reduction_sequence_position is null or is not the minimum among the program's ASSIGNED appointments."
  - id: ERR_TENURE_NOTICE_TOO_SHORT
    http: 422
    condition: "notice_days is below the statutory minimum for the appointment's tenure_status."
  - id: ERR_TENURE_OBLIGATION_ACTIVE
    http: 409
    condition: "A TENURED appointment was separated while a TeachOutPlan on its program is APPROVED or IN_EFFECT."
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "A separation was attempted before the logical clock reached notice_issued_at plus notice_days days."
  - id: ERR_REASSIGNMENT_TARGET_INVALID
    http: 422
    condition: "RETAIN was requested with no APPROVED or IN_EFFECT plan on the program, or PROPOSE_REASSIGNMENT named the program's own department_code."

