          trigger:
            - call: "POST /denied-entry-incidents/${inc_id}/remediate"
              payload: { resolution_note: "Reader firmware fault confirmed; goodwill credit issued" }
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { credit: $.data.remediation_credit_cents, inc_status_final: $.data.status }
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
