  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_deadline_submit
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_APPLICATION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair state(5) vs business_temporal(9): one submit request
          that violates BOTH (application already WITHDRAWN; clock past the
          window close) MUST return ERR_INVALID_STATE_TRANSITION — the state
          error outranks the deadline error.
        test_recipe:
          setup:
            - "GA-variant program with window closing 2027-01-15T12:00:00Z, OPEN; application submitted at the default clock then WITHDRAWN"
            - "Logical clock set to 2027-02-01T00:00:00Z (past the deadline)"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-01-15T12:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/withdraw", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: FilmOfficeAdmin }
          trigger:
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409) — NOT ERR_APPLICATION_DEADLINE_PASSED, although the deadline is also violated"
            - "Application.${app_id}.status == WITHDRAWN still (no mutation on dual-failure)"

      - name: safety_beats_fiscal_on_issue_credit
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_AUDIT_NOT_ACCEPTED]
          - errors[ERR_PROGRAM_CAP_EXHAUSTED]
        distinguishing_aspect: |
          Category pair business_safety(8) vs business_fiscal(12): one
          issue-credit request that violates BOTH (audit package only
          ATTESTED, not ACCEPTED; final credit 37500000 would exceed the
          program's 30000000 remaining cap) MUST return
          ERR_AUDIT_NOT_ACCEPTED — the compliance gate outranks the money
          gate. Distinct category pair from state_beats_temporal_on_deadline_submit.
        test_recipe:
          setup:
            - "NM program (annual_cap 30000000, elevated threshold 50000000), OPEN; application APPROVED (estimated 150000000)"
            - "Audit package ATTESTED with attested 20000000 / 105000000 (capped 125000000 @ 0.30 -> FINAL credit 37500000 > remaining 30000000); decision NOT yet made"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "NM", program_name: "NM Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 30000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 50000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Desert Rose", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 300000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 150000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_id}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_id: $.data.id } }
            - { call: "POST /api/audit-packages/${pkg_id}/submit-draft", payload: { documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
            - { call: "POST /api/audit-packages/${pkg_id}/attest", payload: { attested_atl_cents: 20000000, attested_btl_cents: 105000000, documentation_complete: true }, as: CPAAuditor, as_user_id: "cpa-1" }
          trigger:
            - { call: "POST /api/applications/${app_id}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUDIT_NOT_ACCEPTED (http 409) — NOT ERR_PROGRAM_CAP_EXHAUSTED, although 37500000 > 30000000 is also violated"
            - "GET /api/certificates?application_id=${app_id} returns an empty array (no certificate materialized)"
            - "Application.${app_id}.status == APPROVED still"

  - rule_id: boundary_precision_check
    instances:
      - name: submit_at_exact_deadline_inclusive
        grounds:
          - state_machines.IncentiveApplication.DRAFT_to_SUBMITTED
          - errors[ERR_APPLICATION_DEADLINE_PASSED]
          - entities.JurisdictionProgram.fields.window_closes_at
        distinguishing_aspect: |
          Metric: timestamp, endpoint: submit. Submission when the logical
          clock reads EXACTLY window_closes_at (2027-01-15T12:00:00Z)
          succeeds (boundary INCLUSIVE, now <= closes); one second later it
          fails with ERR_APPLICATION_DEADLINE_PASSED.
