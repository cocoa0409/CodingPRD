# =============================================================================
# PRD Benchmark Seed Tables — Architecture Construction Administration Phase
# =============================================================================

scenario: |
  Architecture Construction Administration Phase (architecture firm CA team): submittal & shop drawing review with response timeframes, site observation visits & field report issuance, RFI response & clarification drawings, payment application certification, change order review & recommendation to owner, substantial completion determination & punch list, record document review, additional-service billing for extended duration

domain_name: architecture-construction-administration
api_prefix: /ca

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references in request bodies; no nested URL paths
  state_machine_shape: cyclic      # dominant shape: revision/review loops on Submittal, PaymentApplication, PunchListItem, RecordDocument
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # PaymentApplication.previous_application_id chains certified applications
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities, flat topology)
#
# Logical clock: all fields stamped "from the logical clock" read the server
# clock set by POST /ca/_clock/set_current_utc (startup default
# 2026-08-01T00:00:00Z). Dates are ISO calendar dates (YYYY-MM-DD);
# datetimes are ISO 8601 UTC with three fractional digits.
# =============================================================================
entities:
  - name: CaProject
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque X-User-ID of the project Owner; Owner-role writes on this project require X-User-ID == owner_user_id" }
      - { name: contractor_user_id, type: string, source: input, description: "Opaque X-User-ID of the general Contractor; Contractor-role writes on this project require X-User-ID == contractor_user_id" }
      - { name: original_contract_sum_cents, type: integer, source: input, description: "Stipulated contract sum in cents (> 0)" }
      - { name: sov_lines, type: array, source: input, description: "Schedule of values embedded at creation: array of { line_code: string, description: string, scheduled_value_cents: integer > 0 }; line_code values unique within the project; sum of scheduled_value_cents must equal original_contract_sum_cents exactly (ERR_SOV_SUM_MISMATCH)" }
      - { name: base_substantial_completion_date, type: string, source: input, description: "Contractual substantial completion date (YYYY-MM-DD) before any change-order time extensions" }
      - { name: adjusted_substantial_completion_date, type: string, source: computed, description: "= base_substantial_completion_date + sum of time_extension_days over INCORPORATED ChangeOrders (calendar-day addition)" }
      - { name: adjusted_contract_sum_cents, type: integer, source: computed, description: "= original_contract_sum_cents + sum of total_amount_cents over INCORPORATED ChangeOrders" }
      - { name: daily_extension_rate_cents, type: integer, source: input, description: "Per-day additional-service rate for extended duration (> 0)" }
      - { name: monthly_extension_rate_cents, type: integer, source: input, description: "Per-month additional-service rate used by WHOLE_MONTH billing (> 0)" }
      - { name: billing_method, type: enum, source: input, description: "PER_DIEM_PRORATED | WHOLE_MONTH — selects the additional-service billing variant" }
      - { name: retainage_mode, type: enum, source: input, description: "TIERED_MARGINAL | REDUCTION_AT_HALFWAY — selects the retainage variant" }
      - { name: grace_days, type: integer, source: input, default: 0, description: "Days after the adjusted completion date before extension billing begins (>= 0)" }
      - { name: review_window_days_submittal, type: integer, source: input, default: 10, description: "Calendar days the CA team has to review a submittal (>= 1)" }
      - { name: review_window_days_rfi, type: integer, source: input, default: 7, description: "Calendar days the CA team has to answer an RFI (>= 1)" }
      - { name: field_report_window_days, type: integer, source: input, default: 3, description: "Calendar days after a performed visit within which its field report must be issued (>= 1)" }
      - { name: excusable_delay_days, type: integer, source: computed, description: "Sum of credited_delay_days over all non-vacated Submittal reviews plus all RFI answers (see excusable_delay_credit); starts 0" }
      - { name: certified_to_date_cents, type: integer, source: computed, description: "Sum of certified_current_due_cents over PaymentApplications in CERTIFIED status (VOIDED excluded); starts 0" }
      - { name: retainage_held_cents, type: integer, source: computed, description: "R(gross of latest CERTIFIED application) + sum of retainage_stored_cents over CERTIFIED applications; 0 when none (see contract_position)" }
      - { name: substantial_completion_actual_date, type: string, source: system, description: "Calendar date (from the logical clock) when substantial completion was achieved; null until achieved" }
      - { name: ca_posture, type: enum, source: computed, description: "NORMAL | EXTENDED_DURATION — derived by ca_posture_derivation; EXTENDED_DURATION iff status == ACTIVE and clock date > adjusted_substantial_completion_date + excusable_delay_days + grace_days" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | SUBSTANTIAL_COMPLETION_ACHIEVED | FINAL_COMPLETION_ACHIEVED | CLOSED" }

  - name: Submittal
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: spec_section, type: string, source: input, description: "Specification section reference, e.g. '03 30 00'" }
      - { name: required_on_site_date, type: string, source: input, description: "Calendar date the reviewed submittal is needed on site (YYYY-MM-DD)" }
      - { name: revision_number, type: integer, source: system, description: "Starts at 1; increments by 1 on every resubmit" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of the current revision's submission" }
      - { name: due_at, type: datetime, source: computed, description: "= received_at + project.review_window_days_submittal days" }
      - { name: reviewed_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest review outcome; null while UNDER_REVIEW" }
      - { name: credited_delay_days, type: integer, source: computed, description: "Excusable days credited by the latest review (0 for REVISE_AND_RESUBMIT / REJECTED outcomes, 0 while UNDER_REVIEW, reset to 0 by vacate-review)" }
      - { name: review_notes, type: string, source: input, description: "Optional notes supplied on the review call; null until reviewed" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | APPROVED_AS_NOTED | REVISE_AND_RESUBMIT | REJECTED" }

  - name: SiteVisit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; visited project" }
      - { name: visit_date, type: string, source: input, description: "Scheduled calendar date (YYYY-MM-DD); at most one non-CANCELLED visit per project per visit_date" }
      - { name: purpose, type: enum, source: input, description: "PROGRESS_OBSERVATION | PAYMENT_VERIFICATION | PUNCH_INSPECTION | FINAL_INSPECTION" }
      - { name: performed_by_user_id, type: string, source: input, description: "Opaque X-User-ID of the CA staff member performing the visit (used by segregation-of-duties checks)" }
      - { name: performed_at, type: datetime, source: system, description: "Logical-clock timestamp when the visit was performed; null while SCHEDULED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PERFORMED | REPORT_ISSUED | CANCELLED" }

  - name: FieldReport
    parent: null
    common_fields: true
    fields:
      - { name: site_visit_id, type: string, source: input, description: "FK -> SiteVisit.id; the visit this report documents (1:1 — at most one FieldReport per visit)" }
      - { name: issued_by_user_id, type: string, source: input, description: "Opaque X-User-ID of the issuing CA staff member; must differ from the visit's performed_by_user_id (segregation of duties)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: conformance_summary, type: enum, source: input, description: "CONFORMING | MINOR_DEVIATIONS | NONCONFORMING" }
      - { name: nonconforming_work_flag, type: boolean, source: input, default: false, description: "True when the report observes nonconforming work relevant to payment certification" }
      - { name: nonconformance_status, type: enum, source: computed, description: "NONE when nonconforming_work_flag is false; OPEN when flagged; OPEN -> CLEARED via clear-nonconformance" }
      - { name: clearing_visit_id, type: string, source: system, description: "FK -> SiteVisit.id; the follow-up visit that cleared the nonconformance; null unless CLEARED" }
      - { name: notes, type: string, source: input, description: "Optional free-text observations" }

  - name: Rfi
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: question, type: string, source: input, description: "Contractor's question text" }
      - { name: cost_impact_flag, type: boolean, source: input, default: false, description: "True when the contractor anticipates the answer has cost impact (gates change-order reference)" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: due_at, type: datetime, source: computed, description: "= received_at + project.review_window_days_rfi days" }
      - { name: answered_at, type: datetime, source: system, description: "Logical-clock timestamp when the RFI entered ANSWERED (by direct answer or first clarification drawing); null until then" }
      - { name: answer_text, type: string, source: input, description: "Answer text supplied on the answer call; null until answered directly" }
      - { name: credited_delay_days, type: integer, source: computed, description: "Excusable days credited when the RFI entered ANSWERED after due_at (0 when on time)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLARIFICATION_PENDING | ANSWERED | CLOSED | WITHDRAWN" }

  - name: ClarificationDrawing
    parent: null
    common_fields: true
    fields:
      - { name: rfi_id, type: string, source: input, description: "FK -> Rfi.id; the RFI this drawing clarifies" }
      - { name: drawing_ref, type: string, source: input, description: "Drawing/sketch reference, e.g. 'SK-12'" }
      - { name: revision_number, type: integer, source: system, description: "Starts at 1 for the RFI's first drawing; each new drawing for the same RFI takes prior max + 1 and supersedes the previously ISSUED drawing" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUPERSEDED" }

  - name: PaymentApplication
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: period_ending_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD) closing this billing period; must be strictly later than period_ending_date of every SUBMITTED or CERTIFIED application on the same project" }
      - { name: verification_visit_id, type: string, source: input, description: "FK -> SiteVisit.id; a PAYMENT_VERIFICATION visit in REPORT_ISSUED whose visit_date falls inside this application's period window" }
      - { name: previous_application_id, type: string, source: computed, description: "FK -> PaymentApplication.id; self-referential chain link — the CERTIFIED application on the same project with the greatest period_ending_date strictly before this application's (tie-break created_at ASC); null for the first" }
      - { name: revision_number, type: integer, source: system, description: "Starts at 1; increments by 1 on every resubmit after rejection" }
      - { name: lines, type: array, source: input, description: "Non-empty array of { sov_line_code: string, work_completed_this_period_cents: integer >= 0, stored_materials_cents: integer >= 0 }; sov_line_code must exist in the project sov_lines and appear at most once per application" }
      - { name: gross_work_completed_cents, type: integer, source: computed, description: "Chain cumulative gross work through this application; provisional at creation, finalized at certification" }
      - { name: earned_work_this_period_cents, type: integer, source: computed, description: "Sum of work_completed_this_period_cents over lines" }
      - { name: retainage_work_cents, type: integer, source: computed, description: "Retainage delta on work at certification: R(gross_now) - R(gross_prev); negative when retainage is released (REDUCTION_AT_HALFWAY crossing)" }
      - { name: retainage_stored_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(stored_materials_cents x 0.10) — per-line rounding pinned by payment_certification" }
      - { name: provisional_current_due_cents, type: integer, source: computed, description: "Current-due computed at creation/resubmission from then-current project data" }
      - { name: certified_current_due_cents, type: integer, source: computed, description: "Current-due recomputed at certification time; null until CERTIFIED" }
      - { name: rejection_reason, type: string, source: input, description: "Reason supplied on reject; null unless rejected" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of certification; null until CERTIFIED" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying CA staff member; null until CERTIFIED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CERTIFIED | REJECTED | VOIDED" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: rfi_id, type: string, source: input, description: "FK -> Rfi.id; optional originating RFI — when supplied the RFI must have cost_impact_flag true and status ANSWERED or CLOSED; null allowed" }
      - { name: title, type: string, source: input, description: "Change order title" }
      - { name: net_cost_change_cents, type: integer, source: input, description: "Signed net cost change in cents (negative = deduct change; zero = time-only change)" }
      - { name: time_extension_days, type: integer, source: input, default: 0, description: "Calendar days added to the completion date on incorporation (>= 0)" }
      - { name: markup_cents, type: integer, source: computed, description: "Overhead-and-profit markup per change_order_pricing (marginal tiers; 0 for deducts)" }
      - { name: total_amount_cents, type: integer, source: computed, description: "= net_cost_change_cents + markup_cents" }
      - { name: recommendation, type: enum, source: system, description: "ACCEPT | REJECT recorded by the CA reviewer; null until recommended" }
      - { name: recommended_by_user_id, type: string, source: system, description: "X-User-ID of the recommending CA staff member; null until recommended" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | RECOMMEND_ACCEPTANCE | RECOMMEND_REJECTION | OWNER_ACCEPTED | OWNER_REJECTED | INCORPORATED" }

  - name: PunchListItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: raised_visit_id, type: string, source: input, description: "FK -> SiteVisit.id; the PUNCH_INSPECTION visit in REPORT_ISSUED status during which the item was raised" }
      - { name: description, type: string, source: input, description: "Deficiency description" }
      - { name: location, type: string, source: input, description: "Where in the work the deficiency sits" }
      - { name: reopen_count, type: integer, source: system, description: "Number of times the item has been reopened; starts 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLAIMED_COMPLETE | VERIFIED | REOPENED" }

  - name: RecordDocument
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: doc_type, type: enum, source: input, description: "AS_BUILT | OM_MANUAL | WARRANTY | TEST_REPORT" }
      - { name: revision_number, type: integer, source: system, description: "Starts at 1; increments by 1 on every resubmit after RETURNED_FOR_CORRECTION" }
      - { name: review_notes, type: string, source: input, description: "Optional notes supplied on review; null until reviewed" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | RETURNED_FOR_CORRECTION" }

  - name: AdditionalServiceInvoice
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CaProject.id; owning project" }
      - { name: period_start, type: string, source: input, description: "Invoice period start calendar date (YYYY-MM-DD); must be strictly before period_end" }
      - { name: period_end, type: string, source: input, description: "Invoice period end calendar date (YYYY-MM-DD); the closed interval [period_start, period_end] must not overlap any other non-CANCELLED invoice period on the project (adjacency allowed)" }
      - { name: horizon_start_date, type: string, source: computed, description: "= adjusted_substantial_completion_date + excusable_delay_days + grace_days evaluated at computation time" }
      - { name: horizon_end_date, type: string, source: computed, description: "= substantial_completion_actual_date when already achieved at computation time, else the logical-clock date at invoice creation; recomputed only by the DRAFT recompute rules" }
      - { name: billable_days, type: integer, source: computed, description: "Count of calendar dates d in [period_start, period_end] with horizon_start_date < d <= horizon_end_date" }
      - { name: amount_cents, type: integer, source: computed, description: "additional_service_billing: PER_DIEM_PRORATED -> billable_days x daily_extension_rate_cents; WHOLE_MONTH -> ceil(billable_days / 30) x monthly_extension_rate_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | OWNER_APPROVED | DISPUTED | PAID | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CaProject
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /ca/projects/{id}/activate"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "recompute ca_posture (ca_posture_derivation)"

      - from: ACTIVE
        to: SUBSTANTIAL_COMPLETION_ACHIEVED
        trigger: "POST /ca/projects/{id}/achieve-substantial-completion"
        actor: ArchitectCA
        preconditions:
          - "At least one SiteVisit on the project has purpose PUNCH_INSPECTION and status REPORT_ISSUED (ERR_PUNCH_INSPECTION_REQUIRED)"
        side_effects:
          - "substantial_completion_actual_date := logical-clock date"
          - "recompute ca_posture (ca_posture_derivation)"
          - "Recompute every DRAFT AdditionalServiceInvoice with horizon_end_date := substantial_completion_actual_date; an invoice whose billable_days becomes 0 auto-transitions to CANCELLED (additional_service_billing)"

      - from: SUBSTANTIAL_COMPLETION_ACHIEVED
        to: FINAL_COMPLETION_ACHIEVED
        trigger: "POST /ca/projects/{id}/achieve-final-completion"
        actor: ArchitectCA
        preconditions:
          - "No PunchListItem on the project is in OPEN, CLAIMED_COMPLETE, or REOPENED (ERR_OPEN_PUNCH_ITEMS_REMAIN)"
          - "Each of the four doc_type values (AS_BUILT, OM_MANUAL, WARRANTY, TEST_REPORT) has at least one ACCEPTED RecordDocument on the project (ERR_RECORD_DOCUMENTS_INCOMPLETE)"
        side_effects: []

      - from: FINAL_COMPLETION_ACHIEVED
        to: CLOSED
        trigger: "POST /ca/projects/{id}/close"
        actor: FirmAdmin
        preconditions:
          - "No PaymentApplication on the project is in SUBMITTED or REJECTED (ERR_OPEN_PAYMENT_APPLICATIONS)"
          - "No AdditionalServiceInvoice on the project is in DRAFT, ISSUED, OWNER_APPROVED, or DISPUTED (ERR_OPEN_INVOICES)"
        side_effects: []

  - entity: Submittal
    initial_state: UNDER_REVIEW
    terminal_states: [REJECTED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /ca/submittals/{id}/review with outcome=APPROVED"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "reviewed_at := logical clock; late credit per excusable_delay_credit: credited_delay_days := max(0, date(reviewed_at) - date(due_at))"
          - "Recompute CaProject.excusable_delay_days and ca_posture (excusable_delay_credit, ca_posture_derivation)"
          - "Recompute every DRAFT AdditionalServiceInvoice on the project (horizon_start_date, billable_days, amount_cents); an invoice whose billable_days becomes 0 auto-transitions to CANCELLED (additional_service_billing)"

      - from: UNDER_REVIEW
        to: APPROVED_AS_NOTED
        trigger: "POST /ca/submittals/{id}/review with outcome=APPROVED_AS_NOTED"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "Same side-effect chain as UNDER_REVIEW -> APPROVED (late credit, project recompute, DRAFT invoice recompute/auto-cancel)"

      - from: UNDER_REVIEW
        to: REVISE_AND_RESUBMIT
        trigger: "POST /ca/submittals/{id}/review with outcome=REVISE_AND_RESUBMIT"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "reviewed_at := logical clock; credited_delay_days := 0 (contractor-caused rework earns no excusable credit)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /ca/submittals/{id}/review with outcome=REJECTED"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "reviewed_at := logical clock; credited_delay_days := 0"

      - from: REVISE_AND_RESUBMIT
        to: UNDER_REVIEW
        trigger: "POST /ca/submittals/{id}/resubmit"
        actor: Contractor
        preconditions: []
        side_effects:
          - "revision_number += 1; received_at := logical clock; due_at recomputed from the new received_at; reviewed_at := null; credited_delay_days := 0"

      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /ca/submittals/{id}/vacate-review"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "CaProject.excusable_delay_days -= credited_delay_days; credited_delay_days := 0; reviewed_at := null; received_at := logical clock; due_at recomputed"
          - "Recompute ca_posture and every DRAFT AdditionalServiceInvoice on the project (auto-CANCELLED at 0 billable days)"

      - from: APPROVED_AS_NOTED
        to: UNDER_REVIEW
        trigger: "POST /ca/submittals/{id}/vacate-review"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "Same side-effect chain as APPROVED -> UNDER_REVIEW"

  - entity: SiteVisit
    initial_state: SCHEDULED
    terminal_states: [REPORT_ISSUED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /ca/site-visits/{id}/perform"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "performed_at := logical clock"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ca/site-visits/{id}/cancel"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "Releases the (project_id, visit_date) occupation for the visit date-conflict check"

      - from: PERFORMED
        to: REPORT_ISSUED
        trigger: "system (automatic on FieldReport creation for this visit)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FieldReport
    initial_state: ISSUED
    terminal_states: []
    note: "Single-state entity with a derived nonconformance sub-lifecycle: nonconformance_status OPEN -> CLEARED. CLEARED is effectively terminal for the sub-lifecycle."
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /ca/field-reports/{id}/clear-nonconformance"
        actor: ArchitectCA
        preconditions:
          - "nonconformance_status == OPEN (ERR_FIELD_REPORT_INVALID_STATE otherwise)"
          - "clearing_visit_id references a SiteVisit on the same project, status REPORT_ISSUED, whose FieldReport has nonconforming_work_flag false, and whose performed_at is at or after the flagged visit's performed_at (ERR_NONCONFORMANCE_CLEARANCE_VISIT_INVALID)"
        side_effects:
          - "clearing_visit_id := input value"

  - entity: Rfi
    initial_state: OPEN
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ANSWERED
        trigger: "POST /ca/rfis/{id}/answer with requires_clarification_drawing=false"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "answered_at := logical clock; late credit per excusable_delay_credit: credited_delay_days := max(0, date(answered_at) - date(due_at))"
          - "Recompute CaProject.excusable_delay_days, ca_posture, and DRAFT AdditionalServiceInvoices (auto-CANCELLED at 0 billable days)"

      - from: OPEN
        to: CLARIFICATION_PENDING
        trigger: "POST /ca/rfis/{id}/answer with requires_clarification_drawing=true"
        actor: ArchitectCA
        preconditions: []
        side_effects: []

      - from: CLARIFICATION_PENDING
        to: ANSWERED
        trigger: "system (automatic on first ClarificationDrawing creation for this RFI)"
        actor: system
        preconditions: []
        side_effects:
          - "answered_at := logical clock of the drawing creation; late credit per excusable_delay_credit"
          - "Recompute CaProject.excusable_delay_days, ca_posture, and DRAFT AdditionalServiceInvoices (auto-CANCELLED at 0 billable days)"

      - from: ANSWERED
        to: CLOSED
        trigger: "POST /ca/rfis/{id}/close"
        actor: Contractor
        preconditions: []
        side_effects: []

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /ca/rfis/{id}/withdraw"
        actor: Contractor
        preconditions: []
        side_effects: []

  - entity: ClarificationDrawing
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (automatic when a newer ClarificationDrawing is created for the same RFI)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PaymentApplication
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /ca/payment-applications/{id}/certify"
        actor: ArchitectCA
        preconditions:
          - "Segregation of duties: X-User-ID of the certifier must differ from the verification visit's performed_by_user_id (ERR_SOD_CERTIFIER_IS_VERIFIER)"
          - "If the verification visit's FieldReport has nonconforming_work_flag true, its nonconformance_status must be CLEARED (ERR_NONCONFORMANCE_NOT_CLEARED)"
          - "Fiscal: recomputed gross_work_completed_cents must be <= CaProject.adjusted_contract_sum_cents (ERR_CERTIFICATION_EXCEEDS_CONTRACT_BALANCE)"
        side_effects:
          - "Recompute final numbers per payment_certification (final variant): gross_work_completed_cents, retainage_work_cents, retainage_stored_cents, certified_current_due_cents"
          - "certified_at := logical clock; certified_by_user_id := X-User-ID"
          - "Recompute CaProject.certified_to_date_cents and retainage_held_cents (contract_position)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ca/payment-applications/{id}/reject"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "rejection_reason := input reason"
          - "The application's period_ending_date is released: it no longer blocks the period-ordering rule"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /ca/payment-applications/{id}/resubmit"
        actor: Contractor
        preconditions:
          - "Replacement period_ending_date, verification_visit_id, and lines are re-validated exactly as on creation (period ordering, verification-visit validity, SOV line codes, per-line overrun)"
        side_effects:
          - "revision_number += 1; rejection_reason := null"
          - "Recompute provisional fields per payment_certification (provisional variant)"

      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /ca/payment-applications/{id}/void"
        actor: FirmAdmin
        preconditions:
          - "No other PaymentApplication on the same project is CERTIFIED with a strictly greater period_ending_date (ERR_LATER_CERTIFIED_APPLICATION_EXISTS) — the certified chain is only unwrapped from the tip"
        side_effects:
          - "Recompute CaProject.certified_to_date_cents and retainage_held_cents (contract_position) — the void fully compensates the certification's contribution"
          - "The application's period_ending_date is released: it no longer blocks the period-ordering rule"

  - entity: ChangeOrder
    initial_state: SUBMITTED
    terminal_states: [OWNER_REJECTED, INCORPORATED]
    transitions:
      - from: SUBMITTED
        to: RECOMMEND_ACCEPTANCE
        trigger: "POST /ca/change-orders/{id}/recommend with recommendation=ACCEPT"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "recommendation := ACCEPT; recommended_by_user_id := X-User-ID"

      - from: SUBMITTED
        to: RECOMMEND_REJECTION
        trigger: "POST /ca/change-orders/{id}/recommend with recommendation=REJECT"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "recommendation := REJECT; recommended_by_user_id := X-User-ID"

      - from: RECOMMEND_ACCEPTANCE
        to: OWNER_ACCEPTED
        trigger: "POST /ca/change-orders/{id}/owner-decision with decision=ACCEPT"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: RECOMMEND_REJECTION
        to: OWNER_ACCEPTED
        trigger: "POST /ca/change-orders/{id}/owner-decision with decision=ACCEPT (owner overrides the CA recommendation)"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: RECOMMEND_ACCEPTANCE
        to: OWNER_REJECTED
        trigger: "POST /ca/change-orders/{id}/owner-decision with decision=REJECT"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: RECOMMEND_REJECTION
        to: OWNER_REJECTED
        trigger: "POST /ca/change-orders/{id}/owner-decision with decision=REJECT"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: OWNER_ACCEPTED
        to: INCORPORATED
        trigger: "POST /ca/change-orders/{id}/incorporate"
        actor: Owner
        preconditions:
          - "expected_project_version must equal CaProject.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "CaProject.adjusted_contract_sum_cents += total_amount_cents; CaProject.adjusted_substantial_completion_date += time_extension_days; increments CaProject.version by 1"
          - "Recompute CaProject.ca_posture (ca_posture_derivation)"
          - "Recompute CaProject.retainage_held_cents under the new adjusted contract sum (contract_position)"
          - "Recompute every DRAFT AdditionalServiceInvoice on the project (horizon_start_date, billable_days, amount_cents); an invoice whose billable_days becomes 0 auto-transitions to CANCELLED (additional_service_billing)"

  - entity: PunchListItem
    initial_state: OPEN
    terminal_states: []
    note: "VERIFIED is the success state but remains reopenable while the project is not CLOSED; the machine is intentionally cyclic."
    transitions:
      - from: OPEN
        to: CLAIMED_COMPLETE
        trigger: "POST /ca/punch-list-items/{id}/claim-complete"
        actor: Contractor
        preconditions: []
        side_effects: []

      - from: REOPENED
        to: CLAIMED_COMPLETE
        trigger: "POST /ca/punch-list-items/{id}/claim-complete"
        actor: Contractor
        preconditions: []
        side_effects: []

      - from: CLAIMED_COMPLETE
        to: VERIFIED
        trigger: "POST /ca/punch-list-items/{id}/verify"
        actor: ArchitectCA
        preconditions: []
        side_effects: []

      - from: CLAIMED_COMPLETE
        to: REOPENED
        trigger: "POST /ca/punch-list-items/{id}/reopen"
        actor: ArchitectCA
        preconditions: []
        side_effects:
          - "reopen_count += 1"

      - from: VERIFIED
        to: REOPENED
        trigger: "POST /ca/punch-list-items/{id}/reopen"
        actor: ArchitectCA
        preconditions:
          - "CaProject.status is ACTIVE or SUBSTANTIAL_COMPLETION_ACHIEVED (ERR_PROJECT_NOT_ACTIVE otherwise)"
        side_effects:
          - "reopen_count += 1"

  - entity: RecordDocument
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ca/record-documents/{id}/review with outcome=ACCEPT"
        actor: ArchitectCA
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /ca/record-documents/{id}/review with outcome=RETURN_FOR_CORRECTION"
        actor: ArchitectCA
        preconditions: []
        side_effects: []

      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /ca/record-documents/{id}/resubmit"
        actor: Contractor
        preconditions: []
        side_effects:
          - "revision_number += 1"

  - entity: AdditionalServiceInvoice
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /ca/additional-service-invoices/{id}/issue"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "Amounts freeze on issuance: billable_days, horizon_start_date, horizon_end_date, and amount_cents of an ISSUED (or later) invoice are never recomputed by subsequent project mutations"

      - from: ISSUED
        to: OWNER_APPROVED
        trigger: "POST /ca/additional-service-invoices/{id}/owner-decision with decision=APPROVE"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /ca/additional-service-invoices/{id}/owner-decision with decision=DISPUTE"
        actor: Owner
        preconditions: []
        side_effects: []

      - from: OWNER_APPROVED
        to: PAID
        trigger: "POST /ca/additional-service-invoices/{id}/record-payment"
        actor: FirmAdmin
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ca/additional-service-invoices/{id}/cancel"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "Releases the [period_start, period_end] occupation for the invoice period-overlap check"

      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /ca/additional-service-invoices/{id}/cancel"
        actor: FirmAdmin
        preconditions: []
        side_effects:
          - "Releases the [period_start, period_end] occupation for the invoice period-overlap check"

      - from: DRAFT
        to: CANCELLED
        trigger: "system (automatic when a project recompute leaves the DRAFT invoice with 0 billable days)"
        actor: system
        preconditions: []
        side_effects:
          - "Releases the [period_start, period_end] occupation for the invoice period-overlap check"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: clarification-revision-stale-rfi
    parent_entity: Rfi
    write_endpoint: "POST /ca/clarification-drawings"
    occ_field: "expected_rfi_version"
    description: |
      Creating a ClarificationDrawing against an RFI whose version has advanced
      since the client last observed it is rejected. A new drawing legitimately
      supersedes the previously ISSUED drawing of the same RFI, so a writer
      holding a stale RFI version would base its revision on a superseded chain
      tip; the stale-version check rejects the write with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: incorporate-stale-project
    parent_entity: CaProject
    write_endpoint: "POST /ca/change-orders/{id}/incorporate"
    occ_field: "expected_project_version"
    description: |
      Incorporating an accepted ChangeOrder against a CaProject whose version has
      advanced since the client last observed it is rejected. Incorporation
      applies total_amount_cents and time_extension_days onto the project's
      adjusted contract position, so a writer holding a stale project version
      would apply its change onto a superseded financial baseline; the
      stale-version check rejects the write with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: excusable_delay_credit
    trigger: "Submittal review to APPROVED or APPROVED_AS_NOTED; Submittal vacate-review (reversal); RFI entry into ANSWERED (direct answer or first clarification drawing)"
    algorithm: aggregation
    formula: |
      credit_days(event) = max(0, date(action_timestamp) - date(due_at))   # whole calendar days between the date parts
      Sources:
        - Submittal review landing on APPROVED or APPROVED_AS_NOTED: credit applies;
          stored on Submittal.credited_delay_days.
        - Submittal review landing on REVISE_AND_RESUBMIT or REJECTED: credit is 0
          (contractor-caused rework is excluded from the input set).
        - RFI transition into ANSWERED: credit applies; stored on Rfi.credited_delay_days.
        - vacate-review: the submittal's credited_delay_days is subtracted and reset to 0
          (compensating action).
      CaProject.excusable_delay_days = sum of credited_delay_days over ALL Submittals and
      RFIs of the project. Recomputed (not incrementally drifted) after every source event.
    input_set: "Submittals of the project in any status; RFIs of the project in any status; only the stored credited_delay_days fields contribute"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "whole days, integer"
    note: "Date parts of the timestamps are compared, so a review exactly on the due date credits 0."

  - name: payment_certification
    trigger: "PaymentApplication creation and resubmission (provisional variant); PaymentApplication certification (final variant)"
    algorithm: threshold
    formula: |
      Pinned evaluation order (circular-looking but well-defined by this order):
      1. previous_application = CERTIFIED PaymentApplication on the same project with the
         greatest period_ending_date strictly before this application's period_ending_date;
         tie-break created_at ASC; VOIDED applications are excluded. None -> gross_prev = 0,
         else gross_prev = previous_application.gross_work_completed_cents.
      2. earned_work = sum of lines[].work_completed_this_period_cents.
      3. gross_now = gross_prev + earned_work.
      4. threshold_cents = round_half_up(HALFWAY_PCT x CaProject.adjusted_contract_sum_cents),
         using the adjusted contract sum in effect at THIS computation's run time.
      5. R(g) per CaProject.retainage_mode, using the CURRENT mode and CURRENT threshold for
         BOTH evaluations:
           TIERED_MARGINAL:      R(g) = HIGH_PCT x min(g, threshold_cents) + LOW_PCT x max(0, g - threshold_cents)
           REDUCTION_AT_HALFWAY: R(g) = HIGH_PCT x g   when g <  threshold_cents
                                 R(g) = LOW_PCT  x g   when g >= threshold_cents
      6. retainage_work = R(gross_now) - R(gross_prev)   # may be negative (retainage release)
      7. Per line, in lines array order: stored_retainage_l = round_half_up(stored_materials_cents_l x STORED_PCT).
         retainage_stored = sum of stored_retainage_l. PINNED ROUNDING ORDER: round per line first,
         then sum (summing first then rounding is a different, non-conformant result).
      8. stored_total = sum of lines[].stored_materials_cents.
      9. current_due = earned_work - retainage_work + (stored_total - retainage_stored).
      Output mapping:
        - provisional variant (creation/resubmission): provisional_current_due_cents := current_due,
          plus gross_work_completed_cents, earned_work_this_period_cents, retainage_work_cents,
          retainage_stored_cents snapshots from the same run.
        - final variant (certification): identical formula re-run at certify time;
          certified_current_due_cents := current_due and the four snapshot fields are overwritten.
      Both variants use integer cents throughout; a R() product that lands on a fractional cent
      is round_half_up to the cent before subtraction.
    input_set: "The application's lines; the project's sov_lines, retainage_mode, adjusted_contract_sum_cents; the certified chain per the previous_application selector"
    constants:
      HIGH_PCT: 0.10
      LOW_PCT: 0.05
      HALFWAY_PCT: 0.50
      STORED_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: tiered_marginal
        when: "CaProject.retainage_mode == TIERED_MARGINAL"
        difference: "Retainage is marginal: work above the halfway threshold is retained at LOW_PCT while work at or below stays at HIGH_PCT (no cliff)."
      - name: reduction_at_halfway
        when: "CaProject.retainage_mode == REDUCTION_AT_HALFWAY"
        difference: "Crossing the threshold re-bases retainage on the ENTIRE gross at LOW_PCT, which can make retainage_work negative (a release) on the crossing application."
      - name: provisional_vs_final
        when: "creation/resubmission vs certification"
        difference: "Identical formula at different times; a ChangeOrder incorporation between creation and certification changes adjusted_contract_sum_cents and therefore the threshold, so the two runs legitimately diverge."

  - name: change_order_pricing
    trigger: "ChangeOrder creation"
    algorithm: tiered_pricing
    formula: |
      net = net_cost_change_cents
      if net > 0:
        markup_cents = round_half_up(TIER1_PCT x min(net, TIER1_CAP_CENTS))
                     + round_half_up(TIER2_PCT x min(max(net - TIER1_CAP_CENTS, 0), TIER2_CAP_CENTS))
                     + round_half_up(TIER3_PCT x max(net - TIER1_CAP_CENTS - TIER2_CAP_CENTS, 0))
      else:
        markup_cents = 0     # deduct and zero-cost changes earn no overhead-and-profit markup
      total_amount_cents = net + markup_cents
    input_set: "The ChangeOrder's net_cost_change_cents"
    constants:
      TIER1_CAP_CENTS: 5000000
      TIER2_CAP_CENTS: 5000000
      TIER1_PCT: 0.10
      TIER2_PCT: 0.07
      TIER3_PCT: 0.04
    precision: "integer cents, round_half_up per tier before summing"

  - name: additional_service_billing
    trigger: "AdditionalServiceInvoice creation; project mutations that change excusable_delay_days or adjusted_substantial_completion_date; achieve-substantial-completion (DRAFT recompute)"
    algorithm: threshold
    formula: |
      horizon_start_date = CaProject.adjusted_substantial_completion_date
                         + CaProject.excusable_delay_days + CaProject.grace_days   (calendar-day addition)
      horizon_end_date   = CaProject.substantial_completion_actual_date when already achieved
                           at computation time, else the logical-clock date at invoice creation.
      billable_days = count of calendar dates d such that
                      period_start <= d <= period_end  AND  horizon_start_date < d <= horizon_end_date
      amount_cents per CaProject.billing_method:
        PER_DIEM_PRORATED: billable_days x CaProject.daily_extension_rate_cents
        WHOLE_MONTH:       ceil(billable_days / MONTH_DAYS) x CaProject.monthly_extension_rate_cents
      Creation requires billable_days > 0 (ERR_NO_BILLABLE_EXTENSION otherwise).
      DRAFT recompute rule: on any change to excusable_delay_days or
      adjusted_substantial_completion_date, and on achieve-substantial-completion (which fixes
      horizon_end_date to substantial_completion_actual_date), every DRAFT invoice of the project
      recomputes horizon_start_date, horizon_end_date (per the rule above), billable_days and
      amount_cents; a DRAFT invoice whose billable_days becomes 0 auto-transitions to CANCELLED.
      ISSUED and later invoices are never recomputed (frozen at issuance).
    input_set: "The invoice's period; the project's adjusted_substantial_completion_date, excusable_delay_days, grace_days, substantial_completion_actual_date, billing rates and billing_method"
    constants:
      MONTH_DAYS: 30
    precision: "integer cents; billable_days integer"
    variants:
      - name: per_diem_prorated
        when: "CaProject.billing_method == PER_DIEM_PRORATED"
        difference: "Bills exact billable days at the daily rate."
      - name: whole_month
        when: "CaProject.billing_method == WHOLE_MONTH"
        difference: "Bills each started 30-day month as a whole month (ceil), so identical billable_days yield a different amount."

  - name: contract_position
    trigger: "PaymentApplication certification and voiding; ChangeOrder incorporation"
    algorithm: aggregation
    formula: |
      CaProject.certified_to_date_cents = sum of certified_current_due_cents over
        PaymentApplications of the project in CERTIFIED status (VOIDED excluded).
      CaProject.retainage_held_cents = R(gross of the latest CERTIFIED application by
        period_ending_date, computed under the CURRENT retainage_mode and CURRENT
        adjusted contract sum per payment_certification step 5)
        + sum of retainage_stored_cents over CERTIFIED applications; 0 when no CERTIFIED
        application exists.
      Recomputed in full after every trigger — never incrementally adjusted.
    input_set: "PaymentApplications of the project in CERTIFIED status; project retainage configuration"
    precision: "integer cents"

  - name: ca_posture_derivation
    trigger: "Logical-clock set; project activation; any excusable_delay_days change; ChangeOrder incorporation; achieve-substantial-completion"
    algorithm: threshold
    formula: |
      ca_posture = EXTENDED_DURATION
        iff CaProject.status == ACTIVE
        AND logical-clock date > CaProject.adjusted_substantial_completion_date
                              + CaProject.excusable_delay_days + CaProject.grace_days
      else NORMAL.
      The comparison is strictly greater-than on calendar dates: when the clock date equals
      the adjusted date plus delay plus grace, the posture is NORMAL.
    input_set: "The project's status, adjusted completion date, excusable delay, grace days; the logical clock"
    precision: "calendar dates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty, and X-User-Role must be one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be listed in the endpoint's roles (RBAC denial)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types correct, enum values in range, period_start strictly before period_end, lines non-empty with unique sov_line_code values, non-negative amounts where declared"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST endpoints

  - priority: 4
    category: existence
    check: "Resource ids resolve: path ids validated left-to-right, then body foreign-key ids (project_id, site_visit_id, rfi_id, verification_visit_id, raised_visit_id, clearing_visit_id) in input order — return on first miss"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per resource: ERR_PROJECT_NOT_FOUND, ERR_SUBMITTAL_NOT_FOUND, ERR_SITE_VISIT_NOT_FOUND, ERR_FIELD_REPORT_NOT_FOUND, ERR_RFI_NOT_FOUND, ERR_CLARIFICATION_DRAWING_NOT_FOUND, ERR_PAYMENT_APPLICATION_NOT_FOUND, ERR_CHANGE_ORDER_NOT_FOUND, ERR_PUNCH_ITEM_NOT_FOUND, ERR_RECORD_DOCUMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 5
    category: existence
    check: "OCC precondition: expected_rfi_version / expected_project_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ca/clarification-drawings, POST /ca/change-orders/{id}/incorporate"

  - priority: 6
    category: auth
    check: "Counterparty ownership: on Contractor-role writes X-User-ID must equal the project's contractor_user_id; on Owner-role writes X-User-ID must equal the project's owner_user_id"
    error_id: ERR_NOT_PROJECT_COUNTERPARTY
    http_status: 403
    applies_to: "All Contractor-role and Owner-role write endpoints on project-scoped resources"

  - priority: 7
    category: state
    check: "Project lifecycle gate: child creation (submittals, site-visits, rfis, payment-applications, change-orders, punch-list-items) requires CaProject ACTIVE; record-documents and additional-service-invoices also allow SUBSTANTIAL_COMPLETION_ACHIEVED; achieve-substantial-completion requires ACTIVE; VERIFIED punch-item reopen requires ACTIVE or SUBSTANTIAL_COMPLETION_ACHIEVED"
    error_id: ERR_PROJECT_NOT_ACTIVE
    http_status: 409
    applies_to: "All child-creation endpoints; POST /ca/projects/{id}/achieve-substantial-completion; POST /ca/punch-list-items/{id}/reopen from VERIFIED"

  - priority: 8
    category: state
    check: "Project stage gates: achieve-final-completion requires SUBSTANTIAL_COMPLETION_ACHIEVED (ERR_PROJECT_NOT_SUBSTANTIAL); close requires FINAL_COMPLETION_ACHIEVED (ERR_PROJECT_NOT_FINAL)"
    error_id: "ERR_PROJECT_NOT_SUBSTANTIAL | ERR_PROJECT_NOT_FINAL"
    http_status: 409
    applies_to: "POST /ca/projects/{id}/achieve-final-completion, POST /ca/projects/{id}/close"

  - priority: 9
    category: state
    check: "Aggregate gates for project closeout: punch-inspection visit exists before substantial completion (ERR_PUNCH_INSPECTION_REQUIRED); no open punch items before final completion (ERR_OPEN_PUNCH_ITEMS_REMAIN); all four record document types accepted before final completion (ERR_RECORD_DOCUMENTS_INCOMPLETE); no open payment applications before close (ERR_OPEN_PAYMENT_APPLICATIONS); no open invoices before close (ERR_OPEN_INVOICES)"
    error_id: "ERR_PUNCH_INSPECTION_REQUIRED | ERR_OPEN_PUNCH_ITEMS_REMAIN | ERR_RECORD_DOCUMENTS_INCOMPLETE | ERR_OPEN_PAYMENT_APPLICATIONS | ERR_OPEN_INVOICES"
    http_status: 409
    applies_to: "POST /ca/projects/{id}/achieve-substantial-completion, achieve-final-completion, close"

  - priority: 10
    category: state
    check: "Target entity state: submittal review requires UNDER_REVIEW (ERR_SUBMITTAL_INVALID_STATE); submittal resubmit requires REVISE_AND_RESUBMIT (same); vacate-review requires APPROVED or APPROVED_AS_NOTED (same); visit perform/cancel require SCHEDULED (ERR_SITE_VISIT_INVALID_STATE); field-report creation requires visit PERFORMED (same); rfi answer/withdraw require OPEN (ERR_RFI_INVALID_STATE); rfi close requires ANSWERED (same); drawing creation requires RFI CLARIFICATION_PENDING or ANSWERED (same); pay-app certify/reject require SUBMITTED (ERR_PAYMENT_APPLICATION_INVALID_STATE); resubmit requires REJECTED (same); void requires CERTIFIED (same) and no later CERTIFIED application exists (ERR_LATER_CERTIFIED_APPLICATION_EXISTS); change-order recommend requires SUBMITTED (ERR_CHANGE_ORDER_INVALID_STATE); owner-decision requires RECOMMEND_ACCEPTANCE or RECOMMEND_REJECTION (same); incorporate requires OWNER_ACCEPTED (same); punch claim requires OPEN or REOPENED (ERR_PUNCH_ITEM_INVALID_STATE); verify requires CLAIMED_COMPLETE (same); reopen requires CLAIMED_COMPLETE or VERIFIED (same); record-document review requires SUBMITTED (ERR_RECORD_DOCUMENT_INVALID_STATE); resubmit requires RETURNED_FOR_CORRECTION (same); invoice issue/cancel require DRAFT (ERR_INVOICE_INVALID_STATE, cancel also allows DISPUTED); owner-decision requires ISSUED (same); record-payment requires OWNER_APPROVED (same); clear-nonconformance requires nonconformance_status OPEN (ERR_FIELD_REPORT_INVALID_STATE)"
    error_id: "ERR_SUBMITTAL_INVALID_STATE | ERR_SITE_VISIT_INVALID_STATE | ERR_RFI_INVALID_STATE | ERR_PAYMENT_APPLICATION_INVALID_STATE | ERR_LATER_CERTIFIED_APPLICATION_EXISTS | ERR_CHANGE_ORDER_INVALID_STATE | ERR_PUNCH_ITEM_INVALID_STATE | ERR_RECORD_DOCUMENT_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_FIELD_REPORT_INVALID_STATE"
    http_status: 409
    applies_to: "All state-transition endpoints"

  - priority: 11
    category: business_safety
    check: "Segregation of duties and conformance gates: field report issuer must differ from the visit performer (ERR_SOD_REPORT_ISSUER_IS_PERFORMER); pay-app certifier must differ from the verification visit's performer (ERR_SOD_CERTIFIER_IS_VERIFIER); certification with an uncleared nonconformance on the verification visit's report is blocked (ERR_NONCONFORMANCE_NOT_CLEARED)"
    error_id: "ERR_SOD_REPORT_ISSUER_IS_PERFORMER | ERR_SOD_CERTIFIER_IS_VERIFIER | ERR_NONCONFORMANCE_NOT_CLEARED"
    http_status: 422
    applies_to: "POST /ca/field-reports, POST /ca/payment-applications/{id}/certify"
    note: "ERR_NONCONFORMANCE_NOT_CLEARED returns http 409; the two SoD errors return 422."

  - priority: 12
    category: business_temporal
    check: "Visit date uniqueness: no other SiteVisit on the same project with the same visit_date in SCHEDULED, PERFORMED, or REPORT_ISSUED (calendar-day equality; CANCELLED releases the date)"
    error_id: ERR_VISIT_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /ca/site-visits"

  - priority: 13
    category: business_temporal
    check: "Invoice period overlap: [period_start, period_end] must not overlap any other non-CANCELLED AdditionalServiceInvoice period on the project; overlap test start < other.period_end AND other.period_start < end — adjacency (shared endpoint date) is allowed"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ca/additional-service-invoices"

  - priority: 14
    category: business_temporal
    check: "Pay-app period ordering: period_ending_date must be strictly greater than period_ending_date of every SUBMITTED or CERTIFIED PaymentApplication on the project (REJECTED and VOIDED release their period)"
    error_id: ERR_PAY_APP_PERIOD_NOT_AFTER_PREVIOUS
    http_status: 409
    applies_to: "POST /ca/payment-applications, POST /ca/payment-applications/{id}/resubmit"

  - priority: 15
    category: business_temporal
    check: "Field report window: date(issued clock) must be <= date(visit.performed_at) + CaProject.field_report_window_days"
    error_id: ERR_FIELD_REPORT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /ca/field-reports"

  - priority: 16
    category: business_temporal
    check: "Extension billing requires at least one billable day in the requested period given the current horizon (strictly-after comparison on horizon_start_date)"
    error_id: ERR_NO_BILLABLE_EXTENSION
    http_status: 422
    applies_to: "POST /ca/additional-service-invoices"

  - priority: 17
    category: business_referential
    check: "Verification visit validity: purpose PAYMENT_VERIFICATION, status REPORT_ISSUED, and visit_date inside the application's period window (after the previous CERTIFIED application's period_ending_date — or unrestricted below period_ending_date for the first application — and at or before period_ending_date)"
    error_id: ERR_VERIFICATION_VISIT_INVALID
    http_status: 422
    applies_to: "POST /ca/payment-applications, POST /ca/payment-applications/{id}/resubmit"

  - priority: 18
    category: business_referential
    check: "Originating RFI: when rfi_id is supplied on a change order, the RFI must have cost_impact_flag true and status ANSWERED or CLOSED"
    error_id: ERR_RFI_NOT_COST_IMPACT
    http_status: 422
    applies_to: "POST /ca/change-orders"

  - priority: 19
    category: business_referential
    check: "Every line's sov_line_code must exist in the project's sov_lines"
    error_id: ERR_UNKNOWN_SOV_LINE_CODE
    http_status: 422
    applies_to: "POST /ca/payment-applications, POST /ca/payment-applications/{id}/resubmit"

  - priority: 20
    category: business_referential
    check: "Clearing visit validity for nonconformance clearance: same project, status REPORT_ISSUED, its FieldReport has nonconforming_work_flag false, performed_at at or after the flagged visit's performed_at"
    error_id: ERR_NONCONFORMANCE_CLEARANCE_VISIT_INVALID
    http_status: 422
    applies_to: "POST /ca/field-reports/{id}/clear-nonconformance"

  - priority: 21
    category: business_referential
    check: "Punch visit validity: raised_visit_id must reference a SiteVisit on the same project with purpose PUNCH_INSPECTION and status REPORT_ISSUED"
    error_id: ERR_PUNCH_VISIT_INVALID
    http_status: 422
    applies_to: "POST /ca/punch-list-items"

  - priority: 22
    category: business_constraint
    check: "Schedule-of-values integrity at project creation: sum of sov_lines[].scheduled_value_cents must equal original_contract_sum_cents exactly"
    error_id: ERR_SOV_SUM_MISMATCH
    http_status: 422
    applies_to: "POST /ca/projects"

  - priority: 23
    category: business_constraint
    check: "One live record document per (project, doc_type): creation blocked while another RecordDocument of the same project and doc_type is in SUBMITTED, RETURNED_FOR_CORRECTION, or ACCEPTED"
    error_id: ERR_DUPLICATE_RECORD_DOCUMENT
    http_status: 409
    applies_to: "POST /ca/record-documents"

  - priority: 24
    category: business_constraint
    check: "Per-line schedule-of-values cap: for each line, prior certified work on that SOV line plus work_completed_this_period_cents must be <= the line's scheduled_value_cents"
    error_id: ERR_SOV_LINE_OVERRUN
    http_status: 422
    applies_to: "POST /ca/payment-applications, POST /ca/payment-applications/{id}/resubmit"

  - priority: 25
    category: business_fiscal
    check: "Certification fiscal gate: recomputed gross_work_completed_cents must be <= CaProject.adjusted_contract_sum_cents"
    error_id: ERR_CERTIFICATION_EXCEEDS_CONTRACT_BALANCE
    http_status: 402
    applies_to: "POST /ca/payment-applications/{id}/certify"

# =============================================================================
# §1.5 API Endpoint Table (63 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/ca/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time; all *_at stamps and date comparisons read this clock."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["recompute ca_posture for every ACTIVE CaProject (ca_posture_derivation)"]

  # --- CaProject ---
  - method: POST
    path: "/ca/projects"
    description: "Create a CA-phase project with its embedded schedule of values"
    roles: [FirmAdmin]
    code: 201
    input: [name, owner_user_id, contractor_user_id, original_contract_sum_cents, sov_lines, base_substantial_completion_date, daily_extension_rate_cents, monthly_extension_rate_cents, billing_method, retainage_mode, "grace_days?", "review_window_days_submittal?", "review_window_days_rfi?", "field_report_window_days?"]
    output: CaProject
    side_effects: ["adjusted_contract_sum_cents := original_contract_sum_cents", "adjusted_substantial_completion_date := base_substantial_completion_date", "excusable_delay_days/certified_to_date_cents/retainage_held_cents := 0", "ca_posture := NORMAL", "status := SETUP"]

  - method: GET
    path: "/ca/projects"
    description: "List projects with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["status?", "posture?", "owner_user_id?", "contractor_user_id?", "limit?", "offset?"]
    output: "CaProject[]"
    side_effects: []

  - method: GET
    path: "/ca/projects/{id}"
    description: "Get one project including all computed financial and posture fields"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: CaProject
    side_effects: []

  - method: POST
    path: "/ca/projects/{id}/activate"
    description: "Activate a project (SETUP -> ACTIVE)"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: CaProject
    side_effects: ["status := ACTIVE", "recompute ca_posture"]

  - method: POST
    path: "/ca/projects/{id}/achieve-substantial-completion"
    description: "Determine substantial completion (ACTIVE -> SUBSTANTIAL_COMPLETION_ACHIEVED)"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: CaProject
    side_effects: ["substantial_completion_actual_date := clock date", "recompute ca_posture", "recompute DRAFT invoices with horizon_end_date := substantial_completion_actual_date; auto-CANCELLED at 0 billable days"]

  - method: POST
    path: "/ca/projects/{id}/achieve-final-completion"
    description: "Determine final completion (SUBSTANTIAL_COMPLETION_ACHIEVED -> FINAL_COMPLETION_ACHIEVED)"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: CaProject
    side_effects: ["status := FINAL_COMPLETION_ACHIEVED"]

  - method: POST
    path: "/ca/projects/{id}/close"
    description: "Close a project (FINAL_COMPLETION_ACHIEVED -> CLOSED)"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: CaProject
    side_effects: ["status := CLOSED"]

  # --- Submittal ---
  - method: POST
    path: "/ca/submittals"
    description: "Contractor submits a submittal / shop drawing package"
    roles: [Contractor]
    code: 201
    input: [project_id, spec_section, required_on_site_date]
    output: Submittal
    side_effects: ["status := UNDER_REVIEW", "revision_number := 1", "received_at := clock", "due_at := received_at + review_window_days_submittal"]

  - method: GET
    path: "/ca/submittals"
    description: "List submittals with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "Submittal[]"
    side_effects: []

  - method: GET
    path: "/ca/submittals/{id}"
    description: "Get one submittal"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: Submittal
    side_effects: []

  - method: POST
    path: "/ca/submittals/{id}/review"
    description: "CA team reviews the current revision (UNDER_REVIEW -> outcome state)"
    roles: [ArchitectCA]
    code: 200
    input: [outcome, "review_notes?"]
    output: Submittal
    side_effects: ["status := outcome", "reviewed_at := clock", "late credit per excusable_delay_credit for APPROVED/APPROVED_AS_NOTED", "recompute project excusable_delay_days + ca_posture", "recompute DRAFT invoices (auto-CANCELLED at 0 billable days)"]

  - method: POST
    path: "/ca/submittals/{id}/resubmit"
    description: "Contractor resubmits after REVISE_AND_RESUBMIT"
    roles: [Contractor]
    code: 200
    input: []
    output: Submittal
    side_effects: ["revision_number += 1", "received_at/due_at recomputed", "status := UNDER_REVIEW"]

  - method: POST
    path: "/ca/submittals/{id}/vacate-review"
    description: "CA team vacates an APPROVED / APPROVED_AS_NOTED review, returning the submittal to UNDER_REVIEW and reversing its excusable-delay credit"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: Submittal
    side_effects: ["reverse credited_delay_days into project excusable_delay_days", "received_at/due_at recomputed", "recompute ca_posture + DRAFT invoices"]

  # --- SiteVisit ---
  - method: POST
    path: "/ca/site-visits"
    description: "CA team schedules a site observation visit"
    roles: [ArchitectCA]
    code: 201
    input: [project_id, visit_date, purpose, performed_by_user_id]
    output: SiteVisit
    side_effects: ["status := SCHEDULED", "visit date-conflict check (ERR_VISIT_DATE_CONFLICT)"]

  - method: GET
    path: "/ca/site-visits"
    description: "List site visits with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "purpose?", "performed_by_user_id?", "limit?", "offset?"]
    output: "SiteVisit[]"
    side_effects: []

  - method: GET
    path: "/ca/site-visits/{id}"
    description: "Get one site visit"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: SiteVisit
    side_effects: []

  - method: POST
    path: "/ca/site-visits/{id}/perform"
    description: "Mark a scheduled visit performed (SCHEDULED -> PERFORMED)"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: SiteVisit
    side_effects: ["performed_at := clock"]

  - method: POST
    path: "/ca/site-visits/{id}/cancel"
    description: "Cancel a scheduled visit (SCHEDULED -> CANCELLED), releasing its date"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: SiteVisit
    side_effects: ["status := CANCELLED"]

  # --- FieldReport ---
  - method: POST
    path: "/ca/field-reports"
    description: "Issue the field report for a performed visit (1:1; moves visit to REPORT_ISSUED)"
    roles: [ArchitectCA]
    code: 201
    input: [site_visit_id, issued_by_user_id, conformance_summary, "nonconforming_work_flag?", "notes?"]
    output: FieldReport
    side_effects: ["issued_at := clock", "visit := REPORT_ISSUED (which enforces the 1:1 — a second report finds the visit no longer PERFORMED)", "nonconformance_status := NONE or OPEN", "SoD + issuance-window checks"]

  - method: GET
    path: "/ca/field-reports"
    description: "List field reports with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["site_visit_id?", "issued_by_user_id?", "clearing_visit_id?", "limit?", "offset?"]
    output: "FieldReport[]"
    side_effects: []

  - method: GET
    path: "/ca/field-reports/{id}"
    description: "Get one field report"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: FieldReport
    side_effects: []

  - method: POST
    path: "/ca/field-reports/{id}/clear-nonconformance"
    description: "Clear an OPEN nonconformance using a conforming follow-up visit"
    roles: [ArchitectCA]
    code: 200
    input: [clearing_visit_id]
    output: FieldReport
    side_effects: ["nonconformance_status := CLEARED", "clearing_visit_id := input"]

  # --- Rfi ---
  - method: POST
    path: "/ca/rfis"
    description: "Contractor files a request for information"
    roles: [Contractor]
    code: 201
    input: [project_id, question, "cost_impact_flag?"]
    output: Rfi
    side_effects: ["status := OPEN", "received_at := clock", "due_at := received_at + review_window_days_rfi"]

  - method: GET
    path: "/ca/rfis"
    description: "List RFIs with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "Rfi[]"
    side_effects: []

  - method: GET
    path: "/ca/rfis/{id}"
    description: "Get one RFI"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: Rfi
    side_effects: []

  - method: POST
    path: "/ca/rfis/{id}/answer"
    description: "CA team answers an RFI directly or marks it as needing a clarification drawing"
    roles: [ArchitectCA]
    code: 200
    input: [answer_text, "requires_clarification_drawing?"]
    output: Rfi
    side_effects: ["status := ANSWERED or CLARIFICATION_PENDING", "on ANSWERED: answered_at := clock, late credit per excusable_delay_credit, recompute project excusable_delay_days + ca_posture + DRAFT invoices"]

  - method: POST
    path: "/ca/rfis/{id}/close"
    description: "Contractor closes an answered RFI"
    roles: [Contractor]
    code: 200
    input: []
    output: Rfi
    side_effects: ["status := CLOSED"]

  - method: POST
    path: "/ca/rfis/{id}/withdraw"
    description: "Contractor withdraws an open RFI"
    roles: [Contractor]
    code: 200
    input: []
    output: Rfi
    side_effects: ["status := WITHDRAWN"]

  # --- ClarificationDrawing ---
  - method: POST
    path: "/ca/clarification-drawings"
    description: "Issue a clarification drawing against an RFI (revision supersedes the previously ISSUED drawing); OCC-guarded on the RFI version"
    roles: [ArchitectCA]
    code: 201
    input: [rfi_id, drawing_ref, expected_rfi_version]
    output: ClarificationDrawing
    side_effects: ["revision_number := prior max + 1", "previously ISSUED drawing of the RFI := SUPERSEDED", "RFI CLARIFICATION_PENDING -> ANSWERED with answered_at := clock and late credit (excusable_delay_credit)", "increments Rfi.version by 1", "recompute project excusable_delay_days + ca_posture + DRAFT invoices when the RFI transitions"]

  - method: GET
    path: "/ca/clarification-drawings"
    description: "List clarification drawings with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["rfi_id?", "status?", "limit?", "offset?"]
    output: "ClarificationDrawing[]"
    side_effects: []

  - method: GET
    path: "/ca/clarification-drawings/{id}"
    description: "Get one clarification drawing"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: ClarificationDrawing
    side_effects: []

  # --- PaymentApplication ---
  - method: POST
    path: "/ca/payment-applications"
    description: "Contractor submits a payment application with per-SOV-line work and stored materials"
    roles: [Contractor]
    code: 201
    input: [project_id, period_ending_date, verification_visit_id, lines]
    output: PaymentApplication
    side_effects: ["status := SUBMITTED", "revision_number := 1", "previous_application_id resolved per chain selector", "provisional numbers per payment_certification (provisional variant)"]

  - method: GET
    path: "/ca/payment-applications"
    description: "List payment applications with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "verification_visit_id?", "previous_application_id?", "limit?", "offset?"]
    output: "PaymentApplication[]"
    side_effects: []

  - method: GET
    path: "/ca/payment-applications/{id}"
    description: "Get one payment application"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: PaymentApplication
    side_effects: []

  - method: POST
    path: "/ca/payment-applications/{id}/certify"
    description: "CA team certifies a payment application (SUBMITTED -> CERTIFIED)"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: PaymentApplication
    side_effects: ["final recompute per payment_certification", "certified_at := clock", "certified_by_user_id := X-User-ID", "recompute project certified_to_date_cents + retainage_held_cents (contract_position)"]

  - method: POST
    path: "/ca/payment-applications/{id}/reject"
    description: "CA team rejects a payment application (SUBMITTED -> REJECTED)"
    roles: [ArchitectCA]
    code: 200
    input: [reason]
    output: PaymentApplication
    side_effects: ["rejection_reason := reason", "period released for the ordering rule"]

  - method: POST
    path: "/ca/payment-applications/{id}/resubmit"
    description: "Contractor resubmits a rejected application with replacement period, verification visit, and lines"
    roles: [Contractor]
    code: 200
    input: [period_ending_date, verification_visit_id, lines]
    output: PaymentApplication
    side_effects: ["revision_number += 1", "full re-validation as on creation", "provisional recompute"]

  - method: POST
    path: "/ca/payment-applications/{id}/void"
    description: "Firm admin voids a certified application (CERTIFIED -> VOIDED), compensating the certified totals"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: PaymentApplication
    side_effects: ["recompute project certified_to_date_cents + retainage_held_cents (contract_position)", "period released for the ordering rule"]

  # --- ChangeOrder ---
  - method: POST
    path: "/ca/change-orders"
    description: "Contractor submits a change order proposal, optionally originating from a cost-impact RFI"
    roles: [Contractor]
    code: 201
    input: [project_id, title, net_cost_change_cents, "time_extension_days?", "rfi_id?"]
    output: ChangeOrder
    side_effects: ["status := SUBMITTED", "markup_cents and total_amount_cents per change_order_pricing"]

  - method: GET
    path: "/ca/change-orders"
    description: "List change orders with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "rfi_id?", "limit?", "offset?"]
    output: "ChangeOrder[]"
    side_effects: []

  - method: GET
    path: "/ca/change-orders/{id}"
    description: "Get one change order"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/ca/change-orders/{id}/recommend"
    description: "CA team records its recommendation to the owner (SUBMITTED -> RECOMMEND_*)"
    roles: [ArchitectCA]
    code: 200
    input: [recommendation, "review_notes?"]
    output: ChangeOrder
    side_effects: ["recommendation + recommended_by_user_id set"]

  - method: POST
    path: "/ca/change-orders/{id}/owner-decision"
    description: "Owner accepts or rejects a recommended change order (may override the recommendation)"
    roles: [Owner]
    code: 200
    input: [decision]
    output: ChangeOrder
    side_effects: ["status := OWNER_ACCEPTED or OWNER_REJECTED"]

  - method: POST
    path: "/ca/change-orders/{id}/incorporate"
    description: "Owner incorporates an accepted change order into the contract sum and completion date; OCC-guarded on the project version"
    roles: [Owner]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects: ["status := INCORPORATED", "project adjusted_contract_sum_cents += total_amount_cents", "project adjusted_substantial_completion_date += time_extension_days", "increments CaProject.version by 1", "recompute ca_posture + retainage_held_cents + DRAFT invoices (auto-CANCELLED at 0 billable days)"]

  # --- PunchListItem ---
  - method: POST
    path: "/ca/punch-list-items"
    description: "CA team raises a punch list item from a punch inspection visit"
    roles: [ArchitectCA]
    code: 201
    input: [project_id, raised_visit_id, description, location]
    output: PunchListItem
    side_effects: ["status := OPEN", "reopen_count := 0"]

  - method: GET
    path: "/ca/punch-list-items"
    description: "List punch list items with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "raised_visit_id?", "limit?", "offset?"]
    output: "PunchListItem[]"
    side_effects: []

  - method: GET
    path: "/ca/punch-list-items/{id}"
    description: "Get one punch list item"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: PunchListItem
    side_effects: []

  - method: POST
    path: "/ca/punch-list-items/{id}/claim-complete"
    description: "Contractor claims a punch item complete (OPEN/REOPENED -> CLAIMED_COMPLETE)"
    roles: [Contractor]
    code: 200
    input: []
    output: PunchListItem
    side_effects: ["status := CLAIMED_COMPLETE"]

  - method: POST
    path: "/ca/punch-list-items/{id}/verify"
    description: "CA team verifies completion (CLAIMED_COMPLETE -> VERIFIED)"
    roles: [ArchitectCA]
    code: 200
    input: []
    output: PunchListItem
    side_effects: ["status := VERIFIED"]

  - method: POST
    path: "/ca/punch-list-items/{id}/reopen"
    description: "CA team reopens a claimed or verified item (CLAIMED_COMPLETE/VERIFIED -> REOPENED)"
    roles: [ArchitectCA]
    code: 200
    input: [reason]
    output: PunchListItem
    side_effects: ["status := REOPENED", "reopen_count += 1"]

  # --- RecordDocument ---
  - method: POST
    path: "/ca/record-documents"
    description: "Contractor submits a record document (as-built, O&M manual, warranty, test report)"
    roles: [Contractor]
    code: 201
    input: [project_id, doc_type]
    output: RecordDocument
    side_effects: ["status := SUBMITTED", "revision_number := 1"]

  - method: GET
    path: "/ca/record-documents"
    description: "List record documents with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "doc_type?", "limit?", "offset?"]
    output: "RecordDocument[]"
    side_effects: []

  - method: GET
    path: "/ca/record-documents/{id}"
    description: "Get one record document"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: RecordDocument
    side_effects: []

  - method: POST
    path: "/ca/record-documents/{id}/review"
    description: "CA team accepts or returns a record document"
    roles: [ArchitectCA]
    code: 200
    input: [outcome, "review_notes?"]
    output: RecordDocument
    side_effects: ["status := ACCEPTED or RETURNED_FOR_CORRECTION"]

  - method: POST
    path: "/ca/record-documents/{id}/resubmit"
    description: "Contractor resubmits a returned record document"
    roles: [Contractor]
    code: 200
    input: []
    output: RecordDocument
    side_effects: ["revision_number += 1", "status := SUBMITTED"]

  # --- AdditionalServiceInvoice ---
  - method: POST
    path: "/ca/additional-service-invoices"
    description: "Firm admin drafts an additional-service invoice for an extended-duration period"
    roles: [FirmAdmin]
    code: 201
    input: [project_id, period_start, period_end]
    output: AdditionalServiceInvoice
    side_effects: ["status := DRAFT", "horizon/billable_days/amount per additional_service_billing", "ERR_NO_BILLABLE_EXTENSION when billable_days == 0"]

  - method: GET
    path: "/ca/additional-service-invoices"
    description: "List additional-service invoices with optional filters"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "AdditionalServiceInvoice[]"
    side_effects: []

  - method: GET
    path: "/ca/additional-service-invoices/{id}"
    description: "Get one additional-service invoice"
    roles: [FirmAdmin, ArchitectCA, Contractor, Owner]
    code: 200
    input: []
    output: AdditionalServiceInvoice
    side_effects: []

  - method: POST
    path: "/ca/additional-service-invoices/{id}/issue"
    description: "Issue a draft invoice to the owner (DRAFT -> ISSUED), freezing its amounts"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: AdditionalServiceInvoice
    side_effects: ["status := ISSUED", "amounts freeze"]

  - method: POST
    path: "/ca/additional-service-invoices/{id}/owner-decision"
    description: "Owner approves or disputes an issued invoice"
    roles: [Owner]
    code: 200
    input: [decision]
    output: AdditionalServiceInvoice
    side_effects: ["status := OWNER_APPROVED or DISPUTED"]

  - method: POST
    path: "/ca/additional-service-invoices/{id}/record-payment"
    description: "Firm admin records payment of an approved invoice (OWNER_APPROVED -> PAID)"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: AdditionalServiceInvoice
    side_effects: ["status := PAID"]

  - method: POST
    path: "/ca/additional-service-invoices/{id}/cancel"
    description: "Firm admin cancels a draft or disputed invoice, releasing its period"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: AdditionalServiceInvoice
    side_effects: ["status := CANCELLED", "period released"]

# =============================================================================
# §1.6 Error Code Catalog (51 errors)
# =============================================================================
errors:
  # --- auth / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or role not one of the declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_PROJECT_COUNTERPARTY, http: 403, condition: "Contractor/Owner write where X-User-ID does not match the project's contractor_user_id / owner_user_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, unknown enum value, period_start >= period_end, empty or duplicate-coded lines, negative amount where forbidden" }

  # --- existence ---
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "No CaProject with the given id" }
  - { id: ERR_SUBMITTAL_NOT_FOUND, http: 404, condition: "No Submittal with the given id" }
  - { id: ERR_SITE_VISIT_NOT_FOUND, http: 404, condition: "No SiteVisit with the given id" }
  - { id: ERR_FIELD_REPORT_NOT_FOUND, http: 404, condition: "No FieldReport with the given id" }
  - { id: ERR_RFI_NOT_FOUND, http: 404, condition: "No Rfi with the given id" }
  - { id: ERR_CLARIFICATION_DRAWING_NOT_FOUND, http: 404, condition: "No ClarificationDrawing with the given id" }
  - { id: ERR_PAYMENT_APPLICATION_NOT_FOUND, http: 404, condition: "No PaymentApplication with the given id" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND, http: 404, condition: "No ChangeOrder with the given id" }
  - { id: ERR_PUNCH_ITEM_NOT_FOUND, http: 404, condition: "No PunchListItem with the given id" }
  - { id: ERR_RECORD_DOCUMENT_NOT_FOUND, http: 404, condition: "No RecordDocument with the given id" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "No AdditionalServiceInvoice with the given id" }

  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_rfi_version / expected_project_version does not equal the parent's current version (OCC)" }

  # --- project state & gates ---
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "Operation requires the project in ACTIVE (or, where noted, ACTIVE or SUBSTANTIAL_COMPLETION_ACHIEVED)" }
  - { id: ERR_PROJECT_NOT_SUBSTANTIAL, http: 409, condition: "achieve-final-completion requires SUBSTANTIAL_COMPLETION_ACHIEVED" }
  - { id: ERR_PROJECT_NOT_FINAL, http: 409, condition: "close requires FINAL_COMPLETION_ACHIEVED" }
  - { id: ERR_PUNCH_INSPECTION_REQUIRED, http: 409, condition: "No REPORT_ISSUED PUNCH_INSPECTION visit exists for the project at substantial-completion determination" }
  - { id: ERR_OPEN_PUNCH_ITEMS_REMAIN, http: 409, condition: "Punch items in OPEN, CLAIMED_COMPLETE, or REOPENED remain at final-completion determination" }
  - { id: ERR_RECORD_DOCUMENTS_INCOMPLETE, http: 409, condition: "Fewer than four doc types have an ACCEPTED record document at final-completion determination" }
  - { id: ERR_OPEN_PAYMENT_APPLICATIONS, http: 409, condition: "Payment applications in SUBMITTED or REJECTED remain at project close" }
  - { id: ERR_OPEN_INVOICES, http: 409, condition: "Invoices in DRAFT, ISSUED, OWNER_APPROVED, or DISPUTED remain at project close" }

  # --- entity state ---
  - { id: ERR_SUBMITTAL_INVALID_STATE, http: 409, condition: "Submittal not in the required state (review: UNDER_REVIEW; resubmit: REVISE_AND_RESUBMIT; vacate: APPROVED or APPROVED_AS_NOTED)" }
  - { id: ERR_SITE_VISIT_INVALID_STATE, http: 409, condition: "Visit not in the required state (perform/cancel: SCHEDULED; field report creation: PERFORMED)" }
  - { id: ERR_FIELD_REPORT_INVALID_STATE, http: 409, condition: "clear-nonconformance requires nonconformance_status OPEN" }
  - { id: ERR_RFI_INVALID_STATE, http: 409, condition: "RFI not in the required state (answer/withdraw: OPEN; close: ANSWERED; drawing creation: CLARIFICATION_PENDING or ANSWERED)" }
  - { id: ERR_PAYMENT_APPLICATION_INVALID_STATE, http: 409, condition: "Payment application not in the required state (certify/reject: SUBMITTED; resubmit: REJECTED; void: CERTIFIED)" }
  - { id: ERR_LATER_CERTIFIED_APPLICATION_EXISTS, http: 409, condition: "Void blocked because a CERTIFIED application with a later period_ending_date exists on the project" }
  - { id: ERR_CHANGE_ORDER_INVALID_STATE, http: 409, condition: "Change order not in the required state (recommend: SUBMITTED; owner-decision: RECOMMEND_ACCEPTANCE or RECOMMEND_REJECTION; incorporate: OWNER_ACCEPTED)" }
  - { id: ERR_PUNCH_ITEM_INVALID_STATE, http: 409, condition: "Punch item not in the required state (claim: OPEN or REOPENED; verify: CLAIMED_COMPLETE; reopen: CLAIMED_COMPLETE or VERIFIED)" }
  - { id: ERR_RECORD_DOCUMENT_INVALID_STATE, http: 409, condition: "Record document not in the required state (review: SUBMITTED; resubmit: RETURNED_FOR_CORRECTION)" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not in the required state (issue/cancel: DRAFT, cancel also DISPUTED; owner-decision: ISSUED; record-payment: OWNER_APPROVED)" }

  # --- compliance (segregation of duties / conformance) ---
  - { id: ERR_SOD_REPORT_ISSUER_IS_PERFORMER, http: 422, condition: "Field report issued_by_user_id equals the visit's performed_by_user_id" }
  - { id: ERR_SOD_CERTIFIER_IS_VERIFIER, http: 422, condition: "Pay-app certifier X-User-ID equals the verification visit's performed_by_user_id" }
  - { id: ERR_NONCONFORMANCE_NOT_CLEARED, http: 409, condition: "Certification blocked: verification visit's field report flags nonconforming work that is not CLEARED" }

  # --- temporal ---
  - { id: ERR_VISIT_DATE_CONFLICT, http: 409, condition: "Another non-CANCELLED visit already occupies the same visit_date on the project" }
  - { id: ERR_INVOICE_PERIOD_OVERLAP, http: 409, condition: "Requested invoice period overlaps a non-CANCELLED invoice period on the project (adjacency allowed)" }
  - { id: ERR_PAY_APP_PERIOD_NOT_AFTER_PREVIOUS, http: 409, condition: "period_ending_date is not strictly after every SUBMITTED/CERTIFIED application's period_ending_date on the project" }
  - { id: ERR_FIELD_REPORT_WINDOW_EXPIRED, http: 409, condition: "Field report issued more than field_report_window_days after the visit was performed" }
  - { id: ERR_NO_BILLABLE_EXTENSION, http: 422, condition: "Requested invoice period yields 0 billable days under the current billing horizon" }

  # --- referential ---
  - { id: ERR_VERIFICATION_VISIT_INVALID, http: 422, condition: "verification_visit_id is not a PAYMENT_VERIFICATION visit in REPORT_ISSUED whose visit_date falls inside the application's period window" }
  - { id: ERR_RFI_NOT_COST_IMPACT, http: 422, condition: "rfi_id references an RFI with cost_impact_flag false or status not in ANSWERED/CLOSED" }
  - { id: ERR_UNKNOWN_SOV_LINE_CODE, http: 422, condition: "A line's sov_line_code does not exist in the project's schedule of values" }
  - { id: ERR_NONCONFORMANCE_CLEARANCE_VISIT_INVALID, http: 422, condition: "clearing_visit_id is not a REPORT_ISSUED visit on the same project with a conforming report performed at or after the flagged visit" }
  - { id: ERR_PUNCH_VISIT_INVALID, http: 422, condition: "raised_visit_id is not a PUNCH_INSPECTION visit in REPORT_ISSUED on the same project" }

  # --- constraint ---
  - { id: ERR_SOV_SUM_MISMATCH, http: 422, condition: "Sum of sov_lines scheduled values does not equal original_contract_sum_cents at project creation" }
  - { id: ERR_DUPLICATE_RECORD_DOCUMENT, http: 409, condition: "A non-terminal record document of the same doc_type already exists on the project" }
  - { id: ERR_SOV_LINE_OVERRUN, http: 422, condition: "A line's cumulative work would exceed its scheduled value" }

  # --- fiscal ---
  - { id: ERR_CERTIFICATION_EXCEEDS_CONTRACT_BALANCE, http: 402, condition: "Recomputed gross work would exceed adjusted_contract_sum_cents at certification" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque; segregation of duties enforced by user-id comparisons)
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Architecture firm operations administrator: project setup, clock, invoicing lifecycle, payment-application voids"
    identity: opaque
    exclusive_operations:
      - "POST /ca/_clock/set_current_utc"
      - "POST /ca/projects + activate + close"
      - "POST /ca/additional-service-invoices + issue + record-payment + cancel"
      - "POST /ca/payment-applications/{id}/void"
    shared_operations:
      - "All GET endpoints"

  - name: ArchitectCA
    description: "CA team member: reviews, site visits, field reports, certifications, recommendations, punch verification, completion determinations"
    identity: opaque
    exclusive_operations:
      - "POST /ca/submittals/{id}/review + vacate-review"
      - "POST /ca/site-visits + perform + cancel"
      - "POST /ca/field-reports + clear-nonconformance"
      - "POST /ca/rfis/{id}/answer"
      - "POST /ca/clarification-drawings"
      - "POST /ca/payment-applications/{id}/certify + reject"
      - "POST /ca/change-orders/{id}/recommend"
      - "POST /ca/punch-list-items + verify + reopen"
      - "POST /ca/record-documents/{id}/review"
      - "POST /ca/projects/{id}/achieve-substantial-completion + achieve-final-completion"
    shared_operations:
      - "All GET endpoints"

  - name: Contractor
    description: "General contractor: submits submittals, RFIs, payment applications, change orders, punch claims, record documents; X-User-ID must equal the project's contractor_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /ca/submittals + resubmit"
      - "POST /ca/rfis + close + withdraw"
      - "POST /ca/payment-applications + resubmit"
      - "POST /ca/change-orders"
      - "POST /ca/punch-list-items/{id}/claim-complete"
      - "POST /ca/record-documents + resubmit"
    shared_operations:
      - "All GET endpoints"

  - name: Owner
    description: "Project owner: decides change orders and invoices, incorporates accepted change orders; X-User-ID must equal the project's owner_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /ca/change-orders/{id}/owner-decision + incorporate"
      - "POST /ca/additional-service-invoices/{id}/owner-decision"
    shared_operations:
      - "All GET endpoints"
