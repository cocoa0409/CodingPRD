  - name: the_authorize_branch_chain_is_verified_end_to_end_at_every_link
    claim_type: cascading_side_effects
    grounds:
    - state_machines.CloudServiceOffering.PACKAGE_SUBMITTED_to_AUTHORIZED
    - entities.Authorization
    - entities.MonitoringPeriod
    excluded_because:
      difficulty_instance: authorize_package_chain_mints_authorization_period_and_reanchors_assessment_findings
      rationale: That §1.8 instance already walks all four links of the AUTHORIZE chain in one call and asserts each of them,
        including the re-anchored ASSESSMENT deadlines and the month of the first MonitoringPeriod; repeating the positive
        chain here would only duplicate it. The corner that is NOT covered there — the REJECT branch firing none of the links
        — is exercised by the_reject_branch_of_the_decision_fires_none_of_the_four_cascade_links above.
  - name: the_deficient_close_chain_is_verified_at_its_fourth_hop
    claim_type: cascading_side_effects
    grounds:
    - state_machines.MonitoringPeriod.OPEN_to_CLOSED_DEFICIENT
    - entities.Agency.fields.open_notice_count
    excluded_because:
      difficulty_instance: deficient_period_close_chain_reaches_the_grantee_agency_notice_counter
      rationale: The ordering sensitivity of the close chain (period status -> Authorization counter -> posture -> ReuseGrant
        notice -> Agency.open_notice_count) is asserted hop by hop in that §1.8 instance, including the grants that must NOT
        be notified. The remaining breadth corner is the counter's behaviour at its 2nd and 3rd increments, which the two
        rate_threshold_triggers instances below cover.
  - name: both_impact_level_variants_are_computed_and_their_delta_is_asserted
    claim_type: dual_variant_calculation
    grounds:
    - calculations.impact_level_determination
    - entities.CloudServiceOffering.fields.preliminary_impact_level
    - entities.CloudServiceOffering.fields.final_impact_level
    excluded_because:
      difficulty_instance: preliminary_impact_level_outranks_final_when_a_high_category_stays_unconfirmed
      rationale: That §1.8 instance holds both variants on one offering at the same instant and asserts the delta (preliminary
        HIGH against final MODERATE) plus the baseline the final variant selects, which is exactly the claim this layer asks
        for. §1.9 adds only the endpoint-level corner — which endpoint runs which variant — in the_final_impact_variant_runs_only_on_the_determination_endpoint.
  - name: both_residual_risk_variants_are_computed_and_their_delta_is_asserted
    claim_type: dual_variant_calculation
    grounds:
    - calculations.residual_risk_score
    - entities.AuthorizationPackage.fields.residual_risk_score_at_submission
    - entities.Authorization.fields.residual_risk_score
    excluded_because:
