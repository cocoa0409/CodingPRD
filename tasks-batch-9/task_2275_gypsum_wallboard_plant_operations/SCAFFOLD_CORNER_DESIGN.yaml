              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T10:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b_over_completed: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 40.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T17:00:00Z", feed_window_end: "2026-08-02T19:00:00Z" }
              as: MaterialsController
              captures: { b_over_aborted: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T12:00:00Z", feed_window_end: "2026-08-02T16:00:00Z" }
