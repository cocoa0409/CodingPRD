      - name: wellfield_recovery_returns_plant_to_upgrading_and_closes_auto_downtime
        claim_type: compensation
        grounds: ["state_machines.ProcessingPlant.FLARING_to_UPGRADING", "state_machines.GasWell.THROTTLED_to_ONLINE", "calculations.plant_availability_factor", "entities.DowntimeEvent.fields.auto_generated"]
        distinguishing_aspect: "The compensating leg of the wellfield-shortfall cascade: once the isolated well is walked back to ONLINE and collected_flow_scfm recovers to 950.0, the plant auto-returns FLARING -> UPGRADING and its auto_generated DowntimeEvent is closed at the current clock, leaving duration_minutes 360.0 and availability_factor_pct 97.30."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z. Producing site with two wells at 480.0 and 470.0 scfm and a plant in UPGRADING."
            - "An ALARM reading on W-01 at 2026-08-09T02:00:00Z drove the cascade: W-01 ISOLATED, plant FLARING with spec_status OFF_SPEC, and one OPEN auto_generated DowntimeEvent with start_at 2026-08-10T00:00:00Z."
            - "The plant's spec dimension was then walked OFF_SPEC -> QUARANTINE -> ON_SPEC, and W-01 accumulated two GOOD readings and was returned to THROTTLED (current_flow_scfm 300.0, site total 770.0 - still below min_feed_scfm 900.0, so no recovery yet), then a third GOOD reading."
