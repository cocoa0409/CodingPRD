# =============================================================================
# task_0175_art_auction_consignment — SCAFFOLD (§1.0–§1.7)
# Art Auction House & Consignment
# =============================================================================

scenario: "Art Auction House & Consignment: lot cataloging/estimate, consignment agreement/reserve, bidder registration/paddle, hammer price + buyer's premium, seller commission, absentee/phone bid, droit de suite resale royalty, settlement/payout"

domain_name: art-auction-consignment
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4) — Expert band
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by FKs (Seller, Bidder, Consignment, Lot, Bid, ...).
  # AuctionSale is the only path-nesting parent for Lot; everything else is flat
  # with FK references and filtered-list GETs.

  state_machine_shape: parallel
  # Lot carries two independent state dimensions (sale_status × settlement_status);
  # Consignment is branching-with-revert; AuctionSale is linear-with-guard;
  # Invoice/SellerStatement are linear with compensation.

  relationship_patterns:
    - one_to_many        # AuctionSale -> Lot; Consignment -> Lot; Bidder -> Bid
    - cross_aggregate    # Lot references Consignment (different aggregate root)

  role_model: peer_roles
  # SaleAdministrator (house ops), Auctioneer (calls the room/records hammer),
  # Seller (entity-backed consignor), Bidder (entity-backed), FinanceOfficer
  # (settlement/payout), plus opaque read.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: legal_name, type: string, source: input, description: "Consignor legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Sellers" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 residence country; affects payout withholding" }
      - { name: payout_iban, type: string, source: input, description: "Disbursement account reference" }

  # ---------------------------------------------------------------------------
  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: legal_name, type: string, source: input, description: "Bidder legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Bidders" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the bidder" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Maximum unsettled exposure permitted across all open invoices for this bidder; 0 means no purchases allowed until raised" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of total_due_cents over this bidder's Invoices in status IN {ISSUED}; ties off when an invoice flips to PAID or VOID" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED bidders cannot register paddles or place bids", constraints: "enum: ACTIVE, SUSPENDED" }

  # ---------------------------------------------------------------------------
  - name: AuctionSale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: title, type: string, source: input, description: "Sale title (e.g. 'Modern & Contemporary, June')" }
      - { name: sale_date_utc, type: datetime, source: input, description: "Scheduled sale start; ISO 8601 UTC" }
      - { name: currency, type: string, source: input, description: "Settlement currency for all lots in this sale (ISO 4217, e.g. USD); every Lot and Bid amount is in this currency" }
      - { name: buyers_premium_schedule_id, type: string, source: input, description: "FK -> PremiumSchedule.id; the tiered buyer's-premium schedule applied to every lot in this sale" }
      - { name: status, type: enum, source: system, default: CATALOGING, description: "CATALOGING | PUBLISHED | LIVE | CLOSED — lifecycle of the sale", constraints: "enum: CATALOGING, PUBLISHED, LIVE, CLOSED" }
      - { name: lot_count, type: integer, source: computed, default: 0, description: "Count of Lots whose auction_sale_id == this sale and sale_status != WITHDRAWN" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: PremiumSchedule
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: name, type: string, source: input, description: "Schedule name (e.g. 'Standard 2026')" }
      - { name: tiers, type: array, source: input, description: "Ordered array of {upper_bound_cents, rate_bps} marginal tiers applied to hammer price; upper_bound_cents is exclusive-upper-open on the final tier (use null for the open top tier); rate_bps in basis points (e.g. 2600 = 26.00%). Tiers MUST be sorted ascending by upper_bound_cents with the null/open tier last" }

  # ---------------------------------------------------------------------------
  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; the consignor" }
      - { name: seller_commission_bps, type: integer, source: input, description: "Seller commission rate in basis points charged on hammer price (e.g. 1000 = 10.00%); range 0..5000" }
      - { name: unsold_fee_cents, type: integer, source: input, default: 0, description: "Flat fee charged to the seller per lot that fails to meet reserve (BOUGHT_IN)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | TERMINATED — DRAFT may be edited and signed; ACTIVE is countersigned and lots may attach; TERMINATED blocks new lots", constraints: "enum: DRAFT, ACTIVE, TERMINATED" }
      - { name: lot_count, type: integer, source: computed, default: 0, description: "Count of Lots whose consignment_id == this consignment and sale_status != WITHDRAWN" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: Lot
    parent: AuctionSale
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: auction_sale_id, type: string, source: system, description: "FK -> AuctionSale.id; the sale this lot is cataloged in (taken from the path on creation)" }
      - { name: consignment_id, type: string, source: input, description: "FK -> Consignment.id; the consignment agreement governing commission terms" }
      - { name: lot_number, type: integer, source: input, description: "Position in the sale catalog; unique among non-WITHDRAWN Lots within the same auction_sale_id" }
      - { name: title, type: string, source: input, description: "Artwork title" }
      - { name: artist_name, type: string, source: input, description: "Artist of the work" }
      - { name: artist_alive, type: boolean, source: input, description: "True if the artist is living OR died within the resale-royalty term; gates droit de suite (see resale_royalty_due calc)" }
      - { name: low_estimate_cents, type: integer, source: input, description: "Pre-sale low estimate; must be > 0 and <= high_estimate_cents" }
      - { name: high_estimate_cents, type: integer, source: input, description: "Pre-sale high estimate; must be >= low_estimate_cents" }
      - { name: reserve_cents, type: integer, source: input, description: "Confidential minimum acceptable hammer; must satisfy reserve <= low_estimate (see validation); 0 means no reserve" }
      - { name: hammer_price_cents, type: integer, source: computed, default: 0, description: "Winning bid amount recorded at knock-down; 0 until SOLD or BOUGHT_IN" }
      - { name: winning_paddle_registration_id, type: string, source: computed, description: "Denormalized id of the PaddleRegistration that won this lot, copied from the winning Bid at knock-down; null until SOLD. Discover the registration via GET /paddle-registrations/{id} using this value, or via GET /lots/{id}/bids (the WINNING bid). Not a relational parent FK — it does not require child enumeration." }
      - { name: sale_status, type: enum, source: system, default: CATALOGED, description: "CATALOGED | OPEN | SOLD | BOUGHT_IN | WITHDRAWN — first state dimension (room/sale outcome)", constraints: "enum: CATALOGED, OPEN, SOLD, BOUGHT_IN, WITHDRAWN" }
      - { name: settlement_status, type: enum, source: system, default: NONE, description: "NONE | INVOICED | STATEMENTED | SETTLED — second, independent state dimension (financial lifecycle); advances only after sale_status == SOLD", constraints: "enum: NONE, INVOICED, STATEMENTED, SETTLED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation including cascaded side effects" }

  # ---------------------------------------------------------------------------
  - name: PaddleRegistration
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: auction_sale_id, type: string, source: input, description: "FK -> AuctionSale.id; the sale this paddle is valid in" }
      - { name: bidder_id, type: string, source: input, description: "FK -> Bidder.id; the registered bidder" }
      - { name: paddle_number, type: integer, source: system, description: "Sequential paddle number assigned per sale, starting at 1, incrementing by 1 in registration created_at order; unique within auction_sale_id" }
      - { name: registration_type, type: enum, source: input, default: FLOOR, description: "FLOOR | ABSENTEE | PHONE — how the bidder participates; ABSENTEE registrations carry a max_absentee_bid_cents", constraints: "enum: FLOOR, ABSENTEE, PHONE" }
      - { name: max_absentee_bid_cents, type: integer, source: input, default: 0, description: "Required and > 0 when registration_type == ABSENTEE; the ceiling the house may execute on the bidder's behalf; must be 0 for FLOOR/PHONE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED — REVOKED paddles cannot place or win bids", constraints: "enum: ACTIVE, REVOKED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: Bid
    parent: Lot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; the lot bid upon (from path on creation)" }
      - { name: paddle_registration_id, type: string, source: input, description: "FK -> PaddleRegistration.id; the registration placing the bid" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount in the sale currency; must clear the current minimum increment over the standing high bid (see min_next_bid calc)" }
      - { name: bid_channel, type: enum, source: input, default: FLOOR, description: "FLOOR | ABSENTEE | PHONE — channel of this individual bid; must be consistent with the registration_type (FLOOR↔FLOOR, PHONE↔PHONE, ABSENTEE↔ABSENTEE)", constraints: "enum: FLOOR, ABSENTEE, PHONE" }
      - { name: status, type: enum, source: system, default: ACCEPTED, description: "ACCEPTED | RETRACTED | WINNING — WINNING is set on exactly one bid when the lot is knocked down; RETRACTED bids are excluded from standing-high computation", constraints: "enum: ACCEPTED, RETRACTED, WINNING" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the sold lot being invoiced" }
      - { name: paddle_registration_id, type: string, source: system, description: "Denormalized id of the winning PaddleRegistration, copied from Lot.winning_paddle_registration_id at invoice time. Discover the registration via GET /paddle-registrations/{id}. Not a relational parent FK — discovery of invoices runs via /bidders/{id}/invoices and /lots/{id}/invoices." }
      - { name: bidder_id, type: string, source: system, description: "FK -> Bidder.id; the buyer (resolved from the winning registration)" }
      - { name: hammer_price_cents, type: integer, source: system, description: "Snapshot of Lot.hammer_price_cents at invoice time" }
      - { name: buyers_premium_cents, type: integer, source: computed, description: "Tiered buyer's premium on hammer (see buyers_premium calc)" }
      - { name: total_due_cents, type: integer, source: computed, description: "hammer_price_cents + buyers_premium_cents" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative cash received against this invoice" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PAID | VOID — PAID when amount_paid_cents >= total_due_cents; VOID on lot sale reversal", constraints: "enum: ISSUED, PAID, VOID" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: ResaleRoyalty
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the sold lot the droit de suite royalty arises from (1:1 with a SOLD royalty-eligible lot)" }
      - { name: hammer_price_cents, type: integer, source: system, description: "Snapshot of Lot.hammer_price_cents used as the royalty base" }
      - { name: royalty_cents, type: integer, source: computed, description: "Droit de suite resale royalty, tiered & capped (see resale_royalty_due calc); 0 when not eligible" }
      - { name: bearer, type: enum, source: system, default: SELLER, description: "SELLER — which party the royalty is withheld from; always SELLER under this house's policy (withheld from the seller statement)", constraints: "enum: SELLER" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED | REMITTED | REVERSED — ACCRUED on creation, REMITTED when paid to the collecting society, REVERSED on sale reversal", constraints: "enum: ACCRUED, REMITTED, REVERSED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: SellerStatement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot the statement settles (1:1 with a STATEMENTED lot)" }
      - { name: consignment_id, type: string, source: system, description: "FK -> Consignment.id; resolved from the lot" }
      - { name: hammer_price_cents, type: integer, source: system, description: "Snapshot of Lot.hammer_price_cents" }
      - { name: seller_commission_cents, type: integer, source: computed, description: "round_half_up(hammer_price_cents * Consignment.seller_commission_bps / 10000)" }
      - { name: resale_royalty_withheld_cents, type: integer, source: computed, description: "Copy of the lot's ResaleRoyalty.royalty_cents when bearer==SELLER, else 0" }
      - { name: net_payable_cents, type: integer, source: computed, description: "hammer_price_cents - seller_commission_cents - resale_royalty_withheld_cents (see seller_net_payable calc); MUST equal hammer minus all withholdings, never negative" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PAID | REVERSED — PENDING on creation, PAID when a Payout disburses it, REVERSED on sale reversal", constraints: "enum: PENDING, PAID, REVERSED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

  # ---------------------------------------------------------------------------
  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: seller_statement_id, type: string, source: input, description: "FK -> SellerStatement.id; the statement being disbursed" }
      - { name: amount_cents, type: integer, source: system, description: "Snapshot of SellerStatement.net_payable_cents at disbursement time" }
      - { name: status, type: enum, source: system, default: DISBURSED, description: "DISBURSED — terminal; recorded disbursement to the seller", constraints: "enum: DISBURSED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: AuctionSale
    field: status
    initial_state: CATALOGING
    terminal_states: [CLOSED]
    note: "Linear pipeline with a child-state guard on PUBLISHED→LIVE and a bubble-up close."
    transitions:
      - from: CATALOGING
        to: PUBLISHED
        trigger: "POST /auction-sales/{id}/publish"
        actor: SaleAdministrator
        preconditions:
          - "AuctionSale.status == CATALOGING (else ERR_INVALID_STATE)"
          - "lot_count >= 1 (at least one non-WITHDRAWN lot, else ERR_LOTS_REQUIRED)"
        side_effects:
          - "increments AuctionSale.version by 1"

      - from: PUBLISHED
        to: LIVE
        trigger: "POST /auction-sales/{id}/open-bidding"
        actor: Auctioneer
        preconditions:
          - "AuctionSale.status == PUBLISHED"
        side_effects:
          - "every Lot with auction_sale_id == this sale and sale_status == CATALOGED transitions CATALOGED -> OPEN (bulk cascade; each lot's version +1)"
          - "increments AuctionSale.version by 1"

      - from: LIVE
        to: CLOSED
        trigger: "POST /auction-sales/{id}/close"
        actor: Auctioneer
        preconditions:
          - "AuctionSale.status == LIVE (else ERR_INVALID_STATE)"
          - "no Lot with auction_sale_id == this sale and sale_status == OPEN remains — every lot has been knocked down to SOLD/BOUGHT_IN or WITHDRAWN (else ERR_SALE_NOT_EMPTY_OF_OPEN_LOTS)"
        side_effects:
          - "increments AuctionSale.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Consignment
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    note: "Branching with revert: DRAFT can be activated or terminated; ACTIVE can be reverted to DRAFT for amendment, or terminated."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /consignments/{id}/activate"
        actor: SaleAdministrator
        preconditions:
          - "Consignment.status == DRAFT"
          - "Seller referenced by seller_id exists"
        side_effects:
          - "increments Consignment.version by 1"

      - from: ACTIVE
        to: DRAFT
        trigger: "POST /consignments/{id}/revert-to-draft"
        actor: SaleAdministrator
        preconditions:
          - "Consignment.status == ACTIVE"
          - "no Lot with consignment_id == this consignment has sale_status IN {OPEN, SOLD, BOUGHT_IN} (only CATALOGED/WITHDRAWN lots permit amendment)"
        side_effects:
          - "increments Consignment.version by 1"

      - from: [DRAFT, ACTIVE]
        to: TERMINATED
        trigger: "POST /consignments/{id}/terminate"
        actor: SaleAdministrator
        preconditions:
          - "Consignment.status IN {DRAFT, ACTIVE}"
          - "no Lot with consignment_id == this consignment has sale_status IN {OPEN, SOLD}"
        side_effects:
          - "every Lot with consignment_id == this consignment and sale_status == CATALOGED transitions CATALOGED -> WITHDRAWN (cascade; each lot's version +1; Consignment.lot_count and the lot's AuctionSale.lot_count recomputed)"
          - "increments Consignment.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Lot
    field: sale_status
    initial_state: CATALOGED
    terminal_states: [SOLD, BOUGHT_IN, WITHDRAWN]
    note: "First of two parallel dimensions. Knock-down forks SOLD vs BOUGHT_IN on the reserve threshold with divergent side-effect sets."
    transitions:
      - from: CATALOGED
        to: OPEN
        trigger: "system (AuctionSale PUBLISHED -> LIVE cascade) OR POST /lots/{id}/open"
        actor: Auctioneer
        preconditions:
          - "Lot.sale_status == CATALOGED"
          - "the lot's AuctionSale.status == LIVE"
        side_effects:
          - "increments Lot.version by 1"

      - from: OPEN
        to: SOLD
        trigger: "POST /lots/{id}/knock-down (hammer >= reserve)"
        actor: Auctioneer
        preconditions:
          - "Lot.sale_status == OPEN"
          - "the lot's AuctionSale.status == LIVE"
          - "at least one Bid on this lot with status == ACCEPTED exists"
          - "the standing-high ACCEPTED bid amount_cents >= Lot.reserve_cents"
        side_effects:
          - "sets Lot.hammer_price_cents = standing-high ACCEPTED bid amount_cents"
          - "sets the standing-high ACCEPTED Bid.status = WINNING (that bid's version +1)"
          - "sets Lot.winning_paddle_registration_id = winning bid's paddle_registration_id"
          - "increments Lot.version by 1"
        note: "Does NOT itself create Invoice/Royalty; settlement_status remains NONE until POST /lots/{id}/invoice."

      - from: OPEN
        to: BOUGHT_IN
        trigger: "POST /lots/{id}/knock-down (no qualifying bid) OR POST /lots/{id}/buy-in"
        actor: Auctioneer
        preconditions:
          - "Lot.sale_status == OPEN"
          - "the lot's AuctionSale.status == LIVE"
          - "either no ACCEPTED bid exists, or the standing-high ACCEPTED bid amount_cents < Lot.reserve_cents"
        side_effects:
          - "Lot.hammer_price_cents stays 0; no winning bid is set"
          - "increments Lot.version by 1"
        note: "Failed to meet reserve; the seller may owe Consignment.unsold_fee_cents (surfaced on a later statement workflow, out of settlement scope here)."

      - from: CATALOGED
        to: WITHDRAWN
        trigger: "POST /lots/{id}/withdraw OR system (Consignment TERMINATED cascade)"
        actor: SaleAdministrator
        preconditions:
          - "Lot.sale_status == CATALOGED"
        side_effects:
          - "recomputes the lot's AuctionSale.lot_count and Consignment.lot_count"
          - "increments Lot.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Lot
    field: settlement_status
    initial_state: NONE
    terminal_states: [SETTLED]
    note: "Second parallel dimension; the financial cascade. NONE->INVOICED->STATEMENTED->SETTLED. Drives the depth-3 settlement cascade and the compensation invariants."
    transitions:
      - from: NONE
        to: INVOICED
        trigger: "POST /lots/{id}/invoice"
        actor: FinanceOfficer
        preconditions:
          - "Lot.sale_status == SOLD"
          - "Lot.settlement_status == NONE"
          - "the lot's AuctionSale.status == CLOSED"
        side_effects:
          - "creates an Invoice (status ISSUED) for the lot: hammer_price_cents snapshot, buyers_premium_cents and total_due_cents computed via buyers_premium calc"
          - "increases the winning bidder's Bidder.outstanding_balance_cents by the new Invoice.total_due_cents (recompute)"
          - "if Lot.artist_alive is true, creates a ResaleRoyalty (status ACCRUED) for the lot with royalty_cents per resale_royalty_due calc; if not eligible no royalty row is created"
          - "sets Lot.settlement_status = INVOICED; increments Lot.version by 1"
        note: "Depth-2/3 cascade origin: invoice -> bidder balance recompute; invoice -> royalty accrual."

      - from: INVOICED
        to: STATEMENTED
        trigger: "POST /lots/{id}/statement"
        actor: FinanceOfficer
        preconditions:
          - "Lot.settlement_status == INVOICED"
          - "the lot's Invoice.status == PAID (buyer has settled in full)"
        side_effects:
          - "creates a SellerStatement (status PENDING) for the lot: seller_commission_cents, resale_royalty_withheld_cents (= the lot's ResaleRoyalty.royalty_cents if one exists with bearer SELLER, else 0), and net_payable_cents via seller_net_payable calc"
          - "sets Lot.settlement_status = STATEMENTED; increments Lot.version by 1"
        note: "Cross-entity guard on Invoice.status == PAID."

      - from: STATEMENTED
        to: SETTLED
        trigger: "POST /seller-statements/{id}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "Lot.settlement_status == STATEMENTED"
          - "the lot's SellerStatement.status == PENDING"
        side_effects:
          - "creates a Payout (status DISBURSED) with amount_cents = SellerStatement.net_payable_cents"
          - "sets SellerStatement.status = PAID (that statement's version +1)"
          - "if the lot's ResaleRoyalty exists and is ACCRUED, sets ResaleRoyalty.status = REMITTED (that royalty's version +1)"
          - "sets Lot.settlement_status = SETTLED; increments Lot.version by 1"
        note: "Depth-3 cascade: disburse -> Payout created -> SellerStatement PAID -> Lot SETTLED, with royalty remittance bubbling on the same action."

  # ---------------------------------------------------------------------------
  - entity: Invoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    note: "Payment accumulation with cross-bidder-balance side effect, plus compensation on reversal."
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: FinanceOfficer
        preconditions:
          - "Invoice.status == ISSUED"
          - "the payment amount makes amount_paid_cents >= total_due_cents (full settlement; partial payments keep status ISSUED, see note)"
        side_effects:
          - "increases Invoice.amount_paid_cents by the payment amount_cents"
          - "when amount_paid_cents >= total_due_cents: sets Invoice.status = PAID and decreases the bidder's outstanding_balance_cents by total_due_cents (recompute)"
          - "increments Invoice.version by 1"
        note: "A payment that does NOT reach total_due_cents leaves status ISSUED, bumps amount_paid_cents and version, and does NOT touch the outstanding balance (balance only ties off at full payment)."

      - from: ISSUED
        to: VOID
        trigger: "system (Lot sale reversal via POST /lots/{id}/reverse-sale)"
        actor: FinanceOfficer
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "decreases the bidder's outstanding_balance_cents by total_due_cents (recompute, since the invoice no longer counts)"
          - "increments Invoice.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ResaleRoyalty
    field: status
    initial_state: ACCRUED
    terminal_states: [REMITTED, REVERSED]
    note: "Accrual lifecycle; REMITTED on disburse, REVERSED on sale reversal."
    transitions:
      - from: ACCRUED
        to: REMITTED
        trigger: "system (SellerStatement disburse cascade)"
        actor: FinanceOfficer
        preconditions:
          - "ResaleRoyalty.status == ACCRUED"
        side_effects:
          - "increments ResaleRoyalty.version by 1"

      - from: ACCRUED
        to: REVERSED
        trigger: "system (Lot sale reversal via POST /lots/{id}/reverse-sale)"
        actor: FinanceOfficer
        preconditions:
          - "ResaleRoyalty.status == ACCRUED"
        side_effects:
          - "increments ResaleRoyalty.version by 1"

  # ---------------------------------------------------------------------------
  - entity: SellerStatement
    field: status
    initial_state: PENDING
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /seller-statements/{id}/disburse"
        actor: FinanceOfficer
        preconditions:
          - "SellerStatement.status == PENDING"
        side_effects:
          - "creates a Payout (status DISBURSED) for this statement; increments SellerStatement.version by 1"
        note: "Same action that advances Lot.settlement_status STATEMENTED -> SETTLED."

      - from: PENDING
        to: REVERSED
        trigger: "system (Lot sale reversal via POST /lots/{id}/reverse-sale; only valid before disbursement)"
        actor: FinanceOfficer
        preconditions:
          - "SellerStatement.status == PENDING"
        side_effects:
          - "increments SellerStatement.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — true CREATE-with-supersede races, OCC on parent.version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: knockdown-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /lots/{id}/knock-down"
    occ_field: "expected_lot_version"
    description: |
      Knocking down a Lot whose version has advanced since the client last
      observed it is rejected. Captures the case where another bid was
      accepted on the lot (raising the standing high and bumping the lot's
      version) after the auctioneer read the lot, so the auctioneer's view of
      the winning amount is stale and the knock-down would record an
      out-of-date hammer.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /lots/{id}/invoice"
    occ_field: "expected_lot_version"
    description: |
      Creating an Invoice for a Lot whose version has advanced since the
      client last observed it is rejected. Captures the case where the lot's
      settlement dimension already moved (an Invoice was already created,
      which legitimately supersedes a second invoice attempt) and the current
      writer's view of the lot is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (1) Buyer's premium: tiered MARGINAL pricing, round once on total ------
  - name: buyers_premium
    trigger: "POST /lots/{id}/invoice (Lot settlement_status NONE -> INVOICED)"
    algorithm: tiered_pricing
    formula: |
      Let H = Invoice.hammer_price_cents (= Lot.hammer_price_cents snapshot).
      Let tiers = PremiumSchedule.tiers (the schedule referenced by the lot's
      AuctionSale.buyers_premium_schedule_id), ascending by upper_bound_cents,
      open top tier last (upper_bound_cents == null).
      MARGINAL application: each tier's rate applies only to the slice of H
      that falls within that tier's band.
        remaining = H
        prev_bound = 0
        premium_exact = 0.0   # accumulate as an EXACT rational, do NOT round per tier
        for tier in tiers:
          band_top = tier.upper_bound_cents if tier.upper_bound_cents is not None else H
          slice = max(0, min(H, band_top) - prev_bound)
          premium_exact += slice * tier.rate_bps / 10000   # keep full precision
          prev_bound = band_top
          if H <= band_top: break
        buyers_premium_cents = round_half_up(premium_exact)   # ROUND ONCE, on the summed total
      total_due_cents = H + buyers_premium_cents
    input_set: "Single Lot's hammer snapshot against its sale's PremiumSchedule tiers."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; sum exact rational slices then round ONCE on the total (NOT per tier)"
    note: |
      Combinatorial mode (b): rounding order is pinned. 'round per tier then sum'
      and 'sum then round' diverge by a cent at tier boundaries; this scaffold
      pins 'sum-exact-then-round-once'.

  # --- (2) Droit de suite resale royalty: tiered, capped, eligibility-gated ---
  - name: resale_royalty_due
    trigger: "POST /lots/{id}/invoice when Lot.artist_alive == true (creates ResaleRoyalty)"
    algorithm: tiered_pricing
    formula: |
      Let H = Lot.hammer_price_cents (royalty base is the HAMMER, not total_due).
      Eligibility: royalty applies only if Lot.artist_alive == true AND
        H >= ROYALTY_FLOOR_CENTS. If not eligible, royalty_cents = 0 and no
        ResaleRoyalty row is created.
      Marginal tier rates on H (each rate applies to the slice in its band):
        band 0 .. 50000_00          -> 400 bps (4.00%)
        band 50000_00 .. 200000_00  -> 300 bps (3.00%)
        band 200000_00 .. 350000_00 -> 100 bps (1.00%)
        band 350000_00 .. 500000_00 -> 50  bps (0.50%)
        band above 500000_00        -> 25  bps (0.25%)
      Compute the marginal sum as an EXACT rational across bands, then
      round_half_up ONCE to integer cents -> royalty_raw_cents.
      CAP: royalty_cents = min(royalty_raw_cents, ROYALTY_CAP_CENTS).
    input_set: "Single SOLD royalty-eligible Lot's hammer."
    constants:
      ROYALTY_FLOOR_CENTS: 100000      # 1,000.00 — below this, no royalty
      ROYALTY_CAP_CENTS: 1250000       # 12,500.00 — absolute per-lot cap
      BAND_1_TOP_CENTS: 5000000        # 50,000.00
      BAND_2_TOP_CENTS: 20000000       # 200,000.00
      BAND_3_TOP_CENTS: 35000000       # 350,000.00
      BAND_4_TOP_CENTS: 50000000       # 500,000.00
      RATE_1_BPS: 400
      RATE_2_BPS: 300
      RATE_3_BPS: 100
      RATE_4_BPS: 50
      RATE_5_BPS: 25
      ROUNDING: round_half_up
    precision: "integer cents; marginal sum exact then round ONCE, then apply cap"
    note: |
      Combinatorial mode (a): >=3 inputs (hammer, eligibility flag, 5-tier
      schedule) with non-linear interaction (marginal tiers + min() cap +
      eligibility branch). Distinct entity domain (artist royalty on Lot)
      from buyers_premium (buyer charge on Invoice).

  # --- (3) Seller net payable: circular-looking fee/withholding evaluation ----
  - name: seller_net_payable
    trigger: "POST /lots/{id}/statement (Lot settlement_status INVOICED -> STATEMENTED)"
    algorithm: aggregation
    formula: |
      Let H = SellerStatement.hammer_price_cents (= Lot.hammer snapshot).
      EVALUATION ORDER IS PINNED (do not reorder):
        step 1: seller_commission_cents = round_half_up(H * Consignment.seller_commission_bps / 10000)
        step 2: resale_royalty_withheld_cents =
                  (the lot's ResaleRoyalty.royalty_cents if a ResaleRoyalty row
                   exists for the lot with bearer == SELLER and status != REVERSED,
                   else 0)
        step 3: net_payable_cents = H - seller_commission_cents - resale_royalty_withheld_cents
      net_payable_cents MUST be >= 0; the scaffold guarantees this because
      commission_bps <= 5000 and the royalty schedule + cap keep
      (commission + royalty) < H for any H >= ROYALTY_FLOOR_CENTS.
    input_set: "Single lot's hammer, its consignment commission, and its accrued seller-borne royalty."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; commission rounded once at step 1; royalty already rounded at accrual"
    note: |
      Combinatorial mode (c): the net depends on the royalty, which depends on
      the hammer and the per-tier schedule; the evaluation order (commission,
      then royalty withholding read, then subtract) is pinned so net is
      well-defined. Distinct entity domain (seller payout) from buyers_premium.

  # --- (4) Minimum next bid: increment-banded threshold -----------------------
  - name: min_next_bid
    trigger: "POST /lots/{id}/bids (validating the incoming bid amount)"
    algorithm: threshold
    formula: |
      Let S = the standing-high amount = max amount_cents over Bids on the lot
        with status IN {ACCEPTED, WINNING}; if none, S = 0.
      The required minimum increment depends on the band S falls in:
        S in [0, 100000)        -> increment 5000      # under 1,000.00 -> +50.00
        S in [100000, 500000)   -> increment 10000     # 1,000..5,000  -> +100.00
        S in [500000, 2000000)  -> increment 25000     # 5,000..20,000 -> +250.00
        S >= 2000000            -> increment 100000     # 20,000+       -> +1,000.00
      min_next_bid_cents = (reserve_floor if S == 0 else S + increment_for_band(S))
        where reserve_floor = max(STARTING_BID_FLOOR_CENTS, increment_for_band(0))
        i.e. the first bid must be >= STARTING_BID_FLOOR_CENTS.
      A bid is ACCEPTED only if amount_cents >= min_next_bid_cents.
    input_set: "All non-RETRACTED Bids on the lot."
    constants:
      STARTING_BID_FLOOR_CENTS: 5000   # 50.00 minimum opening bid
      BAND_1_TOP_CENTS: 100000
      BAND_2_TOP_CENTS: 500000
      BAND_3_TOP_CENTS: 2000000
      INC_1_CENTS: 5000
      INC_2_CENTS: 10000
      INC_3_CENTS: 25000
      INC_4_CENTS: 100000
    precision: "integer cents; band selection uses half-open [lo, hi) intervals (>= lo and < hi)"
    note: "Boundary precision: band edges use >= lo and < hi; exactly-at-edge (e.g. S==100000) selects the upper band."

  # --- (5) Standing high bid: chronological tie-break -------------------------
  - name: standing_high_bid
    trigger: "knock-down, and on every new bid (to recompute min_next_bid)"
    algorithm: chronological
    formula: |
      Among Bids on the lot with status IN {ACCEPTED} (RETRACTED excluded;
      a prior WINNING bid only exists post-knock-down), the standing-high bid
      is the one with the greatest amount_cents. If two ACCEPTED bids tie on
      amount_cents (only reachable via retraction/re-bid edge cases), break
      the tie by EARLIEST created_at (ASC); never by id.
    input_set: "ACCEPTED Bids on a single lot."
    constants: {}
    precision: "exact integer compare; tie-break created_at ASC"
    note: "No random id in tie-break; created_at ASC is the sole fallback."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles acting on an owned resource, X-User-ID equals the resource's owning FK (Seller on its consignments; Bidder on its paddle registrations/bids)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Seller- and Bidder-scoped mutations"

  - priority: 4
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 5
    category: existence
    check: "All body FK references resolve to existing resources"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "endpoints with FK fields in body"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers >= 0 where required, types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: business_constraint
    check: "Pagination query params in range: limit in 1..100, offset >= 0"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 400
    applies_to: all list endpoints

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition (single-entity precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "Cross-entity state guard holds: Lot.open requires AuctionSale LIVE; Lot.invoice requires AuctionSale CLOSED; Lot.statement requires Invoice PAID; Bid requires AuctionSale LIVE and Lot OPEN"
    error_id: ERR_DEPENDENCY_NOT_READY
    http_status: 409
    applies_to: "POST /lots/{id}/open, /knock-down, /invoice, /statement, POST /lots/{id}/bids"

  - priority: 9
    category: concurrency
    check: "expected_<parent>_version matches the parent's current version on OCC-guarded writes (knock-down, invoice)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lots/{id}/knock-down, POST /lots/{id}/invoice"

  - priority: 10
    category: business_safety
    check: "Suspended bidder / revoked paddle may not register, bid, or win; paddle and bid channel must match the registration_type"
    error_id: ERR_PADDLE_INELIGIBLE
    http_status: 409
    applies_to: "POST /paddle-registrations, POST /lots/{id}/bids"

  - priority: 11
    category: business_constraint
    check: "Estimate ordering (low <= high), reserve <= low_estimate, and ABSENTEE registration carries max_absentee_bid_cents > 0 (0 for FLOOR/PHONE)"
    error_id: ERR_INVALID_LOT_TERMS
    http_status: 422
    applies_to: "POST /auction-sales/{id}/lots, POST /paddle-registrations"

  - priority: 12
    category: business_temporal
    check: "Bid amount meets the minimum next bid for the lot's standing-high band (min_next_bid calc); first bid >= STARTING_BID_FLOOR_CENTS"
    error_id: ERR_BID_TOO_LOW
    http_status: 409
    applies_to: "POST /lots/{id}/bids"

  - priority: 13
    category: business_constraint
    check: "lot_number is unique among non-WITHDRAWN lots in the same auction_sale_id; paddle bidder is not already registered for that sale"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /auction-sales/{id}/lots, POST /paddle-registrations"

  - priority: 14
    category: business_fiscal
    check: "A bid (and any resulting winning total) would not push the bidder's outstanding_balance_cents + this lot's projected total_due over credit_limit_cents; payment amount_cents > 0 and does not exceed remaining due"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /lots/{id}/bids, POST /invoices/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Premium schedules ------------------------------------------------------
  - method: POST
    path: "/premium-schedules"
    description: "Create a tiered buyer's-premium schedule"
    roles: [SaleAdministrator]
    code: 201
    input: [name, tiers]
    output: PremiumSchedule
    side_effects: []

  - method: GET
    path: "/premium-schedules/{id}"
    description: "Read a premium schedule"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Viewer]
    code: 200
    input: []
    output: PremiumSchedule
    side_effects: []

  # --- Sellers ----------------------------------------------------------------
  - method: POST
    path: "/sellers"
    description: "Register a consignor"
    roles: [SaleAdministrator]
    code: 201
    input: [legal_name, email, country_code, payout_iban]
    output: Seller
    side_effects: []

  - method: GET
    path: "/sellers/{id}"
    description: "Read a seller"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: []
    output: Seller
    side_effects: []

  # --- Bidders ----------------------------------------------------------------
  - method: POST
    path: "/bidders"
    description: "Register a bidder"
    roles: [SaleAdministrator]
    code: 201
    input: [legal_name, email, country_code, "credit_limit_cents?"]
    output: Bidder
    side_effects: ["status=ACTIVE", "outstanding_balance_cents=0"]

  - method: GET
    path: "/bidders/{id}"
    description: "Read a bidder (includes computed outstanding_balance_cents)"
    roles: [SaleAdministrator, FinanceOfficer, Bidder, Viewer]
    code: 200
    input: []
    output: Bidder
    side_effects: []

  - method: PATCH
    path: "/bidders/{id}"
    description: "Adjust a bidder's credit limit or suspend/reactivate"
    roles: [SaleAdministrator]
    code: 200
    input: ["credit_limit_cents?", "status?", expected_bidder_version]
    output: Bidder
    side_effects: ["increments Bidder.version by 1"]

  - method: GET
    path: "/bidders/{id}/invoices"
    description: "List a bidder's invoices (reverse-reachability for Invoice.bidder_id)"
    roles: [SaleAdministrator, FinanceOfficer, Bidder, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/bidders/{id}/paddle-registrations"
    description: "List a bidder's paddle registrations (reverse-reachability for PaddleRegistration.bidder_id)"
    roles: [SaleAdministrator, FinanceOfficer, Bidder, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: PaddleRegistration[]
    side_effects: []

  # --- Consignments -----------------------------------------------------------
  - method: POST
    path: "/consignments"
    description: "Create a consignment agreement (DRAFT)"
    roles: [SaleAdministrator]
    code: 201
    input: [seller_id, seller_commission_bps, "unsold_fee_cents?"]
    output: Consignment
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/consignments/{id}"
    description: "Read a consignment"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: []
    output: Consignment
    side_effects: []

  - method: GET
    path: "/consignments"
    description: "List consignments, filterable by seller_id (reverse-reachability for Consignment.seller_id)"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: ["seller_id?", "limit?", "offset?"]
    output: Consignment[]
    side_effects: []

  - method: POST
    path: "/consignments/{id}/activate"
    description: "Countersign a consignment (DRAFT -> ACTIVE)"
    roles: [SaleAdministrator]
    code: 200
    input: [expected_consignment_version]
    output: Consignment
    side_effects: ["status -> ACTIVE", "increments Consignment.version by 1"]

  - method: POST
    path: "/consignments/{id}/revert-to-draft"
    description: "Revert an ACTIVE consignment to DRAFT for amendment"
    roles: [SaleAdministrator]
    code: 200
    input: [expected_consignment_version]
    output: Consignment
    side_effects: ["status -> DRAFT", "increments Consignment.version by 1"]

  - method: POST
    path: "/consignments/{id}/terminate"
    description: "Terminate a consignment; cascades CATALOGED lots to WITHDRAWN"
    roles: [SaleAdministrator]
    code: 200
    input: [expected_consignment_version]
    output: Consignment
    side_effects:
      - "status -> TERMINATED"
      - "every CATALOGED Lot with consignment_id == this consignment -> WITHDRAWN (each lot version +1; lot_counts recomputed)"
      - "increments Consignment.version by 1"

  # --- Auction sales ----------------------------------------------------------
  - method: POST
    path: "/auction-sales"
    description: "Create an auction sale (CATALOGING)"
    roles: [SaleAdministrator]
    code: 201
    input: [title, sale_date_utc, currency, buyers_premium_schedule_id]
    output: AuctionSale
    side_effects: ["status=CATALOGING", "lot_count=0"]

  - method: GET
    path: "/auction-sales/{id}"
    description: "Read an auction sale"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Seller, Bidder, Viewer]
    code: 200
    input: []
    output: AuctionSale
    side_effects: []

  - method: GET
    path: "/auction-sales"
    description: "List auction sales, filterable by buyers_premium_schedule_id (reverse-reachability for AuctionSale.buyers_premium_schedule_id)"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Viewer]
    code: 200
    input: ["buyers_premium_schedule_id?", "limit?", "offset?"]
    output: AuctionSale[]
    side_effects: []

  - method: POST
    path: "/auction-sales/{id}/publish"
    description: "Publish the catalog (CATALOGING -> PUBLISHED)"
    roles: [SaleAdministrator]
    code: 200
    input: [expected_auction_sale_version]
    output: AuctionSale
    side_effects: ["status -> PUBLISHED", "increments AuctionSale.version by 1"]

  - method: POST
    path: "/auction-sales/{id}/open-bidding"
    description: "Go live (PUBLISHED -> LIVE); cascades CATALOGED lots to OPEN"
    roles: [Auctioneer]
    code: 200
    input: [expected_auction_sale_version]
    output: AuctionSale
    side_effects:
      - "status -> LIVE"
      - "every CATALOGED Lot in this sale -> OPEN (each lot version +1)"
      - "increments AuctionSale.version by 1"

  - method: POST
    path: "/auction-sales/{id}/close"
    description: "Close the sale (LIVE -> CLOSED); requires no OPEN lots remain"
    roles: [Auctioneer]
    code: 200
    input: [expected_auction_sale_version]
    output: AuctionSale
    side_effects: ["status -> CLOSED", "increments AuctionSale.version by 1"]

  # --- Lots (nested under the sale) -------------------------------------------
  - method: POST
    path: "/auction-sales/{id}/lots"
    description: "Catalog a lot in a sale"
    roles: [SaleAdministrator]
    code: 201
    input: [consignment_id, lot_number, title, artist_name, artist_alive, low_estimate_cents, high_estimate_cents, reserve_cents]
    output: Lot
    side_effects:
      - "sale_status=CATALOGED, settlement_status=NONE"
      - "recomputes the sale's lot_count and the consignment's lot_count"

  - method: GET
    path: "/lots/{id}"
    description: "Read a lot (both state dimensions, hammer, winning paddle)"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Seller, Bidder, Viewer]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/auction-sales/{id}/lots"
    description: "List lots in a sale (reverse-reachability for Lot.auction_sale_id)"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Seller, Bidder, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots, filterable by consignment_id (reverse-reachability for Lot.consignment_id)"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: ["consignment_id?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/lots/{id}/withdraw"
    description: "Withdraw a CATALOGED lot"
    roles: [SaleAdministrator]
    code: 200
    input: [expected_lot_version]
    output: Lot
    side_effects: ["sale_status -> WITHDRAWN", "lot_counts recomputed", "increments Lot.version by 1"]

  - method: POST
    path: "/lots/{id}/open"
    description: "Open a single CATALOGED lot for bidding while sale is LIVE"
    roles: [Auctioneer]
    code: 200
    input: [expected_lot_version]
    output: Lot
    side_effects: ["sale_status -> OPEN", "increments Lot.version by 1"]

  - method: POST
    path: "/lots/{id}/knock-down"
    description: "Knock down an OPEN lot; SOLD if standing-high >= reserve else BOUGHT_IN (OCC-guarded)"
    roles: [Auctioneer]
    code: 200
    input: [expected_lot_version]
    output: Lot
    side_effects:
      - "if standing-high ACCEPTED bid >= reserve: sale_status -> SOLD, hammer set, winning bid -> WINNING, winning_paddle_registration_id set"
      - "else: sale_status -> BOUGHT_IN"
      - "increments Lot.version by 1"

  - method: POST
    path: "/lots/{id}/buy-in"
    description: "Explicitly buy in an OPEN lot (no qualifying bid)"
    roles: [Auctioneer]
    code: 200
    input: [expected_lot_version]
    output: Lot
    side_effects: ["sale_status -> BOUGHT_IN", "increments Lot.version by 1"]

  - method: POST
    path: "/lots/{id}/reverse-sale"
    description: "Reverse a sold lot's financials (compensation): void invoice, reverse royalty, reverse pending statement, roll back settlement_status"
    roles: [FinanceOfficer]
    code: 200
    input: [expected_lot_version]
    output: Lot
    side_effects:
      - "the lot's ISSUED Invoice -> VOID (bidder outstanding_balance decreased by total_due)"
      - "the lot's ACCRUED ResaleRoyalty -> REVERSED"
      - "the lot's PENDING SellerStatement -> REVERSED (if the statement is already PAID/disbursed, the whole reverse-sale is rejected with ERR_STATEMENT_ALREADY_PAID and no side effects fire)"
      - "Lot.settlement_status -> NONE; increments Lot.version by 1"

  # --- Bids (nested under the lot) --------------------------------------------
  - method: POST
    path: "/lots/{id}/bids"
    description: "Place a bid on an OPEN lot"
    roles: [Auctioneer, Bidder]
    code: 201
    input: [paddle_registration_id, amount_cents, "bid_channel?"]
    output: Bid
    side_effects: ["status=ACCEPTED", "recomputes the lot's standing high and min_next_bid", "increments the lot's version by 1 (so the auctioneer's view of the lot goes stale, enabling the knock-down OCC guard)"]

  - method: GET
    path: "/bids/{id}"
    description: "Read a bid"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Bidder, Viewer]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/lots/{id}/bids"
    description: "List bids on a lot (reverse-reachability for Bid.lot_id)"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Bidder, Viewer]
    code: 200
    input: ["paddle_registration_id?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: GET
    path: "/bids"
    description: "List bids, filterable by paddle_registration_id or lot_id (reverse-reachability for Bid.paddle_registration_id)"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Bidder, Viewer]
    code: 200
    input: ["paddle_registration_id?", "lot_id?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: POST
    path: "/bids/{id}/retract"
    description: "Retract an ACCEPTED bid (excluded from standing-high)"
    roles: [Auctioneer]
    code: 200
    input: [expected_bid_version]
    output: Bid
    side_effects: ["status -> RETRACTED", "recomputes the lot's standing high", "increments Bid.version by 1"]

  # --- Paddle registrations ---------------------------------------------------
  - method: POST
    path: "/paddle-registrations"
    description: "Register a paddle for a bidder in a sale (assigns paddle_number)"
    roles: [SaleAdministrator]
    code: 201
    input: [auction_sale_id, bidder_id, "registration_type?", "max_absentee_bid_cents?"]
    output: PaddleRegistration
    side_effects: ["status=ACTIVE", "paddle_number assigned sequentially per sale"]

  - method: GET
    path: "/paddle-registrations/{id}"
    description: "Read a paddle registration"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Bidder, Viewer]
    code: 200
    input: []
    output: PaddleRegistration
    side_effects: []

  - method: GET
    path: "/auction-sales/{id}/paddle-registrations"
    description: "List paddle registrations for a sale (reverse-reachability for PaddleRegistration.auction_sale_id)"
    roles: [SaleAdministrator, FinanceOfficer, Auctioneer, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: PaddleRegistration[]
    side_effects: []

  - method: POST
    path: "/paddle-registrations/{id}/revoke"
    description: "Revoke a paddle registration"
    roles: [SaleAdministrator]
    code: 200
    input: [expected_paddle_registration_version]
    output: PaddleRegistration
    side_effects: ["status -> REVOKED", "increments PaddleRegistration.version by 1"]

  # --- Settlement: invoice / statement / payout -------------------------------
  - method: POST
    path: "/lots/{id}/invoice"
    description: "Issue the buyer invoice for a SOLD lot (OCC-guarded); accrues royalty if eligible"
    roles: [FinanceOfficer]
    code: 201
    input: [expected_lot_version]
    output: Invoice
    side_effects:
      - "creates Invoice (ISSUED): buyers_premium_cents, total_due_cents computed"
      - "increases winning bidder's outstanding_balance_cents by total_due_cents"
      - "if artist_alive: creates ResaleRoyalty (ACCRUED)"
      - "Lot.settlement_status -> INVOICED; increments Lot.version by 1"

  - method: GET
    path: "/invoices/{id}"
    description: "Read an invoice"
    roles: [SaleAdministrator, FinanceOfficer, Bidder, Viewer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/lots/{id}/invoices"
    description: "List a lot's invoices (reverse-reachability for Invoice.lot_id)"
    roles: [SaleAdministrator, FinanceOfficer, Bidder, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/payments"
    description: "Record a cash payment against an invoice"
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents, expected_invoice_version]
    output: Invoice
    side_effects:
      - "increases amount_paid_cents"
      - "when fully paid: status -> PAID, bidder outstanding_balance decreased by total_due"
      - "increments Invoice.version by 1"

  - method: POST
    path: "/lots/{id}/statement"
    description: "Generate the seller statement for a fully-paid lot (INVOICED -> STATEMENTED)"
    roles: [FinanceOfficer]
    code: 201
    input: [expected_lot_version]
    output: SellerStatement
    side_effects:
      - "creates SellerStatement (PENDING): seller_commission_cents, resale_royalty_withheld_cents, net_payable_cents computed"
      - "Lot.settlement_status -> STATEMENTED; increments Lot.version by 1"

  - method: GET
    path: "/seller-statements/{id}"
    description: "Read a seller statement"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: []
    output: SellerStatement
    side_effects: []

  - method: GET
    path: "/lots/{id}/seller-statements"
    description: "List a lot's seller statements (reverse-reachability for SellerStatement.lot_id)"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: SellerStatement[]
    side_effects: []

  - method: GET
    path: "/consignments/{id}/seller-statements"
    description: "List statements under a consignment (reverse-reachability for SellerStatement.consignment_id)"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: SellerStatement[]
    side_effects: []

  - method: POST
    path: "/seller-statements/{id}/disburse"
    description: "Disburse a PENDING statement: create Payout, remit royalty, settle lot (STATEMENTED -> SETTLED)"
    roles: [FinanceOfficer]
    code: 201
    input: [expected_seller_statement_version]
    output: Payout
    side_effects:
      - "creates Payout (DISBURSED) with amount = net_payable_cents"
      - "SellerStatement.status -> PAID"
      - "if ResaleRoyalty ACCRUED: -> REMITTED"
      - "Lot.settlement_status -> SETTLED; increments SellerStatement.version by 1 and Lot.version by 1"

  - method: GET
    path: "/payouts/{id}"
    description: "Read a payout"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/seller-statements/{id}/payouts"
    description: "List payouts for a statement (reverse-reachability for Payout.seller_statement_id)"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payout[]
    side_effects: []

  - method: GET
    path: "/lots/{id}/resale-royalties"
    description: "List a lot's resale royalties (reverse-reachability for ResaleRoyalty.lot_id)"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: ResaleRoyalty[]
    side_effects: []

  - method: GET
    path: "/resale-royalties/{id}"
    description: "Read a resale royalty"
    roles: [SaleAdministrator, FinanceOfficer, Seller, Viewer]
    code: 200
    input: []
    output: ResaleRoyalty
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed role (Seller/Bidder) acting on a resource it does not own (X-User-ID mismatch)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "A body FK reference (seller_id, consignment_id, bidder_id, paddle_registration_id, auction_sale_id, buyers_premium_schedule_id, seller_statement_id) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum value, negative integer where non-negative required, wrong type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition (single-entity precondition)" }
  - { id: ERR_DEPENDENCY_NOT_READY, http: 409, condition: "Cross-entity guard failed: sale not LIVE for open/bid, sale not CLOSED for invoice, invoice not PAID for statement, lot not OPEN for bid" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }
  - { id: ERR_PADDLE_INELIGIBLE, http: 409, condition: "Suspended bidder or revoked paddle attempting to register/bid/win, or bid_channel inconsistent with registration_type" }
  - { id: ERR_INVALID_LOT_TERMS, http: 422, condition: "Estimate/reserve ordering violated (low>high, reserve>low_estimate) or absentee max bid rule violated" }
  - { id: ERR_BID_TOO_LOW, http: 409, condition: "Bid amount below the lot's minimum next bid for its standing-high band, or below the opening floor" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Duplicate lot_number in a sale, or bidder already has a paddle for the sale" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "Bid/win would exceed the bidder's credit limit, or payment amount invalid (<=0 or exceeds remaining due)" }
  - { id: ERR_SALE_NOT_EMPTY_OF_OPEN_LOTS, http: 409, condition: "Closing a sale while at least one lot is still OPEN" }
  - { id: ERR_LOTS_REQUIRED, http: 409, condition: "Publishing a sale with no non-WITHDRAWN lots" }
  - { id: ERR_STATEMENT_ALREADY_PAID, http: 409, condition: "Reversing a lot whose seller statement has already been disbursed (PAID)" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of range (limit 1..100, offset >= 0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SaleAdministrator
    description: "House operations: schedules, premium schedules, sellers, bidders, consignments, lot cataloging, paddle registration"
    identity: opaque
    exclusive_operations:
      - "POST /premium-schedules"
      - "POST /sellers"
      - "POST /bidders"
      - "PATCH /bidders/{id}"
      - "POST /consignments"
      - "POST /consignments/{id}/activate"
      - "POST /consignments/{id}/revert-to-draft"
      - "POST /consignments/{id}/terminate"
      - "POST /auction-sales"
      - "POST /auction-sales/{id}/publish"
      - "POST /auction-sales/{id}/lots"
      - "POST /lots/{id}/withdraw"
      - "POST /paddle-registrations"
      - "POST /paddle-registrations/{id}/revoke"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Auctioneer
    description: "Runs the live sale: opens bidding, opens/knocks down/buys-in lots, records and retracts bids"
    identity: opaque
    exclusive_operations:
      - "POST /auction-sales/{id}/open-bidding"
      - "POST /auction-sales/{id}/close"
      - "POST /lots/{id}/open"
      - "POST /lots/{id}/knock-down"
      - "POST /lots/{id}/buy-in"
      - "POST /bids/{id}/retract"
    shared_operations:
      - "POST /lots/{id}/bids (also Bidder)"
      - "GET (read endpoints)"

  - name: FinanceOfficer
    description: "Settlement and payout: invoices, payments, statements, disbursements, sale reversal"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{id}/invoice"
      - "POST /invoices/{id}/payments"
      - "POST /lots/{id}/statement"
      - "POST /seller-statements/{id}/disburse"
      - "POST /lots/{id}/reverse-sale"
    shared_operations:
      - "GET (read endpoints)"

  - name: Seller
    description: "Consignor; reads own consignments, lots, statements, payouts"
    identity: "entity_backed:Seller"
    exclusive_operations: []
    shared_operations:
      - "GET /sellers/{id} (own)"
      - "GET /consignments, /consignments/{id} (own)"
      - "GET /lots, /lots/{id} (own consignment's lots)"
      - "GET /lots/{id}/seller-statements, /consignments/{id}/seller-statements"
      - "GET /seller-statements/{id}, /payouts/{id}, /resale-royalties/{id}"

  - name: Bidder
    description: "Registered bidder; places bids and reads own invoices/registrations"
    identity: "entity_backed:Bidder"
    exclusive_operations: []
    shared_operations:
      - "POST /lots/{id}/bids (own paddle; also Auctioneer)"
      - "GET /bidders/{id} (own), /bidders/{id}/invoices, /bidders/{id}/paddle-registrations"
      - "GET /bids/{id}, /invoices/{id}"

  - name: Viewer
    description: "Read-only operational/audit access; opaque, no ownership"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints)"
