          setup:
            - "an APPROVED 100,000,000 cent campaign flighting 2026-11-01 to 2026-12-31 with one 100 percent LINEAR_TV UPFRONT PRIME allocation"
            - "one PUBLISHED avail with exclusivity_mode EXCLUSIVE, 20,000,000 total impressions, covering the whole flight"
            - "two PENDING_PLACEMENT buys on that campaign, each guaranteeing 3,000,000 impressions at CPM 2000"
            - "buy A already holds one unit line airing 2026-11-01T00:00:00Z to 2026-11-20T00:00:00Z"
