          - endpoints.POST /tennis/strikes
          - validations.priority_69_ERR_ROSTER_QUOTA_NOT_MET
        distinguishing_aspect: "The chain is order-sensitive rather than merely long: Player.strike_count must be recomputed before the status threshold is evaluated, the status must flip before the ACTIVE spots are demoted, and the spots must be demoted before the team recomputes active_roster_size and roster_compliant — which is what finally makes the league's start-play quota unsatisfiable. Any implementation that recomputes the team from a cached roster, or evaluates the threshold before summing the ledger, leaves roster_compliant true on a team with one active player."
