  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_calendar_half_open_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the inspector-calendar resource (spans holdbacks):
          [10:00,11:00) and [11:00,12:00) for insp_1 are adjacent and coexist; [10:30,11:30)
          collides. Distinct resource axis (inspector schedule, cross-holdback) and distinct
          interval geometry (half-open, adjacency permitted) from
          property_slot_closed_interval_overlap.
        test_recipe:
          setup:
            - "Two ACTIVE holdbacks A and B (separate files)"
            - "insp_1 already has PLANNED inspection on A at [2026-08-20T10:00Z, 2026-08-20T11:00Z)"
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
            - call: "POST /escrow/files"
              payload: { property_address: "1 Harbor Way", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
