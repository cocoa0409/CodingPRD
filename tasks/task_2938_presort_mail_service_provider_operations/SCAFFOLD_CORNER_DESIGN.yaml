              captures: { cont_id: $.data.id, cont_status: $.data.status }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T08:00:00.000Z", window_end_utc: "2026-08-12T16:00:00.000Z", pallet_count: 2 }
              as: PresortOperator
              captures: { ship_id: $.data.id, ship_status: $.data.status }
          assert:
            - "${cl_status} == ACTIVE, ${pa_status} == ACTIVE, ${fac_status} == OPEN"
