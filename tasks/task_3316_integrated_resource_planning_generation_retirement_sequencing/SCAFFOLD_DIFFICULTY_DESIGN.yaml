              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
            - call: "POST /candidates"
              payload: { candidate_name: "K-GATE", resource_type: "SOLAR", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 900, fixed_om_usd_per_kw_year: 10, fuel_type: "SUN", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /plans/${plan_id}/procurement-commitments"
              payload: { candidate_id: "${cand_id}", committed_mw: 50, solicitation_type: "RFP" }
