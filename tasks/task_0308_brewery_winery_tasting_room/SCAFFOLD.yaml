# =============================================================================
# Brewery / Winery Tasting Room & Club — PRD Benchmark Scaffold (Expert)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
#
# Topology: FLAT. Every entity is a top-level collection ( /wineries, /batches,
# /products, /releases, /members, /memberships, /shipments, /tasting-orders,
# /reservations, /distribution-orders, /ledger-entries ). Relationships are
# expressed as body foreign keys, not URL nesting. api_prefix is "/" so the
# FK reverse-reachability audit resolves each collection segment.
# =============================================================================

scenario: |
  308. Brewery / Winery Tasting Room & Club: production batch & inventory (TTB),
  tasting-room POS & flights, club membership & recurring shipment, compliance
  (age/state shipping limits), reservation/event, allocation/release, loyalty,
  self-distribution

domain_name: brewery-winery-tasting-room
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers       # state shipping volume limits, club tier breaks, excise ABV tiers
    - cascading_side_effects        # bottling debits batch -> mints product inventory -> books premises excise -> ledger
    - derived_field_reconciliation  # TTB tax-class balances, product on_hand vs allocated, winery loyalty liability
    - optimistic_concurrency        # OCC on Product.version, AllocationRelease.version, Winery.version

  entity_topology: flat
  # Eleven peer collections joined by body foreign keys. No nested URLs.
  # Cross-aggregate FKs: Shipment->AllocationRelease, Shipment->Membership,
  # DistributionOrder->Product, TastingOrder->Member, Product->ProductionBatch.

  state_machine_shape: branching
  # ProductionBatch forks FERMENTING -> {AGING, DUMPED}; Shipment branches
  # SCHEDULED -> {RELEASED, HELD}; Reservation reverts CONFIRMED -> NO_SHOW
  # (frees the table interval); Membership status is parallel to billing_status.

  relationship_patterns:
    - one_to_many        # Winery 1:N everything; Product 1:N AllocationRelease; Membership 1:N Shipment
    - cross_aggregate    # Shipment -> AllocationRelease; DistributionOrder -> Product; TastingOrder -> Member
    - polymorphic        # ComplianceLedgerEntry.subject_type selects batch|shipment|distribution|tasting

  role_model: peer_roles
  # ComplianceOfficer owns TTB/premises/ledger/distribution; CellarManager owns
  # batches/products/releases; ClubManager owns members/memberships/shipments;
  # TastingRoomStaff owns POS orders & reservations; Member self-serves its account.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Winery: bonded premises / TTB accounting root ---------------------------
  - name: Winery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal/trade name of the bonded winery or brewery" }
      - { name: ttb_permit_number, type: string, source: input, description: "TTB basic permit number (unique across wineries)" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter state where the premises is licensed (e.g. CA, NY)" }
      - { name: bulk_volume_gallons, type: number, source: computed, description: "Untaxpaid bulk gallons on hand = SUM over batches in {FERMENTING, AGING, BOTTLING} of (volume_in_gallons - loss_gallons - bottled_volume_gallons)", default: 0 }
      - { name: bottled_taxpaid_volume_gallons, type: number, source: computed, description: "Cumulative taxpaid gallons removed via bottling runs", default: 0 }
      - { name: excise_tax_owed_cents, type: integer, source: computed, description: "Cumulative excise accrued on taxable removals, in cents", default: 0 }
      - { name: loyalty_point_liability, type: integer, source: computed, description: "= SUM over all this winery's Memberships of loyalty_points (unredeemed)", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED blocks all taxable removals (bottling, shipment release, distribution ship)", default: ACTIVE, constraints: "ACTIVE, SUSPENDED" }

  # --- ProductionBatch: TTB production record ----------------------------------
  - name: ProductionBatch
    parent: Winery
    common_fields: true
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning bonded premises" }
      - { name: lot_code, type: string, source: input, description: "Human lot code (unique per winery)" }
      - { name: beverage_class, type: enum, source: input, description: "WINE | BEER | CIDER — selects the excise rate class", constraints: "WINE, BEER, CIDER" }
      - { name: volume_in_gallons, type: number, source: input, description: "Gallons charged into the batch at start" }
      - { name: loss_gallons, type: number, source: computed, description: "Cumulative fermentation/racking loss; bounded 0..volume_in_gallons", default: 0 }
      - { name: bottled_volume_gallons, type: number, source: computed, description: "Gallons removed from this batch via bottling runs", default: 0 }
      - { name: available_bulk_gallons, type: number, source: computed, description: "= volume_in_gallons - loss_gallons - bottled_volume_gallons; never negative", default: 0 }
      - { name: abv_percent, type: number, source: input, description: "Alcohol by volume percent; drives excise rate tier for WINE" }
      - { name: status, type: enum, source: system, description: "FERMENTING -> AGING -> BOTTLING -> CLOSED; FERMENTING -> DUMPED (terminal)", default: FERMENTING, constraints: "FERMENTING, AGING, BOTTLING, CLOSED, DUMPED" }

  # --- Product: a finished SKU/vintage with inventory --------------------------
  - name: Product
    parent: Winery
    common_fields: true
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning bonded premises" }
      - { name: source_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch this SKU is bottled from" }
      - { name: sku, type: string, source: input, description: "Stock-keeping code (unique per winery)" }
      - { name: vintage_year, type: integer, source: input, description: "Vintage/production year" }
      - { name: bottle_volume_ml, type: integer, source: input, description: "Per-bottle fill volume in milliliters (e.g. 750)" }
      - { name: list_price_cents, type: integer, source: input, description: "Retail tasting-room price per bottle, in cents" }
      - { name: is_age_restricted, type: boolean, source: input, description: "True for alcoholic SKUs; gates POS/shipment age checks", default: true }
      - { name: on_hand_bottles, type: integer, source: computed, description: "Bottles physically in inventory: minted by bottling, removed by shipment release / POS sale / distribution ship", default: 0 }
      - { name: allocated_bottles, type: integer, source: computed, description: "Bottles tied up in OPEN AllocationReleases (reserved + committed) not yet shipped out", default: 0 }
      - { name: free_bottles, type: integer, source: computed, description: "= on_hand_bottles - allocated_bottles; bottles sellable outside any allocation", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> DISCONTINUED; ACTIVE required for POS/shipment/distribution", default: DRAFT, constraints: "DRAFT, ACTIVE, DISCONTINUED" }

  # --- AllocationRelease: a finite club/library release window -----------------
  - name: AllocationRelease
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; SKU being released" }
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; denormalized owning premises" }
      - { name: pool_bottles, type: integer, source: input, description: "Total bottles set aside for this release" }
      - { name: per_member_cap, type: integer, source: input, description: "Max bottles any single Membership may claim from this release" }
      - { name: reserved_bottles, type: integer, source: computed, description: "Bottles reserved by SCHEDULED/HELD shipments drawing on this release", default: 0 }
      - { name: committed_bottles, type: integer, source: computed, description: "Bottles committed by RELEASED/DELIVERED shipments from this release", default: 0 }
      - { name: available_bottles, type: integer, source: computed, description: "= pool_bottles - reserved_bottles - committed_bottles; never negative", default: 0 }
      - { name: opens_at, type: datetime, source: input, description: "UTC instant the release window opens (claims allowed at/after, inclusive)" }
      - { name: closes_at, type: datetime, source: input, description: "UTC instant the release window closes (claims allowed strictly before, exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> CLOSED; OPEN required to reserve; CLOSED frees residual pool", default: DRAFT, constraints: "DRAFT, OPEN, CLOSED" }

  # --- Member: a club member / customer of record ------------------------------
  - name: Member
    parent: Winery
    common_fields: true
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning premises" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Member email (unique per winery)" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (UTC midnight); drives the 21-years age gate" }
      - { name: ship_to_state_code, type: string, source: input, description: "Two-letter destination state for club shipments; drives state shipping limits" }
      - { name: status, type: enum, source: system, description: "PROSPECT -> ACTIVE -> SUSPENDED -> CLOSED; ACTIVE required to enroll a Membership", default: PROSPECT, constraints: "PROSPECT, ACTIVE, SUSPENDED, CLOSED" }

  # --- Membership: club enrollment, billing, loyalty ---------------------------
  - name: Membership
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the enrolled member" }
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; denormalized owning premises" }
      - { name: tier, type: enum, source: input, description: "SILVER | GOLD | PLATINUM — drives club discount and loyalty multiplier", constraints: "SILVER, GOLD, PLATINUM" }
      - { name: cadence_months, type: integer, source: input, description: "Recurring shipment cadence in months (e.g. 3 = quarterly)" }
      - { name: bottles_per_shipment, type: integer, source: input, description: "Target bottle count per recurring shipment" }
      - { name: billing_status, type: enum, source: system, description: "CURRENT | PAST_DUE — parallel dimension to status; PAST_DUE blocks shipment release", default: CURRENT, constraints: "CURRENT, PAST_DUE" }
      - { name: loyalty_points, type: integer, source: computed, description: "Unredeemed loyalty points accrued from POS orders and shipments", default: 0 }
      - { name: lifetime_bottles_shipped, type: integer, source: computed, description: "Cumulative bottles successfully shipped to this membership", default: 0 }
      - { name: status, type: enum, source: system, description: "ENROLLED -> ACTIVE -> PAUSED -> CANCELLED; ACTIVE required to schedule shipments", default: ENROLLED, constraints: "ENROLLED, ACTIVE, PAUSED, CANCELLED" }

  # --- Shipment: one recurring club shipment instance --------------------------
  - name: Shipment
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; owning club enrollment" }
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; denormalized owning premises" }
      - { name: release_id, type: string, source: input, description: "FK -> AllocationRelease.id; the release this shipment draws bottles from" }
      - { name: requested_bottles, type: integer, source: input, description: "Bottles the member is claiming in this shipment" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Pre-discount price = requested_bottles * product.list_price_cents", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "Club tier discount applied to subtotal (shipment_pricing)", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents", default: 0 }
      - { name: loyalty_points_earned, type: integer, source: computed, description: "Points minted to the membership when this shipment is RELEASED", default: 0 }
      - { name: ship_to_state_code, type: string, source: computed, description: "Snapshot of Member.ship_to_state_code taken at scheduling time" }
      - { name: hold_reason, type: enum, source: system, description: "NONE | AGE | STATE_LIMIT | BILLING | WINERY_SUSPENDED — why a HELD shipment is blocked", default: NONE, constraints: "NONE, AGE, STATE_LIMIT, BILLING, WINERY_SUSPENDED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RELEASED -> DELIVERED; SCHEDULED -> HELD -> {RELEASED, CANCELLED}; SCHEDULED -> CANCELLED", default: SCHEDULED, constraints: "SCHEDULED, HELD, RELEASED, DELIVERED, CANCELLED" }

  # --- TastingOrder: tasting-room POS order ------------------------------------
  - name: TastingOrder
    parent: Winery
    common_fields: true
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning premises" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; optional member for loyalty/discount (omit for walk-in)" }
      - { name: line_items, type: array, source: input, description: "Array of {product_id, kind: FLIGHT|BOTTLE|GLASS, quantity, unit_price_cents?}; BOTTLE lines draw Product free inventory" }
      - { name: guest_age_verified, type: boolean, source: input, description: "Staff attestation that the guest's 21+ ID was checked", default: false }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded extended prices before discount", default: 0 }
      - { name: member_discount_cents, type: integer, source: computed, description: "Tier discount on BOTTLE line subtotal when member attached", default: 0 }
      - { name: loyalty_redeemed_cents, type: integer, source: computed, description: "Value of loyalty points redeemed against this order", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "max(0, subtotal - member_discount - loyalty_redeemed)", default: 0 }
      - { name: loyalty_points_earned, type: integer, source: computed, description: "Points minted to the attached membership on PAID", default: 0 }
      - { name: redeem_points, type: integer, source: input, description: "Points the cashier elects to redeem on this order", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN -> PAID -> REFUNDED; OPEN -> VOID", default: OPEN, constraints: "OPEN, PAID, VOID, REFUNDED" }

  # --- Reservation: tasting-room/event seat reservation ------------------------
  - name: Reservation
    parent: Winery
    common_fields: true
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning premises" }
      - { name: table_code, type: string, source: input, description: "Tasting-room table/resource identifier (e.g. T1, PATIO)" }
      - { name: party_size, type: integer, source: input, description: "Number of guests" }
      - { name: starts_at, type: datetime, source: input, description: "UTC start of the seating window (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "UTC end of the seating window (exclusive)" }
      - { name: is_event, type: boolean, source: input, description: "True for ticketed events (require deposit); false for standard tastings", default: false }
      - { name: deposit_cents, type: integer, source: computed, description: "Events: party_size * EVENT_DEPOSIT_PER_GUEST_CENTS; 0 for non-events", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> SEATED -> COMPLETED; CONFIRMED -> NO_SHOW; REQUESTED/CONFIRMED -> CANCELLED", default: REQUESTED, constraints: "REQUESTED, CONFIRMED, SEATED, NO_SHOW, COMPLETED, CANCELLED" }

  # --- DistributionOrder: self-distribution wholesale order --------------------
  - name: DistributionOrder
    parent: Winery
    common_fields: true
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning premises" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; SKU being self-distributed" }
      - { name: retailer_license_number, type: string, source: input, description: "Destination licensed-retailer permit number" }
      - { name: dest_state_code, type: string, source: input, description: "Two-letter destination state for the wholesale shipment" }
      - { name: case_count, type: integer, source: input, description: "Number of 12-bottle cases ordered" }
      - { name: bottles_ordered, type: integer, source: computed, description: "= case_count * BOTTLES_PER_CASE", default: 0 }
      - { name: wholesale_total_cents, type: integer, source: computed, description: "Wholesale invoice total = wholesale_base + freight (distribution_invoice)", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> SHIPPED -> INVOICED; DRAFT/SUBMITTED -> CANCELLED", default: DRAFT, constraints: "DRAFT, SUBMITTED, SHIPPED, INVOICED, CANCELLED" }

  # --- ComplianceLedgerEntry: append-only TTB/excise/shipping audit log --------
  - name: ComplianceLedgerEntry
    parent: Winery
    common_fields: false   # immutable event: only id + created_at
    fields:
      - { name: winery_id, type: string, source: input, description: "FK -> Winery.id; owning premises" }
      - { name: entry_type, type: enum, source: system, description: "BOTTLING_REMOVAL | EXCISE_ACCRUAL | SHIPMENT_RELEASE | DISTRIBUTION_REMOVAL | AGE_REJECTION | STATE_LIMIT_REJECTION", constraints: "BOTTLING_REMOVAL, EXCISE_ACCRUAL, SHIPMENT_RELEASE, DISTRIBUTION_REMOVAL, AGE_REJECTION, STATE_LIMIT_REJECTION" }
      - { name: subject_type, type: enum, source: system, description: "Polymorphic: PRODUCTION_BATCH | SHIPMENT | DISTRIBUTION_ORDER | TASTING_ORDER", constraints: "PRODUCTION_BATCH, SHIPMENT, DISTRIBUTION_ORDER, TASTING_ORDER" }
      - { name: subject_id, type: string, source: system, description: "Id of the subject entity (resolved by subject_type; not a declared FK because polymorphic)" }
      - { name: volume_gallons, type: number, source: system, description: "Gallons removed (removal/accrual entries); 0 otherwise", default: 0 }
      - { name: excise_cents, type: integer, source: system, description: "Excise accrued on this entry, in cents; 0 for non-tax entries", default: 0 }
      - { name: note, type: string, source: system, description: "Human description of the booked event" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- ProductionBatch: branching (fork to DUMPED) ----------------------------
  - entity: ProductionBatch
    field: status
    initial_state: FERMENTING
    terminal_states: [CLOSED, DUMPED]
    transitions:
      - from: FERMENTING
        to: AGING
        trigger: "POST /batches/{batchId}/transitions {action: BEGIN_AGING}"
        actor: CellarManager
        preconditions:
          - "batch.status == FERMENTING"
          - "available_bulk_gallons > 0"
        side_effects:
          - "winery.bulk_volume_gallons recomputed (no removal yet)"
      - from: FERMENTING
        to: DUMPED
        trigger: "POST /batches/{batchId}/transitions {action: DUMP}"
        actor: CellarManager
        preconditions:
          - "batch.status == FERMENTING"
          - "no Product with source_batch_id == batch.id has on_hand_bottles > 0 (else ERR_BATCH_HAS_INVENTORY)"
        side_effects:
          - "loss_gallons set to volume_in_gallons; available_bulk_gallons -> 0"
          - "winery.bulk_volume_gallons recomputed (this batch now contributes 0)"
        note: "Branch sibling of BEGIN_AGING; DUMPED books no excise (untaxpaid bulk loss)."
      - from: AGING
        to: BOTTLING
        trigger: "POST /batches/{batchId}/transitions {action: OPEN_BOTTLING}"
        actor: CellarManager
        preconditions:
          - "batch.status == AGING"
          - "available_bulk_gallons > 0"
        side_effects: []
      - from: BOTTLING
        to: BOTTLING
        trigger: "POST /batches/{batchId}/bottling-runs (bottle a Product)"
        actor: CellarManager
        preconditions:
          - "batch.status == BOTTLING"
          - "winery.status == ACTIVE (else ERR_WINERY_SUSPENDED)"
          - "referenced Product.source_batch_id == batch.id and Product.status != DISCONTINUED"
          - "removal_gallons <= available_bulk_gallons (else ERR_INSUFFICIENT_BULK)"
        side_effects:
          - "CASCADE hop 1: batch.bottled_volume_gallons += removal_gallons; batch.available_bulk_gallons recomputed"
          - "CASCADE hop 2: Product.on_hand_bottles += requested_bottles (the removal mints finished inventory)"
          - "CASCADE hop 3: winery.bottled_taxpaid_volume_gallons += removal_gallons AND winery.excise_tax_owed_cents += excise (excise_accrual fires on the premises total just changed by hop 2's mint)"
          - "append ComplianceLedgerEntry{entry_type: BOTTLING_REMOVAL} and {entry_type: EXCISE_ACCRUAL}"
        note: "Self-loop; each bottling run is one removal. Depth-3 cascade batch -> product -> premises(excise/ledger)."
      - from: BOTTLING
        to: CLOSED
        trigger: "POST /batches/{batchId}/transitions {action: CLOSE}"
        actor: CellarManager
        preconditions:
          - "batch.status == BOTTLING"
        side_effects:
          - "remaining available_bulk_gallons booked into loss_gallons; available_bulk_gallons -> 0"
          - "winery.bulk_volume_gallons recomputed"

  # ---- Product: linear lifecycle (OCC-guarded) --------------------------------
  - entity: Product
    field: status
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /products/{productId}/transitions {action: ACTIVATE, expected_product_version}"
        actor: CellarManager
        preconditions:
          - "product.status == DRAFT"
          - "source ProductionBatch.status IN {BOTTLING, CLOSED}"
          - "expected_product_version == product.version (else ERR_STALE_PRODUCT_VERSION)"
        side_effects:
          - "increments Product.version by 1"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{productId}/transitions {action: DISCONTINUE, expected_product_version}"
        actor: CellarManager
        preconditions:
          - "product.status == ACTIVE"
          - "no AllocationRelease of this product in status OPEN"
          - "expected_product_version == product.version (else ERR_STALE_PRODUCT_VERSION)"
        side_effects:
          - "increments Product.version by 1"

  # ---- AllocationRelease: quota window (OCC-guarded) --------------------------
  - entity: AllocationRelease
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /releases/{releaseId}/transitions {action: OPEN_RELEASE, expected_release_version, expected_product_version}"
        actor: CellarManager
        preconditions:
          - "release.status == DRAFT"
          - "Product.status == ACTIVE"
          - "Product.free_bottles >= pool_bottles (else ERR_INSUFFICIENT_INVENTORY)"
          - "expected_release_version == release.version (else ERR_STALE_RELEASE_VERSION)"
          - "expected_product_version == product.version (else ERR_STALE_PRODUCT_VERSION)"
        side_effects:
          - "Product.allocated_bottles += pool_bottles; Product.free_bottles recomputed (cascade: release open -> product allocation reserved out of free)"
          - "available_bottles initialized to pool_bottles"
          - "increments AllocationRelease.version by 1; increments Product.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /releases/{releaseId}/transitions {action: CLOSE_RELEASE, expected_release_version}"
        actor: CellarManager
        preconditions:
          - "release.status == OPEN"
          - "expected_release_version == release.version (else ERR_STALE_RELEASE_VERSION)"
        side_effects:
          - "residual available_bottles released: Product.allocated_bottles -= available_bottles (cascade: close -> free residual back to product)"
          - "available_bottles -> 0 (committed/reserved on in-flight shipments remain tracked)"
          - "increments AllocationRelease.version by 1"

  # ---- Member: linear lifecycle, cascades on SUSPEND --------------------------
  - entity: Member
    field: status
    initial_state: PROSPECT
    terminal_states: [CLOSED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /members/{memberId}/transitions {action: ACTIVATE}"
        actor: ClubManager
        preconditions:
          - "member.status == PROSPECT"
          - "member age >= AGE_MINIMUM_YEARS at current clock (DOB-based, else ERR_AGE_RESTRICTION)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{memberId}/transitions {action: SUSPEND}"
        actor: ClubManager
        preconditions:
          - "member.status == ACTIVE"
        side_effects:
          - "CASCADE hop 1: every Membership of this member with status ACTIVE -> PAUSED"
          - "CASCADE hop 2: each paused membership's SCHEDULED shipments -> CANCELLED; that cancel itself frees AllocationRelease.reserved_bottles for each (cascade chain member -> membership -> shipment -> release)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{memberId}/transitions {action: REINSTATE}"
        actor: ClubManager
        preconditions:
          - "member.status == SUSPENDED"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /members/{memberId}/transitions {action: CLOSE}"
        actor: ClubManager
        preconditions:
          - "member.status IN {ACTIVE, SUSPENDED}"
          - "no Membership of this member in status ACTIVE"
        side_effects: []

  # ---- Membership: branching lifecycle, parallel billing dimension ------------
  - entity: Membership
    field: status
    initial_state: ENROLLED
    terminal_states: [CANCELLED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/transitions {action: ACTIVATE}"
        actor: ClubManager
        preconditions:
          - "membership.status == ENROLLED"
          - "Member.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /memberships/{membershipId}/transitions {action: PAUSE}"
        actor: ClubManager
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "every SCHEDULED shipment of this membership -> CANCELLED, each freeing AllocationRelease.reserved_bottles"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/transitions {action: RESUME}"
        actor: ClubManager
        preconditions:
          - "membership.status == PAUSED"
          - "Member.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/transitions {action: CANCEL}"
        actor: ClubManager
        preconditions:
          - "membership.status IN {ACTIVE, PAUSED, ENROLLED}"
        side_effects:
          - "every SCHEDULED shipment -> CANCELLED, each freeing AllocationRelease.reserved_bottles"
          - "loyalty_points -> 0; winery.loyalty_point_liability recomputed (compensation: liability drops by the forfeited balance)"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/transitions {action: CANCEL}"
        actor: ClubManager
        preconditions:
          - "membership.status == PAUSED"
        side_effects:
          - "every SCHEDULED shipment -> CANCELLED, each freeing AllocationRelease.reserved_bottles"
          - "loyalty_points -> 0; winery.loyalty_point_liability recomputed"

  # ---- Shipment: branching with hold + revert ---------------------------------
  - entity: Shipment
    field: status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /shipments/{shipmentId}/transitions {action: RELEASE} (all compliance gates pass)"
        actor: ClubManager
        preconditions:
          - "shipment.status == SCHEDULED"
          - "winery.status == ACTIVE (else hold_reason WINERY_SUSPENDED)"
          - "Member age >= AGE_MINIMUM_YEARS (else hold_reason AGE)"
          - "ship_state_limit_check passes for ship_to_state_code (else hold_reason STATE_LIMIT)"
          - "Membership.billing_status == CURRENT (else hold_reason BILLING)"
          - "AllocationRelease.status == OPEN (else ERR_RELEASE_NOT_OPEN)"
        side_effects:
          - "AllocationRelease.reserved_bottles -= requested_bottles; AllocationRelease.committed_bottles += requested_bottles"
          - "Product.on_hand_bottles -= requested_bottles; Product.allocated_bottles -= requested_bottles (cascade: commit -> product inventory removed)"
          - "loyalty_points_earned minted to Membership.loyalty_points; winery.loyalty_point_liability recomputed"
          - "Membership.lifetime_bottles_shipped += requested_bottles"
          - "append ComplianceLedgerEntry{entry_type: SHIPMENT_RELEASE}"
      - from: SCHEDULED
        to: HELD
        trigger: "POST /shipments/{shipmentId}/transitions {action: RELEASE} (a compliance gate fails) OR {action: HOLD}"
        actor: ClubManager
        preconditions:
          - "shipment.status == SCHEDULED"
          - "at least one gate fails: winery SUSPENDED, member age < 21, state limit exceeded, billing PAST_DUE"
        side_effects:
          - "hold_reason set to the FIRST failing gate by validation priority: WINERY_SUSPENDED, then AGE, then STATE_LIMIT, then BILLING"
          - "append ComplianceLedgerEntry{entry_type: AGE_REJECTION} when hold_reason==AGE; {entry_type: STATE_LIMIT_REJECTION} when hold_reason==STATE_LIMIT"
        note: "Branch sibling of RELEASE; the gate outcome decides RELEASED vs HELD. Reservation stays held on the release."
      - from: HELD
        to: RELEASED
        trigger: "POST /shipments/{shipmentId}/transitions {action: RELEASE}"
        actor: ClubManager
        preconditions:
          - "shipment.status == HELD"
          - "all gates now pass (winery ACTIVE, age, state limit, billing CURRENT, release OPEN)"
        side_effects:
          - "hold_reason -> NONE"
          - "same commit/loyalty/ledger side-effects as SCHEDULED->RELEASED"
      - from: HELD
        to: CANCELLED
        trigger: "POST /shipments/{shipmentId}/transitions {action: CANCEL}"
        actor: ClubManager
        preconditions:
          - "shipment.status == HELD"
        side_effects:
          - "AllocationRelease.reserved_bottles -= requested_bottles (free the reservation)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shipments/{shipmentId}/transitions {action: CANCEL}"
        actor: ClubManager
        preconditions:
          - "shipment.status == SCHEDULED"
        side_effects:
          - "AllocationRelease.reserved_bottles -= requested_bottles (free the reservation)"
      - from: RELEASED
        to: DELIVERED
        trigger: "POST /shipments/{shipmentId}/transitions {action: DELIVER}"
        actor: ClubManager
        preconditions:
          - "shipment.status == RELEASED"
        side_effects: []

  # ---- TastingOrder: POS lifecycle --------------------------------------------
  - entity: TastingOrder
    field: status
    initial_state: OPEN
    terminal_states: [VOID, REFUNDED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /tasting-orders/{orderId}/transitions {action: PAY}"
        actor: TastingRoomStaff
        preconditions:
          - "order.status == OPEN"
          - "every BOTTLE line: Product.status == ACTIVE and Product.free_bottles >= quantity (else ERR_INSUFFICIENT_INVENTORY)"
          - "if any age-restricted line: guest_age_verified == true OR attached Member age >= 21 (else ERR_AGE_RESTRICTION)"
          - "redeem_points <= attached Membership.loyalty_points (else ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "BOTTLE lines: Product.on_hand_bottles -= quantity (cascade: POS sale -> product inventory removed)"
          - "loyalty_points_earned minted to attached Membership; redeemed points deducted; winery.loyalty_point_liability recomputed"
      - from: OPEN
        to: VOID
        trigger: "POST /tasting-orders/{orderId}/transitions {action: VOID}"
        actor: TastingRoomStaff
        preconditions:
          - "order.status == OPEN"
        side_effects: []
      - from: PAID
        to: REFUNDED
        trigger: "POST /tasting-orders/{orderId}/transitions {action: REFUND}"
        actor: TastingRoomStaff
        preconditions:
          - "order.status == PAID"
        side_effects:
          - "BOTTLE lines: Product.on_hand_bottles += quantity (compensation: restore sold inventory)"
          - "loyalty_points_earned reversed from Membership.loyalty_points; redeemed points restored; winery.loyalty_point_liability recomputed"

  # ---- Reservation: revert loop on NO_SHOW/CANCEL -----------------------------
  - entity: Reservation
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /reservations/{reservationId}/transitions {action: CONFIRM}"
        actor: TastingRoomStaff
        preconditions:
          - "reservation.status == REQUESTED"
          - "no CONFIRMED/SEATED reservation overlaps [starts_at, ends_at) on same table_code (else ERR_TABLE_DOUBLE_BOOKED)"
        side_effects: []
      - from: CONFIRMED
        to: SEATED
        trigger: "POST /reservations/{reservationId}/transitions {action: SEAT}"
        actor: TastingRoomStaff
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects: []
      - from: SEATED
        to: COMPLETED
        trigger: "POST /reservations/{reservationId}/transitions {action: COMPLETE}"
        actor: TastingRoomStaff
        preconditions:
          - "reservation.status == SEATED"
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{reservationId}/transitions {action: MARK_NO_SHOW}"
        actor: TastingRoomStaff
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects:
          - "table_code interval freed: a later CONFIRM on the same table+window no longer conflicts (revert of the capacity hold)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/transitions {action: CANCEL}"
        actor: TastingRoomStaff
        preconditions:
          - "reservation.status == REQUESTED"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/transitions {action: CANCEL}"
        actor: TastingRoomStaff
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects:
          - "table_code interval freed (revert of the capacity hold)"

  # ---- DistributionOrder: self-distribution lifecycle -------------------------
  - entity: DistributionOrder
    field: status
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /distribution-orders/{distOrderId}/transitions {action: SUBMIT}"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == DRAFT"
          - "Product.status == ACTIVE"
          - "Product.free_bottles >= bottles_ordered (else ERR_INSUFFICIENT_INVENTORY)"
        side_effects: []
      - from: SUBMITTED
        to: SHIPPED
        trigger: "POST /distribution-orders/{distOrderId}/transitions {action: SHIP}"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == SUBMITTED"
          - "winery.status == ACTIVE (else ERR_WINERY_SUSPENDED)"
          - "Product.free_bottles >= bottles_ordered (else ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "Product.on_hand_bottles -= bottles_ordered (cascade: distribution ship -> product inventory removed)"
          - "append ComplianceLedgerEntry{entry_type: DISTRIBUTION_REMOVAL} (no new excise: stock was taxpaid at bottling)"
      - from: SHIPPED
        to: INVOICED
        trigger: "POST /distribution-orders/{distOrderId}/transitions {action: INVOICE}"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == SHIPPED"
        side_effects:
          - "wholesale_total_cents finalized"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /distribution-orders/{distOrderId}/transitions {action: CANCEL}"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == DRAFT"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /distribution-orders/{distOrderId}/transitions {action: CANCEL}"
        actor: ComplianceOfficer
        preconditions:
          - "order.status == SUBMITTED"
        side_effects: []

  # ---- Winery: premises suspension (OCC-guarded) ------------------------------
  - entity: Winery
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wineries/{wineryId}/transitions {action: SUSPEND, expected_winery_version}"
        actor: ComplianceOfficer
        preconditions:
          - "winery.status == ACTIVE"
          - "expected_winery_version == winery.version (else ERR_STALE_WINERY_VERSION)"
        side_effects:
          - "increments Winery.version by 1"
          - "blocks all taxable removals while SUSPENDED (bottling, shipment release, distribution ship)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wineries/{wineryId}/transitions {action: REINSTATE, expected_winery_version}"
        actor: ComplianceOfficer
        preconditions:
          - "winery.status == SUSPENDED"
          - "expected_winery_version == winery.version (else ERR_STALE_WINERY_VERSION)"
        side_effects:
          - "increments Winery.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: release-open-stale-product
    parent_entity: Product
    write_endpoint: "POST /releases/{releaseId}/transitions"
    occ_field: "expected_product_version"
    description: |
      Opening an AllocationRelease draws free_bottles from the parent Product
      (allocated_bottles += pool_bottles). A client that observed the Product
      before a sibling release was opened holds a stale view of free_bottles;
      the OPEN_RELEASE is rejected when expected_product_version no longer
      matches the Product's current version, which the prior open advanced.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: release-transition-stale-release
    parent_entity: AllocationRelease
    write_endpoint: "POST /releases/{releaseId}/transitions"
    occ_field: "expected_release_version"
    description: |
      A release lifecycle transition (OPEN_RELEASE / CLOSE_RELEASE) carrying an
      expected_release_version that no longer matches the AllocationRelease's
      current version is rejected; an intervening transition already advanced the
      release version, so the client's view is stale.
    error_id: ERR_STALE_RELEASE_VERSION
    http_status: 412

  - rule_id: winery-transition-stale-winery
    parent_entity: Winery
    write_endpoint: "POST /wineries/{wineryId}/transitions"
    occ_field: "expected_winery_version"
    description: |
      A premises SUSPEND/REINSTATE carrying an expected_winery_version that no
      longer matches the Winery's current version is rejected; an intervening
      suspension/reinstatement already advanced the version, so the client's view
      of premises status is stale.
    error_id: ERR_STALE_WINERY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- 1. Excise accrual on bottling: dual-variant (WINE tiered vs BEER per-barrel)
  - name: excise_accrual
    trigger: "ProductionBatch BOTTLING self-loop side-effect EXCISE_ACCRUAL (POST /batches/{batchId}/bottling-runs)"
    algorithm: tiered_pricing
    formula: |
      removal_gallons = requested_bottles * (product.bottle_volume_ml / 1000) / LITERS_PER_GALLON
      if batch.beverage_class == WINE:
        if batch.abv_percent <= WINE_ABV_TIER1_MAX:   rate = WINE_RATE_TIER1_CENTS_PER_GAL
        else:                                          rate = WINE_RATE_TIER2_CENTS_PER_GAL
        excise_cents = round_half_up(removal_gallons * rate)
      elif batch.beverage_class == BEER:
        barrels = removal_gallons / GALLONS_PER_BEER_BARREL
        excise_cents = round_half_up(barrels * BEER_RATE_CENTS_PER_BARREL)
      else:   # CIDER: flat per-gallon, not ABV-keyed
        excise_cents = round_half_up(removal_gallons * CIDER_RATE_CENTS_PER_GAL)
      winery.excise_tax_owed_cents += excise_cents
    input_set: "single bottling run; only the gallons removed in this run, never the whole batch"
    constants:
      LITERS_PER_GALLON: 3.78541
      WINE_ABV_TIER1_MAX: 14.0
      WINE_RATE_TIER1_CENTS_PER_GAL: 107
      WINE_RATE_TIER2_CENTS_PER_GAL: 157
      GALLONS_PER_BEER_BARREL: 31.0
      BEER_RATE_CENTS_PER_BARREL: 1800
      CIDER_RATE_CENTS_PER_GAL: 23
    precision: "gallons full precision until the final multiply; round_half_up to whole cents once"
    variants:
      - name: wine_tiered_by_abv
        when: "beverage_class == WINE"
        difference: "rate selected by ABV tier (<=14% -> 107c/gal vs >14% -> 157c/gal); identical gallons differ from BEER/CIDER"
      - name: beer_per_barrel
        when: "beverage_class == BEER"
        difference: "gallons converted to 31-gal barrels then a flat per-barrel rate, ignoring ABV entirely"

  # ---- 2. Loyalty points: dual-variant (per-membership balance vs winery liability)
  - name: loyalty_points_accrual
    trigger: "TastingOrder OPEN->PAID side-effect; Shipment ->RELEASED side-effect"
    algorithm: aggregation
    formula: |
      mult = LOYALTY_MULT[membership.tier]   # SILVER 1, GOLD 2, PLATINUM 3
      earned = floor(net_spend_cents / CENTS_PER_POINT) * mult
      membership.loyalty_points += earned
      # POS redemption only:
      redeemed_value_cents = min(redeem_points * REDEEM_CENTS_PER_POINT, subtotal_after_discount_cents)
      membership.loyalty_points -= ceil(redeemed_value_cents / REDEEM_CENTS_PER_POINT)
      winery.loyalty_point_liability = SUM over all memberships of this winery of loyalty_points
    input_set: "net spend on the single order/shipment being finalized; winery view sums over all memberships"
    constants:
      CENTS_PER_POINT: 100
      REDEEM_CENTS_PER_POINT: 5
      LOYALTY_MULT: { SILVER: 1, GOLD: 2, PLATINUM: 3 }
    precision: "floor on earn (integer points); ceil on points consumed for the redeemed value"
    variants:
      - name: membership_balance
        when: "per-membership view"
        difference: "loyalty_points is the unredeemed balance on one membership only"
      - name: winery_liability_aggregate
        when: "premises aggregate view"
        difference: "winery.loyalty_point_liability sums loyalty_points across EVERY membership; equals one membership's balance only in a single-membership winery"

  # ---- 3. Shipment pricing: combinatorial mode (a) nested conditional, >=3 inputs
  - name: shipment_pricing
    trigger: "POST /shipments (create) and recomputed on RELEASE"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = requested_bottles * product.list_price_cents
      base_pct = TIER_DISCOUNT_PCT[membership.tier]   # SILVER .05, GOLD .10, PLATINUM .15
      eff_pct = base_pct + (VOLUME_KICKER_PCT if requested_bottles >= VOLUME_KICKER_BOTTLES else 0)
      eff_pct = min(eff_pct, MAX_DISCOUNT_PCT)         # cap last
      discount_cents = round_half_up(subtotal_cents * eff_pct)
      total_cents = subtotal_cents - discount_cents
    input_set: "single shipment: requested_bottles, list_price_cents, tier"
    constants:
      TIER_DISCOUNT_PCT: { SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15 }
      VOLUME_KICKER_BOTTLES: 12
      VOLUME_KICKER_PCT: 0.05
      MAX_DISCOUNT_PCT: 0.18
    precision: "round_half_up to whole cents once, AFTER eff_pct fully resolved (single rounding, not per-component)"
    variants:
      - name: with_volume_kicker_capped
        when: "requested_bottles >= 12 and tier == PLATINUM"
        difference: "eff_pct = 0.15+0.05=0.20 capped to 0.18; below-12 PLATINUM is plain 0.15"

  # ---- 4. POS order total: combinatorial mode (b) round-per-line-then-sum pinned
  - name: pos_order_total
    trigger: "TastingOrder OPEN->PAID (and recomputed on line edits while OPEN)"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each line first, THEN sum the rounded line totals.
      for each line:
        ext = line.quantity * unit_price(line)          # unit_price = unit_price_cents if given else product.list_price_cents
        line_total_cents = round_half_up(ext)           # round PER LINE
      subtotal_cents = SUM(line_total_cents over all lines)
      bottle_subtotal = SUM(line_total_cents over BOTTLE lines only)
      member_discount_cents = round_half_up(bottle_subtotal * TIER_DISCOUNT_PCT[tier]) if member attached else 0
      loyalty_redeemed_cents = min(redeem_points * REDEEM_CENTS_PER_POINT, subtotal_cents - member_discount_cents)
      total_cents = max(0, subtotal_cents - member_discount_cents - loyalty_redeemed_cents)
    input_set: "all line_items on the order"
    constants:
      TIER_DISCOUNT_PCT: { SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15 }
      REDEEM_CENTS_PER_POINT: 5
    precision: "round PER LINE then sum (NOT sum-then-round); member discount rounded once on the bottle subtotal"
    variants:
      - name: round_per_line_then_sum
        when: "always"
        difference: "pinned order: rounding each line before summation can differ by cents from summing raw then rounding"

  # ---- 5. State shipping limit: threshold with strict-greater boundary ---------
  - name: ship_state_limit_check
    trigger: "Shipment RELEASE gate; rolling trailing-365-day window vs the destination state's case limit"
    algorithm: threshold
    formula: |
      this_cases = (requested_bottles * product.bottle_volume_ml / 1000) / LITERS_PER_9L_CASE
      prior_cases = SUM over this Member's Shipments to ship_to_state_code with status IN {RELEASED, DELIVERED}
                    and created_at within [now - 365 days, now] of
                    (requested_bottles * product.bottle_volume_ml / 1000) / LITERS_PER_9L_CASE
      limit = STATE_CASE_LIMITS.get(ship_to_state_code, DEFAULT_STATE_CASE_LIMIT)
      if prior_cases + this_cases > limit:   # STRICTLY greater than -> gate fails -> hold_reason STATE_LIMIT
        gate fails
    input_set: "RELEASED+DELIVERED shipments of this member to this state in the trailing 365 days, plus the candidate shipment"
    constants:
      LITERS_PER_9L_CASE: 9.0
      DEFAULT_STATE_CASE_LIMIT: 24.0
      STATE_CASE_LIMITS: { CA: 24.0, NY: 36.0, TX: 9.0, PA: 0.0 }
    precision: "cases kept full precision; comparison is strict > (reaching exactly the limit passes; PA limit 0 forbids any case)"

  # ---- 6. Bulk-to-bottle removal accounting: aggregation / reconciliation ------
  - name: bottling_removal_accounting
    trigger: "POST /batches/{batchId}/bottling-runs"
    algorithm: aggregation
    formula: |
      removal_gallons = requested_bottles * (product.bottle_volume_ml / 1000) / LITERS_PER_GALLON
      # precondition: removal_gallons <= batch.available_bulk_gallons else ERR_INSUFFICIENT_BULK
      batch.bottled_volume_gallons += removal_gallons
      batch.available_bulk_gallons = batch.volume_in_gallons - batch.loss_gallons - batch.bottled_volume_gallons
      product.on_hand_bottles += requested_bottles
      winery.bulk_volume_gallons = SUM over batches in {FERMENTING, AGING, BOTTLING} of
                                   (volume_in_gallons - loss_gallons - bottled_volume_gallons)
      winery.bottled_taxpaid_volume_gallons += removal_gallons
    input_set: "the one bottling run; winery bulk recomputed over non-terminal batches"
    constants:
      LITERS_PER_GALLON: 3.78541
    precision: "gallons full precision; bottles integer"

  # ---- 7. Distribution wholesale invoice: combinatorial mode (c) eval-order pinned
  - name: distribution_invoice
    trigger: "DistributionOrder create (compute) and finalized on INVOICE"
    algorithm: tiered_pricing
    formula: |
      bottles_ordered = case_count * BOTTLES_PER_CASE
      gross_cents = bottles_ordered * product.list_price_cents
      wholesale_base = round_half_up(gross_cents * WHOLESALE_PCT)
      # PINNED ORDER: freight tier is keyed on wholesale_base (post-wholesale-discount), NOT on gross.
      if wholesale_base >= FREIGHT_TIER_THRESHOLD_CENTS: freight = FREIGHT_HIGH_CENTS
      else:                                              freight = FREIGHT_LOW_CENTS
      wholesale_total_cents = wholesale_base + freight
    input_set: "single distribution order"
    constants:
      BOTTLES_PER_CASE: 12
      WHOLESALE_PCT: 0.50
      FREIGHT_TIER_THRESHOLD_CENTS: 50000
      FREIGHT_LOW_CENTS: 2500
      FREIGHT_HIGH_CENTS: 1500
    precision: "round_half_up on wholesale_base; freight flat; pinned order base-before-freight (keying freight on gross would flip the tier near the boundary)"

  # ---- 8. Event deposit ------------------------------------------------------
  - name: event_deposit
    trigger: "POST /reservations (create) when is_event == true"
    algorithm: aggregation
    formula: |
      deposit_cents = (party_size * EVENT_DEPOSIT_PER_GUEST_CENTS) if is_event else 0
    input_set: "single reservation"
    constants:
      EVENT_DEPOSIT_PER_GUEST_CENTS: 1500
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For entity_backed Member role, X-User-ID equals the Member.id that owns the resource (self-service ownership)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member self-service GETs (own member, memberships, shipments)"
  - priority: 4
    category: existence
    check: "All path-referenced resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "All body FK references (winery_id, source_batch_id, product_id, release_id, member_id, membership_id) resolve and are scoped to the same winery"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints carrying body FKs"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition (state-machine from-state matches)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on version-guarded writes (Product, AllocationRelease, Winery)"
    error_id: ERR_STALE_RELEASE_VERSION
    http_status: 412
    applies_to: "release transitions, product transitions, winery transitions"
  - priority: 8
    category: business_safety
    check: "Age gate: member/guest is >= AGE_MINIMUM_YEARS (21) at the current clock (DOB-based). Compliance precedes inventory and fiscal."
    error_id: ERR_AGE_RESTRICTION
    http_status: 422
    applies_to: "Member ACTIVATE, TastingOrder PAY with age-restricted lines; Shipment RELEASE (sets hold_reason AGE)"
  - priority: 9
    category: business_safety
    check: "State shipping limit: prior_cases + this_cases must not exceed the destination state's case limit (strict >); PA limit 0 forbids any DTC shipment"
    error_id: ERR_STATE_SHIPPING_LIMIT
    http_status: 422
    applies_to: "Shipment RELEASE (sets hold_reason STATE_LIMIT)"
  - priority: 10
    category: business_safety
    check: "Premises not suspended: winery.status == ACTIVE for any taxable removal"
    error_id: ERR_WINERY_SUSPENDED
    http_status: 409
    applies_to: "bottling-runs, Shipment RELEASE, DistributionOrder SHIP"
  - priority: 11
    category: business_constraint
    check: "Per-member allocation cap: a membership's cumulative reserved+committed bottles on one release must not exceed per_member_cap"
    error_id: ERR_PER_MEMBER_CAP_EXCEEDED
    http_status: 422
    applies_to: "Shipment create"
  - priority: 12
    category: business_temporal
    check: "Release window: now is within [opens_at, closes_at) when reserving against an OPEN release"
    error_id: ERR_RELEASE_WINDOW_CLOSED
    http_status: 422
    applies_to: "Shipment create"
  - priority: 13
    category: business_temporal
    check: "Reservation overlap: no CONFIRMED/SEATED reservation occupies [starts_at, ends_at) on the same table_code (half-open; adjacency where ends_at == other.starts_at allowed)"
    error_id: ERR_TABLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "Reservation CONFIRM"
  - priority: 14
    category: business_constraint
    check: "Billing current: Membership.billing_status == CURRENT to release a shipment"
    error_id: ERR_BILLING_PAST_DUE
    http_status: 409
    applies_to: "Shipment RELEASE (sets hold_reason BILLING)"
  - priority: 15
    category: business_fiscal
    check: "Inventory sufficiency: enough free_bottles / available_bottles / available_bulk_gallons for the requested quantity"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "bottling-runs, release OPEN, Shipment create, TastingOrder PAY, DistributionOrder SUBMIT/SHIP"
  - priority: 16
    category: business_fiscal
    check: "Loyalty redemption: redeem_points <= attached membership.loyalty_points"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "TastingOrder PAY"
  - priority: 17
    category: business_constraint
    check: "Field-level validity: enums in allowed set, quantities > 0, ends_at > starts_at, closes_at > opens_at, party_size > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table  (FLAT topology; api_prefix "/")
# =============================================================================
endpoints:
  # ---- Winery ----------------------------------------------------------------
  - method: POST
    path: "/wineries"
    description: "Create a bonded winery/brewery premises"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, ttb_permit_number, home_state_code]
    output: Winery
    side_effects: ["status=ACTIVE; all accounting balances 0; version=1"]
  - method: GET
    path: "/wineries/{wineryId}"
    description: "Get a winery with TTB accounting balances"
    roles: [ComplianceOfficer, CellarManager, ClubManager, TastingRoomStaff]
    code: 200
    input: []
    output: Winery
    side_effects: []
  - method: POST
    path: "/wineries/{wineryId}/transitions"
    description: "Suspend or reinstate the premises (OCC-guarded on Winery.version)"
    roles: [ComplianceOfficer]
    code: 200
    input: [action, expected_winery_version]
    output: Winery
    side_effects: ["status toggles; increments Winery.version by 1"]

  # ---- ProductionBatch -------------------------------------------------------
  - method: POST
    path: "/batches"
    description: "Create a production batch (TTB record)"
    roles: [CellarManager, ComplianceOfficer]
    code: 201
    input: [winery_id, lot_code, beverage_class, volume_in_gallons, abv_percent]
    output: ProductionBatch
    side_effects: ["status=FERMENTING; available_bulk_gallons=volume_in_gallons; winery.bulk_volume_gallons recomputed"]
  - method: GET
    path: "/batches"
    description: "List production batches (filter by winery, status, class) — reverse-reachability for ProductionBatch.winery_id"
    roles: [CellarManager, ComplianceOfficer]
    code: 200
    input: ["winery_id?", "status?", "beverage_class?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []
  - method: GET
    path: "/batches/{batchId}"
    description: "Get a production batch"
    roles: [CellarManager, ComplianceOfficer]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []
  - method: POST
    path: "/batches/{batchId}/transitions"
    description: "Advance batch lifecycle (BEGIN_AGING/OPEN_BOTTLING/CLOSE/DUMP)"
    roles: [CellarManager]
    code: 200
    input: [action]
    output: ProductionBatch
    side_effects: ["status changes; loss/available recomputed; winery.bulk_volume_gallons recomputed"]
  - method: POST
    path: "/batches/{batchId}/bottling-runs"
    description: "Bottle requested_bottles of a Product from this batch (taxable removal; books excise + ledger)"
    roles: [CellarManager]
    code: 201
    input: [product_id, requested_bottles]
    output: ProductionBatch
    side_effects:
      - "removal_gallons removed from batch; Product.on_hand_bottles minted"
      - "winery.bottled_taxpaid_volume_gallons and winery.excise_tax_owed_cents increased (excise_accrual)"
      - "append ComplianceLedgerEntry BOTTLING_REMOVAL + EXCISE_ACCRUAL"

  # ---- Product ---------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Create a finished SKU/vintage bound to a source batch"
    roles: [CellarManager]
    code: 201
    input: ["winery_id", "source_batch_id", "sku", "vintage_year", "bottle_volume_ml", "list_price_cents", "is_age_restricted?"]
    output: Product
    side_effects: ["status=DRAFT; on_hand_bottles=0; allocated_bottles=0; free_bottles=0; version=1"]
  - method: GET
    path: "/products"
    description: "List products (filter by winery, source batch, status) — reverse-reachability for Product.winery_id and Product.source_batch_id"
    roles: [CellarManager, ComplianceOfficer, ClubManager, TastingRoomStaff]
    code: 200
    input: ["winery_id?", "source_batch_id?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/products/{productId}"
    description: "Get a product with inventory balances"
    roles: [CellarManager, ComplianceOfficer, ClubManager, TastingRoomStaff]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{productId}/transitions"
    description: "Activate or discontinue a product (OCC-guarded on Product.version)"
    roles: [CellarManager]
    code: 200
    input: [action, expected_product_version]
    output: Product
    side_effects: ["status changes; increments Product.version by 1"]

  # ---- AllocationRelease -----------------------------------------------------
  - method: POST
    path: "/releases"
    description: "Create a finite allocation release for a product"
    roles: [CellarManager]
    code: 201
    input: [winery_id, product_id, pool_bottles, per_member_cap, opens_at, closes_at]
    output: AllocationRelease
    side_effects: ["status=DRAFT; reserved=0; committed=0; available_bottles=0; version=1"]
  - method: GET
    path: "/releases"
    description: "List releases (filter by product, winery, status) — reverse-reachability for AllocationRelease.product_id and .winery_id"
    roles: [CellarManager, ClubManager, ComplianceOfficer]
    code: 200
    input: ["product_id?", "winery_id?", "status?", "limit?", "offset?"]
    output: AllocationRelease[]
    side_effects: []
  - method: GET
    path: "/releases/{releaseId}"
    description: "Get an allocation release with pool/reserved/committed balances"
    roles: [CellarManager, ClubManager, ComplianceOfficer]
    code: 200
    input: []
    output: AllocationRelease
    side_effects: []
  - method: POST
    path: "/releases/{releaseId}/transitions"
    description: "Open or close a release (OCC on AllocationRelease.version; OPEN also OCC-checks Product.version)"
    roles: [CellarManager]
    code: 200
    input: ["action", "expected_release_version", "expected_product_version?"]
    output: AllocationRelease
    side_effects: ["status changes; Product.allocated_bottles adjusted; increments AllocationRelease.version by 1; on OPEN increments Product.version by 1"]

  # ---- Member ----------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Create a club member (prospect)"
    roles: [ClubManager]
    code: 201
    input: [winery_id, full_name, email, date_of_birth, ship_to_state_code]
    output: Member
    side_effects: ["status=PROSPECT"]
  - method: GET
    path: "/members"
    description: "List members (filter by winery, status, ship-to state) — reverse-reachability for Member.winery_id"
    roles: [ClubManager, ComplianceOfficer]
    code: 200
    input: ["winery_id?", "status?", "ship_to_state_code?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/members/{memberId}"
    description: "Get a member"
    roles: [ClubManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{memberId}/transitions"
    description: "Member lifecycle (ACTIVATE/SUSPEND/REINSTATE/CLOSE)"
    roles: [ClubManager]
    code: 200
    input: [action]
    output: Member
    side_effects: ["status changes; SUSPEND cascades to memberships and shipments"]

  # ---- Membership ------------------------------------------------------------
  - method: POST
    path: "/memberships"
    description: "Enroll a club membership for a member"
    roles: [ClubManager]
    code: 201
    input: [winery_id, member_id, tier, cadence_months, bottles_per_shipment]
    output: Membership
    side_effects: ["status=ENROLLED; billing_status=CURRENT; loyalty_points=0"]
  - method: GET
    path: "/memberships"
    description: "List memberships (filter by member, winery, status) — reverse-reachability for Membership.member_id and .winery_id"
    roles: [ClubManager, Member, ComplianceOfficer]
    code: 200
    input: ["member_id?", "winery_id?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/memberships/{membershipId}"
    description: "Get a membership"
    roles: [ClubManager, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/memberships/{membershipId}/transitions"
    description: "Membership lifecycle (ACTIVATE/PAUSE/RESUME/CANCEL)"
    roles: [ClubManager]
    code: 200
    input: [action]
    output: Membership
    side_effects: ["status changes; PAUSE/CANCEL cancels SCHEDULED shipments; CANCEL zeroes loyalty_points"]
  - method: POST
    path: "/memberships/{membershipId}/billing"
    description: "Set membership billing status (CURRENT/PAST_DUE)"
    roles: [ClubManager]
    code: 200
    input: [billing_status]
    output: Membership
    side_effects: ["billing_status updated"]

  # ---- Shipment --------------------------------------------------------------
  - method: POST
    path: "/shipments"
    description: "Schedule a recurring club shipment drawing on a release"
    roles: [ClubManager]
    code: 201
    input: [winery_id, membership_id, release_id, requested_bottles]
    output: Shipment
    side_effects:
      - "status=SCHEDULED; subtotal/discount/total computed (shipment_pricing)"
      - "AllocationRelease.reserved_bottles += requested_bottles; available_bottles recomputed"
      - "ship_to_state_code snapshotted from Member"
  - method: GET
    path: "/shipments"
    description: "List shipments (filter by membership, release, winery, status, ship-to state) — reverse-reachability for Shipment.membership_id, .release_id, .winery_id"
    roles: [ClubManager, Member, ComplianceOfficer]
    code: 200
    input: ["membership_id?", "release_id?", "winery_id?", "status?", "ship_to_state_code?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [ClubManager, Member]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/shipments/{shipmentId}/transitions"
    description: "Shipment lifecycle (RELEASE/HOLD/DELIVER/CANCEL); RELEASE runs compliance gates and may divert to HELD"
    roles: [ClubManager]
    code: 200
    input: [action]
    output: Shipment
    side_effects: ["status changes; release commit/free; loyalty mint; ledger append; hold_reason set on HELD"]

  # ---- TastingOrder ----------------------------------------------------------
  - method: POST
    path: "/tasting-orders"
    description: "Open a tasting-room POS order with flight/bottle/glass lines"
    roles: [TastingRoomStaff]
    code: 201
    input: ["winery_id", "line_items", "member_id?", "guest_age_verified?", "redeem_points?"]
    output: TastingOrder
    side_effects: ["status=OPEN; subtotal/discount/total computed (pos_order_total)"]
  - method: GET
    path: "/tasting-orders"
    description: "List tasting orders (filter by winery, member, status) — reverse-reachability for TastingOrder.winery_id and .member_id"
    roles: [TastingRoomStaff, ComplianceOfficer]
    code: 200
    input: ["winery_id?", "member_id?", "status?", "limit?", "offset?"]
    output: TastingOrder[]
    side_effects: []
  - method: GET
    path: "/tasting-orders/{orderId}"
    description: "Get a tasting order"
    roles: [TastingRoomStaff]
    code: 200
    input: []
    output: TastingOrder
    side_effects: []
  - method: POST
    path: "/tasting-orders/{orderId}/transitions"
    description: "POS order lifecycle (PAY/VOID/REFUND)"
    roles: [TastingRoomStaff]
    code: 200
    input: [action]
    output: TastingOrder
    side_effects: ["PAY removes BOTTLE inventory, mints/redeems loyalty; REFUND compensates"]

  # ---- Reservation -----------------------------------------------------------
  - method: POST
    path: "/reservations"
    description: "Create a tasting-room/event reservation"
    roles: [TastingRoomStaff]
    code: 201
    input: ["winery_id", "table_code", "party_size", "starts_at", "ends_at", "is_event?"]
    output: Reservation
    side_effects: ["status=REQUESTED; deposit_cents computed for events (event_deposit)"]
  - method: GET
    path: "/reservations"
    description: "List reservations (filter by winery, table, status) — reverse-reachability for Reservation.winery_id"
    roles: [TastingRoomStaff, ComplianceOfficer]
    code: 200
    input: ["winery_id?", "table_code?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: GET
    path: "/reservations/{reservationId}"
    description: "Get a reservation"
    roles: [TastingRoomStaff]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: POST
    path: "/reservations/{reservationId}/transitions"
    description: "Reservation lifecycle (CONFIRM/SEAT/COMPLETE/MARK_NO_SHOW/CANCEL); CONFIRM runs overlap check"
    roles: [TastingRoomStaff]
    code: 200
    input: [action]
    output: Reservation
    side_effects: ["status changes; NO_SHOW/CANCEL from CONFIRMED frees the table interval"]

  # ---- DistributionOrder -----------------------------------------------------
  - method: POST
    path: "/distribution-orders"
    description: "Create a self-distribution wholesale order"
    roles: [ComplianceOfficer]
    code: 201
    input: [winery_id, product_id, retailer_license_number, dest_state_code, case_count]
    output: DistributionOrder
    side_effects: ["status=DRAFT; bottles_ordered and wholesale_total_cents computed (distribution_invoice)"]
  - method: GET
    path: "/distribution-orders"
    description: "List distribution orders (filter by winery, product, status, dest state) — reverse-reachability for DistributionOrder.winery_id and .product_id"
    roles: [ComplianceOfficer]
    code: 200
    input: ["winery_id?", "product_id?", "status?", "dest_state_code?", "limit?", "offset?"]
    output: DistributionOrder[]
    side_effects: []
  - method: GET
    path: "/distribution-orders/{distOrderId}"
    description: "Get a distribution order"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DistributionOrder
    side_effects: []
  - method: POST
    path: "/distribution-orders/{distOrderId}/transitions"
    description: "Distribution lifecycle (SUBMIT/SHIP/INVOICE/CANCEL); SHIP removes inventory + books ledger"
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: DistributionOrder
    side_effects: ["status changes; SHIP removes Product inventory and appends DISTRIBUTION_REMOVAL ledger entry"]

  # ---- ComplianceLedgerEntry (read-only event log) ---------------------------
  - method: GET
    path: "/ledger-entries"
    description: "List compliance ledger entries (filter by winery, type, subject) — reverse-reachability for ComplianceLedgerEntry.winery_id"
    roles: [ComplianceOfficer]
    code: 200
    input: ["winery_id?", "entry_type?", "subject_type?", "subject_id?", "limit?", "offset?"]
    output: ComplianceLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/ledger-entries/{entryId}"
    description: "Get a single compliance ledger entry"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceLedgerEntry
    side_effects: []

  # ---- Test-driving clock ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the deterministic server clock (test-driving; gates age and release-window and 365-day evaluations)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server 'now' set to to_iso8601 for all subsequent age/window/365-day evaluations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed Member acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource missing or out of winery scope" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body foreign-key reference does not resolve within the winery" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Bad enum, non-positive quantity, ends<=starts, closes<=opens, malformed body" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_PRODUCT_VERSION, http: 412, condition: "expected_product_version does not match current Product.version" }
  - { id: ERR_STALE_RELEASE_VERSION, http: 412, condition: "expected_release_version does not match current AllocationRelease.version" }
  - { id: ERR_STALE_WINERY_VERSION, http: 412, condition: "expected_winery_version does not match current Winery.version" }
  - { id: ERR_AGE_RESTRICTION, http: 422, condition: "Member/guest under 21 at current clock for an age-restricted operation" }
  - { id: ERR_STATE_SHIPPING_LIMIT, http: 422, condition: "Destination-state case limit would be exceeded (strict >); PA forbids DTC" }
  - { id: ERR_WINERY_SUSPENDED, http: 409, condition: "Taxable removal attempted while winery.status == SUSPENDED" }
  - { id: ERR_PER_MEMBER_CAP_EXCEEDED, http: 422, condition: "Membership reserved+committed on a release would exceed per_member_cap" }
  - { id: ERR_RELEASE_WINDOW_CLOSED, http: 422, condition: "now outside [opens_at, closes_at) when reserving against a release" }
  - { id: ERR_TABLE_DOUBLE_BOOKED, http: 409, condition: "Overlapping CONFIRMED/SEATED reservation on the same table_code [starts_at, ends_at)" }
  - { id: ERR_BILLING_PAST_DUE, http: 409, condition: "Shipment RELEASE while Membership.billing_status == PAST_DUE" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Not enough free_bottles / available_bottles for the requested quantity" }
  - { id: ERR_INSUFFICIENT_BULK, http: 409, condition: "Bottling run removal_gallons exceeds batch.available_bulk_gallons" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "redeem_points exceeds attached membership.loyalty_points" }
  - { id: ERR_RELEASE_NOT_OPEN, http: 409, condition: "Reserve/release attempted against a release not in OPEN status" }
  - { id: ERR_BATCH_HAS_INVENTORY, http: 409, condition: "DUMP attempted while a Product sourced from the batch still has on_hand_bottles > 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Owns TTB/production accounting, premises lifecycle, the compliance ledger, and self-distribution. Cannot run club or POS write operations."
    identity: opaque
    exclusive_operations:
      - "POST /wineries — create premises"
      - "POST /wineries/{id}/transitions — suspend/reinstate premises"
      - "GET /ledger-entries — read compliance ledger"
      - "POST /distribution-orders — create self-distribution order"
      - "POST /distribution-orders/{id}/transitions — distribution lifecycle"
    shared_operations:
      - "GET /wineries/{id} — read premises (shared)"
      - "POST /batches — create batch (shared with CellarManager)"
      - "GET /batches, /products, /releases, /members, /memberships, /shipments, /tasting-orders, /reservations — read (shared)"

  - name: CellarManager
    description: "Owns production batches, bottling runs, products, and allocation releases (cellar/inventory operations)."
    identity: opaque
    exclusive_operations:
      - "POST /batches/{id}/transitions — batch lifecycle"
      - "POST /batches/{id}/bottling-runs — bottling"
      - "POST /products — create product"
      - "POST /products/{id}/transitions — product lifecycle"
      - "POST /releases — create release"
      - "POST /releases/{id}/transitions — release lifecycle"
    shared_operations:
      - "POST /batches — create batch (shared with ComplianceOfficer)"
      - "GET /batches, /products, /releases, /wineries/{id} — read (shared)"

  - name: ClubManager
    description: "Owns members, memberships, billing, and club shipments (DTC club operations)."
    identity: opaque
    exclusive_operations:
      - "POST /members — create member"
      - "POST /members/{id}/transitions — member lifecycle"
      - "POST /memberships — enroll membership"
      - "POST /memberships/{id}/transitions — membership lifecycle"
      - "POST /memberships/{id}/billing — set billing status"
      - "POST /shipments — schedule shipment"
      - "POST /shipments/{id}/transitions — shipment lifecycle"
    shared_operations:
      - "GET /members, /memberships, /shipments, /products, /releases, /wineries/{id} — read (shared)"

  - name: TastingRoomStaff
    description: "Owns tasting-room POS orders and table/event reservations."
    identity: opaque
    exclusive_operations:
      - "POST /tasting-orders — open POS order"
      - "POST /tasting-orders/{id}/transitions — POS lifecycle"
      - "POST /reservations — create reservation"
      - "POST /reservations/{id}/transitions — reservation lifecycle"
    shared_operations:
      - "GET /tasting-orders, /reservations, /products, /wineries/{id} — read (shared)"

  - name: Member
