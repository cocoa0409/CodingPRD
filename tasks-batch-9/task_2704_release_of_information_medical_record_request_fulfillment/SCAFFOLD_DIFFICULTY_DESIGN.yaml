          - state_machines.Request.SENSITIVE_REVIEW_to_RELEASE_READY
          - entities.Request.fields.billing_status
          - calculations.invoice_line_build
        distinguishing_aspect: >
          The P == 0 versus P == 1 boundary, which flips a state rather than a
          number: at 0 billable pages the PER_PAGE_FLAT line is omitted, the
          subtotal is 0, entry into RELEASE_READY sets billing_status NOT_BILLABLE
          and invoicing is refused with ERR_NOTHING_TO_INVOICE — while at 1 page the
          same flow yields a perfectly ordinary 10-cent invoice.
