              as_user_id: "${mfr_id}"
            - call: "GET /labeling/criterion-responses"
              payload: { assessment_id: "${asmt_id}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /labeling/assessments/${asmt_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "first response HTTP status is 201 and data is an array of exactly 4 CriterionResponse rows"
            - "first response: the array order matches the submitted order, so data[0].criterion_id == ${auth1_id} and data[3].criterion_id == ${vln1_id}"
            - "first response: every element carries assessment_id == ${asmt_id}, lab_result == NOT_TESTED and lab_verified == false"
            - "second response: total_count == 4 and has_more == false"
            - "third response HTTP status is 201 with status == UNDER_REVIEW and provisional_overall_score == 100.00"
