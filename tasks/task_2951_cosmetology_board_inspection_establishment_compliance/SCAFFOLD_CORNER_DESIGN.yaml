            - "SanitationLog.${log_ok_id}.occupancy_end_at == 2026-07-30T10:25:00.000Z"
            - "Workstation.${ws_id}.last_biofilm_cycle_at is null"
            - "GET /cosmetology/workstations/${ws_id}/sanitation-logs returns total_count == 2"

      - name: validation_routine_window_clearing_the_cooldown_buffer_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_68.ERR_INSPECTION_WINDOW_COOLDOWN
          - validations.priority_67.ERR_INSPECTION_WINDOW_OVERLAP
        distinguishing_aspect: "The 24-hour buffer is satisfied inclusively: a ROUTINE window starting exactly at the earlier window's end + 24h (2026-08-04T17:00:00Z) is accepted, while one millisecond earlier is refused — so the rule is >= and not >."
        test_recipe:
          setup:
            - "One establishment 'Cooldown Salon' with a SCHEDULED ROUTINE inspection occupying 2026-08-03T09:00:00Z to 2026-08-03T17:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Cooldown Salon", establishment_type: "SALON", county_code: "ACS", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
