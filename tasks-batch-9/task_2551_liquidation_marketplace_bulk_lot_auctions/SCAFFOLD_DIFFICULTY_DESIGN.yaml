  # ===========================================================================
  # Rule 3 - non-linear state machines on different entities
  #   instance 1: parallel independent dimensions on SaleOrder
  #   instance 2: cyclic alternating turns with a round cap on Negotiation
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: sale_order_payment_and_logistics_dimensions_advance_independently
        grounds:
          - state_machines.SaleOrder.UNPAID_to_PAID
          - state_machines.SaleOrder.AWAITING_APPOINTMENT_to_APPOINTMENT_SCHEDULED
          - state_machines.PickupAppointment.SCHEDULED_to_CANCELLED
          - entities.SaleOrder.fields.payment_status
          - entities.SaleOrder.fields.logistics_status
          - endpoints[POST /liquidation/pickup-appointments/{id}/cancellations]
        distinguishing_aspect: |
          SaleOrder is not a single chain: payment_status and logistics_status are two independent
          dimensions over one row. Paying in full moves payment_status UNPAID -> PAID while
          logistics_status stays AWAITING_APPOINTMENT, and the logistics dimension then cycles
          AWAITING_APPOINTMENT -> APPOINTMENT_SCHEDULED -> AWAITING_APPOINTMENT through a booking and
          its cancellation without disturbing payment_status, amount_paid_cents or paid_at. A
          single-status model would either lose PAID on cancellation or refuse the cancellation.
        test_recipe:
          setup:
            - "Seller, warehouse with dock_door_count 2, carrier with daily_pickup_capacity 5, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Lot P1 is NEW_OVERSTOCK with one ACTIVE line 50 x 20000 (declared_unit_count 50, declared_retail_value_cents 1000000)."
            - "A FIXED_PRICE listing at ask_price_cents 1000000 is OPEN over [2026-08-05T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "At clock 2026-08-05T01:00:00Z the buyer buys at the ask, producing a SaleOrder with buyer_premium_bps 1400, buyer_premium_cents 140000, pallet_count 1, estimated_freight_cents 8500 and total_due_cents 1148500, which is then paid in full."
