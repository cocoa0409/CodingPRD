      - name: list_projects_paginates_and_rejects_an_out_of_range_limit
        claim_type: listing
        grounds:
          - endpoints.GET_/iz-compliance/projects
          - validations.priority_4
        distinguishing_aspect: |
          The list envelope carries limit, offset, total_count and has_more, and the three
          seeded projects make the boundary observable: limit 2 offset 0 returns 2 rows with
          total_count 3 and has_more true, while limit 2 offset 2 returns the last row with
          has_more false. A limit of 101 exceeds the declared 1..100 ceiling and is refused
          at priority 4 rather than silently clamped, and the state filter narrows the same
          list to the one screened project.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Three projects created in order by dev-1: Alpha (R-2, 10 units), Bravo (R-4, 27 units), Charlie (C-2, 40 units). Only Alpha is screened, so exactly one row is in state SCREENED_SUBJECT."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Alpha", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_alpha: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Bravo", zoning_district: "R-4", total_units: 27, approval_date: "2026-01-16" }, as: Developer, as_user_id: "dev-1", captures: { p_bravo: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Charlie", zoning_district: "C-2", total_units: 40, approval_date: "2026-01-17" }, as: Developer, as_user_id: "dev-1", captures: { p_charlie: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_alpha}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
          trigger:
            - { call: "GET /iz-compliance/projects", payload: { limit: 2, offset: 0 }, as: FundAuditor, as_user_id: "aud-1", captures: { first_id: "$.data[0].id" } }
            - { call: "GET /iz-compliance/projects", payload: { limit: 2, offset: 2 }, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "GET /iz-compliance/projects", payload: { state: "SCREENED_SUBJECT" }, as: FundAuditor, as_user_id: "aud-1" }
            - { call: "GET /iz-compliance/projects", payload: { limit: 101 }, as: FundAuditor, as_user_id: "aud-1", captures: { err: $.data.error_id } }
          assert:
            - "limit 2 offset 0 returns 2 rows with total_count 3, has_more true, limit 2, offset 0, and response_type array"
            - "limit 2 offset 2 returns 1 row with total_count 3 and has_more false"
            - "the two pages together contain each of ${p_alpha}, ${p_bravo} and ${p_charlie} exactly once"
            - "state SCREENED_SUBJECT returns exactly 1 row (${p_alpha}) with total_count 1"
            - "limit 101 returns HTTP 400 with error_id ERR_INVALID_REQUEST — the ceiling is 100 and the value is not clamped"

      - name: unknown_path_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations.priority_5
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_DISBURSEMENT_NOT_FOUND]
        distinguishing_aspect: |
          Priority 5 resolves each path id against its own entity and returns that entity's
          own 404 code, so the thirteen not-found codes are not interchangeable: the same
          syntactically valid unknown id yields ERR_PROJECT_NOT_FOUND on the projects route
          and ERR_UNIT_NOT_FOUND on the units route. Existence is checked before any state
          or business rule, so an unknown id on an action route also returns 404 rather than
          a 409.
