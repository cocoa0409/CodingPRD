  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: temperature_band_lower_inclusive_boundary
        metric: "PerformanceBand selection at the band's inclusive lower bound, and the limiting_factor flip it causes in calculate_allowed_payload"
        endpoint: "PATCH /flights/{id}/conditions"
        boundary: "outside_air_temp_c == 30.0, the lower edge of the [30, 45) band; 29.9 stays in [15, 30)"
        grounds:
          - calculations.calculate_performance_limited_weight
          - calculations.calculate_allowed_payload
          - entities.PerformanceBand.fields.temp_lo_c
        distinguishing_aspect: |
          One tenth of a degree moves the flight from the 74500 kg band, where the
          accumulated temperature penalty is at its maximum (1937.00 kg for 14.9
          degrees of excess), to the 69800 kg band, where the penalty resets to
          0.00 kg. The band with the LOWER base limit therefore yields the HIGHER
          performance weight relief per degree, and the 2770 kg net drop is enough
          to move limiting_factor from MZFW to PERFORMANCE. Off-by-one
          implementations that treat temp_lo_c as exclusive, or that carry the
          penalty across the band change, miss both figures.
        test_recipe:
          setup:
            - "Aircraft HB-AAA; runway LSGG/04 at 1411 ft with TWO bands for B738: [15, 30) base 74500 and [30, 45) base 69800; STANDARD program."
            - "Flight created at 22 C, 6 kt headwind, DRY, ramp 9800 / taxi 250 / trip 6900 -> altitude penalty 310.42, temperature penalty 910.00, wind credit 540.00."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw1: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 30, temp_hi_c: 45, base_limit_weight_kg: 69800 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1650", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id }
          trigger:
            - call: "PATCH /flights/${f1}/conditions"
              payload: { outside_air_temp_c: 29.9 }
              as: LoadController
            - call: "PATCH /flights/${f1}/conditions"
              payload: { outside_air_temp_c: 30.0 }
              as: LoadController
          assert:
            - "at creation (22 C): Flight.${f1}.performance_limited_takeoff_weight_kg == 73810.00, allowed_payload_kg == 20180.00, limiting_factor == MZFW"
            - "after 29.9 C: Flight.${f1}.performance_limited_takeoff_weight_kg == 72790.00"
            - "after 29.9 C: Flight.${f1}.allowed_payload_kg == 20180.00 and Flight.${f1}.limiting_factor == MZFW"
            - "after 30.0 C: Flight.${f1}.performance_limited_takeoff_weight_kg == 70020.00"
            - "after 30.0 C: Flight.${f1}.allowed_payload_kg == 17920.00 and Flight.${f1}.limiting_factor == PERFORMANCE"
            - "Flight.${f1}.dry_operating_weight_kg == 42550.00 and Flight.${f1}.dry_operating_index == 62.53 (unchanged by both calls)"

      - name: gate_bag_absorbed_at_exact_underload_zero
        metric: "underload_kg reaching exactly 0.00 on a gate-bag absorption, with takeoff_weight_kg landing exactly on performance_limited_takeoff_weight_kg"
        endpoint: "POST /load-plans/{id}/gate-bags"
        boundary: "remaining underload 200.00 kg versus a 200.00 kg gate-checked bag: absorbed at equality, and the next 1.00 kg bag is deferred"
        grounds:
          - calculations.calculate_base_payload
          - calculations.calculate_gate_bag_disposition
          - entities.LoadPlan.fields.underload_kg
          - entities.LoadPlan.fields.deferred_bag_weight_kg
        distinguishing_aspect: |
          A different metric and a different endpoint from the temperature probe.
          The absorption test is inclusive, so a bag whose weight exactly equals
          the remaining underload is accepted and drives underload_kg to 0.00,
          and the resulting takeoff_weight_kg 65120.00 kg is exactly the
          performance-limited takeoff weight - the aircraft is admissible at the
          limit, not one kilogram beyond it. The immediately following 1.00 kg bag
          has zero room and must become a DEFERRED GATE_BAG row that leaves every
          balance field untouched. Hold H1 sits at exactly its 4500 kg
          max_weight_kg and also at exactly its 900 kg/m running load, so the bag
          can only be placed in H4.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC (seat_capacity 60) and holds H1, H4; runway LSGG/04 with a single [30, 45) band base 69800; STANDARD program."
            - "Flight at 30 C, 6 kt, WET -> altitude penalty 310.42, temperature penalty 0.00, wind credit 540.00, contamination factor 0.93 -> performance_limited_takeoff_weight_kg 65120.00, allowed_payload_kg 13020.00, limiting_factor PERFORMANCE."
            - "Plan: OC 60 male = 5280.00, H1 bags 4500.00 (exactly max_weight_kg and exactly 900 kg/m), H4 general cargo 2940.00 + 100.00 = 3040.00 -> base_payload_kg 12820.00, frozen_underload_kg 200.00."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OC", kind: "CABIN_ZONE", arm_m: 22.900, max_weight_kg: 8000, running_load_limit_kg_per_m: 2000, length_m: 8.0, seat_capacity: 60 }
              as: LoadControlAdmin
              captures: { oc1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H1", kind: "HOLD", arm_m: 9.200, max_weight_kg: 4500, running_load_limit_kg_per_m: 900, length_m: 5.0, seat_capacity: 0 }
              as: LoadControlAdmin
              captures: { h11: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H4", kind: "HOLD", arm_m: 24.600, max_weight_kg: 5000, running_load_limit_kg_per_m: 900, length_m: 6.0, seat_capacity: 0 }
              as: LoadControlAdmin
              captures: { h41: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw1: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 30, temp_hi_c: 45, base_limit_weight_kg: 69800 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1660", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 30, headwind_component_kt: 6, runway_condition: "WET" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver: $.data.version }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver}", gate_bag_policy: "ACCEPT_IF_UNDERLOAD" }
              as: LoadController
              captures: { lp1: $.data.id }
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${oc1}", male_count: 60, female_count: 0, child_count: 0, infant_count: 0 }
              as: LoadController
            - call: "POST /bag-allocations"
              payload: { load_plan_id: "${lp1}", compartment_id: "${h11}", bag_count: 346, bag_weight_kg: 4500 }
              as: LoadController
            - call: "POST /cargo-items"
              payload: { flight_id: "${f1}", awb_number: "724-99990001", item_kind: "GENERAL", weight_kg: 3040, length_m: 3.0, is_dangerous_goods: false }
              as: RampAgent
              captures: { cg1: $.data.id }
            - call: "POST /cargo-items/${cg1}/assign"
              payload: { assigned_compartment_id: "${h41}" }
              as: RampAgent
            - call: "POST /load-plans/${lp1}/compute"
              payload: {}
              as: LoadController
          trigger:
            - call: "POST /load-plans/${lp1}/gate-bags"
              payload: { awb_number: "GB-0001", weight_kg: 200, length_m: 0.6, compartment_id: "${h41}" }
              as: RampAgent
              captures: { gb1: $.data.id }
            - call: "POST /load-plans/${lp1}/gate-bags"
              payload: { awb_number: "GB-0002", weight_kg: 1, length_m: 0.3, compartment_id: "${h41}" }
              as: RampAgent
              captures: { gb2: $.data.id }
          assert:
            - "before the triggers: LoadPlan.${lp1}.base_payload_kg == 12820.00, frozen_underload_kg == 200.00, planned_payload_kg == 12820.00, underload_kg == 200.00"
            - "before the triggers: LoadPlan.${lp1}.index_zfw == 81.68, mac_zfw_pct == 13.62, takeoff_weight_kg == 64920.00, mac_tow_pct == 14.77"
            - "after GB-0001: CargoItem.${gb1}.status == ACCEPTED, item_kind == GATE_BAG, assigned_compartment_id == ${h41}"
            - "after GB-0001: LoadPlan.${lp1}.planned_payload_kg == 13020.00 and LoadPlan.${lp1}.underload_kg == 0.00"
            - "after GB-0001: LoadPlan.${lp1}.zero_fuel_weight_kg == 55570.00 and LoadPlan.${lp1}.index_zfw == 83.20 and LoadPlan.${lp1}.mac_zfw_pct == 14.22"
            - "after GB-0001: LoadPlan.${lp1}.takeoff_weight_kg == 65120.00, exactly Flight.${f1}.performance_limited_takeoff_weight_kg"
            - "after GB-0001: LoadPlan.${lp1}.index_tow == 91.80, mac_tow_pct == 15.28, envelope_ok == true"
            - "after GB-0001: LoadPlan.${lp1}.base_payload_kg == 12820.00 and frozen_underload_kg == 200.00 (both frozen)"
            - "after GB-0002: the call returns 201, CargoItem.${gb2}.status == DEFERRED and assigned_compartment_id == null"
            - "after GB-0002: LoadPlan.${lp1}.deferred_bag_weight_kg == 1.00"
            - "after GB-0002: LoadPlan.${lp1}.planned_payload_kg == 13020.00, underload_kg == 0.00, index_tow == 91.80 (unchanged)"

      - name: empty_plan_zero_payload_compute
        metric: "the zero-row aggregate of calculate_base_payload together with the inactive branch of the takeoff aft knee, at 1.01 %MAC of forward margin"
        endpoint: "POST /load-plans/{id}/compute"
        boundary: "base_payload_kg == 0.00 with no pax line, no bag allocation and no cargo; takeoff_weight_kg 52100.00 sits below tow_knee_weight_kg 60000, so the -1.5 knee adjustment must NOT be applied"
        grounds:
          - calculations.calculate_base_payload
          - calculations.calculate_balance_chain
          - entities.Aircraft.fields.tow_knee_weight_kg
        distinguishing_aspect: |
          A third metric on a third endpoint. An empty plan is legal and must
          compute rather than fail: every sum is the identity 0.00, index_zfw
          collapses to Flight.dry_operating_index exactly (62.53), and mac_zfw_pct
