# =============================================================================
# Translation & Localization Services — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Translation & Localization Services: project & language pair, word-count/page
  quote & rate, linguist/reviewer assignment, translation-memory match discount,
  QA & revision, rush tier, certification/notarized add-on, delivery & invoice

domain_name: translation-localization-services
api_prefix: ""   # flat topology: every entity is a top-level collection (/clients, /linguists, /projects, …)

# Structural DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine          # word/page quote, TM-match discount, rush tier, cert add-on, rounding traps
  secondary_archetype: workflow_orchestration # quote → assign → translate → QA/revise → certify → deliver → invoice
  complexity_layers:
    - dual_variant_calculation   # quote estimate vs final invoice; provisional vs final linguist payout
    - optimistic_concurrency     # reviewer (re)assignment supersede on a stale ProjectJob version
    - cascading_side_effects     # QA fail → revision round → job reopens → linguist payable reverts → invoice blocked
    - rate_threshold_triggers    # volume discount tier, rush multiplier, QA pass threshold, free-revision threshold
    - derived_field_reconciliation # client.ar_balance_cents, linguist.committed_payout_cents kept consistent

  entity_topology: flat          # peer entities linked by FK; no nesting beyond /projects/{id}
  state_machine_shape: cyclic    # QA → REVISION → TRANSLATING revision loop on ProjectJob; parallel cert dimension
  relationship_patterns:
    - one_to_many                # Project 1—* ProjectJob; ProjectJob 1—* Assignment, 1—* QAReport
    - cross_aggregate            # Assignment → Linguist; Invoice → Client; QAReport → ProjectJob
  role_model: segregation_of_duties  # the linguist who translated a job cannot review it; AR cannot do PM ops
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization name" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient email" }
      - { name: ar_balance_cents, type: integer, source: computed, default: 0, description: "Derived: sum of total_cents over this client's ISSUED (non-VOIDED) Invoices. Reconciled on invoice ISSUE/VOID." }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new project creation" }

  - name: Linguist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Linguist display name" }
      - { name: native_locale, type: string, source: input, description: "BCP-47 locale the linguist translates INTO, e.g. de-DE" }
      - { name: qualified_pairs, type: array, source: input, description: "Array of {source_locale, target_locale} pairs this linguist may be assigned" }
      - { name: can_review, type: boolean, source: input, default: false, description: "Whether this linguist is certified to act in the REVIEWER role" }
      - { name: daily_throughput_words, type: integer, source: input, default: 2500, description: "Max weighted source words this linguist can be committed to per UTC calendar day across overlapping assignment windows" }
      - { name: committed_payout_cents, type: integer, source: computed, default: 0, description: "Derived: running sum of PayoutLedgerEntry.amount_cents over this linguist's entries (equivalently, sum of payout_cents over Assignments in {ACCEPTED, IN_PROGRESS, DELIVERED}). Reconciled on assignment accept/supersede/cancel/deliver." }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE — INACTIVE linguists cannot receive new assignments" }

  - name: RateCard
    parent: null
    common_fields: false
    fields:
      - { name: source_locale, type: string, source: input, description: "Source BCP-47 locale, e.g. en-US" }
      - { name: target_locale, type: string, source: input, description: "Target BCP-47 locale, e.g. de-DE" }
      - { name: base_rate_cents_per_word, type: integer, source: input, description: "Per-source-word base rate before TM-match weighting" }
      - { name: linguist_rate_cents_per_word, type: integer, source: input, description: "Per-weighted-word rate paid to the translating linguist" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether this rate card may be referenced by new projects" }
    note: "Immutable config; one active card per (source_locale, target_locale)."

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; pins source_locale, target_locale, and rates at creation" }
      - { name: name, type: string, source: input, description: "Project title" }
      - { name: rush_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | EXPRESS | SAME_DAY — surcharge multiplier applied to translation subtotal" }
      - { name: certification_mode, type: enum, source: input, default: "NONE", description: "NONE | CERTIFIED | NOTARIZED — per-page add-on, plus notary flat for NOTARIZED" }
      - { name: pinned_base_rate_cents_per_word, type: integer, source: system, description: "Snapshot of RateCard.base_rate_cents_per_word at creation" }
      - { name: pinned_linguist_rate_cents_per_word, type: integer, source: system, description: "Snapshot of RateCard.linguist_rate_cents_per_word at creation" }
      - { name: quoted_total_cents, type: integer, source: computed, default: null, description: "Provisional estimate produced by the quote calculation; null until quoted" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | QUOTED | APPROVED | IN_PRODUCTION | DELIVERED | INVOICED | CANCELLED" }

  - name: ProjectJob
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: filename, type: string, source: input, description: "Source asset filename" }
      - { name: quoted_no_match_words, type: integer, source: input, default: 0, description: "Analyzed NO_MATCH words at quote time" }
      - { name: quoted_fuzzy_words, type: integer, source: input, default: 0, description: "Analyzed FUZZY_75_99 words at quote time" }
      - { name: quoted_reps_words, type: integer, source: input, default: 0, description: "Analyzed REPS_100 words at quote time" }
      - { name: quoted_context_words, type: integer, source: input, default: 0, description: "Analyzed CONTEXT_101 words at quote time" }
      - { name: actual_no_match_words, type: integer, source: system, default: null, description: "Re-analyzed NO_MATCH words recorded at delivery; null until delivered" }
      - { name: actual_fuzzy_words, type: integer, source: system, default: null, description: "Re-analyzed FUZZY_75_99 words at delivery" }
      - { name: actual_reps_words, type: integer, source: system, default: null, description: "Re-analyzed REPS_100 words at delivery" }
      - { name: actual_context_words, type: integer, source: system, default: null, description: "Re-analyzed CONTEXT_101 words at delivery" }
      - { name: weighted_source_words, type: number, source: computed, description: "Sum of band words * pay_factor over the bands in effect (quoted before delivery, actual after)" }
      - { name: revision_rounds, type: integer, source: system, default: 0, description: "Count of QA-fail-triggered revision rounds completed on this job" }
      - { name: latest_qa_score, type: number, source: computed, default: null, description: "Score of the most recent QAReport for this job; null until first QA" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | TRANSLATING | IN_QA | REVISION | QA_PASSED | DELIVERED | CANCELLED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ProjectJob.id" }
      - { name: linguist_id, type: string, source: input, description: "FK -> Linguist.id" }
      - { name: role, type: enum, source: input, description: "TRANSLATOR | REVIEWER — segregation: REVIEWER linguist_id must differ from the job's active TRANSLATOR linguist_id" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the linguist's committed work window" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end (exclusive) of the work window; must be > window_start" }
      - { name: payout_cents, type: integer, source: computed, description: "Provisional (at accept) or final (at deliver) linguist payout; see linguist_payout calc" }
      - { name: payout_finalized, type: boolean, source: system, default: false, description: "False while provisional, true once the final payout variant has been applied at job delivery" }
      - { name: expected_job_version, type: integer, source: input, description: "OCC token: the ProjectJob.version the client last observed; checked on assignment create" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | IN_PROGRESS | DELIVERED | DECLINED | SUPERSEDED | CANCELLED" }

  - name: QAReport
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ProjectJob.id" }
      - { name: reviewer_assignment_id, type: string, source: input, description: "FK -> Assignment.id; must be a REVIEWER assignment in IN_PROGRESS on this job" }
      - { name: critical_count, type: integer, source: input, default: 0, description: "Count of CRITICAL severity errors found" }
      - { name: major_count, type: integer, source: input, default: 0, description: "Count of MAJOR severity errors found" }
      - { name: minor_count, type: integer, source: input, default: 0, description: "Count of MINOR severity errors found" }
      - { name: scored_word_count, type: integer, source: input, description: "Word base over which the error density is normalized; must be > 0" }
      - { name: score, type: number, source: computed, description: "weighted_scoring result; see qa_score calc" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL — PASS iff score >= QA_PASS_THRESHOLD" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the project" }
      - { name: translation_subtotal_cents, type: integer, source: computed, description: "Per-band-rounded sum of actual translation labor before discounts/surcharges" }
      - { name: volume_discount_cents, type: integer, source: computed, description: "Amount removed by the volume discount tier" }
      - { name: rush_surcharge_cents, type: integer, source: computed, description: "Amount added by the rush multiplier" }
      - { name: revision_surcharge_cents, type: integer, source: computed, description: "Amount added for chargeable revision rounds beyond the free allowance" }
      - { name: certification_cents, type: integer, source: computed, description: "Per-page certification plus notary flat, per certification_mode" }
      - { name: total_cents, type: integer, source: computed, description: "Final invoiced amount; see final_invoice calc" }
      - { name: expected_project_version, type: integer, source: input, description: "OCC token: the Project.version the client last observed; checked on invoice issue" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | PAID | VOIDED" }

  - name: PayoutLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: linguist_id, type: string, source: system, description: "FK -> Linguist.id" }
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; the assignment whose payout this entry commits or reverts" }
      - { name: entry_type, type: enum, source: system, description: "COMMIT | REVERSAL | FINAL_ADJUST — COMMIT on accept, REVERSAL on supersede/cancel, FINAL_ADJUST on job deliver" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive for COMMIT and positive FINAL_ADJUST, negative for REVERSAL and negative FINAL_ADJUST; the running sum equals Linguist.committed_payout_cents" }
      - { name: reason, type: string, source: system, description: "Human-readable cause, e.g. 'assignment accepted', 'superseded by replacement', 'final payout delta at delivery'" }
    note: "Append-only event log; Linguist.committed_payout_cents is the running sum of amount_cents over the linguist's entries. common_fields:false → id + created_at only; created_at ASC is the canonical replay order."

  - name: DeliveryCertificate
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> ProjectJob.id; the delivered job this certificate attests" }
      - { name: certification_mode, type: enum, source: system, description: "CERTIFIED | NOTARIZED — copied from the project at delivery; never NONE (no certificate is minted for NONE projects)" }
      - { name: page_count, type: integer, source: computed, description: "ceil(actual total source words / WORDS_PER_PAGE) for the job at delivery" }
      - { name: certificate_number, type: string, source: system, description: "Sequential per-project attestation number, assigned in job created_at ASC order among the project's certified deliveries" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /projects/{projectId}/quote"
        actor: ProjectManager
        preconditions:
          - "Project has >= 1 ProjectJob (ERR_NO_JOBS)"
          - "Every ProjectJob has quoted band words summing to > 0 (ERR_EMPTY_ANALYSIS)"
        side_effects:
          - "Run quote_estimate over all jobs; set Project.quoted_total_cents"
          - "Each ProjectJob.weighted_source_words computed from quoted bands"

      - from: QUOTED
        to: DRAFT
        trigger: "POST /projects/{projectId}/jobs (adding a job re-opens the quote)"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "Project.quoted_total_cents reset to null"

      - from: QUOTED
        to: APPROVED
        trigger: "POST /projects/{projectId}/approve"
        actor: Client
        preconditions:
          - "Acting Client owns the project (project.client_id == X-User-ID) (ERR_FORBIDDEN_FOR_ROLE)"
          - "Project.quoted_total_cents is not null (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "system (automatic when the first TRANSLATOR Assignment on any job is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PRODUCTION
        to: DELIVERED
        trigger: "system (automatic when every non-CANCELLED ProjectJob is DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DELIVERED
        to: INVOICED
        trigger: "system (automatic when the project's Invoice transitions to ISSUED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INVOICED
        to: DELIVERED
        trigger: "system (automatic when the project's ISSUED Invoice is VOIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Project re-opened for re-invoicing after a void"
        note: "Compensation revert: lets AR issue a corrected invoice; INVOICED is therefore not strictly terminal while a void is possible."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Cascade-cancel all ProjectJobs not already terminal"]

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Cascade-cancel all ProjectJobs not already terminal"]

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No Invoice in ISSUED/PAID exists for this project (ERR_PROJECT_HAS_INVOICE)"
        side_effects:
          - "Cascade-cancel all ProjectJobs not already terminal"
          - "For each cascade-cancelled job: SUPERSEDED/cancel its active Assignments and revert linguist.committed_payout_cents"

      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /projects/{projectId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No Invoice in ISSUED/PAID exists for this project (ERR_PROJECT_HAS_INVOICE)"
        side_effects:
          - "Cascade-cancel all ProjectJobs not already terminal"
          - "For each cascade-cancelled job: cancel its active Assignments and revert linguist.committed_payout_cents"

  - entity: ProjectJob
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING
        to: TRANSLATING
        trigger: "system (automatic when this job's TRANSLATOR Assignment is ACCEPTED)"
        actor: system
        preconditions:
          - "Parent Project is APPROVED or IN_PRODUCTION (ERR_PROJECT_NOT_APPROVED)"
        side_effects: ["increments ProjectJob.version by 1"]

      - from: TRANSLATING
        to: IN_QA
        trigger: "POST /jobs/{jobId}/submit-translation"
        actor: Translator
        preconditions:
          - "Acting linguist is the job's ACCEPTED/IN_PROGRESS TRANSLATOR (ERR_NOT_ASSIGNED_TRANSLATOR)"
          - "A REVIEWER Assignment in IN_PROGRESS exists for this job (ERR_NO_REVIEWER_ASSIGNED)"
        side_effects: ["increments ProjectJob.version by 1"]

      - from: IN_QA
        to: QA_PASSED
        trigger: "system (automatic when a QAReport with outcome PASS is filed)"
        actor: system
        preconditions: []
        side_effects:
          - "Set ProjectJob.latest_qa_score = report.score"
          - "increments ProjectJob.version by 1"

      - from: IN_QA
        to: REVISION
        trigger: "system (automatic when a QAReport with outcome FAIL is filed)"
        actor: system
        preconditions: []
        side_effects:
          - "Set ProjectJob.latest_qa_score = report.score"
          - "increments ProjectJob.version by 1"

      - from: REVISION
        to: IN_QA
        trigger: "POST /jobs/{jobId}/submit-translation"
        actor: Translator
        preconditions:
          - "Acting linguist is the job's ACCEPTED/IN_PROGRESS TRANSLATOR (ERR_NOT_ASSIGNED_TRANSLATOR)"
        side_effects:
          - "ProjectJob.revision_rounds += 1"
          - "increments ProjectJob.version by 1"
        note: "Cyclic loop: REVISION → IN_QA → REVISION until a QAReport passes."

      - from: QA_PASSED
        to: DELIVERED
        trigger: "POST /jobs/{jobId}/deliver"
        actor: ProjectManager
        preconditions:
          - "Job is QA_PASSED (ERR_INVALID_STATE)"
          - "actual band word fields provided in body, summing to > 0 (ERR_EMPTY_ANALYSIS)"
        side_effects:
          - "Record actual_*_words; recompute weighted_source_words from actual bands"
          - "Finalize the TRANSLATOR Assignment: recompute payout via final variant, set payout_finalized=true, status DELIVERED"
          - "Append a FINAL_ADJUST PayoutLedgerEntry (amount_cents = final_payout - provisional_payout, may be negative)"
          - "Reconcile linguist.committed_payout_cents by the provisional→final payout delta"
          - "If project.certification_mode != NONE: mint a DeliveryCertificate (certificate_number sequential per project in job created_at ASC order)"
          - "increments ProjectJob.version by 1"
          - "Bubble up: if every non-CANCELLED job in the project is DELIVERED, Project → DELIVERED"

      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: TRANSLATING
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Cancel active Assignments; revert linguist.committed_payout_cents"

      - from: REVISION
        to: CANCELLED
        trigger: "system (cascade from Project cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Cancel active Assignments; revert linguist.committed_payout_cents"

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DELIVERED, DECLINED, SUPERSEDED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{assignmentId}/accept"
        actor: Translator | Reviewer
        preconditions:
          - "Acting linguist owns the assignment (assignment.linguist_id == X-User-ID) (ERR_FORBIDDEN_FOR_ROLE)"
          - "Linguist.status == ACTIVE (ERR_LINGUIST_INACTIVE)"
          - "Parent Project is APPROVED or IN_PRODUCTION (ERR_PROJECT_NOT_APPROVED)"
        side_effects:
          - "payout_cents = provisional linguist_payout over the job's quoted bands"
          - "Append a COMMIT PayoutLedgerEntry (amount_cents = +payout_cents) for this assignment"
          - "linguist.committed_payout_cents += payout_cents (running sum of the ledger)"
          - "If role==TRANSLATOR: drive ProjectJob PENDING→TRANSLATING and Project APPROVED→IN_PRODUCTION"

      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "system (automatic on accept; IN_PROGRESS once job is TRANSLATING/IN_QA)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{assignmentId}/decline"
        actor: Translator | Reviewer
        preconditions:
          - "Acting linguist owns the assignment (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []

      - from: OFFERED
        to: SUPERSEDED
        trigger: "system (automatic when a replacement Assignment of the same role is created on the job)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (automatic when a replacement Assignment of the same role is created on the job)"
        actor: system
        preconditions: []
        side_effects:
          - "Compensation: append a REVERSAL PayoutLedgerEntry (amount_cents = -payout_cents)"
          - "linguist.committed_payout_cents -= payout_cents (revert the provisional commitment)"

      - from: IN_PROGRESS
        to: SUPERSEDED
        trigger: "system (automatic when a replacement Assignment of the same role is created on the job)"
        actor: system
        preconditions: []
        side_effects:
          - "Compensation: append a REVERSAL PayoutLedgerEntry (amount_cents = -payout_cents)"
          - "linguist.committed_payout_cents -= payout_cents"

      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "system (automatic when the job is DELIVERED — TRANSLATOR assignment only)"
        actor: system
        preconditions: []
        side_effects: ["payout_cents recomputed via final variant; payout_finalized=true"]

      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (cascade from job/project cancel)"
        actor: system
        preconditions: []
        side_effects: ["Append a REVERSAL PayoutLedgerEntry (-payout_cents); linguist.committed_payout_cents -= payout_cents"]

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade from job/project cancel)"
        actor: system
        preconditions: []
        side_effects: ["Append a REVERSAL PayoutLedgerEntry (-payout_cents); linguist.committed_payout_cents -= payout_cents"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/issue"
        actor: AccountsReceivable
        preconditions:
          - "Parent Project is DELIVERED (ERR_PROJECT_NOT_DELIVERED)"
          - "expected_project_version matches Project.version (ERR_STALE_VERSION)"
          - "Client.status == ACTIVE (ERR_CLIENT_SUSPENDED)"
        side_effects:
          - "Run final_invoice over all delivered jobs; set the six computed amount fields and total_cents"
          - "client.ar_balance_cents += total_cents"
          - "increments Project.version by 1"
          - "Bubble up: Project DELIVERED → INVOICED"

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay"
        actor: AccountsReceivable
        preconditions:
          - "Invoice is ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "client.ar_balance_cents -= total_cents"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{invoiceId}/void"
        actor: AccountsReceivable
        preconditions:
          - "Invoice is ISSUED and not PAID (ERR_INVALID_STATE)"
        side_effects:
          - "Compensation: client.ar_balance_cents -= total_cents (return to pre-issue value)"
          - "Project reverts INVOICED → DELIVERED so a corrected invoice can be issued"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /invoices/{invoiceId}/void"
        actor: AccountsReceivable
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1 — OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-job
    parent_entity: ProjectJob
    write_endpoint: "POST /assignments"
    occ_field: "expected_job_version"
    description: |
      Creating an Assignment of a given role against a ProjectJob whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has already created a replacement Assignment
      of the same role (which legitimately supersedes the prior one and bumps the
      job's version), so the current writer's view of the job is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-issue-stale-project
    parent_entity: Project
    write_endpoint: "POST /invoices/{invoiceId}/issue"
    occ_field: "expected_project_version"
    description: |
      Issuing an Invoice against a Project whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already issued (then the project bumped to INVOICED) or another
      invoice cycle advanced the project version, so the current writer's view of
      the project is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_estimate
    trigger: "POST /projects/{projectId}/quote (Project DRAFT→QUOTED)"
    algorithm: forward_looking
    formula: |
      # Provisional estimate over QUOTED bands across all the project's jobs.
      # PINNED EVALUATION ORDER (each step consumes the previous):
      #   step 1: per-job, per-band cents = round_half_up(band_words * pinned_base_rate * PAY_FACTOR[band])
      #           PINNED ROUNDING ORDER: round PER BAND then sum (NOT sum-then-round).
      #   step 2: translation_subtotal = sum over all jobs of all per-band cents
      #   step 3: weighted_words = sum over all jobs of sum(band_words * PAY_FACTOR[band])  (NOT rounded)
      #   step 4: volume_discount_pct = VOLUME_TIER(weighted_words)   # >= boundaries
      #           after_vol = round_half_up(translation_subtotal * (1 - volume_discount_pct))
      #   step 5: after_rush = round_half_up(after_vol * RUSH_MULT[project.rush_tier])
      #   step 6: total_source_words = sum over jobs of (sum of the four band words)
      #           page_count = ceil(total_source_words / WORDS_PER_PAGE)
      #           certification = 0 if NONE
      #                           page_count*CERT_PER_PAGE_CENTS if CERTIFIED
      #                           page_count*CERT_PER_PAGE_CENTS + NOTARY_FLAT_CENTS if NOTARIZED
      #   step 7: quoted_total_cents = after_rush + certification
    input_set: "All ProjectJobs of the project, quoted band fields; pinned_base_rate from project."
    constants:
      PAY_FACTOR: { NO_MATCH: 1.00, FUZZY_75_99: 0.65, REPS_100: 0.35, CONTEXT_101: 0.15 }
      VOLUME_TIER: ">= 20000 -> 0.10 ; >= 5000 -> 0.05 ; else 0.00"
      RUSH_MULT: { STANDARD: 1.00, EXPRESS: 1.30, SAME_DAY: 1.75 }
      WORDS_PER_PAGE: 250
      CERT_PER_PAGE_CENTS: 500
      NOTARY_FLAT_CENTS: 3500
    precision: "Whole cents, round_half_up; round per band then sum (step 1 order is pinned)."
    variants:
      - name: estimate
        when: "At quote time (Project DRAFT→QUOTED)."
        difference: "Uses quoted_* band words; no revision surcharge; written to Project.quoted_total_cents."

  - name: final_invoice
    trigger: "POST /invoices/{invoiceId}/issue (Invoice DRAFT→ISSUED)"
    algorithm: chronological
    formula: |
      # Dual variant of quote_estimate on the Invoice domain — same pinned order
      # (round per band then sum; vol → rush → +revision surcharge → +cert) but:
      #   - uses ACTUAL delivered band words (actual_*_words), not quoted bands.
      #   - inserts a revision surcharge between rush and certification:
      #         chargeable_rounds = max(0, project_total_revision_rounds_for_job - FREE_REVISION_ROUNDS)
      #         revision_surcharge_cents (per job) = round_half_up(job.translation_subtotal_cents
      #                                                            * REVISION_SURCHARGE_PCT * chargeable_rounds)
      #   step 1: per-job per-band cents over actual bands; translation_subtotal_cents = sum
      #   step 2: weighted_words over actual bands; volume_discount_cents = translation_subtotal_cents
      #             - round_half_up(translation_subtotal_cents * (1 - VOLUME_TIER(weighted_words)))
      #   step 3: after_vol = translation_subtotal_cents - volume_discount_cents
      #             rush_surcharge_cents = round_half_up(after_vol * RUSH_MULT) - after_vol
      #   step 4: revision_surcharge_cents = sum over jobs of per-job revision surcharge
      #   step 5: certification_cents from actual total_source_words and certification_mode
      #   step 6: total_cents = after_vol + rush_surcharge_cents + revision_surcharge_cents
      #                         + certification_cents
    input_set: "All DELIVERED ProjectJobs of the project, actual band fields and revision_rounds."
    constants:
      PAY_FACTOR: { NO_MATCH: 1.00, FUZZY_75_99: 0.65, REPS_100: 0.35, CONTEXT_101: 0.15 }
      VOLUME_TIER: ">= 20000 -> 0.10 ; >= 5000 -> 0.05 ; else 0.00"
      RUSH_MULT: { STANDARD: 1.00, EXPRESS: 1.30, SAME_DAY: 1.75 }
      REVISION_SURCHARGE_PCT: 0.08
      FREE_REVISION_ROUNDS: 1
      WORDS_PER_PAGE: 250
      CERT_PER_PAGE_CENTS: 500
      NOTARY_FLAT_CENTS: 3500
    precision: "Whole cents, round_half_up; round per band then sum."
    variants:
      - name: final
        when: "At invoice issue."
        difference: "Vs estimate: actual bands (not quoted), adds revision surcharge; quote_estimate omits it."

  - name: linguist_payout
    trigger: "POST /assignments/{assignmentId}/accept (provisional) and job deliver (final)"
    algorithm: weighted_scoring
    formula: |
      weighted_words = sum over the job's bands of (band_words * PAY_FACTOR[band])
      base = round_half_up(weighted_words * project.pinned_linguist_rate_cents_per_word)
      # PROVISIONAL (variant=provisional, at accept): payout_cents = base over QUOTED bands.
      # FINAL (variant=final, at deliver): base over ACTUAL bands, then quality adjustment
      #   keyed on the job's latest_qa_score:
      #     if latest_qa_score >= QA_BONUS_THRESHOLD: adj = +round_half_up(base * QA_BONUS_PCT)
      #     elif latest_qa_score < QA_REWORK_FLOOR:   adj = -round_half_up(base * QA_PENALTY_PCT)
      #     else: adj = 0
      #   payout_cents = base + adj
      # Reviewer assignments carry payout_cents = 0 (reviewers are not metered here).
    input_set: "TRANSLATOR Assignment's job bands; provisional=quoted, final=actual; latest_qa_score."
    constants:
      PAY_FACTOR: { NO_MATCH: 1.00, FUZZY_75_99: 0.65, REPS_100: 0.35, CONTEXT_101: 0.15 }
      QA_BONUS_THRESHOLD: 95
      QA_REWORK_FLOOR: 80
      QA_BONUS_PCT: 0.05
      QA_PENALTY_PCT: 0.10
    precision: "Whole cents, round_half_up."
    variants:
      - name: provisional
        when: "On assignment accept."
        difference: "Quoted bands, no quality adjustment; committed to linguist.committed_payout_cents."
      - name: final
        when: "On job deliver."
        difference: "Actual bands plus QA quality adjustment; delta reconciled into committed_payout_cents."

  - name: qa_score
    trigger: "POST /jobs/{jobId}/qa-reports (QAReport created)"
    algorithm: weighted_scoring
    formula: |
      weighted_errors = critical_count*CRITICAL_W + major_count*MAJOR_W + minor_count*MINOR_W
      penalty = weighted_errors / scored_word_count * 1000     # errors per 1000 words
      score = round_half_up(100 - penalty, 1)                  # one decimal place
      if score < 0: score = 0.0
      outcome = PASS if score >= QA_PASS_THRESHOLD else FAIL   # >= boundary
    input_set: "Single QAReport's error counts and scored_word_count (> 0)."
    constants:
      CRITICAL_W: 10
      MAJOR_W: 5
      MINOR_W: 1
      QA_PASS_THRESHOLD: 90.0
    precision: "Score to 1 decimal place, round_half_up; floor at 0.0."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC, including ownership for entity-backed roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and FK-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, window_end > window_start, counts >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "Reviewer linguist_id must differ from the job's active TRANSLATOR linguist_id (segregation of duties)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /assignments (role=REVIEWER)"

  - priority: 7
    category: business_referential
    check: "Assigned Linguist must be qualified for the project's (source_locale,target_locale) pair and ACTIVE"
    error_id: ERR_LINGUIST_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 8
    category: business_safety
    check: "QAReport requires job IN_QA and a IN_PROGRESS REVIEWER assignment; reviewer cannot be the translator"
    error_id: ERR_NO_REVIEWER_ASSIGNED
    http_status: 409
    applies_to: "POST /jobs/{jobId}/qa-reports"

  - priority: 9
    category: business_temporal
    check: "Linguist daily committed weighted words (sum over overlapping ACCEPTED/IN_PROGRESS windows on any shared UTC day) must not exceed daily_throughput_words"
    error_id: ERR_THROUGHPUT_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments/{assignmentId}/accept"

  - priority: 10
    category: state
    check: "OCC: expected_<parent>_version must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assignments ; POST /invoices/{invoiceId}/issue"

  - priority: 11
    category: business_fiscal
    check: "Invoice issue requires project DELIVERED and client ACTIVE; cannot invoice a non-delivered project"
    error_id: ERR_PROJECT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /invoices/{invoiceId}/issue"

  - priority: 12
    category: business_temporal
    check: "On a single ProjectJob, a new REVIEWER assignment's [window_start, window_end) must not overlap the job's active (non-terminal) TRANSLATOR assignment window. Half-open intervals: touching at an endpoint (reviewer.window_start == translator.window_end) does NOT overlap; any interior intersection does. This is a per-job interval-collision rule, distinct from the per-day aggregate-capacity rule at priority 9."
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /assignments (role=REVIEWER)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Create a Client"
    roles: [ProjectManager, AccountsReceivable]
    code: 201
    input: [name, billing_email]
    output: Client
    side_effects: ["status=ACTIVE, ar_balance_cents=0"]

  - method: GET
    path: "/clients/{id}"
    description: "Get a Client"
    roles: [ProjectManager, AccountsReceivable, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/suspend"
    description: "Suspend a Client (blocks new projects and invoice issue)"
    roles: [AccountsReceivable]
    code: 200
    input: []
    output: Client
    side_effects: ["status → SUSPENDED"]

  # --- Linguist ---
  - method: POST
    path: "/linguists"
    description: "Register a Linguist"
    roles: [ProjectManager]
    code: 201
    input: [full_name, native_locale, qualified_pairs, "can_review?", "daily_throughput_words?"]
    output: Linguist
    side_effects: ["status=ACTIVE, committed_payout_cents=0"]

  - method: GET
    path: "/linguists/{id}"
    description: "Get a Linguist"
    roles: [ProjectManager, AccountsReceivable, Translator, Reviewer]
    code: 200
    input: []
    output: Linguist
    side_effects: []

  - method: POST
    path: "/linguists/{id}/deactivate"
    description: "Deactivate a Linguist"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Linguist
    side_effects: ["status → INACTIVE"]

  - method: GET
    path: "/linguists/{id}/assignments"
    description: "List Assignments held by a Linguist (FK reverse-reachability for Assignment.linguist_id)"
    roles: [ProjectManager, Translator, Reviewer]
    code: 200
    input: ["status?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/linguists/{id}/payout-ledger"
    description: "List a Linguist's PayoutLedgerEntries in created_at ASC order (FK reverse-reachability for PayoutLedgerEntry.linguist_id)"
    roles: [ProjectManager, Translator, Reviewer]
    code: 200
    input: ["entry_type?"]
    output: "PayoutLedgerEntry[]"
    side_effects: []

  # --- RateCard ---
  - method: POST
    path: "/rate-cards"
    description: "Create a RateCard"
    roles: [ProjectManager]
    code: 201
    input: [source_locale, target_locale, base_rate_cents_per_word, linguist_rate_cents_per_word, "active?"]
    output: RateCard
    side_effects: []

  - method: GET
    path: "/rate-cards/{id}"
    description: "Get a RateCard"
    roles: [ProjectManager, AccountsReceivable]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a Project (DRAFT)"
    roles: [ProjectManager]
    code: 201
    input: [client_id, rate_card_id, name, "rush_tier?", "certification_mode?"]
    output: Project
    side_effects: ["status=DRAFT; pin base/linguist rates from rate card; ERR_CLIENT_SUSPENDED if client not ACTIVE"]

  - method: GET
    path: "/projects/{id}"
    description: "Get a Project"
    roles: [ProjectManager, AccountsReceivable, Client]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List Projects (FK reverse-reachability for Project.client_id and Project.rate_card_id)"
    roles: [ProjectManager, AccountsReceivable]
    code: 200
    input: ["client_id?", "rate_card_id?", "status?"]
    output: "Project[]"
    side_effects: []

  - method: POST
    path: "/projects/{id}/quote"
    description: "Compute the provisional quote (DRAFT→QUOTED)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Run quote_estimate; set quoted_total_cents; compute each job weighted_source_words"]

  - method: POST
    path: "/projects/{id}/approve"
    description: "Client approves the quote (QUOTED→APPROVED)"
    roles: [Client]
    code: 200
    input: []
    output: Project
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a Project"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status → CANCELLED; cascade-cancel jobs; revert linguist commitments"]

  # --- ProjectJob ---
  - method: POST
    path: "/projects/{id}/jobs"
    description: "Add a ProjectJob to a project (re-opens QUOTED→DRAFT)"
    roles: [ProjectManager]
    code: 201
    input: [filename, "quoted_no_match_words?", "quoted_fuzzy_words?", "quoted_reps_words?", "quoted_context_words?"]
    output: ProjectJob
    side_effects: ["status=PENDING; if project QUOTED, reset quoted_total_cents and project→DRAFT"]

  - method: GET
    path: "/projects/{id}/jobs"
    description: "List jobs of a project (FK reverse-reachability for ProjectJob.project_id)"
    roles: [ProjectManager, AccountsReceivable, Client]
    code: 200
    input: ["status?"]
    output: "ProjectJob[]"
    side_effects: []

  - method: GET
    path: "/jobs/{id}"
    description: "Get a ProjectJob"
    roles: [ProjectManager, AccountsReceivable, Translator, Reviewer, Client]
    code: 200
    input: []
    output: ProjectJob
    side_effects: []

  - method: POST
    path: "/jobs/{id}/submit-translation"
    description: "Translator submits translation (TRANSLATING/REVISION → IN_QA)"
    roles: [Translator]
    code: 200
    input: []
    output: ProjectJob
    side_effects: ["status → IN_QA; if from REVISION: revision_rounds += 1; version += 1"]

  - method: POST
    path: "/jobs/{id}/deliver"
    description: "PM delivers a passed job (QA_PASSED → DELIVERED)"
    roles: [ProjectManager]
    code: 200
    input: [actual_no_match_words, actual_fuzzy_words, actual_reps_words, actual_context_words]
    output: ProjectJob
    side_effects:
      - "Record actuals; recompute weighted_source_words"
      - "Finalize translator payout (final variant); reconcile committed_payout_cents"
      - "Append a FINAL_ADJUST PayoutLedgerEntry for the provisional→final payout delta"
      - "If project.certification_mode != NONE: mint a DeliveryCertificate for the job"
      - "Bubble up project to DELIVERED when all jobs delivered"

  - method: GET
    path: "/jobs/{id}/certificate"
    description: "List the DeliveryCertificate(s) minted for a job (FK reverse-reachability for DeliveryCertificate.job_id; 0 or 1 entries)"
    roles: [ProjectManager, AccountsReceivable, Client]
    code: 200
    input: []
    output: "DeliveryCertificate[]"
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/assignments"
    description: "Create an Assignment (OCC on ProjectJob.version)"
    roles: [ProjectManager]
    code: 201
    input: [job_id, linguist_id, role, window_start, window_end, expected_job_version]
    output: Assignment
    side_effects:
      - "status=OFFERED"
      - "Supersede any prior non-terminal Assignment of the same role on the job"
      - "REVIEWER role: reject with ERR_WINDOW_OVERLAP if window overlaps the job's active TRANSLATOR window (half-open)"
      - "increments ProjectJob.version by 1"

  - method: GET
    path: "/assignments/{id}"
    description: "Get an Assignment"
    roles: [ProjectManager, Translator, Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/jobs/{id}/assignments"
    description: "List Assignments for a job (FK reverse-reachability for Assignment.job_id)"
    roles: [ProjectManager, Translator, Reviewer]
    code: 200
    input: ["role?", "status?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}/payout-ledger"
    description: "List PayoutLedgerEntries tied to an Assignment (FK reverse-reachability for PayoutLedgerEntry.assignment_id)"
    roles: [ProjectManager, Translator, Reviewer]
    code: 200
    input: []
    output: "PayoutLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/assignments/{id}/accept"
    description: "Linguist accepts assignment (OFFERED→ACCEPTED)"
    roles: [Translator, Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "payout_cents = provisional linguist_payout; append COMMIT PayoutLedgerEntry; linguist.committed_payout_cents += payout_cents"
      - "If TRANSLATOR: job PENDING→TRANSLATING, project APPROVED→IN_PRODUCTION"

  - method: POST
    path: "/assignments/{id}/decline"
    description: "Linguist declines assignment (OFFERED→DECLINED)"
    roles: [Translator, Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → DECLINED"]

  # --- QAReport ---
  - method: POST
    path: "/jobs/{id}/qa-reports"
    description: "Reviewer files a QA report; drives job IN_QA → QA_PASSED or REVISION"
    roles: [Reviewer]
    code: 201
    input: [reviewer_assignment_id, "critical_count?", "major_count?", "minor_count?", scored_word_count]
    output: QAReport
    side_effects:
      - "Compute score and outcome (qa_score)"
      - "Set job.latest_qa_score; job → QA_PASSED (PASS) or REVISION (FAIL)"
      - "increments ProjectJob.version by 1"

  - method: GET
    path: "/qa-reports/{id}"
    description: "Get a QAReport"
    roles: [ProjectManager, Reviewer, Translator]
    code: 200
    input: []
    output: QAReport
    side_effects: []

  - method: GET
    path: "/jobs/{id}/qa-reports"
    description: "List QA reports for a job (FK reverse-reachability for QAReport.job_id)"
    roles: [ProjectManager, Reviewer, Translator]
    code: 200
    input: ["outcome?"]
    output: "QAReport[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}/qa-reports"
    description: "List QA reports filed under a reviewer Assignment (FK reverse-reachability for QAReport.reviewer_assignment_id)"
    roles: [ProjectManager, Reviewer]
    code: 200
    input: []
    output: "QAReport[]"
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/projects/{id}/invoices"
    description: "Create a draft Invoice for a project"
    roles: [AccountsReceivable]
    code: 201
    input: []
    output: Invoice
    side_effects: ["status=DRAFT; client_id copied from project"]

  - method: GET
    path: "/invoices/{id}"
    description: "Get an Invoice"
    roles: [ProjectManager, AccountsReceivable, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/projects/{id}/invoices"
    description: "List Invoices for a project (FK reverse-reachability for Invoice.project_id)"
    roles: [ProjectManager, AccountsReceivable, Client]
    code: 200
    input: ["status?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List Invoices (FK reverse-reachability for Invoice.client_id via client_id filter)"
    roles: [ProjectManager, AccountsReceivable]
    code: 200
    input: ["client_id?", "project_id?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue an Invoice (DRAFT→ISSUED; OCC on Project.version)"
    roles: [AccountsReceivable]
    code: 200
    input: [expected_project_version]
    output: Invoice
    side_effects:
      - "Run final_invoice; set all amount fields and total_cents"
      - "client.ar_balance_cents += total_cents; increments Project.version by 1; project → INVOICED"

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an Invoice paid (ISSUED→PAID)"
    roles: [AccountsReceivable]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → PAID; client.ar_balance_cents -= total_cents"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an Invoice"
    roles: [AccountsReceivable]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → VOIDED; if was ISSUED: client.ar_balance_cents -= total_cents, project INVOICED→DELIVERED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for this endpoint, or entity-backed owner mismatch (client/linguist acting on a resource they do not own)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or FK-referenced resource does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum, window_end <= window_start, negative counts"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state where the requested transition is allowed"

  - id: ERR_CLIENT_SUSPENDED
    http: 409
    condition: "Client is SUSPENDED; cannot create a project or issue an invoice for it"

  - id: ERR_NO_JOBS
    http: 409
    condition: "Quote attempted on a project with no ProjectJobs"

  - id: ERR_EMPTY_ANALYSIS
    http: 409
    condition: "Quote/deliver with band words summing to 0"

  - id: ERR_PROJECT_NOT_APPROVED
    http: 409
    condition: "Assignment accept / job production attempted while project not APPROVED or IN_PRODUCTION"

  - id: ERR_PROJECT_NOT_DELIVERED
    http: 409
    condition: "Invoice issue attempted while project not DELIVERED"

  - id: ERR_PROJECT_HAS_INVOICE
    http: 409
    condition: "Project cancel blocked because an ISSUED/PAID invoice exists"

  - id: ERR_LINGUIST_INACTIVE
    http: 409
    condition: "Assignment accept by an INACTIVE linguist"

  - id: ERR_LINGUIST_NOT_QUALIFIED
    http: 409
    condition: "Linguist not qualified for the project's source/target locale pair"

  - id: ERR_SEGREGATION_VIOLATION
    http: 409
    condition: "Reviewer assignment names the same linguist as the job's active translator"

  - id: ERR_NO_REVIEWER_ASSIGNED
    http: 409
    condition: "submit-translation or qa-report with no IN_PROGRESS reviewer assignment on the job"

  - id: ERR_NOT_ASSIGNED_TRANSLATOR
    http: 409
    condition: "submit-translation by a linguist who is not the job's active translator"

  - id: ERR_THROUGHPUT_EXCEEDED
    http: 409
    condition: "Accepting the assignment would push a shared UTC day's committed weighted words over the linguist's daily_throughput_words"

  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "A new REVIEWER assignment's half-open window overlaps the job's active TRANSLATOR assignment window on the same ProjectJob"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match the parent's current version"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Operations PM: creates clients/linguists/rate-cards/projects/jobs/assignments, quotes, delivers, cancels"
    identity: opaque
    exclusive_operations:
      - "POST /linguists — Register linguist"
      - "POST /linguists/{id}/deactivate — Deactivate linguist"
      - "POST /rate-cards — Create rate card"
      - "POST /projects — Create project"
      - "POST /projects/{id}/quote — Quote project"
      - "POST /projects/{id}/cancel — Cancel project"
      - "POST /projects/{id}/jobs — Add job"
      - "POST /jobs/{id}/deliver — Deliver job"
      - "POST /assignments — Create assignment"
    shared_operations:
      - "POST /clients — Create client (shared with AccountsReceivable)"
      - "GET endpoints (reads)"

  - name: AccountsReceivable
    description: "Billing: manages invoices and client status; cannot run PM production ops (segregation)"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/suspend — Suspend client"
      - "POST /projects/{id}/invoices — Create draft invoice"
      - "POST /invoices/{id}/issue — Issue invoice"
      - "POST /invoices/{id}/pay — Mark invoice paid"
      - "POST /invoices/{id}/void — Void invoice"
    shared_operations:
      - "POST /clients — Create client (shared with ProjectManager)"
      - "GET endpoints (reads)"

  - name: Client
    description: "Buyer organization; approves quotes and reads its own projects/invoices"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /projects/{id}/approve — Approve quote (must own the project: project.client_id == X-User-ID)"
    shared_operations:
      - "GET own projects/jobs/invoices/client"

  - name: Translator
    description: "Linguist acting in the TRANSLATOR role on their own assignments"
    identity: "entity_backed:Linguist"
    exclusive_operations:
      - "POST /jobs/{id}/submit-translation — Submit translation (must be the job's active translator)"
    shared_operations:
      - "POST /assignments/{id}/accept — Accept own assignment (shared with Reviewer)"
      - "POST /assignments/{id}/decline — Decline own assignment (shared with Reviewer)"
      - "GET own linguist/assignments/jobs/qa-reports"

  - name: Reviewer
    description: "Linguist acting in the REVIEWER role; files QA reports on jobs they did not translate"
    identity: "entity_backed:Linguist"
    exclusive_operations:
      - "POST /jobs/{id}/qa-reports — File QA report (must be the job's active reviewer)"
    shared_operations:
      - "POST /assignments/{id}/accept — Accept own assignment (shared with Translator)"
      - "POST /assignments/{id}/decline — Decline own assignment (shared with Translator)"
      - "GET own linguist/assignments/jobs/qa-reports"
