            - "A COMBINED certificate at this point -> 409 ERR_WEIGHING_SUPERVISION_REQUIRED because the area demands SUPERVISED"
            - "After POST /grain-inspection/inspectors/${insp_s}/training-records (24 hours) and POST /grain-inspection/inspectors/${insp_s}/activate, the identical supervise call -> 200 with status SUPERVISED and weighing_status == SUPERVISED"
            - "The weigher, still PROBATIONARY, was nonetheless allowed to create the weighing record, proving the ACTIVE requirement is specific to the countersignature"

      - name: equipment_expiry_is_driven_by_the_logical_clock
        claim_type: valid_transition
        grounds:
          - "state_machines.Equipment.approval_status.APPROVED_to_EXPIRED"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_instrument_state_check_outranks_portion_exhaustion_constraint
          rationale: "That instance advances the clock past certified_until and asserts approval_status EXPIRED plus the resulting refusal."

      - name: appeal_loop_returns_a_certificate_to_issued
        claim_type: cyclic
        grounds:
