      - name: repair_recomputes_derived_risk_and_rescreens
        claim_type: derived_field_reconciliation
        grounds: ["calculations.risk_score", "state_machines.WireTransfer.PENDING_APPROVAL_to_REPAIR", "entities.WireTransfer.fields.risk_score"]
        distinguishing_aspect: "risk_score is a derived field reconciled on every repair: changing the amount from 100000 to 600000000 re-runs scoring (0->40 band change) and the recompute crossing RISK_REVIEW_THRESHOLD (50) flips screening to REVIEW with an auto-created RISK_THRESHOLD hit."
        test_recipe:
          setup:
            - "Customer CL5 (MEDIUM), Account AL5 (limit 1000000000), Beneficiary BL5 (never used), BusinessDate 2026-10-12 OPEN, Wire WL5 (100000) submitted (risk 10: band 0 + new-beneficiary 10)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Layer Five", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cl5: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cl5}", account_number: "A-L005", daily_outgoing_limit_cents: 1000000000 }, as: WireOpsAdmin, captures: { al5: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cl5}", name: "Layer Ben5", bank_name: "LayerBank5", account_number: "B-L005", country_code: "US" }, as: WireOperator, captures: { bl5: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-12" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${al5}", beneficiary_id: "${bl5}", amount_cents: 100000, method: "Fedwire", purpose: "recompute probe" }, as: WireOperator, as_user_id: "op-1", captures: { wl5: $.data.id } }
            - { call: "POST /wire-ops/wires/${wl5}/submit", payload: { business_date: "2026-10-12" }, as: WireOperator, as_user_id: "op-1", captures: { l5_r0: $.data.risk_score } }
            - { call: "GET /wire-ops/wires/${wl5}", as: WireOperator, captures: { l5_v: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${wl5}/repair", payload: { expected_wire_version: "${l5_v}", amount_cents: 600000000 }, as: RepairSpecialist, as_user_id: "rs-1", captures: { l5_r1: $.data.risk_score, l5_screen: $.data.screening_status } }
            - { call: "GET /wire-ops/wires/${wl5}/sanctions-hits", as: SanctionsScreener, captures: { l5_hit_party: "$.data[0].matched_party", l5_hit_list: "$.data[0].matched_list", l5_hit_score: "$.data[0].match_score" } }
            - { call: "GET /wire-ops/accounts/${al5}", as: WireOperator, captures: { l5_res: $.data.daily_reserved_cents } }
          assert:
            - "Submit risk_score == 10 (${l5_r0}); after amount-changing repair: risk_score == 50 (${l5_r1} = band 40 + new-beneficiary 10)"
            - "Crossing RISK_REVIEW_THRESHOLD (50 >= 50) flips screening_status to REVIEW (${l5_screen}) and auto-creates one OPEN hit: matched_list INTERNAL_WATCH (${l5_hit_list}), matched_party RISK_THRESHOLD (${l5_hit_party}), match_score 50 (${l5_hit_score})"
            - "Reservation re-based: daily_reserved_cents == 600000000 (${l5_res})"

