              payload: { name: "Digital Early", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_ea: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ea}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ea_v: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_ea}/price-change"
              payload: { pending_price_cents: 1799, pending_effective_on: "2026-10-01", grandfather_policy: "GRANDFATHER_EXISTING", expected_offer_plan_version: "${plan_ea_v}" }
              as: RevenueManager
            - call: "POST /paywall/offer-plans/${plan_ea}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /paywall/offer-plans/${plan_ea}/price-change/apply"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { err_early: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_PRICE_CHANGE_NOT_EFFECTIVE_YET"
            - "OfferPlan.${plan_ea}.price_change_state == NOTICE_SENT"
            - "OfferPlan.${plan_ea}.standard_price_cents == 1499"
            - "OfferPlan.${plan_ea}.notice_sent_on == 2026-09-01"

      - name: price_change_apply_updates_standard_price_and_clears_pending
        claim_type: side_effect_execution
        grounds:
          - state_machines.OfferPlan.NOTICE_SENT_to_APPLIED
          - endpoints[POST /paywall/offer-plans/{id}/price-change/apply]
        distinguishing_aspect: "On the effective date and with a different officer applying, standard_price_cents must become 1799, price_change_state APPLIED and the pending fields cleared - all three side effects in one call."
        test_recipe:
          setup:
            - "One ACTIVE DIGITAL_ONLY plan with a price change to 1799 effective 2026-10-01, notices dispatched on 2026-09-01 by officer-1, clock moved to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Apply", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_ap: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ap}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ap_v: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_ap}/price-change"
              payload: { pending_price_cents: 1799, pending_effective_on: "2026-10-01", grandfather_policy: "GRANDFATHER_EXISTING", expected_offer_plan_version: "${plan_ap_v}" }
              as: RevenueManager
            - call: "POST /paywall/offer-plans/${plan_ap}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /paywall/offer-plans/${plan_ap}/price-change/apply"
              payload: {}
