        payload: {}
        as: ContractApprover
        as_user_id: ca-01
      - call: POST /programs
        payload:
          name: FY27 Chairmans Club
          fiscal_year: 2027
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2027-01-01T00:00:00Z'
          sales_period_end: '2027-06-30T00:00:00Z'
          budget_total_cents: 4000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p2_id: $.data.id
      trigger:
      - 'POST /qualifiers {"program_id": "${p_id}", "employee_code": "S-1001", "full_name": "Ana Reyes
        Duplicate", "baseline_metric": 10000000, "actual_metric": 260000000} as SalesOpsAnalyst so-01.'
      - 'POST /award-tiers {"program_id": "${p_id}", "tier_code": "PLATINUM", "tier_rank": 9, "qualification_threshold":
        900000000, "budget_per_qualifier_cents": 100000, "air_cabin_class": "ECONOMY"} as ProgramDirector
        pd-01.'
      - 'POST /award-tiers {"program_id": "${p_id}", "tier_code": "SILVER", "tier_rank": 1, "qualification_threshold":
        900000000, "budget_per_qualifier_cents": 100000, "air_cabin_class": "ECONOMY"} as ProgramDirector
        pd-01.'
      - 'POST /deposit-milestones {"contract_id": "${c1_id}", "sequence": 1, "due_at": "2026-08-20T00:00:00Z",
        "amount_cents": 1, "refundable_bp": 0} as SourcingManager sm-01.'
      - 'POST /qualifiers {"program_id": "${p2_id}", "employee_code": "S-1001", ...} and POST /award-tiers
        {"program_id": "${p2_id}", "tier_code": "PLATINUM", "tier_rank": 1, ...} as the same users — the
        per-parent scoping contrast.'
      assert:
      - The duplicate employee_code is rejected with ERR_DUPLICATE_EMPLOYEE_CODE and HTTP 409.
      - The duplicate tier_code is rejected with ERR_DUPLICATE_TIER_KEY and HTTP 409, even though its
        tier_rank 9 is free.
      - The duplicate tier_rank is rejected with ERR_DUPLICATE_TIER_KEY and HTTP 409, even though its
        tier_code "SILVER" is free — the rule is two separate keys, not one composite.
      - The duplicate milestone sequence is rejected with ERR_DUPLICATE_MILESTONE_SEQUENCE and HTTP 409
        before the aggregate schedule check at priority 28 can see the 1-cent amount.
      - 'The same employee_code S-1001 under ${p2_id} returns 201, and the same tier_code PLATINUM with
        tier_rank 1 under ${p2_id} returns 201: all three keys are scoped per parent.'
      - GET /qualifiers?program_id=${p_id} still returns total_count 2 and GET /award-tiers?program_id=${p_id}
        still returns total_count 2 — no rejected write left a row behind.
      - 'Each error body carries the §1.0 error envelope: response_type "error", a non-empty data.error_id
        and data.message, plus meta.api_request_id and meta.api_request_timestamp.'
  - name: uniqueness_violations_on_winner_registration_and_activity_signup
    claim_type: violation_to_error
    grounds:
    - §1.4 priority 22 (ERR_DUPLICATE_WINNER_REGISTRATION, ERR_DUPLICATE_ACTIVITY_SIGNUP)
    - §1.1 Registration.registration_kind, ActivitySignup.status
    - §1.5 POST /registrations, POST /activity-signups, POST /activity-signups/{signup_id}/cancel
    distinguishing_aspect: |
      The other two keys of priority 22 are the only ones qualified by "non-CANCELLED", which
      makes them behave differently from the three static keys in the first instance: the same
      pair may be re-created after a cancellation. This instance triggers both collisions and
      then shows both keys releasing — a GUEST registration for the same qualifier is accepted
      because the key is scoped to registration_kind WINNER, and a cancelled signup frees its
      pair. It must be ordered rather than parallel because POST /registrations requires
      REGISTRATION_OPEN while POST /activity-signups requires ONSITE.
