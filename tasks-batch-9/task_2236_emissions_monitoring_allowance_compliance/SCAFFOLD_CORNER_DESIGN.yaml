      - name: val_allowance_proposal_guards_are_all_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=400]
          - validations[priority=405]
          - validations[priority=410]
          - errors[ERR_INVALID_QUANTITY]
          - errors[ERR_PENALTY_TRANSACTION_NOT_CLIENT_CREATABLE]
          - errors[ERR_INVALID_COUNTERPARTY]
        distinguishing_aspect: "Proposal-time guards fire in their declared order: zero tonnage is ERR_INVALID_QUANTITY, a client-authored PENALTY_DEDUCTION is refused outright, a TRANSFER_OUT without a counterparty and a PURCHASE with one are both ERR_INVALID_COUNTERPARTY, and a cross-program counterparty is refused too."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "facility A with an ARP_SO2 2026 account and a CSAPR_SO2_G1 2026 account"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2", "CSAPR_SO2_G1"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 10.000, holdings_prior_vintage_tons: 0.000, holdings_next_vintage_tons: 0.000 }
              as: RegulatoryReviewer
              captures: { arp_id: $.data.id, arp_v1: $.data.version }
            - call: "POST /emissions/facilities/${fac_id}/allowance-accounts"
              payload: { program: "CSAPR_SO2_G1", compliance_year: 2026, holdings_current_vintage_tons: 4.000, holdings_prior_vintage_tons: 0.000, holdings_next_vintage_tons: 0.000 }
              as: RegulatoryReviewer
              captures: { csapr_id: $.data.id }
          trigger:
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${arp_v1}", allowance_account_id: "${arp_id}", transaction_type: "PURCHASE", quantity_tons: 0.000, vintage_year: 2026 }
              as: AllowanceTrader
              captures: { e_qty: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${arp_v1}", allowance_account_id: "${arp_id}", transaction_type: "PENALTY_DEDUCTION", quantity_tons: 2.000, vintage_year: 2027 }
              as: AllowanceTrader
              captures: { e_penalty: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${arp_v1}", allowance_account_id: "${arp_id}", transaction_type: "TRANSFER_OUT", quantity_tons: 2.000, vintage_year: 2026 }
              as: AllowanceTrader
              captures: { e_no_cpty: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${arp_v1}", allowance_account_id: "${arp_id}", transaction_type: "PURCHASE", quantity_tons: 2.000, vintage_year: 2026, counterparty_account_id: "${csapr_id}" }
              as: AllowanceTrader
              captures: { e_extra_cpty: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${arp_v1}", allowance_account_id: "${arp_id}", transaction_type: "TRANSFER_OUT", quantity_tons: 2.000, vintage_year: 2026, counterparty_account_id: "${csapr_id}" }
              as: AllowanceTrader
              captures: { e_cross_program: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${arp_v1}", allowance_account_id: "${arp_id}", transaction_type: "TRANSFER_OUT", quantity_tons: 2.000, vintage_year: 2026, counterparty_account_id: "${arp_id}" }
              as: AllowanceTrader
              captures: { e_self: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 422 with error_id == ERR_INVALID_QUANTITY — zero tonnage is not a transaction"
            - "trigger 2 returns HTTP 422 with error_id == ERR_PENALTY_TRANSACTION_NOT_CLIENT_CREATABLE"
            - "trigger 3 returns HTTP 422 with error_id == ERR_INVALID_COUNTERPARTY — TRANSFER_OUT requires one"
            - "trigger 4 returns HTTP 422 with error_id == ERR_INVALID_COUNTERPARTY — PURCHASE forbids one"
            - "trigger 5 returns HTTP 422 with error_id == ERR_INVALID_COUNTERPARTY — ARP_SO2 allowances may not move into a CSAPR_SO2_G1 account"
            - "trigger 6 returns HTTP 422 with error_id == ERR_INVALID_COUNTERPARTY — the counterparty must differ from the account"
            - "no AllowanceTransaction row exists: GET /emissions/allowance-transactions?allowance_account_id=${arp_id} returns total_count == 0"
            - "AllowanceAccount.${arp_id}.version == ${arp_v1} and holdings_current_vintage_tons == 10.000"

