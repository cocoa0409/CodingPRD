          - "endpoints[POST /clawback-settlements/{id}/propose]"
          - "endpoints[POST /clawback-settlements/{id}/settle]"
        distinguishing_aspect: "The proposer cannot choose the number: the uncapped 190000, one cent above the cap and one cent below it are all refused, and only the exact recomputed 36000 passes -- at both propose and settle, so the settle step re-derives it rather than trusting the PROPOSED row."
