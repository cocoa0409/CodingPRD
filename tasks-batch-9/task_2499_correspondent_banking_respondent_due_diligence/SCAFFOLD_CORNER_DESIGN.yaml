      - name: reverting_a_disclosed_nested_row_is_a_child_state_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - state_machines.NestedRelationship.state
          - errors[ERR_INVALID_NESTED_STATE]
        distinguishing_aspect: "REVERT is declared only as the inverse of CONFIRM, i.e. from CONFIRMED. A row that is merely DISCLOSED has nothing to revert, so the adjudication endpoint must answer 409 ERR_INVALID_NESTED_STATE and leave nested_exposure_units untouched instead of silently re-running the exposure rollup."
