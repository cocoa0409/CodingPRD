  # =======================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: press_pause_resume_preserves_lot_total
        grounds:
          - state_machines.PressBatch.PRESSING_to_PLANNED
          - state_machines.HarvestLot
        distinguishing_aspect: |
          Conserved quantity: HarvestLot.pressed_weight_lbs + unpressed_
          weight_lbs == weight_lbs (INVARIANT across press/unpress).
          Forward action: PressBatch start consumes 8000 lbs (pressed=8000,
          unpressed=0). Compensating: pause returns (pressed=0, unpressed=
          8000). Sum unchanged = 8000 throughout.
        test_recipe:
          setup:
            - "Lot h16 weight=8000, no prior consumption"
            - "pb16 PLANNED with BlendLine(h16, 8000)"
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "V16", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { v16: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "G16", region_code: "NY", season_year: 2026, committed_weight_lbs: 8000, price_per_lb_cents: 90, shortfall_penalty_cents_per_lb: 30 }
              as: OrchardManager
              captures: { c16: $.data.id, c16_v: $.data.version }
            - call: "POST /cidery/contracts/${c16}/activate"
              payload: { expected_contract_version: "${c16_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c16}/harvest-lots"
              payload: { variety_id: "${v16}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 8000, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { h16: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 120
                blend_lines:
                  - { harvest_lot_id: "${h16}", weight_lbs: 8000, position: 1 }
              as: CellarLead
              captures: { pb16: $.data.id }
          trigger:
            - call: "POST /cidery/press-batches/${pb16}/start"
              payload: {}
              as: CellarLead
            - call: "GET /cidery/harvest-lots/${h16}"
              payload: {}
              as: CellarLead
              captures: { h16_after_start: $.data }
            - call: "POST /cidery/press-batches/${pb16}/pause"
              payload: { reason: "test invariant" }
              as: CellarLead
            - call: "GET /cidery/harvest-lots/${h16}"
              payload: {}
              as: CellarLead
              captures: { h16_after_pause: $.data }
          assert:
            - "h16_after_start.pressed_weight_lbs + h16_after_start.unpressed_weight_lbs == 8000"
            - "h16_after_start.pressed_weight_lbs == 8000"
            - "h16_after_pause.pressed_weight_lbs + h16_after_pause.unpressed_weight_lbs == 8000"
            - "h16_after_pause.pressed_weight_lbs == 0   # compensating action restores"

      - name: packaging_and_dump_preserve_batch_volume_conservation
        grounds:
          - state_machines.FermentationBatch
          - state_machines.PackagingRun.SCHEDULED_to_COMPLETED
          - state_machines.Tank
        distinguishing_aspect: |
          Different conserved quantity: FermentationBatch.volume_liters +
          cumulative_packaged_volume_across_COMPLETED_runs + dumped_volume
          == press_batch.actual_juice_liters (INITIAL volume). Forward:
          package 30 of 50. Compensating: dump remaining 20. Initial=50,
          packaged=30, dumped=20; 0+30+20 = 50 conserved. Different
          quantity than fruit weight.
        test_recipe:
          setup:
            - "fb17 READY volume=50 (from 50 L press)"
