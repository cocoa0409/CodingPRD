              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 4500000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Kestrel Claims Services", settlement_authority_cents: 2500000, hourly_rate_cents: 18000, engagement_start: "2026-08-01", engagement_end: "2026-08-31" }
              as: AssociationAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /claims/${clm_id}/recommend"
              payload: { recommended_amount_cents: 2400000 }
              as: ClaimsAdjuster
              as_user_id: "${asg_id}"
            - call: "POST /claims/${clm_id}/approve"
              payload: {}
              as: ClaimsCommitteeOfficer
              as_user_id: "officer-1"
            - call: "POST /insolvencies/${ins_id}/estate-remittances"
              payload: { amount_cents: 3000000, remittance_ref: "EA-2026-01" }
              as: ReceiverLiaison
            - call: "GET /insolvencies/${ins_id}"
              payload: {}
