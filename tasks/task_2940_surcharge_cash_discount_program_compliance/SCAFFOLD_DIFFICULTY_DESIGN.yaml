            - "GET /disclosure-artifacts?program_id=${prog_id}&state=ATTESTED returns total_count == 3"

      - name: rate_rule_closed_windows_reject_adjacency_and_require_thirty_day_buffer
        grounds:
          - calculations.rate_window_separation
          - validations[priority=92]
          - errors[ERR_RATE_WINDOW_BUFFER_VIOLATION]
          - entities.BrandRateRule.fields.effective_from
          - entities.BrandRateRule.fields.effective_to
          - concurrency_rules[rate-rule-create-stale-program]
        distinguishing_aspect: |
          The same "windows on one resource" shape with the OPPOSITE adjacency verdict and a non-zero required
          separation: BrandRateRule intervals are CLOSED and peers of the same (brand, product_tier) must be at
          least RATE_CHANGE_BUFFER_DAYS = 30 days apart, so a candidate starting one day after the incumbent ends
          is rejected while a candidate starting exactly 30 days after it is accepted; changing only the brand
          removes the constraint entirely.
