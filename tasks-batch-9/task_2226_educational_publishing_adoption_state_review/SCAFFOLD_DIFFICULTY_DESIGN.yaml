  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: content_edit_apply_four_hop_staleness_cascade
        grounds:
          - state_machines.ContentEdit.APPROVED_to_APPLIED
          - state_machines.PresentationSlot.RESERVED_to_CANCELLED
          - state_machines.Submission.review_status=SCHEDULED_to_review_status=FILED
          - entities.Submission.fields.content_pin_stale
          - entities.CommitteePanel.fields.reserved_minutes
        distinguishing_aspect: |
          Depth-4 chain from POST /content-edits/{id}/apply: HOP 1 bumps Title.content_revision to 2;
          BECAUSE of that bump HOP 2 sets Submission.content_pin_stale true and adoption_blocked true;
          BECAUSE of that flag HOP 3 cancels the RESERVED slot and releases 30 panel minutes; BECAUSE
          the slot left the live set HOP 4 walks review_status SCHEDULED -> FILED and decrements
          AdoptionCycle.scheduled_submission_count to 0.
        test_recipe:
          setup:
            - "State MI is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "Cycle 2027 is OPEN at clock 2026-09-15; the submission is FILED with pinned_content_revision 1"
            - "Panel MI-A sits 2026-10-20 14:00-18:00 (slot_minutes_capacity 240) and holds a RESERVED 30-minute slot for that submission, so review_status is SCHEDULED and reserved_minutes is 30"
            - "An ADD_REQUIRED_TOPIC content edit with pages_delta 40 on the same title is APPROVED but not yet applied"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "MI", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_mi_id: $.data.id }
            - call: "POST /state-profiles/${st_mi_id}/standards"
              payload: { subject: "MATH", standard_code: "MI.M.7.1", grade_low: 7, grade_high: 7, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_mi_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_mi_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_mi_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000001201", subject: "MATH", grade_low: 7, grade_high: 7, copyright_year: 2026, content_tags: ["RATIO_REASONING"], page_count: 400, signature_page_capacity: 480, list_price_cents: 9400 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "MI.M.7.1", depth_level: "MASTERY", page_reference: "pp. 60-90", evidence_citation: "Unit 3 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_mi_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "POST /committee-panels"
              payload: { cycle_id: "${cyc_id}", panel_label: "MI MATH Panel A", session_start_at: "2026-10-20T14:00:00Z", session_end_at: "2026-10-20T18:00:00Z", buffer_minutes: 10, member_count: 3, quorum_required: 2 }
              as: StateAdoptionOfficer
              as_user_id: "${st_mi_id}"
              captures: { pnl_id: $.data.id, pnl_v0: $.data.version }
            - call: "POST /committee-panels/${pnl_id}/slots"
              payload: { submission_id: "${sub_id}", start_at: "2026-10-20T14:00:00Z", end_at: "2026-10-20T14:30:00Z", expected_panel_version: "${pnl_v0}" }
              as: StateAdoptionOfficer
              as_user_id: "${st_mi_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /content-edits"
              payload: { title_id: "${ttl_id}", state_id: "${st_mi_id}", edit_type: "ADD_REQUIRED_TOPIC", topic_code: "DATA_LITERACY", pages_delta: 40, rationale: "Inserts the state data-literacy strand into unit 5." }
              as: PublisherEditor
              as_user_id: "ed-1"
              captures: { ce_id: $.data.id }
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "APPROVE" }
              as: EditorialDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /content-edits/${ce_id}/apply"
              payload: {}
              as: EditorialDirector
              as_user_id: "dir-1"
          assert:
            - "ContentEdit.${ce_id}.status == APPLIED"
            - "Title.${ttl_id}.content_revision == 2"
            - "Title.${ttl_id}.page_count == 440"
            - "Title.${ttl_id}.page_budget_remaining == 40"
            - "Title.${ttl_id}.content_tags contains DATA_LITERACY"
            - "Submission.${sub_id}.content_pin_stale == true"
            - "Submission.${sub_id}.adoption_blocked == true"
            - "PresentationSlot.${slot_id}.status == CANCELLED"
            - "CommitteePanel.${pnl_id}.reserved_minutes == 0"
            - "Submission.${sub_id}.review_status == FILED"
            - "AdoptionCycle.${cyc_id}.scheduled_submission_count == 0"

      - name: tally_adoption_three_hop_contract_lock_cascade
        grounds:
          - state_machines.PresentationSlot.PRESENTED_to_TALLIED
          - state_machines.Submission.review_status=PRESENTED_to_review_status=ADOPTED
          - entities.PricingProposal.fields.contract_locked
          - entities.AdoptionCycle.fields.adopted_count
        distinguishing_aspect: |
          Depth-3 chain from a different trigger, POST /presentation-slots/{id}/tally: HOP 1 writes
          tally_outcome RECOMMEND on the slot; BECAUSE of that outcome HOP 2 moves the submission
          PRESENTED -> ADOPTED and stamps GA into Title.adopted_state_codes; BECAUSE the submission
          adopted HOP 3 sets PricingProposal.contract_locked true and increments
          AdoptionCycle.adopted_count to 1 while submission_count drops to 0.
        test_recipe:
          setup:
            - "State GA is ADOPTION_LIST with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "The submission is FILED with an ACCEPTED correlation (verified_coverage_pct 100.00) and an APPROVED PricingProposal"
            - "Panel GA-A is IN_SESSION at clock 2026-10-20T14:00:00Z and the submission's slot is PRESENTED with three RECOMMEND ballots on the log"
