            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 100000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO-A", reason: "r", amount_cents: 1000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { coa: $.data.id } }
          trigger:
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO-B", reason: "r", amount_cents: 2000, supersedes_id: "${coa}" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SUPERSEDES_TARGET_INVALID   # CO-A is DRAFT, not UNDER_REVIEW"

      - name: supersede_chain_auto_rejects_predecessor
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ChangeOrder.UNDER_REVIEW_to_REJECTED"
          - "entities.ChangeOrder.fields.superseded_by_id"
        distinguishing_aspect: "Self-referential revision chain: creating CO-B with supersedes_id = an UNDER_REVIEW CO-A auto-transitions CO-A to REJECTED and links superseded_by_id back to CO-B."
        test_recipe:
          setup: ["Program ACTIVE (minimal); CT1 EXECUTED 400000; CO-A UNDER_REVIEW 50000"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SUP2", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
