scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_and_system_fields
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "POST /pop/clients with required fields returns 201 and server-minted id/created_at/version"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          assert:
            - "response status == 201"
            - "Client.${client_id}.id is a UUID without type prefix"
            - "Client.${client_id}.version == 1"
            - "Client.${client_id}.status == ACTIVE"
      - name: get_client_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Client, errors.ERR_NOT_FOUND]
        distinguishing_aspect: "GET /pop/clients/{nonexistent-uuid} returns ERR_NOT_FOUND 404"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /pop/clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"
      - name: create_program_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.RetailerProgram, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pop/programs missing store_count returns ERR_INVALID_REQUEST"
        test_recipe:
          setup:
            - "Client exists"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"
      - name: computed_field_compliance_result_recomputed_on_submit
        claim_type: computed_fields
        grounds: [entities.DisplayDesign.fields.compliance_result]
        distinguishing_aspect: "compliance_result is computed server-side; client-supplied value on create is ignored and recomputed at submit"
        test_recipe:
          setup:
            - "Program in DESIGN with an active MAX_WIDTH_IN=48 rule; design width 60 (will FAIL)"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 60, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
          trigger:
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
          assert:
            - "DisplayDesign.${design_id}.compliance_result == FAIL"
      - name: program_recap_has_no_update_endpoint
        claim_type: immutability
        grounds: [entities.ProgramRecap]
        distinguishing_aspect: "ProgramRecap (common_fields: false) has no PUT/PATCH/DELETE endpoint — read-only once minted"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /pop/programs/00000000-0000-0000-0000-000000000000/recap"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "no mutation endpoints exist for ProgramRecap in the API surface"
            - "GET returns ERR_NOT_FOUND when program does not exist"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_cancel_from_fulfillment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RetailerProgram.transitions, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "POST /pop/programs/{id}/cancel is only valid from DRAFT or DESIGN; from FULFILLMENT it returns ERR_INVALID_STATE"
        test_recipe:
          setup:
            - "Program advanced to FULFILLMENT"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 3, program_revenue_cents: 1000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S1", address: "1 Main St" }
              as: ProgramManager
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 0, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/programs/${program_id}/start-fulfillment"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /pop/programs/${program_id}/cancel"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "program.status remains FULFILLMENT"
      - name: design_submit_from_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DisplayDesign.transitions, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting an already-APPROVED design is an invalid transition"
        test_recipe:
          setup:
            - "Design in APPROVED state"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
      - name: terminal_state_lockdown_on_closed_program
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RetailerProgram.terminal_states]
        distinguishing_aspect: "Once CLOSED, no further transitions are accepted on the program"
        test_recipe:
          setup:
            - "Program fully closed"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 3, program_revenue_cents: 1000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S1", address: "1 Main St" }
              as: ProgramManager
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 0, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
