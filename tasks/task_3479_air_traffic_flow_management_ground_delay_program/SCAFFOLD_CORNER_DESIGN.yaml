            - call: "GET /atfm/flights/${b1}"
              as: FlowManager
              captures: { b1_cta: $.data.controlled_arrival }
            - call: "GET /atfm/flights/${a1}"
              as: FlowManager
              captures: { a1_cta: $.data.controlled_arrival }
          assert:
            - "b1_cta == 2026-09-15T13:00:00Z (earlier created_at wins the earlier slot)"
            - "a1_cta == 2026-09-15T13:10:00Z"

      - name: rbs_overflow_virtual_cta
        claim_type: correct_result
        grounds:
          - calculations.rbs_slot_allocation
          - entities.Flight.fields.is_overflow
        distinguishing_aspect: "With 3 eligible flights and only 2 non-reserved slots (rate 6 over a 30-minute window), the third flight gets a virtual CTA == program_end, is_overflow true, stays UNCONTROLLED, and holds no ArrivalSlot row."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, 13:00-13:30Z (3 slots: 13:00, 13:10, and 13:20 GA-reserved); three op_a flights scheduled 13:01/13:02/13:03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T13:30:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T13:30:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
