        payload: {lead_id: '${lead_id}'}
        as: SalesManager
        as_user_id: sm-001
        captures: {rows_after_failure: $.data}
      - call: POST /group-sales/rate-quotes
        payload: {lead_id: '${lead_id}', concession_package_id: '${pkg_id}', base_rate_cents: 23950, quoted_peak_rooms: 4,
          quoted_room_nights: 12, expires_at: '2026-10-01T00:00:00Z', expected_lead_version: '${v_after_restudy}'}
        as: SalesManager
        as_user_id: sm-001
        captures: {quote_id: $.data.id, q_status: $.data.status, q_round: $.data.negotiation_round}
      - call: GET /group-sales/leads/${lead_id}
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {v_final: $.data.version}
      assert:
      - v_read == 4 and stage_read == CLEARED (create, qualify, first study, first approval)
      - v_after_restudy == 5 and stage_after_restudy == CLEARED — the re-study bumped the version but
        left the negotiation stage alone, which is exactly what a status-only guard would miss
      - e_stale == ERR_STALE_LEAD_VERSION with HTTP 412 and a non-empty message
      - rows_after_failure reports total_count == 0 — the refused write created no RateQuote row
      - the retry with expected_lead_version 5 returns HTTP 201 with q_status == DRAFT and q_round ==
        1
      - v_final == 5 — creating a DRAFT quote does not itself bump the lead version, so the OCC token
        only moves on the writes the scaffold says move it
  - name: a_displacement_decision_from_a_stale_lead_view_is_refused_and_leaves_the_study_pending
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[analysis-decide-stale-lead]
    - errors[ERR_STALE_LEAD_VERSION]
    - endpoints["POST /group-sales/displacement-analyses/{id}/decide"]
    - state_machines.DisplacementAnalysis[PENDING -> APPROVED]
    distinguishing_aspect: |
      This is the OCC rule whose refusal must be side-effect free: the decide endpoint carries a four-precondition transition, so an implementation that stamps decided_by_user_id or flips the analysis to APPROVED before comparing versions leaves observable damage even though it returns 412. The instance therefore re-reads both the analysis and the lead after the rejection and only then retries with the refreshed token.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; CORPORATE account; InventoryDay rows 2026-11-09..11 (transient demand
        398 of a 400-room house, group ceiling 250) so the FORECAST_BASED verdict is ACCEPT; the lead
        is QUALIFIED and one PENDING analysis exists, putting it in DISPLACEMENT_REVIEW at version 3
