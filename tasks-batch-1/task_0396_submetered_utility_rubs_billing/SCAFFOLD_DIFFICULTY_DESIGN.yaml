  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # --- instance 1: Meter assignment half-open [from, to) overlap
      - name: meter_assignment_half_open_window_overlap
        grounds:
          - state_machines.Meter.ASSIGNED_to_ASSIGNED
          - validations[priority=7]
          - entities.Meter.fields.assignment_effective_from
          - entities.Meter.fields.assignment_effective_to
        distinguishing_aspect: |
          Meter assignment windows use HALF-OPEN [effective_from, effective_to)
          interval arithmetic on the same Unit+Utility: a new window starting exactly
          at the prior window's effective_to does NOT overlap (adjacency allowed),
          but a window starting one day earlier overlaps -> ERR_METER_ASSIGNMENT_OVERLAP.
          Half-open semantics on Meter, distinct from instance 2's closed-interval
          Lease occupancy.
        test_recipe:
          setup:
            - "A Meter already ASSIGNED to a Unit for window [2026-06-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PMO", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { pmo_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pmo_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { umo_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pmo_id}", unit_number: "MOU", square_feet: 800 }
              as: PropertyManager
              captures: { mou_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pmo_id}", utility_id: "${umo_id}", serial_number: "MOS" }
              as: PropertyManager
              captures: { mom_id: $.data.id }
            - call: "POST /meters/${mom_id}/assign"
              payload: { unit_id: "${mou_id}", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /meters/${mom_id}/assign"
              payload: { unit_id: "${mou_id}", effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_METER_ASSIGNMENT_OVERLAP  # [06-30,08-01) overlaps [06-01,07-01) by one day"
            - "A window starting exactly at 2026-07-01 (== prior effective_to) would instead succeed (half-open adjacency allowed)"

      # --- instance 2: Lease occupancy CLOSED-interval [move_in, move_out] overlap
      - name: lease_occupancy_closed_interval_overlap_move_out_inclusive
        grounds:
          - state_machines.Lease.PENDING_to_ACTIVE
          - validations[priority=8]
          - entities.Lease.fields.move_in_date
          - entities.Lease.fields.move_out_date
        distinguishing_aspect: |
          Lease occupancy uses a CLOSED interval [move_in_date, move_out_date] with
          move_out_date INCLUSIVE: a new lease whose move_in_date equals an existing
          NOTICE_GIVEN lease's move_out_date overlaps (the shared endpoint counts) ->
          ERR_LEASE_OCCUPANCY_OVERLAP on activate. Closed/inclusive semantics on
          Lease, distinct from instance 1's half-open Meter window.
        test_recipe:
          setup:
            - "Unit has a NOTICE_GIVEN lease with move_in 2026-06-01 and move_out_date 2026-06-20 (inclusive)."
            - "A second PENDING lease on the same unit has move_in_date 2026-06-20 (== the first lease's inclusive move_out)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PLO", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.10 }
              as: PropertyManager
              captures: { plo_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${plo_id}", unit_number: "LOU", square_feet: 800 }
              as: PropertyManager
              captures: { lou_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${lou_id}", property_id: "${plo_id}", tenant_user_id: "tLO1", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { lo1_id: $.data.id }
            - call: "POST /leases/${lo1_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases/${lo1_id}/give-notice"
              payload: { move_out_date: "2026-06-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${lou_id}", property_id: "${plo_id}", tenant_user_id: "tLO2", occupant_count: 1, move_in_date: "2026-06-20T00:00:00Z" }
              as: PropertyManager
              captures: { lo2_id: $.data.id }
          trigger:
            - call: "POST /leases/${lo2_id}/activate"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LEASE_OCCUPANCY_OVERLAP  # move_in 06-20 == inclusive move_out 06-20 of the NOTICE_GIVEN lease"
            - "Lease ${lo2_id}.status remains PENDING"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- instance 1: dispute reopen reverses credit -> total_due conserved
      - name: dispute_reopen_reverses_credit_total_due_conserved
        grounds:
          - state_machines.Dispute.RESOLVED_to_UNDER_REVIEW
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
          - calculations.statement_totals
          - entities.TenantStatement.fields.credit_cents
          - entities.TenantStatement.fields.total_due_cents
        distinguishing_aspect: |
          Resolve grants credit_cents=2000 then reopen reverses exactly that credit,
          leaving the conserved quantity total_due_cents identical to its pre-resolve
          value: invariant total_due_cents == utility_charge_cents + admin_fee_cents
          + late_fee_cents - credit_cents holds with credit_cents back to 0. Conserved
          quantity is the statement's CREDIT/total_due, distinct from instance 2's
          amount_paid/balance quantity.
        test_recipe:
          setup:
            - "An ISSUED statement with total_due_cents=6000 (credit 0); a Dispute resolved with credit 2000, then reopened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
