      - name: lodging_nights_half_open_adjacent_allowed
        grounds:
          - validations[priority=11]
          - entities.ExpenseLine.fields.check_in_date
          - entities.ExpenseLine.fields.check_out_date
        distinguishing_aspect: >
          LODGING lines use HALF-OPEN [check_in,check_out) overlap within a report (different interval
          semantics and different resource entity than TripRequest): adjacent stays where check_out ==
          next check_in are ALLOWED; an actual overlap is rejected.
        test_recipe:
          setup:
            - "Approved CA trip; DRAFT report with one LODGING line 2026-06-01..2026-06-03."
          setup_api_calls:
            - call: "POST /approvers"
