      - name: one_write_propagates_through_four_dependent_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Contract.ACTIVE->RESCINDED
        excluded_because:
          difficulty_instance: contract_rescission_vacates_position_and_reopens_soap_four_hop
          rationale: >
            The deepest cascade in the scaffold - contract to match result to program counters to season phase -
            is asserted hop by hop by the §1.8 transitive-cascade instance, which also pins the reopened SOAP
            budget.

      - name: the_same_stored_data_yields_two_different_computed_variants
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.screen_composite_score
        excluded_because:
          difficulty_instance: screen_score_provisional_versus_final_on_application
          rationale: >
            Both variants over one review set, and the fact that recording a screening decision changes which
            variant is authoritative, are the §1.8 dual-variant instance's subject.

      - name: the_selector_picks_one_winner_out_of_a_filtered_ordered_candidate_set
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers
          - calculations.waitlist_promotion_selector
        excluded_because:
          difficulty_instance: invitation_decline_frees_seat_and_promotes_waitlist_four_hop
          rationale: >
            The filter, the two-key ordering and the single-winner rule of the promotion selector are exercised
            inside the §1.8 cascade instance, which frees a seat with three eligible waitlisted candidates and
            asserts exactly which one is promoted. The complementary empty-candidate arm is covered in the
            calculations section of this file.


  # ===========================================================================
  # Consistency model - complexity_profile.consistency_model is `immediate`,
  # so the single claim to extract is that a write's own response body already
  # reflects every field the write computed.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: the_screening_response_body_already_carries_the_final_score_it_computed
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.screen_composite_score
          - endpoints.POST /applications/{id}/screen
        distinguishing_aspect: >
          Under immediate consistency the screening call's own 200 body carries screening_status ADVANCED and
          final_screen_score 33.50 - the base 24.50 plus the 6.00 band bonus for a 251 Step 2 score plus the
          3.00 alumni credit - with no second GET required, and a read-back immediately afterwards returns
          byte-identical values rather than a later-settled figure.
        test_recipe:
          setup:
            - "one Application in UNDER_REVIEW with two reviews, whose applicant scored 251 and is a pipeline alum"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
