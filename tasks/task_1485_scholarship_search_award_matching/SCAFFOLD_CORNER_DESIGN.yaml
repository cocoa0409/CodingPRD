  - section: state_machines
    instances:
      - name: student_archive_guard_and_archived_application_gate
        claim_type: guarded_transition
        grounds: ["state_machines.Student.ACTIVE_to_ARCHIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Two-direction guard: archival is blocked while the student holds a DRAFT application, and an ARCHIVED student cannot start new applications — soft-deleted records stay readable (GET still 200) but are write-inert."
        test_recipe:
          setup: ["student A with a DRAFT application; student B with no applications"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Arc A", email: "aa@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_a: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "Arc B", email: "ab@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 5000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_b: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Arc Donor", contact_email: "arc@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Arc Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Arc Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_a}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_a: $.data.id }
          trigger:
            - call: "POST /api/students/${s_a}/archive"
              as: ScholarshipCoordinator
              captures: { err_1: $.data.error_id }
            - call: "POST /api/applications/${app_a}/withdraw"
              as: ScholarshipCoordinator
            - call: "POST /api/students/${s_a}/archive"
              as: ScholarshipCoordinator
              captures: { s_a_status: $.data.status }
            - call: "POST /api/applications"
              payload: { student_id: "${s_a}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { err_2: $.data.error_id }
            - call: "GET /api/students/${s_a}"
              as: ScholarshipCoordinator
              captures: { s_a_read: $.data.status }
          assert:
            - "err_1 == ERR_INVALID_STATE (409): DRAFT application blocks archival"
            - "After withdrawal: s_a_status == ARCHIVED"
            - "err_2 == ERR_INVALID_STATE (409): ARCHIVED students cannot open new applications"
            - "s_a_read == ARCHIVED (soft-deleted record remains readable)"
