  - section: calculations
    instances:
      - name: at_risk_threshold_boundary_90
        claim_type: constants_applied
        grounds: [calculations.sla_posture_evaluation]
        distinguishing_aspect: "AT_RISK fires at elapsed >= floor(3 x 120 / 4) == 90 for ROUTINE: at 89 minutes the sweep leaves the request ON_TRACK; at exactly 90 it flips to AT_RISK."
        test_recipe:
          setup: ["ROUTINE PORTER_ONLY request created at 2026-08-01T00:00:00Z, never dispatched"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:29:00Z" }, as: TransportSupervisor }
            - { call: "POST /_sweeps/run", as: TransportSupervisor }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { p89: $.data.sla_posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:30:00Z" }, as: TransportSupervisor }
            - { call: "POST /_sweeps/run", as: TransportSupervisor }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { p90: $.data.sla_posture } }
          assert:
            - "at elapsed 89: sla_posture == ON_TRACK (${p89})"
            - "at elapsed 90: sla_posture == AT_RISK (${p90}) — inclusive lower boundary, still below the > 120 breach line"

      - name: staffing_scheduled_excludes_cancelled
        claim_type: input_set_filtering
