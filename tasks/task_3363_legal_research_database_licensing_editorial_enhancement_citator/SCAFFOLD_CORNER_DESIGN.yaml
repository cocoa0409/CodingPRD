              as: ContentIngester
          trigger:
            - {call: "GET /legal-research/documents/${doc_b}", as: CitatorAnalyst}
          assert:
            - "PrimaryDocument.${doc_b}.citator_score == 20 (50 - 30) and citator_signal == GREEN"

