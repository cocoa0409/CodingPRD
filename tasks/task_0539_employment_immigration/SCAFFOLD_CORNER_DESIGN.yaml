# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Employment-Based Immigration (PERM/LCA & H-1B) — Expert
# Breadth surface complementary to SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8 depth).
# Sections = claim-extraction-guide's nine sections; claim_type = its rows.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: employer_create_returns_201_with_zeroed_ledger_and_version_one
        claim_type: Creation
        grounds:
          - endpoints.POST /employers
          - entities.Employer.fields.total_wage_obligation_cents
          - entities.Employer.fields.version
        distinguishing_aspect: "POST /employers with all required fields returns 201; server sets total_wage_obligation_cents=0 and version=1 regardless of input."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { fein: "100000001", legal_name: "Corner Corp", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, oblig: $.data.total_wage_obligation_cents, v: $.data.version }
          assert:
            - "response status == 201"
            - "Employer.${emp_id}.total_wage_obligation_cents == 0"
            - "Employer.${emp_id}.version == 1"

      - name: employer_get_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET /employers/{id}
          - entities.Employer.fields.legal_name
        distinguishing_aspect: "GET /employers/{id} returns the stored Employer with legal_name and fein exactly as created."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000002", legal_name: "Readback LLC", employee_count: 12 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { name: $.data.legal_name }
          assert:
            - "Employer.${emp_id}.legal_name == \"Readback LLC\""
            - "response status == 200"

      - name: employer_get_nonexistent_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET /employers/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /employers with an unknown UUID returns ERR_NOT_FOUND (404); no entity is created."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000000"
              as: EmployerAgent
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "response status == 404"

      - name: pwd_employer_survey_missing_survey_wage_rejected
        claim_type: Required Fields
        grounds:
          - endpoints.POST /prevailing-wage-determinations
          - entities.PrevailingWageDetermination.fields.survey_wage_cents
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "wage_source==EMPLOYER_SURVEY but survey_wage_cents omitted → ERR_VALIDATION (400); the field is conditionally required."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000003", legal_name: "Survey Co", employee_count: 9 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "EMPLOYER_SURVEY", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "response status == 400"

      - name: employer_h1b_dependent_defaults_false
        claim_type: Defaults
        grounds:
          - entities.Employer.fields.h1b_dependent
          - endpoints.POST /employers
        distinguishing_aspect: "Omitting h1b_dependent on POST /employers yields h1b_dependent==false (declared default)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { fein: "100000004", legal_name: "Default Co", employee_count: 30 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, dep: $.data.h1b_dependent }
          assert:
            - "Employer.${emp_id}.h1b_dependent == false"

      - name: lca_hours_per_week_defaults_40
        claim_type: Defaults
        grounds:
          - entities.LCA.fields.hours_per_week
          - endpoints.POST /lcas
        distinguishing_aspect: "Omitting hours_per_week on POST /lcas yields hours_per_week==40; single AREA_A wage 10000000 → aggregate_wage_obligation_cents==10000000 (no proration)."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000005", legal_name: "Hours Co", employee_count: 8 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id, hpw: $.data.hours_per_week, agg: $.data.aggregate_wage_obligation_cents }
          assert:
            - "LCA.${lca_id}.hours_per_week == 40"
            - "LCA.${lca_id}.aggregate_wage_obligation_cents == 10000000"

      - name: pwd_invalid_wage_level_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.PrevailingWageDetermination.fields.wage_level
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "wage_level==\"LEVEL_V\" is not a member of {LEVEL_I..LEVEL_IV} → ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000006", legal_name: "Enum Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_V", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "response status == 400"

      - name: lca_validity_end_not_after_start_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LCA.fields.validity_start
          - entities.LCA.fields.validity_end
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "LCA with validity_end == validity_start (2026-05-01 == 2026-05-01) violates validity_end > validity_start → ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000007", legal_name: "Interval Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2026-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "response status == 400"

      - name: lca_area_wage_map_missing_worksite_area_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LCA.fields.area_wage_map
          - entities.LCA.fields.worksite_areas
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "worksite_areas lists AREA_A and AREA_B but area_wage_map only maps AREA_A → ERR_VALIDATION (area_wage_map must cover every worksite_areas entry)."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000008", legal_name: "MapGap Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A", "AREA_B"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "response status == 400"

      - name: perm_case_create_unknown_pwd_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST /perm-cases
          - entities.PermCase.fields.pwd_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "flat topology FK integrity: POST /perm-cases with a pwd_id that resolves to no PWD → ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One Employer exists; no PWD created."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000009", legal_name: "FKCheck Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "00000000-0000-4000-8000-000000000abc", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "response status == 404"

      - name: beneficiary_computed_status_none_at_creation
        claim_type: Computed Fields
        grounds:
          - entities.Beneficiary.fields.current_status_code
          - entities.Beneficiary.fields.status_valid_until
          - entities.Beneficiary.fields.priority_date
          - endpoints.POST /beneficiaries
        distinguishing_aspect: "A freshly created Beneficiary (no APPROVED petitions) has current_status_code==NONE and status_valid_until==null and priority_date==null."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "100000010", legal_name: "Ben Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /beneficiaries"
              payload: { full_name: "Fresh Worker", passport_number: "P-CORNER-1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id, csc: $.data.current_status_code, svu: $.data.status_valid_until, pd: $.data.priority_date }
          assert:
            - "Beneficiary.${ben_id}.current_status_code == NONE"
            - "Beneficiary.${ben_id}.status_valid_until == null"
            - "Beneficiary.${ben_id}.priority_date == null"

      - name: employer_system_fields_generated_ignoring_input
        claim_type: System Fields
        grounds:
          - entities.Employer.fields.version
          - endpoints.POST /employers
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted; a client-supplied version in the body is ignored and version==1 on creation."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { fein: "100000011", legal_name: "SysField Co", employee_count: 5 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, v: $.data.version }
          assert:
            - "Employer.${emp_id}.version == 1"
            - "Employer.${emp_id}.id is a server-minted UUID (non-empty)"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: pwd_starts_in_pending
        claim_type: Initial State
        grounds:
          - state_machines.PrevailingWageDetermination
          - entities.PrevailingWageDetermination.fields.status
        distinguishing_aspect: "A newly created PWD has status==PENDING (initial_state) before any transition."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "200000001", legal_name: "Init Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id, st: $.data.status }
          assert:
            - "PrevailingWageDetermination.${pwd_id}.status == PENDING"

      - name: perm_case_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.PermCase
          - entities.PermCase.fields.status
        distinguishing_aspect: "A newly created PermCase has status==DRAFT (initial_state)."
        test_recipe:
          setup:
            - "An Employer and an ISSUED PWD exist so the PermCase FKs resolve."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "200000002", legal_name: "PermInit Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v}" }
              as: DOLAnalyst
          trigger:
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id, st: $.data.status }
          assert:
            - "PermCase.${pc_id}.status == DRAFT"

      - name: pwd_issue_from_issued_rejected_idempotency
        claim_type: Idempotency
        grounds:
          - state_machines.PrevailingWageDetermination.PENDING_to_ISSUED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Issuing a PWD that is already ISSUED (OCC passing with the current employer version) fails ERR_INVALID_STATE; the transition is defined only from PENDING."
        test_recipe:
          setup:
            - "A PWD is ISSUED; the parent Employer.version has advanced to 2."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "200000003", legal_name: "Idem Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v0}" }
              as: DOLAnalyst
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { emp_v1: $.data.version }
          trigger:
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v1}" }
              as: DOLAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "PrevailingWageDetermination.${pwd_id}.status == ISSUED (unchanged)"

      - name: perm_case_file_from_draft_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PermCase
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PermCase in DRAFT cannot jump straight to FILED (no such transition) → ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A PermCase is DRAFT (PWD issued)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "200000004", legal_name: "Skip Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v}" }
              as: DOLAnalyst
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "FILED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "PermCase.${pc_id}.status == DRAFT (unchanged)"

      - name: lca_transition_from_withdrawn_terminal_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LCA
          - state_machines.LCA.CERTIFIED_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal WITHDRAWN, any further LCA transition (e.g. WITHDRAWN again) → ERR_INVALID_STATE (409); WITHDRAWN is terminal."
        test_recipe:
          setup:
            - "An LCA is CERTIFIED then WITHDRAWN."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "200000005", legal_name: "Term Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id }
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "WITHDRAWN" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "WITHDRAWN" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "LCA.${lca_id}.status == WITHDRAWN (unchanged)"

      - name: i140_transition_from_denied_terminal_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.I140Petition
          - state_machines.I140Petition.SUBMITTED_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal DENIED, approving an I-140 → ERR_INVALID_STATE (409); DENIED is terminal."
        test_recipe:
          setup:
            - "An EB1 self-petition I-140 is SUBMITTED then DENIED."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "200000006", legal_name: "I140Term Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Term Ben", passport_number: "P-CORNER-2" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /i140-petitions"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", category: "EB1" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { i140_id: $.data.id }
            - call: "POST /i140-petitions/${i140_id}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /i140-petitions/${i140_id}/transitions"
              payload: { to_status: "DENIED" }
              as: USCISOfficer
          trigger:
            - call: "POST /i140-petitions/${i140_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: USCISOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "I140Petition.${i140_id}.status == DENIED (unchanged)"

      - name: pwd_auto_expires_when_clock_passes_validity_end
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PrevailingWageDetermination.ISSUED_to_EXPIRED
          - endpoints.POST /_clock/set_current_utc
          - entities.PrevailingWageDetermination.fields.validity_end
