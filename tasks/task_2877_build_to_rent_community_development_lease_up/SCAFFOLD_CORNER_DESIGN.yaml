      - name: a_third_revision_request_is_refused_and_the_plat_can_still_be_approved
        claim_type: cyclic
        grounds:
          - state_machines.Community.plat.REVISION_REQUESTED_to_SUBMITTED
          - validations.priority_59_plat_revision_limit
          - errors.ERR_PLAT_REVISION_LIMIT
        distinguishing_aspect: |
          The revision loop DRAFT -> SUBMITTED -> REVISION_REQUESTED -> SUBMITTED is traversable twice
          and no more: plat_revision_round is monotone across resubmissions (a resubmission never resets
          it), the third REQUEST_REVISION is refused with ERR_PLAT_REVISION_LIMIT, and the loop still
          terminates cleanly because APPROVE on the same SUBMITTED plat succeeds afterwards.
        test_recipe:
          setup:
            - "Community 'Stonefall' whose plat has already been revised twice and resubmitted, so plat_status is SUBMITTED with plat_revision_round 2."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Stonefall", market_code: "TX-HOU", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 2000000, facility_commitment_cents: 40000000, maintenance_tech_headcount: 2 }
