            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000, course SS101 published"
            - "member m_cas is fully compliant: screening CLEARED, training CURRENT, membership ACTIVE, contact_eligibility ELIGIBLE"
            - "m_cas holds one CoachAssignment at the club in status ACTIVE, so Club.active_assignment_count == 1, Club.restricted_member_count == 0 and Club.compliance_posture == OPEN"
            - "investigating body body_cas accepts EMOTIONAL_MISCONDUCT with max_open_cases 5"
            - "case_cas naming m_cas is in status ROUTED to body_cas and has no interim measures yet"
