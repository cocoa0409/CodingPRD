            - call: "POST /proctors"
              payload: { school_id: "${s_id}", full_name: "Ben Proctor", email: "ben@ng.gov" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p2_id: $.data.id }
