# =============================================================================
# PRD Benchmark Seed Tables
# Utility Capital Project & Work-Order Costing (utility capital accounting)
# =============================================================================

scenario: |
  Utility Capital Project & Work-Order Costing (utility capital accounting): work order
  authorization & budget code, unitized asset accounting & CWIP capitalization,
  labor/equipment/material charging & overhead loading, in-service date & depreciation
  start, closeout & unitization to fixed asset, contributions in aid of construction
  offset, variance analysis & re-estimate, regulatory asset treatment

domain_name: utility-capital-costing
api_prefix: /ucp

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation       # CWIP ledger: direct charges + AFUDC + CIAC offsets reconciled at closeout
  secondary_archetype: compliance_audit          # segregation of duties, tiered approvals, regulatory deferral, period close audit trail
  complexity_layers:
    - optimistic_concurrency                     # OCC on WorkOrder.version for estimate create (supersede) and approve (supersede)
    - cascading_side_effects                     # period close -> entries -> balances -> derived postures; estimate approve -> supersede -> budget -> posture
    - dual_variant_calculation                   # AFUDC HALF_MONTH vs FULL_MONTH; CIAC NET_OF_CIAC vs GROSS_WITH_CONTRA
    - rate_threshold_triggers                    # variance hold at 110%, estimate routing at 10%, authorize tier at $100k
    - derived_field_reconciliation               # cwip_cents, actual_direct_cents, committed_amount_cents recomputed on every posting
    - ops_run_checkpoint                         # AccountingPeriod close advances the accounting epoch (AFUDC + depreciation + amortization + CIAC sweep)
    - conditional_feature_flags                  # CapitalProgram.afudc_method and ciac_method change calculation behavior
    - scheduled_actions                          # CIAC pledge expiry driven by the logical clock
  entity_topology: flat                          # peer collections under /ucp, FK references in bodies, filtered-list reverse GETs
  state_machine_shape: cyclic                    # WorkOrder RETURNED->SUBMITTED and SUSPENDED->IN_PROGRESS loops; AccountingPeriod CLOSED->REOPENED->CLOSED loop; plus a derived parallel dimension (variance_posture) on WorkOrder
  relationship_patterns:
    - one_to_many                                # Program->WorkOrder, WorkOrder->Estimate/CostCharge/CIAC/FixedAssetUnit/AFUDCEntry
    - self_referential                           # Estimate.supersedes_estimate_id, CostCharge.reverses_charge_id
    - cross_aggregate                            # RegulatoryAsset.source_work_order_id bridges the write-off aggregate
  role_model: segregation_of_duties              # creator != authorizer; estimate submitter != approver; reg-asset proposer != approver; completer != closer
  consistency_model: immediate                   # all cascades atomic within the triggering request

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: CapitalProgram
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Budget code, unique across all programs (e.g. 'CAP-2026-DIST')" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year of the program" }
      - { name: authorized_amount_cents, type: integer, source: input, description: "Total authorized capital budget in cents; > 0" }
      - { name: afudc_debt_rate_pct, type: number, source: input, description: "Annual AFUDC debt rate as a percentage (e.g. 12.0 means 12%); >= 0" }
      - { name: afudc_equity_rate_pct, type: number, source: input, description: "Annual AFUDC equity rate as a percentage; >= 0" }
      - { name: afudc_debt_weight_pct, type: number, source: input, description: "Debt weighting percentage 0..100; equity weight = 100 - debt weight" }
      - { name: afudc_method, type: enum, source: input, description: "HALF_MONTH | FULL_MONTH — AFUDC base convention for current-period charges" }
      - { name: ciac_method, type: enum, source: input, description: "NET_OF_CIAC | GROSS_WITH_CONTRA — how CIAC offsets capitalization and depreciation" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; initial OPEN" }
      - { name: committed_amount_cents, type: integer, source: computed, default: 0, description: "Sum of approved_estimate_cents over work orders in AUTHORIZED, IN_PROGRESS, SUSPENDED, or COMPLETED" }
      - { name: capitalized_actual_cents, type: integer, source: computed, default: 0, description: "Sum of capitalizable_total_cents bubbled up from CLOSED work orders" }
      - { name: expense_writeoff_cents, type: integer, source: computed, default: 0, description: "Sum of cwip written off on cancellations with disposition EXPENSE" }
      - { name: ciac_contra_balance_cents, type: integer, source: computed, default: 0, description: "GROSS_WITH_CONTRA only: CIAC applied recorded as contra-asset, amortized via DepreciationEntry.ciac_contra_credit_cents" }
      - { name: available_amount_cents, type: integer, source: computed, description: "authorized_amount_cents - committed_amount_cents" }

  - name: UnitCatalog
    parent: null
    common_fields: true
    fields:
      - { name: asset_class, type: enum, source: input, description: "POLE | TRANSFORMER | CONDUCTOR | METER | REGULATOR; unique across catalog" }
      - { name: standard_cost_cents, type: integer, source: input, description: "Standard cost per unit used as unitization weight; >= 0 (zero permitted, but a closeout whose lines all weight to zero is rejected)" }
      - { name: annual_depreciation_rate_pct, type: number, source: input, description: "Straight-line annual depreciation rate percentage; > 0" }

  - name: OverheadSchedule
    parent: null
    common_fields: true
    fields:
      - { name: cost_type, type: enum, source: input, description: "LABOR | EQUIPMENT | MATERIAL" }
      - { name: order_type, type: enum, source: input, description: "CAPITAL | EXPENSE — which work-order type this loading rate applies to" }
      - { name: rate_pct, type: number, source: input, description: "Overhead loading percentage applied to base_amount_cents; >= 0 (0 permitted)" }
      - { name: effective_from, type: string, source: input, description: "ISO date, inclusive lower bound of the half-open interval" }
      - { name: effective_to, type: string, source: input, description: "ISO date, exclusive upper bound; null = open-ended", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE; schedules are immutable once created (no update/delete)" }

  - name: AccountingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label" }
      - { name: period_no, type: integer, source: input, description: "Period number within the fiscal year; >= 1" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive; must equal previous period end_date + 1 day (strict adjacency, no gaps, no overlap)" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive; must be >= start_date" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED -> REOPENED -> CLOSED cycle; at most one period in OPEN or REOPENED at any time" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent close", default: null }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CapitalProgram.id; program must be OPEN at creation" }
      - { name: order_type, type: enum, source: input, description: "CAPITAL | EXPENSE; EXPENSE orders earn no AFUDC and unitize zero lines at closeout" }
      - { name: title, type: string, source: input, description: "Work order title" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | AUTHORIZED | IN_PROGRESS | SUSPENDED | COMPLETED | CLOSED | CANCELLED; initial DRAFT" }
      - { name: variance_posture, type: enum, source: computed, description: "WITHIN_TOLERANCE | RE_ESTIMATE_REQUIRED; derived from actual_direct_cents vs approved_estimate_cents (strictly-greater 110% rule); initial WITHIN_TOLERANCE" }
      - { name: estimate_seq, type: integer, source: computed, default: 1, description: "Sequence number of the most recently created estimate (creation seeds estimate #1)" }
      - { name: approved_estimate_cents, type: integer, source: computed, description: "estimated_cost_cents of the currently APPROVED estimate; null until first approval", default: null }
      - { name: actual_direct_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over ALL CostCharge rows of this work order (an ORIGINAL row stays counted after flipping to REVERSED because its compensating REVERSAL row carries the exact negation); excludes AFUDC; the variance base" }
      - { name: afudc_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over AFUDCEntries with status ACCRUED" }
      - { name: cwip_cents, type: integer, source: computed, default: 0, description: "actual_direct_cents + afudc_total_cents; the CWIP balance" }
      - { name: in_service_date, type: string, source: input, description: "Set at completion; must fall inside the current OPEN or REOPENED period", default: null }
      - { name: in_service_period_id, type: string, source: computed, description: "AccountingPeriod id containing in_service_date", default: null }
      - { name: gross_cwip_cents, type: integer, source: computed, description: "cwip_cents snapshotted at closeout", default: null }
      - { name: ciac_applied_cents, type: integer, source: computed, default: 0, description: "CIAC applied at closeout = min(ciac received total, gross_cwip_cents)" }
      - { name: capitalizable_total_cents, type: integer, source: computed, description: "NET_OF_CIAC: gross - ciac_applied; GROSS_WITH_CONTRA: gross; set at closeout", default: null }
      - { name: cancel_writeoff_disposition, type: enum, source: input, description: "EXPENSE | REGULATORY_DEFERRAL; recorded on cancel when cwip_cents > 0", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties anchor for authorize" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID of authorizer", default: null }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of completer; SoD anchor for closeout", default: null }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of closer", default: null }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: estimate_seq, type: integer, source: computed, description: "Per-work-order sequence assigned at creation (1, 2, 3, ...)" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated cost at completion; > 0" }
      - { name: notes, type: string, source: input, description: "Free-text justification", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | SUPERSEDED | REJECTED | WITHDRAWN; initial PROPOSED" }
      - { name: supersedes_estimate_id, type: string, source: computed, description: "FK -> Estimate.id; set when this estimate's approval supersedes the previously APPROVED estimate", default: null }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of creator; SoD anchor for approve/reject" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejector", default: null }
      - { name: routing_tier, type: enum, source: computed, description: "SUPERVISOR | CONTROLLER; computed at decision time from |new-current|/current vs 10% (first estimate: SUPERVISOR)", default: null }

  - name: CostCharge
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: cost_type, type: enum, source: input, description: "LABOR | EQUIPMENT | MATERIAL" }
      - { name: base_amount_cents, type: integer, source: input, description: "Direct cost in cents; > 0 for ORIGINAL" }
      - { name: charge_date, type: string, source: input, description: "ISO date; must fall inside an existing AccountingPeriod in OPEN or REOPENED" }
      - { name: accounting_period_id, type: string, source: computed, description: "ORIGINAL rows: id of the AccountingPeriod containing charge_date. REVERSAL rows: the single currently OPEN/REOPENED period (prior-period adjustment; the clock date does not re-enter a CLOSED period)" }
      - { name: kind, type: enum, source: system, description: "ORIGINAL | REVERSAL; reversal rows carry negative amounts and are permanent" }
      - { name: reverses_charge_id, type: string, source: system, description: "FK -> CostCharge.id; set on REVERSAL rows, pointing at the reversed ORIGINAL", default: null }
      - { name: overhead_rate_pct, type: number, source: computed, description: "Rate resolved from OverheadSchedule by (cost_type, work order order_type, charge_date)" }
      - { name: overhead_amount_cents, type: integer, source: computed, description: "round_half_up(base_amount_cents * overhead_rate_pct / 100); per-charge rounding" }
      - { name: total_cents, type: integer, source: computed, description: "base_amount_cents + overhead_amount_cents (negative on REVERSAL rows)" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED; ORIGINAL rows flip to REVERSED when reversed; REVERSAL rows stay POSTED forever" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID of the posting clerk" }

  - name: CIACAgreement
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: pledged_cents, type: integer, source: input, description: "Contribution in aid of construction pledged by the customer; > 0" }
      - { name: pledge_expiry_at, type: datetime, source: input, description: "ISO8601; pledge expires when the logical clock passes this instant" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | APPLIED | REFUNDED | EXPIRED | CANCELLED; initial PLEDGED" }
      - { name: received_cents, type: integer, source: system, description: "Amount received (always equals pledged_cents — full receipt only)", default: null }
      - { name: applied_cents, type: integer, source: system, description: "Amount applied at closeout = min(received, gross_cwip)", default: null }
      - { name: forfeited_cents, type: integer, source: system, description: "10% retention when the work order is cancelled from IN_PROGRESS or SUSPENDED", default: null }
      - { name: refunded_cents, type: integer, source: system, description: "Amount returned to the customer (cancel refund or closeout excess)", default: null }

  - name: FixedAssetUnit
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: computed, description: "FK -> WorkOrder.id; the work order whose closeout created this unit line" }
      - { name: unit_catalog_id, type: string, source: input, description: "FK -> UnitCatalog.id; supplies asset_class, standard_cost_cents, depreciation rate" }
      - { name: quantity, type: integer, source: input, description: "Number of physical units on this listing line; >= 1" }
      - { name: line_no, type: integer, source: system, description: "Zero-based index of the line within the closeout request's unitization_lines array; list endpoints sort by created_at ASC then line_no ASC" }
      - { name: allocated_cost_cents, type: integer, source: computed, description: "Share of capitalizable_total_cents allocated by the unitization waterfall" }
      - { name: in_service_period_id, type: string, source: computed, description: "Copied from WorkOrder.in_service_period_id at closeout" }
      - { name: retirement_period_id, type: string, source: computed, description: "AccountingPeriod containing retirement_date", default: null }
      - { name: accumulated_depreciation_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over DepreciationEntries with status POSTED" }
      - { name: retirement_nbv_cents, type: integer, source: computed, description: "Net book value written off at the retirement period's close", default: null }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | RETIRED; initial IN_SERVICE" }

  - name: RegulatoryAsset
    parent: null
    common_fields: true
    fields:
      - { name: description, type: string, source: input, description: "Nature of the deferred cost (e.g. storm restoration, cancelled-project write-off)" }
      - { name: source_work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; set when the deferral arises from a specific work order (cancel write-off or closeout variance coverage)", default: null }
      - { name: original_cents, type: integer, source: input, description: "Amount deferred; > 0" }
      - { name: amortization_months, type: integer, source: input, description: "Straight-line amortization term; >= 1" }
      - { name: remaining_cents, type: integer, source: computed, description: "original_cents minus sum of POSTED AmortizationEntries; initial = original_cents" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | AMORTIZING | REJECTED | FULLY_AMORTIZED; initial PROPOSED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposer; SoD anchor for approve/reject" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver", default: null }

  - name: AFUDCEntry
    parent: null
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id" }
      - { name: accounting_period_id, type: string, source: system, description: "Id of the AccountingPeriod whose close accrued this entry" }
      - { name: method, type: enum, source: system, description: "HALF_MONTH | FULL_MONTH; snapshot of CapitalProgram.afudc_method at accrual" }
      - { name: base_cents, type: integer, source: system, description: "AFUDC base used: max(0, begin_cwip - ciac_received_to_date) + charge_share, per the program method" }
      - { name: rate_pct_applied, type: number, source: system, description: "Composite monthly rate percentage applied" }
      - { name: amount_cents, type: integer, source: system, description: "round_half_up(base_cents * rate_pct_applied / 100)" }
      - { name: status, type: enum, source: system, description: "ACCRUED | REVERSED; reversed when the period is reopened" }

  - name: DepreciationEntry
    parent: null
    common_fields: false
    fields:
      - { name: fixed_asset_unit_id, type: string, source: system, description: "FK -> FixedAssetUnit.id" }
      - { name: accounting_period_id, type: string, source: system, description: "Id of the AccountingPeriod whose close posted this entry" }
      - { name: amount_cents, type: integer, source: system, description: "Depreciation for the period; half-month factor 0.5 in the in-service period and in the retirement period" }
      - { name: ciac_contra_credit_cents, type: integer, source: system, description: "GROSS_WITH_CONTRA programs: round_half_up(amount_cents * ciac_applied / gross_cwip); 0 under NET_OF_CIAC" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED; reversed when the period is reopened" }

  - name: AmortizationEntry
    parent: null
    common_fields: false
    fields:
      - { name: regulatory_asset_id, type: string, source: system, description: "FK -> RegulatoryAsset.id" }
      - { name: accounting_period_id, type: string, source: system, description: "Id of the AccountingPeriod whose close posted this entry" }
      - { name: amount_cents, type: integer, source: system, description: "min(monthly_amount, remaining_cents before this entry); final entry absorbs the rounding remainder" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED; reversed when the period is reopened" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: CapitalProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /ucp/capital-programs/{program_id}/close"
        actor: Controller
        preconditions:
          - "No work order of this program is in a non-terminal state (DRAFT, SUBMITTED, RETURNED, AUTHORIZED, IN_PROGRESS, SUSPENDED, COMPLETED) — ERR_PROGRAM_HAS_OPEN_WORK_ORDERS"
        side_effects:
          - "Program becomes CLOSED; new work-order creation against it is rejected with ERR_PROGRAM_CLOSED"

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ucp/work-orders/{work_order_id}/submit"
        actor: ProjectEngineer
        preconditions: []
        side_effects: ["WorkOrder.version increments"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /ucp/work-orders/{work_order_id}/submit (resubmission loop)"
        actor: ProjectEngineer
        preconditions: []
        side_effects: ["WorkOrder.version increments"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /ucp/work-orders/{work_order_id}/return"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["WorkOrder.version increments"]
      - from: SUBMITTED
        to: AUTHORIZED
        trigger: "POST /ucp/work-orders/{work_order_id}/authorize"
        actor: "WorkOrderSupervisor (approved estimate < 10,000,000 cents) or Controller (any amount)"
        preconditions:
          - "An estimate in APPROVED exists (ERR_NO_APPROVED_ESTIMATE)"
          - "Authorization tier: approved_estimate_cents < 10,000,000 -> WorkOrderSupervisor allowed; >= 10,000,000 -> Controller only (ERR_APPROVAL_TIER_REQUIRED)"
          - "Segregation of duties: X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Budget: program.available_amount_cents >= approved_estimate_cents (ERR_PROGRAM_BUDGET_EXCEEDED)"
        side_effects:
          - "program.committed_amount_cents += approved_estimate_cents"
          - "authorized_by_user_id := X-User-ID; WorkOrder.version increments"
      - from: AUTHORIZED
        to: IN_PROGRESS
        trigger: "POST /ucp/work-orders/{work_order_id}/start"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["WorkOrder.version increments"]
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /ucp/work-orders/{work_order_id}/suspend"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["WorkOrder.version increments"]
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /ucp/work-orders/{work_order_id}/resume (suspend/resume loop)"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["WorkOrder.version increments"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /ucp/work-orders/{work_order_id}/complete"
        actor: WorkOrderSupervisor
        preconditions:
          - "in_service_date must fall inside the single AccountingPeriod currently in OPEN or REOPENED (ERR_IN_SERVICE_PERIOD_NOT_OPEN)"
        side_effects:
          - "in_service_date and in_service_period_id set; completed_by_user_id := X-User-ID"
          - "Charges are frozen: POST /ucp/cost-charges now rejects with ERR_INVALID_STATE"
          - "AFUDC stops: period close no longer accrues AFUDC for this work order"
          - "WorkOrder.version increments"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ucp/work-orders/{work_order_id}/cancel"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["PLEDGED CIAC agreements -> CANCELLED; WorkOrder.version increments"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /ucp/work-orders/{work_order_id}/cancel"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["PLEDGED CIAC agreements -> CANCELLED; PROPOSED estimates -> WITHDRAWN; WorkOrder.version increments"]
      - from: RETURNED
        to: CANCELLED
        trigger: "POST /ucp/work-orders/{work_order_id}/cancel"
        actor: WorkOrderSupervisor
        preconditions: []
        side_effects: ["PLEDGED CIAC agreements -> CANCELLED; PROPOSED estimates -> WITHDRAWN; WorkOrder.version increments"]
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /ucp/work-orders/{work_order_id}/cancel"
        actor: WorkOrderSupervisor
        preconditions:
          - "If cwip_cents > 0 then writeoff_disposition is required (ERR_WRITEOFF_DISPOSITION_REQUIRED); REGULATORY_DEFERRAL additionally requires writeoff_amortization_months"
        side_effects:
          - "program.committed_amount_cents -= approved_estimate_cents (budget released)"
          - "If cwip_cents > 0 and disposition EXPENSE: program.expense_writeoff_cents += cwip_cents"
          - "If cwip_cents > 0 and disposition REGULATORY_DEFERRAL: a RegulatoryAsset is created (PROPOSED, original_cents = cwip_cents, source_work_order_id = this work order, proposed_by_user_id = X-User-ID)"
          - "RECEIVED CIAC agreements -> REFUNDED with forfeiture 0% (never reached IN_PROGRESS); PLEDGED -> CANCELLED"
          - "WorkOrder.version increments"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /ucp/work-orders/{work_order_id}/cancel"
        actor: WorkOrderSupervisor
        preconditions:
          - "If cwip_cents > 0 then writeoff_disposition is required (ERR_WRITEOFF_DISPOSITION_REQUIRED); REGULATORY_DEFERRAL additionally requires writeoff_amortization_months"
        side_effects:
          - "program.committed_amount_cents -= approved_estimate_cents"
          - "Write-off per disposition (EXPENSE: program.expense_writeoff_cents += cwip_cents; REGULATORY_DEFERRAL: RegulatoryAsset PROPOSED created)"
          - "RECEIVED CIAC agreements -> REFUNDED with forfeiture = round_half_up(received_cents * 0.10) and refunded_cents = received_cents - forfeited_cents; PLEDGED -> CANCELLED"
          - "WorkOrder.version increments"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /ucp/work-orders/{work_order_id}/cancel"
        actor: WorkOrderSupervisor
        preconditions:
          - "If cwip_cents > 0 then writeoff_disposition is required (ERR_WRITEOFF_DISPOSITION_REQUIRED); REGULATORY_DEFERRAL additionally requires writeoff_amortization_months"
        side_effects:
          - "Same as IN_PROGRESS -> CANCELLED, including the 10% CIAC forfeiture"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /ucp/work-orders/{work_order_id}/closeout"
        actor: Controller
        preconditions:
          - "Segregation of duties: X-User-ID != completed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No CIAC agreement of this work order is PLEDGED (ERR_CIAC_PLEDGED_OUTSTANDING)"
          - "Variance gate: (actual_direct_cents - approved_estimate_cents) * 100 <= approved_estimate_cents * 15, OR coverage: sum of original_cents over RegulatoryAssets with source_work_order_id = this work order and status in {APPROVED, AMORTIZING, FULLY_AMORTIZED} >= actual_direct_cents - approved_estimate_cents - floor(approved_estimate_cents * 15 / 100); no coverage at all -> ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE; some coverage but below the needed amount -> ERR_REGULATORY_COVERAGE_INSUFFICIENT (underruns never block)"
          - "CAPITAL orders: unitization_lines must be non-empty (ERR_UNITIZATION_EMPTY); EXPENSE orders: unitization_lines must be empty"
          - "Every unitization line: quantity >= 1 and unit_catalog_id exists; sum over lines of quantity * standard_cost_cents must be > 0 (ERR_UNITIZATION_ZERO_TARGET)"
        side_effects:
          - "gross_cwip_cents := cwip_cents (snapshot); ciac_applied_cents := min(sum of RECEIVED CIAC received_cents, gross_cwip_cents)"
          - "RECEIVED CIAC agreements -> APPLIED (applied_cents = min(received, gross); refunded_cents = received - applied records the closeout excess refund)"
          - "capitalizable_total_cents := NET_OF_CIAC ? gross - ciac_applied : gross; program.ciac_contra_balance_cents += ciac_applied_cents under GROSS_WITH_CONTRA"
          - "Unitization waterfall creates one FixedAssetUnit per line (status IN_SERVICE, in_service_period_id copied)"
          - "program.committed_amount_cents -= approved_estimate_cents; program.capitalized_actual_cents += capitalizable_total_cents"
          - "closed_by_user_id := X-User-ID; WorkOrder.version increments"

  - entity: Estimate
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system — a new estimate is created on the same work order (POST /ucp/estimates)"
        actor: system
        preconditions: []
        side_effects: ["The new estimate takes the next estimate_seq; the work order's version increments"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /ucp/estimates/{estimate_id}/approve"
        actor: "WorkOrderSupervisor or Controller per routing tier"
        preconditions:
          - "Work order status in {SUBMITTED, AUTHORIZED, IN_PROGRESS, SUSPENDED} (ERR_INVALID_STATE)"
          - "Routing tier: no current approved estimate -> SUPERVISOR tier; otherwise |new - current| * 100 >= current * 10 -> CONTROLLER tier, else SUPERVISOR tier; wrong role for the tier -> ERR_APPROVAL_TIER_REQUIRED"
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "estimated_cost_cents >= work_order.actual_direct_cents (ERR_ESTIMATE_BELOW_ACTUALS)"
          - "OCC: expected_work_order_version must equal WorkOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "Previously APPROVED estimate (if any) -> SUPERSEDED; this estimate's supersedes_estimate_id := that estimate's id (link 1)"
          - "work_order.approved_estimate_cents := estimated_cost_cents; routing_tier recorded; decided_by_user_id set (link 2)"
          - "If the work order is AUTHORIZED, IN_PROGRESS, or SUSPENDED: program.committed_amount_cents += (new approved - old approved) (link 2)"
          - "work_order.variance_posture recomputed: RE_ESTIMATE_REQUIRED clears when actual_direct_cents * 100 <= approved_estimate_cents * 110 (link 3)"
          - "WorkOrder.version increments"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /ucp/estimates/{estimate_id}/reject"
        actor: "WorkOrderSupervisor or Controller per the same routing tier as approve"
        preconditions:
          - "Work order status in {SUBMITTED, AUTHORIZED, IN_PROGRESS, SUSPENDED} (ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by_user_id set"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a different estimate on the same work order is approved"
        actor: system
        preconditions: []
        side_effects: ["The newly approved estimate records supersedes_estimate_id := this estimate's id"]

  - entity: CostCharge
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /ucp/cost-charges/{charge_id}/reverse (only kind=ORIGINAL may be reversed; reversing a REVERSAL -> ERR_REVERSAL_NOT_ALLOWED; already REVERSED -> ERR_CHARGE_ALREADY_REVERSED)"
        actor: FieldClerk
        preconditions:
          - "An AccountingPeriod in OPEN or REOPENED must exist to receive the reversal row (ERR_PERIOD_NOT_FOUND)"
        side_effects:
          - "A new CostCharge row is created: kind=REVERSAL, reverses_charge_id = this charge, base/overhead/total negated, charge_date = current logical clock date (informational), accounting_period_id = the single currently OPEN or REOPENED period regardless of that date"
          - "work_order.actual_direct_cents and cwip_cents recomputed (the pair nets to zero)"
          - "work_order.variance_posture recomputed (reversal may clear RE_ESTIMATE_REQUIRED)"

  - entity: CIACAgreement
    initial_state: PLEDGED
    terminal_states: [APPLIED, REFUNDED, EXPIRED, CANCELLED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /ucp/ciac-agreements/{ciac_id}/receive"
        actor: RateAnalyst
        preconditions:
          - "Logical clock <= pledge_expiry_at (ERR_CIAC_EXPIRED; the agreement flips to EXPIRED on this failed attempt)"
          - "Work order status in {DRAFT, SUBMITTED, RETURNED, AUTHORIZED, IN_PROGRESS, SUSPENDED, COMPLETED} (funds may arrive after in-service but before closeout; ERR_INVALID_STATE otherwise)"
        side_effects: ["received_cents := pledged_cents"]
      - from: PLEDGED
        to: EXPIRED
        trigger: "system — logical clock passes pledge_expiry_at; applied lazily on receive and swept at every period close"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: APPLIED
        trigger: "system — work order closeout"
        actor: system
        preconditions: []
        side_effects: ["applied_cents := min(received_cents, gross_cwip share); refunded_cents := received_cents - applied_cents (excess refund)"]
      - from: RECEIVED
        to: REFUNDED
        trigger: "system — work order cancelled from AUTHORIZED (0% forfeiture), IN_PROGRESS or SUSPENDED (10% forfeiture)"
        actor: system
        preconditions: []
        side_effects: ["forfeited_cents and refunded_cents recorded per the forfeiture rule"]
      - from: PLEDGED
        to: CANCELLED
        trigger: "system — work order cancelled before receipt"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FixedAssetUnit
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /ucp/fixed-asset-units/{unit_id}/retire"
        actor: Controller
        preconditions:
          - "retirement_date must fall inside the single AccountingPeriod currently in OPEN or REOPENED (ERR_RETIREMENT_PERIOD_NOT_OPEN)"
        side_effects:
          - "retirement_period_id set; the retirement-period close posts the final half-month DepreciationEntry and then sets retirement_nbv_cents = allocated_cost_cents - accumulated_depreciation_cents"

  - entity: RegulatoryAsset
    initial_state: PROPOSED
    terminal_states: [REJECTED, FULLY_AMORTIZED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /ucp/regulatory-assets/{reg_asset_id}/approve"
        actor: Controller
        preconditions:
          - "Segregation of duties: X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id set"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /ucp/regulatory-assets/{reg_asset_id}/reject"
        actor: Controller
        preconditions:
          - "Segregation of duties: X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: AMORTIZING
        trigger: "system — first period close that amortizes this asset"
        actor: system
        preconditions: []
        side_effects: ["AmortizationEntry created; remaining_cents decreases"]
      - from: AMORTIZING
        to: FULLY_AMORTIZED
        trigger: "system — a period close brings remaining_cents to exactly 0"
        actor: system
        preconditions: []
        side_effects: ["Final AmortizationEntry absorbs the rounding remainder"]
      - from: AMORTIZING
        to: APPROVED
        trigger: "system — period reopen reverses every entry the asset had, returning remaining_cents to original_cents"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_AMORTIZED
        to: AMORTIZING
        trigger: "system — period reopen reverses the final entry, leaving remaining_cents > 0"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AccountingPeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /ucp/accounting-periods/{period_id}/close"
        actor: Controller
        preconditions: []
        side_effects:
          - "Step 1 AFUDC: for each CAPITAL WorkOrder in AUTHORIZED, IN_PROGRESS, or SUSPENDED whose program is OPEN, create an AFUDCEntry per the afudc_accrual calculation (skip when the computed amount rounds to 0); update afudc_total_cents and cwip_cents"
          - "Step 2 depreciation: for each FixedAssetUnit IN_SERVICE whose in_service_period start_date <= this period end_date, plus each RETIRED unit whose retirement_period_id = this period, create a DepreciationEntry per the depreciation_charge calculation; update accumulated_depreciation_cents; set retirement_nbv_cents on units retired in this period; accrue ciac_contra_credit into program.ciac_contra_balance_cents decrement under GROSS_WITH_CONTRA"
          - "Step 3 amortization: for each RegulatoryAsset in APPROVED or AMORTIZING, create an AmortizationEntry per the amortization_schedule calculation; APPROVED -> AMORTIZING; remaining_cents hitting 0 -> FULLY_AMORTIZED"
          - "Step 4 CIAC sweep: PLEDGED agreements with pledge_expiry_at earlier than the current logical clock -> EXPIRED"
          - "Step 5: status -> CLOSED; closed_at := logical clock"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /ucp/accounting-periods/{period_id}/reopen"
        actor: Controller
        preconditions:
          - "No AccountingPeriod currently in OPEN or REOPENED (ERR_PERIOD_ALREADY_OPEN)"
          - "This period is the most recently created CLOSED period (ERR_PERIOD_REOPEN_NOT_LATEST)"
        side_effects:
          - "Every AFUDCEntry, DepreciationEntry, and AmortizationEntry posted by this period's close and still ACCRUED/POSTED -> REVERSED (compensation)"
          - "afudc_total_cents, cwip_cents, accumulated_depreciation_cents, retirement_nbv_cents, remaining_cents, and ciac_contra_balance_cents recomputed without the reversed entries"
          - "RegulatoryAsset status recompute: remaining == original -> APPROVED; 0 < remaining < original -> AMORTIZING"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /ucp/accounting-periods/{period_id}/close (re-close recomputes all accruals fresh from current state, so charges posted during the reopen window are included)"
        actor: Controller
        preconditions: []
        side_effects: ["Identical five steps as OPEN -> CLOSED"]

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on WorkOrder.version only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /ucp/estimates"
    occ_field: "expected_work_order_version"
    description: |
      Creating an estimate legitimately withdraws the work order's currently
      PROPOSED estimate and bumps the work order's estimate_seq and version. A
      creation request carrying an expected_work_order_version that no longer
      equals WorkOrder.version is rejected: the caller's view of the work order
      (which estimate is PROPOSED, what the current seq is) is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: estimate-approve-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /ucp/estimates/{estimate_id}/approve"
    occ_field: "expected_work_order_version"
    description: |
      Approving an estimate legitimately supersedes the work order's currently
      APPROVED estimate and advances WorkOrder.version. An approval carrying an
      expected_work_order_version that no longer equals WorkOrder.version is
      rejected: the caller decided on a stale picture of which estimate is
      approved and what the work order's budget commitment is.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: overhead_loading
    trigger: "POST /ucp/cost-charges (and the reversal row creation, with negated base)"
    algorithm: aggregation
    formula: |
      rate = OverheadSchedule.rate_pct where cost_type matches, order_type == work_order.order_type,
             and effective_from <= charge_date < (effective_to or infinity); exactly one row may match
             (creation enforces non-overlap); none -> ERR_OVERHEAD_RATE_NOT_FOUND.
      overhead_amount_cents = round_half_up(base_amount_cents * rate_pct / 100)   # per charge row
      total_cents = base_amount_cents + overhead_amount_cents
      PINNED ROUNDING ORDER: overhead is rounded per individual charge row FIRST, then summed into
      work-order totals. Computing overhead on the sum of bases is FORBIDDEN and yields different
      cents (e.g. 3 rows of 100c at 2.5%: per-row 3 * round(2.5) = 9c overhead vs round(7.5) = 8c).
    input_set: "The single charge being posted; the matching OverheadSchedule row"
    constants:
      ROUNDING: "round_half_up to whole cents, per charge row"
    precision: "0 decimal places on cents, round_half_up"

  - name: cwip_aggregation
    trigger: "charge posted, charge reversed, AFUDC accrual, period reopen (recompute), closeout (snapshot)"
    algorithm: aggregation
    formula: |
      actual_direct_cents = sum(total_cents) over ALL CostCharge rows of the work order
                            (ORIGINAL rows remain in the sum after flipping to REVERSED;
                            the compensating REVERSAL row carries the exact negation)
      afudc_total_cents   = sum(amount_cents) over AFUDCEntry where status = ACCRUED
      cwip_cents          = actual_direct_cents + afudc_total_cents
      Reversal conserves the balance: posting charge C then reversing C leaves
      actual_direct_cents identical to its pre-charge value (C stays in the sum as
      REVERSED-marked, and its REVERSAL row contributes -C.total_cents; the pair nets 0).
    input_set: "All CostCharges of the work order; all AFUDCEntries of the work order"
    precision: "integer cents"

  - name: variance_posture_derivation
    trigger: "charge posted, charge reversed, estimate approved, work-order authorization (recompute)"
    algorithm: threshold
    formula: |
      if approved_estimate_cents is null: variance_posture = WITHIN_TOLERANCE
      elif actual_direct_cents * 100 > approved_estimate_cents * VARIANCE_BLOCK_PCT:
          variance_posture = RE_ESTIMATE_REQUIRED     # strictly greater: exactly 110.00% stays WITHIN
      else: variance_posture = WITHIN_TOLERANCE
      Integer arithmetic only (no floats): compare actual_direct_cents * 100 against
      approved_estimate_cents * 110. AFUDC is EXCLUDED from actual_direct_cents.
      While RE_ESTIMATE_REQUIRED, POST /ucp/cost-charges rejects with ERR_VARIANCE_HOLD;
      the charge that itself crosses the threshold is allowed and flips the posture for the NEXT charge.
    input_set: "The work order's approved_estimate_cents and actual_direct_cents"
    constants:
      VARIANCE_BLOCK_PCT: 110
    precision: "exact integer comparison"

  - name: estimate_approval_routing
    trigger: "POST /ucp/estimates/{estimate_id}/approve and /reject (tier computed at decision time)"
    algorithm: threshold
    formula: |
      if work_order.approved_estimate_cents is null: tier = SUPERVISOR
      elif abs(estimated_cost_cents - approved_estimate_cents) * 100 >= approved_estimate_cents * REESTIMATE_CONTROLLER_PCT:
          tier = CONTROLLER     # boundary is inclusive: exactly 10.00% requires Controller
      else: tier = SUPERVISOR
      Wrong role for the tier -> ERR_APPROVAL_TIER_REQUIRED. Controller may decide any tier.
    input_set: "The estimate being decided; the work order's current approved_estimate_cents"
    constants:
      REESTIMATE_CONTROLLER_PCT: 10
    precision: "exact integer comparison"

  - name: authorization_tier
    trigger: "POST /ucp/work-orders/{work_order_id}/authorize"
    algorithm: threshold
    formula: |
      if approved_estimate_cents < AUTHORIZE_CONTROLLER_THRESHOLD_CENTS: WorkOrderSupervisor may authorize
      else: Controller only (ERR_APPROVAL_TIER_REQUIRED for WorkOrderSupervisor)
      Boundary: exactly 10,000,000 cents requires Controller (strictly-less belongs to Supervisor).
    input_set: "The work order's approved_estimate_cents"
    constants:
      AUTHORIZE_CONTROLLER_THRESHOLD_CENTS: 10000000
    precision: "exact integer comparison"

  - name: afudc_accrual
    trigger: "AccountingPeriod close (step 1)"
    algorithm: forward_looking
    formula: |
      composite_monthly_rate_pct = (afudc_debt_weight_pct * afudc_debt_rate_pct
                                    + (100 - afudc_debt_weight_pct) * afudc_equity_rate_pct) / 100 / 12
      EVALUATION ORDER (pinned — the dependency is circular-looking and must be resolved in this order):
        1. begin_cwip = cwip_cents BEFORE this period's accrual (includes all prior periods' AFUDC —
           AFUDC compounds across periods; this period's own accrual is never in its own base)
        2. net_begin = max(0, begin_cwip - ciac_received_to_date)   # CIAC-financed CWIP earns no AFUDC;
           ciac_received_to_date = sum(received_cents) over CIACAgreements in RECEIVED or APPLIED
        3. period_charges = sum(total_cents) of charges counted by cwip_aggregation whose
           accounting_period_id == this period
        4. base = HALF_MONTH: net_begin + 0.5 * period_charges
                  FULL_MONTH: net_begin + period_charges
        5. amount_cents = round_half_up(base * composite_monthly_rate_pct / 100); skip the entry when 0
      Eligible work orders: order_type = CAPITAL and status in {AUTHORIZED, IN_PROGRESS, SUSPENDED}
      (AFUDC stops at completion — in-service date — and never accrues on EXPENSE orders).
      Periods accrue in chronological close order; each period's begin is the prior period's end.
    input_set: "CAPITAL work orders in AUTHORIZED/IN_PROGRESS/SUSPENDED under OPEN programs; their charges, CIAC receipts, and program AFUDC parameters"
    precision: "0 decimal places on cents, round_half_up"
    variants:
      - name: half_month_convention
        when: "CapitalProgram.afudc_method = HALF_MONTH"
        difference: "Current-period charges contribute only half their value to the base (mid-period convention); 200,000c of charges at a 1% monthly rate accrue 1,000c"
      - name: full_month_convention
        when: "CapitalProgram.afudc_method = FULL_MONTH"
        difference: "Current-period charges contribute their full value; identical inputs accrue 2,000c — exactly double the half-month result when begin_cwip is 0"

  - name: unitization_allocation
    trigger: "POST /ucp/work-orders/{work_order_id}/closeout"
    algorithm: waterfall_allocation
    formula: |
      total = capitalizable_total_cents  (NET_OF_CIAC: gross - ciac_applied; GROSS_WITH_CONTRA: gross)
      For each line i: target_i = quantity_i * UnitCatalog.standard_cost_cents_i
      S = sum(target_i); require S > 0 (ERR_UNITIZATION_ZERO_TARGET)
      PINNED ROUNDING ORDER (per-line first, remainder waterfall second):
        1. allocation_i = round_half_up(total * target_i / S)        # per line, cents
        2. remainder = total - sum(allocation_i)                     # may be negative
        3. Apply remainder to the line with the greatest target_i;
           tie -> greatest standard_cost_cents_i; further tie -> asset_class lexicographically ASC
      One FixedAssetUnit row per line with allocated_cost_cents = final allocation_i.
      Worked example (pinned for tests): total = 100,003; targets 50,000 / 20,000 / 30,000 (S = 100,000)
      -> raw 50,002 / 20,001 / 30,001; remainder = -1 -> TRANSFORMER line (greatest target)
      -> final 50,001 / 20,001 / 30,001; sum = 100,003 exactly.
    input_set: "unitization_lines of the closeout request; UnitCatalog rows; the work order's capitalizable_total_cents"
    precision: "0 decimal places on cents, round_half_up; remainder waterfall pinned above"

  - name: depreciation_charge
    trigger: "AccountingPeriod close (step 2); also evaluated for FixedAssetUnit reads of accumulated_depreciation_cents"
    algorithm: aggregation
    formula: |
      monthly_full = round_half_up(allocated_cost_cents * annual_depreciation_rate_pct / 1200)
      factor = 0.5 if this period == in_service_period_id
               0.5 if this period == retirement_period_id
               1.0 otherwise
      (a unit placed in service and retired in the SAME period gets a single 0.5 entry, not 1.0)
      amount_cents = round_half_up(monthly_full * factor)
      Eligibility at a period close: IN_SERVICE units with in_service_period.start_date <= period.end_date;
      plus RETIRED units whose retirement_period_id == this period (final half-month entry, then
      retirement_nbv_cents = allocated_cost_cents - accumulated_depreciation_cents including this entry).
      No depreciation for periods strictly before the in-service period or strictly after the
      retirement period. CONTRA credit (GROSS_WITH_CONTRA programs only):
      ciac_contra_credit_cents = round_half_up(amount_cents * work_order.ciac_applied_cents / work_order.gross_cwip_cents);
      0 when the program is NET_OF_CIAC.
    input_set: "FixedAssetUnits of the program's work orders; UnitCatalog rates; work-order closeout snapshots"
    precision: "0 decimal places on cents, round_half_up at each step (monthly_full first, then factor)"
    variants:
      - name: net_of_ciac_basis
        when: "CapitalProgram.ciac_method = NET_OF_CIAC"
        difference: "Units are allocated gross minus CIAC, so depreciation runs on the NET basis (e.g. 100,000c at 12%/yr: full month 1,000c, in-service month 500c) and contra credit is 0"
      - name: gross_with_contra_basis
        when: "CapitalProgram.ciac_method = GROSS_WITH_CONTRA"
        difference: "Identical physical data capitalizes the GROSS 120,000c, so the same rate yields full month 1,200c, in-service month 600c, and every entry also carries a ciac_contra_credit_cents (600c entry -> 100c credit when applied=20,000 of gross=120,000)"

  - name: amortization_schedule
    trigger: "AccountingPeriod close (step 3)"
    algorithm: aggregation
    formula: |
      monthly = round_half_up(original_cents / amortization_months)
      n = count of AmortizationEntries already POSTED for this asset (0-based before this entry)
      entry = remaining_cents            if n == amortization_months - 1   # final scheduled month plugs the remainder
              min(monthly, remaining_cents) otherwise
      remaining_cents -= entry
      status: APPROVED -> AMORTIZING on first entry; AMORTIZING -> FULLY_AMORTIZED when remaining_cents == 0
      Example: original 10,000c over 3 months -> 3,333 / 3,333 / 3,334 (final scheduled month plugs).
    input_set: "RegulatoryAssets in APPROVED or AMORTIZING at close time"
    precision: "0 decimal places on cents, round_half_up"

  - name: ciac_refund
    trigger: "Work order cancellation with a RECEIVED CIAC agreement"
    algorithm: threshold
    formula: |
      if cancelled from AUTHORIZED (never reached IN_PROGRESS): forfeited_cents = 0
      if cancelled from IN_PROGRESS or SUSPENDED: forfeited_cents = round_half_up(received_cents * FORFEIT_PCT / 100)
      refunded_cents = received_cents - forfeited_cents
      At closeout instead: applied = min(received, gross_cwip); excess refunded_cents = received - applied; forfeiture 0.
    input_set: "CIACAgreements of the work order in RECEIVED"
    constants:
      FORFEIT_PCT: 10
    precision: "0 decimal places on cents, round_half_up"

  - name: program_budget_accounting
    trigger: "work order authorize, cancel, closeout; estimate approval on an authorized-or-later work order"
    algorithm: aggregation
    formula: |
      committed_amount_cents = sum(approved_estimate_cents) over work orders in
                               {AUTHORIZED, IN_PROGRESS, SUSPENDED, COMPLETED}   # COMPLETED stays committed until closeout
      available_amount_cents = authorized_amount_cents - committed_amount_cents
      CONSERVED QUANTITY: authorize then cancel (or closeout) the same work order leaves
      committed_amount_cents identical to its pre-authorize value.
      capitalized_actual_cents accumulates capitalizable_total_cents at closeout (never decreases).
    input_set: "All work orders of the program"
    precision: "integer cents"

  - name: closeout_variance_gate
    trigger: "POST /ucp/work-orders/{work_order_id}/closeout"
    algorithm: threshold
    formula: |
      overrun = actual_direct_cents - approved_estimate_cents
      tolerance = floor(approved_estimate_cents * CLOSEOUT_TOLERANCE_PCT / 100)   # integer floor
      if overrun * 100 <= approved_estimate_cents * CLOSEOUT_TOLERANCE_PCT: gate passes (underruns always pass)
      else: coverage_needed = overrun - tolerance
            coverage = sum(original_cents) over RegulatoryAssets with source_work_order_id = this work order
                       and status in {APPROVED, AMORTIZING, FULLY_AMORTIZED}
            coverage == 0 -> ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE
            0 < coverage < coverage_needed -> ERR_REGULATORY_COVERAGE_INSUFFICIENT
            coverage >= coverage_needed -> gate passes (boundary: equality passes)
      Example: approved 100,000c, actual 116,000c -> tolerance 15,000, coverage_needed 1,000c.
    input_set: "The work order; its linked RegulatoryAssets"
    constants:
      CLOSEOUT_TOLERANCE_PCT: 15
    precision: "exact integer comparison; floor on tolerance"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present (non-empty) on all mutating endpoints"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role is listed in the endpoint's roles (endpoint-level permission)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist, then body foreign-key references exist (program_id, work_order_id, unit_catalog_id inside unitization_lines, source_work_order_id), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present; enum fields take declared members; numeric ranges (amounts > 0, quantity >= 1, amortization_months >= 1, rate bounds, weight 0..100); date fields parse; end_date >= start_date; CapitalProgram.code and UnitCatalog.asset_class unique"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: auth
    check: "Tiered authorization: authorize tier by approved amount (Supervisor < 10,000,000c <= Controller); estimate decision tier by 10% delta rule; a role in the endpoint's role list but below the tier is rejected"
    error_id: ERR_APPROVAL_TIER_REQUIRED
    http_status: 403
    applies_to: "POST /ucp/work-orders/{id}/authorize; POST /ucp/estimates/{id}/approve; POST /ucp/estimates/{id}/reject"
  - priority: 6
    category: business_constraint
    check: "OCC: expected_work_order_version equals the work order's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ucp/estimates; POST /ucp/estimates/{id}/approve"
  - priority: 7
    category: state
    check: "Target entity in a legal from-state for the transition (all state-machine preconditions; includes ERR_INVALID_STATE, ERR_WORK_ORDER_SUSPENDED, ERR_PROGRAM_CLOSED, ERR_CHARGE_ALREADY_REVERSED, ERR_REVERSAL_NOT_ALLOWED, ERR_UNIT_ALREADY_RETIRED, ERR_PERIOD_ALREADY_OPEN, ERR_PERIOD_REOPEN_NOT_LATEST)"
    error_id: "ERR_INVALID_STATE (or the domain-specific state error listed)"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: auth
    check: "Segregation of duties: X-User-ID differs from created_by_user_id (authorize), submitted_by_user_id (estimate approve/reject), proposed_by_user_id (reg-asset approve/reject), completed_by_user_id (closeout)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "authorize, estimate approve/reject, regulatory-asset approve/reject, closeout"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: charge_date falls in an existing period (ERR_PERIOD_NOT_FOUND) that is OPEN or REOPENED (ERR_PERIOD_CLOSED); reversal requires an OPEN or REOPENED period to exist (ERR_PERIOD_NOT_FOUND); new period strictly adjacent to the latest (ERR_PERIOD_NOT_ADJACENT); in-service and retirement dates fall in the current OPEN/REOPENED period (ERR_IN_SERVICE_PERIOD_NOT_OPEN, ERR_RETIREMENT_PERIOD_NOT_OPEN); CIAC receive before pledge_expiry_at (ERR_CIAC_EXPIRED)"
    error_id: "ERR_PERIOD_NOT_FOUND | ERR_PERIOD_CLOSED | ERR_PERIOD_NOT_ADJACENT | ERR_IN_SERVICE_PERIOD_NOT_OPEN | ERR_RETIREMENT_PERIOD_NOT_OPEN | ERR_CIAC_EXPIRED"
    http_status: 422
    applies_to: "charge create/reverse, period create, complete, retire, ciac receive"
  - priority: 10
    category: business_referential
    check: "Cross-entity reference rules: overhead rate resolvable for (cost_type, order_type, charge_date) (ERR_OVERHEAD_RATE_NOT_FOUND); overhead schedule creation overlaps an existing schedule for the same (cost_type, order_type) (ERR_OVERHEAD_SCHEDULE_OVERLAP); program close has no non-terminal work orders (ERR_PROGRAM_HAS_OPEN_WORK_ORDERS); no PLEDGED CIAC at closeout (ERR_CIAC_PLEDGED_OUTSTANDING); unitization lines non-empty for CAPITAL / empty for EXPENSE (ERR_UNITIZATION_EMPTY) with positive total target (ERR_UNITIZATION_ZERO_TARGET); approved estimate exists at authorize (ERR_NO_APPROVED_ESTIMATE)"
    error_id: "ERR_OVERHEAD_RATE_NOT_FOUND | ERR_OVERHEAD_SCHEDULE_OVERLAP | ERR_PROGRAM_HAS_OPEN_WORK_ORDERS | ERR_CIAC_PLEDGED_OUTSTANDING | ERR_UNITIZATION_EMPTY | ERR_UNITIZATION_ZERO_TARGET | ERR_NO_APPROVED_ESTIMATE"
    http_status: 422
    applies_to: "charge create, overhead-schedule create, program close, closeout, authorize"
  - priority: 11
    category: business_fiscal
    check: "Fiscal rules: budget at authorize (ERR_PROGRAM_BUDGET_EXCEEDED); variance posture gate on charging (ERR_VARIANCE_HOLD); re-estimate not below actuals (ERR_ESTIMATE_BELOW_ACTUALS); closeout variance gate (ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE, ERR_REGULATORY_COVERAGE_INSUFFICIENT); writeoff disposition present when required (ERR_WRITEOFF_DISPOSITION_REQUIRED)"
    error_id: "ERR_PROGRAM_BUDGET_EXCEEDED | ERR_VARIANCE_HOLD | ERR_ESTIMATE_BELOW_ACTUALS | ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE | ERR_REGULATORY_COVERAGE_INSUFFICIENT | ERR_WRITEOFF_DISPOSITION_REQUIRED"
    http_status: "422 (ERR_VARIANCE_HOLD: 409; ERR_WRITEOFF_DISPOSITION_REQUIRED: 400)"
    applies_to: "authorize, charge create, estimate approve, closeout, cancel"

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role, or missing X-User-ID on a mutating endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's role list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum member, numeric range violation, unparsable date, duplicate code/asset_class" }
  - { id: ERR_APPROVAL_TIER_REQUIRED, http: 403, condition: "Role is endpoint-allowed but below the required tier (authorize >= 10,000,000c; estimate decision with |delta| >= 10%)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_order_version != current WorkOrder.version on estimate create or approve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a legal from-state for the requested transition (generic state error)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "X-User-ID equals the prior step's actor: created_by_user_id (authorize), submitted_by_user_id (estimate approve/reject), proposed_by_user_id (regulatory-asset approve/reject), or completed_by_user_id (closeout)" }
  - { id: ERR_WORK_ORDER_SUSPENDED, http: 409, condition: "Charge posted while the work order is SUSPENDED" }
  - { id: ERR_PROGRAM_CLOSED, http: 409, condition: "Work-order creation against a CLOSED CapitalProgram" }
  - { id: ERR_CHARGE_ALREADY_REVERSED, http: 409, condition: "Reversing an ORIGINAL charge already in REVERSED" }
  - { id: ERR_REVERSAL_NOT_ALLOWED, http: 409, condition: "Reversing a charge whose kind is REVERSAL" }
  - { id: ERR_UNIT_ALREADY_RETIRED, http: 409, condition: "Retiring a FixedAssetUnit already RETIRED" }
  - { id: ERR_PERIOD_ALREADY_OPEN, http: 409, condition: "Creating a period, or reopening one, while another period is OPEN or REOPENED" }
  - { id: ERR_PERIOD_REOPEN_NOT_LATEST, http: 409, condition: "Reopening a CLOSED period that is not the most recently created period" }
  - { id: ERR_PERIOD_NOT_FOUND, http: 422, condition: "charge_date (or reversal clock date) falls inside no existing AccountingPeriod" }
  - { id: ERR_PERIOD_CLOSED, http: 422, condition: "charge_date falls in a period that is CLOSED" }
  - { id: ERR_PERIOD_NOT_ADJACENT, http: 422, condition: "New period start_date != latest period end_date + 1 day (gap or overlap)" }
  - { id: ERR_IN_SERVICE_PERIOD_NOT_OPEN, http: 422, condition: "in_service_date not inside the current OPEN or REOPENED period" }
  - { id: ERR_RETIREMENT_PERIOD_NOT_OPEN, http: 422, condition: "retirement_date not inside the current OPEN or REOPENED period" }
  - { id: ERR_CIAC_EXPIRED, http: 422, condition: "Receive attempted after pledge_expiry_at (agreement flips to EXPIRED)" }
  - { id: ERR_OVERHEAD_RATE_NOT_FOUND, http: 422, condition: "No OverheadSchedule row covers (cost_type, order_type, charge_date)" }
  - { id: ERR_OVERHEAD_SCHEDULE_OVERLAP, http: 422, condition: "New schedule's half-open interval intersects an existing schedule for the same (cost_type, order_type); touching bounds (to == from) is NOT overlap" }
  - { id: ERR_PROGRAM_HAS_OPEN_WORK_ORDERS, http: 422, condition: "Program close while any work order is non-terminal" }
  - { id: ERR_NO_APPROVED_ESTIMATE, http: 422, condition: "Authorize without an APPROVED estimate" }
  - { id: ERR_PROGRAM_BUDGET_EXCEEDED, http: 422, condition: "program.available_amount_cents < approved_estimate_cents at authorize" }
  - { id: ERR_VARIANCE_HOLD, http: 409, condition: "Charge posted while variance_posture = RE_ESTIMATE_REQUIRED" }
  - { id: ERR_ESTIMATE_BELOW_ACTUALS, http: 422, condition: "Approving an estimate below the work order's actual_direct_cents" }
  - { id: ERR_WRITEOFF_DISPOSITION_REQUIRED, http: 400, condition: "Cancel with cwip_cents > 0 without writeoff_disposition (or REGULATORY_DEFERRAL without writeoff_amortization_months)" }
  - { id: ERR_CIAC_PLEDGED_OUTSTANDING, http: 422, condition: "Closeout while a CIAC agreement is still PLEDGED" }
  - { id: ERR_UNITIZATION_EMPTY, http: 422, condition: "CAPITAL closeout with zero unitization lines, or EXPENSE closeout with any line" }
  - { id: ERR_UNITIZATION_ZERO_TARGET, http: 422, condition: "Sum of quantity * standard_cost_cents over all closeout lines is 0 (possible only when every referenced catalog row has standard_cost_cents = 0)" }
  - { id: ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE, http: 422, condition: "Overrun beyond 15% with no qualifying RegulatoryAsset coverage at all" }
  - { id: ERR_REGULATORY_COVERAGE_INSUFFICIENT, http: 422, condition: "Qualifying RegulatoryAsset coverage exists but sums below coverage_needed" }

# =============================================================================
# Table 1.5: API Endpoint Table (55 endpoints)
# =============================================================================
endpoints:
  # --- CapitalProgram ---
  - { method: POST, path: "/ucp/capital-programs", description: "Create a capital program (budget code) with AFUDC and CIAC method flags; starts OPEN", roles: [SystemAdmin], code: 201, input: [code, fiscal_year, authorized_amount_cents, afudc_debt_rate_pct, afudc_equity_rate_pct, afudc_debt_weight_pct, afudc_method, ciac_method], output: CapitalProgram, side_effects: ["status=OPEN; derived counters 0"] }
  - { method: GET, path: "/ucp/capital-programs/{program_id}", description: "Get one program", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: CapitalProgram, side_effects: [] }
  - { method: GET, path: "/ucp/capital-programs", description: "List programs", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["fiscal_year?", "status?", "limit?", "offset?"], output: "CapitalProgram[]", side_effects: [] }
  - { method: POST, path: "/ucp/capital-programs/{program_id}/close", description: "Close the program; requires all work orders terminal", roles: [Controller], code: 200, input: [], output: CapitalProgram, side_effects: ["status -> CLOSED"] }

  # --- UnitCatalog ---
  - { method: POST, path: "/ucp/unit-catalog", description: "Create a unit catalog entry (asset class standard cost and depreciation rate)", roles: [SystemAdmin], code: 201, input: [asset_class, standard_cost_cents, annual_depreciation_rate_pct], output: UnitCatalog, side_effects: [] }
  - { method: GET, path: "/ucp/unit-catalog/{catalog_id}", description: "Get one catalog entry", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: UnitCatalog, side_effects: [] }
  - { method: GET, path: "/ucp/unit-catalog", description: "List catalog entries", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["asset_class?", "limit?", "offset?"], output: "UnitCatalog[]", side_effects: [] }

  # --- OverheadSchedule ---
  - { method: POST, path: "/ucp/overhead-schedules", description: "Create an effective-dated overhead rate row; half-open [effective_from, effective_to) intervals per (cost_type, order_type) must not overlap (touching bounds allowed)", roles: [SystemAdmin], code: 201, input: [cost_type, order_type, rate_pct, effective_from, "effective_to?"], output: OverheadSchedule, side_effects: [] }
  - { method: GET, path: "/ucp/overhead-schedules/{schedule_id}", description: "Get one overhead schedule", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: OverheadSchedule, side_effects: [] }
  - { method: GET, path: "/ucp/overhead-schedules", description: "List overhead schedules", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["cost_type?", "order_type?", "limit?", "offset?"], output: "OverheadSchedule[]", side_effects: [] }

  # --- AccountingPeriod ---
  - { method: POST, path: "/ucp/accounting-periods", description: "Create the next accounting period; requires every existing period CLOSED and start_date = latest end_date + 1 day (first period: any start); at most one OPEN/REOPENED period exists", roles: [SystemAdmin], code: 201, input: [fiscal_year, period_no, start_date, end_date], output: AccountingPeriod, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/ucp/accounting-periods/{period_id}", description: "Get one period", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: AccountingPeriod, side_effects: [] }
  - { method: GET, path: "/ucp/accounting-periods", description: "List periods", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["fiscal_year?", "status?", "limit?", "offset?"], output: "AccountingPeriod[]", side_effects: [] }
  - { method: POST, path: "/ucp/accounting-periods/{period_id}/close", description: "Ops-run checkpoint: AFUDC accrual, depreciation, amortization, CIAC expiry sweep, then CLOSED; valid from OPEN or REOPENED", roles: [Controller], code: 200, input: [], output: AccountingPeriod, side_effects: ["creates AFUDCEntry/DepreciationEntry/AmortizationEntry rows; updates CWIP, accumulated depreciation, remaining balances; CIAC sweep; status -> CLOSED"] }
  - { method: POST, path: "/ucp/accounting-periods/{period_id}/reopen", description: "Reopen the latest CLOSED period; compensates (reverses) every entry its close posted", roles: [Controller], code: 200, input: [], output: AccountingPeriod, side_effects: ["entries -> REVERSED; balances recomputed; status -> REOPENED"] }

  # --- WorkOrder ---
  - { method: POST, path: "/ucp/work-orders", description: "Create a work order under an OPEN program; seeds Estimate #1 (PROPOSED) from initial_estimated_cost_cents", roles: [ProjectEngineer], code: 201, input: [program_id, order_type, title, initial_estimated_cost_cents], output: WorkOrder, side_effects: ["status=DRAFT; seed Estimate(seq=1, PROPOSED) created; created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/ucp/work-orders/{work_order_id}", description: "Get one work order", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: GET, path: "/ucp/work-orders", description: "List work orders", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["program_id?", "status?", "order_type?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/submit", description: "Submit for approval (DRAFT or RETURNED -> SUBMITTED)", roles: [ProjectEngineer], code: 200, input: [], output: WorkOrder, side_effects: ["increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/return", description: "Return a submitted work order to the engineer (SUBMITTED -> RETURNED)", roles: [WorkOrderSupervisor], code: 200, input: [reason], output: WorkOrder, side_effects: ["increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/authorize", description: "Authorize spending (SUBMITTED -> AUTHORIZED); tiered by approved amount; commits program budget; SoD vs creator", roles: [WorkOrderSupervisor, Controller], code: 200, input: [], output: WorkOrder, side_effects: ["program.committed_amount_cents += approved_estimate_cents; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/start", description: "Begin field work (AUTHORIZED -> IN_PROGRESS)", roles: [WorkOrderSupervisor], code: 200, input: [], output: WorkOrder, side_effects: ["increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/suspend", description: "Suspend an in-progress order (IN_PROGRESS -> SUSPENDED); charges rejected while suspended", roles: [WorkOrderSupervisor], code: 200, input: [], output: WorkOrder, side_effects: ["increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/resume", description: "Resume a suspended order (SUSPENDED -> IN_PROGRESS)", roles: [WorkOrderSupervisor], code: 200, input: [], output: WorkOrder, side_effects: ["increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/cancel", description: "Cancel from DRAFT/SUBMITTED/RETURNED/AUTHORIZED/IN_PROGRESS/SUSPENDED; releases budget; write-off per disposition; CIAC refund/forfeiture", roles: [WorkOrderSupervisor], code: 200, input: ["writeoff_disposition?", "writeoff_amortization_months?"], output: WorkOrder, side_effects: ["budget released; RegulatoryAsset created when REGULATORY_DEFERRAL; CIAC -> REFUNDED/CANCELLED; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/complete", description: "Declare in-service (IN_PROGRESS -> COMPLETED); freezes charges; stops AFUDC", roles: [WorkOrderSupervisor], code: 200, input: [in_service_date], output: WorkOrder, side_effects: ["in_service_period_id resolved; completed_by_user_id set; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/work-orders/{work_order_id}/closeout", description: "Close out (COMPLETED -> CLOSED): variance gate, CIAC application, unitization waterfall into FixedAssetUnits, program rollup; SoD vs completer", roles: [Controller], code: 200, input: [unitization_lines], output: WorkOrder, side_effects: ["creates FixedAssetUnit rows; CIAC -> APPLIED; program committed/capitalized updated; increments WorkOrder.version by 1"] }

  # --- Estimate ---
  - { method: POST, path: "/ucp/estimates", description: "Create an estimate on a work order (DRAFT/SUBMITTED/RETURNED/AUTHORIZED/IN_PROGRESS/SUSPENDED); withdraws any currently PROPOSED estimate; OCC on WorkOrder.version", roles: [ProjectEngineer], code: 201, input: [work_order_id, estimated_cost_cents, expected_work_order_version, "notes?"], output: Estimate, side_effects: ["existing PROPOSED estimate -> WITHDRAWN; estimate_seq assigned; increments WorkOrder.version by 1"] }
  - { method: GET, path: "/ucp/estimates/{estimate_id}", description: "Get one estimate", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: Estimate, side_effects: [] }
  - { method: GET, path: "/ucp/estimates", description: "List estimates", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["work_order_id?", "status?", "supersedes_estimate_id?", "limit?", "offset?"], output: "Estimate[]", side_effects: [] }
  - { method: POST, path: "/ucp/estimates/{estimate_id}/approve", description: "Approve a PROPOSED estimate; supersedes the currently APPROVED one; tiered routing; SoD vs submitter; OCC on WorkOrder.version", roles: [WorkOrderSupervisor, Controller], code: 200, input: [expected_work_order_version], output: Estimate, side_effects: ["prior APPROVED -> SUPERSEDED (supersedes_estimate_id set); work_order.approved_estimate_cents updated; program.committed_amount_cents adjusted when authorized-or-later; variance_posture recomputed; increments WorkOrder.version by 1"] }
  - { method: POST, path: "/ucp/estimates/{estimate_id}/reject", description: "Reject a PROPOSED estimate; same tier routing and SoD as approve", roles: [WorkOrderSupervisor, Controller], code: 200, input: [], output: Estimate, side_effects: ["status -> REJECTED; decided_by_user_id set"] }

  # --- CostCharge ---
  - { method: POST, path: "/ucp/cost-charges", description: "Post a labor/equipment/material charge to an AUTHORIZED or IN_PROGRESS work order; resolves overhead rate and period; enforces variance posture", roles: [FieldClerk], code: 201, input: [work_order_id, cost_type, base_amount_cents, charge_date], output: CostCharge, side_effects: ["overhead_amount_cents/total_cents computed per-row; work_order.actual_direct_cents and cwip_cents recomputed; variance_posture recomputed"] }
  - { method: GET, path: "/ucp/cost-charges/{charge_id}", description: "Get one charge", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: CostCharge, side_effects: [] }
  - { method: GET, path: "/ucp/cost-charges", description: "List charges", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["work_order_id?", "accounting_period_id?", "cost_type?", "kind?", "reverses_charge_id?", "limit?", "offset?"], output: "CostCharge[]", side_effects: [] }
  - { method: POST, path: "/ucp/cost-charges/{charge_id}/reverse", description: "Reverse a POSTED ORIGINAL charge; creates a negative REVERSAL row dated at the logical clock and posted into the single currently OPEN/REOPENED period (prior-period adjustment)", roles: [FieldClerk], code: 201, input: [], output: CostCharge, side_effects: ["original -> REVERSED; REVERSAL row created; balances and variance_posture recomputed"] }

  # --- CIACAgreement ---
  - { method: POST, path: "/ucp/ciac-agreements", description: "Pledge a contribution in aid of construction against a non-terminal, non-completed work order", roles: [RateAnalyst], code: 201, input: [work_order_id, pledged_cents, pledge_expiry_at], output: CIACAgreement, side_effects: ["status=PLEDGED"] }
  - { method: GET, path: "/ucp/ciac-agreements/{ciac_id}", description: "Get one CIAC agreement", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: CIACAgreement, side_effects: [] }
  - { method: GET, path: "/ucp/ciac-agreements", description: "List CIAC agreements", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["work_order_id?", "status?", "limit?", "offset?"], output: "CIACAgreement[]", side_effects: [] }
  - { method: POST, path: "/ucp/ciac-agreements/{ciac_id}/receive", description: "Record full receipt of the pledge (PLEDGED -> RECEIVED); expired pledges flip to EXPIRED and fail", roles: [RateAnalyst], code: 200, input: [], output: CIACAgreement, side_effects: ["received_cents := pledged_cents"] }

  # --- FixedAssetUnit ---
  - { method: GET, path: "/ucp/fixed-asset-units/{unit_id}", description: "Get one unitized asset line", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: FixedAssetUnit, side_effects: [] }
  - { method: GET, path: "/ucp/fixed-asset-units", description: "List fixed asset units", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["work_order_id?", "unit_catalog_id?", "status?", "limit?", "offset?"], output: "FixedAssetUnit[]", side_effects: [] }
  - { method: POST, path: "/ucp/fixed-asset-units/{unit_id}/retire", description: "Retire a unit (IN_SERVICE -> RETIRED); retirement period must be the current OPEN/REOPENED one; final half-month depreciation posts at that period's close", roles: [Controller], code: 200, input: [retirement_date], output: FixedAssetUnit, side_effects: ["retirement_period_id set"] }

  # --- RegulatoryAsset ---
  - { method: POST, path: "/ucp/regulatory-assets", description: "Propose a regulatory asset deferral (optionally sourced from a work order)", roles: [RateAnalyst], code: 201, input: [description, original_cents, amortization_months, "source_work_order_id?"], output: RegulatoryAsset, side_effects: ["status=PROPOSED; remaining_cents := original_cents; proposed_by_user_id := X-User-ID"] }
  - { method: GET, path: "/ucp/regulatory-assets/{reg_asset_id}", description: "Get one regulatory asset", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: RegulatoryAsset, side_effects: [] }
  - { method: GET, path: "/ucp/regulatory-assets", description: "List regulatory assets", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["source_work_order_id?", "status?", "limit?", "offset?"], output: "RegulatoryAsset[]", side_effects: [] }
  - { method: POST, path: "/ucp/regulatory-assets/{reg_asset_id}/approve", description: "Approve a PROPOSED regulatory asset; SoD vs proposer", roles: [Controller], code: 200, input: [], output: RegulatoryAsset, side_effects: ["status -> APPROVED; approved_by_user_id set"] }
  - { method: POST, path: "/ucp/regulatory-assets/{reg_asset_id}/reject", description: "Reject a PROPOSED regulatory asset; SoD vs proposer", roles: [Controller], code: 200, input: [], output: RegulatoryAsset, side_effects: ["status -> REJECTED"] }

  # --- Entry logs (read-only) ---
  - { method: GET, path: "/ucp/afudc-entries/{entry_id}", description: "Get one AFUDC entry", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: AFUDCEntry, side_effects: [] }
  - { method: GET, path: "/ucp/afudc-entries", description: "List AFUDC entries", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["work_order_id?", "accounting_period_id?", "status?", "limit?", "offset?"], output: "AFUDCEntry[]", side_effects: [] }
  - { method: GET, path: "/ucp/depreciation-entries/{entry_id}", description: "Get one depreciation entry", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: DepreciationEntry, side_effects: [] }
  - { method: GET, path: "/ucp/depreciation-entries", description: "List depreciation entries", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["fixed_asset_unit_id?", "accounting_period_id?", "status?", "limit?", "offset?"], output: "DepreciationEntry[]", side_effects: [] }
  - { method: GET, path: "/ucp/amortization-entries/{entry_id}", description: "Get one amortization entry", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: [], output: AmortizationEntry, side_effects: [] }
  - { method: GET, path: "/ucp/amortization-entries", description: "List amortization entries", roles: [SystemAdmin, ProjectEngineer, WorkOrderSupervisor, Controller, FieldClerk, RateAnalyst, Auditor], code: 200, input: ["regulatory_asset_id?", "accounting_period_id?", "status?", "limit?", "offset?"], output: "AmortizationEntry[]", side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/ucp/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Drives CIAC pledge expiry and reversal charge dating.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# Table 1.7: RBAC Matrix (all roles opaque; X-User-ID is an operator id string)
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Utility accounting system administrator; owns reference data and the accounting calendar"
    identity: opaque
    exclusive_operations: ["create capital programs", "manage unit catalog", "manage overhead schedules", "create accounting periods", "set logical clock"]
    shared_operations: ["read any resource"]
  - name: ProjectEngineer
    description: "Engineer who scopes capital work; creates work orders and submits estimates"
    identity: opaque
    exclusive_operations: ["create work orders", "submit/resubmit work orders", "create estimates"]
    shared_operations: ["read any resource"]
  - name: WorkOrderSupervisor
    description: "Field supervisor; returns/authorizes small orders, runs start/suspend/resume/cancel/complete, decides small estimate changes"
    identity: opaque
    exclusive_operations: ["return work orders", "start/suspend/resume/cancel/complete work orders", "authorize work orders under 10,000,000 cents", "decide estimates within the 10% routing tier"]
    shared_operations: ["read any resource"]
  - name: Controller
    description: "Corporate controller; authorizes large orders, decides large re-estimates, runs period close/reopen and closeout, approves regulatory assets, retires units, closes programs"
    identity: opaque
    exclusive_operations: ["close capital programs", "close/reopen accounting periods", "closeout work orders", "authorize work orders of any amount", "decide estimates of any tier", "approve/reject regulatory assets", "retire fixed asset units"]
    shared_operations: ["read any resource"]
  - name: FieldClerk
    description: "Cost clerk; posts and reverses labor/equipment/material charges"
    identity: opaque
    exclusive_operations: ["post cost charges", "reverse cost charges"]
    shared_operations: ["read any resource"]
  - name: RateAnalyst
    description: "Rates/regulatory analyst; manages CIAC pledges and proposes regulatory asset deferrals"
    identity: opaque
    exclusive_operations: ["create CIAC agreements", "receive CIAC pledges", "propose regulatory assets"]
    shared_operations: ["read any resource"]
  - name: Auditor
    description: "Read-only auditor"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["read any resource"]
