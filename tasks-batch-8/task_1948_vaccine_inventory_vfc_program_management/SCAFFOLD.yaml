      - "If is_out_of_range AND unit.active_excursion_id IS NOT NULL: update excursion.peak_temperature_c per excursion_peak_temperature calc"
      - "If NOT is_out_of_range AND unit.active_excursion_id IS NOT NULL: close excursion (closed_at=recorded_at; compute duration_minutes)"

