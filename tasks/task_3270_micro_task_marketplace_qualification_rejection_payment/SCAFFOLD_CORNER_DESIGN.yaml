              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Open HIT", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300, required_qualification_ids: [] }
              as: Requester
              as_user_id: "${rid}"
              captures: { hA: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Gated HIT", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300, required_qualification_ids: ["${qt1}"] }
              as: Requester
              as_user_id: "${rid}"
              captures: { hB: $.data.id }
            - call: "POST /mkt/hits/${hA}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hB}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Conditional", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /mkt/hits/${hA}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id }
            - call: "POST /mkt/hits/${hB}/assignments"
              payload: { worker_id: "${w1}" }
