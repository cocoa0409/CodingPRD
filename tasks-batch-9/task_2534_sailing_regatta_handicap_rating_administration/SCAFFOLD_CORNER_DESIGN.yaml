          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_CERTIFICATE_EXPIRED: valid_from is after series_start_utc"
            - "trigger call 2 returns HTTP 422 with error_id ERR_CERTIFICATE_EXPIRED: valid_until is one second before series_start_utc"
            - "trigger call 3 returns HTTP 201 with Entry.${e_b}.registration_status == SUBMITTED: valid_until exactly equal to series_start_utc is inside the inclusive window"
            - "exactly one Entry row exists for regatta ${reg}"
            - "the certificate status is DRAFT on all three rows: entry creation does not require an ISSUED certificate, only a covering one"

      - name: accept_rejections_for_short_and_helmless_crew_manifests
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CREW_MANIFEST_INCOMPLETE]
          - validations[priority 27 ERR_CREW_MANIFEST_INCOMPLETE]
          - endpoints[POST /regatta-ops/entries/{id}/accept]
        distinguishing_aspect: |
          Rule 27 has two independent clauses and each one alone blocks acceptance: entry A is
          refused because registered_crew_count 1 differs from declared_crew_count 2 even though the
          helm is on the manifest, and entry B is refused because its only manifest element is a
