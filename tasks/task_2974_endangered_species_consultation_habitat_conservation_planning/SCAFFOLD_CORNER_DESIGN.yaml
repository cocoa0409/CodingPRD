        grounds:
          - state_machines[entity=ChangedCircumstanceEvent].transitions[REPORTED->RESPONDED]
          - state_machines[entity=ChangedCircumstanceEvent].transitions[REPORTED->RESPONSE_REQUIRED]
          - state_machines[entity=ChangedCircumstanceEvent].transitions[REPORTED->ASSURANCES_INVOKED]
          - calculations.changed_circumstance_cost_allocation
        distinguishing_aspect: >-
          One endpoint, three landing states, chosen by circumstance_type and by
          the reserve balance: a CHANGED cost inside the remaining reserve lands
