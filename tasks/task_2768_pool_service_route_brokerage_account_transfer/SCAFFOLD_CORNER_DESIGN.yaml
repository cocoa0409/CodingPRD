              as: Broker
            - call: "GET /attrition-events"
              payload: {"deal_id": "${deal_id}"}
              as: Broker
          assert:
            - "second event replayed against ${dv1}: HTTP 412, data.error_id == \"ERR_STALE_DEAL_VERSION\"."
            - "GET the deal: data.version == ${dv2} and ${dv2} == ${dv1} + 1 -- the accepted append bumped the version once and the 412 did not bump it again."
            - "the same event against ${dv2}: HTTP 201."
            - "GET the deal: data.attrited_mrr_cents == 1000, data.retained_mrr_cents == 29318, data.net_attrition_mrr_cents == 1000 and data.attrition_pct == 0.033."
            - "GET the deal: data.clawback_status is still \"MONITORING\" -- 1000 does not exceed the 1516 allowance."
            - "GET A1: data.current_mrr_cents == 15000 and data.transfer_status is still \"TRANSFERRED\" -- a downgrade erodes MRR without losing the account."
            - "GET /attrition-events for the deal: data.total_count == 2 -- the rejected append left no row behind."

      - name: listed_versus_verified_valuation_variants_over_one_route
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers.dual_variant_calculation"
          - "calculations.route_valuation"
          - "entities.RouteValuation.fields.basis"
        distinguishing_aspect: "Both bases over one identical account set, plus the delta the switch produces (43000 claimed versus 30318 verified, and the multiple that moves with the weighted age of the surviving input set)."
        excluded_because:
          difficulty_instance: "route_valuation_listed_versus_verified_basis"
          rationale: "That \u00a71.8 dual-formula instance already writes both a LISTED_BASIS and a VERIFIED_BASIS valuation over the same three accounts in one recipe and asserts each component plus the delta between the two totals, which is exactly the claim this layer asks for."

      - name: exclusion_cascades_end_to_end_through_the_valuation_and_the_deal
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers.cascading_side_effects"
          - "state_machines.Deal"
          - "entities.Deal.fields.repricing_reason_code"
        distinguishing_aspect: "A five-level chain from one account write down to the deal status, verified level by level, with the ordering sensitivity that makes the same exclusion harmless before diligence and destructive after it."
        excluded_because:
          difficulty_instance: "exclude_verified_account_five_hop_reprice_cascade"
          rationale: "That \u00a71.8 cascade instance already walks all five hops (account verification_status, listing verified roll-ups and posture, superseded valuation, deal repricing_reason_code, deal status REPRICE_REQUIRED) and asserts every intermediate level, so a separate layer instance would repeat it verbatim."

      - name: clawback_fires_only_strictly_above_the_free_allowance
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers.rate_threshold_triggers"
          - "calculations.deal_retention_ledger"
          - "entities.Deal.fields.allowance_mrr_cents"
        distinguishing_aspect: "The cumulative threshold probed at exactly the allowance and one cent above it, with the ledger recomputed after each append so the trigger is reached by accumulation rather than by a single large event."
        excluded_because:
          difficulty_instance: "clawback_allowance_strictly_greater_boundary"
          rationale: "That \u00a71.8 boundary instance already accumulates attrition to exactly allowance_mrr_cents (still MONITORING) and then one cent beyond it (CLAWBACK_TRIGGERED) on the same deal, covering both the boundary and the reset-free cumulative behaviour this layer asks for."

  - section: consistency_model
    note: "Table-9 claim for consistency_model: immediate -- one multi-entity write whose own response already carries every derived change, with the parent roll-up confirmed on the very next read rather than after a delay."
    instances:

      - name: introduction_side_effects_are_visible_in_the_write_response_itself
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "calculations.introduction_sequence"
          - "entities.RouteListing.fields.introductions_completed_count"
          - "endpoints[POST /service-accounts/{id}/introduce]"
        distinguishing_aspect: "The model is immediate, so a write that mutates three entities must expose all of it at once: the introduce response already carries the stamped deal_id, introduced_on, introduction_sequence_no and INTRODUCED transfer_status, and the listing roll-up read straight afterwards is already incremented -- there is no lag window in which the sequence counter and the account disagree."
