            - "SampleLot.${lot_id}.status == QUARANTINED and quarantine_reason == TEMPERATURE_EXCURSION (hop 1)"
            - "SampleDisbursement.${d1}.reconciliation_status == VOIDED (hop 2, caused by hop 1)"
            - "SampleTransfer.${tr_id}.status == CANCELLED (hop 3, caused by hop 1)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_state_beats_safety_lot_not_releasable
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - concurrency_rules[transfer-request-stale-lot]
        distinguishing_aspect: |
          Category pair (state vs business_safety): a transfer request that is
          BOTH stale-versioned (expected_lot_version behind) AND targets a
          QUARANTINED lot must return ERR_STALE_VERSION (412), because
          priority 5 state/OCC precedes priority 8 safety.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Sender S holds lot L; receiver V exists."
            - "L is QUARANTINED via a CRITICAL excursion assess (so priority 8 would fire)."
            - "S's client view of L.version is one behind current (issuance + quarantine bumped it)."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "CA-01", name: "California" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
