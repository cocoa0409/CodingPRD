              captures: { plant_nb: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Swine Co", entity_type: "PACKER", species_scope: "SWINE" }
              as: ProgramAdmin
              captures: { ent_s: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_s}", plant_code: "EST-501", species: "SWINE", annual_head_history: { "2021": 99999, "2022": 99999, "2023": 99999, "2024": 99999, "2025": 99999 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_s: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_lv: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "BOXED_BEEF", frequency: "WEEKLY", period_start: "2026-07-27T00:00:00Z", period_end: "2026-08-03T00:00:00Z", submission_deadline_utc: "2026-08-04T15:00:00Z", correction_deadline_utc: "2026-08-11T15:00:00Z", publication_release_utc: "2026-08-05T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_bb: $.data.id }
            - call: "GET /reporting-windows/${win_lv}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_lv: $.data.version }
            - call: "POST /submissions"
