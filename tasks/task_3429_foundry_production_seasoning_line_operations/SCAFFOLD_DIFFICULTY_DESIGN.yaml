    instances:
      - name: inventory_reserve_cancel_roundtrip_conserves_units
        grounds:
          - calculations.inventory_availability
          - state_machines.RetailAllocation.PROPOSED_to_CONFIRMED
          - state_machines.RetailAllocation.CONFIRMED_to_CANCELLED
