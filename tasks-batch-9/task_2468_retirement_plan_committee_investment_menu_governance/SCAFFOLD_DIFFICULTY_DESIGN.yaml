          setup:
            - "Logical clock 2026-08-01T00:00:00Z; Plan.fiscal_quarter_index 0, menu_slot_capacity 4, charter ADOPTED, IPS-2026-V ADOPTED (watch_trigger_score_max 40.00, watch_grace_quarters 2)."
