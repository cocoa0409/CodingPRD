# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint role list (incl. carrier-transition role-per-target-state rules)" }
  - { id: ERR_CARRIER_OWNERSHIP_MISMATCH, http: 403, condition: "CarrierManager X-User-ID != carrier_id of the resource in scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type/enum, range violation (gvwr_lbs <= 0, period_month outside 1..12)" }
  - { id: ERR_INVALID_ISS_SCORE, http: 400, condition: "iss_score outside 0..100" }
  - { id: ERR_CREDIT_AMOUNT_OUT_OF_RANGE, http: 400, condition: "claimed_credit_cents or adjudicate credit_amount_cents outside 1..100000, or credit_amount_cents > claimed_credit_cents" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "override end_date <= start_date; subscription start > end, start < today, or end < today; snapshot effective_date > today" }
  - { id: ERR_FUTURE_APPROACH, http: 400, condition: "bypass event approach_at is after the logical clock now" }
  - { id: ERR_STALE_APPROACH, http: 422, condition: "approach_at older than now - 48h (late-arriving feed limit)" }
  - { id: ERR_FUTURE_INSPECTION, http: 400, condition: "inspection inspected_at is after now" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "carrier id does not exist" }
  - { id: ERR_STATE_PROGRAM_CONFIG_NOT_FOUND, http: 404, condition: "state config id does not exist" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "station id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicle id does not exist" }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "credential id does not exist" }
  - { id: ERR_BYPASS_EVENT_NOT_FOUND, http: 404, condition: "bypass event id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute id does not exist" }
  - { id: ERR_OVERRIDE_NOT_FOUND, http: 404, condition: "override id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "from-state does not permit the requested transition (incl. terminal lockdown, same-state no-op, role-incompatible target)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_CARRIER_NOT_ACTIVE, http: 409, condition: "carrier lifecycle status != ACTIVE where child writes or credential activation require it" }
  - { id: ERR_CARRIER_INELIGIBLE_FOR_APPROVAL, http: 422, condition: "approve-enrollment requires posture ELIGIBLE or CONDITIONAL (NOT_EVALUATED or INELIGIBLE rejected)" }
  - { id: ERR_CARRIER_STILL_INELIGIBLE, http: 422, condition: "reinstate of SUSPENDED carrier whose posture is INELIGIBLE" }
  - { id: ERR_CARRIER_NOT_BYPASS_ELIGIBLE, http: 422, condition: "credential (re)activation while carrier posture is INELIGIBLE or NOT_EVALUATED" }
  - { id: ERR_VEHICLE_NOT_IN_SERVICE, http: 409, condition: "credential (re)activation while vehicle is OUT_OF_SERVICE or RETIRED" }
  - { id: ERR_NO_SAFETY_SNAPSHOT, http: 422, condition: "override request/approve while carrier has no SafetyScoreSnapshot" }
  - { id: ERR_OVERRIDE_WINDOW_OVERLAP, http: 409, condition: "half-open [start_date, end_date) overlap with an existing REQUESTED/APPROVED/ACTIVE override of the same carrier (adjacency allowed)" }
  - { id: ERR_SUBSCRIPTION_WINDOW_OVERLAP, http: 409, condition: "closed-interval [start, end] overlap with an existing non-CLOSED subscription of the same vehicle (adjacency conflicts)" }
  - { id: ERR_EVENT_NOT_DISPUTABLE, http: 422, condition: "dispute opened on a BYPASS_GRANTED event (only PULL_IN decisions are disputable)" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "dispute opened more than 30 days after the event's approach_at" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "an OPENED/UPHELD/APPEALED dispute already exists for this bypass event" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "appeal adjudication attempted by the same officer recorded as first_reviewer_id" }
  - { id: ERR_DUPLICATE_DOT_NUMBER, http: 409, condition: "dot_number already registered" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "vin already registered" }
  - { id: ERR_DUPLICATE_DEVICE_SERIAL, http: 409, condition: "device_serial already provisioned" }
  - { id: ERR_DUPLICATE_STATE_CONFIG, http: 409, condition: "state_code already has a StateProgramConfig" }
  - { id: ERR_DUPLICATE_STATION_CODE, http: 409, condition: "station_code already registered" }
  - { id: ERR_DUPLICATE_BYPASS_EVENT, http: 409, condition: "(vehicle_id, station_id, approach_at) triple already recorded (feed idempotency)" }
  - { id: ERR_CREDENTIAL_TYPE_ALREADY_ACTIVE, http: 409, condition: "vehicle already has a non-DEACTIVATED credential of this device_type" }
  - { id: ERR_NO_ACTIVE_SUBSCRIPTION, http: 402, condition: "credential (re)activation without a covering subscription (status ACTIVE, window covers today)" }
  - { id: ERR_CARRIER_PAST_DUE, http: 402, condition: "carrier has a PAST_DUE invoice; new subscriptions and credential (re)activations blocked (also when the covering subscription's payment_standing is PAST_DUE)" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 400, condition: "record-payment amount_cents != invoice amount_due_cents (no partial/overpayment)" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "record-payment on an already-PAID invoice" }
  - { id: ERR_BILLING_PERIOD_ALREADY_CLOSED, http: 409, condition: "close-billing-period for a period already in carrier.closed_billing_periods" }
  - { id: ERR_BILLING_PERIOD_NOT_CLOSABLE, http: 422, condition: "close-billing-period for a period whose last day >= today (period not fully elapsed)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: carrier onboarding/termination, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/carriers — onboard carrier"
      - "POST /api/carriers/{id}/transition {to_status: TERMINATED} — terminate carrier"
      - "POST /api/_clock/set_current_utc — advance logical clock (materialization sweep)"
    shared_operations: ["all GET endpoints"]
  - name: StateProgramManager
    description: "State program office: per-state rules configs and station registry"
    identity: opaque
    exclusive_operations:
      - "POST /api/state-program-configs, PATCH /api/state-program-configs/{id} — rules engine management (OCC)"
      - "POST /api/stations, PATCH /api/stations/{id} — station registry"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Safety/compliance reviewer: enrollment approval, suspension/reinstatement, dispute adjudication, override decisions"
    identity: opaque
    exclusive_operations:
      - "POST /api/carriers/{id}/transition {to_status: ACTIVE | SUSPENDED} — approve/reinstate/suspend"
      - "POST /api/bypass-disputes/{id}/adjudicate — first review and appeal review (appeal requires different officer: SoD)"
      - "POST /api/eligibility-overrides/{id}/decide — approve/reject/revoke waivers"
    shared_operations: ["all GET endpoints"]
  - name: CarrierManager
    description: "Carrier-side fleet manager; acts only on its own carrier's resources (X-User-ID == Carrier.id)"
    identity: entity_backed:Carrier
    exclusive_operations:
      - "POST /api/vehicles, PATCH /api/vehicles/{id} — fleet management"
      - "POST /api/bypass-credentials, POST /api/bypass-credentials/{id}/transition — credential provisioning/lifecycle"
      - "POST /api/vehicle-subscriptions, POST /api/vehicle-subscriptions/{id}/cancel — per-vehicle billing"
      - "POST /api/bypass-disputes, POST /api/bypass-disputes/{id}/appeal — dispute intake"
      - "POST /api/eligibility-overrides — waiver requests"
    shared_operations: ["all GET endpoints"]
  - name: SafetyDataFeed
    description: "Machine account: FMCSA-style safety score feed and inspection feed"
    identity: opaque
    exclusive_operations:
      - "POST /api/safety-score-snapshots — safety score ingestion (OCC)"
      - "POST /api/inspection-reports — inspection feed ingestion"
    shared_operations: ["all GET endpoints"]
  - name: TelematicsGateway
    description: "Machine account: roadside/transponder approach event ingestion"
    identity: opaque
    exclusive_operations:
      - "POST /api/bypass-events — approach decision events (immutable audit trail)"
    shared_operations: ["all GET endpoints"]
  - name: FinanceAdmin
    description: "Billing operator: period close, payment recording"
    identity: opaque
    exclusive_operations:
      - "POST /api/carriers/{id}/close-billing-period — invoice generation"
      - "POST /api/invoices/{id}/record-payment — payment recording"
    shared_operations: ["all GET endpoints"]
