# =============================================================================
# SCAFFOLD.yaml — Public Land Grazing Permit Administration
# §1.0 Response Envelope, §1.1 Entities, §1.2 State Machines, §1.2.1 Concurrency,
# §1.3 Calculations, §1.4 Validations, §1.5 Endpoints, §1.6 Errors, §1.7 RBAC
# =============================================================================

scenario: "2970. Public Land Grazing Permit Administration (federal rangeland grazing program): allotment inventory with permitted animal unit months, season of use and pasture rotation requirements, permit issuance, renewal and transfer with base property and preference qualification requirements, annual operating instructions with actual use reporting and billing at the grazing fee rate, rangeland health assessment and monitoring against standards with adjustment of stocking levels, drought and wildfire response including temporary non-use, closure and emergency reductions, range improvement projects with cost sharing and maintenance responsibility, trespass detection, unauthorized use billing and penalties, environmental review and permit decision appeals"

domain_name: public-land-grazing-permit-administration
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  difficulty_level: expert_plus
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential          # GrazingPermit.predecessor_permit_id -> GrazingPermit.id
    - cross_aggregate           # GrazingBill spans AOI / TrespassIncident / RangeImprovementProject
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Finite AUM (animal unit month) capacity on each Allotment is the contested pool:
    permits hold preference to a share, AnnualOperatingInstructions commit a year's
    slice of it, temporary non-use releases it, drought/wildfire ClosureOrders shrink
    the pool underneath already-committed AOIs, and rangeland-health findings shrink it
    permanently through appealable PermitDecisions. The compliance layer (environmental
    review, segregation of duties between authoring officer / deciding officer /
    appeals adjudicator, appeal stays that freeze decisions) constrains every
    capacity-reducing action. Non-linear shapes: GrazingPermit carries two independent
    state dimensions (permit_status x account_status); AppealCase cycles through
    REMANDED -> UNDER_REVIEW; RangelandHealthAssessment forks CONCUR/REMAND out of
    FIELD_REVIEW; TrespassIncident cycles BILLED -> DETECTED when its bill is voided.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: Allotment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: allotment name as carried on the grazing authorization
        constraints: 1..120 chars, non-blank
      - name: admin_unit_code
        type: string
        source: input
        description: administering field-office code
        constraints: "^[A-Z]{2}-[0-9]{3}$"
      - name: acres
        type: integer
        source: input
        description: public-land acres inside the allotment boundary
        constraints: ">= 1"
      - name: total_permitted_aums
        type: integer
        source: input
        description: permitted animal unit months carried in the allotment inventory before any adjustment
        constraints: ">= 1"
      - name: season_start
        type: string
        source: input
        description: season-of-use opening day, MM-DD (no year)
        constraints: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: season_end
        type: string
        source: input
        description: season-of-use closing day, MM-DD (no year); must be strictly after season_start within the same calendar year
        constraints: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: required_pasture_rotation_count
        type: integer
        source: input
        description: minimum number of DISTINCT pastures an AnnualOperatingInstruction must schedule before it may be issued
        default: 2
        constraints: ">= 1"
      - name: stocking_adjustment_pct
        type: number
        source: computed
        description: cumulative downward stocking adjustment fraction currently in force (0 = none, 1 = full closure); 4 decimal places
        default: 0
        constraints: "0 <= value <= 1.0"
      - name: effective_capacity_aums
        type: integer
        source: computed
        description: "floor(total_permitted_aums * (1 - stocking_adjustment_pct)); see calculations.aum_allocation_ledger"
      - name: allocated_aums
        type: integer
        source: computed
        description: AUMs committed by AnnualOperatingInstructions for current_grazing_year; see calculations.aum_allocation_ledger
        default: 0
      - name: open_aums
        type: integer
        source: computed
        description: effective_capacity_aums - allocated_aums; the uncommitted remainder of the pool
      - name: allotment_status
        type: enum
        source: computed
        description: gating posture for authorization operations on this allotment
        default: OPEN
        constraints: "OPEN | RESTRICTED | CLOSED"
      - name: health_determination
        type: enum
        source: computed
        description: latest FINALIZED rangeland health determination
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | MEETING | MEETING_WITH_PROBLEMS | NOT_MEETING"
      - name: current_grazing_year
        type: integer
        source: computed
        description: calendar year of the logical clock (UTC); the window over which allocated_aums is summed

  - name: Pasture
    parent: Allotment
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; owning allotment, supplied by the path
      - name: name
        type: string
        source: input
        description: pasture name, unique within the allotment
        constraints: 1..80 chars
      - name: pasture_aum_capacity
        type: integer
        source: input
        description: maximum concurrent scheduled AUMs the pasture may carry at any instant
        constraints: ">= 1"
      - name: sequence_order
        type: integer
        source: input
        description: position of this pasture in the required rotation sequence
        constraints: ">= 1, unique within the allotment"
      - name: rest_required
        type: boolean
        source: input
        description: when true the pasture must be rested and may not be scheduled in an AOI
        default: false
      - name: scheduled_aums
        type: number
        source: computed
        description: sum of planned_aums over PastureUseRecords on this pasture whose AOI has grazing_year == Allotment.current_grazing_year and aoi_status IN {ISSUED, USE_REPORTED, BILLED, CLOSED}; 2 decimal places
        default: 0

  - name: Permittee
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: ranch or operator name
        constraints: 1..120 chars
      - name: contact_email
        type: string
        source: input
        description: billing contact address
        constraints: must contain '@'
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: see calculations.permittee_outstanding_balance; may be negative when credits exceed charges
        default: 0
      - name: billed_trespass_incident_count
        type: integer
        source: computed
        description: count of TrespassIncidents attributed to this permittee whose incident_status IN {BILLED, RESOLVED}
        default: 0
      - name: permittee_status
        type: enum
        source: computed
        description: "derived standing per calculations.permittee_outstanding_balance; DEBT_FLAGGED exactly when outstanding_balance_cents > 0 AND at least one contributing bill is in bill_status DELINQUENT, so an unpaid but not-yet-overdue bill leaves the permittee IN_GOOD_STANDING"
        default: IN_GOOD_STANDING
        constraints: "IN_GOOD_STANDING | DEBT_FLAGGED"

  - name: BaseProperty
    parent: Permittee
    common_fields: true
    fields:
      - name: permittee_id
        type: string
        source: input
        description: FK -> Permittee.id; controlling operator, supplied by the path
      - name: base_property_type
        type: enum
        source: input
        description: kind of base property offered for commensurability
        constraints: "LAND | LIVESTOCK"
      - name: legal_description
        type: string
        source: input
        description: township-range-section description of the base property
        constraints: 1..200 chars
      - name: carrying_capacity_aums
        type: integer
        source: input
        description: forage-production capacity of the base property in AUMs
        constraints: ">= 0"
      - name: controlled_since_date
        type: string
        source: input
        description: date (YYYY-MM-DD) the operator took control of the base property
        constraints: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      - name: qualified_aums
        type: integer
        source: computed
        description: see calculations.base_property_qualification; the AUM ceiling this base property can support on a permit

  - name: GrazingPermit
    parent: null
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; allotment the preference attaches to
      - name: permittee_id
        type: string
        source: input
        description: FK -> Permittee.id; holder of the permit
      - name: base_property_id
        type: string
        source: input
        description: FK -> BaseProperty.id; base property qualifying the preference; must belong to permittee_id
      - name: predecessor_permit_id
        type: string
        source: system
        description: FK -> GrazingPermit.id; self-reference set on permits created by renewal or transfer; null on an original permit
        default: null
      - name: permitted_aums
        type: integer
        source: input
        description: AUMs of preference carried by this permit (request body field name is requested_aums)
        constraints: ">= 1"
      - name: term_start_date
        type: string
        source: input
        description: first day of the permit term, YYYY-MM-DD
      - name: term_end_date
        type: string
        source: input
        description: last day of the permit term, YYYY-MM-DD; must be strictly after term_start_date
      - name: livestock_kind
        type: enum
        source: input
        description: kind of livestock authorized
        constraints: "CATTLE | SHEEP | HORSES"
      - name: permit_status
        type: enum
        source: system
        description: authorization dimension of the permit; evolves independently of account_status
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | ISSUED | SUSPENDED | CANCELLED | EXPIRED | TRANSFERRED"
      - name: account_status
        type: enum
        source: system
        description: billing dimension of the permit; evolves independently of permit_status
        default: CURRENT
        constraints: "CURRENT | DELINQUENT"
      - name: suspension_reason
        type: enum
        source: computed
        description: why permit_status is SUSPENDED; null whenever permit_status != SUSPENDED
        default: null
        constraints: "NONPAYMENT | DECISION | null"
      - name: consecutive_nonuse_years
        type: integer
        source: computed
        description: see calculations.consecutive_nonuse_years
        default: 0
      - name: preference_priority
        type: integer
        source: computed
        description: 1 when the qualifying BaseProperty.base_property_type == LAND, 2 when LIVESTOCK; lower number wins qualification comparisons. Never client-supplied and NOT computed at application time — it is stamped on the PENDING_REVIEW -> ISSUED transition, so it reads its default 2 for the whole PENDING_REVIEW period even on a LAND-backed permit
        default: 2

  - name: AnnualOperatingInstruction
    parent: GrazingPermit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> GrazingPermit.id; permit this year's instructions belong to
      - name: grazing_year
        type: integer
        source: input
        description: calendar year the instructions govern; unique per (permit_id, grazing_year) among non-VOIDED AOIs
        constraints: "2020 <= value <= 2060"
      - name: authorized_aums
        type: integer
        source: input
        description: AUMs authorized for this grazing year; mutated downward by emergency reductions and stocking adjustments
        constraints: ">= 1"
      - name: authorized_aums_at_issue
        type: integer
        source: system
        description: snapshot of authorized_aums taken when the AOI was issued; every emergency reduction and stocking adjustment recomputes authorized_aums from this snapshot, so reductions never compound and a vacated decision restores the original value exactly
        default: null
      - name: nonuse_aums
        type: integer
        source: system
        description: AUMs placed in temporary non-use for this grazing year
        default: 0
      - name: nonuse_reason
        type: enum
        source: system
        description: basis for the temporary non-use; null when nonuse_aums == 0
        default: null
        constraints: "DROUGHT | WILDFIRE | RESOURCE_CONSERVATION | PERSONAL_CONVENIENCE | null"
      - name: season_start_date
        type: string
        source: input
        description: first authorized turnout date for the year, YYYY-MM-DD
      - name: season_end_date
        type: string
        source: input
        description: last authorized off-date for the year, YYYY-MM-DD
      - name: planned_aums_total
        type: number
        source: computed
        description: sum of PastureUseRecord.planned_aums for this AOI; 2 decimal places
        default: 0
      - name: actual_aums_total
        type: number
        source: computed
        description: see calculations.actual_use_aggregation; 2 decimal places
        default: 0
      - name: billable_aums
        type: integer
        source: computed
        description: authorized_aums - nonuse_aums; the AUMs the preliminary bill charges for
      - name: distinct_pasture_count
        type: integer
        source: computed
        description: count of DISTINCT pasture_id values among this AOI's PastureUseRecords
        default: 0
      - name: aoi_status
        type: enum
        source: system
        description: lifecycle of the year's operating instructions
        default: DRAFT
        constraints: "DRAFT | ISSUED | USE_REPORTED | BILLED | CLOSED | VOIDED"

  - name: PastureUseRecord
    parent: AnnualOperatingInstruction
    common_fields: true
    fields:
      - name: aoi_id
        type: string
        source: input
        description: FK -> AnnualOperatingInstruction.id; owning annual operating instruction, supplied by the path
      - name: pasture_id
        type: string
        source: input
        description: FK -> Pasture.id; pasture scheduled for this rotation leg; must belong to the AOI permit's allotment
      - name: planned_entry_date
        type: string
        source: input
        description: scheduled turnout date, YYYY-MM-DD; interval is half-open [planned_entry_date, planned_exit_date)
      - name: planned_exit_date
        type: string
        source: input
        description: scheduled off-date, YYYY-MM-DD; exclusive end of the half-open interval, strictly after planned_entry_date
      - name: planned_head_count
        type: integer
        source: input
        description: head of livestock scheduled on this leg
        constraints: ">= 1"
      - name: livestock_kind
        type: enum
        source: input
        description: kind of livestock on this leg; must equal the permit's livestock_kind
        constraints: "CATTLE | SHEEP | HORSES"
      - name: planned_aums
        type: number
        source: computed
        description: see calculations.use_record_aums with the planned inputs; 2 decimal places
      - name: actual_entry_date
        type: string
        source: system
        description: reported turnout date, YYYY-MM-DD; null until actual use is reported
        default: null
      - name: actual_exit_date
        type: string
        source: system
        description: reported off-date, YYYY-MM-DD; null until actual use is reported
        default: null
      - name: actual_head_count
        type: integer
        source: system
        description: reported head of livestock; null until actual use is reported
        default: null
      - name: actual_aums
        type: number
        source: computed
        description: see calculations.use_record_aums with the reported inputs; 2 decimal places; null until actual use is reported
        default: null
      - name: record_status
        type: enum
        source: system
        description: reporting lifecycle of this rotation leg
        default: SCHEDULED
        constraints: "SCHEDULED | ACTUAL_REPORTED | ACCEPTED"

  - name: GrazingBill
    parent: null
    common_fields: true
    fields:
      - name: permittee_id
        type: string
        source: system
        description: FK -> Permittee.id; party charged by this bill
      - name: aoi_id
        type: string
        source: system
        description: FK -> AnnualOperatingInstruction.id; null on bills that do not arise from a grazing year (unauthorized use, project cost share)
        default: null
      - name: trespass_incident_id
        type: string
        source: system
        description: FK -> TrespassIncident.id; set only on bill_type UNAUTHORIZED_USE
        default: null
      - name: project_id
        type: string
        source: system
        description: FK -> RangeImprovementProject.id; set only on bill_type PROJECT_COST_SHARE
        default: null
      - name: superseded_bill_id
        type: string
        source: system
        description: FK -> GrazingBill.id; self-reference to the bill this one replaces (set when a recomputation voids an unpaid bill)
        default: null
      - name: bill_type
        type: enum
        source: system
        description: basis of the charge
        constraints: "PRELIMINARY_USE | FINAL_USE | REVISED_USE | UNAUTHORIZED_USE | PROJECT_COST_SHARE | ADJUSTMENT_DEBIT | ADJUSTMENT_CREDIT"
      - name: billed_aums
        type: number
        source: computed
        description: AUMs the charge is computed over; 2 decimal places; 0 on PROJECT_COST_SHARE bills
      - name: fee_rate_cents_per_aum
        type: integer
        source: computed
        description: rate applied — GRAZING_FEE_RATE_CENTS_PER_AUM on use bills, FORAGE_VALUE_CENTS_PER_AUM on UNAUTHORIZED_USE bills, 0 on PROJECT_COST_SHARE bills
      - name: base_amount_cents
        type: integer
        source: computed
        description: forage charge before administrative fee and penalty
      - name: admin_fee_cents
        type: integer
        source: computed
        description: tiered administrative fee; see calculations.use_bill_amount
        default: 0
      - name: penalty_amount_cents
        type: integer
        source: computed
        description: unauthorized-use penalty; see calculations.unauthorized_use_charge
        default: 0
      - name: total_amount_cents
        type: integer
        source: computed
        description: base_amount_cents + admin_fee_cents + penalty_amount_cents; negative only on ADJUSTMENT_CREDIT bills
      - name: amount_paid_cents
        type: integer
        source: system
        description: cumulative payments recorded against this bill
        default: 0
      - name: due_date
        type: string
        source: computed
        description: logical-clock date at issuance plus PAYMENT_TERM_DAYS, YYYY-MM-DD
      - name: bill_status
        type: enum
        source: system
        description: collection lifecycle of the bill
        default: ISSUED
        constraints: "ISSUED | DELINQUENT | PAID | VOIDED"

  - name: RangelandHealthAssessment
    parent: null
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; allotment assessed
      - name: assessment_year
        type: integer
        source: input
        description: calendar year the monitoring data was collected; unique per (allotment_id, assessment_year) among non-remanded assessments
        constraints: "2020 <= value <= 2060"
      - name: monitoring_method
        type: enum
        source: input
        description: monitoring protocol; selects which stocking-adjustment variant applies
        constraints: "INDICATOR_ASSESSMENT | UTILIZATION_MAPPING"
      - name: upland_score
        type: integer
        source: input
        description: upland-standard indicator score
        constraints: "0 <= value <= 100"
      - name: riparian_score
        type: integer
        source: input
        description: riparian-standard indicator score
        constraints: "0 <= value <= 100"
      - name: water_quality_score
        type: integer
        source: input
        description: water-quality-standard indicator score
        constraints: "0 <= value <= 100"
      - name: observed_utilization_pct
        type: integer
        source: input
        description: measured forage utilization percentage; required when monitoring_method == UTILIZATION_MAPPING, otherwise null
        default: null
        constraints: "1 <= value <= 100"
      - name: standards_not_met
        type: array
        source: input
        description: rangeland-health standard codes found not met
        constraints: "subset of [UPLAND_HEALTH, RIPARIAN_FUNCTION, WATER_QUALITY, HABITAT], no duplicates"
      - name: causal_factor_is_livestock
        type: boolean
        source: input
        description: whether current livestock grazing is a significant causal factor for the unmet standards
      - name: composite_score
        type: number
        source: computed
        description: see calculations.rangeland_health_determination; 2 decimal places
      - name: determination
        type: enum
        source: computed
        description: health determination derived from composite_score
        default: null
        constraints: "MEETING | MEETING_WITH_PROBLEMS | NOT_MEETING | null"
      - name: recommended_reduction_pct
        type: number
        source: computed
        description: see calculations.stocking_adjustment_recommendation; 4 decimal places; 0 when determination != NOT_MEETING
        default: 0
      - name: assessment_status
        type: enum
        source: system
        description: review lifecycle; FIELD_REVIEW forks to FINALIZED (concur) or back to DRAFT (remand)
        default: DRAFT
        constraints: "DRAFT | FIELD_REVIEW | FINALIZED"
      - name: remand_count
        type: integer
        source: computed
        description: number of times this assessment has been remanded from FIELD_REVIEW back to DRAFT
        default: 0
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the RangeSpecialist who created the assessment

  - name: PermitDecision
    parent: null
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; allotment whose version this decision is written against
      - name: permit_id
        type: string
        source: input
        description: FK -> GrazingPermit.id; permit the decision acts on; null for allotment-wide STOCKING_ADJUSTMENT decisions
        default: null
      - name: assessment_id
        type: string
        source: input
        description: FK -> RangelandHealthAssessment.id; required for STOCKING_ADJUSTMENT decisions, otherwise null
        default: null
      - name: decision_type
        type: enum
        source: input
        description: nature of the proposed action
        constraints: "ISSUANCE | STOCKING_ADJUSTMENT | SUSPENSION | CANCELLATION"
      - name: nepa_level
        type: enum
        source: input
        description: level of environmental review required before the decision may be proposed
        constraints: "CX | EA | EIS"
      - name: nepa_status
        type: enum
        source: system
        description: environmental review completion state
        default: PENDING
        constraints: "PENDING | COMPLETE"
      - name: nepa_findings_summary
        type: string
        source: system
        description: findings recorded when environmental review is completed; null while nepa_status == PENDING
        default: null
      - name: adjustment_pct
        type: number
        source: input
        description: stocking reduction fraction the decision imposes; required for STOCKING_ADJUSTMENT, must be null otherwise; 4 decimal places
        default: null
        constraints: "0 < value <= 0.9"
      - name: pre_decision_adjustment_pct
        type: number
        source: system
        description: snapshot of Allotment.stocking_adjustment_pct taken when the decision became EFFECTIVE; restored verbatim if the decision is VACATED
        default: null
      - name: decision_status
        type: enum
        source: system
        description: decision lifecycle; FINAL returns to PROPOSED on appeal remand, EFFECTIVE goes to VACATED on appeal reversal
        default: DRAFT
        constraints: "DRAFT | PROPOSED | FINAL | EFFECTIVE | STAYED | VACATED"
      - name: authoring_officer_id
        type: string
        source: system
        description: X-User-ID of the RangeSpecialist who authored the decision
      - name: deciding_officer_id
        type: string
        source: system
        description: X-User-ID of the AuthorizedOfficer who signed the decision; null until FINAL
        default: null
      - name: rationale
        type: string
        source: system
        description: signing rationale recorded at finalization
        default: null
      - name: effective_date
        type: string
        source: system
        description: logical-clock date on which the decision became EFFECTIVE, YYYY-MM-DD; null otherwise
        default: null

  - name: AppealCase
    parent: PermitDecision
    common_fields: true
    fields:
      - name: decision_id
        type: string
        source: input
        description: FK -> PermitDecision.id; decision under appeal, supplied by the path
      - name: appellant_permittee_id
        type: string
        source: input
        description: "FK -> Permittee.id; the filing Permittee. Client-supplied but validated against the acting identity: it MUST equal the acting X-User-ID (§1.7 Permittee exclusive_operations), and a mismatch is ERR_UNAUTHORIZED (§1.4 priority 3), so the server never infers it silently"
      - name: stay_requested
        type: boolean
        source: input
        description: whether the appellant petitions for a stay of the decision pending appeal
      - name: stay_granted
        type: boolean
        source: system
        description: whether the adjudicator granted the petition at docketing
        default: false
      - name: statement_of_reasons
        type: string
        source: input
        description: appellant's statement of reasons
        constraints: 10..1000 chars
      - name: appeal_status
        type: enum
        source: system
        description: appeal lifecycle; REMANDED returns to UNDER_REVIEW when the deciding officer re-finalizes the decision
        default: FILED
        constraints: "FILED | UNDER_REVIEW | REMANDED | AFFIRMED | REVERSED | DISMISSED"
      - name: remand_count
        type: integer
        source: computed
        description: number of REMANDED cycles completed; a decide call with outcome REMAND is rejected once this reaches MAX_APPEAL_REMANDS
        default: 0
      - name: adjudicator_id
        type: string
        source: system
        description: X-User-ID of the AppealsAdjudicator who docketed the case; null until UNDER_REVIEW
        default: null

  - name: ClosureOrder
    parent: Allotment
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; allotment the order restricts
      - name: order_type
        type: enum
        source: input
        description: emergency action taken
        constraints: "DROUGHT_REDUCTION | WILDFIRE_CLOSURE | FULL_CLOSURE"
      - name: reduction_pct
        type: number
        source: input
        description: stocking reduction fraction the order imposes; required and 0.0 < value <= 0.9 for DROUGHT_REDUCTION; must be omitted (or sent as exactly 1.0) for WILDFIRE_CLOSURE and FULL_CLOSURE, which the server records as 1.0
        default: null
        constraints: "0 < value < 1"
      - name: effective_start_date
        type: string
        source: input
        description: first day the order is in force, YYYY-MM-DD; interval is CLOSED [effective_start_date, effective_end_date]
      - name: effective_end_date
        type: string
        source: input
        description: last day the order is in force, YYYY-MM-DD; inclusive end, must be >= effective_start_date
      - name: justification
        type: string
        source: input
        description: drought-indicator or fire-perimeter justification
        constraints: 10..500 chars
      - name: order_status
        type: enum
        source: system
        description: order lifecycle
        default: ACTIVE
        constraints: "ACTIVE | LIFTED | EXPIRED"
      - name: issuing_officer_id
        type: string
        source: system
        description: X-User-ID of the AuthorizedOfficer who issued the order

  - name: TrespassIncident
    parent: null
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; allotment where the unauthorized use occurred
      - name: permittee_id
        type: string
        source: input
        description: FK -> Permittee.id; party the unauthorized use is attributed to; null when ownership is undetermined
        default: null
      - name: detected_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant with three fractional digits when the unauthorized use was observed
      - name: head_count
        type: integer
        source: input
        description: head of livestock counted in unauthorized use
        constraints: ">= 1"
      - name: livestock_kind
        type: enum
        source: input
        description: kind of livestock counted
        constraints: "CATTLE | SHEEP | HORSES"
      - name: unauthorized_days
        type: integer
        source: input
        description: days of unauthorized use
        constraints: ">= 1"
      - name: willfulness
        type: enum
        source: input
        description: culpability finding driving the penalty multiplier
        constraints: "NON_WILLFUL | WILLFUL | REPEATED_WILLFUL"
      - name: unauthorized_aums
        type: number
        source: computed
        description: see calculations.unauthorized_use_charge; 2 decimal places
      - name: billed_aums
        type: integer
        source: computed
        description: ceil(unauthorized_aums); the AUM count the unauthorized-use bill charges
        default: 0
      - name: prior_billed_incident_count
        type: integer
        source: computed
        description: count of other TrespassIncidents with the same permittee_id, incident_status IN {BILLED, RESOLVED}, and detected_at strictly earlier than this incident's detected_at
        default: 0
      - name: incident_status
        type: enum
        source: system
        description: enforcement lifecycle; returns to DETECTED when the unauthorized-use bill is voided
        default: DETECTED
        constraints: "DETECTED | BILLED | RESOLVED"

  - name: RangeImprovementProject
    parent: Allotment
    common_fields: true
    fields:
      - name: allotment_id
        type: string
        source: input
        description: FK -> Allotment.id; allotment the improvement is built on
      - name: project_type
        type: enum
        source: input
        description: kind of range improvement
        constraints: "FENCE | WATER_DEVELOPMENT | SEEDING"
      - name: total_cost_cents
        type: integer
        source: input
        description: total project cost in cents
        constraints: ">= 1"
      - name: agency_share_pct
        type: number
        source: input
        description: agency contribution fraction; 4 decimal places; agency_share_pct + permittee_share_pct must equal exactly 1.0
        constraints: "0 <= value <= 1"
      - name: permittee_share_pct
        type: number
        source: input
        description: permittee contribution fraction; 4 decimal places
        constraints: "0 <= value <= 1"
      - name: maintenance_responsibility
        type: enum
        source: input
        description: party responsible for maintaining the improvement
        constraints: "AGENCY | PERMITTEE | SHARED"
      - name: permittee_share_cents
        type: integer
        source: computed
        description: round_half_up(total_cost_cents * permittee_share_pct); the pot distributed across eligible permits
      - name: allocated_share_cents
        type: integer
        source: computed
        description: sum of total_amount_cents over this project's PROJECT_COST_SHARE bills with bill_status != VOIDED; must equal permittee_share_cents after allocation
        default: 0
      - name: project_status
        type: enum
        source: system
        description: project lifecycle
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | COST_ALLOCATED | TERMINATED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: Allotment
    state_field: allotment_status
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: side effect of POST /closure-orders with order_type DROUGHT_REDUCTION, or of POST /permit-decisions/{decisionId}/make-effective for decision_type STOCKING_ADJUSTMENT"
        actor: system
        preconditions:
          - "resulting Allotment.stocking_adjustment_pct > 0"
          - "no ClosureOrder on this allotment with order_status == ACTIVE and order_type IN {WILDFIRE_CLOSURE, FULL_CLOSURE}"
        side_effects:
          - "Allotment.stocking_adjustment_pct recomputed per calculations.emergency_reduction_reallocation hop 1 — the MAXIMUM over the reduction_pct of every ACTIVE ClosureOrder and the adjustment_pct of every EFFECTIVE STOCKING_ADJUSTMENT PermitDecision on this allotment, capped at MAX_STOCKING_ADJUSTMENT_PCT (0.9) and rounded to 4dp; sources are NEVER summed"
          - "Allotment.effective_capacity_aums recomputed per calculations.aum_allocation_ledger"
          - "Allotment.version incremented by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: side effect of POST /closure-orders/{closureOrderId}/lift, of ClosureOrder ACTIVE->EXPIRED during POST /_clock/set_current_utc, or of PermitDecision EFFECTIVE->VACATED"
        actor: system
        preconditions:
          - "recomputed Allotment.stocking_adjustment_pct == 0"
          - "no ClosureOrder on this allotment with order_status == ACTIVE"
        side_effects:
          - "Allotment.effective_capacity_aums recomputed (returns to total_permitted_aums)"
          - "Allotment.version incremented by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system: side effect of POST /closure-orders with order_type IN {WILDFIRE_CLOSURE, FULL_CLOSURE}"
        actor: system
        preconditions:
          - "the new ClosureOrder passed calculations/validation for closure-window conflicts"
        side_effects:
          - "Allotment.stocking_adjustment_pct := 1.0"
          - "Allotment.effective_capacity_aums := 0"
          - "Allotment.version incremented by 1"
      - from: RESTRICTED
        to: CLOSED
        trigger: "system: side effect of POST /closure-orders with order_type IN {WILDFIRE_CLOSURE, FULL_CLOSURE}"
        actor: system
        preconditions:
          - "the new ClosureOrder passed the closure-window conflict check"
        side_effects:
          - "Allotment.stocking_adjustment_pct := 1.0"
          - "Allotment.effective_capacity_aums := 0"
          - "Allotment.version incremented by 1"
      # NOTE: when another ACTIVE reduction source remains after the lift, the
      # recomputed posture is RESTRICTED rather than OPEN (see the OPEN -> RESTRICTED
      # row); the destination is always whatever emergency_reduction_reallocation
      # derives from the surviving sources.
      - from: CLOSED
        to: OPEN
        trigger: "POST /closure-orders/{closureOrderId}/lift"
        actor: AuthorizedOfficer
        preconditions:
          - "the lifted order is the only ClosureOrder on this allotment with order_status == ACTIVE"
          - "no EFFECTIVE PermitDecision with decision_type == STOCKING_ADJUSTMENT is in force on this allotment"
        side_effects:
          - "Allotment.stocking_adjustment_pct := 0"
          - "Allotment.effective_capacity_aums := total_permitted_aums"
          - "Allotment.version incremented by 1"
      - from: CLOSED
        to: RESTRICTED
        trigger: "system: side effect of POST /closure-orders/{closureOrderId}/lift lifting the only WILDFIRE_CLOSURE/FULL_CLOSURE order while a weaker source survives, or of that order's ACTIVE->EXPIRED during POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "no ClosureOrder on this allotment with order_status == ACTIVE and order_type IN {WILDFIRE_CLOSURE, FULL_CLOSURE} remains"
          - "recomputed Allotment.stocking_adjustment_pct satisfies 0.0 < pct < 1.0 — i.e. at least one ACTIVE DROUGHT_REDUCTION order or EFFECTIVE STOCKING_ADJUSTMENT decision survives"
        side_effects:
          - "Allotment.stocking_adjustment_pct recomputed per calculations.emergency_reduction_reallocation hop 1 — the MAXIMUM (never the sum) over the surviving sources, capped at 0.9 and rounded to 4dp"
          - "Allotment.effective_capacity_aums recomputed per calculations.emergency_reduction_reallocation hop 2"
          - "Allotment.version incremented by 1"

  - entity: GrazingPermit
    parallel_dimensions: [permit_status, account_status]
    note: |
      Two independent state dimensions on the same row. permit_status is the
      authorization axis and is only ever moved by decisions and permit actions;
      account_status is the billing axis and is only ever moved by billing events.
      A permit may be ISSUED+DELINQUENT, SUSPENDED+CURRENT, or any other pairing.
    initial_state: PENDING_REVIEW
    terminal_states: [CANCELLED, EXPIRED, TRANSFERRED]
    shape: parallel
    transitions:
      - dimension: permit_status
        from: PENDING_REVIEW
        to: ISSUED
        trigger: "POST /grazing-permits/{permitId}/issue"
        actor: AuthorizedOfficer
        preconditions:
          - "Allotment.allotment_status IN {OPEN, RESTRICTED} (validations priority 9, ERR_ALLOTMENT_CLOSED)"
          - "Allotment.health_determination != NOT_MEETING unless an EFFECTIVE STOCKING_ADJUSTMENT decision is in force (validations priority 10, ERR_HEALTH_STANDARDS_NOT_MET)"
          - "GrazingPermit.permitted_aums <= BaseProperty.qualified_aums of base_property_id (validations priority 16, ERR_INSUFFICIENT_QUALIFIED_AUMS)"
          - "GrazingPermit.permitted_aums <= Allotment.open_aums (validations priority 30, ERR_ALLOTMENT_CAPACITY_EXCEEDED)"
          - "Permittee.outstanding_balance_cents == 0 (validations priority 28, ERR_OUTSTANDING_BALANCE)"
          - "NOTE: no PermitDecision of decision_type ISSUANCE is required to reach ISSUED. An ISSUANCE decision is the formal, appealable record of the authorization and carries no cascade of its own (see the PermitDecision FINAL -> EFFECTIVE row); every gate on this transition is a §1.4 row with its own error_id, so the transition has no un-errored preconditions."
        side_effects:
          - "GrazingPermit.permit_status := ISSUED"
          - "GrazingPermit.preference_priority recomputed from the qualifying BaseProperty.base_property_type"
      - dimension: permit_status
        from: ISSUED
        to: SUSPENDED
        trigger: "system: side effect of POST /permit-decisions/{decisionId}/make-effective for decision_type SUSPENSION"
        actor: system
        preconditions:
          - "PermitDecision.decision_status transitions FINAL -> EFFECTIVE"
        side_effects:
          - "GrazingPermit.permit_status := SUSPENDED"
          - "GrazingPermit.suspension_reason := DECISION"
          - "every AnnualOperatingInstruction of this permit with grazing_year == Allotment.current_grazing_year and aoi_status == DRAFT is voided (aoi_status := VOIDED)"
      - dimension: permit_status
        from: SUSPENDED
        to: ISSUED
        trigger: "system: side effect of POST /grazing-bills/{billId}/payments that clears the last delinquent bill (suspension_reason == NONPAYMENT), or of PermitDecision EFFECTIVE->VACATED (suspension_reason == DECISION)"
        actor: system
        preconditions:
          - "for suspension_reason == NONPAYMENT: no GrazingBill of this permittee has bill_status == DELINQUENT after the payment is recorded"
          - "for suspension_reason == DECISION: the SUSPENSION decision that caused the suspension has decision_status == VACATED"
        side_effects:
          - "GrazingPermit.permit_status := ISSUED"
          - "GrazingPermit.suspension_reason := null"
      - dimension: permit_status
        from: ISSUED
        to: CANCELLED
        trigger: "system: side effect of POST /permit-decisions/{decisionId}/make-effective for decision_type CANCELLATION"
        actor: system
        preconditions:
          - "PermitDecision.decision_status transitions FINAL -> EFFECTIVE"
        side_effects:
          - "GrazingPermit.permit_status := CANCELLED"
          - "every AnnualOperatingInstruction of this permit with aoi_status IN {DRAFT, ISSUED} is voided (aoi_status := VOIDED), releasing its AUMs"
          - "Allotment.allocated_aums and Allotment.open_aums recomputed"
      - dimension: permit_status
        from: SUSPENDED
        to: CANCELLED
        trigger: "system: side effect of POST /permit-decisions/{decisionId}/make-effective for decision_type CANCELLATION"
        actor: system
        preconditions:
          - "PermitDecision.decision_status transitions FINAL -> EFFECTIVE"
        side_effects:
          - "GrazingPermit.permit_status := CANCELLED"
          - "GrazingPermit.suspension_reason := null"
      - dimension: permit_status
        from: ISSUED
        to: EXPIRED
        trigger: "POST /grazing-permits/{permitId}/renew"
        actor: AuthorizedOfficer
        preconditions:
          - "GrazingPermit.permit_status == ISSUED"
          - "Permittee.outstanding_balance_cents <= 0"
          - "BaseProperty.qualified_aums >= GrazingPermit.permitted_aums"
          - "Allotment.allotment_status IN {OPEN, RESTRICTED}"
        side_effects:
          - "predecessor GrazingPermit.permit_status := EXPIRED"
          - "a successor GrazingPermit is created with predecessor_permit_id := predecessor.id, permit_status := ISSUED, account_status := CURRENT, the same permittee_id / allotment_id / base_property_id / permitted_aums / livestock_kind, term_start_date := renewal_term_start_date and term_end_date := renewal_term_end_date"
          - "Allotment.allocated_aums recomputed (unchanged: the successor inherits the predecessor's commitments only for future years)"
      - dimension: permit_status
        from: ISSUED
        to: TRANSFERRED
        trigger: "POST /grazing-permits/{permitId}/transfer"
        actor: AuthorizedOfficer
        preconditions:
          - "GrazingPermit.permit_status == ISSUED"
          - "Allotment.allotment_status IN {OPEN, RESTRICTED}"
          - "transferee BaseProperty belongs to transferee_permittee_id and its qualified_aums >= GrazingPermit.permitted_aums"
          - "Permittee.outstanding_balance_cents <= 0 for the transferring permittee"
        side_effects:
          - "transferring GrazingPermit.permit_status := TRANSFERRED"
          - "a successor GrazingPermit is created for transferee_permittee_id with predecessor_permit_id := transferor.id, permit_status := ISSUED, account_status := CURRENT and the transferor's permitted_aums, livestock_kind, term_start_date and term_end_date"
          - "every AnnualOperatingInstruction of the transferor with aoi_status IN {DRAFT, ISSUED} is voided (aoi_status := VOIDED)"
          - "Allotment.allocated_aums and Allotment.open_aums recomputed"
      - dimension: account_status
        from: CURRENT
        to: DELINQUENT
        trigger: "system: side effect of GrazingBill ISSUED->DELINQUENT during POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "at least one GrazingBill with permittee_id == this permit's permittee_id has bill_status == DELINQUENT"
        side_effects:
          - "GrazingPermit.account_status := DELINQUENT for every permit of that permittee whose permit_status IN {PENDING_REVIEW, ISSUED, SUSPENDED}"
      - dimension: account_status
        from: DELINQUENT
        to: CURRENT
        trigger: "system: side effect of POST /grazing-bills/{billId}/payments, of POST /grazing-bills/{billId}/void, or of any bill supersession that leaves the permittee with no DELINQUENT bill"
        actor: system
        preconditions:
          - "no GrazingBill with permittee_id == this permit's permittee_id has bill_status == DELINQUENT"
        side_effects:
          - "GrazingPermit.account_status := CURRENT for every permit of that permittee whose permit_status IN {PENDING_REVIEW, ISSUED, SUSPENDED}"

  - entity: AnnualOperatingInstruction
    state_field: aoi_status
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    shape: branching
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /annual-operating-instructions/{aoiId}/issue"
        actor: AuthorizedOfficer
        preconditions:
          - "GrazingPermit.permit_status == ISSUED"
          - "Allotment.allotment_status IN {OPEN, RESTRICTED}"
          - "AnnualOperatingInstruction.distinct_pasture_count >= Allotment.required_pasture_rotation_count"
          - "AnnualOperatingInstruction.planned_aums_total <= authorized_aums"
          - "billable_aums <= Allotment.open_aums"
        side_effects:
          - "AnnualOperatingInstruction.aoi_status := ISSUED"
          - "AnnualOperatingInstruction.authorized_aums_at_issue := authorized_aums"
          - "Allotment.allocated_aums and Allotment.open_aums recomputed per calculations.aum_allocation_ledger"
          - "Pasture.scheduled_aums recomputed for every pasture referenced by this AOI's use records"
          - "when billable_aums > 0 a GrazingBill of bill_type PRELIMINARY_USE is issued per calculations.use_bill_amount variant PRELIMINARY, with due_date = logical-clock date + PAYMENT_TERM_DAYS; when billable_aums == 0 NO bill is created"
          - "Permittee.outstanding_balance_cents recomputed per calculations.permittee_outstanding_balance"
      - from: ISSUED
        to: USE_REPORTED
        trigger: "POST /annual-operating-instructions/{aoiId}/accept-use-report (first hop of the atomic accept-and-bill operation)"
        actor: AuthorizedOfficer
        preconditions:
          - "the AOI has at least one PastureUseRecord and NO record is still in record_status SCHEDULED"
        side_effects:
          - "AnnualOperatingInstruction.aoi_status := USE_REPORTED"
          - "AnnualOperatingInstruction.actual_aums_total recomputed per calculations.actual_use_aggregation"
      - from: USE_REPORTED
        to: BILLED
        trigger: "POST /annual-operating-instructions/{aoiId}/accept-use-report"
        actor: AuthorizedOfficer
        preconditions:
          - "AnnualOperatingInstruction.aoi_status == USE_REPORTED"
        side_effects:
          - "every PastureUseRecord of this AOI moves record_status ACTUAL_REPORTED -> ACCEPTED"
          - "final charge computed per calculations.use_bill_amount variant FINAL over actual_aums_total"
          - "when the PRELIMINARY_USE bill has amount_paid_cents == 0 it moves to bill_status VOIDED and a FINAL_USE bill is issued with superseded_bill_id := the voided bill id; when amount_paid_cents > 0 the preliminary bill is left untouched and an ADJUSTMENT_DEBIT (delta > 0) or ADJUSTMENT_CREDIT (delta < 0) bill is issued for the delta, and no bill at all when delta == 0"
          - "AnnualOperatingInstruction.aoi_status := BILLED"
          - "Permittee.outstanding_balance_cents recomputed"
      - from: BILLED
        to: CLOSED
        trigger: "system: side effect of POST /grazing-bills/{billId}/payments that brings every non-VOIDED bill of this AOI to bill_status PAID"
        actor: system
        preconditions:
          - "every GrazingBill with aoi_id == this AOI and bill_status != VOIDED has bill_status == PAID"
        side_effects:
          - "AnnualOperatingInstruction.aoi_status := CLOSED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /annual-operating-instructions/{aoiId}/void"
        actor: AuthorizedOfficer
        preconditions:
          - "aoi_status IN {DRAFT, ISSUED}"
        side_effects:
          - "AnnualOperatingInstruction.aoi_status := VOIDED"
          - "Allotment.allocated_aums and Allotment.open_aums recomputed (a DRAFT AOI held no allocation, so both are unchanged)"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /annual-operating-instructions/{aoiId}/void"
        actor: AuthorizedOfficer
        preconditions:
          - "aoi_status == ISSUED"
          - "no GrazingBill of this AOI has amount_paid_cents > 0"
        side_effects:
          - "AnnualOperatingInstruction.aoi_status := VOIDED"
          - "every GrazingBill with aoi_id == this AOI and bill_status IN {ISSUED, DELINQUENT} moves to bill_status VOIDED"
          - "Allotment.allocated_aums decreases by this AOI's billable_aums and Allotment.open_aums increases by the same amount, restoring calculations.aum_conservation_invariant"
          - "Pasture.scheduled_aums recomputed for every pasture referenced by this AOI's use records"
          - "Permittee.outstanding_balance_cents recomputed"

  - entity: PastureUseRecord
    state_field: record_status
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED]
    shape: linear
    transitions:
      - from: SCHEDULED
        to: ACTUAL_REPORTED
        trigger: "POST /pasture-use-records/{useRecordId}/report-actual-use"
        actor: Permittee
        preconditions:
          - "the acting Permittee's X-User-ID == the AOI permit's permittee_id"
          - "AnnualOperatingInstruction.aoi_status == ISSUED"
          - "actual_exit_date is strictly after actual_entry_date"
          - "actual_entry_date >= AnnualOperatingInstruction.season_start_date and actual_exit_date <= AnnualOperatingInstruction.season_end_date"
        side_effects:
          - "PastureUseRecord.actual_entry_date, actual_exit_date and actual_head_count are stored"
          - "PastureUseRecord.actual_aums computed per calculations.use_record_aums with the reported inputs"
          - "PastureUseRecord.record_status := ACTUAL_REPORTED"
          - "AnnualOperatingInstruction.actual_aums_total recomputed per calculations.actual_use_aggregation"
          - "the AOI's aoi_status is NOT changed by this call; the officer's accept-use-report moves ISSUED -> USE_REPORTED -> BILLED atomically"
      - from: ACTUAL_REPORTED
        to: ACCEPTED
        trigger: "system: side effect of POST /annual-operating-instructions/{aoiId}/accept-use-report"
        actor: system
        preconditions:
          - "AnnualOperatingInstruction.aoi_status == USE_REPORTED"
        side_effects:
          - "PastureUseRecord.record_status := ACCEPTED"

  - entity: GrazingBill
    state_field: bill_status
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    shape: branching
    transitions:
      - from: ISSUED
        to: DELINQUENT
        trigger: "system: evaluated during POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "GrazingBill.due_date < the new logical-clock date (a bill whose due_date equals the clock date is NOT delinquent)"
          - "GrazingBill.total_amount_cents - GrazingBill.amount_paid_cents > 0"
        side_effects:
          - "GrazingBill.bill_status := DELINQUENT"
          - "every GrazingPermit of this bill's permittee with permit_status IN {PENDING_REVIEW, ISSUED, SUSPENDED} moves account_status CURRENT -> DELINQUENT"
      - from: ISSUED
        to: PAID
        trigger: "POST /grazing-bills/{billId}/payments"
        actor: Permittee
        preconditions:
          - "amount_paid_cents + amount_cents >= total_amount_cents"
        side_effects:
          - "GrazingBill.amount_paid_cents increased by amount_cents"
          - "GrazingBill.bill_status := PAID"
          - "Permittee.outstanding_balance_cents recomputed"
          - "when this bill's bill_type == UNAUTHORIZED_USE the linked TrespassIncident moves BILLED -> RESOLVED"
          - "when every non-VOIDED bill of the linked AOI is PAID the AOI moves BILLED -> CLOSED"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /grazing-bills/{billId}/payments"
        actor: Permittee
        preconditions:
          - "amount_paid_cents + amount_cents >= total_amount_cents"
        side_effects:
          - "GrazingBill.amount_paid_cents increased by amount_cents"
          - "GrazingBill.bill_status := PAID"
          - "Permittee.outstanding_balance_cents recomputed"
          - "when the permittee has no remaining DELINQUENT bill, every GrazingPermit of that permittee moves account_status DELINQUENT -> CURRENT; a permit whose permit_status == SUSPENDED with suspension_reason == NONPAYMENT then moves SUSPENDED -> ISSUED"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /grazing-bills/{billId}/void, or system supersession during an emergency reduction, stocking adjustment, use-report acceptance or AOI void"
        actor: AuthorizedOfficer
        preconditions:
          - "GrazingBill.amount_paid_cents == 0"
        side_effects:
          - "GrazingBill.bill_status := VOIDED"
          - "Permittee.outstanding_balance_cents recomputed, restoring calculations.money_conservation_invariant"
          - "when bill_type == UNAUTHORIZED_USE the linked TrespassIncident moves BILLED -> DETECTED"
          - "when the permittee has no remaining DELINQUENT bill, every GrazingPermit of that permittee moves account_status DELINQUENT -> CURRENT"
      - from: DELINQUENT
        to: VOIDED
        trigger: "POST /grazing-bills/{billId}/void, or system supersession during an emergency reduction"
        actor: AuthorizedOfficer
        preconditions:
          - "GrazingBill.amount_paid_cents == 0"
        side_effects:
          - "GrazingBill.bill_status := VOIDED"
          - "Permittee.outstanding_balance_cents recomputed"
          - "when the permittee has no remaining DELINQUENT bill, every GrazingPermit of that permittee moves account_status DELINQUENT -> CURRENT"

  - entity: RangelandHealthAssessment
    state_field: assessment_status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    shape: branching
    note: |
      FIELD_REVIEW forks on the review outcome: CONCUR drives FINALIZED and writes the
      determination onto the Allotment; REMAND drives the row back to DRAFT (a cycle)
      and writes nothing onto the Allotment. The two branches carry disjoint
      side-effect sets, which is what makes the fork observable.
    transitions:
      - from: DRAFT
        to: FIELD_REVIEW
        trigger: "POST /rangeland-health-assessments/{assessmentId}/submit"
        actor: RangeSpecialist
        preconditions:
          - "assessment_status == DRAFT"
          - "the acting RangeSpecialist's X-User-ID == RangelandHealthAssessment.author_user_id"
          - "observed_utilization_pct is non-null when monitoring_method == UTILIZATION_MAPPING"
        side_effects:
          - "RangelandHealthAssessment.assessment_status := FIELD_REVIEW"
          - "RangelandHealthAssessment.composite_score and determination computed per calculations.rangeland_health_determination"
          - "RangelandHealthAssessment.recommended_reduction_pct computed per calculations.stocking_adjustment_recommendation"
      - from: FIELD_REVIEW
        to: FINALIZED
        trigger: "POST /rangeland-health-assessments/{assessmentId}/review with outcome CONCUR"
        actor: AuthorizedOfficer
        preconditions:
          - "assessment_status == FIELD_REVIEW"
          - "the acting AuthorizedOfficer's X-User-ID != RangelandHealthAssessment.author_user_id"
        side_effects:
          - "RangelandHealthAssessment.assessment_status := FINALIZED"
          - "Allotment.health_determination := RangelandHealthAssessment.determination"
          - "Allotment.version incremented by 1"
      - from: FIELD_REVIEW
        to: DRAFT
        trigger: "POST /rangeland-health-assessments/{assessmentId}/review with outcome REMAND"
        actor: AuthorizedOfficer
        preconditions:
          - "assessment_status == FIELD_REVIEW"
          - "the acting AuthorizedOfficer's X-User-ID != RangelandHealthAssessment.author_user_id"
          - "RangelandHealthAssessment.remand_count < MAX_ASSESSMENT_REMANDS"
        side_effects:
          - "RangelandHealthAssessment.assessment_status := DRAFT"
          - "RangelandHealthAssessment.remand_count incremented by 1"
          - "Allotment.health_determination is NOT written (this is the disjoint branch)"

  - entity: PermitDecision
    state_field: decision_status
    initial_state: DRAFT
    terminal_states: [VACATED]
    shape: branching
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /permit-decisions/{decisionId}/complete-environmental-review"
        actor: RangeSpecialist
        preconditions:
          - "decision_status == DRAFT"
          - "nepa_status == PENDING"
        side_effects:
          - "PermitDecision.nepa_status := COMPLETE"
          - "PermitDecision.nepa_findings_summary stored"
          - "PermitDecision.decision_status := PROPOSED"
      - from: DRAFT
        to: VACATED
        trigger: "system: side effect of POST /permit-decisions creating a newer decision of the same decision_type on the same allotment (supersession)"
        actor: system
        preconditions:
          - "decision_status IN {DRAFT, PROPOSED}"
        side_effects:
          - "PermitDecision.decision_status := VACATED"
          - "NO capacity cascade runs and NO bill is superseded: a DRAFT or PROPOSED decision never applied one, so pre_decision_adjustment_pct is simply discarded"
      - from: PROPOSED
        to: VACATED
        trigger: "system: side effect of POST /permit-decisions creating a newer decision of the same decision_type on the same allotment (supersession)"
        actor: system
        preconditions:
          - "decision_status IN {DRAFT, PROPOSED}"
        side_effects:
          - "PermitDecision.decision_status := VACATED"
          - "NO capacity cascade runs and NO bill is superseded"
      - from: PROPOSED
        to: FINAL
        trigger: "POST /permit-decisions/{decisionId}/finalize"
        actor: AuthorizedOfficer
        preconditions:
          - "decision_status == PROPOSED"
          - "nepa_status == COMPLETE"
          - "the acting AuthorizedOfficer's X-User-ID != PermitDecision.authoring_officer_id (segregation of duties)"
        side_effects:
          - "PermitDecision.decision_status := FINAL"
          - "PermitDecision.deciding_officer_id := the acting X-User-ID"
          - "PermitDecision.rationale stored"
          - "when an AppealCase on this decision has appeal_status == REMANDED and remand_count < MAX_APPEAL_REMANDS, that AppealCase moves REMANDED -> UNDER_REVIEW"
      - from: FINAL
        to: EFFECTIVE
        trigger: "POST /permit-decisions/{decisionId}/make-effective"
        actor: AuthorizedOfficer
        preconditions:
          - "decision_status == FINAL"
          - "no AppealCase on this decision has appeal_status IN {FILED, UNDER_REVIEW} with stay_granted == true"
          - "the acting AuthorizedOfficer's X-User-ID == PermitDecision.deciding_officer_id"
        side_effects:
          - "PermitDecision.decision_status := EFFECTIVE"
          - "PermitDecision.effective_date := logical-clock date"
          - "PermitDecision.pre_decision_adjustment_pct := Allotment.stocking_adjustment_pct (snapshot taken BEFORE the adjustment is applied)"
          - "decision_type STOCKING_ADJUSTMENT: Allotment.stocking_adjustment_pct recomputed per calculations.emergency_reduction_reallocation (the strongest ACTIVE source, never a sum); Allotment.effective_capacity_aums recomputed; Allotment.allotment_status OPEN -> RESTRICTED; then every AnnualOperatingInstruction of the allotment with grazing_year == Allotment.current_grazing_year and aoi_status IN {ISSUED, USE_REPORTED} has authorized_aums recomputed per calculations.emergency_reduction_reallocation; then each such AOI's unpaid use bill is superseded per calculations.use_bill_amount; then each affected Permittee.outstanding_balance_cents is recomputed and account_status re-evaluated"
          - "decision_type SUSPENSION: GrazingPermit.permit_status ISSUED -> SUSPENDED with suspension_reason := DECISION"
          - "decision_type CANCELLATION: GrazingPermit.permit_status -> CANCELLED and its DRAFT/ISSUED AOIs are voided"
          - "decision_type ISSUANCE: no cascade at all. The decision is the formal, appealable record of an authorization; it neither gates nor performs POST /grazing-permits/{permitId}/issue, and the only observable change is its own decision_status"
          - "Allotment.version incremented by 1"
      - from: FINAL
        to: STAYED
        trigger: "system: side effect of POST /permit-decisions/{decisionId}/appeals filed with stay_requested == true"
        actor: system
        preconditions:
          - "decision_status == FINAL (an already EFFECTIVE decision cannot be stayed)"
          - "the filed AppealCase has stay_requested == true, so stay_granted := true"
        side_effects:
          - "PermitDecision.decision_status := STAYED"
          - "no allotment, permit, AOI or bill field is written (the stay freezes the decision's effects entirely)"
      - from: FINAL
        to: PROPOSED
        trigger: "system: side effect of POST /appeal-cases/{appealId}/decide with outcome REMAND"
        actor: system
        preconditions:
          - "the AppealCase on this decision moves UNDER_REVIEW -> REMANDED"
        side_effects:
          - "PermitDecision.decision_status := PROPOSED"
          - "PermitDecision.deciding_officer_id := null"
          - "PermitDecision.rationale := null"
      - from: STAYED
        to: EFFECTIVE
        trigger: "system: side effect of POST /appeal-cases/{appealId}/decide with outcome AFFIRM or DISMISS"
        actor: system
        preconditions:
          - "the AppealCase on this decision moves UNDER_REVIEW -> AFFIRMED or UNDER_REVIEW -> DISMISSED"
          - "decision_status == STAYED"
        side_effects:
          - "PermitDecision.decision_status := EFFECTIVE and the full decision_type cascade described on FINAL -> EFFECTIVE runs now"
          - "PermitDecision.effective_date := logical-clock date"
      - from: EFFECTIVE
        to: VACATED
        trigger: "system: side effect of POST /appeal-cases/{appealId}/decide with outcome REVERSE"
        actor: system
        preconditions:
          - "the AppealCase on this decision moves UNDER_REVIEW -> REVERSED"
        side_effects:
          - "PermitDecision.decision_status := VACATED"
          - "decision_type STOCKING_ADJUSTMENT: Allotment.stocking_adjustment_pct := PermitDecision.pre_decision_adjustment_pct and Allotment.effective_capacity_aums recomputed; then (because capacity moved) every AnnualOperatingInstruction of the allotment with grazing_year == Allotment.current_grazing_year and aoi_status IN {ISSUED, USE_REPORTED} has authorized_aums recomputed per calculations.emergency_reduction_reallocation; then (because billable_aums moved) each such AOI's unpaid use bill is superseded by a REVISED_USE bill; then (because bill totals moved) each affected Permittee.outstanding_balance_cents is recomputed and account_status re-evaluated"
          - "decision_type SUSPENSION: GrazingPermit.permit_status SUSPENDED -> ISSUED with suspension_reason := null"
          - "Allotment.allotment_status recomputed (RESTRICTED -> OPEN when stocking_adjustment_pct becomes 0 and no ACTIVE ClosureOrder remains)"
          - "Allotment.version incremented by 1"
      - from: STAYED
        to: VACATED
        trigger: "system: side effect of POST /appeal-cases/{appealId}/decide with outcome REVERSE"
        actor: system
        preconditions:
          - "the AppealCase on this decision moves UNDER_REVIEW -> REVERSED"
          - "decision_status == STAYED"
        side_effects:
          - "PermitDecision.decision_status := VACATED"
          - "no cascade runs (a STAYED decision never applied its effects, so there is nothing to reverse)"

  - entity: AppealCase
    state_field: appeal_status
    initial_state: FILED
    terminal_states: [AFFIRMED, REVERSED, DISMISSED]
    shape: cyclic
    note: |
      REMANDED -> UNDER_REVIEW closes the loop: the adjudicator remands, the deciding
      officer re-finalizes the decision, and the same appeal returns to review with
      remand_count incremented. MAX_APPEAL_REMANDS bounds the loop.
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeal-cases/{appealId}/docket"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal_status == FILED"
        side_effects:
          - "AppealCase.appeal_status := UNDER_REVIEW"
          - "AppealCase.adjudicator_id := the acting X-User-ID"
          - "AppealCase.stay_granted is NOT touched here — the stay was granted or refused at filing time"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /appeal-cases/{appealId}/decide with outcome REMAND"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal_status == UNDER_REVIEW"
          - "AppealCase.remand_count < MAX_APPEAL_REMANDS"
          - "the acting X-User-ID == AppealCase.adjudicator_id"
        side_effects:
          - "AppealCase.appeal_status := REMANDED"
          - "AppealCase.remand_count incremented by 1"
          - "the appealed PermitDecision moves FINAL -> PROPOSED with deciding_officer_id := null"
      - from: REMANDED
        to: UNDER_REVIEW
        trigger: "system: side effect of POST /permit-decisions/{decisionId}/finalize on the remanded decision"
        actor: system
        preconditions:
          - "appeal_status == REMANDED"
          - "the appealed PermitDecision moves PROPOSED -> FINAL"
        side_effects:
          - "AppealCase.appeal_status := UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: AFFIRMED
        trigger: "POST /appeal-cases/{appealId}/decide with outcome AFFIRM"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal_status == UNDER_REVIEW"
          - "the acting X-User-ID == AppealCase.adjudicator_id"
        side_effects:
          - "AppealCase.appeal_status := AFFIRMED"
          - "AppealCase.stay_granted := false"
          - "when the appealed PermitDecision is STAYED it moves STAYED -> EFFECTIVE and its full decision cascade runs"
      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /appeal-cases/{appealId}/decide with outcome REVERSE"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal_status == UNDER_REVIEW"
          - "the acting X-User-ID == AppealCase.adjudicator_id"
        side_effects:
          - "AppealCase.appeal_status := REVERSED"
          - "AppealCase.stay_granted := false"
          - "the appealed PermitDecision moves EFFECTIVE -> VACATED (or STAYED -> VACATED) and, for STOCKING_ADJUSTMENT, the four-hop restoration cascade runs"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /appeal-cases/{appealId}/decide with outcome DISMISS"
        actor: AppealsAdjudicator
        preconditions:
          - "appeal_status == UNDER_REVIEW"
          - "the acting X-User-ID == AppealCase.adjudicator_id"
        side_effects:
          - "AppealCase.appeal_status := DISMISSED"
          - "AppealCase.stay_granted := false"
          - "when the appealed PermitDecision is STAYED it moves STAYED -> EFFECTIVE and its full decision cascade runs"

  - entity: ClosureOrder
    state_field: order_status
    initial_state: ACTIVE
    terminal_states: [LIFTED, EXPIRED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /closure-orders/{closureOrderId}/lift"
        actor: AuthorizedOfficer
        preconditions:
          - "order_status == ACTIVE"
        side_effects:
          - "ClosureOrder.order_status := LIFTED"
          - "Allotment.stocking_adjustment_pct recomputed per calculations.emergency_reduction_reallocation hop 1 — the MAXIMUM (never the sum) over the reduction_pct of every remaining ACTIVE ClosureOrder and the adjustment_pct of every EFFECTIVE STOCKING_ADJUSTMENT decision, capped at 0.9, or exactly 1.0 when any remaining ACTIVE order is WILDFIRE_CLOSURE or FULL_CLOSURE, or 0.0 when no source remains"
          - "Allotment.allotment_status recomputed; Allotment.effective_capacity_aums recomputed"
          - "every AnnualOperatingInstruction of the allotment with grazing_year == Allotment.current_grazing_year and aoi_status IN {ISSUED, USE_REPORTED} has authorized_aums recomputed per calculations.emergency_reduction_reallocation, then its unpaid use bill superseded, then the Permittee balance recomputed"
          - "Allotment.version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: evaluated during POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "ClosureOrder.effective_end_date < the new logical-clock date"
        side_effects:
          - "ClosureOrder.order_status := EXPIRED"
          - "the same recomputation chain as ACTIVE -> LIFTED runs (allotment posture, capacity, AOI authorizations, bill supersession, permittee balances)"

  - entity: TrespassIncident
    state_field: incident_status
    initial_state: DETECTED
    terminal_states: [RESOLVED]
    shape: cyclic
    transitions:
      - from: DETECTED
        to: BILLED
        trigger: "POST /trespass-incidents/{incidentId}/bill"
        actor: AuthorizedOfficer
        preconditions:
          - "incident_status == DETECTED"
          - "TrespassIncident.permittee_id is non-null"
        side_effects:
          - "TrespassIncident.unauthorized_aums, billed_aums and prior_billed_incident_count computed per calculations.unauthorized_use_charge"
          - "a GrazingBill of bill_type UNAUTHORIZED_USE is issued against permittee_id with trespass_incident_id := this incident"
          - "TrespassIncident.incident_status := BILLED"
          - "Permittee.outstanding_balance_cents and Permittee.billed_trespass_incident_count recomputed"
      - from: BILLED
        to: DETECTED
        trigger: "system: side effect of POST /grazing-bills/{billId}/void on the UNAUTHORIZED_USE bill"
        actor: system
        preconditions:
          - "the voided bill has bill_type == UNAUTHORIZED_USE and trespass_incident_id == this incident"
        side_effects:
          - "TrespassIncident.incident_status := DETECTED"
          - "Permittee.outstanding_balance_cents and Permittee.billed_trespass_incident_count recomputed, restoring calculations.money_conservation_invariant"
      - from: BILLED
        to: RESOLVED
        trigger: "system: side effect of POST /grazing-bills/{billId}/payments that pays the UNAUTHORIZED_USE bill in full"
        actor: system
        preconditions:
          - "the linked UNAUTHORIZED_USE bill reaches bill_status PAID"
        side_effects:
          - "TrespassIncident.incident_status := RESOLVED"

  - entity: RangeImprovementProject
    state_field: project_status
    initial_state: PROPOSED
    terminal_states: [COST_ALLOCATED, TERMINATED]
    shape: linear
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /range-improvement-projects/{projectId}/approve"
        actor: AuthorizedOfficer
        preconditions:
          - "project_status == PROPOSED"
          - "Allotment.allotment_status != CLOSED"
        side_effects:
          - "RangeImprovementProject.project_status := APPROVED"
          - "RangeImprovementProject.permittee_share_cents := round_half_up(total_cost_cents * permittee_share_pct)"
      - from: APPROVED
        to: COST_ALLOCATED
        trigger: "POST /range-improvement-projects/{projectId}/allocate-cost-share"
        actor: AuthorizedOfficer
        preconditions:
          - "project_status == APPROVED (validations priority 33, ERR_PROJECT_STATE_INVALID)"
          - "NOTE: an empty eligible pool is NOT a precondition failure. When the allotment has no ISSUED permit (or their permitted_aums sum to 0) the transition still succeeds, allocates 0 cents and raises no bills, per calculations.cost_share_allocation. There is deliberately no ERR_NO_ELIGIBLE_PERMITS code."
        side_effects:
          - "one GrazingBill of bill_type PROJECT_COST_SHARE is issued per eligible permit with share_i > 0 per calculations.cost_share_allocation; zero bills when the eligible pool is empty"
          - "RangeImprovementProject.allocated_share_cents := permittee_share_cents"
          - "RangeImprovementProject.project_status := COST_ALLOCATED"
          - "each affected Permittee.outstanding_balance_cents recomputed"
      - from: APPROVED
        to: TERMINATED
        trigger: "system: side effect of Allotment OPEN|RESTRICTED -> CLOSED"
        actor: system
        preconditions:
          - "the allotment moves to allotment_status CLOSED while project_status == APPROVED"
        side_effects:
          - "RangeImprovementProject.project_status := TERMINATED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned
#         mechanism; every other write-write conflict in this domain reduces to a
#         state precondition and lives in §1.2 / §1.4)
# =============================================================================

concurrency_rules:
  - rule_id: decision-create-stale-allotment
    parent_entity: Allotment
    write_endpoint: "POST /permit-decisions"
    occ_field: "expected_allotment_version"
    description: |
      Creating a PermitDecision against an Allotment whose version has advanced
      since the client last observed it is rejected. A new DRAFT decision of the
      same decision_type legitimately supersedes any prior DRAFT or PROPOSED
      decision of that type on the same allotment (the prior row is vacated by
      the supersede side effect declared on POST /permit-decisions in §1.5, i.e.
      the §1.2 PermitDecision DRAFT -> VACATED / PROPOSED -> VACATED
      transitions), so a second create that carries an
      out-of-date view of the allotment would silently overwrite an allotment
      whose capacity, posture or health determination has already moved — for
      instance because a closure order, a finalized assessment or an earlier
      decision creation has already bumped Allotment.version. The OCC check
      reduces that to a stale-version comparison.
    error_id: ERR_STALE_ALLOTMENT_VERSION
    http_status: 412

domain_constants:
  GRAZING_FEE_RATE_CENTS_PER_AUM: 172
  FORAGE_VALUE_CENTS_PER_AUM: 2340
  DAYS_PER_AUM: 30
  ANIMAL_UNIT_EQUIVALENT: { CATTLE: 1.0, SHEEP: 0.2, HORSES: 1.25 }
  ADMIN_FEE_TIER_1_CEILING_CENTS: 50000
  ADMIN_FEE_TIER_2_CEILING_CENTS: 200000
  ADMIN_FEE_TIER_1_CENTS: 0
  ADMIN_FEE_TIER_2_CENTS: 2500
  ADMIN_FEE_TIER_3_CENTS: 6000
  MIN_BILLABLE_FRACTION: 0.25
  PAYMENT_TERM_DAYS: 30
  MAX_CONSECUTIVE_NONUSE_YEARS: 3
  MAX_APPEAL_REMANDS: 2
  MAX_ASSESSMENT_REMANDS: 2
  MAX_STOCKING_ADJUSTMENT_PCT: 0.9
  TARGET_UTILIZATION_PCT: 50
  HEALTH_MEETING_THRESHOLD: 70
  HEALTH_NOT_MEETING_THRESHOLD: 50
  UPLAND_WEIGHT: 0.40
  RIPARIAN_WEIGHT: 0.35
  WATER_QUALITY_WEIGHT: 0.25
  STANDARD_NOT_MET_REDUCTION_STEP: 0.10
  LIVESTOCK_CAUSAL_REDUCTION_ADDER: 0.10
  MAX_RECOMMENDED_REDUCTION_PCT: 0.50
  WILLFULNESS_MULTIPLIER: { NON_WILLFUL: 1.0, WILLFUL: 2.0, REPEATED_WILLFUL: 3.0 }
  REPEAT_FACTOR_STEP: 0.25
  REPEAT_FACTOR_CEILING: 2.0
  CLOSURE_BUFFER_DAYS: 7
  LAND_QUALIFICATION_FACTOR: 1.0
  LIVESTOCK_QUALIFICATION_FACTOR: 0.75

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: aum_allocation_ledger
    trigger: "on every mutation of Allotment.stocking_adjustment_pct, and on AOI DRAFT->ISSUED, ISSUED->VOIDED, DRAFT->VOIDED, on temporary non-use approval, and on any authorized_aums recomputation"
    algorithm: aggregation
    formula: |
      effective_capacity_aums = floor(total_permitted_aums * (1 - stocking_adjustment_pct))
      allocated_aums =
        sum over AnnualOperatingInstruction aoi where
             GrazingPermit[aoi.permit_id].allotment_id == allotment.id
         AND aoi.grazing_year == allotment.current_grazing_year
         AND aoi.aoi_status IN {ISSUED, USE_REPORTED, BILLED, CLOSED}
        of (aoi.authorized_aums - aoi.nonuse_aums)
      open_aums = effective_capacity_aums - allocated_aums
      current_grazing_year = calendar year (UTC) of the logical clock
    input_set: "AOIs in aoi_status ISSUED, USE_REPORTED, BILLED or CLOSED only; DRAFT and VOIDED AOIs contribute 0. Window is exactly the allotment's current_grazing_year (inclusive of both ends of that calendar year); other grazing years never contribute. The sum is order-insensitive so no tie-break is required."
    constants:
      DAYS_PER_AUM: 30
    precision: "integer AUMs; floor applied to the capacity product only"

  - name: aum_conservation_invariant
    trigger: "asserted after every AOI issue/void pair and after every emergency reduction or vacatur"
    algorithm: aggregation
    formula: |
      INVARIANT_AUM:
        allotment.open_aums + allotment.allocated_aums == allotment.effective_capacity_aums
      COMPENSATION_INVARIANT:
        let A0 = allotment.allocated_aums before POST /annual-operating-instructions/{id}/issue
        after issue:  allotment.allocated_aums == A0 + aoi.billable_aums
        after POST /annual-operating-instructions/{id}/void on that same AOI:
                      allotment.allocated_aums == A0  (exactly, no drift)
                      allotment.open_aums == allotment.effective_capacity_aums - A0
    input_set: "the conserved quantity is AUMs of allotment capacity; the forward action is AOI issuance and the compensating action is AOI void"
    precision: "integer AUMs; exact equality required"

  - name: base_property_qualification
    trigger: "on POST /permittees/{permitteeId}/base-properties and on any read of BaseProperty.qualified_aums"
    algorithm: threshold
    formula: |
      factor = LAND_QUALIFICATION_FACTOR      when base_property_type == LAND
             = LIVESTOCK_QUALIFICATION_FACTOR when base_property_type == LIVESTOCK
      qualified_aums = floor(carrying_capacity_aums * factor)
    input_set: "the single BaseProperty row; no cross-entity inputs"
    constants:
      LAND_QUALIFICATION_FACTOR: 1.0
      LIVESTOCK_QUALIFICATION_FACTOR: 0.75
    precision: "integer AUMs, floor"

  - name: use_record_aums
    trigger: "on POST /annual-operating-instructions/{aoiId}/use-records (planned inputs) and on POST /pasture-use-records/{useRecordId}/report-actual-use (reported inputs)"
    algorithm: aggregation
    formula: |
      days  = (exit_date - entry_date) in whole days      # half-open [entry, exit): exit_date is NOT grazed
      aue   = ANIMAL_UNIT_EQUIVALENT[livestock_kind]
      value = round_half_up(head_count * aue * days / DAYS_PER_AUM, 2)
      planned_aums = value computed from (planned_head_count, planned_entry_date, planned_exit_date)
      actual_aums  = value computed from (actual_head_count,  actual_entry_date,  actual_exit_date)
    input_set: "one PastureUseRecord row; the planned variant reads the planned_* fields, the actual variant reads the actual_* fields"
    constants:
      DAYS_PER_AUM: 30
      ANIMAL_UNIT_EQUIVALENT: { CATTLE: 1.0, SHEEP: 0.2, HORSES: 1.25 }
    precision: "2 decimal places, round_half_up, applied ONCE per record"

  - name: actual_use_aggregation
    trigger: "on POST /pasture-use-records/{useRecordId}/report-actual-use and on POST /annual-operating-instructions/{aoiId}/accept-use-report"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round PER RECORD to 2dp first, then sum the
      # rounded values. Summing the raw quotients and rounding once at the end is
      # WRONG and produces a different money figure downstream.
      actual_aums_total = sum over PastureUseRecord r of this AOI
                            where r.record_status IN {ACTUAL_REPORTED, ACCEPTED}
                          of r.actual_aums                      # each already 2dp
      planned_aums_total = sum over ALL PastureUseRecords of this AOI of r.planned_aums
      distinct_pasture_count = count of DISTINCT r.pasture_id over ALL records of this AOI
    input_set: "records with record_status ACTUAL_REPORTED or ACCEPTED enter actual_aums_total; SCHEDULED records contribute 0. planned_aums_total spans every record regardless of record_status. Sums are order-insensitive."
    precision: "2 decimal places; the per-record rounding happens in use_record_aums and is NOT re-applied to the sum"

  - name: use_bill_amount
    trigger: "on AOI DRAFT->ISSUED (variant PRELIMINARY), on AOI USE_REPORTED->BILLED (variant FINAL), and on every emergency-reduction / stocking-adjustment / vacatur supersession (variant REVISED)"
    algorithm: tiered_pricing
    formula: |
      # STEP ORDER IS PINNED AND NON-NEGOTIABLE. The administrative fee tier is
      # selected from base_amount_cents, NOT from total_amount_cents, even though
      # total_amount_cents contains the fee. Selecting the tier from the total is
      # the circular reading and is WRONG.
      step 1: billed_aums     = per variant (see variants below)
      step 2: base_amount_cents = round_half_up(billed_aums * GRAZING_FEE_RATE_CENTS_PER_AUM)
      step 3: admin_fee_cents = ADMIN_FEE_TIER_1_CENTS
                                  when base_amount_cents <  ADMIN_FEE_TIER_1_CEILING_CENTS
                              = ADMIN_FEE_TIER_2_CENTS
                                  when ADMIN_FEE_TIER_1_CEILING_CENTS <= base_amount_cents
                                       <  ADMIN_FEE_TIER_2_CEILING_CENTS
                              = ADMIN_FEE_TIER_3_CENTS
                                  when base_amount_cents >= ADMIN_FEE_TIER_2_CEILING_CENTS
      step 4: total_amount_cents = base_amount_cents + admin_fee_cents
      step 5 (FINAL variant only): delta_cents = final_total - preliminary_total
              when the PRELIMINARY_USE bill has amount_paid_cents == 0:
                   void it and issue a FINAL_USE bill for final_total with
                   superseded_bill_id := the voided bill id
              when amount_paid_cents > 0:
                   leave it and issue ADJUSTMENT_DEBIT for delta_cents (delta > 0)
                   or ADJUSTMENT_CREDIT for delta_cents (delta < 0, total_amount_cents
                   is negative), and issue nothing at all when delta_cents == 0
      due_date = logical-clock date at issuance + PAYMENT_TERM_DAYS days
    input_set: "exactly one AOI; the PRELIMINARY variant reads authorized_aums and nonuse_aums, the FINAL variant reads actual_aums_total, the REVISED variant reads the post-reduction authorized_aums and nonuse_aums"
    constants:
      GRAZING_FEE_RATE_CENTS_PER_AUM: 172
      ADMIN_FEE_TIER_1_CEILING_CENTS: 50000
      ADMIN_FEE_TIER_2_CEILING_CENTS: 200000
      ADMIN_FEE_TIER_1_CENTS: 0
      ADMIN_FEE_TIER_2_CENTS: 2500
      ADMIN_FEE_TIER_3_CENTS: 6000
      MIN_BILLABLE_FRACTION: 0.25
      PAYMENT_TERM_DAYS: 30
    precision: "integer cents, round_half_up at step 2 only"
    variants:
      - name: PRELIMINARY
        when: "AOI DRAFT -> ISSUED; nothing has been reported yet"
        difference: "billed_aums = authorized_aums - nonuse_aums (an integer, so step 2 is exact). No minimum-charge floor applies."
      - name: FINAL
        when: "AOI USE_REPORTED -> BILLED, after the actual use report is accepted"
        difference: "billed_aums = max(actual_aums_total, floor(MIN_BILLABLE_FRACTION * (authorized_aums - nonuse_aums))) — a 2-decimal quantity, so step 2 genuinely rounds. Identical AOI data therefore yields a different total than the PRELIMINARY variant, and the difference is settled by step 5."
      - name: REVISED
        when: "an emergency reduction, stocking adjustment or vacatur moved authorized_aums while a use bill was still unpaid"
        difference: "billed_aums = the recomputed authorized_aums - nonuse_aums; the superseded bill is voided and the new bill carries superseded_bill_id. No minimum-charge floor applies."

  - name: unauthorized_use_charge
    trigger: "on POST /trespass-incidents/{incidentId}/bill"
    algorithm: threshold
    formula: |
      # THREE INDEPENDENT DIMENSIONS COMBINE MULTIPLICATIVELY:
      #   (1) the forage quantity, ceiling-rounded to whole AUMs
      #   (2) the willfulness multiplier
      #   (3) the repeat-offender factor derived from the permittee's prior billed count
      step 1: aue = ANIMAL_UNIT_EQUIVALENT[incident.livestock_kind]
              unauthorized_aums = round_half_up(head_count * aue * unauthorized_days / DAYS_PER_AUM, 2)
      step 2: billed_aums = ceil(unauthorized_aums)          # CEILING, not round, not floor
      step 3: base_amount_cents = billed_aums * FORAGE_VALUE_CENTS_PER_AUM
      step 4: willfulness_multiplier = WILLFULNESS_MULTIPLIER[incident.willfulness]
      step 5: prior = incident.prior_billed_incident_count
              repeat_factor = min(1.0 + REPEAT_FACTOR_STEP * prior, REPEAT_FACTOR_CEILING)
      step 6: penalty_amount_cents =
                round_half_up(base_amount_cents * (willfulness_multiplier - 1.0) * repeat_factor)
      step 7: total_amount_cents = base_amount_cents + penalty_amount_cents
              admin_fee_cents = 0        # the administrative-fee tier table does NOT apply to
                                         # UNAUTHORIZED_USE bills; the penalty replaces it
      due_date = logical-clock date at issuance + PAYMENT_TERM_DAYS days
      NOTE: a NON_WILLFUL incident has willfulness_multiplier 1.0, so step 6 yields 0
            regardless of repeat_factor — the repeat factor amplifies a penalty, it never
            creates one. Applying repeat_factor to base_amount_cents instead of to the
            penalty is the wrong composition order.
    input_set: "exactly one TrespassIncident row plus its permittee's billed_trespass_incident_count as snapshotted into prior_billed_incident_count at detection time"
    constants:
      FORAGE_VALUE_CENTS_PER_AUM: 2340
      DAYS_PER_AUM: 30
      ANIMAL_UNIT_EQUIVALENT: { CATTLE: 1.0, SHEEP: 0.2, HORSES: 1.25 }
      WILLFULNESS_MULTIPLIER: { NON_WILLFUL: 1.0, WILLFUL: 2.0, REPEATED_WILLFUL: 3.0 }
      REPEAT_FACTOR_STEP: 0.25
      REPEAT_FACTOR_CEILING: 2.0
      PAYMENT_TERM_DAYS: 30
    precision: "unauthorized_aums 2dp round_half_up; billed_aums integer via ceil; cents integer"

  - name: cost_share_allocation
    trigger: "on POST /range-improvement-projects/{projectId}/allocate-cost-share"
    algorithm: waterfall_allocation
    formula: |
      permittee_share_cents = round_half_up(total_cost_cents * permittee_share_pct)
      eligible = GrazingPermits p where p.allotment_id == project.allotment_id
                 AND p.permit_status == ISSUED
      total_aums = sum over eligible of p.permitted_aums
      when eligible is empty OR total_aums == 0:
          allocate nothing, allocated_share_cents := 0, project_status := COST_ALLOCATED
      otherwise:
          # PASS 1 — floor every raw share (never round, or the shares can exceed the pool):
          raw_i    = permittee_share_cents * p_i.permitted_aums / total_aums
          share_i  = floor(raw_i)
          # PASS 2 — distribute the leftover cents ONE AT A TIME, in rank order:
          remainder = permittee_share_cents - sum(share_i)
          rank permits by permitted_aums DESC, then created_at ASC (created_at is unique per row in this domain because permits are created by distinct sequential API calls; id is NEVER a tie-break)
          give +1 cent to each of the first `remainder` permits in that rank order
          # PASS 3 — one PROJECT_COST_SHARE GrazingBill per permit with share_i > 0
          allocated_share_cents = sum(final share_i)     # == permittee_share_cents exactly
    input_set: "GrazingPermits on the project's allotment in permit_status ISSUED only; PENDING_REVIEW, SUSPENDED, CANCELLED, EXPIRED and TRANSFERRED permits are excluded from both total_aums and the bill set. Tie-break for the remainder pass is permitted_aums DESC, created_at ASC (id is never used as a tie-break)."
    constants:
      PAYMENT_TERM_DAYS: 30
    precision: "integer cents; floor in pass 1, +1-cent remainder distribution in pass 2; sum of shares MUST equal permittee_share_cents"

  - name: money_conservation_invariant
    trigger: "asserted after every bill issue/void pair and after every supersession"
    algorithm: aggregation
    formula: |
      INVARIANT_MONEY:
        permittee.outstanding_balance_cents ==
          sum over GrazingBill b where b.permittee_id == permittee.id
                                   AND b.bill_status IN {ISSUED, DELINQUENT}
          of (b.total_amount_cents - b.amount_paid_cents)
      COMPENSATION_INVARIANT:
        let B0 = permittee.outstanding_balance_cents before a bill is issued
        after issuing bill X:            balance == B0 + X.total_amount_cents
        after POST /grazing-bills/X/void: balance == B0   (exactly, no residue)
      SUPERSESSION_INVARIANT:
        voiding bill X and issuing replacement Y in the same operation leaves
        balance == B0 - X.total_amount_cents + Y.total_amount_cents
    input_set: "the conserved quantity is cents of permittee debt; only ISSUED and DELINQUENT bills count — PAID and VOIDED bills contribute 0"
    precision: "integer cents; exact equality required"

  - name: permittee_outstanding_balance
    trigger: "on every GrazingBill create, payment, void, supersession, and on every clock advance that flips a bill to DELINQUENT"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
        sum over GrazingBill b of this permittee
             where b.bill_status IN {ISSUED, DELINQUENT}
        of (b.total_amount_cents - b.amount_paid_cents)
      permittee_status = DEBT_FLAGGED       when outstanding_balance_cents > 0
                                                AND at least one of those bills is DELINQUENT
                       = IN_GOOD_STANDING   otherwise
    input_set: "bills in bill_status ISSUED or DELINQUENT; PAID and VOIDED bills contribute 0. ADJUSTMENT_CREDIT bills carry a negative total_amount_cents and therefore reduce the balance."
    precision: "integer cents; may be negative when credits exceed debits"

  - name: emergency_reduction_reallocation
    trigger: "on POST /closure-orders, on POST /closure-orders/{orderId}/lift, on PermitDecision FINAL->EFFECTIVE for decision_type STOCKING_ADJUSTMENT, and on PermitDecision EFFECTIVE->VACATED"
    algorithm: constraint_propagation
    formula: |
      # HOP 1 — the allotment's adjustment percentage is the strongest single
      # active source, never a product and never a sum:
      stocking_adjustment_pct =
          1.0                                   when any ACTIVE ClosureOrder has
                                                     order_type IN {WILDFIRE_CLOSURE,
                                                                    FULL_CLOSURE}
        = max over all ACTIVE ClosureOrders of reduction_pct, and over the
          adjustment_pct of every EFFECTIVE STOCKING_ADJUSTMENT PermitDecision
          on this allotment                      otherwise
        = 0.0                                    when no such source exists
        capped at MAX_STOCKING_ADJUSTMENT_PCT unless a WILDFIRE_CLOSURE or
        FULL_CLOSURE is active
        rounded to 4 decimal places, round_half_up
      # HOP 2 — allotment capacity:
      effective_capacity_aums = floor(total_permitted_aums * (1 - stocking_adjustment_pct))
      allotment_status = CLOSED     when stocking_adjustment_pct == 1.0
                       = RESTRICTED when 0.0 < stocking_adjustment_pct < 1.0
                       = OPEN       when stocking_adjustment_pct == 0.0
      # HOP 3 — every AOI of the allotment in aoi_status ISSUED or USE_REPORTED
      # for the current grazing year is re-authorized FROM ITS ISSUE-TIME SNAPSHOT
      # (never from its current authorized_aums, which would compound reductions):
      aoi.authorized_aums = floor(aoi.authorized_aums_at_issue * (1 - stocking_adjustment_pct))
      aoi.billable_aums   = aoi.authorized_aums - aoi.nonuse_aums
      # HOP 4 — any unpaid use bill of that AOI is superseded by a REVISED_USE bill
      # (use_bill_amount variant REVISED); a bill with amount_paid_cents > 0 instead
      # receives an ADJUSTMENT_CREDIT for the difference.
      # HOP 5 — the permittee's outstanding_balance_cents and permittee_status are
      # recomputed by permittee_outstanding_balance, and the permit's account_status
      # is re-derived (a permit whose only delinquent bill was voided returns to CURRENT).
    input_set: "ClosureOrders in order_status ACTIVE only (LIFTED and EXPIRED contribute nothing) plus PermitDecisions in decision_status EFFECTIVE only (DRAFT, PROPOSED, FINAL, STAYED and VACATED contribute nothing). AOIs in aoi_status DRAFT, BILLED, CLOSED or VOIDED are NOT re-authorized."
    constants:
      MAX_STOCKING_ADJUSTMENT_PCT: 0.9
    precision: "stocking_adjustment_pct 4dp round_half_up; AUMs integer via floor; the chain must reach a fixed point in one pass — hop 3 never feeds back into hop 1"

  - name: rangeland_health_determination
    trigger: "on RangelandHealthAssessment FIELD_REVIEW->FINALIZED"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(  upland_score        * UPLAND_WEIGHT
                                      + riparian_score      * RIPARIAN_WEIGHT
                                      + water_quality_score * WATER_QUALITY_WEIGHT , 2)
      determination = MEETING                 when composite_score >= HEALTH_MEETING_THRESHOLD
                    = MEETING_WITH_PROBLEMS   when HEALTH_NOT_MEETING_THRESHOLD
                                                   <= composite_score
                                                   <  HEALTH_MEETING_THRESHOLD
                    = NOT_MEETING             otherwise
      NOTE: the three weights sum to exactly 1.00, so an assessment scoring 70/70/70
            lands exactly on HEALTH_MEETING_THRESHOLD and is MEETING (the threshold is
            inclusive at the top band, exclusive at the bottom of it).
      on FINALIZED the allotment's health_determination is set to this determination.
    input_set: "the single assessment row; the three sub-scores are integers 0..100"
    constants:
      UPLAND_WEIGHT: 0.40
      RIPARIAN_WEIGHT: 0.35
      WATER_QUALITY_WEIGHT: 0.25
      HEALTH_MEETING_THRESHOLD: 70
      HEALTH_NOT_MEETING_THRESHOLD: 50
    precision: "2 decimal places, round_half_up, applied once to the weighted sum"

  - name: stocking_adjustment_recommendation
    trigger: "on RangelandHealthAssessment FIELD_REVIEW->FINALIZED"
    algorithm: threshold
    formula: "recommended_reduction_pct is computed by the variant selected by monitoring_method (see variants)"
    input_set: "the single assessment row: standards_not_met, causal_factor_is_livestock, observed_utilization_pct"
    constants:
      STANDARD_NOT_MET_REDUCTION_STEP: 0.10
      LIVESTOCK_CAUSAL_REDUCTION_ADDER: 0.10
      MAX_RECOMMENDED_REDUCTION_PCT: 0.50
      TARGET_UTILIZATION_PCT: 50
    precision: "4 decimal places, round_half_up; capped at MAX_RECOMMENDED_REDUCTION_PCT; floored at 0.0"
    variants:
      - name: PROPORTIONAL_STANDARDS
        when: "monitoring_method == INDICATOR_ASSESSMENT"
        difference: |
          recommended_reduction_pct = round_half_up(
              min( STANDARD_NOT_MET_REDUCTION_STEP * count(standards_not_met)
                   + (LIVESTOCK_CAUSAL_REDUCTION_ADDER if causal_factor_is_livestock else 0.0),
                   MAX_RECOMMENDED_REDUCTION_PCT ), 4)
          observed_utilization_pct is ignored entirely by this variant.
      - name: UTILIZATION_BASED
        when: "monitoring_method == UTILIZATION_MAPPING"
        difference: |
          recommended_reduction_pct = 0.0 when observed_utilization_pct <= TARGET_UTILIZATION_PCT
            otherwise round_half_up(
              min( (observed_utilization_pct - TARGET_UTILIZATION_PCT)
                     / observed_utilization_pct,
                   MAX_RECOMMENDED_REDUCTION_PCT ), 4)
          standards_not_met and causal_factor_is_livestock are ignored entirely by
          this variant, so an assessment with identical standards_not_met and
          causal_factor_is_livestock yields a different recommended_reduction_pct
          under the two monitoring methods.

  - name: consecutive_nonuse_years
    trigger: "on POST /annual-operating-instructions/{aoiId}/non-use and on POST /grazing-permits/{permitId}/renew"
    algorithm: chronological
    formula: |
      consider the permit's AOIs in aoi_status ISSUED, USE_REPORTED, BILLED or CLOSED,
      ordered by grazing_year ASCENDING (creation order is irrelevant — an AOI created
      later for an earlier year must still land in its chronological slot)
      a year COUNTS toward the run when that year's AOI has
          nonuse_aums > 0 AND nonuse_reason IN {RESOURCE_CONSERVATION, PERSONAL_CONVENIENCE}
      a year BREAKS the run when it has nonuse_aums == 0, or when nonuse_reason is
          DROUGHT or WILDFIRE (agency-directed non-use never counts against the
          permittee), or when that grazing_year has no qualifying AOI at all (a gap)
      consecutive_nonuse_years = length of the maximal counting run that ENDS at the
          most recent qualifying year
      renewal is barred once consecutive_nonuse_years >= MAX_CONSECUTIVE_NONUSE_YEARS
    input_set: "AOIs of one permit in aoi_status ISSUED, USE_REPORTED, BILLED or CLOSED; DRAFT and VOIDED AOIs are invisible to the run and act as gaps"
    constants:
      MAX_CONSECUTIVE_NONUSE_YEARS: 3
    precision: "integer count of years"

# =============================================================================
# §1.4 Validation Rules Table (evaluated STRICTLY in ascending priority order;
#      the first violated rule short-circuits and its error_id is returned)
# =============================================================================

validations:
  - priority: 1
    category: structural
    check: |
      Request shape: every field marked required in §1.5 `input:` is present and
      non-null; every enum field holds a declared member; every *_aums / *_cents /
      *_count / acres / *_days field is an integer >= 0 (head counts and
      unauthorized_days >= 1); every *_pct field is a number in [0.0, 1.0];
      *_score fields are integers in [0, 100]; observed_utilization_pct is an
      integer in [1, 100]; date fields are ISO-8601 calendar dates (YYYY-MM-DD);
      season_start / season_end on Allotment are MM-DD strings; instants are
      ISO-8601 UTC with a trailing Z. Additionally:
      agency_share_pct + permittee_share_pct MUST equal exactly 1.0 on
      POST /range-improvement-projects, and adjustment_pct on a
      STOCKING_ADJUSTMENT decision MUST be <= MAX_STOCKING_ADJUSTMENT_PCT (0.9);
      reduction_pct is REQUIRED on a DROUGHT_REDUCTION closure order and MUST
      satisfy 0.0 < reduction_pct <= 0.9, while a WILDFIRE_CLOSURE or
      FULL_CLOSURE order MUST omit reduction_pct or send exactly 1.0 (the server
      records 1.0 either way).
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all write endpoints

  - priority: 2
    category: structural
    check: |
      Date-range coherence, checked before any lookup:
      term_start_date < term_end_date (GrazingPermit);
      season_start_date <= season_end_date (AOI);
      planned_entry_date < planned_exit_date and actual_entry_date <
      actual_exit_date (PastureUseRecord — the interval is half-open, so a
      zero-length interval is never valid);
      effective_start_date <= effective_end_date (ClosureOrder).
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /grazing-permits, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer, POST /annual-operating-instructions, POST /annual-operating-instructions/{aoiId}/use-records, POST /pasture-use-records/{useRecordId}/report-actual-use, POST /closure-orders"

  - priority: 3
    category: auth
    check: |
      The X-User-ID header is present, non-empty and resolves to a known actor,
      and that actor's role appears in the endpoint's §1.5 `roles:` list. A
      Permittee actor may additionally only touch rows that belong to its own
      Permittee entity (its own permits, AOIs, use records, bills and appeals);
      reaching another permittee's row is the same failure.
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints

  - priority: 4
    category: auth
    check: |
      Segregation of duties (role_model = segregation_of_duties), enforced on the
      X-User-ID of the acting officer:
      - POST /rangeland-health-assessments/{assessmentId}/review — the reviewer
        MUST NOT equal RangelandHealthAssessment.author_user_id;
      - POST /permit-decisions/{decisionId}/finalize — the deciding officer MUST
        NOT equal PermitDecision.authoring_officer_id;
      - POST /appeal-cases/{appealId}/decide — the adjudicator MUST NOT equal the
        appealed PermitDecision.deciding_officer_id, and MUST NOT equal its
        authoring_officer_id.
      Because the acting role comes from the X-User-Role header while the acting
      person comes from X-User-ID, one operator id may legitimately present under
      two different roles (a small field office where the same person is both the
      RangeSpecialist and an AuthorizedOfficer). This check therefore compares
      X-User-ID ONLY, never the role: the role gate is priority 3 and has already
      passed by the time priority 4 runs. Consequences: an id whose role header is
      NOT listed for the endpoint fails at priority 3 with ERR_UNAUTHORIZED even
      when it is also the authoring hand, and an id whose role header IS listed
      fails here even though its role is impeccable.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rangeland-health-assessments/{assessmentId}/review, POST /permit-decisions/{decisionId}/finalize, POST /appeal-cases/{appealId}/decide"

  - priority: 5
    category: existence
    check: |
      Every path-parameter resource exists, resolved LEFT TO RIGHT so the
      outermost missing id wins. Mapping: Allotment -> ERR_ALLOTMENT_NOT_FOUND,
      Pasture -> ERR_PASTURE_NOT_FOUND, Permittee -> ERR_PERMITTEE_NOT_FOUND,
      BaseProperty -> ERR_BASE_PROPERTY_NOT_FOUND, GrazingPermit ->
      ERR_PERMIT_NOT_FOUND, AnnualOperatingInstruction -> ERR_AOI_NOT_FOUND,
      PastureUseRecord -> ERR_USE_RECORD_NOT_FOUND, GrazingBill ->
      ERR_BILL_NOT_FOUND, RangelandHealthAssessment -> ERR_ASSESSMENT_NOT_FOUND,
      PermitDecision -> ERR_DECISION_NOT_FOUND, AppealCase ->
      ERR_APPEAL_NOT_FOUND, ClosureOrder -> ERR_CLOSURE_ORDER_NOT_FOUND,
      TrespassIncident -> ERR_TRESPASS_NOT_FOUND, RangeImprovementProject ->
      ERR_PROJECT_NOT_FOUND.
    error_id: ERR_ALLOTMENT_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path parameters

  - priority: 6
    category: existence
    check: |
      Every foreign key sent in the request BODY resolves to an existing row,
      using the same error mapping as priority 5, in the field order declared by
      the endpoint's §1.5 `input:` list.
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: all write endpoints carrying FK fields

  - priority: 7
    category: state
    check: |
      Optimistic concurrency (§1.2.1): on POST /permit-decisions the supplied
      expected_allotment_version MUST equal the current Allotment.version. This is
      checked after existence and before any state or business rule, so a stale
      version on an otherwise-doomed request still surfaces as the OCC error.
    error_id: ERR_STALE_ALLOTMENT_VERSION
    http_status: 412
    applies_to: "POST /permit-decisions"

  - priority: 8
    category: state
    check: |
      The subject row is in a state from which the requested transition is
      declared in §1.2, and every same-entity precondition of that transition
      holds. Mapping: GrazingPermit -> ERR_PERMIT_STATE_INVALID,
      AnnualOperatingInstruction -> ERR_AOI_STATE_INVALID, PastureUseRecord ->
      ERR_USE_RECORD_STATE_INVALID, GrazingBill -> ERR_BILL_STATE_INVALID,
      RangelandHealthAssessment -> ERR_ASSESSMENT_STATE_INVALID, PermitDecision ->
      ERR_DECISION_STATE_INVALID, AppealCase -> ERR_APPEAL_STATE_INVALID,
      ClosureOrder -> ERR_CLOSURE_ORDER_STATE_INVALID, TrespassIncident ->
      ERR_TRESPASS_STATE_INVALID, RangeImprovementProject ->
      ERR_PROJECT_STATE_INVALID.
      This priority ALSO covers the cross-entity state preconditions that name the
      *subject's own parent chain*: creating an AOI requires
      GrazingPermit.permit_status == ISSUED (a PENDING_REVIEW, SUSPENDED,
      CANCELLED, EXPIRED or TRANSFERRED permit yields
      ERR_PERMIT_STATE_INVALID), creating a use record requires
      aoi_status == DRAFT, reporting actual use requires aoi_status == ISSUED,
      and paying a bill requires bill_status IN {ISSUED, DELINQUENT}.
    error_id: ERR_AOI_STATE_INVALID
    http_status: 409
    applies_to: all action and nested-create endpoints

  - priority: 9
    category: business_safety
    check: |
      Rangeland posture gate: when the governing Allotment.allotment_status is
      CLOSED, no permit may be issued, renewed or transferred onto it, no AOI may
      be created or issued for any of its permits, and no use record may be added
      to such an AOI. A RESTRICTED allotment still allows all of these — only the
      reduced capacity applies.
    error_id: ERR_ALLOTMENT_CLOSED
    http_status: 409
    applies_to: "POST /grazing-permits/{permitId}/issue, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer, POST /annual-operating-instructions, POST /annual-operating-instructions/{aoiId}/issue, POST /annual-operating-instructions/{aoiId}/use-records"

  - priority: 10
    category: business_safety
    check: |
      Standards gate: a permit may not be issued, renewed or transferred onto an
      Allotment whose health_determination is NOT_MEETING unless a PermitDecision
      of decision_type STOCKING_ADJUSTMENT on that allotment is already in
      decision_status EFFECTIVE (i.e. the corrective decision has been made).
    error_id: ERR_HEALTH_STANDARDS_NOT_MET
    http_status: 409
    applies_to: "POST /grazing-permits/{permitId}/issue, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer"

  - priority: 11
    category: business_safety
    check: |
      Environmental review gate: PROPOSED -> FINAL requires nepa_status ==
      COMPLETE and a non-empty nepa_findings_summary. A decision whose nepa_level
      is EA or EIS additionally requires a rationale of at least 20 characters.
    error_id: ERR_ENVIRONMENTAL_REVIEW_INCOMPLETE
    http_status: 409
    applies_to: "POST /permit-decisions/{decisionId}/finalize"

  - priority: 12
    category: business_safety
    check: |
      Appeal stay gate (cross-entity): a PermitDecision whose decision_status is
      STAYED — because an AppealCase on it was filed with stay_requested true and
      granted — may not be made effective, and the allotment it targets may not
      receive a further decision of the same decision_type while the stay stands.
      Lifting the stay requires the AppealCase to leave FILED/UNDER_REVIEW.
    error_id: ERR_DECISION_STAYED
    http_status: 409
    applies_to: "POST /permit-decisions/{decisionId}/make-effective, POST /permit-decisions"

  - priority: 13
    category: business_referential
    check: |
      The base_property_id carried by a permit issuance, renewal or transfer MUST
      belong to the permittee that will hold the permit. On a transfer the
      transferee's own base property is required — reusing the transferor's base
      property is this violation.
    error_id: ERR_BASE_PROPERTY_NOT_OWNED
    http_status: 422
    applies_to: "POST /grazing-permits, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer"

  - priority: 14
    category: business_referential
    check: |
      A PastureUseRecord's pasture_id MUST name a Pasture whose allotment_id
      equals the allotment of the AOI's permit.
    error_id: ERR_PASTURE_NOT_IN_ALLOTMENT
    http_status: 422
    applies_to: "POST /annual-operating-instructions/{aoiId}/use-records"

  - priority: 15
    category: business_referential
    check: |
      Renewal and transfer preference chain: the predecessor permit named by the
      path MUST be in permit_status ISSUED, MUST NOT already have a successor
      (no other permit may carry the same predecessor_permit_id), and on renewal
      the new term_start_date MUST be on or after the predecessor's
      term_end_date.
    error_id: ERR_PREDECESSOR_PERMIT_INVALID
    http_status: 422
    applies_to: "POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer"

  - priority: 16
    category: business_referential
    check: |
      Preference qualification: requested_aums MUST be <= the qualified_aums of
      the named base property. A permittee with no base property of the required
      type cannot hold preference at all. The same comparison is re-checked on
      issuance against the stored permitted_aums, so the PENDING_REVIEW -> ISSUED
      precondition has an error mapping even though a conforming application can
      never reach that state.
    error_id: ERR_INSUFFICIENT_QUALIFIED_AUMS
    http_status: 422
    applies_to: "POST /grazing-permits, POST /grazing-permits/{permitId}/issue, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer"

  - priority: 17
    category: business_constraint
    check: |
      At most one AnnualOperatingInstruction per (permit_id, grazing_year) may
      exist in an aoi_status other than VOIDED. A VOIDED AOI frees the slot and a
      replacement may be created for the same year.
    error_id: ERR_DUPLICATE_AOI_FOR_YEAR
    http_status: 409
    applies_to: "POST /annual-operating-instructions"

  - priority: 18
    category: business_constraint
    check: |
      At most one RangelandHealthAssessment per (allotment_id, assessment_year)
      may reach assessment_status FINALIZED, and at most one may sit in DRAFT or
      FIELD_REVIEW at a time.
    error_id: ERR_DUPLICATE_ASSESSMENT_FOR_YEAR
    http_status: 409
    applies_to: "POST /rangeland-health-assessments, POST /rangeland-health-assessments/{assessmentId}/review"

  - priority: 19
    category: business_constraint
    check: |
      Pasture.sequence_order is unique within its Allotment, and the rotation
      sequence must be dense starting at 1 — creating sequence_order N requires
      that N-1 already exists on that allotment.
    error_id: ERR_PASTURE_SEQUENCE_CONFLICT
    http_status: 409
    applies_to: "POST /allotments/{allotmentId}/pastures"

  - priority: 20
    category: business_constraint
    check: |
      Pasture rotation requirement: DRAFT -> ISSUED on an AOI requires
      distinct_pasture_count >= Allotment.required_pasture_rotation_count, and
      every Pasture of that allotment carrying rest_required = true MUST be absent
      from the AOI's use records (a rested pasture may not be scheduled).
    error_id: ERR_ROTATION_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /annual-operating-instructions/{aoiId}/issue"

  - priority: 21
    category: business_constraint
    check: |
      Non-use limit: a permit whose consecutive_nonuse_years (see §1.3
      consecutive_nonuse_years) has reached MAX_CONSECUTIVE_NONUSE_YEARS (3) may
      not be renewed — the preference lapses. At 2 the renewal still succeeds.
      Only RESOURCE_CONSERVATION and PERSONAL_CONVENIENCE years count toward the
      run; DROUGHT and WILDFIRE non-use never bars renewal.
    error_id: ERR_NONUSE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /grazing-permits/{permitId}/renew"

  - priority: 22
    category: business_constraint
    check: |
      Appeal remand ceiling: an AppealCase may be remanded at most
      MAX_APPEAL_REMANDS (2) times. A third REMANDED outcome is rejected and the
      adjudicator must instead AFFIRM, REVERSE or DISMISS.
    error_id: ERR_APPEAL_REMAND_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /appeal-cases/{appealId}/decide"

  - priority: 23
    category: business_constraint
    check: |
      Assessment remand ceiling: FIELD_REVIEW -> DRAFT (a review rejection) may
      happen at most MAX_ASSESSMENT_REMANDS (2) times per assessment; the third
      rejection is refused and the reviewer must finalize or the assessment must
      be abandoned.
    error_id: ERR_ASSESSMENT_REMAND_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /rangeland-health-assessments/{assessmentId}/review"

  - priority: 24
    category: business_constraint
    check: |
      Use-report completeness: ISSUED -> USE_REPORTED requires that the AOI has at
      least one PastureUseRecord and that NO record is still in record_status
      SCHEDULED — every scheduled window must have been reported (or the record
      removed) before the report can be accepted and billed.
    error_id: ERR_ACTUAL_USE_INCOMPLETE
    http_status: 409
    applies_to: "POST /annual-operating-instructions/{aoiId}/accept-use-report"

  - priority: 25
    category: business_temporal
    check: |
      Season of use: a use record's planned interval [planned_entry_date,
      planned_exit_date) must fall entirely within [season_start_date,
      season_end_date] of its AOI, and that AOI season must itself fall within the
      Allotment's recurring MM-DD season window [season_start, season_end] for the
      AOI's grazing_year. An actual interval reported outside the AOI season is the
      same violation.
    error_id: ERR_SEASON_OF_USE_VIOLATION
    http_status: 422
    applies_to: "POST /annual-operating-instructions, POST /annual-operating-instructions/{aoiId}/use-records, POST /pasture-use-records/{useRecordId}/report-actual-use"

  - priority: 26
    category: business_temporal
    check: |
      Closure-order spacing: a new ClosureOrder's CLOSED interval
      [effective_start_date, effective_end_date] must not overlap, and must not
      begin within CLOSURE_BUFFER_DAYS (7) days after the end of, any existing
      order on the same allotment in order_status ACTIVE. Formally the new order is
      rejected when new.effective_start_date <= existing.effective_end_date +
      7 days; a start on day +8 is accepted. Both endpoints of both intervals are
      inclusive, so touching ends overlap.
    error_id: ERR_CLOSURE_ORDER_OVERLAP
    http_status: 409
    applies_to: "POST /closure-orders"

  - priority: 27
    category: business_temporal
    check: |
      The logical clock is monotonic: the requested current_utc must be strictly
      after the present logical clock value (which defaults to
      2026-08-01T00:00:00Z before any set call).
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 28
    category: business_fiscal
    check: |
      Debt gate (cross-entity, checked against the live Permittee aggregate): a
      permit may not be issued, renewed or transferred, and no new AOI may be
      created, while the holding Permittee's outstanding_balance_cents > 0. On a
      transfer the check runs against the TRANSFEREE, not the transferor.
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 402
    applies_to: "POST /grazing-permits/{permitId}/issue, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer, POST /annual-operating-instructions"

  - priority: 29
    category: business_fiscal
    check: |
      Pasture capacity, evaluated as a TEMPORAL AGGREGATE: for the pasture named by
      a new or updated use record, sum planned_aums over every record on that
      pasture whose half-open planned interval [entry, exit) INTERSECTS the new
      record's half-open interval (records of any AOI of the same grazing_year
      count, and the new record itself is included). That sum must be <=
      Pasture.pasture_aum_capacity. Two records that merely touch (one's exit ==
      the other's entry) do NOT intersect and are never aggregated.
    error_id: ERR_PASTURE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /annual-operating-instructions/{aoiId}/use-records, POST /pasture-use-records/{useRecordId}/report-actual-use"

  - priority: 30
    category: business_fiscal
    check: |
      Allotment capacity: on AOI creation the requested authorized_aums must be <=
      Allotment.open_aums as of that moment, and the same check is re-run at AOI
      issuance against the then-current open_aums (a capacity that shrank between
      draft and issue makes the issue fail even though the draft was accepted). On
      permit issuance, renewal and transfer the same rule applies to the permit's
      permitted_aums: it must be <= Allotment.open_aums at that moment.
    error_id: ERR_ALLOTMENT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /annual-operating-instructions, POST /annual-operating-instructions/{aoiId}/issue, POST /grazing-permits/{permitId}/issue, POST /grazing-permits/{permitId}/renew, POST /grazing-permits/{permitId}/transfer"

  - priority: 31
    category: business_fiscal
    check: |
      Temporary non-use: requested nonuse_aums must be >= 1 and <= the AOI's
      current authorized_aums, and DROUGHT / WILDFIRE reasons are accepted only
      while an ACTIVE ClosureOrder of the matching order_type exists on the
      allotment.
    error_id: ERR_NONUSE_EXCEEDS_AUTHORIZED
    http_status: 422
    applies_to: "POST /annual-operating-instructions/{aoiId}/non-use"

  - priority: 32
    category: business_fiscal
    check: |
      A payment's amount_cents must be >= 1 and must not exceed
      (total_amount_cents - amount_paid_cents) of the target bill; overpayment is
      refused rather than credited.
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /grazing-bills/{billId}/payments"

  - priority: 33
    category: business_fiscal
    check: |
      Cost-share allocation preconditions: total_cost_cents must be >= 1 and the
      project must be in project_status APPROVED. An allotment with no
      permit_status == ISSUED permits is NOT an error — the allocation succeeds
      with allocated_share_cents 0 and issues no bills.
    error_id: ERR_PROJECT_STATE_INVALID
    http_status: 409
    applies_to: "POST /range-improvement-projects/{projectId}/allocate-cost-share"

# =============================================================================
# §1.5 API Endpoint Table
#      Flat topology: every entity has a top-level collection; nested paths are
#      used only where the child is meaningless without the parent (pastures,
#      base properties, use records, payments, appeals).
#      All list endpoints are paginated and return {items, total_count, has_more}
#      inside `data` per §1.0.
# =============================================================================

endpoints:
  # ---------------------------------------------------------------- Allotment
  - method: POST
    path: "/allotments"
    description: "Register a grazing allotment with its permitted AUM ceiling, season of use and rotation requirement. Starts OPEN / NOT_ASSESSED with stocking_adjustment_pct 0.0."
    roles: [AuthorizedOfficer]
    code: 201
    input: [name, admin_unit_code, acres, total_permitted_aums, season_start, season_end, "required_pasture_rotation_count?"]
    output: Allotment
    side_effects: ["aum_allocation_ledger: effective_capacity_aums = total_permitted_aums, allocated_aums = 0, open_aums = total_permitted_aums", "current_grazing_year := calendar year of the logical clock"]

  - method: GET
    path: "/allotments"
    description: "List allotments, filterable by posture and health determination."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_status?", "health_determination?", "admin_unit_code?", "limit?", "offset?"]
    output: Allotment[]
    side_effects: []

  - method: GET
    path: "/allotments/{allotmentId}"
    description: "Fetch one allotment including its live capacity ledger (effective_capacity_aums, allocated_aums, open_aums) and version."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: Allotment
    side_effects: []

  - method: POST
    path: "/allotments/{allotmentId}/pastures"
    description: "Add a pasture to the allotment's rotation. sequence_order must be unique and dense from 1."
    roles: [AuthorizedOfficer]
    code: 201
    input: [name, pasture_aum_capacity, sequence_order, "rest_required?"]
    output: Pasture
    side_effects: []

  - method: GET
    path: "/allotments/{allotmentId}/pastures"
    description: "List the allotment's pastures in rotation order."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["limit?", "offset?"]
    output: Pasture[]
    side_effects: []

  - method: GET
    path: "/pastures/{pastureId}"
    description: "Fetch one pasture, including its scheduled_aums roll-up for the allotment's current_grazing_year."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: Pasture
    side_effects: []

  - method: GET
    path: "/pastures"
    description: "List pastures across allotments, optionally narrowed to one allotment or to rest-flagged units."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "rest_required?", "limit?", "offset?"]
    output: Pasture[]
    side_effects: []

  - method: GET
    path: "/allotments/{allotmentId}/closure-orders"
    description: "List closure and emergency-reduction orders issued against the allotment."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["order_status?", "order_type?", "limit?", "offset?"]
    output: ClosureOrder[]
    side_effects: []

  # ---------------------------------------------------------------- Permittee
  - method: POST
    path: "/permittees"
    description: "Register a grazing permittee (rancher/operator). Starts IN_GOOD_STANDING with outstanding_balance_cents 0."
    roles: [AuthorizedOfficer]
    code: 201
    input: [name, contact_email]
    output: Permittee
    side_effects: []

  - method: GET
    path: "/permittees/{permitteeId}"
    description: "Fetch one permittee including outstanding_balance_cents, billed_trespass_incident_count and permittee_status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: Permittee
    side_effects: []

  - method: POST
    path: "/permittees/{permitteeId}/base-properties"
    description: "Record a base property (deeded land or controlled livestock) that supports grazing preference. qualified_aums is computed by base_property_qualification."
    roles: [AuthorizedOfficer]
    code: 201
    input: [base_property_type, legal_description, carrying_capacity_aums, controlled_since_date]
    output: BaseProperty
    side_effects: ["base_property_qualification: qualified_aums computed from carrying_capacity_aums and base_property_type"]

  - method: GET
    path: "/permittees/{permitteeId}/base-properties"
    description: "List the permittee's base properties with their qualified_aums."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["base_property_type?", "limit?", "offset?"]
    output: BaseProperty[]
    side_effects: []

  - method: GET
    path: "/base-properties/{basePropertyId}"
    description: "Fetch one base property with its computed qualified_aums."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: BaseProperty
    side_effects: []

  - method: GET
    path: "/base-properties"
    description: "List base properties across permittees, optionally narrowed to one permittee or one base_property_type."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["permittee_id?", "base_property_type?", "limit?", "offset?"]
    output: BaseProperty[]
    side_effects: []

  # ------------------------------------------------------------ GrazingPermit
  - method: POST
    path: "/grazing-permits"
    description: "Apply for a term grazing permit. Created in permit_status PENDING_REVIEW / account_status CURRENT; consumes no capacity until issued."
    roles: [AuthorizedOfficer]
    code: 201
    input: [allotment_id, permittee_id, base_property_id, requested_aums, term_start_date, term_end_date, livestock_kind]
    output: GrazingPermit
    side_effects: []

  - method: GET
    path: "/grazing-permits"
    description: "List permits with FK and status filters."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "permittee_id?", "base_property_id?", "predecessor_permit_id?", "permit_status?", "account_status?", "limit?", "offset?"]
    output: GrazingPermit[]
    side_effects: []

  - method: GET
    path: "/grazing-permits/{permitId}"
    description: "Fetch one permit including both status dimensions, suspension_reason and consecutive_nonuse_years."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: GrazingPermit
    side_effects: []

  - method: POST
    path: "/grazing-permits/{permitId}/issue"
    description: "Issue a PENDING_REVIEW permit (permit_status -> ISSUED). Gated by allotment posture, health standards, preference qualification and permittee debt."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: GrazingPermit
    side_effects: ["permitted_aums is already the requested_aums stored at application time and is NOT re-read here", "preference_priority computed from the qualifying BaseProperty.base_property_type: 1 when LAND, 2 when LIVESTOCK (it stays at its default 2 for the whole PENDING_REVIEW period, so an unissued LAND-backed permit still reads 2)"]

  - method: POST
    path: "/grazing-permits/{permitId}/renew"
    description: "Renew an ISSUED permit for a new term: creates a SUCCESSOR permit in PENDING_REVIEW carrying predecessor_permit_id, and expires the predecessor (permit_status -> EXPIRED). Barred by the consecutive non-use ceiling and by permittee debt."
    roles: [AuthorizedOfficer]
    code: 201
    input: [term_start_date, term_end_date, requested_aums, base_property_id]
    output: GrazingPermit
    side_effects: ["consecutive_nonuse_years recomputed on the predecessor and copied to the successor", "predecessor permit_status -> EXPIRED"]

  - method: POST
    path: "/grazing-permits/{permitId}/transfer"
    description: "Transfer an ISSUED permit to another permittee who holds their own qualifying base property: creates a successor permit in PENDING_REVIEW for the transferee and sets the source permit to TRANSFERRED."
    roles: [AuthorizedOfficer]
    code: 201
    input: [transferee_permittee_id, base_property_id, term_start_date, term_end_date, requested_aums]
    output: GrazingPermit
    side_effects: ["source permit_status -> TRANSFERRED", "successor.predecessor_permit_id := source permit id"]

  # ------------------------------------------ AnnualOperatingInstruction (AOI)
  - method: POST
    path: "/annual-operating-instructions"
    description: "Draft the annual operating instructions for one ISSUED permit and grazing year. Created in aoi_status DRAFT; capacity is checked but not yet consumed."
    roles: [RangeSpecialist, AuthorizedOfficer]
    code: 201
    input: [permit_id, grazing_year, authorized_aums, season_start_date, season_end_date]
    output: AnnualOperatingInstruction
    side_effects: ["authorized_aums_at_issue := authorized_aums (snapshot, never mutated afterwards)", "nonuse_aums := 0", "billable_aums := authorized_aums"]

  - method: GET
    path: "/annual-operating-instructions"
    description: "List AOIs by permit, grazing year or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["permit_id?", "grazing_year?", "aoi_status?", "nonuse_reason?", "limit?", "offset?"]
    output: AnnualOperatingInstruction[]
    side_effects: []

  - method: GET
    path: "/annual-operating-instructions/{aoiId}"
    description: "Fetch one AOI including authorized_aums, authorized_aums_at_issue, nonuse_aums, planned/actual AUM totals, billable_aums and distinct_pasture_count."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: AnnualOperatingInstruction
    side_effects: []

  - method: POST
    path: "/annual-operating-instructions/{aoiId}/use-records"
    description: "Schedule one pasture-rotation window on a DRAFT AOI. planned_aums is computed; the half-open [entry, exit) window is aggregate-capacity checked against the pasture."
    roles: [RangeSpecialist, AuthorizedOfficer]
    code: 201
    input: [pasture_id, planned_entry_date, planned_exit_date, planned_head_count, livestock_kind]
    output: PastureUseRecord
    side_effects: ["use_record_aums (planned variant): planned_aums computed", "actual_use_aggregation: AOI planned_aums_total and distinct_pasture_count recomputed", "Pasture.scheduled_aums recomputed"]

  - method: GET
    path: "/pasture-use-records"
    description: "List use records by AOI, pasture or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["aoi_id?", "pasture_id?", "record_status?", "limit?", "offset?"]
    output: PastureUseRecord[]
    side_effects: []

  - method: GET
    path: "/pasture-use-records/{useRecordId}"
    description: "Fetch one use record with both planned and actual figures."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: PastureUseRecord
    side_effects: []

  - method: POST
    path: "/annual-operating-instructions/{aoiId}/issue"
    description: "Issue the AOI (DRAFT -> ISSUED): consumes allotment capacity and raises the PRELIMINARY_USE bill at the grazing fee rate."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: AnnualOperatingInstruction
    side_effects: ["use_bill_amount (PRELIMINARY variant): a PRELIMINARY_USE GrazingBill is created in bill_status ISSUED with due_date = clock + 30 days", "aum_allocation_ledger: Allotment.allocated_aums += billable_aums, open_aums recomputed, Allotment.version bumped", "permittee_outstanding_balance recomputed"]

  - method: POST
    path: "/annual-operating-instructions/{aoiId}/non-use"
    description: "Approve temporary non-use of part of the authorized AUMs (drought, wildfire, resource conservation or personal convenience). Releases capacity and revises any unpaid use bill."
    roles: [AuthorizedOfficer]
    code: 200
    input: [nonuse_aums, nonuse_reason]
    output: AnnualOperatingInstruction
    side_effects: ["billable_aums := authorized_aums - nonuse_aums", "aum_allocation_ledger recomputed on the Allotment", "use_bill_amount (REVISED variant) supersedes an unpaid PRELIMINARY_USE bill", "consecutive_nonuse_years recomputed on the permit", "permittee_outstanding_balance recomputed"]

  - method: POST
    path: "/pasture-use-records/{useRecordId}/report-actual-use"
    description: "Report the actual grazing period and head count for a scheduled window (record_status SCHEDULED -> ACTUAL_REPORTED). actual_aums is rounded to 2dp per record."
    roles: [Permittee, RangeSpecialist]
    code: 200
    input: [actual_entry_date, actual_exit_date, actual_head_count]
    output: PastureUseRecord
    side_effects: ["use_record_aums (actual variant): actual_aums computed and rounded to 2dp", "actual_use_aggregation: AOI actual_aums_total recomputed as the sum of the already-rounded per-record values"]

  - method: POST
    path: "/annual-operating-instructions/{aoiId}/accept-use-report"
    description: "Accept the actual-use report and bill it: ISSUED -> USE_REPORTED -> BILLED in one atomic operation. Requires every use record to have been reported."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: AnnualOperatingInstruction
    side_effects: ["every PastureUseRecord record_status ACTUAL_REPORTED -> ACCEPTED", "use_bill_amount (FINAL variant): FINAL_USE bill replaces an unpaid PRELIMINARY_USE bill, or an ADJUSTMENT_DEBIT / ADJUSTMENT_CREDIT settles the delta when the preliminary bill was partly paid", "permittee_outstanding_balance recomputed"]

  - method: POST
    path: "/annual-operating-instructions/{aoiId}/void"
    description: "Void an AOI (from DRAFT, ISSUED or USE_REPORTED): releases all consumed capacity and voids every unpaid bill raised from it."
    roles: [AuthorizedOfficer]
    code: 200
    input: ["void_reason?"]
    output: AnnualOperatingInstruction
    side_effects: ["aum_allocation_ledger: Allotment.allocated_aums restored to its pre-issue value exactly (aum_conservation_invariant)", "every non-PAID bill of this AOI -> VOIDED", "permittee_outstanding_balance and permit account_status recomputed (money_conservation_invariant)"]

  # -------------------------------------------------------------- GrazingBill
  - method: GET
    path: "/grazing-bills"
    description: "List bills by permittee, source document, supersession chain, type or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["permittee_id?", "aoi_id?", "trespass_incident_id?", "project_id?", "superseded_bill_id?", "bill_type?", "bill_status?", "limit?", "offset?"]
    output: GrazingBill[]
    side_effects: []

  - method: GET
    path: "/grazing-bills/{billId}"
    description: "Fetch one bill with its full money breakdown (billed_aums, fee_rate_cents_per_aum, base_amount_cents, admin_fee_cents, penalty_amount_cents, total_amount_cents, amount_paid_cents)."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: GrazingBill
    side_effects: []

  - method: POST
    path: "/grazing-bills/{billId}/payments"
    description: "Record a payment against an ISSUED or DELINQUENT bill. Full payment marks the bill PAID and may close the AOI."
    roles: [Permittee, AuthorizedOfficer]
    code: 201
    input: [amount_cents]
    output: GrazingBill
    side_effects: ["amount_paid_cents += amount_cents; bill_status -> PAID when fully paid", "permittee_outstanding_balance and permittee_status recomputed", "permit account_status -> CURRENT when no delinquent bill remains; suspension_reason NONPAYMENT lifted", "AOI BILLED -> CLOSED when every bill of that AOI is PAID or VOIDED"]

  - method: POST
    path: "/grazing-bills/{billId}/void"
    description: "Void a bill that was raised in error or superseded. Only bills with amount_paid_cents == 0 may be voided."
    roles: [AuthorizedOfficer]
    code: 200
    input: ["void_reason?"]
    output: GrazingBill
    side_effects: ["bill_status -> VOIDED", "permittee_outstanding_balance recomputed (money_conservation_invariant)", "TrespassIncident BILLED -> DETECTED when the voided bill was its UNAUTHORIZED_USE bill", "permit account_status re-derived"]

  # ------------------------------------------------ RangelandHealthAssessment
  - method: POST
    path: "/rangeland-health-assessments"
    description: "Open a rangeland health assessment for an allotment and year. Created in DRAFT with author_user_id taken from X-User-ID; composite_score and determination stay null until finalized."
    roles: [RangeSpecialist]
    code: 201
    input: [allotment_id, assessment_year, monitoring_method, upland_score, riparian_score, water_quality_score, "observed_utilization_pct?", "standards_not_met?", "causal_factor_is_livestock?"]
    output: RangelandHealthAssessment
    side_effects: ["author_user_id := X-User-ID", "remand_count := 0"]

  - method: GET
    path: "/rangeland-health-assessments"
    description: "List assessments by allotment, year, method or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "assessment_year?", "monitoring_method?", "assessment_status?", "determination?", "limit?", "offset?"]
    output: RangelandHealthAssessment[]
    side_effects: []

  - method: GET
    path: "/rangeland-health-assessments/{assessmentId}"
    description: "Fetch one assessment including composite_score, determination, recommended_reduction_pct and remand_count."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: RangelandHealthAssessment
    side_effects: []

  - method: POST
    path: "/rangeland-health-assessments/{assessmentId}/submit"
    description: "Submit a DRAFT assessment for field review (DRAFT -> FIELD_REVIEW)."
    roles: [RangeSpecialist]
    code: 200
    input: []
    output: RangelandHealthAssessment
    side_effects: []

  - method: POST
    path: "/rangeland-health-assessments/{assessmentId}/review"
    description: "Review a FIELD_REVIEW assessment. review_outcome CONCUR scores it and stamps the allotment's health determination; REMAND sends it back to DRAFT with no scoring side effect at all. The reviewer must not be the author."
    roles: [AuthorizedOfficer]
    code: 200
    input: [review_outcome, "review_notes?"]
    output: RangelandHealthAssessment
    side_effects: ["CONCUR: rangeland_health_determination computes composite_score and determination; stocking_adjustment_recommendation computes recommended_reduction_pct by monitoring_method; Allotment.health_determination := determination and Allotment.version bumped", "REMAND: remand_count += 1 and NOTHING else changes — no score, no determination, no allotment write"]

  # ------------------------------------------------------------ PermitDecision
  - method: POST
    path: "/permit-decisions"
    description: "Author a decision document (issuance, stocking adjustment, suspension or cancellation) against an allotment. Created in DRAFT with nepa_status PENDING. Requires expected_allotment_version (OCC, §1.2.1) and supersedes any prior DRAFT or PROPOSED decision of the same decision_type on that allotment."
    roles: [RangeSpecialist]
    code: 201
    input: [decision_type, allotment_id, expected_allotment_version, nepa_level, "permit_id?", "assessment_id?", "adjustment_pct?", "effective_date?", "rationale?"]
    output: PermitDecision
    side_effects: ["authoring_officer_id := X-User-ID", "any prior DRAFT or PROPOSED decision of the same decision_type on this allotment -> VACATED", "Allotment.version bumped"]

  - method: GET
    path: "/permit-decisions"
    description: "List decisions by allotment, permit, source assessment, type or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "permit_id?", "assessment_id?", "decision_type?", "decision_status?", "nepa_status?", "limit?", "offset?"]
    output: PermitDecision[]
    side_effects: []

  - method: GET
    path: "/permit-decisions/{decisionId}"
    description: "Fetch one decision including nepa_status, adjustment_pct, pre_decision_adjustment_pct and both officer ids."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: PermitDecision
    side_effects: []

  - method: POST
    path: "/permit-decisions/{decisionId}/complete-environmental-review"
    description: "Record the NEPA findings and propose the decision (DRAFT -> PROPOSED, nepa_status -> COMPLETE)."
    roles: [RangeSpecialist]
    code: 200
    input: [nepa_findings_summary]
    output: PermitDecision
    side_effects: ["nepa_status := COMPLETE"]

  - method: POST
    path: "/permit-decisions/{decisionId}/finalize"
    description: "Sign a PROPOSED decision (PROPOSED -> FINAL). The deciding officer must differ from the authoring officer and the environmental review must be complete."
    roles: [AuthorizedOfficer]
    code: 200
    input: ["rationale?"]
    output: PermitDecision
    side_effects: ["deciding_officer_id := X-User-ID"]

  - method: POST
    path: "/permit-decisions/{decisionId}/make-effective"
    description: "Put a FINAL decision into effect (FINAL -> EFFECTIVE) and run its cascade. Refused while the decision is STAYED by an appeal."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: PermitDecision
    side_effects: ["pre_decision_adjustment_pct := Allotment.stocking_adjustment_pct before the change (so a vacatur can restore it exactly)", "STOCKING_ADJUSTMENT: emergency_reduction_reallocation runs the full 5-hop cascade (allotment pct -> capacity/posture -> AOI re-authorization from snapshot -> bill supersession -> permittee balance and permit account_status)", "SUSPENSION: the named permit permit_status -> SUSPENDED with suspension_reason DECISION", "CANCELLATION: the named permit permit_status -> CANCELLED and its non-terminal AOIs -> VOIDED", "Allotment.version bumped"]

  - method: POST
    path: "/permit-decisions/{decisionId}/appeals"
    description: "File an administrative appeal against a FINAL or EFFECTIVE decision. A stay request on a FINAL (not yet effective) decision is granted and freezes it."
    roles: [Permittee]
    code: 201
    input: [appellant_permittee_id, stay_requested, statement_of_reasons]
    output: AppealCase
    side_effects: ["AppealCase created in appeal_status FILED with remand_count 0", "when stay_requested is true AND decision_status == FINAL: stay_granted := true and decision_status -> STAYED", "when the decision is already EFFECTIVE: stay_granted := false and the decision is untouched"]

  # ---------------------------------------------------------------- AppealCase
  - method: GET
    path: "/appeal-cases"
    description: "List appeals by decision, appellant or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["decision_id?", "appellant_permittee_id?", "appeal_status?", "stay_granted?", "limit?", "offset?"]
    output: AppealCase[]
    side_effects: []

  - method: GET
    path: "/appeal-cases/{appealId}"
    description: "Fetch one appeal including stay_granted, remand_count and adjudicator_id."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: AppealCase
    side_effects: []

  - method: POST
    path: "/appeal-cases/{appealId}/docket"
    description: "Docket a FILED appeal for adjudication (FILED -> UNDER_REVIEW). A REMANDED appeal returns to UNDER_REVIEW when the deciding officer re-finalizes the remanded decision, not through this endpoint."
    roles: [AppealsAdjudicator]
    code: 200
    input: []
    output: AppealCase
    side_effects: ["adjudicator_id := X-User-ID"]

  - method: POST
    path: "/appeal-cases/{appealId}/decide"
    description: "Decide an UNDER_REVIEW appeal: appeal_outcome AFFIRM, REVERSE, REMAND or DISMISS. REVERSE vacates the appealed decision and unwinds its cascade; REMAND loops the case back through the deciding officer, at most MAX_APPEAL_REMANDS times."
    roles: [AppealsAdjudicator]
    code: 200
    input: [appeal_outcome, "decision_rationale?"]
    output: AppealCase
    side_effects: ["AFFIRM or DISMISS: the stay is released and a STAYED decision moves STAYED -> EFFECTIVE, running its cascade at that moment", "REVERSE: decision_status -> VACATED and emergency_reduction_reallocation re-runs from pre_decision_adjustment_pct, restoring allotment capacity, AOI authorized_aums and the superseded bills", "REMAND: appeal_status -> REMANDED, remand_count += 1, and the appealed decision moves FINAL -> PROPOSED with deciding_officer_id := null"]

  # -------------------------------------------------------------- ClosureOrder
  - method: POST
    path: "/closure-orders"
    description: "Issue a drought reduction, wildfire closure or full closure order over a CLOSED date interval. Immediately drives the allotment's stocking_adjustment_pct and the whole reallocation cascade."
    roles: [AuthorizedOfficer]
    code: 201
    input: [allotment_id, order_type, effective_start_date, effective_end_date, justification, "reduction_pct?"]
    output: ClosureOrder
    side_effects: ["order_status := ACTIVE", "reduction_pct := 1.0 for WILDFIRE_CLOSURE and FULL_CLOSURE", "emergency_reduction_reallocation runs the full cascade on the allotment", "Allotment.version bumped"]

  - method: GET
    path: "/closure-orders/{closureOrderId}"
    description: "Fetch one closure order."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: ClosureOrder
    side_effects: []

  - method: GET
    path: "/closure-orders"
    description: "List closure and emergency-reduction orders across allotments, optionally narrowed by allotment, status or type."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "order_status?", "order_type?", "limit?", "offset?"]
    output: ClosureOrder[]
    side_effects: []

  - method: POST
    path: "/closure-orders/{closureOrderId}/lift"
    description: "Lift an ACTIVE closure order early (ACTIVE -> LIFTED) and re-run the reallocation cascade, restoring AOI authorizations from their issue-time snapshots."
    roles: [AuthorizedOfficer]
    code: 200
    input: ["justification?"]
    output: ClosureOrder
    side_effects: ["emergency_reduction_reallocation recomputes stocking_adjustment_pct from the remaining ACTIVE orders and EFFECTIVE decisions", "AOI authorized_aums restored from authorized_aums_at_issue", "unpaid REVISED_USE bills superseded again at the restored figure", "Allotment.version bumped"]

  # ----------------------------------------------------------- TrespassIncident
  - method: POST
    path: "/trespass-incidents"
    description: "Record detected unauthorized use. prior_billed_incident_count is snapshotted from the permittee's billed_trespass_incident_count at detection time; unauthorized_aums is computed but not yet billed."
    roles: [RangeSpecialist]
    code: 201
    input: [allotment_id, permittee_id, detected_at, head_count, livestock_kind, unauthorized_days, willfulness]
    output: TrespassIncident
    side_effects: ["unauthorized_use_charge step 1: unauthorized_aums computed to 2dp", "prior_billed_incident_count snapshotted per §1.1 TrespassIncident.prior_billed_incident_count — the count of OTHER incidents of the same permittee_id whose incident_status is BILLED or RESOLVED and whose detected_at is strictly earlier than this incident's detected_at (equal to Permittee.billed_trespass_incident_count whenever incidents are billed in detection order, which is the only ordering this suite builds)", "incident_status := DETECTED"]

  - method: GET
    path: "/trespass-incidents"
    description: "List trespass incidents by allotment, permittee, willfulness or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "permittee_id?", "willfulness?", "incident_status?", "limit?", "offset?"]
    output: TrespassIncident[]
    side_effects: []

  - method: GET
    path: "/trespass-incidents/{incidentId}"
    description: "Fetch one incident including unauthorized_aums, billed_aums and prior_billed_incident_count."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: TrespassIncident
    side_effects: []

  - method: POST
    path: "/trespass-incidents/{incidentId}/bill"
    description: "Bill unauthorized use at the full forage value with the willfulness and repeat-offender penalty (DETECTED -> BILLED)."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: TrespassIncident
    side_effects: ["unauthorized_use_charge: billed_aums := ceil(unauthorized_aums); an UNAUTHORIZED_USE GrazingBill is created with base_amount_cents, penalty_amount_cents and total_amount_cents", "Permittee.billed_trespass_incident_count += 1", "permittee_outstanding_balance and permittee_status recomputed"]

  # ------------------------------------------------------ RangeImprovementProject
  - method: POST
    path: "/range-improvement-projects"
    description: "Propose a range improvement project (fence, water development or seeding) with its agency/permittee cost split and maintenance responsibility."
    roles: [RangeSpecialist]
    code: 201
    input: [allotment_id, project_type, total_cost_cents, agency_share_pct, permittee_share_pct, maintenance_responsibility]
    output: RangeImprovementProject
    side_effects: ["project_status := PROPOSED", "permittee_share_cents and allocated_share_cents := 0"]

  - method: GET
    path: "/range-improvement-projects"
    description: "List projects by allotment, type, maintenance responsibility or status."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: ["allotment_id?", "project_type?", "maintenance_responsibility?", "project_status?", "limit?", "offset?"]
    output: RangeImprovementProject[]
    side_effects: []

  - method: GET
    path: "/range-improvement-projects/{projectId}"
    description: "Fetch one project including permittee_share_cents and allocated_share_cents."
    roles: [Permittee, RangeSpecialist, AuthorizedOfficer, AppealsAdjudicator]
    code: 200
    input: []
    output: RangeImprovementProject
    side_effects: []

  - method: POST
    path: "/range-improvement-projects/{projectId}/approve"
    description: "Approve a PROPOSED project (PROPOSED -> APPROVED) and fix the permittee's monetary share."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: RangeImprovementProject
    side_effects: ["cost_share_allocation step 1: permittee_share_cents := round_half_up(total_cost_cents * permittee_share_pct)"]

  - method: POST
    path: "/range-improvement-projects/{projectId}/allocate-cost-share"
    description: "Allocate the permittee share across the allotment's ISSUED permits pro rata by permitted AUMs (APPROVED -> COST_ALLOCATED) and raise one PROJECT_COST_SHARE bill per permit. An empty eligible pool allocates 0 and raises no bills."
    roles: [AuthorizedOfficer]
    code: 200
    input: []
    output: RangeImprovementProject
    side_effects: ["cost_share_allocation: floor each pro-rata share, then distribute the leftover cents one at a time by permitted_aums DESC, created_at ASC (id is never used as a tie-break)", "one PROJECT_COST_SHARE GrazingBill per permit with a non-zero share, due_date = clock + 30 days", "allocated_share_cents := permittee_share_cents exactly", "permittee_outstanding_balance recomputed for every billed permittee"]

  # ------------------------------------------------------- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock defaults to exactly 2026-08-01T00:00:00Z at server start and MUST NOT fall back to wall-clock time; it only moves forward via this endpoint. Advancing the clock re-evaluates bill delinquency, closure-order expiry and permit term expiry."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: "null"
    side_effects: ["every ISSUED GrazingBill whose due_date < the new clock date -> DELINQUENT; its permittee_status -> DEBT_FLAGGED and the related permit account_status -> DELINQUENT (permit_status is untouched — the two dimensions move independently)", "every ACTIVE ClosureOrder whose effective_end_date < the new clock date -> EXPIRED, which re-runs emergency_reduction_reallocation", "every ISSUED GrazingPermit whose term_end_date < the new clock date -> EXPIRED", "Allotment.current_grazing_year := calendar year of the new clock"]

# =============================================================================
# §1.6 Error Code Catalog
#      The *_NOT_FOUND family (validation priorities 5-6) and the *_STATE_INVALID
#      family (priority 8) are the mechanical per-entity instances of two rules;
#      every remaining code is a distinct domain rule.
# =============================================================================

errors:
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, unknown enum member, negative quantity, percentage outside [0,1], score outside [0,100], malformed date/instant, or cost-share percentages that do not sum to 1.0"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "End date precedes (or, for half-open grazing windows, equals) the start date"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-ID absent or unknown, acting role not listed for the endpoint, or a Permittee reaching another permittee's rows"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewing, deciding or adjudicating user is the same person who authored or decided the document under review"
  - id: ERR_ALLOTMENT_NOT_FOUND
    http: 404
    condition: "No Allotment with the given id"
  - id: ERR_PASTURE_NOT_FOUND
    http: 404
    condition: "No Pasture with the given id"
  - id: ERR_PERMITTEE_NOT_FOUND
    http: 404
    condition: "No Permittee with the given id"
  - id: ERR_BASE_PROPERTY_NOT_FOUND
    http: 404
    condition: "No BaseProperty with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "No GrazingPermit with the given id"
  - id: ERR_AOI_NOT_FOUND
    http: 404
    condition: "No AnnualOperatingInstruction with the given id"
  - id: ERR_USE_RECORD_NOT_FOUND
    http: 404
    condition: "No PastureUseRecord with the given id"
  - id: ERR_BILL_NOT_FOUND
    http: 404
    condition: "No GrazingBill with the given id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No RangelandHealthAssessment with the given id"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "No PermitDecision with the given id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "No AppealCase with the given id"
  - id: ERR_CLOSURE_ORDER_NOT_FOUND
    http: 404
    condition: "No ClosureOrder with the given id"
  - id: ERR_TRESPASS_NOT_FOUND
    http: 404
    condition: "No TrespassIncident with the given id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No RangeImprovementProject with the given id"
  - id: ERR_STALE_ALLOTMENT_VERSION
    http: 412
    condition: "expected_allotment_version on POST /permit-decisions does not match the Allotment's current version"
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "The permit is not in a permit_status from which the requested operation is declared (e.g. issuing a permit that is not PENDING_REVIEW, drafting an AOI against a permit that is not ISSUED, renewing a SUSPENDED permit)"
  - id: ERR_AOI_STATE_INVALID
    http: 409
    condition: "The AOI is not in an aoi_status from which the requested operation is declared (e.g. adding a use record to an ISSUED AOI, issuing twice, accepting a use report on a DRAFT AOI, voiding a CLOSED AOI)"
  - id: ERR_USE_RECORD_STATE_INVALID
    http: 409
    condition: "Reporting actual use on a record that is already ACTUAL_REPORTED or ACCEPTED"
  - id: ERR_BILL_STATE_INVALID
    http: 409
    condition: "Paying or voiding a bill that is PAID or VOIDED, or voiding a bill with amount_paid_cents > 0"
  - id: ERR_ASSESSMENT_STATE_INVALID
    http: 409
    condition: "Submitting an assessment that is not DRAFT, or reviewing one that is not FIELD_REVIEW"
  - id: ERR_DECISION_STATE_INVALID
    http: 409
    condition: "Completing environmental review on a decision that is not DRAFT, finalizing one that is not PROPOSED, making effective one that is not FINAL, or appealing one that is neither FINAL nor EFFECTIVE"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "Docketing an appeal that is not FILED, or deciding one that is not UNDER_REVIEW"
  - id: ERR_CLOSURE_ORDER_STATE_INVALID
    http: 409
    condition: "Lifting a closure order that is not ACTIVE"
  - id: ERR_TRESPASS_STATE_INVALID
    http: 409
    condition: "Billing a trespass incident that is not DETECTED"
  - id: ERR_PROJECT_STATE_INVALID
    http: 409
    condition: "Approving a project that is not PROPOSED, or allocating cost share on a project that is not APPROVED"
  - id: ERR_ALLOTMENT_CLOSED
    http: 409
    condition: "The governing allotment is CLOSED, so no permit issuance/renewal/transfer, AOI creation/issuance or use-record scheduling is allowed on it"
  - id: ERR_HEALTH_STANDARDS_NOT_MET
    http: 409
    condition: "The allotment's health_determination is NOT_MEETING and no EFFECTIVE STOCKING_ADJUSTMENT decision exists for it"
  - id: ERR_ENVIRONMENTAL_REVIEW_INCOMPLETE
    http: 409
    condition: "Finalizing a decision whose nepa_status is PENDING, whose nepa_findings_summary is empty, or whose EA/EIS rationale is shorter than 20 characters"
  - id: ERR_DECISION_STAYED
    http: 409
    condition: "The decision is STAYED by a granted appeal stay, so it cannot be made effective and no further decision of the same type may be authored on the allotment"
  - id: ERR_BASE_PROPERTY_NOT_OWNED
    http: 422
    condition: "The named base property belongs to a different permittee than the one who will hold the permit"
  - id: ERR_PASTURE_NOT_IN_ALLOTMENT
    http: 422
    condition: "The named pasture belongs to a different allotment than the AOI's permit"
  - id: ERR_PREDECESSOR_PERMIT_INVALID
    http: 422
    condition: "The permit being renewed or transferred is not ISSUED, already has a successor, or the successor term does not follow the predecessor's term"
  - id: ERR_INSUFFICIENT_QUALIFIED_AUMS
    http: 422
    condition: "requested_aums exceeds the qualified_aums of the named base property"
  - id: ERR_DUPLICATE_AOI_FOR_YEAR
    http: 409
    condition: "A non-VOIDED AOI already exists for this permit and grazing year"
  - id: ERR_DUPLICATE_ASSESSMENT_FOR_YEAR
    http: 409
    condition: "A FINALIZED assessment already exists for this allotment and assessment year, or another one is already in DRAFT/FIELD_REVIEW"
  - id: ERR_PASTURE_SEQUENCE_CONFLICT
    http: 409
    condition: "sequence_order duplicates an existing pasture on the allotment, or leaves a gap in the rotation sequence"
  - id: ERR_ROTATION_REQUIREMENT_NOT_MET
    http: 422
    condition: "The AOI schedules fewer distinct pastures than the allotment's required_pasture_rotation_count, or schedules a pasture flagged rest_required"
  - id: ERR_NONUSE_LIMIT_EXCEEDED
    http: 409
    condition: "The permit has reached MAX_CONSECUTIVE_NONUSE_YEARS (3) consecutive permittee-elected non-use years, so preference has lapsed and renewal is barred"
  - id: ERR_APPEAL_REMAND_LIMIT_EXCEEDED
    http: 409
    condition: "A third REMANDED outcome on an appeal that has already been remanded MAX_APPEAL_REMANDS (2) times"
  - id: ERR_ASSESSMENT_REMAND_LIMIT_EXCEEDED
    http: 409
    condition: "A third REMAND review outcome on an assessment already remanded MAX_ASSESSMENT_REMANDS (2) times"
  - id: ERR_ACTUAL_USE_INCOMPLETE
    http: 409
    condition: "The AOI has no use records, or at least one is still in record_status SCHEDULED, when the use report is accepted"
  - id: ERR_SEASON_OF_USE_VIOLATION
    http: 422
    condition: "A planned or actual grazing window falls outside the AOI season, or the AOI season falls outside the allotment's recurring season of use"
  - id: ERR_CLOSURE_ORDER_OVERLAP
    http: 409
    condition: "The new closure order overlaps, or begins within CLOSURE_BUFFER_DAYS (7) days of the end of, an ACTIVE order on the same allotment"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "The requested logical clock value is not strictly after the current one"
  - id: ERR_OUTSTANDING_BALANCE
    http: 402
    condition: "The permittee who would hold the permit has outstanding_balance_cents > 0 at permit issuance, renewal, transfer or AOI creation"
  - id: ERR_PASTURE_CAPACITY_EXCEEDED
    http: 422
    condition: "The aggregate planned AUMs of the use records whose half-open windows intersect on one pasture exceed that pasture's pasture_aum_capacity"
  - id: ERR_ALLOTMENT_CAPACITY_EXCEEDED
    http: 422
    condition: "authorized_aums exceeds the allotment's open_aums at AOI creation or at AOI issuance"
  - id: ERR_NONUSE_EXCEEDS_AUTHORIZED
    http: 422
    condition: "Requested nonuse_aums is below 1 or above the AOI's authorized_aums, or a DROUGHT/WILDFIRE reason is claimed with no matching ACTIVE closure order"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "A payment exceeds the bill's remaining balance"

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
#      Authorship, decision and adjudication are three separate hands; the
#      same X-User-ID may never occupy two of them on the same document.
# =============================================================================

roles:
  - name: Permittee
    description: "The rancher or operator holding (or applying for) grazing preference. Sees and acts only on their own permits, AOIs, use records, bills and appeals."
    identity: "entity_backed:Permittee"
    exclusive_operations:
      - "POST /permit-decisions/{decisionId}/appeals — only the affected permittee may appeal, and appellant_permittee_id must equal the acting X-User-ID"
    shared_operations:
      - "POST /pasture-use-records/{useRecordId}/report-actual-use (shared with RangeSpecialist)"
      - "POST /grazing-bills/{billId}/payments (shared with AuthorizedOfficer)"
      - "all GET endpoints, scoped to the permittee's own rows"
  - name: RangeSpecialist
    description: "Field/resource staff who author the technical record: assessments, decision documents, AOIs, use-record schedules, trespass detections and project proposals. Authors but never approves."
    identity: opaque
    exclusive_operations:
      - "POST /rangeland-health-assessments"
      - "POST /rangeland-health-assessments/{assessmentId}/submit"
      - "POST /permit-decisions"
      - "POST /permit-decisions/{decisionId}/complete-environmental-review"
      - "POST /trespass-incidents"
      - "POST /range-improvement-projects"
    shared_operations:
      - "POST /annual-operating-instructions (shared with AuthorizedOfficer)"
      - "POST /annual-operating-instructions/{aoiId}/use-records (shared with AuthorizedOfficer)"
      - "POST /pasture-use-records/{useRecordId}/report-actual-use (shared with Permittee)"
      - "all GET endpoints"
  - name: AuthorizedOfficer
    description: "The deciding official who signs decisions, issues permits and AOIs, bills, closes and reduces. Never authors the assessment or decision it signs (§1.4 priority 4)."
    identity: opaque
    exclusive_operations:
      - "POST /allotments and POST /allotments/{allotmentId}/pastures"
      - "POST /permittees and POST /permittees/{permitteeId}/base-properties"
      - "POST /grazing-permits, .../issue, .../renew, .../transfer"
      - "POST /annual-operating-instructions/{aoiId}/issue, .../non-use, .../accept-use-report, .../void"
      - "POST /grazing-bills/{billId}/void"
      - "POST /rangeland-health-assessments/{assessmentId}/review"
      - "POST /permit-decisions/{decisionId}/finalize and .../make-effective"
      - "POST /closure-orders and POST /closure-orders/{closureOrderId}/lift"
      - "POST /trespass-incidents/{incidentId}/bill"
      - "POST /range-improvement-projects/{projectId}/approve and .../allocate-cost-share"
    shared_operations:
      - "POST /annual-operating-instructions (shared with RangeSpecialist)"
      - "POST /annual-operating-instructions/{aoiId}/use-records (shared with RangeSpecialist)"
      - "POST /grazing-bills/{billId}/payments (shared with Permittee)"
      - "all GET endpoints"
  - name: AppealsAdjudicator
    description: "Independent administrative judge who dockets and decides appeals. May not have authored or decided the appealed decision."
    identity: opaque
    exclusive_operations:
      - "POST /appeal-cases/{appealId}/docket"
      - "POST /appeal-cases/{appealId}/decide"
    shared_operations:
      - "all GET endpoints"
  - name: SystemAdmin
    description: "Operational identity for the logical clock only. Holds no business authority."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
