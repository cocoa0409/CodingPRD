          trigger:
            - { call: "POST /lineup-assignments/${la_id}/confirm", payload: {}, as: CommitteeAdmin }
            - { call: "GET /staging-areas/${sa_id}", payload: {}, as: CommitteeAdmin, captures: { slots_mid: $.data.reserved_slots } }
            - { call: "POST /lineup-assignments/${la_id}/pull", payload: {}, as: CommitteeAdmin, captures: { la_after: $.data.status } }
            - { call: "GET /staging-areas/${sa_id}", payload: {}, as: CommitteeAdmin, captures: { slots_end: $.data.reserved_slots } }
          assert:
            - "reserved_slots after confirm == 1 (forward action adds exactly one)"
            - "reserved_slots after the compensating pull == 0 — identical to the pre-confirm baseline"
            - "invariant holds: reserved_slots == count of assignments with status in {CONFIRMED, CHECKED_IN} at every step"
            - "LineupAssignment.status == PULLED (terminal)"

      - name: script_item_add_then_cancel_restores_sponsor_seconds
        grounds:
          - state_machines.AnnouncerScriptItem.DRAFT_to_APPROVED
          - state_machines.AnnouncerScriptItem.APPROVED_to_CANCELLED
          - entities.SponsorPackage.fields.allocated_seconds
          - entities.ParadeEvent.fields.sponsor_seconds_allocated
        distinguishing_aspect: |
          Different conserved quantity TYPE (seconds, not counts): allocated_seconds
          is pinned as the sum of duration_seconds over APPROVED/LOCKED SPONSOR_READ
          items; an approve (+60) followed by its compensating cancel (-60) must
          restore both the sponsor-level and parade-level totals exactly.
        test_recipe:
          setup:
            - "One parade; one ACTIVE GOLD sponsor; two APPROVED SPONSOR_READ items of 1.0 minute each (baseline allocated_seconds == 120)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Seconds Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/sponsors", payload: { sponsor_name: "Steady Gold", tier: "GOLD", contribution_cents: 900000 }, as: CommitteeAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/activate", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 1, duration_minutes: 1.0, sponsor_id: "${sp_id}" }, as: CommitteeAdmin, captures: { i1: $.data.id } }
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 2, duration_minutes: 1.0, sponsor_id: "${sp_id}" }, as: CommitteeAdmin, captures: { i2: $.data.id } }
            - { call: "POST /script-items/${i1}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "POST /script-items/${i2}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "GET /sponsors/${sp_id}", payload: {}, as: CommitteeAdmin, captures: { base_secs: $.data.allocated_seconds } }
          trigger:
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 3, duration_minutes: 1.0, sponsor_id: "${sp_id}" }, as: CommitteeAdmin, captures: { i3: $.data.id } }
            - { call: "POST /script-items/${i3}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "GET /sponsors/${sp_id}", payload: {}, as: CommitteeAdmin, captures: { mid_secs: $.data.allocated_seconds } }
            - { call: "POST /script-items/${i3}/cancel", payload: {}, as: CommitteeAdmin }
            - { call: "GET /sponsors/${sp_id}", payload: {}, as: CommitteeAdmin, captures: { end_secs: $.data.allocated_seconds } }
            - { call: "GET /parades/${p_id}", payload: {}, as: CommitteeAdmin, captures: { parade_secs: $.data.sponsor_seconds_allocated } }
          assert:
            - "baseline allocated_seconds == 120"
            - "after the third item is approved allocated_seconds == 180"
            - "after the compensating cancel allocated_seconds == 120 — exactly the baseline, no drift"
            - "ParadeEvent.sponsor_seconds_allocated == 120 and item ${i3}.status == CANCELLED"
