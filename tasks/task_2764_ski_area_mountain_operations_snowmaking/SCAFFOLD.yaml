  - method: GET
    path: "/mountain-ops/pump-houses/{id}"
    description: "Read a pump house with its committed peak flow"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: PumpHouse
    side_effects: []

  - method: GET
    path: "/mountain-ops/pump-houses"
    description: "List pump houses of a season"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: PumpHouse[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/pump-houses/{id}/status"
    description: "Take a pump house offline for maintenance or return it to service"
    roles: [SnowmakingSupervisor]
    code: 200
    input: [status]
    output: PumpHouse
    side_effects:
