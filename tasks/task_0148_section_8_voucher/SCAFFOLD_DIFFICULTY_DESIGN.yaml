scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ttp_initial_vs_recertification_diverge_on_tenancy
        grounds:
          - calculations.calc_ttp
          - state_machines.Tenancy.PENDING_RENT_REASONABLE_to_ACTIVE
          - state_machines.AnnualReview.SUBMITTED_to_APPROVED
          - entities.Tenancy.fields.initial_total_tenant_payment_cents
          - entities.Tenancy.fields.current_total_tenant_payment_cents
        distinguishing_aspect: |
          The dual-variant lives on entity domain TENANCY: identical Tenancy.gross_rent_cents
          and identical Applicant gross income yield different TTP values when re-run via the
          recertification variant because the recertification recomputes adjusted_annual_income
          for the new household composition declared on AnnualReview (different from Applicant
          snapshot), so Tenancy.initial_total_tenant_payment_cents != Tenancy.current_total_tenant_payment_cents
          after APPROVED.
        test_recipe:
          setup:
            - "Create Applicant A: gross=3000000 cents/yr, household_size=3, dependents=1, no elderly/medical/childcare. calc_adjusted_income (initial) → 2952000 cents."
            - "Issue Voucher V to A in ZONE_A with bedroom_size=2."
            - "Create PaymentStandard (ZONE_A, br=2, standard=120000, mobility=132000)."
            - "Create Unit U in ZONE_A bedroom_count=2 asking_rent=125000 utilities=10000 → gross_rent=135000."
            - "Create Tenancy T on V+U, pass INITIAL inspection, attach RentReasonablenessRecord with comparables [120000,130000,140000,150000] (median=130000, threshold=143000, 135000<=143000 reasonable)."
            - "Finalize T → ACTIVE: initial_ttp = max(ceil(floor(2952000/12)*0.30), ceil(floor(3000000/12)*0.10), 0, 5000) = max(73800, 25000, 0, 5000) = 73800 cents."
            - "Advance clock to lease_start + 365 days. AnnualReview AR auto-created with status=DUE."
          trigger:
            - "POST /annual-reviews/{AR.id}/submit with declared_gross_annual_income_cents=3000000, declared_household_size=4."
            - "POST /annual-reviews/{AR.id}/approve."
          assert:
            - "Tenancy.initial_total_tenant_payment_cents == 73800"
            - "AR.new_adjusted_income_cents == 2856000  # 3000000 - 480*(4-1) = 3000000 - 144000 (recert dependents = declared_household_size-1 = 3)"
            - "AR.new_total_tenant_payment_cents == 71400  # ceil(floor(2856000/12)*0.30) = ceil(238000*0.30) = ceil(71400) = 71400"
            - "Tenancy.current_total_tenant_payment_cents == 71400  # different cent value from the 73800 initial"

      - name: adjusted_income_initial_vs_recertification_diverge_on_applicant_household
        grounds:
          - calculations.calc_adjusted_income
          - entities.Applicant.fields.adjusted_annual_income_cents
          - entities.AnnualReview.fields.new_adjusted_income_cents
          - state_machines.AnnualReview.DUE_to_SUBMITTED
        distinguishing_aspect: |
          The dual-variant lives on a DIFFERENT entity domain (APPLICANT income recomputation,
          not Tenancy payment). The recertification variant uses AnnualReview.declared_household_size
          and writes to AnnualReview.new_adjusted_income_cents WITHOUT mutating
          Applicant.adjusted_annual_income_cents — the same input gross_annual_income with a
          different declared dependents produces a different deduction total, so
          Applicant.adjusted_annual_income_cents (the frozen snapshot) and
          AnnualReview.new_adjusted_income_cents diverge.
        test_recipe:
          setup:
            - "Create Applicant A: gross=4800000 cents, household_size=2, dependents=0, elderly_or_disabled_head=true, medical_expense=200000, childcare=0."
            - "Initial calc: medical_threshold=floor(4800000*0.03)=144000; medical_deduction=max(0, 200000-144000)=56000; dep_allowance=0; elderly_allowance=40000; total=96000; adjusted=4800000-96000=4704000."
            - "Issue Voucher V to A. Find a unit, create Tenancy reaching ACTIVE. Advance to AnnualReview DUE."
          trigger:
            - "POST /annual-reviews/{AR.id}/submit with declared_gross_annual_income_cents=4800000, declared_household_size=3."
          assert:
            - "Applicant.adjusted_annual_income_cents == 4704000  # unchanged snapshot"
            - "AR.new_adjusted_income_cents == 4608000  # = 4800000 - (480*2 dependents + 40000 elderly + 56000 medical) = 4800000 - (96000+96000) = 4608000"
            - "AR.new_adjusted_income_cents != Applicant.adjusted_annual_income_cents"

      - name: hap_standard_vs_special_mobility_on_tenancy
        grounds:
          - calculations.calc_hap
          - entities.Voucher.fields.special_mobility_flag
          - entities.Tenancy.fields.applicable_payment_standard_cents
          - entities.PaymentStandard.fields.mobility_amount_cents
        distinguishing_aspect: |
          Same Tenancy inputs (gross_rent_cents, TTP, PaymentStandard cell) but different
          variant of calc_hap selected by Voucher.special_mobility_flag yield different cent
          values for Tenancy.initial_hap_cents when gross_rent > standard_amount_cents.
        test_recipe:
          setup:
            - "PaymentStandard (ZONE_A, br=2, standard=120000, mobility=132000)."
            - "Applicant A1, Voucher V1 special_mobility_flag=false, bedroom_size=2, ZONE_A."
            - "Applicant A2 (same income as A1), Voucher V2 special_mobility_flag=true, bedroom_size=2, ZONE_A."
            - "Unit U in ZONE_A bedroom_count=2 asking_rent=125000 utilities=10000 → gross_rent=135000."
            - "(Use two physically distinct units U1 and U2 with identical attributes to avoid overlap.)"
            - "Both applicants have monthly_adjusted yielding TTP=73800 cents (use setup from instance 1)."
          trigger:
            - "Finalize T1 (standard) → ACTIVE."
            - "Finalize T2 (special_mobility) → ACTIVE."
          assert:
            - "T1.initial_hap_cents == 46200  # min(120000, 135000) - 73800"
            - "T2.initial_hap_cents == 58200  # min(132000, 135000) - 73800"
            - "T1.initial_hap_cents != T2.initial_hap_cents"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: adjusted_income_mode_a_multi_input_nonlinear
        grounds:
          - calculations.calc_adjusted_income
          - entities.Applicant.fields.gross_annual_income_cents
          - entities.Applicant.fields.dependents_count
          - entities.Applicant.fields.elderly_or_disabled_head
          - entities.Applicant.fields.medical_expense_annual_cents
          - entities.Applicant.fields.childcare_expense_annual_cents
        distinguishing_aspect: |
          MODE (a): formula has 5 inputs (gross, dependents, elderly_or_disabled_head,
          medical, childcare) with non-linear interaction — medical deduction is conditional
          on elderly_or_disabled_head AND uses a 3%-of-gross floor, so the same medical
          expense produces 0 deduction for a non-elderly household and a positive deduction
          for an elderly household above the floor. Branching-on-state + threshold-subtraction
          inside a multi-input aggregation.
        test_recipe:
          setup:
            - "Applicant A1: gross=4800000, elderly=false, medical=200000, dependents=0, childcare=0."
            - "Applicant A2: gross=4800000, elderly=true, medical=200000, dependents=0, childcare=0."
            - "Applicant A3: gross=4800000, elderly=true, medical=100000, dependents=0, childcare=0  (medical < 3% floor of 144000)."
          trigger:
            - "POST /applicants for A1, A2, A3."
          assert:
            - "A1.adjusted_annual_income_cents == 4800000  # no deduction: non-elderly medical ignored"
            - "A2.adjusted_annual_income_cents == 4704000  # 4800000 - (40000 elderly + max(0, 200000-144000)=56000) = 4704000"
            - "A3.adjusted_annual_income_cents == 4760000  # 4800000 - (40000 elderly + max(0, 100000-144000)=0) = 4760000"

      - name: hap_ledger_round_then_sum_mode_b
        grounds:
          - calculations.calc_hap_monthly_ledger_round
          - entities.HAPPayment.fields.amount_cents
          - endpoints["POST /_sweep/monthly-hap"]
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The scaffold pins
          "round per-tenancy-row, then sum" — each HAPPayment.amount_cents is an integer
          cent equal to Tenancy.current_hap_cents at sweep time, and the PHA monthly total
          is sum(amount_cents)/100 with floor at the REPORTING layer (not per-row conversion
          to dollars then summed). The alternative "convert each row to dollars (truncate),
          then sum" would lose sub-dollar drift on every row and produce a different total.
        test_recipe:
          setup:
            - "Create 3 Tenancies T_a, T_b, T_c with current_hap_cents = 46233, 58217, 73801 respectively (all ACTIVE, same PHA)."
            - "Advance clock to first day of new calendar month YYYY-MM."
          trigger:
            - "POST /_sweep/monthly-hap with pay_period_month=YYYY-MM."
            - "GET /hap-payments?pay_period_month=YYYY-MM."
          assert:
            - "len(created_payment_ids) == 3"
            - "HAPPayment for T_a has amount_cents == 46233  # not rounded down to dollars"
            - "HAPPayment for T_b has amount_cents == 58217"
            - "HAPPayment for T_c has amount_cents == 73801"
            - "sum(amount_cents over three rows) == 178251  # cents, NOT 178200 which would result from per-row floor-to-dollar then sum"

      - name: rent_burden_circular_evaluation_order_mode_c
        grounds:
          - calculations.calc_rent_burden
          - calculations.calc_ttp
          - calculations.calc_hap
          - entities.Tenancy.fields.initial_hap_cents
          - entities.Tenancy.fields.rent_burden_at_lease_up_pct
          - state_machines.Tenancy.PENDING_RENT_REASONABLE_to_ACTIVE
        distinguishing_aspect: |
          MODE (c): evaluation order is explicitly pinned. calc_rent_burden depends on
          initial_hap_cents; initial_hap_cents depends on TTP; TTP depends on
          adjusted_annual_income (a snapshot, not recomputed). The order is:
          (1) calc_adjusted_income → (2) calc_ttp → (3) calc_hap → (4) calc_rent_burden.
          Reversing the order — e.g., computing rent_burden against gross_rent before HAP —
          would yield a different burden value and a different pass/fail decision at the
          0.40 inclusive boundary.
        test_recipe:
          setup:
            - "Applicant A: gross=1200000 cents/yr, household_size=1, dependents=0, no elderly/medical/childcare. adjusted = 1200000 (no deductions)."
            - "Voucher V (ZONE_A, br=0) for A. PaymentStandard(ZONE_A, 0br, standard=60000)."
            - "Unit U (ZONE_A, 0br, asking_rent=100000, utilities=0) → gross_rent=100000."
            - "Tenancy T: pass INITIAL inspection; comparables [90000,100000,110000] median=100000 threshold=floor(100000*1.10)=110000, so 100000<=110000 reasonable."
            - "TTP = max(ceil(100000*0.30), ceil(100000*0.10), 0, 5000) = max(30000, 10000, 0, 5000) = 30000."
            - "HAP = min(60000, 100000) - 30000 = 30000."
            - "tenant_share = 100000 - 30000 = 70000. monthly_adjusted = floor(1200000/12) = 100000. burden = 70000/100000 = 0.70 — FAILS."
          trigger:
            - "POST /tenancies/{T.id}/finalize."
          assert:
            - "Response error_id == 'ERR_RENT_BURDEN_EXCEEDED'"
            - "Response http_status == 422"
            - "Tenancy.status remains PENDING_RENT_REASONABLE (no transition to ACTIVE because gate failed)"
            - "Tenancy.initial_hap_cents was computed (transient) before the burden gate fired — the order is calc → gate"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tenancy_branching_active_abated_cycle
        grounds:
          - state_machines.Tenancy.ACTIVE_to_ABATED
          - state_machines.Tenancy.ABATED_to_ACTIVE
          - state_machines.Tenancy.ABATED_to_TERMINATED
          - state_machines.Inspection.SCHEDULED_to_COMPLETED_FAIL_CURABLE
          - state_machines.Inspection.COMPLETED_FAIL_CURABLE_to_CURED
        distinguishing_aspect: |
          Tenancy state machine has a CYCLE between ACTIVE and ABATED (Inspection FAIL →
          ABATED; REINSPECTION CURED → ACTIVE), plus a BRANCH where ABATED can also exit to
          TERMINATED if cure deadline elapses. Two divergent post-conditions from the same
          ABATED state. Not a linear pipeline.
        test_recipe:
          setup:
            - "An ACTIVE Tenancy T on Unit U with Inspector I."
            - "Schedule ANNUAL Inspection I1; complete I1 with outcome=FAIL_NONLIFETHREATENING, defects=['D1']. T → ABATED."
            - "Schedule REINSPECTION I2 on T."
          trigger:
            - "POST /inspections/{I2.id}/complete with outcome=CURED, defects=[]."
          assert:
            - "After ABATED phase: T.status == 'ABATED' and HAPPayment for the next month has amount_cents == 0 and status == 'ABATED_SUSPENDED'"
            - "After CURED: T.status == 'ACTIVE' and Unit.last_inspection_passed_at == I2.completed_at"
            - "The state path ACTIVE → ABATED → ACTIVE is observable (T.status transitions back and forth)"

      - name: annual_review_cyclic_submitted_deficient
        grounds:
          - state_machines.AnnualReview.SUBMITTED_to_DEFICIENT
          - state_machines.AnnualReview.DEFICIENT_to_SUBMITTED
          - state_machines.AnnualReview.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          A DIFFERENT entity (AnnualReview, not Tenancy) carries a non-linear shape:
          SUBMITTED → DEFICIENT → SUBMITTED is a true cycle (resubmit re-enters SUBMITTED),
          with a side branch SUBMITTED → APPROVED that exits the cycle.
        test_recipe:
          setup:
            - "AnnualReview AR for an ACTIVE Tenancy, status=DUE within window."
          trigger:
            - "POST /annual-reviews/{AR.id}/submit (gross=3000000, household=3)."
            - "POST /annual-reviews/{AR.id}/mark-deficient with deficiency_codes=['missing_paystubs']."
            - "POST /annual-reviews/{AR.id}/resubmit (gross=3000000, household=3)."
            - "POST /annual-reviews/{AR.id}/approve."
          assert:
            - "Trace of AR.status values across requests: ['DUE', 'SUBMITTED', 'DEFICIENT', 'SUBMITTED', 'APPROVED']"
            - "AR.deficiency_codes == [] after resubmit (cleared)"
            - "Tenancy.current_total_tenant_payment_cents updated to AR.new_total_tenant_payment_cents on APPROVED"

      - name: voucher_branching_searching_to_three_outcomes
        grounds:
          - state_machines.Voucher.SEARCHING_to_LEASED
          - state_machines.Voucher.SEARCHING_to_EXPIRED
          - state_machines.Voucher.LEASED_to_SEARCHING_REISSUED
          - state_machines.Voucher.LEASED_to_TERMINATED
          - state_machines.Voucher.LEASED_to_PORTED_OUT
        distinguishing_aspect: |
          A THIRD distinct entity (Voucher) has a true branching shape: from SEARCHING the
          voucher can either advance to LEASED (forward) or EXPIRED (terminal); from LEASED
          it can fork three ways — SEARCHING_REISSUED (revert with re-search window),
          TERMINATED (forward terminal), or PORTED_OUT (cross-PHA terminal). Each branch
          has a divergent side-effect set (re-search vs full termination vs PHA transfer).
        test_recipe:
          setup:
            - "Voucher V in SEARCHING. Tenancy T reaches ACTIVE → V becomes LEASED."
          trigger:
            - "POST /tenancies/{T.id}/move-out with move_out_date=lease_start+90d."
          assert:
            - "V.status transitions LEASED → SEARCHING_REISSUED"
            - "V.search_deadline == move_out_date + 60 days"
            - "T.status == TERMINATED with termination_reason == 'TENANT_MOVE_OUT'"
            - "(Contrast: had we instead called /annual-reviews/{id}/deny, V would have gone LEASED → TERMINATED with no re-search window — different branch.)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cure_deadline_sweep_chain_depth_4
        grounds:
          - endpoints["POST /_sweep/abatements"]
          - state_machines.Inspection.COMPLETED_FAIL_CURABLE_to_EXPIRED_UNCURED
          - state_machines.Tenancy.ABATED_to_TERMINATED
          - state_machines.Voucher.LEASED_to_TERMINATED
          - calculations.calc_hap_monthly_ledger_round
        distinguishing_aspect: |
          DEPTH ≥ 3 chain from a distinct trigger (the abatement sweep): each link is caused
          by the previous link, not by the original sweep call. (1) sweep → Inspection
          EXPIRED_UNCURED; (2) Inspection.status change → Tenancy ABATED → TERMINATED with
          reason=HQS_UNCURED; (3) Tenancy.status change → Voucher LEASED → TERMINATED;
          (4) Voucher.status change → all future-month HAPPayment rows suppressed.
          Each hop is the consequence of the previous hop's state mutation, not a fan-out
          of the original sweep call.
        test_recipe:
          setup:
            - "ACTIVE Tenancy T (Voucher V LEASED, Unit U OCCUPIED_ACTIVE)."
            - "Schedule ANNUAL Inspection I1; complete with FAIL_NONLIFETHREATENING, defects=['D1']. T → ABATED. cure_deadline = I1.completed_at + 30d."
            - "Advance clock to I1.cure_deadline + 1 minute. Do NOT schedule a REINSPECTION."
          trigger:
            - "POST /_sweep/abatements."
            - "POST /_sweep/monthly-hap with pay_period_month = next month after now()."
          assert:
            - "I1.status == 'EXPIRED_UNCURED'"
            - "T.status == 'TERMINATED' with termination_reason == 'HQS_UNCURED'"
            - "V.status == 'TERMINATED'"
            - "No HAPPayment row was created for T in the swept month (future-month rows suppressed)"

      - name: annual_review_deny_chain_depth_3
        grounds:
          - state_machines.AnnualReview.SUBMITTED_to_DENIED
          - state_machines.Tenancy.ACTIVE_to_TERMINATED
          - state_machines.Voucher.LEASED_to_TERMINATED
          - endpoints["POST /annual-reviews/{id}/deny"]
        distinguishing_aspect: |
          DEPTH ≥ 2 chain originating from a DIFFERENT trigger (CaseWorker deny on AnnualReview,
          not a sweep). (1) deny endpoint → AR SUBMITTED → DENIED; (2) AR status change →
          Tenancy ACTIVE → TERMINATED (reason=ANNUAL_REVIEW_DENIED); (3) Tenancy status
          change → Voucher LEASED → TERMINATED. Different propagation pattern from the
          abatement-sweep chain (no time pressure, single endpoint call).
        test_recipe:
          setup:
            - "ACTIVE Tenancy T, Voucher V LEASED, AnnualReview AR in SUBMITTED state."
          trigger:
            - "POST /annual-reviews/{AR.id}/deny."
          assert:
            - "AR.status == 'DENIED'"
            - "T.status == 'TERMINATED' with termination_reason == 'ANNUAL_REVIEW_DENIED'"
            - "V.status == 'TERMINATED'"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_finalize_expired_and_mobility_violation
        grounds:
          - validations[priority=6]      # ERR_VOUCHER_EXPIRED (state)
          - validations[priority=9]      # ERR_MOBILITY_ZONE_VIOLATION (business_safety)
        distinguishing_aspect: |
          Two checks both fail on the same finalize call: voucher is EXPIRED (state category,
          priority 6) AND the unit is in ZONE_B for a special_mobility voucher
          (business_safety, priority 9). Per validation order, state precedes business_safety,
          so the response MUST be ERR_VOUCHER_EXPIRED. Error-category pair: state vs business_safety.
        test_recipe:
          setup:
            - "Voucher V special_mobility_flag=true, ZONE_A, bedroom_size=1."
            - "Unit U in ZONE_B bedroom_count=1 asking_rent=80000 utilities=0."
            - "Create Tenancy T on V+U BEFORE search_deadline, pass INITIAL inspection, attach reasonable comparables."
            - "Advance clock past V.search_deadline."
          trigger:
            - "POST /tenancies/{T.id}/finalize."
          assert:
            - "Response error_id == 'ERR_VOUCHER_EXPIRED'  # state wins over business_safety"
            - "Response http_status == 409"

      - name: business_safety_vs_business_fiscal_outcome_mismatch_and_burden
        grounds:
          - validations[priority=10]     # ERR_INSPECTION_OUTCOME_MISMATCH (business_safety)
          - validations[priority=16]     # ERR_RENT_BURDEN_EXCEEDED (business_fiscal)
        distinguishing_aspect: |
          Two checks fail on a complete-inspection call where the inspector mis-files PASS
          with non-empty defects AND the parent Tenancy would also fail the rent-burden gate
          if it advanced. business_safety (priority 10) precedes business_fiscal (priority 16);
          the response MUST be ERR_INSPECTION_OUTCOME_MISMATCH. Error-category pair:
          business_safety vs business_fiscal — DIFFERENT pair from instance 1.
        test_recipe:
          setup:
            - "PENDING_INSPECTION Tenancy T whose finalize-time rent_burden would be > 0.40 (use the burden_exceeded setup from rule 2 mode_c)."
            - "Schedule INITIAL Inspection I1."
          trigger:
            - "POST /inspections/{I1.id}/complete with outcome=PASS, defects=['D1']."
          assert:
            - "Response error_id == 'ERR_INSPECTION_OUTCOME_MISMATCH'"
            - "Response http_status == 422"
            - "T.status remains PENDING_INSPECTION (no transition triggered)"

      - name: business_referential_vs_business_temporal_inspector_scope_and_too_soon
        grounds:
          - validations[priority=8]      # ERR_INSPECTOR_OUT_OF_SCOPE (business_referential)
          - validations[priority=15]     # ERR_INSPECTION_TOO_SOON (business_temporal)
        distinguishing_aspect: |
          Two checks fail when scheduling an ANNUAL inspection: the inspector is from
          PHA_002 but the Tenancy is administered by PHA_001 (business_referential, priority 8)
          AND the unit had a passing inspection only 100 days ago (business_temporal,
          priority 15). business_referential precedes business_temporal — response MUST be
          ERR_INSPECTOR_OUT_OF_SCOPE. Error-category pair: business_referential vs
          business_temporal — DIFFERENT pair again.
        test_recipe:
          setup:
            - "PHA_001 hosts ACTIVE Tenancy T on Unit U; U.last_inspection_passed_at = 100 days ago."
            - "Inspector I2 belongs to PHA_002."
          trigger:
            - "POST /inspections with X-User-Role=Inspector, X-User-ID=I2.id, tenancy_id=T.id, inspection_type=ANNUAL, scheduled_for=tomorrow."
          assert:
            - "Response error_id == 'ERR_INSPECTOR_OUT_OF_SCOPE'"
            - "Response http_status == 403"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rent_burden_exactly_40pct_inclusive
        grounds:
          - calculations.calc_rent_burden
          - validations[priority=16]
          - endpoints["POST /tenancies/{id}/finalize"]
        distinguishing_aspect: |
          Numeric threshold metric: rent burden at exactly 0.40 PASSES (inclusive bound).
          0.40 + 1 cent of tenant share FAILS. Reachable via /tenancies/{id}/finalize.
        test_recipe:
          setup:
            - "Applicant A: gross=1200000 cents/yr, adjusted=1200000 (no deductions). monthly_adjusted=100000."
            - "Voucher V (ZONE_A, br=0). PaymentStandard(ZONE_A, 0br, standard=60000, mobility=66000)."
            - "Unit U_pass: ZONE_A, 0br, asking_rent=70000, utilities=0 → gross_rent=70000. TTP=max(ceil(100000*0.30), ceil(100000*0.10), 0, 5000)=30000. HAP=min(60000, 70000)-30000=30000. tenant_share=40000. burden=40000/100000=0.40 → PASS."
            - "Unit U_fail: ZONE_A, 0br, asking_rent=70001, utilities=0 → gross_rent=70001. TTP=30000. HAP=min(60000,70001)-30000=30000. tenant_share=40001. burden=0.40001 → FAIL."
            - "Two distinct Applicants A_pass, A_fail with identical income; two distinct Tenancies T_pass on U_pass, T_fail on U_fail; both pass INITIAL inspection and reasonable comparables."
          trigger:
            - "POST /tenancies/{T_pass.id}/finalize."
            - "POST /tenancies/{T_fail.id}/finalize."
          assert:
            - "T_pass response 200, T_pass.status == 'ACTIVE'"
            - "T_fail response error_id == 'ERR_RENT_BURDEN_EXCEEDED', http_status == 422"

      - name: comparable_rents_length_minimum_three
        grounds:
          - validations[priority=13]
          - calculations.calc_rent_reasonableness
          - endpoints["POST /rent-reasonableness-records"]
        distinguishing_aspect: |
          Empty-collection / minimum-count boundary on a DIFFERENT metric (array length, not
          numeric threshold) and a DIFFERENT endpoint (/rent-reasonableness-records).
          length=2 FAILS (ERR_INSUFFICIENT_COMPARABLES); length=3 PASSES.
        test_recipe:
          setup:
            - "An existing PENDING_RENT_REASONABLE Tenancy T."
          trigger:
            - "POST /rent-reasonableness-records with tenancy_id=T.id, comparable_rents_cents=[100000, 110000]."
            - "POST /rent-reasonableness-records with tenancy_id=T.id, comparable_rents_cents=[100000, 110000, 120000]."
          assert:
            - "First call: error_id == 'ERR_INSUFFICIENT_COMPARABLES', http_status == 422"
            - "Second call: 201 success; recorded median == 110000 (lower of two middles for n=3 odd → middle = 110000), reasonable_threshold == 121000"

      - name: voucher_expiration_clock_boundary
        grounds:
          - validations[priority=6]
          - state_machines.Voucher.SEARCHING_to_EXPIRED
          - endpoints["POST /_clock/advance"]
          - endpoints["POST /tenancies"]
        distinguishing_aspect: |
          Time-instant boundary on a DIFFERENT metric (datetime, not a number) and DIFFERENT
          endpoint (/tenancies create). At exactly search_deadline, voucher is still usable;
          at search_deadline + 1 second, the next /tenancies POST is rejected.
        test_recipe:
          setup:
            - "Voucher V with search_deadline = T0 + 120 days."
            - "Advance clock to T0 + 120 days exactly (== search_deadline)."
          trigger:
            - "POST /tenancies (voucher_id=V.id, ...)  # boundary instant."
            - "Advance clock by +1 second."
            - "POST /tenancies (voucher_id=V.id, ...)  # just past boundary."
          assert:
            - "First POST /tenancies: 201 success (boundary instant is INCLUSIVE — voucher still SEARCHING)"
            - "Second POST /tenancies: error_id == 'ERR_VOUCHER_EXPIRED' or ERR_LEASE_START_AFTER_DEADLINE, http_status == 409 or 422"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: tenancy_create_requires_voucher_searching_pair_tenancy_voucher
        grounds:
          - state_machines.Voucher.SEARCHING_to_LEASED
          - validations[priority=5]
          - endpoints["POST /tenancies"]
        distinguishing_aspect: |
          Tenancy creation depends on Voucher state. Entity pair: TENANCY → VOUCHER.
          Cannot create a Tenancy when Voucher is EXPIRED, LEASED, TERMINATED, or PORTED_OUT —
          only SEARCHING or SEARCHING_REISSUED admit new Tenancies.
        test_recipe:
          setup:
            - "Voucher V1 LEASED (already has an ACTIVE Tenancy)."
            - "Voucher V2 SEARCHING."
            - "Unit U VACANT."
          trigger:
            - "POST /tenancies with voucher_id=V1.id, unit_id=U.id, lease_start=tomorrow."
          assert:
            - "Response error_id == 'ERR_INVALID_STATE', http_status == 409"
            - "Then POST /tenancies with voucher_id=V2.id succeeds (201) — same Unit attempted second time succeeds"

      - name: inspection_complete_requires_inspector_pha_matches_voucher_pair_inspection_voucher
        grounds:
          - validations[priority=8]
          - endpoints["POST /inspections/{id}/complete"]
          - entities.Voucher.fields.administering_pha_id
        distinguishing_aspect: |
          Inspection completion depends on Voucher.administering_pha_id matching the
          Inspector's PHA. Entity pair: INSPECTION → VOUCHER (via Tenancy.voucher_id) —
          DIFFERENT pair from instance 1 (which was Tenancy → Voucher state, not PHA).
        test_recipe:
          setup:
            - "Tenancy T administered by PHA_001 (Voucher V1.administering_pha_id=PHA_001)."
            - "Inspector I2 belongs to PHA_002."
            - "Scheduled INITIAL Inspection Ins1 on T."
          trigger:
            - "POST /inspections/{Ins1.id}/complete with X-User-Role=Inspector, X-User-ID=I2.id, outcome=PASS, defects=[]."
          assert:
            - "Response error_id == 'ERR_INSPECTOR_OUT_OF_SCOPE', http_status == 403"
            - "Ins1.status remains SCHEDULED"

      - name: tenancy_finalize_requires_unit_zone_for_mobility_pair_tenancy_unit
        grounds:
          - validations[priority=9]
          - state_machines.Tenancy.PENDING_RENT_REASONABLE_to_ACTIVE
          - entities.Unit.fields.zone
          - entities.Voucher.fields.special_mobility_flag
        distinguishing_aspect: |
          Tenancy finalize depends on Unit.zone when Voucher.special_mobility_flag=true.
          Entity pair: TENANCY → UNIT (zone attribute) — DIFFERENT pair from the two above
          (which were Tenancy→Voucher and Inspection→Voucher).
        test_recipe:
          setup:
            - "Voucher V special_mobility_flag=true."
            - "Unit U in ZONE_B."
            - "Tenancy T on V+U that has passed inspection and rent-reasonable check."
          trigger:
            - "POST /tenancies/{T.id}/finalize."
          assert:
            - "Response error_id == 'ERR_MOBILITY_ZONE_VIOLATION', http_status == 422"
            - "T.status remains PENDING_RENT_REASONABLE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_tenancy_no_same_day_overlap_strict_separation
        grounds:
          - validations[priority=14]
          - entities.Unit.fields.occupancy_status
          - endpoints["POST /tenancies"]
        distinguishing_aspect: |
          Resource entity: UNIT. Interval semantics: STRICT SEPARATION — the predecessor
          Tenancy's terminated_at must be STRICTLY LESS than the next requested_at. There is
          NO same-day handoff: a Tenancy that ends at T0 forbids a new Tenancy that starts
          at T0 (closed-end / closed-start adjacency conflict).
        test_recipe:
          setup:
            - "Unit U; Tenancy T1 created at requested_at=T0, finalized to ACTIVE, then move-out terminates T1 at T0+30d."
            - "After move-out, Unit.occupancy_status returns to VACANT at T0+30d."
          trigger:
            - "POST /tenancies with unit_id=U.id, voucher_id=V2.id, lease_start=T0+30d (same instant as T1.terminated_at)."
            - "POST /tenancies with unit_id=U.id, voucher_id=V2.id, lease_start=T0+30d+1s."
          assert:
            - "First call: error_id == 'ERR_UNIT_OCCUPANCY_OVERLAP', http_status == 409 (strict-separation: same instant is forbidden)"
            - "Second call (1 second later): 201 success"

      - name: unit_annual_inspection_365_day_gap_inclusive
        grounds:
          - validations[priority=15]
          - endpoints["POST /inspections"]
          - entities.Unit.fields.next_annual_inspection_due
        distinguishing_aspect: |
          DIFFERENT resource (still Unit, but the interval is over INSPECTION GAPS, not
          OCCUPANCY) and DIFFERENT interval semantics: the 365-day gap is INCLUSIVE
          (exactly-365-days adjacency is allowed). 364 days fails, 365 days passes —
          contrast with the strict separation in instance 1 (where exact-instant adjacency
          fails).
        test_recipe:
          setup:
            - "Unit U with last_inspection_passed_at = T0; next_annual_inspection_due = T0 + 365d."
            - "Advance clock to T0 + 364 days."
          trigger:
            - "POST /inspections with tenancy_id=T.id, inspection_type=ANNUAL, scheduled_for=now()."
            - "Advance clock by +1 day (now = T0 + 365 days exactly)."
            - "POST /inspections with tenancy_id=T.id, inspection_type=ANNUAL, scheduled_for=now()."
          assert:
            - "First call: error_id == 'ERR_INSPECTION_TOO_SOON', http_status == 409"
            - "Second call: 201 success (exactly 365-day adjacency is allowed — INCLUSIVE gap)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hap_plus_ttp_equals_gross_rent_per_tenancy_month
        grounds:
          - calculations.calc_hap
          - calculations.calc_ttp
          - entities.Tenancy.fields.current_hap_cents
          - entities.Tenancy.fields.current_total_tenant_payment_cents
          - entities.Tenancy.fields.gross_rent_cents
          - state_machines.AnnualReview.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity #1: GROSS RENT (money). For any ACTIVE Tenancy at any time,
          current_hap_cents + current_total_tenant_payment_cents == gross_rent_cents
          (when gross_rent <= applicable_payment_standard) OR HAP+TTP < gross_rent if
          gross_rent > standard (tenant pays the overage). The pinned formula is:
          current_hap_cents + current_total_tenant_payment_cents + max(0, gross_rent_cents - applicable_payment_standard_cents) == gross_rent_cents.
          When AnnualReview APPROVED updates TTP, the compensating action is the
          re-computation of HAP so the equation still balances — drift would mean the
          tenant or landlord is overpaid/underpaid.
        test_recipe:
          setup:
            - "Applicant A: gross=3000000, household_size=3, dependents=1, elderly=false. adjusted_initial=2952000."
            - "Voucher V (ZONE_A, br=2). PaymentStandard(ZONE_A, br=2, standard=120000, mobility=132000)."
            - "Unit U (ZONE_A, 2br, asking_rent=110000, utilities=10000) → gross_rent=120000."
            - "Tenancy T → ACTIVE. Initial TTP = ceil(floor(2952000/12)*0.30) = ceil(246000*0.30) = 73800. Initial HAP = min(120000,120000)-73800 = 46200."
            - "Verify pre-state invariant: 73800 + 46200 + max(0, 120000-120000) == 120000 (TRUE)."
            - "AnnualReview AR submitted with declared_gross_annual_income_cents=2400000 and declared_household_size=1."
            - "Recert dependents = 1-1 = 0; adjusted = 2400000 - 0 = 2400000; monthly = 200000; new_ttp = ceil(200000*0.30) = 60000; new_hap = min(120000,120000) - 60000 = 60000."
          trigger:
            - "POST /annual-reviews/{AR.id}/approve."
          assert:
            - "After approve: Tenancy.current_total_tenant_payment_cents == 60000"
            - "After approve: Tenancy.current_hap_cents == 60000"
            - "Invariant holds: current_total_tenant_payment_cents + current_hap_cents + max(0, gross_rent_cents - applicable_payment_standard_cents) == gross_rent_cents (60000 + 60000 + 0 == 120000)"

      - name: voucher_count_conserved_under_portability_absorb
        grounds:
          - state_machines.PortabilityRequest.INITIATED_to_ABSORBED
          - state_machines.Voucher.LEASED_to_PORTED_OUT
          - entities.Voucher.fields.administering_pha_id
          - endpoints["GET /vouchers"]
        distinguishing_aspect: |
          Conserved quantity #2: NETWORK-WIDE VOUCHER COUNT (an integer count, NOT money —
          a DIFFERENT type of conserved quantity from instance 1's HAP+TTP money invariant).
          For the configured PHA network, the pinned invariant is:
            sum over PHA in network of count(Voucher WHERE administering_pha_id == PHA AND status != REVOKED)
            == unchanged across a PortabilityRequest ABSORBED.
          The compensating action is paired: V.administering_pha_id changes from PHA_001 to PHA_002
          (one PHA "loses" the row, the other "gains" the row), so the per-PHA counts shift
          by -1 / +1 but the NETWORK sum is invariant. Any implementation that fails to
          flip administering_pha_id atomically with the absorb transition would cause drift
          (sum drops to 7, or double-counts to 9).
        test_recipe:
          setup:
            - "Network = {PHA_001, PHA_002}. Seed PHA_001 with 5 vouchers (none REVOKED); PHA_002 with 3 vouchers (none REVOKED). Pre-state sum = 5 + 3 = 8."
            - "One of PHA_001's vouchers V is LEASED with active Tenancy T. PortabilityRequest PR created with receiving_pha_id=PHA_002 in status INITIATED."
            - "Pre-state assertion: count(administering_pha_id=PHA_001 AND status!=REVOKED) == 5; count(administering_pha_id=PHA_002 AND status!=REVOKED) == 3; sum == 8."
          trigger:
            - "POST /portability-requests/{PR.id}/absorb."
            - "GET /vouchers?administering_pha_id=PHA_001."
            - "GET /vouchers?administering_pha_id=PHA_002."
          assert:
            - "V.administering_pha_id == 'PHA_002' (changed)"
            - "V.status == 'PORTED_OUT'"
            - "Post-state: count(administering_pha_id=PHA_001 AND status!=REVOKED) == 4"
            - "Post-state: count(administering_pha_id=PHA_002 AND status!=REVOKED) == 4 (gained V, even though V.status is PORTED_OUT — PORTED_OUT is NOT REVOKED)"
            - "Invariant holds: 4 + 4 == 8 (network sum unchanged)"
