          - state_machines.Quote.DRAFT_to_SUBMITTED
          - errors[ERR_QUOTE_EMPTY]
        distinguishing_aspect: |
          Empty-collection metric on a distinct endpoint from instance 1: a
          quote whose line-item collection is empty (count == 0, not a numeric
          threshold) MUST be rejected at submit with ERR_QUOTE_EMPTY 422 via
