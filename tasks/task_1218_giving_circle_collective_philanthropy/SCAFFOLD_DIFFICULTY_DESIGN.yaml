# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1218)
# 9 rules x 2 instances = 18 instances. Every setup chain replays cleanly
# against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6 from empty-DB.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: budget_provisional_vs_final_diverge
        grounds:
          - calculations.grant_budget
          - entities.GivingCycle.fields.grant_budget_provisional_cents
          - entities.GivingCycle.fields.grant_budget_final_cents
        distinguishing_aspect: |
          GivingCycle-fiscal domain: identical pool state (one RECEIVED + one
          PLEDGED contribution) yields provisional 190000 but final 95000 —
          the variants disagree because the provisional base counts PLEDGED
          funds and the final base does not.
        test_recipe:
          setup:
            - "Circle (fee 5%, quorum 50, reserve 0, BALANCED); cycle in POOLING"
            - "M1 STANDARD ACTIVE with contribution 100000 RECEIVED"
            - "M2 STANDARD ACTIVE with contribution 100000 still PLEDGED"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle DV", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.dv@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M Two", email: "m2.dv@x.com" }, as: CircleAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms2_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m2_id}", captures: { c2_id: $.data.id } }
          trigger:
            - { call: "GET /api/cycles/${cycle_id}/ledger", as: CircleAdmin }
          assert:
            - "ledger.grant_budget_provisional_cents == 190000"
            - "ledger.grant_budget_final_cents == 95000"
            - "ledger.pooled_balance_cents == 100000"
            - "Contribution.${c2_id}.status == PLEDGED"

      - name: vetting_score_profile_changes_outcome
        grounds:
          - calculations.vetting_score
          - entities.Circle.fields.vetting_profile
          - state_machines.Nomination.VETTING_to_FINALIST
          - validations[priority=19]
        distinguishing_aspect: |
          Nomination-vetting domain (different entity domain than the budget
          variant): identical scores 60/90/60 score 69 under BALANCED (fails
          the 70 threshold) but 75 under EQUITY_FIRST (passes) — the circle
          profile selects the variant and flips the finalist outcome.
        test_recipe:
          setup:
            - "Circle A BALANCED and Circle B EQUITY_FIRST, each with a cycle in VETTING"
            - "Each cycle: one member with 100000 RECEIVED; one nomination in VETTING scored 60/90/60 with a COMPLETED site visit"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle Bal", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_a: $.data.id } }
            - { call: "POST /api/circles", payload: { name: "Circle Eq", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "EQUITY_FIRST" }, as: CircleAdmin, captures: { circle_b: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_a}", year_label: "2026" }, as: CircleAdmin, captures: { cyc_a: $.data.id, cyv_a: $.data.version } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_b}", year_label: "2026" }, as: CircleAdmin, captures: { cyc_b: $.data.id, cyv_b: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M A", email: "ma.vs@x.com" }, as: CircleAdmin, captures: { ma_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M B", email: "mb.vs@x.com" }, as: CircleAdmin, captures: { mb_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${ma_id}", circle_id: "${circle_a}", tier: "STANDARD" }, as: CircleAdmin, captures: { msa_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${mb_id}", circle_id: "${circle_b}", tier: "STANDARD" }, as: CircleAdmin, captures: { msb_id: $.data.id } }
            - { call: "POST /api/memberships/${msa_id}/accept", payload: {}, as: Member, as_user_id: "${ma_id}" }
            - { call: "POST /api/memberships/${msb_id}/accept", payload: {}, as: Member, as_user_id: "${mb_id}" }
            - { call: "POST /api/cycles/${cyc_a}/advance", payload: { expected_cycle_version: "${cyv_a}" }, as: CircleAdmin, captures: { cyv_a: $.data.version } }
            - { call: "POST /api/cycles/${cyc_a}/advance", payload: { expected_cycle_version: "${cyv_a}" }, as: CircleAdmin }
            - { call: "POST /api/cycles/${cyc_b}/advance", payload: { expected_cycle_version: "${cyv_b}" }, as: CircleAdmin, captures: { cyv_b: $.data.version } }
            - { call: "POST /api/cycles/${cyc_b}/advance", payload: { expected_cycle_version: "${cyv_b}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cyc_a}", membership_id: "${msa_id}", amount_cents: 100000 }, as: Member, as_user_id: "${ma_id}", captures: { ca_id: $.data.id } }
            - { call: "POST /api/contributions/${ca_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cyc_b}", membership_id: "${msb_id}", amount_cents: 100000 }, as: Member, as_user_id: "${mb_id}", captures: { cb_id: $.data.id } }
            - { call: "POST /api/contributions/${cb_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cyc_a}", as: CircleAdmin, captures: { cyv_a: $.data.version } }
            - { call: "POST /api/cycles/${cyc_a}/advance", payload: { expected_cycle_version: "${cyv_a}" }, as: CircleAdmin }
            - { call: "GET /api/cycles/${cyc_b}", as: CircleAdmin, captures: { cyv_b: $.data.version } }
            - { call: "POST /api/cycles/${cyc_b}/advance", payload: { expected_cycle_version: "${cyv_b}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "11-1111111", legal_name: "NP A", mission_category: "arts" }, as: CircleAdmin, captures: { npa_id: $.data.id } }
            - { call: "POST /api/nonprofits", payload: { ein: "22-2222222", legal_name: "NP B", mission_category: "arts" }, as: CircleAdmin, captures: { npb_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cyc_a}", nonprofit_id: "${npa_id}", statement: "s" }, as: Member, as_user_id: "${ma_id}", captures: { na_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cyc_b}", nonprofit_id: "${npb_id}", statement: "s" }, as: Member, as_user_id: "${mb_id}", captures: { nb_id: $.data.id } }
            - { call: "GET /api/cycles/${cyc_a}", as: CircleAdmin, captures: { cyv_a: $.data.version } }
            - { call: "POST /api/cycles/${cyc_a}/advance", payload: { expected_cycle_version: "${cyv_a}" }, as: CircleAdmin }
            - { call: "GET /api/cycles/${cyc_b}", as: CircleAdmin, captures: { cyv_b: $.data.version } }
            - { call: "POST /api/cycles/${cyc_b}/advance", payload: { expected_cycle_version: "${cyv_b}" }, as: CircleAdmin }
            - { call: "POST /api/nominations/${na_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "POST /api/nominations/${nb_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "PATCH /api/nominations/${na_id}", payload: { financial_health: 60, mission_alignment: 90, org_capacity: 60 }, as: CircleAdmin, captures: { score_a: $.data.vetting_score } }
            - { call: "PATCH /api/nominations/${nb_id}", payload: { financial_health: 60, mission_alignment: 90, org_capacity: 60 }, as: CircleAdmin, captures: { score_b: $.data.vetting_score } }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${na_id}", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z" }, as: CircleAdmin, captures: { va_id: $.data.id } }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${nb_id}", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z" }, as: CircleAdmin, captures: { vb_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T11:00:00Z" }, as: CircleAdmin }
            - { call: "POST /api/site-visits/${va_id}/complete", payload: { findings_note: "ok" }, as: CircleAdmin }
            - { call: "POST /api/site-visits/${vb_id}/complete", payload: { findings_note: "ok" }, as: CircleAdmin }
          trigger:
            - { call: "POST /api/nominations/${na_id}/advance-to-finalist", payload: {}, as: CircleAdmin, captures: { err_a: $.data.error_id } }
            - { call: "POST /api/nominations/${nb_id}/advance-to-finalist", payload: {}, as: CircleAdmin }
          assert:
            - "Nomination.${na_id}.vetting_score == 69"
            - "Nomination.${nb_id}.vetting_score == 75"
            - "Circle A advance-to-finalist rejected with ERR_VETTING_SCORE_BELOW_THRESHOLD (409)"
            - "Nomination.${na_id}.status == VETTING"
            - "Nomination.${nb_id}.status == FINALIST"
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: award_allocation_nested_minmax_share
        grounds:
          - calculations.award_allocation
          - calculations.voting_tally
          - state_machines.GivingCycle.VOTING_to_AWARD
        distinguishing_aspect: |
          Mode (a): award amount = min(budget, max(50000, round_half_up(share *
          budget))) — >= 3 inputs (budget 190000, share 130/200, floor 50000)
          with nested min/max; the clamp selects the middle branch and yields
          exactly 123500.
        test_recipe:
          setup:
            - "Cycle with two RECEIVED STANDARD contributions of 100000 each (received_total 200000, final budget 190000)"
            - "Two finalists N1, N2; quorum 50 over snapshot 2 (required 1); ballots: M1 N1=60/N2=40, M2 N1=70/N2=30; voting window closed"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle CF1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.cf1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { full_name: "M Two", email: "m2.cf1@x.com" }, as: CircleAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms2_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m2_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /api/contributions/${c2_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "33-3333333", legal_name: "NP One", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
            - { call: "POST /api/nonprofits", payload: { ein: "44-4444444", legal_name: "NP Two", mission_category: "health" }, as: CircleAdmin, captures: { np2_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np1_id}", statement: "s1" }, as: Member, as_user_id: "${m1_id}", captures: { n1_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np2_id}", statement: "s2" }, as: Member, as_user_id: "${m2_id}", captures: { n2_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "POST /api/nominations/${n2_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "PATCH /api/nominations/${n1_id}", payload: { financial_health: 80, mission_alignment: 80, org_capacity: 80 }, as: CircleAdmin }
            - { call: "PATCH /api/nominations/${n2_id}", payload: { financial_health: 80, mission_alignment: 80, org_capacity: 80 }, as: CircleAdmin }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n1_id}", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z" }, as: CircleAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n2_id}", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z" }, as: CircleAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T11:00:00Z" }, as: CircleAdmin }
            - { call: "POST /api/site-visits/${v1_id}/complete", payload: {}, as: CircleAdmin }
            - { call: "POST /api/site-visits/${v2_id}/complete", payload: {}, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/advance-to-finalist", payload: {}, as: CircleAdmin }
            - { call: "POST /api/nominations/${n2_id}/advance-to-finalist", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/ballots", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", allocations: [{ nomination_id: "${n1_id}", points: 60 }, { nomination_id: "${n2_id}", points: 40 }] }, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/ballots", payload: { cycle_id: "${cycle_id}", membership_id: "${ms2_id}", allocations: [{ nomination_id: "${n1_id}", points: 70 }, { nomination_id: "${n2_id}", points: 30 }] }, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-18T00:00:00Z" }, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, as_user_id: "adm-1" }
          trigger:
            - { call: "GET /api/awards?cycle_id=${cycle_id}", as: CircleAdmin, captures: { award_id: "$.data[0].id", award_amt: "$.data[0].amount_cents", award_pts: "$.data[0].winner_points" } }
          assert:
            - "GrantAward.${award_id}.amount_cents == 123500  (min(190000, max(50000, round_half_up(0.65*190000))))"
            - "GrantAward.${award_id}.winner_points == 130"
            - "Nomination.${n1_id}.status == AWARDED"
            - "Nomination.${n2_id}.status == NOT_SELECTED"

      - name: tranche_split_floor_then_remainder
        grounds:
          - calculations.payout_tranche_split
          - state_machines.GivingCycle.VOTING_to_AWARD
          - entities.Payout.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — tranche 1 is floored
          (floor(99751*0.70)=69825) and tranche 2 receives the remainder
          (99751-69825=29926); independently rounding each tranche would give
          29925 for tranche 2, a different cent.
        test_recipe:
          setup:
            - "Cycle with one RECEIVED STANDARD contribution of 105001 (final budget = 105001 - round_half_up(5250.05) = 99751)"
            - "Single finalist wins with 100 of 100 points (share 1 -> award == 99751); budget locked at AWARD"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle CF2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.cf2@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 105001 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "55-5555555", legal_name: "NP Solo", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np1_id}", statement: "s" }, as: Member, as_user_id: "${m1_id}", captures: { n1_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
