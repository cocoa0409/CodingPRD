              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "both plans report required_headcount == 6 after submit, from ceil(40000 / (950 x 8)) == ceil(5.2632)"
            - "the SC-POOL approve returns HTTP 409 with data.error_id == ERR_FLEX_POOL_EXHAUSTED (6 needed, 1 available), not the budget error"
            - "SortCenter.${pool_center_id}.flex_pool_available stays 1 with flex_pool_reserved 0, and the plan stays SUBMITTED"
            - "the SC-BUDGET approve returns HTTP 402 with data.error_id == ERR_LABOR_BUDGET_EXCEEDED, because round(6 x 8.0 x 2150) == 103200 > 100000 with a 0.00 flex premium"
