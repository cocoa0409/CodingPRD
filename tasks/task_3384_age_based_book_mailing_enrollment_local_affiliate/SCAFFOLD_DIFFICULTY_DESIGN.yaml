            - "Affiliate.${aff_a_id}.enrolled_count == 2 and Affiliate.${aff_b_id}.enrolled_count == 1 (link 3: both recounts fire)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_precondition_beats_capacity_check
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PRESS_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Category pair state vs business_fiscal: confirming a print order whose
          selection was reopened to PROPOSED AND whose quantity alone (500000)
          exceeds the press capacity MUST return ERR_INVALID_STATE (priority 7),
          never ERR_PRESS_CAPACITY_EXCEEDED (priority 12).
        test_recipe:
          setup:
            - "Clock 2026-09-01. TODDLER title; selection 2026-12/TODDLER proposed and approved; print order qty 500000 created; selection then reopened to PROPOSED."
          setup_api_calls:
            - *c_sep
            - *t_tod
            - call: "POST /library/selections"
              payload: { mailing_month: "2026-12", age_band: "TODDLER", title_id: "${t_tod}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_pc: $.data.id }
            - call: "POST /library/selections/${sel_pc}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - call: "POST /library/print-orders"
              payload: { selection_id: "${sel_pc}", quantity: 500000, is_reprint: false }
              as: PublisherOps
              captures: { po_pc: $.data.id }
            - call: "POST /library/selections/${sel_pc}/reopen"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
          trigger:
            - call: "POST /library/print-orders/${po_pc}/confirm"
              payload: {}
              as: PublisherOps
              captures: { err_pc: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "data.error_id != \"ERR_PRESS_CAPACITY_EXCEEDED\" even though 500000 > 400000 also violates the capacity rule"
            - "PrintOrder.${po_pc}.status == SUBMITTED and unit_cents is null (no partial side effects)"

      - name: selection_month_past_beats_duplicate_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors.ERR_SELECTION_MONTH_PAST
          - errors.ERR_SELECTION_EXISTS
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: proposing a
          selection for a month that is BOTH in the past (clock already at
          2026-11) AND already has a (month, band) selection MUST return
          ERR_SELECTION_MONTH_PAST (priority 9), never ERR_SELECTION_EXISTS
          (priority 10).
        test_recipe:
          setup:
            - "Clock 2026-09-01; INFANT title; selection 2026-10/INFANT proposed and approved. Clock advanced to 2026-11-01."
          setup_api_calls:
            - *c_sep
            - *t_inf
            - *s_inf_o
            - *s_inf_o_ok
            - *clock_nov
          trigger:
            - call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-cid"
              captures: { err_dup: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == \"ERR_SELECTION_MONTH_PAST\""
            - "data.error_id != \"ERR_SELECTION_EXISTS\" even though (2026-10, INFANT) is occupied"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: registration_age_boundary_59_vs_60_months
        grounds:
          - calculations.age_band_assignment
          - errors.ERR_CHILD_AGE_INELIGIBLE
        distinguishing_aspect: |
          Metric: months-of-age at registration month. age_months == 59 (born
          2021-10-15, registering 2026-09) registers 201; age_months == 60
          (born 2021-09-15) is rejected — the boundary is inclusive of 59 and
          exclusive of 60.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Program + affiliate (prefixes 372/370) operative 2026-2027."
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Gi Hale", family_name: "Hale", birth_date: "2021-10-15T00:00:00Z", mailing_address: { line1: "8 Vine St", city: "Nashville", region: "TN", postal_code: "37211", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { kid59: $.data.id }
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Hu Irwin", family_name: "Irwin", birth_date: "2021-09-15T00:00:00Z", mailing_address: { line1: "10 Rose St", city: "Nashville", region: "TN", postal_code: "37212", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err60: $.data.error_id }
          assert:
            - "the 59-month registration returns 201 and Child.${kid59}.enrollment_status == ACTIVE"
            - "Child.${kid59}.expected_final_mailing_month == \"2026-09\"  (2021-10 + 59 months)"
            - "the 60-month registration returns 422 with data.error_id == \"ERR_CHILD_AGE_INELIGIBLE\""
            - "Affiliate.${aff_a_id}.enrolled_count == 1 (only the 59-month child counts)"

      - name: manifest_with_zero_eligible_children
        grounds:
          - calculations.manifest_eligibility_set
          - state_machines.MailingWave.SCHEDULED_to_MANIFESTED
        distinguishing_aspect: |
          Metric: empty eligibility set / zero count, reached through the wave
          manifest + reconcile endpoints (not registration). Manifest with five
          LOCKED selections but zero registered children succeeds with
          manifested_item_count == 0, and reconcile creates NO invoices.
        test_recipe:
          setup:
