  - name: only_the_credential_auditor_may_verify_reject_or_disqualify_a_guard
    claim_type: exclusive_operations
    grounds:
    - roles.CredentialAuditor.exclusive_operations
    - roles.StaffingCoordinator.shared_operations
    - validations[priority=3]
    - errors.ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    distinguishing_aspect: |
      The credential-verification endpoint is the segregation-of-duties hinge of the sourcing flow: three roles may call it but only one may VERIFY, REJECT or DISQUALIFY, while SUBMIT_FOR_REVIEW is shared with the two sourcing roles. So the same endpoint must accept one verb and refuse three from the very same caller — a single per-endpoint role list cannot express this.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - one EMPLOYEE Guard GC-7001 at credential_level 1, credential_expires_on 2026-12-31T00:00:00Z, in verification_status UNVERIFIED
