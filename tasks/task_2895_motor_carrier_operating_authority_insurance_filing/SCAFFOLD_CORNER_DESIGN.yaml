              as_user_id: "${c49_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /authority-applications/${app49_id}/vetting-review"
              payload: { disposition: "PUBLISH", findings: "no adverse vetting findings" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /operating-authorities"
              payload: { application_id: "${app49_id}" }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { auth49_id: "$.data[0].id" }
          trigger:
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c49_id}", application_kind: "REINSTATEMENT", transportation_type: "FOR_HIRE_PROPERTY", predecessor_authority_id: "00000000-0000-4000-8000-000000000555", requested_operating_states: ["TX", "OK", "NM"] }
              as: CarrierRep
              as_user_id: "${c49_id}"
              captures: { unknown_predecessor_error: $.data.error_id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c49_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", predecessor_authority_id: "${auth49_id}", requested_operating_states: ["TX", "OK", "NM"] }
