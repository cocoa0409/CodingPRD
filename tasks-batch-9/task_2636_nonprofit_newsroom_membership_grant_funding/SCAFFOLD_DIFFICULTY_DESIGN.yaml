            - call: "POST /grant-proposals"
              payload: { funder_id: "${f_id}", fiscal_period_id: "${fp_id}", title: "Grid resilience investigation", requested_amount_cents: 350000, restriction_type: "PROGRAM_RESTRICTED", coverage_area_id: "${ca_id}", restriction_start_date: "2026-09-01", restriction_end_date: "2027-02-28", reporting_cadence: "SEMIANNUAL", award_probability_bps: 7000 }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { gp_id: "$.data.id" }
            - call: "POST /grant-proposals/${gp_id}/pipeline-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "POST /grant-proposals/${gp_id}/internal-review"
              payload: { decision: "CLEAR" }
              as: EditorialDirector
