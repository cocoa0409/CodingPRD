      - name: monitoring_windows_are_half_open_so_adjacency_is_legal
        grounds:
          - validations.priority_55_ERR_MONITORING_WINDOW_OVERLAP
          - entities.MonitoringReport.fields.window_start
          - entities.MonitoringReport.fields.window_end
          - entities.MonitoringReport.fields.review_status
          - endpoints.POST_/mitigation/monitoring-reports
        distinguishing_aspect: |
          RESOURCE: the MitigationBank's monitoring calendar. INTERVAL SEMANTICS: HALF-OPEN
          [window_start, window_end) — a window starting exactly at another's end instant is legal, only
          a positive-length intersection is rejected, and the occupancy set is itself state-dependent
          (DRAFT/SUBMITTED/ACCEPTED occupy the calendar, RETURNED releases its slot). The other instance
          of this rule uses the opposite convention on a different resource, so an implementation that
          shares one interval helper between the two cannot satisfy both.
