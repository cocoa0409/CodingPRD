            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-03T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride2: $.data.id } }
            - { call: "POST /rides/${ride2}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-06-01", period_end: "2026-06-08" }, as: BillingAdmin, captures: { inv2: $.data.id } }
            - { call: "POST /invoices/${inv2}/issue", as: BillingAdmin }
          trigger:
            - { call: "POST /payments", payload: { client_id: "${cli}", amount_cents: 2000, method: "ACH" }, as: FamilyMember, as_user_id: "${fam}", captures: { pay: $.data.id, apps: $.data.applications } }
            - { call: "GET /invoices/${inv1}", as: BillingAdmin, captures: { s1: $.data.issuance_status, p1: $.data.paid_cents } }
            - { call: "GET /invoices/${inv2}", as: BillingAdmin, captures: { s2: $.data.issuance_status, p2: $.data.paid_cents } }
            - { call: "GET /clients/${cli}", as: BillingAdmin, captures: { credit: $.data.credit_balance_cents } }
          assert:
            - "Payment.applications == [{invoice_id: ${inv1}, applied_cents: 1251}, {invoice_id: ${inv2}, applied_cents: 749}] (due_date ASC order)"
            - "inv1: issuance_status == PAID, paid_cents == 1251"
            - "inv2: issuance_status == PARTIALLY_PAID, paid_cents == 749"
            - "credit_balance_cents == 0 (no remainder: 1251 + 749 == 2000)"

      - name: invoice_input_set_excludes_free_cancels_and_unfinished
        claim_type: input_set_filtering
        grounds: [calculations.invoice_aggregation]
        distinguishing_aspect: "In one period: a fee-0 free cancel and a still-SCHEDULED ride are excluded while a 240-minute late cancel (fee 1251) is the only line — charges == 1251 exactly."
        test_recipe:
          setup: ["client; three rides in period [2026-06-01, 2026-06-08): R_free cancelled with 1440+ notice (fee 0), R_late cancelled with 240 notice (fee 1251), R_open still SCHEDULED"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-02T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { r_free: $.data.id } }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-03T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { r_late: $.data.id } }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-04T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { r_open: $.data.id } }
            - { call: "POST /rides/${r_free}/cancel", payload: { cancel_note: "early cancel" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${r_late}/cancel", payload: { cancel_note: "late cancel" }, as: Client, as_user_id: "${cli}" }
          trigger:
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-06-01", period_end: "2026-06-08" }, as: BillingAdmin, captures: { inv: $.data.id, charges: $.data.charges_cents } }
            - { call: "GET /invoices/${inv}/lines", as: BillingAdmin, captures: { k0: "$.data[0].line_kind", a0: "$.data[0].amount_cents" } }
          assert:
            - "Invoice.charges_cents == 1251 (only the late-cancel fee is billed)"
            - "lines[0].line_kind == CANCELLATION_FEE and amount_cents == 1251; the free cancel (fee 0) and the SCHEDULED ride contribute no lines"

      - name: standing_generation_respects_horizon
        claim_type: constants_applied
        grounds: [calculations.standing_occurrence_generation, entities.StandingRide.fields.next_occurrence_date]
        distinguishing_aspect: "With clock 2026-05-20 the horizon (today + 14 days) admits only Monday 2026-06-01; advancing to 2026-05-30 and running the ops cycle adds exactly 2026-06-08 — never duplicates, never beyond the horizon."
        test_recipe:
          setup: ["ACTIVE STANDARD card; client; series MON 09:00 from 2026-06-01 to 2026-07-31"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /standing-rides", payload: { client_id: "${cli}", weekday: "MON", pickup_time_of_day_minutes: 540, kind: "GROCERY", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north", starts_on: "2026-06-01", ends_on: "2026-07-31" }, as: Coordinator, captures: { sr: $.data.id, next1: $.data.next_occurrence_date } }
            - { call: "GET /rides", as: Coordinator, captures: { occ1: "$.data[0].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-30T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /ops/run-cycle", as: PlatformAdmin, captures: { gen: $.data.generated_ride_ids } }
            - { call: "GET /standing-rides/${sr}", as: Coordinator, captures: { next2: $.data.next_occurrence_date } }
          assert:
            - "At creation (clock 2026-05-20): exactly 1 occurrence generated (2026-06-01, the only Monday <= 2026-06-03); next_occurrence_date == 2026-06-01"
            - "After run-cycle at 2026-05-30: exactly 1 new occurrence (2026-06-08; horizon 2026-06-13); total occurrences == 2, the 06-01 ride untouched (no duplicate)"
            - "next_occurrence_date == 2026-06-01 until that date passes, then 2026-06-08"

      - name: overdue_ar_boundary_at_due_date
        claim_type: precision
        grounds: [calculations.overdue_ar_and_billing_hold, "errors[ERR_BILLING_HOLD]"]
        distinguishing_aspect: "due_date itself is NOT overdue (strict <): on 2026-05-22 (due date) booking succeeds; one day later the same booking fails with ERR_BILLING_HOLD because 1251 >= limit 1000 (inclusive >= at the limit)."
        test_recipe:
          setup: ["client with billing_hold_limit_cents 1000; issued invoice 1251 due 2026-05-22"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St", billing_hold_limit_cents: 1000 }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-05-04T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride1: $.data.id } }
            - { call: "POST /rides/${ride1}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-05-01", period_end: "2026-05-08" }, as: BillingAdmin, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", as: BillingAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-22T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-02T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { err: $.data.error_id } }
          assert:
            - "On due_date (2026-05-22): ride created (201), id captured — due today is not yet overdue"
            - "One day later: error_id == ERR_BILLING_HOLD and http status == 402 (overdue 1251 >= limit 1000)"

  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers to a nonexistent ride id fails with ERR_UNAUTHENTICATED (401), proving auth (priority 2) precedes existence (priority 6)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rides/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status == 401 (headers absent; NOT 404)"

      - name: doc_window_invalid_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DOC_WINDOW_INVALID]"]
        distinguishing_aspect: "valid_until == valid_from (empty half-open window) is rejected at submission."
        test_recipe:
          setup: ["driver exists"]
          setup_api_calls:
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
          trigger:
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-06-01", valid_until: "2026-06-01" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DOC_WINDOW_INVALID and http status == 422"

      - name: rate_window_invalid_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_RATE_WINDOW_INVALID]"]
        distinguishing_aspect: "effective_to earlier than effective_from is rejected at card creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-07-01", effective_to: "2026-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RATE_WINDOW_INVALID and http status == 422"

      - name: standing_window_invalid_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_STANDING_WINDOW_INVALID]"]
        distinguishing_aspect: "ends_on before starts_on is rejected before any rate-card check fires (temporal priority 10 beats fiscal priority 13 — no rate card exists in this setup at all)."
        test_recipe:
          setup: ["client exists; deliberately NO rate cards"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /standing-rides", payload: { client_id: "${cli}", weekday: "MON", pickup_time_of_day_minutes: 540, kind: "GROCERY", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north", starts_on: "2026-06-01", ends_on: "2026-05-01" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STANDING_WINDOW_INVALID and http status == 422"

      - name: invoice_period_invalid_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVOICE_PERIOD_INVALID]"]
        distinguishing_aspect: "period_end <= period_start is rejected before set-emptiness is evaluated."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-06-08", period_end: "2026-06-01" }, as: BillingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVOICE_PERIOD_INVALID and http status == 422"

      - name: invoice_period_overlap_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVOICE_PERIOD_OVERLAP]"]
        distinguishing_aspect: "A second generate whose half-open period [2026-05-05, 2026-05-12) intersects the existing [2026-05-01, 2026-05-08) invoice is rejected — even though the second period alone is non-empty and well-formed."
        test_recipe:
          setup: ["client with a late-cancelled 2026-05-04 ride and a generated DRAFT invoice for [2026-05-01, 2026-05-08)"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-05-04T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride1: $.data.id } }
            - { call: "POST /rides/${ride1}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli}" }
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-05-01", period_end: "2026-05-08" }, as: BillingAdmin, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-05-05", period_end: "2026-05-12" }, as: BillingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVOICE_PERIOD_OVERLAP and http status == 409"

      - name: invoice_empty_period_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVOICE_EMPTY]"]
        distinguishing_aspect: "A well-formed, non-overlapping period containing no billable rides yields ERR_INVOICE_EMPTY rather than a zero-cent invoice."
        test_recipe:
          setup: ["client exists with no rides at all"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /invoices/generate", payload: { client_id: "${cli}", period_start: "2026-07-01", period_end: "2026-07-08" }, as: BillingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVOICE_EMPTY and http status == 422"

      - name: payment_amount_zero_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_PAYMENT_AMOUNT_INVALID]"]
        distinguishing_aspect: "amount_cents == 0 is rejected (strictly-positive rule; the zero boundary itself is illegal)."
        test_recipe:
          setup: ["client with BILLING_PAYER family"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /family-members", payload: { client_id: "${cli}", full_name: "Faye F", relation: "daughter", access_level: "BILLING_PAYER" }, as: Coordinator, captures: { fam: $.data.id } }
          trigger:
            - { call: "POST /payments", payload: { client_id: "${cli}", amount_cents: 0, method: "CARD" }, as: FamilyMember, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYMENT_AMOUNT_INVALID and http status == 422"

      - name: refund_exceeds_settled_returns_422
        claim_type: violation_to_error
        grounds: [state_machines.Payment, "errors[ERR_REFUND_EXCEEDS_SETTLED]"]
        distinguishing_aspect: "Refunding 501 against a 500 payment exceeds amount_cents - refunded_cents and is rejected."
        test_recipe:
          setup: ["client; payment 500 SETTLED (no invoices, all parked to credit)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /payments", payload: { client_id: "${cli}", amount_cents: 500, method: "CARD" }, as: BillingAdmin, captures: { pay: $.data.id } }
          trigger:
            - { call: "POST /payments/${pay}/refund", payload: { amount_cents: 501, reason: "too much" }, as: BillingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFUND_EXCEEDS_SETTLED and http status == 422; payment stays SETTLED with refunded_cents 0"

      - name: refund_credit_spent_returns_409
        claim_type: violation_to_error
        grounds: [calculations.refund_reversal, "errors[ERR_REFUND_CREDIT_SPENT]"]
        distinguishing_aspect: "The seed payment's 1000 remainder became credit and was then consumed by invoice generation (credit 0); refunding that payment demands a 1000 credit clawback the balance cannot cover, so the whole refund is rejected atomically."
        test_recipe:
          setup: ["client credit 1000 from payment P; ride completed (fare 4500); invoice generated applying all 1000 credit; issued"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /family-members", payload: { client_id: "${cli}", full_name: "Faye F", relation: "daughter", access_level: "BILLING_PAYER" }, as: Coordinator, captures: { fam: $.data.id } }
            - { call: "POST /payments", payload: { client_id: "${cli}", amount_cents: 1000, method: "CARD" }, as: FamilyMember, as_user_id: "${fam}", captures: { pay: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d1: $.data.id } }
            - { call: "POST /compliance-docs/${d1}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d2: $.data.id } }
            - { call: "POST /compliance-docs/${d2}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d3: $.data.id } }
            - { call: "POST /compliance-docs/${d3}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
