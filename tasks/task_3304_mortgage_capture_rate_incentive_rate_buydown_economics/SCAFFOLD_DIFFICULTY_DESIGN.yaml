            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /housing/contracts/${ct1}"
              payload: {}
              as: SalesCounselor
              captures: { ct1_v: $.data.version }
          trigger:
            - call: "POST /housing/contracts/${ct1}/incentive-allocations"
