      - name: corner_logical_clock_must_move_strictly_forward
        claim_type: violation_to_error
        grounds:
          - validations.priority_27
          - errors.ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The clock is strictly monotonic, so re-setting it to its CURRENT value is refused with the same HTTP 422 ERR_CLOCK_NOT_MONOTONIC as moving it backwards, and a refused call leaves the clock where it was — a subsequently created row still stamps the last accepted value."
        test_recipe:
          setup:
            - "No setup beyond the default logical clock of 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
            - call: "POST /_clock/set_current_utc"
