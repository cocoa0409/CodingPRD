              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { dc_ver1: $.data.version }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 100000, expected_deal_contract_version: "${dc_ver1}" }
              as: TreasuryOfficer
              as_user_id: "treasury-nra"
              captures: { err_id: $.data.error_id }
            - call: "PATCH /nil/athletes/${ath_id}/tax-profile"
