  - section: validations
    instances:
      - name: schedule_date_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SCHEDULE_DATE_PAST]"]
        distinguishing_aspect: "A sitting date before the current logical date fails ERR_SCHEDULE_DATE_PAST (422); today itself is allowed (inclusive)."
        test_recipe:
          setup: ["candidate C with authorization; clock 2026-09-15; division PCM ELIGIBLE"]
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
            - { call: "GET /licensure/candidates/${cand_id}/exam-progress", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { div_pcm: "$.data[2].id" } }
          trigger:
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-09-14" }, as: Candidate, as_user_id: "${cand_id}", captures: { err: $.data.error_id } }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-09-15" }, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "2026-09-14: error_id == ERR_SCHEDULE_DATE_PAST"
            - "2026-09-15 (today): schedule succeeds, status SCHEDULED"
      - name: report_hours_range_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_HOURS_OUT_OF_RANGE]"]
        distinguishing_aspect: "hours must be in 1..2000: 0 and 2001 both fail ERR_HOURS_OUT_OF_RANGE while 2000 is accepted."
        test_recipe:
          setup: ["jurisdiction J1; candidate C; supervisor S"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
          trigger:
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PRACTICE_MANAGEMENT", hours: 0, work_period_start: "2026-01-05", work_period_end: "2026-02-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { err0: $.data.error_id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PRACTICE_MANAGEMENT", hours: 2001, work_period_start: "2026-01-05", work_period_end: "2026-02-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PRACTICE_MANAGEMENT", hours: 2000, work_period_start: "2026-01-05", work_period_end: "2026-02-02" }, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "hours 0 -> ERR_HOURS_OUT_OF_RANGE; hours 2001 -> ERR_HOURS_OUT_OF_RANGE"
            - "hours 2000 -> 201 created, status DRAFT (upper boundary inclusive)"
      - name: work_period_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WORK_PERIOD_INVALID]"]
        distinguishing_aspect: "work_period_end equal to or before work_period_start fails ERR_WORK_PERIOD_INVALID (422); the half-open interval must be non-empty."
        test_recipe:
          setup: ["jurisdiction J1; candidate C; supervisor S"]
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
          trigger:
