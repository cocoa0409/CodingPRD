      - name: line_patch_recomputes_price_and_promised_date
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.lead_time_promise
          - calculations.line_pricing
          - entities.WindowOrder.fields.promised_date
        distinguishing_aspect: "Derived-field reconciliation on PATCH: order with RECT (10d) + ARCH (25d) lines promises 2026-08-27; reconfiguring the ARCH line to RECTANGLE (OCC on order version) recomputes promised_date to 2026-08-12 and reprices the line from 192080 to 143300 (area factor returns to 1.0, so glazing is 12.0 not 10.2)."
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; DRAFT order with RECT 40x60 qty1 line and ARCH 36x48 qty1 COLONIAL BRUSHED_NICKEL line"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "ARCH", width_in: 36, height_in: 48, quantity: 1, grid_style: "COLONIAL", hardware_finish: "BRUSHED_NICKEL" }, as: PlantManager, captures: { arch: $.data.id, arch_total: $.data.line_total_cents } }
            - { call: "GET /fenestration/orders/${ord}", as: PlantManager, captures: { ov: $.data.version, p1: $.data.promised_date } }
          trigger:
            - { call: "PATCH /fenestration/orders/${ord}/lines/${arch}", payload: { expected_order_version: "${ov}", shape: "RECTANGLE" }, as: PlantManager, captures: { new_total: $.data.line_total_cents, new_lead: $.data.lead_time_days } }
            - { call: "GET /fenestration/orders/${ord}", as: PlantManager, captures: { p2: $.data.promised_date, sub: $.data.subtotal_cents } }
          assert:
            - "Before PATCH: promised_date == 2026-08-27T00:00:00Z (max of 10d and 25d); ARCH line total 192080"
            - "PATCH response immediately shows line_total_cents == 143300 (84*1500*1.0 + 12.0*900 + 4000 + 2500) and lead_time_days == 10"
            - "After PATCH: promised_date == 2026-08-12T00:00:00Z and subtotal_cents == 308303 (165003 + 143300)"

      - name: certified_rating_worst_unit_basis
        claim_type: variant_selection
        grounds:
          - calculations.nfrc_rating
        distinguishing_aspect: "CERTIFIED rating uses min(argon_measured_pct) across the line's QC_PASSED units."
        excluded_because:
          difficulty_instance: nfrc_provisional_vs_certified_rating_divergence
          rationale: "That instance certifies a 2-unit line at measured 95/90 and asserts the label U-factor 0.30, which is exactly the worst-unit (90) derate result."

