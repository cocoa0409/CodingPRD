              as_user_id: "trust-0001"
              captures: { final_status: $.data.status }
          assert:
            - "early_err == ERR_OBJECTION_WINDOW_OPEN   # 2026-06-07 < effective_on 2026-06-08"
            - "final_status == CONSUMMATED              # exact effective_on boundary admitted (>= semantics)"

      - name: one_pending_objection_per_claim_exclusion
        grounds:
          - validations[priority=9]
          - errors[ERR_OBJECTION_ALREADY_PENDING]
        distinguishing_aspect: |
          Semantics = mutually-exclusive occupancy of the claim's objection
          slot with NO time component (a set-membership, not interval,
          exclusion) and on a different resource entity (Claim, not
          AuctionSale). A second objection while one is PENDING is rejected;
          after the first resolves, a new objection is admitted.
        test_recipe:
          setup:
            - "Case in CLAIMS_ADMINISTRATION; claim UNDER_REVIEW, then OBJECTED with a PENDING objection"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor O", creditor_ref: "CR-O-1", contact_email: "o@x.com" }
              as: Clerk
              captures: { cred_o: $.data.id }
