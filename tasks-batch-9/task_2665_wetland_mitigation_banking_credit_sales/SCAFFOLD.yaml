  - method: POST
    path: /mitigation/monitoring-reports/{id}/review
    purpose: "IRT review of a monitoring report. ACCEPT scores it against the effective performance standards and, on FAIL, opens a remedial action which defers the pending performance milestone; RETURN sends it back unscored."
