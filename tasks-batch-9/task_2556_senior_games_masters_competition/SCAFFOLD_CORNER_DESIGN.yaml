        distinguishing_aspect: "The provisional variant counts PENDING_PAYMENT athletes who have paid nothing: three unpaid registrants yield provisional_impact_cents 901320, and a fourth unpaid registrant raises it to 1201760 at the next ops-run — the projection is recomputed per ops epoch and the edition stays REGISTRATION_OPEN because the clock has not reached the deadline."
