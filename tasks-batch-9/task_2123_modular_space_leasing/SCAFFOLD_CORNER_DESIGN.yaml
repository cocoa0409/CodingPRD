  - section: state_machines
    instances:

      - name: publish_moves_configuration_draft_to_published
        claim_type: valid_transition
        grounds:
          - entities.FloorplanConfiguration.fields.status
          - endpoints[POST /floorplan-configurations/{id}/publish]
        distinguishing_aspect: "A configuration is created in DRAFT and POST /floorplan-configurations/{id}/publish flips status to PUBLISHED while config_surcharge_cents stays at the value computed at creation."
        test_recipe:
          setup:
            - "One 20x48 building spec and one DRAFT configuration on it."
          setup_api_calls:
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id, draft_status: $.data.status }
          trigger:
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "the configuration was created with status == \"DRAFT\""
            - "FloorplanConfiguration.${c2_id}.status == \"PUBLISHED\""
            - "FloorplanConfiguration.${c2_id}.config_surcharge_cents == 452000"
            - "FloorplanConfiguration.${c2_id}.version == 2"

      - name: publish_an_already_published_configuration_is_rejected
        claim_type: invalid_transition
        grounds:
          - entities.FloorplanConfiguration.fields.status
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: "A second publish on the same configuration returns 409 ERR_INVALID_STATE and leaves version unchanged at 2 — publish is not idempotent."
        test_recipe:
          setup:
            - "One PUBLISHED configuration."
          setup_api_calls:
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id }
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
          trigger:
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == \"ERR_INVALID_STATE\""
            - "FloorplanConfiguration.${c2_id}.version == 2"

