        claim_type: side_effect_execution
        grounds:
          - state_machines.CutoverWindow.IN_PROGRESS_to_ABORTED
          - state_machines.SiteZone.CUTOVER_IN_PROGRESS_to_LIVE_LEGACY
        excluded_because:
          difficulty_instance: compensating_invariant / cutover_abort_restores_facility_share_ledger_without_drift
          rationale: "That instance asserts the exact reversal of every start side effect and the conserved 10000 bps total."

