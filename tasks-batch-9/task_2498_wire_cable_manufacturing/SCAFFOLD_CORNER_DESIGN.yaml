      - name: mv_release_requires_the_offline_partial_discharge_result
        claim_type: violation_to_error
        grounds:
          - validations[priority=54]
          - errors[ERR_REQUIRED_TESTS_INCOMPLETE]
          - state_machines.ProductionLot.transitions.EXTRUDED_to_TESTED
          - calculations.cable_test_result
        distinguishing_aspect: "The inline set {SPARK, HIPOT} and the release set {SPARK, HIPOT, PARTIAL_DISCHARGE for MV} are deliberately different, so an MV lot legitimately sits at process_state TESTED with its off-line PD result still outstanding: priorities 40, 50, 52 and 56 are all satisfied and priority 54 is the only rung that can refuse the release."
        test_recipe:
          setup:
            - "MV_15KV SKU MV105-2-CU (pd_test_required true, marking_required false, HIPOT_REQUIRED_KV 35.0, PD_LIMIT_PC 5.0) on an ACTIVE UL file."
            - "Lot LOT-MV of 2000 ft extruded at 160.0 / 175.0 mils (concentricity 91.43 >= 85, minimum wall required 157.50), then SPARK and HIPOT passed by qe-001 - so the lot is TESTED / PENDING with no PARTIAL_DISCHARGE row at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /compounds"
              payload: { compound_code: "XLPE-105-INS", layer_role: "INSULATION", temp_rating_c: 105, flame_test: "FT4", max_voltage_v: 15000, wet_rated: true, filler_pct: 3.0 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "PE-105-JKT", layer_role: "JACKET", temp_rating_c: 105, flame_test: "FT4", max_voltage_v: 15000, wet_rated: true, filler_pct: 8.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "MV-CABLE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "MV105-2-CU", awg_size: "2", conductor_metal: "COPPER", conductor_construction: "COMPRESSED_37", application_rating: "MV_105", voltage_class: "MV_15KV", temp_rating_c: 105, insulation_thickness_mils: 175, conductor_lbs_per_kft: 205.0, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 20.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-91M", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-MV", planned_length_ft: 2000, line_code: "EXT-3", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 160.0, measured_max_wall_mils: 175.0, measured_avg_od_mm: 21.60 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "SPARK", duration_sec: 60, faults_detected: 0 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "HIPOT", duration_sec: 900, test_voltage_kv: 35.0, breakdown_detected: false }
              as: QualityEngineer
              as_user_id: "qe-001"
          trigger:
            - call: "GET /production-lots/${lot_id}"
              payload: {}
              as: QualityEngineer
              captures: { st_before: $.data.process_state }
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 2000 }
              as: QualityEngineer
              as_user_id: "qe-002"
              captures: { e_pd: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "PARTIAL_DISCHARGE", duration_sec: 600, pd_level_pc: 5.0 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 2000 }
              as: QualityEngineer
              as_user_id: "qe-002"
          assert:
            - "${st_before} == \"TESTED\": the inline pair alone promoted the lot even though pd_test_required is true"
            - "${e_pd} == \"ERR_REQUIRED_TESTS_INCOMPLETE\" with HTTP 422 - not ERR_INVALID_LOT_STATE (40 is satisfied: TESTED / PENDING), not ERR_MARKING_MISMATCH (50 is vacuous, marking_required is false for MV_105), not ERR_DIMENSIONAL_NONCONFORMANCE (52 is satisfied: 91.43 >= 85 and 160.0 >= 157.50), and not ERR_LOT_TEST_FAILED (56 is satisfied: no FAIL row exists)"
            - "the refused release is inert: ProductionLot.${lot_id}.quality_state is still \"PENDING\" and packaged_length_ft is still null"
            - "the PARTIAL_DISCHARGE row is created with result \"PASS\" (5.0 <= PD_LIMIT_PC[MV_15KV] 5.0) and does not change process_state, which stays \"TESTED\""
            - "the second release returns 200 with quality_state == \"CONFORMING\" and packaged_length_ft == 2000 - the same call that was refused now satisfies priority 54"

      - name: shipment_pricing_hold_versus_credit_limit_pair
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: shipment_order_held_beats_credit_limit
          rationale: "The 42-versus-80 pair (ERR_ORDER_PRICING_HELD returned while an over-limit credit exposure is simultaneously true) is constructed and asserted in both orders by that §1.8 instance, which also triggers ERR_CREDIT_LIMIT_EXCEEDED on its own."

      - name: release_dimensional_versus_segregation_pair
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: lot_release_dimensional_nonconformance_beats_segregation_of_duties
          rationale: "Priority 52's ERR_DIMENSIONAL_NONCONFORMANCE winning over priority 57's ERR_SEGREGATION_OF_DUTIES on a single release call is the whole subject of that §1.8 instance."

      - name: extrusion_line_schedule_conflict
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: extrusion_line_buffered_closed_interval
          rationale: "ERR_LINE_SCHEDULE_CONFLICT and the 30-minute changeover buffer at both ends of the closed interval are asserted at the boundary by that §1.8 instance."

      - name: reel_occupancy_overlap_conflict
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: reel_occupancy_half_open_at_return_instant
          rationale: "ERR_REEL_OCCUPANCY_OVERLAP and the half-open acceptance of a load starting exactly at the previous return instant are asserted by that §1.8 instance."

      - name: compound_qualification_and_rating_gates
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: product_release_depends_on_compound_status_and_rating
          rationale: "ERR_COMPOUND_NOT_QUALIFIED and ERR_COMPOUND_RATING_INSUFFICIENT, and the fact that both are checked at the same priority 65 with the status test first, are asserted by that §1.8 instance."

      - name: listing_certification_active_gate
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: lot_release_depends_on_listing_certification_status
          rationale: "ERR_CERTIFICATION_NOT_ACTIVE at priority 66 - release blocked while the file is SUSPENDED and allowed again after reinstatement - is asserted by that §1.8 instance."

      - name: float_window_price_history_minimum
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: ship_date_float_window_at_exactly_three_quotes
          rationale: "ERR_INSUFFICIENT_PRICE_HISTORY at the FLOAT_MIN_QUOTES boundary (two quotes refuse, three price) is asserted by that §1.8 instance."

