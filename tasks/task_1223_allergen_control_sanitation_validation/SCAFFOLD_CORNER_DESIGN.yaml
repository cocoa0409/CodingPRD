# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe: enumerates the testable claims declared in SCAFFOLD.yaml
# §1.1-§1.7 that §1.8 does not already cover. Excluded stubs cite the §1.8
# instance that already asserts the same claim.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, required fields, computed fields,
  # not-found, type constraints, immutability.
  # ===========================================================================
  - section: entities
    instances:
      - name: allergen_create_success_and_defaults
        claim_type: creation_with_defaults
        grounds: ["entities.Allergen.fields.is_active"]
        distinguishing_aspect: "Creating an Allergen without is_active yields is_active=true; response carries server id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id, al_active: $.data.is_active, al_version: $.data.version }
          trigger: []
          assert:
            - "Allergen.${al}.is_active == true (default applied)"
            - "Allergen.${al}.version == 1"

      - name: product_create_missing_required_sku_rejected
        claim_type: missing_required_field
        grounds: ["entities.Product.fields.sku", "errors[ERR_INVALID_REQUEST\"]"]
        distinguishing_aspect: "POST /qa/products without required sku yields ERR_INVALID_REQUEST (400); allergen_set also required."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /qa/products"
              payload: { product_name: "No SKU", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND\"]", "endpoints[GET /qa/products/{productId}]"]
        distinguishing_aspect: "GET with a random UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /qa/products/00000000-0000-0000-0000-000000000000"
              as: QaManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: production_run_invalid_time_range_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=17\"]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "planned_end_utc <= planned_start_utc rejected at creation with ERR_INVALID_TIME_RANGE."
        test_recipe:
          setup:
            - "Line and plain product exist"
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-T1", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-T1", product_name: "t", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T12:00:00Z", planned_end_utc: "2026-06-01T12:00:00Z" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TIME_RANGE"

      - name: line_allergen_matrix_inactive_allergen_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=18\"]", "errors[ERR_ALLERGEN_INACTIVE]"]
        distinguishing_aspect: "Creating a matrix entry referencing an allergen with is_active=false yields ERR_ALLERGEN_INACTIVE."
        test_recipe:
          setup: ["Inactive allergen exists; line exists"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "OLD", display_name: "Old", regulatory_class: "OTHER", is_active: false }
              as: QaManager
              captures: { al_old: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-T2", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id }
          trigger:
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al_old}", handling: "ALLOWED" }
              as: QaManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGEN_INACTIVE"

      - name: swab_result_computed_fields_ignore_input_outcome
        claim_type: computed_field
        grounds: ["entities.SwabResult.fields.outcome", "entities.SwabResult.fields.action_level_used"]
        distinguishing_aspect: "outcome and action_level_used are computed by the server; client cannot inject them. Also recorded swab requires changeover in SWAB_PENDING (ERR_SWAB_NOT_PENDING otherwise)."
        test_recipe:
          setup: ["Changeover exists but still in PLANNED (not SWAB_PENDING); certified tech exists"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "SOY", display_name: "Soy", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-T3", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 10 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-T3", product_name: "t", allergen_set: ["SOY"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-T3", target_allergen_id: "${al}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc: $.data.id, proc_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc}/approve"
              payload: { expected_procedure_version: "${proc_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-T3", full_name: "t", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line}", from_run_id: null, to_run_id: "${run}", procedure_id: "${proc}", scheduled_minutes: 10 }
              as: QaSupervisor
              captures: { co: $.data.id }
          trigger:
            - call: "POST /qa/changeovers/${co}/swab-results"
              payload: { zone_code: "Z1", swab_type: "ATP", measured_value: 10, recorded_by_id: "${tech}" }
              as: QaTechnician
              as_user_id: "${tech}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SWAB_NOT_PENDING (changeover still PLANNED)"

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial
  # state, side-effect execution beyond §1.8 instances.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: run_start_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ProductionRun.DRAFT_to_SCHEDULED", "errors[ERR_RUN_NOT_SCHEDULED\"]"]
        distinguishing_aspect: "POST /start on a DRAFT run is rejected with ERR_RUN_NOT_SCHEDULED; no side effects fire."
        test_recipe:
          setup: ["Run in DRAFT"]
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-S1", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-S1", product_name: "t", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
          trigger:
            - call: "POST /qa/production-runs/${run}/start"
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RUN_NOT_SCHEDULED"

      - name: changeover_terminal_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Changeover", "errors[ERR_CHANGEOVER_TERMINAL\"]"]
        distinguishing_aspect: "Cancelling a VALIDATED changeover is rejected with ERR_CHANGEOVER_TERMINAL; terminal states accept no further transitions."
        test_recipe:
          setup: ["Changeover driven to VALIDATED via 1 PASS swab (min_swab_zones=1)"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "EGG", display_name: "Egg", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-S2", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 10 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-S2", product_name: "t", allergen_set: ["EGG"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-S2", target_allergen_id: "${al}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc: $.data.id, proc_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc}/approve"
              payload: { expected_procedure_version: "${proc_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-S2", full_name: "t", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line}", from_run_id: null, to_run_id: "${run}", procedure_id: "${proc}", scheduled_minutes: 10 }
              as: QaSupervisor
              captures: { co: $.data.id }
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co}/finish-execution"
              payload: { actual_minutes: 10 }
              as: LineOperator
            - call: "POST /qa/changeovers/${co}/swab-results"
              payload: { zone_code: "Z1", swab_type: "ATP", measured_value: 50, recorded_by_id: "${tech}" }
              as: QaTechnician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /qa/changeovers/${co}/cancel"
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CHANGEOVER_TERMINAL (VALIDATED is terminal)"

      - name: incident_close_without_containment_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Incident.INVESTIGATING_to_CONTAINED", "errors[ERR_INCIDENT_NOT_INVESTIGATING\"]"]
        distinguishing_aspect: "POST /incidents/{id}/contain on an OPEN incident (never began investigation) yields ERR_INCIDENT_NOT_INVESTIGATING."
        test_recipe:
          setup: ["Incident OPEN"]
          setup_api_calls:
            - call: "POST /qa/incidents"
              payload: { incident_type: "LABEL_MISMATCH", severity: "LOW", description: "t" }
              as: QaSupervisor
              captures: { inc: $.data.id }
          trigger:
            - call: "POST /qa/incidents/${inc}/contain"
              payload: { containment_action: "x" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INCIDENT_NOT_INVESTIGATING"

      - name: audit_finding_waive_non_minor_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.AuditFinding.OPEN_to_WAIVED", "errors[ERR_FINDING_NOT_MINOR\"]"]
        distinguishing_aspect: "Waiving a MAJOR finding yields ERR_FINDING_NOT_MINOR (only MINOR waivable)."
        test_recipe:
          setup: ["MAJOR finding exists"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-S3A", full_name: "a", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t1: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-S3B", full_name: "b", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t2: $.data.id }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "PROCEDURE_DEVIATION", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
              captures: { f: $.data.id }
          trigger:
            - call: "POST /qa/audit-findings/${f}/waive"
              as: QaManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FINDING_NOT_MINOR"

      - name: procedure_retire_in_use_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ChangeoverProcedure.APPROVED_to_RETIRED", "errors[ERR_PROCEDURE_IN_USE\"]"]
        distinguishing_aspect: "Retiring an APPROVED procedure referenced by a PLANNED changeover yields ERR_PROCEDURE_IN_USE."
        test_recipe:
          setup: ["Procedure APPROVED; PLANNED changeover references it"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "SOY", display_name: "Soy", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-S4", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 10 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-S4", product_name: "t", allergen_set: ["SOY"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-S4", target_allergen_id: "${al}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc: $.data.id, proc_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc}/approve"
              payload: { expected_procedure_version: "${proc_v}" }
              as: QaManager
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line}", from_run_id: null, to_run_id: "${run}", procedure_id: "${proc}", scheduled_minutes: 10 }
              as: QaSupervisor
          trigger:
            - call: "POST /qa/changeover-procedures/${proc}/retire"
              as: QaManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROCEDURE_IN_USE"

      - name: label_reconciliation_non_match_cannot_resolve
        claim_type: precondition_enforcement
        grounds: ["state_machines.LabelReconciliation.OPEN_to_RESOLVED", "errors[ERR_RECON_NOT_MATCH\"]"]
        distinguishing_aspect: "Resolve on a reconciliation whose verdict is REVISION_MISMATCH yields ERR_RECON_NOT_MATCH; only MATCH can resolve directly."
        test_recipe:
          setup: ["Run exists with label_revision_snapshot=1; reconciliation created with printed_label_revision=2 (REVISION_MISMATCH)"]
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-S5", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-S5", product_name: "t", allergen_set: [], rework_class: "NO_REWORK", label_revision: 1 }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/label-reconciliations"
              payload: { run_id: "${run}", printed_label_revision: 2, declared_allergens_on_label: [] }
              as: QaSupervisor
              captures: { rec: $.data.id, rec_verdict: $.data.verdict }
          trigger:
            - call: "POST /qa/label-reconciliations/${rec}/resolve"
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "LabelReconciliation.${rec}.verdict == REVISION_MISMATCH"
            - "resolve rejected with error_id == ERR_RECON_NOT_MATCH"

      - name: technician_reinstate_requires_suspended
        claim_type: invalid_transition
        grounds: ["state_machines.QaTechnician.SUSPENDED_to_ACTIVE", "errors[ERR_TECH_NOT_SUSPENDED\"]"]
        distinguishing_aspect: "Reinstating an ACTIVE technician yields ERR_TECH_NOT_SUSPENDED."
        test_recipe:
          setup: ["ACTIVE technician"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-S6", full_name: "t", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /qa/technicians/${t}/reinstate"
              as: QaManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TECH_NOT_SUSPENDED"

  # ===========================================================================
  # Section: calculations — correct result, input-set filtering, constants,
  # precision (beyond §1.8 instances).
  # ===========================================================================
  - section: calculations
    instances:
      - name: changeover_validation_score_on_time_full_margin
        claim_type: correct_result
        grounds: ["calculations.changeover_validation_score"]
        distinguishing_aspect: |
          On-time changeover (actual <= scheduled) with three margin-eligible
          PASS swabs yields 100 + 5 + 3 - 0 = 108 clamped to 100. Distinct
          from §1.8's 94-score scenario.
        test_recipe:
          setup: ["Changeover SWAB_PENDING, scheduled=30, actual=30"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "WHEAT", display_name: "Wheat", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-C1", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 30 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-C1", product_name: "t", allergen_set: ["WHEAT"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-C1", target_allergen_id: "${al}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 100, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc: $.data.id, proc_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc}/approve"
              payload: { expected_procedure_version: "${proc_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-C1", full_name: "t", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { tech: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line}", from_run_id: null, to_run_id: "${run}", procedure_id: "${proc}", scheduled_minutes: 30 }
              as: QaSupervisor
              captures: { co: $.data.id }
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co}/finish-execution"
              payload: { actual_minutes: 30 }
              as: LineOperator
          trigger:
            - call: "POST /qa/changeovers/${co}/swab-results"
              payload: { zone_code: "Z1", swab_type: "ATP", measured_value: 40, recorded_by_id: "${tech}" }
              as: QaTechnician
              as_user_id: "${tech}"
            - call: "POST /qa/changeovers/${co}/swab-results"
              payload: { zone_code: "Z2", swab_type: "ATP", measured_value: 45, recorded_by_id: "${tech}" }
              as: QaTechnician
              as_user_id: "${tech}"
            - call: "POST /qa/changeovers/${co}/swab-results"
              payload: { zone_code: "Z3", swab_type: "ALLERGEN_ELISA", measured_value: 0.5, recorded_by_id: "${tech}" }
              as: QaTechnician
