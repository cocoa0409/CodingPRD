            - "LabelSpec.${l1_id}.placement_code == \"SIDE_SEAM_INSIDE\""
            - "LabelSpec.${l1_id}.revision_note == \"Placement must be the side seam for this silhouette.\""
            - "LabelSpec.${l1_id}.authored_by_user_id == \"user-spec-1\" and LabelSpec.${l1_id}.approved_by_user_id == \"user-appr-1\""

      - name: audit_falls_back_from_pending_closure_to_in_review_on_reopen
        grounds:
          - state_machines[entity=ComplianceAudit]
          - state_machines[entity=AuditFinding]
          - calculations.audit_rollup
          - endpoints[POST /labeling/audit-findings/{id}/reopen]
          - errors.ERR_AUDIT_STATE_INVALID
          - entities.ComplianceAudit.fields.open_finding_count
        distinguishing_aspect: |
          ComplianceAudit has no operator-driven edges except close: OPEN -> IN_REVIEW -> PENDING_CLOSURE -> IN_REVIEW is entirely derived from the child finding counts, so the audit walks backwards out of PENDING_CLOSURE when a CLOSED finding is reopened, and the close call that succeeded from PENDING_CLOSURE must be refused once the audit has fallen back.
        test_recipe:
          setup:
            - "Brand Northline Apparel Co owns style S1 and a published permanent label L1 usable as corrective_label_spec_id."
            - "Audit A1 with scope STYLE_DOSSIER carries exactly one finding F1 (CARE_UNSUBSTANTIATED, 100 units), so A1 is IN_REVIEW with open_finding_count 1."
            - "F1 is dispositioned (100 relabeled) and verified, driving F1 to CLOSED and A1 to PENDING_CLOSURE with open_finding_count 0."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id, a0_state: $.data.state }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${style_id}", finding_code: "CARE_UNSUBSTANTIATED", units_affected: 100 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_id: $.data.id }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { a1_state: $.data.state, a1_open: $.data.open_finding_count }
          trigger:
            - call: "POST /labeling/audit-findings/${f1_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 100, units_released: 0 }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { f1_state_after_disposition: $.data.state }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { a2_state: $.data.state, a2_open: $.data.open_finding_count }
            - call: "POST /labeling/audit-findings/${f1_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_state_after_verify: $.data.state }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { a3_state: $.data.state, a3_open: $.data.open_finding_count }
            - call: "POST /labeling/audit-findings/${f1_id}/reopen"
              payload: { reopen_reason: "Spot check found the same care claim on 40 remaining units." }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_state_after_reopen: $.data.state }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { a4_state: $.data.state, a4_open: $.data.open_finding_count }
            - call: "POST /labeling/compliance-audits/${audit_id}/close"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { close_after_reopen_err: $.data.error_id }
          assert:
            - "${a0_state} == \"OPEN\""
            - "${a1_state} == \"IN_REVIEW\" and ${a1_open} == 1"
            - "${f1_state_after_disposition} == \"REMEDIATED\""
            - "${a2_state} == \"IN_REVIEW\" and ${a2_open} == 1"
            - "${f1_state_after_verify} == \"CLOSED\""
            - "${a3_state} == \"PENDING_CLOSURE\" and ${a3_open} == 0"
            - "${f1_state_after_reopen} == \"OPEN\""
            - "${a4_state} == \"IN_REVIEW\" and ${a4_open} == 1"
            - "${close_after_reopen_err} == \"ERR_AUDIT_STATE_INVALID\" with HTTP 409"
            - "ComplianceAudit.${audit_id}.units_in_scope == 100"
            - "AuditFinding.${f1_id}.units_unresolved == 100 and AuditFinding.${f1_id}.units_destroyed == 0"

  - rule_id: transitive_cascade
    instances:
      - name: failed_reverification_cascades_test_to_style_to_permanent_labels_to_hangtags
        grounds:
          - endpoints[POST /labeling/lab-tests/{id}/results]
          - state_machines[entity=Style, dimension=substantiation_state]
          - state_machines[entity=LabelSpec]
          - calculations.fiber_tolerance_evaluation
          - entities.LabelSpec.fields.withdrawn_reason
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          One POST of laboratory measurements travels four levels - LabTest BENCH_RESERVED -> FAILED, Style substantiation_state FIBER_TEST_PENDING -> FIBER_MISSTATED, every PERMANENT_LABEL of that style in {PENDING_APPROVAL, APPROVED, PUBLISHED} -> WITHDRAWN with reason AUTO_FIBER_MISSTATED, and then every HANGTAG child of those labels -> WITHDRAWN with the different reason AUTO_PARENT_WITHDRAWN - and the two reasons plus the untouched DRAFT permanent label prove the walk went level by level rather than blanket-withdrawing every label of the style.
        test_recipe:
          setup:
            - "Market US is registered; brand Northline Apparel Co owns style S1 (WOVEN_OUTERWEAR) with a four-node graph whose substantial-transformation country is VN."
            - "A FIBER_CONTENT test T1 PASSED at 57.0/40.0/3.0 and a CARE_PERFORMANCE test C1 PASSED with legibility_cycles 40, so substantiation_state is FIBER_SUBSTANTIATED."
            - "Permanent label L1 is PUBLISHED for [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), hangtag H1 hangs off L1 in DRAFT, permanent label L2 is in PENDING_APPROVAL, and permanent label L3 is still in DRAFT as the negative control."
