# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances = 18 instances.
# Fixture arithmetic pre-computed against §1.3 formulas:
#   CA story:  contract 1000000 + extras 200000 - retainage 100000 = gross 1100000
#   CA prelim deadline: 2026-05-02 + 20 CALENDAR days = 2026-05-22
#   CA filing window:   2026-06-10 + 90 days = 2026-09-08
#   foreclosure:        filed 2026-07-01 + 90 days = 2026-09-29
#   NV inclusive last furnishing 2026-06-20 -> filing window 2026-09-18
#   Fee LENDER+PERSONAL_SERVICE: round(1499*1.15)=1724 + round(899*2.5)=2248 = 3972
#   Fee OWNER+CERTIFIED_MAIL:    1499 + 899 = 2398
#   Stop deadline: 2026-06-10 + 30 = 2026-07-10; bond claim: +45 = 2026-07-25
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_claim_amount
        grounds:
          - calculations.claimable_amount
          - entities.LienClaim.fields.provisional_amount_cents
          - entities.LienClaim.fields.final_amount_cents
        distinguishing_aspect: |
          Two valid amount algorithms on the LienClaim (money domain) diverge on
          identical project data: provisional (DRAFT) counts the PENDING 50000
          payment and the not-yet-effective CONDITIONAL 60000 waiver and ignores
          retainage, yielding 750000; final (AMOUNT_LOCKED) counts only VERIFIED
          payments and effective waivers and excludes retainage, yielding 760000.
        test_recipe:
          setup:
            - "Verified CA COMMERCIAL_PRIVATE project (contract 1000000, extras 200000, retainage 100000) under CA rule (prelim required, 20 CALENDAR days, UNCAPPED, retainage excluded, counts_punch_list false)"
            - "ACTIVE BASE_CONTRACT span 2026-05-02..2026-06-10; prelim notice to LENDER PROOF_CONFIRMED"
            - "P1 VERIFIED 300000 received 2026-06-15; P2 PENDING 50000 received 2026-06-20"
            - "W1 UNCONDITIONAL_PROGRESS APPLIED 40000 [2026-05-01,2026-05-31); W2 CONDITIONAL_PROGRESS APPLIED 60000 [2026-06-01,2026-06-30) — condition unmet (no VERIFIED payment received_at >= 2026-06-30)"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Alpha GC", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 10000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "CA Tower", state_code: "CA", county: "Los Angeles", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 1 Tract 1234", contract_value_cents: 1000000, approved_extras_cents: 200000, retainage_held_cents: 100000 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "Owner LLC", address: "1 Main St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_owner: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "GC Inc", address: "2 Main St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_gc: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_gc_l: $.data.id } }
            - { call: "POST /lien/parties/${p_gc_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "Bank NA", address: "3 Main St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_lender: $.data.id } }
            - { call: "POST /lien/parties/${p_owner}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_gc}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_lender}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { proj_v3: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${proj_v3}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_lender}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
            - { call: "POST /lien/notices/${n_id}/serve", payload: { served_at: "2026-05-20" }, as: OpsAgent }
            - { call: "POST /lien/notices/${n_id}/proof", payload: { result: "DELIVERED", proof_url: "https://proof/1" }, as: OpsAgent }
            - { call: "POST /lien/waivers", payload: { project_id: "${proj_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 40000, period_start: "2026-05-01", period_end: "2026-05-31" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { w1_id: $.data.id } }
            - { call: "POST /lien/waivers/${w1_id}/apply", payload: {}, as: OpsAgent }
            - { call: "POST /lien/waivers", payload: { project_id: "${proj_id}", waiver_type: "CONDITIONAL_PROGRESS", amount_cents: 60000, period_start: "2026-06-01", period_end: "2026-06-30" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { w2_id: $.data.id } }
            - { call: "POST /lien/waivers/${w2_id}/apply", payload: {}, as: OpsAgent }
            - { call: "POST /lien/payments", payload: { project_id: "${proj_id}", amount_cents: 300000, received_at: "2026-06-15" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /lien/payments/${p1_id}/verify", payload: {}, as: OpsAgent }
            - { call: "POST /lien/payments", payload: { project_id: "${proj_id}", amount_cents: 50000, received_at: "2026-06-20" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
          trigger:
            - { call: "POST /lien/lien-claims", payload: { project_id: "${proj_id}" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { claim_id: $.data.id, prov: $.data.provisional_amount_cents } }
            - { call: "POST /lien/lien-claims/${claim_id}/lock", payload: {}, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { fin: $.data.final_amount_cents, gross: $.data.gross_snapshot_cents, vpaid: $.data.verified_paid_cents, ewaiv: $.data.effective_waiver_cents } }
          assert:
            - "provisional_amount_cents == 750000"
            - "final_amount_cents == 760000"
            - "provisional_amount_cents != final_amount_cents"
            - "gross_snapshot_cents == 1100000"
            - "verified_paid_cents == 300000"
            - "effective_waiver_cents == 40000"
            - "LienClaim.${claim_id}.outstanding_cents == 760000"

      - name: punch_list_strict_vs_inclusive_last_furnishing
        grounds:
          - calculations.furnishing_date_determination
          - entities.Project.fields.last_furnishing_date
          - entities.JurisdictionRule.fields.counts_punch_list
        distinguishing_aspect: |
          Same two ACTIVE spans (BASE_CONTRACT ends 2026-06-10, PUNCH_LIST ends
          2026-06-20) on two projects produce different last_furnishing_date —
          and therefore different filing_window_end (2026-09-08 vs 2026-09-18) —
          purely from the rule's counts_punch_list variant flag. Entity domain is
          furnishing dates on Project, distinct from provisional_vs_final_claim_amount's
          LienClaim money domain.
        test_recipe:
          setup:
            - "One company; CA rule (counts_punch_list false) and NV rule (counts_punch_list true, otherwise identical: filing_window_days 90, prelim 20 CALENDAR)"
            - "CA project and NV project, each research-VERIFIED with identical ACTIVE spans: BASE_CONTRACT 2026-05-02..2026-06-10 and PUNCH_LIST 2026-05-15..2026-06-20"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Beta Sub", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 10000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "NV", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: true, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "CA Job", state_code: "CA", county: "Orange", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 7", contract_value_cents: 500000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_ca: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_ca}", party_role: "OWNER", legal_name: "O1", address: "1 A St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pca_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_ca}", party_role: "GC", legal_name: "G1", address: "2 A St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pca_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_ca}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pca_g_l: $.data.id } }
            - { call: "POST /lien/parties/${pca_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${pca_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${pca_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_ca}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_ca}/research-advance", payload: {}, as: OpsAgent, captures: { pca_v: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_ca}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pca_v}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "GET /lien/projects/${proj_ca}", payload: {}, as: OpsAgent, captures: { pca_v2: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_ca}", span_kind: "PUNCH_LIST", start_date: "2026-05-15", end_date: "2026-06-20", expected_project_version: "${pca_v2}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/projects", payload: { name: "NV Job", state_code: "NV", county: "Clark", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 9", contract_value_cents: 500000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_nv: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_nv}", party_role: "OWNER", legal_name: "O2", address: "1 B St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pnv_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_nv}", party_role: "GC", legal_name: "G2", address: "2 B St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pnv_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_nv}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pnv_g_l: $.data.id } }
            - { call: "POST /lien/parties/${pnv_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${pnv_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${pnv_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_nv}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_nv}/research-advance", payload: {}, as: OpsAgent, captures: { pnv_v: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_nv}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pnv_v}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "GET /lien/projects/${proj_nv}", payload: {}, as: OpsAgent, captures: { pnv_v2: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_nv}", span_kind: "PUNCH_LIST", start_date: "2026-05-15", end_date: "2026-06-20", expected_project_version: "${pnv_v2}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
          trigger:
            - { call: "GET /lien/projects/${proj_ca}/deadline-calendar", payload: {}, as: OpsAgent, captures: { ca_last: $.data.last_furnishing_date, ca_file_end: $.data.filing_window_end, ca_variant: $.data.last_furnishing_variant } }
            - { call: "GET /lien/projects/${proj_nv}/deadline-calendar", payload: {}, as: OpsAgent, captures: { nv_last: $.data.last_furnishing_date, nv_file_end: $.data.filing_window_end, nv_variant: $.data.last_furnishing_variant } }
          assert:
            - "CA project last_furnishing_date == '2026-06-10' (strict variant ignores the PUNCH_LIST span)"
            - "CA project filing_window_end == '2026-09-08'"
            - "NV project last_furnishing_date == '2026-06-20' (inclusive variant counts the PUNCH_LIST span)"
            - "NV project filing_window_end == '2026-09-18'"
            - "ca_variant != nv_variant"
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: final_amount_cap_min_max_branch
        grounds:
          - calculations.claimable_amount
          - entities.JurisdictionRule.fields.cap_mode
          - entities.JurisdictionRule.fields.retainage_claimable
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested min/max plus
          a rule-flag branch. Under CONTRACT_BALANCE the cap (contract 1000000 -
          verified 800000 = 200000) binds below the uncapped formula value
          (gross 1200000 - verified 800000 - waivers 50000 = 350000), so
          final_amount_cents == 200000; the companion instance is mode (b), not (a).
        test_recipe:
          setup:
            - "Verified WA COMMERCIAL_PRIVATE project (contract 1000000, extras 200000, retainage 0) under WA rule (cap_mode CONTRACT_BALANCE, retainage_claimable true, prelim required 20 CALENDAR days)"
            - "ACTIVE BASE_CONTRACT span 2026-05-02..2026-06-10; prelim notice to OWNER PROOF_CONFIRMED"
            - "P1 VERIFIED 800000 received 2026-06-05; W1 UNCONDITIONAL_PROGRESS APPLIED 50000 [2026-05-01,2026-05-31)"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Cap Co", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 10000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "WA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: true, cap_mode: "CONTRACT_BALANCE", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "WA Job", state_code: "WA", county: "King", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 3", contract_value_cents: 1000000, approved_extras_cents: 200000, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 C St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 C St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "3 C St" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_l: $.data.id } }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
            - { call: "POST /lien/notices/${n_id}/serve", payload: { served_at: "2026-05-20" }, as: OpsAgent }
            - { call: "POST /lien/notices/${n_id}/proof", payload: { result: "DELIVERED", proof_url: "https://proof/c" }, as: OpsAgent }
            - { call: "POST /lien/waivers", payload: { project_id: "${proj_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 50000, period_start: "2026-05-01", period_end: "2026-05-31" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { w_id: $.data.id } }
            - { call: "POST /lien/waivers/${w_id}/apply", payload: {}, as: OpsAgent }
            - { call: "POST /lien/payments", payload: { project_id: "${proj_id}", amount_cents: 800000, received_at: "2026-06-05" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { pay_id: $.data.id } }
            - { call: "POST /lien/payments/${pay_id}/verify", payload: {}, as: OpsAgent }
            - { call: "POST /lien/lien-claims", payload: { project_id: "${proj_id}" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /lien/lien-claims/${claim_id}/lock", payload: {}, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { fin: $.data.final_amount_cents, gross: $.data.gross_snapshot_cents, w2e: $.data.waived_to_extras_cents, w2c: $.data.waived_to_contract_cents } }
          assert:
            - "final_amount_cents == 200000 (cap 200000 binds below uncapped 350000)"
            - "gross_snapshot_cents == 1200000 (retainage_claimable true -> no retainage exclusion)"
            - "waived_to_extras_cents == 50000 (waterfall fills extras pool first)"
            - "waived_to_contract_cents == 0"

      - name: notice_fee_per_line_rounding
        grounds:
          - calculations.notice_fee_quote
          - entities.NoticeOrder.fields.fee_cents
          - entities.Company.fields.prepaid_balance_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round each line
          (round_half_up) THEN sum is pinned: LENDER recipient line
          round(1499*1.15)=1724, PERSONAL_SERVICE delivery line round(899*2.5)=2248,
          fee 3972; the forbidden sum-then-round order gives 3971. Distinct mode
          from final_amount_cap_min_max_branch (mode a).
        test_recipe:
          setup:
            - "Verified CA project with VERIFIED LENDER party; company prepaid balance exactly 10000000 before the notice order"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Fee Co", contact_email: "f@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
