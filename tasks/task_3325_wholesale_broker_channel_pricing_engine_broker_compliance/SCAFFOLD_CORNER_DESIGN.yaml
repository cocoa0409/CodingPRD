            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q921}", borrower_name: "Scaled Exposure Borrower", property_state: "TX", loan_amount_cents: 30000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { l921: $.data.id, b_v_sub921: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l921}/underwrite"
              payload: { expected_broker_version: "${b_v_sub921}" }
