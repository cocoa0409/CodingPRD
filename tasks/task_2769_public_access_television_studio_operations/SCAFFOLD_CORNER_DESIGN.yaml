              as_user_id: "${p_id}"
              captures: {indem_id: $.data.id, indem_ref: $.data.license_reference}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: true}
              as: Producer
              as_user_id: "${p_id}"
              captures: {missing_ref_err: $.data.error_id}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: true, license_reference: "ASCAP-2026-11824"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {copy_id: $.data.id, copy_ref: $.data.license_reference}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "CONTENT_POLICY", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
              captures: {policy_id: $.data.id, policy_seq: $.data.sequence_number}
            - call: "GET /programs/${prog_id}"
