              payload: { accepted: true }
              as: ServiceMember
              as_user_id: "${sm1_id}"
          trigger:
            - call: "GET /leases/${l1_id}/allotment-transactions?limit=2&offset=0"
              payload: {}
              as: PropertyManager
              captures: { p1_r0_type: "$.data[0].type", p1_r0_amt: "$.data[0].amount_cents", p1_r0_bal: "$.data[0].running_balance_cents", p1_r1_period: "$.data[1].period_month", p1_r1_bal: "$.data[1].running_balance_cents" }
            - call: "GET /leases/${l1_id}/allotment-transactions?limit=2&offset=2"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { p2_r0_type: "$.data[0].type", p2_r0_amt: "$.data[0].amount_cents", p2_r0_bal: "$.data[0].running_balance_cents" }
            - call: "GET /leases/${l1_id}/allotment-transactions?type=CHARGE&limit=10&offset=0"
              payload: {}
              as: PlatformAdmin
            - call: "GET /leases/${l1_id}/allotment-transactions?period_month=2026-09&limit=10&offset=0"
              payload: {}
              as: InstallationHousingOffice
              captures: { f2_r0_ref: "$.data[0].source_ref" }
            - call: "GET /leases/${l1_id}/allotment-transactions?type=CHARGE&period_month=2026-10&limit=10&offset=0"
              payload: {}
              as: PropertyManager
              captures: { f3_r0_bal: "$.data[0].running_balance_cents" }
            - call: "GET /leases/${l1_id}/allotment-transactions?type=REFUND&period_month=2026-09&limit=10&offset=0"
              payload: {}
              as: PropertyManager
            - call: "GET /leases/${l1_id}/allotment-transactions?limit=101&offset=0"
              payload: {}
              as: PropertyManager
              captures: { e_limit: "$.data.error_id" }
          assert:
            - "Page 1 (limit 2, offset 0) returns 2 rows and reports total_count 3 with has_more true - total_count reports the FILTERED-then-unpaged size, not the page size."
            - "${p1_r0_type} == CHARGE, ${p1_r0_amt} == 218150 and ${p1_r0_bal} == 218150; ${p1_r1_period} == 2026-10 and ${p1_r1_bal} == 436300 - the append-only order is created_at ASC and running_balance_cents is carried on the row rather than recomputed by the reader."
            - "Page 2 (limit 2, offset 2) returns exactly 1 row and reports total_count 3 with has_more false; that row is ${p2_r0_type} == REFUND with ${p2_r0_amt} == -5000 and ${p2_r0_bal} == 431300 - offset 2 resumes exactly where page 1 stopped and repeats nothing."
            - "The type=CHARGE read returns 2 rows and reports total_count 2 with has_more false - the type filter removes the REFUND row and total_count follows the filter rather than the whole ledger."
            - "The period_month=2026-09 read returns 1 row with total_count 1 and ${f2_r0_ref} == ALLOTMENT_RUN:2026-09 - the period filter matches the ops-run source_ref that produced the row."
            - "The type=CHARGE and period_month=2026-10 read returns 1 row with total_count 1 and ${f3_r0_bal} == 436300 - the two filters compose as AND rather than OR."
            - "The type=REFUND and period_month=2026-09 read returns an empty array with total_count 0 and HTTP 200, not a 404 - the REFUND row belongs to period 2026-10, so the AND of the two filters is genuinely empty."
            - "${e_limit} == ERR_INVALID_REQUEST with HTTP 400 - limit 101 exceeds the declared 1..100 ceiling and is refused by rung P4 before any row is read."

