              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "P1", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p1: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "P2", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p2: $.data.id }
            - call: "POST /science-fair/projects/${p1}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/projects/${p2}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p1}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${p2}/booth-assignments"
              payload: { hall: "A", booth_number: 2, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${p1}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/projects/${p2}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/fair-editions/${ed}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JV1", max_assignments: 9 }
              as: FairDirector
              captures: { j1: $.data.id }
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JV2", max_assignments: 9 }
              as: FairDirector
              captures: { j2: $.data.id }
            - call: "POST /science-fair/judges/${j1}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges/${j2}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p1}/judging-assignments"
              payload: { judge_id: "${j1}" }
              as: FairDirector
              captures: { a1: $.data.id }
            - call: "POST /science-fair/projects/${p1}/judging-assignments"
              payload: { judge_id: "${j2}" }
              as: FairDirector
              captures: { a2: $.data.id }
            - call: "POST /science-fair/projects/${p2}/judging-assignments"
              payload: { judge_id: "${j1}" }
              as: FairDirector
              captures: { b1: $.data.id }
            - call: "POST /science-fair/projects/${p2}/judging-assignments"
              payload: { judge_id: "${j2}" }
              as: FairDirector
              captures: { b2: $.data.id }
            - call: "POST /science-fair/judging-assignments/${a1}/score-sheets"
              payload: { raw_score: 95 }
              as: Judge
              as_user_id: "${j1}"
            - call: "POST /science-fair/judging-assignments/${a2}/score-sheets"
              payload: { raw_score: 97 }
              as: Judge
              as_user_id: "${j2}"
            - call: "POST /science-fair/judging-assignments/${b1}/score-sheets"
              payload: { raw_score: 60 }
              as: Judge
              as_user_id: "${j1}"
            - call: "POST /science-fair/judging-assignments/${b2}/score-sheets"
              payload: { raw_score: 62 }
              as: Judge
              as_user_id: "${j2}"
            - call: "POST /science-fair/awards"
              payload: { fair_edition_id: "${ed}", project_id: "${p1}", award_type: "CATEGORY_FIRST" }
              as: FairDirector
              captures: { aw: $.data.id }
            - call: "POST /science-fair/scholarship-pools"
              payload: { fair_edition_id: "${ed}", total_cents: 1000000 }
              as: FairDirector
            - call: "GET /science-fair/fair-editions/${ed}"
              payload: {}
              as: FairDirector
              captures: { ed_v: $.data.version }
            - call: "POST /science-fair/fair-editions/${ed}/publish-advancement"
              payload: { expected_fair_edition_version: "${ed_v}" }
              as: FairDirector
          trigger:
