              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 2, has_vehicle: true, vehicle_length_feet: 18 }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_id: $.data.id }
            - call: "POST /ferry/bookings/${b_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: ${cust_id}
            - call: "POST /ferry/sailings/${s_id}/cancel"
              payload: { cancel_reason: "WEATHER" }
              as: SchedulerAdmin
          trigger:
            - call: "POST /ferry/sailings/${s_id}/cancel"
              payload: { cancel_reason: "WEATHER" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Customer.${cust_id}.refund_credit_cents == 4200  # unchanged — cascade did not re-fire"

      - name: booking_depart_no_show_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.Sailing.BOARDING_to_DEPARTED, state_machines.Booking.CONFIRMED_to_NO_SHOW]
        distinguishing_aspect: "Departing a sailing flips CONFIRMED-but-never-checked-in bookings to NO_SHOW (fare forfeited, no refund credit) and releases their deck feet; CHECKED_IN bookings that boarded complete normally."
        test_recipe:
          setup: ["base setup; sailing OPEN; booking B1 CONFIRMED 18 ft; close -> begin-boarding"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
