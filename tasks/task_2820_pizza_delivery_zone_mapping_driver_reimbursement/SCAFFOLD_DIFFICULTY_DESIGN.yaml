  - rule_id: combinatorial_formula
    instances:

      - name: per_stop_rounding_before_summation_yields_332_not_331
        grounds:
          - calculations.dispatch_reimbursement
          - calculations.route_duration_model
          - entities.Dispatch.fields.estimated_reimbursement_cents
          - entities.Dispatch.fields.route_minutes
          - state_machines.Dispatch.STACKED_to_LOCKED
        distinguishing_aspect: |
          dispatch_reimbursement pins the ORDER of three operations that are
          individually simple: multiply-by-rate, round_half_up, and summation.
          Two stops of exactly 0.25 planned miles each give 0.25 * 62 = 15.5
          which rounds up to 16, so each stop is 150 + 16 = 166 and the dispatch
          total is 332. An implementation that sums the mileage first
          (0.50 * 62 = 31, + 2 * 150) produces 331 and an implementation that
          truncates instead of rounding half up produces 330. Only the pinned
          composition order and rounding mode together give 332.
        test_recipe:
          setup:
            - "A store with the ceiling-40 zone model and two IN_ZONE addresses at grid distance exactly 0.25 miles (one due north, one due west)."
            - "One CAR cost model with tier1 62c/mi and per_delivery 150."
            - "One QUALIFIED insured CAR driver."
            - "Two orders on those addresses, fee-disclosed and READY, stacked in sequence 1 and 2 onto one DRAFT dispatch."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
