              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/package"
              payload: { bags_produced: 120 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "GET /inventory-lots"
              payload: { production_run_id: "${run_a}" }
