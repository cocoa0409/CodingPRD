          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: Organizer, captures: { expired: "$.data.expired_agreement_ids" } }
            - { call: "POST /consignment-agreements/${agr_id}/counter", payload: { discount_pct: 0.42, return_cap_pct: 0.20, restocking_fee_pct: 0.12, markdown_allowance_pct: 0.20, freight_responsibility: PUBLISHER, offer_expiry_hours: 1, expected_agreement_version: "${agr_v}" }, as: PublisherRep, as_user_id: "${pub_id}", captures: { err: "$.data.error_id" } }
          assert:
