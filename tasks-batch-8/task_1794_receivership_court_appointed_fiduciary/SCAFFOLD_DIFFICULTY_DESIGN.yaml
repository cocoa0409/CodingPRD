              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 5000000 }
              as: Receiver
              captures: { eng_id: $.data.id }
            - call: "POST /v1/engagements/${eng_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { app1: $.data.id }
          trigger:
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { err2: $.data.error_id }
            - call: "POST /v1/fee-applications"
              payload: { engagement_id: "${eng_id}", period_start: "2026-08-31T00:00:00Z", period_end: "2026-09-30T00:00:00Z", time_entries: [ { hours: 1.0, rate_cents: 20000 } ], expenses_cents: 0 }
              as: Receiver
              captures: { st3: $.data.status }
          assert:
            - "${err2} == ERR_FEE_PERIOD_OVERLAP — [2026-08-15, 2026-09-15) intersects [2026-08-01, 2026-08-31)"
            - "${st3} == FILED — half-open adjacency at 2026-08-31 is NOT an overlap"

      - name: status_report_period_contiguity_required
        grounds:
          - calculations.reporting_calendar
          - entities.StatusReport.fields.period_start
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - errors[ERR_REPORT_PERIOD_GAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource (CASE): report
          periods must be GAP-FREE — period_start must equal the running
          next_report_period_start — in addition to non-overlap, with the
          overlap check evaluated before the gap check. A late-starting first
          report and a gap-skipping report both fail with
          ERR_REPORT_PERIOD_GAP; an intersecting period fails with
          ERR_REPORT_PERIOD_OVERLAP; only exact adjacency succeeds.
        test_recipe:
          setup:
            - "Case ACTIVE, appointment_effective_at 2026-08-01T00:00:00Z, interval 30 days; clock at default; no reports yet"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2016", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: PERIODIC, period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-14T00:00:00Z", narrative: "late start" }
              as: Receiver
              captures: { err1: $.data.error_id }
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: PERIODIC, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", narrative: "first period" }
              as: Receiver
              captures: { st2: $.data.status }
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: PERIODIC, period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", narrative: "overlapping" }
              as: Receiver
              captures: { err3: $.data.error_id }
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: PERIODIC, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", narrative: "gap skipping" }
              as: Receiver
              captures: { err4: $.data.error_id }
            - call: "POST /v1/status-reports"
              payload: { case_id: "${case_id}", report_type: PERIODIC, period_start: "2026-08-31T00:00:00Z", period_end: "2026-09-30T00:00:00Z", narrative: "second period" }
              as: Receiver
              captures: { st5: $.data.status }
          assert:
            - "${err1} == ERR_REPORT_PERIOD_GAP — first period must start at the appointment effective time"
            - "${st2} == FILED — anchored first period accepted"
            - "${err3} == ERR_REPORT_PERIOD_OVERLAP — overlap is evaluated before the gap rule"
            - "${err4} == ERR_REPORT_PERIOD_GAP — start 2026-09-01 skips past next expected start 2026-08-31"
            - "${st5} == FILED — exact adjacency at 2026-08-31 satisfies contiguity"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_pay_void_conserves_estate_cash
        grounds:
          - calculations.estate_cash_position
          - state_machines.DistributionPayment.SCHEDULED_to_PAID
          - state_machines.DistributionPayment.PAID_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: ESTATE CASH ACCOUNTABILITY — cash_on_hand +
          paid fees + net paid distributions + approved expenditures must equal
          total liquidation proceeds at all times. Forward action pay (cash
          50000 -> 20000) paired with its compensating action void (cash
          20000 -> 50000) returns the quantity to its exact pre-pay value.
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default; cash 50000 from one liquidated asset"
            - "Claims G1 GENERAL 30000, G2 GENERAL 20000, both ALLOWED"
            - "Plan APPROVED with reserve 0: pool 50000 covers both in full -> P1 SCHEDULED 30000, P2 SCHEDULED 20000 (P2 keeps the plan APPROVED while P1 is paid/voided)"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2017", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/assets"
              payload: { case_id: "${case_id}", description: "Operating account", asset_class: CASH, estimated_value_cents: 50000 }
              as: Receiver
              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor One", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 30000 }
              as: Creditor
              captures: { g1: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor Two", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 20000 }
              as: Creditor
              captures: { g2: $.data.id }
            - call: "POST /v1/claims/${g1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 30000 }
              as: Receiver
            - call: "POST /v1/claims/${g2}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 20000 }
              as: Receiver
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 0 }
              as: Receiver
              captures: { plan_id: $.data.id }
            - call: "POST /v1/distribution-plans/${plan_id}/decide"
              payload: { decision: APPROVE }
              as: Court
            - call: "GET /v1/claims/${g1}/payments"
              as: Receiver
              captures: { p1_id: "$.data[0].id" }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash0: $.data.cash_on_hand_cents, v0: $.data.version }
          trigger:
            - call: "POST /v1/distribution-payments/${p1_id}/pay"
              payload: { expected_case_version: "${v0}" }
              as: Receiver
              captures: { st1: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash1: $.data.cash_on_hand_cents }
            - call: "POST /v1/distribution-payments/${p1_id}/void"
              payload: {}
              as: Court
              captures: { st2: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { cash2: $.data.cash_on_hand_cents }
          assert:
            - "${st1} == PAID and ${st2} == VOIDED"
            - "${cash0} == 50000, ${cash1} == 20000, ${cash2} == 50000 — forward + compensating action leaves estate cash exactly unchanged"
            - "Invariant after the pair: cash 50000 + paid fees 0 + net paid distributions 0 + approved expenditures 0 == liquidation proceeds 50000"

      - name: determine_reconsider_conserves_claim_exposure
        grounds:
          - calculations.claim_priority_determination
          - state_machines.Claim.ALLOWED_to_FILED
          - entities.Case.fields.allowed_claims_total_cents
        distinguishing_aspect: |
          Conserved quantity: CLAIM-DOLLAR EXPOSURE (a different quantity type
          than estate cash) — allowed_claims_total_cents plus the filed amounts
          of still-FILED claims is invariant at 100000 across the forward
          determination (moves 40000 from the undetermined bucket into the
          allowed total) and its compensating reconsideration (moves it back).
        test_recipe:
          setup:
            - "Case ACTIVE; clock at default"
            - "Claim D1 GENERAL 40000 FILED; claim D2 GENERAL 60000 FILED"
            - "Exposure Q = allowed_claims_total_cents + sum(filed_amount_cents over FILED claims) == 100000"
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-2018", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor D1", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 40000 }
              as: Creditor
              captures: { d1: $.data.id }
            - call: "POST /v1/claims"
              payload: { case_id: "${case_id}", creditor_name: "Creditor D2", creditor_type: GENERAL_UNSECURED, filed_amount_cents: 60000 }
              as: Creditor
              captures: { d2: $.data.id }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { tot0: $.data.allowed_claims_total_cents }
          trigger:
            - call: "POST /v1/claims/${d1}/determine"
              payload: { determination: ALLOWED, allowed_amount_cents: 40000 }
              as: Receiver
              captures: { st1: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { tot1: $.data.allowed_claims_total_cents }
            - call: "POST /v1/claims/${d1}/reconsider"
              payload: {}
              as: Court
              captures: { st2: $.data.status }
            - call: "GET /v1/cases/${case_id}"
              as: Receiver
              captures: { tot2: $.data.allowed_claims_total_cents }
          assert:
            - "${tot0} == 0 (Q == 0 + (40000 + 60000) == 100000)"
            - "${st1} == ALLOWED and ${tot1} == 40000 (Q == 40000 + 60000 == 100000)"
            - "${st2} == FILED and ${tot2} == 0 (Q == 0 + 100000 == 100000)"
            - "The conserved exposure quantity is unchanged by the forward/compensating pair"
