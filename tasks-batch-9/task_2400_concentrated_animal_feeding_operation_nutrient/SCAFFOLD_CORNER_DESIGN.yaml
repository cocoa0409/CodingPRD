      - name: annual_report_variance_tolerance_is_inclusive_at_minus_fifteen
        claim_type: aggregation
        grounds:
          - calculations.annual_report_mass_balance
          - validations[priority=41]
          - validations[priority=36]
          - errors.ERR_VARIANCE_EXPLANATION_REQUIRED
          - errors.ERR_REPORT_PERIOD_DUPLICATE
        distinguishing_aspect: |
          With no events at all, the mass balance reduces to the storage delta, which lets the
          variance be pinned to exactly -15.00 (WITHIN_TOLERANCE by the inclusive comparison) and to
          -15.09 one step outside it; the outside case then blocks submission until an explanation is
          supplied at create time, and a second 2026 report is a duplicate period.
        test_recipe:
          setup:
            - "Willow Creek Dairy with a COVERED permit and a DRAFT 2026 plan; design_annual_manure_gallons is 3374298.00 and 15 % of it is 506144.70"
            - "No application events and no transfers exist, so recorded_total_gallons equals ending_storage_gallons - beginning_storage_gallons"
