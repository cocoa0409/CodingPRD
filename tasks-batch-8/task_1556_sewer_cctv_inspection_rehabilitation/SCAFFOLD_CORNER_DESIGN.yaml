scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: district_create_applies_defaults_and_computed_zero
        claim_type: defaults
        grounds:
          - entities.SewerDistrict.fields.notice_lead_hours
          - entities.SewerDistrict.fields.warranty_months
          - entities.SewerDistrict.fields.budget_committed_cents
        distinguishing_aspect: "Omitting notice_lead_hours/warranty_months yields defaults 48/12 and computed budget_committed_cents starts 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sewer/districts"
              payload: { name: "D-E1", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id, nlh: $.data.notice_lead_hours, wm: $.data.warranty_months, bc: $.data.budget_committed_cents }
          assert:
            - "notice_lead_hours == 48 and warranty_months == 12 (defaults applied)"
            - "budget_committed_cents == 0 (computed initial)"
            - "response envelope has meta.api_request_id and response_type == 'object'"
      - name: segment_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.PipeSegment.fields.diameter_mm
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST segment without diameter_mm -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["district exists"]
          setup_api_calls:
            - call: "POST /sewer/districts"
              payload: { name: "D-E2", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INVALID_REQUEST' and http status 400"
      - name: segment_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - entities.PipeSegment.fields.structural_grade
          - entities.PipeSegment.fields.rehab_status
        distinguishing_aspect: "Client-supplied structural_grade/rehab_status on create are ignored; server values 0/NONE persist."
        test_recipe:
          setup: ["district exists"]
          setup_api_calls:
            - call: "POST /sewer/districts"
              payload: { name: "D-E3", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { sg: $.data.structural_grade, rs: $.data.rehab_status, om: $.data.om_grade }
          assert:
            - "structural_grade == 0, om_grade == 0, rehab_status == 'NONE' regardless of any client attempt to set them"
      - name: defect_observation_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.DefectObservation
        distinguishing_aspect: "DefectObservation has common_fields: false — response has id + created_at but NO version/updated_at; no PATCH endpoint exists for it."
        test_recipe:
          setup: ["inspection in CODING"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-E4", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "C E4", nassco_cert_number: "PACP-CE4", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-E4", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T06:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
          trigger:
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "CRK", family: "STRUCTURAL", grade: 2, distance_m: 10, clock_position: 6 }
              as: Coder
              as_user_id: "${tc_id}"
              captures: { def_id: $.data.id, ext: $.data.extent_m }
          assert:
            - "response contains id and created_at; no 'version' key present (common_fields: false)"
            - "extent_m defaults to 0 when omitted"
      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a random UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sewer/segments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: DistrictEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_NOT_FOUND' and http status 404"
      - name: pagination_defaults_on_list_endpoint
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /sewer/districts with no params returns limit=10/offset=0 envelope fields total_count and has_more."
        test_recipe:
          setup: ["one district created"]
          setup_api_calls:
            - call: "POST /sewer/districts"
              payload: { name: "D-E6", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
          trigger:
            - call: "GET /sewer/districts"
              payload: {}
              as: DistrictEngineer
          assert:
            - "response_type == 'array' and meta/envelope carries pagination fields limit=10, offset=0, total_count == 1, has_more == false"
  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: inspection_initial_state_scheduled
        claim_type: initial_state
        grounds:
          - state_machines.CctvInspection
        distinguishing_aspect: "New CctvInspection starts in SCHEDULED with reject_count 0."
        test_recipe:
          setup: ["district, open cycle, coder"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-S1", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "C S1", nassco_cert_number: "PACP-CS1X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-S1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T06:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { st: $.data.status, rc: $.data.reject_count }
          assert:
            - "status == 'SCHEDULED' and reject_count == 0 and certified_at is null"
      - name: certified_inspection_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CctvInspection
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From CERTIFIED every further transition (start/reject/void/certify) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["certified inspection exists"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-S2", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "C S2", nassco_cert_number: "PACP-CS2X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Q S2", nassco_cert_number: "PACP-QS2X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-S2", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T06:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "CRK", family: "STRUCTURAL", grade: 2, distance_m: 10, clock_position: 6 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/certify"
              payload: {}
              as: QaReviewer
              as_user_id: "${tq_id}"
          trigger:
            - call: "POST /sewer/cctv-inspections/${i_id}/reject"
              payload: {}
              as: QaReviewer
              as_user_id: "${tq_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INVALID_STATE' (CERTIFIED is terminal)"
      - name: third_qa_reject_auto_voids_inspection
        claim_type: side_effect_execution
        grounds:
          - state_machines.CctvInspection.QA_REVIEW_to_VOIDED
          - entities.CctvInspection.fields.reject_count
        distinguishing_aspect: "Reject with reject_count already 2 drives the system auto-void path: status VOIDED, reject_count 3."
        test_recipe:
          setup: ["inspection in QA_REVIEW having been rejected twice already"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-S3", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "C S3", nassco_cert_number: "PACP-CS3X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Q S3", nassco_cert_number: "PACP-QS3X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-S3", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T06:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "CRK", family: "STRUCTURAL", grade: 2, distance_m: 10, clock_position: 6 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/reject"
              payload: { reason: "r1" }
              as: QaReviewer
              as_user_id: "${tq_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/reject"
              payload: { reason: "r2" }
              as: QaReviewer
              as_user_id: "${tq_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
          trigger:
            - call: "POST /sewer/cctv-inspections/${i_id}/reject"
              payload: { reason: "r3" }
              as: QaReviewer
              as_user_id: "${tq_id}"
              captures: { st: $.data.status, rc: $.data.reject_count }
          assert:
            - "status == 'VOIDED' and reject_count == 3 (third rejection routes through the system auto-void transition, not back to CODING)"
      - name: cycle_close_blocked_by_open_inspections
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InspectionCycle.OPEN_to_CLOSED
          - errors[ERR_INSPECTIONS_OPEN]
        distinguishing_aspect: "Closing a cycle with a non-terminal inspection fails ERR_INSPECTIONS_OPEN."
        test_recipe:
          setup: ["open cycle with one SCHEDULED inspection"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-S4", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "C S4", nassco_cert_number: "PACP-CS4X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-S4", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T06:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
          trigger:
            - call: "POST /sewer/inspection-cycles/${cy_id}/close"
              payload: {}
              as: DistrictEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INSPECTIONS_OPEN'"
      - name: notice_expiry_sweep_on_clock_advance
        claim_type: side_effect_execution
        grounds:
          - state_machines.CustomerNotice.QUEUED_to_EXPIRED
        distinguishing_aspect: "Advancing the logical clock past event_start auto-expires a still-QUEUED notice (system transition evaluated on clock set)."
        test_recipe:
          setup: ["work order W ISSUED under approved CIPP plan; notice N QUEUED with event_start 2026-08-15T00:00:00Z"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
