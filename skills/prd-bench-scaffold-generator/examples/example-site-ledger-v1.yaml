# =============================================================================
# Example: site-ledger benchmark seed tables (v1)
# =============================================================================

scenario: |
  Construction project management system. Manages work items through planning,
  execution, and completion with labor budgets, permits by trade, inspections
  (safety/quality), change orders, and zone access control. Projects carry a
  derived posture (OPEN/REVIEW/STOP_WORK) based on inspections, permits, and
  budget health. Considerations: role-based access (foreman/inspector/manager),
  idempotency, optimistic concurrency via version field, posture-gated field operations,
  zone occupancy, and change order freeze/apply mechanics.

domain_name: site-ledger
api_prefix: /projects

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: labor_budget_hours, type: number, source: input, description: "Total labor budget in hours" }
      - { name: posture, type: enum, source: computed, description: "OPEN | REVIEW | STOP_WORK — derived from inspections, permits, and budget" }
      - { name: labor_reserved_hours, type: number, source: computed, description: "Sum of estimated_hours for READY work items" }
      - { name: labor_committed_hours, type: number, source: computed, description: "Sum of estimated_hours for IN_PROGRESS work items" }
      - { name: labor_used_hours, type: number, source: computed, description: "Sum of actual_hours for DONE work items" }
      - { name: labor_available_hours, type: number, source: computed, description: "labor_budget_hours - reserved - committed - used" }
      - { name: permits, type: array, source: system, description: "Lightweight list of permits for the project" }

  - name: WorkItem
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: title, type: string, source: input, description: "Work item title" }
      - { name: trade, type: enum, source: input, description: "ELECTRICAL | PLUMBING | STRUCTURAL | GENERAL" }
      - { name: zone, type: enum, source: input, description: "e.g. ZONE_A, ZONE_B, ZONE_C" }
      - { name: criticality, type: enum, source: input, description: "STANDARD | CRITICAL" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated hours for the work" }
      - { name: actual_hours, type: number, source: input, required: false, description: "Reported hours on completion" }
      - { name: status, type: enum, source: system, description: "DRAFT → READY → IN_PROGRESS → DONE / CANCELLED" }
      - { name: is_startable, type: boolean, source: computed, description: "Whether the work item can currently be started" }
      - { name: start_blockers, type: array, source: computed, description: "List of blockers: POSTURE, PERMIT, ZONE, CHANGE_ORDER, SAFETY" }
      - { name: latest_safety_status, type: enum, source: computed, required: false, description: "Latest non-voided safety inspection result" }
      - { name: latest_quality_status, type: enum, source: computed, required: false, description: "Latest non-voided quality inspection result" }

  - name: Permit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: trade, type: enum, source: input, description: "ELECTRICAL | PLUMBING | STRUCTURAL" }
      - { name: status, type: enum, source: system, description: "REQUESTED → GRANTED / REVOKED" }
      - { name: replaces_permit_id, type: string, source: input, required: false, description: "ID of revoked permit being replaced" }

  - name: Inspection
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: work_item_id, type: string, source: input, description: "Associated work item ID" }
      - { name: kind, type: enum, source: input, description: "SAFETY | QUALITY" }
      - { name: status, type: enum, source: system, description: "PLANNED → PASSED / FAILED / VOIDED" }
      - { name: outcome, type: enum, source: input, required: false, description: "PASSED | FAILED (set on submit)" }

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: work_item_id, type: string, source: input, description: "Associated work item ID" }
      - { name: summary, type: string, source: input, description: "Change order summary" }
      - { name: labor_budget_hours_delta, type: number, source: input, required: false, description: "Budget adjustment amount" }
      - { name: new_estimated_hours, type: number, source: input, required: false, description: "New estimated hours for the work item" }
      - { name: new_trade, type: enum, source: input, required: false, description: "New trade for the work item" }
      - { name: new_zone, type: enum, source: input, required: false, description: "New zone for the work item" }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED → APPLIED / CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    field: posture
    derivation: |
      1) STOP_WORK when any active work item has latest_safety_status=FAILED
      2) STOP_WORK when a trade has current permit REVOKED and active work items for that trade in READY or IN_PROGRESS
      3) REVIEW when 2+ distinct active work items have latest_quality_status=FAILED
      4) REVIEW when labor_available_hours < 20
      5) Otherwise OPEN
      "Active work" = not DONE and not CANCELLED.
      Recalculates after permits, inspections, budget changes, and work item status changes.

  - name: WorkItem
    entity: WorkItem
    initial_state: DRAFT
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: POST /projects/:project_id/work_items/:work_item_id/ready
        actor: foreman
        preconditions:
          - "Posture is not STOP_WORK"
          - "Non-GENERAL trade requires current permit in GRANTED (ERR_PERMIT_REQUIRED)"
          - "labor_available_hours >= estimated_hours (ERR_LABOR_BUDGET_EXCEEDED)"
        side_effects:
          - "labor_reserved_hours increases by estimated_hours"
          - "labor_available_hours decreases"

      - from: READY
        to: IN_PROGRESS
        trigger: POST /projects/:project_id/work_items/:work_item_id/start
        actor: foreman
        preconditions:
          - "Posture is not STOP_WORK"
          - "If posture is REVIEW: latest_safety_status must be PASSED"
          - "Work item not frozen by approved change order (ERR_WORK_ITEM_FROZEN)"
          - "Zone access: at most one non-GENERAL item IN_PROGRESS per zone (ERR_ZONE_OCCUPIED)"
        side_effects:
          - "labor_reserved_hours decreases, labor_committed_hours increases by estimated_hours"

      - from: IN_PROGRESS
        to: DONE
        trigger: POST /projects/:project_id/work_items/:work_item_id/complete
        actor: foreman
        preconditions:
          - "Posture is not STOP_WORK"
          - "CRITICAL items: latest_quality_status must be PASSED (ERR_QUALITY_FAILED_BLOCKING)"
          - "actual_hours must not cause labor budget to be exceeded (ERR_LABOR_BUDGET_EXCEEDED)"
        side_effects:
          - "labor_committed_hours decreases by estimated_hours"
          - "labor_used_hours increases by actual_hours"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /projects/:project_id/work_items/:work_item_id/cancel
        actor: foreman
        preconditions: []
        side_effects:
          - "Any open change order (PROPOSED/APPROVED) → CANCELLED"

      - from: READY
        to: CANCELLED
        trigger: POST /projects/:project_id/work_items/:work_item_id/cancel
        actor: foreman
        preconditions: []
        side_effects:
          - "labor_reserved_hours decreases by estimated_hours"
          - "Any open change order → CANCELLED"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: POST /projects/:project_id/work_items/:work_item_id/cancel
        actor: foreman
        preconditions: []
        side_effects:
          - "labor_committed_hours decreases by estimated_hours"
          - "Any open change order → CANCELLED"

      - from: READY
        to: DRAFT
        trigger: "system (scope change applied via change order)"
        actor: system
        preconditions: []
        side_effects:
          - "labor_reserved_hours decreases by old estimated_hours"
          - "Planning values updated (estimated_hours, trade, zone)"
          - "Inspection trail voided for posture purposes"

  - entity: Permit
    initial_state: REQUESTED
    terminal_states: [GRANTED, REVOKED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: POST /projects/:project_id/permits/:permit_id/decide (decision=GRANT)
        actor: manager
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: REVOKED
        trigger: POST /projects/:project_id/permits/:permit_id/decide (decision=REVOKE)
        actor: manager
        preconditions: []
        side_effects:
          - "Posture may change to STOP_WORK if active work items exist for that trade"

  - entity: Inspection
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, VOIDED]
    transitions:
      - from: PLANNED
        to: PASSED
        trigger: POST /projects/:project_id/inspections/:inspection_id/submit (outcome=PASSED)
        actor: inspector
        preconditions: []
        side_effects:
          - "Work item latest_safety_status or latest_quality_status updated"
          - "Posture recalculates"

      - from: PLANNED
        to: FAILED
        trigger: POST /projects/:project_id/inspections/:inspection_id/submit (outcome=FAILED)
        actor: inspector
        preconditions: []
        side_effects:
          - "Safety failure → posture may become STOP_WORK"
          - "Quality failure → may contribute to REVIEW"

      - from: PASSED
        to: VOIDED
        trigger: POST /projects/:project_id/inspections/:inspection_id/void
        actor: manager
        preconditions: []
        side_effects:
          - "Voided inspection ignored for 'current' inspection determination"
          - "Posture recalculates"

      - from: FAILED
        to: VOIDED
        trigger: POST /projects/:project_id/inspections/:inspection_id/void
        actor: manager
        preconditions: []
        side_effects:
          - "Same as PASSED → VOIDED"

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /projects/:project_id/change_orders/:change_order_id/approve
        actor: manager
        preconditions: []
        side_effects:
          - "Associated work item becomes frozen (ERR_WORK_ITEM_FROZEN on advance attempts)"

      - from: APPROVED
        to: APPLIED
        trigger: POST /projects/:project_id/change_orders/:change_order_id/apply
        actor: manager
        preconditions:
          - "Budget delta must not drop budget below reserved+committed+used (ERR_LABOR_BUDGET_EXCEEDED)"
          - "Scope change only allowed if work item is DRAFT or READY (ERR_SCOPE_CHANGE_NOT_ALLOWED)"
        side_effects:
          - "Budget change: labor_budget_hours adjusted"
          - "Scope change: work item resets to DRAFT with new values, releases reserved hours"
          - "Scope change: inspection trail voided for posture"
          - "Work item unfreezes"

      - from: PROPOSED
        to: CANCELLED
        trigger: POST /projects/:project_id/change_orders/:change_order_id/cancel
        actor: manager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: POST /projects/:project_id/change_orders/:change_order_id/cancel
        actor: manager
        preconditions: []
        side_effects:
          - "Work item unfreezes immediately"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: labor_accounting
    trigger: "work item status changes (DRAFT→READY, READY→IN_PROGRESS, IN_PROGRESS→DONE, cancellation)"
    algorithm: bucket_transfer
    formula: |
      DRAFT → READY: labor_reserved_hours += estimated_hours
      READY → IN_PROGRESS: labor_reserved_hours -= estimated_hours; labor_committed_hours += estimated_hours
      IN_PROGRESS → DONE: labor_committed_hours -= estimated_hours; labor_used_hours += actual_hours
      READY → CANCELLED: labor_reserved_hours -= estimated_hours
      IN_PROGRESS → CANCELLED: labor_committed_hours -= estimated_hours
      labor_available_hours = labor_budget_hours - labor_reserved_hours - labor_committed_hours - labor_used_hours

  - name: posture_derivation
    trigger: "permit decisions, inspection submissions/voids, budget changes, work item status changes, change order apply"
    algorithm: priority_rules
    formula: |
      1) STOP_WORK if any active work item has latest_safety_status=FAILED
      2) STOP_WORK if a trade's current permit is REVOKED and active work items for that trade exist in READY/IN_PROGRESS
      3) REVIEW if 2+ distinct active work items have latest_quality_status=FAILED
      4) REVIEW if labor_available_hours < 20
      5) Otherwise OPEN

  - name: zone_occupancy
    trigger: "work item start"
    algorithm: constraint
    formula: |
      Per zone, at most one non-GENERAL work item may be IN_PROGRESS.
      GENERAL work items are exempt (don't block and aren't blocked).

  - name: current_permit
    trigger: "permit creation and decisions"
    algorithm: latest
    formula: |
      For each trade, the current permit is the permit with greatest Permit.created_at for that trade.
      Creating a new permit for a trade where the current permit is not REVOKED → ERR_PERMIT_ALREADY_EXISTS.
      If current permit is REVOKED, replacement must include replaces_permit_id → ERR_PERMIT_REPLACEMENT_REQUIRED.

  - name: current_inspection
    trigger: "inspection creation, submission, void"
    algorithm: latest_non_voided
    formula: |
      Per work item and kind, the current inspection is the non-VOIDED inspection with greatest Inspection.created_at.
      Only one PLANNED inspection per work item per kind at a time (ERR_INSPECTION_ALREADY_PLANNED).

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: idempotency
    check: "POST requests must include Idempotency-Key"
    error_id: ERR_MISSING_IDEMPOTENCY_KEY
    http_status: 400
    applies_to: all POST endpoints

  - priority: 3
    category: idempotency
    check: "Idempotency key reused with different request body"
    error_id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http_status: 409
    applies_to: all POST endpoints

  - priority: 4
    category: existence
    check: "Resource IDs in path must exist (within the correct project)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints

  - priority: 5
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 6
    category: posture
    check: "Project posture must allow the operation (STOP_WORK blocks create/ready/start/complete)"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 409
    applies_to: "create work items, ready, start, complete"

  - priority: 7
    category: concurrency
    check: "If-Match header required for work item transitions and change order transitions"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 428
    applies_to: "work item transitions, change order transitions"

  - priority: 7b
    category: concurrency
    check: "version in request must match current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 412
    applies_to: "work item transitions, change order transitions"

  - priority: 8
    category: state
    check: "Resource must be in the correct state for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 9
    category: business
    check: "Domain rule failures (budget, permits, zones, inspections, change orders)"
    error_id: "varies (ERR_LABOR_BUDGET_EXCEEDED, ERR_PERMIT_REQUIRED, ERR_ZONE_OCCUPIED, etc.)"
    http_status: varies
    applies_to: various

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (18 endpoints)
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a new Project"
    roles: [MANAGER]
    code: 201
    input: [name, labor_budget_hours]
    output: Project
    side_effects: ["posture=OPEN, labor fields initialized to 0"]

  - method: GET
    path: "/projects/:project_id"
    description: "Get a specific Project"
    roles: [FOREMAN, INSPECTOR, MANAGER]
    code: 200
    input: []
    output: Project
    side_effects: []

  # --- WorkItem ---
  - method: POST
    path: "/projects/:project_id/work_items"
    description: "Create a new Work Item"
    roles: [FOREMAN]
    code: 201
    input: [title, trade, zone, criticality, estimated_hours]
    output: WorkItem
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/projects/:project_id/work_items/:work_item_id"
    description: "Get a specific Work Item"
    roles: [FOREMAN, INSPECTOR, MANAGER]
    code: 200
    input: []
    output: WorkItem
    side_effects: []

  - method: POST
    path: "/projects/:project_id/work_items/:work_item_id/ready"
    description: "Move work item from DRAFT to READY"
    roles: [FOREMAN]
    code: 200
    input: []
    output: WorkItem
    side_effects:
      - "status → READY"
      - "labor_reserved_hours increases"
      - "Requires permit for non-GENERAL trade"

  - method: POST
    path: "/projects/:project_id/work_items/:work_item_id/start"
    description: "Start a READY work item"
    roles: [FOREMAN]
    code: 200
    input: []
    output: WorkItem
    side_effects:
      - "status → IN_PROGRESS"
      - "labor_reserved decreases, labor_committed increases"
      - "Zone occupancy enforced"

  - method: POST
    path: "/projects/:project_id/work_items/:work_item_id/complete"
    description: "Complete an IN_PROGRESS work item"
    roles: [FOREMAN]
    code: 200
    input: [actual_hours]
    output: WorkItem
    side_effects:
      - "status → DONE"
      - "labor_committed decreases, labor_used increases"

  - method: POST
    path: "/projects/:project_id/work_items/:work_item_id/cancel"
    description: "Cancel a work item (from DRAFT, READY, or IN_PROGRESS)"
    roles: [FOREMAN]
    code: 200
    input: []
    output: WorkItem
    side_effects:
      - "status → CANCELLED"
      - "Releases reserved/committed hours"
      - "Open change orders → CANCELLED"

  # --- Permit ---
  - method: POST
    path: "/projects/:project_id/permits"
    description: "Create a permit for a trade"
    roles: [FOREMAN]
    code: 201
    input: [trade, "replaces_permit_id?"]
    output: Permit
    side_effects: ["status=REQUESTED"]

  - method: POST
    path: "/projects/:project_id/permits/:permit_id/decide"
    description: "Decide on a permit (GRANT or REVOKE)"
    roles: [MANAGER]
    code: 200
    input: [decision]
    output: Permit
    side_effects:
      - "status → GRANTED or REVOKED"
      - "Posture recalculates"

  # --- Inspection ---
  - method: POST
    path: "/projects/:project_id/inspections"
    description: "Create an inspection for a work item"
    roles: [INSPECTOR]
    code: 201
    input: [work_item_id, kind]
    output: Inspection
    side_effects: ["status=PLANNED"]

  - method: POST
    path: "/projects/:project_id/inspections/:inspection_id/submit"
    description: "Submit inspection result"
    roles: [INSPECTOR]
    code: 200
    input: [outcome]
    output: Inspection
    side_effects:
      - "status → PASSED or FAILED"
      - "Work item latest_safety_status / latest_quality_status updated"
      - "Posture recalculates"

  - method: POST
    path: "/projects/:project_id/inspections/:inspection_id/void"
    description: "Void an inspection"
    roles: [MANAGER]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "status → VOIDED"
      - "Ignored for current inspection determination"
      - "Posture recalculates"

  # --- ChangeOrder ---
  - method: POST
    path: "/projects/:project_id/change_orders"
    description: "Create a change order for a work item"
    roles: [MANAGER]
    code: 201
    input: [work_item_id, summary, "labor_budget_hours_delta?, new_estimated_hours?, new_trade?, new_zone?"]
    output: ChangeOrder
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/projects/:project_id/change_orders/:change_order_id"
    description: "Get a specific Change Order"
    roles: [FOREMAN, INSPECTOR, MANAGER]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/projects/:project_id/change_orders/:change_order_id/approve"
    description: "Approve a change order"
    roles: [MANAGER]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status → APPROVED"
      - "Work item becomes frozen"

  - method: POST
    path: "/projects/:project_id/change_orders/:change_order_id/apply"
    description: "Apply an approved change order"
    roles: [MANAGER]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status → APPLIED"
      - "Budget and/or scope changes applied"
      - "Scope change: work item resets to DRAFT"
      - "Work item unfreezes"

  - method: POST
    path: "/projects/:project_id/change_orders/:change_order_id/cancel"
    description: "Cancel a change order"
    roles: [MANAGER]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status → CANCELLED"
      - "If was approved: work item unfreezes"

# =============================================================================
# Table 6: Error Code Catalogue (21 error codes)
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General request format error"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not allowed for this operation"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource with given ID does not exist (or wrong project)"

  - id: ERR_MISSING_IDEMPOTENCY_KEY
    http: 400
    condition: "POST request missing Idempotency-Key header"

  - id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http: 409
    condition: "Idempotency key reused with different request body"

  - id: ERR_MISSING_IF_MATCH
    http: 428
    condition: "Required If-Match header missing"

  - id: ERR_VERSION_MISMATCH
    http: 412
    condition: "version in request does not match current version"

  - id: ERR_POSTURE_BLOCKED
    http: 409
    condition: "Project is in STOP_WORK posture; operation blocked"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the correct state for this operation"

  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 409
    condition: "Operation would cause labor budget to be exceeded"

  - id: ERR_PERMIT_ALREADY_EXISTS
    http: 409
    condition: "Current permit for trade is not REVOKED; cannot create another"

  - id: ERR_PERMIT_REPLACEMENT_REQUIRED
    http: 409
    condition: "Current permit is REVOKED; replacement must include replaces_permit_id"

  - id: ERR_PERMIT_REQUIRED
    http: 409
    condition: "Non-GENERAL trade requires a current GRANTED permit"

  - id: ERR_ZONE_OCCUPIED
    http: 409
    condition: "Another non-GENERAL work item is already IN_PROGRESS in this zone"

  - id: ERR_INSPECTION_ALREADY_PLANNED
    http: 409
    condition: "A PLANNED inspection of this kind already exists for this work item"

  - id: ERR_WORK_ITEM_FROZEN
    http: 409
    condition: "Work item is frozen due to an approved change order"

  - id: ERR_QUALITY_FAILED_BLOCKING
    http: 409
    condition: "CRITICAL work item cannot complete: latest_quality_status is not PASSED"

  - id: ERR_CHANGE_ORDER_CONFLICT
    http: 409
    condition: "Work item already has an open change order (PROPOSED or APPROVED)"

  - id: ERR_CHANGE_ORDER_NOT_APPROVED
    http: 409
    condition: "Change order must be APPROVED to apply"

  - id: ERR_SCOPE_CHANGE_NOT_ALLOWED
    http: 409
    condition: "Scope change only allowed while work item is DRAFT or READY"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: FOREMAN
    description: "Field supervisor managing work items and permits"
    exclusive_operations:
      - "POST /projects/:project_id/work_items — Create work item"
      - "POST .../work_items/:id/ready — Move to READY"
      - "POST .../work_items/:id/start — Start work"
      - "POST .../work_items/:id/complete — Complete work"
      - "POST .../work_items/:id/cancel — Cancel work"
      - "POST /projects/:project_id/permits — Create permit"

  - name: INSPECTOR
    description: "Inspects work items for safety and quality"
    exclusive_operations:
      - "POST /projects/:project_id/inspections — Create inspection"
      - "POST .../inspections/:id/submit — Submit inspection result"

  - name: MANAGER
    description: "Project manager handling permits, inspections, change orders, and finalization"
    exclusive_operations:
      - "POST /projects — Create project"
      - "POST .../permits/:id/decide — Decide permit"
      - "POST .../inspections/:id/void — Void inspection"
      - "POST /projects/:project_id/change_orders — Create change order"
      - "POST .../change_orders/:id/approve — Approve change order"
      - "POST .../change_orders/:id/apply — Apply change order"
      - "POST .../change_orders/:id/cancel — Cancel change order"
