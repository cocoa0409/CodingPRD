      - name: leak_rate_variant_divergence_rolling_versus_annualizing
        claim_type: variant_divergence
        grounds:
          - calculations.system_leak_rate_pct.variants
        excluded_because:
          difficulty_instance: leak_rate_rolling_average_vs_annualizing_diverge_on_one_system
          rationale: "That §1.8 instance already drives two systems with identical 10.0 lb ledgers and opposite leak_rate_method values, asserting 40.6 against 10.0 and the resulting event-versus-no-event divergence. A separate corner test would restate the same claim."

      - name: period_leaked_lbs_variant_divergence_charge_versus_balance
        claim_type: variant_divergence
        grounds:
          - calculations.store_period_leaked_lbs.variants
        excluded_because:
          difficulty_instance: period_leaked_mass_charge_based_vs_balance_based_diverge_on_one_store
          rationale: "That §1.8 instance files two reports over the same ledger and asserts total_leaked_lbs 20.0 under CHARGE_BASED against 0.0 under BALANCE_BASED, which is exactly the variant-divergence claim for this calculation."

      - name: leak_threshold_boundary_at_exactly_twenty_percent
        claim_type: threshold_boundary
        grounds:
          - calculations.system_leak_rate_pct.formula
          - calculations.system_leak_rate_pct.constants.LEAK_THRESHOLDS
        excluded_because:
          difficulty_instance: leak_rate_exactly_at_threshold_opens_event_on_service_record
          rationale: "The threshold-1 / threshold / threshold+1 walk for COMMERCIAL_REFRIGERATION is that instance's whole subject: 19.9 opens nothing and exactly 20.0 opens an event, pinning the comparison as >= rather than >."

  # ===========================================================================
  - section: validations
    instances:
      - name: service_record_performed_after_the_logical_clock_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - errors[ERR_TIMESTAMP_AFTER_CLOCK]
        distinguishing_aspect: "A physical-world timestamp one day ahead of the logical clock is 422 ERR_TIMESTAMP_AFTER_CLOCK; the system charge, the cylinder contents and the system version are all untouched, so no future-dated mass ever enters the ledger."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0, installed 2025-01-15), T1, EQ1, CYL1 with 40.0 lbs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 5.0, performed_at: "2026-08-02T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_TIMESTAMP_AFTER_CLOCK"
            - "RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and version == 1"
            - "Cylinder.${cyl1_id}.current_contents_lbs == 40.0"
            - "GET /service-records?system_id=${sys1_id} returns total_count 0"

      - name: service_record_before_system_installation_is_out_of_range
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_SERVICE_DATE_OUT_OF_RANGE]
        distinguishing_aspect: "performed_at 2024-12-01 is legally in the past relative to the clock, so the clock rule at priority 29 is satisfied, yet it precedes installed_on 2025-01-15 and must be 422 ERR_SERVICE_DATE_OUT_OF_RANGE - service cannot be recorded against a system that did not exist yet."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 installed 2025-01-15 (full 100.0, initial 80.0), T1, EQ1, CYL1 with 40.0 lbs."
