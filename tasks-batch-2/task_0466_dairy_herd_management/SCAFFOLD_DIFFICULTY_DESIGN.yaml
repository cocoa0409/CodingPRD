            - "response.data.error_id == ERR_EMPTY_MILK_POOL"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: parlor_shift_extent_overlap_within_buffer_rejected
        grounds:
          - validations[priority=10]
          - entities.MilkingShift.fields.start_at
          - entities.Parlor.fields.turnaround_minutes
          - errors[ERR_PARLOR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Resource = Parlor; interval semantics = half-open extent [start_at,end_at) PLUS a turnaround
          buffer gap. A second shift starting 07:29Z (one minute inside prior.end_at 07:00Z + 30min buffer)
          is rejected ERR_PARLOR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "Parlor turnaround_minutes 30; LOGGED shift 04:00-07:00 on 2026-06-01."
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Overlap Parlor Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/parlors"
              payload: { herd_id: "${h_id}", name: "North D-12", stall_capacity: 24, turnaround_minutes: 30 }
              as: HerdManager
              captures: { p_id: $.data.id }
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T04:00:00Z", end_at: "2026-06-01T07:00:00Z", cows_milked: 24 }
              as: ParlorTech
          trigger:
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T07:29:00Z", end_at: "2026-06-01T09:00:00Z", cows_milked: 24 }
              as: ParlorTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PARLOR_SHIFT_OVERLAP"

      - name: breeding_service_within_vwp_minimum_gap_rejected
        grounds:
          - validations[priority=11.5]
          - entities.BreedingEvent.fields.service_date
          - errors[ERR_SERVICE_WITHIN_VWP]
        distinguishing_aspect: |
          Resource = Animal; interval semantics = minimum-gap on a per-animal timeline (point services
          separated by VWP_DAYS=30), distinct from the parlor's extent-overlap-with-buffer. A second
          service 20 days after a prior OPEN service falls in [prior, prior+30d) and is rejected
          ERR_SERVICE_WITHIN_VWP.
        test_recipe:
          setup:
            - "Cow with a first service 2026-02-01 that was marked OPEN; clock at 2026-02-21; a new service 2026-02-21 (20 days later, within VWP)."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "VWP Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "VW-001", birth_date: "2022-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-02-01", sire_code: "S-1" }
              as: Veterinarian
              captures: { be1_id: $.data.id }
            - call: "POST /herds/breeding-events/${be1_id}/mark-open"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-21T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-02-21", sire_code: "S-2" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SERVICE_WITHIN_VWP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: treatment_void_restores_milk_eligible_invariant
        grounds:
          - state_machines.HealthTreatment.ACTIVE_to_VOIDED
          - entities.Animal.fields.milk_eligible
          - entities.HealthTreatment.fields.milk_withhold_until
        distinguishing_aspect: |
          Conserved quantity = Animal.milk_eligible predicate (true iff zero ACTIVE treatments have
          milk_withhold_until > clock). Forward administer sets it false; the compensating void restores it
          to the pre-treatment value true, leaving the predicate unchanged net of the pair.
        test_recipe:
          setup:
