              as_user_id: "carrier-op-13"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-13"
          trigger:
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-13"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_FSMA_NOT_REGISTERED"
            - "Shipment.${ship_id}.status stays PRECOOLED (transition blocked by Carrier field)"

      - name: claim_approval_depends_on_shipment_posture
        grounds:
          - state_machines.SpoilageClaim.UNDER_REVIEW_to_APPROVED
          - entities.Shipment.fields.load_integrity_posture
          - entities.SpoilageClaim.fields.shipment_id
        distinguishing_aspect: "Different entity pair SpoilageClaim->Shipment: a claim in UNDER_REVIEW can only transition to APPROVED when the related Shipment.load_integrity_posture is AT_RISK or COMPROMISED — the claim transition is gated by a computed field on the Shipment, a distinct pair from Shipment->Carrier above."
        test_recipe:
          setup:
            - "An INTACT DELIVERED shipment cannot even host an eligible claim; we reach the posture gate by filing on an AT_RISK shipment then demonstrating the approve gate reads the Shipment posture (AT_RISK -> APPROVED succeeds)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Posture Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-14"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-14", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-14"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-14"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-14"
              captures: { comp_id: $.data.id }
            - call: "POST /compartments/${comp_id}/lots"
              payload: { sku: "LOT-P", pallet_count: 1, declared_value_cents: 400000 }
              as: Shipper
              as_user_id: "shipper-op-14"
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-14"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-14"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-14"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-14"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-14"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 0, temp_c: -12 }
              as: Driver
              as_user_id: "driver-op-14"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 20, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-14"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-14"
            - call: "POST /shipments/${ship_id}/deliver"
              as: Driver
              as_user_id: "driver-op-14"
            - call: "POST /spoilage-claims"
              payload: { shipment_id: "${ship_id}" }
              as: Shipper
              as_user_id: "shipper-op-14"
              captures: { claim_id: $.data.id }
            - call: "POST /spoilage-claims/${claim_id}/review"
              as: ComplianceOfficer
              as_user_id: "co-op-14"
          trigger:
            - call: "POST /spoilage-claims/${claim_id}/approve"
              as: ComplianceOfficer
              as_user_id: "co-op-14"
              captures: { st: $.data.status }
          assert:
            - "Shipment.${ship_id}.load_integrity_posture == AT_RISK (degree_minutes 60, PARTIAL)"
            - "SpoilageClaim.${claim_id}.status == APPROVED (approve gate read the Shipment posture and passed)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: stop_window_buffered_overlap_on_shipment
        grounds:
          - calculations.stop_window_overlap
          - validations[priority=14]
          - entities.StopEvent.fields.appointment_min
        distinguishing_aspect: "Windowed-interval-with-buffer semantics on the StopEvent resource: a new stop window [185,245] is rejected against an existing [100,160] because the 25-min gap is below STOP_BUFFER_MIN 30 (closed intervals + positive separation buffer)."
        test_recipe:
          setup:
            - "A shipment with an existing SCHEDULED stop at appointment_min 100 (window [100,160]); a second stop scheduled at appointment_min 185."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Window Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-15"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-15"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-15"
            - call: "POST /shipments/${ship_id}/stops"
              payload: { kind: "PICKUP", appointment_min: 100, pallets_handled: 0, compartments_touched: 1 }
              as: Shipper
              as_user_id: "shipper-op-15"
              captures: { stop1_id: $.data.id }
          trigger:
            - call: "POST /shipments/${ship_id}/stops"
              payload: { kind: "DELIVERY", appointment_min: 185, pallets_handled: 0, compartments_touched: 1 }
              as: Shipper
              as_user_id: "shipper-op-15"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STOP_WINDOW_OVERLAP (gap 25 < STOP_BUFFER_MIN 30)"
            - "A window at appointment_min 190 (gap exactly 30) would instead succeed — the buffer boundary is exact."

      - name: sensor_reading_offset_point_collision_on_compartment
        grounds:
          - validations[priority=15]
          - entities.SensorReading.fields.offset_min
          - entities.SensorReading.fields.kind
        distinguishing_aspect: "Zero-width point-event semantics on the SensorReading/Compartment resource (a different resource and different interval geometry than the buffered stop window): a TEMP reading whose offset_min equals the latest existing TEMP offset collides — equality rejected, no buffer."
        test_recipe:
          setup:
            - "IN_TRANSIT FROZEN shipment with a TEMP reading at offset_min 60 already recorded; a second TEMP reading at offset_min 60."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Point Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-16"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-16", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-16"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-16"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-16"
              captures: { comp_id: $.data.id }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-16"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-16"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-16"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-16"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-16"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-16"
          trigger:
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -18 }
              as: Driver
              as_user_id: "driver-op-16"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_READING_OFFSET_DUPLICATE (offset_min 60 not strictly greater than existing 60)"
            - "A TEMP reading at offset_min 61 would instead succeed."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reefer_pool_conservation_accept_then_cancel
        grounds:
          - state_machines.Shipment.TENDERED_to_ACCEPTED
          - state_machines.Shipment.ACCEPTED_to_CANCELLED
          - state_machines.ReeferUnit.AVAILABLE_to_ASSIGNED
          - state_machines.ReeferUnit.ASSIGNED_to_AVAILABLE
          - entities.ReeferUnit.fields.status
        distinguishing_aspect: "Conserved quantity = count of AVAILABLE reefer units for the carrier. accept (forward, AVAILABLE->ASSIGNED) paired with cancel (compensating, ASSIGNED->AVAILABLE) leaves AVAILABLE-unit-count exactly equal to its pre-accept value; the unit is released, not leaked."
        test_recipe:
          setup:
            - "Carrier with exactly one AVAILABLE reefer unit; a TENDERED shipment is accepted (unit ASSIGNED) then cancelled (unit released)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Pool Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-17"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-17", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-17"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-17"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-17"
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-17"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-17"
          trigger:
            - call: "POST /shipments/${ship_id}/cancel"
              as: Shipper
              as_user_id: "shipper-op-17"
            - call: "GET /reefer-units"
              payload: { carrier_id: "${carrier_id}", status: "AVAILABLE" }
              as: Carrier
              as_user_id: "carrier-op-17"
          assert:
            - "Count of AVAILABLE units for ${carrier_id} after accept+cancel == 1 (equal to the pre-accept count; the conserved pool is unchanged)"
            - "ReeferUnit.${unit_id}.status == AVAILABLE"

      - name: detention_ledger_conservation_close_then_reopen_via_second_stop
        grounds:
          - state_machines.StopEvent.ARRIVED_to_CLOSED
          - calculations.detention_fee
          - entities.Shipment.fields.total_detention_fee_cents
          - entities.StopEvent.fields.detention_fee_cents
        distinguishing_aspect: "Different conserved quantity (a monetary ledger): Shipment.total_detention_fee_cents MUST always equal the exact sum of detention_fee_cents over CLOSED stops. After closing two stops (fees 5000 and 10000) the shipment ledger reads 15000 with zero drift — the aggregate is pinned as a formula over the stops, not an independently maintained counter."
        test_recipe:
          setup:
            - "IN_TRANSIT shipment with two DELIVERY stops; close stop A (dwell 180 -> 5000) and stop B (dwell 181 -> 10000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Ledger Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-18"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "CHILLED", setpoint_min_c: 0, setpoint_max_c: 4, regulated: true }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-18", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-18"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-18"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-18"
              captures: { comp_id: $.data.id }
            - call: "POST /shipments/${ship_id}/stops"
              payload: { kind: "PICKUP", appointment_min: 0, pallets_handled: 0, compartments_touched: 1 }
              as: Shipper
              as_user_id: "shipper-op-18"
              captures: { stopA_id: $.data.id }
            - call: "POST /shipments/${ship_id}/stops"
              payload: { kind: "DELIVERY", appointment_min: 300, pallets_handled: 0, compartments_touched: 1 }
              as: Shipper
              as_user_id: "shipper-op-18"
              captures: { stopB_id: $.data.id }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-18"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-18"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: 2 }
              as: Carrier
              as_user_id: "carrier-op-18"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-18"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-18"
            - call: "POST /shipments/${ship_id}/stops/${stopA_id}/arrive"
              payload: { arrived_min: 0 }
              as: Driver
              as_user_id: "driver-op-18"
            - call: "POST /shipments/${ship_id}/stops/${stopA_id}/close"
              payload: { departed_min: 180, pallets_handled: 0, compartments_touched: 1 }
              as: Driver
              as_user_id: "driver-op-18"
            - call: "POST /shipments/${ship_id}/stops/${stopB_id}/arrive"
              payload: { arrived_min: 300 }
              as: Driver
              as_user_id: "driver-op-18"
          trigger:
            - call: "POST /shipments/${ship_id}/stops/${stopB_id}/close"
              payload: { departed_min: 481, pallets_handled: 0, compartments_touched: 1 }
              as: Driver
              as_user_id: "driver-op-18"
              captures: { feeB: $.data.detention_fee_cents }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-18"
              captures: { total: $.data.total_detention_fee_cents }
          assert:
            - "StopEvent.${stopA_id}.detention_fee_cents == 5000 (dwell 180)"
            - "StopEvent.${stopB_id}.detention_fee_cents == 10000 (dwell 181)"
            - "Shipment.${ship_id}.total_detention_fee_cents == 15000 (exact sum over CLOSED stops, no drift)"
