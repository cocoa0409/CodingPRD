# =============================================================================
# 1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml 1.1-1.7
#
# Shared fixture conventions used by every test_recipe below (each chain is
# nevertheless self-contained and starts from an empty database):
#
#   * The logical clock reads 2026-08-01T00:00:00Z until a chain calls
#     POST /_clock/set_current_utc, so every date literal below is chosen
#     relative to that instant.
#   * Canonical user ids: pa-1 (ProgramAdmin), lo-1 (LoanOfficer),
#     uw-1 / uw-2 (Underwriter), cc-1 (CreditCommittee), cco-1
#     (ChiefCreditOfficer), ar-1 (AppraisalReviewer), pca-1 (PostCloseAuditor),
#     sa-1 (SecuritizationAnalyst). An Underwriter action on a loan file must
#     carry the file's assigned_underwriter_id (validations[priority=23]), which
#     is the X-User-ID that ran doc-type-selection.
#   * The canonical seasoning matrix is
#     { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24,
#       BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }.
#   * Every asserted numeric literal was produced by executing the matching
#     calculations[].formula with its declared constants under Decimal /
#     ROUND_HALF_UP; none is an estimate.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: corner_program_creation_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.DocumentationProgram
          - endpoints[POST /documentation-programs]
        distinguishing_aspect: "A create call carrying every DocumentationProgram input field returns 201 and echoes all of them, including the seven-key seasoning_matrix, unchanged."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "BANK_STATEMENT_12MO"
                name: "12-Month Bank Statement"
                statement_period_months: 12
                default_expense_factor_pct: 50.00
                min_expense_factor_pct: 25.00
                max_ltv_pct: 80.00
                min_fico: 660
                min_reserves_months: 6
                max_dti_pct: 50.00
                min_residual_income_cents: 250000
                second_valuation_ltv_threshold_pct: 85.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: false
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
          assert:
            - "HTTP status == 201"
            - "response.response_type == \"object\""
            - "DocumentationProgram.program_code == BANK_STATEMENT_12MO"
            - "DocumentationProgram.statement_period_months == 12"
            - "DocumentationProgram.default_expense_factor_pct == 50.00"
            - "DocumentationProgram.min_expense_factor_pct == 25.00"
            - "DocumentationProgram.min_residual_income_cents == 250000"
            - "DocumentationProgram.second_valuation_loan_amount_threshold_cents == 150000000"
            - "DocumentationProgram.atr_exempt_flag == false"
            - "DocumentationProgram.seasoning_matrix.BK_CH7 == 24"
            - "DocumentationProgram.seasoning_matrix.MORTGAGE_LATE_60 == 12"

      - name: corner_program_conditional_field_matrix_by_program_code
        claim_type: required_fields
        grounds:
          - entities.DocumentationProgram.fields.statement_period_months
          - entities.DocumentationProgram.fields.max_dti_pct
          - entities.DocumentationProgram.fields.depletion_horizon_months
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The three program-shape fields are conditionally required: BANK_STATEMENT_12MO without statement_period_months is rejected, and DSCR carrying max_dti_pct is rejected, both with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "BANK_STATEMENT_12MO"
                name: "Missing Period"
                default_expense_factor_pct: 50.00
                min_expense_factor_pct: 25.00
                max_ltv_pct: 80.00
                min_fico: 660
                min_reserves_months: 6
                max_dti_pct: 50.00
                min_residual_income_cents: 250000
                second_valuation_ltv_threshold_pct: 85.00
                second_valuation_loan_amount_threshold_cents: 150000000
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR With Forbidden DTI"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                max_dti_pct: 50.00
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
          assert:
            - "First trigger call: HTTP status == 400 with error_id ERR_INVALID_REQUEST (statement_period_months is required when program_code starts with BANK_STATEMENT_)"
            - "Second trigger call: HTTP status == 400 with error_id ERR_INVALID_REQUEST (max_dti_pct must be omitted for DSCR)"
            - "No DocumentationProgram row exists after either call"

      - name: corner_loan_file_retrieval_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.LoanFile
          - endpoints[GET /loan-files/{id}]
          - calculations.pitia_monthly
          - calculations.ltv_recompute
        distinguishing_aspect: "GET /loan-files/{id} returns the stored inputs plus the create-time computed fields pitia_monthly_cents 572020, ltv_pct 80.00 and documented_reserves_months 6.99, with dti_pct still null."
        test_recipe:
          setup:
            - "One PROFIT_AND_LOSS program, one self-employed borrower with 4000000 cents of verified liquid assets, and one DRAFT loan file of 60000000 cents at 8.750 percent over 360 months fully amortizing, taxes 78000, insurance 22000, property value 75000000."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "PROFIT_AND_LOSS"
                name: "CPA P&L 12-Month"
                statement_period_months: 12
                default_expense_factor_pct: 50.00
                min_expense_factor_pct: 25.00
                max_ltv_pct: 80.00
                min_fico: 660
                min_reserves_months: 6
                max_dti_pct: 50.00
                min_residual_income_cents: 250000
                second_valuation_ltv_threshold_pct: 85.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: false
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_pnl_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Dana Reyes"
                fico_score: 700
                self_employed_flag: true
                monthly_debt_obligations_cents: 400000
                verified_liquid_assets_cents: 4000000
                age_years: 45
              captures: { borr_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_pnl_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 60000000
                purchase_price_cents: 75000000
                property_value_cents: 75000000
                occupancy: "PRIMARY"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 8.750
                apor_pct: 6.100
                term_months: 360
                amortization_type: "FULLY_AMORTIZING"
                monthly_taxes_cents: 78000
                monthly_insurance_cents: 22000
              captures: { lf_id: "$.data.id" }
          trigger:
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
              payload: {}
          assert:
            - "HTTP status == 200"
            - "LoanFile.loan_amount_cents == 60000000"
            - "LoanFile.note_rate_pct == 8.750"
            - "LoanFile.pitia_monthly_cents == 572020"
            - "LoanFile.ltv_pct == 80.00"
            - "LoanFile.documented_reserves_months == 6.99"
            - "LoanFile.dti_pct == null"
            - "LoanFile.status == DRAFT"
            - "LoanFile.doc_type == null"
            - "LoanFile.points_and_fees_test_result == NOT_TESTED"
            - "LoanFile.atr_documentation_status == INCOMPLETE"
            - "LoanFile.safe_harbor_class == NOT_EVALUATED"
            - "LoanFile.securitization_eligible == false"
            - "LoanFile.version == 1"

      - name: corner_loan_file_listing_pagination_envelope_and_filter
        claim_type: listing
        grounds:
          - endpoints[GET /loan-files]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /loan-files with no pagination input returns limit 10, offset 0, total_count 2, has_more false; limit 1 returns one row with has_more true and total_count still 2."
        test_recipe:
          setup:
            - "One DSCR program, one borrower, and two DRAFT loan files for that borrower."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_dscr_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Ida Novak"
                fico_score: 700
                monthly_debt_obligations_cents: 0
                verified_liquid_assets_cents: 5000000
                age_years: 50
              captures: { borr_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_dscr_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 60000000
                purchase_price_cents: 80000000
                property_value_cents: 80000000
                occupancy: "INVESTMENT"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 8.750
                apor_pct: 6.100
                term_months: 360
                amortization_type: "INTEREST_ONLY"
                monthly_taxes_cents: 60000
                monthly_insurance_cents: 20000
                gross_market_rent_cents: 620000
                lease_rent_cents: 640000
              captures: { lf_one_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_dscr_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 40000000
                purchase_price_cents: 55000000
                property_value_cents: 55000000
                occupancy: "INVESTMENT"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 9.250
                apor_pct: 6.100
                term_months: 360
                amortization_type: "INTEREST_ONLY"
                monthly_taxes_cents: 60000
                monthly_insurance_cents: 18000
                monthly_hoa_cents: 15000
                gross_market_rent_cents: 420000
                lease_rent_cents: 480000
              captures: { lf_two_id: "$.data.id" }
          trigger:
            - call: "GET /loan-files"
              as: SecuritizationAnalyst
              as_user_id: "sa-1"
              payload: {}
            - call: "GET /loan-files"
              as: SecuritizationAnalyst
              as_user_id: "sa-1"
              payload: { limit: 1, offset: 0 }
            - call: "GET /loan-files"
              as: SecuritizationAnalyst
              as_user_id: "sa-1"
              payload: { status: "UNDERWRITING" }
          assert:
            - "First trigger call: response_type == \"array\", limit == 10, offset == 0, total_count == 2, has_more == false, 2 rows returned"
            - "Second trigger call: limit == 1, offset == 0, total_count == 2, has_more == true, exactly 1 row returned"
            - "Third trigger call: total_count == 0, has_more == false, 0 rows returned (both files are DRAFT)"

      - name: corner_unknown_loan_file_id_returns_loan_file_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /loan-files/{id}]
          - validations[priority=5]
          - errors[ERR_LOAN_FILE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that names no LoanFile row returns 404 ERR_LOAN_FILE_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /loan-files/00000000-0000-4000-8000-000000000000"
              as: Underwriter
              as_user_id: "uw-1"
              payload: {}
          assert:
            - "HTTP status == 404"
            - "response.response_type == \"error\""
            - "error_id == ERR_LOAN_FILE_NOT_FOUND"

      - name: corner_loan_file_creation_missing_required_property_value
        claim_type: required_fields
        grounds:
          - entities.LoanFile.fields.property_value_cents
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the non-optional property_value_cents from POST /loan-files returns 400 ERR_INVALID_REQUEST and persists no LoanFile row."
        test_recipe:
          setup: ["One DSCR program and one borrower exist."]
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_dscr_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Ida Novak"
                fico_score: 700
                monthly_debt_obligations_cents: 0
                verified_liquid_assets_cents: 5000000
                age_years: 50
              captures: { borr_id: "$.data.id" }
          trigger:
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_dscr_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 60000000
                occupancy: "INVESTMENT"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 8.750
                apor_pct: 6.100
                term_months: 360
                amortization_type: "INTEREST_ONLY"
                monthly_taxes_cents: 60000
                monthly_insurance_cents: 20000
                gross_market_rent_cents: 620000
                lease_rent_cents: 640000
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /loan-files returns total_count == 0"

      - name: corner_omitted_optional_flags_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Borrower.fields.self_employed_flag
          - entities.Borrower.fields.entity_ownership_pct
          - entities.CreditEvent.fields.documented_flag
          - entities.PointsAndFeesItem.fields.paid_to_affiliate_flag
          - entities.PointsAndFeesItem.fields.prepaid_finance_charge_flag
          - entities.PointsAndFeesItem.fields.bona_fide_discount_flag
          - entities.ExceptionRequest.fields.compensating_factors
        distinguishing_aspect: "Omitting self_employed_flag, entity_ownership_pct, documented_flag and the three fee flags yields false, 100.00, true, false, false, false respectively - never null."
        test_recipe:
          setup:
            - "One DSCR program, one borrower created without the optional flags, one DRAFT loan file, one credit event created without documented_flag, and one fee item created without its three flags."
          setup_api_calls:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "DSCR"
                name: "Investor DSCR"
                min_dscr: 1.1000
                max_ltv_pct: 85.00
                min_fico: 660
                min_reserves_months: 6
                min_residual_income_cents: 0
                second_valuation_ltv_threshold_pct: 90.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: true
                seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 }
              captures: { prog_dscr_id: "$.data.id" }
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Ida Novak"
                fico_score: 700
                monthly_debt_obligations_cents: 0
                verified_liquid_assets_cents: 5000000
                age_years: 50
              captures: { borr_id: "$.data.id" }
            - call: "POST /loan-files"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                program_id: "${prog_dscr_id}"
                investor_code: "INV-ALPHA"
                loan_amount_cents: 60000000
                purchase_price_cents: 80000000
                property_value_cents: 80000000
                occupancy: "INVESTMENT"
                purpose: "PURCHASE"
                lien_position: "FIRST"
                note_rate_pct: 8.750
                apor_pct: 6.100
                term_months: 360
                amortization_type: "INTEREST_ONLY"
                monthly_taxes_cents: 60000
                monthly_insurance_cents: 20000
                gross_market_rent_cents: 620000
                lease_rent_cents: 640000
              captures: { lf_id: "$.data.id" }
            - call: "POST /credit-events"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                event_type: "BK_CH7"
                completion_date: "2024-01-01T00:00:00Z"
              captures: { ce_id: "$.data.id" }
            - call: "POST /points-and-fees-items"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                loan_file_id: "${lf_id}"
                fee_code: "F-ORIG"
                fee_category: "ORIGINATION_POINTS"
                amount_cents: 600000
              captures: { fee_id: "$.data.id" }
          trigger:
            - call: "GET /borrowers/${borr_id}"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
            - call: "GET /borrowers/${borr_id}/credit-events"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
            - call: "GET /loan-files/${lf_id}/points-and-fees-items"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
          assert:
            - "Borrower.self_employed_flag == false"
            - "Borrower.entity_ownership_pct == 100.00"
            - "Borrower.credit_event_count == 1"
            - "CreditEvent.documented_flag == true"
            - "PointsAndFeesItem.paid_to_affiliate_flag == false"
            - "PointsAndFeesItem.prepaid_finance_charge_flag == false"
            - "PointsAndFeesItem.bona_fide_discount_flag == false"
            - "PointsAndFeesItem.status == ACTIVE"
            - "PointsAndFeesItem.inclusion_in_test == INCLUDED"
            - "Second and third trigger calls: limit == 10, offset == 0, has_more == false"

      - name: corner_computed_field_credit_event_count_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Borrower.fields.credit_event_count
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "credit_event_count is source computed: supplying it on POST /borrowers is an unknown input field (400 ERR_INVALID_REQUEST), and the server-maintained value moves 0 to 1 when a credit event is filed."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Ida Novak"
                fico_score: 700
                monthly_debt_obligations_cents: 0
                verified_liquid_assets_cents: 5000000
                age_years: 50
              captures: { borr_id: "$.data.id" }
          trigger:
            - call: "POST /borrowers"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                legal_name: "Client Supplied Count"
                fico_score: 700
                monthly_debt_obligations_cents: 0
                verified_liquid_assets_cents: 5000000
                age_years: 50
                credit_event_count: 5
            - call: "POST /credit-events"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload:
                borrower_id: "${borr_id}"
                event_type: "BK_CH13"
                completion_date: "2025-01-01T00:00:00Z"
            - call: "GET /borrowers/${borr_id}"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
          assert:
            - "First trigger call: HTTP status == 400 with error_id ERR_INVALID_REQUEST"
            - "Third trigger call: Borrower.credit_event_count == 1"
            - "GET /borrowers returns no borrower named \"Client Supplied Count\""

      - name: corner_system_fields_on_program_create_input_ignored
        claim_type: system_fields
        grounds:
          - entities.DocumentationProgram
          - endpoints[POST /documentation-programs]
          - validations[priority=6]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: version is exactly 1 on create, and a client-supplied version field is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /documentation-programs"
              as: ProgramAdmin
              as_user_id: "pa-1"
              payload:
                program_code: "ASSET_DEPLETION"
                name: "Asset Depletion 84"
                depletion_horizon_months: 84
                max_ltv_pct: 80.00
                min_fico: 660
                min_reserves_months: 6
                max_dti_pct: 60.00
                min_residual_income_cents: 250000
                second_valuation_ltv_threshold_pct: 85.00
                second_valuation_loan_amount_threshold_cents: 150000000
                atr_exempt_flag: false
