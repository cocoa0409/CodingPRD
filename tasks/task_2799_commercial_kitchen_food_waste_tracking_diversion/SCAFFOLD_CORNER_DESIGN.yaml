        distinguishing_aspect: "The two independent state dimensions of one row start at DRAFT and UNBILLED respectively, with staged_weight_grams 0 and line_count 0."
        test_recipe:
          setup: ["Site HK-01 and a PENDING hauler that serves COMPOST."]
          setup_api_calls:
