              captures: { m21_err: $.data.error_id }
          assert:
            - "m20_status == CAPTURED                  # wind=20 (boundary, inclusive) passes"
            - "m21_err == ERR_WEATHER_LIMIT_EXCEEDED   # wind=21 (boundary+1) rejected"

      - name: anomaly_count_zero_vs_one_alert_creation
