              as: Advisor
              captures: { reb2_id: $.data.id }
            - call: "POST /rebalance-events/${reb2_id}/execute"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "Second 2026-Q2 rebalance execute returns ERR_QUARTER_ALREADY_REBALANCED (409)"
            - "RebalanceEvent.${reb1_id}.status == EXECUTED and RebalanceEvent.${reb2_id}.status == PLANNED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: harvest_reverse_restores_total_value_cents
        grounds:
          - state_machines.HarvestEvent.EXECUTED_to_REVERSED
          - state_machines.HarvestEvent.PROPOSED_to_EXECUTED
          - entities.Account.fields.total_value_cents
        distinguishing_aspect: |
          Conserved quantity = Account.total_value_cents (cash + invested). A clean harvest execute
          then reverse leaves total_value_cents exactly equal to its pre-harvest value:
          pre == post, because the replacement lot is unwound, its cash returned, and the source
          lot reopened at its original market value.
        test_recipe:
          setup:
            - "Account ACTIVE holding only a 5sh/60000 loss lot in A (price 10000 -> mkt 50000), cash 0; total_value 50000."
            - "A clean harvest (replacement B 4000, correlation 0.05) is executed then reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "EQ8", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "OOO", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "PPP", correlation: 0.05}] }
              as: Advisor
              captures: { sec_o_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "PPP", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "OOO", correlation: 0.05}] }
              as: Advisor
              captures: { sec_p_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "inv1@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_o_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "${source_lot_id}", replacement_security_id: "${sec_p_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { harvest_id: $.data.id }
            - call: "POST /harvest-events/${harvest_id}/execute"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /harvest-events/${harvest_id}/reverse"
              payload: {}
              as: Compliance
          assert:
            - "Before harvest, Account.${acct_id}.total_value_cents == 50000"
            - "After reverse, Account.${acct_id}.total_value_cents == 50000 (conserved; no drift)"
            - "After reverse, TaxLot.${source_lot_id}.status == OPEN and HarvestEvent.${harvest_id}.status == REVERSED"

      - name: harvest_reverse_restores_realized_gain_ytd
        grounds:
          - state_machines.HarvestEvent.EXECUTED_to_REVERSED
          - entities.Account.fields.realized_gain_cents_ytd
          - entities.Account.fields.wash_sale_disallowed_cents_ytd
        distinguishing_aspect: |
          A different conserved quantity = Account.realized_gain_cents_ytd (and the paired
          wash_sale_disallowed_cents_ytd). Execute drops realized_gain_cents_ytd by the loss and
          bumps wash_sale_disallowed_cents_ytd; reverse restores BOTH ytd counters to their exact
          pre-harvest values (0 and 0), distinct from the total_value invariant.
        test_recipe:
          setup:
            - "Same wash-sale-triggering setup (2sh in-window lot + 5sh/60000 source in A, replacement B), harvest executed."
            - "After execute realized_gain_cents_ytd == -6000 and wash_sale_disallowed_cents_ytd == 4000; reverse should restore both to 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "EQ9", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 100}], drift_threshold_pct: 90 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "QQQ", asset_class: "US_EQUITY", price_cents: 10000, correlated_with: [{ticker: "RRR", correlation: 0.10}] }
              as: Advisor
              captures: { sec_q_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "RRR", asset_class: "US_EQUITY", price_cents: 4000, correlated_with: [{ticker: "QQQ", correlation: 0.10}] }
              as: Advisor
              captures: { sec_r_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "inv2@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_q_id}", quantity: 2, cost_basis_cents: 24000 }
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_q_id}", quantity: 5, cost_basis_cents: 60000 }
              as: Advisor
              captures: { source_lot_id: $.data.id, acct_v: $.data.version }
            - call: "POST /harvest-events"
              payload: { account_id: "${acct_id}", source_lot_id: "${source_lot_id}", replacement_security_id: "${sec_r_id}", expected_account_version: "${acct_v}" }
              as: Advisor
              captures: { harvest_id: $.data.id }
            - call: "POST /harvest-events/${harvest_id}/execute"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /harvest-events/${harvest_id}/reverse"
              payload: {}
              as: Compliance
          assert:
            - "After reverse, Account.${acct_id}.realized_gain_cents_ytd == 0 (restored from -6000)"
            - "After reverse, Account.${acct_id}.wash_sale_disallowed_cents_ytd == 0 (restored from 4000)"
            - "TaxLot.${source_lot_id}.wash_sale_disallowed_cents == 0 after reverse"
