        grounds: ["state_machines.BullionAllocation.OFFERED_to_EXPIRED", "entities.BullionAllocation.fields.offer_expires_at"]
        distinguishing_aspect: "offer_expires_at is computed as creation clock + offer_window_hours (2026-09-10T00:00:00Z + 48h == 2026-09-12T00:00:00Z); a clock-set landing exactly on that instant expires the offer (inclusive boundary) and restores the pool."
        test_recipe:
          setup: ["clock 2026-09-10T00:00:00Z with GOLD spot; issue pool 1000, window 48h; offer of 50 units"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 50, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "GET /mint/allocations/${alloc_id}"
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/allocations/${alloc_id}"
              as: ProgramManager
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
          assert:
            - "before the sweep: BullionAllocation.${alloc_id}.offer_expires_at == 2026-09-12T00:00:00Z and status == OFFERED"
            - "after clock reaches exactly offer_expires_at: status == EXPIRED"
            - "BullionIssue.${issue_id}.remaining_pool_units == 1000 (50 units restored)"

