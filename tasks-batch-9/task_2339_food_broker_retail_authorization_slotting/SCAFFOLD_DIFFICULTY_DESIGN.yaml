          (priority 12, 409) — two rules that share the same HTTP status, so the
          test can only be passed by returning the right error_id, not by status
          matching. Both are genuinely violated by the same request: the review
          is still OPEN and the quoted 20,350,000-cent fee dwarfs the 100,000-cent
          budget. Deciding the review afterwards makes the very same accept call
