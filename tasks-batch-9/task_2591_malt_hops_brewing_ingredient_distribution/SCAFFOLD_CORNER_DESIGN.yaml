  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: minimum_order_quantity_admits_a_line_exactly_at_the_minimum
        claim_type: Violation -> Error
        grounds:
          - validations[priority=34]
          - errors.ERR_BELOW_MINIMUM_ORDER_QUANTITY
          - entities.MaltProduct.fields.min_order_lbs
        distinguishing_aspect: "The MOQ gate is a per-line inclusive floor read from the ITEM, not from the order: 54 lbs of a product whose min_order_lbs is 55 is refused while exactly 55 is accepted, and the accepted line's extended_cents rounds 3767.50 up to 3768."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer; PALE-ALE malt product with min_order_lbs 55 and list price 68.50; a RELEASED 5000 lb lot; a DRAFT order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Minimum Order Brewing", brewery_license_no: "BR-1022", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { mq_id: $.data.id }
            - call: "POST /malt-products"
