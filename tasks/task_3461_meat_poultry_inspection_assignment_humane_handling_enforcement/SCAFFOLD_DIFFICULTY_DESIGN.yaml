              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d3}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d3}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_d3}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
            - call: "POST /inspection/inspectors"
