  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: response_agent_cannot_approve_a_response
        claim_type: role_denial
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "ResponseAgent is absent from the approve endpoint's roles list (segregation of duties by role), so the call is refused with 403 ERR_UNAUTHORIZED and the response stays PENDING_APPROVAL."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one 5-star review."
            - "agent-1 (ResponseAgent) has drafted and submitted a reply, so the ReviewResponse is PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thank you!", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { resp: $.data.id }
            - call: "POST /reputation/review-responses/${resp}/submit"
              payload: {}
              as: ResponseAgent
              as_user_id: "agent-1"
          trigger:
            - call: "POST /reputation/review-responses/${resp}/approve"
              payload: {}
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "ReviewResponse.${resp}.state == PENDING_APPROVAL"
            - "ReviewResponse.${resp}.approved_by_user_id == null"

      - name: same_user_cannot_approve_the_response_they_drafted
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.ReviewResponse.fields.drafted_by_user_id
        distinguishing_aspect: "A PlatformAdmin (admin-1) may both draft and approve by ROLE, but the user-id check still bites: approving a response whose drafted_by_user_id == admin-1 is refused with 403 ERR_SEGREGATION_OF_DUTIES, while a second admin (admin-2) succeeds."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one 5-star review."
            - "PlatformAdmin admin-1 drafted and submitted the reply, so drafted_by_user_id == admin-1 and state == PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thank you!", expected_review_version: "${rev_v}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { resp: $.data.id }
            - call: "POST /reputation/review-responses/${resp}/submit"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /reputation/review-responses/${resp}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /reputation/review-responses/${resp}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-2"
              captures: { st: $.data.state }
          assert:
            - "the admin-1 approve: HTTP status == 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the admin-2 approve: HTTP status == 200 and ReviewResponse.${resp}.state == APPROVED"
            - "ReviewResponse.${resp}.approved_by_user_id == admin-2"
            - "ReviewResponse.${resp}.drafted_by_user_id == admin-1"
            - "Review.${rev}.response_state == APPROVED"

      - name: anonymous_cannot_ingest_a_review
        claim_type: role_denial
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "The site-connector ingest endpoint lists only PlatformAdmin, so an Anonymous caller is refused with 403 ERR_UNAUTHORIZED and no Review is created."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Business and one Location."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ghost", rating: 5, text: "Self review", posted_at: "2026-05-01T00:00:00Z" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"
            - "Location.${loc_id}.review_count == 0"

  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_location_version_on_campaign_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[campaign-create-stale-location]
          - errors[ERR_STALE_VERSION]
          - validations[priority=7]
        distinguishing_aspect: "The first campaign create advances Location.version; a second create still carrying the version observed before it is refused with 412 ERR_STALE_VERSION and no Campaign row is added."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location whose version has been read once."
            - "One campaign has already been created against that observed version, so the Location's version has advanced past it."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Campaign A", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp_a: $.data.id }
          trigger:
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Campaign B", channel: "SMS", message_body: "Rate us", send_window_start: "14:00", send_window_end: "16:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION"
            - "GET /reputation/locations/${loc_id}/campaigns returns exactly 1 Campaign (Campaign A)"
            - "Campaign.${camp_a}.status == DRAFT"

      - name: stale_review_version_on_response_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[response-create-stale-review]
          - errors[ERR_STALE_VERSION]
          - entities.Review.fields.response_state
        distinguishing_aspect: "Drafting the first reply bumps Review.version; a second draft still carrying the pre-draft version is refused with 412 ERR_STALE_VERSION at priority 7 — before the priority-10 state check that would otherwise report ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with one 5-star review whose version was read at ingest."
            - "agent-1 has already drafted a reply, so Review.response_state == DRAFTED and Review.version has advanced."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thank you!", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { resp1: $.data.id }
          trigger:
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "A competing draft", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_VERSION (NOT ERR_INVALID_STATE)"
            - "GET /reputation/review-responses?review_id=${rev} returns exactly 1 row"
            - "ReviewResponse.${resp1}.state == DRAFT"
            - "Review.${rev}.response_state == DRAFTED"

      - name: template_with_requires_approval_false_skips_the_approval_hop
        claim_type: conditional_feature_flags
        grounds:
          - entities.ResponseTemplate.fields.requires_approval
          - state_machines.ReviewResponse.DRAFT_to_APPROVED
          - state_machines.Review.DRAFTED_to_APPROVED
        distinguishing_aspect: "With requires_approval false on the backing template, submit takes the response straight from DRAFT to APPROVED (approved_by_user_id stays null) instead of stopping at PENDING_APPROVAL; the segregation-of-duties check is never reached."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z."
            - "One Business with a ResponseTemplate covering ratings 1..5 and requires_approval == false."
            - "One Location with a CONNECTED GOOGLE listing and one 5-star review; agent-1 has drafted a reply FROM that template."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/templates"
              payload: { name: "Auto Thanks", body: "Thanks for the feedback!", min_rating: 1, max_rating: 5, requires_approval: false }
              as: PlatformAdmin
              captures: { tpl: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Ann", rating: 5, text: "Superb", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id, rev_v: $.data.version }
            - call: "POST /reputation/reviews/${rev}/responses"
              payload: { body: "Thanks for the feedback!", template_id: "${tpl}", expected_review_version: "${rev_v}" }
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { resp: $.data.id }
          trigger:
            - call: "POST /reputation/review-responses/${resp}/submit"
              payload: {}
              as: ResponseAgent
              as_user_id: "agent-1"
              captures: { st: $.data.state }
            - call: "POST /reputation/review-responses/${resp}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { st2: $.data.state }
          assert:
            - "after submit: ReviewResponse.${resp}.state == APPROVED (never PENDING_APPROVAL)"
            - "after submit: ReviewResponse.${resp}.approved_by_user_id == null"
            - "after submit: Review.${rev}.response_state == APPROVED"
            - "after publish: ReviewResponse.${resp}.state == PUBLISHED and Review.${rev}.response_state == RESPONDED"
            - "Location.${loc_id}.responded_review_count == 1"

      - name: cascading_side_effects_across_three_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Location.OPEN_to_RESTRICTED
        excluded_because:
          difficulty_instance: transitive_cascade / ingest_restricts_location_pauses_campaign_suppresses_requests
          rationale: "The three-hop Review -> Location -> Campaign -> ReviewRequest chain is the whole subject of the named §1.8 instance."

      - name: dual_variant_calculation_divergence
        claim_type: dual_variant_calculation
        grounds:
          - calculations.location_reputation_score
        excluded_because:
          difficulty_instance: dual_variant_calc / location_reputation_provisional_vs_certified_diverge
          rationale: "Variant divergence on identical data is asserted directly by the named §1.8 instance."

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: nap_update_response_already_carries_the_recomputed_derived_fields
        claim_type: immediate
        grounds:
          - endpoints
          - calculations.listing_health_score
          - calculations.location_posture
        distinguishing_aspect: "consistency_model is `immediate`: the PUT /nap response body itself already shows listing_health_score 20.00 and posture RESTRICTED — no second read is needed for the cascade to become visible."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; one Location with a single CONNECTED, NAP-matched GOOGLE listing (listing_health_score 50.00, posture OPEN)."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
          trigger:
            - call: "PUT /reputation/locations/${loc_id}/nap"
              payload: { nap_name: "Acme Dental", nap_address: "9 New Ave", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { health: $.data.listing_health_score, posture: $.data.posture, v: $.data.version }
          assert:
            - "the PUT response body itself has listing_health_score == 20.00"
            - "the PUT response body itself has posture == RESTRICTED"
            - "the PUT response body's version is exactly the pre-call Location.version + 1"
            - "a subsequent GET /reputation/locations/${loc_id} returns the identical listing_health_score 20.00 and posture RESTRICTED"
