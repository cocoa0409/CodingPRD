scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dues_provisional_seasonal_vs_trueup_actual_divergence
        grounds:
          - calculations.dues_assessment
          - entities.DuesInvoice.fields.variant_basis
          - entities.DuesInvoice.fields.assessed_cents
          - entities.DuesInvoice.fields.trueup_cents
          - entities.Member.fields.logged_session_count
          - validations[priority=58]
        distinguishing_aspect: |
          The dual variant lives in the money domain on DuesInvoice/Member: provisional_seasonal
          prorates tier fees by billable_months/12 and ignores usage entirely (27584), while
          trueup_actual discards proration and rebills on logged_session_count against a 40%
          floor plus a flat admin fee (36500), so the same member data yields two different
          assessed_cents and a signed trueup_cents of 8916.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default throughout"
            - "one RECREATIONAL member (Rita) with a current swim test, one member acting as SafetyOfficer, one 1X hull"
            - "one OPEN-posture condition reading"
            - "seven WaterSession rows on that hull, each driven PLANNED -> CLEARED -> LAUNCHED -> RETURNED with Rita as the only athlete, giving Member.logged_session_count == 7"
            - "one DuesInvoice for Rita, season 2026, billable_months 4, locker_requested true, still variant_basis PROVISIONAL with assessed_cents 27584"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Sam Officer", tier: "COMPETITIVE", body_weight_kg: 80.0, club_roles: ["LAUNCH_DRIVER"], swim_test_passed_on: "2026-04-01T00:00:00Z", safety_launch_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 20.0, water_temp_c: 18.0, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_open_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T07:00:00Z", athlete_member_ids: ["${rita_id}"] }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /boathouse/water-sessions/${s1_id}/clear"
