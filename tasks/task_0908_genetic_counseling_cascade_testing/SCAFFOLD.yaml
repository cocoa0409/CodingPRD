# =============================================================================
# Genetic Counseling & Cascade Testing — benchmark seed tables (Expert)
# §1.0–§1.7 (SCAFFOLD.yaml). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  Genetic Counseling & Cascade Testing: referral & pedigree/risk, pre-test
  counseling & consent, test order & lab coordination, result disclosure & VUS,
  cascade-testing family outreach, insurance auth & billing, surveillance-plan &
  referral, follow-up

domain_name: genetic-counseling-cascade
api_prefix: ""

complexity_profile:
  primary_archetype: graph_constraint          # self-referential pedigree + cascade propagation through a family graph
  secondary_archetype: workflow_orchestration  # referral -> counseling -> consent -> order -> result -> disclosure -> surveillance
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat                          # peer top-level collections joined by FK refs; PedigreeMember self-referential
  state_machine_shape: parallel                  # CounselingCase carries independent clinical_status x billing_status axes; CascadeInvitation is cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles                         # GeneticCounselor / LabTechnician / BillingSpecialist own distinct resource types; ProgramAdmin sets up
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: family_name, type: string, source: input, description: "Kindred/family display name" }
      - { name: outreach_budget_cents, type: integer, source: input, description: "Total budget authorized for cascade family outreach (non-negative integer cents)" }
      - { name: outreach_reserved_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_cost_cents over CascadeInvitations in status SENT" }
      - { name: outreach_spent_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_cost_cents over CascadeInvitations in status ACCEPTED" }
      - { name: outreach_available_cents, type: integer, source: computed, description: "= outreach_budget_cents - outreach_reserved_cents - outreach_spent_cents" }
      - { name: cascade_invitations_sent_count, type: integer, source: computed, default: 0, description: "Count of CascadeInvitations for this family whose status is not DRAFT (ever SENT)" }
      - { name: cascade_cases_count, type: integer, source: computed, default: 0, description: "Count of CounselingCases in this family with originating_invitation_id set" }
      - { name: cascade_uptake_pct, type: number, source: computed, default: 0, description: "= cascade_cases_count / cascade_invitations_sent_count, 0 when denominator is 0" }

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Genetic counselor name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }

  - name: Lab
    parent: null
    common_fields: true
    fields:
      - { name: lab_name, type: string, source: input, description: "Testing laboratory name" }
      - { name: max_concurrent_capacity, type: integer, source: input, description: "Maximum number of TestOrders whose processing windows may overlap at any instant (>= 1)" }
      - { name: turnaround_days, type: integer, source: input, description: "Nominal result turnaround in days" }
      - { name: current_processing_load, type: integer, source: computed, default: 0, description: "Count of this lab's TestOrders currently in status SUBMITTED" }

  - name: CounselingCase
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id" }
      - { name: assigned_counselor_id, type: string, source: input, description: "FK -> Counselor.id; the counselor of record" }
      - { name: originating_invitation_id, type: string, source: system, default: null, description: "FK -> CascadeInvitation.id; null for a proband case, set when the case is auto-created by accepting a cascade invitation" }
      - { name: patient_name, type: string, source: input, description: "Patient full name" }
      - { name: patient_dob, type: string, source: input, description: "Patient date of birth (YYYY-MM-DD)" }
      - { name: sex, type: enum, source: input, description: "Biological sex", constraints: "MALE | FEMALE | OTHER" }
      - { name: ancestry, type: enum, source: input, description: "Self-reported ancestry (affects prior risk)", constraints: "ASHKENAZI_JEWISH | EUROPEAN | AFRICAN | ASIAN | HISPANIC | OTHER" }
      - { name: relationship_to_proband, type: enum, source: input, default: PROBAND, description: "This patient's relation to the family proband", constraints: "PROBAND | FIRST_DEGREE | SECOND_DEGREE | THIRD_DEGREE" }
      - { name: referral_reason, type: string, source: input, description: "Free-text reason for referral" }
      - { name: familial_variant_known, type: boolean, source: input, default: false, description: "True when a specific pathogenic variant already identified in the family is the test target (enables true-negative interpretation)" }
      - { name: covered_sessions, type: integer, source: input, description: "Number of insurance-authorized counseling sessions for this case (non-negative integer)" }
      - { name: prior_risk_pct, type: number, source: computed, default: null, description: "Pre-test carrier probability as a fraction 0..0.99; set by assess-risk" }
      - { name: residual_risk_pct, type: number, source: computed, default: null, description: "Post-test carrier probability as a fraction; set on result disclosure" }
      - { name: risk_tier, type: enum, source: computed, default: null, description: "Tier from residual_risk_pct if disclosed else prior_risk_pct", constraints: "LOW | MODERATE | HIGH" }
      - { name: carrier_result, type: enum, source: computed, default: null, description: "Interpreted carrier status set on disclosure", constraints: "POSITIVE_PATHOGENIC | NEGATIVE | VUS" }
      - { name: sessions_used, type: integer, source: computed, default: 0, description: "Count of this case's CounselingSessions in status SCHEDULED, COMPLETED, or NO_SHOW" }
      - { name: sessions_remaining, type: integer, source: computed, description: "= covered_sessions - sessions_used" }
      - { name: clinical_status, type: enum, source: system, default: INTAKE, description: "Clinical workflow axis", constraints: "INTAKE | RISK_ASSESSED | TESTING | DISCLOSED | SURVEILLANCE | WITHDRAWN" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "Billing workflow axis, evolves independently of clinical_status", constraints: "UNBILLED | PENDING_AUTH | AUTHORIZED | BILLED | PAID | DENIED" }

  - name: PedigreeMember
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id; the proband case whose pedigree this member belongs to" }
      - { name: related_member_id, type: string, source: input, default: null, description: "FK -> PedigreeMember.id; optional link to another member (tree edge)" }
      - { name: relationship, type: enum, source: input, description: "Relationship to the proband", constraints: "SELF | PARENT | SIBLING | CHILD | GRANDPARENT | AUNT_UNCLE | COUSIN | NIECE_NEPHEW | HALF_SIBLING" }
      - { name: degree, type: integer, source: input, description: "Degree of relationship (0=self, 1=first-degree, 2=second, 3=third)", constraints: "0 | 1 | 2 | 3" }
      - { name: affected, type: boolean, source: input, description: "Whether this member is clinically affected" }
      - { name: age_of_onset, type: integer, source: input, default: null, description: "Age of disease onset in years; null if unknown/unaffected" }
      - { name: deceased, type: boolean, source: input, default: false, description: "Whether the member is deceased" }
      - { name: is_at_risk, type: boolean, source: computed, description: "True when relationship != SELF and degree in {1,2} and not deceased (cascade candidate)" }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id" }
      - { name: consent_type, type: enum, source: input, description: "Kind of consent", constraints: "TESTING | RESULT_DISCLOSURE | CASCADE_CONTACT | DATA_SHARING" }
      - { name: signed_at, type: datetime, source: computed, default: null, description: "Logical-clock timestamp when consent was signed" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Consent lifecycle", constraints: "PENDING | SIGNED | REVOKED" }

  - name: CounselingSession
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id" }
      - { name: counselor_id, type: string, source: input, description: "FK -> Counselor.id; the counselor delivering the session" }
      - { name: session_type, type: enum, source: input, description: "Session purpose", constraints: "PRE_TEST | DISCLOSURE | FOLLOW_UP" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Session lifecycle", constraints: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: TestOrder
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id" }
      - { name: lab_id, type: string, source: input, description: "FK -> Lab.id; the performing lab" }
      - { name: panel_name, type: string, source: input, description: "Name of the genetic panel/test ordered" }
      - { name: cpt_codes, type: array, source: input, default: [], description: "List of CPT code strings billed for this order" }
      - { name: list_price_cents, type: integer, source: input, description: "List price of the test in cents" }
      - { name: processing_start, type: datetime, source: input, description: "Start of the lab processing window (ISO 8601 UTC)" }
      - { name: processing_end, type: datetime, source: input, description: "End of the lab processing window; must be strictly after processing_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Order lifecycle", constraints: "DRAFT | SUBMITTED | RESULTED | CANCELLED" }

  - name: TestResult
    parent: null
    common_fields: true
    fields:
      - { name: test_order_id, type: string, source: input, description: "FK -> TestOrder.id" }
      - { name: gene, type: string, source: input, description: "Gene symbol (e.g., BRCA1)" }
      - { name: variant, type: string, source: input, description: "Variant nomenclature (e.g., c.68_69del)" }
      - { name: classification, type: enum, source: input, description: "ACMG-style variant classification", constraints: "PATHOGENIC | LIKELY_PATHOGENIC | VUS | LIKELY_BENIGN | BENIGN" }
      - { name: is_actionable, type: boolean, source: computed, description: "True when classification in {PATHOGENIC, LIKELY_PATHOGENIC}" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Result lifecycle", constraints: "PENDING | RELEASED | DISCLOSED" }

  - name: CascadeInvitation
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id" }
      - { name: proband_case_id, type: string, source: input, description: "FK -> CounselingCase.id; the index case whose actionable result drives this outreach" }
      - { name: pedigree_member_id, type: string, source: input, description: "FK -> PedigreeMember.id; the at-risk relative being invited" }
      - { name: relative_name, type: string, source: input, description: "Name of the invited relative" }
      - { name: relationship, type: enum, source: input, description: "Relationship of the relative to the proband", constraints: "PARENT | SIBLING | CHILD | GRANDPARENT | AUNT_UNCLE | COUSIN | NIECE_NEPHEW | HALF_SIBLING" }
      - { name: degree, type: integer, source: input, description: "Degree of relationship", constraints: "1 | 2 | 3" }
      - { name: contact_method, type: enum, source: input, description: "Outreach channel", constraints: "LETTER | EMAIL | PHONE" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Reserved outreach cost; computed from contact_method + degree" }
      - { name: expires_at, type: datetime, source: input, description: "Logical-clock instant after which a SENT invitation may be EXPIRED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Invitation lifecycle (cyclic: DECLINED can be re-SENT)", constraints: "DRAFT | SENT | DECLINED | ACCEPTED | EXPIRED" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id" }
      - { name: test_order_id, type: string, source: input, description: "FK -> TestOrder.id; the order being billed" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer name" }
      - { name: member_number, type: string, source: input, description: "Payer member number" }
      - { name: coverage_pct, type: number, source: input, description: "Fraction of allowed amount the payer covers (0..1)" }
      - { name: estimated_allowed_rate, type: number, source: input, description: "Estimated fraction of billed total that the payer will deem allowable (0..1), used at authorization" }
      - { name: line_items, type: array, source: input, description: "Array of objects { cpt: string, billed_cents: integer }" }
      - { name: billed_total_cents, type: integer, source: computed, description: "Sum of line_items[].billed_cents" }
      - { name: estimated_allowed_cents, type: integer, source: computed, default: null, description: "Estimate set at authorization = round_half_up(billed_total_cents * estimated_allowed_rate)" }
      - { name: final_allowed_cents, type: integer, source: computed, default: null, description: "Final allowed set at adjudication = sum of adjudicated line_allowed_cents" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: null, description: "Set at adjudication; per-line rounded patient share, then summed" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Claim lifecycle", constraints: "DRAFT | AUTHORIZED | SUBMITTED | PAID | DENIED | VOID" }

  - name: SurveillancePlan
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id" }
      - { name: risk_tier, type: enum, source: computed, description: "Copied from the case risk_tier at plan creation", constraints: "LOW | MODERATE | HIGH" }
      - { name: modalities, type: array, source: input, default: [], description: "List of screening modality strings (e.g., BREAST_MRI, COLONOSCOPY)" }
      - { name: screening_interval_months, type: integer, source: computed, description: "Derived from risk_tier: HIGH=6, MODERATE=12, LOW=24" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Plan lifecycle", constraints: "ACTIVE | SUPERSEDED | COMPLETED | CANCELLED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: counseling_case_id, type: string, source: input, description: "FK -> CounselingCase.id" }
      - { name: surveillance_plan_id, type: string, source: input, default: null, description: "FK -> SurveillancePlan.id; set when the referral is generated from a plan" }
      - { name: specialty, type: enum, source: input, description: "Referred-to specialty", constraints: "BREAST_SURGERY | GI_ONCOLOGY | GYN_ONCOLOGY | CARDIOLOGY | ENDOCRINOLOGY | HIGH_RISK_CLINIC" }
      - { name: reason, type: string, source: input, description: "Reason for referral" }
      - { name: urgency, type: enum, source: input, default: ROUTINE, description: "Referral urgency", constraints: "ROUTINE | URGENT" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Referral lifecycle", constraints: "PENDING | COMPLETED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --- CounselingCase: clinical axis (parallel dimension #1) ---
  - entity: CounselingCase
    note: "Clinical axis. Evolves independently of the billing axis below (parallel state dimensions on one entity)."
    initial_state: INTAKE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: INTAKE
        to: RISK_ASSESSED
        trigger: "POST /counseling-cases/{id}/assess-risk"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status == INTAKE (ERR_CASE_INVALID_CLINICAL_STATE)"
          - "at least one PedigreeMember exists for the case (ERR_PEDIGREE_EMPTY)"
        side_effects:
          - "compute prior_risk_pct (calc prior_carrier_risk)"
          - "compute risk_tier (calc risk_tier, using prior_risk_pct)"
          - "increments CounselingCase.version by 1"
      - from: RISK_ASSESSED
        to: TESTING
        trigger: "POST /test-orders/{id}/submit"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status == RISK_ASSESSED (ERR_CASE_INVALID_CLINICAL_STATE)"
          - "a ConsentRecord of type TESTING in status SIGNED exists for the case (ERR_CONSENT_REQUIRED)"
          - "lab has processing capacity for the order window (ERR_LAB_CAPACITY_EXCEEDED)"
        side_effects:
          - "TestOrder.status DRAFT -> SUBMITTED"
          - "Lab.current_processing_load recomputed"
          - "case.clinical_status -> TESTING"
          - "increments CounselingCase.version by 1"
      - from: TESTING
        to: DISCLOSED
        trigger: "POST /test-results/{id}/disclose"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status == TESTING (ERR_CASE_INVALID_CLINICAL_STATE)"
          - "TestResult.status == RELEASED (ERR_RESULT_INVALID_STATE)"
        side_effects:
          - "CASCADE HOP B: set case.carrier_result from TestResult.classification; compute case.residual_risk_pct (calc residual_carrier_risk); recompute case.risk_tier; case.clinical_status -> DISCLOSED"
          - "CASCADE HOP C: if TestResult.is_actionable, auto-create a SurveillancePlan (ACTIVE) for the case with risk_tier copied and screening_interval_months derived; case.clinical_status -> SURVEILLANCE"
          - "CASCADE HOP D: if the auto-created SurveillancePlan.risk_tier == HIGH, auto-create a Referral (PENDING, specialty HIGH_RISK_CLINIC, urgency ROUTINE) linked to that plan"
          - "increments CounselingCase.version by 1 (may increment more than once across the cascade hops)"
      - from: DISCLOSED
        to: SURVEILLANCE
        trigger: "POST /surveillance-plans (manual, when no cascade auto-plan was created)"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status == DISCLOSED (ERR_CASE_INVALID_CLINICAL_STATE)"
        side_effects:
          - "case.clinical_status -> SURVEILLANCE"
          - "increments CounselingCase.version by 1"
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /counseling-cases/{id}/withdraw"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status != WITHDRAWN (ERR_CASE_INVALID_CLINICAL_STATE)"
        side_effects:
          - "case.clinical_status -> WITHDRAWN"
          - "increments CounselingCase.version by 1"
      - from: RISK_ASSESSED
        to: WITHDRAWN
        trigger: "POST /counseling-cases/{id}/withdraw"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status != WITHDRAWN (ERR_CASE_INVALID_CLINICAL_STATE)"
        side_effects:
          - "case.clinical_status -> WITHDRAWN"
          - "increments CounselingCase.version by 1"
      - from: TESTING
        to: WITHDRAWN
        trigger: "POST /counseling-cases/{id}/withdraw"
        actor: GeneticCounselor
        preconditions:
          - "case.clinical_status != WITHDRAWN (ERR_CASE_INVALID_CLINICAL_STATE)"
        side_effects:
          - "case.clinical_status -> WITHDRAWN"
          - "increments CounselingCase.version by 1"

  # --- CounselingCase: billing axis (parallel dimension #2) ---
  - entity: CounselingCase
    note: "Billing axis (billing_status). Independent of the clinical axis; driven by the single InsuranceClaim attached to the case."
    initial_state: UNBILLED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: UNBILLED
        to: PENDING_AUTH
        trigger: "POST /insurance-claims"
        actor: BillingSpecialist
        preconditions:
          - "no non-VOID InsuranceClaim already exists for the case (ERR_CLAIM_ALREADY_EXISTS)"
        side_effects:
          - "create InsuranceClaim (DRAFT); compute billed_total_cents"
          - "case.billing_status -> PENDING_AUTH"
          - "increments CounselingCase.version by 1"
      - from: PENDING_AUTH
        to: AUTHORIZED
        trigger: "POST /insurance-claims/{id}/authorize"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == DRAFT (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "compute estimated_allowed_cents (calc claim_allowed_amount, estimated variant)"
          - "InsuranceClaim.status -> AUTHORIZED; case.billing_status -> AUTHORIZED"
          - "increments CounselingCase.version by 1"
      - from: AUTHORIZED
        to: BILLED
        trigger: "POST /insurance-claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == AUTHORIZED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "InsuranceClaim.status -> SUBMITTED; case.billing_status -> BILLED"
          - "increments CounselingCase.version by 1"
      - from: BILLED
        to: PAID
        trigger: "POST /insurance-claims/{id}/adjudicate (outcome=PAID)"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "compute final_allowed_cents (calc claim_allowed_amount, final variant) and patient_responsibility_cents (calc patient_responsibility)"
          - "InsuranceClaim.status -> PAID; case.billing_status -> PAID"
          - "increments CounselingCase.version by 1"
      - from: BILLED
        to: DENIED
        trigger: "POST /insurance-claims/{id}/adjudicate (outcome=DENIED)"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "final_allowed_cents = 0; patient_responsibility_cents = 0"
          - "InsuranceClaim.status -> DENIED; case.billing_status -> DENIED"
          - "increments CounselingCase.version by 1"
      - from: PENDING_AUTH
        to: UNBILLED
        trigger: "POST /insurance-claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status in {DRAFT, AUTHORIZED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "InsuranceClaim.status -> VOID; case.billing_status -> UNBILLED (compensating; billing axis returns to origin)"
          - "increments CounselingCase.version by 1"
      - from: AUTHORIZED
        to: UNBILLED
        trigger: "POST /insurance-claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "InsuranceClaim.status in {DRAFT, AUTHORIZED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "InsuranceClaim.status -> VOID; case.billing_status -> UNBILLED (compensating)"
          - "increments CounselingCase.version by 1"

  # --- ConsentRecord ---
  - entity: ConsentRecord
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /consent-records/{id}/sign"
        actor: GeneticCounselor
        preconditions:
          - "ConsentRecord.status == PENDING (ERR_CONSENT_INVALID_STATE)"
        side_effects:
          - "set signed_at to current logical clock"
      - from: SIGNED
        to: REVOKED
        trigger: "POST /consent-records/{id}/revoke"
        actor: GeneticCounselor
        preconditions:
          - "ConsentRecord.status == SIGNED (ERR_CONSENT_INVALID_STATE)"
          - "no DISCLOSED TestResult exists for the case (ERR_CONSENT_LOCKED_BY_DISCLOSURE)"
        side_effects:
          - "ConsentRecord.status -> REVOKED (compensating)"

  # --- CounselingSession ---
  - entity: CounselingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /counseling-sessions/{id}/complete"
        actor: GeneticCounselor
        preconditions:
          - "CounselingSession.status == SCHEDULED (ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "session counted in sessions_used (no change; remains consumed)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /counseling-sessions/{id}/cancel"
        actor: GeneticCounselor
        preconditions:
          - "CounselingSession.status == SCHEDULED (ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "case.sessions_used decremented; case.sessions_remaining recomputed (credit refunded — compensating; frees the counselor slot)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /counseling-sessions/{id}/no-show"
        actor: GeneticCounselor
        preconditions:
          - "CounselingSession.status == SCHEDULED (ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "session credit remains consumed (NO_SHOW still counts in sessions_used)"

  # --- TestOrder ---
  - entity: TestOrder
    initial_state: DRAFT
    terminal_states: [RESULTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /test-orders/{id}/submit"
        actor: GeneticCounselor
        preconditions:
          - "TestOrder.status == DRAFT (ERR_ORDER_INVALID_STATE)"
          - "case.clinical_status == RISK_ASSESSED (ERR_CASE_INVALID_CLINICAL_STATE)"
          - "SIGNED TESTING consent exists for the case (ERR_CONSENT_REQUIRED)"
          - "lab has processing capacity for the window (ERR_LAB_CAPACITY_EXCEEDED)"
        side_effects:
          - "TestOrder.status -> SUBMITTED; reserve lab processing slot; Lab.current_processing_load recomputed"
          - "case.clinical_status -> TESTING (see CounselingCase clinical axis)"
      - from: SUBMITTED
        to: RESULTED
        trigger: "POST /test-results"
        actor: LabTechnician
        preconditions:
          - "TestOrder.status == SUBMITTED (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "create TestResult (PENDING); TestOrder.status -> RESULTED; Lab.current_processing_load recomputed (slot released)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /test-orders/{id}/cancel"
        actor: GeneticCounselor
        preconditions:
          - "TestOrder.status in {DRAFT, SUBMITTED} (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "TestOrder.status -> CANCELLED; Lab.current_processing_load recomputed"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /test-orders/{id}/cancel"
        actor: GeneticCounselor
        preconditions:
          - "TestOrder.status in {DRAFT, SUBMITTED} (ERR_ORDER_INVALID_STATE)"
        side_effects:
          - "TestOrder.status -> CANCELLED; lab slot released; Lab.current_processing_load recomputed"

  # --- TestResult ---
  - entity: TestResult
    initial_state: PENDING
    terminal_states: [DISCLOSED]
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /test-results/{id}/release"
        actor: LabTechnician
        preconditions:
          - "TestResult.status == PENDING (ERR_RESULT_INVALID_STATE)"
          - "acting Lab (X-User-ID) owns the parent TestOrder.lab_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "TestResult.status -> RELEASED; compute is_actionable"
      - from: RELEASED
        to: DISCLOSED
        trigger: "POST /test-results/{id}/disclose"
        actor: GeneticCounselor
        preconditions:
          - "TestResult.status == RELEASED (ERR_RESULT_INVALID_STATE)"
          - "case.clinical_status == TESTING (ERR_CASE_INVALID_CLINICAL_STATE)"
        side_effects:
          - "TestResult.status -> DISCLOSED"
          - "triggers the disclosure cascade on CounselingCase (see clinical axis DISCLOSED transition: carrier_result, residual_risk_pct, auto SurveillancePlan, auto Referral)"

  # --- CascadeInvitation (cyclic: DECLINED -> SENT re-outreach) ---
  - entity: CascadeInvitation
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /cascade-invitations/{id}/send"
        actor: GeneticCounselor
        preconditions:
          - "CascadeInvitation.status in {DRAFT, DECLINED} (ERR_INVITATION_INVALID_STATE)"
          - "proband case has a DISCLOSED TestResult with is_actionable == true (ERR_RESULT_NOT_ACTIONABLE)"
          - "family.outreach_available_cents >= this invitation's estimated_cost_cents (ERR_OUTREACH_BUDGET_EXCEEDED)"
        side_effects:
          - "CascadeInvitation.status -> SENT; reserve estimated_cost_cents: Family.outreach_reserved_cents += estimated_cost_cents; recompute outreach_available_cents"
          - "Family.cascade_invitations_sent_count recomputed"
      - from: SENT
        to: DECLINED
        trigger: "POST /cascade-invitations/{id}/decline"
        actor: GeneticCounselor
        preconditions:
          - "CascadeInvitation.status == SENT (ERR_INVITATION_INVALID_STATE)"
        side_effects:
          - "release reservation: Family.outreach_reserved_cents -= estimated_cost_cents; recompute outreach_available_cents (compensating)"
      - from: DECLINED
        to: SENT
        trigger: "POST /cascade-invitations/{id}/send"
        actor: GeneticCounselor
        preconditions:
          - "CascadeInvitation.status in {DRAFT, DECLINED} (ERR_INVITATION_INVALID_STATE)"
          - "proband case has a DISCLOSED TestResult with is_actionable == true (ERR_RESULT_NOT_ACTIONABLE)"
          - "family.outreach_available_cents >= estimated_cost_cents (ERR_OUTREACH_BUDGET_EXCEEDED)"
        side_effects:
          - "CascadeInvitation.status -> SENT; re-reserve estimated_cost_cents (cyclic re-outreach)"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /cascade-invitations/{id}/accept"
        actor: GeneticCounselor
        preconditions:
          - "CascadeInvitation.status == SENT (ERR_INVITATION_INVALID_STATE)"
        side_effects:
          - "convert reservation to spend: Family.outreach_reserved_cents -= estimated_cost_cents; Family.outreach_spent_cents += estimated_cost_cents"
          - "CASCADE HOP B: auto-create a new CounselingCase for the relative (family_id, relationship_to_proband from degree, originating_invitation_id = this invitation, assigned_counselor_id from proband case, familial_variant_known = true)"
          - "CASCADE HOP C: the new CounselingCase creation recomputes Family.cascade_cases_count and Family.cascade_uptake_pct"
      - from: SENT
        to: EXPIRED
        trigger: "POST /cascade-invitations/{id}/expire"
        actor: GeneticCounselor
        preconditions:
          - "CascadeInvitation.status == SENT (ERR_INVITATION_INVALID_STATE)"
          - "current logical clock >= expires_at (ERR_INVITATION_NOT_EXPIRABLE)"
        side_effects:
          - "release reservation: Family.outreach_reserved_cents -= estimated_cost_cents; recompute outreach_available_cents (compensating)"

  # --- SurveillancePlan ---
  - entity: SurveillancePlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when a newer ACTIVE SurveillancePlan is created for the same case via POST /surveillance-plans)"
        actor: system
        preconditions:
          - "a newer SurveillancePlan is being created for the same case"
        side_effects:
          - "prior ACTIVE plan.status -> SUPERSEDED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /surveillance-plans/{id}/close (outcome=COMPLETED)"
        actor: GeneticCounselor
        preconditions:
          - "SurveillancePlan.status == ACTIVE (ERR_PLAN_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /surveillance-plans/{id}/close (outcome=CANCELLED)"
        actor: GeneticCounselor
        preconditions:
          - "SurveillancePlan.status == ACTIVE (ERR_PLAN_INVALID_STATE)"
        side_effects: []

  # --- Referral ---
  - entity: Referral
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /referrals/{id}/close (outcome=COMPLETED)"
        actor: GeneticCounselor
        preconditions:
          - "Referral.status == PENDING (ERR_REFERRAL_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /referrals/{id}/close (outcome=CANCELLED)"
        actor: GeneticCounselor
        preconditions:
          - "Referral.status == PENDING (ERR_REFERRAL_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: surveillance-plan-create-stale-case
    parent_entity: CounselingCase
    write_endpoint: "POST /surveillance-plans"
    occ_field: "expected_counseling_case_version"
    description: |
      Creating a SurveillancePlan against a CounselingCase whose version has
      advanced since the client last observed it is rejected. A new ACTIVE plan
      legitimately supersedes the prior ACTIVE plan for that case; if another
      writer has already created such a plan (bumping the case version), the
      current writer's view of the case is stale and the create is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prior_carrier_risk
    trigger: "POST /counseling-cases/{id}/assess-risk"
    algorithm: weighted_scoring
    formula: |
      degree_weight = {1: 1.0, 2: 0.5, 3: 0.25}   # SELF/0 and unknown -> 0
      onset_multiplier(age):
        age < 40            -> 3
        40 <= age < 50      -> 2
        age >= 50           -> 1
        age is null/unknown -> 1
      affected_units = sum over PedigreeMembers m of this case where
                       m.affected == true and m.relationship != SELF of
                       ( degree_weight.get(m.degree, 0) * onset_multiplier(m.age_of_onset) )
      raw = POP_BASELINE + affected_units * PER_UNIT
      ancestry_bonus = ASHKENAZI_BONUS if case.ancestry == ASHKENAZI_JEWISH else 0
      prior_risk_pct = round_half_up( min(RISK_CAP, raw + ancestry_bonus), 4 )
    input_set: "All PedigreeMembers whose counseling_case_id == case.id; only affected, non-SELF members contribute."
    constants:
      POP_BASELINE: 0.05
      PER_UNIT: 0.05
      ASHKENAZI_BONUS: 0.10
      RISK_CAP: 0.99
    precision: "4 decimal places, round_half_up"

  - name: residual_carrier_risk
    trigger: "POST /test-results/{id}/disclose (disclosure cascade)"
    algorithm: projection
    formula: |
      carrier_result mapping from TestResult.classification:
        PATHOGENIC | LIKELY_PATHOGENIC -> POSITIVE_PATHOGENIC
        BENIGN | LIKELY_BENIGN         -> NEGATIVE
        VUS                            -> VUS
      if carrier_result == POSITIVE_PATHOGENIC:
        residual_risk_pct = CONFIRMED_CARRIER
      elif carrier_result == NEGATIVE:
        if case.familial_variant_known == true:  # true negative
          residual_risk_pct = POP_BASELINE
        else:                                     # uninformative negative
          residual_risk_pct = round_half_up(case.prior_risk_pct * UNINFORMATIVE_FACTOR, 4)
      elif carrier_result == VUS:
        residual_risk_pct = case.prior_risk_pct   # VUS does not change management
    input_set: "The single disclosed TestResult for the case's TestOrder; the case's prior_risk_pct and familial_variant_known flag."
    constants:
      POP_BASELINE: 0.05
      UNINFORMATIVE_FACTOR: 0.5
      CONFIRMED_CARRIER: 0.99
    precision: "4 decimal places, round_half_up"
    variants:
      - name: prior_pretest
        when: "at assess-risk, before any result"
        difference: "carrier probability from pedigree only (prior_carrier_risk); this is the pre-test variant on the CounselingCase risk"
      - name: residual_posttest
        when: "at disclosure, after the result classification is known"
        difference: "Bayesian-style post-test update; a true-negative collapses to POP_BASELINE while a positive jumps to CONFIRMED_CARRIER — different result from the same case"

  - name: risk_tier
    trigger: "assess-risk (prior) and disclosure cascade (residual)"
    algorithm: threshold
    formula: |
      r = residual_risk_pct if residual_risk_pct is not null else prior_risk_pct
      risk_tier = HIGH      if r >= HIGH_THRESHOLD
                  MODERATE  if MODERATE_THRESHOLD <= r < HIGH_THRESHOLD
                  LOW       if r < MODERATE_THRESHOLD
    input_set: "The case's residual_risk_pct if set, else prior_risk_pct."
    constants:
      HIGH_THRESHOLD: 0.20
      MODERATE_THRESHOLD: 0.10
    precision: "exact fraction comparison; HIGH boundary is inclusive (>=)"

  - name: cascade_invitation_cost
    trigger: "CascadeInvitation creation (estimated_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      base = { LETTER: 500, EMAIL: 100, PHONE: 800 }[contact_method]
      surcharge = { 1: 0, 2: 200, 3: 400 }[degree]
      estimated_cost_cents = base + surcharge
    input_set: "The invitation's contact_method and degree."
    constants:
      LETTER_BASE: 500
      EMAIL_BASE: 100
      PHONE_BASE: 800
      DEGREE2_SURCHARGE: 200
      DEGREE3_SURCHARGE: 400
    precision: "integer cents"

  - name: family_outreach_ledger
    trigger: "any CascadeInvitation send/decline/accept/expire"
    algorithm: aggregation
    formula: |
      outreach_reserved_cents = sum(inv.estimated_cost_cents for inv in family invitations where inv.status == SENT)
      outreach_spent_cents    = sum(inv.estimated_cost_cents for inv in family invitations where inv.status == ACCEPTED)
      outreach_available_cents = family.outreach_budget_cents - outreach_reserved_cents - outreach_spent_cents
    input_set: "All CascadeInvitations whose family_id == family.id, filtered by status."
    precision: "integer cents"
    note: "Invariant: outreach_budget_cents == outreach_available_cents + outreach_reserved_cents + outreach_spent_cents at all times."

  - name: session_credit_ledger
    trigger: "CounselingSession create/cancel/complete/no-show"
    algorithm: aggregation
    formula: |
      sessions_used = count(s for s in case sessions where s.status in {SCHEDULED, COMPLETED, NO_SHOW})
      sessions_remaining = case.covered_sessions - sessions_used
    input_set: "All CounselingSessions whose counseling_case_id == case.id; CANCELLED sessions are excluded (credit refunded)."
    precision: "integer count"
    note: "Invariant: covered_sessions == sessions_remaining + sessions_used at all times."

  - name: cascade_uptake
    trigger: "CascadeInvitation status change and cascade-created CounselingCase creation"
    algorithm: aggregation
    formula: |
      cascade_invitations_sent_count = count(inv for inv in family invitations where inv.status != DRAFT)
      cascade_cases_count = count(c for c in family cases where c.originating_invitation_id is not null)
      cascade_uptake_pct = round_half_up(cascade_cases_count / cascade_invitations_sent_count, 4)
                           if cascade_invitations_sent_count > 0 else 0.0
    input_set: "CascadeInvitations and CounselingCases whose family_id == family.id."
    precision: "4 decimal places, round_half_up; empty-denominator yields exactly 0.0"

  - name: claim_allowed_amount
    trigger: "authorize (estimated) and adjudicate (final)"
    algorithm: forward_looking
    formula: |
      billed_total_cents = sum(li.billed_cents for li in claim.line_items)
      # estimated variant (at authorization):
      estimated_allowed_cents = round_half_up(billed_total_cents * claim.estimated_allowed_rate)
      # final variant (at adjudication, outcome=PAID):
      final_allowed_cents = sum(line_allowed_cents[i] for i in adjudication payload)  # payer fee schedule per line
    input_set: "The claim's line_items (estimate) vs the adjudication payload's per-line allowed amounts (final)."
    precision: "integer cents, round_half_up on the estimate"
    variants:
      - name: estimated_at_auth
        when: "authorize"
        difference: "flat estimated_allowed_rate applied to billed_total_cents"
      - name: final_at_adjudication
        when: "adjudicate (PAID)"
        difference: "sum of payer-adjudicated per-line allowed amounts; generally differs from the estimate"

  - name: patient_responsibility
    trigger: "adjudicate (outcome=PAID)"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each line's patient share to the nearest cent, THEN sum.
      patient_responsibility_cents =
        sum( round_half_up( line_allowed_cents[i] * (1 - claim.coverage_pct) ) for i in adjudication payload )
      # (This differs from sum-then-round when per-line fractional cents accumulate.)
    input_set: "The adjudication payload's per-line allowed amounts and the claim's coverage_pct."
    precision: "integer cents; per-line round_half_up then sum (order is load-bearing)"

  - name: surveillance_interval
    trigger: "SurveillancePlan creation"
    algorithm: threshold
    formula: |
      screening_interval_months = { HIGH: 6, MODERATE: 12, LOW: 24 }[plan.risk_tier]
    input_set: "The plan's risk_tier (copied from the case at creation)."
    constants:
      HIGH_MONTHS: 6
      MODERATE_MONTHS: 12
      LOW_MONTHS: 24
    precision: "integer months"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "For entity_backed ownership actions (lab result release, counselor books own session), X-User-ID matches the owning entity id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /test-results/{id}/release, POST /counseling-sessions"

  - priority: 5
    category: state
    check: "OCC: expected_counseling_case_version equals CounselingCase.version (when the endpoint requires it)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /surveillance-plans"

  - priority: 6
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; numeric ranges (coverage_pct/estimated_allowed_rate in 0..1; scheduled_end > scheduled_start; processing_end > processing_start; degree in allowed set)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints

  - priority: 7
    category: state
    check: "Target resource is in a state permitting this transition (clinical/billing/order/result/consent/session/invitation/plan/referral state machines)"
    error_id: "ERR_*_INVALID_STATE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_safety
    check: "A SIGNED TESTING ConsentRecord exists for the case before a TestOrder may be submitted"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /test-orders/{id}/submit"

  - priority: 9
    category: business_referential
    check: "Cascade outreach requires the proband case to have a DISCLOSED, actionable TestResult"
    error_id: ERR_RESULT_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /cascade-invitations/{id}/send"

  - priority: 10
    category: business_temporal
    check: "Temporal-overlap rules: counselor double-booking (buffered adjacency); lab aggregate processing capacity"
    error_id: "ERR_COUNSELOR_DOUBLE_BOOKED | ERR_LAB_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /counseling-sessions, POST /test-orders/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "Uniqueness/structural: at most one non-VOID InsuranceClaim per case; a PedigreeMember with relationship SELF has degree 0; invitation can only expire when clock >= expires_at"
    error_id: "ERR_CLAIM_ALREADY_EXISTS | ERR_INVITATION_NOT_EXPIRABLE"
    http_status: 409
    applies_to: "POST /insurance-claims, POST /cascade-invitations/{id}/expire"

  - priority: 12
    category: business_fiscal
    check: "Sufficient session credits (sessions_remaining > 0) to book a session; sufficient family outreach budget to send an invitation"
    error_id: "ERR_NO_SESSION_CREDITS | ERR_OUTREACH_BUDGET_EXCEEDED"
    http_status: 402
    applies_to: "POST /counseling-sessions, POST /cascade-invitations/{id}/send"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Family ----
  - method: POST
    path: "/families"
    description: "Create a family/kindred with an outreach budget"
    roles: [ProgramAdmin]
    code: 201
    input: [family_name, outreach_budget_cents]
    output: Family
    side_effects: ["outreach_reserved_cents=0, outreach_spent_cents=0, outreach_available_cents=outreach_budget_cents"]
  - method: GET
    path: "/families/{id}"
    description: "Get a family (includes outreach ledger and cascade uptake)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: Family
    side_effects: []

  # ---- Counselor ----
  - method: POST
    path: "/counselors"
    description: "Register a genetic counselor"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, npi]
    output: Counselor
    side_effects: []
  - method: GET
    path: "/counselors/{id}"
    description: "Get a counselor"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: Counselor
    side_effects: []

  # ---- Lab ----
  - method: POST
    path: "/labs"
    description: "Register a testing lab with concurrency capacity"
    roles: [ProgramAdmin]
    code: 201
    input: [lab_name, max_concurrent_capacity, turnaround_days]
    output: Lab
    side_effects: ["current_processing_load=0"]
  - method: GET
    path: "/labs/{id}"
    description: "Get a lab (includes current_processing_load)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: Lab
    side_effects: []

  # ---- CounselingCase ----
  - method: POST
    path: "/counseling-cases"
    description: "Open a counseling case (proband or, via cascade accept, a relative)"
    roles: [GeneticCounselor]
    code: 201
    input: [family_id, assigned_counselor_id, patient_name, patient_dob, sex, ancestry, "relationship_to_proband?", referral_reason, "familial_variant_known?", covered_sessions]
    output: CounselingCase
    side_effects: ["clinical_status=INTAKE, billing_status=UNBILLED, sessions_used=0, sessions_remaining=covered_sessions"]
  - method: GET
    path: "/counseling-cases"
    description: "List counseling cases (filterable)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["family_id?", "assigned_counselor_id?", "originating_invitation_id?", "limit?", "offset?"]
    output: "CounselingCase[]"
    side_effects: []
  - method: GET
    path: "/counseling-cases/{id}"
    description: "Get a counseling case"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: CounselingCase
    side_effects: []
  - method: POST
    path: "/counseling-cases/{id}/assess-risk"
    description: "Compute pedigree-based prior risk and risk tier"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselingCase
    side_effects: ["prior_risk_pct and risk_tier computed; clinical_status INTAKE -> RISK_ASSESSED; version += 1"]
  - method: POST
    path: "/counseling-cases/{id}/withdraw"
    description: "Withdraw a case from the workflow"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselingCase
    side_effects: ["clinical_status -> WITHDRAWN; version += 1"]

  # ---- PedigreeMember ----
  - method: POST
    path: "/pedigree-members"
    description: "Add a pedigree member to a case"
    roles: [GeneticCounselor]
    code: 201
    input: [counseling_case_id, relationship, degree, affected, "age_of_onset?", "deceased?", "related_member_id?"]
    output: PedigreeMember
    side_effects: ["is_at_risk computed"]
  - method: GET
    path: "/pedigree-members"
    description: "List pedigree members (filterable by case or linked member)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "related_member_id?", "limit?", "offset?"]
    output: "PedigreeMember[]"
    side_effects: []
  - method: GET
    path: "/pedigree-members/{id}"
    description: "Get a pedigree member"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: PedigreeMember
    side_effects: []

  # ---- ConsentRecord ----
  - method: POST
    path: "/consent-records"
    description: "Create a consent record for a case"
    roles: [GeneticCounselor]
    code: 201
    input: [counseling_case_id, consent_type]
    output: ConsentRecord
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/consent-records"
    description: "List consent records (filterable by case)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []
  - method: GET
    path: "/consent-records/{id}"
    description: "Get a consent record"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: POST
    path: "/consent-records/{id}/sign"
    description: "Sign a pending consent"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["status PENDING -> SIGNED; signed_at set to clock"]
  - method: POST
    path: "/consent-records/{id}/revoke"
    description: "Revoke a signed consent (compensating)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["status SIGNED -> REVOKED"]

  # ---- CounselingSession ----
  - method: POST
    path: "/counseling-sessions"
    description: "Book a counseling session (consumes a session credit; counselor must not be double-booked)"
    roles: [GeneticCounselor]
    code: 201
    input: [counseling_case_id, counselor_id, session_type, scheduled_start, scheduled_end]
    output: CounselingSession
    side_effects: ["status=SCHEDULED; case.sessions_used += 1; case.sessions_remaining recomputed; reserves counselor slot"]
  - method: GET
    path: "/counseling-sessions"
    description: "List counseling sessions (filterable by case or counselor)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "counselor_id?", "limit?", "offset?"]
    output: "CounselingSession[]"
    side_effects: []
  - method: GET
    path: "/counseling-sessions/{id}"
    description: "Get a counseling session"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: CounselingSession
    side_effects: []
  - method: POST
    path: "/counseling-sessions/{id}/complete"
    description: "Mark a session completed"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status SCHEDULED -> COMPLETED (credit remains consumed)"]
  - method: POST
    path: "/counseling-sessions/{id}/cancel"
    description: "Cancel a session (refunds the session credit)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status SCHEDULED -> CANCELLED; case.sessions_used -= 1; sessions_remaining recomputed; frees counselor slot"]
  - method: POST
    path: "/counseling-sessions/{id}/no-show"
    description: "Mark a session as a no-show (credit NOT refunded)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CounselingSession
    side_effects: ["status SCHEDULED -> NO_SHOW (credit remains consumed)"]

  # ---- TestOrder ----
  - method: POST
    path: "/test-orders"
    description: "Draft a genetic test order for a case at a lab"
    roles: [GeneticCounselor]
    code: 201
    input: [counseling_case_id, lab_id, panel_name, "cpt_codes?", list_price_cents, processing_start, processing_end]
    output: TestOrder
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/test-orders"
    description: "List test orders (filterable by case or lab)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "lab_id?", "limit?", "offset?"]
    output: "TestOrder[]"
    side_effects: []
  - method: GET
    path: "/test-orders/{id}"
    description: "Get a test order"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: TestOrder
    side_effects: []
  - method: POST
    path: "/test-orders/{id}/submit"
    description: "Submit a drafted order to the lab (checks consent + lab capacity)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: TestOrder
    side_effects: ["status DRAFT -> SUBMITTED; case.clinical_status RISK_ASSESSED -> TESTING; Lab.current_processing_load recomputed"]
  - method: POST
    path: "/test-orders/{id}/cancel"
    description: "Cancel an order (releases lab slot)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: TestOrder
    side_effects: ["status -> CANCELLED; Lab.current_processing_load recomputed"]

  # ---- TestResult ----
  - method: POST
    path: "/test-results"
    description: "Lab enters a result for a submitted order (moves order to RESULTED)"
    roles: [LabTechnician]
    code: 201
    input: [test_order_id, gene, variant, classification]
    output: TestResult
    side_effects: ["status=PENDING; TestOrder.status SUBMITTED -> RESULTED; Lab.current_processing_load recomputed"]
  - method: GET
    path: "/test-results"
    description: "List test results (filterable by order)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["test_order_id?", "limit?", "offset?"]
    output: "TestResult[]"
    side_effects: []
  - method: GET
    path: "/test-results/{id}"
    description: "Get a test result"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: TestResult
    side_effects: []
  - method: POST
    path: "/test-results/{id}/release"
    description: "Lab releases a pending result (owning lab only)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: TestResult
    side_effects: ["status PENDING -> RELEASED; is_actionable computed"]
  - method: POST
    path: "/test-results/{id}/disclose"
    description: "Counselor discloses a released result — triggers the disclosure cascade"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: TestResult
    side_effects: ["status RELEASED -> DISCLOSED; case carrier_result/residual_risk_pct/risk_tier updated; auto SurveillancePlan + Referral when actionable/HIGH; case.version bumped"]

  # ---- CascadeInvitation ----
  - method: POST
    path: "/cascade-invitations"
    description: "Draft a cascade outreach invitation to an at-risk relative"
    roles: [GeneticCounselor]
    code: 201
    input: [family_id, proband_case_id, pedigree_member_id, relative_name, relationship, degree, contact_method, expires_at]
    output: CascadeInvitation
    side_effects: ["status=DRAFT; estimated_cost_cents computed (calc cascade_invitation_cost)"]
  - method: GET
    path: "/cascade-invitations"
    description: "List cascade invitations (filterable)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["family_id?", "proband_case_id?", "pedigree_member_id?", "limit?", "offset?"]
    output: "CascadeInvitation[]"
    side_effects: []
  - method: GET
    path: "/cascade-invitations/{id}"
    description: "Get a cascade invitation"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: CascadeInvitation
    side_effects: []
  - method: POST
    path: "/cascade-invitations/{id}/send"
    description: "Send (or re-send a declined) invitation — reserves outreach budget"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CascadeInvitation
    side_effects: ["status {DRAFT,DECLINED} -> SENT; Family.outreach_reserved_cents += estimated_cost_cents; ledger recomputed"]
  - method: POST
    path: "/cascade-invitations/{id}/decline"
    description: "Record a decline — releases the reservation (compensating)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CascadeInvitation
    side_effects: ["status SENT -> DECLINED; Family.outreach_reserved_cents -= estimated_cost_cents; ledger recomputed"]
  - method: POST
    path: "/cascade-invitations/{id}/accept"
    description: "Record acceptance — converts reservation to spend and auto-creates the relative's case"
    roles: [GeneticCounselor]
    code: 200
    input: ["patient_dob?", "covered_sessions?"]
    output: CascadeInvitation
    side_effects: ["status SENT -> ACCEPTED; reserved -> spent; auto-create relative CounselingCase; Family cascade counters recomputed"]
  - method: POST
    path: "/cascade-invitations/{id}/expire"
    description: "Expire a sent invitation once the clock passes expires_at (compensating)"
    roles: [GeneticCounselor]
    code: 200
    input: []
    output: CascadeInvitation
    side_effects: ["status SENT -> EXPIRED; Family.outreach_reserved_cents -= estimated_cost_cents; ledger recomputed"]

  # ---- InsuranceClaim ----
  - method: POST
    path: "/insurance-claims"
    description: "Open an insurance claim for a case's test order"
    roles: [BillingSpecialist]
    code: 201
    input: [counseling_case_id, test_order_id, payer_name, member_number, coverage_pct, estimated_allowed_rate, line_items]
    output: InsuranceClaim
    side_effects: ["status=DRAFT; billed_total_cents computed; case.billing_status -> PENDING_AUTH; case.version += 1"]
  - method: GET
    path: "/insurance-claims"
    description: "List insurance claims (filterable by case or order)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "test_order_id?", "limit?", "offset?"]
    output: "InsuranceClaim[]"
    side_effects: []
  - method: GET
    path: "/insurance-claims/{id}"
    description: "Get an insurance claim"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []
  - method: POST
    path: "/insurance-claims/{id}/authorize"
    description: "Grant prior authorization; computes the estimated allowed amount"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status DRAFT -> AUTHORIZED; estimated_allowed_cents computed; case.billing_status -> AUTHORIZED; case.version += 1"]
  - method: POST
    path: "/insurance-claims/{id}/submit"
    description: "Submit the authorized claim to the payer"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status AUTHORIZED -> SUBMITTED; case.billing_status -> BILLED; case.version += 1"]
  - method: POST
    path: "/insurance-claims/{id}/adjudicate"
    description: "Adjudicate a submitted claim (PAID computes final allowed + patient responsibility)"
    roles: [BillingSpecialist]
    code: 200
    input: [outcome, "line_allowed_cents?"]
    output: InsuranceClaim
    side_effects: ["status SUBMITTED -> PAID|DENIED; final_allowed_cents + patient_responsibility_cents computed on PAID; case.billing_status updated; case.version += 1"]
  - method: POST
    path: "/insurance-claims/{id}/void"
    description: "Void a draft/authorized claim (compensating; billing axis returns to UNBILLED)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status {DRAFT,AUTHORIZED} -> VOID; case.billing_status -> UNBILLED; case.version += 1"]

  # ---- SurveillancePlan ----
  - method: POST
    path: "/surveillance-plans"
    description: "Create a surveillance plan for a disclosed case (OCC on the case version; supersedes prior ACTIVE plan)"
    roles: [GeneticCounselor]
    code: 201
    input: [counseling_case_id, "modalities?", expected_counseling_case_version]
    output: SurveillancePlan
    side_effects: ["risk_tier copied from case; screening_interval_months derived; prior ACTIVE plan for case -> SUPERSEDED; case.clinical_status DISCLOSED -> SURVEILLANCE; increments CounselingCase.version by 1"]
  - method: GET
    path: "/surveillance-plans"
    description: "List surveillance plans (filterable by case)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "limit?", "offset?"]
    output: "SurveillancePlan[]"
    side_effects: []
  - method: GET
    path: "/surveillance-plans/{id}"
    description: "Get a surveillance plan"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: SurveillancePlan
    side_effects: []
  - method: POST
    path: "/surveillance-plans/{id}/close"
    description: "Close an active plan (COMPLETED or CANCELLED)"
    roles: [GeneticCounselor]
    code: 200
    input: [outcome]
    output: SurveillancePlan
    side_effects: ["status ACTIVE -> COMPLETED|CANCELLED"]

  # ---- Referral ----
  - method: POST
    path: "/referrals"
    description: "Create a specialist referral for a case (optionally linked to a surveillance plan)"
    roles: [GeneticCounselor]
    code: 201
    input: [counseling_case_id, specialty, reason, "urgency?", "surveillance_plan_id?"]
    output: Referral
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/referrals"
    description: "List referrals (filterable by case or plan)"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["counseling_case_id?", "surveillance_plan_id?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Get a referral"
    roles: [GeneticCounselor, LabTechnician, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/referrals/{id}/close"
    description: "Close a pending referral (COMPLETED or CANCELLED)"
    roles: [GeneticCounselor]
    code: 200
    input: [outcome]
    output: Referral
    side_effects: ["status PENDING -> COMPLETED|CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor (lab/counselor) is not the owner of the target resource" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing/malformed body field, invalid enum, out-of-range number, or end<=start interval" }
  - { id: ERR_FAMILY_NOT_FOUND, http: 404, condition: "Family id not found" }
  - { id: ERR_COUNSELOR_NOT_FOUND, http: 404, condition: "Counselor id not found" }
  - { id: ERR_LAB_NOT_FOUND, http: 404, condition: "Lab id not found" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "CounselingCase id not found" }
  - { id: ERR_PEDIGREE_MEMBER_NOT_FOUND, http: 404, condition: "PedigreeMember id not found" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "ConsentRecord id not found" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "CounselingSession id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "TestOrder id not found" }
  - { id: ERR_RESULT_NOT_FOUND, http: 404, condition: "TestResult id not found" }
  - { id: ERR_INVITATION_NOT_FOUND, http: 404, condition: "CascadeInvitation id not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "InsuranceClaim id not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "SurveillancePlan id not found" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral id not found" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_counseling_case_version does not match CounselingCase.version" }
  - { id: ERR_PEDIGREE_EMPTY, http: 409, condition: "assess-risk called on a case with no pedigree members" }
  - { id: ERR_CASE_INVALID_CLINICAL_STATE, http: 409, condition: "Case clinical_status does not permit the requested transition" }
  - { id: ERR_CONSENT_INVALID_STATE, http: 409, condition: "Consent not in a state permitting sign/revoke" }
  - { id: ERR_CONSENT_LOCKED_BY_DISCLOSURE, http: 409, condition: "Cannot revoke consent once a result has been disclosed for the case" }
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "No SIGNED TESTING consent exists for the case at test-order submit" }
  - { id: ERR_SESSION_INVALID_STATE, http: 409, condition: "Session not in SCHEDULED state for the requested transition" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Test order not in a state permitting the requested transition" }
  - { id: ERR_RESULT_INVALID_STATE, http: 409, condition: "Test result not in the required state for release/disclose" }
  - { id: ERR_RESULT_NOT_ACTIONABLE, http: 409, condition: "Cascade send requires a DISCLOSED actionable proband result" }
  - { id: ERR_INVITATION_INVALID_STATE, http: 409, condition: "Cascade invitation not in a state permitting the requested transition" }
  - { id: ERR_INVITATION_NOT_EXPIRABLE, http: 409, condition: "Invitation cannot expire before its expires_at instant" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Insurance claim not in a state permitting the requested transition" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "A non-VOID claim already exists for the case" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Surveillance plan not ACTIVE for close" }
  - { id: ERR_REFERRAL_INVALID_STATE, http: 409, condition: "Referral not PENDING for close" }
  - { id: ERR_COUNSELOR_DOUBLE_BOOKED, http: 409, condition: "Session overlaps (within buffer) another of the counselor's sessions" }
  - { id: ERR_LAB_CAPACITY_EXCEEDED, http: 409, condition: "Lab concurrent processing capacity would be exceeded for the order window" }
  - { id: ERR_NO_SESSION_CREDITS, http: 402, condition: "No remaining covered session credits to book a session" }
  - { id: ERR_OUTREACH_BUDGET_EXCEEDED, http: 402, condition: "Family outreach budget insufficient to reserve the invitation cost" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GeneticCounselor
    description: "Clinical owner: cases, pedigree, consent, sessions, orders (draft/submit/cancel), disclosure, cascade outreach, surveillance plans, referrals"
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /counseling-cases and /{id}/assess-risk, /{id}/withdraw"
      - "POST /pedigree-members"
      - "POST /consent-records and /{id}/sign, /{id}/revoke"
      - "POST /counseling-sessions and /{id}/complete,/cancel,/no-show (books only own sessions: counselor_id == X-User-ID)"
      - "POST /test-orders and /{id}/submit,/cancel"
      - "POST /test-results/{id}/disclose"
      - "POST /cascade-invitations and /{id}/send,/decline,/accept,/expire"
      - "POST /surveillance-plans and /{id}/close"
      - "POST /referrals and /{id}/close"
    shared_operations:
      - "All GET endpoints"

  - name: LabTechnician
    description: "Lab operator: enters and releases results for its own orders"
    identity: "entity_backed:Lab"
    exclusive_operations:
      - "POST /test-results"
      - "POST /test-results/{id}/release (owning lab only: X-User-ID == parent TestOrder.lab_id)"
    shared_operations:
      - "All GET endpoints"

  - name: BillingSpecialist
    description: "Insurance authorization and billing lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-claims and /{id}/authorize,/submit,/adjudicate,/void"
    shared_operations:
      - "All GET endpoints"

  - name: ProgramAdmin
    description: "Setup/config: families, counselors, labs, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /families, POST /counselors, POST /labs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
