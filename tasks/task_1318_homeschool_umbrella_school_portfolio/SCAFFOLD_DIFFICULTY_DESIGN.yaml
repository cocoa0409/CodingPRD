  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: coop_confirm_drop_roundtrip_invariant
        grounds:
          - state_machines.CoopEnrollment.CONFIRMED_to_DROPPED
          - calculations.coop_refund_waterfall
          - entities.CoopClass.fields.seats_taken
          - entities.Family.fields.fee_balance_cents
        distinguishing_aspect: |
          Conserved quantity = CoopClass.seats_taken (seat inventory): register
          (CONFIRMED, +1) paired with parent drop pre-start (-1) returns
          seats_taken to exactly its prior value 0; the money drift is pinned
          explicitly to ADMIN_FEE_CENTS (2500) and nothing else.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-4 student; enrollment ACTIVE"
            - "Class capacity 2, TUE 09:00-10:30, start 2026-08-25 (no early-bird at 2026-08-01), base 10000, materials 1000; OPEN; seats_taken == 0; family balance == 0"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Inv", district_code: "D-24" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Inv", date_of_birth: "2016-12-12" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-24" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "Choir", subject: "Music", grade_min: 0, grade_max: 12, meeting_day: "TUE", meeting_start_minutes: 540, meeting_end_minutes: 630, start_date: "2026-08-25", end_date: "2026-12-15", capacity: 2, fee_base_cents: 10000, materials_fee_cents: 1000 }, as: Registrar, captures: { cls: $.data.id } }
            - { call: "POST /coop-classes/${cls}/open", payload: {}, as: Registrar }
            - { call: "GET /coop-classes/${cls}", payload: {}, as: Registrar, captures: { cv: $.data.version, seats0: $.data.seats_taken } }
            - { call: "POST /coop-classes/${cls}/enrollments", payload: { enrollment_id: "${enr}", expected_coop_class_version: "${cv}" }, as: Parent, as_user_id: "${fam}", captures: { ce: $.data.id, fee: $.data.fee_cents } }
          trigger:
            - { call: "POST /coop-enrollments/${ce}/drop", payload: {}, as: Parent, as_user_id: "${fam}", captures: { ref: $.data.refund_cents, dr: $.data.drop_reason, st: $.data.status } }
            - { call: "GET /coop-classes/${cls}", payload: {}, as: Registrar, captures: { seats1: $.data.seats_taken } }
            - { call: "GET /families/${fam}/ledger", payload: {}, as: Registrar, captures: { bal: $.data.fee_balance_cents } }
          assert:
            - "CoopClass.${cls}.seats_taken == 0 before registration and == 0 after the drop (invariant restored)"
            - "CoopEnrollment.${ce}: fee_cents == 11000, refund_cents == 8500 (11000 - 2500 admin fee), drop_reason == PARENT_INITIATED, status == DROPPED"
            - "Family.${fam}.fee_balance_cents == 2500 == ADMIN_FEE_CENTS exactly (the only permitted drift)"

      - name: credit_post_revoke_roundtrip_invariant
        grounds:
          - state_machines.CourseCredit.POSTED_to_REVOKED
          - calculations.graduation_credit_audit
          - calculations.gpa_official
          - entities.Student.fields.transcript_sealed
        distinguishing_aspect: |
          Conserved quantity = Student transcript totals (academic credit, a
          different quantity than seat inventory): post (+1.0 ENGLISH, gpa 4.0)
          paired with revoke returns official_credits_total to exactly 0.0 and
          gpa_official to null; the invariant total == sum(credit_value over
          POSTED) holds before and after.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-12 student; enrollment ACTIVE"
            - "CourseCredit ENGLISH 120h grade A carried through COMPLETED, VERIFIED, POSTED"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Rev", district_code: "D-25" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Rev", date_of_birth: "2008-01-12" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 12 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-25" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/course-credits", payload: { subject: "ENGLISH", course_title: "English 12", planned_hours: 120 }, as: Parent, as_user_id: "${fam}", captures: { c1: $.data.id } }
            - { call: "POST /course-credits/${c1}/complete", payload: { completed_hours: 120, letter_grade: "A" }, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /course-credits/${c1}/verify", payload: { decision: "APPROVE" }, as: Registrar }
            - { call: "POST /course-credits/${c1}/post", payload: {}, as: Registrar }
            - { call: "GET /students/${stu}/transcript", payload: {}, as: Registrar, captures: { tot_post: $.data.official_credits_total, gpa_post: $.data.gpa_official } }
          trigger:
            - { call: "POST /course-credits/${c1}/revoke", payload: { reason: "hours documentation lost" }, as: Registrar, captures: { cst: $.data.status } }
            - { call: "GET /students/${stu}/transcript", payload: {}, as: Registrar, captures: { tot_rev: $.data.official_credits_total, gpa_rev: $.data.gpa_official } }
          assert:
            - "after post: official_credits_total == 1.0 and gpa_official == 4.0"
            - "CourseCredit.${c1}.status == REVOKED"
            - "after revoke: official_credits_total == 0.0 (identical to the pre-post value; invariant restored)"
            - "after revoke: gpa_official == null (empty POSTED set, no division by zero)"
            - "transcript_sealed == false throughout (revoke was permitted pre-diploma)"
