            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { id_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /documents/${id_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == \"ERR_INVALID_STATE\" (parent Application is SUBMITTED, not IN_VERIFICATION)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.Appointment.fields.start_utc
          - entities.Appointment.fields.end_utc
          - entities.AcceptanceFacility.fields.state_code
        distinguishing_aspect: |
          Facility interval semantics — half-open [start,end) with zero buffer: a new facility appointment
          09:15-09:45 overlapping an existing 09:00-09:30 is rejected ERR_FACILITY_SLOT_CONFLICT, but an
          adjacent 09:30-10:00 (start == prior end) is ALLOWED. Distinct geometry from the buffered counter.
        test_recipe:
          setup:
            - "A facility holds one BOOKED facility appointment 09:00-09:30 (app1); a second submitted application is ready to book."
          setup_api_calls:
            - call: "POST /acceptance-facilities"
              payload: { name: "Downtown", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "First", date_of_birth: "1990-01-01", email: "ff1@x.com" }
              as: Applicant
              captures: { a1_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${a1_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { app1_id: "$.data.id", app1_v0: "$.data.version" }
            - call: "POST /applications/${app1_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${a1_id}"
