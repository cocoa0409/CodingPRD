            - { call: "POST /haul/drivers", payload: { name: "D2", license_no: "CDL-B2" }, as: CarrierAdmin, captures: { d2: $.data.id } }
            - { call: "POST /haul/drivers/${d1}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-02T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${d1}/duty-events", payload: { event_type: "DRIVING_ON", occurred_at: "2026-08-02T00:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${d1}/duty-events", payload: { event_type: "DRIVING_OFF", occurred_at: "2026-08-02T08:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${d2}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-02T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${d2}/duty-events", payload: { event_type: "DRIVING_ON", occurred_at: "2026-08-02T00:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${d2}/duty-events", payload: { event_type: "DRIVING_OFF", occurred_at: "2026-08-02T08:29:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "GET /haul/drivers/${d1}", as: Any }
            - { call: "GET /haul/drivers/${d2}", as: Any }
          assert:
            - "Driver.${d1}.driving_since_break_minutes == 480 and hos_status == BREAK_REQUIRED"
            - "Driver.${d2}.driving_since_break_minutes == 479 and hos_status == ELIGIBLE"

