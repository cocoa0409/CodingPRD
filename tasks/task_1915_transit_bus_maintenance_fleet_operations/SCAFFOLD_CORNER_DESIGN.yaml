      - name: superseded_part_cannot_be_reserved
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_PART_SUPERSEDED]
        distinguishing_aspect: "Self-referential supersession: after POST /fleet/parts/{id}/supersede, the old SKU is rejected at reservation with ERR_PART_SUPERSEDED; the replacement SKU remains reservable."
        test_recipe:
          setup: ["Parts P-old and P-new; IN_PROGRESS CORRECTIVE WO led by m1"]
