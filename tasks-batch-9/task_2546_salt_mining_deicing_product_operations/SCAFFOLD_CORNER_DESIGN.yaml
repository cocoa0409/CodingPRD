# =============================================================================
# task_2546 — Salt Mining & Deicing Product Operations
# §1.9 Scaffold Corner Design (SCAFFOLD_CORNER_DESIGN.yaml)
#
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. The nine guide sections are the `section:` values and the guide's
# per-section table rows are the `claim_type:` values (snake_cased verbatim; no
# invented categories). Every numeric assert below was computed with Python
# Decimal + ROUND_HALF_UP against the §1.3 formulas and their `constants:`.
# Corners already asserted by an instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# appear as `excluded_because:` stubs and carry no test_recipe.
#
# Standing environment facts used by every chain below:
#   * the logical clock reads 2026-08-01T00:00:00Z until POST /_clock/set_current_utc
#     moves it, so no chain needs to set it unless it is time-gated;
#   * Mine "Retsof Salt Mine" (NY) rated 24000 t/day -> effective 24000.00,
#     mine_hourly_capacity 1000.00;
#   * Panel "P-1" (100000 gross, 50 % extraction, grade 96.00, insolubles 2.00,
#     pillar recovery off) -> recoverable_tons 50000.00;
#   * a COARSE HIGHWAY_DEICING batch of 1000 input tons at 0.00 % moisture ->
#     yield_tons 940.00, purity_pct_nacl 96.500.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: mine_create_returns_derated_capacity_and_zeroed_counters
        claim_type: creation
        grounds:
          - endpoints[POST /salt/mines]
          - entities.Mine.fields.effective_hoist_tons_per_day
          - entities.Mine.fields.scheduled_hoist_tons_open
          - entities.Mine.fields.producing_panel_count
          - calculations.mine_effective_hoist_capacity
        distinguishing_aspect: |
          A create with every required field returns 201 and the full entity: both parallel state
          dimensions at their initial values, effective_hoist_tons_per_day already computed as
          24000 * 1.00 * 1.00 = 24000.00, both derived counters at 0 and version == 1.
        test_recipe:
          setup:
            - "Empty database; logical clock at its untouched default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MinePlanner
          trigger:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000, ground_control_plan_version: 2 }
              as: MinePlanner
              captures: { mine_id: "$.data.id", mine_v: "$.data.version" }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "Mine.${mine_id}.hoist_state == HOIST_AVAILABLE"
            - "Mine.${mine_id}.compliance_state == COMPLIANT"
            - "Mine.${mine_id}.effective_hoist_tons_per_day == 24000.00"
            - "Mine.${mine_id}.scheduled_hoist_tons_open == 0"
            - "Mine.${mine_id}.producing_panel_count == 0"
            - "Mine.${mine_id}.ground_control_plan_version == 2"
            - "Mine.${mine_id}.last_compliance_action_at == null"
            - "${mine_v} == 1"

      - name: depot_retrieval_returns_stored_capacities_and_open_posture
        claim_type: retrieval
        grounds:
          - endpoints[GET /salt/depots/{id}]
          - entities.Depot.fields.covered_utilization_pct
          - state_machines.Depot.initial_state
        distinguishing_aspect: |
          GET /salt/depots/{id} echoes exactly the capacities and rates supplied at create, with
          depot_state == OPEN, both stored-tonnage counters at 0 and covered_utilization_pct == 0.
        test_recipe:
          setup:
            - "One depot in NY with 5000 t covered, 5000 t open pad, 500 t/h loadout and 12.500 USD/t freight; nothing stored yet."
          setup_api_calls:
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
          trigger:
            - call: "GET /salt/depots/${depot_a}"
              payload: {}
              as: LogisticsPlanner
          assert:
            - "HTTP 200 and Depot.${depot_a}.name == 'Syracuse Depot'"
            - "Depot.${depot_a}.state_code == NY"
            - "Depot.${depot_a}.covered_capacity_tons == 5000"
            - "Depot.${depot_a}.open_pad_capacity_tons == 5000"
            - "Depot.${depot_a}.loadout_rate_tons_per_hour == 500"
            - "Depot.${depot_a}.outbound_freight_rate_per_ton == 12.500"
            - "Depot.${depot_a}.depot_state == OPEN"
            - "Depot.${depot_a}.covered_stored_tons == 0"
            - "Depot.${depot_a}.open_pad_stored_tons == 0"
            - "Depot.${depot_a}.covered_utilization_pct == 0"

      - name: stockpile_lot_listing_by_treatment_batch_filter_returns_minted_lot
        claim_type: listing
        grounds:
          - endpoints[GET /salt/stockpile-lots]
          - entities.StockpileLot.fields.treatment_batch_id
          - state_machines.TreatmentBatch.PENDING_to_PASSED
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          A QC PASS mints a StockpileLot that has no create endpoint of its own, so the
          treatment_batch_id filtered list is the only discovery path; it returns exactly one row
          with total_count == 1 and has_more == false alongside the paginated envelope fields.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1, a HOISTED 1000 t run, Syracuse Depot and one COARSE HIGHWAY_DEICING batch of 1000 input tons at 0.00 % moisture that has just passed QC (lot 940.00 t COVERED)."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
          trigger:
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id", lot_tons: "$.data[0].tons_on_hand" }
          assert:
            - "HTTP 200 with response_type == array, total_count == 1, has_more == false, limit == 10, offset == 0"
            - "StockpileLot.${lot_id}.treatment_batch_id == ${batch_id}"
            - "${lot_tons} == 940.00"
            - "StockpileLot.${lot_id}.product_line == HIGHWAY_DEICING"
            - "StockpileLot.${lot_id}.purity_pct_nacl == 96.500"
            - "StockpileLot.${lot_id}.storage_kind == COVERED"
            - "StockpileLot.${lot_id}.lot_state == AVAILABLE"

      - name: panel_get_with_unknown_uuid_returns_panel_not_found
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_PANEL_NOT_FOUND]
        distinguishing_aspect: |
          A well-formed UUID that names no Panel returns 404 ERR_PANEL_NOT_FOUND — the Panel-scoped
          existence error, not the generic ERR_INVALID_REQUEST of a malformed request.
        test_recipe:
          setup:
            - "One mine with one panel exists, so the collection is non-empty and the 404 is about the id, not about emptiness."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
          trigger:
            - call: "GET /salt/panels/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: MinePlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err} == ERR_PANEL_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: bid_contract_create_missing_committed_tons_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /salt/bid-contracts]
        distinguishing_aspect: |
          committed_tons has source: input with no default, so omitting it fails the priority-5
          schema gate with 422 ERR_INVALID_REQUEST and no BidContract row is written.
        test_recipe:
          setup:
            - "One SeasonForecast for 2026-27 / NY-CENTRAL exists so the FK in the body resolves and only the missing field can fail."
          setup_api_calls:
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
          trigger:
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and ${err} == ERR_INVALID_REQUEST"
            - "GET /salt/bid-contracts?season_forecast_id=${fc_id} returns total_count == 0"

      - name: optional_inputs_omitted_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Mine.fields.ground_control_plan_version
          - entities.Panel.fields.pillar_recovery_allowed
          - entities.DeliveryOrder.fields.storm_priority
          - calculations.panel_recoverable_tons
        distinguishing_aspect: |
          Omitting the three optional inputs yields ground_control_plan_version == 1 and
          pillar_recovery_allowed == false, and the false default is observable in the reserve:
          recoverable_tons == 50000.00 carries no pillar bonus term.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
          trigger:
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
          assert:
            - "HTTP 201 and Mine.${mine_id}.ground_control_plan_version == 1"
            - "Panel.${panel_id}.pillar_recovery_allowed == false"
            - "Panel.${panel_id}.recoverable_tons == 50000.00"
            - "Panel.${panel_id}.status == PLANNED"
            - "Panel.${panel_id}.mined_tons == 0"
            - "Panel.${panel_id}.ground_control_defect_count == 0"
            - "Panel.${panel_id}.open_defect == false"

      - name: treatment_batch_computed_yield_and_purity_are_server_derived
        claim_type: computed_fields
        grounds:
          - calculations.treatment_yield_and_purity
          - entities.TreatmentBatch.fields.yield_tons
          - entities.TreatmentBatch.fields.purity_pct_nacl
          - entities.Panel.fields.grade_pct_nacl
        distinguishing_aspect: |
          Neither yield_tons nor purity_pct_nacl is an input field: for a MEDIUM CHEMICAL_FEEDSTOCK
          batch of 1000 t at 2.50 % moisture the server derives 1000 * 0.90 * 0.975 = 877.50 t and
          reaches through ProductionRun.panel_id for the grade, giving 96.00 + 1.2 = 97.200.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1 (grade 96.00), a HOISTED 1000 t run and Syracuse Depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
          trigger:
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "CHEMICAL_FEEDSTOCK", screen_spec: "MEDIUM", anticaking_ppm: 10.00, corrosion_inhibitor_pct: 0.00, input_tons: 1000, moisture_pct: 2.50, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
          assert:
            - "HTTP 201 and TreatmentBatch.${batch_id}.yield_tons == 877.50"
            - "TreatmentBatch.${batch_id}.purity_pct_nacl == 97.200"
            - "TreatmentBatch.${batch_id}.qc_state == PENDING"
            - "TreatmentBatch.${batch_id}.rework_count == 0"
            - "TreatmentBatch.${batch_id}.qc_decided_by_user_id == null"
            - "ProductionRun.${run_id}.open_batch_count == 1"

      - name: shipment_create_stamps_system_fields_and_planned_status
        claim_type: system_fields
        grounds:
          - entities.Shipment.fields.status
          - entities.Shipment.fields.required_gap_minutes
          - entities.Shipment.fields.received_lot_id
          - calculations.depot_loadout_bay_conflict
        distinguishing_aspect: |
          id, created_at, updated_at, version == 1 and status == PLANNED are all stamped by the
          server, required_gap_minutes is derived from mode (RAIL -> 45) rather than supplied, and
          received_lot_id is null until receipt.
        test_recipe:
          setup:
            - "A 940.00 t COVERED HIGHWAY_DEICING lot at Syracuse Depot plus a second NY depot (Rochester) to receive movements."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Rochester Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 400, outbound_freight_rate_per_ton: 8.000 }
              as: LogisticsPlanner
              captures: { depot_b: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "RAIL", tons: 400, load_window_start: "2026-08-05T08:00:00Z", load_window_end: "2026-08-05T10:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { ship_id: "$.data.id", ship_v: "$.data.version" }
          assert:
            - "HTTP 201 and Shipment.${ship_id}.status == PLANNED"
            - "Shipment.${ship_id}.required_gap_minutes == 45"
            - "Shipment.${ship_id}.received_lot_id == null"
            - "${ship_v} == 1 and Shipment.${ship_id}.created_at and updated_at are non-null ISO-8601 instants"
            - "StockpileLot.${lot_id}.tons_on_hand == 940.00 (planning a shipment moves no tonnage)"

      - name: treatment_batch_invalid_product_line_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - entities.TreatmentBatch.fields.product_line
        distinguishing_aspect: |
          product_line is a closed four-member enum; the non-member value ICE_MELT fails the
          priority-6 enum gate with 422 ERR_INVALID_REQUEST, before any product-line spec check
          (priority 25/26) could report a screen or dosing problem.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1, a HOISTED 1000 t run and Syracuse Depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
          trigger:
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "ICE_MELT", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and ${err} == ERR_INVALID_REQUEST"
            - "GET /salt/treatment-batches?production_run_id=${run_id} returns total_count == 0"
            - "ProductionRun.${run_id}.open_batch_count == 0"

      - name: ground_control_inspection_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.GroundControlInspection.common_fields
          - endpoints[GET /salt/ground-control-inspections/{id}]
          - entities.GroundControlInspection.fields.caused_suspension
        distinguishing_aspect: |
          GroundControlInspection is declared common_fields: false — the read exposes id and
          created_at but no version and no updated_at, and §1.5 declares no PATCH or DELETE for the
          collection, so an appended record can never be revised.
        test_recipe:
          setup:
            - "Mine with panel P-1 in DEVELOPED state (never PRODUCING), so a PASS inspection cascades nothing."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/ground-control-inspections"
              payload: { panel_id: "${panel_id}", roof_span_ft: 42.0, convergence_rate_in_per_day: 0.004, finding: "PASS" }
              as: GroundControlEngineer
              as_user_id: "gc-eng-1"
              captures: { insp_id: "$.data.id" }
          trigger:
            - call: "GET /salt/ground-control-inspections/${insp_id}"
              payload: {}
              as: GroundControlEngineer
              as_user_id: "gc-eng-1"
          assert:
            - "HTTP 200 and the response data object contains no 'version' key and no 'updated_at' key"
            - "GroundControlInspection.${insp_id}.inspector_user_id == 'gc-eng-1'"
            - "GroundControlInspection.${insp_id}.finding == PASS"
            - "GroundControlInspection.${insp_id}.caused_suspension == false"
            - "Panel.${panel_id}.open_defect == false and Panel.${panel_id}.ground_control_defect_count == 0"
            - "§1.5 declares no PATCH, PUT or DELETE on /salt/ground-control-inspections/{id}"

      - name: panel_create_with_unknown_mine_id_returns_mine_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=9]
          - errors[ERR_MINE_NOT_FOUND]
          - entities.Panel.fields.mine_id
        distinguishing_aspect: |
          Panel declares parent: Mine through the body FK mine_id, so a body FK that resolves to no
          row returns the referenced entity's own 404 (ERR_MINE_NOT_FOUND), never ERR_PANEL_NOT_FOUND.
        test_recipe:
          setup:
            - "One mine exists but the panel body names a different, non-existent mine id."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
          trigger:
            - call: "POST /salt/panels"
              payload: { mine_id: "00000000-0000-4000-8000-0000000000aa", panel_code: "P-9", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err} == ERR_MINE_NOT_FOUND"
            - "GET /salt/panels?mine_id=${mine_id} returns total_count == 0"

      - name: allocation_junction_is_reachable_from_both_parents
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Allocation.fields.delivery_order_id
          - entities.Allocation.fields.stockpile_lot_id
          - endpoints[GET /salt/allocations]
          - concurrency_rules[allocation-create-stale-lot]
        distinguishing_aspect: |
          Allocation is the many-to-many junction between DeliveryOrder and StockpileLot: the same
          row is returned by the delivery_order_id filter and by the stockpile_lot_id filter, and it
          is the only entity whose create requires a version from one parent (the lot) while
          referencing the other by id.
        test_recipe:
          setup:
            - "A 940.00 t COVERED HIGHWAY_DEICING lot at Syracuse Depot, an ACTIVE 1000 t NY contract at 80.00 USD/t and one REQUESTED order for 500 t at that depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id", lot_v: "$.data[0].version" }
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts/${c_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { c_v: "$.data.version" }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 500, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${c_v}" }
              as: LogisticsPlanner
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /salt/allocations"
              payload: { delivery_order_id: "${order_id}", stockpile_lot_id: "${lot_id}", tons: 500, expected_stockpile_lot_version: "${lot_v}" }
              as: LogisticsPlanner
              captures: { alloc_id: "$.data.id" }
            - call: "GET /salt/allocations?delivery_order_id=${order_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { by_order: "$.data[0].id" }
            - call: "GET /salt/allocations?stockpile_lot_id=${lot_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { by_lot: "$.data[0].id" }
          assert:
            - "HTTP 201 and Allocation.${alloc_id}.origin == MANUAL with rank_position == 1 and state == RESERVED"
            - "${by_order} == ${alloc_id} and ${by_lot} == ${alloc_id}"
            - "StockpileLot.${lot_id}.tons_reserved == 500.00 and tons_available == 440.00 and tons_on_hand == 940.00"
            - "DeliveryOrder.${order_id}.allocated_tons == 500.00 and status == ALLOCATED"

  # ===========================================================================
  # 2. From Table 2 (State Machines) — shape `parallel`, plus the branching,
  #    cyclic and compound machines named in complexity_profile, plus every
  #    §1.2 cascade pattern.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: production_run_create_starts_in_scheduled_with_zero_hoisted
        claim_type: initial_state
        grounds:
          - state_machines.ProductionRun.initial_state
          - entities.ProductionRun.fields.status
          - entities.ProductionRun.fields.planned_tons_per_hour
          - endpoints[POST /salt/production-runs]
        distinguishing_aspect: |
          A freshly created run is SCHEDULED with held_reason null, hoisted_tons 0 and
          open_batch_count 0, and planned_tons_per_hour is derived to 4 decimals from the window
          (1000 t over 24 h = 41.6667), while the mine's open commitment rises to 1000.
        test_recipe:
          setup:
            - "Mine rated 24000 t/day (hourly capacity 1000.00) with panel P-1 in PRODUCING and no other runs."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
          trigger:
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
          assert:
            - "HTTP 201 and ProductionRun.${run_id}.status == SCHEDULED"
            - "ProductionRun.${run_id}.held_reason == null"
            - "ProductionRun.${run_id}.hoisted_tons == 0"
            - "ProductionRun.${run_id}.open_batch_count == 0"
            - "ProductionRun.${run_id}.planned_tons_per_hour == 41.6667"
            - "Mine.${mine_id}.scheduled_hoist_tons_open == 1000"
            - "Panel.${panel_id}.mined_tons == 0 and Panel.${panel_id}.status == PRODUCING"

      - name: bid_contract_submit_moves_draft_to_submitted_and_stamps_submitter
        claim_type: valid_transition
        grounds:
          - state_machines.BidContract.DRAFT_to_SUBMITTED
          - entities.BidContract.fields.submitted_by_user_id
          - endpoints[POST /salt/bid-contracts/{id}/submit]
        distinguishing_aspect: |
          The submit trigger moves DRAFT -> SUBMITTED, stamps submitted_by_user_id with the calling
          X-User-ID (the SoD anchor for the later decision) and bumps version to 2, while the
          fulfillment ledger stays empty.
        test_recipe:
          setup:
            - "One SeasonForecast and one DRAFT contract for 1000 committed tons at 80.00 USD/t."
          setup_api_calls:
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_v: "$.data.version" }
          assert:
            - "HTTP 200 and BidContract.${c_id}.status == SUBMITTED"
            - "BidContract.${c_id}.submitted_by_user_id == 'ca-submitter'"
            - "${c_v} == 2"
            - "BidContract.${c_id}.fulfilled_tons == 0, take_pct == 0, penalty_accrued_usd == 0 and supply_reliability_score == 100"
            - "BidContract.${c_id}.contract_value_usd == 80000.00 and open_committed_tons == 1000"

      - name: bid_contract_decision_forks_to_awarded_or_lost
        claim_type: branching
        grounds:
          - state_machines.BidContract.SUBMITTED_to_AWARDED
          - state_machines.BidContract.SUBMITTED_to_LOST
          - endpoints[POST /salt/bid-contracts/{id}/decision]
        distinguishing_aspect: |
          Both fork legs of the same trigger are exercised from the same SUBMITTED state: outcome
          AWARD lands on AWARDED (a live leg that can still be activated) while outcome LOSE lands
          on the terminal LOST, and neither leg touches the other contract.
        test_recipe:
          setup:
            - "Two SUBMITTED contracts on the same forecast, one per fork leg."
          setup_api_calls:
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_win: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "Onondaga County DOT", jurisdiction_level: "STATE", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 2000, guaranteed_price_per_ton: 78.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_lose: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_win}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_lose}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
          trigger:
            - call: "POST /salt/bid-contracts/${c_win}/decision"
              payload: { outcome: "AWARD", note: "low bid" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts/${c_lose}/decision"
              payload: { outcome: "LOSE", note: "not selected" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
          assert:
            - "both calls HTTP 200"
            - "BidContract.${c_win}.status == AWARDED"
            - "BidContract.${c_lose}.status == LOST"
            - "GET /salt/bid-contracts?status=AWARDED returns total_count == 1 with data[0].id == ${c_win}"
            - "GET /salt/bid-contracts?status=LOST returns total_count == 1 with data[0].id == ${c_lose}"

      - name: close_on_scheduled_run_returns_run_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionRun.HOISTED_to_CLOSED
          - validations[priority=14]
          - errors[ERR_RUN_INVALID_STATE]
        distinguishing_aspect: |
          CLOSED is reachable only from HOISTED, so firing the close trigger on a SCHEDULED run —
          a trigger that is not in that state's transition list — returns 409 ERR_RUN_INVALID_STATE
          and leaves the run SCHEDULED with the mine's open commitment intact.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1 and one SCHEDULED 1000 t run that has never been hoisted."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "POST /salt/production-runs/${run_id}/close"
              payload: {}
              as: MinePlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err} == ERR_RUN_INVALID_STATE"
            - "ProductionRun.${run_id}.status == SCHEDULED and hoisted_tons == 0"
            - "Mine.${mine_id}.scheduled_hoist_tons_open == 1000"

      - name: resubmitting_a_submitted_bid_contract_returns_contract_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.BidContract.DRAFT_to_SUBMITTED
          - validations[priority=11]
          - errors[ERR_CONTRACT_INVALID_STATE]
        distinguishing_aspect: |
          The submit trigger is not idempotent: the second call from SUBMITTED returns 409
          ERR_CONTRACT_INVALID_STATE rather than a second 200, and it must not re-stamp
          submitted_by_user_id with the second caller's id or bump version again.
        test_recipe:
          setup:
            - "One contract already submitted once by user ca-submitter (version 2)."
          setup_api_calls:
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { v_after_first: "$.data.version" }
          trigger:
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-other"
              captures: { err: "$.data.error_id" }
          assert:
            - "second call HTTP 409 and ${err} == ERR_CONTRACT_INVALID_STATE"
            - "${v_after_first} == 2 and BidContract.${c_id}.version == 2"
            - "BidContract.${c_id}.submitted_by_user_id == 'ca-submitter' (not 'ca-other')"
            - "BidContract.${c_id}.status == SUBMITTED"

      - name: start_production_while_mine_under_withdrawal_order_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=22]
          - errors[ERR_MINE_WITHDRAWAL_ORDER_ACTIVE]
          - state_machines.Mine.compliance_state.COMPLIANT_to_WITHDRAWAL_ORDER
          - state_machines.Panel.SUSPENDED_to_PRODUCING
        distinguishing_aspect: |
          The DEVELOPED -> PRODUCING trigger carries a cross-entity precondition on the parent
          mine's second state dimension: under an MSHA withdrawal order the call is refused with
          409 ERR_MINE_WITHDRAWAL_ORDER_ACTIVE, and after CLEAR the identical call succeeds — the
          panel was never the problem.
        test_recipe:
          setup:
            - "Mine with panel P-1 in DEVELOPED; the mine is then put under a withdrawal order (compliance_factor 0.00, effective capacity 0.00)."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "WITHDRAW", note: "imminent danger order" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
              captures: { err: "$.data.error_id" }
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "CLEAR", note: "order terminated" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
          assert:
            - "first start-production HTTP 409 with ${err} == ERR_MINE_WITHDRAWAL_ORDER_ACTIVE"
            - "immediately after the refusal Panel.${panel_id}.status == DEVELOPED and Mine.${mine_id}.producing_panel_count == 0"
            - "Mine.${mine_id}.effective_hoist_tons_per_day == 0.00 while under the order"
            - "after CLEAR, Mine.${mine_id}.compliance_state == COMPLIANT and effective_hoist_tons_per_day == 24000.00"
            - "the retried start-production returns HTTP 200 with Panel.${panel_id}.status == PRODUCING and Mine.${mine_id}.producing_panel_count == 1"

