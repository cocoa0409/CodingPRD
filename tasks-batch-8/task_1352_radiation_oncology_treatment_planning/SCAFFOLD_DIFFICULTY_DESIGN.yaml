  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: weight_loss_exactly_10pct_triggers_adaptation
        grounds:
          - calculations.adaptation_weight_loss_trigger
          - entities.TreatmentCourse.fields.baseline_weight_kg
        distinguishing_aspect: |
          Metric: weight-loss percentage; endpoint: POST adaptation-checks. The comparison is >= 10.0
          at full float precision: a 9.0% loss (72.8 kg from an 80.0 kg baseline) leaves the course
          ON_TREATMENT while an exact 10.0% loss (72.0 kg) flips it to ADAPTATION_REQUIRED.
        test_recipe:
          setup:
            - "IMRT course 2000/10 ON_TREATMENT: plan approved, 2 fractions delivered, baseline_weight_kg 80.0"
          setup_api_calls:
