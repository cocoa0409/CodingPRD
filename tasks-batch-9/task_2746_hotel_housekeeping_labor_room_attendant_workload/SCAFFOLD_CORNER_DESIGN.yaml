      - name: sm_enrollment_accrual_syncs_points_into_the_property_ledger
        claim_type: ledger sync
        grounds:
          - state_machines.ServiceEnrollment[ACTIVE->COMPLETED]
          - entities.Property.fields.outstanding_incentive_points
          - entities.ServiceEnrollment.fields.points_per_skip
        distinguishing_aspect: "Each accrual re-derives ServiceEnrollment.points_accrued and pushes it into Property.outstanding_incentive_points, and the second accrual on a 2-night OPT_OUT enrollment also closes the enrollment at 1000 points."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING room type and room 102 in STAYOVER; outstanding_incentive_points starts at 0."
            - "An OPT_OUT enrollment for reservation RES-77 over 2 nights (points_per_skip 500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id, points0: $.data.outstanding_incentive_points }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "102", floor: 1, occupancy_state: "STAYOVER" }
              as: HousekeepingDirector
              captures: { room102_id: $.data.id }
            - call: "POST /housekeeping/service-enrollments"
              payload: { room_id: "${room102_id}", reservation_code: "RES-77", program: "OPT_OUT", nights: 2 }
              as: FrontDeskAgent
              captures: { enr_id: $.data.id, pps: $.data.points_per_skip }
            - call: "POST /housekeeping/service-enrollments/${enr_id}/accrue"
              payload: {}
              as: FrontDeskAgent
