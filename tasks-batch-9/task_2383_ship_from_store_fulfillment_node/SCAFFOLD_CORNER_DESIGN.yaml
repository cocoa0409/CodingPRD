  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_order_version_blocks_a_commit_run_that_would_supersede_unseen_lines
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.routing-run-create-stale-order
          - errors.ERR_STALE_ORDER_VERSION
          - validations.priority 7
        distinguishing_aspect: "The order's version advances because CustomerCare added a second line, not because anyone touched the order header - so a planner holding the pre-line version is refused at 412 even though the routing payload is otherwise identical to the one that succeeds a moment later, and the refused run creates no RoutingRun row at all."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z. Node S1 stocks SKU-A 12/2 and SKU-B 6/1. Order O1 is created (version 1), gets an A x 2 line (version 2), the planner reads version 2, and only then a B x 1 line is added (version 3)."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-B", unit_weight_grams: 250, unit_price_cents: 1900, package_class: "SMALL", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_b: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_b}", on_hand_units: 6, safety_stock_units: 1 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-N001", customer_ref: "C-1000", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v_stale: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_b}", quantity: 1, unit_price_cents: 1900 }
              as: CustomerCare
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v_stale}" }
              as: NetworkPlanner
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v_fresh: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v_fresh}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
          assert:
            - "${o1_v_stale} == 2 and ${o1_v_fresh} == 3: creating the order minted version 1 and each line append incremented it by exactly 1"
            - "${e_stale} == ERR_STALE_ORDER_VERSION with HTTP 412 for the first COMMIT"
            - "the refused run leaves no trace: GET /routing-runs?order_id=${o1} is empty at that point, no FulfillmentAssignment exists, CustomerOrder.${o1}.routing_status is still UNROUTED and version is still 3"
            - "the retry with the fresh version returns HTTP 201 with RoutingRun.${run1}.status == COMMITTED and selected_store_count 1"
            - "the committed assignment covers both lines: FulfillmentAssignment.${a1}.assigned_units == 3 with two AssignmentLine rows, and its provisional_cost_cents == 1822 (21 reserved minutes * 42 = 882 labour, MEDIUM_BOX 130 + 45 dunnage = 175 packaging, and per-line freight 420 for the 1600 g A line plus 345 for the 250 g B line = 765)"
            - "the successful COMMIT itself advances the guarded parent: CustomerOrder.${o1}.version == 4, so an immediate replay of the same payload would now be stale in its turn"

      - name: stale_expected_pickup_version_blocks_the_second_parcel_tender
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.pickup-slot-claim-stale-pickup
          - errors.ERR_STALE_PICKUP_VERSION
          - validations.priority 7
        distinguishing_aspect: "Two packed assignments at the same node contend for the same pickup window: the first tender bumps the pickup's version as it claims a slot, so the second tender - holding the version it read before either ship - is refused at 412 even though the window still has four free slots, which is the only way to tell slot-count staleness apart from capacity exhaustion."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z and never advanced. Node S1 with SKU-A 12/2 and a MEDIUM_BOX supply of 4, a pickup window 08:30Z-10:00Z with parcel_capacity 5 whose version 1 is read up front, and two orders each committed to S1 and carried to PACKED."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/packaging-supplies"
              payload: { store_id: "${s1}", package_type: "MEDIUM_BOX", on_hand_units: 4, reorder_point_units: 1 }
              as: NetworkPlanner
              captures: { pk_m: "$.data.id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "UPS", window_start_utc: "2026-08-03T08:30:00Z", window_end_utc: "2026-08-03T10:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { p1: "$.data.id", p1_v_stale: "$.data.version" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-O001", customer_ref: "C-1010", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-O002", customer_ref: "C-1011", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o2: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o2}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o2}"
              payload: {}
              as: NetworkPlanner
              captures: { o2_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o2}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o2_v}" }
              as: NetworkPlanner
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o2}" }
              as: NetworkPlanner
              captures: { a2: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a2}" }
              as: NetworkPlanner
              captures: { al2: "$.data[0].id" }
            - call: "POST /fulfillment-network/assignments/${a1}/accept"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/pick"
              payload: { picked_units: 2, line_picks: [{ assignment_line_id: "${al1}", units_picked: 2 }] }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a1}/pack"
              payload: { package_type: "MEDIUM_BOX" }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a2}/accept"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
