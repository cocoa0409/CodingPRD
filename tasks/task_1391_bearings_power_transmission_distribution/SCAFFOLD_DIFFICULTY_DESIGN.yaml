  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reservation_expiry_cascades_line_and_order_revert
        grounds:
          - state_machines.StockReservation.ACTIVE_to_EXPIRED
          - state_machines.OrderLine.STOCK_RESERVED_to_PENDING_SOURCING
          - state_machines.SalesOrder.FULLY_SOURCED_to_CONFIRMED
          - calculations.available_stock
        distinguishing_aspect: |
          Depth-3 cascade from a clock trigger: reservation ACTIVE -> EXPIRED
          (hop 1) causes its order line STOCK_RESERVED -> PENDING_SOURCING
          (hop 2), which itself causes the order FULLY_SOURCED -> CONFIRMED
          (hop 3) and the stock reserved_qty recompute. Trigger: logical-clock
          advance past expires_at (created_at + 72h).
        test_recipe:
          setup:
            - "Product; branch; customer; stock on_hand 8"
            - "Order confirmed with line qty 3, reserved at 2026-08-01T10:00:00Z (reservation expires 2026-08-04T10:00:00Z); order is FULLY_SOURCED, reserved_qty == 3"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "CHN-40", description: "Roller chain 40", family: "CHAIN", list_price_cents: 5000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "HOU-07", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Gulf Coast Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 8, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 3 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 3 }
              as: CounterSalesRep
              captures: { r_id: $.data.id, r_exp: $.data.expires_at }
          trigger:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: SystemAdmin
          assert:
            - "StockReservation.${r_id}.status == EXPIRED (clock 2026-08-05T10:00 > expires_at 2026-08-04T10:00)"
            - "OrderLine.${l_id}.sourcing_status == PENDING_SOURCING (hop 2 reversion)"
            - "SalesOrder.${o_id}.fulfillment_status == CONFIRMED (hop 3: FULLY_SOURCED bubble collapsed)"
            - "BranchStock.${bs_id}.reserved_qty == 0 and available_qty == 8 (stock released)"
            - "StockReservation.${r_id}.expires_at == 2026-08-04T10:00:00Z (created_at + 72h)"

      - name: callout_fulfill_preemption_cascade
        grounds:
          - state_machines.CallOut.DISPATCHED_to_FULFILLED
          - state_machines.StockReservation.ACTIVE_to_PREEMPTED
          - state_machines.OrderLine.STOCK_RESERVED_to_PENDING_SOURCING
          - calculations.call_out_fee
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger than the clock instance: a
          call-out FULFILL (hop 0) with available_qty short seizes the newest
          ACTIVE reservation -> PREEMPTED (hop 1), which reverts its order line
          to PENDING_SOURCING (hop 2), which collapses the order FULLY_SOURCED
          -> CONFIRMED (hop 3). Also computes weekend-free after-hours fee and
          contract-lag parts pricing in the same transition.
        test_recipe:
          setup:
            - "Product list 10000; branch (open 8, close 17, after_hours_fee 20000); customers A (order owner) and B (emergency caller)"
            - "Stock on_hand 5; customer A order line qty 5 confirmed + reserved (FULLY_SOURCED, available 0, on_hand 5)"
            - "Customer B call-out qty 3 created and dispatched at 2026-08-03T18:00:00Z local (after close; Monday so no weekend multiplier)"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-22220", description: "Spherical roller bearing", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "PHX-08", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Desert Plant A", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Desert Plant B", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 5, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/orders"
              payload: { customer_id: "${ca_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 5 }
              as: CounterSalesRep
              captures: { l_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l_id}/reserve"
              payload: { branch_stock_id: "${bs_id}", qty: 5 }
              as: CounterSalesRep
              captures: { r_id: $.data.id }
            - call: "POST /motion/call-outs"
              payload: { branch_id: "${b_id}", customer_id: "${cb_id}", product_id: "${p_id}", qty: 3 }
              as: CustomerPlant
              as_user_id: "${cb_id}"
              captures: { co_id: $.data.id }
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T18:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/call-outs/${co_id}/dispatch"
              payload: {}
              as: OnCallTechnician
              as_user_id: "tech-7"
          trigger:
            - call: "POST /motion/call-outs/${co_id}/fulfill"
              payload: {}
              as: OnCallTechnician
              as_user_id: "tech-7"
          assert:
            - "CallOut.${co_id}.status == FULFILLED"
            - "CallOut.${co_id}.call_out_fee_cents == 20750 (base 20000 weekday + 3 * 250)"
            - "CallOut.${co_id}.parts_amount_cents == 30000 (3 * 10000, no contract)"
            - "CallOut.${co_id}.total_charge_cents == 50750"
            - "CallOut.${co_id}.preempted_reservation_ids == [${r_id}]"
            - "StockReservation.${r_id}.status == PREEMPTED (hop 1)"
            - "OrderLine.${l_id}.sourcing_status == PENDING_SOURCING (hop 2)"
            - "SalesOrder.${o_id}.fulfillment_status == CONFIRMED (hop 3)"
            - "BranchStock.${bs_id}.on_hand_qty == 2 and reserved_qty == 0"
            - "CustomerAccount.${cb_id}.open_receivables_cents == 50750"

