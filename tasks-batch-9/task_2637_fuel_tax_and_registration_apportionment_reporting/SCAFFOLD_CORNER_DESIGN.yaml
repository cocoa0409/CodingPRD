              as_user_id: "officer-1"
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-102", vin: "1FUJA6CK21L101102", weight_group_code: "W80", factory_price_amount: 152000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v2_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-103", vin: "1FUJA6CK21L101103", weight_group_code: "W80", factory_price_amount: 149000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v3_id: $.data.id }
            - call: "GET /apportionment/registration-applications/${app1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { app1_v_snapshot: $.data.version }
            - call: "POST /apportionment/fleet-change-requests"
              payload: { registration_application_id: "${app1_id}", vehicle_id: "${v2_id}", change_type: "ADDITION", effective_date: "2026-07-15", expected_registration_application_version: "${app1_v_snapshot}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { fcr1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/fleet-change-requests"
              payload: { registration_application_id: "${app1_id}", vehicle_id: "${v3_id}", change_type: "ADDITION", effective_date: "2026-08-15", expected_registration_application_version: "${app1_v_snapshot}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /apportionment/registration-applications/${app1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { app1_v_fresh: $.data.version }
            - call: "POST /apportionment/fleet-change-requests"
              payload: { registration_application_id: "${app1_id}", vehicle_id: "${v3_id}", change_type: "ADDITION", effective_date: "2026-08-15", expected_registration_application_version: "${app1_v_fresh}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { fcr2_id: $.data.id }
          assert:
            - "The first supplement was created while the application was still at ${app1_v_snapshot} and left the application at ${app1_v_fresh} == ${app1_v_snapshot} + 1"
            - "Stale retry: HTTP 412 and body.data.error_id == 'ERR_STALE_APPLICATION_VERSION'"
            - "The 412 created nothing: GET /apportionment/fleet-change-requests?registration_application_id=${app1_id} returns total_count == 1 at that point"
            - "Fresh retry: HTTP 201; FleetChangeRequest.${fcr2_id}.change_status == REQUESTED with vehicle_id ${v3_id}"
            - "Both supplements coexist as REQUESTED with fee_delta 0.00 and prorate_months 0 until they are decided"
            - "RegistrationApplication.${app1_id}.total_apportioned_fee == 2350.80 and apportioned_vehicle_count == 1 — creating supplements prices nothing"

      - name: a_second_sequential_prepare_with_a_stale_carrier_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[return-prepare-stale-carrier]
          - errors[ERR_STALE_CARRIER_VERSION]
          - state_machines.FuelTaxReturn.transitions.PREPARED_to_PREPARED
        distinguishing_aspect: "PREPARED -> PREPARED is a legal transition, so the second prepare fails for no reason other than concurrency: the first prepare bumped Carrier.version while writing latest_prepared_fleet_mpg, so replaying the original token returns ERR_STALE_CARRIER_VERSION 412 and leaves the first settlement's ACTIVE line set untouched."
        test_recipe:
          setup:
            - "ACCEPTED trip legs IL 300.0 + IN 100.0 (odometer 1000.0 -> 1400.0), one ACCEPTED IL purchase of 40.000 gallons, a DRAFT 2026 Q2 return, and the carrier version captured once up front."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1400.0, legs: [ { jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "IN", leg_miles: 100.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${t1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "IL", purchase_date: "2026-05-02", gallons: 40.000, tax_paid_flag: true, receipt_reference: "RCPT-IL-4471" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret1_id: $.data.id }
            - call: "GET /apportionment/carriers/${c1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { c1_v_snapshot: $.data.version }
            - call: "POST /apportionment/fuel-tax-returns/${ret1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v_snapshot}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
          trigger:
            - call: "POST /apportionment/fuel-tax-returns/${ret1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v_snapshot}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /apportionment/carriers/${c1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { c1_v_fresh: $.data.version }
            - call: "POST /apportionment/fuel-tax-returns/${ret1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v_fresh}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
          assert:
            - "Stale re-prepare: HTTP 412 and body.data.error_id == 'ERR_STALE_CARRIER_VERSION'"
            - "${c1_v_fresh} == ${c1_v_snapshot} + 1 — the first prepare consumed the token by writing latest_prepared_fleet_mpg 10.00"
            - "After the 412 the return is still PREPARED with total_net_tax_due 2.53 and GET .../jurisdiction-lines?line_status=ACTIVE returns total_count == 2"
            - "GET .../jurisdiction-lines with no filter returns total_count == 2 after the 412 — the rejected call voided nothing"
            - "Fresh re-prepare: HTTP 200 with the same totals (total_net_tax_due 2.53) and 2 ACTIVE plus 2 VOIDED lines"

      - name: both_settlement_variants_on_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.quarterly_fuel_tax_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / preparer_versus_audit_basis_quarterly_settlement_divergence
          rationale: "Both PREPARER_BASIS and AUDIT_BASIS results and the delta between them are computed and asserted in that §1.8 instance."

      - name: the_deletion_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / deletion_approval_cascades_through_vehicle_and_credentials
          rationale: "The multi-level cascade with ordering sensitivity is that §1.8 instance; the §1.9 endpoints and errors sections cover the single-level cases only."

      - name: the_correction_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / return_for_correction_cascades_through_trips_carrier_and_audit_selection
          rationale: "The four-hop return-for-correction chain (lines, trips, carrier, audit selection) is asserted hop by hop there."

      - name: the_audit_and_penalty_thresholds_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.audit_risk_score.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / reconstructed_mileage_ratio_exactly_ten_percent_attracts_no_penalty
          rationale: "The threshold-boundary layer is covered by the §1.8 inclusive/exclusive instances (penalty ratio at 0.1000, gap tolerance at 5.0, risk score at the inclusive 70/90 marks)."

  # =====================================================================
  # SECTION 9 — CONSISTENCY MODEL
  # =====================================================================
  - section: consistency_model
    instances:

      - name: cascade_results_are_visible_in_the_triggering_response_without_a_re_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /apportionment/registration-applications/{id}/review]
          - state_machines.Vehicle.state_dimensions.vehicle_status.transitions.PENDING_to_ACTIVE
        distinguishing_aspect: "The consistency model is immediate, so the INVOICE response body itself already carries apportioned_vehicle_count 2, fleet_total_distance_miles 100000.0 and base_fee_total 4701.60, and the vehicles are already ACTIVE when read straight afterwards — nothing lags behind a second request."
        test_recipe:
          setup:
            - "Two 2026 units created before invoicing; a submitted 2026 application with IL 60000.0 and IN 40000.0 lines against W80 fees IL 2790.00 / IN 1692.00."
          setup_api_calls:
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IL", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 2790.00 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/weight-group-fees"
              payload: { jurisdiction_code: "IN", weight_group_code: "W80", declared_weight_lbs: 80000, annual_fee_amount: 1692.00 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Prairie Freight LLC", usdot_number: "USDOT-2637001", base_jurisdiction_code: "IL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { c1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-101", vin: "1FUJA6CK21L101101", weight_group_code: "W80", factory_price_amount: 145000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c1_id}", unit_number: "U-102", vin: "1FUJA6CK21L101102", weight_group_code: "W80", factory_price_amount: 152000.00, registration_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v2_id: $.data.id }
            - call: "POST /apportionment/registration-applications"
              payload: { carrier_id: "${c1_id}", registration_year: 2026, weight_group_code: "W80", distance_basis: "ACTUAL_DISTANCE_BASIS" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { app1_id: $.data.id }
            - call: "POST /apportionment/registration-applications/${app1_id}/distance-schedule"
              payload: { jurisdiction_code: "IL", reported_distance_miles: 60000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { dsl_il_id: $.data.id }
            - call: "POST /apportionment/registration-applications/${app1_id}/distance-schedule"
              payload: { jurisdiction_code: "IN", reported_distance_miles: 40000.0 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { dsl_in_id: $.data.id }
            - call: "POST /apportionment/registration-applications/${app1_id}/submit"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
          trigger:
            - call: "POST /apportionment/registration-applications/${app1_id}/review"
              payload: { decision: "INVOICE" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /apportionment/vehicles?carrier_id=${c1_id}&vehicle_status=ACTIVE"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "The INVOICE response body already shows application_status INVOICED, apportioned_vehicle_count 2, fleet_total_distance_miles 100000.0, base_fee_total 4701.60 and total_apportioned_fee 4701.60"
            - "The immediately following vehicle list returns total_count == 2 with both units ACTIVE and activated_on_date 2026-08-01"
            - "DistanceScheduleLine.${dsl_il_id}.apportion_percent == 0.600000 and jurisdiction_fee_amount == 3348.00"
            - "DistanceScheduleLine.${dsl_in_id}.apportion_percent == 0.400000 and jurisdiction_fee_amount == 1353.60"
            - "No second read is needed for any of the above — a re-read returns byte-identical values"
