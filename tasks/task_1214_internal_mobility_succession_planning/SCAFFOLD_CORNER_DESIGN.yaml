            - { call: "PATCH /talent/successors/${eb}", payload: { status: "SUSPENDED", suspension_reason: "PERFORMANCE_CONCERN" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v3: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sa}", readiness_rating: "READY_1_2", slate_position: 2, expected_critical_role_version: "${r_v3}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ea: $.data.id } }
