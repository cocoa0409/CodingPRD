  # ===========================================================================
  # RULE 6 — Boundary and precision checks: inclusive weight bound, empty
  #          collection, inclusive money tier ceiling
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sailing_capacity_accepts_booking_that_lands_exactly_on_capacity_and_flips_to_full
        grounds:
          - calculations.sailing_capacity_ledger
          - validations[priority=31]
          - entities.VesselSailing.fields.booked_weight_kg
          - entities.VesselSailing.fields.status
        distinguishing_aspect: |
          Inclusive weight boundary in kg at 3 decimal places: 600.000 already booked plus a
          requested 400.000 equals capacity_weight_kg exactly 1000.000, and because the gate
          rejects only strict excess the booking must be ACCEPTED while the sailing flips to
          FULL (status uses >=); an implementation using >= on the gate would return
          ERR_SAILING_CAPACITY_EXCEEDED at the equality point.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted) owning two orders."
            - "VesselSailing S2 with capacity_weight_kg exactly 1000.000, cutoff_at 2026-08-15, etd 2026-08-17; the clock stays at 2026-08-01 so priority 23 passes and the sailing stays OPEN."
            - "Order B: FOB / ZONE_1, one line 60.000 @ 100.0000 gross 600.000, screened NLR, booked LCL 600.000 kg -> sailing booked_weight_kg 600.000, still OPEN (600.000 < 1000.000)."
            - "Order A: FOB / ZONE_1, one line 40.000 @ 100.0000 gross 400.000, screened NLR so it is COMPLIANCE_CLEARED and priority 12 passes."
            - "The sailing version is re-read after order B's booking so the trigger carries a fresh expected_vessel_sailing_version."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Toyama Tool Import", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Han River", voyage_no: "H1101", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 1000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v1: "$.data.version" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_b_id: "$.data.id" }
            - call: "POST /export-orders/${order_b_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Hand tool sets", hs_code: "820600", quantity: 60.000, uom: "SET", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 550.000, gross_weight_kg: 600.000, package_count: 6 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_b_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_b_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_b_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_b_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_b_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 600.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v1}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_b_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_a_id: "$.data.id" }
            - call: "POST /export-orders/${order_a_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Torque wrenches", hs_code: "820420", quantity: 40.000, uom: "EA", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 360.000, gross_weight_kg: 400.000, package_count: 4 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_a_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_a_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_a_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_a_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "GET /vessel-sailings/${sailing_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_v2: "$.data.version" }
          trigger:
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_a_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 400.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v2}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_a_id: "$.data.id" }
          assert:
            - "HTTP status is 201 (the equality point is accepted)"
            - "FreightBooking.${booking_a_id}.status == BOOKED and FreightBooking.${booking_a_id}.booked_weight_kg == 400.000"
            - "VesselSailing.${sailing_id}.booked_weight_kg == 1000.000"
            - "VesselSailing.${sailing_id}.status == FULL (booked_weight_kg >= capacity_weight_kg uses >=)"
            - "ExportOrder.${order_a_id}.fulfillment_status == BOOKED"
            - "FreightBooking.${booking_b_id}.status == BOOKED and FreightBooking.${booking_b_id}.booked_weight_kg == 600.000"

      - name: compliance_submission_rejected_on_empty_shipment_line_collection
        grounds:
          - validations[priority=30]
          - state_machines.ExportOrder.DRAFT_to_COMPLIANCE_PENDING
          - entities.ShipmentLine.fields.line_no
        distinguishing_aspect: |
          Empty-collection boundary at n = 0 rather than a numeric bound: an ExportOrder with
          zero ShipmentLine rows must fail POST /export-orders/{id}/submit-for-compliance with
          ERR_NO_SHIPMENT_LINES and HTTP 422, leaving the order in DRAFT with no
          ExportControlScreening created, whereas the identical call with a single line
          succeeds; the n = 0 case must not be silently treated as a zero-value order.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted)."
            - "One ExportOrder in DRAFT with ordered_goods_value_usd 0 and NO ShipmentLine rows at all."
            - "The clock stays at 2026-08-01; the buyer is not restricted, so priorities 14 and 15 both pass and priority 30 is the only violated rule."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Okayama Ceramics Import", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_NO_SHIPMENT_LINES"
            - "ExportOrder.${order_id}.fulfillment_status == DRAFT (no transition to COMPLIANCE_PENDING)"
            - "ExportOrder.${order_id}.ordered_goods_value_usd == 0.00"
            - "no ExportControlScreening row exists with export_order_id ${order_id}"
            - "ForeignBuyer.${buyer_id}.open_order_count == 1 (unchanged by the rejection)"

      - name: insurance_tier_ceiling_is_inclusive_at_exactly_250000_usd
        grounds:
          - calculations.insurance_premium_assessment
          - entities.CreditInsurancePolicy.fields.exposure_tier
          - entities.CreditInsurancePolicy.fields.premium_usd
        distinguishing_aspect: |
          Inclusive money boundary at 2 decimal places: with exposure_before 0.00 the tier
          basis is exactly TIER_1_CEILING_USD 250000.00, and because the ceiling comparison is
          <= the policy must be TIER_1 with premium_usd 1530.00 and a waived fee; an exclusive
          ceiling would produce TIER_2 with base 2070.00 plus a 250.00 fee = 2320.00.
        test_recipe:
          setup:
            - "ForeignBuyer 'Yokohama Aerospace Import' with credit_rating AAA (RATING_MULTIPLIER 0.80), sanctions_tier NONE, restricted_party_flag false."
            - "The buyer has NO existing CreditInsurancePolicy, so exposure_before is exactly 0.00 and aggregate_exposure_usd is 0.00 at the moment of the request."
            - "The requested policy has credit_limit_usd exactly 250000.00, insured_pct 90.00 and deductible_usd 5000.00, which equals DEDUCTIBLE_FEE_WAIVER_USD so the fee waiver applies if and only if the tier resolves to TIER_1."
            - "The clock stays at 2026-08-01, inside the requested effective window."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Yokohama Aerospace Import", country_code: "JP", credit_rating: "AAA", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "POST /credit-insurance-policies"
              payload: { buyer_id: "${buyer_id}", policy_number: "POL-E-2195", credit_limit_usd: 250000.00, insured_pct: 90.00, deductible_usd: 5000.00, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: FinanceCollectionsOfficer
              as_user_id: "fin_1"
              captures: { policy_id: "$.data.id" }
          assert:
            - "HTTP status is 201"
            - "CreditInsurancePolicy.${policy_id}.exposure_tier == TIER_1 (tier_basis 250000.00 <= TIER_1_CEILING_USD)"
            - "CreditInsurancePolicy.${policy_id}.premium_usd == 1530.00 (base 1530.00 + policy_fee 0.00, not 2320.00)"
            - "CreditInsurancePolicy.${policy_id}.utilized_usd == 0.00 and CreditInsurancePolicy.${policy_id}.available_limit_usd == 250000.00"
            - "CreditInsurancePolicy.${policy_id}.status == ACTIVE and CreditInsurancePolicy.${policy_id}.indemnified_total_usd == 0.00"
            - "ForeignBuyer.${buyer_id}.aggregate_exposure_usd == 0.00 (a new policy contributes utilized_usd 0.00)"

  # ===========================================================================
  # RULE 7 — Cross-entity state dependency: a sibling entity's swept status and
  #          a two-hop buyer flag both gate an otherwise valid write
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: booking_blocked_by_swept_sailing_status_not_by_the_cutoff_rule
        grounds:
          - validations[priority=12]
          - validations[priority=23]
          - calculations.sailing_capacity_ledger
          - entities.VesselSailing.fields.status
          - entities.VesselSailing.fields.cutoff_at
        distinguishing_aspect: |
          The order itself is perfectly bookable (COMPLIANCE_CLEARED, screening CLEARED, fresh
          expected_vessel_sailing_version) and only a DIFFERENT entity has moved: the clock
          sweep pushed the VesselSailing OPEN -> CUTOFF_PASSED at current_utc == cutoff_at.
          POST /freight-bookings must return ERR_SAILING_NOT_OPEN with HTTP 409 from priority
          12, not ERR_SAILING_CUTOFF_PASSED from priority 23 and not ERR_STALE_SAILING_VERSION
          from priority 13, so the cross-entity status check outranks the temporal cutoff check
          that describes the very same clock fact.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted)."
            - "ExportOrder FOB / ZONE_1 / USD, one line 40.000 @ 100.0000, submitted and screened NLR so fulfillment_status is COMPLIANCE_CLEARED and priorities 11, 12-order-side, 14 and 15 all pass."
            - "VesselSailing S3 with cutoff_at 2026-08-15T00:00:00Z, etd 2026-08-17T00:00:00Z and capacity_weight_kg 5000.000, so there is ample capacity and priority 31 cannot fire."
            - "The clock is then set to exactly 2026-08-15T00:00:00Z: sweep step 4 fires at current_utc >= cutoff_at and moves the sailing OPEN -> CUTOFF_PASSED, but not to DEPARTED because current_utc < etd."
            - "The sailing is re-read AFTER the clock move so the trigger carries the post-sweep version and priority 13 cannot mask the result."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Niigata Marine Supply", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /vessel-sailings"
