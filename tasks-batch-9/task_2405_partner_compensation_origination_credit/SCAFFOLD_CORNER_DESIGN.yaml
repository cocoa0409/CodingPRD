          assert:
            - "${hc} == 0.0000 and ${lock} == 90000000, since 90000000 + 0 <= 100000000 leaves a non-negative residual"
            - "${disc} == 0 and ${form} == 10000000"
            - "${t3} == 30000000 and ${t6} == 60000000 - exactly proportional to lockstep_step, with no pool share involved"
            - "${d3} == 2000000 and ${d6} == 4000000"
            - "${bm3} == LOCKSTEP and ${bm6} == LOCKSTEP"
            - "${tfs} == 0.0000, so the whole 10000000 formula pool stays undistributed"
            - "CompensationCycle.${cy}.undistributed_cash_cents == 100000000 before any draw run"

      - name: true_up_appends_capital_withholding_before_evaluating_the_shortfall
        claim_type: chronological
        grounds:
          - calculations.true_up_settlement
          - endpoints[POST /comp/awards/{id}/true-up]
          - entities.DrawPayment.fields.kind
          - entities.Partner.fields.capital_account_balance_cents
          - state_machines[CompensationAward.payment_state]
        distinguishing_aspect: |
          The append order is load-bearing, not the arithmetic: with target_capital_cents
          5000000, one 2000000 draw already taken and a 30000000 final award, the
          CAPITAL_WITHHOLDING row of 5000000 is written and applied to the capital balance
          before capital_shortfall_cents is evaluated, so the shortfall is 0 and the award
          reaches SETTLED directly out of DRAWING - had the order been reversed it would
          have stopped at TRUED_UP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 with lockstep_unit_cents 10000000 and discretionary_pool_pct 0.0000."
            - "Partner L is LOCKSTEP at step 3 with opening_capital_cents 0 and target_capital_cents 5000000; C1 and C2 review L."
            - "The cycle has been carried to TRUE_UP_OPEN with L's award PUBLISHED at 30000000 and exactly one 2026-01 draw of 2000000 already paid, so payment_state is DRAWING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 10000000, discretionary_pool_pct: 0.0000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Chron Ord", practice_group: "CORPORATE", compensation_model: "LOCKSTEP", admission_year: 2008, lockstep_step: 3, opening_capital_cents: 0, target_capital_cents: 5000000 }
              as: CycleAdmin
              captures: { pl: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ord One", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2004, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ord Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Ordering matters.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${pl}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pl}"
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c1}" }
              as: CycleAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /comp/peer-reviews"
              payload: { self_assessment_id: "${sa}", reviewer_partner_id: "${c2}" }
              as: CycleAdmin
              captures: { r2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c1}"
            - call: "POST /comp/peer-reviews/${r2}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Fine." }
              as: Partner
              as_user_id: "${c2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}", partner_id: "${pl}" }
              as: CycleAdmin
              captures: { aw: "$.data[0].id", tgt: "$.data[0].target_award_cents", dm: "$.data[0].draw_schedule_monthly_cents" }
            - call: "POST /comp/awards/${aw}/draw-run"
              payload: { period_year: 2026, period_month: 1 }
              as: CycleAdmin
              captures: { paid: "$.data.draw_paid_cents", pst0: "$.data.payment_state" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "TRUE_UP_OPEN" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/awards/${aw}/true-up"
              payload: {}
              as: CycleAdmin
              captures: { fin: "$.data.final_award_cents", delta: "$.data.true_up_delta_cents", call: "$.data.capital_call_cents", short: "$.data.capital_shortfall_cents", pst: "$.data.payment_state" }
            - call: "GET /comp/awards/${aw}/draw-payments"
              payload: {}
              as: CycleAdmin
              captures: { k0: "$.data[0].kind", a0: "$.data[0].amount_cents", k1: "$.data[1].kind", a1: "$.data[1].amount_cents", k2: "$.data[2].kind", a2: "$.data[2].amount_cents" }
            - call: "GET /comp/partners/${pl}"
              payload: {}
              as: CycleAdmin
              captures: { bal: "$.data.capital_account_balance_cents" }
          assert:
            - "${tgt} == 30000000, ${dm} == 2000000, ${paid} == 2000000 and ${pst0} == DRAWING"
            - "${fin} == 30000000 and ${delta} == 28000000, i.e. 30000000 - 2000000"
            - "${call} == 5000000, i.e. max(0, 5000000 - 0)"
            - "${k0} == SCHEDULED_DRAW with ${a0} == 2000000"
            - "${k1} == CAPITAL_WITHHOLDING with ${a1} == 5000000, appended before the payout row"
            - "${k2} == TRUE_UP with ${a2} == 23000000, i.e. 28000000 - 5000000"
            - "GET /comp/awards/${aw}/draw-payments returns exactly 3 rows and no CLAWBACK row, since the delta is positive"
            - "${bal} == 5000000"
            - "${short} == 0 and ${pst} == SETTLED, which is only reachable because the withholding was applied before the shortfall was evaluated"

      - name: calculation_input_set_filtering
        claim_type: Input Set Filtering
        grounds:
          - "calculations.credited_collection_split.input_set_filter"
          - "entities.ContributionRecord.fields.verified"
        excluded_because:
          difficulty_instance: transitive_cascade / hours_verification_cascade_allocation_matter_partner_cycle
          rationale: "The 'only entities in the specified states are included' claim is asserted by scaffold_difficulty_design instance hours_verification_cascade_allocation_matter_partner_cycle, which shows an unverified ContributionRecord contributing nothing and the same row contributing after verify."

      - name: calculation_constants_applied
        claim_type: Constants Applied
        grounds:
          - "calculations.non_billable_weighted_points.constants"
        excluded_because:
          difficulty_instance: combinatorial_formula / non_billable_points_cap_then_diminishing_then_floor_penalty
          rationale: "Use of the declared constants is asserted by scaffold_difficulty_design instance non_billable_points_cap_then_diminishing_then_floor_penalty, which pins the four category weights, the four category caps, DIMINISHING_THRESHOLD_HOURS, DIMINISHING_FACTOR, PRO_BONO_FLOOR_HOURS and PRO_BONO_SHORTFALL_PENALTY in a single computed value."

      - name: threshold_boundary_values
        claim_type: threshold
        grounds:
          - "calculations.partner_formula_score.constants"
        excluded_because:
          difficulty_instance: boundary_precision_check / realization_exactly_at_ninety_five_hundredths_takes_top_tier
          rationale: "Threshold behaviour at value, value-epsilon and value+epsilon is asserted by scaffold_difficulty_design instance realization_exactly_at_ninety_five_hundredths_takes_top_tier, which contrasts blended realization 0.9500 against 0.9499 across the tier edge."

      - name: weighted_scoring_no_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - "calculations.partner_formula_score"
        excluded_because:
          difficulty_instance: combinatorial_formula / formula_score_normalization_pinned_before_index_consumption
          rationale: "The weights-sum-and-no-accumulated-drift claim is asserted by scaffold_difficulty_design instance formula_score_normalization_pinned_before_index_consumption, which pins each normalized index to 4 decimals before the 0.45/0.20/0.15/0.20 weighting and checks the composite against a pre-computed literal."

      - name: dual_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - "calculations.matter_realization_and_profitability.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / matter_profitability_contribution_vs_fully_loaded_diverge
          rationale: "Same-data-two-variants-diverge is asserted by scaffold_difficulty_design instance matter_profitability_contribution_vs_fully_loaded_diverge, which pins 0.8824 against 0.6706 on one matter."

      - name: dual_variant_selection
        claim_type: Variant Selection
        grounds:
          - "calculations.partner_formula_score.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / partner_formula_score_provisional_vs_final_diverge
          rationale: "Correct-variant-in-correct-context is asserted by scaffold_difficulty_design instance partner_formula_score_provisional_vs_final_diverge, which shows the PROVISIONAL_ACCRUAL basis at publication and the FINAL_COLLECTED basis after the matters close."

      - name: dual_variant_reconciliation
        claim_type: Reconciliation
        grounds:
          - "calculations.true_up_settlement"
        excluded_because:
          difficulty_instance: transitive_cascade / capital_contribution_cascade_partner_award_cycle
          rationale: "The provisional-to-final delta landing on the ledger is asserted by scaffold_difficulty_design instance capital_contribution_cascade_partner_award_cycle, which runs the true-up and follows true_up_delta_cents through the DrawPayment ledger into Partner.capital_account_balance_cents and CompensationCycle.undistributed_cash_cents."

  # =====================================================================
  - section: validations
    instances:

      - name: duplicate_fiscal_year_violates_the_cycle_uniqueness_constraint
        claim_type: Violation → Error
        grounds:
          - validations[priority=120]
          - errors[ERR_DUPLICATE_CYCLE]
          - endpoints[POST /comp/cycles]
        distinguishing_aspect: |
          fiscal_year is unique on CompensationCycle even when every other field differs and
          even when the first cycle has already advanced out of OPEN_INTAKE: the second
          create returns ERR_DUPLICATE_CYCLE 409 and the anchor cycle is unchanged.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 exists and has been advanced to SELF_ASSESSMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 55555555, lockstep_unit_cents: 7000000, discretionary_pool_pct: 0.4000, draw_pct: 0.5000, claim_deadline_on: "2026-08-31", assessment_deadline_on: "2026-09-30" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_DUPLICATE_CYCLE with HTTP 409"
            - "GET /comp/cycles returns exactly 1 row"
            - "CompensationCycle.${cy}.distributable_pool_cents == 100000000 and state == SELF_ASSESSMENT, untouched by the rejected create"
            - "a create for fiscal_year 2027 with otherwise identical values succeeds with 201"

      - name: evaluation_required_flag_switches_the_assessment_gate_on_and_off
        claim_type: Conditional validation
        grounds:
          - validations[priority=130]
          - errors[ERR_ASSESSMENTS_INCOMPLETE]
          - entities.Partner.fields.evaluation_required
          - state_machines[CompensationCycle].transitions[SELF_ASSESSMENT->PEER_REVIEW]
        distinguishing_aspect: |
          The completeness gate is conditional on a per-partner flag: the partner with
          evaluation_required true blocks SELF_ASSESSMENT -> PEER_REVIEW with
          ERR_ASSESSMENTS_INCOMPLETE 409 until they submit, while the partner with
          evaluation_required false never submits anything and never blocks - so the gate
          passes with one assessment on file for two partners.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in SELF_ASSESSMENT."
            - "Partner Y has evaluation_required true; partner X has evaluation_required false. Neither has submitted anything."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Yes Required", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014, evaluation_required: true }
              as: CycleAdmin
              captures: { py: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Not Required", practice_group: "TAX", compensation_model: "FORMULA", admission_year: 2000, evaluation_required: false }
              as: CycleAdmin
              captures: { px: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "Required partner statement.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${py}"
              captures: { sa: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
              captures: { err2: "$.data.error_id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${py}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
              captures: { st: "$.data.state" }
          assert:
            - "${err} == ERR_ASSESSMENTS_INCOMPLETE with HTTP 409"
            - "${err2} == ERR_ASSESSMENTS_INCOMPLETE with HTTP 409 - a DRAFT assessment does not satisfy the gate, which requires SUBMITTED or ACCEPTED"
            - "${st} == PEER_REVIEW once ${py} has submitted"
            - "GET /comp/self-assessments with cycle_id ${cy} returns exactly 1 row, for ${py}"
            - "no assessment exists for ${px}, whose evaluation_required is false"

      - name: one_recusal_strands_the_assessment_below_the_scored_review_minimum
        claim_type: Aggregate validation
        grounds:
          - validations[priority=130]
          - errors[ERR_PEER_REVIEWS_INCOMPLETE]
          - entities.SelfAssessment.fields.scored_review_count
          - state_machines[PeerReview].transitions
        distinguishing_aspect: |
          Every individual review is valid - one SCORE and one RECUSE are both legitimate
          outcomes - yet the collective falls one short of MIN_SCORED_PEER_REVIEWS, so
          PEER_REVIEW -> DELIBERATION fails with ERR_PEER_REVIEWS_INCOMPLETE 409 and a third
          reviewer has to be assigned; a recusal counts toward neither the roll-up nor the
          gate.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 advanced to PEER_REVIEW."
            - "Partner Y has a SUBMITTED assessment with reviews from C1 (SCORED) and C2 (RECUSED); C3 is an unassigned committee member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ag Gregate", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
