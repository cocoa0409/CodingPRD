        distinguishing_aspect: |
          Trigger: POST /deliveries/{id}/complete outcome=COMPLETED. Depth-4 chain
          where each link is caused by the previous one: delivery completion sells
          reserved lot quantities (L1 -> SOLD_OUT); the lot sale completes the order
          (CONFIRMED -> DELIVERED); the order delivery rebalances the job (settled
          1000000, last_completed_delivery_date 2026-09-10); the job mutation
          rebalances the builder (committed 0, settled 1000000, version bumped).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch stocked with L1 10 mbf @ 50000 (received 2026-09-02). Builder ACTIVE limit 5000000; job J. Order of 10 mbf FIXED @ 100000 = 1000000 CONFIRMED 2026-09-04; delivery SCHEDULED on a 2026-09-10 shift; clock advanced to 2026-09-10T13:00:00Z."
