# §1.9 Scaffold Corner Design - breadth coverage of every testable claim the §1.1-§1.7
# surface of SCAFFOLD.yaml declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not
# already cover. Sections and claim_types are taken verbatim from the taxonomy in
# references/claim-extraction-guide.md; no categories are invented.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_referring_hospital_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.ReferringHospital
          - endpoints.POST_ltch_referring_hospitals
        distinguishing_aspect: "A single POST with only the required fields must return 201 and every declared field - including the four computed monitoring fields at their declared defaults and the common fields at version 1."
        test_recipe:
          setup:
            - "Empty database. The logical clock sits at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE" }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id, rh_threshold: $.data.threshold_pct, rh_created: $.data.created_at }
          assert:
            - "HTTP 201 and the envelope is { meta, response_type: \"object\", data: {...} }"
            - "rh_id is a bare UUID with no type prefix"
            - "ReferringHospital.${rh_id}.name == Metro General, npi == 1000000001 and hospital_type == ACUTE_CARE"
            - "is_colocated == false (declared default), rh_threshold == 25.0, admissions_in_period == 0, share_pct == 0.0 and monitoring_state == COMPLIANT"
            - "version == 1 and rh_created == 2026-08-01T00:00:00.000Z with exactly three fractional digits; updated_at == created_at"

      - name: get_patient_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Patient
          - endpoints.GET_ltch_patients_id
        distinguishing_aspect: "The GET must echo the stored row byte-for-byte on the input fields and expose the computed open_referral_count, which is 1 after one RECEIVED referral exists - a read that recomputed nothing would still report 0."
        test_recipe:
          setup:
            - "One hospital, one DRG rate and one patient exist; a single referral has been created for that patient and is still RECEIVED."
          setup_api_calls:
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-200", full_name: "Ada Read", birth_date: "1944-02-02", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat200_id: $.data.id, pat200_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat200_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat200_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /ltch/patients/${pat200_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { got_mrn: $.data.mrn, got_open_count: $.data.open_referral_count, got_version: $.data.version }
          assert:
            - "HTTP 200, got_mrn == MRN-200, full_name == Ada Read, birth_date == 1944-02-02 and primary_payer == MEDICARE_FFS"
            - "got_open_count == 1 - the RECEIVED referral counts as open"
            - "got_version == 2 - referral creation bumped the patient row exactly once (the OCC parent write), and pat200_v was 1"

      - name: list_referrals_paginates_and_filters_on_status
        claim_type: listing
        grounds:
          - endpoints.GET_ltch_referrals
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three referrals belonging to three different patients (so none supersedes another) exercise limit/offset windows together with a status filter: total_count must report the filtered population, not the page size, and has_more must flip on the last window."
        test_recipe:
          setup:
            - "One hospital, one DRG rate, three patients, three RECEIVED referrals - one per patient, created in MRN order."
            - "The third referral is then withdrawn, so the population is 2 RECEIVED + 1 WITHDRAWN."
          setup_api_calls:
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-201", full_name: "Bea One", birth_date: "1950-01-01", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-202", full_name: "Cal Two", birth_date: "1951-02-02", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-203", full_name: "Dot Three", birth_date: "1952-03-03", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { p3_id: $.data.id, p3_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${p1_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${p1_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5 }
              as: IntakeCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${p2_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${p2_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5 }
              as: IntakeCoordinator
              captures: { r2_id: $.data.id }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${p3_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${p3_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5 }
              as: IntakeCoordinator
              captures: { r3_id: $.data.id }
            - call: "POST /ltch/referrals/${r3_id}/withdraw"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "GET /ltch/referrals"
              payload: { limit: 2, offset: 0 }
              as: IntakeCoordinator
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /ltch/referrals"
              payload: { limit: 2, offset: 2 }
              as: IntakeCoordinator
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /ltch/referrals"
              payload: { status: "RECEIVED", limit: 10, offset: 0 }
              as: IntakeCoordinator
              captures: { filtered_first: "$.data[0].status" }
          assert:
            - "First page: 2 items, meta/pagination total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 item, total_count == 3, has_more == false; page2_first != page1_first and the three ids across the two pages are exactly {${r1_id}, ${r2_id}, ${r3_id}} with no duplicates"
            - "Status-filtered page: 2 items, total_count == 2, has_more == false, filtered_first == RECEIVED and ${r3_id} is absent"
            - "GET /ltch/referrals with no limit/offset returns 3 items - the declared defaults are limit 10, offset 0"

      - name: get_patient_with_unknown_id_returns_patient_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PATIENT_NOT_FOUND
          - endpoints.GET_ltch_patients_id
        distinguishing_aspect: "A well-formed UUID that matches no row must produce the entity-specific 404, not a generic 500 or an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /ltch/patients/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404, err == ERR_PATIENT_NOT_FOUND and the envelope is response_type: \"error\" with data.error_id and data.message"

      - name: create_patient_missing_required_mrn_returns_validation
        claim_type: required_fields
        grounds:
          - entities.Patient.fields.mrn
          - errors.ERR_VALIDATION
        distinguishing_aspect: "mrn has source input with no default, so its absence must be a 400 before any uniqueness or business check runs; the same endpoint must also reject an out-of-catalogue primary_payer."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /ltch/patients"
              payload: { full_name: "No Mrn", birth_date: "1955-05-05", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { err_missing: $.data.error_id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-210", full_name: "Bad Payer", birth_date: "1955-05-05", primary_payer: "CRYPTO" }
              as: IntakeCoordinator
              captures: { err_enum: $.data.error_id }
          assert:
            - "Both calls return HTTP 400 with err_missing == ERR_VALIDATION and err_enum == ERR_VALIDATION"
            - "No Patient row was created: GET on any patient id is impossible and a following POST with mrn MRN-210 and a valid payer succeeds with 201"

      - name: weaning_plan_and_idt_note_apply_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.WeaningPlan.fields.protocol_label
          - entities.IdtNote.fields.goals_documented
          - endpoints.POST_ltch_stays_id_weaning_plans
        distinguishing_aspect: "Two omitted optional inputs on two different entities must fall back to their declared defaults (STANDARD_SBT and false) rather than null, and the plan's eight computed counters must all start at their declared zero values."
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 and one admitted PMV patient (Eli Default) at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-220", full_name: "Eli Default", birth_date: "1946-06-06", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat220_id: $.data.id, pat220_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat220_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat220_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref220_id: $.data.id }
            - call: "POST /ltch/referrals/${ref220_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref220_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay220_id: $.data.id }
          trigger:
            - call: "POST /ltch/stays/${stay220_id}/weaning-plans"
              payload: {}
              as: UtilizationReviewNurse
              captures: { plan220_id: $.data.id, plan220_protocol: $.data.protocol_label, plan220_status: $.data.status }
            - call: "POST /ltch/stays/${stay220_id}/idt-notes"
              payload: { discipline: "NURSING", note_text: "Admission assessment complete." }
              as: UtilizationReviewNurse
              captures: { note220_goals: $.data.goals_documented, note220_week: $.data.week_index }
          assert:
            - "plan220_protocol == STANDARD_SBT and plan220_status == SBT_TRIAL (initial_state)"
            - "WeaningPlan.${plan220_id}.vent_hours_total == 0, current_step == 0, sbt_attempt_count == 0, consecutive_failed_sbt == 0, max_tolerated_sbt_hours == 0, liberation_eligible == false, last_progression_at == null and closed_at == null"
            - "note220_goals == false (declared default, not null) and note220_week == 1 - the note lands in the first documentation week of a stay admitted at 2026-08-01"
            - "Stay.${stay220_id}.counts_toward_admission_threshold == true and admitted_with_override == false - both defaults"

      - name: screening_recomputes_data_complete_and_qualifying_track
        claim_type: computed_fields
        grounds:
          - entities.Referral.fields.data_complete
          - entities.Referral.fields.missing_fields
          - entities.Referral.fields.qualifying_track
          - calculations.referral_screening_evaluation
        distinguishing_aspect: "The screening verdict is derived, never supplied: a referral created without the clinical inputs screens to INFO_REQUESTED with an itemised missing_fields array, and the same referral flips to CRITERIA_MET only after submit-info fills the gaps - screened_count proving the evaluation ran twice."
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A (pmv 96h / 3 ICU days, wound stage 3 / count 2), DRG 207."
            - "A referral for Fay Partial is created with NO vent hours, NO ICU days, NO wound data and NO prior acute discharge instant."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-230", full_name: "Fay Partial", birth_date: "1947-07-07", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat230_id: $.data.id, pat230_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat230_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat230_v}" }
              as: IntakeCoordinator
              captures: { ref230_id: $.data.id, ref230_complete0: $.data.data_complete, ref230_track0: $.data.qualifying_track, ref230_status0: $.data.status }
          trigger:
            - call: "POST /ltch/referrals/${ref230_id}/screen"
              payload: {}
              as: IntakeCoordinator
              captures: { ref230_status1: $.data.status, ref230_missing: $.data.missing_fields, ref230_count1: $.data.screened_count }
            - call: "POST /ltch/referrals/${ref230_id}/submit-info"
              payload: { vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref230_status2: $.data.status, ref230_track2: $.data.qualifying_track, ref230_count2: $.data.screened_count, ref230_pinned: $.data.pinned_criteria_set_id }
          assert:
            - "At creation ref230_complete0 == false, ref230_track0 == NONE and ref230_status0 == RECEIVED - the computed fields start at their defaults with no evaluation yet"
            - "ref230_status1 == INFO_REQUESTED, ref230_count1 == 1 and ref230_missing lists exactly [vent_hours_at_referral, icu_days_at_referral, wound_stage, wound_count, prior_acute_discharge_at]"
            - "ref230_status2 == CRITERIA_MET, ref230_track2 == PMV (240 >= 96 and 5 >= 3), data_complete == true, missing_fields == [] and ref230_count2 == 2"
            - "ref230_pinned == ${cs_a_id} - the track evaluation pins the set that was ACTIVE and effective at screening time"

      - name: idt_note_documented_at_and_week_index_are_server_stamped
        claim_type: system_fields
        grounds:
          - entities.IdtNote.fields.documented_at
          - entities.IdtNote.fields.week_index
          - entities.IdtNote.common_fields
        distinguishing_aspect: "IdtNote is an append-only record: documented_at comes from the logical clock rather than the request, and week_index is derived from the offset to the stay's admitted_at - the same note text filed 8 days later must land in week 2."
        test_recipe:
          setup:
            - "The stay from weaning_plan_and_idt_note_apply_their_declared_defaults is admitted at 2026-08-01T00:00:00Z (same 8-call bootstrap: period, hospital, criteria set, DRG 207, patient MRN-240 Gus Stamp, referral, screen, admit)."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-240", full_name: "Gus Stamp", birth_date: "1948-08-08", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat240_id: $.data.id, pat240_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat240_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat240_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref240_id: $.data.id }
            - call: "POST /ltch/referrals/${ref240_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref240_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay240_id: $.data.id }
          trigger:
            - call: "POST /ltch/stays/${stay240_id}/idt-notes"
              payload: { discipline: "NURSING", note_text: "Week one nursing assessment.", goals_documented: true }
              as: UtilizationReviewNurse
              captures: { note1_at: $.data.documented_at, note1_week: $.data.week_index }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T00:00:00Z" }
              as: ComplianceOfficer
              captures: { prev_utc: $.data.previous_utc }
            - call: "POST /ltch/stays/${stay240_id}/idt-notes"
              payload: { discipline: "NURSING", note_text: "Week two nursing assessment.", goals_documented: true }
              as: UtilizationReviewNurse
              captures: { note2_at: $.data.documented_at, note2_week: $.data.week_index }
          assert:
            - "note1_at == 2026-08-01T00:00:00.000Z and note1_week == 1"
            - "prev_utc == 2026-08-01T00:00:00.000Z - the clock endpoint reports what it replaced"
            - "note2_at == 2026-08-09T00:00:00.000Z and note2_week == 2 - day 8 of the stay starts the second week"
            - "GET /ltch/stays/${stay240_id}/idt-notes returns 2 items, each carrying only id and created_at from the common set - no version and no updated_at, because IdtNote declares common_fields: false"

      - name: create_referring_hospital_with_an_invalid_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ReferringHospital.fields.hospital_type
          - entities.CostReportingPeriod.fields.end_date
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Two different type constraints on two entities: an enum value outside the declared literals, and a period whose end_date precedes its start_date - both must be 400s that create nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Urgent Corner", npi: "1000000009", hospital_type: "URGENT_CARE" }
              as: ComplianceOfficer
              captures: { err_enum: $.data.error_id }
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "BACKWARDS", start_date: "2027-06-30", end_date: "2026-07-01" }
              as: ComplianceOfficer
              captures: { err_range: $.data.error_id }
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
          assert:
            - "err_enum == ERR_VALIDATION with HTTP 400 - hospital_type is limited to {ACUTE_CARE, CRITICAL_ACCESS}"
            - "err_range == ERR_VALIDATION with HTTP 400 - end_date must not precede start_date"
            - "The third call returns 201, so neither rejection consumed the period_label or left a partial row: CostReportingPeriod.${period_id}.status == OPEN"

      - name: drg_rate_and_idt_note_expose_no_version_and_no_mutation_endpoint
        claim_type: immutability
        grounds:
          - entities.DrgRateEntry.common_fields
          - entities.IdtNote.common_fields
          - endpoints
        distinguishing_aspect: "Both immutable entities declare common_fields: false, so their rows carry id and created_at only, and §1.5 offers no PUT/PATCH/DELETE for either - a re-post of the same drg_code must collide rather than update."
        test_recipe:
          setup:
            - "One DRG rate entry for code 207 exists."
          setup_api_calls:
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id, drg207_created: $.data.created_at }
          trigger:
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 9.99, alos_days: 99, standard_federal_rate_cents: 1, ipps_comparable_per_diem_cents: 1, ipps_comparable_full_cents: 1 }
              as: ComplianceOfficer
              captures: { err_dup: $.data.error_id }
          assert:
            - "err_dup == ERR_DUPLICATE_KEY with HTTP 409 - drg_code is unique and the second POST is not an upsert"
            - "The stored row is untouched: relative_weight == 1.25, alos_days == 30 and created_at == ${drg207_created}"
            - "The response body for a DrgRateEntry carries id and created_at but no version and no updated_at; §1.5 declares no PUT, PATCH or DELETE on /ltch/drg-rates or /ltch/stays/{id}/idt-notes"

      - name: create_referral_with_an_unknown_drg_rate_returns_drg_rate_not_found
        claim_type: foreign_key_references_validated
        grounds:
          - entities.Referral.fields.drg_rate_id
          - errors.ERR_DRG_RATE_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so every FK is checked by lookup rather than by URL nesting: a referral naming a real patient and a real hospital but a phantom DRG rate must 404 on the DRG, and the patient's version must not advance."
        test_recipe:
          setup:
            - "One hospital and one patient exist. No DrgRateEntry has been created."
          setup_api_calls:
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-250", full_name: "Hal Orphan", birth_date: "1949-09-09", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat250_id: $.data.id, pat250_v: $.data.version }
          trigger:
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat250_id}", referring_hospital_id: "${rh_id}", drg_rate_id: "00000000-0000-4000-8000-0000000000ff", expected_patient_version: "${pat250_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5 }
              as: IntakeCoordinator
              captures: { err_fk: $.data.error_id }
            - call: "GET /ltch/patients/${pat250_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { pat250_v_after: $.data.version, pat250_open_after: $.data.open_referral_count }
          assert:
            - "err_fk == ERR_DRG_RATE_NOT_FOUND with HTTP 404"
            - "pat250_v_after == ${pat250_v} and pat250_open_after == 0 - a rejected create performs no parent write"
            - "GET /ltch/referrals returns 0 items with total_count 0"

      - name: recombine_against_a_parent_stay_of_another_patient_is_rejected
        claim_type: cross_reference_integrity
        grounds:
          - validations.priority_26_ERR_RECOMBINATION_WINDOW_EXCEEDED
          - errors.ERR_STAY_NOT_FOUND
          - endpoints.POST_ltch_stays_id_recombine
        distinguishing_aspect: "Recombination is the one cross-aggregate link a caller supplies by hand, so it needs three separate integrity checks: a phantom parent id 404s, a parent belonging to a different patient is refused, and naming the child itself is refused - none of them may partially reopen anything."
