  # ===========================================================================
  # Rule 4 - transitive_cascade (different triggers; one depth >= 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: warranty_strike_suspension_cascade_depth3
        grounds:
          - state_machines.WarrantyClaim.FILED_to_APPROVED_REWORK
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
          - entities.GlassShop.fields.warranty_strike_count
          - entities.GlassShop.fields.network_status
        distinguishing_aspect: |
          Depth-3 transitive cascade originating at warranty decide:
          decide(APPROVE_REWORK) -> creates rework WorkOrder AND
          GlassShop.warranty_strike_count += 1 -> strike count reaching 3 flips
          GlassShop.network_status to SUSPENDED -> suspended shop blocks
          subsequent WorkOrder accept (ERR_SHOP_SUSPENDED); each link is caused
          by the previous mutation, and the trigger differs from the
          invoice-driven claim-settlement cascade.
        test_recipe:
          setup:
            - "FL regulation (tax 0); policyholder + COMPREHENSIVE policy"
            - "STANDARD shop S (bay_count 2) serving 336 with two prior approved warranty reworks already decided (warranty_strike_count == 2)"
            - "A third completed work order (claim C3) on shop S, plus a fresh claim C4 already COVERAGE_VERIFIED and routed to S with work order OFFERED"
