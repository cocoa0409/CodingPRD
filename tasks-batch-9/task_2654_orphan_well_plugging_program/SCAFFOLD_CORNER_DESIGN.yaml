              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_v: $.data.version }
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-H0001", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "single orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c_id}", cement_per_sack_cents: 4137, rig_day_rate_cents: 849999, casing_per_ft_cents: 1213, mobilization_fee_cents: 2499999, technical_score: 92 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bid_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bid_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
          trigger:
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_proc"
              captures: { e_award: $.data.error_id }
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
