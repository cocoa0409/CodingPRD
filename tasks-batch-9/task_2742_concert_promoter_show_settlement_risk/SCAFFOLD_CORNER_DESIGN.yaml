      - name: comp_allowance_threshold_admits_exactly_thirty_comps_and_refuses_the_thirty_first
        claim_type: threshold
        grounds:
          - "calculations.show_comp_allowance"
          - "calculations.tier_inventory_conservation"
          - "validations[priority=32]"
          - "endpoints[POST /ticket-holds]"
          - "endpoints[POST /ticket-holds/{ticket_hold_id}/convert-to-comp]"
        distinguishing_aspect: "The allowance on a 1000-seat allocation is exactly 30, so all three boundary points are walked on one tier: 29 comps pass, the 30th passes, the 31st is ERR_COMP_ALLOWANCE_EXCEEDED 422 — and the refusal is on the CUMULATIVE total, proved by a 5-seat ARTIST_HOLD that is accepted as a hold and then refused on conversion because converted seats count as comps from the instant of conversion. Releasing one comp puts the counter back to 29 and the next single comp is accepted again, so the check is a live recount, not a high-water mark."
        test_recipe:
          setup:
            - "BASE(Threshold Market limit 5000000, Threshold Act, Threshold Arena cap 1000 / facility 0 / tax 0)."
            - "One CONFIRMED RENTAL show on an accepted FLAT_GUARANTEE offer of 500000, one GA tier priced 5000 with allocation_qty 1000, show ON_SALE so the tier is ON_SALE."
            - "Allowance = ROUND_HALF_UP(1000 * COMP_ALLOWANCE_PCT 3.0 / 100) == 30. No tickets are sold, so every rejection is an allowance rejection and never an inventory rejection."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Threshold Market", region_code: "TH", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { th_mk_id: $.data.id }
