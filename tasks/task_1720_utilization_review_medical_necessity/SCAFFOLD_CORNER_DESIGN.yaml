  - section: calculations
    instances:
      - name: necessity_score_boundary_values
        claim_type: correct_result
        grounds: [calculations.medical_necessity_score]
        excluded_because:
          difficulty_instance: "combinatorial_formula / necessity_score_caps_branch_threshold"
          rationale: "Score literals 98/72/60/52 including the >= 60 boundary and both plan_class branches are asserted there."
      - name: two_midnight_boundary_exactly_two
        claim_type: correct_result
        grounds: [calculations.two_midnight_benchmark]
        excluded_because:
          difficulty_instance: "boundary_precision_check / two_midnight_exactly_two_is_met"
          rationale: "The ==2 MET vs ==1 NOT_MET boundary is asserted there."
      - name: avoidable_attribution_variants
        claim_type: variant_divergence
        grounds: [calculations.avoidable_day_attribution]
        excluded_because:
          difficulty_instance: "dual_variant_calc / avoidable_attribution_first_cause_vs_dominant"
          rationale: "Both variants and their divergence are asserted there."
      - name: certified_day_count_aggregates_across_requests
        claim_type: correct_result
        grounds: [calculations.escalation_tier_resolution, entities.UtilizationCase.fields.certified_day_count]
        distinguishing_aspect: "Aggregation across two separate approved authorizations with level split: INPATIENT [1,4) plus OBSERVATION [4,7) yields certified_day_count 6 with a 3/3 inpatient-observation split."
        test_recipe:
          setup: ["case with auth A approved for INPATIENT [1,4); second auth B created for OBSERVATION (auth A stays APPROVED)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Commercial PPO", plan_class: "COMMERCIAL", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_com: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-AGG", payer_id: "${pay_com}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_a: $.data.id }
            - call: "POST /api/authorization-requests/${auth_a}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
            - call: "GET /api/utilization-cases/${case_id}"
              as: URNurse
              captures: { case_v2: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "OBSERVATION", requested_day_count: 3, clinical_summary: "Step-down observation monitoring after stabilization on oral therapy.", expected_case_version: "${case_v2}" }
              as: URNurse
              captures: { auth_b: $.data.id }
          trigger:
            - call: "POST /api/authorization-requests/${auth_b}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 4, certified_day_count: 3 }
              as: PayerReviewer
