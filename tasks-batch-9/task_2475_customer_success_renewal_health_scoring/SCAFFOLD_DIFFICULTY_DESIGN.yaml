      - name: ttv_breach_sweep_freezes_posture_and_blocks_onboarding_milestones
        grounds:
          - calculations.time_to_value_days
          - calculations.coverage_posture_derivation
          - state_machines.OnboardingMilestone.PENDING_to_OVERDUE
          - state_machines.OnboardingMilestone.OVERDUE_to_BLOCKED
          - state_machines.Account.ONBOARDING_to_ONBOARDING
        distinguishing_aspect: |
          DEPTH 3 from a third trigger shape - a pure time-driven intervention.
          Elapsed onboarding time past TTV_TARGET_DAYS raises ttv_breach_flag
          (link 1), the flag is what forces coverage_posture to FROZEN (link 2),
          and the FROZEN posture is what drives every OVERDUE milestone to
          BLOCKED (link 3); the WAIVE_TTV_BREACH action then unwinds all three.
        test_recipe:
          setup:
            - "ENTERPRISE Account, contract_start_date 2026-01-01, lifecycle_state ONBOARDING, no CoverageAssignment (coverage_posture RESTRICTED)."
            - "Four PENDING OnboardingMilestone rows due 2026-01-15, 2026-02-15, 2026-03-01 and 2026-03-15."
            - "Logical clock moved to 2026-05-01, i.e. 120 elapsed days against an ENTERPRISE TTV_TARGET_DAYS of 90."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "KICKOFF", sequence_index: 1, due_date: "2026-01-15" }
              as: CsOpsAdmin
              captures: { ms_kickoff_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "DATA_INTEGRATION", sequence_index: 2, due_date: "2026-02-15" }
              as: CsOpsAdmin
              captures: { ms_data_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "FIRST_VALUE", sequence_index: 3, due_date: "2026-03-01" }
              as: CsOpsAdmin
              captures: { ms_value_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "GO_LIVE", sequence_index: 4, due_date: "2026-03-15" }
              as: CsOpsAdmin
              captures: { ms_golive_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: CsOpsAdmin
          trigger:
            - call: "POST /_ops/daily-sweep"
              payload: {}
              as: CsOpsAdmin
              captures: { overdue_count: $.data.milestones_marked_overdue, repostured_count: $.data.accounts_repostured }
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "WAIVE_TTV_BREACH" }
              as: CsOpsAdmin
          assert:
            - "the sweep response data.milestones_marked_overdue == 4 and data.accounts_repostured == 1"
            - "LINK 1: immediately after the sweep Account.${acct_id}.ttv_breach_flag == true"
            - "LINK 2: immediately after the sweep Account.${acct_id}.coverage_posture == \"FROZEN\""
            - "LINK 3: immediately after the sweep all four milestones (${ms_kickoff_id}, ${ms_data_id}, ${ms_value_id}, ${ms_golive_id}) are in state \"BLOCKED\""
            - "after WAIVE_TTV_BREACH: Account.${acct_id}.ttv_breach_flag == false and coverage_posture == \"RESTRICTED\""
            - "after WAIVE_TTV_BREACH: all four milestones are back in state \"PENDING\" and Account.${acct_id}.lifecycle_state == \"ONBOARDING\""

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_outranks_outcome_weight_overflow_on_goal_create
        grounds:
          - validations[priority=13]
          - validations[priority=28]
          - state_machines.Account.ONBOARDING_to_CHURNED
          - errors.ERR_COVERAGE_POSTURE_FROZEN
        distinguishing_aspect: |
          Category pair `state` (priority 13, ERR_COVERAGE_POSTURE_FROZEN) versus
          `business_fiscal` (priority 28, ERR_WEIGHT_TOTAL_INVALID) on
          POST /accounts/{id}/outcome-goals: both are violated by the same call
          and the response must be the 409 state error, never the 422 fiscal one.
        test_recipe:
          setup:
            - "ENTERPRISE Account holding one OutcomeGoal with weight_bp 9500, so any further goal above 500 bp overflows MAX_TOTAL_WEIGHT_BP."
            - "The account has been CHURNED with churn_root_cause_code PRODUCT_GAP, so coverage_posture is FROZEN."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/outcome-goals"
              payload: { title: "Adoption of the analytics module", target_value: 100, weight_bp: 9500, actual_value: 40 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { goal_a_id: $.data.id }
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "CHURN", churn_root_cause_code: "PRODUCT_GAP" }
              as: CsOpsAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/outcome-goals"
              payload: { title: "Second workspace rollout", target_value: 100, weight_bp: 1000, actual_value: 0 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { conflict_err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == \"ERR_COVERAGE_POSTURE_FROZEN\"  (NOT ERR_WEIGHT_TOTAL_INVALID)"
            - "no new OutcomeGoal row exists for Account.${acct_id}; the account still has exactly one goal"
            - "Account.${acct_id}.coverage_posture == \"FROZEN\" and lifecycle_state == \"CHURNED\""

