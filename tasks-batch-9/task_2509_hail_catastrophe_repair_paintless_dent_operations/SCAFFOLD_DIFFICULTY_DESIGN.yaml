# =============================================================================
# §1.8 Scaffold Difficulty Design — task 2509 Hail Catastrophe Repair & PDR Ops
# Nine Difficulty Rules x >= 2 instances. Every numeric assert below was computed
# by executing the §1.3 formulas and constants as code against the pinned inputs.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: pdr_versus_conventional_variant_divergence_on_estimate
        grounds:
          - calculations.vehicle_repair_estimate
          - calculations.vehicle_repair_estimate.variants.matrix_pdr
          - calculations.vehicle_repair_estimate.variants.conventional_body
          - calculations.repairability_triage
          - entities.Vehicle.fields.matrix_variant_total_cents
          - entities.Vehicle.fields.conventional_variant_total_cents
          - entities.DamageLine.fields.routed_to
          - state_machines.Vehicle.INTAKE_to_ESTIMATED
        distinguishing_aspect: |
          One identical three-panel damage matrix is priced twice inside the same estimate call and
          the two variants disagree by exactly 54864 cents (202886 matrix vs 257750 conventional),
          because matrix_pdr consumes dent_count/tier/aluminum and ignores paint materials while
          conventional_body consumes labor hours plus paint materials and ignores dent counts;
          triage then selects the cheaper matrix variant into approved_repair_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T08:00:00Z."
            - "StormEvent 'Wichita Supercell' (KS, 55mm, GROUND_TRUTHED, 520 km2, 40000 vehicles, 3 competitors) scored 72 and TARGETED, then ACTIVE."
            - "Facility 'Wichita North Lot' (KS, 6 staging slots, pay_model FLAT) COMMISSIONED with both required permits APPROVED for 2026-08-01..2026-09-30 and technician TA licensed in KS deployed ON_SITE."
            - "Insurer 'Prairie Mutual' with direct_bill_enabled true and an ACTIVE RateAgreement effective 2026-08-01 (DIME 2213, NICKEL 3012, QUARTER 4202, HALF_DOLLAR 5611, labor 6500/hr, panel cap 140000, admin 5% cap 25000, auto-approve 10%, rental 10 days @ 4500)."
            - "Vehicle VIN 1HGCM82633A004352 taken in at the facility with acv_cents 2450000 and rental_required true, carrying three damage lines: HOOD 42 NICKEL dents r_and_i 0.5h conv 8.0h/25000, ROOF 15 DIME dents r_and_i 1.5h conv 12.0h/26000, LEFT_QUARTER 9 QUARTER dents aluminum conv 7.0h/31250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CatastropheDirector
            - call: "POST /hail-ops/storm-events"
              payload: { name: "Wichita Supercell", region_state_code: "KS", max_hail_size_mm: 55, swath_area_km2: 520, swath_confidence: "GROUND_TRUTHED", vehicle_population_estimate: 40000, competitor_shop_count: 3, first_hail_at: "2026-08-04T21:00:00Z" }
              as: CatastropheDirector
              captures: { ev: $.data.id }
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: CatastropheDirector
            - call: "POST /hail-ops/facilities"
              payload: { storm_event_id: "${ev}", name: "Wichita North Lot", state_code: "KS", address: "1200 N Broadway", staging_slot_count: 6, pay_model: "FLAT" }
              as: CatastropheDirector
              captures: { fac: $.data.id }
            - call: "POST /hail-ops/permits"
              payload: { facility_id: "${fac}", permit_type: "TEMP_BUSINESS_LICENSE", issuing_jurisdiction: "City of Wichita" }
              as: CatastropheDirector
              captures: { p1: $.data.id }
            - call: "POST /hail-ops/permits/${p1}/decision"
              payload: { decision: "APPROVE", valid_from: "2026-08-01", valid_to: "2026-09-30" }
              as: PermitOfficer
            - call: "POST /hail-ops/permits"
              payload: { facility_id: "${fac}", permit_type: "ZONING_USE", issuing_jurisdiction: "City of Wichita" }
              as: CatastropheDirector
              captures: { p2: $.data.id }
            - call: "POST /hail-ops/permits/${p2}/decision"
              payload: { decision: "APPROVE", valid_from: "2026-08-01", valid_to: "2026-09-30" }
              as: PermitOfficer
            - call: "POST /hail-ops/technicians"
              payload: { full_name: "Tara Alvarez", home_state_code: "TX", license_state_code: "KS", license_expires_at: "2027-01-31", skill_tier: "MASTER", flat_split_pct: 0.45 }
              as: CrewCoordinator
              captures: { tech_a: $.data.id }
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_a}", facility_id: "${fac}", start_date: "2026-08-05", end_date: "2026-09-15" }
              as: CrewCoordinator
              captures: { dep_a: $.data.id }
            - call: "POST /hail-ops/crew-deployments/${dep_a}/status"
              payload: { to_status: "ON_SITE" }
              as: CrewCoordinator
            - call: "POST /hail-ops/facilities/${fac}/commission"
              payload: {}
              as: CatastropheDirector
            - call: "POST /hail-ops/storm-events/${ev}/activate"
              payload: {}
              as: CatastropheDirector
            - call: "POST /hail-ops/insurers"
              payload: { name: "Prairie Mutual", naic_code: "18021", direct_bill_enabled: true }
              as: CatastropheDirector
              captures: { ins: $.data.id }
            - call: "POST /hail-ops/rate-agreements"
              payload: { insurer_id: "${ins}", storm_event_id: "${ev}", effective_from: "2026-08-01", matrix_rate_dime_cents: 2213, matrix_rate_nickel_cents: 3012, matrix_rate_quarter_cents: 4202, matrix_rate_half_dollar_cents: 5611, labor_rate_cents_per_hour: 6500, panel_cap_cents: 140000, admin_fee_pct: 0.05, admin_fee_cap_cents: 25000, supplement_auto_approve_pct: 0.10, rental_cap_days: 10, rental_daily_rate_cents: 4500 }
              as: CatastropheDirector
              captures: { ra: $.data.id }
            - call: "GET /hail-ops/insurers/${ins}"
              payload: {}
              as: CatastropheDirector
              captures: { ins_v: $.data.version }
            - call: "POST /hail-ops/rate-agreements/${ra}/activate"
              payload: { expected_insurer_version: "${ins_v}" }
              as: CatastropheDirector
            - call: "POST /hail-ops/vehicles"
              payload: { facility_id: "${fac}", insurer_id: "${ins}", vin: "1HGCM82633A004352", model_year: 2021, make: "Honda", model: "Accord", acv_cents: 2450000, owner_name: "D. Reyes", rental_required: true }
              as: IntakeAdvisor
              captures: { veh: $.data.id }
            - call: "POST /hail-ops/damage-lines"
              payload: { vehicle_id: "${veh}", panel_code: "HOOD", dent_count: 42, dent_size_class: "NICKEL", aluminum: false, conventional_labor_hours: 8.0, conventional_paint_materials_cents: 25000, r_and_i_hours: 0.5, oversize_dent_count: 0 }
              as: IntakeAdvisor
              captures: { dl_hood: $.data.id }
            - call: "POST /hail-ops/damage-lines"
              payload: { vehicle_id: "${veh}", panel_code: "ROOF", dent_count: 15, dent_size_class: "DIME", aluminum: false, conventional_labor_hours: 12.0, conventional_paint_materials_cents: 26000, r_and_i_hours: 1.5, oversize_dent_count: 0 }
              as: IntakeAdvisor
              captures: { dl_roof: $.data.id }
            - call: "POST /hail-ops/damage-lines"
              payload: { vehicle_id: "${veh}", panel_code: "LEFT_QUARTER", dent_count: 9, dent_size_class: "QUARTER", aluminum: true, conventional_labor_hours: 7.0, conventional_paint_materials_cents: 31250, r_and_i_hours: 0, oversize_dent_count: 0 }
              as: IntakeAdvisor
              captures: { dl_lq: $.data.id }
          trigger:
            - call: "POST /hail-ops/vehicles/${veh}/estimate"
              payload: {}
              as: ShopEstimator
            - call: "POST /hail-ops/vehicles/${veh}/triage"
              payload: {}
              as: ShopEstimator
          assert:
            - "Vehicle.${veh}.matrix_variant_total_cents == 202886"
            - "Vehicle.${veh}.conventional_variant_total_cents == 257750"
            - "Vehicle.${veh}.conventional_variant_total_cents - Vehicle.${veh}.matrix_variant_total_cents == 54864"
            - "DamageLine.${dl_hood}.pdr_line_cents == 110778 and DamageLine.${dl_hood}.conventional_line_cents == 77000"
            - "DamageLine.${dl_roof}.pdr_line_cents == 42945 and DamageLine.${dl_roof}.conventional_line_cents == 104000"
            - "DamageLine.${dl_lq}.pdr_line_cents == 49163 and DamageLine.${dl_lq}.conventional_line_cents == 76750"
            - "DamageLine.${dl_hood}.routed_to == PDR and DamageLine.${dl_roof}.routed_to == PDR and DamageLine.${dl_lq}.routed_to == PDR"
            - "DamageLine.${dl_hood}.capped == false and DamageLine.${dl_roof}.capped == false and DamageLine.${dl_lq}.capped == false"
            - "Vehicle.${veh}.pdr_feasible == true"
            - "Vehicle.${veh}.pinned_rate_agreement_id == ${ra}"
            - "Vehicle.${veh}.triage_disposition == PDR_REPAIR"
            - "Vehicle.${veh}.approved_repair_cents == 202886"
            - "Vehicle.${veh}.repair_status == TRIAGED"

      - name: flat_versus_pooled_crew_pay_variants_on_qc_pass
