# =============================================================================
# task_0386 — General Retail POS & Inventory
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >= 2 instances. All grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: return_refund_provisional_vs_final_diverge_on_amount_off_basket
        grounds:
          - calculations.return_value_provisional_vs_final
          - calculations.sale_total_pricing
          - state_machines.Sale.PENDING_to_RESTOCKED
          - entities.Sale.fields.total_due_cents
        distinguishing_aspect: |
          On the Sale domain: the provisional refund (per-unit floor of original effective price)
          equals 1680, while the final refund (basket-delta recomputation of the original
          AMOUNT_OFF sale) equals 2000; the two variants diverge by 320 cents for identical units.
        test_recipe:
          setup:
            - "Store S tax_rate_bps=0. Product P list 1000, loyalty_eligible. InventoryItem (S,P) on_hand=10."
            - "Promotion AMT: AMOUNT_OFF value 800, min_subtotal 0, stackable true."
            - "OPEN cash session at S."
            - "Original SALE: 5 units of P with promo AMT applied -> total_due 4200; settled CASH; stock COMMITTED."
            - "RETURN created against the settled sale for 2 units."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "S01", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-RET", barcode: "BC-RET", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${prod_id}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv_id: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv_id}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs_id: $.data.id }
            - call: "POST /count-sheets/${cs_id}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /promotions"
              payload: { code: "AMT800", kind: "AMOUNT_OFF", value: 800, min_subtotal_cents: 0, stackable: true }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", promo_code: "AMT800", lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: Cashier
              captures: { orig_sale_id: $.data.id, orig_v: $.data.version }
            - call: "POST /sales/${orig_sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 4200, expected_sale_version: "${orig_v}" }
              as: Cashier
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "RETURN", original_sale_id: "${orig_sale_id}", lines: [ { product_id: "${prod_id}", quantity: 2, return_of_line_no: 1 } ] }
              as: Cashier
              captures: { ret_sale_id: $.data.id, ret_total: $.data.total_due_cents, ret_v: $.data.version }
            - call: "POST /sales/${ret_sale_id}/tenders"
              payload: { method: "CASH", amount_cents: -2000, expected_sale_version: "${ret_v}" }
              as: Cashier
          assert:
            - "On RETURN create, Sale.${ret_sale_id}.total_due_cents == -1680 (provisional per-unit floor)."
            - "After settlement tender, Sale.${ret_sale_id}.total_due_cents == -2000 (final basket-delta)."
            - "Sale.${ret_sale_id}.settlement_status == SETTLED and stock_status == RESTOCKED."

      - name: loyalty_points_earn_at_sale_vs_clawback_at_return
        grounds:
          - calculations.loyalty_points_earned
          - state_machines.Sale.TENDERING_to_SETTLED
          - state_machines.Sale.PENDING_to_RESTOCKED
          - entities.LoyaltyAccount.fields.points_balance
          - entities.LoyaltyAccount.fields.lifetime_points
        distinguishing_aspect: |
          On the LoyaltyAccount domain: earn_at_sale credits points_balance by 40 and lifetime_points
          by 40; clawback_at_return debits those 40 back but leaves lifetime_points unchanged (tier
          never downgrades) — a different variant pair than the Sale-refund dual variant.
        test_recipe:
          setup:
            - "Store S tax_rate_bps=1000, loyalty_earn_rate_bps=100. Product P list 1000, loyalty_eligible. InventoryItem on_hand=20."
            - "LoyaltyAccount LA (STANDARD) granted 200 points."
            - "Promotion AMT800 AMOUNT_OFF 800 stackable true. OPEN session."
            - "SALE of 5xP with promo + redeem 200 points -> post_discount 4200, redeemed 200, eligible_net 4000 -> earned 40; total_due 4400; settled CASH."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "LY1", tax_rate_bps: 1000, loyalty_earn_rate_bps: 100 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-LY", barcode: "BC-LY", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${prod_id}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv_id: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv_id}", counted_qty: 20 }
              as: InventoryClerk
              captures: { cs_id: $.data.id }
            - call: "POST /count-sheets/${cs_id}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0001" }
              as: StoreManager
              captures: { la_id: $.data.id }
            - call: "POST /_loyalty/grant"
              payload: { loyalty_account_id: "${la_id}", add_points: 200 }
              as: StoreManager
            - call: "POST /promotions"
              payload: { code: "LYAMT", kind: "AMOUNT_OFF", value: 800, min_subtotal_cents: 0, stackable: true }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", loyalty_account_id: "${la_id}", promo_code: "LYAMT", redeem_points: 200, lines: [ { product_id: "${prod_id}", quantity: 5 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sale_v: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 4400, expected_sale_version: "${sale_v}" }
              as: Cashier
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "RETURN", loyalty_account_id: "${la_id}", original_sale_id: "${sale_id}", lines: [ { product_id: "${prod_id}", quantity: 5, return_of_line_no: 1 } ] }
              as: Cashier
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /sales/${ret_id}/tenders"
              payload: { method: "CASH", amount_cents: -4400, expected_sale_version: "${ret_v}" }
              as: Cashier
          assert:
            - "After original SALE settles, LoyaltyAccount.${la_id}.points_balance == 40 and lifetime_points == 240 (granted 200 - redeemed 200 + earned 40)."
            - "After full RETURN settles, LoyaltyAccount.${la_id}.points_balance == 200 (earned 40 clawed back, redeemed 200 restored: 40 - 40 + 200)."
            - "LoyaltyAccount.${la_id}.lifetime_points == 240 unchanged (no tier downgrade)."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tax_sum_then_round_pinned_order_mode_b
        grounds:
          - calculations.sale_total_pricing
          - entities.Sale.fields.tax_cents
          - entities.Sale.fields.total_due_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two taxable lines (bases 100 and 109) at tax_rate_bps=875.
          SUM-THEN-ROUND yields tax_cents=18; round-per-line-then-sum would yield 19. The scaffold
          pins SUM-THEN-ROUND, so total_due_cents==227, not 228.
        test_recipe:
          setup:
            - "Store S tax_rate_bps=875. Products P1 list 100, P2 list 109, both taxable. OPEN cash session."
            - "DRAFT SALE with one unit each of P1 and P2, no promo, no loyalty."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "TX1", tax_rate_bps: 875 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P1", barcode: "B1", name: "P1", list_price_cents: 100 }
              as: StoreManager
              captures: { p1: $.data.id }
            - call: "POST /products"
              payload: { sku: "P2", barcode: "B2", name: "P2", list_price_cents: 109 }
              as: StoreManager
              captures: { p2: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p1}", quantity: 1 }, { product_id: "${p2}", quantity: 1 } ] }
              as: Cashier
              captures: { sale_id: $.data.id }
          assert:
            - "Sale.${sale_id}.merchandise_subtotal_cents == 209."
            - "Sale.${sale_id}.tax_cents == 18 (sum-then-round; per-line would be 19)."
            - "Sale.${sale_id}.total_due_cents == 227."

      - name: pricing_evaluation_order_discount_then_redeem_then_tax_mode_c
        grounds:
          - calculations.sale_total_pricing
          - entities.Sale.fields.discount_cents
          - entities.Sale.fields.loyalty_redeemed_cents
          - entities.Sale.fields.tax_cents
          - entities.Sale.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: discount (800) is computed first, THEN redemption (200)
          off the post-discount subtotal, THEN tax (400) on (post_discount - redeemed). Any other
          order (e.g. tax before redemption) yields a different total; the pinned order gives
          total_due_cents==4400 exactly.
        test_recipe:
          setup:
            - "Store S tax_rate_bps=1000. Product P list 1000, taxable, loyalty_eligible."
            - "LoyaltyAccount LA granted 200 points. Promotion AMT800 AMOUNT_OFF 800 stackable true. OPEN session."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "ORD1", tax_rate_bps: 1000 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PO", barcode: "BO", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0002" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /_loyalty/grant"
              payload: { loyalty_account_id: "${la}", add_points: 200 }
              as: StoreManager
            - call: "POST /promotions"
              payload: { code: "AMTORD", kind: "AMOUNT_OFF", value: 800, min_subtotal_cents: 0, stackable: true }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", loyalty_account_id: "${la}", promo_code: "AMTORD", redeem_points: 200, lines: [ { product_id: "${p}", quantity: 5 } ] }
              as: Cashier
              captures: { sale_id: $.data.id }
          assert:
            - "Sale.${sale_id}.discount_cents == 800."
            - "Sale.${sale_id}.loyalty_redeemed_cents == 200."
            - "Sale.${sale_id}.tax_cents == 400."
            - "Sale.${sale_id}.total_due_cents == 4400."

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sale_parallel_settlement_and_stock_dimensions_evolve_independently
        grounds:
          - state_machines.Sale.TENDERING_to_SETTLED
          - state_machines.Sale.PENDING_to_COMMITTED
          - entities.Sale.fields.settlement_status
          - entities.Sale.fields.stock_status
        distinguishing_aspect: |
          On the Sale entity: settlement_status (DRAFT->TENDERING->SETTLED) and stock_status
          (PENDING->COMMITTED) are two independent axes — stock_status stays PENDING through a
          partial split tender (settlement_status==TENDERING) and only flips to COMMITTED when
          settlement reaches SETTLED.
        test_recipe:
          setup:
            - "Store S tax_rate_bps=0. Product P list 1000, InventoryItem on_hand=5. OPEN session."
            - "SALE of 2xP, total_due 2000."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "PAR1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PP", barcode: "BP", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 1200, expected_sale_version: "${v0}" }
              as: Cashier
              captures: { tl_id: $.data.id }
          assert:
            - "After first partial tender, Sale.${sale_id}.settlement_status == TENDERING."
            - "After first partial tender, Sale.${sale_id}.stock_status == PENDING (unchanged)."
            - "InventoryItem.${inv}.on_hand_qty == 5 (not yet decremented while TENDERING)."

      - name: layaway_cyclic_active_delinquent_active_payment_loop
        grounds:
          - state_machines.Layaway.ACTIVE_to_DELINQUENT
          - state_machines.Layaway.DELINQUENT_to_ACTIVE
          - entities.Layaway.fields.status
          - concurrency_rules[layaway-payment-stale]
        distinguishing_aspect: |
          On the Layaway entity (different entity from Sale): status cycles ACTIVE -> DELINQUENT
          (clock past due) -> ACTIVE (a partial deposit while balance still > 0), a true cycle that
          no linear pipeline exhibits.
        test_recipe:
          setup:
            - "Store S. Product P list 10000. InventoryItem on_hand=5. LoyaltyAccount LA (customer)."
            - "Clock at 2026-06-01. Layaway: 1xP, due_date 2026-06-10, initial_deposit 2000 -> balance 8000, ACTIVE."
            - "Advance clock to 2026-06-11 -> Layaway DELINQUENT."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "S", code: "LAY1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PL", barcode: "BL", name: "P", list_price_cents: 10000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0003" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /layaways"
              payload: { store_id: "${store_id}", product_id: "${p}", customer_id: "${la}", quantity: 1, due_date: "2026-06-10T00:00:00Z", initial_deposit_cents: 2000 }
              as: Cashier
              captures: { lay_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "GET /layaways/${lay_id}"
              payload: {}
              as: StoreManager
              captures: { v_delinq: $.data.version }
            - call: "POST /layaways/${lay_id}/payments"
              payload: { amount_cents: 3000, expected_layaway_version: "${v_delinq}" }
              as: Cashier
          assert:
            - "Before payment, Layaway.${lay_id}.status == DELINQUENT (clock past due_date, balance 8000)."
            - "After 3000 deposit (balance 5000 > 0), Layaway.${lay_id}.status == ACTIVE (cycled back)."
            - "Layaway.${lay_id}.balance_cents == 5000."

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: force_close_cascades_void_then_reverse_tender_then_restock_depth3
        grounds:
          - state_machines.CashDrawerSession.OPEN_to_FORCE_CLOSED
          - state_machines.Sale.DRAFT_to_TENDERING
          - entities.InventoryItem.fields.on_hand_qty
          - entities.Sale.fields.settlement_status
        distinguishing_aspect: |
          Depth-3 chain from the force-close trigger: force-close -> bound TENDERING Sale set to
          VOIDED (link 1) -> that VOID reverses its captured CARD TenderLine so tendered_cents
          returns to 0 (link 2, caused by the void) -> the void also releases the sale's stock
          reservation, leaving InventoryItem untouched and the drawer's expected_cash reflecting only
          the float (link 3). Each link is caused by the prior link.
        test_recipe:
          setup:
            - "Store S tax_rate_bps=0. Product P list 1000. InventoryItem on_hand=5. OPEN session float 0."
            - "SALE of 2xP (total 2000); one partial CARD tender 1200 -> settlement_status TENDERING, stock PENDING."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "FC1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PF", barcode: "BF", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
              captures: { sess_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 1200, expected_sale_version: "${sv}" }
              as: Cashier
          trigger:
            - call: "POST /cash-sessions/${sess_id}/force-close"
              payload: {}
              as: StoreManager
          assert:
            - "CashDrawerSession.${sess_id}.status == FORCE_CLOSED."
            - "Sale.${sale_id}.settlement_status == VOIDED (link 1)."
            - "Sale.${sale_id}.tendered_cents == 0 (CARD tender reversed by the void, link 2)."
            - "InventoryItem.${inv}.on_hand_qty == 5 (never committed; remains intact, link 3)."

      - name: layaway_fulfill_cascades_inventory_drawdown_then_below_reorder_depth2
        grounds:
          - state_machines.Layaway.ACTIVE_to_FULFILLED
          - calculations.inventory_available_and_reorder
          - entities.InventoryItem.fields.on_hand_qty
          - entities.InventoryItem.fields.below_reorder
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (layaway final payment): payment -> Layaway
          FULFILLED draws down InventoryItem.on_hand_qty and reserved_qty (link 1) -> that drawdown
          recomputes available_qty and re-evaluates below_reorder (link 2, caused by the drawdown).
          Different originating transition than the force-close cascade.
        test_recipe:
          setup:
            - "Store S. Product P list 1000. InventoryItem on_hand=3, reorder_point=2. LoyaltyAccount LA."
            - "Layaway: 1xP, due 2026-12-31, initial_deposit 0 -> balance 1000, ACTIVE; reserved_qty=1, available=2."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "LF1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PLF", barcode: "BLF", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 2, reorder_qty: 5 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 3 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0004" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /layaways"
              payload: { store_id: "${store_id}", product_id: "${p}", customer_id: "${la}", quantity: 1, due_date: "2026-12-31T00:00:00Z", initial_deposit_cents: 0 }
              as: Cashier
              captures: { lay_id: $.data.id, lv: $.data.version }
          trigger:
            - call: "POST /layaways/${lay_id}/payments"
              payload: { amount_cents: 1000, expected_layaway_version: "${lv}" }
              as: Cashier
          assert:
            - "Layaway.${lay_id}.status == FULFILLED and balance_cents == 0."
            - "InventoryItem.${inv}.on_hand_qty == 2 and reserved_qty == 0 (link 1 drawdown)."
            - "InventoryItem.${inv}.available_qty == 2 and below_reorder == true (link 2 recompute; 2 <= reorder_point 2 inclusive)."

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_outranks_promo_not_stackable_on_tendering_sale
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROMO_NOT_STACKABLE]
        distinguishing_aspect: |
          state (ERR_INVALID_STATE, priority 8) vs business_constraint (ERR_PROMO_NOT_STACKABLE,
          priority 12): editing lines (PUT /sales/{id}/lines) on a sale already in TENDERING with a
          non-stackable promo + redeem points returns ERR_INVALID_STATE (state check wins), not
          ERR_PROMO_NOT_STACKABLE.
        test_recipe:
          setup:
            - "Store S tax_bps=0. Product P list 1000. InventoryItem on_hand=10. OPEN session."
            - "Non-stackable promo NS10 (PERCENT_OFF 10). LoyaltyAccount LA granted 500 points."
            - "SALE of 2xP (total 2000), one partial tender -> settlement_status TENDERING."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "PC1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PPR", barcode: "BPR", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /promotions"
              payload: { code: "NS10", kind: "PERCENT_OFF", value: 10, min_subtotal_cents: 0, stackable: false }
              as: StoreManager
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0005" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /_loyalty/grant"
              payload: { loyalty_account_id: "${la}", add_points: 500 }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 1000, expected_sale_version: "${sv}" }
              as: Cashier
          trigger:
            - call: "PUT /sales/${sale_id}/lines"
              payload: { lines: [ { product_id: "${p}", quantity: 2 } ], promo_code: "NS10", redeem_points: 300 }
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE (state check at priority 8 outranks priority-12 stacking check)."

      - name: invalid_return_reference_outranks_insufficient_stock_on_exchange_create
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_INVALID_RETURN_REFERENCE]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          business_referential (ERR_INVALID_RETURN_REFERENCE, priority 10) vs business_fiscal
          (ERR_INSUFFICIENT_STOCK, priority 14): an EXCHANGE naming an original_sale_id that is not a
          SETTLED SALE returns ERR_INVALID_RETURN_REFERENCE even though the EXCHANGE outbound line
          would also lack stock (on_hand 0) — the referential check wins (a different category pair
          than the first instance).
        test_recipe:
          setup:
            - "Store S tax_bps=0. Product P list 1000. InventoryItem on_hand=0 (no stock). OPEN session."
            - "A DRAFT (un-settled) SALE D exists to serve as a bad original_sale_id."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "RR1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRR", barcode: "BRR", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { draft_id: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "EXCHANGE", original_sale_id: "${draft_id}", lines: [ { product_id: "${p}", quantity: 1, return_of_line_no: 1 } ] }
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 422 and data.error_id == ERR_INVALID_RETURN_REFERENCE (referential at priority 10 outranks priority-14 stock check)."

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: below_reorder_inclusive_at_reorder_point_via_count_post
        grounds:
          - calculations.inventory_available_and_reorder
          - state_machines.CountSheet.DRAFT_to_POSTED
          - entities.InventoryItem.fields.below_reorder
        distinguishing_aspect: |
          Inventory metric, reached through POST /count-sheets/{id}/post: below_reorder uses <=
          (inclusive). available_qty exactly equal to reorder_point (5 == 5) MUST flag
          below_reorder==true.
        test_recipe:
          setup:
            - "Store S. Product P. InventoryItem reorder_point=5, on_hand=0. One count sheet staged."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "RP1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRP", barcode: "BRP", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 5, reorder_qty: 5 }
              as: InventoryClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
              captures: { var_qty: $.data.variance_qty }
          assert:
            - "After posting counted_qty 5, InventoryItem.${inv}.available_qty == 5 and below_reorder == true (5 <= 5 inclusive)."
            - "CountSheet.${cs}.variance_qty == 5 (5 counted - 0 snapshot)."

      - name: loyalty_tier_silver_inclusive_at_1000_lifetime_points
        grounds:
          - calculations.loyalty_tier_recompute
          - entities.LoyaltyAccount.fields.tier
          - entities.LoyaltyAccount.fields.lifetime_points
        distinguishing_aspect: |
          Loyalty metric, reached through POST /_loyalty/grant (a distinct endpoint from the count
          path): tier uses >= (inclusive). lifetime_points exactly 1000 MUST be SILVER; 999 MUST be
          STANDARD. Different metric and endpoint from the inventory boundary.
        test_recipe:
          setup:
            - "LoyaltyAccount LA at lifetime_points 0; granted 999 then +1."
          setup_api_calls:
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0006" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /_loyalty/grant"
              payload: { loyalty_account_id: "${la}", add_points: 999 }
              as: StoreManager
              captures: { t999: $.data.tier }
          trigger:
            - call: "POST /_loyalty/grant"
              payload: { loyalty_account_id: "${la}", add_points: 1 }
              as: StoreManager
              captures: { t1000: $.data.tier }
          assert:
            - "At lifetime_points 999, LoyaltyAccount.${la}.tier == STANDARD."
            - "At lifetime_points 1000 (after +1), LoyaltyAccount.${la}.tier == SILVER (>= inclusive)."

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: tender_requires_store_posture_drawer_open
        grounds:
          - validations[priority=9]
          - state_machines.Store.LOCKED_to_DRAWER_OPEN
          - state_machines.Sale.DRAFT_to_TENDERING
          - errors[ERR_DRAWER_NOT_OPEN]
        distinguishing_aspect: |
          Sale -> Store pair: a Sale's DRAFT->TENDERING transition is gated by Store.posture ==
          DRAWER_OPEN. With the store's only cash session CLOSE_REQUESTED (posture LOCKED), the
          tender is rejected ERR_DRAWER_NOT_OPEN even though the Sale itself is a valid DRAFT.
        test_recipe:
          setup:
            - "Store S tax_bps=0. Product P. InventoryItem on_hand=10."
            - "Open a cash session (posture DRAWER_OPEN). Create DRAFT SALE 1xP (binds the session)."
            - "request-close the session (posture -> LOCKED); the sale is still DRAFT so close is allowed."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "DO1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PDO", barcode: "BDO", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
              captures: { sess: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /cash-sessions/${sess}/request-close"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 1000, expected_sale_version: "${sv}" }
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_DRAWER_NOT_OPEN (Store.posture LOCKED gates the Sale tender)."

      - name: return_requires_original_sale_settled
        grounds:
          - validations[priority=10]
          - state_machines.Sale.PENDING_to_RESTOCKED
          - errors[ERR_INVALID_RETURN_REFERENCE]
          - entities.Sale.fields.original_sale_id
        distinguishing_aspect: |
          Sale -> Sale(original) pair (a different entity pair than Sale->Store): a RETURN's validity
          depends on the referenced original Sale being settlement_status SETTLED and kind SALE.
          A RETURN against a VOIDED original is rejected ERR_INVALID_RETURN_REFERENCE.
        test_recipe:
          setup:
            - "Store S tax_bps=0. Product P list 1000. InventoryItem on_hand=10. OPEN session."
            - "Create a SALE then VOID it (settlement_status VOIDED). Use it as original for a RETURN."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "RS1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRS", barcode: "BRS", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { orig: $.data.id }
            - call: "POST /sales/${orig}/void"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "RETURN", original_sale_id: "${orig}", lines: [ { product_id: "${p}", quantity: 1, return_of_line_no: 1 } ] }
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 422 and data.error_id == ERR_INVALID_RETURN_REFERENCE (original Sale is VOIDED, not SETTLED)."

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inventory_aggregate_capacity_reservation_overlap_on_inventory_item
        grounds:
          - validations[priority=14]
          - state_machines.Transfer.REQUESTED_to_DISPATCHED
          - state_machines.Layaway.ACTIVE_to_DELINQUENT
          - entities.InventoryItem.fields.available_qty
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the InventoryItem resource: a layaway already
          reserves 3 of 5 on_hand (available 2); a transfer dispatch requesting 3 collides because
          reserved (3) + requested (3) > on_hand (5). The occupation is summed against aggregate
          capacity, rejected ERR_INSUFFICIENT_STOCK.
        test_recipe:
          setup:
            - "Store A. Product P list 1000. InventoryItem (A,P) on_hand=5. LoyaltyAccount LA."
            - "Layaway reserves 3 of P at store A -> reserved_qty=3, available_qty=2."
            - "Store B with InventoryItem (B,P). Transfer REQUESTED A->B for quantity 3."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "A", code: "AGA", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sa: $.data.id }
            - call: "POST /stores"
              payload: { name: "B", code: "AGB", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sb: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAG", barcode: "BAG", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sa}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inva: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inva}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /inventory-items"
              payload: { store_id: "${sb}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { invb: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0007" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /layaways"
              payload: { store_id: "${sa}", product_id: "${p}", customer_id: "${la}", quantity: 3, due_date: "2026-12-31T00:00:00Z", initial_deposit_cents: 0 }
              as: Cashier
              captures: { lay: $.data.id }
            - call: "POST /transfers"
              payload: { from_store_id: "${sa}", to_store_id: "${sb}", product_id: "${p}", quantity: 3 }
              as: InventoryClerk
              captures: { tr: $.data.id, trv: $.data.version }
          trigger:
            - call: "POST /transfers/${tr}/dispatch"
              payload: { expected_transfer_version: "${trv}" }
              as: InventoryClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INSUFFICIENT_STOCK (reserved 3 + requested 3 > on_hand 5)."
            - "InventoryItem.${inva}.available_qty == 2 unchanged after the rejected dispatch."

      - name: cash_session_singleton_occupation_overlap_per_store
        grounds:
          - state_machines.CashDrawerSession.OPEN_to_CLOSE_REQUESTED
          - entities.CashDrawerSession.fields.status
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          Singleton-occupation interval semantics on the Store resource (different resource entity
          and different geometry than aggregate capacity): at most one CashDrawerSession may occupy
          {OPEN, CLOSE_REQUESTED} per store at a time. Opening a second session while one is OPEN
          collides and is rejected ERR_DUPLICATE_RESOURCE.
        test_recipe:
          setup:
            - "Store S. One cash session already OPEN."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "CS1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 1000 }
              as: StoreManager
              captures: { sess1: $.data.id }
          trigger:
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 2000 }
              as: StoreManager
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_DUPLICATE_RESOURCE (a session already occupies OPEN for this store)."

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_total_on_hand_inventory_units
        grounds:
          - state_machines.Sale.DRAFT_to_VOIDED
          - state_machines.Sale.PENDING_to_COMMITTED
          - calculations.inventory_available_and_reorder
          - entities.InventoryItem.fields.on_hand_qty
        distinguishing_aspect: |
          Conserved quantity #1 = total on_hand units on the InventoryItem. A SALE in TENDERING
          (stock still PENDING) paired with its compensating void must leave on_hand exactly as it
          was. Invariant: on_hand_after_void == on_hand_before_sale == 5; no drift.
        test_recipe:
          setup:
            - "Store S tax_bps=0. Product P list 1000. InventoryItem on_hand=5. OPEN session."
            - "DRAFT SALE 2xP, one partial CARD tender -> TENDERING (stock still PENDING)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "VI1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PVI", barcode: "BVI", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 1000, expected_sale_version: "${sv}" }
              as: Cashier
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: Cashier
          assert:
            - "Sale.${sale_id}.settlement_status == VOIDED."
            - "InventoryItem.${inv}.on_hand_qty == 5 (conserved; equals pre-sale level, no drift)."
            - "InventoryItem.${inv}.available_qty == 5 and reserved_qty == 0."

      - name: void_conserves_loyalty_points_balance
        grounds:
          - state_machines.Sale.TENDERING_to_VOIDED
          - calculations.loyalty_points_earned
          - entities.LoyaltyAccount.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity #2 = LoyaltyAccount.points_balance (a different conserved quantity than
          inventory units). A sale that provisionally debits 300 redeemed points, then is voided
          before settling, must restore points_balance to its pre-sale value. Invariant:
          points_balance_after_void == 500 (granted) == pre-sale; no points leak.
        test_recipe:
          setup:
            - "Store S tax_bps=0. Product P list 1000. InventoryItem on_hand=10. OPEN session."
            - "LoyaltyAccount LA granted 500 points. DRAFT SALE 2xP with redeem_points 300 (redemption provisionally debited)."
            - "Partial CARD tender -> TENDERING."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "VL1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PVL", barcode: "BVL", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${store_id}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-0008" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /_loyalty/grant"
              payload: { loyalty_account_id: "${la}", add_points: 500 }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${store_id}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", kind: "SALE", loyalty_account_id: "${la}", redeem_points: 300, lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 500, expected_sale_version: "${sv}" }
              as: Cashier
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: Cashier
          assert:
            - "Sale.${sale_id}.settlement_status == VOIDED."
            - "LoyaltyAccount.${la}.points_balance == 500 (300 redeemed points restored, conserved; no leak)."
            - "LoyaltyAccount.${la}.lifetime_points == 500 unchanged."
