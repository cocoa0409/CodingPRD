      - name: professional_use_only_listing_exempts_its_allergens_from_disclosure
        claim_type: threshold
        grounds:
          - calculations.allergen_disclosure_completeness
          - entities.ProductListing.fields.professional_use_only
          - entities.ProductIngredient.fields.disclosure_required
        distinguishing_aspect: |
          The professional-use exemption short-circuits the concentration test entirely: the SAME
          undisclosed allergen at 0.5000 — five hundred times the LEAVE_ON threshold — is
          disclosure_required false on a professional-use-only listing (complete true) and
          disclosure_required true on an otherwise identical consumer listing (complete false).
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, two LEAVE_ON listings: a professional-use-only 11E and a consumer 07A"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
