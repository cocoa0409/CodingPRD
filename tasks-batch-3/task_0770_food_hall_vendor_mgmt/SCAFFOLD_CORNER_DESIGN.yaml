scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: food_hall_create_returns_all_fields
        claim_type: Creation
        grounds: ["entities.FoodHall", "endpoints[POST /food-halls]"]
        distinguishing_aspect: "POST /food-halls with all required fields returns 201 with a server-minted id, version 1, and the echoed capacity/hours fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /food-halls"
              payload: { name: "Central Hall", total_seating_capacity: 120, common_area_capacity: 400, hall_open_minutes: 480, hall_close_minutes: 1320, event_buffer_minutes: 45 }
              as: HallManager
              captures: { fh: $.data.id, ver: $.data.version }
          assert:
            - "response code 201; FoodHall.${fh}.total_seating_capacity == 120"
            - "FoodHall.${fh}.event_buffer_minutes == 45; version == 1"

      - name: stall_create_missing_required_stall_code_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Stall.fields.stall_code", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /stalls omitting stall_code is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A food hall exists."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
          trigger:
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (HTTP 422)"

      - name: stall_get_nonexistent_not_found
        claim_type: Not Found
        grounds: ["entities.Stall", "errors[ERR_STALL_NOT_FOUND]"]
        distinguishing_aspect: "GET /stalls/{id} with a non-existent UUID returns ERR_STALL_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stalls/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALL_NOT_FOUND (HTTP 404)"

      - name: stall_create_operational_posture_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.Stall.fields.operational_posture"]
        distinguishing_aspect: "operational_posture is server-computed: a newly created vacant stall is SUSPENDED regardless of any client-supplied operational_posture value."
        test_recipe:
          setup: ["A food hall exists."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
          trigger:
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320, operational_posture: "OPEN" }
              as: HallManager
              captures: { st: $.data.id }
          assert:
            - "Stall.${st}.operational_posture == SUSPENDED (vacant; client input ignored)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: lease_activate_when_active_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Lease.DRAFT_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE lease is not a valid DRAFT->ACTIVE transition; second activate returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Open stall with an ACTIVE lease."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
          trigger:
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: settlement_finalize_when_finalized_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Settlement.PROVISIONAL_to_FINALIZED", "errors[ERR_SETTLEMENT_NOT_PROVISIONAL]"]
        distinguishing_aspect: "FINALIZED is terminal for finalize; a second finalize on the same settlement returns ERR_SETTLEMENT_NOT_PROVISIONAL and does not re-debit the lease."
        test_recipe:
          setup: ["Open stall + active lease; a FINALIZED settlement (one FULFILLED order 4000000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { lv: $.data.version }
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 4000000, item_count: 3 }
              as: POSOperator
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /orders/${o1}/fulfill"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { se: $.data.id }
            - call: "POST /settlements/${se}/finalize"
              payload: {}
              as: HallManager
          trigger:
            - call: "POST /settlements/${se}/finalize"
              payload: {}
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SETTLEMENT_NOT_PROVISIONAL (HTTP 409)"
            - "Lease.${ls}.outstanding_balance_cents == 200000 (unchanged; no double debit)"

      - name: order_accept_after_reject_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Order.ROUTED_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for an Order; accepting a rejected order returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Open stall with a ROUTED order that has been REJECTED by its vendor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 1500, item_count: 1 }
              as: POSOperator
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/reject"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
          trigger:
            - call: "POST /orders/${o1}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"

  # =========================================================================
  - section: calculations
    instances:
      - name: deposit_forfeiture_prorated_on_early_terminate
        claim_type: Correct Result
        grounds: ["calculations.deposit_forfeiture", "endpoints[POST /leases/{id}/terminate]"]
        distinguishing_aspect: "Terminating a 214-day lease (2026-06-01..2026-12-31, deposit 100000) at 2026-09-01 (122 days remaining) forfeits round(100000*122/214)=57009 and refunds 42991."
        test_recipe:
          setup: ["Open stall + active lease, deposit 100000; clock set to 2026-09-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HallManager
          trigger:
            - call: "POST /leases/${ls}/terminate"
              payload: {}
              as: HallManager
              captures: { refund: $.data.deposit_refund_cents }
          assert:
            - "terminate response deposit_refund_cents == 42991"
            - "Lease.${ls}.status == TERMINATED"

      - name: compliance_grade_single_inspection_weighted_equals_score
        claim_type: Correct Result
        grounds: ["calculations.stall_compliance_grade", "endpoints[GET /stalls/{id}/compliance-grade]"]
        distinguishing_aspect: "With a single CONDUCTED inspection (score 82), WEIGHTED uses weight [1.0], so score==82 and grade==B."
        test_recipe:
          setup: ["A stall with one CONDUCTED inspection score 82."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /inspections"
              payload: { stall_id: "${st}", scheduled_for: "2026-04-01T09:00:00Z" }
              as: HealthInspector
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/conduct"
              payload: { score: 82 }
              as: HealthInspector
          trigger:
            - call: "GET /stalls/${st}/compliance-grade?method=WEIGHTED"
              payload: { method: "WEIGHTED" }
              as: HallManager
              captures: { score: $.data.score, grade: $.data.grade }
          assert:
            - "compliance-grade response score == 82, grade == \"B\""

  # =========================================================================
  - section: validations
    instances:
      - name: seating_zero_window_returns_invalid_request
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_INTERVAL_INVALID]"]
        distinguishing_aspect: "A seating allocation with start_time == end_time is a degenerate interval, rejected with ERR_INTERVAL_INVALID (422)."
        test_recipe:
          setup: ["A food hall exists."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
          trigger:
            - call: "POST /seating-allocations"
              payload: { food_hall_id: "${fh}", seats: 4, start_time: "2026-06-15T10:00:00Z", end_time: "2026-06-15T10:00:00Z" }
              as: POSOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INTERVAL_INVALID (HTTP 422)"

      - name: lease_end_before_start_returns_invalid_request
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_LEASE_TERM_INVALID]"]
        distinguishing_aspect: "Creating a lease with end_date <= start_date is rejected with ERR_LEASE_TERM_INVALID (422)."
        test_recipe:
          setup: ["A hall, an active vendor, and a stall exist."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-12-31", end_date: "2026-06-01", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LEASE_TERM_INVALID (HTTP 422)"

      - name: posoperator_cannot_create_stall_unauthorized
        claim_type: RBAC Denial
        grounds: ["roles.POSOperator", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /stalls is HallManager-exclusive; a POSOperator attempt returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A food hall exists."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
          trigger:
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: POSOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: food_hall_get_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any resource lookup."
        test_recipe:
          setup: ["A food hall exists; the trigger is sent with missing/blank auth headers."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
          trigger:
            - call: "GET /food-halls/${fh}"
              payload: {}
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "with headers omitted, response error_id == ERR_UNAUTHENTICATED (HTTP 401)"

  # =========================================================================
  - section: endpoints
    instances:
      - name: stalls_list_paginated_by_hall
        claim_type: Listing
        grounds: ["endpoints[GET /stalls]"]
        distinguishing_aspect: "GET /stalls?food_hall_id= returns a paginated array of the hall's stalls with total_count and has_more."
        test_recipe:
          setup: ["A hall with two stalls."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-2", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
          trigger:
            - call: "GET /stalls?food_hall_id=${fh}"
              payload: { food_hall_id: "${fh}" }
              as: HallManager
          assert:
            - "response is an array of 2 stalls; meta/pagination total_count == 2, has_more == false"

  # =========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_lease_version_settlement_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-supersede-stale-lease]", "errors[ERR_STALE_LEASE_VERSION]"]
        distinguishing_aspect: "After a first POST /settlements bumps Lease.version, a second create still carrying the pre-bump expected_lease_version is rejected 412 ERR_STALE_LEASE_VERSION."
        test_recipe:
          setup: ["Open stall + active lease; lease version captured before any settlement; one PROVISIONAL settlement already created (bumping lease version)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { lv: $.data.version }
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { se1: $.data.id }
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "second create carrying the stale ${lv} -> error_id ERR_STALE_LEASE_VERSION (HTTP 412)"

      - name: event_over_common_area_capacity_rejected
        claim_type: rate_threshold_triggers
        grounds: ["state_machines.MarketingEvent.PLANNED_to_SCHEDULED", "errors[ERR_COMMON_AREA_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Scheduling an event whose reserved_capacity (600) exceeds the hall's common_area_capacity (500) is rejected with ERR_COMMON_AREA_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["Hall common_area_capacity 500; a PLANNED event reserving 600."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /marketing-events"
              payload: { food_hall_id: "${fh}", name: "Big", start_time: "2026-07-01T09:00:00Z", end_time: "2026-07-01T12:00:00Z", reserved_capacity: 600, expected_footfall: 900 }
              as: HallManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /marketing-events/${e1}/schedule"
              payload: {}
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMMON_AREA_CAPACITY_EXCEEDED (HTTP 409)"

  # =========================================================================
  - section: rbac
    instances:
      - name: vendor_cannot_accept_other_vendors_order
        claim_type: RBAC Denial
        grounds: ["roles.Vendor", "state_machines.Order.ROUTED_to_ACCEPTED", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Order accept requires the acting Vendor to be the stall's current_vendor_id; a different vendor accepting returns ERR_UNAUTHORIZED (ownership check on entity_backed Vendor)."
        test_recipe:
          setup: ["Open stall leased to vendor v1 with a ROUTED order; a second active vendor v2 exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V1", contact_email: "v1@x.com" }
              as: HallManager
              captures: { v1: $.data.id }
            - call: "POST /vendors/${v1}/activate"
              payload: {}
              as: HallManager
            - call: "POST /vendors"
              payload: { legal_name: "V2", contact_email: "v2@x.com" }
              as: HallManager
              captures: { v2: $.data.id }
            - call: "POST /vendors/${v2}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v1}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 1500, item_count: 1 }
              as: POSOperator
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /orders/${o1}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403); Order.${o1}.status remains ROUTED"

  # =========================================================================
  - section: entities
    instances:
      - name: lease_create_nonexistent_stall_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Lease.fields.stall_id", "errors[ERR_STALL_NOT_FOUND]"]
        distinguishing_aspect: "Creating a lease with a non-existent stall_id FK returns ERR_STALL_NOT_FOUND (404)."
        test_recipe:
          setup: ["A hall and an active vendor exist; no stall with the given id."]
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { stall_id: "00000000-0000-4000-8000-000000000000", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALL_NOT_FOUND (HTTP 404)"

  # =========================================================================
  - section: errors
    instances:
      - name: error_stall_suspended_on_order
        claim_type: Violation to Error
        grounds: ["errors[ERR_STALL_SUSPENDED]"]
        excluded_because:
          difficulty_instance: order_routing_requires_stall_posture
          rationale: "ERR_STALL_SUSPENDED is asserted as the failure path of that §1.8 cross-entity instance."
      - name: error_permit_not_issued_on_lease_activate
        claim_type: Violation to Error
        grounds: ["errors[ERR_PERMIT_NOT_ISSUED]"]
        excluded_because:
          difficulty_instance: lease_activate_requires_permit_issued
          rationale: "ERR_PERMIT_NOT_ISSUED is asserted as the failure path of that §1.8 instance."
      - name: error_seating_capacity_exceeded
        claim_type: Violation to Error
        grounds: ["errors[ERR_SEATING_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: seating_capacity_equality_admitted
          rationale: "ERR_SEATING_CAPACITY_EXCEEDED is asserted at the 31-seat boundary of that §1.8 instance."
      - name: error_event_time_conflict
        claim_type: Violation to Error
        grounds: ["errors[ERR_EVENT_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: event_buffer_dilated_overlap
          rationale: "ERR_EVENT_TIME_CONFLICT is asserted for the 30-minute-gap event in that §1.8 instance."
