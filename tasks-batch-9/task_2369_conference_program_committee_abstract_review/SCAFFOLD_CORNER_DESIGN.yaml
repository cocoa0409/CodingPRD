      - name: program_phase_session_and_slot_guards_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EMPTY_SESSION
          - errors.ERR_SESSION_THEME_MISMATCH
          - errors.ERR_SESSION_FORMAT_MISMATCH
          - errors.ERR_PRESENTER_NOT_ON_ABSTRACT
          - errors.ERR_DUPLICATE_SLOT_POSITION
          - errors.ERR_SESSION_SLOT_CAPACITY_REACHED
          - errors.ERR_SESSION_STATE_INVALID
          - errors.ERR_SLOT_STATE_INVALID
          - errors.ERR_MEMBER_STILL_CHAIRING
          - errors.ERR_CHANGE_REQUEST_STATE_INVALID
          - errors.ERR_PROGRAM_FROZEN
          - errors.ERR_AUTHOR_BARRED
        distinguishing_aspect: |
          One fully decided conference drives twelve otherwise unreachable codes.
          Each candidate abstract differs from the session in exactly one respect,
          so the coherence codes cannot be confused: A2 matches the ORAL format but
          its keywords lack the theme (ERR_SESSION_THEME_MISMATCH) while A3 matches
          the theme but was decided POSTER (ERR_SESSION_FORMAT_MISMATCH). Position
          reuse is tested while capacity still has room (ERR_DUPLICATE_SLOT_POSITION)
          and capacity is tested with a free position (ERR_SESSION_SLOT_CAPACITY_REACHED),
          so neither p19 branch can mask the other. Finally the clock is walked past
          the program freeze and then past the session end so that the frozen-change
          and no-show/sanction codes become reachable in the same run.
