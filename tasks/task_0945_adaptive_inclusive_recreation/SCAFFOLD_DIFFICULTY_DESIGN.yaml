  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdrawal_cascade_promotes_encumbers_exhausts_lapses_and_demotes
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - state_machines.ScholarshipAward.PROPOSED_to_ENCUMBERED
          - state_machines.FundingSource.OPEN_to_EXHAUSTED
          - state_machines.ScholarshipAward.PROPOSED_to_LAPSED_NO_FUNDS
          - state_machines.Enrollment.CONFIRMED_to_WAITLISTED
        distinguishing_aspect: |
          Depth-8 chain from the WITHDRAW trigger where every hop is caused by the
          previous hop: withdraw -> slot frees -> waitlisted row promotes -> its
          PROPOSED award encumbers -> the source's available_cents reaches 0 -> the
          source flips EXHAUSTED -> a DIFFERENT participant's PROPOSED award lapses ->
          that participant is demoted CONFIRMED -> WAITLISTED.
        test_recipe:
          setup:
            - "An OPEN operating period covering 2026 and a RESTRICTED_GRANT funding source with total_budget_cents 7000, award_mode FLAT_CAP and flat_award_cents 7000."
            - "A FIFO program with no consent, certification or equipment requirements; one session with slot_capacity 2."
            - "PA (BAND_C) and PC (BAND_A) CONFIRMED, filling both slots; PB (BAND_C) WAITLISTED behind them."
            - "A PROPOSED 7000-cent award on PB's enrollment and a PROPOSED 3000-cent award on PC's enrollment, both drawn on the same source; no cents have moved yet."
          setup_api_calls:
            - call: "POST /recreation/operating-periods"
              payload: { name: "FY26", starts_on: "2026-01-01", ends_on: "2026-12-31" }
              as: ProgramAdmin
              captures: { op: "$.data.id" }
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 8000, series_cents: 48000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_A", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_a: "$.data.id" }
            - call: "POST /recreation/funding-sources"
              payload: { operating_period_id: "${op}", name: "Inclusion Grant", source_kind: "RESTRICTED_GRANT", priority_rank: 1, award_mode: "FLAT_CAP", award_pct_bp: 0, flat_award_cents: 7000, total_budget_cents: 7000 }
              as: FundingOfficer
              captures: { fs: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Fitness", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-A", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { pa: "$.data.id", pa_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
