              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: u_analyst_1
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
