              payload: { application_id: "${app_id}", assignment_opening_id: "${opening_id}", expected_assignment_opening_version: "${opening_v}" }
              as: PlacementOfficer
              as_user_id: "po-1"
              captures: { inv_id: $.data.id }
            - call: "GET /volunteer-portal/invitations/${inv_id}"
              as: PlacementOfficer
          assert:
            - "Invitation.${inv_id}.status == ISSUED; issued_by == po-1"
            - "pinned_country_program_id == ${prog_pe}; pinned_country_medical_tier == 3; pinned_departure_date == 2027-01-15T00:00:00Z (snapshots of the opening/program at issuance)"
            - "issued_at == 2026-09-01T00:00:00Z (logical clock); acceptance_deadline == 2026-09-11T00:00:00Z (issued_at + 10 days exactly)"

  - section: consistency_model
    instances:
      - name: computed_fields_visible_immediately_in_write_responses
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: the interview complete response itself carries the computed overall_score and recommendation, the accept response shows ACCEPTED, and a subsequent read of the opening already reflects the committed seat — no recompute lag anywhere."
        test_recipe:
          setup:
            - "PE program + opening (seats_total 2); applicant Ana EVALUATED-ready (application INTERVIEWING with one SCHEDULED interview)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /volunteer-portal/country-programs"
              payload: { country_code: "PE", name: "Peru", medical_support_tier: 3, required_language: "Spanish", language_threshold_score: 2.5, training_capacity: 10 }
              as: SystemAdmin
              captures: { prog_pe: $.data.id }
            - call: "POST /volunteer-portal/assignment-openings"
              payload: { country_program_id: "${prog_pe}", sector: "EDUCATION", title: "Secondary English Teacher", required_skills: ["TEACHING_ENGLISH"], seats_total: 2, departure_date: "2027-01-15T00:00:00Z", invitation_issue_deadline: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
              captures: { opening_id: $.data.id, opening_v: $.data.version }
            - call: "POST /volunteer-portal/applicants"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", date_of_birth: "1995-05-20T00:00:00Z", citizenship_country: "US", skills: ["TEACHING_ENGLISH"] }
              as: SystemAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /volunteer-portal/applications"
              payload: { applicant_id: "${ana_id}", sector_preferences: ["EDUCATION"], country_preference_ids: ["${prog_pe}"] }
              as: Applicant
              as_user_id: "${ana_id}"
              captures: { app_id: $.data.id }
            - call: "POST /volunteer-portal/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ana_id}"
            - call: "POST /volunteer-portal/applications/${app_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /volunteer-portal/applications/${app_id}/interviews"
              payload: { interviewer_id: "officer-1", scheduled_start: "2026-09-05T14:00:00Z", scheduled_end: "2026-09-05T15:00:00Z" }
              as: PlacementOfficer
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /volunteer-portal/interviews/${int_id}/complete"
              payload: { motivation_score: 4.0, adaptability_score: 3.0, skill_competency_score: 3.0, cross_cultural_score: 3.0 }
              as: PlacementOfficer
              captures: { resp_overall: $.data.overall_score, resp_rec: $.data.recommendation }
            - call: "POST /volunteer-portal/invitations"
              payload: { application_id: "${app_id}", assignment_opening_id: "${opening_id}", expected_assignment_opening_version: "${opening_v}" }
              as: PlacementOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /volunteer-portal/invitations/${inv_id}/accept"
              payload: {}
