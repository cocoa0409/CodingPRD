            - "Representative.${rep_a}.version == 2"

      - name: corner_accreditation_cycles_from_lapsed_back_to_active_twice
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Representative[ACTIVE->LAPSED]
          - state_machines.Representative[LAPSED->ACTIVE]
        distinguishing_aspect: "The ACTIVE <-> LAPSED loop has no cycle cap: two full LAPSE/RENEW passes leave accreditation_status ACTIVE at version 6, with ce_credits_earned and accreditation_expires_on overwritten by the second renewal's values (18 and 2033-06-30), not accumulated across renewals."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE at version 2."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-421", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "LAPSE" }
              as: SystemAdmin
              captures: { st1: $.data.accreditation_status }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "RENEW", ce_credits: 12, accreditation_expires_on: "2030-06-30" }
              as: SystemAdmin
              captures: { st2: $.data.accreditation_status, ce2: $.data.ce_credits_earned }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "LAPSE" }
              as: SystemAdmin
              captures: { st3: $.data.accreditation_status }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "RENEW", ce_credits: 18, accreditation_expires_on: "2033-06-30" }
              as: SystemAdmin
              captures: { st4: $.data.accreditation_status, ce4: $.data.ce_credits_earned, v4: $.data.version }
          assert:
            - "${st1} == LAPSED"
            - "${st2} == ACTIVE"
            - "${ce2} == 12"
            - "${st3} == LAPSED"
            - "${st4} == ACTIVE"
            - "${ce4} == 18"
            - "${v4} == 6"
            - "Representative.${rep_a}.accreditation_expires_on == 2033-06-30"

      - name: corner_holding_an_outreach_event_adjusts_the_representative_caseload
        claim_type: cross_entity
        grounds:
          - state_machines.OutreachEvent[PLANNED->HELD]
          - calculations.representative_caseload_weight
          - endpoints[GET /cvso/representatives/{id}/caseload]
        distinguishing_aspect: "A PLANNED event contributes PLANNED_OUTREACH_WEIGHT 2 to its representative's caseload_weight; HOLD moves the event out of the planned set, so the same representative's caseload_weight falls from 2.0 to 0.0 and planned_outreach_count from 1 to 0 in the computed read."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, advanced to 2026-08-01T12:00:00Z before the hold so the event has started."
            - "rep_a ACTIVE COUNTY_CVSO holding no designations and no claims."
            - "One PLANNED OutreachEvent on rep_a's calendar from 09:00 to 11:00 on 2026-08-01."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-431", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "HOMELESS_STANDDOWN", location_name: "County Fairgrounds", starts_at: "2026-08-01T09:00:00.000Z", ends_at: "2026-08-01T11:00:00.000Z", underserved_flag: true }
              as: SystemAdmin
              captures: { ev: $.data.id }
            - call: "GET /cvso/representatives/${rep_a}/caseload"
              payload: {}
              as: SystemAdmin
              captures: { weight_before: $.data.caseload_weight, planned_before: $.data.planned_outreach_count }
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/outreach-events/${ev}/status"
              payload: { action: "HOLD", veterans_contacted: 40, veterans_enrolled: 9 }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { ev_status: $.data.status }
            - call: "GET /cvso/representatives/${rep_a}/caseload"
              payload: {}
              as: SystemAdmin
              captures: { weight_after: $.data.caseload_weight, planned_after: $.data.planned_outreach_count }
          assert:
            - "${weight_before} == 2.0"
            - "${planned_before} == 1"
            - "${ev_status} == HELD"
            - "OutreachEvent.${ev}.veterans_contacted == 40"
            - "OutreachEvent.${ev}.veterans_enrolled == 9"
            - "${weight_after} == 0.0"
            - "${planned_after} == 0"

      - name: corner_guarded_transition_on_discharge_verification_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Claim[DRAFT]
          - validations[priority=43]
        excluded_because:
          difficulty_instance: claim_creation_blocked_while_discharge_document_is_discrepancy_held_and_allowed_after_verification
          rationale: "That instance is exactly the guarded-transition probe: the same POST /cvso/claims request is refused with ERR_DISCHARGE_NOT_VERIFIED while the veteran's DischargeDocument sits in DISCREPANCY_HELD and succeeds unchanged once the document reaches VERIFIED, so the guard is shown to depend on the other entity's state and nothing else."

      - name: corner_cascade_down_from_accreditation_revocation
        claim_type: cascade_down
        grounds:
          - state_machines.Representative[ACTIVE->REVOKED]
        excluded_because:
          difficulty_instance: accreditation_revocation_cascades_through_poa_claim_appointment_to_site_ledger
          rationale: "That instance walks all five declared hops of the revocation cascade end to end and asserts the resulting state of every touched PowerOfAttorney, Claim, ExamAppointment and ExamSite, which is a strict superset of a single-level cascade-down check."

      - name: corner_conditional_cascade_skips_children_in_the_wrong_state
        claim_type: conditional_cascade
        grounds:
          - state_machines.Representative[ACTIVE->REVOKED]
        excluded_because:
          difficulty_instance: accreditation_revocation_cascades_through_poa_claim_appointment_to_site_ledger
          rationale: "Hop 3 of that instance only rewinds Claims whose status is in {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE} and the instance asserts that a claim outside that set keeps its status while still losing poa_id, which is precisely the conditional-cascade claim."

      - name: corner_ledger_sync_on_exam_slot_and_program_pool
        claim_type: ledger_sync
        grounds:
          - calculations.exam_slot_ledger
          - calculations.program_pool_ledger
        excluded_because:
          difficulty_instance: cancelling_an_appointment_frees_the_slot_so_the_same_window_can_be_rebooked_and_closed_out
          rationale: "That instance reconciles ExamSite.booked_slot_count before, during and after each ExamAppointment state change, which is the ledger-sync before/after reconciliation for the only two derived ledgers in the scaffold; the program-pool half is covered by clawback_returns_program_allocation_to_zero_so_the_next_approval_allocates_exactly_its_own_award."

      - name: corner_compensating_transition_reverses_its_side_effects
        claim_type: compensation
        grounds:
          - state_machines.StateBenefitApplication[PENDING->CLAWED_BACK]
        excluded_because:
          difficulty_instance: clawback_returns_program_allocation_to_zero_so_the_next_approval_allocates_exactly_its_own_award
          rationale: "That instance drives the clawback and then proves the absence of drift by re-approving a second application that consumes exactly its own award from the restored pool, which subsumes a plain undo-transition check."

  - section: calculations
    instances:
      - name: corner_caseload_weight_sums_designation_and_claim_stage_points
        claim_type: correct_result
        grounds:
          - calculations.representative_caseload_weight
          - endpoints[GET /cvso/representatives/{id}/caseload]
        distinguishing_aspect: "A representative holding one ACTIVE designation whose single claim sits in EVIDENCE_DEVELOPMENT scores POA_WEIGHT 1 + CLAIM_STAGE_WEIGHT[EVIDENCE_DEVELOPMENT] 3 = 4.0, and the computed read decomposes that into active_poa_count 1, open_claim_count 1 and planned_outreach_count 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet with a VERIFIED DD214 and an ACTIVE PowerOfAttorney designating rep_a."
            - "One Claim of that veteran driven to EVIDENCE_DEVELOPMENT."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-441", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["tinnitus"] }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /cvso/claims/${claim}/transitions"
              payload: { action: "OPEN_EVIDENCE_DEVELOPMENT" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { cst: $.data.status }
            - call: "GET /cvso/representatives/${rep_a}/caseload"
              payload: {}
              as: SystemAdmin
              captures: { poa_n: $.data.active_poa_count, claim_n: $.data.open_claim_count, out_n: $.data.planned_outreach_count, w: $.data.caseload_weight, elig: $.data.assignment_eligible }
          assert:
            - "${cst} == EVIDENCE_DEVELOPMENT"
            - "${poa_n} == 1"
            - "${claim_n} == 1"
            - "${out_n} == 0"
            - "${w} == 4.0"
            - "${elig} == true"
            - "Representative.${rep_a}.caseload_weight == 4.0"

