  # =========================================================================
  # From Cross-Cutting Complexity Layers (complexity_profile.complexity_layers)
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: change_order_decision_on_a_superseded_project_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[change-order-decision-stale-project]
          - endpoints[POST /change-orders/{id}/review-decision]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: |
          The version the customer rep read before a spare-part line was added is refused with 412
          ERR_STALE_PROJECT_VERSION, and the very same decision payload with the refreshed version succeeds —
          so the OCC gate depends only on Project.version, not on anything about the change order itself.
        test_recipe:
          setup:
            - "A project with one SUBMITTED price-only change order (price_delta_cents 10000000, scope_delta_cph 0)."
            - "The project's version is observed, then advanced by an unrelated spare-part-line write."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-40", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-090"
              captures: { proj_l1: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_l1}", title: "Scanner tunnel upgrade", scope_delta_cph: 0, price_delta_cents: 10000000, schedule_delta_days: 0 }
              as: ProjectDirector
              as_user_id: "pd-090"
              captures: { co_l1: $.data.id }
            - call: "POST /change-orders/${co_l1}/submit"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-090"
            - call: "GET /projects/${proj_l1}"
              payload: {}
              as: CustomerRep
              as_user_id: "cust-rep-77"
              captures: { pv_l1: $.data.version }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_l1}", part_no: "BLT-1500-01", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 90 }
              as: ProjectDirector
              as_user_id: "pd-090"
          trigger:
            - call: "POST /change-orders/${co_l1}/review-decision"
              payload: { decision: "APPROVE", expected_project_version: "${pv_l1}" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
              captures: { err_l1: $.data.error_id }
            - call: "GET /projects/${proj_l1}"
              payload: {}
              as: CustomerRep
              as_user_id: "cust-rep-77"
              captures: { pv_l1b: $.data.version }
            - call: "POST /change-orders/${co_l1}/review-decision"
              payload: { decision: "APPROVE", expected_project_version: "${pv_l1b}" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
              captures: { co_status_l1: $.data.status }
          assert:
            - "the first call is 412 with error_id ERR_STALE_PROJECT_VERSION"
            - "after the first call ChangeOrder.${co_l1}.status is still SUBMITTED and Project.${proj_l1}.contract_value_cents == 243600000"
            - "${pv_l1b} == ${pv_l1} + 1 (the spare-part-line write advanced it by exactly one)"
            - "the third call is 200 with ${co_status_l1} == APPROVED"
            - "Project.${proj_l1}.contract_value_cents == 253750000, escalation_fee_cents == 3750000 and commercial_status == CLEAN"

      - name: spares_provisioning_rerun_on_a_stale_project_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[spares-provisioning-stale-project]
          - endpoints[POST /projects/{id}/spares-provisioning]
          - calculations[spares_budget_waterfall]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: |
          Adding the second spare-part line is exactly the event the OCC rule guards against — the pool the caller
          reasoned about changed — so the run with the pre-insert version is refused with 412 and no line leaves
          DRAFT, while the refreshed run allocates 1700000 and 1506000.
        test_recipe:
          setup:
            - "A project with spares_budget_cents 5000000 and one CRITICAL line (850000 x 2, lead 90); its version is observed, then a second MAJOR line (1255000 x 2, lead 60) is added."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-41", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { proj_l2: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_l2}", part_no: "BLT-1500-01", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 90 }
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { line_l2a: $.data.id }
            - call: "GET /projects/${proj_l2}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { pv_l2: $.data.version }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_l2}", part_no: "RLR-1400-02", criticality: "MAJOR", unit_cost_cents: 1255000, min_stock_qty: 2, lead_time_days: 60 }
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { line_l2b: $.data.id }
          trigger:
            - call: "POST /projects/${proj_l2}/spares-provisioning"
              payload: { expected_project_version: "${pv_l2}" }
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { err_l2: $.data.error_id }
            - call: "GET /projects/${proj_l2}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { pv_l2b: $.data.version }
            - call: "POST /projects/${proj_l2}/spares-provisioning"
              payload: { expected_project_version: "${pv_l2b}" }
              as: ProjectDirector
              as_user_id: "pd-091"
              captures: { alloc_l2: $.data.spares_allocated_cents }
          assert:
            - "the first call is 412 with error_id ERR_STALE_PROJECT_VERSION"
            - "after the first call SparePartLine.${line_l2a}.status == DRAFT and SparePartLine.${line_l2b}.status == DRAFT with allocated_cents 0 on both"
            - "the third call is 200 with ${alloc_l2} == 3206000 and spares_unallocated_cents == 1794000"
            - "SparePartLine.${line_l2a}.allocated_cents == 1700000 and status == ALLOCATED"
            - "SparePartLine.${line_l2b}.weighted_target_cents == 1506000, allocated_cents == 1506000 and status == ALLOCATED"

      - name: fat_test_on_a_stale_lot_version_returns_412_before_the_state_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fat-test-stale-lot]
          - validations[priority=7]
          - endpoints[POST /fat-tests]
          - errors[ERR_STALE_LOT_VERSION]
        distinguishing_aspect: |
          The failed first test both advanced FabricationLot.version and pushed the lot to FAT_FAILED, so two rules
          are violated at once and the priority-7 OCC gate wins: the reply is 412 ERR_STALE_LOT_VERSION, never
          409 ERR_LOT_INVALID_STATE.
        test_recipe:
          setup:
            - "Fixture A project frozen, lot LOT-4200 STAGED in BAY-42 with fat_target_cph 1313; the staged version is captured."
            - "One FAT test at 1000 cph is recorded first, which fails the lot and advances its version."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-42", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-092"
              captures: { proj_l3: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_l3}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_l3a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_l3}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_l3b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_l3}", from_segment_id: "${seg_l3a}", to_segment_id: "${seg_l3b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_l3}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_l3}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-092"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-42", concurrent_capacity: 1 }
              as: ShopSupervisor
              captures: { bay_l3: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_l3}", lot_code: "LOT-4200", staging_bay_id: "${bay_l3}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-02T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_l3: $.data.id }
            - call: "POST /fabrication-lots/${lot_l3}/start-fabrication"
              payload: {}
              as: ShopSupervisor
            - call: "POST /fabrication-lots/${lot_l3}/stage"
              payload: {}
              as: ShopSupervisor
              captures: { lotv_l3: $.data.version }
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_l3}", expected_fabrication_lot_version: "${lotv_l3}", measured_cph: 1000, defect_count: 3 }
              as: ShopSupervisor
              captures: { fat_l3: $.data.id }
          trigger:
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_l3}", expected_fabrication_lot_version: "${lotv_l3}", measured_cph: 1313, defect_count: 0 }
              as: ShopSupervisor
              captures: { err_l3: $.data.error_id }
          assert:
            - "the response is 412 with error_id ERR_STALE_LOT_VERSION, not 409 ERR_LOT_INVALID_STATE"
            - "FabricationLot.${lot_l3}.status == FAT_FAILED, fat_attempt_count == 1 and version == ${lotv_l3} + 1"
            - "FatTest.${fat_l3}.result == FAIL, attempt_no == 1 and target_cph_at_test == 1313"
            - "GET /fabrication-lots/${lot_l3}/fat-tests returns total_count == 1 (the refused call recorded nothing)"

      - name: project_version_advances_only_on_writes_that_declare_it
        claim_type: optimistic_concurrency
        grounds:
          - endpoints[POST /segments]
          - endpoints[POST /flow-links]
          - endpoints[POST /projects/{id}/simulations]
          - endpoints[POST /projects/{id}/design-freeze]
        distinguishing_aspect: |
          Version reaches 4 after two segments and one link, stays at 4 across a simulation run (which declares no
          Project.version side effect while still creating a SimulationRun row), then becomes 5 on the freeze and 6
          on a spare-part line.
        test_recipe:
          setup:
            - "An empty database; Fixture A built one write at a time with a project read after each step."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-43", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
