    code: 200
    input: []
    output: Territory
    side_effects: []
  - method: GET
    path: "/bottler/territories"
    description: "List territories, optionally by brand"
    roles: [PlatformAdmin, BrandOwnerAdmin, BottlerOps]
    code: 200
    input: ["brand_owner_id?", "limit?", "offset?"]
    output: Territory[]
