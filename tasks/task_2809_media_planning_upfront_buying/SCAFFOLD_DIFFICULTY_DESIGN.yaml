      - name: category_separation_buffer_rejects_flight_touching_the_buffered_end
        grounds:
          - validations[priority 37]
          - errors.ERR_CATEGORY_SEPARATION_CONFLICT
          - entities.Advertiser.fields.category_code
          - entities.Buy.fields.flight_start
          - endpoints[POST /upfront/buys/{buyId}/place]
        distinguishing_aspect: |
          An AUTOMOTIVE buy already placed on the seller for 2026-11-01 to
          2026-12-31T23:59:59Z buffers to 2026-10-25T00:00:00Z - 2027-01-07T23:59:59Z. A
          second AUTOMOTIVE buy whose flight starts exactly on that buffered end instant is
          refused because the buffered interval is closed, while one starting a single second
          later is placed, and a same-window ELECTRONICS buy on the same seller is placed
          too. Three placements differing only in start instant and category separate a
          correct implementation from one that buffers only one end, uses a half-open
          comparison, or ignores category_code.
