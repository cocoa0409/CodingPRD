# =============================================================================
# SCAFFOLD.yaml — Oilseed Crush Margin Management & Origination Contracts
# §1.0–§1.7 (difficulty and corner designs live in their own sibling files)
# =============================================================================

scenario: |
  Oilseed Crush Margin Management & Origination Contracts (Archer Daniels Midland): farmer origination through elevators with cash, basis and deferred pricing contracts, crush margin management hedging bean purchases against oil and meal sales with board crush spreads, plant scheduling for crush rate, refinery capacity and biodiesel feedstock demand, meal and oil sales contracts with delivery windows and quality specifications, logistics across truck, rail and barge with freight cost and destination optimization, storage capacity and carry decisions holding inventory when the market pays for storage, quality issues including moisture, damage and foreign material with discount schedules, sustainability and traceability programs for certified crop streams

domain_name: oilseed-crush-origination
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine        # cash/basis/deferred pricing, crush margin, quality discount schedules
  secondary_archetype: quota_allocation    # elevator storage, plant crush capacity, lane capacity, feedstock quota
  complexity_layers:
    - optimistic_concurrency               # OCC on OriginationContract.version and CrushRun.version
    - dual_variant_calculation             # provisional vs final farmer settlement; planned vs realized crush margin
    - cascading_side_effects               # ticket apply -> storage lot -> elevator gate; clock sweep -> default -> buyer suspension
    - rate_threshold_triggers              # discount-schedule breakpoints, carry signal at zero, capacity gates, claim-count suspension
  entity_topology: flat                    # peer entities joined by foreign keys; no nested ownership in URLs
  state_machine_shape: parallel            # OriginationContract carries independent pricing_status x fulfillment_status;
                                           # CrushRun carries a SCHEDULED->PLANNED revert cycle; ProductSalesContract branches
  relationship_patterns:
    - one_to_many                          # Farmer->contracts, Elevator->tickets, Plant->runs, Buyer->sales contracts
    - cross_aggregate                      # tickets pin elevator discount schedules; shipments draw storage lots FIFO; runs consume plant inventory
  role_model: segregation_of_duties        # CrushTrader enters hedges; a *different* RiskManager user must confirm them
  consistency_model: immediate             # every mutation is visible in the same request's response and subsequent reads

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — all parents null, FK-linked)
# common_fields: true  => id (UUID, no prefix), created_at, updated_at, version
# common_fields: false => id, created_at only (append-only market observations)
# =============================================================================
entities:
  - name: Farmer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Farmer or farm-operation legal name" }
      - { name: county, type: string, source: input, description: "County of the home farm operation" }

  - name: Elevator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Elevator site name" }
      - { name: region, type: string, source: input, description: "Geographic region label" }
      - { name: storage_capacity_bushels, type: number, source: input, description: "Physical storage capacity in bushels; > 0" }
      - { name: active_discount_schedule_id, type: string, source: input, description: "FK -> QualityDiscountSchedule.id; must reference a schedule already in PUBLISHED state at elevator creation (ERR_SCHEDULE_NOT_PUBLISHED otherwise); pinned for the elevator's lifetime — every ticket applied at this elevator grades against this exact schedule version" }
      - { name: stored_bushels, type: number, source: computed, default: 0, description: "Read-only sum of current_bushels over all StoragePositions at this elevator; recomputed on every ticket apply, shipment booking, shipment cancellation" }
      - { name: certified_stored_bushels, type: number, source: computed, default: 0, description: "Read-only sum of current_bushels over StoragePositions at this elevator whose program_id is non-null (certified crop stream inventory)" }
      - { name: receiving_open, type: boolean, source: computed, default: true, description: "Read-only receiving gate: false iff stored_bushels >= storage_capacity_bushels; re-derived on every stored_bushels mutation; new delivery tickets are rejected with ERR_ELEVATOR_AT_CAPACITY when false" }

  - name: QualityDiscountSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Schedule name" }
      - { name: moisture_base_pct, type: number, source: input, description: "Moisture percentage at or below which no shrink/discount applies (e.g. 13.0)" }
      - { name: moisture_shrink_pct_per_point, type: number, source: input, description: "Weight shrink percent of gross bushels per moisture point above base" }
      - { name: moisture_discount_cents_per_point, type: integer, source: input, description: "Cents per bushel discount per moisture point above base" }
      - { name: damage_free_pct, type: number, source: input, description: "Damage percentage allowed free of discount" }
      - { name: damage_discount_cents_per_point, type: integer, source: input, description: "Cents per bushel per damage point above damage_free_pct" }
      - { name: fm_free_pct, type: number, source: input, description: "Foreign-material percentage allowed free of discount" }
      - { name: fm_discount_cents_per_point, type: integer, source: input, description: "Cents per bushel per foreign-material point above fm_free_pct" }
      - { name: reject_moisture_pct, type: number, source: input, description: "Moisture strictly above this rejects the ticket outright at apply time" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED (terminal); only PUBLISHED schedules may be pinned to an elevator" }

  - name: SustainabilityProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Certified crop stream program name" }
      - { name: cert_standard, type: enum, source: input, description: "ISCC | REGEN | ORGANIC" }
      - { name: premium_cents_per_bushel, type: integer, source: input, description: "Premium paid per net bushel on certified delivery tickets; >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> CLOSED (terminal); closed programs reject new origination contracts (ERR_PROGRAM_CLOSED)" }

  - name: MarketQuote
    parent: null
    common_fields: false
    fields:
      - { name: commodity, type: enum, source: input, description: "BEAN | OIL | MEAL" }
      - { name: quote_month, type: string, source: input, description: "Futures contract month, format YYYY-MM (e.g. 2026-11)" }
      - { name: price_cents, type: integer, source: input, description: "Futures price: cents per bushel for BEAN, cents per pound for OIL and MEAL; may be negative" }
      - { name: quote_date, type: datetime, source: input, description: "UTC datetime the quote is effective as-of; the as-of selector picks the quote with max quote_date <= current logical clock, tie broken by max created_at" }

  - name: CrushPlant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: daily_crush_capacity_bushels, type: integer, source: input, description: "Maximum bushels crushed per calendar day; > 0" }
      - { name: daily_refinery_capacity_lbs, type: integer, source: input, description: "Maximum pounds of oil refined per day; > 0" }
      - { name: biodiesel_feedstock_share_pct, type: number, source: input, description: "Percent of refinery capacity committed to biodiesel feedstock demand; 0..100" }
      - { name: bean_inventory_bushels, type: number, source: computed, default: 0, description: "Read-only bushels physically at the plant; += shipment bushels on Shipment DELIVERED, -= planned_bushels on CrushRun start" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | MAINTENANCE; client may create a plant directly in MAINTENANCE; only ACTIVE plants accept crush-run scheduling" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Meal/oil customer company name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> SUSPENDED; auto-suspends when open_claims_count reaches BUYER_SUSPEND_CLAIM_THRESHOLD (3) via the clock sweep" }
      - { name: open_claims_count, type: integer, source: computed, default: 0, description: "Read-only count of this buyer's ProductSalesContracts in DEFAULTED state; incremented by the clock sweep on each default; crossing to >= 3 flips status to SUSPENDED" }

  - name: OriginationContract
    parent: null
    common_fields: true
    fields:
      - { name: farmer_id, type: string, source: input, description: "FK -> Farmer.id; the grower counterparty" }
      - { name: elevator_id, type: string, source: input, description: "FK -> Elevator.id; delivery destination elevator" }
      - { name: program_id, type: string, source: input, description: "FK -> SustainabilityProgram.id; optional certified crop stream enrollment; null for conventional bushels" }
      - { name: contract_type, type: enum, source: input, description: "CASH | BASIS | DEFERRED" }
      - { name: quantity_bushels, type: number, source: input, description: "Total contracted bushels; > 0, 3-decimal precision" }
      - { name: cash_price_cents_per_bushel, type: integer, source: input, description: "Flat cash price; REQUIRED iff contract_type == CASH, forbidden otherwise (ERR_INVALID_REQUEST)" }
      - { name: basis_cents_per_bushel, type: integer, source: input, description: "Locked basis vs futures; REQUIRED iff contract_type == BASIS, forbidden otherwise; may be negative" }
      - { name: futures_month, type: string, source: input, description: "YYYY-MM futures month used for pricing elections; REQUIRED iff contract_type IN {BASIS, DEFERRED}" }
      - { name: pricing_deadline, type: datetime, source: input, description: "REQUIRED iff contract_type == DEFERRED; the clock sweep force-prices all unpriced bushels once pricing_deadline < current logical clock" }
      - { name: storage_rate_cents_per_bushel_day, type: integer, source: input, description: "REQUIRED iff contract_type == DEFERRED; daily service charge per unpriced delivered bushel; >= 0" }
      - { name: delivered_bushels, type: number, source: computed, default: 0, description: "Read-only sum of net_bushels over APPLIED tickets on this contract" }
      - { name: priced_bushels, type: number, source: computed, default: 0, description: "Read-only cumulative bushels priced by elections (or quantity_bushels at creation for CASH)" }
      - { name: priced_value_cents, type: integer, source: computed, default: 0, description: "Read-only sum over pricing elections of bushels x unit_price_cents (exact integer; CASH seeds one election at creation)" }
      - { name: elections, type: array, source: system, default: [], description: "Append-only log of pricing elections: { bushels, unit_price_cents, elected_at, origin: CLIENT|FORCED }; consumed FIFO by settlement" }
      - { name: accrued_storage_cents, type: integer, source: computed, default: 0, description: "Read-only DP service-charge accrual finalized progressively at each pricing event; see calculations.dp_storage_accrual" }
      - { name: unpriced_pool_bushels, type: number, source: computed, default: 0, description: "Read-only delivered-but-unpriced bushels currently accruing storage charges" }
      - { name: last_accrual_date, type: datetime, source: computed, description: "UTC date the unpriced pool last changed; null while pool is empty; accrual day-count anchors here" }
      - { name: estimated_settlement_cents, type: integer, source: computed, description: "Provisional settlement estimate (calculations.contract_settlement provisional variant); null while a required as-of futures quote is missing for unpriced bushels; refreshed on every ticket apply and pricing election" }
      - { name: settlement_line_total_cents, type: integer, source: computed, description: "Final sum of per-ticket settlement lines; set at settle, null before" }
      - { name: settlement_accrual_deduction_cents, type: integer, source: computed, description: "Accrued storage deducted at settle; equals accrued_storage_cents at that moment" }
      - { name: settlement_net_payable_cents, type: integer, source: computed, description: "settlement_line_total_cents - settlement_accrual_deduction_cents; set at settle" }
      - { name: pricing_status, type: enum, source: system, description: "UNPRICED | PARTIALLY_PRICED | PRICED; independent parallel dimension; CASH starts PRICED, BASIS/DEFERRED start UNPRICED; PRICED iff priced_bushels == quantity_bushels" }
      - { name: fulfillment_status, type: enum, source: system, default: OPEN, description: "OPEN -> DELIVERING -> DELIVERED -> SETTLED (terminal); independent parallel dimension driven by ticket applies and settle" }

  - name: DeliveryTicket
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> OriginationContract.id; the contract this delivery fulfills" }
      - { name: elevator_id, type: string, source: system, description: "FK -> Elevator.id; copied from the contract at creation" }
      - { name: program_id, type: string, source: system, description: "FK -> SustainabilityProgram.id; copied from the contract at creation (null for conventional)" }
      - { name: gross_bushels, type: number, source: input, description: "Scale-ticket gross bushels; > 0" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture percent; >= 0" }
      - { name: damage_pct, type: number, source: input, description: "Measured damage percent; >= 0" }
      - { name: foreign_material_pct, type: number, source: input, description: "Measured foreign material percent; >= 0" }
      - { name: schedule_id, type: string, source: system, description: "FK -> QualityDiscountSchedule.id; pinned at apply time from elevator.active_discount_schedule_id (version-pinning on grading)" }
      - { name: shrink_bushels, type: number, source: computed, description: "Weight shrink computed at apply; 3 decimals; null until applied" }
      - { name: net_bushels, type: number, source: computed, description: "gross_bushels - shrink_bushels, 3 decimals; null until applied" }
      - { name: discount_cents_per_bushel, type: integer, source: computed, description: "Combined moisture+damage+FM discount per net bushel; null until applied" }
      - { name: premium_cents_per_bushel, type: integer, source: computed, description: "Certified premium per net bushel from the contract's program (0 when program_id is null); null until applied" }
      - { name: applied_date, type: datetime, source: system, description: "Logical-clock timestamp of the apply; anchors DP accrual; null until applied" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED -> APPLIED | REJECTED (both terminal); apply computes grading and either applies to the contract or rejects on moisture" }

  - name: StoragePosition
    parent: null
    common_fields: true
    fields:
      - { name: elevator_id, type: string, source: system, description: "FK -> Elevator.id; set from the applied ticket" }
      - { name: source_ticket_id, type: string, source: system, description: "FK -> DeliveryTicket.id; the ticket whose apply created this lot" }
      - { name: program_id, type: string, source: system, description: "FK -> SustainabilityProgram.id; non-null marks a certified lot that only certified shipments may draw" }
      - { name: bushels_initial, type: number, source: system, description: "net_bushels of the source ticket at creation" }
      - { name: current_bushels, type: number, source: computed, description: "Remaining bushels; decremented by shipment draws (FIFO), restored exactly on shipment cancellation" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | DEPLETED; DEPLETED iff current_bushels == 0; returns to OPEN if a cancellation restores bushels" }

  - name: FreightLane
    parent: null
    common_fields: true
    fields:
      - { name: origin_elevator_id, type: string, source: input, description: "FK -> Elevator.id; bean-haul origin" }
      - { name: destination_plant_id, type: string, source: input, description: "FK -> CrushPlant.id; bean-haul destination" }
      - { name: mode, type: enum, source: input, description: "TRUCK | RAIL | BARGE; BARGE lanes use half-open interval occupancy, TRUCK/RAIL use per-departure-date aggregate capacity" }
      - { name: freight_cents_per_bushel, type: integer, source: input, description: "Freight rate; >= 0" }
      - { name: transit_days, type: integer, source: input, description: "Calendar days from departure to arrival; >= 0" }
      - { name: daily_capacity_bushels, type: integer, source: input, description: "Per-departure-date capacity for TRUCK/RAIL lanes; > 0; ignored for BARGE (interval semantics instead)" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: lane_id, type: string, source: input, description: "FK -> FreightLane.id" }
      - { name: bushels, type: number, source: input, description: "Bushels to move; > 0" }
      - { name: departure_date, type: datetime, source: input, description: "UTC departure; must be >= current logical clock date" }
      - { name: certified_program_id, type: string, source: input, description: "FK -> SustainabilityProgram.id; optional — when present the shipment may draw ONLY storage lots of that program (chain of custody); when absent it may draw ONLY non-certified lots" }
      - { name: arrival_date, type: datetime, source: computed, description: "departure_date + lane.transit_days (calendar days)" }
      - { name: freight_cost_cents, type: integer, source: computed, description: "bushels x lane.freight_cents_per_bushel (exact integer product, 3-decimal bushels may yield fractional cents -> round_half_up to integer)" }
      - { name: draws, type: array, source: system, default: [], description: "Append-only lot-draw log: [{ position_id, bushels }] in draw order (positions by created_at ASC); reversed exactly on cancellation" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED -> DELIVERED | CANCELLED; cancellation allowed only from BOOKED and restores drawn lots" }

  - name: CrushRun
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> CrushPlant.id" }
      - { name: run_date, type: datetime, source: input, description: "Calendar day of the crush campaign (UTC midnight canonical)" }
      - { name: planned_bushels, type: integer, source: input, description: "Bushels to crush; > 0" }
      - { name: futures_month, type: string, source: input, description: "YYYY-MM futures month whose BEAN/OIL/MEAL quotes price the margin" }
      - { name: expected_oil_lbs, type: integer, source: computed, description: "planned_bushels x OIL_YIELD_LBS_PER_BUSHEL (11)" }
      - { name: expected_meal_lbs, type: integer, source: computed, description: "planned_bushels x MEAL_YIELD_LBS_PER_BUSHEL (47)" }
      - { name: spread_cents_per_bushel, type: number, source: computed, description: "Board crush spread locked at creation from as-of quotes: oil x 11 + meal x 47 - bean; 2 decimals round_half_up" }
      - { name: planned_margin_cents, type: integer, source: computed, description: "round_half_up(planned_bushels x spread_cents_per_bushel); the PLANNED variant of crush margin" }
      - { name: realized_margin_cents, type: integer, source: computed, description: "Recomputed at COMPLETE from then-current as-of quotes (the REALIZED variant); null until COMPLETE" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> SCHEDULED -> RUNNING -> COMPLETE (terminal); SCHEDULED -> PLANNED revert allowed; PLANNED|SCHEDULED -> CANCELLED (terminal)" }

  - name: BoardCrushPosition
    parent: null
    common_fields: true
    fields:
      - { name: futures_month, type: string, source: input, description: "YYYY-MM futures month for all three legs" }
      - { name: bean_lots_long, type: integer, source: input, description: "Long bean futures contracts; >= 1" }
      - { name: oil_lots_short, type: integer, source: input, description: "Short oil futures contracts; >= 0" }
      - { name: meal_lots_short, type: integer, source: input, description: "Short meal futures contracts; >= 0" }
      - { name: expiry_date, type: datetime, source: input, description: "Position expiry; the clock sweep moves ENTERED/CONFIRMED positions to EXPIRED once expiry_date < current logical clock" }
      - { name: locked_spread_cents_per_bushel, type: number, source: computed, description: "Board crush spread at entry from as-of quotes; 2 decimals round_half_up" }
      - { name: locked_margin_cents, type: integer, source: computed, description: "round_half_up(locked_spread_cents_per_bushel x bean_lots_long x BEAN_CONTRACT_BUSHELS (5000))" }
      - { name: realized_pnl_cents, type: integer, source: computed, description: "At OFFSET: round_half_up((current_spread - locked_spread) x bean_lots_long x 5000); null until OFFSET" }
      - { name: entered_by_user_id, type: string, source: system, description: "X-User-ID of the CrushTrader who entered the position" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of the confirming RiskManager; MUST differ from entered_by_user_id (segregation of duties)" }
      - { name: status, type: enum, source: system, default: ENTERED, description: "ENTERED -> CONFIRMED -> OFFSET (terminal); ENTERED|CONFIRMED -> EXPIRED (terminal) via clock sweep" }

  - name: ProductSalesContract
    parent: null
    common_fields: true
    fields:
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; buyer must be ACTIVE at creation (ERR_BUYER_NOT_ACTIVE)" }
      - { name: plant_id, type: string, source: input, description: "FK -> CrushPlant.id; origin plant" }
      - { name: product, type: enum, source: input, description: "SOY_MEAL | SOY_OIL | BIODIESEL_FEEDSTOCK" }
      - { name: quantity_lbs, type: integer, source: input, description: "Total pounds to deliver; > 0" }
      - { name: price_cents_per_lb, type: integer, source: input, description: "Sale price; > 0" }
      - { name: delivery_window_start, type: datetime, source: input, description: "First permitted delivery datetime (inclusive)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Last permitted delivery datetime (inclusive); must be > start and span <= MAX_DELIVERY_WINDOW_DAYS (62)" }
      - { name: min_protein_pct, type: number, source: input, description: "Minimum protein spec; REQUIRED iff product == SOY_MEAL, forbidden otherwise" }
      - { name: max_ffa_pct, type: number, source: input, description: "Maximum free-fatty-acid spec; REQUIRED iff product IN {SOY_OIL, BIODIESEL_FEEDSTOCK}, forbidden otherwise" }
      - { name: delivered_lbs, type: integer, source: computed, default: 0, description: "Cumulative accepted pounds" }
      - { name: deliveries, type: array, source: system, default: [], description: "Append-only delivery log: [{ delivery_date, quantity_lbs, actual_protein_pct, actual_ffa_pct, recorded_at }]" }
      - { name: claim_cents, type: integer, source: computed, description: "Shortfall claim set when the clock sweep defaults the contract: round_half_up((quantity_lbs - delivered_lbs) x price_cents_per_lb x DEFAULT_CLAIM_RATE (0.10)); null otherwise" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> DELIVERING -> FULFILLED (terminal); OPEN|DELIVERING -> DEFAULTED (terminal) via clock sweep when window_end < clock and delivered_lbs < quantity_lbs" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OriginationContract
    dimension: pricing_status
    initial_state: UNPRICED   # CASH contracts are born PRICED (creation seeds one election of quantity_bushels at cash_price_cents_per_bushel)
    terminal_states: [PRICED]
    transitions:
      - from: UNPRICED
        to: PARTIALLY_PRICED
        trigger: "POST /api/origination-contracts/{id}/pricing-elections with 0 < bushels < remaining unpriced"
        actor: Farmer | OriginationMerchandiser
        preconditions:
          - "contract_type IN {BASIS, DEFERRED} and pricing_status != PRICED (ERR_CONTRACT_NOT_PRICABLE)"
          - "OCC: expected_contract_version == contract.version (ERR_STALE_CONTRACT_VERSION)"
          - "priced_bushels + bushels <= quantity_bushels (ERR_PRICING_EXCEEDS_QUANTITY)"
          - "DEFERRED: current logical clock <= pricing_deadline (otherwise the sweep has already force-priced the contract)"
          - "as-of futures quote exists for (BEAN, futures_month) (ERR_NO_MARKET_QUOTE)"
        side_effects:
          - "unit_price_cents = futures_asof; for BASIS: basis_cents_per_bushel + futures_asof; for DEFERRED: futures_asof"
          - "append election { bushels, unit_price_cents, elected_at: now, origin: CLIENT } to elections"
          - "priced_bushels += bushels; priced_value_cents += bushels x unit_price_cents"
          - "DEFERRED accrual: accrued_storage_cents += storage_rate x unpriced_pool_bushels x days(last_accrual_date -> now); unpriced_pool_bushels -= bushels (floor 0); last_accrual_date = now"
          - "recompute estimated_settlement_cents (provisional variant)"
          - "increments OriginationContract.version by 1"
      - from: PARTIALLY_PRICED
        to: PARTIALLY_PRICED
        trigger: "POST /api/origination-contracts/{id}/pricing-elections with bushels still below remaining"
        actor: Farmer | OriginationMerchandiser
        preconditions: ["same as UNPRICED -> PARTIALLY_PRICED"]
        side_effects: ["same side effects as UNPRICED -> PARTIALLY_PRICED"]
      - from: UNPRICED
        to: PRICED
        trigger: "POST /api/origination-contracts/{id}/pricing-elections with bushels == remaining unpriced, OR clock-sweep forced pricing of a DEFERRED contract whose pricing_deadline < new clock"
        actor: Farmer | OriginationMerchandiser | system
        preconditions:
          - "client path: same as UNPRICED -> PARTIALLY_PRICED with exact-remaining bushels"
          - "sweep path: contract_type == DEFERRED, pricing_status != PRICED, pricing_deadline < new clock; forced election uses the futures quote as-of the DEADLINE date (ERR_NO_MARKET_QUOTE if none -> contract left unpriced, re-attempted on the next sweep)"
        side_effects:
          - "same election side effects; sweep elections carry origin: FORCED and elected_at = pricing_deadline"
          - "pricing_status becomes PRICED; accrual stops — final accrual leg runs last_accrual_date -> pricing_deadline"
      - from: PARTIALLY_PRICED
        to: PRICED
        trigger: "same two paths as UNPRICED -> PRICED"
        actor: Farmer | OriginationMerchandiser | system
        preconditions: ["same as UNPRICED -> PRICED"]
        side_effects: ["same as UNPRICED -> PRICED"]

  - entity: OriginationContract
    dimension: fulfillment_status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: DELIVERING
        trigger: "system (automatic when a ticket apply leaves 0 < delivered_bushels < quantity_bushels)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERING
        to: DELIVERING
        trigger: "system (automatic on each further apply that keeps delivered_bushels < quantity_bushels)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DELIVERED
        trigger: "system (automatic when the first applied ticket exactly fills the contract: delivered_bushels == quantity_bushels)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERING
        to: DELIVERED
        trigger: "system (automatic when an apply makes delivered_bushels == quantity_bushels)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: SETTLED
        trigger: "POST /api/origination-contracts/{id}/settle"
        actor: OriginationMerchandiser
        preconditions:
          - "fulfillment_status == DELIVERED (ERR_CONTRACT_NOT_SETTLEABLE)"
          - "pricing_status == PRICED (cross-dimension gate; ERR_CONTRACT_NOT_SETTLEABLE) — since DELIVERED implies delivered == quantity and PRICED implies priced == quantity, settlement consumes both pools exactly"
        side_effects:
          - "calculations.contract_settlement FINAL variant: per-ticket FIFO lines over elections, round per line then sum -> settlement_line_total_cents"
          - "settlement_accrual_deduction_cents = accrued_storage_cents; settlement_net_payable_cents = line_total - accrual_deduction"
          - "increments OriginationContract.version by 1"

  - entity: DeliveryTicket
    initial_state: RECEIVED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: "POST /api/delivery-tickets/{id}/apply with moisture_pct <= pinned schedule.reject_moisture_pct"
        actor: OriginationMerchandiser
        preconditions:
          - "ticket status == RECEIVED (ERR_INVALID_STATE)"
          - "contract fulfillment_status IN {OPEN, DELIVERING} (ERR_INVALID_STATE) — cross-entity gate on OriginationContract"
          - "moisture_pct <= reject_moisture_pct of the elevator's pinned schedule (else the REJECTED branch instead)"
          - "contract.delivered_bushels + net_bushels <= contract.quantity_bushels (ERR_OVER_DELIVERY)"
          - "elevator.stored_bushels + net_bushels <= elevator.storage_capacity_bushels (ERR_ELEVATOR_AT_CAPACITY)"
        side_effects:
          - "pin schedule_id = elevator.active_discount_schedule_id; compute shrink_bushels, net_bushels, discount_cents_per_bushel, premium_cents_per_bushel (calculations.quality_grade_factors); set applied_date = now"
          - "HOP 1: OriginationContract.delivered_bushels += net_bushels; DEFERRED: unpriced_pool_bushels += net_bushels and last_accrual_date = applied_date if pool was empty"
          - "HOP 1b: contract fulfillment auto-transition (OPEN|DELIVERING -> DELIVERING|DELIVERED) caused by the delivered_bushels mutation"
          - "HOP 2: create StoragePosition { elevator_id, source_ticket_id: ticket.id, program_id: ticket.program_id, bushels_initial: net_bushels, current_bushels: net_bushels }"
          - "HOP 3: Elevator.stored_bushels += net_bushels (and certified_stored_bushels += net_bushels when program_id non-null), caused by the position creation"
          - "HOP 4: Elevator.receiving_open re-derived from the new stored_bushels (false iff stored >= capacity) — the gate flip blocks subsequent ticket creation"
          - "recompute contract.estimated_settlement_cents (provisional variant)"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /api/delivery-tickets/{id}/apply with moisture_pct > pinned schedule.reject_moisture_pct"
        actor: OriginationMerchandiser
        preconditions:
          - "ticket status == RECEIVED (ERR_INVALID_STATE)"
          - "contract fulfillment_status IN {OPEN, DELIVERING} (ERR_INVALID_STATE)"
        side_effects:
          - "pin schedule_id; compute grading fields for the record; NO contract, position, or elevator mutations — the apply returns 200 with status REJECTED (a business outcome, not a request error)"

  - entity: CrushRun
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /api/crush-runs/{id}/schedule"
        actor: PlantScheduler
        preconditions:
          - "run status == PLANNED (ERR_INVALID_STATE)"
          - "OCC: expected_run_version == run.version (ERR_STALE_RUN_VERSION)"
          - "plant.status == ACTIVE (ERR_PLANT_NOT_ACTIVE) — cross-entity gate on CrushPlant"
          - "run_date >= current logical clock date (ERR_RUN_DATE_IN_PAST)"
          - "sum of planned_bushels over this plant's runs in {SCHEDULED, RUNNING, COMPLETE} on run_date + planned_bushels <= plant.daily_crush_capacity_bushels (ERR_PLANT_CAPACITY_EXCEEDED) — aggregate-per-day interval semantics"
          - "planned_margin_cents >= 0 (ERR_NEGATIVE_CRUSH_MARGIN)"
        side_effects:
          - "increments CrushRun.version by 1"
      - from: SCHEDULED
        to: PLANNED
        trigger: "POST /api/crush-runs/{id}/transitions with to_status PLANNED (revert cycle: frees the day's aggregate capacity)"
        actor: PlantScheduler
        preconditions:
          - "run status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "increments CrushRun.version by 1"
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /api/crush-runs/{id}/transitions with to_status RUNNING"
        actor: PlantScheduler
        preconditions:
          - "run status == SCHEDULED (ERR_INVALID_STATE)"
          - "plant.bean_inventory_bushels >= planned_bushels (ERR_INSUFFICIENT_PLANT_INVENTORY)"
        side_effects:
          - "plant.bean_inventory_bushels -= planned_bushels (cross-entity ledger sync on CrushPlant)"
          - "increments CrushRun.version by 1"
      - from: RUNNING
        to: COMPLETE
        trigger: "POST /api/crush-runs/{id}/transitions with to_status COMPLETE"
        actor: PlantScheduler
        preconditions:
          - "run status == RUNNING (ERR_INVALID_STATE)"
          - "as-of BEAN/OIL/MEAL futures quotes exist for futures_month (ERR_NO_MARKET_QUOTE)"
        side_effects:
          - "recompute spread from current as-of quotes and set realized_margin_cents = round_half_up(planned_bushels x new_spread) — the REALIZED variant supersedes planned_margin_cents"
          - "increments CrushRun.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/crush-runs/{id}/transitions with to_status CANCELLED"
        actor: PlantScheduler
        preconditions: ["run status == PLANNED (ERR_INVALID_STATE)"]
        side_effects: ["increments CrushRun.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/crush-runs/{id}/transitions with to_status CANCELLED"
        actor: PlantScheduler
        preconditions: ["run status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["increments CrushRun.version by 1"]

  - entity: BoardCrushPosition
    initial_state: ENTERED
    terminal_states: [OFFSET, EXPIRED]
    transitions:
      - from: ENTERED
        to: CONFIRMED
        trigger: "POST /api/board-crush-positions/{id}/confirm"
        actor: RiskManager
        preconditions:
          - "position status == ENTERED (ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != entered_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "current logical clock <= expiry_date (else the sweep expires it first)"
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
          - "increments BoardCrushPosition.version by 1"
      - from: CONFIRMED
        to: OFFSET
        trigger: "POST /api/board-crush-positions/{id}/offset"
        actor: CrushTrader
        preconditions:
          - "position status == CONFIRMED (ERR_POSITION_NOT_CONFIRMED)"
          - "as-of BEAN/OIL/MEAL futures quotes exist for futures_month (ERR_NO_MARKET_QUOTE)"
        side_effects:
          - "realized_pnl_cents = round_half_up((current_spread - locked_spread_cents_per_bushel) x bean_lots_long x 5000)"
          - "increments BoardCrushPosition.version by 1"
      - from: ENTERED
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date < new logical clock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date < new logical clock)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductSalesContract
    initial_state: OPEN
    terminal_states: [FULFILLED, DEFAULTED]
    transitions:
      - from: OPEN
        to: DELIVERING
        trigger: "system (automatic when a delivery leaves 0 < delivered_lbs < quantity_lbs)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERING
        to: DELIVERING
        trigger: "system (automatic on each further accepted delivery below quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: FULFILLED
        trigger: "system (automatic when the first delivery exactly fills quantity_lbs)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERING
        to: FULFILLED
        trigger: "system (automatic when a delivery makes delivered_lbs == quantity_lbs)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DEFAULTED
        trigger: "system (clock sweep: delivery_window_end < new clock and delivered_lbs < quantity_lbs)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP 1: claim_cents = round_half_up((quantity_lbs - delivered_lbs) x price_cents_per_lb x 0.10)"
          - "HOP 2: Buyer.open_claims_count += 1 — mutation on Buyer caused by this contract's default"
          - "HOP 3: Buyer.status -> SUSPENDED when open_claims_count reaches BUYER_SUSPEND_CLAIM_THRESHOLD (3) — caused by the count mutation crossing the threshold"
      - from: DELIVERING
        to: DEFAULTED
        trigger: "system (clock sweep: delivery_window_end < new clock and delivered_lbs < quantity_lbs)"
        actor: system
        preconditions: []
        side_effects: ["same HOP 1-3 cascade as OPEN -> DEFAULTED"]

  - entity: QualityDiscountSchedule
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/quality-discount-schedules/{id}/publish"
        actor: PlatformAdmin
        preconditions: ["schedule status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: ["increments QualityDiscountSchedule.version by 1; schedule becomes pinnable to elevators"]

  - entity: SustainabilityProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/sustainability-programs/{id}/close"
        actor: SustainabilityAuditor
        preconditions: ["program status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["increments SustainabilityProgram.version by 1; subsequent origination contracts naming this program are rejected ERR_PROGRAM_CLOSED"]

  - entity: Shipment
    initial_state: BOOKED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: BOOKED
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment status == BOOKED (ERR_INVALID_STATE)"
          - "current logical clock >= arrival_date (ERR_SHIPMENT_NOT_ARRIVED)"
        side_effects:
          - "CrushPlant.bean_inventory_bushels += bushels (cross-entity ledger sync; bushel mass conserved: elevator draw happened at booking)"
          - "increments Shipment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["shipment status == BOOKED (ERR_INVALID_STATE)"]
        side_effects:
          - "compensation: for each draws[] entry in reverse draw order, position.current_bushels += drawn bushels and position status DEPLETED -> OPEN if it leaves 0"
          - "Elevator.stored_bushels += bushels (and certified_stored_bushels likewise for certified shipments); receiving_open re-derived"
          - "frees the lane occupancy (barge interval / daily capacity) for rebooking"
          - "increments Shipment.version by 1"

  - entity: Buyer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (clock sweep: open_claims_count reaches BUYER_SUSPEND_CLAIM_THRESHOLD = 3)"
        actor: system
        preconditions: []
        side_effects:
          - "subsequent POST /api/product-sales-contracts naming this buyer is rejected ERR_BUYER_NOT_ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: contract-pricing-stale-version
    parent_entity: OriginationContract
    write_endpoint: "POST /api/origination-contracts/{id}/pricing-elections"
    occ_field: expected_contract_version
    description: |
      A pricing election carrying an expected_contract_version that no longer
      matches the contract's current version is rejected: another election (or
      the forced-pricing sweep) has advanced the contract since the client last
      observed it, so the client's view of priced_bushels is stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: run-schedule-stale-version
    parent_entity: CrushRun
    write_endpoint: "POST /api/crush-runs/{id}/schedule"
    occ_field: expected_run_version
    description: |
      Scheduling a crush run carrying an expected_run_version that no longer
      matches the run's current version is rejected: another schedule/unschedule
      cycle has advanced the run since the client last observed it, so the
      client's view of the day's capacity consumption is stale.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quality_grade_factors
    trigger: "POST /api/delivery-tickets/{id}/apply (both APPLIED and REJECTED branches compute the factors)"
    algorithm: threshold
    formula: |
      S = the elevator's pinned QualityDiscountSchedule (ticket.schedule_id)
      excess_moisture = max(0, moisture_pct - S.moisture_base_pct)
      excess_damage   = max(0, damage_pct - S.damage_free_pct)
      excess_fm       = max(0, foreign_material_pct - S.fm_free_pct)
      shrink_bushels  = round_half_up(gross_bushels x excess_moisture x S.moisture_shrink_pct_per_point / 100, 3)
      net_bushels     = round_half_up(gross_bushels - shrink_bushels, 3)
      discount_cents_per_bushel = round_half_up(
          excess_moisture x S.moisture_discount_cents_per_point
        + excess_damage   x S.damage_discount_cents_per_point
        + excess_fm       x S.fm_discount_cents_per_point, 0)
      premium_cents_per_bushel = program.premium_cents_per_bushel if contract.program_id else 0
    input_set: "the ticket being applied; the pinned schedule on the contract's elevator; the contract's SustainabilityProgram if any"
    constants:
      DECIMALS_BUSHELS: 3
    precision: "bushels 3 decimals round_half_up; discount integer cents round_half_up"
    variants: []

  - name: dp_storage_accrual
    trigger: "on every pricing election (client or forced) and at settlement read of a DEFERRED contract"
    algorithm: chronological
    formula: |
      days(d1, d2) = whole UTC calendar days from d1 to d2 (date parts only; always >= 0 here)
      On a pricing event at time T pricing K bushels:
        if unpriced_pool_bushels > 0 and last_accrual_date is set:
          accrued_storage_cents += storage_rate_cents_per_bushel_day x unpriced_pool_bushels x days(last_accrual_date, T)
        unpriced_pool_bushels = max(0, unpriced_pool_bushels - K)
        last_accrual_date = T if unpriced_pool_bushels > 0 else null
      On a ticket apply at time T to a DEFERRED contract:
        if unpriced_pool_bushels > 0: accrue pool through T first (same formula), then
        unpriced_pool_bushels += ticket.net_bushels; last_accrual_date = T
      Forced pricing by the sweep anchors T = pricing_deadline.
    input_set: "DEFERRED contracts only; the unpriced delivered pool and its last_accrual_date"
    constants: {}
    precision: "integer cents; day count is calendar-date based (events at T00:00:00Z yield exact integers)"
    variants: []

  - name: contract_settlement
    trigger: "estimated_settlement_cents recompute on every apply / pricing election (PROVISIONAL variant); POST /api/origination-contracts/{id}/settle (FINAL variant)"
    algorithm: chronological
    formula: |
      FIFO allocation: applied tickets in applied_date ASC (tie: created_at ASC) consume elections in election
      order (elected_at ASC, origin CLIENT before FORCED at equal timestamps never occurs — forced elections use
      elected_at = pricing_deadline and client elections at exactly that instant are allowed; tie-break: elections
      are consumed in the order they appear in the elections[] array, which is append order).
      unit_price(ticket) may split across two elections E1 (remaining r1) and E2: the ticket contributes
      sub-lines round_half_up(net1 x (E1.unit - discount + premium), 0) + round_half_up(net2 x (E2.unit - discount + premium), 0)
      with net1 + net2 = ticket.net_bushels, net1 = r1.
      PINNED ROUNDING ORDER: each per-ticket (or per-election-split sub-line) line is rounded to integer cents
      FIRST, then lines are summed. The alternative order (sum exact values, then round once) is NOT used and
      produces different cents on fractional nets.
      FINAL:   settlement_line_total_cents = SUM of pinned lines over all APPLIED tickets
               settlement_accrual_deduction_cents = accrued_storage_cents
               settlement_net_payable_cents = line_total - accrual_deduction
      PROVISIONAL: same line math over tickets applied so far; a ticket's bushels not yet covered by any election
      are valued at the CURRENT as-of futures-derived unit price (BASIS: basis + futures_asof; DEFERRED:
      futures_asof; CASH: fully covered at creation) and accrual is taken as accrued_storage_cents plus the
      pending leg through 'now'; null when a required futures quote is missing.
    input_set: "APPLIED tickets of the contract only (REJECTED excluded); elections[] of the contract; as-of BEAN futures quote for futures_month (provisional, when unpriced bushels remain)"
    constants: {}
    precision: "integer cents round_half_up per line, then exact integer sum"
    variants:
      - name: provisional
        when: "estimated_settlement_cents on a non-SETTLED contract"
        difference: "unpriced bushels valued at the CURRENT as-of futures quote; accrual includes the pending leg through now; value moves with the market"
      - name: final
        when: "POST .../settle"
        difference: "every bushel valued at its actual election price; accrual frozen at final pricing; writes settlement_* fields"

  - name: crush_margin
    trigger: "POST /api/crush-runs (PLANNED variant at creation); POST /api/crush-runs/{id}/transitions to COMPLETE (REALIZED variant); also reused verbatim by board_crush_spread"
    algorithm: aggregation
    formula: |
      spread_cents_per_bushel = round_half_up(oil_price_cents x OIL_YIELD_LBS_PER_BUSHEL
                                            + meal_price_cents x MEAL_YIELD_LBS_PER_BUSHEL
                                            - bean_price_cents, 2)
      margin_cents = round_half_up(planned_bushels x spread_cents_per_bushel, 0)
      All three quotes are the as-of selector result for (commodity, futures_month) at evaluation time.
    input_set: "as-of MarketQuotes for BEAN, OIL, MEAL in the run's futures_month"
    constants:
      OIL_YIELD_LBS_PER_BUSHEL: 11
      MEAL_YIELD_LBS_PER_BUSHEL: 47
    precision: "spread 2 decimals round_half_up; margin integer cents round_half_up"
    variants:
      - name: planned
        when: "crush run creation"
        difference: "quotes as-of creation time -> spread_cents_per_bushel and planned_margin_cents"
      - name: realized
        when: "transition to COMPLETE"
        difference: "same formula, quotes as-of completion time -> realized_margin_cents; diverges from planned whenever the board moved in between"

  - name: board_crush_spread
    trigger: "POST /api/board-crush-positions (lock at entry); POST /api/board-crush-positions/{id}/offset (realize P&L)"
    algorithm: aggregation
    formula: |
      locked_spread_cents_per_bushel = crush_margin spread formula at entry (same constants)
      locked_margin_cents = round_half_up(locked_spread_cents_per_bushel x bean_lots_long x BEAN_CONTRACT_BUSHELS, 0)
      At offset: current_spread = same formula over quotes as-of now
      realized_pnl_cents = round_half_up((current_spread - locked_spread_cents_per_bushel) x bean_lots_long x BEAN_CONTRACT_BUSHELS, 0)
    input_set: "as-of MarketQuotes for BEAN, OIL, MEAL in the position's futures_month"
    constants:
      BEAN_CONTRACT_BUSHELS: 5000
      OIL_YIELD_LBS_PER_BUSHEL: 11
      MEAL_YIELD_LBS_PER_BUSHEL: 47
    precision: "spread 2 decimals round_half_up; money integer cents round_half_up"
    variants: []

  - name: carry_assessment
    trigger: "GET /api/elevators/{id}/carry-assessment?nearby_month&deferred_month"
    algorithm: threshold
    formula: |
      months_between(m1, m2) = (year(m2)-year(m1)) x 12 + month(m2) - month(m1); must be > 0 (ERR_INVALID_REQUEST)
      storage_cost_cents_per_bushel = CARRY_STORAGE_CENTS_PER_BUSHEL_MONTH x months_between
      signal_cents_per_bushel = (deferred_bean_futures - nearby_bean_futures) - storage_cost_cents_per_bushel
      decision = CARRY iff signal_cents_per_bushel > 0, else FLAT   (signal == 0 exactly is FLAT — the market
      must pay strictly more than the cost of storage)
    input_set: "as-of BEAN futures quotes for nearby_month and deferred_month"
    constants:
      CARRY_STORAGE_CENTS_PER_BUSHEL_MONTH: 5
    precision: "integer cents"
    variants: []

  - name: destination_ranking
    trigger: "POST /api/shipment-routing-quotes"
    algorithm: weighted_scoring
    formula: |
      candidate set: all FreightLanes with origin_elevator_id == request origin whose destination plant
      status == ACTIVE and (mode == BARGE or daily_capacity_bushels >= request bushels).
      ranking: freight_cents_per_bushel ASC, then transit_days ASC, then lane.created_at ASC.
      (No random field participates; ids never break ties.)
      Empty candidate set -> ERR_NO_ROUTE_AVAILABLE.
    input_set: "FreightLanes of the origin elevator; CrushPlant.status of each destination"
    constants: {}
    precision: "ranking only; no arithmetic"
    variants: []

  - name: default_claim_and_suspension
    trigger: "POST /api/_clock/set_current_utc sweep over ProductSalesContracts whose delivery_window_end < new clock with status IN {OPEN, DELIVERING} and delivered_lbs < quantity_lbs"
    algorithm: aggregation
    formula: |
      claim_cents = round_half_up((quantity_lbs - delivered_lbs) x price_cents_per_lb x DEFAULT_CLAIM_RATE, 0)
      then Buyer.open_claims_count += 1 per defaulted contract;
      Buyer.status -> SUSPENDED when open_claims_count >= BUYER_SUSPEND_CLAIM_THRESHOLD.
      Sweep order: contracts ordered by delivery_window_end ASC, tie-break created_at ASC (deterministic).
    input_set: "OPEN/DELIVERING ProductSalesContracts past window end"
    constants:
      DEFAULT_CLAIM_RATE: 0.10
      BUYER_SUSPEND_CLAIM_THRESHOLD: 3
    precision: "integer cents round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; missing or unknown -> ERR_UNAUTHENTICATED"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; entity-backed roles (Farmer, CommercialBuyer) must also own the target resource (X-User-ID == contract.farmer_id / sales_contract.buyer_id) -> ERR_FORBIDDEN"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id resolves to an existing entity, evaluated left-to-right along the path -> the entity-specific 404: ERR_CONTRACT_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_POSITION_NOT_FOUND, ERR_LANE_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_PLANT_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_BUYER_NOT_FOUND, ERR_SALES_CONTRACT_NOT_FOUND, ERR_ELEVATOR_NOT_FOUND, ERR_SCHEDULE_NOT_FOUND, ERR_PROGRAM_NOT_FOUND"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Every body-supplied FK resolves -> the same 404 family: farmer_id -> ERR_FARMER_NOT_FOUND, elevator_id -> ERR_ELEVATOR_NOT_FOUND, program_id / certified_program_id -> ERR_PROGRAM_NOT_FOUND, active_discount_schedule_id -> ERR_SCHEDULE_NOT_FOUND, contract_id -> ERR_CONTRACT_NOT_FOUND, lane_id -> ERR_LANE_NOT_FOUND, buyer_id -> ERR_BUYER_NOT_FOUND, plant_id -> ERR_PLANT_NOT_FOUND"
    error_id: ERR_FARMER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking body FKs"
  - priority: 5
    category: existence
    check: "OCC: expected_<parent>_version matches the parent's current version -> ERR_STALE_CONTRACT_VERSION / ERR_STALE_RUN_VERSION (evaluated before state checks: a stale write never sees state)"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /api/origination-contracts/{id}/pricing-elections, POST /api/crush-runs/{id}/schedule"
  - priority: 6
    category: state
    check: "Target entity is in a state that permits the transition (per §1.2 preconditions): ticket RECEIVED; contract not PRICED for elections; contract DELIVERED+PRICED for settle; run PLANNED for schedule; position ENTERED for confirm / CONFIRMED for offset; shipment BOOKED for deliver/cancel"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_temporal
    check: "Time rules: crush-run run_date >= clock date (ERR_RUN_DATE_IN_PAST); sales delivery_window_end > start and span <= 62 days (ERR_DELIVERY_WINDOW_INVALID); delivery_date inside [window_start, window_end] inclusive both ends (ERR_DELIVERY_OUTSIDE_WINDOW); shipment departure_date >= clock date (ERR_RUN_DATE_IN_PAST); shipment deliver only when clock >= arrival_date (ERR_SHIPMENT_NOT_ARRIVED); DEFERRED pricing_deadline > clock at creation (ERR_DELIVERY_WINDOW_INVALID)"
    error_id: ERR_RUN_DATE_IN_PAST
    http_status: 422
    applies_to: "crush-run schedule, sales-contract create/deliver, shipment create/deliver, contract create"
  - priority: 8
    category: business_safety
    check: "Segregation of duties on hedge confirm (X-User-ID != entered_by_user_id -> ERR_SEGREGATION_OF_DUTIES); certified chain of custody: a certified shipment draws only matching certified lots, insufficient certified supply -> ERR_CERTIFICATION_BREAK"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "hedge confirm, shipment create"
  - priority: 9
    category: business_constraint
    check: "Shape and quantity rules: required type-matched fields per contract_type / product (ERR_INVALID_REQUEST); quantities > 0 (ERR_INVALID_REQUEST); apply over-delivery delivered + net > quantity (ERR_OVER_DELIVERY); election priced + bushels > quantity (ERR_PRICING_EXCEEDS_QUANTITY); sales delivery over-fill (ERR_OVER_DELIVERY); quality spec on deliveries (meal actual_protein_pct >= min_protein_pct; oil/feedstock actual_ffa_pct <= max_ffa_pct) -> ERR_QUALITY_SPEC_FAILED"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create/apply/election/deliver endpoints"
  - priority: 10
    category: business_constraint
    check: "Capacity rules: elevator receiving_open true at ticket create and stored + net <= capacity at apply (ERR_ELEVATOR_AT_CAPACITY); plant per-day aggregate over {SCHEDULED,RUNNING,COMPLETE} runs + planned <= daily_crush_capacity_bushels (ERR_PLANT_CAPACITY_EXCEEDED); TRUCK/RAIL lane per-departure-date sum of non-CANCELLED shipments + bushels <= daily_capacity_bushels (ERR_LANE_DAILY_CAPACITY_EXCEEDED); BARGE lane half-open [departure_date, arrival_date) intervals of BOOKED shipments must not overlap — back-to-back (arrival == next departure) is allowed (ERR_BARGE_SCHEDULE_OVERLAP); shipment bushels <= drawable lots at origin (ERR_INSUFFICIENT_STORED_BUSHELS); run start needs plant inventory (ERR_INSUFFICIENT_PLANT_INVENTORY); biodiesel feedstock quota: sum of quantity_lbs over the plant's BIODIESEL_FEEDSTOCK contracts in {OPEN,DELIVERING,FULFILLED} + new quantity <= daily_refinery_capacity_lbs x biodiesel_feedstock_share_pct/100 x FEEDSTOCK_QUOTA_DAYS (ERR_FEEDSTOCK_QUOTA_EXCEEDED)"
    error_id: ERR_PLANT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "ticket create/apply, run schedule, shipment create, run start, sales create"
  - priority: 11
    category: business_referential
    check: "Referenced-entity state: elevator create requires a PUBLISHED schedule (ERR_SCHEDULE_NOT_PUBLISHED); contract create requires program ACTIVE when program_id given (ERR_PROGRAM_CLOSED); run schedule requires plant ACTIVE (ERR_PLANT_NOT_ACTIVE); sales create requires buyer ACTIVE (ERR_BUYER_NOT_ACTIVE); pricing election / run completion / hedge entry / hedge offset / carry assessment require the relevant as-of futures quotes (ERR_NO_MARKET_QUOTE); routing quote requires a non-empty eligible lane set (ERR_NO_ROUTE_AVAILABLE)"
    error_id: ERR_NO_MARKET_QUOTE
    http_status: 422
    applies_to: "all endpoints referencing secondary resources"
  - priority: 12
    category: business_fiscal
    check: "Crush-run schedule requires planned_margin_cents >= 0 (ERR_NEGATIVE_CRUSH_MARGIN) — checked last, after temporal and capacity rules"
    error_id: ERR_NEGATIVE_CRUSH_MARGIN
    http_status: 422
    applies_to: "POST /api/crush-runs/{id}/schedule"

# =============================================================================
# §1.5 API Endpoint Table (flat; all under /api)
# =============================================================================
endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Advance the logical clock (test-driving endpoint). Startup default is exactly 2026-09-01T00:00:00Z and never wall-clock. Setting the clock synchronously runs the deadline sweep: (1) DEFERRED contracts with pricing_deadline < new clock and pricing_status != PRICED are force-priced at the deadline-date as-of futures quote; (2) OPEN/DELIVERING sales contracts with delivery_window_end < new clock and delivered_lbs < quantity_lbs flip to DEFAULTED with claim_cents and the buyer claim/suspension cascade; (3) ENTERED/CONFIRMED board crush positions with expiry_date < new clock flip to EXPIRED.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["forced pricing sweep", "sales default sweep with buyer cascade", "position expiry sweep"] }

  - { method: POST, path: "/api/farmers", description: "Register a farmer counterparty", roles: [PlatformAdmin], code: 201, input: [legal_name, county], output: Farmer, side_effects: [] }
  - { method: POST, path: "/api/elevators", description: "Register an elevator; active_discount_schedule_id must reference an existing PUBLISHED QualityDiscountSchedule (ERR_SCHEDULE_NOT_PUBLISHED); the schedule is pinned for the elevator's lifetime", roles: [PlatformAdmin], code: 201, input: [name, region, storage_capacity_bushels, active_discount_schedule_id], output: Elevator, side_effects: ["stored_bushels 0, certified_stored_bushels 0, receiving_open true"] }
  - { method: GET, path: "/api/elevators/{id}", description: "Read one elevator incl. derived stored_bushels / certified_stored_bushels / receiving_open", roles: [PlatformAdmin, OriginationMerchandiser, LogisticsCoordinator], code: 200, input: [], output: Elevator, side_effects: [] }
  - { method: GET, path: "/api/elevators", description: "List elevators; filterable by active_discount_schedule_id (FK reverse reachability)", roles: [PlatformAdmin, OriginationMerchandiser], code: 200, input: ["active_discount_schedule_id?", "limit?", "offset?"], output: "Elevator[]", side_effects: [] }
  - { method: GET, path: "/api/elevators/{id}/carry-assessment", description: "Computed read: carry decision for this elevator's stored bushels — calculations.carry_assessment; ERR_NO_MARKET_QUOTE when a leg's as-of BEAN futures quote is missing", roles: [PlatformAdmin, OriginationMerchandiser, CrushTrader], code: 200, input: [nearby_month, deferred_month], output: { nearby_price_cents: integer, deferred_price_cents: integer, storage_cost_cents_per_bushel: integer, signal_cents_per_bushel: integer, decision: string }, side_effects: [] }

  - { method: POST, path: "/api/quality-discount-schedules", description: "Create a discount schedule in DRAFT", roles: [PlatformAdmin], code: 201, input: [name, moisture_base_pct, moisture_shrink_pct_per_point, moisture_discount_cents_per_point, damage_free_pct, damage_discount_cents_per_point, fm_free_pct, fm_discount_cents_per_point, reject_moisture_pct], output: QualityDiscountSchedule, side_effects: [] }
  - { method: POST, path: "/api/quality-discount-schedules/{id}/publish", description: "DRAFT -> PUBLISHED (terminal); only PUBLISHED schedules can be pinned to elevators", roles: [PlatformAdmin], code: 200, input: [], output: QualityDiscountSchedule, side_effects: ["increments QualityDiscountSchedule.version by 1"] }

  - { method: POST, path: "/api/sustainability-programs", description: "Create a certified crop stream program (ACTIVE)", roles: [PlatformAdmin], code: 201, input: [name, cert_standard, premium_cents_per_bushel], output: SustainabilityProgram, side_effects: [] }
  - { method: POST, path: "/api/sustainability-programs/{id}/close", description: "ACTIVE -> CLOSED (terminal); closed programs reject new origination contracts", roles: [SustainabilityAuditor], code: 200, input: [], output: SustainabilityProgram, side_effects: ["increments SustainabilityProgram.version by 1"] }

  - { method: POST, path: "/api/market-quotes", description: "Append a futures market quote (append-only; the as-of selector picks max quote_date <= clock, tie max created_at)", roles: [PlatformAdmin], code: 201, input: [commodity, quote_month, price_cents, quote_date], output: MarketQuote, side_effects: [] }
  - { method: GET, path: "/api/market-quotes", description: "List quotes; filterable by commodity and quote_month", roles: [PlatformAdmin, OriginationMerchandiser, CrushTrader, PlantScheduler], code: 200, input: ["commodity?", "quote_month?", "limit?", "offset?"], output: "MarketQuote[]", side_effects: [] }

  - { method: POST, path: "/api/crush-plants", description: "Register a crush plant; status may be given as MAINTENANCE (default ACTIVE)", roles: [PlatformAdmin], code: 201, input: [name, daily_crush_capacity_bushels, daily_refinery_capacity_lbs, biodiesel_feedstock_share_pct, "status?"], output: CrushPlant, side_effects: ["bean_inventory_bushels 0"] }
  - { method: GET, path: "/api/crush-plants/{id}", description: "Read one plant incl. bean_inventory_bushels", roles: [PlatformAdmin, PlantScheduler, LogisticsCoordinator], code: 200, input: [], output: CrushPlant, side_effects: [] }

  - { method: POST, path: "/api/buyers", description: "Register a meal/oil buyer (ACTIVE, open_claims_count 0)", roles: [PlatformAdmin], code: 201, input: [company_name], output: Buyer, side_effects: [] }
  - { method: GET, path: "/api/buyers/{id}", description: "Read one buyer incl. status and open_claims_count", roles: [PlatformAdmin, ProductMerchandiser], code: 200, input: [], output: Buyer, side_effects: [] }

  - { method: POST, path: "/api/origination-contracts", description: "Create a cash/basis/deferred-pricing origination contract; type-matched price fields enforced; program_id (optional) must be an ACTIVE program; CASH is born pricing_status PRICED with priced_bushels == quantity_bushels", roles: [OriginationMerchandiser], code: 201, input: [farmer_id, elevator_id, contract_type, quantity_bushels, "program_id?", "cash_price_cents_per_bushel?", "basis_cents_per_bushel?", "futures_month?", "pricing_deadline?", "storage_rate_cents_per_bushel_day?"], output: OriginationContract, side_effects: ["CASH: seed elections[] with one election of quantity_bushels at cash_price_cents_per_bushel, priced_value_cents set", "BASIS/DEFERRED: pricing_status UNPRICED"] }
  - { method: GET, path: "/api/origination-contracts/{id}", description: "Read one contract; Farmer callers must own it (X-User-ID == farmer_id) else ERR_FORBIDDEN", roles: [PlatformAdmin, OriginationMerchandiser, Farmer], code: 200, input: [], output: OriginationContract, side_effects: [] }
  - { method: GET, path: "/api/origination-contracts", description: "List contracts; filterable by farmer_id / elevator_id / program_id / pricing_status / fulfillment_status", roles: [PlatformAdmin, OriginationMerchandiser, Farmer], code: 200, input: ["farmer_id?", "elevator_id?", "program_id?", "pricing_status?", "fulfillment_status?", "limit?", "offset?"], output: "OriginationContract[]", side_effects: [] }
  - { method: POST, path: "/api/origination-contracts/{id}/pricing-elections", description: "Price bushels of a BASIS/DEFERRED contract at the as-of futures quote (BASIS adds locked basis); OCC on contract version; partial elections -> PARTIALLY_PRICED, exact remaining -> PRICED", roles: [OriginationMerchandiser, Farmer], code: 200, input: [bushels, expected_contract_version], output: OriginationContract, side_effects: ["append election", "priced_bushels += bushels", "priced_value_cents += bushels x unit_price_cents", "DEFERRED accrual leg finalized through now", "recompute estimated_settlement_cents", "increments OriginationContract.version by 1"] }
  - { method: POST, path: "/api/origination-contracts/{id}/settle", description: "DELIVERED + PRICED -> SETTLED; computes FINAL settlement (per-ticket FIFO lines, round-per-line-then-sum, minus accrued storage)", roles: [OriginationMerchandiser], code: 200, input: [], output: OriginationContract, side_effects: ["calculations.contract_settlement FINAL", "sets settlement_line_total_cents / settlement_accrual_deduction_cents / settlement_net_payable_cents", "increments OriginationContract.version by 1"] }

  - { method: POST, path: "/api/delivery-tickets", description: "Create a scale ticket in RECEIVED against a contract; contract fulfillment must be OPEN|DELIVERING; the contract elevator's receiving_open gate must be true (ERR_ELEVATOR_AT_CAPACITY)", roles: [OriginationMerchandiser], code: 201, input: [contract_id, gross_bushels, moisture_pct, damage_pct, foreign_material_pct], output: DeliveryTicket, side_effects: ["elevator_id / program_id copied from contract"] }
  - { method: GET, path: "/api/delivery-tickets/{id}", description: "Read one ticket incl. computed grading fields", roles: [PlatformAdmin, OriginationMerchandiser], code: 200, input: [], output: DeliveryTicket, side_effects: [] }
  - { method: GET, path: "/api/delivery-tickets", description: "List tickets; filterable by contract_id / elevator_id / schedule_id / program_id (FK reverse reachability)", roles: [PlatformAdmin, OriginationMerchandiser], code: 200, input: ["contract_id?", "elevator_id?", "schedule_id?", "program_id?", "limit?", "offset?"], output: "DeliveryTicket[]", side_effects: [] }
  - { method: POST, path: "/api/delivery-tickets/{id}/apply", description: "Grade against the elevator's pinned schedule and apply to the contract; moisture above reject_moisture_pct yields 200 with status REJECTED and no side effects; otherwise APPLIED with the full cascade (contract delivered/priced pools, storage position creation, elevator stored/certified recompute, receiving gate re-derivation, provisional settlement recompute)", roles: [OriginationMerchandiser], code: 200, input: [], output: DeliveryTicket, side_effects: ["calculations.quality_grade_factors", "cascade: contract -> position -> elevator stored -> receiving gate", "increments DeliveryTicket.version by 1"] }

  - { method: GET, path: "/api/storage-positions/{id}", description: "Read one storage lot", roles: [PlatformAdmin, OriginationMerchandiser, LogisticsCoordinator], code: 200, input: [], output: StoragePosition, side_effects: [] }
  - { method: GET, path: "/api/storage-positions", description: "List storage lots; filterable by elevator_id / source_ticket_id / program_id (FK reverse reachability)", roles: [PlatformAdmin, OriginationMerchandiser, LogisticsCoordinator], code: 200, input: ["elevator_id?", "source_ticket_id?", "program_id?", "limit?", "offset?"], output: "StoragePosition[]", side_effects: [] }

  - { method: POST, path: "/api/freight-lanes", description: "Create a truck/rail/barge lane elevator -> plant", roles: [LogisticsCoordinator], code: 201, input: [origin_elevator_id, destination_plant_id, mode, freight_cents_per_bushel, transit_days, daily_capacity_bushels], output: FreightLane, side_effects: [] }
  - { method: GET, path: "/api/freight-lanes/{id}", description: "Read one lane", roles: [PlatformAdmin, LogisticsCoordinator], code: 200, input: [], output: FreightLane, side_effects: [] }
  - { method: GET, path: "/api/freight-lanes", description: "List lanes; filterable by origin_elevator_id / destination_plant_id (FK reverse reachability)", roles: [PlatformAdmin, LogisticsCoordinator], code: 200, input: ["origin_elevator_id?", "destination_plant_id?", "limit?", "offset?"], output: "FreightLane[]", side_effects: [] }
  - { method: POST, path: "/api/shipment-routing-quotes", description: "Destination optimization: ranked eligible lanes out of an origin elevator per calculations.destination_ranking (freight ASC, transit_days ASC, created_at ASC; empty pool -> ERR_NO_ROUTE_AVAILABLE)", roles: [LogisticsCoordinator], code: 200, input: [origin_elevator_id, bushels], output: "FreightLane[]", side_effects: [] }

  - { method: POST, path: "/api/shipments", description: "Book a bean shipment: draws origin-elevator storage lots FIFO by created_at (certified shipments draw only matching-program lots; plain shipments draw only non-certified lots), decrements elevator stored/certified counters, computes freight_cost_cents and arrival_date; enforces lane capacity semantics (TRUCK/RAIL per-day aggregate; BARGE half-open interval overlap)", roles: [LogisticsCoordinator], code: 201, input: [lane_id, bushels, departure_date, "certified_program_id?"], output: Shipment, side_effects: ["draws[] recorded", "elevator.stored_bushels -= bushels", "receiving_open re-derived"] }
  - { method: GET, path: "/api/shipments/{id}", description: "Read one shipment incl. draws", roles: [PlatformAdmin, LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/api/shipments", description: "List shipments; filterable by lane_id / certified_program_id (FK reverse reachability)", roles: [PlatformAdmin, LogisticsCoordinator], code: 200, input: ["lane_id?", "certified_program_id?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: POST, path: "/api/shipments/{id}/deliver", description: "BOOKED -> DELIVERED once clock >= arrival_date; credits the destination plant's bean inventory", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["CrushPlant.bean_inventory_bushels += bushels", "increments Shipment.version by 1"] }
  - { method: POST, path: "/api/shipments/{id}/cancel", description: "BOOKED -> CANCELLED; compensating action restores every drawn lot exactly (reverse draw order) and re-derives elevator counters and gate", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["draws reversed onto positions", "elevator.stored_bushels += bushels", "lane occupancy freed", "increments Shipment.version by 1"] }

  - { method: POST, path: "/api/crush-runs", description: "Plan a crush run; computes expected yields and locks the PLANNED crush margin from as-of quotes for futures_month (ERR_NO_MARKET_QUOTE if any leg missing)", roles: [PlantScheduler], code: 201, input: [plant_id, run_date, planned_bushels, futures_month], output: CrushRun, side_effects: ["calculations.crush_margin PLANNED variant"] }
  - { method: GET, path: "/api/crush-runs/{id}", description: "Read one run incl. planned/realized margins", roles: [PlatformAdmin, PlantScheduler, CrushTrader], code: 200, input: [], output: CrushRun, side_effects: [] }
  - { method: GET, path: "/api/crush-runs", description: "List runs; filterable by plant_id (FK reverse reachability)", roles: [PlatformAdmin, PlantScheduler, CrushTrader], code: 200, input: ["plant_id?", "limit?", "offset?"], output: "CrushRun[]", side_effects: [] }
  - { method: POST, path: "/api/crush-runs/{id}/schedule", description: "PLANNED -> SCHEDULED with OCC on run version; checks plant ACTIVE, run_date not past, per-day aggregate capacity, non-negative planned margin (in that priority order)", roles: [PlantScheduler], code: 200, input: [expected_run_version], output: CrushRun, side_effects: ["increments CrushRun.version by 1"] }
  - { method: POST, path: "/api/crush-runs/{id}/transitions", description: "Lifecycle transitions: to_status PLANNED (revert from SCHEDULED), RUNNING (from SCHEDULED; consumes plant bean inventory), COMPLETE (from RUNNING; computes realized margin), CANCELLED (from PLANNED|SCHEDULED)", roles: [PlantScheduler], code: 200, input: [to_status], output: CrushRun, side_effects: ["RUNNING: plant.bean_inventory_bushels -= planned_bushels", "COMPLETE: calculations.crush_margin REALIZED variant", "increments CrushRun.version by 1"] }

  - { method: POST, path: "/api/board-crush-positions", description: "Enter a board crush hedge (long beans / short oil+meal) in ENTERED; locks the spread from as-of quotes (ERR_NO_MARKET_QUOTE if any leg missing); records entered_by_user_id from X-User-ID", roles: [CrushTrader], code: 201, input: [futures_month, bean_lots_long, oil_lots_short, meal_lots_short, expiry_date], output: BoardCrushPosition, side_effects: ["calculations.board_crush_spread lock"] }
  - { method: GET, path: "/api/board-crush-positions/{id}", description: "Read one hedge position", roles: [PlatformAdmin, CrushTrader, RiskManager], code: 200, input: [], output: BoardCrushPosition, side_effects: [] }
  - { method: POST, path: "/api/board-crush-positions/{id}/confirm", description: "ENTERED -> CONFIRMED; segregation of duties: the confirming RiskManager's X-User-ID must differ from entered_by_user_id (ERR_SEGREGATION_OF_DUTIES)", roles: [RiskManager], code: 200, input: [], output: BoardCrushPosition, side_effects: ["confirmed_by_user_id set", "increments BoardCrushPosition.version by 1"] }
  - { method: POST, path: "/api/board-crush-positions/{id}/offset", description: "CONFIRMED -> OFFSET; realizes P&L from the current as-of spread vs the locked spread", roles: [CrushTrader], code: 200, input: [], output: BoardCrushPosition, side_effects: ["calculations.board_crush_spread realized P&L", "increments BoardCrushPosition.version by 1"] }

  - { method: POST, path: "/api/product-sales-contracts", description: "Create a meal/oil/biodiesel-feedstock sales contract with delivery window and product-matched quality spec; buyer must be ACTIVE; biodiesel feedstock quota enforced per plant", roles: [ProductMerchandiser], code: 201, input: [buyer_id, plant_id, product, quantity_lbs, price_cents_per_lb, delivery_window_start, delivery_window_end, "min_protein_pct?", "max_ffa_pct?"], output: ProductSalesContract, side_effects: [] }
  - { method: GET, path: "/api/product-sales-contracts/{id}", description: "Read one sales contract; CommercialBuyer callers must own it (X-User-ID == buyer_id) else ERR_FORBIDDEN", roles: [PlatformAdmin, ProductMerchandiser, CommercialBuyer], code: 200, input: [], output: ProductSalesContract, side_effects: [] }
  - { method: GET, path: "/api/product-sales-contracts", description: "List sales contracts; filterable by buyer_id / plant_id (FK reverse reachability)", roles: [PlatformAdmin, ProductMerchandiser, CommercialBuyer], code: 200, input: ["buyer_id?", "plant_id?", "limit?", "offset?"], output: "ProductSalesContract[]", side_effects: [] }
  - { method: POST, path: "/api/product-sales-contracts/{id}/deliver", description: "Record a delivery against the contract: window-inclusive date check, over-fill check, product quality-spec check; appends to deliveries[], accumulates delivered_lbs, auto-transitions OPEN->DELIVERING->FULFILLED", roles: [ProductMerchandiser], code: 201, input: [delivery_date, quantity_lbs, "actual_protein_pct?", "actual_ffa_pct?"], output: ProductSalesContract, side_effects: ["deliveries[] append", "delivered_lbs += quantity_lbs", "auto FULFILLED when delivered_lbs == quantity_lbs", "increments ProductSalesContract.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed caller (Farmer/CommercialBuyer) does not own the target resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Hedge confirm where X-User-ID == entered_by_user_id" }
  - { id: ERR_FARMER_NOT_FOUND, http: 404, condition: "farmer_id does not resolve" }
  - { id: ERR_ELEVATOR_NOT_FOUND, http: 404, condition: "elevator path/body id does not resolve" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "quality-discount-schedule id does not resolve" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "sustainability-program id does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "origination-contract id does not resolve" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "delivery-ticket id does not resolve" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "storage-position id does not resolve" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "freight-lane id does not resolve" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not resolve" }
  - { id: ERR_PLANT_NOT_FOUND, http: 404, condition: "crush-plant id does not resolve" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "crush-run id does not resolve" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "buyer id does not resolve" }
  - { id: ERR_SALES_CONTRACT_NOT_FOUND, http: 404, condition: "product-sales-contract id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/number, or a type-mismatched field for the contract_type / product (e.g. cash price on a BASIS contract, protein spec on an oil contract)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition precondition failure: ticket not RECEIVED, run not in the required from-state, schedule/program already terminal, shipment not BOOKED, position not ENTERED for confirm" }
  - { id: ERR_CONTRACT_NOT_PRICABLE, http: 409, condition: "Pricing election on a CASH contract or one already PRICED (or otherwise not in a pricable pricing_status)" }
  - { id: ERR_CONTRACT_NOT_SETTLEABLE, http: 409, condition: "Settle attempted while fulfillment_status != DELIVERED or pricing_status != PRICED" }
  - { id: ERR_POSITION_NOT_CONFIRMED, http: 409, condition: "Offset attempted on a position not in CONFIRMED" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != contract.version on a pricing election (OCC)" }
  - { id: ERR_STALE_RUN_VERSION, http: 412, condition: "expected_run_version != run.version on schedule (OCC)" }
  - { id: ERR_OVER_DELIVERY, http: 422, condition: "Apply or sales delivery would push delivered bushels/pounds above the contracted quantity" }
  - { id: ERR_PRICING_EXCEEDS_QUANTITY, http: 422, condition: "Pricing election bushels would push priced_bushels above quantity_bushels" }
  - { id: ERR_ELEVATOR_AT_CAPACITY, http: 422, condition: "Ticket create while receiving_open is false, or apply would push stored_bushels above storage_capacity_bushels" }
  - { id: ERR_PLANT_CAPACITY_EXCEEDED, http: 422, condition: "Scheduling would push the plant's per-day aggregate of {SCHEDULED,RUNNING,COMPLETE} runs above daily_crush_capacity_bushels" }
  - { id: ERR_LANE_DAILY_CAPACITY_EXCEEDED, http: 422, condition: "TRUCK/RAIL shipment would push the lane's per-departure-date booked bushels above daily_capacity_bushels" }
  - { id: ERR_BARGE_SCHEDULE_OVERLAP, http: 409, condition: "BARGE shipment's half-open [departure_date, arrival_date) interval overlaps another BOOKED shipment on the same lane; back-to-back (arrival == departure) is allowed" }
  - { id: ERR_DELIVERY_WINDOW_INVALID, http: 422, condition: "Sales window end <= start, span > 62 days, or DEFERRED pricing_deadline not in the future at contract creation" }
  - { id: ERR_DELIVERY_OUTSIDE_WINDOW, http: 422, condition: "delivery_date outside [delivery_window_start, delivery_window_end] inclusive" }
  - { id: ERR_RUN_DATE_IN_PAST, http: 422, condition: "Crush-run schedule with run_date before the current logical clock date, or shipment departure_date before it" }
  - { id: ERR_SHIPMENT_NOT_ARRIVED, http: 422, condition: "Deliver attempted while current logical clock < arrival_date" }
  - { id: ERR_NEGATIVE_CRUSH_MARGIN, http: 422, condition: "Scheduling a run whose planned_margin_cents < 0" }
  - { id: ERR_NO_MARKET_QUOTE, http: 422, condition: "No as-of futures quote for a required (commodity, quote_month) leg at evaluation time" }
  - { id: ERR_NO_ROUTE_AVAILABLE, http: 422, condition: "Routing quote candidate set is empty (no lane from the origin, or all destinations MAINTENANCE / under-capacity)" }
  - { id: ERR_QUALITY_SPEC_FAILED, http: 422, condition: "Meal delivery below min_protein_pct or oil/feedstock delivery above max_ffa_pct" }
  - { id: ERR_CERTIFICATION_BREAK, http: 422, condition: "Certified shipment cannot be filled from certified lots alone (chain-of-custody would break)" }
  - { id: ERR_FEEDSTOCK_QUOTA_EXCEEDED, http: 422, condition: "Biodiesel feedstock contracts at a plant would exceed daily_refinery_capacity_lbs x biodiesel_feedstock_share_pct/100 x 30 over non-terminal contracts" }
  - { id: ERR_INSUFFICIENT_STORED_BUSHELS, http: 422, condition: "Shipment booking exceeds drawable storage at the origin elevator (within the requested certification class)" }
  - { id: ERR_INSUFFICIENT_PLANT_INVENTORY, http: 422, condition: "Run start requires plant.bean_inventory_bushels >= planned_bushels" }
  - { id: ERR_SCHEDULE_NOT_PUBLISHED, http: 422, condition: "Elevator creation references a schedule not yet PUBLISHED" }
  - { id: ERR_PROGRAM_CLOSED, http: 422, condition: "Origination contract references a CLOSED sustainability program" }
  - { id: ERR_PLANT_NOT_ACTIVE, http: 422, condition: "Crush-run schedule while plant status == MAINTENANCE" }
  - { id: ERR_BUYER_NOT_ACTIVE, http: 422, condition: "Sales-contract creation with a SUSPENDED buyer" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator: registers counterparties, sites, schedules, programs, plants, buyers; posts market quotes; drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /api/farmers", "POST /api/elevators", "POST /api/quality-discount-schedules", "POST /api/quality-discount-schedules/{id}/publish", "POST /api/sustainability-programs", "POST /api/market-quotes", "POST /api/crush-plants", "POST /api/buyers", "POST /api/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: OriginationMerchandiser
    description: "Elevator merchandiser: writes origination contracts, applies delivery tickets, settles contracts"
    identity: opaque
    exclusive_operations: ["POST /api/origination-contracts", "POST /api/delivery-tickets", "POST /api/delivery-tickets/{id}/apply", "POST /api/origination-contracts/{id}/settle"]
    shared_operations: ["POST /api/origination-contracts/{id}/pricing-elections (shared with Farmer)", "GET /api/origination-contracts*", "GET /api/delivery-tickets*", "GET /api/elevators*", "GET /api/market-quotes", "GET /api/storage-positions*"]
  - name: Farmer
    description: "Grower counterparty; may price elections on and read ONLY its own contracts"
    identity: "entity_backed:Farmer"
    exclusive_operations: []
    shared_operations: ["POST /api/origination-contracts/{id}/pricing-elections (own contracts only)", "GET /api/origination-contracts/{id} and list (own only)"]
  - name: CrushTrader
    description: "Hedge desk trader: enters and offsets board crush positions"
    identity: opaque
    exclusive_operations: ["POST /api/board-crush-positions", "POST /api/board-crush-positions/{id}/offset"]
    shared_operations: ["GET /api/board-crush-positions/{id}", "GET /api/elevators/{id}/carry-assessment", "GET /api/market-quotes", "GET /api/crush-runs*"]
  - name: RiskManager
    description: "Confirms hedges; segregation of duties forbids confirming a position entered by the same X-User-ID"
    identity: opaque
    exclusive_operations: ["POST /api/board-crush-positions/{id}/confirm"]
    shared_operations: ["GET /api/board-crush-positions/{id}"]
  - name: PlantScheduler
    description: "Schedules and drives crush runs at plants"
    identity: opaque
    exclusive_operations: ["POST /api/crush-runs", "POST /api/crush-runs/{id}/schedule", "POST /api/crush-runs/{id}/transitions"]
    shared_operations: ["GET /api/crush-runs*", "GET /api/crush-plants/{id}", "GET /api/market-quotes"]
  - name: LogisticsCoordinator
    description: "Books freight lanes and shipments, requests routing quotes, delivers/cancels shipments"
    identity: opaque
    exclusive_operations: ["POST /api/freight-lanes", "POST /api/shipment-routing-quotes", "POST /api/shipments", "POST /api/shipments/{id}/deliver", "POST /api/shipments/{id}/cancel"]
    shared_operations: ["GET /api/freight-lanes*", "GET /api/shipments*", "GET /api/elevators*", "GET /api/storage-positions*", "GET /api/crush-plants/{id}"]
  - name: ProductMerchandiser
    description: "Sells meal/oil/biodiesel feedstock; records deliveries against sales contracts"
    identity: opaque
    exclusive_operations: ["POST /api/product-sales-contracts", "POST /api/product-sales-contracts/{id}/deliver"]
    shared_operations: ["GET /api/product-sales-contracts*", "GET /api/buyers/{id}"]
  - name: CommercialBuyer
    description: "Meal/oil customer; reads ONLY its own sales contracts"
    identity: "entity_backed:Buyer"
    exclusive_operations: []
    shared_operations: ["GET /api/product-sales-contracts/{id} and list (own only)"]
  - name: SustainabilityAuditor
    description: "Certification body representative; closes sustainability programs"
    identity: opaque
    exclusive_operations: ["POST /api/sustainability-programs/{id}/close"]
    shared_operations: []
