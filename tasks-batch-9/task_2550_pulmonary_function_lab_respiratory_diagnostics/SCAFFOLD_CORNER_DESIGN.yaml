      - name: a_technologist_may_not_serve_as_their_own_biologic_control
        claim_type: error_triggerable
        grounds:
          - validations[priority=38]
          - errors[ERR_SELF_BIOLOGIC_CONTROL]
          - entities.Staff.fields.is_biologic_control
        distinguishing_aspect: |
          The biologic control subject T-090 is a legitimate control with a baseline, so the only thing
          wrong with the refused request is that T-090 performed it on themselves - the identical payload
          performed by T-001 is accepted. The refusal is also what keeps
          Device.last_biologic_control_date null, which is separately observable.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "T-090 is a biologic control subject with baseline_fev1_l 4.000 established 2026-05-01"
            - "device SPIRO-1 has today's PASS calibration and no biologic control yet"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-090", full_name: "Cal Mensah", role_type: "TECHNOLOGIST", credential: "CPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], is_biologic_control: true, baseline_fev1_l: 4.000, baseline_fvc_l: 5.200, baseline_established_on: "2026-05-01" }
              as: LabManager
              captures: { bcs_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${bcs_id}"
              captures: { err: $.data.error_id }
            - call: "GET /pft-lab/devices/${dev1_id}"
              payload: {}
              as: LabManager
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "GET /pft-lab/devices/${dev1_id}"
              payload: {}
              as: LabManager
          assert:
            - "the self-administered control returns HTTP 422 with error_id ERR_SELF_BIOLOGIC_CONTROL"
            - "the read after the refusal shows Device.${dev1_id}.last_biologic_control_date == null and status AVAILABLE"
            - "the same measurement performed by T-001 returns HTTP 201 with deviation_pct == 3.75 and outcome == PASS"
            - "Device.${dev1_id}.last_biologic_control_date == 2026-08-03 after the accepted event"
      - name: custody_events_are_scoped_to_non_routine_contexts_and_strictly_sequenced
        claim_type: error_triggerable
        grounds:
          - validations[priority=46]
          - validations[priority=47]
          - validations[priority=17]
          - errors[ERR_CUSTODY_NOT_APPLICABLE]
          - errors[ERR_CUSTODY_SEQUENCE_INVALID]
        distinguishing_aspect: |
          Three different custody refusals sit on the same endpoint: a ROUTINE_CLINICAL session has
          custody_status NOT_APPLICABLE and admits no custody event at all, a DISABILITY session at
          CUSTODY_OPEN cannot skip straight to SEAL_APPLIED, and an ID_VERIFIED event without
          id_document_type is incomplete. The legal ID_VERIFIED that follows advances only the custody
          dimension.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "SESS-1 belongs to a ROUTINE_CLINICAL order, so its custody_status is NOT_APPLICABLE"
            - "SESS-2 belongs to a DISABILITY_EVALUATION order, so its custody_status starts at CUSTODY_OPEN"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
