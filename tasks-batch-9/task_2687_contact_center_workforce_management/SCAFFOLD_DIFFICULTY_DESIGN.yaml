              as_user_id: "u-src-1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /partner-allocations/${a1_id}/commit"
              payload: { expected_partner_version: "${p1_v1}" }
              as: SourcingManager
              as_user_id: "u-src-2"
              captures: { committed_status: "$.data.status" }
            - call: "GET /interval-plans/${ip0_id}"
              payload: {}
              as: SourcingManager
              as_user_id: "u-src-2"
              captures: { committed_volume_before: "$.data.partner_committed_volume", unserved_before: "$.data.unserved_volume" }
          trigger:
            - call: "POST /partner-allocations/${a1_id}/revoke"
              payload: {}
              as: SourcingManager
              as_user_id: "u-src-2"
          assert:
            - "committed_status == \"COMMITTED\" and committed_volume_before == 50 and unserved_before == 32"
            - "PartnerAllocation.${a1_id}.status == \"REVOKED\""
            - "PartnerAllocation.${a1_id}.delivered_volume is null and PartnerAllocation.${a1_id}.settlement_amount_cents is null"
            - "PartnerAllocation.${a1_id}.settlement_floor_cents is null and PartnerAllocation.${a1_id}.shortfall_penalty_cents is null"
            - "IntervalPlan.${ip0_id}.partner_committed_volume == 0"
            - "IntervalPlan.${ip0_id}.unserved_volume == 82"
            - "OutsourcePartner.${p1_id}.committed_volume_outstanding == 0"
            - "OutsourcePartner.${p1_id}.invoice_total_cents == 0"
