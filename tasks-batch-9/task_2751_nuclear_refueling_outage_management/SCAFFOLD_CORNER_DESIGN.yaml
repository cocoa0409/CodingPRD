            - "${o_status} == SCOPE_LOCKED on the second attempt"
            - "Now WorkOrder.${wo_scoped}.status == DEFERRED with deferral_reason SCOPE_LOCK_AUTO_DEFERRAL, ScheduleActivity.${act_id}.execution_status == CANCELLED and RadiologicalWorkPermit.${rwp_id}.status == VOIDED with void_reason WORK_ORDER_DEFERRED"
