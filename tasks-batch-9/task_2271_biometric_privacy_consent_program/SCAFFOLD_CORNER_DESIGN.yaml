          - endpoints["POST /programs/{program_id}/destruction-sweeps"]
        distinguishing_aspect: "A single vendor's missed deletion certificate propagates outward: the posture recomputation flips to FROZEN, and the freeze then blocks two unrelated writes (policy publication and asset activation) while the obligation stays permanently uncurable because the close-out window has itself expired."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, one Vendor with an EXECUTED contract TERMINATED at clock 2026-08-01 (deletion_deadline_at 2026-08-31) and never closed out."
