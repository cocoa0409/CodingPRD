# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Seed Dealer & Trait Licensing Program
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: commission_provisional_counts_replacement_units_final_excludes
        grounds:
          - calculations.commission_accrual
          - state_machines.CommissionStatement.ACCRUING_to_ACCRUING
          - state_machines.CommissionStatement.ACCRUING_to_FINALIZED
          - state_machines.ReplantClaim.UNDER_REVIEW_to_APPROVED
          - entities.CommissionStatement.fields.volume_units
        distinguishing_aspect: |
          Entity domain: CommissionStatement. For the identical order population, the
          PROVISIONAL variant counts replacement-order units toward volume_units (1260 ->
          bonus tier earned, total 972000) while the FINAL variant excludes them
          (900 -> no bonus, total 810000). The variant switch, not any data change,
          moves the commission by 162000 cents.
        test_recipe:
          setup:
            - "Program (commission_base_bps 500, commission_volume_tiers [{1000 -> 100bps}], no volume rebate, daily capacity 100000) is OPEN"
            - "Grower G with one 900-unit CONFIRMED order of a conventional variety @18000 cents (net 16200000), fully delivered"
            - "An APPROVED replant claim on 40 of 100 acres has spawned a 360-unit replacement order (net 0, SETTLED)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1200}, {cutoff_at: "2026-11-15T23:59:59Z", discount_bps: 1000}, {cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}, {pay_by: "2027-02-15T23:59:59Z", discount_bps: 500}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "LOAM", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { f: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 10000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
              captures: { lot: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 900 }
              as: SalesRep
              captures: { ln: $.data.id }
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { o_net: $.data.net_amount_cents }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o}", order_line_id: "${ln}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 900 }
              as: SalesRep
              captures: { t: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-10T12:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/delivery-tickets/${t}/complete"
              as: SalesRep
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T09:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/replant-claims"
              payload: { order_id: "${o}", order_line_id: "${ln}", field_id: "${f}", event_date: "2027-05-01T00:00:00Z", event_type: "FROST", acres_affected: 40 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { c: $.data.id }
            - call: "POST /dealer/replant-claims/${c}/start_review"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /dealer/replant-claims/${c}/approve"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { rep_o: $.data.replacement_order_id }
            - call: "GET /dealer/commission-statements"
              payload: { program_id: "${prog}" }
              as: DealerAdmin
              captures: { stmt: "$.data[0].id" }
          trigger:
            - call: "POST /dealer/commission-statements/${stmt}/recompute"
              as: DealerAdmin
              captures: { prov_total: $.data.total_commission_cents, prov_units: $.data.volume_units }
            - call: "POST /dealer/programs/${prog}/close_sales"
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/programs/${prog}/settle"
              as: DealerAdmin
            - call: "GET /dealer/commission-statements/${stmt}"
              as: DealerAdmin
              captures: { fin_total: $.data.total_commission_cents, fin_units: $.data.volume_units, fin_status: $.data.status }
          assert:
            - "provisional volume_units == 1260 (900 paid + 360 replacement)"
            - "provisional total_commission_cents == 972000 (base 810000 + bonus 162000)"
            - "final volume_units == 900 (replacement units excluded)"
            - "final total_commission_cents == 810000 (volume tier lost)"
            - "final status == FINALIZED"
            - "972000 != 810000 — the variant switch alone moved the commission"

      - name: return_credit_provisional_locked_price_vs_final_repriced
        grounds:
          - calculations.return_credit
          - state_machines.SeedReturn.REQUESTED_to_APPROVED
          - state_machines.SeedReturn.RECEIVED_to_CREDITED
          - entities.SeedReturn.fields.credit_estimate_cents
          - entities.SeedReturn.fields.credit_cents
        distinguishing_aspect: |
          Entity domain: SeedReturn/SeedOrder pricing (distinct from the CommissionStatement
          domain of the sibling instance). PROVISIONAL credits the locked unit price
          (200 x 18000 - fee = 3240000); FINAL reprices the order without the returned
          units, the 500-unit rebate tier is lost, so the grower is charged back the
          540000 rebate inside the delta (2700000). Same return, two defensible credits.
        test_recipe:
          setup:
            - "Program (volume_rebate_tiers [{min_units 500 -> 500bps}], restocking 1000bps, untreated-only returns, capacity 100000) is OPEN"
            - "Grower G has a CONFIRMED order: 600 units of SOY-V2 @18000, no treatment; locked discount 0bps (confirmed 2027-02-01); rebate 540000; net 10260000"
            - "All 600 units delivered; logical clock 2027-06-01 (inside return window ending 2027-06-30T23:59:59Z)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1200}, {cutoff_at: "2026-11-15T23:59:59Z", discount_bps: 1000}, {cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}, {pay_by: "2027-02-15T23:59:59Z", discount_bps: 500}], volume_rebate_tiers: [{min_units: 500, rebate_bps: 500}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 10000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
              captures: { lot: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 600 }
              as: SalesRep
              captures: { ln: $.data.id }
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { o_net: $.data.net_amount_cents }
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o}", order_line_id: "${ln}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 600 }
              as: SalesRep
              captures: { t: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-10T12:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/delivery-tickets/${t}/complete"
              as: SalesRep
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/returns"
              payload: { order_id: "${o}", order_line_id: "${ln}", units: 200, reason: "OVERSTOCK" }
              as: SalesRep
              captures: { r: $.data.id }
          trigger:
            - call: "POST /dealer/returns/${r}/approve"
              as: DealerAdmin
              captures: { est: $.data.credit_estimate_cents, fee: $.data.restocking_fee_cents }
            - call: "POST /dealer/returns/${r}/receive"
              as: DealerAdmin
            - call: "POST /dealer/returns/${r}/credit"
              as: DealerAdmin
              captures: { cred: $.data.credit_cents }
            - call: "GET /dealer/growers/${g}"
              as: DealerAdmin
              captures: { out_bal: $.data.outstanding_balance_cents }
          assert:
            - "return credit_estimate_cents == 3240000 (provisional: 200 x 18000 - 360000 fee)"
            - "return restocking_fee_cents == 360000"
            - "return credit_cents == 2700000 (final: order-net delta 3060000 after losing the 500-unit rebate tier, minus 360000 fee)"
            - "3240000 != 2700000 — tier re-evaluation is the only difference between variants"
            - "grower outstanding_balance_cents == -2700000 (credit applied to an uninvoiced order -> refund owed)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (3 instances, modes (a), (b), (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: early_order_tier_branches_replacement_small_order_date
        grounds:
          - calculations.early_order_discount_bps
          - entities.SeedOrder.fields.locked_discount_bps
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: is_replacement branch,
          MIN_ORDER_UNITS_FOR_DISCOUNT=20 gate, and date-tier selection over 3 cutoffs.
          Two orders confirmed the same day diverge purely on the 20-unit gate
          (10 units -> 0bps; 30 units -> 1200bps), and an order after the last cutoff
          gets 0bps despite qualifying size.
        test_recipe:
          setup:
            - "Program (standard three early-order tiers 1200/1000/600 bps, capacity 100000) OPEN; variety SOY-V2 @18000; lot stocked"
            - "Logical clock 2026-09-15 (inside tier-1 window ending 2026-09-30T23:59:59Z)"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1200}, {cutoff_at: "2026-11-15T23:59:59Z", discount_bps: 1000}, {cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}, {pay_by: "2027-02-15T23:59:59Z", discount_bps: 500}], volume_rebate_tiers: [{min_units: 500, rebate_bps: 500}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 10000, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /dealer/orders/${o1}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o2: $.data.id }
            - call: "POST /dealer/orders/${o2}/lines"
              payload: { variety_id: "${v2}", units: 30 }
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o3: $.data.id }
            - call: "POST /dealer/orders/${o3}/lines"
              payload: { variety_id: "${v2}", units: 30 }
              as: SalesRep
          trigger:
            - call: "POST /dealer/orders/${o1}/confirm"
              as: SalesRep
              captures: { d1: $.data.locked_discount_bps, n1: $.data.net_amount_cents }
            - call: "POST /dealer/orders/${o2}/confirm"
              as: SalesRep
              captures: { d2: $.data.locked_discount_bps, n2: $.data.net_amount_cents }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders/${o3}/confirm"
              as: SalesRep
              captures: { d3: $.data.locked_discount_bps, n3: $.data.net_amount_cents }
          assert:
            - "o1.locked_discount_bps == 0 (10 units < 20-unit gate despite tier-1 date)"
            - "o1.net_amount_cents == 180000 (10 x 18000)"
            - "o2.locked_discount_bps == 1200 (30 units, tier-1 window)"
            - "o2.net_amount_cents == 475200 (30 x 15840)"
            - "o3.locked_discount_bps == 0 (confirmed after the last cutoff 2027-01-15T23:59:59Z)"
            - "o3.net_amount_cents == 540000"

      - name: order_line_pricing_per_unit_rounding_before_multiply
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.discounted_unit_price_cents
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: round_half_up the discounted UNIT price
          first, then multiply by units. unit price 10005 @ 1225bps -> per-unit 8779,
          line 3 units = 26337; the multiply-first alternative yields 26338. Treatment
          adders join the line total AFTER discounting and are never discounted.
        test_recipe:
          setup:
            - "Program with a single early tier {cutoff 2026-09-30T23:59:59Z, 1225bps}, capacity 100000, OPEN"
            - "Variety CORN-V3 @10005 cents/unit, conventional (no trait package); treatment FUNG-C (CORN, +450/unit) AVAILABLE"
            - "One untreated lot and one FUNG-C treated lot of CORN-V2 stock; clock 2026-09-15"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "2027 Seed Program", crop_year: 2027, early_order_tiers: [{cutoff_at: "2026-09-30T23:59:59Z", discount_bps: 1225}], prepay_tiers: [{pay_by: "2026-12-20T23:59:59Z", discount_bps: 800}], volume_rebate_tiers: [{min_units: 500, rebate_bps: 500}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, commission_volume_tiers: [{min_net_units: 1000, bonus_bps: 100}], min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "CORN-V3", crop: "CORN", relative_maturity_days: 112, base_price_cents_per_unit: 10005, seeds_per_unit: 80000, preferred_soils: ["LOAM"], min_drainage: "MODERATE" }
              as: DealerAdmin
              captures: { v3: $.data.id }
            - call: "POST /dealer/treatment-options"
              payload: { code: "FUNG-C", crop: "CORN", adder_cents_per_unit: 450 }
              as: DealerAdmin
              captures: { t1: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v3}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v3}", treatment_option_id: "${t1}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v3}", units: 3 }
              as: SalesRep
              captures: { ln_a: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v3}", units: 3, treatment_option_id: "${t1}" }
              as: SalesRep
              captures: { ln_b: $.data.id }
          trigger:
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { o_gross: $.data.gross_amount_cents }
            - call: "GET /dealer/order-lines/${ln_a}"
              as: SalesRep
              captures: { a_dup: $.data.discounted_unit_price_cents, a_total: $.data.line_total_cents }
            - call: "GET /dealer/order-lines/${ln_b}"
              as: SalesRep
              captures: { b_total: $.data.line_total_cents }
          assert:
            - "line A discounted_unit_price_cents == 8779 (round_half_up(10005 x 0.8775) = round_half_up(8779.3875) per unit BEFORE multiply)"
            - "line A line_total_cents == 26337 (8779 x 3; multiply-first would give 26338)"
            - "line B line_total_cents == 27672 (26337 + 3 x 450 treatment adder, undiscounted)"
            - "order gross_amount_cents == 54009"

      - name: prepay_discount_on_pre_prepay_balance_not_on_amount_tendered
        grounds:
          - calculations.prepay_settlement
          - entities.SeedOrder.fields.prepay_discount_cents
          - entities.GrowerAccount.fields.prepay_balance_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the prepay
          discount is computed on the PRE-prepay net (5076000), and only then is the
          payment compared against the post-discount net due (4669920). Computing the 8%
          on the tendered amount instead would give 373594, not 406080.
        test_recipe:
          setup:
            - "Program (tier-3 early window still open at 2026-11-20 -> 600bps; prepay tiers 800bps by 2026-12-20 / 500bps by 2027-02-15; rebate tier at 500 units not reached) OPEN"
            - "Order of 300 units SOY-V2 confirmed 2026-11-20: per-unit 16920, gross 5076000, rebate 0"
            - "Clock advanced to 2026-12-01 (inside the 800bps prepay window)"
          setup_api_calls:
            - call: "POST /dealer/programs"
