            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_o2}", worker_id: "${worker_o2}", crew_role: "TICKETING", shift_start: "2026-09-04T20:00:00Z", shift_end: "2026-09-05T04:00:00Z" }
              as: LotBoss
              captures: { asg_o2b: $.data.id }
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_o2}", worker_id: "${worker_o2}", crew_role: "TICKETING", shift_start: "2026-09-04T19:00:00Z", shift_end: "2026-09-04T21:00:00Z" }
              as: LotBoss
              captures: { crew_overlap_error: $.data.error_id }
          assert:
