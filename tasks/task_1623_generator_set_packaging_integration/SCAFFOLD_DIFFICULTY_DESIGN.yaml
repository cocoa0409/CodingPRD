              as: SalesEngineer
              captures: { o9: $.data.id, o9v: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${o9}", engine_model_id: "${e9}", alternator_model_id: "${a9}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${o9v}" }
              as: ApplicationEngineer
              captures: { s9: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${s9}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${s9}/approve"
              payload: {}
              as: SalesEngineer
