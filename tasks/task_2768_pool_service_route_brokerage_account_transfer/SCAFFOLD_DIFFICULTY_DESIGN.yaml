        distinguishing_aspect: "Mode (b) - nested rounding whose evaluation ORDER changes the answer: the pinned order rounds collection_rate to 4 decimals per month, applies it per month, rounds each month to whole cents, and only then averages, giving verified_recurring_mrr_cents 11200; the rejected order (sum three months of billed amounts, average, then apply one aggregate rate of 0.8660) gives 11258, so the 58-cent gap is the discriminator."
