  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: renewal_failure_four_hop_cascade
        grounds:
          - state_machines.BillingAccount.CURRENT_to_PAST_DUE
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Entitlement.ACTIVE_to_SUSPENDED
          - state_machines.ServiceProfile.LINKED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-4 chain from trigger run_renewal(FAILED): BillingAccount
          CURRENT->PAST_DUE (hop 1) causes Subscription ACTIVE->PAST_DUE +
          PAID_UP->GRACE (hop 2), which causes its Entitlement
          ACTIVE->SUSPENDED (hop 3), which — being the profile's last ACTIVE
          entitlement — causes ServiceProfile LINKED->SUSPENDED (hop 4). Each
          hop is caused by the previous hop, not the trigger.
        test_recipe:
          setup:
            - "PLATFORM subscriber, ACTIVE DPLUS_ADS subscription with 1 ACTIVE entitlement on a LINKED DPLUS profile; clock at period end 2026-10-01"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "tc1@x.com", full_name: "TC One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /streaming/subscriptions/${sub_id}/entitlements"
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "FAILED" }
              as: PlatformAdmin
          assert:
            - "BillingAccount.${ba_id}.billing_status == PAST_DUE"
            - "BillingAccount.${ba_id}.consecutive_failure_count == 1"
            - "Subscription.${sub_id}.lifecycle_status == PAST_DUE"
            - "Subscription.${sub_id}.billing_dimension == GRACE"
            - "Entitlement.${ent_id}.entitlement_status == SUSPENDED"
            - "ServiceProfile.${prof_dplus}.profile_status == SUSPENDED"

      - name: migration_confirm_three_hop_cascade
        grounds:
          - state_machines.Migration.QUOTED_to_CONFIRMED
          - state_machines.Subscription.ACTIVE_to_MIGRATED_OUT
          - state_machines.Entitlement.ACTIVE_to_REVOKED
          - state_machines.Entitlement.PROVISIONING_to_ACTIVE
        distinguishing_aspect: |
          Different trigger (migration confirm, not renewal failure) and a
          two-branch depth-3 chain: confirm causes from-subscription
          ACTIVE->MIGRATED_OUT (hop 1) causing its entitlements
          ACTIVE->REVOKED (hop 2); in the parallel branch the new bundle
          subscription is created PENDING_ENTITLEMENT (hop 1'), its two
          entitlements spawn and provision PROVISIONING->ACTIVE (hop 2'), and
          their joint activation bubbles the new subscription
          PENDING_ENTITLEMENT->ACTIVE (hop 3') — verified end-to-end by the
          HULU profile (no prior entitlement) remaining LINKED.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS standalone; DUO_PREMIUM bundle plan; both profiles LINKED; migration quoted at 2026-09-06 and confirmed same instant"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_PREMIUM", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "tc2@x.com", full_name: "TC Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "HULU" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_hulu: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_from: $.data.id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/migrations"
              payload: { from_subscription_id: "${sub_from}", target_plan_code: "DUO_PREMIUM" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { mig_id: $.data.id, mig_v: $.data.version }
          trigger:
            - call: "POST /streaming/migrations/${mig_id}/confirm"
              payload: { expected_migration_version: "${mig_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_to: $.data.to_subscription_id }
          assert:
            - "Subscription.${sub_from}.lifecycle_status == MIGRATED_OUT"
            - "Subscription.${sub_to}.lifecycle_status == ACTIVE"
            - "Subscription.${sub_to}.plan_code == DUO_PREMIUM"
            - "GET /streaming/subscriptions/${sub_from}/entitlements shows every entitlement REVOKED"
            - "GET /streaming/subscriptions/${sub_to}/entitlements shows exactly 2 entitlements, both ACTIVE (services DPLUS and HULU)"
            - "ServiceProfile.${prof_dplus}.profile_status == LINKED"
            - "ServiceProfile.${prof_hulu}.profile_status == LINKED"

      - name: hard_failed_three_hop_cascade_with_redemption_void
        grounds:
          - state_machines.BillingAccount.PAST_DUE_to_HARD_FAILED
          - state_machines.Subscription.PAST_DUE_to_CANCELLED
          - state_machines.RetentionRedemption.ACTIVE_to_VOIDED
          - state_machines.Entitlement.SUSPENDED_to_REVOKED
        distinguishing_aspect: |
          Third distinct trigger (third consecutive renewal failure) with a
          depth-3 chain plus a parallel hop-2 branch: BillingAccount
          PAST_DUE->HARD_FAILED (hop 1) causes Subscription
          PAST_DUE->CANCELLED + GRACE->UNPAID (hop 2), causing the already
          SUSPENDED entitlement ->REVOKED (hop 3); via the second branch the ACTIVE
          RetentionRedemption is VOIDED (hop 2') and the subscription price
          recomputed to undiscounted.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS subscription carrying an ACTIVE retention redemption (SMALL100, 100c); three consecutive failed renewals via clock advance between runs (period never advances on failure, so consecutive_failure_count accumulates across runs at the same due period)"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/retention-offers"
              payload: { offer_code: "SMALL100", discount_cents: 100, duration_months: 3, max_redemptions_per_account: 1, eligible_biller_types: ["PLATFORM"], eligible_plan_kinds: ["STANDALONE"] }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "tc3@x.com", full_name: "TC Three" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/retention-redemptions"
              payload: { offer_code: "SMALL100" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { red_id: $.data.id }
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "FAILED" }
              as: PlatformAdmin
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "FAILED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/_billing/run_renewal"
              payload: { billing_account_id: "${ba_id}", outcome: "FAILED" }
              as: PlatformAdmin
          assert:
            - "BillingAccount.${ba_id}.billing_status == HARD_FAILED"
            - "BillingAccount.${ba_id}.consecutive_failure_count == 3"
            - "Subscription.${sub_id}.lifecycle_status == CANCELLED"
            - "Subscription.${sub_id}.billing_dimension == UNPAID"
            - "RetentionRedemption.${red_id}.redemption_status == VOIDED"
            - "GET /streaming/subscriptions/${sub_id}/entitlements shows every entitlement REVOKED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_biller_constraint_on_plan_change
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BILLER_PLAN_NOT_ALLOWED]
        distinguishing_aspect: |
          Error-category pair state (p6) vs business_constraint (p15): a
          plan-change on a CANCELLED subscription whose target plan is also
          not sellable through the APP_STORE biller violates both; the
          lower-priority-numbered state check wins and ERR_INVALID_STATE is
          returned, not ERR_BILLER_PLAN_NOT_ALLOWED.
        test_recipe:
          setup:
            - "APP_STORE-billed subscriber with DPLUS_ADS subscription cancelled (immediate not allowed for APP_STORE, so cancel at period end then advance clock past period_end to finalize); APP_STORE_ONLY plan HULU_PREMIUM_X with allow_app_store_billing=false"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "HULU_PREMIUM_X", plan_kind: "STANDALONE", service_scope: ["HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1299, allow_app_store_billing: false, allow_distributor_billing: false }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "pp1@x.com", full_name: "PP One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "APP_STORE", biller_reference: "store-receipt-1" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: false }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/plan-change"
              payload: { new_plan_code: "HULU_PREMIUM_X", expected_subscription_version: "${sub_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "error_id != ERR_BILLER_PLAN_NOT_ALLOWED"

      - name: existence_beats_safety_on_watchlist_add
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_MATURITY_RATING_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair existence (p4) vs business_safety (p8): adding
          a TV_MA title (which WOULD violate the kids-mode cap) to a
          non-existent profile id must return ERR_NOT_FOUND — the path
          existence check precedes the parental-control safety gate.
        test_recipe:
          setup:
            - "A subscriber exists; the addressed service-profile id is a well-formed but non-existent UUID"
          setup_api_calls:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "pp2@x.com", full_name: "PP Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /streaming/service-profiles/00000000-0000-0000-0000-000000000000/watchlist-items"
              payload: { title_id: "mature-film-1", title_maturity: "TV_MA" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"
            - "error_id != ERR_MATURITY_RATING_EXCEEDED"

      - name: account_state_beats_retention_business_rule
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_RETENTION_NOT_ELIGIBLE]
