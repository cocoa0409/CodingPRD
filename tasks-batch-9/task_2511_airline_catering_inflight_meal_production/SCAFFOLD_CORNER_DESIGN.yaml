          rationale: "That §1.8 instance fills a stand to max_concurrent_runs and asserts the code on the third overlapping run."

  # =========================================================================
  # Guide section 7 — From Table 7 (RBAC)
  # =========================================================================
  - section: rbac
    instances:

      - name: a_request_without_an_actor_header_is_unauthenticated_except_on_the_clock
        claim_type: cannot_perform
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Priority 10 runs before role checks and before path existence, so an unauthenticated read of a
          non-existent flight is 401 rather than 404. The clock endpoint is the single declared
          exemption, which is what lets a harness set time before creating any actor.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-12T09:00:00Z" }, as: NONE }
            - { call: "GET /airlines", payload: {}, as: NONE }
            - { call: "GET /flights/00000000-0000-4000-8000-000000000000", payload: {}, as: NONE }
            - { call: "POST /flights", payload: { airline_id: "00000000-0000-4000-8000-000000000000", flight_number: "AN411", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-AAA", station_code: "OSL" }, as: NONE }
          assert:
            - "call 1 succeeds with HTTP 200 and data.current_utc == \"2026-09-12T09:00:00Z\" despite the missing X-User-Role header"
            - "call 2 -> HTTP 401 ERR_UNAUTHENTICATED"
            - "call 3 -> HTTP 401 ERR_UNAUTHENTICATED, NOT 404 — priority 10 precedes the priority-40 path check"
            - "call 4 -> HTTP 401 ERR_UNAUTHENTICATED and no flight is created"

      - name: platform_admin_cannot_ingest_flights_and_the_schedule_operator_cannot_create_airlines
        claim_type: cannot_perform
        grounds:
          - validations[priority=20]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.PlatformAdmin.exclusive_operations
          - roles.ScheduleFeedOperator.exclusive_operations
        distinguishing_aspect: |
          Reference-data ownership and schedule ingestion are disjoint: neither role can borrow the
          other's write, and the 403 lands before the request body is validated, so an otherwise
          well-formed flight is still refused.
        test_recipe:
          setup:
            - "Airline AN exists."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
          trigger:
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN411", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-AAA", station_code: "OSL", pax_economy: 180 }, as: PlatformAdmin }
            - { call: "POST /airlines", payload: { name: "Interloper Air", iata_code: "IL", waste_regime: "DOMESTIC", cost_cap_per_pax_cents: 5000 }, as: ScheduleFeedOperator }
          assert:
            - "both calls return HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /flights with airline_id ${an_id} returns total_count == 0 and GET /airlines returns total_count == 1"

      - name: the_qa_officer_cannot_release_the_batch_it_certified
        claim_type: segregation_of_duties
        grounds:
          - roles.QaOfficer.exclusive_operations
          - validations[priority=20]
          - segregation_of_duties
        distinguishing_aspect: |
          The food-safety split is enforced by role, not by user id: the role that records temperatures
          may never certify, and the role that certifies may never record. Both crossings are plain
          priority-20 refusals, and the legitimate ProductionSupervisor release then succeeds.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch is COMPLETED with both required checks PASSing."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
          trigger:
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: QaOfficer }
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor, as_user_id: "ps_carol" }
          assert:
            - "call 1 -> HTTP 403 ERR_FORBIDDEN_ROLE; the batch stays \"COMPLETED\" with released_at null"
            - "call 2 -> HTTP 403 ERR_FORBIDDEN_ROLE; GET /haccp-checks with production_batch_id ${b_y_id} still returns total_count == 2"
            - "call 3 -> the batch is \"RELEASED\" with released_by_user_id \"ps_carol\""

      - name: the_load_master_who_sealed_a_cart_cannot_issue_its_manifest
        claim_type: segregation_of_duties
        grounds:
          - segregation_of_duties
          - validations[priority=85]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Here the split is by USER not by role: both actors are LoadMasters, so the priority-20 role
          check passes and the refusal is a priority-85 four-eyes rule comparing X-User-ID against
          Cart.sealed_by_user_id of every cart entering the snapshot. A second LoadMaster issues it fine.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with cart CHL-01 sealed by lm_alice and a DRAFT manifest created by lm_bob."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
          trigger:
            - { call: "POST /loading-manifests/${mf_id}/issue", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - *k_issue
          assert:
            - "call 1 -> HTTP 422 ERR_SEGREGATION_OF_DUTIES — lm_alice is Cart.${cart_id}.sealed_by_user_id"
            - "after call 1: LoadingManifest.${mf_id}.status == \"DRAFT\", issued_at null, and Flight.${f_id}.status == \"PLANNED\""
            - "call 2 by lm_bob -> LoadingManifest.${mf_id}.status == \"ISSUED\", issued_by_user_id \"lm_bob\", total_units 180, cart_seal_snapshot containing \"SEAL-AN411-01\""
            - "Flight.${f_id}.status == \"LOADED\" after call 2"

      - name: an_airline_rep_reading_another_airlines_flight_gets_an_airline_scope_violation
        claim_type: cannot_perform
        grounds:
          - roles.AirlineRep.identity
          - validations[priority=50]
          - errors[ERR_AIRLINE_SCOPE_VIOLATION]
        distinguishing_aspect: |
          AirlineRep is the one entity_backed role: X-User-ID IS an Airline.id, so scoping is data-driven
          rather than role-driven. The same endpoint, same payload and same role returns 403 for the
          wrong airline id and 200 for the right one — and this fires at priority 50, after the row was
          found, so it is a scope error rather than a 404.
        test_recipe:
          setup:
            - "Airlines AN (BONDED) and SB (DOMESTIC) both exist; flight AN411 belongs to AN."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - &k_air_sb { call: "POST /airlines", payload: { name: "Sunbridge", iata_code: "SB", waste_regime: "DOMESTIC", cost_cap_per_pax_cents: 6000 }, as: PlatformAdmin, captures: { sb_id: $.data.id } }
            - *k_spec_y
            - *k_flt
          trigger:
            - { call: "GET /flights/${f_id}", payload: {}, as: AirlineRep, as_user_id: "${sb_id}" }
            - { call: "GET /flights/${f_id}/cost-report", payload: {}, as: AirlineRep, as_user_id: "${sb_id}" }
            - { call: "GET /flights/${f_id}", payload: {}, as: AirlineRep, as_user_id: "${an_id}" }
          assert:
            - "calls 1 and 2 -> HTTP 403 with data.error_id == \"ERR_AIRLINE_SCOPE_VIOLATION\""
            - "call 3 -> HTTP 200 with data.id == ${f_id} and data.airline_id == ${an_id}"
            - "the refusal is scope, not existence: the very same path returned 200 for the owning airline"

      - name: both_audit_roles_may_open_findings_and_only_the_airline_may_withdraw_its_own
        claim_type: peer_roles
        grounds:
          - roles.AirlineRep.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - entities.AuditFinding.fields.source
          - state_machines.AuditFinding.ACCEPTED_to_WITHDRAWN
        distinguishing_aspect: |
          POST /audit-findings is the scaffold's only shared write, and the two peers are not
          interchangeable: the row records WHICH peer filed it in `source`. Withdrawal is exclusive to
          the airline, and withdrawing a still-OPEN finding decrements the open counter while leaving
          penalty_accrued_cents — which only tracks ACCEPTED findings — at zero.
        test_recipe:
          setup:
            - "Flight AN411 exists under airline AN, which has no findings."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
          trigger:
            - { call: "POST /audit-findings", payload: { airline_id: "${an_id}", flight_id: "${f_id}", finding_type: "LATE_DELIVERY", severity: "MINOR", evidence_ref: "AIRLINE-TICKET-9" }, as: AirlineRep, as_user_id: "${an_id}", captures: { f_air_id: $.data.id } }
            - { call: "POST /audit-findings", payload: { airline_id: "${an_id}", flight_id: "${f_id}", finding_type: "SPEC_DEVIATION", severity: "MINOR" }, as: ComplianceOfficer, captures: { f_sys_id: $.data.id } }
            - { call: "POST /audit-findings/${f_air_id}/resolution", payload: { action: "WITHDRAW", note: "raised in error" }, as: AirlineRep, as_user_id: "${an_id}" }
          assert:
            - "AuditFinding.${f_air_id}.source == \"AIRLINE\" with penalty_cents == 80000 == 80000 * 1.0"
            - "AuditFinding.${f_sys_id}.source == \"SYSTEM\" with penalty_cents == 120000 == 120000 * 1.0"
            - "after the two creates Airline.${an_id}.open_finding_count == 2 and penalty_accrued_cents == 0"
            - "after the withdrawal AuditFinding.${f_air_id}.status == \"WITHDRAWN\" (terminal), open_finding_count == 1, penalty_accrued_cents == 0"
            - "GET /audit-findings with airline_id ${an_id} and source \"SYSTEM\" returns total_count == 1"

      - name: the_compliance_officer_cannot_withdraw_a_finding_it_does_not_own
        claim_type: cannot_perform
        grounds:
          - roles.AirlineRep.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - validations[priority=20]
        distinguishing_aspect: |
          The resolution endpoint admits both roles but partitions the ACTIONS: DISPUTE and ACCEPT are
          the compliance officer's, WITHDRAW is the airline's. So the same endpoint and the same role
          are allowed or refused depending on the action string in the body.
        test_recipe:
          setup:
            - "One OPEN SPEC_DEVIATION MINOR finding exists against airline AN."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - { call: "POST /audit-findings", payload: { airline_id: "${an_id}", flight_id: "${f_id}", finding_type: "SPEC_DEVIATION", severity: "MINOR" }, as: ComplianceOfficer, captures: { find_id: $.data.id } }
          trigger:
            - { call: "POST /audit-findings/${find_id}/resolution", payload: { action: "WITHDRAW", note: "not our fault" }, as: ComplianceOfficer }
            - { call: "POST /audit-findings/${find_id}/resolution", payload: { action: "ACCEPT", note: "conceded" }, as: ComplianceOfficer }
          assert:
            - "call 1 -> HTTP 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\"; the finding stays \"OPEN\""
            - "call 2 on the same endpoint with the same role -> the finding becomes \"ACCEPTED\""
            - "Airline.${an_id}.open_finding_count == 0 and penalty_accrued_cents == 120000 after the ACCEPT"

  # =========================================================================
  # Guide section 8 — Cross-cutting complexity layers
  # =========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: a_manifest_create_with_a_superseded_flight_version_is_refused_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.manifest-create-stale-flight
          - errors[ERR_STALE_FLIGHT_VERSION]
          - validations[priority=65]
        distinguishing_aspect: |
          The guard compares the submitted expected_flight_version against the row's current version:
          a delay recorded between the read and the write bumps the flight, so the held version is
          superseded and the create is refused with 412 — then the retry with a freshly read version
          succeeds, proving the refusal left no partial manifest.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with cart CHL-01 built and sealed; the LoadMaster has read Flight.version."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - { call: "POST /flights/${f_id}/delays", payload: { delay_minutes: 10, reason: "ATC_SLOT" }, as: ScheduleFeedOperator }
          trigger:
            - { call: "POST /flights/${f_id}/loading-manifests", payload: { expected_flight_version: "${f_v1}" }, as: LoadMaster, as_user_id: "lm_bob" }
            - *k_getflt
            - *k_mfst
          assert:
            - "call 1 -> HTTP 412 with data.error_id == \"ERR_STALE_FLIGHT_VERSION\""
            - "GET /loading-manifests with flight_id ${f_id} returns total_count == 0 after call 1"
            - "the re-read version is exactly one higher than ${f_v1} and the cumulative delay of 10 minutes did not reslot anything"
            - "call 3 -> LoadingManifest.${mf_id}.status == \"DRAFT\" with flight_id ${f_id}"

      - name: an_uplift_create_holding_a_pre_departure_flight_version_is_refused_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.uplift-create-stale-flight
          - errors[ERR_STALE_FLIGHT_VERSION]
          - state_machines.Flight.DEPARTED_to_RECONCILED
        distinguishing_aspect: |
          Between the manifest read and the reconciliation the flight advanced twice (issue then
          departure), so a version captured before issue is two behind. The 412 protects the billing
          snapshot: an uplift computed against a pre-departure view of the flight is never written.
        test_recipe:
          setup:
            - "Flight AN411 was issued, delivered on time and is DEPARTED; the compliance officer still holds the version read at 07:00, before the issue."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
            - *k_run
            - *k_clk_disp
            - *k_disp
            - *k_clk_arr
            - *k_arr
            - *k_clk_del
            - *k_del
            - *k_clk_upl
          trigger:
            - { call: "POST /flights/${f_id}/uplift-records", payload: { expected_flight_version: "${f_v1}", lines: [{ meal_specification_id: "${spec_y_id}", consumed_units: 170, returned_units: 10 }] }, as: ComplianceOfficer }
            - *k_getflt2
            - *k_upl
          assert:
            - "call 1 -> HTTP 412 ERR_STALE_FLIGHT_VERSION; Flight.${f_id}.status is still \"DEPARTED\" and no UpliftRecord exists"
            - "${f_v2} is greater than ${f_v1} — the issue and the departure each bumped the flight"
            - "call 3 -> UpliftRecord.${upl_id}.status \"DRAFT\", gross_cost_cents 292320, and Flight.${f_id}.status == \"RECONCILED\""

      - name: a_seal_write_holding_a_pre_build_cart_version_is_refused_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.seal-create-stale-cart
          - errors[ERR_STALE_CART_VERSION]
          - state_machines.Cart.BUILDING_to_BUILT
        distinguishing_aspect: |
          The cart is the second OCC-guarded row and it carries its own error code. Signing off the
          build bumps Cart.version, so a seal_number submitted with the version read before build
          completion is refused — even though at that moment the cart IS in the BUILT state the seal
          requires, isolating the OCC failure from the state failure.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with 180 released units loaded into cart CHL-01, whose version was read while it was still BUILDING."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_v_pre: $.data.version } }
            - *k_build
          trigger:
            - { call: "POST /carts/${cart_id}/seals", payload: { expected_cart_version: "${cart_v_pre}", seal_number: "SEAL-AN411-01" }, as: LoadMaster, as_user_id: "lm_alice" }
            - *k_getcart
            - *k_seal
          assert:
            - "call 1 -> HTTP 412 with data.error_id == \"ERR_STALE_CART_VERSION\""
            - "after call 1 Cart.${cart_id}.seal_status == \"UNSEALED\", seal_number null, seal_count == 0 — the seal number was not consumed"
            - "${cart_v1} is exactly one higher than ${cart_v_pre}"
            - "call 3 -> Cart.${cart_id}.seal_status == \"SEALED\" with seal_number \"SEAL-AN411-01\" and sealed_by_user_id \"lm_alice\""

      - name: every_accepted_write_advances_the_version_including_cascaded_rows
        claim_type: version_increment
        grounds:
          - complexity_profile.concurrency_control
          - entities.Cart.fields.version
          - entities.Flight.fields.version
        distinguishing_aspect: |
          version is monotone per row and a cascade counts as a write on the cascaded row too: adding a
          cart item bumps both the Cart and the Flight it rolls up into, while a REFUSED write bumps
          nothing. The assertions are relative so they hold regardless of how many earlier hops the
          fixture took.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with a RELEASED 180-unit batch and an empty cart CHL-01."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { f_v_before: $.data.version } }
            - { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_v_before: $.data.version } }
          trigger:
            - *k_item
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { f_v_after: $.data.version } }
            - { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_v_after: $.data.version } }
            - { call: "POST /carts/${cart_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 999 }, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_v_final: $.data.version } }
          assert:
            - "${cart_v_after} == ${cart_v_before} + 1 — the direct write bumped the cart"
            - "${f_v_after} == ${f_v_before} + 1 — the roll-up into units_loaded bumped the flight too"
            - "the GET responses show updated_at refreshed on both rows while created_at is unchanged"
            - "the 999-unit call -> HTTP 422 ERR_CART_CAPACITY_EXCEEDED and ${cart_v_final} == ${cart_v_after} — a refused write never advances the version"
            - "the newly created CartItem itself has version == 1"

      - name: the_manifest_snapshot_is_pinned_at_issue_and_only_a_re_issue_re_pins_it
            # version-pinning-on-approval layer, plus the seal_mismatch_count consequence
        claim_type: version_pinning_on_approval
        grounds:
          - entities.LoadingManifest.fields.cart_seal_snapshot
          - state_machines.LoadingManifest.ISSUED_to_AMENDED
          - entities.UpliftRecord.fields.seal_mismatch_count
        distinguishing_aspect: |
          Issuing freezes the seal list. Re-sealing the cart afterwards moves the live cart to
          SEAL-AN411-02 while the snapshot still reads SEAL-AN411-01 — the manifest goes AMENDED and the
          flight drops back to PLANNED rather than the snapshot quietly following. Re-issuing re-pins the
          snapshot without re-counting the amendment, and at arrival a ramp report that matches neither
          seal produces exactly one mismatch and a MAJOR finding.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED: cart CHL-01 sealed by lm_alice as SEAL-AN411-01 and the manifest issued by lm_bob at 07:00."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_truck1
            - *k_stand1
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:05:00Z" }, as: PlatformAdmin }
            - { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_v2: $.data.version } }
            - { call: "POST /carts/${cart_id}/seals", payload: { expected_cart_version: "${cart_v2}", seal_number: "SEAL-AN411-02" }, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T07:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /loading-manifests/${mf_id}/issue", payload: {}, as: LoadMaster, as_user_id: "lm_bob" }
            - *k_run
            - *k_clk_disp
            - *k_disp
            - *k_clk_arr
            - *k_arr
            - *k_clk_del
            - *k_del
            - *k_clk_upl
            - *k_getflt2
            - { call: "POST /flights/${f_id}/uplift-records", payload: { expected_flight_version: "${f_v2}", lines: [{ meal_specification_id: "${spec_y_id}", consumed_units: 170, returned_units: 10 }], observed_seals: ["SEAL-AN411-99"] }, as: ComplianceOfficer, captures: { upl2_id: $.data.id } }
          assert:
            - "after the reseal: Cart.${cart_id}.seal_status == \"RESEALED\", seal_number \"SEAL-AN411-02\", seal_count == 2, build_status still \"BUILT\""
            - "after the reseal: LoadingManifest.${mf_id}.status == \"AMENDED\", amendment_count == 1, and cart_seal_snapshot STILL contains \"SEAL-AN411-01\" — the pinned snapshot did not follow the cart"
            - "after the reseal: Flight.${f_id}.status == \"PLANNED\""
            - "after the re-issue: status \"ISSUED\", cart_seal_snapshot now contains \"SEAL-AN411-02\", amendment_count still == 1, issued_at \"2026-09-15T07:10:00Z\", Flight.${f_id}.status == \"LOADED\""
            - "UpliftRecord.${upl2_id}.seal_mismatch_count == 1 — the single snapshot entry SEAL-AN411-02 is absent from the observed list"
            - "GET /audit-findings with flight_id ${f_id} returns exactly one row: SEAL_MISMATCH, MAJOR, source SYSTEM, penalty_cents 500000; spec_deviation_pct is 0.00 so no SPEC_DEVIATION finding was raised"

      - name: a_post_release_haccp_failure_propagates_four_hops
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProductionBatch.RELEASED_to_REJECTED
        excluded_because:
          difficulty_instance: transitive_cascade / post_release_haccp_fail_cascades_batch_to_cart_to_manifest_to_flight
          rationale: "That §1.8 instance walks the batch -> cart item -> cart seal -> manifest -> flight chain from a single failing check and asserts every hop."

      - name: the_two_uplift_cost_variants_coexist_on_one_record
        claim_type: dual_variant_calculation
        grounds:
          - calculations.uplift_cost_reconciliation
        excluded_because:
          difficulty_instance: dual_variant_calc / bonded_uplift_net_cost_cannot_diverge_from_gross_uplifted
          rationale: "That §1.8 instance contrasts a BONDED and a DOMESTIC airline on identical uplifts to show where the two variants must and must not agree."

  # =========================================================================
  # Guide section 9 — Consistency model
  # =========================================================================
  - section: consistency model
    instances:

      - name: every_cascaded_field_is_already_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - endpoints.DELETE_/carts/{id}/items/{cart_item_id}
        distinguishing_aspect: |
          The model is `immediate`: there is no queue, no eventual settle and no re-read requirement.
          One DELETE reverses a cart, a manifest and a flight, and the mutating response itself already
          shows the item VOID while GETs issued straight afterwards — with no clock movement and no
          other traffic — show every cascaded row in its final state.
        test_recipe:
          setup:
            - "Flight AN411 is LOADED with an ISSUED manifest and one 180-unit item in the sealed cart CHL-01."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_item
            - *k_build
            - *k_getcart
            - *k_seal
            - *k_clk_mfst
            - *k_getflt
            - *k_mfst
            - *k_issue
          trigger:
            - { call: "DELETE /carts/${cart_id}/items/${item_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /carts/${cart_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /loading-manifests/${mf_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "GET /flights/${f_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "the DELETE response body itself already carries status \"VOID\" and voided_at \"2026-09-15T07:00:00Z\""
            - "the immediately following cart read shows build_status \"BUILDING\", seal_status \"BROKEN\" and loaded_units 0 with no intervening call"
            - "the manifest read shows status \"AMENDED\" and amendment_count 1"
            - "the flight read shows status \"PLANNED\", units_loaded 0, unit_balance 180 and cost_per_pax_cents 0"
            - "no retry, poll or clock advance was needed between the write and any of the three reads"
