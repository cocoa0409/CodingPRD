# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Domain: Biosolids Management & Land Application (wastewater treatment utility)
scenario: |
  2801. Biosolids Management & Land Application (wastewater treatment utility): solids processing
  through thickening, digestion and dewatering with volatile solids reduction requirements,
  pathogen and vector attraction reduction demonstration by chosen process option with
  documentation, biosolids quality testing for metals and other parameters against pollutant
  ceiling and concentration limits, land application site permitting with agronomic rate
  calculation, setbacks and site restrictions, farmer agreements, application scheduling around
  crop cycles and weather, hauling logistics and storage capacity for wet weather periods,
  alternative outlets including composting, landfill and thermal processing with cost comparison,
  recordkeeping, annual reporting and public communication about odor and emerging contaminant
  concerns

domain_name: biosolids-land-application

# Flat, root-level resource paths: every collection is addressed directly under "/" and
# cross-entity links are foreign keys in request bodies / query filters, not URL nesting.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # graph: ApplicationEvent is a 3-way junction over (LandApplicationSite x SolidsBatch x
  # FarmerAgreement); LoadingLedgerEntry is self-referential via reversal_of_id; PollutantLimit
  # is a shared configuration node referenced by value (analyte) from LabResult and by the
  # loading calculations of every site. No entity is addressed through a nested URL path.

  state_machine_shape: parallel
  # SolidsBatch carries two independent state dimensions on one row (process_status x
  # quality_status). FarmerAgreement is cyclic (PROPOSED -> COUNTERED -> PROPOSED, bounded).
  # ApplicationEvent has revert loops (WEATHER_HOLD/DEFERRED -> SCHEDULED) plus a compensating
  # COMPLETED -> VOIDED edge. OdorComplaint is a fork-join with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer user id that certified a SolidsBatch may not be the ComplianceOfficer
  # user id that closes out an ApplicationEvent consuming that batch. Agronomist proposes site
  # permits and agreements; ComplianceOfficer decides them; Farmer counters and signs.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Density notes: 13 entities / 74 endpoints, but the challenge lives in (a) two divergent
  # volatile-solids-reduction algorithms over identical inputs, (b) a four-input nested-min
  # agronomic rate whose binding constraint must be named, (c) a per-hectare cumulative
  # pollutant loading ledger that must round at write time and never re-round the sum, (d) a
  # four-hop cascade from event close-out to facility posture, and (e) two conserved quantities
  # (dry tons, kg/ha loading) that compensating actions must restore exactly.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: TreatmentFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Utility plant name"
        constraints: "1..120 chars, non-blank"
      - name: npdes_permit_number
        type: string
        source: input
        description: "State discharge permit number carried on every annual report"
        constraints: "unique across TreatmentFacility"
      - name: storage_capacity_wet_tons
        type: number
        source: input
        description: "Total covered cake-pad storage capacity in wet tons"
        constraints: "> 0"
      - name: daily_production_wet_tons
        type: number
        source: input
        description: "Steady-state dewatered cake production per calendar day, wet tons"
        constraints: ">= 0"
      - name: loadout_bay_count
        type: integer
        source: input
        description: "Number of truck loadout bays; caps concurrent HaulTicket occupation"
        constraints: ">= 1"
      - name: storage_used_wet_tons
        type: number
        source: computed
        description: "Wet tons currently on the cake pad; maintained by calculations.storage_ledger"
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: storage_utilization_pct
        type: number
        source: computed
        description: "round(storage_used_wet_tons / storage_capacity_wet_tons * 100, 2)"
        default: 0
        constraints: "2 decimal places"
      - name: open_ceiling_exceedance_count
        type: integer
        source: computed
        description: "Count of SolidsBatch rows for this facility with ceiling_exceedance_flag == true AND quality_status == REJECTED"
        default: 0
      - name: substantiated_complaint_count_30d
        type: integer
        source: computed
        description: "Count of OdorComplaint rows for this facility with status == SUBSTANTIATED and received_at >= clock_now - 30 days"
        default: 0
      - name: days_of_capacity
        type: integer
        source: computed
        description: "Output of calculations.storage_drawdown_projection; 9999 sentinel when net drawdown is non-positive"
        default: 9999
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over child operations; output of calculations.facility_posture"
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"

  - name: PollutantLimit
    parent: null
    common_fields: true
    fields:
      - name: analyte
        type: enum
        source: input
        description: "Regulated parameter this limit row governs"
        constraints: "one of ARSENIC, CADMIUM, COPPER, LEAD, MERCURY, MOLYBDENUM, NICKEL, SELENIUM, ZINC, PFOS"
      - name: ceiling_mg_kg
        type: number
        source: input
        description: "Absolute pollutant ceiling concentration, dry-weight mg/kg; any exceedance disqualifies the batch"
        constraints: "> 0"
      - name: monthly_avg_mg_kg
        type: number
        source: input
        description: "High-quality (pollutant concentration) limit, dry-weight mg/kg; null when the analyte has no concentration limit"
        constraints: "null or > 0"
      - name: aplr_kg_per_hectare_yr
        type: number
        source: input
        description: "Annual pollutant loading rate cap, kg/ha/calendar-year; null when the analyte has no APLR"
        constraints: "null or > 0"
      - name: cplr_kg_per_hectare
        type: number
        source: input
        description: "Cumulative pollutant loading rate cap, kg/ha for the life of the site; null when the analyte has no CPLR"
        constraints: "null or > 0"
      - name: advisory_threshold_mg_kg
        type: number
        source: input
        description: "Emerging-contaminant advisory screening level, dry-weight mg/kg; null when no advisory exists"
        constraints: "null or > 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; flips to SUPERSEDED when a newer ACTIVE row for the same analyte is created"
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED"

  - name: SolidsBatch
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> TreatmentFacility.id; the plant that produced this batch"
      - name: batch_code
        type: string
        source: input
        description: "Operator-assigned batch label"
        constraints: "unique per facility_id"
      - name: process_status
        type: enum
        source: system
        description: "Solids-train dimension; independent of quality_status"
        default: THICKENED
        constraints: "one of THICKENED, DIGESTED, DEWATERED"
      - name: quality_status
        type: enum
        source: system
        description: "Laboratory/compliance dimension; independent of process_status"
        default: UNTESTED
        constraints: "one of UNTESTED, PENDING_RESULTS, QUALIFIED, REJECTED"
      - name: disposition
        type: enum
        source: computed
        description: "Derived from unallocated_dry_tons and child rows; HELD when nothing is committed, PARTIALLY_COMMITTED when some tonnage is reserved or applied, FULLY_COMMITTED when unallocated_dry_tons == 0"
        default: HELD
        constraints: "one of HELD, PARTIALLY_COMMITTED, FULLY_COMMITTED"
      - name: wet_tons
        type: number
        source: input
        description: "Wet tons of thickened solids entering the train; added to facility storage on creation"
        constraints: "> 0, 2 decimal places"
      - name: dry_tons_in
        type: number
        source: input
        description: "Dry solids mass entering digestion, short tons"
        constraints: "> 0, 3 decimal places"
      - name: volatile_solids_in_pct
        type: number
        source: input
        description: "Volatile solids as percent of total solids entering digestion"
        constraints: "> 0 and < 100, 2 decimal places"
      - name: dry_tons_out
        type: number
        source: input
        description: "Dry solids mass leaving digestion, short tons; supplied on the DIGESTED transition"
        constraints: "null until DIGESTED; then > 0 and <= dry_tons_in"
      - name: volatile_solids_out_pct
        type: number
        source: input
        description: "Volatile solids as percent of total solids leaving digestion; supplied on the DIGESTED transition"
        constraints: "null until DIGESTED; then > 0 and < volatile_solids_in_pct"
      - name: detention_days
        type: number
        source: input
        description: "Mean cell residence time in the digester, days; supplied on the DIGESTED transition"
        constraints: "null until DIGESTED; then > 0"
      - name: digester_temp_c
        type: number
        source: input
        description: "Mean operating temperature of the digester in Celsius; supplied on the DIGESTED transition"
        constraints: "null until DIGESTED; then > 0"
      - name: percent_solids
        type: number
        source: input
        description: "Cake total-solids percent after dewatering; supplied on the DEWATERED transition"
        constraints: "null until DEWATERED; then > 0 and < 100"
      - name: stabilization_process
        type: enum
        source: input
        description: "Stabilization route; selects the first-year nitrogen mineralization constant"
        constraints: "one of ANAEROBIC_DIGESTION, COMPOSTED, LIME_STABILIZED"
      - name: pathogen_option
        type: enum
        source: input
        description: "Chosen pathogen-reduction demonstration option"
        constraints: "one of PSRP_ALT1_TIME_TEMP, PSRP_ALT3_FECAL_COLIFORM, PFRP_ALT1_TIME_TEMP"
      - name: fecal_coliform_mpn_per_g
        type: number
        source: input
        description: "Geometric-mean fecal coliform density, MPN per gram dry weight; required evidence for PSRP_ALT3_FECAL_COLIFORM and PFRP_ALT1_TIME_TEMP"
        constraints: "null or >= 0"
      - name: salmonella_mpn_per_4g
        type: number
        source: input
        description: "Salmonella density, MPN per 4 grams dry weight; required evidence for PFRP_ALT1_TIME_TEMP"
        constraints: "null or >= 0"
      - name: vector_option
        type: enum
        source: input
        description: "Chosen vector attraction reduction option; options 9 and 10 are demonstrated at application time, not at the plant"
        constraints: "one of VAR_OPTION_1_VSR, VAR_OPTION_3_SOUR, VAR_OPTION_5_AEROBIC, VAR_OPTION_9_INJECTION, VAR_OPTION_10_INCORPORATION"
      - name: sour_mg_o2_per_g_hr
        type: number
        source: input
        description: "Specific oxygen uptake rate, mg O2 per gram total solids per hour; required evidence for VAR_OPTION_3_SOUR"
        constraints: "null or >= 0"
      - name: aerobic_process_days
        type: number
        source: input
        description: "Days of aerobic processing at 40 C or above; required evidence for VAR_OPTION_5_AEROBIC"
        constraints: "null or >= 0"
      - name: vsr_pct_van_kleeck
        type: number
        source: computed
        description: "Volatile solids reduction by the Van Kleeck fraction formula; the compliance-binding variant"
        constraints: "null until DIGESTED; 2 decimal places"
      - name: vsr_pct_mass_balance
        type: number
        source: computed
        description: "Volatile solids reduction by the mass-balance formula; the reported operations variant"
        constraints: "null until DIGESTED; 2 decimal places"
      - name: pathogen_class
        type: enum
        source: computed
        description: "Output of calculations.pathogen_class_determination"
        default: NONE
        constraints: "one of NONE, CLASS_B, CLASS_A"
      - name: vector_demonstrated_at_batch
        type: boolean
        source: computed
        description: "true when vector_option is one of VAR_OPTION_1_VSR, VAR_OPTION_3_SOUR, VAR_OPTION_5_AEROBIC and its evidence passes; false for VAR_OPTION_9_INJECTION and VAR_OPTION_10_INCORPORATION which defer to ApplicationEvent"
        default: false
      - name: ceiling_exceedance_flag
        type: boolean
        source: computed
        description: "true when any LabResult child of this batch has exceeds_ceiling == true"
        default: false
      - name: nh4_n_mg_kg
        type: number
        source: input
        description: "Ammonium-nitrogen in the nutrient panel accompanying the batch, dry-weight mg/kg; input to the nitrogen-limited agronomic rate"
        constraints: ">= 0"
      - name: organic_n_mg_kg
        type: number
        source: input
        description: "Organic nitrogen in the nutrient panel, dry-weight mg/kg; mineralized by the stabilization factor"
        constraints: ">= 0"
      - name: nitrate_n_mg_kg
        type: number
        source: input
        description: "Nitrate-nitrogen in the nutrient panel, dry-weight mg/kg; fully plant available"
        constraints: ">= 0"
      - name: total_p_mg_kg
        type: number
        source: input
        description: "Total phosphorus in the nutrient panel, dry-weight mg/kg; input to the phosphorus-limited agronomic rate"
        constraints: "> 0"
      - name: dry_tons_produced
        type: number
        source: computed
        description: "Set to dry_tons_out on the DEWATERED transition; the conserved dry-tons quantity for this batch"
        default: 0
        constraints: "3 decimal places"
      - name: unallocated_dry_tons
        type: number
        source: computed
        description: "dry_tons_produced minus reserved, applied and diverted tonnage; see calculations.dry_tons_conservation"
        default: 0
        constraints: ">= 0, 3 decimal places"
      - name: retest_round
        type: integer
        source: computed
        description: "Increments by 1 on every REJECTED -> PENDING_RESULTS retest transition; starts at 0"
        default: 0
      - name: rejection_reason
        type: string
        source: computed
        description: "Populated on the transition into REJECTED; one of CEILING_EXCEEDED, VSR_BELOW_MINIMUM"
        constraints: "null unless quality_status == REJECTED"
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into QUALIFIED"
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that certified the batch; the segregation-of-duties key checked at event close-out"

  - name: LabResult
    parent: SolidsBatch
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> SolidsBatch.id; the batch this analysis characterizes"
      - name: analyte
        type: enum
        source: input
        description: "Regulated parameter measured; matched by value to the ACTIVE PollutantLimit row for the same analyte"
        constraints: "one of ARSENIC, CADMIUM, COPPER, LEAD, MERCURY, MOLYBDENUM, NICKEL, SELENIUM, ZINC, PFOS"
      - name: concentration_mg_kg
        type: number
        source: input
        description: "Measured dry-weight concentration, mg/kg"
        constraints: ">= 0, 3 decimal places"
      - name: sampling_event_index
        type: integer
        source: input
        description: "Sampling round this result belongs to; must equal SolidsBatch.retest_round at post time"
        constraints: ">= 0"
      - name: analyzed_at
        type: datetime
        source: input
        description: "Laboratory analysis timestamp, ISO 8601 UTC"
      - name: method_code
        type: string
        source: input
        description: "Analytical method identifier recorded for the annual report"
        constraints: "1..32 chars"
      - name: exceeds_ceiling
        type: boolean
        source: computed
        description: "true when concentration_mg_kg > PollutantLimit.ceiling_mg_kg of the ACTIVE row for this analyte"
        default: false
      - name: exceeds_monthly_avg
        type: boolean
        source: computed
        description: "true when PollutantLimit.monthly_avg_mg_kg is not null and concentration_mg_kg > monthly_avg_mg_kg"
        default: false
      - name: advisory_exceeded
        type: boolean
        source: computed
        description: "true when PollutantLimit.advisory_threshold_mg_kg is not null and concentration_mg_kg > advisory_threshold_mg_kg"
        default: false

  - name: LandApplicationSite
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> TreatmentFacility.id; the utility that holds the site permit"
      - name: site_code
        type: string
        source: input
        description: "Field identifier used on manifests"
        constraints: "unique per facility_id"
      - name: acres
        type: number
        source: input
        description: "Permitted application acreage"
        constraints: "> 0, 2 decimal places"
      - name: crop_type
        type: enum
        source: input
        description: "Crop grown on the field; drives the crop cycle window"
        constraints: "one of CORN, SOYBEAN, HAY, SMALL_GRAIN, PASTURE"
      - name: crop_n_demand_lb_per_acre
        type: number
        source: input
        description: "Agronomic nitrogen requirement of the crop, lb N per acre per season"
        constraints: "> 0"
      - name: crop_p_removal_lb_per_acre
        type: number
        source: input
        description: "Crop phosphorus removal, lb P per acre per season; used only when soil_p_index is in the 75..99 tier"
        constraints: "> 0"
      - name: soil_p_index
        type: number
        source: input
        description: "State phosphorus index score for the field"
        constraints: ">= 0"
      - name: soil_ph
        type: number
        source: input
        description: "Field soil pH; must be >= 6.0 for a Class B site permit"
        constraints: "> 0 and <= 14, 1 decimal place"
      - name: depth_to_groundwater_ft
        type: number
        source: input
        description: "Depth to seasonal high groundwater, feet; must be >= 3.0 for a site permit"
        constraints: "> 0"
      - name: slope_pct
        type: number
        source: input
        description: "Mean field slope percent; must be <= 15.0 for surface application"
        constraints: ">= 0"
      - name: setback_to_well_ft
        type: number
        source: input
        description: "Distance to the nearest potable well, feet"
        constraints: ">= 0"
      - name: setback_to_surface_water_ft
        type: number
        source: input
        description: "Distance to the nearest surface water, feet"
        constraints: ">= 0"
      - name: nearest_residence_ft
        type: number
        source: input
        description: "Distance to the nearest occupied dwelling, feet; below 1500 the precautionary odor variant becomes the gating score"
        constraints: ">= 0"
      - name: reapplication_interval_days
        type: integer
        source: input
        description: "Minimum days that must elapse after a COMPLETED event's window_end before another window may start on this site"
        default: 30
        constraints: ">= 0"
      - name: allowed_application_months
        type: array
        source: input
        description: "Calendar month numbers in which application is agronomically permitted on this site"
        constraints: "non-empty array of integers 1..12, strictly ascending, no duplicates"
      - name: status
        type: enum
        source: system
        description: "Site permit lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, PERMITTED, RESTRICTED, CLOSED"
      - name: permit_number
        type: string
        source: system
        description: "Assigned on the transition into PERMITTED; null before"
      - name: permitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into PERMITTED"
      - name: restriction_reason
        type: string
        source: computed
        description: "Populated on the transition into RESTRICTED; one of CPLR_HEADROOM_LOW, ODOR_RISK_HIGH, OFFICER_ORDER"
        constraints: "null unless status == RESTRICTED"
      - name: cumulative_loading_kg_per_hectare
        type: object
        source: computed
        description: "Map of analyte -> kg/ha summed from LoadingLedgerEntry rows for this site; see calculations.cumulative_loading_ledger"
        default: {}
      - name: annual_loading_kg_per_hectare
        type: object
        source: computed
        description: "Map of 'YYYY:ANALYTE' -> kg/ha summed from LoadingLedgerEntry rows for this site in that applied_year"
        default: {}
      - name: pfas_advisory_flag
        type: boolean
        source: computed
        description: "true when at least one COMPLETED ApplicationEvent on this site consumed a SolidsBatch having a LabResult with analyte == PFOS and advisory_exceeded == true"
        default: false
      - name: odor_risk_score_historical
        type: number
        source: computed
        description: "Substantiated-only odor variant; output of calculations.site_odor_risk_score"
        default: 0
        constraints: "0..100, 2 decimal places"
      - name: odor_risk_score_precautionary
        type: number
        source: computed
        description: "Open-plus-substantiated odor variant with PFAS multiplier; output of calculations.site_odor_risk_score"
        default: 0
        constraints: "0..100, 2 decimal places"
      - name: gating_risk_score
        type: number
        source: computed
        description: "odor_risk_score_precautionary when nearest_residence_ft < 1500, otherwise odor_risk_score_historical"
        default: 0
        constraints: "0..100, 2 decimal places"
      - name: latest_rainfall_in_24h
        type: number
        source: system
        description: "Most recent recorded 24-hour rainfall at the field, inches; written by POST /_weather/observations"
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: latest_forecast_rainfall_in_48h
        type: number
        source: system
        description: "Most recent recorded 48-hour forecast rainfall at the field, inches; written by POST /_weather/observations"
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: latest_frozen_ground
        type: boolean
        source: system
        description: "Most recent recorded frozen/snow-covered ground observation at the field; written by POST /_weather/observations"
        default: false
      - name: latest_weather_observed_at
        type: datetime
        source: system
        description: "Observation timestamp of the most recent weather record written for this field; null when none was ever written"
      - name: weather_clearance_ok
        type: boolean
        source: computed
        description: "true when latest_rainfall_in_24h < 0.50 AND latest_forecast_rainfall_in_48h < 1.00 AND latest_frozen_ground == false"
        default: true

  - name: FarmerAgreement
    parent: LandApplicationSite
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> LandApplicationSite.id; the field this agreement covers"
      - name: farmer_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the Farmer party entitled to counter, sign and terminate this agreement"
      - name: farm_name
        type: string
        source: input
        description: "Counterparty farm business name"
        constraints: "1..120 chars"
      - name: term_start
        type: datetime
        source: input
        description: "First instant of agreement coverage, ISO 8601 UTC"
      - name: term_end
        type: datetime
        source: input
        description: "Exclusive last instant of agreement coverage, ISO 8601 UTC"
        constraints: "> term_start"
      - name: max_dry_tons_per_acre
        type: number
        source: input
        description: "Contractual per-acre application cap negotiated with the farmer; one of the four inputs to the agronomic rate cap"
        constraints: "> 0, 2 decimal places"
      - name: notice_days
        type: integer
        source: input
        description: "Advance notice the utility owes the farmer before an application window may start"
        default: 14
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Negotiation and coverage lifecycle; PROPOSED and COUNTERED form a bounded cycle"
        default: DRAFT
        constraints: "one of DRAFT, PROPOSED, COUNTERED, SIGNED, ACTIVE, TERMINATED, EXPIRED, WITHDRAWN"
      - name: round_index
        type: integer
        source: computed
        description: "Increments by 1 on every PROPOSED -> COUNTERED transition; the cycle bound is 3"
        default: 0
      - name: last_proposed_by_role
        type: enum
        source: system
        description: "Role that made the standing offer"
        default: NONE
        constraints: "one of NONE, Agronomist, Farmer"
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into SIGNED"
      - name: terminated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into TERMINATED"
      - name: termination_reason
        type: string
        source: input
        description: "Free-text reason recorded on termination"

  - name: ApplicationEvent
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> LandApplicationSite.id; the field receiving the biosolids"
      - name: batch_id
        type: string
        source: input
        description: "FK -> SolidsBatch.id; the certified batch whose tonnage this event reserves"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FarmerAgreement.id; the agreement authorizing application on the site"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive first instant of the application window, ISO 8601 UTC"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive last instant of the application window, ISO 8601 UTC"
        constraints: "> window_start"
      - name: application_method
        type: enum
        source: input
        description: "Placement method; selects the ammonia volatilization factor and satisfies deferred vector options"
        constraints: "one of SURFACE, INCORPORATED, INJECTED"
      - name: incorporation_within_hours
        type: integer
        source: input
        description: "Hours between surface placement and tillage incorporation; required when the batch's vector_option is VAR_OPTION_10_INCORPORATION"
        constraints: "null or >= 0"
      - name: acres_treated
        type: number
        source: input
        description: "Acres to receive biosolids in this window; must be > 0 and <= LandApplicationSite.acres"
        constraints: "> 0, 2 decimal places"
      - name: planned_dry_tons
        type: number
        source: input
        description: "Dry tons reserved from the batch for this window"
        constraints: "> 0, 3 decimal places"
      - name: planned_wet_tons
        type: number
        source: input
        description: "Wet tons that will leave the cake pad for this window"
        constraints: "> 0, 2 decimal places"
      - name: applied_dry_tons
        type: number
        source: computed
        description: "Set from the close-out request on the transition into COMPLETED; null before"
        constraints: "null or > 0, 3 decimal places"
      - name: applied_wet_tons
        type: number
        source: computed
        description: "Sum of HaulTicket.wet_tons for this event at the moment of close-out; null before"
        constraints: "null or >= 0, 2 decimal places"
      - name: reserved_dry_tons
        type: number
        source: computed
        description: "planned_dry_tons while status is one of SCHEDULED, WEATHER_HOLD, DEFERRED, IN_PROGRESS; 0 in every other status"
        default: 0
        constraints: "3 decimal places"
      - name: requested_rate_dry_tons_per_acre
        type: number
        source: computed
        description: "round(planned_dry_tons / acres_treated, 2) with round_half_up"
        constraints: "2 decimal places"
      - name: agronomic_rate_cap_dry_tons_per_acre
        type: number
        source: computed
        description: "Output of calculations.agronomic_rate_cap, pinned at creation time"
        constraints: "2 decimal places"
      - name: binding_rate_constraint
        type: enum
        source: computed
        description: "Which of the four candidate caps produced the minimum in calculations.agronomic_rate_cap"
        constraints: "one of NITROGEN, PHOSPHORUS, APLR, AGREEMENT"
      - name: plant_available_n_lb_per_dry_ton
        type: number
        source: computed
        description: "Intermediate of calculations.agronomic_rate_cap, retained for the annual report"
        constraints: "4 decimal places"
      - name: status
        type: enum
        source: system
        description: "Scheduling lifecycle with two distinct revert states and a compensating void edge"
        default: SCHEDULED
        constraints: "one of SCHEDULED, WEATHER_HOLD, DEFERRED, IN_PROGRESS, COMPLETED, CANCELLED, VOIDED"
      - name: hold_reason
        type: string
        source: computed
        description: "Populated on the transition into WEATHER_HOLD; one of RAINFALL_24H, FORECAST_48H, FROZEN_GROUND, OPERATOR_JUDGEMENT"
        constraints: "null unless status == WEATHER_HOLD"
      - name: defer_reason
        type: string
        source: computed
        description: "Populated on the cascaded transition into DEFERRED; one of SITE_RESTRICTED, AGREEMENT_TERMINATED"
        constraints: "null unless status == DEFERRED"
      - name: completed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that closed the event out; must differ from SolidsBatch.certified_by_user_id"
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into VOIDED"

  - name: HaulTicket
    parent: ApplicationEvent
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> ApplicationEvent.id; the application window this load serves"
      - name: truck_id
        type: string
        source: input
        description: "Hauler unit identifier"
        constraints: "1..32 chars"
      - name: wet_tons
        type: number
        source: input
        description: "Net wet tons on this load"
        constraints: "> 0, 2 decimal places"
      - name: depart_at
        type: datetime
        source: input
        description: "Loadout bay occupation start, inclusive, ISO 8601 UTC"
      - name: return_at
        type: datetime
        source: input
        description: "Loadout bay occupation end, inclusive; bay occupation intervals are closed so touching endpoints do count as one shared instant"
        constraints: "> depart_at"
      - name: odometer_miles
        type: number
        source: input
        description: "Round-trip miles recorded for the hauling cost record"
        constraints: ">= 0"

  - name: LoadingLedgerEntry
    parent: LandApplicationSite
    common_fields: false
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> LandApplicationSite.id; the field whose cumulative loading this entry moves"
      - name: source_event_id
        type: string
        source: input
        description: "FK -> ApplicationEvent.id; the close-out or void that produced this entry"
      - name: reversal_of_id
        type: string
        source: input
        description: "FK -> LoadingLedgerEntry.id; set only on REVERSAL entries, naming the APPLICATION entry it negates; null on APPLICATION entries"
      - name: analyte
        type: enum
        source: input
        description: "Regulated parameter this entry loads onto the field"
        constraints: "one of ARSENIC, CADMIUM, COPPER, LEAD, MERCURY, MOLYBDENUM, NICKEL, SELENIUM, ZINC, PFOS"
      - name: kg_per_hectare_delta
        type: number
        source: computed
        description: "Signed kg/ha applied to the field, rounded to 4 decimals round_half_up at write time and never re-rounded afterwards"
        constraints: "4 decimal places"
      - name: applied_year
        type: integer
        source: computed
        description: "Calendar year of the source event's window_start, used for the annual pollutant loading rate test"
      - name: entry_type
        type: enum
        source: computed
        description: "APPLICATION on event close-out, REVERSAL on event void"
        constraints: "one of APPLICATION, REVERSAL"

  - name: AlternativeOutlet
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Receiving facility name"
        constraints: "1..120 chars"
      - name: outlet_type
        type: enum
        source: input
        description: "Disposal or beneficial-use route"
        constraints: "one of COMPOST, LANDFILL, THERMAL"
      - name: gate_fee_per_wet_ton
        type: number
        source: input
        description: "Tipping fee charged per wet ton delivered"
        constraints: ">= 0, 2 decimal places"
      - name: haul_rate_per_mile_per_wet_ton
        type: number
        source: input
        description: "Trucking rate per mile per wet ton"
        constraints: ">= 0, 4 decimal places"
      - name: min_load_wet_tons
        type: number
        source: input
        description: "Smallest load the outlet will accept"
        constraints: ">= 0, 2 decimal places"
      - name: max_annual_wet_tons
        type: number
        source: input
        description: "Annual acceptance cap in wet tons across all COMMITTED and SETTLED diversion orders"
        constraints: "> 0"
      - name: min_percent_solids
        type: number
        source: input
        description: "Minimum cake total-solids percent the outlet accepts"
        constraints: ">= 0 and < 100"
      - name: status
        type: enum
        source: system
        description: "Acceptance posture of the outlet"
        default: ACCEPTING
        constraints: "one of ACCEPTING, SUSPENDED, CLOSED"
      - name: ytd_accepted_wet_tons
        type: number
        source: computed
        description: "Sum of DiversionOrder.wet_tons for this outlet with status one of COMMITTED, SETTLED in the calendar year of the logical clock"
        default: 0
        constraints: "2 decimal places"

  - name: DiversionOrder
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> SolidsBatch.id; the batch whose tonnage leaves through the alternative outlet"
      - name: outlet_id
        type: string
        source: input
        description: "FK -> AlternativeOutlet.id; the receiving facility"
      - name: dry_tons
        type: number
        source: input
        description: "Dry tons diverted; reserved against SolidsBatch.unallocated_dry_tons"
        constraints: "> 0, 3 decimal places"
      - name: wet_tons
        type: number
        source: input
        description: "Wet tons hauled to the outlet; removed from facility storage on settlement"
        constraints: "> 0, 2 decimal places"
      - name: haul_miles
        type: number
        source: input
        description: "One-way haul distance to the outlet, miles"
        constraints: "> 0, 1 decimal place"
      - name: processing_cost
        type: number
        source: computed
        description: "Step 1 of calculations.outlet_cost_comparison"
        constraints: "2 decimal places"
      - name: hauling_cost
        type: number
        source: computed
        description: "Step 2 of calculations.outlet_cost_comparison, fuel escalator applied"
        constraints: "2 decimal places"
      - name: subtotal_cost
        type: number
        source: computed
        description: "Step 3 of calculations.outlet_cost_comparison; the tier key for the surcharge"
        constraints: "2 decimal places"
      - name: surcharge_pct
        type: number
        source: computed
        description: "Step 4 of calculations.outlet_cost_comparison; tier selected by subtotal_cost"
        constraints: "2 decimal places"
      - name: surcharge_cost
        type: number
        source: computed
        description: "Step 5 of calculations.outlet_cost_comparison"
        constraints: "2 decimal places"
      - name: total_cost
        type: number
        source: computed
        description: "Step 6 of calculations.outlet_cost_comparison"
        constraints: "2 decimal places"
      - name: cost_per_dry_ton
        type: number
        source: computed
        description: "round(total_cost / dry_tons, 2) with round_half_up; the figure compared across outlets"
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Diversion lifecycle with a compensating void edge"
        default: DRAFT
        constraints: "one of DRAFT, COMMITTED, SETTLED, VOIDED"
      - name: committed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into COMMITTED"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into SETTLED"
      - name: void_reason
        type: string
        source: input
        description: "Free-text reason recorded on the transition into VOIDED"

  - name: OdorComplaint
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> TreatmentFacility.id; the utility the complaint is filed against"
      - name: site_id
        type: string
        source: input
        description: "FK -> LandApplicationSite.id; the field named by the complainant, null when the complaint names the plant only"
      - name: received_at
        type: datetime
        source: input
        description: "When the complaint reached the utility, ISO 8601 UTC"
      - name: severity
        type: enum
        source: input
        description: "Intake severity triage; selects the odor risk weight"
        constraints: "one of LOW, MODERATE, SEVERE"
      - name: description
        type: string
        source: input
        description: "Complainant narrative retained for the public record"
        constraints: "1..500 chars"
      - name: complainant_contact
        type: string
        source: input
        description: "Callback contact string"
        constraints: "1..120 chars"
      - name: status
        type: enum
        source: system
        description: "Investigation lifecycle; SUBSTANTIATED and UNSUBSTANTIATED are the two branch outcomes with different side-effect sets"
        default: RECEIVED
        constraints: "one of RECEIVED, INVESTIGATING, SUBSTANTIATED, UNSUBSTANTIATED, CLOSED"
      - name: investigation_note
        type: string
        source: input
        description: "Field investigation findings recorded on the transition into INVESTIGATING"
      - name: resolution_action
        type: enum
        source: input
        description: "Action taken on resolution; SITE_RESTRICTION is the only value that cascades to the site"
        constraints: "null or one of NONE, PUBLIC_NOTICE, OPERATIONAL_CHANGE, SITE_RESTRICTION"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transition into SUBSTANTIATED or UNSUBSTANTIATED"

  - name: AnnualReport
    parent: TreatmentFacility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> TreatmentFacility.id; the reporting utility"
      - name: report_year
        type: integer
        source: input
        description: "Calendar year covered by the report"
        constraints: "unique per facility_id where status is one of DRAFT, SUBMITTED, AMENDED"
      - name: total_dry_tons_land_applied
        type: number
        source: computed
        description: "Output of calculations.annual_report_rollup"
        default: 0
        constraints: "3 decimal places"
      - name: total_dry_tons_diverted
        type: number
        source: computed
        description: "Output of calculations.annual_report_rollup"
        default: 0
        constraints: "3 decimal places"
      - name: diverted_dry_tons_by_outlet_type
        type: object
        source: computed
        description: "Map of outlet_type -> dry tons; output of calculations.annual_report_rollup"
        default: {}
      - name: vsr_compliance_rate_pct
        type: number
        source: computed
        description: "Output of calculations.annual_report_rollup"
        default: 0
        constraints: "2 decimal places"
      - name: ceiling_exceedance_count
        type: integer
        source: computed
        description: "Output of calculations.annual_report_rollup"
        default: 0
      - name: sites_reported_count
        type: integer
        source: computed
        description: "Output of calculations.annual_report_rollup"
        default: 0
      - name: public_summary
        type: string
        source: input
        description: "Plain-language paragraph published for odor and emerging-contaminant questions"
        constraints: "1..1000 chars"
      - name: status
        type: enum
        source: system
        description: "Reporting lifecycle; AMENDED cycles back to SUBMITTED"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, AMENDED"
      - name: amendment_index
        type: integer
        source: computed
        description: "Increments by 1 on every SUBMITTED -> AMENDED transition"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent transition into SUBMITTED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that submitted the report"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---------------------------------------------------------------
  # SolidsBatch carries TWO independent state dimensions on one row.
  # Transition names are prefixed PROC_ (solids train) and QUAL_
  # (laboratory/compliance) so each dimension is addressable on its own.
  # ---------------------------------------------------------------
  - entity: SolidsBatch
    initial_state: "PROC_THICKENED + QUAL_UNTESTED"
    terminal_states: []
    dimensions:
      process_status: [THICKENED, DIGESTED, DEWATERED]
      quality_status: [UNTESTED, PENDING_RESULTS, QUALIFIED, REJECTED]
    transitions:
      - from: PROC_THICKENED
        to: PROC_DIGESTED
        trigger: "POST /solids-batches/{batchId}/advance-process with to_status == DIGESTED"
        actor: FacilityOperator
        preconditions:
          - "process_status == THICKENED"
          - "TreatmentFacility.posture of SolidsBatch.facility_id is one of {OPEN, RESTRICTED} (not FROZEN)"
          - "dry_tons_out, volatile_solids_out_pct, detention_days, digester_temp_c all present in the request"
          - "dry_tons_out > 0 AND dry_tons_out <= dry_tons_in"
          - "volatile_solids_out_pct > 0 AND volatile_solids_out_pct < volatile_solids_in_pct"
        side_effects:
          - "persists dry_tons_out, volatile_solids_out_pct, detention_days, digester_temp_c"
          - "recomputes vsr_pct_van_kleeck per calculations.volatile_solids_reduction variant van_kleeck"
          - "recomputes vsr_pct_mass_balance per calculations.volatile_solids_reduction variant mass_balance"
          - "recomputes pathogen_class per calculations.pathogen_class_determination"
          - "when vector_option == VAR_OPTION_1_VSR AND vsr_pct_van_kleeck < 38.00: also applies transition QUAL_UNTESTED -> QUAL_REJECTED below"
          - "increments SolidsBatch.version by 1 and refreshes updated_at"
        note: "The two volatile-solids-reduction variants are both persisted here from identical inputs and disagree; only van_kleeck is compliance-binding."

      - from: PROC_DIGESTED
        to: PROC_DEWATERED
        trigger: "POST /solids-batches/{batchId}/advance-process with to_status == DEWATERED"
        actor: FacilityOperator
        preconditions:
          - "process_status == DIGESTED"
          - "TreatmentFacility.posture of SolidsBatch.facility_id is one of {OPEN, RESTRICTED} (not FROZEN)"
          - "percent_solids present either on the batch from creation or in this request, and > 0 and < 100"
        side_effects:
          - "persists percent_solids"
          - "sets dry_tons_produced = dry_tons_out"
          - "sets unallocated_dry_tons = dry_tons_produced"
          - "when quality_status == UNTESTED: applies transition QUAL_UNTESTED -> QUAL_PENDING_RESULTS below"
          - "increments SolidsBatch.version by 1 and refreshes updated_at"

      - from: QUAL_UNTESTED
        to: QUAL_PENDING_RESULTS
        trigger: "system, on the PROC_DIGESTED -> PROC_DEWATERED transition"
        actor: system
        preconditions:
          - "quality_status == UNTESTED"
          - "process_status becomes DEWATERED in the same request"
        side_effects:
          - "opens sampling round retest_round == 0 for LabResult posting"

      - from: QUAL_UNTESTED
        to: QUAL_REJECTED
        trigger: "system, on the PROC_THICKENED -> PROC_DIGESTED transition when vector_option == VAR_OPTION_1_VSR AND vsr_pct_van_kleeck < 38.00"
        actor: system
        preconditions:
          - "quality_status == UNTESTED"
          - "vector_option == VAR_OPTION_1_VSR"
          - "vsr_pct_van_kleeck < 38.00 (the boundary value 38.00 itself does NOT reject)"
        side_effects:
          - "sets rejection_reason = VSR_BELOW_MINIMUM"
          - "does NOT set ceiling_exceedance_flag and does NOT change TreatmentFacility.open_ceiling_exceedance_count"

      - from: QUAL_PENDING_RESULTS
        to: QUAL_REJECTED
        trigger: "system, on POST /solids-batches/{batchId}/lab-results when the posted result has exceeds_ceiling == true"
        actor: system
        preconditions:
          - "quality_status == PENDING_RESULTS"
          - "posted LabResult.concentration_mg_kg > PollutantLimit.ceiling_mg_kg of the ACTIVE row for the posted analyte"
        side_effects:
          - "CASCADE HOP 1: sets ceiling_exceedance_flag = true and rejection_reason = CEILING_EXCEEDED on this batch"
          - "CASCADE HOP 2: caused by hop 1, every ApplicationEvent with batch_id == this batch and status in {SCHEDULED, WEATHER_HOLD, DEFERRED} transitions to CANCELLED (see ApplicationEvent machine), each releasing reserved_dry_tons back into this batch's unallocated_dry_tons"
          - "CASCADE HOP 3: caused by hop 1, TreatmentFacility.open_ceiling_exceedance_count is recomputed upward, which re-evaluates calculations.facility_posture and moves posture to FROZEN because open_ceiling_exceedance_count > 0"
          - "increments SolidsBatch.version by 1 and refreshes updated_at"
        note: "Hop 2 and hop 3 are both consequences of hop 1's flag flip, and hop 2 itself mutates unallocated_dry_tons which re-derives disposition."

      - from: QUAL_QUALIFIED
        to: QUAL_REJECTED
        trigger: "system, on POST /solids-batches/{batchId}/lab-results when the posted result has exceeds_ceiling == true and the batch has already been certified"
        actor: system
        preconditions:
          - "quality_status == QUALIFIED"
          - "posted LabResult.concentration_mg_kg > PollutantLimit.ceiling_mg_kg of the ACTIVE row for the posted analyte"
        side_effects:
          - "CASCADE HOP 1: sets ceiling_exceedance_flag = true, rejection_reason = CEILING_EXCEEDED and clears certified_at and certified_by_user_id to null"
          - "CASCADE HOP 2: caused by hop 1, every ApplicationEvent with batch_id == this batch and status in {SCHEDULED, WEATHER_HOLD, DEFERRED} transitions to CANCELLED, each releasing reserved_dry_tons back into this batch's unallocated_dry_tons"
          - "CASCADE HOP 3: caused by hop 1, TreatmentFacility.open_ceiling_exceedance_count is recomputed upward, which re-evaluates calculations.facility_posture and moves posture to FROZEN"
          - "increments SolidsBatch.version by 1 and refreshes updated_at"
        note: "A confirmatory result filed after certification withdraws the certification; this is the only way a QUALIFIED batch leaves that state, and it is what makes the three-hop cancellation cascade reachable."

      - from: QUAL_PENDING_RESULTS
        to: QUAL_QUALIFIED
        trigger: "POST /solids-batches/{batchId}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "process_status == DEWATERED"
          - "quality_status == PENDING_RESULTS"
          - "TreatmentFacility.posture of SolidsBatch.facility_id is one of {OPEN, RESTRICTED} (not FROZEN)"
          - "for every analyte carrying an ACTIVE PollutantLimit row at the moment of certification there exists a LabResult with batch_id == this batch AND sampling_event_index == retest_round"
          - "no LabResult with batch_id == this batch AND sampling_event_index == retest_round has exceeds_ceiling == true"
          - "no LabResult with batch_id == this batch AND sampling_event_index == retest_round has exceeds_monthly_avg == true"
          - "pathogen evidence complete per calculations.pathogen_class_determination and pathogen_class is one of {CLASS_B, CLASS_A}"
          - "vector evidence complete per calculations.vector_attraction_demonstration for the chosen vector_option"
        side_effects:
          - "sets certified_at = logical clock now and certified_by_user_id = X-User-ID of the caller"
          - "sets vector_demonstrated_at_batch = true when vector_option is one of {VAR_OPTION_1_VSR, VAR_OPTION_3_SOUR, VAR_OPTION_5_AEROBIC}, false when it is one of {VAR_OPTION_9_INJECTION, VAR_OPTION_10_INCORPORATION}"
          - "increments SolidsBatch.version by 1 and refreshes updated_at"
        note: "LabResult rows from earlier sampling rounds are excluded from every check here; only sampling_event_index == retest_round counts."

      - from: QUAL_REJECTED
        to: QUAL_PENDING_RESULTS
        trigger: "POST /solids-batches/{batchId}/retest-request"
        actor: ComplianceOfficer
        preconditions:
          - "quality_status == REJECTED"
          - "retest_round < 2"
        side_effects:
          - "increments retest_round by 1 and clears rejection_reason to null"
          - "sets ceiling_exceedance_flag = false"
          - "recomputes TreatmentFacility.open_ceiling_exceedance_count downward, which re-evaluates calculations.facility_posture and can move posture from FROZEN back to RESTRICTED or OPEN"
          - "increments SolidsBatch.version by 1 and refreshes updated_at"
        note: "Bounded revision loop: at most two retests, so retest_round tops out at 2."

  - entity: LandApplicationSite
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /land-application-sites/{siteId}/submit-permit"
        actor: Agronomist
        preconditions:
          - "status == DRAFT"
          - "soil_ph >= 6.0"
          - "depth_to_groundwater_ft >= 3.0"
          - "allowed_application_months is a non-empty array"
          - "setback_to_well_ft >= 100 AND setback_to_surface_water_ft >= 33"
        side_effects:
          - "increments LandApplicationSite.version by 1 and refreshes updated_at"

      - from: UNDER_REVIEW
        to: PERMITTED
        trigger: "POST /land-application-sites/{siteId}/permit-decision with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "permit_number supplied in the request and non-blank"
        side_effects:
          - "sets permit_number from the request and permitted_at = logical clock now"
          - "initializes cumulative_loading_kg_per_hectare to an empty map when it has never been populated"
          - "increments LandApplicationSite.version by 1"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /land-application-sites/{siteId}/permit-decision with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "leaves permit_number null"
          - "increments LandApplicationSite.version by 1"
        note: "Revision loop: the Agronomist may amend field data and resubmit."

      - from: PERMITTED
        to: RESTRICTED
        trigger: "POST /land-application-sites/{siteId}/restrict, OR system on the ApplicationEvent IN_PROGRESS -> COMPLETED cascade, OR system on the OdorComplaint INVESTIGATING -> SUBSTANTIATED cascade with resolution_action == SITE_RESTRICTION"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == PERMITTED"
        side_effects:
          - "sets restriction_reason to OFFICER_ORDER for the explicit endpoint, CPLR_HEADROOM_LOW for the loading cascade, ODOR_RISK_HIGH for the odor cascade"
          - "CASCADE: every ApplicationEvent with site_id == this site and status in {SCHEDULED, WEATHER_HOLD} transitions to DEFERRED with defer_reason = SITE_RESTRICTED (see ApplicationEvent machine); reserved_dry_tons is retained, not released"
          - "increments LandApplicationSite.version by 1"

      - from: RESTRICTED
        to: PERMITTED
        trigger: "POST /land-application-sites/{siteId}/reinstate, OR system on the ApplicationEvent COMPLETED -> VOIDED compensation hop 3 when restriction_reason == CPLR_HEADROOM_LOW"
        actor: ComplianceOfficer | system
        preconditions:
          - "status == RESTRICTED"
          - "for every analyte with a non-null cplr_kg_per_hectare on its ACTIVE PollutantLimit row: cumulative_loading_kg_per_hectare[analyte] < 0.90 * cplr_kg_per_hectare"
          - "gating_risk_score < 60.00"
        side_effects:
          - "clears restriction_reason to null"
          - "increments LandApplicationSite.version by 1"
        note: "Deferred events are NOT auto-rescheduled; the Agronomist must call reschedule with a fresh window."

      - from: PERMITTED
        to: CLOSED
        trigger: "POST /land-application-sites/{siteId}/close"
        actor: Agronomist
        preconditions:
          - "status == PERMITTED"
          - "no ApplicationEvent with site_id == this site has status in {SCHEDULED, WEATHER_HOLD, DEFERRED, IN_PROGRESS}"
        side_effects:
          - "cascades every FarmerAgreement with site_id == this site and status in {DRAFT, PROPOSED, COUNTERED} to WITHDRAWN"
          - "increments LandApplicationSite.version by 1"

      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /land-application-sites/{siteId}/close"
        actor: Agronomist
        preconditions:
          - "status == RESTRICTED"
          - "no ApplicationEvent with site_id == this site has status in {SCHEDULED, WEATHER_HOLD, DEFERRED, IN_PROGRESS}"
        side_effects:
          - "cascades every FarmerAgreement with site_id == this site and status in {DRAFT, PROPOSED, COUNTERED} to WITHDRAWN"
          - "increments LandApplicationSite.version by 1"

  - entity: FarmerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /farmer-agreements/{agreementId}/propose"
        actor: Agronomist
        preconditions:
          - "status == DRAFT"
          - "LandApplicationSite.status of site_id == PERMITTED"
        side_effects:
          - "sets last_proposed_by_role = Agronomist"
          - "applies the request's proposed max_dry_tons_per_acre and notice_days onto the agreement"
          - "increments FarmerAgreement.version by 1"

      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /farmer-agreements/{agreementId}/counter"
        actor: Farmer
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID == farmer_user_id"
          - "round_index < 3"
        side_effects:
          - "increments round_index by 1"
          - "sets last_proposed_by_role = Farmer"
          - "applies the request's max_dry_tons_per_acre onto max_dry_tons_per_acre when supplied"
          - "increments FarmerAgreement.version by 1"
        note: "Bounded negotiation cycle: the fourth counter attempt is rejected with ERR_AGREEMENT_ROUND_LIMIT."

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /farmer-agreements/{agreementId}/propose"
        actor: Agronomist
        preconditions:
          - "status == COUNTERED"
          - "LandApplicationSite.status of site_id == PERMITTED"
        side_effects:
          - "sets last_proposed_by_role = Agronomist"
          - "applies the request's proposed max_dry_tons_per_acre and notice_days onto the agreement"
          - "increments FarmerAgreement.version by 1"
        note: "Closes the cycle PROPOSED -> COUNTERED -> PROPOSED."

      - from: PROPOSED
        to: SIGNED
        trigger: "POST /farmer-agreements/{agreementId}/sign"
        actor: Farmer
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID == farmer_user_id"
          - "last_proposed_by_role == Agronomist"
        side_effects:
          - "sets signed_at = logical clock now"
          - "increments FarmerAgreement.version by 1"

      - from: SIGNED
        to: ACTIVE
        trigger: "POST /farmer-agreements/{agreementId}/activate"
        actor: Agronomist
        preconditions:
          - "status == SIGNED"
          - "logical clock now >= term_start AND logical clock now < term_end"
        side_effects:
          - "increments FarmerAgreement.version by 1"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /farmer-agreements/{agreementId}/withdraw"
        actor: Agronomist
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "increments FarmerAgreement.version by 1"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /farmer-agreements/{agreementId}/withdraw, OR system on the LandApplicationSite PERMITTED -> CLOSED / RESTRICTED -> CLOSED cascade"
        actor: Agronomist | system
        preconditions:
          - "status == COUNTERED"
        side_effects:
          - "increments FarmerAgreement.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /farmer-agreements/{agreementId}/terminate"
        actor: Farmer
        preconditions:
          - "status == ACTIVE"
          - "X-User-ID == farmer_user_id"
        side_effects:
          - "sets terminated_at = logical clock now and termination_reason from the request"
          - "CASCADE: every ApplicationEvent with agreement_id == this agreement and status in {SCHEDULED, WEATHER_HOLD} transitions to DEFERRED with defer_reason = AGREEMENT_TERMINATED; reserved_dry_tons is retained"
          - "increments FarmerAgreement.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system, on POST /_clock/set_current_utc when the new clock value is >= term_end"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "new logical clock value >= term_end"
        side_effects:
          - "increments FarmerAgreement.version by 1"
        note: "Purely clock-driven; no ApplicationEvent cascade, so events already IN_PROGRESS finish normally."

  - entity: ApplicationEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /application-events/{eventId}/weather-hold"
        actor: FacilityOperator
        preconditions:
          - "status == SCHEDULED"
          - "either LandApplicationSite.weather_clearance_ok == false for site_id, or the request supplies hold_reason == OPERATOR_JUDGEMENT"
        side_effects:
          - "sets hold_reason from the request"
          - "retains reserved_dry_tons at planned_dry_tons"
          - "increments ApplicationEvent.version by 1"

      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /application-events/{eventId}/reschedule"
        actor: Agronomist
        preconditions:
          - "status == WEATHER_HOLD"
          - "LandApplicationSite.status of site_id == PERMITTED"
          - "FarmerAgreement.status of agreement_id == ACTIVE"
          - "the new window passes every scheduling validation of priority 30 through 80 in §1.4"
        side_effects:
          - "replaces window_start and window_end with the request values and clears hold_reason to null"
          - "recomputes agronomic_rate_cap_dry_tons_per_acre, binding_rate_constraint and plant_available_n_lb_per_dry_ton against current site and agreement data"
          - "increments ApplicationEvent.version by 1"

      - from: DEFERRED
        to: SCHEDULED
        trigger: "POST /application-events/{eventId}/reschedule"
        actor: Agronomist
        preconditions:
          - "status == DEFERRED"
          - "LandApplicationSite.status of site_id == PERMITTED"
          - "FarmerAgreement.status of agreement_id == ACTIVE"
          - "the new window passes every scheduling validation of priority 30 through 80 in §1.4"
        side_effects:
          - "replaces window_start and window_end with the request values and clears defer_reason to null"
          - "recomputes agronomic_rate_cap_dry_tons_per_acre, binding_rate_constraint and plant_available_n_lb_per_dry_ton against current site and agreement data"
          - "increments ApplicationEvent.version by 1"

      - from: SCHEDULED
        to: DEFERRED
        trigger: "system, on the LandApplicationSite PERMITTED -> RESTRICTED cascade or the FarmerAgreement ACTIVE -> TERMINATED cascade"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "sets defer_reason = SITE_RESTRICTED or AGREEMENT_TERMINATED per the originating cascade"
          - "retains reserved_dry_tons at planned_dry_tons"

      - from: WEATHER_HOLD
        to: DEFERRED
        trigger: "system, on the LandApplicationSite PERMITTED -> RESTRICTED cascade or the FarmerAgreement ACTIVE -> TERMINATED cascade"
        actor: system
        preconditions:
          - "status == WEATHER_HOLD"
        side_effects:
          - "sets defer_reason per the originating cascade and clears hold_reason to null"
          - "retains reserved_dry_tons at planned_dry_tons"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /application-events/{eventId}/start"
        actor: FacilityOperator
        preconditions:
          - "status == SCHEDULED"
          - "logical clock now >= window_start AND logical clock now < window_end"
          - "LandApplicationSite.status of site_id == PERMITTED"
          - "FarmerAgreement.status of agreement_id == ACTIVE"
          - "SolidsBatch.quality_status of batch_id == QUALIFIED"
          - "LandApplicationSite.weather_clearance_ok of site_id == true"
        side_effects:
          - "increments ApplicationEvent.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /application-events/{eventId}/complete"
        actor: ComplianceOfficer
        preconditions:
          - "status == IN_PROGRESS"
          - "X-User-ID != SolidsBatch.certified_by_user_id of batch_id (segregation of duties)"
          - "applied_dry_tons in the request is > 0 and <= planned_dry_tons"
          - "at least one HaulTicket exists with event_id == this event"
          - "for the batch's deferred vector options: when SolidsBatch.vector_option == VAR_OPTION_9_INJECTION then application_method == INJECTED; when SolidsBatch.vector_option == VAR_OPTION_10_INCORPORATION then incorporation_within_hours is not null and <= 6"
        side_effects:
          - "sets applied_dry_tons from the request, applied_wet_tons = sum of HaulTicket.wet_tons for this event, completed_by_user_id = X-User-ID, reserved_dry_tons = 0"
          - "CASCADE HOP 1: writes one LoadingLedgerEntry with entry_type = APPLICATION per analyte having a LabResult in the batch's current sampling round, each kg_per_hectare_delta rounded to 4 decimals per calculations.cumulative_loading_ledger"
          - "CASCADE HOP 2: caused by hop 1, LandApplicationSite.cumulative_loading_kg_per_hectare and annual_loading_kg_per_hectare are re-summed from the ledger rows"
          - "CASCADE HOP 3: caused by hop 2, when any analyte's cumulative_loading_kg_per_hectare >= 0.90 * cplr_kg_per_hectare the site transitions PERMITTED -> RESTRICTED with restriction_reason = CPLR_HEADROOM_LOW"
          - "CASCADE HOP 4: caused by hop 3, every ApplicationEvent on that site with status in {SCHEDULED, WEATHER_HOLD} transitions to DEFERRED with defer_reason = SITE_RESTRICTED"
          - "reduces SolidsBatch.unallocated_dry_tons is NOT re-applied here (tonnage was already reserved at creation); the batch's disposition is re-derived"
          - "reduces TreatmentFacility.storage_used_wet_tons by applied_wet_tons and re-evaluates calculations.facility_posture"
          - "recomputes LandApplicationSite.pfas_advisory_flag from the batch's PFOS LabResult"
          - "increments ApplicationEvent.version by 1"
        note: "Four-hop chain: ledger write -> site loading re-sum -> site restriction -> sibling event deferral. Each hop is caused by the previous hop, not by the close-out call."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /application-events/{eventId}/cancel, OR system on the SolidsBatch QUAL_PENDING_RESULTS -> QUAL_REJECTED cascade"
        actor: Agronomist | system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "sets reserved_dry_tons = 0 and returns planned_dry_tons to SolidsBatch.unallocated_dry_tons"
          - "re-derives SolidsBatch.disposition"
          - "increments ApplicationEvent.version by 1"

      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /application-events/{eventId}/cancel, OR system on the SolidsBatch QUAL_PENDING_RESULTS -> QUAL_REJECTED cascade"
        actor: Agronomist | system
        preconditions:
          - "status == WEATHER_HOLD"
        side_effects:
          - "sets reserved_dry_tons = 0 and returns planned_dry_tons to SolidsBatch.unallocated_dry_tons"
          - "re-derives SolidsBatch.disposition"
          - "increments ApplicationEvent.version by 1"

      - from: DEFERRED
        to: CANCELLED
        trigger: "POST /application-events/{eventId}/cancel, OR system on the SolidsBatch QUAL_PENDING_RESULTS -> QUAL_REJECTED cascade"
        actor: Agronomist | system
        preconditions:
          - "status == DEFERRED"
        side_effects:
          - "sets reserved_dry_tons = 0 and returns planned_dry_tons to SolidsBatch.unallocated_dry_tons"
          - "re-derives SolidsBatch.disposition"
          - "increments ApplicationEvent.version by 1"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /application-events/{eventId}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == COMPLETED"
          - "no AnnualReport with facility_id == LandApplicationSite.facility_id of site_id AND report_year == the calendar year of window_start has status in {SUBMITTED, AMENDED}"
        side_effects:
          - "COMPENSATION HOP 1: writes one LoadingLedgerEntry with entry_type = REVERSAL, reversal_of_id set to the matching APPLICATION entry and kg_per_hectare_delta = -1 * that entry's kg_per_hectare_delta, for every APPLICATION entry with source_event_id == this event"
          - "COMPENSATION HOP 2: caused by hop 1, LandApplicationSite.cumulative_loading_kg_per_hectare and annual_loading_kg_per_hectare are re-summed and return to their pre-close-out values exactly"
          - "COMPENSATION HOP 3: caused by hop 2, when every analyte's cumulative_loading_kg_per_hectare falls below 0.90 * cplr_kg_per_hectare AND restriction_reason == CPLR_HEADROOM_LOW the site transitions RESTRICTED -> PERMITTED and restriction_reason is cleared"
          - "returns applied_dry_tons to SolidsBatch.unallocated_dry_tons and restores TreatmentFacility.storage_used_wet_tons by applied_wet_tons"
          - "sets voided_at = logical clock now; applied_dry_tons and applied_wet_tons are retained for the audit trail"
          - "increments ApplicationEvent.version by 1"

  - entity: DiversionOrder
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /diversion-orders/{orderId}/commit"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "AlternativeOutlet.status of outlet_id == ACCEPTING"
          - "wet_tons >= AlternativeOutlet.min_load_wet_tons"
          - "SolidsBatch.percent_solids of batch_id >= AlternativeOutlet.min_percent_solids"
          - "AlternativeOutlet.ytd_accepted_wet_tons + wet_tons <= AlternativeOutlet.max_annual_wet_tons"
        side_effects:
          - "sets committed_at = logical clock now"
          - "recomputes AlternativeOutlet.ytd_accepted_wet_tons upward by wet_tons"
          - "increments DiversionOrder.version by 1"
        note: "A REJECTED batch may still be diverted; landfill and thermal are exactly the outlets for it."

      - from: COMMITTED
        to: SETTLED
        trigger: "POST /diversion-orders/{orderId}/settle"
        actor: FacilityOperator
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "sets settled_at = logical clock now"
          - "reduces TreatmentFacility.storage_used_wet_tons of the batch's facility by wet_tons, which re-evaluates calculations.facility_posture and can move posture from RESTRICTED to OPEN"
          - "increments DiversionOrder.version by 1"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /diversion-orders/{orderId}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "returns dry_tons to SolidsBatch.unallocated_dry_tons and re-derives SolidsBatch.disposition"
          - "sets void_reason from the request"
          - "increments DiversionOrder.version by 1"

      - from: COMMITTED
        to: VOIDED
        trigger: "POST /diversion-orders/{orderId}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "returns dry_tons to SolidsBatch.unallocated_dry_tons and re-derives SolidsBatch.disposition"
          - "recomputes AlternativeOutlet.ytd_accepted_wet_tons downward by wet_tons"
          - "sets void_reason from the request"
          - "increments DiversionOrder.version by 1"
        note: "Compensating edge for the dry-tons conserved quantity; storage was never debited because settlement never happened."

  - entity: OdorComplaint
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: INVESTIGATING
        trigger: "POST /odor-complaints/{complaintId}/investigate"
        actor: ComplianceOfficer | PublicLiaison
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "no field other than status and version changes; the investigation note is recorded later on resolve"
          - "increments OdorComplaint.version by 1"
        note: "The complaint stays inside the open set for the precautionary odor variant across this transition."

      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /odor-complaints/{complaintId}/resolve with outcome == SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == INVESTIGATING"
          - "resolution_action supplied in the request"
        side_effects:
          - "sets resolved_at = logical clock now and resolution_action from the request"
          - "recomputes TreatmentFacility.substantiated_complaint_count_30d upward, which re-evaluates calculations.facility_posture and moves posture to RESTRICTED at a count of 3 or more"
          - "recomputes LandApplicationSite.odor_risk_score_historical AND odor_risk_score_precautionary AND gating_risk_score for site_id when site_id is not null"
          - "when resolution_action == SITE_RESTRICTION AND LandApplicationSite.status of site_id == PERMITTED: cascades the site to RESTRICTED with restriction_reason = ODOR_RISK_HIGH, which in turn defers that site's SCHEDULED and WEATHER_HOLD events"
          - "increments OdorComplaint.version by 1"

      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /odor-complaints/{complaintId}/resolve with outcome == UNSUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == INVESTIGATING"
        side_effects:
          - "sets resolved_at = logical clock now and resolution_action = NONE"
          - "leaves TreatmentFacility.substantiated_complaint_count_30d unchanged and never changes posture"
          - "recomputes LandApplicationSite.odor_risk_score_precautionary and gating_risk_score for site_id when site_id is not null; odor_risk_score_historical is unchanged because the complaint never entered the substantiated set"
          - "never cascades to LandApplicationSite.status"
          - "increments OdorComplaint.version by 1"
        note: "Divergent branch: this outcome lowers only the precautionary score, while SUBSTANTIATED raises both scores and can restrict the site."

      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /odor-complaints/{complaintId}/close"
        actor: PublicLiaison
        preconditions:
          - "status == SUBSTANTIATED"
        side_effects:
          - "increments OdorComplaint.version by 1"
        note: "CLOSED complaints remain inside the substantiated 365-day window for odor_risk_score_historical."

      - from: UNSUBSTANTIATED
        to: CLOSED
        trigger: "POST /odor-complaints/{complaintId}/close"
        actor: PublicLiaison
        preconditions:
          - "status == UNSUBSTANTIATED"
        side_effects:
          - "increments OdorComplaint.version by 1"

  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /annual-reports/{reportId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "report_year <= calendar year of the logical clock"
          - "no SolidsBatch of facility_id has quality_status == PENDING_RESULTS with created_at inside report_year"
          - "public_summary is non-blank"
        side_effects:
          - "recomputes every rollup field per calculations.annual_report_rollup"
          - "sets submitted_at = logical clock now and submitted_by_user_id = X-User-ID"
          - "increments AnnualReport.version by 1"

      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /annual-reports/{reportId}/amend"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "amendment_reason supplied in the request and non-blank"
        side_effects:
          - "increments amendment_index by 1"
          - "recomputes every rollup field per calculations.annual_report_rollup against current data"
          - "increments AnnualReport.version by 1"

      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /annual-reports/{reportId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == AMENDED"
          - "public_summary is non-blank"
        side_effects:
          - "recomputes every rollup field per calculations.annual_report_rollup"
          - "sets submitted_at = logical clock now and submitted_by_user_id = X-User-ID"
          - "increments AnnualReport.version by 1"
        note: "Closes the reporting cycle SUBMITTED -> AMENDED -> SUBMITTED; amendment_index records how many revisions occurred."

# =====================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =====================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-site
    parent_entity: LandApplicationSite
    write_endpoint: "POST /farmer-agreements"
    occ_field: "expected_site_version"
    description: |
      Creating a FarmerAgreement against a LandApplicationSite whose version has advanced since
      the client last read it is rejected. A second DRAFT agreement on the same site is a
      legitimate product operation (it supersedes the prior draft's terms once proposed and
      signed), so the write cannot be resolved by any state precondition; the stale-version
      check is what tells the caller its view of the site's acreage, crop demand, loading
      headroom and permit status is out of date.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412

  - rule_id: diversion-create-stale-batch
    parent_entity: SolidsBatch
    write_endpoint: "POST /diversion-orders"
    occ_field: "expected_batch_version"
    description: |
      Creating a DiversionOrder against a SolidsBatch whose version has advanced since the
      client last read it is rejected. Multiple diversion orders against the same batch are
      legitimate (the batch's unallocated tonnage can be split across a compost outlet and a
      landfill), so no state precondition rejects the second create; the stale-version check
      catches a caller sizing the order against an unallocated_dry_tons figure that another
      write has already reduced.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: volatile_solids_reduction
    trigger: "On the SolidsBatch PROC_THICKENED -> PROC_DIGESTED transition (POST /solids-batches/{batchId}/advance-process with to_status == DIGESTED); both variants are computed and persisted in the same request"
    algorithm: dual_variant_ratio
    formula: |
      # Variant A — van_kleeck (compliance-binding, persisted to vsr_pct_van_kleeck)
      vs_in  = volatile_solids_in_pct  / 100        # fraction of total solids
      vs_out = volatile_solids_out_pct / 100
      vsr_van_kleeck = round( (vs_in - vs_out) / (vs_in - vs_in * vs_out) * 100, 2 )   # round_half_up

      # Variant B — mass_balance (operations reporting, persisted to vsr_pct_mass_balance)
      vs_mass_in  = dry_tons_in  * vs_in
      vs_mass_out = dry_tons_out * vs_out
      vsr_mass_balance = round( (vs_mass_in - vs_mass_out) / vs_mass_in * 100, 2 )     # round_half_up

      # Compliance gate (VAR_OPTION_1_VSR only), evaluated on vsr_van_kleeck ONLY:
      # vsr_van_kleeck >= VSR_MINIMUM_PCT  ->  vector attraction reduction demonstrated
      # vsr_van_kleeck <  VSR_MINIMUM_PCT  ->  quality_status goes to REJECTED, reason VSR_BELOW_MINIMUM
    input_set: "The single SolidsBatch being advanced. dry_tons_in and volatile_solids_in_pct come from batch creation; dry_tons_out and volatile_solids_out_pct come from this request. No other batch participates."
    constants:
      VSR_MINIMUM_PCT: 38.00
    precision: "both variants: 2 decimal places, round_half_up; the gate compares the rounded vsr_pct_van_kleeck against VSR_MINIMUM_PCT"
    variants:
      - name: van_kleeck
        when: "Always computed; the only variant that decides vector attraction reduction under VAR_OPTION_1_VSR and the only variant that can reject the batch"
        difference: "Works on volatile-solids fractions and divides by (vs_in - vs_in*vs_out), which corrects for the ash left behind; it reports a HIGHER reduction than mass_balance for the same inputs because the denominator is smaller"
      - name: mass_balance
        when: "Always computed; published in the annual report as the operations figure and never used as a gate"
        difference: "Works on absolute volatile-solids masses and divides by vs_mass_in, so any dry-solids mass loss through the process shows up as apparent reduction; it reports a LOWER reduction than van_kleeck when total solids are conserved"

  - name: pathogen_class_determination
    trigger: "On the SolidsBatch PROC_THICKENED -> PROC_DIGESTED transition, and re-evaluated as a precondition of POST /solids-batches/{batchId}/certify"
    algorithm: conditional_branches
    formula: |
      if pathogen_option == PFRP_ALT1_TIME_TEMP:
          # Class A: time-temperature regime AND both indicator organisms below limits
          ok = (digester_temp_c >= CLASS_A_MIN_TEMP_C
                and detention_days >= CLASS_A_MIN_DAYS
                and fecal_coliform_mpn_per_g is not null
                and fecal_coliform_mpn_per_g < CLASS_A_FECAL_LIMIT_MPN_PER_G
                and salmonella_mpn_per_4g is not null
                and salmonella_mpn_per_4g < CLASS_A_SALMONELLA_LIMIT_MPN_PER_4G)
          pathogen_class = CLASS_A if ok else NONE
      elif pathogen_option == PSRP_ALT1_TIME_TEMP:
          ok = (digester_temp_c >= CLASS_B_MIN_TEMP_C and detention_days >= CLASS_B_MIN_DAYS)
          pathogen_class = CLASS_B if ok else NONE
      elif pathogen_option == PSRP_ALT3_FECAL_COLIFORM:
          ok = (fecal_coliform_mpn_per_g is not null
                and fecal_coliform_mpn_per_g < CLASS_B_FECAL_LIMIT_MPN_PER_G)
          pathogen_class = CLASS_B if ok else NONE
    input_set: "Only the SolidsBatch row's own pathogen_option, digester_temp_c, detention_days, fecal_coliform_mpn_per_g and salmonella_mpn_per_4g. Nulls never coerce to 0; a null required field yields NONE."
    constants:
      CLASS_B_MIN_TEMP_C: 35.0
      CLASS_B_MIN_DAYS: 15.0
      CLASS_B_FECAL_LIMIT_MPN_PER_G: 2000000
      CLASS_A_MIN_TEMP_C: 53.0
      CLASS_A_MIN_DAYS: 5.0
      CLASS_A_FECAL_LIMIT_MPN_PER_G: 1000
      CLASS_A_SALMONELLA_LIMIT_MPN_PER_4G: 3
    precision: "boolean/enum output; all comparisons are strict as written (>= on temp/days, < on organism densities)"

  - name: vector_attraction_demonstration
    trigger: "Evaluated as a precondition of POST /solids-batches/{batchId}/certify for options 1, 3 and 5, and re-evaluated as a precondition of POST /application-events/{eventId}/complete for options 9 and 10"
    algorithm: conditional_branches
    formula: |
      # Plant-side options — checked at certification
      if vector_option == VAR_OPTION_1_VSR:
          demonstrated = (vsr_pct_van_kleeck is not null and vsr_pct_van_kleeck >= 38.00)
          missing_evidence_error = ERR_VSR_BELOW_MINIMUM
      elif vector_option == VAR_OPTION_3_SOUR:
          demonstrated = (sour_mg_o2_per_g_hr is not null
                          and sour_mg_o2_per_g_hr <= SOUR_MAX_MG_O2_PER_G_HR
                          and digester_temp_c <= SOUR_MAX_TEMP_C)
          missing_evidence_error = ERR_VECTOR_OPTION_EVIDENCE_MISSING
      elif vector_option == VAR_OPTION_5_AEROBIC:
          demonstrated = (aerobic_process_days is not null
                          and aerobic_process_days >= AEROBIC_MIN_DAYS
                          and digester_temp_c >= AEROBIC_MIN_TEMP_C)
          missing_evidence_error = ERR_VECTOR_OPTION_EVIDENCE_MISSING
      # Field-side options — certification records the deferral, the ApplicationEvent proves it
      elif vector_option == VAR_OPTION_9_INJECTION:
          demonstrated_at_batch = false
          field_test = (ApplicationEvent.application_method == INJECTED)
          field_error = ERR_VECTOR_OPTION_METHOD_MISMATCH
      elif vector_option == VAR_OPTION_10_INCORPORATION:
          demonstrated_at_batch = false
          field_test = (ApplicationEvent.incorporation_within_hours is not null
                        and ApplicationEvent.incorporation_within_hours <= INCORPORATION_MAX_HOURS)
          field_error = ERR_VECTOR_OPTION_METHOD_MISMATCH
    input_set: "The SolidsBatch row for options 1/3/5. For options 9/10 the SolidsBatch row plus the specific ApplicationEvent being closed out; sibling events on the same batch are not consulted."
    constants:
      SOUR_MAX_MG_O2_PER_G_HR: 1.5
      SOUR_MAX_TEMP_C: 20.0
      AEROBIC_MIN_DAYS: 14.0
      AEROBIC_MIN_TEMP_C: 40.0
      INCORPORATION_MAX_HOURS: 6
    precision: "boolean output; the 6-hour incorporation bound is inclusive (<= 6 passes, 7 fails)"

  - name: agronomic_rate_cap
    trigger: "On POST /application-events (creation) and re-run on the ApplicationEvent WEATHER_HOLD -> SCHEDULED and DEFERRED -> SCHEDULED reschedule transitions; writes agronomic_rate_cap_dry_tons_per_acre, binding_rate_constraint and plant_available_n_lb_per_dry_ton"
    algorithm: constraint_propagation
    formula: |
      # ---- Step 1: plant available nitrogen per dry ton (4 dp, round_half_up) ----
      k_vol = VOLATILIZATION_FACTOR[ApplicationEvent.application_method]      # SURFACE .50 / INCORPORATED .75 / INJECTED 1.00
      k_min = MINERALIZATION_FACTOR[SolidsBatch.stabilization_process]        # ANAEROBIC_DIGESTION .20 / COMPOSTED .10 / LIME_STABILIZED .30
      nh4 = LabResult.concentration_mg_kg where analyte == AMMONIA_N  ... see input_set note
      pan_lb_per_dry_ton = round(
          (batch_nh4_n_mg_kg * k_vol + batch_organic_n_mg_kg * k_min + batch_nitrate_n_mg_kg)
          * MG_KG_TO_LB_PER_TON, 4)
      if pan_lb_per_dry_ton == 0: reject the request with ERR_AGRONOMIC_RATE_UNDEFINED

      # ---- Step 2: nitrogen-limited rate ----
      n_rate = site.crop_n_demand_lb_per_acre / pan_lb_per_dry_ton

      # ---- Step 3: phosphorus-limited rate (tiered on soil_p_index) ----
      if site.soil_p_index >= P_INDEX_BLOCK: reject the request with ERR_PHOSPHORUS_INDEX_BLOCK
      elif site.soil_p_index >= P_INDEX_TIER: p_rate = site.crop_p_removal_lb_per_acre
                                                       / (batch_total_p_mg_kg * MG_KG_TO_LB_PER_TON)
      else: p_rate = UNCONSTRAINED_RATE          # 9999.0 sentinel, never the minimum in practice

      # ---- Step 4: APLR-limited rate, minimum over every analyte carrying an APLR ----
      # remaining annual headroom for the event's calendar year, kg/ha
      for each analyte A with ACTIVE PollutantLimit.aplr_kg_per_hectare_yr not null
          and a LabResult for the batch's current sampling round:
        headroom_A = aplr_kg_per_hectare_yr(A)
                     - site.annual_loading_kg_per_hectare["<year>:<A>"]      # 0 when the key is absent
        kg_per_ha_per_dry_ton_per_acre_A = conc_A_mg_kg * 1e-6 * KG_PER_DRY_TON / HECTARES_PER_ACRE
        aplr_rate_A = headroom_A / kg_per_ha_per_dry_ton_per_acre_A
      aplr_rate = min over A of aplr_rate_A          # analytes sorted ASC by analyte enum name for
                                                     # deterministic reporting; the min value itself is
                                                     # order-independent

      # ---- Step 5: agreement cap ----
      agreement_rate = FarmerAgreement.max_dry_tons_per_acre

      # ---- Step 6: single rounding at the end; ties in the min resolve by this fixed order ----
      candidates = [(NITROGEN, n_rate), (PHOSPHORUS, p_rate), (APLR, aplr_rate), (AGREEMENT, agreement_rate)]
      binding_rate_constraint = the FIRST entry of `candidates` in that literal order whose value
                                equals min(value for each candidate)      # NITROGEN wins any tie
      agronomic_rate_cap_dry_tons_per_acre = round(min(value for each candidate), 2)   # round_half_up
      # NO intermediate rounding: n_rate, p_rate and aplr_rate are carried at full float precision
      # into the min, and only the winner is rounded, exactly once.

      # ---- Step 7: acceptance test at creation ----
      requested_rate = round(planned_dry_tons / acres_treated, 2)           # round_half_up
      if requested_rate > agronomic_rate_cap_dry_tons_per_acre:
          reject with ERR_AGRONOMIC_RATE_EXCEEDED
      # equality is ACCEPTED
    input_set: |
      One ApplicationEvent request, its LandApplicationSite, its FarmerAgreement, its SolidsBatch and
      the batch's LabResult rows whose sampling_event_index == SolidsBatch.retest_round. The batch
      nutrient inputs batch_nh4_n_mg_kg, batch_organic_n_mg_kg, batch_nitrate_n_mg_kg and
      batch_total_p_mg_kg are the SolidsBatch fields nh4_n_mg_kg, organic_n_mg_kg, nitrate_n_mg_kg
      and total_p_mg_kg supplied at batch creation — they are NOT LabResult rows, which carry only
      the ten regulated analytes. Analytes without an APLR (MOLYBDENUM and PFOS in the seeded limit
      set) are excluded from step 4. Prior-round LabResult rows are excluded everywhere.
    constants:
      VOLATILIZATION_FACTOR: { SURFACE: 0.50, INCORPORATED: 0.75, INJECTED: 1.00 }
      MINERALIZATION_FACTOR: { ANAEROBIC_DIGESTION: 0.20, COMPOSTED: 0.10, LIME_STABILIZED: 0.30 }
      MG_KG_TO_LB_PER_TON: 0.002
      KG_PER_DRY_TON: 907.185
      HECTARES_PER_ACRE: 0.404686
      P_INDEX_TIER: 75
      P_INDEX_BLOCK: 100
      UNCONSTRAINED_RATE: 9999.0
    precision: "pan_lb_per_dry_ton 4 decimal places round_half_up; the four candidate rates are unrounded; agronomic_rate_cap_dry_tons_per_acre and requested_rate 2 decimal places round_half_up; the acceptance test compares the two rounded values"

  - name: cumulative_loading_ledger
    trigger: "On the ApplicationEvent IN_PROGRESS -> COMPLETED transition (APPLICATION entries) and on the ApplicationEvent COMPLETED -> VOIDED transition (REVERSAL entries); LandApplicationSite.cumulative_loading_kg_per_hectare and annual_loading_kg_per_hectare are re-summed from the ledger afterwards"
    algorithm: aggregation
    formula: |
      # ---- write time: one entry per analyte, rounded ONCE, here ----
      applied_rate = applied_dry_tons / acres_treated                  # unrounded
      for each analyte A having a LabResult with batch_id == event.batch_id
          and sampling_event_index == SolidsBatch.retest_round,
          taken in ASC order of the analyte enum name:
        kg_per_hectare_delta(A) = round(
            applied_rate * conc_A_mg_kg * 1e-6 * KG_PER_DRY_TON / HECTARES_PER_ACRE, 4)   # round_half_up
        entry_type = APPLICATION ; applied_year = calendar year of event.window_start
      # on void: one REVERSAL entry per APPLICATION entry of that event, in the same ASC analyte order
        kg_per_hectare_delta = -1 * source_entry.kg_per_hectare_delta   # exact negation, no re-rounding

      # ---- read time: SUM THE ROUNDED ENTRIES; NEVER RE-ROUND THE SUM ----
      site.cumulative_loading_kg_per_hectare[A] =
          sum(kg_per_hectare_delta of every LoadingLedgerEntry with site_id == site.id and analyte == A)
      site.annual_loading_kg_per_hectare["<year>:<A>"] =
          sum(kg_per_hectare_delta of every LoadingLedgerEntry with site_id == site.id
              and analyte == A and applied_year == <year>)
      # Rounding order is PINNED: round per ledger entry, then sum. Summing the unrounded per-event
      # values and rounding the total at read time is a DIFFERENT and INCORRECT result.
    input_set: "Every LoadingLedgerEntry with site_id == the site, both entry_type values included, no status filter (ledger rows are immutable and never soft-deleted). The batch's LabResult rows are filtered to sampling_event_index == SolidsBatch.retest_round at write time only."
    constants:
      KG_PER_DRY_TON: 907.185
      HECTARES_PER_ACRE: 0.404686
      CPLR_RESTRICT_FRACTION: 0.90
    precision: "each kg_per_hectare_delta is 4 decimal places round_half_up at write time; site sums are exact sums of those 4-decimal values and are compared to CPLR_RESTRICT_FRACTION * cplr_kg_per_hectare without further rounding"

  - name: cplr_headroom_check
    trigger: "On POST /application-events (creation) after calculations.agronomic_rate_cap has passed, and re-run on reschedule transitions"
    algorithm: threshold
    formula: |
      for each analyte A with ACTIVE PollutantLimit.cplr_kg_per_hectare not null and a LabResult
          for the batch's current sampling round, taken in ASC order of the analyte enum name:
        projected_A = site.cumulative_loading_kg_per_hectare[A]                  # 0 when absent
                      + round(requested_rate * conc_A_mg_kg * 1e-6
                              * KG_PER_DRY_TON / HECTARES_PER_ACRE, 4)
        if projected_A > cplr_kg_per_hectare(A): reject with ERR_CPLR_HEADROOM_EXCEEDED
        # equality is ACCEPTED: projected_A == cplr_kg_per_hectare(A) passes
      for each analyte A with ACTIVE PollutantLimit.aplr_kg_per_hectare_yr not null:
        projected_annual_A = site.annual_loading_kg_per_hectare["<year of window_start>:<A>"]
                             + round(requested_rate * conc_A_mg_kg * 1e-6
                                     * KG_PER_DRY_TON / HECTARES_PER_ACRE, 4)
        if projected_annual_A > aplr_kg_per_hectare_yr(A): reject with ERR_APLR_EXCEEDED
    input_set: "The requesting event's rounded requested_rate_dry_tons_per_acre, the site's current cumulative and annual loading maps, and the batch's current-round LabResult rows. Events in status CANCELLED, VOIDED or DEFERRED contribute nothing because they never wrote ledger rows (DEFERRED events keep a tonnage reservation but no loading)."
    constants:
      KG_PER_DRY_TON: 907.185
      HECTARES_PER_ACRE: 0.404686
    precision: "the projected increment is rounded to 4 decimals round_half_up before the comparison, matching what the ledger will actually write; the comparison itself is > (strictly greater rejects, equal passes)"

  - name: outlet_cost_comparison
    trigger: "On POST /diversion-orders (creation), writing processing_cost, hauling_cost, subtotal_cost, surcharge_pct, surcharge_cost, total_cost and cost_per_dry_ton; the same formula backs GET /diversion-orders/{orderId}/cost-comparison for every ACCEPTING outlet"
    algorithm: tiered_pricing
    formula: |
      # The surcharge tier is keyed on the subtotal, and the subtotal is a component of the total —
      # the dependency LOOKS circular, so the evaluation order is pinned to exactly these six steps.
      # Step 1
      processing_cost = round(wet_tons * outlet.gate_fee_per_wet_ton, 2)                  # round_half_up
      # Step 2 — fuel escalator applies to hauling only
      hauling_cost    = round(haul_miles * wet_tons
                              * outlet.haul_rate_per_mile_per_wet_ton
                              * FUEL_ESCALATOR, 2)                                        # round_half_up
      # Step 3 — subtotal is the sum of the two ALREADY-ROUNDED components
      subtotal_cost   = round(processing_cost + hauling_cost, 2)
      # Step 4 — tier lookup on subtotal_cost, lower bounds inclusive
      if   subtotal_cost >= SURCHARGE_TIER_2_FLOOR: surcharge_pct = 0.05
      elif subtotal_cost >= SURCHARGE_TIER_1_FLOOR: surcharge_pct = 0.03
      else:                                          surcharge_pct = 0.00
      # Step 5
      surcharge_cost  = round(subtotal_cost * surcharge_pct, 2)
      # Step 6
      total_cost      = round(subtotal_cost + surcharge_cost, 2)
      cost_per_dry_ton = round(total_cost / dry_tons, 2)                                  # round_half_up
      # Forbidden alternative: computing surcharge from an unrounded processing+hauling sum, or
      # applying the escalator to the gate fee, both yield different cents.
    input_set: "One DiversionOrder request and its AlternativeOutlet. GET /diversion-orders/{orderId}/cost-comparison re-runs steps 1-6 for every AlternativeOutlet with status == ACCEPTING using the order's own wet_tons, dry_tons and haul_miles, and returns the rows sorted by cost_per_dry_ton ASC with ties broken by AlternativeOutlet.created_at ASC."
    constants:
      FUEL_ESCALATOR: 1.08
      SURCHARGE_TIER_1_FLOOR: 2000.00
      SURCHARGE_TIER_2_FLOOR: 10000.00
    precision: "every monetary field is 2 decimal places round_half_up; the rounding order above is normative — round each component, then sum, then tier, then surcharge, then total"

  - name: site_odor_risk_score
    trigger: "On the OdorComplaint RECEIVED -> INVESTIGATING, INVESTIGATING -> SUBSTANTIATED and INVESTIGATING -> UNSUBSTANTIATED transitions, on POST /odor-complaints (creation), and on POST /_clock/set_current_utc (the 365-day window moves); writes odor_risk_score_historical, odor_risk_score_precautionary and gating_risk_score on the named site"
    algorithm: weighted_scoring
    formula: |
      w(severity) = SEVERITY_WEIGHT[severity]        # LOW 1, MODERATE 3, SEVERE 7
      window_start = logical clock now - 365 days     # inclusive lower bound on received_at

      # Variant A — historical (substantiated only)
      hist_sum = sum of w(severity) over OdorComplaint rows with site_id == site.id
                 AND status in {SUBSTANTIATED, CLOSED_FROM_SUBSTANTIATED}
                 AND received_at >= window_start
      # CLOSED_FROM_SUBSTANTIATED means status == CLOSED with resolution_action != NONE
      odor_risk_score_historical = round(min(100.0, hist_sum * SCORE_MULTIPLIER), 2)

      # Variant B — precautionary (open complaints count at full weight, PFAS multiplies)
      prec_sum = sum of w(severity) over OdorComplaint rows with site_id == site.id
                 AND status in {RECEIVED, INVESTIGATING, SUBSTANTIATED, CLOSED_FROM_SUBSTANTIATED}
                 AND received_at >= window_start
      pfas_mult = PFAS_MULTIPLIER if site.pfas_advisory_flag else 1.0
      odor_risk_score_precautionary = round(min(100.0, prec_sum * SCORE_MULTIPLIER * pfas_mult), 2)

      # Gate selection
      gating_risk_score = odor_risk_score_precautionary if site.nearest_residence_ft < RESIDENCE_PROXIMITY_FT
                          else odor_risk_score_historical
      # Consequences: gating_risk_score >= SCHEDULING_BLOCK_SCORE rejects POST /application-events
      # with ERR_ODOR_RISK_BLOCK; gating_risk_score < 60.00 is required to reinstate a RESTRICTED site.
    input_set: "OdorComplaint rows for the named site only (site_id == site.id; plant-only complaints with site_id == null never score a site), filtered to received_at >= clock now - 365 days. UNSUBSTANTIATED complaints are excluded from BOTH variants; the difference between the variants is that RECEIVED and INVESTIGATING complaints count in the precautionary variant and not in the historical one."
    constants:
      SEVERITY_WEIGHT: { LOW: 1, MODERATE: 3, SEVERE: 7 }
      SCORE_MULTIPLIER: 4.0
      PFAS_MULTIPLIER: 1.5
      RESIDENCE_PROXIMITY_FT: 1500
      SCHEDULING_BLOCK_SCORE: 60.00
    precision: "2 decimal places round_half_up after the min(100.0, ...) clamp; the scheduling gate compares the rounded gating_risk_score with >="
    variants:
      - name: historical
        when: "Gating variant for sites with nearest_residence_ft >= 1500"
        difference: "Counts only complaints the utility has substantiated, and ignores the PFAS advisory entirely — the same complaint set therefore scores strictly lower than the precautionary variant whenever any complaint is still open or the PFAS flag is set"
      - name: precautionary
        when: "Gating variant for sites with nearest_residence_ft < 1500"
        difference: "Counts RECEIVED and INVESTIGATING complaints at full severity weight and multiplies the whole score by 1.5 when the site carries a PFOS advisory exceedance, so an unresolved complaint queue can block scheduling before any investigation concludes"

  - name: dry_tons_conservation
    trigger: "Re-derived on every mutation that reserves, applies, diverts or releases batch tonnage: POST /application-events, the ApplicationEvent transitions into CANCELLED / DEFERRED / COMPLETED / VOIDED, POST /diversion-orders, and the DiversionOrder transitions into VOIDED"
    algorithm: aggregation
    formula: |
      reserved  = sum(ApplicationEvent.planned_dry_tons where batch_id == batch.id
                      AND status in {SCHEDULED, WEATHER_HOLD, DEFERRED, IN_PROGRESS})
      applied   = sum(ApplicationEvent.applied_dry_tons where batch_id == batch.id
                      AND status == COMPLETED)
      diverted  = sum(DiversionOrder.dry_tons where batch_id == batch.id
                      AND status in {DRAFT, COMMITTED, SETTLED})
      unallocated_dry_tons = round(dry_tons_produced - reserved - applied - diverted, 3)

      # INVARIANT (must hold after every mutation above, including compensations):
      #   dry_tons_produced == round(unallocated_dry_tons + reserved + applied + diverted, 3)
      # VOIDED and CANCELLED events contribute 0; VOIDED diversion orders contribute 0.
    input_set: "All ApplicationEvent and DiversionOrder rows with batch_id == the batch, filtered by the exact status sets above. A VOIDED event's retained applied_dry_tons is excluded because its status is no longer COMPLETED."
    constants: {}
    precision: "3 decimal places round_half_up; the invariant is asserted on the rounded values"

  - name: storage_ledger
    trigger: "On POST /solids-batches (credit), the ApplicationEvent IN_PROGRESS -> COMPLETED transition (debit), the ApplicationEvent COMPLETED -> VOIDED transition (credit back) and the DiversionOrder COMMITTED -> SETTLED transition (debit)"
    algorithm: aggregation
    formula: |
      storage_used_wet_tons = round(
            sum(SolidsBatch.wet_tons where facility_id == facility.id)
          - sum(ApplicationEvent.applied_wet_tons where status == COMPLETED
                and the event's site belongs to facility.id)
          - sum(DiversionOrder.wet_tons where status == SETTLED
                and the order's batch belongs to facility.id), 2)
      storage_utilization_pct = round(storage_used_wet_tons / storage_capacity_wet_tons * 100, 2)

      # INVARIANT: a COMPLETED event that is later VOIDED restores storage_used_wet_tons to the
      # exact value it held before close-out, because the VOIDED status drops out of the
      # COMPLETED filter above.
      # A create request whose wet_tons would push storage_used_wet_tons above
      # storage_capacity_wet_tons is rejected with ERR_STORAGE_CAPACITY_EXCEEDED (strictly greater;
      # landing exactly on capacity is accepted).
    input_set: "Batches by facility_id; COMPLETED events reached through site_id -> LandApplicationSite.facility_id; SETTLED diversion orders reached through batch_id -> SolidsBatch.facility_id. DRAFT and COMMITTED diversion orders do NOT debit storage."
    constants: {}
    precision: "2 decimal places round_half_up on both fields"

  - name: storage_drawdown_projection
    trigger: "On GET /treatment-facilities/{facilityId}/storage-projection and on every mutation that changes storage_used_wet_tons or scheduled removals"
    algorithm: forward_looking
    formula: |
      available = round(storage_capacity_wet_tons - storage_used_wet_tons, 2)
      horizon_end = logical clock now + HORIZON_DAYS days
      scheduled_removal_wet_tons = round(
            sum(ApplicationEvent.planned_wet_tons where status in {SCHEDULED, IN_PROGRESS}
                AND window_start >= clock now AND window_start < horizon_end
                AND the event's site belongs to this facility)
          + sum(DiversionOrder.wet_tons where status == COMMITTED
                AND the order's batch belongs to this facility), 2)
      # WEATHER_HOLD and DEFERRED events are EXCLUDED: a held window is not a removal commitment.
      daily_removal = round(scheduled_removal_wet_tons / HORIZON_DAYS, 4)
      daily_net     = round(daily_production_wet_tons - daily_removal, 4)
      if daily_net <= 0: days_of_capacity = NO_DRAWDOWN_SENTINEL      # empty/zero-net edge
      else:              days_of_capacity = floor(available / daily_net)
    input_set: "Only SCHEDULED and IN_PROGRESS events of this facility whose window_start falls in the half-open interval [clock now, clock now + 30 days), plus every COMMITTED diversion order of this facility regardless of date. An empty removal set yields scheduled_removal_wet_tons == 0.00, which is a legitimate result and not an error."
    constants:
      HORIZON_DAYS: 30
      NO_DRAWDOWN_SENTINEL: 9999
    precision: "available and scheduled_removal 2 decimal places; daily_removal and daily_net 4 decimal places round_half_up; days_of_capacity is a floor to an integer"

  - name: facility_posture
    trigger: "Re-evaluated after every mutation that changes storage_used_wet_tons, open_ceiling_exceedance_count or substantiated_complaint_count_30d, and on POST /_clock/set_current_utc (the 30-day complaint window moves)"
    algorithm: threshold
    formula: |
      # Evaluated top-down; the FIRST matching clause wins.
      if open_ceiling_exceedance_count > 0
         OR storage_utilization_pct >= FROZEN_UTILIZATION_PCT:      posture = FROZEN
      elif storage_utilization_pct >= RESTRICTED_UTILIZATION_PCT
         OR substantiated_complaint_count_30d >= RESTRICTED_COMPLAINT_COUNT:  posture = RESTRICTED
      else:                                                          posture = OPEN
      # Gates: posture == FROZEN rejects POST /solids-batches, the SolidsBatch advance-process
      # transitions, POST /solids-batches/{batchId}/certify and POST /application-events with
      # ERR_FACILITY_FROZEN. posture == RESTRICTED rejects POST /application-events whose
      # window_start is more than 7 days after the logical clock with ERR_FACILITY_RESTRICTED,
      # forcing near-term removal while storage is tight, and never blocks diversion.
    input_set: "The three facility counters as defined on the entity; no other rows participate."
    constants:
      FROZEN_UTILIZATION_PCT: 98.00
      RESTRICTED_UTILIZATION_PCT: 90.00
      RESTRICTED_COMPLAINT_COUNT: 3
    precision: "comparisons on storage_utilization_pct use the 2-decimal rounded value; both thresholds are inclusive (>=)"

  - name: annual_report_rollup
    trigger: "On POST /annual-reports (creation) and re-run on the AnnualReport DRAFT -> SUBMITTED, SUBMITTED -> AMENDED and AMENDED -> SUBMITTED transitions"
    algorithm: aggregation
    formula: |
      Y = report_year
      total_dry_tons_land_applied = round(
          sum(ApplicationEvent.applied_dry_tons where status == COMPLETED
              AND calendar year of window_start == Y
              AND the event's site belongs to facility_id), 3)
      # VOIDED events are excluded, which is why void is blocked once a report covering that year
      # is SUBMITTED or AMENDED.
      diverted_dry_tons_by_outlet_type = for each outlet_type in {COMPOST, LANDFILL, THERMAL}:
          round(sum(DiversionOrder.dry_tons where status == SETTLED
                    AND calendar year of settled_at == Y
                    AND the order's outlet has that outlet_type
                    AND the order's batch belongs to facility_id), 3)
      total_dry_tons_diverted = round(sum of the three outlet_type values, 3)
      vsr_denominator = count(SolidsBatch where facility_id == facility_id
                              AND process_status == DEWATERED
                              AND calendar year of created_at == Y)
      vsr_numerator   = count(those same batches where vsr_pct_van_kleeck >= 38.00)
      vsr_compliance_rate_pct = 0.00 if vsr_denominator == 0
                                else round(vsr_numerator / vsr_denominator * 100, 2)
      ceiling_exceedance_count = count(LabResult where exceeds_ceiling == true
                                       AND the result's batch belongs to facility_id
                                       AND calendar year of analyzed_at == Y)
      sites_reported_count = count(DISTINCT site_id over ApplicationEvent where status == COMPLETED
                                   AND calendar year of window_start == Y
                                   AND the event's site belongs to facility_id)
    input_set: "Rows scoped to facility_id and to calendar year Y by the exact timestamp field named per line (window_start for events, settled_at for diversions, created_at for batches, analyzed_at for lab results). Statuses are filtered exactly as written; nothing else is included."
    constants:
      VSR_MINIMUM_PCT: 38.00
    precision: "tonnage 3 decimal places, rates 2 decimal places, both round_half_up; an empty denominator yields 0.00 rather than an error"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7 and that role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id resolves, validated left to right: facilityId, batchId, siteId, agreementId, eventId, orderId, complaintId, reportId, entryId"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 4
    category: existence
    check: "Every foreign key in the request body resolves, validated in this field order: facility_id, site_id, batch_id, agreement_id, outlet_id, event_id"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_OUTLET_NOT_FOUND | ERR_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /solids-batches, POST /land-application-sites, POST /farmer-agreements, POST /application-events, POST /application-events/{eventId}/haul-tickets, POST /diversion-orders, POST /odor-complaints, POST /annual-reports, POST /solids-batches/{batchId}/lab-results"

  - priority: 5
    category: business_constraint
    check: "Request body satisfies the declared field schema: required fields present, types correct, enum members valid, numeric ranges honored, arrays of months strictly ascending within 1..12, window_end > window_start, term_end > term_start, return_at > depart_at, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: auth
    check: "For Farmer-actor endpoints the caller's X-User-ID equals FarmerAgreement.farmer_user_id of the target agreement"
    error_id: ERR_ACTOR_NOT_PARTY
    http_status: 403
    applies_to: "POST /farmer-agreements/{agreementId}/counter, POST /farmer-agreements/{agreementId}/sign, POST /farmer-agreements/{agreementId}/terminate"

  - priority: 10
    category: state
    check: "expected_site_version equals the current LandApplicationSite.version"
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    applies_to: "POST /farmer-agreements"

  - priority: 11
    category: state
    check: "expected_batch_version equals the current SolidsBatch.version"
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /diversion-orders"

  - priority: 20
    category: state
    check: "The target SolidsBatch is in the process_status / quality_status the requested transition declares as its from-state; lab results require quality_status in {PENDING_RESULTS, QUALIFIED}"
    error_id: "ERR_INVALID_PROCESS_TRANSITION | ERR_INVALID_QUALITY_TRANSITION"
    http_status: 409
    applies_to: "POST /solids-batches/{batchId}/advance-process, POST /solids-batches/{batchId}/certify, POST /solids-batches/{batchId}/retest-request, POST /solids-batches/{batchId}/lab-results"

  - priority: 21
    category: state
    check: "The target LandApplicationSite, FarmerAgreement, ApplicationEvent, DiversionOrder, OdorComplaint or AnnualReport is in the from-state the requested transition declares"
    error_id: "ERR_SITE_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_EVENT_NOT_SCHEDULED | ERR_EVENT_NOT_IN_PROGRESS | ERR_EVENT_NOT_COMPLETED | ERR_ORDER_INVALID_STATE | ERR_COMPLAINT_INVALID_STATE | ERR_REPORT_INVALID_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint on those six entities"

  - priority: 22
    category: state
    check: "The FarmerAgreement negotiation cycle bound is respected: round_index < 3 before a counter is accepted"
    error_id: ERR_AGREEMENT_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /farmer-agreements/{agreementId}/counter"

  - priority: 23
    category: state
    check: "The SolidsBatch retest bound is respected: retest_round < 2 before a retest is accepted"
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /solids-batches/{batchId}/retest-request"

  - priority: 24
    category: state
    check: "The referenced LandApplicationSite.status == PERMITTED (cross-entity state dependency)"
    error_id: ERR_SITE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /application-events, POST /application-events/{eventId}/start, POST /application-events/{eventId}/reschedule, POST /farmer-agreements/{agreementId}/propose"

  - priority: 25
    category: state
    check: "The referenced FarmerAgreement.status == ACTIVE (cross-entity state dependency)"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /application-events, POST /application-events/{eventId}/start, POST /application-events/{eventId}/reschedule"

  - priority: 26
    category: state
    check: "The referenced SolidsBatch.quality_status == QUALIFIED (cross-entity state dependency)"
    error_id: ERR_BATCH_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /application-events, POST /application-events/{eventId}/start"

  - priority: 27
    category: state
    check: "The referenced AlternativeOutlet.status == ACCEPTING (cross-entity state dependency)"
    error_id: ERR_OUTLET_NOT_ACCEPTING
    http_status: 409
    applies_to: "POST /diversion-orders/{orderId}/commit"

  - priority: 28
    category: business_referential
    check: "No AnnualReport for the event's facility and the calendar year of window_start is in status SUBMITTED or AMENDED"
    error_id: ERR_REPORTING_PERIOD_LOCKED
    http_status: 409
    applies_to: "POST /application-events/{eventId}/void"

  - priority: 29
    category: auth
    check: "Segregation of duties: the closing ComplianceOfficer's X-User-ID differs from SolidsBatch.certified_by_user_id of the event's batch"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /application-events/{eventId}/complete"

  - priority: 30
    category: business_safety
    check: "TreatmentFacility.posture of the governing facility is not FROZEN"
    error_id: ERR_FACILITY_FROZEN
    http_status: 409
    applies_to: "POST /solids-batches, POST /solids-batches/{batchId}/advance-process, POST /solids-batches/{batchId}/certify, POST /application-events"

  - priority: 31
    category: business_safety
    check: "When TreatmentFacility.posture == RESTRICTED, window_start is no more than 7 days after the logical clock"
    error_id: ERR_FACILITY_RESTRICTED
    http_status: 409
    applies_to: "POST /application-events"

  - priority: 32
    category: business_safety
    check: "The referenced LandApplicationSite.status != RESTRICTED"
    error_id: ERR_SITE_RESTRICTED
    http_status: 409
    applies_to: "POST /application-events, POST /application-events/{eventId}/start, POST /application-events/{eventId}/complete"

  - priority: 33
    category: business_safety
    check: "SolidsBatch pathogen_class is one of {CLASS_B, CLASS_A} per calculations.pathogen_class_determination"
    error_id: ERR_PATHOGEN_CLASS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /solids-batches/{batchId}/certify"

  - priority: 34
    category: business_safety
    check: "Vector attraction reduction evidence for the chosen plant-side option is present and passes: VAR_OPTION_1_VSR needs vsr_pct_van_kleeck >= 38.00, VAR_OPTION_3_SOUR needs sour_mg_o2_per_g_hr <= 1.5 with digester_temp_c <= 20.0, VAR_OPTION_5_AEROBIC needs aerobic_process_days >= 14.0 with digester_temp_c >= 40.0"
    error_id: "ERR_VSR_BELOW_MINIMUM | ERR_VECTOR_OPTION_EVIDENCE_MISSING"
    http_status: 422
    applies_to: "POST /solids-batches/{batchId}/certify"

  - priority: 35
    category: business_safety
    check: "Every analyte carrying an ACTIVE PollutantLimit row has a LabResult in the batch's current sampling round, none with exceeds_ceiling == true and none with exceeds_monthly_avg == true"
    error_id: "ERR_ANALYTE_PANEL_INCOMPLETE | ERR_CEILING_EXCEEDED | ERR_MONTHLY_AVG_EXCEEDED"
    http_status: 422
    applies_to: "POST /solids-batches/{batchId}/certify"

  - priority: 36
    category: business_safety
    check: "Method-conditional setbacks: application_method == SURFACE requires setback_to_surface_water_ft >= 100 and slope_pct <= 15.0; INCORPORATED requires setback_to_surface_water_ft >= 66; INJECTED requires setback_to_surface_water_ft >= 33; every method requires setback_to_well_ft >= 100"
    error_id: ERR_SETBACK_VIOLATION
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 37
    category: business_safety
    check: "LandApplicationSite.gating_risk_score < 60.00 per calculations.site_odor_risk_score"
    error_id: ERR_ODOR_RISK_BLOCK
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 38
    category: business_safety
    check: "LandApplicationSite.soil_p_index < 100 per step 3 of calculations.agronomic_rate_cap"
    error_id: ERR_PHOSPHORUS_INDEX_BLOCK
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 39
    category: business_safety
    check: "LandApplicationSite.weather_clearance_ok == true (latest_rainfall_in_24h < 0.50 AND latest_forecast_rainfall_in_48h < 1.00 AND latest_frozen_ground == false)"
    error_id: ERR_WEATHER_RESTRICTION
    http_status: 422
    applies_to: "POST /application-events/{eventId}/start"

  - priority: 40
    category: business_safety
    check: "Deferred vector option demonstrated in the field: VAR_OPTION_9_INJECTION requires application_method == INJECTED, VAR_OPTION_10_INCORPORATION requires incorporation_within_hours <= 6"
    error_id: ERR_VECTOR_OPTION_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /application-events/{eventId}/complete"

  - priority: 41
    category: business_temporal
    check: "The logical clock is inside the half-open window [window_start, window_end) of the event being started"
    error_id: ERR_OUTSIDE_APPLICATION_WINDOW
    http_status: 409
    applies_to: "POST /application-events/{eventId}/start"

  - priority: 61
    category: business_constraint
    check: "At least one HaulTicket exists with event_id == the event being closed out"
    error_id: ERR_NO_HAUL_TICKET
    http_status: 422
    applies_to: "POST /application-events/{eventId}/complete"

  - priority: 62
    category: business_constraint
    check: "applied_dry_tons > 0 AND applied_dry_tons <= planned_dry_tons"
    error_id: ERR_APPLIED_TONS_INVALID
    http_status: 422
    applies_to: "POST /application-events/{eventId}/complete"

  - priority: 42
    category: business_temporal
    check: "The requested window [window_start, window_end) does not overlap any other ApplicationEvent on the same site with status in {SCHEDULED, WEATHER_HOLD, DEFERRED, IN_PROGRESS}; half-open semantics, so an existing window ending exactly at the new window_start is accepted"
    error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 43
    category: business_temporal
    check: "window_start >= (latest window_end among COMPLETED events on this site) + reapplication_interval_days; the buffer is measured from window_end and the boundary instant itself is accepted"
    error_id: ERR_REAPPLICATION_INTERVAL
    http_status: 409
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 44
    category: business_referential
    check: "FarmerAgreement.site_id equals the request's site_id"
    error_id: ERR_AGREEMENT_SITE_MISMATCH
    http_status: 422
    applies_to: "POST /application-events"

  - priority: 45
    category: business_referential
    check: "The window is inside the agreement term: window_start >= FarmerAgreement.term_start AND window_end <= FarmerAgreement.term_end"
    error_id: ERR_AGREEMENT_TERM_COVERAGE
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 46
    category: business_temporal
    check: "The calendar month of window_start is a member of LandApplicationSite.allowed_application_months"
    error_id: ERR_CROP_CYCLE_CONFLICT
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 47
    category: business_temporal
    check: "window_start >= logical clock now + FarmerAgreement.notice_days days"
    error_id: ERR_NOTICE_PERIOD_NOT_MET
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 48
    category: business_constraint
    check: "Closed-interval loadout bay occupancy: the count of HaulTicket rows on this facility whose [depart_at, return_at] closed interval shares any instant with the requested [depart_at, return_at] must be < TreatmentFacility.loadout_bay_count; touching endpoints DO share an instant"
    error_id: ERR_LOADOUT_BAY_CAPACITY
    http_status: 409
    applies_to: "POST /application-events/{eventId}/haul-tickets"

  - priority: 49
    category: business_constraint
    check: "acres_treated > 0 and acres_treated <= LandApplicationSite.acres"
    error_id: ERR_ACRES_EXCEED_SITE
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 50
    category: business_fiscal
    check: "plant_available_n_lb_per_dry_ton > 0 per step 1 of calculations.agronomic_rate_cap"
    error_id: ERR_AGRONOMIC_RATE_UNDEFINED
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 51
    category: business_fiscal
    check: "requested_rate_dry_tons_per_acre <= agronomic_rate_cap_dry_tons_per_acre; equality is accepted"
    error_id: ERR_AGRONOMIC_RATE_EXCEEDED
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 52
    category: business_fiscal
    check: "For every analyte with a CPLR: cumulative_loading + this event's rounded increment <= cplr_kg_per_hectare; equality is accepted"
    error_id: ERR_CPLR_HEADROOM_EXCEEDED
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 53
    category: business_fiscal
    check: "For every analyte with an APLR: annual_loading for the window's year + this event's rounded increment <= aplr_kg_per_hectare_yr; equality is accepted"
    error_id: ERR_APLR_EXCEEDED
    http_status: 422
    applies_to: "POST /application-events, POST /application-events/{eventId}/reschedule"

  - priority: 54
    category: business_fiscal
    check: "planned_dry_tons <= SolidsBatch.unallocated_dry_tons (events) / dry_tons <= SolidsBatch.unallocated_dry_tons (diversion orders); equality is accepted"
    error_id: ERR_INSUFFICIENT_UNALLOCATED_TONS
    http_status: 422
    applies_to: "POST /application-events, POST /diversion-orders"

  - priority: 55
    category: business_fiscal
    check: "storage_used_wet_tons + wet_tons <= TreatmentFacility.storage_capacity_wet_tons; equality is accepted"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /solids-batches"

  - priority: 56
    category: business_fiscal
    check: "wet_tons >= AlternativeOutlet.min_load_wet_tons AND SolidsBatch.percent_solids >= AlternativeOutlet.min_percent_solids"
    error_id: ERR_OUTLET_ACCEPTANCE_CRITERIA
    http_status: 422
    applies_to: "POST /diversion-orders/{orderId}/commit"

  - priority: 57
    category: business_fiscal
    check: "AlternativeOutlet.ytd_accepted_wet_tons + wet_tons <= AlternativeOutlet.max_annual_wet_tons; equality is accepted"
    error_id: ERR_OUTLET_ANNUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /diversion-orders/{orderId}/commit"

  - priority: 58
    category: business_constraint
    check: "Uniqueness: SolidsBatch.batch_code unique per facility_id; LandApplicationSite.site_code unique per facility_id; TreatmentFacility.npdes_permit_number unique; AnnualReport.report_year unique per facility_id across status in {DRAFT, SUBMITTED, AMENDED}; LabResult (batch_id, analyte, sampling_event_index) unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /treatment-facilities, POST /solids-batches, POST /land-application-sites, POST /annual-reports, POST /solids-batches/{batchId}/lab-results"

  - priority: 59
    category: business_constraint
    check: "LabResult.sampling_event_index equals SolidsBatch.retest_round of the target batch"
    error_id: ERR_SAMPLING_ROUND_MISMATCH
    http_status: 422
    applies_to: "POST /solids-batches/{batchId}/lab-results"

  - priority: 60
    category: business_constraint
    check: "An ACTIVE PollutantLimit row exists for the posted analyte"
    error_id: ERR_LIMIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /solids-batches/{batchId}/lab-results"

# =====================================================================
# §1.5 API Endpoint Table
# All paths are flat, root-level collections (api_prefix "/"); cross-entity
# links travel as foreign keys in request bodies and as `?`-optional query
# filters, never as nested URL segments (the two exceptions are the two
# child collections LabResult and HaulTicket, which are only ever read
# through their parent).
# =====================================================================
endpoints:
  # ------------------------------------------------------------------ facility
  - method: POST
    path: /treatment-facilities
    description: "Register a wastewater treatment facility. storage_used_wet_tons starts at 0.00, storage_utilization_pct at 0.00, open_ceiling_exceedance_count at 0, substantiated_complaint_count_30d at 0, days_of_capacity at 9999 and posture at OPEN."
    roles: [FacilityOperator, ComplianceOfficer]
    input: ["name", "npdes_permit_number", "storage_capacity_wet_tons", "daily_production_wet_tons", "loadout_bay_count"]
    output: TreatmentFacility
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_RESOURCE]
    side_effects:
      - "Creates the TreatmentFacility with version 1 and all derived counters at their documented zero values."

  - method: GET
    path: /treatment-facilities/{facilityId}
    description: "Read one facility with its live derived posture and storage figures."
    roles: [FacilityOperator, ComplianceOfficer, Agronomist, LabAnalyst, PublicLiaison]
    input: []
    output: TreatmentFacility
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FACILITY_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /treatment-facilities
    description: "List facilities ordered by created_at ASC."
    roles: [FacilityOperator, ComplianceOfficer, Agronomist, LabAnalyst, PublicLiaison]
    input: ["posture?", "limit?", "offset?"]
    output: TreatmentFacility[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: GET
    path: /treatment-facilities/{facilityId}/storage-projection
    description: "Wet-weather storage drawdown projection per calculations.storage_drawdown_projection. days_of_capacity is 9999 when the projected 30-day drawdown does not exceed inflow."
    roles: [FacilityOperator, ComplianceOfficer, Agronomist]
    input: []
    output:
      facility_id: string
      storage_used_wet_tons: number
      storage_capacity_wet_tons: number
      storage_utilization_pct: number
      projected_outflow_wet_tons: number
      projected_inflow_wet_tons: number
      days_of_capacity: integer
      posture: string
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FACILITY_NOT_FOUND]
    side_effects: []

  # ----------------------------------------------------------- pollutant limits
  - method: POST
    path: /pollutant-limits
    description: "Seed or supersede the regulatory limit row for one analyte. Creating a second ACTIVE row for the same analyte moves the previous row to SUPERSEDED. Analytes without a land-application APLR or CPLR (MOLYBDENUM, PFOS) omit those fields."
    roles: [ComplianceOfficer]
    input: ["analyte", "ceiling_mg_kg", "monthly_avg_mg_kg", "aplr_kg_per_hectare_yr?", "cplr_kg_per_hectare?", "advisory_threshold_mg_kg?"]
    output: PollutantLimit
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects:
      - "Sets any prior ACTIVE PollutantLimit for the same analyte to SUPERSEDED and increments its version by 1."

  - method: GET
    path: /pollutant-limits/{limitId}
    description: "Read one pollutant limit row."
    roles: [ComplianceOfficer, LabAnalyst, Agronomist, FacilityOperator, PublicLiaison]
    input: []
    output: PollutantLimit
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_LIMIT_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /pollutant-limits
    description: "List pollutant limits ordered by analyte ASC then created_at ASC."
    roles: [ComplianceOfficer, LabAnalyst, Agronomist, FacilityOperator, PublicLiaison]
    input: ["analyte?", "status?", "limit?", "offset?"]
    output: PollutantLimit[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  # -------------------------------------------------------------- solids batch
  - method: POST
    path: /solids-batches
    description: "Create a solids batch entering the process train at THICKENED with quality_status UNTESTED and disposition HELD. Optional fields default as follows: detention_days 0.0, digester_temp_c 0.0, stabilization_process ANAEROBIC_DIGESTION, pathogen_option PSRP_ALT1_TIME_TEMP, vector_option VAR_OPTION_1_VSR, fecal_coliform_mpn_per_g and salmonella_mpn_per_4g null, sour_mg_o2_per_g_hr null, aerobic_process_days 0.0, nutrient panel fields 0.0."
    roles: [FacilityOperator]
    input: ["facility_id", "batch_code", "wet_tons", "dry_tons_in", "volatile_solids_in_pct", "percent_solids", "detention_days?", "digester_temp_c?", "stabilization_process?", "pathogen_option?", "vector_option?", "fecal_coliform_mpn_per_g?", "salmonella_mpn_per_4g?", "sour_mg_o2_per_g_hr?", "aerobic_process_days?", "nh4_n_mg_kg?", "organic_n_mg_kg?", "nitrate_n_mg_kg?", "total_p_mg_kg?"]
    output: SolidsBatch
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_DUPLICATE_RESOURCE, ERR_FACILITY_FROZEN, ERR_STORAGE_CAPACITY_EXCEEDED]
    side_effects:
      - "Adds wet_tons to TreatmentFacility.storage_used_wet_tons, re-derives storage_utilization_pct and posture per calculations.facility_posture, and increments the facility version by 1."
      - "dry_tons_produced, unallocated_dry_tons, vsr_pct_van_kleeck and vsr_pct_mass_balance stay 0.000 until the batch is dewatered."

  - method: GET
    path: /solids-batches/{batchId}
    description: "Read one batch with both VSR variants, pathogen_class, vector_demonstrated_at_batch and the live tonnage allocation figures."
    roles: [FacilityOperator, ComplianceOfficer, LabAnalyst, Agronomist]
    input: []
    output: SolidsBatch
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BATCH_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /solids-batches
    description: "List batches ordered by created_at ASC, filtered by facility, process stage, quality state or allocation disposition."
    roles: [FacilityOperator, ComplianceOfficer, LabAnalyst, Agronomist]
    input: ["facility_id?", "process_status?", "quality_status?", "disposition?", "limit?", "offset?"]
    output: SolidsBatch[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /solids-batches/{batchId}/advance-process
    description: "Advance the process dimension THICKENED -> DIGESTED -> DEWATERED. to_status names the next stage. Advancing to DIGESTED requires dry_tons_out, volatile_solids_out_pct, detention_days and digester_temp_c in the request; it persists them, computes both VSR variants and pathogen_class, and moves the quality dimension UNTESTED -> REJECTED with rejection_reason VSR_BELOW_MINIMUM when vector_option is VAR_OPTION_1_VSR and vsr_pct_van_kleeck < 38.00. Advancing to DEWATERED sets dry_tons_produced and unallocated_dry_tons from dry_tons_out and moves the quality dimension UNTESTED -> PENDING_RESULTS, opening sampling round 0."
    roles: [FacilityOperator]
    input: ["to_status", "dry_tons_out?", "volatile_solids_out_pct?", "detention_days?", "digester_temp_c?", "percent_solids?", "sour_mg_o2_per_g_hr?", "aerobic_process_days?"]
    output: SolidsBatch
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BATCH_NOT_FOUND, ERR_INVALID_PROCESS_TRANSITION, ERR_FACILITY_FROZEN]
    side_effects:
      - "Increments the batch version by 1 and sets updated_at to the logical clock."
      - "On the DIGESTED transition writes vsr_pct_van_kleeck and vsr_pct_mass_balance per calculations.volatile_solids_reduction and pathogen_class per calculations.pathogen_class_determination; on the DEWATERED transition writes dry_tons_produced = dry_tons_out and unallocated_dry_tons = dry_tons_out."
      - "A VSR-driven rejection sets quality_status REJECTED and rejection_reason VSR_BELOW_MINIMUM without touching facility.open_ceiling_exceedance_count."

  - method: POST
    path: /solids-batches/{batchId}/lab-results
    description: "File one analyte result for the batch's current sampling round. Accepted while quality_status is PENDING_RESULTS or QUALIFIED, refused otherwise. Writes exceeds_ceiling, exceeds_monthly_avg and advisory_exceeded against the ACTIVE PollutantLimit row for that analyte. A ceiling exceedance opens the three-hop rejection cascade, withdrawing an existing certification if there was one."
    roles: [LabAnalyst]
    input: ["analyte", "concentration_mg_kg", "sampling_event_index", "analyzed_at", "method_code?"]
    output: LabResult
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BATCH_NOT_FOUND, ERR_LIMIT_NOT_FOUND, ERR_INVALID_QUALITY_TRANSITION, ERR_DUPLICATE_RESOURCE, ERR_SAMPLING_ROUND_MISMATCH]
    side_effects:
      - "When exceeds_ceiling is true: sets SolidsBatch.ceiling_exceedance_flag true, quality_status REJECTED, rejection_reason CEILING_EXCEEDED, clears certified_at and certified_by_user_id when the batch had been certified, releases the batch's reserved tonnage back to unallocated_dry_tons and increments the batch version by 1."
      - "That rejection then cancels every ApplicationEvent on the batch in status SCHEDULED, WEATHER_HOLD, DEFERRED or IN_PROGRESS (each -> CANCELLED, version +1) and voids every DRAFT DiversionOrder on the batch."
      - "It then increments TreatmentFacility.open_ceiling_exceedance_count by 1, re-derives posture per calculations.facility_posture and increments the facility version by 1."
      - "When advisory_exceeded is true for PFOS: sets pfas_advisory_flag true on every PERMITTED or RESTRICTED LandApplicationSite that already has a COMPLETED ApplicationEvent for this batch, re-derives their odor risk scores and increments each site version by 1."

  - method: GET
    path: /solids-batches/{batchId}/lab-results
    description: "All lab results filed against the batch, ordered by sampling_event_index ASC then analyte ASC then created_at ASC."
    roles: [LabAnalyst, ComplianceOfficer, FacilityOperator, Agronomist]
    input: ["analyte?", "sampling_event_index?"]
    output: LabResult[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BATCH_NOT_FOUND, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /solids-batches/{batchId}/certify
    description: "Compliance sign-off moving quality_status PENDING_RESULTS -> QUALIFIED. Requires one current-round LabResult for every analyte that carries an ACTIVE PollutantLimit row at the moment of certification, with no ceiling and no monthly-average exceedance, a pathogen_class of CLASS_B or CLASS_A, and plant-side vector evidence for options 1, 3 and 5. Options 9 and 10 defer their demonstration to field application. A limit row seeded after certification is not retroactively required, but a result filed against it later can still reject the batch."
    roles: [ComplianceOfficer]
    input: []
    output: SolidsBatch
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BATCH_NOT_FOUND, ERR_INVALID_QUALITY_TRANSITION, ERR_FACILITY_FROZEN, ERR_PATHOGEN_CLASS_INSUFFICIENT, ERR_VSR_BELOW_MINIMUM, ERR_VECTOR_OPTION_EVIDENCE_MISSING, ERR_ANALYTE_PANEL_INCOMPLETE, ERR_CEILING_EXCEEDED, ERR_MONTHLY_AVG_EXCEEDED]
    side_effects:
      - "Sets quality_status QUALIFIED, certified_at to the logical clock, certified_by_user_id to the calling X-User-ID and increments the batch version by 1."

  - method: POST
    path: /solids-batches/{batchId}/retest-request
    description: "Reopen a REJECTED batch for one more sampling round, moving quality_status REJECTED -> PENDING_RESULTS and incrementing retest_round. Bounded at retest_round < 2, so a batch can be resampled at most twice."
    roles: [ComplianceOfficer]
    input: []
    output: SolidsBatch
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BATCH_NOT_FOUND, ERR_INVALID_QUALITY_TRANSITION, ERR_RETEST_LIMIT_REACHED]
    side_effects:
      - "Increments retest_round by 1, clears ceiling_exceedance_flag and rejection_reason, sets quality_status PENDING_RESULTS and increments the batch version by 1."
      - "Decrements TreatmentFacility.open_ceiling_exceedance_count by 1 when the cleared rejection_reason was CEILING_EXCEEDED, re-derives posture and increments the facility version by 1."
      - "Prior-round LabResult rows are retained but excluded from every certify check and from every calculation."

  # ------------------------------------------------------- land application site
  - method: POST
    path: /land-application-sites
    description: "Register a candidate land application site in DRAFT. Optional fields default to soil_ph 6.5, depth_to_groundwater_ft 10.0, slope_pct 3.0, nearest_residence_ft 3000 and reapplication_interval_days 30. Weather fields start null with weather_clearance_ok false until the first observation is posted; cumulative_loading_kg_per_hectare and annual_loading_kg_per_hectare start as empty maps."
    roles: [Agronomist]
    input: ["facility_id", "site_code", "acres", "crop_type", "crop_n_demand_lb_per_acre", "crop_p_removal_lb_per_acre", "soil_p_index", "setback_to_well_ft", "setback_to_surface_water_ft", "allowed_application_months", "soil_ph?", "depth_to_groundwater_ft?", "slope_pct?", "nearest_residence_ft?", "reapplication_interval_days?"]
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_DUPLICATE_RESOURCE]
    side_effects:
      - "Creates the site in DRAFT with version 1, odor_risk_score_historical 0.00, odor_risk_score_precautionary 0.00, gating_risk_score 0.00 and pfas_advisory_flag false."

  - method: GET
    path: /land-application-sites/{siteId}
    description: "Read one site with its live loading maps, odor risk scores and weather clearance."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator, PublicLiaison, Farmer]
    input: []
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SITE_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /land-application-sites
    description: "List sites ordered by created_at ASC."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator, PublicLiaison, Farmer]
    input: ["facility_id?", "status?", "crop_type?", "limit?", "offset?"]
    output: LandApplicationSite[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /land-application-sites/{siteId}/submit-permit
    description: "Submit a DRAFT site for permit review, moving DRAFT -> UNDER_REVIEW. Baseline siting screen: setback_to_well_ft >= 100, setback_to_surface_water_ft >= 33, depth_to_groundwater_ft >= 3.0, soil_ph >= 6.0 and a non-empty allowed_application_months array. The stricter method-conditional setbacks are enforced later, per application event."
    roles: [Agronomist]
    input: []
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SITE_NOT_FOUND, ERR_SITE_INVALID_STATE, ERR_SETBACK_VIOLATION]
    side_effects:
      - "Sets status UNDER_REVIEW and increments the site version by 1."

  - method: POST
    path: /land-application-sites/{siteId}/permit-decision
    description: "Compliance decision on a site UNDER_REVIEW. decision APPROVE moves it to PERMITTED and stamps permit_number and permitted_at, and requires a non-blank permit_number; decision REJECT moves it back to DRAFT for revision."
    roles: [ComplianceOfficer]
    input: ["decision", "permit_number?"]
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_SITE_INVALID_STATE]
    side_effects:
      - "APPROVE sets status PERMITTED, permit_number and permitted_at (logical clock) and increments the site version by 1."
      - "REJECT sets status DRAFT, leaves permit_number null and increments the site version by 1."

  - method: POST
    path: /land-application-sites/{siteId}/restrict
    description: "Officer-ordered restriction of a PERMITTED site, moving PERMITTED -> RESTRICTED with restriction_reason OFFICER_ORDER. The same transition also fires automatically from the loading cascade with reason CPLR_HEADROOM_LOW and from a substantiated odor complaint with reason ODOR_RISK_HIGH."
    roles: [ComplianceOfficer]
    input: []
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SITE_NOT_FOUND, ERR_SITE_INVALID_STATE]
    side_effects:
      - "Sets status RESTRICTED, restriction_reason OFFICER_ORDER and increments the site version by 1."
      - "Moves every ApplicationEvent on the site in status SCHEDULED or WEATHER_HOLD to DEFERRED with defer_reason SITE_RESTRICTED, incrementing each event version by 1."

  - method: POST
    path: /land-application-sites/{siteId}/reinstate
    description: "Lift a restriction, moving RESTRICTED -> PERMITTED. Both substantive conditions must hold regardless of restriction_reason: cumulative loading below 0.90 of the CPLR for every analyte carrying one, and gating_risk_score below 60.00."
    roles: [ComplianceOfficer]
    input: []
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SITE_NOT_FOUND, ERR_SITE_INVALID_STATE, ERR_CPLR_HEADROOM_EXCEEDED, ERR_ODOR_RISK_BLOCK]
    side_effects:
      - "Sets status PERMITTED, clears restriction_reason and increments the site version by 1. DEFERRED events are not automatically rescheduled; each must be rescheduled explicitly."

  - method: POST
    path: /land-application-sites/{siteId}/close
    description: "Permanently retire a PERMITTED or RESTRICTED site, moving it to CLOSED. Refused while any ApplicationEvent on the site is in SCHEDULED, WEATHER_HOLD, DEFERRED or IN_PROGRESS."
    roles: [Agronomist, ComplianceOfficer]
    input: []
    output: LandApplicationSite
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SITE_NOT_FOUND, ERR_SITE_INVALID_STATE, ERR_OPEN_EVENTS_EXIST]
    side_effects:
      - "Sets status CLOSED and increments the site version by 1."
      - "Moves every FarmerAgreement on the site in status DRAFT, PROPOSED or COUNTERED to WITHDRAWN, incrementing each agreement version by 1. ACTIVE agreements are left standing and must be terminated explicitly."

  - method: GET
    path: /land-application-sites/{siteId}/loading-summary
    description: "Cumulative and annual metal loading for the site with the remaining CPLR and APLR headroom per analyte, plus the analyte currently closest to its ceiling. Values are the rounded ledger sums per calculations.cumulative_loading_ledger."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator, PublicLiaison]
    input: ["applied_year?"]
    output:
      site_id: string
      cumulative_loading_kg_per_hectare: object
      annual_loading_kg_per_hectare: object
      cplr_headroom_kg_per_hectare: object
      aplr_headroom_kg_per_hectare: object
      binding_analyte: string
      pfas_advisory_flag: boolean
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SITE_NOT_FOUND, ERR_INVALID_REQUEST]
    side_effects: []

  # -------------------------------------------------------------- loading ledger
  - method: GET
    path: /loading-ledger-entries/{entryId}
    description: "Read one immutable loading ledger entry."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator]
    input: []
    output: LoadingLedgerEntry
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_LEDGER_ENTRY_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /loading-ledger-entries
    description: "List loading ledger entries ordered by created_at ASC. Filter by site, by originating application event, by the entry a reversal offsets, by analyte or by applied year. This is the audit view behind every CPLR and APLR decision."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator]
    input: ["site_id?", "source_event_id?", "reversal_of_id?", "analyte?", "applied_year?", "entry_type?", "limit?", "offset?"]
    output: LoadingLedgerEntry[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  # ----------------------------------------------------------- farmer agreements
  - method: POST
    path: /farmer-agreements
    description: "Draft a land application agreement with the farming operator of a site. expected_site_version must equal the site's current version; the site is the negotiation's anchor and a stale value is refused with 412. notice_days defaults to 14."
    roles: [Agronomist]
    input: ["site_id", "expected_site_version", "farmer_user_id", "farm_name", "term_start", "term_end", "max_dry_tons_per_acre", "notice_days?"]
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_STALE_SITE_VERSION]
    side_effects:
      - "Creates the agreement in DRAFT with round_index 0, last_proposed_by_role NONE and version 1."
      - "Increments LandApplicationSite.version by 1 so that any other holder of the previous version is forced to re-read before its own write."

  - method: GET
    path: /farmer-agreements/{agreementId}
    description: "Read one agreement with its negotiation round counter."
    roles: [Agronomist, ComplianceOfficer, Farmer, FacilityOperator]
    input: []
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_AGREEMENT_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /farmer-agreements
    description: "List agreements ordered by created_at ASC, filtered by site, farmer or status."
    roles: [Agronomist, ComplianceOfficer, Farmer, FacilityOperator]
    input: ["site_id?", "farmer_user_id?", "status?", "limit?", "offset?"]
    output: FarmerAgreement[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /farmer-agreements/{agreementId}/propose
    description: "Send a DRAFT or COUNTERED agreement to the farmer, moving it to PROPOSED with last_proposed_by_role Agronomist. Requires the site to be PERMITTED."
    roles: [Agronomist]
    input: ["max_dry_tons_per_acre?", "notice_days?"]
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_AGREEMENT_NOT_FOUND, ERR_AGREEMENT_INVALID_STATE, ERR_SITE_NOT_PERMITTED]
    side_effects:
      - "Sets status PROPOSED, last_proposed_by_role Agronomist, applies any supplied term overrides and increments the agreement version by 1."

  - method: POST
    path: /farmer-agreements/{agreementId}/counter
    description: "Farmer counter-offer on a PROPOSED agreement, moving it to COUNTERED and incrementing round_index. Bounded at round_index < 3, so the propose/counter cycle can turn at most three times before the agreement must be signed or withdrawn."
    roles: [Farmer]
    input: ["max_dry_tons_per_acre?", "notice_days?"]
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_AGREEMENT_NOT_FOUND, ERR_ACTOR_NOT_PARTY, ERR_AGREEMENT_INVALID_STATE, ERR_AGREEMENT_ROUND_LIMIT]
    side_effects:
      - "Sets status COUNTERED, last_proposed_by_role Farmer, increments round_index by 1, applies any supplied term overrides and increments the agreement version by 1."

  - method: POST
    path: /farmer-agreements/{agreementId}/sign
    description: "Farmer acceptance of a PROPOSED agreement, moving it to SIGNED and stamping signed_at."
    roles: [Farmer]
    input: []
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_AGREEMENT_NOT_FOUND, ERR_ACTOR_NOT_PARTY, ERR_AGREEMENT_INVALID_STATE]
    side_effects:
      - "Sets status SIGNED, signed_at to the logical clock and increments the agreement version by 1."

  - method: POST
    path: /farmer-agreements/{agreementId}/activate
    description: "Bring a SIGNED agreement into force, moving it to ACTIVE. Refused when another ACTIVE agreement already covers the same site with an overlapping term (half-open [term_start, term_end) semantics)."
    roles: [Agronomist]
    input: []
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_AGREEMENT_NOT_FOUND, ERR_AGREEMENT_INVALID_STATE, ERR_AGREEMENT_TERM_OVERLAP]
    side_effects:
      - "Sets status ACTIVE and increments the agreement version by 1."

  - method: POST
    path: /farmer-agreements/{agreementId}/withdraw
    description: "Abandon a negotiation from DRAFT, PROPOSED or COUNTERED, moving it to WITHDRAWN."
    roles: [Agronomist]
    input: []
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_AGREEMENT_NOT_FOUND, ERR_AGREEMENT_INVALID_STATE]
    side_effects:
      - "Sets status WITHDRAWN and increments the agreement version by 1."

  - method: POST
    path: /farmer-agreements/{agreementId}/terminate
    description: "End an ACTIVE agreement early. Either party may terminate: the Agronomist for the utility, the Farmer named on the agreement for the farm."
    roles: [Agronomist, Farmer]
    input: ["termination_reason"]
    output: FarmerAgreement
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_AGREEMENT_NOT_FOUND, ERR_ACTOR_NOT_PARTY, ERR_AGREEMENT_INVALID_STATE]
    side_effects:
      - "Sets status TERMINATED, terminated_at to the logical clock, termination_reason and increments the agreement version by 1."
      - "Cancels every ApplicationEvent on the agreement in status SCHEDULED, WEATHER_HOLD or DEFERRED, incrementing each event version by 1 and releasing its reserved_dry_tons back to the batch's unallocated_dry_tons."

  # ---------------------------------------------------------- application events
  - method: POST
    path: /application-events
    description: "Schedule a land application. The server derives requested_rate_dry_tons_per_acre, plant_available_n_lb_per_dry_ton, agronomic_rate_cap_dry_tons_per_acre and binding_rate_constraint per calculations.agronomic_rate_cap, then screens the request through the safety, temporal, referential and quota ladders of §1.4. incorporation_within_hours defaults to null."
    roles: [Agronomist]
    input: ["site_id", "batch_id", "agreement_id", "window_start", "window_end", "application_method", "acres_treated", "planned_dry_tons", "incorporation_within_hours?"]
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SITE_NOT_PERMITTED, ERR_AGREEMENT_NOT_ACTIVE, ERR_BATCH_NOT_QUALIFIED, ERR_FACILITY_FROZEN, ERR_FACILITY_RESTRICTED, ERR_SITE_RESTRICTED, ERR_SETBACK_VIOLATION, ERR_ODOR_RISK_BLOCK, ERR_PHOSPHORUS_INDEX_BLOCK, ERR_SITE_WINDOW_CONFLICT, ERR_REAPPLICATION_INTERVAL, ERR_AGREEMENT_SITE_MISMATCH, ERR_AGREEMENT_TERM_COVERAGE, ERR_CROP_CYCLE_CONFLICT, ERR_NOTICE_PERIOD_NOT_MET, ERR_ACRES_EXCEED_SITE, ERR_AGRONOMIC_RATE_UNDEFINED, ERR_AGRONOMIC_RATE_EXCEEDED, ERR_CPLR_HEADROOM_EXCEEDED, ERR_APLR_EXCEEDED, ERR_INSUFFICIENT_UNALLOCATED_TONS]
    side_effects:
      - "Creates the event in SCHEDULED with version 1, applied_dry_tons 0.000, applied_wet_tons 0.00 and reserved_dry_tons = planned_dry_tons."
      - "Moves planned_dry_tons from SolidsBatch.unallocated_dry_tons into the batch's reserved column, re-derives disposition (HELD, PARTIALLY_COMMITTED or FULLY_COMMITTED) and increments the batch version by 1. No LoadingLedgerEntry is written yet: reservation consumes tonnage, not loading headroom."
      - "planned_wet_tons is derived as planned_dry_tons / (percent_solids / 100) rounded to 2 decimal places."

  - method: GET
    path: /application-events/{eventId}
    description: "Read one application event with its derived rate figures and binding constraint."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator, Farmer]
    input: []
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EVENT_NOT_FOUND]
    side_effects: []

  - method: GET
    path: /application-events
    description: "List application events ordered by window_start ASC then created_at ASC, filtered by site, batch, agreement or status."
    roles: [Agronomist, ComplianceOfficer, FacilityOperator, Farmer]
    input: ["site_id?", "batch_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: ApplicationEvent[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    side_effects: []

  - method: POST
    path: /application-events/{eventId}/weather-hold
    description: "Place a SCHEDULED event on WEATHER_HOLD, or clear the hold back to SCHEDULED when hold_reason is CLEARED. Clearing requires the site's weather_clearance_ok to be true."
    roles: [Agronomist, FacilityOperator]
    input: ["hold_reason"]
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_SCHEDULED, ERR_WEATHER_RESTRICTION]
    side_effects:
      - "Sets status WEATHER_HOLD with the supplied hold_reason, or back to SCHEDULED with hold_reason cleared, and increments the event version by 1. Reserved tonnage is untouched in both directions."

  - method: POST
    path: /application-events/{eventId}/reschedule
    description: "Move a SCHEDULED, WEATHER_HOLD or DEFERRED event to a new window, re-running the full §1.4 ladder from priority 24 onward against the new window and any revised tonnage. A DEFERRED event returns to SCHEDULED; a WEATHER_HOLD event returns to SCHEDULED only when the site's weather clearance holds."
    roles: [Agronomist]
    input: ["window_start", "window_end", "application_method?", "acres_treated?", "planned_dry_tons?", "incorporation_within_hours?"]
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_SCHEDULED, ERR_SITE_NOT_PERMITTED, ERR_AGREEMENT_NOT_ACTIVE, ERR_SITE_RESTRICTED, ERR_SETBACK_VIOLATION, ERR_ODOR_RISK_BLOCK, ERR_PHOSPHORUS_INDEX_BLOCK, ERR_SITE_WINDOW_CONFLICT, ERR_REAPPLICATION_INTERVAL, ERR_AGREEMENT_TERM_COVERAGE, ERR_CROP_CYCLE_CONFLICT, ERR_NOTICE_PERIOD_NOT_MET, ERR_ACRES_EXCEED_SITE, ERR_AGRONOMIC_RATE_UNDEFINED, ERR_AGRONOMIC_RATE_EXCEEDED, ERR_CPLR_HEADROOM_EXCEEDED, ERR_APLR_EXCEEDED, ERR_INSUFFICIENT_UNALLOCATED_TONS]
    side_effects:
      - "Sets status SCHEDULED, writes the new window and any revised tonnage, clears hold_reason and defer_reason, re-derives every rate field and increments the event version by 1."
      - "A change in planned_dry_tons adjusts the batch's reserved and unallocated columns by the delta, re-derives disposition and increments the batch version by 1."
      - "Window overlap and reapplication-interval checks exclude the event being rescheduled from its own comparison set."

  - method: POST
    path: /application-events/{eventId}/start
    description: "Begin field application, moving SCHEDULED -> IN_PROGRESS. The logical clock must be inside the half-open window [window_start, window_end). This is the last gate at which live weather, site status, batch qualification and agreement status are re-verified."
    roles: [FacilityOperator]
    input: []
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_SCHEDULED, ERR_SITE_NOT_PERMITTED, ERR_AGREEMENT_NOT_ACTIVE, ERR_BATCH_NOT_QUALIFIED, ERR_SITE_RESTRICTED, ERR_OUTSIDE_APPLICATION_WINDOW, ERR_WEATHER_RESTRICTION]
    side_effects:
      - "Sets status IN_PROGRESS and increments the event version by 1."

  - method: POST
    path: /application-events/{eventId}/complete
    description: "Close out an IN_PROGRESS event and post its metal loading to the ledger. applied_dry_tons defaults to planned_dry_tons and must be > 0 and <= planned_dry_tons; applied_wet_tons is not an input, it is the sum of the event's haul tickets, so at least one ticket must exist. The closing ComplianceOfficer must not be the officer who certified the batch. Deferred vector options 9 and 10 are demonstrated here. This is the head of the four-hop loading cascade."
    roles: [ComplianceOfficer]
    input: ["applied_dry_tons?", "incorporation_within_hours?"]
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_IN_PROGRESS, ERR_SEGREGATION_OF_DUTIES, ERR_SITE_RESTRICTED, ERR_VECTOR_OPTION_METHOD_MISMATCH, ERR_NO_HAUL_TICKET, ERR_APPLIED_TONS_INVALID]
    side_effects:
      - "Hop 1: sets status COMPLETED, applied_dry_tons from the request (default planned_dry_tons), applied_wet_tons as the sum of this event's HaulTicket.wet_tons, completed_by_user_id, reserved_dry_tons 0, re-derives batch disposition per calculations.dry_tons_conservation and increments both the event and batch versions by 1."
      - "Hop 2: writes one APPLICATION LoadingLedgerEntry per analyte carrying a CPLR, each with kg_per_hectare_delta rounded to 4 decimal places, applied_year taken from the calendar year of window_start."
      - "Hop 3: re-sums the site's cumulative_loading_kg_per_hectare and annual_loading_kg_per_hectare from the ledger per calculations.cumulative_loading_ledger and increments the site version by 1."
      - "Hop 4: when any analyte's cumulative loading reaches 0.90 of its CPLR the site moves PERMITTED -> RESTRICTED with restriction_reason CPLR_HEADROOM_LOW, and every sibling ApplicationEvent on that site in status SCHEDULED or WEATHER_HOLD moves to DEFERRED with defer_reason SITE_RESTRICTED, incrementing each sibling version by 1."
      - "Subtracts applied_wet_tons from TreatmentFacility.storage_used_wet_tons, re-derives storage_utilization_pct and posture and increments the facility version by 1."

  - method: POST
    path: /application-events/{eventId}/cancel
    description: "Abandon an event that never reached the field, from SCHEDULED, WEATHER_HOLD or DEFERRED."
    roles: [Agronomist, ComplianceOfficer]
    input: []
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_SCHEDULED]
    side_effects:
      - "Sets status CANCELLED, releases reserved_dry_tons back to SolidsBatch.unallocated_dry_tons, re-derives batch disposition and increments both versions by 1. No ledger entry is written or reversed, because none was ever posted."

  - method: POST
    path: /application-events/{eventId}/void
    description: "Compensating reversal of a COMPLETED event, moving it to VOIDED. Refused once the reporting year containing window_start has been reported. This restores every conserved quantity to its exact pre-completion value."
    roles: [ComplianceOfficer]
    input: []
    output: ApplicationEvent
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_COMPLETED, ERR_REPORTING_PERIOD_LOCKED]
    side_effects:
      - "Writes one REVERSAL LoadingLedgerEntry per original APPLICATION entry, each with reversal_of_id set to the entry it offsets and kg_per_hectare_delta the exact negation of that entry's rounded delta."
      - "Re-sums the site's loading maps from the ledger, which returns them to their exact pre-completion values, and increments the site version by 1."
      - "When the site was RESTRICTED with reason CPLR_HEADROOM_LOW and the re-sum drops every analyte back below 0.90 of its CPLR, the site returns RESTRICTED -> PERMITTED with restriction_reason cleared. DEFERRED sibling events are not auto-rescheduled."
      - "Returns applied_dry_tons to SolidsBatch.unallocated_dry_tons, re-derives disposition, sets voided_at and increments the event and batch versions by 1."
      - "Adds applied_wet_tons back to TreatmentFacility.storage_used_wet_tons, re-derives utilization and posture and increments the facility version by 1."

  # -------------------------------------------------------------- haul logistics
  - method: POST
    path: /application-events/{eventId}/haul-tickets
    description: "Record one truck movement against an IN_PROGRESS event. Loadout bay occupancy is a closed interval [depart_at, return_at]: two tickets that merely touch at an endpoint DO occupy a bay at the same instant, and the count of overlapping tickets across the whole facility must stay below TreatmentFacility.loadout_bay_count. odometer_miles defaults to 0.0."
    roles: [FacilityOperator]
    input: ["truck_id", "wet_tons", "depart_at", "return_at", "odometer_miles?"]
    output: HaulTicket
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_EVENT_NOT_FOUND, ERR_EVENT_NOT_IN_PROGRESS, ERR_LOADOUT_BAY_CAPACITY]
    side_effects:
      - "Creates the HaulTicket. Tickets are records of movement only: they do not move tonnage, loading or storage figures."

  - method: GET
    path: /application-events/{eventId}/haul-tickets
    description: "All haul tickets for the event ordered by depart_at ASC then created_at ASC."
    roles: [FacilityOperator, ComplianceOfficer, Agronomist]
    input: ["truck_id?"]
    output: HaulTicket[]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EVENT_NOT_FOUND, ERR_INVALID_REQUEST]
    side_effects: []

