              payload: { name: "Owner Registrar", iana_id: "IANA-9038", contact_email: "abuse@ownerreg.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "owner.example", registrar_id: "${reg_id}", registrant_name_public: "Owner Target Holder", registrant_email_public: "own@proxy.example", registration_date: "2020-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Owner Ltd", country_code: "GB", email: "ip@owner.example" }
