# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3280_advertiser_account_policy_enforcement_auction_quality_scoring
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and is executable from empty-DB via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: monthly_cap_provisional_vs_final_midmonth_budget_change
        grounds:
          - calculations.monthly_spend_cap_and_credit
          - entities.Campaign.fields.monthly_cap_provisional_cents
          - entities.Campaign.fields.last_closed_month_cap_cents
          - concurrency_rules[campaign-update-stale-version]
        distinguishing_aspect: |
          Campaign-fiscal domain: the provisional (forward-looking) cap uses only
          the CURRENT daily budget (2000*304//10 = 60800) while the final
          (chronological) cap sums per-day effective budgets
          (15*1000 + 15*2000 -> floor(45000*304/300) = 45600); identical served
          history, two formulas, two different caps.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account with billing profile. Campaign C1 ACTIVE, budget 1000, flight 2026-09-01..2026-12-31, no clicks."
            - "On 2026-09-16 the budget is raised to 2000 via OCC-guarded PUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Cap Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { bp: $.data.id }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Cap Corp LLC", registration_number: "RN-1", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "C1", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp_v: $.data.version }
            - call: "PUT /campaigns/${camp}"
              payload: { daily_budget_cents: 2000, expected_campaign_version: "${camp_v}" }
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { cap_prov: $.data.monthly_cap_provisional_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /billing-profiles/${bp}/close-month"
              payload: { month: "2026-09" }
              as: BillingAdmin
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { cap_fin: $.data.last_closed_month_cap_cents, credit: $.data.last_closed_month_credit_cents }
          assert:
            - "cap_prov == 60800 (2000 * 304 // 10; provisional ignores the first 15 days at 1000)"
            - "cap_fin == 45600 (floor((15*1000 + 15*2000) * 304 / (10 * 30)))"
            - "credit == 0 (month_served 0 <= cap 45600)"
            - "cap_prov != cap_fin"

      - name: quality_snapshot_vs_live_at_auction
        grounds:
          - calculations.quality_score
          - entities.Ad.fields.quality_score_snapshot_centi
          - entities.AuctionEvent.fields.quality_score_final_centi
        distinguishing_aspect: |
          Ad/auction domain (different entity domain than the campaign-fiscal
          instance): the advertiser-visible provisional snapshot stays frozen at
          730 after scores are edited to (10,10,10), while the auction recomputes
          the live final score 1000 and ranks with it.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign (budget 1000, flight 2026 full); one GENERAL ad, scores (8,7,6), ELIGIBLE via auto-approval; keyword 'shoes' EXACT bid 200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Shoe Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Shoe Corp LLC", registration_number: "RN-2", document_type: "TAX_CERTIFICATE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CQ", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG1" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
            - call: "POST /ad-groups/${ag}/ads"
              payload: { headline: "Comfy Shoes", final_url: "https://shoe.example/lp", category: "GENERAL", quality_ectr_score: 8, quality_relevance_score: 7, quality_lp_score: 6 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad: $.data.id }
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "shoes", match_type: "EXACT", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "PUT /ads/${ad}"
              payload: { quality_ectr_score: 10, quality_relevance_score: 10, quality_lp_score: 10 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "GET /ads/${ad}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { snap: $.data.quality_score_snapshot_centi }
            - call: "POST /auctions"
              payload: { query_text: "shoes", clicked: true }
              as: PlatformAdmin
              captures: { q_fin: $.data.quality_score_final_centi, rank: $.data.winner_ad_rank, chg: $.data.charged_cents, win: $.data.winner_ad_id }
          assert:
            - "snap == 730 (50*8 + 30*7 + 20*6, frozen at approval)"
            - "q_fin == 1000 (50*10 + 30*10 + 20*10, recomputed live at auction)"
            - "rank == 200000 (bid 200 * 1000)"
            - "win == ${ad}"
            - "chg == 5 (solo winner: min(bid 200, RESERVE_CPC_CENTS 5))"
            - "snap != q_fin"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ad_rank_reserve_tiebreak_and_bid_cap
        grounds:
          - calculations.ad_rank_and_placement
          - errors[ERR_NO_ELIGIBLE_AD]
        distinguishing_aspect: |
          Mode (a): the formula has 3+ inputs (bid, quality, reserve) with
          non-linear interaction — a conditional eligibility gate at
          AD_RANK_RESERVE 20000, a nested min() capping CPC at the winner's bid
          (min(200, 201) = 200), and a created_at ASC tie-break at equal rank
          146000; the reserve-excluded ad alone yields ERR_NO_ELIGIBLE_AD.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign (budget 100000, flight 2026). Ad E (ad group G1) and ad F (G2): scores (8,7,6), keyword 'boots' EXACT bid 200 each; E created before F. Ad G (G3): scores (1,1,1), keyword 'clogs' EXACT bid 100. All GENERAL and ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Boot Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Boot Corp LLC", registration_number: "RN-3", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CB", daily_budget_cents: 100000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "G1" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { g1: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "G2" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { g2: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "G3" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { g3: $.data.id }
            - call: "POST /ad-groups/${g1}/ads"
              payload: { headline: "Boots A", final_url: "https://b.example/a", category: "GENERAL", quality_ectr_score: 8, quality_relevance_score: 7, quality_lp_score: 6 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_e: $.data.id }
            - call: "POST /ad-groups/${g2}/ads"
              payload: { headline: "Boots B", final_url: "https://b.example/b", category: "GENERAL", quality_ectr_score: 8, quality_relevance_score: 7, quality_lp_score: 6 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_f: $.data.id }
            - call: "POST /ad-groups/${g3}/ads"
              payload: { headline: "Clogs", final_url: "https://b.example/c", category: "GENERAL", quality_ectr_score: 1, quality_relevance_score: 1, quality_lp_score: 1 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_g: $.data.id }
            - call: "POST /ad-groups/${g1}/keywords"
              payload: { text: "boots", match_type: "EXACT", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ad-groups/${g2}/keywords"
              payload: { text: "boots", match_type: "EXACT", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ad-groups/${g3}/keywords"
              payload: { text: "clogs", match_type: "EXACT", max_cpc_cents: 100 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_e}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_f}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_g}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "POST /auctions"
              payload: { query_text: "boots", clicked: true }
              as: PlatformAdmin
              captures: { win: $.data.winner_ad_id, rank: $.data.winner_ad_rank, rurank: $.data.runner_up_ad_rank, chg: $.data.charged_cents }
            - call: "POST /auctions"
              payload: { query_text: "clogs", clicked: true }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "win == ${ad_e} (rank tie 146000 broken by Ad.created_at ASC; E created before F)"
            - "rank == 146000 (200 * 730) and rurank == 146000"
            - "chg == 200 (floor(146000/730)+1 = 201, capped at min(winner bid 200, 201) = 200)"
            - "err == ERR_NO_ELIGIBLE_AD (ad G rank 10000 < AD_RANK_RESERVE 20000)"

      - name: actual_cpc_floor_then_increment_vs_rounding_trap
        grounds:
          - calculations.actual_cpc
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than instance
          ad_rank_reserve_tiebreak_and_bid_cap): the pinned order floor-then-+1
          yields floor(145000/730)+1 = 199, while the wrong round-half-up-then-+1
          yields 200; and with no runner-up the winner pays min(bid, 5) = 5.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign (budget 100000, flight 2026). Ad W (G1): scores (8,7,6) q=730, keyword 'shoes' EXACT bid 200. Ad R (G2): scores (5,5,5) q=500, keyword 'shoes' EXACT bid 290. Ad S (G3): scores (8,7,6), keyword 'sandals' EXACT bid 200. All GENERAL, ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Round Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Round Corp LLC", registration_number: "RN-4", document_type: "GOVERNMENT_ID", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CR", daily_budget_cents: 100000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "G1" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { g1: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "G2" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { g2: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "G3" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { g3: $.data.id }
            - call: "POST /ad-groups/${g1}/ads"
              payload: { headline: "Shoe W", final_url: "https://r.example/w", category: "GENERAL", quality_ectr_score: 8, quality_relevance_score: 7, quality_lp_score: 6 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_w: $.data.id }
            - call: "POST /ad-groups/${g2}/ads"
              payload: { headline: "Shoe R", final_url: "https://r.example/r", category: "GENERAL", quality_ectr_score: 5, quality_relevance_score: 5, quality_lp_score: 5 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_r: $.data.id }
            - call: "POST /ad-groups/${g3}/ads"
              payload: { headline: "Solo S", final_url: "https://r.example/s", category: "GENERAL", quality_ectr_score: 8, quality_relevance_score: 7, quality_lp_score: 6 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_s: $.data.id }
            - call: "POST /ad-groups/${g1}/keywords"
              payload: { text: "shoes", match_type: "EXACT", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ad-groups/${g2}/keywords"
              payload: { text: "shoes", match_type: "EXACT", max_cpc_cents: 290 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ad-groups/${g3}/keywords"
              payload: { text: "sandals", match_type: "EXACT", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_w}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_r}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
