  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_document_safety
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair state vs business_safety: recommend attempted while the
          case is INFO_REQUESTED (wrong state) AND the required documents are
          not all VERIFIED (safety failure) — the state error wins.
        test_recipe:
          setup:
            - "Producer, client, K_STD contract; case in INFO_REQUESTED; only REPLACEMENT_DISCLOSURE VERIFIED (other two doc types SUBMITTED, unverified)"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/request_info", payload: { rationale: "need remaining docs" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "premature" }, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION, NOT ERR_REQUIRED_DOCUMENTS_INCOMPLETE"
            - "ExchangeCase.status remains INFO_REQUESTED"

      - name: producer_suspension_beats_partial_amount_bounds
        grounds:
          - validations[priority=9]
          - validations[priority=17]
        distinguishing_aspect: |
          Different category pair (business_safety vs business_fiscal): submit
          by a SUSPENDED producer on a PARTIAL case whose amount equals the
          account value fails with the safety error, not the fiscal bound error.
        test_recipe:
          setup:
            - "Producer SUSPENDED; client; K_STD contract; PARTIAL DRAFT case with exchange_amount_cents == 10000000 (== account_value_cents)"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "PARTIAL", exchange_amount_cents: 10000000, new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /producers/${p_id}/suspend", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_PRODUCER_SUSPENDED, NOT ERR_PARTIAL_AMOUNT_INVALID"
            - "ExchangeCase.status remains DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: free_look_deadline_inclusive_boundary
        grounds:
          - calculations.free_look_deadline
          - state_machines.ExchangeCase.IN_FREE_LOOK_to_RESCINDED
          - errors[ERR_FREE_LOOK_EXPIRED]
        distinguishing_aspect: |
          Metric = whole days of the free-look window, endpoint = rescind:
          date(now) == deadline is INCLUSIVE (rescission succeeds on 2026-08-22)
          while date(now) == deadline + 1 fails with ERR_FREE_LOOK_EXPIRED.
        test_recipe:
          setup:
            - "Two junior clients (separate clients so the first rescission's cooling-off cannot block the second case); two K_STD contracts; cases A and B both delivered 2026-08-02 -> deadline 2026-08-22"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
