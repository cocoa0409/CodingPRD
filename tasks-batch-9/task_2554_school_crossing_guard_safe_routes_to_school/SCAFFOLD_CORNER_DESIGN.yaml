            monotonic dispatch_attempt_count across declines and the terminal
            UNCOVERED_GAP landing when the pool is exhausted are all asserted by the §1.8
            non-linear state machine instance.

  - section: calculations
    instances:
      - name: corner_midday_sessions_excluded_from_every_warrant_term
        claim_type: input_set_filtering
        grounds:
          - calculations.warrant_score.input_set
          - entities.WarrantStudy.fields.count_sessions
        distinguishing_aspect: |
          A MIDDAY session is stored and returned but must not touch ANY term of the score.
          With AM (70/28/500) + PM (50/20/380) + MIDDAY (40/30/300) recorded, the included
          aggregates must be PC 120, AG 48, V 880 and the score 66.19. An implementation
          that sums all three sessions gets PC 160, AG 78, V 1180 and 71.23 — a
          numerically distinct, immediately falsifying value. Note the MIDDAY row makes the
          gap ratio LOOK better (78/160) while raising exposure, so a partial filter that
          drops MIDDAY from one term only cannot land on 66.19 either.
        test_recipe:
          setup:
            - "UNCONTROLLED 30 mph intersection with the standard crash pair (CP 2, CS 1 within the lookback of a 2026-09-30 window end)."
            - "One study over 2026-09-08 -> 2026-09-30 holding one AM_ARRIVAL, one PM_DISMISSAL and one MIDDAY session."
          setup_api_calls:
            - call: "POST /srts/schools"
