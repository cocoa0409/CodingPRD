  - rule_id: boundary_precision_check
    instances:
      - name: gap_of_exactly_five_miles_stays_captured_and_five_point_one_flags
        boundary_value: 5.0
        grounds:
          - calculations.mileage_gap_detection
          - state_machines.TripRecord.CAPTURED_to_GAP_FLAGGED
          - calculations.carrier_unsubstantiated_mileage_ratio
          - entities.TripRecord.fields.gap_miles_from_previous
        distinguishing_aspect: |
          A strict inequality on a one-decimal mileage scale: gap_miles_from_previous is compared
          with GAP_TOLERANCE_MILES 5.0 using > , so a gap of exactly 5.0 leaves the trip CAPTURED
          while 5.1 — the smallest representable step above it at MILE_SCALE 1 — flags the trip.
          The pair is tested on the same vehicle so the chronological predecessor logic is
          exercised at the same time, and the carrier's unsubstantiated ratio only moves on the
          5.1 trip.
        test_recipe:
          setup:
            - "Jurisdiction IL declared; carrier cA1 with one power unit."
            - "Baseline trip G1 runs 2026-04-02 from odometer 810000.0 to 810600.0 with one IL leg of 600.0 mi; it is the vehicle's first trip so gap_miles_from_previous is 0.0 and it is CAPTURED."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Tolerance Edge Trucking LLC", usdot_number: "USDOT-2637100", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { ca1_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${ca1_id}", unit_number: "U-1001", vin: "1FUJA6CK21L701001", weight_group_code: "W80", factory_price_amount: 148000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { va1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${ca1_id}", vehicle_id: "${va1_id}", trip_start_utc: "2026-04-02T06:00:00Z", trip_end_utc: "2026-04-02T18:00:00Z", start_odometer: 810000.0, end_odometer: 810600.0, legs: [{ jurisdiction_code: "IL", leg_miles: 600.0 }] }
              as: MileageAnalyst
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${ca1_id}", vehicle_id: "${va1_id}", trip_start_utc: "2026-04-09T06:00:00Z", trip_end_utc: "2026-04-09T18:00:00Z", start_odometer: 810605.0, end_odometer: 811205.0, legs: [{ jurisdiction_code: "IL", leg_miles: 600.0 }] }
              as: MileageAnalyst
              captures: { g2_id: $.data.id, g2_gap: $.data.gap_miles_from_previous, g2_status: $.data.trip_status }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${ca1_id}", vehicle_id: "${va1_id}", trip_start_utc: "2026-04-16T06:00:00Z", trip_end_utc: "2026-04-16T18:00:00Z", start_odometer: 811210.1, end_odometer: 811810.1, legs: [{ jurisdiction_code: "IL", leg_miles: 600.0 }] }
              as: MileageAnalyst
              captures: { g3_id: $.data.id, g3_gap: $.data.gap_miles_from_previous, g3_status: $.data.trip_status }
          assert:
            - "TripRecord.${g2_id}.gap_miles_from_previous == 5.0 and trip_status == CAPTURED (the comparison is strictly greater-than, so exactly the tolerance is not a gap)"
            - "TripRecord.${g3_id}.gap_miles_from_previous == 5.1 and trip_status == GAP_FLAGGED"
            - "TripRecord.${g2_id} and TripRecord.${g3_id} both have odometer_delta_miles == 600.0, so the two outcomes differ only by the 0.1 mi step in the gap"
            - "after the 5.0 trip, Carrier.${ca1_id}.unsubstantiated_mileage_ratio == 0.0000 and audit_flag == false"
            - "after the 5.1 trip, Carrier.${ca1_id}.unsubstantiated_mileage_ratio == 0.3333 (600.0 / 1800.0) and audit_flag == true"
            - "the CAPTURED trip ${g2_id} can still be moved to ACCEPTED by a review, while ${g3_id} rejects the same ACCEPT because its precondition requires gap_miles_from_previous <= 5.0"
            - "GET /apportionment/trip-records?vehicle_id=${va1_id}&trip_status=GAP_FLAGGED returns exactly one row, ${g3_id}"

      - name: reconstructed_mileage_ratio_exactly_ten_percent_attracts_no_penalty
        boundary_value: 0.1000
        grounds:
          - calculations.reconstructed_mileage_penalty
          - calculations.quarterly_fuel_tax_settlement
          - entities.FuelTaxReturn.fields.reconstruction_penalty_amount
        distinguishing_aspect: |
          A different boundary on a different scale — a 4-decimal ratio compared with
          RECONSTRUCTED_MILEAGE_PENALTY_RATIO 0.1000 rather than a 1-decimal mileage tolerance —
          and the quantity being tested is money, not a state. 200.0 reconstructed miles out of
          2000.0 total is exactly 0.1000, which is not greater than the threshold, so
          reconstruction_penalty_amount is 0.00 and total_amount_due equals total_net_tax_due
          27.81. The PENALTY_FLOOR_USD 100.00 makes the boundary expensive to miss: one step
          over the line adds a flat 100.00 rather than a proportional amount.
        test_recipe:
          setup:
            - "Jurisdictions IL, IN, KY declared; carrier cA2 with one power unit."
            - "Trip D1 runs 2026-04-05 from odometer 200000.0 to 201800.0 with legs IL 900.0 / IN 500.0 / KY 400.0 and is ACCEPTED as telematics mileage."
            - "Trip D2 runs 2026-05-20 from odometer 201860.0 to 202000.0, so its delta is 140.0 and its gap is 60.0; analyst-1 reconstructs it as IL 120.0 / KY 80.0 (200.0 == 140.0 + 60.0) and officer-1 accepts it."
            - "Q2-2026 tax-paid fuel: IL 150.000, IN 70.000, KY 30.000 gallons (250.000 total)."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IN", name: "Indiana", fuel_tax_rate_per_gallon: 0.3300, surcharge_rate_per_gallon: 0.5500, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Ten Percent Haulage Inc", usdot_number: "USDOT-2637110", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { ca2_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${ca2_id}", unit_number: "U-1101", vin: "1FUJA6CK21L701101", weight_group_code: "W80", factory_price_amount: 147000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { va2_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${ca2_id}", vehicle_id: "${va2_id}", trip_start_utc: "2026-04-05T05:00:00Z", trip_end_utc: "2026-04-06T05:00:00Z", start_odometer: 200000.0, end_odometer: 201800.0, legs: [{ jurisdiction_code: "IL", leg_miles: 900.0 }, { jurisdiction_code: "IN", leg_miles: 500.0 }, { jurisdiction_code: "KY", leg_miles: 400.0 }] }
              as: MileageAnalyst
              captures: { d1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${d1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${ca2_id}", vehicle_id: "${va2_id}", trip_start_utc: "2026-05-20T06:00:00Z", trip_end_utc: "2026-05-20T12:00:00Z", start_odometer: 201860.0, end_odometer: 202000.0, legs: [{ jurisdiction_code: "IL", leg_miles: 90.0 }, { jurisdiction_code: "KY", leg_miles: 50.0 }] }
              as: MileageAnalyst
              captures: { d2_id: $.data.id }
            - call: "POST /apportionment/trip-records/${d2_id}/reconstruct"
              payload: { reconstructed_legs: [{ jurisdiction_code: "IL", leg_miles: 120.0 }, { jurisdiction_code: "KY", leg_miles: 80.0 }], supporting_document_reference: "RECON-D2" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/trip-records/${d2_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${ca2_id}", vehicle_id: "${va2_id}", jurisdiction_code: "IL", purchase_date: "2026-04-06", gallons: 150.000, tax_paid_flag: true, receipt_reference: "RCPT-IL-A2-0406" }
              as: MileageAnalyst
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${ca2_id}", vehicle_id: "${va2_id}", jurisdiction_code: "IN", purchase_date: "2026-04-07", gallons: 70.000, tax_paid_flag: true, receipt_reference: "RCPT-IN-A2-0407" }
              as: MileageAnalyst
            - call: "POST /apportionment/fuel-purchases"
