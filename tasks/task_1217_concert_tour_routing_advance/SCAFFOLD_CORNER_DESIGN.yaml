              as: Promoter
              captures: { ha: $.data.id }
            - call: "POST /tours/${tid}/shows/${sa}/holds/${ha}/accept"
              payload: {}
              as: Promoter
            # Show B
            - call: "POST /tours/${tid}/shows"
              payload: { market_id: "${mid}", venue_id: "${vid}", show_date: "2026-08-02", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { sb: $.data.id }
            - call: "POST /tours/${tid}/shows/${sb}/holds"
              payload: { promoter_name: "P", guarantee_cents: 100000, versus_pct: 70 }
              as: Promoter
              captures: { hb: $.data.id }
            - call: "POST /tours/${tid}/shows/${sb}/holds/${hb}/accept"
              payload: {}
              as: Promoter
            # Read tour version (call it V_obs)
            - call: "GET /tours/${tid}"
              payload: {}
              as: TourManager
              captures: { v_obs: $.data.version }
            # Confirm A — bumps tour version to V_obs+1
            - call: "POST /tours/${tid}/shows/${sa}/confirm"
              payload: { expected_tour_version: "${v_obs}" }
              as: TourManager
          trigger:
            # Confirm B with stale ${v_obs} → 412
            - call: "POST /tours/${tid}/shows/${sb}/confirm"
              payload: { expected_tour_version: "${v_obs}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
