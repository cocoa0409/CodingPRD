      - name: route_is_conditional_on_window_status_and_cannot_repeat
        claim_type: conditional_action
        grounds:
          - endpoints.POST /orders/{id}/route
          - state_machines.Order.fulfillment_status.PLACED_to_ROUTED
          - validations[priority=11].ERR_INVALID_ORDER_TRANSITION
        distinguishing_aspect: >
          Routing is legal only from PLACED and only while the owning window is OPEN or CUTOFF_PASSED,
          which makes the window's own move into IN_PRODUCTION a one-way door: the unrouted order is
          swept to CANCELLED by that very transition, so the window state precondition and the order
          state precondition fail together and the endpoint can never succeed afterwards.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /delivery-zones: cook ${cook_id} ACTIVE in CA, APPROVED MenuItem ${mi_id} at 400 cents, window ${w_id} (cutoff 2026-08-05T00:00:00Z, handoff 2026-08-08T16:00:00Z..18:00:00Z, capacity_meals 20), DOOR_DELIVERY zone ${dz_id}, StatePolicy ${sp_id}. Clock 2026-08-01T00:00:00Z."
