              captures: { lb_pb_id: $.data.id, lb_pb_v1: $.data.version }
            - call: "POST /innovation-projects/${lb_pa_id}/formulations"
              payload: { expected_project_version: "${lb_pa_v1}", spec_summary: "Chili lime seasoning at 6 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 2.4000 }
              as: RnDLead
              captures: { lb_fa_id: $.data.id }
            - call: "POST /innovation-projects/${lb_pb_id}/formulations"
              payload: { expected_project_version: "${lb_pb_v1}", spec_summary: "Honey butter seasoning at 5 percent", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 2.4000 }
              as: RnDLead
              captures: { lb_fb_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${lb_pa_id}/label-approvals"
              payload: { formulation_id: "${lb_fb_id}", label_version: "v1", claims: ["Bold chili lime"] }
              as: InnovationLead
            - call: "POST /formulations/${lb_fa_id}/pilot-runs"
              payload: { pilot_line_id: "${lb_line_id}", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T16:00:00Z", planned_units: 8000, committed_cost_usd: 9000.00 }
              as: RnDLead
              captures: { lb_run_id: $.data.id }
            - call: "POST /pilot-runs/${lb_run_id}/start"
              as: RnDLead
            - call: "POST /pilot-runs/${lb_run_id}/complete"
              payload: { actual_units: 8000 }
              as: RnDLead
            - call: "GET /formulations/${lb_fa_id}"
              as: RnDLead
              captures: { lb_fa_v: $.data.version }
            - call: "POST /formulations/${lb_fa_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${lb_fa_v}", duration_days: 180, committed_cost_usd: 15000.00, start_at: "2026-08-05T00:00:00Z" }
              as: RnDLead
              captures: { lb_sls_id: $.data.id }
            - call: "POST /shelf-life-studies/${lb_sls_id}/timepoints"
              payload: { day_index: 180, quality_score: 86.00 }
              as: RnDLead
            - call: "POST /innovation-projects/${lb_pa_id}/label-approvals"
              payload: { formulation_id: "${lb_fa_id}", label_version: "v1", claims: ["Bold chili lime", "Clinically proven to sharpen focus"] }
              as: InnovationLead
              captures: { lb_lab_id: $.data.id }
            - call: "POST /label-approvals/${lb_lab_id}/submit"
              as: InnovationLead
            - call: "POST /label-approvals/${lb_lab_id}/decide"
              payload: { decision: "APPROVE_WITH_CHANGES", comment: "One claim lacks substantiation." }
              as: RegulatoryApprover
              as_user_id: "reg-lb"
            - call: "POST /label-approvals/${lb_lab_id}/decide"
              payload: { decision: "APPROVE_WITH_CHANGES", unsupported_claims: ["Clinically proven to sharpen focus"], comment: "Drop the focus claim before print." }
              as: RegulatoryApprover
              as_user_id: "reg-lb"
          assert:
            - "the first label create answers 409 ERR_FORMULATION_PROJECT_MISMATCH and GET /label-approvals?project_id=${lb_pa_id} returns total_count == 0 at that point"
            - "Formulation.${lb_fa_id}.status == SHELF_LIFE_CLEARED after the day 180 reading at 86.00"
            - "the decide without unsupported_claims answers 422 ERR_UNSUPPORTED_CLAIMS_REQUIRED and LabelApproval.${lb_lab_id}.status is still IN_REVIEW"
            - "the decide carrying one unsupported claim answers 200 with status CONDITIONAL and unsupported_claims of length 1"
            - "no Deliverable row exists on project ${lb_pa_id}, so the REGULATORY_CLEARANCE auto-approval side effect is a silent no-op rather than an error"
            - "Formulation.${lb_fb_id}.status is still DRAFT, untouched by anything that happened on the other project"

      - name: err_reset_window_capacity_refusal
        claim_type: guard_ladder
        grounds:
          - errors[ERR_RESET_WINDOW_CAPACITY_FULL]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / shelf_reset_window_aggregate_slot_capacity"
          rationale: |
            The §1.8 instance already drives a window to its max_presentations, takes the refusal on
            the next presentation and then shows the counter freeing after a withdrawal, which is a
            strict superset of a plain capacity refusal.

      - name: err_pilot_line_conflict_refusal
        claim_type: guard_ladder
        grounds:
          - errors[ERR_PILOT_LINE_CONFLICT]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / pilot_line_buffer_extended_half_open_overlap"
          rationale: |
            The §1.8 instance walks the buffer extended half open interval on both sides of the
            boundary, so a corner instance asserting only the refusal would be a weaker copy.

      - name: err_dev_budget_exceeded_refusal
        claim_type: guard_ladder
        grounds:
          - errors[ERR_DEV_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: "compensating_invariant / dev_budget_ledger_restored_after_pilot_run_cancel"
          rationale: |
            The §1.8 instance exhausts the development budget cap, takes the 422, cancels the
            offending run and shows the same commitment succeeding afterwards, which subsumes the
            single refusal a corner instance would assert.

      - name: err_formulation_version_conflict_refusal
        claim_type: guard_precedence
        grounds:
          - errors[ERR_FORMULATION_VERSION_CONFLICT]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / occ_check_precedes_dev_budget_on_stale_formulation"
          rationale: |
            The §1.8 instance already shows the 412 winning over the budget 422 on a stale
            expected_formulation_version, so the bare version conflict needs no separate corner.

      - name: err_formulation_invalid_state_refusal
        claim_type: guard_precedence
        grounds:
          - errors[ERR_FORMULATION_INVALID_STATE]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_check_precedes_occ_on_superseded_formulation"
          rationale: |
            The §1.8 instance covers the SUPERSEDED branch ahead of the version check, and
            cross_entity_state_dependency / label_submit_depends_on_formulation_shelf_life_state
            covers the not yet SHELF_LIFE_CLEARED branch on label submit.

  - section: rbac
    instances:
      - name: rbac_every_exclusive_write_refuses_the_wrong_role_returns_403
        claim_type: rbac_matrix
        grounds:
          - rbac[PortfolioAdmin]
          - rbac[InnovationLead]
          - rbac[GateChair]
          - rbac[FunctionalReviewer]
          - rbac[RegulatoryApprover]
          - rbac[RnDLead]
          - rbac[SalesAccountManager]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Each of the fifteen role exclusive writes answers 403 ERR_UNAUTHORIZED when a plausible
          neighbouring role attempts it, and the refusal happens before any body or state check, so
          a well formed request from the wrong role and a malformed request from the wrong role both
          come back as the same 403 with nothing written.
        test_recipe:
