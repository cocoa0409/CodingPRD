    description: "Resets the committed on-air target date."
    roles: [ProgramDirector]
    code: 200
    input: [new_target_on_air_date, reason]
    output: OnAirPlan
    side_effects: ["target_on_air_date = new_target_on_air_date", "reset_count += 1", "recomputes the forecast fields (calculations.on_air_schedule_forecast)", "status = RESET", "increments OnAirPlan.version by 1"]
  - method: POST
    path: "/on-air-plans/{id}/activate"
    description: "Records the site as on air, closing out the ring."
    roles: [ConstructionManager]
    code: 200
    input: [actual_on_air_date]
    output: OnAirPlan
    side_effects: ["actual_on_air_date stored", "variance_days computed (calculations.on_air_schedule_forecast)", "status = ON_AIR", "SearchRing.status = ON_AIR", "increments OnAirPlan.version by 1"]
  - method: GET
    path: "/on-air-plans/{id}/forecast"
    description: "Computed read: both forecast variants, the risk score and its drivers at the current logical clock."
    roles: [ProgramDirector, ConstructionManager]
    code: 200
    input: []
    output: { baseline_forecast_date: string, risk_adjusted_forecast_date: string, remaining_days: integer, risk_days: integer, schedule_risk_score: number, risk_band: string, slip_days: integer, driver_candidate_id: string }
    side_effects: []

errors:
  # --- authentication / authorization ----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting X-User-Role is not listed in the endpoint's roles"
  - id: ERR_NOT_CANDIDATE_OWNER
    http: 403
    condition: "a SiteAcquisitionAgent acts on a candidate whose owning_agent_user_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user would occupy two mutually exclusive roles on the same artifact: executing a lease they negotiated (X-User-ID == LeaseAgreement.negotiating_agent_user_id), or certifying a modification design they authored or whose underlying analysis they performed"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, has the wrong type, or carries a value outside its declared enum/numeric domain"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is not in 1..100 or offset is negative on a list endpoint"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "a half-open date window is empty or inverted (window_end <= window_start)"

  # --- referential integrity -------------------------------------------------
  - id: ERR_SEARCH_RING_NOT_FOUND
    http: 404
    condition: "the referenced search ring id does not exist"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "the referenced candidate id does not exist"
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "the referenced landlord id does not exist"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "the referenced jurisdiction id does not exist"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "the referenced lease id does not exist"
  - id: ERR_ZONING_APPLICATION_NOT_FOUND
    http: 404
    condition: "the referenced zoning application id does not exist"
  - id: ERR_STRUCTURAL_ANALYSIS_NOT_FOUND
    http: 404
    condition: "the referenced structural analysis id does not exist"
  - id: ERR_MODIFICATION_DESIGN_NOT_FOUND
    http: 404
    condition: "the referenced modification design id does not exist"
  - id: ERR_ENVIRONMENTAL_REVIEW_NOT_FOUND
    http: 404
    condition: "the referenced environmental review id does not exist"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "the referenced construction permit id does not exist"
  - id: ERR_UTILITY_PROVIDER_NOT_FOUND
    http: 404
    condition: "the referenced utility provider id does not exist"
  - id: ERR_BACKHAUL_ORDER_NOT_FOUND
    http: 404
    condition: "the referenced backhaul order id does not exist"
  - id: ERR_ON_AIR_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced on-air plan id does not exist"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_CANDIDATE_VERSION
    http: 412
    condition: "expected_candidate_version does not equal the candidate's current version on POST /structural-analyses"
  - id: ERR_STALE_RING_VERSION
    http: 412
    condition: "expected_search_ring_version does not equal the ring's current version on POST /search-rings/{id}/select-site"

  # --- state machine gates ---------------------------------------------------
  - id: ERR_RING_NOT_OPEN
    http: 409
    condition: "the ring must be OPEN for the requested operation (candidate creation, RF qualification, site selection) but is in another state"
  - id: ERR_INVALID_RING_STATE
    http: 409
    condition: "the search ring's status does not admit the requested transition"
  - id: ERR_INVALID_CANDIDATE_STATE
    http: 409
    condition: "the candidate's acquisition_status or feasibility_status does not admit the requested transition"
  - id: ERR_INVALID_LEASE_STATE
    http: 409
    condition: "the lease's status does not admit the requested negotiation, execution or termination action"
  - id: ERR_INVALID_ZONING_STATE
    http: 409
    condition: "the zoning application's status does not admit the requested simulation, submission, completeness, hearing or decision action"
  - id: ERR_ANALYSIS_SUPERSEDED
    http: 409
    condition: "the targeted structural analysis has been superseded by a newer analysis on the same candidate"
  - id: ERR_INVALID_ANALYSIS_STATE
    http: 409
    condition: "the structural analysis's status does not admit the requested action (e.g. completing an already COMPLETED analysis, or designing a modification against a non-COMPLETED or non-PASS_WITH_MOD analysis)"
  - id: ERR_INVALID_DESIGN_STATE
    http: 409
    condition: "the modification design's status does not admit the requested peer-review action"
  - id: ERR_INVALID_REVIEW_STATE
    http: 409
    condition: "the environmental review's status does not admit screening or the requested branch completion (including completing a branch that is NOT_APPLICABLE or already COMPLETE)"
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "the construction permit's status does not admit issuance or revocation"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the backhaul order's status does not admit the requested schedule, cancel or deliver action"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "the on-air plan's status does not admit reforecasting, reset or activation"

  # --- cross-entity business gates -------------------------------------------
  - id: ERR_MARKET_MISMATCH
    http: 409
    condition: "the landlord's or jurisdiction's market_code differs from the search ring's market_code"
  - id: ERR_LANDLORD_MISMATCH
    http: 409
    condition: "the lease's landlord_id differs from the landlord_id of the lease's candidate"
  - id: ERR_LANDLORD_OPTED_OUT
    http: 409
    condition: "an outreach event is recorded against a landlord whose outreach_optout is true"
  - id: ERR_LANDLORD_NOT_IN_GOOD_STANDING
    http: 409
    condition: "a lease is drafted or executed for a landlord whose standing is not ACTIVE"
  - id: ERR_ENVIRONMENTAL_NOT_CLEARED
    http: 409
    condition: "the candidate has no environmental review in CLEARED status (or environmental_cleared is false) where clearance is a prerequisite"
  - id: ERR_TRIBAL_RESPONSE_WINDOW_OPEN
    http: 409
    condition: "the tribal branch is completed before tribal_response_deadline_date has passed on the logical clock"
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "the candidate has no construction permit in ISSUED status where an issued permit is a prerequisite"
  - id: ERR_PERMIT_EXPIRED
    http: 409
    condition: "the candidate's only issued permit has passed its expiry_date on the logical clock"
  - id: ERR_ZONING_NOT_APPROVED
    http: 409
    condition: "the candidate has no zoning application in APPROVED or DEEMED_GRANTED status where entitlement is a prerequisite"
  - id: ERR_LEASE_NOT_EXECUTED
    http: 409
    condition: "the candidate has no lease in EXECUTED status where an executed lease is a prerequisite"
  - id: ERR_CANDIDATE_NOT_BUILD_READY
    http: 409
    condition: "the candidate's feasibility_status is not BUILD_READY where build readiness is a prerequisite"
  - id: ERR_BACKHAUL_NOT_DELIVERED
    http: 409
    condition: "the driver candidate lacks a DELIVERED backhaul order of each required type (POWER and FIBER) at on-air activation"

  # --- documentary and cadence constraints -----------------------------------
  - id: ERR_VISUAL_SIMULATION_REQUIRED
    http: 422
    condition: "the jurisdiction requires visual simulations and the application carries fewer than min_visual_simulations at submission"
  - id: ERR_CONTINUANCE_LIMIT_REACHED
    http: 409
    condition: "a further hearing continuance would exceed the jurisdiction's max_continuances"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 409
    condition: "a further negotiation round would exceed MAX_NEGOTIATION_ROUNDS (6)"
  - id: ERR_DUPLICATE_ZONING_APPLICATION
    http: 409
    condition: "the candidate already has a zoning application in a non-terminal status"
  - id: ERR_DUPLICATE_ENVIRONMENTAL_REVIEW
    http: 409
    condition: "the candidate already has an environmental review in a non-terminal status"
  - id: ERR_NO_ELIGIBLE_CANDIDATE
    http: 409
    condition: "the selector's eligible candidate pool for the ring is empty"

  # --- temporal / capacity constraints ---------------------------------------
  - id: ERR_HEARING_WINDOW_CONFLICT
    http: 409
    condition: "the requested hearing date falls within the jurisdiction's hearing_cadence_days of an existing hearing date in that jurisdiction"
  - id: ERR_PROVIDER_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested crew window overlaps existing REQUESTED or SCHEDULED windows such that the provider's concurrent_crew_capacity would be exceeded on some day"
  - id: ERR_SHOT_CLOCK_NOT_EXPIRED
    http: 409
    condition: "deemed-granted is requested before the tolling-adjusted shot_clock_deadline_date has passed on the logical clock"
  - id: ERR_HEARING_DATE_IN_PAST
    http: 422
    condition: "the requested hearing_date is before the logical clock date"
  - id: ERR_HEARING_NOT_YET_HELD
    http: 409
    condition: "a decision is recorded for a jurisdiction requiring a hearing before any hearing has been held"
  - id: ERR_DATE_IN_FUTURE
    http: 422
    condition: "a supplied as-of date (execution_date, issued_date, delivered_date, actual_on_air_date) is after the logical clock date"
  - id: ERR_DECISION_DATE_INVALID
    http: 422
    condition: "decision_date precedes the application's submitted_date or its latest held hearing_date"
  - id: ERR_TARGET_DATE_IN_PAST
    http: 422
    condition: "target_on_air_date or new_target_on_air_date is not after the logical clock date"

  # --- fiscal boundary constraints -------------------------------------------
  - id: ERR_CAPEX_BUDGET_EXCEEDED
    http: 409
    condition: "certifying the modification design would push the ring's committed_capex_usd strictly above capex_budget_usd"
  - id: ERR_RENT_VARIANCE_EXCEEDED
    http: 409
    condition: "the counter rent's variance from the ring's market_benchmark_monthly_rent_usd is strictly greater than MAX_RENT_VARIANCE_PCT (15.00)"

roles:
  - name: RfEngineer
    description: "Defines search rings from RF design objectives and scores candidates against coverage and capacity targets."
    identity: "opaque"
    exclusive_operations:
      - "POST /search-rings"
      - "POST /search-rings/{id}/open"
      - "POST /candidates/{id}/rf-qualify"
    shared_operations:
      - "all GET endpoints"
  - name: SiteAcquisitionAgent
    description: "Identifies candidate sites, runs landlord outreach, and negotiates lease terms. May only act on candidates they own."
    identity: "opaque"
    exclusive_operations:
      - "POST /landlords"
      - "POST /candidates"
      - "PATCH /candidates/{id}"
      - "POST /candidates/{id}/outreach-events"
      - "POST /leases"
      - "POST /leases/{id}/rounds"
    shared_operations:
      - "all GET endpoints"
      - "GET /leases/{id}/rent-schedule"
  - name: ZoningPlanner
    description: "Registers jurisdictions and drives entitlement: applications, visual simulations, completeness, hearings and decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /zoning-applications"
      - "POST /zoning-applications/{id}/visual-simulations"
      - "POST /zoning-applications/{id}/submit"
      - "POST /zoning-applications/{id}/completeness"
      - "POST /zoning-applications/{id}/hearings"
      - "POST /zoning-applications/{id}/decide"
    shared_operations:
      - "all GET endpoints"
      - "GET /zoning-applications/{id}/shot-clock"
  - name: StructuralEngineer
    description: "Performs TIA-222 loading analyses and authors or peer-reviews modification designs. A design may not be certified by its author or by the engineer who performed the underlying analysis."
    identity: "opaque"
    exclusive_operations:
      - "POST /structural-analyses"
      - "POST /structural-analyses/{id}/complete"
      - "POST /modification-designs"
      - "POST /modification-designs/{id}/peer-review"
    shared_operations:
      - "all GET endpoints"
  - name: EnvironmentalReviewer
    description: "Runs NEPA / Section 106 screening, the public-notice branch, and tribal consultation."
    identity: "opaque"
    exclusive_operations:
      - "POST /environmental-reviews"
      - "POST /environmental-reviews/{id}/screen"
      - "POST /environmental-reviews/{id}/branch-complete"
    shared_operations:
      - "all GET endpoints"
  - name: ConstructionManager
    description: "Files and manages construction permits, coordinates utility and fiber backhaul crews, marks candidates build-ready, and records on-air activation."
    identity: "opaque"
    exclusive_operations:
      - "POST /candidates/{id}/mark-build-ready"
      - "POST /construction-permits"
      - "POST /construction-permits/{id}/issue"
      - "POST /construction-permits/{id}/revoke"
      - "POST /utility-providers"
      - "POST /backhaul-orders"
      - "POST /backhaul-orders/{id}/status-actions"
      - "POST /on-air-plans/{id}/activate"
    shared_operations:
      - "all GET endpoints"
      - "GET /on-air-plans/{id}/forecast"
  - name: ProgramDirector
    description: "Program authority: sets the logical clock, executes leases negotiated by others, manages landlord standing, selects sites under OCC, declares deemed-granted entitlements, and owns on-air planning."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /search-rings/{id}/select-site"
      - "POST /search-rings/{id}/reopen"
      - "POST /landlords/{id}/standing"
      - "POST /leases/{id}/execute"
      - "POST /leases/{id}/terminate"
      - "POST /zoning-applications/{id}/deem-granted"
      - "POST /on-air-plans"
      - "POST /on-air-plans/{id}/reforecast"
      - "POST /on-air-plans/{id}/reset"
    shared_operations:
      - "all GET endpoints"
      - "GET /leases/{id}/rent-schedule"
      - "GET /zoning-applications/{id}/shot-clock"
      - "GET /on-air-plans/{id}/forecast"
