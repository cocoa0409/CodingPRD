  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_window_symmetric_forty_five_minute_buffer_boundary
        grounds:
          - validations[priority=24]
          - entities.DeliveryLoad.fields.window_start
          - entities.DeliveryLoad.fields.window_end
        distinguishing_aspect: |
          The truck-window rule is half-open AND carries a symmetric 45-minute turnaround buffer,
          so the boundary is probed one minute apart on the trailing side (10:44 rejected, 10:45
          accepted) and then again on the LEADING side, where a window ending at exactly 08:00
          minus the buffer is accepted against a load starting at 08:00. Only an implementation
          that adds the buffer on both sides of the comparison passes all three calls.
        test_recipe:
          setup:
            - "CONFIRMED DELIVERY order (CLASS_A, 0.0 miles) with one BULK line of 30.00 cubic yards at 2000 cents; lot of 100.00 gross cubic yards at 15% moisture."
            - "One TRI_AXLE truck (max_payload_lb 20000, bed 15.0) with load 1 planned at 10.00 cubic yards in the window 2026-08-02T08:00Z - 2026-08-02T10:00Z."
