# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3308
# Multi-Brand Home Services Franchise Umbrella & Territory Administration
#
# 9 rules x 2 instances = 18 instances. Every `grounds:` entry resolves to a
# declared element of SCAFFOLD.yaml §1.1-§1.6. Every `setup_api_calls:` chain
# is an ordered sequence of §1.5 endpoint calls that drives empty-DB into the
# described `setup:` state.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: referral_fee_brand_pair_variant_divergence
        grounds:
          - calculations.referral_fee_calculation
          - state_machines.Referral.COMPLETED_to_SETTLED
          - entities.Referral.fields.fee_variant
          - entities.Brand.fields.cross_brand_fee_table
        distinguishing_aspect: "On the Referral domain the receiving brand's cross_brand_fee_table entry for the originating brand_code REPLACES referral_fee_rate entirely, so the referral settles at the brand-pair tier rate and fee_variant flips from FLAT_RATE to TIERED_BRAND_PAIR."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Brand MS (PLUMBING) with an empty cross_brand_fee_table; brand IL (ELECTRICAL) with cross_brand_fee_table {\"MS\": {\"rate\": 0.15}}."
            - "Franchisee Mosaic Central LLC holds agreement A1 for brand MS; franchisee Illume Metro Corp holds agreement A2 for brand IL. Both territories AWARDED and both agreements ACTIVE."
            - "Referral R1 originates at A1, is received by A2, carries referral_fee_rate 0.10, and has been accepted and completed with settled_job_value_cents 120000."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchiseAdmin
            - &c_ms_brand
              call: "POST /franchise/brands"
              payload: { brand_code: "MS", display_name: "Mosaic Plumbing", trade: "PLUMBING", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "APPRENTICE", audit_cycle_months: 12, cross_brand_fee_table: {} }
              as: FranchiseAdmin
              captures: { ms_brand_id: $.data.id }
            - &c_il_brand
              call: "POST /franchise/brands"
              payload: { brand_code: "IL", display_name: "Illume Electric", trade: "ELECTRICAL", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "JOURNEYMAN", audit_cycle_months: 12, cross_brand_fee_table: { "MS": { "rate": 0.15 } } }
              as: FranchiseAdmin
              captures: { il_brand_id: $.data.id }
            - &c_fr_ms
              call: "POST /franchise/franchisees"
              payload: { legal_name: "Mosaic Central LLC", principal_name: "Dana Vaughn", entity_type: "LLC", shared_services_enrolled: true }
              as: FranchiseAdmin
              captures: { fr_ms_id: $.data.id }
            - &c_fr_il
              call: "POST /franchise/franchisees"
              payload: { legal_name: "Illume Metro Corp", principal_name: "Ruben Salas", entity_type: "CORPORATION", shared_services_enrolled: true }
              as: FranchiseAdmin
              captures: { fr_il_id: $.data.id }
            - &c_ter_ms
              call: "POST /franchise/territories"
              payload: { territory_code: "MS-01", brand_id: "${ms_brand_id}", household_count: 30000, postal_codes: ["75001", "75002"], expansion_right_households: 40000, protected: true, franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
              captures: { ter_ms_id: $.data.id }
            - &c_ter_il
              call: "POST /franchise/territories"
              payload: { territory_code: "IL-01", brand_id: "${il_brand_id}", household_count: 30000, postal_codes: ["77001", "77002"], expansion_right_households: 40000, protected: true, franchisee_id: "${fr_il_id}" }
              as: FranchiseAdmin
              captures: { ter_il_id: $.data.id }
            - &c_agt_a1
              call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_ms_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_ms_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "JOURNEYMAN" }
              as: FranchiseAdmin
              captures: { agt_a1_id: $.data.id }
            - &c_agt_a2
              call: "POST /franchise/agreements"
              payload: { agreement_number: "A-IL-01", franchisee_id: "${fr_il_id}", brand_id: "${il_brand_id}", territory_id: "${ter_il_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "MASTER" }
              as: FranchiseAdmin
              captures: { agt_a2_id: $.data.id }
            - &c_off_ms
              call: "POST /franchise/territories/${ter_ms_id}/offer"
              payload: { franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
              captures: { ter_ms_v: $.data.version }
            - &c_awd_ms
              call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_ms_v}" }
              as: FranchiseAdmin
            - &c_off_il
              call: "POST /franchise/territories/${ter_il_id}/offer"
              payload: { franchisee_id: "${fr_il_id}" }
              as: FranchiseAdmin
              captures: { ter_il_v: $.data.version }
            - &c_awd_il
              call: "POST /franchise/territories/${ter_il_id}/award"
              payload: { expected_territory_version: "${ter_il_v}" }
              as: FranchiseAdmin
            - &c_off_a1
              call: "POST /franchise/agreements/${agt_a1_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - &c_off_a2
              call: "POST /franchise/agreements/${agt_a2_id}/offer"
              payload: {}
              as: FranchiseAdmin
            - &c_act_a1
              call: "POST /franchise/agreements/${agt_a1_id}/activate"
              payload: {}
              as: FranchiseAdmin
              captures: { agt_a1_v: $.data.version, agt_a1_fr: $.data.franchisee_id }
            - &c_act_a2
              call: "POST /franchise/agreements/${agt_a2_id}/activate"
              payload: {}
              as: FranchiseAdmin
              captures: { agt_a2_v: $.data.version }
            - call: "POST /franchise/referrals"
              payload: { referral_code: "R1", originating_agreement_id: "${agt_a1_id}", receiving_agreement_id: "${agt_a2_id}", customer_household_ref: "HH-9001", job_description: "Panel upgrade surfaced during a drain cleaning visit", estimated_job_value_cents: 120000, referral_fee_rate: 0.10 }
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
              captures: { ref_r1_id: $.data.id }
            - call: "POST /franchise/referrals/${ref_r1_id}/accept"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
            - call: "POST /franchise/referrals/${ref_r1_id}/complete"
              payload: { settled_job_value_cents: 120000 }
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
          trigger:
            - call: "POST /franchise/referrals/${ref_r1_id}/settle"
              payload: { expected_agreement_version: "${agt_a1_v}" }
              as: FranchiseAdmin
              captures: { settled_fee_cents: $.data.referral_fee_cents, settled_variant: $.data.fee_variant }
          assert:
            - "the response status is 200 and Referral.${ref_r1_id}.status == SETTLED"
            - "Referral.${ref_r1_id}.fee_variant == TIERED_BRAND_PAIR"
            - "Referral.${ref_r1_id}.referral_fee_cents == 18000"
            - "Referral.${ref_r1_id}.referral_fee_cents != 12000, so the flat contract rate was NOT used"
            - "Agreement.${agt_a1_id}.cumulative_referral_net_cents == 18000"
            - "Agreement.${agt_a2_id}.cumulative_referral_net_cents == -18000"

      - name: royalty_accrual_provisional_vs_final_divergence
        grounds:
          - calculations.royalty_accrual_calculation
          - calculations.referral_offset_calculation
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - endpoints.GET_/franchise/royalty-statements/{id}/preview
        distinguishing_aspect: "On the RoyaltyStatement domain the DRAFT_PROPORTIONAL preview and the FINAL_NETTED issue produce different net_remittance_cents for identical gross revenue, because the settled-referral offset enters only at issue."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS carries royalty_rate_override 0.06; brand MS national_ad_fund_rate is 0.01."
            - "Referral R1 originates at A1 and is received by A2; it is SETTLED at clock 2026-09-01T00:00:00Z with referral_fee_cents 18000 inside the statement window."
            - "RoyaltyStatement ST1 for A1 covers [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) with gross_revenue_cents 1000000 and is still DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_il_brand
            - *c_fr_ms
            - *c_fr_il
            - *c_ter_ms
            - *c_ter_il
            - &c_agt_a1_ov
              call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_ms_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_ms_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "JOURNEYMAN", royalty_rate_override: 0.06 }
              as: FranchiseAdmin
              captures: { agt_a1_id: $.data.id }
            - *c_agt_a2
            - *c_off_ms
            - *c_awd_ms
            - *c_off_il
            - *c_awd_il
            - *c_off_a1
            - *c_off_a2
            - *c_act_a1
            - *c_act_a2
            - call: "POST /franchise/referrals"
              payload: { referral_code: "R1", originating_agreement_id: "${agt_a1_id}", receiving_agreement_id: "${agt_a2_id}", customer_household_ref: "HH-9001", job_description: "Panel upgrade surfaced during a drain cleaning visit", estimated_job_value_cents: 120000, referral_fee_rate: 0.10 }
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
              captures: { ref_r1_id: $.data.id }
            - call: "POST /franchise/referrals/${ref_r1_id}/accept"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
            - call: "POST /franchise/referrals/${ref_r1_id}/complete"
              payload: { settled_job_value_cents: 120000 }
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
            - call: "POST /franchise/referrals/${ref_r1_id}/settle"
              payload: { expected_agreement_version: "${agt_a1_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/royalty-statements"
              payload: { agreement_id: "${agt_a1_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", gross_revenue_cents: 1000000 }
              as: FranchiseAdmin
              captures: { st1_id: $.data.id }
          trigger:
            - call: "GET /franchise/royalty-statements/${st1_id}/preview"
              payload: {}
              as: FranchiseAdmin
              captures: { draft_net: $.data.net_remittance_cents }
            - call: "POST /franchise/royalty-statements/${st1_id}/issue"
              payload: {}
              as: FranchiseAdmin
              captures: { final_net: $.data.net_remittance_cents }
          assert:
            - "the preview response reports accrual_variant == DRAFT_PROPORTIONAL and net_remittance_cents == 70000"
            - "the issue response reports accrual_variant == FINAL_NETTED"
            - "RoyaltyStatement.${st1_id}.royalty_cents == 60000 and ad_fund_cents == 10000"
            - "RoyaltyStatement.${st1_id}.referral_offset_cents == 18000"
            - "RoyaltyStatement.${st1_id}.net_remittance_cents == 52000"
            - "the two variants differ by exactly the settled offset: draft 70000 minus final 52000 == 18000"
            - "Agreement.${agt_a1_id}.cumulative_royalty_cents == 60000"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across DIFFERENT modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: labor_charge_tiered_three_input_formula
        grounds:
          - calculations.labor_charge_calculation
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.WorkOrder.CREATED_to_DISPATCHED
          - entities.WorkOrder.fields.labor_cents
        distinguishing_aspect: "Mode (a) — a formula with three inputs (service_level_hours, priority, source) interacting non-linearly: hours are ceiled after priority scaling, a tier-selected hourly rate is applied, then a source-conditional multiplier, so the intermediate hour count is itself tier-dependent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Brand MS with min_certification_level APPRENTICE and national_ad_fund_rate 0.01; agreement A1 holds certification_level JOURNEYMAN."
            - "NationalAccount NA1 of type PROPERTY_MANAGER with contracted_brands [MS], service_level_hours 8, sla_credit_per_breach_cents 7500, breach_tolerance 2."
            - "WorkOrder WO1 on A1 with source NATIONAL_ACCOUNT, priority URGENT, service_level_hours 6, parts_cents 12000, national_account_id NA1, dispatched and started, still under its SLA."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
            - *c_agt_a1
            - *c_off_ms
            - *c_awd_ms
            - *c_off_a1
            - *c_act_a1
            - &c_na1
              call: "POST /franchise/national-accounts"
              payload: { account_name: "Northline Property Group", account_type: "PROPERTY_MANAGER", contracted_brands: ["${ms_brand_id}"], service_level_hours: 8, sla_credit_per_breach_cents: 7500, breach_tolerance: 2, annual_commitment_cents: 25000000 }
              as: FranchiseAdmin
              captures: { na1_id: $.data.id }
            - &c_wo1
              call: "POST /franchise/work-orders"
              payload: { agreement_id: "${agt_a1_id}", source: "NATIONAL_ACCOUNT", priority: "URGENT", service_level_hours: 6, parts_cents: 12000, national_account_id: "${na1_id}" }
              as: FranchiseAdmin
              captures: { wo1_id: $.data.id }
            - call: "POST /franchise/work-orders/${wo1_id}/dispatch"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
            - call: "POST /franchise/work-orders/${wo1_id}/start"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
          trigger:
            - call: "POST /franchise/work-orders/${wo1_id}/complete"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
          assert:
            - "the response status is 200 and WorkOrder.${wo1_id}.status == COMPLETED"
            - "WorkOrder.${wo1_id}.labor_cents == 83250"
            - "WorkOrder.${wo1_id}.labor_cents != 92500, so priority-scaled hours were NOT multiplied before the ceiling"
            - "WorkOrder.${wo1_id}.revenue_cents == 95250"
            - "NationalAccount.${na1_id}.accumulated_revenue_cents == 95250"
            - "NationalAccount.${na1_id}.open_breach_count == 0"

      - name: royalty_accrual_pinned_evaluation_order
        grounds:
          - calculations.royalty_accrual_calculation
          - calculations.referral_offset_calculation
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - entities.RoyaltyStatement.fields.net_remittance_cents
        distinguishing_aspect: "Mode (c) — net_remittance_cents is a composition whose offset is keyed on the referrals already SETTLED inside the statement window; the scaffold pins that the offset is resolved BEFORE the subtraction and the max(0, ...) floor is applied AFTER it, so royalty_cents is never itself floored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS carries royalty_rate_override 0.06 and brand MS national_ad_fund_rate 0.01; agreement A2 is on brand IL."
            - "Referral R1 originates at A2 and is RECEIVED by A1; it is SETTLED inside the statement window with referral_fee_cents 25000, so A1 owes 25000 for the period."
            - "RoyaltyStatement ST1 for A1 covers [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) with gross_revenue_cents 100000 and is still DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_il_brand
            - *c_fr_ms
            - *c_fr_il
            - *c_ter_ms
            - *c_ter_il
            - *c_agt_a1_ov
            - *c_agt_a2
            - *c_off_ms
            - *c_awd_ms
            - *c_off_il
            - *c_awd_il
            - *c_off_a1
            - *c_off_a2
            - *c_act_a1
            - *c_act_a2
            - call: "POST /franchise/referrals"
              payload: { referral_code: "R1", originating_agreement_id: "${agt_a2_id}", receiving_agreement_id: "${agt_a1_id}", customer_household_ref: "HH-9002", job_description: "Main line excavation surfaced during a panel job", estimated_job_value_cents: 250000, referral_fee_rate: 0.10 }
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
              captures: { ref_r1_id: $.data.id }
            - call: "POST /franchise/referrals/${ref_r1_id}/accept"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
            - call: "POST /franchise/referrals/${ref_r1_id}/complete"
              payload: { settled_job_value_cents: 250000 }
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
            - call: "POST /franchise/referrals/${ref_r1_id}/settle"
              payload: { expected_agreement_version: "${agt_a2_v}" }
              as: FranchiseAdmin
            - call: "POST /franchise/royalty-statements"
              payload: { agreement_id: "${agt_a1_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", gross_revenue_cents: 100000 }
              as: FranchiseAdmin
              captures: { st1_id: $.data.id }
          trigger:
            - call: "POST /franchise/royalty-statements/${st1_id}/issue"
              payload: {}
              as: FranchiseAdmin
          assert:
            - "the response status is 200 and RoyaltyStatement.${st1_id}.status == ISSUED"
            - "RoyaltyStatement.${st1_id}.royalty_cents == 6000"
            - "RoyaltyStatement.${st1_id}.ad_fund_cents == 1000"
            - "RoyaltyStatement.${st1_id}.referral_offset_cents == -25000"
            - "RoyaltyStatement.${st1_id}.net_remittance_cents == 0"
            - "RoyaltyStatement.${st1_id}.net_remittance_cents != -18000, so the max(0, ...) floor was applied after the subtraction"
            - "Agreement.${agt_a1_id}.cumulative_royalty_cents == 6000"# ===========================================================================
  # Rule 3 — non-linear state-machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: agreement_parallel_dimensions_lifecycle_and_standards
        grounds:
          - state_machines.FranchiseAgreement
          - entities.FranchiseAgreement.fields.lifecycle_status
          - entities.FranchiseAgreement.fields.standards_status
          - state_machines.BrandStandardsAudit.SCHEDULED_to_CONDUCTED
        distinguishing_aspect: "The FranchiseAgreement carries two INDEPENDENT state axes — lifecycle_status (commercial) and standards_status (brand standards) — and a standards-driven move on the second axis leaves the first axis exactly where it was."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE with standards_status COMPLIANT."
            - "BrandStandardsAudit AU1 for A1 is SCHEDULED with audit_kind MYSTERY_SHOP, raw_score 80.0 and critical_findings_count 1, so its weighted score is 56.5 and its outcome is FAIL."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
            - *c_agt_a1
            - *c_off_ms
            - *c_awd_ms
            - *c_off_a1
            - *c_act_a1
            - call: "POST /franchise/brand-standards-audits"
              payload: { agreement_id: "${agt_a1_id}", audit_kind: "MYSTERY_SHOP", conducted_iso: "2026-09-01T00:00:00Z", raw_score: 80.0, findings_count: 4, auditor_operator_id: "op-auditor-riley", critical_findings_count: 1 }
              as: FranchiseAdmin
              captures: { au1_id: $.data.id }
            - call: "POST /franchise/brand-standards-audits/${au1_id}/conduct"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/brand-standards-audits/${au1_id}/publish"
              payload: { expected_agreement_version: "${agt_a1_v}" }
              as: FranchiseAdmin
          assert:
            - "the response status is 200 and BrandStandardsAudit.${au1_id}.audit_status == PUBLISHED"
            - "BrandStandardsAudit.${au1_id}.weighted_score == 56.5 and outcome == FAIL"
            - "BrandStandardsAudit.${au1_id}.remediation_status == OPEN"
            - "Agreement.${agt_a1_id}.standards_status == REMEDIATION_REQUIRED"
            - "Agreement.${agt_a1_id}.lifecycle_status == ACTIVE"
            - "Agreement.${agt_a1_id}.open_remediation_count == 1"
            - "GET /franchise/agreements?franchisee_id=${fr_ms_id}&standards_status=REMEDIATION_REQUIRED returns exactly 1 row"

      - name: referral_cyclic_dispute_and_resolution_loop
        grounds:
          - state_machines.Referral.COMPLETED_to_DISPUTED
          - state_machines.Referral.DISPUTED_to_COMPLETED
          - state_machines.Referral.COMPLETED_to_SETTLED
          - entities.Referral.fields.status
        distinguishing_aspect: "The Referral machine is CYCLIC: COMPLETED returns to DISPUTED and back to COMPLETED an arbitrary number of times, but COMPLETED to SETTLED is refused while a dispute is open, so settlement is only reachable through the resolved branch."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreements A1 (brand MS) and A2 (brand IL) are ACTIVE under their own franchisees."
            - "Referral R1 originates at A1 and is received by A2, is ACCEPTED and COMPLETED with settled_job_value_cents 120000."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_il_brand
            - *c_fr_ms
            - *c_fr_il
            - *c_ter_ms
            - *c_ter_il
            - *c_agt_a1
            - *c_agt_a2
            - *c_off_ms
            - *c_awd_ms
            - *c_off_il
            - *c_awd_il
            - *c_off_a1
            - *c_off_a2
            - *c_act_a1
            - *c_act_a2
            - &cy_r1
              call: "POST /franchise/referrals"
              payload: { referral_code: "R1", originating_agreement_id: "${agt_a1_id}", receiving_agreement_id: "${agt_a2_id}", customer_household_ref: "HH-9003", job_description: "Water heater replacement surfaced during an electrical visit", estimated_job_value_cents: 120000, referral_fee_rate: 0.10 }
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
              captures: { ref_r1_id: $.data.id }
            - call: "POST /franchise/referrals/${ref_r1_id}/accept"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
            - call: "POST /franchise/referrals/${ref_r1_id}/complete"
              payload: { settled_job_value_cents: 120000 }
              as: FranchiseeOperator
              as_user_id: "${fr_il_id}"
          trigger:
            - call: "POST /franchise/referrals/${ref_r1_id}/dispute"
              payload: { dispute_reason: "Job value recorded as 120000 but the work performed was partial" }
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
              captures: { disputed_state: $.data.status }
            - call: "POST /franchise/referrals/${ref_r1_id}/settle"
              payload: { expected_agreement_version: "${agt_a1_v}" }
              as: FranchiseAdmin
              captures: { blocked_error: $.data.error_id }
            - call: "POST /franchise/referrals/${ref_r1_id}/resolve-dispute"
              payload: {}
              as: FranchiseAdmin
              captures: { resolved_state: $.data.status }
            - call: "POST /franchise/referrals/${ref_r1_id}/settle"
              payload: { expected_agreement_version: "${agt_a1_v}" }
              as: FranchiseAdmin
              captures: { settled_state: $.data.status }
          assert:
            - "the first dispute returns 200 and sets status DISPUTED"
            - "the settle while disputed returns 409 with error_id == ERR_REFERRAL_DISPUTED, and Referral.${ref_r1_id}.status is still DISPUTED"
            - "resolve-dispute returns 200 and sets status back to COMPLETED"
            - "the final settle returns 200 and sets status SETTLED"
            - "Referral.${ref_r1_id}.fee_variant == TIERED_BRAND_PAIR and referral_fee_cents == 18000"
            - "the D → C → D cycle leaves no drift: Agreement.${agt_a1_id}.cumulative_referral_net_cents == 18000 once, not 36000"

  # ===========================================================================
  # Rule 4 — transitive cascade chains from DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: standards_default_cascade_audit_to_agreement_to_franchisee
        grounds:
          - state_machines.BrandStandardsAudit.PUBLISHED_to_SUPERSEDED
          - state_machines.FranchiseAgreement.ACTIVE_to_SUSPENDED
          - entities.FranchiseAgreement.fields.standards_status
          - entities.Franchisee.fields.status
        distinguishing_aspect: "Depth 3 from the remediation-default trigger: the audit's remediation_status moves to DEFAULTED, THAT mutation drives the agreement's standards_status to DEFAULT, and THAT mutation in turn drives the franchisee's status to SUSPENDED — three links, each caused by the previous one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE under franchisee Mosaic Central LLC with status ACTIVE."
            - "Audit AU1 (MYSTERY_SHOP, raw_score 80.0, critical 1) was conducted and published at clock 2026-09-01T00:00:00Z, so its remediation is OPEN with remediation_due_iso 2026-09-08T00:00:00Z and the agreement's standards_status is REMEDIATION_REQUIRED."
            - "The logical clock has been advanced to 2026-09-09T00:00:00Z, past remediation_due_iso, and POST /_ops/run_sweep has been fired, so the open remediation has auto-escalated to ESCALATED."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
            - *c_agt_a1
            - *c_off_ms
            - *c_awd_ms
            - *c_off_a1
            - *c_act_a1
            - call: "POST /franchise/brand-standards-audits"
              payload: { agreement_id: "${agt_a1_id}", audit_kind: "MYSTERY_SHOP", conducted_iso: "2026-09-01T00:00:00Z", raw_score: 80.0, findings_count: 4, auditor_operator_id: "op-auditor-riley", critical_findings_count: 1 }
              as: FranchiseAdmin
              captures: { au1_id: $.data.id }
            - call: "POST /franchise/brand-standards-audits/${au1_id}/conduct"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/brand-standards-audits/${au1_id}/publish"
              payload: { expected_agreement_version: "${agt_a1_v}" }
              as: FranchiseAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /_ops/run_sweep"
              payload: {}
              as: FranchiseAdmin
          trigger:
            - call: "POST /franchise/brand-standards-audits/${au1_id}/remediation-transitions"
              payload: { action: "DEFAULT", reason: "Remediation never submitted" }
              as: FranchiseAdmin
          assert:
            - "the response status is 200"
            - "HOP 1: BrandStandardsAudit.${au1_id}.remediation_status == DEFAULTED"
            - "HOP 2: Agreement.${agt_a1_id}.standards_status == DEFAULT"
            - "HOP 3: Franchisee.${fr_ms_id}.status == SUSPENDED"
            - "Agreement.${agt_a1_id}.lifecycle_status is still ACTIVE — the cascade moved the standards axis and the franchisee, not the commercial axis"
            - "GET /franchise/franchisees?status=SUSPENDED returns exactly 1 row, franchisee ${fr_ms_id}"

      - name: sla_breach_cascade_work_order_to_national_account_status
        grounds:
          - state_machines.WorkOrder.DISPATCHED_to_SLA_BREACHED
          - entities.NationalAccount.fields.open_breach_count
          - entities.NationalAccount.fields.breach_tolerance
        distinguishing_aspect: "Depth 2 from the SLA-breach trigger on a different entity pair: crossing the work order's sla_due_iso increments the program's open_breach_count, and THAT counter crossing breach_tolerance — not the breach itself — flips the program to SUSPENDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agreement A1 on brand MS is ACTIVE."
            - "NationalAccount NA1 (NATIONAL_ACCOUNT) with contracted_brands [MS], service_level_hours 8, sla_credit_per_breach_cents 7500 and breach_tolerance 1."
            - "WorkOrders WO1 and WO2 are both dispatched with STANDARD priority and service_level_hours 4, so each has sla_due_iso 2026-09-01T04:00:00Z."
            - "The clock has been advanced to 2026-09-01T05:00:00Z and POST /_ops/run_sweep fired with both work orders still under the sweep: the sweep breached WO1, leaving open_breach_count 1 and the program still ACTIVE, while WO2 was left DISPATCHED."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
            - *c_agt_a1
            - *c_off_ms
            - *c_awd_ms
            - *c_off_a1
            - *c_act_a1
            - call: "POST /franchise/national-accounts"
              payload: { account_name: "Cascade Facilities Trust", account_type: "NATIONAL_ACCOUNT", contracted_brands: ["${ms_brand_id}"], service_level_hours: 8, sla_credit_per_breach_cents: 7500, breach_tolerance: 1, annual_commitment_cents: 40000000 }
              as: FranchiseAdmin
              captures: { na1_id: $.data.id }
            - call: "POST /franchise/work-orders"
              payload: { agreement_id: "${agt_a1_id}", source: "NATIONAL_ACCOUNT", priority: "STANDARD", service_level_hours: 4, parts_cents: 0, national_account_id: "${na1_id}" }
              as: FranchiseAdmin
              captures: { wo1_id: $.data.id }
            - call: "POST /franchise/work-orders"
              payload: { agreement_id: "${agt_a1_id}", source: "NATIONAL_ACCOUNT", priority: "STANDARD", service_level_hours: 4, parts_cents: 0, national_account_id: "${na1_id}" }
              as: FranchiseAdmin
              captures: { wo2_id: $.data.id }
            - call: "POST /franchise/work-orders/${wo1_id}/dispatch"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T05:00:00Z" }
              as: FranchiseAdmin
            - call: "POST /franchise/work-orders/${wo1_id}/breach"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/work-orders/${wo2_id}/dispatch"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
          trigger:
            - call: "POST /franchise/work-orders/${wo2_id}/breach"
              payload: {}
              as: FranchiseAdmin
          assert:
            - "the response status is 200 and WorkOrder.${wo2_id}.status == SLA_BREACHED"
            - "HOP 1: NationalAccount.${na1_id}.open_breach_count == 2"
            - "HOP 2: NationalAccount.${na1_id}.status == SUSPENDED"
            - "NationalAccount.${na1_id}.sla_credit_accrued_cents == 15000"
            - "WorkOrder.${wo1_id}.status == SLA_BREACHED and WorkOrder.${wo2_id}.status == SLA_BREACHED"
            - "Agreement.${agt_a1_id}.lifecycle_status == ACTIVE — the cascade did not touch the agreement"# ===========================================================================
  # Rule 5 — validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: dispatch_conflict_priority_7_safety_beats_priority_10_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_CERTIFICATION_TOO_LOW
          - errors.ERR_SLA_WINDOW_EXCEEDS_PROGRAM
        distinguishing_aspect: "The business_safety pair versus the business_temporal pair: a dispatch that fails BOTH the certification gate (priority 7) and the program SLA-window gate (priority 10) reports ERR_CERTIFICATION_TOO_LOW, never ERR_SLA_WINDOW_EXCEEDS_PROGRAM."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Brand MS requires min_certification_level MASTER. Agreement A1 holds only APPRENTICE, so it cannot dispatch MS work at all."
            - "NationalAccount NA1 declares service_level_hours 4. WorkOrder WO1 asks for service_level_hours 6 against NA1, so it also violates the program window."
          setup_api_calls:
            - *c_clock
            - &p_ms_master_brand
              call: "POST /franchise/brands"
              payload: { brand_code: "MS", display_name: "Mosaic Plumbing", trade: "PLUMBING", royalty_rate: 0.06, national_ad_fund_rate: 0.01, min_certification_level: "MASTER", audit_cycle_months: 12, cross_brand_fee_table: {} }
              as: FranchiseAdmin
              captures: { ms_brand_id: $.data.id }
            - *c_fr_ms
            - *c_ter_ms
            - &p_agt_low_cert
              call: "POST /franchise/agreements"
              payload: { agreement_number: "A-MS-01", franchisee_id: "${fr_ms_id}", brand_id: "${ms_brand_id}", territory_id: "${ter_ms_id}", signed_on: "2026-09-01T00:00:00Z", initial_term_months: 120, certification_level: "APPRENTICE" }
              as: FranchiseAdmin
              captures: { agt_a1_id: $.data.id }
            - *c_off_ms
            - call: "GET /franchise/territories/${ter_ms_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_ms_v: $.data.version }
            - call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_ms_v}" }
              as: FranchiseAdmin
            - *c_off_a1
            - call: "POST /franchise/agreements/${agt_a1_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/national-accounts"
              payload: { account_name: "Tight Window Trust", account_type: "NATIONAL_ACCOUNT", contracted_brands: ["${ms_brand_id}"], service_level_hours: 4, sla_credit_per_breach_cents: 7500, breach_tolerance: 3, annual_commitment_cents: 10000000 }
              as: FranchiseAdmin
              captures: { na1_id: $.data.id }
            - call: "POST /franchise/work-orders"
              payload: { agreement_id: "${agt_a1_id}", source: "NATIONAL_ACCOUNT", priority: "STANDARD", service_level_hours: 6, parts_cents: 0, national_account_id: "${na1_id}" }
              as: FranchiseAdmin
              captures: { wo1_id: $.data.id }
          trigger:
            - call: "POST /franchise/work-orders/${wo1_id}/dispatch"
              payload: {}
              as: FranchiseeOperator
              as_user_id: "${fr_ms_id}"
              captures: { dispatch_error: $.data.error_id }
          assert:
            - "the response status is 422 and dispatch_error == ERR_CERTIFICATION_TOO_LOW"
            - "dispatch_error != ERR_SLA_WINDOW_EXCEEDS_PROGRAM"
            - "WorkOrder.${wo1_id}.status is still CREATED and dispatched_clock_iso is null"
            - "GET /franchise/work-orders?agreement_id=${agt_a1_id}&status=DISPATCHED returns 0 rows"

      - name: award_conflict_priority_9_constraint_beats_priority_11_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors.ERR_TERRITORY_POSTAL_OVERLAP
          - errors.ERR_HOUSEHOLD_CAP_EXCEEDED
        distinguishing_aspect: "The business_constraint pair versus the business_fiscal pair: an award that both re-uses a live postal code (priority 9) and would push the franchisee past the 250000-household cap (priority 11) reports ERR_TERRITORY_POSTAL_OVERLAP, never ERR_HOUSEHOLD_CAP_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Franchisee Mosaic Central LLC already holds territory MS-01 (30000 households, postals 75001/75002) with its agreement ACTIVE, so the franchisee sits at 30000 households."
            - "Territory MS-02 for the same brand is OFFERED to the same franchisee with household_count 240000 and postal_codes [75002, 75003] — 75002 collides with the live MS-01, AND 30000 + 240000 == 270000 exceeds the 250000 cap."
          setup_api_calls:
            - *c_clock
            - *c_ms_brand
            - *c_fr_ms
            - *c_ter_ms
            - *c_agt_a1
            - *c_off_ms
            - &p_awd_ms
              call: "POST /franchise/territories/${ter_ms_id}/award"
              payload: { expected_territory_version: "${ter_ms_v}" }
              as: FranchiseAdmin
            - *c_off_a1
            - &p_act_a1
              call: "POST /franchise/agreements/${agt_a1_id}/activate"
              payload: {}
              as: FranchiseAdmin
            - call: "POST /franchise/territories"
              payload: { territory_code: "MS-02", brand_id: "${ms_brand_id}", household_count: 240000, postal_codes: ["75002", "75003"], expansion_right_households: 300000, protected: true, franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
              captures: { ter_ms2_id: $.data.id }
            - call: "POST /franchise/territories/${ter_ms2_id}/offer"
              payload: { franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_ms2_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_ms2_v: $.data.version }
          trigger:
            - call: "POST /franchise/territories/${ter_ms2_id}/award"
              payload: { expected_territory_version: "${ter_ms2_v}" }
              as: FranchiseAdmin
              captures: { award_error: $.data.error_id }
          assert:
            - "the response status is 409 and award_error == ERR_TERRITORY_POSTAL_OVERLAP"
            - "award_error != ERR_HOUSEHOLD_CAP_EXCEEDED"
            - "Territory.${ter_ms2_id}.status is still OFFERED and allocated_households == 0"
            - "Franchisee.${fr_ms_id}.allocated_households == 30000"

  # ===========================================================================
  # Rule 6 — boundary-precision checks on DIFFERENT metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: expansion_threshold_exact_equality_qualifies
        grounds:
          - state_machines.Territory.ACTIVE_to_EXPANSION_REQUESTED
          - errors.ERR_EXPANSION_THRESHOLD_NOT_MET
          - entities.Territory.fields.expansion_right_households
          - endpoints.POST_/franchise/territories/{id}/request-expansion
        distinguishing_aspect: "A household-count threshold crossing on the expansion endpoint: household_count exactly equal to expansion_right_households is ACCEPTED because the comparison is >=, and one household below is rejected — the same territory flips on a single unit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two territories on brand MS for the same franchisee: T-EQ with household_count 45000 and expansion_right_households 45000, and T-UNDER with household_count 44999 and expansion_right_households 45000. Both are ACTIVE."
