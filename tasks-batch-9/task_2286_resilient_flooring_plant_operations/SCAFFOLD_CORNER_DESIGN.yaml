              as_user_id: "adj-002"
              captures: { ok_months: $.data.elapsed_months, ok_amount: $.data.settlement_amount_cents, ok_status: $.data.status }
            - call: "POST /warranty-claims/${wc240_id}/adjudicate"
              payload: { decision: APPROVE }
              as: WarrantyAdjuster
              as_user_id: "adj-002"
              captures: { exp_err: $.data.error_id }
          assert:
            - "${ok_months} == 239, ${ok_status} == APPROVED and ${ok_amount} == 10710 — elapsed_years FLOOR(239/12) == 19 falls through to the 20% step of the 53550 replacement value"
            - "${exp_err} == ERR_WARRANTY_EXPIRED with HTTP 409 for the 240-month claim"
            - "GET /warranty-claims/${wc240_id} still reports status ADJUDICATION_READY with settlement_amount_cents null — the refusal happens before any settlement is computed"

      - name: print_film_roll_set_capacity_counts_intersecting_runs_in_aggregate
        claim_type: violation_to_error
        grounds:
          - "validations.V-TEMP-3"
          - "errors.ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED"
          - "entities.PrintFilm.fields.master_roll_sets"
        distinguishing_aspect: |
          An AGGREGATE rule, not a pairwise exclusion: with master_roll_sets 2 the first
          two simultaneous runs on the same film are both admitted and only the third is
          refused. Each pair overlaps, so any pairwise reading of the rule would already
          have rejected the second run.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - &pfDuo
              call: "POST /print-films"
              payload: { design_code: "PF-DUO-600", license_id: "${lic_id}", pattern_repeat_mm_length: 600, pattern_repeat_mm_width: 150, registration_tolerance_mm: 0.25, emboss_plate_code: "EP-DUO-A", emboss_alignment_offset_mm: 0.10, master_roll_sets: 2 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf_duo_id: $.data.id }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-DUO", formulation_id: "${f_min_id}", print_film_id: "${pf_duo_id}", construction_type: GLUE_DOWN, wear_layer_mil: 12, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2000 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_duo_id: $.data.id }
            - call: "POST /product-skus/${sku_duo_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - *pl1
            - call: "POST /press-lines"
              payload: { line_code: "PL-B", line_type: CALENDER, min_thickness_mm: 1.50, max_thickness_mm: 8.00, changeover_minutes: 60, curl_control_index: 92 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { plb_id: $.data.id }
            - call: "POST /press-lines"
              payload: { line_code: "PL-C", line_type: CALENDER, min_thickness_mm: 1.50, max_thickness_mm: 8.00, changeover_minutes: 60, curl_control_index: 92 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { plc_id: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-D1", sku_id: "${sku_duo_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { d1_id: $.data.id, d1_status: $.data.run_status }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-D2", sku_id: "${sku_duo_id}", press_line_id: "${plb_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { d2_id: $.data.id, d2_status: $.data.run_status }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-D3", sku_id: "${sku_duo_id}", press_line_id: "${plc_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { d3_err: $.data.error_id }
          assert:
            - "${d1_status} == PLANNED and ${d2_status} == PLANNED — two intersecting runs are within a master_roll_sets of 2, and ${d1_id} and ${d2_id} are distinct rows"
            - "${d3_err} == ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED with HTTP 409, because the count of intersecting non-ABORTED runs reaches 2 >= 2"
            - "no ERR_PRESS_LINE_WINDOW_CONFLICT is raised on any of the three: each run sits on its own press line"
            - "GET /production-runs?press_line_id=${plc_id} reports total_count 0"

      - name: click_profile_field_group_is_conditionally_required_and_conditionally_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations.V-REQ-2"
          - "errors.ERR_INVALID_REQUEST"
          - "entities.ProductSku.fields.profile_family"
        distinguishing_aspect: |
          A CONDITIONAL rule that cuts both ways on the same field group: the four milling
          fields are mandatory when profile_family is set, forbidden when it is NONE, and
          a click-lock construction type may not leave profile_family at NONE. All three
          disjuncts collapse onto one error code, and the all-null GLUE_DOWN control must
          still be accepted.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *lic
            - *pf1
          trigger:
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-V1", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 12, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2000 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { v1_id: $.data.id, v1_profile: $.data.profile_family, v1_tongue: $.data.tongue_thickness_target_mm }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-V2", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 12, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2000, tongue_thickness_target_mm: 1.80 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { v2_err: $.data.error_id }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-V3", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: CLICK_LOCK_SPC, wear_layer_mil: 20, overall_thickness_mm: 5.00, royalty_basis_price_cents_per_sqm: 2600, profile_family: NONE }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { v3_err: $.data.error_id }
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-V4", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: CLICK_LOCK_SPC, wear_layer_mil: 20, overall_thickness_mm: 5.00, royalty_basis_price_cents_per_sqm: 2600, profile_family: UNILIN_5G, tongue_thickness_target_mm: 1.80, tolerance_plus_mm: 0.15, tolerance_minus_mm: 0.40, target_lock_shear_n_per_mm: 8.00 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { v4_err: $.data.error_id }
          assert:
            - "${v1_id} is created with ${v1_profile} == NONE and ${v1_tongue} == null — omitting the whole group on a GLUE_DOWN plank is legal"
            - "${v2_err} == ERR_INVALID_REQUEST with HTTP 400 — a milling field supplied while profile_family is NONE"
            - "${v3_err} == ERR_INVALID_REQUEST with HTTP 400 — CLICK_LOCK_SPC with profile_family NONE"
            - "${v4_err} == ERR_TOLERANCE_BAND_INVALID with HTTP 422, NOT ERR_INVALID_REQUEST: the group is complete so V-REQ-2 is satisfied, and the 0.15 + 0.40 == 0.55 band is then refused by V-CON-7 at a lower priority"

      - name: formulation_revision_makes_pin_stale_and_cascades_into_release_refusal
        claim_type: violation_to_error
        grounds:
          - "validations.V-XSTATE-7"
          - "errors.ERR_SKU_NOT_PRODUCIBLE"
          - "entities.ProductSku.fields.pin_stale"
          - "endpoints.POST /formulations/{id}/revisions side_effects"
        distinguishing_aspect: |
          A CASCADING validation: opening a revision on the approved recipe bumps the
          PARENT formulation's version, which invalidates the SKU's pinned_formulation_version,
          which sets pin_stale, which is what V-XSTATE-7 reads. Nothing was written to the
          SKU and no state machine on it moved, yet a commercial RELEASED that succeeded
          before is now refused.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - call: "GET /product-skus/${sku_a_id}/cost-summary"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pre_stale: $.data.pin_stale, pre_pinned: $.data.pinned_basis_standard_cost_cents_per_sqm }
            - *fminRev
          trigger:
            - call: "GET /product-skus/${sku_a_id}/cost-summary"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { post_stale: $.data.pin_stale, post_delta: $.data.basis_delta_cents_per_sqm }
            - call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: RELEASED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rel_err: $.data.error_id }
          assert:
            - "${pre_stale} == false and ${pre_pinned} == 1157 immediately after certification, with pinned_formulation_version 2"
            - "${post_stale} == true and ${post_delta} == 0 — the material costs never moved; only the parent formulation's version did, from 2 to 3, when ${f_min_r2_id} was opened"
            - "${rel_err} == ERR_SKU_NOT_PRODUCIBLE with HTTP 409, NOT ERR_INVALID_COMMERCIAL_STATE — the DEVELOPMENT -> RELEASED transition itself is declared and V-STATE-4 is satisfied"
            - "GET /product-skus/${sku_a_id} still reports commercial_status DEVELOPMENT and certification_status CERTIFIED"

      - name: allocation_lifecycle_precedes_referential_candidate_search
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: "allocation_own_state_beats_no_eligible_batch_referential"
          rationale: |
            The priority_ordering claim for the fill endpoint — own-state V-STATE-9 at
            priority 7 pre-empting the referential V-REF-7 at priority 14, and the
            deliberate hand-off of the FILLED case to V-CON-9 at priority 12 — is proved
            there with both codes observed from the same fixture.

      - name: temporal_band_precedes_fiscal_band_on_run_creation
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: "press_window_temporal_beats_license_volume_fiscal"
          rationale: |
            The Priority-conflict pattern across bands P13 and P15 — a run that both
            overlaps an occupied press window and breaks the term volume cap must return
            ERR_PRESS_LINE_WINDOW_CONFLICT — is covered there, together with the
            single-fault controls that show each code is reachable on its own.

  # ===========================================================================
  # Guide section 5 — Table 5 (Endpoints), one instance per endpoint kind.
  # The guide's "Bulk action" row is intentionally unrepresented: §1.5 declares
  # no bulk endpoint, so there is no such claim to extract.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: press_line_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - "endpoints.POST /press-lines"
          - "endpoints.GET /press-lines/{id}"
          - "endpoints.GET /press-lines"
        distinguishing_aspect: |
          The plain create / read-one / list-with-filter trio on the one entity that has no
          inbound dependencies, so the round trip is observable with nothing else in the
          database. The list must honour the line_type filter and still report the
          pagination envelope.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *pl1
          trigger:
            - call: "POST /press-lines"
              payload: { line_code: "PL-2", line_type: MULTI_DAY_PRESS, min_thickness_mm: 6.00, max_thickness_mm: 8.00, changeover_minutes: 90, curl_control_index: 95 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl2_id: $.data.id, pl2_status: $.data.status, pl2_version: $.data.version }
            - call: "GET /press-lines/${pl2_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { pl2_read_code: $.data.line_code, pl2_read_curl: $.data.curl_control_index, pl2_read_min: $.data.min_thickness_mm }
            - call: "GET /press-lines?line_type=CALENDER&limit=10&offset=0"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { list_first_code: "$.data[0].line_code" }
          assert:
            - "${pl2_status} == AVAILABLE and ${pl2_version} == 1 on creation"
            - "${pl2_read_code} == PL-2, ${pl2_read_curl} == 95 and ${pl2_read_min} == 6.00 — the read echoes exactly what was written"
            - "the filtered list returns total_count 1, has_more false and ${list_first_code} == PL-1; PL-2 is excluded by line_type"
            - "the unfiltered GET /press-lines returns total_count 2"

      - name: press_line_status_action_takes_the_line_out_of_service
        claim_type: action_endpoint
        grounds:
          - "endpoints.POST /press-lines/{id}/status"
          - "validations.V-XSTATE-3"
          - "errors.ERR_PRESS_LINE_UNAVAILABLE"
        distinguishing_aspect: |
          A body-carrying action endpoint whose only job is to move one enum and bump the
          version, and whose effect is observable only indirectly: run creation against the
          same line stops working the moment the action lands. The identical run payload is
          accepted before and refused after.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *pl1
            - call: "POST /production-runs"
              payload: { run_code: "RUN-E1", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { e1_status: $.data.run_status }
          trigger:
            - call: "POST /press-lines/${pl1_id}/status"
              payload: { to_status: MAINTENANCE }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl1_new_status: $.data.status, pl1_new_version: $.data.version }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-E2", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T05:00:00Z", planned_end_utc: "2026-08-01T06:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { e2_err: $.data.error_id }
          assert:
            - "${e1_status} == PLANNED — the same shape of payload is accepted while the line is AVAILABLE"
            - "${pl1_new_status} == MAINTENANCE and ${pl1_new_version} == 2 (the action is a write and bumps the version)"
            - "${e2_err} == ERR_PRESS_LINE_UNAVAILABLE with HTTP 409"
            - "the already-PLANNED RUN-E1 is untouched: GET /production-runs/{RUN-E1 id} still reports run_status PLANNED"

      - name: sku_cost_summary_computed_read_exposes_all_seven_components
        claim_type: computed_read
        grounds:
          - "endpoints.GET /product-skus/{id}/cost-summary"
          - "calculations.sku_standard_cost"
          - "calculations.sku_list_price"
        distinguishing_aspect: |
          A read-only projection that persists nothing and returns sixteen derived fields,
          including both variants side by side. Immediately after certification the two
          bases must agree exactly and basis_delta_cents_per_sqm must be 0, which is the
          only state in which the read is self-checking against the stamped
          standard_cost_cents_per_sqm.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
          trigger:
            - call: "GET /product-skus/${sku_a_id}/cost-summary"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { cs_core: $.data.pinned_basis_core_cost_cents, cs_wear: $.data.wear_layer_cost_cents, cs_film: $.data.print_film_cost_cents, cs_under: $.data.underlayment_cost_cents, cs_water: $.data.waterproof_cost_cents, cs_conv: $.data.conversion_cost_cents, cs_roy: $.data.royalty_cost_cents, cs_std: $.data.pinned_basis_standard_cost_cents_per_sqm, cs_live: $.data.live_basis_standard_cost_cents_per_sqm, cs_delta: $.data.basis_delta_cents_per_sqm, cs_list: $.data.pinned_basis_list_price_cents_per_sqm, cs_blend: $.data.pinned_basis_blended_cost_per_kg_cents }
            - call: "GET /product-skus/${sku_a_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { sku_std: $.data.standard_cost_cents_per_sqm, sku_list: $.data.list_price_cents_per_sqm, sku_version_after_read: $.data.version }
          assert:
            - "${cs_blend} == 201, ${cs_core} == 955 (201 * 1.90 * 2.50 rounded once), ${cs_wear} == 42, ${cs_film} == 20, ${cs_under} == 0, ${cs_water} == 0, ${cs_conv} == 35, ${cs_roy} == 105"
            - "${cs_std} == 1157 — the integer sum of the seven independently rounded components — and ${cs_list} == 1562"
            - "${cs_live} == 1157 and ${cs_delta} == 0 immediately after certification"
            - "${sku_std} == ${cs_std} and ${sku_list} == ${cs_list}; ${sku_version_after_read} is unchanged by the computed read, which writes nothing"

      - name: batch_allocation_lines_reverse_link_from_stock_to_demand
        claim_type: cross_reference_link
        grounds:
          - "endpoints.GET /batches/{id}/allocation-lines"
          - "entities.AllocationLine.parent_relationships"
        distinguishing_aspect: |
          The junction between Batch and Allocation is traversed from the STOCK side, which
          is the direction no owning parent provides: an AllocationLine is created only as a
          side effect of a fill on the allocation, yet it must be listable from the batch it
          drew against, with the drawn quantity visible.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - *alloc1
            - *alloc1Fill
          trigger:
            - call: "GET /batches/${batch_a1_id}/allocation-lines"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { bal_qty: "$.data[0].quantity_sqm", bal_alloc: "$.data[0].allocation_id", bal_batch: "$.data[0].batch_id", bal_status: "$.data[0].status", bal_kind: "$.data[0].substitution_kind" }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { bal_avail: $.data.available_quantity_sqm, bal_total: $.data.quantity_sqm }
          assert:
            - "the listing returns total_count 1 with ${bal_batch} == ${batch_a1_id} and ${bal_alloc} == ${alloc1_id}"
            - "${bal_qty} == 100.00, ${bal_status} == ACTIVE and ${bal_kind} == EXACT"
            - "${bal_total} == 1200.00 while ${bal_avail} == 1100.00 — the line and the batch's remaining stock agree"
            - "the same listing filtered with ?status=VOIDED returns total_count 0"

      - name: qc_release_action_is_conditional_on_the_four_gate_booleans
        claim_type: conditional_action
        grounds:
          - "endpoints.POST /production-runs/{id}/qc-disposition"
          - "validations.V-SAFE-2"
          - "errors.ERR_QC_GATES_NOT_MET"
          - "calculations.run_quality_metrics"
        distinguishing_aspect: |
          One endpoint, one payload, two outcomes decided entirely by measurements taken at
          completion: a curl deviation of 0.30 mm against a 0.16 mm allowance makes RELEASED
          unavailable while QUARANTINED remains available, and the advisory
          auto_disposition_recommendation must not be mistaken for the enforcement.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - call: "POST /production-runs/${run_a1_id}/complete"
              payload: { actual_quantity_sqm: 1200.00, registration_drift_mm: 0.20, curl_deviation_mm: 0.30, emboss_alignment_offset_mm: 0.10, wear_layer_measured_mil: 12.0 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { g_reg: $.data.registration_within_tolerance, g_curl: $.data.curl_within_tolerance, g_emb: $.data.emboss_within_tolerance, g_tongue: $.data.tongue_within_tolerance, g_reco: $.data.auto_disposition_recommendation }
          trigger:
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: RELEASED }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { qc_err: $.data.error_id }
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: QUARANTINED, hold_reason: "Curl beyond calender allowance" }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { qc_disp: $.data.qc_disposition }
          assert:
            - "${g_reg} == true, ${g_emb} == true, ${g_tongue} == true (profile_family NONE forces it) but ${g_curl} == false, because 0.30 > the curl allowance ROUND(2.00 * (100 - 92) / 100, 2) == 0.16"
            - "${g_reco} == QUARANTINED"
            - "${qc_err} == ERR_QC_GATES_NOT_MET with HTTP 422 — the RELEASED action is unavailable on this run"
            - "${qc_disp} == QUARANTINED on the second call, and the run's Batch moves IN_PRODUCTION -> HELD with hold_reason 'QC_QUARANTINE' and available_quantity_sqm still 0.00"

  # ===========================================================================
  # Guide section 6 — Table 6 (Errors): every one of the 61 declared codes is
  # either triggered here or deferred with excluded_because to the instance that
  # already triggers it.
  # ===========================================================================
  - section: errors
    instances:

      - name: unauthenticated_requests_missing_headers_or_bad_role_are_rejected
        claim_type: violation_to_error
        grounds:
          - "validations.V-AUTH-1"
          - "errors.ERR_UNAUTHENTICATED"
          - "rbac.notes on X-User-ID / X-Role"
        distinguishing_aspect: |
          V-AUTH-1 sits above every other band, so it must fire on a request that would
          otherwise be a plain 404 or a 403: an absent header set, an absent role and a role
          string outside the seven declared values all collapse to 401, never to 403.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - call: "GET /press-lines"
              payload: {}
              as: "<absent X-Role header>"
              as_user_id: "<absent X-User-ID header>"
              captures: { a1_err: $.data.error_id }
            - call: "GET /press-lines"
              payload: {}
              as: "<absent X-Role header>"
              as_user_id: "pa-001"
              captures: { a2_err: $.data.error_id }
            - call: "GET /press-lines"
              payload: {}
              as: "Machinist"
              as_user_id: "pa-001"
              captures: { a3_err: $.data.error_id }
            - call: "POST /press-lines"
              payload: { line_code: "PL-Z", line_type: CALENDER, min_thickness_mm: 1.50, max_thickness_mm: 8.00, changeover_minutes: 60, curl_control_index: 92 }
              as: "Machinist"
              as_user_id: "pa-001"
              captures: { a4_err: $.data.error_id }
          assert:
            - "${a1_err} == ${a2_err} == ${a3_err} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${a3_err} is NOT ERR_UNAUTHORIZED — an undeclared role value fails authentication, not authorization"
            - "${a4_err} == ERR_UNAUTHENTICATED and no PressLine named PL-Z exists afterwards: GET /press-lines with a valid PlantAdmin header returns total_count 0"

      - name: claim_reported_before_installed_returns_claim_dates_invalid
        claim_type: violation_to_error
        grounds:
          - "validations.V-REQ-4"
          - "errors.ERR_CLAIM_DATES_INVALID"
        distinguishing_aspect: |
          A dedicated 400 for one inter-field date ordering, deliberately distinct from the
          generic ERR_INVALID_REQUEST: both fields are individually well-formed timestamps,
          so only their relative order can be at fault.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
          trigger:
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-BAD-DATES", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: DELAMINATION, claimed_area_sqm: 10.00, installed_on: "2026-08-05T00:00:00Z", reported_on: "2026-08-04T00:00:00Z" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { cd_err: $.data.error_id }
          assert:
            - "${cd_err} == ERR_CLAIM_DATES_INVALID with HTTP 400, not ERR_INVALID_REQUEST"
            - "GET /warranty-claims?batch_id=${batch_a1_id} returns total_count 0"
            - "the same payload with reported_on 2026-08-05T00:00:00Z (equal to installed_on) is accepted, so only the strict `<` ordering is refused"

      - name: every_path_id_not_found_code_is_reachable_from_one_unknown_uuid
        claim_type: violation_to_error
        grounds:
          - "validations.V-EXIST-1"
          - "errors.ERR_DISTRIBUTOR_NOT_FOUND"
          - "errors.ERR_RAW_MATERIAL_NOT_FOUND"
          - "errors.ERR_FORMULATION_NOT_FOUND"
          - "errors.ERR_FORMULATION_COMPONENT_NOT_FOUND"
          - "errors.ERR_DESIGN_LICENSE_NOT_FOUND"
          - "errors.ERR_PRINT_FILM_NOT_FOUND"
          - "errors.ERR_PRODUCT_SKU_NOT_FOUND"
          - "errors.ERR_PRESS_LINE_NOT_FOUND"
          - "errors.ERR_TEST_PANEL_NOT_FOUND"
          - "errors.ERR_PRODUCTION_RUN_NOT_FOUND"
          - "errors.ERR_BATCH_NOT_FOUND"
          - "errors.ERR_ALLOCATION_NOT_FOUND"
          - "errors.ERR_WARRANTY_CLAIM_NOT_FOUND"
        distinguishing_aspect: |
          One syntactically valid but unused UUID addressed at all thirteen collections must
          produce thirteen DISTINCT codes rather than a single generic 404, which is the only
          way to show the per-collection catalog is wired up. The component case additionally
          proves the SECOND path parameter is checked.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *fmin
            - *fminC1
          trigger:
            - call: "GET /distributors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_dist: $.data.error_id }
            - call: "GET /raw-materials/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_rm: $.data.error_id }
            - call: "GET /formulations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_form: $.data.error_id }
            - call: "DELETE /formulations/${f_min_id}/components/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { nf_comp: $.data.error_id }
            - call: "GET /design-licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_lic: $.data.error_id }
            - call: "GET /print-films/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_pf: $.data.error_id }
            - call: "GET /product-skus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_sku: $.data.error_id }
            - call: "GET /press-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_pl: $.data.error_id }
            - call: "GET /test-panels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_tp: $.data.error_id }
            - call: "GET /production-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_run: $.data.error_id }
            - call: "GET /batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_batch: $.data.error_id }
            - call: "GET /allocations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_alloc: $.data.error_id }
            - call: "GET /warranty-claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_claim: $.data.error_id }
          assert:
            - "${nf_dist} == ERR_DISTRIBUTOR_NOT_FOUND, ${nf_rm} == ERR_RAW_MATERIAL_NOT_FOUND, ${nf_form} == ERR_FORMULATION_NOT_FOUND, ${nf_comp} == ERR_FORMULATION_COMPONENT_NOT_FOUND"
            - "${nf_lic} == ERR_DESIGN_LICENSE_NOT_FOUND, ${nf_pf} == ERR_PRINT_FILM_NOT_FOUND, ${nf_sku} == ERR_PRODUCT_SKU_NOT_FOUND, ${nf_pl} == ERR_PRESS_LINE_NOT_FOUND"
            - "${nf_tp} == ERR_TEST_PANEL_NOT_FOUND, ${nf_run} == ERR_PRODUCTION_RUN_NOT_FOUND, ${nf_batch} == ERR_BATCH_NOT_FOUND, ${nf_alloc} == ERR_ALLOCATION_NOT_FOUND, ${nf_claim} == ERR_WARRANTY_CLAIM_NOT_FOUND"
            - "all thirteen carry HTTP 404 and the two-field error envelope; the existing component under ${f_min_id} is untouched, so GET /formulations/${f_min_id}/components still reports total_count 1"

      - name: unknown_body_foreign_keys_return_not_found_not_invalid_request
        claim_type: violation_to_error
        grounds:
          - "validations.V-EXIST-2"
          - "errors.ERR_FORMULATION_NOT_FOUND"
          - "errors.ERR_RAW_MATERIAL_NOT_FOUND"
          - "errors.ERR_DESIGN_LICENSE_NOT_FOUND"
          - "errors.ERR_PRODUCT_SKU_NOT_FOUND"
          - "errors.ERR_PRESS_LINE_NOT_FOUND"
          - "errors.ERR_DISTRIBUTOR_NOT_FOUND"
          - "errors.ERR_BATCH_NOT_FOUND"
        distinguishing_aspect: |
          V-EXIST-2 is a separate rule from V-EXIST-1 and covers foreign keys carried in the
          BODY, including the two optional supersede keys. A dangling body FK must still be a
          404 keyed to the referenced collection even though the payload itself is
          structurally valid, and when two FKs are dangling at once the collection order of
          the endpoint's declared input decides which code wins.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *pl1
          trigger:
            - call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "00000000-0000-4000-8000-000000000000", phr: 10.00 }
              as: Formulator
              as_user_id: "form-001"
              captures: { bf_rm: $.data.error_id }
            - call: "POST /formulations"
              payload: { formulation_code: "F-ORPHAN", supersedes_formulation_id: "00000000-0000-4000-8000-000000000000" }
              as: Formulator
              as_user_id: "form-001"
              captures: { bf_form: $.data.error_id }
            - call: "POST /print-films"
              payload: { design_code: "PF-ORPHAN", license_id: "00000000-0000-4000-8000-000000000000", pattern_repeat_mm_length: 600, pattern_repeat_mm_width: 150, registration_tolerance_mm: 0.25, emboss_plate_code: "EP-X", emboss_alignment_offset_mm: 0.10, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { bf_lic: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-ORPHAN-1", sku_id: "00000000-0000-4000-8000-000000000000", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { bf_sku: $.data.error_id }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-ORPHAN-2", sku_id: "${sku_a_id}", press_line_id: "00000000-0000-4000-8000-000000000000", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 10.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { bf_pl: $.data.error_id }
            - call: "POST /allocations"
              payload: { allocation_code: "ALLOC-ORPHAN", distributor_id: "00000000-0000-4000-8000-000000000000", sku_id: "${sku_a_id}", requested_quantity_sqm: 10.00 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { bf_dist: $.data.error_id }
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-ORPHAN", batch_id: "00000000-0000-4000-8000-000000000000", distributor_id: "00000000-0000-4000-8000-000000000000", claim_type: DELAMINATION, claimed_area_sqm: 10.00, installed_on: "2026-08-05T00:00:00Z", reported_on: "2027-08-05T00:00:00Z" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { bf_batch: $.data.error_id }
          assert:
            - "${bf_rm} == ERR_RAW_MATERIAL_NOT_FOUND, ${bf_form} == ERR_FORMULATION_NOT_FOUND (the optional supersedes key is checked too), ${bf_lic} == ERR_DESIGN_LICENSE_NOT_FOUND"
            - "${bf_sku} == ERR_PRODUCT_SKU_NOT_FOUND and ${bf_pl} == ERR_PRESS_LINE_NOT_FOUND — the same endpoint yields two different codes depending on which FK dangles"
            - "${bf_dist} == ERR_DISTRIBUTOR_NOT_FOUND, and ${bf_batch} == ERR_BATCH_NOT_FOUND for the claim whose batch_id AND distributor_id both dangle, following the endpoint's declared input order"
            - "every one of these is HTTP 404 and none is ERR_INVALID_REQUEST; no row is created by any of the seven calls"

      - name: second_submit_on_a_recipe_under_review_returns_invalid_formulation_state
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-1"
          - "errors.ERR_INVALID_FORMULATION_STATE"
        distinguishing_aspect: |
          The from-set of DRAFT -> UNDER_REVIEW is DRAFT alone, so a repeated submit is a
          409 rather than a no-op; and because the recipe is well-formed, no V-CON-3 or
          V-REF-2 code can mask the lifecycle refusal.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
          trigger:
            - call: "POST /formulations/${f_min_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { fs_err: $.data.error_id }
            - call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_filler_id}", phr: 10.00 }
              as: Formulator
              as_user_id: "form-001"
              captures: { fc_err: $.data.error_id }
          assert:
            - "${fs_err} == ERR_INVALID_FORMULATION_STATE with HTTP 409"
            - "${fc_err} == ERR_INVALID_FORMULATION_STATE too — components may only be added from DRAFT or REJECTED, and this attempt is refused before ERR_RAW_MATERIAL_NOT_FOUND or V-CON-4 could apply"
            - "GET /formulations/${f_min_id} still reports status UNDER_REVIEW and GET /formulations/${f_min_id}/components still reports total_count 2"

      - name: amendment_on_a_suspended_grant_returns_invalid_license_state
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-2"
          - "errors.ERR_INVALID_LICENSE_STATE"
        distinguishing_aspect: |
          An amendment is the one transition that consumes an ACTIVE grant and supersedes it;
          from SUSPENDED it must be refused with the license's own lifecycle code rather than
          with the referential ERR_LICENSE_NOT_ACTIVE, because V-STATE-2 sits four bands
          higher than V-REF-4.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *lic
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: SUSPENDED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { lic_susp: $.data.status }
          trigger:
            - call: "POST /design-licenses/${lic_id}/amendments"
              payload: { license_code: "LIC-OAK-A1", term_volume_cap_sqm: 3000.00, amendment_note: "Cap uplift" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { am_err: $.data.error_id }
          assert:
            - "${lic_susp} == SUSPENDED"
            - "${am_err} == ERR_INVALID_LICENSE_STATE with HTTP 409, NOT ERR_LICENSE_NOT_ACTIVE"
            - "GET /design-licenses?supersedes_license_id=${lic_id} returns total_count 0 and ${lic_id} is still SUSPENDED, not SUPERSEDED"

      - name: results_posted_to_a_voided_panel_return_invalid_panel_state
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-5"
          - "errors.ERR_INVALID_PANEL_STATE"
          - "state_machines.TestPanel IN_TEST -> VOIDED"
        distinguishing_aspect: |
          VOIDED is one of three terminal panel states and must reject results even though the
          test_type is in required_test_types and the panel had already accepted one result.
          A void therefore differs from a fail: it closes the panel without touching the SKU.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - call: "POST /test-panels/${tp_a1_id}/void"
              payload: { void_reason: "Specimen mis-cut, panel abandoned" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_void_status: $.data.status }
          trigger:
            - call: "POST /test-panels/${tp_a1_id}/results"
              payload: { test_type: DIMENSIONAL_STABILITY_HEAT, measured_value: 0.2000 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_err: $.data.error_id }
            - call: "POST /test-panels/${tp_a1_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_err2: $.data.error_id }
          assert:
            - "${tp_void_status} == VOIDED"
            - "${tp_err} == ERR_INVALID_PANEL_STATE with HTTP 409, not ERR_INVALID_REQUEST — DIMENSIONAL_STABILITY_HEAT is a required type for this SKU and has no result yet, so V-CON-10 is satisfied"
            - "${tp_err2} == ERR_INVALID_PANEL_STATE as well: a voided panel cannot be restarted"
            - "GET /product-skus/${sku_a_id} still reports certification_status TESTING — voiding neither passes nor fails the SKU"

      - name: qc_disposition_on_a_running_job_returns_invalid_qc_transition
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-7"
          - "errors.ERR_INVALID_QC_TRANSITION"
        distinguishing_aspect: |
          The QC dimension is guarded by the OTHER dimension's state: with run_status RUNNING
          there are no measurements yet, so the disposition endpoint must refuse with the QC
          code rather than with ERR_INVALID_RUN_STATE or the safety code that would apply once
          the gates existed.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
          trigger:
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: RELEASED }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { qcr_err: $.data.error_id }
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: QUARANTINED }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { qcq_err: $.data.error_id }
          assert:
            - "${qcr_err} == ERR_INVALID_QC_TRANSITION with HTTP 409, NOT ERR_QC_GATES_NOT_MET — the four gate booleans are still null because the run has not completed"
            - "${qcq_err} == ERR_INVALID_QC_TRANSITION as well"
            - "GET /production-runs/${run_a1_id} still reports run_status RUNNING and qc_disposition PENDING, and GET /batches?production_run_id=${run_a1_id} returns total_count 0"

      - name: release_hold_on_an_in_stock_batch_returns_invalid_batch_state
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-8"
          - "errors.ERR_INVALID_BATCH_STATE"
        distinguishing_aspect: |
          RELEASE_HOLD has a from-set of {HELD} only, so calling it on stock that was never
          held is a 409 and not an idempotent success. This is the batch's own-state band,
          which pre-empts both the SoD check on held_by_user_id and the cross-entity QC check.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
          trigger:
            - call: "POST /batches/${batch_a1_id}/hold-status"
              payload: { action: RELEASE_HOLD }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { bh_err: $.data.error_id }
          assert:
            - "${bh_err} == ERR_INVALID_BATCH_STATE with HTTP 409 — the batch is IN_STOCK, not HELD"
            - "no ERR_SEGREGATION_OF_DUTIES is raised even though held_by_user_id is null, and no ERR_RUN_NOT_RELEASED is raised even though the producing run IS released"
            - "GET /batches/${batch_a1_id} still reports status IN_STOCK, available_quantity_sqm 1200.00 and an unchanged version"

      - name: withdrawn_film_and_repeated_available_return_invalid_print_film_state
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-12"
          - "errors.ERR_INVALID_PRINT_FILM_STATE"
          - "state_machines.PrintFilm terminal_states [WITHDRAWN]"
        distinguishing_aspect: |
          Two undeclared edges on one enum: WITHDRAWN is terminal, and the self-loop
          AVAILABLE -> AVAILABLE is deliberately not declared, so re-asserting the current
          status is an error rather than an idempotent success. Both must return the film's
          own code even though the governing licence is perfectly ACTIVE.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *lic
            - *pf1
            - &pfSecond
              call: "POST /print-films"
              payload: { design_code: "PF-SLATE-900B", license_id: "${lic_id}", pattern_repeat_mm_length: 900, pattern_repeat_mm_width: 150, registration_tolerance_mm: 0.30, emboss_plate_code: "EP-SLATE-B", emboss_alignment_offset_mm: 0.05, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf2_id: $.data.id }
            - call: "POST /print-films/${pf1_id}/status"
              payload: { to_status: WITHDRAWN }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf1_withdrawn: $.data.status }
          trigger:
            - call: "POST /print-films/${pf1_id}/status"
              payload: { to_status: AVAILABLE }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pfw_err: $.data.error_id }
            - call: "POST /print-films/${pf2_id}/status"
              payload: { to_status: AVAILABLE }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pfa_err: $.data.error_id }
          assert:
            - "${pf1_withdrawn} == WITHDRAWN"
            - "${pfw_err} == ERR_INVALID_PRINT_FILM_STATE with HTTP 409 — WITHDRAWN accepts nothing further"
            - "${pfa_err} == ERR_INVALID_PRINT_FILM_STATE for the undeclared AVAILABLE -> AVAILABLE self-loop on ${pf2_id}"
            - "neither call is an ERR_LICENSE_NOT_ACTIVE: the grant behind both films is ACTIVE, which is exactly why the second clause of V-STATE-12 does not fire here"

      - name: adjudicating_an_untriaged_claim_returns_invalid_claim_state
        claim_type: violation_to_error
        grounds:
          - "validations.V-STATE-10"
          - "errors.ERR_INVALID_CLAIM_STATE"
        distinguishing_aspect: |
          required_reviews is set at triage, so adjudicating straight from SUBMITTED must be
          refused by the lifecycle rule and never by ERR_REVIEW_OUTCOME_CONFLICT over an empty
          review set. Posting a review before triage is refused the same way.
        test_recipe:
          setup_api_calls:
            - *clock0
