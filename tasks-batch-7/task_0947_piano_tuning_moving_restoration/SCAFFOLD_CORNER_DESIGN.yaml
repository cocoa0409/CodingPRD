            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "TUNE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q1: "$.data.id" }
            - call: "POST /quotes/${q1}/issue"
              payload: {}
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v2: "$.data.version" }
          trigger:
            - call: "POST /quotes/${q1}/reissue"
              payload: { expected_instrument_version: "${inst_v2}" }
              as: ShopManager
              captures: { q2: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Quote.${q1}.status == SUPERSEDED"
            - "Quote.${q2}.status == DRAFT and version_number == 2"
            - "Quote.${q2}.supersedes_quote_id == ${q1}"
            - "Quote.${q2}.total_cents == 19500"
            - "GET /quotes with supersedes_quote_id=${q1} returns exactly 1 row, ${q2}"

