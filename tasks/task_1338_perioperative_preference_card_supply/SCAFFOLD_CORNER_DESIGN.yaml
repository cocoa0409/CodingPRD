            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 1, designation: "HOLD" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CARD_NOT_DRAFT (http 409); the ACTIVE card is immutable — still exactly 1 line"
