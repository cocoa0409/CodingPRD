  # ==========================================================================
  # Rule 4 — transitive_cascade (two different triggers; depth >=3 and >=2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: booking_cancel_cascade_depth3
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Submission.transitions
          - state_machines.Role.transitions
        distinguishing_aspect: |
          Depth-3 chain from a single cancel trigger: Booking(CONFIRMED->CANCELLED)
          mutates DealMemo (penalty) [depth1]; the same booking mutation causes
          Submission BOOKED->NOT_BOOKED [depth2]; the submission's change causes
          Role CAST->OPEN [depth3]. Each hop is caused by the previous entity's
          mutation, not a parallel fan-out, and originates at the cancel trigger.
        test_recipe:
          setup:
            - "CONFIRMED booking on a CAST role; clock at 2026-08-13 (25% penalty tier)"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "CascP", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "CascR", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "CascT", date_of_birth: "1990-01-01T00:00:00Z", union_status: "UNION_MEMBER" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 4, location: "Studio 1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { appt_id: $.data.id }
            - call: "POST /casting/appointments/${appt_id}/confirm"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T13:00:00Z" }
              as: CastingDirector
            - call: "POST /casting/appointments/${appt_id}/complete"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/offers"
              payload: { weekly_rate_cents: 1000000, guarantee_cents: 800000, expires_at: "2026-08-10T00:00:00Z" }
              as: CastingDirector
              captures: { offer_id: $.data.id }
            - call: "POST /casting/offers/${offer_id}/accept"
              payload: { engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z", proration_mode: "CALENDAR_SPAN" }
              as: CastingDirector
              captures: { memo_id: $.data.id }
            - call: "POST /casting/bookings"
              payload: { submission_id: "${sub_id}", deal_memo_id: "${memo_id}" }
              as: ProductionCoordinator
              captures: { booking_id: $.data.id }
            - call: "POST /casting/bookings/${booking_id}/confirm"
              payload: {}
              as: ProductionCoordinator
            - call: "POST /casting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: CastingDirector
          trigger:
