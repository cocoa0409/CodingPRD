            - { call: "GET /awards", payload: {}, as: Organizer }
          assert:
            - "ScoreSheet.${s2}.sheet_total == 49.3 (raw 49.25 rounded per-sheet to 1 decimal, half-up)"
            - "GET /awards?event_id=${ev} place-1 CLASS_PLACE row: winner_score == 51.87"
            - "51.87 != 51.83 which the unpinned round-once order (avg of 55.0/49.25/51.25) would produce"

      - name: weather_cancel_pro_rata_two_pass
        grounds:
          - calculations.weather_refund_calc
          - entities.Event.fields.treasury_cents
          - state_machines.Event.weather_posture_in_NORMAL_WATCH_POSTPONED_to_CANCELLED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: each cancellation refund draws from the same
          treasury the refunds deplete, so the scaffold pins a two-pass order — policy refunds
          (100% of gross paid) computed against the pre-batch treasury snapshot 5625, then
          floor-scaled with the 1-cent remainder going to the earliest-created registration:
          2813 to the earlier, 2812 to the later.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; three non-member registrants N1/N2/N3 each registered and paid 3000 (treasury 9000); N1 created before N2 before N3 (created_at ASC)"
            - "POSTPONED goodwill round: 750 refunded to each (treasury 6750); posture resumed to NORMAL"
