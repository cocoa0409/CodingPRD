          assert:
            - "before the first trigger: DisplacedStudent.${stu_id}.projection_variant == CONSERVATIVE_ADVISED_LOAD, projected_terms_remaining == 4, projected_completion_term_index == 7, at_risk == true, required_seat_count == 4"
            - "before the first trigger: TeachOutPlan.${plan_id}.guaranteed_seat_total == 3, required_seat_total == 4, seat_shortfall == 1, at_risk_student_count == 1 — both APPROVE gates are violated"
            - "the first trigger returns 422 with data.error_id == ERR_COURSE_GUARANTEE_SHORTFALL, not ERR_AT_RISK_STUDENTS_PRESENT"
            - "the second trigger returns 201 and TeachOutPlan.${plan_id}.guaranteed_seat_total == 4 with seat_shortfall == 0, while at_risk_student_count is still 1"
            - "the third trigger returns 422 with data.error_id == ERR_AT_RISK_STUDENTS_PRESENT — the lower-priority gate becomes visible only once the higher one is satisfied"
            - "TeachOutPlan.${plan_id}.state == SUBMITTED and approved_at == null after both refusals"

      - name: addendum_requests_are_bounded_at_two_rounds
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_ADDENDUM_LIMIT_REACHED]
          - state_machines.ReviewCycle.ADDENDUM_REQUESTED_to_REPORT_RECEIVED
          - entities.ReviewCycle.fields.addendum_round
        distinguishing_aspect: |
          The cycle may loop REPORT_RECEIVED -> ADDENDUM_REQUESTED ->
          REPORT_RECEIVED exactly twice; the third dispute is refused on the
          counter, not on the cycle state, and the department can still exit the
          loop with a CONCUR response afterwards. Each addendum report also
          takes the next sequence_number rather than replacing the first.
        test_recipe:
          setup:
            - "Program HIST-BA carried to REPORT_RECEIVED with report 1 filing finding_codes [F-ENROLL, F-COST]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
