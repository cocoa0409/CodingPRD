    description: "List exit scorecards across seasons; season_id and review_type narrow the set, generated_at ASC"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: ["season_id?", "review_type?", "limit?", "offset?"]
    output: SeasonExitReview[]
    side_effects: []
  - method: GET
    path: "/exit-reviews/{exit_review_id}"
    description: "Fetch one exit scorecard with its margin, unit and variance fields"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: []
    output: SeasonExitReview
    side_effects: []

  # ---- Reads: price zones and stores ---------------------------------------
  - method: GET
    path: "/price-zones"
    description: "List price zones; parent_zone_id filters to the children of one zone"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
