      - name: corner_ep_absorb_returns_a_garment_unit_not_a_trade_in_item
        claim_type: Cross-reference link
        grounds: ["endpoints.POST_/kidswear/trade-in-items/{trade_in_item_id}/absorb"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / box_item_fulfillment_and_settlement_axes_advance_independently
          rationale: "The absorb endpoint's GarmentUnit response shape and its ownership-transfer side effects are asserted by corner_sm_trade_in_absorption_transfers_ownership_into_rental_stock; only the response entity type would be re-tested here."

  # =====================================================================
  # SECTION: errors
  # =====================================================================
  - section: errors
    instances:

      - name: corner_err_missing_user_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request carrying no X-User-Role or X-User-ID returns ERR_UNAUTHENTICATED with HTTP 401 at rung 1, before existence or role checks."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /kidswear/plans"
              payload: {}
              as: ""
              captures: { err_x_auth: $.data.error_id }
          assert:
            - "the trigger returns HTTP 401"
            - "the captured err_x_auth equals ERR_UNAUTHENTICATED"

      - name: corner_err_unknown_role_header_is_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNKNOWN_ROLE]", "validations[priority=2]"]
        distinguishing_aspect: "An X-User-Role of Courier is not one of the eight declared roles and returns ERR_UNKNOWN_ROLE with HTTP 401 at rung 2, distinct from the 403 a known-but-unpermitted role would get."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /kidswear/plans"
              payload: {}
              as: Courier
              captures: { err_x_role: $.data.error_id }
          assert:
            - "the trigger returns HTTP 401"
            - "the captured err_x_role equals ERR_UNKNOWN_ROLE"

      - name: corner_err_plan_not_found_on_member_registration
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_NOT_FOUND]", "entities.Member.fields.plan_id"]
        distinguishing_aspect: "Registering against an unknown plan_id returns ERR_PLAN_NOT_FOUND with HTTP 404, a different code from the ERR_MEMBER_NOT_FOUND raised for an unknown member id."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", email: "ghost@kidswear.test", display_name: "Ghost", child_size_code: "5" }
              as: PlatformAdmin
              captures: { err_x_plan: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "the captured err_x_plan equals ERR_PLAN_NOT_FOUND"

      - name: corner_err_registration_on_a_retired_plan_is_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_RETIRED]", "entities.Plan.fields.status", "endpoints.PATCH_/kidswear/plans/{plan_id}"]
        distinguishing_aspect: "A plan patched to RETIRED can no longer take new members: registration returns ERR_PLAN_RETIRED with HTTP 409, while existing members on that plan are untouched."
        test_recipe:
          setup: ["One plan that has been patched to status RETIRED after an existing member joined it."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { x_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${x_plan}", email: "incumbent@kidswear.test", display_name: "Incumbent", child_size_code: "5" }
              as: PlatformAdmin
              captures: { x_incumbent: $.data.id }
            - call: "PATCH /kidswear/plans/${x_plan}"
              payload: { status: "RETIRED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${x_plan}", email: "latecomer@kidswear.test", display_name: "Latecomer", child_size_code: "5" }
              as: PlatformAdmin
              captures: { err_x_retired: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_x_retired equals ERR_PLAN_RETIRED"
            - "Plan.${x_plan}.status == RETIRED"
            - "Member.${x_incumbent}.status == PENDING"

      - name: corner_err_unit_acquired_against_a_discontinued_style_is_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_STYLE_DISCONTINUED]", "entities.GarmentStyle.fields.status"]
        distinguishing_aspect: "After a style is patched to DISCONTINUED, acquiring a further unit returns ERR_STYLE_DISCONTINUED with HTTP 409 and leaves units_ever_acquired at its prior value of 1."
        test_recipe:
          setup: ["One style with one acquired unit, patched to DISCONTINUED."]
          setup_api_calls:
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-X-DISC", name: "Discontinued Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { x_st: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${x_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { x_u: $.data.id }
            - call: "PATCH /kidswear/garment-styles/${x_st}"
              payload: { status: "DISCONTINUED" }
              as: MerchandisePlanner
          trigger:
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${x_st}", acquired_at: "2026-03-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { err_x_disc: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_x_disc equals ERR_STYLE_DISCONTINUED"
            - "GarmentStyle.${x_st}.units_ever_acquired == 1"

      - name: corner_err_grader_cannot_confirm_their_own_assessment
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=5]", "entities.ConditionAssessment.fields.graded_by_user_id"]
        distinguishing_aspect: "Rung 5 compares the confirming X-User-ID with graded_by_user_id: confirming under the same operator id returns ERR_SEGREGATION_OF_DUTIES with HTTP 403 even though MerchandisePlanner is a permitted role for the endpoint."
        test_recipe:
          setup: ["A received trade-in item whose assessment was submitted at grade B by operator shared-op-1."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { x_sod_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${x_sod_plan}", email: "sod@kidswear.test", display_name: "SoD Household", child_size_code: "6" }
              as: PlatformAdmin
              captures: { x_sod_m: $.data.id }
            - call: "POST /kidswear/members/${x_sod_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/trade-in-submissions"
              payload: { member_id: "${x_sod_m}", declared_item_count: 3 }
              as: Member
              as_user_id: "${x_sod_m}"
              captures: { x_sod_sub: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${x_sod_sub}/items"
              payload: { declared_brand_tier: "STANDARD", declared_size_code: "6" }
              as: Member
              as_user_id: "${x_sod_m}"
              captures: { x_sod_i1: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${x_sod_sub}/items"
              payload: { declared_brand_tier: "STANDARD", declared_size_code: "6" }
              as: Member
              as_user_id: "${x_sod_m}"
              captures: { x_sod_i2: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${x_sod_sub}/items"
              payload: { declared_brand_tier: "STANDARD", declared_size_code: "6" }
              as: Member
              as_user_id: "${x_sod_m}"
              captures: { x_sod_i3: $.data.id }
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${x_sod_m}", direction: "TRADE_IN_INBOUND" }
              as: LogisticsCoordinator
              captures: { x_sod_lbl: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${x_sod_sub}/issue-label"
              payload: { label_id: "${x_sod_lbl}" }
              as: LogisticsCoordinator
              captures: { x_sod_shp: $.data.inbound_shipment_id }
            - call: "POST /kidswear/shipments/${x_sod_shp}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${x_sod_shp}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${x_sod_i1}" }
              as: GradingTechnician
              as_user_id: "shared-op-1"
              captures: { x_sod_ca: $.data.id }
            - call: "POST /kidswear/condition-assessments/${x_sod_ca}/submit"
              payload: { grade: "B" }
              as: GradingTechnician
              as_user_id: "shared-op-1"
          trigger:
            - call: "POST /kidswear/condition-assessments/${x_sod_ca}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "shared-op-1"
              captures: { err_x_sod: $.data.error_id }
          assert:
            - "the trigger returns HTTP 403"
            - "the captured err_x_sod equals ERR_SEGREGATION_OF_DUTIES"
            - "ConditionAssessment.${x_sod_ca}.status == SUBMITTED"
            - "ConditionAssessment.${x_sod_ca}.confirmed_by_user_id is null"
            - "TradeInItem.${x_sod_i1}.grading_status == PENDING"

      - name: corner_err_assessment_pipeline_and_target_disagree
        claim_type: violation_to_error
        grounds: ["errors[ERR_PIPELINE_MISMATCH]", "entities.ConditionAssessment.fields.pipeline"]
        distinguishing_aspect: "Opening a RENTAL-pipeline assessment while supplying a trade_in_item_id returns ERR_PIPELINE_MISMATCH with HTTP 409, distinct from the ERR_ASSESSMENT_TARGET_MISMATCH raised when neither target is supplied."
