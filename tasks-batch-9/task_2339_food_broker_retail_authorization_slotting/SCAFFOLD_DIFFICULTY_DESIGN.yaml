            - "The posting closes the deal: SlottingDeal.${deal}.state == RECOVERED and Authorization.${auth}.settlement_state == SLOTTING_RECOVERED; void_rate_bps == 0 so authorization_state stays AUTHORIZED and no RECOVERY_HOLD is ever entered"
            - "Principal.${prin}.open_slotting_liability_cents == 0 and liability_ratio_bps == 0 after the posting, while slotting_committed_cents stays 5125000"
            - "After the reversal: DistributionSnapshot.${rev_entry}.entry_kind == REVERSAL with reverses_snapshot_id == ${snap1} and amortized_amount_cents == -5125000; DistributionSnapshot.${snap1}.is_reversed == true and its amortized_amount_cents is still +5125000 (the ledger is append-only and the reversed row is never rewritten)"
            - "Reversal restores exactly: recovered_cents == 0, unamortized_balance_cents == 5125000, periods_posted == 0, state == AMORTIZING, Authorization.${auth}.settlement_state == SLOTTING_AMORTIZING, periods_reported == 0, and Principal.${prin}.open_slotting_liability_cents == 5125000 with liability_ratio_bps == 2562 — zero drift"
            - "Ledger sum check: the signed sum of amortized_amount_cents over all entries for ${auth} equals recovered_cents at every step (5125000 then 0)"

      - name: store_counts_conserved_across_reported_basis_posting_and_reversal
        grounds:
          - calculations.void_rate
          - entities.Authorization.fields.pending_store_count
          - entities.DistributionSnapshot.fields.entry_kind
          - endpoints.POST_/distribution-snapshots/{snapshotId}/reverse.side_effects
          - entities.Retailer.fields.void_rate_basis_default
        distinguishing_aspect: |
          Conserved quantity = STORE COUNTS, not money:
          authorized_store_count == distributed_store_count + void_store_count +
          pending_store_count must hold after every posting and after the
          reversal, under REPORTED_BASIS where void is measured against the
          REPORTED store count and the unreported remainder lands in
          pending_store_count. Reversing the second posting must restore the
          first posting's counters exactly — including periods_reported and the
          derived void_rate_bps, which is recomputed from the new latest live
          POSTING rather than decremented. The sibling instance conserves money
          across the same ledger.
        test_recipe:
          setup:
            - "Retailer BIGMART with void_rate_basis_default REPORTED_BASIS and at_risk_void_rate_bps 1500; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement; one VALIDATED item."
            - "Review DECIDED at 2026-09-02 with default_store_count 400 and no slotting deal, so the Authorization auto-advances PENDING_SETUP→AUTHORIZED in the same request and stays settlement_state UNBILLED with authorized_store_count 400, distributed 0, void 0, pending 400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
