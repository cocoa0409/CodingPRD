            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
