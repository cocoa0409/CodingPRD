            - { call: "POST /disposition/bidders/${bidr_id}/grant_access", payload: { window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-12T00:00:00Z" }, as: Broker, as_user_id: broker-1, captures: { g3_err: $.data.error_id } }
