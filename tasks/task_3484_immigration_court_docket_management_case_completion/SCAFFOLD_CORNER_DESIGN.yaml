              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err1: $.data.error_id }
            - *c_assign
            - *c_master
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v3: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-04T10:00:00Z", expected_case_version: "${case_v3}" }
