            - "SlottingDeal.${deal}.last_offer_side == RETAILER, so BrokerAccountManager is the permitted acceptor and RetailerBuyer would have been rejected with ERR_ACCEPT_BY_OFFEROR"
            - "SlottingDeal.${deal}.current_fee_per_store_cents == 58000 and gross_fee_cents == 5800000, volume_credit_cents == 0, net_before_admin_cents == 5800000, admin_fee_cents == 87000 (150 bps tier), accepted_fee_cents == 5887000"
            - "SlottingDeal.${deal}.cost_per_forecast_unit_cents == null (forecast_annual_units == 0)"
            - "SlottingDeal.${deal}.state == AMORTIZING (ACCEPTED is traversed and left inside the same request) and unamortized_balance_cents == 5887000, recovered_cents == 0"
