            - "Complaint.${cmp}.status == SUBSTANTIATED"

      - name: reinstate_while_risk_at_threshold_returns_risk_threshold_block
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_RISK_THRESHOLD_BLOCK]"
          - state_machines.Notary.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Reinstating a SUSPENDED notary whose risk_score is still >= 50 (auto-suspended by a FRAUD x2 = 80) returns ERR_RISK_THRESHOLD_BLOCK."
        test_recipe:
          setup: ["Notary auto-SUSPENDED via two FRAUD substantiations (risk_score 80 >= 50)"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Rein N", email: "rein@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /complaints"
              payload: { notary_id: "${nota}", category: "FRAUD" }
              as: CommissionAuthority
              as_user_id: "auditor-8"
              captures: { c1: $.data.id }
            - call: "POST /complaints/${c1}/open-review"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-8"
            - call: "POST /complaints/${c1}/substantiate"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-8"
            - call: "POST /complaints"
              payload: { notary_id: "${nota}", category: "FRAUD" }
              as: CommissionAuthority
              as_user_id: "auditor-8"
              captures: { c2: $.data.id }
            - call: "POST /complaints/${c2}/open-review"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-8"
            - call: "POST /complaints/${c2}/substantiate"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-8"
          trigger:
            - call: "POST /notaries/${nota}/reinstate"
              payload: {}
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "Notary.${nota}.risk_score == 80"
            - "Notary.${nota}.status == SUSPENDED"
            - "trigger response error_id == ERR_RISK_THRESHOLD_BLOCK"

