scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: dual_variant_calc — two valid algorithms, different results,
  #         on different entity domains.
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: offer_total_comp_provisional_vs_ratified
        grounds:
          - calculations.offer_total_comp
          - state_machines.Offer.PENDING_APPROVAL_to_APPROVED
          - state_machines.Offer.NEGOTIATING_to_PENDING_APPROVAL
          - entities.Offer.fields.total_first_year_comp_cents
        distinguishing_aspect: |
          Same input fields (base_salary_cents, sign_on_bonus_cents,
          annual_equity_cents) produce two different total_first_year_comp_cents
          values depending on the variant. The "provisional" variant recomputes
          live on PATCH and exposes the new value via GET /offers/{id}; the
          "ratified" variant, frozen at the moment Offer first reaches APPROVED,
          must NOT change when the underlying inputs are touched afterwards
          (and indeed all such PATCH attempts are rejected with
          ERR_OFFER_FIELDS_IMMUTABLE). This is the cost-accounting domain on
          Offer.
        test_recipe:
          setup:
            - "Create Recruiter R, HiringManager HM (budget 50_000_000 cents), Compensation C (opaque)"
            - "Create Requisition with seniority_level=SENIOR, headcount=1, budget_cents=10_000_000; submit + approve to OPEN"
            - "Create Candidate K (source=DIRECT), Application A, advance A through SCREENING→INTERVIEWING→OFFER_STAGE with one COMPLETED interview + STRONG_HIRE feedback"
            - "Create Offer with base_salary_cents=150_000, sign_on_bonus_cents=150_050, annual_equity_cents=150_050 plus a single OfferApprovalStep(step_order=1, approver_role=HIRING_MANAGER, required_approver_id=HM.id)"
            - "Order a BackgroundCheck on the Offer; report PASS"
          trigger:
            - "POST /offers/{id}/submit  (Offer→PENDING_APPROVAL — provisional total readable)"
            - "POST /offers/{id}/approve {step_order:1}  (Offer→APPROVED — ratifies the comp value)"
            - "POST /offers/{id}/request-revision is NOT triggered — instead PATCH /offers/{id} {sign_on_bonus_cents: 999_999, version: <current>} attempted on APPROVED"
          assert:
            - "After submit, GET /offers/{id}.total_first_year_comp_cents == 450200  # per-component round_half_up then sum: 150000 + 150100 + 150100"
            - "After approve, GET /offers/{id}.total_first_year_comp_cents == 450200 and status == APPROVED"
            - "PATCH on APPROVED with new sign_on_bonus_cents returns 422 ERR_OFFER_FIELDS_IMMUTABLE; the ratified total remains 450200"

      - name: diversity_goal_realized_vs_projected
        grounds:
          - calculations.diversity_goal_progress
          - entities.DiversityGoal.fields.realized_percentage
          - entities.DiversityGoal.fields.projected_percentage
          - state_machines.Application.INTERVIEWING_to_OFFER_STAGE
          - state_machines.Application.OFFER_STAGE_to_HIRED
        distinguishing_aspect: |
          Same Applications produce different DiversityGoal percentages
          depending on which denominator the variant uses. Realized counts only
          stage==HIRED; projected also counts APPLIED/SCREENING/INTERVIEWING/
          OFFER_STAGE. This is the compliance/OFCCP domain on DiversityGoal —
          a different entity (and a different functional domain) from instance #1.
        test_recipe:
          setup:
            - "Create DiversityGoal G(department_code=ENG, period_year=2026, target_protected_class_percentage=50.0)"
            - "Create Recruiter R, HM, two requisitions Req1 and Req2 both tied to G, headcount=1 each, budget enough"
            - "Approve both requisitions to OPEN"
            - "Create Candidate K1 (is_in_eeo_protected_class=true, EEORecord attached) and Candidate K2 (is_in_eeo_protected_class=false)"
            - "Create Application A1=(Req1, K1), advance fully and Offer→ACCEPTED so A1 reaches HIRED"
            - "Create Application A2=(Req2, K2) and leave it in APPLIED"
          trigger:
            - "GET /diversity-goals/{G.id}"
          assert:
            - "data.realized_percentage == 100.00  # denominator = {A1}, protected/total = 1/1"
            - "data.projected_percentage == 50.00  # denominator = {A1 HIRED, A2 APPLIED}, protected/total = 1/2"
            - "data.realized_percentage != data.projected_percentage"

  # =========================================================================
  # Rule 2: combinatorial_formula — at least two instances in DIFFERENT modes
  #         from {(a) ≥3-input non-linear, (b) nested rounding-order,
  #               (c) circular evaluation-order}.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: referral_bonus_three_input_nonlinear   # mode (a)
        grounds:
          - calculations.referral_bonus_amount
          - entities.ReferralBonus.fields.base_amount_cents
          - entities.ReferralBonus.fields.diversity_uplift_cents
          - entities.ReferralBonus.fields.total_amount_cents
          - entities.Requisition.fields.target_diversity_goal_id
        distinguishing_aspect: |
          Three inputs interact non-linearly: Requisition.seniority_level
          picks the base tier; Candidate.is_in_eeo_protected_class flips uplift
          on/off; Requisition.target_diversity_goal_id (presence) raises the
          uplift cap from 200_000 to 400_000 cents. The cap interaction is
          nested inside the uplift step, so the formula is NOT a linear sum.
        test_recipe:
          setup:
            - "Create Recruiter R, HM with budget 100_000_000 cents"
            - "Create DiversityGoal G(ENG, 2026, 30.0)"
            - "Create Requisition Req_noGoal(seniority_level=SENIOR, target_diversity_goal_id=null, headcount=1, budget 50_000_000)"
            - "Create Requisition Req_withGoal(seniority_level=SENIOR, target_diversity_goal_id=G.id, headcount=1, budget 50_000_000)"
            - "Approve both to OPEN"
            - "Create Candidate K_protected(source=REFERRAL, referrer_employee_id=R.id, is_in_eeo_protected_class=true) with EEORecord"
            - "Create Application A_noGoal=(Req_noGoal, K_protected); fully advance and ACCEPT Offer so A_noGoal→HIRED"
            - "Create a second Candidate K_principal(source=REFERRAL, referrer_employee_id=R.id, is_in_eeo_protected_class=true) with EEORecord"
            - "Promote Req_withGoal to use seniority_level=PRINCIPAL via PATCH while still in DRAFT (re-approve)"
            - "Create Application A_withGoal=(Req_withGoal, K_principal); fully advance and ACCEPT Offer so A_withGoal→HIRED"
          trigger:
            - "GET /referral-bonuses?candidate_id=K_protected.id"
            - "GET /referral-bonuses?candidate_id=K_principal.id"
          assert:
            - "ReferralBonus(K_protected).base_amount_cents == 500000  # SENIOR tier"
            - "ReferralBonus(K_protected).diversity_uplift_cents == 200000  # no goal → cap 200000 caps the 250000 raw uplift"
            - "ReferralBonus(K_protected).total_amount_cents == 700000"
            - "ReferralBonus(K_principal).base_amount_cents == 1000000  # PRINCIPAL tier"
            - "ReferralBonus(K_principal).diversity_uplift_cents == 400000  # goal tied → cap 400000 caps the 500000 raw uplift"
            - "ReferralBonus(K_principal).total_amount_cents == 1400000"

      - name: offer_total_comp_rounding_order        # mode (b)
        grounds:
          - calculations.offer_total_comp
          - entities.Offer.fields.base_salary_cents
          - entities.Offer.fields.sign_on_bonus_cents
          - entities.Offer.fields.annual_equity_cents
          - entities.Offer.fields.total_first_year_comp_cents
        distinguishing_aspect: |
          The pinned rounding order is "round each component to whole dollars
          first, then sum". The alternative ("sum cents first, then round to
          whole dollars at the end") gives a different total. The scaffold pins
          per-component-then-sum explicitly.
        test_recipe:
          setup:
            - "Create Recruiter R, HM (budget 50_000_000), Requisition req(SENIOR, headcount=1, budget 5_000_000) approved to OPEN"
            - "Create Candidate K(DIRECT), Application A advanced through to OFFER_STAGE with COMPLETED interview + STRONG_HIRE feedback"
            - "Create Offer with base_salary_cents=150_000, sign_on_bonus_cents=150_050, annual_equity_cents=150_050, one OfferApprovalStep"
          trigger:
            - "GET /offers/{id}  (returns total_first_year_comp_cents)"
          assert:
            - "data.total_first_year_comp_cents == 450200  # per-component round_half_up: 150000 + 150100 + 150100"
            - "data.total_first_year_comp_cents != 450100  # 450100 would be sum-then-round (the WRONG order)"

  # =========================================================================
  # Rule 3: non_linear_state_machine — two non-linear shapes on different
  #         entities (cycle, parallel dimensions, or fork-join branching).
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_renegotiation_cycle
        grounds:
          - state_machines.Offer.PENDING_APPROVAL_to_NEGOTIATING
          - state_machines.Offer.NEGOTIATING_to_PENDING_APPROVAL
          - entities.Offer.fields.negotiation_round
          - entities.OfferApprovalStep.fields.decision
        distinguishing_aspect: |
          Offer has a true cycle: PENDING_APPROVAL → NEGOTIATING →
          PENDING_APPROVAL on each renegotiation round, with
          Offer.negotiation_round incrementing and every OfferApprovalStep
          decision reset to PENDING. This is a cycle on entity Offer.
        test_recipe:
          setup:
            - "Provision an Offer in PENDING_APPROVAL with TWO OfferApprovalSteps (HIRING_MANAGER then COMPENSATION)"
            - "Background check PASSED"
          trigger:
            - "POST /offers/{id}/request-revision {step_order:1}  → Offer NEGOTIATING (round 0)"
            - "PATCH /offers/{id} {sign_on_bonus_cents: 0, version: <current>}  → Offer PENDING_APPROVAL (round 1)"
            - "POST /offers/{id}/request-revision {step_order:1}  → Offer NEGOTIATING again"
            - "PATCH /offers/{id} {sign_on_bonus_cents: 100, version: <current>} → Offer PENDING_APPROVAL (round 2)"
          assert:
            - "Final Offer.status == PENDING_APPROVAL"
            - "Final Offer.negotiation_round == 2"
            - "Every OfferApprovalStep.decision == PENDING, decided_at == null"

      - name: application_compound_state_from_children
        grounds:
          - state_machines.Application.INTERVIEWING_to_OFFER_STAGE
          - state_machines.Application.OFFER_STAGE_to_HIRED
          - state_machines.Application.OFFER_STAGE_to_REJECTED
          - state_machines.Interview.SCHEDULED_to_COMPLETED
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.Offer.EXTENDED_to_DECLINED
        distinguishing_aspect: |
          Application's transitions are compound — they depend on aggregate
          state of children. INTERVIEWING→OFFER_STAGE requires at least one
          Interview.status==COMPLETED + qualifying feedback; OFFER_STAGE→HIRED
          requires linked Offer.status==ACCEPTED; OFFER_STAGE→REJECTED can
          fire from Offer.DECLINED/RESCINDED/EXPIRED. The same Application
          row reacts to children's states. This is on entity Application,
          different from Offer's cycle.
        test_recipe:
          setup:
            - "Create R, HM, Req(headcount=1) approved to OPEN, Candidate K (DIRECT, no protected class), Application A in INTERVIEWING"
            - "Schedule Interview I, complete it after clock advance, submit STRONG_HIRE feedback"
          trigger:
            - "POST /applications/{A.id}/advance  → A.stage OFFER_STAGE  (uses children: Interview COMPLETED + qualifying feedback)"
            - "Create + submit + approve Offer (single HIRING_MANAGER step), order BG check, report PASS, extend, /accept"
          assert:
            - "After offer extend: A.stage == OFFER_STAGE  (parent waits on child Offer)"
            - "After offer accept: A.stage == HIRED  (compound transition driven by Offer→ACCEPTED)"
            - "If a sibling test path were to /decline the Offer instead, A.stage transitions to REJECTED with rejection_reason==OFFER_DECLINED  (same parent reacts to a different child terminal state)"

  # =========================================================================
  # Rule 4: transitive_cascade — at least one chain depth ≥3 and another ≥2,
  #         each link CAUSED by the previous link (not fan-out).
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: hire_chain_depth3
        grounds:
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.Application.OFFER_STAGE_to_HIRED
          - state_machines.Requisition.OPEN_to_CLOSED
          - state_machines.Application.SCREENING_to_REJECTED
          - state_machines.Application.INTERVIEWING_to_REJECTED
          - state_machines.Application.APPLIED_to_REJECTED
          - entities.Requisition.fields.filled_count
        distinguishing_aspect: |
          POST /offers/{id}/accept (Offer→ACCEPTED) triggers Application→HIRED.
          Application→HIRED side-effect increments Requisition.filled_count,
          and when filled_count == headcount that DRIVES Requisition→CLOSED.
          Requisition→CLOSED then drives all sibling non-terminal Applications
          to REJECTED. Depth ≥ 3 from a single trigger; each hop is CAUSED by
          the prior hop, not by the original /accept call.
        test_recipe:
          setup:
            - "Provision Req with headcount=1, two Applications A_hire and A_other; advance A_hire to OFFER_STAGE with a PASSED bg check; leave A_other in INTERVIEWING"
            - "Create + approve + extend Offer for A_hire"
          trigger:
            - "POST /offers/{Offer.id}/accept"
          assert:
            - "Offer.status == ACCEPTED"
            - "A_hire.stage == HIRED  (hop 1, caused by Offer.ACCEPTED)"
            - "Requisition.filled_count == 1 and Requisition.status == CLOSED  (hop 2, caused by Application.HIRED bubbling up)"
            - "A_other.stage == REJECTED with rejection_reason == OTHER  (hop 3, caused by Requisition.CLOSED, NOT by /accept)"

      - name: bg_fail_chain_depth3
        grounds:
          - state_machines.BackgroundCheck.PENDING_to_FAILED
          - state_machines.Offer.ACCEPTED_to_RESCINDED
          - state_machines.Application.HIRED_to_REJECTED
          - state_machines.ReferralBonus.ACCRUED_to_CLAWED_BACK
          - state_machines.ReferralBonus.PAYABLE_to_CLAWED_BACK
        distinguishing_aspect: |
          POST /background-checks/{id}/report-result with outcome=FAIL on a
          Background Check whose Offer is already ACCEPTED triggers
          Offer→RESCINDED, which in turn triggers Application HIRED→REJECTED,
          which in turn forces the ReferralBonus to CLAWED_BACK and decrements
          Requisition.filled_count (potentially reopening it). Different
          trigger entity than hire_chain_depth3, depth ≥ 3.
        test_recipe:
          setup:
            - "Provision Req(headcount=1), referral Candidate K (REFERRAL, referrer_employee_id=Recruiter.id, is_in_eeo_protected_class=true with EEORecord)"
            - "Drive A through HIRED via Offer ACCEPTED; verify ReferralBonus exists with status ACCRUED"
          trigger:
            - "POST /background-checks/{BGC.id}/report-result {outcome: FAIL}"
          assert:
            - "BGC.status == FAILED"
            - "Offer.status == RESCINDED  (hop 1)"
            - "Application.stage == REJECTED with rejection_reason == FAILED_BACKGROUND_CHECK  (hop 2)"
            - "Requisition.filled_count == 0 and Requisition.status == OPEN  (hop 3, requisition reopened)"
            - "ReferralBonus.status == CLAWED_BACK  (hop 3 sibling)"

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict — at least two conflicts whose
  #         error-category pairs are DIFFERENT.
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_eeo_missing_on_advance
        grounds:
          - validations[priority=5]                   # state precondition: Application.stage==INTERVIEWING
          - validations[priority=7]                   # business_safety: EEORecord required for protected candidate
        distinguishing_aspect: |
          A single dual-failure scenario fails both priority 5
          (Application is in wrong stage to /advance) AND priority 7 (Candidate
          is protected but has no EEORecord). The pair is state vs
          business_safety. Priority dictates priority-5 error wins, so the
          client receives ERR_INVALID_STATE not ERR_EEO_DATA_MISSING.
        test_recipe:
          setup:
            - "Create Req approved to OPEN, Candidate K with is_in_eeo_protected_class=true and NO EEORecord"
            - "Create Application A with stage=APPLIED  (NOT INTERVIEWING, so the /advance to OFFER_STAGE is also a stage error)"
          trigger:
            - "POST /applications/{A.id}/advance — caller intends OFFER_STAGE but A is in APPLIED, AND EEORecord is missing"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE  (priority 5 wins over priority 7)"
            - "data.error_id != ERR_EEO_DATA_MISSING"

      - name: referential_vs_fiscal_offer_submit
        grounds:
          - validations[priority=4]                   # business_referential: foreign key not found
          - validations[priority=14]                  # business_fiscal: Offer exceeds Requisition.budget_cents
        distinguishing_aspect: |
          Offer submission with both a non-existent hiring manager reference
          on the OfferApprovalStep AND a comp total that exceeds the
          requisition budget. The pair is business_referential vs
          business_fiscal — a DIFFERENT pair from instance #1. Priority 4 wins.
        test_recipe:
          setup:
            - "Provision Req(SENIOR, headcount=1, budget_cents=100_000), Candidate, Application advanced to OFFER_STAGE"
            - "POST /applications/{A.id}/offers with base_salary_cents=99_999_999 (definitely over budget) AND OfferApprovalStep.required_approver_id = 'nonexistent-manager-id'"
          trigger:
            - "POST /applications/{A.id}/offers (creation step is when both checks fire)"
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND  (priority 4 wins over priority 14)"
            - "data.error_id != ERR_OFFER_EXCEEDS_REQ_BUDGET"

  # =========================================================================
  # Rule 6: boundary_precision_check — at least two boundary conditions on
  #         DIFFERENT metrics, each reached through a DIFFERENT endpoint.
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: diversity_goal_threshold_ge_boundary
        grounds:
          - calculations.diversity_goal_progress
          - validations[priority=17]
          - entities.DiversityGoal.fields.realized_percentage
          - entities.DiversityGoal.fields.target_protected_class_percentage
        distinguishing_aspect: |
          Numeric-threshold boundary on a percentage field. realized == target
          MUST succeed (>=), realized == target - 0.01 MUST fail. The endpoint
          is POST /diversity-goals/{id}/lock. Metric: percentage of HIRED
          candidates in protected class.
        test_recipe:
          setup:
            - "Create DiversityGoal G(ENG, 2026, target_protected_class_percentage=50.00)"
            - "Create two Requisitions Req1 + Req2 tied to G, each headcount=1, approved to OPEN"
            - "Drive Application A1 (protected candidate with EEORecord) on Req1 to HIRED; drive A2 (non-protected) on Req2 to HIRED"
          trigger:
            - "POST /diversity-goals/{G.id}/lock  (case A: realized exactly equals target)"
          assert:
            - "GET /diversity-goals/{G.id}.realized_percentage == 50.00"
            - "POST /lock returns 200; the goal is locked as met because 50.00 >= 50.00 (>=, NOT >)"
            - "If a second test reproduces the same setup but with target_protected_class_percentage=50.01, POST /lock returns 422 ERR_DIVERSITY_GOAL_NOT_MET (50.00 < 50.01)"

      - name: empty_panel_zero_count_boundary
        grounds:
          - validations[priority=20]
          - state_machines.Application.INTERVIEWING_to_OFFER_STAGE
        distinguishing_aspect: |
          Empty-collection boundary (count == 0 case). The metric is
          "number of COMPLETED Interviews with HIRE/STRONG_HIRE feedback".
          Endpoint: POST /applications/{id}/advance (driving INTERVIEWING→
          OFFER_STAGE). Different metric type (count vs percentage) AND
          different endpoint from the diversity-goal threshold above.
        test_recipe:
          setup:
            - "Provision Req approved to OPEN, Candidate (non-protected), Application A in INTERVIEWING with ZERO COMPLETED interviews (one SCHEDULED is fine, but none COMPLETED)"
          trigger:
            - "POST /applications/{A.id}/advance"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_EMPTY_PANEL  (empty COMPLETED-set boundary)"
            - "GET /applications/{A.id}.stage == INTERVIEWING  (unchanged)"

  # =========================================================================
  # Rule 7: cross_entity_state_dependency — at least two dependencies whose
  #         entity-pairs are DIFFERENT.
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_approve_depends_on_bgc_passed     # pair: Offer ↔ BackgroundCheck
        grounds:
          - state_machines.Offer.PENDING_APPROVAL_to_APPROVED
          - state_machines.BackgroundCheck.PENDING_to_PASSED
          - state_machines.BackgroundCheck.PENDING_to_FAILED
          - entities.BackgroundCheck.fields.status
        distinguishing_aspect: |
          Offer PENDING_APPROVAL → APPROVED requires linked
          BackgroundCheck.status == PASSED. The pair is Offer ↔ BackgroundCheck.
          With BGC.status == PENDING the transition is rejected; with
          BGC.status == PASSED it succeeds.
        test_recipe:
          setup:
            - "Provision Req approved to OPEN, Application advanced to OFFER_STAGE, single-step Offer in PENDING_APPROVAL"
            - "Order a BackgroundCheck (PENDING) — do NOT report a result yet"
          trigger:
            - "POST /offers/{id}/approve {step_order:1}   (attempt 1 — BGC PENDING)"
            - "POST /background-checks/{bgc.id}/report-result {outcome: PASS}"
            - "POST /offers/{id}/approve {step_order:1}   (attempt 2 — BGC PASSED)"
          assert:
            - "Attempt 1: HTTP 409 ERR_INVALID_STATE; Offer.status == PENDING_APPROVAL"
            - "After attempt 2: Offer.status == APPROVED"

      - name: application_hire_depends_on_requisition_open   # pair: Application ↔ Requisition
        grounds:
          - state_machines.Application.OFFER_STAGE_to_HIRED
          - state_machines.Requisition.OPEN_to_ON_HOLD
          - state_machines.Requisition.OPEN_to_CLOSED
          - entities.Requisition.fields.filled_count
          - entities.Requisition.fields.headcount
        distinguishing_aspect: |
          Application OFFER_STAGE → HIRED requires parent Requisition.status
          == OPEN AND Requisition.filled_count < Requisition.headcount. Pair:
          Application ↔ Requisition — DIFFERENT entity pair than
          Offer ↔ BackgroundCheck above.
        test_recipe:
          setup:
            - "Provision Req(headcount=1), Application A advanced to OFFER_STAGE, Offer EXTENDED with PASSED bg check"
            - "POST /requisitions/{Req.id}/hold  → Requisition.status==ON_HOLD"
          trigger:
            - "POST /offers/{Offer.id}/accept  (attempt 1, Req is ON_HOLD)"
            - "POST /requisitions/{Req.id}/resume  → Requisition.status==OPEN"
            - "POST /offers/{Offer.id}/accept  (attempt 2, Req is OPEN, filled_count=0 < headcount=1)"
          assert:
            - "Attempt 1: HTTP 409 ERR_INVALID_STATE; Application.stage == OFFER_STAGE"
            - "After attempt 2: Application.stage == HIRED; Requisition.filled_count == 1"

  # =========================================================================
  # Rule 8: resource_temporal_overlap — at least two rules with DIFFERENT
  #         interval semantics on DIFFERENT resource entities.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interviewer_double_booking_with_buffer    # closed interval + 15-min buffer
        grounds:
          - validations[priority=10]
          - entities.Interview.fields.scheduled_start_at
          - entities.Interview.fields.scheduled_end_at
          - entities.Interviewer.fields.email
          - concurrency_rules[interviewer]
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals on Interviewer's calendar
          ([start_at, end_at]) PLUS a 15-minute buffer extending each existing
          interval on both sides. Strict adjacency (end1 == start2) IS a
          conflict because of the buffer. Resource entity: Interview (per
          interviewer).
        test_recipe:
          setup:
            - "Create Interviewer V"
            - "Create Application A1 and Application A2 on different Requisitions, both INTERVIEWING"
            - "Schedule Interview I1: interviewer_id=V, start=2026-06-01T10:00:00Z, end=2026-06-01T11:00:00Z"
          trigger:
            - "POST /applications/{A2.id}/interviews {interviewer_id:V, start:2026-06-01T11:00:00Z, end:2026-06-01T12:00:00Z}  (case: strictly adjacent)"
            - "POST /applications/{A2.id}/interviews {interviewer_id:V, start:2026-06-01T11:15:00Z, end:2026-06-01T12:15:00Z}  (case: exactly buffer away, end1+15min == start2)"
            - "POST /applications/{A2.id}/interviews {interviewer_id:V, start:2026-06-01T11:16:00Z, end:2026-06-01T12:16:00Z}  (case: just past buffer)"
          assert:
            - "Adjacent case: HTTP 409 ERR_INTERVIEWER_DOUBLE_BOOKED (buffer makes adjacency a conflict)"
            - "Exactly-buffer case: HTTP 409 ERR_INTERVIEWER_DOUBLE_BOOKED (closed-interval semantics)"
            - "Just-past-buffer case: HTTP 201; the new Interview is SCHEDULED"

      - name: recruiter_open_requisition_cap            # aggregate cap on half-open lifetime intervals
        grounds:
          - validations[priority=11]
          - entities.Requisition.fields.posted_at
          - entities.Requisition.fields.closed_at
          - state_machines.Requisition.PENDING_APPROVAL_to_OPEN
          - state_machines.Requisition.OPEN_to_CLOSED
        distinguishing_aspect: |
          DIFFERENT interval semantics from instance #1: this is NOT a pairwise
          overlap check with adjacency buffer — it is an AGGREGATE CAP on
          half-open lifetime intervals [posted_at, closed_at) on Requisition.
          Each Requisition's interval is "open while posted_at IS NOT NULL AND
          closed_at IS NULL". Limit: at most 5 simultaneously open per
          Recruiter. Resource entity: Requisition (per recruiter).
        test_recipe:
          setup:
            - "Create Recruiter R and HiringManager HM"
            - "Create five Requisitions Req1..Req5 owned by R; submit each; approve each (all 5 now OPEN, each with posted_at set, closed_at null)"
          trigger:
            - "Create a sixth Req6, submit, approve  (POST /requisitions/{Req6.id}/approve)"
            - "Cancel Req1 (closed_at set), then re-approve Req6 (after resubmit if necessary)"
          assert:
            - "Approve Req6 first time: HTTP 409 ERR_RECRUITER_REQUISITION_CAP  (aggregate count 6 > 5)"
            - "After Req1 cancel, the count drops to 4 + 1 pending = within cap, and Req6 approve succeeds; Req6.status == OPEN"

  # =========================================================================
  # Rule 9: compensating_invariant — at least two invariants where a forward
  #         action paired with its compensating action leaves a NAMED global
  #         quantity unchanged, on DIFFERENT conserved quantities.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: referral_bonus_clawback_keeps_net_payout_invariant
        grounds:
          - state_machines.ReferralBonus.ACCRUED_to_CLAWED_BACK
          - state_machines.ReferralBonus.PAYABLE_to_CLAWED_BACK
          - state_machines.Application.HIRED_to_REJECTED
          - state_machines.BackgroundCheck.PENDING_to_FAILED
          - entities.ReferralBonus.fields.total_amount_cents
          - entities.ReferralBonus.fields.status
        distinguishing_aspect: |
          Named invariant: net_payout_cents := SUM(rb.total_amount_cents) over
          rb.status == PAID. The forward action "Application→HIRED issues a
          ReferralBonus" paired with the compensating action
          "BG-fail post-hire revoke flips it to CLAWED_BACK" MUST leave
          net_payout_cents unchanged (since no payout occurred). Conserved
          quantity type: monetary payouts.
        test_recipe:
          setup:
            - "Snapshot net_payout_before = SUM over ReferralBonus.total_amount_cents where status==PAID (=0)"
            - "Provision Req, referral Candidate K, drive A→HIRED via Offer ACCEPTED so a ReferralBonus exists (ACCRUED)"
          trigger:
            - "POST /background-checks/{bgc.id}/report-result {outcome: FAIL}  (post-hire revoke cascade)"
            - "Snapshot net_payout_after = SUM over ReferralBonus.total_amount_cents where status==PAID"
          assert:
            - "ReferralBonus.status == CLAWED_BACK  (compensating action ran)"
            - "net_payout_after == net_payout_before == 0  (the named invariant holds: no payout occurred)"
            - "Application.stage == REJECTED with rejection_reason==FAILED_BACKGROUND_CHECK  (cascade observable)"

      - name: requisition_headcount_conservation_through_hire_revoke
        grounds:
          - state_machines.Application.OFFER_STAGE_to_HIRED
          - state_machines.Application.HIRED_to_REJECTED
          - state_machines.Requisition.OPEN_to_CLOSED
          - state_machines.BackgroundCheck.PENDING_to_FAILED
          - entities.Requisition.fields.headcount
          - entities.Requisition.fields.filled_count
        distinguishing_aspect: |
          Named invariant: Requisition.headcount ==
            Requisition.filled_count
          + count of Applications on this Req with stage==OFFER_STAGE that have an ACCEPTED Offer
          + remaining_open_slots
          where remaining_open_slots is the residual; equivalently, after a
          /accept + bg-fail-revoke round-trip on a single-headcount req the
          tuple (filled_count, status, closed_at) returns to its pre-/accept
          values. This is a DIFFERENT conserved quantity (headcount slots,
          NOT monetary payouts).
        test_recipe:
          setup:
            - "Provision Req with headcount=1; capture (filled_count_before=0, status_before=OPEN, closed_at_before=null)"
            - "Drive A→HIRED via Offer ACCEPTED (filled_count becomes 1, Req CLOSED)"
          trigger:
            - "POST /background-checks/{bgc.id}/report-result {outcome: FAIL}  (post-hire revoke cascade)"
          assert:
            - "Requisition.filled_count == filled_count_before == 0  (slot returned)"
            - "Requisition.status == status_before == OPEN  (req reopened)"
            - "Requisition.closed_at == closed_at_before == null"
            - "Requisition.headcount == 1  (immutable since DRAFT exit; total slots unchanged)"
