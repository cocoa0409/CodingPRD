              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 0, review_note: "Full clause inventory; no prohibited gag language." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /compliance/contracts/${c_tpa}/clear-gag"
              payload: { clearance_note: "Cleared for attestation." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response HTTP status == 200 with data.gag_review_status == \"COMPLIANT\", data.gag_non_compliant_since == null, data.remediation_round == 0"
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 0, data.compliance_posture == \"COMPLIANT\", data.penalty_exposure_cents == 0"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> total_count == 0"

      - name: attestation_posture_gate_versus_segregation_of_duties_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / attestation_submit_posture_gate_outranks_segregation_of_duties
          rationale: "That §1.8 instance violates both rules in one call and asserts ERR_POSTURE_BLOCKS_ATTESTATION, then repairs the posture and shows the SoD error surfacing from the same request."

      - name: outage_window_shape_versus_overlap_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=19]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / outage_window_interval_shape_outranks_overlap_constraint
          rationale: "That §1.8 instance submits an inverted window that also overlaps an existing one and pins ERR_INVALID_INTERVAL over ERR_OUTAGE_WINDOW_OVERLAP."

      - name: frozen_gate_versus_invalid_transition_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_plan_year_outranks_invalid_state_transition
          rationale: "That §1.8 instance fires an out-of-state action on a frozen plan year and pins ERR_PLAN_YEAR_FROZEN ahead of ERR_INVALID_STATE_TRANSITION."

      - name: refresh_period_overlap_on_shared_boundary_day_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_REFRESH_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / refresh_period_closed_interval_shares_boundary_day
          rationale: "That §1.8 instance shows the closed-interval semantics: a period starting on the previous period's last day collides, while starting one day later is accepted."

      - name: outage_window_interior_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_OUTAGE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / outage_windows_touching_allowed_but_interior_overlap_refused
          rationale: "That §1.8 instance contrasts the accepted touching window against the refused interior overlap on the same half-open axis."

      - name: refresh_certify_without_both_published_files_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_MRF_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / refresh_certify_blocked_until_both_file_types_published
          rationale: "That §1.8 instance certifies only after BOTH IN_NETWORK_RATES and ALLOWED_AMOUNTS are PUBLISHED for the same posting_month."

      - name: package_delivery_without_secured_data_rights_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DATA_RIGHTS_NOT_SECURED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / package_delivery_requires_secured_data_rights_on_contract
          rationale: "That §1.8 instance blocks the delivery until the vendor's own contract reaches data_rights_status SECURED through an executed amendment."

      - name: attestation_submit_with_outstanding_gag_clauses_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_GAG_CLAUSES_OUTSTANDING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / attestation_submit_requires_every_material_contract_gag_cleared
          rationale: "That §1.8 instance requires EVERY material contract to be gag COMPLIANT and shows one unreviewed contract blocking the submission."

      - name: third_gag_remediation_request_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_REMEDIATION_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / gag_remediation_cycle_third_request_rejected
          rationale: "That §1.8 instance walks the IN_REVIEW <-> REMEDIATION_REQUESTED cycle to MAX_REMEDIATION_ROUNDS and asserts the third request is refused."

  - section: endpoints
    instances:
      - name: compliance_run_returns_a_run_summary_object
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /compliance/plan-years/{id}/compliance-runs]
          - complexity_profile.complexity_layers.ops_run_checkpoint
        distinguishing_aspect: "The ops checkpoint returns a run SUMMARY object (run_id plus five counters and the two posture snapshots), not the PlanYear entity: on a clean plan year every counter is 0, posture_before == posture_after == \"COMPLIANT\", and last_compliance_run_at is still stamped on the plan year."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract and no deficiencies; clock at 2027-03-15T10:30:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-03-15T10:30:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/plan-years/${py}/compliance-runs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response HTTP status == 200 and the body carries data.run_id (non-empty string), data.cycles_missed_count == 0, data.amendments_lapsed_count == 0, data.accruals_posted_count == 0, data.posture_before == \"COMPLIANT\", data.posture_after == \"COMPLIANT\", data.deficiency_points == 0, data.penalty_exposure_cents == 0"
            - "the response body does NOT carry data.lifecycle_status or data.sponsor_name (it is a run summary, not the PlanYear)"
            - "GET /compliance/plan-years/${py} -> data.last_compliance_run_at == \"2027-03-15T10:30:00Z\""

      - name: penalty_projection_is_read_only
        claim_type: computed_read
        grounds:
          - endpoints[GET /compliance/plan-years/{id}/penalty-projection]
          - calculations.penalty_exposure_projection.note
        distinguishing_aspect: "The projection derives from LIVE open child state and mutates nothing: with one GAG_CLAUSE deficiency open since 2027-07-10 and the clock at 2027-07-20 it reports accrued 330000 (11 days) and statutory 5250000 (175 days to 2027-12-31) while the LEDGER still holds only the single 30000 one-day accrual, PlanYear.version is unchanged and no entry is appended. Two identical calls return identical bodies."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 (covered_lives 6000) whose TPA contract was escalated to NON_COMPLIANT on 2027-07-10, posting a 30000 GAG_CLAUSE accrual."
            - "Clock advanced to 2027-07-20T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-10T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 2 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/escalate-gag"
              payload: { escalation_note: "Clauses retained by the TPA." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-20T09:00:00Z" }
              as: PlatformOperator
            - call: "GET /compliance/plan-years/${py}"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
              captures: { py_v: "$.data.version" }
          trigger:
            - call: "GET /compliance/plan-years/${py}/penalty-projection"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
            - call: "GET /compliance/plan-years/${py}/penalty-projection"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
          assert:
            - "both responses have HTTP status == 200 with identical bodies: data.accrued_to_date_cents == 330000, data.statutory_maximum_cents == 5250000, data.open_deficiency_count == 1, data.size_multiplier == 2.0"
            - "GET /compliance/plan-years/${py} -> data.version == ${py_v} and data.penalty_exposure_cents == 30000 (the ledger disagrees with the projection by design)"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> total_count == 1 with days_open == 1"

      - name: clock_set_endpoint_stamps_subsequent_writes
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /compliance/_clock/set_current_utc]
          - conventions.logical_clock
        distinguishing_aspect: "Every server-generated timestamp comes from the logical clock, not from wall time: after setting the clock to 2027-09-09T08:07:06Z a freshly created PlanYear carries exactly that created_at and updated_at, and a ledger entry posted later in the same clock state carries the same instant."
        test_recipe:
          setup:
            - "Clock set to 2027-09-09T08:07:06Z; no rows."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-09-09T08:07:06Z" }
