            - "Clock at 2026-09-12T15:00:00Z; Event IN_PROGRESS with a LOCKED plan; TICKET_TAKER PositionType with no required certifications."
            - "Slot A 16:00-20:00, required_headcount_override 1, already assigned to M1."
            - "Slot B 20:29-23:00, Slot C 20:30-23:00 and Slot D 12:00-15:31, each required_headcount_override 1 and empty."
            - "The gaps are: A -> B 29 minutes, A -> C exactly 30 minutes, D -> A 29 minutes."
