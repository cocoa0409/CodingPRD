        grounds:
          - validations[priority=52]
          - validations[priority=68]
          - errors.ERR_CURE_WINDOW_STILL_OPEN
          - errors.ERR_AGREEMENT_HAS_BREACH
          - state_machines.Milestone.CURE_PENDING_to_BREACHED
          - calculations.cure_window
        distinguishing_aspect: "The same sweep call flips outcome purely on the logical clock: at 2026-08-01 the deadline 2026-08-15T00:00:00.000Z is still open (409 ERR_CURE_WINDOW_STILL_OPEN), and one millisecond past it the milestone BREACHES and escalates the agreement to SUSPENDED - after which reinstatement is refused with ERR_AGREEMENT_HAS_BREACH."
