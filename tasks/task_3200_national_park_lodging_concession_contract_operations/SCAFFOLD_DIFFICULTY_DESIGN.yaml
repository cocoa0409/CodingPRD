# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_3200_national_park_lodging_concession_contract_operations
# 9 rules x 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: occupancy_rate_banded_vs_actual_headcount_divergence
        grounds:
          - calculations.occupancy_rate_resolution
          - entities.Reservation.fields.occupancy_mode
          - entities.Reservation.fields.beds_occupied
        distinguishing_aspect: |
          Entity domain: Reservation pricing. The SAME room-night (FAMILY room
          occupied by 2 guests) prices at the FAMILY band rate under BANDED mode
          but at the DOUBLE band rate under ACTUAL_HEADCOUNT mode — two valid
          algorithms, identical physical facts, different quoted totals.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE contract with one season (2027-06-01..2027-09-01, lottery 2026-12-01 + 72h), four service lines, one ACTIVE room class with an APPROVED filing (SOLO 19000, DOUBLE 23000, FAMILY 26000 cents/night)."
            - "Study weighted_mean_cents == 20500; cap == 21525; wait — cap would reject those rates: use study comparables 25000/24000/26000 weights 1/1/1 -> mean 25000, cap 26250 so 26000 passes."
          setup_api_calls:
            - &dv_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
            - &dv_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-001", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - &dv_lines_lodging
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
              captures: { sl_lodging: $.data.id }
            - &dv_lines_food
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
              captures: { sl_food: $.data.id }
            - &dv_lines_retail
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
              captures: { sl_retail: $.data.id }
            - &dv_lines_tours
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
              captures: { sl_tours: $.data.id }
            - &dv_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id }
            - &dv_activate
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &dv_roomclass
              call: "POST /contracts/${c_id}/room-classes"
              payload: { code: "CABIN_A", total_rooms: 10, peak_season_months: [6, 7, 8] }
              as: ConcessionerOpsManager
              captures: { rc_id: $.data.id }
            - &dv_study
              call: "POST /contracts/${c_id}/comparability-studies"
              payload: { title: "Gateway cabins 2026", comparables: [{ property_name: "A", nightly_rate_cents: 25000, weight: 1.0 }, { property_name: "B", nightly_rate_cents: 24000, weight: 1.0 }, { property_name: "C", nightly_rate_cents: 26000, weight: 1.0 }], prepared_at: "2026-06-01T00:00:00Z", valid_through: "2028-01-01T00:00:00Z" }
              as: AgencyRateAnalyst
              captures: { st_id: $.data.id }
            - &dv_filing
              call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 19000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 23000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 26000 }], reference_study_id: "${st_id}", expected_contract_version: "${c_v}" }
              as: ConcessionerRateManager
              captures: { f_id: $.data.id }
            - &dv_review
              call: "POST /contracts/${c_id}/rate-filings/${f_id}/start-review"
              payload: {}
              as: AgencyRateAnalyst
            - &dv_approve
              call: "POST /contracts/${c_id}/rate-filings/${f_id}/approve"
              payload: {}
              as: AgencyRateAnalyst
            - &dv_clock2
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T01:00:00Z" }
              as: SystemTestHarness
            - &dv_getc1
              call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerFrontDesk
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "guest-banded", check_in_date: "2027-07-10T00:00:00Z", check_out_date: "2027-07-13T00:00:00Z", occupancy_band: "FAMILY", expected_contract_version: "${c_v2}" }
              as: ConcessionerFrontDesk
              captures: { r_banded: $.data.id, banded_total: $.data.total_charge_cents }
            - call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "guest-actual", check_in_date: "2027-07-10T00:00:00Z", check_out_date: "2027-07-13T00:00:00Z", occupancy_band: "FAMILY", occupancy_mode: "ACTUAL_HEADCOUNT", beds_occupied: 2, expected_contract_version: "${c_v2}" }
              as: ConcessionerFrontDesk
              captures: { r_actual: $.data.id, actual_total: $.data.total_charge_cents }
          assert:
            - "Reservation.${r_banded}.quoted_nightly_rate_cents == 26000"
            - "Reservation.${r_banded}.total_charge_cents == 78000"
            - "Reservation.${r_banded}.deposit_cents == 15600"
            - "Reservation.${r_actual}.quoted_nightly_rate_cents == 23000"
            - "Reservation.${r_actual}.total_charge_cents == 69000"
            - "Reservation.${r_actual}.deposit_cents == 13800"
            - "the two reservations price the identical stay 9000 cents apart purely from occupancy_mode"

      - name: lsi_linear_vs_declining_balance_divergence
        grounds:
          - calculations.lsi_accrual
          - entities.Contract.fields.lsi_annual_schedule_type
          - entities.CapitalProject.fields.accrued_lsi_cents
        distinguishing_aspect: |
          Entity domain: CapitalProject leasehold accounting (different domain
          from reservation pricing). Identical authorized cost, term, and
          in-service offset accrue different leasehold surrender interest under
          LINEAR vs DECLINING_BALANCE once the offset crosses a phase boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DRAFT contracts, identical except lsi_annual_schedule_type: LIN (LINEAR) and DEC (DECLINING_BALANCE), each term_months 20, start 2027-01-01."
            - "Each contract has one AUTHORIZED CapitalProject: authorized_cost_cents 2000000, completed with in_service_month_offset 2 while the contract offset is 12 (clock advanced to 2028-01-01 + 11 months? no: offset 12 == 2028-01-01 given start 2027-01-01)."
          setup_api_calls:
            - &ls_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
            - &ls_contract_lin
              call: "POST /contracts"
              payload: { park_code: "GRCA", contract_number: "GRCA-LIN", term_months: 20, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.03, employee_housing_capacity: 50, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_lin: $.data.id }
            - &ls_contract_dec
              call: "POST /contracts"
              payload: { park_code: "GRCA", contract_number: "GRCA-DEC", term_months: 20, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.03, employee_housing_capacity: 50, lsi_annual_schedule_type: "DECLINING_BALANCE", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_dec: $.data.id }
            - &ls_proj_lin
              call: "POST /contracts/${c_lin}/capital-projects"
              payload: { title: "Roof replacement", asset_ref: "BLDG-7", authorized_cost_cents: 2000000 }
              as: ConcessionerMaintenanceChief
              captures: { p_lin: $.data.id }
            - &ls_proj_dec
              call: "POST /contracts/${c_dec}/capital-projects"
              payload: { title: "Roof replacement", asset_ref: "BLDG-7", authorized_cost_cents: 2000000 }
              as: ConcessionerMaintenanceChief
              captures: { p_dec: $.data.id }
            - &ls_auth_lin
              call: "POST /contracts/${c_lin}/capital-projects/${p_lin}/authorize"
              payload: {}
              as: AgencyContractingOfficer
            - &ls_auth_dec
              call: "POST /contracts/${c_dec}/capital-projects/${p_dec}/authorize"
              payload: {}
              as: AgencyContractingOfficer
            - &ls_clock12
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-01-01T00:00:00Z" }
              as: SystemTestHarness
            - &ls_complete_lin
              call: "POST /contracts/${c_lin}/capital-projects/${p_lin}/complete"
              payload: { actual_cost_cents: 1950000, in_service_month_offset: 2 }
              as: ConcessionerMaintenanceChief
              captures: { lin_accrued: $.data.accrued_lsi_cents }
            - &ls_complete_dec
              call: "POST /contracts/${c_dec}/capital-projects/${p_dec}/complete"
              payload: { actual_cost_cents: 1950000, in_service_month_offset: 2 }
              as: ConcessionerMaintenanceChief
              captures: { dec_accrued: $.data.accrued_lsi_cents }
          trigger:
            - call: "GET /contracts/${c_lin}/capital-projects/${p_lin}"
              payload: {}
              as: AgencyContractingOfficer
            - call: "GET /contracts/${c_dec}/capital-projects/${p_dec}"
              payload: {}
              as: AgencyContractingOfficer
          assert:
            - "CapitalProject.${p_lin}.accrued_lsi_cents == 1000000  # 2000000 * (12-2)/20"
            - "CapitalProject.${p_dec}.accrued_lsi_cents == 950000   # 8 phase-1 months x 100000 + 2 phase-2 months x 75000"
            - "identical inputs diverge by 50000 cents purely from lsi_annual_schedule_type"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: franchise_fee_per_line_rounding_order
        grounds:
          - calculations.franchise_fee
          - entities.FranchiseFeeStatement.fields.total_fee_cents
          - entities.FranchiseFeeStatement.fields.aggregate_diagnostic_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order. Per-line round-then-sum (payable)
          vs sum-then-round (diagnostic) produce different cents: receipts
          20000/15000/9000 at 3.85% -> 1695 vs 1694. The scaffold pins
          per-line-then-sum as the payable order.
        test_recipe:
          setup:
            - "ACTIVE contract (fee rate 0.0385) with all four service lines; three ACCEPTED GrossReceiptsReports for period 2027-07: LODGING 20000, FOOD 15000, RETAIL 9000 cents."
          setup_api_calls:
            - &cf_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
            - &cf_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-002", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - &cf_line_l
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
              captures: { sl_l: $.data.id }
            - &cf_line_f
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
              captures: { sl_f: $.data.id }
            - &cf_line_r
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
              captures: { sl_r: $.data.id }
            - &cf_line_t
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &cf_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
            - &cf_activate
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &cf_getc
              call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerAccountant
              captures: { c_v2: $.data.version }
            - &cf_rep_l
              call: "POST /contracts/${c_id}/receipts-reports"
              payload: { period_month: "2027-07", service_line_id: "${sl_l}", gross_receipts_cents: 20000, expected_contract_version: "${c_v2}" }
              as: ConcessionerAccountant
              captures: { rep_l: $.data.id }
            - &cf_rep_f
              call: "POST /contracts/${c_id}/receipts-reports"
              payload: { period_month: "2027-07", service_line_id: "${sl_f}", gross_receipts_cents: 15000, expected_contract_version: "${c_v2}" }
              as: ConcessionerAccountant
              captures: { rep_f: $.data.id }
            - &cf_rep_r
              call: "POST /contracts/${c_id}/receipts-reports"
              payload: { period_month: "2027-07", service_line_id: "${sl_r}", gross_receipts_cents: 9000, expected_contract_version: "${c_v2}" }
              as: ConcessionerAccountant
              captures: { rep_r: $.data.id }
            - &cf_sub_l
              call: "POST /contracts/${c_id}/receipts-reports/${rep_l}/submit"
              payload: {}
              as: ConcessionerAccountant
            - &cf_sub_f
              call: "POST /contracts/${c_id}/receipts-reports/${rep_f}/submit"
              payload: {}
              as: ConcessionerAccountant
            - &cf_sub_r
              call: "POST /contracts/${c_id}/receipts-reports/${rep_r}/submit"
              payload: {}
              as: ConcessionerAccountant
            - &cf_acc_l
              call: "POST /contracts/${c_id}/receipts-reports/${rep_l}/accept"
              payload: {}
              as: AgencyFinancialAuditor
            - &cf_acc_f
              call: "POST /contracts/${c_id}/receipts-reports/${rep_f}/accept"
              payload: {}
              as: AgencyFinancialAuditor
            - &cf_acc_r
              call: "POST /contracts/${c_id}/receipts-reports/${rep_r}/accept"
              payload: {}
              as: AgencyFinancialAuditor
          trigger:
            - call: "POST /contracts/${c_id}/fee-statements"
              payload: { period_month: "2027-07" }
              as: ConcessionerAccountant
              captures: { stmt_id: $.data.id }
          assert:
            - "FranchiseFeeStatement.${stmt_id}.total_fee_cents == 1695  # 770 + 578 + 347"
            - "FranchiseFeeStatement.${stmt_id}.aggregate_diagnostic_cents == 1694"
            - "FranchiseFeeStatement.${stmt_id}.reporting_method == PER_LINE_ROUNDED"
            - "payable total differs from the aggregate-first diagnostic by exactly 1 cent"

      - name: rate_cap_three_way_nonlinear_interaction
        grounds:
          - calculations.rate_cap_compliance
          - calculations.comparability_weighted_mean
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs and non-linear interaction:
          weighted mean (rates x weights, division), cap multiplier 1.05 with
          integer-cent rounding, then a per-band max comparison against three
          submitted bands — a filing passes iff every band is under the rounded
          cap, so one overweighted comparable can flip the verdict.
        test_recipe:
          setup:
            - "ACTIVE contract; season; room class. Study S1: comparables 25000/24000/26000 equal weights -> mean 25000, cap 26250. Study S2: comparables 20000/22000/18000 weights 1/2/1 -> mean 20500, cap 21525."
          setup_api_calls:
            - &rc_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
            - &rc_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-003", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - &rc_l1
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
            - &rc_l2
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &rc_l3
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &rc_l4
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &rc_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id }
            - &rc_activate
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &rc_room
              call: "POST /contracts/${c_id}/room-classes"
              payload: { code: "CABIN_A", total_rooms: 10, peak_season_months: [6, 7, 8] }
              as: ConcessionerOpsManager
              captures: { rc_id: $.data.id }
            - &rc_study1
              call: "POST /contracts/${c_id}/comparability-studies"
              payload: { title: "S1", comparables: [{ property_name: "A", nightly_rate_cents: 25000, weight: 1.0 }, { property_name: "B", nightly_rate_cents: 24000, weight: 1.0 }, { property_name: "C", nightly_rate_cents: 26000, weight: 1.0 }], prepared_at: "2026-06-01T00:00:00Z", valid_through: "2028-01-01T00:00:00Z" }
              as: AgencyRateAnalyst
              captures: { st1: $.data.id }
            - &rc_study2
              call: "POST /contracts/${c_id}/comparability-studies"
              payload: { title: "S2", comparables: [{ property_name: "A", nightly_rate_cents: 20000, weight: 1.0 }, { property_name: "B", nightly_rate_cents: 22000, weight: 2.0 }, { property_name: "C", nightly_rate_cents: 18000, weight: 1.0 }], prepared_at: "2026-06-01T00:00:00Z", valid_through: "2028-01-01T00:00:00Z" }
              as: AgencyRateAnalyst
              captures: { st2: $.data.id }
            - &rc_getc
              call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerRateManager
              captures: { c_v2: $.data.version }
            - &rc_filing_hi
              call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 24000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 25000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 26000 }], reference_study_id: "${st1}", expected_contract_version: "${c_v2}" }
              as: ConcessionerRateManager
              captures: { f_hi: $.data.id }
            - &rc_rev_hi
              call: "POST /contracts/${c_id}/rate-filings/${f_hi}/start-review"
              payload: {}
              as: AgencyRateAnalyst
          trigger:
            - call: "POST /contracts/${c_id}/rate-filings/${f_hi}/approve"
              payload: {}
              as: AgencyRateAnalyst
              captures: { approved_status: $.data.status }
            - call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 20000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 21000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 22000 }], reference_study_id: "${st2}", expected_contract_version: "${c_v2}" }
              as: ConcessionerRateManager
              captures: { f_lo: $.data.id }
            - call: "POST /contracts/${c_id}/rate-filings/${f_lo}/start-review"
              payload: {}
              as: AgencyRateAnalyst
            - call: "POST /contracts/${c_id}/rate-filings/${f_lo}/approve"
              payload: {}
              as: AgencyRateAnalyst
              captures: { reject_err: $.data.error_id }
          assert:
            - "ComparabilityStudy.${st1}.weighted_mean_cents == 25000 and its cap is 26250 so FAMILY 26000 approves (approved_status == APPROVED)"
            - "ComparabilityStudy.${st2}.weighted_mean_cents == 20500 and its cap is 21525 so FAMILY 22000 is rejected with ERR_RATE_EXCEEDS_COMPARABILITY (422) — the weighted-mean interaction flips the verdict on the second filing's own band set"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rate_filing_rejection_revision_cycle
        grounds:
          - state_machines.RateFiling.REJECTED_to_SUBMITTED
          - state_machines.RateFiling.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          RateFiling runs a cyclic revision loop: SUBMITTED -> REJECTED ->
          (revision submission) new SUBMITTED filing carrying revision_of_id,
          repeatable without bound until APPROVED — not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE contract with season, room class, and one REGISTERED study (mean 25000, cap 26250). Filing F1 with FAMILY band 27000 (over cap) submitted."
          setup_api_calls:
            - &nl_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
            - &nl_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-004", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - &nl_l1
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
            - &nl_l2
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &nl_l3
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
