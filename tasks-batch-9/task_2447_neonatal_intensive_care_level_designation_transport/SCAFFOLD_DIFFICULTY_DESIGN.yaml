            - call: "GET /admissions/${adm_t1}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_adm_t1: $.data.version }
            - call: "POST /admissions/${adm_t1}/back-transfer-referrals"
              payload: { expected_admission_version: "${v_adm_t1}", receiving_unit_id: "${unit_b}", case_reference: "BT-1" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { ref_bt: $.data.id }
            - call: "GET /nicu-units/${unit_b}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_b}:intake-1"
              captures: { v_b1: $.data.version }
            - call: "POST /referrals/${ref_bt}/accept"
              payload: { expected_unit_version: "${v_b1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_b}:intake-1"
              captures: { res_bt: $.data.reservation_id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-T2", gestational_age_weeks: 34.0, birth_weight_grams: 1600, support_modality: "ROOM_AIR" }
              as: ReferringClinician
