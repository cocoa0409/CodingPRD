    roles: [LandlordPM]
    code: 200
    input: []
    output: WorkLetter
    side_effects: ["TIProject.allowance_total_cents := allowance_offer_cents", "TIProject.version increments by 1", "WorkLetter.version increments by 1"]
  - method: POST
    path: "/api/work-letters/{id}/withdraw"
    description: "DRAFT|PROPOSED|COUNTERED -> WITHDRAWN"
    roles: [LandlordPM]
    code: 200
    input: []
    output: WorkLetter
    side_effects: ["WorkLetter.version increments by 1"]

