      - name: rejected_brief_is_terminal_for_every_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CustomerBrief.terminal_states
          - validations[priority=40]
          - errors.ERR_BRIEF_STATE_INVALID
        distinguishing_aspect: "From REJECTED all three brief triggers (submit, clarification-request, close) return ERR_BRIEF_STATE_INVALID (409) and the brief's version stops advancing after the rejecting decision."
        test_recipe:
          setup:
            - "Brief BRF-0001 submitted and then rejected by the director, so status == REJECTED."
          setup_api_calls:
