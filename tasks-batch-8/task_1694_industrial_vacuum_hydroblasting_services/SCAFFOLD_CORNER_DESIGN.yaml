            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 2000, water_captured_gallons: 1899 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_a: $.data.id, cr_a_ratio: $.data.capture_ratio, cr_a_seq: $.data.sequence } }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 2000, water_captured_gallons: 1900 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_b: $.data.id, cr_b_ratio: $.data.capture_ratio, cr_b_seq: $.data.sequence } }
          trigger:
            - { call: "POST /v1/containment-records/${cr_a}/verify", payload: {}, as: ProjectManager, captures: { st_a: $.data.status } }
            - { call: "POST /v1/containment-records/${cr_b}/verify", payload: {}, as: ProjectManager, captures: { st_b: $.data.status } }
          assert:
            - "cr_a_ratio == 0.9495 and st_a == DEFICIENT (< 0.9500)"
            - "cr_b_ratio == 0.95 and st_b == VERIFIED (>= 0.9500 inclusive boundary)"
            - "cr_a_seq == 1 and cr_b_seq == 2 (per-job monotone sequence minted at creation)"

      - name: jha_revision_numbering_and_supersede_corner
        claim_type: side_effect_execution
        grounds:
          - state_machines.JobHazardAnalysis.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: jha_revision_cycle_and_supersede
          rationale: "Revision cycle, monotone numbering and supersede-on-approve are all asserted by the named 1.8 instance."

