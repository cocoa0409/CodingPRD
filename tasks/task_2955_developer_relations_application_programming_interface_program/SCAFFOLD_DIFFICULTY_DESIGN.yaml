          - entities.SupportCase.fields.total_credit_calls
          - entities.QuotaAssignment.fields.bonus_call_credit
          - state_machines.SupportCase.RESPONDING_to_RESOLVED
          - endpoints.POST /support-cases/{id}/resolve
        distinguishing_aspect: |
          Mode (b): pinned rounding order. Each of the two affected assignments yields a raw credit
          of exactly 500000 * 0.10 * 1.5 * 150 / 1440 = 7812.500, which round_half_up per assignment
          gives 7813, so total_credit_calls is 15626; summing the raw values first (15625.000) and
          rounding once would give 15625. The scaffold pins per-assignment rounding, so 15626 is the
