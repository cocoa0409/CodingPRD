          assert:
            - "the stale call is rejected with error_id ERR_STALE_VERSION at http 412"
            - "Engagement.${eng_kc}.version is ${eng_kc_v2} (exactly one greater than the stale snapshot) after the first assignment"
            - "the retry carrying ${eng_kc_v2} succeeds and creates EngagementRoleAssignment.${asg_rs}"
            - "no partial side effect survives the rejection: Engagement.${eng_kc}.assigned_workload_points reflects only the two successful assignments"

      - name: stale_engagement_version_on_finding_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[finding-create-stale-engagement]
          - endpoints.POST_/audit/independence-findings
        distinguishing_aspect: "The finding create carries its own OCC guard on the same parent but a different write endpoint: a second finding submitted from the pre-first-finding snapshot is rejected even though nothing about the finding itself is invalid."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One non-PIE client, one engagement, one professional, and one CRITICAL finding already created against the snapshot version."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_aa: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Mowbray Pumps", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_mo: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Selina Vaughn", grade: "PARTNER", home_affiliate_id: "${aff_aa}", rotation_role_class: "LEAD_PARTNER" }
              as: PlatformAdmin
              captures: { pro_sv: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_mo}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_mo: $.data.id, eng_mo_v: $.data.version }
            - call: "POST /audit/independence-findings"
              payload: { professional_id: "${pro_sv}", engagement_id: "${eng_mo}", origin: "INSPECTION", origin_ref_id: "insp-mo-1", finding_type: "PROHIBITED_SERVICE", severity: "CRITICAL", discovered_on: "2026-09-15T00:00:00Z", expected_engagement_version: "${eng_mo_v}" }
              as: IndependenceOfficer
              captures: { fnd_mo: $.data.id }
            - call: "GET /audit/engagements/${eng_mo}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_mo_v2: $.data.version }
          trigger:
            - call: "POST /audit/independence-findings"
              payload: { professional_id: "${pro_sv}", engagement_id: "${eng_mo}", origin: "INSPECTION", origin_ref_id: "insp-mo-2", finding_type: "WORKLOAD_LIMIT", severity: "LOW", discovered_on: "2026-09-16T00:00:00Z", expected_engagement_version: "${eng_mo_v}" }
              as: IndependenceOfficer
              captures: { err_occ2: $.data.error_id }
            - call: "POST /audit/independence-findings"
              payload: { professional_id: "${pro_sv}", engagement_id: "${eng_mo}", origin: "INSPECTION", origin_ref_id: "insp-mo-2", finding_type: "WORKLOAD_LIMIT", severity: "LOW", discovered_on: "2026-09-16T00:00:00Z", expected_engagement_version: "${eng_mo_v2}" }
              as: IndependenceOfficer
              captures: { fnd_mo2: $.data.id }
          assert:
            - "the stale call is rejected with ERR_STALE_VERSION at http 412"
            - "the retry with ${eng_mo_v2} succeeds and IndependenceFinding.${fnd_mo2}.status == OPEN"
            - "Client.${cli_mo}.open_finding_count == 2 after the retry, so the rejected call contributed nothing"

      - name: client_aggregate_status_tracks_the_worst_engagement
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.engagement_independence_status
          - entities.Client.fields.aggregate_independence_status
        distinguishing_aspect: "The client roll-up is recomputed from the worst child rather than set directly: two engagements start CLEAR, one HIGH finding makes the client RESTRICTED while the sibling stays CLEAR, and closing the finding returns the client to CLEAR."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One non-PIE client with two engagements and one professional."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_ab: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Foxglove Pharma", industry_code: "HEALTHCARE", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_fx: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Nils Bergstrom", grade: "PARTNER", home_affiliate_id: "${aff_ab}", rotation_role_class: "LEAD_PARTNER" }
              as: PlatformAdmin
              captures: { pro_nb: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_fx}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_fx1: $.data.id, eng_fx1_v: $.data.version }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_fx}", engagement_type: "REVIEW_ENGAGEMENT", fiscal_year_end: "2027-06-30T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_fx2: $.data.id }
          trigger:
            - call: "GET /audit/clients/${cli_fx}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit/independence-findings"
              payload: { professional_id: "${pro_nb}", engagement_id: "${eng_fx1}", origin: "DECLARATION", origin_ref_id: "decl-fx-1", finding_type: "EMPLOYMENT_RELATIONSHIP", severity: "HIGH", discovered_on: "2026-09-20T00:00:00Z", expected_engagement_version: "${eng_fx1_v}" }
              as: IndependenceOfficer
              captures: { fnd_fx: $.data.id }
            - call: "GET /audit/clients/${cli_fx}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit/independence-findings/${fnd_fx}/transitions"
              payload: { action: "START_REMEDIATION" }
              as: IndependenceOfficer
            - call: "POST /audit/independence-findings/${fnd_fx}/transitions"
              payload: { action: "SUBMIT_FOR_RETEST" }
              as: IndependenceOfficer
            - call: "POST /audit/independence-findings/${fnd_fx}/transitions"
              payload: { action: "PASS_RETEST" }
              as: IndependenceOfficer
            - call: "GET /audit/clients/${cli_fx}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "at the first read Client.${cli_fx}.aggregate_independence_status == CLEAR and open_finding_count == 0"
            - "at the second read it is RESTRICTED because Engagement.${eng_fx1} is RESTRICTED on one HIGH finding, while Engagement.${eng_fx2} remains CLEAR"
            - "at the third read it is back to CLEAR with open_finding_count == 0 after the finding closes — the roll-up is recomputed, never set"
            - "Client.${cli_fx}.status stayed ACTIVE throughout because a RESTRICTED posture does not suspend the client"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_read_after_write_returns_new_value
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.NonAuditService.fields.approved_fee_cents
        distinguishing_aspect: "Every derived value is visible in the same request that caused it: the approval response itself already carries the rounded approved_fee_cents, and an immediate follow-up read of the client shows the updated pool with no lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One client with a 5000000-cent cap and one PENDING_APPROVAL service of 250050 cents."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Corvid Systems", industry_code: "TECH", jurisdiction_country: "US", naf_annual_cap_cents: 5000000 }
              as: PlatformAdmin
              captures: { cli_cs2: $.data.id }
            - call: "POST /audit/non-audit-services"
              payload: { client_id: "${cli_cs2}", service_category: "VALUATION", fee_cents: 250050 }
              as: AuditCommitteeLiaison
              captures: { svc_cs: $.data.id }
            - call: "POST /audit/non-audit-services/${svc_cs}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: AuditCommitteeLiaison
          trigger:
            - call: "POST /audit/non-audit-services/${svc_cs}/transitions"
              payload: { action: "APPROVE", committee_resolution_ref: "AC-2026-1001" }
              as: AuditCommitteeLiaison
              captures: { approved_fee: $.data.approved_fee_cents }
            - call: "GET /audit/clients/${cli_cs2}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the approval response itself already carries approved_fee_cents == 250100 (round_half_up(2500.50) * 100)"
            - "the immediately following client read shows naf_approved_fee_cents == 250100 with no second write"
            - "NonAuditService.${svc_cs}.approved_on equals the logical clock value"
            - "Client.${cli_cs2}.version advanced by exactly 1 across the approval"

