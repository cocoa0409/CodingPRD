  # =========================================================================
  # RULE 9 - compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: audit_refund_conserves_total_payer_position
        grounds: "§1.3 calculations.study_ledger_rollup INVARIANT P (payer_billed_cents + payer_refunded_cents unchanged by a refund); §1.2 Charge BL-1 and its compensating action BL-5; §1.1 Charge.refunded_amount_cents."
        distinguishing_aspect: "Conserved quantity: the study's TOTAL payer position (payer_billed_cents + payer_refunded_cents). The refund is a compensating action that moves 9000 cents from one component to the other without changing the sum, and it does so without deleting or editing the original charge row - the audit trail survives (routing_state stays ROUTED_PAYER, refunded_amount_cents records the movement). An implementation that simply decrements payer_billed_cents breaks the sum; one that deletes the charge loses the audit trail while accidentally preserving nothing."
        test_recipe:
          setup:
            - "Identical to audit_refund_resolution_reroutes_and_rebalances_ledger: a 9000-cent ROUTINE_CARE charge reviewed CLEAR_TO_PAYER on a study with a qualifying determination, an IMPROPER_PAYER_BILL finding opened by auditor_1 and responded to by auditor_2, with the payer position observed immediately before resolution."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T08:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-Z", title: "Payer invariant probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000024" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "80053", service_date: "2026-08-18", amount_cents: 9000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id" }
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "CLEAR_TO_PAYER" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/audit-findings"
              payload: { study_id: "${study_id}", charge_id: "${charge_id}", finding_type: "IMPROPER_PAYER_BILL", claimed_amount_cents: 9000 }
              as: AuditLiaison
              as_user_id: "auditor_1"
              captures: { finding_id: "$.data.id" }
            - call: "POST /research-billing/audit-findings/${finding_id}/respond"
              payload: { response_narrative: "Agreed - the payer was billed for a sponsor-paid item; refunding." }
              as: AuditLiaison
              as_user_id: "auditor_2"
            - call: "GET /research-billing/studies/${study_id}/charge-review-summary"
              as: AuditLiaison
              as_user_id: "auditor_2"
              captures: { billed_before: "$.data.payer_billed_cents", refunded_before: "$.data.payer_refunded_cents", sponsor_unbilled_before: "$.data.sponsor_unbilled_cents" }
          trigger:
            - call: "POST /research-billing/audit-findings/${finding_id}/resolve"
              payload: { disposition: "REFUND_AND_REROUTE" }
              as: AuditLiaison
              as_user_id: "auditor_2"
          assert:
            - "setup: billed_before == 9000, refunded_before == 0, sponsor_unbilled_before == 0, so the conserved sum payer_billed + payer_refunded == 9000 before the compensating action"
            - "trigger response 200 with status \"CLOSED_REFUNDED\" and refund_amount_cents == 9000"
            - "GET /research-billing/studies/${study_id}/charge-review-summary after the trigger shows payer_billed_cents == 0 and payer_refunded_cents == 9000 - the sum is still exactly 9000"
            - "the original charge is still present with routing_state \"ROUTED_PAYER\", billing_state \"REFUNDED\", amount_cents 9000 and refunded_amount_cents 9000 - nothing was deleted or overwritten"
            - "the same summary shows sponsor_unbilled_cents == 9000: the compensating action conserved the payer sum while opening an equal sponsor obligation, so no money vanished from the study ledger"
            - "resolving the same finding again returns 409 ERR_FINDING_NOT_RESPONDED, so the invariant cannot be broken by replaying the compensation"

      - name: invoice_dispute_release_conserves_sponsor_position_and_aging
        grounds: "§1.3 calculations.study_ledger_rollup INVARIANT S (sponsor_unbilled_cents + sponsor_receivable_cents unchanged by submission and by dispute release); §1.2 Charge BL-3 and its compensating action BL-4, which preserves unbilled_since; §1.2 SponsorInvoice SUBMITTED -> DISPUTED."
        distinguishing_aspect: "A different conserved quantity - the sponsor position (sponsor_unbilled_cents + sponsor_receivable_cents) - and a second conserved fact the refund case does not have: Charge.unbilled_since is preserved across the release, so the released charge keeps aging from its original date instead of restarting the clock. An implementation that re-stamps unbilled_since on release conserves the money but silently resets a 40-day-old receivable to day 0, which is exactly the drift the invariant exists to catch."
        test_recipe:
          setup:
            - "One study at effective_indirect_rate_pct 32.0 with one 40000-cent sponsor-routed charge whose unbilled_since is 2026-08-01T00:00:00Z. An invoice is raised and SUBMITTED, moving the charge to INVOICED_SPONSOR. The clock then advances to 2026-09-15 and an aging run records the charge's position, before the sponsor disputes the invoice."
