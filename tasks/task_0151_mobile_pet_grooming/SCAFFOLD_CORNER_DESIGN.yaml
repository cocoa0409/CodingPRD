              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-07-15T09:30:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: Dispatcher
            - call: "GET /customers/${cust_id}/fee-charges"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /fee-charges/${fee_id}/waive"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.settlement_status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              captures: { strikes: $.data.no_show_strikes, outstanding: $.data.outstanding_fee_cents }
          assert:
            - "FeeCharge.${fee_id}.settlement_status == WAIVED."
            - "Customer.${cust_id}.no_show_strikes == 0 and outstanding_fee_cents == 0 after waive."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: schedule_response_reflects_all_changes_immediately
        claim_type: immediate
        grounds:
          - state_machines.Appointment.QUOTED_to_SCHEDULED
          - entities.Appointment.fields.route_stop_id
          - entities.Appointment.fields.groomer_id
        distinguishing_aspect: "The schedule response immediately carries route_stop_id and groomer_id populated and status SCHEDULED — no eventual lag."
        test_recipe:
          setup: ["A QUOTED appointment ready to schedule onto an OPEN matching route day."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Sheltie", coat_type: "DOUBLE", size_class: "SMALL", base_service_minutes: 45 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "cg14@x.com", full_name: "CG Fourteen", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "CVAN-15", max_stops: 5 }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce25@x.com", full_name: "CE TwentyFive", service_zip: "10029" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Shel", weight_lbs: 22 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-07-16T00:00:00Z", window_start: "2026-07-16T09:00:00Z", window_end: "2026-07-16T17:00:00Z", coverage_zip: "10029" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /appointments/${appt_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-07-16T09:30:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
              captures: { st: $.data.status, rs: $.data.route_stop_id, gid: $.data.groomer_id }
          assert:
            - "Schedule response: status == SCHEDULED, route_stop_id is non-null, groomer_id == ${groomer_id}."

  # =========================================================================
  # Stubs — corners already exercised by §1.8 difficulty instances
  # =========================================================================
  - section: calculations
    instances:
      - name: quote_vs_final_divergence_stub
        claim_type: Variant Divergence
        grounds:
          - calculations.quote_price
          - calculations.final_price
        excluded_because:
          difficulty_instance: dual_variant_calc / quote_vs_final_price_diverge_on_skipped_addon
          rationale: "Quote-vs-final divergence on a skipped add-on is the asserted outcome of the named §1.8 instance."

      - name: duration_estimate_correct_result_stub
        claim_type: Correct Result
        grounds:
          - calculations.duration_estimate
        excluded_because:
          difficulty_instance: combinatorial_formula / duration_estimate_multifactor_nonlinear
          rationale: "duration_estimate == 165 is the asserted outcome of the named §1.8 instance."

  - section: state_machines
    instances:
      - name: routeday_bubble_up_close_stub
        claim_type: Bubble up
        grounds:
          - state_machines.RouteDay.LOCKED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / complete_cascade_stop_serviced_route_closed_depth2
          rationale: "RouteDay auto-CLOSE on last terminal stop is asserted by the named §1.8 cascade instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: cancel_void_reconciles_booked_minutes_stub
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.route_load_capacity
          - entities.RouteDay.fields.booked_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_void_conserves_route_booked_minutes
          rationale: "booked_minutes reconciliation on VOID is asserted by the named §1.8 invariant instance."
