scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: billable_contacts_current_vs_peak_cycle
        grounds:
          - calculations.billable_contact_count
          - entities.Account.fields.billable_contact_count
          - entities.BillingCycle.fields.peak_contact_count
          - state_machines.ImportJob.COMPLETED_to_ROLLED_BACK
        distinguishing_aspect: |
          The dual variant lives on the ACCOUNT/BILLING domain: from one identical
          subscriber population, variant CURRENT (Account.billable_contact_count)
          collapses to 0 when an import is rolled back, while variant PEAK_CYCLE
          (BillingCycle.peak_contact_count) is monotone and stays at 3 -- so the
          invoice bills 3 contacts for a list that now holds none.
        test_recipe:
          setup:
            - "One ESSENTIALS account with one single-opt-in audience."
            - "A COMPLETED ImportJob has added exactly 3 CONFIRMED subscribers."
            - "The logical clock has advanced to 2026-05-10T00:00:00Z and one ops run has snapshotted the account's contact count into its still-OPEN first BillingCycle."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id, aud_v: $.data.version }
            - call: "POST /audiences/${aud}/import-jobs"
              payload: { rows: [{ email: "a1@x.com" }, { email: "a2@x.com" }, { email: "a3@x.com" }], expected_audience_version: "${aud_v}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { job: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /import-jobs/${job}/rollback"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
          assert:
            - "ImportJob.${job}.status == \"ROLLED_BACK\""
            - "ImportJob.${job}.accepted_count == 3"
            - "Audience.${aud}.subscriber_count == 0"
            - "Account.${acct}.billable_contact_count == 0   # variant CURRENT"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].peak_contact_count == 3   # variant PEAK_CYCLE, unchanged by the rollback"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].status == \"OPEN\""

      - name: subscriber_engagement_lifetime_vs_rolling_90d
        grounds:
          - calculations.subscriber_engagement_score
          - entities.Subscriber.fields.engagement_score
          - entities.Subscriber.fields.engagement_score_90d
          - entities.Send.fields.delivered_at
        distinguishing_aspect: |
          The second dual variant lives on a DIFFERENT entity domain -- the
          SUBSCRIBER, not the account/billing ledger. From one identical send
          history (an old delivered+opened+clicked send and a recent
          delivered+opened send), variant LIFETIME scores 70 while variant
          ROLLING_90D scores 40, because the 4-month-old click falls outside the
          90-day window and the click weight (0.6) is lost.
        test_recipe:
          setup:
            - "One FREE account, one single-opt-in audience, one CONFIRMED subscriber s1."
            - "Campaign C1 was dispatched at 2026-05-02T10:00:00Z; its send to s1 was DELIVERED, OPENED and CLICKED."
            - "Campaign C2 was dispatched at 2026-09-02T10:00:00Z (123 days later); its send to s1 has been DELIVERED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "FREE", initial_send_credits: 50, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { s1: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "Spring Sale", html_body: "<p>Hi</p><a href=\"{{unsubscribe_url}}\">unsubscribe</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { acct_v1: $.data.version }
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${acct_v1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sends"
              payload: { campaign_id: "${c1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { snd1: "$.data[0].id" }
            - call: "POST /_events/emit"
              payload: { send_id: "${snd1}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${snd1}", kind: "OPEN" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${snd1}", kind: "CLICK" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C2" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c2: $.data.id }
            - call: "POST /campaigns/${c2}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c2}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { acct_v2: $.data.version }
            - call: "POST /campaigns/${c2}/schedule"
              payload: { scheduled_at: "2026-09-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${acct_v2}" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sends"
              payload: { campaign_id: "${c2}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { snd2: "$.data[0].id" }
            - call: "POST /_events/emit"
              payload: { send_id: "${snd2}", kind: "DELIVERED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_events/emit"
              payload: { send_id: "${snd2}", kind: "OPEN" }
              as: PlatformAdmin
          assert:
            - "Subscriber.${s1}.delivered_send_count == 2"
            - "Subscriber.${s1}.engagement_score == 70    # LIFETIME: base 100*(0.4*1.0 + 0.6*0.5) = 70.0, recency 1.0, volume_bonus 0"
            - "Subscriber.${s1}.engagement_score_90d == 40 # ROLLING_90D: only the 2026-09-02 send is in-window -> base 100*(0.4*1.0 + 0.6*0.0) = 40.0"
            - "Subscriber.${s1}.engagement_state == \"ENGAGED\""

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tiered_contact_billing_round_per_block_then_sum
        grounds:
          - calculations.tiered_contact_billing
          - entities.BillingCycle.fields.overage_cents
          - entities.BillingCycle.fields.total_cents
          - state_machines.BillingCycle.OPEN_to_CLOSED
        distinguishing_aspect: |
          MODE (b) -- nested rounding whose ORDER changes the cents. With
          peak_contact_count 13 on ESSENTIALS (included 5, discount 10%), the two
          overage blocks are 5 and 3 contacts at 27.0 cents each: rounding EACH
          block first (round_half_up(121.5)=122, round_half_up(72.9)=73) gives
          overage 195, while summing the raw block amounts first
          (round_half_up(194.4)) gives 194. The scaffold pins round-per-block-then-sum,
          so the invoice total is 1495, not 1494.
        test_recipe:
          setup:
            - "One ESSENTIALS account (base fee 1300 cents, 5 included contacts, 10% overage discount)."
            - "One single-opt-in audience holding exactly 13 CONFIRMED subscribers imported in one job."
            - "The logical clock sits exactly on the first cycle's period_end, 2026-05-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 0, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id, aud_v: $.data.version }
            - call: "POST /audiences/${aud}/import-jobs"
              payload:
                rows: [{ email: "c01@x.com" }, { email: "c02@x.com" }, { email: "c03@x.com" }, { email: "c04@x.com" }, { email: "c05@x.com" }, { email: "c06@x.com" }, { email: "c07@x.com" }, { email: "c08@x.com" }, { email: "c09@x.com" }, { email: "c10@x.com" }, { email: "c11@x.com" }, { email: "c12@x.com" }, { email: "c13@x.com" }]
                expected_audience_version: "${aud_v}"
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { job: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
              captures: { closed: $.data.billing_cycles_closed }
          assert:
            - "ImportJob.${job}.status == \"COMPLETED\" and ImportJob.${job}.accepted_count == 13"
            - "${closed} == 1"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].status == \"CLOSED\""
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].peak_contact_count == 13"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].tier_applied == \"ESSENTIALS\""
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].base_fee_cents == 1300"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].overage_cents == 195"
            - "GET /accounts/${acct}/billing-cycles -> $.data[0].total_cents == 1495"
            - "GET /accounts/${acct}/billing-cycles -> $.data[1].status == \"OPEN\"   # the rolled-forward cycle"

      - name: campaign_send_charge_discount_keyed_on_presurcharge_subtotal
        grounds:
          - calculations.campaign_send_charge_cents
          - calculations.sender_reputation_score
          - entities.Campaign.fields.send_charge_cents
          - state_machines.Campaign.APPROVED_to_SCHEDULED
        distinguishing_aspect: |
          MODE (c) -- a circular-looking dependency whose evaluation order the
          scaffold pins. With 7 recipients and a reputation of 80, subtotal_raw is
          19.6 cents. The pinned order keys the volume-discount tier on
          subtotal_raw (19.6 < 20 -> 0%), then adds a 5% surcharge on the
          post-discount base: 20 - 0 + 1 = 21. The naive circular reading -- key the
          discount on the TOTAL, which already contains the surcharge (20 + 1 = 21
          >= 20 -> 5%) -- yields 20. The observable answer is 21.
        test_recipe:
          setup:
            - "One STANDARD account with 100 send credits and hourly_send_capacity 100."
            - "One single-opt-in audience with 7 CONFIRMED subscribers."
            - "Campaign C1 (5 recipients) has already been dispatched; 3 of its sends are DELIVERED and 2 are SOFT_BOUNCED, so Account.sender_reputation_score == 80 (raw = 100 - 0.5 * 40)."
            - "Campaign C2 is APPROVED and not yet scheduled."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "STANDARD", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s3@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s4@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s5@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "Spring Sale", html_body: "<p>Hi</p><a href=\"{{unsubscribe_url}}\">unsubscribe</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { acct_v1: $.data.version }
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${acct_v1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sends"
              payload: { campaign_id: "${c1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { sd1: "$.data[0].id", sd2: "$.data[1].id", sd3: "$.data[2].id", sd4: "$.data[3].id", sd5: "$.data[4].id" }
            - call: "POST /_events/emit"
              payload: { send_id: "${sd1}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${sd2}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${sd3}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${sd4}", kind: "SOFT_BOUNCE" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${sd5}", kind: "SOFT_BOUNCE" }
              as: PlatformAdmin
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s6@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s7@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C2" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c2: $.data.id }
            - call: "POST /campaigns/${c2}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c2}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /campaigns/${c2}/schedule"
              payload: { scheduled_at: "2026-05-02T18:00:00Z", send_window_minutes: 60, expected_account_version: "${acct_v2}" }
              as: CampaignAuthor
              as_user_id: "${author}"
          assert:
            - "Account.${acct}.sender_reputation_score == 80"
            - "Campaign.${c2}.status == \"SCHEDULED\""
            - "Campaign.${c2}.recipient_count == 7"
            - "Campaign.${c2}.send_charge_cents == 21"
            - "Account.${acct}.send_credit_balance == 88   # 100 - 5 (C1) - 7 (C2)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: campaign_review_revision_cycle_in_review_draft_in_review_approved
        grounds:
          - state_machines.Campaign.IN_REVIEW_to_DRAFT
          - state_machines.Campaign.DRAFT_to_IN_REVIEW
          - state_machines.Campaign.IN_REVIEW_to_APPROVED
          - entities.Campaign.fields.pinned_template_version
        distinguishing_aspect: |
          Non-linearity type: CYCLE, on the CAMPAIGN entity. REQUEST_CHANGES walks
          IN_REVIEW back to DRAFT and clears approved_by_user_id and all three
          template pins; the campaign then re-enters IN_REVIEW and is approved, so
          the same edge DRAFT -> IN_REVIEW is traversed twice in one lifetime.
        test_recipe:
          setup:
            - "One account with a CAMPAIGN_AUTHOR and a separate COMPLIANCE_APPROVER."
            - "One PUBLISHED template (version 2 -- created at 1, bumped to 2 by publish) containing the {{unsubscribe_url}} merge tag."
            - "Campaign C1 authored by the author and sitting in IN_REVIEW."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "Spring Sale", html_body: "<p>Hi</p><a href=\"{{unsubscribe_url}}\">unsubscribe</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
          trigger:
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "REQUEST_CHANGES", note: "subject is too long" }
              as: ComplianceApprover
              as_user_id: "${approver}"
              captures: { st_after_reject: $.data.status, appr_after_reject: $.data.approved_by_user_id, pin_after_reject: $.data.pinned_subject }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE", note: "ship it" }
              as: ComplianceApprover
              as_user_id: "${approver}"
          assert:
            - "${st_after_reject} == \"DRAFT\""
            - "${appr_after_reject} == null"
            - "${pin_after_reject} == null"
            - "Campaign.${c1}.status == \"APPROVED\""
            - "Campaign.${c1}.approved_by_user_id == \"${approver}\""
