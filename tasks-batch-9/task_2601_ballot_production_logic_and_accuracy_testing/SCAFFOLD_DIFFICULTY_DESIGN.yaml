          Under PRECINCT_ROTATION the district ordinal d drops OUT of the formula and g becomes
          seed mod N, so two styles of the same election over the same contest print different
          permutations (seed 1 -> g == 1, seed 2 -> g == 2) while the base ordering is fixed by
