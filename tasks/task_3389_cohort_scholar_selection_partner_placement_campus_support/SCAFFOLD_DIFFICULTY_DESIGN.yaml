  - rule_id: non_linear_state_machine
    instances:
      - name: nominee_waitlist_selection_cycle
        grounds:
          - state_machines.Nominee.ROUND_3_to_WAITLISTED
          - state_machines.Nominee.WAITLISTED_to_SELECTED
        distinguishing_aspect: |
          Non-linear cycle on Nominee: ROUND_3 -> WAITLISTED -> SELECTED loops a
          candidate back into the selection flow instead of terminating the
          pipeline (a linear machine would force ROUND_3 -> SELECTED | DROPPED
          only). The sibling non-linear machine is Cohort's LOCKED -> FORMING
          revert (cohort_lock_unlock_revert) — different entity.
        test_recipe:
          setup:
            - "Nominee W in ROUND_3 with two round-3 evaluations (round_3_score 900)"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
