# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Propane Wholesale & Terminal Supply — 9 rules x >=2 instances = 24 instances
# All money arithmetic below was executed against the §1.3 formulas:
#   rhu(gal * mc / 1000) per segment, then sum. Z1 freight 8000 mc/gal min 150000c.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: index_order_provisional_vs_final_diverge
        grounds: [calculations.delivered_price, state_machines.DeliveryOrder.SCHEDULED_to_LOADED]
        distinguishing_aspect: |
          Dual variant on the DeliveryOrder domain: the same INDEX-priced order yields
          provisional_total_cents computed against the index effective at creation (95000 mc)
          and final_total_cents computed against the index effective on the load date
          (98000 mc on 2026-08-10) — identical order, different results.
        test_recipe:
          setup:
            - "Terminal with 400000 gal on hand (summer), zone Z1 (8000 mc/gal, min 150000c, 120 min), truck U-01 (cap 11000, 3600 min)"
            - "Dealer limit 100000000; INDEX contract committed 50000 ACTIVE; index MT_BELVIEU 95000 mc effective 2026-08-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-D1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /trucks"
              payload: { terminal_id: "${term}", unit_number: "U-01", capacity_gal: 11000, weekly_hours_limit_minutes: 3600 }
              as: SupplyAdmin
              captures: { tk1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer D1", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-01", price_mc_per_gal: 95000 }, as: PricingDesk }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "INDEX", volume_committed_gal: 50000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 10000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord: $.data.id }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-10", price_mc_per_gal: 98000 }, as: PricingDesk }
            - { call: "POST /delivery-orders/${ord}/schedule", payload: { truck_id: "${tk1}", planned_load_start: "2026-08-10T08:00:00Z", planned_load_end: "2026-08-10T10:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /delivery-orders/${ord}/load", payload: {}, as: Dispatcher }
            - call: "GET /delivery-orders/${ord}"
              as: Dispatcher
              captures: { prov: $.data.provisional_total_cents, fin: $.data.final_total_cents }
          assert:
            - "DeliveryOrder.${ord}.provisional_total_cents == 1100000  # 10000*95000/1000=950000 + max(150000, 80000)=150000"
            - "DeliveryOrder.${ord}.final_total_cents == 1130000      # 10000*98000/1000=980000 + 150000"
            - "provisional_total_cents != final_total_cents (1100000 != 1130000)"

      - name: dealer_exposure_ledger_vs_committed_diverge
        grounds: [calculations.dealer_credit_exposure, entities.Dealer.fields.committed_exposure_cents]
        distinguishing_aspect: |
          Dual variant on the Dealer domain (different entity domain than
          index_order_provisional_vs_final_diverge): ledger exposure counts only OPEN
          invoice balances (actuals) while committed exposure adds ALLOCATED-pipeline
          provisionals — same dealer, same instant, 1680000 vs 2305000 cents.
        test_recipe:
          setup:
            - "Same base fixture: terminal 400000 gal, Z1, truck U-01, dealer limit 100000000, index 95000"
            - "FIXED contract 90000 mc committed 100000 ACTIVE; order1 17000 gal driven to DELIVERED (invoice OPEN 1680000)"
            - "INDEX contract committed 50000 then activated (supersedes FIXED, whose only order is already DELIVERED); order2 5000 gal INDEX -> ALLOCATED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-D2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /trucks"
              payload: { terminal_id: "${term}", unit_number: "U-01", capacity_gal: 11000, weekly_hours_limit_minutes: 3600 }
              as: SupplyAdmin
              captures: { tk1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer D2", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-01", price_mc_per_gal: 95000 }, as: PricingDesk }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc1: $.data.id }
            - { call: "POST /dealer-contracts/${dc1}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc1}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 17000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord1: $.data.id }
            - { call: "POST /delivery-orders/${ord1}/schedule", payload: { truck_id: "${tk1}", planned_load_start: "2026-08-03T08:00:00Z", planned_load_end: "2026-08-03T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /delivery-orders/${ord1}/load", payload: {}, as: Dispatcher }
            - { call: "POST /delivery-orders/${ord1}/deliver", payload: {}, as: Dispatcher }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "INDEX", volume_committed_gal: 50000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc2: $.data.id }
            - call: "GET /dealers/${dl}"
              as: CreditManager
              captures: { dl_v2: $.data.version }
            - { call: "POST /dealer-contracts/${dc2}/activate", payload: { expected_dealer_version: "${dl_v2}" }, as: CreditManager }
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc2}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 5000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord2: $.data.id }
          trigger:
            - call: "GET /dealers/${dl}"
              as: CreditManager
              captures: { led: $.data.ledger_exposure_cents, com: $.data.committed_exposure_cents }
          assert:
            - "Dealer.${dl}.ledger_exposure_cents == 1680000     # only the OPEN invoice on order1"
            - "Dealer.${dl}.committed_exposure_cents == 2305000  # 1680000 + 625000 provisional of ALLOCATED order2"
            - "ledger_exposure_cents != committed_exposure_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: delivered_price_tiered_band_overage_min_freight
        grounds: [calculations.delivered_price]
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs with non-linear interaction — in-band/overage
          tier split at the committed-band boundary, min() freight floor, and a conditional
          index premium — contract committed 12000 with 9500 drawn makes a 10000-gal order
          straddle: 2500 gal at 90000 mc + 7500 gal at 120000 mc + max(150000, 80000) freight.
        test_recipe:
          setup:
            - "Base fixture; FIXED contract 90000 mc committed exactly 12000 gal; order1 9500 gal LOADED so volume_drawn_gal == 9500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-C1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /trucks"
              payload: { terminal_id: "${term}", unit_number: "U-01", capacity_gal: 11000, weekly_hours_limit_minutes: 3600 }
              as: SupplyAdmin
              captures: { tk1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer C1", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-01", price_mc_per_gal: 95000 }, as: PricingDesk }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 12000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 9500 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord1: $.data.id }
            - { call: "POST /delivery-orders/${ord1}/schedule", payload: { truck_id: "${tk1}", planned_load_start: "2026-08-03T08:00:00Z", planned_load_end: "2026-08-03T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /delivery-orders/${ord1}/load", payload: {}, as: Dispatcher }
          trigger:
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dc}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 10000 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { ord2: $.data.id, prov2: $.data.provisional_total_cents }
          assert:
            - "DeliveryOrder.${ord2}.fulfillment_status == ALLOCATED"
            - "DeliveryOrder.${ord2}.provisional_total_cents == 1275000  # rhu(2500*90000/1000)=225000 + rhu(7500*120000/1000)=900000 + max(150000, 80000)=150000"
            - "DeliveryOrder.${ord1}.final_total_cents == 1005000        # 855000 + 150000; drawn band 9500 confirmed"
      - name: allocation_floor_then_remainder_distribution
        grounds: [calculations.allocation_pro_rata_waterfall, state_machines.AllocationRun.OPEN_to_COMPUTED, state_machines.AllocationRun.COMPUTED_to_RATIFIED]
        distinguishing_aspect: |
          Mode (b) nested-rounding order: shares are floored per order FIRST and the remainder
          gallon is distributed by created_at ASC — pool 100000 over 3 equal-weight spot orders
          yields 33334/33333/33333, whereas round-half-up per order would strand the extra gallon.
        test_recipe:
          setup:
            - "Base fixture; dealer R FIXED contract committed 300000; one 250000-gal order ALLOCATED pre-curtailment so ATP = 400000 - 50000 - 250000 = 100000"
            - "Cold snap ACTIVE (terminal CURTAILED); dealer S posts three SPOT orders of 40000 gal each, all REQUESTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-C2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer R", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dlr: $.data.id, dlr_v: $.data.version }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-01", price_mc_per_gal: 95000 }, as: PricingDesk }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dlr}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 300000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dcr: $.data.id }
            - { call: "POST /dealer-contracts/${dcr}/activate", payload: { expected_dealer_version: "${dlr_v}" }, as: CreditManager }
            - call: "POST /delivery-orders"
              payload: { dealer_contract_id: "${dcr}", terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 250000 }
              as: DealerUser
              as_user_id: "${dlr}"
              captures: { ord_big: $.data.id }
            - call: "POST /cold-snap-events"
              payload: { terminal_id: "${term}", severity: "WARNING", start_date: "2026-08-01", end_date: "2026-08-20" }
              as: SupplyPlanner
              captures: { cs: $.data.id }
            - { call: "POST /cold-snap-events/${cs}/activate", payload: {}, as: SupplyPlanner }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer S", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dls: $.data.id }
            - call: "POST /delivery-orders"
              payload: { terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 40000 }
              as: DealerUser
              as_user_id: "${dls}"
              captures: { s1: $.data.id }
            - call: "POST /delivery-orders"
              payload: { terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 40000 }
              as: DealerUser
              as_user_id: "${dls}"
              captures: { s2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { terminal_id: "${term}", freight_zone_id: "${z1}", requested_gal: 40000 }
              as: DealerUser
              as_user_id: "${dls}"
              captures: { s3: $.data.id }
            - call: "GET /terminals/${term}"
              as: SupplyPlanner
              captures: { t_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { terminal_id: "${term}", expected_terminal_version: "${t_v}" }
              as: SupplyPlanner
              captures: { run: $.data.id }
            - { call: "POST /allocation-runs/${run}/compute", payload: {}, as: SupplyPlanner }
          trigger:
            - { call: "POST /allocation-runs/${run}/ratify", payload: {}, as: SupplyPlanner }
            - { call: "GET /delivery-orders/${s1}", as: SupplyPlanner, captures: { a1: $.data.allocated_gal } }
            - { call: "GET /delivery-orders/${s2}", as: SupplyPlanner, captures: { a2: $.data.allocated_gal } }
            - { call: "GET /delivery-orders/${s3}", as: SupplyPlanner, captures: { a3: $.data.allocated_gal } }
          assert:
            - "AllocationRun.${run}.pool_gal == 100000"
            - "DeliveryOrder.${s1}.allocated_gal == 33334   # earliest created_at receives the remainder gallon"
            - "DeliveryOrder.${s2}.allocated_gal == 33333"
            - "DeliveryOrder.${s3}.allocated_gal == 33333"
            - "DeliveryOrder.${s1}.fulfillment_status == ALLOCATED (partial allocation, allocated < requested 40000)"
      - name: credit_gate_circular_eval_order
        grounds: [calculations.credit_gate_evaluation, calculations.delivered_price, calculations.credit_status_threshold]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the candidate
          order's price includes CREDIT_WATCH_SURCHARGE_MC only because the dealer's status is
          evaluated EXCLUDING the candidate (committed 4635000 of 5700000 = WATCH) — the same
          inputs evaluated after inclusion would change the surcharge base.
        test_recipe:
          setup:
            - "Base fixture; dealer limit 5700000 (80% = 4560000); INDEX contract committed 100000 ACTIVE"
            - "order1 45000 gal INDEX -> ALLOCATED: committed_before for order2 == 4635000 -> WATCH"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-C3", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-07-01", receipt_window_end: "2026-09-30" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 400000, railcar_count: 20, scheduled_arrival_date: "2026-08-05" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "IN_TRANSIT" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "ARRIVED" }, as: SupplyAdmin }
            - { call: "POST /rail-shipments/${ship}/transition", payload: { to_state: "UNLOADED" }, as: SupplyAdmin }
            - call: "POST /freight-zones"
              payload: { terminal_id: "${term}", zone_code: "Z1", one_way_drive_minutes: 120, freight_mc_per_gal: 8000, min_freight_cents: 150000 }
              as: SupplyAdmin
              captures: { z1: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer C3", credit_limit_cents: 5700000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-01", price_mc_per_gal: 95000 }, as: PricingDesk }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "INDEX", volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
