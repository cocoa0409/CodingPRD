            - "${est} == 228000, ${sel_mode} == MANUAL and ${sel_score} == 89.90  # EMERGENCY weights are still recorded on a manual assignment"
            - "HTTP 200 with ${breached} == [${dispatch_id}]  # sla_deadline_at <= clock is a breach at exactly the deadline"
