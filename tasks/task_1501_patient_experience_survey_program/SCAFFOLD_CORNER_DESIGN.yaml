            - "ServiceRecoveryTicket.${tkt}.status remains OPEN (no escalation on the MET branch)"
            - "SurveyResponse.${rsp}.has_escalated_recovery == false"
            - "ImprovementInitiative.${ini}.progress_pinned == 8.0 (88.00 - 80.00)"

      - name: discharge_reinstate_excluded_to_eligible
        claim_type: valid_transition
        grounds:
          - state_machines.Discharge.EXCLUDED_to_ELIGIBLE
        distinguishing_aspect: "A discharge EXCLUDED at intake evaluation can be reinstated to ELIGIBLE by evaluate with corrected overrides (revision loop), with exclusion_reasons cleared."
        test_recipe:
          setup: ["program P; discharge created with disposition EXPIRED, evaluated -> EXCLUDED"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-SM7", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/discharges", payload: { program_id: "${pg}", mrn: "M-900", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "EXPIRED", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 80, address_country: "US", no_publicity_flag: false, custody_status: "NONE" }, as: DataSteward, captures: { d: "$.data.id" } }
            - { call: "POST /api/discharges/${d}/evaluate", payload: {}, as: DataSteward, captures: { st1: "$.data.status" } }
          trigger:
            - { call: "POST /api/discharges/${d}/evaluate", payload: { discharge_disposition: "HOME" }, as: DataSteward, captures: { st2: "$.data.status" } }
          assert:
            - "first evaluate: status == EXCLUDED, exclusion_reasons == [EXPIRED]"
            - "re-evaluate with corrected disposition: status == ELIGIBLE, exclusion_reasons == []"

  # ======================================================== calculations ====
  - section: calculations
    instances:
      - name: response_rate_denominator_state_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.response_rate
        distinguishing_aspect: "The denominator counts only IN_FIELD/RESPONDED/NONRESPONSE cases: 30 fielded, 1 marked UNDELIVERABLE -> denominator 29; 25 completed -> response_rate == 86.21 (round_half_up(100*25/29, 2))."
        test_recipe:
          setup: ["cycle FIELDING with 30 cases; 1 case UNDELIVERABLE; 25 ACCEPTED responses"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CA1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 30, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/sample-cases/${c_ids[0]}/mark-undeliverable", payload: {}, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids[1:26]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
          trigger:
            - { call: "GET /api/cycles/${cy}", payload: {}, as: Any }
          assert:
            - "SurveyCycle.${cy}.eligible_denominator == 29 (UNDELIVERABLE case excluded)"
            - "SurveyCycle.${cy}.completed_responses == 25"
            - "SurveyCycle.${cy}.response_rate == 86.21"
            - "SurveyCycle.${cy}.sampled_count == 30"

      - name: topbox_composites_computed_independently
        claim_type: correct_result
        grounds:
          - calculations.top_box_composite_scores
        distinguishing_aspect: "Each composite is computed independently: with all 25 MAIL responses scored nurse=4, doctor=3, cleanliness=4, overall=3 the scored snapshot reads nurse 100.0, doctor 0.0, cleanliness 100.0, overall 0.0 (raw == adjusted for MAIL)."
        test_recipe:
          setup: ["cycle in SCORING; 25 MAIL responses with per-composite scores (4,3,4,3)"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CA2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 3, cleanliness_score: 4, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/cycles/${cy}", payload: {}, as: Any }
          assert:
            - "scored_raw_composite_pcts == { nurse_comm: 100.0, doctor_comm: 0.0, cleanliness: 100.0, overall_rating: 0.0 }"
            - "scored_adjusted_composite_pcts identical to raw (MAIL coefficient 0.0)"

      - name: sla_48h_boundary_inclusive
        claim_type: boundary
        grounds:
          - calculations.service_recovery_sla
        distinguishing_aspect: "The 48h SLA boundary is INCLUSIVE: acknowledged exactly 48h00m00s after creation -> true; at 48h00m01s -> false."
        test_recipe:
          setup: ["two tickets created at the default logical clock 2026-08-01T00:00:00Z from two commented responses"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CA3", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 2, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3, comment_text: "c1" }, as: VendorOperator, as_user_id: "${vn}", captures: { r1: "$.data.id" } }
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[1]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3, comment_text: "c2" }, as: VendorOperator, as_user_id: "${vn}", captures: { r2: "$.data.id" } }
            - { call: "POST /api/service-recovery-tickets", payload: { unit_id: "${un}", response_id: "${r1}", domain: "OVERALL_RATING", priority: "LOW" }, as: UnitManager, as_user_id: "${un}", captures: { t1: "$.data.id" } }
            - { call: "POST /api/service-recovery-tickets", payload: { unit_id: "${un}", response_id: "${r2}", domain: "OVERALL_RATING", priority: "LOW" }, as: UnitManager, as_user_id: "${un}", captures: { t2: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/service-recovery-tickets/${t1}/acknowledge", payload: {}, as: UnitManager, as_user_id: "${un}", captures: { sla1: "$.data.acknowledged_within_sla" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: ProgramAdmin }
            - { call: "POST /api/service-recovery-tickets/${t2}/acknowledge", payload: {}, as: UnitManager, as_user_id: "${un}", captures: { sla2: "$.data.acknowledged_within_sla" } }
          assert:
            - "ticket ${t1}: exactly 48h -> acknowledged_within_sla == true"
            - "ticket ${t2}: 48h + 1s -> acknowledged_within_sla == false"

      - name: star_rating_not_rated_below_min_count
        claim_type: boundary
        grounds:
          - calculations.star_rating
        distinguishing_aspect: "The minimum-N guard: completed_responses == 24 (< 25) yields rating_status NOT_RATED with stars == null, regardless of a perfect 100.0 adjusted percentage."
        test_recipe:
          setup: ["cycle SCORING with 24 completed all-4 MAIL responses"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CA4", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 24, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/cycles/${cy}/star-rating", payload: {}, as: Any }
          assert:
            - "rating_status == NOT_RATED and stars == null (completed 24 < 25)"
            - "capped == false"

      - name: initiative_evaluation_unit_absent_scores_zero
        claim_type: input_set_filtering
        grounds:
          - calculations.initiative_evaluation
        distinguishing_aspect: "When the initiative's unit has no scored responses in the evaluation cycle (absent from scored_unit_breakdown), current is defined as 0.0: the initiative lands TARGET_MISSED and progress_pinned == 0.0 - 80.00 == -80.0."
        test_recipe:
          setup:
            - "Cycle idx1 PUBLISHED with 20 all-4 + 5 all-3 on unit U1 (cleanliness adjusted 80.00)"
            - "Cycle idx2 PUBLISHED with 25 all-4 responses ALL on unit U2; initiative (U1, CLEANLINESS, baseline idx1, evaluation idx2, target 50.0) ACTIVE"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CA5", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
