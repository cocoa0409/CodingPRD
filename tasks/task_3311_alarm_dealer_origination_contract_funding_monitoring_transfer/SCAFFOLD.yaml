    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/alarm-funding/dealers/{id}/chargeback-rate-recompute"
    description: "Recompute the dealer chargeback rate over the trailing 12 logical months and re-derive standing"
    roles: [FundingAnalyst]
    code: 200
    input: [expected_dealer_version]
    output: Dealer
    side_effects: ["runs dealer_chargeback_rate and dealer_standing_derivation", "increments Dealer.version by 1"]

  - method: POST
    path: "/alarm-funding/dealers/{id}/suspend"
    description: "Administratively suspend a dealer, blocking further package approvals"
    roles: [FundingAnalyst]
    code: 200
    input: []
    output: Dealer
    side_effects: ["sets standing = SUSPENDED", "increments Dealer.version by 1"]
  - method: POST
    path: "/alarm-funding/dealers/{id}/reinstate"
    description: "Reinstate a suspended dealer once its balance is clear; the rate band decides ACTIVE or WATCH"
    roles: [FundingAnalyst]
    code: 200
    input: []
    output: Dealer
    side_effects: ["re-derives Dealer.standing from chargeback_balance_due_cents == 0 and the chargeback rate", "increments Dealer.version by 1"]

  # --- Dealer packages -----------------------------------------------------
  - method: POST
    path: "/alarm-funding/dealer-packages"
