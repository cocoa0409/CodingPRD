      - name: a_later_request_on_a_unilateral_lease_withdraws_the_earlier_open_one
        claim_type: Valid Transition
        grounds:
          - state_machines.AircraftSubstitution[REQUESTED -> APPROVED]
          - state_machines.AircraftSubstitution[REQUESTED -> WITHDRAWN]
          - state_machines.AircraftSubstitution[APPROVED -> EFFECTIVE]
          - concurrency_rules.substitution-request-stale-lease
        distinguishing_aspect: |
          On a LESSOR_UNILATERAL lease a request is born APPROVED with no consent step, and at most ONE
          request may be live at a time: filing a second one drives the first APPROVED -> WITHDRAWN, so
          the superseded request can no longer be effectuated (409) while the superseding one can. This
          is exactly why the OCC guard sits on the LEASE - creating the first substitution already
          incremented LeaseAgreement.version, so the second request must present the re-read version.
          Effectuating the winner releases the original airframe and puts G-SUBB on lease with zero legs
          re-pointed.
          
