      - name: forfeit_void_reversal_plus_recredit_keeps_all_four_ledger_invariants
        grounds:
          - calculations.league_standings_ledger_invariant
          - state_machines.Match.VERIFIED_to_VOIDED
          - calculations.match_default_resolution
          - entities.Match.fields.line_results
          - entities.Player.fields.dynamic_rating
        distinguishing_aspect: |
          Voiding a VERIFIED match through a MATCH_FORFEIT remedy is not a plain subtraction: the
          played credits are reversed AND a forfeit credit of 3 lines at 6-0 6-0 is granted to the
          aggrieved team, so Team H falls from standings_points 11 to 6 while Team A RISES from 1
          to 3 without gaining a match win. All four invariants hold afterwards
          (A: 1+1 == 2*1, B: 3+3 == 3+3, C: 6+6 == 6+6 and 36+36 == 36+36, D: 6+3 == 3*1 + 6) and
          every dynamic_rating returns to null because FORFEIT and TEAM_DEFAULT credits never feed
          a rating. An implementation that only reverses, or that also awards the forfeit match
          win, breaks A or D by exactly the forfeit credit.
        test_recipe:
          setup:
            - "Section SOCAL-2026, SECTION league (lines_per_match 3), two six-player rosters, home levels all 4.0 and away levels alternating 4.0/3.5."
            - "Match M1 (home Team H) is played 2026-08-15T18:00:00Z and reviewed to VERIFIED with lines 6-4 6-0 home, 6-4 6-3 home, 4-6 4-6 away: Team H takes 2 lines, 4-2 sets, 32-23 games and 5 points, Team A 1 line and 1 point."
