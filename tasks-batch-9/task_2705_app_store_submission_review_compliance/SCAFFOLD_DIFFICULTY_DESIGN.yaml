  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: queue_gated_by_open_impact_assessment_of_another_entity
        grounds:
          - state_machines.ImpactAssessment.OPEN_to_IN_ASSESSMENT
          - state_machines.ImpactAssessment.IN_ASSESSMENT_to_ACCEPTED_NO_CHANGE
          - state_machines.Submission.PRE_REVIEW_PASSED_to_WAITING_FOR_REVIEW
          - calculations.compliance_posture
          - calculations.impact_severity
          - constants.ACCEPT_NO_CHANGE_SEVERITY_CEILING
          - validations[priority=40]
          - validations[priority=60]
          - errors.ERR_APP_COMPLIANCE_RESTRICTED
          - errors.ERR_REMEDIATION_INCOMPLETE
        distinguishing_aspect: |
          The Submission's own state is legal (PRE_REVIEW_PASSED) and its own app's index is back to
          100.00, yet POST /submissions/{id}/queue stays refused purely because a DIFFERENT entity —
          the ImpactAssessment created by the guideline cascade — is not yet terminal: R4
          OPEN_IMPACT_ASSESSMENT alone holds the posture at RESTRICTED through both OPEN and
          IN_ASSESSMENT, and the answer must be ERR_APP_COMPLIANCE_RESTRICTED (priority 40), never
          ERR_REMEDIATION_INCOMPLETE (priority 60), until ACCEPT_NO_CHANGE makes the row terminal.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE; AppRecord IOS, distribution_state NOT_DISTRIBUTED (so exposure_factor is 1.0)"
            - "PRIVACY rule 5.1.1 version_label 2026.08 EFFECTIVE with one PASSED mapping (index 100.00, posture OPEN)"
            - "Submission build 10 in state PRE_REVIEW_PASSED, pre_review_checked_at 2026-08-01T00:00:00Z"
            - "Clock advanced to 2026-08-02T00:00:00Z, then PRIVACY rule 5.1.1 version_label 2026.09 published with supersedes_rule_id -> the cascade re-points the mapping, stales it and opens one ImpactAssessment"
            - "One open ReviewCapacityWindow IOS/POOL_A with 5 slots"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_a_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_a_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /feature-mappings", payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_a_id}", feature_code: "ACCOUNT_DELETION" }, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { fm_id: "$.data.id" } }
            - { call: "POST /feature-mappings/${fm_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/acct-deletion.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v_cur: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v_cur}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_id: "$.data.id" } }
            - { call: "POST /metadata-locales", payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: true }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "PUT /submissions/${sub_id}/age-rating", payload: { age_rating_answers: { VIOLENCE: 0, SEXUAL_CONTENT: 0, DRUGS_ALCOHOL: 0, GAMBLING_SIMULATED: 0, HORROR: 0, PROFANITY: 0, real_money_gambling: false, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, contests: false }, attested_age_rating: 4 }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "PUT /submissions/${sub_id}/privacy-declaration", payload: { declared_privacy_items: [], tracking_consent_prompt_present: false }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 5 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { win_id: "$.data.id" } }
            - { call: "POST /submissions/${sub_id}/pre-review-check", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-02T00:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage (2026.09 revision)", category: "PRIVACY", version_label: "2026.09", effective_from: "2026-08-01T00:00:00Z", supersedes_rule_id: "${rule_a_id}", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_b_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_b_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "GET /impact-assessments?app_record_id=${app_id}", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { ia_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /feature-mappings/${fm_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/acct-deletion-2026-09.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /impact-assessments/${ia_id}/assess", payload: { action: "START", note: "Reviewing the 2026.09 wording against the shipped deletion flow" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /impact-assessments/${ia_id}/assess", payload: { action: "ACCEPT_NO_CHANGE", note: "Existing deletion flow already satisfies the revised wording" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
          assert:
            - "after the cascade: GuidelineRule.${rule_a_id}.status == SUPERSEDED and FeatureMapping.${fm_id}.guideline_rule_id == ${rule_b_id}"
            - "FeatureMapping.${fm_id}.self_review_status == STALE with staled_by_rule_id == ${rule_b_id}; AppRecord.${app_id}.feature_compliance_index == 50.00"
            - "ImpactAssessment.${ia_id}.status == OPEN, opened_at == 2026-08-02T00:00:00Z, impact_severity == 4.00 (4 * 1 * 1.0 exposure), remediation_deadline_at == 2026-08-31T00:00:00Z"
            - "first POST /submissions/${sub_id}/queue -> 409 ERR_APP_COMPLIANCE_RESTRICTED with posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\", \"OPEN_IMPACT_ASSESSMENT\"]"
            - "after the re-passed self-review: AppRecord.${app_id}.feature_compliance_index == 100.00 and posture_reason_codes == [\"OPEN_IMPACT_ASSESSMENT\"]"
            - "second POST /submissions/${sub_id}/queue -> 409 ERR_APP_COMPLIANCE_RESTRICTED (priority 40 answer, NOT ERR_REMEDIATION_INCOMPLETE at priority 60)"
            - "ImpactAssessment.${ia_id}.status == IN_ASSESSMENT and impact_severity == 4.00 after START (exposure recomputed, still NOT_DISTRIBUTED)"
            - "third POST /submissions/${sub_id}/queue -> 409 ERR_APP_COMPLIANCE_RESTRICTED (IN_ASSESSMENT is still an R4 match)"
            - "ImpactAssessment.${ia_id}.status == ACCEPTED_NO_CHANGE (permitted: category PRIVACY != SAFETY and 4.00 <= 6.00)"
            - "AppRecord.${app_id}.compliance_posture == OPEN and posture_reason_codes == []"
            - "fourth POST /submissions/${sub_id}/queue -> 200 with Submission.${sub_id}.state == WAITING_FOR_REVIEW and review_window_id == ${win_id}"
            - "Submission.${sub_id}.queued_at == 2026-08-02T00:00:00Z, provisional_deadline_at == 2026-08-04T00:00:00Z, priority_score == 50.00, priority_band == NORMAL"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 1 and slots_available == 4 (only the successful queue reserved)"

      - name: listing_list_gated_by_rollout_driven_distribution_state
        grounds:
          - state_machines.AppRecord.listing_state.METADATA_COMPLETE_to_LISTED
          - state_machines.AppRecord.listing_state.DELISTED_to_LISTED
          - state_machines.AppRecord.distribution_state.NOT_DISTRIBUTED_to_PHASED_ROLLOUT
          - state_machines.RolloutPlan.SCHEDULED_to_PHASE_ACTIVE
          - state_machines.RolloutPlan.PHASE_ACTIVE_to_ROLLED_BACK
          - entities.AppRecord.fields.live_submission_id
          - entities.AppRecord.fields.rollback_count
          - endpoints[PATCH /app-records/{id}/listing]
          - errors.ERR_APP_NOT_DISTRIBUTED
