          assert:
            - "hop 1: Faculty.${fac6_id}.appointment_status == DEPARTED and Faculty.${fac6_id}.separated_on == 2026-12-31T00:00:00Z"
            - "hop 2: StartupPackage.${pkg6_id}.spend_status == SETTLED and StartupPackage.${pkg6_id}.negotiation_status == CLOSED_OUT"
            - "hop 3: StaffAppointment.${appt6_id}.status == ENDED and StaffAppointment.${appt6_id}.end_date == 2026-12-31"
