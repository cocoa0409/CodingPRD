# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task_2515_correctional_food_service_operations
#
# Section 1.9 breadth probe. Sections and claim_types are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented here.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the covering §1.8 instance and no test_recipe.
# All numeric literals in `assert:` lines were computed by executing the
# relevant §1.3 formula with its declared constants and rounding modes.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_service_contract_create_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.ServiceContract
          - endpoints[POST /cfs/service-contracts]
          - response_envelope.success
        distinguishing_aspect: "A contract created with all nine required inputs comes back in status DRAFT with ld_variant null, every one of the fourteen computed ledger fields at its declared zero default, and a well-formed success envelope carrying meta.api_request_id."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E01", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id, status: $.data.status, variant: $.data.ld_variant }
          assert:
            - "HTTP 201 and the response body carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "${status} == DRAFT and ${variant} == null"
            - "ServiceContract.${contract_id}.contract_code == 'CFS-2515-E01' and vendor_name == 'Aramark Correctional Services'"
            - "ServiceContract.${contract_id}.total_trays_served == 0, meal_days_served == 0, missed_meal_total == 0, substitution_total == 0, grievance_sla_breach_count == 0"
            - "ServiceContract.${contract_id}.substitution_rate_pct == 0.0, raw_liquidated_damages_cents == 0, substitution_surcharge_cents == 0, liquidated_damages_cents == 0"
            - "ServiceContract.${contract_id}.gross_food_cost_cents == 0, cost_cents_per_meal_day_actual == 0.0, cost_recovery_credit_cents == 0, net_liquidated_damages_cents == 0, performance_score == 0.0"
            - "ServiceContract.${contract_id}.reconciled_at == null, closed_at == null, version == 1 and created_at == updated_at == 2026-08-01T00:00:00Z"

      - name: corner_facility_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.Facility
          - endpoints[GET /cfs/facilities/{id}]
        distinguishing_aspect: "GET /cfs/facilities/{id} returns exactly the row created by POST /cfs/facilities, including the input echo (facility_code, sharps_authorized_count) and the derived posture, with no version bump caused by the read."
        test_recipe:
          setup:
            - "One DRAFT ServiceContract and one Facility FAC-E02 with sharps_authorized_count 9, satellite_site_count 3, blast_chiller_capacity 4."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E02", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E02", name: "West Unit Kitchen", sharps_authorized_count: 9, satellite_site_count: 3, blast_chiller_capacity: 4 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id, created_version: $.data.version }
          trigger:
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { read_version: $.data.version, read_code: $.data.facility_code, read_posture: $.data.kitchen_posture }
          assert:
            - "HTTP 200 and ${read_code} == 'FAC-E02'"
            - "${read_version} == ${created_version} (a read never bumps version)"
            - "${read_posture} == OPEN"
            - "Facility.${facility_id}.sharps_authorized_count == 9, sharps_on_board_count == 9, sharps_issued_count == 0, sharps_unaccounted_count == 0"
            - "Facility.${facility_id}.satellite_site_count == 3, blast_chiller_capacity == 4, contract_id == ${contract_id}"

      - name: corner_diet_order_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cfs/diet-orders]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three DietOrder rows for one inmate, GET /cfs/diet-orders?inmate_id=...&limit=2&offset=0 returns exactly 2 items with total_count 3 and has_more true, and the offset=2 page returns 1 item with has_more false."
        test_recipe:
          setup:
            - "ACTIVE ServiceContract CFS-2515-E03 with Facility FAC-E03 and one IN_CUSTODY Inmate BK-0003."
            - "Three PENDING_VERIFICATION RELIGIOUS DietOrders for that inmate over three consecutive non-overlapping half-open windows: 2026-08-01 to 2026-08-10, 2026-08-10 to 2026-08-20, 2026-08-20 to 2026-08-30."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E03", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E03", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0003", housing_unit: "GENERAL", religious_affiliation: "JEWISH" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id, inmate_v1: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "KOSHER", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", expected_inmate_version: "${inmate_v1}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { inmate_v2: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "KOSHER", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", expected_inmate_version: "${inmate_v2}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { inmate_v3: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "RELIGIOUS", diet_code: "KOSHER", effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-30T00:00:00Z", expected_inmate_version: "${inmate_v3}" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
          trigger:
            - call: "GET /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", limit: 2, offset: 0 }
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", limit: 2, offset: 2 }
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "The first response carries response_type == 'array', limit == 2, offset == 0, total_count == 3 and has_more == true, with exactly 2 items"
            - "The second response carries limit == 2, offset == 2, total_count == 3 and has_more == false, with exactly 1 item"
            - "${page1_first}, ${page1_second} and ${page2_first} are three distinct DietOrder ids"
            - "Every returned row has inmate_id == ${inmate_id}, order_type == RELIGIOUS and status == PENDING_VERIFICATION"

      - name: corner_get_facility_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /cfs/facilities/{id}]
          - validations[priority=8]
          - errors.ERR_FACILITY_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown facility id returns ERR_FACILITY_NOT_FOUND with HTTP 404, not an empty 200 body and not a 500."
        test_recipe:
          setup:
            - "Empty database apart from the clock; no Facility rows exist."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "GET /cfs/facilities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "au-001"
              captures: { nf_error: $.data.error_id }
          assert:
            - "${nf_error} == ERR_FACILITY_NOT_FOUND with HTTP 404"
            - "The response envelope has response_type == 'error' and data.message is a non-empty string"

      - name: corner_facility_create_missing_sharps_authorized_count_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /cfs/facilities]
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "sharps_authorized_count carries no default, so omitting it from POST /cfs/facilities is rejected with ERR_INVALID_REQUEST at HTTP 400 and no Facility row is created."
        test_recipe:
          setup:
            - "One DRAFT ServiceContract CFS-2515-E05 and no facilities."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E05", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E05", name: "North Unit Kitchen" }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { shape_error: $.data.error_id }
          assert:
            - "${shape_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /cfs/facilities filtered by contract_id == ${contract_id} returns total_count == 0"

      - name: corner_facility_create_applies_satellite_and_chiller_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.satellite_site_count
          - entities.Facility.fields.blast_chiller_capacity
          - endpoints[POST /cfs/facilities]
        distinguishing_aspect: "Omitting both optional inputs yields satellite_site_count 0 and blast_chiller_capacity 2 from the declared defaults, and sharps_on_board_count is seeded to sharps_authorized_count rather than to 0."
        test_recipe:
          setup:
            - "One DRAFT ServiceContract CFS-2515-E06."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E06", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E06", name: "Annex Kitchen", sharps_authorized_count: 7 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id, sat: $.data.satellite_site_count, cap: $.data.blast_chiller_capacity, on_board: $.data.sharps_on_board_count }
          assert:
            - "${sat} == 0 and ${cap} == 2"
            - "${on_board} == 7, equal to sharps_authorized_count, so 7 + 0 + 0 == 7 satisfies the sharps conservation identity at creation"
            - "Facility.${facility_id}.corrective_action_required == false and kitchen_posture == OPEN"
            - "Facility.${facility_id}.last_sharps_audit_at == null and sharps_audit_shortfall == 0"

      - name: corner_population_count_total_is_computed_from_four_segments
        claim_type: computed_fields
        grounds:
          - entities.PopulationCount.fields.total_population
          - endpoints[POST /cfs/population-counts]
        distinguishing_aspect: "total_population is not an input field at all - it is the sum of the four segment inputs (41 + 7 + 5 + 3 == 56) and is stamped at creation together with count_at and submitted_by_user_id."
        test_recipe:
          setup:
            - "ACTIVE ServiceContract CFS-2515-E07 with Facility FAC-E07, clock at 2026-08-01T06:30:00Z."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:30:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E07", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E07", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${facility_id}", general_population: 41, segregation_population: 7, satellite_population: 5, medical_population: 3, source: "EMERGENCY_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { count_id: $.data.id, total: $.data.total_population, at: $.data.count_at, by: $.data.submitted_by_user_id }
          assert:
            - "${total} == 56"
            - "${at} == 2026-08-01T06:30:00Z and ${by} == 'co-001'"
            - "PopulationCount.${count_id}.source == EMERGENCY_COUNT"
            - "The response body for PopulationCount carries no version field (common_fields is false for this entity)"

      - name: corner_menu_cycle_system_fields_generated_on_create
        claim_type: system_fields
        grounds:
          - entities.MenuCycle.fields.status
          - entities.MenuCycle.fields.nutrition_signed_by_user_id
          - endpoints[POST /cfs/menu-cycles]
        distinguishing_aspect: "A newly created MenuCycle has server-generated id/created_at/updated_at/version, status DRAFT, item_count 0, and every signature and approval field null - none of which appear in the endpoint's input schema."
        test_recipe:
          setup:
            - "ACTIVE ServiceContract CFS-2515-E08 with Facility FAC-E08, clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E08", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E08", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${facility_id}", cycle_code: "CYC-E08", cycle_length_days: 3 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cycle_id: $.data.id, status: $.data.status, items: $.data.item_count, ver: $.data.version }
          assert:
            - "${status} == DRAFT, ${items} == 0 and ${ver} == 1"
            - "MenuCycle.${cycle_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "MenuCycle.${cycle_id}.nutrition_signed_by_user_id == null, activated_by_user_id == null, activated_at == null"
            - "MenuCycle.${cycle_id}.approved_kcal_per_meal_day == null, approved_protein_grams_per_meal_day == null, approved_sodium_mg_per_meal_day == null, approved_cost_cents_per_meal_day == null"
            - "MenuCycle.${cycle_id}.cycle_length_days == 3"

      - name: corner_inmate_create_invalid_housing_unit_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Inmate.fields.housing_unit
          - validations[priority=7]
          - errors.ERR_INVALID_ENUM_VALUE
        distinguishing_aspect: "housing_unit accepts only GENERAL, SEGREGATION, SATELLITE or MEDICAL, so the value 'INFIRMARY' is rejected with ERR_INVALID_ENUM_VALUE at HTTP 422 and no Inmate row is created."
        test_recipe:
          setup:
            - "ACTIVE ServiceContract CFS-2515-E09 with Facility FAC-E09 and no inmates."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-E09", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-E09", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0009", housing_unit: "INFIRMARY" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { enum_error: $.data.error_id }
          assert:
            - "${enum_error} == ERR_INVALID_ENUM_VALUE with HTTP 422"
            - "GET /cfs/inmates filtered by facility_id == ${facility_id} returns total_count == 0"

      - name: corner_temperature_log_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.TemperatureLog
          - endpoints[GET /cfs/production-batches/{id}/temperature-logs]
        distinguishing_aspect: "TemperatureLog declares common_fields false: the created row exposes id and created_at but no version and no updated_at, §1.5 offers no PATCH or DELETE for it, and two readings posted at the same instant coexist as separate immutable rows."
        excluded_because:
          difficulty_instance: boundary_precision_check / chill_intermediate_inclusive_at_exactly_120_minutes_and_80_0_degrees
          rationale: "That instance posts three CHILL_INTERMEDIATE rows against one batch and asserts all three persist with no version field, which is exactly the immutability claim."

      - name: corner_facility_create_with_unknown_contract_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Facility.fields.contract_id
          - validations[priority=9]
          - errors.ERR_SERVICE_CONTRACT_NOT_FOUND
        distinguishing_aspect: "The contract_id foreign key is resolved before the row is written, so an unknown parent id yields ERR_SERVICE_CONTRACT_NOT_FOUND at HTTP 404 rather than an orphaned Facility."
        test_recipe:
          setup:
            - "Empty database apart from the clock; no ServiceContract rows exist."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "POST /cfs/facilities"
              payload: { contract_id: "00000000-0000-0000-0000-000000000000", facility_code: "FAC-E11", name: "Orphan Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { fk_error: $.data.error_id }
          assert:
            - "${fk_error} == ERR_SERVICE_CONTRACT_NOT_FOUND with HTTP 404"
            - "GET /cfs/facilities returns total_count == 0"

      - name: corner_graph_topology_diet_order_self_reference_resolves
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.DietOrder.fields.supersedes_diet_order_id
          - endpoints[GET /cfs/diet-orders]
        distinguishing_aspect: "DietOrder.supersedes_diet_order_id is a self-referential edge in the graph topology: the successor points at the incumbent, the filtered list GET makes the edge traversable in reverse, and the supersede exemption in the coverage-window calculation depends on resolving it."
        excluded_because:
          difficulty_instance: compensating_invariant / supersede_verify_leaves_special_diet_census_unchanged
          rationale: "That instance creates the successor with supersedes_diet_order_id pointing at the ACTIVE incumbent over an identical window - only legal if the self-referential edge resolves - and asserts the resulting two-row REVOKED/ACTIVE pair."

  # ===========================================================================
