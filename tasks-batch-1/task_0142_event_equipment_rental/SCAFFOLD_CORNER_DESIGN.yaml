scaffold_corner_design:
  # =========================================================================
  # Entities — creation, retrieval, required fields, defaults, computed/system
  # =========================================================================
  - section: entities
    instances:
      - name: create_catalog_item_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.CatalogItem, endpoints]
        distinguishing_aspect: "POST /catalog-items with required fields only → 201; omitted optionals default (multi_day_discount_pct=0, deposit_per_unit_cents=0, requires_cleaning=false, requires_coi=false, status=ACTIVE)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog-items"
              payload: { sku: "TABLE-6FT", name: "6ft Table", category: "TABLE", total_units: 30, daily_rate_cents: 500 }
              as: RentalAgent
              captures: { ti_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CatalogItem.${ti_id}.status == ACTIVE"
            - "CatalogItem.${ti_id}.multi_day_discount_pct == 0"
            - "CatalogItem.${ti_id}.deposit_per_unit_cents == 0"
            - "CatalogItem.${ti_id}.requires_coi == false"

      - name: create_catalog_item_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.CatalogItem, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /catalog-items missing daily_rate_cents (required, no default) → ERR_VALIDATION 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog-items"
              payload: { sku: "BAD-1", name: "Bad", category: "TABLE", total_units: 5 }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_catalog_item_invalid_enum_category_rejected
        claim_type: Type Constraints
        grounds: [entities.CatalogItem.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "category outside {TENT,TABLE,CHAIR,LINEN,BOUNCE_HOUSE} → ERR_VALIDATION 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog-items"
              payload: { sku: "ENUM-1", name: "X", category: "SPACESHIP", total_units: 5, daily_rate_cents: 100 }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_catalog_item_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /catalog-items/{non-existent UUID} → ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /catalog-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: order_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.RentalOrder.fields.booking_status, entities.RentalOrder.fields.version]
        distinguishing_aspect: "POST /orders ignores any client-sent booking_status/version/id; server stamps booking_status=DRAFT, version=1, settlement_status=UNSETTLED."
        test_recipe:
          setup: ["Customer C20 exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c20@x.com", full_name: "C Twenty", phone: "555-0020" }
              as: RentalAgent
              captures: { c20_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c20_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c20_id}"
              captures: { o20_id: $.data.id, o20_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "RentalOrder.${o20_id}.booking_status == DRAFT"
            - "RentalOrder.${o20_id}.settlement_status == UNSETTLED"
            - "RentalOrder.${o20_id}.version == 1"

      - name: rental_days_computed_inclusive_span
        claim_type: Computed Fields
        grounds: [entities.RentalOrder.fields.rental_days]
        distinguishing_aspect: "rental_days is inclusive: event_start 2026-06-01, event_end 2026-06-03 → rental_days == 3 (not 2)."
        test_recipe:
          setup: ["Customer C21 exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c21@x.com", full_name: "C TwentyOne", phone: "555-0021" }
              as: RentalAgent
              captures: { c21_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c21_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-03T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c21_id}"
              captures: { o21_id: $.data.id }
          assert:
            - "RentalOrder.${o21_id}.rental_days == 3"

      - name: list_catalog_items_paginated_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /catalog-items returns array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two catalog items exist."]
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "P-1", name: "P1", category: "CHAIR", total_units: 10, daily_rate_cents: 100 }
              as: RentalAgent
            - call: "POST /catalog-items"
              payload: { sku: "P-2", name: "P2", category: "TABLE", total_units: 10, daily_rate_cents: 100 }
              as: RentalAgent
          trigger:
            - call: "GET /catalog-items"
              payload: { limit: 1, offset: 0 }
              as: RentalAgent
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"

  # =========================================================================
  # State Machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_order_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RentalOrder.field=booking_status.DRAFT_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_state_beats_coi_safety
          rationale: "A second confirm on a CONFIRMED order returning ERR_INVALID_STATE is exactly the higher-priority outcome asserted there."

      - name: fulfill_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RentalOrder.field=booking_status.CONFIRMED_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/fulfill on a DRAFT order (not CONFIRMED) → ERR_INVALID_STATE 409; no state change."
        test_recipe:
          setup: ["Customer C22; DRAFT WILL_CALL order O22 with one line (never confirmed)."]
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-22", name: "Chair 22", category: "CHAIR", total_units: 10, daily_rate_cents: 200 }
              as: RentalAgent
              captures: { ch22_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c22@x.com", full_name: "C TwentyTwo", phone: "555-0022" }
              as: RentalAgent
              captures: { c22_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c22_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c22_id}"
              captures: { o22_id: $.data.id }
            - call: "POST /orders/${o22_id}/lines"
              payload: { item_id: "${ch22_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c22_id}"
          trigger:
            - call: "POST /orders/${o22_id}/fulfill"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "RentalOrder.${o22_id}.booking_status == DRAFT"

      - name: cancel_returned_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RentalOrder.field=booking_status.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETURNED is terminal for booking_status; POST /orders/{id}/cancel on a RETURNED order → ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Customer C23; WILL_CALL order O23 confirmed, fulfilled, returned (booking_status=RETURNED)."]
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-23", name: "Chair 23", category: "CHAIR", total_units: 10, daily_rate_cents: 200, deposit_per_unit_cents: 0 }
              as: RentalAgent
              captures: { ch23_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c23@x.com", full_name: "C TwentyThree", phone: "555-0023" }
              as: RentalAgent
              captures: { c23_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c23_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c23_id}"
              captures: { o23_id: $.data.id }
            - call: "POST /orders/${o23_id}/lines"
              payload: { item_id: "${ch23_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c23_id}"
              captures: { o23_v: $.data.version }
            - call: "POST /orders/${o23_id}/confirm"
              payload: { expected_order_version: "${o23_v}" }
              as: Customer
              as_user_id: "${c23_id}"
              captures: { o23_v_conf: $.data.version }
            - call: "POST /orders/${o23_id}/fulfill"
              payload: {}
              as: RentalAgent
            - call: "POST /orders/${o23_id}/return"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /orders/${o23_id}/cancel"
              payload: { expected_order_version: "${o23_v_conf}" }
              as: Customer
              as_user_id: "${c23_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_already_rejected_cert_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.InsuranceCertificate.field=status.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a REJECTED COI (terminal) → ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Customer C24; Venue V24; COI submitted then rejected (status=REJECTED)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c24@x.com", full_name: "C TwentyFour", phone: "555-0024" }
              as: RentalAgent
              captures: { c24_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c24_id}", name: "Hall 24", address: "24 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c24_id}"
              captures: { v24_id: $.data.id }
            - call: "POST /venues/${v24_id}/certificates"
              payload: { carrier_name: "Acme", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-31T00:00:00.000Z", coverage_amount_cents: 1000000 }
              as: Customer
              as_user_id: "${c24_id}"
              captures: { coi24_id: $.data.id }
            - call: "POST /venues/${v24_id}/certificates/${coi24_id}/reject"
              payload: { reason: "expired carrier" }
              as: RentalAgent
          trigger:
            - call: "POST /venues/${v24_id}/certificates/${coi24_id}/approve"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reschedule_after_three_attempts_blocked
        claim_type: Invalid Transitions
        grounds: [state_machines.DeliveryRun.field=status.ATTEMPTED_to_SCHEDULED, "errors[ERR_MAX_ATTEMPTS_EXCEEDED]"]
        distinguishing_aspect: "After 3 FAILED attempts (attempt_count=3), reschedule from ATTEMPTED → ERR_MAX_ATTEMPTS_EXCEEDED 422 (rule allows reschedule only while attempt_count <= 2)."
        test_recipe:
          setup: ["Customer C25; DELIVERY order O25 confirmed; Crew CR25 turnaround=0; DROP_OFF run R25 failed 3 times via attempt/reschedule cycles, currently ATTEMPTED with attempt_count=3."]
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-25", name: "Chair 25", category: "CHAIR", total_units: 10, daily_rate_cents: 200, deposit_per_unit_cents: 0 }
              as: RentalAgent
              captures: { ch25_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c25@x.com", full_name: "C TwentyFive", phone: "555-0025" }
              as: RentalAgent
              captures: { c25_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c25_id}", name: "Hall 25", address: "25 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c25_id}"
              captures: { v25_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c25_id}", venue_id: "${v25_id}", fulfillment: "DELIVERY", event_start: "2026-07-20T00:00:00.000Z", event_end: "2026-07-20T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c25_id}"
              captures: { o25_id: $.data.id }
            - call: "POST /orders/${o25_id}/lines"
              payload: { item_id: "${ch25_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c25_id}"
              captures: { o25_v: $.data.version }
            - call: "POST /orders/${o25_id}/confirm"
              payload: { expected_order_version: "${o25_v}" }
              as: Customer
              as_user_id: "${c25_id}"
            - call: "POST /crews"
              payload: { name: "Truck 25", turnaround_minutes: 0 }
              as: RentalAgent
              captures: { cr25_id: $.data.id }
            - call: "POST /delivery-runs"
              payload: { order_id: "${o25_id}", leg: "DROP_OFF", crew_id: "${cr25_id}", window_start: "2026-07-19T08:00:00.000Z", window_end: "2026-07-19T09:00:00.000Z" }
              as: RentalAgent
              captures: { r25_id: $.data.id }
            - call: "POST /delivery-runs/${r25_id}/attempt"
              payload: { outcome: "FAILED" }
              as: RentalAgent
            - call: "POST /delivery-runs/${r25_id}/reschedule"
              payload: { window_start: "2026-07-19T10:00:00.000Z", window_end: "2026-07-19T11:00:00.000Z" }
              as: RentalAgent
            - call: "POST /delivery-runs/${r25_id}/attempt"
              payload: { outcome: "FAILED" }
              as: RentalAgent
            - call: "POST /delivery-runs/${r25_id}/reschedule"
              payload: { window_start: "2026-07-19T12:00:00.000Z", window_end: "2026-07-19T13:00:00.000Z" }
              as: RentalAgent
            - call: "POST /delivery-runs/${r25_id}/attempt"
              payload: { outcome: "FAILED" }
              as: RentalAgent
          trigger:
            - call: "POST /delivery-runs/${r25_id}/reschedule"
              payload: { window_start: "2026-07-19T14:00:00.000Z", window_end: "2026-07-19T15:00:00.000Z" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_MAX_ATTEMPTS_EXCEEDED"
            - "DeliveryRun.${r25_id}.attempt_count == 3"

      - name: delivery_run_success_completes
        claim_type: Valid Transition
        grounds: [state_machines.DeliveryRun.field=status.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "POST /delivery-runs/{id}/attempt with outcome=SUCCESS on a SCHEDULED run → status COMPLETED."
        test_recipe:
          setup: ["Customer C26; DELIVERY order O26 confirmed; Crew CR26; DROP_OFF run R26 SCHEDULED."]
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-26", name: "Chair 26", category: "CHAIR", total_units: 10, daily_rate_cents: 200, deposit_per_unit_cents: 0 }
              as: RentalAgent
              captures: { ch26_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c26@x.com", full_name: "C TwentySix", phone: "555-0026" }
              as: RentalAgent
              captures: { c26_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c26_id}", name: "Hall 26", address: "26 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c26_id}"
              captures: { v26_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c26_id}", venue_id: "${v26_id}", fulfillment: "DELIVERY", event_start: "2026-07-22T00:00:00.000Z", event_end: "2026-07-22T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c26_id}"
              captures: { o26_id: $.data.id }
            - call: "POST /orders/${o26_id}/lines"
              payload: { item_id: "${ch26_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c26_id}"
              captures: { o26_v: $.data.version }
            - call: "POST /orders/${o26_id}/confirm"
              payload: { expected_order_version: "${o26_v}" }
              as: Customer
              as_user_id: "${c26_id}"
            - call: "POST /crews"
              payload: { name: "Truck 26", turnaround_minutes: 0 }
              as: RentalAgent
              captures: { cr26_id: $.data.id }
            - call: "POST /delivery-runs"
              payload: { order_id: "${o26_id}", leg: "DROP_OFF", crew_id: "${cr26_id}", window_start: "2026-07-22T08:00:00.000Z", window_end: "2026-07-22T09:00:00.000Z" }
              as: RentalAgent
              captures: { r26_id: $.data.id }
          trigger:
            - call: "POST /delivery-runs/${r26_id}/attempt"
              payload: { outcome: "SUCCESS" }
              as: RentalAgent
          assert:
            - "DeliveryRun.${r26_id}.status == COMPLETED"

  # =========================================================================
  # Calculations — precision, input filtering, constants
  # =========================================================================
  - section: calculations
    instances:
      - name: free_delivery_subtotal_waiver_boundary
        claim_type: Constants Applied
        grounds: [calculations.delivery_fee, entities.RentalOrder.fields.delivery_fee_cents]
        distinguishing_aspect: "FREE_DELIVERY_SUBTOTAL_CENTS=200000 waiver: subtotal exactly 200000 waives the LOCAL base (fee from base waived); with <100 units no surcharge → delivery_fee == 0."
        test_recipe:
          setup:
            - "CatalogItem WAIVE (daily=200000, disc=0, deposit_per_unit=0, total_units=10). Customer C27; Venue V27 (LOCAL)."
            - "DELIVERY order O27 (1 day), 1 unit => rental_subtotal=200000 (== threshold), 1 unit (<100) => base waived, surcharge 0 => delivery_fee 0."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "WAIVE-1", name: "Big Item", category: "TENT", total_units: 10, daily_rate_cents: 200000, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { wv_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c27@x.com", full_name: "C TwentySeven", phone: "555-0027" }
              as: RentalAgent
              captures: { c27_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c27_id}", name: "Hall 27", address: "27 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c27_id}"
              captures: { v27_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c27_id}", venue_id: "${v27_id}", fulfillment: "DELIVERY", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c27_id}"
              captures: { o27_id: $.data.id }
            - call: "POST /orders/${o27_id}/lines"
              payload: { item_id: "${wv_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c27_id}"
              captures: { o27_v: $.data.version }
          trigger:
            - call: "POST /orders/${o27_id}/confirm"
              payload: { expected_order_version: "${o27_v}" }
              as: Customer
              as_user_id: "${c27_id}"
          assert:
            - "RentalOrder.${o27_id}.rental_subtotal_cents == 200000"
            - "RentalOrder.${o27_id}.delivery_fee_cents == 0"

      - name: cleaning_fee_applied_only_when_requires_cleaning
        claim_type: Input Set Filtering
        grounds: [calculations.order_rental_subtotal, entities.CatalogItem.fields.requires_cleaning, entities.OrderLine.fields.line_cleaning_cents]
        distinguishing_aspect: "LINEN line (requires_cleaning=true, cleaning_fee=500, qty 40) contributes 20000 cleaning; a CHAIR line (requires_cleaning=false) contributes 0 cleaning. Quote sums only requires_cleaning lines."
        test_recipe:
          setup:
            - "CatalogItem LINEN (daily=150, disc=0, requires_cleaning=true, cleaning_fee=500, deposit_per_unit=100, total_units=200, requires_coi=false). Customer C28; WILL_CALL order O28 (1 day) with one line of 40 linens."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "LINEN-1", name: "Tablecloth", category: "LINEN", total_units: 200, daily_rate_cents: 150, multi_day_discount_pct: 0, requires_cleaning: true, cleaning_fee_cents: 500, deposit_per_unit_cents: 100, requires_coi: false }
              as: RentalAgent
              captures: { ln_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c28@x.com", full_name: "C TwentyEight", phone: "555-0028" }
              as: RentalAgent
              captures: { c28_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c28_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c28_id}"
              captures: { o28_id: $.data.id }
            - call: "POST /orders/${o28_id}/lines"
              payload: { item_id: "${ln_id}", quantity: 40 }
              as: Customer
              as_user_id: "${c28_id}"
          trigger:
            - call: "GET /orders/${o28_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${c28_id}"
          assert:
            - "quote.rental_subtotal_cents == 6000"
            - "quote.cleaning_fee_total_cents == 20000"
            - "quote.deposit_total_cents == 4000"
            - "quote.grand_total_cents == 26000"

      - name: line_rental_round_then_multiply
        claim_type: Precision
        grounds: [calculations.line_rental_charge]
        excluded_because:
          difficulty_instance: combinatorial_formula / line_rental_round_then_multiply_order_mode_b
          rationale: "The round-then-multiply precision claim is the asserted body of that §1.8 instance."

