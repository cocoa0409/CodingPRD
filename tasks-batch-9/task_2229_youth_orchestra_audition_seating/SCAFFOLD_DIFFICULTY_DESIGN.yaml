  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: aid_pool_committed_plus_available_equals_budget
        grounds:
          - calculations.aid_award_waterfall
          - calculations.aid_cap_application
          - entities.Season.fields.aid_committed_cents
          - entities.Season.fields.aid_available_cents
          - entities.TuitionAccount.fields.aid_effective_cents
          - state_machines.TuitionAccount.APPROVED_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity: MONEY in the season aid pool -
          aid_committed_cents + aid_available_cents == aid_budget_cents (100000)
          holds at three checkpoints driven by three different writers: the award
          run moves 30000 out of available, the FINAL assessment's income-band cap
          returns a 2737 surplus, and the rescission returns the whole capped
          27263. The surplus return is the compensating leg that a naive
          implementation forgets, leaving the pool over-committed by 2737.
        test_recipe:
          setup:
            - "One season with aid_budget_cents 100000 and tuition_base_cents 123223, at IN_SEASON with one seated PHILHARMONIC violinist who is BAND_C, sibling_enrolled true, years_in_org 1."
            - "The member's TuitionAccount is CURRENT with assessment_variant PRELIMINARY and assessed_cents 123223."
            - "An aid request for 30000 has been reviewed by officer-review-1 (aid_need_score 24), so the account is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
