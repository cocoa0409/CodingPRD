# =============================================================================
# PRD-Bench Scaffold — task_2544
# Mammography Accreditation & Breast Density Notification (breast imaging center)
#
# §1.0–§1.7 live in this file. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml (neither key appears here).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2544. Mammography Accreditation & Breast Density Notification (breast imaging center):
  unit accreditation, physicist survey and annual inspection compliance, interpreting
  physician and technologist continuing education volume requirements, image quality
  clinical review submissions and reaccreditation cycle, patient lay summary and density
  notification letter generation by state and federal rules, audit of positive predictive
  value and recall rates by radiologist, additional screening recommendation pathways and
  coverage variability, delayed report and lost-to-follow-up tracking, equipment failure
  and repeat imaging documentation

domain_name: mammography-accreditation-density-notification

# Flat top-level collections (/state-policies, /facilities, /units, /exams, ...) with
# nested creation sub-resources. Empty prefix = every path is rooted at "/".
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects       # survey failure / amendment chains span 4–5 entities
    - dual_variant_calculation     # PPV variants on a radiologist, repeat-rate variants on a unit
    - optimistic_concurrency       # OCC on MammographyUnit.version and Exam.version
    - ops_run_checkpoint           # POST /facilities/{id}/compliance-runs advances the compliance epoch

  entity_topology: graph
  # graph: ClinicalImageReviewSubmission.exam_ids forms a many-to-many packet over Exam;
  # NotificationLetter.supersedes_letter_id is self-referential; Personnel is referenced by
  # four different entities; SupplementalScreeningOrder reaches Facility only transitively
  # (order -> exam -> unit -> facility). No single ownership tree exists.

  state_machine_shape: parallel
  # Exam carries three independent dimensions (report_status x notification_status x
  # follow_up_status); MammographyUnit carries two (accreditation_status x operational_state).
  # Cyclic (PhysicistSurvey self-loop, ClinicalImageReviewSubmission revision loop,
  # Personnel LAPSED->QUALIFIED) and branching (survey decision fork) shapes are also present.

  relationship_patterns:
    - one_to_many          # Facility -> MammographyUnit / Personnel / AnnualInspection
    - many_to_many         # ClinicalImageReviewSubmission.exam_ids <-> Exam
    - self_referential     # NotificationLetter.supersedes_letter_id -> NotificationLetter.id
    - cross_aggregate      # SupplementalScreeningOrder -> Exam -> MammographyUnit -> Facility

  role_model: segregation_of_duties
  # The physicist who files a survey cannot accept its corrective action; the interpreting
  # physician who signed a report cannot record its pathology outcome or close the audit
  # cycle that scores it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StatePolicy
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter uppercase US state code this notification/coverage policy governs"
        constraints: "exactly 2 uppercase letters; unique across StatePolicy"
      - name: density_notice_rule
        type: enum
        source: input
        description: "Which density notification regime the state layers on top of the federal lay-summary rule"
        constraints: "FEDERAL_ONLY | STATE_DENSE_ONLY | STATE_ENHANCED_ALL"
      - name: lay_summary_max_reading_grade
        type: integer
        source: input
        description: "State ceiling on the lay summary reading grade level"
        constraints: "4..12"
      - name: lay_summary_deadline_days
        type: integer
        source: input
        description: "State deadline, in days from letter generation, for delivering the lay summary"
        constraints: "1..90"
      - name: required_notice_codes
        type: array
        source: input
        description: "Ordered state-specific notice codes appended after the federal codes"
        default: []
        constraints: "array of strings; declared order is preserved verbatim"
      - name: supplemental_coverage_mandate
        type: enum
        source: input
        description: "State mandate governing coverage of supplemental screening ordered off a dense-breast finding"
        constraints: "NONE | COVERAGE_WITH_COST_SHARING | COVERAGE_NO_COST_SHARING"
      - name: supplemental_cost_share_waiver_threshold_cents
        type: integer
        source: input
        description: "De-minimis patient-responsibility amount the facility absorbs under COVERAGE_WITH_COST_SHARING"
        default: 0
        constraints: ">= 0"
      - name: followup_grace_days
        type: integer
        source: input
        description: "Days after a supplemental order is recommended before it becomes lost-to-follow-up"
        default: 60
        constraints: "1..365"
      - name: report_turnaround_days
        type: integer
        source: input
        description: "Days after acquisition by which a routine mammogram report is due"
        default: 30
        constraints: "1..90"
      - name: urgent_report_turnaround_days
        type: integer
        source: input
        description: "Days after acquisition by which a BI-RADS 0/4/5 report is due"
        default: 7
        constraints: "1..30; must be <= report_turnaround_days"
      - name: ce_grace_days
        type: integer
        source: input
        description: "Grace period granted when a continuing-education or volume shortfall is first detected"
        default: 90
        constraints: "1..365"

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Breast imaging center name"
        constraints: "1..120 chars"
      - name: state_policy_id
        type: string
        source: input
        description: "FK -> StatePolicy.id; the facility's home-state policy, used as the fallback governing policy when a patient's own state has no StatePolicy row"
      - name: accreditation_body
        type: enum
        source: input
        description: "Accreditation body that reviews this facility's clinical image packets"
        constraints: "ACR | STATE_CERTIFIED"
      - name: supplemental_concurrent_capacity
        type: integer
        source: input
        description: "Number of supplemental screening appointments the facility can occupy at one instant"
        default: 2
        constraints: "1..10"
      - name: total_funded_cents
        type: integer
        source: computed
        description: "Cumulative sum of every accepted funding deposit; never decreases"
        default: 0
      - name: prepaid_credit_cents
        type: integer
        source: computed
        description: "Unencumbered accreditation-fee credit available to hold against new clinical image review submissions"
        default: 0
      - name: fee_held_cents
        type: integer
        source: computed
        description: "Sum of fee_held_cents over ClinicalImageReviewSubmission rows in status SUBMITTED"
        default: 0
      - name: fee_consumed_cents
        type: integer
        source: computed
        description: "Fees irrevocably consumed by reviewed submissions; never decreases"
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived facility posture recomputed by calculations.facility_compliance_posture on every unit/inspection/survey change and on every compliance run"
        default: COMPLIANT
        constraints: "COMPLIANT | CONDITIONAL | SUSPENDED"
      - name: open_notice_obligations
        type: integer
        source: computed
        description: "Count of Exam rows at this facility whose notification_status is in {PENDING, GENERATED, SENT}"
        default: 0
      - name: last_compliance_run_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent compliance run; null before the first run"

  - name: MammographyUnit
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; taken from the creation path, never from the body"
      - name: manufacturer
        type: string
        source: input
        description: "Equipment manufacturer"
      - name: model_serial
        type: string
        source: input
        description: "Manufacturer serial of the unit"
        constraints: "unique within facility_id"
      - name: modality
        type: enum
        source: input
        description: "Imaging modality the unit is accredited for"
        constraints: "DM_2D | DBT_3D"
      - name: accreditation_status
        type: enum
        source: system
        description: "Accreditation dimension of the unit's parallel state machine"
        default: PROVISIONAL
        constraints: "PROVISIONAL | ACCREDITED | REACCREDITATION_DUE | PROBATION | SUSPENDED"
      - name: operational_state
        type: enum
        source: system
        description: "Service dimension of the unit's parallel state machine; evolves independently of accreditation_status"
        default: IN_SERVICE
        constraints: "IN_SERVICE | OUT_OF_SERVICE"
      - name: accreditation_expires_on
        type: datetime
        source: input
        description: "Instant the current accreditation certificate lapses; reset to clock + 1095 days on a passing clinical image review"
      - name: reaccreditation_attempts_remaining
        type: integer
        source: system
        description: "Clinical image review attempts left in the current accreditation cycle; 3 at creation, decremented on each submit/resubmit, restored on withdrawal, reset to 3 on a passing review"
        default: 3
        constraints: "0..3"
      - name: survey_compliance
        type: enum
        source: computed
        description: "CURRENT when a PASSED PhysicistSurvey window covers the logical clock; FAILED after a failing survey decision; OVERDUE otherwise"
        default: OVERDUE
        constraints: "CURRENT | OVERDUE | FAILED"
      - name: last_passed_survey_end
        type: datetime
        source: computed
        description: "effective_end of the most recently PASSED PhysicistSurvey on this unit; null when none"
      - name: total_images_acquired
        type: integer
        source: computed
        description: "Conserved image ledger: sum over this unit's Exam rows of (original_image_count + repeat_image_count)"
        default: 0
      - name: repeat_images_acquired
        type: integer
        source: computed
        description: "Sum over this unit's Exam rows of repeat_image_count (non-retracted repeat records only)"
        default: 0
      - name: image_based_repeat_rate_pct
        type: number
        source: computed
        description: "IMAGE_BASED variant of calculations.unit_repeat_rate; null when total_images_acquired == 0"
      - name: patient_based_repeat_rate_pct
        type: number
        source: computed
        description: "PATIENT_BASED variant of calculations.unit_repeat_rate; null when the unit has no Exam rows"
      - name: repeat_rate_flag
        type: boolean
        source: computed
        description: "True iff image_based_repeat_rate_pct > 5.00 (strictly greater)"
        default: false

  - name: Personnel
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; taken from the creation path"
      - name: full_name
        type: string
        source: input
        description: "Personnel display name"
      - name: role_type
        type: enum
        source: input
        description: "MQSA personnel category; fixes the initial and continuing thresholds applied by calculations.ce_and_volume_compliance"
        constraints: "INTERPRETING_PHYSICIAN | TECHNOLOGIST | MEDICAL_PHYSICIST"
      - name: initial_qualification_on
        type: datetime
        source: input
        description: "Instant initial qualification was attested"
      - name: initial_training_hours
        type: number
        source: input
        description: "Attested initial category-1 training hours"
        constraints: ">= 0"
      - name: initial_read_volume
        type: integer
        source: input
        description: "Attested initial supervised volume (interpretations, exams performed, or surveys assisted, per role_type)"
        constraints: ">= 0"
      - name: modality_certifications
        type: array
        source: input
        description: "Modality codes this person is certified for"
        default: []
        constraints: "subset of {DM_2D, DBT_3D}"
      - name: qualification_status
        type: enum
        source: system
        description: "Qualification dimension; QUALIFIED at creation only when both initial thresholds for role_type are met, otherwise PROVISIONAL"
        constraints: "PROVISIONAL | QUALIFIED | LAPSED | INACTIVE"
      - name: ce_status
        type: enum
        source: system
        description: "Continuing-education dimension; evolves independently of qualification_status"
        default: COMPLIANT
        constraints: "COMPLIANT | GRACE | DEFICIENT"
      - name: ce_hours_36mo
        type: number
        source: computed
        description: "Category-1 hours inside the 36-month lookback as of the last qualification review"
        default: 0
      - name: volume_credit_24mo
        type: integer
        source: computed
        description: "READ_VOLUME exam counts inside the 24-month lookback as of the last qualification review"
        default: 0
      - name: ce_deadline_at
        type: datetime
        source: computed
        description: "Instant the granted grace period expires; set when ce_status first flips to GRACE, cleared on return to COMPLIANT"
      - name: last_qualification_review_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent qualification review"

  - name: QualificationCredit
    parent: Personnel
    common_fields: false
    fields:
      - name: personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; taken from the creation path"
      - name: credit_type
        type: enum
        source: input
        description: "CATEGORY_1_CE carries ce_hours; READ_VOLUME carries exam_count"
        constraints: "CATEGORY_1_CE | READ_VOLUME"
      - name: ce_hours
        type: number
        source: input
        description: "Category-1 credit hours; required when credit_type is CATEGORY_1_CE, must be null otherwise"
        constraints: "> 0 when present"
      - name: exam_count
        type: integer
        source: input
        description: "Interpretations/exams/surveys credited; required when credit_type is READ_VOLUME, must be null otherwise"
        constraints: "> 0 when present"
      - name: modality
        type: enum
        source: input
        description: "Modality the credit applies to; null means all modalities"
        constraints: "DM_2D | DBT_3D | null"
      - name: awarded_on
        type: datetime
        source: input
        description: "Instant the credit was earned; must not be after the logical clock"
      - name: source_note
        type: string
        source: input
        description: "Free-text provenance of the credit"

  - name: PhysicistSurvey
    parent: MammographyUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: system
        description: "FK -> MammographyUnit.id; taken from the creation path"
      - name: physicist_id
        type: string
        source: system
        description: "FK -> Personnel.id; set from the X-User-ID of the MedicalPhysicist who created the survey, never from the body"
      - name: survey_type
        type: enum
        source: input
        description: "ANNUAL is the yearly MQSA survey; POST_REPAIR is required before returning a unit to service after a qualifying failure; MOBILE covers a mobile-unit relocation check"
        constraints: "ANNUAL | POST_REPAIR | MOBILE"
      - name: status
        type: enum
        source: system
        description: "Survey lifecycle state"
        default: DRAFT
        constraints: "DRAFT | PASSED | FAILED_ACTION_REQUIRED | FAILED_FINAL"
      - name: phantom_score
        type: number
        source: input
        description: "ACR phantom image score measured at the survey; null until a decision call supplies it"
        constraints: "0.0..12.0, one decimal"
      - name: mean_glandular_dose_mgy
        type: number
        source: input
        description: "Mean glandular dose in mGy measured at the survey"
        constraints: "0.00..10.00, two decimals"
      - name: critical_deficiency_codes
        type: array
        source: input
        description: "Critical deficiency codes recorded at the survey; a non-empty list forces a failing decision and pulls the unit out of service"
        default: []
      - name: effective_start
        type: datetime
        source: input
        description: "Inclusive start of the survey validity window"
      - name: effective_end
        type: datetime
        source: input
        description: "Exclusive end of the survey validity window"
        constraints: "> effective_start; window length <= 396 days"
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent decision (submit or remediate)"
      - name: remediation_attempts
        type: integer
        source: computed
        description: "Number of remediation decisions recorded; the second failing remediation drives FAILED_FINAL"
        default: 0
        constraints: "0..2"
      - name: outcome_note
        type: string
        source: input
        description: "Free-text note attached to the latest decision"

  - name: AnnualInspection
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; taken from the creation path"
      - name: inspection_date
        type: datetime
        source: input
        description: "Instant the FDA/state inspection was conducted; must not be after the logical clock"
      - name: inspector_findings_level
        type: enum
        source: input
        description: "Most severe finding level recorded by the inspector"
        constraints: "NONE | LEVEL_3 | LEVEL_2 | LEVEL_1"
      - name: finding_codes
        type: array
        source: input
        description: "Citation codes recorded by the inspector"
        default: []
      - name: status
        type: enum
        source: system
        description: "CORRECTIVE_ACTION_REQUIRED at creation for LEVEL_1/LEVEL_2 findings, RECORDED otherwise"
        constraints: "RECORDED | CORRECTIVE_ACTION_REQUIRED | CLOSED"
      - name: corrective_action_due_at
        type: datetime
        source: computed
        description: "inspection_date + 15 days for LEVEL_1, + 30 days for LEVEL_2, null otherwise"
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the corrective action was accepted"

  - name: ClinicalImageReviewSubmission
    parent: MammographyUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: system
        description: "FK -> MammographyUnit.id; taken from the creation path"
      - name: exam_ids
        type: array
        source: input
        description: "Exam ids forming the clinical image packet; every element MUST be an Exam whose unit_id equals this submission's unit_id (many-to-many packet membership, not a scalar foreign key)"
        constraints: "length >= 2; no duplicates"
      - name: attempt_number
        type: integer
        source: computed
        description: "1 on creation, incremented by each resubmit"
        default: 1
        constraints: "1..3"
      - name: status
        type: enum
        source: system
        description: "Submission lifecycle state; the revision loop returns REVISION_REQUIRED to SUBMITTED"
        default: SUBMITTED
        constraints: "SUBMITTED | PASSED | REVISION_REQUIRED | DENIED_FINAL | WITHDRAWN"
      - name: fee_held_cents
        type: integer
        source: computed
        description: "Application fee currently escrowed against this submission; 250000 while SUBMITTED, 0 in every other status"
        default: 0
      - name: review_decision
        type: enum
        source: computed
        description: "Latest accreditation-body decision"
        constraints: "PASS | REVISION_REQUIRED | null"
      - name: deficiency_categories
        type: array
        source: input
        description: "Deficiency categories cited by the reviewer on a REVISION_REQUIRED decision"
        default: []
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the current attempt's submission"
      - name: reviewed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the latest review decision"
      - name: reviewer_note
        type: string
        source: input
        description: "Free-text reviewer note"

  - name: Exam
    parent: MammographyUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> MammographyUnit.id; the unit that acquired the images"
      - name: technologist_id
        type: string
        source: input
        description: "FK -> Personnel.id; the TECHNOLOGIST who acquired the images, must equal the caller's X-User-ID"
      - name: interpreting_physician_id
        type: string
        source: system
        description: "FK -> Personnel.id; set from the X-User-ID of the InterpretingPhysician on the first interpretation, null before that"
      - name: patient_ref
        type: string
        source: input
        description: "Pseudonymous patient reference; repeated across that patient's exams"
      - name: patient_state_code
        type: string
        source: input
        description: "Patient's state of residence, used to resolve the governing StatePolicy for notification and coverage"
        constraints: "exactly 2 uppercase letters"
      - name: exam_type
        type: enum
        source: input
        description: "SCREENING exams enter the recall-rate denominator; DIAGNOSTIC exams do not"
        constraints: "SCREENING | DIAGNOSTIC"
      - name: performed_at
        type: datetime
        source: input
        description: "Acquisition instant; must not be after the logical clock"
      - name: original_image_count
        type: integer
        source: input
        description: "Images acquired on the first pass"
        constraints: ">= 1"
      - name: report_status
        type: enum
        source: system
        description: "Reporting dimension of the exam's parallel state machine"
        default: AWAITING_INTERPRETATION
        constraints: "AWAITING_INTERPRETATION | DELAYED | INTERPRETED_FINAL | AMENDED"
      - name: notification_status
        type: enum
        source: system
        description: "Patient-notification dimension; independent of report_status"
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING | GENERATED | SENT | COMPLETE"
      - name: follow_up_status
        type: enum
        source: system
        description: "Follow-up dimension; independent of the other two dimensions"
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING | PENDING_EXTERNAL | COMPLETED | LOST_TO_FOLLOW_UP"
      - name: birads_assessment
        type: integer
        source: input
        description: "BI-RADS final assessment category recorded at interpretation"
        constraints: "0..6"
      - name: density_category
        type: enum
        source: input
        description: "BI-RADS breast density category recorded at interpretation"
        constraints: "A | B | C | D"
      - name: recall_flag
        type: boolean
        source: computed
        description: "True iff exam_type == SCREENING and birads_assessment == 0"
        default: false
      - name: biopsy_performed
        type: boolean
        source: system
        description: "Set by the pathology outcome call"
        default: false
      - name: pathology_result
        type: enum
        source: system
        description: "Outcome of the tissue diagnosis; null until an outcome is recorded"
        constraints: "PENDING | BENIGN | MALIGNANT | null"
      - name: outcome_recorded_at
        type: datetime
        source: computed
        description: "Logical-clock instant the pathology outcome was recorded"
      - name: repeat_image_count
        type: integer
        source: computed
        description: "Sum of repeat_image_count over this exam's non-retracted RepeatImagingRecord rows"
        default: 0
      - name: report_due_at
        type: datetime
        source: computed
        description: "performed_at + governing policy report_turnaround_days, in days"
      - name: interpreted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the first interpretation"
      - name: interpreted_late
        type: boolean
        source: computed
        description: "True iff interpreted_at > report_due_at"
        default: false
      - name: notification_deadline_at
        type: datetime
        source: computed
        description: "Deadline stamped by calculations.notification_requirement_selection when the current obligation opened"
      - name: amendment_count
        type: integer
        source: computed
        description: "Number of accepted amendments"
        default: 0

  - name: NotificationLetter
    parent: Exam
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Exam.id; taken from the creation path"
      - name: supersedes_letter_id
        type: string
        source: system
        description: "FK -> NotificationLetter.id; the letter this one replaces, null for the first letter on an exam"
      - name: letter_type
        type: enum
        source: computed
        description: "COMBINED when the governing policy requires a separate density notice, LAY_SUMMARY otherwise"
        constraints: "LAY_SUMMARY | COMBINED"
      - name: status
        type: enum
        source: system
        description: "Letter lifecycle state"
        default: QUEUED
        constraints: "QUEUED | SENT | DELIVERED_ASSUMED | UNDELIVERABLE | SUPERSEDED"
      - name: required_notice_codes
        type: array
        source: computed
        description: "Ordered federal-then-state notice codes selected by calculations.notification_requirement_selection"
      - name: density_statement_code
        type: enum
        source: computed
        description: "Federal density statement selected from the exam's density_category"
        constraints: "FDA_DENSE | FDA_NOT_DENSE"
      - name: reading_grade_level
        type: integer
        source: computed
        description: "min(governing policy lay_summary_max_reading_grade, 8)"
      - name: deadline_at
        type: datetime
        source: computed
        description: "Generation instant + selected deadline_days"
      - name: governing_state_code
        type: string
        source: computed
        description: "state_code of the StatePolicy actually applied — the patient's state policy when one exists, otherwise the facility's home-state policy"
      - name: dispatch_channel
        type: enum
        source: input
        description: "Delivery channel requested for this letter"
        default: MAIL
        constraints: "MAIL | PORTAL"
      - name: generated_at
        type: datetime
        source: computed
        description: "Logical-clock instant the letter was generated"
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical-clock instant the letter was dispatched"
      - name: undeliverable_reason
        type: string
        source: input
        description: "Reason recorded when the letter comes back undelivered"

  - name: SupplementalScreeningOrder
    parent: Exam
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Exam.id; taken from the creation path"
      - name: modality
        type: enum
        source: input
        description: "Supplemental screening modality recommended"
        constraints: "ULTRASOUND | MRI | CEM"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state"
        default: RECOMMENDED
        constraints: "RECOMMENDED | COVERAGE_DETERMINED | SCHEDULED | COMPLETED | REFERRED_OUT | LOST_TO_FOLLOW_UP"
      - name: coverage_outcome
        type: enum
        source: computed
        description: "Result of calculations.supplemental_coverage_determination"
        default: UNDETERMINED
        constraints: "UNDETERMINED | COVERED_NO_COST_SHARE | COVERED_WITH_COST_SHARE | PATIENT_RESPONSIBILITY | DENIED"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Fee-schedule amount for modality, plus the 3000-cent facility administration fee when coverage applies"
      - name: covered_amount_cents
        type: integer
        source: computed
        description: "Portion of allowed_amount_cents borne by the payer"
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "allowed_amount_cents - covered_amount_cents after the de-minimis waiver step"
      - name: coverage_tier
        type: enum
        source: computed
        description: "Tier selected from the fee-inclusive allowed_amount_cents"
        constraints: "TIER_1 | TIER_2 | TIER_3 | null"
      - name: governing_state_code
        type: string
        source: computed
        description: "state_code of the StatePolicy actually applied to the coverage decision — the patient's state policy when one exists, otherwise the facility's home-state policy"
      - name: recommended_at
        type: datetime
        source: computed
        description: "Logical-clock instant the order was recommended"
      - name: followup_due_at
        type: datetime
        source: computed
        description: "recommended_at + governing policy followup_grace_days, in days"
      - name: appointment_start
        type: datetime
        source: input
        description: "Requested appointment start instant"
      - name: appointment_end
        type: datetime
        source: computed
        description: "appointment_start + modality duration (ULTRASOUND 30, MRI 45, CEM 30 minutes)"
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the supplemental study was completed"
      - name: external_referral_note
        type: string
        source: computed
        description: "Stamped when the order is referred out because the facility posture went SUSPENDED"

  - name: EquipmentFailureEvent
    parent: MammographyUnit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: system
        description: "FK -> MammographyUnit.id; taken from the creation path"
      - name: failure_code
        type: enum
        source: input
        description: "Failed subsystem"
        constraints: "DETECTOR | AEC | COLLIMATION | COMPRESSION | DISPLAY | SOFTWARE"
      - name: severity
        type: enum
        source: input
        description: "Operational severity assigned by the reporter"
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: detected_at
        type: datetime
        source: input
        description: "Instant the failure was detected; must not be after the logical clock"
      - name: status
        type: enum
        source: system
        description: "OPEN until the repair is verified"
        default: OPEN
        constraints: "OPEN | REPAIR_VERIFIED"
      - name: requires_post_repair_survey
        type: boolean
        source: computed
        description: "True iff severity == CRITICAL or failure_code in {DETECTOR, AEC, COLLIMATION}; such a failure also pulls the unit out of service"
        default: false
      - name: resolved_at
        type: datetime
        source: computed
        description: "Logical-clock instant the repair was verified"
      - name: repair_note
        type: string
        source: input
        description: "Free-text repair description supplied at restore"

  - name: RepeatImagingRecord
    parent: Exam
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Exam.id; taken from the creation path"
      - name: equipment_failure_id
        type: string
        source: input
        description: "FK -> EquipmentFailureEvent.id; required when reason_code is EQUIPMENT_FAILURE, must be null otherwise"
      - name: reason_code
        type: enum
        source: input
        description: "Documented reason the images were repeated"
        constraints: "POSITIONING | MOTION | EXPOSURE | ARTIFACT | EQUIPMENT_FAILURE"
      - name: repeat_image_count
        type: integer
        source: input
        description: "Number of images re-acquired"
        constraints: ">= 1"
      - name: retracted
        type: boolean
        source: system
        description: "True once quality assurance retracts the record as documented in error"
        default: false
      - name: retraction_reason
        type: string
        source: input
        description: "Reason recorded at retraction"
      - name: documented_at
        type: datetime
        source: computed
        description: "Logical-clock instant the repeat was documented"

  - name: RadiologistAuditCycle
    parent: Personnel
    common_fields: true
    fields:
      - name: radiologist_id
        type: string
        source: system
        description: "FK -> Personnel.id; taken from the creation path, must be an INTERPRETING_PHYSICIAN"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the audit period"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the audit period"
        constraints: "> period_start"
      - name: status
        type: enum
        source: system
        description: "OPEN while accumulating, LOCKED once closed, AMENDED when a scored exam is amended after lock"
        default: OPEN
        constraints: "OPEN | LOCKED | AMENDED"
      - name: variant_at_close
        type: enum
        source: system
        description: "PPV variant selected by the closing call and stored on the row"
        constraints: "PPV1_SCREENING | PPV3_BIOPSY_ALL | null"
      - name: followup_window_days
        type: integer
        source: input
        description: "Outcome window applied by the PPV1_SCREENING variant"
        default: 365
        constraints: "30..730"
      - name: screening_exam_count
        type: integer
        source: computed
        description: "In-scope SCREENING exams; null until the cycle is closed"
      - name: recall_count
        type: integer
        source: computed
        description: "In-scope exams with recall_flag true"
      - name: biopsy_count
        type: integer
        source: computed
        description: "Denominator of the variant actually applied at close"
      - name: cancer_count
        type: integer
        source: computed
        description: "Numerator of the variant actually applied at close"
      - name: excluded_exam_count
        type: integer
        source: computed
        description: "In-scope exams the applied variant could not score (outcome missing, PENDING, or recorded outside followup_window_days)"
      - name: recall_rate_pct
        type: number
        source: computed
        description: "recall_count / screening_exam_count * 100; null when screening_exam_count == 0"
      - name: ppv_pct
        type: number
        source: computed
        description: "cancer_count / biopsy_count * 100 under the applied variant; null when biopsy_count == 0"
      - name: abnormal_interpretation_flag
        type: boolean
        source: computed
        description: "True iff recall_rate_pct is non-null and outside the closed benchmark band 5.00..12.00"
      - name: locked_at
        type: datetime
        source: computed
        description: "Logical-clock instant the cycle was closed"

# =============================================================================
# §1.2 State Machine Table
#
# Every entry names the `state_field:` it governs so parallel dimensions on the
# same entity stay distinguishable. Reference form used by §1.8/§1.9 grounds:
#   state_machines.<Entity>.<state_field>.<FROM>_to_<TO>
# =============================================================================
state_machines:

  # --- Facility: compound posture derived from its units and inspections ------
  - entity: Facility
    state_field: compliance_posture
    initial_state: COMPLIANT
    terminal_states: []
    note: |
      Never set by a client. Recomputed by calculations.facility_compliance_posture
      whenever a child MammographyUnit's accreditation_status, operational_state or
      survey_compliance changes, whenever an AnnualInspection is recorded or closed,
      and at every compliance run. Transitions below document the observable jumps.
    transitions:
      - from: COMPLIANT
        to: CONDITIONAL
        trigger: "system recompute after a child unit enters PROBATION or its survey_compliance becomes OVERDUE/FAILED"
        actor: system
        preconditions:
          - "at least one MammographyUnit at the facility has accreditation_status == PROBATION or survey_compliance in {OVERDUE, FAILED}"
          - "at least one MammographyUnit has operational_state == IN_SERVICE and accreditation_status in {PROVISIONAL, ACCREDITED, PROBATION}"
          - "no AnnualInspection at the facility has inspector_findings_level == LEVEL_1 and status == CORRECTIVE_ACTION_REQUIRED"
        side_effects:
          - "Facility.compliance_posture = CONDITIONAL"
          - "Facility.updated_at refreshed and Facility.version incremented by 1"
      - from: COMPLIANT
        to: SUSPENDED
        trigger: "system recompute after the last serviceable unit leaves service, or after a LEVEL_1 inspection finding is recorded"
        actor: system
        preconditions:
          - "count(MammographyUnit at facility with operational_state == IN_SERVICE and accreditation_status in {PROVISIONAL, ACCREDITED, PROBATION}) == 0, OR an AnnualInspection with inspector_findings_level == LEVEL_1 is in status CORRECTIVE_ACTION_REQUIRED"
        side_effects:
          - "Facility.compliance_posture = SUSPENDED"
          - "cascade (caused by the posture change): every SupplementalScreeningOrder whose exam_id resolves through Exam.unit_id to a unit of this facility and whose status is in {RECOMMENDED, COVERAGE_DETERMINED} moves to REFERRED_OUT, processed in Exam.performed_at ASC then SupplementalScreeningOrder.created_at ASC order"
          - "Facility.version incremented by 1"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "system recompute after the last serviceable unit leaves service, or after a LEVEL_1 inspection finding is recorded"
        actor: system
        preconditions:
          - "same predicate as COMPLIANT_to_SUSPENDED"
        side_effects:
          - "Facility.compliance_posture = SUSPENDED"
          - "cascade (caused by the posture change): open SupplementalScreeningOrder rows move to REFERRED_OUT in the pinned order above"
          - "Facility.version incremented by 1"
      - from: CONDITIONAL
        to: COMPLIANT
        trigger: "system recompute after every unit returns to ACCREDITED/PROVISIONAL with survey_compliance CURRENT"
        actor: system
        preconditions:
          - "no MammographyUnit at the facility has accreditation_status == PROBATION"
          - "every MammographyUnit at the facility has survey_compliance == CURRENT"
          - "at least one MammographyUnit has operational_state == IN_SERVICE"
          - "no AnnualInspection is in status CORRECTIVE_ACTION_REQUIRED with inspector_findings_level == LEVEL_1"
        side_effects:
          - "Facility.compliance_posture = COMPLIANT"
          - "Facility.version incremented by 1"
      - from: SUSPENDED
        to: CONDITIONAL
        trigger: "system recompute after a unit returns to service or a LEVEL_1 corrective action is closed"
        actor: system
        preconditions:
          - "at least one MammographyUnit has operational_state == IN_SERVICE and accreditation_status in {PROVISIONAL, ACCREDITED, PROBATION}"
          - "no AnnualInspection with inspector_findings_level == LEVEL_1 remains in status CORRECTIVE_ACTION_REQUIRED"
          - "at least one MammographyUnit still has accreditation_status == PROBATION or survey_compliance in {OVERDUE, FAILED}"
        side_effects:
          - "Facility.compliance_posture = CONDITIONAL"
          - "orders already moved to REFERRED_OUT are NOT restored — referral is not reversed by a posture recovery"
          - "Facility.version incremented by 1"
      - from: SUSPENDED
        to: COMPLIANT
        trigger: "system recompute after full recovery"
        actor: system
        preconditions:
          - "same predicate as CONDITIONAL_to_COMPLIANT"
        side_effects:
          - "Facility.compliance_posture = COMPLIANT"
          - "Facility.version incremented by 1"

  # --- MammographyUnit dimension 1: accreditation ----------------------------
  - entity: MammographyUnit
    state_field: accreditation_status
    initial_state: PROVISIONAL
    terminal_states: [SUSPENDED]
    note: |
      Cyclic: PROBATION returns to ACCREDITED through a passing clinical image review,
      and ACCREDITED returns to REACCREDITATION_DUE every cycle. Evolves independently
      of operational_state (parallel dimension).
    transitions:
      - from: PROVISIONAL
        to: ACCREDITED
        trigger: "POST /clinical-image-reviews/{id}/review with decision PASS"
        actor: AccreditationBodyReviewer
        preconditions:
          - "the submission's unit_id equals this unit"
          - "submission.status == SUBMITTED"
        side_effects:
          - "MammographyUnit.accreditation_status = ACCREDITED"
          - "MammographyUnit.accreditation_expires_on = logical clock + 1095 days"
          - "MammographyUnit.reaccreditation_attempts_remaining reset to 3"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: ACCREDITED
        to: REACCREDITATION_DUE
        trigger: "POST /facilities/{id}/compliance-runs (step 1)"
        actor: system
        preconditions:
          - "logical clock >= MammographyUnit.accreditation_expires_on - 180 days"
        side_effects:
          - "MammographyUnit.accreditation_status = REACCREDITATION_DUE"
          - "cascade: Facility.compliance_posture recomputed (REACCREDITATION_DUE alone does not degrade posture)"
          - "MammographyUnit.version incremented by 1"
      - from: REACCREDITATION_DUE
        to: ACCREDITED
        trigger: "POST /clinical-image-reviews/{id}/review with decision PASS"
        actor: AccreditationBodyReviewer
        preconditions:
          - "submission.status == SUBMITTED and submission.unit_id == this unit"
        side_effects:
          - "MammographyUnit.accreditation_status = ACCREDITED"
          - "MammographyUnit.accreditation_expires_on = logical clock + 1095 days"
          - "MammographyUnit.reaccreditation_attempts_remaining reset to 3"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: ACCREDITED
        to: PROBATION
        trigger: "failing survey decision (POST /physicist-surveys/{id}/submit or /remediate) — cascade level 2"
        actor: system
        preconditions:
          - "MammographyUnit.survey_compliance became FAILED as cascade level 1 of the same decision"
        side_effects:
          - "MammographyUnit.accreditation_status = PROBATION"
          - "cascade level 3 (caused by this change): Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: PROVISIONAL
        to: PROBATION
        trigger: "failing survey decision — cascade level 2"
        actor: system
        preconditions:
          - "MammographyUnit.survey_compliance became FAILED as cascade level 1 of the same decision"
        side_effects:
          - "MammographyUnit.accreditation_status = PROBATION"
          - "cascade level 3: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: REACCREDITATION_DUE
        to: PROBATION
        trigger: "failing survey decision — cascade level 2"
        actor: system
        preconditions:
          - "MammographyUnit.survey_compliance became FAILED as cascade level 1 of the same decision"
        side_effects:
          - "MammographyUnit.accreditation_status = PROBATION"
          - "cascade level 3: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: PROBATION
        to: ACCREDITED
        trigger: "POST /clinical-image-reviews/{id}/review with decision PASS"
        actor: AccreditationBodyReviewer
        preconditions:
          - "submission.status == SUBMITTED and submission.unit_id == this unit"
          - "MammographyUnit.survey_compliance == CURRENT (a PASSED survey window covers the logical clock)"
        side_effects:
          - "MammographyUnit.accreditation_status = ACCREDITED"
          - "MammographyUnit.accreditation_expires_on = logical clock + 1095 days"
          - "MammographyUnit.reaccreditation_attempts_remaining reset to 3"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /clinical-image-reviews/{id}/review with decision REVISION_REQUIRED while reaccreditation_attempts_remaining == 0"
        actor: AccreditationBodyReviewer
        preconditions:
          - "submission.status == SUBMITTED"
          - "MammographyUnit.reaccreditation_attempts_remaining == 0 after this attempt is consumed"
        side_effects:
          - "ClinicalImageReviewSubmission.status = DENIED_FINAL"
          - "MammographyUnit.accreditation_status = SUSPENDED"
          - "cascade (caused by the suspension): MammographyUnit.operational_state = OUT_OF_SERVICE"
          - "cascade (caused by the unit leaving service): Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /clinical-image-reviews/{id}/review with decision REVISION_REQUIRED while reaccreditation_attempts_remaining == 0"
        actor: AccreditationBodyReviewer
        preconditions:
          - "submission.status == SUBMITTED"
          - "MammographyUnit.reaccreditation_attempts_remaining == 0"
          - "the unit was never ACCREDITED, so a REVISION_REQUIRED review never moved it to PROBATION"
        side_effects:
          - "ClinicalImageReviewSubmission.status = DENIED_FINAL"
          - "MammographyUnit.accreditation_status = SUSPENDED"
          - "cascade (caused by the suspension): MammographyUnit.operational_state = OUT_OF_SERVICE"
          - "cascade (caused by the unit leaving service): Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: REACCREDITATION_DUE
        to: SUSPENDED
        trigger: "POST /facilities/{id}/compliance-runs (step 1) after the certificate grace period lapses"
        actor: system
        preconditions:
          - "logical clock > MammographyUnit.accreditation_expires_on + 30 days"
        side_effects:
          - "MammographyUnit.accreditation_status = SUSPENDED"
          - "cascade: MammographyUnit.operational_state = OUT_OF_SERVICE"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"

  # --- MammographyUnit dimension 2: service state ---------------------------
  - entity: MammographyUnit
    state_field: operational_state
    initial_state: IN_SERVICE
    terminal_states: []
    note: "Cyclic (IN_SERVICE -> OUT_OF_SERVICE -> IN_SERVICE) and independent of accreditation_status."
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /units/{id}/equipment-failures with a qualifying failure"
        actor: Technologist
        preconditions:
          - "EquipmentFailureEvent.requires_post_repair_survey == true (severity CRITICAL or failure_code in {DETECTOR, AEC, COLLIMATION})"
        side_effects:
          - "MammographyUnit.operational_state = OUT_OF_SERVICE"
          - "cascade (caused by the unit leaving service): Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "failing survey decision carrying at least one critical deficiency code — cascade level 2"
        actor: system
        preconditions:
          - "the decision set MammographyUnit.survey_compliance = FAILED (cascade level 1)"
          - "the deciding survey's critical_deficiency_codes is non-empty"
        side_effects:
          - "MammographyUnit.operational_state = OUT_OF_SERVICE"
          - "cascade level 3: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /equipment-failures/{id}/restore"
        actor: AccreditationCoordinator
        preconditions:
          - "EquipmentFailureEvent.status == OPEN"
          - "when the event requires_post_repair_survey: a PhysicistSurvey on the same unit exists with survey_type == POST_REPAIR, status == PASSED and effective_start >= EquipmentFailureEvent.detected_at"
          - "no other EquipmentFailureEvent on the unit remains OPEN with requires_post_repair_survey == true"
          - "MammographyUnit.accreditation_status != SUSPENDED"
        side_effects:
          - "EquipmentFailureEvent.status = REPAIR_VERIFIED and resolved_at = logical clock"
          - "MammographyUnit.operational_state = IN_SERVICE"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"

  # --- PhysicistSurvey: branching decision with a self-loop on remediation ---
  - entity: PhysicistSurvey
    state_field: status
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED_FINAL]
    note: |
      Branching fork with divergent side-effect sets: the PASSED branch refreshes the
      unit's survey currency, the FAILED_ACTION_REQUIRED branch opens the 5-level
      compliance cascade. FAILED_ACTION_REQUIRED -> FAILED_ACTION_REQUIRED is a real
      self-loop taken by the first failing remediation.
    transitions:
      - from: DRAFT
        to: PASSED
        trigger: "POST /physicist-surveys/{id}/submit"
        actor: MedicalPhysicist
        preconditions:
          - "X-User-ID == PhysicistSurvey.physicist_id"
          - "calculations.survey_pass_determination returns PASS for the submitted measurements"
        side_effects:
          - "PhysicistSurvey.status = PASSED, decided_at = logical clock"
          - "MammographyUnit.last_passed_survey_end = PhysicistSurvey.effective_end"
          - "MammographyUnit.survey_compliance = CURRENT when effective_start <= clock < effective_end, else unchanged"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: DRAFT
        to: FAILED_ACTION_REQUIRED
        trigger: "POST /physicist-surveys/{id}/submit"
        actor: MedicalPhysicist
        preconditions:
          - "X-User-ID == PhysicistSurvey.physicist_id"
          - "calculations.survey_pass_determination returns FAIL for the submitted measurements"
        side_effects:
          - "PhysicistSurvey.status = FAILED_ACTION_REQUIRED, decided_at = logical clock"
          - "cascade level 1: MammographyUnit.survey_compliance = FAILED"
          - "cascade level 2 (caused by survey_compliance = FAILED): MammographyUnit.accreditation_status -> PROBATION; and when critical_deficiency_codes is non-empty, MammographyUnit.operational_state -> OUT_OF_SERVICE"
          - "cascade level 3 (caused by the unit field changes): Facility.compliance_posture recomputed"
          - "cascade level 4 (caused by posture becoming SUSPENDED): open SupplementalScreeningOrder rows at the facility -> REFERRED_OUT"
          - "cascade level 5 (caused by each order becoming REFERRED_OUT): that order's Exam.follow_up_status PENDING -> PENDING_EXTERNAL"
          - "MammographyUnit.version incremented by 1"
      - from: FAILED_ACTION_REQUIRED
        to: FAILED_ACTION_REQUIRED
        trigger: "POST /physicist-surveys/{id}/remediate with still-failing measurements and remediation_attempts == 0"
        actor: AccreditationCoordinator
        preconditions:
          - "PhysicistSurvey.remediation_attempts < 2"
          - "calculations.survey_pass_determination returns FAIL for the remediated measurements"
          - "remediation_attempts + 1 < 2"
        side_effects:
          - "PhysicistSurvey.remediation_attempts incremented by 1, decided_at = logical clock, measurements overwritten"
          - "MammographyUnit.survey_compliance stays FAILED; no further unit transition fires"
          - "PhysicistSurvey.version incremented by 1"
      - from: FAILED_ACTION_REQUIRED
        to: PASSED
        trigger: "POST /physicist-surveys/{id}/remediate with passing measurements"
        actor: AccreditationCoordinator
        preconditions:
          - "PhysicistSurvey.remediation_attempts < 2"
          - "calculations.survey_pass_determination returns PASS for the remediated measurements"
        side_effects:
          - "PhysicistSurvey.status = PASSED, remediation_attempts incremented by 1, decided_at = logical clock"
          - "MammographyUnit.survey_compliance = CURRENT when the window covers the clock"
          - "MammographyUnit.last_passed_survey_end = PhysicistSurvey.effective_end"
          - "cascade: Facility.compliance_posture recomputed (a PROBATION unit stays on probation until a clinical image review passes)"
          - "MammographyUnit.version incremented by 1"
      - from: FAILED_ACTION_REQUIRED
        to: FAILED_FINAL
        trigger: "POST /physicist-surveys/{id}/remediate with still-failing measurements and remediation_attempts == 1"
        actor: AccreditationCoordinator
        preconditions:
          - "PhysicistSurvey.remediation_attempts == 1"
          - "calculations.survey_pass_determination returns FAIL"
        side_effects:
          - "PhysicistSurvey.status = FAILED_FINAL, remediation_attempts = 2, decided_at = logical clock"
          - "MammographyUnit.operational_state = OUT_OF_SERVICE (unconditional on a final survey failure)"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"

  # --- AnnualInspection ------------------------------------------------------
  - entity: AnnualInspection
    state_field: status
    initial_state: RECORDED
    terminal_states: [CLOSED]
    note: "Branching at creation: LEVEL_1/LEVEL_2 findings open a corrective action, NONE/LEVEL_3 land directly in RECORDED."
    transitions:
      - from: RECORDED
        to: CORRECTIVE_ACTION_REQUIRED
        trigger: "POST /facilities/{id}/inspections with inspector_findings_level in {LEVEL_1, LEVEL_2} (applied at creation, before the row is first observable)"
        actor: FdaInspector
        preconditions:
          - "inspection_date <= logical clock"
        side_effects:
          - "AnnualInspection.status = CORRECTIVE_ACTION_REQUIRED"
          - "AnnualInspection.corrective_action_due_at = inspection_date + 15 days for LEVEL_1, + 30 days for LEVEL_2"
          - "cascade (LEVEL_1 only): Facility.compliance_posture recomputed and becomes SUSPENDED"
          - "cascade level 2 (caused by posture SUSPENDED): open SupplementalScreeningOrder rows at the facility -> REFERRED_OUT"
      - from: CORRECTIVE_ACTION_REQUIRED
        to: CLOSED
        trigger: "POST /inspections/{id}/close"
        actor: FdaInspector
        preconditions:
          - "AnnualInspection.status == CORRECTIVE_ACTION_REQUIRED"
        side_effects:
          - "AnnualInspection.status = CLOSED, closed_at = logical clock"
          - "cascade: Facility.compliance_posture recomputed (a closed LEVEL_1 finding no longer forces SUSPENDED)"
          - "AnnualInspection.version incremented by 1"
      - from: RECORDED
        to: CLOSED
        trigger: "POST /inspections/{id}/close"
        actor: FdaInspector
        preconditions:
          - "AnnualInspection.status == RECORDED"
        side_effects:
          - "AnnualInspection.status = CLOSED, closed_at = logical clock"
          - "AnnualInspection.version incremented by 1"

  # --- ClinicalImageReviewSubmission: revision loop --------------------------
  - entity: ClinicalImageReviewSubmission
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [PASSED, DENIED_FINAL, WITHDRAWN]
    note: |
      Cyclic: REVISION_REQUIRED -> SUBMITTED via resubmit, bounded by the unit's
      reaccreditation_attempts_remaining budget (3 per cycle).
    transitions:
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /clinical-image-reviews/{id}/review with decision PASS"
        actor: AccreditationBodyReviewer
        preconditions:
          - "ClinicalImageReviewSubmission.status == SUBMITTED"
        side_effects:
          - "ClinicalImageReviewSubmission.status = PASSED, review_decision = PASS, reviewed_at = logical clock"
          - "fee ledger: submission.fee_held_cents -> 0; Facility.fee_held_cents -= 250000; Facility.fee_consumed_cents += 250000"
          - "MammographyUnit.accreditation_status -> ACCREDITED, accreditation_expires_on = clock + 1095 days, reaccreditation_attempts_remaining reset to 3"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /clinical-image-reviews/{id}/review with decision REVISION_REQUIRED and reaccreditation_attempts_remaining >= 1"
        actor: AccreditationBodyReviewer
        preconditions:
          - "ClinicalImageReviewSubmission.status == SUBMITTED"
          - "MammographyUnit.reaccreditation_attempts_remaining >= 1"
        side_effects:
          - "ClinicalImageReviewSubmission.status = REVISION_REQUIRED, review_decision = REVISION_REQUIRED, deficiency_categories stored, reviewed_at = logical clock"
          - "fee ledger: submission.fee_held_cents -> 0; Facility.fee_held_cents -= 250000; Facility.fee_consumed_cents += 250000"
          - "MammographyUnit.accreditation_status -> PROBATION when it was ACCREDITED or REACCREDITATION_DUE"
          - "cascade: Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: REVISION_REQUIRED
        to: SUBMITTED
        trigger: "POST /clinical-image-reviews/{id}/resubmit"
        actor: AccreditationCoordinator
        preconditions:
          - "ClinicalImageReviewSubmission.status == REVISION_REQUIRED"
          - "expected_unit_version matches MammographyUnit.version"
          - "MammographyUnit.reaccreditation_attempts_remaining >= 1"
          - "Facility.prepaid_credit_cents >= 250000"
          - "every exam id in the new packet belongs to this unit and is in report_status in {INTERPRETED_FINAL, AMENDED}"
        side_effects:
          - "ClinicalImageReviewSubmission.status = SUBMITTED, attempt_number incremented by 1, exam_ids replaced, submitted_at = logical clock"
          - "fee ledger: Facility.prepaid_credit_cents -= 250000; Facility.fee_held_cents += 250000; submission.fee_held_cents = 250000"
          - "MammographyUnit.reaccreditation_attempts_remaining decremented by 1"
          - "MammographyUnit.version incremented by 1"
      - from: SUBMITTED
        to: DENIED_FINAL
        trigger: "POST /clinical-image-reviews/{id}/review with decision REVISION_REQUIRED while reaccreditation_attempts_remaining == 0"
        actor: AccreditationBodyReviewer
        preconditions:
          - "ClinicalImageReviewSubmission.status == SUBMITTED"
          - "MammographyUnit.reaccreditation_attempts_remaining == 0"
        side_effects:
          - "ClinicalImageReviewSubmission.status = DENIED_FINAL, review_decision = REVISION_REQUIRED, reviewed_at = logical clock"
          - "fee ledger: submission.fee_held_cents -> 0; Facility.fee_held_cents -= 250000; Facility.fee_consumed_cents += 250000"
          - "cascade level 1: MammographyUnit.accreditation_status = SUSPENDED"
          - "cascade level 2 (caused by the suspension): MammographyUnit.operational_state = OUT_OF_SERVICE"
          - "cascade level 3 (caused by the unit leaving service): Facility.compliance_posture recomputed"
          - "MammographyUnit.version incremented by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /clinical-image-reviews/{id}/withdraw"
        actor: AccreditationCoordinator
        preconditions:
          - "ClinicalImageReviewSubmission.status == SUBMITTED"
          - "expected_unit_version matches MammographyUnit.version"
        side_effects:
          - "ClinicalImageReviewSubmission.status = WITHDRAWN"
          - "compensating fee ledger: Facility.prepaid_credit_cents += 250000; Facility.fee_held_cents -= 250000; submission.fee_held_cents = 0; Facility.fee_consumed_cents unchanged"
          - "MammographyUnit.reaccreditation_attempts_remaining incremented by 1 (attempt budget restored)"
          - "MammographyUnit.accreditation_status unchanged"
          - "MammographyUnit.version incremented by 1"

  # --- EquipmentFailureEvent ------------------------------------------------
  - entity: EquipmentFailureEvent
    state_field: status
    initial_state: OPEN
    terminal_states: [REPAIR_VERIFIED]
    transitions:
      - from: OPEN
        to: REPAIR_VERIFIED
        trigger: "POST /equipment-failures/{id}/restore"
        actor: AccreditationCoordinator
        preconditions:
          - "EquipmentFailureEvent.status == OPEN"
          - "when requires_post_repair_survey: a PASSED PhysicistSurvey with survey_type == POST_REPAIR and effective_start >= detected_at exists on the unit"
          - "MammographyUnit.accreditation_status != SUSPENDED"
        side_effects:
          - "EquipmentFailureEvent.status = REPAIR_VERIFIED, resolved_at = logical clock, repair_note stored"
          - "MammographyUnit.operational_state -> IN_SERVICE when no other OPEN qualifying failure remains"
          - "cascade: Facility.compliance_posture recomputed"
          - "EquipmentFailureEvent.version incremented by 1"

  # --- Exam dimension 1: reporting ------------------------------------------
  - entity: Exam
    state_field: report_status
    initial_state: AWAITING_INTERPRETATION
    terminal_states: []
    note: "Cyclic through DELAYED and self-looping on AMENDED; independent of notification_status and follow_up_status."
    transitions:
      - from: AWAITING_INTERPRETATION
        to: INTERPRETED_FINAL
        trigger: "POST /exams/{id}/interpret"
        actor: InterpretingPhysician
        preconditions:
          - "acting Personnel has role_type == INTERPRETING_PHYSICIAN, qualification_status == QUALIFIED and facility_id == the exam's unit's facility_id"
          - "density_category present when exam_type == SCREENING"
        side_effects:
          - "Exam.report_status = INTERPRETED_FINAL, interpreted_at = logical clock, interpreting_physician_id = X-User-ID"
          - "Exam.interpreted_late = (interpreted_at > report_due_at)"
          - "Exam.recall_flag recomputed"
          - "Exam.notification_status NOT_REQUIRED -> PENDING and Exam.follow_up_status -> PENDING when recall_flag is true, else NOT_REQUIRED"
          - "Facility.open_notice_obligations recomputed (increments by 1)"
          - "Exam.version incremented by 1"
      - from: AWAITING_INTERPRETATION
        to: DELAYED
        trigger: "POST /facilities/{id}/compliance-runs (step 2)"
        actor: system
        preconditions:
          - "logical clock > Exam.report_due_at"
          - "Exam.report_status == AWAITING_INTERPRETATION"
        side_effects:
          - "Exam.report_status = DELAYED"
          - "Exam.version incremented by 1"
      - from: DELAYED
        to: INTERPRETED_FINAL
        trigger: "POST /exams/{id}/interpret"
        actor: InterpretingPhysician
        preconditions:
          - "same preconditions as AWAITING_INTERPRETATION_to_INTERPRETED_FINAL"
        side_effects:
          - "same side effects, and Exam.interpreted_late = true"
          - "Exam.version incremented by 1"
      - from: INTERPRETED_FINAL
        to: AMENDED
        trigger: "POST /exams/{id}/amend"
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == Exam.interpreting_physician_id"
          - "at least one of birads_assessment / density_category differs from the stored value"
        side_effects:
          - "Exam.report_status = AMENDED, amendment_count incremented by 1, recall_flag recomputed"
          - "cascade level 1 -> 2: the current NotificationLetter (status in {QUEUED, SENT, DELIVERED_ASSUMED}) moves to SUPERSEDED"
          - "cascade level 3 (caused by the letter's supersession): Exam.notification_status -> PENDING, Exam.notification_deadline_at cleared, Facility.open_notice_obligations recomputed"
          - "fan-out (not part of the cascade chain): every LOCKED RadiologistAuditCycle of Exam.interpreting_physician_id whose [period_start, period_end) contains performed_at moves to AMENDED"
          - "Exam.version incremented by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /exams/{id}/amend"
        actor: InterpretingPhysician
        preconditions:
          - "X-User-ID == Exam.interpreting_physician_id"
          - "at least one of birads_assessment / density_category differs from the stored value"
        side_effects:
          - "same side-effect set as INTERPRETED_FINAL_to_AMENDED; amendment_count keeps incrementing"
          - "Exam.version incremented by 1"

  # --- Exam dimension 2: notification ---------------------------------------
  - entity: Exam
    state_field: notification_status
    initial_state: NOT_REQUIRED
    terminal_states: []
    note: "Cyclic: COMPLETE/SENT return to PENDING when an amendment supersedes the letter or the letter comes back undeliverable."
    transitions:
      - from: NOT_REQUIRED
        to: PENDING
        trigger: "POST /exams/{id}/interpret"
        actor: InterpretingPhysician
        preconditions:
          - "the interpretation succeeded"
        side_effects:
          - "Exam.notification_status = PENDING"
          - "Facility.open_notice_obligations incremented by 1"
      - from: PENDING
        to: GENERATED
        trigger: "POST /exams/{id}/notification-letters"
        actor: AccreditationCoordinator
        preconditions:
          - "Exam.report_status in {INTERPRETED_FINAL, AMENDED}"
          - "Exam.notification_status == PENDING"
          - "expected_exam_version matches Exam.version"
        side_effects:
          - "a NotificationLetter row is created in status QUEUED with the fields selected by calculations.notification_requirement_selection"
          - "Exam.notification_status = GENERATED, Exam.notification_deadline_at = letter.deadline_at"
          - "Exam.version incremented by 1"
      - from: GENERATED
        to: SENT
        trigger: "POST /notification-letters/{id}/send"
        actor: AccreditationCoordinator
        preconditions:
          - "NotificationLetter.status == QUEUED"
        side_effects:
          - "NotificationLetter.status = SENT, sent_at = logical clock"
          - "Exam.notification_status = SENT"
          - "Exam.version incremented by 1"
      - from: SENT
        to: COMPLETE
        trigger: "POST /facilities/{id}/compliance-runs (step 3)"
        actor: system
        preconditions:
          - "the exam's current letter is SENT and logical clock >= letter.sent_at + 14 days"
        side_effects:
          - "NotificationLetter.status = DELIVERED_ASSUMED"
          - "Exam.notification_status = COMPLETE"
          - "Facility.open_notice_obligations decremented by 1"
      - from: SENT
        to: PENDING
        trigger: "POST /notification-letters/{id}/mark-undeliverable"
        actor: AccreditationCoordinator
        preconditions:
          - "NotificationLetter.status == SENT"
        side_effects:
          - "NotificationLetter.status = UNDELIVERABLE, undeliverable_reason stored"
          - "Exam.notification_status = PENDING (obligation reopened; Facility.open_notice_obligations unchanged because PENDING is still an open obligation)"
          - "Exam.notification_deadline_at cleared"
          - "Exam.version incremented by 1"
      - from: COMPLETE
        to: PENDING
        trigger: "POST /exams/{id}/amend — cascade level 3"
        actor: system
        preconditions:
          - "the amendment superseded the DELIVERED_ASSUMED letter (cascade level 2)"
        side_effects:
          - "Exam.notification_status = PENDING"
          - "Facility.open_notice_obligations incremented by 1"
      - from: GENERATED
        to: PENDING
        trigger: "POST /exams/{id}/amend — cascade level 3"
        actor: system
        preconditions:
          - "the amendment superseded the QUEUED letter (cascade level 2)"
        side_effects:
          - "Exam.notification_status = PENDING; Facility.open_notice_obligations unchanged"
      - from: SENT
        to: PENDING
        trigger: "POST /exams/{id}/amend — cascade level 3"
        actor: system
        preconditions:
          - "the amendment superseded the SENT letter (cascade level 2)"
        side_effects:
          - "Exam.notification_status = PENDING; Facility.open_notice_obligations unchanged"

  # --- Exam dimension 3: follow-up ------------------------------------------
  - entity: Exam
    state_field: follow_up_status
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: PENDING
        trigger: "POST /exams/{id}/interpret with recall_flag true, or POST /exams/{id}/supplemental-orders"
        actor: InterpretingPhysician
        preconditions:
          - "Exam.recall_flag == true after interpretation, or a SupplementalScreeningOrder was created for the exam"
        side_effects:
          - "Exam.follow_up_status = PENDING"
      - from: PENDING
        to: PENDING_EXTERNAL
        trigger: "cascade level 5 of a facility posture drop to SUSPENDED"
        actor: system
        preconditions:
          - "a SupplementalScreeningOrder of this exam moved to REFERRED_OUT (cascade level 4)"
        side_effects:
          - "Exam.follow_up_status = PENDING_EXTERNAL"
      - from: PENDING
        to: COMPLETED
        trigger: "POST /supplemental-orders/{id}/complete"
        actor: AccreditationCoordinator
        preconditions:
          - "SupplementalScreeningOrder.status == SCHEDULED"
        side_effects:
          - "SupplementalScreeningOrder.status = COMPLETED, completed_at = logical clock"
          - "Exam.follow_up_status = COMPLETED when no other non-terminal order remains on the exam"
      - from: PENDING
        to: LOST_TO_FOLLOW_UP
        trigger: "POST /facilities/{id}/compliance-runs (step 4)"
        actor: system
        preconditions:
          - "a SupplementalScreeningOrder of this exam is in status in {RECOMMENDED, COVERAGE_DETERMINED} and logical clock > order.followup_due_at"
        side_effects:
          - "SupplementalScreeningOrder.status = LOST_TO_FOLLOW_UP"
          - "Exam.follow_up_status = LOST_TO_FOLLOW_UP"
      - from: LOST_TO_FOLLOW_UP
        to: PENDING
        trigger: "POST /supplemental-orders/{id}/schedule on a re-engaged patient"
        actor: AccreditationCoordinator
        preconditions:
          - "SupplementalScreeningOrder.status == LOST_TO_FOLLOW_UP"
          - "SupplementalScreeningOrder.coverage_outcome != UNDETERMINED"
        side_effects:
          - "SupplementalScreeningOrder.status = SCHEDULED"
          - "Exam.follow_up_status = PENDING"

  # --- NotificationLetter ---------------------------------------------------
  - entity: NotificationLetter
    state_field: status
    initial_state: QUEUED
    terminal_states: [DELIVERED_ASSUMED, SUPERSEDED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /notification-letters/{id}/send"
        actor: AccreditationCoordinator
        preconditions:
          - "NotificationLetter.status == QUEUED"
          - "the letter's Exam.report_status is in {INTERPRETED_FINAL, AMENDED}"
        side_effects:
          - "NotificationLetter.status = SENT, sent_at = logical clock"
          - "Exam.notification_status = SENT"
          - "NotificationLetter.version incremented by 1"
      - from: SENT
        to: DELIVERED_ASSUMED
        trigger: "POST /facilities/{id}/compliance-runs (step 3)"
        actor: system
        preconditions:
          - "logical clock >= NotificationLetter.sent_at + 14 days"
        side_effects:
          - "NotificationLetter.status = DELIVERED_ASSUMED"
          - "Exam.notification_status = COMPLETE; Facility.open_notice_obligations decremented by 1"
      - from: SENT
        to: UNDELIVERABLE
        trigger: "POST /notification-letters/{id}/mark-undeliverable"
        actor: AccreditationCoordinator
        preconditions:
          - "NotificationLetter.status == SENT"
        side_effects:
          - "NotificationLetter.status = UNDELIVERABLE, undeliverable_reason stored"
          - "Exam.notification_status = PENDING"
          - "NotificationLetter.version incremented by 1"
      - from: UNDELIVERABLE
        to: SUPERSEDED
        trigger: "POST /exams/{id}/notification-letters (reissue)"
        actor: AccreditationCoordinator
        preconditions:
          - "a new letter is generated for the same exam"
        side_effects:
          - "the UNDELIVERABLE letter moves to SUPERSEDED"
          - "the new letter's supersedes_letter_id points at it"
      - from: QUEUED
        to: SUPERSEDED
        trigger: "POST /exams/{id}/amend — cascade level 2"
        actor: system
        preconditions:
          - "the exam moved to AMENDED"
        side_effects:
          - "NotificationLetter.status = SUPERSEDED"
          - "cascade level 3: Exam.notification_status -> PENDING"
      - from: SENT
        to: SUPERSEDED
        trigger: "POST /exams/{id}/amend — cascade level 2"
        actor: system
        preconditions:
          - "the exam moved to AMENDED"
        side_effects:
          - "NotificationLetter.status = SUPERSEDED"
          - "cascade level 3: Exam.notification_status -> PENDING"
      - from: DELIVERED_ASSUMED
        to: SUPERSEDED
        trigger: "POST /exams/{id}/amend — cascade level 2"
        actor: system
        preconditions:
          - "the exam moved to AMENDED"
        side_effects:
          - "NotificationLetter.status = SUPERSEDED"
          - "cascade level 3: Exam.notification_status COMPLETE -> PENDING and Facility.open_notice_obligations incremented by 1"

  # --- SupplementalScreeningOrder -------------------------------------------
  - entity: SupplementalScreeningOrder
    state_field: status
    initial_state: RECOMMENDED
    terminal_states: [COMPLETED, REFERRED_OUT]
    note: "Cyclic through LOST_TO_FOLLOW_UP -> SCHEDULED when the patient is re-engaged."
    transitions:
      - from: RECOMMENDED
        to: COVERAGE_DETERMINED
        trigger: "POST /supplemental-orders/{id}/coverage-determination"
        actor: AccreditationCoordinator
        preconditions:
          - "SupplementalScreeningOrder.status == RECOMMENDED"
          - "the exam has a non-null density_category"
        side_effects:
          - "calculations.supplemental_coverage_determination writes coverage_outcome, coverage_tier, allowed_amount_cents, covered_amount_cents, patient_responsibility_cents, governing_state_code"
          - "SupplementalScreeningOrder.status = COVERAGE_DETERMINED"
          - "SupplementalScreeningOrder.version incremented by 1"
      - from: COVERAGE_DETERMINED
        to: SCHEDULED
        trigger: "POST /supplemental-orders/{id}/schedule"
        actor: AccreditationCoordinator
        preconditions:
          - "SupplementalScreeningOrder.status in {COVERAGE_DETERMINED, LOST_TO_FOLLOW_UP}"
          - "appointment_start >= logical clock"
          - "Facility.compliance_posture != SUSPENDED"
          - "the buffered occupancy interval collides with fewer than Facility.supplemental_concurrent_capacity SCHEDULED orders at the same facility"
        side_effects:
          - "SupplementalScreeningOrder.status = SCHEDULED, appointment_start stored, appointment_end = start + modality duration"
          - "Exam.follow_up_status = PENDING"
          - "SupplementalScreeningOrder.version incremented by 1"
      - from: LOST_TO_FOLLOW_UP
        to: SCHEDULED
        trigger: "POST /supplemental-orders/{id}/schedule"
        actor: AccreditationCoordinator
        preconditions:
          - "same preconditions as COVERAGE_DETERMINED_to_SCHEDULED"
        side_effects:
          - "SupplementalScreeningOrder.status = SCHEDULED"
          - "Exam.follow_up_status LOST_TO_FOLLOW_UP -> PENDING"
          - "SupplementalScreeningOrder.version incremented by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /supplemental-orders/{id}/complete"
        actor: AccreditationCoordinator
        preconditions:
          - "SupplementalScreeningOrder.status == SCHEDULED"
        side_effects:
          - "SupplementalScreeningOrder.status = COMPLETED, completed_at = logical clock"
          - "Exam.follow_up_status = COMPLETED when no other non-terminal order remains on the exam"
          - "SupplementalScreeningOrder.version incremented by 1"
      - from: RECOMMENDED
        to: REFERRED_OUT
        trigger: "cascade level 4 of a facility posture drop to SUSPENDED"
        actor: system
        preconditions:
          - "Facility.compliance_posture became SUSPENDED in this request"
        side_effects:
          - "SupplementalScreeningOrder.status = REFERRED_OUT, external_referral_note stamped"
          - "cascade level 5: Exam.follow_up_status PENDING -> PENDING_EXTERNAL"
      - from: COVERAGE_DETERMINED
        to: REFERRED_OUT
        trigger: "cascade level 4 of a facility posture drop to SUSPENDED"
        actor: system
        preconditions:
          - "Facility.compliance_posture became SUSPENDED in this request"
        side_effects:
          - "SupplementalScreeningOrder.status = REFERRED_OUT, external_referral_note stamped"
          - "cascade level 5: Exam.follow_up_status PENDING -> PENDING_EXTERNAL"
      - from: RECOMMENDED
        to: LOST_TO_FOLLOW_UP
        trigger: "POST /facilities/{id}/compliance-runs (step 4)"
        actor: system
        preconditions:
          - "logical clock > SupplementalScreeningOrder.followup_due_at"
        side_effects:
          - "SupplementalScreeningOrder.status = LOST_TO_FOLLOW_UP"
          - "Exam.follow_up_status = LOST_TO_FOLLOW_UP"
      - from: COVERAGE_DETERMINED
        to: LOST_TO_FOLLOW_UP
        trigger: "POST /facilities/{id}/compliance-runs (step 4)"
        actor: system
        preconditions:
          - "logical clock > SupplementalScreeningOrder.followup_due_at"
        side_effects:
          - "SupplementalScreeningOrder.status = LOST_TO_FOLLOW_UP"
          - "Exam.follow_up_status = LOST_TO_FOLLOW_UP"

  # --- Personnel dimension 1: qualification ---------------------------------
  - entity: Personnel
    state_field: qualification_status
    initial_state: PROVISIONAL
    terminal_states: [INACTIVE]
    note: |
      Cyclic: LAPSED returns to QUALIFIED once make-up credits land inside the lookback
      windows. Independent of ce_status — a QUALIFIED person can sit in ce_status GRACE
      for the whole grace period without any qualification change.
    transitions:
      - from: PROVISIONAL
        to: QUALIFIED
        trigger: "POST /facilities/{id}/personnel (evaluated at creation) or POST /personnel/{id}/qualification-reviews"
        actor: AccreditationCoordinator
        preconditions:
          - "initial_training_hours >= the role's initial hour threshold AND initial_read_volume >= the role's initial volume threshold"
          - "at review time: no continuing shortfall, i.e. ce_hours_36mo >= role CE requirement and volume_credit_24mo >= role volume requirement"
        side_effects:
          - "Personnel.qualification_status = QUALIFIED"
          - "Personnel.version incremented by 1 (review path only)"
      - from: QUALIFIED
        to: LAPSED
        trigger: "POST /personnel/{id}/qualification-reviews with an expired grace period, or POST /facilities/{id}/compliance-runs (step 5)"
        actor: AccreditationCoordinator
        preconditions:
          - "Personnel.ce_status was GRACE and logical clock > Personnel.ce_deadline_at, or ce_status is already DEFICIENT"
        side_effects:
          - "Personnel.ce_status = DEFICIENT"
          - "Personnel.qualification_status = LAPSED"
          - "no retroactive effect on already-created Exam rows"
          - "Personnel.version incremented by 1"
      - from: LAPSED
        to: QUALIFIED
        trigger: "POST /personnel/{id}/qualification-reviews after make-up credits are posted"
        actor: AccreditationCoordinator
        preconditions:
          - "ce_hours_36mo >= role CE requirement AND volume_credit_24mo >= role volume requirement inside the lookback windows"
        side_effects:
          - "Personnel.ce_status = COMPLIANT, ce_deadline_at cleared"
          - "Personnel.qualification_status = QUALIFIED"
          - "Personnel.version incremented by 1"

  # --- Personnel dimension 2: continuing education --------------------------
  - entity: Personnel
    state_field: ce_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: GRACE
        trigger: "POST /personnel/{id}/qualification-reviews detecting a first shortfall"
        actor: AccreditationCoordinator
        preconditions:
          - "ce_hours_36mo < role CE requirement OR volume_credit_24mo < role volume requirement"
          - "Personnel.ce_status == COMPLIANT"
        side_effects:
          - "Personnel.ce_status = GRACE, ce_deadline_at = logical clock + governing policy ce_grace_days"
          - "Personnel.qualification_status unchanged (parallel dimension)"
          - "Personnel.version incremented by 1"
      - from: GRACE
        to: COMPLIANT
        trigger: "POST /personnel/{id}/qualification-reviews after make-up credits are posted"
        actor: AccreditationCoordinator
        preconditions:
          - "no shortfall remains inside either lookback window"
        side_effects:
          - "Personnel.ce_status = COMPLIANT, ce_deadline_at cleared"
          - "Personnel.version incremented by 1"
      - from: GRACE
        to: DEFICIENT
        trigger: "POST /personnel/{id}/qualification-reviews or POST /facilities/{id}/compliance-runs (step 5) after the grace deadline"
        actor: AccreditationCoordinator
        preconditions:
          - "logical clock > Personnel.ce_deadline_at"
          - "a shortfall still exists"
        side_effects:
          - "Personnel.ce_status = DEFICIENT"
          - "Personnel.qualification_status QUALIFIED -> LAPSED"
          - "Personnel.version incremented by 1"
      - from: DEFICIENT
        to: COMPLIANT
        trigger: "POST /personnel/{id}/qualification-reviews after make-up credits are posted"
        actor: AccreditationCoordinator
        preconditions:
          - "no shortfall remains inside either lookback window"
        side_effects:
          - "Personnel.ce_status = COMPLIANT, ce_deadline_at cleared"
          - "Personnel.qualification_status LAPSED -> QUALIFIED"
          - "Personnel.version incremented by 1"

  # --- RadiologistAuditCycle ------------------------------------------------
  - entity: RadiologistAuditCycle
    state_field: status
    initial_state: OPEN
    terminal_states: []
    note: "Cyclic: LOCKED -> AMENDED -> LOCKED when an in-window exam is amended after the cycle was closed."
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /audit-cycles/{id}/close"
        actor: QualityAssuranceOfficer
        preconditions:
          - "RadiologistAuditCycle.status == OPEN"
          - "X-User-ID != RadiologistAuditCycle.radiologist_id (segregation of duties)"
          - "logical clock >= RadiologistAuditCycle.period_end"
        side_effects:
          - "calculations.radiologist_audit_metrics runs under the requested variant and writes screening_exam_count, recall_count, biopsy_count, cancer_count, excluded_exam_count, recall_rate_pct, ppv_pct, abnormal_interpretation_flag, variant_at_close"
          - "RadiologistAuditCycle.status = LOCKED, locked_at = logical clock"
          - "RadiologistAuditCycle.version incremented by 1"
      - from: LOCKED
        to: AMENDED
        trigger: "POST /exams/{id}/amend on an exam inside the cycle window (fan-out of the amendment)"
        actor: system
        preconditions:
          - "Exam.interpreting_physician_id == RadiologistAuditCycle.radiologist_id"
          - "RadiologistAuditCycle.period_start <= Exam.performed_at < RadiologistAuditCycle.period_end"
        side_effects:
          - "RadiologistAuditCycle.status = AMENDED; the stored metrics are left frozen at their locked values until re-closed"
          - "RadiologistAuditCycle.version incremented by 1"
      - from: AMENDED
        to: LOCKED
        trigger: "POST /audit-cycles/{id}/close"
        actor: QualityAssuranceOfficer
        preconditions:
          - "RadiologistAuditCycle.status == AMENDED"
          - "X-User-ID != RadiologistAuditCycle.radiologist_id"
        side_effects:
          - "metrics recomputed from the amended exam set under the requested variant"
          - "RadiologistAuditCycle.status = LOCKED, locked_at = logical clock"
          - "RadiologistAuditCycle.version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: cirs-create-stale-unit
    parent_entity: MammographyUnit
    write_endpoint: "POST /units/{id}/clinical-image-reviews"
    occ_field: "expected_unit_version"
    description: |
      Creating a clinical image review submission against a unit whose version has
      advanced since the client last observed it is rejected. Creating a submission
      legitimately consumes one of the unit's three reaccreditation attempts and
      escrows the 250000-cent application fee, so a second create carrying the older
      observed version would silently spend a second attempt against a stale view of
      the accreditation cycle.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
  - rule_id: cirs-resubmit-stale-unit
    parent_entity: MammographyUnit
    write_endpoint: "POST /clinical-image-reviews/{id}/resubmit"
    occ_field: "expected_unit_version"
    description: |
      Resubmitting a revision-required packet against a stale unit version is rejected.
      A resubmit consumes another attempt and re-escrows the fee, and the attempt budget
      it spends may already have been consumed by an intervening submission or restored
      by a withdrawal, both of which advance the unit's version.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
  - rule_id: letter-generate-stale-exam
    parent_entity: Exam
    write_endpoint: "POST /exams/{id}/notification-letters"
    occ_field: "expected_exam_version"
    description: |
      Generating a notification letter against an exam whose version has advanced since
      the client last observed it is rejected. Generation legitimately supersedes the
      exam's prior letter, so the operation would otherwise succeed twice and mail a
      second patient letter whose density statement and notice codes were selected from
      a superseded interpretation.
    error_id: ERR_STALE_EXAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Every threshold, rate, duration and ordering below is normative. No business
# decision anywhere in this scaffold reads a random/UUID `id`; ties and orderings
# fall back to `created_at`, never to `id`.
# =============================================================================
calculations:

  - name: governing_policy_resolution
    trigger: "Resolved at the start of notification_requirement_selection, supplemental_coverage_determination, report_turnaround_and_followup_clock and ce_and_volume_compliance"
    algorithm: rule_selection
    formula: |
      # Shared sub-rule. Never returns null: Facility.state_policy_id is required.
      patient_policy = StatePolicy row whose state_code == Exam.patient_state_code   # unique per state_code
      if patient_policy exists:
          governing_policy = patient_policy
      else:
          governing_policy = StatePolicy row referenced by Facility.state_policy_id
      governing_state_code = governing_policy.state_code
      # For Personnel-scoped rules (ce_and_volume_compliance) there is no patient,
      # so the facility's home-state policy is always the governing policy.
    input_set: "All StatePolicy rows; the Exam's patient_state_code; the Facility reached through Exam.unit_id -> MammographyUnit.facility_id"
    constants: {}
    precision: "n/a"

  - name: survey_pass_determination
    trigger: "POST /physicist-surveys/{id}/submit and POST /physicist-surveys/{id}/remediate"
    algorithm: threshold
    formula: |
      passed = (phantom_score >= PHANTOM_MIN_SCORE)
               AND (mean_glandular_dose_mgy <= MAX_MEAN_GLANDULAR_DOSE_MGY)
               AND (len(critical_deficiency_codes) == 0)
      if passed:
          PhysicistSurvey.status = PASSED
          MammographyUnit.survey_compliance = CURRENT when effective_start <= clock < effective_end, else OVERDUE
          MammographyUnit.last_passed_survey_end = effective_end
      else if PhysicistSurvey.remediation_attempts >= MAX_REMEDIATION_ATTEMPTS:
          PhysicistSurvey.status = FAILED_FINAL
      else:
          PhysicistSurvey.status = FAILED_ACTION_REQUIRED
      # All three conjuncts are evaluated; the dose ceiling is an upper bound
      # (<=) while the phantom score is a lower bound (>=). Reversing either
      # comparison flips the pinned boundary fixtures below.
    input_set: "The single PhysicistSurvey being decided, using the phantom_score / mean_glandular_dose_mgy / critical_deficiency_codes supplied by the decision call (which overwrite any values captured at creation)"
    constants:
      PHANTOM_MIN_SCORE: 6.0
      MAX_MEAN_GLANDULAR_DOSE_MGY: 3.00
      MAX_REMEDIATION_ATTEMPTS: 2
      MAX_SURVEY_WINDOW_DAYS: 396
    precision: "phantom_score compared at one decimal, mean_glandular_dose_mgy at two decimals; no rounding is applied before comparison"

  - name: facility_compliance_posture
    trigger: "Recomputed at the end of every write that changes a MammographyUnit state field, a PhysicistSurvey decision, an AnnualInspection status, a Personnel qualification/ce field, or a ClinicalImageReviewSubmission review; and on every POST /facilities/{id}/compliance-runs"
    algorithm: constraint_propagation
    formula: |
      # FIRST MATCH WINS. The order of the two guarded blocks is normative:
      # a SUSPENDED trigger outranks every CONDITIONAL trigger, even when many
      # CONDITIONAL predicates also hold in the same snapshot.
      units = MammographyUnit rows with facility_id == Facility.id
      inspections = AnnualInspection rows with facility_id == Facility.id
      staff = Personnel rows with facility_id == Facility.id

      # --- level 1: SUSPENDED ---------------------------------------------
      if any(u.accreditation_status == SUSPENDED for u in units):                    -> SUSPENDED
      if any(u.operational_state == OUT_OF_SERVICE
             and u.accreditation_status in {PROBATION, SUSPENDED} for u in units):   -> SUSPENDED
      if any(i.inspector_findings_level == LEVEL_1
             and i.status == CORRECTIVE_ACTION_REQUIRED for i in inspections):       -> SUSPENDED
      if len(units) >= 1 and all(u.operational_state == OUT_OF_SERVICE for u in units): -> SUSPENDED

      # --- level 2: CONDITIONAL -------------------------------------------
      if any(u.accreditation_status in {PROBATION, REACCREDITATION_DUE} for u in units): -> CONDITIONAL
      if any(u.survey_compliance in {OVERDUE, FAILED} for u in units):               -> CONDITIONAL
      if any(u.operational_state == OUT_OF_SERVICE for u in units):                  -> CONDITIONAL
      if any(i.inspector_findings_level == LEVEL_2
             and i.status == CORRECTIVE_ACTION_REQUIRED for i in inspections):       -> CONDITIONAL
      if any(p.ce_status == DEFICIENT or p.qualification_status == LAPSED for p in staff): -> CONDITIONAL

      # --- level 3 --------------------------------------------------------
      -> COMPLIANT

      # When the recomputed value is SUSPENDED and the previous value was not,
      # the caller fires the referral cascade (see §1.2 cascade levels 4 and 5).
    input_set: "Every MammographyUnit, AnnualInspection and Personnel row of the facility, in whatever state they are in at the end of the triggering write; no state filtering beyond the predicates above"
    constants: {}
    precision: "n/a — enum output"

  - name: fee_escrow_ledger
    trigger: "POST /facilities/{id}/funding-deposits, POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit, POST /clinical-image-reviews/{id}/withdraw, POST /clinical-image-reviews/{id}/review"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (invariant, must hold after every one of the writes above):
      #   Facility.total_funded_cents
      #     == Facility.prepaid_credit_cents
      #      + Facility.fee_held_cents
      #      + Facility.fee_consumed_cents
      # total_funded_cents and fee_consumed_cents are monotonically non-decreasing.

      deposit(amount):                    # funding-deposits
          total_funded_cents   += amount
          prepaid_credit_cents += amount

      escrow():                           # create submission / resubmit
          require prepaid_credit_cents >= APPLICATION_FEE_CENTS   else ERR_INSUFFICIENT_PREPAID_CREDIT
          prepaid_credit_cents -= APPLICATION_FEE_CENTS
          fee_held_cents       += APPLICATION_FEE_CENTS
          submission.fee_held_cents = APPLICATION_FEE_CENTS

      release():                          # withdraw — full compensation, no drift
          prepaid_credit_cents += APPLICATION_FEE_CENTS
          fee_held_cents       -= APPLICATION_FEE_CENTS
          submission.fee_held_cents = 0
          # fee_consumed_cents and total_funded_cents are untouched

      consume():                          # any review decision (PASS or REVISION_REQUIRED)
          fee_held_cents      -= APPLICATION_FEE_CENTS
          fee_consumed_cents  += APPLICATION_FEE_CENTS
          submission.fee_held_cents = 0
          # prepaid_credit_cents is untouched — the fee is non-refundable once reviewed

      # Facility.fee_held_cents must always equal
      #   APPLICATION_FEE_CENTS * count(ClinicalImageReviewSubmission rows of this
      #                                 facility's units in status SUBMITTED)
    input_set: "Every accepted funding deposit of the facility, plus every ClinicalImageReviewSubmission belonging to a MammographyUnit of the facility; submissions in status SUBMITTED are the only ones holding escrow"
    constants:
      APPLICATION_FEE_CENTS: 250000
    precision: "integer cents; no rounding — every movement is an exact multiple of APPLICATION_FEE_CENTS"

  - name: unit_repeat_rate
    trigger: "Recomputed on POST /exams, POST /exams/{id}/repeat-records and POST /repeat-records/{id}/retract; read back through GET /units/{id}"
    algorithm: aggregation
    formula: |
      exams = Exam rows with unit_id == MammographyUnit.id     # every report_status
      for each exam:
          exam.repeat_image_count = sum(r.repeat_image_count
                                        for r in RepeatImagingRecord rows of the exam
                                        if r.retracted == false)
      MammographyUnit.repeat_images_acquired = sum(e.repeat_image_count for e in exams)
      MammographyUnit.total_images_acquired  = sum(e.original_image_count + e.repeat_image_count
                                                   for e in exams)
      # CONSERVED QUANTITY (invariant):
      #   total_images_acquired == sum(original_image_count) + repeat_images_acquired
      # Retracting a repeat record restores total_images_acquired to exactly the
      # value it had before the record was documented — no drift.

      variant IMAGE_BASED:
          if total_images_acquired == 0: image_based_repeat_rate_pct = null
          else: image_based_repeat_rate_pct =
                  round_half_up(100 * repeat_images_acquired / total_images_acquired, 2)

      variant PATIENT_BASED:
          if len(exams) == 0: patient_based_repeat_rate_pct = null
          else: patient_based_repeat_rate_pct =
                  round_half_up(100 * count(e for e in exams if e.repeat_image_count > 0)
                                    / len(exams), 2)

      repeat_rate_flag = (image_based_repeat_rate_pct is not null
                          and image_based_repeat_rate_pct > REPEAT_RATE_FLAG_PCT)   # strictly greater
    input_set: "All Exam rows of the unit regardless of report_status; RepeatImagingRecord rows with retracted == false only"
    constants:
      REPEAT_RATE_FLAG_PCT: 5.00
    precision: "2 decimal places, round_half_up; the ratio is formed from the aggregated integer counts and rounded once at the end — never by averaging per-exam rates"
    variants:
      - name: IMAGE_BASED
        when: "Always computed; this is the MQSA repeat-rate definition and the only variant that drives repeat_rate_flag"
        difference: "Denominator is total_images_acquired (every image, original plus repeat); numerator is repeat_images_acquired"
      - name: PATIENT_BASED
        when: "Always computed and exposed alongside IMAGE_BASED for the quality committee"
        difference: "Denominator is the number of Exam rows; numerator is the number of Exam rows with at least one non-retracted repeat, so a single exam repeated ten times contributes the same as one repeated once"

  - name: radiologist_audit_metrics
    trigger: "POST /audit-cycles/{id}/close, and read-only through GET /audit-cycles/{id}/metrics"
    algorithm: aggregation
    formula: |
      cycle = the RadiologistAuditCycle being closed
      # --- in-scope set (identical for both variants) ---------------------
      S = Exam rows where
            interpreting_physician_id == cycle.radiologist_id
            AND exam_type == SCREENING
            AND report_status in {INTERPRETED_FINAL, AMENDED}
            AND cycle.period_start <= performed_at < cycle.period_end   # half-open
      screening_exam_count = len(S)

      recall_count = count(e in S if e.recall_flag == true)             # BI-RADS 0 only
      if screening_exam_count == 0:
          recall_rate_pct = null
      else:
          # POOLED, then rounded once. Never the mean of per-unit or per-modality
          # rates: with one DM_2D recall out of 1 DM_2D exam and zero recalls out
          # of 2 DBT_3D exams the pooled answer is 33.33, the averaged answer 50.00.
          recall_rate_pct = round_half_up(100 * recall_count / screening_exam_count, 2)

      # --- variant-specific denominator ----------------------------------
      if cycle.variant_at_close == PPV1_SCREENING:
          C = [e in S if e.recall_flag == true and e.biopsy_performed == true]
          scored = [e in C if e.pathology_result in {BENIGN, MALIGNANT}
                           and e.outcome_recorded_at
                               < e.performed_at + cycle.followup_window_days days]
      else:   # PPV3_BIOPSY_ALL
          C = [e in S if e.biopsy_performed == true]
          scored = [e in C if e.pathology_result in {BENIGN, MALIGNANT}]
          # the follow-up window is deliberately NOT applied by this variant

      biopsy_count         = len(scored)
      cancer_count         = count(e in scored if e.pathology_result == MALIGNANT)
      excluded_exam_count  = len(C) - len(scored)
      ppv_pct              = null if biopsy_count == 0
                             else round_half_up(100 * cancer_count / biopsy_count, 2)

      abnormal_interpretation_flag =
          recall_rate_pct is not null
          and not (RECALL_BENCHMARK_MIN_PCT <= recall_rate_pct <= RECALL_BENCHMARK_MAX_PCT)
          # closed band on both edges: exactly 5.00 and exactly 12.00 are in-band
    input_set: "Exam rows attributed to the cycle's radiologist, of exam_type SCREENING, in report_status INTERPRETED_FINAL or AMENDED, with performed_at inside the half-open cycle period. DIAGNOSTIC exams, exams still AWAITING_INTERPRETATION or DELAYED, exams of other radiologists, and exams performed exactly at period_end are all outside the set."
    constants:
      RECALL_BENCHMARK_MIN_PCT: 5.00
      RECALL_BENCHMARK_MAX_PCT: 12.00
    precision: "2 decimal places, round_half_up, applied once to the pooled ratio"
    variants:
      - name: PPV1_SCREENING
        when: "Requested by the closing call via variant=PPV1_SCREENING; the MQSA/BCSC screening PPV1 measure"
        difference: "Denominator counts only exams that were BOTH recalled (recall_flag true) AND biopsied, and only those whose pathology outcome landed strictly inside followup_window_days of performed_at; a biopsy attributable to a BI-RADS 4 screening read is therefore excluded"
      - name: PPV3_BIOPSY_ALL
        when: "Requested by the closing call via variant=PPV3_BIOPSY_ALL; the ACR PPV3 biopsy-yield measure"
        difference: "Denominator counts every biopsied in-scope exam with a resolved pathology result regardless of recall_flag, and ignores followup_window_days entirely, so it can be strictly larger than the PPV1 denominator over identical data"

  - name: notification_requirement_selection
    trigger: "POST /exams/{id}/notification-letters"
    algorithm: rule_selection
    formula: |
      policy = governing_policy_resolution(exam)
      dense  = exam.density_category in {C, D}          # C is the first dense category
      urgent = exam.birads_assessment in URGENT_BIRADS   # {0, 4, 5}

      density_statement_code = FDA_DENSE if dense else FDA_NOT_DENSE

      state_notice_applies =
            policy.density_notice_rule == STATE_ENHANCED_ALL
            or (policy.density_notice_rule == STATE_DENSE_ONLY and dense)
      # FEDERAL_ONLY never applies a state notice.

      letter_type = COMBINED if state_notice_applies else LAY_SUMMARY

      # Both ceilings are taken as a minimum: the state may only tighten the
      # federal floor, never loosen it.
      reading_grade_level = min(policy.lay_summary_max_reading_grade,
                               FEDERAL_MAX_READING_GRADE)
      deadline_days = min(policy.lay_summary_deadline_days,
                          FEDERAL_LAY_SUMMARY_DEADLINE_DAYS)
      if urgent:
          deadline_days = min(deadline_days, URGENT_NOTICE_DEADLINE_DAYS)

      # Ordered concatenation, then first-occurrence de-duplication.
      codes = [FEDERAL_LAY_SUMMARY_CODE]                       # "FDA-LAY-SUMMARY"
      codes += ["FDA-DENSE"] if dense else ["FDA-NOT-DENSE"]
      if urgent: codes += [URGENT_FINDING_CODE]                # "FDA-URGENT-FINDING"
      if state_notice_applies: codes += policy.required_notice_codes  # declared order
      required_notice_codes = dedupe_keep_first(codes)

      deadline_at            = clock + deadline_days days
      generated_at           = clock
      governing_state_code   = policy.state_code
      Exam.notification_deadline_at = deadline_at
      # The prior letter of the exam, if any and if not already SUPERSEDED,
      # becomes SUPERSEDED and the new letter's supersedes_letter_id points at it.
    input_set: "The one Exam being notified plus its governing StatePolicy; the exam must be in report_status INTERPRETED_FINAL or AMENDED and notification_status PENDING"
    constants:
      FEDERAL_MAX_READING_GRADE: 8
      FEDERAL_LAY_SUMMARY_DEADLINE_DAYS: 30
      URGENT_NOTICE_DEADLINE_DAYS: 7
      URGENT_BIRADS: [0, 4, 5]
      FEDERAL_LAY_SUMMARY_CODE: "FDA-LAY-SUMMARY"
      URGENT_FINDING_CODE: "FDA-URGENT-FINDING"
    precision: "integer grade level and integer day counts; deadline_at is an exact day offset from the logical clock"
    variants:
      - name: FEDERAL_FLOOR
        when: "policy.density_notice_rule == FEDERAL_ONLY, or STATE_DENSE_ONLY with a non-dense density_category"
        difference: "letter_type LAY_SUMMARY and no state notice codes are appended, even though the state policy declares required_notice_codes"
      - name: STATE_LAYERED
        when: "policy.density_notice_rule == STATE_ENHANCED_ALL, or STATE_DENSE_ONLY with density_category in {C, D}"
        difference: "letter_type COMBINED and the state's required_notice_codes are appended after the federal codes in declared order"

  - name: supplemental_coverage_determination
    trigger: "POST /supplemental-orders/{id}/coverage-determination"
    algorithm: tiered_pricing
    formula: |
      # TEN NUMBERED STEPS, EXECUTED IN THIS ORDER. The order is observable:
      # the tier is selected and recorded (steps 5-7) BEFORE the mandate's
      # cost-sharing treatment is applied (steps 8-9), so an order whose patient
      # share is fully waived still carries a non-null coverage_tier.
      # 1
      policy = governing_policy_resolution(order.exam)
      governing_state_code = policy.state_code
      # 2
      dense = order.exam.density_category in {C, D}
      # 3
      if policy.supplemental_coverage_mandate == NONE:
          allowed = FEE_SCHEDULE_CENTS[order.modality]        # no admin fee
          return { coverage_outcome: PATIENT_RESPONSIBILITY,
                   allowed_amount_cents: allowed,
                   covered_amount_cents: 0,
                   patient_responsibility_cents: allowed,
                   coverage_tier: null }
      # 4
      if not dense:
          allowed = FEE_SCHEDULE_CENTS[order.modality]        # no admin fee
          return { coverage_outcome: DENIED,
                   allowed_amount_cents: allowed,
                   covered_amount_cents: 0,
                   patient_responsibility_cents: allowed,
                   coverage_tier: null }
      # 5 — the admin fee is inside the tier decision, not bolted on afterwards
      allowed = FEE_SCHEDULE_CENTS[order.modality] + ADMIN_FEE_CENTS
      # 6 — both tier ceilings are inclusive (<=)
      if   allowed <= TIER_1_MAX_CENTS: tier = TIER_1
      elif allowed <= TIER_2_MAX_CENTS: tier = TIER_2
      else:                             tier = TIER_3
      # 7
      rate    = TIER_RATE[tier]
      covered = round_half_up(allowed * rate)                 # to whole cents
      resp    = allowed - covered
      # 8
      if policy.supplemental_coverage_mandate == COVERAGE_NO_COST_SHARING:
          return { coverage_outcome: COVERED_NO_COST_SHARE,
                   allowed_amount_cents: allowed,
                   covered_amount_cents: allowed,
                   patient_responsibility_cents: 0,
                   coverage_tier: tier }
      # 9 — COVERAGE_WITH_COST_SHARING; de-minimis share absorbed by the facility
      if resp <= policy.supplemental_cost_share_waiver_threshold_cents:
          return { coverage_outcome: COVERED_NO_COST_SHARE,
                   allowed_amount_cents: allowed,
                   covered_amount_cents: allowed,
                   patient_responsibility_cents: 0,
                   coverage_tier: tier }
      # 10
      return { coverage_outcome: COVERED_WITH_COST_SHARE,
               allowed_amount_cents: allowed,
               covered_amount_cents: covered,
               patient_responsibility_cents: resp,
               coverage_tier: tier }
    input_set: "The single SupplementalScreeningOrder in status RECOMMENDED, its Exam's density_category and patient_state_code, and the governing StatePolicy"
    constants:
      FEE_SCHEDULE_CENTS:
        ULTRASOUND: 28500
        MRI: 120000
        CEM: 60000
      ADMIN_FEE_CENTS: 3000
      TIER_1_MAX_CENTS: 31500
      TIER_2_MAX_CENTS: 63000
      TIER_RATE:
        TIER_1: 0.615
        TIER_2: 0.775
        TIER_3: 0.90
    precision: "integer cents; covered_amount_cents = round_half_up(allowed * rate) to zero decimals, then patient_responsibility_cents = allowed - covered so the two always sum to allowed_amount_cents exactly"
    variants:
      - name: NO_COST_SHARE_MANDATE
        when: "governing policy supplemental_coverage_mandate == COVERAGE_NO_COST_SHARING"
        difference: "The tier rate is still selected and recorded, but the payer absorbs the whole allowed amount: covered_amount_cents == allowed_amount_cents and patient_responsibility_cents == 0"
      - name: COST_SHARE_MANDATE
        when: "governing policy supplemental_coverage_mandate == COVERAGE_WITH_COST_SHARING"
        difference: "The tier rate is actually billed, and the residual patient share survives only when it strictly exceeds supplemental_cost_share_waiver_threshold_cents"

  - name: ce_and_volume_compliance
    trigger: "POST /facilities/{id}/personnel (initial thresholds only), POST /personnel/{id}/qualification-reviews, POST /facilities/{id}/compliance-runs (step 5)"
    algorithm: threshold
    formula: |
      t = THRESHOLDS[Personnel.role_type]

      # --- initial qualification (creation only) --------------------------
      initial_ok = (initial_training_hours >= t.initial_hours)
                   AND (initial_read_volume >= t.initial_volume)
      qualification_status at creation = QUALIFIED if initial_ok else PROVISIONAL

      # --- continuing requirement (review / compliance run) --------------
      # Both lookback windows are CLOSED on the left edge and closed on the right:
      #   awarded_on >= clock - <N> days   AND   awarded_on <= clock
      ce_hours_36mo = sum(c.ce_hours for c in QualificationCredit rows of this person
                          if c.credit_type == CATEGORY_1_CE
                          and clock - CE_LOOKBACK_DAYS days <= c.awarded_on <= clock)
      volume_credit_24mo = sum(c.exam_count for c in QualificationCredit rows of this person
                          if c.credit_type == READ_VOLUME
                          and clock - VOLUME_LOOKBACK_DAYS days <= c.awarded_on <= clock)

      shortfall = (ce_hours_36mo < t.ce_hours) OR (volume_credit_24mo < t.volume)

      if not shortfall:
          ce_status = COMPLIANT; ce_deadline_at = null
          if qualification_status == LAPSED: qualification_status = QUALIFIED
          if qualification_status == PROVISIONAL and initial_ok: qualification_status = QUALIFIED
      else if ce_status == COMPLIANT:
          ce_status = GRACE; ce_deadline_at = clock + policy.ce_grace_days days
          # qualification_status deliberately unchanged — parallel dimension
      else if ce_status == GRACE and clock > ce_deadline_at:
          ce_status = DEFICIENT
          if qualification_status == QUALIFIED: qualification_status = LAPSED
      else if ce_status == GRACE:
          pass    # still inside grace, nothing changes
      else:       # already DEFICIENT
          if qualification_status == QUALIFIED: qualification_status = LAPSED

      last_qualification_review_at = clock
      # `policy` here is the facility's home-state StatePolicy (no patient involved).
    input_set: "QualificationCredit rows of the one Personnel row, filtered by credit_type and by awarded_on inside the role-independent lookback windows; retracted or future-dated credits cannot exist because awarded_on <= clock is enforced at creation"
    constants:
      CE_LOOKBACK_DAYS: 1095
      VOLUME_LOOKBACK_DAYS: 730
      THRESHOLDS:
        INTERPRETING_PHYSICIAN: { initial_hours: 60, initial_volume: 240, ce_hours: 15, volume: 960 }
        TECHNOLOGIST:           { initial_hours: 40, initial_volume: 25,  ce_hours: 15, volume: 200 }
        MEDICAL_PHYSICIST:      { initial_hours: 20, initial_volume: 1,   ce_hours: 15, volume: 2 }
    precision: "ce_hours summed at two decimals; exam_count summed as integers; all comparisons use >= against the threshold so a value exactly equal to the threshold satisfies it"

  - name: report_turnaround_and_followup_clock
    trigger: "POST /exams (initial due date), POST /exams/{id}/interpret (urgency re-derivation), POST /exams/{id}/supplemental-orders, POST /facilities/{id}/compliance-runs"
    algorithm: chronological
    formula: |
      policy = governing_policy_resolution(exam)

      # --- at acquisition (POST /exams) ----------------------------------
      # birads_assessment is unknown here, so the ROUTINE turnaround applies.
      report_due_at = performed_at + policy.report_turnaround_days days

      # --- at interpretation (POST /exams/{id}/interpret) -----------------
      # The urgency of the finding retroactively tightens the deadline that the
      # exam has been carrying since acquisition.
      if birads_assessment in URGENT_BIRADS:            # {0, 4, 5}
          report_due_at = performed_at + policy.urgent_report_turnaround_days days
      interpreted_at   = clock
      interpreted_late = (interpreted_at > report_due_at)      # strictly greater

      # --- delayed-report sweep (compliance run step 2) -------------------
      # Exams still AWAITING_INTERPRETATION past their (routine) due date move to
      # DELAYED. Processed in ascending performed_at, then ascending created_at as
      # the tie-break — never by id.
      for e in exams with report_status == AWAITING_INTERPRETATION
               and clock > e.report_due_at, ordered by (performed_at, created_at):
          e.report_status = DELAYED

      # --- follow-up clock (POST /exams/{id}/supplemental-orders) ---------
      recommended_at = clock
      followup_due_at = recommended_at + policy.followup_grace_days days

      # --- lost-to-follow-up sweep (compliance run step 4) ----------------
      for o in SupplementalScreeningOrder rows of the facility with
               status in {RECOMMENDED, COVERAGE_DETERMINED} and clock > o.followup_due_at,
               ordered by (recommended_at, created_at):
          o.status = LOST_TO_FOLLOW_UP
          o.exam.follow_up_status = LOST_TO_FOLLOW_UP

      # --- delivery-assumption sweep (compliance run step 3) --------------
      for l in NotificationLetter rows of the facility with status == SENT and
               clock >= l.sent_at + DELIVERY_ASSUMPTION_DAYS days:      # >= , inclusive
          l.status = DELIVERED_ASSUMED
          l.exam.notification_status = COMPLETE
    input_set: "For the sweeps: every Exam / SupplementalScreeningOrder / NotificationLetter reachable from the facility through MammographyUnit -> Exam, restricted to the non-terminal statuses named above"
    constants:
      DELIVERY_ASSUMPTION_DAYS: 14
      URGENT_BIRADS: [0, 4, 5]
    precision: "whole-day offsets applied to the stored instant; comparisons are strict (>) for overdue detection and inclusive (>=) for the delivery assumption"

  - name: supplemental_appointment_occupancy
    trigger: "POST /supplemental-orders/{id}/schedule"
    algorithm: interval_merge
    formula: |
      duration      = MODALITY_DURATION_MINUTES[order.modality]
      appointment_end = appointment_start + duration minutes
      # The occupancy interval is CLOSED on both ends and includes room turnover,
      # so two intervals that merely touch at an endpoint DO collide.
      occupancy(o) = [o.appointment_start, o.appointment_end + TURNOVER_MINUTES minutes]

      peers = SupplementalScreeningOrder rows in status SCHEDULED whose
              exam -> unit -> facility_id equals this order's facility_id,
              excluding this order itself
      collisions = count(p in peers if occupancy(p) intersects occupancy(order))
                   # closed-interval intersection: a shared endpoint counts
      if collisions >= Facility.supplemental_concurrent_capacity:
          -> ERR_SUPPLEMENTAL_CAPACITY_CONFLICT
    input_set: "SupplementalScreeningOrder rows in status SCHEDULED at the same Facility; orders in RECOMMENDED, COVERAGE_DETERMINED, COMPLETED, REFERRED_OUT or LOST_TO_FOLLOW_UP occupy nothing"
    constants:
      MODALITY_DURATION_MINUTES:
        ULTRASOUND: 30
        MRI: 45
        CEM: 30
      TURNOVER_MINUTES: 15
    precision: "minute resolution; interval endpoints are compared inclusively on both sides"

  - name: survey_window_exclusivity
    trigger: "POST /units/{id}/physicist-surveys"
    algorithm: interval_merge
    formula: |
      # The validity window is HALF-OPEN [effective_start, effective_end), so an
      # incoming window whose effective_start equals an existing window's
      # effective_end is ADJACENT and allowed — the opposite endpoint convention
      # from supplemental_appointment_occupancy.
      require effective_end > effective_start
      require (effective_end - effective_start) <= MAX_SURVEY_WINDOW_DAYS days
      peers = PhysicistSurvey rows of the same unit_id with the same survey_type
              and status in {DRAFT, PASSED, FAILED_ACTION_REQUIRED}
              # FAILED_FINAL surveys release their window
      if any(p.effective_start < effective_end and effective_start < p.effective_end
             for p in peers):
          -> ERR_SURVEY_WINDOW_OVERLAP
    input_set: "PhysicistSurvey rows of the same MammographyUnit and the same survey_type in status DRAFT, PASSED or FAILED_ACTION_REQUIRED; FAILED_FINAL rows are ignored"
    constants:
      MAX_SURVEY_WINDOW_DAYS: 396
    precision: "instant comparison at second resolution; the window is closed on the left and open on the right"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — LOWER number wins)
#
# The ladder is: authentication -> authorization -> ownership -> segregation of
# duties -> path existence -> request schema -> body-reference existence ->
# optimistic concurrency -> state precondition -> then the business rules in
# regulatory-priority order: safety/compliance, referential, temporal,
# constraint, fiscal. Patient-safety and MQSA-compliance checks deliberately
# outrank money: a facility is told its unit is out of service before it is told
# its prepaid accreditation credit is short.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For an entity_backed role, X-User-ID resolves to a Personnel row whose facility_id matches the facility that owns the target resource, and whose role_type matches the acting role (INTERPRETING_PHYSICIAN / TECHNOLOGIST / MEDICAL_PHYSICIST)"
    error_id: ERR_ACTOR_NOT_AT_FACILITY
    http_status: 403
    applies_to: "POST /units/{id}/physicist-surveys, POST /physicist-surveys/{id}/submit, POST /exams, POST /exams/{id}/interpret, POST /exams/{id}/amend"

  - priority: 4
    category: auth
    check: "Segregation of duties: the QualityAssuranceOfficer recording a pathology outcome must not be the exam's interpreting_physician_id, and the QualityAssuranceOfficer closing an audit cycle must not be the cycle's radiologist_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /exams/{id}/outcome, POST /audit-cycles/{id}/close"

  - priority: 5
    category: auth
    check: "Segregation of duties on surveys: the MedicalPhysicist submitting a survey decision must be the survey's physicist_id, and a remediation decision must be recorded by an AccreditationCoordinator, never by the physicist who authored the survey"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /physicist-surveys/{id}/submit, POST /physicist-surveys/{id}/remediate"

  - priority: 6
    category: auth
    check: "Ownership: when the exam already carries an interpreting_physician_id, the InterpretingPhysician amending it must be that person. An exam that has never been interpreted carries no owner, so this check passes and the request falls through to the priority 40 state check (which rejects it as not amendable)."
    error_id: ERR_NOT_INTERPRETING_PHYSICIAN
    http_status: 403
    applies_to: "POST /exams/{id}/amend"

  - priority: 10
    category: existence
    check: "Every id in the request path exists, validated left to right"
    error_id: "ERR_STATE_POLICY_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_EXAM_NOT_FOUND | ERR_LETTER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_FAILURE_EVENT_NOT_FOUND | ERR_REPEAT_RECORD_NOT_FOUND | ERR_AUDIT_CYCLE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 20
    category: business_constraint
    check: "Request body satisfies the declared schema: required fields present, enum values in range, numeric ranges honored (birads_assessment 0..6, phantom_score 0.0..12.0, mean_glandular_dose_mgy 0.00..10.00, lay_summary_max_reading_grade 4..12, original_image_count >= 1, repeat_image_count >= 1, supplemental_concurrent_capacity 1..10, followup_window_days 30..730), state codes are exactly two uppercase letters, and conditional field pairing holds (ce_hours only with CATEGORY_1_CE, exam_count only with READ_VOLUME, equipment_failure_id only with reason_code EQUIPMENT_FAILURE)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 21
    category: business_constraint
    check: "Uniqueness: StatePolicy.state_code is globally unique; MammographyUnit.model_serial is unique within its facility_id"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /state-policies, POST /facilities/{id}/units"

  - priority: 22
    category: business_constraint
    check: "A clinical image packet contains at least MIN_PACKET_EXAMS (2) distinct exam ids with no duplicates"
    error_id: ERR_PACKET_TOO_SMALL
    http_status: 422
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

  - priority: 25
    category: existence
    check: "Every id referenced from the request body exists: state_policy_id, technologist_id, unit_id, every element of exam_ids, equipment_failure_id"
    error_id: "ERR_STATE_POLICY_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_EXAM_NOT_FOUND | ERR_FAILURE_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /facilities, POST /exams, POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit, POST /exams/{id}/repeat-records"

  - priority: 30
    category: business_constraint
    check: "Optimistic concurrency: the supplied expected_unit_version / expected_exam_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_UNIT_VERSION | ERR_STALE_EXAM_VERSION"
    http_status: 412
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit, POST /clinical-image-reviews/{id}/withdraw, POST /exams/{id}/notification-letters"

  - priority: 40
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_SURVEY_NOT_DECIDABLE | ERR_SUBMISSION_NOT_REVIEWABLE | ERR_SUBMISSION_NOT_REVISABLE | ERR_INSPECTION_ALREADY_CLOSED | ERR_LETTER_NOT_SENDABLE | ERR_LETTER_NOT_SENT | ERR_ORDER_NOT_DETERMINABLE | ERR_ORDER_NOT_SCHEDULABLE | ERR_ORDER_NOT_COMPLETABLE | ERR_EXAM_NOT_INTERPRETABLE | ERR_EXAM_NOT_AMENDABLE | ERR_OUTCOME_ALREADY_RECORDED | ERR_AUDIT_CYCLE_NOT_CLOSABLE | ERR_FAILURE_ALREADY_RESOLVED | ERR_REPEAT_RECORD_ALREADY_RETRACTED"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 41
    category: state
    check: "The unit that acquired the images is IN_SERVICE at acquisition time"
    error_id: ERR_UNIT_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /exams"

  - priority: 42
    category: state
    check: "A supplemental order cannot be scheduled while the owning facility's compliance_posture is SUSPENDED"
    error_id: ERR_FACILITY_SUSPENDED
    http_status: 409
    applies_to: "POST /supplemental-orders/{id}/schedule"

  - priority: 43
    category: business_constraint
    check: "The unit has at least one reaccreditation attempt left (reaccreditation_attempts_remaining >= 1) before a submission or resubmission consumes one. This guard is deliberately ordered ahead of priority 53 because exhausting the attempt budget is what SUSPENDS the unit: if the suspension check ran first the exhaustion error would be permanently masked."
    error_id: ERR_REACCREDITATION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

  - priority: 50
    category: business_safety
    check: "The technologist named on an exam has qualification_status QUALIFIED (not PROVISIONAL, LAPSED or INACTIVE)"
    error_id: ERR_TECHNOLOGIST_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /exams"

  - priority: 51
    category: business_safety
    check: "The interpreting physician has qualification_status QUALIFIED at interpretation and at amendment"
    error_id: ERR_PHYSICIAN_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /exams/{id}/interpret, POST /exams/{id}/amend"

  - priority: 52
    category: business_safety
    check: "The acting person is certified for the unit's modality (modality_certifications contains MammographyUnit.modality)"
    error_id: ERR_MODALITY_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /exams, POST /exams/{id}/interpret"

  - priority: 53
    category: business_safety
    check: "A unit whose accreditation_status is SUSPENDED cannot acquire exams, accept new clinical image review submissions, or be restored to service"
    error_id: ERR_UNIT_ACCREDITATION_SUSPENDED
    http_status: 409
    applies_to: "POST /exams, POST /units/{id}/clinical-image-reviews, POST /equipment-failures/{id}/restore"

  - priority: 54
    category: business_safety
    check: "A facility with an open LEVEL_1 inspection finding (status CORRECTIVE_ACTION_REQUIRED) cannot submit or resubmit a clinical image review packet"
    error_id: ERR_OPEN_LEVEL_1_FINDING
    http_status: 409
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

  - priority: 55
    category: business_safety
    check: "A unit may not be returned to service until a PASSED PhysicistSurvey of survey_type POST_REPAIR exists whose effective_start is at or after the failure's detected_at"
    error_id: ERR_POST_REPAIR_SURVEY_MISSING
    http_status: 409
    applies_to: "POST /equipment-failures/{id}/restore"

  - priority: 56
    category: business_referential
    check: "Every exam in a clinical image packet belongs to the same MammographyUnit as the submission"
    error_id: ERR_EXAM_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

  - priority: 57
    category: business_referential
    check: "Every exam in a clinical image packet is in report_status INTERPRETED_FINAL or AMENDED"
    error_id: ERR_PACKET_EXAM_NOT_FINAL
    http_status: 422
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

  - priority: 58
    category: business_referential
    check: "The referenced EquipmentFailureEvent belongs to the same MammographyUnit as the exam being repeated"
    error_id: ERR_FAILURE_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /exams/{id}/repeat-records"

  - priority: 59
    category: business_referential
    check: "The Personnel row addressed by an audit-cycle creation has role_type INTERPRETING_PHYSICIAN"
    error_id: ERR_NOT_AN_INTERPRETING_PHYSICIAN
    http_status: 422
    applies_to: "POST /personnel/{id}/audit-cycles"

  - priority: 60
    category: business_temporal
    check: "Backdated instants supplied by the client are not in the future relative to the logical clock: performed_at, detected_at, inspection_date, awarded_on, initial_qualification_on"
    error_id: ERR_FUTURE_TIMESTAMP
    http_status: 422
    applies_to: "POST /exams, POST /units/{id}/equipment-failures, POST /facilities/{id}/inspections, POST /personnel/{id}/credits, POST /facilities/{id}/personnel"

  - priority: 61
    category: business_temporal
    check: "A survey window is well formed: effective_end > effective_start and the window spans at most MAX_SURVEY_WINDOW_DAYS (396) days"
    error_id: ERR_SURVEY_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /units/{id}/physicist-surveys"

  - priority: 62
    category: business_temporal
    check: "The new survey window does not overlap an existing DRAFT / PASSED / FAILED_ACTION_REQUIRED window of the same survey_type on the same unit; touching endpoints are adjacent, not overlapping (half-open semantics)"
    error_id: ERR_SURVEY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /units/{id}/physicist-surveys"

  - priority: 63
    category: business_temporal
    check: "A clinical image review may only be submitted or resubmitted while the unit is inside its reaccreditation window: accreditation_expires_on is at or after the logical clock, or the unit has never been ACCREDITED"
    error_id: ERR_REACCREDITATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

  - priority: 64
    category: business_temporal
    check: "An audit cycle may only be closed once the logical clock has reached period_end"
    error_id: ERR_AUDIT_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /audit-cycles/{id}/close"

  - priority: 65
    category: business_temporal
    check: "A requested supplemental appointment_start is at or after the logical clock"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 422
    applies_to: "POST /supplemental-orders/{id}/schedule"

  - priority: 66
    category: business_temporal
    check: "The logical clock may only be moved forward or held: the requested current_utc is at or after the clock's present value"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 71
    category: business_constraint
    check: "Only one non-terminal ClinicalImageReviewSubmission (status SUBMITTED or REVISION_REQUIRED) may exist per MammographyUnit"
    error_id: ERR_SUBMISSION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /units/{id}/clinical-image-reviews"

  - priority: 72
    category: business_constraint
    check: "Only one OPEN RadiologistAuditCycle may exist per radiologist, and a new cycle's period must not overlap an existing cycle's [period_start, period_end)"
    error_id: ERR_AUDIT_CYCLE_OVERLAP
    http_status: 409
    applies_to: "POST /personnel/{id}/audit-cycles"

  - priority: 73
    category: business_constraint
    check: "An amendment must actually change something: at least one of birads_assessment or density_category differs from the stored value"
    error_id: ERR_AMENDMENT_NO_CHANGE
    http_status: 422
    applies_to: "POST /exams/{id}/amend"

  - priority: 74
    category: business_constraint
    check: "A screening exam must carry a density_category at interpretation, because the federal lay summary cannot be generated without one"
    error_id: ERR_DENSITY_CATEGORY_REQUIRED
    http_status: 422
    applies_to: "POST /exams/{id}/interpret"

  - priority: 75
    category: business_constraint
    check: "A supplemental order may only be created for an exam whose report_status is INTERPRETED_FINAL or AMENDED and whose density_category is non-null"
    error_id: ERR_EXAM_NOT_ELIGIBLE_FOR_SUPPLEMENTAL
    http_status: 422
    applies_to: "POST /exams/{id}/supplemental-orders"

  - priority: 76
    category: business_constraint
    check: "An order may only be scheduled after a coverage determination has been recorded (coverage_outcome != UNDETERMINED)"
    error_id: ERR_COVERAGE_NOT_DETERMINED
    http_status: 409
    applies_to: "POST /supplemental-orders/{id}/schedule"

  - priority: 77
    category: business_constraint
    check: "The buffered occupancy interval of the requested appointment collides with fewer than Facility.supplemental_concurrent_capacity SCHEDULED orders at the same facility (closed-interval semantics: touching counts as a collision)"
    error_id: ERR_SUPPLEMENTAL_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /supplemental-orders/{id}/schedule"

  - priority: 80
    category: business_fiscal
    check: "A funding deposit amount is a positive integer number of cents"
    error_id: ERR_INVALID_DEPOSIT_AMOUNT
    http_status: 422
    applies_to: "POST /facilities/{id}/funding-deposits"

  - priority: 81
    category: business_fiscal
    check: "The facility has at least APPLICATION_FEE_CENTS (250000) of prepaid_credit_cents available to escrow against a new submission or resubmission"
    error_id: ERR_INSUFFICIENT_PREPAID_CREDIT
    http_status: 402
    applies_to: "POST /units/{id}/clinical-image-reviews, POST /clinical-image-reviews/{id}/resubmit"

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "" — every path below is absolute. Read endpoints are open to all
# seven roles; write endpoints carry the segregation-of-duties role split.
# Query parameters on list endpoints are all optional (`?`).
# =============================================================================
endpoints:

  # --- test-driving surface (/_ namespace) ----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's mandatory startup default is 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, lookback window, expiry and sweep in this scaffold reads this clock. The clock may only move forward or be held (ERR_CLOCK_REWIND otherwise)."
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["logical clock advanced; no entity is mutated and no sweep fires — sweeps only run inside POST /facilities/{id}/compliance-runs"]

  - method: GET
    path: "/_clock/current"
    description: "Reads the logical clock. Returns 2026-08-01T00:00:00Z until set_current_utc is called."
    roles: [AccreditationCoordinator, AccreditationBodyReviewer, FdaInspector, QualityAssuranceOfficer, InterpretingPhysician, Technologist, MedicalPhysicist]
    code: 200
    input: []
