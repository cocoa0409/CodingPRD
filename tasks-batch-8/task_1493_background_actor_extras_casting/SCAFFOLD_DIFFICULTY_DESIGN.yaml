            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk: $.data.id } }
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}" }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/check-in", payload: {}, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_OUT", occurred_at: "2026-08-10T12:00:00Z" }, as: CastingAssociate }
            - { call: "POST /central-casting/time-events", payload: { booking_id: "${bk}", event_type: "MEAL_IN", occurred_at: "2026-08-10T12:30:00Z" }, as: CastingAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/bookings/${bk}/wrap-out", payload: {}, as: CastingAssociate }
            - { call: "GET /central-casting/vouchers", payload: { booking_id: "${bk}" }, as: CastingAssociate, captures: { vc: "$.data[0].id" } }
            - { call: "POST /central-casting/vouchers/${vc}/issue", payload: {}, as: CastingAssociate, as_user_id: "assoc-1" }
            - { call: "POST /central-casting/bump-adjustments", payload: { voucher_id: "${vc}", category: "PROPS_OWN", amount_cents: 1500 }, as: CastingAssociate, as_user_id: "assoc-1", captures: { bp: $.data.id } }
