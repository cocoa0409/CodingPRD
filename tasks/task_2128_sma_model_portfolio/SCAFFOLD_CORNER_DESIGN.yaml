              captures: { sp1: "$.data.id" }
            - call: "POST /sma/models"
              payload: { manager_name: "Cobalt Asset Mgmt", name: "Core Equity", strategy_code: "CORE", asset_class: "US_EQUITY", base_fee_bps: 90, drift_threshold_bps: 10 }
              as: PortfolioManager
              captures: { m1: "$.data.id" }
            - call: "POST /sma/model-versions"
