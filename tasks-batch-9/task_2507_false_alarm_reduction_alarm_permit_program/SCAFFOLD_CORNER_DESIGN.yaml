  # ===========================================================================
  # 9. CONSISTENCY MODEL — §1.0 declares `immediate`, so every derived value a
  #    write touches must be correct in THAT response, with no read-back needed
  #    and no denormalised field allowed to lag.
  # ===========================================================================
  - section: consistency_model

    instances:

      - name: immediate_every_cascade_hop_is_visible_in_the_writing_response
        claim_type: immediate — all changes visible in the same request's response
        grounds:
          - complexity_profile.consistency_model
          - state_machines.FalseAlarmIncident.UNDER_REVIEW_to_COUNTED
          - calculations.site_balance_rollup
        distinguishing_aspect: "The determination response itself must already carry the FULLY computed row — occurrence_index, assessed_fee_cents and the whole fee_basis — and the premises read taken immediately afterwards, with no batch and no clock movement in between, must already reflect the invoice the same request issued. Nothing in this program is allowed to settle later."
        test_recipe:
          setup:
            - "Two COUNTED alarms at ${site_id} and a third dispatched signal awaiting review at 2026-09-20T01:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_c3
            - *k_sys1
            - *k_app1
            - *k_sys2
            - *k_app2
            - *k_sys3
            - *k_app3
            - *k_clock_sep
            - *k_dr1
            - *k_dr1_val
            - *k_clock_sep_1h
            - *k_dr1_disp
            - *k_inc1
            - *k_inc1_counted
            - *k_dr2
            - *k_dr2_val
            - *k_dr2_disp
            - *k_inc2
            - *k_inc2_counted
            - *k_dr3
            - *k_dr3_val
            - *k_dr3_disp
            - *k_inc3
          trigger:
            - *k_inc3_counted
            - call: "GET /false-alarm-program/alarm-sites/${site_id}"
              payload: {}
              as: FalseAlarmReviewOfficer
              as_user_id: "faro-11"
              captures: { imm_site_out: $.data.outstanding_balance_cents, imm_site_count: $.data.chargeable_count_window, imm_site_life: $.data.lifetime_assessed_cents }
            - call: "GET /false-alarm-program/penalty-invoices?false_alarm_incident_id=${inc3_id}&page=1&per_page=25"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { imm_inv_id: "$.data[0].id", imm_inv_assessed: "$.data[0].assessed_cents" }
          assert:
            - "the determination RESPONSE already contains occurrence_index 3, assessed_fee_cents 15000 and fee_basis.tier_base_cents 10000 with occupancy_multiplier 1.50 — no second read is needed to learn the price"
            - "the immediately following site read shows chargeable_count_window 3 and outstanding_balance_cents 21250 (5500 + 5500 + 5500 permit fees for three systems and 15750 for the new invoice, less nothing paid)"
            - "the invoice for ${inc3_id} already exists with assessed_cents 15750 and due_on 2026-10-20T01:00:00Z — issued inside the determination request, not by the nightly run"
            - "no clock movement and no nightly run occurred between the write and the reads"

      - name: immediate_no_denormalised_counter_lags_behind_its_source_row
        claim_type: immediate — denormalised fields never lag
        grounds:
          - complexity_profile.consistency_model
          - calculations.site_balance_rollup
          - endpoints.DELETE_/false-alarm-program/site-contacts/{contactId}
        distinguishing_aspect: "Three different denormalised counters on three different parents are exercised by three unrelated writes in one run — the site's callable-contact count, its outstanding balance and the company's monitored-system count — and each is already correct in the very next read, which is what distinguishes `immediate` from an eventual rollup that a test could paper over with a retry."
        test_recipe:
          setup:
            - "Premises ${site_id} has three ACTIVE contacts and one PERMITTED system monitored by Guardian; its 5500-cent permit invoice is open."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_c3
            - *k_sys1
            - *k_app1
            - *k_inv1
            - *k_site_v
          trigger:
            - call: "DELETE /false-alarm-program/site-contacts/${contact3_id}"
              payload: {}
              as: PermitClerk
              as_user_id: "pc-07"
            - call: "GET /false-alarm-program/alarm-sites/${site_id}"
              payload: {}
