          assert:
            - "${e_unauth} == ERR_UNAUTHENTICATED with HTTP 401 — a blank X-User-ID is refused at priority 1 even though SafetyAdmin is the correct role for this path"
            - "${e_auditor_write} == ERR_UNAUTHORIZED with HTTP 403 — the Auditor role has no write authority anywhere in §1.7"
            - "${e_disp_driver} == ERR_UNAUTHORIZED — POST /drivers is SafetyAdmin-exclusive, and Dispatcher's ability to create crashes on that terminal does not extend to it"
            - "${e_member_opens} == ERR_UNAUTHORIZED — opening a review case is SafetyManager-exclusive even for the members who will vote in it"
            - "${e_mgr_purge} == ERR_UNAUTHORIZED — evidence custody is SafetyAdmin-exclusive, so the manager who will decide the case cannot destroy its evidence"
            - "${e_adj_settle} == ERR_UNAUTHORIZED with HTTP 403 and NOT ERR_DEMAND_NOT_FOUND, even though that demand id addresses nothing — priority 2 runs ahead of priority 10, so an unauthorized caller cannot probe which ids exist"
            - "${e_mgr_demand} == ERR_UNAUTHORIZED with HTTP 403 and NOT ERR_CLAIM_NOT_FOUND, for the same ordering reason on a claims-side path: recording demands is ClaimsAdjuster-exclusive"
            - "${e_wrong_driver} == ERR_UNAUTHORIZED with HTTP 403 — the priority-3 rule ties the statement path to the crash's own driver_id, so a correct role with the wrong identity is still refused"
