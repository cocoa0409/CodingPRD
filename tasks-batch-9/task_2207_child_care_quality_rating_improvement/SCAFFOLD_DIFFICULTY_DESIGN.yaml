  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_nested_min_over_sequential_block_fold
        grounds:
          - calculations.rating_tier_determination
          - calculations.domain_points_award
          - calculations.observation_composite_score
          - entities.StandardDomain.fields.block_level
          - entities.StandardDomain.fields.block_min_points
          - entities.RatingCycle.fields.block_clearance
          - entities.RatingCycle.fields.highest_block_cleared
          - validations[priority=52]
        distinguishing_aspect: |
          Combinatorial mode (a): rating_tier_determination combines five per-domain point
          inputs, the observation composite and the block-minimum table through a nested
          min() over a sequentially folded gate table, so block 3 CLEARED while block 2 is
          NOT_CLEARED collapses highest_block_cleared to 1 and awarded_tier to
          min(points_tier 5, BLOCK_CAP_TIER[1] 2) == 2 even though weighted_total is 96.17.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Five StandardDomain rows: LEARNING_ENVIRONMENT (block 1, max 40, min 20, weight 0.30, observation_linked, min_composite_for_block 4.00), STAFF_QUALIFICATIONS (block 1, max 30, min 15, weight 0.25), FAMILY_PARTNERSHIP (block 2, max 20, min 18, weight 0.20), ADMINISTRATION (block 2, max 20, min 10, weight 0.15), CHILD_ASSESSMENT (block 3, max 10, min 6, weight 0.10)."
            - "Provider active_staff_fte 10.0 with VERIFIED credentials contributing qualifying_fte 1.6 + 4.0 + 4.0 = 9.6, so credential_compliance_pct == 96.00, CREDENTIAL_FRACTION == 1.00 and the STAFF_QUALIFICATIONS cap is 30."
