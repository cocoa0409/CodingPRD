          Each seat is individually affordable; only the RUNNING TOTAL breaches the cap, and the comparison
          is inclusive - the offer that brings the season to exactly 1250000 of a 1250000 budget is
          accepted, and the next one is refused. The commitment counts the room's facility surcharge and
