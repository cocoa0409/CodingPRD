scaffold_corner_design:

  # -----------------------------------------------------------------
  - section: entities
    instances:
      - name: account_create_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Account.fields.status
          - entities.Account.fields.current_balance_cents
        distinguishing_aspect: "POST /accounts returns 201 with status ACTIVE, current_balance_cents 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_holder_name: "New Nan", service_address: "100 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
          assert:
            - "Account.${a_id}.status == ACTIVE"
            - "Account.${a_id}.current_balance_cents == 0"
            - "Account.${a_id}.version == 1"

      - name: account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Account.fields.occupant_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /accounts without occupant_type is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_holder_name: "No Class", service_address: "101 Oak" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (422)"

      - name: account_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent account id returns ERR_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_FOUND (404)"

      - name: rate_schedule_invalid_enum_service_type_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.RateSchedule.fields.service_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /rate-schedules with service_type GAS (not a permitted enum) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rate-schedules"
              payload: { service_type: "GAS", unit: "GALLON", fixed_charge_cents: 1000, effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (422)"

      - name: account_system_fields_ignore_client_input
        claim_type: System Fields
        grounds:
          - entities.Account.fields.status
        distinguishing_aspect: "Client-supplied status is ignored; a new account is always ACTIVE with server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_holder_name: "Sneaky Sam", service_address: "102 Oak", occupant_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
          assert:
            - "Account.${a_id}.status == ACTIVE"
            - "Account.${a_id}.id is a UUID with no type prefix"

  # -----------------------------------------------------------------
  - section: state_machines
    instances:
      - name: reverse_already_reversed_payment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reversing a payment twice: the second reverse hits a REVERSED payment and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account with WATER meter read 9500, bill 4640, paid, then payment reversed once."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Twice Tia", service_address: "103 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 4640, method: "ACH" }
              as: BillingSpecialist
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: reinstate_active_arrangement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PaymentArrangement.DEFAULTED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "reinstate on an ACTIVE (never-defaulted) arrangement returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account with one ACTIVE payment arrangement."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Reins Ray", service_address: "104 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id, acct_v: $.data.version }
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 12000, installment_count: 4, expected_account_version: "${acct_v}" }
              as: AssistanceCaseworker
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /payment-arrangements/${pa_id}/reinstate"
              payload: {}
              as: AssistanceCaseworker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: initial_state_new_bill_is_unpaid_current
        claim_type: Initial State
        grounds:
          - entities.Bill.fields.payment_status
          - entities.Bill.fields.collection_status
        distinguishing_aspect: "A freshly generated bill starts payment_status UNPAID and collection_status CURRENT."
        test_recipe:
          setup: ["Account with WATER meter read 9500."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Init Ida", service_address: "105 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
          trigger:
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
          assert:
            - "Bill.${b_id}.payment_status == UNPAID"
            - "Bill.${b_id}.collection_status == CURRENT"

      - name: mark_delinquent_paid_bill_returns_bill_already_paid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Bill.CURRENT_to_DELINQUENT
          - errors[ERR_BILL_ALREADY_PAID]
        distinguishing_aspect: "Marking a fully-PAID bill delinquent returns ERR_BILL_ALREADY_PAID (409)."
        test_recipe:
          setup: ["Account with WATER meter read 9500, bill 4640, fully paid; clock past grace."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Paid Pat", service_address: "106 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 4640, method: "CARD" }
              as: BillingSpecialist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: CollectionsOfficer
          trigger:
            - call: "POST /bills/${b_id}/mark-delinquent"
              payload: {}
              as: CollectionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BILL_ALREADY_PAID (409)"

  # -----------------------------------------------------------------
  - section: calculations
    instances:
      - name: budget_billing_monthly_amount_computed_on_enroll
        claim_type: Correct Result
        grounds:
          - calculations.budget_billing_amount
          - entities.BudgetBillingPlan.fields.monthly_budget_cents
        distinguishing_aspect: "Enrolling an account with prior_annual_charges_cents 48000 yields monthly_budget_cents 4000 (48000/12)."
        test_recipe:
          setup: ["Account with prior_annual_charges_cents 48000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Bud Bea", service_address: "107 Oak", occupant_type: "RESIDENTIAL", prior_annual_charges_cents: 48000 }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/budget-billing-plan"
              payload: { plan_year: 2026 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
          assert:
            - "BudgetBillingPlan.${plan_id}.monthly_budget_cents == 4000"
            - "BudgetBillingPlan.${plan_id}.status == ACTIVE"

      - name: levelization_true_up_deferred_balance_positive
        claim_type: Correct Result
        grounds:
          - calculations.levelization_true_up
          - state_machines.BudgetBillingPlan.ACTIVE_to_TRUED_UP
        distinguishing_aspect: "Two budget_billed bills (actual 4640 each, budget 4000 each) give cumulative_actual 9280 - cumulative_budgeted 8000 = deferred 1280 at true-up."
        test_recipe:
          setup: ["Budget-enrolled account (monthly 4000) with two budget_billed bills over Jan and Feb, each metered 9500 gal."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Level Len", service_address: "108 Oak", occupant_type: "RESIDENTIAL", prior_annual_charges_cents: 48000 }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/budget-billing-plan"
              payload: { plan_year: 2026 }
              as: BillingSpecialist
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-01-31T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", budget_billed: true }
              as: BillingSpecialist
              captures: { b1_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-02-28T00:00:00Z", reading_value: 19000, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", budget_billed: true }
              as: BillingSpecialist
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /budget-billing-plans/${plan_id}/true-up"
              payload: {}
              as: BillingSpecialist
          assert:
            - "Bill.${b1_id}.total_due_cents == 4000"
            - "Bill.${b1_id}.actual_charges_cents == 4640"
            - "BudgetBillingPlan.${plan_id}.deferred_balance_cents == 1280"
            - "BudgetBillingPlan.${plan_id}.status == TRUED_UP"

      - name: payment_waterfall_allocates_oldest_bill_first
        claim_type: Correct Result
        grounds:
          - calculations.payment_allocation
          - entities.Payment.fields.allocation
        distinguishing_aspect: "A 5000 payment across a Jan bill (2890) and a Feb bill (4640) fully pays the Jan bill and partially the Feb bill (2110)."
        test_recipe:
          setup: ["Account with WATER meter; Jan bill 2890 (6000 gal) and Feb bill 4640 (9500 gal delta)."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Fall Fay", service_address: "109 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-01-31T00:00:00Z", reading_value: 6000, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b1_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-02-28T00:00:00Z", reading_value: 15500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 5000, method: "ACH" }
              as: BillingSpecialist
              captures: { pay_id: $.data.id }
          assert:
            - "Bill.${b1_id}.payment_status == PAID"
            - "Bill.${b1_id}.amount_paid_cents == 2890"
            - "Bill.${b2_id}.payment_status == PARTIAL"
            - "Bill.${b2_id}.amount_paid_cents == 2110"

  # -----------------------------------------------------------------
  - section: validations
    instances:
      - name: reading_regression_returns_422
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_READING_REGRESSION]
        distinguishing_aspect: "An ACTUAL reading 8000 below the meter's latest ACTUAL 9500 returns ERR_READING_REGRESSION (422)."
        test_recipe:
          setup: ["Meter with a latest ACTUAL reading of 9500."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Reg Rex", service_address: "110 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
          trigger:
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-05-15T00:00:00Z", reading_value: 8000, read_type: "ACTUAL" }
              as: MeterTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_READING_REGRESSION (422)"

      - name: payment_exceeds_balance_returns_422
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: "A 10000 payment against an account whose only open bill is 4640 returns ERR_PAYMENT_EXCEEDS_BALANCE (422)."
        test_recipe:
          setup: ["Account with WATER meter read 9500 and one UNPAID bill 4640."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Over Ova", service_address: "111 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
          trigger:
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 10000, method: "CASH" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAYMENT_EXCEEDS_BALANCE (422)"

      - name: budget_billed_bill_without_plan_returns_409
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_NO_ACTIVE_PLAN]
        distinguishing_aspect: "Generating a budget_billed bill for an account with no ACTIVE BudgetBillingPlan returns ERR_NO_ACTIVE_PLAN (409)."
        test_recipe:
          setup: ["Account with WATER meter read 9500 but no budget billing plan."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "NoPlan Ned", service_address: "112 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
          trigger:
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z", budget_billed: true }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ACTIVE_PLAN (409)"

      - name: shutoff_schedule_without_delinquency_returns_409
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_NO_DELINQUENT_BALANCE]
        distinguishing_aspect: "Scheduling a shutoff on an ACTIVE (non-delinquent) account returns ERR_NO_DELINQUENT_BALANCE (409)."
        test_recipe:
          setup: ["ACTIVE account with no delinquent balance."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Fresh Fred", service_address: "113 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/shutoff-orders"
              payload: { scheduled_date: "2026-06-15T00:00:00Z", reason: "DELINQUENCY" }
              as: CollectionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_DELINQUENT_BALANCE (409)"

      - name: lien_initiate_below_min_arrears_returns_409
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_INSUFFICIENT_ARREARS]
        distinguishing_aspect: "Initiating a lien when delinquent_balance 4640 < LIEN_MIN_ARREARS_CENTS 10000 returns ERR_INSUFFICIENT_ARREARS (409)."
        test_recipe:
          setup: ["Delinquent account with balance 4640 (water 9500), below the lien minimum."]
          setup_api_calls:
            - call: "POST /rate-schedules"
