  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: veto_threshold_exact_count_triggers_veto
        grounds:
          - state_machines.Trade.PENDING_VETO_to_VETOED
          - entities.League.fields.veto_threshold
        distinguishing_aspect: |
          Numeric-threshold boundary on Trade.veto_votes_count via POST /trades/{id}/veto-votes:
          League.veto_threshold=2 in a 4-team league. After 1 VETO vote, Trade.state remains
          PENDING_VETO (1 < 2). After the SECOND VETO vote (count reaches exactly the threshold,
          using `>=` semantics from §1.2), Trade auto-transitions to VETOED. The test pins the
          equality boundary `votes == threshold` triggers, not `votes > threshold`.
        test_recipe:
          setup:
            - "League IN_SEASON, veto_threshold=2, 4 teams (TA, TB, TC, TD); Trade between TA and TB is in PENDING_VETO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-22T00:00:00Z" }
              as: Commissioner
              as_user_id: "commish_10"
            - call: "POST /leagues"
              payload: { name: "Veto L", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 2, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "commish_10"
              captures: { l_v_id: $.data.id, l_v_v: $.data.version }
            - call: "POST /leagues/${l_v_id}/teams"
              payload: { display_name: "TA", division: "E" }
              as: Commissioner
