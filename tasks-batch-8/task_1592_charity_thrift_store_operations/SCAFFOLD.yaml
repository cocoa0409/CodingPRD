    side_effects: ["items SOLD -> ON_FLOOR with price/round restored", "batch sold_item_count -= 1 per line and DonationBatch.version += 1", "session totals -= total_cents", "expected_cash_cents recomputed", "SalesTransaction.version += 1"]

