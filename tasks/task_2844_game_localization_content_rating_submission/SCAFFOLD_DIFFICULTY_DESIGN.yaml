      - name: talent_daily_capacity_aggregates_across_booths_and_resets_per_utc_date
        grounds:
          - calculations.talent_reserved_minutes_on_date
          - validations[priority=63]
          - entities.VoiceTalent.fields.max_daily_recording_minutes
        distinguishing_aspect: |
          A different resource axis with different geometry from the booth case: the talent limit is
          an AGGREGATE over a UTC calendar date, not a pairwise interval intersection, so two
          sessions that never overlap in time and sit in two different booths still collide. The
          same 90-minute booking is then accepted one calendar day later, proving the bucket is
          keyed on utc_calendar_date(start_utc) rather than on a rolling 24-hour window.
