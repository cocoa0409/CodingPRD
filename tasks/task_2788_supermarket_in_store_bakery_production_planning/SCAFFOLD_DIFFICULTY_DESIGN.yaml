  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_cannot_start_bake_while_its_oven_is_in_maintenance
        grounds:
          - validations.priority_26
          - state_machines.Oven.oven_status
          - state_machines.ProductionRun.execution_status
          - errors.ERR_OVEN_UNAVAILABLE
          - endpoints.POST_/bakery/ovens/{ovenId}/status
        distinguishing_aspect: |
          Entity pair PRODUCTION RUN -> OVEN. The run's own execution_status is a
          perfectly legal SCHEDULED, and nothing about the run changed; the transition
          is blocked purely by the Oven's oven_status, which is re-read at start-bake
          rather than trusted from creation time.
        test_recipe:
          setup:
            - "PLANNED BakeDay; PAR-CROIS run of 2 racks created while Deck Oven A was AVAILABLE."
            - "Deck Oven A is then moved to MAINTENANCE by the DepartmentManager."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
