  instances:
  - name: factor_audit_cascade_batch_to_invoice_to_carrier_to_ledger
    grounds:
    - state_machines.TrafficFactorFiling.DISPUTED_to_AUDITED
    - state_machines.UsageBatch.INVOICED_to_INVOICED
    - calculations.access_charge_rating
    - calculations.reserve_provision
    - entities.AccessInvoice.fields.adjustment_count
    - entities.ReserveLedgerEntry.fields.source_event
    distinguishing_aspect: |
      Depth-4 cascade triggered by the TrafficFactorFiling DISPUTED -> AUDITED transition: the audit re-rates the pinned UsageBatch; because that batch's rated_amount_usd moved, its ISSUED AccessInvoice is refreshed; because the invoice's open_balance_usd moved, the Carrier reserve is recomputed; because the uncollectible balance moved, a ReserveLedgerEntry is appended. Each hop is caused by the previous hop's mutation, and the triggering transition differs from the traffic-measurement ingest that drives this rule's other cascade.
