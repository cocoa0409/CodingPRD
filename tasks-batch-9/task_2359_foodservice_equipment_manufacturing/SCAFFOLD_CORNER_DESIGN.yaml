          rationale: "The §1.8 compensating_invariant instance already asserts that a reversal restores reserve_balance_cents and claims_paid_cents exactly, leaves reserve_initial_cents untouched, and returns the unit from GRACE to ACTIVE with grace_expires_on cleared."

