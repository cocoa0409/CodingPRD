        distinguishing_aspect: "Request without X-User-Role header returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (name pattern triggers negative-test lint path)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            # Negative test: missing role header — the unit-test-generator must
            # implement this by omitting the header. We capture the error envelope.
            - { call: "GET /recycle-routes/customers", payload: {}, as: RoutePlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "When X-User-Role header is missing: HTTP 400 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

