# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Subrogation & Recovery Vendor — 9 rule_ids x 2 instances = 18 instances
# All monetary literals in cents; all amounts pre-computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_recoverable_provisional_vs_final
        grounds:
          - calculations.claim_recoverable
          - entities.Claim.fields.provisional_recoverable_cents
          - entities.Claim.fields.settled_amount_cents
          - state_machines.Claim.DEMAND_ISSUED_to_SETTLED
        distinguishing_aspect: "On the Claim domain, the provisional variant (three-way min = 3000000) and the final variant (accepted settled_amount = 2700000) yield different recoverable figures for the same claim."
        test_recipe:
          setup:
            - "ACTIVE carrier (NET, 2500 bps); eligible adverse party policy_limit 5000000"
            - "Claim referred: paid_loss 2500000, deductible 500000, total_damages 4000000, statute 2028-01-01"
            - "liability assessed at 80% -> provisional_recoverable_cents = min(3200000, 5000000, 3000000) = 3000000"
            - "Claim advanced to DEMAND_ISSUED; a 2700000 settlement proposed and manager-approved"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Bob Driver", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-1", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { provisional: $.data.provisional_recoverable_cents }
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 2700000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
            - call: "POST /subro/settlements/${settlement_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /subro/settlements/${settlement_id}/accept"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
          assert:
            - "Claim.${claim_id}.provisional_recoverable_cents == 3000000"
            - "Claim.${claim_id}.settled_amount_cents == 2700000"
            - "Claim.${claim_id}.provisional_recoverable_cents != Claim.${claim_id}.settled_amount_cents"

      - name: commission_cash_net_vs_billed_gross
        grounds:
          - calculations.commission_due
          - entities.Carrier.fields.commission_basis
          - entities.Claim.fields.accrued_commission_cents
          - entities.CommissionStatement.fields.lines
        distinguishing_aspect: "For a GROSS-basis carrier, the cash waterfall commission (net of deductible = 625000) and the billed commission_due GROSS variant (on full gross = 750000) diverge for one recovered claim; the commission calc lives on the Carrier/Commission domain, not the Claim recoverable domain."
        test_recipe:
          setup:
            - "GROSS-basis carrier (2500 bps); eligible adverse party policy 5000000"
            - "Claim fully recovered: gross 3000000, deductible 500000 reimbursed"
            - "waterfall accrued_commission_cents = round(0.25*2500000) = 625000"
            - "commission statement created -> line commission_due GROSS = round(0.25*3000000) = 750000"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Gross Carrier", naic_code: "22222", commission_rate_bps: 2500, commission_basis: "GROSS" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Cara Crash", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-G", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 3000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
            - call: "POST /subro/settlements/${settlement_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-1"
            - call: "POST /subro/settlements/${settlement_id}/accept"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
            - call: "POST /subro/claims/${claim_id}/recovery-payments"
              payload: { amount_cents: 3000000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay_id: $.data.id }
            - call: "POST /subro/recovery-payments/${pay_id}/clear"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "GET /subro/deductible-reimbursements?claim_id=${claim_id}"
              payload: {}
              as: Any
              as_user_id: "fin-1"
              captures: { reimb_id: "$.data[0].id" }
            - call: "POST /subro/deductible-reimbursements/${reimb_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          trigger:
            - call: "POST /subro/carriers/${carrier_id}/commission-statements"
              payload: { period_label: "2026-Q3" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id }
          assert:
            - "Claim.${claim_id}.accrued_commission_cents == 625000"
            - "CommissionStatement.${stmt_id}.lines[0].commission_cents == 750000"
            - "CommissionStatement.${stmt_id}.lines[0].commission_cents != Claim.${claim_id}.accrued_commission_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recoverable_three_way_min_policy_binds
        grounds:
          - calculations.claim_recoverable
          - entities.AdverseParty.fields.policy_limit_cents
          - entities.Claim.fields.provisional_recoverable_cents
        distinguishing_aspect: "Mode (a): nested three-input min(liability_share=3200000, policy_limit=2800000, base_exposure=3000000) selects the policy-limit input = 2800000 — a non-linear interaction of three inputs, not a single tiered rate."
        test_recipe:
          setup:
            - "Eligible adverse party with policy_limit 2800000 (below both other caps)"
            - "Claim paid_loss 2500000 + deductible 500000 = base 3000000; total_damages 4000000; liability 80% -> liability_share 3200000"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Low Limit Larry", adverse_carrier_name: "Thin Cover Co", is_arbitration_eligible: true, policy_limit_cents: 2800000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-2", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { prov: $.data.provisional_recoverable_cents }
          assert:
            - "Claim.${claim_id}.provisional_recoverable_cents == 2800000"

      - name: commission_statement_round_per_line_then_sum
        grounds:
          - calculations.statement_commission_total
          - entities.CommissionStatement.fields.total_commission_cents
          - entities.CommissionStatement.fields.lines
        distinguishing_aspect: "Mode (b): two claims each yield commission 250008.25 cents; rounding per-line-then-sum gives 500016, whereas sum-then-round gives 500017 — the pinned per-line order is observable."
        test_recipe:
          setup:
            - "NET carrier 2500 bps; two claims each paid_loss 1000033, deductible 0, both fully recovered (payment 1000033 cleared)"
            - "per-line commission = round(0.25 * 1000033) = 250008; total = 250008 + 250008 = 500016"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Round Test Ins", naic_code: "33333", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Adv A", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-R1", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 1000033, deductible_cents: 0, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /subro/claims/${claim1_id}/assess-liability"
              payload: { liability_pct: 100 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim1_id}/demands"
              payload: { amount_demanded_cents: 1000033 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim1_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim1_v: $.data.version }
            - call: "POST /subro/claims/${claim1_id}/settlements"
              payload: { settled_amount_cents: 1000033, expected_claim_version: "${claim1_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { s1_id: $.data.id }
            - call: "POST /subro/settlements/${s1_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-1"
            - call: "POST /subro/settlements/${s1_id}/accept"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
            - call: "POST /subro/claims/${claim1_id}/recovery-payments"
              payload: { amount_cents: 1000033 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay1_id: $.data.id }
            - call: "POST /subro/recovery-payments/${pay1_id}/clear"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-R2", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 1000033, deductible_cents: 0, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim2_id: $.data.id }
            - call: "POST /subro/claims/${claim2_id}/assess-liability"
              payload: { liability_pct: 100 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim2_id}/demands"
              payload: { amount_demanded_cents: 1000033 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim2_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim2_v: $.data.version }
            - call: "POST /subro/claims/${claim2_id}/settlements"
              payload: { settled_amount_cents: 1000033, expected_claim_version: "${claim2_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { s2_id: $.data.id }
            - call: "POST /subro/settlements/${s2_id}/approve"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-1"
            - call: "POST /subro/settlements/${s2_id}/accept"
              payload: {}
              as: CarrierUser
              as_user_id: "${carrier_id}"
            - call: "POST /subro/claims/${claim2_id}/recovery-payments"
              payload: { amount_cents: 1000033 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { pay2_id: $.data.id }
            - call: "POST /subro/recovery-payments/${pay2_id}/clear"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /subro/carriers/${carrier_id}/commission-statements"
              payload: { period_label: "2026-Q3" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /subro/commission-statements/${stmt_id}/finalize"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { total: $.data.total_commission_cents }
          assert:
            - "CommissionStatement.${stmt_id}.total_commission_cents == 500016"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: arbitration_cyclic_response_rounds
        grounds:
          - state_machines.Arbitration.AWAITING_RESPONSE_to_RESPONSE_FILED
          - state_machines.Arbitration.RESPONSE_FILED_to_AWAITING_RESPONSE
          - entities.Arbitration.fields.round_count
        distinguishing_aspect: "Arbitration cycles AWAITING_RESPONSE<->RESPONSE_FILED: after two round filings status returns to AWAITING_RESPONSE with round_count 2 (a genuine cycle, not a linear pipeline)."
        test_recipe:
          setup:
            - "Claim with a DISPUTED demand on an eligible adverse party; arbitration FILED then hearing scheduled (AWAITING_RESPONSE)"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Arb Andy", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-3", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { demand_id: $.data.id }
            - call: "POST /subro/demands/${demand_id}/record-response"
              payload: { outcome: "DISPUTED" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/arbitrations"
              payload: { forum: "AF" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { arb_id: $.data.id }
            - call: "POST /subro/arbitrations/${arb_id}/schedule-hearing"
              payload: { hearing_start: "2026-08-01T00:00:00Z", hearing_end: "2026-08-02T00:00:00Z" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /subro/arbitrations/${arb_id}/rounds"
              payload: { note: "adverse response" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/arbitrations/${arb_id}/rounds"
              payload: { note: "our rebuttal" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { st: $.data.status }
          assert:
            - "Arbitration.${arb_id}.round_count == 2"
            - "Arbitration.${arb_id}.status == AWAITING_RESPONSE"

      - name: settlement_branching_fork_to_rejected
        grounds:
          - state_machines.Settlement.PROPOSED_to_APPROVED
          - state_machines.Settlement.PROPOSED_to_REJECTED
          - entities.Settlement.fields.status
        distinguishing_aspect: "From PROPOSED the Settlement forks to either APPROVED or REJECTED; this instance takes the REJECTED branch, a divergent terminal from the APPROVED branch on the same entity."
        test_recipe:
          setup:
            - "Claim in DEMAND_ISSUED with a PROPOSED settlement of 1000000"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Fork Fran", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-4", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 1000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
          trigger:
            - call: "POST /subro/settlements/${settlement_id}/reject"
              payload: {}
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { st: $.data.status }
          assert:
            - "Settlement.${settlement_id}.status == REJECTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_clear_recovers_claim_and_creates_reimbursement
        grounds:
          - state_machines.RecoveryPayment.RECEIVED_to_CLEARED
          - state_machines.Claim.SETTLED_to_RECOVERED
          - state_machines.DeductibleReimbursement.PENDING_to_DISBURSED
        distinguishing_aspect: "Depth-3 chain from clear: RecoveryPayment(CLEARED) -> Claim(final_recovered up, RECOVERED) -> DeductibleReimbursement(created PENDING 500000); each hop is caused by the prior mutation."
        test_recipe:
          setup:
            - "Claim SETTLED at 3000000 (deductible 500000); one RecoveryPayment of 3000000 RECEIVED"
          setup_api_calls:
            - call: "POST /subro/carriers"
              payload: { name: "Acme Mutual", naic_code: "12345", commission_rate_bps: 2500, commission_basis: "NET" }
              as: RecoveryManager
              as_user_id: "mgr-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /subro/adverse-parties"
              payload: { name: "Cash Cathy", adverse_carrier_name: "Rival Insurance", is_arbitration_eligible: true, policy_limit_cents: 5000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { ap_id: $.data.id }
            - call: "POST /subro/claims"
              payload: { carrier_id: "${carrier_id}", adverse_party_id: "${ap_id}", claim_reference: "CLM-5", loss_date: "2026-05-01T00:00:00Z", paid_loss_cents: 2500000, deductible_cents: 500000, total_damages_cents: 4000000, statute_deadline: "2028-01-01T00:00:00Z" }
              as: CarrierUser
              as_user_id: "${carrier_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /subro/claims/${claim_id}/assess-liability"
              payload: { liability_pct: 80 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "POST /subro/claims/${claim_id}/demands"
              payload: { amount_demanded_cents: 3000000 }
              as: RecoverySpecialist
              as_user_id: "spec-1"
            - call: "GET /subro/claims/${claim_id}"
              payload: {}
              as: Any
              as_user_id: "mgr-1"
              captures: { claim_v: $.data.version }
            - call: "POST /subro/claims/${claim_id}/settlements"
              payload: { settled_amount_cents: 3000000, expected_claim_version: "${claim_v}" }
              as: RecoverySpecialist
              as_user_id: "spec-1"
              captures: { settlement_id: $.data.id }
