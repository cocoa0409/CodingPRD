    http: 403
    condition: "The authenticated role is not listed in the endpoint's roles set"
  - id: ERR_NOT_APPLICATION_OWNER
    http: 403
    condition: "ApplicantRepresentative's X-User-ID differs from the application's facility_id"
  - id: ERR_NOT_ASSIGNED_INSPECTOR
    http: 403
    condition: "Inspector's X-User-ID differs from Inspection.inspector_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
