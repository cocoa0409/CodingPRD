          assert:
            - "${err} == ERR_DOOR_KIND_MISMATCH"

      - name: error_shipment_on_osd_hold_excluded_because
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIPMENT_ON_OSD_HOLD]"]
        excluded_because:
          difficulty_instance: osd_hold_safety_beats_destination_constraint
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_trailer_over_capacity_excluded_because
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRAILER_OVER_CAPACITY]"]
        excluded_because:
          difficulty_instance: trailer_capacity_exactly_at_cap_allowed
          rationale: "Asserted as the over-cap failure arm of the named §1.8 boundary instance."

      - name: error_relay_connect_infeasible_excluded_because
        claim_type: violation_to_error
        grounds: ["errors[ERR_RELAY_CONNECT_INFEASIBLE]"]
        excluded_because:
          difficulty_instance: relay_connect_buffer_window_semantics
          rationale: "Asserted as the 44-minute-gap rejection of the named §1.8 temporal-overlap instance."

      - name: error_stop_outside_shift_excluded_because
        claim_type: violation_to_error
        grounds: ["errors[ERR_STOP_OUTSIDE_SHIFT]"]
        excluded_because:
          difficulty_instance: pickup_stop_shift_window_closed_interval
          rationale: "Asserted as the 1021-minute rejection of the named §1.8 temporal-overlap instance."

      - name: error_trailer_not_loadable_excluded_because
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRAILER_NOT_LOADABLE]"]
        excluded_because:
          difficulty_instance: mark_ready_empty_manifest_and_utilization_floor
          rationale: "Asserted for both the empty-manifest and sub-floor arms of the named §1.8 boundary instance."

      - name: error_relay_sequence_violation_excluded_because
        claim_type: violation_to_error
        grounds: ["errors[ERR_RELAY_SEQUENCE_VIOLATION]"]
        excluded_because:
          difficulty_instance: leg_depart_gated_by_prior_relay_leg
          rationale: "Asserted as the failure path of the named §1.8 cross-entity dependency instance."

