            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${b1_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
              captures: { asg1_id: $.data.id }
            - call: "POST /coffee-cart/assignments/${asg1_id}/accept"
              as: Barista
              as_user_id: "${barista_id}"
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_b_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T12:00:00Z", event_end: "2026-05-10T14:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${b2_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
              captures: { asg2_id: $.data.id }
          trigger:
            - call: "POST /coffee-cart/assignments/${asg2_id}/accept"
              as: Barista
              as_user_id: "${barista_id}"
              captures: { st: $.data.status }
          assert:
            - "st == ACCEPTED (adjacent bookings allowed under half-open unbuffered semantics)"

  # -------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: inventory_reserved_units_conserved_across_reserve_release
        grounds:
          - calculations.inventory_conservation_invariant
          - state_machines.InventoryReservation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = InventoryItem.reserved_units. Forward action: create reservation (+qty_units). Compensating action: cancel booking from QUOTE (-qty_units via RELEASED cascade). Net drift = 0.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z"
            - "InventoryItem SKU BEAN on_hand=100, reserved=0"
            - "Booking B in QUOTE with reservation for qty=25 (reserved becomes 25)"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/inventory-items"
              payload: { sku: "BEAN-ESPRESSO-KG", on_hand_units: 100, reorder_threshold_units: 10 }
              as: OperationsManager
              captures: { item_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_id}/reservations"
              payload: { item_id: "${item_id}", qty_units: 25 }
              as: OperationsManager
            - call: "GET /coffee-cart/inventory-items/${item_id}"
              as: OperationsManager
              captures: { reserved_pre: $.data.reserved_units }
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /coffee-cart/inventory-items/${item_id}"
              as: OperationsManager
              captures: { reserved_post: $.data.reserved_units }
          assert:
            - "reserved_pre == 25 (after forward reserve)"
            - "reserved_post == 0 (after compensating release; invariant reserved_units conserved)"

      - name: barista_weekly_hours_conserved_across_accept_withdraw
        grounds:
          - calculations.barista_weekly_hours_check
          - state_machines.BaristaAssignment.ACCEPTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = Barista.committed_hours_this_week. Forward action: accept assignment (+duration_hours). Compensating action: withdraw (-duration_hours). Net drift = 0. Distinct conserved quantity from inventory units.
