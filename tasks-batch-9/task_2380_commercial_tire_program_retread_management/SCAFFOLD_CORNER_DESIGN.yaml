              payload: { name: "Assign Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-113", vehicle_type: "TRACTOR", current_odometer_miles: 9000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Tech One", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Tech Two", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech2_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Tire down", reported_at: "2026-08-12T12:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-12T12:05:00Z", dispatch_miles: 5, technician_id: "${tech1_id}" }
              as: DispatchCoordinator
          trigger:
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-12T13:00:00Z" }
              as: TireTechnician
              as_user_id: "${tech2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-12T13:00:00Z" }
              as: TireTechnician
              as_user_id: "${tech1_id}"
          assert:
            - "the wrong technician's arrival returns 403 with data.error_id == \"ERR_TECHNICIAN_SCOPE_VIOLATION\""
            - "after the rejection RoadServiceCall.${call_id}.dispatch_status == \"DISPATCHED\" and arrived_at == null"
            - "the assigned technician's identical arrival returns 200 with dispatch_status == \"ON_SITE\", committed_response_minutes == 180, actual_response_minutes == 60 and sla_met == true"
            - "Technician.${tech2_id}.status == \"AVAILABLE\" throughout — a refused arrival changes no technician state"

      - name: dispatch_side_effects_move_technician_and_vehicle
        claim_type: side_effect_execution
        grounds:
          - state_machines.RoadServiceCall.OPEN_to_DISPATCHED
          - state_machines.Technician.AVAILABLE_to_ON_CALL
          - entities.Vehicle.fields.status
        distinguishing_aspect: "One dispatch call must apply all four declared side effects — dispatch_status, technician_id/dispatched_at/dispatch_miles, Technician AVAILABLE -> ON_CALL and Vehicle -> OUT_OF_SERVICE — while explicitly leaving billing_status at UNBILLED."
        test_recipe:
          setup: ["one location, one fleet, one unit, one AVAILABLE technician, one OPEN call"]
          setup_api_calls:
