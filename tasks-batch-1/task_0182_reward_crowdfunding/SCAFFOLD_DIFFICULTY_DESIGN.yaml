              as: PlatformAdmin
            - call: "GET /tiers/${tier_id}"
              as: PlatformAdmin
              captures: { tier_status: $.data.status, claimed: $.data.claimed_quantity }
          assert:
            - "Campaign.${camp_id}.status == FAILED (ALL_OR_NOTHING, goal_met false)."
            - "Pledge.${pledge_id}.payment_status == REFUNDED with a Refund(reason=FAILED_CAMPAIGN, amount=5650)."
            - "RewardTier.${tier_id}.claimed_quantity == 0 and status == RETIRED (inventory released then retired by terminal campaign)."

      - name: auth_declined_release_inventory_depth2
        grounds:
          - state_machines.Pledge.PENDING_AUTH_to_AUTH_DECLINED
          - state_machines.RewardTier.SOLD_OUT_to_AVAILABLE
          - calculations.tier_claimed_quantity
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (the close-time authorization replay turning a Pledge
          PENDING_AUTH->AUTH_DECLINED): (1) AUTH_DECLINED releases the claimed unit; (2)
          RewardTier.claimed_quantity recompute drops the tier from SOLD_OUT below its limit. Distinct
          propagation origin from the CLOSING->FAILED cascade above.
        test_recipe:
          setup:
            - "FLEXIBLE campaign, tier limit 1, single pledge of 5650 with a DECLINED auth queued; tier SOLD_OUT before close."
          setup_api_calls:
            - call: "POST /creators"
