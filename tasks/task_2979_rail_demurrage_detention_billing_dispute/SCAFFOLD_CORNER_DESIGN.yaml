            - call: "POST /demurrage/disputes"
              payload: { invoice_id: "${inv_id}", scope: "WHOLE_INVOICE", grounds: "RAILROAD_CAUSED_DELAY", narrative: "First reader wins the race.", claimed_credit_cents: 10000, expected_invoice_version: "${inv_v1}" }
              as: Customer
