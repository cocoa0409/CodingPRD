        grounds:
          - calculations.rate_lookup
          - entities.RateCard.fields.ltv_band
          - entities.CoverageApplication.fields.rate_bps_applied
        distinguishing_aspect: "Each loan-to-value band's upper bound is inclusive and its lower bound exclusive, so a loan at exactly 85.0000 percent takes the 831_TO_85 card while a loan a cent above 85 percent takes the 851_TO_90 card, and the differing rate card changes the loan's premium."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated lender and two rate cards on one policy, one pricing the 831_TO_85 band at 62 basis points and one pricing 851_TO_90 at 85 basis points."
