            - "case B: variance_vs_accepted_cents == 60000, variance_pct == 12.0, classification == OVER_TOLERANCE"

      - name: refund_window_boundary_two_business_days
        claim_type: threshold_boundary
        grounds: [calculations.deposit_refund_amount]
        distinguishing_aspect: "The >= 2 business-day tier boundary: refunding 2 business days before service returns 100% (125000); refunding 1 business day before returns 50% (62500)."
        test_recipe:
          setup: ["Patient with two cases (both service 2026-08-20, a Thursday), each holding one POSTED deposit of 125000"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-CA-8", full_name: "Pat Window", date_of_birth: "1992-08-08" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Case A" }
              as: Registrar
              captures: { case_a: $.data.id }
            - call: "POST /clearance/cases/${case_a}/deposits"
              payload: { amount_cents: 125000, method: "CARD" }
              as: FinancialCounselor
              captures: { dep_a: $.data.id }
            - call: "POST /clearance/deposits/${dep_a}/post"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Case B" }
              as: Registrar
              captures: { case_b: $.data.id }
            - call: "POST /clearance/cases/${case_b}/deposits"
              payload: { amount_cents: 125000, method: "CARD" }
              as: FinancialCounselor
              captures: { dep_b: $.data.id }
            - call: "POST /clearance/deposits/${dep_b}/post"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/deposits/${dep_a}/refund"
              payload: {}
              as: ClearanceSupervisor
              captures: { ref_a: $.data.refund_amount_cents }
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/deposits/${dep_b}/refund"
              payload: {}
              as: ClearanceSupervisor
              captures: { ref_b: $.data.refund_amount_cents }
          assert:
            - "refund at 2026-08-18 (business days in (18,20] = {19,20} = 2): refund_amount_cents == 125000 (100% tier, boundary included)"
            - "refund at 2026-08-19 (business days in (19,20] = {20} = 1): refund_amount_cents == 62500 (50% tier)"
            - "both deposits end REFUNDED with refund_reason == SERVICE_CANCELLED"

      - name: rate_effective_window_half_open_lookup
        claim_type: input_set_filtering
        grounds: [calculations.bundled_contract_pricing, entities.ContractRate.fields.effective_to]
        distinguishing_aspect: "Pricing uses the same half-open semantics as the overlap rule: service_date equal to effective_to is NOT covered (ERR_RATE_NOT_FOUND), while one day earlier prices fine."
        test_recipe:
          setup:
            - "Charge 27447; contract ACME NONE with rate 3000000 window [2026-01-01, 2026-08-20)"
            - "Patient with snapshot (ded 0/0, oop 5000000/0, coins 20); case A service 2026-08-20 with DRAFT estimate; case B service 2026-08-19 with DRAFT estimate"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "NONE" }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01", effective_to: "2026-08-20" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-CA-9", full_name: "Pat WindowLookup", date_of_birth: "1992-09-09" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-CA9", deductible_total_cents: 0, deductible_met_cents: 0, oop_max_cents: 5000000, oop_met_cents: 0, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "On the excluded end" }
              as: Registrar
              captures: { case_a: $.data.id, case_a_v: $.data.version }
            - call: "POST /clearance/cases/${case_a}/estimates"
              payload: { expected_case_version: "${case_a_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_a: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-19", service_description: "Inside the window" }
              as: Registrar
              captures: { case_b: $.data.id, case_b_v: $.data.version }
            - call: "POST /clearance/cases/${case_b}/estimates"
              payload: { expected_case_version: "${case_b_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_b: $.data.id }
          trigger:
            - call: "POST /clearance/estimates/${est_a}/price"
              payload: {}
              as: FinancialCounselor
              captures: { err_a: $.data.error_id }
            - call: "POST /clearance/estimates/${est_b}/price"
              payload: {}
              as: FinancialCounselor
              captures: { allowed_b: $.data.allowed_amount_cents }
          assert:
            - "case A (service_date == effective_to): price rejected with ERR_RATE_NOT_FOUND, http 422 (end excluded)"
            - "case B (service_date 2026-08-19 inside window): allowed_amount_cents == 3000000"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: patient_create_missing_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role headers fail at priority 1 before any role or existence check (trigger sends no identity headers)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-V-1", full_name: "No Headers", date_of_birth: "1993-01-01" }
              captures: { err: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER when X-User-ID and X-User-Role are absent"

      - name: priced_gfe_present_after_deadline_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_GFE_DEADLINE_MISSED]", calculations.gfe_delivery_deadline]
        distinguishing_aspect: "The pure temporal trigger (estimate IS in PRICED, so only the deadline rule can fire): created 2026-08-03 for service 2026-08-20 (13 business days -> 3-business-day deadline 2026-08-06T23:59:59.999Z); presenting on 2026-08-07 violates it."
        test_recipe:
          setup: ["Charge 27447 list 5000000; patient with case (service 2026-08-20); GFE estimate created and PRICED at 2026-08-03; clock advanced to 2026-08-07T09:00:00Z"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-V-2", full_name: "Pat Late", date_of_birth: "1993-02-02" }
              as: Registrar
              captures: { pat_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee (self-pay)" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "UNINSURED_GFE", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id, deadline: $.data.gfe_delivery_deadline }
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /clearance/estimates/${est_id}/present"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "gfe_delivery_deadline == 2026-08-06T23:59:59.999Z (3 business days after creation for a >=10-business-day window)"
            - "error_id == ERR_GFE_DEADLINE_MISSED, http 409; Estimate.${est_id}.status remains PRICED"

      - name: price_with_stale_snapshot_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SNAPSHOT_STALE]"]
        distinguishing_aspect: "An INSURED price against a snapshot older than the 30-day TTL is rejected even though the snapshot was ACTIVE when the estimate was created."
        test_recipe:
          setup: ["Charge 27447; contract ACME rate 3000000; patient with snapshot verified 2026-08-03T09:00:00Z; case service 2026-09-25; DRAFT INSURED estimate; clock advanced to 2026-09-03T09:00:00Z and swept (snapshot STALE)"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "NONE" }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-V-3", full_name: "Pat StalePrice", date_of_birth: "1993-03-03" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-V3", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-09-25", service_description: "Knee" }
              as: Registrar
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_id: $.data.id }
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SNAPSHOT_STALE, http 409 (verified 2026-08-03T09:00:00Z + 30 days < 2026-09-03T09:00:00Z)"
            - "Estimate.${est_id}.status remains DRAFT"

      - name: price_without_contract_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_NO_ACTIVE_CONTRACT]"]
        distinguishing_aspect: "No PayerContract exists for the snapshot's payer_code; pricing cannot look up contracted rates."
        test_recipe:
          setup: ["Charge 27447; patient with snapshot for payer_code NOPE (no contract); case service 2026-08-20; DRAFT INSURED estimate"]
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Knee", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
