# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# International Student SEVIS Compliance
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: funding_provisional_vs_verified_gate
        grounds:
          - calculations.financial_coverage
          - entities.I20Form.fields.verified_funding_cents
          - entities.I20Form.fields.provisional_funding_cents
          - errors[ERR_INSUFFICIENT_VERIFIED_FUNDING]
        distinguishing_aspect: |
          Same document set, two variants on the fiscal domain (FinancialDocument ->
          I20Form): provisional counts SUBMITTED+VERIFIED (7,000,000 cents >= the
          6,500,000-cent form total) while verified counts only VERIFIED
          (5,000,000 < 6,500,000), so issuance is blocked until the second
          document is verified even though provisional coverage already suffices.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student with DRAFT record (program 2026-08-24..2027-05-31)"
            - "Doc A BANK_STATEMENT 5,000,000 cents issued 2026-07-01, VERIFIED"
            - "Doc B SPONSOR_AFFIDAVIT 2,000,000 cents issued 2026-07-15, still SUBMITTED"
            - "I-20 cost lines total 6,500,000 cents; provisional coverage 7,000,000; verified coverage 5,000,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 5000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "SPONSOR_AFFIDAVIT", amount_usd_cents: 2000000, issue_date: "2026-07-15" }, as: DSO, captures: { doc_b: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 4000000, living_cents: 1800000, insurance_cents: 400000, other_cents: 300000 }, as: DSO, captures: { i20_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO, captures: { err_issue: $.data.error_id } }
            - { call: "POST /sevis/financial-documents/${doc_b}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO, captures: { issued_status: $.data.status, issued_verified: $.data.verified_funding_cents, issued_provisional: $.data.provisional_funding_cents } }
          assert:
            - "first issue rejected with data.error_id == ERR_INSUFFICIENT_VERIFIED_FUNDING (HTTP 402)"
            - "after verifying doc B, issue succeeds: I20Form.${i20_id}.status == ISSUED"
            - "I20Form.${i20_id}.verified_funding_cents == 7000000"
            - "I20Form.${i20_id}.provisional_funding_cents == 7000000"

      - name: opt_unemployment_settled_vs_as_of
        grounds:
          - calculations.unemployment_days
          - entities.EmploymentAuthorization.fields.unemployment_days_settled
          - entities.EmploymentAuthorization.fields.unemployment_days_as_of
        distinguishing_aspect: |
          Same authorization, same empty employment history, same clock
          (2026-07-15): the settled_count variant (horizon yesterday) yields 44
          days while the as_of_projection variant (horizon today inclusive)
          yields 45 — a different entity domain (EmploymentAuthorization, not
          financial) and a one-day divergence on identical data.
        test_recipe:
          setup:
            - "Clock starts 2026-01-10; UG student; record program 2025-08-25..2026-05-31; verified funding 3,000,000; I-20 total 3,000,000; issued + INITIAL"
            - "Enrollment 2026-SPRING (2026-01-12..2026-05-08, 12 credits) registered 2026-01-10 -> record ACTIVE"
            - "OPT_POST authorization 2026-06-01..2027-05-31: RECOMMENDED, FILED at clock 2026-04-01, APPROVED; no employment periods"
            - "Clock advanced to 2026-07-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-10T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2025-08-25", program_end_date: "2026-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 3000000, issue_date: "2026-01-05" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1800000, living_cents: 900000, insurance_cents: 200000, other_cents: 100000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-SPRING", term_start_date: "2026-01-12", term_end_date: "2026-05-08", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "POST /sevis/employment-authorizations", payload: { student_id: "${stu_id}", auth_type: "OPT_POST", hours_per_week: 40, start_date: "2026-06-01", end_date: "2027-05-31" }, as: DSO, captures: { auth_id: $.data.id } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "RECOMMEND" }, as: DSO }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "FILE", uscis_receipt_number: "IOE1234567890" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "ADJUDICATE", outcome: "APPROVED" }, as: DSO }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: PDSO }
          trigger:
            - { call: "GET /sevis/employment-authorizations/${auth_id}", payload: {}, as: DSO, captures: { settled: $.data.unemployment_days_settled, as_of: $.data.unemployment_days_as_of } }
          assert:
            - "EmploymentAuthorization.${auth_id}.unemployment_days_settled == 44"
            - "EmploymentAuthorization.${auth_id}.unemployment_days_as_of == 45"
            - "as_of exceeds settled by exactly 1 (uncovered current day 2026-07-15)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rcl_academic_floor_multi_input
        grounds:
          - calculations.full_time_requirement
          - errors[ERR_RCL_CREDITS_OUT_OF_RANGE]
          - state_machines.ReducedCourseLoad.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): effective floor combines degree_level (UG -> base 12),
          reason_category (ACADEMIC -> max(3, floor(12/2)) = 6), and
          requested_credits through nested max/floor plus a conditional branch;
          requested 5 is rejected, requested 6 is approved, and registration at
          exactly 6 credits then passes.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student with INITIAL record (funded, I-20 issued)"
            - "Enrollment 2026-FALL (2026-08-24..2026-12-11) PENDING with 12 credits"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/reduced-course-loads", payload: { enrollment_id: "${enr_id}", reason_category: "ACADEMIC", requested_credits: 5 }, as: DSO, captures: { err_low: $.data.error_id } }
            - { call: "POST /sevis/reduced-course-loads", payload: { enrollment_id: "${enr_id}", reason_category: "ACADEMIC", requested_credits: 6 }, as: DSO, captures: { rcl_id: $.data.id } }
            - { call: "POST /sevis/reduced-course-loads/${rcl_id}/decision", payload: { decision: "APPROVED" }, as: DSO }
            - { call: "GET /sevis/term-enrollments/${enr_id}", payload: {}, as: DSO, captures: { eff_min: $.data.effective_min_credits } }
            - { call: "PATCH /sevis/term-enrollments/${enr_id}", payload: { enrolled_credits: 6 }, as: DSO }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO, captures: { reg_status: $.data.status } }
          assert:
            - "RCL with requested_credits 5 rejected: data.error_id == ERR_RCL_CREDITS_OUT_OF_RANGE (HTTP 422)"
            - "RCL with requested_credits 6 approved"
            - "TermEnrollment.${enr_id}.effective_min_credits == 6 (max(3, floor(12/2)))"
            - "register at exactly 6 credits succeeds: status == REGISTERED"

      - name: extension_proration_per_line_rounding
        grounds:
          - calculations.extension_prorated_costs
          - state_machines.ProgramExtension.REQUESTED_to_APPROVED
          - entities.I20Form.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-line-then-sum. With
          months_extended = 3 (76-day gap) and lines 100001/55557/33333/11113,
          per-line round_half_up gives 25000 + 13889 + 8333 + 2778 = 50000 cents,
          while sum-then-round would give 50001 — the scaffold's pinned order
          yields exactly 50000, one cent less; a different mode than the
          nested-branch RCL instance.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE (record 2026-08-24..2027-05-31, FALL enrollment registered)"
            - "I-20 ISSUED with lines tuition 100001, living 55557, insurance 33333, other 11113 (total 200004); verified funding 250000 cents issued 2026-07-01"
            - "ProgramExtension REQUESTED to 2027-08-15 (76 days -> 3 months by ceil(76/30))"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 250000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 100001, living_cents: 55557, insurance_cents: 33333, other_cents: 11113 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_v: "$.data[0].version" } }
            - { call: "POST /sevis/students/${stu_id}/program-extensions", payload: { new_program_end_date: "2027-08-15", reason: "Thesis completion", expected_sevis_record_version: "${rec_v}" }, as: DSO, captures: { ext_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/program-extensions/${ext_id}/decision", payload: { decision: "APPROVED" }, as: DSO }
            - { call: "GET /sevis/i20-forms?supersedes_i20_form_id=${i20_id}", payload: {}, as: DSO, captures: { new_tuition: "$.data[0].tuition_cents", new_living: "$.data[0].living_cents", new_insurance: "$.data[0].insurance_cents", new_other: "$.data[0].other_cents", new_total: "$.data[0].estimated_total_cents", new_status: "$.data[0].status" } }
            - { call: "GET /sevis/i20-forms/${i20_id}", payload: {}, as: DSO, captures: { old_status: $.data.status } }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_end: "$.data[0].program_end_date" } }
          assert:
            - "new I-20 tuition_cents == 25000 (round_half_up(100001*3/12) = round_half_up(25000.25))"
            - "new I-20 living_cents == 13889 (round_half_up(13889.25))"
            - "new I-20 insurance_cents == 8333 (round_half_up(8333.25))"
            - "new I-20 other_cents == 2778 (round_half_up(2778.25))"
            - "new I-20 estimated_total_cents == 50000 (per-line-then-sum; sum-then-round would be 50001)"
            - "new I-20 status == ISSUED; old I-20 ${i20_id} status == SUPERSEDED"
            - "SevisRecord.program_end_date == 2027-08-15"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: sevis_record_termination_reinstatement_cycle
        grounds:
          - state_machines.SevisRecord.ACTIVE_to_TERMINATED
          - state_machines.SevisRecord.TERMINATED_to_REINSTATEMENT_PENDING
          - state_machines.SevisRecord.REINSTATEMENT_PENDING_to_ACTIVE
          - state_machines.StatusViolation.OPEN_to_REINSTATEMENT_PENDING
        distinguishing_aspect: |
          Cyclic machine on SevisRecord: ACTIVE -> TERMINATED ->
          REINSTATEMENT_PENDING -> ACTIVE returns the record to a state it
          already occupied (a true loop, not a pipeline), driven through the
          linked StatusViolation machine.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE (standard funded setup, FALL enrollment registered)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
          trigger:
            - { call: "POST /sevis/sevis-records/${rec_id}/terminate", payload: { termination_reason: "Unauthorized employment" }, as: PDSO, captures: { rec_status_1: $.data.status } }
            - { call: "POST /sevis/students/${stu_id}/status-violations", payload: { violation_type: "UNAUTHORIZED_EMPLOYMENT", description: "Worked off campus without authorization" }, as: DSO, captures: { viol_id: $.data.id } }
            - { call: "POST /sevis/status-violations/${viol_id}/transition", payload: { action: "RECOMMEND_REINSTATEMENT" }, as: DSO, captures: { viol_status_1: $.data.status } }
            - { call: "POST /sevis/status-violations/${viol_id}/transition", payload: { action: "RESOLVE", outcome: "REINSTATED" }, as: PDSO, captures: { viol_status_2: $.data.status } }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_status_2: "$.data[0].status" } }
            - { call: "GET /sevis/students/${stu_id}", payload: {}, as: DSO, captures: { posture: $.data.compliance_posture } }
          assert:
            - "after terminate: SevisRecord.status == TERMINATED"
            - "after RECOMMEND_REINSTATEMENT: StatusViolation.${viol_id}.status == REINSTATEMENT_PENDING"
            - "after RESOLVE/REINSTATED: StatusViolation.${viol_id}.status == RESOLVED_REINSTATED"
            - "SevisRecord.status == ACTIVE again (cycle completed)"
            - "Student.${stu_id}.compliance_posture == CLEAR"

      - name: employment_authorization_recommend_revise_loop
        grounds:
          - state_machines.EmploymentAuthorization.DRAFT_to_RECOMMENDED
          - state_machines.EmploymentAuthorization.RECOMMENDED_to_DRAFT
          - state_machines.EmploymentAuthorization.RECOMMENDED_to_APPROVED
        distinguishing_aspect: |
          A->B->A revision loop on EmploymentAuthorization (a different entity
          than SevisRecord): DRAFT -> RECOMMENDED -> DRAFT -> RECOMMENDED ->
          APPROVED, with the CPT branch adjudicating directly from RECOMMENDED.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE; FALL enrollment registered (term 2026-08-24..2026-12-11)"
            - "CPT authorization DRAFT: employer Acme Corp, 20 hrs/wk, 2026-09-01..2026-12-11 (inside term window, end <= program_end 2027-05-31)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "POST /sevis/employment-authorizations", payload: { student_id: "${stu_id}", auth_type: "CPT", employer_name: "Acme Corp", hours_per_week: 20, start_date: "2026-09-01", end_date: "2026-12-11" }, as: DSO, captures: { auth_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "RECOMMEND" }, as: DSO, captures: { s1: $.data.status } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "REVISE" }, as: DSO, captures: { s2: $.data.status } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "RECOMMEND" }, as: DSO, captures: { s3: $.data.status } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "ADJUDICATE", outcome: "APPROVED" }, as: DSO, captures: { s4: $.data.status } }
          assert:
            - "first RECOMMEND -> RECOMMENDED"
            - "REVISE -> DRAFT (loop back to origin state)"
            - "second RECOMMEND -> RECOMMENDED again"
            - "ADJUDICATE APPROVED (CPT, from RECOMMENDED) -> APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: deadline_sweep_enrollment_violation_posture
        grounds:
          - state_machines.TermEnrollment.PENDING_to_NOT_ENROLLED
          - calculations.compliance_posture
          - entities.Student.fields.compliance_posture
        distinguishing_aspect: |
          Depth-3 chain triggered by the clock sweep: enrollment PENDING ->
          NOT_ENROLLED (link 1) itself opens a FAILURE_TO_ENROLL StatusViolation
          (link 2), and that violation creation recomputes
          Student.compliance_posture to VIOLATION_OPEN (link 3) — each link
          caused by the previous mutation, not by the clock directly.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student with INITIAL record; FALL enrollment PENDING 12 credits, never registered"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-24T00:00:00Z" }, as: PDSO }
            - { call: "GET /sevis/term-enrollments/${enr_id}", payload: {}, as: DSO, captures: { enr_status: $.data.status } }
            - { call: "GET /sevis/students/${stu_id}/status-violations", payload: {}, as: DSO, captures: { viol_type: "$.data[0].violation_type", viol_status: "$.data[0].status" } }
            - { call: "GET /sevis/students/${stu_id}", payload: {}, as: DSO, captures: { posture: $.data.compliance_posture } }
          assert:
            - "TermEnrollment.${enr_id}.status == NOT_ENROLLED (deadline sweep: 2026-09-24 > term_start 2026-08-24 + 30d)"
            - "exactly one StatusViolation exists with violation_type == FAILURE_TO_ENROLL and status == OPEN"
            - "Student.${stu_id}.compliance_posture == VIOLATION_OPEN"

      - name: extension_approval_supersede_voids_endorsements
        grounds:
          - state_machines.ProgramExtension.REQUESTED_to_APPROVED
          - state_machines.I20Form.ISSUED_to_SUPERSEDED
          - state_machines.TravelEndorsement.ACTIVE_to_VOIDED
          - calculations.extension_prorated_costs
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (extension decision, not the
          clock): approval supersedes the ISSUED I-20 (link 1) and that
          supersede itself voids the old form's ACTIVE travel endorsement
          (link 2), while auto-issuing the prorated replacement.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE; I-20 ISSUED (lines 1200000/600000/120000/60000); one ACTIVE travel endorsement (2026-12-12..2027-01-10)"
            - "ProgramExtension REQUESTED to 2027-06-30 (30 days -> 1 month; prorated total 165000 covered by verified 2000000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "GET /sevis/i20-forms/${i20_id}", payload: {}, as: DSO, captures: { i20_v: $.data.version } }
            - { call: "POST /sevis/i20-forms/${i20_id}/travel-endorsements", payload: { expected_i20_form_version: "${i20_v}", travel_departure_date: "2026-12-12", travel_return_date: "2027-01-10" }, as: DSO, captures: { end_id: $.data.id } }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_v: "$.data[0].version" } }
            - { call: "POST /sevis/students/${stu_id}/program-extensions", payload: { new_program_end_date: "2027-06-30", reason: "Research delay", expected_sevis_record_version: "${rec_v}" }, as: DSO, captures: { ext_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/program-extensions/${ext_id}/decision", payload: { decision: "APPROVED" }, as: DSO }
            - { call: "GET /sevis/i20-forms/${i20_id}", payload: {}, as: DSO, captures: { old_status: $.data.status } }
            - { call: "GET /sevis/i20-forms/${i20_id}/travel-endorsements", payload: {}, as: DSO, captures: { end_status: "$.data[0].status" } }
            - { call: "GET /sevis/i20-forms?supersedes_i20_form_id=${i20_id}", payload: {}, as: DSO, captures: { new_status: "$.data[0].status", new_end: "$.data[0].program_end_date" } }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_end: "$.data[0].program_end_date" } }
          assert:
            - "old I-20 ${i20_id}.status == SUPERSEDED"
            - "TravelEndorsement.${end_id}.status == VOIDED (supersede cascade, link 2)"
            - "replacement I-20 status == ISSUED with program_end_date == 2027-06-30"
            - "SevisRecord.program_end_date == 2027-06-30"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rcl_create_state_error_beats_temporal
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_ENROLLMENT_NOT_REGISTERABLE]
          - errors[ERR_RCL_ADD_DROP_CLOSED]
        distinguishing_aspect: |
          Pair state-vs-business_temporal: the enrollment is NOT_ENROLLED
          (state violation, priority 4) AND the request is past add/drop close
          (temporal violation, priority 7); the state error
          ERR_ENROLLMENT_NOT_REGISTERABLE must win.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student INITIAL; FALL enrollment PENDING 12 credits"
            - "Clock advanced to 2026-09-24: sweep flips enrollment to NOT_ENROLLED and opens a violation; both add/drop (term_start+14d = 2026-09-07) and registration (term_start+30d = 2026-09-23) deadlines have passed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-24T00:00:00Z" }, as: PDSO }
          trigger:
            - { call: "POST /sevis/reduced-course-loads", payload: { enrollment_id: "${enr_id}", reason_category: "ACADEMIC", requested_credits: 6 }, as: DSO, captures: { err: $.data.error_id } }
          assert:
            - "data.error_id == ERR_ENROLLMENT_NOT_REGISTERABLE (state priority 4 beats temporal priority 7)"
            - "data.error_id != ERR_RCL_ADD_DROP_CLOSED"

      - name: extension_approve_temporal_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_EXTENSION_WINDOW_CLOSED]
          - errors[ERR_INSUFFICIENT_VERIFIED_FUNDING]
        distinguishing_aspect: |
          Pair business_temporal-vs-business_fiscal: at approval the clock
          (2027-06-15) is past the current program_end_date (temporal,
          priority 7) AND the only verified document is stale under the 183-day
          freshness window making verified coverage 0 (fiscal, priority 8);
          ERR_EXTENSION_WINDOW_CLOSED must win.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE; extension to 2027-08-15 REQUESTED"
            - "Clock advanced to 2027-06-15 (> current program_end 2027-05-31; funding doc issued 2026-07-01 is 349 days old -> excluded from coverage)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_v: "$.data[0].version" } }
            - { call: "POST /sevis/students/${stu_id}/program-extensions", payload: { new_program_end_date: "2027-08-15", reason: "Thesis completion", expected_sevis_record_version: "${rec_v}" }, as: DSO, captures: { ext_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-15T00:00:00Z" }, as: PDSO }
          trigger:
            - { call: "POST /sevis/program-extensions/${ext_id}/decision", payload: { decision: "APPROVED" }, as: DSO, captures: { err: $.data.error_id } }
          assert:
            - "data.error_id == ERR_EXTENSION_WINDOW_CLOSED (temporal priority 7 beats fiscal priority 8)"
            - "data.error_id != ERR_INSUFFICIENT_VERIFIED_FUNDING"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: register_full_time_12_passes_11_fails
        grounds:
          - calculations.full_time_requirement
          - errors[ERR_BELOW_FULL_COURSE_LOAD]
          - state_machines.TermEnrollment.PENDING_to_REGISTERED
        distinguishing_aspect: |
          Credit-count metric at the register endpoint: the full-time boundary
          is inclusive (>=), so exactly 12 credits registers while 11 fails
          with ERR_BELOW_FULL_COURSE_LOAD.
        test_recipe:
          setup:
            - "Clock 2026-08-01; two UG students A and B, each with INITIAL record (funded, I-20 issued)"
            - "A: FALL enrollment 12 credits; B: FALL enrollment 11 credits (effective_min 12 for both)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_a: $.data.id } }
            - { call: "POST /sevis/students/${stu_a}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_a: $.data.id } }
            - { call: "POST /sevis/students/${stu_a}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_a}/i20-forms", payload: { sevis_record_id: "${rec_a}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_a: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_a}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_a}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_a}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_a: $.data.id } }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0087654321", full_name: "Li Wei", email: "li@example.edu", date_of_birth: "2001-09-02", country_of_citizenship: "CN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_b: $.data.id } }
            - { call: "POST /sevis/students/${stu_b}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_b: $.data.id } }
            - { call: "POST /sevis/students/${stu_b}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_b: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_b}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_b}/i20-forms", payload: { sevis_record_id: "${rec_b}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_b: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_b}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_b}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_b}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 11 }, as: DSO, captures: { enr_b: $.data.id } }
          trigger:
            - { call: "POST /sevis/term-enrollments/${enr_a}/register", payload: {}, as: DSO, captures: { reg_a: $.data.status } }
            - { call: "POST /sevis/term-enrollments/${enr_b}/register", payload: {}, as: DSO, captures: { err_b: $.data.error_id } }
          assert:
            - "student A at exactly 12 credits: register succeeds, status == REGISTERED"
            - "student B at 11 credits: data.error_id == ERR_BELOW_FULL_COURSE_LOAD (HTTP 422)"

      - name: unemployment_day_90_safe_91_violates
        grounds:
          - calculations.unemployment_days
          - constants.UNEMPLOYMENT_LIMIT_DAYS
          - entities.StatusViolation.fields.violation_type
        distinguishing_aspect: |
          Day-count metric via the clock endpoint (not the credit metric at
          register): the sweep opens UNEMPLOYMENT_LIMIT_EXCEEDED only when
          settled days > 90, so day 90 is clean and day 91 violates.
        test_recipe:
          setup:
            - "UG student ACTIVE; OPT_POST APPROVED 2026-12-19..2027-12-18 (program ends 2026-12-18); no employment periods"
            - "2026-12-19 + 90 elapsed days -> settled horizon 2027-03-18 at clock 2027-03-19; day 91 settles at clock 2027-03-20"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2025-08-25", program_end_date: "2026-12-18" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
