              as: FranchisorAdmin
              captures: { agH_id: $.data.id }
            - call: "POST /franchise/agreements/${agH_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stH_id}", franchisee_id: "${fH_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stH_v}" }
              as: FranchisorAdmin
              captures: { setH_id: $.data.id, setH_v1: $.data.version }
            - call: "POST /franchise/settlements/${setH_id}/revenue-lines"
              payload: { category: "SERVICES", gross_sales_cents: 1000000, cost_of_goods_cents: 700000, expected_settlement_version: "${setH_v1}" }
              as: FranchisorAdmin
            - call: "POST /franchise/draws"
              payload: { franchisee_id: "${fH_id}", store_id: "${stH_id}", amount_cents: 600000, drawn_on: "2026-09-02T00:00:00Z" }
              as: FranchisorAdmin
              captures: { drH_id: $.data.id }
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stH_id}", commissary_code: "COMM-LA-1", day_of_week: "WED", window_start: "2026-09-09T06:00:00Z", window_end: "2026-09-09T10:00:00Z", capacity_units: 800 }
              as: FranchisorAdmin
