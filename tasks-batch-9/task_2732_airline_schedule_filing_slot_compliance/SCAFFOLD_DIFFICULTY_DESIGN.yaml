  # =====================================================================
  # RULE 6 — boundary_precision_check
  # I1 metric = required_turn_minutes (integer minutes, inclusive minimum)
  #     endpoint POST /flight-legs/{flight_leg_id}/assign-aircraft
  # I2 metric = utilization_pct_as_filed (2-dp percentage, empty-set zero)
  #     endpoint POST /flight-legs/{flight_leg_id}/attach-slot
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: turn_time_boundary_is_inclusive_at_exactly_required_turn_minutes
        grounds:
          - calculations.rotation_feasibility_evaluation
          - "validations.priority_52_ERR_TURN_TIME_VIOLATION"
          - endpoints.GET_aircraft_rotation_feasibility
        distinguishing_aspect: |
          Metric under test is required_turn_minutes on a domestic turn, where required_turn_minutes ==
          max(aircraft.min_turn_minutes 45, dest_station.min_turn_override_minutes 0) + 0 == 45. The
          same aircraft is assigned at ground time 44 (reject), 45 (accept) and 46 (still accept),
          proving the comparison is ground_minutes >= required_turn_minutes and not a strict >. An
          off-by-one implementation rejects the 45-minute turn.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); MUC LEVEL_2_FACILITATED gate_count 3 utc_offset_minutes 120 min_turn_override_minutes 0; TXL LEVEL_2_FACILITATED gate_count 2 utc_offset_minutes 120 min_turn_override_minutes 0 curfew_start_local_minutes 1380 curfew_end_local_minutes 330."
            - "Season W26 OPEN; ScheduleVersion W26-T6 in DRAFT."
            - "Aircraft D-AHXT with min_turn_minutes 45, max_daily_block_minutes 600, required_check_minutes 240, maintenance_check_required false, status IN_SERVICE."
            - "Leg A MUC->TXL 2026-11-03T08:00:00Z -> 09:00:00Z is already ASSIGNED to D-AHXT."
            - "Leg B TXL->MUC is created DRAFT with dep_utc 2026-11-03T09:44:00Z -> arr 10:44:00Z, i.e. 44 ground minutes at TXL, one minute short."
            - "Both legs are domestic DE->DE so is_international is false and INTERNATIONAL_TURN_BUMP_MINUTES is not added; TXL is not coordinated so no slot is required."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, min_turn_override_minutes: 0, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, min_turn_override_minutes: 0, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXT", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false, status: "IN_SERVICE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-T6" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX310", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { legA_id: "$.data.id" }
            - call: "POST /flight-legs/${legA_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX311", origin_station_id: "${txl_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T09:44:00Z", arr_utc: "2026-11-03T10:44:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { legB_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs/${legB_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "PATCH /flight-legs/${legB_id}"
              payload: { dep_utc: "2026-11-03T09:45:00Z", arr_utc: "2026-11-03T10:45:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${legB_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "PATCH /flight-legs/${legB_id}"
              payload: { dep_utc: "2026-11-03T09:46:00Z", arr_utc: "2026-11-03T10:46:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 at 44 ground minutes (required 45) -> HTTP 422 with error_id == \"ERR_TURN_TIME_VIOLATION\"; FlightLeg.${legB_id}.status == DRAFT and assigned_aircraft_id == null"
            - "after trigger call 1, GET /aircraft/${ac_id}/rotation-feasibility returns rotation_feasibility_status == \"FEASIBLE\", ordered_leg_ids == [\"${legA_id}\"], total_block_minutes == 60 — the rejected assignment left the rotation untouched"
            - "trigger call 3 at exactly 45 ground minutes -> HTTP 200; FlightLeg.${legB_id}.status == SLOT_BACKED (TXL and MUC are not LEVEL_3_COORDINATED so required_slot_set is empty and ASSIGNED auto-advances) and assigned_aircraft_id == ${ac_id}"
            - "after trigger call 3, GET /aircraft/${ac_id}/rotation-feasibility returns rotation_feasibility_status == \"FEASIBLE\", required_turn_minutes == 45, total_block_minutes == 120, first_violation_leg_id == null, ordered_leg_ids == [\"${legA_id}\", \"${legB_id}\"]"
            - "after trigger call 4 at 46 ground minutes, Aircraft.${ac_id}.rotation_feasibility_status == FEASIBLE and Aircraft.${ac_id}.assigned_leg_count == 2 — the safe side of the boundary stays safe"
            - "Aircraft.${ac_id}.cumulative_ground_minutes == 46 and maintenance_opportunity_minutes == 0 after trigger call 4, because TXL has maintenance_capable false so its ground interval is discarded by the contiguous_window variant"
            - "ScheduleVersion.${sv_id}.unslotted_leg_count == 0 and schedule_compliance_score == 100.00"

      - name: at_risk_of_loss_stays_false_at_zero_attached_operations_and_flips_at_one
        grounds:
          - calculations.slot_utilization_credit
          - calculations.schedule_compliance_score
          - entities.SlotHolding.fields.at_risk_of_loss
        distinguishing_aspect: |
          A different metric on a different endpoint from instance 1 — the 2-dp percentage
          utilization_pct_as_filed at the empty-collection boundary. A brand-new holding has
          attached_operations 0 and utilization_pct_as_filed 0.00, which is far BELOW
          UTILIZATION_THRESHOLD_PCT 80.0, yet at_risk_of_loss must be false because the guard also
          requires attached_operations >= 1. Attaching a single leg moves the count 0 -> 1 and flips
          at_risk_of_loss to true at 20.00. A naive "pct < 80 => at risk" implementation marks every
          empty holding at risk and blocks every fresh schedule.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED gate_count 2; MUC LEVEL_2_FACILITATED gate_count 3; Season W26 OPEN."
            - "Aircraft D-AHXA IN_SERVICE; ScheduleVersion W26-Z1 in DRAFT."
            - "One FRA DEPARTURE holding at 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5 -> planned_operations 5, attached_operations 0."
            - "One FRA->MUC leg on 2026-11-02 08:00Z->09:00Z already ASSIGNED to D-AHXA but NOT yet slot-attached."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${fra_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac1_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-Z1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs/${leg1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "GET /slot-holdings/${sh_id}"
              payload: {}
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /flight-legs/${leg1_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 (zero boundary) -> SlotHolding.${sh_id}.planned_operations == 5, attached_operations == 0, utilization_pct_as_filed == 0.00, utilization_pct == 0.00, credited_operations == 0 and at_risk_of_loss == false"
            - "before trigger call 2, ScheduleVersion.${sv_id}.at_risk_slot_count == 0, unslotted_leg_count == 1, schedule_compliance_score == 92.00 and compliance_state == CLEAN"
            - "trigger call 2 (one boundary) -> SlotHolding.${sh_id}.attached_operations == 1 and utilization_pct_as_filed == 20.00 exactly, with at_risk_of_loss now true"
            - "after trigger call 2, FlightLeg.${leg1_id}.status == SLOT_BACKED, ScheduleVersion.${sv_id}.unslotted_leg_count == 0, at_risk_slot_count == 1, schedule_compliance_score == 85.00 and compliance_state == BLOCKED (BLOCK is forced by at_risk_slot_count >= 1 even though 85.00 is not below WARN_THRESHOLD 85.0)"
            - "SlotHolding.${sh_id}.utilization_pct == 0.00 still, because the as_operated variant reads credited_operations and no SlotUtilizationRecord exists"

  # =====================================================================
  # RULE 7 — cross_entity_state_dependency
  # Entity pairs: I1 (FlightLeg, Aircraft) — I2 (SlotHolding, Season).
  # Each instance shows the SAME operation succeeding and failing purely
  # because of the OTHER entity's state.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: leg_assignment_is_gated_by_the_aircraft_status_dimension
        grounds:
          - state_machines.FlightLeg.DRAFT_to_ASSIGNED
          - "validations.priority_48_ERR_AIRCRAFT_NOT_IN_SERVICE"
          - entities.Aircraft.fields.status
        distinguishing_aspect: |
          Entity pair is (FlightLeg, Aircraft): one identical POST assign-aircraft body differing only
          in which Aircraft it names. D-AHXG is MAINTENANCE_GROUNDED and is rejected with
          ERR_AIRCRAFT_NOT_IN_SERVICE (422) even though fleet_type_code, carrier and rotation geometry
          are all perfectly valid; D-AHXA is IN_SERVICE with the identical fleet type and the identical
          leg and is accepted. The leg's own state is DRAFT in both calls, so only the foreign entity's
          state can explain the difference.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); MUC gate_count 3; TXL gate_count 2; Season W26 OPEN; ScheduleVersion W26-X1 in DRAFT."
            - "Aircraft D-AHXG created with status MAINTENANCE_GROUNDED, fleet_type_code B738, carrier HX."
            - "Aircraft D-AHXA created with status IN_SERVICE, fleet_type_code B738, carrier HX, identical min_turn_minutes and caps."
            - "One MUC->TXL leg on 2026-11-03 08:00Z->09:00Z in DRAFT with no aircraft assigned."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXG", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false, status: "MAINTENANCE_GROUNDED" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { grounded_ac_id: "$.data.id" }
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false, status: "IN_SERVICE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { live_ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-X1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs/${leg_id}/assign-aircraft"
              payload: { aircraft_id: "${grounded_ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg_id}/assign-aircraft"
              payload: { aircraft_id: "${live_ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 -> HTTP 422 with error_id == \"ERR_AIRCRAFT_NOT_IN_SERVICE\"; FlightLeg.${leg_id}.status == DRAFT and assigned_aircraft_id == null"
            - "Aircraft.${grounded_ac_id}.assigned_leg_count == 0 and rotation_feasibility_status == UNCHECKED after the rejection"
            - "trigger call 2 -> HTTP 200; FlightLeg.${leg_id}.assigned_aircraft_id == ${live_ac_id} and status == SLOT_BACKED (neither MUC nor TXL is LEVEL_3_COORDINATED, so ASSIGNED auto-advances)"
            - "Aircraft.${live_ac_id}.assigned_leg_count == 1 and rotation_feasibility_status == FEASIBLE"
            - "ScheduleVersion.${sv_id}.leg_count == 1, unslotted_leg_count == 0, schedule_compliance_score == 100.00, compliance_state == CLEAN"

      - name: slot_return_is_gated_by_the_owning_season_status
        grounds:
          - state_machines.SlotHolding.HELD_to_RETURNED
          - state_machines.Season.OPEN_to_CLOSED
          - "validations.priority_26_ERR_SEASON_NOT_OPEN"
        distinguishing_aspect: |
          A different entity pair from instance 1 — (SlotHolding, Season). Two sibling holdings in the
          same season at different slot times are returned by the same user under the same clock, which
          is BEFORE slot_return_deadline_utc so the temporal rule never fires. The first return, while
          the Season is OPEN, succeeds and is the only exit that sets retains_historic_precedence true;
          the second, after the Season moves to CLOSED, is rejected with ERR_SEASON_NOT_OPEN. The
          holdings themselves are in identical HELD state, so only the parent Season's state differs.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z, which is BEFORE slot_return_deadline_utc 2026-09-15T23:59:59Z."
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED gate_count 2; Season W26 transitioned to OPEN."
            - "Two FRA DEPARTURE holdings held by HX, historic_precedence true, at 2026-11-02T08:00:00Z and 2026-11-02T09:00:00Z, days_of_week \"1\", series_weeks 5 — different slot times so no series conflict."
            - "Neither holding has a pending_transaction_id or any attached leg."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: true }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh1_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T09:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: true }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh2_id: "$.data.id" }
          trigger:
            - call: "POST /slot-holdings/${sh1_id}/return"
              payload: { reason: "SEASONAL_RIGHTSIZING" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "CLOSED" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings/${sh2_id}/return"
              payload: { reason: "SEASONAL_RIGHTSIZING" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 (Season OPEN) -> HTTP 200; SlotHolding.${sh1_id}.holding_status == RETURNED, returned_reason == \"SEASONAL_RIGHTSIZING\", returned_before_deadline == true and retains_historic_precedence == true"
            - "trigger call 3 (Season CLOSED, identical payload and clock) -> HTTP 409 with error_id == \"ERR_SEASON_NOT_OPEN\"; SlotHolding.${sh2_id}.holding_status == HELD with returned_reason == null and retains_historic_precedence == null"
            - "Season.${season_id}.status == CLOSED and Season.${season_id}.held_series_count == 1 (only ${sh2_id} is still HELD)"
            - "Carrier.${home_carrier_id}.held_series_count == 1"
            - "SlotHolding.${sh1_id}.historic_precedence == true is preserved and its attached_operations == 0, utilization_pct_as_filed == 0.00, at_risk_of_loss == false"

  # =====================================================================
  # RULE 8 — resource_temporal_overlap
  # Three DIFFERENT interval semantics on three DIFFERENT resource entities:
  #   I1 Aircraft    — buffered point-adjacency (gap between arr and next dep,
  #                    buffer width depends on the inbound leg)
  #   I2 Station     — half-open [start, end) aggregate occupancy vs capacity
  #   I3 SlotHolding — discrete recurring day-of-week set intersection
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: aircraft_turn_buffer_widens_for_international_inbound_at_the_same_point_adjacency
        grounds:
          - calculations.rotation_feasibility_evaluation
          - "validations.priority_52_ERR_TURN_TIME_VIOLATION"
          - entities.FlightLeg.fields.is_international
        distinguishing_aspect: |
          Resource is the Aircraft and the interval semantics are buffered point-adjacency: consecutive
          legs may not overlap AND must be separated by required_turn_minutes, whose width is
          max(min_turn_minutes 45, min_turn_override_minutes 0) + INTERNATIONAL_TURN_BUMP_MINUTES 15 == 60
          because the INBOUND leg is international. The exact same 45-minute ground time that is legal
          on a domestic turn (rule 6 instance 1) is now illegal, which is what separates this instance
          from the domestic boundary case: the buffer is a function of the previous leg, not a constant.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); MUC LEVEL_2_FACILITATED gate_count 3 utc_offset_minutes 120; LIS LEVEL_2_FACILITATED gate_count 2 utc_offset_minutes 0 curfew_start_local_minutes 1380 curfew_end_local_minutes 330 min_turn_override_minutes 0."
            - "RouteAuthority DE->PT and RouteAuthority PT->DE, both THIRD_FOURTH with weekly_frequency_cap 14, granted 2026-01-01T00:00:00Z -> 2027-12-31T23:59:59Z, status ACTIVE."
            - "Season W26 OPEN; ScheduleVersion W26-R8 in DRAFT."
            - "Aircraft D-AHXI min_turn_minutes 45, max_daily_block_minutes 600, required_check_minutes 240."
            - "Leg A MUC->LIS 2026-11-03T09:30:00Z -> 12:00:00Z (is_international true, block_minutes 150) already assigned to D-AHXI."
            - "Leg B LIS->MUC created DRAFT with dep_utc 2026-11-03T12:45:00Z -> 15:15:00Z, i.e. 45 ground minutes at LIS — enough for a domestic turn but 15 short of the international requirement."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, min_turn_override_minutes: 0, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "LIS", country_code: "PT", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 0, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, min_turn_override_minutes: 0, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { lis_id: "$.data.id" }
            - call: "POST /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", origin_country_code: "DE", dest_country_code: "PT", freedom_type: "THIRD_FOURTH", weekly_frequency_cap: 14, granted_from_utc: "2026-01-01T00:00:00Z", granted_until_utc: "2027-12-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { ra_out_id: "$.data.id" }
            - call: "POST /route-authorities"
              payload: { carrier_id: "${home_carrier_id}", origin_country_code: "PT", dest_country_code: "DE", freedom_type: "THIRD_FOURTH", weekly_frequency_cap: 14, granted_from_utc: "2026-01-01T00:00:00Z", granted_until_utc: "2027-12-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { ra_in_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXI", fleet_type_code: "A320", seats: 180, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-R8" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX440", origin_station_id: "${muc_id}", dest_station_id: "${lis_id}", dep_utc: "2026-11-03T09:30:00Z", arr_utc: "2026-11-03T12:00:00Z", fleet_type_code: "A320" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { legA_id: "$.data.id" }
            - call: "POST /flight-legs/${legA_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX441", origin_station_id: "${lis_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T12:45:00Z", arr_utc: "2026-11-03T15:15:00Z", fleet_type_code: "A320" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { legB_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs/${legB_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "PATCH /flight-legs/${legB_id}"
              payload: { dep_utc: "2026-11-03T13:00:00Z", arr_utc: "2026-11-03T15:30:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${legB_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "FlightLeg.${legA_id}.is_international == true and block_minutes == 150; FlightLeg.${legB_id}.is_international == true"
            - "trigger call 1 at 45 ground minutes -> HTTP 422 with error_id == \"ERR_TURN_TIME_VIOLATION\" because required_turn_minutes == 60 (45 + INTERNATIONAL_TURN_BUMP_MINUTES 15); FlightLeg.${legB_id}.status == DRAFT"
            - "trigger call 3 at exactly 60 ground minutes -> HTTP 200; FlightLeg.${legB_id}.assigned_aircraft_id == ${ac_id} and status == SLOT_BACKED"
            - "GET /aircraft/${ac_id}/rotation-feasibility after trigger call 3 returns rotation_feasibility_status == \"FEASIBLE\", required_turn_minutes == 60, total_block_minutes == 300, first_violation_leg_id == null"
            - "Aircraft.${ac_id}.maintenance_opportunity_minutes == 0 and cumulative_ground_minutes == 0, because LIS has maintenance_capable false so the 60-minute LIS ground interval is discarded and MUC has no bracketing pair on 2026-11-03"
            - "no ERR_ROUTE_AUTHORITY_MISSING is raised for either direction because both RouteAuthority rows are ACTIVE and weekly_frequency_cap 14 is not reached"

      - name: station_gate_occupancy_intervals_are_half_open_so_touching_endpoints_do_not_overlap
        grounds:
          - calculations.gate_occupancy_load
          - "validations.priority_56_ERR_GATE_CAPACITY_EXCEEDED"
          - entities.ScheduleVersion.fields.gate_overflow_count
        distinguishing_aspect: |
          A different resource (Station) with different interval semantics: aggregate half-open
          occupancy. A departure occupies [dep - GATE_PREP_MINUTES 45, dep) and an arrival occupies
          [arr, arr + GATE_RELEASE_MINUTES 30); a 08:45 departure occupying [08:00, 08:45) does NOT
          collide with an 08:00 departure occupying [07:15, 08:00) even though the endpoints touch,
          while a 08:40 departure occupying [07:55, 08:40) pushes the peak to 3 against gate_count 2.
          The instance also pins the POST/PATCH asymmetry: POST rejects with 409 whereas PATCH accepts
          and records gate_overflow_count instead.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED gate_count 2 with no curfew configured; MUC LEVEL_2_FACILITATED gate_count 3; Season W26 OPEN; ScheduleVersion W26-G8 in DRAFT."
            - "No aircraft is assigned and no slot is attached, so rotation, turn and slot rules are all silent and gate capacity is the only binding constraint."
            - "Two FRA->MUC departures on 2026-11-04 already exist at 08:00:00Z (gate interval [07:15, 08:00)) and 08:20:00Z (gate interval [07:35, 08:20)); FRA peak occupancy is 2, exactly gate_count."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-G8" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX501", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-04T08:00:00Z", arr_utc: "2026-11-04T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX502", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-04T08:20:00Z", arr_utc: "2026-11-04T09:20:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX503", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-04T08:40:00Z", arr_utc: "2026-11-04T09:40:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX504", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-04T08:45:00Z", arr_utc: "2026-11-04T09:45:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg4_id: "$.data.id" }
            - call: "PATCH /flight-legs/${leg4_id}"
              payload: { dep_utc: "2026-11-04T08:40:00Z", arr_utc: "2026-11-04T09:40:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 (08:40 departure, gate interval [07:55, 08:40)) -> HTTP 409 with error_id == \"ERR_GATE_CAPACITY_EXCEEDED\", because at 07:55 all three intervals are live and peak 3 > gate_count 2"
            - "after trigger call 1, ScheduleVersion.${sv_id}.leg_count == 2 and gate_overflow_count == 0 — the rejected POST created nothing"
            - "trigger call 2 (08:45 departure, gate interval [08:00, 08:45)) -> HTTP 201, because the half-open interval excludes 08:00 and therefore does not overlap ${leg1_id}'s [07:15, 08:00); the live peak is 2 at 08:00 and 2 at 08:15"
            - "after trigger call 2, ScheduleVersion.${sv_id}.leg_count == 3, gate_overflow_count == 0, unslotted_leg_count == 3, schedule_compliance_score == 76.00 and compliance_state == WARNED (3 unslotted legs at W_UNSLOTTED 8.0 each)"
            - "trigger call 3 (PATCH the accepted leg onto the rejected 08:40 time) -> HTTP 200, NOT 409; FlightLeg.${leg4_id}.dep_utc == \"2026-11-04T08:40:00Z\""
            - "after trigger call 3, ScheduleVersion.${sv_id}.gate_overflow_count == 1 and schedule_compliance_score == 67.00 with compliance_state == WARNED — PATCH records the overflow instead of refusing it, which is the documented POST/PATCH asymmetry"
            - "MUC never overflows: arrival intervals [09:00, 09:30), [09:20, 09:50) and [09:40, 10:10) reach peak 2 against gate_count 3"

      - name: slot_series_day_of_week_masks_conflict_only_on_set_intersection
        grounds:
          - "validations.priority_63_ERR_SLOT_SERIES_CONFLICT"
          - entities.SlotHolding.fields.days_of_week
          - endpoints.POST_slot_holdings
        distinguishing_aspect: |
          A third resource (SlotHolding) with genuinely discrete, non-contiguous interval semantics: the
          resource is the (station, season, movement_type, slot_time_utc) runway coordinate and the
          "interval" is a recurring day-of-week SET, so two series collide if and only if their masks
          intersect. Mask "135" and mask "246" are disjoint and both coexist at the identical
          slot_time_utc, while mask "57" collides on day 5 alone and mask "7" is accepted. An
          implementation that treats the mask as a numeric range, a string prefix or a plain equality
          check gets at least one of these four calls wrong.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE) and counterparty PT (PT); FRA LEVEL_3_COORDINATED gate_count 2; Season W26 OPEN."
            - "One existing FRA DEPARTURE holding at 2026-11-02T08:00:00Z with days_of_week \"135\" and series_weeks 5, held by HX."
            - "All later holdings use the identical station, season, movement_type and slot_time_utc, so days_of_week is the only discriminator."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /carriers"
              payload: { iata_code: "PT", icao_code: "PTA", country_code: "PT", is_home_carrier: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { partner_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "135", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
