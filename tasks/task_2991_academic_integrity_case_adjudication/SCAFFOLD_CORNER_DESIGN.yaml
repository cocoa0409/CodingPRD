            - "Case.${case_id}.notation_status is still POSTED after the refusal - the request never reached EXPUNGEMENT_REQUESTED"
            - "the identical request ten years later returns the SAME HTTP 409 with data.error_id == ERR_NOTATION_NOT_EXPUNGEABLE: the refusal is unconditional in time, which is what distinguishes it from ERR_EXPUNGEMENT_TOO_EARLY"

      - name: every_authentication_failure_mode_returns_unauthenticated_before_any_other_check
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: |
          Priorities 1 and 2 are 401s that pre-empt every 403, 404 and 409 below them. An absent
          X-User-Role header, a header present with the empty string "", a syntactically valid but
          unknown role name, an entity-backed role whose X-User-ID is absent, and an entity-backed role
          whose X-User-ID resolves to the WRONG backing entity (a Student header carrying a
          FacultyMember id) are all ERR_UNAUTHENTICATED - notably the unknown role is a 401, not the 403
          it superficially resembles. The three opaque roles (IntegrityOfficer, AppealsDean,
          RegistrarOfficer) are exempt from id resolution, so an officer id that matches no row at all
          still authenticates.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one department, one faculty member Rita, one student Sam"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_id: $.data.id }
          trigger:
            - call: "GET /integrity/departments"
              as: "<X-User-Role header omitted entirely>"
              captures: { err_role_header_absent: $.data.error_id }
            - call: "GET /integrity/departments"
              as: ""
              captures: { err_role_header_empty: $.data.error_id }
            - call: "GET /integrity/departments"
              as: "Provost"
              captures: { err_role_unknown: $.data.error_id }
            - call: "GET /integrity/reports"
              as: FacultyReporter
              as_user_id: "<X-User-ID header omitted entirely>"
              captures: { err_backed_role_no_id: $.data.error_id }
            - call: "GET /integrity/reports"
              as: FacultyReporter
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err_backed_role_unresolvable_id: $.data.error_id }
            - call: "GET /integrity/students/${student_id}"
              as: Student
              as_user_id: "${reporter_id}"
              captures: { err_wrong_backing_entity: $.data.error_id }
            - call: "GET /integrity/departments/00000000-0000-4000-8000-000000000000"
              as: "Provost"
              captures: { err_unknown_role_beats_not_found: $.data.error_id }
            - call: "GET /integrity/departments"
              as: IntegrityOfficer
              as_user_id: "00000000-0000-4000-8000-000000000000"
            - call: "GET /integrity/students/${student_id}"
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "the request with no X-User-Role returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the request with X-User-Role: \"\" (the empty string, not a whitespace-padded value) returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the request with X-User-Role: Provost returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, NOT ERR_ROLE_NOT_PERMITTED - an unrecognised role never reaches priority 3"
            - "FacultyReporter with no X-User-ID returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "FacultyReporter with an X-User-ID that resolves to no FacultyMember returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "Student with X-User-ID == ${reporter_id} returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED - the id exists but not as a Student row, so the backing entity is wrong"
            - "X-User-Role: Provost against a non-existent department id returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not 404 ERR_DEPARTMENT_NOT_FOUND - priority 2 pre-empts the lookup"
            - "IntegrityOfficer with an X-User-ID matching no row returns HTTP 200 with total_count == 1 - the officer role is opaque and its id is never resolved"
            - "Student ${student_id} reading its own row returns HTTP 200 with data.id == ${student_id}"
            - "no request in this recipe created or modified a row: GET /integrity/students returns total_count == 1 and GET /integrity/faculty-members returns total_count == 1"

  - section: rbac
    instances:
      - name: exclusive_operations_are_closed_to_other_roles_and_ownership_is_checked_after_the_role
        claim_type: Segregation of duties
        grounds:
          - roles.IntegrityOfficer
          - roles.FacultyReporter
          - roles.PanelChair
          - roles.Student
          - roles.AppealsDean
          - roles.RegistrarOfficer
          - validations[priority=3]
          - validations[priority=4]
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          The ladder is role first (priority 3, 403 ERR_ROLE_NOT_PERMITTED) then ownership (priority 4,
          403 ERR_NOT_RESOURCE_OWNER), and the two are distinguishable by holding one fixed while varying
          the other: an IntegrityOfficer filing an appeal is a ROLE failure, whereas a second Student
          filing an appeal on someone else's case is an OWNERSHIP failure on the very same endpoint. The
          separation of duties is total in both directions - the office cannot vote or decide a hearing,
          the chair cannot propose a sanction, the dean cannot create or impose one (a reduced sanction
          can only appear as a side effect of the SANCTION_REDUCED outcome), the registrar cannot dismiss
          a case, and no role but the registrar may post a notation - and both 403s leave the store
          untouched.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, chair Cora trained, pan1/pan2/pan3, ROOM-A"
