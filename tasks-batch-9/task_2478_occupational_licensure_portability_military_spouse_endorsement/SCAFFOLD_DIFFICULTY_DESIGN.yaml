      - name: discipline_finding_gated_on_assigned_review_assignment_of_calling_evaluator
        grounds:
          - validations.priority_18_ERR_NO_OPEN_REVIEW_ASSIGNMENT
          - state_machines.CredentialEvaluation.discipline_review_status
          - entities.ReviewAssignment.fields.status
          - entities.CredentialEvaluation.fields.databases_checked
        distinguishing_aspect: |
          A different cross-entity pairing from the sibling instance: the writable dimension of
          CredentialEvaluation is gated on whether a ReviewAssignment row exists in state ASSIGNED for
          *the calling evaluator*, not on the evaluation's own fields. Two equally ACTIVE, correctly
          professioned evaluators diverge purely on assignment state, and the accepted ADVERSE finding
          does not by itself suspend the application.
        test_recipe:
          setup:
            - "Profession RN; non-military applicant with an ENDORSEMENT application submitted."
            - "A CredentialEvaluation exists (application is UNDER_REVIEW) with both review dimensions PENDING."
            - "Evaluator 1 is ACTIVE for RN and holds one ASSIGNED ReviewAssignment on that application."
