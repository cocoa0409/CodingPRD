  - method: GET
    path: "/policies/{policyId}"
    description: "Get a RenewalPolicy"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: []
    output: RenewalPolicy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "List RenewalPolicies"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: ["product_id?", "wave_id?", "state_code?", "status?", "limit?", "offset?"]
    output: "RenewalPolicy[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/send-notice"
    description: "Send the policyholder renewal notice"
    roles: [ImplementationLead]
    code: 200
    input: []
    output: RenewalPolicy
    side_effects: ["status RATED -> NOTICE_SENT; RENEWAL_NOTICE_DUE entry MET (ERR_NOTICE_DEADLINE_PASSED if past notice_due_date)"]

  - method: POST
    path: "/policies/{policyId}/complete-renewal"
    description: "Bind the renewal at its effective date"
    roles: [ImplementationLead]
    code: 200
    input: []
    output: RenewalPolicy
    side_effects: ["status NOTICE_SENT -> COMPLETED; current_premium_cents = final_premium_cents"]

  # --- ComplianceCalendarEntry ---
  - method: GET
    path: "/calendar-entries/{entryId}"
    description: "Get a ComplianceCalendarEntry"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: []
    output: ComplianceCalendarEntry
    side_effects: []

  - method: GET
    path: "/calendar-entries"
    description: "List ComplianceCalendarEntries"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: ["filing_id?", "wave_id?", "objection_id?", "entry_type?", "status?", "limit?", "offset?"]
    output: "ComplianceCalendarEntry[]"
    side_effects: []

  - method: POST
    path: "/calendar-entries/{entryId}/waive"
    description: "Waive a pending calendar obligation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceCalendarEntry
    side_effects: ["status PENDING -> WAIVED; resolved_at set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, unknown field, wrong type, invalid enum member, non-positive amounts, bad date format" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in a state from which the requested transition does not exist" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breached: indication approver equals prepared_by_user_id" }
  - { id: ERR_PROFILE_INACTIVE, http: 409, condition: "StateRegulatoryProfile is SUSPENDED (or absent-but-required ACTIVE) for the operation" }
  - { id: ERR_INDICATION_NOT_LOCKED, http: 409, condition: "Referenced indication is not LOCKED (DRAFT, IN_ACTUARIAL_REVIEW, APPROVED, or SUPERSEDED)" }
  - { id: ERR_DEVIATION_NOT_USABLE, http: 409, condition: "An attached deviation is WITHDRAWN or REJECTED at submit time" }
  - { id: ERR_COMPONENT_INCOMPLETE, http: 409, condition: "mark-ready without the required FINAL component set for the filing_type" }
  - { id: ERR_DUPLICATE_PROFILE, http: 409, condition: "A StateRegulatoryProfile already exists for (product_id, state_code)" }
  - { id: ERR_DUPLICATE_OPEN_FILING, http: 409, condition: "A RateFiling in DRAFT | READY | SUBMITTED | UNDER_OBJECTION | APPROVED | DEEMED_APPROVED already exists for (product_id, state_code); EFFECTIVE filings do not block a successor" }
  - { id: ERR_OPEN_OBJECTIONS, http: 409, condition: "Approve attempted while objections remain non-terminal" }
  - { id: ERR_RATEBOOK_OVERLAP, http: 409, condition: "Another EFFECTIVE filing for the same rate book has actual_effective_date >= this filing's" }
  - { id: ERR_WAVE_GAP_VIOLATION, http: 409, condition: "Wave window violates the MIN_WAVE_GAP_DAYS separation against an existing wave of the same rate book" }
  - { id: ERR_WAVE_NOT_REVERSIBLE, http: 409, condition: "Post-effective disapproval blocked: a wave of this filing is COMPLETED" }
  - { id: ERR_EFFECTIVE_LEAD_VIOLATION, http: 422, condition: "proposed_effective_date violates the filing method's lead-time rule" }
  - { id: ERR_EFFECTIVE_DATE_NOT_REACHED, http: 409, condition: "Clock is before the (actual) effective / renewal date required for the transition" }
  - { id: ERR_DISAPPROVAL_WINDOW_CLOSED, http: 409, condition: "Post-effective disapproval attempted after actual_effective_date + disapproval_window_days" }
  - { id: ERR_NOTICE_DEADLINE_PASSED, http: 409, condition: "send-notice attempted after notice_due_date" }
  - { id: ERR_WAVE_WINDOW_INVALID, http: 422, condition: "wave_end_date < wave_start_date" }
  - { id: ERR_CHANGE_EXCEEDS_MAX, http: 422, condition: "proposed_change_pct exceeds profile.max_single_change_pct" }
  - { id: ERR_CAP_ABOVE_REGULATORY_MAX, http: 422, condition: "wave cap_pct exceeds profile.max_single_change_pct" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the test-driving logical clock; no business permissions"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: ProductActuary
    description: "Actuarial owner: develops rate indications, runs the review/approval cycle, locks indications"
    identity: opaque
    exclusive_operations:
      - "POST /products"
      - "POST /rate-indications"
      - "POST /rate-indications/{indicationId}/submit-review"
      - "POST /rate-indications/{indicationId}/approve"
      - "POST /rate-indications/{indicationId}/return"
      - "POST /rate-indications/{indicationId}/lock"
    shared_operations: ["all GET endpoints"]

  - name: FilingAnalyst
    description: "Product filing preparer: builds filings, components, deviations; drafts objection responses"
    identity: opaque
    exclusive_operations:
      - "POST /filings"
      - "POST /filings/{filingId}/mark-ready"
      - "POST /filings/{filingId}/components"
      - "POST /components/{componentId}/finalize"
      - "POST /deviations"
      - "POST /deviations/{deviationId}/withdraw"
      - "POST /objections/{objectionId}/responses"
    shared_operations: ["all GET endpoints", "POST /filings/{filingId}/withdraw"]

  - name: ComplianceOfficer
    description: "Regulatory operations: owns state profiles, submits filings, submits responses, manages effective dates and the compliance calendar"
    identity: opaque
    exclusive_operations:
      - "POST /state-profiles"
      - "POST /state-profiles/{profileId}/suspend"
      - "POST /state-profiles/{profileId}/reactivate"
      - "POST /filings/{filingId}/submit"
      - "POST /filings/{filingId}/mark-effective"
      - "POST /responses/{responseId}/submit"
      - "POST /calendar-entries/{entryId}/waive"
    shared_operations: ["all GET endpoints", "POST /filings/{filingId}/withdraw"]

  - name: StateRegulator
    description: "State DOI reviewer: raises/withdraws/reopens/resolves objections, approves or disapproves filings and deviations"
    identity: opaque
    exclusive_operations:
      - "POST /objections"
      - "POST /objections/{objectionId}/resolve"
      - "POST /objections/{objectionId}/reopen"
      - "POST /objections/{objectionId}/withdraw"
      - "POST /filings/{filingId}/approve"
      - "POST /filings/{filingId}/disapprove"
      - "POST /deviations/{deviationId}/approve"
      - "POST /deviations/{deviationId}/reject"
    shared_operations: ["all GET endpoints"]

  - name: ImplementationLead
    description: "Implementation owner: schedules/releases/reverses waves, manages the renewal book and policyholder notices"
    identity: opaque
    exclusive_operations:
      - "POST /waves"
      - "POST /waves/{waveId}/release"
      - "POST /waves/{waveId}/reverse"
      - "POST /waves/{waveId}/cancel"
      - "POST /policies"
      - "POST /policies/{policyId}/send-notice"
      - "POST /policies/{policyId}/complete-renewal"
    shared_operations: ["all GET endpoints"]
