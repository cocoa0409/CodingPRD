          trigger:
            - call: "POST /budgets/${bud26}/ratify"
              payload: {}
              as: BoardDirector
              as_user_id: "${d1}"
          assert:
            - "PROBE A (the trigger): HTTP 409 with error.id == ERR_MEETING_NOT_IN_SESSION — NOT 422 ERR_RESERVE_CONTRIBUTION_TOO_LOW, NOT ERR_BOARD_QUORUM_NOT_MET (priority 14, also unsatisfied), NOT ERR_INVALID_BUDGET_STATE"
            - "PROBE A leaves Budget.${bud26}.status == NOTICED and Unit.${u101}.monthly_assessment_cents == 0 — a rejected ratify performs no allocation"
            - "PROBE B: POST /board-meetings/${mtg1}/convene with attending_owner_ids [${d1}, ${d2}, ${tr}] returns 200 with status IN_SESSION, seated_director_count == 3, quorum_met == true; repeating POST /budgets/${bud26}/ratify now returns HTTP 422 with error.id == ERR_RESERVE_CONTRIBUTION_TOO_LOW (1200000 < round_half_up(12000000 * 2000 / 10000) == 2400000)"
            - "PROBE C: PATCH /associations/${assoc_id} with reserve_contribution_min_bp 1000 then POST /budgets/${bud26}/ratify returns 200 with Budget.${bud26}.status == ADOPTED, no_weight_bp == 0, monthly_assessable_cents == 1100000"
            - "PROBE C allocation is exact with zero drift: Unit.${u101}.monthly_assessment_cents == 374000, Unit.${u102} == 363000, Unit.${u103} == 363000, and 374000 + 363000 + 363000 == 1100000"
            - "Ordering is stable across attempt count: rerunning PROBE A on a fresh association still yields ERR_MEETING_NOT_IN_SESSION"

      - name: business_safety_p16_insurance_lapsed_beats_business_referential_p20_element_spec_changed_on_reinstate
        grounds:
          - validations[priority=16]  # ERR_VENDOR_INSURANCE_LAPSED
          - validations[priority=20]  # ERR_ELEMENT_SPEC_CHANGED
          - endpoints[POST /vendor-contracts/{id}/reinstate]
          - state_machines.VendorContract.SUSPENDED_to_ACTIVE
          - calculations.encumbrance_conservation_invariant
        distinguishing_aspect: |
          A DIFFERENT category pair from the other instance — business_safety (priority 16) vs
          business_referential (priority 20) — on POST /vendor-contracts/{id}/reinstate. The
          suspended contract simultaneously fails both reinstatement preconditions: its
          replacement certificate expired 2026-12-01 (clock is 2027-01-15) AND the covered
          element was PATCHed after board award so CommonElement.version no longer equals
          pinned_element_version. The response MUST be ERR_VENDOR_INSURANCE_LAPSED; only after
          the certificate is renewed does ERR_ELEMENT_SPEC_CHANGED appear, and because PATCH
          only ever increments the element version the pin is unrecoverable, so the contract
          can leave SUSPENDED only via terminate.
        test_recipe:
          setup:
            - "Association with default board_quorum_seats 3, element_window_buffer_hours 24; three seated directors each owning a unit (3400 / 3300 / 3300 bp)."
            - "One ROOF CommonElement, status SERVICEABLE, version 1."
            - "VendorContract: contract_cap_cents 5000000, effective_from 2026-09-01, effective_to 2027-06-01, insurance_cert_expires_at 2027-06-01 (equality with effective_to, which submit permits)."
            - "Contract walked DRAFT -> PENDING_APPROVAL -> APPROVED (3 counted YES VENDOR_CONTRACT votes at a CONTRACT_AWARD meeting, pinning element version) -> ACTIVE."
            - "One MaintenanceWorkOrder for 1200000 encumbers the contract, then suspend PERFORMANCE puts it ON_HOLD."
            - "Then: a replacement certificate expiring 2026-12-01 is recorded, the element is PATCHed (version 1 -> 2, breaking the pin), and the clock moves to 2027-01-15 — still inside the contract term."
