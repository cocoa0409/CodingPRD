        grounds:
          - state_machines.ClassSession.IN_PROGRESS_to_COMPLETED
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - entities.Member.fields.account_status
          - calculations.fee_assessment
        distinguishing_aspect: |
          Depth-3 chain from session completion: complete -> Reservation BOOKED->NO_SHOW (link 1);
          that NO_SHOW creates a FeeCharge AND increments member.no_show_strike_count (link 2);
          the incremented strike count crossing NO_SHOW_SUSPEND_THRESHOLD flips
          member.account_status to SUSPENDED (link 3). Each link is caused by the previous.
        test_recipe:
          setup:
            - "Clock 2026-02-01. Member M established (not new-student) with no_show_strike_count already at threshold-1 (assume threshold 3, so strike_count=2)."
            - "M holds ACTIVE unlimited MEMBERSHIP and a BOOKED reservation R on session S starting 2026-02-05T10:00Z."
