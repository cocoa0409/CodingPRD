            - "${ee} == 1"
            - "${ev} == 1"
            - "${rr} == 1"
            - "ResellerAgreement.${agr}.status == EXPIRED"
            - "PricingException.${exc}.status == EXPIRED"
            - "Violation.${vio}.status == ESCALATED"
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.supply_status == HOLD"
            - "Reseller.${res}.hold_reason == AGREEMENT_EXPIRED"
            - "Product.${prod}.open_exception_count == 0"

      - name: chargeback_creation_flags_sourcing_resellers_for_review
        claim_type: side_effect_execution
        grounds: ["calculations.reseller_review_required", "calculations.chargeback_assessment"]
        distinguishing_aspect: "Assessing 4 units pushes Northwind's diversion_score to 10.0 and its standing to PROBATION, which fans out to every reseller sourcing from it: Acme's review_required flips false -> true without any reseller-facing call."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED with sourcing_distributor_id Northwind and review_required false; a CONFIRMED_UNAUTHORIZED test purchase exists."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - &RESSOURCED
              call: "POST /resellers"
              payload: { legal_name: "Acme Retail LLC", contact_email: "ops@acme.example", primary_channel: "MARKETPLACE", sourcing_distributor_id: "${dist}" }
              as: BrandChannelManager
