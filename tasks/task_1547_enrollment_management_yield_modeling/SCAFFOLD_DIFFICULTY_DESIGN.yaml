            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "V 2", email: "v2@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
