scenario: |
  DMV Vehicle Registration & Title Transfer: VIN verification, transfer/initial
  registration, Lien Holder, emissions inspection, REAL ID upgrade, taxes/Reg Fee,
  electronic license plate, Salvage Title.

domain_name: dmv-registration-title
api_prefix: /vehicles

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal full name as it will appear on title and plate records.
        constraints: 1..100 chars
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); used for REAL ID eligibility scoring.
      - name: residency_state
        type: enum
        source: input
        description: Two-letter US state code where the owner resides.
        constraints: ISO 3166-2:US subdivision code (2 chars)
      - name: real_id_status
        type: enum
        source: computed
        description: Current REAL ID upgrade status for this owner.
        default: NOT_APPLIED
        constraints: NOT_APPLIED | PENDING | APPROVED | REVOKED
      - name: real_id_score
        type: number
        source: computed
        description: Weighted eligibility score from latest REAL ID application; null if no application.
        default: null
        constraints: 0.00..100.00, 2 decimal places
      - name: real_id_expires_at
        type: datetime
        source: computed
        description: Expiration of the current APPROVED REAL ID credential; null otherwise.
        default: null
      - name: is_resident
        type: boolean
        source: computed
        description: True iff residency_state equals the DMV jurisdiction code "CA".
        default: true
      - name: outstanding_holds_count
        type: integer
        source: computed
        description: Number of unresolved holds (unpaid fees, suspended plates) attached to this owner.
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: 17-character Vehicle Identification Number, uppercase alphanumeric excluding I, O, Q.
        constraints: regex ^[A-HJ-NPR-Z0-9]{17}$, globally unique
      - name: make
        type: string
        source: input
        description: Manufacturer name.
        constraints: 1..50 chars
      - name: model
        type: string
        source: input
        description: Model designation.
        constraints: 1..50 chars
      - name: model_year
        type: integer
        source: input
        description: Four-digit model year.
        constraints: 1900..2100
      - name: curb_weight_lbs
        type: integer
        source: input
        description: Curb weight in pounds; used for fee tier selection.
        constraints: 200..40000
      - name: fuel_type
        type: enum
        source: input
        description: Fuel type; determines emissions inspection cadence.
        constraints: GASOLINE | DIESEL | HYBRID | ELECTRIC
      - name: vin_verification_status
        type: enum
        source: computed
        description: Result of the most recent VIN verification.
        default: UNVERIFIED
        constraints: UNVERIFIED | VERIFIED | MISMATCH | HOLD
      - name: vin_verified_at
        type: datetime
        source: computed
        description: Timestamp of last successful VIN verification; null if never verified.
        default: null
      - name: title_status
        type: enum
        source: computed
        description: Salvage axis of the title state machine.
        default: CLEAN
        constraints: CLEAN | SALVAGE_PENDING_REBUILD | REBUILT | NON_REPAIRABLE
      - name: lien_status
        type: enum
        source: computed
        description: Lien axis of the title state machine (independent from title_status).
        default: NONE
        constraints: NONE | ACTIVE | RELEASED
      - name: current_title_id
        type: string
        source: computed
        description: FK to the currently active Title row; updated when Title.is_active flips.
        default: null
      - name: emissions_expires_at
        type: datetime
        source: computed
        description: Expiration of the latest PASSED EmissionsInspection; null if never passed or fuel_type == ELECTRIC and exempt.
        default: null

  - name: Title
    parent: null
    common_fields: false
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK to Vehicle.
      - name: owner_id
        type: string
        source: input
        description: FK to Owner (sole owner; co-ownership out of scope for v1).
      - name: brand
        type: enum
        source: input
        description: Title brand recorded at issuance.
        constraints: CLEAN | SALVAGE | REBUILT | FLOOD | LEMON
      - name: issued_at
        type: datetime
        source: system
        description: When this title was created; immutable.
      - name: superseded_at
        type: datetime
        source: computed
        description: When this title was replaced by a newer Title for the same vehicle; null while active.
        default: null
      - name: is_active
        type: boolean
        source: computed
        description: True iff this is the latest Title row for the vehicle and not superseded.
        default: true
      - name: source_application_id
        type: string
        source: system
        description: FK to the TransferApplication that produced this Title; null only for system-seeded titles.
        default: null

  - name: LienRecord
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: FK to the Title this lien attaches to.
      - name: lienholder_name
        type: string
        source: input
        description: Financial institution holding the lien.
        constraints: 1..120 chars
      - name: principal_amount
        type: number
        source: input
        description: Original loan principal in USD; 2 decimal places.
        constraints: 0.01..2000000.00
      - name: status
        type: enum
        source: computed
        description: Current lien status.
        default: ACTIVE
        constraints: ACTIVE | RELEASED
      - name: released_at
        type: datetime
        source: computed
        description: When RELEASED was recorded; null while ACTIVE.
        default: null
      - name: release_reference
        type: string
        source: input
        description: External release confirmation code; required to flip to RELEASED.
        default: null

  - name: EmissionsInspection
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK to Vehicle.
      - name: station_id
        type: string
        source: input
        description: Identifier of the inspection station resource (opaque string).
        constraints: 1..40 chars
      - name: scheduled_start
        type: datetime
        source: input
        description: Booked start time.
      - name: scheduled_end
        type: datetime
        source: input
        description: Booked end time; must be > scheduled_start.
      - name: status
        type: enum
        source: computed
        description: Inspection lifecycle state.
        default: SCHEDULED
        constraints: SCHEDULED | IN_PROGRESS | PASSED | FAILED | CANCELLED
      - name: result_recorded_at
        type: datetime
        source: computed
        description: When PASSED or FAILED was recorded; null otherwise.
        default: null
      - name: odometer_reading
        type: integer
        source: input
        description: Odometer reading captured during inspection; required when transitioning to PASSED/FAILED.
        default: null
        constraints: 0..2000000

  - name: RealIDApplication
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: FK to the Owner applying.
      - name: status
        type: enum
        source: computed
        description: Application lifecycle state; supports a cyclic revision loop.
        default: SUBMITTED
        constraints: SUBMITTED | DOC_REVIEW | APPROVED | DOC_REJECTED | REVOKED
      - name: documents_proof_of_identity
        type: boolean
        source: input
        description: Whether proof-of-identity document is attached.
        default: false
      - name: documents_proof_of_residency
        type: boolean
        source: input
        description: Whether proof-of-residency document is attached.
        default: false
      - name: documents_proof_of_ssn
        type: boolean
        source: input
        description: Whether SSN proof is attached.
        default: false
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this application has cycled DOC_REJECTED → SUBMITTED.
        default: 0
      - name: approved_at
        type: datetime
        source: computed
        description: When APPROVED was first recorded; null otherwise.
        default: null

  - name: Plate
    parent: null
    common_fields: true
    fields:
      - name: plate_number
        type: string
        source: input
        description: Alphanumeric plate string (electronic plate identifier); unique across ACTIVE plates.
        constraints: regex ^[A-Z0-9]{2,8}$
      - name: vehicle_id
        type: string
        source: input
        description: FK to the Vehicle the plate is bound to.
      - name: status
        type: enum
        source: computed
        description: Plate lifecycle state.
        default: ISSUED
        constraints: ISSUED | ACTIVE | SUSPENDED | SURRENDERED
      - name: activated_at
        type: datetime
        source: computed
        description: When the plate first transitioned ISSUED → ACTIVE.
        default: null
      - name: suspended_at
        type: datetime
        source: computed
        description: When SUSPENDED was entered; null if not currently suspended.
        default: null
      - name: surrender_reason
        type: enum
        source: computed
        description: Why the plate was surrendered.
        default: null
        constraints: SALVAGE_TRIGGERED | OWNER_REQUEST | LIEN_DEFAULT | TRANSFER_COMPLETE

  - name: TransferApplication
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK to Vehicle being registered or transferred.
      - name: applicant_owner_id
        type: string
        source: input
        description: FK to the Owner submitting the application (becomes new title holder on success).
      - name: application_type
        type: enum
        source: input
        description: Initial registration vs ownership transfer; chosen at creation, immutable.
        constraints: INITIAL_REGISTRATION | TITLE_TRANSFER
      - name: status
        type: enum
        source: computed
        description: Workflow state.
        default: DRAFT
        constraints: DRAFT | VIN_VERIFIED | SALVAGE_REVIEW | SALVAGE_APPROVED | EMISSIONS_PENDING | EMISSIONS_PASSED | TAX_ASSESSED | PLATE_ISSUED | COMPLETED | REJECTED
      - name: salvage_branch_taken
        type: boolean
        source: computed
        description: True iff this application went through SALVAGE_REVIEW.
        default: false
      - name: trade_in_value
        type: number
        source: input
        description: Declared trade-in value in USD; deducted from sales tax base when present and resident.
        default: 0.00
        constraints: 0.00..1000000.00, 2 decimal places
      - name: declared_sale_price
        type: number
        source: input
        description: Declared sale price for TITLE_TRANSFER; declared MSRP for INITIAL_REGISTRATION.
        constraints: 0.01..2000000.00, 2 decimal places
      - name: fee_subtotal
        type: number
        source: computed
        description: Pinned subtotal after tax + reg_fee, before processing_fee.
        default: null
        constraints: 2 decimal places, round_half_up
      - name: processing_fee
        type: number
        source: computed
        description: Tier-derived processing fee; depends on fee_subtotal.
        default: null
        constraints: 2 decimal places, round_half_up
      - name: total_due
        type: number
        source: computed
        description: Final amount owed; fee_subtotal + processing_fee.
        default: null
        constraints: 2 decimal places, round_half_up
      - name: paid_at
        type: datetime
        source: computed
        description: When the applicant marked the assessment paid; null otherwise.
        default: null
      - name: plate_id
        type: string
        source: computed
        description: FK to Plate issued by this application; null until PLATE_ISSUED.
        default: null
      - name: rejection_reason
        type: enum
        source: computed
        description: Why the application was REJECTED.
        default: null
        constraints: EMISSIONS_FAILED | NON_REPAIRABLE_SALVAGE | UNPAID_TIMEOUT | OWNER_HOLDS | WITHDRAWN

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: system
        description: FK to TransferApplication.
      - name: kind
        type: enum
        source: system
        description: Ledger row type.
        constraints: SALES_TAX | REG_FEE | PROCESSING_FEE | REFUND_TAX | REFUND_REG | REFUND_PROCESSING
      - name: amount_cents
        type: integer
        source: system
        description: Signed cents; debits positive, refunds negative.
      - name: occurred_at
        type: datetime
        source: system
        description: When this entry was posted; append-only.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TransferApplication
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: DRAFT
        to: VIN_VERIFIED
        trigger: "POST /vehicles/{vehicle_id}/transfer-applications/{id}/verify-vin"
        actor: VinVerifier
        preconditions:
          - "Vehicle.vin_verification_status IN {UNVERIFIED, VERIFIED}"
          - "Owner.outstanding_holds_count == 0"
        side_effects:
          - "Vehicle.vin_verification_status := VERIFIED"
          - "Vehicle.vin_verified_at := now()"
      - from: VIN_VERIFIED
        to: SALVAGE_REVIEW
        trigger: "system branch: Vehicle.title_status IN {SALVAGE_PENDING_REBUILD, NON_REPAIRABLE}"
        actor: system
        preconditions:
          - "Vehicle.title_status IN {SALVAGE_PENDING_REBUILD, NON_REPAIRABLE}"
        side_effects:
          - "TransferApplication.salvage_branch_taken := true"
        note: "Automatic branch evaluated at end of verify-vin call when salvage condition holds."
      - from: VIN_VERIFIED
        to: EMISSIONS_PENDING
        trigger: "system branch: Vehicle.title_status IN {CLEAN, REBUILT}"
        actor: system
        preconditions:
          - "Vehicle.title_status IN {CLEAN, REBUILT}"
        side_effects: []
      - from: SALVAGE_REVIEW
        to: SALVAGE_APPROVED
        trigger: "POST /transfer-applications/{id}/approve-salvage"
        actor: SalvageOfficer
        preconditions:
          - "Vehicle.title_status == SALVAGE_PENDING_REBUILD"
          - "TransferApplication.application_type == TITLE_TRANSFER"
        side_effects:
          - "Vehicle.title_status := REBUILT"
          - "Vehicle.emissions_expires_at := null  (forces fresh inspection)"
      - from: SALVAGE_REVIEW
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/approve-salvage with decision=DENY"
        actor: SalvageOfficer
        preconditions:
          - "Vehicle.title_status == NON_REPAIRABLE"
        side_effects:
          - "TransferApplication.rejection_reason := NON_REPAIRABLE_SALVAGE"
      - from: SALVAGE_APPROVED
        to: EMISSIONS_PENDING
        trigger: "system follow-on to SALVAGE_APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: EMISSIONS_PENDING
        to: EMISSIONS_PASSED
        trigger: "system: linked EmissionsInspection.status flips to PASSED"
        actor: system
        preconditions:
          - "EmissionsInspection.vehicle_id == TransferApplication.vehicle_id AND .status == PASSED"
          - "EmissionsInspection.result_recorded_at >= TransferApplication.updated_at - 30d"
        side_effects:
          - "Vehicle.emissions_expires_at := EmissionsInspection.result_recorded_at + 730d (gasoline/diesel/hybrid), or null for ELECTRIC"
      - from: EMISSIONS_PENDING
        to: REJECTED
        trigger: "system: linked EmissionsInspection.status flips to FAILED"
        actor: system
        preconditions:
          - "EmissionsInspection.vehicle_id == TransferApplication.vehicle_id AND .status == FAILED"
        side_effects:
          - "TransferApplication.rejection_reason := EMISSIONS_FAILED"
      - from: EMISSIONS_PASSED
        to: TAX_ASSESSED
        trigger: "POST /transfer-applications/{id}/assess-fees"
        actor: TaxAssessor
        preconditions:
          - "Vehicle.lien_status IN {NONE, RELEASED}"
          - "Owner.real_id_status IN {APPROVED, NOT_APPLIED, PENDING}  (REVOKED blocks fee assessment)"
        side_effects:
          - "Run calc registration_fee, sales_tax_on_transfer, total_due_with_processing"
          - "Append FeeLedgerEntry rows {SALES_TAX, REG_FEE, PROCESSING_FEE}"
          - "Set fee_subtotal, processing_fee, total_due on the TransferApplication"
      - from: TAX_ASSESSED
        to: EMISSIONS_PASSED
        trigger: "POST /_clock/advance crossing TransferApplication.updated_at + 7d with paid_at == null"
        actor: system
        preconditions:
          - "now() >= TransferApplication.updated_at + 7d"
          - "TransferApplication.paid_at IS NULL"
        side_effects:
          - "Append refund FeeLedgerEntry rows (REFUND_TAX, REFUND_REG, REFUND_PROCESSING) summing to negative of original three rows"
          - "Clear fee_subtotal, processing_fee, total_due back to null"
        note: "Compensating-action invariant: net cents per application == 0 after revert."
      - from: TAX_ASSESSED
        to: PLATE_ISSUED
        trigger: "POST /transfer-applications/{id}/issue-plate"
        actor: PlateIssuer
        preconditions:
          - "TransferApplication.paid_at IS NOT NULL"
          - "Owner.real_id_status == APPROVED OR now() < 2027-05-07T00:00:00Z"
          - "TaxAssessor user-id MUST differ from PlateIssuer user-id on this application (segregation of duties)"
        side_effects:
          - "Create new Plate (status := ACTIVE)"
          - "Set TransferApplication.plate_id"
      - from: PLATE_ISSUED
        to: COMPLETED
        trigger: "system follow-on to PLATE_ISSUED"
        actor: system
        preconditions: []
        side_effects:
          - "Create new Title row for vehicle owned by applicant_owner_id; mark prior Title.superseded_at := now() and is_active := false"
          - "Vehicle.current_title_id := new Title.id"
          - "If application_type == TITLE_TRANSFER and prior Plate exists on vehicle, surrender it (status := SURRENDERED, surrender_reason := TRANSFER_COMPLETE)"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /transfer-applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "TransferApplication.rejection_reason := WITHDRAWN"

  - entity: Title
    initial_state: CLEAN__NONE
    terminal_states: []
    transitions:
      - from: "title_status:CLEAN"
        to: "title_status:SALVAGE_PENDING_REBUILD"
        trigger: "POST /vehicles/{vehicle_id}/salvage-event"
        actor: SalvageOfficer
        preconditions:
          - "Vehicle.title_status == CLEAN"
        side_effects:
          - "Vehicle.title_status := SALVAGE_PENDING_REBUILD"
          - "Vehicle.emissions_expires_at := null"
          - "Cancel any SCHEDULED or IN_PROGRESS EmissionsInspection on this vehicle (set status := CANCELLED)"
          - "Suspend any ACTIVE Plate bound to this vehicle (status := SUSPENDED, surrender_reason := SALVAGE_TRIGGERED for the eventual surrender)"
          - "Any TransferApplication on this vehicle in {VIN_VERIFIED, EMISSIONS_PENDING, EMISSIONS_PASSED, TAX_ASSESSED} branches into SALVAGE_REVIEW on next read or is_rejected on assess-fees attempt"
      - from: "title_status:SALVAGE_PENDING_REBUILD"
        to: "title_status:REBUILT"
        trigger: "side effect of TransferApplication.SALVAGE_REVIEW -> SALVAGE_APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle.title_status := REBUILT"
      - from: "title_status:CLEAN"
        to: "title_status:NON_REPAIRABLE"
        trigger: "POST /vehicles/{vehicle_id}/salvage-event with severity=TOTAL"
        actor: SalvageOfficer
        preconditions: []
        side_effects:
          - "Vehicle.title_status := NON_REPAIRABLE"
          - "Surrender all ACTIVE/SUSPENDED Plates on the vehicle (status := SURRENDERED, surrender_reason := SALVAGE_TRIGGERED)"
      - from: "lien_status:NONE"
        to: "lien_status:ACTIVE"
        trigger: "POST /titles/{title_id}/lien-records"
        actor: LienClerk
        preconditions:
          - "Title.is_active == true"
        side_effects:
          - "Vehicle.lien_status := ACTIVE"
          - "Block any TransferApplication on this vehicle from progressing past EMISSIONS_PASSED while lien_status == ACTIVE"
      - from: "lien_status:ACTIVE"
        to: "lien_status:RELEASED"
        trigger: "PATCH /lien-records/{id}/release"
        actor: LienClerk
        preconditions:
          - "Caller supplied a non-empty release_reference"
        side_effects:
          - "LienRecord.status := RELEASED; released_at := now()"
          - "If no other ACTIVE LienRecord on the title, Vehicle.lien_status := RELEASED"
        note: "Parallel-dimension state machine: title_status and lien_status evolve independently."

  - entity: RealIDApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: DOC_REVIEW
        trigger: "POST /real-id-applications/{id}/start-review"
        actor: RealIDReviewer
        preconditions:
          - "All three documents booleans are true"
        side_effects: []
      - from: DOC_REVIEW
        to: APPROVED
        trigger: "POST /real-id-applications/{id}/approve"
        actor: RealIDReviewer
        preconditions:
          - "Calc real_id_eligibility_score returns score >= 80.00"
        side_effects:
          - "Owner.real_id_status := APPROVED"
          - "Owner.real_id_expires_at := now() + 8 years"
          - "Owner.real_id_score := computed score"
          - "RealIDApplication.approved_at := now()"
      - from: DOC_REVIEW
        to: DOC_REJECTED
        trigger: "POST /real-id-applications/{id}/reject"
        actor: RealIDReviewer
        preconditions:
          - "Calc real_id_eligibility_score returns score < 80.00"
        side_effects:
          - "Owner.real_id_status := PENDING"
      - from: DOC_REJECTED
        to: SUBMITTED
        trigger: "PATCH /real-id-applications/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "RealIDApplication.revision_count < 3"
        side_effects:
          - "RealIDApplication.revision_count += 1"
        note: "Cyclic revision loop: SUBMITTED → DOC_REVIEW → DOC_REJECTED → SUBMITTED, up to 3 times."
      - from: APPROVED
        to: REVOKED
        trigger: "POST /real-id-applications/{id}/revoke"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Owner.real_id_status := REVOKED"
          - "All TransferApplication rows on vehicles where applicant_owner_id == this Owner and status IN {VIN_VERIFIED, EMISSIONS_PENDING, EMISSIONS_PASSED, TAX_ASSESSED} are frozen (assess-fees and issue-plate reject with ERR_OWNER_REAL_ID_REVOKED)"
          - "All ACTIVE Plates on Vehicles whose current Title.owner_id == this Owner are SUSPENDED (status := SUSPENDED, suspended_at := now())"

  - entity: EmissionsInspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /emissions-inspections/{id}/start"
        actor: EmissionsInspector
        preconditions:
          - "Vehicle.title_status != NON_REPAIRABLE"
          - "Vehicle.title_status != SALVAGE_PENDING_REBUILD"
          - "now() >= EmissionsInspection.scheduled_start - 15m"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /emissions-inspections/{id}/record-result with outcome=PASSED"
        actor: EmissionsInspector
        preconditions:
          - "Caller supplied odometer_reading"
          - "If a prior PASSED inspection exists on this vehicle, new odometer_reading >= prior odometer_reading"
        side_effects:
          - "Vehicle.emissions_expires_at := now() + 730d (24 months) unless fuel_type == ELECTRIC (set null)"
          - "Any TransferApplication on this vehicle in EMISSIONS_PENDING advances to EMISSIONS_PASSED"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /emissions-inspections/{id}/record-result with outcome=FAILED"
        actor: EmissionsInspector
        preconditions:
          - "Caller supplied odometer_reading"
        side_effects:
          - "Any TransferApplication on this vehicle in EMISSIONS_PENDING is REJECTED with rejection_reason := EMISSIONS_FAILED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "DELETE /emissions-inspections/{id}"
        actor: EmissionsInspector
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "side effect of Vehicle salvage-event"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Plate
    initial_state: ISSUED
    terminal_states: [SURRENDERED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system follow-on at Plate creation during TAX_ASSESSED → PLATE_ISSUED"
        actor: system
        preconditions: []
        side_effects:
          - "Plate.activated_at := now()"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plates/{id}/suspend OR side effect of Vehicle.title_status flip to SALVAGE_PENDING_REBUILD or Owner.real_id_status flip to REVOKED"
        actor: PlatformAdmin OR system
        preconditions: []
        side_effects:
          - "Plate.suspended_at := now()"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plates/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Vehicle.title_status IN {CLEAN, REBUILT}"
          - "Owner.real_id_status != REVOKED OR now() < 2027-05-07T00:00:00Z"
        side_effects:
          - "Plate.suspended_at := null"
        note: "Cyclic: ACTIVE → SUSPENDED → ACTIVE is allowed any number of times before SURRENDERED."
      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /plates/{id}/surrender OR side effect of Vehicle non-repairable salvage OR side effect of new TransferApplication COMPLETED"
        actor: PlatformAdmin OR system
        preconditions: []
        side_effects:
          - "Plate.surrender_reason set per cause"
      - from: SUSPENDED
        to: SURRENDERED
        trigger: "POST /plates/{id}/surrender OR side effect of Vehicle.title_status == NON_REPAIRABLE"
        actor: PlatformAdmin OR system
        preconditions: []
        side_effects:
          - "Plate.surrender_reason set per cause"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two PlateIssuer users call issue-plate on the same TAX_ASSESSED TransferApplication"
    guarantee: "Exactly one issuance succeeds; loser sees state already advanced"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TransferApplication.status (DB-level row lock)"
  - scenario: "Plate.plate_number string requested by two simultaneous issuances"
    guarantee: "At most one ACTIVE/ISSUED Plate per plate_number; second issuance rejected"
    error_id: ERR_PLATE_NUMBER_TAKEN
    http_status: 409
    serialization: "First-writer-wins on Plate.plate_number unique among status IN {ISSUED, ACTIVE, SUSPENDED}"
  - scenario: "Assess-fees and salvage-event posted simultaneously against the same vehicle"
    guarantee: "Exactly one operation succeeds against the application; loser observes salvage state"
    error_id: ERR_VEHICLE_SALVAGE_LOCKED
    http_status: 409
    serialization: "First-writer-wins on Vehicle.title_status; assess-fees re-checks after acquiring lock"
  - scenario: "Two LienClerks release the same LienRecord at once"
    guarantee: "Exactly one release succeeds"
    error_id: ERR_LIEN_ALREADY_RELEASED
    http_status: 409
    serialization: "First-writer-wins on LienRecord.status (only one ACTIVE → RELEASED winner)"
  - scenario: "EmissionsInspector records PASSED while Vehicle is concurrently flipped to NON_REPAIRABLE"
    guarantee: "Salvage wins; PASSED is rejected"
    error_id: ERR_VEHICLE_SALVAGE_LOCKED
    http_status: 409
    serialization: "Record-result re-reads Vehicle.title_status under lock before committing"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: registration_fee
    trigger: "TransferApplication EMISSIONS_PASSED → TAX_ASSESSED (assess-fees endpoint)"
    algorithm: tiered_pricing
    formula: |
      # Weight tier base (curb_weight_lbs):
      #   weight <  3000 lbs                -> BASE_LIGHT  = 65.00
      #   3000 <= weight <  6000 lbs        -> BASE_MID    = 110.00
      #   weight >= 6000 lbs                -> BASE_HEAVY  = 185.00   (boundary: >= 6000, NOT > 6000)
      # Age depreciation:
      #   age_years = max(0, current_calendar_year - Vehicle.model_year)
      #   age_factor = max(0.50, 1.00 - 0.05 * age_years)    # floor at 0.50
      # County surcharge (residency_state):
      #   if Owner.is_resident is true           -> surcharge = COUNTY_SURCHARGE = 22.00
      #   else                                    -> surcharge = NON_RESIDENT_SURCHARGE = 55.00
      # reg_fee = round_half_up( weight_base * age_factor + surcharge , 2 )
    input_set: "Single Vehicle row (curb_weight_lbs, model_year, fuel_type) + Owner.is_resident."
    constants:
      BASE_LIGHT: 65.00
      BASE_MID: 110.00
      BASE_HEAVY: 185.00
      AGE_FACTOR_STEP: 0.05
      AGE_FACTOR_FLOOR: 0.50
      COUNTY_SURCHARGE: 22.00
      NON_RESIDENT_SURCHARGE: 55.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: sales_tax_on_transfer
    trigger: "TransferApplication EMISSIONS_PASSED → TAX_ASSESSED (assess-fees endpoint)"
    algorithm: threshold
    formula: |
      # Dual-variant: two formulas selected by Owner.is_resident.
      # RESIDENT variant:
      #   taxable_base = max(0.00, declared_sale_price - trade_in_value)
      #   sales_tax = round_half_up( taxable_base * RATE_RESIDENT, 2 )    # RATE_RESIDENT = 0.0725
      # NON_RESIDENT variant:
      #   taxable_base = declared_sale_price            # trade_in_value is IGNORED
      #   sales_tax = round_half_up( taxable_base * RATE_NON_RESIDENT, 2 ) # RATE_NON_RESIDENT = 0.085
      # For INITIAL_REGISTRATION application_type, both variants apply identically EXCEPT
      # trade_in_value is treated as 0 for the resident branch.
    input_set: "TransferApplication.{declared_sale_price, trade_in_value, application_type} + Owner.is_resident."
    constants:
      RATE_RESIDENT: 0.0725
      RATE_NON_RESIDENT: 0.085
    precision: "2 decimal places, round_half_up"
    variants:
      - name: resident_with_trade_in
        when: "Owner.is_resident == true AND TransferApplication.application_type == TITLE_TRANSFER"
        difference: "Trade-in value deducted from the taxable base before multiplying by RATE_RESIDENT."
      - name: non_resident_full_price
        when: "Owner.is_resident == false"
        difference: "Trade-in value is IGNORED; full declared_sale_price multiplied by RATE_NON_RESIDENT."

  - name: total_due_with_processing
    trigger: "TransferApplication EMISSIONS_PASSED → TAX_ASSESSED (assess-fees endpoint)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency: total = subtotal + processing_fee,
      # but processing_fee depends on subtotal tier. Evaluation order is pinned:
      # STEP 1: fee_subtotal = round_half_up( sales_tax + reg_fee, 2 )            # sum-then-round at this step
      # STEP 2: processing_fee tier on fee_subtotal:
      #          fee_subtotal <= 200.00   -> processing_fee = 8.00
      #          200.00 < fee_subtotal <= 1000.00 -> processing_fee = 18.00
      #          1000.00 < fee_subtotal <= 5000.00 -> processing_fee = 38.00
      #          fee_subtotal > 5000.00   -> processing_fee = 0.02 * fee_subtotal, rounded round_half_up to 2dp
      # STEP 3: total_due = round_half_up( fee_subtotal + processing_fee, 2 )
      # Rounding order is pinned: each step rounds before the next reads its value.
    input_set: "Already-computed sales_tax and reg_fee from the same assess-fees call."
    constants:
      TIER_1_MAX: 200.00
      TIER_2_MAX: 1000.00
      TIER_3_MAX: 5000.00
      TIER_1_FEE: 8.00
      TIER_2_FEE: 18.00
      TIER_3_FEE: 38.00
      TIER_4_RATE: 0.02
    precision: "2 decimal places, round_half_up; each STEP rounds independently"
    variants: []

  - name: real_id_eligibility_score
    trigger: "RealIDApplication DOC_REVIEW → {APPROVED, DOC_REJECTED} (approve/reject endpoint)"
    algorithm: weighted_scoring
    formula: |
      # Inputs (each 0 or 1 from the booleans on the application):
      #   id_pts        = 40 * documents_proof_of_identity
      #   res_pts       = 30 * documents_proof_of_residency
      #   ssn_pts       = 25 * documents_proof_of_ssn
      # Owner age bonus (computed from Owner.date_of_birth at calc-time):
      #   age_years    = floor( (now() - date_of_birth) / 365.25d )
      #   age_bonus    = 5 if 18 <= age_years <= 80 else 0
      # Penalty:
      #   revision_penalty = -5 * RealIDApplication.revision_count
      # Raw score = id_pts + res_pts + ssn_pts + age_bonus + revision_penalty
      # Clamp to [0.00, 100.00], round_half_up to 2 decimals.
      # Approval threshold: >= 80.00
    input_set: "Single RealIDApplication row + linked Owner.date_of_birth."
    constants:
      ID_WEIGHT: 40
      RES_WEIGHT: 30
      SSN_WEIGHT: 25
      AGE_BONUS: 5
      REVISION_PENALTY_PER_CYCLE: 5
      APPROVAL_THRESHOLD: 80.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: first_submission
        when: "RealIDApplication.revision_count == 0"
        difference: "No revision_penalty; only inherent doc/age contributions."
      - name: resubmission_loop
        when: "RealIDApplication.revision_count >= 1"
        difference: "5-point penalty per revision_count cycle accumulates."

  - name: emissions_expiry_projection
    trigger: "EmissionsInspection IN_PROGRESS → PASSED (record-result endpoint)"
    algorithm: forward_looking
    formula: |
      # Two valid forward-looking interpretations are recognized in the scaffold for the
      # purpose of explicitness — only the FIRST is normative; the second is documented
      # to make the choice unambiguous to PRD readers and downstream tests.
      # NORMATIVE (calendar-based):
      #   expires_at = result_recorded_at + 730 days   # fixed 24 months
      # ALTERNATE (odometer-based, NOT used by this scaffold):
      #   expires_at = result_recorded_at + min(730d, ceil((50000 - delta_odometer) / 200) * 1d)
      # Electric vehicles: emissions_expires_at := null (exempt).
    input_set: "EmissionsInspection.{result_recorded_at, odometer_reading} + Vehicle.fuel_type."
    constants:
      EXPIRY_DAYS: 730
    precision: "datetime, ISO 8601 UTC, ms precision"
    variants:
      - name: calendar_24_months
        when: "Vehicle.fuel_type IN {GASOLINE, DIESEL, HYBRID}"
        difference: "Pure calendar-based 730-day window."
      - name: electric_exempt
        when: "Vehicle.fuel_type == ELECTRIC"
        difference: "No emissions expiry; Vehicle.emissions_expires_at remains null."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request includes X-User-ID and X-User-Role headers"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_INVALID_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role is permitted for the invoked endpoint per §1.7"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-resolved resources exist (Vehicle, Owner, TransferApplication, Title, LienRecord, EmissionsInspection, Plate, RealIDApplication) — validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all parameterized paths"
  - priority: 5
    category: state
    check: "VIN verification: Vehicle.vin_verification_status != HOLD before verify-vin progresses"
    error_id: ERR_VIN_ON_HOLD
    http_status: 409
    applies_to: "POST /vehicles/{id}/transfer-applications/{id}/verify-vin"
  - priority: 6
    category: state
    check: "TransferApplication.status matches the from-state required by the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints on TransferApplication"
  - priority: 7
    category: state
    check: "Vehicle.title_status != NON_REPAIRABLE for any flow that would issue or maintain a registration"
    error_id: ERR_VEHICLE_SALVAGE_LOCKED
    http_status: 409
    applies_to: "verify-vin, assess-fees, issue-plate, emissions-inspections start, plate reinstate"
  - priority: 8
    category: state
    check: "EmissionsInspection cannot start while Vehicle.title_status == SALVAGE_PENDING_REBUILD"
    error_id: ERR_VEHICLE_SALVAGE_LOCKED
    http_status: 409
    applies_to: "POST /emissions-inspections/{id}/start"
  - priority: 9
    category: business_safety
    check: "assess-fees blocked when Vehicle.emissions_expires_at IS NULL or now() >= emissions_expires_at (boundary: >=, expiry day fails)"
    error_id: ERR_EMISSIONS_EXPIRED
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/assess-fees"
  - priority: 10
    category: business_safety
    check: "Owner.real_id_status != REVOKED for assess-fees and issue-plate"
    error_id: ERR_OWNER_REAL_ID_REVOKED
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/assess-fees, POST /transfer-applications/{id}/issue-plate"
  - priority: 11
    category: business_referential
    check: "Vehicle.lien_status IN {NONE, RELEASED} before assess-fees"
    error_id: ERR_LIEN_ACTIVE
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/assess-fees"
  - priority: 12
    category: business_temporal
    check: "EmissionsInspection scheduled_start must be strictly later than scheduled_end of any non-cancelled inspection at the same station_id by at least 15 minutes (buffer); half-open intervals [start, end+15m)"
    error_id: ERR_INSPECTION_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /emissions-inspections"
  - priority: 13
    category: business_constraint
    check: "Plate.plate_number must be unique among Plate rows where status IN {ISSUED, ACTIVE, SUSPENDED}"
    error_id: ERR_PLATE_NUMBER_TAKEN
    http_status: 409
    applies_to: "POST /transfer-applications/{id}/issue-plate"
  - priority: 14
    category: business_constraint
    check: "Segregation of duties: the X-User-ID that called assess-fees MUST differ from the X-User-ID calling issue-plate for the same TransferApplication"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /transfer-applications/{id}/issue-plate"
  - priority: 15
    category: business_constraint
    check: "RealIDApplication.revision_count < 3 before resubmit"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "PATCH /real-id-applications/{id}/resubmit"
  - priority: 16
    category: business_constraint
    check: "EmissionsInspection.odometer_reading >= prior PASSED odometer_reading on same vehicle"
    error_id: ERR_ODOMETER_ROLLBACK
    http_status: 409
    applies_to: "POST /emissions-inspections/{id}/record-result"
  - priority: 17
    category: business_fiscal
    check: "TransferApplication.paid_at IS NOT NULL before issue-plate"
    error_id: ERR_PAYMENT_REQUIRED
    http_status: 402
    applies_to: "POST /transfer-applications/{id}/issue-plate"
  - priority: 18
    category: business_constraint
    check: "Owner.outstanding_holds_count == 0 before verify-vin"
    error_id: ERR_OWNER_HAS_HOLDS
    http_status: 409
    applies_to: "POST /vehicles/{id}/transfer-applications/{id}/verify-vin"
  - priority: 19
    category: business_referential
    check: "LienRecord.release requires non-empty release_reference in body"
    error_id: ERR_RELEASE_REFERENCE_REQUIRED
    http_status: 422
    applies_to: "PATCH /lien-records/{id}/release"
  - priority: 20
    category: business_constraint
    check: "Optimistic concurrency: if request supplies version, it must match the resource's current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"
  - priority: 21
    category: business_constraint
    check: "Request body fields conform to declared types and constraints (VIN regex, plate regex, datetime format, numeric ranges)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH/PUT"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/vehicles"
    description: Register a new Vehicle record (intake; does not create Title).
    roles: [VinVerifier, PlatformAdmin]
    code: 201
    input: [vin, make, model, model_year, curb_weight_lbs, fuel_type]
    output: Vehicle
    side_effects: [vin_verification_status defaults to UNVERIFIED]

  - method: GET
    path: "/vehicles/{vehicle_id}"
    description: Read a Vehicle.
    roles: [VinVerifier, TaxAssessor, PlateIssuer, SalvageOfficer, EmissionsInspector, LienClerk, RealIDReviewer, Applicant, PlatformAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: List Vehicles with pagination and filtering.
    roles: [VinVerifier, TaxAssessor, PlateIssuer, SalvageOfficer, EmissionsInspector, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "title_status?", "lien_status?", "fuel_type?"]
    output: "Vehicle[]"
    side_effects: []

  - method: POST
    path: "/vehicles/{vehicle_id}/salvage-event"
    description: Record a salvage damage event; flips title_status.
    roles: [SalvageOfficer]
    code: 200
    input: ["severity (PARTIAL|TOTAL)"]
    output: Vehicle
    side_effects:
      - PARTIAL → Vehicle.title_status := SALVAGE_PENDING_REBUILD
      - TOTAL → Vehicle.title_status := NON_REPAIRABLE
      - Cascade to EmissionsInspection, Plate, TransferApplication (see §1.2)

  - method: POST
    path: "/owners"
    description: Create an Owner.
    roles: [PlatformAdmin, Applicant]
    code: 201
    input: [full_name, date_of_birth, residency_state]
    output: Owner
    side_effects: [is_resident computed from residency_state]

  - method: GET
    path: "/owners/{owner_id}"
    description: Read an Owner.
    roles: [PlatformAdmin, RealIDReviewer, TaxAssessor, PlateIssuer, Applicant]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: POST
    path: "/owners/{owner_id}/real-id-applications"
    description: Submit a REAL ID upgrade application.
    roles: [Applicant]
    code: 201
    input: [documents_proof_of_identity, documents_proof_of_residency, documents_proof_of_ssn]
    output: RealIDApplication
    side_effects: [Owner.real_id_status := PENDING]

  - method: POST
    path: "/real-id-applications/{id}/start-review"
    description: Move SUBMITTED → DOC_REVIEW.
    roles: [RealIDReviewer]
    code: 200
    input: []
    output: RealIDApplication
    side_effects: []

  - method: POST
    path: "/real-id-applications/{id}/approve"
    description: Approve REAL ID after computing eligibility score >= 80.
    roles: [RealIDReviewer]
    code: 200
    input: []
    output: RealIDApplication
    side_effects: [Owner.real_id_status := APPROVED, Owner.real_id_score set, Owner.real_id_expires_at set, RealIDApplication.approved_at set]

  - method: POST
    path: "/real-id-applications/{id}/reject"
    description: Reject REAL ID when score < 80.
    roles: [RealIDReviewer]
    code: 200
    input: []
    output: RealIDApplication
    side_effects: [Owner.real_id_status := PENDING]

  - method: PATCH
    path: "/real-id-applications/{id}/resubmit"
    description: Cycle DOC_REJECTED → SUBMITTED with revised documents.
    roles: [Applicant]
    code: 200
    input: [documents_proof_of_identity, documents_proof_of_residency, documents_proof_of_ssn, "version?"]
    output: RealIDApplication
    side_effects: [revision_count += 1]

  - method: POST
    path: "/real-id-applications/{id}/revoke"
    description: Revoke an APPROVED REAL ID; cascades to Plates and TransferApplications.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RealIDApplication
    side_effects:
      - Owner.real_id_status := REVOKED
      - Cascade: linked Plates ACTIVE → SUSPENDED; in-flight TransferApplications frozen

  - method: POST
    path: "/vehicles/{vehicle_id}/transfer-applications"
    description: Create a new TransferApplication (initial registration or title transfer).
    roles: [Applicant]
    code: 201
    input: [application_type, applicant_owner_id, declared_sale_price, "trade_in_value?"]
    output: TransferApplication
    side_effects: []

  - method: GET
    path: "/transfer-applications/{id}"
    description: Read a TransferApplication.
    roles: [Applicant, VinVerifier, TaxAssessor, PlateIssuer, SalvageOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TransferApplication
    side_effects: []

  - method: GET
    path: "/transfer-applications"
    description: List TransferApplications with filters.
    roles: [PlatformAdmin, VinVerifier, TaxAssessor, PlateIssuer]
    code: 200
    input: ["limit?", "offset?", "status?", "applicant_owner_id?", "vehicle_id?"]
    output: "TransferApplication[]"
    side_effects: []

  - method: POST
    path: "/transfer-applications/{id}/verify-vin"
    description: VinVerifier confirms VIN; may auto-branch into SALVAGE_REVIEW or EMISSIONS_PENDING.
    roles: [VinVerifier]
    code: 200
    input: []
    output: TransferApplication
    side_effects: [Vehicle.vin_verification_status := VERIFIED, vin_verified_at set, status auto-advanced]

  - method: POST
    path: "/transfer-applications/{id}/approve-salvage"
    description: SalvageOfficer decides on a SALVAGE_REVIEW application.
    roles: [SalvageOfficer]
    code: 200
    input: ["decision (APPROVE|DENY)"]
    output: TransferApplication
    side_effects: [Vehicle.title_status := REBUILT on APPROVE, status := REJECTED on DENY for NON_REPAIRABLE]

  - method: POST
    path: "/transfer-applications/{id}/assess-fees"
    description: TaxAssessor runs the three calculations and pins fee_subtotal/processing_fee/total_due.
    roles: [TaxAssessor]
    code: 200
    input: []
    output: TransferApplication
    side_effects:
      - Run sales_tax_on_transfer, registration_fee, total_due_with_processing
      - Append three FeeLedgerEntry rows (SALES_TAX, REG_FEE, PROCESSING_FEE)
      - TransferApplication.status := TAX_ASSESSED

  - method: POST
    path: "/transfer-applications/{id}/mark-paid"
    description: Applicant marks the assessment paid (out-of-band payment).
    roles: [Applicant]
    code: 200
    input: []
    output: TransferApplication
    side_effects: [TransferApplication.paid_at := now()]

  - method: POST
    path: "/transfer-applications/{id}/issue-plate"
    description: PlateIssuer issues an electronic Plate after payment; completes the application.
    roles: [PlateIssuer]
    code: 200
    input: [plate_number]
    output: TransferApplication
    side_effects:
      - Create Plate (status := ACTIVE)
      - TransferApplication.plate_id set
      - Cascade: create new Title, supersede prior Title, surrender prior Plate on TITLE_TRANSFER
      - TransferApplication.status := COMPLETED

  - method: POST
    path: "/transfer-applications/{id}/withdraw"
    description: Applicant withdraws a DRAFT application.
    roles: [Applicant]
    code: 200
    input: []
    output: TransferApplication
    side_effects: [TransferApplication.status := REJECTED, rejection_reason := WITHDRAWN]

  - method: POST
    path: "/emissions-inspections"
    description: Schedule an EmissionsInspection slot at a station.
    roles: [Applicant, EmissionsInspector]
    code: 201
    input: [vehicle_id, station_id, scheduled_start, scheduled_end]
    output: EmissionsInspection
    side_effects: []

  - method: POST
    path: "/emissions-inspections/{id}/start"
    description: Inspector starts the inspection (SCHEDULED → IN_PROGRESS).
    roles: [EmissionsInspector]
    code: 200
    input: []
    output: EmissionsInspection
    side_effects: []

  - method: POST
    path: "/emissions-inspections/{id}/record-result"
    description: Inspector records PASSED or FAILED with odometer reading.
    roles: [EmissionsInspector]
    code: 200
    input: ["outcome (PASSED|FAILED)", odometer_reading]
    output: EmissionsInspection
    side_effects:
      - On PASSED: Vehicle.emissions_expires_at := result_recorded_at + 730d (or null for ELECTRIC)
      - On PASSED: linked TransferApplication in EMISSIONS_PENDING advances to EMISSIONS_PASSED
      - On FAILED: linked TransferApplication in EMISSIONS_PENDING rejected

  - method: DELETE
    path: "/emissions-inspections/{id}"
    description: Cancel a SCHEDULED inspection.
    roles: [EmissionsInspector, Applicant]
    code: 204
    input: []
    output: null
    side_effects: [status := CANCELLED]

  - method: POST
    path: "/titles/{title_id}/lien-records"
    description: Create a LienRecord on the active Title.
    roles: [LienClerk]
    code: 201
    input: [lienholder_name, principal_amount]
    output: LienRecord
    side_effects: [Vehicle.lien_status := ACTIVE]

  - method: PATCH
    path: "/lien-records/{id}/release"
    description: Release an ACTIVE lien with a confirmation reference.
    roles: [LienClerk]
    code: 200
    input: [release_reference, "version?"]
    output: LienRecord
    side_effects: [status := RELEASED, released_at := now(); if last ACTIVE lien on title, Vehicle.lien_status := RELEASED]

  - method: GET
    path: "/plates/{id}"
    description: Read a Plate.
    roles: [PlatformAdmin, Applicant, PlateIssuer]
    code: 200
    input: []
    output: Plate
    side_effects: []

  - method: POST
    path: "/plates/{id}/suspend"
    description: Suspend an ACTIVE Plate.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Plate
    side_effects: [status := SUSPENDED, suspended_at := now()]

  - method: POST
    path: "/plates/{id}/reinstate"
    description: Reinstate a SUSPENDED Plate (cyclic SUSPENDED → ACTIVE).
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Plate
    side_effects: [status := ACTIVE, suspended_at := null]

  - method: POST
    path: "/plates/{id}/surrender"
    description: Surrender a Plate (terminal).
    roles: [PlatformAdmin]
    code: 200
    input: [surrender_reason]
    output: Plate
    side_effects: [status := SURRENDERED]

  - method: GET
    path: "/transfer-applications/{id}/fee-ledger"
    description: List FeeLedgerEntry rows for an application (audit trail for compensating invariant).
    roles: [PlatformAdmin, TaxAssessor, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeeLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/_clock/advance"
    description: Test-driving endpoint to advance the server clock past time-gated transitions (TAX_ASSESSED unpaid-timeout, REAL ID enforcement date 2027-05-07).
    roles: [PlatformAdmin]
    code: 200
    input: ["to (ISO8601 datetime)"]
    output: null
    side_effects:
      - For each TransferApplication in TAX_ASSESSED with now() >= updated_at + 7d AND paid_at IS NULL, revert to EMISSIONS_PASSED and post refund ledger rows
      - Re-evaluate REAL ID enforcement gating on issue-plate calls made after this point

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role header missing"
  - id: ERR_INVALID_ROLE
    http: 403
    condition: "X-User-Role not in declared role set"
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "Role not authorized for the called endpoint"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-resolved resource id does not exist"
  - id: ERR_VIN_ON_HOLD
    http: 409
    condition: "Vehicle.vin_verification_status == HOLD"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Action attempted from a state not listed in the entity's state machine for that transition"
  - id: ERR_VEHICLE_SALVAGE_LOCKED
    http: 409
    condition: "Operation requires Vehicle.title_status IN {CLEAN, REBUILT} but it is SALVAGE_PENDING_REBUILD or NON_REPAIRABLE"
  - id: ERR_EMISSIONS_EXPIRED
    http: 409
    condition: "now() >= Vehicle.emissions_expires_at (boundary inclusive), or emissions_expires_at IS NULL on a non-electric vehicle"
  - id: ERR_OWNER_REAL_ID_REVOKED
    http: 409
    condition: "Owner.real_id_status == REVOKED on a flow that requires not-revoked"
  - id: ERR_LIEN_ACTIVE
    http: 409
    condition: "Vehicle.lien_status == ACTIVE at assess-fees time"
  - id: ERR_INSPECTION_SLOT_OVERLAP
    http: 409
    condition: "Proposed inspection [scheduled_start, scheduled_end) overlaps [start, end+15m) of another non-cancelled inspection at the same station_id"
  - id: ERR_PLATE_NUMBER_TAKEN
    http: 409
    condition: "plate_number is already in use among Plate rows with status IN {ISSUED, ACTIVE, SUSPENDED}"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID called assess-fees and issue-plate for the same TransferApplication"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "RealIDApplication.revision_count >= 3 at resubmit"
  - id: ERR_ODOMETER_ROLLBACK
    http: 409
    condition: "EmissionsInspection.odometer_reading < prior PASSED inspection's odometer_reading on the same vehicle"
  - id: ERR_PAYMENT_REQUIRED
    http: 402
    condition: "TransferApplication.paid_at IS NULL at issue-plate"
  - id: ERR_OWNER_HAS_HOLDS
    http: 409
    condition: "Owner.outstanding_holds_count > 0 at verify-vin"
  - id: ERR_RELEASE_REFERENCE_REQUIRED
    http: 422
    condition: "release_reference body field missing or empty at lien release"
  - id: ERR_LIEN_ALREADY_RELEASED
    http: 409
    condition: "Concurrent release on the same LienRecord; loser observes status already RELEASED"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match the current version on the target resource"
  - id: ERR_VALIDATION
    http: 422
    condition: "Request body shape, type, or numeric range invalid"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "End user — vehicle owner or buyer — driving the transfer/registration."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /vehicles/{vehicle_id}/transfer-applications"
      - "POST /transfer-applications/{id}/mark-paid"
      - "POST /transfer-applications/{id}/withdraw"
      - "POST /owners/{owner_id}/real-id-applications"
      - "PATCH /real-id-applications/{id}/resubmit"
    shared_operations:
      - "POST /emissions-inspections (also EmissionsInspector)"
      - "DELETE /emissions-inspections/{id} (also EmissionsInspector)"
      - "GET endpoints on own Vehicle/TransferApplication/Plate/RealIDApplication"
      - "POST /owners (self-create)"

  - name: VinVerifier
    description: "DMV clerk authorized to perform VIN verification."
    identity: "opaque"
    exclusive_operations:
      - "POST /transfer-applications/{id}/verify-vin"
    shared_operations:
      - "POST /vehicles (also PlatformAdmin)"
      - "GET endpoints on Vehicle and TransferApplication"

  - name: TaxAssessor
    description: "DMV clerk who runs fee/tax calculations."
    identity: "opaque"
    exclusive_operations:
      - "POST /transfer-applications/{id}/assess-fees"
    shared_operations:
      - "GET endpoints on TransferApplication, Vehicle, Owner, FeeLedgerEntry"

  - name: PlateIssuer
    description: "DMV clerk who issues electronic plates."
    identity: "opaque"
    exclusive_operations:
      - "POST /transfer-applications/{id}/issue-plate"
    shared_operations:
      - "GET endpoints on TransferApplication, Vehicle, Plate, Owner"

  - name: SalvageOfficer
    description: "DMV officer who records salvage events and approves rebuilt title transitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles/{vehicle_id}/salvage-event"
      - "POST /transfer-applications/{id}/approve-salvage"
    shared_operations:
      - "GET endpoints on Vehicle, TransferApplication"

  - name: EmissionsInspector
    description: "Inspection station operator."
    identity: "opaque"
    exclusive_operations:
      - "POST /emissions-inspections/{id}/start"
      - "POST /emissions-inspections/{id}/record-result"
    shared_operations:
      - "POST /emissions-inspections (also Applicant)"
      - "DELETE /emissions-inspections/{id} (also Applicant)"
      - "GET endpoints on Vehicle, EmissionsInspection"

  - name: LienClerk
    description: "Records and releases lienholder claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /titles/{title_id}/lien-records"
      - "PATCH /lien-records/{id}/release"
    shared_operations:
      - "GET endpoints on Title, LienRecord, Vehicle"

  - name: RealIDReviewer
    description: "DMV staff reviewing REAL ID document packets."
    identity: "opaque"
    exclusive_operations:
      - "POST /real-id-applications/{id}/start-review"
      - "POST /real-id-applications/{id}/approve"
      - "POST /real-id-applications/{id}/reject"
    shared_operations:
      - "GET endpoints on RealIDApplication, Owner"

  - name: PlatformAdmin
    description: "Operational super-role; can revoke REAL ID, manage Plate lifecycle, advance clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /real-id-applications/{id}/revoke"
      - "POST /plates/{id}/suspend"
      - "POST /plates/{id}/reinstate"
      - "POST /plates/{id}/surrender"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /vehicles (also VinVerifier)"
      - "POST /owners (also Applicant)"
      - "GET endpoints on all resources"
