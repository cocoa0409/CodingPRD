          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Tilapia, 10.000 kg remaining, landed cost 1700 cents/kg, retail 2300 cents/kg, CASED in slot 1"
            - "one PUBLISHED CaseLabel for that lot carrying no certification"
            - "VerificationSample on that lot in status IN_LAB; Supplier has no prior samples"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
