      - name: bid_missing_x_user_id_header_returns_unauthenticated
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - roles.Bidder.identity
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Header authentication is evaluated before every other layer: the request carries a valid X-User-Role of Bidder but NO X-User-ID header at all, so it returns HTTP 401 ERR_UNAUTHENTICATED rather than the 403 or 404 the same path would otherwise produce - proven by the contrasting call that supplies a resolvable X-User-ID and reaches the existence layer with 404."
        test_recipe:
          setup:
            - "One Bidder row, so a resolvable X-User-ID exists for the contrast call."
            - "No DispositionOffering rows; the offering id below is a fabricated UUID."
            - "The first trigger call omits the X-User-ID header entirely - as_user_id is deliberately absent."
          setup_api_calls:
            - call: "POST /bidders"
              payload: { legal_name: "Canal Yard Holdings LLC", entity_type: "CORPORATION", contact_email: "deals@canalyard.example" }
              as: SystemAdministrator
              captures: { bidder_id: "$.data.id" }
          trigger:
            - call: "POST /offerings/00000000-0000-0000-0000-0000000000ff/bids"
              payload: { amount_cents: 108000000, deposit_amount_cents: 5000000 }
              as: Bidder
            - call: "POST /offerings/00000000-0000-0000-0000-0000000000ff/bids"
              payload: { amount_cents: 108000000, deposit_amount_cents: 5000000 }
              as: Bidder
              as_user_id: "${bidder_id}"
          assert:
            - "the header-less attempt is HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the attempt with a resolvable X-User-ID is HTTP 404 with data.error_id == ERR_OFFERING_NOT_FOUND"
            - "Bidder.${bidder_id}.available_funds_cents == 0 and escrow_held_cents == 0"
            - "GET /bids returns total_count == 0"

      - name: entity_backed_bidder_id_not_resolvable_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles.Bidder.identity
          - validations[priority=4]
          - errors[ERR_IDENTITY_NOT_RESOLVABLE]
        distinguishing_aspect: "The entity-backed identity check sits between the role gate and path existence: an X-User-ID that is a perfectly real Agency id but resolves to no Bidder row yields HTTP 403 ERR_IDENTITY_NOT_RESOLVABLE, not 401 (the header is present), not ERR_BIDDER_NOT_FOUND, and not the 404 that the same fabricated offering id produces for a genuine Bidder principal."
        test_recipe:
          setup:
            - "One Agency and one Bidder; the Agency id will be presented as a Bidder principal."
            - "No DispositionOffering rows; the offering id below is a fabricated UUID."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /bidders"
              payload: { legal_name: "Canal Yard Holdings LLC", entity_type: "CORPORATION", contact_email: "deals@canalyard.example" }
              as: SystemAdministrator
              captures: { bidder_id: "$.data.id" }
          trigger:
            - call: "POST /offerings/00000000-0000-0000-0000-0000000000ff/bids"
              payload: { amount_cents: 108000000, deposit_amount_cents: 5000000 }
              as: Bidder
              as_user_id: "${cust_agency_id}"
            - call: "POST /offerings/00000000-0000-0000-0000-0000000000ff/bids"
              payload: { amount_cents: 108000000, deposit_amount_cents: 5000000 }
              as: Bidder
              as_user_id: "${bidder_id}"
          assert:
            - "the agency-id attempt is HTTP 403 with data.error_id == ERR_IDENTITY_NOT_RESOLVABLE"
            - "the genuine-bidder attempt is HTTP 404 with data.error_id == ERR_OFFERING_NOT_FOUND"
            - "GET /bids returns total_count == 0"

  - section: cross_cutting_complexity_layers
    instances:
      - name: appraisal_order_with_stale_parcel_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appraisal-order-stale-parcel]
          - validations[priority=13]
          - errors[ERR_STALE_PARCEL_VERSION]
        distinguishing_aspect: "The first appraisal order consumes the parcel's OCC token and bumps Parcel.version from 1 to 2, so replaying the SAME expected_parcel_version returns HTTP 412 ERR_STALE_PARCEL_VERSION even though every other precondition still holds (licence ACTIVE, capacity 1 of 2 used); the rejected write consumes no token, so a re-read followed by the identical payload with the fresh version succeeds and bumps version to 3."
        test_recipe:
          setup:
            - "One Agency, one Parcel at version 1 and one Appraiser with an ACTIVE licence."
            - "No appraisal exists yet, so the first order is unobstructed."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-181", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id", parcel_v: "$.data.version" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44281", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
              captures: { appraisal_1_id: "$.data.id" }
