            - call: "POST /fundraising/agencies/${ag}/reviews/aaaaaaaa-0000-4000-8000-000000000009/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
              captures: { e9: $.data.error_id }
          assert:
            - "Leg 1: 404 ERR_EMPLOYER_NOT_FOUND"
            - "Leg 2: 404 ERR_CAMPAIGN_NOT_FOUND"
            - "Leg 3: 404 ERR_PLEDGE_NOT_FOUND"
            - "Leg 4: 404 ERR_AGENCY_NOT_FOUND"
            - "Leg 5: 404 ERR_CYCLE_NOT_FOUND"
            - "Leg 6: 404 ERR_REQUEST_NOT_FOUND"
            - "Leg 7: 404 ERR_PANELIST_NOT_FOUND"
            - "Leg 8: 404 ERR_OUTCOME_REPORT_NOT_FOUND"
            - "Leg 9: 404 ERR_AGENCY_REVIEW_NOT_FOUND (nested id, real parent) - not ERR_AGENCY_NOT_FOUND and not ERR_REVIEW_AGENCY_MISMATCH"
            - "Every error body carries data.error_id and data.message plus the standard meta.api_request_id / meta.api_request_timestamp envelope"

      - name: campaign_and_pledge_state_gate_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CAMPAIGN_NOT_OPEN
          - errors.ERR_PLEDGE_NOT_CONFIRMED
          - errors.ERR_COLLECTION_EXCEEDS_OUTSTANDING
          - errors.ERR_CAMPAIGN_NOT_FULLY_REMITTED
          - errors.ERR_DUPLICATE_DONOR_REFERENCE
          - validations.priority_11
          - validations.priority_13
          - validations.priority_33
          - validations.priority_43
          - validations.priority_44
        distinguishing_aspect: |
          Five campaign/pledge gates are triggered along one advancing chain, each at the only
          moment it is reachable: a pledge on a PLANNED campaign (ERR_CAMPAIGN_NOT_OPEN), a repeat
          donor_reference inside the same campaign (ERR_DUPLICATE_DONOR_REFERENCE), a remittance
          against a still-DRAFT pledge (ERR_PLEDGE_NOT_CONFIRMED), a 600.00 remittance against a
          500.00 outstanding balance (ERR_COLLECTION_EXCEEDS_OUTSTANDING) and reconcile while the
          confirmed pledge is still PENDING (ERR_CAMPAIGN_NOT_FULLY_REMITTED).
        test_recipe:
          setup:
            - "One ACTIVE employer with a PLANNED campaign; the campaign is opened partway through the trigger sequence."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Gale Harbor Shipping", employee_count: 180 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "G-001", giving_method: "ONE_TIME_CHECK", gross_amount: 500.00 }
              as: UnitedFundAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "G-001", giving_method: "ONE_TIME_CHECK", gross_amount: 500.00 }
              as: UnitedFundAdmin
              captures: { pl: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "G-001", giving_method: "CREDIT_CARD", gross_amount: 75.00 }
              as: UnitedFundAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /fundraising/pledges/${pl}/collections"
              payload: { amount: 100.00, remitted_on: "2026-08-01" }
              as: FinanceReviewer
              captures: { e3: $.data.error_id }
            - call: "POST /fundraising/pledges/${pl}/confirm"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/pledges/${pl}/collections"
              payload: { amount: 600.00, remitted_on: "2026-08-01" }
              as: FinanceReviewer
              captures: { e4: $.data.error_id }
            - call: "POST /fundraising/campaigns/${camp}/close-solicitation"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/reconcile"
              payload: {}
              as: FinanceReviewer
              captures: { e5: $.data.error_id }
          assert:
            - "Leg 1 (PLANNED campaign): 409 ERR_CAMPAIGN_NOT_OPEN"
            - "Leg 3 (repeat donor_reference G-001 in the same campaign): 409 ERR_DUPLICATE_DONOR_REFERENCE"
            - "Leg 4 (remittance on a DRAFT pledge): 409 ERR_PLEDGE_NOT_CONFIRMED"
            - "Leg 6 (600.00 against a 500.00 outstanding balance): 422 ERR_COLLECTION_EXCEEDS_OUTSTANDING"
            - "Leg 8 (reconcile with the CONFIRMED pledge still collection_status PENDING): 422 ERR_CAMPAIGN_NOT_FULLY_REMITTED"
            - "Pledge.${pl}.collected_amount == 0.00 and collection_status == PENDING after both refused remittances"
            - "Campaign.${camp}.posture == SOLICITATION_CLOSED after the refused reconcile"
            - "Campaign.${camp}.confirmed_gross_total == 500.00"

      - name: cycle_and_request_gate_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PANEL_NOT_SEATED
          - errors.ERR_CYCLE_NOT_OPEN
          - errors.ERR_AWARD_EXCEEDS_AGENCY_CAP
          - errors.ERR_DUPLICATE_REQUEST_FOR_CYCLE
          - errors.ERR_REQUEST_INVALID_STATE
          - errors.ERR_PANELIST_CONFLICT_DECLARED
          - errors.ERR_PANELIST_NOT_ASSIGNED
          - errors.ERR_DUPLICATE_PANEL_SCORE
          - validations.priority_40
          - validations.priority_18
          - validations.priority_20
          - validations.priority_22
          - validations.priority_34
          - validations.priority_35
          - validations.priority_38
        distinguishing_aspect: |
          Eight cycle- and panel-side gates are triggered on one cycle, each at its own reachable
          moment: open with no seat (ERR_PANEL_NOT_SEATED), submit while the cycle is still DRAFT
          (ERR_CYCLE_NOT_OPEN), submit 50000.00 against a 20000.00 cap x REQUEST_CAP_MULTIPLE 2.0
          = 40000.00 ceiling (ERR_AWARD_EXCEEDS_AGENCY_CAP), a second request by the same agency on
          the same cycle (ERR_DUPLICATE_REQUEST_FOR_CYCLE), a score on a still-DRAFT request
          (ERR_REQUEST_INVALID_STATE, priority 20 beating priority 34), a score from the panelist
          who declared a conflict (ERR_PANELIST_CONFLICT_DECLARED), a score from an unseated
          panelist (ERR_PANELIST_NOT_ASSIGNED) and a second score from the same seated panelist
          (ERR_DUPLICATE_PANEL_SCORE).
        test_recipe:
          setup:
            - "Two GOOD_STANDING agencies (A and B), three panelists: P1 seated conflict-free, P2 seated with conflict_declared true, P3 never seated."
            - "One cycle: max_award_per_agency 20000.00, opening pool 100000.00, window 2026-07-01..2026-10-01, clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Alder Grove Services", ein: "620000002", primary_priority_area: "BASIC_NEEDS" }
              as: UnitedFundAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /fundraising/agencies/${ag_a}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
