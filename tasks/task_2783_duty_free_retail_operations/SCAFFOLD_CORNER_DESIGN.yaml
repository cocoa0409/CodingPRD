              as: SalesAssociate
              captures: { it_104: $.data.id }
            - call: "POST /itineraries/${it_104}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0104" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_104}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_104: $.data.id, sale_104_v: $.data.version }
            - call: "POST /sales/${sale_104}/lines"
