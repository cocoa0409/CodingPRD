              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Iris Kwon", is_program_director: true, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { pd_id: "$.data.id" }
            - call: "POST /faculty-members"
