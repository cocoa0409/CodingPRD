              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
