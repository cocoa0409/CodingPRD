            - "HIT.${hit1}.escrowed_cents == 0 and Requester.${rid}.lifetime_spent_cents == 100"

      - name: rate_threshold_reset_by_admin_overturn_revokes_cascade_grant
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.requester_rejection_rate
          - state_machines.Assignment.transitions.DISPUTED_to_APPROVED
          - entities.WorkerQualification.fields.status
        distinguishing_aspect: "An admin overturn flips a rejection to an approval, which re-derives the worker's approval rate and revokes the CASCADE grant that the prior rate had minted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Qualification type RateGate (auto threshold 100, default score 60) plus two 1-slot HITs; W1 has one approval (elevating rate to 100 and minting the grant) and one rejection-disputed assignment."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/qualification-types"
              payload: { name: "RateGate", kind: "SYSTEM", auto_assign_threshold_pct: 100, default_score: 60 }
              as: PlatformAdmin
              captures: { qt1: $.data.id }
            - call: "POST /mkt/requesters"
              payload: { name: "Acme RateThresh" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "RateThresh A", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hA: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "RateThresh B", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hB: $.data.id }
            - call: "POST /mkt/hits/${hA}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hB}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 RateThresh", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hA}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aA: $.data.id, aA_v: $.data.version }
            - call: "POST /mkt/hits/${hB}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aB: $.data.id, aB_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${aA}/submit"
              payload: { expected_assignment_version: "${aA_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${aB}/submit"
              payload: { expected_assignment_version: "${aB_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${aA}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${aB}/reject"
              payload: { reason: "incomplete" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:50:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${aB}/dispute"
              payload: { reason: "I was complete" }
              as: Worker
              as_user_id: "${w1}"
          trigger:
            - call: "POST /mkt/assignments/${aB}/admin-resolve"
              payload: { decision: "APPROVE", reason: "overturned" }
              as: PlatformAdmin
          assert:
            - "Worker.${w1}.rejected_count == 0 and approved_count == 2, so approval_rate_pct == 100"
            - "GET /mkt/worker-qualifications?worker_id=${w1} returns the RateGate grant with status == ACTIVE"
            - "the RateGate grant row for ${w1} is the single upserted row and carries source == CASCADE"

      - name: derived_field_reconciliation_tracks_accepted_returns
        claim_type: derived_field_reconciliation
        grounds:
          - entities.HIT.fields.assignment_count
          - entities.HIT.fields.committed_assignments
          - state_machines.Assignment.transitions.ACCEPTED_to_RETURNED
        distinguishing_aspect: "Returning an ACCEPTED assignment drops assignment_count and committed_assignments back to 0 while accepted_count stays at 1, so the derived counters diverge exactly as the return semantics require."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One 1-slot 100c HIT with time_limit_minutes 300; W1 accepted the slot at T0 and has not submitted."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Derived" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Derived Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Derived", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /mkt/assignments/${a1}/return"
              payload: {}
              as: Worker
              as_user_id: "${w1}"
          assert:
            - "after return: HIT.${hit1}.assignment_count == 0 and HIT.${hit1}.committed_assignments == 0"
            - "HIT.${hit1}.accepted_count == 1 — the pool does not refill"
            - "Assignment.${a1}.status == RETURNED and Worker.${w1}.returned_count == 1"
            - "a replacement acceptance is refused with ERR_HIT_MAX_ASSIGNMENTS_REACHED"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_reflects_escrow_in_the_publish_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/mkt/hits/{hit_id}/publish
        distinguishing_aspect: "The escrow debit and the HIT status change are both visible in the publish response itself and on an immediately following requester read, with no lag."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester deposited 2000c and owns a DRAFT HIT needing 125c."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Immediate" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Immediate Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
          trigger:
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "GET /mkt/requesters/${rid}"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "the publish response already carries HIT.${hit1}.status == PUBLISHED"
            - "the immediately following requester read returns prepaid_balance_cents == 1875 and escrowed_cents == 125"
            - "no re-read or delay is needed for the escrow to be reflected"
