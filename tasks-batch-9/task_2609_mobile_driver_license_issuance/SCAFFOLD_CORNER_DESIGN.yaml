      - name: five_hop_address_cascade_end_to_end_corner
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /mdl/holders/{id}/address-change]
        distinguishing_aspect: "One address change must propagate through all five hops in one request: order -> deliveries -> credential sync_state -> aborted presentations -> verifier open_session_count."
        excluded_because:
          difficulty_instance: transitive_cascade / address_change_five_hop_cascade_aborts_open_presentation
          rationale: "That §1.8 instance already walks the whole five-hop chain end-to-end from a single address-change call and pins every intermediate counter, which is exactly this layer's end-to-end claim."

      - name: cascade_ordering_sensitivity_corner
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /mdl/devices/{id}/report-lost]
        distinguishing_aspect: "Hop ordering is observable: the revocation entry must exist before the trust-list pointer is marked stale, so an implementation that stales the pointer without appending the entry is detectable."
        excluded_because:
          difficulty_instance: transitive_cascade / device_loss_three_hop_cascade_stales_trust_list_pointer
          rationale: "That §1.8 instance pins the ordered three-hop chain (credential suspension -> revocation entry -> stale trust-list pointer with pending_delta_count 1), which is the ordering-sensitivity claim for this layer."

      - name: proofing_assurance_variant_divergence_layer_corner
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[proofing_assurance_score].variants
        distinguishing_aspect: "The OPTIMISTIC preview and the STRICT adjudication variant must produce different scores on the same evidence set, and the delta must be exactly the repeat-attempt penalty and superseded-evidence difference."
        excluded_because:
          difficulty_instance: dual_variant_calc / proofing_strict_latest_evidence_diverges_from_optimistic_preview
          rationale: "That §1.8 instance reads the preview and then adjudicates the same session, asserting both variant results and their delta in one test."

      - name: exposure_variant_divergence_corner
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[verifier_exposure_index].variants
        distinguishing_aspect: "ROLLING_WINDOW and SINCE_LAST_ATTESTATION must diverge when a log entry sits inside one window and outside the other, and GET /mdl/verifiers/{id}/exposure-index must show both numbers side by side."
        excluded_because:
          difficulty_instance: dual_variant_calc / verifier_exposure_rolling_window_diverges_from_since_attestation
          rationale: "That §1.8 instance builds a log where one entry falls outside the 30-day rolling window but inside the since-attestation window and pins both variant indices from the same read."

