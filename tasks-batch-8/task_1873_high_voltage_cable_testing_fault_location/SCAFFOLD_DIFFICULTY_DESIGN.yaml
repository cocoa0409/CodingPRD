  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: outage_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.OutageWindow.fields.window_start
        distinguishing_aspect: |
          Resource CableCircuit, half-open [start, end) semantics: window B starting
          exactly when window A ends (12:00 == 12:00) is accepted, while window C
          starting one minute earlier (11:59) collides and is rejected
          ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Circuit C only (no jobs needed)."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-TO1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: NetworkPlanner, captures: { wa: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "REPAIR_RESTORE", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T14:00:00Z" }, as: NetworkPlanner, captures: { wb: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "EMERGENCY_FAULT", window_start: "2026-08-10T11:59:00Z", window_end: "2026-08-10T13:00:00Z" }, as: NetworkPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "windows A and B both created (201) — adjacency under half-open semantics is not overlap"
            - "window C rejected: error_id == ERR_WINDOW_OVERLAP, http 409"

      - name: unit_back_to_back_rejected_by_buffer
        grounds:
          - validations[priority=17]
          - entities.EquipmentAssignment.fields.mobilize_at
        distinguishing_aspect: |
          Resource MobileUnit, buffer-gap semantics (NOT half-open): an assignment whose
          mobilize_at equals the previous assignment's demobilize_at (zero gap) is
          rejected ERR_UNIT_OVERLAP_BUFFER because equipment requires a 4h turn-around
          buffer — the exact pattern that outage windows on a circuit allow.
        test_recipe:
          setup:
            - "Circuit, APPROVED window, PLANNED job; unit VAN-1 with assignment A1 [2026-08-10T07:00Z, 2026-08-10T11:00Z]."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-TO2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: "$.data.id" } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: "$.data.id" } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T11:00:00Z", demobilize_at: "2026-08-10T15:00:00Z" }, as: DispatchCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNIT_OVERLAP_BUFFER, http 409 (zero-gap adjacency violates the 4h buffer rule)"
            - "MobileUnit.${u}.committed_hours == 4.0 (unchanged)"

      - name: dig_contained_inclusive_edges
        grounds:
          - validations[priority=13]
          - entities.ExcavationOrder.fields.dig_end
        distinguishing_aspect: |
          Resource pair ExcavationOrder x OutageWindow, CONTAINMENT semantics (distinct
          from both overlap tests): a dig window may touch the outage window's edges
          (dig_end == window_end accepted, inclusive), but one minute beyond
          (12:01 > 12:00) is rejected ERR_DIG_OUTSIDE_OUTAGE.
        test_recipe:
          setup:
            - "Circuit C (length 1000); job IN_PROGRESS; series S1 FAIL -> fault F1 pinpointed (corridor [1404.0, 1716.0]); window [2026-08-10T08:00Z, 2026-08-12T12:00Z] ACTIVE; clock 2026-08-10T09:00Z."
          setup_api_calls:
