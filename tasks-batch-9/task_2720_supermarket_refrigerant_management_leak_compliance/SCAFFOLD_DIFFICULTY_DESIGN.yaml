          assert:
            - "LeakEvent.${event_id}.status == VERIFICATION_PENDING (re-entered, not a first visit)"
            - "LeakEvent.${event_id}.repair_attempt_count == 2"
            - "LeakEvent.${event_id}.failed_verification_count == 1 (carried across the cycle)"
            - "LeakEvent.${event_id}.verification_deadline == 2026-08-17T09:00:00Z"
            - "LeakEvent.${event_id}.last_repair_completed_at == 2026-08-07T09:00:00Z"
            - "LeakEvent.${event_id}.initial_repair_deadline == 2026-08-31T00:00:00Z (unmoved by the cycle)"
            - "RepairAttempt.${attempt1_id}.outcome == FAILED_VERIFICATION"
            - "RepairAttempt.${attempt2_id}.outcome == AWAITING_VERIFICATION"
            - "RepairAttempt.${attempt2_id}.attempt_number == 2"
            - "VerificationTest.${test1_id}.test_sequence == INITIAL_VERIFICATION"

      - name: retrofit_plan_rejection_resubmission_loop_increments_submission_count
        grounds:
          - state_machines.RetrofitPlan.SUBMITTED_to_REJECTED
          - state_machines.RetrofitPlan.REJECTED_to_SUBMITTED
          - entities.RetrofitPlan.fields.submission_count
          - entities.RetrofitPlan.fields.rejection_reason_code
        distinguishing_aspect: |
          A different entity's cyclic shape - the RetrofitPlan revision loop.
          SUBMITTED -> REJECTED -> SUBMITTED returns the plan to a state it has
          already held, but submission_count is the loop odometer (2 after the
          second pass) and submitted_at is re-stamped to the later clock while
          decided_at still carries the rejection instant, so the second visit is
          observably not the first. Unlike the LeakEvent loop this one is driven
          by two different roles alternating (ComplianceManager submits,
          Regulator rejects).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A and R-448A chemistries, SYS1 charged with R-404A."
            - "A DRAFT RETROFIT plan targeting R-448A (compatibility 84.1 COMPATIBLE) is submitted once and rejected by the Regulator with reason SCOPE_INSUFFICIENT."
            - "Clock advances to 2026-08-10T00:00:00Z before the resubmission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-448A", gwp: 1387, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "ALLOWED" }
              as: ComplianceManager
              captures: { rt448_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETROFIT", target_refrigerant_type_id: "${rt448_id}", due_on: "2026-11-06T00:00:00Z", estimated_cost_usd: 125000.00, expected_system_version: "${sys1_v}" }
              as: ComplianceManager
              captures: { plan_id: $.data.id }
            - call: "POST /retrofit-plans/${plan_id}/submission"
              payload: { submission_note: "initial filing" }
              as: ComplianceManager
              captures: { first_submitted_at: $.data.submitted_at, first_count: $.data.submission_count }
            - call: "POST /retrofit-plans/${plan_id}/decision"
              payload: { decision: "REJECT", rejection_reason_code: "SCOPE_INSUFFICIENT" }
              as: Regulator
              captures: { rejected_at: $.data.decided_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /retrofit-plans/${plan_id}/submission"
              payload: { submission_note: "revised scope, same target chemistry" }
              as: ComplianceManager
              captures: { second_submitted_at: $.data.submitted_at, second_count: $.data.submission_count }
          assert:
            - "first pass: RetrofitPlan.${plan_id}.submission_count == 1 and submitted_at == 2026-08-01T00:00:00Z"
            - "after the rejection: RetrofitPlan.${plan_id}.status == REJECTED and rejection_reason_code == SCOPE_INSUFFICIENT and decided_at == 2026-08-01T00:00:00Z"
            - "RetrofitPlan.${plan_id}.status == SUBMITTED (second visit)"
            - "RetrofitPlan.${plan_id}.submission_count == 2"
            - "RetrofitPlan.${plan_id}.submitted_at == 2026-08-10T00:00:00Z"
            - "RetrofitPlan.${plan_id}.decided_at == 2026-08-01T00:00:00Z (the rejection instant is not cleared by resubmission)"
            - "RetrofitPlan.${plan_id}.compatibility_score == 84.1 (recomputed to the same value)"

      - name: system_operational_and_compliance_axes_move_independently_then_retirement_overrides
        grounds:
          - state_machines.RefrigerantSystem.COMPLIANT_to_LEAK_OPEN
          - state_machines.RefrigerantSystem.ACTIVE_to_RETIRED
          - state_machines.RefrigerantSystem.LEAK_OPEN_to_RETIRED_EXEMPT
          - state_machines.LeakEvent.OPEN_to_VOIDED
          - entities.RefrigerantSystem.fields.operational_status
          - entities.RefrigerantSystem.fields.compliance_state
        distinguishing_aspect: |
          Parallel shape on a third entity: RefrigerantSystem carries two
          independent state axes. compliance_state advances COMPLIANT ->
          LEAK_OPEN while operational_status is untouched at ACTIVE, proving the
          axes are not one combined state; then the single retirement call moves
          axis 1 to RETIRED and forces axis 2 to RETIRED_EXEMPT by the pinned
          precedence RETIRED_EXEMPT > RETROFIT_MANDATED > CHRONIC_EXCEEDANCE >
          LEAK_OPEN, which is the only place one axis dictates the other.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A."
            - "SYS_R: full_charge_lbs 60.0 (REGULATED), initial_charge_lbs 0.0 (already fully recovered), installed_on 2025-03-01T00:00:00Z."
            - "A manually declared LeakEvent (MANUAL_INSPECTION, detected_at 2026-08-01T00:00:00Z) puts compliance_state at LEAK_OPEN with operational_status still ACTIVE."
            - "An APPROVED RETIRE plan exists so the retirement is permitted despite the non-terminal LeakEvent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-03-01T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sysr_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sysr_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id }
            - call: "GET /systems/${sysr_id}"
              payload: {}
              as: ComplianceManager
              captures: { axis1_before: $.data.operational_status, axis2_before: $.data.compliance_state, sysr_v: $.data.version }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sysr_id}", plan_type: "RETIRE", due_on: "2026-10-30T00:00:00Z", estimated_cost_usd: 42000.00, expected_system_version: "${sysr_v}" }
              as: ComplianceManager
              captures: { plan_id: $.data.id, plan_result: $.data.compatibility_result }
            - call: "POST /retrofit-plans/${plan_id}/submission"
              payload: {}
              as: ComplianceManager
            - call: "POST /retrofit-plans/${plan_id}/decision"
              payload: { decision: "APPROVE" }
              as: Regulator
          trigger:
            - call: "POST /systems/${sysr_id}/retirement"
              payload: { retirement_reason_code: "END_OF_LIFE_REPLACEMENT", retrofit_plan_id: "${plan_id}" }
              as: ComplianceManager
              captures: { axis1_after: $.data.operational_status, axis2_after: $.data.compliance_state }
          assert:
            - "before the trigger: RefrigerantSystem.${sysr_id}.operational_status == ACTIVE while compliance_state == LEAK_OPEN"
            - "RetrofitPlan.${plan_id}.compatibility_score == 100.0 and compatibility_result == COMPATIBLE (RETIRE plans bypass chemistry scoring)"
            - "RetrofitPlan.${plan_id}.gwp_reduction_pct == 0.0"
            - "after the trigger: RefrigerantSystem.${sysr_id}.operational_status == RETIRED and retired_on == 2026-08-01T00:00:00Z"
            - "RefrigerantSystem.${sysr_id}.compliance_state == RETIRED_EXEMPT"
            - "LeakEvent.${event_id}.status == VOIDED with closed_at == 2026-08-01T00:00:00Z"
            - "Store.${store_id}.open_leak_event_count == 0, regulated_system_count == 0, compliance_status == COMPLIANT"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: second_failed_verification_cascades_event_system_store_and_penalty
        grounds:
          - state_machines.LeakEvent.VERIFICATION_PENDING_to_RETROFIT_MANDATED
          - state_machines.RefrigerantSystem.LEAK_OPEN_to_RETROFIT_MANDATED
          - calculations.store_compliance_posture
          - calculations.inspection_penalty_exposure
          - entities.RefrigerantSystem.fields.retrofit_due_on
          - entities.Store.fields.mandated_retrofit_count
        distinguishing_aspect: |
          Depth-4 escalating chain in which every link is caused strictly by the
          previous one, not by the trigger: the second FAIL only touches the
          VerificationTest and the LeakEvent (link 1); the LeakEvent reaching
          RETROFIT_MANDATED is what drags RefrigerantSystem.compliance_state to
          RETROFIT_MANDATED and stamps retrofit_due_on (link 2); that system
          state is the sole reason Store.mandated_retrofit_count becomes 1 and
          the posture becomes NON_COMPLIANT (link 3); and the posture change is
          the sole reason a pre-existing OPEN Inspection is re-priced from
          688.88 (multiplier 1.25) to 826.66 (multiplier 1.50) and the store's
          exposure total follows (link 4). Cutting any link leaves the later
          ones with no cause.
