            - "InterferenceCoordination.${coord_id}.round_number == 3"
            - "InterferenceCoordination.${coord_id}.status == REQUESTED"
            - "InterferenceCoordination.${coord_id}.proposed_eirp_dbm == 40.0"
            - "InterferenceCoordination.${coord_id}.version == ${coord_v_round3}"
