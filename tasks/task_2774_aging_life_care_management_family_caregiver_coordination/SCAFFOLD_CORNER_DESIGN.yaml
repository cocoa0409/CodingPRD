              captures: { err_coi_pending: $.data.error_id }
            - call: "POST /care/service-authorizations/${auth}/coi-events"
              payload: { action: "DISCLOSE", note: "Referral relationship disclosed to Tor Okoye" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { coi1: $.data.coi_status }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
