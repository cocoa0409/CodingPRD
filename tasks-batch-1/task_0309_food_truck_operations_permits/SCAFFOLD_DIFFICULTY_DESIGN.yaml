  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_lifecycle_x_payment_dimensions
        grounds:
          - state_machines.Order.OPEN_to_VOID
          - state_machines.Order.CAPTURED_to_REFUNDED
          - entities.Order.fields.lifecycle_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: "Parallel state dimensions on Order: lifecycle_status (OPEN->VOID) and payment_status (CAPTURED->REFUNDED) evolve on the same row independently; voiding a CAPTURED order moves lifecycle to VOID AND payment to REFUNDED in one step."
        test_recipe:
          setup:
            - "An OPEN order with one line, payment CAPTURED (lifecycle_status=OPEN, payment_status=CAPTURED) under an ARRIVED booking on an OPERABLE truck."
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "Central", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
