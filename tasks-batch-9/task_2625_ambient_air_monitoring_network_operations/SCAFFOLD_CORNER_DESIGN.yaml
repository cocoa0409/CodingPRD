              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /data-batches"
              payload: { monitor_id: "${mon_id}", year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.0 }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { b_id: "$.data.id", b_v0: "$.data.version" }
          trigger:
            - call: "POST /data-batches/${b_id}/invalidations"
              payload: { start_hour_index: 0, end_hour_index: 24, invalidation_code: "QC_FAILURE", expected_data_batch_version: "${b_v0}" }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { inv_id: "$.data.id" }
            - call: "POST /exceptional-event-demonstrations"
