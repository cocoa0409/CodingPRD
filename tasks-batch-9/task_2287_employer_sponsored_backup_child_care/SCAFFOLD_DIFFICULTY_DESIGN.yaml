  - rule_id: transitive_cascade
    instances:

      - name: credential_revoke_cascades_credential_provider_reservation_ledger_block
        grounds:
          - state_machines.Credential.VALID_to_REVOKED
          - state_machines.Provider.CREDENTIALED_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_MATCHING
          - entities.UsageLedgerEntry.fields.entry_type
          - entities.Employee.fields.entitlement_days_reserved
          - entities.CapacityBlock.fields.reserved_slots
          - validations[priority=910]
        distinguishing_aspect: |
          Depth-4 cascade from a single POST /backup-care/credentials/{id}/revoke, where each link is
          CAUSED BY the previous one: (1) Credential VALID -> REVOKED causes (2) Provider
          CREDENTIALED -> SUSPENDED because a REQUIRED_CREDENTIAL_TYPES member is no longer VALID,
          which causes (3) the CONFIRMED Reservation matched to that provider to move CONFIRMED ->
          MATCHING, which causes (4) a RELEASE UsageLedgerEntry plus recomputation of
          Employee.entitlement_days_reserved and of CapacityBlock.reserved_slots with a version bump.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer + ACTIVE plan (annual_use_limit_days 10, copay_center_cents_per_day 1500)."
            - "Employee with two ACTIVE CHILD dependents."
            - "One CENTER_BASED CREDENTIALED provider with all four required credentials and an OPEN block on 2026-08-10 08:00Z-18:00Z, total_slots 4."
            - "One Reservation CONFIRMED against that block for two dependents: required_seats 2, days_charged_provisional 2, covered_days 2, copay_cents 3000."
            - "CapacityBlock.reserved_slots == 2 and Employee.entitlement_days_reserved == 2 before the trigger."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
