      - name: suspension_cascade_cancels_reserved_slots_but_spares_the_in_build_slot
        claim_type: Conditional cascade
        grounds:
          - state_machines.CertificationListing["LISTED -> SUSPENDED"].side_effects
          - state_machines.ProductionSlot
          - validations[priority=24]
        distinguishing_aspect: "Cascade hop 4 is state-conditional: it cancels only slots in {RESERVED, CONFIRMED}, so an IN_BUILD slot on the same site order survives, BuildLine.committed_units falls by exactly the cancelled slot's units, the site order keeps fulfillment_status IN_BUILD (no hop-5 reset) and its projection re-selects the surviving slot -- yet the surviving slot can no longer be completed because its configuration now sits on COMPLIANCE_HOLD."
