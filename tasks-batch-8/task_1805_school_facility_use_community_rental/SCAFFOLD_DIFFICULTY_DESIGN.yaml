            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Fall Carnival", headcount_estimate: 200, starts_at: "2026-11-14T01:00:00Z", ends_at: "2026-11-14T05:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
            - call: "POST /district/requests/${req_id}/request_revision"
              payload: { revision_note: "Reduce headcount or provide crowd plan" }
              as: SiteCoordinator
            - call: "POST /district/renters/${org_id}/requests/${req_id}/resubmit"
              payload: { headcount_estimate: 150 }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
