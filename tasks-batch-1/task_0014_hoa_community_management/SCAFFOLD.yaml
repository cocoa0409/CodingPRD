scenario: |
  HOA Community Management: regular/special assessments, late fees, ACC architectural
  approval (appearance/landscaping), board elections, violation fines, mortgage Lien,
  Reserve fund study.

domain_name: hoa-community-management
api_prefix: /hoa

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: HOA community legal name
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: Month (1-12) the HOA fiscal year begins; used to align reserve studies and elections
        constraints: 1..12
      - name: regular_assessment_cents
        type: integer
        source: input
        description: Monthly regular assessment in integer cents charged to every Property
        constraints: ">= 0"
      - name: late_fee_grace_days
        type: integer
        source: input
        description: Days after due_date before a late fee is applied
        default: 15
      - name: late_fee_flat_cents
        type: integer
        source: input
        description: Flat late fee added per overdue Assessment per grace cycle
        default: 2500
      - name: late_fee_pct_bps
        type: integer
        source: input
        description: Additional late fee, expressed in basis points of the overdue principal (e.g., 1000 = 10%)
        default: 1000
      - name: lien_threshold_cents
        type: integer
        source: input
        description: Aggregate delinquency on a Property at which an automatic Lien may be filed
        default: 250000
      - name: election_quorum_pct
        type: integer
        source: input
        description: Quorum threshold expressed as integer percent of eligible Owners
        default: 33
      - name: reserve_inflation_bps
        type: integer
        source: input
        description: Annual inflation in basis points applied to component replacement costs
        default: 300
      - name: current_utc
        type: datetime
        source: system
        description: Server-controlled wall clock (overridable via /_clock/set_current_utc) used for all time-gated logic

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id
      - name: email
        type: string
        source: input
        description: Unique within community
      - name: full_name
        type: string
        source: input
        description: Owner legal name
      - name: is_eligible_voter
        type: boolean
        source: computed
        description: True when Owner owns at least one Property AND has no Lien.status==FILED on any of those Properties at the moment the election OPEN transition fires
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle status of the Owner record
        constraints: "ACTIVE | INACTIVE"
        default: ACTIVE

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id
      - name: owner_id
        type: string
        source: input
        description: FK -> Owner.id; the current owner of record
      - name: unit_label
        type: string
        source: input
        description: Human-readable unit identifier, unique within a Community
      - name: account_balance_cents
        type: integer
        source: computed
        description: Sum of Assessment.outstanding_cents over all Assessments for this Property whose status IN {DUE, OVERDUE}; recomputed on every Assessment mutation and every PaymentApplication.APPLIED transition
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived from Violation rollup. COMPLIANT when no Violation.status==ACTIVE exists; UNDER_REVIEW when at least one Violation.status==ACTIVE exists; SUSPENDED when Property has Lien.status==FILED
        constraints: "COMPLIANT | UNDER_REVIEW | SUSPENDED"
        default: COMPLIANT

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: kind
        type: enum
        source: input
        description: REGULAR (recurring monthly) or SPECIAL (one-off, e.g. for major repair)
        constraints: "REGULAR | SPECIAL"
      - name: principal_cents
        type: integer
        source: input
        description: Original principal billed (cents). Late fees accrue separately in late_fee_cents.
        constraints: ">= 0"
      - name: late_fee_cents
        type: integer
        source: computed
        description: Accumulated late fee applied by chronological grace-cycle calculation (see late_fee_accrual). NEVER reset by payment.
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: Sum of PaymentApplication.amount_cents whose state==APPLIED and target_assessment_id==this.id
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: max(0, principal_cents + late_fee_cents - paid_cents)
        default: 0
      - name: due_date
        type: datetime
        source: input
        description: Date payment becomes due (UTC, midnight)
      - name: status
        type: enum
        source: system
        description: Lifecycle status; see Assessment state machine
        constraints: "DUE | OVERDUE | PAID | WAIVED"
        default: DUE

  - name: PaymentApplication
    parent: null
    common_fields: false
    fields:
      - name: assessment_id
        type: string
        source: input
        description: FK -> Assessment.id
      - name: amount_cents
        type: integer
        source: input
        description: Amount applied in cents
        constraints: "> 0"
      - name: state
        type: enum
        source: system
        description: APPLIED on creation; REVERSED only via /payments/{id}/reverse
        constraints: "APPLIED | REVERSED"
        default: APPLIED
      - name: applied_at
        type: datetime
        source: system
        description: Server timestamp when the application was first APPLIED

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: category
        type: enum
        source: input
        description: Rule category. LANDSCAPING and APPEARANCE are ACC-domain; NOISE and PARKING are conduct-domain. Category gates which calculation tier applies.
        constraints: "LANDSCAPING | APPEARANCE | NOISE | PARKING"
      - name: tier
        type: integer
        source: computed
        description: 1-indexed tier within the Property's rolling 12-month violation history of the SAME category (recomputed at issuance). See violation_tier_assignment.
        default: 1
      - name: fine_cents
        type: integer
        source: computed
        description: Tier-priced fine (see violation_tier_assignment). Persisted as the final value when the Violation is OPENed.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle status; see Violation state machine
        constraints: "OPEN | CONTESTED | UPHELD | DISMISSED | PAID | ACTIVE"
        default: OPEN
      - name: opened_at
        type: datetime
        source: system
        description: Server timestamp at OPEN

  - name: ACCRequest
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: scope
        type: enum
        source: input
        description: APPEARANCE (paint, fence color) or LANDSCAPING (planting, tree removal)
        constraints: "APPEARANCE | LANDSCAPING"
      - name: description
        type: string
        source: input
        description: Free-text scope description
      - name: status
        type: enum
        source: system
        description: Lifecycle status; see ACCRequest state machine
        constraints: "SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | WITHDRAWN"
        default: SUBMITTED
      - name: revision_count
        type: integer
        source: system
        description: Number of REVISION_REQUESTED → SUBMITTED transitions on this request. Hard cap of 3 (see acc_revision_limit validation).
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: Timestamp when status entered APPROVED or REJECTED (set on transition; null while in flight)

  - name: BoardElection
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id
      - name: cycle_label
        type: string
        source: input
        description: Human-readable cycle label, e.g. "FY2026". Unique within Community.
      - name: opens_at
        type: datetime
        source: input
        description: UTC instant the ballot window opens (must be in the future at OPEN)
      - name: closes_at
        type: datetime
        source: input
        description: UTC instant the ballot window closes; must be strictly after opens_at and at least 14 days after opens_at
      - name: status
        type: enum
        source: system
        description: Lifecycle status; see BoardElection state machine
        constraints: "DRAFT | OPEN | CLOSED_QUORUM_MET | CLOSED_NO_QUORUM | CERTIFIED | INVALIDATED"
        default: DRAFT
      - name: eligible_voter_count
        type: integer
        source: system
        description: Snapshot of Owner count with is_eligible_voter==true at the DRAFT→OPEN transition; never recomputed
        default: 0
      - name: votes_cast
        type: integer
        source: computed
        description: Count of Vote rows with election_id==this.id and state==CAST; recomputed on every Vote.CAST and Vote.RETRACTED transition

  - name: Vote
    parent: null
    common_fields: false
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> BoardElection.id
      - name: owner_id
        type: string
        source: input
        description: FK -> Owner.id
      - name: candidate_name
        type: string
        source: input
        description: Name of the candidate the owner voted for
      - name: state
        type: enum
        source: system
        description: CAST when first recorded; RETRACTED via /votes/{id}/retract while election remains OPEN
        constraints: "CAST | RETRACTED"
        default: CAST
      - name: cast_at
        type: datetime
        source: system
        description: Server timestamp when CAST

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id
      - name: principal_at_filing_cents
        type: integer
        source: system
        description: Snapshot of Property.account_balance_cents at the moment of FILED
      - name: status
        type: enum
        source: system
        description: Lifecycle status; see Lien state machine
        constraints: "FILED | SATISFIED | FORECLOSURE_INITIATED"
        default: FILED
      - name: filed_at
        type: datetime
        source: system
        description: Server timestamp when status entered FILED

  - name: ReserveStudy
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id
      - name: fiscal_year
        type: integer
        source: input
        description: 4-digit fiscal year this study covers. Combined with community_id, must be unique (one study per (community, year)).
      - name: method
        type: enum
        source: input
        description: COMPONENT (sum per-component projected replacement) or CASH_FLOW (30-year rolling projection)
        constraints: "COMPONENT | CASH_FLOW"
      - name: accumulated_funds_cents
        type: integer
        source: input
        description: Reserve cash balance recorded at study time
        constraints: ">= 0"
      - name: projected_obligation_cents
        type: integer
        source: computed
        description: Output of reserve_obligation calculation (depends on method)
        default: 0
      - name: percent_funded_bps
        type: integer
        source: computed
        description: Output of reserve_adequacy_ratio (basis points = pct * 100; e.g., 80% = 8000)
        default: 0

  - name: ReserveComponent
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id
      - name: label
        type: string
        source: input
        description: e.g. "Roof - Building A", "Pool resurface". Unique within Community.
      - name: useful_life_years
        type: integer
        source: input
        description: Total expected useful life in years
        constraints: "> 0"
      - name: remaining_life_years
        type: integer
        source: input
        description: Years remaining until replacement at study time
        constraints: ">= 0"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: Today-dollars cost to replace (cents). Inflated by Community.reserve_inflation_bps when consumed by COMPONENT method.
        constraints: ">= 0"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Assessment
    initial_state: DUE
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: DUE
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc (any time advance such that current_utc > due_date + late_fee_grace_days days)"
        actor: system
        preconditions:
          - "Assessment.outstanding_cents > 0"
          - "current_utc > due_date + Community.late_fee_grace_days days"
        side_effects:
          - "Recompute late_fee_cents via late_fee_accrual (chronological)"
          - "Recompute Assessment.outstanding_cents"
          - "Recompute Property.account_balance_cents (derived-field reconciliation)"
          - "If Property.account_balance_cents >= Community.lien_threshold_cents AND no FILED Lien exists for this Property: auto-create Lien with status=FILED (cascade hop 2); this in turn sets Property.compliance_posture=SUSPENDED (cascade hop 3)"
      - from: DUE
        to: PAID
        trigger: "POST /payments (payment that makes outstanding_cents == 0)"
        actor: Treasurer
        preconditions:
          - "Assessment.status == DUE"
          - "amount_cents + paid_cents >= principal_cents + late_fee_cents"
        side_effects:
          - "Set paid_cents += amount_cents"
          - "Recompute Property.account_balance_cents"
      - from: OVERDUE
        to: PAID
        trigger: "POST /payments (payment that makes outstanding_cents == 0)"
        actor: Treasurer
        preconditions:
          - "Assessment.status == OVERDUE"
          - "amount_cents + paid_cents >= principal_cents + late_fee_cents"
        side_effects:
          - "Set paid_cents += amount_cents"
          - "Recompute Property.account_balance_cents"
          - "If Property.account_balance_cents < Community.lien_threshold_cents AND a FILED Lien exists: NO automatic SATISFIED transition — lien satisfaction is a separate Secretary action (POST /liens/{id}/satisfy)"
      - from: DUE
        to: WAIVED
        trigger: "POST /assessments/{id}/waive"
        actor: BoardPresident
        preconditions:
          - "Assessment.status == DUE"
        side_effects:
          - "Recompute Property.account_balance_cents"

  - entity: ACCRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /acc-requests/{id}/approve"
        actor: ACCMember
        preconditions:
          - "ACCRequest.status == SUBMITTED"
          - "Property.compliance_posture != SUSPENDED (cross-entity)"
        side_effects:
          - "Set ACCRequest.decided_at = current_utc"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /acc-requests/{id}/reject"
        actor: ACCMember
        preconditions:
          - "ACCRequest.status == SUBMITTED"
        side_effects:
          - "Set ACCRequest.decided_at = current_utc"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /acc-requests/{id}/request-revision"
        actor: ACCMember
        preconditions:
          - "ACCRequest.status == SUBMITTED"
          - "ACCRequest.revision_count < 3"
        side_effects:
          - "Increment revision_count (will be incremented again on next SUBMITTED return — see below)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /acc-requests/{id}/resubmit"
        actor: HomeOwner
        preconditions:
          - "ACCRequest.status == REVISION_REQUESTED"
          - "Owner of HomeOwner role == Property.owner_id"
        side_effects:
          - "Cycle back to SUBMITTED; revision_count NOT re-incremented (only the request-revision side effect bumps it)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /acc-requests/{id}/withdraw"
        actor: HomeOwner
        preconditions:
          - "ACCRequest.status == SUBMITTED"
          - "Owner of HomeOwner role == Property.owner_id"
        side_effects: []
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /acc-requests/{id}/withdraw"
        actor: HomeOwner
        preconditions:
          - "ACCRequest.status == REVISION_REQUESTED"
          - "Owner of HomeOwner role == Property.owner_id"
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [DISMISSED, PAID]
    transitions:
      - from: OPEN
        to: CONTESTED
        trigger: "POST /violations/{id}/contest"
        actor: HomeOwner
        preconditions:
          - "Violation.status == OPEN"
          - "current_utc <= Violation.opened_at + 30 days"
          - "Owner of HomeOwner role == Property.owner_id"
        side_effects: []
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /violations/{id}/uphold"
        actor: BoardSecretary
        preconditions:
          - "Violation.status == CONTESTED"
        side_effects:
          - "Set Violation.status = ACTIVE for compliance posture rollup (UPHELD is a sub-state of ACTIVE)"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: BoardSecretary
        preconditions:
          - "Violation.status == CONTESTED"
        side_effects:
          - "Recompute Property.compliance_posture (will revert to COMPLIANT if no other ACTIVE violations)"
      - from: OPEN
        to: PAID
        trigger: "POST /violations/{id}/pay-fine"
        actor: HomeOwner
        preconditions:
          - "Violation.status == OPEN"
          - "Owner of HomeOwner role == Property.owner_id"
        side_effects:
          - "Recompute Property.compliance_posture"
      - from: UPHELD
        to: PAID
        trigger: "POST /violations/{id}/pay-fine"
        actor: HomeOwner
        preconditions:
          - "Violation.status == UPHELD"
          - "Owner of HomeOwner role == Property.owner_id"
        side_effects:
          - "Recompute Property.compliance_posture"

  - entity: BoardElection
    initial_state: DRAFT
    terminal_states: [CERTIFIED, INVALIDATED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /elections/{id}/open"
        actor: BoardSecretary
        preconditions:
          - "BoardElection.status == DRAFT"
          - "current_utc < BoardElection.opens_at"
          - "(BoardElection.closes_at - BoardElection.opens_at) >= 14 days"
        side_effects:
          - "Snapshot eligible_voter_count = count of Owners with is_eligible_voter==true at this instant"
      - from: OPEN
        to: CLOSED_QUORUM_MET
        trigger: "POST /elections/{id}/close (when votes_cast/eligible_voter_count*100 >= Community.election_quorum_pct)"
        actor: BoardSecretary
        preconditions:
          - "BoardElection.status == OPEN"
          - "current_utc >= BoardElection.closes_at"
          - "votes_cast * 100 >= eligible_voter_count * Community.election_quorum_pct"
        side_effects: []
      - from: OPEN
        to: CLOSED_NO_QUORUM
        trigger: "POST /elections/{id}/close (when quorum not met)"
        actor: BoardSecretary
        preconditions:
          - "BoardElection.status == OPEN"
          - "current_utc >= BoardElection.closes_at"
          - "votes_cast * 100 < eligible_voter_count * Community.election_quorum_pct"
        side_effects: []
      - from: CLOSED_QUORUM_MET
        to: CERTIFIED
        trigger: "POST /elections/{id}/certify"
        actor: BoardPresident
        preconditions:
          - "BoardElection.status == CLOSED_QUORUM_MET"
          - "ActingUser.role != role-of-secretary-who-issued-OPEN (segregation of duties)"
        side_effects: []
      - from: CLOSED_QUORUM_MET
        to: INVALIDATED
        trigger: "POST /elections/{id}/invalidate"
        actor: BoardPresident
        preconditions:
          - "BoardElection.status == CLOSED_QUORUM_MET"
        side_effects: []
      - from: CLOSED_NO_QUORUM
        to: INVALIDATED
        trigger: "POST /elections/{id}/invalidate"
        actor: BoardPresident
        preconditions:
          - "BoardElection.status == CLOSED_NO_QUORUM"
        side_effects: []

  - entity: Lien
    initial_state: FILED
    terminal_states: [SATISFIED]
    transitions:
      - from: FILED
        to: SATISFIED
        trigger: "POST /liens/{id}/satisfy"
        actor: BoardSecretary
        preconditions:
          - "Lien.status == FILED"
          - "Property.account_balance_cents == 0 (cross-entity)"
        side_effects:
          - "Recompute Property.compliance_posture (returns to COMPLIANT if no ACTIVE violations)"
      - from: FILED
        to: FORECLOSURE_INITIATED
        trigger: "POST /liens/{id}/initiate-foreclosure"
        actor: BoardPresident
        preconditions:
          - "Lien.status == FILED"
          - "current_utc >= Lien.filed_at + 180 days (temporal cooling-off)"
          - "Property.account_balance_cents >= Community.lien_threshold_cents (cross-entity; balance never dropped)"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC only; sequential-observability filter applied
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: payment-create-stale-assessment
    parent_entity: Assessment
    write_endpoint: "POST /payments"
    occ_field: "expected_assessment_version"
    description: |
      Creating a PaymentApplication against an Assessment whose version has
      advanced since the client last observed it is rejected. Captures the
      case where another writer has just applied a payment or waived the
      assessment (legitimately mutating it) and the current writer's view of
      principal_cents / late_fee_cents / paid_cents is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: election-open-stale-community
    parent_entity: Community
    write_endpoint: "POST /elections/{id}/open"
    occ_field: "expected_community_version"
    description: |
      Opening a BoardElection requires the caller's view of the Community to
      be current — eligible_voter_count is snapshotted from Owner state at
      this instant, and the snapshot is governed by Community-level config
      (election_quorum_pct, etc.). A stale Community.version means the
      caller's view of voter eligibility rules may diverge from the value
      this transition will freeze into eligible_voter_count.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: late_fee_accrual
    trigger: "Assessment DUE→OVERDUE transition; also recomputed by any subsequent /_clock/set_current_utc that crosses a new full grace period"
    algorithm: chronological
    formula: |
      # Compute how many full grace cycles have elapsed since the original
      # due_date, then apply flat + pct in chronological order, per-cycle.
      elapsed_days = floor((current_utc - due_date) / 1_day)
      grace = Community.late_fee_grace_days
      if elapsed_days < grace:
          late_fee_cents = 0
      else:
          cycles = 1 + floor((elapsed_days - grace) / grace)
          accrued = 0
          for k in range(cycles):
              # per-cycle flat
              accrued += Community.late_fee_flat_cents
              # per-cycle pct on the principal as of the start of this cycle
              pct_amt = floor(principal_cents * Community.late_fee_pct_bps / 10000)
              accrued += pct_amt
          late_fee_cents = accrued
      # NESTED ROUNDING: floor is applied per-cycle BEFORE summing. The
      # alternative — sum exact fractional cents across all cycles, then
      # floor once at the end — produces a different total. The scaffold
      # pins the per-cycle floor as authoritative.
    input_set: "All cycles k in [0, cycles) for this single Assessment"
    constants: {}
    precision: "Integer cents; floor per cycle (round_down)"
    variants:
      - name: chronological_per_cycle
        when: "Assessment.status transitions DUE→OVERDUE on the server's wall clock"
        difference: "Per-cycle floor then sum (authoritative)"
      - name: forward_looking_projection
        when: "GET /assessments/{id}/projected-balance returns a what-if value for a future date"
        difference: |
          Uses ceil(elapsed_days/grace) inclusive of the partial cycle the
          caller asked about, and floors the FINAL total only — not per
          cycle. Produces a different number for the same inputs.

  - name: violation_tier_assignment
    trigger: "POST /violations (Violation OPEN insert)"
    algorithm: threshold
    formula: |
      # Determine the tier index by counting prior Violations of the SAME
      # category for the SAME Property in the rolling 12-month window
      # ending at current_utc.
      prior = count(Violation
                    WHERE property_id == this.property_id
                      AND category == this.category
                      AND opened_at >= current_utc - 365_days
                      AND status IN {OPEN, CONTESTED, UPHELD, PAID})
      tier = prior + 1  # 1-indexed
      # Fine schedule per tier (cents):
      #   tier 1: 10000
      #   tier 2: 25000
      #   tier 3: 50000
      #   tier 4+: 100000
      if tier == 1:    fine_cents = 10000
      elif tier == 2:  fine_cents = 25000
      elif tier == 3:  fine_cents = 50000
      else:            fine_cents = 100000
    input_set: "Violations within the rolling 365-day window ending strictly at current_utc"
    constants:
      TIER1_CENTS: 10000
      TIER2_CENTS: 25000
      TIER3_CENTS: 50000
      TIER_CAP_CENTS: 100000
    precision: "Integer cents; no rounding required"

  - name: reserve_obligation
    trigger: "POST /reserve-studies (creation); recomputed by POST /reserve-studies/{id}/recompute"
    algorithm: aggregation
    formula: |
      # Two methods produce different projected_obligation_cents from the
      # same component data:
      if method == COMPONENT:
          # Sum per-component replacement cost inflated by the remaining
          # life (compounded annual inflation) — three inputs interact
          # non-linearly: replacement_cost_cents, remaining_life_years,
          # Community.reserve_inflation_bps.
          total = 0
          for c in ReserveComponent WHERE community_id == this.community_id:
              factor = (1 + reserve_inflation_bps/10000) ** c.remaining_life_years
              inflated = floor(c.replacement_cost_cents * factor)
              total += inflated
          projected_obligation_cents = total
      elif method == CASH_FLOW:
          # Roll forward over a 30-year horizon, replacing each component
          # at its useful_life cadence starting from remaining_life_years,
          # then average the annual draw and multiply by 30. ORDER OF
          # EVALUATION: project all draws year-by-year, sum, then floor.
          horizon = 30
          annual_draw = [0] * horizon
          for c in ReserveComponent WHERE community_id == this.community_id:
              year = c.remaining_life_years
              while year < horizon:
                  factor = (1 + reserve_inflation_bps/10000) ** year
                  annual_draw[year] += c.replacement_cost_cents * factor
                  year += c.useful_life_years
          projected_obligation_cents = floor(sum(annual_draw))
    input_set: "All ReserveComponent rows for this Community at study creation time"
    constants:
      HORIZON_YEARS: 30
    precision: "Integer cents; floor at the END of each method's branch"
    variants:
      - name: component_method
        when: "ReserveStudy.method == COMPONENT"
        difference: "Per-component inflated replacement cost summed"
      - name: cash_flow_method
        when: "ReserveStudy.method == CASH_FLOW"
        difference: "30-year projection of replacements at useful_life cadence"

  - name: reserve_adequacy_ratio
    trigger: "Same as reserve_obligation; sets percent_funded_bps once projected_obligation_cents is known"
    algorithm: threshold
    formula: |
      if projected_obligation_cents == 0:
          percent_funded_bps = 10000  # 100% by convention when no obligation
      else:
          percent_funded_bps = floor(accumulated_funds_cents * 10000 / projected_obligation_cents)
      # Adequacy bands (informational on response):
      #   percent_funded_bps >= 7000  -> "STRONG"
      #   3000 <= ... < 7000          -> "FAIR"
      #   percent_funded_bps < 3000   -> "WEAK"
    input_set: "Single ReserveStudy row's accumulated_funds_cents and projected_obligation_cents"
    constants:
      STRONG_BPS: 7000
      FAIR_BPS: 3000
    precision: "Integer basis points; floor"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all (except POST /_clock/set_current_utc which only requires PlatformAdmin and tolerates anonymous in test mode)"

  - priority: 2
    category: auth
    check: "X-User-Role recognized in §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-templated parent resources exist (left-to-right). E.g. /properties/{id} → Property exists."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body FK references resolve to existing rows of the right entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target resource in correct from-state for this transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "ACC approval blocked when Property.compliance_posture == SUSPENDED"
    error_id: ERR_PROPERTY_SUSPENDED
    http_status: 422
    applies_to: "POST /acc-requests/{id}/approve"

  - priority: 7
    category: business_safety
    check: "Lien.FORECLOSURE_INITIATED requires Property.account_balance_cents >= Community.lien_threshold_cents AT THE TIME OF THE CALL (not at filing)"
    error_id: ERR_BALANCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /liens/{id}/initiate-foreclosure"

  - priority: 8
    category: business_temporal
    check: "ACC revision_count must be < 3 before request-revision"
    error_id: ERR_ACC_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /acc-requests/{id}/request-revision"

  - priority: 9
    category: business_temporal
    check: "BoardElection: closes_at - opens_at >= 14 days at OPEN; current_utc < opens_at at OPEN"
    error_id: ERR_INVALID_ELECTION_WINDOW
    http_status: 422
    applies_to: "POST /elections/{id}/open"

  - priority: 10
    category: business_temporal
    check: "Vote cast only while election.status == OPEN and current_utc < election.closes_at"
    error_id: ERR_ELECTION_NOT_OPEN
    http_status: 422
    applies_to: "POST /votes"

  - priority: 11
    category: business_referential
    check: "Voter must be is_eligible_voter == true at vote time AND must have at least one Property in this Community"
    error_id: ERR_VOTER_INELIGIBLE
    http_status: 422
    applies_to: "POST /votes"

  - priority: 12
    category: business_referential
    check: "Vote uniqueness: one CAST Vote per (election_id, owner_id). A RETRACTED Vote does NOT block a new CAST."
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /votes"

  - priority: 13
    category: business_fiscal
    check: "PaymentApplication.amount_cents must not exceed Assessment.principal_cents + Assessment.late_fee_cents - Assessment.paid_cents (no over-payment)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payments"

  - priority: 14
    category: business_fiscal
    check: "Lien satisfy requires Property.account_balance_cents == 0"
    error_id: ERR_BALANCE_NONZERO
    http_status: 422
    applies_to: "POST /liens/{id}/satisfy"

  - priority: 15
    category: business_constraint
    check: "ReserveStudy uniqueness: (community_id, fiscal_year) is unique"
    error_id: ERR_DUPLICATE_RESERVE_STUDY
    http_status: 409
    applies_to: "POST /reserve-studies"

  - priority: 16
    category: business_constraint
    check: "Concurrency: expected_*_version matches current parent.version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payments, POST /elections/{id}/open"

  - priority: 17
    category: business_constraint
    check: "Owner.email unique within Community"
    error_id: ERR_DUPLICATE_OWNER_EMAIL
    http_status: 409
    applies_to: "POST /owners"

  - priority: 18
    category: business_constraint
    check: "Property.unit_label unique within Community"
    error_id: ERR_DUPLICATE_UNIT_LABEL
    http_status: 409
    applies_to: "POST /properties"

  - priority: 19
    category: business_constraint
    check: "Segregation of duties on election certify: the BoardPresident who certifies must NOT be the BoardSecretary who issued OPEN. Recorded via Election.opened_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /elections/{id}/certify"

