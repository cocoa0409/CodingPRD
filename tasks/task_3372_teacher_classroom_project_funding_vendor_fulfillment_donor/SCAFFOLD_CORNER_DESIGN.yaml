        test_recipe:
          setup:
            - "Project expired via sweep at 2026-10-01T00:00:00Z; donation CHOICE_PENDING at version 2 (bumped by the sweep); clock still 2026-10-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /giving/donations/${dn1}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn_v: $.data.version }
          trigger:
            - call: "POST /giving/donations/${dn1}/reallocation-choice"
              payload: { choice: "REFUND", expected_donation_version: "${dn_v} - 1" }
              as: Donor
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION — the client's view predates the sweep's version bump"
            - "Donation.${dn1}.status == CHOICE_PENDING (a retry with the fresh version succeeds)"

