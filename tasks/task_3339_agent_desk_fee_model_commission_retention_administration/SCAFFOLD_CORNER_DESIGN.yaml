        distinguishing_aspect: "With the office SUSPENDED by an escalated COLLECTIONS invoice, POST /offices/{id}/agents is rejected 409 ERR_OFFICE_SUSPENDED — the supervision/safety gate fires before any agent field validation."
        test_recipe:
