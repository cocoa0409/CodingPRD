      - name: create_plan_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request sent without X-User-Role and X-User-ID is refused with ERR_UNAUTHENTICATED at 401 before any body validation runs, even though the body is also missing plan_type."
        test_recipe:
          setup:
            - "One PUBLIC_SCHOOL employer exists."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID header"
            - "response is 401 with data.error_id == ERR_UNAUTHENTICATED, not 400 ERR_INVALID_REQUEST"

