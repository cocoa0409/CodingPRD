      - name: merging_an_already_subsumed_record_returns_record_not_active
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_RECORD_NOT_ACTIVE]
        distinguishing_aspect: "A pair may be scored over a MERGED_SUBSUMED record, but the merge endpoint requires every member to be ACTIVE, so re-merging an already-subsumed record is 409 ERR_RECORD_NOT_ACTIVE rather than a second merge row."
