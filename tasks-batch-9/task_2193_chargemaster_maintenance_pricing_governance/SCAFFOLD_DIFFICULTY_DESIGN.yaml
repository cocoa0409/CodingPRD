      - call: POST /chargemaster/transparency-files/${file_id}/lifecycle
        payload:
          action: VALIDATE
        as: ComplianceOfficer
        as_user_id: compliance_1
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      trigger:
      - call: POST /chargemaster/charge-items/${item_id}/reprice
        payload: {}
