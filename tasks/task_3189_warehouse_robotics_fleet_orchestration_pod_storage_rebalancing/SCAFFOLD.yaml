    input: []
    output: SoftwareRelease
    side_effects: ["SoftwareRelease VALIDATED -> FLOOR_LIVE", "prior FLOOR_LIVE -> ROLLED_BACK", "every DriveUnit.firmware_release_id updated", "increments every DriveUnit.version by 1"]
  - method: POST
    path: "/fleet/software-releases/{id}/rollback"
    description: "Roll back the FLOOR_LIVE release."
    roles: [FleetAdmin]
    code: 200
    input: []
    output: SoftwareRelease
    side_effects: ["SoftwareRelease FLOOR_LIVE -> ROLLED_BACK", "DriveUnit.firmware_release_id restored"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for this endpoint per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path or body FK reference does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a state from which the requested transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"
  - id: ERR_SAFETY_INTERLOCK
    http: 422
    condition: "safety interlock engaged (FROZEN zone, open exception gate, segregation-of-duties violation)"
  - id: ERR_REFERENTIAL_MISMATCH
    http: 422
    condition: "FK reference shape mismatch (e.g., line does not belong to order; drive_unit_id required iff kind=STRANDED_ROBOT)"
  - id: ERR_TEMPORAL_CONFLICT
    http: 422
    condition: "temporal interval invalid or violates buffer/adjacency rules"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "station queue, charger slot, pod slot, or zone human occupancy at capacity"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "available on-hand minus reserved below the requested quantity"
  - id: ERR_NO_ELIGIBLE_DRIVE_UNIT
    http: 422
    condition: "fleet_selector candidate pool empty at dispatch"
  - id: ERR_NO_ELIGIBLE_POD
    http: 422
    condition: "stow-placement selector candidate pool empty"
  - id: ERR_VALIDATION
    http: 400
    condition: "generic request shape error: missing required field, bad enum, type mismatch, negative quantity"

roles:
  - name: FleetAdmin
    description: "Owns fleet configuration: zones, drive units, chargers, pods, SKUs, shift plans; promotes/rolls back software."
    identity: opaque
    exclusive_operations: ["POST /fleet/zones", "POST /fleet/drive-units", "POST /fleet/chargers", "POST /fleet/pods", "POST /fleet/skus", "POST /fleet/pick-stations", "POST /fleet/drive-units/{id}/retire", "POST /fleet/shift-plans", "POST /fleet/software-releases/{id}/promote", "POST /fleet/software-releases/{id}/rollback", "POST /fleet/_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
  - name: FlowController
    description: "Orchestrates tasks: customer orders, pick tasks, stow tasks, charging sessions, station pause/reopen."
    identity: opaque
    exclusive_operations: ["POST /fleet/customer-orders", "POST /fleet/customer-orders/{id}/cancel", "POST /fleet/pick-tasks", "POST /fleet/pick-tasks/{id}/sequence", "POST /fleet/pick-tasks/{id}/dispatch", "POST /fleet/pick-tasks/{id}/deliver", "POST /fleet/pick-tasks/{id}/cancel", "POST /fleet/stow-tasks", "POST /fleet/stow-tasks/{id}/place", "POST /fleet/charging-sessions", "POST /fleet/charging-sessions/{id}/close", "POST /fleet/pick-stations/{id}/pause", "POST /fleet/pick-stations/{id}/reopen"]
    shared_operations: ["GET endpoints", "POST /fleet/floor-exceptions"]
  - name: StationOperator
    description: "Works at a pick station: begins and completes picks, confirms stows."
    identity: opaque
    exclusive_operations: ["POST /fleet/pick-tasks/{id}/begin-pick", "POST /fleet/pick-tasks/{id}/complete", "POST /fleet/stow-tasks/{id}/confirm"]
    shared_operations: ["GET endpoints"]
  - name: FloorSupervisor
    description: "Reports, triages, and resolves floor exceptions; requests human-entry permits."
    identity: opaque
    exclusive_operations: ["POST /fleet/floor-exceptions/{id}/triage", "POST /fleet/floor-exceptions/{id}/resolve", "POST /fleet/human-entry-permits"]
    shared_operations: ["GET endpoints", "POST /fleet/floor-exceptions"]
  - name: SafetyOfficer
    description: "Grants/releases human-entry permits; records release validation outcomes. Segregated from FloorSupervisor and ReleaseEngineer."
    identity: opaque
    exclusive_operations: ["POST /fleet/human-entry-permits/{id}/grant", "POST /fleet/human-entry-permits/{id}/release", "POST /fleet/software-releases/{id}/record-validation"]
    shared_operations: ["GET endpoints"]
  - name: MaintenanceTech
    description: "Schedules, completes, and cancels maintenance windows."
    identity: opaque
    exclusive_operations: ["POST /fleet/maintenance-windows", "POST /fleet/maintenance-windows/{id}/complete", "POST /fleet/maintenance-windows/{id}/cancel"]
    shared_operations: ["GET endpoints"]
  - name: ReleaseEngineer
    description: "Authors software releases and drives the validation loop."
    identity: opaque
    exclusive_operations: ["POST /fleet/software-releases", "POST /fleet/software-releases/{id}/validate", "POST /fleet/software-releases/{id}/revise"]
    shared_operations: ["GET endpoints"]
