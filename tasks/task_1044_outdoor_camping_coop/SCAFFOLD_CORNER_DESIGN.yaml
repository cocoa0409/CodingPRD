          rationale: "ERR_RENTAL_WINDOW_CONFLICT is asserted by the named §1.8 instance."
      - name: guide_schedule_conflict_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_GUIDE_SCHEDULE_CONFLICT]"]
        excluded_because:
