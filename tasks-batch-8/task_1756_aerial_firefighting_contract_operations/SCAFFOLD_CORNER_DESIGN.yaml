            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-09-30", available_start: "2026-09-30T07:00:00Z", available_end: "2026-09-30T16:30:00Z" }, as: CarrierOps, captures: { ok_st: $.data.status } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-10-01", available_start: "2026-10-01T07:00:00Z", available_end: "2026-10-01T16:30:00Z" }, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "2026-09-30 accepted (season_end_date is inclusive): period created CONFIRMED"
            - "2026-10-01 rejected with ERR_SERVICE_DATE_OUTSIDE_SEASON (422)"

      - name: assignment_model_gates
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_MODEL_MISMATCH]", "errors[ERR_MODEL_NOT_QUALIFIED]"]
