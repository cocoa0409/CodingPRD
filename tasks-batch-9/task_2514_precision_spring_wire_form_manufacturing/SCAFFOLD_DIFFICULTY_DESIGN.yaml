              as: DesignEngineer
              captures: { ms_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_id}", material_spec_id: "${ms_id}", part_number: "D1-CENTS", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.5, outer_diameter_mm: 20.0, free_length_mm: 60.0, active_coils: 8, max_working_load_n: 150, min_working_load_n: 50, cycle_seconds_per_piece: 1.8, shot_peening_required: true }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d1_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/critical-characteristics"
