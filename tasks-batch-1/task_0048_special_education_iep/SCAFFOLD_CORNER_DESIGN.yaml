scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_student_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Student
          - endpoints
        distinguishing_aspect: >-
          POST /students with full_name, date_of_birth, grade_level returns 201 and a Student with
          eligibility_status=NOT_EVALUATED, disability_category=null, active_iep_id=null, version=1.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
          trigger:
            - call: "POST /students"
              payload: { full_name: "Quinn Ash", date_of_birth: "2015-01-01", grade_level: 3 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id, es: $.data.eligibility_status, v: $.data.version }
          assert:
            - "response status == 201"
            - "Student.${stu_id}.eligibility_status == NOT_EVALUATED"
            - "Student.${stu_id}.disability_category == null"
            - "Student.${stu_id}.active_iep_id == null"
            - "Student.${stu_id}.version == 1"

      - name: get_student_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Student
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /students/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SpecialEdAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_student_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Student.fields.date_of_birth
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /students omitting date_of_birth returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "No DOB", grade_level: 3 }
              as: SpecialEdAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_goal_invalid_range_target_not_above_baseline
        claim_type: Type Constraints
        grounds:
          - entities.Goal.fields.target_value
          - validations[priority=21]
          - errors[ERR_INVALID_RANGE]
        distinguishing_aspect: >-
          POST .../goals with baseline_value=50 and target_value=50 (not strictly greater) returns
          ERR_INVALID_RANGE (422).
        test_recipe:
          setup:
            - "A DRAFT IEP exists for an eligible student."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Val Reed", date_of_birth: "2014-02-02", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
          trigger:
            - call: "POST /goals"
              payload: { iep_id: "${iep_id}", domain: "MATH", baseline_value: 50, target_value: 50 }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_INVALID_RANGE"

      - name: progress_report_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ProgressReport
        distinguishing_aspect: >-
          ProgressReport has common_fields:false — its create response carries id and created_at but
          no version field, and there is no update endpoint for it.
        test_recipe:
          setup:
            - "A READING Goal on a DRAFT IEP for an eligible student, target_value=100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Lia Cruz", date_of_birth: "2014-03-03", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
            - call: "POST /goals"
              payload: { iep_id: "${iep_id}", domain: "READING", baseline_value: 0, target_value: 100 }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 1, measured_value: 25 }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { pr_id: $.data.id }
          assert:
            - "response status == 201"
            - "ProgressReport.${pr_id}.id is a non-empty UUID"
            - "ProgressReport response data has no `version` field"

  # =========================================================================
  - section: state_machines
    instances:
      - name: decide_already_decided_consent_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ConsentRequest.PENDING_to_GRANTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >-
          A second decide on an already-GRANTED ConsentRequest is rejected with ERR_INVALID_STATE
          (409); only PENDING requests are decidable.
        test_recipe:
          setup:
            - "A GRANTED EVALUATION ConsentRequest for a student."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Mae Holt", date_of_birth: "2014-04-04", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
          trigger:
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "DENY" }
              as: Parent
              as_user_id: "par_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: begin_evaluation_without_granted_consent_returns_consent_not_granted
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Evaluation.CONSENT_PENDING_to_IN_PROGRESS
          - validations[priority=40]
          - errors[ERR_CONSENT_NOT_GRANTED]
        distinguishing_aspect: >-
          POST .../begin on a CONSENT_PENDING Evaluation whose EVALUATION consent is still PENDING is
          rejected with ERR_CONSENT_NOT_GRANTED (409) — cross-entity precondition on ConsentRequest.
        test_recipe:
          setup:
            - "An Evaluation in CONSENT_PENDING with its EVALUATION ConsentRequest still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Eli Frost", date_of_birth: "2014-05-05", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
          trigger:
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_CONSENT_NOT_GRANTED"

      - name: hold_meeting_on_not_evaluated_student_returns_not_eligible
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IEP.DRAFT_to_MEETING_HELD
          - validations[priority=41]
          - errors[ERR_STUDENT_NOT_ELIGIBLE]
        distinguishing_aspect: >-
          POST .../hold-meeting on a DRAFT IEP whose student is NOT_EVALUATED is rejected with
          ERR_STUDENT_NOT_ELIGIBLE (409).
        test_recipe:
          setup:
            - "A DRAFT IEP for a NOT_EVALUATED student (no finalized evaluation)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Tess Page", date_of_birth: "2014-06-06", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
          trigger:
            - call: "POST /ieps/${iep_id}/hold-meeting"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_STUDENT_NOT_ELIGIBLE"

      - name: goal_auto_transitions_to_met_on_cumulative_100
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Goal.ACTIVE_to_MET
          - calculations.goal_progress_cumulative
          - entities.Goal.fields.status
        distinguishing_aspect: >-
          A single ProgressReport with measured_value == target_value (baseline 0, target 50, measured
          50) makes cumulative_progress_pct 100.00 and bubbles the Goal ACTIVE -> MET.
        test_recipe:
          setup:
            - "A READING Goal (baseline 0, target 50) on a DRAFT IEP for an eligible student, no reports yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Rex Dunn", date_of_birth: "2014-07-07", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
            - call: "POST /goals"
              payload: { iep_id: "${iep_id}", domain: "READING", baseline_value: 0, target_value: 50 }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /progress-reports"
              payload: { goal_id: "${goal_id}", reporting_period: 1, measured_value: 50 }
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
              captures: { st: $.data.status, cp: $.data.cumulative_progress_pct }
          assert:
            - "Goal.${goal_id}.cumulative_progress_pct == 100.0"
            - "Goal.${goal_id}.status == MET"

      - name: archive_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.IEP.ACTIVE_to_ARCHIVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >-
          POST .../archive on a DRAFT IEP (archive is only defined from ACTIVE) is rejected with
          ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "A DRAFT IEP for an eligible student."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Sky Boon", date_of_birth: "2014-08-08", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
          trigger:
            - call: "POST /ieps/${iep_id}/archive"
              payload: {}
              as: SpecialEdAdmin
              as_user_id: "adm_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: activate_second_iep_while_one_active_returns_active_iep_exists
        claim_type: guarded transitions
        grounds:
          - state_machines.IEP.MEETING_HELD_to_ACTIVE
          - validations[priority=45]
          - errors[ERR_ACTIVE_IEP_EXISTS]
        distinguishing_aspect: >-
          Activating a second MEETING_HELD IEP (with its own GRANTED PLACEMENT consent) while the
          student already has another IEP ACTIVE is rejected with ERR_ACTIVE_IEP_EXISTS (409).
        test_recipe:
          setup:
            - "An eligible student has IEP-A ACTIVE and IEP-B in MEETING_HELD with a GRANTED PLACEMENT consent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: SpecialEdAdmin
            - call: "POST /students"
              payload: { full_name: "Uma Lott", date_of_birth: "2014-09-09", grade_level: 6 }
              as: SpecialEdAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /evaluations"
              payload: { student_id: "${stu_id}", eval_type: "INITIAL", cognitive_score: 110, academic_score: 70, adaptive_score: 75, proposed_category: "SLD" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", consent_type: "EVALUATION", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_eval_id: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_eval_id}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /evaluations/${eval_id}/begin"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /evaluations/${eval_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_a: $.data.id }
            - call: "POST /ieps/${iep_a}/hold-meeting"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", iep_id: "${iep_a}", consent_type: "PLACEMENT", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_plc_a: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_plc_a}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
            - call: "POST /ieps/${iep_a}/activate"
              payload: {}
              as: SpecialEdAdmin
              as_user_id: "adm_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-09-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_b: $.data.id }
            - call: "POST /ieps/${iep_b}/hold-meeting"
              payload: {}
              as: CaseManager
              as_user_id: "cm_1"
            - call: "GET /consent-requests"
              payload: { student_id: "${stu_id}", iep_id: "${iep_b}", consent_type: "PLACEMENT", status: "PENDING" }
              as: Parent
              as_user_id: "par_1"
              captures: { cr_plc_b: "$.data[0].id" }
            - call: "POST /consent-requests/${cr_plc_b}/decide"
              payload: { decision: "GRANT" }
              as: Parent
              as_user_id: "par_1"
          trigger:
            - call: "POST /ieps/${iep_b}/activate"
              payload: {}
              as: SpecialEdAdmin
              as_user_id: "adm_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_ACTIVE_IEP_EXISTS"

      - name: transition_plan_age_under_16_returns_age_not_met
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=44]
          - errors[ERR_TRANSITION_AGE_NOT_MET]
          - entities.Student.fields.date_of_birth
        distinguishing_aspect: >-
          POST .../transition-plans for a student who is 13 at the clock instant is rejected with
          ERR_TRANSITION_AGE_NOT_MET (409); transition planning requires age >= 16.
        test_recipe:
          setup:
            - "A 13-year-old eligible student with a DRAFT IEP."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
