# =============================================================================
# §1.9 Scaffold Corner Design — Fundraiser Product Sale Logistics
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: campaign_create_returns_draft_with_system_fields
        claim_type: creation
        grounds: ["entities.Campaign", "state_machines.Campaign"]
        distinguishing_aspect: "A fresh campaign is created in DRAFT with server-minted id, created_at, updated_at and version == 1."
        test_recipe:
          setup: ["empty database; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
          trigger:
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id, camp_status: $.data.status, camp_v: $.data.version }
          assert:
            - "camp_status == DRAFT (initial state)"
            - "camp_v == 1 and id/created_at/updated_at are present on the response"
            - "HTTP status == 201"

      - name: campaign_create_inverted_window_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Campaign.fields.order_window_end", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "order_window_end <= order_window_start violates the window constraint -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Bad", school_name: "Lincoln", order_window_start: "2026-08-20T00:00:00Z", order_window_end: "2026-08-01T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION and HTTP status == 400"

      - name: product_create_applies_campaign_default_profit_share
        claim_type: defaults
        grounds: ["entities.Product.fields.profit_share_bps"]
        distinguishing_aspect: "Omitting profit_share_bps snapshots the campaign's default (5000) onto the product at creation."
        test_recipe:
          setup: ["campaign in DRAFT with default_profit_share_bps 5000"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p_bps: $.data.profit_share_bps }
          assert:
            - "p_bps == 5000 (campaign default snapshot applied)"

      - name: seller_create_missing_display_name_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Seller.fields.display_name", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required field display_name -> ERR_VALIDATION 400 before any FK existence check."
        test_recipe:
          setup: ["campaign DRAFT with one group"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
          trigger:
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}" }
              as: GroupCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION and HTTP status == 400"

      - name: prize_create_bad_tier_type_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.IncentivePrize.fields.tier_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An enum value outside {UNITS_SOLD, REVENUE_CENTS, ORDERS_COUNT} -> ERR_VALIDATION 400."
        test_recipe:
          setup: ["campaign DRAFT"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /fundraiser/prizes"
              payload: { campaign_id: "${camp}", name: "iPad", tier_type: "DOLLARS", threshold_value: 100, prize_cost_cents: 50, stock_quantity: 1 }
              as: FundraiserAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION and HTTP status == 400"

      - name: get_campaign_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CAMPAIGN_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown campaign id -> ERR_CAMPAIGN_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /fundraiser/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FundraiserAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_CAMPAIGN_NOT_FOUND and HTTP status == 404"

      - name: seller_create_with_unknown_group_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Seller.fields.group_id", "errors[ERR_GROUP_NOT_FOUND]"]
        distinguishing_aspect: "Body FK group_id pointing nowhere -> ERR_GROUP_NOT_FOUND 404 (priority 6 body-FK existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", display_name: "Alice" }
              as: GroupCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_GROUP_NOT_FOUND and HTTP status == 404"

      - name: orders_list_pagination_limit_offset_has_more
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit=2 over 3 orders returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["campaign OPEN with one seller who has three DRAFT orders"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam2", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam3", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
          trigger:
            - call: "GET /fundraiser/orders"
              payload: { seller_id: "${sA}", limit: 2, offset: 0 }
              as: GroupCoordinator
            - call: "GET /fundraiser/orders"
              payload: { seller_id: "${sA}", limit: 2, offset: 2 }
              as: GroupCoordinator
          assert:
            - "first page: exactly 2 items, total_count == 3, has_more == true"
            - "second page: exactly 1 item, total_count == 3, has_more == false"
            - "default limit is 10 and max is 100 per response_envelope.pagination_defaults"

      - name: order_create_unknown_computed_field_rejected
        claim_type: computed_fields
        grounds: ["entities.Order.fields.total_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Client-supplied total_cents (a computed field) is an unknown input key -> strict schema rejects with ERR_VALIDATION 400."
        test_recipe:
          setup: ["campaign OPEN with one seller"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
          trigger:
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 1 } ], total_cents: 1 }
              as: GroupCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_VALIDATION and HTTP status == 400 (computed field is not client-settable)"

      - name: product_duplicate_sku_rejected
        claim_type: type_constraints
        grounds: ["entities.Product.fields.sku", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Second product with the same sku in the same campaign -> ERR_DUPLICATE_SKU 409."
        test_recipe:
          setup: ["campaign DRAFT with product BAR-01"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
          trigger:
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar Again", sku: "BAR-01", unit_price_cents: 1200, supplier_unit_cost_cents: 700, case_pack_size: 6 }
              as: FundraiserAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_DUPLICATE_SKU and HTTP status == 409"

      - name: group_duplicate_name_rejected
        claim_type: type_constraints
        grounds: ["entities.StudentGroup.fields.name", "errors[ERR_DUPLICATE_GROUP_NAME]"]
        distinguishing_aspect: "Second group with the same name in the same campaign -> ERR_DUPLICATE_GROUP_NAME 409."
        test_recipe:
          setup: ["campaign DRAFT with group 'Group A'"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
          trigger:
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_DUPLICATE_GROUP_NAME and HTTP status == 409"

      - name: seller_duplicate_name_rejected
        claim_type: type_constraints
        grounds: ["entities.Seller.fields.display_name", "errors[ERR_DUPLICATE_SELLER_NAME]"]
        distinguishing_aspect: "Second seller with the same display_name in the same group -> ERR_DUPLICATE_SELLER_NAME 409."
        test_recipe:
          setup: ["campaign DRAFT with group containing seller 'Alice'"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
          trigger:
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_DUPLICATE_SELLER_NAME and HTTP status == 409"

      - name: ledger_entry_polymorphic_reference_resolves_to_order
        claim_type: computed_fields
        grounds: ["entities.ProceedsLedgerEntry.fields.reference_type", "entities.ProceedsLedgerEntry.fields.reference_id"]
        distinguishing_aspect: "The PROVISIONAL_CREDIT entry created at submit carries reference_type ORDER and reference_id equal to the order id (polymorphic reference)."
        test_recipe:
          setup: ["campaign OPEN; seller with one submitted order qty 1 (price 1000, cost 600)"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
              captures: { p1: $.data.id }
            - call: "POST /fundraiser/sellers"
              payload: { group_id: "${gA}", display_name: "Alice" }
              as: GroupCoordinator
              captures: { sA: $.data.id }
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
            - call: "POST /fundraiser/orders"
              payload: { seller_id: "${sA}", family_contact_name: "Fam1", lines: [ { product_id: "${p1}", quantity: 1 } ] }
              as: GroupCoordinator
              captures: { o1: $.data.id }
            - { call: "POST /fundraiser/orders/${o1}/submit", payload: {}, as: GroupCoordinator }
          trigger:
            - call: "GET /fundraiser/groups/${gA}/ledger"
              payload: {}
              as: Treasurer
              captures: { e_type: "$.data[0].entry_type", e_ref_type: "$.data[0].reference_type", e_ref: "$.data[0].reference_id", e_amt: "$.data[0].amount_cents" }
          assert:
            - "e_type == PROVISIONAL_CREDIT and e_ref_type == ORDER and e_ref == ${o1}"
            - "e_amt == 200 (round_half_up(1 * (1000-600) * 5000/10000))"

      - name: ledger_entry_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.ProceedsLedgerEntry"]
        distinguishing_aspect: "ProceedsLedgerEntry has common_fields false: response entries carry id/created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["campaign DRAFT with one group that has one manual adjustment"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
              captures: { gA: $.data.id }
            - { call: "POST /fundraiser/groups/${gA}/adjustments", payload: { amount_cents: 500, memo: "seed" }, as: Treasurer, as_user_id: "treas-1" }
          trigger:
            - call: "GET /fundraiser/groups/${gA}/ledger"
              payload: {}
              as: Treasurer
              captures: { e_amt: "$.data[0].amount_cents", e_seq: "$.data[0].seq", e_bal: "$.data[0].balance_after_cents" }
          assert:
            - "e_amt == 500 and e_seq == 1 and e_bal == 500"
            - "ledger entries expose id and created_at but no version/updated_at keys (append-only resource)"

      - name: campaign_version_increments_on_transition
        claim_type: system_fields
        grounds: ["entities.Campaign", "concurrency_rules[campaign-settings-stale-version]"]
        distinguishing_aspect: "Every mutation bumps version: create -> 1, open -> 2, and updated_at is refreshed."
        test_recipe:
          setup: ["campaign DRAFT with one product and one group"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id, v0: $.data.version }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
          trigger:
            - call: "POST /fundraiser/campaigns/${camp}/open"
              payload: {}
              as: FundraiserAdmin
              captures: { v1: $.data.version, st: $.data.status }
          assert:
            - "v0 == 1 and v1 == 2 after open (version increments by exactly 1 per mutation)"
            - "st == OPEN and updated_at advanced past the creation timestamp"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: campaign_open_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Campaign.DRAFT_to_OPEN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "OPEN -> open is not a declared transition; the second open is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["campaign OPEN (product + group present)"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraiser/groups"
              payload: { campaign_id: "${camp}", name: "Group A" }
              as: GroupCoordinator
            - call: "POST /fundraiser/products"
              payload: { campaign_id: "${camp}", name: "Bar", sku: "BAR-01", unit_price_cents: 1000, supplier_unit_cost_cents: 600, case_pack_size: 12 }
              as: FundraiserAdmin
            - { call: "POST /fundraiser/campaigns/${camp}/open", payload: {}, as: FundraiserAdmin }
          trigger:
            - call: "POST /fundraiser/campaigns/${camp}/open"
              payload: {}
              as: FundraiserAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: cancelled_campaign_terminal_lockdown
        claim_type: terminal_lockdown
