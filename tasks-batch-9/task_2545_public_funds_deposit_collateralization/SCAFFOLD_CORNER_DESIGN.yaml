          assert:
            - "200 with data.approval_status == 'APPROVED'"
            - "data.approved_at == 2026-08-02T00:00:00Z — the stamp comes from the logical clock at approval time, not from creation time"
            - "data.version == 2 and data.updated_at == 2026-08-02T00:00:00.000Z while data.created_at is still 2026-08-01T00:00:00.000Z"
            - "data.custodian_type and data.concentration_limit_bps are unchanged by the approval"

