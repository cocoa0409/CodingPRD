              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/percentage-rent-run"
              payload: { period_year: 2025 }
              as: PropertyManager
          assert:
            - "Lease.${lease_id}.outstanding_balance_cents == 0"

      - name: empty_denominator_zero_occupancy_on_preview
        grounds:
          - calculations.pro_rata_share
          - validations[priority=12]
          - errors[ERR_EMPTY_DENOMINATOR]
          - entities.Property.fields.occupied_sqft
        distinguishing_aspect: |
          Empty/zero-count boundary on a DIFFERENT metric (occupancy denominator)
          and a DIFFERENT endpoint (GET /reconciliations/{id}/preview): the pool's
          property (pool.property_id) has occupied_sqft==0 and the pool uses
          pro_rata_denominator=OCCUPIED, so the share denominator is zero ->
          ERR_EMPTY_DENOMINATOR, not a divide result.
        test_recipe:
          setup:
            - "EmptyProp has occupied_sqft 0 (no active leases on it). HostProp holds the subject lease so the lease FK resolves and is ACTIVE."
            - "The pool is created on EmptyProp with pro_rata_denominator=OCCUPIED; the reconciliation links the subject lease and this pool. preview computes share over the pool's property (EmptyProp, occupied 0)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "EmptyProp", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { empty_prop_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "HostProp", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { host_prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "DenTen", contact_email: "d@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${host_prop_id}", tenant_id: "${ten_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${empty_prop_id}", pool_year: 2025, pro_rata_denominator: "OCCUPIED", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
          trigger:
            - call: "GET /reconciliations/${recon_id}/preview"
              payload: {}
              as: Accountant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_DENOMINATOR"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
