              payload: {}
              as: TalentAgent
              captures: { e_ts: $.data.error_id }
            - call: "GET /engagements/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: TalentAgent
              captures: { e_eng: $.data.error_id }
            - call: "GET /appearance-bookings/00000000-0000-4000-8000-000000000014"
              payload: {}
              as: TalentAgent
