        distinguishing_aspect: "One payer-billed charge (9000), one sponsor-held charge (40000) and one still-unreviewed charge (5000) produce a summary where the 5000 appears ONLY in unrouted_charge_count and in no money field, and every figure equals the corresponding Study column."
