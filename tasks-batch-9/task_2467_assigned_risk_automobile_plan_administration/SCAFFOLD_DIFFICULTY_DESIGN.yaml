# =============================================================================
# Task 2467 — Assigned Risk Automobile Plan Administration
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Every numeric literal in an
# `assert:` line was computed by executing the §1.3 formula in code.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_refund_pro_rata_versus_short_rate_divergence
        grounds:
          - calculations.earned_premium_at_cancellation
          - entities.Policy.fields.refund_basis
          - entities.Policy.fields.earned_premium_cents
          - entities.Policy.fields.refund_paid_cents
          - state_machines.Policy.premium_settlement_status.PAID_IN_FULL_to_REFUND_ISSUED
        distinguishing_aspect: |
          Two policies carrying byte-identical rating data (T02 base, PLEASURE class, 6
          surcharge points, total_annual_charge_cents 246834, paid in full, cancelled
          effective 2026-12-15 at exactly 91 days in force) settle to different earned
          premium purely because the initiating party selects the variant: the
          carrier-initiated cancellation earns 61539 and refunds 185295, while the
          insured-initiated cancellation earns 67693 and refunds 179141 — a 6154-cent
          divergence on the money domain of the Policy entity.
        test_recipe:
          setup:
            - "Clock at 2026-12-15; plan period 2026-P3 open over 2026-09-01..2026-11-30."
            - "Two carriers: Atlas Mutual (6000 bps, T02) and Beacon Casualty (4000 bps, T02)."
            - "Two identical youthful-operator risks in T02 with one SPEEDING_MAJOR conviction each, certified in cycle 1, assigned one per carrier by the largest-remainder apportionment (targets 1 and 1)."
            - "Both policies effective 2026-09-15, expiring 2027-09-15, total_annual_charge_cents 246834, premium_credited_cents 246834, premium_settlement_status PAID_IN_FULL."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /plan/carriers"
              payload: { name: "Beacon Casualty", naic_code: "22222", voluntary_market_share_bps: 4000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c2_id: $.data.id }
            - call: "POST /plan/producers"
              payload: { name: "Harbor Agency", license_number: "PL-4471", appointed_territories: ["T01", "T02", "T03"] }
              as: PlanAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /plan/plan-periods"
              payload: { period_code: "2026-P3", window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-30T00:00:00Z", underserved_territories: ["T03"] }
              as: PlanAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /plan/applicants"
              payload: { full_name: "Rosa Vance", driver_license_number: "D-99001", territory_code: "T02", driver_class: "YOUTHFUL_OPERATOR", first_licensed_date: "2024-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /plan/applicants/${a1_id}/vehicles"
              payload: { vin: "1HGCM82633A004352", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v1_id: $.data.id }
            - call: "POST /plan/applicants"
              payload: { full_name: "Dale Ortiz", driver_license_number: "D-99002", territory_code: "T02", driver_class: "YOUTHFUL_OPERATOR", first_licensed_date: "2024-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a2_id: $.data.id }
            - call: "POST /plan/applicants/${a2_id}/vehicles"
              payload: { vin: "1HGCM82633A004353", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v2_id: $.data.id }
            - call: "POST /plan/applications"
              payload: { applicant_id: "${a1_id}", producer_id: "${p1_id}", vehicle_id: "${v1_id}", requested_effective_date: "2026-09-15T00:00:00Z", declared_violations: [{ code: "SPEEDING_MAJOR", conviction_date: "2025-03-10T00:00:00Z" }] }
              as: ProducerAgent
              as_user_id: "${p1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /plan/applications/${app1_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "11111", rejection_date: "2026-08-10T00:00:00Z", reason_code: "UNACCEPTABLE_DRIVING_RECORD", document_reference: "DEC-1001" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app1_id}/market-rejections"
