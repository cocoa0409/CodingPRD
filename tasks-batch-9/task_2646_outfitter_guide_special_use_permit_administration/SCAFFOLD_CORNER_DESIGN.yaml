          - validations[ERR_AUTHORIZATION_NOT_ACTIVE]
          - validations[ERR_INVALID_ASSESSMENT_STATE]
        distinguishing_aspect: |
          REVOKED, SUPERSEDED and a revoked authorization are absorbing: six different follow-up
          operations on the revoked permit all return the SAME 409, a second revoke of the same
          authorization is refused rather than treated as an idempotent no-op, and a superseded
          assessment cannot be re-published. The lockdown is also arithmetic — the released 200
          committed days are released exactly once, so available stays 900 rather than climbing to 1100.
