            - { call: "POST /participants", payload: { termination_case_id: "${c_fl}", full_name: "Fl Hi", ssn: "121110002", mailing_address: "2 F St", account_balance_cents: 20000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_fhi: "$.data.id" } }
