          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Chain Probe Template", pretext_category: "INVOICE_APPROVAL", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["AUTHORITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Chain Order Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id", c_v0: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-05T09:00:00Z", expected_campaign_version: "${c_v0}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/launch", payload: {}, as: ProgramAdmin }
          assert:
            - "the approve on DRAFT returns HTTP 409 with error_id ERR_CAMPAIGN_STATE_INVALID"
            - "the schedule on DRAFT returns HTTP 409 ERR_CAMPAIGN_STATE_INVALID (schedule is declared only from APPROVED and SCHEDULED)"
            - "the launch on DRAFT returns HTTP 409 ERR_CAMPAIGN_STATE_INVALID"
            - "PhishingCampaign.${c}.state is still DRAFT with version == ${c_v0} and scheduled_send_at null"

      - name: program_admin_cannot_create_campaigns_but_shares_template_creation
        claim_type: shared_operations
        grounds:
          - roles[ProgramAdmin]
          - roles[CampaignAuthor]
          - endpoints[POST /awareness/phishing-templates]
          - endpoints[POST /awareness/campaigns]
        distinguishing_aspect: "There is no hierarchical override: the ProgramAdmin who launches and closes campaigns still cannot create one (ERR_ROLE_NOT_PERMITTED, 403), while template creation is genuinely shared and succeeds for both roles."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
