#     ERR_ACTIVE_CONTRACT_EXISTS, ERR_SERIAL_DUPLICATE, ERR_TIER_PARTS_MISMATCH,
#     ERR_PM_FREQUENCY_BELOW_TIER, ERR_USAGE_REGRESSION,
#     ERR_CHECKLIST_ITEM_UNKNOWN, ERR_CHECKLIST_INCOMPLETE,
#     ERR_DUPLICATE_OPEN_CALL, ERR_PARTS_HOLD_LIMIT, ERR_PART_OUT_OF_STOCK,
#     ERR_NO_ELIGIBLE_TECHNICIAN, ERR_UNRESOLVED_PART_ORDER, ERR_FLEET_EMPTY,
#     ERR_PERIOD_ALREADY_RECONCILED, ERR_ALLOWANCE_ADJUSTMENT_INVALID,
#     ERR_INVENTORY_ADJUSTMENT_INVALID
#   carried by §1.8 and cited from an excluded_because stub here (7):
#     ERR_CONTRACT_NOT_ACTIVE and ERR_SAFETY_CERTIFICATION_REQUIRED
#     (dispatch_contract_not_active_outranks_safety_certification_required),
#     ERR_PART_MODEL_MISMATCH and ERR_PARTS_ALLOWANCE_EXHAUSTED
#     (parts_hold_model_mismatch_outranks_parts_allowance_exhausted),
#     ERR_CLUB_VISIT_CAPACITY (club_visit_capacity_treats_touching_windows_as_concurrent),
#     ERR_TECHNICIAN_WINDOW_CONFLICT (technician_calendar_needs_a_full_45_minute_travel_gap),
#     ERR_PART_SOURCE_UNAVAILABLE (new_part_sourcing_depends_on_part_catalog_lifecycle),
#     ERR_PART_OUT_OF_STOCK is additionally covered by
#     part_order_cancel_restores_allowance_and_the_originating_bucket
