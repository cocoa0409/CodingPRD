  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_claim_version_on_adjudicate
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=18]
          - errors[ERR_STALE_VERSION]
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: >-
          A SUBMITTED claim is in a live, adjudicable state; an adjudicate carrying
          expected_claim_version one below the claim's current version is rejected ERR_STALE_VERSION (412)
          by the priority-18 OCC guard before adjudication runs.
        test_recipe:
          setup:
            - "A COMPLETED insurance appointment by an INDEPENDENT CA therapist with a SUBMITTED claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr OC" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LOc", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "OcNet", in_network: false, contracted_rate_90791_cents: 0, contracted_rate_90834_cents: 0 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt OC", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COPAY", copay_cents: 2500, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-07-15T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id, cl_v: $.data.version }
          trigger:
            - call: "POST /claims/${cl_id}/adjudicate"
