  - section: errors
    instances:
      - name: error_duplicate_claim_on_mark_ready
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_CLAIM]"]
        excluded_because:
          difficulty_instance: duplicate_claim_beats_charge_max
          rationale: "Asserted as the failure path of the named §1.8 instance (409 ERR_DUPLICATE_CLAIM wins over the fiscal gate)."
      - name: error_ownership_mismatch_on_attestation_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_OWNERSHIP_MISMATCH]"]
        excluded_because:
          difficulty_instance: ownership_mismatch_beats_tefra_incomplete
          rationale: "Asserted as the failure path of the named §1.8 instance (403 ERR_OWNERSHIP_MISMATCH beats the TEFRA check); additionally exercised on assignment accept by rbac.accept_assignment_by_other_provider_forbidden in this file."
      - name: error_provider_suspended_on_accept
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROVIDER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: assignment_accept_gated_by_provider_active
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_roster_not_locked_on_claim_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROSTER_NOT_LOCKED]"]
        excluded_because:
          difficulty_instance: claim_submit_gated_by_roster_locked
          rationale: "Asserted as the first trigger of the named §1.8 instance (409 before lock, success after)."
      - name: error_call_window_overlap_on_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_CALL_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: call_window_closed_interval_endpoint_minute_conflict
          rationale: "Asserted as the failure path of the named §1.8 instance (shared endpoint minute 900)."
      - name: error_supervision_ratio_exceeded_on_fifth_direction
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUPERVISION_RATIO_EXCEEDED]"]
        excluded_because:
          difficulty_instance: supervision_ratio_capacity_4_allowed_5th_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance (peak 5 > RATIO_MAX 4)."
      - name: error_insufficient_rest_on_assignment
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_REST]"]
        excluded_because:
          difficulty_instance: rest_buffer_exactly_480_allowed_479_rejected
          rationale: "Asserted as the failure path of the named §1.8 instance (gap 420 < REST_MINUTES 480)."

  # Note: ERR_STALE_VERSION (412) has no §1.8 difficulty instance; it is covered
  # by three LIVE instances in the cross_cutting_layers section of this file
  # (occ_assignment_create_stale_case_version_rejected,
  #  occ_roster_patch_stale_version_rejected,
  #  occ_provider_credentials_stale_version_rejected), one per §1.2.1 rule.

  # ===========================================================================
  # Section: rbac (Table 7 claims)
  # ===========================================================================
  - section: rbac
    instances:
      - name: scheduler_cannot_manage_providers
        claim_type: rbac_deny
        grounds: [roles.Scheduler, roles.GroupAdministrator, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Scheduler (opaque role) calling the GroupAdministrator-exclusive POST /providers is rejected 403 ERR_INSUFFICIENT_PERMISSIONS (priority 2, before schema/existence)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_INSUFFICIENT_PERMISSIONS; GET /providers total_count == 0 (nothing persisted)"

      - name: crna_cannot_create_roster
        claim_type: rbac_deny
        grounds: [roles.CRNA, roles.Scheduler, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "CRNA is entity-backed (X-User-ID must be a Provider id) yet holds no write scope: POST /rosters as CRNA is rejected 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Site S; CRNA provider P exists"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1020 }
              as: CRNA
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_INSUFFICIENT_PERMISSIONS"

      - name: billing_specialist_cannot_run_audit
        claim_type: rbac_deny
        grounds: [roles.BillingSpecialist, roles.ComplianceAuditor, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "BillingSpecialist calling the ComplianceAuditor-exclusive POST /audits is rejected 403 ERR_INSUFFICIENT_PERMISSIONS — billing and audit duties are segregated."
        test_recipe:
          setup: ["Site S; roster 2026-08-10 exists (audit target)"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/audits"
              payload: { roster_id: "${roster_id}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_INSUFFICIENT_PERMISSIONS"

      - name: compliance_auditor_cannot_void_stipend_entry
        claim_type: rbac_deny
        grounds: [roles.ComplianceAuditor, roles.GroupAdministrator, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "POST /stipend-entries/{id}/void is GroupAdministrator-exclusive: ComplianceAuditor is rejected 403 ERR_INSUFFICIENT_PERMISSIONS — role authorization (priority 2) fires before the path id's existence check (priority 4), so even a non-existent entry id yields 403."
        test_recipe:
          setup: ["Empty database (entry id need not exist: authorization precedes existence)"]
          setup_api_calls: []
          trigger:
            - call: "POST /anesthesia-ops/stipend-entries/00000000-0000-4000-8000-000000000000/void"
              payload: {}
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_INSUFFICIENT_PERMISSIONS (not 404 — authorization precedes existence)"

      - name: crna_cannot_read_stipend_entries
        claim_type: rbac_deny
        grounds: [roles.CRNA, "errors[ERR_INSUFFICIENT_PERMISSIONS]", "endpoints.\"GET /anesthesia-ops/stipend-entries\""]
        distinguishing_aspect: "CRNA's shared GET access explicitly excludes stipend-entries: GET /stipend-entries as CRNA is rejected 403 ERR_INSUFFICIENT_PERMISSIONS while AttendingAnesthesiologist... no — CRNA is simply absent from the endpoint's role list."
        test_recipe:
          setup: ["CRNA provider P exists"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /anesthesia-ops/stipend-entries"
              payload: { provider_id: "${p_id}" }
              as: CRNA
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_INSUFFICIENT_PERMISSIONS (stipend-entries GETs are limited to GroupAdministrator, Scheduler, BillingSpecialist)"

      - name: group_admin_cannot_submit_attestation
        claim_type: rbac_deny
        grounds: [roles.GroupAdministrator, roles.AttendingAnesthesiologist, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "POST /attestations/{id}/submit is AttendingAnesthesiologist-only: GroupAdministrator (the config superuser) is rejected 403 — the role model is segregated duties, not hierarchical override."
        test_recipe:
          setup: ["Site S; fee P100; physician D; roster PUBLISHED; case [540,600); attestation (case, D) IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /anesthesia-ops/attestations"
              payload: { case_id: "${case_id}", physician_id: "${d_id}" }
              as: Scheduler
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/attestations/${att_id}/submit"
              payload: { step_preanesthetic_exam: true, step_prescribes_plan: true, step_participates_key_portions: true, step_ensures_qualified_personnel: true, step_monitors_course: true, step_available_for_emergencies: true, step_post_anesthesia_care: true }
              as: GroupAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_INSUFFICIENT_PERMISSIONS; attestation stays IN_PROGRESS"

      - name: accept_assignment_by_other_provider_forbidden
        claim_type: rbac_deny
        grounds: ["validations[priority=5]", "errors[ERR_OWNERSHIP_MISMATCH]", roles.CRNA]
        distinguishing_aspect: "Entity-backed ownership: a CRNA accepting an assignment whose provider_id is a DIFFERENT provider is rejected 403 ERR_OWNERSHIP_MISMATCH (X-User-ID must equal the assignment's provider_id)."
        test_recipe:
          setup: ["Site S; fee P100; CRNAs P1 (assignee) and P2 (caller); roster PUBLISHED; case [540,600) with P1 primary PROPOSED"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna Two", provider_type: "CRNA", npi: "1000000004", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${p1_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: CRNA
              as_user_id: "${p2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 ERR_OWNERSHIP_MISMATCH (P2's id != assignment.provider_id == P1); assignment stays PROPOSED"

      - name: physician_self_attestation_create_allowed_other_forbidden
        claim_type: rbac_allow
        grounds: ["endpoints.\"POST /anesthesia-ops/attestations\"", roles.AttendingAnesthesiologist, "errors[ERR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Shared create with ownership twist: AttendingAnesthesiologist may create an attestation only for themself (physician_id == X-User-ID -> 201); creating one for a colleague -> 403 ERR_OWNERSHIP_MISMATCH, while Scheduler (the other allowed role) may create for any physician."
        test_recipe:
          setup: ["Site S; fee P100; physicians D, D2; roster PUBLISHED; cases A [540,600), B [660,720)"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Direct", provider_type: "ANESTHESIOLOGIST", npi: "1000000002", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Peer", provider_type: "ANESTHESIOLOGIST", npi: "1000000005", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { d2_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 0, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { ka_id: $.data.id }
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 660, scheduled_end_minute: 720 }
              as: Scheduler
              captures: { kb_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/attestations"
              payload: { case_id: "${ka_id}", physician_id: "${d_id}" }
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
              captures: { att_id: $.data.id, att_status: $.data.status }
            - call: "POST /anesthesia-ops/attestations"
              payload: { case_id: "${kb_id}", physician_id: "${d2_id}" }
              as: AttendingAnesthesiologist
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Self attestation (physician_id == X-User-ID): 201, status IN_PROGRESS"
            - "Attestation for a colleague (physician_id != X-User-ID): 403 ERR_OWNERSHIP_MISMATCH"
  # ===========================================================================
  # Section: cross_cutting_layers (complexity layer claims)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_assignment_create_stale_case_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[assignment-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on AnesthesiaCase.version: after assignment A advances the case version (1 -> 2), a second create carrying the previously observed expected_case_version (1) is rejected 412 ERR_STALE_VERSION — and assignment A is NOT superseded by the failed write."
        test_recipe:
          setup: ["Site S; fee P100; CRNAs P1, P2; roster 2026-08-10 PUBLISHED; case [540,600) created (version captured at 1)"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna Two", provider_type: "CRNA", npi: "1000000004", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 600 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
          trigger:
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${p1_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { a1_id: $.data.id }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${p2_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { err: $.data.error_id }
            - call: "GET /anesthesia-ops/assignments/${a1_id}"
              as: Scheduler
              captures: { a1_status: $.data.status }
          assert:
            - "First create succeeds with expected_case_version == ${case_ver} (case version was 1; success bumps it to 2)"
            - "Second create with the SAME captured version ${case_ver} (now stale): 412 ERR_STALE_VERSION"
            - "Assignment A ${a1_id} remains PROPOSED — the rejected write did not supersede it"

      - name: occ_roster_patch_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[roster-update-stale-roster]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DailyRoster.version: publish bumps the roster to version 2, so a PATCH carrying the pre-publish version (1) is rejected 412; re-reading and patching with the fresh version succeeds and bumps to 3."
        test_recipe:
          setup: ["Site S; roster created (version 1 captured), then PUBLISHED (version 2)"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1020 }
              as: Scheduler
              captures: { roster_id: $.data.id, r_ver: $.data.version }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
          trigger:
            - call: "PATCH /anesthesia-ops/rosters/${roster_id}"
              payload: { required_primary_slots: 3, expected_roster_version: "${r_ver}" }
              as: Scheduler
              captures: { err: $.data.error_id }
            - call: "GET /anesthesia-ops/rosters/${roster_id}"
              as: Scheduler
              captures: { r_ver2: $.data.version }
            - call: "PATCH /anesthesia-ops/rosters/${roster_id}"
              payload: { required_primary_slots: 3, expected_roster_version: "${r_ver2}" }
              as: Scheduler
              captures: { slots: $.data.required_primary_slots, r_ver3: $.data.version }
          assert:
            - "Stale PATCH (expected_roster_version == 1 while roster is at 2): 412 ERR_STALE_VERSION; required_primary_slots unchanged (still 1)"
            - "Fresh PATCH with re-read version 2: 200, required_primary_slots == 3, version == 3"

      - name: occ_provider_credentials_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[credentials-update-stale-provider]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Provider.version: two sequential credential PATCHes carrying the same observed version — the first succeeds (v1 -> v2), the second with the stale version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Provider P (CRNA) created with 2027 expiries (version 1 captured)"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Crna One", provider_type: "CRNA", npi: "1000000003", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { p_id: $.data.id, p_ver: $.data.version }
          trigger:
            - call: "PATCH /anesthesia-ops/providers/${p_id}/credentials"
              payload: { credential_expires_on: "2027-06-30", dea_expires_on: "2027-06-30", expected_provider_version: "${p_ver}" }
              as: GroupAdministrator
              captures: { p_ver2: $.data.version }
            - call: "PATCH /anesthesia-ops/providers/${p_id}/credentials"
              payload: { credential_expires_on: "2027-12-31", dea_expires_on: "2027-12-31", expected_provider_version: "${p_ver}" }
              as: GroupAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH with version ${p_ver} (1): 200, version becomes 2"
            - "Second PATCH with the same stale ${p_ver}: 412 ERR_STALE_VERSION; credential_expires_on remains '2027-06-30'"

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: case_completion_cascade_to_audit_scores
          rationale: "N-level cascade chain verified end-to-end by the named §1.8 instance (complete -> assignments/claims/finding -> audit scores -> risk_band)."
      - name: layer_dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: provisional_vs_final_charge_diverge_on_actual_minutes
          rationale: "Both variants asserted with literal expected values by the named §1.8 instance (and its audit-score sibling)."
      - name: layer_rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: standby_notice_exactly_120_partial_119_full
          rationale: "Threshold boundary behavior asserted by the named §1.8 instance plus the 480/1440 boundary instances in calculations."

  # ===========================================================================
  # Section: consistency_model (immediate visibility claims)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_accept_side_effects
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, state_machines.CaseAssignment.PROPOSED_to_CONFIRMED, entities.DailyRoster.fields.posture]
        distinguishing_aspect: "Immediate consistency: the accept response itself carries status CONFIRMED / version 2, and the very next reads (no delay, no recompute endpoint) show the derived effects — case provisional_charge_cents == 104000 and roster posture flipped to STAFFED."
        test_recipe:
          setup: ["Site S; fee P100 base 5; MD physician; roster 2026-08-10 slots 1 PUBLISHED; case [540,660) with MD primary PROPOSED"]
          setup_api_calls:
            - call: "POST /anesthesia-ops/sites"
              payload: { name: "General Hospital" }
              as: GroupAdministrator
              captures: { site_id: $.data.id }
            - call: "POST /anesthesia-ops/fee-schedules"
              payload: { procedure_code: "P100", base_units: 5, contracted_max_cents: 1000000 }
              as: GroupAdministrator
            - call: "POST /anesthesia-ops/providers"
              payload: { full_name: "Dr. Avery", provider_type: "ANESTHESIOLOGIST", npi: "1000000001", credential_expires_on: "2027-01-31", dea_expires_on: "2027-01-31" }
              as: GroupAdministrator
              captures: { md_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters"
              payload: { site_id: "${site_id}", service_date: "2026-08-10", required_primary_slots: 1, scheduled_day_end_minute: 1200 }
              as: Scheduler
              captures: { roster_id: $.data.id }
            - call: "POST /anesthesia-ops/rosters/${roster_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /anesthesia-ops/cases"
              payload: { roster_id: "${roster_id}", procedure_code: "P100", physical_status: "P1", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: Scheduler
              captures: { case_id: $.data.id, case_ver: $.data.version }
            - call: "POST /anesthesia-ops/cases/${case_id}/assignments"
              payload: { provider_id: "${md_id}", assignment_role: "CASE_PRIMARY", expected_case_version: "${case_ver}" }
              as: Scheduler
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-ops/assignments/${asg_id}/accept"
              payload: {}
              as: AttendingAnesthesiologist
              as_user_id: "${md_id}"
              captures: { st: $.data.status, ver: $.data.version }
            - call: "GET /anesthesia-ops/cases/${case_id}"
              as: Scheduler
              captures: { prov: $.data.provisional_charge_cents }
            - call: "GET /anesthesia-ops/rosters/${roster_id}"
              as: Scheduler
              captures: { po: $.data.posture }
          assert:
            - "Accept response body itself: status == CONFIRMED, version == 2 (mutation visible in the same request's response)"
            - "Immediate read: case.provisional_charge_cents == 104000 (13.0 units x PERSONAL 8000, recomputed synchronously on accept)"
            - "Immediate read: roster.posture == STAFFED (1 confirmed >= 1 slot) with no intervening recompute call"
