scenario: |
  Source Plasma Donation Center Donor Qualification & Compensation (CSL Plasma): donor screening with identity verification, health history, physical measurements and viral marker testing before qualification, applicant donor status requiring a second donation within a window before plasma can be released, donation frequency limits per rolling period with system enforcement across centers, compensation schedules with promotional structures and tax reporting obligations, plasma volume determined by donor weight with device programming and adverse reaction monitoring, unit quarantine and look-back procedures when a subsequent donation tests reactive, center throughput management across screening, donor floor beds and post-donation observation, regulatory inspection and donor deferral registry participation

domain_name: plasma-donation-center
api_prefix: /plasma-centers

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PlasmaCenter
    parent: null
    common_fields: true
    fields:
      - { name: center_code, type: string, source: input, description: "Globally unique center code (e.g. CSL-DAL-014); immutable after create" }
      - { name: legal_name, type: string, source: input, description: "Legal entity name on file with the regulator" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the center operates" }
      - { name: screening_lanes, type: integer, source: input, description: "Count of parallel screening lanes; >= 1" }
      - { name: donor_floor_beds, type: integer, source: input, description: "Count of phlebotomy beds on the donor floor; >= 1" }
      - { name: observation_chairs, type: integer, source: input, description: "Count of post-donation observation chairs; >= 1" }
      - { name: status, type: enum, source: system, description: "OPERATIONAL | INSPECTION_HOLD | DECOMMISSIONED", constraints: "initial OPERATIONAL; INSPECTION_HOLD gates all visit pipeline writes; DECOMMISSIONED is terminal" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: external_donor_ref, type: string, source: input, description: "Government-issued identity reference hashed at intake; unique per donor across ALL centers (cross-center dedupe key)" }
      - { name: legal_first_name, type: string, source: input, description: "Legal first name per identity document" }
      - { name: legal_last_name, type: string, source: input, description: "Legal last name per identity document" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); donor must be >= 18 years old at registration" }
      - { name: weight_kg, type: number, source: input, description: "Most recent measured body weight in kilograms, 1 decimal place" }
      - { name: home_center_id, type: string, source: input, description: "FK -> PlasmaCenter.id; donor's primary center (used for throughput accounting, NOT for cross-center frequency gating)" }
      - { name: donor_status, type: enum, source: system, description: "APPLICANT | QUALIFIED | DEFERRED_TEMP | DEFERRED_PERM", constraints: "initial APPLICANT; APPLICANT -> QUALIFIED only via second-visit qualification rule; DEFERRED_TEMP auto-clears after deferral_ends_on; DEFERRED_PERM is terminal" }
      - { name: applicant_window_started_on, type: datetime, source: system, description: "Timestamp of donor's first successful donation; null until that donation completes; anchors the APPLICANT second-donation window" }
      - { name: deferral_ends_on, type: datetime, source: system, description: "When donor_status == DEFERRED_TEMP, the first instant at which the donor may be re-screened; null otherwise" }
      - { name: deferred_reason_code, type: string, source: system, description: "Machine-readable deferral code from DeferralRegistryEntry.reason_code; null when not deferred" }
      - { name: lifetime_donation_count, type: integer, source: computed, description: "Count of DonationVisit rows for this donor with visit_status == COMPLETED; maintained incrementally" }
      - { name: ytd_compensation_cents, type: integer, source: computed, description: "Sum of CompensationPayment.net_cents for this donor where payment_status == FINALIZED and payment_issued_on falls in the current calendar year of the logical clock; recomputed on every payment finalize and claw-back; feeds the 1099-NEC threshold" }
      - { name: requires_1099, type: boolean, source: computed, default: false, description: "True once ytd_compensation_cents has reached TAX_REPORTING_THRESHOLD_CENTS (60000) at any point in the current calendar year; sticky DOWNWARD — a later claw-back that pulls ytd below the threshold does NOT clear the flag" }
      - { name: active_deferral_id, type: string, source: system, description: "FK -> DeferralRegistryEntry.id; the currently governing deferral row, null when donor_status != DEFERRED_TEMP and != DEFERRED_PERM" }

  - name: ScreeningVisit
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; the donor being screened" }
      - { name: center_id, type: string, source: input, description: "FK -> PlasmaCenter.id; the center where screening occurs (may differ from donor.home_center_id)" }
      - { name: scheduled_for, type: datetime, source: input, description: "When the screening is scheduled to begin" }
      - { name: screening_lane_index, type: integer, source: computed, description: "Server-assigned lane in [0, center.screening_lanes); assignment rule is lowest-index lane whose current-shift intervals do not overlap; ties broken by created_at ASC of conflicting bookings" }
      - { name: identity_verified, type: boolean, source: system, default: false, description: "Set true only by POST .../verify-identity; never settable directly" }
      - { name: health_history_recorded, type: boolean, source: system, default: false, description: "Set true only by POST .../health-history; never settable directly" }
      - { name: physical_exam_recorded, type: boolean, source: system, default: false, description: "Set true only by POST .../physical-exam; never settable directly" }
      - { name: viral_marker_recorded, type: boolean, source: system, default: false, description: "Set true only by POST .../viral-marker-test; never settable directly" }
      - { name: visit_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | CLEARED | FAILED | EXPIRED", constraints: "initial SCHEDULED; IN_PROGRESS entered on any screening sub-record write; CLEARED requires all four sub-records true; FAILED on any sub-record rejection; EXPIRED when logical clock passes scheduled_for + 24h with visit_status still SCHEDULED or IN_PROGRESS" }

  - name: ScreeningSubRecord
    parent: ScreeningVisit
    common_fields: true
    fields:
      - { name: screening_visit_id, type: string, source: system, description: "FK -> ScreeningVisit.id" }
      - { name: record_type, type: enum, source: input, description: "IDENTITY | HEALTH_HISTORY | PHYSICAL_EXAM | VIRAL_MARKER", constraints: "at most one row per (screening_visit_id, record_type); second POST for same record_type is rejected ERR_DUPLICATE_SUB_RECORD" }
      - { name: payload, type: object, source: input, description: "Record-type-specific measurements; PHYSICAL_EXAM must include weight_kg, pulse_bpm, systolic_mmhg, diastolic_mmhg, temperature_c, hematocrit_pct, total_protein_g_dl; VIRAL_MARKER must include hiv_ag_ab, hbv_surface_ag, hcv_ab (each NON_REACTIVE|REACTIVE); HEALTH_HISTORY must include risk_flags (string array, may be empty)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the Recorder that posted this record; used to enforce segregation of duties at clearance time" }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL", constraints: "computed at write time from per-record-type rules: IDENTITY PASS iff payload.document_number non-empty; HEALTH_HISTORY FAIL iff payload.risk_flags non-empty; PHYSICAL_EXAM FAIL iff any vital out of band (weight_kg<50, pulse_bpm<50 or >100, systolic_mmhg<90 or >180, diastolic_mmhg<50 or >100, temperature_c<35.5 or >37.5, hematocrit_pct<38 or >54, total_protein_g_dl<6.0 or >9.0); VIRAL_MARKER FAIL iff any of hiv_ag_ab/hbv_surface_ag/hcv_ab == REACTIVE" }

  - name: DonationVisit
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: center_id, type: string, source: input, description: "FK -> PlasmaCenter.id where donation occurs; may differ from donor.home_center_id" }
      - { name: screening_visit_id, type: string, source: input, description: "FK -> ScreeningVisit.id with visit_status == CLEARED; the qualifying screen for this donation" }
      - { name: scheduled_for, type: datetime, source: input, description: "When donation is scheduled" }
      - { name: bed_index, type: integer, source: computed, description: "Server-assigned bed on the donor floor in [0, center.donor_floor_beds); assigned on transition to IN_PROGRESS via lowest-index free bed; freed when visit leaves IN_PROGRESS" }
      - { name: observation_chair_index, type: integer, source: computed, description: "Server-assigned observation chair in [0, center.observation_chairs); assigned on transition to OBSERVATION; freed when visit leaves OBSERVATION" }
      - { name: programmed_volume_ml, type: integer, source: computed, description: "Device-programmed draw volume in mL, computed from donor.weight_kg at check-in time by plasma_volume_ml calculation; immutable once set" }
      - { name: actual_volume_ml, type: integer, source: system, description: "Actual collected mL reported by the device at collection completion; null until then" }
      - { name: visit_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | OBSERVATION | COMPLETED | ABORTED_REACTION | NO_SHOW", constraints: "initial SCHEDULED; IN_PROGRESS -> OBSERVATION -> COMPLETED is the happy path; ABORTED_REACTION is reachable from IN_PROGRESS or OBSERVATION via POST .../adverse-reactions; NO_SHOW auto-fires when clock passes scheduled_for + 6h with visit_status == SCHEDULED" }
      - { name: compensation_payment_id, type: string, source: system, description: "FK -> CompensationPayment.id; created at check-in with provisional_cents, finalized at visit COMPLETED" }

  - name: AdverseReaction
    parent: DonationVisit
    common_fields: true
    fields:
      - { name: donation_visit_id, type: string, source: system, description: "FK -> DonationVisit.id" }
      - { name: severity, type: enum, source: input, description: "MILD | MODERATE | SEVERE" }
      - { name: reaction_code, type: string, source: input, description: "Controlled vocabulary e.g. VASOVAGAL, HEMATOMA, CITRATE, ARTERIAL_PUNCTURE, OTHER" }
      - { name: observed_at, type: datetime, source: input, description: "When the reaction was observed; must be <= logical clock now" }
      - { name: notes, type: string, source: input, description: "Free-text clinical notes; >= 10 characters" }

  - name: DonationUnit
    parent: DonationVisit
    common_fields: true
    fields:
      - { name: donation_visit_id, type: string, source: system, description: "FK -> DonationVisit.id; exactly one unit per COMPLETED visit, exactly one per ABORTED_REACTION visit with actual_volume_ml > 0" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; denormalized for look-back queries" }
      - { name: center_id, type: string, source: system, description: "FK -> PlasmaCenter.id; denormalized for inventory queries" }
      - { name: volume_ml, type: integer, source: system, description: "= DonationVisit.actual_volume_ml at unit creation" }
      - { name: collected_at, type: datetime, source: system, description: "= DonationVisit completion timestamp" }
      - { name: unit_status, type: enum, source: system, description: "QUARANTINED | RELEASED | DESTROYED | LOOKBACK_HOLD", constraints: "initial QUARANTINED; QUARANTINED -> RELEASED only when donor qualified AND no reactive look-back; QUARANTINED -> LOOKBACK_HOLD when a later donation of the same donor tests reactive; LOOKBACK_HOLD -> DESTROYED or -> RELEASED after look-back resolution; QUARANTINED -> DESTROYED when parent donor becomes DEFERRED_PERM" }
      - { name: released_at, type: datetime, source: system, description: "Set when unit_status transitions to RELEASED; null otherwise" }
      - { name: destroyed_at, type: datetime, source: system, description: "Set when unit_status transitions to DESTROYED; null otherwise" }
      - { name: destruction_reason, type: string, source: system, description: "DONOR_PERMANENT_DEFERRAL | REACTIVE_LOOKBACK | EXPIRED_HOLD; null unless DESTROYED" }

  - name: CompensationSchedule
    parent: PlasmaCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> PlasmaCenter.id" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the schedule window" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end; must be > effective_from" }
      - { name: base_cents_first_donation, type: integer, source: input, description: "Base pay for the donor's first completed donation in any calendar month" }
      - { name: base_cents_second_donation, type: integer, source: input, description: "Base pay for the donor's second completed donation in any calendar month" }
      - { name: base_cents_subsequent_donation, type: integer, source: input, description: "Base pay for the third and later completed donations in any calendar month" }
      - { name: promo_code, type: string, source: input, description: "Optional promo code string attached to this schedule; may be null", default: null }
      - { name: promo_bonus_cents, type: integer, source: input, description: "Flat bonus paid ONCE per promo redemption per donor when the qualifying donation-count threshold is reached within the schedule window", default: 0 }
      - { name: promo_qualifying_donation_count, type: integer, source: input, description: "Number of completed donations within the schedule window required to trigger promo_bonus_cents; 0 disables promo", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, increments on every mutation including auto-supersede side effects" }
      - { name: schedule_status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | RETIRED", constraints: "initial ACTIVE; at most one ACTIVE schedule per center; creating a new ACTIVE schedule auto-supercedes the prior one (prior's effective_to is rewritten to the new effective_from)" }

  - name: CompensationPayment
    parent: DonationVisit
    common_fields: true
    fields:
      - { name: donation_visit_id, type: string, source: system, description: "FK -> DonationVisit.id; one payment per visit" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; denormalized for tax aggregation" }
      - { name: center_id, type: string, source: system, description: "FK -> PlasmaCenter.id; denormalized for schedule lookup" }
      - { name: schedule_id, type: string, source: system, description: "FK -> CompensationSchedule.id; the ACTIVE schedule at visit check-in (version-pinned)" }
      - { name: base_cents, type: integer, source: computed, description: "Base pay chosen from the schedule by donor's monthly donation ordinal at check-in (provisional) or completion (final)" }
      - { name: promo_cents, type: integer, source: computed, description: "Promo component; provisional value assumes qualifying count WILL be reached by end of schedule window; final value is 0 unless the qualifying count was actually reached at completion time" }
      - { name: net_cents, type: integer, source: computed, description: "= base_cents + promo_cents for the current variant" }
      - { name: payment_status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | CLAWED_BACK", constraints: "PROVISIONAL at check-in; FINALIZED at visit COMPLETED; CLAWED_BACK if a look-back destroys the underlying DonationUnit AND payment_status was FINALIZED" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL | FINAL", constraints: "PROVISIONAL until DonationVisit reaches COMPLETED, then FINAL; switching variant recomputes base_cents/promo_cents/net_cents and stamps variant_switched_at" }
      - { name: variant_switched_at, type: datetime, source: system, description: "Timestamp of the PROVISIONAL -> FINAL transition; null until then" }
      - { name: payment_issued_on, type: datetime, source: system, description: "Logical-clock date the FINALIZED payment posts to the donor's ytd accumulator" }

  - name: DeferralRegistryEntry
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: reason_code, type: string, source: input, description: "Controlled vocabulary e.g. REACTIVE_HIV, REACTIVE_HBV, REACTIVE_HCV, LOW_HEMATOCRIT, TRAVEL_MALARIA, ADVERSE_REACTION_SEVERE, MEDICAL_HOLD" }
      - { name: deferral_type, type: enum, source: input, description: "TEMPORARY | PERMANENT" }
      - { name: deferral_ends_on, type: datetime, source: input, description: "Required iff deferral_type == TEMPORARY; must be > created_at logical clock; null when PERMANENT" }
      - { name: source_center_id, type: string, source: system, description: "FK -> PlasmaCenter.id; the center that filed the entry" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer that filed the entry" }
      - { name: registry_status, type: enum, source: system, description: "ACTIVE | CLEARED | OVERRIDDEN", constraints: "initial ACTIVE; ACTIVE -> CLEARED only by system when deferral_type == TEMPORARY and logical clock >= deferral_ends_on; ACTIVE -> OVERRIDDEN by ComplianceOfficer only with override_rationale" }
      - { name: override_rationale, type: string, source: input, description: "Required iff transition is ACTIVE -> OVERRIDDEN; >= 20 characters", default: null }

  - name: LookBackCase
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: triggering_screening_sub_record_id, type: string, source: input, description: "FK -> ScreeningSubRecord.id with record_type == VIRAL_MARKER and outcome == FAIL that initiated the look-back" }
      - { name: triggering_donation_visit_id, type: string, source: input, description: "FK -> DonationVisit.id; the donation visit performed under the screening that surfaced the reactive marker — i.e. the DonationVisit whose screening_visit_id == triggering_screening_sub_record.screening_visit_id; that visit need NOT be COMPLETED (the marker can surface on the screening of a still-SCHEDULED visit)" }
      - { name: lookback_window_days, type: integer, source: system, description: "Fixed at 180; the look-back horizon" }
      - { name: case_status, type: enum, source: system, description: "OPEN | UNITS_QUARANTINED | RESOLVED_DESTROYED | RESOLVED_RELEASED", constraints: "initial OPEN; OPEN -> UNITS_QUARANTINED when all in-window units are moved to LOOKBACK_HOLD; UNITS_QUARANTINED -> RESOLVED_DESTROYED when every held unit is DESTROYED; UNITS_QUARANTINED -> RESOLVED_RELEASED when every held unit is RELEASED (false-positive retest path)" }
      - { name: opened_at, type: datetime, source: system, description: "Logical clock timestamp when the case was opened" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock timestamp when case_status reached a RESOLVED_* state; null until then" }

  - name: CenterCapacitySnapshot
    parent: PlasmaCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: system, description: "FK -> PlasmaCenter.id" }
      - { name: snapshot_at, type: datetime, source: system, description: "Logical clock timestamp the snapshot captures" }
      - { name: screening_lanes_in_use, type: integer, source: computed, description: "Count of ScreeningVisit rows with center_id == this center, visit_status == IN_PROGRESS, and the logical clock inside [scheduled_for, scheduled_for + 24h)" }
      - { name: donor_floor_beds_in_use, type: integer, source: computed, description: "Count of DonationVisit rows with center_id == this center and visit_status == IN_PROGRESS" }
      - { name: observation_chairs_in_use, type: integer, source: computed, description: "Count of DonationVisit rows with center_id == this center and visit_status == OBSERVATION" }
      - { name: pending_releases_count, type: integer, source: computed, description: "Count of DonationUnit rows with center_id == this center and unit_status == QUARANTINED" }
      - { name: trigger_event, type: string, source: system, description: "Short label of the transition that produced this snapshot (e.g. 'donation.check_in', 'screening.cleared', 'unit.released')" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlasmaCenter
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPERATIONAL
        to: INSPECTION_HOLD
        trigger: "POST /plasma-centers/{centerId}/inspection-holds"
        actor: ComplianceOfficer
        preconditions:
          - "center.status == OPERATIONAL (ERR_CENTER_NOT_OPERATIONAL)"
          - "expected_center_version matches current version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "center.status -> INSPECTION_HOLD"
          - "center.version += 1"
          - "All DonationVisit rows for this center with visit_status == SCHEDULED are moved to NO_SHOW (scheduled_for unchanged); their CompensationPayment rows (if any) stay PROVISIONAL"
          - "All ScreeningVisit rows for this center with visit_status == SCHEDULED are moved to EXPIRED"
          - "CenterCapacitySnapshot written with trigger_event = 'center.inspection_hold'"

      - from: INSPECTION_HOLD
        to: OPERATIONAL
        trigger: "POST /plasma-centers/{centerId}/inspection-holds/clear"
        actor: ComplianceOfficer
        preconditions:
          - "center.status == INSPECTION_HOLD (ERR_CENTER_NOT_ON_HOLD)"
          - "expected_center_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "center.status -> OPERATIONAL"
          - "center.version += 1"
          - "CenterCapacitySnapshot written with trigger_event = 'center.inspection_hold_cleared'"

      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /plasma-centers/{centerId}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "center.status == OPERATIONAL (ERR_CENTER_NOT_OPERATIONAL)"
          - "No DonationVisit for this center in {SCHEDULED, IN_PROGRESS, OBSERVATION} (ERR_CENTER_HAS_ACTIVE_VISITS)"
          - "No ScreeningVisit for this center in {SCHEDULED, IN_PROGRESS} (ERR_CENTER_HAS_ACTIVE_VISITS)"
          - "expected_center_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "center.status -> DECOMMISSIONED"
          - "center.version += 1"
          - "All DonationUnit rows for this center with unit_status == QUARANTINED are moved to DESTROYED with destruction_reason = EXPIRED_HOLD"

  - entity: Donor
    initial_state: APPLICANT
    terminal_states: [DEFERRED_PERM]
    transitions:
      - from: APPLICANT
        to: QUALIFIED
        trigger: "system (automatic when a DonationVisit for this donor reaches COMPLETED AND the donor already has lifetime_donation_count >= 1 counting THIS completion AND the second donation's collected_at is within APPLICANT_WINDOW_DAYS of applicant_window_started_on)"
        actor: system
        preconditions:
          - "donor.donor_status == APPLICANT at evaluation time"
          - "the just-completed donation is at least the donor's second lifetime completion"
          - "second_completion.collected_at - applicant_window_started_on <= APPLICANT_WINDOW_DAYS (default 180 days)"
        side_effects:
          - "donor.donor_status -> QUALIFIED"
          - "Every DonationUnit for this donor with unit_status == QUARANTINED whose triggering visit's screening had no reactive viral marker is transitioned to RELEASED (released_at = now)"
          - "CenterCapacitySnapshot written for the donor.home_center_id with trigger_event = 'donor.qualified'"

      - from: APPLICANT
        to: DEFERRED_TEMP
        trigger: "POST /donors/{donorId}/deferrals (deferral_type=TEMPORARY)"
        actor: ComplianceOfficer
        preconditions:
          - "donor.donor_status IN {APPLICANT, QUALIFIED} (ERR_DONOR_NOT_DEFERRABLE)"
          - "no ACTIVE DeferralRegistryEntry exists for this donor (ERR_ACTIVE_DEFERRAL_EXISTS)"
        side_effects:
          - "DeferralRegistryEntry created with registry_status = ACTIVE"
          - "donor.donor_status -> DEFERRED_TEMP"
          - "donor.active_deferral_id -> new entry id"
          - "donor.deferral_ends_on -> entry.deferral_ends_on"
          - "donor.deferred_reason_code -> entry.reason_code"
          - "donor.version += 1"
          - "All DonationVisit rows for this donor with visit_status == SCHEDULED are moved to NO_SHOW"

      - from: QUALIFIED
        to: DEFERRED_TEMP
        trigger: "POST /donors/{donorId}/deferrals (deferral_type=TEMPORARY)"
        actor: ComplianceOfficer
        preconditions:
          - "donor.donor_status IN {APPLICANT, QUALIFIED} (ERR_DONOR_NOT_DEFERRABLE)"
          - "no ACTIVE DeferralRegistryEntry exists for this donor (ERR_ACTIVE_DEFERRAL_EXISTS)"
        side_effects:
          - "DeferralRegistryEntry created with registry_status = ACTIVE"
          - "donor.donor_status -> DEFERRED_TEMP"
          - "donor.active_deferral_id -> new entry id"
          - "donor.deferral_ends_on -> entry.deferral_ends_on"
          - "donor.deferred_reason_code -> entry.reason_code"
          - "donor.version += 1"
          - "All DonationVisit rows for this donor with visit_status == SCHEDULED are moved to NO_SHOW"

      - from: APPLICANT
        to: DEFERRED_PERM
        trigger: "POST /donors/{donorId}/deferrals (deferral_type=PERMANENT)"
        actor: ComplianceOfficer
        preconditions:
          - "donor.donor_status IN {APPLICANT, QUALIFIED} (ERR_DONOR_NOT_DEFERRABLE)"
          - "no ACTIVE DeferralRegistryEntry exists for this donor (ERR_ACTIVE_DEFERRAL_EXISTS)"
        side_effects:
          - "DeferralRegistryEntry created with registry_status = ACTIVE"
          - "donor.donor_status -> DEFERRED_PERM"
          - "donor.active_deferral_id -> new entry id"
          - "donor.deferral_ends_on -> null"
          - "donor.deferred_reason_code -> entry.reason_code"
          - "donor.version += 1"
          - "All DonationUnit rows for this donor with unit_status == QUARANTINED are moved to DESTROYED with destruction_reason = DONOR_PERMANENT_DEFERRAL"
          - "All DonationUnit rows for this donor with unit_status == LOOKBACK_HOLD are moved to DESTROYED with destruction_reason = DONOR_PERMANENT_DEFERRAL (any parent LookBackCase whose held units are now all DESTROYED transitions to RESOLVED_DESTROYED)"

      - from: QUALIFIED
        to: DEFERRED_PERM
        trigger: "POST /donors/{donorId}/deferrals (deferral_type=PERMANENT)"
        actor: ComplianceOfficer
        preconditions:
          - "donor.donor_status IN {APPLICANT, QUALIFIED} (ERR_DONOR_NOT_DEFERRABLE)"
          - "no ACTIVE DeferralRegistryEntry exists for this donor (ERR_ACTIVE_DEFERRAL_EXISTS)"
        side_effects:
          - "DeferralRegistryEntry created with registry_status = ACTIVE"
          - "donor.donor_status -> DEFERRED_PERM"
          - "donor.active_deferral_id -> new entry id"
          - "donor.deferral_ends_on -> null"
          - "donor.deferred_reason_code -> entry.reason_code"
          - "donor.version += 1"
          - "All DonationUnit rows for this donor with unit_status == QUARANTINED are moved to DESTROYED with destruction_reason = DONOR_PERMANENT_DEFERRAL"
          - "All DonationUnit rows for this donor with unit_status == LOOKBACK_HOLD are moved to DESTROYED with destruction_reason = DONOR_PERMANENT_DEFERRAL (any parent LookBackCase whose held units are now all DESTROYED transitions to RESOLVED_DESTROYED)"

      - from: DEFERRED_TEMP
        to: APPLICANT
        trigger: "system (automatic when logical clock >= donor.deferral_ends_on AND donor.lifetime_donation_count == 0 at clear time)"
        actor: system
        preconditions:
          - "donor.donor_status == DEFERRED_TEMP"
          - "donor.deferral_ends_on <= now"
          - "donor.lifetime_donation_count == 0"
        side_effects:
          - "DeferralRegistryEntry.registry_status -> CLEARED"
          - "donor.donor_status -> APPLICANT"
          - "donor.active_deferral_id -> null"
          - "donor.deferral_ends_on -> null"
          - "donor.deferred_reason_code -> null"
          - "donor.version += 1"

      - from: DEFERRED_TEMP
        to: QUALIFIED
        trigger: "system (automatic when logical clock >= donor.deferral_ends_on AND donor.lifetime_donation_count >= 1 at clear time)"
        actor: system
        preconditions:
          - "donor.donor_status == DEFERRED_TEMP"
          - "donor.deferral_ends_on <= now"
          - "donor.lifetime_donation_count >= 1"
        side_effects:
          - "DeferralRegistryEntry.registry_status -> CLEARED"
          - "donor.donor_status -> QUALIFIED"
          - "donor.active_deferral_id -> null"
          - "donor.deferral_ends_on -> null"
          - "donor.deferred_reason_code -> null"
          - "donor.version += 1"

  - entity: ScreeningVisit
    initial_state: SCHEDULED
    terminal_states: [CLEARED, FAILED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (automatic on the first POST of any ScreeningSubRecord under this visit)"
        actor: system
        preconditions:
          - "visit.visit_status == SCHEDULED"
          - "logical clock < visit.scheduled_for + 24h (otherwise the EXPIRED transition fires first)"
        side_effects:
          - "visit.visit_status -> IN_PROGRESS"
          - "CenterCapacitySnapshot written with trigger_event = 'screening.started'"

      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /screening-visits/{visitId}/clear"
        actor: MedicalScreener
        preconditions:
          - "visit.visit_status == IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "all four sub-record flags true: identity_verified, health_history_recorded, physical_exam_recorded, viral_marker_recorded (ERR_INCOMPLETE_SCREENING)"
          - "every ScreeningSubRecord for this visit has outcome == PASS (ERR_SCREENING_NOT_PASSABLE)"
          - "the acting MedicalScreener's X-User-ID MUST NOT equal the recorded_by_user_id of ANY ScreeningSubRecord on this visit (ERR_SEGREGATION_OF_DUTIES)"
          - "donor.donor_status IN {APPLICANT, QUALIFIED} at clearance time (ERR_DONOR_NOT_SCREENABLE)"
          - "center.status == OPERATIONAL (ERR_CENTER_NOT_OPERATIONAL)"
        side_effects:
          - "visit.visit_status -> CLEARED"
          - "visit.version += 1"
          - "CenterCapacitySnapshot written with trigger_event = 'screening.cleared'"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "system (automatic when any ScreeningSubRecord write produces outcome == FAIL)"
        actor: system
        preconditions:
          - "visit.visit_status == IN_PROGRESS"
        side_effects:
          - "visit.visit_status -> FAILED"
          - "if the failing sub-record has record_type == VIRAL_MARKER: a LookBackCase is opened for this donor (case_status=OPEN) and every DonationUnit for this donor with unit_status == QUARANTINED or RELEASED and collected_at within LOOKBACK_WINDOW_DAYS of now is moved to LOOKBACK_HOLD"
          - "CenterCapacitySnapshot written with trigger_event = 'screening.failed'"

      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (automatic when logical clock >= scheduled_for + 24h)"
        actor: system
        preconditions: []
        side_effects:
          - "visit.visit_status -> EXPIRED"
          - "CenterCapacitySnapshot written with trigger_event = 'screening.expired'"

      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "system (automatic when logical clock >= scheduled_for + 24h AND visit.visit_status != CLEARED AND != FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "visit.visit_status -> EXPIRED"
          - "CenterCapacitySnapshot written with trigger_event = 'screening.expired'"

  - entity: DonationVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED_REACTION, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /donation-visits/{visitId}/check-in"
        actor: Phlebotomist
        preconditions:
          - "visit.visit_status == SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "donor.donor_status IN {APPLICANT, QUALIFIED} (ERR_DONOR_NOT_ELIGIBLE)"
          - "donor has no ACTIVE DeferralRegistryEntry (ERR_DONOR_DEFERRED)"
          - "frequency_check: count of Donor's COMPLETED DonationVisits across ALL centers in the trailing rolling ROLLING_FREQUENCY_DAYS (default 7) days, counting [now - 7d, now) as half-open, < FREQUENCY_MAX_PER_WINDOW (default 2) (ERR_FREQUENCY_LIMIT_EXCEEDED)"
          - "minimum-inter-donation gap: now - last_completed_donation.collected_at >= MIN_INTER_DONATION_HOURS (default 48h) (ERR_INTER_DONATION_GAP_VIOLATION)"
          - "referenced ScreeningVisit is CLEARED (ERR_SCREENING_NOT_CLEARED)"
          - "referenced ScreeningVisit's center_id == this visit's center_id (ERR_SCREENING_CENTER_MISMATCH)"
          - "referenced ScreeningVisit has not been consumed by any other COMPLETED or IN_PROGRESS DonationVisit (ERR_SCREENING_ALREADY_CONSUMED)"
          - "center.status == OPERATIONAL (ERR_CENTER_NOT_OPERATIONAL)"
          - "center has a free donor-floor bed at this instant (ERR_NO_BED_AVAILABLE)"
        side_effects:
          - "visit.visit_status -> IN_PROGRESS"
          - "visit.bed_index assigned via lowest-free-bed rule"
          - "donor.weight_kg refreshed from the most recent PHYSICAL_EXAM ScreeningSubRecord on the qualifying ScreeningVisit"
          - "visit.programmed_volume_ml computed via plasma_volume_ml calculation against donor.weight_kg"
          - "CompensationPayment created for this visit (variant=PROVISIONAL, payment_status=PROVISIONAL, schedule pinned to the ACTIVE CompensationSchedule for this center at check-in; if no ACTIVE schedule covers check-in time the check-in is rejected with ERR_NO_ACTIVE_COMP_SCHEDULE)"
          - "visit.compensation_payment_id set"
          - "CenterCapacitySnapshot written with trigger_event = 'donation.check_in'"

      - from: IN_PROGRESS
        to: OBSERVATION
        trigger: "POST /donation-visits/{visitId}/complete-collection"
        actor: Phlebotomist
        preconditions:
          - "visit.visit_status == IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "actual_volume_ml in request body satisfies 0 < actual_volume_ml <= programmed_volume_ml (ERR_INVALID_ACTUAL_VOLUME)"
          - "center has a free observation chair at this instant (ERR_NO_OBSERVATION_CHAIR)"
        side_effects:
          - "visit.visit_status -> OBSERVATION"
          - "visit.bed_index freed (slot returns to the floor pool)"
          - "visit.observation_chair_index assigned via lowest-free-chair rule"
          - "visit.actual_volume_ml set"
          - "CenterCapacitySnapshot written with trigger_event = 'donation.collection_complete'"

      - from: OBSERVATION
        to: COMPLETED
        trigger: "POST /donation-visits/{visitId}/discharge"
        actor: Phlebotomist
        preconditions:
          - "visit.visit_status == OBSERVATION (ERR_VISIT_NOT_OBSERVABLE)"
          - "logical clock >= visit's observation entry time + OBSERVATION_MINUTES (default 15) (ERR_OBSERVATION_TOO_EARLY)"
        side_effects:
          - "visit.visit_status -> COMPLETED"
          - "visit.observation_chair_index freed"
          - "DonationUnit created for this visit with unit_status = QUARANTINED, volume_ml = actual_volume_ml, collected_at = now"
          - "donor.lifetime_donation_count += 1"
          - "donor.applicant_window_started_on set to now iff donor.lifetime_donation_count was 0 before this completion"
          - "If donor.lifetime_donation_count is now >= 2 AND donor.donor_status == APPLICANT AND now - applicant_window_started_on <= APPLICANT_WINDOW_DAYS: donor.donor_status -> QUALIFIED with the side effects listed on that transition (releases QUARANTINED units including this one)"
          - "CompensationPayment for this visit recomputed via variant PROVISIONAL -> FINAL; net_cents finalized; payment_status -> FINALIZED; payment_issued_on = now; donor.ytd_compensation_cents += final net_cents"
          - "If donor.ytd_compensation_cents crosses the TAX_REPORTING_THRESHOLD_CENTS (default 60000 = $600) on this completion, flag donor.requires_1099 = true (computed field on Donor, surfaced on GET /donors/{id})"
          - "CenterCapacitySnapshot written with trigger_event = 'donation.completed'"

      - from: IN_PROGRESS
        to: ABORTED_REACTION
        trigger: "POST /donation-visits/{visitId}/adverse-reactions"
        actor: Phlebotomist
        preconditions:
          - "visit.visit_status IN {IN_PROGRESS, OBSERVATION} (ERR_VISIT_NOT_ABORTABLE)"
        side_effects:
          - "AdverseReaction row created"
          - "visit.visit_status -> ABORTED_REACTION"
          - "visit.bed_index freed (was set if coming from IN_PROGRESS)"
          - "visit.observation_chair_index freed (was set if coming from OBSERVATION)"
          - "If visit.actual_volume_ml was already set and > 0 (reaction during OBSERVATION): DonationUnit created with unit_status = QUARANTINED and volume_ml = actual_volume_ml; otherwise no unit is created"
          - "CompensationPayment for this visit (if any) recomputed via abort_compensation_cents calculation; payment_status -> FINALIZED with net_cents = abort amount; variant -> FINAL"
          - "If severity == SEVERE: a DeferralRegistryEntry is auto-filed (deferral_type=TEMPORARY, deferral_ends_on = now + SEVERE_REACTION_DEFERRAL_DAYS, reason_code = ADVERSE_REACTION_SEVERE) and the donor transitions to DEFERRED_TEMP with the standard side effects"
          - "CenterCapacitySnapshot written with trigger_event = 'donation.aborted_reaction'"

      - from: OBSERVATION
        to: ABORTED_REACTION
        trigger: "POST /donation-visits/{visitId}/adverse-reactions"
        actor: Phlebotomist
        preconditions:
          - "visit.visit_status IN {IN_PROGRESS, OBSERVATION} (ERR_VISIT_NOT_ABORTABLE)"
        side_effects:
          - "Same as IN_PROGRESS -> ABORTED_REACTION; observation chair is freed because the reaction occurred in OBSERVATION"
          - "DonationUnit IS created (actual_volume_ml was already recorded at complete-collection) with unit_status = QUARANTINED"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (automatic when logical clock >= scheduled_for + 6h AND visit.visit_status == SCHEDULED) OR cascaded from donor deferral / center inspection-hold"
        actor: system
        preconditions: []
        side_effects:
          - "visit.visit_status -> NO_SHOW"
          - "CompensationPayment for this visit (if any) is voided: payment_status stays PROVISIONAL but variant is left PROVISIONAL and the row is excluded from ytd accumulation; the payment row remains for audit"

  - entity: DonationUnit
    initial_state: QUARANTINED
    terminal_states: [RELEASED, DESTROYED]
    transitions:
      - from: QUARANTINED
        to: RELEASED
        trigger: "system (cascade from Donor APPLICANT -> QUALIFIED) OR POST /donation-units/{unitId}/release"
        actor: system | ComplianceOfficer
        preconditions:
          - "unit.unit_status == QUARANTINED (ERR_UNIT_NOT_QUARANTINED)"
          - "donor.donor_status == QUALIFIED at release time (ERR_DONOR_NOT_QUALIFIED)"
          - "no OPEN or UNITS_QUARANTINED LookBackCase exists for this donor (ERR_LOOKBACK_OPEN)"
          - "for the manual path: actor is ComplianceOfficer"
        side_effects:
          - "unit.unit_status -> RELEASED"
          - "unit.released_at = now"
          - "CenterCapacitySnapshot written with trigger_event = 'unit.released'"

      - from: QUARANTINED
        to: LOOKBACK_HOLD
        trigger: "system (cascade from ScreeningVisit FAILED on VIRAL_MARKER reactive)"
        actor: system
        preconditions:
          - "unit.collected_at within LOOKBACK_WINDOW_DAYS of the reactive screening"
        side_effects:
          - "unit.unit_status -> LOOKBACK_HOLD"
          - "parent LookBackCase (just opened) linked implicitly via donor_id and triggering_donation_visit_id"

      - from: RELEASED
        to: LOOKBACK_HOLD
        trigger: "system (cascade from ScreeningVisit FAILED on VIRAL_MARKER reactive)"
        actor: system
        preconditions:
          - "unit.collected_at within LOOKBACK_WINDOW_DAYS of the reactive screening"
        side_effects:
          - "unit.unit_status -> LOOKBACK_HOLD"
          - "unit.released_at preserved (audit)"

      - from: LOOKBACK_HOLD
        to: DESTROYED
        trigger: "POST /lookback-cases/{caseId}/resolve (resolution=DESTROY) OR cascaded from donor DEFERRED_PERM"
        actor: ComplianceOfficer | system
        preconditions:
          - "parent LookBackCase.case_status == UNITS_QUARANTINED (ERR_LOOKBACK_NOT_READY)"
          - "unit.unit_status == LOOKBACK_HOLD"
        side_effects:
          - "unit.unit_status -> DESTROYED"
          - "unit.destroyed_at = now"
          - "unit.destruction_reason = REACTIVE_LOOKBACK (manual resolve) or DONOR_PERMANENT_DEFERRAL (cascade)"
          - "If the underlying DonationVisit's CompensationPayment has payment_status == FINALIZED: payment_status -> CLAWED_BACK and donor.ytd_compensation_cents -= payment.net_cents"
          - "If this was the last LOOKBACK_HOLD unit on the case, case_status -> RESOLVED_DESTROYED, resolved_at = now"

      - from: LOOKBACK_HOLD
        to: RELEASED
        trigger: "POST /lookback-cases/{caseId}/resolve (resolution=RELEASE)"
        actor: ComplianceOfficer
        preconditions:
          - "parent LookBackCase.case_status == UNITS_QUARANTINED (ERR_LOOKBACK_NOT_READY)"
          - "unit.unit_status == LOOKBACK_HOLD"
          - "donor.donor_status == QUALIFIED at resolution time (ERR_DONOR_NOT_QUALIFIED)"
        side_effects:
          - "unit.unit_status -> RELEASED"
          - "unit.released_at = now"
          - "If this was the last LOOKBACK_HOLD unit on the case, case_status -> RESOLVED_RELEASED, resolved_at = now"

      - from: QUARANTINED
        to: DESTROYED
        trigger: "system (cascade from Donor APPLICANT|QUALIFIED -> DEFERRED_PERM) OR system (cascade from PlasmaCenter DECOMMISSIONED)"
        actor: system
        preconditions: []
        side_effects:
          - "unit.unit_status -> DESTROYED"
          - "unit.destroyed_at = now"
          - "unit.destruction_reason = DONOR_PERMANENT_DEFERRAL or EXPIRED_HOLD"

  - entity: LookBackCase
    initial_state: OPEN
    terminal_states: [RESOLVED_DESTROYED, RESOLVED_RELEASED]
    transitions:
      - from: OPEN
        to: UNITS_QUARANTINED
        trigger: "system (automatic when the cascade that opened this case has moved every in-window DonationUnit into LOOKBACK_HOLD — including the degenerate case where ZERO units were in window)"
        actor: system
        preconditions:
          - "case_status == OPEN"
        side_effects:
          - "case_status -> UNITS_QUARANTINED"
          - "If zero units were moved (donor had no in-window QUARANTINED or RELEASED units), the case immediately auto-resolves to RESOLVED_DESTROYED with resolved_at = opened_at (a no-op resolution recorded for audit)"

      - from: UNITS_QUARANTINED
        to: RESOLVED_DESTROYED
        trigger: "POST /lookback-cases/{caseId}/resolve (resolution=DESTROY)"
        actor: ComplianceOfficer
        preconditions:
          - "case_status == UNITS_QUARANTINED (ERR_LOOKBACK_NOT_READY)"
          - "resolution_rationale >= 20 characters (ERR_INVALID_REQUEST)"
        side_effects:
          - "every DonationUnit on this case transitions LOOKBACK_HOLD -> DESTROYED (destruction_reason = REACTIVE_LOOKBACK)"
          - "each destroyed unit's CompensationPayment (if FINALIZED) transitions to CLAWED_BACK and donor.ytd_compensation_cents is debited"
          - "case_status -> RESOLVED_DESTROYED, resolved_at = now"

      - from: UNITS_QUARANTINED
        to: RESOLVED_RELEASED
        trigger: "POST /lookback-cases/{caseId}/resolve (resolution=RELEASE)"
        actor: ComplianceOfficer
        preconditions:
          - "case_status == UNITS_QUARANTINED (ERR_LOOKBACK_NOT_READY)"
          - "resolution_rationale >= 20 characters (ERR_INVALID_REQUEST)"
          - "donor.donor_status == QUALIFIED (ERR_DONOR_NOT_QUALIFIED)"
        side_effects:
          - "every DonationUnit on this case transitions LOOKBACK_HOLD -> RELEASED"
          - "case_status -> RESOLVED_RELEASED, resolved_at = now"

  - entity: CompensationSchedule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a new CompensationSchedule for the same center is created with effective_from < this schedule's effective_to)"
        actor: system
        preconditions:
          - "this schedule is currently ACTIVE"
        side_effects:
          - "this schedule.schedule_status -> SUPERSEDED"
          - "this schedule.effective_to rewritten to the new schedule's effective_from"
          - "this schedule.version += 1"
          - "the new schedule is created with schedule_status = ACTIVE"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /compensation-schedules/{scheduleId}/retire"
        actor: PlatformAdmin
        preconditions:
          - "schedule.schedule_status == ACTIVE (ERR_SCHEDULE_NOT_ACTIVE)"
          - "expected_schedule_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "schedule.schedule_status -> RETIRED"
          - "schedule.version += 1"
          - "Future check-ins at this center will fail with ERR_NO_ACTIVE_COMP_SCHEDULE until a replacement is created"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: schedule-create-stale-center
    parent_entity: PlasmaCenter
    write_endpoint: "POST /plasma-centers/{centerId}/compensation-schedules"
    occ_field: "expected_center_version"
    description: |
      Creating a new CompensationSchedule against a PlasmaCenter whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just transitioned the center (e.g. to
      INSPECTION_HOLD) — which legitimately forbids new schedule creation —
      and the current writer's view of the center is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: inspection-hold-stale-center
    parent_entity: PlasmaCenter
    write_endpoint: "POST /plasma-centers/{centerId}/inspection-holds"
    occ_field: "expected_center_version"
    description: |
      Placing an INSPECTION_HOLD on a PlasmaCenter whose version has advanced
      since the client last observed it is rejected. The prior writer may have
      just created a new CompensationSchedule (bumping center.version via the
      auto-supersede side effect), and the holder's snapshot of the center is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: schedule-retire-stale-version
    parent_entity: CompensationSchedule
    write_endpoint: "POST /compensation-schedules/{scheduleId}/retire"
    occ_field: "expected_schedule_version"
    description: |
      Retiring a CompensationSchedule whose version has advanced since the
      client last observed it is rejected. The prior writer may have just
      superseded the schedule by creating a replacement, which legitimately
      transitions it out of ACTIVE, so a stale retire would otherwise double-
      fire the retirement side effects.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plasma_volume_ml
    trigger: "DonationVisit SCHEDULED -> IN_PROGRESS (check-in)"
    algorithm: threshold
    formula: |
      Compute the device-programmed draw volume from donor.weight_kg measured
      at the qualifying physical exam, in 1 mL integer steps.
        if   weight_kg <  50.0:              REJECT with ERR_DONOR_UNDERWEIGHT (this is enforced at physical-exam record time, so it cannot trigger here)
        elif weight_kg <  68.0:              volume_ml = 625
        elif weight_kg <  79.0:              volume_ml = 690
        elif weight_kg < 110.0:              volume_ml = 825
        else:                                 volume_ml = 880
      Boundary semantics are STRICTLY greater-or-equal on the lower edge and
      STRICTLY less-than on the upper edge: 68.0 kg lands in the 690-mL band,
      79.0 kg lands in the 825-mL band, 110.0 kg lands in the 880-mL band.
      The programmed volume is FIXED at check-in: a subsequent weight update
      does NOT retroactively alter programmed_volume_ml on this visit.
    input_set: "Donor.weight_kg at check-in time (refreshed from the most recent PHYSICAL_EXAM ScreeningSubRecord on the qualifying ScreeningVisit)"
    constants:
      BAND_T1_MAX_KG: 68.0
      BAND_T2_MAX_KG: 79.0
      BAND_T3_MAX_KG: 110.0
      VOL_T1_ML: 625
      VOL_T2_ML: 690
      VOL_T3_ML: 825
      VOL_T4_ML: 880
    precision: "integer mL; no rounding needed (constants are integers)"
    variants:
      - name: programmed_at_check_in
        when: "Stored on DonationVisit.programmed_volume_ml at the SCHEDULED -> IN_PROGRESS transition"
        difference: "Snapshot semantics: the value is computed ONCE from donor.weight_kg as refreshed by the qualifying screening's PHYSICAL_EXAM and frozen for the life of the visit. A later screening that refreshes donor.weight_kg does NOT retroactively alter this visit's programmed_volume_ml."
      - name: hypothetical_at_read
        when: "Computed on the fly from Donor.weight_kg whenever a client asks what a NEW visit would program"
        difference: "Live semantics: reflects the donor's CURRENT weight_kg. For a donor whose weight changed between two screenings, hypothetical_at_read != the programmed_at_check_in value stored on the older visit. The two variants legitimately diverge on identical donor state whenever weight has moved since the older visit's check-in."

  - name: base_compensation_cents
    trigger: "CompensationPayment creation (PROVISIONAL at check-in) and recomputation (FINAL at visit COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      Let schedule be the ACTIVE CompensationSchedule pinned at check-in.
      Let ordinal = count of Donor's COMPLETED DonationVisits in the same
      calendar month as the visit's check-in date, counting PRIOR completions
      only (this visit excluded when PROVISIONAL, included when FINAL — see
      variants).
        ordinal == 0   -> base_cents = schedule.base_cents_first_donation
        ordinal == 1   -> base_cents = schedule.base_cents_second_donation
        ordinal >= 2   -> base_cents = schedule.base_cents_subsequent_donation
    input_set: "COMPLETED DonationVisits for this donor across ALL centers, restricted to the same calendar month as this visit's check-in"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "CompensationPayment is created at check-in (variant=PROVISIONAL)"
        difference: "ordinal counts ONLY prior COMPLETED visits in the same month (this visit not yet completed, so excluded). If this is the donor's first visit of the month, ordinal == 0 and base = base_cents_first_donation."
      - name: final
        when: "CompensationPayment is recomputed at visit COMPLETED (variant -> FINAL)"
        difference: "ordinal counts this visit as completed. If this was the donor's first completion of the month, ordinal at FINAL time is computed AFTER incrementing lifetime count, so the FINAL ordinal of the just-completed visit equals the number of PRIOR completions in the month (this visit counts itself). The provisional and final ordinals THEREFORE MATCH for the same visit — but they diverge if another visit for the same donor completes in between check-in and completion (cross-visit race), making the FINAL base potentially HIGHER than the PROVISIONAL base."

  - name: promo_compensation_cents
    trigger: "CompensationPayment creation (PROVISIONAL) and recomputation (FINAL)"
    algorithm: aggregation
    formula: |
      Let schedule be the pinned CompensationSchedule.
      If schedule.promo_code is null OR schedule.promo_qualifying_donation_count == 0:
        promo_cents = 0
      Else let window_completed = count of Donor's COMPLETED DonationVisits
      whose collected_at falls in [schedule.effective_from, schedule.effective_to)
      (half-open), including this visit iff this visit has COMPLETED.
        PROVISIONAL variant: promo_cents = schedule.promo_bonus_cents iff
          (window_completed_count_EXCLUDING_this_visit + 1) >= schedule.promo_qualifying_donation_count
          AND this donor has not yet received a FINALIZED promo payout for this same
          schedule (i.e. no other CompensationPayment with schedule_id == this schedule.id
          AND payment_status == FINALIZED AND promo_cents > 0 exists for this donor).
          Otherwise promo_cents = 0.
        FINAL variant: promo_cents = schedule.promo_bonus_cents iff
          window_completed_count_INCLUDING_this_visit >= schedule.promo_qualifying_donation_count
          AND no other CompensationPayment for this donor with the same schedule_id
          has payment_status == FINALIZED with promo_cents > 0.
          Otherwise promo_cents = 0.
      The 'no other FINALIZED promo' clause makes the promo a once-per-schedule-per-donor
      payout; the provisional variant is OPTIMISTIC (assumes the qualifying count
      will be reached), the final variant is PESSIMISTIC (requires actual count).
    input_set: "COMPLETED DonationVisits for this donor with collected_at in [schedule.effective_from, schedule.effective_to); CompensationPayments for this donor with schedule_id == this schedule.id"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: provisional_optimistic
        when: "variant=PROVISIONAL at check-in"
        difference: "Counts this visit as if it will complete; can yield promo_cents > 0 even when the final qualifying count is never reached."
      - name: final_pessimistic
        when: "variant=FINAL at completion"
        difference: "Counts only actually-COMPLETED visits; can yield promo_cents = 0 when the provisional variant was positive. The delta is absorbed at variant switch: donor.ytd_compensation_cents accumulates only the FINAL net_cents."

  - name: abort_compensation_cents
    trigger: "DonationVisit IN_PROGRESS|OBSERVATION -> ABORTED_REACTION"
    algorithm: tiered_pricing
    formula: |
      Compensate an aborted visit on a fractional-completion basis, computed
      from the actual collected volume as a fraction of the programmed volume:
        if actual_volume_ml is null (reaction during IN_PROGRESS before collection):
          abort_cents = 0
        else:
          fraction = actual_volume_ml / programmed_volume_ml
          abort_cents = floor(base_cents_final * fraction)  # base_cents_final uses the FINAL-variant ordinal rule
          if abort_cents > 0 and abort_cents < MIN_ABORT_PAYOUT_CENTS (default 500):
            abort_cents = MIN_ABORT_PAYOUT_CENTS  # minimum payout floor
      promo_cents is ALWAYS 0 for an aborted visit.
      net_cents = abort_cents (base_cents field stores abort_cents for clarity).
    input_set: "this DonationVisit (actual_volume_ml, programmed_volume_ml); the pinned schedule for base rate"
    constants:
      MIN_ABORT_PAYOUT_CENTS: 500
    precision: "integer cents via floor() after the fraction multiplication; rounding order is fixed: multiply first, then floor, then apply the floor-of-minimum"

  - name: ytd_compensation_accumulator
    trigger: "CompensationPayment transitions to FINALIZED; CompensationPayment transitions FINALIZED -> CLAWED_BACK"
    algorithm: aggregation
    formula: |
      On FINALIZE at logical-clock date D (year Y):
        donor.ytd_compensation_cents is recomputed as
          SUM(net_cents) over all CompensationPayment rows for this donor
          with payment_status == FINALIZED AND payment_issued_on's calendar year == Y
      On CLAW_BACK at logical-clock date D (year Y):
        donor.ytd_compensation_cents is recomputed as
          SUM(net_cents) over all CompensationPayment rows for this donor
          with payment_status == FINALIZED AND payment_issued_on's calendar year == Y
          (the clawed-back row is now excluded because its status is no longer FINALIZED)
      The accumulator is year-scoped: payments issued in a prior calendar year
      do NOT roll forward. The donor.requires_1099 flag is recomputed after
      every accumulator update: requires_1099 = (ytd_compensation_cents >= TAX_REPORTING_THRESHOLD_CENTS).
      Note: requires_1099 is sticky DOWNWARD — once true it remains true even
      if a claw-back pulls ytd below the threshold (a 1099 obligation incurred
      mid-year is not voided by a later claw-back).
    input_set: "CompensationPayments for this donor with payment_status == FINALIZED and payment_issued_on within the calendar year of the logical clock"
    constants:
      TAX_REPORTING_THRESHOLD_CENTS: 60000
    precision: "integer cents; no rounding"

  - name: rolling_frequency_check
    trigger: "DonationVisit SCHEDULED -> IN_PROGRESS precondition"
    algorithm: chronological
    formula: |
      Count the donor's COMPLETED DonationVisits across ALL centers whose
      collected_at falls in the HALF-OPEN window [now - ROLLING_FREQUENCY_DAYS days, now).
      The boundary at `now` is EXCLUSIVE (a completion exactly at `now` cannot
      exist yet at check-in time), and the boundary at `now - 7 days` is
      INCLUSIVE (a completion exactly 7*24h ago DOES count).
      Reject with ERR_FREQUENCY_LIMIT_EXCEEDED iff count >= FREQUENCY_MAX_PER_WINDOW.
      This is a rolling window, NOT a calendar-week bucket: a donation 6 days
      and 23 hours ago still counts; a donation 7 days and 1 second ago does not.
    input_set: "COMPLETED DonationVisits for this donor across ALL centers, collected_at in [now - 7d, now)"
    constants:
      ROLLING_FREQUENCY_DAYS: 7
      FREQUENCY_MAX_PER_WINDOW: 2
    precision: "integer count; timestamp comparison to the second"

  - name: inter_donation_gap_check
    trigger: "DonationVisit SCHEDULED -> IN_PROGRESS precondition"
    algorithm: threshold
    formula: |
      Find the donor's most recent COMPLETED DonationVisit across ALL centers
      (by collected_at DESC; tie-break by created_at ASC).
      Reject with ERR_INTER_DONATION_GAP_VIOLATION iff
        now - last_completed.collected_at < MIN_INTER_DONATION_HOURS hours.
      Boundary semantics: gap of EXACTLY MIN_INTER_DONATION_HOURS passes;
      gap of MIN_INTER_DONATION_HOURS - 1 second fails.
      When the donor has NO prior COMPLETED visits, this check passes trivially
      (empty-set edge).
    input_set: "most recent COMPLETED DonationVisit for this donor across all centers"
    constants:
      MIN_INTER_DONATION_HOURS: 48
    precision: "comparison to the second"

  - name: applicant_window_qualification_check
    trigger: "DonationVisit OBSERVATION -> COMPLETED (the donor-qualification cascade)"
    algorithm: threshold
    formula: |
      When a DonationVisit completes:
        first_completed_at = donor.applicant_window_started_on (set when lifetime_donation_count went 0 -> 1)
        if donor.donor_status == APPLICANT
           AND donor.lifetime_donation_count AFTER this completion >= 2
           AND (now - first_completed_at) <= APPLICANT_WINDOW_DAYS * 24h:
              promote donor to QUALIFIED
        else if donor.donor_status == APPLICANT
           AND donor.lifetime_donation_count AFTER this completion >= 2
           AND (now - first_completed_at) > APPLICANT_WINDOW_DAYS * 24h:
              donor REMAINS APPLICANT (the applicant window has lapsed; the
              donor must re-qualify through a fresh two-donation sequence —
              see applicant_window_restart rule below)
      Boundary semantics: a second completion at EXACTLY APPLICANT_WINDOW_DAYS
      after the first PASSES (inclusive upper edge); one second later FAILS.
    input_set: "this DonationVisit; donor.applicant_window_started_on; donor.lifetime_donation_count"
    constants:
      APPLICANT_WINDOW_DAYS: 180
    precision: "comparison to the second"

  - name: applicant_window_restart
    trigger: "DonationVisit OBSERVATION -> COMPLETED when donor is APPLICANT and the previous applicant window has lapsed"
    algorithm: chronological
    formula: |
      If donor.donor_status == APPLICANT AND donor.applicant_window_started_on
      is non-null AND (now - applicant_window_started_on) > APPLICANT_WINDOW_DAYS * 24h
      AND this completion is NOT the one that promotes the donor:
        donor.applicant_window_started_on is RESET to the current completion's
        collected_at — the donor starts a FRESH applicant window, and the
        previous donation history prior to this reset is IGNORED for the
        purpose of qualification (but NOT for lifetime_donation_count, which
        is monotonically increasing for audit).
      Implementation note: the qualification check then compares the NEXT
      completion against this reset timestamp. A donor whose window lapses
      repeatedly can cycle through APPLICANT status indefinitely.
    input_set: "this DonationVisit; donor.applicant_window_started_on"
    constants:
      APPLICANT_WINDOW_DAYS: 180
    precision: "comparison to the second"

  - name: capacity_occupancy
    trigger: "CenterCapacitySnapshot write (every mutation on a ScreeningVisit / DonationVisit / DonationUnit / PlasmaCenter at that center)"
    algorithm: aggregation
    formula: |
      screening_lanes_in_use = count of ScreeningVisit rows with center_id == center.id
        AND visit_status == IN_PROGRESS
      donor_floor_beds_in_use = count of DonationVisit rows with center_id == center.id
        AND visit_status == IN_PROGRESS
      observation_chairs_in_use = count of DonationVisit rows with center_id == center.id
        AND visit_status == OBSERVATION
      pending_releases_count = count of DonationUnit rows with center_id == center.id
        AND unit_status == QUARANTINED
      Capacity admission rules (applied at check-in / complete-collection):
        check-in requires donor_floor_beds_in_use < center.donor_floor_beds
          (STRICT less-than; equality means full and the check-in is rejected)
        complete-collection requires observation_chairs_in_use < center.observation_chairs
          (STRICT less-than)
      Screening admission does NOT gate on screening_lanes — a ScreeningVisit
      may be created regardless of lane occupancy; lane assignment is by
      lowest-index-free at the time of the first sub-record write.
    input_set: "ScreeningVisit / DonationVisit / DonationUnit rows for the center at the current logical-clock instant"
    constants: {}
    precision: "integer counts; no rounding"

  - name: lowest_free_slot_assignment
    trigger: "DonationVisit check-in (bed), DonationVisit complete-collection (observation chair), first ScreeningSubRecord write (lane)"
    algorithm: topological
    formula: |
      For a capacity vector of size N (beds / chairs / lanes):
        occupied = set of indexes currently held by visits in the relevant state
        free = { 0, 1, ..., N-1 } \\ occupied
        if free is empty: reject with the appropriate capacity error
        else: assign min(free)
      Slot assignment is DETERMINISTIC and depends only on the occupied set.
      `created_at` is the forbidden tie-break (no ties are possible because
      'min' over a set is total); the entity `id` MUST NOT be consulted.
    input_set: "the center's capacity counter and the set of in-progress visits"
    constants: {}
    precision: "integer slot index"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role authorized for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template ids resolve left-to-right (center -> donor -> visit -> sub-resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request-body FK references resolve (screening_visit_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with body FK fields"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version in request body matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "all endpoints declaring expected_*_version as input (checked BEFORE any business rule)"

  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is valid (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Center status permits the requested operation (INSPECTION_HOLD blocks all visit pipeline writes; DECOMMISSIONED blocks everything)"
    error_id: ERR_CENTER_NOT_OPERATIONAL
    http_status: 409
    applies_to: "all endpoints that mutate ScreeningVisit / DonationVisit / DonationUnit / CompensationSchedule under a center"

  - priority: 8
    category: business_safety
    check: "Donor eligibility gate: donor_status permits the operation (DEFERRED_TEMP and DEFERRED_PERM block screening clearance, donation scheduling, check-in)"
    error_id: ERR_DONOR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /donation-visits, POST /donation-visits/{id}/check-in, POST /screening-visits/{id}/clear"

  - priority: 9
    category: business_safety
    check: "No ACTIVE DeferralRegistryEntry exists for this donor at check-in"
    error_id: ERR_DONOR_DEFERRED
    http_status: 409
    applies_to: "POST /donation-visits/{id}/check-in"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the MedicalScreener clearing a ScreeningVisit MUST NOT be the recorded_by_user_id of any ScreeningSubRecord on that visit"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /screening-visits/{id}/clear"

  - priority: 11
    category: business_temporal
    check: "Rolling-frequency limit: count of donor's COMPLETED DonationVisits across ALL centers in [now - 7d, now) < 2"
    error_id: ERR_FREQUENCY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /donation-visits/{id}/check-in"

  - priority: 12
    category: business_temporal
    check: "Minimum inter-donation gap: now - last_completed.collected_at >= 48h"
    error_id: ERR_INTER_DONATION_GAP_VIOLATION
    http_status: 409
    applies_to: "POST /donation-visits/{id}/check-in"

  - priority: 13
    category: business_referential
    check: "Referenced ScreeningVisit belongs to this donor AND is CLEARED AND not already consumed by another DonationVisit"
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 409
    applies_to: "POST /donation-visits, POST /donation-visits/{id}/check-in"

  - priority: 14
    category: business_referential
    check: "Referenced ScreeningVisit.center_id matches the donation's center_id (no cross-center screening reuse)"
    error_id: ERR_SCREENING_CENTER_MISMATCH
    http_status: 409
    applies_to: "POST /donation-visits"

  - priority: 15
    category: business_constraint
    check: "Capacity: a free donor-floor bed exists at check-in; a free observation chair exists at complete-collection"
    error_id: ERR_NO_BED_AVAILABLE
    http_status: 409
    applies_to: "POST /donation-visits/{id}/check-in"

  - priority: 16
    category: business_constraint
    check: "Capacity: a free observation chair exists at complete-collection"
    error_id: ERR_NO_OBSERVATION_CHAIR
    http_status: 409
    applies_to: "POST /donation-visits/{id}/complete-collection"

  - priority: 17
    category: business_fiscal
    check: "An ACTIVE CompensationSchedule covers the check-in instant"
    error_id: ERR_NO_ACTIVE_COMP_SCHEDULE
    http_status: 409
    applies_to: "POST /donation-visits/{id}/check-in"

  - priority: 18
    category: business_fiscal
    check: "actual_volume_ml within (0, programmed_volume_ml]"
    error_id: ERR_INVALID_ACTUAL_VOLUME
    http_status: 422
    applies_to: "POST /donation-visits/{id}/complete-collection"

  - priority: 19
    category: business_temporal
    check: "Observation dwell time: now >= observation_entry + 15 minutes"
    error_id: ERR_OBSERVATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /donation-visits/{id}/discharge"

  - priority: 20
    category: business_safety
    check: "No OPEN or UNITS_QUARANTINED LookBackCase exists for this donor when releasing a unit"
    error_id: ERR_LOOKBACK_OPEN
    http_status: 409
    applies_to: "POST /donation-units/{id}/release"

  - priority: 21
    category: business_referential
    check: "DeferralRegistryEntry uniqueness: no ACTIVE entry exists for this donor when filing a new one"
    error_id: ERR_ACTIVE_DEFERRAL_EXISTS
    http_status: 409
    applies_to: "POST /donors/{id}/deferrals"

  - priority: 22
    category: business_constraint
    check: "required-field presence and types per endpoint's input schema; enum members in declared sets; string-length floors; numeric ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server default is 2026-09-01T00:00:00Z before any set call; never falls back to wall-clock time. Evaluates all pending automatic transitions (screening expiry, no-show, deferral clearance, applicant window lapse) at the new instant."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["all time-based automatic transitions whose threshold has passed are fired in chronological order"]

  # --- PlasmaCenter ---
  - method: POST
    path: "/plasma-centers"
    description: "Create a plasma collection center"
    roles: [PlatformAdmin]
    code: 201
    input: [center_code, legal_name, state_code, screening_lanes, donor_floor_beds, observation_chairs]
    output: PlasmaCenter
    side_effects: ["status = OPERATIONAL"]

  - method: GET
    path: "/plasma-centers"
    description: "List centers (supports limit/offset, state_code filter)"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Phlebotomist, Recorder]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "PlasmaCenter[]"
    side_effects: []

  - method: GET
    path: "/plasma-centers/{centerId}"
    description: "Get a center"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Phlebotomist, Recorder]
    code: 200
    input: []
    output: PlasmaCenter
    side_effects: []

  - method: POST
    path: "/plasma-centers/{centerId}/inspection-holds"
    description: "Place the center on INSPECTION_HOLD; cascades scheduled visits to NO_SHOW/EXPIRED"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_center_version, reason]
    output: PlasmaCenter
    side_effects: ["increments PlasmaCenter.version by 1", "SCHEDULED DonationVisits -> NO_SHOW", "SCHEDULED ScreeningVisits -> EXPIRED", "CenterCapacitySnapshot written"]

  - method: POST
    path: "/plasma-centers/{centerId}/inspection-holds/clear"
    description: "Clear an INSPECTION_HOLD"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_center_version]
    output: PlasmaCenter
    side_effects: ["increments PlasmaCenter.version by 1", "CenterCapacitySnapshot written"]

  - method: POST
    path: "/plasma-centers/{centerId}/decommission"
    description: "Decommission a center (terminal)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_center_version]
    output: PlasmaCenter
    side_effects: ["increments PlasmaCenter.version by 1", "QUARANTINED units for this center -> DESTROYED (EXPIRED_HOLD)"]

  - method: GET
    path: "/plasma-centers/{centerId}/capacity-snapshots"
    description: "List capacity snapshots for a center, newest first"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CenterCapacitySnapshot[]"
    side_effects: []

  # --- CompensationSchedule ---
  - method: POST
    path: "/plasma-centers/{centerId}/compensation-schedules"
    description: "Create a compensation schedule for a center; auto-supersedes any overlapping ACTIVE schedule"
    roles: [PlatformAdmin]
    code: 201
    input: [effective_from, effective_to, base_cents_first_donation, base_cents_second_donation, base_cents_subsequent_donation, "promo_code?", "promo_bonus_cents?", "promo_qualifying_donation_count?", expected_center_version]
    output: CompensationSchedule
    side_effects: ["prior overlapping ACTIVE schedule -> SUPERSEDED with effective_to rewritten", "increments PlasmaCenter.version by 1"]

  - method: GET
    path: "/plasma-centers/{centerId}/compensation-schedules"
    description: "List schedules for a center"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["schedule_status?", "limit?", "offset?"]
    output: "CompensationSchedule[]"
    side_effects: []

  - method: GET
    path: "/compensation-schedules/{scheduleId}"
    description: "Get a schedule"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: CompensationSchedule
    side_effects: []

  - method: POST
    path: "/compensation-schedules/{scheduleId}/retire"
    description: "Retire an ACTIVE schedule"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_schedule_version]
    output: CompensationSchedule
    side_effects: ["increments CompensationSchedule.version by 1"]

  # --- Donor ---
  - method: POST
    path: "/donors"
    description: "Register a new donor (globally deduped by external_donor_ref)"
    roles: [Recorder]
    code: 201
    input: [external_donor_ref, legal_first_name, legal_last_name, date_of_birth, weight_kg, home_center_id]
    output: Donor
    side_effects: ["donor_status = APPLICANT", "lifetime_donation_count = 0", "ytd_compensation_cents = 0"]

  - method: GET
    path: "/donors"
    description: "List donors (supports donor_status, home_center_id, external_donor_ref filters)"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Phlebotomist, Recorder]
    code: 200
    input: ["donor_status?", "home_center_id?", "external_donor_ref?", "limit?", "offset?"]
    output: "Donor[]"
    side_effects: []

  - method: GET
    path: "/donors/{donorId}"
    description: "Get a donor (includes computed requires_1099 flag)"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Phlebotomist, Recorder]
    code: 200
    input: []
    output: Donor
    side_effects: []

  - method: POST
    path: "/donors/{donorId}/deferrals"
    description: "File a deferral registry entry; transitions the donor per §1.2"
    roles: [ComplianceOfficer]
    code: 201
    input: [reason_code, deferral_type, "deferral_ends_on?"]
    output: DeferralRegistryEntry
    side_effects: ["donor status per §1.2", "SCHEDULED DonationVisits -> NO_SHOW", "for PERMANENT: QUARANTINED/LOOKBACK_HOLD units -> DESTROYED"]

  - method: GET
    path: "/donors/{donorId}/deferrals"
    description: "List deferral entries for a donor"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener]
    code: 200
    input: ["registry_status?", "limit?", "offset?"]
    output: "DeferralRegistryEntry[]"
    side_effects: []

  - method: POST
    path: "/deferral-registry-entries/{entryId}/override"
    description: "Override an ACTIVE deferral (requires override_rationale >= 20 chars); donor status is recomputed per lifetime_donation_count"
    roles: [ComplianceOfficer]
    code: 200
    input: [override_rationale]
    output: DeferralRegistryEntry
    side_effects: ["entry.registry_status -> OVERRIDDEN", "donor.active_deferral_id -> null", "donor status recomputed: APPLICANT if lifetime_donation_count == 0 else QUALIFIED"]

  # --- ScreeningVisit ---
  - method: POST
    path: "/donors/{donorId}/screening-visits"
    description: "Schedule a screening visit"
    roles: [Recorder]
    code: 201
    input: [center_id, scheduled_for]
    output: ScreeningVisit
    side_effects: ["visit_status = SCHEDULED"]

  - method: GET
    path: "/donors/{donorId}/screening-visits"
    description: "List screening visits for a donor"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Recorder]
    code: 200
    input: ["visit_status?", "limit?", "offset?"]
    output: "ScreeningVisit[]"
    side_effects: []

  - method: GET
    path: "/screening-visits/{visitId}"
    description: "Get a screening visit"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Recorder]
    code: 200
    input: []
    output: ScreeningVisit
    side_effects: []

  - method: POST
    path: "/screening-visits/{visitId}/sub-records"
    description: "Record one of the four screening sub-records; transitions visit SCHEDULED -> IN_PROGRESS on first write, IN_PROGRESS -> FAILED on outcome=FAIL"
    roles: [Recorder]
    code: 201
    input: [record_type, payload]
    output: ScreeningSubRecord
    side_effects: ["visit status per §1.2", "if record_type=VIRAL_MARKER and outcome=FAIL: opens LookBackCase and cascades unit holds", "if record_type=PHYSICAL_EXAM: refreshes donor.weight_kg"]

  - method: GET
    path: "/screening-visits/{visitId}/sub-records"
    description: "List sub-records for a screening visit"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Recorder]
    code: 200
    input: ["record_type?", "limit?", "offset?"]
    output: "ScreeningSubRecord[]"
    side_effects: []

  - method: POST
    path: "/screening-visits/{visitId}/clear"
    description: "Clear a screening visit (requires all four PASS sub-records and segregation of duties)"
    roles: [MedicalScreener]
    code: 200
    input: []
    output: ScreeningVisit
    side_effects: ["visit_status -> CLEARED"]

  # --- DonationVisit ---
  - method: POST
    path: "/donors/{donorId}/donation-visits"
    description: "Schedule a donation visit against a cleared screening"
    roles: [Phlebotomist]
    code: 201
    input: [center_id, screening_visit_id, scheduled_for]
    output: DonationVisit
    side_effects: ["visit_status = SCHEDULED", "marks the screening as consumed-pending"]

  - method: GET
    path: "/donors/{donorId}/donation-visits"
    description: "List donation visits for a donor"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Phlebotomist]
    code: 200
    input: ["visit_status?", "limit?", "offset?"]
    output: "DonationVisit[]"
    side_effects: []

  - method: GET
    path: "/donation-visits/{visitId}"
    description: "Get a donation visit"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener, Phlebotomist]
    code: 200
    input: []
    output: DonationVisit
    side_effects: []

  - method: POST
    path: "/donation-visits/{visitId}/check-in"
    description: "Check in for donation; assigns bed, computes programmed_volume_ml, creates PROVISIONAL CompensationPayment"
    roles: [Phlebotomist]
    code: 200
    input: []
    output: DonationVisit
    side_effects: ["visit_status -> IN_PROGRESS", "bed_index assigned", "programmed_volume_ml computed", "CompensationPayment created (variant=PROVISIONAL)"]

  - method: POST
    path: "/donation-visits/{visitId}/complete-collection"
    description: "Mark collection complete; frees bed, assigns observation chair"
    roles: [Phlebotomist]
    code: 200
    input: [actual_volume_ml]
    output: DonationVisit
    side_effects: ["visit_status -> OBSERVATION", "bed_index freed", "observation_chair_index assigned"]

  - method: POST
    path: "/donation-visits/{visitId}/discharge"
    description: "Discharge from observation; creates DonationUnit, finalizes compensation, may trigger donor qualification"
    roles: [Phlebotomist]
    code: 200
    input: []
    output: DonationVisit
    side_effects: ["visit_status -> COMPLETED", "DonationUnit created", "CompensationPayment FINALIZED", "donor.lifetime_donation_count += 1", "donor qualification cascade per §1.2"]

  - method: POST
    path: "/donation-visits/{visitId}/adverse-reactions"
    description: "Record an adverse reaction; aborts the visit"
    roles: [Phlebotomist]
    code: 201
    input: [severity, reaction_code, observed_at, notes]
    output: AdverseReaction
    side_effects: ["visit_status -> ABORTED_REACTION", "abort compensation computed", "if severity=SEVERE: auto-file TEMPORARY deferral"]

  - method: GET
    path: "/donation-visits/{visitId}/adverse-reactions"
    description: "List adverse reactions for a visit"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener]
    code: 200
    input: ["limit?", "offset?"]
    output: "AdverseReaction[]"
    side_effects: []

  # --- DonationUnit ---
  - method: GET
    path: "/donation-units"
    description: "List donation units (supports donor_id, center_id, unit_status filters)"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener]
    code: 200
    input: ["donor_id?", "center_id?", "unit_status?", "limit?", "offset?"]
    output: "DonationUnit[]"
    side_effects: []

  - method: GET
    path: "/donation-units/{unitId}"
    description: "Get a donation unit"
    roles: [PlatformAdmin, ComplianceOfficer, MedicalScreener]
    code: 200
    input: []
    output: DonationUnit
    side_effects: []

  - method: POST
    path: "/donation-units/{unitId}/release"
    description: "Manually release a QUARANTINED unit (donor must be QUALIFIED, no open look-back)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DonationUnit
    side_effects: ["unit_status -> RELEASED", "CenterCapacitySnapshot written"]

  # --- LookBackCase ---
  - method: GET
    path: "/lookback-cases"
    description: "List look-back cases (supports donor_id, case_status filters)"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["donor_id?", "case_status?", "limit?", "offset?"]
    output: "LookBackCase[]"
    side_effects: []

  - method: GET
    path: "/lookback-cases/{caseId}"
    description: "Get a look-back case"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: LookBackCase
    side_effects: []

  - method: POST
    path: "/lookback-cases/{caseId}/resolve"
    description: "Resolve a look-back case (DESTROY or RELEASE all held units)"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution, resolution_rationale]
    output: LookBackCase
    side_effects: ["units transition per resolution", "for DESTROY: FINALIZED CompensationPayments -> CLAWED_BACK and donor.ytd_compensation_cents debited"]

  # --- CompensationPayment (read-only) ---
  - method: GET
    path: "/donation-visits/{visitId}/compensation-payment"
    description: "Get the compensation payment for a visit (array of 0 or 1)"
    roles: [PlatformAdmin, ComplianceOfficer, Phlebotomist]
    code: 200
    input: []
    output: "CompensationPayment[]"
    side_effects: []

  - method: GET
    path: "/donors/{donorId}/compensation-payments"
    description: "List compensation payments for a donor (supports payment_status, schedule_id filters)"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["payment_status?", "schedule_id?", "limit?", "offset?"]
    output: "CompensationPayment[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not authorized for this operation"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body FK reference does not resolve"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, type mismatch, enum out of range, or string-length floor violated"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version in request body does not match the parent entity's current version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state from which the requested transition is defined"

  - id: ERR_CENTER_NOT_OPERATIONAL
    http: 409
    condition: "Center is INSPECTION_HOLD or DECOMMISSIONED; operation requires OPERATIONAL"

  - id: ERR_CENTER_NOT_ON_HOLD
    http: 409
    condition: "Clear-hold requires center.status == INSPECTION_HOLD"

  - id: ERR_CENTER_HAS_ACTIVE_VISITS
    http: 409
    condition: "Decommission requires zero in-flight screening or donation visits at this center"

  - id: ERR_DONOR_NOT_ELIGIBLE
    http: 409
    condition: "Donor status blocks the operation (DEFERRED_TEMP, DEFERRED_PERM, or wrong status for the requested action)"

  - id: ERR_DONOR_NOT_DEFERRABLE
    http: 409
    condition: "Donor is already DEFERRED_TEMP or DEFERRED_PERM and cannot be re-deferred"

  - id: ERR_DONOR_DEFERRED
    http: 409
    condition: "ACTIVE DeferralRegistryEntry exists for this donor at check-in"

  - id: ERR_DONOR_NOT_QUALIFIED
    http: 409
    condition: "Donor status is not QUALIFIED; required for unit release or look-back release resolution"

  - id: ERR_DONOR_UNDERWEIGHT
    http: 422
    condition: "Physical exam records weight_kg < 50.0; exam sub-record outcome is FAIL"

  - id: ERR_ACTIVE_DEFERRAL_EXISTS
    http: 409
    condition: "An ACTIVE DeferralRegistryEntry already exists for this donor"

  - id: ERR_DUPLICATE_DONOR
    http: 409
    condition: "external_donor_ref already registered (cross-center dedupe)"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "MedicalScreener clearing the visit recorded at least one of its sub-records"

  - id: ERR_INCOMPLETE_SCREENING
    http: 409
    condition: "Fewer than four sub-records present at clearance"

  - id: ERR_SCREENING_NOT_PASSABLE
    http: 409
    condition: "At least one sub-record has outcome == FAIL at clearance"

  - id: ERR_SCREENING_NOT_CLEARED
    http: 409
    condition: "Referenced ScreeningVisit is not CLEARED (or is already consumed by another DonationVisit)"

  - id: ERR_SCREENING_CENTER_MISMATCH
    http: 409
    condition: "ScreeningVisit.center_id != DonationVisit.center_id"

  - id: ERR_DUPLICATE_SUB_RECORD
    http: 409
    condition: "A ScreeningSubRecord of this record_type already exists for this visit"

  - id: ERR_VISIT_NOT_IN_PROGRESS
    http: 409
    condition: "Visit must be IN_PROGRESS for this operation"

  - id: ERR_VISIT_NOT_SCHEDULED
    http: 409
    condition: "DonationVisit must be SCHEDULED for check-in"

  - id: ERR_VISIT_NOT_OBSERVABLE
    http: 409
    condition: "DonationVisit must be OBSERVATION for discharge"

  - id: ERR_VISIT_NOT_ABORTABLE
    http: 409
    condition: "DonationVisit must be IN_PROGRESS or OBSERVATION for adverse-reaction abort"

  - id: ERR_FREQUENCY_LIMIT_EXCEEDED
    http: 409
    condition: "Donor has >= 2 COMPLETED donations in the trailing rolling 7-day window (half-open)"

  - id: ERR_INTER_DONATION_GAP_VIOLATION
    http: 409
    condition: "Less than 48h since the donor's most recent COMPLETED donation"

  - id: ERR_NO_BED_AVAILABLE
    http: 409
    condition: "All donor-floor beds occupied at check-in"

  - id: ERR_NO_OBSERVATION_CHAIR
    http: 409
    condition: "All observation chairs occupied at complete-collection"

  - id: ERR_OBSERVATION_TOO_EARLY
    http: 409
    condition: "Fewer than 15 minutes elapsed since entering OBSERVATION"

  - id: ERR_INVALID_ACTUAL_VOLUME
    http: 422
    condition: "actual_volume_ml <= 0 or > programmed_volume_ml"

  - id: ERR_NO_ACTIVE_COMP_SCHEDULE
    http: 409
    condition: "No ACTIVE CompensationSchedule covers the check-in instant"

  - id: ERR_SCHEDULE_NOT_ACTIVE
    http: 409
    condition: "Schedule must be ACTIVE for retire"

  - id: ERR_UNIT_NOT_QUARANTINED
    http: 409
    condition: "DonationUnit must be QUARANTINED for manual release"

  - id: ERR_LOOKBACK_OPEN
    http: 409
    condition: "OPEN or UNITS_QUARANTINED LookBackCase exists for this donor; blocks unit release"

  - id: ERR_LOOKBACK_NOT_READY
    http: 409
    condition: "LookBackCase must be UNITS_QUARANTINED for resolve"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator-side administrator; manages centers, schedules, and reads everything"
    identity: opaque
    exclusive_operations:
      - "POST /plasma-centers"
      - "POST /plasma-centers/{id}/decommission"
      - "POST /plasma-centers/{id}/compensation-schedules"
      - "POST /compensation-schedules/{id}/retire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /plasma-centers, /plasma-centers/{id}, /plasma-centers/{id}/capacity-snapshots"
      - "GET /plasma-centers/{id}/compensation-schedules, /compensation-schedules/{id}"
      - "GET /donors, /donors/{id}, /donors/{id}/deferrals, /donors/{id}/compensation-payments"
      - "GET /donors/{id}/screening-visits, /screening-visits/{id}, /screening-visits/{id}/sub-records"
      - "GET /donors/{id}/donation-visits, /donation-visits/{id}, /donation-visits/{id}/adverse-reactions, /donation-visits/{id}/compensation-payment"
      - "GET /donation-units, /donation-units/{id}"
      - "GET /lookback-cases, /lookback-cases/{id}"

  - name: ComplianceOfficer
    description: "Regulatory and quality role; files deferrals, manages inspection holds, releases units, resolves look-backs"
    identity: opaque
    exclusive_operations:
      - "POST /plasma-centers/{id}/inspection-holds"
      - "POST /plasma-centers/{id}/inspection-holds/clear"
      - "POST /donors/{id}/deferrals"
      - "POST /deferral-registry-entries/{id}/override"
      - "POST /donation-units/{id}/release"
      - "POST /lookback-cases/{id}/resolve"
    shared_operations:
      - "GET /plasma-centers, /plasma-centers/{id}, /plasma-centers/{id}/capacity-snapshots"
      - "GET /plasma-centers/{id}/compensation-schedules, /compensation-schedules/{id}"
      - "GET /donors, /donors/{id}, /donors/{id}/deferrals, /donors/{id}/compensation-payments"
      - "GET /donors/{id}/screening-visits, /screening-visits/{id}, /screening-visits/{id}/sub-records"
      - "GET /donors/{id}/donation-visits, /donation-visits/{id}, /donation-visits/{id}/adverse-reactions, /donation-visits/{id}/compensation-payment"
      - "GET /donation-units, /donation-units/{id}"
      - "GET /lookback-cases, /lookback-cases/{id}"

  - name: Recorder
    description: "Front-desk intake role; registers donors, schedules screenings, records sub-records. Segregated from clearance."
    identity: opaque
    exclusive_operations:
      - "POST /donors"
      - "POST /donors/{donorId}/screening-visits"
      - "POST /screening-visits/{id}/sub-records"
    shared_operations:
      - "GET /plasma-centers, /plasma-centers/{id}"
      - "GET /donors, /donors/{id}"
      - "GET /donors/{id}/screening-visits, /screening-visits/{id}, /screening-visits/{id}/sub-records"

  - name: MedicalScreener
    description: "Licensed clinician; clears screenings and reads everything clinical. Segregated from sub-record entry."
    identity: opaque
    exclusive_operations:
      - "POST /screening-visits/{id}/clear"
    shared_operations:
      - "GET /plasma-centers, /plasma-centers/{id}"
      - "GET /donors, /donors/{id}, /donors/{id}/deferrals"
      - "GET /donors/{id}/screening-visits, /screening-visits/{id}, /screening-visits/{id}/sub-records"
      - "GET /donors/{id}/donation-visits, /donation-visits/{id}, /donation-visits/{id}/adverse-reactions"
      - "GET /donation-units, /donation-units/{id}"

  - name: Phlebotomist
    description: "Donor-floor role; schedules donations, checks donors in, completes collections, discharges, records adverse reactions"
    identity: opaque
    exclusive_operations:
      - "POST /donors/{id}/donation-visits"
      - "POST /donation-visits/{id}/check-in"
      - "POST /donation-visits/{id}/complete-collection"
      - "POST /donation-visits/{id}/discharge"
      - "POST /donation-visits/{id}/adverse-reactions"
    shared_operations:
      - "GET /plasma-centers, /plasma-centers/{id}"
      - "GET /donors, /donors/{id}"
      - "GET /donors/{id}/donation-visits, /donation-visits/{id}"
      - "GET /donation-visits/{id}/compensation-payment"
