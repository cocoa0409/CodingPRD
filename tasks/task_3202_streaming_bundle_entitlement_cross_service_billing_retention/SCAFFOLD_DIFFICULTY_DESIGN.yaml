              as_user_id: "${sa_id}"
          assert:
            - "The TV_14 add returned HTTP 422 with error_id == ERR_MATURITY_RATING_EXCEEDED"
            - "The TV_PG add returns HTTP 201"
            - "ServiceProfile.${prof_dplus}.watchlist_count == 1"

      - name: retention_cap_count_equal_to_max_rejected
        grounds:
          - calculations.retention_eligibility
          - validations[priority=19]
        distinguishing_aspect: |
          Metric: zero-indexed collection-count boundary (distinct metric and
          endpoint from temporal and rank boundaries). With
          max_redemptions_per_account == 1, the first redemption of the offer
          succeeds (count 0 < 1), it then EXPIRES after its duration renewals,
          and a second redemption of the SAME offer is rejected because
          count(ACTIVE+EXPIRED) == 1 is NOT < 1 — pinning >= vs > on the cap.
        test_recipe:
          setup:
            - "PLATFORM subscriber with ACTIVE DPLUS_ADS subscription; offer SMALL100 (100c, duration 1 month, max 1, PLATFORM, STANDALONE); first redemption applied, then clock advanced to 2026-10-01 and a SUCCEEDED renewal expires it (months_remaining 1 -> 0)"
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
