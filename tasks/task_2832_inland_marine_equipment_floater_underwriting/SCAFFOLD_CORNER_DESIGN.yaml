            - "trigger[2] HTTP status == 201"
            - "after trigger[2]: Claim.${clm}.adjustment_status == OPEN, salvage_status == NOT_APPLICABLE and underreporting_factor_bp == 10000"
            - "after trigger[2]: Claim.${clm}.valuation_at_loss_cents == 8160000 and constructive_total_loss_threshold_cents == 6120000"
            - "after trigger[2]: Claim.${clm}.repair_estimate_cents is null and settlement_amount_cents is null (nothing is valued until inspection)"
            - "both boundaries are inclusive, so 2026-08-01 is insurable while 2026-07-31 is not"

      - name: corner_child_rows_must_match_parent_part_type
        claim_type: Violation → Error
        grounds:
