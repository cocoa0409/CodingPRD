              payload: {}
              as: BallotCoordinator
            - call: "GET /contests/${ct}"
              payload: {}
              as: BallotCoordinator
              captures: { cert_count: $.data.certified_candidate_count }
            - call: "GET /ballot-styles/${st}/test-decks"
              payload: {}
              as: VotingSystemTechnician
          assert:
            - "${bro_status} == \"DISQUALIFIED\", ${bro_index} == null and disqualified_reason == \"Residency requirement not met\"."
            - "Hop 2 ran because the ordering was frozen at certify-ballot-order: Candidate.${c_alv}.base_order_index == 0 and Candidate.${c_che}.base_order_index == 1 - recompacted 0-based ranks with no gap where Brooks used to sit (Chen was 2 before the call)."
            - "${cert_count} == 2 (was 3): the contest's certified roster shrank, so the rotation modulus N is now 2."
            - "Hop 3 ran: TestDeck.${deck}.status == \"VOIDED\" because its expected_marks referenced Brooks and its style covers D-12; expected_total_marks is still 10 (the composition is not rewritten, only invalidated)."
