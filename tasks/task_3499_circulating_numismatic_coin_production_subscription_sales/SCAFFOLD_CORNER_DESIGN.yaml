          assert:
            - "err == ERR_LOT_NOT_RECEIVABLE"
            - "seigniorage report row QUARTER: blanks_on_hand_pieces == 176000 (credited exactly once)"

      - name: order_double_pay_rejected
        claim_type: idempotency
        grounds: ["state_machines.NumismaticOrder", "errors[ERR_ORDER_NOT_PAYABLE]"]
        distinguishing_aspect: "Second pay on an already-PAID order fails ERR_ORDER_NOT_PAYABLE."
