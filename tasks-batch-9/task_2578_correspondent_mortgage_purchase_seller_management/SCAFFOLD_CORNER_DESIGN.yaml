# ===========================================================================
# §1.9 Scaffold Corner Design — task 2578 correspondent mortgage purchase
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md
# walked against SCAFFOLD.yaml §1.1-§1.7. Every recipe drives empty-DB -> the
# asserted state using only §1.5 endpoints; every money/date literal in an
# `assert:` was produced by executing the §1.3 formulas in code (Decimal,
# ROUND_HALF_UP) and the logical-clock arithmetic in code.
#
# Fixture users: u-adm-1 (PlatformAdmin), u-ca-1 / u-ca-2 (CounterpartyAnalyst),
# u-qc-1 (QCReviewer), u-ld-1 (LockDeskTrader), u-pr-1 (PurchaseReviewer,
# issuer), u-pr-2 (PurchaseReviewer, settler), u-pr-3 (PurchaseReviewer,
# demand decider). A SellerUser always acts with as_user_id equal to the
# Seller.id it owns (identity: entity_backed:Seller).
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs (no test_recipe), naming the §1.8 instance.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  # 1. Entities (§1.1)
  # =========================================================================
  - section: entities
    instances:
      - name: seller_creation_starts_applied_and_not_eligible_with_rollups_zeroed
        claim_type: creation
        grounds:
          - entities.Seller
          - endpoints.POST /correspondent/sellers
          - state_machines.Seller.approval_status.initial_state
          - state_machines.Seller.delivery_standing.initial_state
        distinguishing_aspect: |
          A seller created with the three input fields only comes back 201 with
          BOTH state dimensions at their declared initial values
          (approval_status APPLIED, delivery_standing NOT_ELIGIBLE) and every
          underwriting roll-up still at its default — approval_tier null,
          servicing_retained_eligible false, mandatory_exposure_limit_cents 0,
          net_funded_cents 0, fee_receivable_cents 0, current_scorecard_grade
          UNRATED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty seller register"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
          trigger:
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Seller.${s1}.legal_name == Harbor Point Mortgage LLC and Seller.${s1}.tin == 823391045"
            - "Seller.${s1}.seller_type == NON_BANK_IMB"
            - "Seller.${s1}.approval_status == APPLIED"
            - "Seller.${s1}.delivery_standing == NOT_ELIGIBLE"
            - "Seller.${s1}.approval_tier == null and Seller.${s1}.suspension_reason == null"
            - "Seller.${s1}.servicing_retained_eligible == false"
            - "Seller.${s1}.approved_tangible_net_worth_cents == 0 and Seller.${s1}.mandatory_exposure_limit_cents == 0"
            - "Seller.${s1}.open_mandatory_exposure_cents == 0 and Seller.${s1}.net_funded_cents == 0"
            - "Seller.${s1}.fee_receivable_cents == 0"
            - "Seller.${s1}.current_defect_rate_bps == 0 and Seller.${s1}.current_scorecard_grade == UNRATED"
            - "Seller.${s1}.approval_decided_by_user_id == null"
            - "Seller.${s1}.id is non-empty, Seller.${s1}.created_at == 2026-08-01T00:00:00Z, Seller.${s1}.version == 1"

      - name: approved_seller_retrieval_returns_frozen_underwriting_rollups
        claim_type: retrieval
        grounds:
          - endpoints.GET /correspondent/sellers/{id}
          - entities.Seller.fields.mandatory_exposure_limit_cents
          - calculations.seller_mandatory_exposure_limit
        distinguishing_aspect: |
          GET on an approved seller returns the values frozen by the approval
          transition, not a recomputation: approval_tier STANDARD (governing QC
          outcome PASS), servicing_retained_eligible true,
          approved_tangible_net_worth_cents 300000000 and
          mandatory_exposure_limit_cents 3000000000 = min(10 * 300000000,
          5000000000), with delivery_standing already moved to GOOD_STANDING by
          the cross-dimension side effect.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Seller Harbor Point: audited statement fiscal_year_end 2025-12-31 ACCEPTED with tangible_net_worth_cents 300000000 and liquid_assets_cents 80000000"
            - "one COMPLETED QualityControlReview with findings_count 2 / critical_findings_count 0 -> outcome PASS"
            - "approval decision APPROVE rendered by u-ca-1 (different user id from the QC completer u-qc-1)"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE", review_note: "tier STANDARD" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
          trigger:
            - call: "GET /correspondent/sellers/${s1}"
              payload: {}
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
          assert:
            - "HTTP status == 200"
            - "Seller.${s1}.approval_status == APPROVED and Seller.${s1}.delivery_standing == GOOD_STANDING"
            - "Seller.${s1}.approval_tier == STANDARD"
            - "Seller.${s1}.servicing_retained_eligible == true"
            - "Seller.${s1}.approved_tangible_net_worth_cents == 300000000"
            - "Seller.${s1}.mandatory_exposure_limit_cents == 3000000000"
            - "Seller.${s1}.open_mandatory_exposure_cents == 0"
            - "Seller.${s1}.approval_decided_by_user_id == u-ca-1"
            - "QualityControlReview.${q1}.outcome == PASS and QualityControlReview.${q1}.completed_by_user_id == u-qc-1"
            - "FinancialStatement.${fs1}.status == ACCEPTED"

      - name: seller_listing_filters_by_approval_status_with_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET /correspondent/sellers
          - response_envelope.pagination_fields
          - entities.Seller.fields.approval_status
        distinguishing_aspect: |
          With three sellers on file and exactly two still in APPLIED, the
          filtered page GET /correspondent/sellers?approval_status=APPLIED&limit=1&offset=0
          returns one row with total_count 2 and has_more true, while
          offset=1 returns the second row with has_more false — the filter is
          applied BEFORE the page window, so total_count counts the filtered
          population and not all three sellers.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "three Sellers: Harbor Point (moved to UNDER_REVIEW by a QC review), Cascade Funding (APPLIED), Ironwood Lending (APPLIED)"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Cascade Funding Inc", tin: "770112238", seller_type: "BANK" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s2: $.data.id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Ironwood Lending CU", tin: "641903377", seller_type: "CREDIT_UNION" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s3: $.data.id }
          trigger:
            - call: "GET /correspondent/sellers?approval_status=APPLIED&limit=1&offset=0"
              payload: {}
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /correspondent/sellers?approval_status=APPLIED&limit=1&offset=1"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "first page: len(data) == 1, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "second page: len(data) == 1, total_count == 2, has_more == false, offset == 1"
            - "${page1_first} == ${s2} (created_at ASC ordering: Cascade Funding precedes Ironwood Lending)"
            - "${page2_first} == ${s3}"
            - "Seller.${s1} (UNDER_REVIEW) appears on neither page"

      - name: unknown_path_ids_across_all_twelve_entities_return_not_found
        claim_type: not_found
        grounds:
          - validations[priority 3..14]
          - errors[ERR_SELLER_NOT_FOUND]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
          - errors[ERR_QC_REVIEW_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
          - errors[ERR_LOAN_NOT_FOUND]
          - errors[ERR_DEFECT_NOT_FOUND]
          - errors[ERR_CONDITION_NOT_FOUND]
          - errors[ERR_ADVICE_NOT_FOUND]
          - errors[ERR_DEMAND_NOT_FOUND]
          - errors[ERR_TRANSFER_NOT_FOUND]
          - errors[ERR_SCORECARD_NOT_FOUND]
        distinguishing_aspect: |
          Each of the twelve path-id existence rows (priorities 3-14) answers
          with its OWN error_id and 404 against an empty database, so no
          endpoint falls back to a generic not-found: twelve distinct calls
          produce twelve distinct error_ids and never ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database — the id 11111111-1111-4111-8111-111111111111 names nothing"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
          trigger:
            - call: "GET /correspondent/sellers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_seller: $.data.error_id }
            - call: "GET /correspondent/products/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { e_product: $.data.error_id }
            - call: "POST /correspondent/financial-statements/11111111-1111-4111-8111-111111111111/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_statement: $.data.error_id }
            - call: "POST /correspondent/qc-reviews/11111111-1111-4111-8111-111111111111/complete"
              payload: { findings_count: 0, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { e_qc: $.data.error_id }
            - call: "GET /correspondent/commitments/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { e_commitment: $.data.error_id }
            - call: "GET /correspondent/loans/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { e_loan: $.data.error_id }
            - call: "POST /correspondent/defects/11111111-1111-4111-8111-111111111111/waive"
              payload: { price_adjustment_bps: -25 }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { e_defect: $.data.error_id }
            - call: "POST /correspondent/suspense-conditions/11111111-1111-4111-8111-111111111111/clear"
              payload: { document_reference: "DOC-404" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { e_condition: $.data.error_id }
            - call: "POST /correspondent/purchase-advices/11111111-1111-4111-8111-111111111111/settle"
              payload: { funding_reference: "WIRE-404" }
              as: PurchaseReviewer
              as_user_id: "u-pr-2"
              captures: { e_advice: $.data.error_id }
            - call: "GET /correspondent/repurchase-demands/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { e_demand: $.data.error_id }
            - call: "POST /correspondent/escrow-transfers/11111111-1111-4111-8111-111111111111/complete"
              payload: { goodbye_letter_reference: "GB-404" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { e_transfer: $.data.error_id }
            - call: "POST /correspondent/scorecards/11111111-1111-4111-8111-111111111111/close"
              payload: {}
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_scorecard: $.data.error_id }
          assert:
            - "${e_seller} == ERR_SELLER_NOT_FOUND with HTTP 404"
            - "${e_product} == ERR_PRODUCT_NOT_FOUND with HTTP 404"
            - "${e_statement} == ERR_STATEMENT_NOT_FOUND with HTTP 404"
            - "${e_qc} == ERR_QC_REVIEW_NOT_FOUND with HTTP 404"
            - "${e_commitment} == ERR_COMMITMENT_NOT_FOUND with HTTP 404"
            - "${e_loan} == ERR_LOAN_NOT_FOUND with HTTP 404"
            - "${e_defect} == ERR_DEFECT_NOT_FOUND with HTTP 404"
            - "${e_condition} == ERR_CONDITION_NOT_FOUND with HTTP 404"
            - "${e_advice} == ERR_ADVICE_NOT_FOUND with HTTP 404"
            - "${e_demand} == ERR_DEMAND_NOT_FOUND with HTTP 404"
            - "${e_transfer} == ERR_TRANSFER_NOT_FOUND with HTTP 404"
            - "${e_scorecard} == ERR_SCORECARD_NOT_FOUND with HTTP 404"
            - "no call returns ERR_INVALID_REQUEST"

      - name: seller_creation_without_tin_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 15]
          - errors[ERR_INVALID_REQUEST]
          - entities.Seller.fields.tin
        distinguishing_aspect: |
          tin is `source: input` with no default, so omitting it fails at
          priority 15 with ERR_INVALID_REQUEST (400) and no Seller row is
          created — the subsequent list call still reports total_count 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty seller register"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
          trigger:
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { e_missing_tin: $.data.error_id }
            - call: "GET /correspondent/sellers"
              payload: {}
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
          assert:
            - "${e_missing_tin} == ERR_INVALID_REQUEST with HTTP 400"
            - "the listing reports total_count == 0 and len(data) == 0"

      - name: product_creation_omitting_description_and_status_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ProductEligibility.fields.status
          - entities.ProductEligibility.fields.description
          - endpoints.POST /correspondent/products
        distinguishing_aspect: |
          The two optional inputs behave differently when omitted: status has a
          declared default and comes back ACTIVE, while description has no
          default and comes back null — and a second product that DOES supply
          status: RETIRED keeps the supplied value, proving the default is only
          a fallback and not a forced value.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty product catalogue"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
          trigger:
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_default: $.data.id }
            - call: "POST /correspondent/products"
              payload: { product_code: "JUMBO30F", base_price_pct: 100.500, min_fico: 700, max_ltv_pct: 80.0, max_loan_amount_cents: 200000000, allowed_commitment_types: ["MANDATORY"], allowed_occupancies: ["PRIMARY"], srp_pct: 0.750, description: "retired jumbo grid", status: "RETIRED" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_retired: $.data.id }
          assert:
            - "HTTP status == 201 on both calls"
            - "ProductEligibility.${p_default}.status == ACTIVE (declared default applied)"
            - "ProductEligibility.${p_default}.description == null (no default declared)"
            - "ProductEligibility.${p_default}.base_price_pct == 101.250 and ProductEligibility.${p_default}.srp_pct == 1.250"
            - "ProductEligibility.${p_retired}.status == RETIRED (supplied value wins over the default)"
            - "ProductEligibility.${p_retired}.description == retired jumbo grid"

      - name: defect_classification_is_computed_from_severity_and_category_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.defect_classification
          - entities.Defect.fields.classification
          - entities.Defect.fields.cure_deadline_at
        distinguishing_aspect: |
          classification and cure_deadline_at are computed, never accepted from
          the client: a CRITICAL defect whose body also carries
          classification: "CURABLE" is stored NON_CURABLE with
          cure_deadline_at null, while a LOW/DOCUMENTATION defect on the same
          loan is stored CURABLE with cure_deadline_at 2026-08-16T00:00:00Z
          (created_at 2026-08-01 + CURE_WINDOW_DAYS[LOW] = 15 days).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CHAIN-APPROVED seller ${s1} (STANDARD, GOOD_STANDING) and product CONF30F ${p_conf}"
            - "MANDATORY commitment ${c1} notional 100000000, window 2026-08-01 -> 2026-08-31, one delivered loan ${l1} in IN_REVIEW"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /correspondent/commitments/${c1}/loans"
              payload: { expected_commitment_version: "${c1v}", seller_loan_number: "HP-0001", note_amount_cents: 40000000, note_rate_pct: 6.500, fico: 720, ltv_pct: 82.5, occupancy: "PRIMARY", servicing_election: "RETAINED", closing_date: "2026-07-28", first_payment_due_date: "2026-09-01" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "POST /correspondent/loans/${l1}/review"
              payload: { note: "purchase review opened" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
          trigger:
            - call: "POST /correspondent/loans/${l1}/defects"
              payload: { defect_code: "DOC-MISSING-1008", category: "DOCUMENTATION", severity: "LOW", classification: "NON_CURABLE" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d_low: $.data.id }
            - call: "POST /correspondent/loans/${l1}/defects"
