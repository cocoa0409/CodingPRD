            - { call: "POST /fleet/mechanics", payload: { name: "Other", employee_ref: "R6B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m2}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN (403)", "labor_total_cents remains 0"]

  # ---------------------------------------------------------- cross-cutting ---
  - section: cross_cutting
    instances:
      - name: occ_stale_bus_version_rejected_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[wo-create-stale-bus]
        distinguishing_aspect: "WO create carries expected_bus_version: after a mileage log silently advances Bus.version, the stale create fails 412 ERR_STALE_BUS_VERSION; re-reading the bus and retrying with the fresh version succeeds. Deterministic with two strictly sequential requests."
        test_recipe:
          setup: ["Bus created (version captured); one mileage log posted afterwards (advances Bus.version)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "O1", vin: "VINO1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b}", log_date: "2026-08-01", odometer_end: 700, fuel_gallons: 40 }, as: Operator }
          trigger:
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: MaintenanceSupervisor, captures: { bv2: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id, wst: $.data.status } }
          assert:
            - "Stale create: err == ERR_STALE_BUS_VERSION, HTTP 412"
            - "Fresh create (${bv2} == 2 after the log bump): 201, status DRAFT"

      - name: occ_stale_work_order_version_on_second_claim
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[warranty-claim-stale-work-order]
        distinguishing_aspect: "Claim create increments WorkOrder.version: two sequential claims carrying the same observed version — the first succeeds (bumping the WO), the second fails 412 ERR_STALE_WORK_ORDER_VERSION."
        test_recipe:
          setup: ["CLOSED labor-only CORRECTIVE WO on a base-warranty bus (auto claim already exists); captured WorkOrder.version"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "O2", vin: "VINO2", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "O2A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "O2B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: WarrantyClerk, captures: { wov: $.data.version } }
          trigger:
            - { call: "POST /fleet/warranty-claims", payload: { work_order_id: "${wo}", claim_type: "BASE_OEM", expected_work_order_version: "${wov}" }, as: WarrantyClerk, captures: { c1: $.data.id, c1st: $.data.status } }
            - { call: "POST /fleet/warranty-claims", payload: { work_order_id: "${wo}", claim_type: "BASE_OEM", expected_work_order_version: "${wov}" }, as: WarrantyClerk, captures: { err: $.data.error_id } }
          assert:
            - "First claim with observed version: 201 DRAFT (WorkOrder.version advanced by the create)"
            - "Second claim with the same (now stale) version: err == ERR_STALE_WORK_ORDER_VERSION, HTTP 412"

      - name: bus_version_increments_on_defect_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Bus
          - endpoints."POST /fleet/defect-reports"
        distinguishing_aspect: "Every mutation bumps version: a defect report against a bus (even MINOR, no hold) advances Bus.version from 1 to 2, visible on re-read."
        test_recipe:
          setup: ["Freshly created bus at version 1"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "O3", vin: "VINO3", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "MINOR", defect_code: "TIRE", description: "tread low", odometer_at_report: 100 }, as: Operator }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { v2: $.data.version } }
          assert: ["v1 == 1", "v2 == 2 (exactly one increment per mutation)"]

      - name: red_recovery_restores_blocked_work_orders
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WorkOrder.BLOCKED_to_SCHEDULED
          - calculations.fleet_posture
        distinguishing_aspect: "Reverse cascade: after a RED freeze BLOCKs two SCHEDULED ROUTINE WOs, registering five additional AVAILABLE buses lifts the ratio to 5/10 (GREEN) and both WOs auto-restore to SCHEDULED with no direct WO calls."
        test_recipe:
          setup: ["Five buses held by SAFETY defects (RED); two ROUTINE WOs BLOCKED on B1/B2"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "RC1", vin: "VINRC1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "RC2", vin: "VINRC2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id, bv2: $.data.version } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "RC3", vin: "VINRC3", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b3: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "RC4", vin: "VINRC4", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b4: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "RC5", vin: "VINRC5", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b5: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "RCA" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-12", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv1}" }, as: MaintenanceSupervisor, captures: { wo1: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b2}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-12", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { wo2: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b1}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h1", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b2}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h2", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b3}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h3", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b4}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h4", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b5}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "h5", odometer_at_report: 10000 }, as: Operator }
            - { call: "GET /fleet/work-orders/${wo1}", payload: {}, as: MaintenanceSupervisor, captures: { pre1: $.data.status } }
          trigger:
