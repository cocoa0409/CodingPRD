- rule_id: non_linear_state_machine
  instances:
  - name: milestone_rejection_cycle_max_three
    grounds:
    - state_machines.Milestone.READY_FOR_REVIEW_to_REJECTED
    - state_machines.Milestone.REJECTED_to_READY_FOR_REVIEW
    - errors[ERR_MILESTONE_REJECTION_LIMIT]
    distinguishing_aspect: "Milestone runs a cyclic loop READY_FOR_REVIEW -> REJECTED -> READY_FOR_REVIEW bounded by rejection_count < 3 \u2014 the fourth resubmit\
      \ attempt fails with ERR_MILESTONE_REJECTION_LIMIT, making the cycle finite and count-observable."
    test_recipe:
      setup:
      - Contract IMPLEMENTATION, phase ACTIVE, milestone M1 submitted once.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
