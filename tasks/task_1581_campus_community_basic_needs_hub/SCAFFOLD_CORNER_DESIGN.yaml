      - name: error_envelope_shape_on_business_failure
        claim_type: violation_to_error
        grounds: ["response_envelope"]
        distinguishing_aspect: "Error responses carry response_type == 'error' and data.error_id + data.message; demonstrated on a consent-less assessment submit (422 ERR_CONSENT_REQUIRED)."
        test_recipe:
          setup: ["IntakeCoordinator; client with a DRAFT assessment created with consent_confidential false"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "env", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: false }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "422 with data.error_id == ERR_CONSENT_REQUIRED and a non-empty data.message"
            - "envelope response_type == 'error' with meta.api_request_id present"
            - "assessment remains DRAFT"

