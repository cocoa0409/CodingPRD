            - { call: "POST /sweeps/run", payload: {}, as: ProviderOps }
          trigger:
            - { call: "POST /checks/${chk1}/void", payload: { void_reason: "STALE" }, as: ProviderOps }
            - { call: "POST /checks/${chk1}/reissue", payload: {}, as: ProviderOps, captures: { chk2: $.data.id } }
            - { call: "POST /checks/${chk2}/record-cashed", payload: {}, as: ProviderOps }
          assert:
            - "C1 net: amount_cents == 75000 (fed 20000, state 0); stale_after == 2027-01-28T00:00:00.000Z (issued 2026-08-01 + 180d)"
            - "After void+reissue: Check.${chk1}.check_status == VOIDED; Check.${chk2}.check_status == ISSUED with supersedes_check_id == ${chk1} and amount_cents == 75000 — exactly one live check, obligation unchanged"
            - "After cashing C2: case ${c_a}.case_status == SETTLED; exactly one CASHED check in the chain; total cashed == 75000 == original net obligation"
            - "GET /checks?supersedes_check_id=${chk1} returns exactly [${chk2}]"
