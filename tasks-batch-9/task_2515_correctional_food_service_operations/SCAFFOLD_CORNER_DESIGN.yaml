          trigger:
            - call: "POST /cfs/facilities/${facility_id}/sharps-audit"
              payload: { counted_on_board: 12 }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { over_error: $.data.error_id }
            - call: "POST /cfs/facilities/${facility_id}/sharps-audit"
              payload: { counted_on_board: 11 }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { ok_on_board: $.data.sharps_on_board_count, ok_shortfall: $.data.sharps_audit_shortfall, ok_posture: $.data.kitchen_posture }
          assert:
            - "${pre_on_board} == 11 and ${pre_issued} == 1"
            - "${over_error} == ERR_SHARPS_COUNT_OVER_AUTHORIZED with HTTP 422 (12 + 1 + 0 == 13 > 12)"
