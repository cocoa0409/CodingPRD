[project]
name = "prd-bench-docker-runner"
version = "0.1.0"
description = "Docker-based benchmark runner for API compliance testing"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.0",
    "loguru>=0.7",
    "requests>=2.28",
    "prd-bench-local-runner",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
prd-bench-docker-run = "prd_bench_docker_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prd_bench_docker_runner"]
