        distinguishing_aspect: "On POST /accounts/{id}/contacts/bulk-import: rows of length 0 is rejected with ERR_EMPTY_IMPORT (422); rows of length 1 imports exactly one contact — an empty-collection boundary on a distinct endpoint from the postage-weight boundary."
        test_recipe:
