            - "HTTP 403 with error_id ERR_ACTOR_SCOPE_VIOLATION"
            - "the same call with as_user_id ${cl2} returns HTTP 200"

      - name: milestone_releaser_cannot_adjudicate_the_resulting_warranty_claim
        claim_type: Segregation of duties
        grounds:
          - validations[priority=38]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.Milestone.fields.released_by_user_id
          - entities.WarrantyClaim.fields.adjudicated_by_user_id
        distinguishing_aspect: "The operator id that released a milestone of the covered order is barred from adjudicating that order's warranty claim; a different ShopManager id adjudicates the identical claim successfully."
        test_recipe:
          setup:
            - "One funded client whose completed TUNE order minted an ACTIVE warranty; its single milestone was released by operator mgr-c74."
            - "The clock is at 2026-06-20 and a claim has been filed and taken UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "SoD Client", email: "sod@example.com", phone: "555-0375", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "sod-room", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C74-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { display_name: "Tech A74", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
