              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /store-ops/orders/${ord_a_id}/production"
              payload: { action: "READY" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /store-ops/dispatches"
              payload: { driver_id: "${drv_id}", planned_depart_at: "2026-08-05T12:05:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { dsp_id: $.data.id }
            - call: "POST /store-ops/dispatches/${dsp_id}/stops"
              payload: { order_id: "${ord_a_id}", hot_bag_slots: 1 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /store-ops/dispatches/${dsp_id}/lock"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /store-ops/dispatches/${dsp_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /store-ops/dispatches/${dsp_id}/stops/${stop1_id}/door-arrival"
              payload: { actual_miles: 3.40, cash_collected_cents: 2900 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /store-ops/dispatches/${dsp_id}/return"
              payload: {}
