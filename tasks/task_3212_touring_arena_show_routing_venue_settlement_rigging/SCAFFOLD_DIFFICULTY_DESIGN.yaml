            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans"
              payload: {}
              as: ProductionEngineer
              captures: { plan_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans/${plan_id}/allocations"
              payload: { rigging_point_id: "${point_id}", static_load_kg: 1000, dynamic_load_kg: 0, purpose: "rig" }
              as: ProductionEngineer
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans/${plan_id}/submit"
              payload: {}
              as: ProductionEngineer
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/rigging-plans/${plan_id}/approve"
