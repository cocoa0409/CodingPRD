  # ===========================================================================
  # 6 — errors
  # ===========================================================================
  - section: errors
    instances:
      - name: every_remaining_not_found_error_id_is_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_WALKOUT_NOT_FOUND
          - errors.ERR_POLE_APPLICATION_NOT_FOUND
          - errors.ERR_PERMIT_NOT_FOUND
          - errors.ERR_DESIGN_NOT_FOUND
          - errors.ERR_SPLICE_POINT_NOT_FOUND
          - errors.ERR_AS_BUILT_NOT_FOUND
        distinguishing_aspect: "One well-formed absent id, 00000000-0000-4000-8000-000000000000, is aimed at six different resource families and each returns its own entity-specific 404 id rather than a shared generic one."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "the store holds no FieldWalkout, PoleAttachmentApplication, PermitApplication, DesignPackage, SplicePoint or AsBuiltRecord with id 00000000-0000-4000-8000-000000000000"
            - "the acting user is authenticated as RouteEngineer with X-User-ID eng-alice, so priority 1 and 2 are both satisfied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
          trigger:
            - call: "GET /walkouts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { e_walkout: $.data.error_id }
            - call: "GET /pole-attachment-applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { e_paa: $.data.error_id }
            - call: "GET /permit-applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { e_permit: $.data.error_id }
            - call: "GET /design-packages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { e_design: $.data.error_id }
            - call: "POST /splice-points/00000000-0000-4000-8000-000000000000/void"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { e_splice: $.data.error_id }
            - call: "GET /as-built-records/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
              captures: { e_asbuilt: $.data.error_id }
          assert:
            - "${e_walkout} == ERR_WALKOUT_NOT_FOUND with HTTP 404"
            - "${e_paa} == ERR_POLE_APPLICATION_NOT_FOUND with HTTP 404"
            - "${e_permit} == ERR_PERMIT_NOT_FOUND with HTTP 404"
            - "${e_design} == ERR_DESIGN_NOT_FOUND with HTTP 404"
            - "${e_splice} == ERR_SPLICE_POINT_NOT_FOUND with HTTP 404, the path 404 winning over the PLACED-state gate"
            - "${e_asbuilt} == ERR_AS_BUILT_NOT_FOUND with HTTP 404"
