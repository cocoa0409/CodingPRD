            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-NE", amount_cents: 200000, encoded_amount_cents: 200000, image_quality_score: 90, capture_channel: "BRANCH" }
