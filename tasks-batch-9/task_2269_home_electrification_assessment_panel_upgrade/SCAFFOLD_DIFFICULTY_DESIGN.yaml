          setup:
            - "An OPEN program with low_tier_cost_share_pct 1.00, low_tier_cap_cents 1400000 and group_cap_cents 800000."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / sort_order 10 / 200 A / anchor, and HP-DUCT-01 unit 250000 / cap 250000 / HVAC_GROUP / sort_order 15 / 100 A / prerequisite_measure_code HP-HVAC-01."
            - "A household at exactly 80.0% AMI: income_tier LOW, cost share 1.00, rebate_cap_cents 1400000 (so Stage 3 cannot bind)."
            - "An APPROVED assessment with assessed_panel_amps 200, so neither line needs a panel upgrade and the prerequisite chain is satisfied."
