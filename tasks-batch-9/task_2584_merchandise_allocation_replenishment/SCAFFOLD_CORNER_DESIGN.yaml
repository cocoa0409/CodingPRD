              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex5: $.data.error_id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 9, size_on_hand: [{ size_code: "M", units: 5 }, { size_code: "XXL", units: 4 }], min_units: 8, max_units: 24, weekly_forecast_units: 3, trailing_4wk_sales_units: 10 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex6: $.data.error_id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 10, size_on_hand: [{ size_code: "M", units: 5 }, { size_code: "XXL", units: 4 }], min_units: 8, max_units: 24, weekly_forecast_units: 3, trailing_4wk_sales_units: 10 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex7: $.data.error_id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-BAD1", units_received: 12, size_received: [{ size_code: "S", units: 6 }, { size_code: "M", units: 5 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex8: $.data.error_id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-BAD2", units_received: 12, size_received: [{ size_code: "S", units: 6 }, { size_code: "XXS", units: 6 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex9: $.data.error_id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-GOOD", units_received: 12, size_received: [{ size_code: "S", units: 2 }, { size_code: "M", units: 4 }, { size_code: "L", units: 4 }, { size_code: "XL", units: 2 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
