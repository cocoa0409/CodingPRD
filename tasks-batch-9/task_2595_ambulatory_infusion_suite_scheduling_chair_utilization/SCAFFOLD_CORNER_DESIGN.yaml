      - name: an_open_reaction_review_on_the_live_visit_blocks_the_patients_next_booking
        claim_type: cross_entity
        grounds:
          - validations[priority 70]
          - errors[ERR_ADVERSE_EVENT_OPEN]
          - state_machines[AdverseEvent]
          - entities.Appointment.fields.readiness_status
        distinguishing_aspect: |
          The rule reaches across entities and across appointments: a reaction recorded on
          the visit currently infusing bars a NEW appointment for the same patient on a
          different service_date, and the bar persists through the intermediate
          UNDER_REVIEW state — only CLOSED clears it. The blocked booking is a different
          row from the one carrying the event, so an implementation that checks only the
          addressed appointment's own events lets it through.
