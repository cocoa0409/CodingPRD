            - call: "POST /technicians"
              payload: { full_name: "Tech VER", license_number: "LIC-VER1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client VER", email: "cver@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
              captures: { v1: $.data.version }
          assert:
            - "Appointment.${a}.version == 2 (was 1 at create, +1 on confirm)"

      - name: error_checkout_cascade_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Appointment.IN_SERVICE_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade / checkout_cascade_depth4_settlement_commission_loyalty_giftdeplete
          rationale: "Multi-hop checkout cascade is the named §1.8 instance."

      - name: error_no_show_rate_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.deposit_assessment
        excluded_because:
          difficulty_instance: boundary_precision_check / deposit_threshold_at_exactly_two_strikes
          rationale: "Strike-count rate threshold at 2 is the named §1.8 boundary instance."

      - name: error_dual_variant_technician_earning
        claim_type: dual_variant_calculation
        grounds:
          - calculations.technician_earning
        excluded_because:
          difficulty_instance: dual_variant_calc / technician_earning_commission_vs_booth_per_appointment
          rationale: "Commission vs booth-rent variant divergence is the named §1.8 instance."

  # ===================== Consistency Model ================================
  - section: consistency_model
    instances:
      - name: checkout_response_reflects_all_changes_immediately
        claim_type: immediate
        grounds:
          - state_machines.Appointment.IN_SERVICE_to_COMPLETED
          - entities.Appointment.fields.total_charged_cents
        distinguishing_aspect: "The checkout response itself carries booking_status COMPLETED, payment_status SETTLED, and total_charged_cents in the same request (immediate consistency)."
        test_recipe:
          setup: ["IN_SERVICE appointment subtotal 3000, no extras."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-24T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-IMM", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani IMM", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech IMM", license_number: "LIC-IMM1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client IMM", email: "cimm@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /appointments/${a}/checkout"
              payload: { expected_appointment_version: "${av}" }
              as: FrontDesk
              captures: { bs: $.data.booking_status, ps: $.data.payment_status, tc: $.data.total_charged_cents }
          assert:
            - "checkout response Appointment.${a}.booking_status == COMPLETED"
            - "checkout response Appointment.${a}.payment_status == SETTLED"
            - "checkout response Appointment.${a}.total_charged_cents == 3000"
