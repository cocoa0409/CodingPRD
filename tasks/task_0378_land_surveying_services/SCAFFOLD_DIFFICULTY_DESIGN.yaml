              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech1_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech P2", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
