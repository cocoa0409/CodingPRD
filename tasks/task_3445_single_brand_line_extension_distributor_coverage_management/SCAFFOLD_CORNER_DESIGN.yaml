            - *k_form
            - *k_seal
            - *k_review
            - *k_dist
            - *k_dist_app
          trigger:
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg_ok: $.data.id }
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "AUTOMOTIVE", starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { error_id: $.data.error_id }
            - call: "GET /brand-ops/distributors/${dist_id}"
              payload: {}
              as: ChannelManager
              captures: { dist_v3: $.data.version }
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "AUTOMOTIVE", starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v3}" }
              as: ChannelManager
              captures: { asg_ok2: $.data.id }
          assert:
            - "first create with the observed version 2 succeeds (201) and bumps the distributor to version 3"
            - "second create replaying version 2: 412 ERR_STALE_VERSION"
            - "after refetching (version 3), the corrected retry succeeds with 201"

      - name: occ_stale_version_on_price_list_create
        claim_type: optimistic_concurrency
        grounds:
