  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: registration_state_beats_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_WINDOW_NOT_OPEN]
          - errors[ERR_PREREQUISITE_NOT_MET]
        distinguishing_aspect: |
          Category pair {state, business_constraint}: the registration targets a
          CANCELLED window (state violation) AND the candidate lacks the FM
          prerequisite credit (constraint violation); priority 8 beats priority 10,
          so the error must be ERR_WINDOW_NOT_OPEN, not ERR_PREREQUISITE_NOT_MET.
        test_recipe:
          setup:
            - "Syllabus 2026-A with exams P and FM (FM prerequisite P), retired by activating 2026-B (credit_map {P: P2, FM: FM2}) so window FM-2026-10 is CANCELLED; cand1 holds NO exam credits"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl1_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl1_id}" }
