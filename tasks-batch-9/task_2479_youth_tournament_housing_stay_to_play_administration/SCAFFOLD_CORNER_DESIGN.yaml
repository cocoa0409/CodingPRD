              captures: { rid1: "$.data.id", rv1: "$.data.version" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team2_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: TeamManager
              as_user_id: "${team2_id}"
              captures: { rid2: "$.data.id", rv2: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${rid1}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${rv1}" }
              as: HousingManager
              captures: { bid1: "$.data.id" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${rid2}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${rv2}" }
              as: TeamManager
              as_user_id: "${team2_id}"
              captures: { bid2: "$.data.id" }
            - call: "GET /housing/bookings/${bid2}"
              payload: {}
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
          assert:
            - "first response.status == 201"
            - "second response.status == 201"
            - "third response.status == 201"
            - "fourth response.status == 201"
            - "fifth response.status == 200"
            - "TeamRegistration.${rid1}.required_rooms_registered == 6"
            - "TeamRegistration.${rid2}.required_rooms_registered == 6"
            - "Booking.${bid1}.projected_room_nights == 12"
            - "Booking.${bid2}.projected_room_nights == 12"
            - "RoomBlock.${block_id}.rooms_committed == 0"

      - name: roles_cannot_perform_other_roles_exclusive_operations
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles[HousingManager].exclusive_operations
          - roles[ExceptionReviewer].exclusive_operations
          - roles[RightsHolder].exclusive_operations
          - roles[HotelRepresentative].exclusive_operations
        distinguishing_aspect: |
          The exclusivity is symmetric and total: no role may reach into another role's exclusive route,
          including the housing manager, who owns the most operations but still cannot review an
          exception request. Five cross probes must all be 403 ERR_ROLE_NOT_PERMITTED, and because the
          route itself exists and the payload is well formed, neither a 404 nor a 400 is acceptable.
        test_recipe:
          setup:
            - "One DRAFT booking with a rooming list submitted, one SUBMITTED exception request, one INVESTIGATING complaint and one ISSUED invoice are all reachable."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_exception_family
            - *sc_complaint_pricing
            - *sc_triage_investigate_3
          trigger:
            - call: "POST /housing/bookings/${bk_id}/confirm"
              payload: {}
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "START_REVIEW" }
              as: HousingManager
              captures: { e2: "$.data.error_id" }
            - call: "POST /housing/complaints/${cmp3_id}/adjudicate"
              payload: { outcome: "DISMISSED", remedy_type: "NONE" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
              captures: { e3: "$.data.error_id" }
            - call: "POST /housing/complaints/${cmp3_id}/triage"
              payload: { route: "ESCALATE" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
              captures: { e4: "$.data.error_id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "KING", block_size_rooms: 5, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: RightsHolder
              as_user_id: "rh-1"
              captures: { e5: "$.data.error_id" }
          assert:
            - "every response.status == 403"
            - "${e1} == ERR_ROLE_NOT_PERMITTED"
            - "${e2} == ERR_ROLE_NOT_PERMITTED"
            - "${e3} == ERR_ROLE_NOT_PERMITTED"
            - "${e4} == ERR_ROLE_NOT_PERMITTED"
            - "${e5} == ERR_ROLE_NOT_PERMITTED"
            - "Booking.${bk_id}.booking_status == ROOMING_LIST_SUBMITTED"
            - "ExceptionRequest.${exc_id}.status == SUBMITTED"
            - "Complaint.${cmp3_id}.status == INVESTIGATING"

      - name: team_manager_cannot_reach_another_teams_registration
        claim_type: peer_roles
        grounds:
          - validations[priority=7]
          - errors[ERR_TEAM_SCOPE_VIOLATION]
          - roles[TeamManager]
        distinguishing_aspect: |
          TeamManagers are peers, not a hierarchy: holding the role is not enough, the X-User-ID must
          match the Team behind the resource. The same shared route that succeeds for the owning team is
          403 ERR_TEAM_SCOPE_VIOLATION for the neighbouring team — and it is a scope error, not
          ERR_ROLE_NOT_PERMITTED, because the role itself is permitted on the route.
        test_recipe:
          setup:
            - "Two registered teams, each with its own DRAFT booking."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - call: "POST /housing/teams"
              payload: { name: "Northgate United 16U", home_city: "Northgate", home_state: "OH", org_contact_email: "ops@northgate.example", distance_miles_from_venue: 88.0 }
              as: HousingManager
              captures: { other_team_id: "$.data.id" }
          trigger:
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: TeamManager
              as_user_id: "${other_team_id}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /housing/bookings/${bk_id}/cancel"
              payload: { cancellation_reason: "not my booking" }
              as: TeamManager
              as_user_id: "${other_team_id}"
              captures: { e2: "$.data.error_id" }
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: TeamManager
              as_user_id: "${team_id}"
          assert:
            - "first response.status == 403"
            - "${e1} == ERR_TEAM_SCOPE_VIOLATION"
            - "second response.status == 403"
            - "${e2} == ERR_TEAM_SCOPE_VIOLATION"
            - "third response.status == 200"
            - "Booking.${bk_id}.booking_status == DRAFT"

      - name: hotel_representative_cannot_report_for_another_hotel
        claim_type: peer_roles
        grounds:
          - validations[priority=8]
          - errors[ERR_HOTEL_SCOPE_VIOLATION]
          - roles[HotelRepresentative]
        distinguishing_aspect: |
          Hotel scope is resolved through the chain Booking to RoomBlock to HotelContract to Hotel, not
          from the request body, so a second hotel's representative cannot countersign the first hotel's
          contract or report its room nights. Both probes are 403 ERR_HOTEL_SCOPE_VIOLATION while the
          owning hotel's identical call succeeds.
        test_recipe:
          setup:
            - "Two hotels exist; only the first holds the contract, block and CONFIRMED booking, and the tournament is BOOKING_CLOSED so actualization is in phase."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - call: "POST /housing/hotels"
              payload: { name: "Rival Suites Airport", city: "Metro", total_rooms: 80, distance_miles_from_venue: 6.5 }
              as: HousingManager
              captures: { other_hotel_id: "$.data.id" }
          trigger:
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "reporting a stay that is not mine" }
              as: HotelRepresentative
              as_user_id: "${other_hotel_id}"
              captures: { e1: "$.data.error_id" }
            - call: "GET /housing/bookings/${bk_id}"
              payload: {}
              as: HotelRepresentative
              as_user_id: "${other_hotel_id}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "as stayed" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
          assert:
            - "first response.status == 403"
            - "${e1} == ERR_HOTEL_SCOPE_VIOLATION"
            - "second response.status == 403"
            - "${e2} == ERR_HOTEL_SCOPE_VIOLATION"
            - "third response.status == 201"
            - "Booking.${bk_id}.actualized_room_nights == 12"

      - name: appeal_reviewer_cannot_be_the_original_decider
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=34]
          - errors[ERR_SOD_SAME_REVIEWER]
          - state_machines.ExceptionRequest
        distinguishing_aspect: |
          The bar is conditional on history, not on the role: rev-1 legitimately decided the first round,
          and only once appeal_count reaches 1 does rev-1 become ineligible. The second DENY by rev-1 is
          403 ERR_SOD_SAME_REVIEWER while the identical call by rev-2 succeeds, so the check compares
          X-User-ID against the stored decided_by_user_id rather than blocking repeat reviewers outright.
        test_recipe:
          setup:
            - "An exception request denied by rev-1 and then appealed by the team, so it is UNDER_REVIEW with appeal_count 1 and decided_by_user_id rev-1."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_exception_family
            - *sc_start_review
            - *sc_deny
            - call: "POST /housing/exception-requests/${exc_id}/team-action"
              payload: { action: "APPEAL", justification: "adding the physician letter" }
              as: TeamManager
              as_user_id: "${team_id}"
          trigger:
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "DENY", decision_note: "same reviewer again" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "APPROVE", approved_rooms_exempt: 1, decision_note: "fresh eyes, granted" }
              as: ExceptionReviewer
              as_user_id: "rev-2"
          assert:
            - "first response.status == 403"
            - "first response.error.error_id == ERR_SOD_SAME_REVIEWER"
            - "second response.status == 200"
            - "ExceptionRequest.${exc_id}.status == APPROVED"
            - "ExceptionRequest.${exc_id}.appeal_count == 1"
            - "ExceptionRequest.${exc_id}.decided_by_user_id == rev-2"
            - "TeamRegistration.${reg_id}.exempt_rooms_granted == 1"

      - name: exception_decider_cannot_adjudicate_the_complaint_citing_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=35]
          - errors[ERR_SOD_ADJUDICATOR_CONFLICT]
          - state_machines.Complaint
        distinguishing_aspect: |
          Segregation follows the human, not the role: the same person may hold both the reviewer and
          rights-holder hats, and the conflict is detected by matching X-User-ID against the cited
          request's decided_by_user_id. Adjudication by that id is 403 ERR_SOD_ADJUDICATOR_CONFLICT on
          BOTH terminal outcomes, so upholding is not a loophole, while a different rights-holder id
          closes the complaint normally.
        test_recipe:
          setup:
            - "A FAMILY_MEDICAL exception request denied by rev-1, and an INVESTIGATING policy-fairness complaint that cites it."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_exception_family
            - *sc_start_review
            - *sc_deny
            - *sc_complaint
            - *sc_triage_investigate
          trigger:
            - call: "POST /housing/complaints/${cmp_id}/adjudicate"
              payload: { outcome: "DISMISSED", remedy_type: "NONE" }
              as: RightsHolder
              as_user_id: "rev-1"
              captures: { e1: "$.data.error_id" }
            - call: "POST /housing/complaints/${cmp_id}/adjudicate"
              payload: { outcome: "UPHELD", remedy_type: "NONE" }
              as: RightsHolder
              as_user_id: "rev-1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /housing/complaints/${cmp_id}/adjudicate"
              payload: { outcome: "DISMISSED", remedy_type: "NONE" }
              as: RightsHolder
              as_user_id: "rh-1"
          assert:
            - "first response.status == 403"
            - "${e1} == ERR_SOD_ADJUDICATOR_CONFLICT"
            - "second response.status == 403"
            - "${e2} == ERR_SOD_ADJUDICATOR_CONFLICT"
            - "third response.status == 200"
            - "Complaint.${cmp_id}.status == DISMISSED"
            - "Complaint.${cmp_id}.adjudicated_by_user_id == rh-1"
            - "ExceptionRequest.${exc_id}.status == DENIED"

      - name: rebate_complaint_adjudicator_cannot_approve_the_distribution
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=36]
          - errors[ERR_SOD_DISTRIBUTION_APPROVER_CONFLICT]
          - state_machines.RevenueDistribution
        distinguishing_aspect: |
          The third segregation rule reaches across aggregates and across time: whoever upheld a
          REBATE_TRANSPARENCY complaint on a tournament is barred from approving that tournament's
          revenue split, because they have already ruled on the numbers being divided. The APPROVE by
          rh-1 is 403 ERR_SOD_DISTRIBUTION_APPROVER_CONFLICT while rh-2 advances the distribution to
          APPROVED, and the bar is category-scoped — a pricing complaint by the same id would not bind.
        test_recipe:
          setup:
            - "A fully collected 10800-cent invoice with a CALCULATED distribution on the tournament."
            - "A REBATE_TRANSPARENCY complaint on the same tournament, upheld by rights-holder rh-1."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
            - *sc_issue
            - *sc_remit_full
            - *sc_get_invoice
            - *sc_distribution
            - call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "REBATE_TRANSPARENCY", narrative: "the rebate math was never shown to us", registration_id: "${reg_id}" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { cmp_r_id: "$.data.id" }
            - call: "POST /housing/complaints/${cmp_r_id}/triage"
              payload: { route: "INVESTIGATE" }
              as: HousingManager
            - call: "POST /housing/complaints/${cmp_r_id}/adjudicate"
              payload: { outcome: "UPHELD", remedy_type: "NONE" }
              as: RightsHolder
              as_user_id: "rh-1"
          trigger:
            - call: "POST /housing/revenue-distributions/${dist_id}/advance"
              payload: { action: "APPROVE" }
              as: RightsHolder
              as_user_id: "rh-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /housing/revenue-distributions/${dist_id}/advance"
              payload: { action: "APPROVE" }
              as: RightsHolder
              as_user_id: "rh-2"
          assert:
            - "Complaint.${cmp_r_id}.status == UPHELD"
            - "Complaint.${cmp_r_id}.adjudicated_by_user_id == rh-1"
            - "first response.status == 403"
            - "first response.error.error_id == ERR_SOD_DISTRIBUTION_APPROVER_CONFLICT"
            - "RevenueDistribution.${dist_id}.status == CALCULATED"
            - "second response.status == 200"
            - "RevenueDistribution.${dist_id}.status == APPROVED"
            - "RevenueDistribution.${dist_id}.approved_by_user_id == rh-2"

  # Exactly the four layers declared in complexity_profile.complexity_layers are walked:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  # rate_threshold_triggers. No claim set is emitted for any layer this scaffold does not declare.
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_registration_version_rejected_on_booking_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-registration]
          - validations[priority=15]
          - errors[ERR_STALE_REGISTRATION_VERSION]
          - endpoints[POST /housing/bookings]
        distinguishing_aspect: |
          The first of the two declared concurrency rules guards POST /housing/bookings with
          expected_registration_version. A team manager who loaded the registration before an exception
          was granted holds version 1, but the approval moved the roster requirement, so the booking is
          refused with 412 ERR_STALE_REGISTRATION_VERSION; re-reading and resubmitting the current
          version succeeds. The refusal must leave no Booking row and must not itself bump the version.
        test_recipe:
          setup:
            - "A registration read at version 1, then mutated by an approved 1-room FAMILY_MEDICAL exemption, which raises its version to 2."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_exception_family
            - *sc_start_review
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "APPROVE", approved_rooms_exempt: 1, decision_note: "documented" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { reg_v_fresh: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v_fresh}" }
              as: TeamManager
              as_user_id: "${team_id}"
              captures: { bk_fresh_id: "$.data.id" }
          assert:
            - "first response.status == 412"
            - "first response.error.error_id == ERR_STALE_REGISTRATION_VERSION"
            - "${reg_v_fresh} == 2"
            - "TeamRegistration.${reg_id}.exempt_rooms_granted == 1"
            - "third response.status == 201"
            - "Booking.${bk_fresh_id}.booking_status == DRAFT"
            - "Booking.${bk_fresh_id}.projected_room_nights == 12"

      - name: stale_invoice_version_rejected_on_distribution_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[distribution-create-stale-invoice]
          - validations[priority=16]
          - errors[ERR_STALE_INVOICE_VERSION]
          - endpoints[POST /housing/revenue-distributions]
        distinguishing_aspect: |
          The second concurrency rule guards POST /housing/revenue-distributions with
          expected_invoice_version, and the remittance that made the invoice distributable is exactly
          what invalidates the caller's snapshot: the version read at ISSUED is stale once the hotel
          pays. The stale attempt is 412 ERR_STALE_INVOICE_VERSION even though every business
          precondition now holds, which proves the version check runs before the collected-funds check
          at priority 26.
        test_recipe:
          setup:
            - "An invoice read at ISSUED (version captured), then paid in full by the hotel, which raises its version."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - *sc_close_booking
            - *sc_actualize12
            - *sc_invoice
            - *sc_issue
            - call: "GET /housing/rebate-invoices/${inv_id}"
              payload: {}
              as: HousingManager
              captures: { inv_v_stale: "$.data.version" }
            - *sc_remit_full
          trigger:
            - call: "POST /housing/revenue-distributions"
              payload: { tournament_id: "${tourn_id}", source_invoice_id: "${inv_id}", expected_invoice_version: "${inv_v_stale}" }
              as: HousingManager
              as_user_id: "mgr-1"
              captures: { err: "$.data.error_id" }
            - call: "GET /housing/rebate-invoices/${inv_id}"
              payload: {}
              as: HousingManager
              captures: { inv_v_fresh: "$.data.version" }
            - call: "POST /housing/revenue-distributions"
              payload: { tournament_id: "${tourn_id}", source_invoice_id: "${inv_id}", expected_invoice_version: "${inv_v_fresh}" }
              as: HousingManager
              as_user_id: "mgr-1"
              captures: { dist_fresh_id: "$.data.id" }
          assert:
            - "first response.status == 412"
            - "first response.error.error_id == ERR_STALE_INVOICE_VERSION"
            - "${inv_v_fresh} > ${inv_v_stale}"
            - "RebateInvoice.${inv_id}.status == PAID"
            - "third response.status == 201"
            - "RevenueDistribution.${dist_fresh_id}.gross_collected_cents == 10800"
            - "RevenueDistribution.${dist_fresh_id}.status == CALCULATED"

      - name: close_booking_cascade_is_all_or_nothing
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Tournament.transitions[OPEN->BOOKING_CLOSED]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The close-booking cascade touches three link levels at once, so its failure mode matters as
          much as its success: when the precondition of at least one EXECUTED contract is unmet, the
          refusal must leave ZERO partial effects — the tournament stays OPEN, the block stays OPEN
          rather than being released, and the open exception request is not swept to DENIED. An
          implementation that applies side effects before checking preconditions passes the happy-path
          cascade test but fails here.
        test_recipe:
          setup:
            - "A tournament whose only contract is still NEGOTIATING, with a block already created and one SUBMITTED exception request."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_team
            - *sc_registration
            - *sc_exception_family
          trigger:
            - call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_INVALID_STATE"
            - "Tournament.${tourn_id}.posture == OPEN"
            - "Tournament.${tourn_id}.version == 1"
            - "HotelContract.${contract_id}.status == NEGOTIATING"
            - "RoomBlock.${block_id}.status == OPEN"
            - "RoomBlock.${block_id}.rooms_released_unsold == 0"
            - "ExceptionRequest.${exc_id}.status == SUBMITTED"

      - name: roster_requirement_both_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.roster_room_requirement.variants
          - calculations.attrition_shortfall.variants
        excluded_because:
          difficulty_instance: roster_room_requirement_segregated_vs_pooled_occupancy
          rationale: |
            That instance computes both variants on the same 13-player, 3-staff roster and pins the
            6-room segregated answer against the 4-room pooled reading, asserting the delta; the second
            dual-variant rule is covered the same way by
            attrition_shortfall_per_block_vs_contract_aggregate.

      - name: cancellation_tier_boundary_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.cancellation_penalty
          - calculations.cancellation_penalty.constants.CANCEL_FREE_TIER_DAYS
        excluded_because:
          difficulty_instance: cancellation_free_tier_boundary_exact_45_days
          rationale: |
            That instance cancels at exactly 45 days out and at 44 days out, pinning the inclusive
            boundary of the free tier and the quarter tier's first cent, which is this layer's temporal
            threshold claim.

      - name: restriction_threshold_resets_when_rooms_are_given_back
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.block_utilization_posture
          - calculations.block_utilization_posture.constants.BLOCK_RESTRICT_UTILIZATION
          - state_machines.RoomBlock.transitions[RESTRICTED->OPEN]
        distinguishing_aspect: |
          The utilization threshold is a live gauge, not a latch. Nine of ten rooms committed puts the
          block at exactly 0.9 and RESTRICTED; cancelling the five-room booking returns the inventory
          and the block must fall back to OPEN with utilization 0.4, and the contract's posture must
          follow it back to AVAILABLE. An implementation that treats the restriction as a one-way flag
          leaves the block RESTRICTED and fails.
        test_recipe:
          setup:
            - "A 10-room block holding two CONFIRMED bookings of 4 and 5 rooms, so utilization is exactly 0.9 and the block is RESTRICTED."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block10
            - *sc_submit
            - *sc_countersign
            - *sc_teamA
            - *sc_regA
            - *sc_bkA_overlap
            - *sc_rlA4
            - *sc_confirmA
            - *sc_teamB
            - *sc_regB
            - *sc_bkB_overlap
            - *sc_rlB5
            - *sc_confirmB
          trigger:
            - call: "POST /housing/bookings/${bk_b_id}/cancel"
              payload: { cancellation_reason: "team withdrew from the event" }
              as: TeamManager
              as_user_id: "${team_b_id}"
          assert:
            - "response.status == 200"
            - "Booking.${bk_b_id}.booking_status == CANCELLED"
            - "RoomBlock.${block10_id}.rooms_committed == 4"
            - "RoomBlock.${block10_id}.rooms_available == 6"
            - "RoomBlock.${block10_id}.utilization_pct == 0.4"
            - "RoomBlock.${block10_id}.status == OPEN"
            - "HotelContract.${contract_id}.block_posture == AVAILABLE"
            - "Tournament.${tourn_id}.housing_pressure == NORMAL"

  - section: consistency_model
    instances:
      - name: confirm_response_already_shows_every_derived_change
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /housing/bookings/{id}/confirm]
          - calculations.block_rooms_committed
          - calculations.registration_compliance_status
        distinguishing_aspect: |
          Consistency is immediate, so nothing about this domain is allowed to settle later: the confirm
          call's own response body must already carry the CONFIRMED status and the bumped version, and
          reads taken immediately afterwards — with no clock advance and no second write — must already
          show the block's committed and available counters, the registration's compliance verdict, the
          contract's block posture and the tournament's housing pressure at their final values. An
          implementation that recomputes derived fields lazily on next read, or on a background pass,
          fails because the first read is the only read.
        test_recipe:
          setup:
            - "One 4-room booking with a valid rooming list on a 20-room block, awaiting confirmation."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
          trigger:
            - call: "POST /housing/bookings/${bk_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "GET /housing/hotel-contracts/${contract_id}/room-blocks"
              payload: { status: "OPEN" }
              as: HousingManager
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: HousingManager
            - call: "GET /housing/tournaments/${tourn_id}"
              payload: {}
              as: HousingManager
          assert:
            - "first response.status == 200"
            - "first response.data.booking_status == CONFIRMED"
            - "first response.data.projected_room_nights == 12"
            - "second response.data[0].rooms_committed == 4"
            - "second response.data[0].rooms_available == 16"
            - "second response.data[0].utilization_pct == 0.2"
            - "second response.data[0].status == OPEN"
            - "third response.data.committed_rooms == 4"
            - "third response.data.compliance_status == HOUSING_COMPLIANT"
            - "fourth response.data.housing_pressure == NORMAL"
            - "fourth response.data.posture == OPEN"
