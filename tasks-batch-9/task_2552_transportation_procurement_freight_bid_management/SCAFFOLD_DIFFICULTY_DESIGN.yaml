            - "at sample 5 (after the first trigger call) — tender_count == 5, rejection_count == 1, rejection_pct == 20.00 exactly, acceptance_pct == 80.00, and RateRecord.${rate_a_id}.status == AT_RISK because the comparison is >= and not >"
