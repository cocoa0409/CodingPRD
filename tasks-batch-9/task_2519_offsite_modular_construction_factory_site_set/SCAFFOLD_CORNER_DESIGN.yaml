      - name: draw_and_claim_sequencing_errors_are_triggerable
        claim_type: Triggerability
        grounds:
          - errors[ERR_DRAW_SEQUENCE_GAP]
          - errors[ERR_DRAW_NOT_CERTIFIED]
          - errors[ERR_CLAIM_NOT_ADJUDICATED]
          - errors[ERR_CLAIM_NOT_ADJUDICABLE]
