            - "trigger call 2 returns HTTP 403 with ${e_403} == ERR_UNAUTHORIZED"
            - "no SupplierLot row exists after trigger calls 1 and 2"
            - "trigger call 3 returns HTTP 201 with SupplierLot.${ok_lot}.intake_status == RECEIVED"

      - name: manager_and_supplier_scopes_are_peer_isolated
        claim_type: peer_roles
        grounds:
          - roles.SeafoodManager.entity_backed
          - roles.SupplierRep.entity_backed
          - validations[priority=3]
          - validations[priority=4]
          - errors.ERR_COUNTER_SCOPE_FORBIDDEN
          - errors.ERR_SUPPLIER_SCOPE_FORBIDDEN
          - complexity_profile.role_model
        distinguishing_aspect: |
          Both entity-backed roles are horizontally partitioned, and each partition has its own
          403 code: the manager of Counter B cannot case Counter A's lot
          (ERR_COUNTER_SCOPE_FORBIDDEN) and Supplier 2's representative cannot file an import
          document against Supplier 1's lot (ERR_SUPPLIER_SCOPE_FORBIDDEN) -- being the right
          ROLE is not the same as being the right instance of it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter A (store 4120) and Counter B (store 4130)"
            - "Supplier 1 (Gulf Bay Dealers) and Supplier 2 (Coastline Wholesale)"
            - "Red Snapper SupplierLot received at Counter A from Supplier 1, still in RECEIVED"
