            - call: "POST /api/part-requisitions/${q18}/source"
              as: ShopPlanner
              captures: { q18_class: $.data.sourced_class, q18_unit: $.data.unit_cost_usd }
            - call: "GET /api/shop-visits/${v18}"
              as: ShopPlanner
              captures: { v18_commit_mid: $.data.committed_parts_cost_usd, v18_ver2: $.data.version }
          trigger:
            - call: "POST /api/shop-visits/${v18}/workscopes"
              payload:
                expected_shop_visit_version: "${v18_ver2}"
                items:
                  - { item_code: "MO-2", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 350000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { w18b: $.data.id, w18b_scope: $.data.scope_version }
            - call: "GET /api/shop-visits/${v18}"
              as: ShopPlanner
              captures: { v18_commit_post: $.data.committed_parts_cost_usd }
            - call: "GET /api/workscopes/${w18}"
              as: ShopPlanner
              captures: { w18_status: $.data.status }
            - call: "GET /api/workscopes/${w18}/part-requisitions"
              as: ShopPlanner
              captures: { q18_status: "$.data[0].status" }
          assert:
            - "captured q18_class == USM and q18_unit == 4500.00 (requested class is allowed; lead 3 days fits)"
            - "captured v18_commit_pre == 0.00 and v18_commit_mid == 9000.00 (2 * 4500.00 committed at source)"
            - "captured v18_commit_post == 0.00 (supersede auto-cancel released exactly the sourced amount)"
            - "captured w18_status == SUPERSEDED and q18_status == CANCELLED; w18b_scope == 2"
