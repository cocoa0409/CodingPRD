          - errors[ERR_NET_BENEFIT_BELOW_THRESHOLD]
        distinguishing_aspect: |
          An arm call on an event whose net_benefit_ratio is 0.0302 (far below the 0.25 floor) AND which has
          no dispatched ADVANCE_48H batch must return the business_safety error at priority 11
          (ERR_ADVANCE_NOTIFICATION_MISSING, 422) and not the business_fiscal error at priority 17
          (ERR_NET_BENEFIT_BELOW_THRESHOLD, 422) — a same-status-code pair that only the priority ladder
          can disambiguate.
        test_recipe:
          setup:
            - "Circuit GOLF is TIER_2 with overhead_miles 5.0, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle, fast_trip_enabled false, and one ONLINE station of weight 1.00."
