          setup: ["Assignment SUBMITTED with one APPROVED photo + scorecard."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "RevCo", billing_email: "r@x.test", fee_per_completed_shop_cents: 15000 }
