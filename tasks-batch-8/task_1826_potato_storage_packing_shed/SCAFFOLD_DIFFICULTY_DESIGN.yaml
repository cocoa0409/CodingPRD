            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 80.0, requested_packed_cwt: 250.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /potato-shed/field-lots/${lc_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager, captures: { lc_q: "$.data.quality_status" } }
            - { call: "GET /potato-shed/pack-orders/${o_id}", payload: {}, as: SalesManager, captures: { o_status: "$.data.status", o_res: "$.data.reservations" } }
            - { call: "GET /potato-shed/contracts/${c_id}", payload: {}, as: SalesManager, captures: { c_rem: "$.data.remaining_committed_cwt", c_act: "$.data.allocated_active_cwt" } }
            - { call: "POST /potato-shed/field-lots/${lc_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "PROCESSING_CREDIT" }, as: QualityAssuranceManager, captures: { lc_cond: "$.data.condemned_cwt", lc_credit: "$.data.processing_credit_cwt", lc_store: "$.data.storage_status" } }
          assert:
            - "lc_q == ON_HOLD; after the hold o_status == REQUESTED and o_res == [] (coverage 90.00 < 250.00 triggered full reset, releasing D's reservation too)"
            - "c_rem == 400.00 and c_act == 0 (contract restored by the order reset)"
            - "lc_cond == 200.00, lc_credit == 200.00 (PROCESSING_CREDIT channel feeds the settlement credit pool), lc_store == CLOSED (condemn auto-closes at zero available)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_outranks_fiscal_on_allocate
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_COMMITMENT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (p5) vs business_fiscal (p10): allocating a CANCELLED order that
          would ALSO exceed the contract's remaining commitment (0.00) must return
          ERR_ORDER_INVALID_STATE, not ERR_COMMITMENT_EXCEEDED.
        test_recipe:
          setup:
            - "Lot 100.00 RUSSET_BURBANK assessed 70/20/10; contract committed 100.00 @ 2000; order O1 requested 100.00 allocated (== commitment, allowed), driving remaining to 0"
            - "order O2 requested 50.00 against the same contract, then cancelled while REQUESTED"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Ten", grower_code: "G-TEN" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed J" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer H", variety: "RUSSET_BURBANK", committed_volume_cwt: 100.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o1_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 50.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o2_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o2_id}/cancel", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o2_id}/allocate", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ORDER_INVALID_STATE (state p5 beats business_fiscal p10 even though remaining_committed_cwt == 0 would also fail)"
            - "PackOrder.${o2_id}.status == CANCELLED and CustomerContract.${c_id}.remaining_committed_cwt == 0.00 (no side effects leaked)"

      - name: safety_outranks_temporal_on_run_create
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_WASH_CHECK_STALE]
          - errors[ERR_LINE_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety (p6) vs business_temporal (p8): creating a run when the
          shed's latest wash checks are two FAILs (stale/no fresh PASS) AND the requested window
          overlaps an existing SCHEDULED run must return ERR_WASH_CHECK_STALE, not
          ERR_LINE_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Lot 1000.00 RUSSET_BURBANK assessed 70/20/10 (f 0.9); contract committed 600.00 @ 2000; orders O1 and O2 each requested 100.00, both allocated (raw 111.11 each)"
            - "PASS wash check measured 2026-08-09T20:00:00Z (4h old when run R1 is created at clock 2026-08-10T00:00:00Z — fresh under the NORMAL 12h window); R1 on O1 scheduled 08:00-10:00 (O1 PACKING)"
