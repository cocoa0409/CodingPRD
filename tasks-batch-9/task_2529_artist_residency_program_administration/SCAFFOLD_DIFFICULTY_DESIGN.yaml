              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "GET /visa-cases/${vc}"
              payload: {}
              as: VisaCoordinator
              as_user_id: "visa-01"
          assert:
            - "the auto-created VisaCase starts at status == 'INITIATED' with rfe_round == 0 and case_type == 'B1_SHORT_TERM'"
            - "after the schedule call the VisaCase reports filing_deadline_date == '2026-07-14', earliest_entry_date == '2026-10-03' and days_to_filing_deadline == 43 (2026-07-14 minus the 2026-06-01 clock)"
            - "the first REQUEST/SUBMIT pair leaves status == 'DOCS_SUBMITTED' with rfe_round == 0 - the first request is not a re-request"
            - "the second REQUEST (the DOCS_SUBMITTED -> DOCS_REQUESTED reverse edge) set rfe_round == 1, and the following SUBMIT returned to 'DOCS_SUBMITTED' with rfe_round still 1"
            - "the trigger returns 200 with status == 'DOCS_REQUESTED' and rfe_round == 2 - the same edge traversed a third time, with no cap"
            - "the trigger's requested_doc_list is the 4-element list and submitted_doc_list has been reset, so a SUBMIT replaying the earlier 3-element payload now fails P40 with error_id 'ERR_VISA_DOCS_INCOMPLETE' - the loop guard strengthened on the lap"
            - "FILE remains reachable from DOCS_SUBMITTED at any rfe_round, and APPROVED/DENIED are the only terminal states, so the cycle terminates by leaving it rather than by exhausting it"
            - "status alone is ambiguous across laps: DOCS_REQUESTED at rfe_round 0, 1 and 2 are three distinguishable situations that share one state value"

  # ===================================================================================
  # RULE 4 - transitive_cascade
  # Differentiation: two different triggering transitions and two different depths.
  #   CASCADE C  Residency IN_RESIDENCE -> TERMINATED          depth 4
  #   CASCADE B  PanelAssignment ASSIGNED -> CONFLICT_DECLARED  depth 5
  # In both, link N+1 is caused BY link N - it is not a sibling side effect of the trigger.
  # ===================================================================================
  - rule_id: transitive_cascade
    instances:

      - name: terminate_residency_repricing_chain_reaches_the_cycle_ledger
        grounds: "§1.2 Residency IN_RESIDENCE -> TERMINATED side_effects CASCADE C links 1-4; §1.3 calculations.residency_stipend_total variant final_settled and calculations.cycle_stipend_ledger; §1.1 Residency.actual_weeks_in_residence / stipend_basis / stipend_total_cents, StipendDisbursement.status, Cycle.stipend_committed_cents"
        distinguishing_aspect: |
          Depth 4, triggered by POST /residencies/{id}/lifecycle action=TERMINATE. The causal chain
          is strictly serial - each link is only computable once the previous one has landed:
            L1  actual_weeks_in_residence = ceil((now - session_start + 1) / 7) = 3
            L2  BECAUSE only 3 weeks were served, the periods still SCHEDULED no longer describe
                real work, so every SCHEDULED StipendDisbursement is VOIDED
            L3  BECAUSE the surviving schedule no longer covers the planned session,
                stipend_basis flips to FINAL_SETTLED and stipend_total_cents is re-priced from
                the served weeks (70000 x 3 = 210000)
            L4  BECAUSE the residency's own total dropped, Cycle.stipend_committed_cents is
                reduced by the difference and stipend_uncommitted_cents recomputed
          The chain crosses three entities (Residency -> StipendDisbursement -> Cycle) and it is
          order-sensitive: re-pricing before voiding would leave the voided periods inside the
          basis, and touching the cycle ledger before the re-price would move the wrong amount.
        test_recipe:
          setup: |
            CHAIN-SHORT, US applicant, 70000/week, 8-week session starting 2026-11-02
            (session_end_date 2026-12-27). A stipend schedule is generated (4 periods of 140000,
            sum 560000), both trainings are recorded, the clock is moved to the session start and
            the residency is checked in. The clock is then moved to 2026-11-20 - 19 days into the
            session, and still before session_end_date, which the TERMINATE precondition requires.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: true,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { artist: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${artist}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}" }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T15:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "TERMINATE", reason: "resident withdrew from the shop after a safety incident" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /stipend-disbursements?residency_id=${res}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-01"
          assert:
            - "pre-state: 4 StipendDisbursement rows all SCHEDULED with gross_cents 140000 each; Residency.stipend_basis == 'PROVISIONAL', stipend_total_cents == 560000; the setup GET /cycles/${cyc} returned stipend_committed_cents == 560000 and stipend_uncommitted_cents == 19440000"
            - "LINK 1 - the trigger returns actual_weeks_in_residence == 3, from ceil((2026-11-20 - 2026-11-02 + 1 day) / 7) = ceil(19/7)"
            - "LINK 2 (caused by link 1) - all 4 disbursements now have status == 'VOIDED'; none is PAID, so no money moved, and the VOIDs are what make the re-price legitimate"
            - "LINK 3 (caused by link 2) - stipend_basis == 'FINAL_SETTLED' and stipend_total_cents == 210000 (70000 x 3), i.e. the final_settled variant of residency_stipend_total"
            - "LINK 4 (caused by link 3) - GET /cycles/${cyc} returns stipend_committed_cents == 210000 and stipend_uncommitted_cents == 19790000, a release of exactly 560000 - 210000 = 350000"
            - "the chain is 4 links deep and spans Residency -> StipendDisbursement -> Residency -> Cycle; a 3-link implementation that stops after the re-price leaves the cycle over-committed by 350000"
            - "slots_filled_count stays 1 and slots_open_count stays 9: TERMINATED residencies remain in the slot ledger (only WITHDRAWN leaves it), so the money cascade and the slot ledger are decoupled"
            - "Residency.version incremented by 1 and Cycle.version incremented by 1 - a single request, one version bump per touched aggregate root"

      - name: severe_conflict_recusal_chain_unwinds_the_whole_cycle_panel
        grounds: "§1.2 PanelAssignment ASSIGNED -> CONFLICT_DECLARED and SCORED -> VACATED side_effects CASCADE B links 1-5; §1.1 Panelist.status / recused_cycle_id, Application.scored_panelist_count / final_panel_score / rank_in_discipline, Cycle.slate_ready_count / panel_review_complete; §1.3 calculations.application_composite_score input_set"
        distinguishing_aspect: |
          Depth 5, triggered by a completely different transition -
          POST /panel-assignments/{id}/declare-conflict with a SEVERE conflict_type - and it
          propagates SIDEWAYS across sibling aggregates rather than downward through one:
            L1  the declaring assignment's four rubric scores, scored_at and panelist_total_100
                are cleared (compensation)
            L2  BECAUSE the conflict is FAMILIAL/FINANCIAL rather than incidental, the Panelist
                becomes RECUSED_FOR_CYCLE with recused_cycle_id set
            L3  BECAUSE the panelist is recused for the whole cycle, every OTHER assignment they
                hold in that cycle is VACATED and its scores cleared too
            L4  BECAUSE those clears removed SCORED assignments, each affected Application's
                scored_panelist_count is recomputed and any Application that falls below
                Cycle.panel_quorum is driven SCORED -> PANEL_REVIEW with final_panel_score and
                rank_in_discipline nulled
            L5  BECAUSE applications left SCORED, Cycle.slate_ready_count is recomputed and
                panel_review_complete flips to false, re-locking the slate
          One panelist's single click therefore reaches two applications that were never
          mentioned in the request and blocks the chair from locking the slate.
        test_recipe:
          setup: |
            CHAIN-PANEL with panel_quorum 2, one discipline SCULPT and TWO applicants, each with
            one application advanced to panel. Three panelists: p1 sits on BOTH applications,
            p2 sits on app1 only, p3 sits on app2 only. All four assignments are scored:
              app1: p1 8/8/8/8 -> 80.00, p2 6/6/6/6 -> 60.00   => SCORED, both scores 70.00
              app2: p1 8/8/8/8 -> 80.00, p3 7/7/7/7 -> 70.00   => SCORED, both scores 75.00
            Both applications are therefore SCORED, Cycle.slate_ready_count is 2 and
            panel_review_complete is true - the cycle is ready to lock when the trigger fires.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
