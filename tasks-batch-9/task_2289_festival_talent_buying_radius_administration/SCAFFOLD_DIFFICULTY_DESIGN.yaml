            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Pale Signal LLC", performing_name: "Pale Signal", primary_genre: "POP", agency: "Foghorn Agency", draw_score: 80, default_radius_miles: 120 }
              as: TalentBuyer
              captures: { artist_pop: $.data.id }
            - call: "POST /festival-ops/offers"
