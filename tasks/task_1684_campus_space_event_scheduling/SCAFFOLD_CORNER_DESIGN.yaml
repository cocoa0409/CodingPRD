            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
          trigger:
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "CUSTODIAL", quantity: 1, service_start_at: "2026-09-16T11:59:00Z", service_end_at: "2026-09-16T13:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "POST /campus/service-orders", payload: { event_id: "${ev_id}", category: "CUSTODIAL", quantity: 1, service_start_at: "2026-09-16T12:00:00Z", service_end_at: "2026-09-16T13:00:00Z" }, as: OrgRequester, as_user_id: "${org_id}", captures: { so_id: $.data.id } }
          assert:
