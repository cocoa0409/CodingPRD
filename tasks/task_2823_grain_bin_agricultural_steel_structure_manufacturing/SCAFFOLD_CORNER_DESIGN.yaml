# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design - breadth coverage of every testable claim in
# SCAFFOLD.yaml §1.1-§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not
# already assert. Walked row-by-row against references/claim-extraction-guide.md.
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:

      - name: jurisdiction_create_returns_the_success_envelope_and_is_readable_back
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
          - endpoints[GET /jurisdictions/{id}]
          - response_envelope.success
        distinguishing_aspect: "A 201 create must wrap the row in the declared envelope - meta.api_request_id, meta.api_request_timestamp, response_type object, data - and the stored row must read back field-for-field through the sibling GET, with the list form using response_type array plus the four pagination fields."
        test_recipe:
          setup:
            - "Empty database. No fixtures beyond the two configuration rows this recipe creates."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id, j_ns_code: $.data.code }
            - call: "POST /jurisdictions"
              payload: { code: "IA-CENTRAL", name: "Iowa Central", seal_required: true, min_design_wind_speed_mph: 105, seismic_design_category: "B", permit_review_days: 21 }
              as: PlantAdmin
              captures: { j_sl_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${j_ns_id}"
              payload: {}
              as: PlantAdmin
              captures: { got_code: $.data.code, got_seal: $.data.seal_required }
            - call: "GET /jurisdictions"
              payload: { limit: 10, offset: 0 }
              as: PlantAdmin
              captures: { first_code: "$.data[0].code" }
          assert:
            - "the create returns HTTP 201 with meta.api_request_id and meta.api_request_timestamp present, response_type == object, and data holding the row"
            - "data.id is a bare UUID with no type prefix and data.created_at is ISO 8601 UTC with three fractional digits"
            - "Jurisdiction is declared common_fields false, so the create response carries id and created_at but NO version and NO updated_at key"
            - "GET /jurisdictions/${j_ns_id} returns HTTP 200 with code == NE-WEST, name == Nebraska West, seal_required == false, min_design_wind_speed_mph == 95, seismic_design_category == A and permit_review_days == 0"
            - "GET /jurisdictions returns response_type == array with total_count == 2, has_more == false, limit == 10 and offset == 0"
            - "the list is ordered by created_at ascending, so data[0].code == NE-WEST and data[1].code == IA-CENTRAL"
            - "the error envelope is not used on any of these calls - no data.error_id key appears"

      - name: bin_design_computed_geometry_and_structural_fields_are_populated_at_create
        claim_type: computed_fields
        grounds:
          - calculations.bin_geometry_and_capacity
          - calculations.structural_stiffener_requirement
          - entities.BinDesign.sidewall_sheet_count
          - endpoints[POST /bin-designs]
        distinguishing_aspect: "Every geometry and structural field on BinDesign is source computed and must be derived server-side at create time from the ten declared inputs; a client cannot supply them because they are absent from the endpoint's input list, and the derived ladder (courses -> sheets -> stiffeners -> gauge) must be internally consistent in one response."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (min wind 95, seismic A, seal_required false), GrainProfile CORN (density 721, k 0.42, max safe moisture 15.0), CoatingSpec G115 (max ambient moisture 18.0), engineer PE-1001, Dealer Alpha."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_courses: $.data.sheet_courses, d1_cap: $.data.capacity_m3 }
          assert:
            - "HTTP 201 with sheet_courses == 12 (ceil(9.6 / 0.8)), circumference_m == 37.699 (round(3.14159 * 12.0, 3)) and sheets_per_course == 35 (ceil(37.699 / 1.1))"
            - "sidewall_sheet_count == 420 == 12 * 35 and roof_panel_count == 42 == ceil(3.14159 * 12.0 / 0.9)"
            - "capacity_m3 == 1216.25, the rounded cylinder volume 1085.735 plus the rounded roof cone volume 130.515"
            - "grain_lateral_kpa == 28.518, moisture_factor == 1.0 (14.0 is below CORN's 15.0 safe moisture) and grain_demand_kpa == 28.518"
            - "wind_demand_kpa == 7.938 and seismic_demand_kpa == 3.395, so governing_load_case == GRAIN_LATERAL with governing_demand_kpa == 28.518"
            - "required_stiffener_count == 12 and utilization_ratio == 0.9955 against the ASD allowable of 90.0 kPa-m per stiffener"
            - "sheet_gauge_mm == 1.6, the first rung of the ladder at or above 28.518 * 0.05 == 1.4259"
            - "roof_ring_required == false because design_wind_speed_mph 105 is below the 115 mph high-wind threshold"
            - "author_engineer_id == ${eng_a_id} taken from the X-User-ID header, sealed_by_engineer_id == null, sealed_at == null, permit_ready_at == null, revision_round == 0, status == DRAFT, version == 1"
            - "seal_required == false, copied from Jurisdiction NE-WEST rather than supplied by the client"

      - name: coating_spec_corrosion_class_is_computed_across_all_four_zinc_bands
        claim_type: computed_fields
        grounds:
          - calculations.coating_corrosion_class
          - entities.CoatingSpec.corrosion_class
          - endpoints[POST /coating-specs]
        distinguishing_aspect: "corrosion_class is the only computed field on an immutable configuration entity, and all four declared enum members must be reachable: the three cut points 300, 400 and 550 are exclusive lower bounds, so a value exactly at a cut point lands in the HIGHER band. This also closes the enum - no declared class is unreachable."
        test_recipe:
          setup:
            - "Empty database. Four coating specifications are created, one per corrosion band, including two rows exactly on a cut point."
          setup_api_calls: []
          trigger:
            - call: "POST /coating-specs"
              payload: { coating_code: "G90", zinc_mass_g_per_m2: 275, coating_cost_per_kg_cents: 31, changeover_minutes: 90, max_ambient_moisture_pct: 14.0 }
              as: PlantAdmin
              captures: { cs_c2_id: $.data.id, cs_c2_class: $.data.corrosion_class }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_c3_id: $.data.id, cs_c3_class: $.data.corrosion_class }
            - call: "POST /coating-specs"
              payload: { coating_code: "G165", zinc_mass_g_per_m2: 500, coating_cost_per_kg_cents: 58, changeover_minutes: 150, max_ambient_moisture_pct: 20.0 }
              as: PlantAdmin
              captures: { cs_c4_id: $.data.id, cs_c4_class: $.data.corrosion_class }
            - call: "POST /coating-specs"
              payload: { coating_code: "G210", zinc_mass_g_per_m2: 620, coating_cost_per_kg_cents: 71, changeover_minutes: 180, max_ambient_moisture_pct: 22.0 }
              as: PlantAdmin
              captures: { cs_c5_id: $.data.id, cs_c5_class: $.data.corrosion_class }
            - call: "GET /coating-specs"
              payload: { limit: 10, offset: 0 }
              as: ProductionPlanner
              captures: { list_first_class: "$.data[0].corrosion_class" }
          assert:
            - "zinc_mass_g_per_m2 275 yields corrosion_class == C2 (below the 300 cut point)"
            - "zinc_mass_g_per_m2 350 yields corrosion_class == C3"
            - "zinc_mass_g_per_m2 500 yields corrosion_class == C4"
            - "zinc_mass_g_per_m2 620 yields corrosion_class == C5, the top open-ended band"
            - "each create returns HTTP 201 and echoes back coating_cost_per_kg_cents, changeover_minutes and max_ambient_moisture_pct unchanged"
            - "GET /coating-specs returns total_count == 4 with data[0].corrosion_class == C2, and none of the four rows carries a version key"
            - "all four declared corrosion_class enum members are produced by this single endpoint, so no member is dead"

      - name: dealer_order_defaults_and_system_fields_are_server_assigned_at_create
        claim_type: defaults
        grounds:
          - entities.DealerOrder.production_status
          - entities.DealerOrder.financial_status
          - entities.DealerOrder.installation_readiness
          - calculations.kit_bill_of_materials
          - calculations.order_price_and_credit
          - endpoints[POST /dealer-orders]
        distinguishing_aspect: "POST /dealer-orders accepts five inputs yet writes twenty-eight fields: the three state dimensions default independently, the link fields default to null, deposit_paid_cents defaults to 0, and the whole price and capacity ladder is derived. None of those defaults appear in the endpoint's input list, so a client cannot set them."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha (program_tier BASE)."
            - "BinDesign D1 (12.0 m x 9.6 m, pitch 30, wind 105, moisture 14.0, ASD) left in DRAFT - order creation does not require a sealed or reviewed design, only a design that is not RECALLED."
            - "The logical clock is at its pinned startup default 2026-08-01T00:00:00Z, which is month 8, so the only admissible order_season is OFFSEASON."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id, dlr_committed0: $.data.credit_committed_cents }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_status: $.data.status }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_id: $.data.id, o_prod: $.data.production_status, o_fin: $.data.financial_status, o_ready: $.data.installation_readiness }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: PlantAdmin
              captures: { dlr_committed1: $.data.credit_committed_cents }
          assert:
            - "HTTP 201 with production_status == DRAFT, financial_status == AWAITING_DEPOSIT and installation_readiness == UNASSIGNED - three independent dimensions, each at its own initial value"
            - "freight_load_id == null, installation_crew_id == null, allocated_freight_cents == 0, freight_sequence == null and deposit_paid_cents == 0"
            - "version == 1 and created_at == updated_at on the freshly created row"
            - "kit_subtotal_cents == 2392026, season_uplift_cents == 0 (OFFSEASON), program_discount_cents == 0 (BASE tier), net_subtotal_cents == 2392026"
            - "freight_surcharge_pct == 0.045, freight_surcharge_cents == 107641, total_cents == 2499667, required_deposit_cents == 499933 and credit_hold_cents == 1999734"
            - "kit_weight_kg == 6410.4, kit_cube_m3 == 18.45, grain_mass_kg == 876916.25"
            - "required_fan_cfm == 0 and drying_hours_estimate == 0 because aeration_package is NONE, while unload_rate_bph == 3648 == floor(1216.25 * 3) for GRAVITY"
            - "Dealer.${dlr_a_id}.credit_committed_cents is still 0 after the create - credit is committed by confirmation, not by pricing, even though credit_hold_cents is already populated"
            - "BinDesign.${d1_id}.status is still DRAFT and its version is unchanged - order creation does not mutate the design"

      - name: missing_required_input_fields_are_rejected_before_any_lookup
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /bin-designs]
          - endpoints[POST /dealers]
        distinguishing_aspect: "Priority 3 sits above every existence check, so a body missing a required field is rejected with ERR_INVALID_REQUEST even when the ids it does carry are bogus - the 400 must beat the 404. Unknown extra body fields are explicitly ignored rather than rejected."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST and Dealer Alpha exist so that the rejected requests are provably rejected for the missing field and not for a dangling reference."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /dealers"
              payload: { name: "Beta Grain", region_code: "NE-02", jurisdiction_id: "${j_ns_id}", program_tier: "BASE", staging_slots: 1, high_cube_access: false }
              as: PlantAdmin
              captures: { err_missing_limit: $.data.error_id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "00000000-0000-4000-8000-000000000009"
              captures: { err_missing_fks: $.data.error_id }
            - call: "POST /dealers"
              payload: { name: "Gamma Grain", region_code: "NE-03", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 500000, program_tier: "BASE", staging_slots: 1, high_cube_access: false, unknown_field: "ignored" }
              as: PlantAdmin
              captures: { g_id: $.data.id, g_limit: $.data.credit_limit_cents }
          assert:
            - "omitting credit_limit_cents on POST /dealers returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "omitting grain_profile_id and coating_spec_id on POST /bin-designs returns HTTP 400 with error_id ERR_INVALID_REQUEST, not 404 - priority 3 outranks the priority 5 foreign-key check, and it also outranks the priority 6 engineer-scope check even though the X-User-ID is not a stored Engineer"
            - "the third call returns HTTP 201: unknown_field is silently ignored and credit_limit_cents == 500000 is stored"
            - "no Dealer row was created by either rejected call - GET /dealers returns total_count == 2, Alpha and Gamma only"

      - name: enum_and_numeric_range_constraints_are_enforced_on_create
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.BinDesign.roof_pitch_deg
          - entities.BinDesign.design_method
          - entities.RollFormingLine.max_gauge_mm
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Three different constraint shapes on the same priority-3 rule: a closed enum of strings (design_method), a closed enum of integers (roof_pitch_deg admits only 25, 30 and 35 - a plausible 28 must fail), and a numeric range (max_gauge_mm 0.8..6.0 inclusive, so 6.0 is accepted while 6.5 is not)."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, engineer PE-1001 and Dealer Alpha exist, so every rejected bin-design body is complete apart from the constraint under test."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "WSD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { err_method: $.data.error_id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 28, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { err_pitch: $.data.error_id }
            - call: "POST /roll-forming-lines"
              payload: { line_code: "LINE_X", max_gauge_mm: 6.5 }
              as: PlantAdmin
              captures: { err_gauge_range: $.data.error_id }
            - call: "POST /roll-forming-lines"
              payload: { line_code: "LINE_MAX", max_gauge_mm: 6.0 }
              as: PlantAdmin
              captures: { line_max_id: $.data.id, line_max_gauge: $.data.max_gauge_mm }
          assert:
            - "design_method WSD returns HTTP 400 with error_id ERR_INVALID_REQUEST - only ASD and LRFD are declared"
            - "roof_pitch_deg 28 returns HTTP 400 with error_id ERR_INVALID_REQUEST even though it is a physically plausible pitch, because ROOF_RISE_RATIO is defined only for 25, 30 and 35"
            - "max_gauge_mm 6.5 returns HTTP 400 with error_id ERR_INVALID_REQUEST, above the declared 6.0 ceiling"
            - "max_gauge_mm 6.0 returns HTTP 201 with max_gauge_mm == 6.0 - the range boundary is inclusive"
            - "no BinDesign row exists after the two rejected creates; GET /bin-designs returns total_count == 0"

      - name: configuration_entities_are_immutable_and_expose_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.Jurisdiction
          - entities.GrainProfile
          - entities.CoatingSpec
          - entities.RollFormingLine
          - entities.KitLine
        distinguishing_aspect: "Five entities are declared common_fields false. The observable consequences are that they carry id and created_at but neither version nor updated_at, that §1.5 declares no mutating endpoint for them at all, and that references to them stay valid forever because there is no state to invalidate."
        test_recipe:
          setup:
            - "One row of each immutable configuration entity: Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, RollFormingLine LINE_A."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /roll-forming-lines"
              payload: { line_code: "LINE_A", max_gauge_mm: 3.0 }
              as: PlantAdmin
              captures: { line_a_id: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${j_ns_id}"
              payload: {}
              as: PlantAdmin
              captures: { j_code: $.data.code }
            - call: "GET /grain-profiles/${gp_corn_id}"
              payload: {}
              as: PlantAdmin
