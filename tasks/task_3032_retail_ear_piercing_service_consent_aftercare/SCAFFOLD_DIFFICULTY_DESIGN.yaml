              captures: { cons_id: "$.data.id" }
            - call: "POST /piercing-services/consents/${cons_id}/verify"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_id}", customer_id: "${cust_id}", piercer_id: "${p_id}", jurisdiction_id: "${jur_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T09:00:00Z", slot_end_at: "2026-09-01T09:30:00Z" }
              as: IntakeAssociate
              captures: { app_a_id: "$.data.id" }
            - call: "POST /piercing-services/appointments/${app_a_id}/confirm"
              payload: { }
              as: IntakeAssociate
          trigger:
            - call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_id}", customer_id: "${cust_id}", piercer_id: "${p_id}", jurisdiction_id: "${jur_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T09:30:00Z", slot_end_at: "2026-09-01T10:00:00Z" }
