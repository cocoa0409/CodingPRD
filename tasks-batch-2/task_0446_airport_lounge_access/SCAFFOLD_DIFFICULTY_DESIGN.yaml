          - entities.Settlement.fields.status
          - entities.Lounge.fields.settlement_balance_cents
        distinguishing_aspect: |
          Depth >= 2 chain from a different trigger (complete): Visit CHECKED_IN->COMPLETED creates a PAYABLE Settlement
