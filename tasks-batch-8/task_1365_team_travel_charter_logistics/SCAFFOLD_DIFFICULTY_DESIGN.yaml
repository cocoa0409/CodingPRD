            - "ManifestEntry.${e2}.status == CONFIRMED"
            - "ManifestEntry.${e3}.status == PENDING (rejected)"
            - "error_id == ERR_MANIFEST_FULL (exactly at boundary: count == seat_capacity == 2)"

      - name: per_diem_zero_meals_floor
        grounds:
          - calculations.per_diem_net
          - entities.PerDiemLedger.fields.net_amount_cents
        distinguishing_aspect: |
          Empty-collection/zero-quantity metric on the per-diem create endpoint
          (different metric than manifest capacity, different endpoint): when
          meals_provided_count = 0, deduction_cents must be 0 (not
          -0 or undefined), and net_amount_cents == base_amount_cents exactly.
