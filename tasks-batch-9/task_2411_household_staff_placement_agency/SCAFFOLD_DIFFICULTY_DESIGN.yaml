  - name: chain_continuity_at_seventyone_outranks_the_period_overlap_at_ninety
    grounds: validations.reference_chain_continuity (priority 71); validations.reference_period_overlap (priority
      90); entities.ReferenceCheck.prior_reference_id (self-referential)
    mechanism: The new reference names its predecessor as prior_reference_id while starting six months before that
      predecessor ended, which both breaks the chain ordering (priority 71) and overlaps the predecessor's own month
      interval (priority 90). The continuity rule is the one reported.
    naive_implementation: Run the cheap interval-overlap scan over the candidate's existing rows before following
      the prior_reference_id pointer, returning ERR_REFERENCE_PERIOD_OVERLAP.
    distinguishing_aspect: One request violates both rules and the response is ERR_REFERENCE_CHAIN_MISMATCH, which
      also tells the operator the real problem is the chain pointer rather than the dates alone.
    test_recipe:
      setup_api_calls:
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: E. Nakamura
