              as: OpsController
              captures: { leg2: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKX1", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_src: "$.data.journey_ids[0]" }
