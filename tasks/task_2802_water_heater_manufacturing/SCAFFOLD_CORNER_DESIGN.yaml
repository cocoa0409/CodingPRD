      - name: water_hardness_band_boundaries_are_inclusive_upward
        claim_type: constants_applied
        grounds:
          - calculations.water_hardness_band_factor
          - entities.HeaterUnit.fields.water_hardness_band
          - entities.HeaterUnit.fields.hardness_factor
          - endpoints[POST /mfg/heater-units/{id}/ship]
        distinguishing_aspect: >
          Five shipments walk both sides of every band edge: 3.49 is SOFT, 3.5 and 7.0 are both MODERATE,
          10.5 is HARD and 10.51 is VERY_HARD. The published boundaries are inclusive on their UPPER end, which is
          the opposite convention from the half-open windows used elsewhere in the plant, so an implementation that
          copies the `<` from the interval rules puts 7.0 in HARD and 10.5 in VERY_HARD and inflates every
          exposure-weighted failure rate downstream.
