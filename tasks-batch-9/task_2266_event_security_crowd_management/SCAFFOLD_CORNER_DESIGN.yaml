- section: state_machines
  instances:
  - name: risk_assessment_starts_in_draft_with_revision_number_one
    claim_type: initial_state
    grounds:
    - state_machines.RiskAssessment.initial_state
    - entities.RiskAssessment.fields.revision_number
    - endpoints[POST /event-security/security-events/{id}/risk-assessments]
    distinguishing_aspect: |
      RiskAssessment is the only §1.2 machine whose initial state carries a REVISION COUNTER, so its initial-state claim has to pin two things at once: the status DRAFT and revision_number 1 with the decision-trail fields (submitted_by_user_id, approved_by_user_id, rejection_reason) still null, which is what makes the later REJECT/REVISE loop observable as a counter increment rather than a status flap.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" with gross_capacity 8000 and door_count 1
