            - { call: "POST /participants", payload: { termination_case_id: "${c_ti}", full_name: "Ti Two", ssn: "121110008", mailing_address: "2 T St", account_balance_cents: 100000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_ti2: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_ti}", full_name: "Ti Three", ssn: "121110009", mailing_address: "3 T St", account_balance_cents: 100000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_ti3: "$.data.id" } }
