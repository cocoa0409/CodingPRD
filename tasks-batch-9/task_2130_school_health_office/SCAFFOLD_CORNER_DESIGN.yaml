              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Pia Andersen", grade_level: 3, date_of_birth: "2017-08-28T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: ["ASTHMA"], immunization_status: "COMPLIANT" }
