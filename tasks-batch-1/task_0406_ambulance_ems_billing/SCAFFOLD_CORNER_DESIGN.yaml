              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "RA1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
          trigger:
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "BLS" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "code == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: pcs_authority_required_for_signer_without_authority
        claim_type: peer_roles
        grounds: ["validations[priority=12]", "errors[ERR_PCS_AUTHORITY_REQUIRED]", entities.AgencyStaff.fields.pcs_signature_authority]
        distinguishing_aspect: "A ComplianceOfficer staff member with pcs_signature_authority==false calling sign-pcs returns ERR_PCS_AUTHORITY_REQUIRED (403) — the role passes RBAC but fails the business-safety authority check."
        test_recipe:
          setup: ["A transport in NECESSITY_REVIEW; a ComplianceOfficer with pcs_signature_authority false"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Pa EMS", npi: "1000000030", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "No Auth", role: "ComplianceOfficer", pcs_signature_authority: false }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01" }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "PA1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 10.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "BLS" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
          trigger:
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 403"
            - "data.error_id == ERR_PCS_AUTHORITY_REQUIRED"

  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_transport_version_on_claim_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-create-stale-transport]", "errors[ERR_STALE_TRANSPORT_VERSION]", "validations[priority=25]"]
        distinguishing_aspect: "A client reads transport.version, the primary claim is created (version advances), and a second claim-create still carrying the pre-claim version is rejected with ERR_STALE_TRANSPORT_VERSION (412). Two strictly sequential requests."
        test_recipe:
          setup: ["A DOCUMENTATION_COMPLETE Medicare-covered ALS1 transport; client captured its version BEFORE the first claim create"]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Occ EMS", npi: "1000000031", state_code: "TX" }
              as: BillingAdmin
              captures: { ag: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "D", role: "Dispatcher" }
              as: BillingAdmin
              captures: { disp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "C", role: "Coder" }
              as: BillingAdmin
              captures: { coder: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "O", role: "ComplianceOfficer", pcs_signature_authority: true }
              as: BillingAdmin
              captures: { comp: $.data.id }
            - call: "POST /staff"
              payload: { agency_id: "${ag}", full_name: "B", role: "Biller" }
              as: BillingAdmin
              captures: { biller: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Medicare", payer_type: "MEDICARE", allows_balance_billing: false }
              as: BillingAdmin
              captures: { med: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1960-01-01", coverages: [ { payer_plan_id: "${med}", policy_rank: 1 } ] }
              as: BillingAdmin
              captures: { pat: $.data.id }
            - call: "POST /transports"
              payload: { agency_id: "${ag}", patient_id: "${pat}", run_number: "OCC1", dispatch_iso: "2026-06-11T08:00:00.000Z", origin_modifier: "S", destination_modifier: "H", loaded_miles: 12.0, emergency_indicator: true }
              as: Dispatcher
              as_user_id: "${disp}"
              captures: { t: $.data.id }
            - call: "POST /transports/${t}/code"
              payload: { level_of_service: "ALS1" }
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/attest-necessity"
              payload: {}
              as: Coder
              as_user_id: "${coder}"
            - call: "POST /transports/${t}/sign-pcs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${comp}"
            - call: "GET /transports/${t}"
              payload: {}
              as: Biller
              as_user_id: "${biller}"
              captures: { t_v: $.data.version }
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${med}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { claim1: $.data.id }
          trigger:
            - call: "POST /transports/${t}/claims"
              payload: { payer_plan_id: "${med}", expected_transport_version: "${t_v}" }
              as: Biller
              as_user_id: "${biller}"
              captures: { err: $.data.error_id }
          assert:
            - "code == 412"
            - "data.error_id == ERR_STALE_TRANSPORT_VERSION"

      - name: occ_version_increments_on_claim_create
        claim_type: optimistic_concurrency
        grounds: [entities.Transport.fields.version, endpoints]
        distinguishing_aspect: "Transport.version strictly increases after a successful claim create; the value observed before (v) differs from after (v+1)."
        excluded_because:
          difficulty_instance: cross_cutting / occ_stale_transport_version_on_claim_create
          rationale: "The version-increment side effect is the mechanism the stale-version corner above depends on; it is asserted implicitly there (the second request carrying the pre-create version is rejected because the version advanced)."

      - name: derived_total_billed_reconciled_on_coding
        claim_type: derived_field_reconciliation
        grounds: [calculations.reconcile_transport_ledger, entities.Transport.fields.total_billed_cents]
        distinguishing_aspect: "Transport.total_billed_cents is 0 at import and recomputes to 101000 after coding (sum of the two synthesized charges) — derived-field reconciliation after a create-style mutation."
        excluded_because:
          difficulty_instance: combinatorial_formula / mileage_round_per_tier_then_sum_rural
          rationale: "total_billed_cents reconciliation after coding is asserted (== 94875) by the named §1.8 mileage instance and (== 144000) by the §1.9 SCT calculation corner."

  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "An error response carries response_type==error and data.error_id/data.message per the fixed §1.0 envelope."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_creation_blocked_by_inactive_payer_plan
          rationale: "The error envelope shape (response_type==error, data.error_id) is asserted by every negative §1.8/§1.9 instance that captures $.data.error_id; the named instance is one such carrier."
