        grounds:
          - "state_machines.AccuracyClaim.FILED_to_UNDER_REVIEW"
          - "errors[ERR_GUARANTEE_NOT_ENROLLED]"
        distinguishing_aspect: "Claims can be FILED by a non-enrolled account, but start-review is gated on accuracy_guarantee_enrolled == true; the flag is conditional on the account, not the claim."
        test_recipe:
