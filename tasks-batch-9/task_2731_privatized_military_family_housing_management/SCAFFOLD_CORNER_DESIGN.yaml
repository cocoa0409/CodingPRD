            - "Logical clock at 2026-09-01T09:00:00Z."
            - "One installation (Fort Cavazos Family Housing, ARMY, TX-FTC, bill_of_rights_version 2026.1) with the Installation defaults."
            - "One ReinvestmentAccount for fiscal_year 2026 with opening_balance_cents 5000000 and occupancy_basis UNIT_DAY_WEIGHTED, captured as ${acct_id}; contributions_cents 0, expenditures_cents 0, closing_balance_cents 5000000."
            - "No metrics run and no allotment run have been made."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /reinvestment-accounts"
              payload: { installation_id: "${inst_id}", fiscal_year: 2026, opening_balance_cents: 5000000, occupancy_basis: "UNIT_DAY_WEIGHTED" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "GET /reinvestment-accounts/${acct_id}"
              payload: {}
              as: PropertyManager
              captures: { ac_ver: "$.data.version", ac_close: "$.data.closing_balance_cents" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${ac_ver} - 1", amount_cents: 100000, purpose: "Playground resurfacing" }
              as: PropertyManager
              captures: { e_stale3: "$.data.error_id" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${ac_ver}", amount_cents: 100000, purpose: "Playground resurfacing" }
              as: PropertyManager
              captures: { d_ver: "$.data.version", d_exp: "$.data.expenditures_cents", d_close: "$.data.closing_balance_cents" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${ac_ver}", amount_cents: 100000, purpose: "Playground resurfacing" }
              as: PropertyManager
              captures: { e_replay3: "$.data.error_id" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${ac_ver} - 1", amount_cents: 99000000, purpose: "Whole-neighbourhood rebuild" }
              as: PropertyManager
              captures: { e_order: "$.data.error_id" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${d_ver}", amount_cents: 100000, purpose: "Playground fencing" }
              as: PlatformAdmin
              captures: { f_ver: "$.data.version", f_exp: "$.data.expenditures_cents", f_close: "$.data.closing_balance_cents" }
          assert:
            - "${e_stale3} == ERR_STALE_ACCOUNT_VERSION with HTTP 412 and ${ac_close} == 5000000 - the refused draw moved no money."
            - "${d_ver} == ${ac_ver} + 1, ${d_exp} == 100000 and ${d_close} == 4900000 - the accepted draw advanced the version once and recomputed closing_balance_cents = 5000000 + 0 - 100000."
            - "${e_replay3} == ERR_STALE_ACCOUNT_VERSION with HTTP 412 - the replayed token is refused, which is what stops the same capital draw from being taken twice; had the guard been payload-shaped the identical body would have drawn 100000 again."
            - "${e_order} == ERR_STALE_ACCOUNT_VERSION and NOT ERR_REINVESTMENT_BALANCE_INSUFFICIENT - the call is BOTH stale and wildly overdrawn, and rung P18 outranks rung P46, so the version failure is reported and the balance is never consulted."
            - "${f_ver} == ${ac_ver} + 2, ${f_exp} == 200000 and ${f_close} == 4800000 - a second draw from a fresh read succeeds and accumulates, so expenditures are legitimately repeatable while the balance holds."

      - name: the_ledger_read_pages_and_filters_the_same_three_rows_seven_ways
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/leases/{id}/allotment-transactions
          - response_envelope.pagination_fields
