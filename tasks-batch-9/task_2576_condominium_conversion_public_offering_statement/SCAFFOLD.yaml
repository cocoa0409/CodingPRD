      discoverable only via GET /public-offering-statements/{id}/sections."
    roles: [ConverterSponsor]
    code: 201
    input: [declaration_package_id, reserve_study_id, initial_budget_id]
    output: PublicOfferingStatement
    side_effects: ["status := DRAFT", "amendment_count := 0", "complete_section_count := 0",
      "nine POSSection rows created, one per statutory section_code, each in content_status
        DRAFTED", "version := 1"]
  - method: GET
    path: "/conversion-projects/{id}/public-offering-statements"
    description: "Sub-resource list giving FK reverse reachability for
      PublicOfferingStatement.conversion_project_id, filterable by status, ordered by
      created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PublicOfferingStatement[]
    side_effects: []
  - method: GET
    path: "/public-offering-statements"
    description: "Filtered list giving FK reverse reachability for
      PublicOfferingStatement.declaration_package_id, reserve_study_id and initial_budget_id,
      ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: ["conversion_project_id?", "declaration_package_id?", "reserve_study_id?",
            "initial_budget_id?", "status?", "limit?", "offset?"]
    output: PublicOfferingStatement[]
    side_effects: []
  - method: GET
    path: "/public-offering-statements/{id}"
    description: "Returns one public offering statement with status, amendment_count,
      complete_section_count, effective_at, last_material_amendment_at and version."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: []
    output: PublicOfferingStatement
    side_effects: []

  # ---------------- POSSection ----------------
  - method: GET
    path: "/public-offering-statements/{id}/sections"
    description: "Sub-resource list giving FK reverse reachability for
      POSSection.public_offering_statement_id - the only discovery channel for the nine sections
      synthesized at statement creation. Filterable by content_status and section_code, ordered by
      created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: ["content_status?", "section_code?", "limit?", "offset?"]
    output: POSSection[]
    side_effects: []
  - method: GET
    path: "/public-offering-statements/{id}/sections/{section_code}"
    description: "Returns one statutory section of the statement by its section_code, with
      body_ref, word_count, content_status, attested_by_user_id and last_attested_at."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: []
    output: POSSection
    side_effects: []
  - method: PUT
    path: "/public-offering-statements/{id}/sections/{section_code}"
    description: "Writes a statutory section's content. content_status becomes COMPLETE when
      body_ref is present, word_count >= the section's pinned minimum and attested_by_user_id is
      supplied; it becomes DRAFTED when body_ref is present but attestation is absent. body_ref is a
      required non-empty input, so content_status only ever holds one of its two declared members.
      Bubbles the statement DRAFT -> SECTIONS_COMPLETE once all nine
      sections read COMPLETE, and bubbles it back SECTIONS_COMPLETE -> DRAFT when a section leaves
      COMPLETE."
    roles: [ConverterSponsor]
    code: 200
    input: [body_ref, word_count, "attested_by_user_id?"]
    output: POSSection
    side_effects: ["content_status recomputed", "last_attested_at := clock when attested",
      "PublicOfferingStatement.complete_section_count recomputed",
      "PublicOfferingStatement.status DRAFT -> SECTIONS_COMPLETE when complete_section_count
        reaches 9", "PublicOfferingStatement.status SECTIONS_COMPLETE -> DRAFT when
        complete_section_count drops below 9", "version += 1"]
  - method: POST
    path: "/public-offering-statements/{id}/effectiveness"
    description: "Registers the statement as EFFECTIVE from SECTIONS_COMPLETE or AMENDMENT_FILED.
      Requires all nine sections COMPLETE, a RECORDED declaration package and an ADOPTED initial
      budget with an ADOPTED reserve study; drives the project REGISTRATION -> PRESALE."
    roles: [StateRegulator]
    code: 200
    input: []
    output: PublicOfferingStatement
    side_effects: ["status := EFFECTIVE", "effective_at := clock",
      "ConversionProject.status REGISTRATION -> PRESALE",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/public-offering-statements/{id}/amendments"
    description: "Files an amendment against an EFFECTIVE or AMENDMENT_REQUIRED statement. With
      material_change == true this is hop 1 of the four-hop material amendment cascade: the
      statement re-enters AMENDMENT_FILED, every SIGNED or HARD purchase agreement of the project
      has its rescission right revived and its deadline restarted, batches holding those agreements
      fall back to THRESHOLD_SHORT, and the project drops CLOSINGS -> PRESALE. With
      material_change == false only amendment_count moves and no agreement is disturbed."
    roles: [ConverterSponsor]
    code: 201
    input: [material_change, amendment_summary]
    output: PublicOfferingStatement
    side_effects: ["amendment_count += 1", "status := AMENDMENT_FILED",
      "material_change == true: last_material_amendment_at := clock",
      "material_change == true: PurchaseAgreement.contract_status HARD -> SIGNED for the project's
        HARD agreements and rescission_deadline_at restarted per
        calculations.rescission_deadline with rescission_restart_count += 1",
      "material_change == true: ClosingBatch.status THRESHOLD_MET or RELEASED -> THRESHOLD_SHORT",
      "material_change == true: ConversionProject.status CLOSINGS -> PRESALE",
      "recomputes ConversionProject.posture", "version += 1"]

  # ---------------- TenantHousehold ----------------
  - method: POST
    path: "/conversion-projects/{id}/tenant-households"
    description: "Registers an existing tenant household, optionally linked to the unit it occupies,
      in notice_status PENDING, rofr_status NOT_OFFERED and relocation_status NOT_ELIGIBLE. Reverse
      reachability for TenantHousehold.conversion_project_id is
      GET /conversion-projects/{id}/tenant-households."
    roles: [ConverterSponsor]
    code: 201
    input: [household_label, tenancy_start_date, monthly_rent_cents, "protected_class?",
            "occupied_unit_id?"]
    output: TenantHousehold
    side_effects: ["notice_status := PENDING", "rofr_status := NOT_OFFERED",
      "relocation_status := NOT_ELIGIBLE", "relocation_assistance_cents := 0", "version := 1"]
  - method: GET
    path: "/conversion-projects/{id}/tenant-households"
    description: "Sub-resource list giving FK reverse reachability for
      TenantHousehold.conversion_project_id, filterable by notice_status, rofr_status,
      relocation_status and protected_class, ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, PlatformAdmin]
    code: 200
    input: ["notice_status?", "rofr_status?", "relocation_status?", "protected_class?", "limit?", "offset?"]
    output: TenantHousehold[]
    side_effects: []
  - method: GET
    path: "/tenant-households"
    description: "Filtered list giving FK reverse reachability for
      TenantHousehold.occupied_unit_id (and conversion_project_id), ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, PlatformAdmin, TenantOccupant]
    code: 200
    input: ["conversion_project_id?", "occupied_unit_id?", "notice_status?", "rofr_status?",
            "relocation_status?", "limit?", "offset?"]
    output: TenantHousehold[]
    side_effects: []
  - method: GET
    path: "/tenant-households/{id}"
    description: "Returns one tenant household with all three state dimensions, notice_period_days,
      vacate_deadline_at, rofr_expires_at and the relocation money ledger."
    roles: [ConverterSponsor, StateRegulator, PlatformAdmin, TenantOccupant]
    code: 200
    input: []
    output: TenantHousehold
    side_effects: []
  - method: PATCH
    path: "/tenant-households/{id}"
    description: "Adjustment endpoint for the household's pre-notice facts - monthly_rent_cents,
      tenancy_start_date, protected_class and occupied_unit_id - while notice_status is PENDING.
      Editing tenancy_start_date or protected_class is how a test steers which notice tier and
      relocation multiplier will be selected."
    roles: [ConverterSponsor]
    code: 200
    input: ["monthly_rent_cents?", "tenancy_start_date?", "protected_class?", "occupied_unit_id?"]
    output: TenantHousehold
    side_effects: ["version += 1"]
  - method: POST
    path: "/tenant-households/{id}/notices"
    description: "Serves the statutory conversion notice. Runs
      calculations.tenant_notice_and_relocation to pin notice_period_days, vacate_deadline_at,
      rofr_expires_at and relocation_assistance_cents, then advances all three dimensions at once:
      notice_status PENDING -> NOTICE_SERVED, rofr_status NOT_OFFERED -> OFFERED and
      relocation_status NOT_ELIGIBLE -> ACCRUED."
    roles: [ConverterSponsor]
    code: 201
    input: []
    output: TenantHousehold
    side_effects: ["notice_served_at := clock",
      "notice_period_days, vacate_deadline_at, rofr_expires_at and relocation_assistance_cents
        computed", "notice_status := NOTICE_SERVED", "rofr_status := OFFERED",
      "relocation_status := ACCRUED",
      "ConversionProject.relocation_obligation_accrued_cents += relocation_assistance_cents",
      "ConversionProject.relocation_outstanding_cents recomputed",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/tenant-households/{id}/rofr-responses"
    description: "Records the tenant's right of first refusal answer. response == EXERCISE moves
      rofr_status OFFERED -> EXERCISED and reverses any relocation obligation already accrued or
      paid; response == WAIVE moves OFFERED -> WAIVED and leaves the relocation ledger untouched.
      Admissible only while the logical clock is at or before rofr_expires_at, and only when the
      household is linked to an INCLUDED unit of the same project."
    roles: [TenantOccupant, ConverterSponsor]
    code: 201
    input: [response]
    output: TenantHousehold
    side_effects: ["EXERCISE: rofr_status := EXERCISED, notice_status := WITHDRAWN,
        relocation_status ACCRUED -> CANCELLED or PAID -> REVERSED",
      "EXERCISE: ConversionProject.relocation_obligation_accrued_cents reduced, and
        relocation_reversed_cents increased when the obligation had already been paid",
      "WAIVE: rofr_status := WAIVED", "ConversionProject.relocation_outstanding_cents recomputed",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/tenant-households/{id}/relocation-disbursements"
    description: "Pays the statutory relocation assistance: relocation_status ACCRUED -> PAID. The
      requested amount_cents must equal TenantHousehold.relocation_assistance_cents exactly, and
      the household's notice_status must be NOTICE_SERVED or VACATE_DUE."
    roles: [EscrowAgent]
    code: 201
    input: [amount_cents]
    output: TenantHousehold
    side_effects: ["relocation_status := PAID", "TenantHousehold.relocation_paid_cents := amount",
      "ConversionProject.relocation_paid_cents += amount",
      "ConversionProject.relocation_outstanding_cents recomputed", "version += 1"]
  - method: POST
    path: "/tenant-households/{id}/occupancy-outcomes"
    description: "Records how the tenancy actually ended once the logical clock has reached
      vacate_deadline_at: outcome == VACATED moves notice_status VACATE_DUE -> VACATED, while
      outcome == HOLDOVER moves VACATE_DUE -> HOLDOVER and is one of the RESTRICTED posture
      triggers."
    roles: [ConverterSponsor]
    code: 201
    input: [outcome]
    output: TenantHousehold
    side_effects: ["notice_status := VACATED or HOLDOVER",
      "recomputes ConversionProject.posture", "version += 1"]

  # ---------------- ReserveStudy ----------------
  - method: POST
    path: "/conversion-projects/{id}/reserve-studies"
    description: "Runs calculations.reserve_funding_requirement under the requested method over the
      VERIFIED components of the referenced ACCEPTED engineering report, producing
      fully_funded_balance_cents, recommended_annual_contribution_cents, percent_funded_bp and
      funding_status. Requires suitability_gate PASSED and at least one VERIFIED component."
    roles: [ConverterSponsor, LicensedEngineer]
    code: 201
    input: [engineering_report_id, method, "opening_reserve_balance_cents?"]
    output: ReserveStudy
    side_effects: ["fully_funded_balance_cents, recommended_annual_contribution_cents,
        percent_funded_bp and funding_status computed under the selected method",
      "adoption_status := PROPOSED", "version := 1"]
  - method: GET
    path: "/conversion-projects/{id}/reserve-studies"
    description: "Sub-resource list giving FK reverse reachability for
      ReserveStudy.conversion_project_id, filterable by method, funding_status and adoption_status,
      ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, LicensedEngineer, PlatformAdmin]
    code: 200
    input: ["method?", "funding_status?", "adoption_status?", "limit?", "offset?"]
    output: ReserveStudy[]
    side_effects: []
  - method: GET
    path: "/reserve-studies"
    description: "Filtered list giving FK reverse reachability for
      ReserveStudy.engineering_report_id (and conversion_project_id), so both funding methods can be
      compared against the same report. Ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, LicensedEngineer, PlatformAdmin]
    code: 200
    input: ["conversion_project_id?", "engineering_report_id?", "method?", "funding_status?",
            "adoption_status?", "limit?", "offset?"]
    output: ReserveStudy[]
    side_effects: []
  - method: GET
    path: "/reserve-studies/{id}"
    description: "Returns one reserve study with its method, funded percentage in basis points,
      funding_status, adoption_status and version."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, LicensedEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ReserveStudy
    side_effects: []
  - method: PATCH
    path: "/reserve-studies/{id}"
    description: "Adjustment endpoint for opening_reserve_balance_cents while adoption_status is
      PROPOSED; re-derives percent_funded_bp and funding_status, which is how a test crosses the
      7000 basis point ADEQUATE boundary in either direction."
    roles: [ConverterSponsor]
    code: 200
    input: [opening_reserve_balance_cents]
    output: ReserveStudy
    side_effects: ["percent_funded_bp and funding_status recomputed", "version += 1"]

  # ---------------- InitialBudget ----------------
  - method: POST
    path: "/conversion-projects/{id}/initial-budgets"
    description: "Creates the first-year budget and runs the seven pinned steps of
      calculations.initial_budget_developer_deficit: base expense, single-pass management fee tier
      selection with no re-tiering, total expense, assessment income over the INCLUDED unit set,
      and the developer deficit funding disclosure. OCC guarded on the parent ConversionProject via
      expected_conversion_project_version."
    roles: [ConverterSponsor]
    code: 201
    input: [reserve_study_id, fiscal_year_label, annual_operating_expense_cents,
            expected_conversion_project_version]
    output: InitialBudget
    side_effects: ["reserve_contribution_cents copied from the study",
      "base_expense_cents, management_fee_bp, management_fee_cents and
        total_annual_expense_cents computed",
      "calculations.unit_assessment_allocation re-run, writing Unit.unit_annual_assessment_cents
        and Unit.unit_monthly_assessment_cents",
      "assessment_income_cents, developer_deficit_funding_cents and developer_subsidy_flag
        computed", "status := DRAFT", "ConversionProject.version += 1"]
  - method: GET
    path: "/conversion-projects/{id}/initial-budgets"
    description: "Sub-resource list giving FK reverse reachability for
      InitialBudget.conversion_project_id, filterable by status and developer_subsidy_flag, ordered
      by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: ["status?", "developer_subsidy_flag?", "limit?", "offset?"]
    output: InitialBudget[]
    side_effects: []
  - method: GET
    path: "/initial-budgets"
    description: "Filtered list giving FK reverse reachability for InitialBudget.reserve_study_id
      (and conversion_project_id), ordered by created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: ["conversion_project_id?", "reserve_study_id?", "status?", "developer_subsidy_flag?", "limit?",
            "offset?"]
    output: InitialBudget[]
    side_effects: []
  - method: GET
    path: "/initial-budgets/{id}"
    description: "Returns one initial budget with every step of the deficit computation exposed:
      base_expense_cents, management_fee_bp, management_fee_cents, total_annual_expense_cents,
      assessment_income_cents, developer_deficit_funding_cents and developer_subsidy_flag."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: []
    output: InitialBudget
    side_effects: []
  - method: PATCH
    path: "/initial-budgets/{id}"
    description: "Adjustment endpoint for annual_operating_expense_cents while status is DRAFT. The
      whole seven-step chain is re-derived from scratch, including a fresh single-pass tier
      selection, so a test can walk the 12000000 and 30000000 cent tier boundaries."
    roles: [ConverterSponsor]
    code: 200
    input: [annual_operating_expense_cents]
    output: InitialBudget
    side_effects: ["all computed budget fields re-derived under
        calculations.initial_budget_developer_deficit", "version += 1"]
  - method: POST
    path: "/initial-budgets/{id}/adoption"
    description: "Adopts the budget: status DRAFT -> ADOPTED. Supersedes any previously ADOPTED
      budget of the project and marks the referenced reserve study ADOPTED, which is the
      precondition for recording the declaration and for statement effectiveness."
    roles: [ConverterSponsor, StateRegulator]
    code: 200
    input: []
    output: InitialBudget
    side_effects: ["status := ADOPTED", "adopted_at := clock",
      "prior ADOPTED sibling budget := SUPERSEDED",
      "ReserveStudy.adoption_status := ADOPTED for the referenced study and SUPERSEDED for the
        study of the superseded budget", "version += 1"]

  # ---------------- ClosingBatch ----------------
  - method: POST
    path: "/conversion-projects/{id}/closing-batches"
    description: "Creates a closing batch in status DRAFT holding closings until its minimum
      thresholds are met. Enforces the HALF-OPEN window rule: [window_start_at, window_end_at) must
      not overlap any sibling batch window in a non-terminal status, adjacency is allowed, and at
      most one batch may occupy any instant. Reverse reachability for
      ClosingBatch.conversion_project_id is GET /conversion-projects/{id}/closing-batches."
    roles: [ConverterSponsor]
    code: 201
    input: [batch_sequence_no, window_start_at, window_end_at, min_presale_threshold_pct,
            min_absolute_unit_count]
    output: ClosingBatch
    side_effects: ["status := DRAFT", "assigned_agreement_count := 0",
      "qualifying_agreement_count := 0", "presale_pct := 0.00", "version := 1"]
  - method: GET
    path: "/conversion-projects/{id}/closing-batches"
    description: "Sub-resource list giving FK reverse reachability for
      ClosingBatch.conversion_project_id, filterable by status, ordered by created_at ASC."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClosingBatch[]
    side_effects: []
  - method: GET
    path: "/closing-batches/{id}"
    description: "Returns one closing batch with its window, both thresholds,
      assigned_agreement_count, qualifying_agreement_count, presale_pct, status, released_at,
      last_evaluated_at and version."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, PlatformAdmin]
    code: 200
    input: []
    output: ClosingBatch
    side_effects: []
  - method: PATCH
    path: "/closing-batches/{id}"
    description: "Adjustment endpoint for the batch window and both minimum thresholds while status
      is DRAFT, OPEN_FOR_ASSIGNMENT, THRESHOLD_SHORT or THRESHOLD_MET. Window edits are re-checked
      against the same half-open overlap rule; threshold edits do not by themselves re-evaluate the
      batch, which requires POST /closing-batches/{id}/threshold-evaluations."
    roles: [ConverterSponsor]
    code: 200
    input: ["window_start_at?", "window_end_at?", "min_presale_threshold_pct?",
            "min_absolute_unit_count?"]
    output: ClosingBatch
    side_effects: ["version += 1"]
  - method: POST
    path: "/closing-batches/{id}/agreement-assignments"
    description: "Assigns an unassigned purchase agreement to this batch, moving the batch
      DRAFT -> OPEN_FOR_ASSIGNMENT on the first assignment. OCC guarded on the parent ClosingBatch
      via expected_closing_batch_version."
    roles: [ConverterSponsor, EscrowAgent]
    code: 201
    input: [purchase_agreement_id, expected_closing_batch_version]
    output: ClosingBatch
    side_effects: ["PurchaseAgreement.closing_batch_id := this batch",
      "status DRAFT -> OPEN_FOR_ASSIGNMENT on the first assignment",
      "assigned_agreement_count and qualifying_agreement_count recomputed", "version += 1"]
  - method: GET
    path: "/closing-batches/{id}/agreements"
    description: "Sub-resource list giving FK reverse reachability for
      PurchaseAgreement.closing_batch_id, filterable by contract_status and escrow_status, ordered
      by created_at ASC."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, PlatformAdmin]
    code: 200
    input: ["contract_status?", "escrow_status?", "limit?", "offset?"]
    output: PurchaseAgreement[]
    side_effects: []
  - method: DELETE
    path: "/closing-batches/{id}/agreement-assignments/{purchase_agreement_id}"
    description: "Unassigns an agreement from a batch that has not been released, clearing
      PurchaseAgreement.closing_batch_id and re-deriving the batch counters. This is how a test
      drives THRESHOLD_MET back to THRESHOLD_SHORT without rescinding anything."
    roles: [ConverterSponsor]
    code: 200
    input: []
    output: ClosingBatch
    side_effects: ["PurchaseAgreement.closing_batch_id := null",
      "assigned_agreement_count and qualifying_agreement_count recomputed",
      "status THRESHOLD_MET -> THRESHOLD_SHORT when the batch no longer qualifies", "version += 1"]
  - method: POST
    path: "/closing-batches/{id}/threshold-evaluations"
    description: "Runs calculations.presale_threshold_evaluation for the batch. Both the percentage
      test (inclusive at the threshold) and the absolute unit-count test must pass for the batch to
      reach THRESHOLD_MET; failing either sends it to THRESHOLD_SHORT. Requires at least one
      INCLUDED unit so the percentage has a non-zero denominator."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator]
    code: 200
    input: []
    output: ClosingBatch
    side_effects: ["qualifying_agreement_count and presale_pct recomputed",
      "status := THRESHOLD_MET or THRESHOLD_SHORT", "last_evaluated_at := clock",
      "ConversionProject.presale_sold_pct recomputed", "version += 1"]
  - method: POST
    path: "/closing-batches/{id}/release"
    description: "Releases the batch for closing: THRESHOLD_MET -> RELEASED, which unlocks
      POST /purchase-agreements/{id}/closing for its assigned agreements. Requires posture OPEN, a
      RECORDED declaration, a met threshold, and every assigned agreement in contract_status HARD
      or CLOSED; drives the project PRESALE -> CLOSINGS."
    roles: [EscrowAgent]
    code: 200
    input: []
    output: ClosingBatch
    side_effects: ["status := RELEASED", "released_at := clock",
      "ConversionProject.status PRESALE -> CLOSINGS",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: GET
    path: "/closing-batches/{id}/threshold-summary"
    description: "Computed read returning the batch's presale_pct, qualifying_agreement_count,
      assigned_agreement_count, both minimum thresholds and a boolean met flag, without mutating
      the batch status - so a test can inspect the inclusive-at-threshold boundary before
      committing to an evaluation."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, PlatformAdmin]
    code: 200
    input: []
    output: ClosingBatch
    side_effects: []

  # ---------------- PurchaseAgreement ----------------
  - method: POST
    path: "/units/{id}/purchase-agreements"
    description: "Signs a purchase agreement on an INCLUDED unit while the project has an EFFECTIVE
      public offering statement, in contract_status SIGNED and escrow_status PENDING. OCC guarded on
      the parent Unit via expected_unit_version. Reverse reachability for
      PurchaseAgreement.unit_id is GET /units/{id}/purchase-agreements."
    roles: [ConverterSponsor, Purchaser]
    code: 201
    input: [purchaser_name, purchaser_tax_id, purchaser_type, price_cents, deposit_cents,
            "tenant_household_id?", expected_unit_version]
    output: PurchaseAgreement
    side_effects: ["contract_status := SIGNED", "escrow_status := PENDING", "signed_at := clock",
      "public_offering_statement_id := the project's EFFECTIVE statement",
      "Unit.sale_status UNSOLD -> UNDER_CONTRACT",
      "ConversionProject warrantability ratios recomputed under CONTRACT_BASIS",
      "Unit.version += 1"]
  - method: GET
    path: "/units/{id}/purchase-agreements"
    description: "Sub-resource list giving FK reverse reachability for PurchaseAgreement.unit_id,
      filterable by contract_status and escrow_status, ordered by created_at ASC."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, Purchaser,
            PlatformAdmin]
    code: 200
    input: ["contract_status?", "escrow_status?", "limit?", "offset?"]
    output: PurchaseAgreement[]
    side_effects: []
  - method: GET
    path: "/purchase-agreements"
    description: "Filtered list giving FK reverse reachability for
      PurchaseAgreement.conversion_project_id, public_offering_statement_id, closing_batch_id and
      tenant_household_id, ordered by created_at ASC."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, Purchaser,
            PlatformAdmin]
    code: 200
    input: ["conversion_project_id?", "unit_id?", "public_offering_statement_id?", "closing_batch_id?",
            "tenant_household_id?", "purchaser_type?", "contract_status?", "escrow_status?", "limit?",
            "offset?"]
    output: PurchaseAgreement[]
    side_effects: []
  - method: GET
    path: "/purchase-agreements/{id}"
    description: "Returns one purchase agreement with purchaser_type, price_cents, deposit_cents,
      pos_delivered_at, rescission_deadline_at, rescission_restart_count, both state dimensions,
      closed_at and version."
    roles: [ConverterSponsor, EscrowAgent, StateRegulator, LenderUnderwriter, Purchaser,
            PlatformAdmin]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: []
  - method: PATCH
    path: "/purchase-agreements/{id}"
    description: "Adjustment endpoint for purchaser_name, purchaser_tax_id, purchaser_type,
      price_cents and deposit_cents while contract_status is SIGNED and escrow_status is PENDING.
      Changing purchaser_type is how a test switches which variant of
      calculations.rescission_deadline applies and how investor concentration is steered across the
      warrantability thresholds; it does not by itself restart an already-computed deadline."
    roles: [ConverterSponsor]
    code: 200
    input: ["purchaser_name?", "purchaser_tax_id?", "purchaser_type?", "price_cents?", "deposit_cents?"]
    output: PurchaseAgreement
    side_effects: ["ConversionProject warrantability ratios recomputed under CONTRACT_BASIS",
      "version += 1"]
  - method: POST
    path: "/purchase-agreements/{id}/pos-deliveries"
    description: "Records delivery of the effective public offering statement to the purchaser and
      starts the pre-sale rescission period by running calculations.rescission_deadline under the
      variant selected by purchaser_type (OWNER_OCCUPANT_WINDOW 15 days, INVESTOR_WINDOW 7 days)."
    roles: [ConverterSponsor]
    code: 201
    input: []
    output: PurchaseAgreement
    side_effects: ["pos_delivered_at := clock",
      "rescission_deadline_at computed per the purchaser_type variant", "version += 1"]
  - method: POST
    path: "/purchase-agreements/{id}/escrow-deposits"
    description: "Funds the earnest money deposit into escrow: escrow_status PENDING -> FUNDED. The
      requested amount_cents must equal deposit_cents exactly."
    roles: [EscrowAgent]
    code: 201
    input: [amount_cents]
    output: PurchaseAgreement
    side_effects: ["escrow_status := FUNDED",
      "ConversionProject.escrow_deposits_received_cents += amount",
      "ConversionProject.escrow_balance_cents += amount", "version += 1"]
  - method: POST
    path: "/purchase-agreements/{id}/hardening"
    description: "Hardens the contract once the rescission period has closed: contract_status
      SIGNED -> HARD. Admissible only when the logical clock is at or after
      rescission_deadline_at (inclusive), the statement has been delivered, and escrow is FUNDED."
    roles: [ConverterSponsor, EscrowAgent]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["contract_status := HARD",
      "ClosingBatch.qualifying_agreement_count recomputed for the assigned batch",
      "ConversionProject warrantability ratios recomputed under CONTRACT_BASIS", "version += 1"]
  - method: POST
    path: "/purchase-agreements/{id}/rescission"
    description: "Exercises the purchaser's statutory rescission right strictly before
      rescission_deadline_at: contract_status SIGNED -> RESCINDED with a full escrow refund. This is
      hop 1 of the rescission cascade - the unit returns to UNSOLD, the batch falls back to
      THRESHOLD_SHORT, and a RELEASED batch losing its threshold drags the project
      CLOSINGS -> PRESALE."
    roles: [Purchaser, ConverterSponsor]
    code: 200
    input: ["rescission_reason?"]
    output: PurchaseAgreement
    side_effects: ["contract_status := RESCINDED", "escrow_status FUNDED -> REFUNDED",
      "ConversionProject.escrow_balance_cents decreased and escrow_refunded_cents increased",
      "Unit.sale_status UNDER_CONTRACT -> UNSOLD",
      "ClosingBatch.status THRESHOLD_MET or RELEASED -> THRESHOLD_SHORT",
      "ConversionProject.status CLOSINGS -> PRESALE when the released batch lost its threshold",
      "ConversionProject warrantability ratios recomputed under CONTRACT_BASIS",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/purchase-agreements/{id}/closing"
    description: "Closes the sale out of a RELEASED batch: contract_status HARD -> CLOSED and
      escrow_status FUNDED -> DISBURSED. When every qualifying agreement of the project has closed
      the project bubbles CLOSINGS -> COMPLETED and its batches settle."
    roles: [EscrowAgent]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["contract_status := CLOSED", "escrow_status := DISBURSED",
      "closed_at := clock", "Unit.sale_status UNDER_CONTRACT -> SOLD",
      "ConversionProject.escrow_balance_cents decreased and escrow_disbursed_cents increased",
      "ConversionProject warrantability ratios recomputed under CLOSED_BASIS",
      "ClosingBatch.status RELEASED -> SETTLED and ConversionProject.status
        CLOSINGS -> COMPLETED once no HARD agreement remains",
      "recomputes ConversionProject.posture", "version += 1"]

  # ---------------- WarrantyClaim ----------------
  - method: POST
    path: "/conversion-projects/{id}/warranty-claims"
    description: "Files a common-element warranty claim against a major component, in status
      SUBMITTED. Runs calculations.warranty_charge_and_window to pin warranty_expires_at from
      ConversionProject.warranty_start_at under the STRUCTURAL_WINDOW (60 months) or
      NONSTRUCTURAL_WINDOW (24 months) variant selected by MajorComponent.is_structural. Requires a
      RECORDED declaration. Reverse reachability for WarrantyClaim.conversion_project_id is
      GET /conversion-projects/{id}/warranty-claims."
    roles: [ConverterSponsor, Purchaser]
    code: 201
    input: [major_component_id, defect_description, claimed_cost_cents, "reported_by_unit_id?"]
    output: WarrantyClaim
    side_effects: ["status := SUBMITTED", "reported_at := clock",
      "warranty_expires_at computed under the variant selected by is_structural",
      "accrued_charge_cents := 0", "reopen_count := 0", "version := 1"]
  - method: GET
    path: "/conversion-projects/{id}/warranty-claims"
    description: "Sub-resource list giving FK reverse reachability for
      WarrantyClaim.conversion_project_id, filterable by status and triage_outcome, ordered by
      created_at ASC."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, PlatformAdmin]
    code: 200
    input: ["status?", "triage_outcome?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims"
    description: "Filtered list giving FK reverse reachability for WarrantyClaim.major_component_id
      and reported_by_unit_id (and conversion_project_id), ordered by created_at ASC. Filtering by
      major_component_id is how a test inspects the closed remediation windows that the next
      schedule request must clear."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, LicensedEngineer,
            PlatformAdmin]
    code: 200
    input: ["conversion_project_id?", "major_component_id?", "reported_by_unit_id?", "status?",
            "triage_outcome?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Returns one warranty claim with status, triage_outcome, accrued_charge_cents,
      warranty_expires_at, both remediation window bounds, reopen_count and version."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, Purchaser, LicensedEngineer,
            PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/triage"
    description: "Branch point on admissibility. decision == ADMIT moves SUBMITTED or REOPENED ->
      TRIAGED_ADMISSIBLE and accrues the capped warranty charge (plus the reopen uplift on a
      reopened claim); decision == DENY moves SUBMITTED -> TRIAGED_DENIED (terminal) and accrues
      nothing. Admissible only while the logical clock is at or before warranty_expires_at."
    roles: [LicensedEngineer, ConverterSponsor]
    code: 200
    input: [decision, "triage_note?"]
    output: WarrantyClaim
    side_effects: ["ADMIT: status := TRIAGED_ADMISSIBLE, triage_outcome := ADMIT,
        accrued_charge_cents computed per calculations.warranty_charge_and_window",
      "ADMIT: ConversionProject.warranty_reserve_charge_cents increased by the delta",
      "DENY: status := TRIAGED_DENIED, triage_outcome := DENY, accrued_charge_cents stays 0",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/warranty-claims/{id}/remediation-schedule"
    description: "Schedules the remediation window: TRIAGED_ADMISSIBLE -> REMEDIATION_SCHEDULED.
      Enforces the CLOSED interval rule with a 259200-second cooldown against other scheduled or
      remediated claims on the SAME major component, and separately the project-wide aggregate depth
      cap ConversionProject.max_overlapping_remediations."
    roles: [ConverterSponsor]
    code: 200
    input: [remediation_start_at, remediation_end_at]
    output: WarrantyClaim
    side_effects: ["status := REMEDIATION_SCHEDULED",
      "remediation_start_at and remediation_end_at stored", "version += 1"]
  - method: POST
    path: "/warranty-claims/{id}/completion"
    description: "Records remediation completion: REMEDIATION_SCHEDULED -> REMEDIATED."
    roles: [ConverterSponsor, LicensedEngineer]
    code: 200
    input: ["completion_note?"]
    output: WarrantyClaim
    side_effects: ["status := REMEDIATED", "recomputes ConversionProject.posture", "version += 1"]
  - method: POST
    path: "/warranty-claims/{id}/reopening"
    description: "Reopens a remediated claim whose defect recurred: REMEDIATED -> REOPENED, bounded
      at MAX_CLAIM_REOPENS reopenings and only while the logical clock is at or before
      warranty_expires_at. The next ADMIT triage applies the reopen uplift before the cap."
    roles: [ConverterSponsor, Purchaser]
    code: 200
    input: ["reopen_reason?"]
    output: WarrantyClaim
    side_effects: ["status := REOPENED", "reopen_count += 1",
      "remediation_start_at and remediation_end_at cleared so the window is re-scheduled",
      "recomputes ConversionProject.posture", "version += 1"]
  - method: GET
    path: "/conversion-projects/{id}/warranty-summary"
    description: "Computed read returning ConversionProject.warranty_reserve_charge_cents together
      with the per-claim accrued_charge_cents breakdown and, for the requested closed window, the
      maximum remediation overlap depth measured against max_overlapping_remediations."
    roles: [ConverterSponsor, StateRegulator, LenderUnderwriter, PlatformAdmin]
    code: 200
    input: ["window_start_at?", "window_end_at?"]
    output: ConversionProject
    side_effects: []

errors:
  # --- auth ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent, empty, or X-User-Role not one of the nine
      declared role names"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not in the target endpoint's roles list"
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: "entity-backed role acting on a resource it is not bound to: TenantOccupant whose
      X-User-ID is not the path TenantHousehold.id, or Purchaser whose X-User-ID is not the path
      PurchaseAgreement.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the peer reviewer's X-User-ID equals EngineeringReport.submitted_by_user_id"
  # --- existence ---
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "conversion project id in the path does not resolve"
  - id: ERR_ENGINEERING_ARTIFACT_NOT_FOUND
    http: 404
    condition: "engineering report, major component or suitability assessment id does not resolve,
      in path or body"
  - id: ERR_DECLARATION_ARTIFACT_NOT_FOUND
    http: 404
    condition: "declaration package or unit id does not resolve, in path or body"
  - id: ERR_DISCLOSURE_ARTIFACT_NOT_FOUND
    http: 404
    condition: "public offering statement id does not resolve, or {section_code} is not one of the
      nine statutory section codes"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "tenant household id does not resolve, in path or body"
  - id: ERR_FINANCIAL_ARTIFACT_NOT_FOUND
    http: 404
    condition: "reserve study or initial budget id does not resolve, in path or body"
  - id: ERR_SALES_ARTIFACT_NOT_FOUND
    http: 404
    condition: "purchase agreement or closing batch id does not resolve, in path or body"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "warranty claim id does not resolve"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, enum value outside the declared set, integer
      outside its declared range, or non-ISO-8601-UTC datetime"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset < 0"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "uniqueness violation: (conversion_project_id, unit_number),
      (conversion_project_id, fiscal_year_label), (conversion_project_id, batch_sequence_no) or
      (public_offering_statement_id, section_code) already exists"
  # --- optimistic concurrency (stale parent version) ---
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the current Unit.version when signing a
      purchase agreement"
  - id: ERR_STALE_REPORT_VERSION
    http: 412
    condition: "expected_engineering_report_version does not equal the current
      EngineeringReport.version when creating a suitability assessment"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_conversion_project_version does not equal the current
      ConversionProject.version when creating an initial budget"
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_closing_batch_version does not equal the current ClosingBatch.version when
      assigning an agreement to a batch"
  # --- posture gates and state ---
  - id: ERR_PROJECT_FROZEN
    http: 409
    condition: "the project's derived posture is FROZEN and the requested write is not on the pinned
      exemption allowlist"
  - id: ERR_PROJECT_RESTRICTED
    http: 409
    condition: "the project's derived posture is RESTRICTED and the request is a closing-batch
      release, which requires posture OPEN"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the entity's current state in the relevant state dimension is not a declared source
      state for the requested transition, including terminal-state lockdown and repeated triggers"
  - id: ERR_BATCH_NOT_RELEASED
    http: 409
    condition: "closing requested for an agreement whose assigned closing batch is not RELEASED, or
      which has no batch assignment at all"
  - id: ERR_POS_NOT_EFFECTIVE
    http: 409
    condition: "the project has no public offering statement in status EFFECTIVE"
  - id: ERR_DECLARATION_NOT_RECORDED
    http: 409
    condition: "the project's declaration package is not in status RECORDED"
  - id: ERR_RESERVE_STUDY_NOT_ADOPTED
    http: 409
    condition: "the project has no ADOPTED initial budget whose referenced reserve study is ADOPTED"
  - id: ERR_POS_NOT_DELIVERED
    http: 409
    condition: "the purchase agreement has no pos_delivered_at, so no rescission period has started"
  # --- business safety ---
  - id: ERR_LIFE_SAFETY_COMPONENT_EXPIRED
    http: 422
    condition: "a VERIFIED life-safety component of the accepted engineering report has
      remaining_useful_life_years strictly below CRITICAL_RUL_YEARS"
  - id: ERR_SUITABILITY_GATE_FAILED
    http: 409
    condition: "the project's suitability_gate is not PASSED"
  - id: ERR_NO_VERIFIED_COMPONENTS
    http: 409
    condition: "the referenced engineering report has no component with verification_status VERIFIED"
  - id: ERR_POS_SECTIONS_INCOMPLETE
    http: 409
    condition: "fewer than all nine statutory sections of the public offering statement are in
      content_status COMPLETE"
  # --- business temporal ---
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "the logical clock has not yet reached the household's vacate_deadline_at"
  - id: ERR_ROFR_WINDOW_EXPIRED
    http: 409
    condition: "the logical clock is strictly past the household's rofr_expires_at"
  - id: ERR_RESCISSION_PERIOD_OPEN
    http: 409
    condition: "hardening attempted while the logical clock is strictly before
      rescission_deadline_at"
  - id: ERR_RESCISSION_PERIOD_CLOSED
    http: 409
    condition: "rescission attempted when the logical clock is at or after rescission_deadline_at"
  - id: ERR_WARRANTY_PERIOD_EXPIRED
    http: 409
    condition: "the logical clock is strictly past the claim's warranty_expires_at"
  - id: ERR_BATCH_WINDOW_OVERLAP
    http: 409
    condition: "the requested half-open closing-batch window is inverted or zero-length, or overlaps
      a sibling batch's half-open window in a non-terminal status; adjacency at the shared instant
      is allowed"
  - id: ERR_REMEDIATION_WINDOW_OVERLAP
    http: 409
    condition: "the requested closed remediation window is inverted, or comes within the
      259200-second cooldown of another scheduled or remediated claim window on the same major
      component"
  - id: ERR_REMEDIATION_CAPACITY_EXCEEDED
    http: 409
    condition: "at some instant inside the requested closed window the number of overlapping
      project remediation windows would exceed max_overlapping_remediations"
  # --- business referential ---
  - id: ERR_PROJECT_SCOPE_MISMATCH
    http: 409
    condition: "a referenced entity belongs to a different conversion project than the path
      resource"
  - id: ERR_ROFR_UNIT_NOT_LINKED
    http: 409
    condition: "the household has no occupied_unit_id, or the referenced unit is not INCLUDED, or it
      belongs to another project"
  - id: ERR_AGREEMENT_ALREADY_ASSIGNED
    http: 409
    condition: "the purchase agreement already has a non-null closing_batch_id"
  # --- business constraint ---
  - id: ERR_PERCENTAGE_INTEREST_NOT_BALANCED
    http: 409
    condition: "the INCLUDED unit set's percentage interests do not total exactly 10000 basis
      points"
  - id: ERR_LAST_INCLUDED_UNIT
    http: 409
    condition: "withdrawing this unit would leave the declaration package with no INCLUDED unit"
  - id: ERR_NO_INCLUDED_UNITS
    http: 409
    condition: "threshold evaluation requested while the project has zero INCLUDED units, leaving
      the presale percentage undefined"
  - id: ERR_CLAIM_REOPEN_LIMIT_REACHED
    http: 409
    condition: "the warranty claim's reopen_count has already reached MAX_CLAIM_REOPENS"
  # --- business fiscal ---
  - id: ERR_ESCROW_AMOUNT_MISMATCH
    http: 422
    condition: "the deposit amount_cents does not equal PurchaseAgreement.deposit_cents exactly"
  - id: ERR_ESCROW_NOT_FUNDED
    http: 402
    condition: "hardening or closing attempted while escrow_status is not FUNDED"
  - id: ERR_RELOCATION_AMOUNT_MISMATCH
    http: 422
    condition: "the disbursement amount_cents does not equal
      TenantHousehold.relocation_assistance_cents exactly"
  - id: ERR_PRESALE_THRESHOLD_NOT_MET
    http: 409
    condition: "release attempted while the batch fails either minimum threshold, or while some
      assigned agreement is not yet HARD or CLOSED"

roles:
  - name: ConverterSponsor
    description: "The condominium converter/declarant. Owns the project record, the declaration and
      plat, the unit definitions, tenant notices, the reserve study and initial budget, the offering
      statement content, closing batch structure and warranty remediation. Under segregation of
      duties the sponsor may submit engineering work only through a LicensedEngineer identity and
      may never peer-review it, register a statement effective, or move escrow money."
    identity: opaque
    exclusive_operations:
      - "POST /conversion-projects"
      - "PATCH /conversion-projects/{id}"
      - "POST /conversion-projects/{id}/declaration-packages"
      - "PATCH /declaration-packages/{id}"
      - "POST /units/{id}/withdraw"
      - "POST /units/{id}/reinstate"
      - "POST /conversion-projects/{id}/public-offering-statements"
      - "PUT /public-offering-statements/{id}/sections/{section_code}"
      - "POST /public-offering-statements/{id}/amendments"
      - "POST /conversion-projects/{id}/tenant-households"
      - "PATCH /tenant-households/{id}"
      - "POST /tenant-households/{id}/notices"
      - "POST /tenant-households/{id}/occupancy-outcomes"
      - "POST /conversion-projects/{id}/initial-budgets"
      - "PATCH /initial-budgets/{id}"
      - "PATCH /reserve-studies/{id}"
      - "POST /conversion-projects/{id}/closing-batches"
      - "PATCH /closing-batches/{id}"
      - "DELETE /closing-batches/{id}/agreement-assignments/{purchase_agreement_id}"
      - "POST /purchase-agreements/{id}/pos-deliveries"
      - "PATCH /purchase-agreements/{id}"
      - "POST /warranty-claims/{id}/remediation-schedule"
    shared_operations:
      - "POST /conversion-projects/{id}/engineering-reports (with LicensedEngineer)"
      - "POST /engineering-reports/{id}/suitability-assessments (with PeerReviewEngineer)"
      - "POST /declaration-packages/{id}/plat-certification (with LicensedEngineer)"
      - "POST /declaration-packages/{id}/units (with LicensedEngineer)"
      - "PATCH /units/{id} (with LicensedEngineer)"
      - "POST /declaration-packages/{id}/record (with StateRegulator)"
      - "POST /conversion-projects/{id}/reserve-studies (with LicensedEngineer)"
      - "POST /initial-budgets/{id}/adoption (with StateRegulator)"
      - "POST /closing-batches/{id}/agreement-assignments (with EscrowAgent)"
      - "POST /closing-batches/{id}/threshold-evaluations (with EscrowAgent, StateRegulator)"
      - "POST /units/{id}/purchase-agreements (with Purchaser)"
      - "POST /purchase-agreements/{id}/hardening (with EscrowAgent)"
      - "POST /purchase-agreements/{id}/rescission (with Purchaser)"
      - "POST /tenant-households/{id}/rofr-responses (with TenantOccupant)"
      - "POST /conversion-projects/{id}/warranty-claims (with Purchaser)"
      - "POST /warranty-claims/{id}/triage (with LicensedEngineer)"
      - "POST /warranty-claims/{id}/completion (with LicensedEngineer)"
      - "POST /warranty-claims/{id}/reopening (with Purchaser)"
      - "POST /conversion-projects/{id}/posture-recalculations (with StateRegulator,
        PlatformAdmin)"
      - "all GET reads on the project graph"
      - "POST /_clock/set_current_utc"
  - name: LicensedEngineer
    description: "The engineer of record who inspects the building, files the report on remaining
      useful life of major components, and edits component data. May never peer-review its own
      report: validation priority 4 rejects a decision whose X-User-ID equals the report's
      submitted_by_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /engineering-reports/{id}/submit"
      - "POST /engineering-reports/{id}/revisions"
      - "POST /engineering-reports/{id}/major-components"
      - "PATCH /major-components/{id}"
    shared_operations:
      - "POST /conversion-projects/{id}/engineering-reports (with ConverterSponsor)"
      - "POST /declaration-packages/{id}/units (with ConverterSponsor)"
      - "PATCH /units/{id} (with ConverterSponsor)"
      - "POST /declaration-packages/{id}/plat-certification (with ConverterSponsor)"
      - "POST /conversion-projects/{id}/reserve-studies (with ConverterSponsor)"
      - "POST /warranty-claims/{id}/triage (with ConverterSponsor)"
      - "POST /warranty-claims/{id}/completion (with ConverterSponsor)"
      - "GET reads on engineering, component, unit and warranty resources"
  - name: PeerReviewEngineer
    description: "Independent reviewer who verifies individual components and accepts or rejects the
      engineering report. Holds the only path to component verification, so the VERIFIED input set
      of both the suitability score and the reserve study is entirely under this role's control."
    identity: opaque
    exclusive_operations:
      - "POST /engineering-reports/{id}/peer-review-decisions"
      - "POST /major-components/{id}/verification"
    shared_operations:
      - "POST /engineering-reports/{id}/suitability-assessments (with ConverterSponsor)"
      - "GET reads on engineering, component and suitability resources"
  - name: StateRegulator
    description: "The registration authority. Solely responsible for declaring a public offering
      statement EFFECTIVE, and co-signs recording and budget adoption. Cannot author statement
      content, so no single identity can both write and bless the disclosure."
    identity: opaque
    exclusive_operations:
      - "POST /public-offering-statements/{id}/effectiveness"
    shared_operations:
      - "POST /declaration-packages/{id}/record (with ConverterSponsor)"
      - "POST /initial-budgets/{id}/adoption (with ConverterSponsor)"
      - "POST /closing-batches/{id}/threshold-evaluations (with ConverterSponsor, EscrowAgent)"
      - "POST /conversion-projects/{id}/posture-recalculations (with ConverterSponsor,
        PlatformAdmin)"
      - "all GET reads including every summary endpoint"
      - "POST /_clock/set_current_utc"
  - name: EscrowAgent
    description: "Independent escrow holder. Holds the only path that moves money - earnest money
      deposits, relocation disbursements, batch release and closing disbursement - so the sponsor
      can create obligations but never settle them."
    identity: opaque
    exclusive_operations:
      - "POST /purchase-agreements/{id}/escrow-deposits"
      - "POST /purchase-agreements/{id}/closing"
      - "POST /closing-batches/{id}/release"
      - "POST /tenant-households/{id}/relocation-disbursements"
    shared_operations:
      - "POST /closing-batches/{id}/agreement-assignments (with ConverterSponsor)"
      - "POST /closing-batches/{id}/threshold-evaluations (with ConverterSponsor, StateRegulator)"
      - "POST /purchase-agreements/{id}/hardening (with ConverterSponsor)"
      - "GET reads on projects, units, batches, agreements and the escrow summary"
      - "POST /_clock/set_current_utc"
  - name: LenderUnderwriter
    description: "Secondary-market underwriter who reads owner-occupancy and investor-concentration
      warrantability metrics. Strictly read-only: it can inspect every ratio and verdict but cannot
      mutate any resource."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /conversion-projects/{id}/warrantability-summary"
      - "GET /closing-batches/{id}/threshold-summary"
      - "GET /conversion-projects/{id}/warranty-summary"
      - "GET /declaration-packages/{id}/assessment-allocation"
      - "GET reads on projects, declaration packages, units, statements, budgets, reserve studies,
        batches, agreements and warranty claims"
      - "POST /_clock/set_current_utc"
  - name: PlatformAdmin
    description: "Operator of the registry platform. Holds the clock and the project-level
      operational knobs, and can run the posture sweep, but is deliberately excluded from every
      substantive compliance decision - no review, no effectiveness, no money movement."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /_clock/current"
      - "PATCH /conversion-projects/{id} (with ConverterSponsor)"
      - "POST /conversion-projects/{id}/posture-recalculations (with ConverterSponsor,
        StateRegulator)"
      - "all GET reads"
  - name: TenantOccupant
    description: "An existing tenant household of the building, identified by its own household
      record: X-User-ID equals TenantHousehold.id. May answer its own right of first refusal offer
      and read its own household; validation priority 3 rejects any attempt to answer another
      household's offer."
    identity: "entity_backed:TenantHousehold"
    exclusive_operations: []
    shared_operations:
      - "POST /tenant-households/{id}/rofr-responses (with ConverterSponsor, restricted to the
        acting household)"
      - "GET /tenant-households/{id} and GET /tenant-households for its own household"
      - "GET /units and GET /units/{id}"
      - "GET /_clock/current"
  - name: Purchaser
    description: "A unit purchaser, identified by its own purchase agreement: X-User-ID equals
      PurchaseAgreement.id. May sign, rescind within the statutory window, file and reopen warranty
      claims, and read the disclosure package; validation priority 3 rejects rescission of another
      purchaser's agreement."
    identity: "entity_backed:PurchaseAgreement"
    exclusive_operations: []
    shared_operations:
      - "POST /units/{id}/purchase-agreements (with ConverterSponsor)"
      - "POST /purchase-agreements/{id}/rescission (with ConverterSponsor, restricted to the acting
        agreement)"
      - "POST /conversion-projects/{id}/warranty-claims (with ConverterSponsor)"
      - "POST /warranty-claims/{id}/reopening (with ConverterSponsor)"
      - "GET reads on units, statements, sections, initial budgets, agreements and warranty claims"
      - "GET /_clock/current"
