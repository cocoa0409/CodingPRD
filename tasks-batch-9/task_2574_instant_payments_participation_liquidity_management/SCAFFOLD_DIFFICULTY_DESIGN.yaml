            - call: "POST /position-accounts"
              payload: { participant_id: "${pg_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
