            - call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${kc2_id}", route_code: "VER-R2", origin_city: "Vernal", destination_city: "Salt Lake City", vehicle_id: "SUV-52", scheduled_departure_at: "2026-09-02T05:00:00Z", scheduled_arrival_at: "2026-09-02T10:00:00Z", scheduled_pickup_at: "2026-09-02T05:00:00Z", scheduled_delivery_at: "2026-09-02T10:00:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${kc2_occ2}" }
              as: CourierCoordinator
