      - name: error_rate_and_material_rate_diverge_on_a_minor_only_area
        claim_type: correct_result
        grounds:
          - calculations.error_rate_and_tolerance
          - calculations.restitution_exposure
          - entities.ExamScopeArea.fields.material_error_rate_pct
        distinguishing_aspect: |
          Three MINOR errors out of ten reviewed files drive the overall error rate to 30.00 - far past
          the 3.00 CLAIMS tolerance - while the material rate stays at 0.00, so tolerance_breached is
          true and escalation_required is false in the same response. That combination is what makes a
          MINOR criticism on a breached area legal while still resolving to SAMPLE_ACTUAL exposure: the
          extrapolation trigger keys on severity, not on the breach.
        test_recipe:
          setup:
            - "Empty database."
