              as_user_id: "u-rev-1"
            - call: "POST /fees/${fee_wifi}/inclusions"
              payload: { service_code: "WIFI_TIER2", service_label: "Tier-2 bandwidth per device", retail_value_cents: 400, units: 2 }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp1}/submit-review"
              payload: {}
