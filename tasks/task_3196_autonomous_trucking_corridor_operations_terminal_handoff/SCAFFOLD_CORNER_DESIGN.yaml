            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 24, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "LOW_VISIBILITY", weather_risk_score: 34 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_id}", window_start_epoch_day: 10, window_end_epoch_day: 12, trailer_count: 1, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: true }
              as: CarrierDispatcher
