# ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: posture_sweep_splits_exactly_at_95_percent_and_at_full_capacity
        grounds:
          - calculations.ComplexPostureSweepCalculation
          - calculations.ComplexPostureSweepCalculation.constants.RESTRICTED_PCT_OF_EFFECTIVE
          - calculations.FacilityContentionPosture
          - calculations.FacilityContentionPosture.constants.TIGHT_PERMILLE
          - endpoints.POST_/camp-ops/complexes/{complexId}/posture-sweeps
        distinguishing_aspect: "Four complexes published at 94, 95, 99 and 100 posted units over a 100-unit capacity land on NORMAL, FIELD_RESTRICTED, FIELD_RESTRICTED and CLOSED respectively, so the 95 percent floor and the full-capacity equality are both exact rather than rounded."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Four DEDICATED complexes, each capacity 100, each carrying one published group whose capacity_units is 94, 95, 99 and 100 respectively."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Boundary 94", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 100 }
              as: PlatformAdmin
              captures: { c94: $.data.id }
            - call: "POST /camp-ops/complexes"
              payload: { name: "Boundary 95", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 100 }
