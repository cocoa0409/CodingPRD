            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app1}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt1: $.data.id } }
