            - call: "POST /liquidation/lots/${lot1}/listings"
              payload: { listing_format: "FIXED_PRICE", resale_channel: "MARKETPLACE_RESALE", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z", ask_price_cents: 1000000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lst1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot2}/listings"
              payload: { listing_format: "FIXED_PRICE", resale_channel: "MARKETPLACE_RESALE", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z", ask_price_cents: 1000 }
              as: SellerOps
