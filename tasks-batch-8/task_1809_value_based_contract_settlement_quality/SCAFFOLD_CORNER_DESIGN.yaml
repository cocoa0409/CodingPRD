    claim_type: system_fields
    grounds:
    - entities.ClaimRecord.fields.claim_status
    - validations[priority=5]
    distinguishing_aspect: Passing system-managed claim_status in the create body is an unknown input field -> ERR_INVALID_REQUEST; status starts RECEIVED only via the lifecycle.
