          Entity pair DeconOrder -> Inspector, and the dependency is on TWO
          different attributes of the other row: certification_level must be
          DECON_CERTIFIED and status must be ACTIVE. Ada Field is perfectly ACTIVE
          but only LEVEL_1, so the treatment is refused with 403
          ERR_INSPECTOR_NOT_CERTIFIED; Bo Tech is DECON_CERTIFIED and succeeds; and
