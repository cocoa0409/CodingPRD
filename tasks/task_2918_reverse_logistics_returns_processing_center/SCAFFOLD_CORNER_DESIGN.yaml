              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_QUARANTINE_REQUIRED"
            - "GET /return-lines/${rl_id} shows condition_grade == UNGRADED, disposition == PENDING, disposition_state == RECEIVED_UNGRADED and graded_by_user_id == null"
            - "GET /refund-releases?return_line_id=${rl_id} returns total_count == 0, proving no RefundRelease was stamped"

      - name: corner_val_hazardous_line_grades_normally_after_a_hazmat_quarantine
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority 33 ERR_QUARANTINE_REQUIRED]
          - state_machines.ReturnLine_disposition_state
          - calculations.disposition_decision
        distinguishing_aspect: "The identical LITHIUM_BATTERY line, once it holds a completed HAZMAT bay occupation, grades to D successfully and lands on DESTROY through decision rule D2 rather than any hazard error."
        test_recipe:
