      - name: group_cap_proration_floors_all_but_last_line_and_assigns_residual
        grounds:
          - calculations.measure_incentive_allocation
          - calculations.measure_incentive_allocation.precision
          - entities.Program.fields.group_cap_cents
          - entities.ProjectMeasure.fields.pinned_sort_order
          - endpoints.GET_/rebate-projects/{id}/incentive-quote
        distinguishing_aspect: |
          Mode (b): a proration whose per-line split is only reproducible with
          the pinned round-then-sum rule — every member except the LAST in
          (pinned_sort_order ASC, created_at ASC) order is floored and the
          residual cent lands on the last line. The two HVAC_GROUP lines sum
          to 1050000 against an 800000 group cap, so the correct split is
          609523 / 190477 while flooring every line (including the last)
          gives 609523 / 190476 and a total of 799999 — one cent short of the
          cap. Unlike mode (a) no min() arm is at issue: both lines were
          already resolved before Stage 2 ran.
