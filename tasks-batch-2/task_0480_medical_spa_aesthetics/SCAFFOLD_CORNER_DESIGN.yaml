# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Medical Spa & Aesthetics — Expert tier
# Breadth probe across the claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_provider_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.Provider
          - endpoints
        distinguishing_aspect: "POST /aesthetics/providers with full_name/license_number/role_kind returns 201; status defaults ACTIVE; counts default 0; version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Co Inj", license_number: "L-CO-1", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { co_p: $.data.id, co_status: $.data.status }
          assert:
            - "response code == 201"
            - "Provider.${co_p}.status == ACTIVE"
            - "Provider.${co_p}.open_complication_count == 0"
            - "Provider.${co_p}.version == 1"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Patient
          - errors[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "GET /aesthetics/patients/{id} with a non-existent UUID returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /aesthetics/patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_FOUND"
            - "response http_status == 404"

      - name: create_membership_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.MembershipPackage.fields.member_discount_pct
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /aesthetics/membership-packages omitting member_discount_pct returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aesthetics/membership-packages"
              payload: { tier: "PLUS", loyalty_program: "ALLE", monthly_fee_cents: 9900 }
              as: ClinicAdmin
              captures: { mr_err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response http_status == 400"

      - name: patient_membership_id_default_null_no_discount
        claim_type: Defaults
        grounds:
          - entities.Patient.fields.membership_id
          - entities.Patient.fields.photo_consent_on_file
        distinguishing_aspect: "POST /aesthetics/patients without membership_id returns a patient with photo_consent_on_file==false and no membership association."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Def Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { def_pat: $.data.id, def_consent: $.data.photo_consent_on_file }
          assert:
            - "Patient.${def_pat}.photo_consent_on_file == false"

      - name: lot_remaining_units_computed_equals_total_on_intake
        claim_type: Computed Fields
        grounds:
          - entities.InjectableLot.fields.remaining_units
          - entities.InjectableLot.fields.total_units
        distinguishing_aspect: "On intake, InjectableLot.remaining_units == total_units, reserved_units==0, consumed_units==0, status==AVAILABLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-C1", expiration_date: "2026-12-01T00:00:00Z", total_units: 150 }
              as: ClinicAdmin
              captures: { cc_lot: $.data.id, cc_rem: $.data.remaining_units }
          assert:
            - "InjectableLot.${cc_lot}.remaining_units == 150"
            - "InjectableLot.${cc_lot}.reserved_units == 0"
            - "InjectableLot.${cc_lot}.status == AVAILABLE"

      - name: create_provider_invalid_enum_role_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Provider.fields.role_kind
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /aesthetics/providers with role_kind=NURSE (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Bad Role", license_number: "L-BAD", role_kind: "NURSE" }
              as: ClinicAdmin
              captures: { en_err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response http_status == 400"

      - name: consent_photo_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ConsentPhoto
        distinguishing_aspect: "ConsentPhoto uses common_fields:false; the create response carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup: ["a patient exists"]
          setup_api_calls:
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Imm Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { im_pat: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Imm Inj", license_number: "L-IM-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { im_inj: $.data.id }
          trigger:
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${im_pat}", kind: "CONSENT", storage_uri: "s3://im", signed: true }
              as: Provider
              as_user_id: "${im_inj}"
              captures: { im_photo: $.data.id }
          assert:
            - "response code == 201"
            - "ConsentPhoto.${im_photo}.id is present"

      - name: foreign_key_patient_membership_invalid_returns_membership_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Patient.fields.membership_id
          - errors[ERR_MEMBERSHIP_NOT_FOUND]
        distinguishing_aspect: "POST /aesthetics/patients with a non-existent membership_id returns ERR_MEMBERSHIP_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Fk Pat", date_of_birth: "1990-01-01T00:00:00Z", membership_id: "00000000-0000-0000-0000-000000000000" }
              as: ClinicAdmin
              captures: { fk_err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBERSHIP_NOT_FOUND"
            - "response http_status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_exam_twice_second_returns_not_draft
        claim_type: Idempotency
        grounds:
          - state_machines.Consultation.DRAFT_to_EXAM_COMPLETE
          - errors[ERR_CONSULTATION_NOT_DRAFT]
        distinguishing_aspect: "Calling complete-exam on an already EXAM_COMPLETE consultation returns ERR_CONSULTATION_NOT_DRAFT (409); no second exam_clock_utc stamping."
        test_recipe:
          setup: ["an EXAM_COMPLETE consultation"]
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Idp Inj", license_number: "L-IDP-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { idp_inj: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Idp Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { idp_pat: $.data.id }
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${idp_pat}", exam_provider_id: "${idp_inj}", chief_complaint: "x" }
              as: Provider
              as_user_id: "${idp_inj}"
              captures: { idp_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${idp_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${idp_inj}"
          trigger:
            - call: "POST /aesthetics/consultations/${idp_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${idp_inj}"
              captures: { idp_err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONSULTATION_NOT_DRAFT"
            - "response http_status == 409"

      - name: commit_session_from_committed_returns_not_booked
        claim_type: invalid_transition
        grounds:
          - state_machines.TreatmentSession.BOOKED_to_COMMITTED
          - errors[ERR_SESSION_NOT_BOOKED]
        distinguishing_aspect: "Committing an already-COMMITTED session returns ERR_SESSION_NOT_BOOKED (409); no double consumption of lot units."
        test_recipe:
          setup: ["a COMMITTED session"]
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "It Inj", license_number: "L-IT-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { it_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "It Dir", license_number: "L-IT-D", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { it_dir: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-IT", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { it_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "It Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { it_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${it_pat}", kind: "CONSENT", storage_uri: "s3://it-c", signed: true }
              as: Provider
              as_user_id: "${it_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${it_pat}", exam_provider_id: "${it_inj}", chief_complaint: "x" }
              as: Provider
              as_user_id: "${it_inj}"
              captures: { it_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${it_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${it_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${it_cons}", director_provider_id: "${it_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${it_dir}"
              captures: { it_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${it_pat}", consultation_id: "${it_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 20, list_price_per_unit_cents: 1000, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${it_inj}"
              captures: { it_plan: $.data.id, it_plan_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${it_plan}/activate"
              payload: { expected_treatment_plan_version: "${it_plan_v}" }
              as: Provider
              as_user_id: "${it_inj}"
              captures: { it_plan_v2: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${it_plan}", standing_order_id: "${it_so}", injector_provider_id: "${it_inj}", injectable_lot_id: "${it_lot}", planned_units: 20, expected_treatment_plan_version: "${it_plan_v2}" }
              as: Provider
              as_user_id: "${it_inj}"
              captures: { it_sess: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${it_pat}", treatment_session_id: "${it_sess}", kind: "BEFORE", storage_uri: "s3://it-b" }
              as: Provider
              as_user_id: "${it_inj}"
            - call: "POST /aesthetics/treatment-sessions/${it_sess}/commit"
              payload: {}
              as: Provider
              as_user_id: "${it_inj}"
          trigger:
            - call: "POST /aesthetics/treatment-sessions/${it_sess}/commit"
              payload: {}
              as: Provider
              as_user_id: "${it_inj}"
              captures: { it_err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_BOOKED"
            - "response http_status == 409"

      - name: resolve_session_without_after_photo_returns_after_photo_required
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TreatmentSession.COMMITTED_to_RESOLVED
          - errors[ERR_AFTER_PHOTO_REQUIRED]
        distinguishing_aspect: "Resolving a COMMITTED session with no AFTER photo on file returns ERR_AFTER_PHOTO_REQUIRED (409)."
        test_recipe:
          setup: ["a COMMITTED session with BEFORE photo but no AFTER photo, no complication"]
          setup_api_calls:
