            - { call: "POST /v1/process-runs/${prun1}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun1}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch1}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-Z2", capacity_liters: 5000 }, as: PlantManager, captures: { tank2: $.data.id } }
