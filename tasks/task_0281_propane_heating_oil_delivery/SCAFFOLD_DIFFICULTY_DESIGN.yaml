            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /trucks/${truck_id}/routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/deliver"
              payload: { delivered_gallons: 200, expected_account_version: "${acct_v}" }
              as: Driver
              captures: { total: $.data.invoice_total_cents }
            - call: "GET /tanks/${tank_id}"
              payload: {}
              as: Driver
              captures: { tank_current: $.data.current_gallons, reorder_after: $.data.reorder_status }
            - call: "GET /budget-plans/${bp_id}"
              payload: {}
              as: AccountManager
              captures: { actuals: $.data.actual_cost_to_date_cents }
          assert:
            - "reorder_before == DUE   # 100/500 = pct 20"
            - "Tank.${tank_id}.current_gallons == 300   # B: 100 + 200"
            - "Tank.${tank_id}.reorder_status == OK   # C: 300/500 = pct 60 above threshold 30"
            - "BudgetPlan.${bp_id}.actual_cost_to_date_cents == 61500   # D: fuel 200*295(tier1)=59000 + 2500 off_route"
            - "DeliveryOrder.${order_id}.invoice_total_cents == 61500"

      - name: route_cancel_cascade_revert_orders_release_capacity
        grounds:
          - state_machines.DeliveryRoute.PLANNING_to_CANCELLED
          - state_machines.DeliveryOrder.SCHEDULED_to_CREATED
          - entities.DeliveryOrder.fields.route_id
          - entities.DeliveryRoute.fields.reserved_gallons
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (route cancel, not deliver): (A) route
          PLANNING->CANCELLED -> (B) each SCHEDULED order reverts to CREATED -> (C) that revert
          clears route_id and releases the truck reservation (reserved_gallons -> 0).
        test_recipe:
          setup:
            - "Account NE_01 PASSED IN_SERVICE tank; two will-call orders (200 and 150 gal) SCHEDULED on one PLANNING route; reserved_gallons 350."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Revert Rey", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 800, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-05T00:00:00Z", window_start: "2026-02-05T09:00:00Z", window_end: "2026-02-05T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 150 }
              as: Dispatcher
              captures: { order2_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order1_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/delivery-orders/${order2_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
              captures: { reserved_before: $.data.route_id }
          trigger:
            - call: "POST /trucks/${truck_id}/routes/${route_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { route_status: $.data.status, reserved_after: $.data.reserved_gallons }
            - call: "GET /delivery-orders/${order1_id}"
              payload: {}
              as: Dispatcher
              captures: { o1_status: $.data.status, o1_route: $.data.route_id }
          assert:
            - "DeliveryRoute.${route_id}.status == CANCELLED   # A"
            - "DeliveryOrder.${order1_id}.status == CREATED   # B: reverted"
            - "DeliveryOrder.${order1_id}.route_id == null   # C: route_id cleared"
            - "DeliveryRoute.${route_id}.reserved_gallons == 0   # C: capacity released (was 350)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_safety_beats_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.DeliveryOrder.CREATED_to_SCHEDULED
        distinguishing_aspect: |
          Error-category pair business_safety (priority 8, ERR_SAFETY_CHECK_REQUIRED) vs
          business_fiscal (priority 11, ERR_ROUTE_CAPACITY_EXCEEDED): an assign that violates
          BOTH (no PASSED inspection AND over capacity) returns the safety error, not the
          capacity error.
        test_recipe:
          setup:
            - "Account NE_01; tank IN_SERVICE but NO PASSED inspection (none recorded); order 200 gal; route on a truck with daily_capacity 100 (so 200 > 100 also fails capacity)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Dual Dan", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 100 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-06T00:00:00Z", window_start: "2026-02-06T09:00:00Z", window_end: "2026-02-06T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "err == ERR_SAFETY_CHECK_REQUIRED   # priority 8 beats priority 11 ERR_ROUTE_CAPACITY_EXCEEDED"

      - name: resume_state_beats_route_referential
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.DeliveryOrder.HOLD_to_SCHEDULED
        distinguishing_aspect: |
          Error-category pair state (priority 6, ERR_INVALID_STATE) vs business_referential
          (priority 7, ERR_ROUTE_NOT_PLANNING): a resume on an order that is CREATED (not HOLD)
          whose route is also CANCELLED returns the state error, not the route error.
        test_recipe:
          setup:
            - "Account NE_01 PASSED tank; order created and left in CREATED (never put on HOLD); a route exists but is CANCELLED. Resume requires HOLD."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "State Steve", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-07T00:00:00Z", window_start: "2026-02-07T09:00:00Z", window_end: "2026-02-07T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes/${route_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 200 }
              as: Dispatcher
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order_id}/resume"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "err == ERR_INVALID_STATE   # priority 6 (order CREATED not HOLD) beats priority 7 ERR_ROUTE_NOT_PLANNING"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: reorder_threshold_at_exactly_30_is_due
        grounds:
          - calculations.tank_reorder_projection
          - entities.Tank.fields.reorder_threshold_pct
          - entities.Tank.fields.reorder_status
        distinguishing_aspect: |
          Numeric threshold metric on the /tanks/{id}/evaluate-reorder endpoint: projected_pct
          == reorder_threshold_pct (30) is DUE because the rule is `<=`, not `<`. One HDD reading
          of 167 drives consumed 300, proj 150, pct exactly 30 => DUE.
        test_recipe:
          setup:
            - "Tank NE_01 capacity 500 k_factor 1800 reorder_threshold 30 monitor false current 450; baseline anchor = tank creation at 2026-01-01."
            - "One degree-day reading 2026-01-01 of 167 HDD; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { customer_name: "Boundary Bea", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 500, k_factor: 1800, reorder_threshold_pct: 30, monitor_installed: false, current_gallons: 450 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /degree-day-readings"
              payload: { region_code: "NE_01", reading_date: "2026-01-01T00:00:00Z", heating_degree_days: 167 }
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /tanks/${tank_id}/evaluate-reorder"
              payload: {}
              as: Dispatcher
              captures: { reorder_status: $.data.reorder_status }
          assert:
            - "Tank.${tank_id}.reorder_status == DUE   # consumed 300, proj 150, pct 30 == threshold (<= boundary)"

      - name: route_capacity_exact_fit_succeeds_overflow_rejected
        grounds:
          - validations[priority=11]
          - state_machines.DeliveryOrder.CREATED_to_SCHEDULED
          - entities.DeliveryRoute.fields.reserved_gallons
          - entities.Truck.fields.daily_capacity_gallons
        distinguishing_aspect: |
          Distinct metric (truck capacity) on a distinct endpoint (/assign): reserved 600 +
          requested 400 == daily_capacity 1000 is allowed (<=), but a second order of 1 gal
          (1000+1 > 1000) is rejected with ERR_ROUTE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Account NE_01 PASSED IN_SERVICE tank capacity 2000; truck daily_capacity 1000; route PLANNING with one order of 600 already SCHEDULED (reserved 600)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Exact Ed", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/tanks"
              payload: { capacity_gallons: 2000, k_factor: 1500, current_gallons: 100 }
              as: AccountManager
              captures: { tank_id: $.data.id }
            - call: "POST /tanks/${tank_id}/inspections"
              payload: { result: "PASSED", inspected_at: "2026-01-01T00:00:00Z" }
              as: Inspector
            - call: "POST /trucks"
              payload: { region_code: "NE_01", daily_capacity_gallons: 1000 }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/routes"
              payload: { route_date: "2026-02-08T00:00:00Z", window_start: "2026-02-08T09:00:00Z", window_end: "2026-02-08T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 600 }
              as: Dispatcher
              captures: { order1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order1_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 400 }
              as: Dispatcher
              captures: { order2_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
              payload: { tank_id: "${tank_id}", requested_gallons: 1 }
              as: Dispatcher
              captures: { order3_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/delivery-orders/${order2_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
              captures: { o2_status: $.data.status }
            - call: "POST /accounts/${acct_id}/delivery-orders/${order3_id}/assign"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "DeliveryOrder.${order2_id}.status == SCHEDULED   # 600+400 == 1000 exactly, allowed (<=)"
            - "err == ERR_ROUTE_CAPACITY_EXCEEDED   # 1000+1 > 1000 rejected"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_assign_requires_route_planning
        grounds:
          - state_machines.DeliveryOrder.CREATED_to_SCHEDULED
          - validations[priority=7]
          - entities.DeliveryRoute.fields.status
        distinguishing_aspect: |
          Entity pair DeliveryOrder->DeliveryRoute: assigning an order requires the target
          DeliveryRoute.status == PLANNING; a DISPATCHED route rejects assign with
          ERR_ROUTE_NOT_PLANNING.
        test_recipe:
          setup:
            - "Account NE_01 PASSED tank; route DISPATCHED (with one SCHEDULED order already on it); a second CREATED order tries to assign to that DISPATCHED route."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Route Rita", region_code: "NE_01", fuel_type: "PROPANE" }
              as: AccountManager
              captures: { acct_id: $.data.id }
