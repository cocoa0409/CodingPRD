# =============================================================================
# SCAFFOLD: Corporate Income Tax Provision & Compliance
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Corporate Income Tax Provision & Compliance (corporate tax department): book-to-tax difference identification & deferred tax rollforward, valuation allowance assessment, uncertain tax position measurement & disclosure, effective tax rate reconciliation & forecast, estimated payment calculation & scheduling, return-to-provision true-up, filing calendar across jurisdictions & extension, notice response & audit management

domain_name: corporate-income-tax-provision
api_prefix: /tax

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation        # forecast vs actual ETR; safe-harbor vs annualized estimates
    - rate_threshold_triggers         # UTP >50% recognition; underpayment penalty at shortfall>0
    - derived_field_reconciliation    # deferred balances, ETR, RTP mirrors recomputed on source mutation
    - optimistic_concurrency          # OCC on TaxYear.version for VA create and filing file
  entity_topology: flat               # peer entities linked by FK references; no nested URL paths
  state_machine_shape: cyclic         # review/rework, reject/amend/refile, negotiate/revise loops
  relationship_patterns:
    - one_to_many                     # TaxYear has many differences/filings/payments (via FK, not nesting)
    - cross_aggregate                 # UTP disclosure gate queries Filing by (tax_year_id, jurisdiction_id)
  role_model: segregation_of_duties   # VA preparer cannot approve own assessment
  consistency_model: immediate        # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all dates are ISO 8601
# `YYYY-MM-DD` strings compared against the date portion of the logical clock)
# =============================================================================
entities:
  - name: TaxYear
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year_label, type: string, source: input, description: "Human label, e.g. FY2026; unique" }
      - { name: period_start_date, type: string, source: input, description: "First day of fiscal year (YYYY-MM-DD)" }
      - { name: period_end_date, type: string, source: input, description: "Last day of fiscal year (YYYY-MM-DD); must be after period_start_date" }
      - { name: enacted_federal_rate_bp, type: integer, source: input, description: "Enacted federal statutory rate in basis points (e.g. 2100 = 21.00%)" }
      - { name: pretax_book_income_cents, type: integer, source: input, description: "GAAP pretax book income for the year; must be > 0" }
      - { name: prior_year_total_tax_cents, type: integer, source: input, default: 0, description: "Prior-year total actual tax (consolidated), basis for safe-harbor estimates" }
      - { name: status, type: enum, source: system, description: "OPEN | PROVISION_LOCKED | RETURNS_FILED | CLOSED" }
      - { name: current_provision_cents, type: integer, source: computed, description: "Live estimate of current tax expense per calculations.current_tax_stack (0 when no filings exist)" }
      - { name: deferred_expense_cents, type: integer, source: computed, description: "Sum of LIABILITY movements minus sum of ASSET movements across the year's DeferredTaxItems (negative = net benefit)" }
      - { name: net_deferred_asset_cents, type: integer, source: computed, description: "Sum of ASSET closing balances minus sum of LIABILITY closing balances (gross, before valuation allowance)" }
      - { name: valuation_allowance_cents, type: integer, source: computed, description: "allowance_amount_cents of the year's APPROVED ValuationAllowance; 0 when none is APPROVED" }
      - { name: utp_liability_cents, type: integer, source: computed, description: "Sum of liability_cents over the year's UncertainTaxPositions in status MEASURED or DISCLOSED" }
      - { name: return_to_provision_adjustment_cents, type: integer, source: computed, description: "Sum over Filings in status FILED or ACCEPTED of (return_tax_liability_cents - estimated_liability_cents)" }
      - { name: forecast_etr_bp, type: integer, source: computed, description: "Forecast variant of calculations.etr_calculation, in basis points; recomputed on every relevant mutation" }
      - { name: actual_etr_bp, type: integer, source: computed, description: "Actual variant of calculations.etr_calculation, in basis points" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code, e.g. US-FED, US-CA" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: level, type: enum, source: input, description: "FEDERAL | STATE | FOREIGN" }
      - { name: statutory_rate_bp, type: integer, source: input, description: "Statutory rate in basis points; 0..10000" }
      - { name: apportionment_pct_bp, type: integer, source: input, description: "Share of book income apportioned to this jurisdiction, basis points; 0..10000" }
      - { name: return_due_month, type: integer, source: input, description: "Month (1-12) of the statutory return due date (year after period end)" }
      - { name: return_due_day, type: integer, source: input, description: "Day of month (1-31) of the statutory return due date" }
      - { name: extension_months, type: integer, source: input, default: 6, description: "Months added to original due date when an extension is GRANTED" }

  - name: BookTaxDifference
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; optional (book-level differences may be jurisdiction-agnostic)", constraints: "nullable" }
      - { name: description, type: string, source: input, description: "Nature of the difference, e.g. 'meals & entertainment 50% limitation'" }
      - { name: book_amount_cents, type: integer, source: input, description: "Expense (positive) or income (negative) recognized in books" }
      - { name: tax_amount_cents, type: integer, source: input, description: "Deduction (positive) or income (negative) recognized for tax" }
      - { name: difference_cents, type: integer, source: computed, description: "= book_amount_cents - tax_amount_cents; positive = book expense exceeds tax deduction (unfavorable addback / future deduction)" }
      - { name: difference_type, type: enum, source: input, description: "TEMPORARY | PERMANENT" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | REVIEWED | LOCKED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (audit trail)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of most recent reviewer; null until reviewed" }

  - name: DeferredTaxItem
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: source_difference_id, type: string, source: system, description: "FK -> BookTaxDifference.id; the LOCKED TEMPORARY difference that generated this item" }
      - { name: item_kind, type: enum, source: computed, description: "ASSET when source difference_cents > 0 (future deduction); LIABILITY when difference_cents < 0" }
      - { name: opening_balance_cents, type: integer, source: input, default: 0, description: "Prior-year closing balance carried into this rollforward line (nonnegative magnitude)" }
      - { name: movement_cents, type: integer, source: computed, description: "= round_half_up(abs(difference_cents) * enacted_federal_rate_bp / 10000), nonnegative magnitude" }
      - { name: closing_balance_cents, type: integer, source: computed, description: "= opening_balance_cents + movement_cents (rollforward invariant)" }

  - name: ValuationAllowance
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: more_likely_than_not, type: boolean, source: input, description: "Assessor conclusion: some deferred tax asset is more likely than not realizable" }
      - { name: projected_taxable_income_cents, type: integer, source: input, description: "Projected future taxable income (positive evidence); >= 0" }
      - { name: reversing_dtl_cents, type: integer, source: input, description: "Taxable temporary reversals (DTL pool) available as a source of income; >= 0" }
      - { name: assessment_note, type: string, source: input, description: "Free-text evidence narrative; optional", constraints: "nullable" }
      - { name: allowance_amount_cents, type: integer, source: computed, description: "Per calculations.valuation_allowance_measurement; recomputed while DRAFT/SUBMITTED whenever the DTA pool changes" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties anchor" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | SUPERSEDED" }

  - name: UncertainTaxPosition
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: description, type: string, source: input, description: "Position taken on the return, e.g. 'R&D credit under section 41'" }
      - { name: position_amount_cents, type: integer, source: input, description: "Tax benefit claimed on the return; > 0" }
      - { name: cumulative_probability_bp, type: integer, source: input, description: "Set at measure time: cumulative probability that the full benefit is sustained, basis points 0..10000; recognition requires strictly > 5000" }
      - { name: recognized_benefit_cents, type: integer, source: computed, description: "= position_amount_cents when cumulative_probability_bp > 5000, else 0" }
      - { name: liability_cents, type: integer, source: computed, description: "= position_amount_cents - recognized_benefit_cents (unrecognized tax benefit reserve)" }
      - { name: measured_on, type: string, source: system, description: "Clock date of the most recent measure transition; null until first MEASURED" }
      - { name: interest_accrued_cents, type: integer, source: computed, description: "= round_half_up(liability_cents * UTP_INTEREST_RATE_BP/10000 * whole_months(measured_on -> clock date)/12); recomputed on read and mutation" }
      - { name: disclosure_required, type: boolean, source: computed, description: "= liability_cents > 0" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Agreed settlement payment; set on settle transition; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | MEASURED | DISCLOSED | SETTLED | LAPSED" }

  - name: EstimatedPayment
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: quarter_index, type: integer, source: input, description: "1..4; unique per (tax_year_id, jurisdiction_id)" }
      - { name: period_start_date, type: string, source: input, description: "First day of the quarter interval (inclusive)" }
      - { name: period_end_date, type: string, source: input, description: "Last day of the quarter interval (inclusive); closed-interval semantics" }
      - { name: due_date, type: string, source: input, description: "Payment due date; generated schedules set it to period_end_date + 15 days" }
      - { name: method, type: enum, source: input, description: "PRIOR_YEAR_SAFE_HARBOR | CURRENT_YEAR_ANNUALIZED" }
      - { name: base_scheduled_amount_cents, type: integer, source: computed, description: "Amount per calculations.estimated_payment_schedule at generation; immutable anchor for RTP re-spreads" }
      - { name: scheduled_amount_cents, type: integer, source: computed, description: "Current scheduled amount; equals base until an RTP re-spread adjusts SCHEDULED quarters" }
      - { name: paid_amount_cents, type: integer, source: system, default: 0, description: "Cumulative amount paid against this quarter" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Assessed once at the LATE transition per calculations.underpayment_penalty; never refunded" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PARTIALLY_PAID | LATE | PAID" }

  - name: Filing
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: original_due_date, type: string, source: input, description: "Statutory unextended due date (YYYY-MM-DD)" }
      - { name: extended_due_date, type: string, source: computed, description: "= add_months(original_due_date, Jurisdiction.extension_months) once extension GRANTED; null otherwise", constraints: "nullable" }
      - { name: extension_status, type: enum, source: system, description: "NONE | REQUESTED | GRANTED | DENIED (parallel dimension, independent of status)" }
      - { name: status, type: enum, source: system, description: "PENDING | READY | FILED | ACCEPTED | REJECTED | AMENDED" }
      - { name: return_tax_liability_cents, type: integer, source: input, description: "Actual tax per the return; set at mark-ready, corrected at amend; > 0" }
      - { name: estimated_liability_cents, type: integer, source: computed, description: "Per-jurisdiction provision estimate assigned at lock-provision from calculations.current_tax_stack; 0 until locked" }
      - { name: filed_on, type: string, source: system, description: "Clock date of the most recent READY/AMENDED -> FILED transition; null until first filed", constraints: "nullable" }
      - { name: is_late, type: boolean, source: computed, description: "= filed_on > effective due date (extended_due_date when GRANTED else original_due_date)" }

  - name: TaxNotice
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: audit_case_id, type: string, source: input, description: "FK -> AuditCase.id; optional — notices may stand alone", constraints: "nullable" }
      - { name: notice_type, type: enum, source: input, description: "INFORMATION_REQUEST | AUDIT_OPENING | PROPOSED_ADJUSTMENT | PENALTY_ASSESSMENT" }
      - { name: received_on, type: string, source: input, description: "Date the notice was received (YYYY-MM-DD)" }
      - { name: response_due_on, type: string, source: input, description: "Statutory response deadline; must be >= received_on" }
      - { name: response_text, type: string, source: input, description: "Response body; set on respond transition; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | OVERDUE | RESPONDED | RESOLVED" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: tax_year_id, type: string, source: input, description: "FK -> TaxYear.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: exam_period_start, type: string, source: input, description: "First day under examination; half-open interval [start, end)" }
      - { name: exam_period_end, type: string, source: input, description: "Day after the last examined day; must be after exam_period_start (half-open end, exclusive)" }
      - { name: opened_on, type: string, source: system, description: "Clock date at creation" }
      - { name: proposed_adjustment_cents, type: integer, source: input, description: "Examiner's proposed additional assessment; set on propose/revise; null until first proposal", constraints: "nullable" }
      - { name: agreed_adjustment_cents, type: integer, source: input, description: "Final agreed assessment; required on close with outcome AGREED; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "UNDER_EXAMINATION | ADJUSTMENT_PROPOSED | NEGOTIATING | CLOSED_AGREED | CLOSED_NO_CHANGE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TaxYear
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PROVISION_LOCKED
        trigger: "POST /tax/tax-years/{taxYearId}/lock-provision"
        actor: TaxDirector
        preconditions:
          - "Every BookTaxDifference with tax_year_id = this id has status in {LOCKED, REJECTED}"
          - "A ValuationAllowance with tax_year_id = this id has status APPROVED"
          - "No UncertainTaxPosition with tax_year_id = this id has status IDENTIFIED"
        side_effects:
          - "Assign estimated_liability_cents on each Filing of the year from calculations.current_tax_stack (per-jurisdiction components)"
          - "Snapshot current_provision_cents (continues to be exposed; frozen thereafter because difference locks and VA changes are blocked once not OPEN)"
          - "Recompute forecast_etr_bp"
          - "Increments TaxYear.version by 1"
      - from: PROVISION_LOCKED
        to: RETURNS_FILED
        trigger: "POST /tax/tax-years/{taxYearId}/mark-returns-filed"
        actor: TaxDirector
        preconditions:
          - "Every Filing with tax_year_id = this id has status in {FILED, ACCEPTED} (ERR_UNFILED_RETURNS otherwise)"
        side_effects:
          - "Increments TaxYear.version by 1"
      - from: RETURNS_FILED
        to: CLOSED
        trigger: "POST /tax/tax-years/{taxYearId}/close"
        actor: TaxDirector
        preconditions:
          - "Every AuditCase with tax_year_id = this id has status in {CLOSED_AGREED, CLOSED_NO_CHANGE}"
          - "Every TaxNotice joined via its audit_case_id to an AuditCase of this year, and every standalone TaxNotice whose jurisdiction has a Filing in this year, has status RESOLVED"
        side_effects:
          - "Increments TaxYear.version by 1"

  - entity: BookTaxDifference
    initial_state: IDENTIFIED
    terminal_states: [LOCKED, REJECTED]
    transitions:
      - from: IDENTIFIED
        to: REVIEWED
        trigger: "POST /tax/book-tax-differences/{differenceId}/review"
        actor: TaxManager
        preconditions: ["Parent TaxYear.status == OPEN"]
        side_effects: ["Set reviewed_by_user_id from X-User-ID"]
      - from: REVIEWED
        to: IDENTIFIED
        trigger: "POST /tax/book-tax-differences/{differenceId}/return-for-rework"
        actor: TaxManager
        preconditions: ["Parent TaxYear.status == OPEN"]
        side_effects: ["Clear reviewed_by_user_id to null"]
        note: "Rework loop — cyclic edge REVIEWED -> IDENTIFIED"
      - from: REVIEWED
        to: LOCKED
        trigger: "POST /tax/book-tax-differences/{differenceId}/lock"
        actor: TaxManager
        preconditions: ["Parent TaxYear.status == OPEN (ERR_TAX_YEAR_NOT_OPEN otherwise)"]
        side_effects:
          - "Cascade hop 1: when difference_type == TEMPORARY and difference_cents != 0, upsert DeferredTaxItem (source_difference_id = this id): compute item_kind, movement_cents, closing_balance_cents per calculations.deferred_tax_movement"
          - "Cascade hop 2 (triggered by hop 1): recompute parent TaxYear.deferred_expense_cents and TaxYear.net_deferred_asset_cents over the year's DeferredTaxItems"
          - "Cascade hop 3a (triggered by hop 2): recompute parent TaxYear.forecast_etr_bp (forecast variant consumes deferred_expense_cents)"
          - "Cascade hop 3b (triggered by hop 1, conditional): if a ValuationAllowance for the year exists in status DRAFT or SUBMITTED, recompute its allowance_amount_cents against the updated DTA pool per calculations.valuation_allowance_measurement"
      - from: REVIEWED
        to: REJECTED
        trigger: "POST /tax/book-tax-differences/{differenceId}/reject"
        actor: TaxManager
        preconditions: ["Parent TaxYear.status == OPEN"]
        side_effects: []
        note: "Rejected differences never produce DeferredTaxItems and never enter any calculation input set"

  - entity: ValuationAllowance
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tax/valuation-allowances/{allowanceId}/submit"
        actor: TaxManager
        preconditions: ["Parent TaxYear.status == OPEN"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tax/valuation-allowances/{allowanceId}/approve"
        actor: TaxDirector
        preconditions:
          - "X-User-ID != prepared_by_user_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES otherwise)"
          - "Parent TaxYear.status == OPEN"
        side_effects:
          - "Any other ValuationAllowance for the same tax_year_id in status APPROVED transitions to SUPERSEDED"
          - "Recompute parent TaxYear.valuation_allowance_cents = this.allowance_amount_cents; recompute TaxYear.forecast_etr_bp; increments TaxYear.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /tax/valuation-allowances/{allowanceId}/return"
        actor: TaxDirector
        preconditions: []
        side_effects: []
        note: "Return-for-rework loop — cyclic edge SUBMITTED -> DRAFT"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: another ValuationAllowance for the same tax_year_id is APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /tax/valuation-allowances creates a newer assessment for the same tax_year_id"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: POST /tax/valuation-allowances creates a newer assessment for the same tax_year_id"
        actor: system
        preconditions: []
        side_effects: []
        note: "APPROVED assessments are never superseded by a bare create — only by a subsequent approve"

  - entity: UncertainTaxPosition
    initial_state: IDENTIFIED
    terminal_states: [SETTLED, LAPSED]
    transitions:
      - from: IDENTIFIED
        to: MEASURED
        trigger: "POST /tax/uncertain-tax-positions/{positionId}/measure"
        actor: TaxManager
        preconditions: ["cumulative_probability_bp in 0..10000 (ERR_PROBABILITY_OUT_OF_RANGE otherwise)"]
        side_effects:
          - "Compute recognized_benefit_cents, liability_cents, disclosure_required per calculations.utp_recognition_measurement; set measured_on = clock date"
          - "Recompute parent TaxYear.utp_liability_cents and TaxYear.forecast_etr_bp; increments TaxYear.version by 1"
      - from: MEASURED
        to: MEASURED
        trigger: "POST /tax/uncertain-tax-positions/{positionId}/measure"
        actor: TaxManager
        preconditions: ["cumulative_probability_bp in 0..10000"]
        side_effects:
          - "Recompute recognized_benefit_cents, liability_cents, disclosure_required; refresh measured_on = clock date"
          - "Recompute parent TaxYear.utp_liability_cents and TaxYear.forecast_etr_bp; increments TaxYear.version by 1"
        note: "Re-measurement self-loop — cyclic edge MEASURED -> MEASURED"
      - from: MEASURED
        to: DISCLOSED
        trigger: "POST /tax/uncertain-tax-positions/{positionId}/disclose"
        actor: TaxManager
        preconditions:
          - "Exists a Filing with the same (tax_year_id, jurisdiction_id) whose status is in {READY, FILED, ACCEPTED} (ERR_RETURN_NOT_READY otherwise) — cross-aggregate gate"
        side_effects: []
      - from: DISCLOSED
        to: SETTLED
        trigger: "POST /tax/uncertain-tax-positions/{positionId}/settle"
        actor: TaxManager
        preconditions: ["settled_amount_cents >= 0"]
        side_effects:
          - "Recompute parent TaxYear.utp_liability_cents (SETTLED positions drop out of the reserve) and TaxYear.forecast_etr_bp; increments TaxYear.version by 1"
      - from: DISCLOSED
        to: LAPSED
        trigger: "system: clock advance sweep — clock date > filed_on + STATUTE_YEARS years of the FILED/ACCEPTED Filing sharing (tax_year_id, jurisdiction_id)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute parent TaxYear.utp_liability_cents (LAPSED positions drop out of the reserve) and TaxYear.forecast_etr_bp; increments TaxYear.version by 1"

  - entity: EstimatedPayment
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - from: SCHEDULED
        to: PARTIALLY_PAID
        trigger: "POST /tax/estimated-payments/{paymentId}/record-payment"
        actor: TaxAccountant
        preconditions: ["0 < paid_amount_cents + amount_cents < scheduled_amount_cents"]
        side_effects: ["paid_amount_cents += amount_cents"]
      - from: SCHEDULED
        to: PAID
        trigger: "POST /tax/estimated-payments/{paymentId}/record-payment"
        actor: TaxAccountant
        preconditions: ["paid_amount_cents + amount_cents == scheduled_amount_cents"]
        side_effects: ["paid_amount_cents += amount_cents"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /tax/estimated-payments/{paymentId}/record-payment"
        actor: TaxAccountant
        preconditions: ["paid_amount_cents + amount_cents == scheduled_amount_cents"]
        side_effects: ["paid_amount_cents += amount_cents"]
      - from: SCHEDULED
        to: LATE
        trigger: "system: clock advance sweep — clock date > due_date and paid_amount_cents < scheduled_amount_cents"
        actor: system
        preconditions: []
        side_effects: ["Assess penalty_cents = round_half_up((scheduled_amount_cents - paid_amount_cents) * LATE_PENALTY_RATE_BP / 10000)"]
      - from: PARTIALLY_PAID
        to: LATE
        trigger: "system: clock advance sweep — clock date > due_date and paid_amount_cents < scheduled_amount_cents"
        actor: system
        preconditions: []
        side_effects: ["Assess penalty_cents = round_half_up((scheduled_amount_cents - paid_amount_cents) * LATE_PENALTY_RATE_BP / 10000)"]
      - from: LATE
        to: PAID
        trigger: "POST /tax/estimated-payments/{paymentId}/record-payment"
        actor: TaxAccountant
        preconditions: ["paid_amount_cents + amount_cents == scheduled_amount_cents"]
        side_effects: ["paid_amount_cents += amount_cents", "penalty_cents unchanged (never refunded)"]
      - from: PARTIALLY_PAID
        to: SCHEDULED
        trigger: "POST /tax/estimated-payments/{paymentId}/reverse-payment"
        actor: TaxManager
        preconditions: ["0 < amount_cents <= paid_amount_cents (ERR_INVALID_AMOUNT otherwise)"]
        side_effects: ["paid_amount_cents -= amount_cents; when paid_amount_cents returns to 0 status becomes SCHEDULED"]
        note: "Compensating action for record-payment; conserves paid_amount_cents across the pair"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /tax/estimated-payments/{paymentId}/reverse-payment"
        actor: TaxManager
        preconditions: ["0 < amount_cents < paid_amount_cents"]
        side_effects: ["paid_amount_cents -= amount_cents"]
      - from: LATE
        to: PARTIALLY_PAID
        trigger: "POST /tax/estimated-payments/{paymentId}/reverse-payment"
        actor: TaxManager
        preconditions: ["0 < amount_cents <= paid_amount_cents; when paid_amount_cents returns to 0 the payment stays LATE until the next sweep re-evaluates (status LATE with paid 0)"]
        side_effects: ["paid_amount_cents -= amount_cents; penalty_cents unchanged"]

  - entity: Filing
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    note: "Two parallel state dimensions on one row: status (lifecycle) x extension_status (NONE|REQUESTED|GRANTED|DENIED). extension transitions are legal only while status in {PENDING, READY} and never change status."
    transitions:
      - from: PENDING
        to: READY
        trigger: "POST /tax/filings/{filingId}/mark-ready"
        actor: TaxAccountant
        preconditions:
          - "Parent TaxYear.status == PROVISION_LOCKED (ERR_TAX_YEAR_NOT_LOCKED otherwise)"
          - "return_tax_liability_cents > 0"
        side_effects: ["Set return_tax_liability_cents"]
      - from: AMENDED
        to: READY
        trigger: "POST /tax/filings/{filingId}/mark-ready"
        actor: TaxAccountant
        preconditions: ["Parent TaxYear.status in {PROVISION_LOCKED, RETURNS_FILED}", "return_tax_liability_cents > 0"]
        side_effects: ["Set return_tax_liability_cents"]
        note: "Re-entry into READY after amendment — completes the reject/amend/refile cycle"
      - from: READY
        to: FILED
        trigger: "POST /tax/filings/{filingId}/file"
        actor: TaxDirector
        preconditions:
          - "expected_tax_year_version matches parent TaxYear.version (OCC; ERR_STALE_VERSION otherwise)"
          - "Clock date <= effective due date — extended_due_date when extension_status == GRANTED, else original_due_date (ERR_FILING_DEADLINE_PASSED otherwise)"
          - "Every UncertainTaxPosition sharing (tax_year_id, jurisdiction_id) with disclosure_required == true has status in {DISCLOSED, SETTLED, LAPSED} (ERR_UTP_UNDISCLOSED otherwise)"
        side_effects:
          - "Set filed_on = clock date; compute is_late"
          - "Cascade hop 1: recompute parent TaxYear.return_to_provision_adjustment_cents = sum over Filings of the year in {FILED, ACCEPTED} of (return_tax_liability_cents - estimated_liability_cents); recompute TaxYear.actual_etr_bp"
          - "Cascade hop 2 (triggered by hop 1): for the filing's jurisdiction, re-spread the per-filing RTP delta across that jurisdiction's EstimatedPayments in status SCHEDULED with method CURRENT_YEAR_ANNUALIZED per calculations.rtp_trueup (PRIOR_YEAR_SAFE_HARBOR quarters are never re-spread)"
          - "Increments TaxYear.version by 1"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /tax/filings/{filingId}/accept"
        actor: TaxManager
        preconditions: []
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /tax/filings/{filingId}/reject"
        actor: TaxManager
        preconditions: []
        side_effects:
          - "Recompute parent TaxYear.return_to_provision_adjustment_cents (REJECTED filings drop out of the filed set) and TaxYear.actual_etr_bp; increments TaxYear.version by 1"
      - from: REJECTED
        to: AMENDED
        trigger: "POST /tax/filings/{filingId}/amend"
        actor: TaxAccountant
        preconditions: ["return_tax_liability_cents > 0"]
        side_effects: ["Set corrected return_tax_liability_cents"]
      - from: PENDING
        to: PENDING
        trigger: "POST /tax/filings/{filingId}/request-extension (extension_status: NONE -> REQUESTED)"
        actor: TaxAccountant
        preconditions: ["Clock date <= original_due_date (ERR_EXTENSION_WINDOW_MISSED otherwise)", "extension_status == NONE"]
        side_effects: ["extension_status := REQUESTED"]
      - from: READY
        to: READY
        trigger: "POST /tax/filings/{filingId}/request-extension (extension_status: NONE -> REQUESTED)"
        actor: TaxAccountant
        preconditions: ["Clock date <= original_due_date (ERR_EXTENSION_WINDOW_MISSED otherwise)", "extension_status == NONE"]
        side_effects: ["extension_status := REQUESTED"]
      - from: PENDING
        to: PENDING
        trigger: "POST /tax/filings/{filingId}/resolve-extension (extension_status: REQUESTED -> GRANTED | DENIED)"
        actor: TaxDirector
        preconditions: ["extension_status == REQUESTED", "decision in {GRANTED, DENIED}"]
        side_effects: ["extension_status := decision", "When GRANTED: extended_due_date = add_months(original_due_date, Jurisdiction.extension_months)"]
      - from: READY
        to: READY
        trigger: "POST /tax/filings/{filingId}/resolve-extension (extension_status: REQUESTED -> GRANTED | DENIED)"
        actor: TaxDirector
        preconditions: ["extension_status == REQUESTED", "decision in {GRANTED, DENIED}"]
        side_effects: ["extension_status := decision", "When GRANTED: extended_due_date = add_months(original_due_date, Jurisdiction.extension_months)"]

  - entity: TaxNotice
    initial_state: RECEIVED
    terminal_states: [RESOLVED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /tax/notices/{noticeId}/assign-review"
        actor: TaxManager
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: OVERDUE
        trigger: "system: clock advance sweep — clock date > response_due_on"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: OVERDUE
        trigger: "system: clock advance sweep — clock date > response_due_on"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RESPONDED
        trigger: "POST /tax/notices/{noticeId}/respond"
        actor: TaxManager
        preconditions: ["response_text non-empty"]
        side_effects: ["Set response_text"]
      - from: OVERDUE
        to: RESPONDED
        trigger: "POST /tax/notices/{noticeId}/respond"
        actor: TaxManager
        preconditions: ["response_text non-empty"]
        side_effects: ["Set response_text"]
        note: "Late response is permitted; the OVERDUE sojourn remains visible in updated_at history"
      - from: RESPONDED
        to: RESOLVED
        trigger: "POST /tax/notices/{noticeId}/resolve"
        actor: TaxManager
        preconditions: []
        side_effects: []

  - entity: AuditCase
    initial_state: UNDER_EXAMINATION
    terminal_states: [CLOSED_AGREED, CLOSED_NO_CHANGE]
    transitions:
      - from: UNDER_EXAMINATION
        to: ADJUSTMENT_PROPOSED
        trigger: "POST /tax/audits/{auditId}/propose-adjustment"
        actor: TaxManager
        preconditions: ["proposed_adjustment_cents >= 0"]
        side_effects: ["Set proposed_adjustment_cents"]
      - from: ADJUSTMENT_PROPOSED
        to: NEGOTIATING
        trigger: "POST /tax/audits/{auditId}/negotiate"
        actor: TaxManager
        preconditions: []
        side_effects: []
      - from: NEGOTIATING
        to: ADJUSTMENT_PROPOSED
        trigger: "POST /tax/audits/{auditId}/revise-adjustment"
        actor: TaxManager
        preconditions: ["proposed_adjustment_cents >= 0"]
        side_effects: ["Set revised proposed_adjustment_cents"]
        note: "Revised-proposal loop — cyclic edge NEGOTIATING -> ADJUSTMENT_PROPOSED"
      - from: UNDER_EXAMINATION
        to: CLOSED_NO_CHANGE
        trigger: "POST /tax/audits/{auditId}/close (outcome = NO_CHANGE)"
        actor: TaxManager
        preconditions: ["Every TaxNotice with audit_case_id = this id has status RESOLVED (ERR_UNRESOLVED_NOTICES otherwise)"]
        side_effects: []
      - from: ADJUSTMENT_PROPOSED
        to: CLOSED_AGREED
        trigger: "POST /tax/audits/{auditId}/close (outcome = AGREED)"
        actor: TaxManager
        preconditions:
          - "Every TaxNotice with audit_case_id = this id has status RESOLVED (ERR_UNRESOLVED_NOTICES otherwise)"
          - "agreed_adjustment_cents present and >= 0"
        side_effects: ["Set agreed_adjustment_cents"]
      - from: NEGOTIATING
        to: CLOSED_AGREED
        trigger: "POST /tax/audits/{auditId}/close (outcome = AGREED)"
        actor: TaxManager
        preconditions:
          - "Every TaxNotice with audit_case_id = this id has status RESOLVED (ERR_UNRESOLVED_NOTICES otherwise)"
          - "agreed_adjustment_cents present and >= 0"
        side_effects: ["Set agreed_adjustment_cents"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: va-create-stale-tax-year
    parent_entity: TaxYear
    write_endpoint: "POST /tax/valuation-allowances"
    occ_field: expected_tax_year_version
    description: |
      Creating a ValuationAllowance against a TaxYear whose version has advanced
      since the client last observed it is rejected. Creating legitimately
      supersedes any existing DRAFT/SUBMITTED assessment for the year, so a
      writer working from a stale TaxYear view would silently supersede an
      assessment it never saw; the stale-version check forces a re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: filing-file-stale-tax-year
    parent_entity: TaxYear
    write_endpoint: "POST /tax/filings/{filingId}/file"
    occ_field: expected_tax_year_version
    description: |
      Filing a return against a TaxYear whose version has advanced since the
      client last observed it is rejected. Filing legitimately recomputes the
      return-to-provision adjustment and re-spreads remaining estimated
      payments, so a filer working from a stale TaxYear view would compute
      downstream amounts from superseded inputs; the stale-version check
      forces a re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: difference_amount
    trigger: "On BookTaxDifference creation (and whenever book/tax amounts are set)"
    algorithm: aggregation
    formula: |
      difference_cents = book_amount_cents - tax_amount_cents
      Sign convention: positive = book expense exceeds tax deduction
      (unfavorable addback now, future deduction later -> ASSET when TEMPORARY).
    input_set: "The single BookTaxDifference being written"
    constants: {}
    precision: "integer cents; exact subtraction, no rounding"

  - name: deferred_tax_movement
    trigger: "BookTaxDifference REVIEWED -> LOCKED with difference_type == TEMPORARY and difference_cents != 0"
    algorithm: aggregation
    formula: |
      movement_cents = round_half_up(abs(difference_cents) * enacted_federal_rate_bp / 10000)
      item_kind     = ASSET when difference_cents > 0 else LIABILITY
      closing_balance_cents = opening_balance_cents + movement_cents
      Rollforward invariant: opening + movement == closing, always.
      Zero differences (difference_cents == 0) produce NO DeferredTaxItem.
      PERMANENT differences never produce DeferredTaxItems.
    input_set: "The LOCKED TEMPORARY BookTaxDifference; parent TaxYear.enacted_federal_rate_bp"
    constants: {}
    precision: "integer cents; exactly one round_half_up applied to the product abs(difference)*rate_bp/10000"

  - name: valuation_allowance_measurement
    trigger: "ValuationAllowance creation; recomputed on every DeferredTaxItem upsert while the assessment is DRAFT or SUBMITTED; frozen once APPROVED"
    algorithm: threshold
    formula: |
      total_gross_dta_cents = sum of closing_balance_cents over the year's DeferredTaxItems with item_kind == ASSET
      if more_likely_than_not == false:
          allowance_amount_cents = total_gross_dta_cents            # full allowance
      else:
          income_support_cents = round_half_up(projected_taxable_income_cents * enacted_federal_rate_bp / 10000)
          realizable = min(total_gross_dta_cents, reversing_dtl_cents + income_support_cents)
          allowance_amount_cents = max(0, total_gross_dta_cents - realizable)
    input_set: "ValuationAllowance inputs + the year's ASSET DeferredTaxItems (all statuses) + parent TaxYear.enacted_federal_rate_bp"
    constants: {}
    precision: "integer cents; single round_half_up inside income_support; nested min/max applied after rounding"
    note: "Combinatorial mode (a): 4 inputs with nested min/max and a conditional branch on the entity's more_likely_than_not flag"

  - name: utp_recognition_measurement
    trigger: "POST measure (IDENTIFIED -> MEASURED or MEASURED -> MEASURED); interest recomputed on every read and mutation"
    algorithm: threshold
    formula: |
      recognized_benefit_cents = position_amount_cents when cumulative_probability_bp > 5000 else 0
      liability_cents          = position_amount_cents - recognized_benefit_cents
      disclosure_required      = liability_cents > 0
      interest_accrued_cents   = round_half_up(liability_cents * UTP_INTEREST_RATE_BP / 10000 * months_outstanding / 12)
      months_outstanding       = whole calendar months from measured_on to the clock date, floored, minimum 0
    input_set: "The single UncertainTaxPosition; logical clock"
    constants:
      UTP_RECOGNITION_THRESHOLD_BP: 5000   # strictly greater-than: exactly 5000 is NOT recognized
      UTP_INTEREST_RATE_BP: 500            # 5% per annum on the unrecognized benefit
    precision: "integer cents; round_half_up on interest only; threshold comparison is strict (>)"

  - name: etr_calculation
    trigger: "Recomputed on every mutation of BookTaxDifference lock, ValuationAllowance approve/recompute, UncertainTaxPosition measure/settle/lapse, and Filing file/reject"
    algorithm: aggregation
    formula: |
      forecast_total_tax_cents = current_provision_cents + deferred_expense_cents + utp_liability_cents + valuation_allowance_cents
      actual_total_tax_cents   = sum(return_tax_liability_cents over Filings of the year in {FILED, ACCEPTED})
                                 + deferred_expense_cents + valuation_allowance_cents
      forecast_etr_bp = round_half_up(forecast_total_tax_cents * 10000 / pretax_book_income_cents)
      actual_etr_bp   = round_half_up(actual_total_tax_cents   * 10000 / pretax_book_income_cents)
      Guard: pretax_book_income_cents is validated > 0 at creation, so division is always safe.
    input_set: "Parent TaxYear computed fields; Filings of the year with status in {FILED, ACCEPTED} only (PENDING/READY/REJECTED/AMENDED excluded)"
    constants: {}
    precision: "integer basis points; single round_half_up at the final division"
    variants:
      - name: forecast
        when: "Always maintained; the in-year planning view"
        difference: "Consumes the current_provision_cents estimate and the UTP reserve"
      - name: actual
        when: "Meaningful once filings exist; the as-filed view"
        difference: "Replaces current_provision_cents and utp_liability_cents with the sum of filed return liabilities — identical data yields a different rate whenever filed liabilities diverge from the estimate/reserve"

  - name: estimated_payment_schedule
    trigger: "POST /tax/estimated-payments/generate-schedule (computes all four quarters); POST /tax/estimated-payments (manual single quarter uses client-supplied scheduled_amount_cents)"
    algorithm: tiered_pricing
    formula: |
      annual_estimate_cents =
          PRIOR_YEAR_SAFE_HARBOR:    round_half_up(prior_year_total_tax_cents * apportionment_pct_bp / 10000 * SAFE_HARBOR_PCT_BP / 10000)
          CURRENT_YEAR_ANNUALIZED:   round_half_up(pretax_book_income_cents * apportionment_pct_bp / 10000 * statutory_rate_bp / 10000)
      For quarter n in 1..4, in ascending quarter_index order:
          cumulative_target_n = annual_estimate_cents * n / 4          (exact rational, unrounded)
          base_scheduled_amount_cents[n] = round_half_up(cumulative_target_n - sum(base_scheduled_amount_cents[1..n-1]))
      Rounding order is PINNED: round each quarter's increment against the exact cumulative target
      ("round per-quarter cumulatively"), never round(annual/4) four times — the two orders diverge by cents.
    input_set: "Parent TaxYear (prior_year_total_tax_cents, pretax_book_income_cents); Jurisdiction (apportionment_pct_bp, statutory_rate_bp)"
    constants:
      SAFE_HARBOR_PCT_BP: 10000   # 100% of prior-year tax
    precision: "integer cents; one round_half_up on the annual estimate, then one per quarter against the cumulative target"
    variants:
      - name: prior_year_safe_harbor
        when: "method == PRIOR_YEAR_SAFE_HARBOR; conservative fixed obligation"
        difference: "Bases the annual estimate on prior-year actual tax; immune to RTP re-spreads"
      - name: current_year_annualized
        when: "method == CURRENT_YEAR_ANNUALIZED; pay-as-you-go view"
        difference: "Bases the annual estimate on current-year book income; SCHEDULED quarters are re-spread by calculations.rtp_trueup when filings land"

  - name: current_tax_stack
    trigger: "Continuously maintained while TaxYear.status == OPEN: recomputed on Filing creation, BookTaxDifference lock/reject, and Jurisdiction creation; frozen at lock-provision (which also copies per-jurisdiction components onto Filing.estimated_liability_cents)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED (state tax is federally deductible — the dependency looks circular, so the order is fixed):
      (1) perm_total_cents = sum of difference_cents over the year's BookTaxDifference with status LOCKED and difference_type PERMANENT
      (2) For each Jurisdiction j with level == STATE or FOREIGN that has >= 1 Filing in this year:
              state_tax_j = round_half_up((pretax_book_income_cents + perm_total_cents) * apportionment_pct_bp_j * statutory_rate_bp_j / 10^8)
          (single rounding after the full product — no intermediate rounding)
      (3) federal_base = pretax_book_income_cents + perm_total_cents - sum(state_tax_j)
      (4) When a FEDERAL Jurisdiction has >= 1 Filing in this year:
              federal_tax = round_half_up(federal_base * enacted_federal_rate_bp / 10000)
          else federal_tax = 0
      (5) current_provision_cents = sum(state_tax_j) + federal_tax
    input_set: "Jurisdictions with >= 1 Filing for the year (empty set -> 0); LOCKED PERMANENT BookTaxDifferences; TaxYear inputs"
    constants: {}
    precision: "integer cents; round_half_up once per jurisdiction component; federal component rounded once after deduction"
    note: "Combinatorial mode (c): circular-looking dependency (state tax depends on income, federal income depends on state tax) resolved by the pinned 5-step evaluation order"

  - name: underpayment_penalty
    trigger: "EstimatedPayment transition into LATE during a clock advance sweep"
    algorithm: threshold
    formula: |
      shortfall = scheduled_amount_cents - paid_amount_cents     # > 0 by the LATE precondition
      penalty_cents = round_half_up(shortfall * LATE_PENALTY_RATE_BP / 10000)
      Boundary: paid_amount_cents == scheduled_amount_cents means the payment is PAID and never enters LATE;
      the sweep condition paid < scheduled is strict, so an exactly-fully-paid quarter owes zero penalty.
    input_set: "The EstimatedPayment entering LATE"
    constants:
      LATE_PENALTY_RATE_BP: 400   # 4% of the shortfall, assessed once
    precision: "integer cents; single round_half_up"

  - name: rtp_trueup
    trigger: "Filing READY -> FILED (and recompute on FILED -> REJECTED and re-FILED after amendment)"
    algorithm: aggregation
    formula: |
      (a) TaxYear.return_to_provision_adjustment_cents =
              sum over Filings of the year with status in {FILED, ACCEPTED} of
              (return_tax_liability_cents - estimated_liability_cents)
          Full recompute each time — idempotent across reject/amend/refile cycles.
      (b) Re-spread (cascade hop 2): for the filing's jurisdiction, let
              delta = return_tax_liability_cents - estimated_liability_cents  (for this filing; 0 when the filing was already counted with the same liability)
              S     = the jurisdiction's EstimatedPayments of the year with status == SCHEDULED and method == CURRENT_YEAR_ANNUALIZED,
                      ordered by quarter_index ASC
          When S is non-empty:
              n = |S|
              base_delta = round_half_up(delta / n)
              payments S[1..n-1] receive base_delta; the LAST payment (highest quarter_index) receives delta - base_delta*(n-1)
              scheduled_amount_cents = base_scheduled_amount_cents + assigned delta   (recomputed FROM BASE each time — idempotent)
          PRIOR_YEAR_SAFE_HARBOR quarters and quarters already PARTIALLY_PAID / LATE / PAID are never re-spread.
    input_set: "Filings of the year in {FILED, ACCEPTED}; the filing jurisdiction's SCHEDULED CURRENT_YEAR_ANNUALIZED EstimatedPayments"
    constants: {}
    precision: "integer cents; round_half_up on base_delta; final quarter absorbs the remainder so the spread sums exactly to delta"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; on a multi-violation the
# lowest priority number wins and produces the response's error_id)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path identifiers exist, validated left-to-right; body FK references (tax_year_id, jurisdiction_id, audit_case_id) resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition exists (per §1.2); includes ERR_PAYMENT_ALREADY_SETTLED for record-payment on a PAID payment and generic ERR_INVALID_STATE_TRANSITION otherwise"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "Parent TaxYear posture admits the write: artifact creation (differences, filings, valuation-allowances) and difference/VA lifecycle actions require OPEN (ERR_TAX_YEAR_NOT_OPEN); mark-ready and file require PROVISION_LOCKED or later (ERR_TAX_YEAR_NOT_LOCKED)"
    error_id: ERR_TAX_YEAR_NOT_OPEN
    http_status: 409
    applies_to: "artifact-creation and lifecycle endpoints touching a TaxYear"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: ValuationAllowance approve requires X-User-ID != prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /tax/valuation-allowances/{allowanceId}/approve"]
  - priority: 7
    category: business_constraint
    check: "Uniqueness and interval constraints: Jurisdiction.code unique (ERR_DUPLICATE_JURISDICTION_CODE); EstimatedPayment quarter_index unique per (tax_year_id, jurisdiction_id) and generate-schedule requires zero existing quarters for the pair (ERR_DUPLICATE_QUARTER); AuditCase exam_period [start, end) must not overlap another non-closed AuditCase of the same jurisdiction — half-open semantics, so existing.end == new.start is legal (ERR_AUDIT_PERIOD_OVERLAP); manual quarter creation must not overlap existing closed intervals [start, end] for the same (tax_year_id, jurisdiction_id) — closed semantics, so start == existing.end collides (ERR_QUARTER_OVERLAP) — and must be exactly contiguous (start == max(existing end) + 1 day for quarter_index > 1; quarter 1 must start on period_start_date) with no gaps (ERR_QUARTER_GAP)"
    error_id: ERR_DUPLICATE_JURISDICTION_CODE
    http_status: 409
    applies_to: ["POST /tax/jurisdictions", "POST /tax/estimated-payments", "POST /tax/estimated-payments/generate-schedule", "POST /tax/audits"]
  - priority: 8
    category: business_temporal
    check: "Deadline discipline: request-extension requires clock date <= original_due_date (ERR_EXTENSION_WINDOW_MISSED); file requires clock date <= effective due date (ERR_FILING_DEADLINE_PASSED); date-range sanity — period_end after period_start, due/response dates within their windows (ERR_DATE_RANGE_INVALID)"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /tax/filings/{filingId}/request-extension", "POST /tax/filings/{filingId}/file", "POST /tax/tax-years", "POST /tax/notices", "POST /tax/estimated-payments", "POST /tax/audits"]
  - priority: 9
    category: business_referential
    check: "Cross-entity readiness: lock-provision requires all differences terminal, an APPROVED valuation allowance, and no IDENTIFIED UTPs (ERR_UNRESOLVED_PROVISION_ITEMS); mark-returns-filed requires all filings FILED/ACCEPTED (ERR_UNFILED_RETURNS); file requires every disclosure-required UTP of the (year, jurisdiction) in {DISCLOSED, SETTLED, LAPSED} (ERR_UTP_UNDISCLOSED); disclose requires a {READY, FILED, ACCEPTED} Filing for the same (year, jurisdiction) (ERR_RETURN_NOT_READY); audit close requires all linked notices RESOLVED (ERR_UNRESOLVED_NOTICES)"
    error_id: ERR_UNRESOLVED_PROVISION_ITEMS
    http_status: 422
    applies_to: ["POST /tax/tax-years/{taxYearId}/lock-provision", "POST /tax/tax-years/{taxYearId}/mark-returns-filed", "POST /tax/filings/{filingId}/file", "POST /tax/uncertain-tax-positions/{positionId}/disclose", "POST /tax/audits/{auditId}/close"]
  - priority: 10
    category: business_fiscal
    check: "Amount sanity: monetary inputs must be positive where required (return_tax_liability_cents, position_amount_cents, payment amounts; ERR_INVALID_AMOUNT); record-payment must not push paid_amount_cents above scheduled_amount_cents (ERR_OVERPAYMENT); cumulative_probability_bp within 0..10000 (ERR_PROBABILITY_OUT_OF_RANGE)"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: ["POST /tax/filings/{filingId}/mark-ready", "POST /tax/filings/{filingId}/amend", "POST /tax/uncertain-tax-positions", "POST /tax/uncertain-tax-positions/{positionId}/measure", "POST /tax/estimated-payments/{paymentId}/record-payment", "POST /tax/estimated-payments/{paymentId}/reverse-payment"]
  - priority: 11
    category: existence
    check: "Well-formed request body: required fields present, enum values valid, integer types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    note: "Deliberately last: a structurally malformed but authenticated request against a valid resource still reports domain errors first when both apply; undeclared extra fields are ignored, never rejected"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving (outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock; date-valued rules compare against the date portion. Sweep side effects run synchronously."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, late_payment_ids: string[], overdue_notice_ids: string[], lapsed_position_ids: string[] }"
    side_effects:
      - "EstimatedPayment sweep: SCHEDULED/PARTIALLY_PAID with clock date > due_date and paid < scheduled -> LATE (assesses penalty_cents per calculations.underpayment_penalty)"
      - "TaxNotice sweep: RECEIVED/UNDER_REVIEW with clock date > response_due_on -> OVERDUE"
      - "UncertainTaxPosition sweep: DISCLOSED -> LAPSED when clock date > filed_on + 3 years of the FILED/ACCEPTED Filing sharing (tax_year_id, jurisdiction_id); recomputes TaxYear.utp_liability_cents and forecast_etr_bp"

  # --- TaxYear ---
  - method: POST
    path: "/tax/tax-years"
    description: "Create a TaxYear (fiscal year under provision)"
    roles: [TaxManager, TaxDirector]
    code: 201
    input: [fiscal_year_label, period_start_date, period_end_date, enacted_federal_rate_bp, pretax_book_income_cents, "prior_year_total_tax_cents?"]
    output: TaxYear
    side_effects: ["status=OPEN, all computed money fields 0, forecast/actual ETR 0"]

  - method: GET
    path: "/tax/tax-years/{taxYearId}"
    description: "Get one TaxYear including all computed fields and version (OCC read)"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: TaxYear
    side_effects: []

  - method: POST
    path: "/tax/tax-years/{taxYearId}/lock-provision"
    description: "OPEN -> PROVISION_LOCKED; freezes the provision and stamps per-jurisdiction estimates onto filings"
    roles: [TaxDirector]
    code: 200
    input: []
    output: TaxYear
    side_effects: ["See state_machines.TaxYear; increments TaxYear.version by 1"]

  - method: POST
    path: "/tax/tax-years/{taxYearId}/mark-returns-filed"
    description: "PROVISION_LOCKED -> RETURNS_FILED"
    roles: [TaxDirector]
    code: 200
    input: []
    output: TaxYear
    side_effects: ["Increments TaxYear.version by 1"]

  - method: POST
    path: "/tax/tax-years/{taxYearId}/close"
    description: "RETURNS_FILED -> CLOSED"
    roles: [TaxDirector]
    code: 200
    input: []
    output: TaxYear
    side_effects: ["Increments TaxYear.version by 1"]

  # --- Jurisdiction ---
  - method: POST
    path: "/tax/jurisdictions"
    description: "Create a taxing jurisdiction (reference data)"
    roles: [TaxManager, TaxDirector]
    code: 201
    input: [code, name, level, statutory_rate_bp, apportionment_pct_bp, return_due_month, return_due_day, "extension_months?"]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/tax/jurisdictions/{jurisdictionId}"
    description: "Get one Jurisdiction"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- BookTaxDifference ---
  - method: POST
    path: "/tax/book-tax-differences"
    description: "Identify a book-to-tax difference (requires TaxYear OPEN)"
    roles: [TaxAccountant]
    code: 201
    input: [tax_year_id, "jurisdiction_id?", description, book_amount_cents, tax_amount_cents, difference_type]
    output: BookTaxDifference
    side_effects: ["status=IDENTIFIED, difference_cents computed, created_by_user_id from X-User-ID"]

  - method: GET
    path: "/tax/book-tax-differences"
    description: "List differences with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "jurisdiction_id?", "status?", "difference_type?", "limit?", "offset?"]
    output: BookTaxDifference[]
    side_effects: []

  - method: GET
    path: "/tax/book-tax-differences/{differenceId}"
    description: "Get one BookTaxDifference"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: BookTaxDifference
    side_effects: []

  - method: POST
    path: "/tax/book-tax-differences/{differenceId}/review"
    description: "IDENTIFIED -> REVIEWED"
    roles: [TaxManager]
    code: 200
    input: []
    output: BookTaxDifference
    side_effects: ["reviewed_by_user_id := X-User-ID"]

  - method: POST
    path: "/tax/book-tax-differences/{differenceId}/return-for-rework"
    description: "REVIEWED -> IDENTIFIED (rework loop)"
    roles: [TaxManager]
    code: 200
    input: []
    output: BookTaxDifference
    side_effects: ["reviewed_by_user_id := null"]

  - method: POST
    path: "/tax/book-tax-differences/{differenceId}/lock"
    description: "REVIEWED -> LOCKED; fires the deferred-tax cascade (see state_machines.BookTaxDifference)"
    roles: [TaxManager, TaxDirector]
    code: 200
    input: []
    output: BookTaxDifference
    side_effects: ["DeferredTaxItem upsert for TEMPORARY nonzero differences", "TaxYear deferred/ETR recompute", "DRAFT/SUBMITTED ValuationAllowance recompute"]

  - method: POST
    path: "/tax/book-tax-differences/{differenceId}/reject"
    description: "REVIEWED -> REJECTED"
    roles: [TaxManager]
    code: 200
    input: []
    output: BookTaxDifference
    side_effects: []

  # --- DeferredTaxItem (system-generated, read-only) ---
  - method: GET
    path: "/tax/deferred-tax-items"
    description: "List deferred tax rollforward lines with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "source_difference_id?", "item_kind?", "limit?", "offset?"]
    output: DeferredTaxItem[]
    side_effects: []

  - method: GET
    path: "/tax/deferred-tax-items/{deferredItemId}"
    description: "Get one DeferredTaxItem"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: DeferredTaxItem
    side_effects: []

  # --- ValuationAllowance ---
  - method: POST
    path: "/tax/valuation-allowances"
    description: "Create a valuation allowance assessment (OCC on TaxYear.version; supersedes existing DRAFT/SUBMITTED assessments of the year)"
    roles: [TaxManager]
    code: 201
    input: [tax_year_id, more_likely_than_not, projected_taxable_income_cents, reversing_dtl_cents, "assessment_note?", expected_tax_year_version]
    output: ValuationAllowance
    side_effects: ["allowance_amount_cents computed per calculations.valuation_allowance_measurement", "Existing DRAFT/SUBMITTED assessments of the year -> SUPERSEDED", "prepared_by_user_id := X-User-ID", "Increments TaxYear.version by 1"]

  - method: GET
    path: "/tax/valuation-allowances"
    description: "List valuation allowances with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "status?", "limit?", "offset?"]
    output: ValuationAllowance[]
    side_effects: []

  - method: GET
    path: "/tax/valuation-allowances/{allowanceId}"
    description: "Get one ValuationAllowance"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: ValuationAllowance
    side_effects: []

  - method: POST
    path: "/tax/valuation-allowances/{allowanceId}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [TaxManager]
    code: 200
    input: []
    output: ValuationAllowance
    side_effects: []

  - method: POST
    path: "/tax/valuation-allowances/{allowanceId}/approve"
    description: "SUBMITTED -> APPROVED; segregation of duties enforced (approver != preparer)"
    roles: [TaxDirector]
    code: 200
    input: []
    output: ValuationAllowance
    side_effects: ["Prior APPROVED assessment of the year -> SUPERSEDED", "TaxYear.valuation_allowance_cents and forecast_etr_bp recomputed; increments TaxYear.version by 1"]

  - method: POST
    path: "/tax/valuation-allowances/{allowanceId}/return"
    description: "SUBMITTED -> DRAFT (rework loop)"
    roles: [TaxDirector]
    code: 200
    input: []
    output: ValuationAllowance
    side_effects: []

  # --- UncertainTaxPosition ---
  - method: POST
    path: "/tax/uncertain-tax-positions"
    description: "Identify an uncertain tax position (TaxYear must be OPEN, PROVISION_LOCKED, or RETURNS_FILED)"
    roles: [TaxAccountant]
    code: 201
    input: [tax_year_id, jurisdiction_id, description, position_amount_cents]
    output: UncertainTaxPosition
    side_effects: ["status=IDENTIFIED"]

  - method: GET
    path: "/tax/uncertain-tax-positions"
    description: "List UTPs with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: UncertainTaxPosition[]
    side_effects: []

  - method: GET
    path: "/tax/uncertain-tax-positions/{positionId}"
    description: "Get one UTP (interest_accrued_cents recomputed against the clock on read)"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: UncertainTaxPosition
    side_effects: []

  - method: POST
    path: "/tax/uncertain-tax-positions/{positionId}/measure"
    description: "IDENTIFIED -> MEASURED (or MEASURED -> MEASURED re-measurement); applies the >50% recognition threshold"
    roles: [TaxManager]
    code: 200
    input: [cumulative_probability_bp]
    output: UncertainTaxPosition
    side_effects: ["recognized_benefit_cents/liability_cents/disclosure_required computed", "measured_on := clock date", "TaxYear.utp_liability_cents and forecast_etr_bp recomputed; increments TaxYear.version by 1"]

  - method: POST
    path: "/tax/uncertain-tax-positions/{positionId}/disclose"
    description: "MEASURED -> DISCLOSED; requires a READY/FILED/ACCEPTED Filing for the same (tax_year_id, jurisdiction_id)"
    roles: [TaxManager]
    code: 200
    input: []
    output: UncertainTaxPosition
    side_effects: []

  - method: POST
    path: "/tax/uncertain-tax-positions/{positionId}/settle"
    description: "DISCLOSED -> SETTLED; releases the reserve"
    roles: [TaxManager]
    code: 200
    input: [settled_amount_cents]
    output: UncertainTaxPosition
    side_effects: ["TaxYear.utp_liability_cents and forecast_etr_bp recomputed; increments TaxYear.version by 1"]

  # --- EstimatedPayment ---
  - method: POST
    path: "/tax/estimated-payments/generate-schedule"
    description: "Generate all four quarterly EstimatedPayments for a (tax_year_id, jurisdiction_id) pair; quarters tile the fiscal year in 3-month intervals from period_start_date, due_date = quarter period_end + 15 days; requires zero existing payments for the pair"
    roles: [TaxManager]
    code: 201
    input: [tax_year_id, jurisdiction_id, method]
    output: EstimatedPayment[]
    side_effects: ["Four EstimatedPayments created in quarter_index order per calculations.estimated_payment_schedule; each SCHEDULED with paid 0, penalty 0"]

  - method: POST
    path: "/tax/estimated-payments"
    description: "Manually create a single quarterly EstimatedPayment (client-supplied amount); enforces quarter uniqueness, closed-interval non-overlap, and exact contiguity with existing quarters of the pair"
    roles: [TaxManager]
    code: 201
    input: [tax_year_id, jurisdiction_id, quarter_index, period_start_date, period_end_date, due_date, method, scheduled_amount_cents]
    output: EstimatedPayment
    side_effects: ["base_scheduled_amount_cents := scheduled_amount_cents; status SCHEDULED"]

  - method: GET
    path: "/tax/estimated-payments"
    description: "List estimated payments with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "jurisdiction_id?", "status?", "method?", "limit?", "offset?"]
    output: EstimatedPayment[]
    side_effects: []

  - method: GET
    path: "/tax/estimated-payments/{paymentId}"
    description: "Get one EstimatedPayment"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: EstimatedPayment
    side_effects: []

  - method: POST
    path: "/tax/estimated-payments/{paymentId}/record-payment"
    description: "Record a payment against a quarter; transitions to PARTIALLY_PAID or PAID; never accepts an overpayment"
    roles: [TaxAccountant]
    code: 200
    input: [amount_cents]
    output: EstimatedPayment
    side_effects: ["paid_amount_cents += amount_cents", "status recompute per state machine"]

  - method: POST
    path: "/tax/estimated-payments/{paymentId}/reverse-payment"
    description: "Compensating reversal of a recorded payment; reduces paid_amount_cents and reverts status; never refunds penalty_cents"
    roles: [TaxManager]
    code: 200
    input: [amount_cents]
    output: EstimatedPayment
    side_effects: ["paid_amount_cents -= amount_cents", "status recompute per state machine"]

  # --- Filing ---
  - method: POST
    path: "/tax/filings"
    description: "Open a return filing slot for a (tax_year_id, jurisdiction_id) pair (requires TaxYear OPEN)"
    roles: [TaxAccountant]
    code: 201
    input: [tax_year_id, jurisdiction_id, original_due_date]
    output: Filing
    side_effects: ["status=PENDING, extension_status=NONE", "TaxYear.current_provision_cents recomputed (jurisdiction enters the current_tax_stack input set)"]

  - method: GET
    path: "/tax/filings"
    description: "List filings with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: Filing[]
    side_effects: []

  - method: GET
    path: "/tax/filings/{filingId}"
    description: "Get one Filing"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: Filing
    side_effects: []

  - method: POST
    path: "/tax/filings/{filingId}/mark-ready"
    description: "PENDING|AMENDED -> READY; attaches the return's tax liability"
    roles: [TaxAccountant]
    code: 200
    input: [return_tax_liability_cents]
    output: Filing
    side_effects: ["return_tax_liability_cents set"]

  - method: POST
    path: "/tax/filings/{filingId}/file"
    description: "READY -> FILED; OCC on TaxYear.version; enforces filing deadline and UTP disclosure; fires the RTP cascade"
    roles: [TaxDirector]
    code: 200
    input: [expected_tax_year_version]
    output: Filing
    side_effects: ["filed_on := clock date; is_late computed", "TaxYear.return_to_provision_adjustment_cents and actual_etr_bp recomputed", "CURRENT_YEAR_ANNUALIZED SCHEDULED payments of the jurisdiction re-spread per calculations.rtp_trueup", "Increments TaxYear.version by 1"]

  - method: POST
    path: "/tax/filings/{filingId}/accept"
    description: "FILED -> ACCEPTED (terminal)"
    roles: [TaxManager]
    code: 200
    input: []
    output: Filing
    side_effects: []

  - method: POST
    path: "/tax/filings/{filingId}/reject"
    description: "FILED -> REJECTED; the filing drops out of the RTP filed set"
    roles: [TaxManager]
    code: 200
    input: [rejection_reason]
    output: Filing
    side_effects: ["TaxYear.return_to_provision_adjustment_cents and actual_etr_bp recomputed; increments TaxYear.version by 1"]

  - method: POST
    path: "/tax/filings/{filingId}/amend"
    description: "REJECTED -> AMENDED; attaches the corrected liability"
    roles: [TaxAccountant]
    code: 200
    input: [return_tax_liability_cents]
    output: Filing
    side_effects: ["return_tax_liability_cents set"]

  - method: POST
    path: "/tax/filings/{filingId}/request-extension"
    description: "extension_status NONE -> REQUESTED (only while status in {PENDING, READY} and on/before the original due date)"
    roles: [TaxAccountant]
    code: 200
    input: []
    output: Filing
    side_effects: ["extension_status := REQUESTED"]

  - method: POST
    path: "/tax/filings/{filingId}/resolve-extension"
    description: "extension_status REQUESTED -> GRANTED | DENIED per decision input; GRANTED computes extended_due_date"
    roles: [TaxDirector]
    code: 200
    input: [decision]
    output: Filing
    side_effects: ["extension_status := decision", "When GRANTED: extended_due_date = add_months(original_due_date, Jurisdiction.extension_months)"]

  # --- TaxNotice ---
  - method: POST
    path: "/tax/notices"
    description: "Log an incoming jurisdiction notice (standalone or linked to an AuditCase)"
    roles: [TaxAccountant]
    code: 201
    input: [jurisdiction_id, "audit_case_id?", notice_type, received_on, response_due_on]
    output: TaxNotice
    side_effects: ["status=RECEIVED"]

  - method: GET
    path: "/tax/notices"
    description: "List notices with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["jurisdiction_id?", "audit_case_id?", "status?", "notice_type?", "limit?", "offset?"]
    output: TaxNotice[]
    side_effects: []

  - method: GET
    path: "/tax/notices/{noticeId}"
    description: "Get one TaxNotice"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: TaxNotice
    side_effects: []

  - method: POST
    path: "/tax/notices/{noticeId}/assign-review"
    description: "RECEIVED -> UNDER_REVIEW"
    roles: [TaxManager]
    code: 200
    input: []
    output: TaxNotice
    side_effects: []

  - method: POST
    path: "/tax/notices/{noticeId}/respond"
    description: "UNDER_REVIEW|OVERDUE -> RESPONDED"
    roles: [TaxManager]
    code: 200
    input: [response_text]
    output: TaxNotice
    side_effects: ["response_text set"]

  - method: POST
    path: "/tax/notices/{noticeId}/resolve"
    description: "RESPONDED -> RESOLVED (terminal)"
    roles: [TaxManager]
    code: 200
    input: []
    output: TaxNotice
    side_effects: []

  # --- AuditCase ---
  - method: POST
    path: "/tax/audits"
    description: "Open an audit for a (tax_year_id, jurisdiction_id) pair; exam period must not overlap a non-closed audit of the same jurisdiction (half-open [start, end))"
    roles: [TaxManager]
    code: 201
    input: [tax_year_id, jurisdiction_id, exam_period_start, exam_period_end]
    output: AuditCase
    side_effects: ["status=UNDER_EXAMINATION; opened_on := clock date"]

  - method: GET
    path: "/tax/audits"
    description: "List audits with optional filters"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: ["tax_year_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: AuditCase[]
    side_effects: []

  - method: GET
    path: "/tax/audits/{auditId}"
    description: "Get one AuditCase"
    roles: [TaxAccountant, TaxManager, TaxDirector, Auditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/tax/audits/{auditId}/propose-adjustment"
    description: "UNDER_EXAMINATION -> ADJUSTMENT_PROPOSED"
    roles: [TaxManager]
    code: 200
    input: [proposed_adjustment_cents]
    output: AuditCase
    side_effects: ["proposed_adjustment_cents set"]

  - method: POST
    path: "/tax/audits/{auditId}/negotiate"
    description: "ADJUSTMENT_PROPOSED -> NEGOTIATING"
    roles: [TaxManager]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/tax/audits/{auditId}/revise-adjustment"
    description: "NEGOTIATING -> ADJUSTMENT_PROPOSED with a revised amount (negotiation loop)"
    roles: [TaxManager]
    code: 200
    input: [proposed_adjustment_cents]
    output: AuditCase
    side_effects: ["proposed_adjustment_cents set to revised value"]

  - method: POST
    path: "/tax/audits/{auditId}/close"
    description: "UNDER_EXAMINATION -> CLOSED_NO_CHANGE (outcome NO_CHANGE) or ADJUSTMENT_PROPOSED|NEGOTIATING -> CLOSED_AGREED (outcome AGREED); all linked notices must be RESOLVED"
    roles: [TaxManager]
    code: 200
    input: [outcome, "agreed_adjustment_cents?"]
    output: AuditCase
    side_effects: ["agreed_adjustment_cents set when outcome == AGREED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ValuationAllowance approve attempted by the same X-User-ID that prepared it" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not identify an existing resource" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition is not defined from the entity's current state (includes terminal-state lockdown)" }
  - { id: ERR_PAYMENT_ALREADY_SETTLED, http: 409, condition: "record-payment attempted on an EstimatedPayment already PAID" }
  - { id: ERR_TAX_YEAR_NOT_OPEN, http: 409, condition: "Write requires TaxYear.status == OPEN (difference/filing/VA creation, difference and VA lifecycle actions)" }
  - { id: ERR_TAX_YEAR_NOT_LOCKED, http: 409, condition: "mark-ready or file requires TaxYear.status == PROVISION_LOCKED (or RETURNS_FILED for re-ready after amendment)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_tax_year_version does not match the TaxYear's current version (OCC)" }
  - { id: ERR_DUPLICATE_JURISDICTION_CODE, http: 409, condition: "Jurisdiction.code already exists" }
  - { id: ERR_DUPLICATE_QUARTER, http: 409, condition: "EstimatedPayment quarter_index already exists for the (tax_year_id, jurisdiction_id) pair, or generate-schedule called when payments already exist for the pair" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP, http: 409, condition: "AuditCase exam period [start, end) intersects a non-closed audit of the same jurisdiction; half-open adjacency (existing.end == new.start) is legal" }
  - { id: ERR_QUARTER_OVERLAP, http: 409, condition: "Manual quarter interval [start, end] (closed) intersects an existing quarter of the same (tax_year_id, jurisdiction_id); start == existing.end collides" }
  - { id: ERR_QUARTER_GAP, http: 422, condition: "Manual quarter not exactly contiguous: quarter_index > 1 must start the day after the highest existing period_end; quarter 1 must start on TaxYear.period_start_date" }
  - { id: ERR_EXTENSION_WINDOW_MISSED, http: 422, condition: "request-extension after the original due date (clock date > original_due_date)" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "file after the effective due date (extended_due_date when GRANTED else original_due_date)" }
  - { id: ERR_DATE_RANGE_INVALID, http: 422, condition: "Date range malformed: period_end <= period_start, response_due_on < received_on, due_date outside the quarter interval, exam_period_end <= exam_period_start" }
  - { id: ERR_UNRESOLVED_PROVISION_ITEMS, http: 422, condition: "lock-provision with a non-terminal BookTaxDifference, no APPROVED ValuationAllowance, or an IDENTIFIED UncertainTaxPosition" }
  - { id: ERR_UNFILED_RETURNS, http: 422, condition: "mark-returns-filed while any Filing of the year is not FILED or ACCEPTED" }
  - { id: ERR_UTP_UNDISCLOSED, http: 422, condition: "file while a disclosure-required UTP of the same (tax_year_id, jurisdiction_id) is still IDENTIFIED or MEASURED" }
  - { id: ERR_RETURN_NOT_READY, http: 422, condition: "disclose with no Filing in {READY, FILED, ACCEPTED} for the same (tax_year_id, jurisdiction_id)" }
  - { id: ERR_UNRESOLVED_NOTICES, http: 422, condition: "AuditCase close while a linked TaxNotice is not RESOLVED" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Monetary input out of range (non-positive liability/position/payment, reversal exceeding paid balance)" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "record-payment would push paid_amount_cents above scheduled_amount_cents" }
  - { id: ERR_PROBABILITY_OUT_OF_RANGE, http: 422, condition: "cumulative_probability_bp outside 0..10000" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum member, or wrong scalar type" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TaxAccountant
    description: "Staff tax accountant: identifies differences and UTPs, logs notices, opens filings, prepares returns, records estimated payments"
    identity: opaque
    exclusive_operations:
      - "POST /tax/book-tax-differences"
      - "POST /tax/uncertain-tax-positions"
      - "POST /tax/notices"
      - "POST /tax/filings"
      - "POST /tax/filings/{filingId}/mark-ready"
      - "POST /tax/filings/{filingId}/amend"
      - "POST /tax/filings/{filingId}/request-extension"
      - "POST /tax/estimated-payments/{paymentId}/record-payment"
    shared_operations: ["All GET endpoints"]

  - name: TaxManager
    description: "Tax manager: reviews and locks differences, owns valuation allowance preparation, measures/discloses/settles UTPs, schedules payments, responds to notices, runs audits"
    identity: opaque
    exclusive_operations:
      - "POST /tax/book-tax-differences/{differenceId}/review"
      - "POST /tax/book-tax-differences/{differenceId}/return-for-rework"
      - "POST /tax/book-tax-differences/{differenceId}/reject"
      - "POST /tax/valuation-allowances"
      - "POST /tax/valuation-allowances/{allowanceId}/submit"
      - "POST /tax/uncertain-tax-positions/{positionId}/measure"
      - "POST /tax/uncertain-tax-positions/{positionId}/disclose"
      - "POST /tax/uncertain-tax-positions/{positionId}/settle"
      - "POST /tax/estimated-payments"
      - "POST /tax/estimated-payments/generate-schedule"
      - "POST /tax/estimated-payments/{paymentId}/reverse-payment"
      - "POST /tax/filings/{filingId}/accept"
      - "POST /tax/filings/{filingId}/reject"
      - "POST /tax/notices/{noticeId}/assign-review"
      - "POST /tax/notices/{noticeId}/respond"
      - "POST /tax/notices/{noticeId}/resolve"
      - "POST /tax/audits"
      - "POST /tax/audits/{auditId}/propose-adjustment"
      - "POST /tax/audits/{auditId}/negotiate"
      - "POST /tax/audits/{auditId}/revise-adjustment"
      - "POST /tax/audits/{auditId}/close"
    shared_operations:
      - "All GET endpoints"
      - "POST /tax/tax-years (with TaxDirector)"
      - "POST /tax/jurisdictions (with TaxDirector)"
      - "POST /tax/book-tax-differences/{differenceId}/lock (with TaxDirector)"

  - name: TaxDirector
    description: "Tax director: locks the provision, files returns, approves valuation allowances (never own-prepared ones), resolves extensions, closes the year"
    identity: opaque
    exclusive_operations:
      - "POST /tax/tax-years/{taxYearId}/lock-provision"
      - "POST /tax/tax-years/{taxYearId}/mark-returns-filed"
      - "POST /tax/tax-years/{taxYearId}/close"
      - "POST /tax/valuation-allowances/{allowanceId}/approve"
      - "POST /tax/valuation-allowances/{allowanceId}/return"
      - "POST /tax/filings/{filingId}/file"
      - "POST /tax/filings/{filingId}/resolve-extension"
    shared_operations:
      - "All GET endpoints"
      - "POST /tax/tax-years (with TaxManager)"
      - "POST /tax/jurisdictions (with TaxManager)"
      - "POST /tax/book-tax-differences/{differenceId}/lock (with TaxManager)"

  - name: Auditor
    description: "Internal audit: read-only access to every resource; no write operations"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]

  - name: PlatformAdmin
    description: "Test-harness operator: controls the logical clock only; no business-surface access"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
