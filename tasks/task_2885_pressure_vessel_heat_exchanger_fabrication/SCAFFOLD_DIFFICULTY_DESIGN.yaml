  - rule_id: transitive_cascade
    instances:

      - name: transitive_nde_reject_propagates_exam_weld_ncr_job_and_data_report
        grounds:
          - state_machines.NDEExam.PENDING_to_REJECT
          - state_machines.ProductionWeld.nde_PLANNED_to_nde_REJECTED
          - state_machines.Nonconformance.initial_state_OPEN
          - state_machines.VesselJob.FABRICATION_to_NDE_HOLD
          - calculations.data_package_completeness
          - calculations.weld_completion_pct
          - entities.VesselJob.fields.nonconformance_open_count
        distinguishing_aspect: |
          One examination result propagates five levels down a chain of five DIFFERENT entities —
          NDEExam -> ProductionWeld -> Nonconformance -> VesselJob -> DataReport — and the fifth
          level is observable only as a recomputed derived field (missing_items gains the literal
          OPEN_NONCONFORMANCE on a DataReport that was assembled before the rejection).
        test_recipe:
          setup:
            - "Personnel: two DesignEngineers, one WeldingEngineer, one QCInspector."
            - "An ACTIVE certificate CA-U-8801 and a PRESSURE_VESSEL VesselJob J-2885-07 whose SHELL and HEAD sheets are APPROVED with rt_extent_declared FULL."
            - "Heat H-4471 (ACCEPTED, 2000 lb) has issued SH-01 (SHELL, 1200 lb) and HD-01 (HEAD, 600 lb), so the MATERIAL section covers 2 of 2 components."
            - "WPS-1 is QUALIFIED with pwht_required false; welder qualification W12 is QUALIFIED."
            - "The single joint W-001 (category B, BUTT, 1.5000 in) is WELDED, so required_volumetric_pct is 100 with volumetric_method RT, and the job is in FABRICATION."
            - "The nde-plan has created the single RT examination, which is still PENDING."
            - "A DataReport was assembled while the examination was PENDING, so it is ASSEMBLING with completeness_score 85.00 and missing_items [NDE]."
