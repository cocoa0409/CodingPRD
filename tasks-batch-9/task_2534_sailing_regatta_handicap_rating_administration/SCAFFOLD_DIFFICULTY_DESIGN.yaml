      - name: discard_activates_exactly_at_fifth_final_race
        boundary: "completed count against DISCARD_ONE_PER_FIVE_THRESHOLD 5 under discard_policy ONE_PER_FIVE; at 4 counted races the discard set is EMPTY, at 5 exactly one race drops"
        grounds:
          - calculations.series_standing
          - calculations.series_standing.constants.DISCARD_ONE_PER_FIVE_THRESHOLD
          - endpoints.GET_entries_id_series_standing
          - entities.Entry.fields.series_points_net
          - entities.Entry.fields.discarded_race_numbers
        distinguishing_aspect: |
          A different metric from the draft boundary: an integer set SIZE, not a continuous measurement,
          and the interesting edge is the EMPTY discard set. It is read through a different endpoint, the
          computed read GET /entries/{id}/series-standing. With four FINAL races the policy yields
          discard_count 0, so net equals gross and discarded_race_numbers is the empty list; the fifth
          FINAL race flips discard_count to 1 and net DROPS below gross for the first time. The same
          trigger also pins the equal-points discard tiebreak: entry B scored 2.0 in races 1, 2, 3 and 5,
          and the rule discards the HIGHEST race_number among equals, so B drops race 5 and not race 1.
        test_recipe:
          setup:
            - "Ten club members and two ISSUED TOD_PHRF certificates: A 171.3 and B 218.8."
            - "A LOW_POINT regatta with discard_policy ONE_PER_FIVE, planned_race_count 6 and fleet_minimum 2, division A CONFIRMED with both entries ACCEPTED, status RACING, three CONFIRMED whole-regatta duties from 12:00 to 20:00."
            - "Five races on 2026-08-05 at 14:00, 14:10, 14:20, 14:30 and 14:40, each DISTANCE_COASTAL over 6.0 nm, all created up front so the prestart windows are 10 minutes apart."
            - "The clock is set to 2026-08-05T18:00:00Z once, and races 1 to 4 are then started, resulted and SCORED to FINAL."
            - "Corrected times give A place 1 in races 1, 2 and 3 and place 2 in race 4: A elapsed 5027.8 corrects to 4000.0 while B elapsed 5412.8 corrects to 4100.0, and in race 4 A elapsed 5127.8 corrects to 4100.0 while B elapsed 5312.8 corrects to 4000.0."
            - "After four FINAL races A has 1.0, 1.0, 1.0, 2.0 and B has 2.0, 2.0, 2.0, 1.0."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
