              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { late_state: "$.data.delivery_state" }
          assert:
            - "Both creates returned HTTP 201 even though dep_early's window lies inside the blackout"
            - "The dep_early start returns HTTP 409 with error_id ERR_BLACKOUT_ACTIVE"
            - "Deployment.${dep_early}.delivery_state == SCHEDULED"
            - "The dep_late start returns HTTP 200 with Deployment.${dep_late}.delivery_state == IN_PROGRESS"
            - "Environment.${env_id}.active_deployment_count == 1"
            - "Release.${rel_id}.phase == STABILIZING"

      - name: duplicate_technical_approval_returns_duplicate_approval_kind
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_DUPLICATE_APPROVAL_KIND]
          - endpoints[POST /change-requests/{id}/approvals]
        distinguishing_aspect: "Approval kinds are one-per-change regardless of approver identity: a second TECHNICAL approval by a different ChangeApprover returns 409 ERR_DUPLICATE_APPROVAL_KIND, leaves approval_technical_count at 1, and the change stays RISK_CLASSIFIED because HIGH still owes a COMPLIANCE approval."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 OPEN on core-train."
            - "CR_H: 250 lines, 3 subsystems, schema migration, SINGLE_TENANT, no rollback plan -> 15+12+25+10 = 62 HIGH, requiring TECHNICAL and COMPLIANCE."
            - "u-appr-1 has already recorded the TECHNICAL approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: "$.data.id" }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Schema migration for orders", summary_internal: "three subsystems plus a migration", lines_changed: 250, touched_subsystem_count: 3, declared_blast_radius: "SINGLE_TENANT", has_schema_migration: true }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_h: "$.data.id" }
            - call: "POST /change-requests/${cr_h}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { prelim: "$.data.risk_score_preliminary" }
            - call: "POST /change-requests/${cr_h}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-1"
              captures: { appr1: "$.data.id" }
          trigger:
            - call: "POST /change-requests/${cr_h}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-2"
              captures: { err: "$.data.error_id" }
          assert:
            - "The submit pinned risk_score_preliminary == 62 and risk_class == HIGH"
            - "The trigger returns HTTP 409 with error_id ERR_DUPLICATE_APPROVAL_KIND"
            - "ChangeRequest.${cr_h}.approval_technical_count == 1"
            - "ChangeRequest.${cr_h}.approval_compliance_count == 0"
            - "ChangeRequest.${cr_h}.state == RISK_CLASSIFIED"
            - "GET /change-requests/${cr_h}/approvals returns total_count == 1"
            - "Release.${rel_id}.risk_budget_consumed_points == 0 and committed_change_count == 0"

      - name: create_rollout_step_on_enforced_stale_flag_returns_flag_cleanup_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_FLAG_CLEANUP_ENFORCED]
          - calculations.flag_stale_debt
          - endpoints[POST /feature-flags/{id}/rollout-steps]
        distinguishing_aspect: "Cleanup enforcement is a gate on new rollout work rather than on reads: the stale flag accepts no new step (409 ERR_FLAG_CLEANUP_ENFORCED) even with a fresh OCC token, while a COMPLIANT sibling flag swept in the same call still accepts one."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; flag_stale expires_at 2026-07-17T00:00:00Z (15 days past, orphaned -> debt 60) and flag_fresh expires_at 2026-12-01T00:00:00Z (debt 0), both owned by u-eng-1 and both DRAFT."
            - "One cleanup sweep has been run, so flag_stale.cleanup_state is ENFORCED and flag_fresh.cleanup_state is COMPLIANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "legacy-pricing", owner_user_id: "u-eng-1", expires_at: "2026-07-17T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_stale: "$.data.id" }
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_fresh: "$.data.id" }
            - call: "POST /flag-cleanup-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { enforced: "$.data.enforced_count" }
            - call: "GET /feature-flags/${flag_stale}"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { stale_v: "$.data.version", stale_cleanup: "$.data.cleanup_state" }
            - call: "GET /feature-flags/${flag_fresh}"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { fresh_v: "$.data.version" }
          trigger:
            - call: "POST /feature-flags/${flag_stale}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${stale_v}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /feature-flags/${flag_fresh}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${fresh_v}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { ok_step: "$.data.id" }
          assert:
            - "The sweep reported enforced_count == 1 and evaluated_count == 2"
            - "FeatureFlag.${flag_stale}.cleanup_state == ENFORCED with stale_debt_points == 60"
            - "FeatureFlag.${flag_fresh}.cleanup_state == COMPLIANT with stale_debt_points == 0"
            - "The first trigger returns HTTP 409 with error_id ERR_FLAG_CLEANUP_ENFORCED (not the 412 OCC error, since the token is current)"
            - "The second trigger returns HTTP 201 with FlagRolloutStep.${ok_step}.step_index == 1"
            - "GET /flag-rollout-steps filtered by feature_flag_id ${flag_stale} returns total_count == 0"

