  - name: corner_order_transmit_is_all_or_nothing_across_its_lines
    claim_type: bulk_action
    grounds:
    - endpoints[POST /dropship/orders/{id}/transmit]
    - validations[priority=32]
    - errors[ERR_VENDOR_BLACKOUT]
    - state_machines.DropshipOrderLine.PENDING_TRANSMIT_to_TRANSMITTED
    distinguishing_aspect: 'transmit is a bulk action over every PENDING_TRANSMIT line of the order and its failure
      semantics are rollback, not skip: one line whose vendor is in an ACTIVE blackout fails the whole call, so
      the other line - on a completely different and perfectly healthy vendor - is also left PENDING_TRANSMIT with
      transmitted_at null.'
    test_recipe:
      setup:
      - Vendor V1 is ACTIVE with an ACTIVE US-WEST / GROUND coverage row; offer I1 on V1 is ACTIVE with a fresh
        feed of 60 on-hand.
      - Vendor V2 is ACTIVE with an ACTIVE US-WEST / GROUND coverage row; offer I1B on V2 is ACTIVE with a fresh
        feed of 30 on-hand.
      - Order ORD-BULK-1 is created at 2026-08-03T10:00:00Z with line 1 of 1 unit on I1 and line 2 of 1 unit on
        I1B, so both lines are PENDING_TRANSMIT.
      - An ACTIVE VendorBlackout on V2 covering 2026-08-03 through 2026-08-04 is then recorded, after the order
        already exists.
