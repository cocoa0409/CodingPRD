        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints(GET /ach/ach-files/{id})"]
        distinguishing_aspect: "Immediate consistency: the append response itself and a subsequent GET expose recomputed totals and quoted fee in the same request timeline (quoted 320 = 200 + 60*2 for entries 1000+2000 at discount 0)."
        test_recipe:
          setup: ["Originator ACTIVE; NEXT_DAY window; file created"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Imm2 Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
          trigger:
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 1000, receiver_account: "im-1", receiver_routing: "123456789" }
                  - { direction: "DEBIT", amount_cents: 2000, receiver_account: "im-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "GET /ach/ach-files/${f_id}"
              payload: {}
              as: OdfiOperations
          assert:
            - "Append response AND GET agree: entry_count == 2, total_amount_cents == 3000, quoted_fee_cents == 320, version == 2"
            - "Response envelope: meta.api_request_id present, response_type == \"object\""
