              payload: { title: "Monograph I", item_type: "BOOK", publication_year: 2016, isbn: "978-0-000-00082-0", local_holding_status: "NONE" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { b2: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Monograph J", item_type: "BOOK", publication_year: 2017, isbn: "978-0-000-00083-7", local_holding_status: "NONE" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { b3: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Monograph K", item_type: "BOOK", publication_year: 2018, isbn: "978-0-000-00084-4", local_holding_status: "NONE" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { b4: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Monograph L", item_type: "BOOK", publication_year: 2019, isbn: "978-0-000-00085-1", local_holding_status: "NONE" }
              as: LibraryAdmin
