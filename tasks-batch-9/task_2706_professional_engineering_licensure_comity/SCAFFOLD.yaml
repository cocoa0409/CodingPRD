scenario: |
  Generate task harder than expert level!

  2706. Professional Engineering Licensure & Comity (state board of professional engineers):
  application review with education, examination and progressive experience verification,
  reference evaluation and experience credit determination by supervising engineer verification,
  examination approval, scheduling and score reporting through the national testing service,
  comity licensure for out-of-state applicants with credential verification through a national
  records program, firm registration, responsible charge and seal requirements for practice,
  continuing professional competency requirements with audit sampling, complaint investigation
  for negligence, unlicensed practice and plan stamping violations, disciplinary action,
  consent orders and license reinstatement

domain_name: professional-engineering-licensure-comity
api_prefix: ""   # flat topology: every resource collection is a top-level path segment

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at a top-level collection; parentage is expressed
  # purely through FK fields plus a handful of nested creation/sub-resource read paths.
  # No URL carries more than one {id} placeholder except sub-resource reads.

  state_machine_shape: parallel
  # Case carries two independent axes (investigation_status x sanction_status) on one row.
  # Application is cyclic (UNDER_REVIEW <-> DEFICIENT) AND branching (UNDER_REVIEW forks to
  # EXAM_APPROVED or LICENSE_ISSUED, rejoining at LICENSE_ISSUED with divergent side effects).
  # ExamAuthorization is cyclic (FAILED -> APPROVED_TO_SIT retake loop; SCHEDULED -> APPROVED_TO_SIT
  # cancel loop). License is cyclic (ACTIVE -> ACTIVE renew self-loop; EXPIRED/SUSPENDED -> ACTIVE).
  # FirmRegistration is posture-driven off its responsible-charge License.

  relationship_patterns:
    - one_to_many          # Application -> ExperienceRecord -> Reference; CPCReport -> PDHRecord
    - cross_aggregate      # Reference.referee_engineer_id crosses into the licensing aggregate
    - polymorphic          # Case targets either a License (respondent) or a PlanSubmission, or neither
    - self_referential     # CPCReport.supersedes_report_id points at another CPCReport

  role_model: segregation_of_duties
  # Nine roles. Board work is split so that the officer who approves exam eligibility is not the
  # reviewer who determined experience credit, the secretary who adjudicates a CPC audit outcome is
  # not the secretary who drew the audit sample, and the secretary who executes a consent order is
  # not the investigator assigned to the case. Enforced on X-User-ID, not only on X-User-Role.

  consistency_model: immediate

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the natural person known to the board
        constraints: non-empty, max 120 chars
      - name: email
        type: string
        source: input
        description: contact address, unique across Engineer rows
        constraints: unique; must contain '@'
      - name: home_jurisdiction
        type: string
        source: input
        description: two-letter USPS code of the engineer's primary jurisdiction
        constraints: exactly 2 uppercase letters
      - name: ncees_record_id
        type: string
        source: input
        description: identifier of this engineer's record in the national records program; null when none
        default: null
        constraints: null or 8-20 chars
      - name: active_license_number
        type: string
        source: computed
        description: >-
          license_number of this engineer's License whose status == ACTIVE; null when the engineer
          holds no ACTIVE License. Recomputed on every License mutation touching this engineer.
        default: null
      - name: open_case_count
        type: integer
        source: computed
        description: >-
          count of Case rows whose respondent_license_id belongs to this engineer and whose
          investigation_status IN {RECEIVED, INVESTIGATING, PROBABLE_CAUSE}
        default: 0

  - name: License
    parent: Engineer
    common_fields: true
    fields:
      - name: engineer_id
        type: string
        source: input
        description: FK -> Engineer.id; the natural person holding this license
      - name: license_number
        type: string
        source: system
        description: >-
          board-minted registration number, format "PE-<zero-padded 6-digit sequence>" assigned in
          ascending creation order starting at PE-000001
        constraints: unique
      - name: license_type
        type: enum
        source: input
        description: pathway under which the license was granted
        constraints: "one of: STANDARD, COMITY"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.License
        default: ACTIVE
        constraints: "one of: ACTIVE, EXPIRED, SUSPENDED, REVOKED"
      - name: issued_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the license took effect
      - name: current_period_start
        type: datetime
        source: computed
        description: start of the current biennial renewal period; see calculations.license_period_roll
      - name: current_period_end
        type: datetime
        source: computed
        description: end of the current biennial renewal period; see calculations.license_period_roll
      - name: renewal_window_opens_at
        type: datetime
        source: computed
        description: current_period_end minus RENEWAL_WINDOW_DAYS (90) days
      - name: pdh_requirement
        type: number
        source: input
        description: professional development hours owed for the current period
        default: 30
        constraints: ">= 0, at most 1 decimal place"
      - name: reinstatement_eligible_until
        type: datetime
        source: computed
        description: >-
          current_period_end plus REINSTATEMENT_GRACE_DAYS (730) days, stamped at the moment the
          license transitions ACTIVE -> EXPIRED; null while the license has never expired
        default: null
      - name: suspension_ends_at
        type: datetime
        source: computed
        description: >-
          set when a consent order with sanction_type SUSPENSION is executed; equals the execution
          instant plus ConsentOrder.suspension_months months; null otherwise
        default: null
      - name: discipline_flag
        type: boolean
        source: computed
        description: true once any ConsentOrder against this license has reached status EXECUTED
        default: false

  - name: Application
    parent: Engineer
    common_fields: true
    fields:
      - name: engineer_id
        type: string
        source: input
        description: FK -> Engineer.id; the applicant
      - name: pathway
        type: enum
        source: input
        description: licensure route requested
        constraints: "one of: STANDARD_EXAM, COMITY"
      - name: exam_code
        type: enum
        source: input
        description: discipline examination the applicant intends to sit; required for both pathways
        constraints: "one of: PE_CIVIL, PE_MECHANICAL, PE_ELECTRICAL"
      - name: expedite_requested
        type: boolean
        source: input
        description: whether the applicant paid for expedited review
        default: false
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.Application
        default: DRAFT
        constraints: "one of: DRAFT, SUBMITTED, UNDER_REVIEW, DEFICIENT, EXAM_APPROVED, LICENSE_ISSUED, DENIED, WITHDRAWN"
      - name: education_status
        type: enum
        source: system
        description: outcome of the board's education evaluation
        default: NOT_EVALUATED
        constraints: "one of: NOT_EVALUATED, EABET_ACCREDITED, NON_ACCREDITED_EVALUATED, REJECTED"
      - name: degree_level
        type: enum
        source: system
        description: highest engineering degree accepted by the education evaluation; null until evaluated
        default: null
        constraints: "null or one of: BS, MS, PHD"
      - name: provisional_experience_months
        type: integer
        source: computed
        description: >-
          self-reported experience credit; calculations.experience_credit_evaluation variant
          provisional_self_reported
        default: 0
      - name: verified_experience_months
        type: integer
        source: computed
        description: >-
          board-determined experience credit; calculations.experience_credit_evaluation variant
          verified_final
        default: 0
      - name: credit_determined_by_user_id
        type: string
        source: system
        description: >-
          opaque X-User-ID of the BoardReviewer who last ran the credit determination; null until
          POST /applications/{id}/credit-determination succeeds
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: opaque X-User-ID of the BoardReviewer who moved the application into UNDER_REVIEW
        default: null
      - name: deficiency_cycle_count
        type: integer
        source: system
        description: number of times the application has entered DEFICIENT
        default: 0
      - name: deficiency_reason
        type: string
        source: input
        description: free text recorded on the most recent DEFICIENT transition; cleared on response
        default: null
      - name: deficiency_due_at
        type: datetime
        source: computed
        description: >-
          the DEFICIENT transition instant plus DEFICIENCY_RESPONSE_DAYS (30) days; cleared when the
          applicant responds
        default: null
      - name: fee_assessment_cents
        type: integer
        source: computed
        description: total fee owed; see calculations.application_fee_assessment
        default: 0
      - name: fee_paid_cents
        type: integer
        source: computed
        description: cumulative sum of amount_cents across POST /applications/{id}/payments calls
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the DRAFT -> SUBMITTED transition; null while DRAFT
        default: null
      - name: ncees_record_status
        type: enum
        source: system
        description: state of the national-records-program credential verification for this application
        default: NOT_REQUESTED
        constraints: "one of: NOT_REQUESTED, MATCHED, MISMATCH"
      - name: ncees_verified_exam_pass
        type: boolean
        source: system
        description: whether the records program confirmed a passing discipline exam elsewhere
        default: false
      - name: ncees_verified_years_licensed
        type: integer
        source: system
        description: full years the records program confirms the applicant has been licensed elsewhere
        default: 0
      - name: ncees_disciplinary_history_count
        type: integer
        source: system
        description: count of disciplinary actions the records program reports against the applicant
        default: 0
      - name: ncees_record_expires_on
        type: datetime
        source: system
        description: instant after which the transmitted records-program packet is stale; null when none
        default: null
      - name: denial_reason
        type: string
        source: input
        description: free text recorded on the transition into DENIED
        default: null

  - name: ExperienceRecord
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this claimed experience belongs to
      - name: employer_name
        type: string
        source: input
        description: employer under which the experience was gained
        constraints: non-empty, max 120 chars
      - name: position_title
        type: string
        source: input
        description: title held during the period
        constraints: non-empty, max 120 chars
      - name: period_start_month
        type: string
        source: input
        description: first month of the claimed period, "YYYY-MM"
        constraints: matches ^[0-9]{4}-(0[1-9]|1[0-2])$
      - name: period_end_month
        type: string
        source: input
        description: last month of the claimed period, "YYYY-MM", inclusive
        constraints: matches ^[0-9]{4}-(0[1-9]|1[0-2])$ and >= period_start_month
      - name: responsibility_level
        type: enum
        source: input
        description: degree of engineering responsibility exercised during the period
        constraints: "one of: SUBORDINATE, PROGRESSIVE, RESPONSIBLE_CHARGE"
      - name: post_degree
        type: boolean
        source: input
        description: whether the period falls entirely after the qualifying degree was conferred
      - name: raw_months
        type: integer
        source: computed
        description: >-
          inclusive month span of [period_start_month, period_end_month]; see
          calculations.experience_credit_evaluation step 1
        default: 0
      - name: credit_multiplier
        type: number
        source: computed
        description: >-
          product of the responsibility multiplier and the post-degree factor applied to raw_months;
          see calculations.experience_credit_evaluation steps 2-3
        default: 0
      - name: credited_months
        type: integer
        source: computed
        description: >-
          months this record contributes to Application.verified_experience_months; 0 while
          verification_status != VERIFIED
        default: 0
      - name: verification_status
        type: enum
        source: system
        description: supervising-engineer verification state of this record
        default: UNVERIFIED
        constraints: "one of: UNVERIFIED, PENDING_VERIFICATION, VERIFIED, DISPUTED, RECANTED"

  - name: Reference
    parent: ExperienceRecord
    common_fields: true
    fields:
      - name: experience_record_id
        type: string
        source: input
        description: FK -> ExperienceRecord.id; the record this reference attests to
      - name: referee_engineer_id
        type: string
        source: input
        description: FK -> Engineer.id; the supervising engineer asked to verify
      - name: relationship
        type: enum
        source: input
        description: relationship of the referee to the applicant during the claimed period
        constraints: "one of: DIRECT_SUPERVISOR, PROJECT_MANAGER, PEER"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.Reference
        default: REQUESTED
        constraints: "one of: REQUESTED, SUBMITTED, ACCEPTED, REJECTED, RECANTED"
      - name: evaluation_score
        type: integer
        source: input
        description: referee's overall competency rating, 1 (lowest) to 5 (highest); null until submitted
        default: null
        constraints: null or integer in [1, 5]
      - name: months_confirmed
        type: integer
        source: input
        description: months of the claimed period the referee personally confirms; null until submitted
        default: null
        constraints: null or >= 0
      - name: responsibility_confirmed
        type: boolean
        source: input
        description: whether the referee confirms the claimed responsibility_level; null until submitted
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the REQUESTED -> SUBMITTED transition
        default: null
      - name: recant_reason
        type: string
        source: input
        description: free text recorded on the ACCEPTED -> RECANTED transition
        default: null

  - name: TestCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the national testing service centre
        constraints: non-empty, max 120 chars
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code where the centre sits
        constraints: exactly 2 uppercase letters
      - name: seat_labels
        type: array
        source: input
        description: >-
          ordered list of distinct workstation labels the centre offers, e.g. ["S1", "S2"]; the array
          length is the centre's seat_count
        constraints: 1-20 distinct non-empty strings
      - name: seat_count
        type: integer
        source: computed
        description: length of seat_labels
      - name: seats_committed
        type: integer
        source: computed
        description: >-
          count of ExamAppointment rows on this centre whose status == SCHEDULED; see
          calculations.test_center_seat_ledger
        default: 0
      - name: seats_available
        type: integer
        source: computed
        description: seat_count minus seats_committed; conserved quantity of the seat invariant
        default: 0
      - name: status
        type: enum
        source: input
        description: whether the centre accepts new appointments
        default: OPEN
        constraints: "one of: OPEN, SUSPENDED"

  - name: ExamAuthorization
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application that earned the authorization
      - name: exam_code
        type: enum
        source: system
        description: copied from Application.exam_code at creation
        constraints: "one of: PE_CIVIL, PE_MECHANICAL, PE_ELECTRICAL"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.ExamAuthorization
        default: APPROVED_TO_SIT
        constraints: "one of: APPROVED_TO_SIT, SCHEDULED, PASSED, FAILED, EXPIRED, CANCELLED"
      - name: authorization_expires_at
        type: datetime
        source: computed
        description: >-
          creation instant plus AUTHORIZATION_VALID_DAYS (365) days; not extended by retakes
      - name: attempt_number
        type: integer
        source: system
        description: 1-based index of the sitting currently authorized
        default: 1
      - name: raw_score
        type: integer
        source: system
        description: score transmitted by the national testing service; null until reported
        default: null
        constraints: null or integer in [0, 100]
      - name: result
        type: enum
        source: system
        description: pass/fail outcome of the most recent scored sitting
        default: PENDING
        constraints: "one of: PENDING, PASS, FAIL"
      - name: retake_eligible_at
        type: datetime
        source: computed
        description: >-
          the scoring instant plus RETAKE_WAIT_DAYS (90) days; null until a FAIL is reported
        default: null
      - name: ncees_transmission_id
        type: string
        source: system
        description: opaque transmission handle supplied by the national testing service with the score
        default: null

  - name: ExamAppointment
    parent: ExamAuthorization
    common_fields: true
    fields:
      - name: exam_authorization_id
        type: string
        source: input
        description: FK -> ExamAuthorization.id; the authorization being seated
      - name: test_center_id
        type: string
        source: input
        description: FK -> TestCenter.id; the centre holding the seat
      - name: seat_label
        type: string
        source: input
        description: workstation label reserved; must be a member of TestCenter.seat_labels
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the seated window; half-open interval start
      - name: window_end
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC end of the seated window, exclusive; must be exactly
          EXAM_WINDOW_MINUTES (480) minutes after window_start
      - name: status
        type: enum
        source: system
        description: lifecycle state of the seat occupation
        default: SCHEDULED
        constraints: "one of: SCHEDULED, COMPLETED, CANCELLED_BY_CANDIDATE, CANCELLED_BY_BOARD"

  - name: FirmRegistration
    parent: null
    common_fields: true
    fields:
      - name: firm_name
        type: string
        source: input
        description: registered business name of the engineering firm
        constraints: non-empty, max 160 chars, unique
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the firm's registered office
        constraints: exactly 2 uppercase letters
      - name: responsible_charge_license_id
        type: string
        source: input
        description: >-
          FK -> License.id; the single license currently in responsible charge of the firm's
          engineering practice
      - name: status
        type: enum
        source: system
        description: >-
          posture derived from the responsible-charge License; see
          calculations.firm_responsible_charge_posture
        default: ACTIVE
        constraints: "one of: ACTIVE, LAPSED_NO_RESPONSIBLE_CHARGE, EXPIRED, REVOKED"
      - name: registration_expires_at
        type: datetime
        source: computed
        description: creation instant plus FIRM_REGISTRATION_DAYS (365) days
      - name: lapsed_at
        type: datetime
        source: computed
        description: >-
          logical-clock instant of the most recent ACTIVE -> LAPSED_NO_RESPONSIBLE_CHARGE transition;
          cleared when the firm returns to ACTIVE
        default: null

  - name: PlanSubmission
    parent: FirmRegistration
    common_fields: true
    fields:
      - name: firm_registration_id
        type: string
        source: input
        description: FK -> FirmRegistration.id; the firm submitting the plan set
      - name: project_name
        type: string
        source: input
        description: project the plan set describes
        constraints: non-empty, max 160 chars
      - name: sheet_count
        type: integer
        source: input
        description: number of drawing sheets in the set; drives the per-sheet stamping penalty component
        constraints: integer >= 1, <= 500
      - name: sealing_license_id
        type: string
        source: input
        description: FK -> License.id; the license whose seal was affixed; null while DRAFT
        default: null
      - name: responsible_charge_attested
        type: boolean
        source: input
        description: whether the sealer attested to having been in responsible charge
        default: false
      - name: seal_affixed_at
        type: datetime
        source: computed
        description: logical-clock instant of the DRAFT -> SEALED transition
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.PlanSubmission
        default: DRAFT
        constraints: "one of: DRAFT, SEALED, FLAGGED, VOIDED"

  - name: CPCAudit
    parent: null
    common_fields: true
    fields:
      - name: audit_cycle_label
        type: string
        source: input
        description: human label of the audit draw, e.g. "2026-BIENNIUM-A"
        constraints: non-empty, max 40 chars, unique
      - name: sample_pct
        type: number
        source: input
        description: fraction of the eligible pool to draw
        constraints: number in (0, 1]
      - name: as_of_period_end
        type: datetime
        source: input
        description: renewal-period end date that defines the eligible pool
      - name: pool_size
        type: integer
        source: computed
        description: eligible CPCReport count; see calculations.cpc_audit_sampling
        default: 0
      - name: sampled_count
        type: integer
        source: computed
        description: number of reports actually drawn; see calculations.cpc_audit_sampling
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: >-
          opaque X-User-ID of the BoardSecretary who drew the sample; the segregation-of-duties bar
          for POST /cpc-reports/{id}/audit-decision
      - name: status
        type: enum
        source: system
        description: whether the draw has been performed
        default: SAMPLED
        constraints: "one of: SAMPLED, CLOSED"

  - name: CPCReport
    parent: License
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: FK -> License.id; the license this competency report covers
      - name: period_start
        type: datetime
        source: input
        description: start of the renewal period being reported
      - name: period_end
        type: datetime
        source: input
        description: end of the renewal period being reported; must equal License.current_period_end
      - name: self_certified_pdh
        type: number
        source: input
        description: total PDH the licensee declares for the period, used as a cross-check at acceptance
        constraints: ">= 0, at most 1 decimal place"
      - name: carryover_pdh_claimed
        type: number
        source: input
        description: PDH carried over from the prior period, capped at MAX_CARRYOVER_PDH (15)
        default: 0
        constraints: ">= 0, at most 1 decimal place"
      - name: self_certified_total_pdh
        type: number
        source: computed
        description: >-
          calculations.cpc_pdh_valuation variant self_certified; recomputed on every PDHRecord
          mutation under this report
        default: 0
      - name: audit_verified_total_pdh
        type: number
        source: computed
        description: >-
          calculations.cpc_pdh_valuation variant audit_verified; recomputed on every PDHRecord
          documentation review and on the audit decision
        default: 0
      - name: shortfall_pdh
        type: number
        source: computed
        description: >-
          deficiency against License.pdh_requirement plus any ethics deficiency, evaluated under the
          variant that applies to the report's current status
        default: 0
      - name: audit_id
        type: string
        source: system
        description: FK -> CPCAudit.id; the draw that selected this report; null when never sampled
        default: null
      - name: supersedes_report_id
        type: string
        source: system
        description: >-
          FK -> CPCReport.id; the earlier SUBMITTED report for the same license and period that this
          report replaced; null when this is the first report for the period
        default: null
      - name: audit_decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the BoardSecretary who adjudicated the audit outcome
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.CPCReport
        default: SUBMITTED
        constraints: "one of: SUBMITTED, SUPERSEDED, ACCEPTED, UNDER_AUDIT, AUDIT_CLEARED, AUDIT_DEFICIENT"

  - name: PDHRecord
    parent: CPCReport
    common_fields: false
    fields:
      - name: cpc_report_id
        type: string
        source: input
        description: FK -> CPCReport.id; the report this activity is claimed under
      - name: activity_type
        type: enum
        source: input
        description: category of professional development activity
        constraints: "one of: COURSE, SEMINAR, TEACHING, PUBLICATION, PATENT, SELF_STUDY"
      - name: pdh_hours
        type: number
        source: input
        description: hours claimed for this activity
        constraints: "> 0, <= 40, at most 1 decimal place"
      - name: completed_on
        type: datetime
        source: input
        description: instant the activity was completed; must fall inside the report's period
      - name: ethics_flag
        type: boolean
        source: input
        description: whether the activity carried professional-ethics content
        default: false
      - name: documentation_status
        type: enum
        source: system
        description: board review state of the supporting documentation
        default: NONE
        constraints: "one of: NONE, ACCEPTED, REJECTED"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: allegation_type
        type: enum
        source: input
        description: statutory category of the complaint
        constraints: "one of: NEGLIGENCE, UNLICENSED_PRACTICE, PLAN_STAMPING, CPC_FRAUD"
      - name: respondent_license_id
        type: string
        source: input
        description: FK -> License.id; the licensed respondent; null for unlicensed-practice complaints
        default: null
      - name: subject_plan_submission_id
        type: string
        source: input
        description: FK -> PlanSubmission.id; the plan set at issue; null when the complaint is not about a plan set
        default: null
      - name: unlicensed_respondent_name
        type: string
        source: input
        description: name of the unlicensed respondent; null when respondent_license_id is set
        default: null
      - name: complainant_name
        type: string
        source: input
        description: name of the party filing the complaint
        constraints: non-empty, max 120 chars
      - name: received_on
        type: datetime
        source: input
        description: instant the board received the complaint
      - name: investigation_status
        type: enum
        source: system
        description: first independent axis; see state_machines.Case
        default: RECEIVED
        constraints: "one of: RECEIVED, INVESTIGATING, PROBABLE_CAUSE, NO_CAUSE, CLOSED"
      - name: sanction_status
        type: enum
        source: system
        description: second independent axis; see state_machines.Case
        default: NONE
        constraints: "one of: NONE, PROPOSED, CONSENT_EXECUTED, HEARING_REFERRED"
      - name: assigned_investigator_user_id
        type: string
        source: system
        description: >-
          opaque X-User-ID of the BoardInvestigator who opened the investigation; the
          segregation-of-duties bar for POST /consent-orders/{id}/execute
        default: null
      - name: aggravating_factor_count
        type: integer
        source: input
        description: statutory aggravating factors found; recorded on the finding
        default: 0
        constraints: integer in [0, 8]
      - name: mitigating_factor_count
        type: integer
        source: input
        description: statutory mitigating factors found; recorded on the finding
        default: 0
        constraints: integer in [0, 8]
      - name: violation_count
        type: integer
        source: input
        description: number of distinct statutory violations found; recorded on the finding
        default: 0
        constraints: integer in [0, 20]
      - name: penalty_factor
        type: number
        source: computed
        description: clamped aggravation/mitigation factor; see calculations.civil_penalty_assessment
        default: 0
      - name: assessed_penalty_cents
        type: integer
        source: computed
        description: civil penalty owed; see calculations.civil_penalty_assessment
        default: 0

  - name: ConsentOrder
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> Case.id; the case this negotiated order settles
      - name: sanction_type
        type: enum
        source: input
        description: discipline the order imposes
        constraints: "one of: REPRIMAND, SUSPENSION, REVOCATION"
      - name: suspension_months
        type: integer
        source: input
        description: length of suspension in months; must be 0 unless sanction_type == SUSPENSION
        default: 0
        constraints: integer in [0, 60]
      - name: penalty_cents
        type: integer
        source: computed
        description: copied from Case.assessed_penalty_cents at proposal time
        default: 0
      - name: penalty_paid_cents
        type: integer
        source: input
        description: cents the respondent has remitted toward the penalty
        default: 0
        constraints: integer >= 0
      - name: executed_on
        type: datetime
        source: input
        description: instant the board executed the order; null while PROPOSED
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the BoardSecretary who executed the order
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.ConsentOrder
        default: PROPOSED
        constraints: "one of: PROPOSED, SUPERSEDED, EXECUTED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Application
    initial_state: DRAFT
    terminal_states: [LICENSE_ISSUED, DENIED, WITHDRAWN]
    shape: "branching with revert cycle (UNDER_REVIEW <-> DEFICIENT) and a fork-join at LICENSE_ISSUED"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{application_id}/submit"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT"
          - "Application.engineer_id == X-User-ID"
          - "Application.education_status IN {EABET_ACCREDITED, NON_ACCREDITED_EVALUATED}"
          - "count(ExperienceRecord where application_id == Application.id) >= 1"
          - "Application.fee_paid_cents >= Application.fee_assessment_cents"
        side_effects:
          - "recompute Application.fee_assessment_cents via calculations.application_fee_assessment and freeze it (no further recomputation after this transition)"
          - "stamp Application.submitted_at = logical clock now"
          - "for every ExperienceRecord under this Application with verification_status == UNVERIFIED that has at least one Reference row: set verification_status = PENDING_VERIFICATION"
          - "recompute Application.provisional_experience_months via calculations.experience_credit_evaluation variant provisional_self_reported"
          - "increments Application.version by 1"
        note: "ERR_EDUCATION_NOT_EVALUATED when education_status IN {NOT_EVALUATED, REJECTED}; ERR_FEE_UNPAID when underpaid"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{application_id}/start-review"
        actor: BoardReviewer
        preconditions:
          - "Application.status == SUBMITTED"
        side_effects:
          - "set Application.reviewer_user_id = X-User-ID"
          - "increments Application.version by 1"

      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /applications/{application_id}/deficiency"
        actor: BoardReviewer
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.deficiency_cycle_count < MAX_DEFICIENCY_CYCLES (3)"
        side_effects:
          - "increment Application.deficiency_cycle_count by 1"
          - "set Application.deficiency_reason = request deficiency_reason"
          - "set Application.deficiency_due_at = logical clock now + DEFICIENCY_RESPONSE_DAYS (30) days"
          - "increments Application.version by 1"

      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /applications/{application_id}/respond-deficiency"
        actor: Applicant
        preconditions:
          - "Application.status == DEFICIENT"
          - "Application.engineer_id == X-User-ID"
          - "logical clock now <= Application.deficiency_due_at"
        side_effects:
          - "clear Application.deficiency_reason to null and Application.deficiency_due_at to null"
          - "recompute Application.provisional_experience_months via calculations.experience_credit_evaluation variant provisional_self_reported"
          - "increments Application.version by 1"
        note: "revert edge closing the UNDER_REVIEW <-> DEFICIENT cycle; deficiency_cycle_count is NOT decremented"

      - from: DEFICIENT
        to: DENIED
        trigger: "POST /applications/{application_id}/deny"
        actor: BoardLicensingOfficer
        preconditions:
          - "Application.status == DEFICIENT"
          - "logical clock now > Application.deficiency_due_at OR Application.deficiency_cycle_count == MAX_DEFICIENCY_CYCLES (3)"
        side_effects:
          - "set Application.denial_reason = request denial_reason"
          - "increments Application.version by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{application_id}/deny"
        actor: BoardLicensingOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.ncees_record_status == MISMATCH OR Application.education_status == REJECTED"
        side_effects:
          - "set Application.denial_reason = request denial_reason"
          - "increments Application.version by 1"

      - from: UNDER_REVIEW
        to: EXAM_APPROVED
        trigger: "POST /applications/{application_id}/approve-exam"
        actor: BoardLicensingOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.pathway == STANDARD_EXAM"
          - "Application.credit_determined_by_user_id != null"
          - "X-User-ID != Application.credit_determined_by_user_id"
          - "every Reference on every ExperienceRecord of this Application has status IN {ACCEPTED, REJECTED} (none left REQUESTED or SUBMITTED)"
          - "Application.verified_experience_months >= MIN_EXPERIENCE_MONTHS (48)"
        side_effects:
          - "create one ExamAuthorization with status APPROVED_TO_SIT, exam_code copied from Application.exam_code, attempt_number 1, result PENDING and authorization_expires_at = logical clock now + AUTHORIZATION_VALID_DAYS (365) days"
          - "increments Application.version by 1"
        note: "fork branch A; ERR_EXPERIENCE_INSUFFICIENT at 47 months, success at exactly 48"

      - from: UNDER_REVIEW
        to: LICENSE_ISSUED
        trigger: "POST /applications/{application_id}/issue-license"
        actor: BoardLicensingOfficer
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.pathway == COMITY"
          - "Application.credit_determined_by_user_id != null"
          - "X-User-ID != Application.credit_determined_by_user_id"
          - "Application.ncees_record_status == MATCHED"
          - "logical clock now <= Application.ncees_record_expires_on"
          - "Application.ncees_verified_exam_pass == true"
          - "Application.ncees_verified_years_licensed >= COMITY_MIN_YEARS (4)"
          - "Application.verified_experience_months >= MIN_EXPERIENCE_MONTHS (48)"
          - "no License exists with engineer_id == Application.engineer_id and status == ACTIVE"
        side_effects:
          - "create one License with license_type COMITY, status ACTIVE, issued_on = logical clock now, pdh_requirement DEFAULT_PDH_REQUIREMENT (30) and periods set by calculations.license_period_roll"
          - "recompute Engineer.active_license_number for Application.engineer_id"
          - "increments Application.version by 1"
        note: "fork branch B — comity applicants never receive an ExamAuthorization; divergent side-effect set from branch A"

      - from: EXAM_APPROVED
        to: LICENSE_ISSUED
        trigger: "POST /applications/{application_id}/issue-license"
        actor: BoardLicensingOfficer
        preconditions:
          - "Application.status == EXAM_APPROVED"
          - "Application.pathway == STANDARD_EXAM"
          - "the ExamAuthorization under this Application has status PASSED"
          - "Application.verified_experience_months >= MIN_EXPERIENCE_MONTHS (48)"
          - "no License exists with engineer_id == Application.engineer_id and status == ACTIVE"
        side_effects:
          - "create one License with license_type STANDARD, status ACTIVE, issued_on = logical clock now, pdh_requirement DEFAULT_PDH_REQUIREMENT (30) and periods set by calculations.license_period_roll"
          - "recompute Engineer.active_license_number for Application.engineer_id"
          - "increments Application.version by 1"
        note: "join edge — both fork branches terminate at LICENSE_ISSUED but with different license_type and different preconditions"

      - from: EXAM_APPROVED
        to: DEFICIENT
        trigger: "system cascade, link 3 of the reference-recant chain fired by POST /references/{reference_id}/recant"
        actor: system
        preconditions:
          - "Application.status == EXAM_APPROVED"
          - "the recomputed Application.verified_experience_months < MIN_EXPERIENCE_MONTHS (48)"
        side_effects:
          - "increment Application.deficiency_cycle_count by 1"
          - "set Application.deficiency_reason = 'EXPERIENCE_CREDIT_WITHDRAWN'"
          - "set Application.deficiency_due_at = logical clock now + DEFICIENCY_RESPONSE_DAYS (30) days"
          - "link 4: the ExamAuthorization under this Application whose status IN {APPROVED_TO_SIT, SCHEDULED} transitions to CANCELLED"
          - "increments Application.version by 1"
        note: "auto-transition; the ExamAuthorization cancellation in link 4 is caused by THIS transition, not by the recant call"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{application_id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT"
          - "Application.engineer_id == X-User-ID"
        side_effects:
          - "increments Application.version by 1"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{application_id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.engineer_id == X-User-ID"
        side_effects:
          - "set every ExperienceRecord under this Application whose verification_status == PENDING_VERIFICATION back to UNVERIFIED"
          - "increments Application.version by 1"

  - entity: Reference
    initial_state: REQUESTED
    terminal_states: [REJECTED, RECANTED]
    shape: "branching (SUBMITTED forks to ACCEPTED or REJECTED) with a compensating ACCEPTED -> RECANTED edge"
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /references/{reference_id}/submit"
        actor: SupervisingEngineer
        preconditions:
          - "Reference.status == REQUESTED"
          - "Reference.referee_engineer_id == X-User-ID"
          - "a License exists with engineer_id == Reference.referee_engineer_id and status == ACTIVE"
          - "the parent ExperienceRecord.verification_status == PENDING_VERIFICATION"
        side_effects:
          - "set Reference.evaluation_score, Reference.months_confirmed and Reference.responsibility_confirmed from the request body"
          - "stamp Reference.submitted_at = logical clock now"
          - "increments Reference.version by 1"
        note: "ERR_REFEREE_LICENSE_INACTIVE when the referee holds no ACTIVE License"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /references/{reference_id}/evaluate with decision ACCEPT"
        actor: BoardReviewer
        preconditions:
          - "Reference.status == SUBMITTED"
          - "Reference.evaluation_score >= MIN_ACCEPTABLE_REFERENCE_SCORE (3)"
          - "Reference.responsibility_confirmed == true"
        side_effects:
          - "the parent ExperienceRecord transitions PENDING_VERIFICATION -> VERIFIED"
          - "recompute ExperienceRecord.raw_months, ExperienceRecord.credit_multiplier and ExperienceRecord.credited_months via calculations.experience_credit_evaluation"
          - "recompute Application.verified_experience_months via calculations.experience_credit_evaluation variant verified_final"
          - "increments Reference.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /references/{reference_id}/evaluate with decision REJECT"
        actor: BoardReviewer
        preconditions:
          - "Reference.status == SUBMITTED"
        side_effects:
          - "the parent ExperienceRecord transitions PENDING_VERIFICATION -> DISPUTED"
          - "set ExperienceRecord.credited_months = 0"
          - "recompute Application.verified_experience_months via calculations.experience_credit_evaluation variant verified_final"
          - "increments Reference.version by 1"
        note: "divergent side-effect set from the ACCEPT branch: DISPUTED instead of VERIFIED and credited_months forced to 0"

      - from: ACCEPTED
        to: RECANTED
        trigger: "POST /references/{reference_id}/recant"
        actor: SupervisingEngineer
        preconditions:
          - "Reference.status == ACCEPTED"
          - "Reference.referee_engineer_id == X-User-ID"
          - "the parent Application.status IN {UNDER_REVIEW, DEFICIENT, EXAM_APPROVED}"
        side_effects:
          - "set Reference.recant_reason = request recant_reason"
          - "link 2: the parent ExperienceRecord transitions VERIFIED -> RECANTED and its credited_months is set to 0"
          - "link 3: caused by link 2, Application.verified_experience_months is recomputed; when the Application is EXAM_APPROVED and the new value < MIN_EXPERIENCE_MONTHS (48) the Application transitions EXAM_APPROVED -> DEFICIENT"
          - "link 4: caused by link 3, the Application's ExamAuthorization whose status IN {APPROVED_TO_SIT, SCHEDULED} transitions to CANCELLED"
          - "link 5: caused by link 4, every ExamAppointment under that authorization whose status == SCHEDULED transitions to CANCELLED_BY_BOARD, and each such transition decrements its TestCenter.seats_committed by 1 and increments TestCenter.seats_available by 1"
          - "increments Reference.version by 1"
        note: "depth-5 transitive cascade Reference -> ExperienceRecord -> Application -> ExamAuthorization -> ExamAppointment -> TestCenter; also the compensating half of the experience-credit ledger invariant"

  - entity: ExperienceRecord
    initial_state: UNVERIFIED
    terminal_states: [RECANTED]
    shape: "linear with a compensating VERIFIED -> RECANTED edge; state field is verification_status"
    transitions:
      - from: UNVERIFIED
        to: PENDING_VERIFICATION
        trigger: "POST /applications/{application_id}/submit (bulk side effect) or POST /experience-records/{experience_record_id}/references on an already-SUBMITTED application"
        actor: Applicant
        preconditions:
          - "ExperienceRecord.verification_status == UNVERIFIED"
          - "at least one Reference row exists for this ExperienceRecord"
        side_effects:
          - "increments ExperienceRecord.version by 1"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "side effect of Reference SUBMITTED -> ACCEPTED"
        actor: system
        preconditions:
          - "ExperienceRecord.verification_status == PENDING_VERIFICATION"
        side_effects:
          - "set ExperienceRecord.credited_months per calculations.experience_credit_evaluation variant verified_final"
          - "increments ExperienceRecord.version by 1"
      - from: PENDING_VERIFICATION
        to: DISPUTED
        trigger: "side effect of Reference SUBMITTED -> REJECTED"
        actor: system
        preconditions:
          - "ExperienceRecord.verification_status == PENDING_VERIFICATION"
        side_effects:
          - "set ExperienceRecord.credited_months = 0"
          - "increments ExperienceRecord.version by 1"
      - from: VERIFIED
        to: RECANTED
        trigger: "side effect of Reference ACCEPTED -> RECANTED (cascade link 2)"
        actor: system
        preconditions:
          - "ExperienceRecord.verification_status == VERIFIED"
        side_effects:
          - "set ExperienceRecord.credited_months = 0"
          - "increments ExperienceRecord.version by 1"
      - from: PENDING_VERIFICATION
        to: UNVERIFIED
        trigger: "side effect of Application UNDER_REVIEW -> WITHDRAWN"
        actor: system
        preconditions:
          - "ExperienceRecord.verification_status == PENDING_VERIFICATION"
        side_effects:
          - "increments ExperienceRecord.version by 1"

  - entity: ExamAuthorization
    initial_state: APPROVED_TO_SIT
    terminal_states: [PASSED, EXPIRED, CANCELLED]
    shape: "cyclic — SCHEDULED -> APPROVED_TO_SIT on cancellation and FAILED -> APPROVED_TO_SIT on retake both loop back"
    transitions:
      - from: APPROVED_TO_SIT
        to: SCHEDULED
        trigger: "POST /exam-appointments"
        actor: Applicant
        preconditions:
          - "ExamAuthorization.status == APPROVED_TO_SIT"
          - "the parent Application.status == EXAM_APPROVED"
          - "the parent Application.engineer_id == X-User-ID"
          - "logical clock now < ExamAuthorization.authorization_expires_at"
          - "TestCenter.status == OPEN"
          - "request seat_label IN TestCenter.seat_labels"
          - "window_end - window_start == EXAM_WINDOW_MINUTES (480) minutes exactly"
          - "TestCenter.seats_available >= 1"
          - "no buffered collision on (test_center_id, seat_label) per calculations.exam_seat_interval_conflict"
        side_effects:
          - "create one ExamAppointment with status SCHEDULED"
          - "increment TestCenter.seats_committed by 1 and decrement TestCenter.seats_available by 1"
          - "increments ExamAuthorization.version by 1 and TestCenter.version by 1"

      - from: SCHEDULED
        to: APPROVED_TO_SIT
        trigger: "POST /exam-appointments/{exam_appointment_id}/cancel"
        actor: Applicant
        preconditions:
          - "ExamAuthorization.status == SCHEDULED"
          - "ExamAppointment.status == SCHEDULED"
          - "logical clock now < ExamAppointment.window_start"
          - "the parent Application.engineer_id == X-User-ID"
        side_effects:
          - "ExamAppointment transitions SCHEDULED -> CANCELLED_BY_CANDIDATE"
          - "decrement TestCenter.seats_committed by 1 and increment TestCenter.seats_available by 1"
          - "increments ExamAuthorization.version by 1 and TestCenter.version by 1"
        note: "compensating half of the seat-capacity conservation invariant; loop edge back to APPROVED_TO_SIT"

      - from: SCHEDULED
        to: PASSED
        trigger: "POST /exam-authorizations/{exam_authorization_id}/score with raw_score >= PASSING_SCORE (70)"
        actor: TestingService
        preconditions:
          - "ExamAuthorization.status == SCHEDULED"
          - "an ExamAppointment under this authorization has status SCHEDULED and window_end <= logical clock now"
        side_effects:
          - "set ExamAuthorization.raw_score, ExamAuthorization.result = PASS and ExamAuthorization.ncees_transmission_id from the request"
          - "that ExamAppointment transitions SCHEDULED -> COMPLETED"
          - "decrement TestCenter.seats_committed by 1 and increment TestCenter.seats_available by 1"
          - "increments ExamAuthorization.version by 1 and TestCenter.version by 1"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /exam-authorizations/{exam_authorization_id}/score with raw_score < PASSING_SCORE (70)"
        actor: TestingService
        preconditions:
          - "ExamAuthorization.status == SCHEDULED"
          - "an ExamAppointment under this authorization has status SCHEDULED and window_end <= logical clock now"
        side_effects:
          - "set ExamAuthorization.raw_score, ExamAuthorization.result = FAIL and ExamAuthorization.ncees_transmission_id from the request"
          - "set ExamAuthorization.retake_eligible_at = logical clock now + RETAKE_WAIT_DAYS (90) days"
          - "that ExamAppointment transitions SCHEDULED -> COMPLETED"
          - "decrement TestCenter.seats_committed by 1 and increment TestCenter.seats_available by 1"
          - "increments ExamAuthorization.version by 1 and TestCenter.version by 1"

      - from: FAILED
        to: APPROVED_TO_SIT
        trigger: "POST /exam-authorizations/{exam_authorization_id}/retake"
        actor: Applicant
        preconditions:
          - "ExamAuthorization.status == FAILED"
          - "the parent Application.engineer_id == X-User-ID"
          - "logical clock now >= ExamAuthorization.retake_eligible_at"
          - "ExamAuthorization.attempt_number < MAX_EXAM_ATTEMPTS (3)"
          - "logical clock now < ExamAuthorization.authorization_expires_at"
        side_effects:
          - "increment ExamAuthorization.attempt_number by 1"
          - "reset ExamAuthorization.raw_score to null, result to PENDING and retake_eligible_at to null"
          - "increments ExamAuthorization.version by 1"
        note: "cycle edge; authorization_expires_at is NOT extended, so the 365-day envelope caps the retake loop"

      - from: APPROVED_TO_SIT
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "ExamAuthorization.status == APPROVED_TO_SIT"
          - "the new logical clock value > ExamAuthorization.authorization_expires_at"
        side_effects:
          - "increments ExamAuthorization.version by 1"

      - from: FAILED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "ExamAuthorization.status == FAILED"
          - "the new logical clock value > ExamAuthorization.authorization_expires_at"
        side_effects:
          - "increments ExamAuthorization.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade, link 4 of the reference-recant chain"
        actor: system
        preconditions:
          - "ExamAuthorization.status IN {APPROVED_TO_SIT, SCHEDULED}"
          - "the parent Application just transitioned EXAM_APPROVED -> DEFICIENT"
        side_effects:
          - "link 5: every ExamAppointment under this authorization whose status == SCHEDULED transitions to CANCELLED_BY_BOARD with its TestCenter seat released"
          - "increments ExamAuthorization.version by 1"

      - from: APPROVED_TO_SIT
        to: CANCELLED
        trigger: "system cascade, link 4 of the reference-recant chain"
        actor: system
        preconditions:
          - "ExamAuthorization.status == APPROVED_TO_SIT"
          - "the parent Application just transitioned EXAM_APPROVED -> DEFICIENT"
        side_effects:
          - "increments ExamAuthorization.version by 1"

  - entity: ExamAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_BY_CANDIDATE, CANCELLED_BY_BOARD]
    shape: "linear with two distinct cancellation terminals distinguished by actor"
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "side effect of ExamAuthorization SCHEDULED -> PASSED or SCHEDULED -> FAILED"
        actor: system
        preconditions:
          - "ExamAppointment.status == SCHEDULED"
          - "ExamAppointment.window_end <= logical clock now"
        side_effects:
          - "release the seat: decrement TestCenter.seats_committed by 1, increment TestCenter.seats_available by 1"
          - "increments ExamAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED_BY_CANDIDATE
        trigger: "POST /exam-appointments/{exam_appointment_id}/cancel"
        actor: Applicant
        preconditions:
          - "ExamAppointment.status == SCHEDULED"
          - "logical clock now < ExamAppointment.window_start"
        side_effects:
          - "release the seat: decrement TestCenter.seats_committed by 1, increment TestCenter.seats_available by 1"
          - "increments ExamAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED_BY_BOARD
        trigger: "system cascade link 5 (reference recant) or POST /_clock/set_current_utc sweep expiring the parent authorization"
        actor: system
        preconditions:
          - "ExamAppointment.status == SCHEDULED"
          - "the parent ExamAuthorization transitioned to CANCELLED or EXPIRED in this request"
        side_effects:
          - "release the seat: decrement TestCenter.seats_committed by 1, increment TestCenter.seats_available by 1"
          - "increments ExamAppointment.version by 1"

  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    shape: "cyclic — ACTIVE -> ACTIVE renewal self-loop plus EXPIRED -> ACTIVE and SUSPENDED -> ACTIVE return edges"
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /licenses/{license_id}/renew"
        actor: Licensee
        preconditions:
          - "License.status == ACTIVE"
          - "License.engineer_id == X-User-ID"
          - "logical clock now >= License.renewal_window_opens_at AND logical clock now <= License.current_period_end"
          - "a CPCReport exists for this License with period_end == License.current_period_end and status IN {ACCEPTED, AUDIT_CLEARED}"
          - "that CPCReport.shortfall_pdh == 0"
        side_effects:
          - "roll the period per calculations.license_period_roll mode renew: current_period_start = old current_period_end, current_period_end = old current_period_end + BIENNIUM_MONTHS (24) months, renewal_window_opens_at recomputed"
          - "increments License.version by 1"
        note: "self-loop; ERR_RENEWAL_WINDOW_CLOSED outside the 90-day window, ERR_CPC_SHORTFALL when shortfall_pdh > 0"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "License.status == ACTIVE"
          - "the new logical clock value > License.current_period_end"
        side_effects:
          - "set License.reinstatement_eligible_until = License.current_period_end + REINSTATEMENT_GRACE_DAYS (730) days"
          - "recompute Engineer.active_license_number for License.engineer_id (falls to null when this was the only ACTIVE license)"
          - "every FirmRegistration whose responsible_charge_license_id == License.id and status == ACTIVE transitions to LAPSED_NO_RESPONSIBLE_CHARGE"
          - "increments License.version by 1"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /licenses/{license_id}/reinstate"
        actor: BoardLicensingOfficer
        preconditions:
          - "License.status == EXPIRED"
          - "logical clock now <= License.reinstatement_eligible_until"
          - "request makeup_pdh >= REINSTATEMENT_MAKEUP_PDH (15)"
          - "request reinstatement_fee_cents >= REINSTATEMENT_FEE_CENTS (45000)"
          - "no ConsentOrder with status EXECUTED and sanction_type REVOCATION exists against this License"
        side_effects:
          - "roll the period per calculations.license_period_roll mode reinstate: current_period_start = logical clock now, current_period_end = logical clock now + BIENNIUM_MONTHS (24) months"
          - "clear License.reinstatement_eligible_until to null"
          - "recompute Engineer.active_license_number for License.engineer_id"
          - "every FirmRegistration whose responsible_charge_license_id == License.id and status == LAPSED_NO_RESPONSIBLE_CHARGE transitions to ACTIVE"
          - "increments License.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade, link 2 of the consent-order chain fired by POST /consent-orders/{consent_order_id}/execute with sanction_type SUSPENSION"
        actor: system
        preconditions:
          - "License.status == ACTIVE"
          - "the executing ConsentOrder.sanction_type == SUSPENSION"
        side_effects:
          - "set License.suspension_ends_at = ConsentOrder.executed_on + ConsentOrder.suspension_months months"
          - "set License.discipline_flag = true"
          - "recompute Engineer.active_license_number for License.engineer_id"
          - "link 3: caused by this transition, every FirmRegistration whose responsible_charge_license_id == License.id and status == ACTIVE transitions to LAPSED_NO_RESPONSIBLE_CHARGE"
          - "increments License.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licenses/{license_id}/reinstate"
        actor: BoardLicensingOfficer
        preconditions:
          - "License.status == SUSPENDED"
          - "logical clock now >= License.suspension_ends_at"
          - "request makeup_pdh >= REINSTATEMENT_MAKEUP_PDH (15)"
          - "request reinstatement_fee_cents >= REINSTATEMENT_FEE_CENTS (45000)"
          - "every ConsentOrder with status EXECUTED against this License has penalty_paid_cents >= penalty_cents"
        side_effects:
          - "clear License.suspension_ends_at to null"
          - "roll the period per calculations.license_period_roll mode reinstate"
          - "recompute Engineer.active_license_number for License.engineer_id"
          - "every FirmRegistration whose responsible_charge_license_id == License.id and status == LAPSED_NO_RESPONSIBLE_CHARGE transitions to ACTIVE"
          - "increments License.version by 1"
        note: "License.discipline_flag is NOT cleared — the disciplinary record is permanent"

      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade, link 2 of the consent-order chain with sanction_type REVOCATION"
        actor: system
        preconditions:
          - "License.status == ACTIVE"
          - "the executing ConsentOrder.sanction_type == REVOCATION"
        side_effects:
          - "set License.discipline_flag = true"
          - "recompute Engineer.active_license_number for License.engineer_id"
          - "link 3: every FirmRegistration whose responsible_charge_license_id == License.id and status IN {ACTIVE, LAPSED_NO_RESPONSIBLE_CHARGE} transitions to REVOKED"
          - "increments License.version by 1"

  - entity: FirmRegistration
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    shape: "posture-driven and cyclic — ACTIVE <-> LAPSED_NO_RESPONSIBLE_CHARGE follows the responsible-charge License"
    transitions:
      - from: ACTIVE
        to: LAPSED_NO_RESPONSIBLE_CHARGE
        trigger: "system cascade, link 3 of the consent-order chain, or the License ACTIVE -> EXPIRED clock sweep"
        actor: system
        preconditions:
          - "FirmRegistration.status == ACTIVE"
          - "License(FirmRegistration.responsible_charge_license_id).status IN {SUSPENDED, EXPIRED}"
        side_effects:
          - "stamp FirmRegistration.lapsed_at = logical clock now"
          - "link 4: caused by this transition, every PlanSubmission whose firm_registration_id == FirmRegistration.id and status == DRAFT transitions to VOIDED"
          - "increments FirmRegistration.version by 1"

      - from: LAPSED_NO_RESPONSIBLE_CHARGE
        to: ACTIVE
        trigger: "POST /firm-registrations/{firm_registration_id}/responsible-charge, or the License reinstatement cascade"
        actor: FirmAdmin
        preconditions:
          - "FirmRegistration.status == LAPSED_NO_RESPONSIBLE_CHARGE"
          - "FirmRegistration.id == X-User-ID when the actor is FirmAdmin"
          - "License(request responsible_charge_license_id).status == ACTIVE"
          - "logical clock now <= FirmRegistration.registration_expires_at"
        side_effects:
          - "set FirmRegistration.responsible_charge_license_id = request responsible_charge_license_id"
          - "clear FirmRegistration.lapsed_at to null"
          - "increments FirmRegistration.version by 1"
        note: "compensating edge; VOIDED PlanSubmissions are NOT resurrected"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "FirmRegistration.status == ACTIVE"
          - "the new logical clock value > FirmRegistration.registration_expires_at"
        side_effects:
          - "every PlanSubmission whose firm_registration_id == FirmRegistration.id and status == DRAFT transitions to VOIDED"
          - "increments FirmRegistration.version by 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade from License ACTIVE -> REVOKED"
        actor: system
        preconditions:
          - "FirmRegistration.status == ACTIVE"
          - "License(FirmRegistration.responsible_charge_license_id).status == REVOKED"
        side_effects:
          - "every PlanSubmission whose firm_registration_id == FirmRegistration.id and status == DRAFT transitions to VOIDED"
          - "increments FirmRegistration.version by 1"

      - from: LAPSED_NO_RESPONSIBLE_CHARGE
        to: REVOKED
        trigger: "system cascade from License ACTIVE -> REVOKED"
        actor: system
        preconditions:
          - "FirmRegistration.status == LAPSED_NO_RESPONSIBLE_CHARGE"
          - "License(FirmRegistration.responsible_charge_license_id).status == REVOKED"
        side_effects:
          - "increments FirmRegistration.version by 1"

  - entity: PlanSubmission
    initial_state: DRAFT
    terminal_states: [FLAGGED, VOIDED]
    shape: "linear with a compliance-flag branch off SEALED"
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /plan-submissions/{plan_submission_id}/seal"
        actor: Licensee
        preconditions:
          - "PlanSubmission.status == DRAFT"
          - "FirmRegistration(PlanSubmission.firm_registration_id).status == ACTIVE"
          - "License(request sealing_license_id).engineer_id == X-User-ID"
          - "License(request sealing_license_id).status == ACTIVE"
          - "request sealing_license_id == FirmRegistration.responsible_charge_license_id"
          - "request responsible_charge_attested == true"
        side_effects:
          - "set PlanSubmission.sealing_license_id and PlanSubmission.responsible_charge_attested from the request"
          - "stamp PlanSubmission.seal_affixed_at = logical clock now"
          - "increments PlanSubmission.version by 1"
        note: "priority conflict site: ERR_SEAL_LICENSE_NOT_ACTIVE (business_safety, priority 11) outranks ERR_NOT_RESPONSIBLE_CHARGE (business_referential, priority 14)"

      - from: SEALED
        to: FLAGGED
        trigger: "system cascade from POST /cases/{case_id}/finding with finding PROBABLE_CAUSE"
        actor: system
        preconditions:
          - "PlanSubmission.status == SEALED"
          - "the Case.subject_plan_submission_id == PlanSubmission.id"
        side_effects:
          - "increments PlanSubmission.version by 1"

      - from: DRAFT
        to: VOIDED
        trigger: "system cascade link 4 (firm lapse), firm expiry sweep, or firm revocation"
        actor: system
        preconditions:
          - "PlanSubmission.status == DRAFT"
          - "FirmRegistration(PlanSubmission.firm_registration_id).status IN {LAPSED_NO_RESPONSIBLE_CHARGE, EXPIRED, REVOKED}"
        side_effects:
          - "increments PlanSubmission.version by 1"

  - entity: CPCReport
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, AUDIT_CLEARED, AUDIT_DEFICIENT]
    shape: "branching — ACCEPTED forks into the audit sub-path whose two outcomes are terminal"
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system side effect of POST /cpc-reports creating a replacement report for the same license and period"
        actor: system
        preconditions:
          - "CPCReport.status == SUBMITTED"
          - "the incoming report carries the same license_id and the same period_end"
        side_effects:
          - "the new report's supersedes_report_id is set to this report's id"
          - "increments CPCReport.version by 1"
        note: "this legitimate supersede is what makes POST /cpc-reports a true OCC race site (see concurrency_rules.cpc-report-create-stale-license)"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cpc-reports/{cpc_report_id}/accept"
        actor: BoardReviewer
        preconditions:
          - "CPCReport.status == SUBMITTED"
          - "CPCReport.self_certified_pdh == CPCReport.self_certified_total_pdh"
        side_effects:
          - "recompute CPCReport.shortfall_pdh under calculations.cpc_pdh_valuation variant self_certified"
          - "increments CPCReport.version by 1"
        note: "ERR_PDH_SELF_CERT_MISMATCH when the declared total and the computed self-certified total disagree"

      - from: ACCEPTED
        to: UNDER_AUDIT
        trigger: "system side effect of POST /cpc-audits selecting this report"
        actor: system
        preconditions:
          - "CPCReport.status == ACCEPTED"
          - "CPCReport.audit_id == null"
          - "CPCReport.period_end == CPCAudit.as_of_period_end"
        side_effects:
          - "set CPCReport.audit_id = the new CPCAudit.id"
          - "recompute CPCReport.audit_verified_total_pdh under calculations.cpc_pdh_valuation variant audit_verified"
          - "increments CPCReport.version by 1"

      - from: UNDER_AUDIT
        to: AUDIT_CLEARED
        trigger: "POST /cpc-reports/{cpc_report_id}/audit-decision when the audit-verified shortfall is 0"
        actor: BoardReviewer
        preconditions:
          - "CPCReport.status == UNDER_AUDIT"
          - "X-User-ID != CPCAudit(CPCReport.audit_id).created_by_user_id"
          - "the recomputed shortfall under variant audit_verified == 0"
        side_effects:
          - "recompute CPCReport.audit_verified_total_pdh and CPCReport.shortfall_pdh under variant audit_verified"
          - "set CPCReport.audit_decided_by_user_id = X-User-ID"
          - "when no CPCReport with this audit_id remains in status UNDER_AUDIT, the CPCAudit transitions SAMPLED -> CLOSED"
          - "increments CPCReport.version by 1"

      - from: UNDER_AUDIT
        to: AUDIT_DEFICIENT
        trigger: "POST /cpc-reports/{cpc_report_id}/audit-decision when the audit-verified shortfall is > 0"
        actor: BoardReviewer
        preconditions:
          - "CPCReport.status == UNDER_AUDIT"
          - "X-User-ID != CPCAudit(CPCReport.audit_id).created_by_user_id"
          - "the recomputed shortfall under variant audit_verified > 0"
        side_effects:
          - "recompute CPCReport.audit_verified_total_pdh and CPCReport.shortfall_pdh under variant audit_verified"
          - "set CPCReport.audit_decided_by_user_id = X-User-ID"
          - "when no CPCReport with this audit_id remains in status UNDER_AUDIT, the CPCAudit transitions SAMPLED -> CLOSED"
          - "increments CPCReport.version by 1"
        note: "divergent branch: a license whose current-period report lands AUDIT_DEFICIENT can no longer satisfy the renewal precondition, because renewal requires status IN {ACCEPTED, AUDIT_CLEARED}"

  - entity: CPCAudit
    initial_state: SAMPLED
    terminal_states: [CLOSED]
    shape: "compound — the parent closes when every sampled child report has been adjudicated"
    transitions:
      - from: SAMPLED
        to: CLOSED
        trigger: "system bubble-up from the last POST /cpc-reports/{cpc_report_id}/audit-decision under this audit"
        actor: system
        preconditions:
          - "CPCAudit.status == SAMPLED"
          - "count(CPCReport where audit_id == CPCAudit.id and status == UNDER_AUDIT) == 0"
        side_effects:
          - "increments CPCAudit.version by 1"

  - entity: Case
    initial_state: "investigation_status=RECEIVED, sanction_status=NONE"
    terminal_states: [CLOSED]
    shape: "parallel dimensions — investigation_status and sanction_status advance independently on the same row, coupled only by explicit cross-axis guards"
    transitions:
      - axis: investigation_status
        from: RECEIVED
        to: INVESTIGATING
        trigger: "POST /cases/{case_id}/open-investigation"
        actor: BoardInvestigator
        preconditions:
          - "Case.investigation_status == RECEIVED"
        side_effects:
          - "set Case.assigned_investigator_user_id = X-User-ID"
          - "increments Case.version by 1"

      - axis: investigation_status
        from: INVESTIGATING
        to: PROBABLE_CAUSE
        trigger: "POST /cases/{case_id}/finding with finding PROBABLE_CAUSE"
        actor: BoardInvestigator
        preconditions:
          - "Case.investigation_status == INVESTIGATING"
          - "request violation_count >= 1"
        side_effects:
          - "set Case.aggravating_factor_count, Case.mitigating_factor_count and Case.violation_count from the request"
          - "recompute Case.penalty_factor and Case.assessed_penalty_cents via calculations.civil_penalty_assessment"
          - "when Case.subject_plan_submission_id != null and that PlanSubmission.status == SEALED, the PlanSubmission transitions SEALED -> FLAGGED"
          - "increments Case.version by 1"

      - axis: investigation_status
        from: INVESTIGATING
        to: NO_CAUSE
        trigger: "POST /cases/{case_id}/finding with finding NO_CAUSE"
        actor: BoardInvestigator
        preconditions:
          - "Case.investigation_status == INVESTIGATING"
          - "request violation_count == 0"
        side_effects:
          - "set Case.aggravating_factor_count, Case.mitigating_factor_count and Case.violation_count from the request"
          - "set Case.penalty_factor = 0 and Case.assessed_penalty_cents = 0"
          - "increments Case.version by 1"
        note: "divergent side-effect set from the PROBABLE_CAUSE branch: no penalty computation, no plan flagging"

      - axis: investigation_status
        from: PROBABLE_CAUSE
        to: CLOSED
        trigger: "POST /cases/{case_id}/close"
        actor: BoardInvestigator
        preconditions:
          - "Case.investigation_status == PROBABLE_CAUSE"
          - "Case.sanction_status IN {CONSENT_EXECUTED, HEARING_REFERRED}"
        side_effects:
          - "recompute Engineer.open_case_count for the respondent's engineer when Case.respondent_license_id != null"
          - "increments Case.version by 1"
        note: "cross-axis guard: ERR_OPEN_SANCTION_BLOCKS_CLOSE while sanction_status IN {NONE, PROPOSED}"

      - axis: investigation_status
        from: NO_CAUSE
        to: CLOSED
        trigger: "POST /cases/{case_id}/close"
        actor: BoardInvestigator
        preconditions:
          - "Case.investigation_status == NO_CAUSE"
          - "Case.sanction_status == NONE"
        side_effects:
          - "recompute Engineer.open_case_count for the respondent's engineer when Case.respondent_license_id != null"
          - "increments Case.version by 1"

      - axis: sanction_status
        from: NONE
        to: PROPOSED
        trigger: "POST /consent-orders"
        actor: BoardInvestigator
        preconditions:
          - "Case.sanction_status == NONE"
          - "Case.investigation_status == PROBABLE_CAUSE"
          - "request expected_case_version == Case.version"
        side_effects:
          - "create one ConsentOrder with status PROPOSED and penalty_cents copied from Case.assessed_penalty_cents"
          - "increments Case.version by 1"
        note: "cross-axis guard: ERR_PROBABLE_CAUSE_REQUIRED while investigation_status != PROBABLE_CAUSE"

      - axis: sanction_status
        from: PROPOSED
        to: PROPOSED
        trigger: "POST /consent-orders replacing the outstanding proposal"
        actor: BoardInvestigator
        preconditions:
          - "Case.sanction_status == PROPOSED"
          - "Case.investigation_status == PROBABLE_CAUSE"
          - "request expected_case_version == Case.version"
        side_effects:
          - "the outstanding ConsentOrder transitions PROPOSED -> SUPERSEDED"
          - "create one replacement ConsentOrder with status PROPOSED"
          - "increments Case.version by 1"
        note: "self-loop on the sanction axis; this legitimate supersede makes POST /consent-orders a true OCC race site"

      - axis: sanction_status
        from: PROPOSED
        to: CONSENT_EXECUTED
        trigger: "POST /consent-orders/{consent_order_id}/execute"
        actor: BoardLicensingOfficer
        preconditions:
          - "Case.sanction_status == PROPOSED"
          - "ConsentOrder.status == PROPOSED"
          - "X-User-ID != Case.assigned_investigator_user_id"
          - "ConsentOrder.penalty_paid_cents >= ConsentOrder.penalty_cents"
        side_effects:
          - "link 1: ConsentOrder transitions PROPOSED -> EXECUTED, executed_on and executed_by_user_id stamped"
          - "link 2: caused by link 1, when Case.respondent_license_id != null the License transitions ACTIVE -> SUSPENDED (sanction_type SUSPENSION) or ACTIVE -> REVOKED (sanction_type REVOCATION); sanction_type REPRIMAND only sets License.discipline_flag = true"
          - "link 3: caused by link 2, every FirmRegistration in responsible charge of that License lapses or is revoked"
          - "link 4: caused by link 3, every DRAFT PlanSubmission under those firms transitions to VOIDED"
          - "increments Case.version by 1"
        note: "depth-4 transitive cascade ConsentOrder -> License -> FirmRegistration -> PlanSubmission, originating from a different trigger than the reference-recant chain"

      - axis: sanction_status
        from: NONE
        to: HEARING_REFERRED
        trigger: "POST /cases/{case_id}/refer-hearing"
        actor: BoardInvestigator
        preconditions:
          - "Case.sanction_status == NONE"
          - "Case.investigation_status == PROBABLE_CAUSE"
        side_effects:
          - "increments Case.version by 1"

      - axis: sanction_status
        from: PROPOSED
        to: HEARING_REFERRED
        trigger: "POST /cases/{case_id}/refer-hearing"
        actor: BoardInvestigator
        preconditions:
          - "Case.sanction_status == PROPOSED"
          - "Case.investigation_status == PROBABLE_CAUSE"
        side_effects:
          - "the outstanding ConsentOrder transitions PROPOSED -> SUPERSEDED"
          - "increments Case.version by 1"

  - entity: ConsentOrder
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED, EXECUTED]
    shape: "branching — a proposal is either replaced or executed"
    transitions:
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system side effect of a replacement POST /consent-orders on the same case, or of POST /cases/{case_id}/refer-hearing"
        actor: system
        preconditions:
          - "ConsentOrder.status == PROPOSED"
        side_effects:
          - "increments ConsentOrder.version by 1"
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /consent-orders/{consent_order_id}/execute"
        actor: BoardLicensingOfficer
        preconditions:
          - "ConsentOrder.status == PROPOSED"
          - "Case.sanction_status == PROPOSED"
          - "X-User-ID != Case.assigned_investigator_user_id"
          - "ConsentOrder.penalty_paid_cents >= ConsentOrder.penalty_cents"
        side_effects:
          - "set ConsentOrder.executed_on from the request and ConsentOrder.executed_by_user_id = X-User-ID"
          - "drives the depth-4 cascade documented on Case sanction_status PROPOSED -> CONSENT_EXECUTED"
          - "increments ConsentOrder.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: cpc-report-create-stale-license
    parent_entity: License
    write_endpoint: "POST /cpc-reports"
    occ_field: "expected_license_version"
    description: |
      Creating a CPCReport against a License whose version has advanced since the client last read
      it is rejected. The product deliberately allows a later report for the same license and period
      to supersede the earlier SUBMITTED one (state_machines.CPCReport.SUBMITTED_to_SUPERSEDED), so a
      second create is not blocked by any state precondition; the stale-version check is what stops a
      writer from replacing a report it never observed.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

  - rule_id: consent-order-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /consent-orders"
    occ_field: "expected_case_version"
    description: |
      Creating a ConsentOrder against a Case whose version has advanced since the client last read it
      is rejected. Because the sanction axis permits PROPOSED -> PROPOSED (a renegotiated order
      supersedes the outstanding one), a second create would otherwise legitimately succeed; the
      stale-version check is the only thing that distinguishes a deliberate renegotiation from a
      writer acting on an outdated view of the case.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: experience_credit_evaluation
    trigger: >-
      "POST /applications/{application_id}/submit and POST /applications/{application_id}/respond-deficiency
      (variant provisional_self_reported, writing Application.provisional_experience_months);
      POST /applications/{application_id}/credit-determination, POST /references/{reference_id}/evaluate and
      POST /references/{reference_id}/recant (variant verified_final, writing
      Application.verified_experience_months and ExperienceRecord.credited_months)"
    algorithm: weighted_scoring
    formula: |
      # ---- per-record arithmetic (identical in both variants) ----
      # Step 1: inclusive month span. "2024-01".."2024-06" is SIX months, not five.
      raw_months(r) = (year(r.period_end_month) - year(r.period_start_month)) * 12
                      + (month(r.period_end_month) - month(r.period_start_month))
                      + 1

      # Step 2: responsibility multiplier
      resp_mult(r) = MULT_RESPONSIBLE_CHARGE if r.responsibility_level == RESPONSIBLE_CHARGE
                     MULT_PROGRESSIVE        if r.responsibility_level == PROGRESSIVE
                     MULT_SUBORDINATE        if r.responsibility_level == SUBORDINATE

      # Step 3: pre-degree haircut
      degree_factor(r) = 1.00 if r.post_degree == true else PRE_DEGREE_FACTOR

      # Step 4: credit_multiplier is stored on the record
      r.credit_multiplier = resp_mult(r) * degree_factor(r)          # 2 decimal places, round_half_up

      # Step 5: PINNED ROUNDING ORDER — floor PER RECORD, then sum.
      #         floor(sum(...)) is NOT valid and produces different totals.
      floored(r) = floor(raw_months(r) * r.credit_multiplier)

      # Step 6: single-record cap
      capped(r) = min(floored(r), MAX_SINGLE_RECORD_MONTHS)

      # ---- variant-specific inclusion set and per-record weighting ----
      # (see `variants:` below for included(r) and weight(r))
      contribution(r) = floor(capped(r) * weight(r))

      # Step 7: aggregate then apply the programme cap
      total = min( sum over r in included of contribution(r), MAX_TOTAL_CREDIT_MONTHS )
    input_set: >-
      "ExperienceRecord rows whose application_id == Application.id. Rows with
      verification_status == RECANTED are excluded by BOTH variants. Overlapping periods cannot
      coexist (validations priority 18), so no month is ever counted twice."
    constants:
      MULT_RESPONSIBLE_CHARGE: 1.00
      MULT_PROGRESSIVE: 0.75
      MULT_SUBORDINATE: 0.50
      PRE_DEGREE_FACTOR: 0.50
      MAX_SINGLE_RECORD_MONTHS: 48
      MAX_TOTAL_CREDIT_MONTHS: 96
      INDIRECT_REFERENCE_WEIGHT: 0.50
      MIN_EXPERIENCE_MONTHS: 48
    precision: "whole months; every intermediate per-record value is floored (ROUND_DOWN); credit_multiplier is 2 decimal places round_half_up"
    variants:
      - name: provisional_self_reported
        when: >-
          "written to Application.provisional_experience_months at DRAFT -> SUBMITTED and at
          DEFICIENT -> UNDER_REVIEW"
        difference: >-
          "included(r) := r.verification_status IN {UNVERIFIED, PENDING_VERIFICATION, VERIFIED, DISPUTED};
          weight(r) := 1.00 for every record regardless of who attested it. The applicant's own claim is
          taken at face value."
      - name: verified_final
        when: >-
          "written to Application.verified_experience_months at POST /applications/{id}/credit-determination
          and re-written on every Reference evaluate/recant"
        difference: >-
          "included(r) := r.verification_status == VERIFIED; weight(r) := 1.00 when the ACCEPTED Reference
          on r has relationship == DIRECT_SUPERVISOR, otherwise INDIRECT_REFERENCE_WEIGHT (0.50) for
          relationship IN {PROJECT_MANAGER, PEER}. ExperienceRecord.credited_months is set to
          contribution(r) under this variant and to 0 for every excluded record."
    note: >-
      "Dual-variant divergence is observable on identical data: a PROGRESSIVE post-degree record spanning
      2019-01..2022-12 (48 raw months) contributes 36 provisionally (floor(48*0.75)=36, inside the
      48-month single-record cap) but
      only 18 finally when its accepted reference is a PROJECT_MANAGER (floor(36*0.50)=18)."

  - name: cpc_pdh_valuation
    trigger: >-
      "POST /cpc-reports, POST /cpc-reports/{cpc_report_id}/pdh-records and
      POST /cpc-reports/{cpc_report_id}/accept (variant self_certified, writing
      CPCReport.self_certified_total_pdh and CPCReport.shortfall_pdh);
      POST /pdh-records/{pdh_record_id}/documentation-review, POST /cpc-audits and
      POST /cpc-reports/{cpc_report_id}/audit-decision (variant audit_verified, writing
      CPCReport.audit_verified_total_pdh and CPCReport.shortfall_pdh)"
    algorithm: aggregation
    formula: |
      # Step 1: per-category eligible hours, each category independently capped
      for each activity_type t in {COURSE, SEMINAR, TEACHING, PUBLICATION, PATENT, SELF_STUDY}:
          hours(t)    = sum of p.pdh_hours over included PDHRecords p with p.activity_type == t
          eligible(t) = min(hours(t), cap(t))          # cap(t) is variant-dependent for SELF_STUDY

      # Step 2: activity subtotal
      activity_pdh = sum over t of eligible(t)

      # Step 3: carryover from the prior period, capped
      carryover = min(report.carryover_pdh_claimed, MAX_CARRYOVER_PDH)

      # Step 4: total, rounded to ONE decimal place, round_half_up
      total_pdh = round_half_up(activity_pdh + carryover, 1)

      # Step 5: ethics hours are a SEPARATE floor, not part of the hour count.
      #         PINNED INTERPRETATION: the ethics deficiency is ADDITIVE to the hour deficiency.
      ethics_pdh = sum of p.pdh_hours over included PDHRecords p with p.ethics_flag == true
      hour_deficit   = max(0, license.pdh_requirement - total_pdh)
      ethics_deficit = max(0, ETHICS_REQUIRED_PDH - ethics_pdh)
      shortfall_pdh  = round_half_up(hour_deficit + ethics_deficit, 1)
    input_set: >-
      "PDHRecord rows whose cpc_report_id == CPCReport.id and whose completed_on falls inside
      [CPCReport.period_start, CPCReport.period_end] inclusive. Records outside the period are rejected at
      creation (validations priority 3) and therefore never reach this calculation."
    constants:
      CAP_COURSE: 30
      CAP_SEMINAR: 30
      CAP_TEACHING: 10
      CAP_PUBLICATION: 10
      CAP_PATENT: 10
      CAP_SELF_STUDY_SELF_CERTIFIED: 8
      CAP_SELF_STUDY_AUDIT_VERIFIED: 0
      MAX_CARRYOVER_PDH: 15
      ETHICS_REQUIRED_PDH: 2
      DEFAULT_PDH_REQUIREMENT: 30
    precision: "1 decimal place, round_half_up, applied once at Step 4 and once at Step 5"
    variants:
      - name: self_certified
        when: "CPCReport.status IN {SUBMITTED, ACCEPTED} — the licensee's own attestation is accepted"
        difference: >-
          "included(p) := p.documentation_status IN {NONE, ACCEPTED} (only REJECTED documentation is
          dropped); cap(SELF_STUDY) := CAP_SELF_STUDY_SELF_CERTIFIED (8). Result is written to
          CPCReport.self_certified_total_pdh."
      - name: audit_verified
        when: "CPCReport.status IN {UNDER_AUDIT, AUDIT_CLEARED, AUDIT_DEFICIENT} — documentation is required"
        difference: >-
          "included(p) := p.documentation_status == ACCEPTED only; cap(SELF_STUDY) :=
          CAP_SELF_STUDY_AUDIT_VERIFIED (0), i.e. unproctored self study earns nothing under audit.
          Result is written to CPCReport.audit_verified_total_pdh."
    note: >-
      "Dual-variant divergence on a different entity domain from experience_credit_evaluation: identical
      PDHRecord rows yield self_certified_total_pdh 30.0 and audit_verified_total_pdh 14.0 when 8.0 hours
      are SELF_STUDY and the remaining documentation was never submitted."

  - name: application_fee_assessment
    trigger: >-
      "GET /applications/{application_id}/fee-assessment (read-only projection), POST /applications,
      POST /applications/{application_id}/experience-records,
      POST /applications/{application_id}/ncees-verification (each recomputes
      Application.fee_assessment_cents), and POST /applications/{application_id}/submit (freezes it)"
    algorithm: tiered_pricing
    formula: |
      # THE EVALUATION ORDER BELOW IS PINNED. The comity credit tier LOOKS like it should key off the
      # final total (which already nets the credit out), which would be circular; the board's rule keys
      # it off pre_credit_total_cents instead. Steps must run 1..8 exactly.
      1. base_fee_cents = BASE_FEE_STANDARD_CENTS if application.pathway == STANDARD_EXAM
                          BASE_FEE_COMITY_CENTS   if application.pathway == COMITY
      2. record_count = count(ExperienceRecord where application_id == application.id)
         records_fee_cents = RECORDS_FEE_PER_RECORD_CENTS * record_count
                             + (NCEES_RECORD_FEE_CENTS if application.ncees_record_status == MATCHED else 0)
      3. subtotal_cents = base_fee_cents + records_fee_cents
      4. expedite_surcharge_cents = round_half_up(EXPEDITE_PCT * subtotal_cents)
                                       if application.expedite_requested == true else 0
      5. pre_credit_total_cents = subtotal_cents + expedite_surcharge_cents
      6. comity_credit_tier_pct = 0.00                        if application.pathway != COMITY
                                  COMITY_TIER_HIGH_PCT        if pre_credit_total_cents >= COMITY_TIER_HIGH_CENTS
                                  COMITY_TIER_MID_PCT         if pre_credit_total_cents >= COMITY_TIER_MID_CENTS
                                  COMITY_TIER_LOW_PCT         otherwise
      7. comity_credit_cents = round_half_up(comity_credit_tier_pct * pre_credit_total_cents)
      8. assessment_total_cents = pre_credit_total_cents - comity_credit_cents
    input_set: >-
      "Every ExperienceRecord attached to the application at evaluation time, regardless of
      verification_status (including RECANTED ones — the verification work was already performed and is
      billable). After DRAFT -> SUBMITTED the value is frozen and later record additions do not change it."
    constants:
      BASE_FEE_STANDARD_CENTS: 25000
      BASE_FEE_COMITY_CENTS: 37500
      RECORDS_FEE_PER_RECORD_CENTS: 2500
      NCEES_RECORD_FEE_CENTS: 7500
      EXPEDITE_PCT: 0.18
      COMITY_TIER_HIGH_CENTS: 50000
      COMITY_TIER_HIGH_PCT: 0.15
      COMITY_TIER_MID_CENTS: 30000
      COMITY_TIER_MID_PCT: 0.10
      COMITY_TIER_LOW_PCT: 0.05
    precision: "integer cents; round_half_up applied independently at steps 4 and 7 (never on the final total)"
    note: >-
      "Threshold boundaries are inclusive (>=): a comity application whose pre_credit_total_cents lands
      exactly on 50000 takes COMITY_TIER_HIGH_PCT, and one at 49999 takes COMITY_TIER_MID_PCT."

  - name: civil_penalty_assessment
    trigger: >-
      "POST /cases/{case_id}/finding with finding PROBABLE_CAUSE (writes Case.penalty_factor and
      Case.assessed_penalty_cents); POST /consent-orders copies the result into ConsentOrder.penalty_cents"
    algorithm: waterfall_allocation
    formula: |
      # Step 1: aggravation/mitigation factor, clamped
      raw_factor = 1.00 + AGGRAVATING_STEP * case.aggravating_factor_count
                        - MITIGATING_STEP  * case.mitigating_factor_count
      case.penalty_factor = min(max(round_half_up(raw_factor, 2), FACTOR_FLOOR), FACTOR_CEILING)

      # Step 2: conduct component. PINNED ROUNDING ORDER — round the PER-VIOLATION amount first,
      #         THEN multiply by violation_count.
      base_cents = { NEGLIGENCE:          BASE_NEGLIGENCE_CENTS,
                     UNLICENSED_PRACTICE: BASE_UNLICENSED_PRACTICE_CENTS,
                     PLAN_STAMPING:       BASE_PLAN_STAMPING_CENTS,
                     CPC_FRAUD:           BASE_CPC_FRAUD_CENTS }[case.allegation_type]
      per_violation_cents = round_half_up(base_cents * case.penalty_factor)
      conduct_cents       = per_violation_cents * case.violation_count

      # Step 3: per-sheet stamping component. PINNED ROUNDING ORDER — round the PER-SHEET amount
      #         first, THEN multiply by sheet_count.
      #         round_half_up(PER_SHEET_STAMP_CENTS * factor * sheet_count) is NOT valid and differs.
      if case.subject_plan_submission_id != null:
          per_sheet_cents = round_half_up(PER_SHEET_STAMP_CENTS * case.penalty_factor)
          stamp_cents     = per_sheet_cents * PlanSubmission(case.subject_plan_submission_id).sheet_count
      else:
          stamp_cents = 0

      # Step 4: cost recovery
      cost_recovery_cents = round_half_up(INVESTIGATION_COST_CENTS * case.penalty_factor)

      # Step 5: statutory cap applied to the SUM of the three rounded components
      case.assessed_penalty_cents = min(conduct_cents + stamp_cents + cost_recovery_cents,
                                        STATUTORY_CAP_CENTS)
    input_set: >-
      "The Case row itself plus, when subject_plan_submission_id is set, that PlanSubmission's
      sheet_count as it stands at finding time."
    constants:
      BASE_NEGLIGENCE_CENTS: 150000
      BASE_UNLICENSED_PRACTICE_CENTS: 250000
      BASE_PLAN_STAMPING_CENTS: 200000
      BASE_CPC_FRAUD_CENTS: 100000
      AGGRAVATING_STEP: 0.25
      MITIGATING_STEP: 0.15
      FACTOR_FLOOR: 0.50
      FACTOR_CEILING: 2.00
      PER_SHEET_STAMP_CENTS: 1725
      INVESTIGATION_COST_CENTS: 48000
      STATUTORY_CAP_CENTS: 1000000
    precision: "integer cents; round_half_up applied per component (steps 2, 3 and 4) and NEVER on the sum"
    note: >-
      "Order sensitivity is real and observable: with penalty_factor 0.85 and sheet_count 7 the pinned
      order gives round_half_up(1725*0.85)=1466 then 1466*7 = 10262, whereas multiply-then-round gives
      round_half_up(1725*0.85*7) = round_half_up(10263.75) = 10264 — a two-cent divergence."

  - name: license_period_roll
    trigger: >-
      "POST /licenses, POST /applications/{application_id}/issue-license (mode issue);
      POST /licenses/{license_id}/renew (mode renew); POST /licenses/{license_id}/reinstate (mode reinstate)"
    algorithm: interval_merge
    formula: |
      add_months(t, n) = the instant with the same time-of-day n months after t; when the target month
                         has fewer days than day(t), clamp to the last day of the target month.

      mode issue:      current_period_start = license.issued_on
                       current_period_end   = add_months(license.issued_on, BIENNIUM_MONTHS)
      mode renew:      current_period_start = old current_period_end
                       current_period_end   = add_months(old current_period_end, BIENNIUM_MONTHS)
      mode reinstate:  current_period_start = logical clock now
                       current_period_end   = add_months(logical clock now, BIENNIUM_MONTHS)

      # always recomputed together with the period
      renewal_window_opens_at = current_period_end - RENEWAL_WINDOW_DAYS days

      # stamped only on the ACTIVE -> EXPIRED sweep
      reinstatement_eligible_until = current_period_end + REINSTATEMENT_GRACE_DAYS days
    input_set: "the License row alone plus the logical clock"
    constants:
      BIENNIUM_MONTHS: 24
      RENEWAL_WINDOW_DAYS: 90
      REINSTATEMENT_GRACE_DAYS: 730
      REINSTATEMENT_MAKEUP_PDH: 15
      REINSTATEMENT_FEE_CENTS: 45000
    precision: "whole days/months; all instants ISO 8601 UTC with three fractional digits"
    note: >-
      "mode renew chains off the OLD period_end, not off the renewal instant, so renewing early never
      shortens the biennium; mode reinstate deliberately restarts the clock at the reinstatement instant."

  - name: test_center_seat_ledger
    trigger: >-
      "POST /exam-appointments, POST /exam-appointments/{exam_appointment_id}/cancel,
      POST /exam-authorizations/{exam_authorization_id}/score, the reference-recant cascade link 5, and
      POST /_clock/set_current_utc when the sweep cancels appointments"
    algorithm: aggregation
    formula: |
      tc.seat_count       = length(tc.seat_labels)
      tc.seats_committed  = count(ExamAppointment a where a.test_center_id == tc.id
                                                     and a.status == SCHEDULED)
      tc.seats_available  = tc.seat_count - tc.seats_committed

      # CONSERVED QUANTITY (invariant seat_capacity_conservation):
      #   tc.seats_available + tc.seats_committed == tc.seat_count   at the end of every request
      # A forward schedule paired with its compensating cancel MUST restore seats_committed exactly.
    input_set: >-
      "ExamAppointment rows on this TestCenter with status == SCHEDULED only. COMPLETED,
      CANCELLED_BY_CANDIDATE and CANCELLED_BY_BOARD rows never occupy a seat."
    constants:
      MAX_SEAT_LABELS: 20
    precision: "integers; recomputed from the appointment table on every mutation, never incrementally patched"

  - name: exam_seat_interval_conflict
    trigger: "POST /exam-appointments (validations priority 20)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN minute-granular intervals on a LABELLED SEAT resource, each inflated by a trailing
      # turnover buffer. Adjacency is FORBIDDEN unless the buffer is fully honoured.
      buffered_end(x) = x.window_end + TURNOVER_BUFFER_MINUTES minutes

      collides(new, existing) :=
              existing.test_center_id == new.test_center_id
          and existing.seat_label     == new.seat_label
          and existing.status         == SCHEDULED
          and new.window_start        <  buffered_end(existing)
          and buffered_end(new)       >  existing.window_start

      # Rejected with ERR_SEAT_WINDOW_CONFLICT when any existing appointment collides.
      # Boundary: an appointment starting EXACTLY TURNOVER_BUFFER_MINUTES after an existing
      # window_end does NOT collide (new.window_start == buffered_end(existing), and `<` is strict);
      # one starting 44 minutes after DOES collide.
    input_set: >-
      "ExamAppointment rows with status == SCHEDULED on the same (test_center_id, seat_label) pair.
      Appointments on a different seat_label of the same centre never collide with each other; they
      compete only through the seats_available capacity check at priority 21."
    constants:
      TURNOVER_BUFFER_MINUTES: 45
      EXAM_WINDOW_MINUTES: 480
    precision: "minute granularity; window length is validated to be exactly EXAM_WINDOW_MINUTES"
    note: >-
      "Interval semantics A of two: half-open [start, end), minute granularity, asymmetric trailing
      buffer, per-seat-label exclusivity, plus a separate aggregate capacity dimension (seats_available)."

  - name: experience_period_overlap
    trigger: "POST /applications/{application_id}/experience-records (validations priority 18)"
    algorithm: interval_merge
    formula: |
      # CLOSED month-granular intervals on the APPLICANT's timeline. No buffer, no capacity dimension;
      # both endpoints are INCLUSIVE, so sharing a single boundary month is a collision.
      months(r) = the inclusive set { r.period_start_month .. r.period_end_month }

      collides(new, existing) :=
              existing.application_id == new.application_id
          and existing.verification_status != RECANTED
          and months(new) INTERSECT months(existing) != {}

      # Rejected with ERR_EXPERIENCE_PERIOD_OVERLAP.
      # Boundary: "2024-01".."2024-06" and "2024-07".."2024-12" are ADJACENT and both accepted;
      # "2024-01".."2024-06" and "2024-06".."2024-11" share 2024-06 and the second is rejected.
    input_set: >-
      "ExperienceRecord rows on the same Application whose verification_status != RECANTED. A RECANTED
      record frees its months so the applicant can re-claim the same period under a new supervisor."
    constants: {}
    precision: "calendar-month granularity; no partial months exist in the model"
    note: >-
      "Interval semantics B of two: closed inclusive endpoints, month granularity, zero buffer, no
      capacity dimension, and a status-conditional exclusion set — structurally different arithmetic from
      exam_seat_interval_conflict, on a different resource (the applicant timeline, not a seat)."

  - name: cpc_audit_sampling
    trigger: "POST /cpc-audits"
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER — explicit predicate, no fuzzy adjectives
      pool = [ CPCReport r :  r.status   == ACCEPTED
                          and r.period_end == audit.as_of_period_end
                          and r.audit_id == null
                          and License(r.license_id).status IN {ACTIVE, EXPIRED} ]
      audit.pool_size = count(pool)

      # (d) EMPTY-POOL FALLBACK — no CPCAudit row is created at all
      if audit.pool_size == 0: reject with ERR_AUDIT_POOL_EMPTY (409)

      # (b) RANKING EXPRESSION — smallest self-certified margin is audited first
      margin(r) = r.self_certified_total_pdh - License(r.license_id).pdh_requirement

      # (c) TIE-BREAK — margin ASC, then created_at ASC, then license_number ASC.
      #     `id` is NEVER a decision input.
      ordered = sort(pool, key = (margin ASC, created_at ASC, License.license_number ASC))

      # sample size: at least one report is always drawn from a non-empty pool
      audit.sampled_count = max(MIN_SAMPLE_COUNT, ceil(audit.pool_size * audit.sample_pct))
      audit.sampled_count = min(audit.sampled_count, audit.pool_size)

      selected = first audit.sampled_count elements of ordered
      # each selected report transitions ACCEPTED -> UNDER_AUDIT with audit_id set
    input_set: >-
      "CPCReport rows in status ACCEPTED whose period_end equals as_of_period_end and which have never
      been sampled, restricted to licenses in status ACTIVE or EXPIRED (SUSPENDED and REVOKED licensees
      are handled through the disciplinary track instead)."
    constants:
      MIN_SAMPLE_COUNT: 1
    precision: "integer counts; ceil applied to the product before the MIN_SAMPLE_COUNT floor"
    note: >-
      "Boundary behaviour: pool_size 1 with sample_pct 0.10 gives ceil(0.1) = 1 then max(1, 1) = 1;
      pool_size 0 raises ERR_AUDIT_POOL_EMPTY and persists nothing."

  - name: firm_responsible_charge_posture
    trigger: >-
      "POST /firm-registrations, POST /firm-registrations/{firm_registration_id}/responsible-charge, every
      License status transition touching a responsible-charge license, and POST /_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      rc = License(firm.responsible_charge_license_id)

      firm.status = REVOKED                        if rc.status == REVOKED
                    LAPSED_NO_RESPONSIBLE_CHARGE   if rc.status IN {SUSPENDED, EXPIRED}
                    EXPIRED                        if logical clock now > firm.registration_expires_at
                    ACTIVE                         otherwise

      # Evaluation order is PINNED top-to-bottom: a firm whose responsible-charge license is REVOKED is
      # REVOKED even when its registration has also run past registration_expires_at.
      # firm.status == ACTIVE is a precondition for sealing any PlanSubmission.
    input_set: "the FirmRegistration row and the single License row it names as responsible charge"
    constants:
      FIRM_REGISTRATION_DAYS: 365
    precision: "enumerated posture; recomputed synchronously inside the request that changed the license"

# =============================================================================
# 1.3.1 Conserved-Quantity Invariants (compensating-action pairs)
# =============================================================================
conserved_invariants:
  - name: seat_capacity_conservation
    quantity_type: finite_capacity_pool
    formula: "TestCenter.seats_available + TestCenter.seats_committed == length(TestCenter.seat_labels)"
    forward_action: "POST /exam-appointments"
    compensating_action: "POST /exam-appointments/{exam_appointment_id}/cancel"
    requirement: >-
      "After the forward action followed by its compensating action, TestCenter.seats_committed and
      TestCenter.seats_available MUST equal their pre-forward values exactly, and the sum invariant MUST
      hold at the end of every request. The cascade path (recant link 5) and the scoring path
      (SCHEDULED -> PASSED/FAILED) MUST release the seat identically — no drift."

  - name: experience_credit_ledger_conservation
    quantity_type: accumulated_time_ledger
    formula: >-
      "Application.verified_experience_months ==
       min(MAX_TOTAL_CREDIT_MONTHS,
           sum over ExperienceRecord r with r.verification_status == VERIFIED of r.credited_months)"
    forward_action: "POST /references/{reference_id}/evaluate with decision ACCEPT"
    compensating_action: "POST /references/{reference_id}/recant"
    requirement: >-
      "After ACCEPT followed by RECANT on the same Reference, ExperienceRecord.credited_months MUST be 0
      and Application.verified_experience_months MUST equal its value before the ACCEPT. The ledger
      equality MUST hold after every reference evaluation, recant and application withdrawal."

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the nine declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: >-
      "request body and query parameters are well formed: every required input present, enum values are
      declared members, numbers within their declared ranges, ISO 8601 datetimes parseable, pagination
      limit in [1,100] and offset >= 0, PDHRecord.completed_on inside the report period, seat_labels
      distinct, ConsentOrder.suspension_months == 0 unless sanction_type == SUSPENSION"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every {id} placeholder in the path resolves to an existing row, validated left to right"
    error_id: "the matching per-entity NOT_FOUND code (ERR_APPLICATION_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ...)"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: >-
      "every foreign key supplied in the request body resolves to an existing row, validated in the field
      order declared by the endpoint's input list"
    error_id: "the matching per-entity NOT_FOUND code"
    http_status: 404
    applies_to: "all endpoints whose input carries an *_id field"

  - priority: 6
    category: auth
    check: >-
      "entity-backed ownership: Applicant/Licensee X-User-ID == Engineer.id owning the target
      Application/License; SupervisingEngineer X-User-ID == Reference.referee_engineer_id; FirmAdmin
      X-User-ID == FirmRegistration.id named in the path or body; on
      POST /plan-submissions/{plan_submission_id}/seal the acting Licensee's X-User-ID must equal
      License(sealing_license_id).engineer_id. Not applied to POST /engineers, POST /applications
      (where engineer_id must instead EQUAL X-User-ID) or POST /firm-registrations."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: >-
      "POST /applications, /applications/{id}/submit, /applications/{id}/payments,
      /applications/{id}/respond-deficiency, /applications/{id}/withdraw,
      /applications/{id}/experience-records, /experience-records/{id}/references,
      /references/{id}/submit, /references/{id}/recant, /exam-appointments,
      /exam-appointments/{id}/cancel, /exam-authorizations/{id}/retake, /licenses/{id}/renew,
      /cpc-reports, /cpc-reports/{id}/pdh-records,
      /plan-submissions, /plan-submissions/{id}/seal,
      /firm-registrations/{id}/responsible-charge"

  - priority: 7
    category: auth
    check: >-
      "segregation of duties on X-User-ID: (a) POST /cpc-reports/{id}/audit-decision actor !=
      CPCAudit.created_by_user_id; (b) POST /consent-orders/{id}/execute actor !=
      Case.assigned_investigator_user_id; (c) POST /applications/{id}/approve-exam and
      POST /applications/{id}/issue-license actor != Application.credit_determined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: >-
      "POST /cpc-reports/{cpc_report_id}/audit-decision, POST /consent-orders/{consent_order_id}/execute,
      POST /applications/{application_id}/approve-exam, POST /applications/{application_id}/issue-license"

  - priority: 8
    category: state
    check: "expected_license_version == License.version / expected_case_version == Case.version"
    error_id: "ERR_STALE_LICENSE_VERSION on POST /cpc-reports, ERR_STALE_CASE_VERSION on POST /consent-orders"
    http_status: 412
    applies_to: "POST /cpc-reports, POST /consent-orders"

  - priority: 9
    category: state
    check: "the target row is in a state from which the requested transition is declared in §1.2"
    error_id: >-
      "ERR_APPLICATION_STATE_INVALID, ERR_REFERENCE_STATE_INVALID, ERR_EXAM_STATE_INVALID,
      ERR_LICENSE_STATE_INVALID, ERR_CPC_REPORT_STATE_INVALID, ERR_FIRM_STATE_INVALID,
      ERR_CASE_STATE_INVALID or ERR_PLAN_STATE_INVALID as appropriate"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 10
    category: state
    check: >-
      "cross-entity guard states hold: ExamAppointment creation requires Application.status ==
      EXAM_APPROVED (ERR_APPLICATION_STATE_INVALID); PlanSubmission sealing requires
      FirmRegistration.status == ACTIVE (ERR_FIRM_STATE_INVALID); ConsentOrder creation requires
      Case.investigation_status == PROBABLE_CAUSE (ERR_PROBABLE_CAUSE_REQUIRED); Reference submission
      requires ExperienceRecord.verification_status == PENDING_VERIFICATION
      (ERR_REFERENCE_STATE_INVALID)"
    error_id: "as listed in the check"
    http_status: 409
    applies_to: >-
      "POST /exam-appointments, POST /plan-submissions/{plan_submission_id}/seal, POST /consent-orders,
      POST /references/{reference_id}/submit"

  - priority: 11
    category: business_safety
    check: "the license whose seal is being affixed has status == ACTIVE"
    error_id: ERR_SEAL_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /plan-submissions/{plan_submission_id}/seal"

  - priority: 12
    category: business_safety
    check: "the referee holds a License with status == ACTIVE at the moment the reference is submitted"
    error_id: ERR_REFEREE_LICENSE_INACTIVE
    http_status: 422
    applies_to: "POST /references/{reference_id}/submit"

  - priority: 13
    category: business_safety
    check: "the license nominated as responsible charge has status == ACTIVE"
    error_id: ERR_RESPONSIBLE_CHARGE_LICENSE_INACTIVE
    http_status: 422
    applies_to: "POST /firm-registrations, POST /firm-registrations/{firm_registration_id}/responsible-charge"

  - priority: 14
    category: business_referential
    check: "sealing_license_id == FirmRegistration.responsible_charge_license_id"
    error_id: ERR_NOT_RESPONSIBLE_CHARGE
    http_status: 422
    applies_to: "POST /plan-submissions/{plan_submission_id}/seal"

  - priority: 15
    category: business_referential
    check: "Reference.referee_engineer_id != Application.engineer_id of the reference's application"
    error_id: ERR_SELF_REFERENCE_FORBIDDEN
    http_status: 422
    applies_to: "POST /experience-records/{experience_record_id}/references"

  - priority: 16
    category: business_referential
    check: >-
      "exactly one respondent target is supplied: respondent_license_id set and
      unlicensed_respondent_name null, or the reverse. allegation_type UNLICENSED_PRACTICE requires
      unlicensed_respondent_name; allegation_type PLAN_STAMPING requires subject_plan_submission_id"
    error_id: ERR_RESPONDENT_TARGET_INVALID
    http_status: 422
    applies_to: "POST /cases"

  - priority: 17
    category: business_constraint
    check: "Application.education_status IN {EABET_ACCREDITED, NON_ACCREDITED_EVALUATED}"
    error_id: ERR_EDUCATION_NOT_EVALUATED
    http_status: 422
    applies_to: "POST /applications/{application_id}/submit"

  - priority: 18
    category: business_temporal
    check: "the claimed month range does not intersect any non-RECANTED ExperienceRecord on the same Application (closed inclusive month intervals, calculations.experience_period_overlap)"
    error_id: ERR_EXPERIENCE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /applications/{application_id}/experience-records"

  - priority: 19
    category: business_temporal
    check: "window_end - window_start == EXAM_WINDOW_MINUTES (480) minutes exactly"
    error_id: ERR_EXAM_WINDOW_LENGTH_INVALID
    http_status: 422
    applies_to: "POST /exam-appointments"

  - priority: 20
    category: business_temporal
    check: "no buffered collision on (test_center_id, seat_label) per calculations.exam_seat_interval_conflict"
    error_id: ERR_SEAT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exam-appointments"

  - priority: 21
    category: business_constraint
    check: "TestCenter.seats_available >= 1 and TestCenter.status == OPEN"
    error_id: ERR_NO_SEAT_AVAILABLE
    http_status: 409
    applies_to: "POST /exam-appointments"

  - priority: 22
    category: business_temporal
    check: "logical clock now < ExamAuthorization.authorization_expires_at"
    error_id: ERR_AUTHORIZATION_EXPIRED
    http_status: 409
    applies_to: "POST /exam-appointments, POST /exam-authorizations/{exam_authorization_id}/retake"

  - priority: 23
    category: business_temporal
    check: "logical clock now >= ExamAuthorization.retake_eligible_at"
    error_id: ERR_RETAKE_WAITING_PERIOD
    http_status: 409
    applies_to: "POST /exam-authorizations/{exam_authorization_id}/retake"

  - priority: 24
    category: business_constraint
    check: "ExamAuthorization.attempt_number < MAX_EXAM_ATTEMPTS (3)"
    error_id: ERR_ATTEMPT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /exam-authorizations/{exam_authorization_id}/retake"

  - priority: 25
    category: business_constraint
    check: "Application.deficiency_cycle_count < MAX_DEFICIENCY_CYCLES (3)"
    error_id: ERR_DEFICIENCY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /applications/{application_id}/deficiency"

  - priority: 26
    category: business_temporal
    check: "logical clock now <= Application.deficiency_due_at"
    error_id: ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /applications/{application_id}/respond-deficiency"

  - priority: 27
    category: business_referential
    check: >-
      "the requested board action matches the application's pathway: approve-exam requires pathway ==
      STANDARD_EXAM; issue-license from UNDER_REVIEW requires pathway == COMITY"
    error_id: ERR_PATHWAY_MISMATCH
    http_status: 409
    applies_to: "POST /applications/{application_id}/approve-exam, POST /applications/{application_id}/issue-license"

  - priority: 28
    category: business_referential
    check: "Application.ncees_record_status == MATCHED and Application.ncees_verified_exam_pass == true"
    error_id: ERR_NCEES_RECORD_NOT_MATCHED
    http_status: 422
    applies_to: "POST /applications/{application_id}/issue-license when pathway == COMITY"

  - priority: 29
    category: business_temporal
    check: "logical clock now <= Application.ncees_record_expires_on"
    error_id: ERR_NCEES_RECORD_EXPIRED
    http_status: 422
    applies_to: "POST /applications/{application_id}/issue-license when pathway == COMITY"

  - priority: 30
    category: business_constraint
    check: "Application.ncees_verified_years_licensed >= COMITY_MIN_YEARS (4)"
    error_id: ERR_COMITY_YEARS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /applications/{application_id}/issue-license when pathway == COMITY"

  - priority: 31
    category: business_constraint
    check: >-
      "no Reference on any ExperienceRecord of this Application is left in status REQUESTED or SUBMITTED,
      and Application.credit_determined_by_user_id != null"
    error_id: ERR_REFERENCE_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /applications/{application_id}/approve-exam, POST /applications/{application_id}/issue-license"

  - priority: 32
    category: business_constraint
    check: "Application.verified_experience_months >= MIN_EXPERIENCE_MONTHS (48)"
    error_id: ERR_EXPERIENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /applications/{application_id}/approve-exam, POST /applications/{application_id}/issue-license"

  - priority: 33
    category: business_constraint
    check: "no License with the same engineer_id already has status == ACTIVE"
    error_id: ERR_DUPLICATE_ACTIVE_LICENSE
    http_status: 409
    applies_to: "POST /licenses, POST /applications/{application_id}/issue-license"

  - priority: 34
    category: business_temporal
    check: "License.renewal_window_opens_at <= logical clock now <= License.current_period_end"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /licenses/{license_id}/renew"

  - priority: 35
    category: business_constraint
    check: >-
      "a CPCReport exists for this License with period_end == License.current_period_end, status IN
      {ACCEPTED, AUDIT_CLEARED} and shortfall_pdh == 0"
    error_id: ERR_CPC_SHORTFALL
    http_status: 422
    applies_to: "POST /licenses/{license_id}/renew"

  - priority: 36
    category: business_constraint
    check: "CPCReport.self_certified_pdh == CPCReport.self_certified_total_pdh"
    error_id: ERR_PDH_SELF_CERT_MISMATCH
    http_status: 422
    applies_to: "POST /cpc-reports/{cpc_report_id}/accept"

  - priority: 37
    category: business_constraint
    check: "CPCReport.status == UNDER_AUDIT"
    error_id: ERR_REPORT_NOT_UNDER_AUDIT
    http_status: 409
    applies_to: "POST /cpc-reports/{cpc_report_id}/audit-decision"

  - priority: 38
    category: business_constraint
    check: "the eligible audit pool per calculations.cpc_audit_sampling is non-empty"
    error_id: ERR_AUDIT_POOL_EMPTY
    http_status: 409
    applies_to: "POST /cpc-audits"

  - priority: 39
    category: business_temporal
    check: >-
      "for License.status == EXPIRED: logical clock now <= License.reinstatement_eligible_until.
      For License.status == SUSPENDED: logical clock now >= License.suspension_ends_at."
    error_id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /licenses/{license_id}/reinstate"

  - priority: 40
    category: business_constraint
    check: "request makeup_pdh >= REINSTATEMENT_MAKEUP_PDH (15)"
    error_id: ERR_REINSTATEMENT_MAKEUP_INSUFFICIENT
    http_status: 422
    applies_to: "POST /licenses/{license_id}/reinstate"

  - priority: 41
    category: business_constraint
    check: "request responsible_charge_attested == true"
    error_id: ERR_ATTESTATION_MISSING
    http_status: 422
    applies_to: "POST /plan-submissions/{plan_submission_id}/seal"

  - priority: 42
    category: business_constraint
    check: >-
      "closing a Case requires the sanction axis to be resolved: sanction_status IN
      {CONSENT_EXECUTED, HEARING_REFERRED} when investigation_status == PROBABLE_CAUSE, or
      sanction_status == NONE when investigation_status == NO_CAUSE"
    error_id: ERR_OPEN_SANCTION_BLOCKS_CLOSE
    http_status: 409
    applies_to: "POST /cases/{case_id}/close"

  - priority: 43
    category: business_temporal
    check: "the requested clock value is greater than or equal to the current logical clock value"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  - priority: 44
    category: business_fiscal
    check: "Application.fee_paid_cents >= Application.fee_assessment_cents"
    error_id: ERR_FEE_UNPAID
    http_status: 402
    applies_to: "POST /applications/{application_id}/submit"

  - priority: 45
    category: business_fiscal
    check: "ConsentOrder.penalty_paid_cents >= ConsentOrder.penalty_cents, and reinstatement_fee_cents >= REINSTATEMENT_FEE_CENTS (45000)"
    error_id: ERR_PENALTY_UNPAID
    http_status: 402
    applies_to: "POST /consent-orders/{consent_order_id}/execute, POST /licenses/{license_id}/reinstate"

  - priority: 46
    category: business_constraint
    check: "no CPCAudit with status == CLOSED already exists for the requested as_of_period_end — a closed audit cycle for a renewal period can never be re-drawn"
    error_id: ERR_AUDIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /cpc-audits"

# =============================================================================
# 1.5 API Endpoint Table
# Flat topology: every collection is a top-level path segment (api_prefix: "").
# FK reverse-reachability is served by the filtered-list form throughout
# (GET /<child-collection> with <fk_field>? in input, output <Child>[]).
# =============================================================================
endpoints:

  # --- test-driving surface (last rung of the §1.5 priority ladder) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      "Sets the server logical clock used by every temporal rule in this scaffold. The clock's startup
      default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads
      that default and MUST NOT fall back to real wall-clock time. Moving the clock forward runs the
      time sweep in one pass: (1) every ExamAuthorization in APPROVED_TO_SIT or SCHEDULED whose
      authorization_expires_at < to_iso8601 becomes EXPIRED and its SCHEDULED ExamAppointment becomes
      CANCELLED_BY_BOARD with the seat released to its TestCenter; (2) every License in ACTIVE whose
      current_period_end < to_iso8601 becomes EXPIRED with reinstatement_eligible_until set, and every
      FirmRegistration whose responsible_charge_license_id points at it becomes
      LAPSED_NO_RESPONSIBLE_CHARGE; (3) every FirmRegistration in ACTIVE or
      LAPSED_NO_RESPONSIBLE_CHARGE whose registration_expires_at < to_iso8601 becomes EXPIRED. Rewinding
      the clock is rejected."
    roles: [BoardSecretary]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_authorization_count: integer, expired_license_count: integer, expired_firm_count: integer, cancelled_appointment_count: integer, lapsed_firm_count: integer }"
    side_effects:
      - "advances the logical clock consulted by validations 22, 23, 26, 29, 34, 39 and 43"
      - "runs the ExamAuthorization expiry sweep, cancelling appointments and releasing seats via calculations.test_center_seat_ledger"
      - "runs the License period-end sweep (ACTIVE -> EXPIRED) and the dependent FirmRegistration posture recompute via calculations.firm_responsible_charge_posture"
      - "runs the FirmRegistration registration_expires_at sweep (-> EXPIRED)"

  # --- Engineer -------------------------------------------------------------
  - method: POST
    path: "/engineers"
    description: "Registers a natural person in the board roster. The returned id is the X-User-ID used by the Applicant, SupervisingEngineer and Licensee roles."
    roles: [BoardSecretary]
    code: 201
    input: [full_name, email, home_jurisdiction, "ncees_record_id?"]
    output: Engineer
    side_effects:
      - "email uniqueness enforced; active_license_number and open_case_count initialise to null and 0"

  - method: GET
    path: "/engineers/{engineer_id}"
    description: "Reads one engineer including the computed active_license_number and open_case_count."
    roles: [Applicant, SupervisingEngineer, Licensee, FirmAdmin, BoardReviewer, BoardLicensingOfficer, BoardInvestigator, BoardSecretary]
    code: 200
    input: []
    output: Engineer
    side_effects: []

  - method: GET
    path: "/engineers"
    description: "Paginated engineer roster with optional filters."
    roles: [BoardReviewer, BoardLicensingOfficer, BoardInvestigator, BoardSecretary]
    code: 200
    input: ["home_jurisdiction?", "email?", "limit?", "offset?"]
    output: Engineer[]
    side_effects: []

  # --- License --------------------------------------------------------------
  - method: POST
    path: "/licenses"
    description: >-
      "Board-side issuance of a licence outside the application workflow (seed path for referee licences,
      firm responsible-charge licences and pre-existing licensees). Sets the biennium via
      calculations.license_period_roll."
    roles: [BoardLicensingOfficer]
    code: 201
    input: [engineer_id, license_type, issued_on, "pdh_requirement?"]
    output: License
    side_effects:
      - "assigns the next ascending license_number in PE-000001 format"
      - "computes current_period_start, current_period_end and renewal_window_opens_at via calculations.license_period_roll"
      - "sets Engineer.active_license_number"

  - method: GET
    path: "/licenses/{license_id}"
    description: "Reads one licence with its current period window and discipline flag."
    roles: [Applicant, SupervisingEngineer, Licensee, FirmAdmin, BoardReviewer, BoardLicensingOfficer, BoardInvestigator, BoardSecretary]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licenses"
    description: "Filtered licence list. Reverse-reachability for License.engineer_id."
    roles: [Licensee, SupervisingEngineer, FirmAdmin, BoardReviewer, BoardLicensingOfficer, BoardInvestigator, BoardSecretary]
    code: 200
    input: ["engineer_id?", "status?", "license_type?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/licenses/{license_id}/renew"
    description: "Renews an ACTIVE licence inside its renewal window once continuing-competency is satisfied. Self-loop transition ACTIVE -> ACTIVE."
    roles: [Licensee]
    code: 200
    input: []
    output: License
    side_effects:
      - "rolls current_period_start / current_period_end / renewal_window_opens_at forward by BIENNIUM_MONTHS via calculations.license_period_roll"
      - "increments License.version by 1"

  - method: POST
    path: "/licenses/{license_id}/reinstate"
    description: "Reinstates an EXPIRED licence inside the reinstatement grace window, or a SUSPENDED licence whose suspension_ends_at has passed, on payment of the reinstatement fee and proof of makeup PDH."
    roles: [BoardLicensingOfficer]
    code: 200
    input: [makeup_pdh, reinstatement_fee_cents]
    output: License
    side_effects:
      - "status -> ACTIVE; a fresh biennium is opened via calculations.license_period_roll"
      - "reinstatement_eligible_until and suspension_ends_at cleared"
      - "restores Engineer.active_license_number and recomputes the posture of every FirmRegistration pointing at this licence via calculations.firm_responsible_charge_posture"
      - "increments License.version by 1"

  # --- Application ----------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Opens a DRAFT application. engineer_id MUST equal the acting X-User-ID. pathway selects the STANDARD_EXAM or COMITY track and is immutable thereafter."
    roles: [Applicant]
    code: 201
    input: [engineer_id, pathway, exam_code, degree_level, "expedite_requested?"]
    output: Application
    side_effects:
      - "status initialises to DRAFT, education_status to NOT_EVALUATED, ncees_record_status to NOT_REQUESTED"
      - "fee_assessment_cents computed via calculations.application_fee_assessment with zero experience records"

  - method: GET
    path: "/applications/{application_id}"
    description: "Reads one application including provisional_experience_months, verified_experience_months and the deficiency counters."
    roles: [Applicant, BoardReviewer, BoardLicensingOfficer, BoardSecretary]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "Filtered application list. Reverse-reachability for Application.engineer_id."
    roles: [Applicant, BoardReviewer, BoardLicensingOfficer, BoardSecretary]
    code: 200
    input: ["engineer_id?", "status?", "pathway?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{application_id}/education-evaluation"
    description: "Board records the transcript finding. accreditation_finding is one of EABET_ACCREDITED, NON_ACCREDITED_EVALUATED, REJECTED and drives education_status."
    roles: [BoardReviewer]
    code: 200
    input: [degree_level, accreditation_finding]
    output: Application
    side_effects:
      - "education_status set from accreditation_finding; REJECTED forces Application status DRAFT -> DENIED with denial_reason EDUCATION_REJECTED"
      - "degree_level change re-runs calculations.experience_credit_evaluation variant provisional_self_reported over every ExperienceRecord (post_degree re-derivation)"

  - method: POST
    path: "/applications/{application_id}/ncees-verification"
    description: "The national records program posts the verified comity credential packet for this application."
    roles: [TestingService]
    code: 200
    input: [ncees_record_id, source_jurisdiction, verified_exam_pass, verified_years_licensed, disciplinary_history_count, record_expires_on]
    output: Application
    side_effects:
      - "ncees_record_status set to MATCHED when ncees_record_id equals Engineer.ncees_record_id, otherwise MISMATCH"
      - "ncees_verified_exam_pass, ncees_verified_years_licensed, ncees_disciplinary_history_count and ncees_record_expires_on stored"
      - "re-runs calculations.application_fee_assessment ONLY while the application is still DRAFT (NCEES_RECORD_FEE_CENTS now applies); once submit has frozen fee_assessment_cents a later packet never changes it"

  - method: GET
    path: "/applications/{application_id}/fee-assessment"
    description: "Computed read exposing every intermediate of calculations.application_fee_assessment so the pinned evaluation order is observable."
    roles: [Applicant, BoardReviewer, BoardLicensingOfficer]
    code: 200
    input: []
    output: "{ base_fee_cents: integer, records_verification_fee_cents: integer, ncees_record_fee_cents: integer, expedite_surcharge_cents: integer, pre_credit_total_cents: integer, comity_credit_tier_pct: number, comity_credit_cents: integer, assessment_total_cents: integer }"
    side_effects: []

  - method: POST
    path: "/applications/{application_id}/payments"
    description: "Records a fee payment against the application. Accumulates into fee_paid_cents."
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: Application
    side_effects:
      - "fee_paid_cents += amount_cents"

  - method: POST
    path: "/applications/{application_id}/submit"
    description: "Submits a DRAFT application to the board. Requires an evaluated education record and a fully paid assessment."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at stamped from the logical clock"
      - "every UNVERIFIED ExperienceRecord moves to PENDING_VERIFICATION"
      - "provisional_experience_months recomputed via calculations.experience_credit_evaluation variant provisional_self_reported"

  - method: POST
    path: "/applications/{application_id}/start-review"
    description: "A board reviewer takes the file. SUBMITTED -> UNDER_REVIEW, or DEFICIENT -> UNDER_REVIEW after an applicant response."
    roles: [BoardReviewer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "reviewer_user_id set to the acting X-User-ID"

  - method: POST
    path: "/applications/{application_id}/deficiency"
    description: "Issues a deficiency notice. Cyclic transition UNDER_REVIEW -> DEFICIENT, bounded by MAX_DEFICIENCY_CYCLES."
    roles: [BoardReviewer]
    code: 200
    input: [deficiency_reason]
    output: Application
    side_effects:
      - "deficiency_cycle_count += 1; deficiency_reason stored; deficiency_due_at = logical clock now + DEFICIENCY_RESPONSE_DAYS (30)"

  - method: POST
    path: "/applications/{application_id}/respond-deficiency"
    description: "Applicant cures a deficiency inside the response window. DEFICIENT -> UNDER_REVIEW."
    roles: [Applicant]
    code: 200
    input: [response_note]
    output: Application
    side_effects:
      - "deficiency_reason and deficiency_due_at cleared; deficiency_cycle_count retained"

  - method: POST
    path: "/applications/{application_id}/credit-determination"
    description: >-
      "The reviewer finalises experience credit from the accepted supervising-engineer verifications. Runs
      calculations.experience_credit_evaluation variant verified_final and stamps
      credit_determined_by_user_id, which the segregation-of-duties rule (validation 7) later reads."
    roles: [BoardReviewer, BoardLicensingOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "verified_experience_months set from the verified_final variant"
      - "credit_determined_by_user_id set to the acting X-User-ID"

  - method: POST
    path: "/applications/{application_id}/approve-exam"
    description: "STANDARD_EXAM fork: UNDER_REVIEW -> EXAM_APPROVED. Mints the ExamAuthorization the candidate schedules against."
    roles: [BoardLicensingOfficer]
    code: 201
    input: []
    output: ExamAuthorization
    side_effects:
      - "Application status UNDER_REVIEW -> EXAM_APPROVED"
      - "creates ExamAuthorization {status APPROVED_TO_SIT, attempt_number 1, result PENDING, authorization_expires_at = logical clock now + AUTHORIZATION_VALID_DAYS (365)}"

  - method: POST
    path: "/applications/{application_id}/issue-license"
    description: >-
      "Terminal grant. From EXAM_APPROVED once the authorization is PASSED (STANDARD_EXAM), or directly
      from UNDER_REVIEW on the COMITY pathway once the national records packet clears validations 28-30."
    roles: [BoardLicensingOfficer]
    code: 201
    input: []
    output: License
    side_effects:
      - "Application status -> LICENSE_ISSUED"
      - "creates License {license_type STANDARD for the exam pathway or COMITY for the comity pathway, status ACTIVE}"
      - "computes the first biennium via calculations.license_period_roll"
      - "sets Engineer.active_license_number"

  - method: POST
    path: "/applications/{application_id}/deny"
    description: "Terminal denial from UNDER_REVIEW, DEFICIENT or EXAM_APPROVED."
    roles: [BoardLicensingOfficer]
    code: 200
    input: [denial_reason]
    output: Application
    side_effects:
      - "status -> DENIED"
      - "every ExamAuthorization in APPROVED_TO_SIT or SCHEDULED -> CANCELLED, its SCHEDULED ExamAppointment -> CANCELLED_BY_BOARD and the seat is released"

  - method: POST
    path: "/applications/{application_id}/withdraw"
    description: "Applicant abandons the file from DRAFT, SUBMITTED, UNDER_REVIEW or DEFICIENT."
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status -> WITHDRAWN; every Reference still in REQUESTED -> REJECTED"

  # --- ExperienceRecord -----------------------------------------------------
  - method: POST
    path: "/applications/{application_id}/experience-records"
    description: "Nested creation of a self-reported experience block. Rejected when the month range collides with an existing non-RECANTED block on the same application."
    roles: [Applicant]
    code: 201
    input: [employer_name, position_title, period_start_month, period_end_month, responsibility_level, post_degree]
    output: ExperienceRecord
    side_effects:
      - "raw_months, credit_multiplier and credited_months computed via calculations.experience_credit_evaluation variant provisional_self_reported"
      - "Application.provisional_experience_months recomputed"
      - "re-runs calculations.application_fee_assessment (RECORDS_FEE_PER_RECORD_CENTS scales with record count)"

  - method: GET
    path: "/experience-records/{experience_record_id}"
    description: "Reads one experience block with its multiplier and credited months."
    roles: [Applicant, SupervisingEngineer, BoardReviewer, BoardLicensingOfficer]
    code: 200
    input: []
    output: ExperienceRecord
    side_effects: []

  - method: GET
    path: "/experience-records"
    description: "Filtered experience-record list. Reverse-reachability for ExperienceRecord.application_id."
    roles: [Applicant, SupervisingEngineer, BoardReviewer, BoardLicensingOfficer]
    code: 200
    input: ["application_id?", "verification_status?", "responsibility_level?", "limit?", "offset?"]
    output: ExperienceRecord[]
    side_effects: []

  # --- Reference ------------------------------------------------------------
  - method: POST
    path: "/experience-records/{experience_record_id}/references"
    description: "Requests a supervising-engineer verification for an experience block. Self-reference is forbidden."
    roles: [Applicant]
    code: 201
    input: [referee_engineer_id, relationship]
    output: Reference
    side_effects:
      - "status initialises to REQUESTED"
      - "ExperienceRecord.verification_status UNVERIFIED -> PENDING_VERIFICATION when the parent Application is already SUBMITTED or later"

  - method: GET
    path: "/references/{reference_id}"
    description: "Reads one verification request with its evaluation score and confirmed months."
    roles: [Applicant, SupervisingEngineer, BoardReviewer, BoardLicensingOfficer]
    code: 200
    input: []
    output: Reference
    side_effects: []

  - method: GET
    path: "/references"
    description: "Filtered reference list. Reverse-reachability for Reference.experience_record_id and Reference.referee_engineer_id."
    roles: [Applicant, SupervisingEngineer, BoardReviewer, BoardLicensingOfficer]
    code: 200
    input: ["experience_record_id?", "referee_engineer_id?", "status?", "limit?", "offset?"]
    output: Reference[]
    side_effects: []

  - method: POST
    path: "/references/{reference_id}/submit"
    description: "The supervising engineer answers the verification. Requires the referee to hold an ACTIVE licence at the moment of submission."
    roles: [SupervisingEngineer]
    code: 200
    input: [evaluation_score, months_confirmed, responsibility_confirmed]
    output: Reference
    side_effects:
      - "status REQUESTED -> SUBMITTED; submitted_at stamped from the logical clock"

  - method: POST
    path: "/references/{reference_id}/evaluate"
    description: "Board adjudicates the verification. decision is ACCEPT or REJECT."
    roles: [BoardReviewer]
    code: 200
    input: [decision]
    output: Reference
    side_effects:
      - "ACCEPT: status SUBMITTED -> ACCEPTED, ExperienceRecord.verification_status -> VERIFIED, credited_months recomputed via calculations.experience_credit_evaluation variant verified_final, Application.verified_experience_months recomputed"
      - "REJECT: status SUBMITTED -> REJECTED; ExperienceRecord.verification_status -> DISPUTED and its credited_months set to 0"
      - "forward action of conserved_invariants.experience_credit_ledger_conservation"

  - method: POST
    path: "/references/{reference_id}/recant"
    description: >-
      "The supervising engineer withdraws an already-accepted verification. Entry point of the depth-5
      cascade documented in §1.2 (Reference -> ExperienceRecord -> Application -> ExamAuthorization ->
      ExamAppointment/TestCenter) and the compensating action of
      conserved_invariants.experience_credit_ledger_conservation."
    roles: [SupervisingEngineer]
    code: 200
    input: [recant_reason]
    output: Reference
    side_effects:
      - "link 1: Reference ACCEPTED -> RECANTED, recant_reason stored"
      - "link 2: ExperienceRecord VERIFIED -> RECANTED with credited_months reset to 0"
      - "link 3: Application.verified_experience_months recomputed; when the application is EXAM_APPROVED and the new total is below MIN_EXPERIENCE_MONTHS the application moves EXAM_APPROVED -> DEFICIENT"
      - "link 4: every ExamAuthorization of that application in APPROVED_TO_SIT or SCHEDULED -> CANCELLED"
      - "link 5: every SCHEDULED ExamAppointment of those authorizations -> CANCELLED_BY_BOARD and its seat is returned to the TestCenter via calculations.test_center_seat_ledger"

  # --- TestCenter -----------------------------------------------------------
  - method: POST
    path: "/test-centers"
    description: "Registers a national-testing-service seat inventory. seat_count is derived from the distinct seat_labels supplied."
    roles: [BoardSecretary]
    code: 201
    input: [name, state_code, seat_labels, "status?"]
    output: TestCenter
    side_effects:
      - "seat_count = len(seat_labels); seats_committed 0; seats_available = seat_count per calculations.test_center_seat_ledger"

  - method: GET
    path: "/test-centers/{test_center_id}"
    description: "Reads one test centre with its live seat ledger."
    roles: [Applicant, BoardSecretary, BoardLicensingOfficer, TestingService]
    code: 200
    input: []
    output: TestCenter
    side_effects: []

  - method: GET
    path: "/test-centers"
    description: "Filtered test-centre list."
    roles: [Applicant, BoardSecretary, BoardLicensingOfficer, TestingService]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: TestCenter[]
    side_effects: []

  # --- ExamAuthorization ----------------------------------------------------
  - method: GET
    path: "/exam-authorizations/{exam_authorization_id}"
    description: "Reads one authorization with attempt_number, result and retake_eligible_at."
    roles: [Applicant, BoardReviewer, BoardLicensingOfficer, BoardSecretary, TestingService]
    code: 200
    input: []
    output: ExamAuthorization
    side_effects: []

  - method: GET
    path: "/exam-authorizations"
    description: "Filtered authorization list. Reverse-reachability for ExamAuthorization.application_id."
    roles: [Applicant, BoardReviewer, BoardLicensingOfficer, BoardSecretary, TestingService]
    code: 200
    input: ["application_id?", "status?", "exam_code?", "limit?", "offset?"]
    output: ExamAuthorization[]
    side_effects: []

  - method: POST
    path: "/exam-authorizations/{exam_authorization_id}/score"
    description: "The national testing service reports a raw score for a SCHEDULED authorization. PASSING_SCORE is 70."
    roles: [TestingService]
    code: 200
    input: [raw_score, administered_at, ncees_transmission_id]
    output: ExamAuthorization
    side_effects:
      - "raw_score >= 70: status SCHEDULED -> PASSED, result PASS"
      - "raw_score < 70: status SCHEDULED -> FAILED, result FAIL, retake_eligible_at = administered_at + RETAKE_WAIT_DAYS (90)"
      - "the linked SCHEDULED ExamAppointment -> COMPLETED and its seat is released via calculations.test_center_seat_ledger"

  - method: POST
    path: "/exam-authorizations/{exam_authorization_id}/retake"
    description: "Candidate re-arms a FAILED authorization after the waiting period. Cyclic transition FAILED -> APPROVED_TO_SIT, bounded by MAX_EXAM_ATTEMPTS."
    roles: [Applicant]
    code: 200
    input: []
    output: ExamAuthorization
    side_effects:
      - "attempt_number += 1; result reset to PENDING; raw_score cleared"

  # --- ExamAppointment ------------------------------------------------------
  - method: POST
    path: "/exam-appointments"
    description: >-
      "Books a seat for an APPROVED_TO_SIT authorization. Enforces the exact 480-minute window, the
      buffered seat-interval conflict rule (calculations.exam_seat_interval_conflict) and seat
      availability, in validation-priority order 19 -> 20 -> 21."
    roles: [Applicant]
    code: 201
    input: [exam_authorization_id, test_center_id, seat_label, window_start, window_end]
    output: ExamAppointment
    side_effects:
      - "ExamAuthorization APPROVED_TO_SIT -> SCHEDULED"
      - "TestCenter.seats_committed += 1 and seats_available -= 1 per calculations.test_center_seat_ledger (forward action of conserved_invariants.seat_capacity_conservation)"

  - method: GET
    path: "/exam-appointments/{exam_appointment_id}"
    description: "Reads one appointment with its seat and window."
    roles: [Applicant, BoardSecretary, BoardLicensingOfficer, TestingService]
    code: 200
    input: []
    output: ExamAppointment
    side_effects: []

  - method: GET
    path: "/exam-appointments"
    description: "Filtered appointment list. Reverse-reachability for ExamAppointment.exam_authorization_id and ExamAppointment.test_center_id."
    roles: [Applicant, BoardSecretary, BoardLicensingOfficer, TestingService]
    code: 200
    input: ["exam_authorization_id?", "test_center_id?", "status?", "limit?", "offset?"]
    output: ExamAppointment[]
    side_effects: []

  - method: POST
    path: "/exam-appointments/{exam_appointment_id}/cancel"
    description: "Cancels a SCHEDULED appointment. The Applicant path records CANCELLED_BY_CANDIDATE; the BoardSecretary path records CANCELLED_BY_BOARD."
    roles: [Applicant, BoardSecretary]
    code: 200
    input: ["reason?"]
    output: ExamAppointment
    side_effects:
      - "ExamAuthorization SCHEDULED -> APPROVED_TO_SIT (cyclic return)"
      - "TestCenter.seats_committed -= 1 and seats_available += 1 (compensating action of conserved_invariants.seat_capacity_conservation)"

  # --- FirmRegistration -----------------------------------------------------
  - method: POST
    path: "/firm-registrations"
    description: "Registers a firm for the practice of engineering. Requires an ACTIVE licence in responsible charge. The returned id is the X-User-ID used by the FirmAdmin role."
    roles: [BoardLicensingOfficer]
    code: 201
    input: [firm_name, state_code, responsible_charge_license_id]
    output: FirmRegistration
    side_effects:
      - "status ACTIVE; registration_expires_at = logical clock now + FIRM_REGISTRATION_DAYS (365) per calculations.firm_responsible_charge_posture"

  - method: GET
    path: "/firm-registrations/{firm_registration_id}"
    description: "Reads one firm registration with its responsible-charge licence and posture."
    roles: [FirmAdmin, Licensee, BoardLicensingOfficer, BoardInvestigator, BoardSecretary]
    code: 200
    input: []
    output: FirmRegistration
    side_effects: []

  - method: GET
    path: "/firm-registrations"
    description: "Filtered firm list. Reverse-reachability for FirmRegistration.responsible_charge_license_id."
    roles: [FirmAdmin, Licensee, BoardLicensingOfficer, BoardInvestigator, BoardSecretary]
    code: 200
    input: ["responsible_charge_license_id?", "status?", "state_code?", "limit?", "offset?"]
    output: FirmRegistration[]
    side_effects: []

  - method: POST
    path: "/firm-registrations/{firm_registration_id}/responsible-charge"
    description: "Nominates a replacement licence in responsible charge. Cures a LAPSED_NO_RESPONSIBLE_CHARGE firm back to ACTIVE."
    roles: [FirmAdmin]
    code: 200
    input: [responsible_charge_license_id]
    output: FirmRegistration
    side_effects:
      - "responsible_charge_license_id replaced; posture recomputed via calculations.firm_responsible_charge_posture"
      - "LAPSED_NO_RESPONSIBLE_CHARGE -> ACTIVE and lapsed_at cleared when the new licence is ACTIVE"

  # --- PlanSubmission -------------------------------------------------------
  - method: POST
    path: "/plan-submissions"
    description: "Files a DRAFT plan set under a firm registration. sheet_count feeds the per-sheet component of calculations.civil_penalty_assessment when the set is later found to be improperly stamped."
    roles: [FirmAdmin]
    code: 201
    input: [firm_registration_id, project_name, sheet_count]
    output: PlanSubmission
    side_effects:
      - "status DRAFT; sealing_license_id null; responsible_charge_attested false"

  - method: GET
    path: "/plan-submissions/{plan_submission_id}"
    description: "Reads one plan set with its seal state."
    roles: [FirmAdmin, Licensee, BoardInvestigator, BoardLicensingOfficer]
    code: 200
    input: []
    output: PlanSubmission
    side_effects: []

  - method: GET
    path: "/plan-submissions"
    description: "Filtered plan-set list. Reverse-reachability for PlanSubmission.firm_registration_id and PlanSubmission.sealing_license_id."
    roles: [FirmAdmin, Licensee, BoardInvestigator, BoardLicensingOfficer]
    code: 200
    input: ["firm_registration_id?", "sealing_license_id?", "status?", "limit?", "offset?"]
    output: PlanSubmission[]
    side_effects: []

  - method: POST
    path: "/plan-submissions/{plan_submission_id}/seal"
    description: >-
      "Affixes a licensee seal to a DRAFT plan set. Validation priority 11 (seal licence must be ACTIVE)
      is deliberately checked before priority 14 (the sealing licence must be the firm's licence in
      responsible charge) so a revoked outsider's seal reports the safety error, not the referential one."
    roles: [Licensee]
    code: 200
    input: [sealing_license_id, responsible_charge_attested]
    output: PlanSubmission
    side_effects:
      - "status DRAFT -> SEALED; seal_affixed_at stamped from the logical clock"

  - method: POST
    path: "/plan-submissions/{plan_submission_id}/flag"
    description: "Investigator marks a SEALED plan set as suspect stamping. Terminal state FLAGGED."
    roles: [BoardInvestigator]
    code: 200
    input: [reason]
    output: PlanSubmission
    side_effects:
      - "status SEALED -> FLAGGED"

  # --- CPCReport / PDHRecord ------------------------------------------------
  - method: POST
    path: "/cpc-reports"
    description: >-
      "Files a continuing-professional-competency report against a licence for one biennium.
      expected_license_version MUST equal the licence's current version; a stale value is rejected with
      ERR_STALE_LICENSE_VERSION (412). Re-filing for a period that already has a SUBMITTED report
      supersedes the earlier one via supersedes_report_id."
    roles: [Licensee]
    code: 201
    input: [license_id, period_start, period_end, self_certified_pdh, "carryover_pdh_claimed?", expected_license_version]
    output: CPCReport
    side_effects:
      - "increments License.version by 1"
      - "status SUBMITTED; self_certified_total_pdh and shortfall_pdh computed via calculations.cpc_pdh_valuation variant self_certified over zero PDH records"
      - "any prior SUBMITTED report for the same licence and period moves SUBMITTED -> SUPERSEDED and the new report's supersedes_report_id points at it"

  - method: GET
    path: "/cpc-reports/{cpc_report_id}"
    description: "Reads one CPC report with both PDH totals and the shortfall."
    roles: [Licensee, BoardReviewer, BoardSecretary, BoardLicensingOfficer]
    code: 200
    input: []
    output: CPCReport
    side_effects: []

  - method: GET
    path: "/cpc-reports"
    description: "Filtered CPC report list. Reverse-reachability for CPCReport.license_id, CPCReport.audit_id and the self-referential CPCReport.supersedes_report_id."
    roles: [Licensee, BoardReviewer, BoardSecretary, BoardLicensingOfficer]
    code: 200
    input: ["license_id?", "audit_id?", "supersedes_report_id?", "status?", "limit?", "offset?"]
    output: CPCReport[]
    side_effects: []

  - method: POST
    path: "/cpc-reports/{cpc_report_id}/pdh-records"
    description: "Nested creation of an immutable professional-development-hour line item (common_fields: false — no version, no update endpoint). completed_on must fall inside the report period."
    roles: [Licensee]
    code: 201
    input: [activity_type, pdh_hours, completed_on, "ethics_flag?"]
    output: PDHRecord
    side_effects:
      - "CPCReport.self_certified_total_pdh and shortfall_pdh recomputed via calculations.cpc_pdh_valuation variant self_certified"

  - method: GET
    path: "/pdh-records/{pdh_record_id}"
    description: "Reads one PDH line item."
    roles: [Licensee, BoardReviewer, BoardSecretary]
    code: 200
    input: []
    output: PDHRecord
    side_effects: []

  - method: GET
    path: "/pdh-records"
    description: "Filtered PDH list. Reverse-reachability for PDHRecord.cpc_report_id."
    roles: [Licensee, BoardReviewer, BoardSecretary]
    code: 200
    input: ["cpc_report_id?", "activity_type?", "documentation_status?", "limit?", "offset?"]
    output: PDHRecord[]
    side_effects: []

  - method: POST
    path: "/pdh-records/{pdh_record_id}/documentation-review"
    description: "Auditor accepts or rejects the documentation behind one PDH line item. decision is ACCEPT or REJECT."
    roles: [BoardReviewer]
    code: 200
    input: [decision]
    output: PDHRecord
    side_effects:
      - "documentation_status set to ACCEPTED or REJECTED"
      - "CPCReport.audit_verified_total_pdh recomputed via calculations.cpc_pdh_valuation variant audit_verified"

  - method: POST
    path: "/cpc-reports/{cpc_report_id}/accept"
    description: "Routine acceptance of a SUBMITTED report that was not drawn into an audit sample. Requires the licensee's self-certified figure to reconcile with the sum of its PDH records."
    roles: [BoardReviewer]
    code: 200
    input: []
    output: CPCReport
    side_effects:
      - "status SUBMITTED -> ACCEPTED"

  - method: POST
    path: "/cpc-audits"
    description: >-
      "Draws an audit sample over the ACCEPTED reports whose period_end equals as_of_period_end, per
      calculations.cpc_audit_sampling (margin-ascending ranking, created_at then license_number
      tie-break). created_by_user_id is the acting X-User-ID and later blocks that same user from
      deciding any report in this sample (validation 7)."
    roles: [BoardSecretary, BoardReviewer]
    code: 201
    input: [audit_cycle_label, sample_pct, as_of_period_end]
    output: CPCAudit
    side_effects:
      - "pool_size and sampled_count recorded; status SAMPLED"
      - "each selected CPCReport moves ACCEPTED -> UNDER_AUDIT and has audit_id set to this audit"

  - method: GET
    path: "/cpc-audits/{cpc_audit_id}"
    description: "Reads one audit cycle with its pool and sample sizes."
    roles: [BoardReviewer, BoardSecretary, BoardLicensingOfficer]
    code: 200
    input: []
    output: CPCAudit
    side_effects: []

  - method: GET
    path: "/cpc-audits"
    description: "Filtered audit-cycle list."
    roles: [BoardReviewer, BoardSecretary, BoardLicensingOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CPCAudit[]
    side_effects: []

  - method: POST
    path: "/cpc-reports/{cpc_report_id}/audit-decision"
    description: >-
      "Closes out one UNDER_AUDIT report. The acting X-User-ID MUST differ from the deciding audit's
      created_by_user_id. decision is CLEAR or DEFICIENT."
    roles: [BoardReviewer]
    code: 200
    input: [decision]
    output: CPCReport
    side_effects:
      - "audit_verified_total_pdh and shortfall_pdh recomputed via calculations.cpc_pdh_valuation variant audit_verified"
      - "status UNDER_AUDIT -> AUDIT_CLEARED or UNDER_AUDIT -> AUDIT_DEFICIENT; audit_decided_by_user_id stamped"
      - "bubble-up: when no report of the audit remains UNDER_AUDIT the CPCAudit moves SAMPLED -> CLOSED"
      - "AUDIT_DEFICIENT sets License.discipline_flag true"

  # --- Case -----------------------------------------------------------------
  - method: POST
    path: "/cases"
    description: >-
      "Opens a complaint. Exactly one respondent target is allowed: respondent_license_id for a licensed
      respondent, or unlicensed_respondent_name for an unlicensed-practice allegation. PLAN_STAMPING
      additionally requires subject_plan_submission_id."
    roles: [BoardInvestigator]
    code: 201
    input: [allegation_type, complainant_name, received_on, "respondent_license_id?", "subject_plan_submission_id?", "unlicensed_respondent_name?"]
    output: Case
    side_effects:
      - "investigation_status RECEIVED, sanction_status NONE (the two parallel axes of §1.2)"
      - "Engineer.open_case_count incremented for the respondent licence holder when respondent_license_id is supplied"

  - method: GET
    path: "/cases/{case_id}"
    description: "Reads one case with both axes, the factor counts and the assessed penalty."
    roles: [BoardInvestigator, BoardLicensingOfficer, BoardSecretary]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "Filtered case list. Reverse-reachability for Case.respondent_license_id and Case.subject_plan_submission_id."
    roles: [BoardInvestigator, BoardLicensingOfficer, BoardSecretary]
    code: 200
    input: ["respondent_license_id?", "subject_plan_submission_id?", "investigation_status?", "allegation_type?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/cases/{case_id}/open-investigation"
    description: "RECEIVED -> INVESTIGATING. Stamps assigned_investigator_user_id, which the segregation-of-duties rule later reads on consent-order execution."
    roles: [BoardInvestigator]
    code: 200
    input: []
    output: Case
    side_effects:
      - "assigned_investigator_user_id set to the acting X-User-ID"

  - method: POST
    path: "/cases/{case_id}/finding"
    description: >-
      "Records the investigative finding. finding is PROBABLE_CAUSE or NO_CAUSE. On PROBABLE_CAUSE the
      penalty is assessed through calculations.civil_penalty_assessment using the aggravating and
      mitigating factor counts, the violation count and (for PLAN_STAMPING) the subject plan set's
      sheet_count."
    roles: [BoardInvestigator]
    code: 200
    input: [finding, aggravating_factor_count, mitigating_factor_count, violation_count]
    output: Case
    side_effects:
      - "investigation_status INVESTIGATING -> PROBABLE_CAUSE or INVESTIGATING -> NO_CAUSE"
      - "penalty_factor and assessed_penalty_cents computed via calculations.civil_penalty_assessment (round-per-component then sum)"

  - method: POST
    path: "/cases/{case_id}/refer-hearing"
    description: "Sanction axis NONE|PROPOSED -> HEARING_REFERRED when the respondent declines a consent order."
    roles: [BoardInvestigator]
    code: 200
    input: []
    output: Case
    side_effects:
      - "sanction_status -> HEARING_REFERRED; any PROPOSED ConsentOrder -> SUPERSEDED"

  - method: POST
    path: "/cases/{case_id}/close"
    description: "Terminal close of the investigation axis. Blocked while the sanction axis is unresolved (validation 42)."
    roles: [BoardInvestigator]
    code: 200
    input: []
    output: Case
    side_effects:
      - "investigation_status -> CLOSED"
      - "Engineer.open_case_count decremented for the respondent licence holder"

  # --- ConsentOrder ---------------------------------------------------------
  - method: POST
    path: "/consent-orders"
    description: >-
      "Proposes a negotiated consent order on a case that has reached PROBABLE_CAUSE.
      expected_case_version MUST equal the case's current version; a stale value is rejected with
      ERR_STALE_CASE_VERSION (412). penalty_cents is copied from Case.assessed_penalty_cents, never
      supplied by the client."
    roles: [BoardInvestigator]
    code: 201
    input: [case_id, sanction_type, "suspension_months?", "penalty_paid_cents?", expected_case_version]
    output: ConsentOrder
    side_effects:
      - "increments Case.version by 1"
      - "status PROPOSED; penalty_cents copied from Case.assessed_penalty_cents"
      - "Case.sanction_status NONE -> PROPOSED"
      - "any earlier PROPOSED ConsentOrder on the same case -> SUPERSEDED"

  - method: GET
    path: "/consent-orders/{consent_order_id}"
    description: "Reads one consent order with its sanction type, suspension length and penalty ledger."
    roles: [BoardInvestigator, BoardLicensingOfficer, BoardSecretary]
    code: 200
    input: []
    output: ConsentOrder
    side_effects: []

  - method: GET
    path: "/consent-orders"
    description: "Filtered consent-order list. Reverse-reachability for ConsentOrder.case_id."
    roles: [BoardInvestigator, BoardLicensingOfficer, BoardSecretary]
    code: 200
    input: ["case_id?", "status?", "sanction_type?", "limit?", "offset?"]
    output: ConsentOrder[]
    side_effects: []

  - method: POST
    path: "/consent-orders/{consent_order_id}/execute"
    description: >-
      "Executes a PROPOSED consent order once the penalty is paid in full. Entry point of the depth-4
      cascade documented in §1.2 (ConsentOrder -> License -> FirmRegistration -> PlanSubmission). The
      acting X-User-ID MUST differ from the case's assigned_investigator_user_id."
    roles: [BoardInvestigator, BoardLicensingOfficer]
    code: 200
    input: [executed_on]
    output: ConsentOrder
    side_effects:
      - "link 1: ConsentOrder PROPOSED -> EXECUTED, executed_on and executed_by_user_id stamped; Case.sanction_status -> CONSENT_EXECUTED"
      - "link 2: the respondent License moves ACTIVE -> SUSPENDED (suspension_ends_at = executed_on + suspension_months) for SUSPENSION, ACTIVE -> REVOKED for REVOCATION, and only discipline_flag is set for REPRIMAND"
      - "link 3: every FirmRegistration whose responsible_charge_license_id is that licence moves ACTIVE -> LAPSED_NO_RESPONSIBLE_CHARGE on suspension, or ACTIVE -> REVOKED on revocation, per calculations.firm_responsible_charge_posture"
      - "link 4: every DRAFT PlanSubmission of those firms -> VOIDED; already SEALED plan sets are left untouched"
      - "Engineer.active_license_number cleared when the licence leaves ACTIVE"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the nine declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a resource it does not own (X-User-ID mismatch against the owning Engineer or FirmRegistration)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible upstream step (audit sampling, investigation assignment or credit determination)"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum member, out-of-range number, unparseable ISO 8601 value, pagination limit outside [1,100], duplicate seat_labels, or suspension_months non-zero for a non-SUSPENSION sanction"

  # --- existence ------------------------------------------------------------
  - id: ERR_ENGINEER_NOT_FOUND
    http: 404
    condition: "engineer_id in the path or body matches no Engineer"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "license_id, sealing_license_id, responsible_charge_license_id or respondent_license_id matches no License"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id in the path or as a filter target matches no Application"
  - id: ERR_EXPERIENCE_RECORD_NOT_FOUND
    http: 404
    condition: "experience_record_id matches no ExperienceRecord"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "reference_id matches no Reference"
  - id: ERR_TEST_CENTER_NOT_FOUND
    http: 404
    condition: "test_center_id matches no TestCenter"
  - id: ERR_EXAM_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "exam_authorization_id matches no ExamAuthorization"
  - id: ERR_EXAM_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "exam_appointment_id matches no ExamAppointment"
  - id: ERR_FIRM_REGISTRATION_NOT_FOUND
    http: 404
    condition: "firm_registration_id matches no FirmRegistration"
  - id: ERR_PLAN_SUBMISSION_NOT_FOUND
    http: 404
    condition: "plan_submission_id or subject_plan_submission_id matches no PlanSubmission"
  - id: ERR_CPC_REPORT_NOT_FOUND
    http: 404
    condition: "cpc_report_id or supersedes_report_id matches no CPCReport"
  - id: ERR_PDH_RECORD_NOT_FOUND
    http: 404
    condition: "pdh_record_id matches no PDHRecord"
  - id: ERR_CPC_AUDIT_NOT_FOUND
    http: 404
    condition: "cpc_audit_id or audit_id matches no CPCAudit"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "case_id matches no Case"
  - id: ERR_CONSENT_ORDER_NOT_FOUND
    http: 404
    condition: "consent_order_id matches no ConsentOrder"
  - id: ERR_SEAT_LABEL_NOT_FOUND
    http: 404
    condition: "seat_label is not a member of the target TestCenter.seat_labels"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_version on POST /cpc-reports does not equal the licence's current version"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version on POST /consent-orders does not equal the case's current version"

  # --- state ----------------------------------------------------------------
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "the requested application transition is not declared from its current status, or a dependent operation requires a status the application is not in"
  - id: ERR_REFERENCE_STATE_INVALID
    http: 409
    condition: "the requested reference transition is not declared from its current status, or the parent ExperienceRecord is not PENDING_VERIFICATION"
  - id: ERR_EXAM_STATE_INVALID
    http: 409
    condition: "the requested exam-authorization or exam-appointment transition is not declared from its current status"
  - id: ERR_LICENSE_STATE_INVALID
    http: 409
    condition: "the requested licence transition is not declared from its current status (e.g. renewing an EXPIRED licence, reinstating an ACTIVE one)"
  - id: ERR_CPC_REPORT_STATE_INVALID
    http: 409
    condition: "the requested CPC report transition is not declared from its current status (e.g. accepting a SUPERSEDED report)"
  - id: ERR_FIRM_STATE_INVALID
    http: 409
    condition: "the firm registration is not ACTIVE where the operation requires it, or the requested firm transition is not declared"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the requested plan-submission transition is not declared from its current status (e.g. sealing an already SEALED or VOIDED set, flagging a DRAFT set)"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "the requested case transition is not declared from its current investigation_status or sanction_status"
  - id: ERR_CONSENT_ORDER_STATE_INVALID
    http: 409
    condition: "the consent order is not PROPOSED when execution is requested"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "a new audit draw is requested for an as_of_period_end whose audit cycle is already CLOSED (validation 46)"
  - id: ERR_PROBABLE_CAUSE_REQUIRED
    http: 409
    condition: "a consent order is proposed on a case whose investigation_status is not PROBABLE_CAUSE"

  # --- business_safety ------------------------------------------------------
  - id: ERR_SEAL_LICENSE_NOT_ACTIVE
    http: 422
    condition: "the licence whose seal is being affixed is not ACTIVE"
  - id: ERR_REFEREE_LICENSE_INACTIVE
    http: 422
    condition: "the supervising engineer holds no ACTIVE licence at the moment the verification is submitted"
  - id: ERR_RESPONSIBLE_CHARGE_LICENSE_INACTIVE
    http: 422
    condition: "the licence nominated for responsible charge is not ACTIVE"

  # --- business_referential -------------------------------------------------
  - id: ERR_NOT_RESPONSIBLE_CHARGE
    http: 422
    condition: "sealing_license_id is not the firm's responsible_charge_license_id"
  - id: ERR_SELF_REFERENCE_FORBIDDEN
    http: 422
    condition: "referee_engineer_id equals the applicant's own engineer_id"
  - id: ERR_RESPONDENT_TARGET_INVALID
    http: 422
    condition: "zero or both respondent targets supplied, or the allegation type's required target is missing"
  - id: ERR_PATHWAY_MISMATCH
    http: 409
    condition: "the board action does not match the application's pathway (exam approval on a COMITY file, direct comity issuance on a STANDARD_EXAM file)"
  - id: ERR_NCEES_RECORD_NOT_MATCHED
    http: 422
    condition: "the national records packet is absent, MISMATCH, or reports no passing examination"

  # --- business_temporal ----------------------------------------------------
  - id: ERR_EXPERIENCE_PERIOD_OVERLAP
    http: 409
    condition: "the claimed month range intersects an existing non-RECANTED experience record on the same application"
  - id: ERR_EXAM_WINDOW_LENGTH_INVALID
    http: 422
    condition: "window_end minus window_start is not exactly EXAM_WINDOW_MINUTES (480)"
  - id: ERR_SEAT_WINDOW_CONFLICT
    http: 409
    condition: "the requested window collides with an existing SCHEDULED appointment on the same seat once TURNOVER_BUFFER_MINUTES (45) is appended to the incumbent"
  - id: ERR_AUTHORIZATION_EXPIRED
    http: 409
    condition: "the logical clock has reached or passed authorization_expires_at"
  - id: ERR_RETAKE_WAITING_PERIOD
    http: 409
    condition: "the logical clock has not yet reached retake_eligible_at"
  - id: ERR_DEFICIENCY_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "the logical clock has passed deficiency_due_at"
  - id: ERR_NCEES_RECORD_EXPIRED
    http: 422
    condition: "the logical clock has passed ncees_record_expires_on"
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is outside [renewal_window_opens_at, current_period_end]"
  - id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http: 409
    condition: "the reinstatement grace window has lapsed, or a suspension has not yet run its course"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 409
    condition: "the requested logical clock value precedes the current logical clock value"

  # --- business_constraint --------------------------------------------------
  - id: ERR_EDUCATION_NOT_EVALUATED
    http: 422
    condition: "education_status is NOT_EVALUATED or REJECTED when submission is attempted"
  - id: ERR_NO_SEAT_AVAILABLE
    http: 409
    condition: "the test centre has no seat left or is SUSPENDED"
  - id: ERR_ATTEMPT_LIMIT_REACHED
    http: 409
    condition: "attempt_number has already reached MAX_EXAM_ATTEMPTS (3)"
  - id: ERR_DEFICIENCY_LIMIT_REACHED
    http: 409
    condition: "deficiency_cycle_count has already reached MAX_DEFICIENCY_CYCLES (3)"
  - id: ERR_COMITY_YEARS_INSUFFICIENT
    http: 422
    condition: "ncees_verified_years_licensed is below COMITY_MIN_YEARS (4)"
  - id: ERR_REFERENCE_NOT_ACCEPTED
    http: 422
    condition: "a verification is still REQUESTED or SUBMITTED, or credit determination has not been run"
  - id: ERR_EXPERIENCE_INSUFFICIENT
    http: 422
    condition: "verified_experience_months is below MIN_EXPERIENCE_MONTHS (48)"
  - id: ERR_DUPLICATE_ACTIVE_LICENSE
    http: 409
    condition: "the engineer already holds an ACTIVE licence"
  - id: ERR_CPC_SHORTFALL
    http: 422
    condition: "no cleared zero-shortfall CPC report covers the period being renewed"
  - id: ERR_PDH_SELF_CERT_MISMATCH
    http: 422
    condition: "self_certified_pdh does not equal the recomputed self_certified_total_pdh"
  - id: ERR_REPORT_NOT_UNDER_AUDIT
    http: 409
    condition: "an audit decision is attempted on a report that is not UNDER_AUDIT"
  - id: ERR_AUDIT_POOL_EMPTY
    http: 409
    condition: "no report satisfies the audit eligibility filter for as_of_period_end"
  - id: ERR_REINSTATEMENT_MAKEUP_INSUFFICIENT
    http: 422
    condition: "makeup_pdh is below REINSTATEMENT_MAKEUP_PDH (15)"
  - id: ERR_ATTESTATION_MISSING
    http: 422
    condition: "responsible_charge_attested is false on a seal request"
  - id: ERR_OPEN_SANCTION_BLOCKS_CLOSE
    http: 409
    condition: "the sanction axis is unresolved when the investigation axis is asked to close"
  - id: ERR_DUPLICATE_FIRM_NAME
    http: 409
    condition: "firm_name is already registered"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "email is already on the engineer roster"
  - id: ERR_DUPLICATE_AUDIT_CYCLE
    http: 409
    condition: "audit_cycle_label is already used"

  # --- business_fiscal ------------------------------------------------------
  - id: ERR_FEE_UNPAID
    http: 402
    condition: "fee_paid_cents is below fee_assessment_cents at submission"
  - id: ERR_PENALTY_UNPAID
    http: 402
    condition: "penalty_paid_cents is below penalty_cents at consent-order execution, or reinstatement_fee_cents is below REINSTATEMENT_FEE_CENTS"

# =============================================================================
# 1.7 RBAC Matrix
# role_model: segregation_of_duties (see complexity_profile)
# =============================================================================
roles:
  - name: Applicant
    description: "A person pursuing initial or comity licensure. Owns their own applications, experience records, verification requests, exam authorizations and appointments."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{application_id}/payments"
      - "POST /applications/{application_id}/submit"
      - "POST /applications/{application_id}/respond-deficiency"
      - "POST /applications/{application_id}/withdraw"
      - "POST /applications/{application_id}/experience-records"
      - "POST /experience-records/{experience_record_id}/references"
      - "POST /exam-appointments"
      - "POST /exam-authorizations/{exam_authorization_id}/retake"
    shared_operations:
      - "GET /applications, GET /applications/{application_id}, GET /applications/{application_id}/fee-assessment"
      - "GET /experience-records, GET /experience-records/{experience_record_id}"
      - "GET /references, GET /references/{reference_id}"
      - "GET /exam-authorizations, GET /exam-authorizations/{exam_authorization_id}"
      - "GET /exam-appointments, GET /exam-appointments/{exam_appointment_id}"
      - "GET /test-centers, GET /test-centers/{test_center_id}"
      - "GET /engineers/{engineer_id}, GET /licenses/{license_id}"
      - "POST /exam-appointments/{exam_appointment_id}/cancel"

  - name: SupervisingEngineer
    description: "A licensed engineer asked to verify a subordinate's progressive experience. Answers and may later withdraw a verification."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /references/{reference_id}/submit"
      - "POST /references/{reference_id}/recant"
    shared_operations:
      - "GET /references, GET /references/{reference_id}"
      - "GET /experience-records, GET /experience-records/{experience_record_id}"
      - "GET /licenses, GET /licenses/{license_id}, GET /engineers/{engineer_id}"
      - "GET /firm-registrations, GET /firm-registrations/{firm_registration_id}"

  - name: Licensee
    description: "The holder of an issued licence. Renews, files continuing-competency reports and affixes the professional seal."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /licenses/{license_id}/renew"
      - "POST /cpc-reports"
      - "POST /cpc-reports/{cpc_report_id}/pdh-records"
      - "POST /plan-submissions/{plan_submission_id}/seal"
    shared_operations:
      - "GET /licenses, GET /licenses/{license_id}, GET /engineers/{engineer_id}"
      - "GET /cpc-reports, GET /cpc-reports/{cpc_report_id}"
      - "GET /pdh-records, GET /pdh-records/{pdh_record_id}"
      - "GET /plan-submissions, GET /plan-submissions/{plan_submission_id}"
      - "GET /firm-registrations, GET /firm-registrations/{firm_registration_id}"

  - name: FirmAdmin
    description: "The administrative identity of a registered firm. Files plan sets and nominates the licence in responsible charge. X-User-ID is the FirmRegistration id."
    identity: "entity_backed:FirmRegistration"
    exclusive_operations:
      - "POST /plan-submissions"
      - "POST /firm-registrations/{firm_registration_id}/responsible-charge"
    shared_operations:
      - "GET /firm-registrations, GET /firm-registrations/{firm_registration_id}"
      - "GET /plan-submissions, GET /plan-submissions/{plan_submission_id}"
      - "GET /engineers/{engineer_id}, GET /licenses/{license_id}"

  - name: BoardReviewer
    description: "Board technical staff. Evaluates education, adjudicates verifications, determines experience credit and performs continuing-competency audit review."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{application_id}/education-evaluation"
      - "POST /applications/{application_id}/start-review"
      - "POST /applications/{application_id}/deficiency"
      - "POST /references/{reference_id}/evaluate"
      - "POST /pdh-records/{pdh_record_id}/documentation-review"
      - "POST /cpc-reports/{cpc_report_id}/accept"
      - "POST /cpc-reports/{cpc_report_id}/audit-decision"
    shared_operations:
      - "POST /applications/{application_id}/credit-determination"
      - "POST /cpc-audits"
      - "GET /engineers, GET /engineers/{engineer_id}"
      - "GET /applications, GET /applications/{application_id}, GET /applications/{application_id}/fee-assessment"
      - "GET /experience-records, GET /references, GET /exam-authorizations"
      - "GET /cpc-reports, GET /pdh-records, GET /cpc-audits, GET /licenses"

  - name: BoardLicensingOfficer
    description: "Board licensing authority. Approves examinations, issues, denies, reinstates and registers firms. Cannot also have determined the experience credit on the file it approves."
    identity: opaque
    exclusive_operations:
      - "POST /licenses"
      - "POST /licenses/{license_id}/reinstate"
      - "POST /applications/{application_id}/approve-exam"
      - "POST /applications/{application_id}/issue-license"
      - "POST /applications/{application_id}/deny"
      - "POST /firm-registrations"
    shared_operations:
      - "POST /applications/{application_id}/credit-determination"
      - "POST /consent-orders/{consent_order_id}/execute"
      - "GET /engineers, GET /licenses, GET /applications, GET /exam-authorizations, GET /exam-appointments"
      - "GET /firm-registrations, GET /plan-submissions, GET /cpc-reports, GET /cpc-audits, GET /cases, GET /consent-orders"

  - name: BoardInvestigator
    description: "Board enforcement staff. Opens and works complaints, flags suspect plan sets, proposes consent orders. May not execute a consent order on a case it was assigned to investigate."
    identity: opaque
    exclusive_operations:
      - "POST /cases"
      - "POST /cases/{case_id}/open-investigation"
      - "POST /cases/{case_id}/finding"
      - "POST /cases/{case_id}/refer-hearing"
      - "POST /cases/{case_id}/close"
      - "POST /consent-orders"
      - "POST /plan-submissions/{plan_submission_id}/flag"
    shared_operations:
      - "POST /consent-orders/{consent_order_id}/execute"
      - "GET /cases, GET /cases/{case_id}, GET /consent-orders, GET /consent-orders/{consent_order_id}"
      - "GET /engineers, GET /licenses, GET /firm-registrations, GET /plan-submissions"

  - name: BoardSecretary
    description: "Board administrative registrar. Maintains the engineer roster and test-centre inventory, draws audit samples, cancels appointments on the board's behalf and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /engineers"
      - "POST /test-centers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /cpc-audits"
      - "POST /exam-appointments/{exam_appointment_id}/cancel"
      - "GET /engineers, GET /licenses, GET /applications, GET /test-centers"
      - "GET /exam-authorizations, GET /exam-appointments, GET /cpc-reports, GET /pdh-records, GET /cpc-audits"
      - "GET /firm-registrations, GET /cases, GET /consent-orders"

  - name: TestingService
    description: "The national testing service integration identity. Posts examination scores and the national records program's comity credential packet."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{application_id}/ncees-verification"
      - "POST /exam-authorizations/{exam_authorization_id}/score"
    shared_operations:
      - "GET /exam-authorizations, GET /exam-authorizations/{exam_authorization_id}"
      - "GET /exam-appointments, GET /exam-appointments/{exam_appointment_id}"
      - "GET /test-centers, GET /test-centers/{test_center_id}"
