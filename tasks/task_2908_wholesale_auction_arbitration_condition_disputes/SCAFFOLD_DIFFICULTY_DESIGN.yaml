              payload: { response_type: "OFFER_REPAIR_ALLOWANCE", response_note: "Second offer", seller_offer_cents: 150000 }
              as: SellerRep
              as_user_id: "${seller_id}"
              captures: { round2_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/negotiation-rounds/${round2_id}/counter"
