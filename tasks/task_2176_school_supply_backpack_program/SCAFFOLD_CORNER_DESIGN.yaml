  - section: consistency_model
    instances:

      - name: adjustment_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds: ["endpoints", "entities.InventoryPosition.fields.on_hand_qty", "entities.DriveCycle.fields.total_items_on_hand"]
        distinguishing_aspect: "The consistency model is immediate: the adjustment response already carries on_hand_qty 25, and an immediately following read of the cycle shows total_items_on_hand 25 with no settling delay."
        test_recipe:
          setup: ["COLLECTING cycle with a pencil position already holding 10 units."]
          setup_api_calls:
            - call: "POST /drive-cycles"
              payload: { name: "Back-to-School 2026", cadence: "BACK_TO_SCHOOL", window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { cycle_id: $.data.id }
            - call: "PATCH /drive-cycles/${cycle_id}/status"
              payload: { target_status: "COLLECTING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /supply-items"
              payload: { sku: "PEN-12", name: "Pencils 12-pack", category: "WRITING", unit_cost_cents: 250, bulk_pack_size: 12 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { pencil_id: $.data.id }
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", delta_on_hand_qty: 10, reason: "opening count" }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /inventory-positions/adjustments"
              payload: { drive_cycle_id: "${cycle_id}", supply_item_id: "${pencil_id}", delta_on_hand_qty: 15, reason: "second count" }
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { on_hand_now: $.data.on_hand_qty, ver: $.data.version }
            - call: "GET /drive-cycles/${cycle_id}"
              payload: {}
              as: WarehouseLead
              as_user_id: "wl-1"
              captures: { total_now: $.data.total_items_on_hand }
          assert:
            - "the adjustment response itself reports on_hand_qty == 25 and adjustment_qty == 25"
            - "InventoryPosition.${pos_id}.version == 2 (created at version 1 by the first adjustment, incremented once by the second)"
            - "DriveCycle.${cycle_id}.total_items_on_hand == 25"
