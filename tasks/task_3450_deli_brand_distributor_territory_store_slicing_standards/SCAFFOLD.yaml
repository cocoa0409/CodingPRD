  - { method: POST, path: "/api/products", description: "create a product SKU", roles: [BrandAdmin], code: 201, input: [code, name, base_price_cents, shelf_life_opened_hours, shelf_life_unopened_days, allergen_tags, "requires_dedicated_slicer?", "channel_restricted?"], output: Product, side_effects: [] }
  - { method: GET, path: "/api/products", description: "list products; filter status?", roles: [BrandAdmin, DistributorRep, RetailManager, PlantScheduler, SafetyOfficer], code: 200, input: ["status?"], output: "Product[]", side_effects: [] }
  - { method: POST, path: "/api/account-product-authorizations", description: "authorize a product for an account; AUTHORIZED at once when the account is APPROVED, else REQUESTED", roles: [BrandAdmin], code: 201, input: [account_id, product_id], output: AccountProductAuthorization, side_effects: [] }
