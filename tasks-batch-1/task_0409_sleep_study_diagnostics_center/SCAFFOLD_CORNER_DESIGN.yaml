          - errors[ERR_STALE_REFERRAL_VERSION]
          - endpoints.POST./study-orders
        distinguishing_aspect: "Creating a StudyOrder with a stale expected_referral_version (one behind current after an intervening study create) -> ERR_STALE_REFERRAL_VERSION (412)."
        test_recipe:
          setup: ["An authorized referral; one study already created (so the referral version advanced once)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "OCC Ref", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "5252525252", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-52", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so1_id: $.data.id }
          trigger:
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_REFERRAL_VERSION"

      - name: occ_stale_study_on_score_after_return
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scoring-submit-stale-study]
          - errors[ERR_STALE_STUDY_VERSION]
          - endpoints.POST./study-orders/{studyOrderId}/score
        distinguishing_aspect: "Re-scoring with the pre-return expected_study_order_version after a physician return (which bumped the version) -> ERR_STALE_STUDY_VERSION (412)."
        test_recipe:
          setup: ["A study scored once then returned by the physician (study back to IN_PROGRESS, version bumped twice since the first score's captured version)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "OCC Study", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "5353535353", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-53", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /study-orders/${so_id}/start"
              payload: {}
              as: SleepTechnologist
              captures: { so_v: $.data.version }
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 120, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
            - call: "GET /study-orders/${so_id}/scoring-reports"
              payload: {}
              as: Physician
              captures: { sr_id: "$.data[0].id" }
            - call: "POST /scoring-reports/${sr_id}/return"
              payload: {}
              as: Physician
          trigger:
            - call: "POST /study-orders/${so_id}/score"
              payload: { total_recording_minutes: 480, respiratory_event_count: 120, expected_study_order_version: "${so_v}" }
              as: SleepTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_STUDY_VERSION"

      - name: occ_resupply_stale_dme_covered
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[resupply-create-stale-dme]
        excluded_because:
          difficulty_instance: combinatorial_formula / resupply_cycle_circular_dependency_pinned_order
          rationale: "The resupply chain uses fresh predecessor versions; the stale-version path shares the resupply mechanism exercised there. A dedicated negative test is covered here by name parity with the §1.8 resupply instance."

      - name: derived_field_adherent_recompute_covered
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ComplianceRecord.fields.adherent
        excluded_because:
          difficulty_instance: boundary_precision_check / adherence_pct_boundary_exactly_seventy_percent
          rationale: "adherent computed-field correctness at create is asserted by the named §1.8 boundary instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: schedule_response_reflects_referral_bubble_up_immediately
        claim_type: immediate
        grounds:
          - state_machines.StudyOrder.ORDERED_to_SCHEDULED
          - state_machines.Referral.AUTHORIZED_to_SCHEDULED
        distinguishing_aspect: "Immediately after POST /study-orders/{id}/schedule succeeds, GET /referrals/{id} shows status SCHEDULED in the same synchronous flow (no lag)."
        test_recipe:
          setup: ["An authorized HSAT study (ORDERED), referral AUTHORIZED."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Immed Pat", date_of_birth: "1985-01-01", insurance_payer: "Acme" }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "5454545454", requested_modality: "HSAT", clinical_indication: "OSA", prior_auth_required: false }
              as: SchedulingCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/approve-auth"
              payload: { prior_auth_number: "PA-54", prior_auth_expires_on: "2026-12-31" }
              as: SchedulingCoordinator
              captures: { ref_v2: $.data.version }
            - call: "POST /study-orders"
              payload: { referral_id: "${ref_id}", modality: "HSAT", expected_referral_version: "${ref_v2}" }
              as: SchedulingCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /study-orders/${so_id}/schedule"
              payload: { night_start_utc: "2026-07-01T22:00:00Z", night_end_utc: "2026-07-02T06:00:00Z" }
              as: SchedulingCoordinator
          trigger:
            - call: "GET /referrals/${ref_id}"
              payload: {}
              as: SchedulingCoordinator
              captures: { ref_status: $.data.status }
          assert:
            - "Referral.${ref_id}.status == SCHEDULED"

      - name: compliance_window_touching_allowed
        claim_type: immediate
        grounds:
          - validations[priority=10]
          - entities.ComplianceRecord.fields.window_start_utc
        distinguishing_aspect: "A second compliance window starting exactly at the prior window's end (half-open touching) is accepted -> 201, complementing the §1.8 overlap-reject case."
        test_recipe:
