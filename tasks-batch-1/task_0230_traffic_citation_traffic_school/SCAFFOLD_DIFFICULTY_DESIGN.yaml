      - name: point_rolling_window_aggregate_excludes_aged_entry
        grounds:
          - calculations.driver_point_balance
          - entities.Jurisdiction.fields.point_window_months
          - entities.PointLedgerEntry.fields.effective_at
        distinguishing_aspect: |
          Interval semantics B — sliding AGGREGATE-CAPACITY window over
          PointLedgerEntry.effective_at (a different resource and different interval
          arithmetic than the school-cooldown exclusion window): points are summed only
          inside (now - point_window_months, now]. An entry whose effective_at predates
          the window does NOT contribute, so the same two 2-point upholds yield
          point_balance 2 (not 4) once one entry ages out.
        test_recipe:
          setup:
            - "Jurisdiction A (point_window_months=12); driver D17; citation P (issued 2025-01-02, UPHELD 2 pts) ages out; citation Q (issued 2026-04-02, UPHELD 2 pts) is in-window; evaluated at clock 2026-05-01."
