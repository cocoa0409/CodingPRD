            - { call: "POST /festival/submitters", payload: { legal_name: "Bob Ray", email: "bob@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { submB: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Owned", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "A Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${submA}", captures: { film: $.data.id } }
