            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-700" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-4", route_date: "2026-05-06", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
