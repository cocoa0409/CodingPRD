              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
