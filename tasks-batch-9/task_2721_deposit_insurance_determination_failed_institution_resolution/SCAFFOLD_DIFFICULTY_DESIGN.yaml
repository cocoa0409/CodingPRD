  # ===================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_state_error_outranks_segregation_of_duties
        grounds:
          - validations[priority=45]
          - validations[priority=60]
          - errors[ERR_DETERMINATION_NOT_UNDER_REVIEW]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): priority 45
          ERR_DETERMINATION_NOT_UNDER_REVIEW (409, category state) must outrank priority 60
          ERR_SEGREGATION_OF_DUTIES_VIOLATION (403, category business_constraint) when a single
          certify call violates BOTH. The control call proves the loser is live: once the state gate
          is satisfied, the same user-id collision does return the 403.
        test_recipe:
          setup:
            - "Institution 34573 is CLOSED_IN_RECEIVERSHIP with a STANDARDIZED readiness package; depositor Hana owns one SINGLE account of 20000000 cents."
            - "Hana's determination was prepared under AGGREGATE_BY_CATEGORY by X-User-ID 'dual-actor-77' and was NOT submitted for review, so status == PREPARED and prepared_by_user_id == 'dual-actor-77'."
            - "Both violations are therefore simultaneously true for a certify call made by ClaimsCertifier with X-User-ID 'dual-actor-77': status != UNDER_REVIEW (p45) and X-User-ID == prepared_by_user_id (p60)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
