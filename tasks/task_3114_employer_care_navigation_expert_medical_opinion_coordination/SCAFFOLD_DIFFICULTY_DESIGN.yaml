# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3114_employer_care_navigation_expert_medical_opinion_coordination
# Nine Difficulty Rules x 2 instances each = 18 instances.
# All numbers in assert: were computed by hand-executing the pinned formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_savings_provisional_vs_final_on_same_claim
        grounds:
          - calculations.billing_savings_variants
          - calculations.claim_repricing
          - state_machines.BillingCase.OPENED_to_ERROR_IDENTIFIED
          - state_machines.BillingCase.SETTLEMENT_PROPOSED_to_RESOLVED_ACCEPTED
        distinguishing_aspect: "BillingCase domain: provisional savings (billed - system reprice) and final savings (billed - negotiated settlement) diverge for identical claim data — 34900 vs 60000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member ACTIVE with BILLING_ADVOCACY consent; claim billed 200000 with two UPCODING lines and one clean line; billing case ERROR_IDENTIFIED."
            - "Line math pinned: L1 UPCODING 100000 @ 0.8 -> 80000; L2 UPCODING 50000 @ 0.702 -> 35100; L3 NONE 50000 -> 50000; repriced_total = 165100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/employers"
              payload: { name: "Acme Corp", pepm_fee_cents: 1500, avg_in_out_cost_delta_cents: 300000, emo_benefit_enabled: true }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /care/employers/${emp_id}/members"
              payload: { full_name: "Maya Lopez", date_of_birth: "1985-04-02", relationship: "SELF", external_member_ref: "A-100", deductible_limit_cents: 100000, oop_max_cents: 500000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /care/members/${m_id}/consents"
              payload: { scope: "BILLING_ADVOCACY", expires_at: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /care/providers"
              payload: { name: "City General", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /care/claims"
              payload: { member_id: "${m_id}", provider_id: "${prov_id}", service_date: "2026-08-15", billed_amount_cents: 200000, allowed_amount_cents: 180000, lines: [ { line_code: "L1", billed_cents: 100000, schedule_rate: 0.8, error_flag: "UPCODING" }, { line_code: "L2", billed_cents: 50000, schedule_rate: 0.702, error_flag: "UPCODING" }, { line_code: "L3", billed_cents: 50000, schedule_rate: 1.0, error_flag: "NONE" } ] }
              as: PlanAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /care/claims/${claim_id}/adjudicate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care/members/${m_id}/billing-cases"
              payload: { claim_id: "${claim_id}" }
              as: BillingAdvocate
              captures: { bc_id: $.data.id }
            - call: "POST /care/billing-cases/${bc_id}/identify-errors"
              payload: {}
              as: BillingAdvocate
          trigger:
            - call: "GET /care/billing-cases/${bc_id}"
              payload: {}
              as: BillingAdvocate
              captures: { prov_savings: $.data.provisional_savings_cents }
            - call: "POST /care/billing-cases/${bc_id}/propose-settlement"
              payload: { counter_offer_cents: 140000 }
              as: BillingAdvocate
            - call: "POST /care/billing-cases/${bc_id}/accept-settlement"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "repriced_total_cents == 165100 (per-line rounding: 80000 + 35100 + 50000)"
            - "after identify-errors: BillingCase.${bc_id}.provisional_savings_cents == 34900 (200000 - 165100)"
            - "after accept: BillingCase.${bc_id}.final_savings_cents == 60000 (200000 - 140000)"
            - "BillingCase.${bc_id}.provisional_savings_cents == 34900 still (variant preserved, not overwritten)"
            - "BillingCase.${bc_id}.final_savings_cents != BillingCase.${bc_id}.provisional_savings_cents"

      - name: steerage_savings_naive_vs_counterfactual_on_same_bookings
        grounds:
          - calculations.steerage_savings_attribution
          - calculations.utilization_aggregation
          - entities.Appointment.fields.redirected_from_out_of_network
        distinguishing_aspect: "Employer-report domain: naive steerage attribution credits all 3 in-network navigation-booked appointments (900000) while the counterfactual variant credits only the 2 redirected ones (600000) — different entity domain from billing savings."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Employer with avg_in_out_cost_delta_cents 300000; member ACTIVE with APPOINTMENT_BOOKING consent; IN_NETWORK provider with a snapshot; one ROUTED navigation case; 3 appointments booked via the case, 2 with redirected_from_out_of_network true, 1 false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/employers"
              payload: { name: "BetaWorks", pepm_fee_cents: 1200, avg_in_out_cost_delta_cents: 300000, emo_benefit_enabled: true }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /care/employers/${emp_id}/members"
              payload: { full_name: "Owen Park", date_of_birth: "1979-11-20", relationship: "SELF", external_member_ref: "B-200", deductible_limit_cents: 100000, oop_max_cents: 500000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /care/members/${m_id}/consents"
              payload: { scope: "APPOINTMENT_BOOKING", expires_at: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /care/providers"
              payload: { name: "HeartFirst Clinic", specialty: "CARDIOLOGY", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /care/providers/${prov_id}/quality-snapshots"
              payload: { period_start: "2026-01-01", period_end: "2026-06-30", outcome_score: 80, cost_efficiency_score: 60, access_score: 90, claims_volume: 40 }
              as: PlatformAdmin
            - call: "POST /care/members/${m_id}/navigation-cases"
              payload: { question_type: "COST", estimated_cost_cents: 100000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: $.data.id }
            - call: "POST /care/members/${m_id}/appointments"
              payload: { provider_id: "${prov_id}", slot_start: "2026-09-10T09:00:00Z", slot_end: "2026-09-10T09:30:00Z", navigation_case_id: "${nc_id}", redirected_from_out_of_network: true }
              as: CareAdvocate
              as_user_id: "adv-1"
            - call: "POST /care/members/${m_id}/appointments"
              payload: { provider_id: "${prov_id}", slot_start: "2026-09-11T09:00:00Z", slot_end: "2026-09-11T09:30:00Z", navigation_case_id: "${nc_id}", redirected_from_out_of_network: true }
              as: CareAdvocate
              as_user_id: "adv-1"
            - call: "POST /care/members/${m_id}/appointments"
              payload: { provider_id: "${prov_id}", slot_start: "2026-09-12T09:00:00Z", slot_end: "2026-09-12T09:30:00Z", navigation_case_id: "${nc_id}", redirected_from_out_of_network: false }
              as: CareAdvocate
              as_user_id: "adv-1"
          trigger:
            - call: "GET /care/employers/${emp_id}/utilization-report"
              payload: {}
              as: EmployerAdmin
              as_user_id: "ea-1"
          assert:
            - "report.steerage_naive_cents == 900000 (3 x 300000)"
            - "report.steerage_counterfactual_cents == 600000 (2 x 300000)"
            - "report.steerage_naive_cents != report.steerage_counterfactual_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quality_score_weighted_shrinkage_volume_boundary
        grounds:
          - calculations.provider_quality_score
          - entities.QualitySnapshot.fields.composite_quality_score
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction (weights + low-volume shrinkage branch keyed on claims_volume >= 30) — volume 40 yields raw 76.0; volume 20 yields shrunk 74.0; volume exactly 30 yields the unshrunk raw."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Two providers with snapshots: P_high volume 40, P_low volume 20, identical scores (80/60/90 -> raw 76.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/providers"
              payload: { name: "HighVol Ortho", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p_hi: $.data.id }
            - call: "POST /care/providers/${p_hi}/quality-snapshots"
              payload: { period_start: "2026-01-01", period_end: "2026-06-30", outcome_score: 80, cost_efficiency_score: 60, access_score: 90, claims_volume: 40 }
              as: PlatformAdmin
              captures: { snap_hi: $.data.id, comp_hi: $.data.composite_quality_score }
            - call: "POST /care/providers"
              payload: { name: "LowVol Ortho", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p_lo: $.data.id }
            - call: "POST /care/providers/${p_lo}/quality-snapshots"
              payload: { period_start: "2026-01-01", period_end: "2026-06-30", outcome_score: 80, cost_efficiency_score: 60, access_score: 90, claims_volume: 20 }
              as: PlatformAdmin
              captures: { snap_lo: $.data.id, comp_lo: $.data.composite_quality_score }
          trigger:
            - call: "POST /care/providers"
              payload: { name: "ExactVol Ortho", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p_eq: $.data.id }
            - call: "POST /care/providers/${p_eq}/quality-snapshots"
              payload: { period_start: "2026-01-01", period_end: "2026-06-30", outcome_score: 80, cost_efficiency_score: 60, access_score: 90, claims_volume: 30 }
              as: PlatformAdmin
              captures: { comp_eq: $.data.composite_quality_score }
          assert:
            - "raw = 0.5*80 + 0.3*60 + 0.2*90 = 76.0"
            - "QualitySnapshot.${snap_hi}.composite_quality_score == 76.0 (volume 40 >= 30: no shrinkage)"
            - "QualitySnapshot.${snap_lo}.composite_quality_score == 74.0 ((20/30)*76.0 + (10/30)*70.0 = 50.6667 + 23.3333 rounded_half_up 2dp = 74.0)"
            - "QualitySnapshot exact-volume composite == 76.0 (volume exactly 30: >= boundary, full confidence)"

      - name: claim_repricing_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.claim_repricing
          - entities.Claim.fields.repriced_total_cents
        distinguishing_aspect: "Mode (b): nested rounding where order is pinned — three UPCODING lines of 777 @ 0.666 give per-line 517 x 3 = 1551; the forbidden sum-then-round order gives 1552. Different mode from the weighted-score instance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Employer, ACTIVE member, provider; claim with 3 UPCODING lines billed 777 each at schedule_rate 0.666."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/employers"
              payload: { name: "Gamma LLC", pepm_fee_cents: 1000, avg_in_out_cost_delta_cents: 200000, emo_benefit_enabled: false }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /care/employers/${emp_id}/members"
              payload: { full_name: "Rita Chen", date_of_birth: "1990-01-15", relationship: "SELF", external_member_ref: "G-300", deductible_limit_cents: 100000, oop_max_cents: 500000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /care/providers"
              payload: { name: "Peak Surgical", specialty: "SURGERY", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /care/claims"
              payload: { member_id: "${m_id}", provider_id: "${prov_id}", service_date: "2026-08-01", billed_amount_cents: 2331, allowed_amount_cents: 2000, lines: [ { line_code: "A", billed_cents: 777, schedule_rate: 0.666, error_flag: "UPCODING" }, { line_code: "B", billed_cents: 777, schedule_rate: 0.666, error_flag: "UPCODING" }, { line_code: "C", billed_cents: 777, schedule_rate: 0.666, error_flag: "UPCODING" } ] }
              as: PlanAdministrator
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /care/claims/${claim_id}/adjudicate"
              payload: {}
              as: PlanAdministrator
          assert:
            - "Claim.${claim_id}.repriced_total_cents == 1551 (517 + 517 + 517, round_half_up per line then sum)"
            - "Claim.${claim_id}.repriced_total_cents != 1552 (the sum-then-round order is forbidden)"

      - name: cost_share_estimate_pinned_evaluation_order_with_oop_cap
        grounds:
          - calculations.member_cost_share_estimate
          - calculations.deductible_application
        distinguishing_aspect: "Mode (c): circular-looking dependency resolved by pinned order — estimate reads persisted accumulators only (an in-flight estimate never mutates them), then deductible portion, then coinsurance, then the oop_max cap. Different mode from (a) and (b)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member deductible_limit 100000, oop_max 500000; one ADJUDICATED claim allowed 60000 -> deductible_applied 60000, coinsurance 0, member_responsibility 60000 (accumulators: deductible_used 60000, oop_used 60000). IN_NETWORK provider."
            - "Estimate for allowed 80000: deductible_portion = min(40000, 80000) = 40000; coinsurance = round(0.2 * 40000) = 8000; uncapped 48000; cap check 48000 <= 500000 - 60000 -> not capped -> 48000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/employers"
              payload: { name: "Delta Co", pepm_fee_cents: 1000, avg_in_out_cost_delta_cents: 200000, emo_benefit_enabled: false }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /care/employers/${emp_id}/members"
              payload: { full_name: "Sam Ortiz", date_of_birth: "1988-06-30", relationship: "SELF", external_member_ref: "D-400", deductible_limit_cents: 100000, oop_max_cents: 500000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /care/providers"
              payload: { name: "Valley Imaging", specialty: "RADIOLOGY", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /care/claims"
              payload: { member_id: "${m_id}", provider_id: "${prov_id}", service_date: "2026-07-01", billed_amount_cents: 60000, allowed_amount_cents: 60000, lines: [ { line_code: "X", billed_cents: 60000, schedule_rate: 1.0, error_flag: "NONE" } ] }
              as: PlanAdministrator
              captures: { claim_id: $.data.id }
            - call: "POST /care/claims/${claim_id}/adjudicate"
              payload: {}
              as: PlanAdministrator
          trigger:
            - call: "GET /care/members/${m_id}/cost-share-estimate"
              payload: { provider_id: "${prov_id}", allowed_amount_cents: 80000 }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "estimate.member_responsibility_cents == 48000 (40000 deductible + 8000 coinsurance)"
            - "estimate.deductible_portion_cents == 40000 and estimate.coinsurance_portion_cents == 8000"
            - "estimate.oop_capped == false"
            - "Member.${m_id}.deductible_used_cents == 60000 unchanged (estimate never mutates accumulators)"
            - "Member.${m_id}.oop_used_cents == 60000 unchanged"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: expert_opinion_revision_cycle_recompiles_after_changes
        grounds:
          - state_machines.ExpertOpinionCase.CHANGES_REQUESTED_to_COMPILING
          - state_machines.ExpertOpinionCase.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ExpertOpinionCase.COMPILING_to_READY_FOR_REVIEW
        distinguishing_aspect: "ExpertOpinionCase exhibits a true cycle (IN_REVIEW -> CHANGES_REQUESTED -> COMPILING -> READY_FOR_REVIEW -> IN_REVIEW); on the second pass the same reviewer can claim again and only then submit the recommendation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member ACTIVE with RECORD_RETRIEVAL + EMO_REVIEW consents; APPROVED EXPERT_MEDICAL_OPINION authorization; 3 RECEIVED record requests attached; case IN_REVIEW held by reviewer R2 (compiler R1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/employers"
              payload: { name: "Epsilon Inc", pepm_fee_cents: 1400, avg_in_out_cost_delta_cents: 250000, emo_benefit_enabled: true }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /care/employers/${emp_id}/members"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1982-03-12", relationship: "SELF", external_member_ref: "E-500", deductible_limit_cents: 100000, oop_max_cents: 500000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /care/members/${m_id}/consents"
              payload: { scope: "RECORD_RETRIEVAL", expires_at: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /care/members/${m_id}/consents"
              payload: { scope: "EMO_REVIEW", expires_at: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /care/providers"
              payload: { name: "Ortho One", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /care/providers"
              payload: { name: "Ortho Two", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /care/providers"
              payload: { name: "Ortho Three", specialty: "ORTHOPEDICS", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p3: $.data.id }
            - call: "POST /care/members/${m_id}/record-requests"
              payload: { provider_id: "${p1}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
              captures: { rr1: $.data.id }
            - call: "POST /care/members/${m_id}/record-requests"
              payload: { provider_id: "${p2}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
              captures: { rr2: $.data.id }
            - call: "POST /care/members/${m_id}/record-requests"
              payload: { provider_id: "${p3}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
              captures: { rr3: $.data.id }
            - call: "POST /care/record-requests/${rr1}/receive"
              payload: { record_pages: 12 }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/record-requests/${rr2}/receive"
              payload: { record_pages: 8 }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/record-requests/${rr3}/receive"
              payload: { record_pages: 20 }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/members/${m_id}/authorizations"
              payload: { service_code: "EXPERT_MEDICAL_OPINION", units: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /care/authorizations/${auth_id}/approve"
              payload: {}
              as: PlanAdministrator
              as_user_id: "pa-1"
            - call: "POST /care/members/${m_id}/expert-opinions"
              payload: { condition_summary: "Knee MRI review" }
              as: Member
              as_user_id: "${m_id}"
              captures: { emo_id: $.data.id }
            - call: "POST /care/expert-opinions/${emo_id}/attach-records"
              payload: { record_request_id: "${rr1}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/attach-records"
              payload: { record_request_id: "${rr2}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/attach-records"
              payload: { record_request_id: "${rr3}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/compile"
              payload: {}
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/submit-for-review"
              payload: {}
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/claim-review"
              payload: {}
              as: ExpertReviewer
              as_user_id: "er-2"
              captures: { emo_v: $.data.version }
          trigger:
            - call: "POST /care/expert-opinions/${emo_id}/request-changes"
              payload: {}
              as: ExpertReviewer
              as_user_id: "er-2"
            - call: "POST /care/expert-opinions/${emo_id}/compile"
              payload: {}
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/submit-for-review"
              payload: {}
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/expert-opinions/${emo_id}/claim-review"
              payload: {}
              as: ExpertReviewer
              as_user_id: "er-2"
              captures: { emo_v2: $.data.version }
            - call: "POST /care/expert-opinions/${emo_id}/submit-recommendation"
              payload: { recommendation_text: "Conservative management advised", expected_opinion_version: "${emo_v2}" }
              as: ExpertReviewer
              as_user_id: "er-2"
          assert:
            - "cycle executed: status went IN_REVIEW -> CHANGES_REQUESTED -> COMPILING -> READY_FOR_REVIEW -> IN_REVIEW -> RECOMMENDATION_SUBMITTED"
            - "ExpertOpinionCase.${emo_id}.status == RECOMMENDATION_SUBMITTED"
            - "ExpertOpinionCase.${emo_id}.recommendation_version == 1"

      - name: billing_case_negotiation_rounds_cycle_with_rejection
        grounds:
          - state_machines.BillingCase.SETTLEMENT_PROPOSED_to_NEGOTIATING
          - state_machines.BillingCase.NEGOTIATING_to_SETTLEMENT_PROPOSED
          - state_machines.BillingCase.ERROR_IDENTIFIED_to_SETTLEMENT_PROPOSED
        distinguishing_aspect: "BillingCase exhibits a different cycle on a different entity: propose -> member rejects -> NEGOTIATING -> propose again, with proposal_count accumulating (cap 3) — a negotiation-round loop, not a revision loop."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member ACTIVE with BILLING_ADVOCACY consent; adjudicated claim billed 200000 repriced 165100; billing case ERROR_IDENTIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
