  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_segregation_on_accept_nondraft
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair STATE (priority 10, ERR_INVALID_STATE) vs business_safety (priority 11,
          ERR_SEGREGATION_OF_DUTIES): an ALREADY-ACCEPTED return re-accepted by the SAME user who prepared it
          violates both, but state ordering wins -> ERR_INVALID_STATE (409), not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "CA jurisdiction; seller s REGISTERED in CA; one SETTLED SELLER transaction in period."
            - "A TaxReturn prepared by user U, already ACCEPTED by a different approver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "big", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 100000.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /nexus-profiles/${np_id}/register"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "user-U"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/accept"
              payload: {}
              as: TaxApprover
              as_user_id: "approver-X"
          trigger:
            - call: "POST /tax-returns/${ret_id}/accept"
              payload: {}
              as: TaxApprover
              as_user_id: "user-U"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: segregation_beats_nexus_on_accept_draft
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_NEXUS_NOT_REGISTERED]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 11, ERR_SEGREGATION_OF_DUTIES) vs business_referential
          (priority 12, ERR_NEXUS_NOT_REGISTERED): a DRAFT return whose seller is NOT REGISTERED, accepted by
          the SAME user who prepared it, violates both; segregation (lower priority number) wins ->
          ERR_SEGREGATION_OF_DUTIES (403), not ERR_NEXUS_NOT_REGISTERED.
        test_recipe:
          setup:
            - "CA jurisdiction; seller s with a CA NexusProfile still NO_NEXUS (never crossed threshold)."
            - "A DRAFT TaxReturn for CA prepared by user U."
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
