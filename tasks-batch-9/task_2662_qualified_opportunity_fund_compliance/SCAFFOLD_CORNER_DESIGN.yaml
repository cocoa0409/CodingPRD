# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2662_qualified_opportunity_fund_compliance
#
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. Sections and claim_type values are taken verbatim from that guide;
# nothing here declares behavior. Conventions are identical to §1.8:
#
#   * The logical clock reads 2026-08-01T00:00:00Z until a chain calls
#     POST /qof/_clock/set_current_utc.
#   * Opaque-role actor ids: "admin-1" (PlatformAdmin), "mgr-fund-1" and
#     "mgr-fund-2" (FundManager), "co-measurer-1" / "co-certifier-1"
#     (ComplianceOfficer). Investor identity is entity_backed, so as_user_id is
#     always a captured "${inv_id}".
#   * Corners already asserted by a §1.8 instance are emitted as
#     excluded_because stubs citing that instance by name; corners covered by
#     another §1.9 instance in this file are simply not repeated.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: investor_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Investor
          - endpoints[POST /qof/investors]
        distinguishing_aspect: "POST with every declared input present returns 201 and echoes all Investor fields, including the three money rollups at 0.00."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /qof/investors"
              payload: { legal_name: "Marlow Family Trust", taxpayer_type: "TRUST", tax_year_end_month: 6, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object and a data object carrying every Investor field"
            - "Investor.${inv_id}.legal_name == Marlow Family Trust"
            - "Investor.${inv_id}.taxpayer_type == TRUST"
            - "Investor.${inv_id}.tax_year_end_month == 6"
            - "Investor.${inv_id}.compliance_attestation_status == ATTESTED"
            - "Investor.${inv_id}.eligible_gain_total == 0.00"
            - "Investor.${inv_id}.deferred_gain_outstanding == 0.00"
            - "Investor.${inv_id}.included_gain_total == 0.00"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: fund_retrieval_returns_stored_state
        claim_type: retrieval
        grounds:
          - entities.Fund
          - endpoints[GET /qof/funds/{id}]
        distinguishing_aspect: "GET /qof/funds/{id} returns the row exactly as stored after self-certification, including both state dimensions and every zeroed rollup."
        test_recipe:
          setup:
            - "One Fund self-certified at the clock instant 2026-08-01 with first_taxable_month_iso8601 2026-01-01, holding no assets."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Readback Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "GET /qof/funds/${fund_id}"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { read_status: $.data.certification_status, read_posture: $.data.compliance_posture }
          assert:
            - "${read_status} == SELF_CERTIFIED and ${read_posture} == UNTESTED"
            - "Fund.${fund_id}.name == Readback Fund and entity_type == CORPORATION"
            - "Fund.${fund_id}.manager_user_id == mgr-fund-1"
            - "Fund.${fund_id}.first_taxable_month_iso8601 == 2026-01-01T00:00:00Z"
            - "Fund.${fund_id}.self_certification_date == 2026-08-01T00:00:00Z"
            - "Fund.${fund_id}.aggregate_asset_basis == 0.00 and aggregate_qualified_basis == 0.00"
            - "Fund.${fund_id}.deferred_gain_committed == 0.00, cumulative_penalty_months == 0, consecutive_failed_tests == 0"
            - "Fund.${fund_id}.last_test_measurement_date == null"

      - name: eligible_gain_listing_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /qof/eligible-gains]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three gains exist; limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One ATTESTED Investor owning exactly three EligibleGains of 10000.00, 20000.00 and 30000.00, all realized 2026-07-01 on SALE_DATE basis."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Listing Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 10000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { g1: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 20000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { g2: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 30000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { g3: $.data.id }
          trigger:
            - call: "GET /qof/eligible-gains?investor_id=${inv_id}&limit=2&offset=0"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /qof/eligible-gains?investor_id=${inv_id}&limit=2&offset=2"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "the first response has response_type array with exactly 2 data rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the second response has exactly 1 data row, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "${first_page_head} and ${second_page_head} are distinct ids drawn from {${g1}, ${g2}, ${g3}}"
            - "Investor.${inv_id}.eligible_gain_total == 60000.00"

      - name: asset_test_fetch_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ASSET_TEST_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "A well-formed UUID that matches no AssetTest returns the entity-specific 404 ERR_ASSET_TEST_NOT_FOUND, not the generic fund 404."
        test_recipe:
          setup:
            - "Empty database; no AssetTest rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /qof/asset-tests/00000000-0000-4000-8000-000000000999"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ASSET_TEST_NOT_FOUND with HTTP 404"
            - "the envelope has response_type error and data.message is a non-empty string"

      - name: fund_create_missing_required_manager_user_id
        claim_type: required_fields
        grounds:
          - endpoints[POST /qof/funds].input
          - validations[priority=4]
        distinguishing_aspect: "manager_user_id has source input with no default, so omitting it is ERR_INVALID_REQUEST (400) and no Fund row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /qof/funds"
              payload: { name: "Headless Fund", entity_type: "CORPORATION" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /qof/funds returns total_count == 0 — no partial row was persisted"

      - name: investor_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Investor.fields.tax_year_end_month
          - entities.Investor.fields.compliance_attestation_status
        distinguishing_aspect: "Omitting both optional inputs yields tax_year_end_month 12 and compliance_attestation_status PENDING — the declared defaults, not nulls."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /qof/investors"
              payload: { legal_name: "Default Values LLC", taxpayer_type: "PARTNERSHIP" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id, month: $.data.tax_year_end_month, attest: $.data.compliance_attestation_status }
          assert:
            - "${month} == 12"
            - "${attest} == PENDING"
            - "Investor.${inv_id}.eligible_gain_total == 0.00 (computed rollups default to zero, not null)"

      - name: eligible_gain_computed_window_fields_derived_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.EligibleGain.fields.window_basis_date
          - entities.EligibleGain.fields.investment_deadline
          - entities.EligibleGain.fields.unelected_amount
          - calculations.eligible_gain_investment_deadline
        distinguishing_aspect: "window_basis_date, investment_deadline, elected_amount and unelected_amount are all source computed: a PARTNERSHIP_YEAR_END gain takes its basis from pass_through_year_end, never from realization_date."
        test_recipe:
          setup:
            - "One ATTESTED Investor."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Pass Through Investor", taxpayer_type: "PARTNERSHIP", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 250000.00, realization_date: "2026-03-15T00:00:00Z", deadline_basis: "PARTNERSHIP_YEAR_END", pass_through_year_end: "2026-06-30T00:00:00Z" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id, basis: $.data.window_basis_date, deadline: $.data.investment_deadline }
          assert:
            - "${basis} == 2026-06-30T00:00:00Z (taken from pass_through_year_end, not the 2026-03-15 realization date)"
            - "${deadline} == 2026-12-27T00:00:00Z (180 days after the basis date)"
            - "EligibleGain.${gain_id}.elected_amount == 0.00 and unelected_amount == 250000.00"
            - "EligibleGain.${gain_id}.status == ELIGIBLE and expired_at == null"
            - "Investor.${inv_id}.eligible_gain_total == 250000.00"

      - name: fund_system_fields_minted_by_server
        claim_type: system_fields
        grounds:
          - entities.Fund.common_fields
          - endpoints[POST /qof/funds]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: a fresh Fund starts at version 1, and the id is a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /qof/funds"
              payload: { name: "System Fields Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_id: $.data.id, v: $.data.version }
          assert:
            - "${v} == 1"
            - "${fund_id} is a bare UUID string with no type prefix"
            - "Fund.${fund_id}.created_at and updated_at are ISO 8601 UTC instants with three fractional digits"
            - "Fund.${fund_id}.certification_status == DRAFT and compliance_posture == UNTESTED (initial states, not client-supplied)"

      - name: eligible_gain_invalid_enum_gain_character_rejected
        claim_type: type_constraints
        grounds:
          - entities.EligibleGain.fields.gain_character
          - validations[priority=4]
        distinguishing_aspect: "gain_character is a closed enum; a value outside {SHORT_TERM_CAPITAL, LONG_TERM_CAPITAL, SECTION_1231_NET, ORDINARY} is ERR_INVALID_REQUEST (400), distinct from the 422 ERR_GAIN_NOT_ELIGIBLE that a legal-but-barred ORDINARY value produces."
        test_recipe:
          setup:
            - "One ATTESTED Investor."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Enum Investor", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "COLLECTIBLES_GAIN", eligible_amount: 50000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 0.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_amount: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_amount} == ERR_INVALID_REQUEST with HTTP 400 (eligible_amount must be strictly greater than 0.00)"
            - "Investor.${inv_id}.eligible_gain_total == 0.00 and no EligibleGain row exists"

      - name: qoz_business_zone_tract_code_wrong_length_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.QOZBusiness.fields.zone_tract_code
        distinguishing_aspect: "zone_tract_code must be exactly 11 characters; a 10-character census tract code is ERR_INVALID_REQUEST and the business is not created."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Tract Code Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Short Code LLC", zone_tract_code: "1234567890", declared_nqfp_amount: 0.00, total_asset_value: 500000.00, total_tangible_property_basis: 450000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /qof/qoz-businesses?fund_id=${fund_id} returns total_count == 0"

      - name: capital_expenditure_is_immutable_ledger_row
        claim_type: immutability
        grounds:
          - entities.CapitalExpenditure.common_fields
          - endpoints[POST /qof/improvement-projects/{id}/expenditures]
        distinguishing_aspect: "CapitalExpenditure declares common_fields false: the created row carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for it."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund, one FundAsset of 400000.00 with original_use_in_zone false, and one OPEN ASSET_BY_ASSET ImprovementProject with window_start 2026-01-01 whose version is captured."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Ledger Row Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 400000.00, afs_fair_value: 400000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
          trigger:
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 125000.50, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { exp_id: $.data.id }
          assert:
            - "HTTP 201; CapitalExpenditure.${exp_id} exposes id and created_at and carries no version field and no updated_at field"
            - "CapitalExpenditure.${exp_id}.amount == 125000.50, expenditure_kind == CAPITALIZED_IMPROVEMENT, counts_toward_basis == true"
            - "CapitalExpenditure.${exp_id}.spend_date == 2026-08-01T00:00:00Z (the logical clock, not a client field)"
            - "CapitalExpenditure.${exp_id}.improvement_project_id == ${proj_id} and wcsh_plan_id == null"
            - "ImprovementProject.${proj_id}.version == 2 (the parent versions, the ledger row does not)"
            - "§1.5 declares no PATCH or DELETE endpoint for CapitalExpenditure"

      - name: business_test_creation_under_unknown_parent_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BusinessTest.fields.qoz_business_id
          - validations[priority=6]
          - errors[ERR_QOZ_BUSINESS_NOT_FOUND]
        distinguishing_aspect: "BusinessTest is created through the nested route under its parent QOZBusiness; an unknown parent id in the path is ERR_QOZ_BUSINESS_NOT_FOUND (404), resolved before any body validation."
        test_recipe:
          setup:
            - "Empty database; no QOZBusiness rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /qof/qoz-businesses/00000000-0000-4000-8000-0000000000aa/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_QOZ_BUSINESS_NOT_FOUND with HTTP 404"
            - "no BusinessTest row is created"

      - name: fund_asset_qozb_equity_cross_fund_link_rejected
        claim_type: flat
        grounds:
          - validations[priority=29]
          - complexity_profile.entity_topology
          - errors[ERR_QOZB_LINK_REQUIRED]
        distinguishing_aspect: "Flat topology means foreign keys are validated for cross-reference integrity, not merely existence: a QOZB_EQUITY asset pointing at a QOZBusiness that belongs to a DIFFERENT fund is ERR_QOZB_LINK_REQUIRED (422), and a non-equity asset supplying qoz_business_id is refused by the same rule."
        test_recipe:
          setup:
            - "Two SELF_CERTIFIED Funds, both managed by mgr-fund-1."
            - "One QOZBusiness under the second fund only."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Link Fund A", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_a: $.data.id }
            - call: "POST /qof/funds/${fund_a}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds"
              payload: { name: "Link Fund B", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_b: $.data.id }
            - call: "POST /qof/funds/${fund_b}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_b}", legal_name: "Other Fund Business LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 0.00, total_asset_value: 500000.00, total_tangible_property_basis: 450000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_b: $.data.id }
          trigger:
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_a}", asset_class: "QOZB_EQUITY", qoz_business_id: "${biz_b}", acquisition_date: "2026-01-20T00:00:00Z", unadjusted_cost_basis: 300000.00, afs_fair_value: 300000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_cross_fund: $.data.error_id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_b}", asset_class: "CASH", qoz_business_id: "${biz_b}", acquisition_date: "2026-01-20T00:00:00Z", unadjusted_cost_basis: 100000.00, afs_fair_value: 100000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_stray_link: $.data.error_id }
          assert:
            - "${err_cross_fund} == ERR_QOZB_LINK_REQUIRED with HTTP 422 (the business exists but belongs to Fund.${fund_b})"
            - "${err_stray_link} == ERR_QOZB_LINK_REQUIRED with HTTP 422 (a CASH asset must omit qoz_business_id)"
            - "Fund.${fund_a}.aggregate_asset_basis == 0.00 and Fund.${fund_b}.aggregate_asset_basis == 0.00"
            - "GET /qof/fund-assets returns total_count == 0"

  - section: state_machines
    instances:
      - name: asset_test_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.AssetTest.initial_state
          - endpoints[POST /qof/funds/{id}/asset-tests]
          - entities.AssetTest
        distinguishing_aspect: "A freshly created AssetTest sits in the declared initial_state DRAFT with every measured field at its unmeasured zero and result PENDING; only valuation_method is resolved at creation, from the fund default."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund created without asset_test_valuation_method, so it carries the default UNADJUSTED_COST_BASIS."
            - "The fund holds no FundAsset rows; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Initial State Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
