# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dues_quote_renewal_vs_reinstatement_divergence
        grounds:
          - calculations.dues_quote
          - calculations.dues_quote.variants.renewal_quote
          - calculations.dues_quote.variants.reinstatement_quote
          - state_machines.Membership.LAPSED_to_ACTIVE
          - entities.Membership.fields.quoted_total_cents
        distinguishing_aspect: |
          The two variants of dues_quote run on the Membership domain and diverge for the same
          club dues of 2999 cents: the renewal variant charges the 2000-cent new-member line and
          yields 10062 cents, while the reinstatement variant suppresses that line, adds the
          1000-cent reinstatement line and yields 9515 cents.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING with club_dues_cents 2999 and cycle_opened_at 2026-09-01T00:00:00Z"
            - "Grace is enrolled at 2026-09-02T00:00:00Z, paid cycle 0, then two close-cycle calls leave her LAPSED with dues_status OVERDUE at dues_cycle_index 2"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 2999, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Grace Hopper", email: "grace@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_grace_id: "$.data.id", m_grace_id: "$.data.member_id" }
            - call: "POST /toastmasters/memberships/${ms_grace_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_grace_id}"
            - call: "POST /toastmasters/clubs/${club_id}/close-cycle"
              payload: {}
              as: WorldHeadquarters
            - call: "POST /toastmasters/clubs/${club_id}/close-cycle"
              payload: {}
              as: WorldHeadquarters
          trigger:
            - call: "POST /toastmasters/memberships/${ms_grace_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_grace_id}"
              captures: { grace_quote: "$.data.quoted_total_cents", grace_status: "$.data.status" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "POST /toastmasters/memberships/${ms_ada_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { ada_quote: "$.data.quoted_total_cents" }
          assert:
            - "Membership.${ms_grace_id}.quoted_total_cents == 9515 (reinstatement variant: 4838 + 3224 + 0 + 1000 + 453)"
            - "Membership.${ms_ada_id}.quoted_total_cents == 10062 (renewal variant: 4838 + 3224 + 2000 + 0 + 0)"
            - "Membership.${ms_grace_id}.status == ACTIVE and Membership.${ms_ada_id}.status == ACTIVE after their renewals"
            - "Membership.${ms_grace_id}.dues_paid_through_cycle == 2 and Membership.${ms_ada_id}.dues_paid_through_cycle == 2"

      - name: club_score_live_variant_diverges_from_cycle_close_variant
        grounds:
          - calculations.club_good_standing_score
          - calculations.club_good_standing_score.variants.live_score
          - calculations.club_good_standing_score.variants.cycle_close_score
          - entities.Club.fields.good_standing_score
          - state_machines.Club.GOOD_to_PROBATION
        distinguishing_aspect: |
          The two variants of club_good_standing_score run on the Club domain and diverge for the
          same club: the cycle-close variant counts only rows created at or before cycle_closed_at
          and reports 60 for the closing cycle, while the live variant recomputed after the cycle
          rolls over counts the new cycle's rows only and reports 2.
        test_recipe:
          setup:
            - "Club Lakeview Speakers is ORGANIZING with club_dues_cents 3000 and 20 members enrolled through one bulk call with dues paid for cycle 0"
            - "Four LEVEL_1 projects are logged, evaluated and approved so approved_level_completions_this_cycle is 4"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Lakeview Speakers", club_type: "COMMUNITY", district_number: "42", division_code: "D", area_code: "D-1", venue_name: "Lakeview Hall", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-04T18:30:00Z", organizing_meeting_attendees: 8 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", members: [{ full_name: "M1", email: "m1@example.org" }, { full_name: "M2", email: "m2@example.org" }, { full_name: "M3", email: "m3@example.org" }, { full_name: "M4", email: "m4@example.org" }, { full_name: "M5", email: "m5@example.org" }, { full_name: "M6", email: "m6@example.org" }, { full_name: "M7", email: "m7@example.org" }, { full_name: "M8", email: "m8@example.org" }, { full_name: "M9", email: "m9@example.org" }, { full_name: "M10", email: "m10@example.org" }, { full_name: "M11", email: "m11@example.org" }, { full_name: "M12", email: "m12@example.org" }, { full_name: "M13", email: "m13@example.org" }, { full_name: "M14", email: "m14@example.org" }, { full_name: "M15", email: "m15@example.org" }, { full_name: "M16", email: "m16@example.org" }, { full_name: "M17", email: "m17@example.org" }, { full_name: "M18", email: "m18@example.org" }, { full_name: "M19", email: "m19@example.org" }, { full_name: "M20", email: "m20@example.org" }], pay_dues_immediately: true }
              as: WorldHeadquarters
              captures: { ms_a_id: "$.data.memberships[0].id", m_a_id: "$.data.memberships[0].member_id", ms_b_id: "$.data.memberships[1].id", m_b_id: "$.data.memberships[1].member_id", ms_c_id: "$.data.memberships[2].id", m_c_id: "$.data.memberships[2].member_id", ms_d_id: "$.data.memberships[3].id", m_d_id: "$.data.memberships[3].member_id" }
            - call: "GET /toastmasters/memberships/${ms_a_id}"
              as: WorldHeadquarters
              captures: { ms_a_v: "$.data.version" }
            - call: "POST /toastmasters/education-paths"
              payload: { membership_id: "${ms_a_id}", path_code: "DYNAMIC_LEADERSHIP", expected_membership_version: "${ms_a_v}" }
              as: Member
              as_user_id: "${m_a_id}"
              captures: { path_a_id: "$.data.id", path_a_v: "$.data.version" }
            - call: "POST /toastmasters/project-completions"
              payload: { path_id: "${path_a_id}", project_code: "L1-ICE-BREAKER", project_kind: "SPEECH", level: 1, speech_minutes: 6, delivered_at: "2026-09-08T18:30:00Z", evaluator_member_id: "${m_b_id}", expected_education_path_version: "${path_a_v}" }
              as: Member
              as_user_id: "${m_a_id}"
              captures: { pc_a_id: "$.data.id" }
            - call: "POST /toastmasters/project-completions/${pc_a_id}/evaluation"
              payload: { evaluation_summary: "Clear structure and strong opening" }
              as: Member
              as_user_id: "${m_b_id}"
            - call: "POST /toastmasters/project-completions/${pc_a_id}/review"
              payload: { decision: "APPROVE" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
          trigger:
            - call: "POST /toastmasters/clubs/${club_id}/close-cycle"
              payload: { cycle_opened_at: "2026-10-01T00:00:00Z", cycle_closed_at: "2026-10-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { close_score: "$.data.good_standing_score", close_points: "$.data.dcp_recognition_points" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-10-05T18:30:00Z", duration_minutes: 90, venue_name: "Lakeview Hall", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
              captures: { mtg_id: "$.data.id" }
            - call: "POST /toastmasters/meetings/${mtg_id}/close"
              payload: { outcome: "HELD", attendance_count: 6, attendee_member_ids: ["${m_a_id}"] }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
          assert:
            - "Club.${club_id}.good_standing_score == 60 immediately after close-cycle (cycle-close variant: 30 dues + 0 officer + 20 education + 0 meeting + 10 from 7 DCP points)"
            - "Club.${club_id}.dcp_recognition_points == 7 after close-cycle"
            - "Club.${club_id}.good_standing == PROBATION after close-cycle"
            - "Club.${club_id}.good_standing_score == 2 after the post-close meeting is held (live variant on the new cycle: 0 dues + 0 officer + 0 education + 2 meeting + 0 DCP)"
            - "Club.${club_id}.good_standing stays PROBATION after the live recompute because only close-cycle re-derives the posture"

  - rule_id: combinatorial_formula
    instances:
      - name: dues_quote_round_per_line_beats_sum_then_round
        grounds:
          - calculations.dues_quote
          - entities.Membership.fields.quoted_total_cents
          - entities.Club.fields.club_dues_cents
        distinguishing_aspect: |
          dues_quote is a nested-rounding formula (mode b) with the order pinned: rounding each of
          the five lines half-up before summing yields 10062 for club_dues_cents 2999, while
          summing the raw lines and rounding once yields 10061.
        test_recipe:
          setup:
            - "Club Riverside Voices is ORGANIZING with club_dues_cents 2999"
            - "Ada is enrolled as a first-time member with join_date 2026-09-02T00:00:00Z so no proration applies"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 2999, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
          trigger:
            - call: "POST /toastmasters/memberships/${ms_ada_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { quote: "$.data.quoted_total_cents", dues_status: "$.data.dues_status" }
          assert:
            - "Membership.${ms_ada_id}.quoted_total_cents == 10062 (round(4837.5) + round(3223.925) + 2000 + 0 + 0)"
            - "Membership.${ms_ada_id}.quoted_total_cents != 10061 (the sum-then-round result is wrong by one cent)"
            - "Membership.${ms_ada_id}.dues_status == PAID and Membership.${ms_ada_id}.dues_paid_through_cycle == 0"

      - name: dcp_points_nested_minmax_over_four_inputs
        grounds:
          - calculations.dcp_recognition_points
          - entities.Club.fields.dcp_recognition_points
          - entities.Club.fields.dcp_tier
          - entities.Club.fields.officer_trained_count
        distinguishing_aspect: |
          dcp_recognition_points is a mode (a) formula with four inputs and nested min/max plus a
          conditional 7-officer bonus: 20 paid members with 20 new members, 4 trained officers,
          3 approved completions, no contest and a GOOD cycle-open snapshot evaluate to exactly 7
          points, the SELECT_DISTINGUISHED tier and a club score of 80.
        test_recipe:
          setup:
            - "Club Lakeview Speakers is ORGANIZING with 20 members enrolled through one bulk call, dues paid for cycle 0"
            - "Three LEVEL_1 projects are logged, evaluated and approved by three different members"
            - "Four officer terms are elected and trained"
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Lakeview Speakers", club_type: "COMMUNITY", district_number: "42", division_code: "D", area_code: "D-1", venue_name: "Lakeview Hall", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-04T18:30:00Z", organizing_meeting_attendees: 8 }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", members: [{ full_name: "M1", email: "m1@example.org" }, { full_name: "M2", email: "m2@example.org" }, { full_name: "M3", email: "m3@example.org" }, { full_name: "M4", email: "m4@example.org" }, { full_name: "M5", email: "m5@example.org" }, { full_name: "M6", email: "m6@example.org" }, { full_name: "M7", email: "m7@example.org" }, { full_name: "M8", email: "m8@example.org" }, { full_name: "M9", email: "m9@example.org" }, { full_name: "M10", email: "m10@example.org" }, { full_name: "M11", email: "m11@example.org" }, { full_name: "M12", email: "m12@example.org" }, { full_name: "M13", email: "m13@example.org" }, { full_name: "M14", email: "m14@example.org" }, { full_name: "M15", email: "m15@example.org" }, { full_name: "M16", email: "m16@example.org" }, { full_name: "M17", email: "m17@example.org" }, { full_name: "M18", email: "m18@example.org" }, { full_name: "M19", email: "m19@example.org" }, { full_name: "M20", email: "m20@example.org" }], pay_dues_immediately: true }
              as: WorldHeadquarters
              captures: { ms_a_id: "$.data.memberships[0].id", m_a_id: "$.data.memberships[0].member_id", ms_b_id: "$.data.memberships[1].id", m_b_id: "$.data.memberships[1].member_id", ms_c_id: "$.data.memberships[2].id", m_c_id: "$.data.memberships[2].member_id", ms_d_id: "$.data.memberships[3].id", m_d_id: "$.data.memberships[3].member_id" }
            - call: "GET /toastmasters/memberships/${ms_a_id}"
              as: WorldHeadquarters
              captures: { ms_a_v: "$.data.version" }
            - call: "POST /toastmasters/education-paths"
              payload: { membership_id: "${ms_a_id}", path_code: "DYNAMIC_LEADERSHIP", expected_membership_version: "${ms_a_v}" }
              as: Member
              as_user_id: "${m_a_id}"
              captures: { path_a_id: "$.data.id", path_a_v: "$.data.version" }
            - call: "POST /toastmasters/project-completions"
              payload: { path_id: "${path_a_id}", project_code: "L1-ICE-BREAKER", project_kind: "SPEECH", level: 1, speech_minutes: 6, delivered_at: "2026-09-08T18:30:00Z", evaluator_member_id: "${m_b_id}", expected_education_path_version: "${path_a_v}" }
              as: Member
              as_user_id: "${m_a_id}"
              captures: { pc_a_id: "$.data.id" }
            - call: "POST /toastmasters/project-completions/${pc_a_id}/evaluation"
              payload: { evaluation_summary: "Strong opening" }
              as: Member
              as_user_id: "${m_b_id}"
            - call: "POST /toastmasters/project-completions/${pc_a_id}/review"
              payload: { decision: "APPROVE" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "GET /toastmasters/memberships/${ms_b_id}"
              as: WorldHeadquarters
              captures: { ms_b_v: "$.data.version" }
            - call: "POST /toastmasters/education-paths"
              payload: { membership_id: "${ms_b_id}", path_code: "DYNAMIC_LEADERSHIP", expected_membership_version: "${ms_b_v}" }
              as: Member
              as_user_id: "${m_b_id}"
              captures: { path_b_id: "$.data.id", path_b_v: "$.data.version" }
            - call: "POST /toastmasters/project-completions"
              payload: { path_id: "${path_b_id}", project_code: "L1-WRITING-A-SPEECH", project_kind: "SPEECH", level: 1, speech_minutes: 5, delivered_at: "2026-09-09T18:30:00Z", evaluator_member_id: "${m_a_id}", expected_education_path_version: "${path_b_v}" }
              as: Member
              as_user_id: "${m_b_id}"
              captures: { pc_b_id: "$.data.id" }
            - call: "POST /toastmasters/project-completions/${pc_b_id}/evaluation"
              payload: { evaluation_summary: "Good pacing" }
              as: Member
              as_user_id: "${m_a_id}"
            - call: "POST /toastmasters/project-completions/${pc_b_id}/review"
              payload: { decision: "APPROVE" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "GET /toastmasters/memberships/${ms_c_id}"
              as: WorldHeadquarters
              captures: { ms_c_v: "$.data.version" }
            - call: "POST /toastmasters/education-paths"
              payload: { membership_id: "${ms_c_id}", path_code: "DYNAMIC_LEADERSHIP", expected_membership_version: "${ms_c_v}" }
              as: Member
              as_user_id: "${m_c_id}"
              captures: { path_c_id: "$.data.id", path_c_v: "$.data.version" }
            - call: "POST /toastmasters/project-completions"
              payload: { path_id: "${path_c_id}", project_code: "L1-EVALUATION-AND-FEEDBACK", project_kind: "EVALUATION", level: 1, speech_minutes: 0, delivered_at: "2026-09-10T18:30:00Z", evaluator_member_id: "${m_a_id}", expected_education_path_version: "${path_c_v}" }
              as: Member
              as_user_id: "${m_c_id}"
              captures: { pc_c_id: "$.data.id" }
            - call: "POST /toastmasters/project-completions/${pc_c_id}/evaluation"
              payload: { evaluation_summary: "Thoughtful feedback" }
              as: Member
              as_user_id: "${m_a_id}"
            - call: "POST /toastmasters/project-completions/${pc_c_id}/review"
              payload: { decision: "APPROVE" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-11T18:30:00Z", duration_minutes: 90, venue_name: "Lakeview Hall", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
              captures: { mtg_id: "$.data.id" }
            - call: "POST /toastmasters/meetings/${mtg_id}/close"
              payload: { outcome: "HELD", attendance_count: 7, attendee_member_ids: ["${m_a_id}", "${m_b_id}"] }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "POST /toastmasters/officer-terms"
              payload: { club_id: "${club_id}", member_id: "${m_a_id}", office: "PRESIDENT" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
              captures: { term_1_id: "$.data.id" }
            - call: "POST /toastmasters/officer-terms"
              payload: { club_id: "${club_id}", member_id: "${m_b_id}", office: "VP_EDUCATION" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
              captures: { term_2_id: "$.data.id" }
            - call: "POST /toastmasters/officer-terms"
              payload: { club_id: "${club_id}", member_id: "${m_c_id}", office: "VP_MEMBERSHIP" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
              captures: { term_3_id: "$.data.id" }
            - call: "POST /toastmasters/officer-terms"
              payload: { club_id: "${club_id}", member_id: "${m_d_id}", office: "SECRETARY" }
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
              captures: { term_4_id: "$.data.id" }
            - call: "POST /toastmasters/officer-terms/${term_1_id}/elect"
              payload: {}
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "POST /toastmasters/officer-terms/${term_2_id}/elect"
              payload: {}
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "POST /toastmasters/officer-terms/${term_3_id}/elect"
              payload: {}
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "POST /toastmasters/officer-terms/${term_4_id}/elect"
              payload: {}
              as: ClubOfficer
              as_user_id: "${ms_a_id}"
            - call: "POST /toastmasters/officer-terms/${term_1_id}/training"
              payload: {}
              as: DistrictDirector
              as_user_id: "${m_d_id}"
            - call: "POST /toastmasters/officer-terms/${term_2_id}/training"
              payload: {}
              as: DistrictDirector
              as_user_id: "${m_d_id}"
            - call: "POST /toastmasters/officer-terms/${term_3_id}/training"
              payload: {}
              as: DistrictDirector
              as_user_id: "${m_d_id}"
            - call: "POST /toastmasters/officer-terms/${term_4_id}/training"
              payload: {}
              as: DistrictDirector
              as_user_id: "${m_d_id}"
          trigger:
            - call: "POST /toastmasters/clubs/${club_id}/close-cycle"
              payload: { cycle_opened_at: "2026-10-01T00:00:00Z", cycle_closed_at: "2026-10-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { points: "$.data.dcp_recognition_points", tier: "$.data.dcp_tier" }
          assert:
            - "Club.${club_id}.dcp_recognition_points == 7 (education 3 + membership 2 + training 1 + admin 1, capped at 10)"
            - "Club.${club_id}.dcp_tier == SELECT_DISTINGUISHED"
            - "Club.${club_id}.good_standing_score == 80 (30 dues + 25 officer + 15 education + 0 meeting + 10 from 7 DCP points)"
            - "Club.${club_id}.officer_trained_count == 4 and Club.${club_id}.paid_member_count == 20"

      - name: good_standing_circular_order_pinned_to_cycle_open_snapshot
        grounds:
          - calculations.club_good_standing_score
          - calculations.dcp_recognition_points
          - entities.Club.fields.cycle_open_standing
          - entities.Club.fields.good_standing_score
        distinguishing_aspect: |
          The circular-looking dependency between dcp_recognition_points and club_good_standing_score
          (mode c) is pinned to one evaluation order: points are evaluated first from the
          cycle_open_standing snapshot, so a club with 20 paid members and nothing else scores 36
          and earns 3 points, where the reverse order would have scored 34 and earned 2.
