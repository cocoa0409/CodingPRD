            - *c_forecast2
            - call: "POST /staffing-plans/${plan_id}/submit"
              payload: {}
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { coverage_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane2_id}", officer_id: "${off2_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { v_asg3: $.data.id }
