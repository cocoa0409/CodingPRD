  # ===========================================================================
  - section: validations
    instances:

      - name: existence_checked_before_state_on_subscription_action
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A cancel against a subscription id that does not exist returns 404 ERR_NOT_FOUND (existence, priority 3) even though a cancelled-subscription state violation would also conceptually apply — existence always wins."
        test_recipe:
          setup:
            - "Account A1 exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions/00000000-0000-4000-8000-0000000000aa/cancel"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_pv: $.data.error_id }
          assert:
            - "response status 404 and error_id == ERR_NOT_FOUND"
            - "error_id != ERR_INVALID_STATE (priority 3 precedes priority 6)"

      - name: stale_version_rejected_before_state_check_on_convert
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - concurrency_rules[subscription-convert-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A convert carrying a stale expected version on a subscription that is ALSO in the wrong state reports ERR_STALE_VERSION (412, priority 5) rather than ERR_INVALID_STATE — the OCC check outranks the state check."
        test_recipe:
          setup:
            - "SAFETY tier, TX zone, account A1, vehicle V1; subscription created TRIAL then cancelled (terminal). Captured version is the pre-cancel version."
          setup_api_calls:
            - call: "POST /plan-tiers"
              payload: { code: "SAFETY", monthly_fee_cents: 2000, allows_emergency: true, allows_remote_commands: false, allows_navigation: false, allows_data_gb: 0 }
              as: PlatformAdmin
            - call: "POST /coverage-zones"
              payload: { region_code: "TX", has_cellular: true, supports_data: true, supports_navigation: true }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { full_name: "Ana Alvarez", email: "ana@example.com", phone: "+15125550101", home_region_code: "TX" }
              as: PlatformAdmin
              captures: { acct_a1: $.data.id }
            - call: "POST /accounts/${acct_a1}/vehicles"
              payload: { vin: "1G1ZD5ST5JF000001", make: "Chevrolet", model: "Malibu", model_year: 2020, region_code: "TX", hardware_generation: 5 }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { veh_v1: $.data.id }
            - call: "POST /accounts/${acct_a1}/subscriptions"
              payload: { vehicle_id: "${veh_v1}", tier_code: "SAFETY" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_st: $.data.id, sub_st_v: $.data.version }
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_st}/cancel"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_st}/convert"
              payload: { expected_subscription_version: "${sub_st_v}" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_sv: $.data.error_id }
          assert:
            - "response status 412 and error_id == ERR_STALE_VERSION (the cancel bumped version past the captured one)"
            - "error_id != ERR_INVALID_STATE even though CANCELLED is also an invalid from-state"

      - name: crash_event_in_dead_zone_created_rejected_no_coverage
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - calculations.entitlement_snapshot
          - entities.CrashEvent.fields.status
        distinguishing_aspect: "Coverage gates before entitlement: a crash reported from an NM zone with has_cellular false is persisted directly in REJECTED_NO_ENTITLEMENT's sibling terminal REJECTED_NO_COVERAGE even though the subscription is fully ACTIVE — the coverage flag dominates."
        test_recipe:
          setup:
