          A different entity pair from contract_creation_requires_athlete_enrolled:
          PaymentRelease depends on Collective.funding_posture, an ancestor's
          derived state rather than a sibling's declared state. The contract itself
          is perfectly healthy (ACTIVE, disclosure ACCEPTED, requested amount well
