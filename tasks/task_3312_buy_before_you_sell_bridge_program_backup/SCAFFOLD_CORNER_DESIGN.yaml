scaffold_corner_design:
  - section: entities
    instances:
      - name: homeowner_create_returns_full_row
        claim_type: creation
        grounds:
          - "entities.Homeowner.fields.credit_score"
          - "endpoints.POST_/knock/homeowners"
        distinguishing_aspect: "POST /knock/homeowners with all required fields returns code 201 and echoes every input field plus the common fields."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H1", email: "c.h1@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id, c_credit: $.data.credit_score }
          assert:
            - "response code == 201 and Homeowner.${h_id}.created_at is set"
            - "Homeowner.${h_id}.credit_score == 700"
            - "Homeowner.${h_id}.program_status == NONE (initial enum value)"
      - name: homeowner_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Homeowner.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /knock/homeowners omitting email is rejected with ERR_INVALID_REQUEST before any row is written."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /knock/homeowners"
              payload: { full_name: "No Email", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
      - name: property_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - "entities.Property.fields.purchase_price_cents"
          - "entities.Property.fields.mortgage_payoff_cents"
          - "entities.Property.fields.listing_status"
        distinguishing_aspect: "Creating a DEPARTING property without purchase_price_cents or mortgage_payoff_cents applies the declared defaults 0 and leaves listing_status UNLISTED."
        test_recipe:
          setup: ["one Homeowner exists"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H2", email: "c.h2@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "1 Def Way", kind: "DEPARTING", appraised_value_cents: 50000000, condition_grade: "B" }
              as: Coordinator
              captures: { p_id: $.data.id, c_pp: $.data.purchase_price_cents }
          assert:
            - "Property.${p_id}.purchase_price_cents == 0 (default applied)"
            - "Property.${p_id}.mortgage_payoff_cents == 0 (default applied)"
            - "Property.${p_id}.listing_status == UNLISTED"
      - name: qualification_capacity_computed_on_create
        claim_type: computed_fields
        grounds:
          - "calculations.purchase_capacity"
          - "entities.Qualification.fields.capacity_cents"
        distinguishing_aspect: "capacity_cents is computed server-side from equity and variant, ignoring any client-supplied value; a CONSERVATIVE creation yields 21000000."
        test_recipe:
          setup: ["Homeowner H, departing property D 60000000/30000000 grade B, new property N"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H3", email: "c.h3@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "2 Def Way", kind: "DEPARTING", appraised_value_cents: 60000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "3 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
          trigger:
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 50000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id, c_cap: $.data.capacity_cents }
          assert:
            - "Qualification.${q_id}.capacity_cents == 21000000 (30000000 equity * 7000 bps)"
            - "Qualification.${q_id}.equity_ratio == 0.5"
      - name: property_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_PROPERTY_NOT_FOUND]"
        distinguishing_aspect: "GET /knock/properties/{id} with an id that matches no row returns ERR_PROPERTY_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /knock/properties/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Coordinator
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_PROPERTY_NOT_FOUND"
      - name: property_kind_enum_constraint_rejects_invalid_value
        claim_type: type_constraints
        grounds:
          - "entities.Property.fields.kind"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /knock/properties with kind OTHER (outside {DEPARTING, NEW}) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one Homeowner exists"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H4", email: "c.h4@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "4 Def Way", kind: "OTHER", appraised_value_cents: 50000000, condition_grade: "B" }
              as: Coordinator
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
      - name: properties_list_filtered_by_homeowner
        claim_type: listing
        grounds:
          - "endpoints.GET_/knock/properties"
          - "entities.Property.fields.homeowner_id"
        distinguishing_aspect: "GET /knock/properties with homeowner_id returns only that household's properties as Property[] with pagination fields."
        test_recipe:
          setup: ["Homeowner A owns one property; Homeowner B owns one property"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Owner A", email: "own.a@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { a_id: $.data.id }
            - call: "POST /knock/homeowners"
              payload: { full_name: "Owner B", email: "own.b@x.com", credit_score: 700, household_income_cents: 10000000 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${a_id}", address: "5 Def Way", kind: "DEPARTING", appraised_value_cents: 50000000, condition_grade: "B" }
              as: Coordinator
              captures: { pa_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${b_id}", address: "6 Def Way", kind: "DEPARTING", appraised_value_cents: 50000000, condition_grade: "B" }
              as: Coordinator
              captures: { pb_id: $.data.id }
          trigger:
            - call: "GET /knock/properties"
              payload: { homeowner_id: "${a_id}", limit: 10, offset: 0 }
              as: Coordinator
          assert:
            - "exactly 1 Property is returned, Property.${pa_id}, not Property.${pb_id}"
            - "total_count == 1 and has_more == false"
  - section: state_machines
    instances:
      - name: listing_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.Listing.DRAFT_to_LIVE"
          - "entities.Listing.fields.status"
        distinguishing_aspect: "A freshly created Listing starts in DRAFT and cannot be reached into LIVE without the go-live transition."
        test_recipe:
          setup: ["a program P with a DEPARTING property D"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H5", email: "c.h5@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "7 Def Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "8 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
          trigger:
            - call: "POST /knock/listings"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", list_price_cents: 44000000 }
              as: Coordinator
              captures: { l_id: $.data.id, c_status: $.data.status }
          assert:
            - "Listing.${l_id}.status == DRAFT"
            - "Listing.${l_id}.marketing_status == NOT_STARTED"
      - name: backup_offer_exercise_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.BackupOffer.DRAFT_to_ISSUED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Exercising a DRAFT backup offer has no declared transition and is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["a DRAFT BackupOffer on a listed departing property"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H6", email: "c.h6@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "9 Def Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "10 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
            - call: "POST /knock/backup-offers"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", offer_price_cents: 61000000, window_days: 30, window_start: "2026-09-01T00:00:00Z" }
              as: Coordinator
              captures: { bo_id: $.data.id, bo_v: $.data.version }
          trigger:
            - call: "POST /knock/backup-offers/${bo_id}/exercise"
              payload: { expected_backup_offer_version: "${bo_v}" }
              as: Coordinator
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (no DRAFT-to-EXERCISED transition exists)"
            - "BackupOffer.${bo_id}.status remains DRAFT"
      - name: coordination_task_complete_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.CoordinationTask.OPEN_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Completing an already COMPLETED CoordinationTask has no outgoing transition and returns ERR_INVALID_STATE on the second call."
        test_recipe:
          setup: ["one OPEN CoordinationTask T"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H7", email: "c.h7@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "11 Def Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "12 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
            - call: "POST /knock/agents"
              payload: { full_name: "Ag Task", brokerage_name: "Broker", license_number: "LIC-TASK" }
              as: Coordinator
              captures: { ag_id: $.data.id }
            - call: "POST /knock/referrals"
              payload: { agent_id: "${ag_id}", bridge_program_id: "${bp_id}", role_scope: "DEPARTING_SIDE" }
              as: Coordinator
              captures: { rf_id: $.data.id }
            - call: "POST /knock/coordination-tasks"
              payload: { bridge_program_id: "${bp_id}", referral_id: "${rf_id}", task_kind: "PHOTOGRAPHY", due_date: "2026-09-20T00:00:00Z" }
              as: Coordinator
              captures: { ct_id: $.data.id }
            - call: "POST /knock/coordination-tasks/${ct_id}/complete"
              payload: {}
              as: Agent
          trigger:
            - call: "POST /knock/coordination-tasks/${ct_id}/complete"
              payload: {}
              as: Agent
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (COMPLETED is terminal for CoordinationTask)"
      - name: listing_go_live_sets_property_marketing_side_effect
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Listing.DRAFT_to_LIVE"
          - "state_machines.Property.UNLISTED_to_LISTED"
        distinguishing_aspect: "The Listing DRAFT-to-LIVE side effect sets Property.listing_status to LISTED in the same request's response."
        test_recipe:
          setup: ["a DRAFT Listing L on a repaired DEPARTING property with the program OCCUPYING_NEW"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H8", email: "c.h8@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "13 Def Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "14 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
            - call: "POST /knock/bridge-programs/${bp_id}/occupy-new"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/properties/${dep_id}/site-visits"
              payload: {}
              as: Coordinator
            - call: "POST /knock/listings"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", list_price_cents: 44000000 }
              as: Coordinator
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /knock/listings/${l_id}/go-live"
              payload: {}
              as: Coordinator
              captures: { lv: $.data.version }
          assert:
            - "Listing.${l_id}.status == LIVE"
            - "Listing.${l_id}.marketing_status == ACTIVE"
            - "Property.${dep_id}.listing_status == LISTED (side effect applied in the same request)"
  - section: calculations
    instances:
      - name: referral_fee_qualified_bonus_and_credits
        claim_type: correct_result
        grounds:
          - "calculations.referral_fee_reconciliation"
          - "entities.Referral.fields.base_fee_cents"
          - "entities.Referral.fields.reconciled_fee_cents"
        distinguishing_aspect: "With a QUALIFIED agent, volume 50000000 and one completed coordination task, base_fee_cents is 1250000 and reconciled_fee_cents is 1305500."
        test_recipe:
          setup: ["a QUALIFIED agent, an OPEN referral on a program, and one COMPLETED CoordinationTask"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H9", email: "c.h9@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "15 Def Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "16 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
            - call: "POST /knock/agents"
              payload: { full_name: "Ag Fee", brokerage_name: "Broker", license_number: "LIC-FEE" }
              as: Coordinator
              captures: { ag_id: $.data.id }
            - call: "POST /knock/agents/${ag_id}/qualify"
              payload: {}
              as: Coordinator
            - call: "POST /knock/referrals"
              payload: { agent_id: "${ag_id}", bridge_program_id: "${bp_id}", role_scope: "DEPARTING_SIDE", qualifying_volume_cents: 50000000 }
              as: Coordinator
              captures: { rf_id: $.data.id }
            - call: "POST /knock/coordination-tasks"
              payload: { bridge_program_id: "${bp_id}", referral_id: "${rf_id}", task_kind: "PHOTOGRAPHY", due_date: "2026-09-20T00:00:00Z" }
              as: Coordinator
              captures: { ct_id: $.data.id }
            - call: "POST /knock/coordination-tasks/${ct_id}/complete"
              payload: {}
              as: Agent
          trigger:
            - call: "GET /knock/referrals/${rf_id}"
              payload: {}
              as: Coordinator
              captures: { base: $.data.base_fee_cents, rec: $.data.reconciled_fee_cents, var: $.data.fee_variance_cents }
          assert:
            - "base_fee_cents == 1250000 (50000000 * 250 // 10000)"
            - "reconciled_fee_cents == 1305500 (base + 300 bps qualified bonus 37500 + 8000 task credit)"
            - "fee_variance_cents == 55500"
      - name: disclosure_min_tier_boundary_at_exact_threshold
        claim_type: threshold_boundary
        grounds:
          - "calculations.program_charge_disclosure"
          - "entities.BridgeProgram.fields.total_program_charge_cents"
        distinguishing_aspect: "At subtotal exactly 300000 the strict-greater tier test fails and the fixed-reference escalator 10000 applies; at subtotal 303000 the disclosed tier applies and the escalator drops to 7575."
        test_recipe:
          setup: ["two programs on the same approved 30000000-capacity qualification, one funded at program_fee_basis_points 85 and one at 86"]
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "Corner H10", email: "c.h10@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "17 Def Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "18 Def Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "OPTIMISTIC" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
