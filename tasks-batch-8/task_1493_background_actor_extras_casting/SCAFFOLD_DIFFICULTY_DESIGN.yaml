            - "HTTP status == 409"

  - rule_id: boundary_precision_check
    instances:
      - name: overtime_zero_at_exactly_480_minutes
        grounds:
          - calculations.voucher_gross_final
          - validations[priority=6]
        distinguishing_aspect: |
          Metric net_work_minutes at the voucher issue endpoint: exactly 480 net
          minutes must produce zero overtime (tier1 = min(max(480-480,0),120) == 0);
          the boundary is inclusive-regular, not inclusive-OT.
        test_recipe:
          setup:
            - "Production ACTIVE; SAG_AFTRA actor ELIGIBLE; call (union_slots 1, nonunion_slots 0, union_rate 10000, duration 480) SHOOTING; booking CONFIRMED; CHECK_IN 07:00; timely meal 12:00-12:30; WRAP_OUT 15:30 (elapsed 510, net exactly 480)"
