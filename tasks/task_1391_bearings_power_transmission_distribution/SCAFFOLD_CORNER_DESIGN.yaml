  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: confirm_response_carries_computed_totals_immediately
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "calculations.order_total_aggregation"
        distinguishing_aspect: "Immediate consistency: the confirm 200 response body itself carries the computed unit prices and totals — no follow-up GET is needed to observe the calculation."
        test_recipe:
          setup: ["order DRAFT with line qty 2 (product list 3000, no contract)"]
          setup_api_calls:
