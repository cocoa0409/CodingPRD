scenario: |
  generate task hard than expert level! 1233. Life Insurance Policy Administration System (life insurance carrier operations): policy issuance & underwriting class assignment, premium billing modes & grace period/lapse processing, non-forfeiture options & reduced paid-up election, policy loan interest accrual & repayment, dividend options for participating policies, cash value & cost-of-insurance charges for universal life, reinstatement underwriting, conversion & rider changes

domain_name: life-insurance-policy-administration
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hierarchical
  state_machine_shape: parallel   # Policy has premium_payment_status × form_status dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: InsuredPerson
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: tobacco_user, type: boolean, source: input, description: "Tobacco usage flag (drives underwriting class)" }
      - { name: gender, type: enum, source: input, description: "MALE | FEMALE | OTHER (used for unisex vs gender-distinct COI tables)" }

  - name: ProductTemplate
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code (e.g., WL-PAR-001, UL-FLEX-002)" }
      - { name: product_type, type: enum, source: input, description: "WHOLE_LIFE_PARTICIPATING | WHOLE_LIFE_NON_PARTICIPATING | TERM_CONVERTIBLE | UNIVERSAL_LIFE" }
      - { name: participating, type: boolean, source: input, description: "Whether policy pays dividends" }
      - { name: allows_policy_loans, type: boolean, source: input, description: "Whether policy builds loanable cash value" }
      - { name: min_face_amount_cents, type: integer, source: input, description: "Minimum face amount in cents" }
      - { name: max_face_amount_cents, type: integer, source: input, description: "Maximum face amount in cents" }
      - { name: base_monthly_premium_rate_per_thousand_cents, type: integer, source: input, description: "Base premium rate in cents per $1000 face, per month, at Preferred-NonTobacco class at issue_age=35" }
      - { name: coi_rate_table, type: object, source: input, description: "For UNIVERSAL_LIFE: array of {attained_age, monthly_rate_per_thousand_cents}. For non-UL products, empty array." }
      - { name: surrender_charge_schedule, type: object, source: input, description: "Array of {policy_year_min_inclusive, surrender_charge_pct_bps}. Applies only to UNIVERSAL_LIFE." }

  - name: PolicyApplication
    parent: null
    common_fields: true
    fields:
      - { name: insured_person_id, type: string, source: input, description: "FK -> InsuredPerson.id; the proposed insured" }
      - { name: product_template_id, type: string, source: input, description: "FK -> ProductTemplate.id" }
      - { name: requested_face_amount_cents, type: integer, source: input, description: "Requested face amount in cents" }
      - { name: premium_mode, type: enum, source: input, description: "MONTHLY | QUARTERLY | SEMI_ANNUAL | ANNUAL" }
      - { name: underwriting_class, type: enum, source: computed, description: "PREFERRED_NON_TOBACCO | STANDARD_NON_TOBACCO | PREFERRED_TOBACCO | STANDARD_TOBACCO | SUBSTANDARD_TABLE_B | SUBSTANDARD_TABLE_D; assigned at approval" }
      - { name: substandard_extra_pct_bps, type: integer, source: computed, description: "Substandard extra mortality rating in basis points (0 if not substandard); TABLE_B=+2500, TABLE_D=+5000" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | EVIDENCE_REQUIRED | APPROVED | DECLINED | ISSUED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PolicyApplication.id; originating application" }
      - { name: insured_person_id, type: string, source: system, description: "FK -> InsuredPerson.id; denormalized from application" }
      - { name: product_template_id, type: string, source: system, description: "FK -> ProductTemplate.id; denormalized from application" }
      - { name: policy_number, type: string, source: system, description: "Carrier-assigned policy number (8-digit zero-padded string, sequence order by created_at)" }
      - { name: issue_date, type: datetime, source: system, description: "ISO date the policy was issued" }
      - { name: face_amount_cents, type: integer, source: system, description: "Face amount in cents (set at issuance, modified only by reduced paid-up election)" }
      - { name: premium_mode, type: enum, source: system, description: "MONTHLY | QUARTERLY | SEMI_ANNUAL | ANNUAL (copied from application; modifiable via mode change)" }
      - { name: modal_premium_cents, type: integer, source: computed, description: "Premium due per modal period in cents; computed from face_amount, underwriting_class, premium_mode, attained age at issue" }
      - { name: underwriting_class, type: enum, source: system, description: "Copied from PolicyApplication at issuance" }
      - { name: premium_payment_status, type: enum, source: system, description: "CURRENT | GRACE | LAPSED | REINSTATED_PENDING | PAID_UP (independent state dimension)" }
      - { name: form_status, type: enum, source: system, description: "IN_FORCE | REDUCED_PAID_UP | EXTENDED_TERM | CONVERTED | SURRENDERED | DEATH_CLAIMED (independent state dimension)" }
      - { name: grace_period_end_date, type: datetime, source: computed, description: "ISO date; set when premium_payment_status transitions to GRACE; = unpaid premium due date + 31 days" }
      - { name: cash_value_cents, type: integer, source: computed, description: "Current cash value in cents (WHOLE_LIFE_*: scheduled + dividends accumulated; UNIVERSAL_LIFE: running ledger balance)" }
      - { name: outstanding_loan_principal_cents, type: integer, source: computed, description: "Aggregate outstanding policy-loan principal in cents" }
      - { name: accrued_loan_interest_cents, type: integer, source: computed, description: "Aggregate accrued (unpaid, uncapitalized) loan interest in cents" }
      - { name: dividend_accumulation_cents, type: integer, source: computed, description: "Cash value of dividends on deposit / paid-up additions (participating policies only)" }
      - { name: dividend_option, type: enum, source: system, description: "CASH | PREMIUM_REDUCTION | ACCUMULATE_AT_INTEREST | PAID_UP_ADDITIONS; default CASH; participating only" }
      - { name: paid_to_date, type: datetime, source: computed, description: "ISO date through which premiums are fully paid" }
      - { name: attained_age_at_issue, type: integer, source: computed, description: "Age of insured at issue_date, computed from date_of_birth" }
      - { name: policy_year, type: integer, source: computed, description: "Current policy year (1-based), computed from issue_date and current clock" }

  - name: PremiumBillingCycle
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: cycle_index, type: integer, source: system, description: "1-based index of this cycle since issue" }
      - { name: period_start_date, type: datetime, source: system, description: "ISO start date of coverage period (inclusive)" }
      - { name: period_end_date, type: datetime, source: system, description: "ISO end date (exclusive; half-open interval semantics)" }
      - { name: due_amount_cents, type: integer, source: computed, description: "Modal premium in cents owed for this cycle" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Amount actually paid against this cycle in cents" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | PARTIALLY_PAID | GRACE | LAPSED | WAIVED" }

  - name: PolicyLoan
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Loan principal disbursed in cents" }
      - { name: origination_date, type: datetime, source: system, description: "Date loan was originated" }
      - { name: annual_interest_rate_bps, type: integer, source: system, description: "Annual interest rate in basis points (500 = 5.00%); carrier-fixed at 500" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Current principal outstanding in cents" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Current accrued but uncapitalized interest in cents" }
      - { name: last_accrual_date, type: datetime, source: system, description: "Last date on which interest was accrued (for chronological accrual)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REPAID | FORECLOSED" }

  - name: LoanInterestAccrual
    parent: PolicyLoan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> PolicyLoan.id" }
      - { name: accrual_period_start, type: datetime, source: system, description: "Start of accrual window (inclusive)" }
      - { name: accrual_period_end, type: datetime, source: system, description: "End of accrual window (exclusive)" }
      - { name: principal_base_cents, type: integer, source: system, description: "Principal on which interest was computed (includes prior capitalized interest if capitalizing)" }
      - { name: days_accrued, type: integer, source: system, description: "Number of days in window" }
      - { name: interest_accrued_cents, type: integer, source: system, description: "Interest accrued for the window in cents (round half-up)" }

  - name: DividendDeclaration
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: policy_year, type: integer, source: input, description: "Policy year to which dividend applies (must equal current policy_year)" }
      - { name: declared_amount_cents, type: integer, source: input, description: "Dividend amount in cents before option application" }
      - { name: applied_amount_cents, type: integer, source: computed, description: "Amount actually applied (may differ if option is PAID_UP_ADDITIONS and face-addition exceeds remaining face)" }
      - { name: status, type: enum, source: system, description: "DECLARED | APPLIED | FORFEITED" }

  - name: NonforfeitureElection
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: election_type, type: enum, source: input, description: "CASH_SURRENDER | REDUCED_PAID_UP | EXTENDED_TERM" }
      - { name: effective_date, type: datetime, source: system, description: "Date election takes effect (the day the policy lapsed, or explicit surrender date)" }
      - { name: cash_value_at_election_cents, type: integer, source: computed, description: "Snapshot of cash value used in the calculation" }
      - { name: outstanding_loan_offset_cents, type: integer, source: computed, description: "Outstanding loan principal + accrued interest at election date (subtracted)" }
      - { name: surrender_charge_cents, type: integer, source: computed, description: "Surrender charge applied (UNIVERSAL_LIFE only; 0 for whole life)" }
      - { name: net_available_cents, type: integer, source: computed, description: "= cash_value_at_election - loan_offset - surrender_charge" }
      - { name: resulting_face_amount_cents, type: integer, source: computed, description: "For REDUCED_PAID_UP: new face; else 0" }
      - { name: resulting_term_months, type: integer, source: computed, description: "For EXTENDED_TERM: coverage months; else 0" }
      - { name: payout_cents, type: integer, source: computed, description: "For CASH_SURRENDER: payout = net_available; else 0" }

  - name: ReinstatementRequest
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: request_date, type: datetime, source: system, description: "Date reinstatement was requested" }
      - { name: back_premium_due_cents, type: integer, source: computed, description: "Sum of unpaid modal premiums since lapse + reinstatement interest at 6% annual" }
      - { name: back_premium_paid_cents, type: integer, source: computed, description: "Back premium actually received" }
      - { name: evidence_of_insurability, type: boolean, source: input, description: "Whether evidence of insurability was submitted" }
      - { name: underwriter_decision, type: enum, source: computed, description: "PENDING | APPROVED | DECLINED" }
      - { name: status, type: enum, source: system, description: "PENDING | EVIDENCE_REQUIRED | APPROVED | DECLINED" }

  - name: Rider
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: rider_type, type: enum, source: input, description: "WAIVER_OF_PREMIUM | ACCIDENTAL_DEATH_BENEFIT | TERM_CHILD | GUARANTEED_INSURABILITY" }
      - { name: rider_face_amount_cents, type: integer, source: input, description: "Rider-specific face (0 for WAIVER_OF_PREMIUM, GUARANTEED_INSURABILITY)" }
      - { name: rider_monthly_premium_cents, type: integer, source: computed, description: "Additional monthly premium for the rider" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED | EXERCISED" }

  - name: ConversionRequest
    parent: Policy
    common_fields: true
    fields:
      - { name: source_policy_id, type: string, source: system, description: "FK -> Policy.id; the TERM_CONVERTIBLE policy being converted" }
      - { name: target_product_template_id, type: string, source: input, description: "FK -> ProductTemplate.id; target permanent product (must not be TERM_CONVERTIBLE)" }
      - { name: requested_face_amount_cents, type: integer, source: input, description: "Face amount on the new policy (must be <= source face amount)" }
      - { name: attained_age_at_conversion, type: integer, source: computed, description: "Age of insured at conversion date" }
      - { name: new_policy_id, type: string, source: computed, description: "FK -> Policy.id; the newly issued policy, populated on approval" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DECLINED" }

  - name: CashValueLedgerEntry
    parent: Policy
    common_fields: false
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: entry_type, type: enum, source: system, description: "PREMIUM_CREDIT | COI_DEBIT | LOAN_DISBURSEMENT | LOAN_REPAYMENT_CREDIT | DIVIDEND_CREDIT | RIDER_PREMIUM_DEBIT | SURRENDER_DEBIT | MONTHLY_FEE_DEBIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents (positive = credit, negative = debit)" }
      - { name: posting_date, type: datetime, source: system, description: "Date the entry posts" }
      - { name: resulting_cash_value_cents, type: integer, source: computed, description: "Running balance of cash value after this entry" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PolicyApplication
    initial_state: SUBMITTED
    terminal_states: [DECLINED, ISSUED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /applications/{id}/begin-review
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: EVIDENCE_REQUIRED
        trigger: POST /applications/{id}/request-evidence
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: EVIDENCE_REQUIRED
        to: UNDER_REVIEW
        trigger: POST /applications/{id}/submit-evidence
        actor: Agent
        preconditions: []
        side_effects: []
        note: "Cycle: underwriter may request evidence multiple times"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /applications/{id}/approve
        actor: Underwriter
        preconditions:
          - "underwriting_class in request payload must be consistent with insured tobacco_user flag"
        side_effects:
          - "PolicyApplication.underwriting_class set from request"
          - "substandard_extra_pct_bps set: 0 for preferred/standard, 2500 for SUBSTANDARD_TABLE_B, 5000 for SUBSTANDARD_TABLE_D"

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: POST /applications/{id}/decline
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: ISSUED
        trigger: POST /applications/{id}/issue
        actor: PolicyIssuer
        preconditions:
          - "All first-cycle premium received (PremiumBillingCycle[1].status in {PAID, WAIVED})"
          - "ProductTemplate still valid"
        side_effects:
          - "Create Policy with form_status=IN_FORCE, premium_payment_status=CURRENT, paid_to_date = cycle[1].period_end_date, attained_age_at_issue computed"
          - "Initial CashValueLedgerEntry PREMIUM_CREDIT for first modal premium"
          - "policy_number assigned in issue sequence"
          - "Segregation of duties: issuer's X-User-ID must differ from the approving underwriter's X-User-ID (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"

  - entity: Policy
    initial_state: "{ premium_payment_status: CURRENT, form_status: IN_FORCE }"
    terminal_states: ["{ form_status: SURRENDERED }", "{ form_status: DEATH_CLAIMED }", "{ form_status: CONVERTED }"]
    note: "Two parallel state dimensions. premium_payment_status tracks billing posture; form_status tracks policy form."
    transitions:
      - from: "premium_payment_status=CURRENT"
        to: "premium_payment_status=GRACE"
        trigger: "system (automatic on clock advance when current PremiumBillingCycle passes due date unpaid)"
        actor: system
        preconditions:
          - "Current cycle status in {OPEN, PARTIALLY_PAID}"
          - "logical_clock.date > cycle.period_end_date"
        side_effects:
          - "Current cycle transitions to GRACE"
          - "grace_period_end_date = cycle.period_end_date + 31 days"

      - from: "premium_payment_status=GRACE"
        to: "premium_payment_status=CURRENT"
        trigger: POST /policies/{id}/premium-payments
        actor: Agent
        preconditions:
          - "Amount paid >= cycle.due_amount_cents - cycle.paid_amount_cents"
        side_effects:
          - "Cycle transitions GRACE → PAID"
          - "paid_to_date = cycle.period_end_date"
          - "CashValueLedgerEntry PREMIUM_CREDIT for payment amount"
          - "For UNIVERSAL_LIFE: CashValueLedgerEntry COI_DEBIT for the month's COI charge"

      - from: "premium_payment_status=GRACE"
        to: "premium_payment_status=LAPSED"
        trigger: "system (automatic when logical_clock.date > grace_period_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Cycle transitions GRACE → LAPSED"
          - "If product has non-forfeiture value (cash_value_cents > 0) AND no explicit NonforfeitureElection exists: auto-create NonforfeitureElection of type EXTENDED_TERM"
          - "Cascade: outstanding PolicyLoans marked FORECLOSED; outstanding principal + accrued interest folded into net_available calculation"
          - "Cascade: active Riders status → TERMINATED"

      - from: "premium_payment_status=LAPSED"
        to: "premium_payment_status=REINSTATED_PENDING"
        trigger: POST /policies/{id}/reinstatement-requests
        actor: Agent
        preconditions:
          - "form_status == IN_FORCE"
          - "logical_clock.date <= lapse_date + 5 years"
          - "no prior ReinstatementRequest with status in {PENDING, EVIDENCE_REQUIRED} on this policy"
        side_effects:
          - "ReinstatementRequest created with status=PENDING, back_premium_due_cents computed"

      - from: "premium_payment_status=REINSTATED_PENDING"
        to: "premium_payment_status=CURRENT"
        trigger: "system (when ReinstatementRequest underwriter_decision=APPROVED AND back_premium_paid_cents >= back_premium_due_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "ReinstatementRequest status → APPROVED"
          - "paid_to_date advanced by paid modal premiums"
          - "CashValueLedgerEntry PREMIUM_CREDIT for back premium"
          - "Policy.version increments"
          - "Cascade: previously terminated Riders with rider_type=WAIVER_OF_PREMIUM revert to ACTIVE if underwriter specified rider_reinstatement=true"

      - from: "form_status=IN_FORCE"
        to: "form_status=REDUCED_PAID_UP"
        trigger: POST /policies/{id}/nonforfeiture-elections (election_type=REDUCED_PAID_UP)
        actor: Policyholder
        preconditions:
          - "premium_payment_status in {CURRENT, GRACE, LAPSED}"
          - "cash_value_cents > 0"
          - "no prior approved NonforfeitureElection on this policy"
        side_effects:
          - "NonforfeitureElection persisted; resulting_face_amount_cents computed via reduced_paid_up_face_amount calculation"
          - "Policy.face_amount_cents updated to resulting_face_amount_cents"
          - "Policy.premium_payment_status → PAID_UP"
          - "Cascade: outstanding PolicyLoans → FORECLOSED"
          - "Cascade: active Riders → TERMINATED"
          - "Future PremiumBillingCycles WAIVED"

      - from: "form_status=IN_FORCE"
        to: "form_status=EXTENDED_TERM"
        trigger: "system (auto-created on lapse when cash value > 0) OR POST /policies/{id}/nonforfeiture-elections (election_type=EXTENDED_TERM)"
        actor: Policyholder
        preconditions:
          - "cash_value_cents > 0"
        side_effects:
          - "resulting_term_months computed via extended_term_duration calculation"
          - "premium_payment_status → PAID_UP"
          - "Cascade: outstanding PolicyLoans → FORECLOSED"
          - "Cascade: Riders → TERMINATED"

      - from: "form_status=IN_FORCE"
        to: "form_status=SURRENDERED"
        trigger: POST /policies/{id}/nonforfeiture-elections (election_type=CASH_SURRENDER)
        actor: Policyholder
        preconditions:
          - "cash_value_cents > 0"
        side_effects:
          - "payout_cents = net_available_cents"
          - "premium_payment_status → PAID_UP"
          - "Cascade: loans FORECLOSED; riders TERMINATED; cycles WAIVED"
          - "CashValueLedgerEntry SURRENDER_DEBIT zeroing cash_value_cents"

      - from: "form_status=IN_FORCE"
        to: "form_status=CONVERTED"
        trigger: POST /policies/{id}/conversion-requests/{cid}/approve
        actor: Underwriter
        preconditions:
          - "ProductTemplate.product_type == TERM_CONVERTIBLE"
          - "logical_clock.date <= issue_date + 5 years (conversion window)"
        side_effects:
          - "ConversionRequest status → APPROVED"
          - "New Policy created with form_status=IN_FORCE, attained_age_at_issue = attained_age_at_conversion, underwriting_class inherited from source"
          - "source policy form_status → CONVERTED"
          - "Cascade: source Riders → TERMINATED"

  - entity: PremiumBillingCycle
    initial_state: OPEN
    terminal_states: [PAID, LAPSED, WAIVED]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: POST /policies/{id}/premium-payments (amount < due_amount)
        actor: Agent
        preconditions: []
        side_effects:
          - "paid_amount_cents incremented"

      - from: OPEN
        to: PAID
        trigger: POST /policies/{id}/premium-payments (amount >= due_amount)
        actor: Agent
        preconditions: []
        side_effects:
          - "Policy.paid_to_date advanced"
          - "If policy in GRACE, transitions to CURRENT"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: POST /policies/{id}/premium-payments (cumulative paid >= due)
        actor: Agent
        preconditions: []
        side_effects: []

      - from: OPEN
        to: GRACE
        trigger: "system (clock advance past period_end_date with paid < due)"
        actor: system
        preconditions: []
        side_effects:
          - "Policy premium_payment_status → GRACE"

      - from: PARTIALLY_PAID
        to: GRACE
        trigger: "system (clock advance past period_end_date with paid < due)"
        actor: system
        preconditions: []
        side_effects:
          - "Policy premium_payment_status → GRACE"

      - from: GRACE
        to: LAPSED
        trigger: "system (clock advance past grace_period_end_date with paid < due)"
        actor: system
        preconditions: []
        side_effects:
          - "Policy premium_payment_status → LAPSED"
          - "Trigger non-forfeiture auto-election"

      - from: OPEN
        to: WAIVED
        trigger: "system (on REDUCED_PAID_UP / EXTENDED_TERM / SURRENDER / WAIVER_OF_PREMIUM exercise)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PolicyLoan
    initial_state: ACTIVE
    terminal_states: [REPAID, FORECLOSED]
    transitions:
      - from: ACTIVE
        to: REPAID
        trigger: POST /policies/{id}/loans/{loanId}/repayments
        actor: Agent
        preconditions:
          - "cumulative repayments >= outstanding_principal_cents + accrued_interest_cents"
        side_effects:
          - "Policy.outstanding_loan_principal_cents decremented by loan's outstanding principal"
          - "Policy.accrued_loan_interest_cents decremented by loan's accrued interest"
          - "CashValueLedgerEntry LOAN_REPAYMENT_CREDIT"

      - from: ACTIVE
        to: FORECLOSED
        trigger: "system (on lapse or non-forfeiture election)"
        actor: system
        preconditions: []
        side_effects:
          - "Outstanding principal + accrued interest netted against cash value in non-forfeiture calc"

  - entity: ReinstatementRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING
        to: EVIDENCE_REQUIRED
        trigger: POST /policies/{id}/reinstatement-requests/{rid}/request-evidence
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: EVIDENCE_REQUIRED
        to: PENDING
        trigger: POST /policies/{id}/reinstatement-requests/{rid}/submit-evidence
        actor: Agent
        preconditions: []
        side_effects:
          - "evidence_of_insurability = true"
        note: "Cycle allowed: underwriter may request further evidence multiple times"

      - from: PENDING
        to: APPROVED
        trigger: POST /policies/{id}/reinstatement-requests/{rid}/approve
        actor: Underwriter
        preconditions:
          - "evidence_of_insurability == true"
          - "back_premium_paid_cents >= back_premium_due_cents"
          - "Segregation: approver X-User-ID != requester X-User-ID"
        side_effects:
          - "Policy premium_payment_status → CURRENT"

      - from: PENDING
        to: DECLINED
        trigger: POST /policies/{id}/reinstatement-requests/{rid}/decline
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: ConversionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /policies/{id}/conversion-requests/{cid}/approve
        actor: Underwriter
        preconditions:
          - "source policy product_type == TERM_CONVERTIBLE"
          - "requested_face_amount_cents <= source.face_amount_cents"
          - "logical_clock.date <= source.issue_date + 5 years"
          - "target template must be active and not TERM_CONVERTIBLE"
          - "Segregation: approver != requester"
        side_effects:
          - "Create new Policy (form_status=IN_FORCE) with attained_age_at_issue = attained_age_at_conversion, underwriting_class inherited"
          - "new_policy_id populated"
          - "Source policy form_status → CONVERTED"

      - from: PENDING
        to: DECLINED
        trigger: POST /policies/{id}/conversion-requests/{cid}/decline
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: DividendDeclaration
    initial_state: DECLARED
    terminal_states: [APPLIED, FORFEITED]
    transitions:
      - from: DECLARED
        to: APPLIED
        trigger: "system (on declaration creation, applies according to Policy.dividend_option)"
        actor: system
        preconditions:
          - "Policy product is participating"
          - "Policy.form_status in {IN_FORCE, REDUCED_PAID_UP, EXTENDED_TERM}"
        side_effects:
          - "CASH: no cash-value impact; dividend paid out-of-band"
          - "PREMIUM_REDUCTION: CashValueLedgerEntry PREMIUM_CREDIT reduces next cycle due"
          - "ACCUMULATE_AT_INTEREST: CashValueLedgerEntry DIVIDEND_CREDIT; dividend_accumulation_cents incremented"
          - "PAID_UP_ADDITIONS: dividend_accumulation_cents incremented AND face_amount_cents incremented by paid-up-addition equivalent"

      - from: DECLARED
        to: FORFEITED
        trigger: "system (if policy lapses before dividend applies, or if dividend_option == CASH and policy form_status becomes SURRENDERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Rider
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXERCISED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /policies/{id}/riders/{rid}/terminate OR system cascade on lapse/non-forfeiture/conversion
        actor: Agent
        preconditions: []
        side_effects:
          - "CashValueLedgerEntry RIDER_PREMIUM_DEBIT refund of unused premium (pro-rated by days)"

      - from: ACTIVE
        to: EXERCISED
        trigger: POST /policies/{id}/riders/{rid}/exercise
        actor: Agent
        preconditions:
          - "rider_type in {WAIVER_OF_PREMIUM, GUARANTEED_INSURABILITY}"
          - "Policy premium_payment_status == CURRENT (waiver) or policy_year >= 3 (guaranteed insurability)"
        side_effects:
          - "For WAIVER_OF_PREMIUM: all current and future PremiumBillingCycles WAIVED while rider EXERCISED"
          - "For GUARANTEED_INSURABILITY: face_amount_cents increased by rider_face_amount_cents without underwriting"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: policy-mode-change-stale-version
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/mode-change"
    occ_field: "expected_policy_version"
    description: |
      Changing premium_mode on a Policy whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just modified the policy (e.g., recorded a payment that
      advanced paid_to_date, or recorded a dividend election) and the
      current writer's view of modal_premium_cents is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dividend-option-stale-version
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/dividend-option"
    occ_field: "expected_policy_version"
    description: |
      Updating dividend_option on a Policy whose version has advanced since
      the client last observed it is rejected. Captures the case where a
      DividendDeclaration has just been applied (which mutates
      dividend_accumulation_cents and Policy.version) between read and
      option change.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: modal_premium_at_issue
    trigger: "Policy issuance (POST /applications/{id}/issue)"
    algorithm: tiered_pricing
    formula: |
      base_per_thousand_cents = template.base_monthly_premium_rate_per_thousand_cents
      # Class multiplier
      class_mult = {
        PREFERRED_NON_TOBACCO: 0.90,
        STANDARD_NON_TOBACCO: 1.00,
        PREFERRED_TOBACCO: 1.50,
        STANDARD_TOBACCO: 1.80,
        SUBSTANDARD_TABLE_B: 2.00,
        SUBSTANDARD_TABLE_D: 2.50
      }[underwriting_class]
      # Mode discount
      mode_factor = { MONTHLY: 1.00, QUARTERLY: 2.94, SEMI_ANNUAL: 5.82, ANNUAL: 11.52 }[premium_mode]
      # Apply substandard extra on top of class multiplier
      extra_factor = 1 + substandard_extra_pct_bps / 10000
      # Per-month base (rounded half-up at this stage), then multiplied
      monthly_rate_cents = round_half_up(face_amount_cents / 1000_00 * base_per_thousand_cents * class_mult * extra_factor / 100)
      modal_premium_cents = round_half_up(monthly_rate_cents * mode_factor)
      # PINNED ROUNDING ORDER: round at monthly-rate stage FIRST, then multiply by mode_factor, then round again.
      # "round per month then multiply" differs from "multiply then round" by up to a few cents.
    input_set: "PolicyApplication (approved), ProductTemplate, InsuredPerson"
    constants:
      CLASS_MULT_PREFERRED_NT: 0.90
      CLASS_MULT_STANDARD_NT: 1.00
      CLASS_MULT_PREFERRED_T: 1.50
      CLASS_MULT_STANDARD_T: 1.80
      MODE_FACTOR_MONTHLY: 1.00
      MODE_FACTOR_QUARTERLY: 2.94
      MODE_FACTOR_SEMI_ANNUAL: 5.82
      MODE_FACTOR_ANNUAL: 11.52
    precision: "integer cents, round_half_up at each pinned stage"
    variants:
      - name: prospective_monthly_basis
        when: "default; class multiplier applied first, substandard extra applied second"
        difference: "monthly_rate rounded before mode multiplication"
      - name: annual_then_split
        when: "not used; documented only to pin evaluation order"
        difference: "would produce different cents — explicitly rejected"

  - name: monthly_coi_charge
    trigger: "Monthly on each UNIVERSAL_LIFE policy's cycle anniversary (system) and on any premium payment posting"
    algorithm: tiered_pricing
    formula: |
      # Net amount at risk
      net_amount_at_risk_cents = face_amount_cents - cash_value_cents
      if net_amount_at_risk_cents <= 0: coi_cents = 0
      else:
        # Attained age in years at this charge date
        attained_age = floor((charge_date - insured.date_of_birth).days / 365)
        # Lookup tiered rate from template.coi_rate_table: take the entry with the largest
        # attained_age_key <= attained_age. If attained_age exceeds all entries, use the highest entry.
        rate_per_thousand_cents = template.coi_rate_table[attained_age].monthly_rate_per_thousand_cents
        # Class multiplier (same table as modal_premium_at_issue)
        class_mult = <as above>
        # CoI rate applies to net amount at risk per $1000
        coi_cents = round_half_up(net_amount_at_risk_cents / 1000_00 * rate_per_thousand_cents * class_mult / 100)
      # Cash value ledger debit (entry is NEGATIVE amount)
      cash_value_change_cents = -coi_cents
    input_set: "Policy (UNIVERSAL_LIFE, form_status=IN_FORCE, premium_payment_status != PAID_UP), InsuredPerson, ProductTemplate"
    precision: "integer cents, round_half_up"
    variants:
      - name: end_of_month_deduction
        when: "default; charge computed on cash_value at start of cycle"
        difference: "uses cash_value_cents BEFORE this cycle's premium credit"
      - name: beginning_of_month_deduction
        when: "applies when Policy.metadata flag front_loaded_coi=true (configuration flag)"
        difference: "uses cash_value_cents AFTER this cycle's premium credit; yields smaller net_amount_at_risk → smaller charge"

  - name: policy_loan_interest_accrual
    trigger: "System on each loan anniversary AND on any repayment AND on policy lapse"
    algorithm: chronological
    formula: |
      # Process in time order from last_accrual_date to as_of_date, splitting at
      # each loan-anniversary boundary.
      cursor = loan.last_accrual_date
      total_new_interest_cents = 0
      while cursor < as_of_date:
        period_end = min(cursor + 1 year, as_of_date)
        days = (period_end - cursor).days
        # 365-day year, simple interest within the period
        period_interest = round_half_up(outstanding_principal_cents * annual_interest_rate_bps / 10000 * days / 365)
        total_new_interest_cents += period_interest
        # Capitalize at anniversary boundary (if capitalizing variant)
        if <capitalizing>:
          outstanding_principal_cents += period_interest
        else:
          accrued_interest_cents += period_interest
        cursor = period_end
      last_accrual_date = as_of_date
    input_set: "PolicyLoan (status=ACTIVE), system logical clock"
    constants:
      ANNUAL_INTEREST_RATE_BPS: 500
      DAYS_PER_YEAR: 365
    precision: "integer cents, round_half_up per period"
    variants:
      - name: non_capitalizing
        when: "default; interest accrues into accrued_interest_cents and is NOT added to principal"
        difference: "next period's interest computed on unchanged principal"
      - name: capitalizing
        when: "applies when product's template has metadata flag capitalize_loan_interest=true"
        difference: "at each anniversary the accrued interest is added to principal, so subsequent interest compounds"

  - name: reduced_paid_up_face_amount
    trigger: "POST /policies/{id}/nonforfeiture-elections with election_type=REDUCED_PAID_UP"
    algorithm: threshold
    formula: |
      # Inputs
      net_available_cents = cash_value_cents - outstanding_loan_principal_cents - accrued_loan_interest_cents - surrender_charge_cents
      # Net single premium per $1 of paid-up face at attained age — piecewise schedule
      attained_age = floor((effective_date - insured.date_of_birth).days / 365)
      # Net single premium rate schedule (cents per $1 of face):
      #   age < 40: 0.30; 40<=age<50: 0.40; 50<=age<60: 0.50; age>=60: 0.65
      if attained_age < 40: rate = 0.30
      elif attained_age < 50: rate = 0.40
      elif attained_age < 60: rate = 0.50
      else: rate = 0.65
      # Apply substandard extra (additive to rate)
      extra = substandard_extra_pct_bps / 10000 * 0.10   # 2500 bps => +0.025; 5000 bps => +0.050
      rate = rate + extra
      resulting_face_amount_cents = round_half_up(net_available_cents / rate)
      # Boundary: if net_available_cents <= 0, reject with ERR_INSUFFICIENT_CASH_VALUE
    input_set: "Policy (form_status=IN_FORCE), InsuredPerson, ProductTemplate"
    precision: "integer cents, round_half_up"

  - name: extended_term_duration
    trigger: "POST /policies/{id}/nonforfeiture-elections with election_type=EXTENDED_TERM, or system auto-election on lapse"
    algorithm: threshold
    formula: |
      net_available_cents = cash_value_cents - outstanding_loan_principal_cents - accrued_loan_interest_cents - surrender_charge_cents
      # Monthly term cost per $1 of face at attained age
      attained_age = floor((effective_date - insured.date_of_birth).days / 365)
      if attained_age < 40: monthly_cost_rate = 0.0010
      elif attained_age < 50: monthly_cost_rate = 0.0020
      elif attained_age < 60: monthly_cost_rate = 0.0040
      else: monthly_cost_rate = 0.0090
      # Monthly cost for the policy's current face amount
      monthly_cost_cents = round_half_up(face_amount_cents * monthly_cost_rate)
      # Duration
      resulting_term_months = floor(net_available_cents / monthly_cost_cents)
      # Cap at 60 months
      resulting_term_months = min(resulting_term_months, 60)
      # Boundary: if net_available_cents < monthly_cost_cents, reject with ERR_INSUFFICIENT_CASH_VALUE
    input_set: "Policy (form_status=IN_FORCE), InsuredPerson"
    precision: "integer cents and integer months, round_half_up for cost, floor for months"

  - name: cash_surrender_value
    trigger: "POST /policies/{id}/nonforfeiture-elections with election_type=CASH_SURRENDER"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: gross cash value -> subtract loan principal -> subtract accrued loan interest
      #            -> subtract surrender charge -> remainder is payout
      step1 = cash_value_cents
      step2 = step1 - outstanding_loan_principal_cents
      step3 = step2 - accrued_loan_interest_cents
      # Surrender charge schedule (UNIVERSAL_LIFE only; whole life has 0 charge)
      if template.product_type == UNIVERSAL_LIFE:
        # Find bracket: largest policy_year_min_inclusive <= policy_year
        pct_bps = template.surrender_charge_schedule[policy_year].surrender_charge_pct_bps
        surrender_charge_cents = round_half_up(cash_value_cents * pct_bps / 10000)
      else:
        surrender_charge_cents = 0
      payout_cents = step3 - surrender_charge_cents
      if payout_cents < 0: payout_cents = 0   # floor at zero
    input_set: "Policy (form_status=IN_FORCE), ProductTemplate"
    precision: "integer cents, round_half_up"

  - name: back_premium_due
    trigger: "POST /policies/{id}/reinstatement-requests (creation)"
    algorithm: chronological
    formula: |
      # Sum of unpaid modal premiums from lapse date forward to request_date,
      # plus reinstatement interest at 6% per annum on each unpaid premium from
      # its original due date to request_date.
      lapse_date = policy.paid_to_date   # last date through which premiums were paid
      n_periods_owed = number of modal periods between lapse_date and request_date (inclusive)
      total = 0
      for i in 0..(n_periods_owed-1):
        period_due_date = lapse_date + (i+1) * modal_period_length
        days_overdue = (request_date - period_due_date).days
        if days_overdue < 0: days_overdue = 0
        interest_cents = round_half_up(modal_premium_cents * 0.06 * days_overdue / 365)
        total += modal_premium_cents + interest_cents
      back_premium_due_cents = total
    input_set: "Policy (premium_payment_status=LAPSED)"
    constants:
      REINSTATEMENT_ANNUAL_RATE: 0.06
    precision: "integer cents, round_half_up per period"

  - name: grace_period_expiry_check
    trigger: "System on every clock advance"
    algorithm: threshold
    formula: |
      # For each policy in GRACE:
      if current_utc_date > grace_period_end_date:   # STRICT >  — lapse fires the day AFTER grace_period_end_date
        transition premium_payment_status GRACE -> LAPSED
        transition current cycle GRACE -> LAPSED
    input_set: "Policy (premium_payment_status=GRACE)"
    constants:
      GRACE_PERIOD_DAYS: 31
    note: "Boundary: if current_date == grace_period_end_date, policy REMAINS in GRACE (lapse fires only on the next day)."

  - name: dividend_payout
    trigger: "POST /policies/{id}/dividend-declarations"
    algorithm: weighted_scoring
    formula: |
      # Declared amount is provided; the applied_amount_cents differs by option:
      option = policy.dividend_option
      if option == CASH:
        applied = declared_amount_cents   # paid out-of-band, no ledger entry
      elif option == PREMIUM_REDUCTION:
        # Reduce next cycle's due_amount_cents; if declared > next_due, remainder carries
        next_due = next_open_cycle.due_amount_cents
        applied = min(declared_amount_cents, next_due)
        carry_over_cents = declared_amount_cents - applied   # recorded on the declaration
      elif option == ACCUMULATE_AT_INTEREST:
        applied = declared_amount_cents
        policy.dividend_accumulation_cents += applied
      elif option == PAID_UP_ADDITIONS:
        # Same conversion schedule as reduced_paid_up_face_amount
        attained_age = floor((current_date - insured.date_of_birth).days / 365)
        if attained_age < 40: rate = 0.30
        elif attained_age < 50: rate = 0.40
        elif attained_age < 60: rate = 0.50
        else: rate = 0.65
        extra = substandard_extra_pct_bps / 10000 * 0.10
        rate = rate + extra
        face_addition_cents = round_half_up(declared_amount_cents / rate)
        # Apply declared amount in full to dividend_accumulation
        applied = declared_amount_cents
        policy.dividend_accumulation_cents += applied
        policy.face_amount_cents += face_addition_cents
    input_set: "Policy (participating, form_status in {IN_FORCE, REDUCED_PAID_UP, EXTENDED_TERM})"
    precision: "integer cents, round_half_up"

  - name: paid_to_date_advance
    trigger: "Premium payment posting"
    algorithm: aggregation
    formula: |
      # Apply payment_amount_cents to the OLDEST unpaid cycle first (chronological).
      # Walk cycles in cycle_index ascending order; for each, if paid_amount < due_amount,
      # fill up to due_amount; move to next cycle with remainder.
      # Boundary: a payment exactly equal to the unpaid amount on the final cycle
      # leaves remainder = 0.
      # After allocation, paid_to_date = max(period_end_date) over cycles with status == PAID.
    input_set: "PremiumBillingCycle (status in {OPEN, PARTIALLY_PAID, GRACE})"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be allowed on this endpoint per RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids must exist (left-to-right: policyId, then cycleId/loanId/riderId/etc.)"
    error_id: "ERR_POLICY_NOT_FOUND / ERR_CYCLE_NOT_FOUND / ERR_LOAN_NOT_FOUND / ERR_RIDER_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_TEMPLATE_NOT_FOUND / ERR_REINSTATEMENT_NOT_FOUND / ERR_CONVERSION_NOT_FOUND / ERR_INSURED_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Target resource must be in a state that permits the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 5
    category: business_safety
    check: "Segregation of duties: issuer's X-User-ID must differ from the approving underwriter's X-User-ID (on issue); conversion/reinstatement approver's X-User-ID must differ from requester's X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /applications/{id}/issue, POST /policies/{id}/conversion-requests/{cid}/approve, POST /policies/{id}/reinstatement-requests/{rid}/approve"

  - priority: 6
    category: business_temporal
    check: "Clock-based windows: conversion within 5y of issue_date; reinstatement within 5y of lapse; evidence allowed only while EVIDENCE_REQUIRED"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /policies/{id}/conversion-requests, POST /policies/{id}/reinstatement-requests"

  - priority: 7
    category: business_referential
    check: "Referenced entities must be in a compatible state (target conversion product must exist and not be TERM_CONVERTIBLE; rider policy must be IN_FORCE)"
    error_id: ERR_INCOMPATIBLE_REFERENCE
    http_status: 422
    applies_to: "POST /policies/{id}/conversion-requests, POST /policies/{id}/riders"

  - priority: 8
    category: business_constraint
    check: "Field value constraints (premium_mode enum; face_amount within template min/max; loan amount > 0; rider_face_amount >= 0; declared_amount_cents > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT endpoints"

  - priority: 9
    category: business_constraint
    check: "Underwriting class consistency: PREFERRED_* / STANDARD_NON_TOBACCO require tobacco_user=false; *_TOBACCO require tobacco_user=true"
    error_id: ERR_CLASS_TOBACCO_MISMATCH
    http_status: 422
    applies_to: "POST /applications/{id}/approve"

  - priority: 10
    category: business_fiscal
    check: "Loan availability: requested_amount_cents <= cash_value_cents - outstanding_loan_principal_cents - accrued_loan_interest_cents"
    error_id: ERR_INSUFFICIENT_CASH_VALUE
    http_status: 402
    applies_to: "POST /policies/{id}/loans"

  - priority: 11
    category: business_fiscal
    check: "Non-forfeiture eligibility: cash_value_cents > 0 AND net_available_cents > 0"
    error_id: ERR_INSUFFICIENT_CASH_VALUE
    http_status: 402
    applies_to: "POST /policies/{id}/nonforfeiture-elections"

  - priority: 12
    category: business_fiscal
    check: "Reinstatement payment must cover back_premium_due_cents"
    error_id: ERR_INSUFFICIENT_PAYMENT
    http_status: 402
    applies_to: "POST /policies/{id}/reinstatement-requests/{rid}/payments"

  - priority: 13
    category: business_constraint
    check: "Optimistic concurrency: expected_policy_version must equal current Policy.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /policies/{id}/mode-change, POST /policies/{id}/dividend-option"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z. The logical clock is the ONLY source of time for state machines (grace expiry, lapse, conversion window, age calculations)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Run all auto-transitions triggered by clock advance (grace→lapse, cycle→grace, etc.)"]

  # --- InsuredPerson ---
  - method: POST
    path: "/insured-persons"
    description: "Create an insured person"
    roles: [Agent]
    code: 201
    input: [full_name, date_of_birth, tobacco_user, gender]
    output: InsuredPerson
    side_effects: []

  - method: GET
    path: "/insured-persons"
    description: "List insured persons"
    roles: [Agent, Underwriter, PolicyIssuer, Policyholder, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsuredPerson[]"
    side_effects: []

  - method: GET
    path: "/insured-persons/{id}"
    description: "Get one insured person"
    roles: [Agent, Underwriter, PolicyIssuer, Policyholder, PlatformAdmin]
    code: 200
    input: []
    output: InsuredPerson
    side_effects: []

  # --- ProductTemplate ---
  - method: POST
    path: "/product-templates"
    description: "Create a product template"
    roles: [PlatformAdmin]
    code: 201
    input: [product_code, product_type, participating, allows_policy_loans, min_face_amount_cents, max_face_amount_cents, base_monthly_premium_rate_per_thousand_cents, coi_rate_table, surrender_charge_schedule]
    output: ProductTemplate
    side_effects: []

  - method: GET
    path: "/product-templates"
    description: "List product templates"
    roles: [Agent, Underwriter, PolicyIssuer, Policyholder, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductTemplate[]"
