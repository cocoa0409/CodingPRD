          - errors[ERR_HOLD_NOT_RELEASABLE]
          - state_machines.Hold.terminal_states
        distinguishing_aspect: "COMPLETED is a terminal Hold state, so release must be refused with 409 - the credit already earned may not be reversed after the hold finished."
        test_recipe:
          setup:
            - "ACTIVE PRINT_DIGITAL subscription (cycle-1 invoice of 999 PAID) with a VACATION_DELIVERY hold over 2026-09-06..2026-09-13 that the HOLDS pass activated on 2026-09-06 and completed on 2026-09-14, so the hold is COMPLETED with credit_cents 450 and credit_applied false."
