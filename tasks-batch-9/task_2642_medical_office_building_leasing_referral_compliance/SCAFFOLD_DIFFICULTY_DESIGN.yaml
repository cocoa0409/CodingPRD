              as: PropertyManager
          assert:
            - "Commencing the 3000 sf radiology lease returns 409 ERR_EXCLUSIVE_USE_CONFLICT (only rule 23 is violated)"
            - "Commencing the imaging lease violates rule 19 and rule 23 together and returns 422 ERR_SHIELDING_CERTIFICATION_MISSING, not ERR_EXCLUSIVE_USE_CONFLICT"
            - "Lease.${l10w_id}.status == EXECUTED and Lease.${l10y_id}.status == EXECUTED — both rejections left the leases unchanged"
            - "Suite.${s10y_id}.occupancy_status == RESERVED and shielding_certified == false"
            - "Lease.${l10z_id}.status == EXECUTED with exclusive_use_specialty RADIOLOGY"

      - name: mix_frozen_state_outranks_rent_above_ceiling_fiscal_at_certify
        grounds:
          - validations[16]
          - validations[42]
          - errors.ERR_BUILDING_MIX_FROZEN
          - errors.ERR_RENT_ABOVE_FMV_CEILING
          - endpoints[POST /buildings/{id}/mix-freeze]
          - endpoints[POST /leases/{id}/certify-fmv]
        distinguishing_aspect: |
          A different error-category pair (state @16 / 409 versus business_fiscal
          @42 / 422) on a different endpoint — while the building's mix is frozen,
          certifying a lease priced at 36.00 psf against a 34.50 ceiling returns
          409 ERR_BUILDING_MIX_FROZEN even though the rent is also above fair
          market value; lifting the freeze and repeating the identical request
          then surfaces the 422 ERR_RENT_ABOVE_FMV_CEILING that was hiding
          underneath.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a 5000 sf STANDARD_EXAM suite, so the published band is [24.00, 34.50]."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant on a DIRECT lease priced at 36.00 psf, moved to PENDING_FMV_REVIEW before the freeze is applied."
            - "The building's tenant_mix_posture forced to FROZEN by a compliance-officer mix freeze."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b11_id: $.data.id }
            - call: "POST /buildings/${b11_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s11_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567951" }
              as: PortfolioAdmin
              captures: { t11_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b11_id}", suite_id: "${s11_id}", tenant_id: "${t11_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 36.00 }
              as: LeasingAgent
              captures: { l11_id: $.data.id }
            - call: "POST /leases/${l11_id}/submit-fmv-review"
              payload: { submission_note: "Aggressive ask, needs certification" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /buildings/${b11_id}/mix-freeze"
              payload: { frozen: true, reason: "Portfolio-wide referral compliance audit in progress" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /leases/${l11_id}/certify-fmv"
              payload: { certification_note: "Attempt during the freeze" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /buildings/${b11_id}/mix-freeze"
              payload: { frozen: false, reason: "Audit closed" }
              as: ComplianceOfficer
            - call: "POST /leases/${l11_id}/certify-fmv"
              payload: { certification_note: "Identical request after the freeze is lifted" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          assert:
            - "While frozen, certify-fmv returns 409 ERR_BUILDING_MIX_FROZEN"
            - "Building.${b11_id}.tenant_mix_posture == FROZEN and mix_freeze_override == true while the freeze is on"
            - "After the freeze is lifted, Building.${b11_id}.mix_freeze_override == false and tenant_mix_posture == BALANCED (anchor_share_pct 0.0000 with nothing leased)"
            - "The identical certify-fmv then returns 422 ERR_RENT_ABOVE_FMV_CEILING"
            - "Lease.${l11_id}.status == PENDING_FMV_REVIEW throughout and certified_base_rent_annual remains null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: rent_exactly_at_fmv_ceiling_accepted_one_cent_above_rejected
        grounds:
          - validations[42]
          - calculations.suite_fmv_band
          - calculations.effective_base_rent_annual
          - entities.Lease.fields.fmv_variance_pct
          - endpoints[POST /leases/{id}/certify-fmv]
        distinguishing_aspect: |
          METRIC: a money-per-square-foot threshold, tested at the exact boundary
          and one cent past it on POST /leases/{id}/certify-fmv. 34.50 psf equals
          certified_fmv_ceiling_psf and is accepted, and its fmv_variance_pct lands
          on exactly 0.1500 — which is NOT greater than the 0.15 deviation gate, so
          zero FMV_DEVIATION cases open; 34.51 psf is rejected with 422. An
          implementation using < instead of <=, or >= instead of > on the deviation
          gate, fails one of the two halves.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a 5000 sf STANDARD_EXAM suite, so the published band is [24.00, 34.50] and the provisional annual rent is 150000.00."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant holding two DRAFT DIRECT leases on that same suite, one at 34.50 psf and one at 34.51 psf, both submitted to PENDING_FMV_REVIEW (the suite-conflict and availability rules only bite at execution, so both may be certified)."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b12_id: $.data.id }
            - call: "POST /buildings/${b12_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s12_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234567961" }
              as: PortfolioAdmin
              captures: { t12_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b12_id}", suite_id: "${s12_id}", tenant_id: "${t12_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 34.50 }
              as: LeasingAgent
              captures: { l12at_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b12_id}", suite_id: "${s12_id}", tenant_id: "${t12_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 34.51 }
              as: LeasingAgent
              captures: { l12over_id: $.data.id }
            - call: "POST /leases/${l12at_id}/submit-fmv-review"
              payload: { submission_note: "Exactly at the published ceiling" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l12over_id}/submit-fmv-review"
              payload: { submission_note: "One cent over the published ceiling" }
              as: LeasingAgent
              as_user_id: "agent-001"
          trigger:
            - call: "POST /leases/${l12at_id}/certify-fmv"
              payload: { certification_note: "34.50 == ceiling" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "GET /tenants/${t12_id}/compliance-cases"
              payload: { case_type: "FMV_DEVIATION" }
              as: ComplianceOfficer
            - call: "POST /leases/${l12over_id}/certify-fmv"
              payload: { certification_note: "34.51 > ceiling" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          assert:
            - "certify-fmv on the 34.50 lease returns 200 with status FMV_CERTIFIED, certified_fmv_ceiling_psf 34.50, certified_base_rent_annual 172500.00, provisional_base_rent_annual 150000.00, fmv_variance_annual 22500.00 and fmv_variance_pct exactly 0.1500"
            - "GET /tenants/${t12_id}/compliance-cases?case_type=FMV_DEVIATION returns meta.total_count == 0, because 0.1500 is not greater than the 0.15 gate"
            - "certify-fmv on the 34.51 lease returns 422 ERR_RENT_ABOVE_FMV_CEILING"
            - "Lease.${l12over_id}.status == PENDING_FMV_REVIEW with certified_base_rent_annual null"

      - name: zero_qualified_appraisals_blocks_fmv_review_submission
        grounds:
          - validations[40]
          - errors.ERR_NO_QUALIFYING_APPRAISAL
          - endpoints[POST /leases/{id}/submit-fmv-review]
          - endpoints[GET /leases/{id}/appraisals]
          - state_machines.Appraisal
        distinguishing_aspect: |
          A DIFFERENT metric and a DIFFERENT endpoint from the money boundary
          above: this is the empty-collection edge — the count of QUALIFIED
          appraisals on a physician-owned tenant's lease is zero even though one
          SUBMITTED appraisal exists, so POST /leases/{id}/submit-fmv-review
          returns 422 and GET /leases/{id}/appraisals?status=QUALIFIED returns
          total_count 0 with an empty data array. Qualifying that single appraisal
          takes the count from 0 to 1 and the identical submission then succeeds.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a 5000 sf STANDARD_EXAM suite."
            - "One PHYSICIAN-OWNED INDEPENDENT_PRACTICE tenant on a DRAFT DIRECT lease at 32.00 psf."
            - "Exactly one Appraisal on that lease left in status SUBMITTED — never decided — so the qualified set is empty."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
