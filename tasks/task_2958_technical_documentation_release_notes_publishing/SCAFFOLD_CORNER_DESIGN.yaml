              as_user_id: "${w_id}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /terminology-terms/${term_login}/retire"
              payload: {}
              as: DocsLead
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w_id}"
              captures: { err2: "$.data.error_id" }
          assert:
            - "${err1} == ERR_DOC_FREEZE_POSTURE_BLOCKED with HTTP 409 — priority 25 pre-empts the terminology check at priority 28"
            - "${err1} is NOT ERR_TERMINOLOGY_BLOCKER_PRESENT even though open_blocker_violations == 1 at that moment"
            - "${err2} == ERR_DOC_FREEZE_POSTURE_BLOCKED as well: with open_blocker_violations now 0, the surviving rejection proves the posture check was the deciding one"
