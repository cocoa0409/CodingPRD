      - name: corner_posture_frozen_blocks_budget_consuming_writes
        claim_type: violation_to_error
        grounds:
          - validations.priority_14
          - errors.ERR_PROGRAM_POSTURE_FROZEN
        excluded_because:
          difficulty_instance: validation_precedence / posture_frozen_outranks_incentive_budget_exceeded_on_reschedule
          rationale: "The named §1.8 instance triggers the FROZEN posture and asserts ERR_PROGRAM_POSTURE_FROZEN on a reschedule that also breaches the budget."

      - name: corner_incentive_budget_exceeded_on_scheduling
        claim_type: violation_to_error
        grounds:
          - validations.priority_33
          - errors.ERR_INCENTIVE_BUDGET_EXCEEDED
        excluded_because:
          difficulty_instance: validation_precedence / posture_frozen_outranks_incentive_budget_exceeded_on_reschedule
          rationale: "The same §1.8 instance establishes the budget breach in its setup and asserts that the lower-priority ERR_INCENTIVE_BUDGET_EXCEEDED is the code returned once the posture is thawed."

      - name: corner_consent_not_granted_blocks_scheduling
        claim_type: violation_to_error
        grounds:
          - validations.priority_18
          - errors.ERR_CONSENT_NOT_GRANTED
        excluded_because:
          difficulty_instance: validation_precedence / consent_gate_outranks_contact_cooling_off_window_on_scheduling
          rationale: "The named §1.8 instance violates consent and the cooling-off window simultaneously and asserts ERR_CONSENT_NOT_GRANTED."

      - name: corner_contact_cooling_off_window_blocks_scheduling
        claim_type: temporal_validation
        grounds:
          - validations.priority_19
          - errors.ERR_CONTACT_COOLING_OFF_ACTIVE
        excluded_because:
          difficulty_instance: temporal_window_boundary / buyer_person_cooling_off_uses_closed_ninety_day_window_across_deals
          rationale: "The named §1.8 instance tests day 90 and day 91 for the same buyer person across two different deals."

      - name: corner_analyst_slot_conflict_blocks_scheduling
        claim_type: temporal_validation
        grounds:
          - validations.priority_20
          - errors.ERR_ANALYST_SLOT_CONFLICT
        excluded_because:
          difficulty_instance: temporal_window_boundary / analyst_slot_conflict_uses_buffered_half_open_intervals
          rationale: "The named §1.8 instance tests the buffered interval at exactly the buffer edge and one minute inside it."

      - name: corner_unsubstantiated_claim_blocks_legal_submission
        claim_type: violation_to_error
        grounds:
          - validations.priority_31
          - errors.ERR_CLAIM_UNSUBSTANTIATED
        excluded_because:
          difficulty_instance: boundary_precision_check / substantiation_exactly_at_anecdotal_min_passes_while_one_cent_below_fails
          rationale: "The named §1.8 instance drives the substantiation score just below ANECDOTAL_MIN and asserts ERR_CLAIM_UNSUBSTANTIATED on submission."

      - name: corner_risk_ceiling_blocks_publication
        claim_type: violation_to_error
        grounds:
          - validations.priority_32
          - errors.ERR_RISK_CEILING_EXCEEDED
        excluded_because:
          difficulty_instance: combinatorial_formula / risk_index_applies_discount_before_conditional_surcharge_and_blocks_publish
          rationale: "The named §1.8 instance lands risk_index_final at 2.25 above the 2.20 ceiling and asserts the publish refusal."

  # ---------------------------------------------------------------------------
  # SECTION: endpoints  (guide "From Table 5 (Endpoints)")
  # One instance per endpoint pattern row. Every declared side_effect of the
  # endpoints exercised here is asserted: the draw side effects (frame counters,
  # deal stratum/score/status), the PATCH /deals recompute of linked ProductGap
  # scores and Competitor.win_rate_vs, the sweep skip semantics, and the promote
  # write of roadmap_epic_ref.
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:

      - name: competitor_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST /competitors
          - endpoints.GET /competitors/{competitor_id}
          - endpoints.GET /programs/{program_id}/competitors
        distinguishing_aspect: "The created row must come back identically from the singular GET and appear exactly once in the program-scoped list, with total_count 2 and has_more false across the two competitors and the tier filter narrowing the list to one."
        test_recipe:
          setup: ["an ACTIVE program with two competitors, Northwind (PRIMARY) and Initech (SECONDARY)"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /competitors
              payload: { program_id: "${p_id}", name: "Northwind", tier: "PRIMARY" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { c1_id: $.data.id }
            - call: POST /competitors
              payload: { program_id: "${p_id}", name: "Initech", tier: "SECONDARY" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { c2_id: $.data.id }
          trigger:
            - call: GET /programs/${p_id}/competitors
              payload: { tier: "PRIMARY" }
              as: EnablementManager
              as_user_id: enable-1
          assert:
            - "HTTP 200"
            - "data is an array of length 1"
            - "data[0].id == ${c1_id}"
            - "data[0].name == \"Northwind\""
            - "data[0].tier == \"PRIMARY\""
            - "total_count == 1 and has_more == false"
            - "GET /competitors/${c1_id} returns name == \"Northwind\", tier == \"PRIMARY\", status == \"ACTIVE\", ratified_loss_count == 0, version == 1"
            - "GET /programs/${p_id}/competitors without a tier filter returns total_count == 2"

