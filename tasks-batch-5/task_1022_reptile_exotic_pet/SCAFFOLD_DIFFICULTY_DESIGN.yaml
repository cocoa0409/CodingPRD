              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: VetTech
            - call: "POST /expos"
              payload: { name: "Expo A", venue: "Hall 1", start_at: "2026-07-10T00:00:00Z", end_at: "2026-07-12T00:00:00Z", venue_capacity: 10 }
              as: StoreManager
              captures: { ex_a: $.data.id }
            - call: "POST /expos"
              payload: { name: "Expo B", venue: "Hall 2", start_at: "2026-07-11T00:00:00Z", end_at: "2026-07-13T00:00:00Z", venue_capacity: 10 }
              as: StoreManager
              captures: { ex_b: $.data.id }
            - call: "POST /expos"
              payload: { name: "Expo C", venue: "Hall 3", start_at: "2026-07-12T00:00:00Z", end_at: "2026-07-14T00:00:00Z", venue_capacity: 10 }
              as: StoreManager
              captures: { ex_c: $.data.id }
            - call: "POST /expos/${ex_a}/assignments"
              payload: { animal_id: "${an_id}" }
              as: SalesAssociate
          trigger:
            - call: "POST /expos/${ex_b}/assignments"
              payload: { animal_id: "${an_id}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
            - call: "POST /expos/${ex_c}/assignments"
              payload: { animal_id: "${an_id}" }
              as: SalesAssociate
              captures: { asg_c: $.data.id }
          assert:
            - "response.data.error_id == ERR_EXPO_OVERLAP"
            - "ExpoAssignment.${asg_c}.status == ASSIGNED"

      - name: habitat_install_buffer_conflict
        grounds:
          - validations[priority=53]
          - errors[ERR_INSTALL_BUFFER_CONFLICT]
          - entities.HabitatBuild.fields.installer_id
        distinguishing_aspect: "Install scheduling uses buffer semantics on the installer resource: two builds on installer INST-X whose windows are only 30 minutes apart (11:00 end vs 11:30 start) are rejected by the 60-minute INSTALL_BUFFER even though the windows do not overlap — different interval semantics (buffer) and resource (installer) than the half-open expo rule."
        test_recipe:
          setup:
            - "Two IN_PROGRESS HabitatBuilds; build1 install scheduled on installer INST-X 2026-07-10 09:00-11:00."
