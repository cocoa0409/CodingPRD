# === CORNER PART E MARKER ===

  # ===========================================================================
  - section: rbac
    instances:
      - name: c_proctor_cannot_create_window
        claim_type: Role Denial
        grounds:
          - roles.Proctor
          - endpoints.POST_/charter/exam-windows
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Proctor is not in the window-creation roles; even a fully valid payload is 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Clock 2027-01-05. LEVEL_I exists."
          setup_api_calls:
            - *c_clock
            - *c_level1
          trigger:
            - call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-03-01T00:00:00Z", window_closes_at: "2027-03-15T00:00:00Z", scheduling_deadline_at: "2027-02-20T00:00:00Z", reschedule_deadline_at: "2027-03-08T00:00:00Z", early_fee_deadline_at: "2027-01-31T00:00:00Z" }
              as: Proctor
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "GET /charter/exam-windows?exam_level_id=${lvl1} returns 0 rows"

      - name: c_candidate_cannot_review_submissions
        claim_type: Role Denial
        grounds:
          - roles.ExperienceReviewer
          - endpoints.POST_/charter/experience-submissions/{submissionId}/review
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Review is exclusive to ExperienceReviewer: the submission's own candidate gets 403 ERR_FORBIDDEN_ROLE, not a state error — role (priority 2) precedes ownership and state."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A with a SUBMITTED submission (two references attached)."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_sub_a
            - *c_ref1
            - *c_ref2
            - *c_submit_a
          trigger:
            - call: "POST /charter/experience-submissions/${sub_a}/review"
              payload: { decision: "APPROVED" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "WorkExperienceSubmission.${sub_a}.status still == SUBMITTED"

      - name: c_candidate_cannot_pay_others_enrollment
        claim_type: Role Denial
        grounds:
          - roles.Candidate (entity_backed ownership)
          - endpoints.POST_/charter/program-enrollments/{enrollmentId}/payments
          - errors.ERR_OWNERSHIP_MISMATCH
        distinguishing_aspect: "Candidate is role-permitted on payments but entity-backed ownership restricts the target: candidate B paying A's enrollment is 403 ERR_OWNERSHIP_MISMATCH while the same call by A succeeds."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates A and B exist; A has a PENDING_PAYMENT enrollment."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_cand_b
            - *c_enroll_a
          trigger:
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 35003 }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 35003 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { pay_ok: $.data.status }
          assert:
            - "B's payment is 403 ERR_OWNERSHIP_MISMATCH"
            - "A's own payment succeeds and pay_ok == ENROLLED"

      - name: c_reference_respond_with_wrong_user_id
        claim_type: Role Denial
        grounds:
          - roles.ReferenceProvider
          - endpoints.POST_/charter/references/{referenceId}/respond
          - errors.ERR_OWNERSHIP_MISMATCH
        distinguishing_aspect: "ReferenceProvider identity is entity-backed: responding to ref1 while presenting ref2's id is 403 ERR_OWNERSHIP_MISMATCH — a candidate can never verify their own references because the reference id, not the candidate id, must be presented."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A; submission with two PENDING references ref1 and ref2."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_sub_a
            - *c_ref1
            - *c_ref2
          trigger:
            - call: "POST /charter/references/${ref1}/respond"
              payload: { decision: "VERIFIED" }
              as: ReferenceProvider
              as_user_id: "${ref2}"
              captures: { err: $.data.error_id }
            - call: "POST /charter/references/${ref1}/respond"
              payload: { decision: "VERIFIED" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err2: $.data.error_id }
          assert:
            - "responding as a different reference id is 403 ERR_OWNERSHIP_MISMATCH"
            - "responding as the candidate (wrong role) is 403 ERR_FORBIDDEN_ROLE — the candidate cannot self-verify via either door"
            - "GET /charter/references?experience_submission_id=${sub_a} shows both still PENDING"

      - name: c_candidate_cannot_open_cases
        claim_type: Role Denial
        grounds:
          - roles.ConductInvestigator
          - endpoints.POST_/charter/misconduct-cases
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Case opening is restricted to ConductInvestigator and Proctor: a Candidate (even reporting themselves) is 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A exists."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "Self report" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "GET /charter/misconduct-cases?candidate_id=${cand_a} returns 0 rows"

      - name: c_segregation_of_duties_blocks_investigator_adjudicating
        claim_type: Role Denial
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.MisconductCase.OPENED_to_SANCTIONED
          - roles.ConductInvestigator
          - roles.ConductAdjudicator
        distinguishing_aspect: "Segregation of duties is tracked by X-User-ID: the adjudicator whose id equals the case's investigator_user_id is 403 ERR_SEGREGATION_OF_DUTIES, while a different adjudicator id on the same case succeeds."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A; external-report case opened by inv-1 (version 1)."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "Credential misrepresentation" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { case_s: $.data.id, case_s_v: $.data.version }
          trigger:
            - call: "POST /charter/misconduct-cases/${case_s}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "WARNING", expected_case_version: "${case_s_v}" }
              as: ConductAdjudicator
              as_user_id: "inv-1"
              captures: { err: $.data.error_id }
            - call: "POST /charter/misconduct-cases/${case_s}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "WARNING", expected_case_version: "${case_s_v}" }
              as: ConductAdjudicator
              as_user_id: "adj-2"
              captures: { case_s_st: $.data.status }
          assert:
            - "adjudication by user inv-1 (the case's investigator) is 403 ERR_SEGREGATION_OF_DUTIES"
            - "the same call by adj-2 succeeds: case_s_st == SANCTIONED"
            - "the SoD rejection left the case OPENED at version 1 (no partial write)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: c_occ_reschedule_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-reschedule-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After a committed reschedule bumps the appointment to version 2, a second reschedule still carrying expected_appointment_version 1 is 412 ERR_STALE_VERSION — and it fires before the fiscal gate even though the first reschedule left a 25000 balance."
        test_recipe:
          setup:
            - "Clock 2027-01-05. A ENROLLED; appointment booked for 2027-03-03 (version 1), exam fee paid."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - *c_pay_fee_a
          trigger:
            - call: "POST /charter/appointments/${appt_a}/reschedule"
              payload: { exam_date: "2027-03-12", expected_appointment_version: "${appt_a_v}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_v2: $.data.version }
            - call: "POST /charter/appointments/${appt_a}/reschedule"
              payload: { exam_date: "2027-03-13", expected_appointment_version: "${appt_a_v}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the first reschedule succeeds: appt_v2 == 2 and fee 25000 charged (57 days before exam, not late)"
            - "the second reschedule with the stale version is 412 ERR_STALE_VERSION (not ERR_OUTSTANDING_BALANCE, although outstanding is 25000 — OCC priority 7 precedes fiscal priority 13)"
            - "ExamAppointment.${appt_a}.version == 2, exam_date == \"2027-03-12\", reschedule_count == 1"

      - name: c_occ_amend_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[submission-amend-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After a committed amend returns the submission to DRAFT at version 4, replaying the amend with the pre-amend version 3 is 412 ERR_STALE_VERSION — the OCC check fires before the state gate that would otherwise reject amending a DRAFT."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A; submission submitted then RETURNED_FOR_REVISION (version 3)."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_sub_a
            - *c_ref1
            - *c_ref2
            - *c_submit_a
            - call: "POST /charter/experience-submissions/${sub_a}/review"
              payload: { decision: "RETURNED_FOR_REVISION" }
              as: ExperienceReviewer
              captures: { sub_a_v3: $.data.version }
          trigger:
            - call: "POST /charter/experience-submissions/${sub_a}/amend"
              payload: { segments: [ { employer_name: "Alpha Asset Management", role_title: "Analyst", start_date: "2023-01-05", end_date: "2024-07-05", qualifying_activity_pct: 80, hours: 3200 } ], expected_submission_version: "${sub_a_v3}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_v4: $.data.version }
            - call: "POST /charter/experience-submissions/${sub_a}/amend"
              payload: { segments: [ { employer_name: "Other", role_title: "Analyst", start_date: "2023-01-05", end_date: "2024-01-05", qualifying_activity_pct: 80, hours: 2100 } ], expected_submission_version: "${sub_a_v3}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the first amend succeeds: sub_v4 == 4 and status DRAFT"
            - "the replayed amend with stale version 3 is 412 ERR_STALE_VERSION (not ERR_SUBMISSION_NOT_EDITABLE — OCC priority 7 precedes state priority 8)"
            - "WorkExperienceSubmission.${sub_a}.segments still describe the 2023-01-05..2024-07-05 version"

      - name: c_occ_adjudicate_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-adjudicate-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After sanction (v2) and appeal (v3) advanced the case, an adjudication carrying the original version 1 is 412 ERR_STALE_VERSION even though APPEALED is a legal from-state and the SoD check would pass."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A; case opened by inv-1 (v1), SANCTIONED WARNING by adj-1 (v2), appealed by the candidate (v3)."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "External report" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { case_o: $.data.id, case_o_v1: $.data.version }
            - call: "POST /charter/misconduct-cases/${case_o}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "WARNING", expected_case_version: "${case_o_v1}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
            - call: "POST /charter/misconduct-cases/${case_o}/appeal"
              payload: { appeal_reason: "Disproportionate" }
              as: Candidate
              as_user_id: "${cand_a}"
          trigger:
            - call: "POST /charter/misconduct-cases/${case_o}/adjudicate"
              payload: { outcome: "DISMISSED", expected_case_version: "${case_o_v1}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "GET /charter/misconduct-cases?candidate_id=${cand_a} shows the case still APPEALED at version 3"

      - name: c_pcs_disclosure_auto_opens_case
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/charter/candidates/{candidateId}/conduct-statements
          - entities.Candidate.fields.conduct_statements
          - entities.MisconductCase.fields.origin
        distinguishing_aspect: "Filing a statement with has_disclosures=true creates a MisconductCase as a side effect — origin CONDUCT_STATEMENT, status OPENED, investigator_user_id null — while a clean statement creates nothing."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A exists."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "POST /charter/candidates/${cand_a}/conduct-statements"
              payload: { disclosure_year: 2026, has_disclosures: false }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/candidates/${cand_a}/conduct-statements"
              payload: { disclosure_year: 2027, has_disclosures: true, disclosure_text: "Regulatory inquiry disclosed" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "GET /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { case_list_origin: "$.data[0].origin", case_list_status: "$.data[0].status", case_list_inv: "$.data[0].investigator_user_id" }
          assert:
            - "both statements are created 201 (different disclosure years)"
            - "exactly 1 case exists for the candidate: case_list_origin == CONDUCT_STATEMENT, case_list_status == OPENED, case_list_inv is null (auto-opened, no investigator)"
            - "the clean 2026 statement opened no case"

      - name: c_curriculum_supersede_archives_prior_and_rejects_duplicate_year
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CurriculumCycle.PUBLISHED_to_ARCHIVED
          - endpoints.POST_/charter/exam-levels/{levelId}/curriculum-cycles
          - errors.ERR_DUPLICATE_CURRICULUM_YEAR
        distinguishing_aspect: "Publishing the 2028 cycle for LEVEL_I auto-archives the 2027 cycle (at most one PUBLISHED cycle per level), and a second 2028 cycle is 409 ERR_DUPLICATE_CURRICULUM_YEAR."
        test_recipe:
          setup:
            - "Clock 2027-01-05. LEVEL_I exists with a PUBLISHED 2027 cycle."
          setup_api_calls:
            - *c_clock
            - *c_level1
            - *c_cyc_l1
          trigger:
            - call: "POST /charter/exam-levels/${lvl1}/curriculum-cycles"
              payload: { cycle_year: 2028, effective_from: "2028-01-01T00:00:00Z", effective_to: "2029-01-01T00:00:00Z", content_version: "L1-2028" }
              as: ProgramAdmin
              captures: { cyc_28: $.data.id, cyc_28_st: $.data.status }
            - call: "POST /charter/exam-levels/${lvl1}/curriculum-cycles"
              payload: { cycle_year: 2028, effective_from: "2028-01-01T00:00:00Z", effective_to: "2029-01-01T00:00:00Z", content_version: "L1-2028-bis" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /charter/curriculum-cycles"
              payload: { exam_level_id: "${lvl1}" }
              as: ProgramAdmin
          assert:
            - "cyc_28_st == PUBLISHED"
            - "the second 2028 cycle is 409 ERR_DUPLICATE_CURRICULUM_YEAR"
            - "GET /charter/curriculum-cycles?exam_level_id=${lvl1} returns 2 rows: the 2027 cycle ARCHIVED and the 2028 cycle PUBLISHED (annual content update supersedes)"

      - name: c_charter_revocation_terminates_memberships
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MisconductCase.OPENED_to_SANCTIONED
          - state_machines.SocietyMembership.ACTIVE_to_TERMINATED
          - entities.Candidate.fields.conduct_revoked
          - errors.ERR_INVALID_MEMBERSHIP_STATE
        distinguishing_aspect: "A CHARTER_REVOCATION sanction cascades to every ACTIVE membership (TERMINATED), clears charter_awarded and sets conduct_revoked; the terminated membership then refuses renewal with 409 ERR_INVALID_MEMBERSHIP_STATE."
        test_recipe:
          setup:
            - "Candidate A is a charterholder (all gates satisfied as in c_wrong_dues_amount_rejected) and an ACTIVE NYSSA-EX member. Clock 2027-08-17."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_level2
            - *c_level3
            - *c_win1
            - *c_win2
            - *c_win3
            - *c_ctr2
            - *c_book_a
            - *c_pay_fee_a
            - *c_clock_mar03
            - *c_checkin_a
            - *c_attempt_a
            - *c_clock_mar16
            - *c_score_a_700
            - *c_book_a2
            - *c_pay_fee_a2
            - *c_clock_may05
            - *c_checkin_a2
            - *c_attempt_a2
            - *c_clock_may18
            - *c_score_a_720
            - *c_book_a3
            - *c_pay_fee_a3
            - *c_clock_aug04
            - *c_checkin_a3
            - *c_attempt_a3
            - *c_clock_aug17
            - *c_score_a_740
            - call: "POST /charter/candidates/${cand_a}/experience-submissions"
              payload: { segments: [ { employer_name: "Alpha Asset Management", role_title: "Analyst", start_date: "2022-01-10", end_date: "2024-01-10", qualifying_activity_pct: 80, hours: 4200 }, { employer_name: "Beta Capital", role_title: "Senior Analyst", start_date: "2023-07-10", end_date: "2025-06-10", qualifying_activity_pct: 60, hours: 4000 } ] }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_r: $.data.id }
            - call: "POST /charter/experience-submissions/${sub_r}/references"
              payload: { referee_name: "Ref One", referee_email: "ref1@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { refr1: $.data.id }
            - call: "POST /charter/experience-submissions/${sub_r}/references"
              payload: { referee_name: "Ref Two", referee_email: "ref2@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { refr2: $.data.id }
            - call: "POST /charter/experience-submissions/${sub_r}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/references/${refr1}/respond"
              payload: { decision: "VERIFIED" }
              as: ReferenceProvider
              as_user_id: "${refr1}"
            - call: "POST /charter/references/${refr2}/respond"
              payload: { decision: "VERIFIED" }
              as: ReferenceProvider
              as_user_id: "${refr2}"
            - call: "POST /charter/experience-submissions/${sub_r}/review"
              payload: { decision: "APPROVED" }
              as: ExperienceReviewer
            - *c_pcs_a
            - *c_award_a
            - *c_soc
            - call: "POST /charter/societies/${soc}/memberships"
              payload: { candidate_id: "${cand_a}", dues_payment_cents: 27500 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { mem_r: $.data.id }
            - call: "POST /charter/misconduct-cases"
              payload: { candidate_id: "${cand_a}", allegation: "Confirmed ethics violation", origin: "EXTERNAL_REPORT" }
              as: ConductInvestigator
              as_user_id: "inv-1"
              captures: { case_r: $.data.id, case_r_v: $.data.version }
          trigger:
            - call: "POST /charter/misconduct-cases/${case_r}/adjudicate"
              payload: { outcome: "SANCTIONED", sanction_type: "CHARTER_REVOCATION", expected_case_version: "${case_r_v}" }
              as: ConductAdjudicator
              as_user_id: "adj-1"
            - call: "GET /charter/candidates/${cand_a}"
              payload: {}
              as: ProgramAdmin
              captures: { rev_charter: $.data.charter_awarded, rev_standing: $.data.conduct_standing }
            - call: "GET /charter/memberships"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { mem_r_st: "$.data[0].status" }
            - call: "POST /charter/memberships/${mem_r}/renew"
              payload: { dues_payment_cents: 27500 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "after the revocation sanction: rev_charter == false and rev_standing == REVOKED"
            - "cascade: mem_r_st == TERMINATED (every ACTIVE membership of the candidate)"
            - "renewing the terminated membership is 409 ERR_INVALID_MEMBERSHIP_STATE"
            - "ProgramEnrollment.${enr_a}.status remains CHARTER_AWARDED (historical record) while the charter flag is gone"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: c_payment_response_immediately_reflects_enrolled
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/charter/program-enrollments/{enrollmentId}/payments
        excluded_because:
          difficulty_instance: booking_requires_enrolled_enrollment_arc
          rationale: "Immediate consistency is asserted there: the payment response itself carries status ENROLLED and the recomputed balances, and the very next booking call observes the new state without any delay or refresh endpoint."
