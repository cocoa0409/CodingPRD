scaffold_corner_design:
  - section: entities
    instances:
      - name: carrier_create_returns_envelope_and_every_declared_field
        claim_type: creation
        grounds:
          - entities.Carrier
          - endpoints[POST /carriers]
        distinguishing_aspect: "POST /carriers with all five input fields returns 201 in the success envelope with response_type object and every computed Carrier default materialised (status PENDING_DILIGENCE, watch_list_flag false, all four money/bps aggregates zero, last_approved_review_year null)."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Anchor Life", naic_code: "71001", am_best_rating: "A", statutory_surplus_usd: 1000000000.00, domicile_state: "IA" }
              as: PlatformAdmin
              captures: { carrier_anchor_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "the response body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Carrier.${carrier_anchor_id}.legal_name == Anchor Life and naic_code == 71001 and am_best_rating == A and statutory_surplus_usd == 1000000000.00 and domicile_state == IA"
            - "Carrier.${carrier_anchor_id}.status == PENDING_DILIGENCE"
            - "Carrier.${carrier_anchor_id}.watch_list_flag == false"
            - "Carrier.${carrier_anchor_id}.reserved_premium_usd == 0.00 and in_force_premium_usd == 0.00 and in_force_cash_value_usd == 0.00"
            - "Carrier.${carrier_anchor_id}.concentration_bps == 0 and regulatory_notice_count == 0"
            - "Carrier.${carrier_anchor_id}.last_approved_review_year == null"
            - "Carrier.${carrier_anchor_id}.version == 1"

      - name: carrier_get_returns_the_stored_entity_unchanged
        claim_type: retrieval
        grounds:
          - entities.Carrier
          - endpoints[GET /carriers/{id}]
        distinguishing_aspect: "GET /carriers/{id} returns exactly the field values POST /carriers stored, with version still 1 because no mutation has occurred."
        test_recipe:
          setup:
            - "One PENDING_DILIGENCE carrier created with statutory_surplus_usd 750000000.00."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Beacon Life", naic_code: "71002", am_best_rating: "A_MINUS", statutory_surplus_usd: 750000000.00, domicile_state: "NE" }
              as: PlatformAdmin
              captures: { carrier_beacon_id: $.data.id }
          trigger:
            - call: "GET /carriers/${carrier_beacon_id}"
              payload: {}
              as: RiskOfficer
          assert:
            - "trigger returns HTTP 200 with response_type == object"
            - "Carrier.${carrier_beacon_id}.legal_name == Beacon Life and am_best_rating == A_MINUS and statutory_surplus_usd == 750000000.00"
            - "Carrier.${carrier_beacon_id}.status == PENDING_DILIGENCE and version == 1"

      - name: carrier_list_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /carriers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /carriers returns response_type array with limit, offset, total_count and has_more; limit 2 over three carriers yields has_more true, and status=PENDING_DILIGENCE narrows total_count to the three unauthorized carriers."
        test_recipe:
          setup:
            - "Three PENDING_DILIGENCE carriers exist and nothing else."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Cove Life", naic_code: "71003", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "OR" }
              as: PlatformAdmin
              captures: { carrier_cove_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Delta Life", naic_code: "71004", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "AZ" }
              as: PlatformAdmin
              captures: { carrier_delta_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Ember Life", naic_code: "71005", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "NV" }
              as: PlatformAdmin
              captures: { carrier_ember_id: $.data.id }
          trigger:
            - call: "GET /carriers"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /carriers"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /carriers"
              payload: { status: "AUTHORIZED", limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "trigger call 1 returns HTTP 200, response_type == array, exactly 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "trigger call 2 returns exactly 1 row, total_count == 3, offset == 2 and has_more == false"
            - "trigger call 3 returns 0 rows with total_count == 0 and has_more == false"

      - name: carrier_get_with_unknown_id_returns_carrier_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CARRIER_NOT_FOUND]
          - validations[priority=5]
          - endpoints[GET /carriers/{id}]
        distinguishing_aspect: "GET /carriers/{id} for a well-formed UUID that was never minted returns ERR_CARRIER_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /carriers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RiskOfficer
          assert:
            - "trigger returns HTTP 404 with data.error_id == ERR_CARRIER_NOT_FOUND"
            - "the response carries response_type == error and a non-empty data.message"

      - name: product_type_create_missing_mec_status_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.ProductType.fields.mec_status
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "mec_status has source input and no default, so omitting it from POST /product-types returns ERR_INVALID_REQUEST (400) and creates no row."
        test_recipe:
          setup:
            - "One PENDING_DILIGENCE carrier exists."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Fjord Life", naic_code: "71006", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "MT" }
              as: PlatformAdmin
              captures: { carrier_fjord_id: $.data.id }
          trigger:
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_fjord_id}", product_name: "Fjord GA BOLI", account_type: "GENERAL", disclosed_me_charge_bps: 20, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
          assert:
            - "trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no ProductType row exists with product_name Fjord GA BOLI"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.NqdcPlan.fields.discount_rate_bps
          - entities.Employee.fields.officer_flag
          - entities.DeathBenefitClaim.fields.terminal_dividend_usd
        distinguishing_aspect: "Omitting discount_rate_bps on POST /nqdc-plans yields 500 and omitting officer_flag on POST /employees yields false — the declared defaults, not null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /nqdc-plans"
              payload: { plan_name: "Default Rate SERP", plan_type: "SERP" }
              as: TreasuryController
              captures: { plan_default_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Ines Roth", employee_number: "E-7101", annual_salary_usd: 300000.00 }
              as: BenefitsAnalyst
              captures: { emp_roth_id: $.data.id }
          assert:
            - "NqdcPlan.${plan_default_id}.discount_rate_bps == 500"
            - "NqdcPlan.${plan_default_id}.status == ACTIVE and accrual_liability_usd == 0.00 and pbo_liability_usd == 0.00 and matched_cash_value_usd == 0.00"
            - "NqdcPlan.${plan_default_id}.funded_ratio_bps == 10000 and funding_posture == FUNDED"
            - "Employee.${emp_roth_id}.officer_flag == false"
            - "Employee.${emp_roth_id}.insurable_interest_status == NOT_ESTABLISHED and employment_status == ACTIVE"

      - name: diligence_review_score_is_computed_and_client_values_are_ignored
        claim_type: computed_fields
        grounds:
          - entities.DiligenceReview.fields.financial_strength_score
          - calculations.carrier_financial_strength_score
          - endpoints[POST /diligence-reviews/{id}/submit]
        distinguishing_aspect: "financial_strength_score is source computed: a client-supplied value on POST /diligence-reviews is ignored and the score is derived at submit from the carrier's rating, surplus and concentration (A rating, 1500000000.00 surplus, concentration 0 -> 40 + 9 + 20 = 69)."
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00 (POST /diligence-reviews/{id}/submit requires one)."
            - "Carrier Granite: am_best_rating A -> rating_points 80, statutory_surplus_usd 1500000000.00 -> surplus_points 30, concentration_bps 0 -> concentration_points 100.0."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
              captures: { cap_gr_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Granite Life", naic_code: "71007", am_best_rating: "A", statutory_surplus_usd: 1500000000.00, domicile_state: "ID" }
              as: PlatformAdmin
              captures: { carrier_granite_id: $.data.id }
            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_granite_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_granite_id: $.data.id }
          trigger:
            - call: "POST /diligence-reviews/${rev_granite_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-9"
          assert:
            - "DiligenceReview.${rev_granite_id}.rating_points == 80"
            - "DiligenceReview.${rev_granite_id}.surplus_points == 30"
            - "DiligenceReview.${rev_granite_id}.concentration_points == 100.0"
            - "DiligenceReview.${rev_granite_id}.financial_strength_score == 69"
            - "DiligenceReview.${rev_granite_id}.status == UNDER_REVIEW"
            - "DiligenceReview.${rev_granite_id}.submitted_by_user_id == analyst-9"
            - "DiligenceReview.${rev_granite_id}.info_request_count == 0"

      - name: carrier_create_extra_field_input_ignored_for_system_fields
        claim_type: system_fields
        grounds:
          - entities.Carrier
          - endpoints[POST /carriers]
        distinguishing_aspect: "id, created_at, updated_at and version are common fields the server mints: a POST /carriers body carrying id, version and created_at values has them ignored, returning a fresh UUID with no type prefix, version 1 and created_at equal to the logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Harbor Life", naic_code: "71008", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "WA", id: "00000000-0000-0000-0000-000000000001", version: 99, created_at: "2020-01-01T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { carrier_harbor_id: $.data.id }
          assert:
            - "Carrier.${carrier_harbor_id}.id != 00000000-0000-0000-0000-000000000001"
            - "Carrier.${carrier_harbor_id}.id is a UUID with no type prefix"
            - "Carrier.${carrier_harbor_id}.version == 1"
            - "Carrier.${carrier_harbor_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "Carrier.${carrier_harbor_id}.updated_at == 2026-08-01T00:00:00.000Z"

      - name: product_type_account_type_rejects_an_undeclared_enum_member
        claim_type: type_constraints
        grounds:
          - entities.ProductType.fields.account_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "account_type is constrained to GENERAL, SEPARATE or HYBRID, so account_type MODIFIED_SEPARATE returns ERR_INVALID_REQUEST (400); a negative disclosed_me_charge_bps is rejected by the same rule."
        test_recipe:
          setup:
            - "One PENDING_DILIGENCE carrier exists."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Ivory Life", naic_code: "71009", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "UT" }
              as: PlatformAdmin
              captures: { carrier_ivory_id: $.data.id }
          trigger:
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_ivory_id}", product_name: "Ivory Bad Account", account_type: "MODIFIED_SEPARATE", mec_status: "NON_MEC", disclosed_me_charge_bps: 20, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_ivory_id}", product_name: "Ivory Negative Charge", account_type: "GENERAL", mec_status: "NON_MEC", disclosed_me_charge_bps: -5, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
          assert:
            - "trigger call 1 returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "trigger call 2 returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no ProductType row exists for carrier ${carrier_ivory_id}"

      - name: capital_position_is_immutable_with_no_version_and_no_write_back
        claim_type: immutability
        grounds:
          - entities.CapitalPosition
          - endpoints[GET /capital-positions/{id}]
        distinguishing_aspect: "CapitalPosition declares common_fields false, so its representation carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for it — a filed capital snapshot can only be superseded by filing a newer as_of_date."
        test_recipe:
          setup:
            - "Two CapitalPosition snapshots exist, 2026-03-31 and 2026-06-30."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-03-31T00:00:00Z", tier1_capital_usd: 900000000.00, total_assets_usd: 11000000000.00 }
              as: TreasuryController
              captures: { cap_q1_id: $.data.id }
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
              captures: { cap_q2_id: $.data.id }
          trigger:
            - call: "GET /capital-positions/${cap_q1_id}"
              payload: {}
              as: TreasuryController
          assert:
            - "trigger returns HTTP 200 with data.tier1_capital_usd == 900000000.00 and data.as_of_date == 2026-03-31T00:00:00Z"
            - "the response data object carries id and created_at but NO version field and NO updated_at field"
            - "data.recorded_by_user_id is the X-User-ID that filed the snapshot, not a client-supplied value"
            - "§1.5 declares no PUT, PATCH or DELETE on /capital-positions/{id}, so CapitalPosition.${cap_q1_id} can never be edited"
            - "the later snapshot CapitalPosition.${cap_q2_id}.tier1_capital_usd == 1000000000.00 is what purchase_capacity_headroom reads, by greatest as_of_date"

      - name: consent_record_create_with_unknown_employee_returns_employee_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ConsentRecord.parent
          - validations[priority=6]
          - errors[ERR_EMPLOYEE_NOT_FOUND]
        distinguishing_aspect: "ConsentRecord's parent is Employee, so POST /consent-records naming an employee_id that does not exist returns ERR_EMPLOYEE_NOT_FOUND (404) and stores nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /consent-records"
              payload: { employee_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-07-31T00:00:00Z", consent_form_reference: "CF-0000", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
          assert:
            - "trigger returns HTTP 404 with data.error_id == ERR_EMPLOYEE_NOT_FOUND"
            - "no ConsentRecord row exists with consent_form_reference CF-0000"

      - name: purchase_request_naming_another_carriers_product_returns_mismatch
        claim_type: graph
        grounds:
          - validations[priority=13]
          - errors[ERR_PRODUCT_CARRIER_MISMATCH]
          - endpoints[POST /purchase-requests]
        distinguishing_aspect: "The entity topology is a graph in which PolicyPurchaseRequest points at Carrier, ProductType and Employee independently, so the cross-reference integrity check must reject a request whose product_type_id belongs to a different carrier than its carrier_id with ERR_PRODUCT_CARRIER_MISMATCH (422)."
        test_recipe:
          setup:
            - "Two carriers, Juniper and Kestrel, each with one GENERAL product."
            - "One employee with salary 500000.00."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Juniper Life", naic_code: "71010", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "KS" }
              as: PlatformAdmin
              captures: { carrier_juniper_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Kestrel Life", naic_code: "71011", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "OK" }
              as: PlatformAdmin
              captures: { carrier_kestrel_id: $.data.id }
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_juniper_id}", product_name: "Juniper GA BOLI", account_type: "GENERAL", mec_status: "NON_MEC", disclosed_me_charge_bps: 20, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
              captures: { prod_juniper_id: $.data.id }
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_kestrel_id}", product_name: "Kestrel GA BOLI", account_type: "GENERAL", mec_status: "NON_MEC", disclosed_me_charge_bps: 20, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
              captures: { prod_kestrel_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Omar Vela", employee_number: "E-7201", annual_salary_usd: 500000.00 }
              as: BenefitsAnalyst
              captures: { emp_vela_id: $.data.id }
          trigger:
            - call: "POST /purchase-requests"
              payload: { carrier_id: "${carrier_juniper_id}", product_type_id: "${prod_kestrel_id}", employee_id: "${emp_vela_id}", single_premium_usd: 1000000.00, face_amount_usd: 3000000.00, requested_effective_date: "2026-08-15T00:00:00Z" }
              as: BenefitsAnalyst
            - call: "POST /purchase-requests"
              payload: { carrier_id: "${carrier_juniper_id}", product_type_id: "${prod_juniper_id}", employee_id: "${emp_vela_id}", single_premium_usd: 1000000.00, face_amount_usd: 3000000.00, requested_effective_date: "2026-08-15T00:00:00Z" }
              as: BenefitsAnalyst
              captures: { pr_juniper_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 with data.error_id == ERR_PRODUCT_CARRIER_MISMATCH"
            - "trigger call 2 returns HTTP 201 with PolicyPurchaseRequest.${pr_juniper_id}.status == DRAFT"
            - "PolicyPurchaseRequest.${pr_juniper_id}.reserved_premium_usd == 0.00 and notice_required == false"

  - section: state_machines
    instances:
      - name: diligence_review_starts_in_draft_with_zero_info_requests
        claim_type: initial_state
        grounds:
          - state_machines.DiligenceReview.initial_state
          - entities.DiligenceReview.fields.status
        distinguishing_aspect: "A freshly created DiligenceReview is in DRAFT with info_request_count 0 and no scoring fields decided yet, because the score is only computed on the DRAFT -> UNDER_REVIEW submit."
        test_recipe:
          setup:
            - "One PENDING_DILIGENCE carrier exists."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Lantern Life", naic_code: "71012", am_best_rating: "A_PLUS", statutory_surplus_usd: 400000000.00, domicile_state: "IN" }
              as: PlatformAdmin
              captures: { carrier_lantern_id: $.data.id }
          trigger:
            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_lantern_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_lantern_id: $.data.id }
          assert:
            - "trigger returns HTTP 201 with DiligenceReview.${rev_lantern_id}.status == DRAFT"
            - "DiligenceReview.${rev_lantern_id}.info_request_count == 0"
            - "DiligenceReview.${rev_lantern_id}.submitted_by_user_id == null and decided_by_user_id == null"
            - "Carrier.${carrier_lantern_id}.status == PENDING_DILIGENCE and last_approved_review_year == null"

      - name: review_submit_then_approve_authorizes_the_carrier
        claim_type: valid_transition
        grounds:
          - state_machines.DiligenceReview.UNDER_REVIEW_to_APPROVED
          - state_machines.Carrier.PENDING_DILIGENCE_to_AUTHORIZED
        excluded_because:
          difficulty_instance: boundary_precision_check / financial_strength_score_exactly_at_min_approval_score
          rationale: "The happy-path submit -> approve -> Carrier AUTHORIZED chain and its last_approved_review_year side effect are asserted as the passing half of the named §1.8 boundary instance."

      - name: approved_review_rejects_a_second_approve_as_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DiligenceReview.terminal_states
          - validations[priority=7]
          - errors[ERR_TERMINAL_STATE_LOCKED]
        distinguishing_aspect: "APPROVED is a terminal state of DiligenceReview, so a second approve returns ERR_TERMINAL_STATE_LOCKED (409) — the terminal check at priority 7 wins over the plain no-outgoing-transition check at priority 8 — and no side effect re-fires on the carrier."
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00."
            - "Carrier Mistral (A_PLUS, 400000000.00 surplus, concentration 0 -> score 65) with an APPROVED 2026 review."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
              captures: { cap_ms_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Mistral Life", naic_code: "71013", am_best_rating: "A_PLUS", statutory_surplus_usd: 400000000.00, domicile_state: "NM" }
              as: PlatformAdmin
              captures: { carrier_mistral_id: $.data.id }
            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_mistral_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_mistral_id: $.data.id }
            - call: "POST /diligence-reviews/${rev_mistral_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /diligence-reviews/${rev_mistral_id}/approve"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "GET /carriers/${carrier_mistral_id}"
              payload: {}
              as: RiskOfficer
              captures: { carrier_mistral_v_after_approve: $.data.version }
          trigger:
            - call: "POST /diligence-reviews/${rev_mistral_id}/approve"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-2"
            - call: "POST /diligence-reviews/${rev_mistral_id}/decline"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-2"
          assert:
            - "trigger call 1 returns HTTP 409 with data.error_id == ERR_TERMINAL_STATE_LOCKED"
            - "trigger call 2 returns HTTP 409 with data.error_id == ERR_TERMINAL_STATE_LOCKED"
