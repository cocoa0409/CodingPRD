  # ===========================================================================
  - section: validations
    instances:

      - name: a_second_forecast_line_for_the_same_product_and_daypart_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_37
          - errors.ERR_DUPLICATE_FORECAST_LINE
          - endpoints.POST_/bakery/bake-days/{bakeDayId}/forecast-lines
        distinguishing_aspect: "Uniqueness is on the (product_id, daypart) pair, not on the product: repeating MORNING for the same product is ERR_DUPLICATE_FORECAST_LINE (409) while the same product in MIDDAY is accepted alongside it."
        test_recipe:
          setup:
            - "DRAFT BakeDay on 2026-08-12 with one PAR-CROIS forecast line for MORNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10 }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${crois_id}", daypart: "MORNING", forecasted_units: 40 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
          trigger:
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${crois_id}", daypart: "MORNING", forecasted_units: 60 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_duplicate: $.data.error_id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${crois_id}", daypart: "MIDDAY", forecasted_units: 60 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
          assert:
            - "${e_duplicate} == ERR_DUPLICATE_FORECAST_LINE with HTTP 409"
            - "the MIDDAY call returns HTTP 200/201 and BakeDay.${bd_id}.forecast_lines holds exactly two entries"
            - "the surviving MORNING line still carries forecasted_units == 40 — the rejected write did not overwrite it"

      - name: sku_uniqueness_is_scoped_to_the_department_so_another_store_may_reuse_it
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_38
          - errors.ERR_DUPLICATE_SKU
          - endpoints.POST_/bakery/products
          - endpoints.POST_/bakery/ovens
        distinguishing_aspect: "The uniqueness scope is the department: re-posting sku PAR-CROIS (or oven name Deck Oven A) inside store 0041 is ERR_DUPLICATE_SKU (409), but the identical sku and oven name in store 0088 are accepted."
        test_recipe:
          setup:
            - "Two departments; store 0041 already owns product PAR-CROIS and oven Deck Oven A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_a: $.data.id }
            - call: "POST /bakery/departments"
              payload: { name: "Store 88 Bakery", store_number: "0088", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_b: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_a}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10 }
              as: RegionalAdmin
              captures: { crois_a_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_a}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20 }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
          trigger:
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_a}", sku: "PAR-CROIS", name: "Croissant Duplicate", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10 }
              as: RegionalAdmin
              captures: { e_dup_sku: $.data.error_id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_a}", name: "Deck Oven A", deck_count: 1, rack_capacity_per_deck: 4, changeover_buffer_minutes: 0 }
              as: RegionalAdmin
              captures: { e_dup_oven: $.data.error_id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_b}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10 }
              as: RegionalAdmin
              captures: { crois_b_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_b}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20 }
              as: RegionalAdmin
              captures: { oven_b_id: $.data.id }
          assert:
            - "${e_dup_sku} == ERR_DUPLICATE_SKU with HTTP 409 and ${e_dup_oven} == ERR_DUPLICATE_SKU with HTTP 409"
            - "Product.${crois_b_id} and Oven.${oven_b_id} are created under ${dept_b} with the same sku and name — the rule is satisfied because the scope differs"
            - "GET /bakery/products?department_id=${dept_a} returns total_count == 1 (still only ${crois_a_id})"
            - "GET /bakery/ovens?department_id=${dept_a} returns total_count == 1 (still only ${oven_a_id})"

      - name: attested_waste_may_equal_but_never_exceed_the_units_on_shelf
        claim_type: aggregate_validation
        grounds:
          - validations.priority_41
          - errors.ERR_WASTE_EXCEEDS_ON_SHELF
